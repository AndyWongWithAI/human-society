id: THEOREM-moral-third-party-enforcement
term: "道德第三方执行定理 (Moral Third-Party Enforcement Theorem)"
type: theorem
layer: L1-definitions

statement: |
  当一个规范同时满足以下两个条件时，未直接受害的旁观者将系统地
  愿意付出个人代价来惩罚违规者——即该规范获得第三方惩罚意愿、
  从而成为道德规范（满足 CONCEPT-morality(b) 的必要条件）。

  注意：两个条件是联合充分的（jointly sufficient），但可能不是
  联合必要的——不排除存在其他路径导致第三方惩罚（如文化传承中
  不加计算的规范复制）。本定理证明的是"最简演化路径"而非"唯一路径"。

  条件1（利益扩散）：该规范维护的合作结构产生的是扩散性利益
  （diffuse benefits）——合作盈余分散在多个 Agent 之间，
  而非仅限于直接交易双方。违规行为损害的不只是直接受害方，
  还包括所有从该合作结构中获益的旁观者。

  条件2（惩罚有效）：在演化时间尺度上，惩罚行为能以非零概率降低
  未来违规的发生率——即惩罚倾向在群体中被保留，而非被自然选择淘汰。
  这不要求每个旁观者在惩罚前计算有效性——只要求"在演化稳态中，
  惩罚倾向只在惩罚有效的条件下被保留"。无效惩罚的倾向（纯粹情绪宣泄）
  因浪费能量而被淘汰（PHY-002）。

  反之：如果一个规范的违反只损害直接受害方（利益不扩散），
  或旁观者的惩罚无法影响未来行为（惩罚无效），
  则该规范不会获得系统的第三方惩罚意愿——它停留在社会习俗
  或双边互惠规范的范畴。

negation_test: |
  否定本定理等于说：旁观者自掏腰包罚违规者，跟他在合作系统里有没有利益毫无关系。
  那这种耗能行为就成了纯浪费，按 PHY-002 应被演化淘汰——可它偏偏跨文化普遍存在；
  否定者必须另给一个不诉诸利益关联的解释，而任何"维护规矩对大家有好处"式的解释
  一出口就退回本定理。自指矛盾：否定者自己看到插队会不满，正是他否定的机制在他身上运行。
  代价：'路见不平'和'事不关己'的系统性差别变得无法谈论。

人话摘要: "一个人欺负另一个人，你没被欺负为什么会生气、甚至想出手管？因为这两人之间的规矩如果坏了，你也跟着倒霉——它维护的不只是他们两个之间的交易，而是一个你在里面也有份的合作系统。相反，如果一个规矩坏不坏跟你没关系（比方说隔壁村的人用手还是用筷子吃饭），你就不会花钱花力气去管。"

derivation: |
  from_axioms: [AXIOM-001, AXIOM-003]
  from_concepts: [CONCEPT-morality, CONCEPT-norm, CONCEPT-cooperation, CONCEPT-agent, CONCEPT-conflict]

  steps:
    1. "合作结构产生盈余——盈余的分配方式决定了谁有执行动机"
       合作（CONCEPT-cooperation：自愿协调产生互利结果）产生盈余——
       参与者获得的收益超过各自单独行动的收益。
       如果该盈余仅限于直接交易双方（如双边交换），
       则只有直接受害方有动机惩罚违约者——因为只有直接受害方
       在违约中受损。第三方没有受损，因此没有执行动机。
       但如果合作盈余是扩散的——例如公共品博弈（public goods game），
       或声誉系统中的间接互惠（indirect reciprocity）——
       则一个违规者的行为不仅损害直接受害方，
       还降低了所有从该合作结构中获益的 Agent 的预期收益。
       AXIOM-001：资源有限，竞争不可避免——
       这意味着合作结构的维持需要对抗搭便车压力。
       扩散性利益结构意味着搭便车的损害也是扩散的——
       每个从合作中获益的 Agent 都有利益牵涉其中。

    2. "扩散性利益 → 旁观者也是利益相关方"
       当合作盈余扩散到直接交易双方之外时，
       旁观者在结构上就是利益相关方（stakeholders），
       只是受损的因果链比直接受害方更长、更间接。
       "旁观者"不是真正的"无关第三方"——
       他们是"间接利益相关方"，其利益通过合作结构的中介
       与违规行为关联。
       这与 CONCEPT-morality(b) 中"未直接受害"的定义一致——
       旁观者未直接受害，但间接受损。

    3. "惩罚有效 → 付出代价的惩罚是理性策略"
       如果旁观者的惩罚行为以非零概率降低未来违规的发生率，
       且旁观者从合作结构中的预期长期收益大于单次惩罚的成本，
       则惩罚是演化上可行的策略（从个体的适应性角度）。
       惩罚的有效性可以通过：
       (i) 对违规者的威慑（违规者下次不敢再犯）；
       (ii) 对潜在模仿者的威慑（旁观者看到违规被罚→不模仿）；
       (iii) 声誉效应（惩罚者建立"不可欺负"的声誉→未来交易伙伴
            不敢违约——这是一个二阶利益）。
       如果惩罚完全无效（无法改变任何未来行为），
       则惩罚沦为纯粹的情绪宣泄——从演化角度是不稳定的，
       Agent 会被自然选择淘汰（浪费资源在无效行为上）。
       来自 PHY-002：执行消耗能量——只有能回收（通过降低未来违规率）
       的能量投入才是可持续的。

    4. "两个条件的合取 → 第三方惩罚意愿涌现"
       利益扩散确保旁观者有动机（"这事跟我有关"）。
       惩罚有效确保该动机能转化为实际行动（"管了有用"）。
       两者同时满足 → 旁观者系统地愿意付出代价惩罚违规者 →
       该规范满足 CONCEPT-morality(b) 的条件 → 成为道德规范。

    5. "条件缺失 → 第三方惩罚缺席"
       若利益不扩散（违规只损害直接受害方）：
       旁观者无动机，不惩罚。规范停留在互惠规范层面——
       只有受害方自己会追责。
       若惩罚无效（无论如何惩罚都无法降低未来违规率）：
       即使有动机，理性 Agent 也不会投入资源。规范可能停留在
       "私下不满"或"口头谴责"层面，但不形成真正的代价执行。

  corollary: |
    推论 1（第三方惩罚的边界）：一个规范引发的第三方惩罚意愿的
    强度与旁观者从该规范维护的合作结构中的利益占比正相关。
    利益占比越低，惩罚意愿越弱。这解释了为什么人们对"远方的
    不公"惩罚意愿弱于"身边的不公"——不是因为远方的不公不重要，
    而是因为旁观者从远方合作结构中的利益占比低。
    这也是道德群体边界（ingroup morality）的结构性来源之一。

    推论 2（第三方惩罚的规模限制）：扩散性合作结构的规模有上限——
    随着规模增大，每个旁观者的个人利益占比下降，
    惩罚的个体成本不变但个体收益递减。
    当个体收益低于个体成本时，第三方惩罚不再是个体层面的可持续策略，
    需要专门化执行机构（法律、警察）接管。
    这是 DED-016（面对面公平→制度化公平相变）所描述的逻辑
    在道德第三方执行领域的对应表现——DED-016 讲公平标准的执行相变，
    本推论讲道德规范的第三方执行相变，驱动量相同（规模稀释利益占比）。

