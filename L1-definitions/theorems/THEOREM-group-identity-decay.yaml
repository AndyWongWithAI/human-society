id: THEOREM-group-identity-decay
term: "群体身份衰减定理 (Group Identity Decay Theorem)"
type: theorem
layer: L1-definitions

statement: |
  群体的共享身份是一种信息结构——它存在于成员的认知中。
  按 AXIOM-002，信息无能量维护则必然衰减。因此，
  群体的身份凝聚力若没有持续的仪式、符号、叙事来刷新，
  将随时间退化——成员对"我们是谁"的共识模糊化，
  最终群体边界瓦解。

derivation: |
  from_axioms: [AXIOM-002]
  from_concepts: [CONCEPT-group, CONCEPT-information, CONCEPT-norm]

  steps:
    1. "群体身份是共享信息"
       CONCEPT-group(a): "共享身份——成员认同某种共同的标识"。
       这种共享身份不是物理实体——它是分布在多个成员认知中的
       信息模式。"我是 X 群体的一员"和"你也是 X 群体的一员"
       是一组必须被各成员分别持有且彼此知晓的信息。

    2. "共享信息服从 AXIOM-002"
       每个成员持有的身份信息编码在各自的物理记忆中。
       AXIOM-002: 信息无能量投入维护 ⇒ 必然衰减。
       衰减的表现：
       - 细节丢失（"我们的传统具体是什么来着？"）
       - 信念弱化（"我是 X 群体的人吗？越来越不在乎了"）
       - 成员间的一致性下降（"A 觉得 X 群体指的是 P，B 觉得是 Q"）

    3. "身份信息的维护需要持续的符号/仪式/叙事投入"
       对抗身份信息衰减的手段是定期刷新：
       - 仪式（ritual）：周期性集体行动——集会、庆典、礼拜——
         每次仪式重新激活并同步成员的身份信息
       - 符号（symbol）：持续存在的物理标记——旗帜、服饰、纹身——
         作为身份信息的持久提示
       - 叙事（narrative）：关于群体起源、历史、英雄的故事——
         以易于传播和记忆的形式存储身份信息

       这些维护手段都消耗能量——时间、注意力、物质资源 (PHY-002)。

    4. "维护不足 ⇒ 身份退化 ⇒ 群体边界模糊"
       如果维护能量投入不足：
       - 年轻成员的身份信息最薄弱（接收时间短、重复次数少）
       - 边缘成员的身份信息最先衰减（接触频率低）
       - 不同成员的身份认知漂移方向不同 → 共识瓦解
       - 最终："我们是谁"不再有共享答案 → 群体边界模糊 → 群体解体

  corollary: |
    散居群体（diaspora）面临更严峻的身份维护挑战——
    地理分散 (PHY-003-a) 降低了成员间的交互频率，
    而交互是共享信息刷新的主要机制。散居群体需要
    投入更多能量在远程符号和叙事上才能维持同等的身份凝聚力。

depends_on:
  axioms: [AXIOM-002]
  concepts: [CONCEPT-group, CONCEPT-information, CONCEPT-norm]
  l0_constraints: [PHY-001, PHY-002, PHY-003-a]

domain: [群体理论, 身份动力学]
created: 2026-07-13
