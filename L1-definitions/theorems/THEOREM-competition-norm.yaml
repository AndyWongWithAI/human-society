id: THEOREM-competition-norm
term: "竞争规范化定理 (Competition Normalization Theorem)"
type: theorem
layer: L1-definitions

statement: |
  当竞争者在同一环境中存在直接交互，且该交互重复发生时，
  约束竞争形式的共享规范必然涌现——竞争不会消失，
  但其表现形式从无约束对抗转向规则约束的竞争。

  scope: |
    本定理仅适用于竞争者之间存在直接交互的情况。
    间接竞争（两个 Agent 争夺同一资源但互不知晓，
    如 CONCEPT-competition(c) 所述）不触发规范涌现——
    没有交互就没有行为期望的形成基础。
    在此情况下，竞争保持原始的、无约束的形式。
人话摘要: "只要竞争的人反复碰面、彼此看得见，就会自发形成‘比赛该怎么打’的规矩——竞争不会消失，但会从没底线的乱斗变成守规则的较量；而彼此从不打交道的竞争者，则维持原始的乱抢。"

derivation: |
  from_axioms: [AXIOM-001, AXIOM-003]
  from_concepts: [CONCEPT-competition, CONCEPT-interaction, CONCEPT-norm]

  steps:
    1. "竞争 + 直接交互 ⇒ 竞争者在交互中彼此可观测"
       直接交互（CONCEPT-interaction(b)：A 的行动对 B 产生可观测效果）
       意味着竞争者在争夺资源的过程中能观察到对方的竞争行为。
       这不是竞争的必然特征（竞争可以在无交互情况下发生——
       CONCEPT-competition: "竞争 ⇏ 交互"），但一旦交互存在，
       竞争行为就成为可观测的交互事件。

    2. "重复交互 + 记忆 ⇒ 共享行为期望涌现 (AXIOM-003)"
       如果这些交互重复发生（资源是持续需要的，竞争是持续的），
       AXIOM-003 适用：重复交互 + 信息存储 → 共享行为期望必然涌现。
       竞争者开始形成关于"对方在竞争中会怎么做"的期望。

    3. "竞争者的行为期望 → 竞争规范"
       竞争者在重复交互中形成的期望包括：
       - 什么竞争行为是"常见的/预期的"
       - 什么竞争行为会引发对方的强烈回应（升级为冲突）
       - 什么竞争行为的代价最低（避免代价高的冲突升级）
       这些共享期望就是规范——约束竞争行为的社会规则。

    4. "竞争规范化 ≠ 竞争消失"
       AXIOM-001 断言竞争是逻辑必然，不能消除。
       规范改变的是竞争的形式——从暴力对抗到规则约束——
       但竞争本身持续存在。规范化后的竞争仍然是竞争。

  corollary: |
    竞争规范化的程度取决于交互的频率和持续性——
    交互越密集，共享期望越丰富，竞争形式越可预测。
    这产生了一个分化：
    - 直接交互频繁的竞争者之间 → 规则约束的竞争
    - 零交互的竞争者之间 → 原始的、无约束的资源夺取
    - 中间状态（偶尔交互）→ 薄弱规范，竞争形式不稳定

depends_on:
  axioms: [AXIOM-001, AXIOM-003]
  concepts: [CONCEPT-competition, CONCEPT-interaction, CONCEPT-norm]
  l0_constraints: [PHY-002, PHY-003-b]

domain: [竞争动力学, 规范涌现]
created: 2026-07-13
