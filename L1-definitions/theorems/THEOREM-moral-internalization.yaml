id: THEOREM-moral-internalization
term: "道德内化定理 (Moral Internalization Theorem)"
type: theorem
layer: L1-definitions

statement: |
  道德规范可以从外部制裁（他人惩罚）转化为内部制裁（自我惩罚情绪：
  内疚、羞耻；自我奖励情绪：自豪、自我认同强化）——这个过程称为
  "内化"（internalization）。内化成功后，Agent 在无旁观者、
  无外部惩罚风险的情况下仍然遵守规范。

  【推导部分:内化为什么会被演化选中】
  内化是 AXIOM-002（信息熵）和 PHY-002（能量约束）的推论：
  持续的外部行为监控在能量上是昂贵的——每个 Agent 的行为都需要
  其他 Agent 消耗能量来观察、判断和执行。内化将监控和执行成本
  从群体（外部）转移到个体（内部），显著降低了规范维持的总能量消耗。
  在演化时间尺度上，能内化规范的群体比纯靠外部监控的群体
  具有能量效率优势——内化倾向因此被选中。

  【经验部分:内化在什么条件下发生】
  以下条件来自经验科学的独立发现（非从公理推导），
  由 BR-L2-019 桥接提供证据：
  P1. 安全依恋发育窗口——Agent 在发育期内必须经历稳定的照顾关系，
      使其能够形成"世界是可预测的、他人是可靠的"的基本信任。
      无此窗口 → 内化能力在神经基础上受损。
  P2. 对等性信号——Agent 必须持续感知到群体中的其他成员也在
      遵守和执行同一规范。如果 Agent 反复观察到他人违规而无后果，
      对等性信号断裂 → 内化开始瓦解。
  P3. 规范稳定性——规范的内容在 Agent 的发育期内必须保持大体稳定。
      频繁变更的规范无法被内化——内化依赖重复暴露形成自动化情绪反应。

  注意：P1-P3 是经验条件而非推导结果。AXIOM-002+PHY-002 解释了
  为什么内化会被选中，但不解释内化的个体发育前提——
  后者来自发展心理学和认知神经科学的独立证据。

  内化瓦解的动态:
  内化瓦解遵循"剥洋葱"模式而非"开关"模式：
  - 第一层（合理化）: "别人也不守，我守一次没关系"
  - 第二层（比较）: "我守了但别人不守，我吃亏了"
  - 第三层（认知重组）: "这个规矩本来就不合理"
  - 第四层（情绪脱钩）: 违规不再触发内疚/羞耻

  一旦达到第四层，内化已结构性瓦解。此时重建内化需要：
  (i) 重新建立对等性信号（证明"这次大家是真的都在守"）；
  (ii) 比初次建立更长的稳定暴露期（因为 Agent 已学到"这个规范
      可以被违反而无后果"——这个记忆不会消失，只会被新的
      对等性经验覆盖）；
  (iii) 可能需要外部强制作为过渡（先用外部惩罚建立行为规律，
      再逐渐内化——但这有风险：外部强制太强可能反而阻止内化，
      因为 Agent 将遵守归因于外部强制而非内在价值）。

人话摘要: "人为什么会'心里过不去'？因为一直靠别人盯着你太贵了——进化给每个人装了个免费的'内部警察'。但这个内部警察不是白来的：需要小时候被好好养大、看到别人也在守规矩、规矩本身不能三天两头变。最要命的是，一旦你觉得'别人都不守凭什么我守'，这个内部警察就下班了，而且想再请回来比第一次难得多。"

derivation: |
  from_axioms: [AXIOM-002]
  from_concepts: [CONCEPT-morality, CONCEPT-norm, CONCEPT-agent]

  steps:
    1. "外部监控是昂贵的（AXIOM-002 + PHY-002）"
       规范维持需要执行——检测违规 + 施加惩罚。
       如果完全依赖外部执行，每个 Agent 的每次行为都需要被其他
       Agent 观察、判断和回应。随着群体规模增长，监控和执行的
       总能量消耗增长速度快于线性增长——因为不仅被监控的 Agent 数量
       增加，每个违规事件的惩罚协调成本也随之上升。
       AXIOM-002：信息不维护则衰减——他人对"谁守规矩/谁不守"
       的观察信息需要持续能量投入来维持。
       PHY-002：执行规范消耗能量——体罚、排斥、制裁都消耗
       Agent 的有限时间/精力/资源。

    2. "内化降低监控成本——从外部监督到自我监督"
       如果规范被内化——Agent 自己监控自己——监控成本从
       "他者监控行为者"部分转变为"行为者监控自己"。
       外部监控仍需要（作为内化的对等性信号来源和后备），
       但频率和强度可以大幅降低。
       每个 Agent 自带内部警察，群体总监控成本显著下降。

    3. "P1-P3 是经验条件——内化机制的个体层面的实现前提"
       P1（安全依恋窗口）：来自发展心理学的独立发现——
       大脑的情绪学习回路在发育窗口期对社交信号特别敏感。
       无安全依恋 → 社交奖励/惩罚信号无法有效编码 →
       内化的神经基础设施缺失。这是经验条件，非从公理推导。
       P2（对等性信号）：内化本质上是 Agent 将外部统计规律
       （"这种事通常会被罚"）压缩为内部启发式（"这事是错的"）。
       如果外部统计规律解体（违规不再被罚），启发式失去数据支撑。
       这是步骤2（能量效率）在个体维持层面的表现。
       P3（规范稳定性）：频繁变更的信号无法被统计学习系统
       可靠编码——需要重复暴露来形成自动化反应。
       这是 AXIOM-002 在个体学习层面的表现。

    4. "内化瓦解的剥洋葱结构与重建困难"
       瓦解过程经历了认知保护层的逐层剥落——Agent 不是在
       "守/不守"之间一次跳变，而是在合理化、比较、认知重组、
       情绪脱钩四个阶段中逐步拆解原来的内部结构。
       重建困难来自：
       (i) 已存储的反面记忆（"这规范有被违反而无后果的先例"）
          与 AXIOM-002 一致——信息一旦进入系统就不会自动消失；
       (ii) Agent 学会了"违规可合理化"的认知策略——可以复用；
       (iii) 对等性信号的可信度被永久折损——"上次你们说大家都守，
          后来发现不是。这次凭什么信？"

  corollary: |
    推论 1（内化不对称）：内化的建立速率远慢于瓦解速率。
    建立需要反复的稳定暴露（月/年级），瓦解可以在数次观察到
    对等性断裂后触发（天/周级）。这产生了一个策略意义：
    维护既有内化比修复瓦解的内化便宜得多——
    预防对等性信号断裂是关键。

    推论 2（代际道德变迁）：如果社会条件使一代人在发育窗口期
    接收的对等性信号与上一代显著不同，该代人的内化内容将系统性地
    不同于上一代。这不意味着"道德沦丧"（老一代的判断）或
    "道德进步"（新一代的判断）——而是内化机制的必然输出：
    不同的对等性信号 → 不同的内化内容。

    推论 3（强制与内化的双向关系）：外部强制与内化之间存在双向因果。
    正向：外部强制为内化提供"安全网"——当个体知道违规必被罚时，
    内化的对等性信号(P2)得到增强 → 促进内化。
    反向（挤出效应）：如果外部强制过强且持久，Agent 将遵守归因于
    外部强制而非内在价值 → 阻碍内化——"因为警察抓我才不偷"和
    "因为偷窃是错的所以我不偷"是两种不同的认知状态，
    前者不是内化。
    净效应取决于外部强制的强度和持续时间：低-中强度短期强制 → 净正向
    （提供对等性信号而不挤出归因）；高强度长期强制 → 净负向
    （挤出归因超过对等性信号收益）。阈值因个体差异（依恋历史等）和
    文化差异（对权威的信任度等）而异。

