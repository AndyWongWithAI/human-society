revision_note: "对抗审后重大修正：(1)公式从 V=U×S×E 改为 V=(U+E_network)×S——U和E_network是独立加数路径，S是公共乘数；(2)消除了U=0⇒V=0的矛盾（原公式下金和法币无法解释）；(3)新增operationalization节给出三个因子的独立测量路径；(4)S的下界保留≥1但更清楚地解释了S=1时'价值'的语义；(5)E_network不再设≥1下界——可以为0"
