id: THEOREM-value-attribution
term: "价值归属定理 (Value Attribution Theorem)"
type: theorem
layer: L1-definitions

statement: |
  资源 X 对 Agent A 的价值由两个独立来源和一个公共乘数构成：

  V(X, A) = [U(X, A) + E_network(X, A)] × S(X)

  其中：
  - U(X, A) = X 对 A 的直接使用价值——X 缩小 A 的目标-现状差距的能力。
    这是价值的"独享路径"：不需要任何其他人参与，X 对 A 就有用。
  - E_network(X, A) = X 对 A 的交换网络价值——A 预期通过将 X 交换出去
    能获得的资源的价值。E_network 来自 A 对"其他 Agent 愿意为 X 付出什么"
    的估计。这个估计本身递归地依赖于那些 Agent 的 U 和 E_network——
    形成了价值的"网络路径"。
  - S(X) = 稀缺性乘数——X 在 A 所在群体中的多 Agent 竞争程度（S ≥ 1）。
    S = 1 表示不存在任何竞争（人人有充足获取途径），
    S > 1 表示存在竞争，稀缺程度越高 S 越大。

  两条路径（U 和 E_network）是加数关系——各自独立贡献价值，
  互不依赖。稀缺性 S 是公共乘数——同时放大两条路径的贡献。

  关键：E_network 具有自我强化的正反馈结构：
  E_network 上升 → V 上升 → 更多人愿意持有 X → 更多人接受 X
  → E_network 进一步上升。这个循环没有内生上限——
  它可以一直跑到群体中的每个人都在使用 X 作为交换媒介为止。

人话摘要: "一个东西对你有多值钱，取决于两条路加在一起再乘以稀缺度——第一条路是这东西对你自己有用（使用价值），第二条路是别人愿意为它付出什么（交换网络价值）。金为什么值钱？第一条路几乎为零——金不能吃不能用——但第二条路宽得像高速公路：所有人都收金，所以你也收金，因为你知道下一个人也会收。稀缺性（金在地壳里就那么点）再把这两条路的价值一起放大。三条线各自独立变动——这就是金价波动的三个一级来源。"

derivation: |
  from_axioms: [AXIOM-001, AXIOM-003]
  from_concepts: [CONCEPT-value, CONCEPT-resource, CONCEPT-goal, CONCEPT-agent, CONCEPT-exchange, CONCEPT-competition, CONCEPT-choice]

  steps:
    1. "直接使用价值 U(X, A) 的来源"
       CONCEPT-resource(a): 资源的工具性——资源的价值在于它能促成目标达成。
       CONCEPT-goal: Agent 有目标层次——最优先的目标先被满足。
       ⇒ U(X, A) = X 能缩小 A 的哪个优先级的目标-现状差距。
       这是价值的第一条路径——不需要交换，不需要其他人，
       X 对 A 自身就有用。

       边缘情况：如果 X 对 A 完全没有任何目标相关性（U = 0），
       这条路径贡献为零——但 V 不一定为零，因为 E_network 路径仍然可以
       独立贡献价值。这就是金和法币的逻辑：U ≈ 0 但 E_network >> 0。

    2. "交换网络价值 E_network(X, A) 的来源"
       CONCEPT-exchange: 交换是自愿的双向资源转让。
       在延时交换（CONCEPT-exchange 特征(e)）中，A 现在给出 Z，
       预期 B 将来回报。A 可以选择接受什么作为 B 的回报——
       如果 A 预期某种特定的 X 在未来也能被其他人接受，
       A 会更愿意接受 X（而不是其他物品）作为回报。

       ⇒ E_network(X, A) = A 预期自己将来可以用 X 从 C、D、E...
       处换到的资源的价值。这个预期本质上是递归的——
       A 对 X 的 E_network 取决于 A 认为 B、C、D... 对 X 的
       U + E_network 是多少。这个递归结构使 E_network 可以
       在 U ≈ 0 的情况下独立达到很高——只要每个人都相信
       其他每个人都会接受 X。

       AXIOM-003: 重复交互 → 规范涌现（含"哪些物品被广泛接受"的共享预期）。
       这个共享预期本身是一个规范——"在咱这群人里，X 能当钱用"。
       与任何规范一样，这个预期不需要任何人"设计"，它从反复
       双边交换中涌现——交易者发现接受 X 比接受 Y 更省事
       （因为 X 更容易在下一次交易中花出去），从而更多地接受 X →
       X 的 E_network 上升 → 更多人接受 X → 循环。

    3. "稀缺性乘数 S(X) 的来源"
       AXIOM-001: 有限资源 + 多 Agent → 竞争。
       CONCEPT-competition: 多 Agent 对同一有限资源有互斥需求。
       ⇒ S(X) ≥ 1。S = 1 当不存在任何竞争时（资源对所有人充足可用）。
       S > 1 当存在竞争时——随竞争者数量和竞争强度单调上升。

       S 是公共乘数——它同时放大 U 路径和 E_network 路径：
       - S 放大 U：即使 X 对你个人很有用（U 高），如果没有任何稀缺性
         （S = 1），你不需要为获取 X 而放弃任何东西 → V = (U + E_network) × 1
         = U + E_network。但此时 U 贡献的"价值"不体现为你愿意放弃的代价——
         因为你可以免费获得 X。这就是空气的逻辑：U 很高、S = 1、
         E_network ≈ 0 → V = U。但因为你不需要为空气放弃任何东西，
         空气的"价值"虽大却不表现为"代价"——这揭示了
         "重要性"和"价值（= 愿意付出的代价）"的区别。
       - S 放大 E_network：同样的交换网络接受度，在稀缺的条件下会产生
         更高的价值。金和银都是被广泛接受的——但金更稀缺（S 更大）→
         金比银更"值钱"。

       PHY-002: 能量的有限性 → S 有实际上限——Agent 愿意为获取 X
       付出的代价不可能超过其可支配能量总量。
       PHY-003-c: 地理不均匀 → S 在空间上非均匀——
       资源富集区 S 低，资源缺乏区 S 高。

    4. "为什么是 (U + E_network) × S 这个结构"
       三个边界条件共同约束了结构形式：

       (i) U 和 E_network 必须各自能独立贡献——
       金和法币在 U ≈ 0 时仍有高价值（E_network 独立支撑），
       自给自足社会中的工具在 E_network = 0 时仍有价值（U 独立支撑）。
       这意味着 U 和 E_network 是加数关系（两条独立路径），
       不是乘数关系（乘数关系下 U = 0 ⇒ V = 0，与金/法币矛盾）。

       (ii) S 必须同时放大两条路径——
       金的稀缺性既放大其直接使用价值（金饰）也放大其交换网络价值（金条）；
       法币的超发（S 下降）同时降低其直接使用价值（贬值后买的东西少了）
       和交换网络价值（别人开始拒收）。这意味着 S 是公共乘数而非
       仅附着于某一条路径。

       (iii) 三个因子必须独立变动——
       U 由 Agent 的目标结构和 X 的物理属性决定；
       E_network 由交换网络的共享预期决定；
       S 由供给端和竞争者数量决定。
       三者由不同的因果机制驱动，可以在不同时间尺度上独立变动。
       如果三者总是共变（无独立变动实例），则分解是伪分解。

    5. "E_network 的正反馈与上限"
       E_network 的正反馈循环（步骤2）可以使其跑到远超 U 的水平——
       这就是金的价值谜题的 L1 答案：U ≈ 0 但 E_network >> 0 且 S >> 1，
       所以 V 很高。

       但这个正反馈没有内生上限的声称有一个重要的外生约束：
       E_network 依赖于交换网络的物理连通性。如果交换网络
       被物理空间分割（PHY-003-c）或被制度分割（不同法律区域），
       E_network 的上限被该子网络内的总经济规模约束。

       此外，E_network 的正反馈是双向的——崩塌也可以自我放大
       （见推论 3）。崩塌的速率可以远快于建立——因为建立需要
       反复双边交换积累共享预期（AXIOM-003 的缓慢涌现），
       而崩塌可以在一次共识逆转中完成（"大家突然都不收 X 了"）。

  operationalization: |
    定理的操作化——三个因子的独立测量路径：

    U(X, A) 的测量:
    - 在无交换可能的场景中（隔离实验/独居场景），观察 A 为获取 X
      愿意消耗的能量/时间/风险
    - 在交换存在但 X 的 E_network ≈ 0 的场景中（X 是"没人会收"的东西），
      观察 A 为获取 X 愿意付出的其他资源——此时 V ≈ U × S，
      U = V / S
    - 局限性：纯 U 难以在交换普遍存在的社会中独立测量——
      E_network 几乎总为正。需要边缘案例（孤立的收藏家、
      完全非流通的个人物品）来逼近

    E_network(X) 的测量:
    - 市场深度：X 的 bid-ask 价差——价差越小，E_network 越高
      （更多人愿意在接近的价格上交易 X）
    - 接受率：在随机抽取的 Agent 中，愿意接受 X 作为支付手段的比例
    - 流通速度：X 在单位时间内转手的次数（需要 U 近似为零时才能
      将流通速度完全归因于 E_network——否则 U 驱动的交易混淆测量）
    - 局限性：E_network 和 U 在 U > 0 时难以精确分离——
      某人接受金可能是因为金的装饰用途（U）而非预期转手（E_network）。
      需通过控制场景分离（如：纯金条 vs 金饰，前者 U ≈ 0 → 价格 = E_network × S）

    S(X) 的测量:
    - 储量/年产量比（存量-流量比）：越高 → S 越大
    - 竞争者数量 × 竞争强度（可观察的获取行为冲突频率）
    - 价格弹性：供给对价格变动的响应越无弹性 → S 在需求变动时
      对 V 的放大效应越强
    - 局限性：S 是相对于特定群体的——金在地球上总体稀缺，
      但对某个金矿主来说 S 可能暂时较低（他有库存）

  corollary: |
    推论 1（价值漂移）：由于 U、E_network、S 独立变动，同一资源 X 的
    价值可以在不同时间、不同群体间漂移——即使 X 的物理属性没有变化。
    这意味着"价值"不能从资源本身的物理属性读出——
    它是关系属性，随 Agent 的目标（U）、交换网络的共享预期（E_network）、
    和群体竞争结构（S）而变化。

    推论 2（一般等价物涌现的必然性与偶然性）：在存在多商品、多 Agent
    的反复交换网络中，E_network 的正反馈循环必然导致至少一种商品
    的 E_network >> U——即必然涌现出一般等价物（其价值主要由
    交换网络路径而非直接使用路径驱动）。但具体哪种商品胜出，
    取决于初始条件（哪种商品在局部环境中 U 或 S 更高）和路径依赖
    （早期被偶然选中→E_network 自我强化）。"金成为全球一般等价物"
    不是物理必然，但"某种商品成为一般等价物"是交换网络的结构必然。

    推论 3（E_network 的双向崩塌）：E_network 的正反馈是双向的——
    如果某种冲击使 E_network 开始下降（例如关键持有者开始抛售、
    或替代媒介的 E_network 开始上升），正反馈反向运转：
    E_network 下降 → V 下降 → 持有者抛售 → E_network 进一步下降。
    崩塌速度可以远快于建立速度——建立需要反复双边交换来积累
    共享预期（AXIOM-003 的缓慢涌现），崩塌可以在一次共识逆转中完成。

    推论 4（多媒介并存的条件）：E_network 的正反馈倾向于让一种媒介
    完全胜出（网络效应的 winner-take-all 动力学）。
    但多媒介并存可以在以下条件下持续：
    (i) 交换网络被物理空间分割（PHY-003-c 地理不均匀→
    不同区域的 E_network 集中在不同商品上——旧大陆用金、岛国用贝币）；
    (ii) 不同媒介服务于不同交换规模（日常交易 E_network 集中在铜币、
    大额储藏 E_network 集中在金、远程贸易 E_network 集中在银票）；
    (iii) 法律/制度强制分离交换网络（"这个市场只收这种钱"）。

