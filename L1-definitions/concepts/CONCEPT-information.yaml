id: CONCEPT-information
term: "信息 (Information)"
人话摘要: "'信息'指关于世界某个情况的、可以传给别人的表示(比如'烟'代表'有火'),它帮主体减少不确定、做出更好的判断;信息必须依附在某种物理载体上(大脑、纸、信号),所以会传丢、会衰减。"
definition: |
  关于环境状态或事件的可传递的表示——一个 Agent 可以用来
  减少不确定性并改善决策质量的东西。

  必要特征:
  (a) 表征性——信息指向自身以外的某事态。它不是独立的物质，
      而是关于某物的表示（"烟指向火"）
  (b) 物理载体——信息总是附着在某种物理基质上：
      神经元连接、纸上的墨迹、空气中的声波、电磁信号。
      不存在"游离的"信息
  (c) 可传递——信息可以从一个载体/位置流向另一个
      （受 PHY-003-a 约束：传递有速度上限）
  (d) 可衰减——信息在存储和传递中会退化
      （受 PHY-001 约束：信息熵增——无维护则信息丢失）
  (e) 工具性——信息不能直接满足目标（不是食物），但它帮助 Agent
      做出更好的选择 ⇒ 信息是一种资源（CONCEPT-resource 的信息性子类）

  信息与相关概念的区分:
  - 信息 vs 知识: 知识是 Agent 内部存储的信息（信息在 Agent 内部的驻留）
  - 信息 vs 信号: 信号是信息的物理载体（信息是内容，信号是载体）
  - 信息 vs 数据: 数据是编码后的信息（信息是语义，数据是语法）

  信息不预设:
  - 正确性（错误信息仍然是信息——它仍然指向某事态，只是指向是错的）
  - 意识性（信息可以存在于无意识的物理痕迹中——脚印指向有人走过）
  - 数字化（模拟信号承载信息，不必须是数字的）
  - 接收者（信息可以存在但不被任何 Agent 读取——树皮上的刻痕是信息）

logical_implications:
  - "信息 ⇒ 存在物理载体"                      # 从 (b)
  - "信息在传递中会衰减/失真"                    # 从 (d) + PHY-001
  - "信息传递有延迟"                             # 从 (c) + PHY-003-a
  - "Agent 拥有信息 ⇒ Agent 能做出更准确的选择"   # 从 (e) + CONCEPT-choice
  - "信息是资源的一种"                             # 从 (e) + CONCEPT-resource
  - "Agent 感知 ⇒ Agent 获取信息"                # 从 CONCEPT-agent(b)
  - "存储信息需要持续能量来维护"                  # PHY-001 + PHY-002

domain: [基础概念]
depends_on: [CONCEPT-agent, CONCEPT-resource]
l0_constraints:
  - PHY-001: "信息熵——信息在无维护的存储和传递中自然衰减。维持信息需要能量"
  - PHY-002: "信息的存储和处理消耗能量——记忆、计算、通信都有能量成本"
  - PHY-003-a: "信息传递速度有上限（光速）——远距离通信必有延迟"
created: 2026-07-13
