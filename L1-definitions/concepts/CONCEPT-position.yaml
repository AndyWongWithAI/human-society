id: CONCEPT-position
term: "立场 (Position)"
definition: |
  Agent 在面对一个涉及多 Agent 利益的具体议题时，
  由自身目标所决定的取向——支持哪种结果、反对哪种结果。

  必要特征:
  (a) 议题锚定——立场附着于具体议题。同一 Agent 在不同议题上
      可以持有不同立场（A 支持一起捕猎但反对共享猎物）
  (b) 目标导出的——立场不是任意的，它从 Agent 的目标中导出。
      知道 Agent 的目标 + 议题的利害结构 → 可以推断其立场
  (c) 可比较——不同 Agent 的立场可以被比较：一致、相反、相邻、
      无交集。这是结盟和对立的逻辑基础
  (d) 可变化——Agent 的目标变、新信息出现、或议题的利害结构变化
      → 立场可以跟着变化。立场不是身份

  立场不预设:
  - 显式表达（Agent 可以持有立场而不说出来）
  - 稳定性（立场随目标和信息变化）
  - 道德维度（立场描述"Agent 支持什么"，不评价"应该支持什么"）
  - 意识性（Agent 自己可能不清楚自己的立场但它仍然存在）

  立场与相关概念的区分:
  - 目标 = Agent 想要达成的状态（内在的）
  - 立场 = Agent 在一个涉及多方利益的议题上的取向（关系性的）
  - 策略 = Agent 为实现目标而选取的行动方案（操作性的）
  - 利益 = 议题结果对 Agent 目标的影响程度（立场的基础）

logical_implications:
  - "Agent 有目标 + 议题涉及目标 ⇒ Agent 有立场"    # 不是可选的——立场被目标决定
  - "立场一致 ⇒ 合作的潜在基础"                     # 为后续公理留接口
  - "立场相反 ⇒ 竞争的潜在基础"                     # 基于目标的冲突
  - "改变立场 ⇏ 改变目标"                          # 可能只是对议题的新理解
  - "多 Agent 多议题 ⇒ 立场网络"                    # 为群体和联盟留接口

domain: [基础概念]
depends_on: [CONCEPT-agent, CONCEPT-goal, CONCEPT-competition, CONCEPT-cooperation, CONCEPT-information]
l0_constraints:
  - PHY-002: "Agent 的能量/资源约束限定了其可以持有的立场范围——不切实际的立场（需要远超自身资源的投入）会被淘汰"
  - PHY-003-c: "地理不均匀 ⇒ 不同位置的 Agent 对同一议题有不同利害——'立场取决于你站在哪里'"
created: 2026-07-13
