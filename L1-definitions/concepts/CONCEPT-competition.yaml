id: CONCEPT-competition
term: "竞争 (Competition)"
人话摘要: "'竞争'指两个以上的主体都想要同一份不够分的资源,一方多拿另一方就少拿;它不需要双方认识、也不用真吵起来,只要资源有限、大家都要,竞争就客观存在。"
definition: |
  两个及以上 Agent 对同一有限资源存在互不相容的需求——
  Agent A 获取该资源将减少 Agent B 获取该资源的可能。

  必要特征:
  (a) 资源有限——如果资源无限充足（相对于所有需求），竞争不存在
  (b) 目标交集——至少两个 Agent 的目标在同一个有限资源上汇合
  (c) 互不相容——一方获取意味着另一方少获取或无法获取。
      这不是知觉问题——即使 Agent 不知道对方存在，竞争仍然发生
      （如两个食草动物吃同一片草，彼此从未看见对方）

  竞争不预设:
  - 直接对抗（竞争可以是间接的——各自试图获取同一资源）
  - 意图性（Agent 可以"在竞争中"而不自知）
  - 暴力（竞争可以在规则框架内进行）
  - 负和（竞争可以是正和的——双方都比不参与更好——但仍然是竞争）

  与"冲突"的区分（先定义）:
  - 竞争是关于资源的相容性——目标在资源上交汇
  - 冲突可能由竞争引发，但也可以来自非资源原因

logical_implications:
  - "竞争 ⇒ 资源有限 (PHY-002) ∧ ≥2 Agent"         # 从 (a)+(b)
  - "竞争 ⇒ 至少一方无法完全实现其目标"             # 从 (c)
  - "竞争是资源有限 + 多 Agent 的逻辑必然"          # 不是偶然的
  - "竞争 ⇏ 交互"                                  # 竞争可以无交互发生

domain: [基础概念]
depends_on: [CONCEPT-agent, CONCEPT-goal, CONCEPT-resource]
l0_constraints:
  - PHY-002: "资源的有限性（能量守恒）⇒ 竞争不可能被完全消除——只要资源有限+多 Agent，竞争必然存在"
  - PHY-003-b: "空间的排他性 ⇒ 领土是天然的竞争对象——两个人不能同时占据同一块地"
  - PHY-003-c: "资源地理分布不均 ⇒ 不同位置的 Agent 面临不同的竞争压力"
created: 2026-07-13
