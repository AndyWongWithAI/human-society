id: CONCEPT-measurement-independence
term: "测量独立性 (Measurement Independence)"
人话摘要: "两个数据点是不是各自独立测量出来的——不由'几个机构发布了数据'决定,而由'它们的测量链从哪一步开始分叉'决定。同一份底稿由不同出版社各印一版,不等于两份独立证据。"
definition: |
  两个数据点 A 和 B 的测量独立性不由发布机构数量决定,
  而由它们的底层测量链是否【分叉】决定。

  定义:
  - 测量链 (measurement chain): 从原始观测到最终发布值的完整数据加工路径,
    包括:原始数据采集 → 逐级汇总 → 口径调整 → 机构发布
  - 分叉 (fork): 两条测量链在某个环节使用了【不同的原始观测源】
    （不同的仪器、不同的抽样、不同的物理量）
  - 同根 (common root): 两条测量链共享同一套原始观测源,
    只在后续加工/发布环节分道

  判定规则:
  (a) 若 A 和 B 的测量链分叉 → 彼此独立,独立系数取决于分叉的深度与方法差异
  (b) 若 A 和 B 同根 → 彼此独立系数 ≤0.1（仅有加工/口径层面的微弱独立性）
  (c) 若 A 是原始源、B 以 A 的发布值为输入 → B 对 A 的独立系数 ≈0

  实例:
  - CNBS GDP ← 中国国家统计局自己的原始采集和逐级汇总
  - World Bank GDP ← 以 CNBS 发布值为输入,做口径标准化后重新发布
  - IMF GDP ← 同上
  → CNBS 是原始源;WB 和 IMF 彼此同根,且对 CNBS 无独立性

  真正独立的验证:
  - 卫星夜间灯光 ← 独立物理测量,不经过任何统计上报链
  - 用电量/铁路货运量 ← 电网/铁路系统的独立运行数据
  - 税务发票汇总 ← 税务系统的独立行政数据
  → 这些与 CNBS GDP 的测量链在原始采集层就分叉了

negation_test: |
  否定本概念就等于断言:
  "只要不同机构发布了同一指标的数据,就算多源独立验证"
  这意味着:
  - 同一份底稿由 100 个出版社各印一版 = 100 重独立验证
  - 一份造假的原始数据被所有国际机构引用 = 所有机构都"独立确认"了该数据
  这是荒谬的——它使得任何数据只要被足够多机构复述,就能获得任意高的"独立验证"票数,
  完全绕过了测量链是否真正分叉这个唯一有意义的问题。

  因此,否定本概念会使得"多源验证"这个概念本身失去认识论意义。
  本概念是分析性真理:它的真值来自"独立"这个词在测量语境中的正确定义,
  而非来自经验观察。

logical_implications:
  - "两机构发布同一指标 ⇒ 不保证测量独立"       # 从 (b)(c)
  - "测量独立 ⇔ 底层测量链在原始采集层分叉"      # 从 (a)
  - "同根多源 ≠ 独立多源"                         # 从 (b)
  - "独立验证需要异源数据(不同物理量/不同采集链)" # 从 (a)

domain: [基础概念, 认识论, 方法论]
subconcept_of: CONCEPT-information
depends_on: [CONCEPT-information]
l0_constraints:
  - PHY-001: "不同物理测量链的独立性最终依赖于物理定律——两次独立测量同一物理量,
    各自受熵增/噪声的独立影响,相关性仅来自被测量本身"
created: 2026-07-16
established_by: CNBS 工具实证暴露的"多源≠独立"问题 (iter-002/cnbs-empirical-memo.md)
