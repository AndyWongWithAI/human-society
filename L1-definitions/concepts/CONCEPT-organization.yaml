id: CONCEPT-organization
term: "组织 (Organization)"
definition: |
  多个 Agent 为实现共同目标而建立的、具有内部分工和
  协调机制的持久结构。

  必要特征:
  (a) 共同目标——组织有一个明确的、成员共享的总体目标
      （或一组目标）。这个目标不能由单个 Agent 单独实现
  (b) 内部分工——成员承担不同的角色/职能。
      分工不等于层级——扁平组织仍然有分工
  (c) 协调机制——存在显式的规则、程序或惯例来对齐成员的行动。
      这不只是人人"知道该做什么"——有某种超越个体判断的
      协调安排（指定谁来做什么、什么时候做、怎么做）
  (d) 持久性——组织超越个体成员。成员可以离开或更换，
      组织本身继续存在（前提是维持组织的能量投入——PHY-001）
  (e) 边界——定义了谁是成员、谁不是（来自 PHY-003-b 空间排他——
      组织也不能容纳无限成员，且成员资格的边界是协调的前提）

  组织与相关概念的区分:
  - 组织 vs 关系网络: 组织有共同目标和显式协调，关系网络不一定
  - 组织 vs 合作: 合作是事件/过程，组织是使合作持久的机制
  - 组织 vs 群体: 群体更宽泛（共享身份就够了），组织有分工和协调
  - 组织 vs 制度: 制度是规则体系，组织是执行规则的具体实体
      （这个区分后续可能需要细化）

  组织不预设:
  - 层级结构（扁平组织仍是组织）
  - 正式性（草台班子是组织）
  - 规模（二人组织是组织）
  - 法理地位（不需要法律认可是组织）

logical_implications:
  - "组织 ⇒ 存在共同目标"                           # 从 (a)
  - "组织 ⇒ 存在内部规范"                           # 从 (c)——协调机制即规范
  - "组织 ⇒ 成员之间存在关系"                        # 从 (b)+(c)
  - "组织需要能量来维持"                             # PHY-001——秩序需要能量
  - "组织规模受协调成本约束"                         # 人数↑→协调信息量↑→能量需求↑
  - "组织内存在竞争与合作的共存"                     # 对内合作 + 对外竞争 + 内部分配竞争

domain: [基础概念]
depends_on: [CONCEPT-agent, CONCEPT-goal, CONCEPT-resource, CONCEPT-relation, CONCEPT-cooperation, CONCEPT-position]
l0_constraints:
  - PHY-001: "组织是高度有序的结构 ⇒ 熵增不断侵蚀之 ⇒ 组织需要持续能量输入来维持——'不维护就崩溃'不是管理口号，是热力学"
  - PHY-002: "组织的能量预算约束其规模、复杂度和寿命——能获取多少能量决定能维持多大的秩序"
  - PHY-003-a: "通信延迟约束组织的空间跨度——地理上分散的组织需要更多能量来维持协调信息流"
  - PHY-003-b: "组织边界存在物理基础——空间排他性 ⇒ 组织不能无限扩张成员而不稀释协调"
created: 2026-07-13
