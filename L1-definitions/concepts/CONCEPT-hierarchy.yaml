id: CONCEPT-hierarchy
term: "层级 (Hierarchy)"
definition: |
  一种组织内部的结构安排：将成员或子单位按某种标准排为上下层，
  上层对下层具有更大的决策权或控制力。

  必要特征:
  (a) 排序——存在"高"与"低"的区分。这个区分基于某种可比较的属性：
      决策权、信息权、资源分配权、或地位
  (b) 不对称控制——上层可以约束或指导下层的选择。
      下层对上层没有同等的约束力（否则不是层级，是对等协商）
  (c) 嵌套——层级包含层次。上层决策的适用范围大于下层。
      顶层决定"做什么"，中间层决定"怎么做"，底层执行
  (d) 决策归并——层级的作用是减少需要同时参与决策的人数。
      不是每个成员都参与每项决策——决策权向上归并、
      执行向下分解。这是层级存在的功能理由

  层级与相关概念的区分:
  - 层级 vs 分工: 分工只需要不同的职能，不一定有上下关系
  - 层级 vs 权力（后续定义）: 层级是一种结构安排，权力是
      这种结构中流动的控制力。层级是权力的容器
  - 层级 vs 不平等: 层级是一种组织方式，不平等是一种分配结果

  层级的功能:
  层级是组织解决协调成本问题的一种方案。
  n 个 Agent 全对等协商的交互成本是 O(n²)——
  层级将协调归并为少量决策者之间的对等交互 +
  决策者与执行者之间的单向指令流，降低了协调的信息量。

  层级不预设:
  - 刚性（临时指挥链也是层级）
  - 基于暴力（同意产生的层级仍然是层级）
  - 显式规则（默契的等级也是层级）

logical_implications:
  - "层级 ⇒ 存在决策权的不对称分布"                 # 从 (b)
  - "层级 ⇒ 组织规模可以更大"                        # 降低协调成本 → 突破对等协调的规模瓶颈
  - "层级 ⇒ 上层拥有更多信息或决策权"                # 从 (b)+(d)
  - "层级 + 竞争 ⇒ 层级内部的地位竞争"               # 为后续公理留接口
  - "层级的功能单位是角色而非个体"                   # 层级附着在角色上，人可以换

domain: [基础概念]
depends_on: [CONCEPT-organization, CONCEPT-choice, CONCEPT-resource]
l0_constraints:
  - PHY-001: "层级制造信息梯度——信息从底层向上汇总时衰减，从顶层向下传达时失真——熵增的双向侵蚀"
  - PHY-003-a: "通信延迟限制了层级的有效深度——每一层增加信号延迟，超出某深度则指挥链失效"
  - PHY-002: "层级本身消耗能量（管理层不直接生产但消耗资源）——层级的收益（协调效率）必须大于其能量成本"
created: 2026-07-13
