id: CONCEPT-agent
term: "行动者 (Agent)"
definition: |
  一个具有目标导向行动能力的实体。

  必要特征:
  (a) 拥有目标或偏好——有想要达成的状态或想要获取的事物
  (b) 能感知环境状态——能区分当前状态与目标状态的差距
  (c) 能执行改变环境状态的动作——不是被动的观察者
  (d) 行动服务于目标——行动区别于随机运动，因为它在追寻某个目标

  Agent 不预设:
  - 生物学形态（不需要是"人类"或"生物"）
  - 理性程度（有限还是完全理性是 L2 的事）
  - 社会属性（Agent 可以孤立存在）
  - 数量（一个宇宙中只有一个 Agent 仍然是 Agent）

logical_implications:
  - "Agent 存在 ⇒ 目标存在"                    # 从 (a) 直接蕴含
  - "Agent 存在 ⇒ 能区分'当前'与'期望'"         # 从 (b) 蕴含
  - "Agent 行动 ⇒ 环境状态变更可归因于 Agent"    # 从 (c) 蕴含
  - "行动 ⇒ 存在目的"                           # 从 (d) 蕴含

domain: [基础概念]
l0_constraints:
  - PHY-002: "Agent 的任何行动消耗能量。能量不会凭空出现——Agent 必须从环境中获取（食物/燃料/其他能量源）"
  - PHY-003-b: "一个 Agent 在给定时刻只能占据一个空间位置——注意力/行动力在空间上是稀缺的"
  - PHY-003-d: "Agent 体验不可逆的时间——已做出的行动不可撤销"
  - PHY-001: "Agent 内部存储的信息（记忆/知识）在没有维护的情况下会衰减"
created: 2026-07-13
