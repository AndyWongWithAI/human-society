id: CONCEPT-goal
term: "目标 (Goal)"
人话摘要: "'目标'就是一个主体想达到或想保住的某种状态;正是当前状态和目标之间的差距,驱使它去行动。目标可以是自己没意识到的,也可以是别人分派的。"
definition: |
  一个 Agent 所意图达成或维持的环境状态。

  必要特征:
  (a) 指向性——目标指定了一个特定的状态（或状态范围），而非模糊的方向
  (b) 驱动力——目标的存在是 Agent 行动的原因。无目标则无行动（仅有运动）
  (c) 差额感知——当前状态与目标状态的差距被 Agent 感知，
      这个差额驱动 Agent 选择行动
  (d) 可多元——Agent 可同时持有多个目标，目标之间可能存在冲突

  目标不预设:
  - 意识性（Agent 可能不知道"自己有这个目标"——隐式目标仍然驱动行动）
  - 稳定性（目标可以随时间变化）
  - 来源（目标可以是内在的、习得的、被分配的）
  - 理性（目标的合理性不由定义保证）
  - 层级（是否有些目标是"终极"的、有些是"工具性"的——这是 L2 的经验问题）

logical_implications:
  - "目标 ⇒ 存在一个持有该目标的 Agent"           # 目标不能独立于 Agent
  - "Agent 行动 ⇒ 存在至少一个目标"               # 从 CONCEPT-agent(d)
  - "目标1 与 目标2 冲突 ⇒ Agent 需要选择"         # 从 (d) 蕴含
  - "目标+差额感知 ⇒ 方向"                       # Agent 的行动有方向性

domain: [基础概念]
depends_on: [CONCEPT-agent]
l0_constraints:
  - PHY-002: "达成任何目标需要消耗能量。目标的'成本'最终溯源到物理能量"
  - PHY-003-d: "目标追求需要时间。时间的不可逆性意味着延迟达成目标有实际的不可恢复的代价"
created: 2026-07-13
