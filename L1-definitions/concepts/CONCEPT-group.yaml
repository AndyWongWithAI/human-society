id: CONCEPT-group
term: "群体 (Group)"
definition: |
  多个 Agent 因共享某种身份标识而形成的有边界集合。

  必要特征:
  (a) 共享身份——成员认同某种共同的标识：血缘、语言、地域、
      信仰、爱好、经历。这个标识可以是被外界赋予的（'你们是
      同一类人'），但必须被成员主观认可才算真正共享了身份
  (b) 边界——成员与非成员之间存在区分（来自 PHY-003-b 空间排他——
      一个人的注意力和归属感是有限的，你不可能深度认同 1000 个群体）
  (c) 内部规范——存在调节成员行为的隐性或显性规则。
      这种规范可能很弱（'我们这群人大概这样做事'），
      不像组织那样需要显式协调机制
  (d) 持久性——群体超越个体成员（PHY-001 约束：群体的身份信息
      需要持续的仪式、符号、叙事来维护，否则衰减）

  群体与组织的区分:
  - 群体不需要共同目标（一个民族是群体，不必然有一个共同目标）
  - 群体不需要分工和协调机制（那是组织的特征）
  - 群体可以有组织作为其子结构（一个民族内部可以有社团、公司）
  - 一个人可以同时属于多个群体（多重身份），但很难同时属于
    多个组织（组织的成员资格是排他性的——来自 PHY-003-b: 时间排他）

  群体不预设:
  - 规模（二人可以构成群体）
  - 面对面互动（全球散居侨民是群体）
  - 自愿性（出生即属于某民族——不是选择的结果）
  - 价值判断（'帮派'和'志愿者团体'都是群体）

logical_implications:
  - "群体 ⇒ 存在成员/非成员区分"                   # 从 (b)
  - "群体 ⇒ 存在共享身份信息"                        # 从 (a) + CONCEPT-information
  - "群体 ⇒ 成员之间存在关系"                        # 从 (a)——身份共享是关系的一种
  - "群体可容纳组织"                                # 群体内部可以存在组织
  - "多重群体身份 ⇒ 潜在的身份冲突"                  # 为后续公理留接口
  - "群体的身份信息会衰减"                          # PHY-001——需要仪式/符号/叙事维护

domain: [基础概念]
depends_on: [CONCEPT-agent, CONCEPT-information, CONCEPT-relation, CONCEPT-goal, CONCEPT-choice]
l0_constraints:
  - PHY-001: "群体身份信息随时间衰减——没有仪式、符号、叙事的持续维护，群体凝聚力退化"
  - PHY-003-b: "个体注意力和归属感的有限性 ⇒ 一个人深度认同的群体数量有上限"
  - PHY-002: "维持群体身份消耗能量——仪式、传播、边界维护都需要能量投入"
created: 2026-07-13
