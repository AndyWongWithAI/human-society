id: CONCEPT-choice
term: "选择 (Choice)"
人话摘要: "'选择'就是在几条互相排斥、只能走一条的路里挑一条去做;因为时间和资源都有限,人根本躲不开选择——连'什么都不做'也是一种选择(等于选了维持现状)。"
definition: |
  Agent 在多个互不相容的行动方案中决定执行哪一个的过程。

  必要特征:
  (a) 选项——存在 ≥2 个可区分的行动方案。
      如果只有一条路可走，那不是选择
  (b) 互不相容——选择 A 意味着在当前时刻不能同时执行 B
      （来自 PHY-003 时空约束：Agent 不能同时出现在两个位置、
      时间不可逆）
  (c) 择优——Agent 根据某种标准（偏好/目标）在不同选项间做比较。
      无标准的随机抽取不是选择

  选择的不可避免性:
  选择不是 Agent "可以选择做不做"的事情——它是 Agent 存在的基本条件。
  Agent 有目标 → 目标之间可能冲突 (CONCEPT-goal(d))
  → 资源有限 (PHY-002 + CONCEPT-resource(c))
  → 时间不可逆 (PHY-003-d)
  → Agent 必须选择。不选择本身就是一种选择（选择了维持现状）。

  选择不预设:
  - 意识性（隐式选择——Agent 执行了 A 而没有执行 B，
    即使它不知道自己有选项，它仍然"选择"了）
  - 最优性（Agent 选择的方案不一定是"最好的"——那取决于它的能力）
  - 自由意志（选择的定义不需要自由意志的哲学立场）

logical_implications:
  - "Agent 存在 ⇒ 选择不可避免"                    # 时空+资源约束
  - "选择 ⇒ 牺牲"                                  # 选择了 A = 放弃了 B
  - "选择 ⇒ 存在偏好序"                            # 从 (c)——选择揭示偏好
  - "竞争 + 选择 ⇒ 策略"                           # 为后续概念留接口
  - "每次行动是选择的结果"                          # 行动 = 选中方案

domain: [基础概念]
depends_on: [CONCEPT-agent, CONCEPT-goal, CONCEPT-resource, CONCEPT-information]
l0_constraints:
  - PHY-002: "能量预算约束可行选择集——Agent 不能选择超出其能量预算的行动方案"
  - PHY-003-d: "时间不可逆 ⇒ 选择 A 意味着永久失去了在该时刻选择 B 的机会——选择有不可恢复的机会成本"
  - PHY-003-b: "Agent 的空间位置限制了当前可感知的选项范围——远处的选项不在视线内"
created: 2026-07-13
