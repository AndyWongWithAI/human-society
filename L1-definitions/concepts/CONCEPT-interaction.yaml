id: CONCEPT-interaction
term: "交互 (Interaction)"
人话摘要: "'交互'指两个以上的主体之间发生的一次行为往来——一方的动作作用到另一方并产生看得见的影响(哪怕对方没回应,比如攻击也算);它是一次性的事件,反复发生并稳定下来才成为'关系'。"
definition: |
  两个及以上 Agent 之间的行为交换——每个参与方的行动
  以其他参与方为对象或对其他参与方产生可感知的影响。

  必要特征:
  (a) 至少涉及两个 Agent（一个 Agent 对环境的单向行动不叫交互）
  (b) 双向因果——A 的行动影响 B 的状态，且 B 的状态变化可被 A 感知
      （即使 B 没有"回应"，只要 A 的行动以 B 为对象并产生了可观测效果，
       就构成交互——攻击是一种交互，尽管被攻击方没有选择参与）
  (c) 可识别性——交互是一个可与其他事件区分开的离散事件或事件序列

  交互不预设:
  - 合作或对抗（交互可以是任何方向的）
  - 重复性（单次偶遇也是交互）
  - 对称性（双方对交互的贡献可以不等）
  - 物理接触（信息传递也是交互）

  与"关系"的区分：
  - 交互 = 事件（event）——在时间上有起点和终点
  - 关系 = 模式（pattern）——交互的重复和结构化（后续定义）

logical_implications:
  - "交互 ⇒ 存在 ≥2 个 Agent"                   # 从 (a)
  - "交互 ⇒ A 的行动对 B 产生了可观测效果"          # 从 (b)
  - "交互 ⇒ 存在信息从 A 流向 B（至少方向性的）"     # 从 (b) 蕴含
  - "交互消耗参与各方的能量"                      # 从 PHY-002 + CONCEPT-agent(d)

domain: [基础概念]
depends_on: [CONCEPT-agent, CONCEPT-information]
l0_constraints:
  - PHY-002: "交互消耗参与各方的能量——信息传递和行动执行都需要能量输入"
  - PHY-003-a: "信息在 Agent 之间传递有速度上限和延迟——交互不是瞬时的"
  - PHY-003-b: "物理交互需要空间接近——Agent 之间的物理距离约束了可发生的交互集合"
  - PHY-001: "交互中传递的信息在传递过程中会衰减/失真——没有完美的通信"
created: 2026-07-13
