id: CONCEPT-value
term: "价值 (Value)"
人话摘要: "'价值'不是东西自己带的属性——它是'谁想要、有多想要、愿意为它付出什么代价'的三方关系。同样一瓶水，对沙漠里的人和对湖边的人，价值天差地别。价值不能直接测量，只能通过一个人实际做了什么选择来反推。"
definition: |
  价值是 Agent-资源-目标三角中的关系属性——Agent 为了获取或保留
  某种资源，愿意承担的代价（能量、时间、风险、或放弃的其他资源）。

  价值不是资源的固有属性，而是 Agent 对资源的偏好在稀缺条件下
  的显现。同一资源对不同 Agent 的价值可以不同；同一 Agent 对
  同一资源的价值评估可以随条件和信息变化而变化。

  必要特征:
  (a) 关系性——价值不存在于资源内部，而是存在于 Agent-资源-目标
      三者的关系之中。没有 Agent 的目标，就没有"价值"这个概念。
      来自 CONCEPT-resource(a)：资源的工具性取决于 Agent 的目标。
      "愿意承担的代价"的单位取决于选择语境：在交换语境中是
      "放弃的其他资源"；在非交换语境中是能量/时间/风险。
      一只独居动物为其领地付出的巡逻能量——那也是它对该领地的价值评估。
  (b) 序数性——价值的原生形态是序数的（A > B > C），
      而非基数的（不能说 A 是 B 的 3.7 倍）。
      基数的近似表达需要第三参照物——一种被广泛接受的交换媒介，
      它提供一个共享的"计量单位"。但序数→基数的转化是一个
      连续渐进的过程（不是二元跳变）：交换媒介的共享程度越高，
      基数表达的精度越高；但交换媒介本身的价值也在变动，
      所以不存在绝对的、不动的"价值标尺"。
      在没有广泛共享的交换媒介时，人们仍可以用局部参照物
      做近似基数比较（"这把斧头值三张兽皮"）——
      但这个比值不稳定，因交易对手和时点而异。
  (c) 边际替代——Agent 对同一种资源的第 n+1 单位的价值评估
      通常（但非必然）低于第 n 单位。原因：最优先的目标先被满足→
      额外单位的资源用于满足较低优先级的子目标（CONCEPT-goal）。
      但在以下情况下边际价值可能递增：成瘾品（每多一剂更接近
      戒断临界）、收藏品（越接近成套越有价值）、网络效应品
      （第 n 个用户使平台对第 n+1 个用户更有价值）。
      因此边际递减不是价值的定义特征，是从目标结构的层次性中
      导出的普遍但非必然的经验规律。
  (d) 可传递但会衰减——在间接交换链（A→B→C→...→Z）中，
      每增加一层中间环节，价值信号就衰减一次。
      来自 PHY-001 熵增（信息层面）：每次传递都需要信息处理，
      引入噪声和偏差。这个衰减在足够长的链条中可以大到使交换
      不再可行——这为"一般等价物可以缩短交换链条"提供了物理理由。

  价值的测量（与定义分离）:
  价值不能被直接观测——Agent 不会输出一个叫"价值"的读数。
  价值只能通过 Agent 的实际选择反向推断：
  - 如果 A 在两个互斥选项中选择了 X 而非 Y，
    则 A 对 X 的（边际）价值 > 对 Y 的（边际）价值（显示性偏好逻辑）。
  - 如果 A 愿意支付价格 P 来获取 X，
    则 A 对 X 的边际价值 ≥ P（在 A 的预算约束下）。
  这不需要 A 有意识地"计算价值"——选择本身揭示了偏好序。
  注意：选择揭示的是价值的序数关系，不是价值的绝对值。
  将一系列选择映射为基数"价值量"需要额外假设（传递性、单调性等），
  这些假设在某些条件下可能不成立。

  价值与相关概念的区分:
  - 价值 vs 资源: 资源是"什么东西"，价值是"有多重要"。
    CONCEPT-resource 定义了什么是资源（可支配的、能缩小目标差距的东西），
    CONCEPT-value 定义了资源对 Agent 的重要程度。
  - 价值 vs 价格: 价格是价值在特定交换中的具体显现（以某种交换媒介
    的数量表达）。价格是可观测的，价值是不可直接观测的——
    价值是通过选择（包括但不限于价格）来推断的。
    在没有交换媒介的社会中，价值仍然存在（A 认为 X > Y），
    但价格不存在。
  - 价值 vs 效用: 效用是经济学中形式化的偏好满足程度。
    本体系中的"价值"更接近日常语言的"某物有多重要/值多少"，
    有意不采用效用的基数假设和最大化框架。
    价值不需要 Agent 是"效用最大化者"——只需要 Agent 做选择。
  - 价值 vs 重要性: 空气对生存极度重要，但其"价值"（在
    "愿意为此付出多少代价"的意义上）为零——因为空气不稀缺
    （不存在竞争，S=1），没有人需要为获取空气而放弃任何东西。
    重要性是单维的（此物→生存），价值是三维的（此物→目标×稀缺×交换）。

  价值不预设:
  - 交换的存在（一只独居动物的领地对其有生存价值——即使不存在交换）
  - 货币的存在（货币只是使某些价值能以价格形式显现）
  - 价值的可加总性（不同资源的价值是否可以加总比较，是经验问题）
  - Agent 有意识地"思考价值"（选择揭示了价值，但 Agent 可以凭直觉选择）
  - 价值的"客观正确性"（A 认为 X 有价值不能评判为"对"或"错"——
    除非引入 L5 规范标准。价值 ≠ 值得追求的东西）

logical_implications:
  - "Agent 有目标 + 资源有限 ⇒ 价值存在"                      # 从 (a) + CONCEPT-goal + CONCEPT-resource
  - "同一资源对不同 Agent 价值不同 ⇒ 交换的可能"                # 从 (a)
  - "价值不可直接测量 ⇒ 只能通过选择推断"                       # 从 测量部分
  - "价值序数性 + 共享交换媒介 ⇒ 近似基数价格（非精确）"         # 从 (b)
  - "价值传递衰减 ⇒ 长交换链不可行 ⇒ 一般等价物的功能需求"       # 从 (d) + PHY-001
  - "不稀缺 ⇒ 无竞争 ⇒ 边际获取代价为零 ⇒ V=0（无论 U 多大）"   # 从 价值 vs 重要性

domain: [基础概念]
depends_on: [CONCEPT-agent, CONCEPT-resource, CONCEPT-goal, CONCEPT-choice, CONCEPT-competition]
l0_constraints:
  - PHY-001: "价值信号在传递链中衰减——每多一层中间环节，信息熵增就损耗一部分信号精度。这是'为什么不能所有东西都直接以物易物'的物理根源之一"
  - PHY-002: "Agent 追求目标消耗能量——为获取资源愿意放弃的代价受到 Agent 可支配能量的上限约束。'愿意付出任何代价'在物理上不可能——Agent 的能量预算是有限的"
  - PHY-003-c: "资源地理分布不均 ⇒ 同一资源在不同位置的价值可能差异巨大。运输成本 + 空间排他 ⇒ 地理位置本身就是价值的一个因子"
