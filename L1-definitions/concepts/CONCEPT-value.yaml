revised: 2026-07-15
revision_note: "对抗审后修正：(1)定义'代价'含能量/时间/风险，消除与'不预设交换'的矛盾；(2)序数→基数改为连续渐进而非二元跳变；(3)测量部分从必要特征移出独立成节；(4)边际递减降级为非必要的经验规律；(5)depends_on 移除 CONCEPT-exchange；(6)新增价值 vs 重要性区分"
