id: CONCEPT-relation
term: "关系 (Relation)"
人话摘要: "'关系'指特定的两人(或多人)反复打交道后形成的、比较稳定、彼此能大致预料对方的互动套路;单次陌生人偶遇只是'交互',反复发生并沉淀下来才叫'关系',而且不来往就会慢慢生疏、淡掉。"
definition: |
  两个及以上特定 Agent 之间，通过重复交互形成的、
  具有一定稳定性和可预期性的互动模式。

  必要特征:
  (a) 持续性——不是单次偶遇。交互在时间上重复发生，
      且参与各方预期未来还会继续
  (b) 结构性——互动并非每次从零开始。存在（可能是隐含的）
      规则、角色或惯例来调节互动
  (c) 特定性——关系锚定在特定的 Agent 之间。
      可迁移的"角色"（如"老师"）是关系的抽象——
      但关系本身存在于 A 和 B 之间
  (d) 可预期——参与方能大致预测对方的行为。
      完全不可预测的互动不构成关系

  关系与交互的区分:
  - 交互是事件（event），关系是模式（pattern）
  - 关系从交互中涌现，但不等于交互的简单加总
  - 没有关系的交互是可能的（陌生人偶遇）
  - 没有交互的关系是不可能的（关系依赖交互的持续来维持——PHY-001 熵增约束）

  关系不预设:
  - 合作/对抗（关系可以是任何性质的）
  - 对称性（关系可以是单向支配、双向平等、多向网络）
  - 正式性（关系可以是显式契约或隐式惯例）
  - 自愿性（被支配的关系仍然是关系）

logical_implications:
  - "关系 ⇒ 存在 ≥2 个特定 Agent"                 # 从 (c)
  - "关系 ⇒ 存在交互历史"                          # 从 (a) + CONCEPT-interaction
  - "关系 ⇒ 参与方行为可预期"                      # 从 (d)
  - "关系需要持续交互来维持"                        # PHY-001 信息熵: 无交互则信息衰减
  - "关系是资源"                                  # 关系帮助 Agent 达成目标 → 是资源的一种

domain: [基础概念]
depends_on: [CONCEPT-agent, CONCEPT-interaction, CONCEPT-goal, CONCEPT-resource, CONCEPT-information]
l0_constraints:
  - PHY-001: "关系信息（'B 上次做了什么'、'B 是否可信'）会随时间衰减——没有持续交互来刷新，关系退化"
  - PHY-002: "维持关系消耗能量——沟通、协调、互动的每一次都需要能量投入"
  - PHY-003-a: "关系的信息维护有延迟——A 只能知道自己与 B 的互动历史，不能实时知晓 B 的状态变化"
