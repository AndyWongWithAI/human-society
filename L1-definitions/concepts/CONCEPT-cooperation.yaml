id: CONCEPT-cooperation
term: "合作 (Cooperation)"
definition: |
  两个及以上 Agent 协调行动以实现各自单独无法实现
  （或无法以同等效率实现）的目标或结果。

  必要特征:
  (a) 协调——参与方的行动不是独立的、并发的，而是彼此适配的。
      A 的行动考虑到 B 将做什么，反之亦然
  (b) 共享目标或互补利益——存在一个结果，它对所有参与方
      都有正面价值（不一定等值），且单独行动无法达成
  (c) 自愿参与——Agent 选择合作而非不合作。
      被迫的"配合"（如奴隶听从命令）不在合作的定义下
      （那属于支配/权力的范畴）
  (d) 正和——合作产出的总价值大于各 Agent 单独行动的价值之和。
      否则没有合作的动机

  合作不预设:
  - 利他主义（合作可以是纯粹自利的——我合作因为这样对我更有利）
  - 显式协议（合作可以隐式涌现——两个人都靠右走，不需要签约）
  - 等值分配（一方可以比另一方获益更多）
  - 持久性（一次性的合作也是合作）
  - 对称性（A 和 B 的贡献可以完全不同且互补）

  合作与竞争的共存:
  合作 ≠ 竞争的消失。一群 Agent 可以在一个维度上合作
  （共同狩猎获得更多肉），同时在另一个维度上竞争
  （分配猎物时争抢最好的部位）。
  合作改变竞争的形式——从资源层面的直接竞争
  转向在合作框架内的分配竞争。

logical_implications:
  - "合作 ⇒ 存在 ≥2 个 Agent"                      # 从 (a)
  - "合作 ⇒ 存在共同利益"                           # 从 (b)
  - "合作是选择的结果"                              # 从 (c) + CONCEPT-choice
  - "合作需要协调信息"                              # Agent 之间需要传递意图/计划
  - "合作 ⇏ 消除竞争"                              # 合作与竞争共存
  - "重复交互 + 未来价值 ⇒ 合作可能涌现"            # 为后续公理/定理留接口

domain: [基础概念]
depends_on: [CONCEPT-agent, CONCEPT-goal, CONCEPT-choice, CONCEPT-interaction]
l0_constraints:
  - PHY-001: "合作是一种低熵状态（高度有序的协调）⇒ 需要持续能量输入来维持——熵增不断侵蚀合作的秩序"
  - PHY-002: "合作的协调成本（通信、监控、协商）消耗能量——合作的净收益必须超过协调的能量成本"
  - PHY-003-a: "协调信息传递有延迟——合作规模受通信速度约束。Agent 越多，同步协调越难"
created: 2026-07-13
