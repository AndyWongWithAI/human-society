id: CONCEPT-norm
term: "规范 (Norm)"
definition: |
  在一组 Agent 之间共享的行为期望——成员预期彼此会（或不会）
  采取某种行为，且偏离该期望会引发其他 Agent 的某种回应。

  必要特征:
  (a) 共享性——规范存在于多个 Agent 的认知中。单个 Agent 的
      行为偏好不是规范，是习惯。规范要求 ≥2 个 Agent 共享同一期望
      （来自 CONCEPT-information：共享期望是共享信息的一种形式）
  (b) 规范性（prescriptivity）——规范规定"应该/不应该做什么"，
      而非仅仅描述"实际在做什么"。描述性规律（"这里的人普遍矮"）
      不是规范
  (c) 反事实执行——偏离规范会引发其他 Agent 的回应：
      制裁、排斥、纠正、 disapproval、或仅仅是"你不正常"的信号。
      没有回应的期望不是规范，是观察
  (d) 涌现性——规范可以在没有显式设计者的情况下自发产生。
      两个 Agent 反复交互 → 行为模式稳定 → 模式被第三个 Agent
      观察到并模仿 → 共享期望形成。这是规范区别于显式规则的关键：
      规则需要有人"制定"，规范不需要
  (e) 维持成本——规范需要持续的交互来刷新共享期望。
      如果成员不再互动 → 共享期望衰减（PHY-001）。
      如果违规不被回应 → 规范瓦解

  规范与相关概念的区分:
  - 规范 vs 规则（组织的协调机制）: 规则是显式制定的，规范是涌现的。
    一个组织的规则手册是规则，团队成员"不会在会议上打断别人"是规范。
    规则和规范可以互相转化（规范被明文写下 → 变成规则；
    规则内化为成员自发行为 → 变成规范）
  - 规范 vs 习惯: 习惯是个体层面的行为规律，规范是社会层面的共享期望。
    A 每天跑步是习惯；A 和 B 都预期对方不会在对方休息时吵闹是规范
  - 规范 vs 法律: 法律是专门化执行机构（国家）背书的规则。
    规范没有专门化执行者——任何成员都可以是执行者
  - 规范 vs 道德: 规范描述"这里的人做什么/不做什么"，
    道德涉及"对/错"的评判。两者有交集但不是一回事。
    道德问题是"应该存在什么规范"

  规范不预设:
  - 显式表达（默契的规范仍然是规范）
  - 全员共识（一个群体内可以存在关于规范的争议）
  - 合理性（"吃人肉"是某些社会的规范——不意味着它是好的）
  - 普适性（规范是群体特定的——不同群体有不同规范）

logical_implications:
  - "规范 ⇒ 存在 ≥2 个 Agent 且他们之间存在交互/关系"    # 从 (a)
  - "规范 ⇒ 存在共享信息"                                # 从 (a) + CONCEPT-information
  - "规范需要交互来维持"                                 # 从 (e) + PHY-001
  - "规范 + 偏离 + 无回应 ⇒ 规范瓦解"                     # 从 (c)+(e)
  - "重复交互 ⇒ 规范可自发涌现"                           # 从 (d)——为公理留接口
  - "群体 ⇒ 内部存在规范"                                # CONCEPT-group(c)——群体必有规范
  - "组织 ⇒ 存在规范（作为协调机制的基底）"               # 组织的显式规则建立在规范的地基上

domain: [基础概念]
depends_on: [CONCEPT-agent, CONCEPT-interaction, CONCEPT-relation, CONCEPT-information]
l0_constraints:
  - PHY-001: "共享期望（规范信息）无持续交互则衰减——'好久不联系的朋友不再知道彼此的边界'是熵增在社会信息层的表现"
  - PHY-002: "执行规范消耗能量——制裁、纠正、 disapproval 都需要 Agent 投入时间/精力/资源"
  - PHY-003-a: "通信延迟限定了规范的传播半径——地理分散的群体更难维持共享期望"
