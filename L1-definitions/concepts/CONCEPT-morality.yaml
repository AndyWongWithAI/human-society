id: CONCEPT-morality
term: "道德 (Morality)"
人话摘要: "'道德'不是一套特定的行为清单——它是规范的一个子类。一个规范'变成道德规范'的标志不是它说了什么，而是两件事：(1) 没被直接伤害的旁观者也愿意付出代价去惩罚违规者（第三方执行），(2) 这个规范能被'装进心里'——人即使没人看着、没人会惩罚他，违反了也会自己难受（内化）。这两条加在一起，让道德规范比普通社会习俗'绑得更紧'。"
definition: |
  道德是规范的一个子类，具有两个额外交叠的结构属性：
  第三方惩罚意愿（bystander enforcement）和可内化性（internalizability）。

  第三方惩罚是道德规范的必要条件：一个规范是"道德规范"当且仅当
  它的违反在所属群体中系统地触发未直接受害的旁观者的惩罚意愿。
  可内化是道德规范的"成熟度"维度——并非所有道德规范都已被内化，
  但所有道德规范都必须有第三方惩罚。

  不满足第三方惩罚的规范是社会习俗（social convention），
  无论其是否被个体内化。仅内化而无第三方惩罚的规范是"私有道德"
  （残余态/过渡态）——见 DED-023 四象限分类。

  必要特征:
  (a) 规范性基底——道德首先是一种规范（来自 CONCEPT-norm）。
      所有道德规范都是规范，但并非所有规范都是道德规范。
      道德继承规范的全部特征：共享性、规范性（prescriptivity）、
      反事实执行、涌现性、维持成本。
  (b) 第三方惩罚意愿——道德规范的违反不仅引发直接受害者的回应，
      还系统地引发未直接受害的旁观者（third parties）的惩罚意愿。
      旁观者愿意付出个人代价（时间、资源、社会资本、安全风险）
      来惩罚违规者——即使该违规行为并不直接影响旁观者自身。
      这是道德区别于社会习俗的关键行为标志：
      "吃饭用筷子"是习俗——有人用手抓你不会愤怒，更不会冲过去罚他；
      "无故打人"违反道德规范——即使被打的不是你，你也会愤怒、
      可能干预、至少会支持惩罚打人者。
      （第三方惩罚的存在条件由 THEOREM-moral-third-party-enforcement 推导，
      此处不展开。）
  (c) 可内化性——道德规范能被 Agent 从外部制裁转化为内部制裁。
      内化后，Agent 在无旁观者、无外部惩罚风险的情况下仍然遵守规范，
      并且违反时会经历内疚（guilt）、羞耻（shame）等自我惩罚情绪。
      遵守时会经历自豪（pride）、自我认同强化等自我奖励情绪。
      内化是道德规范的附加属性——并非所有道德规范都已被内化，
      但可内化性使道德规范在能量上比纯外部执行更高效：
      持续的外部监控消耗群体能量，内化将部分监控成本从群体转移到个体。
      （内化的存在条件和发育前提由 THEOREM-moral-internalization 推导，
      此处不展开。）
  副现象:
  (d) 感知普遍性——持有道德规范的主体倾向于认为该规范"本来就该这样"，
      而非"我们这群人恰好这么做"。这不是道德的定义性特征，
      而是 (b) 和 (c) 的可能副产物：强烈的第三方惩罚预期 +
      强烈的内部制裁 → "这不只是我们这里的习俗，这是正确的事"。
      感知普遍性在跨文化中具有适应性功能（增强规范的执行可信度），
      但其内容完全由文化填充——不同文化中"本来就该这样"的内容
      可以截然相反。

  道德与相关概念的区分:
  - 道德 vs 社会习俗: 社会习俗是规范但不是道德规范。
    习俗违反触发尴尬或轻度 disapproval，但不触发第三方惩罚意愿，
    也不内化为"对/错"判断。用筷子还是用叉子是习俗——没人会因为
    别人用手吃饭而愤怒到付出代价去惩罚他。道德规范违反则触发
    愤怒、惩罚意愿、且在无旁观者时仍通过内疚自我执行。
    这解释了为什么"不杀人"和"吃饭用筷子"虽然都是规范，
    但前者是"道德"后者是"习俗"——差异不在内容的重要性，
    而在执行机制的结构。
  - 道德 vs 法律: 法律有专门化执行机构（警察、法院），
    道德没有。但道德有"分布式执行"——任何成员都可以是执行者。
    法律和道德可以重叠（杀人是犯罪也是道德错误），
    也可以分离（乱穿马路是违法但通常不被视为不道德；
    撒谎通常被视为不道德但只有特定情境下违法）。
    来自 CONCEPT-norm：没有专门化执行者的规范。
  - 道德 vs 公平: 公平是一个特定的道德领域（关乎分配和对待的合法性），
    道德涵盖更广——包括禁止伤害、群体忠诚、等级尊重、纯洁/神圣等。
    CONCEPT-fairness 已经独立定义，它的 (d) 代价执行和 CONCEPT-morality
    的 (b) 第三方惩罚意愿有交叠但不完全相同——
    公平的代价执行可以来自直接受害方（我被亏待了我抗议），
    道德的第三方惩罚特指未直接受害的旁观者也付出代价来执行。
  - 道德 vs 宗教/意识形态: 宗教和意识形态常常包含道德规范，
    但它们还包含额外的成分（宇宙论、仪式、权威结构等），
    这些超出了道德的结构定义。

  道德不预设:
  - 任何特定的道德内容（不预设"杀人是错的"——只是说如果"杀人是错的"
    是一个规范且违反会触发第三方惩罚+可内化，那它就是道德规范）
  - 道德规范的"客观真值"（道德规范是主体间共享的规范，
    不是物理量也不是逻辑真理——本定义不解决元伦理学问题）
  - 所有道德规范都同时满足 (b) 和 (c)（一个规范可能有第三方惩罚
    但尚未内化——"新道德规范"，或已内化但在特定群体中失去
    第三方惩罚意愿——"私有化的道德"）
  - 道德规范总是促进合作（某些道德规范可能抑制合作——
    比如"不得与异教徒交易"的道德规范实际上破坏跨群体合作）

logical_implications:
  - "道德规范 ⇒ 规范 + (第三方惩罚 ∨ 内化)"                    # 从 (a)(b)(c)
  - "规范 + 无第三方惩罚 + 不可内化 ⇒ 社会习俗（非道德规范）"  # 从 (b)(c) 的反面
  - "内化 ⇏ 第三方惩罚"                                        # (b) 和 (c) 可分离
  - "内化需要发育窗口 + 对等性信号 + 规范稳定性"                # 从 (c)(i)(ii)(iii)
  - "长期感知他人不遵守 ⇒ 内化瓦解"                            # 从 (c)(ii)
  - "第三方惩罚意愿 ⇒ 该规范解决了一个合作搭便车问题"           # 从 (b) + AXIOM-001
  - "内化 ⇒ 监督成本从群体转移到个体"                           # 从 (c) + AXIOM-002 + PHY-002
  - "道德规范 + 无第三方惩罚 + 仅有内化 ⇒ 道德私有化"          # 从 可分离性
  - "道德规范的内容 ≠ 道德的属"                                 # 从 不预设

domain: [基础概念, 道德心理学, 演化伦理学]
depends_on: [CONCEPT-norm, CONCEPT-agent, CONCEPT-group, CONCEPT-cooperation, CONCEPT-competition, CONCEPT-conflict]
l0_constraints:
  - PHY-001: "道德规范作为共享信息——无持续交互则衰减。'一代人的道德信念在下一代眼中变成老古董'是熵增在道德信息层的表现"
  - PHY-002: "第三方惩罚消耗能量——旁观者需要付出时间/资源/社会资本/安全风险来执行道德规范。当执行代价超过个体可承受的范围，道德规范就失去了分布式执行能力，需要专门化机构（法律）接管"
  - PHY-003-a: "道德规范的传播半径受通信延迟限制——地理分散的群体更难维持同一套道德判断。道德共识的规模受限于通信技术的带宽"
