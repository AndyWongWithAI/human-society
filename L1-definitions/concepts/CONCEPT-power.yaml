id: CONCEPT-power
term: "权力 (Power)"
definition: |
  在关系中，Agent A 影响 Agent B 之选择的能力——
  使得 B 采取的行动偏离 B 在没有 A 影响时会采取的行动。

  必要特征:
  (a) 关系属性——权力不在 Agent 内部，权力在 Agent 之间。
      孤立的 Agent 无所谓权力
  (b) 不对称——A 对 B 的影响力与 B 对 A 的影响力不等。
      如果完全对称，那不是权力，是对等协商
  (c) 反事实——权力是一个反事实概念：如果 A 不存在，
      B 的选择会不同。权力的"量"体现在 B 的选择偏离程度
  (d) 基础——权力附着于某种资源或位置：
      暴力能力、资源控制、信息优势、地位/合法性、人数数量
      （A 能召集 100 人而 B 只能召集 10 人）
  (e) 可潜伏——权力可以不施加（A 可以影响 B 但选择不施加影响）。
      未使用的权力仍然是权力

  权力与相关概念的区分:
  - 权力 vs 层级: 层级是结构（权力的容器），权力是关系中流动的控制力
  - 权力 vs 暴力: 暴力是一种权力基础，但不是唯一基础。
      基于信息/合法性/资源的权力同样真实
  - 权力 vs 影响力: 权力是影响力的能力储备，影响力是施加中的权力
  - 权力 vs 权威: 权威是合法化的权力——被支配者认为支配是"对的/应该的"。
      权力不需要合法性，权威需要（后续可展开）

  权力不预设:
  - 合法性（枪口下的服从也是权力）
  - 显式化（默契的等级中存在未说出来的权力）
  - 集中性（权力可以分散——"所有人的权力"也是权力）
  - 负面性（权力可以是保护性的——父母对子女的权力）

logical_implications:
  - "权力 ⇒ 存在 ≥2 个 Agent 且存在他们之间的关系"   # 从 (a)
  - "权力 ⇒ 资源的不对称分布"                        # 从 (d)——权力基础最终溯源到资源
  - "层级 ⇒ 权力的结构化分布"                        # 从 CONCEPT-hierarchy
  - "权力 + 合作 ⇒ 分配谈判"                         # 合作中的分配由权力影响
  - "权力 + 竞争 ⇒ 谁获胜"                          # 竞争的结果受权力分布影响
  - "权力的维持需要能量"                             # PHY-002——维持权力基础消耗能量

domain: [基础概念]
depends_on: [CONCEPT-agent, CONCEPT-choice, CONCEPT-interaction, CONCEPT-relation, CONCEPT-resource, CONCEPT-information]
l0_constraints:
  - PHY-002: "维护权力基础消耗能量——无论暴力、信息还是地位的维护都需要持续投入资源"
  - PHY-003-a: "信息延迟 ⇒ 权力的有效作用范围受通信速度约束——遥控不如亲临"
  - PHY-001: "权力信息（'谁有权力影响我'）会衰减——需要持续的符号/信号来刷新"
created: 2026-07-13
