id: CONCEPT-conflict
term: "冲突 (Conflict)"
人话摘要: "'冲突'指双方直接较劲、至少一方存心要妨碍对方,比竞争更进一步(竞争可以互不知情,冲突必然是面对面对着干),而且打起来双方都得耗成本。它不一定是暴力,制裁、排挤、打官司都算。"
definition: |
  Agent 之间的直接对抗性交互——至少一方意图通过行动
  损害另一方的目标达成或利益。

  必要特征:
  (a) 直接性——Agent 之间直接发生对抗性交互。
      非直接的资源竞争（两个吃同一片草的食草动物）不属于冲突
  (b) 意图——至少一方有损害对方的意图或目标。
      没有意图的意外伤害不属于冲突
      （注意：意图不等于意识——动物攻击入侵者是冲突，
      尽管它没有'我要消灭你'的显式思维）
  (c) 代价消耗——冲突本身消耗双方资源（能量、时间、信息、关系），
      且常常比合作更昂贵（PHY-002）
  (d) 可升级/可降级——冲突的强度可以变化：
      从口头争执到暴力对抗。冲突不是二元的（发生/不发生），
      而是连续的（低强度到高强度）

  冲突与竞争的区分:
  - 竞争：A 和 B 都想获得同一资源。可以互不知晓
  - 冲突：A 和 B 直接做什么来阻止对方。必然有交互
  - 竞争可以引发冲突，但不是所有竞争都变成冲突
  - 冲突可以没有资源竞争的基础（纯粹的仇恨、误解、身份对抗）

  冲突与合作的共存:
  冲突和合作不是互斥的。A 和 B 可以同时在某个维度上合作
  （共同抵御外敌）而在另一个维度上冲突（争夺领导权）。
  一个群体内部的冲突和合作同时存在。

  冲突不预设:
  - 暴力（制裁、排斥、诉讼都是冲突形式）
  - 对等性（一方强一方弱的冲突仍然是冲突）
  - 合理性（冲突的理由可以被分析但不被评价）
  - 结果（冲突可以以一方获胜、双方妥协、持续僵局或外部干预结束）

logical_implications:
  - "冲突 ⇒ 存在至少一个 Agent 意图损害另一方"       # 从 (b)
  - "冲突 ⇒ 存在交互"                                # 从 (a)
  - "冲突 ⇒ 消耗资源"                                # 从 (c) + PHY-002
  - "竞争 + 直接交互 + 意图 ⇒ 冲突"                   # 竞争升级为冲突的条件
  - "冲突 ≠ 竞争的必然结果"                           # 竞争可以不升级为冲突
  - "冲突 + 权力 ⇒ 权力高的 Agent 大概率胜出"         # 为后续公理留接口

domain: [基础概念]
depends_on: [CONCEPT-agent, CONCEPT-goal, CONCEPT-interaction, CONCEPT-competition, CONCEPT-resource, CONCEPT-information]
l0_constraints:
  - PHY-002: "冲突消耗能量——战斗、争论、制裁都消耗属于各方的有限资源"
  - PHY-003-b: "空间排他 ⇒ 领土/空间的直接占有是冲突的天然引爆点"
  - PHY-001: "冲突中信息不对称——各方对对手的实力/意图的信息不完美且会衰减"
