id: CONCEPT-exchange
term: "交换 (Exchange)"
人话摘要: "'交换'指双方你情我愿地互相让出各自的东西(物品、服务、信息都行),换完后每一方都觉得自己更划算了;它不创造新资源,只是把已有资源挪到更需要它的人手里。被强迫的不算交换,那叫掠夺。"
definition: |
  两个或多个 Agent 之间自愿的资源转让——每一方放弃对某种资源
  的控制，以换取对另一种资源的控制，且各方都偏好交换后的状态
  甚于交换前的状态。

  必要特征:
  (a) 自愿性——参与交换的每一方都是自愿的。如果 A 用暴力或威胁
      迫使 B "交换"，那不是交换，是掠夺。自愿性的判据：
      在 Agent 的信息和选择范围内，交换是其偏好的行动方案
  (b) 双向转让——每一方都给出一些东西并收到一些东西。
      单向的资源流动（赠予、纳贡、偷窃）不是交换。
      （注意："收到的东西"可以是实物、服务、信息、承诺——
      不限于物质资源）
  (c) 偏好改进——交换后，每一方都认为自己的状态比交换前更好
      （在交换时的信息和偏好下）。这不需要客观的"价值相等"——
      只需要主观的双方都觉得自己赚了。交换创造的不是资源，
      是资源配置的改进
  (d) 所有权变更——交换后，转让的资源由接收方控制。
      资源的所有权/控制权发生了转移（来自 CONCEPT-resource）
  (e) 互惠预期——每一方给出资源是因为预期会收到对方的资源。
      在即时交换（一手交钱一手交货）中，互惠预期是同步兑现的。
      在延时交换（信用/赊账）中，互惠预期跨越时间——
      A 现在给出，预期 B 将来回报

  交换与相关概念的区分:
  - 交换 vs 合作: 合作是共同生产（A 和 B 一起做一件单独做不了的事），
    交换是各自拥有的东西互相转让。合作创造新资源，交换重新配置已有资源。
    合作中双方可以交换（分工 + 交换 = 贸易），但合作 ≠ 交换
  - 交换 vs 赠予: 赠予是单向转让，不要求对方回馈。
    （但赠予可以产生社会债务——"欠人情"——这不是交换，
    而是创造了关系中的不对称，后续可能有交换来"还人情"）
  - 交换 vs 竞争: 竞争是双方争同一资源，交换是双方各自给出不同资源。
    交换可以是竞争的替代方案——不是争同一块肉，而是我用工具换你的肉
  - 交换 vs 掠夺: 掠夺是非自愿的。交换要求双方自愿

  交换不预设:
  - 等价性（双方对价值的判断是主观的——不存在客观的"公平价格"）
  - 货币（以物易物是交换，货币只是交换的中介）
  - 语言/合同（默契的交换——A 帮 B 梳毛，B 稍后帮 A 梳毛——仍是交换）
  - 同时性（延时交换——A 现在给，B 以后还——仍是交换，
    但引入了信任/违约风险）
  - 对等规模（"用一根针换一座房子"可以是自愿交换——只要双方都觉得值）

logical_implications:
  - "交换 ⇒ 存在 ≥2 个 Agent 且各自控制不同资源"          # 从 (b)+(d)
  - "交换 ⇒ 双方偏好都得到满足"                           # 从 (c)——帕累托改进
  - "交换 ⇒ 资源配置改变但不创造新资源"                   # 从 PHY-002
  - "交换 + 重复 ⇒ 交换模式（市场/贸易网络）"              # 为公理留接口
  - "交换 + 信息不对称 ⇒ 可能被利用"                      # CONCEPT-information
  - "延时交换 ⇒ 需要信任/执行机制"                        # 从 (e)——为制度和规范留接口
  - "交换 ≠ 合作 但可与合作组合"                           # 分工→交换→更高的生产效率

domain: [基础概念]
depends_on: [CONCEPT-agent, CONCEPT-resource, CONCEPT-interaction, CONCEPT-choice, CONCEPT-relation, CONCEPT-information]
l0_constraints:
  - PHY-002: "交换不创造能量/物质——它只重新分配已有资源。'交换创造价值'是指资源配置改进，不是指物理创造"
  - PHY-003-b: "空间排他性 ⇒ 资源的地理分布不均 ⇒ 交换的动机——A 所在地富产 X 但缺 Y，B 所在地富产 Y 但缺 X"
  - PHY-003-a: "信息延迟 ⇒ 交换价格/条件的信息传播受通信速度约束——'市场信息不对称'有物理根源"
