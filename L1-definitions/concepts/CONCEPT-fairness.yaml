id: CONCEPT-fairness
term: "公平 (Fairness/Justice)"
人话摘要: "'公平'不是指'每个人都拿一样多'——那只是公平的一种。公平的本质是一群人对'怎么分、怎么罚、怎么对待彼此才算说得过去'达成的共同判断;真正说明这个判断不是嘴上说说的,是有人愿意自己吃亏也要维护它、或揪出破坏它的人。"
definition: |
  公平是受影响的主体之间共享的、关于一项分配/程序/对待是否符合某个可接受标准的判断——
  其中判断的"真诚性"的行为标志是:主体愿意付出个人代价来执行或捍卫该标准。

  必要特征:
  (a) 共享性——公平标准存在于多个 Agent 的认知中。"我觉得亏了"是个人不满,
      不是公平判断。公平要求至少部分受影响的 Agent 共享同一标准
      （来自 CONCEPT-norm:共享期望是规范的基础；公平是一种特殊的规范）。
  (b) 比较性——公平总是关于"这个 Agent 相对于那个 Agent 如何被对待"，
      或相对于某个参考点如何被对待。公平是一个比较概念，
      不存在只关乎单个人的"公平"（来自 CONCEPT-relation:公平是关系性的）。
  (c) 规范性——公平规定"应该如何"，而非描述"实际如何"。
      一个不公平的分配仍然是分配；公平是关于它的合法性判断
      （来自 CONCEPT-norm 的规范性维度）。
  (d) 代价执行——感知到违反公平标准会激发有代价的行动:
      惩罚、抗议、退出合作、或至少 withhold 未来的合作。
      "我认为这不公平但我什么都不做"——这种判断的真诚性是存疑的。
      代价执行是公平区别于"偏好"的关键标志:偏好被侵犯未必引发
      代价回应，公平标准被侵犯则系统地引发(来自 THEOREM-conflict-cost:
      执行规范消耗资源，公平也不例外）。
  (e) 标准依赖——"公平"的具体内容(平等分?按贡献分?按需要分?抽签?先到先得?)
      取决于所采用的标准。公平是属(genus)，平等/应得/程序公正是种(species)。
      不同群体、不同领域、不同时期可以采纳不同的种，但属的结构(共享+比较+
      规范+代价执行)是跨情境恒定的。

  公平与相关概念的区分:
  - 公平 vs 规范: 规范是"我们这里这么做"，公平是"这么分/这么对待是
    说得过去的"。所有公平判断都是规范的一种，但并非所有规范都关乎公平。
    给小费 15% 是规范但不是公平判断;'他拿得比我多这不公平'是公平判断。
    公平的特殊性在于它总是涉及分配/对待的合法性，并且其违反引发
    特别强烈的代价执行动机（比一般规范违反更强）。
  - 公平 vs 平等: 平等(每人拿一样多)只是一种特定的公平标准(种)，
    不是公平本身(属)。论功行赏、按需分配、先到先得、抽签随机——
    都是公平的不同种。把公平等同于平等是把属和种混了。
  - 公平 vs 利他/慷慨: 利他是"我给你好处不求回报";公平是"你我之间
    的交换或分配合乎共享标准"。利他可以不求对等，公平要求对等或
    合比例。
  - 公平 vs 法律/制度: 法律是专门化执行机构背书的规则;
    公平是社会层面的共享判断，不需要专门化执行者。
    法律常常宣称以公平为目标，但"合法"和"公平"不是一回事。

  公平不预设:
  - 某个特定的分配标准(属不预判种)
  - 全体一致同意(一个群体内可以存在关于公平标准的争议——
    事实上这种争议是政治的核心内容)
  - 公平总是胜出(权力、自利、内群体偏好可以压倒公平，但压不垮
    公平判断的代价执行动机——这是公平的社会动力学来源)
  - 公平是"客观的"(它是共享的主体间判断，不是物理量)

logical_implications:
  - "公平主张 ⇒ 存在共享标准 + 至少部分受影响的 Agent 接受该标准为有效"    # 从 (a)
  - "公平主张 ⇒ 主张内含比较(Agent A 的对待 vs Agent B / vs 参考点)"      # 从 (b)
  - "感知不公 ⇒ 有代价执行动机(惩罚/抗议/退出/withhold)"                  # 从 (d)
  - "持续不公 + 无补救 ⇒ 合作解散"                                        # (d) + CONCEPT-cooperation
  - "不公感知 + 无合法渠道表达 ⇒ 暴力/退出/瓦解"                            # 与 DED-011 接口
  - "公平标准是内群体绑定、外群体排斥的——同一个行为对'自己人'被判为不公、
    对'外人'被判为可接受的概率不同"                                        # 与 BR-L2-006 接口
  - "公平标准可被权力强加——但强加的标准缺乏'真诚接受'的行为标志
    (无自发代价执行)，从而与真正共享的标准可区分"                           # 与 CONCEPT-power 接口

domain: [基础概念, 道德心理学, 政治哲学]
depends_on: [CONCEPT-agent, CONCEPT-norm, CONCEPT-relation, CONCEPT-competition, CONCEPT-cooperation, CONCEPT-exchange, CONCEPT-power, CONCEPT-resource]
l0_constraints:
  - PHY-001: "共享的公平标准若无持续交互则衰减——'好久不打交道的群体不再共享同一套'什么算公平'的判断'是熵增在社会信息层的表现"
  - PHY-002: "执行公平标准消耗能量——惩罚、抗议、退出、制裁都是要花资源的行为"
  - PHY-003-a: "通信延迟限定了公平标准的传播半径——地理分散的群体更难维持同一套公平判断"
