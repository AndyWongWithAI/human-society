id: AXIOM-002
term: "信息熵增公理 (Information Entropy Axiom)"
type: definitional_axiom
layer: L1-definitions

statement: |
  Agent 持有的信息若不投入能量维持或刷新，随时间必然衰减——
  准确度下降、细节丢失、最终变得不可用。

人话摘要: "记住的东西不时常温习、记录不去维护,就会随时间慢慢模糊、走样、最后没法用——信息会自然衰减,保鲜是要花力气的。"

formal_statement: |
  ∀i ∈ Information, ∀a ∈ Agents, ∀Δt > 0:
    (holds(a, i, t) ∧ ¬invest(a, energy, maintain(i), [t, t+Δt]))
    ⇒ fidelity(i, t+Δt) < fidelity(i, t)

derived_from_concepts:
  - CONCEPT-information: |
      "Agent 可用于决策的环境状态表征"。表征的精确度不是免费的——
      它依赖物理基底（记忆、记录、信号）
  - PHY-001: |
      熵增定律——孤立系统的熵永不减少。信息是物理编码的——
      无论是神经元突触权重、纸张上的墨迹、还是电磁信号——
      都服从热力学第二定律。无能量维护 ⇒ 物理基底退化 ⇒ 信息衰减

l0_grounding:
  - PHY-001: "这是熵增定律在信息层的直接应用。信息不是抽象的——
    它必须编码在物理基底上（神经元、纸张、电磁波），而物理基底服从热力学。
    信息论的熵和热力学的熵共享同一个数学结构（Shannon 1948）。
    信息的衰减不是比喻——它是物理必然。"

negation_test:
  proposer_argument: |
    "否定本公理等于声称：信息可以在零能量维护下无限期保持精确。
    这要求信息脱离物理基底存在——即信息是柏拉图式的抽象实体，
    不依赖于任何物理实现。但如果信息没有物理基底，
    它无法被 Agent 存储或使用（CONCEPT-agent: Agent 需要感知环境状态，
    这本身就是物理过程）。

    因此信息必须有物理基底。有物理基底 ⇒ 服从 PHY-001。
    ⇒ 无能量维护 ⇒ 衰减。QED。"

  challenger_argument: |
    "有两个漏洞：

    1. 数字信息在理想存储介质上可以不衰减——一个 SSD 在断电后
    可以保持数据多年不变。信息的衰减速度可以极慢，
    '必然衰减'在实践上等价于'不衰减'。

    2. 冗余可以对抗衰减——如果一个 Agent 反复背诵同一段信息，
    或者多个 Agent 各自持有同一信息的副本，
    信息可以在没有'额外能量'的情况下通过重复使用来维持。
    本公理的'不投入能量 ⇒ 衰减'过于绝对。"

  proposer_rebuttal: |
    "针对 challenger 的两点：

    1. '极慢衰减 ≠ 不衰减'。SSD 存储的电荷确实在泄漏——
    只是时间尺度长。本公理断言的是逻辑必然性（最终会衰减），
    不是工程速度。在人类社会的演化时间尺度上（数万年），
    没有任何物理信息存储是永久的。即使是口头传统
    （通过重复背诵维持——这本身就是能量投入！）也会漂移。

    2. Challenger 的'冗余对抗衰减'论证恰好证实了本公理：
    冗余和重复背诵就是能量投入的形式。神经元每次放电消耗 ATP，
    每次背诵都是能量投入。'重复使用'不是免费的——
    它消耗能量。本公理没有说必须投入'额外'能量——
    它说的是不投入能量 ⇒ 衰减。'重复使用' = 投入能量。

    修正的理解：维护信息的能量可以来自显式维护（抄写、备份）
    或隐式维护（使用、回忆、传播）——但无论如何，零能量 = 零维护 = 衰减。"

  verdict: passes
  verdict_rationale: |
    Challenger 的两项质疑——衰减速度可极慢、冗余可作为维护——均有效，
    但均未击中公理的核心主张（'无能量 ⇒ 衰减'的逻辑必然性）。
    Proposer rebuttal 成功反击了两点：极慢 ≠ 不衰减；
    冗余/重复使用本身就是能量投入的形式。
    公理成立。

