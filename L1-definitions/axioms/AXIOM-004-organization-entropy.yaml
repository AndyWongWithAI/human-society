id: AXIOM-004
term: "组织熵增命题 (Organization Entropy — derived)"
type: derived_axiom   # 2026-07-13 元审查重标：原 definitional_axiom
layer: L1-definitions

# === 认识论重标 (META-REVIEW-001, 2026-07-13) ===
# 本条原列为与 AXIOM-001/003 并列的【地基公理】。第一性原理元审查判定：
# 它并非独立地基，而是可从 AXIOM-002(信息熵增) + CONCEPT-organization 定义
# 【派生】的结果(见下方 derivation)。地基公理应互相独立——本条不是。
# 保留 id=AXIOM-004 与原路径仅为【引用稳定】(设计原则#4：避免打断
# THEOREM-conflict-cost / organization-resource-competition / norm-energy-saver
# 三处引用)；type 已由 definitional_axiom 降为 derived_axiom 以诚实反映派生地位。
# 其物理承载【继承自 AXIOM-002】，非独立向热力学借威望。
epistemic_status:
  reclassified_from: definitional_axiom
  reclassified_to: derived_axiom
  derives_from: [AXIOM-002, CONCEPT-organization]
  reason: >
    地基公理应互相独立。本条的物理必然性并非独立成立，而是 AXIOM-002
    (信息不维持则必衰减) 作用在"组织协调机制本质是信息"这一定义上的直接后果。
    故它是定理性的派生结果，不是地基。
  id_retained_for: "引用稳定 (设计原则#4：固定路径避免打断 3 处 THEOREM 引用)"
  established_by: META-REVIEW-001

derivation:
  from_axioms: [AXIOM-002]
  from_concepts: [CONCEPT-organization, CONCEPT-information]
  steps:
    - "CONCEPT-organization: 组织核心是协调机制(规则/程序/惯例)——本质是信息(谁做什么、何时、怎么做)。[定义]"
    - "AXIOM-002: 信息不投入能量维持则必然衰减。[已验证的物理承载]"
    - "∴ 组织协调信息不维持则衰减 ⇒ 协调能力下降 ⇒ 组织秩序退化。"
    - "承重链只经 AXIOM-002 的信息衰减;【不】依赖'成员时间/注意力=热力学能量'的类比等式。"

statement: |
  任何组织（有序的社会结构）若不持续投入能量维持其协调机制，
  将必然向无序退化——结构模糊、规则失效、成员流失、
  最终组织不复存在。

人话摘要: "任何组织,只要不持续花精力去维护它的协调规矩(谁干什么、怎么配合),就会自然涣散——结构变乱、规矩失灵、人走光,最后散伙。"

formal_statement: |
  ∀O ∈ Organizations, ∀Δt > 0:
    (¬invest(O, energy, maintain_coordination, [t, t+Δt]))
    ⇒ order(O, t+Δt) < order(O, t)

derived_from_concepts:
  - CONCEPT-organization: |
      组织是"具有内部分工和协调机制的持久结构"。
      "组织需要能量来维持" (logical_implications)，
      "组织是高度有序的结构 ⇒ 熵增不断侵蚀之" (l0_constraints)
  - CONCEPT-cooperation: |
      "合作是一种低熵状态（高度有序的协调）⇒ 需要持续能量输入来维持" (l0_constraints)
  - CONCEPT-information: |
      协调机制本质是信息（谁做什么、何时做、怎么做）——
      信息的衰减 (AXIOM-002) 直接侵蚀组织的协调能力

l0_grounding:
  - PHY-001: "熵增定律——任何有序结构的自然趋势是趋向无序。
    组织是社会层面的有序结构，不能豁免热力学第二定律。"
  - PHY-002: "维持秩序（抵抗熵增）需要做功——组织的能量预算
    约束其规模、复杂度和寿命。能获取多少能量决定能维持多大的秩序。"

negation_test:
  proposer_argument: |
    "否定本公理等于声称：有序结构可以不需要能量输入而永久维持。
    这直接与 PHY-001（熵增定律）矛盾。

    组织的核心是协调机制（CONCEPT-organization(c)）——
    规则、程序、惯例。这些协调机制是信息，而信息按 AXIOM-002
    无能量维护则衰减。因此：

    PHY-001 + AXIOM-002 ⇒ 组织的协调信息必然衰减
    ⇒ 组织必然向无序退化
    ⇒ 需要持续能量输入来抵抗这个趋势

    这不是管理建议——这是热力学。"

  challenger_argument: |
    "有几个问题：

    1. **组织可以设计为'自维持'的**——例如，将维护规则的责任分配给
    成员作为其正常职能的一部分。在这种情况下，维持组织的能量
    来自成员执行其正常职能——不需要'额外'的能量投入。
    组织可以像晶体一样——一旦形成，就稳定在低能态。

    2. **组织的'能量'概念模糊**——成员的时间和注意力算不算能量？
    如果算，那么任何有人参与的组织自动就在投入能量——
    因为成员活着就在消耗能量。本公理退化为'有人的组织就在投入能量'，
    失去了预测力（它不能告诉我们什么样的组织会崩溃）。

    3. **有些组织确实可以'自动驾驶'很久**——惯例和惯性可以维持
    组织运转，即使没有人在积极'维护'它。一个运行了 50 年的
    乡村集市，没有人管理，但每年同一天大家自动聚集——
    这不是能量投入，这是惯性。"

  proposer_rebuttal: |
    "Challenger 的三点：

    1. **'自维持' = 能量投入**。成员执行维护职能就是在投入能量——
    他们的时间和注意力是有限资源 (PHY-002)。
    '不需要额外能量'≠'不需要能量'。晶体只在绝对零度下稳定——
    在有限温度下，即使晶体也在缓慢退化（扩散、氧化）。
    组织不是晶体——它由 Agent 组成，Agent 会死亡、遗忘、改变目标。

    2. **'能量'概念确实需要精确化，但这不削弱公理**。
    成员的时间和注意力是能量投入的具体形式——
    CONCEPT-resource 将时间列为资源，资源消耗 = 能量消耗 (PHY-002)。
    本公理的预测力不在于'哪个组织何时崩溃'（那是经验问题），
    而在于'零能量投入 ⇒ 必然崩溃'（这是逻辑必然）。
    至于具体需要多少能量维持——那是 L2 桥接层的问题。

    3. **'无人管理的乡村集市'恰恰证实了本公理**。
    每年同一天大家自动聚集——这不是'零能量投入'。
    每个人记得日期、决定去、花时间去——每个步骤都是能量投入。
    '惯性'不是物理惯性（无能量消耗），它是社会惯性——
    而社会惯性正是由每个参与者的持续能量投入维持的。
    如果所有人同时遗忘这个集市（信息衰减——AXIOM-002），
    它会在一年内消失。'自动'≠'零能量'。

    核心主张不变：零能量投入 ⇒ 组织必然退化。
    这个主张是 PHY-001 在社会结构层的直接推论。"

  verdict: passes
  verdict_rationale: |
    Challenger 的三点质疑——自维持设计、能量概念精确性、惯性——
    都是对公理应用边界的有效讨论，但均通过 proposer rebuttal 被有效化解。
    关键区分——'不需要额外能量'≠'不需要能量'、'惯性'≠'零能量'——
    是 rebuttal 的核心贡献，并且是成立的。
    公理通过。

  unresolved: false
  contested_by: []
  date: 2026-07-13

# === 承重澄清 (META-REVIEW-001, 2026-07-13) ===
warrant_clarification: >
  上方 negation_test 是历史对抗记录，保留不改。但须诚实标注其承重点：
  proposer_rebuttal 中"自维持=能量投入""成员时间/注意力是能量"等表述，按本体系
  Rule A 的 physics_language_rule 属【隐喻滑坡】——社会"熵"不是热力学熵，一个涣散
  组织并未增加可测的物理熵。这些能量等式【不是】本条的真实承载。真实承载是上方
  derivation：AXIOM-002(信息必衰减)作用于"协调机制本质是信息"。若本条曾以 L3 推论
  身份提交，其能量类比会被 physics_language_rule 判红旗——这正是把它从地基公理
  降为派生结果(derived_axiom)的另一佐证。

domain: [组织理论, 派生命题]
created: 2026-07-13
