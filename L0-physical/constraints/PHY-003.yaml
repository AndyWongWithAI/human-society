id: PHY-003
statement: |
  时空约束 —— 物理世界的时空结构对一切物质过程施加的边界条件。

  (a) 因果序：果不能先于因。信息/信号的传播速度有上限（光速）。
  (b) 空间排他性：两个宏观物体不能同时占据同一空间位置。
  (c) 地理不均匀性：物质和能量在空间中分布不均匀。
  (d) 时间不可逆性：时间单向流动。已发生的事件不可撤销（但可以被后续事件改变其效应）。

type: physical_constraint
source: physics (relativity + classical mechanics)

social_implications:
  - "一个人不能同时出现在两个地方 → 个体的注意力/行动力在空间上是稀缺的"
  - "物质资源必须物理运输 → 资源的地理分布塑造贸易、定居、冲突的地理格局"
  - "信息传递需要时间 → 社会协调的规模受限于通信速度。大规模集权需要快速通信"
  - "时间不可逆 → 社会决策有不可消除的机会成本。选择了 A 就不能同时选择 B"
  - "空间排他性 → 领土是排他性资源。两块地——两群人不能同时在上面建立互斥的主权"

depends_on: []
contradicts_nothing: true
