id: PHY-001
statement: |
  熵增定律 —— 孤立系统的熵永不减少。

  三个等价表述：
  (a) 热力学：任何宏观过程不可逆——有序结构趋向无序，除非持续注入自由能。
  (b) 统计力学：系统自然趋向概率最高的宏观态。有序态是相空间中极小体积的区域。
  (c) 信息论：孤立系统中，信息量只会减少或不变，不可能自发增加。

人话摘要: "东西放着不管就会自然变乱、变坏(这就是热力学第二定律);社会里的制度、组织、知识也一样——不持续投入精力去维护,就会自然松散、退化,不存在'一次建好就永远管用'的秩序。"

type: physical_constraint
source: thermodynamics

social_implications:
  - "任何社会秩序（制度、规范、组织）是一种低熵状态，需要持续能量/资源输入来维持——不存在'一次性建好就永远存在的制度'"
  - "信息的保真传递需要能量投入——口传知识、文本记录、制度记忆都会自然衰减，除非有维护机制"
  - "社会复杂度有上限——一个社会能维持的秩序复杂度受限于其可获取的能量/资源"

contradicts_nothing: true       # 该约束与已知物理学无矛盾
