id: PHY-002
statement: |
  能量守恒定律 —— 能量不能被创造或消灭，只能从一种形式转换为另一种形式。

  在任何孤立系统中，总能量保持恒定。能量输入必须来自系统外部或预先存储。

人话摘要: "能量不会凭空冒出来,只能从别处搬来或从存货里取(即能量守恒);所以一个社会能干多少事,归根到底受制于它能弄到多少能量,没有'无中生有'的无限增长。"

type: physical_constraint
source: thermodynamics

social_implications:
  - "一切社会活动消耗能量——能量不会凭空出现。社会的总活动水平受限于其能量捕获能力"
  - "能量必须从某处获取——太阳辐射、化石燃料、核能、食物。社会必须将部分产出用于获取更多能量（能量回报率约束）"
  - "与 PHY-001 组合：秩序需要能量（熵增），能量是有限的（守恒）→ 社会复杂度的硬预算约束。没有'无限增长'的秩序"

depends_on: [PHY-001]
  # PHY-001 定义了秩序需要能量, PHY-002 定义了能量不能白来
  # 两者共同确立: 社会秩序受热力学预算约束

contradicts_nothing: true
created: 2026-07-13
