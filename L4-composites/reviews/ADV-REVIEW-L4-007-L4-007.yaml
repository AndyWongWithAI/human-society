        (1) 强度歧化指数（相关系数基础）——捕获"程度差异"，DED-026 可解释

        (2) 框架歧化指数（Tucker''s congruence < 0.85）——捕获"框架差异"，L4-007 独有

        仅当框架歧化指数也显著时，L4-007 获得超越 DED-026 单独的独立经验支持。


        独立复核确认: 修复有效。Tucker''s congruence 是公认的因子结构一致性指标，能区分"两组人用同一框架但打分不同"与"两组人用不同框架"。框架歧化指数测量的是"区别于 A 单独 + B 单独"的复合输出——DED-026 单独不预测因子结构分歧，DED-025 单独不预测多方向分歧。


        实践关切（非逻辑缺陷）: 因子结构歧化与强度歧化可能在实证中高度共线——两组人若因子结构完全不同，其跨群体评分相关系数通常也低。两个子指标可能在大多数实证案例中同方向变动。这不影响概念区分——概念区分是清晰的——但可能降低框架歧化指数作为"独有签名"的实证判别力。建议在实际检验设计中预设: 仅当强度歧化不显著而框架歧化显著时（分离案例），L4-007 获得最强支持；两者均显著时支持 L4-007
