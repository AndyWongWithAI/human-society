id: ADV-REVIEW-L4-007
target: L4-007
date: 2026-07-15
type: adversarial_review
layer: L4-composites
round: 1
reviewer: 独立对抗审查者 (全新上下文, round 1, 与作者及前几轮审查者无关)
人话摘要: L4-007 有真东西——DED-026 的边界增殖与 DED-025 的熵增通道并行化产生'多道德空间各自独立演化→不可通约'这一新预测，合取非平凡。但三处需定向修补：(1) 低密度×碎片化格的父子归属论证不足——DED-026 单挑实际预测碎片化而非'有限碎片化'；(2) 缺独立 anti_talisman_clause——尽管操作化限制已嵌入，但散落各处不如独立节硬朗；(3) DED-025
  的 per-bubble 扩展需显式论证——M3/M4 原文为社会整体层概念，并行化是 L4-007 的贡献而非 DED-025 已给的。判 needs_revision，给出 3 required + 2 should 最小修复清单。
standard_red_flags:
  1_brick_conclusion:
    verdict: pass
    note: "L4-007 的核心命题——\"数字通信从'桥'变为'墙'→信息泡增殖为新群体边界→\n每个泡内 DED-025 的熵增通道独立运转→多个互不通约的道德空间在同一地理社会内\n长期共存且歧化持续加深\"——不在任何单条父推论的结论中：\n\n- DED-026 单独结论: TP 强度在群体边界处结构性陡降（阶梯效应），群体边界可被\n  通信技术和共享灾难外推。DED-026 预测边界移动（扩展或收缩），不预测边界\n\
      \  *增殖*——即同一地理空间内冒出多个互不重叠、各自维持独立 TP+内化循环的\n  道德子空间。DED-026 讨论的是\"一条边界移到了哪里\"，不是\"为什么同时存在\n  多条不重叠的边界\"。\n\n- DED-025 单独结论: 道德标准通胀需 M1+M2 合取推动，紧缩是熵增默认——\n  M3 或 M4 任一激活标准自动松绑。DED-025 预测社会整体的方向变化（单一道德\n\
      \  空间内的收紧或松绑），不预测同一社会内不同亚群体可同时发生不同方向（甚至\n  相反方向）的道德标准变化。\n\n无单条父推论包含\"多个互不通约的道德空间长期共存且歧化持续加深\"这一\n结构性-动力学复合命题。L4-007 的非平凡内核不在任一父推论中。\n"
  2_cell_empty_prediction:
    verdict: pass
    note: 'L4-007 的 2×2 逐格判空（道德密度{低,高} × 信息生态{共享,碎片化}）中，

      "高密度×碎片化→严重碎片化+道德不可译性"是真正的经验主张——它预测

      不同信息泡的高密度道德判断将走向框架分歧（cross-group factor structure

      divergence）而非仅均值差异。可被证伪：若高道德密度议题的跨泡道德判断

      因子结构无显著差异（仅均值差异）→核心主张被削弱。


      "低密度×共享→碎片化最低"和"高密度×共享→整体变化同步"均为平凡格

      （双方一致或单条可预测），但这不是问题——逐格判空的目的不是要求每格

      都非平凡，而是确认至少有一个非平凡空格。见 L4 专属红旗 #13。

      '
  3_measurement_orthogonal:
    verdict: pass
    note: 'IV（信息源碎片化）由三维度独立测：(a) 信息源重叠指数（两随机个体共享

      信源比例），(b) 算法个性化程度（同一事件对不同用户曝光率方差），

      (c) 跨泡信息渗透率（一泡中事件在另一泡中的知晓率）。三者均为信息接触层

      指标，独立于道德判断内容。


      DV（道德碎片化指数）由跨群体道德判断的结构性歧化指数测：

      1 - [跨群体评分相关系数/群内评分相关系数]。独立于 IV。


      中介变量（TP 协调瓦解）由判断一致性和跨泡 TP 频率独立测，不共享 IV/DV

      的测量源。


      轴正交。局限（操作化中已诚实标注）不影响正交性。

      '
  4_excluded_outcomes:
    verdict: pass
    note: "五个排除结果均有事前可测的独立渠道：\n- \"碎片化绝对速度/时间表\": 本推论只做方向性+结构性预测，不做速率定量。\n- \"具体哪个道德领域先碎片化\": 由外部历史偶然性决定，不在射程内。\n- \"仅政治态度分化而无道德判断歧化\": 政治极化≠道德碎片化——独立判据\n  （态度差异 vs 框架差异）可事前区分。\n- \"法律强制统一的道德标准\": 属 L4-006\
      \ 路径，独立于本推论射程。\n- \"单一信息泡内的道德标准变化\": 本推论预测跨泡关系非泡内动力学。\n\n射程和排除钩子均独立于结果，无\"事后因结果调整射程\"的结构性漏洞。\n"
  5_classification_bin_match:
    verdict: pass
    note: '2×2 判据表（道德密度{低,高} × 信息生态{共享,碎片化}）→ 四格。

      道德密度的低/高分割有操作化判据（低密度 1-3 条信息可判定，中密度 4-10 条，

      高密度 >10 条——本推论将低/中合并为"低"，高单独为"高"）。信息生态的

      共享/碎片化分割有量化阈值（共享比例>50%+方差<0.3 = 共享，共享比例<20%或

      方差>0.7 = 碎片化）。


      两维的二值化丢失了连续信息（道德密度是连续谱，碎片化也是连续谱），但

      对方向性预测而言四档足够。建议标注：二值化是为了呈现合取逻辑，实际检验

      中建议用连续测量+调节效应分析（道德密度 × 碎片化 交互项预测碎片化指数）。

      '
  6_anti_talisman:
    verdict: should_fix
    note: "L4-007 的反循环论证约束分散嵌入各操作化段的 limitations 中：\n- information_source_fragmentation.limitations: \"不得因'他们意见不同'反推\n  '他们信息源必碎片化'\" —— 覆盖了 IV→DV 方向。\n- moral_density.limitations: \"编码须在指定信息泡外、使用最广泛共享的信息\n\
      \  进行，不得动用特定信息泡内的独有语境信息\" —— 覆盖了道德密度测量的独立\n  性问题。\n- moral_fragmentation_index.limitations: \"道德碎片化≠政治极化\" —— 覆盖了\n  DV 判别效度。\n\n这些约束的内容实质存在且措辞硬朗。但与 DED-026 和 DED-025 各自拥有的\n独立 anti_talisman_clause\
      \ 节（含 3+ 硬约束 + meta_rule）相比，L4-007\n的约束散落各处、缺少统一的\"违反即循环论证\"的 meta 声明。\n\n建议（should，非 required——约束内容已存在）：新增独立 anti_talisman_clause\n节，至少覆盖四条硬约束：\n(1) 禁由\"道德判断分歧\"反推\"信息源必碎片化\"\n(2) 禁由\"碎片化存在\"反推\"\
      算法推荐必为主导信息源\"\n(3) 禁由\"跨泡道德判断一致\"反推\"信息源必共享\"\n(4) 禁由\"道德密度被判定为高\"反推\"碎片化必严重\"（道德密度须由独立编码者\n    使用最广泛共享的信息判定，不得动用特定信息泡内的独有语境信息——此条\n    已在 moral_density.limitations 中，移入统一 anti_talisman 节即可）\n+ meta_rule:\
      \ 任一违反则\"信息源碎片化→道德碎片化\"的核心因果链退化为\n循环论证。\n\nDED-026 和 DED-025 分别有 4 条和 3 条 anti-talisman 约束；L4 离地基更远，\n不应比 L3 更松。\n"
  7_real_world_anchor_fact_check:
    verdict: pass
    note: "三个支持锚点事实准确：\n- 美国口罩争议（2020-2021）：确实出现了两个信息泡对\"戴口罩\"的道德判断\n  截然相反的现象——左泡视为\"不顾他人健康\"的道德违规，右泡视为\"侵犯自由\"\n  的道德违规。时间线正确，描述准确。\n- George Floyd 后的短暂对齐与再碎片化（2020）：Floyd 被杀视频确实创造了\n  短期跨党派共识（警察暴力谴责率骤升），数月后重新碎片化（Defund\
      \ vs Back\n  the Blue）。时间线正确。\n- 中美社交媒体对同一国际事件的不可通约叙事：描述准确。\n\n反例（#MeToo）分析诚实——承认 #MeToo 成功跨泡但将其归入低道德密度议题\n（身体侵犯的信号足够强），与预测(ii)的道德密度梯度一致。confidence 标定\n诚实（high/moderate/moderate），confound 明确标注（政治身份重叠/政党精英\n\
      cue-taking/国家审查）。\n\n无事实性错误。\n"
  8_definition_vs_prediction:
    verdict: pass
    note: "\"若算法推荐替代共享信息源成为主导信息摄入渠道→则碎片化沿所述机制链发生\"\n是可证伪的预测：\n- \"算法推荐替代共享信息源\" = 独立可测的信息生态变化（通过信息源重叠指数\n  和算法个性化程度的纵向测量判定）\n- \"碎片化沿所述机制链发生\" = 四步机制链（信息泡=新群体边界→TP 协调瓦解→\n  泡内 M3+M4 独立运转→道德不可译性），每步有独立操作化\n\
      - falsifiability 给出了三个证伪条件，每个可独立检验\n\n条件句不是隐藏定义。\"道德密度调节碎片化梯度\"和\"共享威胁→暂时逆转\"均为\n可证伪的经验命题。通过。\n"
  9_enumeration_exhaustiveness:
    verdict: pass
    note: 'L4-007 不声称"可枚举的 N 类"。四个预测（i-iv）是分析推导的结构性+方向性

      预测，不是经验枚举的分类。预测覆盖了核心主张的不同侧面（不可译性、梯度、

      逆转、锁定），逻辑自洽。通过。

      '
  10_primary_suspect:
    verdict: pass
    note: 'primary_suspect 定位为预测(iii)的"共享威胁→暂时逆转"机制——理由是即使在

      共享威胁下，算法仍可能向不同用户推送不同框架使"共享威胁"本身被碎片化。

      这是合理的 primary 选择——若实证发现共享威胁在数字时代不再能显著提升跨泡

      TP 协调→预测(iii)被推翻。


      secondary_suspect 定位为预测(iv)的 M4 代际锁定——理由是数字原生代可能发展

      出跨泡信息消费习惯。这也是合理的——M4 锁定需要跨代数据验证，是最难短期

      检验的预测。


      unlikely_suspect 定位为 DED-026 的 TP-群体边界绑定和 DED-025 的 M3+M4 熵增

      通道——理由是二者均为跨文化稳健的已验证机制。定位准确——若这些被推翻，

      受影响的不止本推论。


      primary/secondary 分配合理。

      '
l4_exclusive_red_flags:
  11_spectator_brick:
    verdict: pass
    note: '【独立逐一移除检验——对照父推论原文逐机制检验】


      移除 DED-026 → 失去：

      (a) "TP 强度在群体边界处结构性陡降（阶梯效应）" —— 无法解释为何信息泡

      的边界会成为结构性约束 TP 的道德群体边界。碎片化将退化为"人们意见不同"

      而非"道德执行机制的结构性分裂"。

      (b) "群体边界可被通信技术和共享灾难外推" —— 无法解释预测(iii)的"共享

      威胁→暂时逆转"（共享威胁瞬时创造跨泡共享信息→暂时重新同步这一机制直接

      来自 DED-026 的''共享灾难外推群体边界''）。

      没有 DED-026，L4-007 失去"信息泡=道德边界"这一拓扑学基础——只剩 DED-025

      的社会整体方向变化，无法推出"多空间共存"。


      移除 DED-025 → 失去：

      (a) "M3（TP 瓦解）和 M4（代际内化断裂）是两条独立熵增通道" —— 无法解释

      为何碎片化会自强化+代际锁定。碎片化将是一次性的"分裂"事件而非持续的

      "歧化"过程。

      (b) "通胀需要刻意能量投入、紧缩只需维护能量断裂的方向不对称" —— 无法解释

      为何碎片化后的不同泡各自走向不同方向（而非全部收敛）——熵增默认使每个泡

      在没有 M1+M2 主动推动时倾向于松绑，而各泡的松绑起点和速度不同→走向歧化。

      没有 DED-025，L4-007 失去"各泡独立演化"的动力学——只剩 DED-026 的边界

      创建，无法推出"持续加深的不可通约性"。


      两条父推论各提供一条不可替代的因果通路：

      - DED-026 → 拓扑（为什么有多个空间）

      - DED-025 → 动力学（为什么各空间走向不同方向）

      无观众砖。

      '
  12_trivial_conjunction:
    verdict: pass
    note: '【本轮核心战场之一——平凡合取检验】


      L4-007 的核心主张不是"共享信息生态下道德共识可以维持（DED-026）AND

      信息碎片化下道德标准会松绑（DED-025）"——那是平凡 AND。


      L4-007 的非 AND 内容有三层：


      (a) DED-026 的机制在数字时代被部分反转（从"桥"到"墙"）：

      前数字时代的通信技术（广播/报纸）统一信息生态→DED-026 的边界外推逻辑成立。

      数字时代的算法推荐按用户画像分发个性化内容→同一技术不再统一信息生态，

      而是分裂它→产生"边界增殖"（同一地理空间内冒出多条互不重叠的信息泡边界）。

      这不是 DED-026 预测的"边界移动"（同一边界位置变了），而是新现象（多条

      新边界同时出现）。


      (b) DED-025 的熵增通道从"社会整体"并行化为"每个信息泡独立运转"：

      DED-025 的 M3/M4 原文是社会整体层概念——"TP 是社会整体的执行机制在瓦解"。

      L4-007 的扩展：当社会被信息泡分割后，M3 在泡间层面运作（跨泡 TP 协调瓦解

      因利益占比为零），而泡内的 TP 可能反因群体凝聚而加强（"我们的人还在管"）；

      M4 在每个泡内独立运作（新一代在其泡内接收泡的对等性信号→内化泡的规范→

      代际锁死泡的规范）。每个泡的 M3+M4 状态由其内部条件独立决定→不同泡走向

      不同方向。


      (c) 道德不可译性：不同泡之间连"什么算不公平"的共享前提都瓦解了——不是

      "你判得重我判得轻"（程度差异），而是"你判的事情我根本没在我的信息生态

      中见过"（框架差异）。程度差异可由 DED-026 单独解释（群体边界→TP 阶跃）

      + DED-019（内群体扭曲公平感知）。框架差异需要泡内规范体系的独立演化

      （DED-025 的熵增通道在泡内独立运转）→这不是任一父推论的结论。


      裁决：(a)(b)(c) 叠加构成非 AND 内容。L4-007 不是平凡合取。通过。


      但诚实标注：(a) 中的"反转"措辞可能过强——数字通信并非在所有方面都是

      "墙"（如 Floyd 视频仍可跨泡传播→DED-026 的边界外推机制在特定条件下仍

      运作→这正是预测(iii)的内容）。建议将"反转"弱化为"主导机制从外推转为

      增殖"或"数字通信从以''桥''为主变为以''墙''为主"。这不是逻辑错误，是措辞

      精度问题——已在 should_fixes 中给出。

      '
  13_emergence_missing:
    verdict: needs_revision
    severity: required
    note: "【本轮审查核心产出——多父逐格判空归属分析（独立重做，对照父推论原文）】\n\n## Step 1 — 提取每条父推论的核心自变量\n\nDED-026 核心自变量:\n- 群体边界（内/外）: 调节 TP 强度的结构性断点\n- 通信技术: 边界外推渠道之一（使远方可见）\n- 共享灾难/共同敌人: 边界外推渠道之二（创造新\"我们\"）\n- 旁观者人数: 利益占比稀释因子\n\
      \nDED-025 核心自变量:\n- M1（受害叙事涌现）: 通胀必要条件之一（可共情的伤害叙事的成功建立）\n- M2（道德创业者）: 通胀必要条件之二（超额投入者打破集体行动困境）\n- M3（TP 瓦解）: 紧缩通道之一（利益占比稀释→旁观者停止惩罚）\n- M4（代际内化断裂）: 紧缩通道之二（对等性信号断裂→新一代不内化）\n\n关键观察: L4-007 的 2×2 网格使用\"\
      信息生态{共享,碎片化}\"和\"道德密度\n{低,高}\"作为维度——这两个维度均非任一父推论的核心自变量。DED-026 和\nDED-025 均无\"信息生态\"或\"道德密度\"概念。这意味着 L4-007 的网格已经是\n将父推论机制翻译到新概念空间后的产物，而非父推论自变量的直接笛卡尔积。\n这不构成问题——L4 的贡献之一就是引入新的组织概念——但需在逐格归属中\n显式说明翻译关系。\n\
      \n## Step 2 — 父推论自变量到 L4-007 网格维度的翻译\n\n\"信息生态{共享,碎片化}\" ← 这是 L4-007 引入的新变量。它映射到:\n- DED-026 的\"通信技术\"渠道: 前数字通信技术→共享信息生态（桥），算法\n  推荐→碎片化信息生态（墙）。这是 L4-007 的新论证，DED-026 原文不做\n  此区分。\n- DED-025 的 M1\
      \ 叙事可共情性: 共享信息生态→M1 叙事统一传播；碎片化\n  信息生态→M1 叙事沿泡边界受阻。\n\n\"道德密度{低,高}\" ← 这也是 L4-007 引入的新变量。它映射到:\n- DED-025 的 M1 叙事可共情性: 低密度议题的信号强、所需语境少→M1 叙事\n  可共情性高；高密度议题依赖细粒度语境→M1 叙事可共情性低。\n- DED-026: 不直接讨论道德密度。最接近的概念是\
      \ TP 强度∝利益占比——但\n  利益占比与道德密度是不同概念（利益占比关乎\"多在乎\"，道德密度关乎\n  \"需要多少信息才能判断对错\"）。\n\n## Step 3 — 笛卡尔积逐格归属（2×2 网格）\n\n| 道德密度 \\ 信息生态 | 共享 | 碎片化 |\n|---|---|---|\n| 低密度 | 碎片化最低（双方一致预测共识维持——平凡） | 碎片化有限（见下方深度分析）\
      \ |\n| 高密度 | 整体变化同步（DED-025 可单独预测方向——非碎片化） | 严重碎片化+道德不可译性（需 DED-026+DED-025 合力） |\n\n### 逐格深度分析\n\n**Cell-A [低密度×共享 → 碎片化最低]**\nDED-026: 共享信息生态→无信息泡边界→TP 在群体边界处阶跃（映射到原有的\n非数字群体边界，如民族/宗教）而非信息泡边界→道德碎片化不由信息泡驱动。\n\
      DED-025: 共享信息生态→M1 叙事可达全体→社会整体通胀/紧缩→标准方向一致。\n双方预测方向一致（共识可维持）。平凡格。标注: trivial consensus。\n\n**Cell-B [高密度×共享 → 整体变化同步]**\nDED-025 可单独预测: 共享信息生态中，M1+M2 在场则通胀仍可发生（社会整体\n标准收紧）；M3+M4 激活则紧缩发生（社会整体标准松绑）。变化方向是社会\n\
      整体的→非碎片化。DED-026 对此格的附加价值有限（共享信息生态中信息泡\n边界弱，DED-026 的群体边界可能沿传统的民族/宗教等维度而非信息泡维度）。\n标注: DED-025 solo。\n\n**Cell-C [低密度×碎片化 → 碎片化有限]**\n【本格归属存在争议——是本轮审查的关键发现】\n\nL4-007 声称: \"DED-026 的信号强度+群体边界逻辑可单独预测此格方向\"\
      ——\n碎片化有限，因为低密度议题信号足够强仍可跨泡传递基本共识。\n\n独立复核:\nDED-026 的机制是: 信息泡=新群体边界→TP 在泡间结构性陡降。\n若严格应用 DED-026 到此格: 碎片化信息生态→信息泡成为新群体边界→TP 在\n泡间阶跃→应预测 *碎片化*（泡间 TP 协调瓦解），而非\"碎片化有限\"。\n\n要得到\"碎片化有限\"的预测，需要额外机制: 低道德密度议题的信号强度足以\n\
      部分穿透信息泡边界→基本共识可跨泡维持。这个\"信号强度调节边界渗透性\"\n的机制不在 DED-026 中。DED-026 讨论的是\"通信技术使远方可见\"（边界外推），\n不是\"特定类型的道德信号天然更可穿透边界\"。\n\n可能的补救论证:\n(a) DED-025 的 M1 叙事可共情性提供此机制: 低密度议题的受害叙事可共情性\n高（不需细粒度语境）→M1 可跨信息泡传播→即使碎片化，共识仍可部分维持。\n\
      但 M1 是通胀机制（推动标准变严），不是\"维持已有共识\"的机制。将 M1 用于\n解释\"已有共识为何不被侵蚀\"是对 M1 的功能扩展。\n(b) 将此格也标注为需要两父推论合力: DED-026 给边界存在→TP 阶跃（预测\n碎片化），DED-025 的 M1 给信号可跨泡（抵消碎片化推力）→合力预测为\n\"碎片化有限\"（两力抵消后的净效果）。\n\n裁决: L4-007\
      \ 当前的\"Cell-C 可被 DED-026 单独预测\"的声称论证不足。\nDED-026 solo 在此格更自然的预测是\"碎片化\"而非\"碎片化有限\"。\n\nRequired 修复: 要么 (a) 诚实将此格也标注为需要 DED-026 + DED-025 合力\n（两力相反方向→净效果为碎片化有限——这实际 *加强* 了涌现论证，因为\n现在有两个合力格而非一个），要么\
      \ (b) 提供清晰的论证说明 DED-026 的\n\"通信技术→边界外推\"机制如何直接蕴含\"低密度信号跨泡维持共识\"而不需要\n任何额外机制。\n\n**Cell-D [高密度×碎片化 → 严重碎片化+道德不可译性]**\n【需要 DED-026 + DED-025 合力——L4-007 的非平凡贡献格】\n\nDED-026 单独:\n信息泡=新群体边界→TP 在泡间结构性陡降→泡间\
      \ TP 协调瓦解→多个道德空间\n共存（每个泡维持自己的 TP 体系）。但 DED-026 不预测这些泡的道德标准会\n*持续歧化*——在只假设 DED-026 的世界里，各泡的道德标准会停留在分裂时的\n水平（各自的初始条件），不会在分裂后进一步走向不同方向。\n\nDED-025 单独:\nM3+M4→标准自然松绑→社会整体紧缩。但 DED-025 不预测\"不同泡松绑到\n不同方向\"\
      ——它的 M3/M4 是社会整体层概念，输出是\"社会整体的标准变化\"。\n\n合力才给出:\nDED-026 创建拓扑（多个信息泡=多条群体边界→多道德空间）\n+ DED-025 填充动力学（每泡内 M3 以\"我们的人还在管\"替代跨泡 TP + M4 代际\n锁死泡内规范→正反馈螺旋→泡内规范随时间向不同方向演化）\n→ 综合产物: 多个互不通约的道德空间在同一地理社会内长期共存且歧化持续\n\
      加深→道德不可译性（连\"什么算公平\"的共享前提都瓦解了）。\n\n单父推论检验:\n- 仅用 DED-026: 能说\"信息泡间 TP 弱\"，不能说\"泡内规范自强化→代际锁定\n  →不可逆\"——它不提供自强化动力学。\n- 仅用 DED-025: 能说\"M3+M4→整体标准松绑\"，不能说\"不同泡松绑到不同\n  方向\"——它的 M3/M4 是社会整体层概念，无\"并行多方向\"\
      的机制。\n\n裁决: Cell-D 是真正的多父合力格。标注: genuine synergy（需要 ≥2 父推论）。\n\n## Step 4 — 扩展笛卡尔积（用父推论原始自变量）\n\n为交叉验证，构建一个更贴近父推论原文的笛卡尔积:\n\n| DED-026 边界状态 | DED-025 M3+M4 激活状态 | 预测 | 归属 |\n|---|---|---|---|\n| 单一共享边界（前数字时代）\
      \ | 未激活 | TP 维持，标准稳定 | 双方一致 |\n| 单一共享边界 | M3 或 M4 激活 | 社会整体标准松绑 | DED-025 solo |\n| 多信息泡边界（数字碎片化） | 未激活（泡内 TP 维持） | 多道德空间共存但各自稳定（不歧化） | DED-026 solo |\n| 多信息泡边界 | M3（泡间瓦解）+M4（泡内锁定）每泡独立 | 多空间各自独立熵增→不可通约\
      \ | **两者合力** |\n\n使用父推论原始自变量的笛卡尔积确认: 有一个格（右下）需要两者合力。\n这与 L4-007 的 2×2 网格中的 Cell-D 对应。\n\n## Step 5 — 归零检查\n\n排除平凡格（Cell-A）、单父推论格（Cell-B, Cell-C 待修正），至少有一个\n格（Cell-D）需要 ≥2 父推论合力。Cell-D 是真正的交互——DED-026\
      \ 提供\n拓扑、DED-025 提供动力学，缺一不可。\n\n归零检查通过——这不是平凡合取/纯 L3 chaining。\n\n但是 Cell-C 的归属问题需要修正——见 required_fixes。\n"
