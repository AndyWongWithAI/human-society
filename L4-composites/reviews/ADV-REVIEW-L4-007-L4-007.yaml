      (2) 禁由"碎片化存在"反推"算法推荐必为主导信息源" (3) 禁由"跨泡道德判断一致"反推"信息源必共享" (4) 禁由"道德密度被判定为高"反推"碎片化必严重" + meta_rule: 任一违反则"信息源碎片化→道德碎片化"核心因果链退化为循环论证。L4 离地基更远，反循环约束不应比 L3 更松。若 round 3 仍未采纳→升级为 required。'
    affects: 新增 anti_talisman_clause 节
    carries_from: round_1_SF-1
  - id: SF-2
    priority: should
    title: 弱化"桥→墙"的二元叙事——兼容数字通信的桥功能案例（round 1 SF-2 未落地，本轮重申）
    description: '当前 L4-007 的叙事: "数字通信从''桥''变为''墙''"——暗示桥功能消失。但 Floyd 视频的跨泡传播（L4-007 自己的 Anchor 2）正是数字通信发挥桥功能的案例。L4-007 通过预测(iii)的"共享威胁→暂时逆转"吸收了此案例，说明桥功能并未消失——只是日常信息消费中被墙功能系统性占优。建议将"从桥变为墙"弱化为"数字通信从以''桥''为主变为以''墙''为主"或"数字通信同时具有桥和墙两种功能，但在个性化推荐的日常信息消费中，墙的功能系统性占优于桥的功能，桥的功能仅在共享事件/威胁时短暂激活"。这不影响核心机制逻辑，但使叙事更精确、更兼容自己的锚点数据。'
    affects: statement, emergent property 中的"从桥到墙"措辞
    carries_from: round_1_SF-2
  - id: SF-3
    priority: should
    title: Anchor 1 美国口罩争议的 confidence 从 high 降为 moderate-high（round 1 SF-3 未落地，本轮重申）
    description: 'Anchor 1 被标为 confidence=high，但 L4-007 自己承认"混杂政治身份重叠——难以完全分离''道德碎片化''与''政治极化''"。政治极化是 excluded_outcome——如果道德判断差异主要被政治身份解释，则对 L4-007 的信息泡机制支持较弱。建议: confidence 从 high 降为 moderate-high，并显式说明政治身份
      confound 对因果归因的限制。'
    affects: real_world_anchors.supporting.anchor_1.confidence
    carries_from: round_1_SF-3
  observations:
  - id: OBS-1
    severity: observation
    title: 时间约束——M4 代际锁定的直接检验需要代际时间尺度
    note: 'L4-007 最独特的预测（M4 代际锁定→持续加深的歧化）以 15-20 年代际窗口为检验周期。当前经验基础依赖 DED-025 M4 的已验证机制（BR-L2-019 发育窗口+对等性信号断裂→新一代不内化）作为理论支撑。这是 trajectory_prediction 的固有特征——方向性+结构性预测的检验需要时间。建议在 statement 或 falsifiability
      中显式标注: M4 锁定预测的代际时间约束及其对可检验性的含义。'
  - id: OBS-2
    severity: observation
    title: 框架歧化指数与强度歧化指数的实证共线风险
    note: 'RF-2 新增的框架歧化（Tucker''s congruence）与原有的强度歧化（相关系数比率）在概念上独立但在实证中可能高度共线——因子结构完全不同的两组，其跨群体评分相关系数通常也低。建议在实际检验设计中预设分层逻辑: 强度歧化不显著而框架歧化显著→L4-007 最强支持；两者均显著→支持 L4-007 但无法排除 DED-026 替代解释；强度歧化显著而框架歧化不显著→DED-026
      可独立解释，L4-007 被削弱。'
  - id: OBS-3
    severity: observation
    title: Cell-C 反向合力与 Cell-D 同向合力的涌现强度应区分标注
    note: 'Cell-C 的"合力"是两力相反→净平衡（反向合力），Cell-D 的"合力"是两力同向→产生新预测（同向合力/涌现）。两者逻辑地位不同——Cell-D 才是真正的涌现格。建议在 emergence_demonstration.multi_parent_cells 中显式区分: Cell-C = "弱涌现（反向合力，两力抵消）"，Cell-D = "强涌现（同向合力，产生单父推论无法给出的新预测）"。'
