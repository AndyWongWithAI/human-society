  15_anchor_theft:
    verdict: pass_with_caveat
    note: '逐一审查三个支持锚点的"复合特有"性:


      Anchor 1（美国口罩争议 2020-2021）:

      L4-007 的分析: 同一地理空间内两个信息泡对"戴口罩"的道德判断截然相反——

      不是惩罚强度差异（DED-026 单独可解释），而是"戴口罩是否构成道德问题"

      的判断框架本身分化（左泡: 不戴=不顾他人健康=道德违规；右泡: 被要求戴=

      侵犯自由=道德违规）。两边各自内化了自己泡的版本，跨泡 TP 协调为零。


      独立评估: 框架分化（连"什么算道德问题"的判断都分化了）确实超越了 DED-026

      单独可解释的范围（DED-026 预测内外群体对同一违规行为的惩罚强度不同，

      但不预测对"什么算违规"的判断本身分化）。框架分化需要独立的规范演化——

      即 DED-025 的熵增通道在各自泡内独立运转。这是真正的复合证据。


      但 L4-007 诚实标注了 confound（政治身份重叠——难以完全分离"道德碎片化"

      与"政治极化"）。confidence=high 可能偏高（考虑到 confound），建议降为

      moderate-high。


      Anchor 2（George Floyd 后的短暂对齐与再碎片化 2020）:

      "共享事件→暂时逆转→恢复且加速"的时间模式直接映射 DED-026 的"共享灾难→

      边界外推"机制。再碎片化后的加速（"双方各自加固了''对方是非理性的''的认知"）

      是复合元素——表明各自泡内的熵增通道在恢复后加速运转。


      但 L4-007 诚实标注: 重新碎片化可能由政党精英 cue-taking 驱动而非纯粹自发

      的信息泡动力学。confidence=moderate，合理。


      Anchor 3（中美社交媒体对同一国际事件的不可通约叙事）:

      展示了道德不可译性——"你判的事情我根本没在我的信息生态中见过"。这是

      复合预测的直接展示。但 confound 严重（国家审查+地缘政治利益），L4-007

      诚实标注。confidence=moderate，合理。


      裁决: 三个锚点提供了方向性一致的复合证据，confound 均被诚实标注。

      不存在锚点偷窃（将父推论各自的锚点复述为复合锚点）。但三个锚点均非干净

      实验证据（均有显著 confound），复合证据基础偏 anecdotal。


      caveat: Anchor 1 的 confidence 从 high 降为 moderate-high 应更诚实

      （政治身份 confound 的严重性被低估）。

      '
  16_interaction_measurement_gap:
    verdict: needs_revision
    severity: required
    note: "【复合输出变量的可测量性——独立于 A 单独 + B 单独】\n\nL4-007 的复合输出变量是\"道德碎片化指数\"（moral_fragmentation_index），\n当前操作化:\n(a) 按信息源重叠度聚类识别亚群体（独立于道德判断内容）\n(b) 对同一组道德违规 vignette，测量不同亚群体的 TP 强度和违规认定\n(c) 计算跨群体结构性歧化指数 =\
      \ 1 - [跨群体评分相关系数/群内评分相关系数]\n\n问题: 步骤(c) 的相关系数基础测量可能无法区分\"DED-026 单独解释的差异\"\n与\"L4-007 独有预测的不可通约性\"。\n\n- DED-026 单独预测: 群体边界→TP 阶跃 → 跨群体 TP 相关低于群内 TP 相关。\n  这也会降低跨群体评分相关系数。如果跨群体差异仅是均值水平差异（\"你对\n  这个违规判得重、我判得轻\"\
      ），则 DED-026（+DED-019 内群体偏见）足以\n  解释——不需要 L4-007。\n\n- L4-007 独有预测: 道德不可译性 = \"不同泡的成员之间连公平的基本定义框架\n  也不再共享\" → 不同泡的道德判断应展现不同的 *因子结构*（哪些 vignette 被\n  认为彼此相似、哪些 vignette 聚为一类道德议题），而非仅不同的均值水平。\n\n当前操作化的\
      \ correlation-based 指数（基于原始评分的 Pearson/Spearman 相关）\n对因子结构差异不敏感——两组评分可以因子结构完全不同但相关系数不低\n（如果两组都对某些高共识 vignette 给相似评分，相关系数仍可被拉高）。\n\nRequired 修复: 在 moral_fragmentation_index.measurement 中新增因子结构\n歧化测量:\n\
      - \"跨群体道德判断的因子结构歧化: 对各群体分别做道德判断 vignette 的\n  EFA 或层次聚类→若因子结构（哪些 vignette 聚在一起构成一个道德维度）\n  跨群体显著不同→框架不可通约。操作化判据: 计算跨群体的因子一致性指数\n  （如 Tucker's congruence coefficient），若 < 0.85 → 因子结构实质歧化。\"\n\n有了这一补充，L4-007\
      \ 的 DV 能区分:\n- \"程度差异\"（DED-026 可解释: 同一框架内，不同群体惩罚强度不同）\n- \"框架差异\"（L4-007 独有: 不同群体使用不同的道德判断框架）\n\n同时，L4-007 应显式说明: 道德碎片化指数需由两个子指标构成——\n(1) 强度歧化指数（均值/相关层面——DED-026 可解释）和\n(2) 框架歧化指数（因子结构层面——需 L4-007\
      \ 的复合机制解释）。\n仅当 (2) 也显著时，L4-007 才获得超越 DED-026 单独解释的经验支持。\n\nDED-025 的 \"per-bubble\" 扩展也需显式论证——见 required_fixes RF-3。\n"
