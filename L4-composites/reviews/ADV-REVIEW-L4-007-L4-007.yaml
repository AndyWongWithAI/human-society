        DED-026 单独可解释的范围，需要独立的规范演化。这是真正的复合证据。但 confound（政治身份重叠）严重，confidence=high 偏高——见 should_fixes。


        Anchor 2（George Floyd 短暂对齐与再碎片化）: "共享事件→暂时逆转→恢复且加速"的时间模式直接映射 DED-026 机制。再碎片化后的加速是复合元素——各自泡内熵增通道在恢复后加速运转。confound（政党精英 cue-taking）被诚实标注。confidence=moderate，合理。


        Anchor 3（中美社交媒体不可通约叙事）: 展示道德不可译性的极端案例——"你判的事情我根本没在我的信息生态中见过"。confound（国家审查+地缘政治）严重但被诚实标注。confidence=moderate，合理。


