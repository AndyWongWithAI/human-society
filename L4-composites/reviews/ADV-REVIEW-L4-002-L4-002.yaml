      round 3 审查者独立从四条父推论原始 YAML 抽取核心自变量与预测方向，构建笛卡尔积表，
      逐格标注该格预测由哪条(些)父推论强制:

      合力格(≥2父):
      - (HIGH, HI+HT)→(i)民主稳定区: DED-011(轮替→稳定)+DED-020(独立+透明→正)。
