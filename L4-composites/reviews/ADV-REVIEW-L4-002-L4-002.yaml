    核心结论:L4-002 满足 L3 三条标准 + L4 三条附加标准，裁决 verified。

    【关键验证——多父逐格判空归属分析独立重做】
    审查者从四条父推论原始 YAML 中抽取核心自变量与预测方向，构建笛卡尔积表，逐格独立标注
    该格预测由哪条(些)父推论强制。结果如下(详细分析见 multi_parent_cell_attribution):

    基线笛卡尔积(a:轮替高/低 × b:独立度×透明度四组合 × c:三条件不全=犬儒基线):
    - 合力格(≥2父): 格1(i区, DED-011+020)、格3(高轮替+低独立+高透明, DED-011+020反向)、
      格5(iv区, DED-011+014+020三父)、格7(iii区, DED-011+020同向加剧)、格8(ii区, DED-011+
      020+017三父方向逆转)、空格(vi, DED-011+020)、相变边界(v, DED-017+所在区父推论)
      = 7 个标注点需要多父合力。
    - 单父格: 格2、格4、格6 = 3 个标注点仅需 DED-011 单条(对照格，不损涌现论证)。
    - 方向逆转格: 格8(ii区)——DED-011 单独预测"无轮替→不稳定"，L4 预测"稳定(犬儒)"。
      这是涌现的最强形态——需要 DED-020(低透明缓冲)+DED-017(犬儒机制)合力翻转 DED-011
      的单条预测方向。审查者特别验证了格8是否可能是 DED-017 的单体推论:DED-017 单独只说
      "三条件不全→犬儒"，但"犬儒"不等于"政体稳定"——犬儒者可在派系撕裂的混乱中犬儒。
      将"犬儒"映射为"政体稳定"需要 DED-011 的结构不稳定基线作为对照+DED-020 的低透明缓冲
      解释为何结构撕裂被抑制。三父缺一不可。方向逆转确为 L4 涌现，非任一父推论可单产。

    【标准红旗 1-10——全部通过】
    1. brick=conclusion: 四父各自单轴/单交互/单临界，均不给三维相空间四区+相变边界+空格。
       非平凡内核(交互方向、方向逆转、空格)不在任一父推论结论的复述范围内。
