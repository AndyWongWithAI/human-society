  l4_specific_flags:
    spectator_brick: |
      【通过——DED-014 边际贡献窄但通过底线】round 2 独立重做逐父移除分析:

      - 移除 DED-011: 轮替轴消失。无法区分(i)民主稳定区与所有低轮替区域(ii/iii/iv)，
        相图退化为"独立度×不公集中度"二维平面。DED-011 对(i)(ii)(iii)(iv)(vi)均有贡献。
        非观众砖。

      - 移除 DED-020: 独立×透明交互消失。无法区分(ii)威权稳定与(iii)最不稳定——两者
        差别恰在透明度的方向(缓冲 vs 羞辱放大器)。对(ii)(iii)(i)(vi)均有贡献。非观众砖。

      - 移除 DED-017: 跨区域相变边界消失。相图变为纯静态分区，丢失动力学相变。(ii)区的
        "稳定(犬儒)"方向逆转需要 DED-017 三缺一→犬儒机制。非观众砖。

      - 移除 DED-014: 程序公平天花板逻辑消失。(iv)区失去"条件性稳定+天花板有限"中的天花板
        机制——没有 DED-014 的"轮替归零→程序合法性归零"乘积关系，(iv)区将退化为"低轮替的
        不稳定拉力 vs 高独立的正效应拉力→谁胜出不确定"——缺少"DED-020 正效应为何不能完全
        对冲 DED-011 不稳定"的解释。天花板是(iv)区区别于"两力拔河"的关键约束。

      DED-014 在(i)(ii)(iii)(v)(vi)中无直接预测贡献(已在 round 1 修复中诚实标注)。其"结构
      模板"贡献(轮替×透明交互启发 DED-020)属发现过程非逻辑必然性。DED-014 是四条父推论中
      边际贡献最窄的，但(iv)区天花板机制的不可替代性使其通过 spectator brick 底线。
      Round 1 已确认，round 2 独立重核持相同结论。

    trivial_conjunction: |
      【通过——多父逐格判空确认 ≥5 合力格，含方向逆转】

      round 2 独立重做完整多父逐格判空归属分析(见 multi_parent_cell_attribution)。
      基线笛卡尔积(c=三条件不全):

      合力格(≥2父):
      - (HIGH, HI+HT)→(i)民主稳定区: DED-011(轮替→稳定)+DED-020(独立+透明→正)。
        任一单独不区分另一维度。
      - (HIGH, LI+HT)→中低稳定: DED-011(正)+DED-020(负)。两力反向，需两者判断净结果。
      - (LOW, HI+HT)→(iv)法治威权区: DED-011(负)+DED-014(天花板)+DED-020(正)。
        三父缺一不可——缺任何一个都会丢失(iv)区预测的关键约束(见 spectator_brick)。
      - (LOW, LI+HT)→(iii)最不稳定区: DED-011(负)+DED-020(负)。同向加剧→"最"不稳定。
        任一单独只给"不稳定"不给"最"。
      - (LOW, LI+LT)→(ii)威权稳定区: DED-011(负→不稳定!)+DED-020(缓冲,中性)+DED-017
        (三缺一→犬儒→稳定)。【方向逆转】——DED-011 单独预测"不稳定"，三父合力预测"稳定"。
        这是涌现的最强形态。
      - 空格(vi): DED-011(负)+DED-020(负)→同向→不可长期稳定。任一单独不强制该格为空。
      - 相变边界(v): DED-017(三条件→临界)+所在区域父推论。≥2父。

      单父格:
      - (HIGH, HI+LT): DED-011 单独(轮替→稳定)，DED-020 弱正效应不改变方向。
      - (HIGH, LI+LT): DED-011 单独(轮替→稳定)，DED-020 中性。
      - (LOW, HI+LT): DED-011 单独(无轮替→不稳定)，DED-020 弱正效应不足以对冲。

      汇总: 至少 7 个标注点需要 ≥2 父合力，其中 (LOW, LI+LT) 是方向逆转格。单父格 3 个——
      它们是"父推论单独够用"的对照格，衬托合力格的非平凡性。

      方向逆转格(ii 区)尤为关键: DED-011 从"稀缺+无翻盘→派系撕裂"的结构逻辑得出"无轮替→
      不稳定"，这是一个近乎演绎的强预测。L4 将其翻转为"稳定(犬儒)"，必须借助 DED-020(低透明
      =羞辱放大器未激活→缓冲)和 DED-017(三缺一→不公转犬儒不转行动)的独立机制。这一翻转不
      可能由单父推论产生——它是"结构撕裂倾向"被"认知缓冲+行为犬儒"压制的结果，这正是 L4
      复合推论区别于 L3 chaining 的核心——不同层的机制可以方向相反且 L4 定义了谁胜出的条件。

      结论: 平凡合取不成立。L4-002 超越了父推论结论的 AND/OR 拼接。

    emergence_deficiency: |
      【通过——三层涌现检验全过】

      第一层(至少一个合力格): ≥7 个点需要 ≥2 父合力(见 trivial_conjunction)。通过。
      第二层(方向逆转): (ii)区——DED-011 单独预测不稳定，L4 预测稳定(犬儒)。通过。
      第三层(新实体): "法治威权区"(iv)作为独立可区分的政体稳定类型(条件性稳定+天花板
      有限)，以及"虚假稳定"(结构暂稳+认知空心化)作为独立可测区间——均不在任一条父推
      论中被单独识别。通过。

      round 2 特别验证: (ii)区的方向逆转是否可能是 DED-017 的单体推论而非 L4 的合成涌现?
      答案是否定的。DED-017 单独给出"三条件不全→犬儒"，但犬儒本身不定义"稳定"——犬儒者
      可以同时犬儒且生活在派系撕裂的混乱中。DED-017 从不说"犬儒=政体稳定"，它只说"不公
      不转行动"。将"犬儒"映射为"政体稳定"需要 DED-011 的"无轮替→派系撕裂→不稳定"的
      结构预测作为对照基线，再借 DED-020 的低透明缓冲解释为何结构撕裂被抑制。三者缺一
      不可——DED-017 单独不能产生"威权稳定区"这一判断。

    weak_parent_premise: |
      【通过】round 2 从 INDEX.md 独立确认:
      - DED-011: verified(三轮审查)
      - DED-014: verified(三轮审查)
      - DED-020: verified(一轮审查)
      - DED-017: verified(一轮审查)
      四条父推论全部 verified，无 candidate 被用作主前提。L4 离地基更远但父前提坚实。

    anchor_theft: |
      【通过】round 2 逐锚独立检查:
      - (i)锚: 共锚(DED-011轮替在场+DED-020独立+透明正效应)。composite_specific=false，
        诚实标注。L4 新增判断"任何透明度下都稳定"使此锚超越简单共锚。
      - (ii)锚: 原创复合锚——需 DED-011+020+017 三方合力产出方向逆转。composite_specific=true。
      - (iii)锚: 原创复合锚——需 DED-011+020 同向加剧→"最不稳定"。composite_specific=true。
      - (iv)锚: 原创复合锚——需 DED-011+020+014 三方合力。composite_specific=true。
      - (v)锚: 原创复合锚——需 DED-017 三条件+所在区域父推论。composite_specific=true。
      五锚中四锚为复合原创锚，一锚为诚实共锚。无单父锚重复使用→不判锚点偷窃。

    interaction_measurement_gap: |
      【通过】复合输出"政体稳定性"具有可独立测量且不可还原为任一单父输出的维度:

      双维测量结构:
      - 结构维(制度崩溃): 由独立事件数据库/史料编码测——映射自 DED-011 的被预测量(派系撕裂/
        僵局/清洗/分裂)但有扩展(加入"制度崩溃"定义域)。
      - 认知维(败方接受): 由败方行为记录独立测——映射自 DED-014/020 的被预测量(败方接受度)。

      独有可测区间——"虚假稳定"(结构暂稳+认知空心化):
      此区间需要同时测两个维度并发现它们分离——结构上未崩溃(独立事件数据库)但认知上合法性
      已空心化(独立行为记录/调查数据)。这需要异源的双维同时测量，不可还原为"仅测结构"
      (DED-011)或"仅测认知"(DED-014/020)。DED-011 单独测不到"认知空心化"，DED-014/020
      单独测不到"结构暂稳下的认知空心化"全貌。

      实操挑战(见新观察 F): 认知合法性空心化在封闭政体中需调查/态度数据，常不可得或不可靠。
      这限制了"虚假稳定"区间的实测可行性，但不妨碍其概念上的可测性和不可还原性。

    claim_type_evidence_mismatch: |
      【通过——round 1 已修复】claim_type 已从 phase_transition 改为 phase_diagram。
      当前证据主力为横截面对比(不同政体落在不同格: (i)(ii)(iii)(iv)锚各为一个跨政体
      静态比较)，法国大革命锚(v)提供纵向相变证据。phase_diagram 准确反映贡献本质——
      完整稳定相空间的分区结构(静态分区)+相变边界条件(动态临界)——不要求每个锚都展
      示同一政体的完整参数渐变→相变序列。修复质量合格。

  # ============================================================
  # 多父逐格判空归属分析 (multi_parent_cell_attribution) — round 2 独立重做
  # ============================================================

  multi_parent_cell_attribution: |
    【审查者 round 2 独立执行——不依赖 round 1 或 L4 自述】

    第一步: 从每条父推论抽取核心自变量与预测方向。

    DED-011 核心自变量: 轮替开放度(rotation openness)
      预测: rotation=high → 输家有未来预期 → 稳定(派系流动不固化)
            rotation=low  → 输家无未来预期 → 不稳定(僵局/清洗/分裂)
      独立于: 透明度、裁决独立度、不公集中度(不在 DED-011 射程内)

    DED-014 核心自变量: 轮替开放度 × 程序透明度
      预测: 轮替→0 时程序公平效应断崖——乘积关系: 程序接受度 ∝ 轮替 × 透明度
            轮替→0 → 乘积归零(无论透明度多高)
            零轮替+高透明 < 零轮替+低透明(反常方向)
      独立于: 裁决独立度(不在 DED-014 射程内; 轮替≠裁决独立)

    DED-020 核心自变量: 裁决独立度 × 程序透明度
      预测: 独立+透明→正效应；依附+透明→羞辱放大器(方向反转)
            依附+高透明 < 依附+低透明(反常方向)
      独立于: 轮替开放度(不在 DED-020 射程内; 裁决独立≠轮替)、不公集中度

    DED-017 核心自变量: 不公集中度 × 预存组织密度 × 改革渠道缺失度
      预测: 三条件全满足 → 集体行动临界
            三条件不全 → 不公转犬儒不转行动
      注: "改革渠道"子条件与 DED-011 翻盘机制有概念交叠(见新观察 D)——此交叠使参数(c)
      的一个子维与参数(a)非完全独立，但参数(c)整体(含集中度+预存组织两个独立子条件)
      仍与参数(a)可独立变异。

    第二步: 基线笛卡尔积(c=三条件不全，犬儒基线)。逐格标注预测来源。

    格1: 高轮替 + 高独立+高透明 → (i)民主稳定区
      DED-011: rotation=high → 稳定 ✓
      DED-014: N/A(轮替在场→天花板逻辑不触发)
      DED-020: ind=high+trans=high → 正效应 ✓
      DED-017: c=不全 → 犬儒(中性)
      来源: 【DED-011 + DED-020 合力】≥2父
      注: 两父方向一致(都指向稳定)，但各自不覆盖对方维度——DED-011 不区分解独立度，
      DED-020 不区分轮替。L4 仅此格的涌现强度最低(近乎 AND 拼接)，但"任何透明度下
      稳定"这一判断依赖 DED-020 确保透明度在所有条件下均非负——这是 DED-011 单独给不出的。

    格2: 高轮替 + 高独立+低透明 → 中稳定
      DED-011: rotation=high → 稳定 ✓
      DED-020: 独立+低透明 → 弱正效应(不反转)
      来源: 【DED-011 单独】1父

    格3: 高轮替 + 低独立+高透明 → 中低稳定
      DED-011: rotation=high → 稳定(正)
      DED-020: ind=low+trans=high → 羞辱放大器(负)
      两力反向→净结果不确定但合力中等(轮替在场部分缓冲羞辱效应)
      来源: 【DED-011 + DED-020 合力】≥2父

    格4: 高轮替 + 低独立+低透明 → 中稳定
      DED-011: rotation=high → 稳定 ✓
      DED-020: 低独立+低透明 → 隐匿区(中性)
      来源: 【DED-011 单独】1父

    格5: 低轮替 + 高独立+高透明 → (iv)法治威权区: 条件性稳定+天花板有限
      DED-011: rotation=low → 不稳定(负) ✗与预测方向相反
      DED-014: rotation→0 × trans=high → 乘积→合法性归零(负,天花板)
      DED-020: ind=high+trans=high → 正效应(正,反向拉力)
      两负(DED-011+014)一正(DED-020)→净结果: 条件性稳定但天花板有限
      来源: 【DED-011 + DED-014 + DED-020 三父合力】≥3父
      单父判定: DED-011 单独→不稳定(错误方向)。DED-020 单独→正效应(不解释为何"条件性")。
      DED-014 单独→乘积归零(不解释独立度正效应)。三父缺一不可——缺 DED-011 失去不稳定拉力，
      缺 DED-020 失去独立度正效应，缺 DED-014 失去天花板(无法解释为何独立度不能完全对冲轮替缺失)。

    格6: 低轮替 + 高独立+低透明 → 低稳定
      DED-011: rotation=low → 不稳定 ✓
      DED-020: 独立+低透明 → 弱正效应(不足以对冲)
      来源: 【DED-011 单独】1父

    格7: 低轮替 + 低独立+高透明 → (iii)最不稳定区
      DED-011: rotation=low → 不稳定(负)
      DED-020: ind=low+trans=high → 羞辱放大器(负)
      两负同向加剧→"最不稳定"
      来源: 【DED-011 + DED-020 合力】≥2父
      单父判定: DED-011 单独→不稳定(不给"最")。DED-020 单独→羞辱(不区分轮替水平)。
      两者同向才能出"最不稳定"——任一单独只能出"不稳定"而非"最不稳定"。

    格8: 低轮替 + 低独立+低透明 → (ii)威权稳定区: 稳定(犬儒)
      DED-011: rotation=low → 不稳定(负) ✗与预测方向相反！
      DED-020: ind=low+trans=low → 隐匿区(缓冲,中性)
      DED-017: c=不全 → 犬儒(三缺一→不公转犬儒不转行动)(正:稳定)
      来源: 【DED-011 + DED-020 + DED-017 三父合力】≥3父
      【方向逆转格】DED-011 单独预测"不稳定"，L4 预测"稳定(犬儒)"。DED-020 提供缓冲(中
      性)，DED-017 提供方向逆转机制(犬儒=不行动=表面稳定)。缺 DED-017: 预测=不稳定+缓冲=
      "不稳定但被缓冲"≈"延迟引爆"非"稳定"。缺 DED-020: 预测=不稳定+犬儒=矛盾(犬儒者
      在不稳定环境中的行为不一致)。三父缺一不可。这是涌现的最强形态——方向逆转。

    空格(vi): 低轮替 + 低独立+高透明 + 长期稳定 → 预测为空
      DED-011: rotation=low → 不稳定。不区分透明度。
      DED-020: ind=low+trans=high → 羞辱放大器。不区分轮替。
      两条同向→不可长期稳定。
      来源: 【DED-011 + DED-020 合力】≥2父
      单父判定: DED-011 单独不区分透明度→不强制"高透明格"必空。DED-020 单独不区分轮替→
      不强制"低轮替格"必空。两者合力: 低轮替+依附+高透明=两股不稳定力叠加→长期稳定不可能。

    跨区域相变边界(v): c=三条件全满足 → 任何(i)-(iv)区域→集体行动临界逼近
      DED-017: c=全满足 → 集体行动临界 ✓
      所在区域父推论: 提供当前稳定/不稳定区基线
      来源: 【DED-017 + 所在区域父推论合力】≥2父

    第三步: 汇总。
    合力格(≥2父): 格1(i区)、格3、格5(iv区)、格7(iii区)、格8(ii区)、空格(vi)、
      相变边界(v) = 7 个标注点需要多父合力。
    单父格: 格2、格4、格6 = 3 个标注点仅需 DED-011 单条(对照格，不损涌现论证)。
    方向逆转格: 格8(ii区)——DED-011 预测不稳定→L4 预测稳定(犬儒)——涌现最强形态。

    该归属分析确认: L4-002 的多父合力并非 round 1 审查的复读——每个格的归因都独立验证了
    "缺任一父推论是否会改变预测"的反事实。尤其格8(ii区)的方向逆转经住了"是否可能是 DED-017
    单体推论"的质疑(见 emergence_deficiency 的 round 2 验证)。

  # ============================================================
  # 反例猎捕 (counterexample_hunt) — round 2 独立执行
  # ============================================================

  counterexample_hunt: |
    round 2 刻意攻 round 1 未覆盖的攻击面，聚焦 L4 评分卡特殊要求——猎"父推论都成立但交互
    不产生 L4 预测结果"的案例，非仅猎"某父推论不成立"的案例。

    【攻击 1——(iv)区"条件性稳定+天花板"的时间尺度反例: 新加坡】
    参数: 低轮替(PAP 自 1959 连续执政，虽有制度化选举但实质上轮替从未发生 → 轮替开放度近
    零)、高独立(英国普通法传统/法官职业化/国际排名高)、高透明度(法治指数/清廉指数均高)。
    L4 预测: (iv)区"条件性稳定+天花板有限"——独立裁决的正效应部分缓冲轮替缺失，但天花板
    随时间逼近(DED-014: 轮替归零→程序合法性归零)。新加坡已存续 65+年且无合法性崩塌迹象。
    若"天花板"在 65 年后仍未逼近，则(iv)区"天花板有限"预测被削弱——何时逼近?
    消化: (a) 新加坡轮替并非完全趋零——定期选举+反对党参选+偶获席位，轮替开放度严格说>0
    (虽是低值非零值)。(b) L4-002 已在 boundary_cases 列新加坡/香港为(iv)区边界测试。
    (c) "天花板"是长时段概念(跨越代际)，65 年在政体生命周期中未必是"长期"。但也暴露了
    "天花板"预测的时间尺度模糊——多长算"长期"? 若无法指定，天花板预测的可证伪性打折。
    状态: 非净杀，但暴露(iv)区预测的时间尺度操作化缺口(should 级)。

    【攻击 2——(ii)区"犬儒稳定"的替代机制: 中国】
    参数: 低轮替(一党制无制度化多党轮替)、低独立(法院受党委政法委领导→裁决依附)、低透明
    (政治/司法透明度整体偏低，虽有局部改善)。L4 预测: (ii)区"稳定(犬儒)"——DED-017 三缺一
    →不公转犬儒不转行动。但中国稳定是否主要来自"犬儒"而非"镇压+经济增长"?
    消化: (a) L4 稳定性定义=无制度崩溃(革命/政变/内战/分裂)——按此定义中国稳定(未崩溃)。
    (b) 犬儒 vs 镇压的机制归属难以独立裁定——DED-017 的 excluded_outcomes 将"短期外部镇压
    压制"排除，但中国的社会控制是长期制度化而非"短期"。若长期镇压 IS 稳定机制(非犬儒)，则
    (ii)区的因果归因需修正——稳定性来自"镇压有效性"而非"犬儒"。但此修正不推翻 L4 的预测
    方向(该格仍是稳定的)，只修正机制解释。(c) 经济增长提供了非程序合法性(绩效合法性)，此
    机制不在 L4 射程内——可能是一个被遗漏的独立参数。非净杀——该格预测"稳定"仍成立，
    仅机制解释有待进一步细分。

    【攻击 3——(iii)区"最不稳定"的方向排序反例: 伊朗】
    参数: 低轮替(最高领袖终身制+宪法监护委员会筛选→轮替趋零)、低独立(司法受最高领袖控制→
    裁决依附)、透明度中高(总统/议会选举真实竞争+议会辩论+一定新闻自由——明显高于沙特/朝鲜
    等(ii)区案例)。L4 预测: (iii)区比(ii)区更不稳定。伊朗伊斯兰共和国存续 40+年(1979至今)，
    若其稳定性不低于沙特(ii区典型)，则(iii)vs(ii)方向排序受挑战。
    消化: (a) 伊朗透明度是否达"高"阈值存疑——候选人经宪法监护委员会筛选(限制竞争范围)、
    互联网受审查——综合透明度可能仅"中"而非"高"。(b) 伊朗经历了反复大规模抗议(2009 绿色
    运动/2017-2018/2019-2020/2022 头巾运动)——恰说明(iii)区的不稳定特征，每次抗议均被镇压
    但反复爆发，不符合(ii)区的"犬儒稳定"画像。(c) DED-017 三条件在伊朗接近满足: 受损群体
    (改革派/年轻女性/少数族裔)有预存组织(学生网络/社交媒体/工会残余)+不公集中+改革渠道被
    宪法监护委员会关闭→多次爆发→方向性支持(iii)的"不稳定"预测。综合: 伊朗更接近(iii)区
    的反复不稳定特征，非净杀。

    【攻击 4——DED-017 改革渠道与 DED-011 翻盘机制概念交叠→参数(c)与(a)非独立】
    核心指控: DED-017 三条件之"无可信改革渠道"定义为"选举/代议(轮替)、申诉/司法救济(申诉)、
    安全退出/迁移(退出)"——这与 DED-011 的 turnaround_credibility(轮替/退出/申诉/权力分享)
    高度重叠。当 L4 将两者作为"正交参数(a)和(c)"放入同一笛卡尔积时，参数(c)的一个子条件与
    参数(a)非独立——使"三维参数空间"的"正交"宣称需要限缩。
    消化: (a) 交叠属实。DED-017 的改革渠道概念与 DED-011 的翻盘机制共享概念祖先(DED-011)。
    (b) 但参数(c)整体仍独立于参数(a)——因为(c)含两个(a)不涵盖的子条件: 不公集中度和预存组织
    密度。只要这两个子条件独立变异，(c)整体与(a)可独立。(c) 交叠不影响合力论证——在(ii)区
    方向逆转中，DED-017 贡献的独特机制是"犬儒"(来自三条件不全)，而非"改革渠道缺失"。
    犬儒机制独立于 DED-011 的轮替→撕裂逻辑——这是 DED-017 对 L4 的不可替代贡献。
    结论: 非净杀。但"三个参数正交"的宣称应诚实限缩——参数(c)的一个子维与参数(a)共享概念
    祖先(见新观察 D)。

    【攻击 5——空格(vi)的 measurement-conditional emptiness】
    核心指控: 空格(vi)被预测为空——"低轮替+低独立+高透明+长期稳定"不能存在。但这是不是一个
    measurement-conditional emptiness——即不是因为理论上不可能，而是因为自然数据中"低轮替+
    低独立"几乎必然伴生"低透明"(高透明制度通常也需要某种程度的独立性和轮替)? 若是，空格
    (vi)的空不是因为理论机制，而是因为参数共线性——这不是"涌现预测"而是"自然数据 artifact"。
    消化: (a) 共线性风险属实——L4-002 已在 primary_suspect 和 secondary_suspect 中诚实标注。
    (b) 但空格(vi)的测试窗口虽窄但存在——可检验那些"提高透明度但不改变轮替和独立度"的改革
    案例(如某些威权政体的信息公开改革)。若此类改革后政体仍长期稳定，(vi)格被填上。这就是
    falsifiability(a)的设计。(c) 共线性本身就是一个经验发现——它说明"高透明度+低轮替+低独立"
    的组合确实不稳定(因为存在过的都垮了，或从未形成)。非净杀——空格(vi)在逻辑上可被干净反
    例填满，测量方案在位。

    猎捕结论: 五路攻击均被已有机制或 boundary_case 分类合法消化。未猎到同时满足"所有独立
    测量条件且推翻核心预测"的 scope 内净杀活反例。但攻击 1 暴露了(iv)区"天花板"预测的时间
    尺度操作化缺口，攻击 4 暴露了参数交叠需诚实限缩——两者均为 should 级观察(见新观察 D/E)。

