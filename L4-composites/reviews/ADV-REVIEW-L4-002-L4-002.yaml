    13. 涌现缺失: 三层检验全通过——7 个合力格(第一层)、方向逆转格存在(第二层)、"法治威权
        区"和"虚假稳定"作为新实体产生(第三层)。
    14. 弱父前提: 四父全 verified(DED-011/014 经三轮审查，DED-020/017 经一轮)。无 candidate
        父前提。
    15. 锚点偷窃: 五锚中(iv)(iii)(ii)(v)为原创复合锚(composite_specific=true)，(i)为诚实
        共锚(composite_specific=false)。无单父锚重复使用。
    16. 交互测量缺口: 复合输出"政体稳定性"的双维测量(结构崩溃事件+认知合法性行为)异源。
        独有可测区间"虚假稳定"(结构暂稳+认知空心化)不可还原为任一单父输出。
    17. 声明类型-证据标准错配: claim_type=phase_diagram(round 1 已修复)。当前证据主力(四区
        横截面对比+一个纵向相变锚)与 phase_diagram 声明匹配。

    【反例猎捕——审查者独立构造五路新攻击】
    攻1——空格(vi)候选: 中国改革期(1980s-90s)。参数:低轮替✓+低独立✓+透明度=中低偏
    (法律成文但不完备/法官任命不公开/同案不同判)。透明度不满足"高"阈值→不构成空格填充。
    攻2——空格(vi)候选: 当代越南。参数:低轮替✓+低独立✓+透明度=低(互联网审查/无独立媒体)。
    透明度不满足"高"→不构成空格填充。
    攻3——(iii)vs(ii)方向排序: 伊朗。低轮替✓+低独立✓+透明度中高(真实选举竞争+议会辩论)。
    L4 预测(iii)比(ii)更不稳定。伊朗存续 40+年——若其稳定性不低于沙特(ii区典型)，方向排序
    受挑战。消化:(a)伊朗透明度是否达"高"阈值存疑(候选人经宪法监护委员会筛选/互联网审查);
    (b)伊朗反复大规模抗议(2009/2017-2018/2019-2020/2022)恰说明(iii)区不稳定特征——每次
    被镇压但反复爆发，不符合(ii)区"犬儒稳定"画像;(c)DED-017 三条件接近满足→方向性支持
    (iii)的"不稳定"预测。非净杀，甚至方向性支持(iii)。
    攻4——(iv)区天花板时间尺度: 新加坡。低轮替(PAP 连续执政 65+年，但轮替非完全趋零——
    定期选举+反对党参选且偶获席位)+高独立+高透明。L4 预测天花板约 40-60 年逼近。新加坡
    65+年未到天花板→究竟是"还不够长"还是"天花板预测有误"? 消化:(a)轮替非完全趋零
    (>0)，(b)已在 boundary_cases 中列出，(c)时间尺度锚定为启发式。非净杀，但新加坡是(iv)区
    天花板的活体检验——若再存续一代(至~100年)轮替仍趋零且无合法性空心化，(iv)区预测受挑战。
    攻5——(ii)区犬儒机制的替代: 中国。低轮替✓+低独立✓+低透明✓→稳定。L4 说稳定来自犬儒
    (DED-017 三缺一)。但若稳定主要来自"长期制度化镇压+经济增长绩效合法性"而非"犬儒"——
    (ii)区因果归因需修正，预测方向(该格稳定)本身不塌。非净杀，仅机制解释待进一步细分。

    猎捕结论:五路攻击均被已有机制(参数不满足/边界案例消化/测量约束/self-acknowledged)
    合法消化。未猎到同时满足"所有独立测量条件且推翻核心预测"的 scope 内净杀活反例。

    【DED-004/DED-007 复发检查】均未复发。三条证伪路径清晰可操作+双层防循环防线在位+
    五轴异源测量。

    【round 2 审查记录不一致——发现并记录】
    round_2 审查记录存在内部矛盾:verdict 字段 = "verified"，但 verdict_note 文本末尾明确
    写"裁决: needs_revision"并列出三条 should 级观察(D/E/F)作为 required_fixes。作者正确
    地将 round 2 视为 needs_revision 并做了三项定向修复——这是正确的处理。但审查记录本身的
    verdict 字段与 verdict_note 文本不一致，属记录瑕疵，建议修正 verdict 字段为 "needs_revision"
    以与实际裁决文本一致。不影响本轮 verdict。

    【本轮新观察——四个 should 级软点，不阻断 verified】
    (G) (ii)区犬儒 vs 镇压机制归属未解: DED-017 的 excluded_outcomes 将"短期外部镇压压制"
    排除，但中国的社会控制是长期制度化而非"短期"。若长期镇压 IS 稳定机制(非犬儒)，(ii)区
    因果归因需修正——但预测方向(该格稳定)不塌。建议在 (ii)区锚的 honest_note 中标注此机制
    归属不确定性。
    (H) 新加坡是(iv)区天花板的活体边界检验: 65+年正处于时间尺度锚定的边界(约 40-60 年)。
    若再存续至~100 年轮替仍趋零且无合法性空心化，(iv)区天花板预测受实质性挑战。建议在
    boundary_cases 中明确新加坡作为(iv)区的纵向跟踪案例。
    (I) DED-014 贡献窄化的结构性非对称: DED-011 和 DED-020 贡献 5+格，DED-017 贡献 3+格，
    DED-014 仅贡献 1 格(iv区)。这种贡献宽度的非对称已经在 honesty note 中标注，但"四父合力"
    的表述可能让读者误以为四父贡献均等。建议在 emergence_demonstration 开头追加一句:"四条
    父推论的贡献宽度不均等——DED-011 和 DED-020 覆盖面最广(各覆盖 5+格)，DED-017 覆盖
    3+格(犬儒机制+相变边界)，DED-014 贡献集中于(iv)区天花板机制。非对称是复合推论的正常
    特征，不影响每条父推论对 L4 的不可替代性。"
    (J) round_2 审查记录的 verdict 字段与 verdict_note 文本不一致，属记录瑕疵。

    裁决: verified。L4-002 满足 L3 三条标准(无 required 缺陷、反例猎捕无活反例、DED-004/007
    未复发)+ L4 三条附加标准(涌现有效、复合非平凡性通过、无观众砖)。六项修复(round 1 三项+
    round 2 三项)全部到位且质量合格。四个 should 级新观察(G/H/I/J)为锦上添花的改进建议，
    不触及逻辑结构，不阻断 verified。

