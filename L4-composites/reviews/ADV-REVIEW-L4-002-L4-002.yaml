  new_observations: |
    (G) (ii)区犬儒 vs 镇压机制归属未解: DED-017 的 excluded_outcomes 将"短期外部镇压压制"
    排除，但中国等案例的社会控制是长期制度化而非"短期"。若长期镇压 IS 稳定机制(非犬儒)，
    (ii)区因果归因需修正——稳定性来自"镇压有效性"而非"犬儒"。但此修正不推翻预测方向
    (该格仍是稳定的)，仅修正机制解释。建议在(ii)区锚的 honest_note 中标注此机制归属的不确定性。

    (H) 新加坡是(iv)区天花板的活体边界检验:新加坡 65+年正处于时间尺度锚定的边界(约 40-60 年)。
    若再存续至~100 年轮替仍趋零且无合法性空心化，(iv)区天花板预测受实质性挑战。建议在
    boundary_cases 中明确新加坡作为(iv)区的纵向跟踪案例——"若新加坡在 100 年节点仍无合法性
    空心化，(iv)区天花板预测需重新校准"。

    (I) DED-014 贡献宽度的结构性非对称: DED-011 和 DED-020 贡献 5+格，DED-017 贡献 3+格
    (犬儒机制+相变边界)，DED-014 仅贡献 1 格(iv区天花板机制)。这种贡献宽度的非对称已在 honesty
    note 中标注，但"四父合力"的表述可能让读者误以为四父贡献均等。建议在 emergence_demonstration
    开头追加一句:"四条父推论的贡献宽度不均等——DED-011 和 DED-020 覆盖面最广(各覆盖 5+格)，
    DED-017 覆盖 3+格，DED-014 贡献集中于(iv)区天花板机制。非对称是复合推论的正常特征，不影响
    每条父推论对 L4 的不可替代性。"

    (J) round_2 审查记录存在内部不一致: verdict 字段 = "verified"，但 verdict_note 文本末尾
    明确写"裁决: needs_revision"并列出三条 should 级观察(D/E/F)。作者正确地将 round 2 视为
    needs_revision 并做了三项定向修复——这是正确的处理。但审查记录本身的 verdict 字段与 verdict_
    note 文本不一致，属记录瑕疵。建议修正 round_2 的 verdict 字段为 "needs_revision" 以与实际
    裁决文本一致。不影响本轮 verdict。

