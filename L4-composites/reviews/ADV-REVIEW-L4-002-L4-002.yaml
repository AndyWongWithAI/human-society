author_response_round_1: |
  (1) anti_talisman_clause: 在 falsification_trace 后、excluded_outcomes 前新增
  L4 合成层面统一防循环条款，与父推论(DED-011/014/020/017)的独立 anti_talisman_
  clause 形成双层防线覆盖。子段分散约束保障单参数测量正交，本条款保障合成层面参数-
  输出交叉污染防范，补齐 L4 形式完备性。
  (2) claim_type: 接受建议(a)——从 phase_transition 改为 phase_diagram。当前证据
  主力确为横截面对比(四区+空格)，仅法国大革命锚提供纵向相变。phase_diagram 准确反映
  贡献本质(完整稳定相空间的分区结构+相变边界条件)，不塌非平凡内核。
  (3) DED-014 贡献限缩: 在 necessity 段末尾追加诚实注记，标注 DED-014 不可替代贡献
  集中于(iv)区天花板机制，在(i)(ii)(iii)无直接预测贡献；其结构模板贡献(轮替×透明
  交互启发 DED-020)属发现过程而非逻辑必然性层面。DED-014 仍通过 spectator brick
  底线——(iv)区贡献是真实不可替代的。

