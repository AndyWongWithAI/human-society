    标注了在(i)(ii)(iii)无直接预测贡献的事实。三项均为定向消解，修复质量合格。

    本轮按 L4 评分卡逐条重审全部 17 条红旗（标准 10 + L4 专属 7），确认:
    - 标准红旗 1-10: 全部通过，无 required 级缺陷。特别验证了 round 1 未充分展开的三项:
      (a) anti_talisman 真兑现——新增 consolidated clause 覆盖 L4 合成层面参数-输出交叉污染，
      分散约束 + 合成条款构成双层防线，与四父推论防循环标准齐平；(b) primary_suspect 指得准
      ——(i)区上限自疑(民主政治信任下降)和轮替-独立共线性导致的交叉格案例稀少(iv区)均被诚
      实标注；(c) 空格(vi)真经验主张——低轮替(制度事实)+低独立(结构事实)+高透明(制度事实)
      均可独立测且不由结局反推，非同义反复。
    - L4 专属红旗 11-17: 全部通过。核心发现:
      (11) spectator brick: 四父逐一移除分析确认无观众砖。DED-014 边际贡献最窄(集中于 iv 区)
      但 iv 区天花板机制(轮替→0→程序合法性归零)不可由其余三父替代——通过底线。诚实注记已
      标注其在(i)(ii)(iii)无直接贡献。
      (12) trivial conjunction: 本轮独立重做了多父逐格判空归属分析(见 multi_parent_cell_
      attribution)，确认至少 5 个笛卡尔积格需要 ≥2 父合力，含一个方向逆转格(ii 区:DED-011
      单独预测不稳定→L4 预测稳定(犬儒))。平凡合取不成立。
      (13) emergence deficiency: 三层检验全通过——多父合力格≥5(第一层)、方向逆转格存在(第二
      层)、"法治威权区"和"虚假稳定"作为新实体产生(第三层)。
      (14) weak parent premise: 四父全 verified(DED-011/014 经三轮审查,DED-020/017 经一轮)。
      无 candidate 父前提。
      (15) anchor theft: 五锚中四锚为复合原创锚(composite_specific=true)，一锚为共锚(诚实标注
      composite_specific=false)。无单父锚重复使用。
      (16) interaction measurement gap: 复合输出"政体稳定性"的双维测量(结构崩溃事件+认知合法
      性行为)异源，独有可测区间"虚假稳定"(结构暂稳+认知空心化)不可还原为任一单父输出。
      (17) claim_type mismatch: round 1 已修复——phase_transition→phase_diagram。当前证据主力
      (四区横截面对比+一个纵向锚)与 phase_diagram 声明匹配。

    本轮新发现三条 should 级观察(不阻断 verified，但建议作者知悉):
    (D) DED-017"改革渠道"与 DED-011"翻盘机制"存在概念交叠。DED-017 三条件之"无改革渠道"
    (选举/申诉/退出)与 DED-011 的 turnaround_credibility(轮替/退出/申诉/权力分享)共享概念
    祖先——使参数(c)的一个子条件与参数(a)非完全独立。这不妨碍合力论证(参数(c)仍有集中度+
    预存组织两个独立于(a)的子条件)，但 L4 宣称"三个参数正交(可独立变异)"时应对此交叠做诚实
    限缩——当前 operationalization 未明确标注此点。
    (E) 最尖锐涌现预测(iii区)的经验底座最薄。zone(iii)"低轮替+低独立+高透明→最不稳定"是
    L4 中宣称最强的涌现格(DED-011+020 同向加剧→"最"不稳定)，但其唯一锚(苏联/东欧 1989)
    honest_note 自承"多因交织(经济停滞/外部示范/戈尔巴乔夫不干预)"，confidence=moderate。
    该锚对(iii)区的支持是方向性而非特异性——经济停滞和外部示范也可解释崩溃，无法干净归因于
    "轮替缺失×依附裁决×高透明"这一组合。这是复合推论的经验瓶颈(极限格天然案例少)，非逻辑
    缺陷，但作者应考虑追加特异性更强的锚或降级 confidence。
    (F) "虚假稳定"(结构暂稳+认知空心化)在威权语境下的独立测量面临实操困难。认知合法性
    空心化需调查/态度数据，在封闭政体中不可得或不可靠——可能造成结构稳定区(i)(ii)(iv)与
    "虚假稳定"的实测边界模糊。这不是逻辑缺陷而是测量可行性挑战，已在 operationalization
    中被诚实标注(limitations:"高度封闭社会中三条件均难以独立测")。

    反例猎捕刻意攻了五路——新加坡(iv区边界)、中国(ii区"犬儒"机制替代(镇压 vs 犬儒)、
    朝鲜(ii区极值)、伊朗(iii区方向排序)、DED-017 改革渠道与 DED-011 翻盘机制概念交叠——
    均被已有机制或 boundary_case 分类合法消化，未猎到 scope 内净杀活反例。DED-004/007
    未复发——五轴异源测量+合成层面双层防循环在位+三条清晰的证伪路径。

    裁决: needs_revision。L4-002 满足 L3 三条标准(无 required 缺陷、反例猎捕无活反例、DED-004/007
    未复发)+ L4 三条标准(涌现有效、复合非平凡性通过、无观众砖)——核心不塌。三条 should 级新观察
    (D:参数交叠诚实限缩 / E:iii区锚归因特异性 / F:虚假稳定实测可行性)可定向修订修复，不触及
    逻辑结构。按 L4 评分卡"宁可错杀不放水"原则及 round_1 precedent(should 级→needs_revision)，
    裁 needs_revision。三条 should 修复后可达 verified。

  # ============================================================
  # 标准红旗 (1-10) — round 2 独立重审
