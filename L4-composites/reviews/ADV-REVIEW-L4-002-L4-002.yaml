id: ADV-REVIEW-L4-002
type: adversarial_review
reviews: L4-002
layer: L4-composites

人话摘要: |
  对 L4-002(政体稳定相图:三股力量的同时博弈——轮替开放度×裁决独立度×透明度×不公集中度
  →四区+相变边界)的独立对抗审查记录。round_1 裁 needs_revision:核心(三维相空间中的多父合力
  分区+空格预测+跨区域相变边界)通过了平凡合取检测和非平凡性门槛,多父逐格判空确认至少5格需
  ≥2条父推论合力,四父均 verified 无弱父前提,测量轴正交,空格(vi)可被真反例填上。但有三条 should
  级缺陷:(1)缺失 consolidated anti_talisman_clause——各 operationalization 段有分散防循环约束
  但缺少 L4 专属的合成层面防循环条款;(2)claim_type=phase_transition 但纵向证据偏薄——多数锚为
  横截面对比,相变动态证据不足;(3)DED-014 在四区中的贡献过度集中于(iv)一区,其"不可替代"论证
  在(i)(ii)(iii)三区显得牵强——虽通过 spectator brick 底线但需诚实限缩其角色。

target: L4-002
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。按 L4 评分卡
  校准:10 条标准红旗 + 7 条 L4 专属红旗(观众砖/平凡合取/涌现缺失/弱父前提/锚点偷窃/交互测量
  缺口/声明类型错配)——逐条攻。必做多父逐格判空归属分析+反例猎捕(猎"父推论都成立但交互不产生
  L4 预测的结果"的反例)。裁决三态:verified(L3三条+L4三条同时满足)/needs_revision(有 required/
  should 缺陷可定向修订)/rejected(核心塌陷:平凡合取/观众砖无法消解/净杀反例/测量轴焊死)。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    本轮对抗审查的核心任务是检验 L4-002 是否真的超越了四条父推论的简单 AND/OR 拼接——
    即是否满足 L4 涌现的硬门槛:至少一个笛卡尔积格需要 ≥2 条父推论合力才能预测。经过
    系统性的多父逐格判空归属分析(见 multi_parent_cell_attribution),我确认 L4-002 通过
    了平凡合取检测:(ii)威权稳定区、(iii)最不稳定区、(iv)法治威权区、(vi)空格、(v)相变
    边界——至少 5 个格标注为需要 ≥2 条父推论合力。其中(ii)区尤为关键:DED-011 单独预测
    "无轮替→不稳定",但(ii)区却预测"稳定(犬儒)"——这是方向逆转,必须 DED-020(低透明=
    羞辱放大器未激活)+DED-017(三缺一→犬儒)合力才能翻转 DED-011 的单条预测方向。这一
    方向逆转是任何单条父推论都给不出的,构成了 L4 的非平凡内核之一。

    然而,我在审查中发现三条 should 级缺陷:

    (A)【缺失 consolidated anti_talisman_clause】所有四条父推论(DED-011/014/020/017)
    均有独立的、完整的 anti_talisman_clause 段。L4-002 在各 operationalization 子段中
    有分散的防循环约束(如"不得用结局反推轮替"等),但缺少一段 L4 专属的、覆盖合成层面的
    统一防循环条款——规定在三维参数空间中遇到疑似反例时,不得事后调低/调高任一参数估值
    来消化。这是 should 级,因分散约束已覆盖大部分风险,但 consolidated clause 是本体系
    的标配,缺它使 L4 在形式完备性上低于父推论标准。

    (B)【claim_type=phase_transition 但纵向证据偏薄】L4-002 的 claim_type 声明为
    "phase_transition"——这意味着需要动态/纵向证据展示同一政体随参数变化而发生相变。
    当前 real_world_anchors 提供的主要是横截面对比(不同政体落在不同格),只有法国大革命锚
    提供了纵向相变证据(旧制度从稳定格跨越临界)。其余锚(民主稳定区/威权稳定区/最不稳定区)
    均为跨政体的静态比较,不直接支持"相变"的动力学主张。这虽不塌核心(横截面分区已足够
    构成非平凡贡献),但 claim_type 与证据类型之间存在 mismatch(见 L4 专属红旗 17)。

    (C)【DED-014 贡献的窄化诚实问题】逐父移除分析显示:DED-014 仅在(iv)法治威权区有不可
    替代的机制贡献(轮替→0 处程序合法性天花板)。在(i)(ii)(iii)(v)(vi)中,DED-014 要么
    不贡献,要么仅提供"结构模板"(轮替×透明交互结构启发 DED-020 的独立×透明交互)这一
    发现层面而非逻辑必然性层面的贡献。虽未跌破 spectator brick 底线(DED-014 对 iv 的贡献
    是真且不可替代的),但 emergence_demonstration.necessity 段落声称移除 DED-014 则"无法
    解释(iv)的'稳定但天花板有限'"——这是准确的,但未诚实标注 DED-014 在其他三区无贡献的
    事实。建议在 necessity 段追加一句诚实注记。

    反例猎捕刻意攻最尖锐的涌现预测——空格(vi)"低轮替+低独立+高透明+长期稳定"和(iii)区
    的方向排序。构造了五路攻击,均被已有机制或测量约束合法消化,未猎到 scope 内净杀活反例。
    DED-004(不可证伪循环)和 DED-007(测量轴焊死)均未复发。

    三条 should 级缺陷可定向修订修复,核心不塌。裁决 needs_revision。

  # ============================================================
  # 标准红旗 (1-10)
  # ============================================================

  red_flag_findings:
    brick_conclusion: |
      未命中。L4-002 的非平凡内核不在任一条父推论结论的复述范围内。逐条核对:

      - DED-011 结论:派系必然→轮替开放度决定撕裂 vs 流动(单轴,不管透明度/独立度/不公集中度)。
      - DED-014 结论:轮替→0 时程序公平效应断崖+透明反成羞辱(单交互:轮替×透明,不管裁决独立度)。
      - DED-020 结论:裁决独立×透明交互——依附时透明反转为羞辱(单交互:独立×透明,前件不同于轮替)。
      - DED-017 结论:不公三条件同时到位→集体行动临界(单临界,不管轮替和裁决独立度)。

      L4-002 的三维相空间分区——四区+相变边界+空格——不在上述任一条的射程内:
      - DED-011 不给"低轮替+低独立+低透明"组合下的"稳定"预测(它与 DED-011 方向相反);
      - DED-020 不给"低轮替+高独立"下的"条件性稳定+天花板"预测;
      - DED-017 不给"三条件不全→犬儒"如何与轮替/独立度参数交互产生稳定分区;
      - 空格(vi)的预测需要 DED-011 + DED-020 合力,任一单独不强制该格为空。

      非平凡内核集中在:(a)三维交互效应的方向(透明不是单调好);(b)四区完整分区(任何双维框架
      产生不了);(c)跨区域相变边界;(d)空格(vi)。brick=conclusion 不命中 → 不判 required。

    nontriviality_cell_check: |
      通过。核心空格(vi)"低轮替+低独立+高透明+长期稳定"被预测为空,且不被任何单父推论平凡强制:

      - DED-011 单独:无轮替→不稳定。但它不区分透明度——对"低透明度"和"高透明度"给出相同的
        "不稳定"预测,不产生"高透明度格必然为空"的区分。
      - DED-020 单独:依附+透明→羞辱放大器。但它不区分轮替——对"有轮替"和"无轮替"给出相同的
        "依附+透明→羞辱"预测,不产生"无轮替条件下该格必空"的区分。
      - DED-017 单独:三条件临界。但它不区分轮替和独立度——对任何轮替/独立度组合,三条件不全时
        均预测"犬儒",不产生对该特定格的空预测。
      - DED-014 单独:轮替×透明交互。但它不涉及裁决独立度——不区分"低独立+高透明"与"高独立+
        高透明"在无轮替条件下的差异。

      空格(vi)可被"低轮替(制度事实独立测)+低独立(结构事实独立测)+高透明(制度事实独立测)+
      长期稳定(独立事件数据库测)"的现实案例填满 ⇒ 非空可满足、非同义反复。DED-004 未复发。

    measurement_orthogonality: |
      主干未重蹈 DED-007。四参数+复合输出变量异源正交:

      - 精英轮替开放度(a):成文换届规则清晰度(制度事实)+任期届满改选/轮换是否按期例行发生
        (程序事实)。【硬约束】不用"是否发生过和平交权"测(结局侧代理,与"输家不掀桌"同轴)。
      - 裁决独立度(b1):经济利益独立性(产权/雇佣/投资)+亲缘独立性(r≥0.125)+政治隶属独立性
        (上下级/同派系),由结构/关系事实独立测。不用"裁决结果是否偏袒"反推。
      - 程序透明度(b2):规则成文可查+裁决者遴选公开+发言机会+一贯性,由制度事实独立测。
        不用"结果是否被接受"反推。与独立度分轴测,不互相污染。
      - 不公三条件(c):不公集中度(资源差距统计+群体可区分度事前编码)+预存组织密度(社会组织
        登记/民族志/居住就业数据)+改革渠道(制度结构事实+非结局侧程序事实)。三个子条件各自
        独立测,不用"是否已爆发"反推。
      - 政体稳定性(复合输出):结构维度(制度崩溃事件由独立数据库/史料编码)+认知维度(败方行为
        接受由独立行为记录测)。两维度分轴测,不互相反推。

      五轴异源、各自独立测。DED-007 焊死未复发。不判 required。

      残留软点(已由 L4-002 自我标注):裁决独立度的"隐蔽依附"(表面无关系私下有交易)难以事前
      测——这是 DED-020 继承来的 primary_suspect 根源,非 L4 引入的新问题。另,三维参数空间中
      "透明度"在政体层面(信息自由/媒体独立)与 DED-020 的个体裁决层面(庭审公开/规则成文)是
      不同构念——L4-002 在 secondary_suspect 中已诚实标注此风险。

    scope_hook_independent_of_result: |
      不命中。两条 excluded_outcomes 均由事前可测的结构渠道划界:

      (1)"非持久性政体(过渡政府/临时行政当局)":按政体持续时间(不足一轮完整任期)事前测——
        前件"持久分配稀缺资源"不成立。这是事前结构判据,不由结果开脱。
      (2)"无中央政府/无裁判机制的社会(无政府状态/部落社会无正式裁决)":按"是否存在制度化
        裁决机制"事前判。裁决独立度和程序透明度的概念在此类社会中无法操作化。

      两条均非"遇到反例就事后开脱"的活门 → 合规。不判 required。

    criterion_tier_match: |
      不命中。所有参数均明列为连续量:轮替开放度从 0(终身制/从未兑现)到 1(制度化定期轮替
      且每次兑现);裁决独立度从完全独立到完全依附;透明度四个维度连续合成;不公集中度连续;
      稳定性为程度非二分。四区(i)-(iv)是按参数组合定义的 heuristic 分区,非硬性分类学——
      operationalization 中明确各量为连续谱。被预测量使用比较语言(更稳定/最不稳定/条件性
      稳定)而非硬二分。合规 → 不判 required。

    anti_talisman_cashed: |
      【should 级残留——缺失 consolidated clause】。L4-002 在各 operationalization 子段中
      有分散的防循环约束到位:
      - 轮替开放度:"不得用'是否发生过和平交权'测"(结局侧禁用)
      - 裁决独立度:"须由结构+关系事实独立测,不得由裁决结果反推"
      - 透明度:"不得因结果被接受就倒推程序必透明"
      - 不公三条件:"三个条件各自独立测,不得由'是否已爆发'反推"
      - 稳定性:"两维度分轴测,不互相反推"

      但 L4-002 缺少一段统一的、覆盖 L4 合成层面的 anti_talisman_clause——
      类似于 DED-011/014/020/017 各自拥有的 consolidated 防循环条款,规定:
      "在三维参数空间中遇到疑似反例时,不得事后调低/调高任一参数估值来消化;
      尤其不得遇到空格(vi)似被填上时,事后调高轮替估值或调低透明度估值或默认
      '裁决其实独立'来消化。"

      分散约束已覆盖大部分风险,按本体系惯例应补一段 consolidated clause 以
      达到与父推论同等的防循环完备性。此为 should 级,因实际防线已通过分散约束
      存在,只是形式不完备(见 required_fixes ①)。

    anchor_fact_check: |
      无事实错。逐锚核:

      - (i)民主稳定区锚:战后西欧/北美/大洋洲的稳定民主政体——制度化轮替(定期选举并兑现)+
        独立司法(法官终身制/独立薪酬/回避规则)→败选方接受结果,等下届再争。标准史实,无错。
        confidence 诚实标注为 moderate-strong(属 DED-011+DED-020 共锚)。

      - (iii)最不稳定区锚:前苏联晚期/东欧 1980s 末——无制度化轮替(一党制)+裁决依附+
        改革期透明度上升→合法性空洞→1989 连锁崩溃。honest_note 承认"1989 多因交织(经济停滞/
        外部示范/戈尔巴乔夫不干预),单案归因需谨慎"——这是对证据强度的诚实降级,非事实错。
        方向性合理。

      - (ii)威权稳定区锚:高度封闭的无轮替政体(绝对君主制/封闭一党制)——无轮替(终身制)+
        无独立裁决+信息高度不透明→长期犬儒而非造反。方向性合理,无事实错。confidence 诚实
        标注为 weak-moderate,honest_note 承认"封闭政体内部信息难以获取"。

      - (iv)法治威权区锚:殖民地独立司法(英国殖民地普通法体系)——无政治轮替(总督任命)+
        独立司法(法官职业化/普通法传统)→程序合法性缓冲轮替缺失,但天花板随时间逼近。
        confidence 诚实标注为 weak,honest_note 承认"单案多因交织,是(iv)区最薄弱锚"。

      - (v)相变边界锚:法国大革命前旧制度——三条件激活后从稳定区跨越临界→1789 爆发。
        honest_note 承认"多因交织,只作方向性合成锚"。方向性合理,无事实错。

      五锚无致命事实错。但需注意:confidence 级别从 weak(两锚)到 moderate(两锚)到
      moderate-strong(一锚),整体经验底座中等偏弱——这是 L4 复合推论的特征(离地基更远),
      非事实错。不判 required。

    definition_vs_prediction: |
      通过。核心主张均为可证伪的经验预测,非必然为真的定义:

      - 预测(i)-(iv)的四个稳定分区:可由跨政体比较检验——若各区的稳定性排序与预测不符
        (如(ii)威权稳定区不比(i)民主稳定区更不稳定,或(iii)不比(ii)更不稳定),预测被证伪。
      - 空格(vi):可被一个满足所有独立测量条件的干净反例推翻(见 falsifiability(a))。
      - 相变边界(v):可由纵向案例检验——若三条件激活后政体稳定性不降,预测被证伪。
      - 三维交互结构:可由 falsifiability(c)推翻——若独立×透明交互在不同轮替水平下效应
        方向一致(无三轮替水平),则三维交互不必要。

      所有关键条件的测量方案均独立于被预测量。合规 → 不判 required。

    enumeration_and_species: |
      不命中。L4-002 不声称"N 类可枚举"。四区(i)-(iv)是按三维参数空间的笛卡尔积定义的
      分区,非 species 分类学。跨区域相变边界(v)是机制层面的通用临界条件,非第 N 类。
      参数均为连续量,区域边界是启发式分区。合规 → 不判 required。

    primary_suspect_aim: |
      【指对,且诚实】。L4-002 自认 primary_suspect:
      (a)"高轮替+高独立"组合是否真的完全不受透明度影响——若极度透明的选举揭露"轮替只在
        两个相似精英集团之间"→DED-014 ceiling 效应发作→合法性受损。
      (b)轮替开放度和裁决独立度在现实中高度正相关→低轮替+高独立和高轮替+低独立交叉格
        天然案例稀少→(iv)法治威权区的实证基础最薄。

      审查确认:这两个怀疑方向准确。(a)已在 real_world_anchors.counterexamples 中被部分
      承认——近年民主国家政治信任下降构成(i)区的边界挑战,L4-002 诚实标注为
      "counterexample_hunt_open(边界反例)"。(b)是结构现实——自然数据中轮替和裁决独立
      高度相关,使相图的对角格(低轮替+高独立/高轮替+低独立)天然案例少——这是一个真实的
      检验障碍而非推论缺陷。secondary_suspect 标注的"政体透明度 vs 裁决透明度构念差异"
      也被诚实记录。

      primary_suspect 指得准,且 L4 已诚实标注风险。不判 required。

    # ============================================================
    # L4 专属红旗 (11-17)
    # ============================================================

    spectator_brick: |
      【通过,但 DED-014 的边际贡献窄——已记 should】。逐条移除分析:

      - 移除 DED-011:轮替轴消失。无法区分"民主稳定区"(i)和所有低轮替区域(ii/iii/iv),
        相图退化为"裁决独立度×不公集中度"二维平面。DED-011 对 (i)(ii)(iii)(iv)(vi) 均有
        贡献——判断所有涉及轮替高/低的格都需要它。贡献广泛且不可替代 → 非观众砖。

      - 移除 DED-020:独立×透明交互消失。无法区分(ii)和(iii)(两者的差别恰在透明度的方向:
        低透明=缓冲 vs 高透明=羞辱放大器)。对 (ii)(iii)(i)(vi) 均有贡献。贡献广泛且不可
        替代 → 非观众砖。

      - 移除 DED-017:跨区域相变边界消失。只剩(i)-(iv)的静态分区,缺"任何区域在什么条件下
        越过临界→集体行动"这一动态边界。对 (ii)(v) 有不可替代贡献——(ii)的"稳定"预测
        需要 DED-017 的犬儒机制来翻转 DED-011 的"不稳定"方向。贡献关键且不可替代 → 非观众砖。

      - 移除 DED-014:程序公平天花板逻辑消失。无法解释(iv)的"稳定但天花板有限"这一条件性
        判断。DED-014 贡献"轮替归零→程序合法性归零"的乘积关系,这是(iv)区的核心约束。

      但需诚实标注:DED-014 的不可替代贡献集中在(iv)一区。在(i)(ii)(iii)(v)(vi)中,
      DED-014 要么无直接贡献,要么仅提供"结构模板"(轮替×透明交互结构启发 DED-020)这一
      发现层面非逻辑必然性层面的贡献。这使 DED-014 成为四条父推论中边际贡献最窄的一条。
      虽然它仍通过了 spectator brick 底线((iv)区的天花板预测确实需要它,非任何其他父推论
      能替代),但 L4-002 的 emergence_demonstration.necessity 段落声称移除 DED-014 则
      "无法解释(iv)的'稳定但天花板有限'"——此句准确,但未诚实标注它在其他三区无贡献。
      建议在 necessity 段追加诚实注记(见 required_fixes ③)。

    trivial_conjunction: |
      【通过——多父逐格判空确认至少 5 格需要 ≥2 条父推论合力】。

      我亲自做了完整的多父逐格判空归属分析(见 multi_parent_cell_attribution),结果如下:

      基线笛卡尔积(c=三条件不全,犬儒基线):
      ┌────────────────────┬──────────────────────┬──────────────────────┐
      │ (a,b)              │ 高轮替               │ 低轮替               │
      ├────────────────────┼──────────────────────┼──────────────────────┤
      │ 高独立+高透明      │ (i)≥2父              │ (iv)≥3父             │
      │ 高独立+低透明      │ 1父(DED-011)         │ 1父(DED-011)         │
      │ 低独立+高透明      │ ≥2父                 │ (iii)≥2父            │
      │ 低独立+低透明      │ 1父(DED-011)         │ (ii)≥3父             │
      └────────────────────┴──────────────────────┴──────────────────────┘
      空格(vi):≥2父(DED-011+020)
      相变边界(v):≥2父(DED-017+所在区域父推论)

      至少 5 个格标注为需要 ≥2 条父推论合力:
      - (i):DED-011(轮替→稳定) + DED-020(独立+透明→正效应)。DED-011 不给独立度贡献,
        DED-020 不给轮替贡献。两者合力才产出"高轮替+高独立→任何透明度下稳定"。
      - (ii):DED-011(无轮替→不稳定) + DED-020(低透明=羞辱放大器未激活→缓冲) +
        DED-017(三缺一→犬儒)。三者合力才产出方向逆转——从 DED-011 单独预测的"不稳定"
        翻转为"稳定(犬儒)"。这是最尖锐的涌现格——单父推论预测"不稳定",三父合力预测"稳定"。
      - (iii):DED-011(无轮替→不稳定) + DED-020(依附+透明→羞辱放大器)。两者同向加剧
        →"最不稳定"。任一条单独不给"最"的程度。
      - (iv):DED-011(无轮替→不稳定) + DED-020(独立→正效应,反向拉力) +
        DED-014(轮替→0→合法性天花板)。三者合力才产出"条件性稳定+天花板有限"——这是
        两个相反方向拉力下的净结果+天花板约束。
      - (vi)空格:DED-011(无轮替→不稳定) + DED-020(依附+透明→羞辱)。两者同向→该格
        不可长期稳定。任一单独不强制该格为空(DED-011 不区分透明度;DED-020 不区分轮替)。

      "1 父"格(高轮替+高独立+低透明、高轮替+低独立+低透明、低轮替+高独立+低透明)是
      无交互效应的单调区域——DED-011 的单条预测足够。这些格不构成 L4 的涌现卖点,但也不
      损害涌现论证——它们恰是"父推论单独够用"的对照格,衬托出"合力格"的非平凡性。

      结论:存在多个需要 ≥2 父合力才能预测的格 → 非平凡合取。通过 L4 涌现硬门槛。

    emergence_deficiency: |
      【通过——多父合力格≥5,含方向逆转格】。

      涌现的三层检验:

      第一层:至少一个格需要 ≥2 父合力? 是——至少 5 个(见 trivial_conjunction)。

      第二层:是否有方向逆转? 是——(ii)区:DED-011 单独预测"无轮替→不稳定",但 L4 预测
      "稳定(犬儒)"——方向逆转。这需要 DED-020(低透明缓冲)+DED-017(犬儒机制)才能解释。
      方向逆转是涌现的最强形态——它不可能由任何单父推论产生。

      第三层:是否有新实体产生? 是——"法治威权区"(iv)的"条件性稳定+天花板有限"状态,
      和"虚假稳定"(结构暂稳+认知空心化)这一可测区间,不在任何父推论中被单独识别。

      结论:涌现有效,通过了三层检验。不判 required。

    weak_parent_premise: |
      【通过——四条父推论全部 verified】。

      从 INDEX.md 确认:
      - DED-011:verified(经三轮审查:r1 needs_revision → r2 needs_revision → r3 verified)
      - DED-014:verified(经三轮审查通过)
      - DED-020:verified(经 r1 verified)
      - DED-017:verified(经 r1 verified)

      四条父推论全部为 verified 状态,无 candidate 被用作主前提。通过。

    anchor_theft: |
      【通过——复合锚点均非单父锚的重复】。

      逐锚检查:

      - (i)民主稳定区锚:结合 DED-011 的轮替在场 + DED-020 的独立+透明正效应。DED-011
        的锚("竞争性选举政体——派系流动不固化")不讨论裁决独立度;DED-020 的锚("独立司法+
        高透明→败诉接受")不讨论轮替。L4-002 将两者合在同一相图格内,并增加了"任何透明度
        下都稳定"这一新判断。composite_specific=false(诚实标注为共锚),是复合锚而非偷窃。

      - (iii)最不稳定区锚:需要 DED-011(无轮替→不稳定)和 DED-020(依附+透明→羞辱放大器)
        同时在场。DED-011 不讨论透明度,DED-020 不讨论轮替。该锚的"最不稳定"判断来自两者
        的同向加剧。composite_specific=true——这是原创复合锚。

      - (ii)威权稳定区锚:需要 DED-011+020+017 三方合力——方向逆转预测。composite_specific=
        true——原创复合锚。

      - (iv)法治威权区锚:需要 DED-011+020+014 三方合力——条件性稳定+天花板。composite_
        specific=true,confidence=weak——原创但经验基础薄。

      - (v)相变边界锚:需要 DED-017 的三条件+所在区域的父推论合力。composite_specific=true。

      五锚中四锚为复合原创锚,一锚为共锚(诚实标注)。无单父锚的重复使用 → 不判锚点偷窃。

    interaction_measurement_gap: |
      【通过——复合输出可测量为"区别于 A 单独+B 单独"的东西】。

      复合输出"政体稳定性"的两个维度:
      - 结构维度(是否制度性崩溃):可由独立事件数据库/史料编码测——这是 DED-011 的被预测量
        (派系撕裂/僵局/清洗/分裂)的跨层映射,但有扩展(加入了"制度崩溃"的定义域)。
      - 认知维度(败方是否接受):可由败方行为记录独立测——这是 DED-014 的被预测量(败方接受度)
        的跨层映射。

      独有可测区间"虚假稳定"(结构暂稳+认知空心化):这个区间需要同时测两个维度且发现它们
      分离——结构上未崩溃但认知上合法性已空心化。这需要同时测量结构崩溃(独立事件数据库)和
      败方行为接受(独立行为记录),两者异源。这是一个可独立于"仅测结构"或"仅测认知"的复合
      输出——DED-011 单独测不到"认知空心化"(它只测结构撕裂),DED-014 单独测不到"结构暂稳
      下的认知空心化"的全貌(它不测结构维度)。

      通过——复合输出可被独立测量且不能还原为任一单父的输出。不判 required。

    claim_type_evidence_mismatch: |
      【should 级——phase_transition 需要纵向证据,当前以横截面为主】。

      L4-002 的 claim_type 声明为 phase_transition。phase_transition 的核心含义是:
      同一系统在参数跨越临界值时发生状态突变。这要求:
      (a) 相空间中有可区分的"相"(稳定区/不稳定区)——满足(四区+空格);
      (b) 存在跨越相的边界条件——满足(DED-017 三条件激活=相变边界);
      (c) 有证据展示同一系统随参数变化从一个相变到另一个相——此条证据偏薄。

      当前 real_world_anchors 中:
      - (i)(ii)(iii)(iv)锚均为横截面对比——不同政体落在不同格,属于比较静态学(comparative
        statics)而非动力学(dynamics)。
      - 只有(v)法国大革命锚提供了纵向相变证据:旧制度在三条件不全时处于稳定格→三条件激活
        →跨越临界→1789 爆发。这是一个纵向案例。
      - boundary_cases 中的新加坡/香港暗示了参数渐变,但未编码为完整相变序列。

      横截面分区已经足够构成非平凡贡献(四区本身的划分就是新知),且 L4-002 的 falsifiability(c)
      提供了纵向检验的设计(跟踪同一政体在不同轮替水平下的独立×透明交互效应)。但 claim_type
      与证据主力之间存在 mismatch——phase_transition 暗示的动力学证据比当前提供的更多。

      建议:(a)将 claim_type 调整为更诚实的 "phase_diagram" 或 "comparative_statics_with_
      transition_boundary",或(b)追加至少一个完整的"同一政体参数渐变→相变"的纵向锚(见
      required_fixes ②)。此为 should 级——不塌核心,但 claim_type 应诚实匹配证据类型。

  # ============================================================
  # 多父逐格判空归属分析 (multi_parent_cell_attribution)
  # ============================================================

  multi_parent_cell_attribution: |
    【审查者亲自执行——非依赖 L4 自述】

    参数空间 = 精英轮替开放度(a: high/low) × 裁决独立度×透明度组合(b: 四个关键组合格)
            × 不公三条件(c: not_all_met=犬儒基线 / all_met=临界激活)

    第一步:从每条父推论抽取核心自变量与预测方向。

    DED-011 核心自变量:轮替开放度(rotation openness)
      预测方向:rotation=high → 输家有未来预期 → 稳定(派系流动不固化)
               rotation=low  → 输家无未来预期 → 不稳定(僵局/清洗/分裂)
      独立于:透明度、裁决独立度、不公集中度(这些均不在 DED-011 射程内)

    DED-014 核心自变量:轮替开放度 × 程序透明度
      预测方向:轮替→0 时,程序公平效应断崖——乘积关系:程序接受度 ∝ 轮替 × 透明度
              轮替→0 → 乘积归零,无论透明度多高
              且零轮替+高透明 < 零轮替+低透明(反常方向)
      独立于:裁决独立度(不在 DED-014 射程内;轮替≠裁决独立)

    DED-020 核心自变量:裁决独立度 × 程序透明度
      预测方向:独立+透明→正效应;依附+透明→羞辱放大器(方向反转)
              依附+高透明 < 依附+低透明(反常方向)
      独立于:轮替开放度(不在 DED-020 射程内;裁决独立≠轮替)、不公集中度

    DED-017 核心自变量:不公集中度 × 预存组织密度 × 改革渠道缺失度
      预测方向:三条件全满足 → 集体行动临界
              三条件不全 → 不公转犬儒不转行动
      独立于:轮替开放度、裁决独立度、透明度(均不在 DED-017 的必要条件射程内——
              虽然"改革渠道"概念与 DED-011 的翻盘机制有重叠,但 DED-017 的"改革渠道"
              是伞级判据"给受损群体不掀桌也有改善可能的路",其在场/缺失独立于轮替/独立度)

    第二步:基线笛卡尔积(c=三条件不全,犬儒基线)。逐格标注该格的预测由哪条(些)父推论强制。

    格 1:高轮替 + 高独立+高透明 → 预测:稳定(i区)
      DED-011:rotation=high → 稳定 ✓(贡献方向:稳定)
      DED-014:N/A(轮替在场→天花板逻辑不触发)
      DED-020:ind=high+trans=high → 正效应 ✓(贡献方向:稳定,额外加固)
      DED-017:c=不全 → 犬儒(中性——不贡献稳定也不贡献不稳定)
      来源归属:【DED-011 + DED-020 合力】
      单父判定:DED-011 单独→稳定(但不区分独立度/透明度)。DED-020 单独→正效应(但不说
        轮替)。两者方向一致→合力产生"任何透明度下都稳定"的加强版预测。
      合力格 ✓(≥2 父)

    格 2:高轮替 + 高独立+低透明 → 预测:中稳定
      DED-011:rotation=high → 稳定 ✓
      DED-020:ind=high+trans=low → 弱正效应(透明低=正效应弱但不反转,因独立在场)
      来源归属:【DED-011 单独】(DED-020 的正效应弱但不改方向,DED-011 单条已充分预测稳定)
      单父格

    格 3:高轮替 + 低独立+高透明 → 预测:中低稳定
      DED-011:rotation=high → 稳定(正方向)
      DED-020:ind=low+trans=high → 羞辱放大器(负方向)
      两力反向→净结果不确定,但合力中等(轮替在场部分缓冲了羞辱效应:输家还可等下轮)
      来源归属:【DED-011 + DED-020 合力】(方向相反,需两者才能判断净结果)
      合力格 ✓(≥2 父)

    格 4:高轮替 + 低独立+低透明 → 预测:中稳定
      DED-011:rotation=high → 稳定 ✓
      DED-020:ind=low+trans=low → 隐匿区(羞辱放大器未激活,中性/弱负)
      来源归属:【DED-011 单独】(低透明使 DED-020 效应近乎中性,DED-011 单条已充分预测)
      单父格

    格 5:低轮替 + 高独立+高透明 → 预测:条件性稳定+天花板有限(iv区)
      DED-011:rotation=low → 不稳定(负方向) ✗与预测方向相反
      DED-014:rotation→0 × transparency=high → 乘积关系→程序合法性归零(负方向,天花板)
      DED-020:ind=high+trans=high → 正效应(正方向,反向拉力)
      两负(DED-011+014)一正(DED-020) → 净结果:条件性稳定但天花板有限
      来源归属:【DED-011 + DED-014 + DED-020 三父合力】
      单父判定:DED-011 单独→不稳定(错误方向)。DED-020 单独→正效应(但不解释为何"条件性"、
        不解释天花板)。DED-014 单独→轮替×透明乘积归零(但不解释独立度正效应)。
        三父缺一不可——缺 DED-011 则失去不稳定拉力;缺 DED-020 则失去独立度正效应;缺 DED-014
        则失去天花板机制(无法解释为何不是"独立完全对冲轮替缺失→稳定")。
      合力格 ✓(≥3 父)

    格 6:低轮替 + 高独立+低透明 → 预测:低稳定
      DED-011:rotation=low → 不稳定 ✓
      DED-020:ind=high+trans=low → 弱正效应(不足以对冲 DED-011 的不稳定)
      来源归属:【DED-011 单独】(DED-020 正效应太弱,不改方向)
      单父格

    格 7:低轮替 + 低独立+高透明 → 预测:最不稳定(iii区)
      DED-011:rotation=low → 不稳定(负方向)
      DED-020:ind=low+trans=high → 羞辱放大器(负方向,加剧)
      两负同向加剧→"最不稳定"
      来源归属:【DED-011 + DED-020 合力】
      单父判定:DED-011 单独→不稳定(但不给"最")。DED-020 单独→羞辱(但不区分轮替水平)。
        两者同向才能得出"最不稳定"——任一单独只能出"不稳定"而非"最不稳定"。
      合力格 ✓(≥2 父)

    格 8:低轮替 + 低独立+低透明 → 预测:稳定(犬儒)(ii区)
      DED-011:rotation=low → 不稳定(负方向) ✗与预测方向相反！
      DED-020:ind=low+trans=low → 隐匿区(羞辱放大器未激活→缓冲,中性)
      DED-017:c=不全 → 犬儒(三缺一→不公转犬儒不转行动)(正方向:稳定)
      来源归属:【DED-011 + DED-020 + DED-017 三父合力】
      单父判定:这是一个方向逆转格——DED-011 单独预测"不稳定",但 L4 预测"稳定(犬儒)"。
        DED-020 提供缓冲(中性和),DED-017 提供方向逆转机制(三缺一→犬儒→不行动→表面稳定)。
        缺 DED-017:预测=不稳定+缓冲="不稳定但被缓冲",非"稳定"。
        缺 DED-020:预测=不稳定+犬儒=犬儒式不稳定(矛盾)。
        三父缺一不可。
      合力格 ✓(≥3 父)——最尖锐的涌现格(方向逆转)

    空格(vi):低轮替 + 低独立+高透明 + 长期稳定 → 预测:空
      DED-011:rotation=low → 不稳定。不区分透明度。
      DED-020:ind=low+trans=high → 羞辱放大器。不区分轮替。
      两条同向→不可长期稳定。
      来源归属:【DED-011 + DED-020 合力】
      单父判定:DED-011 单独不区分透明度→不强制"高透明格"为空。DED-020 单独不区分轮替→
        不强制"低轮替格"为空。只有两者合力才强制:低轮替+依附+高透明→两股不稳定力量叠加→
        长期稳定不可能。
      合力格 ✓(≥2 父)

    跨区域相变边界(v):c=三条件全满足 → 任何(i)-(iv)区域→集体行动临界逼近
      DED-017:c=全满足 → 集体行动临界 ✓
      所在区域的父推论:提供"当前处于哪个稳定/不稳定区"的基线
      来源归属:【DED-017 + 所在区域的父推论合力】
      合力格 ✓(≥2 父)

    第三步:汇总。
    合力格(≥2 父):格 1(i区)、格 3、格 5(iv区)、格 7(iii区)、格 8(ii区)、空格(vi)、
      相变边界(v) = 至少 7 个标注点需要多父合力。
    单父格:格 2、格 4、格 6 = 3 个标注点仅需 DED-011 单条——这些是"父推论单独够用"的
      对照格,不损害涌现论证。
    方向逆转格:格 8(ii区)——DED-011 单独预测不稳定,L4 预测稳定(犬儒)——涌现的最强形态。

    结论:满足 L4 涌现硬门槛——至少一格需要 ≥2 条父推论合力,且存在方向逆转格。
    平凡合取不成立。

  # ============================================================
  # 反例猎捕 (counterexample_hunt)
  # ============================================================

  counterexample_hunt: |
    按 L4 评分卡要求,不仅要猎"某父推论不成立"的案例(那是 L3 的事),要猎"父推论都成立、
    但交互不产生 L4 预测的结果"的案例。刻意攻最尖锐的涌现预测。

    【攻击 1——空格(vi)的候选填充:新加坡】
    参数配置:低轮替?(PAP 自 1959 年连续执政,但存在制度化选举且反对党可参选偶获席位
    → 轮替并非完全趋零,更接近"低但非零");裁决依附?(司法高度独立——英国普通法传统,
    法官职业化,国际排名高→实际上是高独立而非低独立);透明度(高——法治指数/清廉指数
    均高,信息公开)。结论:新加坡不符合空格(vi)的参数条件——裁决独立度为高而非低。落在
    (iv)法治威权区边界而非空格(vi)。且 L4-002 已在 boundary_cases 中列新加坡/香港为
    (iv)区边界测试。非净杀。

    【攻击 2——空格(vi)的候选填充:改革前中国(1980s-1990s)】
    参数配置:低轮替(一党制无制度化轮替 ✓);低独立(法院系统受党委政法委领导→裁决依附 ✓);
    透明度——此参数为关键争议点。1980s-90s 经济改革期法制建设加速(成文法体系建立、
    行政诉讼法颁布),但政治/司法透明度整体偏低(无独立媒体、判决书在早期不公开)。
    透明度是否"高"?按 DED-020 的四维测量(规则成文+遴选公开+发言机会+一贯执行):
    规则成文=中(法律成文但不完备),遴选公开=低(法官任命不公开),发言机会=中(律师制度
    恢复),一贯性=低(同案不同判常见)。综合=中低偏,非"高透明"。结论:透明度不满足
    "高"的条件,不构成空格填充。非净杀。

    【攻击 3——空格(vi)的候选填充:当代越南】
    参数配置:低轮替(一党制,虽有党内定期换届但无多党轮替→轮替开放度趋零 ✓);
    低独立(法院受党的领导→裁决依附 ✓);透明度——近年经济开放+反腐运动(熔炉)带来
    一定信息公开,但政治/司法透明度整体仍低(无独立媒体/互联网审查)。透明度不满足"高"。
    结论:不满足空格参数条件。非净杀。

    【攻击 4——(iii)区 vs (ii)区方向排序的反例:伊朗】
    参数配置:低轮替(最高领袖终身制+宪法监护委员会筛选候选人→轮替趋零 ✓);
    低独立(司法系统受最高领袖控制→裁决依附 ✓);透明度——伊斯兰共和国有一定程度的
    选举竞争(总统/议会选举真实竞争)+相对开放的议会辩论→透明度是否高于典型封闭威权?
    若伊朗的透明度高于沙特/朝鲜(ii区案例)、且伊朗的稳定性(伊斯兰共和国存续 40+年)
    不低于这些(ii区)政体,则(iii)vs(ii)的方向排序受挑战——即"高透明+依附+无轮替"
    不比"低透明+依附+无轮替"更不稳定。
    诚实评估:伊朗的透明度(选举真实竞争+议会辩论+一定程度的新闻自由)确实可能高于完全
    封闭政体,但其稳定性(1979至今)也相当高。这构成对(iii)vs(ii)方向排序的潜在反例。
    消化口:(a)伊朗的"高透明"程度需独立测量——选举虽有竞争但候选人经宪法监护委员会
    筛选(限制竞争范围),透明度实质受限于审查制度,可能未达"高透明"阈值;(b)伊朗政体
    经历了大规模抗议(2009绿色运动/2019-2020/2022头巾运动),其"稳定"存疑——这些抗议
    虽被镇压,但反复爆发恰说明(iii)区的不稳定特征——稳定是表面而非实质;(c)DED-017
    三条件:2009/2022 运动中受损群体(改革派/年轻女性)有预存组织(学生网络/社交媒体)+
    不公集中+改革渠道被宪法监护委员会关闭→三条件接近满足→多次爆发→方向性支持(iii)的
    "不稳定"预测。综合:伊朗更接近(iii)区的不稳定特征(反复大规模抗议)而非(ii)区的
    犬儒稳定。非净杀,甚至方向性支持(iii)。

    【攻击 5——(i)区"任何透明度下都稳定"的反例:美国 2016-2020 政治信任危机】
    参数配置:高轮替(制度化定期选举+和平交权 ✓);高独立(司法独立传统 ✓);极高透明度
    (信息自由+媒体多样+政府公开 ✓)。但此期间政治信任骤降(选举公正性受质疑/国会山事件
    2021/两党互不承认对方合法性)。L4 预测(i)区"任何透明度下都稳定"——美国出现接近
    制度崩溃边缘的事件(国会山冲击),虽未到制度崩溃,但已接近临界。
    消化口:(a)L4-002 已在 primary_suspect 和 counterexamples 中诚实标注此风险——"若极度
    透明的选举揭露轮替只在两个相似精英集团之间→DED-014 ceiling 效应发作→合法性受损";
    (b)2021 国会山事件虽严重但制度最终守住了(权力依法移交),尚未到制度崩溃——属于边界
    反例;(c)"任何透明度下都稳定"的表述过于绝对,宜限缩为"在透明度未揭露轮替的实质局限
    的条件下稳定"。这是 L4-002 self-acknowledged 的 primary_suspect,非外部发现的新反例。
    攻击 5 成功将(i)区的绝对性表述从"任何透明度下"拉回到"诚实限缩",但未到 net kill 级别。

    猎捕结论:五路攻击均被已有机制(参数不满足/边界案例消化/测量约束/self-acknowledged)
    合法消化。未猎到同时满足"所有独立测量条件且推翻核心预测"的 scope 内净杀活反例。

    但需注意:空格(vi)的测试窗口因参数在自然数据中的共线性(低轮替+高透明、低独立+高透明
    均稀少)而狭窄——这使证伪变得困难,但不等于不可证伪。已验证 falsifiability(a)-(c)给出
    了可操作的检验设计,且独立测量方案在位。

  # ============================================================
  # DED-004 / DED-007 复发检查
  # ============================================================

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发】。

    falsifiability 给出三条明确证伪路径:
    (a)找到空格(vi)案例——低轮替+低独立+高透明+长期稳定(均由独立结构指标测得)。
       命中则证伪最尖锐涌现预测。
    (b)低轮替+低独立+高透明的稳定性【不低于】低轮替+低独立+低透明的稳定性。
       证伪(iii)与(ii)的方向排序。
    (c)独立×透明交互在不同轮替水平下效应方向一致(无三轮替水平)。
       证伪三维交互结构的必要性。

    三条均有明确的操作化判定标准,各自可独立测量。空格(vi)在逻辑上可被干净反例填满。
    与 DED-004"唯一新意被实证推倒后打折再推倒"完全不同。

    进一步检查是否残留"事后开脱"活门:
    - 各 operationalization 段有分散的防循环约束(不用结局反推参数)
    - excluded_outcomes 按事前结构判据划界,不由结果事后开脱
    - 空格(vi)的测试标准严格:四个参数均需由独立结构/制度指标测,不得因"长期稳定"
      就调低其他参数估值
    - 虽缺 consolidated anti_talisman_clause(见 required_fixes ①),但分散防线在位,
      循环读法已被有效约束

    DED-007(焊死测量轴):【未复发】。

    五轴异源:
    - 轮替开放度:成文规则+换届例行兑现(制度+程序事实)
    - 裁决独立度:经济/亲缘/政治三维结构事实
    - 透明度:成文规则/遴选/发言/一贯性(制度事实)
    - 不公三条件:资源统计/社会组织登记/制度结构(各自独立数据源)
    - 稳定性:事件数据库+行为记录(独立于前四者的数据源)

    五轴各自独立的数据来源和测量方法。DED-007 的"自变量与因变量共用同一数据源"焊死
    未复发。

    残留软点(已由 L4-002 self-acknowledged):
    - 隐蔽依附(表面无关系私下有交易)的测量噪声→交互项可能被稀释向零(Type II error
      而非 Type I error → 保守偏误)
    - 封闭政体内部信息不透明→三个参数的独立测量可靠性有限(已诚实标注)
    均非刻意焊死。

    结论:DED-004 和 DED-007 均未复发。

  # ============================================================
  # required_fixes
  # ============================================================

  required_fixes:
    - |
      [should] 补一段 consolidated anti_talisman_clause。当前各 operationalization 段有
      分散的防循环约束,但缺少一段 L4 专属的、覆盖三维参数空间合成层面的统一防循环条款。
      建议在 falsifiability 段后或 operationalization 段末增补:
      "【防不可证伪护身符——L4 合成层面】在三维参数空间(a×b×c)中遇到疑似反例时,四个
      参数(a轮替开放度/b裁决独立度×透明度/c不公三条件)与复合输出(政体稳定性)必须各自
      独立测、不互相反推。尤其不得遇到空格(vi)似被填上的案例时,事后调高轮替估值或调低
      透明度估值或默认'裁决其实独立'来消化。各参数的估值须由独立的制度/结构/程序事实
      坐实,不由'是否稳定'反推。"
      此举不改变逻辑结构,补齐形式完备性,使 L4 防循环标准与父推论齐平。

    - |
      [should] claim_type 与证据类型的 mismatch 修复——二选一:
      (a)将 claim_type 从 phase_transition 调整为更诚实的 "phase_diagram" 或
        "comparative_statics_with_transition"，因为当前证据主力为横截面对比(不同政体
        落在不同格),仅法国大革命锚提供了纵向相变证据。
      (b)保留 phase_transition 但追加至少一个完整的"同一政体参数渐变→相变"的纵向
        锚——例如:某个政体在透明度逐步升高过程中(其他参数不变)从(ii)区跨越到(iii)区
        并最终崩溃的完整序列(1989 东欧序列已部分提供,但可更系统化)。或在 falsifiability
        段追加"纵向检验设计"段,明确陈述如何用纵向数据检验相变预测。
      建议选(a)为更低成本——将 claim_type 改为 "phase_diagram" 即可准确反映当前证据类型,
      不塌核心(分区本身已是足够非平凡的贡献)。若选(b),需追加纵向编码工作。

    - |
      [should] 诚实限缩 DED-014 的贡献范围。当前 emergence_demonstration.necessity 段
      声称移除 DED-014 则"无法解释(iv)的'稳定但天花板有限'"——此句准确但未标注 DED-014
      在(i)(ii)(iii)(v)(vi)中无直接贡献的事实。建议在 necessity 段末尾或 DED-014 条目
      下增补诚实注记:
      "诚实标注:DED-014 的不可替代贡献集中于(iv)法治威权区(提供轮替→0 处程序合法性
      天花板机制)。在(i)(ii)(iii)三个区域中,DED-014 无直接预测贡献——(i)区仅需 DED-011+
      DED-020,(ii)区仅需 DED-011+020+017,(iii)区仅需 DED-011+020。DED-014 对 L4 的
      另一贡献是结构模板层面(轮替×透明交互启发 DED-020 的独立×透明交互),此为发现过程
      贡献而非逻辑必然性贡献。DED-014 是四条父推论中边际贡献最窄的一条,但它在(iv)区的
      贡献是真实且不可替代的。"
      此举不塌核心(DED-014 仍通过 spectator brick),但提升了诚实度,避免读者自行发现
      这一窄化后对 L4 整体可信度的折扣。

