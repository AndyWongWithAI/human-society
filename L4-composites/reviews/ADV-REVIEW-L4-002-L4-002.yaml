  counterexample_hunt: |
    round 3 刻意攻 round 1/2 未覆盖的攻击面，按 L4 评分卡特殊要求——猎"父推论都成立但交互
    不产生 L4 预测结果"的案例，非仅猎"某父推论不成立"的案例。

    【攻击 1——空格(vi)候选: 中国改革期(1980s-90s)】
    参数:低轮替(一党制无制度化多党轮替 ✓);低独立(法院受党委政法委领导→裁决依附 ✓);
    透明度——1980s-90s 经济改革期法制建设加速(成文法体系建立、行政诉讼法颁布)，但政治/
    司法透明度整体偏低(无独立媒体、判决书在早期不公开)。按 DED-020 四维测:规则成文=中
    (法律成文但不完备)，遴选公开=低(法官任命不公开)，发言机会=中(律师制度恢复)，一贯性=
    低(同案不同判常见)。综合=中低偏，非"高透明"。结论:透明度不满足"高"的条件，不构成空格填充。

    【攻击 2——空格(vi)候选: 当代越南】
    参数:低轮替(一党制，虽有党内定期换届但无多党轮替→轮替开放度趋零 ✓);
    低独立(法院受党的领导→裁决依附 ✓);透明度——近年经济开放+反腐运动(熔炉)带来一定信息
    公开，但政治/司法透明度整体仍低(无独立媒体/互联网审查)。结论:透明度不满足"高"。非空格填充。

    【攻击 3——(iii)区 vs (ii)区方向排序反例: 伊朗】
    参数:低轮替(最高领袖终身制+宪法监护委员会筛选→轮替趋零 ✓);低独立(司法受最高领袖控制→
    裁决依附 ✓);透明度中高(总统/议会选举真实竞争+议会辩论+一定新闻自由——明显高于沙特/朝鲜
    等(ii)区案例)。L4 预测(iii)区比(ii)区更不稳定。伊朗伊斯兰共和国存续 40+年(1979至今)，
    若其稳定性不低于沙特(ii区典型)，方向排序受挑战。
    消化:(a)伊朗透明度是否达"高"阈值存疑——候选人经宪法监护委员会筛选(限制竞争范围)、
    互联网审查——透明度可能仅"中"而非"高"。(b)伊朗经历反复大规模抗议(2009 绿色运动/
    2017-2018/2019-2020/2022 头巾运动)——恰说明(iii)区不稳定特征，每次被镇压但反复爆发，
    不符合(ii)区"犬儒稳定"画像。(c)DED-017 三条件在伊朗接近满足:受损群体(改革派/年轻女性/
    少数族裔)有预存组织(学生网络/社交媒体/工会残余)+不公集中+改革渠道被宪法监护委员会关闭
    →多次爆发→方向性支持(iii)的"不稳定"预测。综合:伊朗更接近(iii)区的反复不稳定特征，
    非净杀——甚至方向性支持(iii)。

    【攻击 4——(iv)区"条件性稳定+天花板"的时间尺度反例: 新加坡】
    参数:低轮替(PAP 自 1959 连续执政，虽有制度化选举且反对党可参选偶获席位→轮替开放度
    近零但非零)、高独立(英国普通法传统/法官职业化/国际排名高)、高透明度(法治指数/清廉指数
    均高)。L4 预测:(iv)区"条件性稳定+天花板有限"——天花板约 40-60 年逼近(round 2 时间
    尺度锚定)。新加坡已存续 65+年且无合法性崩塌迹象。若"天花板"在 65 年后仍未逼近，(iv)区
    "天花板有限"预测被削弱。
    消化:(a)新加坡轮替并非完全趋零——定期选举+反对党参选+偶获席位，轮替开放度严格说>0
    (虽是低值非零值)。(b)L4-002 已在 boundary_cases 列新加坡/香港为(iv)区边界测试。
    (c)65 年正处于时间尺度锚定的边界(~40-60 年)——新加坡是(iv)区天花板的活体检验。若再
    存续一代(至~100年)轮替仍趋零且无合法性空心化，(iv)区预测受实质性挑战。非净杀——但
    时间尺度锚定使新加坡成为可跟踪的纵向检验案例。

    【攻击 5——(ii)区"犬儒稳定"的替代机制: 中国】
    参数:低轮替(一党制无制度化多党轮替)、低独立(法院受党委政法委领导→裁决依附)、低透明
    (政治/司法透明度整体偏低)。L4 预测:(ii)区"稳定(犬儒)"——DED-017 三缺一→不公转犬儒
    不转行动。但中国稳定是否主要来自"犬儒"而非"镇压+经济增长(绩效合法性)"?
    消化:(a)L4 稳定性定义=无制度崩溃(革命/政变/内战/分裂)——按此定义中国稳定(未崩溃)。
    (b)犬儒 vs 镇压的机制归属难以独立裁定——DED-017 的 excluded_outcomes 将"短期外部镇压
    压制"排除，但中国的社会控制是长期制度化而非"短期"。若长期镇压 IS 稳定机制(非犬儒)，则
    (ii)区因果归因需修正——稳定性来自"镇压有效性"而非"犬儒"。但此修正不推翻 L4 的预测方向
    (该格仍是稳定的)，只修正机制解释。(c)经济增长提供了非程序合法性(绩效合法性)——此机制
    不在 L4 射程内，可能是一个被遗漏的独立参数。
    结论:非净杀——该格预测"稳定"仍成立，仅机制解释有待细分。建议在(ii)区锚 honest_note 中
    标注机制归属不确定性(见本轮新观察 G)。

    猎捕结论:五路攻击均被已有机制或 boundary_case 分类合法消化。未猎到同时满足"所有独立
    测量条件且推翻核心预测"的 scope 内净杀活反例。但攻击 4(新加坡)和攻击 5(中国犬儒vs镇压)
    暴露了 L4 的经验边界——新加坡是(iv)区天花板活体检验，中国(ii)区机制归属是开放问题。

