  # ============================================================
  # 反例猎捕 — Round 2
  # ============================================================

  counterexample_hunt_round2:
    methodology: |
      按 L4 评分卡要求, 猎两类反例:
      (1) 某父推论不成立 → L4-008 天花板受损
      (2) 父推论都成立, 但交互不产生 L4-008 预测的结果(L4 特有猎法)

      本轮重点关注 Round 1 未覆盖的新反例空间, 以及RF修复后新暴露的脆弱点。

    type1_parent_failure:
      cases:
        - id: PF-1-round2
          label: "DED-024 阶段3不可逆桥接到第三方惩罚行为——Round 1 预注册证伪路径"
          description: |
            DED-024 的阶段3不可逆是关于内化瓦解(自己的道德信念崩溃后回不去)。
            若实证发现C在信息完备后有显著比例(>40%)修正立场→推翻DED-024桥接
            (强不可逆), 但不推翻L4-008整体绑架回路。
            RF-3已在 falsification_trace.primary_suspect 中诚实标注此限缩。
          status: pre_registered_falsification_path
          severity: high (但L4-008已预埋+限缩)

        - id: PF-2-round2
          label: "【新】DED-026的epistemic trust桥接——DED-026原文不覆盖'C相信A的指控'"
          description: |
            DED-026 原文讨论"TP强度在群体边界处结构性陡降"——这是关于C对违规者的
            惩罚强度如何因【受害者】群体身份而变化。L4-008将DED-026桥接到:
            "A选择与自身共享群体身份的C→C更可能接受A对B的指控→TP触发概率更高"。

            此桥接需要额外前提: C对【指控者A】的 epistemic trust(认识论信任)随
            群体身份而变化——内群体指控者比外群体指控者更可信。DED-026原文未讨论
            此维度——它讨论的是"当C认为B违规时, C对B的惩罚强度", 不是"C在听到
            A的指控后, 是否更可能认为B违规"。

            若实证发现: C对指控的接受度不随指控者A的群体身份变化(或变化不显著),
            则DED-026的"选C策略"桥接被削弱→L4-008的"绑架效率"主张降级。

            此桥接的强度比DED-024桥接强——因为BR-L2-006(内群体偏好)确实包含
            信任维度——但不能直接从DED-026原文读出。应诚实标注此桥接的认识论跨度。
          status: mechanism_extension_risk
          severity: moderate
          note: "不影响L4-008核心机制(绑架可能性由DED-023单独保障), 仅影响'系统性/
            效率'主张。已在旗11 spectator_brick分析中标注。"

    type2_interaction_failure:
      cases:
        - id: CE-R2-1
          label: "【新——L4专有猎法】父推论全成立+三角结构存在→但C更愿验证而非惩罚——C与B的群体身份交叉"
          description: |
            构造场景: DED-023(TP由感知触发)成立, DED-026(群体边界绑定TP)成立,
            DED-021(校准回路)成立, DED-024(认知锁定)成立。

            A(内群体)指控B(内群体)违反了N。C与A和B共享同一群体身份。
            A的框架建构:"B威胁了我们的合作结构"。

            L4-008预测: A选内群体C→C的TP触发最大化→绑架成功率更高。

            但替代预测: C与B共享群体身份→C对B有 epistemic charity(认识论宽容)
            →C更倾向于认为"B可能被误解了"→C的验证意愿【上升】而非下降→
            C更可能先听B的解释再决定是否惩罚→绑架成功率下降。

            此场景的核心: DED-026的群体边界效应在"A是内群体"(指控者可信度高)
            和"B是内群体"(被指控者应得认识论宽容)之间存在【张力】——两者都来自
            内群体偏好但方向相反。当A和B都是C的内群体成员时, 哪一方的内群体效应
            占优取决于情境因素(如A和B各自在群体中的地位/与C的关系强度/A的指控
            具体程度等)——DED-026不提供裁决规则。

            攻击点: L4-008的"选内群体C"策略隐式假设C与A共享群体身份而B在群体外。
            当B也在群体内时, 内群体偏好的两个方向(信任A vs 宽容B)产生竞争,
            绑架成功率可能不升反降。当前模型的2×2矩阵未区分"A-C群体关系"与
            "B-C群体关系"——这是两个独立维度, 但被压缩为单一"群体边界"轴。

            L4-008可能的消化: (a) A的框架建构("B威胁了我们的合作结构")正是为了
            将B重新定位为"事实上的外群体"——即使B名义上与C同群, A通过框架建构
            破坏了B的内群体地位, 从而消解了认识论宽容→DED-026的边界可移动性
            在此发挥作用。(b) 但此消化依赖于A的框架建构成功——若C坚持认为B
            仍是内群体成员, 则A的框架建构失败→绑架失败。这引入了"A框架建构能力"
            作为新调节变量, 当前模型未建模。
          status: counterexample_candidate
          severity: moderate
          required_response: |
            在 boundary_cases 或 derivation 中加注: "当B与C共享群体身份时,
            内群体偏好的两个方向(对指控者A的信任 vs 对被指控者B的认识论宽容)
            存在竞争。A的框架建构('B威胁了我们的合作结构')旨在将B重新定位为
            '事实上的外群体'以消解此竞争——框架建构是否成功取决于A的叙事能力
            和B在群体中的地位。此动态引入了'A框架建构能力×B的群体内地位'的
            交互项, 当前模型的2×2矩阵未显式建模。"

        - id: CE-R2-2
          label: "【新——L4专有猎法】TP由'感知'触发 vs TP由'指控'触发——二阶信息问题"
          description: |
            构造场景: 四条父推论全成立。A指控B违反了N。C没有直接观察到B的违规行为——
            C仅接收到A的【指控】, 而非【直接感知】到违规。

            DED-023的核心实验证据(Fehr & Gachter 2002; Fehr & Fischbacher 2004)
            均在C【直接观察】到违规行为的条件下测量TP——C亲眼看到B free-ride或
            做出不公分配。DED-023的"TP由感知触发"中的"感知"是【一阶感知】——C直接
            感知到违规事件。

            L4-008的绑架场景中, C的"感知"是【二阶的】——C感知到"A声称B违规",
            而非直接感知到"B违规"。这两种感知在信息论上不等价:
            - 一阶感知: C直接接收违规事件的信息(信号=违规事件本身)
            - 二阶感知: C接收A关于违规事件的报告(信号=A的声称, 信号有噪声——A可能
              有选择性地呈现/歪曲/甚至虚构)

            若实证发现: 二阶感知触发的TP强度系统性低于一阶感知(因为C对"声称"
            比"亲眼所见"更谨慎), 则L4-008的绑架成功率需系统性下调——A的指控
            不等于C的"感知", 中间隔了一层信息来源可信度判断。

            此问题与 CE-2(round 1, A的信用破产)同根但更根本——即使A信用完好,
            "他人声称"与"亲眼所见"在触发TP的强度上可能仍有结构性差异。当前
            L4-008模型将"A的指控→C感知违规"视为透明传导(指控即感知), 未建模
            此二阶衰减。
          status: counterexample_candidate
          severity: moderate
          required_response: |
            在 S1 条件的描述中加注: "DED-023的'TP由感知触发'的实验证据基于
            C【直接观察】违规行为的场景。L4-008的绑架场景中C的感知是【二阶的】
            (C感知到'A声称B违规'而非直接感知到'B违规')。若二阶感知触发的TP
            强度系统性低于一阶感知, 绑架成功率需系统性下调——A的指控≠C的感知,
            中间隔着信息来源可信度判断。此衰减因子待独立实验标定。"

        - id: CE-R2-3
          label: "【新——L4专有猎法】B的'反绑架'——三角结构的对称武器化"
          description: |
            构造场景: 四条父推论全成立。A通过A→B→C三角结构绑架B(按L4-008模型)。
            但B不是被动的——B可以使用同一套机制进行"反绑架":
            B向C(或向其他旁观者D)框架建构A为"道德绑架者"——A不是在维护N,
            A是在利用N来强制B达成A的私人目标。

            若B成功: C的TP转向A——C惩罚A"滥用道德规范强制他人"→A被反制。

            攻击点: L4-008将道德绑架建模为A的【武器】, 但该武器是【对称的】——
            理解绑架机制的人(包括B和C)也可以使用同样的机制来反制。当前模型
            将B建模为被动的信息接收者(只能反驳A的具体指控), 未建模B的"元层次
            反框架建构"(指控A是绑架者)。

            S2(反驳不对称)仅覆盖"B反驳A的具体指控"的成本, 不覆盖"B重新框架建构
            A为绑架者"的成本。后者的成本可能低于前者——因为"A在利用道德"是一种
            【元指控】, 不需要反驳A的具体事实主张, 只需要让C怀疑A的动机。

            L4-008可能的自救: (a) S2的不对称同样适用于B的元指控——A可以更便宜地
            重新框架建构B为"被揭露后反咬一口的违规者", 形成框架建构的军备竞赛。
            (b) B的"反绑架"实际上是L4-008模型的对称实例——B变成了A, A变成了B,
            三角结构不变——这不推翻模型, 只说明该武器谁都可以用。

            但(b)的消化揭示了一个更深的问题: 如果绑架武器是【对称的】, 那么
            "A的绑架成功"取决于谁先发起框架建构(first-mover advantage), 而非
            谁持有更多权力——这与L4-008的核心主张"A不持有正式权力仍可强制B"
            存在微妙张力: 不是"A没有权力也能强制B", 而是"谁先成功框架建构谁
            就有权力强制对方"——框架建构本身【就是】权力。
          status: counterexample_candidate
          severity: low
          note: |
            不构成净杀——对称武器化不推翻绑架回路机制, 仅揭示绑架是双向可用的
            策略。但建议在 discriminant_validity 或 boundary_cases 中标注:
            "道德绑架武器是【对称的】——B同样可以使用元框架建构('A在绑架我')
            来反制A。绑架成功部分取决于谁先发起框架建构(first-mover advantage)
            和谁的框架建构更可信, 而非仅取决于谁预先持有更多权力。"

    hunt_summary: |
