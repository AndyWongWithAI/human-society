        "C的独立验证能力低 + B的反驳传播效率低 → 绑架成功率高"是可证伪预测。
        "S1/S2/S3全部缺席时绑架不可能"是可证伪预测(三个条件各自独立可测)。
        falsifiability 节给出三个明确证伪路径(a)(b)(c), 每个均独立于绑架成功的判定。
