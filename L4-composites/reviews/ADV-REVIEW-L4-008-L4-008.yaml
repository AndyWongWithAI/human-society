      这一命题在如下意义上是非平凡的:
      - DED-023 单独: TP 由感知触发——但没说"感知的触发条件可以被 N 的弹性变为
        永远可触发"(即"无论 B 做什么, 总可以找到一个说得通的论证说 B 违规")
