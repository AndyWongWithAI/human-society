    10_primary_suspect:
      verdict: pass
      note: |
        primary_suspect 仍定位精准: S3(C惩罚后不验证→不可逆)——DED-024 的阶段3
        不可逆性在第三方惩罚行为语境中的适用性。RF-3 已在 falsification_trace.
        primary_suspect 中新增【重要限缩】: C事后修正立场比例>40%推翻的是DED-024
        桥接(强不可逆), 而非L4-008的整体绑架回路。降级为"短期强制策略"而非整体
