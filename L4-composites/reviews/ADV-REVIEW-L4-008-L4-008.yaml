    - 未重蹈 DED-004/DED-007
    - 反例猎捕未得 scope 内干净击杀

    【L4-008 的非平凡贡献定位】
    L4-008 有三层贡献, 自内向外:
    (a) 核心交互层: Type II 结构劫持——DED-023 的 TP 感知触发 × DED-021 的
        校准两维要求 → C被置于"无论怎么判都不算错"的规范空间。这是真正的
        L4 级非平凡命题, 需要 DED-023+DED-021 交互合力, 不能从任一单父推出。
    (b) 叠加合力层: 格D的四父叠加——可能性(DED-023) + 效率(DED-026) +
        强度(DED-021) + 持久性(DED-024) → 完整绑架回路的高成功率。加法模型,
        非交互, 但有综合描述价值。
    (c) 概念创新层: N弹性概念是 L4-008 自建的理论工具——既不在 DED-023 也
        不在 DED-021——是合成两父时引入的桥接概念。此为 L4 复合推论的正当
        贡献方式(从父推论出发构建新概念), 应诚实标注为 "L4-008 original
        concept"。

    【诚实资产(非缺陷)】
    L4-008 的诚实标注密度在 L4 推论中属于最高档——DED-024 桥接机制跨度+
    替代机制+天花板论证限缩、A的非道德目标操作化双档+根本性测量边界声明、
    claim_type 与证据水平对齐、S0 元认知防御前提、Type I/II 涌现层级差异。
    这些诚实标注使推论的边界清晰、可证伪路径明确。在 L4 评分卡的
    "宁可错杀不放水"标准下, 诚实标注本身就是通过的关键证据。

    【should 级提醒(不阻塞 verified)】

    S1. DED-024 引用体系外机制应诚实标注:
        L4-008 在 necessity/Step E 中引用了四个替代机制(面子/声誉成本、确认
        偏误、成本沉没、理性无知)来论证"即使没有DED-024, S3仍可由较弱机制驱动"。
        这四个替代机制不在本体系任何 L3 推论中——它们是 L4-008 从体系外
        (社会心理学/行为经济学)引入的。L4-008 的 DED-024 天花板论证策略是
        "DED-024 提供最强版本, 若其桥接被推翻, 替代机制提供弱版本"——这依赖
        体系外机制作为 fallback。建议在 methodological_caveat 中加一句诚实声明:
        "S3的替代机制(面子/确认偏误/成本沉没)引自体系外社会心理学, 非本体系
        L3推论覆盖——L4-008 在此处桥接了体系外知识。"

    S2. N弹性概念应诚实标注为 L4-008 original concept:
        N弹性("规范N的违规判定标准允许任意解释的程度")是 L4-008 自建的理论
        概念——DED-023 不讨论规范弹性, DED-021 讨论违规严重度的可评估性但不
        讨论"规范弹性使严重度不可定义"。N弹性是 L4-008 合成两父时引入的桥接
        概念, 应诚实标注为 "L4-008 original concept, constructed to bridge
        DED-023 (TP by perception) and DED-021 (calibration requires
        assessable severity)" 而非 "derived from parent mechanisms"。
        这不削弱涌现——恰恰相反, 自建桥接概念是 L4 复合推论的正当贡献方式。
        建议在 emergence_demonstration 或 operationalization 中加一句诚实声明。

    S3. DED-026 的 epistemic trust 桥接应诚实标注:
        DED-026 原文讨论"TP 强度在群体边界处结构性陡降"——关于 C 对违规者的
