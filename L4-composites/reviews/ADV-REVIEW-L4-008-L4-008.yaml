  16_interaction_measurement_gap:
    verdict: needs_revision
    severity: required
    note: |
      【本轮审查核心战场之三——最严重的缺陷】

      L4-008 的复合输出变量是"道德绑架成功率"——操作化定义为:
      "在满足 A→B→C 三角结构的事件集合中, B 最终屈从于 C 的惩罚(或惩罚威胁)
      改变行为以符合 A 的要求的事件比例。"
      成功 = (C 惩罚了 B) 且 (B 改变了行为) 且 非(C 有独立验证能力)。

      问题的核心: 此操作化要求区分"A 的框架建构导致 C 惩罚 B"与"B 确实违规了, C
      正当惩罚 B, B 改正了"。两者的可观测结果完全相同——C 惩罚 B, B 改变行为——

      但对前者是"绑架成功", 对后者是"道德规范正常工作"。区分的唯一判据是 A 是否有
      非道德目标 + C 是否有独立验证能力。两个判据各自有问题:

      (a) A 的非道德目标: 如 #3 和 #6 所分析, 操作化自认"始终是概率性的"。
      (b) C 的独立验证能力: 虽可独立测量(信息可获取性 × 判定可操作性), 但在 Type II
          劫持中, "C 的独立验证能力低"正是因为 N 的弹性使判定不可操作——而这恰恰是
          绑架的核心机制。如果 C 的验证能力低是因为 N 弹性, 那么我们说"绑架发生
          是因为 C 验证能力低"——但这与"N 弹性是绑架的核心机制"形成循环:
          N 弹性 → C 验证能力低 → 绑架判定 → N 弹性作为绑架的机制解释。

      更根本的问题是: "道德绑架"与"正当道德论证"在边界上是连续谱而非二分。
      如果 N 有一定弹性(κ=0.5), C 的验证能力中等——此时既不是"干净的正当道德论证"
      也不是"干净的绑架"。L4-008 的框架将这视为"绑架的灰色地带", 但不会告诉
      我们灰色地带中"有几成是绑架"——因为判定 A 的非道德目标在灰色地带中更难。

      这不是可以通过更好的 measurement protocol 解决的问题——这是概念层面的边界模糊。
      与 DED-004(信息外化不对称)的问题类似: DED-004 的核心变量在概念层面就无法
      独立测量。L4-008 的"绑架成功"变量面临类似困境——操作化无法刚性区分
      "绑架"与"正当道德论证"。

      修正要求:
      (a) 【诚实降级】承认: 由于 A 的非道德目标在操作化层面不可刚性测量, "道德绑架
          成功率"这一变量在当前技术条件下只能在极端案例(信息可获取性极低 + N 极度模糊
          + A 的行为模式强烈指向非道德目标)中可靠判定, 在中间案例中不可靠。
          这将限制本推论的实证检验范围——只能检验极端案例, 不能检验全谱分布。
      (b) 【替代操作化】考虑将"绑架"的操作化从"A 的非道德目标 + ..."改为纯结构判据:
          "在 C 的独立验证能力低于阈值 + A 的框架建构为 C 惩罚 B 的必要信息前件的
          条件下, C 惩罚了 B 且 B 因此改变了行为"——不要求判定 A 的动机。此操作化
          的代价是可能将部分"正当但信息不充分的道德执行"误标为"绑架", 但收益是
          消除了不可操作的动机判定。可设置高低两档阈值: 低阈值(宽松)=所有满足结构
          条件的案例都算"结构绑架", 高阈值(严格)=仅当额外满足 A 的非道德目标独立
          编码判据时才算"实质绑架"。
      (c) 【标注认识论边界】在 limitations 或 methodological_caveat 中声明:
          "本推论的操作化区分'绑架'与'正当道德论证'依赖可独立测量的结构条件
          (C 的验证能力), 但二者在中等验证能力的案例中形成连续谱而非可二分判定的
          两类。本推论的实证检验聚焦于两端(验证能力极高 vs 极低), 中间谱段的
          推论适用性待测量技术进步后评估。"

    affects: operationalization.道德绑架成功率 (全部), 可能新增 methodological_caveat

  17_claim_type_mismatch:
    verdict: needs_revision
    severity: required
    note: |
      L4-008 的 claim_type = "social_form_prediction"。

      "social_form_prediction" 声称描述了一种可识别的社会形态(道德绑架的 A→B→C 三角)
      的存在性、发生条件和变异类型。这一类型要求:
      (a) 该社会形态的跨情境/跨文化可识别性证据——证明它不是偶发的个体行为而是
          有结构规律的 recurrent social form
      (b) 系统编码的案例证据——至少在一个社会语境中有系统抽样和独立编码,
          以确立该社会形态的经验存在性

      L4-008 提供的证据:
      - 三个轶事锚点(职场/社交媒体/婆媳关系), 全部 confidence=moderate,
        全部自认为印象式/方向性举证, 无系统编码数据。
      - 零个已发表/可独立核实的系统研究引用。

      当前证据水平最多支撑 claim_type = "mechanism_proposal"(机制假说)——
      即"基于父推论机制的逻辑合成, 提出一种可能的社会策略形态, 给出其可检验的
      结构条件"。social_form_prediction 需要的社会形态实证基础当前完全缺失。

      这不是致命问题——机制假说本身是有价值的理论贡献, Type I/II 的区分是
      真实的分析创新。但 claim_type 的选择必须与当前证据水平对齐, 否则会误导
      读者高估推论的实证成熟度。

      修正要求: 二选一:
      (a) 【推荐】将 claim_type 从 "social_form_prediction" 改为
          "mechanism_proposal" 或 "structural_hypothesis"——
          对应于当前的实际证据水平(机制推导 + 轶事方向性示意)。
          在 methodological_caveat 中声明待系统实证检验后升级为 social_form_prediction。
      (b) 保持 "social_form_prediction", 但新增至少一个系统编码的经验锚点——
          如对社交媒体 cancel culture 事件的系统抽样+独立编码(至少 50 个案例,
          按 C 的验证能力 + A 的行为模式 + B 的反驳成本三维独立编码),
          或对组织内"打小报告"行为的田野编码。同时将现有三个轶事锚点降级为
          "illustrative examples"(不承担 evidence burden)。

    affects: claim_type, real_world_anchors (整体定位), 可能新增 methodological_caveat

# ============================================================
# 反例猎捕
# ============================================================

counterexample_hunt:
  methodology: |
    按 L4 评分卡要求, 猎两类反例:
    (1) 某父推论不成立 → L4-008 天花板受损
    (2) 父推论都成立, 但交互不产生 L4-008 预测的结果(重点——L4 特有猎法)

  type1_parent_failure:
    cases:
      - id: PF-1
        label: "DED-024 阶段3不可逆的边界——C 在信息完备后修正立场"
        description: |
          DED-024 的阶段3不可逆是关于"我自己的道德内化崩溃后无法恢复"。
          如果实证发现: C 在惩罚 B 后, 当获得完备信息(证明 B 被绑架而非真正违规),
          有显著比例(>40%)的 C 能公开修正立场并道歉——

          这推翻的不是 DED-024(因为 DED-024 不讨论第三方惩罚行为的认知修正),
          而是 L4-008 将 DED-024 桥接到第三方惩罚行为的推理——S3 坍塌。

          L4-008 自身的 falsifiability (c) 已预埋此反例:
          "发现C在事后接触到完备信息（证明B被绑架）后，有显著比例（>40%）的C
          公开修正立场并道歉→推翻S3的不可逆性"

          对本推论的杀伤力: 若 S3 坍塌, L4-008 的"绑架不可逆"预测被推翻——
          绑架仍然可能发生(S1+S2 在场)但后果可逆。推论从"道德绑架是一个持久
          强制策略"降级为"道德绑架是一个短期强制策略(后果可被纠正)"。
        status: pre_registered_falsification_path
        severity: high (但 L4-008 已预埋)

  type2_interaction_failure:
    cases:
      - id: CE-1
        label: "【核心反例猎捕】父推论都成立但交互不产生L4-008预测——C的元认知防御使绑架系统性失败"
        description: |
          构造场景: 一个社会群体中, 所有四条父推论机制均正常运作:
          - DED-023: TP 由感知触发, 运作正常
          - DED-026: 群体边界绑定 TP 强度, 运作正常
          - DED-021: 校准回路正常(信息充足时)
          - DED-024: 认知锁定正常(C 的内化瓦解遵循四阶段)

          但该群体的成员 C 具有"道德绑架的元认知"——他们知道"道德绑架"作为一种
          策略存在, 因此在接收到 A 对 B 的指控时, 会主动进行"二阶验证":
          不仅验证"B 是否违规"(一阶), 还验证"A 是否有非道德目标"(二阶)。

          若 C 的元认知防御足够强, 即使在最危险格(低验证+不对称传播, 即格D)
          的参数条件下, C 也可能因为怀疑"这可能是道德绑架"而选择:
          (a) 延迟惩罚(等待更多信息)
          (b) 降低惩罚力度(保守惩罚)
          (c) 主动寻求 B 方信息(克服信息不对称)

          此场景中: 四条父推论都成立, S1+S2+S3 三个结构条件都满足(低验证+
          不对称传播+认知锁定), 但【绑架不成功】——因为 C 的元认知防御
          在 S1(TP 触发)之前插入了一个"这可能是在绑架我吗?"的检查点。

          攻击点: L4-008 的绑架回路模型(binding loop model)隐式假设 C 对
          A→B→C 三角结构无元认知——C 被动响应 A 的框架建构, 不质疑 A 的动机。
          但在"道德绑架"作为一个概念被广泛传播的社会中
          (如当代中文互联网中"道德绑架"是常见批评术语), C 可能已经具备此元认知。

          这不是某个父推论不成立——四条都成立。这是 L4-008 的模型缺少一个
          关键调节变量: 【C 的元认知防御水平】——C 对"道德绑架"这一策略的
          知晓程度和主动防御意愿。

          L4-008 可能的自救: (a) C 的元认知防御可以被纳入 S2 的扩展——"反驳传播成本
          不仅包括 B 反驳 A 的成本, 还包括 C 主动搜索验证信息的成本——当社会将
          '道德绑架'作为一个广泛认知的概念时, C 的验证成本实际上降低了(因为 C 有了
          一个现成的怀疑模板: '这会不会是道德绑架?')"。但这改变了 S2 的操作化——
          原 S2 只考虑 A 指控 vs B 反驳的成本不对称, 未考虑 C 的主动搜索成本。
          (b) C 的元认知防御可被视为 L4-008 的射程边界——推论预测的是"在 C 缺乏
          对绑架策略的元认知的条件下"的绑架成功率, 元认知防御的普及是推论适用范围的
          外部限制。

          评估: 此反例不构成净杀(因为可以通过射程限定或模型扩展消化),
          但揭示了 L4-008 的一个结构性盲点——C 在模型中被建模为被动的 TP 执行器,
          而非具有策略意识的行动者。这与 CONCEPT-agent(行动者有自己的目标并能
          看清处境)的定义存在张力——如果 C 是一个 agent, C 为什么不会学习识别
          绑架并防御?
        status: counterexample_candidate
        severity: high
        required_response: |
          在 S1 条件中或新增 S0 条件中显式声明"C 对绑架策略无元认知防御"
          作为绑架成功的隐含前提, 或者将 C 的元认知防御建模为调节变量,
          并给出其在 2×2 判据表中如何影响各格预测(如: 高元认知防御→
          格D 中绑架成功率从"高"降为"中"或"不确定")。

      - id: CE-2
        label: "A 的信用破产——'狼来了'效应使 TP 触发脱敏"
        description: |
          构造场景: A 在此前多次使用道德化语言指控不同对象, 且事后证明这些指控
          多数不成立(或被夸大)。C 对 A 的信用评估下降→当 A 再次指控 B 时,
          C 的 TP 触发阈值显著提高——即使当前指控可能是真的。

          四条父推论都成立——S1(TP 由感知触发)仍然运作, 但感知已被 A 的信用
          记录调制。DED-023 的 TP 触发机制本身不包含"指控者的信用权重"——
          TP 由"感知到违规"触发, 而"感知"的来源(谁在指控)影响感知的可信度。

          此反例揭示: S1 中"A 的指控→C 感知违规→TP 触发"这一链中,
          "C 感知违规"不只是"接收到指控信息"——C 会校准信息来源的可信度。
          A 的信用是 S1 的调节变量, 当前模型未建模。

          L4-008 可能的自救: 将 A 的信用纳入 S2(信息不对称)的扩展——A 的信用
          决定了 A 的指控对 C 的信息价值。高信用 A 的指控=高信息量→C 更可能被触发;
          低信用 A 的指控=低信息量→C 更可能无视。这不改变推论的核心机制,
          但需承认 S1 的 TP 触发不是无条件的——它受信息来源可信度调节。
        status: counterexample_candidate
        severity: moderate
        required_response: |
          在 S1 条件的描述中加注: "TP 由 C 对'B 违规'的感知触发——
          此感知受指控来源(A)的可信度调节。若 A 的信用已因过往虚假指控而破产,
          S1 的 TP 触发可能不启动, 即使 S2 和 S3 均满足。"

      - id: CE-3
        label: "【L4专有猎法】父推论全成立+三角结构存在→但不是绑架而是道德教育——A的动机与C的验证的交叉"
        description: |
          构造场景: A(家长)指控 B(孩子)"对长辈不尊重"(N='孝')。
          C(其他家庭成员)的验证能力低(家庭内部互动的私密性→信息不可公开获取),
          B 的反驳不对称(孩子反驳家长的道德权威有天然成本)。
          格D 条件(低验证+不对称传播)全部满足, S1+S2 也满足, 且 C 惩罚了 B。

          但这不是"道德绑架"——因为 A 的"非道德目标"判定在此语境中与"正当道德
          教育"不可区分。在社会共识中, 家长教育孩子尊重长辈被视为正当的道德教育,
          即使 A 可能从中获得个人利益(如更顺从的孩子=更省心的家长)。

          此案例挑战的是: L4-008 的绑架/正当道德论证的区分依赖"A 有非道德目标"
          这一不可观测变量——当社会共识认为 A 的行为是"正常/正当"时,
          操作化无法区分绑架与正当行为, 因为"A 的非道德目标"变成了一个
          社会建构的标签(取决于观察者站在 A 还是 B 的立场)。

          此案例与 #16(交互测量缺口)同根——但多了层社会建构的复杂性:
          什么是"非道德目标"不仅取决于 A 的心理状态(不可观测), 还取决于
          社会对"A 的角色义务"的共识——如果社会认为"家长使孩子尊重长辈"
          是角色义务而非个人利益, 那么 A 的行为被社会编码为"道德教育"而非
          "道德绑架"。但如果社会共识变化(如平等主义育儿观普及), 同一行为
          可能被重新编码为"绑架"。

          这意味着: L4-008 的"绑架"概念是相对于社会共识的——不是自然类(natural kind),
          而是社会建构类(socially constructed category)。这不使推论无效,
          但要求诚实标注其认识论定位: 推论描述的结构条件(S1/S2/S3→强制回路)
          是客观的, 但"这是否构成道德绑架"的最终标签是社会建构的。

          注: L4-008 自身在 boundary_cases 中已部分触及此问题——
          "B本身确实违反了N——'成功的绑架'与'碰巧正确的指控'的区分"。
          但此反例从相反方向攻击: 不讨论"B 是否真的违规", 而讨论"社会共识
          是否认为 A 的行为是正当的"——即使 B 未违规, 社会也可能因为
          A 的角色正当性而将 A 的框架建构视为"教育"而非"绑架"。
        status: counterexample_candidate
        severity: moderate
        required_response: |
          在 boundary_cases 或 methodological_caveat 中加一条:
          "'绑架'vs'正当道德论证'的判定部分依赖于社会对 A 的角色义务共识——
          同一行为在不同社会共识下可被编码为'教育'或'绑架'。
          本推论的结构条件(S1/S2/S3)描述的是【强制回路的存在性】(客观),
          而非【强制回路的道德定性】(社会建构)。后者的判定需额外引入社会共识变量。"

  hunt_summary: |
    猎到三个反例候选:
    CE-1(元认知防御): 最高杀伤力——揭示了模型将 C 建模为被动执行器而非策略行动者
      的结构性盲点。需要新增"C 的元认知防御水平"作为调节变量或射程前提。
    CE-2(A 的信用破产): 中等杀伤力——揭示了 S1 的 TP 触发受到信息来源可信度调节,
      当前模型未建模此调节。可通过在 S1 条件中加注"A 的信用权重"来消化。
    CE-3(社会建构边界): 中等杀伤力——揭示了"绑架"标签的社会建构属性,
      表明推论的结构条件描述客观回路但定性标签依赖社会共识。

    未猎到 scope 内干净击杀(父推论都成立+交互不产生绑架的明确现实案例)。
    三个反例候选均不推翻核心机制但揭示了缺失的调节变量和概念边界。

    最重要的发现: CE-1 表明 C 在模型中需要从"被动的 TP 执行器"升级为
    "具有策略意识的行动者"——这与 CONCEPT-agent 的核心定义一致
    (行动者有自己的目标并能看清处境)。若 C 是 agent, C 为什么不会学习识别
    绑架并防御? 当前模型对这一问题的沉默是其最显著的理论缺口。

# ============================================================
# 与 DED-004 / DED-007 的对照
# ============================================================

non_recurrence:
  ded004_check:
    verdict: pass
    note: |
      DED-004 的死因: 条件双重身份(自变量同时也是被预测量) + 事后用结果反推条件。
      L4-008 未犯此病: 自变量(C 的独立验证能力/信号传播不对称/N 的弹性)各有独立
      测量方案, 与被预测量(绑架成功率)在不同测量轴上。anti-talisman 约束明确。
      唯一风险点在 A 的非道德目标的操作化(见 #3 和 #6)——A 的非道德目标的部分判据
      ("A 在 B 屈从后停止道德化语言")依赖结果, 有轻微的 DED-004 式循环倾向。
      但 L4-008 已诚实标注"此推定始终是概率性的", 且将此判据与其他事前判据
      (跨情境一致性)并列, 未单独依赖。通过但已标注修复。

  ded007_check:
    verdict: pass
    note: |
      DED-007 的死因: 三个假说各自吸收各自的案例, 缺乏可被共同证据裁决的争议点。
      L4-008 未犯此病: 给出了三个可证伪条件(a)(b)(c), 共享同一组可独立测量的变量
      (C 的验证能力/B 的反驳成本/C 的事后修正率), 可被共同证据裁决。
      通过。

# ============================================================
# 裁决
# ============================================================

verdict: needs_revision
verdict_note: |
  L4-008 有真实的理论勇气和新颖贡献——将四条独立运作的道德机制(TP 自动化、群体边界绑定、
  校准自纠、瓦解不可逆)合成为"道德执行回路可以被不持有正式权力的第三方代理人系统性劫持
  为强制武器"这一原创命题。Type I(信息劫持)与 Type II(结构劫持)的区分是分析上有用的创新,
  Type II 的"不需要欺骗任何人"的论证是非平凡内核。

  L4-008 的非平凡内容有两层:
  (a) Type II 结构劫持: 当 N 的弹性使"B 是否违规"在操作化层面不可判定时, C 被置于
      "无论怎么判都不算错"的规范空间——这不是"C 被骗了", 是多条机制同时正常运作时
      系统涌现的合法武器化路径。这是真正的 L4 级非平凡命题。
  (b) 四父叠加的绑架回路: 可能性(DED-023) + 效率(DED-026) + 强度(DED-021) +
      持久性(DED-024) → 成功的持久强制。这是叠加型合力, 虽非机制交互但有综合价值。

  不判 rejected 的理由: (a) Type II 结构劫持是真实的非平凡内核, 不是平凡合取;
  (b) 四条父推论全部 verified, 父前提坚实; (c) 问题本质是操作化不足+证据标准错配+
  诚实标注不够, 非逻辑塌陷——与 DED-004 的结构性死病不同; (d) 给出了可定向修复的清单;
  (e) 逐格判空有至少一格(格C)需要 ≥2 父推论合力, 涌现门槛通过。

  判 needs_revision: 需 4 条 required 修订 + 2 条 should 修订后才能进入 round 2。

required_fixes:
  - id: RF-1
    priority: required
    title: "修复 A 的非道德目标操作化——堵 anti-talisman 循环"
    description: |
      当前操作化中 A 的非道德目标的判据之一("A 在 B 屈从后停止道德化语言")
      依赖绑架的结果来判定前件——有 DED-004 式的循环风险。

      修正要求:
      (a) 将 A 的非道德目标的所有行为判据限定为【事前可测】的指标——
          如"A 在类似情境中对不同对象使用相同 N 的一致性"(可在绑架事件前独立测量)。
          移除或降级依赖结果的判据("B屈从后A停止道德化语言")。
      (b) 新增 blind coding protocol: 编码者在不知 C 是否惩罚 B、B 是否屈从的条件下,
          仅根据 A 的行为模式历史(跨情境一致性/选择性使用 N 的证据)独立判定 A 的目标类型。
      (c) 或者, 考虑替代操作化: 将"绑架成功"的定义从"依赖 A 的非道德目标判定"改为
          纯结构判据——在 C 的独立验证能力低于阈值 + A 的框架建构为 C 惩罚 B 的必要
          信息前件的条件下, C 惩罚了 B 且 B 因此改变了行为——不要求判定 A 的动机。
    affects: operationalization.道德绑架成功率.measurement, operationalization.道德绑架成功率.limitations

  - id: RF-2
    priority: required
    title: "对齐 claim_type 与证据标准——降级为 mechanism_proposal"
    description: |
      当前 claim_type = "social_form_prediction" 要求跨情境社会形态的系统编码证据。
      但三条锚点全部为印象式/轶事型举证(confidence=moderate), 无系统编码数据。

      修正要求(二选一):
      (a) 【推荐】将 claim_type 从 "social_form_prediction" 改为
          "mechanism_proposal" 或 "structural_hypothesis"——
          对应于当前的实际证据水平(机制推导 + 轶事方向性示意)。
          在 methodological_caveat 中声明: 待系统实证检验后升级为 social_form_prediction。
      (b) 保持 "social_form_prediction" 但新增至少一个系统编码的经验锚点——
          如对社交媒体事件的系统抽样+独立编码(至少 50 个案例, 按 C 的验证能力/
          A 的行为模式/B 的反驳成本三维独立编码)。
    affects: claim_type, real_world_anchors (整体定位)

  - id: RF-3
    priority: required
    title: "诚实处理 DED-024 桥接——标注机制跨度及替代解释"
    description: |
      DED-024 的"阶段3不可逆"是关于内化瓦解(自己的道德信念崩溃后回不去)的机制。
      L4-008 将其桥接到"C 惩罚 B 后不承认罚错"——这是关于外部行为的认知一致性维护。
      两者的心理机制不同: 前者涉及道德信念重构(AXIOM-002 信息不消失),
      后者涉及社会声誉管理和认知一致性维护(不需要信息不消失来解释)。

      修正要求:
      (a) 在 derivation.steps.2 Step E 中诚实标注: "DED-024 的阶段3不可逆桥接到
          第三方惩罚行为的认知锁定存在机制跨度——前者是关于内化瓦解的不可逆,
          后者是关于社会行为的认知一致性维护。以下替代机制同样可驱动'C 不纠正':
          面子/声誉成本、确认偏误、成本沉没、理性无知。"
      (b) 在 emergence_demonstration.necessity(DED-024 段)中诚实限缩:
          "DED-024 为 S3 的不可逆性提供天花板论证(最不利场景下 C 完全不可纠正),
          但即使没有 DED-024 的强不可逆机制, S3 仍可由较弱的认知一致性机制驱动——
          区别在于不可逆的强度和持久性。若未来实证发现 C 在信息完备后容易修正立场,
          则 DED-024 桥接被推翻但 S3 的弱版本(延迟纠正而非永不纠正)仍可由替代机制维持。"
      (c) 在 falsification_trace.primary_suspect 中加注: 如果 C 在信息完备后修正
          立场的比例 >40%, 推翻的是 DED-024 桥接(强不可逆), 而非 L4-008 的整体
          绑架回路——绑架仍可能发生只是后果可逆。
    affects: derivation.steps.2 Step E, emergence_demonstration.necessity (DED-024 段), falsification_trace.primary_suspect

  - id: RF-4
    priority: required
    title: "处理 C 的元认知防御——从被动执行器升级为策略行动者"
    description: |
      CE-1 反例猎捕揭示了: 当前模型将 C 建模为被动的 TP 执行器(DED-023 的
      "感知→惩罚"自动链路), 但 CONCEPT-agent 定义行动者为"有自己的目标并能
      看清处境"的主体。如果 C 是一个 agent, C 在反复接触道德化指控后会学习
      识别绑架模式并主动防御。

      修正要求:
      (a) 在 S1 条件中或新增 S0 条件中显式声明: "C 对绑架策略的元认知防御水平
          是绑架成功的调节变量。当 C 具备对绑架策略的元认知(知晓'A 可能通过
          框架建构利用我的 TP 强制 B'这一策略模式)且愿意付出防御成本时,
          C 可以在 TP 触发前插入'这是否可能是绑架?'的二阶验证检查点,
          从而降低绑架成功率。"
      (b) 在 multi_parent_cells 中标注: 各格的绑架成功率预测假定 C 的元认知
          防御=低(即 C 被动响应 A 的框架建构)。当 C 的元认知防御=高时,
          所有格的绑架成功率下降 X 档(如格D 从"高"降为"中")。
      (c) 将 C 的元认知防御操作化为可测量变量: 如"在 vignette 问卷中,
          C 是否自发提及'这可能是在利用道德'作为不惩罚的理由"。
    affects: statement (Prediction), emergence_demonstration.multi_parent_cells

should_fixes:
  - id: SF-1
    priority: should
    title: "诚实标注 Type I vs Type II 的涌现层级差异"
    description: |
      Type II(结构劫持)是 L4-008 的非平凡内核——不需要欺骗任何人, 只需要 N 的
      弹性使违规判定不可操作化——这需要 DED-023+DED-021 合力才能推出。
      Type I(信息劫持)更接近 DED-023 的直接延伸("TP 由感知触发→可以通过
      控制感知来操纵 TP")。

      修正建议: 在 emergence_demonstration.novelty 中诚实区分:
      "Type II 是四条父推论合起来才能描述的社会形态(非平凡内核);
      Type I 是父推论机制的较直接延伸(平凡度较高但仍有类型学价值)。"
    affects: emergence_demonstration.novelty

  - id: SF-2
    priority: should
    title: "更新格C 的多父归属——从三父减为二父"
    description: |
      当前 multi_parent_cells 格C 标注为"需DED-023+026+021合力"。
      本轮逐格分析发现: DED-026 在格C 的贡献是效率增强(A 选群体内 C→提高成功率),
      不是必要机制——即使不选群体内 C, Type II 劫持仍可能(只要 DED-023 的感知触发+
      DED-021 的校准绕过成立)。格C 的真实合力是 DED-023 + DED-021(二父),
      DED-026 属锦上添花。

      修正建议: 将格C 归属更新为"DED-023+DED-021 二父合力(DED-026 为效率增强,
      非必要机制)", 并更新对应的合力格计数。
    affects: emergence_demonstration.multi_parent_cells 格C

