    15_anchor_theft:
      verdict: pass
      note: |
        重审确认。L4-008 的复合锚点是"A→B→C 三角结构"——A不持有正式权力,
        通过激活C的TP间接强制B。

        逐一审查四条父推论的锚点:
        - DED-023: Fehr & Gachter (2002) TP vs INT 正交性——二元关系,
          不涉及A→B→C三角。
        - DED-026: 最小群体范式 TP 强度差异——旁观者↔(违规者/受害者),
          不涉及三角结构。
        - DED-021: Fehr & Fischbacher (2004) 惩罚力度跟踪违规严重度——
          惩罚者↔违规者+二阶旁观者, 不涉及三角结构。
        - DED-024: 苏联解体后道德瓦解——个体内化瓦解(单人过程),
          不涉及三角结构。

        没有任何一条父推论描述"一个代理人A系统性利用这些机制达成自身非道德
        目标"的三角结构。复合锚点不是父推论锚点的重复包装。通过。

    16_interaction_measurement_gap:
      verdict: pass
      note: |
        【Round 2 重审——RF-1修复后的状态】

        RF-1 新增了结构操作化双档:
        - 低阈值(宽松): 仅结构条件满足即算"结构绑架"——C的独立验证能力低于
          阈值 + A的框架建构为C惩罚B的必要信息前件 + C惩罚了B + B因此改变行为。
          不要求判定A的动机。
        - 高阈值(严格): 额外满足 blind coding protocol 中A的非道德目标独立
          编码判据才算"实质绑架"。

        这消除了 Round 1 的核心测量缺口——结构操作化不依赖A的动机判定,
        可刚性测量。实质性操作化保留了更丰富的区分但标注了其概率性。

        但 residual 测量边界仍然存在且被诚实标注:
        (a) 在 N 高度模糊的情境中(Type II 的主要领地), A的非道德目标与真诚
            道德维护在操作化层面可能不可区分——根本性测量边界。
        (b) "绑架"与"正当道德论证"在中等验证能力的案例中形成连续谱而非可二分
