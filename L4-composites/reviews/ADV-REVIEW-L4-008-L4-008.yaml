        (c) "绑架"标签的社会建构属性——同一行为在不同社会共识下可被编码为
            "教育"或"绑架"。methodological_caveat 已标注。

        鉴于 claim_type 已降级为 mechanism_proposal, 当前测量方案与证据标准
        对齐。测量缺口已在 methodological_caveat 中诚实标注为未来工作方向。
        通过。

    17_claim_type_mismatch:
      verdict: pass
      note: |
        RF-2 已落地。claim_type 从 social_form_prediction 改为 mechanism_proposal。
        methodological_caveat 节声明:
        (1) 当前证据水平为方向性举证/方法论示例, 不承担 evidence burden
        (2) 测量边界: 连续谱而非可二分判定的两类——聚焦两端
        (3) 社会建构边界: 结构条件描述强制回路(客观), 定性标签依赖社会共识
        (4) Type I/II 涌现层级差异诚实区分

        mechanism_proposal 准确反映当前实证水平——机制推导+轶事方向性示意。
