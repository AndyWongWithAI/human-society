        中多处 anti-talisman 硬约束:
        - "C的独立验证能力的测量须独立于绑架是否成功的判定"
        - "规范模糊性不是规范的固有属性——需指定参照群体"
        - "不得因'绑架成功了'反推'验证成本必高'"
        limitations 中诚实标注: "在N高度模糊的情境中, A的非道德目标与真诚道德维护
