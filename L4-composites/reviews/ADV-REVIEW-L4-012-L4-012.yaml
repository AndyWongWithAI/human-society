  counterexample_hunt: |
    方法：r2 独立三路猎捕，不复用 r1 猎物清单——(1) 射程内猎"信用下滑但
    收敛未按预测发生"的历史事件；(2) L4 版专属猎"父机制都成立但交互不
    产生 L4 预测"；(3) 猎整改新引入的缺陷。

    【猎物 1：1971-1990 美元份额大跌与 1990s 全额回升——本轮主要捕获】
    经过：布雷顿森林崩溃（1971 尼克松关闭黄金窗口——事件类清单"选择性
    违约"候选）+ 1970s 大通胀（C2 确认）+ 1978-79 美元危机（卡特债券、
    IMF 替代账户谈判——各国央行明确寻求减持美元的公开记录）。美元储备
    份额从 ~80%（1970s 初）跌至 ~46-51%（1990-91），马克升至 ~18-20%、
    日元 ~8-9%；随后【全额回升】至 1999-2000 的 ~71%。
    对各预测的冲击测试：
    - 预测 (i) / falsifiability (a)(ii)：下滑期内流量碎片化到马克/日元/
      黄金近十年【无收敛】——字面上触发 (a)(ii)；消化路径存在但依赖未注册
      限定词（下滑持续性），见红旗 11。另一条消化路径对推论反而有利：
      马克/日元的六维得分【不】接近美元——德日央行主动抵制本币国际化、
      资本管制（D3 低）、可投资资产供给窄（D1/D5 低）——六维筛选解释了
      为何无收敛（无合格挑战者），且事前可由独立制度数据标定，符合
      anti_talisman (2)。此消化若成立，本案例转化为六维筛选的正面锚 +
      "触发逆转→迁移中止回流"的机制补全——但这必须写进文件并预注册
      限定词，不能由审查者代劳默认。
    - 预测 (v) 迟滞：无新主导者越阈值 → (v) 不适用。文件现有布雷顿森林
      消化把"崩溃后美元维持主导"读作 (v) 正面证据——过度解读（维持经由
      触发逆转实现，非网络效应扛住持续下滑），该句须改写。
    - 预测 (ii) 时序：1970s 储备分散化（SOV）确实领先于结算重构（MOE，
      石油计价/欧洲美元市场美元惯性极强）——方向支持 (ii)。
    裁决：非净杀——两条消化路径均存在且其一反哺推论；但事件缺编码 +
    (a)(ii) 限定词缺注册构成 required（RF-6）。这是"猎捕揭出别处过度
    伸张"的标准情形。

    【猎物 2：交互失效方向——欧债危机 2010-2012（C3 急性、发生在挑战者
    身上）】父机制视角：欧元区主权信用急性事件（希腊违约=清单内事件类，
    但发行者是挑战者非在任者）。推论射程只覆盖【在任储备资产】信用下滑
    ——挑战者信用崩塌导致其六维得分（D2/D6）塌方、储备流回在任者，
    这由六维框架自然吸收（锚 3 已含此消化）。无新缺口。
    【猎物 3：触发类型差异化的反向检验（对新增预测 (vi)）】2013 taper
    tantrum（C1 反向——实际利率急升）：金价大跌、央行购金放缓（2013 购金
    降温），生息美元资产受益——与 (vi)(a) 的反向对称预测一致（C1 反向→
    非生息候选失血）。2011 标普下调美债（C3 清单内事件）：黄金创历史
    新高、瑞郎承压至央行设限——非主权/小主权候选受益方向与 (vi)(b) 一致。
    未猎到 (vi) 的反例；(vi) 的可检性主张（样本可得性高）经此验证为实。
    【猎物 4：整改新引入缺陷扫描】连通性入格前提 (d)——对称注册（分区期
    不计证据也不计反例），非逃逸门 ✓；综合权重锁死 ✓；事件类清单的
    pre-commit 含义（2011/2023 评级下调自动入候选）已在 RF-1 核验中
    指出，属待执行非缺陷；池编码协议缺口——已捕获，即 RF-7。

    净结论：无净杀。r2 猎捕的实际产出 = 一个射程内未编码的重大历史事件
    （1971-1990，含对布雷顿森林消化段过度解读的定位）+ falsifiability
    (a)(ii) 的口径歧义 + 事件池编码协议缺口。预测 (vi) 在两个现代事件上
    的方向核验通过。

