    利差替代 CDS、实现通胀斜率替代 1978 前密歇根、IMF 年报储备构成
    序列替代 COFER；年度序列下行为腿重标定为年度降幅 ≥3σ）/ T3
    （1945 前：债务/GDP + 金平价事件，仅支持方向与时序编码、不支持
    σ 级行为腿判定——锚 1 的 delta 如实维持"方向一致性"级）。
    σ 口径通则：按所用序列自身事件前可得全部区间一次性计算，行为腿
    最短样本 ≥20 观测，不足判"不可编码"悬置而非放宽门槛。
    子网络映射：SOV = 子网络成员官方储备中锚资产份额、MOE = 子网络内
    结算/发行中锚资产份额，σ 按子网络自身序列依通则计算。
    可编码性逐事件诚实声明（不许"名义可满足"充数）：英镑区 1960s-70s
    原则可编码（候选数据源 BoE/IMF 历史统计 + Schenk 重建序列，可得性
    待首编码核实、失败则移出子集不得改用未注册代理）；卢布区 1992-93
    事件腿可编码、行为腿【当前不可编码】悬置；拉美美元化 episodes 原则
    可编码；1997 亚洲危机跨 T2/T1 边界原则可编码（衔接规则首编码时
    一次性锁定）。≥5/≥3 门按可编码子集重估：慢速 ≈3、急性候选 ≈3-4
    （全部待行为腿实算、无一已确认）——(c) 的 ≥5 门"名义可满足、待
    首编码执行、执行前不得声称已满足"；(d) 的 ≥3 门因 rank/δ 协议
    空位维持未来才可检。falsifiability (c) 加指针互链。
    诚实边界：本轮注册的是【协议与口径】，未代跑任何 σ 实算或序列
    核实——首编码仍是遗留执行项，与 2022/1971 重编码同队列。

    【SF-1 格 6 口径统一——本轮同步修（按审查者升级警示，先于任何
    格 6/(iv) 编码完成）】
    撤回格 6"胜出者的六维得分必然接近最高但不等于最高"的确定性措辞，
    改为与 (iv)/falsifiability (d) 统一的概率口径：非最高分者胜出频率
    跨事件显著高于慢速事件；单一事件中最高分者胜出不构成反例；全部
    事件最高分者恰都赢则按 anti_talisman (4) 标注不可检验而非虚报。

    【SF-6 预记——已落字段】
    Epistemic status 新增 (f)：两种 verified* 语义（L3"带悬案"义 vs
    METHODOLOGY 厚涌现义）指向不同结论；本条主体薄涌现按分档字面只落
    verified 档，(iv) 交互级升档以 falsifiability (d) 检验存活为前提；
    finalize 时须按 METHODOLOGY 裁定星号语义并显式列悬案清单（六维
    重标定桥 / rank-δ 协议 / 池首编码 / 2022 与 1971 σ 实算）。

    【留给下轮的诚实清单】
    1. SF-3（联盟/阵营第五因素）、SF-4（锚 4 单机制标注 + 稳定/缓慢档
       量化边界——1971-1990 编码已暴露"缓慢"档被中速拉伸，SF-4 优先级
       实质上升）、SF-5（轴 A δ-free 支配序充分条件，把格 3/5 与锚 1
       编码从非正式救回正式）均未动。
    2. 全部 σ 实算与序列核实（2022 重编码、1971 行为腿、英镑区序列
       可得性、亚洲危机口径衔接）是待执行项，本轮只注册不代跑。
    3. 审查者关于"verified 类定论前须协议注册 + 池首编码 + 第二复合锚"
       的三前置条件，整改者无异议、如实转入 finalize 门槛。
    4. 1971-1990 的消化路径一（六维不接近）当前基于制度事实的定性
       标定——严格的事前六维打分仍依赖 rank/δ 协议注册，该依赖已在
       条目内如实声明（不冒充已完成量化标定）。

