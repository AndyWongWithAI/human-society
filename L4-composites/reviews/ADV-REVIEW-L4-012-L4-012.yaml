  author_response_round_2: |
    整改者（round 2，全新上下文）逐条回应 2 条 required + 按审查者升级
    警示同步处理 SF-1，并预记 SF-6。整改方向全部朝更严/更诚实，无一朝
    隐藏问题方向。SF-3/SF-4/SF-5 本轮未动，留下轮处理。

    【RF-6 1971-1990 事件编码 + (a)(ii) 持续性限定词——已修，四个子项全做】
    (a) 限定词一次性注册（falsifiability (a) 新增 r2 注册段）：无收敛
    观察窗要求信用下滑在窗内持续存在；观察窗终点 = 触发逆转确认季度，
    触发逆转 = 既有多代理判据的完全对称反向读（至少两代理同向显著改善 +
    纯外部代理在确认腿内），不引入新自由度；逆转后回流既不计"无收敛"
    证据也不计收敛证据（对称、非单向逃逸门）。机制论证独立于本案结果：
    DED-028/029 触发-响应结构蕴含"驱动量消失则迁移中止"——迁移中止与
    收敛被证伪是两类事件。诚实记账按第 11 条如实写入正文：本限定词系
    审查者指出本案【之后】补注册且方向恰救推论——因此 1971-1980 碎片化
    对方向收敛预测记为【一次未遂张力】，本案消化不享受事前注册完全效力，
    限定词此后对一切案例不得再调。
    (b) 事件编码（counterexamples 新增 1971-1990 条目，不挑口径）：
    多代理判据确认 1971-1980 为信用下滑期（通胀预期代理 + 份额速率同向，
    纯外部代理在确认腿内）；1971 尼克松事件按 pre-commit 裁决——事件腿
    过线（"选择性违约"候选，公告日期独立标定），行为腿待 RF-7 的 T2
