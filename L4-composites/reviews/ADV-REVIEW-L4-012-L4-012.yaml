  author_response_round_1: |
    整改者（全新上下文）逐条回应 5 条 required。整改方向全部朝"更严/更诚实"，
    无一朝隐藏问题方向。SF-1~SF-4（should 级）本轮未动，留下轮处理。

    【RF-1 急性判据重注册——已修】
    operationalization 中急性判据重注册为事件类清单制：事件腿（纯外部）=
    预注册事件类清单（储备冻结/主权违约/评级下调/恶性通胀确认，均以公开
    公告日期独立标定）或 CDS 周度展宽 ≥3σ（σ 按事件前 10 年周度分布一次性
    计算）；行为腿 = 储备份额季降 ≥3σ（σ 按 COFER 1999Q1 起季度变化分布、
    估值调整后一次性计算锁定）。显式撤回旧文"0.3pp≈3σ"——承认其把波动
    【均值】0.1pp 误当 σ。红旗 3a 一并修：纯外部代理为同向确认腿的必要
    条件已写为硬规则（operationalization + anti_talisman (1)）。
    2022 的处理：按第 11 条反向裁决，2022 暂不计为已确认急性事件——反向
    裁决记录写入 operationalization 与锚 2 正文；重注册判据的 σ 实算执行后
    对 2022 重新编码一次、不得再调（事件腿在清单内，行为腿待实算判定）。
    整改者未预判重编码结果——σ 实算属未来检验步骤，本轮不代跑。
    anti_talisman (6) 与 derivation 轴 B 的判据引用同步更新。

    【RF-2 δ/rank 协议——选"诚实标记不可操作待补"路径】
    未凭空编造 δ 数值或秩位规则（无标定基础的数字注册只会制造下一个
    "0.3≈3σ"）。改为：(a) operationalization 显式承认 DED-027 商品时代
    秩位规则（冶金温度/一日陆路行程/试金石）无一可平移；(b) 后果如实
    登记——轴 A 列归属、预测 (iv)(b)、falsifiability (d) 在协议注册前
    不可操作，格 4/6 与 (iv) 按未来才可检处理；(c) 协议注册须一次性
    完成、先于任何入格编码；(d) 预测 (iv) 正文与 falsifiability (d)、
    derivation 轴 A 同步加注。被预测量综合权重 (0.5/0.25/0.25)"可调整"
    之门已关死——正文改为"现予一次性锁定，不再调整"。

    【RF-3 锚点事实修正——已修，且按修正后事实重审锚点支撑力】
    (a) 锚 2：撤下"人民币升至 3.5-4%"，改为 IMF COFER 实录 2022Q1 约
    2.9% 达峰后回落至 2023-2024 约 2.2%。对结论的影响如实消化：SOV 分流
    几乎全部走向黄金→候选集收窄→"多候选接近"（格 6）编码失去当前实证
    支撑，改为格 6 初期 vs 格 5 两种读法并存待裁定，本锚不再为"多候选
    接近"提供实例。confidence moderate→weak-pending。independent_test
    中的"定性制度断裂双重路径"句（事后口径残留）已删。
    (b) 锚 1：重写为非单调实录（美元 1920s 中期超英镑、英镑 1930s 夺回
    领先、1931 后清算外汇储备逃向黄金）；撤"1933 后全球央行继续增持
    美元"（无据）。20 年双储备并存+领先互换走 anti_talisman (5) 分区
    判据显式消化，代价条款如实支付：网络连通性注册为收敛预测的可测
    入格前提（E_network operationalization 新增 (d)），分区期
    ~1926-1944 不入格、不计格 3 证据。英镑区外汇管制/英镑结存不可兑换
    （至 1958）的制度强制成分按排除 2 剥离、delta 读数从"~20-30 年"
    降为"方向一致性"（锚 4a 同步改）。confidence strong→moderate。
    修正后重审：锚 1 仍支撑"终局方向收敛 + SOV 先于 MOE 的时序方向"，
    但不再支撑"缓慢单调迁移"叙事——按此降格，未改叙事保结论。

    【RF-4 DED-029 观众砖——选方案 A（审查者优先方案）】
    新增预测 (vi)：C 轴按 DED-029 独立测量轴编码（C1=TIPS、C2=调查/
    盈亏平衡、C3=CDS/评级/事件类清单、C4=VIX/EPU，主导=事件窗口内
    z 化变动幅度最大者）；预测 C1 主导→非生息候选（金）增益占优、
    C3/C4 主导→无对手方候选占优；增益=事件后 4 季度 E_network 综合
    指标变化量。(iv) 条件 (c) 的"触发不对称"获得测量定义（按 (vi) 的
    C 轴编码）。新增 falsifiability (g)（≥3 个可编码触发事件、样本
    可得性高于 c/d——触发事件不限体制切换级）。necessity (c) 的"失去
    事前监测能力"夸大表述已按审查意见修正（监测由 DED-028 一系代理
    覆盖，DED-029 的真承重 = C1/C4 通道 + 候选差异化，经 (vi) 落地）。

    【RF-5 检验域为空——A+B 同做（审查者建议的最佳组合）】
    A：falsifiability (c) 注册子全球代理事件池（卢布区解体 1992-93、
    英镑区退出潮 1960s-70s、拉美美元化/逆美元化 episodes、1997 后东亚
    储备重构），按同一预注册判据编码为缩尺度体制切换，池运作遵循
    anti_talisman (6) pre-commit 规则；诚实标注子全球检验对全球预测的
    传递力打折。(d) 同步引用该池。
    B：Epistemic status 新增 (e)——校准集=检验集单样本风险显式加注
    （锚 1 对 (i)(ii)(v) 只提供一致性非独立检验力；(iii)(iv) 全球尺度
    检验力依赖未来观测）。

    【留给下轮的诚实清单】
    1. RF-2 走的是"诚实标记待补"而非"注册可操作协议"——储备域 rank/δ
       协议仍是空位，格 4/6 三父签名格的可操作性受限持续存在，是否
       接受此消解方式请下轮裁决。
    2. 2022 急性资格的重编码需 σ 实算（COFER 季度变化分布），本轮未
       代跑——事件池的首次实际编码是遗留执行项。
    3. SF-1（格 6 确定性措辞 vs (iv)/(d) 概率口径的内部矛盾）、SF-2
       （1914-1944 历史代理映射表）、SF-3（联盟/阵营结构第五因素）、
       SF-4（锚 4 标注/稳定档量化边界/verified* 预标）均未动。
    4. 定论上限接受审查预标 verified*（六维重标定桥未经独立验证悬案），
       整改者无异议。

round_2:
  reviewer: "独立对抗审查者 (round 2, 全新独立上下文, 与作者及 round 1 审查者无关)"
  verdict: needs_revision
  verdict_note: |
    三条 verified 硬门核验（L3 通用）：
    ① 无 required 级缺陷——不满足。r1 的 5 条 required 中 4 条真消解（RF-1/2/3/4），
       RF-5 名义消解、操作未完成（→新 RF-7）；r2 反例猎捕另捕获一个射程内未编码
       事件 + 一处证伪判据歧义（→新 RF-6）。
    ② 亲自反例猎捕——已执行（见 counterexample_hunt）。核心机制未被净杀，但
       1971-1990 美元份额大跌全回升事件按推论自注册判据可确认为信用下滑期，
       全文未编码、未消化，且其入格裁决依赖 falsifiability (a)(ii) 的一个未注册
       限定词——按通用红旗第 11 条，歧义须反向裁决。
    ③ 未重蹈 DED-004/DED-007——成立（见 non_recurrence）。
    L4 附加条件：
    ④ 涌现有效——逻辑论证层面成立（格 3/5 双父合力经得起复核；RF-4 修后
       格 4/6 三父资格恢复为"注册层面成立、编码层面待 rank/δ 协议"）。
    ⑤ 复合非平凡性——成立。
    ⑥ 无观众砖——RF-4 修后成立：预测 (vi) + (iv)(c) 测量定义使 DED-029 承重。
    综合：整改方向全部朝更严更诚实，无掩盖性换措辞；但 RF-5 的"救回可检"
    实际未完成（事件池按注册判据不可编码），且 r2 猎捕暴露一个必须先注册
    后编码的判据缺口。2 条新 required，均可定向修 → needs_revision。

  required_fix_verification: |
    逐条核验 r1 五条 required 是否真正消解：

    【RF-1 急性判据重注册——真消解 ✓】
    事件类清单（冻结/违约/评级下调/恶性通胀）以公开公告日期独立标定，纯外部；
    行为腿 3σ 改为实算（COFER 1999Q1 起、估值调整、一次性锁定），"0.3pp≈3σ"
    误标显式撤回并说明错因（均值 0.1pp 误当 σ）——不是换措辞，是承认标定不成立。
    2022 按第 11 条反向裁决暂不计急性、重编码一次不得再调——处理方向不利于
    推论自身，非自救。红旗 3a 的 DV 自确认通道以硬规则堵死（纯外部代理必须在
    确认腿内）。残留执行项（σ 实算、2022 重编码）已诚实登记。核验通过。
    附带压力测试：清单制的"评级下调"类会使 2011 标普/2023 惠誉下调美债自动
    进入事件腿候选——按 anti_talisman (6) pre-commit，这些事件的行为腿裁决属
    待执行项，非缺陷；但见 RF-7 对 σ 口径时代适用性的连带问题。

    【RF-2 δ/rank 协议——诚实路径本身成立，剩余内核裁定见下 ✓（带条件）】
    未凭空注册无标定基础的 δ（避免制造下一个"0.3≈3σ"）是正确选择；后果
    如实登记（轴 A 列归属/预测 (iv)(b)/falsifiability (d) 注册前不可操作，
    格 4/6 与 (iv) 未来才可检）；综合权重 0.5/0.25/0.25 之门已关死。
    剩余可操作内核重裁（本轮任务重点）：协议空位使【整条轴 A】不可操作——
    不只格 4/6，格 1/2/3/5 的列归属（"单一显著"同样需要 δ 判定"差距 > δ"）
    在字面上也不可操作，锚 1 对格 3/终局的编码由此成为非正式编码。当前
    真正可检的注册内容 = 预测 (ii)（COFER vs SWIFT/BIS，falsifiability (b)，
    现在就可跑）+ 预测 (vi)（falsifiability (g)，现代数据充足）+ 预测 (v)
    （falsifiability (e)，条件事件未发生但判据完备）；预测 (iii) 依赖事件池
    （见 RF-7 缺口）；预测 (i)(iv) 未来才可检。裁定：剩余内核非空且含真
    经验赌注，够格保留 L4 candidate 资格——但注意 (ii) 是 DED-028 扩展的
    单机制预测、(vi) 是 DED-029 扩展的单机制预测，【当前可检集合几乎不含
    复合增量】——复合增量 ((i)(iii)(iv)、签名格) 全部悬在协议/事件池上。
    这不否定诚实路径，但意味着：verified 类定论在协议注册 + 事件池首编码
    之前无从谈起，且轴 A 应补一个 δ-free 的支配序充分条件（见 SF-5）把
    格 3/5 与锚 1 的编码从非正式救回正式。

    【RF-3 锚点事实修正——真消解 ✓；Rule G 重裁见下】
    锚 1 重写与 Eichengreen-Flandreau 记录相符（美元 1920s 中期超英镑、
    英镑 1930s 夺回领先、1931 后清算外汇储备逃向黄金）；"1933 增持"无据句
    已撤；分区消化的代价条款如实支付——网络连通性注册为收敛预测可测入格
    前提且对称运作（分区期不计收敛证据也不计收敛反例，非单向逃逸门）；
    英镑区制度强制成分按排除 2 剥离。锚 2 人民币方向修正（2.9%→2.2%）、
    格 6 编码撤下、weak-pending 降档——处理方向全部不利于推论。核验通过。
    Rule G 重裁（本轮任务重点）：降格后复合锚点的承重结构 = 锚 1 单锚。
    锚 2 weak-pending（急性资格待重编码，当前不承重）；锚 3 与锚 4c 支持
    格 1/2——推论自己的判空表标这两格为【零父常识格】，零父格证据对复合
    声称无判别力；锚 4 整体是 DED-028 扩展的单机制证据（r1 SF-4 已指出，
    未修）。锚 1 在重写后仍是真复合锚（方向[DED-027]×时序[DED-028] 同案
    联合编码，终局收敛 + SOV 先于 MOE 可区别于任一单机制预测）——Rule G
    的两条 requirements 靠它最低限度满足。但承重结构脆弱：单锚、moderate、
    且 Epistemic status (e) 自注"校准集=检验集，对 (i)(ii)(v) 只提供一致性
    而非独立检验力"。裁定：Rule G 当前"薄持"——不击穿 candidate 资格，
    但任何 verified 类定论前须有第二个正式编码的复合锚（事件池首编码是
    现成来源），否则应按 Rule G 第三条诚实标记"复合特有锚点单薄，置信度
    大部分继承自父推论"。

    【RF-4 DED-029 观众砖——真消解 ✓，非装饰性】
    判定依据：(a) 预测 (vi) 有完整测量注册——C 轴四通道各有独立数据源
    （TIPS/调查与盈亏平衡/CDS-评级-事件清单/VIX-EPU），主导类型判定规则
    （事件窗口内 z 化变动幅度最大）一次性给出，增益测量（事件后 4 季度
    E_network 综合指标变化量）与触发轴异源正交——不是口号预测；
    (b) falsifiability (g) 样本门（≥3 可编码触发事件）在现代数据下真可
    满足（2011 评级下调/2013 taper/2020 疫情/2022 冻结均为候选），可检性
    高于 (c)(d)；(c) 移除测试复跑：去掉 DED-029 → (vi) 全塌（C 轴无来源）、
    (iv)(c) 失去测量定义、格 6 的事件类型差异化分析失效——DED-029 现在
    有不可替代着陆点。necessity (c) 的"失去事前监测能力"夸大已修正。
    诚实记录一个不构成缺陷的观察：(vi) 本身是 DED-029 扩展的单机制预测
    （非复合命题），其对【复合】结构的贡献经由 (iv)(c) 间接实现——观众砖
    消解成立，但不应把 (vi) 计为复合锚点或复合预测。核验通过。

    【RF-5 事件池 + 诚实降格——名义消解、操作未完成 ✗（→RF-7）】
    B 部分（Epistemic status (e) 校准集=检验集加注）真消解。A 部分（子全球
    代理事件池）注册了池清单与 pre-commit 规则，但池【不可按注册判据编码】：
    信用下滑确认与急性判据的 σ 口径锚定在现代数据源（CDS 事件前 10 年周度
    分布、COFER 1999Q1 起季度分布、密歇根调查 1978 起），而池内事件——
    卢布区解体 1992-93（无 CDS、无该子网络 COFER 等价序列的注册口径）、
    英镑区退出潮 1960s-70s（无 CDS、密歇根不适用、COFER 前身口径未注册）——
    大半发生在这些数据源存在之前或之外；"该子网络内的 SOV/MOE 指标"只有
    方向性描述，无数据源、无 σ 计算窗口。r1 的 SF-2（历史代理映射表）在
    RF-5 选择方案 A 之后已从锚 1 的局部问题升级为 falsifiability (c)(d)
    可满足性的承重问题——池编码协议不注册，≥5/≥3 门就仍然是"原则上可满足、
    注册下不可编码"，红旗 18 只修了一半。此为 required（RF-7），性质是
    RF-5 的完成项而非推翻。

