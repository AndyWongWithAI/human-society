  core_readjudication: |
    【任务 2：执行项未完成能否升 verified 类——独立重裁】
    先分类，再裁决。本条悬着的事项分两种性质：
    (A) 注册缺陷（Rule A 范畴，审查可挡）：储备域 rank/δ 协议空位（轴 A
    全表列归属不可操作、预测 (i)(iv)、falsifiability (d) 不可进入）、
    RF-8 的合格挑战者前件、RF-9 的主导类型编码分支。这些不是"检验还没跑"
    而是"跑检验的尺子还没造好"——L4-009 判例的教训正是尺子后造必然弯向
    造尺人。注册缺陷一票挡 verified，无论执行项状态如何。
    (B) 经验检验待执行（Rule C 范畴）：σ 实算（2022/1971 行为腿）、池
    首编码、英镑区序列核实。库内对齐抽查：L4-002（verified）带"低轮替+
    低独立+高透明——活空格，待独立检"照样定论 verified；METHODOLOGY
    lifecycle step_3 明文 Rule C"可选"。所以【执行项未完成本身不是
    verified 的规则性障碍】——r2 把"池首编码"列为 verified 硬前置，在
    规则层面是超出评分卡的加严。
    但我【维持】r2 的三前置，理由重述为本条特有而非一般规则：
    (1) 协议注册（rank/δ 或至少 SF-5 支配序判据）——规则性硬门，(A) 类，
    维持，无争议。
    (2) 池首编码 + 第二复合锚——对 L4-002 型推论不必要，对本条必要，
    因为本条有 L4-002 没有的双重折扣叠加：(i) 唯一复合锚（锚 1）自认
    校准集=检验集，对 (i)(ii)(v) 只提供一致性而非独立检验力——Rule G
    第三条的诚实标注退路（"置信度大部分继承自父推论"）在本条同时失效，
    因为三条父背书全部在自宣射程外使用（Epistemic status a-c），继承链
    是折上折；(ii) 当前可检集合几乎全为单机制预测（(ii)/(vi)），复合
    增量零独立检验力。在这种结构下判 verified，等于给一个"逻辑涌现成立、
    复合经验内容尚未接触过一次正式编码"的命题盖真章——与 verified 在
    本库的语义（经受住经验对抗）不符。干预不对称原则允许朝更严方向
    维持。结论：三前置维持，但性质重分类——(1) 是规则门，(2) 是本条
    特有的审慎门；未来若 SF-5 注册后锚 1 的格 3/终局编码转正 + 池内
    任一事件完成正式编码，(2) 即视为满足，不要求全部 σ 实算跑完。
    【任务 4 预裁：星号语义】采 METHODOLOGY emergence_to_status_mapping
    （canonical，2026-07-15，晚于且专门于 r1 预标用法）：本条主体
    conjunction（薄涌现）→ 定论上限 = verified 档【无星】；(iv) 交互级
    升档仅当 falsifiability (d) 执行且存活 → 届时才谈 verified*。r1
    "verified* = 带悬案"用法弃用——悬案以 Epistemic status (f) 清单 +
    review_summary 表达，不占用星号。此裁定比 r1 预标名义更低、实质
    更严（防星号语义膨胀），与 r2 红旗 15 的消歧要求一致。

