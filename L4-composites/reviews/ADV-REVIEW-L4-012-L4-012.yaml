author_response_round_3: |
  整改者（round 3，全新上下文，与作者、r1/r2 审查者及前轮整改者均无关）
  逐条回应 3 条 new required（RF-8/9/10），方向全部朝更严/更诚实，无一朝
  隐藏问题方向。

  【RF-8 合格挑战者前件——已修，六处改动协同注册】
  (a) 预测 (i) 加前件：适用前件 = 存在至少一个六维得分接近或超过在任者
  的合格挑战者。加 r3 一次性注册段说明前件的适用范围（无合格挑战者→
  不适用）、过渡判据（SF-5 δ-free 支配序）、第 11 条效力（对 1971-1990
  不追溯，未遂张力维持不变）。
  (b) falsifiability (a) 加前件：(a)(i)(ii) 仅适用于存在合格挑战者的位形；
  加 r3 注册段说明无合格挑战者时碎片化属组合再平衡、不构成证伪。
  (c) derivation 轴 A 从 2 列扩为 3 列：新增第三列"无合格挑战者"（全部
  挑战者六维得分系统性低于在任者），以 SF-5 δ-free 支配序为过渡可操作
  判据。笛卡尔积表从 2×3 改为 3×3。
  (d) multi_parent_cells 新增格 7（稳定+无合格挑战者）、格 8（缓慢下滑+
  无合格挑战者→碎片化组合再平衡+触发逆转则中止回流）、格 9（急性下滑+
  无合格挑战者→急性逃逸向安全资产）。每格含归属与父推论分工。格 8 附
  诚实声明：1971-1990 位形即此列，前件系事后注册不追溯。合力格统计从
  "6 格中 4 格"更新为"9 格中 6 格"。
  (e) SF-5 δ-free 支配序过渡判据注册于 operationalization（RF-8 配套升格）：
  双用途——挑战者间支配（"单一显著"列判据，≥4/6 维度得分高于对方+无
  反向超越超过容差 0.05）和在任者 vs 挑战者支配（"合格挑战者存在"判据，
  在任者支配全部挑战者→无合格挑战者列）。支配序是充分条件非必要条件。
  附诚实边界（容差/门槛是标定选择、支配关系标定须独立完成本文不代跑）。
  (f) 1971-1990 status 行条件化："路径一反哺推论为六维区分力正面证据"改为
  "SF-5 支配序判据注册并复核通过后方可反哺推论"——当前为条件式消化。

  【RF-9 C3 离散事件主导分支——已修，选选项 A 附独立理由】
  注册于 prediction (vi)：选项 A（本注册选用）——清单内 C3 离散事件在窗口
  内发生时 C3 自动判定为主导触发类型，跳过连续轴 z 比较。选择理由独立于
  2022 案例结果：离散事件是法币信用崩塌的直接可观测表现而非市场代理；
  某些事件（资产冻结）在 CDS 覆盖范围外、连续量无法捕获；直接观测优先于
  代理是测量理论的一般原则。选项 B（折算等效 z）否决因无自然折算尺度的
  任意性；选项 C（仅连续量比较）否决因使 C3 轴失去对资产冻结类最重要事件
  的覆盖、与事件类清单设立初衷矛盾。falsifiability (g) 新增 r3 活性张力
  记账段：2022 对 (vi) 记为活性张力（不享事前效力，裁决待分支规则生效后
  按规则执行一次不得再调）；r2"(vi) 方向核验通过"限定为 2011/2013。

  【RF-10 调节变量预算——已入账 + 持续性限定词裁定写死】
  在 anti_talisman_clause 与 real_world_anchors 之间新增 r3 一次性注册段：
  ① 网络连通性入格前提 = 调节变量 1（消化战间分区）
  ② 局域 vs 全局信用下滑限定 = 调节变量 2（消化 1997 亚洲危机）
  预算 2/2 已耗尽，今后不得再引入新调节变量。
  ③ 触发持续性限定词裁定：认可为继承非新增——引 DED-028（预测以信用
  下滑为条件→消失则前件消失）和 DED-029（excluded_outcomes 显式排除多
  因素同时归零位形）的原文依据，证明其为父推论触发-响应结构的对称反向读、
  非引入新自由度。
  ④ RF-8 前件明确走轴 A 操作化前提通道（定义性列前提），不走调节变量通道。

