id: ADV-REVIEW-L4-012
type: adversarial_review
reviews: L4-012
layer: L4-composites
target: L4-012
date: 2026-07-15

人话摘要: |
  对 L4-012（储备资产地位变迁的网络效应动力学）的 round_1 独立对抗审查。裁 needs_revision
  （5 required + 4 should）。这条推论的合取级涌现是真的——格 3/格 5（方向×时序双父合力）任何
  单父都给不出，诚实声明段（三条射程扩展全披露 + 预测 (iv) 预注册降格条款）是全库最规范之一。
  但五处 required 挡住 verified：(1) 急性下滑判据预注册为"CDS 周度 3σ + 储备份额季降 ≥0.3pp"，
  而旗舰急性锚（2022 俄储备冻结）两条腿都不满足——冻结非违约、美国 CDS 无 3σ 跳变，USD COFER
  季度降幅 ~0.1pp 远低于 0.3pp——文件当场改走未注册的"定性制度断裂 + 行为代理"路径，这正是
  L4-009 判例的事后口径选择模式，按通用红旗第 11 条反向裁决：2022 在当前注册下不得计为已确认
  急性事件。(2) "多候选接近"的 δ 与储备域 rank/权重协议从未注册（DED-027 的 rank 规则是商品
  货币时代专用判据，不可平移），签名格 6 与预测 (iv) 条件 (b) 的入格判定不可操作。(3) 两处锚点
  事实错：人民币 COFER 份额实际从 2022Q1 ~2.9% 峰值回落至 2024 ~2.2%（方向与文中"升至
  3.5-4%"相反）；战间期美元在 1920s 中期已超英镑、1930s 英镑又夺回领先（Eichengreen-Flandreau），
  且 1931 后主导行为是外汇储备清算逃向黄金而非"继续增持美元"——锚 1 的单调迁移叙事与史实不符，
  20 余年的双储备货币近份额并存 + 领先互换是本推论射程内必须显式消化的反常。(4) DED-029 在
  已注册预测集内近观众砖：其独有内容（C1/C4 轴、触发类型→候选不对称推力）没有进入任何被测
  预测，只作为预测 (iv) 未操作化的入格条件 (c) 存在——去掉 DED-029，预测 (i)(ii)(iii)(v) 原文
  存活。(5) falsifiability (c)(d) 要求 ≥5/≥3 个独立事件样本，而全球尺度上已完成的储备体制切换
  历史上仅 1 例——统计证伪门结构性不可满足，须补子全球代理事件域或诚实降格为"未来才可检"。
  核心可救——合取涌现与诚实脚手架都在，判 needs_revision。

protocol: |
  Rule B 独立对抗审查（作者≠审查者，全新独立上下文）。先跑 L3 评分卡通用红旗 1-11，再跑 L4
  评分卡专属红旗 12-18，反例猎捕（L4 版：额外猎"父推论都成立但交互不产生 L4 预测"的案例），
  DED-004/DED-007 复发检查。裁决语义照 L4 评分卡。父推论核对：已读 DED-027/DED-028/DED-029
  全文核对射程声明与 L4-012 的扩展声明是否一致。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新独立上下文, 与作者无关)"
  verdict: needs_revision
  verdict_note: |
    三条 verified 硬门核验：
    ① 无 required 级缺陷——不满足。红旗 7/11/12/18 各有 required 级命中（见逐条）。
    ② 亲自反例猎捕——已执行（见 counterexample_hunt）。核心机制未被净杀，但猎捕过程
       揭出锚 1/锚 2 的事实错与 2022 急性判定的口径逃逸。
    ③ 未重蹈 DED-004/DED-007——测量轴层面成立（有纯外部代理），但 2022 急性判定的
       事后口径路径是 L4-009 模式的轻度复发，按第 11 条反向裁决处理。
    L4 附加条件：
    ④ 涌现有效——成立（格 3/5 双父合力扎实，见红旗 14）。
    ⑤ 复合非平凡性——成立（至少一格需 ≥2 父）。
    ⑥ 无观众砖——不满足：DED-029 在已注册预测集内近观众砖（红旗 12）。
    综合：核心合取骨架（方向×时序）+ 诚实声明脚手架完好，五处 required 均可定向修订
    救活 → needs_revision，不到 rejected。

  standard_red_flags:
    1_brick_conclusion: |
      裁定：pass。
      复合主张（体制切换 = 方向[六维筛选+E_network 收敛] × 时序[SOV 先 MOE 后的机构级
      同构] × 触发[四因素配置]，急性+多候选下胜出机制从择优变抢先，锁定后迟滞）不在
      任何单父或单砖内：DED-027 自限商品货币自发网络、不涉储备域与时序；DED-028 不涉
      金价/储备竞争/多候选；DED-029 只管金、显式把多因素交互推给 L4。BR-L2-021/022/024
      均无储备域命题。非砖内复述。

    2_cell_empty_prediction: |
      裁定：pass_with_concern。
      2×3 笛卡尔积表的空格是真经验主张（急性+多候选格若观察到"永久碎片化不收敛 5 年+"
      或"MOE 领先 SOV"即被填上），不被父推论平凡强制——DED-027 在储备域根本不自动适用，
      所以格 3-6 的预测全是本推论自担的经验赌注。concern：轴 A（单一显著/多候选接近）
      的入格判定依赖未注册的 δ 与储备域 rank 协议（见红旗 11b）——空格本身非同义反复，
      但当前不可操作地判定某历史时点落在哪一列。修 11b 后此条转 pass。

    3_measurement_orthogonal: |
      裁定：pass_with_concern。
      主轴有真正交腿：CDS（信用市场）、通胀预期（调查）、六维制度指标（治理/市场数据）
      均独立于被预测量。但两处交叉污染须记录：
      (a) 信用下滑速度的代理 (c)（美元储备份额 5 年滚动下降速率）就是被预测量综合指标的
          50% 权重成分——急性判据的行为腿（储备份额季降 ≥0.3pp）同样是被预测量本身。
          事件识别部分条件在因变量上（selection on DV）。anti_talisman (1) 已披露并要求
          至少一个纯外部代理为必要条件——部分缓解，非 DED-007 级焊死，但"两个同向即确认"
          的规则允许 (b)+(c) 组合确认，其中 (c)=结果——应升级为"纯外部代理（CDS 或通胀
          预期）必须在同向确认腿之内"的硬规则（归入 RF-1 一并修）。
      (b) SOV 指标（COFER 份额变化）与被预测量共享同一序列——但预测 (ii) 测的是两条独立
          序列（COFER vs SWIFT/BIS）的相对时序，非循环，可接受。

    4_excluded_outcomes: |
      裁定：pass。
      四项排除均有事前可测判据：无信用下滑信号的组合再平衡（多代理信号）、武力强制
      （驻军/条约/制裁威胁的强制指数）、货币联盟合并（有明确日期）、CBDC 重塑（维度
      重定义可识别）。制裁的双重身份（对持有者资产的冻结=触发；强迫使用某货币=排除）
      方向可区分，不构成逃逸门。但注意：排除 2（强制）的逻辑反噬锚 1——英镑区的外汇
      管制与英镑结存（sterling balances）不可兑换（战后延续至 1958）意味着旗舰案例中
      MOE 滞后乃至一部分 SOV 滞留是制度强制的产物而非网络惯性——此矛盾归入红旗 7 处理。

    5_classification_bin_match: |
      裁定：pass_with_concern。
      信用轨迹连续谱分三档（稳定/缓慢/急性）档位数适配。急性档有定量注册（虽有 RF-1
      问题）、缓慢档有 <0.5pp/年 锚点（预测 iii 内）、稳定/缓慢边界模糊（"高信心端无
      方向性移动"无量化）。非致命——多代理协议可覆盖，建议补稳定档的量化边界（should）。

    6_anti_talisman: |
      裁定：pass_with_concern。
      六项硬约束是全库最完整的护身符清单之一，且 (4) 主动承认"最高分者每次都赢时 (iv)
      不可检验而非被验证"——诚实。但"至少一个承重锚真的独立测出驱动量"这条兑现存疑：
      预注册代理（CDS/密歇根调查/COFER 滚动速率）在 1914-1944 旗舰锚的年代全部不存在
      （CDS 1990s 后、密歇根 1978 后、COFER 1960s 后）——已注册的操作化协议对唯一完成
      案例完全不可施用，锚 1 的"信用下滑速度"实由未注册的历史代理（债务/GDP、金本位
      脱钩时点）事后标定。须注册历史时代的代理映射表（SF-2），否则协议与证据脱节。

    7_real_world_anchor_fact_check: |
      裁定：needs_revision（required——RF-3）。
      (a) 锚 2 事实错：文称人民币 COFER 份额"从 2022Q1 的 2.8% 上升至 2024Q4 的
          ~3.5-4%（估）"。按 IMF COFER 公开序列，人民币份额 2022Q1 达峰约 2.9% 后
          【回落】至 2023-2024 的约 2.2%——方向与文中所述相反。锚 2 的 SOV 响应证据
          只剩黄金一条腿（央行购金数据属实），人民币腿必须撤下或改述为"份额不升反降，
          SOV 分流几乎全部走向黄金"——这本身对预测 (iv) 的"多候选"格局叙述有实质影响
          （候选集实际收窄）。
      (b) 锚 1 过度解读 + 部分事实错：Eichengreen-Flandreau 的央行储备构成研究表明
          美元在 1920s 中期已超过英镑成为第一储备货币，而英镑在 1930s【重新夺回】领先
          ——两大储备货币以接近份额并存并互换领先约 20 年。且 1931 英镑脱金后全球央行的
          主导行为是清算外汇储备逃向黄金（外汇占总储备比例大幅塌缩），"外国央行……
          尤其在大萧条期间英镑脱离金本位后加速（增持美元）"与"1933 美元贬值……全球央行
          继续增持美元"均与此记录冲突。锚 1 的单调收敛叙事须重写为非单调实录，战间期
          并存+领先互换须显式消化（可走 anti_talisman (5) 的分区判据——英镑区/美元区/
          金集团是网络分区，TDO 类比可测——但消化必须做，不能靠单调叙事绕过）。
          confidence 从 strong 降档。
      (c) 锚 2 的急性判据腿：USD COFER 份额在 2022 各季度的降幅约 0.1-0.2pp，未达
          注册的 ≥0.3pp/季——行为腿在锚自己的数字上不成立（与红旗 11a 联动）。
      (d) 锚 4b 的 USD 71%→58%（2000-2024）与 SWIFT ~47% 数字量级无误；锚 3（欧元）
          无事实问题。

    8_definition_vs_prediction: |
      裁定：pass_with_concern。
      关键条件多为可证伪预测而非定义。一处内部不一致（SF-1）：格 6 文本称"胜出者的
      六维得分【必然】接近最高但不等于最高——若等于最高则路径依赖不可区分"——确定性
      措辞与预测 (iv) 的概率性主张（"可能不是事前最高分者"）及 falsifiability (d)
      （"全部都是最高分者才证伪"）互相矛盾：路径依赖也允许最高分者靠运气赢。按格 6
      字面，任何一次最高分者胜出就打穿它；配合 (d) 又变成"三次全中才算"——两个口径
      并存即歧义。须统一为概率性表述（与 (d) 对齐）。

    9_enumeration_exhaustiveness: |
      裁定：pass_with_concern。
      主动猎第 N+1 驱动因素：【地缘联盟/阵营结构】作为储备配置的横截面分配器——
      2022 后购金集中于不结盟央行、1930s 英镑区成员持英镑、欧元由欧洲近邻超额持有。
      联盟结构决定"谁持有什么"，测量轴（联盟指数/UN 投票相似度/安全条约）与 C1-C4
      （利率/调查/CDS/VIX-EPU）正交，也难完全折入六维的 D2/D6。文件的 falsifiability
      (f) 把此类发现归为弱证伪（框架扩展），secondary_suspect 也部分承认（地缘政治
      约束、"不愿公开减持盟友货币"）——所以不是未设防，但联盟结构在锚 1（英镑区）和
      锚 2（不结盟购金）两个承重锚里都实际在场且承重，不该只住在 suspect 段。建议
      显式处理为候选第五因素或六维的第七维候补（SF-3）。

    10_primary_suspect: |
      裁定：pass_with_concern。
      文件自认 DED-027 射程扩展为最弱腿——指认正确且论证充分（六维重标定若无区分力，
      预测 (i) 退化为在位者同义反复——这个自我诊断很到位）。但漏了两处同级致命点：
      (a) DED-029 观众砖风险（红旗 12）；(b) 急性判据对 2022 的口径逃逸（红旗 11a）。
      另外 primary_suspect 段自己承认的"若限定为商品货币式储备竞争则实证射程趋近于零"
      恰好说明：本推论的全部实证内容都压在未经验证的射程扩展上——这不改变裁决路径
      （文件已诚实设了置信度天花板），但支持"标准从严"。

    11_caliber_registration: |
      裁定：needs_revision（required ×2——RF-1、RF-2）。
      (a)【急性判据的事后口径逃逸——L4-009 判例同款】操作化注册的急性判据为：同一
          季度内 CDS 周度展宽 ≥3σ【且】储备份额季降 ≥0.3pp。旗舰急性锚（2022 冻结）
          两腿皆不满足：冻结非违约事件，美国 5 年 CDS 无 3σ 跳变（文件自己承认"CDS 虽
          不直接适用"）；USD COFER 季度降幅 ~0.1-0.2pp < 0.3pp。文件在锚点段临场改走
          "定性制度断裂 + 行为代理双重路径（非仅 CDS 定量阈值）"——这条路径不在
          operationalization 的注册文本里，是在案例不过线之后为保锚而开的新口径。
          按通用红旗第 11 条（L4-009 判例）：口径在反例/案例出现后才定死且方向恰好救
          推论 → 一律反向裁决——2022 在当前注册下【不得】计为已确认急性下滑事件，
          锚 2 降为"待判据重注册后重新编码"。修法（事前可辩护）：把急性判据重注册为
          事件类清单制——可编码事件类（储备资产冻结/主权违约/评级下调/恶性通胀确认）
          + 行为腿（阈值须按实际历史分布重标定：0.3pp≈3σ 的标定依据"历史季度波动均值
          约 0.1pp"混淆了均值与 σ，须给出真实 σ 的计算窗口与口径）+ 纯外部代理必要
          条件（红旗 3a）。注册一次，之后不得再调。
      (b)【δ 与储备域 rank 协议未注册】"多候选接近 = 所有维度耗尽仍差距 < δ"——δ 无
          数值、无分子分母、无测量口径；引用的 DED-027 rank-protocol 其秩位规则
          （冶金 800°C/一日陆路行程/试金石制度）全部是商品货币时代专用判据，无一可
          平移到储备域。六维重标定给了每维的操作化指标和权重的方向性规则，但没有给
          储备域的秩位注册规则与 δ——轴 A 的列归属（单一显著 vs 多候选接近）、预测 (iv)
          条件 (b)、falsifiability (d) 的"得分接近的候选"全部悬空。另：被预测量综合
          指标的权重 (0.5/0.25/0.25) 标注"可在预注册阶段调整"——再调整之门必须关死
          （要么现在锁定，要么给出锁定程序与截止条件）。

  l4_exclusive_red_flags:
    12_spectator_brick: |
      裁定：needs_revision（required——RF-4）。
      逐一移除测试的真实结果与文件的 necessity 声明不符：
      - 移除 DED-027：预测 (i)(v) 与格 4/6 的收敛主张确实塌——承重，非观众砖。✓
      - 移除 DED-028：预测 (ii)(iii) 塌，(iv) 的危机窗口机制失去来源——承重。✓
      - 移除 DED-029：预测 (i)(ii)(iii)(v) 原文存活——它们的触发变量（法币信用下滑
        速度）在操作化里就是 DED-028/BR-L2-024 一系的代理（CDS/通胀预期/存款比→
        储备份额速率），不需要 DED-029。DED-029 的独有内容是 C1/C4 两条轴 + "触发
        类型决定哪个候选受益"的不对称推力——但没有任何已注册预测把 C1/C4 或触发类型
        当作被测变量：预测 (iv) 的条件 (c)（"事件性质使触发不对称"）无测量定义，
        (iv) 的可检验内核（事前排名 vs 事后胜出者一致性，急性 vs 慢速对比）也不用
        触发类型作自变量。文件 necessity (c) 称去掉 DED-029 就"失去事前监测能力"——
        夸大：事前监测由 DED-028 一系代理已覆盖，DED-029 真正添加的（利率/不确定性
        通道、候选差异化受益）在预测集里没有着陆点。
      修法二选一：(A) 增设已注册的触发类型差异化预测（如 (vi)：C1 主导触发时非生息
      候选[金]的 E_network 份额增益系统性高于生息候选，C3/C4 主导触发时无对手方候选
      占优——C 轴按 DED-029 的独立测量轴编码），使 DED-029 的独有内容落地为被测变量；
      或 (B) 把 DED-029 降为非承重引用，重述为双父复合（格 4/6 的三父声明相应降为
      双父，签名格重新论证）。(A) 优先——它同时兑现格 6 缺 DED-029 分析里自己写出的
      缺口（"无法区分事件类型对候选的不对称推力"）。

    13_trivial_conjunction: |
      裁定：pass。
      有真正"合起来才推得出"的内容：(a) 预测 (iv) 的胜出机制切换（慢速→择优收敛、
      急性→抢先收敛——DED-028 的速度变量修改 DED-027 的收敛运作条件），这不是 AND
      拼接而是交互命题；(b) 预测 (v) 迟滞——DED-027 暗示锁定但未讨论逆转条件，
      DED-028 显式把信用恢复期排除在射程外，合成才有"恢复信用不足以逆转"的新命题；
      (c) SOV-MOE 的机构级同构映射（央行储备↔家庭储蓄、贸易结算↔日常支付）是新的
      对应表。非平凡合取成立——条件是红旗 12 修掉后三父声明与实际承重一致。

    14_emergence_missing: |
      裁定：pass。
      多父逐格判空有至少一个扎实的 ≥2 父合力格：格 3 与格 5（DED-027 给方向、DED-028
      给时序与速度，缺一则分别退化为"不知是否/何时迁移"与"不知迁去哪")——这两格的
      双父合力论证经得起推敲，涌现最低门槛过线。格 4/6 的三父声明依赖 DED-029 的
      承重（红旗 12 未修前打折：按当前注册预测集,格 4/6 实际是双父格 + DED-029 的
      未操作化旁注）。签名格 6 的"碎片化→路径依赖收敛→可能非最高分者胜出"轨迹本身
      是好的复合预测设计，修 RF-2（δ/rank 注册）与 RF-4 后可恢复三父资格。

    15_weak_parent_premise: |
      裁定：pass_with_concern。
      形式合规：三父全部 verified（DED-027/028/029），无 candidate 父。实质打折：
      三条承重使用【全部】在父推论自宣射程之外（DED-027 显式排除现代法币体系；
      DED-028 操作化全部是家庭/私人部门指标；DED-029 全文围绕金编写且显式排除多因素
      交互）——verified 状态对本推论的背书传递很弱。文件用 Epistemic status 段全部
      披露并自设天花板（"预测 (i)(iv) 不享受完全背书"、"(iv) 是最弱最远的承重环节"）
      ——诚实度满分。但后果须落实：六维重标定实质上是一块嵌在 L4 里的新 L2 级桥
      （物理维度→制度维度的映射是全新经验主张，未经 IEA 或任何独立验证）——这不能
      靠披露豁免，它意味着即使修完全部 required，本条的合理定论上限也应是
      verified*（带"重标定桥未经独立验证"悬案）而非裸 verified。

    16_anchor_theft: |
      裁定：pass_with_concern。
      锚 1（英镑→美元）与锚 2（2022）是真复合锚——方向+时序+触发在同一案例内联合
      编码，非"A 存在且 B 存在"的换壳。锚 3（欧元 1999-2012）与锚 4c（日元）是
      "无触发→无切换"的零假设格证据——测的是复合框架的格 1/2，合法但证据力天然低
      （文件自标 not hardest test，诚实）。锚 4 整体接近 DED-028 单机制证据在主权
      尺度的复读——它支持的是扩展 (b) 而非复合交互，不应计为复合锚点（should 级
      标注即可）。

    17_interaction_measurement_gap: |
      裁定：pass_with_concern。
      交互级输出变量有定义良好的复合测量：「事前六维排名 vs 事后胜出者的一致性，
      急性事件组 vs 慢速事件组的对比」——这确实区别于任何单父输出（DED-027 只给排名、
      DED-028 只给时序、DED-029 只给触发）。缺口在可测性而非定义：已完成收敛的急性
      事件样本当前为零，一致性统计需要数十年积累。文件用预注册降格条款诚实圈住
      （candidate 状态下 (iv) 搁置）——定义合格、测量待未来，与红旗 18 联动处理。

    18_claim_type_mismatch: |
      裁定：needs_revision（required——RF-5）。
      claim_type=trajectory_prediction，但证据基座是 n=1 条已完成轨迹（英镑→美元）
      + 1 条进行中（2022-，且按 RF-1 裁决其急性资格待重注册）。更结构性的问题：
      falsifiability (c) 要求 ≥5 个独立信用下滑事件（含 ≥2 急性）、(d) 要求 ≥3 个
      急性事件且各有 ≥2 接近候选并跟踪 5 年——而全球尺度的储备体制切换历史上总共
      发生过一次。这两个统计证伪门在可预见的任何时间尺度内结构性不可满足——不是
      "尚未检验"而是"检验域为空"，(iii)(iv) 的可证伪性按当前写法接近名义可证伪、
      实践不可证伪。且单样本上的过拟合风险未被天花板条款覆盖：六维重标定、SOV-MOE
      机构映射、迟滞条款全部是在英镑→美元这同一个案例上校准，又拿同一案例当
      supporting 锚——校准集=检验集。
      修法（至少其一）：(A) 注册子全球代理事件域使证伪门可满足——区域锚货币/储备
      构成切换事件池（如 1992-93 卢布区解体后各共和国储备重配、英镑区成员 1960s-70s
      退出与储备转换、拉美美元化与逆美元化episodes、1997 后东亚储备重构）——按同一
      判据编码为"缩小尺度的体制切换"，让 ≥5/≥3 的样本量在既有历史内成为可能；
      (B) 显式把 (iii)(iv) 降格为"检验力完全依赖未来观测"并在 Epistemic status 加注
      "校准集=检验集，锚 1 对 (i)(ii)(v) 只提供一致性而非独立检验力"。(A)+(B) 同做
      最佳；只做 (B) 则本条实证含量趋薄，定论天花板进一步压低。

  counterexample_hunt: |
    方法：三路猎捕——(1) 射程内猎"父机制在储备域直接失效"；(2) L4 版专属：猎"父推论
    都成立但交互不产生 L4 预测"；(3) 猎"框架外驱动因素主导"。

    【猎物 1：战间期双储备货币并存与领先互换（1920s-1930s）】
    Eichengreen-Flandreau 记录：美元 1920s 中期超过英镑，英镑 1930s 夺回领先，两者以
    接近份额并存约 20 年——按 DED-027 投射到储备域的赢家通吃逻辑（两个 E 接近的候选
    不能长期稳定共存），这是射程内最接近净杀的案例。消化路径存在但文件没有走：
    1930s 世界分裂为英镑区/金集团/美元区——网络分区（DED-027 的边界案例"分区并行非
    反例"），anti_talisman (5) 的 TDO 类比判据原则上可独立测（同一央行子集内的份额
    交叉弹性）。裁定：非净杀（分区消化可行），但锚 1 的单调叙事被推翻（见红旗 7），
    且此案例警示：储备域的"连通网络"前提本身在地缘分裂期不成立——收敛预测的适用
    前提（网络连通性）须作为可测入格条件补进操作化。计入 RF-3。

    【猎物 2：2022- 进行中案例的交互失效检验（L4 版专属猎捕）】
    设三父机制都成立：触发（冻结=C3 极端）、时序（SOV 先动=央行购金）、方向（六维
    筛选）。交互预测（格 6）要求：碎片化后 E_network 正反馈在先发候选上启动、挤出
    接近竞争者、朝单一主导者收敛。实际 3-4 年观测：SOV 分流几乎全部走向黄金（央行
    购金 2022-2023 历史新高），人民币份额不升反降（COFER ~2.9%→~2.2%），欧元/日元
    无受益——没有多候选竞赛，没有先发放大竞争的迹象，更像单候选（金）吸收 + 在任者
    份额基本稳住（USD ~58-59%）。这可以被消化为"格 6 初期碎片化阶段"或"实为格 5
    （急性+单一显著候选=金）"——但两种消化对文件都有代价：前者要等 5-10 年，后者
    直接取消锚 2 对"多候选接近"格局的编码（多候选声明失去实例）。裁定：非净杀
    （时间窗未到 + 消化路径存在），但暴露 (iv) 在当前唯一准急性案例上无法进入检验
    位形，与 RF-1/RF-3 的裁决一致。

    【猎物 3：MOE 领先 SOV 的主权级反例】
    猎"贸易结算先转、储备后转"的案例：欧元区周边贸易计价欧元化领先于 COFER 欧元
    份额上升（1999-2004）——但这是货币联盟诞生的分母重组期+区域现象，被排除 3 和
    分区判据合法消化。石油美元计价惯性（MOE 粘性极强）反向支持 SOV 先动。未猎到
    干净的主权级 MOE 先动案例。裁定：未猎到活反例。

    【猎物 4：框架外驱动——联盟/阵营结构】
    见红旗 9：联盟结构在两个承重锚里实际承重（英镑区成员持英镑、不结盟央行购金），
    测量轴与 C1-C4 正交。按 falsifiability (f) 属弱证伪（框架扩展需求），不击穿核心。
    计入 SF-3。

    净结论：无射程内净杀。猎捕的实际产出是揭出锚点事实错（RF-3）、急性口径逃逸
    （RF-1）、多候选格局声明与现实编码的脱节，以及网络连通性作为隐含前提未注册。

  non_recurrence: |
    DED-004（不可证伪循环）：未复发——六项 anti_talisman 实质性阻断结果反推，预测
    (iv) 自带"不可检验时诚实标注而非虚报"条款。但 falsifiability (c)(d) 的样本量门
    在全球尺度不可满足（RF-5）使 (iii)(iv) 接近实践不可证伪——性质是检验域为空而非
    循环保护，修 RF-5 可解。
    DED-007（测量轴焊死）：未复发——CDS/通胀预期/制度指标是真外部轴；储备份额代理
    与 DV 的重叠已披露且有外部腿兜底（须按红旗 3a 升级为必要条件）。
    L4-009（事后口径）：轻度复发——2022 急性判定的"定性制度断裂"路径是注册文本外的
    事后口径，本轮已按第 11 条反向裁决处理（RF-1）。

  required_fixes:
    - id: RF-1
      priority: required
      title: "急性下滑判据重注册——2022 锚在当前注册下不计为已确认急性事件（红旗 11a/L4-009 判例）"
      description: |
        重注册急性判据为事件类清单制（储备冻结/主权违约/评级下调/恶性通胀等可编码
        事件类）+ 行为腿阈值按真实历史分布重标定（给出 σ 的计算窗口与口径——现文
        "0.3≈3σ"把季度波动均值 0.1pp 当 σ 用，标定依据不成立）+ 纯外部代理（CDS 或
        通胀预期或事件类编码）为同向确认的必要条件（堵红旗 3a 的 DV 自确认通道）。
        注册后重新编码 2022：过线则锚 2 恢复急性资格，不过线则降格——不得再调。
      affects: operationalization.在任储备资产信用下滑速度, real_world_anchors.supporting[2], anti_talisman_clause(1)(6)
    - id: RF-2
      priority: required
      title: "注册储备域 rank/权重协议与 δ；锁定被预测量综合权重（红旗 11b）"
      description: |
        给出储备域版的秩位规则（DED-027 的商品时代规则不可平移——须为金融深度/资本
        流动限制/信息不对称/地缘紧张四条方向性规则配上可操作的秩位判据与数据源）、
        δ 的数值与测量口径（分子分母、标准化方法）、以及"单一显著 vs 多候选接近"的
        列归属判定程序。被预测量综合指标权重 (0.5/0.25/0.25) 的"可调整"措辞删除或
        给出锁定截止条件。无此项则轴 A、预测 (iv)(b)、falsifiability (d) 全部不可操作。
      affects: operationalization.候选储备资产六维适应性, derivation.steps(4), falsifiability(d)
    - id: RF-3
      priority: required
      title: "锚点事实修正——人民币 COFER 方向反了；战间期非单调实录与并存消化（红旗 7）"
      description: |
        (a) 锚 2 撤下"人民币升至 3.5-4%"——IMF COFER 序列为 2022Q1 ~2.9% 峰值后回落
        至 ~2.2%；改述为 SOV 分流集中于黄金、候选集实际收窄，并评估此事实对"多候选
        接近"编码的影响。(b) 锚 1 重写为非单调实录（美元 1920s 中期超英镑、英镑 1930s
        夺回领先、1931 后外汇储备清算逃向黄金），显式消化 20 年双储备并存+领先互换
        （建议走 anti_talisman (5) 分区判据 + 把"网络连通性"注册为收敛预测的可测入格
        前提），confidence 降档。(c) 复核"1933 后全球央行继续增持美元"，无据则删。
