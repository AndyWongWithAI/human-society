  counterexample_hunt: |
    方法：r3 独立四路猎捕，不复用 r1/r2 猎物——(1) 当代多储备并存 vs
    赢家通吃；(2) 金属本位时代的体制切换；(3) 预测 (vi) 的反向案例；
    (4) 整改新文本逐段扫描。

    【猎物 1：美元+欧元 ~60/20 并存 25 年（1999-2024）vs 赢家通吃】
    discriminant_validity (ii)(b) 声称"E_network 的赢家通吃禁止多储备
    资产的稳定共存"——而 USD ~58-71% 与 EUR ~19-20% 在同一连通网络内
    稳定并存 25 年，欧元既未被挤出也未收敛归零。这是不是站着的活反例？
    消化检验：格 1/2 的注册预测本身允许"维持现体制 + 边际分散/轻微
    分散化"——赢家通吃在本推论中是【切换收敛期】的动力学（信用下滑
    触发的迁移不按得分比例瓜分、终局单一主导），不是"任何时点第二名
    必须归零"的静态垄断声称；无信用下滑确认期间的 20% 老二属组合管理
    射程（excluded_outcomes 1）。裁定：非净杀，被格结构合法消化——但
    消化的代价要说破：discriminant_validity (ii)(b) 的"禁止稳定共存"
    措辞比注册预测更强，容易被读成静态垄断声称而招无谓反例，建议对齐
    为"收敛期禁止按比例瓜分、终局单一主导"（编辑级，并入 SF-4 类处理）。
    同时本猎物再次确认：赢家通吃的复合内容只在切换期发威，而切换期
    样本一个都还没正式编码——复合增量零检验力的判断被第四次印证。

    【猎物 2：1870s 复本位→金本位的全球切换（Germany 1871 先发）】
    试图净杀"六维筛选决定方向"：白银的失位由供给冲击（Comstock 等）+
    德国以普法战争赔款先发转金 + 拉丁货币同盟/斯堪的纳维亚联盟/美国
    1873 铸币法级联跟进——网络级联、先发驱动，切换在约 30 年内完成。
    对本推论构成反例吗？(a) 射程判定：金属本位官方储备/本位选择,
    1945 前按 T3 仅方向/时序级可编码，且"在任者信用下滑"在金属本位下
    对应供给稳定性（D6）塌方——可映射，不出射程但也不在注册池内。
    (b) 方向检验：胜出者（金）在价值密度/供给纪律上事前占优——六维
    筛选方向相符；(c) 时序：官方本位与储备先转，白银在贸易/辅币流通
    滞后数十年——SOV 先 MOE 后方向相符；(d) 先发与级联：德国先动后
    正反馈级联——与 E_network 收敛相符。裁定：未净杀，反而是第二复合
    锚的现成候选（已供给至红旗 16）——但按 anti_talisman (2)，其六维
    事前占优的标定必须独立于"金最终赢了"完成，采纳时须按 T3 口径。

    【猎物 3：2022 冻结窗口对预测 (vi) 的反向检验——本轮主要捕获】
    r2 曾以 2011/2013 两事件方向核验 (vi) 通过。r3 换 2022 试杀：
    冻结事件（清单内 C3 类）后 4 个季度，C1 连续轴发生了 40 年级别的
    实际利率跃升（10 年 TIPS 约 -1.0%→+1.5%+，按自身历史分布 z 化
    大概率为四轴最大变动）；C4（VIX/EPU）冲高回落；C3 连续量（美国
    CDS）温和；C2 冲高回落。若按注册的字面规则（z 最大者主导）→ 2022
    窗口编码为 C1 主导【且方向为实际利率急升=C1 反向】→ (vi)(a) 的
    反向对称预测应为：非生息候选（黄金）的 E_network 增益系统性【低于】
    生息主权候选。实际观测：央行购金 2022-2023 连创历史纪录、黄金
    E_network 配置广度与强度双升，生息主权挑战者（欧元/日元/人民币）
    份额平或降——与 C1 主导读法下的 (vi) 预测【相反】。若按事件类
    读法（清单内 C3 事件发生即 C3 主导）→ (vi)(b) 预测非主权候选
    占优——与观测相符。同一案例、两种读法、裁决翻转，而离散事件类
    如何进入 z 比较未注册——第 11 条正主（RF-9）。裁定：非净杀（存在
    使 (vi) 存活的读法且该读法有机制合理性——冻结的信用冲击本来就
    不走 CDS 连续量），但在分支规则注册前，2022 对 (vi) 按不利方向
    记为活性张力；r2 的"(vi) 方向核验通过"须限定为"2011/2013 两事件
    上通过、2022 待分支规则注册后裁决"。

    【猎物 4：整改新文本逐段扫描】捕获两条：(a) 路径一的未注册前件
    （合格挑战者存在）——已升 RF-8，见 required_fix_verification；
    (b) 调节变量预算从未入账、当前至少 2/2 耗尽——已升 RF-10。另核
    对：限定词对称性 ✓、T2/T3 协议无焊点 ✓、SF-1 三处口径对齐 ✓。

    净结论：无净杀。r3 猎捕实际产出 = (vi) 的编码分支缺口（RF-9）+
    (a)(ii)/预测 (i) 的前件缺口（RF-8，与新文本扫描共同定位）+ 调节
    变量预算失察（RF-10）；附带供给一个第二复合锚候选（1870s）与一处
    discriminant_validity 措辞对齐建议。

