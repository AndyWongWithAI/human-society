    路径一（主承重）：马克/日元六维得分不接近美元——由事前可独立标定
    的制度数据支撑（德国限制非居民购债、日本外汇管制至 1980 外汇法
    修订 → D3/D1/D5 低），符合 anti_talisman (2)，不由"美元最终维持"
    反推。此路径成立则本案反哺为六维筛选区分力的正面证据。
