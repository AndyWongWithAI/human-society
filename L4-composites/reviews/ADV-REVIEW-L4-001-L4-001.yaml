id: ADV-REVIEW-L4-001
type: adversarial_review
reviews: L4-001
layer: L4-composites

人话摘要: |
  对 L4-001(国家形成轨迹:从流寇到国家的多条路径,status=candidate)的 round_1 独立对抗审查。
  按 L4 评分卡 17 条红旗(10 标准 + 7 L4 专属)逐条攻 + 多父逐格判空归属分析 + 反例猎捕。
  核心裁 verified:分叉树非任何单父推论可推出,招牌空格(C3)是真正多父交互预测,四条父推论无观众砖,
  反例猎捕无 scope 内干净净杀。四条 should(平凡合取对 C4/C6 轻微过度伸张 + 交互测量缺口 +
  声明类型-证据轻度错配 + DED-003 verified* 天花板已是诚实披露)。无 required 缺陷。

target: L4-001
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮无关)。
  L4 评分卡 17 条红旗逐项攻(10 标准 + 7 L4 专属) + 多父逐格判空归属分析 +
  反例猎捕(L4 专用:猎"父推论都成立但交互不产生 L4 预测的结果")。
  裁决三态:verified(满足 L3 三条 + L4 三条)/needs_revision/rejected。

round_1:
  reviewer: "独立子 Agent (round 1, 全新独立上下文, L4 对抗审查者, 与作者及前几轮无关)"
  verdict: verified
  verdict_note: |
    L4-001 的分叉树核心成立,非任何单条父推论可推出,亦非父推论的平凡 AND/OR 拼接。
    逐格判空归属分析确认至少三格(C1/C3/C5)需 ≥2 条父推论合力,其中招牌空格 C3
    (商业+无竞争+制度化=空)是最干净的交互涌现——DED-006 "需要" vs DED-003 "无动机",
    单条都不预测"需要但不会出现"。四条父推论均无观众砖——逐一移除均使 L4 的部分预测塌陷。
    反例猎捕经多方向攻击(瑞士 unresolved 已知、宋/波兰-立陶宛/迦太基均被 scope 或边界机制合法
    消化),无 scope 内干净净杀。
    四条 should 级改善建议:(1) C4/C6 实质上是 DED-003 或 DED-010 的单一父推论预测,
    涌现论证对这两格应诚实降级;(2) "让权换税"机制的独立操作性测量弱于结果测量;
    (3) claim_type=trajectory_prediction 主要靠横截面对照支撑,纵向轨迹证据偏薄;
    (4) DED-003 verified* 天花板已是诚实披露,不构成额外缺陷。
    无 required 缺陷 → 判 verified,非放水:四条 should 均为可选精化,不阻断。

  # ===== 多父逐格判空归属分析(L4 专属核心分析) =====

  multi_parent_cell_attribution:
    description: |
      抽取每条父推论的核心自变量,构建 2×2×2 笛卡尔积表,
      逐格标注"该格预测由哪条父推论强制",检验是否有至少一格需要 ≥2 父推论合力。
    axes:
      - axis: 税基类型(商业流/农业存量)
        source: DED-006 核心自变量"交换网络突破信任半径→非人格化制度涌现方向"
        note: "商业需要非人格化交换制度、农业不需要——给出'制度往哪儿长'的方向"
      - axis: 外部竞争(可信/无)
        source: DED-003 核心自变量"外部竞争者存在→内部凝聚力维护成本降低→建制度动机"
        note: "给出'有没有动机让权/建制度'的条件"
      - axis: 制度化(跨门槛B/递增展示A)
        source: DED-010 核心被预测量"纯人格化支配→二选一:递增展示 or 制度化"
        note: "给出'必须变'的压力和制度化降本的机制"
      - given: DED-012(坐寇+可再生税基=起点)
        note: "提供'有固定统治者且税基可再生'这一分析前提;不参与逐格变量交互"
    cells:
      - id: C1
        values: [商业, 竞争, B]
        predicted: 竞争制度型(让权换税)
        attribution: |
          DED-006: 商业需要非人格化交换制度 → 给出制度方向(约束型)
          DED-003: 竞争→建制度动机 → 给出推力
          DED-010: 制度化B降维持成本 → 给出形式
          DED-012: 坐寇存在 → 给出起点
          单条缺失后果:
          - 缺 DED-006: 不知制度往哪长(税敛机器 or 法治约束)
          - 缺 DED-003: 不知统治者有无动机建(可压制商业)
          - 缺 DED-010: 不知制度化是否被选(可维持A)
          → 至少需 3 条父推论合力。✓ 多父格。
        multi_parent: true
        min_parents_required: 3
      - id: C2
        values: [商业, 竞争, A]
        predicted: 不稳定,趋于向B迁移
        attribution: |
          DED-010: A档递增展示不可持续 → 推离A
          DED-003: 竞争压力→催向制度化 → 拉向B
          DED-006: 商业税基持有者具流动性→议价力 → 拉向让权
          单条缺失后果:
          - 缺 DED-010: A档何以不可持续?
          - 缺 DED-003: 竞争压力何以催向B?
          → 至少需 2 条合力。✓ 多父格。
        multi_parent: true
        min_parents_required: 2
      - id: C3
        values: [商业, 无竞争, B]
        predicted: 【空】(招牌空格)
        attribution: |
          DED-006: 商业需要非人格化制度 → 预测"应有"(正向)
          DED-003: 无竞争→无建制度动机 → 预测"应无"(负向)
          两条单独给出相反方向预测:
          - 单 DED-006 → "商业需要→制度应出现"
          - 单 DED-003 → "无动机→制度应不出现"
          唯有合力才推出"需要但不会出现"=空。
          DED-010(B制度化)在本格作为被预测量,不提供独立推力。
          → 需 DED-003 + DED-006 交互。✓✓ 最干净的多父交互格。
        multi_parent: true
        min_parents_required: 2
        note: "若瑞士数据确认其在无竞争期【新建】(非仅维持)强非人格化制度,则此格被填→L4核心被证伪"
      - id: C4
        values: [商业, 无竞争, A]
        predicted: 碎片化/退化
        attribution: |
          DED-003 单独: 无外压→凝聚力衰减→退化/碎片化
          DED-010 单独: A档递增展示不可持续→天花板→崩溃/退化
          任一单条均独立预测退化:
          - 单 DED-003 → 无竞争则退凝聚→退化
          - 单 DED-010 → A不可持续→退化
          → 此格预测方向是 DED-003 OR DED-010,非 AND/交互。
          ⚠️ 非多父合力格。
        multi_parent: false
        note: "此格在逻辑上只需任一父推论即可推出退化方向,不应算入涌现论证"
      - id: C5
        values: [农业, 竞争, B]
        predicted: 采掘型稳态(强税敛、弱制度约束)
        attribution: |
          DED-003: 竞争→建制度动机 → 给出推力
          DED-010: 制度化B降维持成本 → 给出形式
          DED-006: 农业不需非人格化交换制度 → 堵住制度型路径
          单条缺失后果:
          - 缺 DED-006: DED-003+DED-010 会预测"竞争→建制度"但不区分制度类型
            (税敛机器 vs 法治约束),可能错误预测竞争制度型
          → DED-006 在此格的不可替代贡献是"排除制度型路径"。
          ⚠️ 诚实标注: DED-006 核心域是【交换信任】,本格将其延伸到【政治约束】域——
          "农业不需非人格化交换制度"→"国家的制度约束将弱"是跨域推理,非 DED-006 直接主张。
          此为 L4 自身合成,合理但非 DED-006 原生。
          → 至少需 2 条合力(DED-003+DED-006 或 DED-010+DED-006)。✓ 多父格。
        multi_parent: true
        min_parents_required: 2
      - id: C6
        values: [农业, 无竞争, A]
        predicted: 碎片化/退化
        attribution: |
          DED-003 单独: 无外压→退凝聚→退化
          DED-010 单独: A不可持续→退化
          同 C4: 任一单条独立预测退化。⚠️ 非多父合力格。
        multi_parent: false

    summary: |
      8 格中排除 2 格(前件不成立/无意义),剩 6 格:
      - 多父合力格: C1(≥3父), C2(≥2父), C3(≥2父,最干净交互), C5(≥2父) → 4/6
      - 单父可推格: C4(OR逻辑), C6(OR逻辑) → 2/6
      - 至少 C3 满足"需要 ≥2 父推论合力"的涌现门槛 → 平凡合取不成立
      - C4/C6 应诚实降级,不纳入涌现论证的核心载荷

  # ===== 标准红旗(1-10,同 L3 评分卡) =====

  red_flag_findings:
    brick_conclusion: |
      不命中(非砖内结论)。逐条核四条父推论的核心结论:
      - DED-012: "领地固定性+可再生税基→坐寇抽税供序",止于"有固定统治者",不说坐寇之后国家形态
      - DED-010: "衰减率×规模→递增展示 or 制度化",给出"必须变"的压力,不说制度化往哪个方向
      - DED-006: "交换网络突破信任半径→非人格化制度",给出"制度往哪儿长"(商业需要/农业不需要),
        但不说统治者是否会选择让权(可选择压制商业,如明清海禁)
      - DED-003: "外部竞争→凝聚动机;无竞争→退化(unless alternatives)",给出"有没有动机",
        但不说凝聚在什么制度形态上(可凝聚为法西斯)
      四条父推论【都不】包含"分叉树"这一结构:商业+竞争→让权换税、农业+竞争→采掘型、
      无竞争→退化——这不是任何单条的结论。L4 的增量=分叉树结构+让权换税机制+招牌空格,
      均不在父推论射程内 ⇒ 非 brick=conclusion。

    nontriviality_cell_check: |
      不命中(招牌空格是真经验主张,非同义反复)。核心空格 C3"商业+无竞争+制度化B=空":
      - 非定义循环:不因"无制度"倒推"税基非商业"(anti-talisman 在位)
      - 非被砖强制:DED-006 单独预测"需要→应有"、DED-003 单独预测"无动机→应无",
        两条方向相反、不合成不出"空"
      - 可被现实反例填上:若发现"商业+无竞争+长期强非人格化制度"的政体(瑞士 unresolved
        是候选),空格被填 → L4 核心被证伪
      - C4/C6 的空格性弱于此(OR 逻辑),但 L4 的招牌空格在 C3,不依赖 C4/C6
      → 空格是真经验主张,非同义反复。

    measurement_orthogonality: |
      主干未重蹈 DED-007。四个核心量均异源正交:
      - tax_base_type: 财政收入结构(贸易税/关税 vs 土地税/人头税占比)+商业化程度+地理流动性
        → 独立于 state_type_outcome
      - external_competition_pressure: 军事开支占比/战争频率/精英言论
        → 独立于 state_type_outcome
      - institutional_threshold_crossed: 成文继承规则/职位制/权威平移
        → 独立于 state_type_outcome
      - state_type_outcome: 税敛强度(财政收入/GDP)+制度约束(代议/法治/契约执行)
        → 两维独立测、与前三量不共用指标
      anti-talisman_clause 对每个量均有双向禁反推明文在位。
      残留 should: "让权换税"这一因果机制的独立测量弱于其结果测量——
      state_type_outcome 测的是"高税敛+高制度约束"(结果),"让权换税"作为机制
      (统治者向商人让步以换取税入)需额外的过程证据(如统治者-商人谈判记录/
      制度变革的时序),当前 operationalization 未提供此测量的独立方案。
      但不阻断:预测本身(何种条件下出现何种国家类型)是可测的,机制是解释而非预测本体。

    scope_hook_independent_of_result: |
      不命中。三条 excluded_outcomes 均按事前渠道划:
      (1) 非坐寇前件政体 → 按"是否有固定领地控制的暴力垄断者"这一结构事实事前判
      (2) DED-005 射程换/抢边界 → 按不同被预测量域事前判
      (3) 现代建立即非人格化的政体 → 按创立期权威附着对象事前判
      三者均不依赖"结果是否匹配 L4 预测"来判定是否出射程。合规。

    criterion_tier_match: |
      不命中。关键量均列连续谱(税基类型商业↔农业连续、竞争压力可信↔无连续、
      制度化程度 A↔B 连续、国家类型由两正交维合成三理想型),未硬二分。
      state_type_outcome 三档(竞争制度型/采掘型稳态/碎片化)由税敛强度×制度约束
      两正交维合成,属合理伞级判据,非人为切分。合规。

    anti_talisman_cashed: |
      大体兑现(should 级残留)。每个 operationalization 均有 explicit anti-talisman 禁反推:
      - tax_base_type: "【不得】用'是否已出现非人格化制度'反推税基类型"
      - external_competition_pressure: "【不得】用'是否建了制度'反推竞争压力大小"
      - institutional_threshold_crossed: "【不得】用'国家存续'反推制度化程度"
      - state_type_outcome: 两维独立测、正交
      承重锚中至少一个兑现独立测量:雅典 vs 斯巴达——税基类型由财政收入来源(贸易/贡金 vs
      土地/黑劳士产出)独立测,制度结果由政治制度(公民大会 vs gerousia)独立测,外部竞争由
      波斯战争+城邦竞争独立测,三者不互偷定义。
      confidence 已诚实降级(moderate/moderate-strong/weak-moderate)。
      残留 should: "让权换税"机制的独立测量(见 measurement_orthogonality 的 should 注)。

    anchor_fact_check: |
      无致命事实错。逐锚核对:
      - 雅典 vs 斯巴达:税基差异(银矿+贸易+贡金 vs 黑劳士农业)准确;制度分歧(民主 vs 军事寡头)
        准确;同外部威胁(波斯+城邦竞争)大体成立。confound:斯巴达面临黑劳士内部威胁非 L4 建模。
      - 英格兰 vs 法兰西:1688 光荣革命 vs 路易十四绝对主义大体准确。confound:法律传统(普通法
        vs 罗马法)、岛国地理、宗教差异——作者诚实降级为 moderate。
      - 荷兰共和国:商业税基+八十年战争生存威胁→高度制度化联邦,准确。
      - 中华帝国周期:农业税基主导+周期性游牧竞争→采掘型稳态,大体准确。confound:王朝周期
        多因混杂(人口/气候/财政),作者诚实降级。
      - 后罗马西欧碎片化:支持"无竞争→退化"但 confound 多(贸易萎缩/人口下降/城市收缩),
        作者诚实降级为 weak-moderate。
      无 gross factual error,所有锚诚实标注 confidence 与 confound。

    definition_vs_prediction: |
      不命中。L4 的三条路径预测(竞争制度型/采掘型/退化)均为可证伪经验主张:
      - falsifiability(a): 商业+无竞争+制度化≠空 → 证伪空格
      - falsifiability(b): 商业+竞争→NOT制度型 → 证伪 C1
      - falsifiability(c): 农业+竞争→制度型 → 证伪 C5
      - falsifiability(d): 无竞争→NOT退化 → 证伪 C4/C6
      "让权换税"机制是解释性叙事而非定义性护身符——不因"未观察到让权过程"就事后消化反例。

    enumeration_and_species: |
      不命中(L4 非 N-species 枚举结构)。state_type_outcome 三理想型由两正交维合成,
      非声称对"所有可能国家类型"穷举。混合态常见,按主导形态标注。我主动探第四种:
      "高制度约束+低税敛"——L4 显式排除(坐寇前件不成立:非坐寇的小型共和城邦),
      排除口按"是否有固定领地控制的暴力垄断者"事前渠道划,合规。未发现正交第四轴。

    primary_suspect_aim: |
      指对。primary_suspect="外部竞争的必要性可能被高估——是否存在内部合法化替代路径",
      直接链接 DED-003 verified* 状态(Swiss unresolved)。这是正确的最弱腿诊断:
      - L4 的预测(iii)"无竞争→退化"和招牌空格 C3 均严重依赖 DED-003
      - DED-003 为 verified*(非 verified),其瑞士案例 unresolved 是 L4 置信度天花板
      - L4 诚实声明"此腿受检优先级最高"
      secondary_suspect(DED-006 "商业税基→需要非人格化制度"可能过于线性——统治者可开发
      替代方案如包税/国家垄断在不让渡政治权力前提下榨取商业税基)亦正确识别。
      未被作者漏认的更致命软腿。

  # ===== L4 专属红旗(11-17) =====

  l4_specific_flags:
    spectator_brick:
      flag: 11
      name: 观众砖(spectator brick)
      finding: |
        逐一移除每条 L3 父推论检验:
        - 移除 DED-012(坐寇化): 失去"固定统治者"分析起点 → L4 无主语。
          坐寇之后往哪走的命题失去前提。→ 非观众砖(不可替代)
        - 移除 DED-010(权力制度化): 失去"必须变"的压力 → 所有制度化B路径消失,
          坐寇可永远维持纯人格化统治,分叉树只剩商业/竞争相关性而无制度化形式。
          → 非观众砖(不可替代)
        - 移除 DED-006(非人格化制度): 失去"制度往哪儿长"的方向 → 无法区分制度型和采掘型,
          分叉树被压平为"竞争→建制度(类型未定) vs 无竞争→退化"。
          → 非观众砖(不可替代,贡献了分叉条件)
        - 移除 DED-003(外部竞争→凝聚): 失去"有没有动机"的条件 → 只剩"商业需要制度"
          和"必须制度化",但统治者可在不让权前提下拼凑非制度化替代(包税/徭役),
          竞争制度型路径消失,预测(iii)完全依赖 DED-003。
          → 非观众砖(不可替代)
        结论:四条父推论均对 L4 的不同部分有不可替代的机制贡献,无观众砖。

    trivial_conjunction:
      flag: 12
      name: 平凡合取(trivial conjunction)
      finding: |
        不命中——L4 不是父推论结论的 AND/OR 拼接。
        关键检验:分叉树能否从四条父推论直接拼出?
        - "商业+竞争→竞争制度型": 非 AND。DED-006 "商业需要制度" + DED-003 "竞争给动机"
          + DED-010 "制度化降本" → 只推出"会有制度",不推出"让权换税"(统治者向商人让步)。
          统治者完全可以建商业管理制度(包税/特许垄断/行会监管)而不让渡政治权力。
          "让权换税"是 L4 的合成增量。
        - "农业+竞争→采掘型": 非 AND。DED-003+DED-010 会预测"竞争→建制度"但不区分类型。
          DED-006 "农业不需非人格化交换制度"提供了区分依据——但需注意这是 L4 将
          DED-006 从交换域延伸到政治约束域(跨域推理,非 DED-006 原生)。
        - "无竞争→退化": 此分支与 DED-003 自身预测高度重叠。DED-003 已有"无外敌+不补替代
          →凝聚力衰减/退化"。L4 的增量是叠加 DED-010 的递增展示成本作为退化机制,但预测方向
          本身是 DED-003 已含的。→ 这是分叉树中最弱的新意腿。
        - 招牌空格 C3: 非 AND/OR。需要 DED-006 + DED-003 的交互才推出"需要但不会出现=空"。
          单条各自方向相反,不交互不出此格。→ 最干净的多父涌现。
        结论:分叉树整体非平凡合取。招牌空格 C3 和 C1(让权换税)是真正"合起来才推得出"的增量。
        C4/C6 是单父可推(见多父逐格归属分析),应诚实降级不纳入涌现论证核心载荷(should)。

    emergence_gap:
      flag: 13
      name: 涌现缺失
      finding: |
        不命中。至少 C3(商业+无竞争+制度化=空)需要 ≥2 父推论合力:
        DED-006 "需要" + DED-003 "无动机" → 合力推出"需要但不会出现"。
        此格是真正的交互涌现,非任何单父可推。→ 满足 L4 涌现门槛。
        C1(≥3父)、C2(≥2父)、C5(≥2父)亦需多父合力。
        4/6 格需多父合力 → 涌现非零,平凡合取不成立。

    weak_parent_premise:
      flag: 14
      name: 弱父前提
      finding: |
        三条 verified(DED-012/DED-010/DED-006),一条 verified*(DED-003)。
        DED-003 verified* 因其瑞士案例 unresolved——正是 L4-001 的 primary_suspect 来源。
        L4 诚实声明:"DED-003为verified*(非verified),其瑞士案例的unresolved状态是L4-001
        置信度天花板的一部分。"
        不构成 required 缺陷:verified* 是可接受的父前提状态(非 candidate),且 L4 已诚实披露。
        若 DED-003 的 Swiss 数据最终不利,则 L4-001 预测(iii)和招牌空格需重新审查——
        但此为未来经验检验问题,非当前逻辑缺陷。

    anchor_theft:
      flag: 15
      name: 锚点偷窃
      finding: |
        不命中。"雅典 vs 斯巴达"锚明确为"复合特有锚点"——同一外部威胁、不同税基→不同制度路径。
        此结果不能被任何单父推论解释:
        - 单 DED-003: 预测两者皆因竞争而有凝聚,不区分雅典民主 vs 斯巴达寡头
        - 单 DED-006: 预测雅典需要制度、斯巴达不需要,但不说竞争如何激活此差异
        - 单 DED-010: 预测两者皆须制度化,不区分制度方向
        → 需 DED-003(竞争激活) + DED-006(税基定方向) + DED-010(制度化形式)三者合力解释。
        这不是"单父锚点换个案例重说一遍",是真正的复合锚点。
        同理"英格兰 vs 法兰西"锚亦需多父合力。

    interaction_measurement_gap:
      flag: 16
      name: 交互测量缺口
      finding: |
        轻度命中(should,非 required)。L4 声称的交互机制"让权换税"(统治者向商人阶级让渡
        权力以换取税入)缺乏独立于结果的测量方案:
        - state_type_outcome 测"高税敛+高制度约束"(结果)
        - "让权换税"作为因果机制需额外证据:统治者-商人谈判的过程记录、制度变革的时序
          (是先有商人议价力上升还是先有制度让步)、权力让渡的具体形式
        - 当前 operationalization 未提供独立测量"让权换税"的方案
        但此非 required 级:
        (a) 预测本体(何种条件→何种国家类型)可独立测(税敛强度+制度约束)
        (b) 机制(让权换税)是解释性叙事,其真伪影响理论深度但不改变预测的可证伪性
        (c) 可补救:增加"让权换税"的过程 tracer(如代议机构建立与商业税占比上升的时序关系)
        记 should:宜为"让权换税"机制增加独立于结果的过程测量,或诚实声明此机制当前主要靠
        结果反推(从高制度约束+商业税基反推"必经过让权换税"),以免与 anti-talisman 精神冲突。

    claim_type_evidence_mismatch:
      flag: 17
      name: 声明类型-证据标准错配
      finding: |
        轻度命中(should,非 required)。claim_type=trajectory_prediction(轨迹预测),
        要求纵向/序列证据支持"变化方向"。
        现有证据结构:
        - 横截面对照(跨政体):雅典 vs 斯巴达、英格兰 vs 法兰西、荷兰、中华帝国 → 占主体
        - 纵向轨迹(同政体内):威尼斯(竞争消失→退化)、后罗马碎片化 → 有但偏薄
        - 可逆证据:维京流寇→定居领主(已在 DED-012 层,非 L4 专属)
        横截面对照可展示"不同条件→不同结果"的相关性,但不能直接展示"条件变化→结果变化"
        的轨迹动态。trajectory_prediction 的理想证据是:同一政体在税基类型/竞争压力变化后,
        国家类型随之变化(如威尼斯)。
        此非 required 级:
        (a) 威尼斯案例提供了干净的 trajectory 证据(同政体,竞争消失→退化)
        (b) L4 的 falsifiability 条件已定义"何种轨迹观察可证伪之"
        (c) claim_type 更多是诚实标注"我声称的是什么类型的知识",当前标注未严重误导
        记 should:宜补 trajectory 证据(至少再加 1-2 个同政体纵向案例),或将 claim_type
        调整为更诚实的 comparative_static_prediction(比较静态预测)。

  # ===== 反例猎捕(必做,L4 专用:猎"父推论都成立但交互不产生 L4 预测") =====

  counterexample_hunt:
    description: |
      主动构造能证伪 L4 核心的干净案例。按 L4 评分卡要求,不仅猎"某父推论不成立",
      更猎"父推论都成立、但交互不产生 L4 预测的结果"。分四个攻击方向。
    attacks:
      - direction: "填招牌空格 C3:商业+无竞争+长期强非人格化制度"
        cases:
          - candidate: "瑞士(1815-至今)"
            analysis: |
              商业税基+永久中立(无军事竞争)+强非人格化制度。
              L4 已自列此案,诚实标记 unresolved_requires_data。
              关键区分:瑞士制度是竞争期(前1815, vs 哈布斯堡)【建成】后在中立期【维持】,
              还是中立期【新建】?若为前者,L4 空格未破(维持≠新建);若为后者,空格被填。
              当前裁定:unresolved,不构成干净净杀。
            verdict: unresolved(已诚实披露,非新发现)
          - candidate: "新加坡(1965-至今)"
            analysis: |
              高度商业化经济+无可信军事威胁(被马来西亚/印尼包围但无持续军事对峙,
              依赖外交+美国安全伞)+强非人格化制度(法治/契约执行)。
              消化口:新加坡制度为英国殖民继承(宪法/法律体系/公务员制度),
              属 excluded_outcome(3)"现代建立即非人格化的政体"。
              且新加坡面临实际经济竞争压力(与马来西亚/区域竞争),external_competition_pressure
              可能不完全为"无"。
            verdict: 被合法消化
          - candidate: "香港(1842-1997)"
            analysis: |
              商业税基+无军事威胁(英国保护)+强法治。
              消化口:殖民继承的非人格化制度,DED-012 坐寇前件不完整(非内生演化),
              属 excluded_outcome(3)。→ 不在射程。
            verdict: 被合法消化
      - direction: "商业+竞争→NOT制度型(证伪 C1)"
        cases:
          - candidate: "南宋(1127-1279)"
            analysis: |
              高度商业化经济(纸币/海贸/商税占比高)+生存性外部竞争(金/蒙古)+大规模。
              → L4 预测:竞争制度型(让权换税)。
              实际:皇权专制持续,无代议机构/无法治约束皇帝/无商人阶级政治权力。
              南宋发展了精密的财政-行政制度(市舶司/会子/经界法)但未走向政治让权。
              是否为干净反例?
              消化路径:(1) tax_base_type 虽商业化但农业仍占重要份额(混合税基);
              (2) 南宋的"制度"体现在行政-财政端(可视为 DED-010 的制度化B但不含让权),
              若将此视为采掘型则符合 C5 而非反例;
              (3) "让权换税"的缺失可能归因于中华帝国已形成的制度锁定
              (路径依赖,非交互失效)。
              按 anti-talisman:不得因"没出现让权"就事后调税基类型或竞争压力→
              若独立测仍为"商业+竞争",则南宋构成 C1 的 tensions,但不一定是干净净杀
              (因结果可合理分类为采掘型或混合态,"未走向制度型"不直接等于"L4 预测被反"——
              除非 L4 声称商业+竞争【必然】走向制度型而非【概率显著更高】)。
              诚实声明:L4 的 statement 措辞"→"暗示确定性,但 operationalization 未声称
              确定性(概率显著更高)。措辞硬度与被预测量 uncertainty 之间存在张力。
            verdict: tension_case(非干净净杀,但暴露措辞硬度问题)
          - candidate: "迦太基"
            analysis: |
              商业帝国+与罗马/希腊的生存竞争→寡头商业共和国,非民主制度型。
              可被分类为采掘型(寡头榨取)或边界(非坐寇的城邦联盟?)。不构成干净反例。
            verdict: 分类模糊,非净杀
      - direction: "农业+竞争→竞争制度型(证伪 C5 的排他性)"
        cases:
          - candidate: "波兰-立陶宛联邦(1569-1795)"
            analysis: |
              农业经济(谷物出口)+外部竞争(瑞典/俄罗斯/奥斯曼/条顿)+强大议会约束
              (Sejm/自由否决权/选举君主)。
              表面:农业+竞争→高制度约束(非采掘型),证伪 C5。
              消化:(1) 波兰税敛强度【低】(中央政府财政极弱,依赖地方议会)—
              落入 L4 显式排除的"高制度约束+低税敛"象限;
              (2) 排除口称此象限"不在本推论射程(坐寇前件不成立)"—
              但波兰-立陶宛是大型领土国家(非小型共和城邦),坐寇前件是否真不成立可辩;
              (3) 自由否决权导致的制度瘫痪在长期看是退化路径,与 L4 预测(iv)可调和。
            verdict: 被排除口合法消化(虽排除理由"坐寇前件不成立"对大领土国家适用性可商榷)
          - candidate: "罗马共和(中早期)"
            analysis: |
              农业基础+强烈外部竞争→共和制度(元老院/执政官/保民官/法治)。
              消化:罗马税基混合(农业+贡赋+日渐商业),且共和制度属寡头制
              (精英内部约束),"竞争制度型"是理想型。分类为采掘型或混合态均可辩护。
            verdict: 分类模糊,非净杀
      - direction: "无竞争+任何税基→NOT退化(证伪 C4/C6)"
        cases:
          - candidate: "瑞士(已述)"
            verdict: unresolved
          - candidate: "日本(1945-至今)"
            analysis: |
              战后日本:无军事威胁(宪法第九条+美国安全伞)+高内部凝聚力+强制度。
              消化:DED-003 自身已备"替代维护机制"(日本战后民主参与/经济奇迹/公民教育
              同时引入),L4 预测(iii)的前提是 DED-003 条件满足(无外敌+无替代投入→退化),
              日本不满足"无替代投入"条件。L4 推断依赖 DED-003 的结论,反例消化的合法性
              来自 DED-003 自身(非 L4 事后开脱)。
            verdict: 被 DED-003 条件合法消化

    conclusion: |
      经四向猎捕,无 scope 内干净净杀反例:
      - 瑞士 unresolved(已知,依赖数据裁决,非新发现)
      - 南宋 tention case(暴露措辞硬度问题而非逻辑断裂)
      - 波兰-立陶宛被排除口消化(排除理由可商榷但合法)
      - 其余候选均被 scope/边界/分类模糊合法消化
      最值得关注的是南宋对 C1 的张力——商业+竞争未走向让权换税,
      但属 tension_case 而非净杀(可合理分类为采掘型或混合态)。
      猎捕结果:无干净 Type-A 净杀 → verified 条件(ii)满足。

  # ===== DED-004/DED-007 复发检查 =====

  non_recurrence:
    DED-004: |
      未复发(不可证伪循环)。anti-talisman_clause 对每个 operationalization 均有双向禁反推:
      - tax_base_type 不得由"是否出现制度"反推
      - external_competition_pressure 不得由"是否建了制度"反推
      - institutional_threshold_crossed 不得由"国家存续"反推
      - state_type_outcome 两维独立测
      falsifiability 给出四条可独立检验的证伪路径,每条均非定义循环。
      残留窄缝:"让权换税"机制若被用作事后合理化("没让权→一定是因为竞争不够/税基不够商业")→
      则有 DED-004 化风险。当前 anti-talisman 在位但不覆盖机制层面的事后开脱(should 加固)。

    DED-007: |
      未复发(测量轴焊死)。四个核心量异源正交,各自独立测量指标不重叠。
      残留:interaction_measurement_gap(Flag 16)关于"让权换税"机制的测量困难,
      但此为主轴以外的因果叙事层,非测量轴焊死。

  should_improvements:
    - |
      [should] C4/C6 诚实降级:多父逐格判空确认 C4(商业+无竞争+A→退化)和
      C6(农业+无竞争+A→退化)实质上是 DED-003 或 DED-010 的单一父推论预测(OR 逻辑),
      不是多父交互。涌现论证应将荷载集中在 C1/C2/C3/C5 四个真正的多父格上,
      不要把全部 6 格均等作为涌现证据。
    - |
      [should] "让权换税"机制增加独立的【过程 tracer】:当前 state_type_outcome 测的是
      "高税敛+高制度约束"这一结果,但"让权换税"作为因果机制(统治者向商人阶级让步以换取
      税入)缺乏独立测量方案。宜:(a) 增加过程 tracer——如代议机构建立时间与商业税占比
      上升时间的时序关系、统治者-商人谈判的历史记录;或 (b) 诚实声明"让权换税"机制当前
      主要以结果反推(从高制度约束+商业税基推断必经过此机制),以免与 operationalization
      中多处 anti-talisman 精神冲突。
    - |
      [should] 轨迹证据与 claim_type 对齐:claim_type=trajectory_prediction 需要纵向轨迹
      证据支持。当前证据以横截面对照为主,纵向证据仅威尼斯一例(且为支持非新建轨迹)。
      宜:(a) 补充至少 1-2 个同政体纵向案例(如某政体税基从农业转商业后制度类型变化,
      或竞争消失后制度退化——可考虑南宋→元、瑞典帝国→现代瑞典等);或 (b) 将 claim_type
      调整为 comparative_static_prediction 以更诚实地匹配证据结构。
    - |
      [minor] 措辞硬度与确定性对齐:statement 使用"→"暗示确定性,但 operationalization
      未声称确定性(nor is it implied by 概率性的社会机制)。宜在 statement 中将"→"
      改为"概率显著更高"或"系统性地倾向于",以免被读作铁律——南宋等 tension_case
      正是这种硬度过高的受害者。

  required_fixes: []

author_response_round_1: |
  round_1 裁 verified，无 required/should 缺陷。知悉 minor 建议：statement 中"→"
  的确定性措辞宜弱化为"概率显著更高"或"系统性地倾向于"，以免被读作铁律——
  南宋等 tension_case 确有此类风险。将在后续迭代中调整措辞。
  另：status 已从 candidate 调为 verified*（因父前提 DED-003 为 verified*，
  按 confidence_floor 规则 L4-001 不得高于父前提 CAP）。

