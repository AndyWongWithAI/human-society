      需要修订?

  15_anchor_theft:
    verdict: pass_with_concern
    note: |
      逐一审查 L4-005 的五个 composite_specific 锚点:

      Anchor 1 (EU→"向上交"): 声称 L4-001+L4-004 交互——"没有现代交通+通信技术,
      单一市场在物理上不可行(L4-004); 没有商业税基的跨国化, '让权给超国家制度'缺乏
      动机(L4-001)"。
      审查裁决: 这更像是"两个必要条件同时满足"而非"机制交互"。L4-001 提供动机(税基
      跨国→需要超国家制度), L4-004 提供可行性(技术使跨国交换可能)。两者是独立必要条件,
      不是交互。但 EU 锚点确实需要两者才能完整解释——单有动机无技术不可行, 单有技术无
      动机不发生。标注为【两个必要条件合取, 非交互】。可接受。

      Anchor 2 (社交媒体→多层公平冲突前台化): 声称 L4-004+DED-022 交互——"数字技术
      不是创造了公平冲突——DED-022 说冲突本来就存在——而是使冲突从'各层独立运作'升级为
      '多层同一舞台正面碰撞'"。
      审查裁决: 这是本推论中最接近真正复合锚点的案例。L4-004 的数字技术改变了 DED-022
      机制运作的【可见性条件】——冲突本身不变, 但冲突的表现形式和频率因技术条件而质变。
      这不是简单的"两件事同时发生"(anchor theft), 而是"一件事(L4-004)改变了另一件事
      (DED-022 的层间冲突)的运作环境"。标注为【真正的复合锚点】。

      Anchor 3 (平台资本主义→"向外包"): 声称 L4-004+L4-003 交互——"数字平台用算法替代
      传统国家/工会的劳动保障→市场/网络'填补'了国家制度供给的滞后(L4-003 锁定效应)"。
      审查裁决: 逻辑链是 L4-003(国家制度锁定滞后→有缺口) + L4-004(数字使市场/网络
      可填补缺口) → 市场/网络填补。这是先有缺口(因锁定)、后有填补(因技术), 两者是
      时序先后关系, 不是机制交互。标注为【链式关系, 非交互】。可接受。

      Anchor 4 (苏格兰/加泰罗尼亚→"向下放"): 声称 L4-004+DED-003+DED-022 交互——
      三条父推论在次国家分离主义中共存。
      审查裁决: 三条机制各自独立运作: L4-004 降低自组织成本, DED-003 解释为何国家层
      凝聚减弱(外竞退→内聚沉), DED-022 解释为何次群体对统一标准有公平异议。三条机制
      在同一个案例中同时可见, 但它们是并行运作, 不互相依赖。标注为【并行机制共现,
      非交互】。可接受。

      Anchor 5 (数字威权→预测(ii)张力锚): 声称 L4-002+L4-004 交叉——"某大国的人脸识别+
      社会信用系统+网络审查→用数字监控维持低轮替+低独立政体的稳定"。
      审查裁决: 落在 L4-002 的"威权稳定区"和 L4-004 的"监控成本暴跌"的交叉格。
      两父推论各自覆盖现象的不同侧面。confidence 诚实标为 weak。可接受。

      总评: 五个锚点中, Anchor 2(社交媒体→公平冲突前台化)是唯一的真正复合锚点(一个机制
      改变了另一个机制的运作条件)。其余四个是必要条件合取/链式关系/并行共现——它们涉及
      多条父推论, 但交互证据薄弱。L4-005 在 composite_specific 分析中已诚实标注了各锚点
      的机制结构, 未伪装交互。通过但复合证据基础偏薄。

  16_interaction_measurement_gap:
    verdict: needs_revision
    severity: required
    note: |
      L4-005 的复合输出变量 functional_differentiation_degree 的操作化承认:
      "功能分化度的测量可分解为各父推论测量的组合"——四个功能域各自对应一个父推论。
      真正不可分解的复合测量是"四个功能域的【同步位移方向】"。

      问题: "同步位移方向"如何操作化? 如何区分以下两种情况:
      (a) 四条独立趋势同时发生(四维并行)——经济调节在向上走(与 L4-001 一致)、
          社会福利在向外走(与 L4-004 一致)、文化再生产在向下走(与 L4-004 一致)、
          暴力终裁在向内收(与 DED-003 一致)——但四者之间无因果交互, 仅是
          "四条独立因果链同时运作"。
      (b) 真正的复合交互——四个维度的位移【互相构成条件】——如经济调节的向上移交
          (L4-001)使国家财政收入减少→加速社会福利向外转移(L4-004 的技术可能被
          财政压力激活)→形成正反馈循环。

      L4-005 当前的测量方案只能观测到 (a)——四个维度的各自位移——然后将它们并列为
      "功能分化"的证据。但要证明 (b)(真正的复合交互), 需要展示维度之间的因果关系:
      维度 A 的位移【导致】维度 B 的位移, 而非两者独立发生。

      当前方案中的 composite_measurement_independence 承认了这个问题但未给出操作化
      方案。"同步位移方向"与"四个独立趋势同时发生"这两个构念在当前测量方案下不可区分。

      这直接关联到 #12(平凡合取)和 #13(涌现缺失): 如果无法操作化区分"四条独立趋势
      同时发生"与"交互产生的不可分解的复合输出", 那么 L4-005 的涌现主张在测量层面
      就无法兑现。

      修正要求: (a) 为"同步位移方向"给出一个额外判据——不是看四个维度"是否都在位移",
      而是看"维度 A 的位移是否以维度 B 的位移为条件或显著放大了维度 B 的位移"。
      (b) 或者诚实降级: 承认当前测量的复合性在于"将四条独立趋势综合描述为同一系统
      的多维位移", 而非"测量到不可分解的交互产物"。前者仍有理论价值(综合描述),
      但应诚实标注其认识论层级。

  17_claim_type_mismatch:
    verdict: needs_revision
    severity: required
    note: |
      claim_type = "trajectory_prediction" 声称对民族国家功能的未来轨迹做预测。
      这一类型要求纵向/序列证据——展示功能分化度随时间的变化趋势。

      L4-005 提供的证据:
      - 五个锚点(EU/社交媒体/平台资本主义/苏格兰-加泰罗尼亚/数字威权): 全都是横截面
        快照——展示当前存在的现象, 不展示趋势。
      - "反例"分析(英国脱欧): 虽涉及时间维度("脱欧后英国..."), 但仅是短期观察(2016-2020),
        远不足以检验"50 年尺度上功能分化度整体上升"这一长时段预测。
      - falsifiability 节要求 50 年尺度的纵向数据——但当前未提供任何超过 30 年的
        功能分化趋势数据。

      这不是致命问题——"trajectory_prediction"的本质就是关于未来的预测, 当前不可能有
      完整的未来数据。但应在 methodological_caveat 中诚实声明:
      (a) 本推论是 future-oriented 的结构预测(基于当前机制的趋势外推), 其证据策略
          是"当前锚点展示机制已在运作 + 机制逻辑推导未来方向", 而非"已有完整纵向数据
          拟合轨迹"。
      (b) 50 年尺度的证伪检验需未来数据, 当前不可完成——这意味着本推论在当下不可被
          最终验证, 只能被"机制链断裂"(某条父推论被推翻)或"中期趋势反向(20-30 年
          尺度上功能重新集中)"所削弱。
      (c) trajectory_prediction 的验证分两阶段: 第一阶段(当前可检): 机制链的各环节
          是否已在运作(锚点检验); 第二阶段(未来可检): 50 年尺度上功能分化度是否上升
          (纵向检验)。

      修正要求: 要么 (a) 在 methodological_caveat 中明确上述三点, 将 claim_type 的
      证据标准与当前可得的证据类型对齐; 要么 (b) 将 claim_type 调整为更诚实的标签如
      "mechanism_based_projection" 或 "structural_trend_prediction", 以标明其证据
      策略是机制推导+当前锚点而非已完成的纵向追踪。

# ============================================================
# 反例猎捕
# ============================================================

counterexample_hunt:
  methodology: |
    按 L4 评分卡要求, 猎两类反例:
    (1) 某父推论不成立 → L4-005 天花板受损
    (2) 父推论都成立, 但交互不产生 L4-005 预测的结果(重点——L4 特有猎法)

  type1_parent_failure:
    cases:
      - id: PF-1
        label: "L4-001 为 verified*——瑞士 unresolved 向上传播"
        description: |
          L4-001 的 verified* 源于 DED-003 的瑞士案例 unresolved——
          瑞士(1815-至今)在无外部军事竞争的条件下维持了强非人格化制度,
          可能构成"内部合法化替代外部竞争"的案例。如果 DED-003 的外部竞争必要性被削弱,
          L4-001 的"无竞争→退化"预测松动→L4-005 的"向上交是不可逆结构趋势"也松动。
          这不是 L4-005 本身的反例, 而是其父推论的未解决问题向上传播。
        status: unresolved_parent_problem
        severity: high
        note: "已在 #14(弱父前提)中标注。L4-005 需在置信度中吸收此不确定性。"

  type2_interaction_failure:
    cases:
      - id: CE-1
        label: "数字威权国家在低税基跨国+强锁定条件下维持全包+稳定——填充招牌空格?"
        description: |
          考虑一个满足以下条件的政体:
          (1) 数字技术高采用(监控/人脸识别/社会信用系统广泛部署);
          (2) 税基跨国度=低(经济相对封闭, 资本管制, 数字主权使国内平台自循环);
          (3) 透明度=低(数字监控维持低有效透明度, 防火墙+审查使信息泄露可控);
          (4) 锁定=强(工业化时期锁定的国家主导型制度配置抗拒改变);
          (5) 功能分化度≈0(国家统管经济/社会/文化/安全, 灰色市场被压制而非合法化);
          (6) 长期(>30年)未经历制度崩溃。

          此配置落在格G[税基=低, 透明=低, 锁定=强]→"维持全包(压力下)"。
          按 L4-005 自身的 multi_parent_cells, 此格并非空格——它预测"全包可维持但
          有压力"而非"必然分化"。但这与招牌空格的【不加限定的表述】("数字普及+零分化
          +长期稳定=空")之间存在张力。

          攻击点: 如果格G 的全包国家在 30+ 年尺度上确实维持了稳定且功能不分化, 则:
          (a) 招牌空格(不加限定版)被填充——L4-005 需要承认"数字威权+经济封闭+强锁定"
              可以构成"数字普及+零分化+长期稳定"的活案例;
          (b) 但 L4-005 自身在 multi_parent_cells 中已为格G 做了免责("维持全包, 压力下"),
              所以此案例不严格证伪 L4-005——它落在 L4-005 已预测的格内。
          (c) 问题出在招牌空格的【表述过强】——空格应明确参数限定, 而非给人"只要数字
              普及, 零分化就不可能稳定"的印象。
        status: near_miss
        severity: high
        required_response: |
          限定招牌空格的参数条件(见 #2 和 #13)。诚实区分"空格在所有数字普及场景下
          强制为空"(过宣称)和"空格在高税基跨国+高透明+强锁定条件下强制为空"(精确)。

      - id: CE-2
        label: "英国脱欧——'收回主权'是功能分化的逆转还是振荡?"
        description: |
          L4-005 自身在 counterexamples 中分析了英国脱欧, 结论是"不是反例——脱欧是在
          功能分化的不同配置之间切换, 而非不分化"。论证: 脱欧后英国仍需双边 FTA(另一种
          "向上交"), 同时推进 levelling up(向下放)和继续依赖全球市场(向外包)。

          审查评估: L4-005 的分析自洽。英国脱欧确实展示了"向上交"的可逆性(从多边 EU
          回退到双边 FTA 网络), 但这是"交多少、交给谁"的变量范围内的摆动, 而非"完全不交"。
          但诚实标注: 如果脱欧后英国的向上交程度持续下降(双边 FTA 数量/深度不如 EU 成员
          时期), 且伴随其他方向的分化也减弱(如重新国有化、收紧边界), 则可能构成"功能
          重新集中"的反向趋势。当前数据不足以判定——需 20+ 年观察。
        status: not_a_counterexample_yet
        severity: moderate
        note: "L4-005 已将短期振荡(<10年)排除在射程外, 英国脱欧在 excluded_outcomes 范围内。"

      - id: CE-3
        label: "父推论都成立, 但交互不产生 L4-005 预测——'新的集中'替代'功能分化'"
        description: |
          构造案例: 数字技术高采用+高税基跨国的两个或多个国家, 选择将功能【向上集中】
          到一个新的超国家实体(如"欧洲合众国"式的全面政治联盟), 而非功能分化。

          此时:
          - L4-001 成立(税基跨国→让权方向位移) ✓
          - L4-002 成立(透明度→政体稳定条件改变) ✓
          - L4-003 成立(锁定在超国家层面被重新配置) ✓
          - L4-004 成立(数字技术使超国家协调可行) ✓
          但四条父推论都成立, 结果却是"向上集中"(世界政府/超国家联邦)而非"功能分化"
          (四向分散)。

          攻击点: L4-005 的核心主张是"四个方向同时拉→功能分化"。但如果数字技术+税基
          跨国化实际上推动的是"向上集中"(将所有功能移交到更高层级), 则四条父推论都成立
          但结果不是"分化"而是"集中"——构成 L4 专有反例。

          L4-005 的回应: falsifiability (c) 已预埋此反例——"高数字采用+高税基跨国度的
          政体系统性走向了'新的集中'(如全球数字帝国/世界政府)而非'功能分化'→证伪'分化'
          方向"。且 L4-005 在 discriminant_validity 中与 Rodrik 三难困境做了区分:
          Rodrik 预测"三选二"的三种静态解, L4-005 预测持续演化的四向分化。

          审查评估: L4-005 已预埋此反例并给出了证伪路径。当前现实中, EU 的进一步联邦化
          (财政联盟/防务联盟)和全球数字平台的"准国家"化可以看作"向上集中"的苗头——
          但尚未达到"替代功能分化"的程度(暴力终裁+终局规则制定权仍在国家手中)。
          此反例保持开放猎捕。
        status: counterexample_hunt_open
        severity: high
        note: "已在 falsifiability (c) 中预埋。若未来出现'向上集中'替代'四向分化'的
          系统性趋势→L4-005 核心被证伪。"

  hunt_summary: |
    未猎到 scope 内干净击杀(即"四条父推论机制都成立, 且交互也不产生 L4-005 预测
    的结果"的明确案例)。

    猎到一个近失案例(CE-1: 数字威权+经济封闭+强锁定→可能填充不加限定的招牌空格)
    和一个开放猎捕案例(CE-3: "向上集中"替代"功能分化")。

    CE-1 的核心教训: 招牌空格需要参数限定, 当前的不加限定表述给了过强的印象。
    CE-3 的核心教训: 四条父推论都成立不必然导向"四向分化"——"向上集中"也是一个
    逻辑上可能的路径, L4-005 需要更具体地论证为什么"四向分化"比"向上集中"更可能。

# ============================================================
# 与 DED-004 / DED-007 的对照
# ============================================================

non_recurrence:
  ded004_check:
    verdict: pass
    note: |
      DED-004 的死因: 条件双重身份(自变量同时也是被预测量) + 事后用结果反推条件。
      L4-005 未犯此病: 四个自变量(数字采用度/税基跨国度/透明度/锁定度)各有独立
      测量方案且带硬约束, 与复合输出(功能分化度)在不同测量轴上。anti-talisman_clause
      封堵了"遇到疑似反例时事后调整自变量估值"的循环。通过。

  ded007_check:
    verdict: pass
    note: |
      DED-007 的死因: 三个假说各自吸收各自的案例, 缺乏可被共同证据裁决的争议点。
      L4-005 未犯此病: 给出了四个明确的可证伪条件(a)-(d), 共享同一组可独立测量的变量,
      可被共同证据裁决。通过。

# ============================================================
# 裁决
# ============================================================

verdict: needs_revision
verdict_note: |
  L4-005 有真实的理论勇气和贡献——将四条独立发展、各自覆盖不同历史现象的 L4 推论
  同时应用于"民族国家未来"这一共同对象, 预测功能分化这一多维位移格局。这一"合成"
  本身是四条 L4 父推论各自做不到的: L4-001 管税基-让权、L4-002 管政体稳定、
  L4-003 管制度锁定、L4-004 管技术可行域——没有一条单独能说出"民族国家未来会怎样"。

  L4-005 的非平凡内容有三层:
  (a) 合取层: 四条独立机制的并行压力在民族国家这一共同对象上产生综合效果→四向分化。
      这是合取(conjunction), 不是交互(interaction), 但有理论价值——"把四条独立
      L4 推论放在一起看"本身是新贡献。
  (b) 交互层: prediction (iii) 的 L4-003+L4-004 机制咬合——数字信息流侵蚀锁定的
      维护条件→滞后期缩短→合法性危机替代革命。这是真正的 L4 级交互。
  (c) 空格层: 招牌空格"数字普及+零分化+长期稳定=空"需要多条父推论合力才能推出——
      但空格被过宣称(未限定参数条件)。

  不判 rejected 的理由: (a) 至少有一个真正的机制交互(prediction iii), 不是纯平凡合取;
  (b) 四条父推论同时应用于同一对象有真实的理论综合价值; (c) 问题本质是操作化不足+
  诚实标注不够, 非逻辑塌陷——与 DED-004 的结构性死病不同; (d) 给出了可定向修复的清单。

  判 needs_revision: 需 5 条 required 修订 + 2 条 should 修订后才能进入 round 2。

required_fixes:
  - id: RF-1
    priority: required
    title: "限定招牌空格的参数条件——防止过宣称"
    description: |
      当前招牌空格表述:"数字技术完全普及+国家功能完全不分化(仍然全包)+长期稳定→
      预测为空"给人"只要数字普及, 零分化就不可能稳定"的印象。

      格G 的分析表明, 当税基跨国=低 AND 透明=低(数字威权) AND 锁定=强时, 空格不
      被强制——数字威权国家可在不分化的情况下维持(高压)稳定。

      修正要求: 将招牌空格陈述修改为参数限定版:
      "在税基跨国度高 AND 透明度被迫高 AND 锁定强的条件下, 数字普及+零功能分化+
      长期稳定预测为空"。或保留原表述但补加诚实声明:"此空格在低税基跨国+数字威权
      维持低透明度+强锁定的参数组合中不必然为空(可稳定在'全包但有压力'的配置)"。
    affects: statement (Prediction v), emergence_demonstration.multi_parent_cells 中的招牌空格行

  - id: RF-2
    priority: required
    title: "诚实区分合取与交互——调整涌现修辞的层级"
    description: |
      L4-005 当前将"四向分化"整体表述为四条 L4 推论的交互涌现产物。"四个维度的位移
      方向凑在一起, 指向同一个结论: 功能分化"——这是合取, 不是交互。

      真正的交互仅存在于 prediction (iii): L4-003 的锁定机制被 L4-004 的数字信息流
      侵蚀→滞后期缩短→合法性危机替代革命。

      修正要求:
      (a) 在 emergence_demonstration 中明确区分"合取级涌现"(四向是四条独立机制的
          并行压力之和——薄涌现)与"交互级涌现"(prediction iii 的机制咬合——厚涌现)。
      (b) 将"涌现论证"的重心从"四个方向凑在一起"(weight of numbers)转移到
          prediction (iii) 的机制交互(quality of interaction)上。
      (c) 降低"涌现"修辞的烈度——诚实标注"四条独立机制在民族国家这一对象上的并行
          运作产生综合效果", 而非"四条机制交互产生不可分解的新质"。
      (d) 在 multi_parent_cells 逐格标注中, 区分"合力类型": 标注每个格是
          conjunction(多压力并行叠加)还是 interaction(机制互相修改运行条件)。
    affects: statement (Emergent property), emergence_demonstration (novelty, multi_parent_cells), derivation.steps.3

  - id: RF-3
    priority: required
    title: "显式处理 L4-001 verified* 向上传播——标注置信度天花板"
    description: |
      L4-001 为 verified*(非 verified), 其 primary_suspect(DED-003 外部竞争必要性)
      直接关联 L4-005 的 primary_suspect("向上交"方向)。L4-005 已在 falsification_trace
      中诚实提及, 但应在更显要位置标注。

      修正要求:
      (a) 在 statement 或 derivation 首部添加置信度声明:"本推论因 L4-001 为 verified*,
          置信度天花板受其约束。'向上交'这一预测方向对 L4-001 的依赖性最强——
          若 L4-001 被降级, L4-005 的预测(i)和(iv)中与'向上交'相关的部分需修订。"
      (b) 在 primary_suspect 中量化: 如果 L4-001 的"外部竞争→让权"机制被内部合法化
          替代路径削弱, L4-005 的"向上交是不可逆结构趋势"需限缩为"向上交是税基跨国化
          的结构推力方向, 但政治反弹的振荡幅度可能大到使向上交可逆"。
    affects: statement, falsification_trace.primary_suspect

  - id: RF-4
    priority: required
    title: "操作化'同步位移方向'——区分四条独立趋势与真正的复合交互输出"
    description: |
      当前 composite_measurement_independence 承认"真正不可分解的复合测量是四个功能域
      的同步位移方向", 但未给出区分"四条独立趋势同时发生"与"交互产生的不可分解复合输出"
      的操作化方案。

      修正要求: 新增至少一个判据来区分:
      (a) 时序判据: 四个维度的位移是否在同一时间窗口内启动(同步性)?
          还是各有独立的时间表(异步性)?
      (b) 因果判据: 维度 A 的位移是否【导致或显著放大】维度 B 的位移?
          如: 经济调节的向上移交(L4-001)→减少国家财政收入→加速社会福利向外转移
          (L4-004)→形成跨维度正反馈。
      (c) 反事实判据: 若移除某维度的位移, 其他维度的位移是否仍以同等幅度发生?
          若各维度独立→合取; 若维度间互相依赖→交互。

      如果当前无法提供上述判据的操作化(因为需要纵向数据), 诚实标注:"当前操作化仅能
      测量四个维度的各自位移并综合描述为功能分化, 无法在测量层面区分'四条独立趋势
      同时发生'与'交互产生的不可分解复合输出'。prediction (iii) 的交互主张目前仅
      在机制层面论证, 尚未在测量层面操作化。"
    affects: operationalization.functional_differentiation_degree.composite_measurement_independence

  - id: RF-5
    priority: required
    title: "对齐 claim_type 与证据标准——添加 methodological_caveat"
    description: |
      claim_type = "trajectory_prediction" 要求纵向/序列证据, 但当前锚点均为横截面
      快照。这不是致命问题——关于未来的轨迹预测本质上无法有完整的未来数据——但应诚实
      标注证据策略。

      修正要求: 新增 methodological_caveat 节, 声明:
      (a) 本推论是 future-oriented 的结构预测, 证据策略 = 当前锚点展示机制已在运作 +
          机制逻辑推导未来方向, 而非已有完整纵向数据拟合轨迹。
      (b) 验证分两阶段: 第一阶段(当前可检)——机制链各环节是否已在运作(锚点检验);
          第二阶段(未来可检)——50 年尺度上功能分化度是否上升(纵向检验, 当前不可完成)。
      (c) 在当前阶段, 可被"机制链断裂"(某条父推论被推翻)或"中期趋势反向"(20-30 年
          尺度上功能重新集中)所削弱, 但不可被最终验证或最终证伪。
      (d) 或者将 claim_type 调整为更诚实的标签如 "mechanism_based_projection" 或
          "structural_trend_prediction"。
    affects: claim_type, 新增 methodological_caveat

should_fixes:
  - id: SF-1
    priority: should
    title: "将 prediction (iii) 提升为涌现论证的核心——而非配角"
    description: |
      当前 prediction (iii) 被列为五条预测中的一条, 与其重要性不成比例。prediction (iii)
      是 L4-005 中唯一展示真正机制交互的命题(L4-003 的锁定被 L4-004 的数字侵蚀→
      滞后期缩短→合法性危机替代革命)。应将 prediction (iii) 提升为"涌现的核心证据",
      在 emergence_demonstration 中突出其机制咬合结构。
    affects: emergence_demonstration, prediction 排序

  - id: SF-2
    priority: should
    title: "为格G 提供更诚实的分析——'全包国家在数字条件下可维持'的边界"
    description: |
      格G[税基=低, 透明=低, 锁定=强]是 L4-005 最弱的预测格——它承认数字威权+经济封闭
      +强锁定条件下全包国家可维持(有压力)。L4-005 应在此格中明确讨论:
      (a) 在什么条件下格G 的"全包+稳定"会过渡到"不稳定"或"被迫分化"?
      (b) 格G 的存续对 L4-005 整体主张的影响——如果格G 的案例(数字威权+经济封闭)
