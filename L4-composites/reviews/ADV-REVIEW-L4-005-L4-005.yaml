id: ADV-REVIEW-L4-005
target: L4-005
date: 2026-07-14
type: adversarial_review
layer: L4-composites
round: 1
reviewer: "独立对抗审查者 (全新上下文, round 1)"
人话摘要: "L4-005 有真实的理论勇气——把四条独立发展的 L4 推论同时应用于'民族国家未来'这一共同对象, 预测功能分化这一多维位移格局。但核心弱点有五: (1) 四向分化主要是四条父机制的独立并行压力之和(合取)而非机制交互; (2) 招牌空格'数字普及+零分化+长期稳定=空'在低税基跨国+弱锁定参数组合下不被强制为空——空格被过宣称; (3) 弱父前提(L4-001 verified*)向上传播, 而'向上交'恰是 primary_suspect; (4) claim_type=trajectory_prediction 但锚点多为横截面快照, 缺纵向轨迹证据; (5) 复合输出变量(四向同步位移)的操作化未区分'四条独立趋势同时发生'与'真正的交互合力产物'。判 needs_revision, 给出 5 条 required 最小修复清单。"

# ============================================================
# 标准红旗 (1-10) — 逐条攻击
# ============================================================

standard_red_flags:
  1_brick_conclusion:
    verdict: pass
    note: |
      L4-005 的核心命题——"民族国家在四条 L4 推论的合力下走向功能分化(向上/向下/向外/向内)"——
      不在任何单条父推论的结论中:
      - L4-001: 说"税基类型×外部竞争→国家形态分叉(制度型/采掘型/退化)"。不说"已有民族国家
        的功能分化方向", 不说"让权对象从国内议会转移到国际制度"。
      - L4-002: 说"轮替度×独立度×透明度→四区稳定相图"。不说"所有政体都走向功能分化",
        不说分化后的功能配置。
      - L4-003: 说"Dunbar 关口初始条件被制度化冻结→锁定迟滞"。不说"锁定在数字时代被信息
        流动侵蚀", 不说"张力以合法性危机而非革命释放"。
      - L4-004: 说"IT 成本数量级跃迁→社会复杂度相变"。不说"相变的具体归宿是功能分化
        (而非新的集中)", 不说"数字技术同时使四向分化都不矛盾地成为可能"。
      无单条父推论包含"民族国家功能分化的四向位移格局"。通过。

  2_cell_empty_prediction:
    verdict: needs_revision
    severity: required
    note: |
      L4-005 的招牌空格:"数字技术完全普及+国家功能完全不分化(仍然全包)+长期稳定→预测为空"。

      审查发现:【该空格未被全部参数组合强制】。

      逐条件检验空格是否被强制:
      (a) 若税基跨国度=低(L4-001 的向上推力弱): 国家在经济调节维度无"被迫向上交"的压力 →
         可以维持国家级经济调节, 不分化 → 空格不被 L4-001 强制。
      (b) 若透明度=低(数字威权以监控维持低透明, 落在 L4-002 的"数字威权=低独立+中高透明
         +高监控"配置): 威权政体可通过数字监控维持全包国家的稳定 → L4-002 自身承认
         "数字威权可能构成新稳定区" → 空格不被 L4-002 强制。
      (c) 若锁定=弱/已解冻(L4-003 的锁定迟滞不成立): 制度配置可随数字条件平滑调整而不分化 →
         空格不被 L4-003 强制。
      (d) L4-004 单独不强制任何结果——它只说技术可行域扩张, 不强制分化或集中。

      空格被【真正强制为空】仅当: 税基跨国=高 AND 透明度被迫=高 AND 锁定=强 同时满足——
      即四条父推论的机制同时以"最不利全包国家"的配置运作时。但 L4-005 的招牌空格陈述未做
      此参数限定, 给人"只要数字普及, 零分化+长期稳定就不可能"的印象——这是过宣称。

      修正要求: 空格陈述须明确参数条件——"在税基跨国度高 AND 透明度被迫提高 AND 锁定强
      的条件下, 数字普及+零分化+长期稳定预测为空"。或诚实标注空格在弱锁定+低税基跨国的
      参数组合中【不必然为空】(可稳定在"数字化的全包国家"配置)。

  3_measurement_orthogonal:
    verdict: pass
    note: |
      四个自变量各有独立测量方案且带硬约束:
      - digital_technology_adoption: 三维度合成(存储/传输/检索成本), 硬约束"不得用组织形态反推"
      - tax_base_transnationality: 三维度(FDI/数字服务税/BEPS), 硬约束"不得用协定反推"
      - digital_transparency_level: 三维度(泄露成本/信息获取/管控衰减), 硬约束"不得用政体稳定反推"
      - institutional_lock_in_degree: 三维度(条件变化/调整时滞/多层冲突频率), 硬约束"不得因未调整反推锁定"
      被预测量 functional_differentiation_degree 由四个功能域独立测。
      轴正交。通过。

  4_excluded_outcomes:
    verdict: pass
    note: |
      三个排除结果均有事前可测渠道:
      - "纯印刷时代社会": 按 digital_technology_adoption 三维度独立测
      - "数字技术尚未普及的社会": 同上
      - "短期(<10年)反向摆动": 按时间窗事前判定
      不存在"事后因结果调整射程"的结构性漏洞。通过。

  5_classification_bin_match:
    verdict: pass
    note: |
      功能分化度按四个功能域在"国家独占↔多元分配"谱系上的连续量测量, 非过度分档。
      分档仅用于笛卡尔积中的理想型标注(完全分化/部分分化/几乎不分化), 底层为连续量。
      通过。

  6_anti_talisman:
    verdict: pass
    note: |
      L4-005 有显式 anti_talisman_clause, 四条硬约束:
      - 不得因"功能在分化"倒推"数字技术普及"或"税基跨国化"
      - 不得因"功能未分化"倒推"数字未到位"或"锁定太强"
      - "锁定强"须由制度调整时滞独立测
      - "功能分化度"须由四个功能域实际分配状态独立测
      且特别封堵了 L4 合成层面的典型循环:"不得遇到疑似空格填充案例时, 事后调低数字采用
      估值或调高锁定估值来消化"。措辞硬朗, 覆盖了 DED-004 循环的 L4 合成版。通过。

  7_real_world_anchor_fact_check:
    verdict: pass
    note: |
      锚点事实基本准确:
      - EU 作为"向上交"锚点: 成员国向 ECB/EC/ECJ 移交货币政策/贸易/竞争政策, 与 L4-001
        的"让权方向随税基地理分布而变"机制一致。事实正确。
      - 社交媒体→多层公平冲突前台化: 社交网络使家族/职业/国家三层的公平标准在同一屏幕
        碰撞, 机制描述合理。
      - 平台资本主义→"向外包": 数字平台用算法替代传统国家/工会的劳动保障和职业规范功能,
        事实正确。
      - 苏格兰/加泰罗尼亚→"向下放": 数字技术降低分离主义组织成本, 事实正确。
      - 数字威权→预测(ii)张力锚: 人脸识别+社会信用+网络审查的描述准确, confidence 诚实标为 weak。
      无事实性错误。通过。

  8_definition_vs_prediction:
    verdict: pass
    note: |
      "数字技术高采用+税基跨国化+透明度被迫提高+锁定强→功能分化"是可证伪的预测,
      非隐藏定义。falsifiability 节给出了四个可独立检验的证伪路径(a)-(d)。
      条件句不是定义。通过。

  9_enumeration_exhaustiveness:
    verdict: pass_with_concern
    note: |
      "四向分化"(向上/向下/向外/向内)用空间隐喻声称穷尽——任何功能的分配方向只能是这四个之一。
      这在逻辑上接近定义性穷尽(空间方向的完备集), 而非经验枚举。"四向同时位移"才是经验主张。
      concern 较轻——只要不把"四个方向"的枚举穷尽作为核心经验贡献, 仅将其作为分析框架即可。
      通过但建议诚实标注: 四向是分析框架(逻辑上穷尽), 四向同时位移是经验主张(可证伪)。

  10_primary_suspect:
    verdict: pass
    note: |
      primary_suspect 定位合理:"向上交"的方向和速度——政治反弹(民族主义/脱欧/贸易战)
      可能使分化方向振荡甚至逆转。这是最可见的逆势现象, 且依赖 L4-001(verified*)的税基
      跨国逻辑→让权方向位移——L4-001 的 verified* 状态向上传播, 使此腿确为最弱。

      secondary_suspect:"数字威权可能以高监控+中透明维持新稳定区"——L4-002 自身也承认
      这个可能性(数字威权=低独立+中高透明+高监控→新稳定区), 定位合理。

      unlikely_suspect: L4-004 的物理技术事实(存储/传输/检索成本确实崩塌)和 L4-003 的
      锁定效应存在性——单体稳定性高, 定位合理。

      诚实声明了 L4-001 verified* 向上传播对 L4-005 置信度天花板的影响。通过。

# ============================================================
# L4 专属红旗 (11-17) — 逐条攻击
# ============================================================

l4_exclusive_red_flags:
  11_spectator_brick:
    verdict: pass
    note: |
      逐一移除每条 L4 父推论, L4-005 的核心结论无法成立:

      - 移除 L4-001: 失去"税基地理分布→让权方向"机制 → "向上交(超国家治理)"失去核心驱动力。
        L4-004 可单独给"向外"和"向下"的技术可能, L4-002 可单独给"必须变"的压力, 但都不说
        "为什么是向上交(超国家)而非别的安排"。不冗余。

      - 移除 L4-002: 失去"透明度上升→威权稳定区侵蚀"机制 → 功能分化退化为"民主国家自己
        选的路线"而非"所有政体结构必然"。威权国家可维持全包国家——L4-002 提供了"不分化
        在物理上不可维持"的关键论证。不冗余。

      - 移除 L4-003: 失去"锁定迟滞→张力积累"机制 → 功能分化的动力学丢失, 退化为静态的
        功能重新分配图。"危机驱动"的阶梯式进程、"合法性危机而非革命"的释放形式——均依赖
        L4-003。不冗余。

      - 移除 L4-004: 失去"技术可行域扩张"机制 → "向外包"和"向下放"失去技术基础。功能分化
        退化为"向上交+向内收"的二分——这正是传统超国家治理理论(Rodrik)的射程, 不是 L4-005
        的独有主张。不冗余。

      四条 L4 父推论每一条都承载不可替代的机制贡献。无观众砖。

      但诚实标注: L4-001 和 L4-004 在"技术使跨国交换可行→税基跨国化"这一环上存在概念交叠——
      L4-001 的税基跨国化(当前自变量的扩展)部分依赖 L4-004 的数字技术条件。这不使任一条
      成为观众砖(各有不同的核心机制: L4-001 的核心是"让权方向随税基分布而变", L4-004 的
      核心是"技术可行域扩张"), 但说明四条 L4 父推论在概念空间并非完全正交。

  12_trivial_conjunction:
    verdict: needs_revision
    severity: required
    note: |
      【本轮审查的核心战场之一】

      L4-005 的核心结论"民族国家功能分化——向上交、向下放、向外包、向内收"的结构分析:

      四向各自的机制来源:
      - "向上交(超国家)": L4-001 的税基跨国化→让权方向从国内议会位移到国际制度。
        这是 L4-001 单独机制的延伸应用。
      - "向下放(次国家)": L4-004 的数字使小群体自组织可行 + DED-022 多层冲突使统一国标
        前提崩解。L4-004 提供技术可能, DED-022 提供需求。
      - "向外包(市场/网络)": L4-004 的数字降低外部制度替代成本 + L4-003 锁定导致国家制度
        供给滞后→市场填补空缺。L4-004 提供技术可能, L4-003 提供需求缺口。
      - "向内收(核心独占)": DED-003 的外部竞争机制 + DED-012 坐寇逻辑→暴力终裁+终局规则
        仍是国家独占。这是 L3 父推论的直接应用。

      四向合起来 = "功能分化"——这是四条独立机制的并行运作。每条机制在自己的领域独立产生
      自己的压力方向, 四个压力方向同时作用于同一个系统(民族国家), 合起来指向功能分化。

      这本质上是【合取】(conjunction)——四条独立机制各自发力, 合起来产生综合效果——
      类似于四个人从四个方向同时推一个箱子。箱子移动的方向和速度是四人合力决定的,
      但这是力的矢量加法, 不是"交互产生不可分解的新现象"。

      非平凡合取的部分:
      prediction (iii): "锁定(L4-003)+数字相变(L4-004)的交互: 锁定使公平制度抗拒适应,
      数字相变使锁定更难维持(因为信息流动侵蚀'冻结'所需的信息控制)→制度滞后期缩短但仍
      存在→张力以更频繁的'合法性危机'而非'革命'形式释放"。

      这是本推论中最接近真正机制交互的命题:
      - L4-003 单独: 锁定→长滞后期→张力积累→革命(大爆发)
      - L4-004 单独: 数字→信息流动→不说锁定
      - 两者交互: 数字侵蚀锁定的信息控制基础→滞后期缩短→张力以"合法性危机"(小爆发、
        高频率)而非"革命"(大爆发、低频率)释放

      这一预测改变了 L4-003 预测的【结果类型】(从革命变为合法性危机), 而非仅改变结果
      的【量级】。这是真正的交互效应——一个父推论的机制(L4-004 的信息成本崩塌)修改了
      另一个父推论的机制(L4-003 的锁定维护条件)的运作方式。

      裁决: L4-005 既有大量合取内容(四向各自独立), 也有至少一个真正的交互命题
      (prediction iii)。合取内容有理论价值——将四条独立发展的 L4 推论同时应用于同一
      对象(民族国家未来), 这一"合成"本身是新贡献——但它不应被包装为"涌现"。交互内容
      (prediction iii)才是真正的 L4 级涌现。

      修正要求: (a) 诚实区分合取部分(四向是四条独立机制的并行压力之和)与交互部分
      (prediction iii 是 L4-003 和 L4-004 的机制咬合); (b) 将"涌现"论证的重心从
      "四个方向凑在一起"(合取)转移到 prediction iii 的机制交互上;
      (c) 招牌空格(需要至少两条父推论合力→空格为空)虽然是合法的多父逐格判空,
      但应诚实标注其推理结构更接近"多条独立压力叠加"而非"机制交互产生第三方向"。

  13_emergence_missing:
    verdict: needs_revision
    severity: required
    note: |
      【本轮审查核心产出——独立多父逐格判空归属分析】

      第一步: 提取每条 L4 父推论的核心自变量与机制

      L4-001 (国家形成轨迹):
        核心 IV: tax_base_type(商业流/农业存量) × external_competition(可信/无)
        核心机制: "商业税基+外部竞争→让权换税→竞争制度型国家"
        L4-005 延伸: tax_base_transnationality → 让权方向从国内议会位移到国际制度
        即: 税基的地理分布决定让权的【方向】

      L4-002 (政体稳定相图):
        核心 IV: elite_rotation × adjudicator_independence × transparency
        核心机制: "低轮替+低独立+高透明→最不稳定区"
        L4-005 延伸: 数字使透明度被迫提高→威权稳定区(低透明)被侵蚀
        即: 透明度的技术性上升改变政体稳定条件

      L4-003 (制度共演锁定):
        核心 IV: kinship_at_lock-in × scarcity_at_lock-in × institutionalization
        核心机制: "Dunbar 关口制度化→初始条件被冻结→多层互锁→抗拒变化"
        L4-005 延伸: 数字信息流侵蚀"冻结"所需的信息控制→锁定更难维持
        即: 技术侵蚀锁定的维护机制

      L4-004 (IT→社会形态):
        核心 IV: information_technology_cost(口头/文字/印刷/数字)
        核心机制: "IT 成本数量级跃迁→四条天花板共移→社会复杂度相变"
        L4-005 延伸: 数字使组织可更平(去中层化)也可更深(全球监控), 使信任替代多元化
        即: 技术扩大可行域, 为功能分化提供技术可能

      第二步: 构建 L4-005 核心场景的笛卡尔积

      场景: 数字=高(L4-004 的数字相变已发生——这是 L4-005 的射程前提)
      轴1: 税基跨国度(高/低) — L4-001 延伸
      轴2: 透明度(高/低) — L4-002 延伸(注意: 数字条件下"低透明"指数字威权以监控维持
           低有效透明度)
      轴3: 制度锁定度(强/弱) — L4-003 延伸
      被预测量: 功能分化度 + 稳定性

      ┌──────────────┬──────────────────────┬──────────────────────┬──────────────────────┐
      │ 数字=高      │ 税基=高+透明=高      │ 税基=高+透明=低      │ 税基=低+透明=高      │
      │              │                      │ (数字威权)           │                      │
      ├──────────────┼──────────────────────┼──────────────────────┼──────────────────────┤
      │ 锁定=强      │ 格A: 高张力→危机驱动 │ 格C: 高张力→高压稳定 │ 格E: 部分分化        │
      │              │      分化             │      (虚线不稳定)    │      (向下+向外)      │
      │              │                      │                      │                      │
      │ 锁定=弱/解冻 │ 格B: 全面功能分化     │ 格D: 混合分化        │ 格F: 渐进分化        │
      │              │                      │   (向上+监控)        │   (向下+向外)        │
      └──────────────┴──────────────────────┴──────────────────────┴──────────────────────┘

      加上: 税基=低+透明=低(数字威权维持低透明+经济封闭)
      ├──────────────┼──────────────────────┤
      │ 锁定=强      │ 格G: 维持全包(压力下)│
      │ 锁定=弱      │ 格H: 渐进分化或维持  │
      └──────────────┴──────────────────────┘

      第三步: 逐格标注——该格的预测由哪条父推论强制

      格A [税基=高, 透明=高, 锁定=强] → "高张力→危机驱动分化"
      - L4-001: 税基跨国→向上推力→张力。不预测"危机驱动"具体。
      - L4-002: 透明高+独立低(典型)→最不稳定区→张力。不预测"分化"具体方向。
      - L4-003: 锁定强→抗拒变化→危机。不预测危机走向分化。
      - L4-004: 数字使四向分化技术上可能。
      → 归属: 需 L4-001+L4-002+L4-003+L4-004 合力。四条各自提供机制的一环,
        合起来才产生"危机驱动功能分化"这一综合预测。标注为【多父合力】。

      格B [税基=高, 透明=高, 锁定=弱] → "全面功能分化"
      - L4-001: 向上推力。
      - L4-004: 向外+向下技术可能。
      - L4-002: 透明→必须变。
      - L4-003: 锁弱→平滑适应。
      → 归属: 四向是四条独立机制的并行叠加。"全面分化"=四向都在发生。
        这是合取(AND of four independent mechanisms each producing its own direction),
        不是交互。标注为【合取(conjunction), 非交互】。

      格C [税基=高, 透明=低, 锁定=强] → "高张力→高压稳定(虚线)"
      - L4-001: 税基跨国→向上推力(但被低透明压制→张力积累)。
      - L4-002: 数字威权→以监控替代透明→可维持稳定(但 L4-002 预测此稳定不可长期维持)。
      - L4-003: 锁定强→抗拒变化→张力积累。
      - L4-004: 数字使高压监控可能。
      → 归属: 需 L4-001+L4-002+L4-003+L4-004 合力。L4-002 单独预测此区可能稳定
        (数字威权的新配置), L4-001+003 预测"不可长期稳定"——两力方向相反, 合力给出
        "短期高压稳定、长期虚线(不稳定)"。标注为【多父合力】。

      格D [税基=高, 透明=低, 锁定=弱] → "混合分化(向上+监控)"
      - L4-001: 向上推力。
      - L4-002: 低透明→威权可选择性压制向下分化。
      - L4-004: 监控技术使压制向下分化可行。
      → 归属: 需 L4-001+L4-002+L4-004 合力。标注为【多父合力】。

      格E [税基=低, 透明=高, 锁定=强] → "部分分化(向下+向外)"
      - L4-001: 税基未跨国→向上推力弱或不存在。
      - L4-002: 透明高→必须变。
      - L4-003: 锁定强→渐进、不剧烈。
      - L4-004: 向下+向外技术可能。
      → 归属: 需 L4-002+L4-003+L4-004 合力。L4-001 在此格中【不贡献压力】
        (税基未跨国→无向上推力), 仅作为"缺位"角色——向上推力不存在, 所以分化不含
        "向上"方向。L4-001 在此格中的角色是负向的(解释为什么没有"向上"), 非正向
        驱动。标注为【多父合力(含负向角色)】。

      格F [税基=低, 透明=高, 锁定=弱] → "渐进分化(向下+向外)"
      - L4-002: 透明→分化动力。
      - L4-004: 技术使分化可行。
      - L4-003: 锁弱→渐进。
      → 归属: 需 L4-002+L4-004 合力(含 L4-003 的弱角色)。标注为【多父合力(弱)】。

      格G [税基=低, 透明=低, 锁定=强] → "维持全包(压力下)"
      - L4-001: 无向上推力。
      - L4-002: 低透明→威权稳定区仍可运作。
      - L4-003: 锁定强→抗拒变化。
      - L4-004: 数字可维持监控。
      → 归属: 此格为最接近"非分化"的配置。L4-001 和 L4-002 在此格中均不提供
        分化压力(L4-001 因税基未跨国、L4-002 因低透明维持威权区)。仅 L4-004
        提供分化【可能】(不强制)。标注此格为"分化压力最弱格"。

      格H [税基=低, 透明=低, 锁定=弱] → "渐进分化或维持"
      - 四向压力均弱→系统可维持也可分化→最不确定格。

      招牌空格: [数字=高, 零功能分化, 长期稳定] → 预测为空

      空格强制分析——空格在哪些参数组合下被真正强制为空?
      - 当税基=低 AND 透明=低 AND 锁定=强(格G): 三条父推论均不提供分化压力。
        L4-001 无向上推力; L4-002 低透明维持威权区(若数字威权以监控维持低有效透明);
        L4-003 锁定抗拒变化→可能稳定在"不分化"状态(低均衡稳定, 如某些数字威权国家)。
        L4-003 单独承认"可能长期不分化也不崩溃(低均衡稳定)"——见 L4-005 multi_parent_cells
        中 L4-003 单独的分析:"L4-003 单说'锁定迟滞'→可能长期不分化也不崩溃(低均衡稳定)"。
      → 在此参数组合下, 空格【不被强制为空】。一个数字威权国家可以: 税基不跨国(经济
        相对封闭)、以数字监控维持低有效透明度、强制度锁定抗拒改变→维持全包国家+长期稳定。

      当税基=高 AND 透明=高 AND 锁定=强(格A): 四条父推论均向分化方向施压→空格被强制
      为空。这才是空格真正被强制为空的参数条件。

      裁决: 招牌空格需要参数限定。当前陈述"数字技术完全普及+零功能分化+长期稳定=空"
      给人"只要数字普及, 零分化就不可能稳定"的印象——但格G 的分析表明, 低税基跨国+
      低透明度+强锁定的数字威权国家可在不分化的情况下维持(可能是高压)稳定。空格仅在
      特定参数组合(高税基跨国+高透明度+强锁定)下被强制。

      第四步: 合力格汇总与涌现判定

      真正的多父合力格(预测需要 ≥2 父推论合力才能推出):
      - 格A: 4 父合力 ✓
      - 格C: 4 父合力 ✓
      - 格D: 3 父合力 ✓
      - 格E: 3 父合力(含 L4-001 负向角色) ✓
      - 格F: 2-3 父合力(弱) ✓
      → 至少 5 个格标注为需要 ≥2 父推论合力。满足"至少一个合力格"的最低门槛。

      但合力格的【质量】需要区分:
      - 类型 I (机制交互): 一个父推论的机制修改另一个父推论的机制的运作方式。
        仅 prediction (iii) 属于此类——L4-004 的数字信息流侵蚀 L4-003 的锁定维护条件。
        这一交互不在笛卡尔积中的某个特定格里, 而是贯穿多格的动态机制。
      - 类型 II (多父独立压力叠加): 多条父推论各自独立产生压力, 合起来产生综合效果。
        格 A/C/D/E/F 均属此类——每条父推论提供自己的压力方向, 综合效果=各方压力的矢量合。
        这是合取(conjunction), 不是交互(interaction)。

      涌现判定:
      L4-005 的"涌现"有两个层次:
      (a) 薄涌现(合取级): 四条独立机制同时作用于同一系统→四向分化。这在技术上是
          多父逐格判空(多条父推论共同决定每个格的预测), 满足 L4 评分卡的最低门槛。
          但机制结构是"并行压力叠加"而非"交互产生新质"。
      (b) 厚涌现(交互级): prediction (iii) 的 L4-003+L4-004 机制咬合。这是真正
          的 L4 级交互——一个父推论的机制修改了另一个父推论的机制的运作条件。

      裁决: 薄涌现(合取级)满足最低门槛但质量单薄。厚涌现(交互级)真实存在但仅覆盖
      预测 (iii) 这一条——不足以支撑"功能分化是四条 L4 推论交互涌现的产物"这一
      整体宣称。建议: (a) 诚实区分合取与交互; (b) 将 prediction (iii) 提升为
      涌现的核心证据; (c) 降低"四个方向凑在一起→功能分化"的涌现修辞, 诚实标注为
      "四条独立机制的并行压力在民族国家这一共同对象上产生综合效果"。

  14_weak_parent_premise:
