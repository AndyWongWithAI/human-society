      - 移除 L4-001：失去"向上交"核心驱动力→四向变三向→退化为 Strange 国家撤退论
      - 移除 L4-002：失去"必须变"的结构压力→分化变可选→仅民主国家可能选
      - 移除 L4-003：失去危机驱动动力学→分化变平滑静态重配
      - 移除 L4-004：失去向外+向下技术基础→分化退化为 Rodrik 向上交+向内收二分
      四条各承载不可替代的机制贡献。无观众砖。

      诚实标注：L4-001 和 L4-004 在"技术使跨国交换可行→税基跨国化"上有概念交叠，
      但不致任一成为观众砖（核心机制不同：L4-001=让权方向，L4-004=可行域扩张）。
      通过。

  12_trivial_conjunction:
    verdict: pass
    note: |
      【Round 2 重审——核心战场之一】

      RF-2 已落地。Emergent property 节分 (A) 合取级（薄涌现）和 (B) 交互级（厚涌现）。
      derivation step 3 标题改为"合力逻辑"并加诚实标注。multi_parent_cells 末尾加
      【合力格类型标注】注明全属 conjunction。

      本轮独立验证：四向各自的机制来源确为独立并行压力——
      - 向上交 ← L4-001 税基跨国化→让权方向位移
      - 向下放 ← L4-004 数字使小群体自组织可行 + DED-022 多层冲突
      - 向外包 ← L4-004 数字降低外部制度替代成本 + L4-003 锁定→国家供给滞后
      - 向内收 ← DED-003 外部竞争 + DED-012 坐寇逻辑

      四条独立机制的并行运作，合起来产生四向分化的综合效果。这是合取（conjunction），
      诚实标注为合取。非平凡性体现在：(a) 四向同时位移的格局不在任何单父推论中；
      (b) 招牌空格（参数限定版）需四条合力；(c) prediction (iv) 的交多少/留多少/
      分多快的交叉变异预测需 L4-001+L4-002 合力。这些是"合起来才推得出"的东西——
      满足非平凡合取门槛。

      通过。

  13_emergence_missing:
    verdict: pass_with_concern
    note: |
      【Round 2 核心产出——独立多父逐格判空归属分析 + 交互假说根基审查】

      第一步：独立重做笛卡尔积逐格归属（数字=高场景下，8 格）

      轴：税基跨国度(高/低) × 透明度(高/低) × 锁定度(强/弱)

      格A [税高, 透高, 锁强] → "危机驱动分化"
      - L4-001 提供向上推力，L4-002 提供不稳定压力，L4-003 提供危机模式，
        L4-004 提供多向可行性
      - 归属：需 4 父合力。每条提供独立压力向量，合取。

      格B [税高, 透高, 锁弱] → "全面功能分化"
      - 四向各由对应父推论提供独立推力，锁弱=平滑适应
      - 归属：4 父合力。合取。

      格C [税高, 透低, 锁强] → "高压稳定(虚线不稳定)"
      - L4-001+003 提供张力，L4-002+004 提供监控维持→短期稳定
      - 两力方向相反→合力给出"短期高压稳定、长期虚线"
      - 归属：需 4 父合力。合取。

      格D [税高, 透低, 锁弱] → "混合分化(向上+监控)"
      - L4-001 向上推力 + L4-002 低透明→可选择性压制 + L4-004 监控技术
      - 归属：需 3 父合力。合取。

      格E [税低, 透高, 锁强] → "部分分化(向下+向外)"
      - L4-002 压力 + L4-003 渐进模式 + L4-004 可行性
      - L4-001 在此格中为负向角色（解释为何无向上）
      - 归属：需 3 父合力。合取。

      格F [税低, 透高, 锁弱] → "渐进分化(向下+向外)"
      - L4-002+L4-004 合力（L4-003 弱角色）
      - 归属：需 2-3 父合力。合取。

      格G [税低, 透低, 锁强] → "维持全包(压力下)"
      - 四条父推论均不提供足够分化压力→最接近非分化配置
      - 归属：各父推论独立指向"可维持"。非合力格（无父推论强制分化）。

      格H [税低, 透低, 锁弱] → "渐进分化或维持"
      - 四向压力均弱→最不确定格

      招牌空格 [参数限定版：税高+透高+锁强，零分化+长期稳定] → 空
      - L4-001 提供经济调节失效，L4-002 提供信息控制崩塌，L4-003 提供张力无出口，
        L4-004 提供效率/合法性损失
      - 四条各自提供独立否决条件→四条合力才强制为空
      - 归属：需 4 父合力。合取。

      第二步：合力格汇总

      至少 6 个核心格标注为需 ≥2 父推论合力。招牌空格需 4 父合力。
      量化门槛通过。

      第三步：交互假说根基审查【本轮新增】

      prediction (iii) 声称 L4-003+L4-004 机制咬合：
      "L4-004 的数字信息流侵蚀 L4-003 锁定效应所依赖的'信息控制'维护条件→
      锁定的制度滞后期缩短→张力释放形式从革命转变为合法性危机"

      本轮独立审查追溯了两条父推论的原始机制：

      L4-003 的锁定机制（原文）：Dunbar 关口制度化时初始条件被冻结→多层级互锁
      （DED-022 层间冲突反馈）→抗拒变化。锁定的维持条件是【多层互锁的结构属性】——
      改一层触发其他层反制。L4-003 原文未将"信息控制"列为锁定的维护条件。

      L4-004 的机制（原文）：IT 成本数量级跃迁→四条天花板共移→社会复杂度相变。
      L4-004 原文不论述"侵蚀锁定"，不论述锁定效应。

      审查发现：prediction (iii) 的"数字信息流侵蚀信息控制→锁定更难维持"这一因果链
      是 L4-005 自建的新颖假说——它结合了 L4-003 的锁定存在性（结构事实）和 L4-004
      的信息成本崩塌（技术事实），但"信息控制是锁定维护条件"这一关键桥接前提不在
      L4-003 的原文机制中。L4-003 的锁定是结构属性（多层互锁），不是靠信息隔离维持的。

      这不意味着 prediction (iii) 是错的——恰恰相反，它可能是 L4-005 最有原创性的
      贡献——但它应被诚实标注为"novel composite hypothesis constructed by L4-005"
      而非"derived from parent mechanism interaction"。前者是 L4 复合推论的正当
      贡献方式（从父推论机制出发构建新假说），后者暗示父推论已包含此交互（但实际没有）。

      裁决：量化门槛通过（≥6 合力格）。prediction (iii) 是真实的新颖假说，但其
      "机制咬合"根基比 Round 1 评估的更弱——交互的前提条件（信息控制维持锁定）是
      L4-005 自建的，非 L4-003 原文所有。建议诚实标注，但不构成 required 缺陷
      （L4 复合推论有权构建父推论未显式覆盖的新假说）。通过但有 concern。

  14_weak_parent_premise:
    verdict: pass
    note: |
      RF-3 已落地。statement 首部加 ⚠️ 置信度天花板声明+ primary_suspect 加 L4-001
      降级量化（对 prediction (i)(iv) 的具体影响）。四条 L4 父推论状态：L4-001 verified*，
      L4-002/003/004 verified。L3 父推论：DED-003 verified*，其余 verified。
      无 candidate 被用作主前提。

      【本轮新增关注】L4-001 的机制延伸风险：L4-001 是历史推论（国家如何形成），
      L4-005 将其延伸到未来预测（已有国家如何转型）。"税基地理分布决定让权方向"
      这一核心机制在国家形成史中有锚点支撑，但在"已有成熟制度的民族国家的未来转型"
      这一新领域的适用性是延伸而非直接覆盖。这不构成 required 缺陷——L4 复合推论
      有权延伸父推论机制到新领域——但应标注此延伸的认识论风险。本条作为 should 提醒。
      通过。

  15_anchor_theft:
    verdict: pass
    note: |
      重审五个 composite_specific 锚点：

      Anchor 1 (EU→向上交)：L4-001 提供动机+L4-004 提供可行性→两个必要条件合取。
      非交互，但确需两者才能完整解释。标注为【必要条件合取】。

      Anchor 2 (社交媒体→多层公平冲突前台化)：L4-004 改变了 DED-022 机制运作的
      【可见性条件】。这是最接近真正复合锚点的案例——一个机制改变了另一个机制的
      运作环境而非仅是两事同时发生。标注为【真正的复合锚点】。

      Anchor 3 (平台资本主义→向外包)：L4-003 造成缺口+L4-004 使填补可行。
      链式关系，非交互。标注为【链式关系】。

      Anchor 4 (苏格兰/加泰罗尼亚→向下放)：三条父推论在同一案例中共现，但并行运作、
      互不依赖。标注为【并行机制共现】。

      Anchor 5 (数字威权→预测(ii)张力锚)：L4-002+L4-004 交叉格。两父推论各自覆盖
      不同侧面。confidence 标为 weak。

      五个锚点中仅 Anchor 2 有真正的复合交互证据（一个机制改变另一个的运作条件）。
      其余四个是必要条件合取/链式关系/并行共现。L4-005 在 composite_specific 分析中
      已诚实标注各锚点的机制结构。复合证据基础偏薄，但非 anchor theft。
      通过。

  16_interaction_measurement_gap:
    verdict: pass
    note: |
      RF-4 已落地。composite_measurement_independence 新增时序判据(a)/因果判据(b)/
      反事实判据(c)，并诚实标注"当前仅判据(a)可操作化，prediction (iii) 的交互主张
      当前仅在机制层面论证、未在测量层面操作化"。

      鉴于 L4-005 的主体结论是合取（四条独立趋势同时发生），测量层面的要求相应降低——
      合取可通过"四个维度各自独立测量+综合描述"来操作化。交互测量缺口主要影响
      prediction (iii)，已在 composite_measurement_independence 中诚实标注。
      通过。

  17_claim_type_mismatch:
    verdict: pass
    note: |
      RF-5 已落地。新增 methodological_caveat 节，声明两阶段验证策略：
      第一阶段（当前可检）——机制链各环节是否已在运作（锚点检验）；
      第二阶段（未来可检）——50 年尺度纵向趋势（当前不可完成）。
      诚实标注当前认识论层级为"基于当前机制的趋势外推"。

      claim_type 保持 "trajectory_prediction"，但 methodological_caveat 提供了
      足够的认识论诚实度。通过。

