      四条 L4 父推论状态:
      - L4-001: verified* (非 verified)——DED-003 的瑞士案例 unresolved。
        L4-001 自身的 primary_suspect 正是"外部竞争的必要性可能被高估"。
      - L4-002: verified
      - L4-003: verified
      - L4-004: verified

      L4-005 的 primary_suspect 是"向上交(超国家治理)的方向和速度"——这正是 L4-001
      的税基跨国逻辑所驱动的方向。L4-001 的 verified* 状态向上传播: 如果 L4-001 的
      "外部竞争必要性"被削弱(瑞士案例证明内部合法化替代可行), 则 L4-001 的"无竞争→
      退化"预测松动→L4-005 的"向上交是不可逆结构趋势"也松动。

      L4-005 在 falsification_trace.primary_suspect 中诚实声明了这一点:"L4-001 为
      verified*(非 verified), 其 DED-003 的瑞士案例 unresolved 状态是 L4-005 置信度
      天花板的一部分"。

      但这一诚实声明应更突出: verified* 父推论被用作"向上交"这一最可见预测方向的
      核心支柱, 而这一方向恰是 primary_suspect。L4-005 的置信度天花板应在 statement
      或 derivation 中明确标注, 而非仅在 falsification_trace 末尾提及。

      修正要求: (a) 在 statement 或 derivation 首部显式声明"本推论因 L4-001 为
