verdict: verified
verdict_note: |
  Round 1 五条 required 修复全部实质性落地。Round 2 独立审查确认：

  【通过的硬门槛】
  - 无 required 级缺陷（17 条红旗逐条重审，0 条 required）
  - 无观众砖（四条父推论各承载不可替代的机制贡献）
  - 非平凡合取（四向格局+招牌空格+交叉变异预测均需多父合力）
  - 至少 6 个合力格 + 招牌空格需 4 父合力（量化门槛通过）
  - 未重蹈 DED-004/DED-007
  - 反例猎捕未得 scope 内干净击杀

  【诚实资产（非缺陷）】
  L4-005 的诚实标注是资产而非负债——合取/交互区分、参数限定空格、
  置信度天花板声明、两阶段验证策略、测量操作化三判据+诚实标注。
  这些诚实标注使推论的边界清晰、可证伪路径明确。在 L4 评分卡的
  "宁可错杀不放水"标准下，诚实标注本身就是通过的关键证据——
  它表明作者知道自己的推论站在什么地基上。

  【should 级提醒（不阻塞 verified）】

  S1. prediction (iii) 的交互假说根基应诚实降级：
      L4-003 的锁定是结构属性（多层互锁），非"信息控制"维持；
      L4-004 不论述锁定。prediction (iii) 的"信息流侵蚀锁定"是 L4-005
      自建的新颖假说——这不意味着它是错的，但它应被标注为
      "novel composite hypothesis constructed by L4-005"
      而非"derived from parent mechanism interaction"。
      建议在 Emergent property (B) 节加一句诚实声明。

  S2. 格A 应加注竞争性路径：
      CE-2-round2 揭示：格A [税高+透高+锁强] 有两个竞争性路径——
      "危机驱动分化"（L4-005 当前预测）和"数字威权集中化"
      （技术用于压制而非使能分化）。L4-004 的数字技术在逻辑上
      对称地支持两者。建议在 multi_parent_cells 格A 中加注此竞争性路径
      及其判据（如何区分两种路径的早期信号）。

  S3. Round 1 的 SF-1（提升 prediction iii 为核心）不应照单执行：
      本轮审查发现 prediction (iii) 的交互根基比 Round 1 评估的更弱，
      不应将其提升为涌现核心。SF-2（格G 边界分析）仍为 should，可择机处理。

  S4. L4-001 机制延伸风险：
      L4-001 是历史推论（国家如何形成），L4-005 延伸到未来预测（已有国家如何
      转型）。核心机制可能适用，但延伸的适用性未经独立验证。建议在 derivation
      中加一句认识论诚实声明。

