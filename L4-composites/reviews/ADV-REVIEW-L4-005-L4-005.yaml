# 反例猎捕 — Round 2
# ============================================================

counterexample_hunt_round2:
  methodology: |
    按 L4 评分卡要求，猎两类反例：
    (1) 某父推论不成立 → L4-005 天花板受损
    (2) 父推论都成立，但交互不产生 L4-005 预测的结果（L4 特有猎法）

  type1_parent_failure:
    cases:
      - id: PF-1-round2
        label: "L4-001 verified* → 向上传播（同 Round 1，未变）"
        status: unresolved_parent_problem
        note: "已在 statement 和 primary_suspect 中充分标注。"

      - id: PF-2-round2
        label: "【新】L4-001 机制延伸风险——历史形成→未来转型"
        description: |
          L4-001 的核心证据基础是历史案例（前现代国家形成）。L4-005 将其核心机制
          （税基地理分布→让权方向）延伸到"已有成熟制度的民族国家的未来功能转型"。
          这一延伸的适用性未经独立验证——历史国家形成时的"让权"（从无制度到建制度）
          与当代民族国家的"让权"（从已有制度到超国家制度）可能服从不同的约束条件。
          这不构成反例（父推论机制本身未被推翻），但构成延伸风险。
        status: mechanism_extension_risk
        severity: moderate

  type2_interaction_failure:
    cases:
      - id: CE-1-round2
        label: "格G 全包国家在 30+ 年尺度上维持稳定——填充参数限定版空格？"
        description: |
          Round 1 的 CE-1 关注的是不加限定的招牌空格。RF-1 已加参数限定，
          格G（税基低+透明低+锁定强）明确标注为不必然空。

          本轮猎捕场景：如果格A 的参数条件（税基高+透明高+锁定强）下的某个政体
          在 30+ 年尺度上维持了零功能分化+长期稳定→填充参数限定版空格→L4-005 核心被证伪。

          当前无此类案例。格A 的最接近候选政体（高税基跨国+高透明度+强锁定）均已在
          经历某种程度的功能分化。保持开放猎捕。
        status: counterexample_hunt_open
        severity: high

      - id: CE-2-round2
        label: "【新】父推论都成立但结果不是分化而是'数字威权集中化'"
        description: |
          构造案例：某政体满足——
          (a) 数字技术高采用（L4-004 条件满足）
          (b) 税基高度跨国（L4-001 条件满足）
          (c) 透明被动提高（L4-002 条件满足——信息泄露成本崩塌）
          (d) 制度锁定强（L4-003 条件满足）
          但政体不走向功能分化，而是走向"数字威权集中化"——
          利用数字监控反向压制跨国资本（资本管制+数字主权），
          利用监控技术维持全包治理（数字技术用于执行而非分化），
          利用民族主义动员替代向上交（将跨国压力转化为"外部敌人"叙事→DED-003 再激活）。

          四条父推论机制都成立，但结果不是四向分化而是"技术强化的集中化"——
          数字技术（L4-004）被用于压制而非使能分化，
          跨国税基（L4-001）触发防御反应而非让权，
          透明度（L4-002）被监控抵消而非驱动政体变化，
          锁定（L4-003）被技术巩固而非被侵蚀。

          攻击点：L4-005 在格A 中预测"危机驱动分化"，但上述场景中政体可能通过
          "技术强化的集中化"成功管理了张力且不分化。这不是格G（税基低+透明低），
          而是格A 参数下的一个替代路径——四条父推论都成立但结果不同。

          L4-005 在 discriminant_validity 中部分预埋了此反例（"新的集中"替代
          "功能分化"），但讨论的是"向上集中"（世界政府），而非此处构造的
          "向内集中化"（数字威权利用技术巩固全包而非分化）。两者是不同路径。
        status: counterexample_hunt_open
        severity: high
        note: |
          此反例的核心教训：四条父推论都成立不必然导向四向分化——
          数字技术（L4-004）在逻辑上同样可以用于【阻止】分化（通过监控/压制/
          替代性服务交付），而非仅用于【使能】分化。L4-005 在 derivation 中承认了
          这个可能性（"技术上数字可以支持极致的中央监控=反向集中"），但在逐格预测中
          未充分体现这一替代路径如何影响格A 的确定性。建议在格A 中加注：
          "'危机驱动分化'与'数字威权集中化'是格A 的两个竞争性路径——
          哪个占优取决于政体是否成功将数字技术用于压制而非使能分化"。

  hunt_summary: |
    Round 2 未猎到 scope 内干净击杀（父推论都成立+交互不产生 L4 预测的明确现实案例）。
    猎到两个开放猎捕案例：
    CE-1-round2：参数限定版空格的待填充（需 30+ 年观察窗口）
    CE-2-round2：格A 的竞争性路径——"数字威权集中化"替代"危机驱动分化"。

    CE-2-round2 是 Round 2 最有价值的发现：它揭示了 L4-005 的一个结构性模糊——
    四条父推论在格A 参数条件下对两个竞争性路径（分化 vs 集中化）的预测力不对称。
    L4-004 的数字技术既可以用于使能分化（向外包/向下放）也可以用于阻止分化（监控/
    压制/替代性服务），L4-005 当前的逐格预测未充分处理这一对称性。

