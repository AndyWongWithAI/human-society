            这不是已发生的假阳性，是未来几乎必然触发但处理规则未预注册的结构缺口。
          status: structural_gap_future
          severity: should
          required_response: 见 should_fixes SF-11。
    type1_parent_failure:
      cases:
        - id: PF-6
          label: "复查前四轮 PF-1~PF-5——均维持原判，无新杀"
          description: |
            PF-1（储备配置由地缘阵营驱动）：仍与信用敏感假说不可区分，secondary_suspect
            预埋在位，只伤 (ii)。PF-2（DED-030 证据厚度传导）：已由 Epistemic status
            段吸收。PF-3/PF-4/PF-5：维持。本轮新扫：(a) 2025 年中美贸易战升级背景下
            金价续涨+美元指数同时走强——传统"美元强=金价弱"关系继续失效，与 L4-009
            的货币体制预测方向一致（美元储备地位弱化≠美元汇率弱化，两者可并存），
            不构成反例；(b) Bitcoin 的储备资产讨论升温（美国战略储备提案）——属预测
            (iv) 的挑战者维度，DED-027 射程外应用已诚实标注，不构成净杀。无新杀。
