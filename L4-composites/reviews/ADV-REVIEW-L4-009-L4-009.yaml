  不消耗锁定承诺。2022–2024 复核：CIPS 份额与本币互换存量年增幅均处历史上四
  分位以上，(d) 越阈判定维持成立，招牌格编码不变。同步更新预测 (v) 与
  falsifiability (b)（"(c)(d) 均按预注册阈值判定，确认路径不再含自由裁量端口"）。

  SF-5（体制退出规则预注册）——
