      priority: required
      title: "判据 (c) 补量级/系统重要性限定，统一重编 1979/2012/2018/2019，重验双向闸门与灰区占比"
      description: |
        (a) 给判据 (c) 增加事前量级限定并说明机制理由（演示效应触发"下一个可能是我"
            重估须受害方具系统量级），推荐形式：受影响主权方的被冻结/被排除储备资产
            占当年全球官方储备总额 ≥ 预注册阈值（建议 1%；伊朗 1979 约 120 亿/当年
            全球储备约 3% 过线、俄 2022 约 3000 亿≈2.5% 过线、委 2019≈0.07% 与
            伊朗 2012/2018（无新增冻结量级）不过线）。阈值一经注册不得再调。
        (b) 按新限定统一重编码 1971–2024 的全部 (c) 候选事件（至少含：1971 美元停兑、
            1979 伊朗、2012 伊朗 SWIFT、2018 Bank Markazi、2019 委内瑞拉、2022 俄），
            更新逐年编码表，重算灰区占比并对照 1/3 线。
        (c) 重验双向闸门并扩展：2011–2013 与 2018–2019 均不得判重定价期；
