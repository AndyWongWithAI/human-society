    18_caliber_preregistration_and_ambiguity_adverse_ruling:
      verdict: needs_revision
      severity: required
      note: |
        【本轮核心发现——rubric 第 18 条（L4-009 判例）的直接适用】

        第 18 条原文："阈值/判据是否连同分子、分母、测量口径【一次性注册】？发现
        '只有数字没有口径'→ 直接标记 required。若某个边界案例的裁决依赖【事后】口径
        选择（口径在反例出现后才定死，且定死方向恰好救推论），该边界案例一律按
        【不利于推论】方向裁，对应闸门不得计为守住——哪怕作者的机制理由可辩护。"

        事实核查——时间线：
        (1) Round 2（RF-5）：判据 (c) 补 ≥1% 全球官方储备阈值。此时分子口径未注册——
            "受影响主权方的被冻结/被排除储备资产"未指定是否含主权财富基金/政府其他实体。
        (2) Round 3（CE-4）：审查猎获 2011 利比亚央行储备冻结——宽口径（全部主权实体
            约 1000–1500 亿）≈1.0–1.5% 跨在 1% 线上；窄口径（仅 CBL 央行资产负债表内）
            约 0.4–0.88% 不过线。裁决取决于口径。
        (3) Round 3（RF-6）：作者将分子口径定死为央行窄口径（"受影响主权方央行资产
            负债表内被冻结/被排除的储备资产……主权财富基金与政府其他实体的资产不计入
            分子"），并据此裁决利比亚不过线（闸门 i 守住）。

        按第 18 条逐项对照：
        - "口径在反例出现后才定死"：是。≥1% 阈值在 round-2 注册时无分子口径，
          round-3 CE-4 发现利比亚跨线后才在 RF-6 中定死为窄口径。
        - "定死方向恰好救推论"：是。窄口径使利比亚从跨线（宽口径 1.0–1.5%）变为
          不过线（0.4–0.88%），恰好保住闸门 (i)（2011–2013 不得判重定价期）。
        - "该边界案例一律按不利于推论方向裁"：→ 利比亚必须按宽口径裁决，即
          (c) 越阈成立（≥1%）。
        - "对应闸门不得计为守住"：→ 闸门 (i)（2011–2013 不得判重定价期）不得计为守住。

        后果——按本条自身最终版锁定承诺：
        "第三次重校准不可用——此后再有误触发，按锁定承诺直接记为对本条操作化的真
        反例并触发降格评估，不得再修判据"
        → 利比亚按宽口径过线 → 2011 年 (a)+(c) 双越阈 → 判重定价期（误判，因
        2011–2013 为 C1 教科书主导、金价暴跌 28%）→ 闸门 (i) 击穿 → 操作化真反例
        成立 → 触发降格评估。

        不属于"第五次修法"的免责情形：第 18 条的程序缺陷（事后口径选择）不同于前
        四轮的判据字面缺陷（类别未限缩/量级未限定/普查未穷尽/细则未注册）——前四轮
        的修复是"判据本身写错了"，本轮的问题是"判据写对了但口径注册的时机晚了"。
        但后果相同：按本条自立的锁定承诺，触发降格评估。

        降格评估的范围（预注册，一次定死）：
        (a) 核心机制（信用越阈→定价结构同变）的五轮独立逐格判空均确认成立——不因
            操作化层的口径注册程序缺陷而塌。
        (b) 其他三道闸门（ii/iii/iv）在完备普查下仍守住——不连带。
        (c) 降格作用于：本条 status 从 candidate 的"clean"路径降为带操作化缺陷标注
            的路径（如 verified* 或维持 candidate 但显式标注闸门 i 击穿+操作化真反例
            记录），且 2022–2024 锚点的 confidence 需反映判据区分度的额外压力（2011
            与 2022 的购金+信用事件组合相似但价格行为相反→判据区分这两类事件的能力
            是承重点）。
        (d) 不自动等于 rejected：DED-004/007 级核心塌陷不成立，五轮独立审查一致确认
            涌现结构与测量方案立住。

        辩护通道（作者可选，但须接受第 18 条的裁决框架）：
        (i) 接受宽口径利比亚过线的裁决→闸门 i 击穿→执行上述降格评估→更新 status
            与 review_summary。
        (ii) 或论证第 18 条不应溯及适用于 round-2 的口径注册时点——理由：(c) 的窄口径
            有 challenger_reserve_allocation 模块的既有文本先例（该模块在 round-2 前
            已用窄口径"央行资产负债表内"），RF-6 是将既有窄口径一致性扩展到 (c) 的
            口径对齐操作，非全新口径选择。此辩护的存活押在"既有文本先例"是否被判定
            为 sufficient pre-registration——若 round-6 审查判 insufficient，则退回到
            角 (i) 的降格路径。
        无论选 (i) 或 (ii)，本条必须在下一轮给出显式裁决并更新闸门状态、编码表与
        降格评估结论。归 RF-9。

