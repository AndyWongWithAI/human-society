  越阈；或 ②(c) 存续但 (a)(d) 连续 3 年回落至阈值以下。历史回验：1981 伊朗资产
  释放+指标回落 → 规则① 判 1981 切回，与编码表一致 ✓；2011.12 利比亚解冻因
