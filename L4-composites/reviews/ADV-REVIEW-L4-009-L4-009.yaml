            不改判、且窄口径使未来事件更难过线（对本条主张方向为不利而非有利，
            非单向便利的口径选择）。裁决：可辩护，CE-4 关闭。残余：作者敏感性
            区间上限（0.8%）低于核数上限（0.88%），应更新（SF-7）。
