verdict: needs_revision
verdict_note: |
  L4-009 的涌现是真的——独立重做的逐格判空确认招牌格（重定价×高利率）需要
  DED-029+028+030 三父合力（DED-029 在该格显式沉默，DED-030 无触发，DED-028 无
  价格），[重定价×低利率] 的幅度与时序又给出两组两父合力；相关性断裂作为体制
  指示器、放大器门控、储蓄端先行三个命题均不是父推论结论的 AND/OR。复合输出
  变量（相关性断点/分体制弹性）有干净的交互级测量方案。这够 L4 资格。

  判 needs_revision 的原因集中在操作化与父推论射程两层：
  (1) 活反例 CE-1——复合判据按预注册字面在 2011-2013 误触发"重定价期"，而该窗口
      是 C1 主导的教科书商品体制（金价暴跌/相关性强负），招牌格预测在自家判据
      确认的窗口内失败；文中对该窗口的消化（consumed_as_support）依赖"购金未越
      +1σ""无储备信用事件"两处与判据字面冲突的事实错误。机制内核（对手方风险
      被证实 vs 一般信用噪声的质差）本身能救它，但判据必须按机制内核重校准并
      重写该反例分析。
  (2) 判据 (a)(b) 本身就是储蓄端迁移，证伪格 (v) 只能由 {(c),(d)} 确认——局部
      构造性收窄未披露。
  (3) DED-027 被用于其自宣射程（"无中央银行……现代法币体系不在射程内"）之外，
      且对核心切换主张接近观众砖——预测 (iv) 的 L3 支撑名不副实，须降格为
      本条自担的射程扩展赌注或砍掉挑战者模块。
  (4) 灰区普查（"约 8 年/16%"）建立在 (1) 的同一错误上，须按判据字面重算并对照
      1/3 降格触发线。

  不判 rejected 的理由：核心不是塌了而是判据划错线——2022（储备冻结证实对手方
  风险）与 2011（评级下调噪声）的区分恰好由本条自己的机制内核（"不依赖对手方
  履约"从溢价属性变为必要属性）给出，重校准有事前可辩护的机制理由，不是事后
  挑窗口；涌现结构、测量方案、双侧历史对照、自毁开关（断点检验降格条款+灰区
  1/3 条款）全部在位。

