        - DED-030 → 自变量=S/F 档位（50–70）+持有者弹性分层（首饰≈央行 < 金条金币 <
          ETF/投机者），输出=定价权归属与需求冲击敏感性；不含触发条件。
        - DED-027 → 自变量=六维加权得分+网络正反馈，输出=媒介地位锁定/换主；不含价格
          动力学；射程=商品货币时代（自宣"现代法币体系不在射程内"）。

        第二步——笛卡尔积表（法币信用{平稳,重定价} × 实际利率{低,高}；被预测量=
        金价方向+相关性结构+弹性+时序），逐格归属：

        格 [平稳×高] → 金价承压/相关性强负/弹性低。
          归属：方向与相关性由 DED-029 C1 单父强制（单因素主导片段）。弹性"低"由
          DED-030 持有者分层+L4-009 的门控条件化给出——严格说 DED-030 原文预测 (iii)
          是无条件的需求敏感，"商品体制中冲击温和"是 L4-009 对父推论的体制条件化。
          标注：【单父核心（DED-029）+ 门控修饰（L4 自身对 DED-030 的条件化）】。非合力格。

        格 [平稳×低] → 金价受支撑/相关性强负/弹性低。
          归属：DED-029 C1 单父强制。标注：【单父格】。

        格 [重定价×低]（如 2008–2011 型）→ 上涨方向+不成比例幅度+储蓄端先行。
          归属拆解：
          - 方向：DED-029 C3 单父可给（法币信用下滑→E_network 扩张→金价上涨）。
          - 【不成比例幅度】：DED-029 只给方向不给幅度——"为什么涨这么多"需要 DED-030
            的存量-流量不对称（S/F≈50–70→供给近乎垂直→等量增量需求的价格冲击数倍于
            流量定价商品）。DED-029 单独无幅度机制、DED-030 单独无触发判据（不知道
            需求端何时涌入），缺一即只剩"会涨"或"会放大但不知何时"。
            → 需 DED-029 + DED-030 合力。合力组件 ✓。
          - 【先行结构】：DED-028 给"储蓄端无法律缓冲→最先动"的时序机制，但不指定
            "动的方向"——信用下滑时储蓄端会逃向何处（金/外币/实物资产）需要 DED-029
            的 C3 通道（法币信用↓→非主权价值储藏↑）来指定。
            → 需 DED-028 + DED-029 合力。合力组件 ✓。
          标注：【方向单父，幅度需 029+030 合力，时序需 028+029 合力】。合力格 ✓。

        格 [重定价×高]（招牌格，2022–2024 型）→ 金价可创新高+相关性衰减/翻正+
          弹性放大+储蓄端先动。
          归属拆解（采用 round-4 校准后的最严读数）：
          - DED-029 单父在此格【显式无净预测】——C1（实际利率高→金价跌）与 C3（法币
            信用重定价→金价涨）方向相反、引擎冲突，"多因素同时变动时的净效应……
            不在本推论射程"。此格不是"父推论预测被加强"，而是"父推论沉默处被填上"——
            这是非平凡合取的最强证据。
          - 填格需要：
            (a) DED-029 提供引擎分类与 C3 通道——谁在买（主权 SOV 配置者）、为什么买
               （对手方风险重定价）、为什么对 C1 不敏感（买入动机是信用重定价而非
               机会成本计算）→ "相关性衰减"的机制来源。
            (b) DED-030 提供存量-流量不对称的放大——为什么年增量仅占存量 0.5% 的央行
               购金能压倒实际利率引擎（存量争夺+无供给缓冲+边际卖家沿保留价格分布
               大幅上移→等量增量的价格冲击数倍于商品体制）→ "弹性放大"的机制来源。
            (c) DED-028 提供独立于价格的切换确认——储蓄端先动（央行购金/储备结构变化）
               可在金价-利率相关性断裂被确认之前，独立给出"切换已发生"的证据→
               "可判定性"的认识论支撑（认识论承重而非动力学承重）。
          - 综上：该格的价格/相关性/弹性动力学内核由 029+030 两父机制合力强制；028
            承担独立切换确认腿（对该格的可判定性必要，对格内价格机制非必要）。即便按
            最严读数只计 029+030，该格仍是 ≥2 父合力格。
          标注：【029+030 两父机制合力 + 028 独立确认腿（认识论承重）——≥2 父合力格 ✓✓，
          本条 L4 资格的承重格】。

        挑战者第三轴 [重定价×数字资产获机构级配置] → 金的体制性上涨弱于历史同类期。
          归属：名义上 DED-027（媒介竞争+赢家通吃）+ DED-029（信用重定价触发需求），
          但 DED-027 在此为射程外应用（自宣"现代法币体系不在射程内"），已带星号剔出
          分档计数。标注：【合力格*（射程外星号），不计入 verified* 分档条件】。处理正确。

        空格（预测 v）：[重定价（仅由 {(c),(d)} 双越阈确认）× C1 稳定主导 × 无储蓄端迁移]
          预测为空。真经验主张——(c)(d) 与储蓄端正交（结算/冻结事件与购金行为可独立
          编码），一旦此类窗口出现而 C1 仍稳定主导且储蓄端无迁移，本条即被证伪。

        第三步——合力格汇总：
        - [重定价×高]（招牌格）：029+030 机制合力+028 确认腿 ≥2 父合力 ✓✓
        - [重定价×低]：幅度需 029+030 合力 + 时序需 028+029 合力 ≥2 父合力 ✓
        - 剔除挑战者格（射程外星号）后，仍有 ≥2 个合格合力格。

        结论：至少一格需要 ≥2 父合力成立——非平凡合取、非 L3 chaining。涌现门槛
        第五次独立确认通过。

