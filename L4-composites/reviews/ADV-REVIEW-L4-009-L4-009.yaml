  counterexample_hunt:
    methodology: |
      两条猎道：(1) 猎父推论在本条射程内失效；(2) 猎"父推论都成立、复合判据也触发，
      但交互不产生 L4 预测结果"的窗口。本轮重点：拿重校准后的判据字面（尤其 (c) 的
      "对手方风险被证实类"新定义）重新扫 1971–2024 全部可编码事件，检验双向闸门
      （"2011–2013 不得误判、2022 必须判"）在新判据下是否真的守得住。
    type2_interaction_failure:
      cases:
        - id: CE-3
          label: "【活反例——重校准判据下假阳性复活】2012 与 2018:伊朗 SWIFT 除名事件按重校准判据 (c) 字面可编码，叠加 (a) 越阈构成两指标同向 → 误判重定价期，而两窗口均为 C1 教科书主导"
          description: |
            重校准后的判据 (c)＝"对手方风险被证实类离散事件——储备资产冻结、兑换限制、
            被排除出结算体系（可编码、可注明日期）"。按此字面逐年补扫：
            - 2012 年 3 月：被欧盟制裁的伊朗银行被逐出 SWIFT——SWIFT 史上首次除名，
              "被排除出结算体系"整类事件的开山案例。可编码 ✓。
            - 2018 年 11 月：伊朗央行 Bank Markazi 本身被排除出 SWIFT——央行级结算
              排除。可编码 ✓。
            - 2019 年：美国行政令冻结委内瑞拉政府资产 + 英央行拒还委存伦敦黄金——
              "储备资产冻结"。可编码 ✓。
            编码表自己把同类事件——1979 年美国冻结伊朗央行资产——计为 (c) 并据此判
            1979–1980 为货币体制，却对上述三起只字未编。两难：
            【角 A：计入】2012 年 (a) 越阈（569 吨创 20 年新高，编码表自认）+ (c)
            越阈 → 两指标同向 → 判重定价期；2018 年 (a) 越阈（656 吨创新高，编码表
            自认）+ (c) 越阈 → 判重定价期。而 2012–2013 金价滞涨后暴跌 28%、相关性
            稳定强负；2018–2019 金价严格随实际利率走（2019 年涨完全对应实际利率
            崩落）——招牌格预测在重校准判据确认的窗口内再次失败，round-1 立的双向
            闸门（"2011–2013 不得误判为重定价期"）被自家判据字面击穿，且按锁定承诺
            （"再有误触发即记为对本条操作化的真反例"）这构成操作化的真反例。
            【角 B：不计入】则 1979 伊朗冻结同样不该计，1979–1980 只剩 (b) 单指标
            → 退灰区——金价 850 美元峰值窗口滑出货币体制，1968–1980 历史锚点的
            双侧对照塌掉后半段，且灰区占比升至约 22%（12/54）。
            性质判定：不是父机制失效（四父在两窗口全部正常运作），也不是交互机制
            不存在（2022 的交互链仍完整）——是重校准把判据 (c) 的类别划对了
            （对手方风险被证实 vs 信用噪声）但漏了量级维度：对被制裁边缘国的冻结/
            排除（伊朗 2012/2018、委 2019）没有触发全球储备管理者的"下一个可能是我"
            重估，对系统级持有者（俄 2022，冻结约 3000 亿≈全球官方储备 2.5%）才触发。
            这个区分本身是事前可辩护的——演示效应的强度取决于受害方与"我"的相似度
            与量级——但它不在判据文本里，且编码表对 1979 的处理与之矛盾。
          status: live_counterexample_against_recalibrated_operationalization
          severity: required
          required_response: |
            见 required_fixes RF-5。注意：这已是第二次 retrofit——round-1 锁定承诺
            （"此后判据不得再调"）的信用被本次消耗，修订时必须显式承认，并声明
            第三次重校准不可用（再有误触发按锁定承诺直接记真反例、触发降格评估）。
        - id: CE-2-followup
          label: "round-1 CE-2（相对流量中介缺失）复查——未整改，维持 should"
          description: |
            构造情形（真对手方事件+央行购金温和+ETF 大流出→高弹性层仍是边际定价者
            →体制不切）暴露的隐含中介（低弹性买家流量须成为边际定价流量）仍未进
            判据或射程标注。2022–2024 恰好满足（购金约 1000 吨 vs ETF 流出约 110 吨）
            但判据本身不保证。维持 should（并入 SF-4 编号承接）。
          status: counterexample_candidate_carried_over
          severity: should
    type1_parent_failure:
      cases:
        - id: PF-3
          label: "复查 round-1 PF-1/PF-2——均维持原判"
          description: |
            PF-1（储备配置由地缘联盟而非信用信号驱动）：2022–2024 购金国构成仍与
            阵营假说不可区分，作者 secondary_suspect 已预埋，只伤 (ii)。
            PF-2（DED-030 证据厚度传导）：维持 noted。
            本轮新扫：2024–2025 中国央行阶段性暂停购金而金价续涨——不构成反例
            （体制持续期内其他低弹性买家接力，判据是部门级不是单国级），记录备查。
          status: no_new_kill
          severity: noted
    hunt_summary: |
      猎到一个 required 级活反例（CE-3）：重校准后的判据 (c) 因缺量级/系统重要性
      限定，按字面在 2012 与 2018 再次产出假阳性触发（伊朗 SWIFT 除名+购金创新高
      双越阈），双向闸门被击穿；同时编码表对 1979 伊朗冻结的计入与对 2012/2018/2019
      的不编码互相矛盾——两难的任一角都伤本条（假阳性复活 或 1979–1980 锚点退灰区）。
      杀伤位置仍在操作化层非机制层：量级限定（受影响储备资产占全球官方储备的
      预注册占比阈值）事前可辩护且两角都能安顿（伊朗 1979≈3% 过线、俄 2022≈2.5%
      过线、委 2019≈0.07% 与伊朗 2012/2018 不过线），可定向修复。无机制层净杀，
      涌现结构与测量方案本轮独立复核均立住。

