  counterexample_hunt:
    methodology: |
      两条猎道：(1) 猎父推论在本条射程内失效；(2) 猎"父推论都成立、复合判据也
      触发，但交互不产生 L4 预测结果"的窗口。本轮重点：拿最终版判据 (c)（含 ≥1%
      量级限定）逐年重扫 1971–2024 全部主权储备资产冻结/结算排除事件，检验裁决
      清单声称的"统一裁决全部候选"是否真的穷尽、四道闸门在完备普查下是否仍守得住；
      并逐一核查 (a)(b)(d) 的阈值形式是否全部预注册。
    type2_interaction_failure:
      cases:
        - id: CE-4
          label: "【活反例候选——普查缺口】2011 年利比亚央行储备冻结：量级跨在 1% 注册线上、与已裁决的 2019 委内瑞拉同类同构但大一个数量级，却不在'全部候选'裁决清单中；若过线则 2011 年 (a)+(c) 双越阈、闸门 (i) 第三次被击穿，按最终版锁定承诺直接触发降格评估"
          description: |
            事件编码（按判据 (c) 字面——"储备资产冻结……可编码、可注明日期"）：
            2011 年 2 月 26 日联合国安理会 1970 号决议、3 月 17 日 1973 号决议 +
            美国 E.O. 13566（2 月 25 日）+ 欧盟理事会条例——利比亚央行（CBL）与
            利比亚投资局（LIA）被列名冻结。可编码 ✓、可注明日期 ✓、对手方风险
            被证实类（储备资产冻结）✓——与 2019 委内瑞拉（已裁决）完全同类。
            量级裁决（判据 (c) 的 ≥1% 线）：美国单边冻结约 370 亿美元（时任财政部
            称史上最大单次冻结行动）；全球合计通常引述约 1000–1500 亿美元（含 LIA
            约 600–700 亿）。2011 年全球官方外汇储备约 10.2 万亿美元 →
            总口径 ≈1.0–1.5%【过线或压线】；央行窄口径（仅 CBL 资产负债表内被
            冻结储备资产，本条 challenger_reserve_allocation 已有窄口径先例）下
            可能落在 1% 附近或以下【裁决未做，结论悬置】。
            冻结存续约 9 个月（2011 年 12 月安理会解除对 CBL 制裁）——与 1979
            伊朗冻结存续约 14 个月同量级，"短暂且解冻"不构成差别对待的事前理由
            （判据无存续期条款，见 SF-5）。
            两难结构（同 round-2 CE-3 的形态，但落点在普查完备性）：
            【角 A：过线计入】2011 年 (a) 越阈（457 吨创 20 年新高，编码表自认）
            + (c) 越阈 → 两指标同向 → 判重定价期；而 2011–2013 是 C1 教科书主导
            （2013 金价 −28%/相关性稳定强负/ETF 高弹性层主导卖出）——闸门 (i)
            （"2011–2013 不得判重定价期"）第三次被击穿。按最终版锁定承诺
            （"第三次重校准不可用——此后再有误触发，按锁定承诺直接记为对本条
            操作化的真反例并触发降格评估，不得再修判据"），此角的后果不是再修法，
            是执行降格评估。
            【角 B：不过线不计入】须显式采央行窄口径并给出 CBL 被冻结储备资产的
            数字与来源——该口径选择有既有文本先例（challenger 模块的"窄口径
            （央行资产负债表内）"），属对已注册判据的口径补全而非第三次重校准，
            事前可辩护；但必须同步用同一口径复核 1979 伊朗（约 120 亿全为央行
            存款，窄口径无恙）与 2022 俄（约 3000 亿为央行储备，无恙），并把
            利比亚裁决与敏感性写进裁决清单和编码表。
            性质判定：四父机制在 2011–2013 全部正常运作，交互机制本身无恙
            （2022 交互链完整）——杀伤位置第三次落在操作化层：这次不是判据字面
            （类别与量级维度都已划对），是【普查执行的完备性】——"统一裁决全部
            候选"的声明漏掉了一个量级上不可忽略、且对闸门 (i) 有决定性影响的事件。
            未裁决状态下，编码表的 2011–2013 判定（灰区）与灰区占比（18.5%）
            均带未决条件。
          status: live_counterexample_candidate_pending_adjudication
          severity: required
          required_response: 见 required_fixes RF-6。
        - id: CE-5
          label: "构造检验——判据 (d) 无阈值使证伪格 (v) 的唯一确认路径半开放"
          description: |
            构造未来窗口：一次 ≥1% 的对手方风险事件（(c) 干净越阈）+ 替代结算
            份额小幅波动。格 (v) 的确认需要 (c)(d) 双越阈——但 (d) 无预注册阈值，
            "份额上升"字面下任何正变化都可计为越阈（或任何波动都可判为未越阈）：
            裁决者可通过 (d) 的自由裁量决定空格检验是否开启。这不是已发生的假阳性
            （历史编码中 (d) 仅 2022–2024 被计入一次），是空格可检验性的结构缺口
            ——DED-004 式判据自由度从 (c)（RF-5 已封死）转移到 (d)。
          status: structural_gap_not_yet_triggered
          severity: required
          required_response: 见 required_fixes RF-7。
    type1_parent_failure:
      cases:
        - id: PF-4
          label: "复查 round-1/2 的 PF-1/PF-2/PF-3——均维持原判，无新杀"
          description: |
            PF-1（储备配置由地缘阵营驱动）：仍与信用敏感假说不可区分，作者
            secondary_suspect 预埋在位，只伤 (ii)。PF-2（DED-030 证据厚度传导）：
            已由 Epistemic status 段显式吸收。PF-3（2024–2025 中国央行阶段性暂停
            购金）：维持"部门级判据不受单国暂停影响"，非反例。本轮新扫 DED-028
            的反向路径（支付端先于储蓄端动的案例）：未找到——历史上货币替代
            （美元化）均滞后于储蓄端迁移，与父推论时序一致。无新杀。
          status: no_new_kill
          severity: noted
    hunt_summary: |
      猎到一个 required 级活反例候选（CE-4）：不是判据字面错（类别+量级维度经
      两轮修法已划对），是"统一裁决全部 (c) 候选"的普查执行漏掉 2011 利比亚央行
      储备冻结——该事件量级跨在 1% 注册线上（总口径约 1.0–1.5%），且 2011 年
      (a) 已越阈，其裁决对闸门 (i) 是决定性的：过线则闸门第三次被击穿、按最终版
      锁定承诺直接触发降格评估；不过线则须显式采央行窄口径裁决并同口径复核
      1979/2022。另猎到一个 required 级结构缺口（CE-5）：判据 (d) 是四指标中唯一
      无预注册阈值的，而 {(c),(d)} 双越阈是证伪格 (v) 的唯一确认路径——空格检验
      的一条腿由裁决者自由裁量。两处均在操作化层，机制层无净杀：涌现结构、测量
      方案、双侧对照本轮独立复核均立住。
  non_recurrence:
    ded004_check:
      verdict: pass_with_fix
      note: |
        金价反推体制的主防线（anti_talisman 1–3 + 确认子集限定 + (c) 硬量级阈值）
        在位。残余 DED-004 味道两处：(i) (c) 候选普查的完备性缺口（CE-4）——
        漏编恰好保住闸门，效果上构成编码自由度；(ii) (d) 无阈值（CE-5）——判据
        自由度的最后一个开放端口。RF-6/RF-7 均为封死自由度的修法（普查补全+阈值
        补注册），修后可过。
    ded007_check:
      verdict: pass
      note: 单一机制（信用越阈→定价结构同变）、全部预测共享同一组独立测量变量、falsifiability (a) 一锤定音的模型比较判别、预注册降格承诺——无多假说各吃各案例的结构。通过。

  verdict: needs_revision
  verdict_note: |
    round-2 的 RF-5 与 SF-1~4 全部落实且质量高：量级限定入判据并附裁决清单、
    编码表重编、四道闸门重验、两次 retrofit 诚实记账、epistemic status 与离散性
    机制论证补齐、断点定位改月度分辨率、领先性中介与相对流量中介显式化。独立
    重做的逐格判空第三次确认涌现成立（招牌格三父合力+两组两父合力格），观众砖
    已消解，测量方案无缺口，DED-004/007 不重蹈。
    判 needs_revision 的两条 required 原因：
    (1) CE-4——"统一裁决 1971–2024 全部 (c) 候选事件"的普查声明不成立：2011 年
        利比亚央行储备冻结（美国单边约 370 亿/全球合计约 1000–1500 亿，占当年
        全球官方储备约 1.0–1.5%，跨在 1% 注册线上）与已裁决的 2019 委内瑞拉同类
        同构但大一个数量级以上，却不在裁决清单中；2011 年 (a) 已越阈，该事件的
        裁决对闸门 (i) 是决定性的。过线角触发最终版锁定承诺的降格评估；不过线角
        须显式采央行窄口径（有既有文本先例，属口径补全非第三次重校准）并同口径
        复核 1979/2022。未裁决状态下编码表与灰区占比均带未决条件。
    (2) CE-5——判据 (d) 是四指标中唯一无预注册阈值形式的，而 {(c),(d)} 双越阈是
        证伪格 (v) 的唯一确认路径：空格检验的一条腿由裁决者自由裁量，DED-004 式
        判据自由度从 (c) 转移到 (d)。
    不判 rejected 的理由：两处缺陷均在操作化执行层（普查完备性+一个漏注册的
    阈值），机制层与涌现结构三轮独立复核均立住；CE-4 的不过线角有事前可辩护的
    口径先例，过线角也有本条自带的降格程序承接——两角都有一致解，不是核心塌陷。
    但须明确：RF-6 的裁决结果若为过线，本条按自己的锁定承诺进入降格评估程序，
    届时的裁决不再是 needs_revision 而是执行降格——这是本条自己立的法。

  required_fixes:
    - id: RF-6
      priority: required
      title: "补全 (c) 候选普查并显式裁决 2011 利比亚（附 1990 伊拉克/2021 阿富汗），定死量级口径，重验闸门与灰区占比"
      description: |
        (a) 显式定义判据 (c) 量级比值的分子与分母口径（事前可辩护）：建议分子采
            央行窄口径（受影响主权方央行资产负债表内被冻结/被排除的储备资产，
            与 challenger_reserve_allocation 既有窄口径一致），分母为当年全球
            官方外汇储备（IMF COFER 总额，含未分配）；声明此为对已注册 ≥1% 阈值
            的口径补全，不改阈值本身，不构成第三次重校准，并在重校准披露中如实
            记账。
        (b) 按该口径显式裁决 2011 利比亚（CBL 被冻结储备资产数额+来源+占比+
            敏感性），并补入 1990 伊拉克（<1%）与 2021 阿富汗 DAB（≈0.05%）——
            使"全部候选"清单真正穷尽 1971–2024。
        (c) 若利比亚过线：按最终版锁定承诺执行——记为对本条操作化的真反例，
            触发降格评估（不得再修判据）。若不过线：更新裁决清单与编码表
            （2011–2013 维持灰区）、用同一口径复核 1979 伊朗与 2022 俄的既有
            裁决、更新灰区占比敏感性段（含"若利比亚按宽口径过线"的最不利读数）。
        (d) 四道闸门在补全普查后全部重验并记录。
      affects: operationalization.fiat_credit_repricing_period.measurement(c), real_world_anchors.boundary_cases[逐年编码表], anti_talisman_clause(4), review_summary
    - id: RF-7
      priority: required
      title: "判据 (d) 补预注册阈值形式——封死证伪格 (v) 确认路径的最后一个自由裁量端口"
      description: |
        给 (d) 一个与 (a)(b)(c) 同级的预注册阈值形式（建议对齐 (b) 的形式：替代
        结算系统份额或 COFER 非传统储备货币份额的年增幅超过历史分布上四分位；
        历史样本给出等价物的具体序列）。方向必须是"更难满足"的补全而非放松；
        在重校准披露中如实记账（此为漏注册阈值的补全，非对误触发的第三次修法，
        与锁定承诺不冲突但须显式声明）。同步核对 2022–2024 编码中 (d) 的越阈
        判定在新阈值下是否仍成立。
      affects: operationalization.fiat_credit_repricing_period.measurement(d), falsifiability(b), statement.Prediction(v), real_world_anchors.boundary_cases[逐年编码表]
  should_fixes:
    - id: SF-5
      priority: should
      title: "预注册判据 (c) 事件的存续/失效规则——体制何时切回"
      description: |
        当前判据只定义重定价期的进入，不定义 (c) 事件效力的存续期与体制退出条件：
        2022 俄储备冻结无限期存续 → (c) 常开 → 只要 (a) 或 (d) 维持越阈，货币
        体制在当前窗口永不退出，"切回商品体制"的预测（1980 型）在制裁存续期间
        不可检验。建议预注册退出规则（如：(c) 事件解除/或其后连续 N 年无任何
        指标越阈则切回），并回验 1981（伊朗资产释放+沃尔克紧缩）与 2011 年 12 月
        （利比亚解冻）两个历史退出点的一致性。
      affects: operationalization.fiat_credit_repricing_period, real_world_anchors.boundary_cases[逐年编码表]

author_response_round_3: |
  RF-6/RF-7（required）与 SF-5（should）全部落实，均为定向 Edit：

  RF-6（(c) 候选普查补全+口径定死）——
  (a) 口径显式化入判据 (c)：分子=受影响主权方【央行资产负债表内】被冻结/被排除
  的储备资产（窄口径，与 challenger_reserve_allocation 既有窄口径一致，主权财富
  基金与政府其他实体资产不入分子）；分母=当年全球官方外汇储备总额（IMF COFER
  含未分配）。机制理由事前化：演示效应的重估主体是央行储备管理者，SWF 被冻结
  演示的是"政府海外资产有风险"而非"央行储备会被冻结"。≥1% 阈值未动，在重校准
  披露中声明为口径补全、非第三次重校准。
  (b) 2011 利比亚显式裁决：宽口径（全部主权实体约 1000–1500 亿）≈1.0–1.5% 跨线，
  但 LIA 约 600–700 亿为主权财富基金不入窄口径分子，CBL 资产负债表内被冻结储备
  资产估计约 400–800 亿 ≈0.4–0.8% → 不过线 ✗。口径承重如实标注：若宽口径过线
  则 2011 (a)+(c) 双越阈、闸门 (i) 击穿、按最终版锁定承诺直接降格——裁决存活
  押在窄口径的事前可辩护性上，受 round-4 复核。1990 伊拉克（<1%，科威特资产
