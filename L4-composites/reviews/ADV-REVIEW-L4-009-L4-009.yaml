id: ADV-REVIEW-L4-009
target: L4-009
date: 2026-07-15
type: adversarial_review
layer: L4-composites
round: 1
reviewer: "独立对抗审查者 (全新上下文, round 1, 与作者及前几轮审查者无关)"
人话摘要: |
  L4-009 是一条有真涌现的复合推论——招牌格（重定价×高利率）确实需要 DED-029+028+030
  三父合力，相关性断裂作为体制指示器是任何单父都给不出的复合可观测量，2022-2024 与
  1968-1980/1997-2015 构成阈值两侧对照。但本轮独立反例猎捕猎到一个活反例：按复合判据的
  预注册字面，2011-2013 年就已构成"重定价期"——央行购金自 2011 年起连续净买入且远超
  过去 20 年均值+1σ（20 年窗口含 1990 年代大规模净卖出，均值低）、2011 年美国主权评级
  下调/两次债务上限危机/欧债危机均属判据(c)明文可编码事件——两指标同向越阈。而该窗口
  金价 2013 年暴跌 28%、金价-实际利率相关性强负、C1 教科书式主导：招牌格预测在自家判据
  确认的窗口内失败。文中 2013-2015 反例消化依赖两处事实性错误（"购金未越+1σ阈值"
  "无储备信用事件"）。此外：判据(a)(b)本身就是储蓄端迁移，使证伪格(v)只能由 {(c),(d)}
  子集确认（局部循环未披露）；DED-027 被用在其自宣射程（"无中央银行……现代法币体系
  不在射程内"）之外，且对核心切换主张接近观众砖。核心机制可救——2022 的储备冻结与
  2011 的评级下调在对手方风险上有质差，判据可事前化地重校准——判 needs_revision，
  4 required + 3 should。

# ============================================================
# 标准红旗 (1-10) — 逐条攻击
# ============================================================

standard_red_flags:
  1_brick_conclusion:
    verdict: pass
    note: |
      L4-009 的非平凡内核——"金价在两个离散体制间切换，切换由法币信用越阈触发，
      切换后主导引擎/弹性/买家构成同时改变"——不在任何单条父推论结论中：
      - DED-029 只给四个单因素方向引擎，且显式声明多因素交互归 L4（"每个 C_i 只做
        单因素方向预测"）——它明确拒绝在引擎冲突格给出净预测，更不给"相关性本身
        随体制变化"的命题。
      - DED-028 讲同一法币内 SOV/MOE 解耦时序，不讲金价，不讲体制。
      - DED-030 讲 S/F 不对称→定价权在持有者，是静态结构事实，无门控、无触发、
        无体制概念。
      - DED-027 讲媒介地位的锁定与换主，不讲价格动力学。
      "体制切换+相变边界"不是任何父推论结论的复述。通过。

  2_cell_empty_prediction:
    verdict: needs_revision
    severity: required
    note: |
      预测 (v) 的空格声明——"重定价期（独立确认）+ C1 仍稳定主导 + 无储蓄端配置迁移"
      预测为空——表面上是真经验主张，但有一个未披露的结构问题：

      复合判据的四个指标中，(a) 央行购金量与 (b) COFER 美元份额变化【本身就是储蓄端
      配置迁移】。falsifiability (b) 要求证伪窗口满足"央行购金/储备结构/私人金条需求
      均无迁移"——若重定价期的确认恰好用了 (a) 或 (b)，则"无储蓄端迁移"被构造性排除，
      该格在这些确认路径下【逻辑上不可能非空】。空格的真实可检验域收窄为：仅当重定价
      由 {(c) 主权 CDS/信用事件, (d) 替代结算份额} 子集确认（≥2 即 c+d 同时越阈）时，
      格 (v) 才是活的经验主张。

      这不是致命循环——(c)+(d) 确实构成一条与储蓄端正交的确认路径，空格仍非同义反复。
      但当前文本把 (a) 的双重身份只在"判别 vs 先行时序"维度上披露（limitations），
      未披露 (a)(b) 与证伪格 (v) 的这层共享。须显式限定：格 (v) 与 falsifiability (b)
      的检验只在"迁移无关确认子集 {(c),(d)}"上执行，并把双重身份披露从预测 (ii)
      扩展到 (v)。

  3_measurement_orthogonal:
    verdict: pass_with_concern
    note: |
      主轴正交性成立：体制分类输入（购金吨数/COFER 份额/CDS/结算份额）全部独立于
      金价；被预测量（相关性结构/弹性/时序）测于金价与利率市场。anti_talisman (1)
      明文禁止由金价反推体制。dominant_engine 沿用 DED-029 的四条独立测量轴。

      两点 concern（不挡但须记录）：
      (a) regime_price_elasticity 的回归中，需求量（含央行购金）既参与体制窗口的
          选择（判据 a）又作为弹性回归的自变量——窗口按高购金选择后再在窗口内回归
          购金对价格，存在范围限制（range restriction）与选择效应；作者已诚实标注
          内生性与"条件相关非因果弹性"，但未标注窗口选择效应。
      (b) 阈值（+1σ/上四分位/-0.3/-0.1）声称"预注册"，但标定发生在已知 2022-2024
          与全部历史样本之后——这是回溯性理论构建的固有限制，真正的检验力在未来
          窗口。应诚实加注 in-sample 标定风险（与红旗 #7 的发现联动后此点升级，
          见 RF-1）。

  4_excluded_outcomes:
    verdict: pass
    note: |
      六条排除全部按事前可测渠道划：点位/时点预测（条件命题 vs 日历预测的类型区分）、
      高频波动（时间尺度，继承 DED-029）、供给冲击（S 通道，可独立识别供给事件）、
      其他避险资产（对手方风险结构，可事前判别）、商品体制内权重微调（以"C1 主导权
      未失+相关性未断裂"划界——注意此条依赖相关性读数，但它是排除"噪声"而非排除
      "反例"，且体制归属本身仍由独立判据定）、金本位时代（制度事实，事前可判）。
      无按结果收缩射程的结构漏洞。通过。

  5_classification_bin_match:
    verdict: pass
    note: |
      两档体制对应被救对象（两套定价规则），分档数匹配。corr ≤ -0.3 与 corr ≥ -0.1
      之间留了缓冲带（-0.3 至 -0.1 不强行归类），这是纪律而非漏洞。离散 vs 连续之争
      交给 Bai-Perron/Markov vs TVP 的模型比较裁决，档位之争有可执行的统计判别。
      一个潜在第三态——C2（通胀预期）主导的"通胀体制"——被 Fisher 结构吸收：C2 上升
      通常伴随实际利率（名义-通胀预期）下降，金价上涨与 C1 负相关读数一致，落入
      商品体制格而不产生分类真空。dominant_engine 的 limitations 诚实承认共变窗口
      只能给否定性结论（C1 主导权丧失），且核心主张只需要否定性结论。通过。

  6_anti_talisman:
    verdict: pass_with_concern
    note: |
      四条护身符条款方向正确且比多数 L3 更硬：(1) 体制归属禁由金价反推、相关性断裂
      是被预测量非分类输入；(2) 商品体制内预测失败不得用"悄悄切了体制"消化；
      (3) 先行指标须时间戳独立确认；(4) 灰区占比>1/3 触发主动降格——这条给了推论
      自毁开关，罕见的诚实。

      concern：条款 (4) 的执行现状已经出了事实问题——文中"灰区约 8 年/占比约 16%"
      的粗读建立在对判据 (a) 字面的错误应用上（见 #7）。按判据字面重算，2011-2021
      的多数年份指标 (a) 单独越阈、应计入灰区，灰区占比显著高于 16%（初步重估
      20-28% 区间），虽仍可能低于 1/3，但"当前粗读"必须重算——否则条款 (4) 形同虚设。
      归入 RF-2。

  7_real_world_anchor_fact_check:
    verdict: needs_revision
    severity: required
    note: |
      主锚点事实核查（多数通过）：
      - 2022 年 G7 冻结俄央行约 3000 亿美元储备——属实。
      - 央行购金 2022 约 1082 吨 / 2023 约 1037 吨 / 2024 约 1045 吨（WGC）——属实。
      - TIPS 实际利率 -1%→+1.5~2%、金价 1800→2700+（2024）——属实。
      - 2013 年 ETF 减持约 900 吨、金价约 -28%——属实（WGC ETF 流出约 880 吨）。
      - 1968 年 3 月伦敦金池崩溃、1971 年 8 月关闭黄金窗口、1980 年 1 月 850 美元
        峰值、1990 年代央行净卖出 400-500 吨/年、金价阴跌至约 250 美元——均属实。
      - 2022 后金价-实际利率相关性衰减被多家机构记录——属实。

      【两处事实错误——集中在 2013-2015 反例的消化上，且是承重错误】：
      (i) "2013-2015 年购金量处于历史均值附近（未越 +1σ 阈值）"——错。判据 (a) 的
          字面是"年化超过【过去 20 年】均值 +1σ"。2013 年的过去 20 年窗口（1993-2012）
          包含 1990 年代-2000 年代央行部门大规模净卖出（CBGA 时代年净卖 400-500 吨），
          该窗口均值为负或近零；2011 约 457 吨、2012 约 569 吨、2013 约 629 吨的净买入
          远超该低基线的 +1σ，且自 2010 年转净买后连续季度净买入成立。按判据字面，
          指标 (a) 自约 2011 年起【持续越阈】。
      (ii) "无储备信用事件"——错。判据 (c) 明文将"评级下调、债务上限危机"列为可编码
          离散事件：2011 年 8 月标普下调美国主权评级、2011/2013 年两次债务上限危机、
          2010-2012 年欧债危机（欧元是主要储备货币，其发行体的主权 CDS 利差剧烈展宽）
          ——判据 (c) 在 2011-2013 窗口按字面多次触发。

      后果：按预注册判据字面，2011-2013 满足"≥2 指标同向越阈"→ 应判为重定价期。
      而该窗口的现实是招牌格预测的反面（见 counterexample_hunt CE-1）。2013-2015
      counterexample 的 "consumed_as_support" 状态建立在这两处错误之上，不成立，
      必须重写。归入 RF-1。

  8_definition_vs_prediction:
    verdict: pass
    note: |
      "法币信用越阈→定价结构整体同变"是可证伪预测而非定义：触发由独立复合判据事前
      判定，结构改变由三个独立可测的输出（相关性断点/弹性差/时序）验证。falsifiability
      (a)-(e) 每条都有可执行的统计判别，其中 (a) 直接压在核心增量上且作者承诺"承认
      降格即 rejected 或改写回脚注"——条件是在做预测，不是在下定义。通过。

  9_enumeration_exhaustiveness:
    verdict: pass
    note: |
      "两体制"的枚举按判据本身定义：体制=主导引擎的离散状态，判据=C1 主导权存否
      （dominant_engine 的否定性判别）。逻辑上主导引擎有四种可能（C1-C4 各主导），
      但 C2 主导与 C1 测量轴在 Fisher 结构上反向联动（见 #5），C3/C4 主导在共变
      窗口内不要求区分（limitations 已诚实声明只需否定性结论）——两档在"C1 主导 vs
      C1 主导权丧失"这一伞级判据下穷尽。挑战者维度作为第三轴显式列出而非塞进两档。
      通过。

  10_primary_suspect:
    verdict: pass
    note: |
      primary_suspect 指得准——体制判别的独立性（灰区过宽风险 + 判别指标与先行指标
      共用购金量的循环风险回升路径）正是本轮审查实际打穿的位置（#2/#6/#7 全部落在
      这个 suspect 的射程内）。作者对自己最弱腿的预判与独立审查的实际发现重合，
      这是 falsification_trace 质量的正面证据。secondary（DED-028/027 射程外推只伤
      (ii)/(iv)）与 unlikely（S/F 事实、四引擎方向性）定位也合理。通过。

# ============================================================
# L4 专属红旗 (11-17) — 逐条攻击
# ============================================================

l4_exclusive_red_flags:
  11_spectator_brick:
    verdict: needs_revision
    severity: required
    note: |
      逐一移除每条 L3 父推论，检验核心结论（体制切换+相变）是否仍成立：

      移除 DED-029 → 引擎清单与"多因素交互归 L4"的接口消失，"主导权转移"无从定义。
      核心塌。✓ 非观众砖。

      移除 DED-030 → 无法解释年增量占存量 0.5% 的央行购金为何能压倒实际利率引擎；
      "相变"退化为"相关性碰巧变了"。核心的幅度机制塌。✓ 非观众砖。

      移除 DED-028 → 预测 (ii)（储蓄端先行）塌，体制判别失去独立于价格的早期信号。
      但核心切换主张（相关性断裂+弹性放大）仍立——DED-028 承担的是一个可分离的
      预测模块而非核心机制。⚠ 半承重：必要于 (ii)，非必要于核心。可接受（L4 允许
      各父承一面），但其跨部门外推已被 secondary_suspect 诚实标注。

      移除 DED-027 → 只有预测 (iv) 与 falsifiability (e) 塌。核心切换主张、招牌格、
      相关性断裂、弹性不对称、储蓄端先行【全部不受影响】——falsifiability (e) 自己
      承认"砍掉天花板命题，核心切换主张不连带"。DED-027 对核心结论的机制贡献
      ≈ 零，它挂载的是一个附属的天花板 caveat。⚠⚠ 对核心而言接近观众砖。

      更严重的是：DED-027 的这份贡献还是【射程外应用】。DED-027 falsifiability 明文
      "适用区间：商品货币时代的自发交换网络（无中央银行/法定货币/固定兑换率的制度
      强制）；现代法币体系不在射程内"。L4-009 把它用于现代央行储备配置——步骤 2 的
      辩护（"其排除的是法定货币比价强制，不是官方部门的自愿配置行为"）与父推论
      自宣的"无中央银行"字面直接冲突。一个 verified 父推论在其射程外的应用，实质上
      是一条未经验证的前提——预测 (iv) 的 L3 支撑名不副实。

      修正要求（三选一或组合）：
      (a) 将 DED-027 从承重父推论降格为"射程扩展的辅助前提"——在 statement 与
          derivation 中显式标注：预测 (iv) 依赖 DED-027 机制逻辑向央行储备域的
          未验证外推，属本条自担的经验赌注，不享受 DED-027 verified 状态的背书；
          同步修改 emergence_demonstration.necessity 中"四条各承一面，无观众砖"的
          表述——诚实承认 DED-027 只承预测 (iv) 一面且该面是外推。
      (b) 或砍掉预测 (iv) 与挑战者格，本条变为三父复合（多父合力格仍有 ≥2 个，
          不伤 verified* 分档条件）。
      (c) 或先回 DED-027 走反馈流程扩展其射程（成本高，不推荐在本条内解决）。

  12_trivial_conjunction:
    verdict: pass_with_concern
    note: |
      平凡合取检验：L4-009 是否只是"四引擎存在(029) AND 储蓄先跑(028) AND 供给无
      弹性(030) AND 赢家通吃(027)"的拼接？

      不是。合取版本给不出以下三样东西：
      (a) 招牌格的净预测——DED-029 在"重定价×高利率"格显式出射程（引擎冲突），
          单纯 AND 四条父推论在该格仍然沉默；只有"新增边际买家的动机在 C3/C4 通道、
          对 C1 不敏感、且因 DED-030 的存量争夺结构成为边际定价者"这个交互命题
          才能把该格填上。
      (b) 相关性作为体制指示器——DED-029 给恒定方向（C1 恒负），"相关系数本身
          结构断裂"换了被预测量的类型，非任何父推论的 AND。
      (c) 放大器的门控——DED-030 的预测 (iii)（需求冲击直接推升金价）原文是无条件的；
          L4-009 主张商品体制中该放大器休眠（边际流量被高弹性层吸收）——这实际上
          【修改了】父推论预测的适用条件，是交互而非合取。

      concern（不挡但须诚实）：核心声称的"离散相变"本身在父推论中没有出处——
      BR-L2-024 是连续谱，DED-028 明文说 SOV 逃逸是"个体资产配置决策的连续转移"
      （其相变只在 MOE 崩塌端），DED-030 是静态结构。离散性的机制来源（边际定价者
      身份的切换可产生不连续的结构改变）在 steps 中被断言而未被推导。作者已把离散性
      的存活压在断点检验上并预注册了降格条款（emergence_type 注释），这是诚实的，
      但"为什么是断点而非渐变"的机制论证应补——见 SF-1。

  13_emergence_missing:
    verdict: pass
    note: |
      【本轮核心产出——独立多父逐格判空归属分析（审查者亲自重做，非复核作者版本）】

      第一步——抽取每条父推论的核心自变量：
      - DED-029 → 自变量=四引擎各自的独立测度（TIPS/盈亏平衡/CDS/VIX），输出=单因素
        方向；显式边界=多因素冲突时无净预测。
      - DED-028 → 自变量=法币信用下滑速度，输出=SOV 先于 MOE 的时序结构；不含价格。
      - DED-030 → 自变量=S/F 档位+持有者弹性分层，输出=定价权归属与需求冲击敏感性；
        不含触发条件。
      - DED-027 → 自变量=六维加权得分+网络正反馈，输出=媒介地位锁定/换主；不含价格
        动力学；射程=商品货币时代（见 #11）。

      第二步——笛卡尔积表（法币信用{平稳,重定价} × 实际利率{低,高}，被预测量=
      金价方向+相关性结构+弹性+时序）：

      格 [平稳×高] → 金价承压、相关性强负、弹性低。
        归属：方向与相关性由 DED-029 C1 单父强制（单因素主导片段）。弹性低由
        DED-030 的持有者分层+L4-009 的门控给出——严格说 DED-030 原文预测 (iii)
        是无条件的需求敏感，"商品体制中冲击温和"是 L4-009 对 DED-030 的条件化。
        标注：【单父核心（DED-029）+ 门控修饰（DED-030×L4 自身）】。非合力格。

      格 [平稳×低] → 金价受支撑、相关性强负、弹性低。
        归属：DED-029 C1 单父强制。标注：【单父格】。

      格 [重定价×低]（2008-2011 型）→ 上涨方向+不成比例幅度+储蓄端先行。
        归属：方向由 DED-029 C3 单父可给；【幅度的不成比例】需 DED-029（引擎给
        方向）+ DED-030（存量争夺给倍数）合力——DED-029 无幅度机制、DED-030 无
        触发判据，缺一即只剩"会涨"或"会放大但不知何时"；【先行结构】需 DED-028
        （储蓄端无法律缓冲最先动）+ DED-029（信用通道定义"动"的方向）合力。
        标注：【方向单父，幅度需 029+030 合力，时序需 028+029 合力】。合力格 ✓。

      格 [重定价×高]（招牌格，2022-2024 型）→ 金价可创新高+相关性衰减/翻正+
        弹性放大+储蓄端先动。
        归属：DED-029 单父在此格【显式无净预测】（两引擎反向，出其自宣射程）——
        这是关键：该格不是"父推论预测被加强"而是"父推论沉默处被填上"。填格需要：
        DED-029 提供引擎分类与 C3 通道（谁在买、为什么买）+ DED-030 提供为什么
        少量购金能压倒 C1（存量争夺+无供给缓冲+边际卖家上移）+ DED-028 提供切换
        已发生的独立时序证据（储蓄端先动）。移除三者中任何一个，该格预测不完整：
        无 029 则无"主导权转移"的定义，无 030 则解释不了幅度（0.5% 增量 vs 引擎
        对抗），无 028 则失去独立于价格的切换确认。
        标注：【三父合力格 ✓✓——本条 L4 资格的承重格】。

      第三轴（挑战者维度）：[重定价×数字资产获机构级配置] → 金的体制性上涨弱于
        历史同类期。
        归属：名义上 DED-027+DED-029 合力，但 DED-027 在此为射程外应用（#11），
        该格的"合力"有一条腿踩在父推论射程外。标注：【合力格*（带射程外星号），
        不应计入 verified* 分档条件 (b) 的合格合力格数】。

      空格（预测 v）：[重定价（{c,d} 子集确认）× C1 稳定主导 × 无储蓄端迁移] 预测
        为空。按 #2 的修正限定确认子集后，此空格是真经验主张、可被填上证伪。

      结论：即使剔除挑战者格（射程外星号），仍有 ≥2 个格需要 ≥2 父合力
      （[重定价×低] 的幅度与时序、[重定价×高] 的完整格预测），其中招牌格是
      三父合力。涌现门槛通过——这不是 L3 chaining。通过。

  14_weak_parent_premise:
    verdict: pass_with_concern
    note: |
      四条父推论状态核查：DED-027 verified / DED-028 verified / DED-029 verified /
      DED-030 verified。无 candidate 被用作主前提。CAP=3、天花板 verified/verified*
      的声明与 Rule D 一致。形式上通过。

      三点 concern（实质性的"弱父"变体，不由状态字段捕捉）：
      (a) DED-030 自带 epistemic status 诚实声明——其最 distinctive 预测"零经验检验"、
          三个 supporting anchor 均为方向性示意、跨事件弹性对比"尚未完成"。L4-009 的
          预测 (iii)（弹性体制不对称）直接压在这条证据最薄的父推论上，且 L4-009 的
          regime_price_elasticity 也自认"正式检验未完成、干净货币体制窗口仅两段"。
          verified 状态传递了，证据厚度没有传递——应在置信度语言中体现。
      (b) DED-028 的时序机制原文射程是"同一法币体系内 SOV/MOE"，跨部门外推到主权
          储备配置者已被 secondary_suspect 诚实标注——可接受，但注意其给出的是
          "储蓄端先于支付端/汇率端"的排序，不直接给"购金量先于金价"的排序（见 SF-3）。
      (c) DED-027 射程外应用（见 #11，已入 required）。

  15_anchor_theft:
    verdict: pass
    note: |
      复合锚点核查——2022-2024 锚点是否只是重复某条父推论的单机制锚点？
      不是。DED-029 对 2022 案例的处理是"边界反例，归 L4"（其 counterexamples 原文），
      DED-030 的锚点是 1971 后 AISC 偏离与 2013 首饰弹性，DED-028 的锚点是津巴布韦/
      委内瑞拉/阿根廷/魏玛，DED-027 的锚点是三文明媒介收敛与铝价崩塌。L4-009 的
      2022-2024 锚点展示的是四机制的交互链（信用事件→购金潮→相关性断裂→不成比例
      涨幅），每个环节有独立数据源——这是父推论锚点池里没有的复合结构。1968-1980
      锚点同样是复合的（储蓄端先行 3-5 年 + 体制特征 + 1980 后切回的双侧对照）。
      诚实标注了单一事件与反事实不可得的局限。非锚点偷窃。通过。

      注（不扣分）：2022-2024 既是本条的构建动机又是招牌格证据——回溯性拟合的
      固有限制，作者以 1968-1980 第二事件与 1997-2015 基线窗口部分对冲，且给出了
      面向未来的可证伪判据。

  16_interaction_measurement_gap:
    verdict: pass
    note: |
      复合输出变量能否被测为"区别于各父单独输出"的东西？能——这是 L4-009 操作化
      设计的最强处：
      (a) regime_indicator（金价-实际利率滚动相关系数的结构状态）不是任何父推论的
          输出变量——DED-029 输出方向、DED-030 输出弹性、DED-028 输出时间差；
          "相关系数的断点结构"只属于复合层，且有明确的统计判别程序（Bai-Perron/
          Markov vs TVP 的信息准则比较）。
      (b) regime_price_elasticity（分体制弹性）测的是"同一冲击在不同体制的差异响应"
          ——这正是交互项本身，不是 A 单独+B 单独之和。
      (c) 时序链（信用越阈→储蓄端→价格）三环节各有独立数据源与时间戳。
      测量缺口不存在。通过。

      小瑕疵（归入 SF-2）：24 个月滚动窗口给断点定位 ±1 年模糊带，而
      discriminant_validity 的独有预测是"断点与信用越阈事件在 ±1 年内对齐"——
      模糊带宽度恰好等于对齐容差，对齐检验的分辨率近乎零（几乎任何 2 年内的断点
      都算对齐）。样本内切换事件又少（两次），该判别的实际检验力需要诚实标注或
      用更高分辨率的断点定位（月度 Markov 切换概率）收紧。

  17_claim_type_mismatch:
    verdict: pass_with_concern
    note: |
      claim_type=phase_transition。证据标准要求：阈值两侧案例对比 + 离散性的序列
      证据。已有：两侧案例齐备（1971-1980/2022- 货币体制 vs 1997-2015 商品体制，
      且 1980 年沃尔克紧缩给出"切回"方向）；相关性断裂有多家机构独立记录。
      缺口：裁决离散性的关键统计检验（Bai-Perron/Markov vs TVP 模型比较）
      【尚未执行】——当前对"相变 vs 连续位移"的支持是叙述性的，不是统计的。
      作者已在 emergence_type 注释中预注册降格条款（断点检验不支持离散性→降格为
      conjunction），falsifiability (a) 也承诺降格即 rejected——自毁开关齐备，
      故不判 required。但应按 DED-030 的先例在 statement 段首加 epistemic status
      诚实声明：核心判别检验未执行，当前状态为 well-formed falsifiable hypothesis。
      归入 SF-1。

# ============================================================
# 反例猎捕（必做——含"父推论都成立但交互不产生 L4 预测"的 L4 专属猎法）
# ============================================================

counterexample_hunt:
  methodology: |
    两条猎道：(1) 猎某父推论在本条射程内失效（L3 级）；(2) 猎"四父机制全部正常
    运作、复合判据也按字面触发，但 L4 预测的交互结果不出现"的窗口（L4 专属）。
    猎场：1971 年后法币储备时代全样本，重点扫"判据字面触发但体制未切"的窗口。

  type2_interaction_failure:
    cases:
      - id: CE-1
        label: "【活反例】2011-2013——复合判据按预注册字面触发'重定价期'，但 C1 教科书式主导、金价暴跌、相关性强负：招牌格预测在自家判据确认的窗口内失败"
        description: |
          判据逐项核对（全部独立于金价）：
          (a) 央行购金——2010 年央行部门转净买，2011 约 457 吨/2012 约 569 吨/
              2013 约 629 吨，连续季度净买入；判据字面的基线是"过去 20 年均值 +1σ"，
              而 2011-2013 的过去 20 年窗口（1991/1993-2012）覆盖 CBGA 时代的大规模
              净卖出（-400~-500 吨/年），均值为负或近零→ 457-629 吨远超 +1σ。
              指标 (a) 越阈。✓
          (b) COFER——美元份额 2011-2013 大体平稳。未越阈。✗
          (c) 信用事件——判据原文明文列举"评级下调、债务上限危机"：2011 年 8 月
              标普下调美国主权评级（史上首次）、2011/2013 两次债务上限危机、
              2010-2012 欧债危机（欧元为第二大储备货币，其发行体主权 CDS 剧烈展宽）。
              指标 (c) 越阈（多次、可编码）。✓
          (d) 替代结算份额——无显著跳升。✗

          (a)+(c) 两指标同向越阈 → 按预注册判据字面，2011-2013 应判定为
          "法币信用重定价期" → 本条预测货币体制启动：相关性衰减至 ≥-0.1、
          弹性放大、金价获体制性支撑。

          现实：2012 年金价滞涨，2013 年实际利率 +130bp、金价 -28%（三十年最大
          年度跌幅）、金价-TIPS 相关性稳定强负、ETF 高弹性层主导边际卖出——
          C1 单因素主导的教科书窗口（DED-029 自己的干净锚点就取自这里）。

          性质判定：这不是某条父推论失效——DED-029 的 C1 方向对、DED-030 的
          存量结构在、DED-028 的储蓄端确实在动（央行在买）——是【复合判据把
          触发条件划错了位置】：按字面它无法区分"新兴市场央行常态化储备多元化+
          发达国主权评级噪声"（2011-2013）与"储备资产对手方风险被证实"（2022
          冻结）这两类事件，而本条的机制内核（'不依赖对手方履约'从溢价属性变为
          必要属性）恰恰只由后者触发。机制没死，判据的操作化死了——分类器在
          自己的字面下产出一个填进"重定价但商品体制行为"区域的活反例。

          文中 2013-2015 counterexample 对此窗口的消化（"未越 +1σ 阈值""无储备
          信用事件"→判商品体制）依赖两处与判据字面冲突的事实错误（见红旗 #7），
          consumed_as_support 状态不成立。
        status: live_counterexample_against_operationalization
        severity: required
        required_response: |
          事前化地重校准复合判据，使其按机制内核而非宽泛信用噪声触发。可行方向
          （须一次性重注册、说明理由、并诚实标注 retrofit 风险）：
          (1) 判据 (c) 限缩为"对手方风险被证实类"事件（储备资产冻结/兑换限制/
              被排除结算），一般评级调整与债务上限博弈降为不计或半权重——理由可
              事前给出：只有前者改变"不依赖对手方履约"的属性定位，这正是 steps 2
              已写明的触发机制；
          (2) 判据 (a) 的阈值从"20 年均值 +1σ"改为对基线漂移稳健的形式（如
              "超过过去 20 年均值 +1σ 且创 20 年新高"或固定档位），避免负基线
              导致的常态化补库存误触发；
          (3) 重写 2013-2015 counterexample 分析：正确版本是"指标 (a) 按字面越阈+
              指标 (c) 有可编码事件→旧判据误触发→已重校准；重校准后 2011-2013
              判为灰区/商品体制"，并把该窗口作为判据区分度的压力测试永久保留。

      - id: CE-2
        label: "构造反例——重定价真触发但央行流量不足以夺取边际定价权：交互预测的隐含中介未被判据捕捉"
        description: |
          构造未来窗口：一次真实的对手方风险事件（判据 c 干净触发）+ 央行购金温和
          （300 吨/年，越阈）+ 同期高利率驱动 ETF 高弹性层大规模流出（900 吨/年）。
          四父机制全部正常：C3 通道在动、储蓄端在先动、S/F 结构不变。但边际定价者
          仍是高弹性层（其流量数倍于低弹性买家）→ C1 相关性不断裂、弹性不放大→
          货币体制不启动。判据判"重定价"，预测的结构改变不出现。

          这暴露交互链的隐含中介：真正的切换条件不是"信用越阈"本身，而是
          "低弹性买家的流量成为边际定价流量"——DED-030 门控激活的微观条件。
          当前判据用购金量水平做代理，未检验其相对于高弹性层流量的【相对】规模。
          2022-2024 恰好购金量（约 1000 吨）远超 ETF 流出（约 110 吨），中介满足；
          但判据本身不保证这一点。
        status: counterexample_candidate
        severity: should
        required_response: |
          两种消化任选：(1) 在体制判别或招牌格预测的前件中显式加入相对流量条件
          （央行+金条金币净流入 vs ETF+回收金净流出的比值），作为放大器激活的
          操作化中介；(2) 或诚实把此情形标注为射程边界（"信用越阈但低弹性流量
          未成为边际"的窗口预测为部分切换/灰区），并预注册其判别方式。

  type1_parent_failure:
    cases:
      - id: PF-1
        label: "DED-028 跨部门外推失效路径——储备配置由地缘联盟而非信用信号驱动"
        description: |
          若主权储备决策主要由军事依附/联盟结构驱动（如受安全保障约束的国家不减
          美元储备、对立阵营才买金），则"储蓄端对信用变化最敏感"的机制外推失效，
          预测 (ii) 的先行性变成地缘阵营变量的代理。本条 secondary_suspect 已预埋
          此路径且正确标注只伤 (ii) 不毁核心。2022-2024 的购金国构成（多为非西方
          阵营央行）与此假说一致——先行指标的机制归属（信用敏感 vs 阵营站队）
          当前不可区分。不构成净杀，但支持把 (ii) 的置信度语言压低。
        status: pre_registered_by_author
        severity: noted
      - id: PF-2
        label: "DED-030 证据厚度传导——弹性不对称预测压在零经验确认的父机制上"
        description: |
          DED-030 自认核心预测零经验检验、跨事件弹性对比未完成。L4-009 预测 (iii)
          直接消费该机制。若未来正式 event study 发现供给/需求弹性无显著差异，
          DED-030 与 L4-009 (iii) 同时受伤——falsifiability (d) 已诚实预埋
          （"DED-030 本身不受伤"的表述其实过于客气：若弹性不对称在体制间不存在，
          需回查 DED-030 的 (b) 证伪条款是否也被触发）。不构成当前净杀。
        status: inherited_thinness
        severity: noted

  hunt_summary: |
    猎到一个 required 级活反例（CE-1）：不是"父推论不成立"，也不是"交互机制不存在"，
    而是复合判据的预注册字面在 2011-2013 产出假阳性触发，使招牌格预测在自家判据
    确认的窗口内失败——同时文中对该窗口的消化依赖两处事实错误。这是 L4 评分卡
    定义的"父推论都成立但（按当前操作化）交互不产生 L4 预测结果"的标准形态，
    杀伤位置在操作化层而非机制层：2022（储备冻结）与 2011（评级噪声）的质差
    恰好是本条自己的机制内核能说清的，判据却没按机制内核划线。可定向修复。
    另猎到一个 should 级构造反例（CE-2，相对流量中介缺失）与两条已被作者预埋的
    父推论失效路径。无机制层净杀。

# ============================================================
# 与 DED-004 / DED-007 的对照
# ============================================================

non_recurrence:
  ded004_check:
    verdict: pass_with_fix
    note: |
      DED-004 死因=条件双重身份+用结果反推条件。L4-009 的主防线立住了：体制归属
      由独立于金价的复合判据事前判定，anti_talisman (1)(2) 明文封死金价反推。
      残余的 DED-004 味道在两处：(i) 判据 (a)(b) 与被预测量"储蓄端迁移"的变量共享
      （红旗 #2，已入 required——修法是限定证伪格的确认子集，不是推倒重来）；
      (ii) 阈值的 in-sample 标定。均可定向修复，非结构性死病。
  ded007_check:
    verdict: pass
    note: |
      DED-007 死因=多假说各自吸收各自案例、无共同裁决点。L4-009 相反：单一机制
      （信用越阈→定价结构同变），全部预测共享同一组独立测量变量（复合判据/滚动
      相关/分体制弹性/时序戳），falsifiability (a) 给出一锤定音的模型比较判别，
      且预注册了输了就降格的承诺。通过。

