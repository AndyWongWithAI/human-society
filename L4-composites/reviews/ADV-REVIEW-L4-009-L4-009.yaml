  - id: SF-1
    priority: should
    title: "补离散性的机制论证 + DED-030 式 epistemic status 声明"
    description: |
      父推论的输入全是连续量（BR-L2-024 连续谱、DED-028 的 SOV 连续转移、DED-030
      静态结构），"离散相变"的机制来源（边际定价者身份切换产生不连续结构改变，
      可能叠加认知/叙事正反馈）当前被断言未被推导——应在 steps 3 显式补一段，或
      诚实标注离散性是本条自身的经验赌注。同时按 DED-030 先例在 statement 段首加
      epistemic status：裁决相变的关键统计检验（Bai-Perron/Markov vs TVP）尚未执行，
      当前支持为叙述性。
  - id: SF-2
    priority: should
    title: "收紧断点-事件对齐检验的分辨率"
    description: |
      24 个月窗口的 ±1 年断点模糊带恰好等于 discriminant_validity 声称的 ±1 年对齐
      容差，对齐检验近乎无区分力。改用月度 Markov 切换概率或更短窗口做断点定位，
      或诚实降低该独有预测的检验力表述。
  - id: SF-3
    priority: should
    title: "说明预测 (ii) 领先性的机制来源并调和与 (iii) 放大器即时性的张力"
    description: |
      DED-028 给的是"储蓄端先于支付端/汇率端"的排序，不直接给"购金量先于金价的
      体制性上涨"——若 DED-030 放大器激活，价格应近同步响应购金流量。领先性需要
      额外中介（更广泛市场的重定价滞后于官方部门的配置行为/切换的认知扩散），
      应显式写出该中介或将 (ii) 的领先窗口预期收窄，避免 (ii) 与 (iii) 在时序上
      互相打架。

