        结论：剔除挑战者格后仍有 ≥2 个合格合力格（招牌格三父 + [重定价×低] 的
        幅度/时序两组两父），至少一格需 ≥2 父合力成立——非平凡合取、非 L3
        chaining。涌现门槛第三次独立确认通过。
    14_weak_parent_premise:
      verdict: pass
