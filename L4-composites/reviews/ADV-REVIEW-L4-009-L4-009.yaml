  verdict: needs_revision
  verdict_note: |
    round-3 的 RF-6/RF-7/SF-5 全部落实。本轮把前轮显式押给 round-4 的裁决做完：
    2011 利比亚窄口径经独立外部核数（CBL 行长自报海外持有约 900 亿=冻结上限
    ≈0.88% < 1%；美 300 亿/加 23 亿/UN 总口径 1500 亿含 LIA 560 亿交叉一致）
    在最不利可辩护读数下仍不过线，窄口径本身判事前可辩护（机制自洽+文本先例+
    同口径复核 1979/2022 不改判+口径方向对本条主张不利而非有利）——CE-4 关闭，
    锁定承诺未被触发。涌现第四次独立复核成立（最严读数下招牌格仍为 029+030
    两父机制合力+028 独立确认腿，另有 [重定价×低] 两组两父合力格），观众砖、
    平凡合取、测量缺口、DED-004/007 均不中。
    判 needs_revision 的唯一 required 原因（CE-6）：RF-7 给 (d) 补的阈值只对
    2022–2024 做了越阈复核，从未对 1971–2024 全史执行逐年裁决——上四分位形式
    机械触发约 25% 年份、任一-of-3 并联放大、三序列全部是 2009 年后的 young
    series（早期年份增幅按构造落上四分位），而本币互换存量最陡增长段（2011–
    2013）与 CIPS 高增长年（2018）恰与 (a) 越阈年重叠。若 (d) 在其中任一年
    越阈，(a)+(d) 双越阈→闸门 (i)/(ii) 第四次被击穿→按本条自立的最终版锁定
    承诺，后果是直接降格评估而非第五次修法。可存活角（最短历史长度规则挡住
    退化的早期上四分位）存在且方向为更严的细则补全，但该规则当前不在注册
    文本、裁决未执行——与 round-3 CE-4 完全同构的普查执行缺口，这次落在 (d)
    列且覆盖闸门年。未裁决状态下"四道闸门在完备普查下守住"与灰区占比 18.5%
    均带未决条件。
    不判 rejected 的理由：机制层与涌现结构四轮独立复核全部立住；CE-6 与前三轮
    的活反例同类——操作化执行层的完备性缺口，有事前可辩护的存活角；利比亚这
    条最重的悬案已在存活方向上被独立证据关闭。但必须明确：RF-8 的裁决若为
    "2011–2013 或 2018 的 (d) 按注册字面越阈且无可辩护的细则挡它"，本条按
    自己的锁定承诺进入降格评估，届时不再是 needs_revision。

