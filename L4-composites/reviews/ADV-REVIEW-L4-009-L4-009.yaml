author_response_round_4: |
  【RF-8——(d) 序列细则补注册 + 1971–2024 全史逐年裁决 + 闸门/灰区重验】
  (a) 细则注册（operationalization 判据 (d)，均为漏注册细则补全、方向更严或等严、
      不消耗最终版锁定承诺）：①分布窗口定死为【扩展窗】（判定第 t 年用该序列
      可用起点至 t−1 的全部年度增幅；不用全史分布——含未来数据且把 young-series
      自身爆发年计入分布，属事后前视、事前不可辩护）；②最短历史长度规则——
      序列须累积 ≥8 个年度增幅观测方可判越阈，n<8 一律不判（理由=上四分位在
      n<8 时由 1–2 个观测决定、统计退化；8 一次注册不得再调），对布雷顿森林期
      等价物序列同样适用；③三序列起点注册：CIPS 增幅观测自 2017（足龄 2025）、
      COFER 非传统自 2013（足龄 2021，2016Q4 人民币单列重分类跳升如实标注）、
      本币互换存量自 2010（足龄 2018）；④任一-of-3 多重比较显式披露（足龄后
      年机械触发率上限约 1−0.75³≈58%），"≥2 序列同向"更严形式已考虑未采
      （足龄期错开使 2-of-3 在 2025 前不可判、(d) 实质失能），按锁定承诺未来
      任何 (d) 误触发直接记真反例。
  (b) 全史逐年裁决（重点年份显式）：1968–1971 等价物（兑换请求量序列足龄）✓；
      1972–2009 序列不存在不判；2010–2017 全序列未足龄一律不判——【2011–2013
      互换爆发段（0.8→2.5 万亿，全序列最陡段）与 2015–2016 CIPS 上线初期均被
      足龄规则挡住】（互换 2011 年仅 1 个增幅观测）；2018–2020 仅③足龄，互换
      平台期增幅远低于扩展窗上四分位（分布含 2011–2013 爆发年）✗，【2018 CIPS
      高增长年因①未足龄不判】；2021 ②③足龄均 ✗；2022–2024 ③平台期（约 4.0–4.3
      万亿，个位数增幅）✗、②增幅平缓（约 0.3–0.8pp/年）未稳定越扩展窗上四分位
      ✗、①足龄自 2025（即便忽略足龄，21–43% 亦低于其扩展窗上四分位约 60–75%）
      → 【(d) 在 2022–2024 改判不越阈】。(d) 列已补进逐年编码表。
  (c) 闸门裁决结果：2011–2013 与 2018 的 (a)+(d) 双越阈击穿角【不成立】——被
      足龄规则（细则）挡住，非降格情形；细则的事前可辩护性如实登记为新关键
      承重（辩护要点=实时可执行/统计退化/改判方向对本条不利），受 round-5 复核
      ——若细则被判不可辩护且 (d) 按可辩护读数在闸门年越阈，按最终版锁定承诺
