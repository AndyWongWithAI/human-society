    hunt_summary: |
      本轮未猎到新的事实反例——前四轮的猎场（1971–2024 全史）已在高强度多轮猎捕下
      接近饱和。但 rubric 规则升级（第 18 条）使一条已关闭的旧反例（CE-4）在程序维度
      重新打开：2011 利比亚的口径注册时机问题，按第 18 条必须反向裁决→闸门 (i) 击穿
      →按本条锁定承诺触发降格评估。另有一个 should 级结构缺口（CE-10：(d) 单独越阈
      的灰区处理规则未注册）。

  non_recurrence:
    ded004_check:
      verdict: pass_with_fix
      note: |
        金价反推体制的主防线（anti_talisman 1–3 + 确认子集限定 + (c) 硬量级阈值与
        定死口径 + (d) 细则注册）在位。残余 DED-004 味道：利比亚口径的事后选择
        （红旗 #18）——虽然窄口径有 mechanism reason + textual precedent + independent
        verification，但程序上口径注册晚于反例发现。RF-9 是程序维度封口（接受第 18
        条裁决框架并执行降格评估，或论证既有文本先例构成 sufficient pre-registration），
        修后可过。
    ded007_check:
      verdict: pass
      note: |
        单一机制（信用越阈→定价结构同变）、全部预测共享同一组独立测量变量、
        falsifiability (a) 一锤定音的模型比较判别、预注册降格承诺到位。无多假说
        各吃各案例的结构。通过。

  verdict: needs_revision
  verdict_note: |
    前四轮整改全部确认落实——(c) 类别限缩+量级限定+口径定死+候选普查、(d) 阈值+
    细则+全史裁决、epistemic status+离散性论证、DED-027 降格、变量共享披露、退出
    规则、相对流量边界、时序中介——每一项都在位且方向正确（收紧或等严，无偿放松）。
    第五次独立重做的逐格判空确认招牌格（重定价×高利率）需 029+030 两父机制合力+
    028 独立确认腿，[重定价×低] 另有幅度与时序两组两父合力——涌现是真的。观众砖
    已消解，平凡合取不中，测量缺口不存在，DED-004/007 不重蹈。

    判 needs_revision 的唯一 required 原因（红旗 #18）：
    这是 L4-009 自己催生的规则第一次被用于审查 L4-009 自身。Rubric 第 18 条明确规定：
    阈值/判据须连同分子、分母、口径一次性注册；事后口径选择救推论的边界案例，一律
    按不利于推论方向裁、对应闸门不得计为守住。L4-009 的判据 (c) 在 round-2 注册 ≥1%
    阈值时未注册分子口径；round-3 发现 2011 利比亚跨线后，round-3 RF-6 才将口径定死
    为窄口径——窄口径恰好使利比亚不过线（宽口径过线→闸门 i 击穿）。按第 18 条，
    利比亚必须按不利于推论的方向裁决（宽口径过线），闸门 (i) 不得计为守住。按本条
    自身最终版锁定承诺（"再有误触发直接记操作化真反例并触发降格评估"），闸门 (i)
    击穿触发降格评估。降格不自动等于 rejected——核心机制五轮独立确认成立、其余三道
    闸门仍守住——但 status 必须从 clean candidate 路径降为带操作化缺陷标注的路径，
    且 2022–2024 锚点 confidence 须反映判据区分度的额外压力。

    辩护通道存在：challenger_reserve_allocation 模块在 round-2 前已用窄口径（"央行
    资产负债表内"），RF-6 可论证为将既有窄口径一致性扩展到 (c) 的对齐操作（非全新
    口径选择）。若此辩护被 round-6 接受，闸门 (i) 恢复守住状态。若不被接受，执行
    上述降格评估。

    另有三条 should：(i) n=8 规则登记为最终承重点（SF-10）；(ii) 证伪格 (v) 现代
    窗口归零应在 epistemic status 中更显式标注（SF-9）；(iii) (d) 任一-of-3 灰区
    处理规则预注册（SF-11）。

  required_fixes:
    - id: RF-9
      priority: required
      title: "按 rubric 第 18 条重新裁决 2011 利比亚——接受宽口径过线并执行降格评估，或论证既有文本先例构成 sufficient pre-registration"
      description: |
        Rubric 第 18 条（L4-009 判例）的直接适用。二选一：

        路径 A（接受第 18 条裁决框架）：
        (a) 承认判据 (c) 的 ≥1% 阈值在 round-2 注册时未同步注册分子分母口径——
            第 18 条的"只有数字没有口径"条件成立。
        (b) 承认 2011 利比亚的口径（央行窄口径）在 round-3 RF-6 中定死——晚于
            round-3 CE-4 反例发现——属于第 18 条的"事后口径选择"。
        (c) 按第 18 条"一律按不利于推论方向裁"：利比亚按宽口径裁决→(c) 越阈成立
            →2011 年 (a)+(c) 双越阈→闸门 (i) 击穿。
        (d) 按本条最终版锁定承诺"再有误触发直接记操作化真反例并触发降格评估"→
            执行降格评估。降格范围（预注册，一次定死）：status 从 candidate 降为
            verified*（带操作化缺陷标注：闸门 i 击穿/利比亚口径程序缺陷），同步更新
            review_summary、2022–2024 锚点 confidence（加注"判据对 2011 型主权信用
            事件（无对手方风险证实但有评级/债务上限噪声+购金潮）与 2022 型（对手方
            风险证实+购金潮）的区分依赖事后口径选择，区分度的真正检验在未来窗口"）、
            编码表 2011–2013 行（加注"按第 18 条宽口径裁决，(c) 越阈成立→本行判定
            待降格评估结论更新"）、灰区占比（若 2011–2013 从灰区翻为重定价期误判，
            灰区年数减 3、但新增 3 年误判——性质比灰区超标更重，按降格评估处理）。
        (e) 诚实声明：降格因操作化注册程序的程序缺陷（口径注册时机），非因核心机制
            被推翻——五轮独立逐格判空一致确认涌现成立。

        路径 B（辩护——既有文本先例构成 sufficient pre-registration）：
        (a) 论证 challenger_reserve_allocation 模块在 round-2 前已使用"央行资产负债
            表内"窄口径（"本推论采窄口径（央行资产负债表内），避免用宽口径事后凑数"）。
        (b) 论证 RF-6 的窄口径选择不是"见反例后新创口径"，而是"将 deduction 内已有
            的窄口径一致性扩展到判据 (c) 的分子定义"——属口径对齐（caliber alignment）
            而非口径选择（caliber selection），不满足第 18 条"口径在反例出现后才定死"
            的前提（因为窄口径在反例出现前已存在于同一 YAML 文件的其他模块中）。
        (c) 论证第 18 条的"一次性注册"要求应解释为"同一 deduction 内首次出现该概念
            时即注册"——challenger 模块的窄口径注册（round-2 前）满足此要求，RF-6
            是对已有口径的显式引用而非首次注册。
        (d) 此辩护的存活押在 round-6 审查对"既有文本先例是否构成 sufficient pre-
            registration"的独立判定。若判 insufficient，无条件退回路径 A 执行降格。

        无论选 A 或 B，必须：更新闸门状态表（显式标注闸门 i 状态及依据）、在
        operationalization 重校准披露中加注第 18 条裁决/辩护记录、在 review_summary
        中记录本轮裁决与路径选择。
      affects: operationalization.fiat_credit_repricing_period.measurement(c), real_world_anchors.boundary_cases[逐年编码表], anti_talisman_clause(4), review_summary, 闸门状态

  should_fixes:
    - id: SF-9
      priority: should
      title: "epistemic status 段显式标注证伪格 (v) 现代窗口归零——RF-8 改判后 falsifiability (b) 的历史检验力诚实声明"
      description: |
        RF-8 将 (d) 在 2022–2024 改判为不越阈后，(c)(d) 双越阈的现代实现窗口当前为
        零——仅余 1968–1971 等价物段（且该段储蓄端迁移明确存在、空格条件不满足）。
        falsifiability (b) 的检验力完全集中在未来对手方风险事件窗口（②③已足龄、
        ①自 2025 足龄）。statement 的 Epistemic status 段应显式加注："证伪格 (v)
        的 (c)(d) 双越阈现代窗口当前为零，历史检验力限于 1968–1971 等价物段（该段
        空格条件不满足→空格未被填上但亦非 clean pass）；真正的检验力在未来每一次
        对手方风险事件的 (c)(d) 双越阈窗口——本条的核心可证伪性依赖于未来观测。"
        这不是弱点隐瞒——恰恰相反，诚实标注检验力收窄是可信度的正面信号。
      affects: statement.Epistemic status, falsifiability(b)

    - id: SF-10
      priority: should
      title: "n=8 最短历史长度规则登记为最终承重点——一旦注册不得再调"
      description: |
        n=8 规则在 RF-8 中一次注册，挡住 2011–2013 互换爆发段与 2015–2016 CIPS 初期。
        n=8 的辩护（上四分位在 n<8 时统计退化）可辩护但偏宽松（四分位数稳健性文献
        建议下限通常 ≥10）。应将 n=8 显式登记为"一次注册不得再调"的最终承重点，
        并在 operationalization 判据 (d) 中加注：若后续审查判 n=8 不可辩护（如要求
        n≥10），则 2011–2013 互换序列在 n≥10 下仍被挡（2011 年仅 2 个观测），
        不影响闸门裁决——但 n 值本身的辩护强度受复核。
      affects: operationalization.fiat_credit_repricing_period.measurement(d)

    - id: SF-11
      priority: should
      title: "预注册 (d) 单独越阈时的灰区处理规则——避免 CIPS 足龄后自由裁量"
      description: |
        当前编码表仅 (a) 单独越阈判灰区（2011–2013、2018）；(d) 全史无越阈年故问题
        未触发。但 2025 年 CIPS 足龄后，(d) 任一-of-3 并联的年机械触发率上限约 58%——
        (d) 单独越阈年将定期出现。须预注册：(d) 单独越阈（(a)(b)(c) 均不越阈）是否
        计入灰区年？若计入，灰区占比将系统性上升（需重算向 1/3 线的距离）；若不计入，
        需有事前规则说明为何 (d) 单独越阈与 (a) 单独越阈的灰区资格不同（当前编码表
        对 (a) 单独越阈判灰区，对称性要求 (d) 同权）。建议形式（方向为更严）：(d)
        单独越阈计入灰区年，与 (a)/(b) 单独越阈同权——理由：四个判据指标在体制判别
        中地位平等，"灰区=至少一个指标越阈但不足两个"的定义应对四指标对称适用。
      affects: operationalization.fiat_credit_repricing_period, real_world_anchors.boundary_cases[逐年编码表], anti_talisman_clause(4)
