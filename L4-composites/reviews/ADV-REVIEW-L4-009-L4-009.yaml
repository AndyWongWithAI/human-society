            海外约 900 亿（冻结上限）；美国单边 300 亿（CBL+LAFB）；UN 总口径
            约 1500 亿含 LIA 约 560 亿。窄口径最不利上限 900 亿/10.2 万亿
            ≈0.88% < 1%。窄口径事前可辩护性判定：机制理由（重估主体=央行储备
            管理者）自洽、有 challenger 模块既有窄口径先例、同口径复核 1979
