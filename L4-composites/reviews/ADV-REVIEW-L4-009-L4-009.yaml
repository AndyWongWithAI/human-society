            结构论证（不依赖未核实数据）：(i) "年增幅越自身历史分布上四分位"按
            构造使约 25% 的观测年越阈（若分布=全史）——判据 (b) 同形式且在编码
            表实际触发了 1977–78/2017/2020 三段，证明该形式不是稀有事件生成器；
            (ii) (d) 是任一-of-3 逻辑，三序列并联进一步放大年触发率；(iii) 三
            序列可用起点均在 2009 年后，young series 的早期年份增幅几乎必然落
            在全史分布上四分位。
            经验对照（量级公开可查）：人民银行双边本币互换网络 2010 年存量约
            0.8 万亿元 → 2013 年约 2.5 万亿元，2011–2013 为整个序列的最陡增长
            段；CIPS 结算量 2018 年为高增长年。而编码表自认 (a) 在 2011/2012/
            2013/2018 均越阈（逐年创 20 年新高）。若 (d) 按注册字面在其中任一年
            越阈：该年 (a)+(d) 双越阈 → 判重定价期 → 而这些窗口是 C1 教科书
            主导（2013 金价 −28%、2018–2019 金价严格随实际利率走）→ 闸门 (i)
            或 (ii) 第四次被击穿。按最终版锁定承诺（"再有误触发……直接记为对
            本条操作化的真反例并触发降格评估，不得再修判据"），此角的后果是
            执行降格，不是第五次修法。
            可存活角：三序列在 2011–2013 部分不存在（CIPS 2015 年才上线）或
            历史过短（互换序列 2009 年起，2011 年仅 2–3 个观测，上四分位在
            统计上退化）——作者可用"最短历史长度规则"（如序列 <N 个观测不判
            越阈）挡住早期年份，且该规则对布雷顿森林期等价物序列同样适用、
            方向为更严、属漏注册细则的补全。但该规则当前【不在注册文本里】，
            (d) 列的全史逐年裁决也从未执行——与 round-3 CE-4 同构：不是判据
            字面错，是普查执行的完备性缺口，而这次的缺口恰好覆盖闸门年。
            未裁决状态下，"四道闸门在完备普查下全部守住"与灰区占比 18.5% 均
            带未决条件（(d) 若在非 (a) 年越阈还会新增灰区年，如 2015/2016 的
            互换/CIPS 增长年，占比向 1/3 线移动）。
          status: live_counterexample_candidate_pending_adjudication
          severity: required
          required_response: 见 required_fixes RF-8。
        - id: CE-4-closure
          label: "round-3 CE-4（2011 利比亚）本轮独立核数关闭——窄口径最不利上限 ≈0.88%，不过线裁决存活"
          description: |
