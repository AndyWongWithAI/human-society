id: ADV-REVIEW-L4-003
type: adversarial_review
reviews: L4-003
layer: L4-composites

人话摘要: |
  对 L4-003(公平制度演化推论)的 round_1 独立对抗审查。裁 needs_revision:核心非平凡——R1→R2→R3→R4 相变序列作为规模触发的序贯轨迹不在任何单父推论内,四条合成才构成完整演化全景;多父逐格判空经严格复核后确证至少 7 格(共 10 格)需 ≥2 父合力,其中格 9/10(R4 核心格)需三父合力——构成真正涌现。无观众砖、无弱父前提、未重蹈 DED-004/007。反例猎捕刻意攻不可逆性+序贯必然性,构造四击(易洛魁跳跃 R2、文革 R3→R2 倒退、荷兰 polder 模型可通约化、前苏联 R3 退行 R2)均被已有排除钩子或窄操作窗消化,未净到 scope 内活反例。2 条 should:①交互测量缺口——轨迹大部分是父推论测量的序贯拼合,仅"不可逆性"是真正的交互测量;②声明类型错配——claim_type=trajectory_prediction 需纵向数据,但锚点证据为跨截面拼合。此外,逐格判空中格 3/4 的 ≥2 父归属被高估(复核确认可由 DED-018 单父推出),应修正 multi_parent_cells 标注。

target: L4-003
protocol: |
  Rule B 独立对抗审查(审查者≠作者,全新独立上下文,与作者及前几轮审查者无关)。按 L4 评分卡 10 条标准红旗 + 7 条 L4 专属红旗逐条攻 + 多父逐格判空归属分析(亲自做,非信 author 自述)+ 反例猎捕(必猎"父推论均成立但交互不产生 L4 预测"的案例)。裁决五态:verified(无 required 级缺陷+L3三条+L4三条)/needs_revision(有 required/should 缺陷)/rejected(核心塌陷:平凡合取/观众砖无法消解/净杀反例/测量轴焊死)。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    这是一条【核心非平凡、无 required 缺陷、无 scope 内活反例】的 L4 候选,但存在 2 条 should 级缺陷需定向修复。

    【核心非平凡成立】R1→R2→R3→R4 作为规模触发的序贯相变序列,不在任何单父推论内:
    - DED-018:只说亲缘度 moderates 分配标准(平等/需要 vs 绩效),不说规模触发的序列,也不说"这正是大尺度演化的起点 R1";
    - DED-016:只说~150 处有一次相变(档A→档B/C),不说相变前的起点(R1)和相变后的纵深动力学(R3 稀缺调制、R4 多层冲突);
    - DED-013:只说稀缺度调节制度化后的公平标准摆荡,不说制度化从哪来、也不说制度化之后的终点;
    - DED-022:只说大规模社会多层不可通约冲突是结构特征,不说"这是从小群到大国的演化终点 R4"。
    四条序贯合成(R1→R2→R3→R4)构成任一条父推论单独给不出的完整演化全景——这是其涌现内核,通过 brick=conclusion 审查。

    【多父逐格判空复核——亲自做,不盲信 author 自述】严格抽取四条父推论的核心自变量(亲缘度×群体规模×稀缺度×嵌入层数),构建 16 格笛卡尔积(剔除非物理格后剩 10 格),逐格标注"该格预测由哪条父推论强制":
    - 格1(小+高亲缘+充裕+少层)→R1:单父 DED-018 主导(高亲缘→平等/需要) [author 同意]
    - 格2(小+高亲缘+稀缺+少层)→R1 向需要倾斜:需 DED-018(高亲缘→排除贡献)+DED-013(稀缺→选需要非平等)合力 ✓ [author 标注正确]
    - 格3(小+低亲缘+充裕+少层)→R1/R2 过渡:复核认定 DED-018 单父即可——DED-018 说"亲缘梯度→分配标准权重连续位移",低亲缘在充裕下自然处于平等→绩效过渡带。DED-016 仅确认"小规模→档A 可行"(框架约束),不参与预测分配标准的位移方向。[author 高估为需 DED-018+DED-016 合力,应修正]
    - 格4(小+低亲缘+稀缺+少层)→R2:复核认定 DED-018 单父即可——DED-018 的核心预测即"非亲缘+稀缺→绩效标准必然"。DED-013 的"稀缺→平等退潮"在此冗余(DED-018 已断言低亲缘→绩效 inevitable)。[author 高估为需 DED-018+DED-013 合力,应修正]
    - 格5(大+高亲缘+充裕+少层)→R2/R3 过渡(宗族社会):需 DED-016(>150→制度化/碎片化)+DED-018(高亲缘→宗族内平等/宗族间需制度化协调)合力 ✓ [author 标注正确]
    - 格6(大+高亲缘+稀缺+少层)→R3:需 DED-016(制度化)+DED-013(稀缺→绩效占优)+DED-018(高亲缘缓冲部分抵销)三父合力。其中 DED-018 贡献的是"缓冲"的 nuance,而 DED-016+DED-013 已给出 R3 的主体预测(制度化+稀缺→绩效)。author 标注需三父,客观评估至少需 DED-016+DED-013 两父 ✓
    - 格7(大+低亲缘+充裕+少层)→R3(福利国家倾向):需 DED-016(制度化→给定前提)+DED-013(充裕→平等回潮)两父合力。DED-016 提供 DED-013 所需的前件"制度化在场"。✓ [author 标注正确]
    - 格8(大+低亲缘+稀缺+少层)→R3(市场原教旨倾向):同格7结构,DED-016(制度化)+DED-013(稀缺→绩效)两父 ✓ [author 标注正确]
    - 格9(大+低亲缘+充裕+多层)→R4:需 DED-016(制度化)+DED-013(充裕→平等)+DED-022(多层→冲突)三父合力。这是真正涌现格——大规模后-Dunbar 社会的公平 regime 不是任何单父能描述全的 ✓ [author 标注正确]
    - 格10(大+低亲缘+稀缺+多层)→R4:同格9 结构但稀缺→绩效,需三父合力 ✓ [author 标注正确]
    复核结论:至少 7 格(格 2/5/6/7/8/9/10)需 ≥2 父合力,其中格 9/10 需三父合力。author 声称"9 格需 ≥2 父"被高估了 2 格(格 3/4 可由 DED-018 单父推出),但多父合力结构仍然稳健——非平凡合取审查通过。

    【反例猎捕——刻意构造,攻最弱腿】主动猎四类:①父推论都成立但交互不产生 L4 预测的案例(跳跃式演化/倒退/可通约化);②不可逆性主张的窄窗反例;③序贯链跳跃;④测量不可区分。
    - 击①:易洛魁联盟(内生跳过 R2)——易洛魁从亲缘群直接建立 Grand Council(proto-C),未经历漫长的"家户互惠+比例"过渡期。DED-016 审查已将其归档为 proto-C(满足档C 最低门槛),且五族内部维持亲缘公平 R1 而联盟层为 R3——此为多尺度并存,非跳过 R2。L4-003 的序贯主张是"整体社会的支配性 regime 序列"而非"每一子单元均须经历过渡"。此击未穿透——但暴露序贯主张的"支配性 regime"操作化模糊(一个社会同时有 R1/R3 时,何时判为"R3 社会"何时判为"R1→R3 跳跃"?),记 should 级关注。
    - 击②:中国文化大革命(1966-1976)作为 R3→R2 倒退——文革摧毁正式法律制度,公平从 R3(法院/法律)退行至 R2(单位互惠/革命委员会裁断),同期人口从 7 亿增至 9 亿(规模未萎缩)。L4-003 的防御:(a)持续仅 10 年,未达 operationalization 的"代际周转(>20 年)"阈值;(b)文革结束后的改革使 R3 迅速重建——整体属于短期扰动而非结构性倒退。此防御成立,但使不可逆主张的证伪窗口进一步收窄(需找到"规模未萎缩+制度退行+>20 年不可逆"的组合,历史上极为罕见)。
    - 击③:荷兰 polder 模型——三方协商制度化使跨层公平标准可通约,挑战 R4 的"永久不可通约冲突"。防御:polder 模型中的通约正是通过元制度(三方协商)实现的,冲突【存在】(定期罢工/谈判/议会辩论),只是烈度被制度化压低。空格预测仍维持为空(冲突非零)。此击未穿透,但暴露:若元制度化可显著降低不可通约性,则 R3(R4 的前身)已内含自我消解不可通约的机制——R4 的"永久不可通约"可能不是终点而是可被进一步制度化超越的阶段。此非活反例,但启示 R4 的"终点"定位可能在理论上不稳固。
    - 击④:前苏联(1922-1991)——规模大(>2.5 亿),有制度化公平(Soviet courts/labor code),但 1991 解体后法律体系崩溃,公平从 R3 退至 R2(90 年代俄罗斯的私人 enforcement/krysha 保护)。规模在解体后仍大(~1.45 亿 Russia),但 institutional collapse 是规模萎缩之外的另一退化路径。L4-003 的排除钩子:"规模萎缩"是唯一承认的退化触发条件——但苏联案例显示政治崩溃(规模不萎缩)也可触发 R3→R2 退化。这超出了 excluded_outcomes 的覆盖范围。然而,苏联是 DED-022 的 excluded_outcome("单一层霸权压制")——苏维埃体制下的法律公平从属于一党专政,不构成真正的 R3。故此击被消化,但揭示 excluded_outcomes 覆盖面之广使反例构造极难——是实操检验力 concerns 的根源之一。

    【结论:四击均未净到 scope 内活反例】。空格维持为空是 empirical observation——多制度社会在长时段上必然有可观测的公平冲突。但此结果同时揭示 should ② 的关联:因 excluded_outcomes 覆盖面广+操作窗窄,反例猎捕的"无杀伤"不完全等同于理论的强韧性。

    综上所述,L3 三条(无 required 缺陷+亲自猎捕无活反例+未重蹈 DED-004/007)+ L4 三条(涌现有效+复合非平凡性+无观众砖)中,非平凡性和涌现通过,但 L4 条件 4(涌现有效)中的"必要性"在格 3/4 有轻微高估。裁 needs_revision——2 条 should 可定向修复,不杀核心非平凡。

  red_flag_findings:
    brick_conclusion: |
      未命中(非平凡内核不在任何单父推论)。逐字核查四条父推论原文:

      DED-018(亲缘-绩效切换):核心="亲缘度 moderates 分配标准:血缘越近→平等/需要权重越高;血缘越远→绩效权重越高。不是文化偏好,是激励结构逼的"。DED-018 给出的是【亲缘度→分配标准】的 moderation 关系,不说规模、不说演化序列、不说终点。DED-018 单独能解释"为什么小亲缘群用平等分",但【不解释】"群变大以后怎么办"——它没给出 R2/R3/R4。

      DED-016(公平相变):核心="~150 人→公平维护模式相变(A面对面统一→B碎片化或C制度化),中间状态(A 在>150)不可持续"。DED-016 给出的是【一个相变点的触发条件与分支】,不说相变前的分配标准特征(R1 是平等/需要性的)、不说制度化之后的内部动力学(R3 的稀缺调制)、不说终点稳态(R4)。DED-016 单独能回答"何时公平制度涌现",但【不回答】"涌现之前流行什么标准、涌现之后标准怎么摆荡、终点什么样"。

      DED-013(稀缺-公平位移):核心="稀缺度改变群体默认的公平分配标准:越稀缺→平等退潮、向贡献/需要位移;物理可行性塌缩机制(生存线以下平等物理不可执行)是归因层的核心增量"。DED-013 给出的是【稀缺度→分配标准方向】的位移规律,它的运作舞台是"公平已制度化"(DED-016 的档C),但【不解释】"制度化本身是怎么来的、制度化之后除了稀缺摆荡还有什么"。DED-013 单独能解释"制度化后为什么有时绩效有时平等",但【不解释】R1/R2/R4。

      DED-022(多层公平冲突):核心="大规模社会中多层嵌入+不可通约标准→层间冲突是永久结构特征;f(紧密度×利益)决定选择方向"。DED-022 给出的是【后-Dunbar 稳态的一个特定特征(多层冲突)】,不说"这个稳态是从什么状态演化过来的、为什么是演化序列的终点而非中间站"。DED-022 单独能解释"大社会的公平为何永远吵个不停",但【不解释】R1/R2/R3 以及为什么 R4 是终点。

      四条合起来:亲缘群默认平等(DED-018)→规模跨 Dunbar 触发相变(DED-016)→制度化后稀缺调制(DED-013)→多层硬化终点(DED-022)。任一条只描述一个切换机制,四条按规模轴首尾相接才构成 R1→R2→R3→R4 的完整演化轨迹。这是【序贯合成的新知识】,非任一父推论的断言,也非四者的 AND 拼接(AND="A 说 X+B 说 Y+C 说 Z+D 说 W";序贯合成="A→触发B→触发C→触发D,形成演化全景")。
      非平凡内核成立。不判 required。

    nontriviality_cell_check: |
      通过但需修正格 3/4 的归属标注(见下)。亲自执行多父逐格判空,非复述 author 自述:

      【方法】抽取四条父推论的核心自变量:亲缘度(DED-018)、群体规模(DED-016)、稀缺度(DED-013)、嵌入层数(DED-022)。构建 4 维笛卡尔积(2×2×2×2=16 格),剔除物理上近乎不可能的格(如"大规模+多层的<150"等矛盾组合)后得 10 格。逐格问:此格的预测需要哪几条父推论给出?若去掉父推论 P,此格的预测是否仍然成立?

      【逐格归属——独立复核,标注与 author 的差异】:
      格1(小+高亲缘+充裕+少层)→R1:归属 DED-018。复核:同 author。DED-018 单父给出"高亲缘→平等/需要主导",R1 的核心判据即此。DED-016 仅确认"小规模下档A可行"(非必要,因为即使档A 不可行也不改变分配标准是平等/需要的事实)。单父。

      格2(小+高亲缘+稀缺+少层)→R1 向需要倾斜:归属 DED-018+DED-013。复核:同 author。DED-018 给出"高亲缘→平等/需要"(排除贡献),DED-013 在{平等,需要}之间选"需要"(因为稀缺)。去掉 DED-013→无法区分"平等主导"与"需要主导";去掉 DED-018→无法排除贡献。双父合力 ✓

      格3(小+低亲缘+充裕+少层)→R1/R2 过渡:author 标注 DED-018+DED-016。【复核修正】DED-018 的核心主张是"亲缘梯度→分配标准权重连续位移"——低亲缘处在梯度中段,自然产生平等与绩效的混合(即 R1/R2 过渡)。DED-016 在此的贡献仅是"确认小规模下档A仍可行"(框架约束),不参与分配标准的方向性预测。去掉 DED-016,DED-018 单父仍预测"低亲缘→绩效权重上升/平等权重下降"(即 R1→R2 过渡)。故本格应为【单父 DED-018】,author 高估了 DED-016 的必要性。

      格4(小+低亲缘+稀缺+少层)→R2:author 标注 DED-018+DED-013。【复核修正】DED-018 核心预测即"非亲缘→绩效必然"(见 DED-018 statement:"非亲缘群体则必然转向按贡献分——否则搭便车无法抑制、合作塌掉")。这是 DED-018 最强的方向性断言——对低亲缘,绩效是"必然"的,不依赖稀缺度。DED-013 的"稀缺→平等退潮"在此是【冗余】的——DED-018 已独立给出完全相同的方向性预测。去掉 DED-013,DED-018 单父仍给出"低亲缘+稀缺→R2(绩效主导、平等退潮)"的核心预测。故本格应为【单父 DED-018】,author 误判 DED-013 为必要。

      格5(大+高亲缘+充裕+少层)→R2/R3 过渡:归属 DED-016+DED-018。复核:同 author。DED-016 给出"大规模→制度化/碎片化",DED-018 给出"高亲缘→宗族内部平等/需要,宗族间需制度化协调"。去掉 DED-016→不知是否发生制度化;去掉 DED-018→不知宗族内外标准的分化。双父合力 ✓

      格6(大+高亲缘+稀缺+少层)→R3:归属 DED-016+DED-013+DED-018。复核:同 author(三父结构,但 DED-018 提供的是 nuance 非核心)。DED-016 给出制度化前提,DED-013 给出"稀缺→绩效占优"的主体方向,DED-018 给出"高亲缘缓冲→部分的平等/需要残留"。去掉 DED-016→制度化前提不明;去掉 DED-013→方向不明(稀缺下可能平等也可能绩效,无 DED-013 的单调预测则 R3 失去内部动力学)。至少两父(DED-016+DED-013)合力,DED-018 为辅助 nuance。≥2 父 ✓

      格7(大+低亲缘+充裕+少层)→R3:归属 DED-016+DED-013。复核:同 author。DED-016 提供制度化前提,DED-013 提供"充裕→平等回潮"的调制方向。去掉 DED-016→制度化前提不明(DED-013 的运作条件未确认);去掉 DED-013→方向不明。双父合力 ✓

      格8(大+低亲缘+稀缺+少层)→R3:归属 DED-016+DED-013。复核:同 author。同格 7 结构,稀缺→绩效占优方向由 DED-013 给出。双父合力 ✓

      格9(大+低亲缘+充裕+多层)→R4:归属 DED-016+DED-013+DED-022。复核:同 author。DED-016 给出制度化前提,DED-013 给出"充裕→平等回潮",DED-022 给出"多层→不可通约冲突必然"。这是真正三父合力格——大规模后-Dunbar 社会的完整公平 portrait 需要三机制同时在场。三父合力 ✓ 【核心涌现格】

      格10(大+低亲缘+稀缺+多层)→R4:归属 DED-016+DED-013+DED-022。复核:同 author。同格 9 结构,稀缺→绩效倾斜。三父合力 ✓ 【核心涌现格】

      【复核结论】10 格中:格1/3/4(3 格)可由单父推出;格2/5/7/8(4 格)需两父合力;格6/9/10(3 格)需三父合力(格6 的 DED-018 为辅助)。至少 7 格需 ≥2 父合力,其中 2 格(格 9/10)需三父齐全——这是足以通过非平凡合取审查的多父涌现结构。
      Author 声称"9 格需 ≥2 父"被高估了 2 格(格 3/4),但不改变"有真正的多父合力格"这一核心结论。建议修正 multi_parent_cells 段的格 3/4 标注,降为单父(DED-018)。

      空格预测(格 v:"超过 Dunbar 数+长期维持单一纯平等公平标准+不靠外部强制→为空")是真经验主张:DED-016 的独立空格是"档A在>150 时为空"(面对面统一公平),本条的空格更宽——不限于"面对面维持"而是任何形式的"单一纯平等标准"。若存在"制度化平等福利国家+完全无其他公平标准在场(即市场/按贡献/按需要等标准在该社会中不存在)"则该格被填——这在逻辑上可满足、非同义反复。但实操上,因 DED-013 预测稀缺下必然有绩效标准在场,而完全无稀缺的社会(充裕到不需要追踪贡献)在人类历史中尚未出现,故该空格的实操测试窗口极为狭窄。空格承载的是"四条父推论合起来保证此格为空"的合成逻辑,其证伪力更多依赖父推论的各自独立证伪,而非空格本身的独立检验。此非逻辑缺陷,但应诚实标注——见 required_fixes ②。

    measurement_orthogonality: |
      未重蹈 DED-007。复合输出变量 fairness_regime 的四档判定标准各自来自父推论的操作化定义,均与自变量异源:
      - group_size:人口普查/考古聚落规模/民族志记载,可独立于公平制度存在与否测得。
      - kinship_degree:谱牒重建(r)和拟制亲缘制度签名的独立在场,由独立制度签名坐实。
      - scarcity_level:人均卡路里可得性/人均资源存量/人口比,由考古/民族志/经济数据独立测。
      - number_of_embedded_layers:制度归属记录计数(承自 DED-022),各层公平标准独立编码。
      各轴独立测、anti-talisman 约束在位(继承各父推论的双向禁反推)。不判 required。

      残留【中型软点,should 关联——见 Flag 16(交互测量缺口)的详细分析】:fairness_regime 的四档判定本质上是各自父推论测量的序贯拼合——R1=DED-018 测、R2=DED-016+DED-018 边界测、R3=DED-016+DED-013 测、R4=DED-016+DED-013+DED-022 测。这种"分而测之"的策略在测量层上并未产生不可归约为父推论各自测量之和的新变量。唯一真正的"交互测量"是不可逆性——它需要纵向追踪同一社会的 regime 位移方向,且该方向不由"规模变化"单变量解释(因为有滞后效应)。这是 L4-003 在测量层的真正增量,但 just 是不可逆性这一项——轨迹的其他部分在测量上是父推论测量的时序排列。见 required_fixes ①。

    scope_hook_independent_of_result: |
      基本不命中但 external transplant 排除存在边界模糊。excluded_outcomes 三项:

      (1)"规模萎缩导致的 regime 倒退(如罗马崩溃)":由独立人口数据(>30% 持续下降>20年)事前判定。合规——规模萎缩是客观可测的,不由 regime 是否倒退反推。

      (2)"外部制度移植导致的跳跃式演化":由历史档案独立判定(是否存在殖民/法律移植/国际组织强推的证据)。【边界模糊】"外部"与"内部"的制度变革在实操中难以干净二分——明治日本的法律现代化(引入德国/法国法典)是外部移植还是内部选择?后殖民非洲国家延续殖民法律体系是外部移植的持续还是内生制度的起点?L4-003 将此划为 excluded——但若"外部移植"涵盖范围太广(几乎所有大规模社会的制度都有跨文化借鉴成分),则 trajectory 的检验样本被大幅削减。当前文件对"内生/外生"的判别标准未操作化(只说"非由外部制度输入"),建议补。

      (3)"单一层霸权用暴力压制其他层的公平主张(极权/神权国家)":承自 DED-022 的 excluded_outcome。霸权的在场由独立政体指标判,不由"无公开冲突"反推。合规。

      不判 required,但 excluded_outcome(2)的判别标准缺失记 should 级关注。

    criterion_tier_match: |
      不命中。四档(R1-R4)是谱系非二分,每档的判定标准来自父推论的操作化定义:
      - R1:按 DED-018 的操作化(亲缘度+主导分配标准),连续梯度上的支配性标注
      - R2:按 DED-016 的档A→档B/C过渡判定(规模+公平维护模式)
      - R3:按 DED-013 的操作化(稀缺度+制度化在场+主导分配标准)
      - R4:按 DED-022 的操作化(嵌入层数+可通约性+冲突频率)
      各档的尺度与父推论一致——未发生 DED-006 级档位匹配错误(如将连续量硬二分、或分档数与现象不匹配)。合规。不判 required。

    anti_talisman_cashed: |
      兑现,但有实操边界应注意。anti-talisman 约束承自各父推论:判定 group_size 不由"是否有公平制度"反推;判定 kinship_degree 不由"分配标准"反推;判定 scarcity_level 不由"支配性分配标准"反推;判定 fairness_regime 由独立行为+理由+违规反应数据逐截面标注,不由"这是一个大社会的演化"反推。各父推论均已各自经过 L3 审查,其 anti-talisman 防线在位。

      额外检查 L4 特有风险:判定"该社会处于 R1/R2/R3/R4 哪一档"时,是否因"该社会很大"就自动判为 R3/R4?文件已明确要求"逐截面独立标注",且每档的判定标准各有独立的操作化 criteria。合规。

      残留:各档的独立标注需要【完整的民族志/历史/考古数据】——这些数据在多数案例中不可得完整。实操中,对前现代社会(R1/R2/R3 过渡)的 regime 判定很大程度上依赖对有限考古证据的【解读】而非严格独立的 quantitative 标注。这是人类学/考古学固有的局限,非本推论的测量设计缺陷,但应在 limitations 中诚实标注"对前现代社会的 regime 判定多数为 qualitative 解读"。不判 required。

    anchor_fact_check: |
      三锚经事实核查无致命错,但各有一个解读级 nuance:

      (a) 新石器时代转型(Natufian→PPNA→PPNB,~12000-8000 BCE):Çatalhöyük 人口~3500-8000、Jericho~1000-2000——考古学估计存在争议区间(Çatalhöyük 的人口估计从 3500 到 10000 不等),但在数量级上(数千)无误。储存经济的"家户化"(householdization of storage)有独立的考古学证据(家户储窖 vs. 公共仓储的遗址分布)。"互惠+比例"的解释是 models of economic transition的一种,非唯一考古学共识。但文件已诚实标注 confidence=moderate("考古重建精度有限"),到位。✓ 无事实错。

      (b) 罗马崩溃后西欧的 regime 回退:罗马城人口从~100 万→~3 万(公元 5 世纪)——数量级正确,但"100 万"是高峰估计(公元 2 世纪),"3 万"是中世纪早期估计,时间跨度和萎缩幅度无误。城市化率 15%→<5%——合理的数量级估计。日耳曼习惯法取代成文法、市场萎缩→实物经济、庄园领主-附庸互惠——这些是标准的中世纪早期史学 narrative。historical accuracy 合格。✓ 但此锚支持的是"规模萎缩→regime 可逆"(即 scale 确实是驱动量),而非 L4-003 的"不萎缩时不可逆"——文件对此的诚实标注("不单独支持不可逆主张,恰恰相反")是加分项。

      (c) 现代多层公平冲突(R4 的日常经验):举报人困境、孝vs法、宗教规范vs世俗平等法——三例均为真实存在的制度性冲突。但此锚本质上是 DED-022 的锚——L4-003 将其定位为"R1→R2→R3→R4 的终点",这一"终点定位"本身是 L4-003 的解释性框架,非对事实的主张。文件已诚实标注"此锚是 DED-022 的独立锚,本推论将其定位为演化序列的终点"——到位。✓

      三锚无致命事实错。不判 required。

    definition_vs_prediction: |
      通过。关键条件均有独立于结果的可操作化定义:
      - 四档 fairness_regime:继承各父推论的操作化,不以"社会的规模/演化阶段"反推
      - irreversibility:在规模不萎缩条件下测试(R1→R2→R3→R4 方向不可逆),可被"规模未萎缩但 regime 倒退>20年"的反例推翻
      - 空格预测(v):可被"超 Dunbar+非亲缘+单一纯平等+无强制+长期"的现实案例填上推翻
      三条核心预测(falsifiability(a)(b)(c))均为可证伪的经验主张。合规,不判 required。

      但 falsifiability(b)("找到一个社会从小规模直接跳到 R4 而不经过 R2 和 R3,且不能用跳跃式制度移植解释")在实操中极难验证——因为判定一个社会"不经过 R2/R3"需要该社会从小到大的完整纵向数据,而人类历史上从小群长到大国的连续性案例极为稀缺。多数大规模社会经历了多次合并、征服、文化传播,无法提供干净的"内生增长轨迹"。此非逻辑缺陷但降低了 falsifiability(b) 的实操检验力。已在 primary_suspect 段被作者诚实标注(secondary_suspect),到位。

    enumeration_and_species: |
      不命中(本推论非 N-species 穷举枚举结构,是一个序贯相变轨迹理论)。

      但按审计精神探"缺类":四档 R1-R4 是否覆盖了规模轴上的所有可能 regime?潜在遗漏:
      (a) R0:"前公平"状态——极小规模(数人到十几人)的支配-服从关系(纯权力分配,不涉及公平规范的共享比较)。在狩猎采集群之前的早期 hominin bands 可能存在。L4-003 的起点已有 CONCEPT-fairness 在场(共享比较标准),若确实存在无公平规范的极小群,则 R1 不是起点而是演化的第二个阶段。这不证伪 L4-003(可以加 R0),但提示"R1 是起点"的假设是暗含的。
      (b) R5:后制度化(post-institutional)——如果 AI governance/global institutions 将公平标准原子化到个体算法层,绕过 DED-022 的多层嵌入(个体不再"嵌入"家族/公司/国家而直接与全球算法交互),R4 的"永久多层冲突"可能被超越。这不是历史事实而是未来 scenario,不构成对当前理论的证伪,但提示 R4 作为"终点"的理论假设可能受到未来 institutional innovation 的挑战。

      不判 required。

    primary_suspect_aim: |
      【指对,但有应诚实标注的额外脆弱性】。文件自认 primary_suspect=不可逆性——正确。三条理由:
      (1)不可逆性是 L4-003 相对四条父推论的独特增量——没有父推论预测不可逆性(DED-018 不涉时间方向、DED-016 只说相变不说不逆、DED-013 预测可逆(充裕→平等回潮)、DED-022 不涉方向性);
      (2)不可逆的操作化窗口极窄——需"规模未萎缩(代际尺度上>20 年无>30%下降)+regime 倒退"的反例,历史上罕见;
      (3)自我诚实:"最诚实的表述——L4-003 的不可逆性当前是一个有方向的假说......若最终发现 regime 只是规模的单调函数(无滞后、无方向性),则 L4-003 退化为'公平 regime 是规模的函数'——这不需要 L4,一条 L3 推论就能表达。"

      额外的脆弱性(审查者发现,文件未认):
      (a) 不可逆的窄操作窗使"通过反例检验"近乎 vacuous——不是因为理论对,而是因为找不到合适的检验案例。"规模持续扩张/维持且 regime 倒退>20 年"的社会在人类史上极少——几乎所有大规模社会都有规模波动,无波动的大型社会又是近代现象(不足代际测试)。此非逻辑缺陷,但应诚实标注:当前不可逆性主张的实证检验力极度依赖 future longitudinal data 或巧妙的 quasi-experimental design。在现有历史数据中,此主张实质上未被严厉检验。
      (b) 不可逆性在窄窗内的逻辑结构:若规模不萎缩→DED-016 的制度化持续在场→DED-013 的稀缺调制持续运作→DED-022 的多层硬化持续加深→R3/R4 的"退回"需要同时解除 DED-016/013/022 三条机制。而这三条机制各自已在 L3 层被验证为稳健——因此不可逆性本质上是对三父推论稳健性的逻辑继承,非独立的经验风险。真正独立的经验风险是:是否存在能同时 override 三父推论的新机制(如意识形态革命、大规模暴力摧毁制度、技术替代)在规模不萎缩时触发 regime 倒退。此风险理论上存在但历史上罕被观测。

      不判 required,但建议在 primary_suspect 段补充上述诚实标注。

  # === L4 专属红旗 ===

  l4_spectator_brick: |
    【逐一移除检验——无观众砖】:

    (a) 移除 DED-018:失去 R1(亲缘平等/需要的起点)的具体内容。L4-003 若无 DED-018,仍可描述"小群→大群"的公平模式变化(DED-016 的相变+ DED-013 的调制+ DED-022 的终点),但【不知道小群的公平标准是什么、为什么是平等/需要而非其他】。R1 变成黑箱——轨迹缺了第一环。DED-018 不是 spectator——它提供了 R1 的具体机制(亲缘利他→平等/需要),这是其余三父不涉及的内容。

    (b) 移除 DED-016:失去第一个相变点(~150 的触发阈值)。L4-003 若无 DED-016,则无法解释 R1 何时及为何崩掉——亲缘平等的消失没有触发条件。DED-016 的档A→档B/C 是整条轨迹的结构性铰链——无之则 R1→R2→R3→R4 的"序贯"失去"触发"。DED-016 不是 spectator——它是轨迹的时间轴引擎。

    (c) 移除 DED-013:失去 R3 内部动力学。L4-003 若无 DED-013,则"制度化后的公平标准"变成黑箱——知道制度化发生了,但不知道标准往哪摆。R3 变成静止标签而非动态机制。DED-013 不是 spectator——它提供了制度化公平的内部摆荡逻辑。

    (d) 移除 DED-022:失去 R4(终点稳态)的具体内容。L4-003 若无 DED-022,则轨迹停在"制度化"——描述不出终点长什么样。DED-022 的贡献(多层不可通约冲突为永久结构特征)是其余三父不覆盖的。DED-022 不是 spectator——它定义了轨迹的终点形态。

    结论:四条父推论各定义轨迹的一个不可替代的段落。没有观众砖——每条被移除都会使 L4 失去一个不可被其他父推论填补的独立段落。通过。

  l4_trivial_conjunction: |
    【严格复核——非平凡合取成立,但 multi_parent_cells 的格 3/4 归属被高估】:

    平凡合取的判据:L4 结论是否只是父推论结论的 AND/OR 拼接?若是"AND 拼接"=四条结论并列陈列(如"A 说 X、B 说 Y、C 说 Z、D 说 W,所以 X+Y+Z+W"),则为平凡合取,判 rejected。

    L4-003 的声称不是 AND 拼接,而是【序贯合成】——"A 的输出条件触发 B 的运作舞台→ B 的输出条件触发 C→ C 的输出条件触发 D,形成 R1→R2→R3→R4 的完整演化轨迹"。

    但"序贯合成"是否只是"AND + 时间顺序"?——即:把四条父推论的结论按规模从小到大排列(DED-018 管小、DED-016 管中、DED-013 和 DED-022 管大),加上时间箭头,是否就等于 L4-003?

    关键差异在于:序贯合成断言了"触发的必要性"——不是"这些事发生了",而是"前一件事是后一件事发生的前提条件"。具体而言:
    (a) DED-016 的触发需要 DED-018 的机制退位——不是"规模大了恰好同时发生制度化",而是"亲缘网覆盖面骤降→ DED-018 失去适用域→ DED-016 的机制上位"。这个"触发依赖"不是 AND——它是 causal interaction: DED-018 的退位是 DED-016 上位的原因。
    (b) DED-013 的运作前提是"公平已制度化"——这个前提由 DED-016 提供。DED-013 本身只说"制度化之后稀缺调制",不说制度化从哪来。序贯合成断言了"DED-016→DED-013"的 causal chain。
    (c) DED-022 的运作前提是"大规模+制度化+多层嵌入"——这个前提需要 DED-016。DED-022 本身不说多层嵌入从哪来。序贯合成断言了"DED-016→DED-022"的 causal chain。

    因此,序贯合成不是 AND 拼接——它是 causal chain:前一个机制的 output 是后一个机制的运作 precondition。这在逻辑结构上区别于"A 说 X+B 说 Y+C 说 Z+D 说 W"的并列 AND。

    证据:多父逐格判空的复核确认至少 7 格需 ≥2 父合力,格 9/10 需三父合力——证明在具体预测层面,L4-003 不是简单的父推论 AND,而是产生了需要父推论交互才能给出的预测。

    因此:平凡合取红旗未命中。但 author 在 multi_parent_cells 中高估了 2 格(格 3/4)的多父归属——应修正(见 nontriviality_cell_check)。

  l4_emergence_gap: |
    【涌现有效——格 9/10 是三父合力格,归零不成立】:

    涌现缺失的判据:有没有至少一个格子需要 ≥2 父合力?若所有格的预测均可归约为单父,则这不是 L4。

    复核确认:格 9(大+低亲缘+充裕+多层)→R4 和格 10(大+低亲缘+稀缺+多层)→R4 均需三父合力(DED-016+ DED-013+ DED-022)。单独任何一父:
    - DED-016 单独:给出"制度化→档C",但不说充足下的平等回潮(那是 DED-013)和层间冲突(那是 DED-022)
    - DED-013 单独:给出"充裕→平等回潮",但需制度化前提(DED-016 给)
    - DED-022 单独:给出"多层→冲突",但需制度化前提,且不说稀缺调节下的方向性

    格 9/10 的预测——"大规模制度化社会中多层不可通约冲突(R4),且充裕使平等回潮叠加在冲突之上"——需要三父同时在场才能完整给出。这是真正的涌现:需要 ≥2 父合力。归零不成立。

    即使格 3/4 被修正为单父(见上),格 9/10 的三父合力已足够证明涌现有效。通过。

  l4_weak_parent_premise: |
    【无弱父前提——四条父推论均为 verified】:

    INDEX.md 状态确认:
    - DED-018: verified
    - DED-016: verified
    - DED-013: verified
    - DED-022: verified

    无任何 candidate 被用作主前提。通过。

  l4_anchor_theft: |
    【锚点未偷窃——新石器时代锚是真正复合锚点】:

    逐一检查三个 real_world_anchors:

    (a) 新石器时代转型(Natufian→PPNA→PPNB):此锚被声明为"复合特有锚点"——声称不能由任一父推论单独解释。逐父验证:
    - DED-018 单独:说亲缘→平等、非亲缘→绩效,但【不说】"定居村落的家户化(householdization)这一特定过渡形态"。家户化不仅是分配标准位移,还是储存单元从公共→私有的结构转变——这超出了 DED-018 的分配标准 moderation 射程。
    - DED-016 单独:说>150→制度化或碎片化,但【不在~150 附近详述具体的过渡形态】——家户互惠+比例的考古签名不在 DED-016 的叙述中。
    - DED-013 单独:说稀缺→标准位移,但新石器转型(定居后食物更稳定)并非由稀缺驱动。
    - 只有 DED-018(亲缘网破裂→分配标准从平等转向追踪贡献)+ DED-016(规模逼近 Dunbar→面对面互惠仍在运作但覆盖面下降)合力,才能解释"家户化+互惠+比例"这一特定过渡形态——这是可观察的机制交互结果。✓ 真正的复合锚点,非偷窃。

    (b) 罗马崩溃后的 regime 回退:此锚是规模萎缩触发的逆向位移——文件已诚实标注"不单独支持 L4-003 的不可逆主张,恰恰相反"。此锚的主要价值:证明规模是驱动量(规模缩→regime 缩,方向一致)。需要 DED-016(规模萎缩→制度化退潮)+DED-018(规模缩回亲缘可及→亲缘/拟制亲缘平等模式回归)合力解释。复合。✓

    (c) 现代多层公平冲突:文件已诚实标注"此锚是 DED-022 的独立锚,本推论将其定位为演化序列的终点——这是 DED-022 单独不做的事"。L4-003 的增量是把 DED-022 的 synchronic claim 加上 diachronic 定位("这是演化序列的终点")——这一定位的确不是 DED-022 单独给的。该锚对 diachronic 定位不提供独立证据(是 cross-sectional 的 R4 样本),但至少不构成 anchor theft——因为 L4-003 对锚的【使用方式】(定位为终点)不同于 DED-022 对锚的【使用方式】(证明 R4 存在)。通过。

  l4_interaction_measurement_gap: |
    【should 级——交互测量缺口:轨迹大部分可归约为父推论测量的序贯拼合,仅"不可逆性"是真正的交互测量】:

    评分卡判据:"复合输出变量能否被测量为'区别于 A 单独 + B 单独'的东西?还是只能测到 A 和 B 各自的结果?"

    L4-003 的复合输出变量=fairness_regime 的 R1→R2→R3→R4 轨迹。其测量结构:
    - R1 = 测 DED-018 的输出(亲缘度+主导分配标准)
    - R2 = 测 DED-016(规模)+ DED-018(亲缘度)+ 分配标准,判定"互惠+比例的过渡态"——这是 DED-016+DED-018 的 joint measurement
    - R3 = 测 DED-016(制度化在场)+ DED-013(稀缺度+分配标准方向),判定"制度化-稀缺调制"——这是 DED-016+DED-013 的 joint measurement
    - R4 = 测 DED-016(制度化)+ DED-013(稀缺调制)+ DED-022(多层+可通约性+冲突),判定"多层不可通约冲突"——三父 joint measurement

    四档的测量本质上是将父推论各自的操作化变量按规模轴排列后拼接。对任一截面 t, fairness_regime(t) = f(group_size(t), kinship(t), scarcity(t), layers(t))——即父推论输入变量的函数。这【不是】一个新的、不可约的测量——这是父推论测量的组合。

    真正的交互测量出现在【纵向维度】——不可逆性: fairness_regime(t+1) 在 scale(t+1)≥scale(t) 下不会 backward-shift。这需要测量 regime 变化的【方向】,且该方向不由"scale change"单变量决定(因为有滞后)。这才是"A 和 B 合起来才测得到、单测 A 或 B 测不到"的东西。

    因此,L4-003 的复合测量结构是:横向=父推论测量的组合(非新测量),纵向=不可逆性的方向性(新测量)。前者占 trajectory 的主体,后者是独有增量。

    这本身不 kill L4——许多有效的合成理论都是将已有变量的时序拼接加上一个新方向性主张。但应诚实标注:trajectory 的绝大部分是可分解为父推论测量的,只有不可逆性方向是真正的复合测量。当前文件未做此诚实区分——建议在 operationalization.fairness_regime 段补充此标注。

    判 should,不判 required。

  l4_claim_type_mismatch: |
    【should 级——声明类型-证据标准错配:trajectory_prediction 需纵向数据,但锚点证据为跨截面拼合】:

    评分卡判据:"claim_type 宣称的东西(如 trajectory_prediction)是否有对应的证据(纵向/序列数据)?"

    L4-003 的 claim_type=trajectory_prediction(轨迹预测)。其三个支持锚:
    - 新石器转型(R1→R2):纵向/考古序列 ✓ (但只是前两个 regime 的片段)
    - 罗马崩溃(R3→R2/R1 逆向):纵向/历史序列 ✓ (但是逆向,非预测的正向轨迹)
    - 现代多层冲突(R4):横截面 ✗ (静态快照,无纵向演化数据)

    缺口:无任何锚展示从 R1 经 R2 经 R3 到 R4 的【完整正向轨迹】。锚的拼合方式是:用新石器转型证明前半段(R1→R2)存在,用罗马崩溃证明 scale-regime 关联,用现代案例证明 R4 终点存在——三段拼接合成"整条轨迹"的 narrative。

    此 mismatch 的严重度评估:
    - 对 trajectory_prediction 的核心主张(规模触发 R1→R2→R3→R4 序贯相变),完整纵向证据【理论上需要】追踪同一社会从小到大的 regime 序列。但人类历史上不存在从小群(~50人)连续内生成长到大国(~数百万人)而未经征服/合并/文化传播的单例——这使得完整纵向证据在【原则上不可得】。
    - L4-003 的证据策略是 converging consilience:不同时间尺度的片段拼接+物理/结构机制论证(规模→结构约束→regime 相变)。这在演化社会科学中是 legitimate 的(Whewell's consilience of inductions),但 claim_type 应诚实反映——建议改为 structural_trajectory(结构性轨迹,强调约束驱动的必经路径)而非 pure trajectory_prediction(经验轨迹预测,暗示可被纵向观测检验)。

    claim_type 的错配不影响核心非平凡,但影响评分卡 L4-17 的通过。建议修正 claim_type 为 structural_trajectory 或补充显式标注:"完整纵向数据因历史局限不可得,轨迹预测依赖跨案例序列拼接+结构机制论证的 converging consilience。"

    判 should,不判 required。

  counterexample_hunt: |
    【主动构造,刻意攻最弱腿,未净到 scope 内活反例】

    按 L4 反例猎捕双重标准:(A)猎"某父推论不成立"的案例(那是 L3 的事);(B)猎"父推论都成立、但交互不产生 L4 预测的结果"的案例(这是 L4 的专属任务)。

    构造以下四击,由强到弱:

    ---击①:易洛魁联盟——内生跳过 R2 的序贯链跳跃---

    案情:易洛魁五族(后六族)从亲缘群(~150/族)直接建立 Great Council(proto-C 制度,满足 DED-016 的档C 最低门槛),未经历漫长的"家户互惠+比例"的 R2 过渡。总人口~20,000,为内生制度创新(非殖民移植)。父推论状态:
    - DED-018 成立(各族内部亲缘平等/需要维持)
    - DED-016 成立(>150→proto-C 制度涌现,已归档为档C)
    - DED-013 成立(稀缺度在制度化范围内的调制——但易洛魁的制度化在联盟层,各族内部仍为 R1)
    - DED-022 成立(多族多层嵌入→冲突在场)

    交互不产生 L4-003 预测:序贯触发链预测 R1→R2→R3,但易洛魁是 R1(族内)+R3(联盟层)【并存】,非先后序列。L4-003 的"支配性 regime"操作化——当社会同时有 R1 和 R3 时,应判为 R3 社会还是"跳跃式演化"?

    防御:(1)L4-003 的序贯主张是关于"整体社会的支配性 regime"——易洛魁联盟层的确是从无到有涌现了 proto-C 制度,这本身支持"Dunbar 以上→制度涌现"的核心主张;(2)各族内部 R1 的维持说明 DED-018 的亲缘机制并未"消失"——它只是退到子系统层面,而社会整体进入了 institutionalized 阶段。此不完全匹配序贯链的"前后替换"图景,但也不构成证伪——它提示 regime 序列不是"替换"而是"累积叠加"(新 regime 叠加到旧 regime 之上,旧的不消失,但不再支配整体)。

    裁决:非活反例,但暴露 L4-003 的"支配性 regime"操作化模糊——什么时候 R1 子系统降格为"子系统的内部标准"而非社会整体 regime?这是操作化空白,记 should 级(关联 required_fixes ①)。

    ---击②:中国文化大革命——规模不萎缩下的 R3→R2 regime 倒退---

    案情:1966-1976,中国人口 7→9 亿(规模扩大,未萎缩),正式法律体系被摧毁(法院瘫痪、法律被批为"资产阶级法权"),公平规范退行至单位互惠+革命委员会裁断(近似 R2 的特征)。父推论状态:
    - DED-018 成立(家族和单位内部亲缘/拟制亲缘关系维持分配标准)
    - DED-016 成立(>Dunbar→制度化本已存在,文革摧毁了它)
    - DED-013 成立(稀缺下的分配标准——文革初期物资紧缺,绩效标准在"革命热情"话语下运作)
    - DED-022 成立(多层冲突以"路线斗争"形式表达)

    交互不产生 L4-003 预测:不可逆性主张预测"规模不萎缩→regime 不会后退"。文革期间制度大规模退行,人口在增长——形式上是 R3→R2 倒退。若此案例成立,不可逆性预测被证伪。

    防御:(1)文革仅持续 10 年,未达 operationalization.irreversibility 的"代际(>20 年)"阈值——属短期扰动,非结构性倒退;(2)文革结束后改革迅速重建 R3,证明 R3 的底层结构未被摧毁——10 年不足以构成"regime 倒退",只是 temporary institutional suspension;(3)文革期间的"革命委员会"并非真正的 R2(互惠+比例)——它是在极权框架下的强制分配,非去中心化的面对面公平。

    裁决:防御成立——文革的"倒退"未达不可逆性的时间阈值,属短期扰动。但此防御使不可逆性的证伪窗口进一步收窄:需找到"持续>20 年的制度倒退"案例,而人类历史上能摧毁制度并在 20 年内不重建的力量(如极权革命/大规模战争后长期 failed state)本身罕见。操作窗的窄化使不可逆性被"证伪"的概率极低——不是因为它对,而是因为能测试它的案例不存在。

    ---击③:荷兰 polder 模型——制度化可通约化消解 R4 的"永久不可通约"---

    案情:荷兰(>1700 万人,远超 Dunbar)通过三方协商制度(工会/雇主/政府)使跨层公平标准可通约——通过谈判将"工资增长"与"就业保障"、"环境目标"与"工业产出"交易,形成跨层的通约框架。父推论状态:
    - DED-018 成立(家庭层平等/需要在场,但在 polder 协商中非主导)
    - DED-016 成立(制度化在场——三方协商是制度化的跨层协调)
    - DED-013 成立(稀缺度调制——经济衰退时绩效标准占优,繁荣时平等回潮)
    - DED-022 成立(多层嵌入在场,冲突持续但被制度化渠道管理)

    交互不产生 L4-003 预测:R4 声称为"永久不可通约冲突"。若不可通约性可被元制度(如三方协商)【系统性地降低】——不是消除冲突,而是将不可通约转化为可通约(可交易)——则 R4 不是"不可通约"的稳态,而是"可通约化程度随元制度化而增加"的谱系。进一步:若元制度化持续深化→不可通约性持续降低→R4 的"永久不可通约"退化为"暂时不可通约,等待元制度化"——则 R4 不是终点。

    防御:(1)冲突【存在】——三方协商是冲突的制度化表达,空格仍为空;(2)可通约化是局部的——某些跨层标准仍不可通约(宗教 vs 世俗的深层价值冲突无法被三方协商交易掉);(3)元制度化本身是 R3 的延伸——荷兰 polder 模型是一种高度 sophisticated 的 R3(制度化协调),说明 R3 可部分消解 DED-022 的多层冲突,但消解不是完全的。

    裁决:非活反例——冲突仍在场。但 polder 模型展示了 R3 对 R4 的"侵蚀"效应:制度化协调(R3)越发达,不可通约性(R4)越被压缩。若这一趋势持续,R4 不是永久稳态而是被 R3 逐步消解的 transient——L4-003 的"终点"定位在长期可能不成立。这不是活反例,而是理论边界问题:制度化的延伸可能自我消解多层冲突,L4-003 的 R4 作为"终点"可能需要条件化("在没有持续元制度化建设的条件下,R4 是终点")。

    ---击④:前苏联 1991 解体后俄罗斯——政治崩溃触发 R3→R2 倒退,规模不萎缩---

    案情:苏联法律体系(R3 制度化公平)在 1991 解体,俄罗斯(~1.45 亿人)的公平规范在 1990s 退行至私人 enforcement(krysha 保护/黑帮仲裁)+单位互惠,近似 R2 特征。此倒退由政治崩溃触发,非规模萎缩。持续 10+ 年(1991-~2000s 普京重建 vertical of power 后才部分恢复 R3)。

    防御:DED-022 的 excluded_outcome:"单一层霸权用暴力压制其他公平标准"——苏联体制下的法律公平属于被一党专政的霸权压制的形式制度,不构成真正的 R3。因此苏联从未真正达到 R3→倒退不是 R3→R2 而是从"伪 R3"回归 R2。但:此防御将大部分非民主国家的制度化公平排除在 R3 之外(中国、苏联、新加坡等)——若只有自由民主国家的制度化公平算 R3,则 regime 档位的覆盖范围大幅收窄。此防御本身未错,但意味着 L4-003 的轨迹在实证上仅适用于"内生民主制度化路径",非全体大规模社会。

    裁决:非活反例(被 DED-022 的 excluded_outcome 消化)。但将"单一层霸权压制"作为 DED-022 的排除钩子,在 L4-003 的应用中会系统性地排除大量非民主大规模社会——如果这些社会的"公平"不算真正的 R3/R4,则 L4-003 的 trajectory 实际测试范围局限于自由民主国家及其前身——这窄化了理论声称的"从小群到大国的公平演化全景"的普遍性。

    === 猎捕总结 ===

    四击均未净到 scope 内活反例。但反复出现的模式——排除钩子消化大部分候选反例、操作窗极窄、regime 判定依赖 excluded_outcomes 切割——表明当前的反例猎捕"无杀伤"不完全等同于理论的强韧性,部分原因是理论的保护带(excluded_outcomes+窄操作窗+谱系化 regime 定义)使反例极难构造。

    这不构成 required 缺陷(因为各防御均有独立的事前 criteria,非事后开脱),但 should 级诚实标注:当前 theory 在实操中的反例构造窗口极窄,空格预测和不可逆性的"通过反例检验"在实证上近乎 vacuous——不是因为它们对,而是因为找不到能测试它们的案例。真正的检验力应在预测(i)(ii)(iii)的量化层面(规模-制度涌现的非线性、稀缺度-标准单调位移方向、父推论交互的空格)而非空格的定性存在或不可逆的方向性。见 required_fixes ②。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发】。三步排查:
    (1) fair_regime 的四档判定各自有独立于规模/演化阶段的操作化标准,不由"这是一个大社会"反推为 R3/R4——anti-talisman 在位。
    (2) 空格预测可被"超 Dunbar+单一纯平等+无强制+长期"的现实反例填上——逻辑上可证伪,非同义反复(与 DED-004 的"所有新意被实证推倒、改措辞也救不活"本质不同)。
    (3) 不可逆性可被"规模未萎缩+regime 倒退>20 年"的现实反例推翻——逻辑上可证伪(实操窗口窄,但 that's a measurement challenge, not logical unfalsifiability)。
    无 DED-004 式事后开脱循环。不判复发。

    DED-007(测量轴焊死):【未复发】。四自变量轴(群体规模/亲缘度/稀缺度/嵌入层数)与被预测轴(fairness_regime)均异源独立测——各承自父推论的操作化, measurement orthogonality 在位。anti-talisman_clause 双向禁反推(不得因 regime 倒退就调稀缺度/因制度在场就调规模)。不判复发。

    额外交叉检查(L4 特有):复合输出 fairness_regime 的判定是否可能因"轨迹理论预测它该处于 R_X"而调整?文件已要求逐截面独立标注,由独立数据按父推论 criteria 逐截面判定,不由"这是一个大社会的演化"反推。合规。

  required_fixes:
    - |
      [should] 修正 multi_parent_cells 的格 3/4 归属标注+补全"支配性 regime"的操作化。独立复核确认:
      (a) 格 3(小+低亲缘+充裕+少层)→R1/R2 过渡可由 DED-018 单父推出(DED-018 的亲缘梯度已是连续位移,"低亲缘→绩效权重上升"即 R1/R2 过渡),不需要 DED-016 合力。修正为"单父(DED-018)主导,DED-016 仅确认为 face-to-face 框架"。
      (b) 格 4(小+低亲缘+稀缺+少层)→R2 可由 DED-018 单父推出(DED-018 已断言"非亲缘→绩效必然"),DED-013 的"稀缺→平等退潮"在此冗余。修正为"单父(DED-018)主导"。
      此外,"支配性 regime"的操作化缺失:当一个社会同时存在 R1(子系统内部)和 R3/R4(社会整体制度层)时,如何判定"社会的支配性 regime"?此问题在易洛魁反例猎捕中暴露(族内 R1+联盟层 R3 并存)。建议补:(1)支配性 regime=覆盖社会多数资源分配决策的制度层的 regime;(2)若最高制度层为 R3 且子系统 R1 的覆盖面<社会总分配决策的 X%,则支配性为 R3;(3)若多层并存且无层级统摄,按主导(覆盖>50%决策)判。不补则 regime 序列的"一步一阶"主张在实操中无法与"多 regime 并存"区分——反例构造的靶标模糊。
    - |
      [should] 诚实标注交互测量缺口+声明类型错配,修正 claim_type 为 structural_trajectory。

      (a) 交互测量缺口:trajectory(R1→R2→R3→R4)的测量本质上是父推论各自操作化变量的序贯拼合——对任一截面 t, fairness_regime(t) 可分解为 group_size(t)+kinship(t)+scarcity(t)+layers(t) 的函数。真正的复合测量(无法分解为单父测量之和的)仅出现在纵向维度——不可逆性的方向性(regime 在 scale 不萎缩时不后退)。这不是致命缺陷(有效的合成理论可建立在已有测量之上),但应诚实标注在 operationalization.fairness_regime 段:哪些部分是父推论测量的拼合,哪些是真正的复合测量。

      (b) 声明类型错配:claim_type=trajectory_prediction 暗示有纵向追踪同一社会全轨迹的数据,但实际证据是三段跨截面拼合(新石器→前半段/罗马→reversal/现代→终点)。不存在从 R1 到 R4 的完整纵向单例——claim_type 的乐观度与证据标准不匹配。建议修改 claim_type 为 structural_trajectory(结构性轨迹——强调规模触发的约束必经路径,非经验上可被单案例纵向验证的预测),或在 falsifiability 段补充显式标注:"完整纵向数据因历史局限不可得,轨迹主张依赖 cross-sectional 序列拼合+结构机制论证的 converging consilience。可在 claim_type 保留 trajectory_prediction 但加注 methodological caveat。"
    - |
      [minor] excluded_outcome "外部制度移植"的操作化判别标准缺失。当前文件仅说"非由外部制度输入"——但大规模社会的制度变迁几乎都包含跨文化借鉴元素。明治日本的法律现代化、后殖民非洲国家、甚至罗马法在中世纪欧洲的复兴——哪些算"内生规模扩张驱动"哪些算"外部移植"?建议补最小判别标准:(1)制度变迁的主要推动力是否为本地规模增长(由独立人口数据支撑);(2)外部模型是否被本地精英主动选择并适配(而非外部强制)。不补则 excluded_outcome 的覆盖面无法在实操中评估,影响反例猎捕的有效性判断。

