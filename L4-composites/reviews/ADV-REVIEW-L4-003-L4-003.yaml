      的法律现代化（内生精英主动选择）与殖民地的法律强加（外部暴力置换）之间的边界
      在实操中仍是谱系而非二分。当前文件以"外部暴力置换 vs 内生条件变化驱动"为判据，
      方向正确但操作化精度有限。不判 required，记观察。

    criterion_tier_match: |
      未命中。公平制度配置是谱系非二分（dominant_configuration 给出了三条件连续判定 +
      混合配置条件化），各档尺度与父推论一致。锁定强度以年（时滞）和幅度（Δ配置/Δ条件
      预测）的连续量操作化。不判 required。

    anti_talisman_cashed: |
      兑现。承自各父推论的 anti-talisman 约束在位：判定亲缘度不由分配标准反推、判定
      稀缺度不由分配标准反推、判定制度化不由规模反推、判定不可通约不由冲突频率反推。
      L4 特有：判定锁定强度不由"这是一个大规模制度化社会"反推——需要独立观测条件变化
      与配置响应的时滞。不判 required。

    anchor_fact_check: |
      四锚经独立事实核查无致命错：
      (a) 中国宗族再分配：族田/义庄/族规的制度化在宋代确已存在，明清商品经济下确未瓦解。
      但"抵抗市场逻辑"是理论解释（锁定效应）而非独立事实——也可解释为宗族作为土地
      所有制单位的自身经济逻辑。文件已标注 confidence=moderate，到位。
      (b) 英法福利国家分化：Esping-Andersen 三类 typology 是标准框架，英法路径差异的
      历史叙述方向正确。但将差异完全归因于"关口初始条件锁定"是理论的强解释——其他
      因素（政治联盟结构/战争经历/阶级动员模式）在文献中有同等解释力。文件已诚实标注
      "多因交织，单因归因需谨慎"，到位。
      (c) 战时配给制→战后残骸：方向正确（配给制解除慢于建立，部分制度残留）。但"慢"
      的归因竞争（锁定 vs 官僚惯性/利益集团）已在 honest_note 中标注。confidence=
      weak-moderate，诚实。
      (d) 狩猎采集灵活摆动：!Kung/Hadza 的季节性分享规范摆动是标准民族志知识。已标注
      composite_specific=false（共享锚），诚实。
      无致命事实错。不判 required。

    definition_vs_prediction: |
      通过。三条核心预测均为可证伪经验主张：
      (a) falsifiability(a)：大规模制度化社会+稀缺度显著变化+配置在≤20年内成比例调整
      →证伪锁定迟滞。虽有"区分锁定迟滞与正常制度调整时程"的实操挑战，但逻辑上可证伪。
      (b) falsifiability(b)：两社会关口条件不同→条件趋同后配置也趋同→证伪路径依赖。
      (c) falsifiability(c)：多层冲突频率与制度变革尝试频率无正相关→证伪锁定机制链路。
      空格(vi)：制度化+多层不可通约+长期零冲突+无霸权压制→若被填则证伪。空格的前件
      组合在现实中极为罕见（因 DED-022 预测冲突必然存在），但逻辑上非空可满足——
      非同义反复。
      不判 required。

    enumeration_and_species: |
      不命中。本推论是共演锁定机制理论，非 N-species 穷举枚举结构。
      潜在缺类审查：公平制度配置的四档（平等/需要型、贡献型、需要型、混合）是否穷尽？
      当前文件以 CONCEPT-fairness(e)的种为编码框架，覆盖了主要公平标准类型。若未来
      发现新的不可归入现有种的公平标准类型，可扩展编码框架而不推翻核心锁定机制。
      不判 required。

    primary_suspect_aim: |
      指对。primary_suspect=预测(iii)锁定迟滞的正确性——最脆弱且最承重的腿。理由：
      (1) 锁定迟滞是 L4-003 相对父推论最尖锐的涌现预测（它断言 DED-013 在制度化条件
      下失效/迟滞——DED-013 不自知的边界）；(2) 区分"锁定迟滞"与"制度调整的正常时程"
      在实操中极难——需要前制度化基线或无多层冲突的制度化对照，而两者在现实中均不可得；
      (3) 若锁定迟滞被架空（制度调整速度与前制度化时期无显著差异），L4-003 退化为
      "制度有惯性"的常识复述。
      secondary_suspect="关口初始条件冻结"也指对——若制度化是渐进的（多代际过程），
      "关口时刻"的概念模糊使预测(ii)(iv)的检验困难。
      不判 required，但诚实标注已在 primary/secondary 段落地。

  l4_red_flag_findings:
    l4_spectator_brick: |
      【逐一移除检验——无观众砖，独立复核确认】
      (a) 移除 DED-018：失去"哪种公平配置在关口被锁定"的方向性——只知"有东西被锁定"，
      不知锁定了什么。R1 的平等/需要起点和路径依赖(iv)的初始条件差异均消失。
      DED-018 提供不可替代的配置方向引擎。非 spectator。
      (b) 移除 DED-016：失去制度化起点——没有 Dunbar 关口，整个锁定故事失去时间原点。
      碎片化社会（档B）中公平规范在各亚群灵活摆动，不产生跨层锁定。DED-016 提供
      不可替代的关口引擎。非 spectator。
      (c) 移除 DED-013：失去稀缺度作为选择压力和锁定突破的双重机制——关口配置的选择
      方向（充裕→平等可行，稀缺→平等塌缩）和极端冲击的锁定突破均消失。锁定退化为
      "制度一旦建立就永远不变"的绝对锁定——丧失条件性和可突破性。DED-013 提供不可
      替代的选择压力+突破引擎。非 spectator。
      (d) 移除 DED-022：失去多层互锁机制——锁定退化为普通制度惯性（单层内的既得利益
      抵抗），丧失"跨层反制→变革成本非线性上升"这一独特锁定机制。L4-003 与 North/
      Pierson 的判别（递增报酬 vs 多层冲突反馈）消失。DED-022 提供不可替代的锁定
      机制引擎。非 spectator。
      四条各载一个不可替代的机制段落。通过。

    l4_trivial_conjunction: |
      【严格复核——非平凡合取成立】
      判据：L4 结论是否只是父推论结论的 AND/OR 拼接？
      "AND 拼接"=四条父推论各自陈述、并列陈列为整体。
      L4-003 不是 AND 拼接——它是因果交互：
      (a) DED-016 创造制度化舞台→DED-018+DED-013 决定舞台上锁定的配置→DED-022
      的多层结构使配置抗拒后续条件变化的修改。
      (b) 关键证据：预测(iii)锁定迟滞——DED-013 预测稀缺→平等退潮（可逆），L4-003
      预测此效应在制度化社会中被阻滞。这是对 DED-013 的【限定】，不是 DED-013 的
      复述。若 L4 是平凡 AND，它应复述"稀缺→平等退潮"而非说"制度化后此效应减弱"。
      (c) 多父逐格判空确认至少 7 格需 ≥2 父合力——若为平凡 AND，每格应可由单父推出。
      通过。非平凡合取。

    l4_emergence_gap: |
      【涌现有效——格 E（锁定迟滞）和格 G（路径依赖）是真正涌现格】
      判据：有没有至少一个格子需要 ≥2 父合力？若所有格均可归约为单父→这不是 L4。
      独立复核确认：
      - 格 E（锁定迟滞）：需要 DED-013（稀缺位移压力）+ DED-022（多层锁定抵抗）。
      单独 DED-013 不知制度化阻滞其效应；单独 DED-022 不知阻滞的是什么方向的变化。
      - 格 G（路径依赖）：需要四父合力。单独任何一父只看到"某个条件影响制度"，
      看不到"初始条件差异→收敛条件下配置仍不同"。
      两格均为真正的涌现格——需要父推论交互才能给出、单父产生不了的预测。
      归零不成立。通过。

    l4_weak_parent_premise: |
      【无弱父前提——四条父推论均为 verified】
      INDEX.md 状态确认：DED-018 verified / DED-016 verified / DED-013 verified /
      DED-022 verified。无任何 candidate 被用作主前提。通过。

    l4_anchor_theft: |
      【锚点未偷窃——四锚中三锚为真正复合锚点】
      (a) 中国宗族再分配：需 DED-018（高亲缘→平等/需要）+ DED-016（族规成文=制度
      化）+ DED-022（宗族vs市场的层间张力）合力解释。任一条单独只解释配置的一个侧面。
      真复合锚点 ✓
      (b) 英法福利国家分化：需四父合力——DED-016（关口制度化）+ DED-018（初始亲缘
      度相似但制度传统不同）+ DED-013（后续稀缺度波动相似）+ DED-022（多层锁定维持
      差异）。解释的是"条件趋同后配置仍不同"——这是四父合力的涌现预测。真复合锚点 ✓
      (c) 战时配给制→战后残骸：需 DED-013（稀缺触发配给制建立）+ DED-022（多层锁定
      使解除迟滞且留残骸）。解释的是"稀缺→需要的建立快于充裕→平等的回退"这一不对称——
      单父给不出。真复合锚点 ✓
      (d) 狩猎采集灵活摆动：文件已诚实标注 composite_specific=false——此锚是 DED-018
      +DED-013 的共享锚，在本推论中用作"无锁定基线"对照。使用方式诚实。非偷窃。
      四锚中三锚真正复合，一锚诚实标注为共享。通过。

    l4_interaction_measurement_gap: |
      【round_1 指出的 should 已修复——锁定强度是真正的复合测量】
      round_1 指出：轨迹（R1→R2→R3→R4）在测量上是父推论测量的序贯拼合，只有不可逆性
      是真正的复合测量。当前文件已重构为"制度共演锁定"框架（非原 R1→R4 顺序轨迹）且
      新增 measurement_decomposition_note：
      - 公平制度配置的截面测量诚实地标注为可分解为父推论测量的组合
      - 真正不可分解的复合测量 = 锁定强度（需 Δ条件 × Δ配置响应 × Δ时滞 的交互项）
      锁定强度的测量是否确实"区别于 A 单独 + B 单独"？
      - DED-013 单独测：稀缺度变化→分配标准变化（方向+幅度）
      - DED-022 单独测：多层嵌入→冲突频率
      - 锁定强度测：在制度化+多层在场时，DED-013 预测的位移幅度被 DED-022 阻滞的
      【残差】（实际位移 vs DED-013 预测位移的差值 × 时滞）
      这个残差需要 DED-013 和 DED-022 同时在场才能计算——单独测任一条得不到。满足
      "区别于 A 单独 + B 单独"的判据。
      实操挑战（已在文件中诚实标注）：需要前制度化基线或无多层冲突的制度化对照来标定
      "DED-013 预测位移"，而该基线在现实中不可得。不判 required，已充分披露。

    l4_claim_type_mismatch: |
      【round_1 指出的 should 已修复——claim_type 已改为 co_evolution】
      round_1 指出 claim_type=trajectory_prediction 需要完整纵向数据但证据为跨截面拼合。
      当前文件：
      (a) claim_type 已改为 co_evolution——共演不要求单案例完整纵向追踪，跨案例的
      机制三角测量（converging consilience）是 co_evolution 主张的合法证据形式。
      (b) methodological_caveat 诚实标注：完整纵向单例数据原则上不可得，证据策略实质
      为 cross-case mechanism triangulation。
      (c) co_evolution 与证据的匹配度：co_evolution 的核心主张是"制度与公平规范互相
      塑造对方的演化轨迹"——这可以通过比较不同关口条件社会的后续轨迹差异（预测 iv
      路径依赖）+ 同一社会内稀缺度变化前后的调整速度对照（预测 iii 锁定迟滞）来检验，
      而不需要单个社会从 R1 到 R4 的完整序列。
      修正到位，不判 required。

  counterexample_hunt: |
    【独立构造，刻意攻最弱腿，未净到 scope 内活反例】

    按 L4 反例猎捕双重标准：(A) 猎"某父推论不成立"（L3 的事）；(B) 猎"父推论都成立、
    但交互不产生 L4 预测"（L4 专属任务）。集中攻(B)。

    ---击①：瑞典福利国家扩张与收缩——制度化后配置显著变化，挑战锁定迟滞---

    案情：瑞典（制度化贡献型市场经济，>Dunbar）在 1930s-1970s 将公平配置从贡献型
    显著扩展为平等/需要型（全民福利国家），在 1990s-2000s 又部分收缩。全周期中配置
    随稀缺度（大萧条/战后繁荣/石油危机/全球化）显著摆动。若锁定如 L4-003 预测的
    强大，何以配置在~40 年内经历了如此显著的双向变化？
    父推论状态：DED-018（低亲缘→贡献 baseline）、DED-016（制度化在场）、DED-013
    （稀缺度波动驱动配置位移）、DED-022（多层：工会/雇主/国家）全部成立。
    交互不产生 L4 预测：预测(iii)说制度化后配置抗拒变化、迟滞于条件变化。瑞典的
    福利扩张在~40 年内完成（可比于英国的类似扩张）——若比较"同等稀缺度变化在制度
    化社会的调整速度"与"前制度化基线"，能测出显著迟滞吗？
    防御：(a) 扩张耗时~40 年（~2 代际），相对于前制度化狩猎采集社会的季节性规范
    摆动，这本身就是巨幅迟滞——锁定预测的是"比前制度化慢"，不是"完全不动"。
    (b) 瑞典福利国家的【形式】受既有贡献型配置的显著约束——保留了市场框架、灵活
    劳动力市场、强工会协商——这是锁定制约了平等的形式而非阻止了平等。此防御成立
    但依赖于"前制度化基线"这一不可得的对照。
    裁决：非活反例。但暴露核心测量挑战——在无前制度化基线的情况下，"迟滞"的判定
    必然是定性/比较的而非定量的。

    ---击②：日本明治维新法律西化——一代人内系统性替换制度化公平配置---

    案情：Tokugawa 日本（高亲缘+制度化封建公平体制）在 1868-1912 年间系统性移植
    西方法典（德国民法/法国刑法），公平配置从基于身份/亲缘的封建体制转为基于契约/
    权利的现代体制。耗时仅~30 年（一代人代际门槛附近）。
    防御：(a) 属于 excluded_outcome"外部制度移植"——明治精英为应对外部威胁（黑船）
    而主动移植西方制度。但此防御的边界模糊：明治精英是内生决策者、"移植"是内生
    战略选择——与"外部暴力置换"有质的区别。(b) 家族层的公平规范（ie 制度/亲族义务）
    在民法中部分延续——制度层的快速变化未完全穿透家族层的锁定。方向性支持"多层
    锁定使不同层的变革速度不同"。
    裁决：非活反例。再次暴露 excluded_outcome "外部移植"的操作化模糊性——当内生
    精英主动选择外部模型时，算"内生"还是"外生"？当前判据"外部暴力置换 vs 内生条件
    变化驱动"方向正确，但明治案例落在灰色带。

    ---击③：锁定与普通制度惯性的观测等价性——最深层的结构挑战---

    所有制度都有惯性（沉没成本/适应性预期/既得利益——North 1990）。DED-022 的多层
    冲突反馈作为锁定的【特定机制】，在观测上如何与普通制度惯性区分？
    需要比较：(i) 有多层冲突的制度化社会的调整速度 vs (ii) 无多层冲突的制度化社会
    的调整速度。但 DED-022 自身断言所有大规模制度化社会均有多层冲突——控制组不存在。
    可能的部分解法：within-case 比较"单层制度变革"与"跨层制度变革"的速度差异——
    若跨层变革系统性慢于单层变革（控制变革幅度/政治阻力等其他因素），则支持 DED-022
    的多层锁定机制独立于普通制度惯性。此检验尚未被执行，但逻辑上可设计。
    裁决：非活反例。这是 L4-003 最深层的测量挑战——不是理论逻辑有缺陷，而是核心机制
    的独立经验标识在实操中极难建立。已在 methodological_caveat 中诚实披露。

    ===猎捕总结===
    三击均未净到 scope 内活反例。猎捕的模式——锁定与普通惯性的观测等价性、excluded_
    outcome 的宽覆盖、前制度化基线的不可得——表明"反例猎捕无杀伤"不完全等同于理论
    的强韧性。但这些是历史制度分析领域固有的证据局限，不是 L4-003 特有的设计缺陷。
    文件已通过 methodological_caveat 和 measurement_decomposition_note 诚实披露这些
    局限，不构成 required 缺陷。

  non_recurrence_of_ded004_007: |
    DED-004（不可证伪循环）：【未复发】。三步排查：
    (1) 公平制度配置的判定独立于规模/演化阶段——anti-talisman 在位。
    (2) 空格(vi)可被"制度化+多层不可通约+长期零冲突+无霸权压制"的现实反例填上——
    逻辑上可证伪，非同义反复（与 DED-004 的"所有新意被实证推倒、改措辞也救不活"
    本质不同）。
    (3) 锁定迟滞(预测 iii)可被"制度化社会+稀缺度显著变化+配置在≤20 年内成比例调整"
    的反例推翻——逻辑上可证伪。实操窗口窄但 that's a measurement challenge, not
    logical unfalsifiability。
    无 DED-004 式事后开脱循环。不判复发。

    DED-007（测量轴焊死）：【未复发】。四自变量轴（亲缘度/群体规模/稀缺度/嵌入层数）
    与被预测轴（公平制度配置/锁定强度）均异源独立测。锁定强度的三分量（Δ条件、Δ配置
    响应、Δ时滞）各自独立——条件变化由生态/人口数据测，配置变化由制度文本/行为编码测，
    时滞由历史时间轴独立标定。无"自变量与因变量共用同一指标"的焊死。不判复发。

  required_fixes: []

  observations: |
    以下为审查者观察，非 required/should 缺陷——仅诚实标注供作者和后续审查者参考：

    (1) 锁定与普通制度惯性的观测等价性是 L4-003 最深层的结构挑战——所有大规模制度
    化社会均有多层冲突（DED-022 的必然推论），无"无多层冲突的制度化社会"作为控制组。
    Within-case "单层 vs 跨层变革速度"的比较是可设计的检验策略，若未来能执行将显著
    增强锁定机制的独立经验标识。当前此缺口不影响 verified 判定（因 methodological_
    caveat 已诚实披露），但若未来实证显示跨层变革与单层变革的速度无显著差异，
    L4-003 的锁定机制将面临严峻挑战。

    (2) excluded_outcome "外部制度移植"的判别标准（外部暴力置换 vs 内生条件变化驱动）
    在实操中落在谱系而非二分——明治日本的法律现代化是内生精英主动选择外部模型，
    殖民地的法律强加是外部暴力置换，但两者之间存在连续的灰色带（如后殖民国家延续
    殖民法律体系、EU 成员国接受 EU 法优先）。当前判据方向正确，但操作化精度有限。
    若未来审查要求，可补独立操作化段。

    (3) 预测(iii)锁定迟滞的"前制度化基线"在现实中不可得——所有现存大规模社会均
    已制度化，小型前制度化社会（狩猎采集群）的稀缺度变化幅度/频率与大规模社会
    不可比。这意味着锁定迟滞的"迟滞程度"无法被定量标定——只能通过定性比较
    （如"制度调整远慢于季节性规范摆动"）或跨案例比较（如"关口条件不同的两社会
    的调整速度差异"）来间接支持。这在当前不是 required 缺陷，因为文件已诚实披露
    （measurement_decomposition_note + methodological_caveat），但限制了理论的
    定量检验力。

