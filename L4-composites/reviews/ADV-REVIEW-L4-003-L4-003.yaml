round_2:
  reviewer: "独立对抗审查者 (round 2, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: verified
  verdict_note: |
    经过独立的、逐条的 17 红旗审查 + 亲自多父逐格判空归属分析 + 主动反例猎捕，本轮裁定 verified。

    【round_1 修复验证——四条 should 全部已落地】
    (a) multi_parent_cells 格 3/4 归属修正：当前文件已将低亲缘两格标注为"DED-018 主导"，
        DED-013 降为可行性约束贡献（非方向性必要）。修正到位。
    (b) 支配性 regime 操作化：已新增 operationalization.dominant_configuration，三条件
        判据（最高制度层 / ≥50% 覆盖面 / 混合配置条件化）。操作化到位。
    (c) 交互测量缺口：已新增 measurement_decomposition_note，诚实区分截面测量（父推论
        测量的分解组合）与纵向复合测量（锁定强度 = Δ条件 × Δ配置响应 × Δ时滞）。标注到位。
    (d) claim_type 错配：已从 trajectory_prediction 改为 co_evolution，新增 methodological
        _caveat 标注证据策略实质为 cross-case mechanism triangulation。修正到位。

    【核心非平凡性——独立复核确认稳健】
    L4-003 的核心涌现预测（预测 iii：制度化社会中 DED-013 的稀缺→标准位移被锁定阻滞/
    迟滞）不在任何单父推论内。逐一验证：
    - DED-013 预测稀缺→平等退潮是【可逆的】（充裕后平等回归），不含"制度化使此位移迟滞"
    - DED-022 预测多层→冲突，不含"冲突形成变革阻力（锁定）"
    - DED-016 预测>150→制度化，不含"制度化后的配置抗拒变化"
    - DED-018 预测亲缘度→分配标准，不含"制度化后亲缘度变化不再自由驱动标准调整"
    锁定预测是四条父机制交互的产物——DED-022 的多层冲突反馈对 DED-013 的位移效应施加
    阻滞，这是任一条父推论不自知的边界。非平凡合成成立。

    【多父逐格判空——亲自重建，不盲信 author 自述】
    参数空间 = 关口前亲缘度(高/低) × 关口前稀缺度(充裕/稀缺) × 纵向(制度化后稀缺度变化)。

    关口截面 4 格：
    格 A（充裕×高亲缘→制度化平等/需要）：需 DED-018（高亲缘→平等/需要）+ DED-013
    （充裕→平等可行）。去掉 DED-018 失方向，去掉 DED-013 失平等/需要二级区分。两父合力 ✓
    格 B（充裕×低亲缘→制度化贡献）：DED-018 单父主导——DED-018 断言"低亲缘→贡献必然"，
    方向性由 DED-018 独立强制。DED-013 仅提供"充裕下多标准可维持"的可行性上下文，非方向性
    必要。单父主导 ✓（与 round_1 修正一致）
    格 C（稀缺×高亲缘→制度化需要）：需 DED-018（高亲缘→{平等,需要}）+ DED-013（稀缺→
    {贡献,需要}）取交集={需要}。任一条单独不能唯一确定"需要"。两父合力 ✓
    格 D（稀缺×低亲缘→制度化贡献）：DED-018 单父主导——"低亲缘→贡献必然"已在 DED-018
    中独立断言。DED-013 的"稀缺→排除平等"冗余于 DED-018 的方向性。单父主导 ✓

    纵向 5 格：
    格 E（制度化后充裕→稀缺→配置位移幅度<前制度化）：需 DED-013（稀缺→位移压力）+
    DED-022（多层锁定抵抗位移）。两父合力 ✓【预测 iii 的核心涌现格】
    格 F（制度化后稀缺→充裕→配置不自动回归平等）：需 DED-013（充裕→平等回潮压力）+
    DED-022（锁定阻滞回潮）。两父合力 ✓【锁定不对称——稀缺→贡献快于充裕→平等】
    格 G（路径依赖：不同关口条件→趋同后配置仍不同）：需 DED-016（关口）+ DED-018
    （初始亲缘）+ DED-013（初始稀缺）+ DED-022（锁定维持）。四父合力 ✓【最强涌现格】
    格 H（极端稀缺冲击→锁定突破+残骸约束重配）：需 DED-013（物理塌缩压倒锁定）+
    DED-022（既有配置残骸约束）。两父合力 ✓
    格 I（空格：制度化+多层不可通约+长期零冲突+无霸权压制→为空）：需 DED-016（制度化
    前提）+ DED-022（不可通约→冲突必然）。两父合力 ✓

    合计：9 格中 7 格需 ≥2 父合力（4 格两父 + 1 格四父），其中格 E（锁定迟滞）和格 G
    （路径依赖）是真正的涌现格——需要父推论交互才能给出的预测。涌现硬门槛通过。
    与 round_1 结论一致：至少 7 格需多父合力，非平凡合取审查通过。

    【反例猎捕——独立构造，刻意攻最弱腿】
    按 L4 反例猎捕标准，猎"父推论均成立但交互不产生 L4 预测"的案例。

    击①：瑞典福利国家扩张与收缩（1930s-2000s）——制度化贡献型社会在充裕期快速建立平等型
    福利国家（~40 年），在稀缺期部分收缩。全周期中公平配置显著变化，挑战锁定迟滞主张。
    防御：(a) 扩张耗时~40 年（~2 代际），本身慢于前制度化社会的季节性规范摆动——支持方向性
    的"迟滞"；(b) 瑞典福利国家保留了贡献型市场框架——锁定制约了平等的【形式】（社会民主
    模式而非命令经济），而非完全阻止变化；(c) 1990s 收缩是部分的——核心福利制度存活。
    裁决：非活反例。但暴露了核心测量挑战——区分"锁定迟滞"与"制度调整的正常时程"需要
    前制度化基线，而该基线在现实中不可得（所有大规模社会均已制度化）。

    击②：日本明治维新法律西化（1868-1912）——高亲缘+制度化的 Tokugawa 公平体制在 ~30 年
    （一代人）内被西方民法典/刑法典系统性替换。速度挑战锁定主张。
    防御：(a) 属于 excluded_outcome"外部制度移植"——明治精英主动移植西方模式以应对外部
    威胁；(b) 家族层（ie 制度/ Confucian 伦理）的公平规范在民法中延续（家督继承/亲族义务）——
    制度层的快速变化未穿透家族层的锁定。裁决：非活反例，但 excluded_outcome "外部移植"的
    边界模糊性再次暴露——明治精英的"内生选择"与"外部移植"在实操中难以干净二分。

    击③：锁定与普通制度惯性的观测等价性——所有制度都有惯性（改变需要时间），DED-022 的
    多层冲突作为锁定的【特定机制】与普通的"制度调整慢"在观测上如何区分？需要比较
    "有多层冲突的制度化社会"与"无多层冲突的制度化社会"的调整速度——但 DED-022 自身断言
    所有大规模制度化社会均有多层冲突。控制组不存在。
    防御：可通过比较"单层制度变革"与"跨层制度变革"的速度差异进行 within-case 检验——
    若跨层变革的系统性慢于单层变革（控制其他因素），则支持 DED-022 的多层锁定机制独立于
    普通制度惯性。此检验尚未被执行，但逻辑上可行。
    裁决：非活反例，但这是 L4-003 最深层的测量挑战——不是理论逻辑有缺陷，而是核心机制
    的独立经验标识在实操中极难建立。

    猎捕总结：三击均未净到 scope 内活反例。但反复出现的模式——锁定与普通惯性的观测等价性、
    excluded_outcome 的宽覆盖——意味着"反例猎捕无杀伤"不完全等同于理论的强韧性。这是
    历史制度分析固有的证据局限，已在 methodological_caveat 中诚实披露。

  red_flag_findings:
    brick_conclusion: |
      未命中。逐一核查四条父推论原文后确认：L4-003 的核心预测（预测 iii：制度化社会中
      DED-013 的稀缺→标准位移被锁定阻滞/迟滞）不在任何单父推论内。
      - DED-018：亲缘度 moderates 分配标准，不含"制度化后亲缘效应被锁定"。
      - DED-016：>150→制度化/碎片化二择，不预测制度化后的配置动力学。
      - DED-013：稀缺度→标准位移且【可逆】（充裕后平等回归），不含"制度化使位移迟滞"。
      - DED-022：多层→冲突，不含"冲突形成变革阻力（锁定）"。
      锁定预测是 DED-013（位移压力）与 DED-022（多层阻力）交互的产物——DED-013 不自知
      其在制度化条件下的失效边界。不判 required。

    nontriviality_cell_check: |
      通过。亲自重建多父逐格判空（参数空间=亲缘度×稀缺度×纵向）：
      9 格中 7 格需 ≥2 父合力，其中格 E（锁定迟滞，DED-013+DED-022）和格 G（路径依赖，
      四父合力）是真正的涌现格——需父推论交互才能给出的预测。
      Author 在 round_1 后的修正（低亲缘两格降为 DED-018 单父主导）经独立复核确认正确。
      关口格 B（充裕×低亲缘）和格 D（稀缺×低亲缘）确可由 DED-018 单父推出方向性——
      "低亲缘→贡献必然"是 DED-018 的独立断言，DED-013 仅提供可行性上下文。
      涌现硬门槛（至少一格需 ≥2 父合力）由格 E/G 双重满足。通过。

    measurement_orthogonality: |
      未命中 DED-007 级焊死。四自变量轴（亲缘度/群体规模/稀缺度/嵌入层数）与被预测轴
      （公平制度配置/锁定强度）均异源独立测，承自各父推论的 anti-talisman 约束。锁定
      强度的测量（Δ条件 × Δ配置 × Δ时滞）的三分量各自独立测——条件变化由生态/人口
      数据测，配置变化由制度文本/行为编码测，时滞由历史时间轴独立标定。不判 required。

    scope_hook_independent_of_result: |
      基本不命中。两项 excluded_outcomes：
      (1) 尚未制度化的社会——由 DED-016 的 A/B/C 档事前判定，独立于"是否锁定"。
      (2) 外部征服/殖民强加的公平制度置换——由独立历史档案判定（是否存在征服/殖民/
