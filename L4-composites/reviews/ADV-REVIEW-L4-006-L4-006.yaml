  2_cell_empty_prediction:
    verdict: needs_revision
    severity: required
    note: |
      【逐格判空——独立重建笛卡尔积并逐格归属】

      第一步: 提取每条父推论的核心自变量(对照原文)

      DED-016: 群体规模(<Dunbar vs >Dunbar)。因变量=公平维护模式(A/B/C三档)。
      核心机制: 规模→信任断裂+层级嵌套+身份衰减→面对面公平不可维持→碎片化或制度化。

      DED-023: TP强度 × INT强度(各自独立测)。因变量=规范结构类型(四象限)。
      核心机制: TP由旁观者利益占比驱动(BR-L2-018), INT由发育窗口条件驱动(BR-L2-019), 二轴正交。
      排除范围: "正式法律系统中的规范执行——制度化惩罚混淆TP测量"。

      DED-025: M1(受害叙事)×M2(道德创业者)→通胀; M3(TP瓦解)+M4(代际INT断裂)→紧缩。
      核心机制: 通胀需要主动推力(合取), 紧缩是熵增默认(PHY-001)。
      排除范围: "法律强制推动的道德标准变化——属L4-006的'法律替代道德'路径, 不在DED-025射程内"。

      DED-024: 对等性信号×意识形态资源→内化瓦解轨迹(四阶段, 刚性顺序, 阶段3不可逆)。
      核心机制: 阶段2(比较)=观察到他人违规无后果→遵守者感到被利用(sucker effect)。
      此为对等性信号断裂→逐层瓦解的形式模型。

      第二步: 笛卡尔积逐格归属分析

      轴定义:
      X1: 群体规模 {<Dunbar, >Dunbar} — DED-016
      X2: 法律制度化 {无, 弱, 强} — DED-016 档C + L4-006自增强弱二分
      X3: 道德 TP×INT {高TP+INT, TP-only, 碎片化} — DED-023 + DED-016档B(碎片化)

      共计 2×3×3 = 18 格。排除物理上不可能的格: <Dunbar+强法律(3格: 高TP+INT/TP-only/碎片化)。
      剩余 15 格。L4-006 原文声称"17个有意义格"并列出 G1-G14 共14格——存在计数不一致。
      【需要修正: 将"17"改为"15"或说明计数依据。】

      逐格归属(独立验证, 对照四条父推论原文):

      —— <Dunbar ——
      G1: <D, 无法, 高TP+INT → 面对面道德, 秩序稳定。
      归属: DED-016档A 单父强制(规模内面对面可行)+DED-023 表征为(+TP,+INT)。
      DED-016 单独预测此格稳定(档A在<Dunbar时存在且普遍)。DED-023 提供结构标签但不改变预测。
      → 近平凡。DED-016 solo。

      G2: <D, 无法, TP-only → 外部执行无内化, 暂稳。
      归属: DED-023 单独预测(+TP,-INT)格的行为签名。无父推论强制此格为空。
      → DED-023 solo。

      G3: <D, 无法, 碎片化 → 小群不应碎片化, 若出现则反常。
      归属: DED-016档A隐含此格近空(<Dunbar群体维持共享身份→碎片化罕见)。
      → DED-016 隐含。平凡负预测。

      G4: <D, 弱法, 高TP+INT → proto-C制度+强道德。
      归属: DED-016(档C门槛)+DED-023(完全道德象限)。需两条父推论——但经验上罕见(L4-006自认"非核心贡献格")。
      → 2父合力(弱, 非核心)。

      G5: <D, 弱法, TP-only → 制度+外部执行。
      归属: DED-016+DED-023。→ 2父合力。

      —— >Dunbar ——
      G6: >D, 无法, 高TP+INT → T2格: 法律真空+道德自我维持。
      L4-006 标注: 需 DED-016+DED-023+DED-024 三条合力。
      独立验证:
      - DED-016: 预测>Dunbar+无制度→碎片化(档B)。故 DED-016 预测此格不稳定/近空。L4-006 承认此格"罕见"——这与 DED-016 一致。DED-016 在此格中的作用是【负向约束】(说明为什么罕见)而非正向驱动。
      - DED-023: 预测(+TP,+INT) 可自我维持。DED-023 未涉及规模限制——它不禁止 >Dunbar+高TP+INT 的存在。但 DED-023 明确排除法律语境——此格中无法律, 故在 DED-023 射程内。→ 正向机制贡献。
      - DED-024: 提供 INT 不瓦解的边界条件(对等性信号完好+发育窗口满足)。→ 正向机制贡献。
      → 3父合力(含DED-016负向约束)。属于真合力但需注意 DED-016 是阻力而非推力。

      G7: >D, 无法, TP-only → TP正在瓦解, 无INT兜底, 无法接管→霍布斯式失序。
      归属: DED-016 单独强制(档A不可持续→碎片化或制度化, 两者皆无→失序)。
      → DED-016 solo。平凡。

      G8: >D, 无法, 碎片化 → DED-016档B标准路径。
      归属: DED-016 单独强制。→ DED-016 solo。平凡。

      G9: >D, 弱法, 高TP+INT → O格: 交叠区。
      L4-006 标注: 需 DED-016+DED-023+DED-025 三条合力。
      独立验证:
      - DED-016: 制度化存在(弱法归于档C谱系)。→ 正向。
      - DED-023: (+TP,+INT) 表征+自我维持条件。→ 正向。
      - DED-025: 道德端熵增默认(M3/M4)→交叠区需持续能量维护。
        但 DED-025 的熵增机制适用于【任何】有道德标准的场景, 不因法律存在而改变。
        它在 G9 中的贡献是通用的(任何含道德的格都面临熵增), 非交互特有的。
      - 法律端熵增(PHY-001→组织熵增): 来自 PHY-001/AXIOM-004, 非四条 L3 父推论。
        L4-006 的 "两端熵增"论证的一半来自 L0 而非 L3 父推论——这合法但不增加父推论合力计数。
      → 2父合力(从L3父推论角度)或3父合力(若计入DED-025的通用熵增)。
      DED-025 的贡献为通用层(适用于任何格), 非此格特有的交互贡献。

      G10: >D, 弱法, TP-only → 弱法律+外部执行。
      归属: DED-023(+TP,-INT)+DED-016(弱法存在)。→ 2父合力。

      G11: >D, 弱法, 碎片化 → 弱法律桥接碎片化道德——张力格。
      归属: DED-016(碎片化+制度化并存)+DED-023(内容独立性)。→ 2父合力。

      G12: >D, 强法, 高TP+INT → C1风险格——【本轮审查的核心战场】。
      L4-006 标注: 需 DED-016+DED-023+DED-024+DED-025 四条合力(交互级涌现核心格)。
      独立验证——逐父推论检验其机制是否被正确调用:

      【DED-016】提供强法的规模条件(>Dunbar 使制度化成为必要/可能)。
      角色: 背景条件——解释"为什么有强法"。不参与"法律如何挤出内化"的机制链。
      贡献强度: 弱(背景条件, 非机制引擎)。此角色与 DED-016 原文机制一致。✓

      【DED-023】区分 TP 和 INT——没有此区分则看不到"INT被挤出而TP仍在"。
      角色: 结构表征——使 C1 的预测可被测量。
      贡献强度: 强(C1 的预测对象 [+TP,+INT]→[+TP,-INT] 依赖 DED-023 的象限分类)。
      与 DED-023 原文一致。✓
      但需注意: DED-023 明确排除法律语境("正式法律系统中的规范执行...混淆 TP 测量")。
      在 G12 中, 法律在场——DED-023 的 TP 概念能否在此语境中有效测量存疑(见红旗 #14 的 scope 讨论)。

      【DED-024】——【关键发现: 机制误用】
      L4-006 的 C1 机制链陈述:
      "强法律系统性替代 TP 的执行功能→个体将遵守归因于外部强制('怕被抓')而非内在价值('该做')→
      触发 DED-024 的阶段 2 比较('别人也不内化, 凭什么我内化')→代际内化断裂(DED-025 M4)..."

      DED-024 原文的阶段2机制(对照 DED-024 derivation step 2):
      "阶段2(比较): 对等性信号断裂完成——观察到他人违规无后果→遵守者感到被利用(sucker effect)"


      【机制不对齐】DED-024 的阶段 2 核心是【sucker effect】——你观察到别人【不遵守】且无后果,
      从而感到"我守规矩是冤大头"。这需要: (a) 可观察的他人的违规行为, (b) 违规确实无后果。

      但在 C1 的强法律场景中(G12: 强法+高TP+INT):
      - 人们仍在【遵守】(因为法律强制) —— 他们只是将遵守归因于外部而非内部
      - 不存在可观察的大规模违规行为 —— 法律在场确保了合规
      - "别人也不内化" 是一种【归因推断】(我猜别人只因为怕被抓才遵守), 不是【行为观察】(我看到别人不遵守)

      DED-024 的 sucker effect 需要行为观察, C1 调用的是归因推断——这是不同的心理学机制。
      C1 实际调用的机制更接近【过度合理化效应】(overjustification effect, Deci & Ryan):
      外部强制→个体将行为归因于外部原因→内在动机被挤出。这是自我决定理论(SDT)的核心发现,
      不在 DED-024 的射程内。

      可能的修复路径:
      (a) 重构 C1 为两阶段模型:
          阶段A(过度合理化): 法律在场→归因外化→INT 渐进削弱(月-年级, 由 SDT 机制驱动, 非 DED-024)
          阶段B(DED-024接管): 当法律弱化(政权更迭/崩溃)→实际违规行为出现→DED-024 的 sucker effect
          激活→加速瓦解(周-月级)
          此两阶段模型与现实锚点(东德)一致: 40年 Stasi→INT 渐进削弱(阶段A, 过度合理化)→
          1990统一后法律骤变→大规模规范崩盘(阶段B, DED-024 sucker effect)
          但需诚实标注: 阶段A 的机制(过度合理化)来自 SDT 外部理论, 非 DED-024。
      (b) 或论证 DED-024 的阶段2 可以扩展至"归因推断驱动的比较"——但此扩展会改变 DED-024 的
          操作化条件(阶段2 当前要求可观察的他人违规, 非归因推断)。此路径需走 Rule B 修订 DED-024。

      当前标注"四条合力"不成立: DED-024 在此格中被赋予了一个它不包含的机制。
      实际合力格最多为 3 父(DED-016背景+DED-023表征+DED-025 M4代际传导),
      且 DED-016 的贡献为弱背景条件。

      → 【required 缺陷】G12 的"四父合力"标注不成立——DED-024 的机制被误用。
      C1 需要修复以减少对 DED-024 的声称, 或诚实标注外部机制桥接。

      【DED-025】M4 代际传导——若一代人 INT 低, 下一代发育窗口内对等性信号弱→INT 进一步降低。
      此机制与 DED-025 原文一致, 但需注意 DED-025 将"法律驱动的标准变化"排除在其射程外。
      在 C1 中, INT 削弱的初始触发是法律——且 DED-025 的排除条款明确将此类情况导向 L4-006。
      故 DED-025 的 M4 在此处是合法使用(代际传导机制本身不分法律/非法律语境)。✓

      总评 G12: DED-016(弱背景)+DED-023(强表征, 但 scope 扩展需论证)+DED-025(代际传导, 合法)。
      DED-024 的贡献不成立(机制误用)。最多 3 父合力, 且最强贡献者(DED-023)的 scope 扩展缺少论证。

      G13: >D, 强法, TP-only → C1 充分发展态。
      归属: DED-016(强制度)+DED-023(+TP,-INT格的行为签名)+DED-024(瓦解路径)+DED-025(M4)。
      同 G12 的 DED-024 机制误用问题——从 +TP+INT 到 +TP-INT 的瓦解路径中,
      DED-024 的 sucker effect 与过度合理化效应的区分同样适用。
      → 同 G12 的 required 缺陷。

      G14: >D, 强法, 碎片化 → C2 格。
      L4-006 标注: 需 DED-016+DED-023+DED-024 三条合力。
      独立验证:
      - DED-016: 碎片化(档B)+强制度共存 → 提供碎片化与制度化并存的结构前提。✓
      - DED-023: 内容独立性→不同亚群对同一行为道德化不同→法律必须在冲突标准间选边。✓
        (DED-023 排除法律语境, 见红旗#14 scope 讨论)
      - DED-024: 阶段3认知重组("这法律本就不对")→法律合法性受损。
        在 C2 中, 落选方成员的认知重组对象是【法律】而非【道德规范】——这与 DED-024 的
        默认路径(认知重组对象为被违反的规范)不同。但 DED-024 的替代路径(意识形态转换可跳过
        阶段2直接进入阶段3)提供了一条更接近的机制: 当个体从"法律是正当的"转为"法律是不公正的",
        这是意识形态层面的认知重组, 可归入 DED-024 的替代路径。此使用基本合法,
        但需标注使用的是替代路径(ideological conversion)而非默认侵蚀路径。
      → 3父合力。DED-024 的使用合法但需标注为替代路径。

      第三步: 合力格汇总与涌现判定

      需要 ≥2 父推论合力的格子(排除 solo 格和近平凡格):
      G4(2父, 弱, 非核心), G5(2父), G6(3父, DED-016为负向), G9(2-3父), G10(2父),
      G11(2父), G12(2-3父, DED-024机制误用, 实际≤3父), G13(同G12缺陷), G14(3父, 合法).

      至少 3 个格(G6, G9, G14)标注为需 ≥3 父推论合力。量化门槛通过(至少一个合力格)。

      但关键赤字:
      - G12(声称"四条合力——交互级涌现核心格")因 DED-024 机制误用而不成立。
        修复后 G12 为 2-3 父合力(弱背景+表征+代际传导), 不再是"交互级涌现"。
      - G6 中 DED-016 为负向约束(预示此格罕见), 非正向驱动。
      - G9 中 DED-025 提供通用熵增(适用于任何含道德的格), 非此格特有交互。
      - G14 的合力质量最高(三机制咬合产生不可分解的预测), 但 DED-024 需标注为替代路径。

      涌现判定: L4-006 有真合力(多个格确实需要多父推论共同决定预测),
      但"交互级涌现"的声称集中在 G12——而 G12 的机制引用有严重缺陷。
      修复后, L4-006 的涌现更多是合取级(多条独立机制并行运作)而非交互级(一条修改另一条)。

      【计数错误】原文声称"17个有意义格"→应为15格(|<Dunbar|×3 + |>Dunbar|×3×3 - 3无关)。
      原文列出 G1-G14 共14格→漏1格。需修正计数。

  3_measurement_orthogonal:
    verdict: pass_with_concern
    note: |
      IV(群体规模/法律制度化强度/道德TP×INT配置)各有独立测量方案:
      - 群体规模: 人口普查/考古/民族志, 独立于法律/道德状态
      - 法律制度化强度: 按DED-016档C最低制度门槛三要素独立判定, 再按执行主体占比分强弱
      - 道德TP×INT配置: 继承DED-023 operationalization, "不因该规范是否被法律覆盖而调整测量方法"
      - IOR(制度交叠率): 逐条判定双重覆盖, 独立测量

      轴正交基本成立。但 concern:
      - 道德 TP×INT 配置的测量在【法律在场】时面临 DED-023 已识别的挑战:
        "制度化惩罚混淆TP测量——执行者是代理人而非第三方"。
        L4-006 声称"不因是否被法律覆盖而调整测量方法", 但若法律执行替代了自发TP,
        则测得的是"如果没有法律, TP会是多少"的反事实量——这需要 vignette 实验或博弈测量,
        非纯田野观察可得。此测量挑战在 operationalization 中已有部分承认但未充分展开。

  4_excluded_outcomes:
    verdict: pass
    note: |
      四个排除结果均有事前可测渠道:
      - "法律与道德的'正确'关系(L5规范命题)": 按L4/L5层间边界判定
      - "具体社会的历史路径": 独立于本推论的动力学框架
      - "法律的具体内容(部门法级别)": 本推论将法律作为整体制度类型
      - "道德法律化的规范评价": L4事实命题vs L5规范命题的区分
      不存在"事后因结果调整射程"的结构性漏洞。通过。

  5_classification_bin_match:
    verdict: pass
    note: |
      法律制度化三档(无/弱/强)与道德配置三档(高TP+INT/TP-only/碎片化)均按独立判据划分。
      法律强弱的分界(>50%执行事件由专职机构完成)有操作化判据, 虽连续量上阈值任选但合理。
      IOR为连续量(0-1), 不作过度分档。通过。

  6_anti_talisman:
    verdict: should_fix
    note: |
      L4-006 缺少显式 anti-talisman 条款。四条父推论(DED-016/023/025/024)均包含详细的
      anti-talisman_clause。L4-006 面临同类的循环风险:
      - 不得因"法律和道德共存的稳定社会"就倒推"IOR必然高"
      - 不得因"出现道德真空"就倒推"C1的法律挤出机制必然激活"
      - 不得因"法律合法性受损"就倒推"C2的道德碎片化必然存在"
      - IOR的测量必须独立于法律和道德各自的覆盖——不得因"社会稳定"反推"交叠必定存在"

      当前 operationalization 中有部分保护(IOR测量方案要求逐条独立判定),
      但未形成集中的硬约束。需新增 anti_talisman_clause 节, 至少覆盖以上三点。
      备注: 四条父推论均含此条款, L4-004/L4-005 也均已补充——L4-006 不应例外。

  7_real_world_anchor_fact_check:
    verdict: pass
    note: |
      逐一核查四个 supporting anchor 的事实准确性:

      Anchor 1(东德 1949-1989 → C1):
      - Stasi 线人密度约 1/66 公民: 可信(正式雇员约9万+非正式线人约17万/人口~1700万)
      - 1990统一后社会信任崩盘+犯罪率飙升+极右翼兴起: 事实正确
      - confidence moderate-strong 诚实(混杂经济休克+身份危机)
      事实准确。

      Anchor 2(日本 → O格):
      - 高人口密度+低犯罪率: 事实正确
      - 2011地震后秩序维持: 事实正确
      - confidence moderate 诚实(混杂文化特殊性)
      事实准确。

      Anchor 3(索马里 1991后 → T2边界):
      - 中央政府崩溃→法律真空, 氏族习惯法(xeer)+伊斯兰教法维持秩序: 事实正确
      - xeer是否为法律制度有争议: 已诚实标注
      - confidence moderate 诚实(田野研究在冲突环境中进行)
      事实准确。

      Anchor 4(美国禁酒令 1920-1933 → C2):
      - 第十八修正案禁止酒精, 大量亚群体不内化, 执法退化为纯外部强制,
        私酒泛滥/腐败/有组织犯罪, 13年后废除: 事实正确
      - confidence strong——近理想型实例
      事实准确。

      无事实性错误。通过。

  8_definition_vs_prediction:
    verdict: pass
    note: |
      "群体规模 > Dunbar + TP瓦解 + 法律接管/道德替代/法律腐蚀/道德腐蚀/交叠区"的
      五条动力学是可证伪的预测(falsifiability 节给出了五条明确的证伪路径), 非隐藏定义。
      关键条件(规模/法律强度/TP×INT配置)均独立于结果可测。
      条件句不是定义。通过。

  9_enumeration_exhaustiveness:
    verdict: pass_with_concern
    note: |
      "五条动力学"(T1/T2/C1/C2/O)声称穷尽法律-道德共演的所有可能方向。
      两条替代(T1/T2)+两条腐蚀(C1/C2)+一个交叠区(O)在逻辑上看似穷尽
      (两个系统之间的可能关系: A替B/B替A/A蚀B/B蚀A/共存的子集),
      但存在概念缺口:
      - "法律促进道德"(law strengthens morality)未被建模——北欧案例(L4-006自引反例)
        暗示法律可能作为对等性信号强化器促进内化。这不被五条动力学中的任何一条覆盖
        (T1说法律【替代】道德, C1说法律【腐蚀】道德——两者都不说法律【促进】道德)。
      - L4-006 在 counterexamples 中承认北欧是 C1 的表面反例, 并用"法律感知合法性"
        作为可能调节变量来消化。但这恰恰说明五条动力学未穷尽——"法律促进道德"这一
        方向需要被认可为独立的第6种可能关系, 即使其发生条件受限。

      建议: 诚实标注"法律促进道德"(law as morality amplifier)为逻辑上可能的第6条
      动力学路径, 明确其发生条件(高法律感知合法性)以及为何当前版本不单独建模。
      这不会推翻五条动力学的核心框架, 但会诚实地标明穷尽性边界。

  10_primary_suspect:
    verdict: pass
    note: |
      primary_suspect 定位为 C1(法律挤出内化)——四条机制交互的最强声称。合理。
      两个威胁方向均已识别:
      (a) "法律作为对等性信号强化器"替代假说(北欧)
      (b) 经验反例(北欧高福利国家)
      secondary_suspect(C2的因果方向反转风险)定位合理。
      unlikely_suspect(T2的存在性——即使空也不损框架)定位合理。

      但本轮审查发现 primary_suspect 比作者意识到的更脆弱:
      C1 不仅面临经验反例(北欧), 还面临【机制链内部缺陷】——DED-024 的阶段2
      不提供 L4-006 声称的"归因→挤出"机制(见红旗#2 G12分析)。
      这意味着 C1 不仅在经验检验中存在风险, 在推导层面就有一个机制缺口。
      建议在 primary_suspect 中增加此内部缺陷的声明。

# ============================================================
# L4 专属红旗 (11-17) — 逐条攻击
# ============================================================

l4_exclusive_red_flags:
  11_spectator_brick:
    verdict: pass_with_concern
    note: |
      逐一移除检验(独立重做, 对照四条父推论原文):

      移除 DED-016:
      - T1 失去"法律在什么规模条件下出现"——"法律替代道德"退化为"法律可以替代道德"的常识复述,
        不知法律为什么在特定规模才成为必要。
      - C2 的碎片化路径(档B)失去父推论支撑——只剩 DED-023 的内容独立性,
        而 DED-023 的内容独立性原义是"不同文化/时期同一内容可落不同象限",
        不直接预测"同一大群体内不同亚群持有不可通约的道德标准"。
        DED-016 的碎片化(档B)是 WITHIN-group fragmentation 的父推论来源——移除后 C2 的
        碎片化前提失去结构基础。
      → DED-016 对于 C2 的机制贡献是独特的(提供 within-group 碎片化的规模条件)。
      不冗余。

      移除 DED-023:
      - T2 失去 TP+INT 自我维持机制——不知"道德凭什么在无法律时撑得住"。
      - C1 失去区分 TP 和 INT 的能力——C1 的核心预测"INT 被挤出而 TP 仍由法律维持"
        依赖 DED-023 的正交轴。没有此区分, C1 退化为"法律替代道德执行"的常识(与 T1 重合)。
      - C2 失去内容独立性——不知"不同亚群为什么对同一行为有不可通约的道德判断"。
      → DED-023 对于 C1 和 C2 的机制贡献均不可替代。不冗余。

      移除 DED-025:
      - O 失去道德端熵增通道——交叠区的"两端熵增"论证失去一半。
      - T1 的 TP 瓦解逻辑: DED-023(通过 BR-L2-018)已给出"TP 随旁观者利益占比稀释而下降"
        的机制——DED-025 的 M3 是对同一机制的方向性命名(从"TP可变"到"TP瓦解是紧缩通道")。
        DED-025 的额外贡献在于将 TP 瓦解定位为"紧缩的独立通道"(与 M4 代际内化断裂并列),
        以及通胀-紧缩的不对称框架。
      → DED-025 对 T1 的贡献与 DED-023 部分重叠, 但通胀-紧缩不对称框架是 DED-025 独有的。
      非完全冗余但存在概念重叠。不构成观众砖, 但贡献的独立性需诚实标注。

      移除 DED-024:
      - C1 失去个体层瓦解动力学——但本轮审查发现 DED-024 的阶段2机制被误用(见红旗#2 G12)。
        若 C1 修复为两阶段模型(过度合理化→DED-024 sucker effect 接管),
        DED-024 在阶段B(法律弱化后的加速瓦解)中重新获得合法角色。
      - C2 失去阶段3认知重组——若使用 DED-024 的替代路径(意识形态转换),
        此使用合法。
      - T2 失去 INT 不瓦解的边界条件——此使用合法(DED-024 的 INT 维持条件确实约束 T2格)。
      → DED-024 在 C2 和 T2 中有合法贡献, 在 C1 中当前被误用但可修复。
      不冗余。

      总评: 四条父推论均有不可替代的机制贡献, 无完全的观众砖。
      但 DED-025 与 DED-023 在"TP 随规模/利益占比变化"上有概念重叠——
      两者均引用 BR-L2-018 作为 TP 变化的底层驱动, DED-025 的增量在方向性框架(通胀vs紧缩)
      而非新机制。此重叠不影响观众砖判定(各有独立贡献), 但需诚实标注。

  12_trivial_conjunction:
    verdict: needs_revision
    severity: required
    note: |
      【本轮审查的核心战场之一——平凡合取判定】

      L4-006 的五条动力学逐一检验是否仅是父推论结论的 AND/OR 拼接:

      T1(法律替代道德): ">Dunbar → TP稀释 → 法律接管道德的执行功能"
      - DED-016: ">Dunbar → 制度化或碎片化"——说制度化出现, 不说制度化接管道德功能
      - DED-025: "TP瓦解(利益占比稀释)"——说TP瓦解, 不说法律接管
      - DED-023: "TP+INT可自我维持"——说自我维持条件, 不说法律替代
      → T1 需要将"制度化出现"+"TP瓦解"+"法律可接管执行"合成——前两项来自父推论,
      第三项(法律可接管TP的执行功能)是 L4-006 添加的桥接前提。
      非平凡合取——父推论 AND 拼接不足以推出 T1, 需要额外的"制度可替代分布式执行"桥接。

      T2(道德替代法律): "法律真空 + TP+INT仍高 → 道德自我维持, 无需法律"
      - DED-023: "TP+INT可自我维持"——直接相关, 但 DED-023 不说"可替代法律"
      - DED-024: "INT不瓦解的边界条件"——补充维持条件
      - DED-016: 预测此格罕见——这是负向约束
      → T2 最接近平凡合取(DED-023 的"TP+INT自我维持"+ DED-024 的"维持条件"≈ T2),
      但"可替代法律"这一跨系统比较不在任何父推论中。非平凡, 但为弱增量。

      C1(法律腐蚀道德): 见红旗 #2 G12 分析——DED-024 的机制被误用。
      C1 的真实机制(过度合理化)不在四条父推论任何一条中。
      → 非平凡(真机制不在父推论中), 但当前对父推论的机制归因不准确。

      C2(道德腐蚀法律): "碎片化(DED-016) + 内容独立性(DED-023) → 法律选边 →
      落选方认知重组(DED-024 替代路径) → 合法性受损"
      → 需要三步合成, 不在任何父推论中。真交互——三机制咬合产生的新预测。
      非平凡合取。

      O(交叠区维护成本): "法律覆盖 + 道德覆盖 → 双重稳定, 但需两端持续能量投入"
      - DED-025: 道德端熵增
      - PHY-001: 法律端熵增(组织熵增)
      - DED-023: (+TP,+INT) 提供道德端状态表征
      - DED-016: 制度化存在
      → "两端熵增"的合取不在任何父推论中。但需诚实标注: 法律端熵增来自 PHY-001(公理),
      非 L3 父推论。O 的增量在于指出两股独立熵增压力的合取效应, 这是一个有价值的视角。

      裁决: L4-006 的五条动力学均非父推论结论的简单 AND/OR 拼接。
      T1/T2/C2/O 均有至少一个不在任何父推论中的桥接前提或结论。
      C1 的真实机制(过度合理化)不仅不在父推论中, 且被错误归因给 DED-024。

      非平凡合取通过——但需诚实标注各条命题中哪些是父推论机制、哪些是 L4-006 自建桥接、
      哪些是外部理论(过度合理化效应)。C1 的机制归因修复(红旗 #2)是前提条件。

  13_emergence_missing:
    verdict: needs_revision
    severity: required
    note: |
      【多父逐格判空——独立归属分析(同红旗 #2 笛卡尔积)】

      经独立逐格标注(见红旗 #2 逐格分析), 合力格汇总:

      真合力格(需 ≥2 父推论合力才能推出预测):
      - G6(T2格): 需 DED-016(负向约束)+DED-023(TP+INT维持)+DED-024(INT边界条件)
        = 3父合力。注意: DED-016 在此格中为阻力/约束而非推力。
      - G9(O格): 需 DED-016(制度化)+DED-023(TP+INT表征)
        = 2父合力(若计入DED-025通用熵增则3父)。
      - G12(C1风险格): 当前声称4父合力, 但因 DED-024 机制误用(见红旗 #2),
        实际 ≤3父合力(DED-016弱背景+DED-023强表征+DED-025代际传导)。
        C1 的核心机制(过度合理化)不在任何父推论中——这不是合力, 这是引入外部机制。
      - G14(C2格): 需 DED-016(碎片化+制度化并存)+DED-023(内容独立性)+
        DED-024(替代路径: 意识形态转换→认知重组"法律不公")
        = 3父合力。这是四个格中合力质量最高的——三机制咬合产生不可由单父推论推出的预测。

      弱合力格(需2父推论, 但非核心贡献):
      G4(2父, 非核心), G5(2父), G10(2父), G11(2父).

      归零检查:
      排除非核心格(G4/G5/G10/G11)和平凡格(G1/G2/G3/G7/G8),
      剩余 4 个核心合力格: G6, G9, G12, G14。
      其中 G12 的合力标注因 DED-024 机制误用而成问题。
      修复后仍有 ≥3 个核心合力格(G6/G9/G14), 满足"至少一个合力格"的最低门槛。

      但合力格的【质量等级】:
      - G14(C2): ★★★ 真交互——一个父推论的机制(碎片化)创造了条件,
        另一个父推论(内容独立性)提供了差异结构,
        第三个父推论(认知重组)提供了个体层反应——三力咬合产生不可分解的预测。
      - G6(T2): ★★ 合取+约束——两父推论正向驱动(TP+INT维持+INT边界条件),
        一父推论负向约束(规模→此格罕见)。
      - G9(O): ★★ 合取——两父推论各自提供状态表征, "两端熵增"的合成是增量,
        但法律端熵增来自PHY-001(L0)非L3父推论。
      - G12(C1): ★(当前) → 修复后可能 ★★——当前因 DED-024 误用而降级。
        即使修复, C1 的核心机制(过度合理化)是外部理论, 非父推论合力。

      涌现判定:
      L4-006 有真合力(G14 是高质量交互), 但"交互级涌现"的旗舰格 G12 是不成立的。
      整体涌现更多是【合取级】(多条独立机制并行运作+跨系统桥接)而非【交互级】
      (一条修改另一条的运作方式)。G14 是唯一的交互级涌现候选。

      emergence_tier 自评"混合——C1/C2为interaction(交互级), T1/T2/O为conjunction(合取级)"
      需要下调: C1 因机制误用应降级; 仅 C2 可能保持 interaction 标签。

      【计数错误附注】原文声称"17个有意义格"——实际为15格(18-3不可能格=15)。
      此差异不影响合力判定但需修正。

  14_weak_parent_premise:
    verdict: should_fix
    note: |
      四条 L3 父推论状态(经本轮独立确认, 对照 INDEX.md 及各推论原文):
      - DED-016: verified(经 ADV-REVIEW-021 两轮审查+EMP-TEST 经验检验)
      - DED-023: verified(经 ADV-REVIEW-028 两轮审查)
      - DED-025: verified(经 ADV-REVIEW-031 审查)
      - DED-024: verified(经 ADV-REVIEW-029 两轮审查)

      全部为 verified, 无 candidate 被用作主前提。父推论状态通过。

      但存在【scope 扩展问题】——两条父推论明确排除法律语境:

      DED-023 excluded_outcomes:
      "正式法律系统中的规范执行: 制度化惩罚(警察/法院)混淆TP测量——
      执行者是代理人而非'第三方'(代理人有职业激励, 非自发代价),
      本推论先覆盖非中心权威下的规范。"

      DED-025 excluded_outcomes:
      "法律强制推动的道德标准变化——属L4-006的'法律替代道德'路径, 不在DED-025射程内。
      操作化区分判据: 法律驱动=标准收紧的主要执行渠道为制度化法律制裁...
      而非自发的社会惩罚..."

      DED-025 甚至明确指向 L4-006 作为"法律替代道德"路径的归属——这说明 DED-025 的
      作者已意识到此 scope 边界并显式委托给 L4-006。

      问题: L4-006 将 DED-023 和 DED-025 的机制扩展到法律语境, 但没有提供显式的
      【scope 桥接论证】——为什么在存在制度化执行的环境中, DED-023 的 TP 概念仍然
      有效? 为什么在"法律在场"的条件下, DED-025 的 M3(TP瓦解)机制仍然适用?

      L4-006 的 operationalization 中有一句:"不因该规范是否被法律覆盖而调整测量方法"
      (针对 TP×INT 配置的测量)——这试图通过测量独立性来桥接 scope 差距。
      但这只解决了"如何测"的问题, 没有解决"测量的东西是否还是原来的构念"的问题:
      在无法律环境中, TP=旁观者自发付代价惩罚违规者的意愿;
      在法律环境中, 法律执行已接管惩罚功能——此时测量的"TP"(通过 vignette/博弈
      测得的自发惩罚意愿)是否与无法律环境中的 TP 是同一构念?

      这是 L4 复合推论的正当挑战——将父推论延伸到其原始 scope 之外是 L4 的使命,
      但此延伸需要显式论证。当前 L4-006 缺少此论证。

      建议: 在 derivation 中新增"scope bridge"小节, 显式论证 DED-023 和 DED-025
      的机制在法律语境中为何仍然成立。此为非阻塞的 should 级建议——父推论均为 verified,
      scope 扩展是 L4 的正当操作, 只是需要论证而非沉默。

  15_anchor_theft:
    verdict: pass_with_concern
    note: |
      逐一审查四个 supporting anchor 的"复合特有"证据:

      Anchor 1(东德 → C1):
      声称: 40年Stasi→1990统一后规范全崩 = C1 的交互证据。
      审查: 东德的规范崩盘涉及 DED-016(制度化在场)+DED-024(瓦解阶段2 sucker effect
      在统一后可观察)+DED-025(M4 代际传导)。但核心机制——Stasi 40年如何挤出INT——
      是过度合理化效应(外部理论), 不是父推论交互。L4-006 将此锚归因于"法律在场触发
      DED-024 阶段2比较", 但 Stasi 时期人们【遵守】了规范(因恐惧), 阶段2的 sucker
      effect(看到他人不遵守)是在统一后、Stasi档案公开时才集中爆发的。故此锚展示的
      更多是"法律强制→INT渐进空洞化→法律骤变→DED-024接管加速瓦解"的时序关系,
      而非"法律在场同时触发DED-024阶段2"这一 L4-006 声称的机制。
      → 锚点事实正确, 但机制归因与 L4-006 的 C1 声称之间存在 gap。
      标注为【锚点支持延后版C1(两阶段), 不支持当前声称的同步版C1】。

      Anchor 2(日本 → O格):
      声称: 法律在场+道德在场→交叠区稳定。
      审查: 日本展示的是法律和道德共存——这确实需要一个多父推论解释(为什么法律没挤出道德?
      为什么道德没碎片化到腐蚀法律?), 但这是对"共存"的解释, 不是对"交互"的证据。
      日本案例混杂文化特殊性(耻文化/集团主义), L4-006 已诚实标注。
      → 不为 anchor theft——需要至少 DED-016(制度化)+DED-023(TP+INT高)来表征日本的状态,
      但"交叠区稳定是因为两端熵增被对抗"这一机制声称在日本锚点中无直接证据。
      标注为【状态表征——展示 O 格的存在性, 非其维护机制的运作证据】。

      Anchor 3(索马里 → T2):
      声称: 氏族内道德替代法律(T2)+跨氏族碎片化(C2)。
      审查: 索马里的氏族内秩序维持主要依靠 DED-023 的 TP+INT 机制(氏族成员愿付代价惩罚
      违规者+宗教内化)。DED-016 的贡献是解释为什么在【氏族层面】>Dunbar(一个氏族
      可能超150人)仍可不依赖正式法律——这与 DED-016 的"规模→需要制度化"在表面上
      有张力, 但可通过"氏族内仍是面对面熟人网络"来消化(裂变机制保持单元<150)。
      DED-024 的贡献是解释 INT 的维持条件(xeer/伊斯兰教法的对等性信号)。
      → 需要多父推论来完整解释索马里个案, 但这不是 anchor theft——索马里是真正的
      多父推论交汇案例。标注为【真正的复合锚点——但需诚实标注 T2/C2 各自在哪个层面运作】。

      Anchor 4(禁酒令 → C2):
      声称: 道德碎片化→法律合法性受损→执法成本飙升→废除。
      审查: 禁酒令是 C2 的近理想型实例——DED-016 的碎片化(清教徒vs移民)+
      DED-023 的内容独立性(酒精消费在不同亚群落不同象限)+DED-024 的阶段3
      (落选方认知重组"这法律不公")→三机制均清晰可见。
      DED-024 的使用合法(替代路径: 落选方从未内化禁酒令→法律与既有道德信念冲突→
      认知重组"这法律不公正"→无需经历阶段1-2→直接拒绝内化法律)。
      → 标注为【真正的复合锚点——C2 的最强证据】。

      总评: 四个锚点中, 禁酒令是最强的复合锚点(三父推论机制均可见),
      索马里是真正的多父交汇案例(需区分 T2/C2 各自的操作层面)。
      东德锚点支持延后版/两阶段版 C1 而非当前声称的同步版 C1。
      日本锚点是状态表征而非交互证据。
      不为 anchor theft(四个锚点都需要多父推论才能完整解释),
      但东德锚点与 L4-006 当前 C1 声称之间的 gap 需要解决。

  16_interaction_measurement_gap:
    verdict: needs_revision
    severity: required
    note: |
      L4-006 的复合输出变量 IOR(制度交叠率)可测量"法律和道德同时覆盖的规范占比"。
      但 IOR 测量的是【共存】而非【交互】。IOR 高 = 双重覆盖多——这可以是两条独立
      因果链的并行产物(法律强+道德强各自独立运作), 也可以是交互的产物。
      IOR 无法区分这两种情况。

      L4-006 在 falsifiability (e) 中预埋了对此的检验:
      "发现交叠区(IOR高)社会的秩序稳定性在控制法律和道德各自独立贡献后,
      IOR增量不显著→O的'交叠本身有独立稳定化效应'被推翻"

      这给出了一个可检验的方案——但方案本身暴露了测量 gap:
      需要找到"法律强但道德弱"和"道德强但法律弱"的案例作为对照,
      然后看 IOR 是否贡献了超越两者独立贡献的额外稳定性。
      这在方法论上是正确的, 但:
      (a) 需要跨格比较(G13 vs G6 vs G9), 而跨格比较在社会科学中受限于案例的可比性
      (b) "秩序稳定性"的操作化未给出(用什么指标? 犯罪率? 政体存续时间? 社会信任调查?)
      (c) IOR 本身的测量依赖于对规范清单的抽样——不同社会的规范内容不同,
        跨社会比较 IOR 面临构念等价性问题

      更根本的问题: C1(法律挤出内化)和 C2(道德腐蚀法律)的复合输出
      能否被测量为"区别于法律单独+道德单独"的东西?
      - C1 的输出是"INT 下降但 TP 仍由法律维持"→需要测量 INT 的变化率 vs 法律强度的变化率。
        这需要纵向数据——当前锚点均为横截面快照。
      - C2 的输出是"法律合法性受损→执行成本飙升"→需要测量法律合法性的变化率 vs
        道德碎片化程度的变化率。同样需要纵向数据。

      当前所有锚点均为横截面/单个历史事件。没有纵向追踪数据展示 T1/T2/C1/C2/O 的
      动态过程。对于 claim_type=co_evolution, 这是显著的 evidence gap。

      修正要求:
      (a) 在 operationalization 中为每个动力学(T1/T2/C1/C2/O)给出独立的测量方案,
          不仅测状态(IOR), 还要测方向/速率(系统是在向哪个格迁移? 迁移速度?)
      (b) 诚实标注当前锚点的证据层级——它们展示的是"机制在场的 directionally
          consistent 证据", 非"机制的排他性因果检验"
      (c) 为 co_evolution 的核心测量("双向反馈的时间序列")给出操作化方案
      (d) 或者将 claim_type 从 co_evolution 调整为更诚实的标签(见红旗 #17)

  17_claim_type_mismatch:
    verdict: needs_revision
    severity: required
    note: |
      claim_type = "co_evolution" 声称法律和道德之间是双向共演关系。
      这一类型预设:
      (a) 双向因果——A影响B且B影响A
      (b) 时间维度——共演是过程, 不是状态
      (c) 反馈循环——A的变化触发B的变化, B的变化反过来改变A的变化条件

      L4-006 提供的证据:
      - 东德(1949-1989): 法律→道德(单向, C1)。未展示道德反作用于法律。
      - 日本(当代): 法律+道德共存(静态状态, O格)。未展示演化过程。
      - 索马里(1991后): 无法律→道德填补(T2), 但跨氏族碎片化(C2)。
        这两个过程发生在不同层面(氏族内T2 vs 氏族间C2), 不是"道德填补后反过来
        促进法律重建"的共演循环。索马里近30年仍无中央政府——未展示双向反馈。
      - 禁酒令(1920-1933): 道德碎片化→法律失效(C2), 且废除后未触发
        "法律重新出现后道德如何反应"的第二段——只展示了单向的C2。

      没有一个锚点展示【同一案例内的双向共演循环】。
      每个锚点展示的是五条动力学中的一条, 且是单向的。

      这不是致命问题——co_evolution 的理论框架可以通过"拼图式"证据策略
      (不同案例展示不同机制环节, 合起来构成完整的共演图景)来支撑。
      L4-003(fairness institution co-evolution, claim_type=co_evolution)采用了
      类似的策略。但 L4-006 缺少对此证据策略的显式声明。

      修正要求:
      (a) 在 methodological_caveat(需新增)中声明:
          "本推论的 co_evolution 证据策略为'机制分解': 五个动力学(T1/T2/C1/C2/O)
          分别用不同案例展示, 合起来构成完整的双向共演图景。当前无单一案例完整展示
          双向共演闭环——此为证据层级的上限, 诚实标注。"
      (b) 明确"双向共演闭环"的可检验标准: 什么样的纵向证据可以确认 co_evolution
          确实在运作(而非仅仅是多个单向效应的拼图)?
          例如: 在同一社会中观测到"法律增强→道德削弱(C1)→道德削弱后法律执行成本上升→
          法律调整或弱化→道德填补(T2)"的完整循环。
      (c) 或者将 claim_type 调整为更保守的标签如
          "bidirectional_dynamics"或"system_dynamics",
          保留 co_evolution 作为启发性描述在 statement 中。

      当前 claim_type 与证据之间的 gap 构成 required 缺陷——
      co_evolution 需要双向时序证据或显式的证据策略声明,
      两者当前均缺失。

# ============================================================
# 反例猎捕
# ============================================================

counterexample_hunt:
  methodology: |
    按 L4 评分卡要求, 猎两类反例:
    (1) 某父推论不成立 → L4-006 天花板受损
    (2) 父推论都成立, 但交互不产生 L4 预测的结果(重点——L4 特有猎法)

  type1_parent_failure:
    cases: []
    note: "四条父推论均为 verified, 各自经多轮对抗审查。无 scope 内反例。"

  type2_interaction_failure:
    cases:
      - id: CE-1
        label: "北欧国家——父推论都成立, 但 C1 预测不成立(法律促进内化而非挤出)"
        description: |
          丹麦/瑞典/挪威: 强法律执行(高税收合规靠法律强制)+高内化道德(高社会信任+低腐败)。

          父推论各自成立:
          - DED-016: >Dunbar, 制度化存在 → ✓
          - DED-023: 高 TP+INT(公民既愿执行规范又内化规范) → ✓
          - DED-025: 紧缩默认(若不持续投入, 道德标准会自然松绑) → ✓
          - DED-024: 内化可按四阶段瓦解(若对等性信号断裂) → ✓

          但 L4-006 的 C1 预测: 强法律→挤出内化→(+TP,+INT)→(+TP,-INT)漂移。
          北欧的实际情况: 强法律+高内化共存数十年, 无系统性的内化挤出证据。
          社会信任(INT的代理指标)长期保持高位。

          攻击点: 这是"父推论都成立、但交互不产生 L4 预测结果"的活案例。
          四条父推论各自在自己的领域运作正常, 但 C1 预测的方向(法律挤出内化)
          在北欧不仅没有发生——甚至出现了反向(法律可能促进内化)。

          L4-006 的消化路径(已在 counterexamples 中预埋):
          "北欧的法律执行可能不被公民感知为'外部强制'而是'集体自我管理'
          (合法性感知高→法律不触发 DED-024 的阶段2比较机制)"

          审查评估: 此消化路径在概念上自洽, 但引入了一个 C1 当前未建模的调节变量
          (法律感知合法性)。如果"法律感知合法性"决定 C1 是否激活, 那么 C1 的
          适用范围被严重限制——仅在"法律感知合法性低"的社会中 C1 才成立。
          这意味着 C1 不是"强法律→挤出内化"的通用命题, 而是
          "强法律+低合法性感知→挤出内化"的条件命题。

          L4-006 已将"法律感知合法性"列为 primary_suspect 的消化方向,
          但尚未将其正式纳入 C1 的命题表述或条件限定中。

          这是一个近失案例(near miss)——不杀死 C1(因可通过增加调节变量消化),
          但暴露了 C1 当前表述的过强宣称。

        status: near_miss
        severity: high
        required_response: |
          要么 (a) 将"法律感知合法性"正式纳入 C1 的命题表述作为调节变量,
          并给出其独立操作化方案; 要么 (b) 限制 C1 的适用范围声明——
          "C1 在低法律感知合法性条件下成立, 在高合法性条件下法律可能反而促进内化"。

      - id: CE-2
        label: "父推论都成立, 但结果不是'双向共演'而是'法律彻底替代道德'(极端T1)"
        description: |
          构造案例: 一个 >Dunbar 社会建立极强的法律执行体系(警察国家),
          且持续数代。法律完全接管 TP 的执行功能, INT 被系统性地挤出(C1),
          道德碎片化被法律压制(碎片化的离心力被强法律统一性压制),
          最终社会进入纯 T1+C1 稳态——法律完全替代道德, 社会生活靠外部强制维持。

          此时:
          - DED-016: >Dunbar+制度化 → ✓
          - DED-023: TP 被法律执行替代(非自发)→INT 被挤出→规范从(+TP,+INT)漂移到(法律替代TP,-INT)
          - DED-025: M4 代际内化断裂 → ✓
          - DED-024: 阶段2/3 完成 → ✓

          攻击点: 四条父推论都成立, 但结果不是"双向共演"(法律和道德互相兜底又互相腐蚀),
          而是"法律对道德的单向替代+腐蚀"——系统没有展示出"道德反过来影响法律"的
          双向性。这是对 claim_type=co_evolution 的挑战——如果父推论机制允许
          "纯法律替代"作为稳态存在, 那么"双向共演"就不是父推论机制的必然产物,
          而只是一个可能的(且可能罕见的)结果。

          L4-006 的消化路径: G13(>D, 强法, TP-only)是纯法律替代稳态。
          L4-006 预测此状态的风险: "法律一旦失效→瞬时失序——无内化后备"。
          这与东德案例一致——纯法律替代是【可能但不稳定】的稳态:
          法律在场时稳定, 法律弱化时崩盘。

          审查评估: 此消化在逻辑上自洽。但"纯法律替代"作为一个预测内的格(G13),
          本身削弱了 co_evolution 的"必然双向性"——父推论机制允许系统长期停在
          非交互的配置(G13)中。L4-006 的 co_evolution 声称需要限定:
          双向共演不是必然发生的, 而是在特定条件下(法律不太强、道德不太碎)
          才会展开的动力学。

        status: near_miss
        severity: moderate
        note: |
          不构成 clean kill——G13 是预测内格。但暴露了 co_evolution framing
          可能过强: 系统可以在非共演格(G13纯法律替代, G8碎片化)中稳定存续,
          不必进入双向共演。

      - id: CE-3
        label: "法律的'道德表达功能'——法律不仅执行道德, 还创造/改变道德内容"
        description: |
          L4-006 的框架将法律的角色限定为"执行"(替代TP)和"制度化"(档C),
          道德的角色限定为"内化+自发执行"(TP+INT)。
          但法律还有一个未被建模的功能: 【道德表达】(law as moral educator)。

          实例: 美国民权法案(1964)不仅用法律强制替代了南方的自发歧视性TP——
          法律还【改变了】北方白人的道德认知(通过将种族平等确立为国家价值,
          法律起到了道德教育的作用)。这不是"法律替代道德"(T1)也不是"法律腐蚀道德"(C1)——
          这是"法律创造/强化道德"。

          攻击点: L4-006 的五条动力学(T1/T2/C1/C2/O)未覆盖"法律作为道德教育者"
          这一功能方向。此功能在历史上反复出现(废奴/民权/环境法/LGBTQ权利)——
          法律不仅执行既有道德, 还催化新道德的产生。

          此功能是否可以归入 O(交叠区——法律和道德互相强化)?
          不完全: O 说法律和道德"共存且互相兜底", 但未说"法律可以主动创造新道德内容"。
          DED-025 的 M1+M2(受害叙事+道德创业者→通胀)可以部分覆盖此现象
          (法律是道德创业者的工具), 但 L4-006 未将 M1+M2 机制整合进其框架。

        status: observation
        severity: moderate
        note: |
          不构成反例——法律表达功能可部分归入 DED-025 M1+M2 的延伸,
          或作为 O 格的动态补充。但此功能的存在表明五条动力学的枚举可能不穷尽,
          见红旗 #9。

  hunt_summary: |
    未猎到 scope 内干净击杀(父推论都成立+交互不产生L4预测的明确现实案例)。

    猎到两个近失案例:
    - CE-1(北欧): 父推论都成立, 但 C1 被观察到不成立(法律促进内化而非挤出)。
      消化路径(法律感知合法性调节)可行但会限缩 C1 的适用范围。
    - CE-2(纯法律替代稳态): 父推论都成立, 但系统可停在非共演格(G13),
      削弱 co_evolution 的"必然双向性"声称。

    CE-3 是观察级(法律表达功能), 不构成反例但暴露了枚举可能不穷尽。

    最关键的发现不是外部反例, 而是内部机制缺陷(红旗 #2 G12):
    C1 的 DED-024 阶段2机制被误用——这是推导层问题, 非反例可猎。

# ============================================================
# 与 DED-004 / DED-007 的对照
# ============================================================

non_recurrence:
  ded004_check:
    verdict: pass
    note: |
      DED-004 的死因: 条件双重身份(自变量同时也是被预测量)+事后用结果反推条件。
      L4-006 未犯此病: 群体规模/法律制度化强度/道德TP×INT配置各有独立测量方案,
      与复合输出(五条动力学/IOR)在不同测量轴上。
      但需补充 anti-talisman clause(红旗 #6)以封堵"面对不配合案例时事后调整
      法律强度/TP×INT估值"的循环风险。

  ded007_check:
    verdict: pass
    note: |
      DED-007 的死因: 三个假说各自吸收各自的案例, 缺乏可被共同证据裁决的争议点。
      L4-006 未犯此病: falsifiability 节给出了五个明确的证伪条件(a)-(e),
      共享同一组可独立测量的变量。不同案例(东德/日本/索马里/禁酒令)测试的是
      不同动力学(T1/T2/C1/C2/O), 但它们在同一框架内, 可被共同裁决。

# ============================================================
# 裁决
# ============================================================

verdict: needs_revision
verdict_note: |
  L4-006 有真正的理论贡献——将四条独立发展的道德/法律推论合成为一个双向共演系统。
  五条动力学(T1/T2/C1/C2/O)的骨架是扎实的: 每条都需要至少一条不在父推论中的
  桥接前提, 非平凡合取。G14(禁酒令→C2)是本推论中质量最高的机制交互——
  三父推论机制咬合产生不可分解的预测。

  但核心弱点有四:
  (1) C1 的 DED-024 机制误用(红旗 #2 G12): DED-024 的阶段2是 sucker effect
      (观察他人不遵守), C1 调用的是过度合理化效应(归因推断)。这是机制层面的
      category error——C1 当前声称的"四父合力核心格"因此不成立。
  (2) DED-023/DED-025 的 scope 扩展缺少显式论证(红旗 #14): 两条父推论明确
      排除法律语境, L4-006 将其延展至法律语境是正当的 L4 操作, 但需桥接论证。
  (3) claim_type=co_evolution 与证据层级不匹配(红旗 #17): 五个锚点均为单向
      效应快照, 无一展示同一案例内的双向共演闭环。需补 methodological_caveat。
  (4) 缺少 anti-talisman clause(红旗 #6): 四条父推论均有, L4 同类也有,
      L4-006 不应例外。

  不判 rejected 的理由: (a) 五条动力学的逻辑骨架坚实, 非平凡合取成立;
  (b) G14(C2格)的高质量交互证明 L4-006 有真正的交互级涌现;
  (c) C1 的问题是机制归因错误而非逻辑塌陷——可通过诚实地将过度合理化效应
      标注为外部桥接来修复; (d) 问题本质是 honesty+precision 不足,
      非结构性死病(不同于 DED-004 的条件双重身份)。

  判 needs_revision: 需 5 条 required 修订后才能进入 round 2。

required_fixes:
  - id: RF-1
    priority: required
    title: "修复 C1 的 DED-024 机制误用——诚实重构机制链"
    description: |
      当前 C1 将"法律→挤出内化"归因于 DED-024 的阶段2比较机制, 但 DED-024 的
      阶段2(sucker effect)需要观察到他人违规无后果——在强法律场景(G12)中,
      人们仍在遵守(因法律强制), sucker effect 的前提条件不满足。

      C1 实际调用的机制是过度合理化效应(overjustification/SDT):
      外部强制→个体将行为归因于外部原因→内在动机被挤出。

      修复方案(推荐): 将 C1 重构为两阶段模型:
      - 阶段A(过度合理化): 法律在场→归因外化→INT渐进削弱(月-年级)。
        此阶段机制来自 SDT 外部理论, 诚实标注为 external_bridge, 非 DED-024 原有机制。
      - 阶段B(DED-024 接管): 当法律弱化(政变/崩溃/改革)→实际违规行为出现→
        DED-024 的 sucker effect 激活(观察到他人违规无后果)→加速瓦解(周-月级)。
        此阶段 DED-024 的机制合法适用。
      此两阶段模型与东德经验一致。

      同时修正 G12 和 G13 的多父合力计数:
      - G12: 从"四父合力"修正为 ≤3父合力(DED-016弱背景+DED-023强表征+DED-025代际传导),
        并诚实标注阶段A的机制(过度合理化)来自 SDT 外部理论。
      - G13: 同修正。
      - 更新 emergence_demonstration 中对此格的合力标注。
    affects: statement (C1), derivation.steps.2(b), emergence_demonstration.multi_parent_cells (G12/G13), novelty

  - id: RF-2
    priority: required
    title: "新增 anti-talisman clause"
    description: |
      新增 anti_talisman_clause 节, 至少覆盖:
      - 不得因"法律和道德共存的稳定社会"倒推"IOR必然高"或"交叠区必然活跃"
      - 不得因"出现道德真空"倒推"C1的法律挤出机制必然激活"(M3/M4 或非法律
        因素可能独立造成道德真空)
      - 不得因"法律合法性受损"倒推"C2的道德碎片化必然存在"(法律本身的缺陷
        或外部冲击可能独立造成合法性问题)
      - IOR 必须独立测量(逐条判定规范是否被法律和自发TP+INT双重覆盖),
        不得由社会秩序稳定性反推
      - 遇到疑似反例(如北欧)时, 不得事后调高"法律感知合法性"估值来消化——
        法律感知合法性必须事前独立测量
    affects: 新增 anti_talisman_clause 节

  - id: RF-3
    priority: required
    title: "对齐 claim_type 与证据——新增 methodological_caveat"
    description: |
      claim_type=co_evolution 要求双向时序证据, 但当前五个锚点均为单向效应快照。
      新增 methodological_caveat 节:
      (a) 声明证据策略为"机制分解": 五个动力学(T1/T2/C1/C2/O)分别用不同案例展示,
          合起来构成完整图景。当前无单一案例完整展示双向共演闭环。
      (b) 明确"双向共演闭环"的可检验标准(同一社会内观测到法律→道德→法律反馈循环)。
      (c) 或者将 claim_type 从 co_evolution 调整为 "bidirectional_dynamics",
          保留 co_evolution 作为 statement 中的启发性描述。
    affects: claim_type, 新增 methodological_caveat

  - id: RF-4
    priority: required
    title: "为 DED-023/DED-025 的 scope 扩展提供桥接论证"
    description: |
      DED-023 和 DED-025 均明确排除法律语境, L4-006 将其扩展到法律语境——
      这是 L4 复合推论的正当操作, 但需要显式论证而非沉默。

      在 derivation 或新增 "scope_bridge" 节中论证:
      (a) DED-023 的 TP 概念在法律语境中的适用性:
          在无法律时, TP=旁观者自发付代价惩罚违规; 在有法律时, 法律执行接管了惩罚功能。
          但"如果法律不存在, 旁观者是否仍愿付代价惩罚"是一个原则上可测的反事实量
          (通过 vignette/博弈实验)。此反事实量在概念上等价于 DED-023 的 TP 构念,
          只是测量更加困难(L4-006 已在 operationalization 中承认此困难)。
      (b) DED-025 的 M3/M4 机制在法律语境中的适用性:
          DED-025 将"法律驱动的标准变化"排除在射程外, 但 M3(TP瓦解)和 M4
          (代际内化断裂)的机制本身不依赖"无法律"前提——TP是否瓦解取决于利益占比,
          INT是否传导取决于对等性信号, 两者在原则上有法律和没有法律时均可测量。
          被排除的是"法律作为标准变化的主要执行渠道"的场景(即法律直接惩罚/罚款
          推动标准变化), 而非"道德自身在变化但法律在场"的场景。
      (c) 诚实标注: 上述论证是 L4-006 自建的 scope 桥接, 非父推论原文所有。
          父推论在无法律语境中被验证, 其在法律语境中的有效性是 L4-006 的延伸假说,
          需独立经验检验。
    affects: derivation, 新增 scope_bridge 节

  - id: RF-5
    priority: required
    title: "修正笛卡尔积计数 + 补全漏格"
    description: |
      当前文本存在计数不一致:
      - "17个有意义格"的声称与 2×3×3=18, 15(除3不可能)=15 不符
      - 仅列出 G1-G14(14格), 遗漏1格(若从15格计)
      - 遗漏的1格应为 >Dunbar + 强法 + TP-only(但此为G13? 等等, 检查...)

      实际上 2×3×3 = 18, 排除 <Dunbar+强法 的3格 = 15有意义格。
      或 18 - 3 + 某些 <Dunbar 排除 = 需核验。

      修正要求:
      (a) 将"17个"改为正确数字(15)
      (b) 补全所有格的列表(当前仅 G1-G14, 若为15格则漏1格——需确认漏的是哪一格并补上)
      (c) 或诚实标注"当前仅分析14个核心格, 其余为经验上近空/无意义格"
    affects: emergence_demonstration.multi_parent_cells 节首

should_fixes:
  - id: SF-1
    priority: should
    title: "将'法律感知合法性'正式纳入 C1 的命题限定"
    description: |
      北欧案例(CE-1)表明: 当法律被感知为"我们共同制定的规则"时, 强法律不挤出内化。
      L4-006 已在 primary_suspect 中预埋此消化路径, 但尚未正式建模。
      建议: 在 C1 的命题中加入条件限定——"C1 在低法律感知合法性条件下成立;
      在高合法性条件下, 法律可能作为对等性信号强化器而促进内化"。
      并给出法律感知合法性的独立操作化方案(如: 公民对"法律代表我的利益"的同意率/
      对立法过程的参与度感知/对执法者的公正性评价——均独立于 INT 测量)。
    affects: statement (C1), operationalization

  - id: SF-2
    priority: should
    title: "诚实标注五条动力学的枚举边界——'法律促进道德'作为逻辑上可能的第6条路径"
    description: |
      北欧案例和法律的"道德表达功能"(CE-3)表明: 法律不仅替代/腐蚀道德,
      还可能创造/强化/促进道德。当前五条动力学未覆盖此方向。
      建议在 statement 或 discriminant_validity 中诚实标注:
      "'法律促进道德'(law as morality amplifier/educator)是逻辑上可能的
      第6条动力学路径。当前版本未单独建模此路径——它可被部分归入
      O格(交叠区法律强化对等性信号)或 DED-025 M1+M2(法律作为道德创业者的工具)。
      此路径的独立存在性及其发生条件是未来扩展方向。"
    affects: statement, discriminant_validity

  - id: SF-3
    priority: should
    title: "诚实标注 DED-025 与 DED-023 在TP机制上的概念重叠"
    description: |
      DED-023(通过BR-L2-018)和DED-025(M3)均将旁观者利益占比作为TP变化的驱动量。
      DED-025的增量在于将TP变化定位为"紧缩的独立通道"(与通胀不对称框架),
      而非发现新的TP变化机制。
      建议在 derivation.steps.1 中诚实标注:
      "DED-025 的 M3(TP瓦解)与 DED-023 的 TP 驱动机制(BR-L2-018)共享同一底层
      因果关系(利益占比→TP强度)。DED-025 的增量在于将这一因果关系嵌入
      通胀/紧缩不对称的方向性框架, 而非提供独立的 TP 变化机制。"
    affects: derivation.steps.1

