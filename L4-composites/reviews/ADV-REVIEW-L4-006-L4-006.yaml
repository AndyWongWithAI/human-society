        平凡格: G1、G2、G3、G7、G8。

        ≥4 个核心合力格满足"至少一个合力格"的最低门槛。
        G14（C2）是真正交互级涌现——一个父推论的机制（碎片化）创造了条件，另一个（内容独立性）提供了差异结构，第三个（认知重组）提供了个体层反应——三力咬合。
        整体涌现以合取级为主，交互级仅 G14——这与 L4-006 的 emergence_tier 自评一致。通过。

