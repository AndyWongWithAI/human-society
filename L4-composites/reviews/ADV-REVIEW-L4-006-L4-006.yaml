      - T2(道德替代法律): 不在任何父推论中。DED-023 说 TP+INT 可自我维持, 不说"在制度化应出现时仍可替代制度"。
      - C1(法律腐蚀道德): 不在任何父推论中。DED-024 讲对等性信号断裂→内化瓦解, 不说"法律存在本身成为瓦解触发"。
      - C2(道德腐蚀法律): 不在任何父推论中。DED-016 讲碎片化(档B), 不说"碎片化反噬法律合法性"。
