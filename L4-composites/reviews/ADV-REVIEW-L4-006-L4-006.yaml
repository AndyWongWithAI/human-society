        - DED-025: M4 代际传导贯穿两阶段。角色: 中。✓
          注意: DED-025 排除"法律驱动的标准变化"，已由 scope_bridge 桥接——M4 机制本身不依赖"无法律"前提。
        - DED-024: 仅在阶段B 合法适用（法律弱化后 → 实际违规行为出现 → sucker effect 条件满足）。✓
          阶段A 的机制（过度合理化）诚实标注为 external_bridge: SDT——非 DED-024 机制，非任何父推论机制。
        - external_bridge: SDT 过度合理化效应——外部强制 → 归因外化 → 内在动机挤出。阶段A 的核心引擎。✓（诚实标注）
