        DED-024 在阶段B 合法但需额外条件触发（法律弱化）。
        Round 1 的机制误用已完全修复。当前标注准确。

        G13: >D, 强法, TP-only → C1 充分发展态。强法律 + 已无内化 → 纯外部执行。
        独立验证: 同 G12 的机制链——从 +TP+INT → +TP-INT 的瓦解路径: 阶段A（SDT 过度合理化）→ 进入 TP-only → 阶段B（若法律弱化则 DED-024 接管）。
        DED-016（强制度）+ DED-023（+TP,-INT 格行为签名）+ DED-025（M4 代际传导）。3 父合力 + external_bridge。
        与 G12 一致——DED-024 在瓦解路径中的角色限于阶段B。✓

        G14: >D, 强法, 碎片化 → 【C2 格】强法律 + 道德碎片化。法律必须在不可通约的道德主张间选边 → 落选方认知重组 → 合法性受损 → 执法成本飙升。
