        剩余威胁: "法律感知合法性"调节变量尚未正式纳入 C1 命题（SF-1）——这意味着 C1 的适用范围仍稍有过强宣称之嫌。但 counterexamples + primary_suspect + methodological_caveat 的联合诚实标注已将风险暴露在明处。对 verified 而言足够。通过。

  # ============================================================
  # L4 专属红旗 (11-17) — 逐条攻击
  # ============================================================

  l4_exclusive_red_flags:
    11_spectator_brick:
      verdict: pass
      note: |
        Round 2 独立重做移除检验（对照四条父推论原文）:

        移除 DED-016:
        - T1 失去"法律在什么规模条件下出现"——退化为"法律可以替代道德"的常识复述。
        - C2 的碎片化路径（档B）失去父推论来源——DED-023 的内容独立性原义是跨文化/时期的内容不同象限归属，不直接预测 within-group 不可通约的道德碎片化。DED-016 的档B 是 within-group 碎片化的结构来源。
        → DED-016 对于 C2 的机制贡献独特且不可替代。非观众砖。

        移除 DED-023:
        - T2 失去 TP+INT 自我维持机制——不知"道德凭什么在无法律时撑得住"。
        - C1 失去区分 TP 和 INT 的能力——C1 核心预测"INT 被挤出而 TP 仍由法律维持"依赖正交轴。无此区分，C1 与 T1 重合。
        - C2 失去内容独立性——不知"不同亚群为什么对同一行为有不可通约的道德判断"。
        → DED-023 对于 C1 和 C2 的机制贡献均不可替代。非观众砖。

        移除 DED-025:
        - O 失去道德端熵增通道——交叠区的"两端熵增"论证失去一半。
        - T1 的 TP 瓦解逻辑: DED-023（通过 BR-L2-018）已给出"TP 随利益占比稀释而下降"——DED-025 的增量在方向性框架（通胀-紧缩不对称）和将 M3 定位为紧缩独立通道。
        - C1: M4 代际传导贯穿两阶段——DED-025 的 M4 是代际传导的唯一父推论来源。
        → DED-025 对 O、T1、C1 均有机制贡献。非观众砖。但与 DED-023 在 TP 机制上的概念重叠（共享 BR-L2-018 作为 TP 变化的底层驱动）应诚实标注——见 SF-3。

        移除 DED-024:
        - C1 失去阶段B（法律弱化后的加速瓦解）的 sucker effect 机制——两阶段模型缺后半段。
        - C2 失去阶段3 认知重组（替代路径: 意识形态转换）——"碎片化 → 合法性受损"的个体层机制缺位。
        - T2 失去 INT 不瓦解的边界条件。
        → DED-024 在 C1（阶段B）、C2（替代路径）、T2（维持条件）中均有合法贡献。非观众砖。

        总评: 四条父推论均有不可替代的机制贡献，无观众砖。DED-025 与 DED-023 在 TP 变化机制上存在概念重叠——两者均引用 BR-L2-018，DED-025 的增量在方向性框架（通胀 vs 紧缩）而非新 TP 变化机制。此重叠不影响观众砖判定（各有独立贡献），但 SF-3 的诚实标注建议合理。通过。

    12_trivial_conjunction:
      verdict: pass
      note: |
        Round 2 独立检验修复后的五条动力学是否仅是父推论结论的 AND/OR 拼接:

        T1（法律替代道德）: 需要"制度化出现"（DED-016）+ "TP 瓦解"（DED-023/025）+ "法律可接管 TP 的执行功能"（L4-006 自建桥接——不在任何父推论中）。非平凡合取。

        T2（道德替代法律）: 需要"TP+INT 自我维持"（DED-023）+ "INT 不瓦解的边界条件"（DED-024）+ "可替代法律"（跨系统比较——不在任何父推论中）+ "此格罕见"（DED-016 负向约束）。非平凡合取——最接近平凡但也具备不可约简的跨系统要素。

        C1（法律腐蚀道德——两阶段模型）: 阶段A 核心机制（SDT 过度合理化效应）不在四条父推论任何一条中——诚实标注为 external_bridge。阶段B 合法使用 DED-024 stage 2 sucker effect。DED-016 提供背景（制度化在场），DED-023 提供结构表征（TP×INT 区分），DED-025 提供代际传导（M4）。结论"法律系统性挤出道德内化"不在任何父推论中。非平凡合取。

        C2（道德腐蚀法律）: 需要三步合成——碎片化（DED-016 档B）+ 内容独立性（DED-023）+ 认知重组（DED-024 替代路径）→ 合法性受损。不在任何父推论中。真交互——三机制咬合。非平凡合取。

        O（交叠区维护成本）: 需要"法律覆盖 + 道德覆盖"的表征（DED-016 + DED-023）+ "两端熵增"的合取（道德端 DED-025 M3/M4 + 法律端 PHY-001）。两端熵增的合取不在任何父推论中。法律端熵增来自 PHY-001（L0 公理）而非 L3 父推论——诚实标注。非平凡合取。

        裁决: 五条动力学均非父推论结论的简单 AND/OR 拼接。至少具备一条不在任何父推论中的桥接前提或交互结论。C1 做到了诚实的 external_bridge 标注。非平凡合取通过。

    13_emergence_missing:
      verdict: pass
      note: |
        【多父逐格判空——独立归属分析确认】

        经独立逐格标注（见红旗 #2），合力格汇总:

        真合力格（需 ≥2 父推论合力才能推出完整预测）:
        - G6（T2 格）: ≥3 父（DED-016 负向约束 + DED-023 TP+INT 维持 + DED-024 INT 边界条件 + DED-025 紧缩风险）
        - G9（O 格）: ≥2 父（DED-016 制度化 + DED-023 TP+INT 表征；DED-025 通用熵增 + PHY-001 法律端熵增构成"两端熵增"合取）
        - G12（C1 风险格）: 3 父 + external_bridge SDT（DED-016 弱背景 + DED-023 强表征 + DED-025 M4 代际传导；阶段A 核心机制来自 SDT 外部理论）
        - G14（C2 格）: 3 父（DED-016 碎片化 + 制度化并存 + DED-023 内容独立性 + DED-024 替代路径认知重组）——★★★ 最高质量交互

        弱合力格: G4（2 父）、G5（2 父）、G10（2 父）、G11（2 父）

        归零检查: 排除平凡格（G1/G2/G3/G7/G8）和弱合力格（G4/G5/G10/G11），剩余 ≥4 个核心合力格（G6/G9/G12/G14）。
        满足"至少一个合力格"的最低门槛。

        合力质量等级:
        - G14（C2）: ★★★ 真交互——三父推论机制咬合，不可由任何单父或两父组合替代。
        - G6（T2）: ★★ 合取+约束——两正向驱动 + 一负向约束。
        - G9（O）: ★★ 合取——"两端熵增"增量但一半来自 PHY-001（L0）非 L3 父推论。
        - G12（C1）: ★★ 合取+外部桥接——核心机制（SDT 过度合理化）是 external_bridge，诚实标注。

        涌现判定: L4-006 的 emergence_tier 自评"合取为主——C2 为 interaction，T1/T2/O 为 conjunction，C1 为 conjunction+external_bridge"——经独立验证，此自评准确。整体涌现以合取级为主（多父推论各自提供不同维度的机制，合起来产生完整预测），交互级涌现仅 G14（C2）一格。此分布对 L4 复合推论而言是合理且诚实的——L4 不要求所有格均为交互级。通过。

    14_weak_parent_premise:
      verdict: pass
      note: |
        四条 L3 父推论状态（经 INDEX.md 及各自原文确认）:
        - DED-016: verified（经 ADV-REVIEW-021 两轮审查 + EMP-TEST）
        - DED-023: verified（经 ADV-REVIEW-028 两轮审查）
        - DED-025: verified（经 ADV-REVIEW-031 审查）
        - DED-024: verified（经 ADV-REVIEW-029 两轮审查）

        全部 verified，无 candidate 被用作主前提。父推论状态通过。

        Scope 扩展问题: DED-023 和 DED-025 均明确排除法律语境。Round 1 的 RF-4 要求提供 scope_bridge——已到位。
        scope_bridge 的三个论证（DED-023 TP 构念作为反事实量、DED-025 M3/M4 机制不依赖"无法律"前提、诚实标注为 L4-006 自建桥接）逻辑严密。将父推论延伸到原始 scope 之外是 L4 的正当使命——scope_bridge 将此延伸从沉默升级为显式论证。通过。

    15_anchor_theft:
      verdict: pass
      note: |
        Round 2 重新审查四个 supporting anchor 的"复合特有"证据（考虑 C1 两阶段模型修复后）:

        Anchor 1（东德 → C1）:
        修复后的两阶段 C1 模型与东德经验高度一致: 阶段A（1949-1989，40 年 Stasi → INT 渐进空洞化，SDT 过度合理化）→ 阶段B（1990 统一后法律骤变 → Stasi 档案公开 → 实际违规行为可观察 → DED-024 sucker effect → 加速瓦解）。机制时序与历史事件对齐。
        需要多父推论来完整解释: DED-016（制度化背景）+ DED-023（TP×INT 区分——看到 INT 被挤出）+ DED-025（M4 代际传导——40 年横跨至少一个代际）+ external_bridge SDT（阶段A 核心引擎）+ DED-024（阶段B sucker effect）。
        标注: 真正的复合锚点——修复后的两阶段 C1 模型使东德成为 C1 的强证据。

        Anchor 2（日本 → O 格）:
        展示法律和道德共存——需 DED-016（制度化）+ DED-023（高 TP+INT）来表征。但"交叠区稳定是因为两端熵增被对抗"的机制声称在日本锚点中无直接证据。
        标注: 状态表征——展示 O 格存在性，非其维护机制的运作证据。不为 anchor theft——L4-006 已诚实标注 confidence moderate 及文化特殊性混杂。

        Anchor 3（索马里 → T2 边界）:
        氏族内 T2（道德替代法律）+ 跨氏族 C2（碎片化腐蚀法律合法性）。需多父推论: DED-016（>Dunbar 但氏族内裂变维持 <150 单元）+ DED-023（高 TP+INT 在氏族内维持）+ DED-024（INT 维持条件: xeer/伊斯兰教法的对等性信号）。
        标注: 真正的复合锚点——T2/C2 在同一案例的不同层面运作。

        Anchor 4（禁酒令 → C2）:
        近理想型 C2 实例。三父推论机制均清晰可见: DED-016（碎片化: 清教徒 vs 移民）+ DED-023（内容独立性: 酒精消费在不同亚群落不同象限）+ DED-024（替代路径: 落选方认知重组"这法律不公"，跳过阶段1-2 直接拒绝内化法律）。
        标注: 真正的复合锚点——C2 的最强证据，本推论中质量最高的锚点。

        总评: 四个锚点均需多父推论才能完整解释，不为 anchor theft。东德锚点与修复后 C1 的匹配度显著提升（两阶段模型 vs 原同步模型）。通过。

    16_interaction_measurement_gap:
      verdict: pass
      note: |
        Round 1 将此标记为 required 缺陷（RF-3 相关）。Round 2 验证修复:

        IOR（制度交叠率）测量"法律和道德同时覆盖的规范占比"——这是一个状态量，不是动态量。它可以测量共存但不能直接测量交互方向/速率。

        但 L4-006 已采取以下防护:
        (a) claim_type 从 co_evolution 降为 bidirectional_dynamics——不再预设同一案例内的双向时序闭环。
        (b) methodological_caveat 声明: "证据策略为机制分解——五条动力学分别用不同案例展示，合起来构成完整图景。当前无单一案例完整展示双向闭环。"
        (c) falsifiability (e) 预埋了对 IOR 的检验: "控制法律和道德各自独立贡献后，IOR 增量不显著 → O 的独立稳定化效应被推翻"——这给出了区分"共存"和"交互"的可操作方案（跨格比较 G13 vs G6 vs G9）。
        (d) 每条动力学有独立证伪路径: (a) T1 推翻、(b) C1 推翻、(c) C1 反方向、(d) C2 推翻、(e) O 推翻。

        当前所有锚点仍为横截面/单个历史事件，无纵向追踪数据展示跨格迁移。但 bidirectional_dynamics 的 claim_type 对此的容忍度高于 co_evolution——机制分解 + 跨格比较在方法论上是可接受的证据策略。

        concern: "速率/方向"的动态测量方案仍未给出。当前操作化测量的是状态（IOR、TP×INT 配置、法律强度），不是跨格迁移的方向和速率。对于 bidirectional_dynamics，理想情况下应补充: (i) 跨格迁移方向的判定判据（系统在向哪个格移动？）、(ii) 迁移速率的操作化（从 G12 → G13 的瓦解需要多快？）。此测量缺口不构成 required 缺陷（因 claim_type 已下调 + methodological_caveat 已诚实标注），但限制推论的可操作检验性。通过。

    17_claim_type_mismatch:
      verdict: pass
      note: |
        Round 1 将此标记为 required 缺陷（RF-3）。Round 2 验证修复:

        claim_type 从 co_evolution 改为 bidirectional_dynamics。此修改的关键意义:
        - co_evolution 预设: (a) 双向因果（A 影响 B 且 B 影响 A）、(b) 时间维度（共演是过程）、(c) 反馈循环（A 的变化触发 B 的变化，B 的变化反过来改变 A 的变化条件）——需同一案例内的双向时序证据。
        - bidirectional_dynamics 描述: 存在双向的动力学关系（替代双向 T1/T2 + 腐蚀双向 C1/C2），但不预设同一案例闭环。证据策略可为机制分解（不同案例展示不同环节）。

        对照当前证据:
        - 东德: C1 单向（法律 → 道德）
        - 日本: O 格状态表征（非动力学过程）
        - 索马里: T2（氏族内）+ C2（跨氏族）——不同层面
        - 禁酒令: C2 单向（道德 → 法律）
        五个锚点均未展示同一案例的双向闭环，但各自展示了不同动力学。bidirectional_dynamics 诚实地匹配此证据层级。

        methodological_caveat 声明了"双向闭环"的可检验标准: "在同一社会中纵向观测法律和道德配置的跨格迁移（如 G9 O 格 → G12 C1 风险格 → G13 TP-only 格 → 法律弱化崩盘后 → G6 T2 格），并证实迁移由本推论声称的机制驱动"。
        此标准是诚实的——它设定了验证 bidirectional_dynamics 的远期目标，同时承认当前证据的局限。

        claim_type 与证据之间的 gap 已通过降级 + 诚实标注弥合。通过。

  # ============================================================
  # 反例猎捕 (Round 2)
  # ============================================================

  counterexample_hunt:
    methodology: |
      按 L4 评分卡要求，猎两类反例:
      (1) 某父推论不成立 → L4-006 天花板受损
      (2) 父推论都成立，但交互不产生 L4 预测的结果（重点——L4 特有猎法）
      Round 2 额外要求: 重新检查 round 1 的近失案例是否在修复后仍有威胁。

    type1_parent_failure:
      cases: []
      note: "四条父推论均为 verified，各自经多轮对抗审查。无 scope 内反例。"

    type2_interaction_failure:
      cases:
        - id: CE-1
          label: "北欧国家——父推论都成立，但 C1 预测不成立（法律可能促进内化而非挤出）"
          status: near_miss
          severity: high
          round2_reassessment: |
            Round 1 将此识别为 C1 的核心反例。Round 2 重评:
            修复后的两阶段 C1 模型（阶段A SDT 过度合理化 + 阶段B DED-024 sucker effect）在逻辑上仍预测: 强法律 → INT 渐进削弱。
            北欧（丹麦/瑞典/挪威）: 强法律执行 + 高内化道德共存数十年，无系统性 INT 挤出证据。

            四条父推论各自成立:
            - DED-016: >Dunbar，制度化存在 ✓
            - DED-023: 高 TP+INT ✓
            - DED-025: 紧缩默认（若不持续投入，道德标准会自然松绑）✓
            - DED-024: 内化可按四阶段瓦解（若对等性信号断裂）✓
            但 C1 预测的 (+TP,+INT) → (+TP,-INT) 漂移在北欧未观察到。

            L4-006 的消化路径（已在 counterexamples + primary_suspect 中预埋）:
            "法律感知合法性"调节——北欧公民将法律感知为"集体自我管理"而非"外部强制"→ 法律不触发阶段A 的过度合理化效应（因归因未外化——个体仍将遵守归因于内在价值而非外部强制）。

            审查评估: 此消化路径在概念上自洽。但 SF-1（将"法律感知合法性"正式纳入 C1 命题表述作为调节变量）尚未执行。当前 C1 的命题在 statement 中表述为通用命题（"强法律 → INT 挤出"），而消化路径暗示它实际上是条件命题（"强法律 + 低合法性感知 → INT 挤出"）。

            对 verified 的影响: 不构成 required 缺陷。counterexamples 节 + primary_suspect 的联合诚实标注将威胁暴露在明处。methodological_caveat 进一步限制了 C1 的适用范围。C1 作为 bidirectional_dynamics 框架下五条动力学之一——其适用范围的限制不摧毁框架整体。但在未来 iteration 中，应将调节变量正式纳入 C1 命题（SF-1）。

          required_response: |
            未来 iteration: 要么 (a) 将"法律感知合法性"正式纳入 C1 命题作为调节变量并给出独立操作化方案，要么 (b) 显式声明 C1 的适用边界——"在低法律感知合法性条件下成立"。

        - id: CE-2
          label: "父推论都成立，但结果不是'双向动力学'而是'纯法律替代'（极端 T1+C1 稳态）"
          status: near_miss
          severity: moderate
          round2_reassessment: |
            Round 1 将此识别为对 co_evolution framing 的挑战——系统可长期停在 G13（纯法律替代）而不展示双向性。

            Round 2 重评: claim_type 已从 co_evolution 降为 bidirectional_dynamics——这不再要求系统必然展示双向循环。G13 是预测内格（C1 充分发展态），其存在不挑战 bidirectional_dynamics 框架——框架承认系统可以在特定格中稳定存续，双向动力学只在特定条件下（法律不太强、道德不太碎）展开。

            L4-006 的消化路径（已在 counterexamples 中）: "纯法律替代是可能但不稳定的稳态——法律在场时稳定，法律弱化时崩盘（无内化后备）"。此消化与东德案例一致。

            审查评估: 不构成 clean kill。G13 是框架的预测内格。bidirectional_dynamics framing 不要求系统始终处于双向互动中。不威胁 verified。

        - id: CE-3
          label: "法律的'道德表达功能'——法律不仅执行道德，还创造/强化道德内容"
          status: observation
          severity: moderate
          round2_reassessment: |
            Round 1 将此识别为五条动力学的枚举缺口——法律作为道德教育者（民权法案/环境法/LGBTQ 权利立法）未被建模。

            Round 2 重评: SF-2（"法律促进道德"作为第 6 条动力学路径）未执行。此功能是否可归入 O 格（法律强化对等性信号 → 促进内化）或 DED-025 M1+M2（法律作为道德创业者的工具）取决于具体案例——部分可归入但非全部。法律在民权运动中的角色不止于执行既有道德——它催化了新道德内容的产生。

            审查评估: 不构成反例——法律表达功能的存在不证伪现有的五条动力学。但建议在 discriminant_validity 中显式标注此边界（SF-2）。不威胁 verified——现有五条动力学覆盖了法律-道德关系的主要逻辑可能（替代/腐蚀/交叠），"促进"可视为交叠区（O）的一个子动力学。

        - id: CE-4 (NEW)
          label: "DED-023 的 (−TP,+INT) 不稳定预测与 L4-006 的法律语境中的交互——scope_bridge 的延伸风险"
          status: observation
          severity: low
          description: |
            DED-023 预测: (−TP,+INT) 格不稳定 → 向 (−TP,−INT) 漂移（因无 TP 维护的对等性信号断裂导致 INT 瓦解）。
            在 L4-006 的法律语境中，当法律在场时，TP 的角色被法律执行替代。此时如果法律执行强度高（代理人的制度化惩罚替代了分布式的第三方自发惩罚），DED-023 的原始 TP 构念在此语境中不再是"自发旁观者惩罚"而是"制度化执行"。scope_bridge 将此处理为可测反事实量。

            但有一个 subtle 的问题: 如果法律在场且执行强度高，法律本身提供了对等性信号（"违规会被惩罚"）——即使没有自发的第三方惩罚，对等性信号并未断裂。这意味着在法律在场的语境中，(−法律替代TP, +INT) 可能比 DED-023 预测的（−TP, +INT）更稳定——因为法律执行替代了 TP 的对等性信号功能。

            对 L4-006 的影响: C1 的预测方向与此一致——法律在场 → INT 渐进削弱（阶段A 过度合理化）。但如果法律的"对等性信号替代"效应强于"过度合理化"效应，则 C1 可能不发生。这回到了 CE-1（北欧）的核心——法律感知合法性可能是决定哪个效应占优的关键调节变量。

            审查评估: 不构成反例——这是 scope_bridge 延伸的自然张力，已在 L4-006 的 counterexamples / primary_suspect 中通过"法律感知合法性"消化路径间接覆盖。标注为 observation 级。

    hunt_summary: |
      Round 2 未猎到 scope 内干净击杀（父推论都成立 + 交互不产生 L4 预测的明确现实案例）。

      Round 1 的两个近失案例（CE-1 北欧、CE-2 纯法律替代）在修复后的 L4-006 中已通过消化路径 + 诚实标注得到有效管理:
      - CE-1（北欧）: 两阶段 C1 模型 + counterexamples 中的"法律感知合法性"消化路径。威胁 level 从 round 1 的 high 降为 near_miss（消化自洽，但需 SF-1 正式调节变量）。
      - CE-2（纯法律替代稳态）: claim_type 从 co_evolution 降为 bidirectional_dynamics 后，此威胁大幅弱化——G13 是预测内格，不要求系统始终双向往返。

      CE-3（法律表达功能）和 CE-4（scope_bridge 延伸风险）均为 observation 级——不构成反例但提示适用边界。

      最关键的发现仍不是外部反例，而是内部诚实度的显著提升: Round 1 的五个 required 缺陷（C1 机制误用、anti_talisman 缺失、claim_type 错配、scope_bridge 缺失、笛卡尔积计数错误）已全部修复到位，使 L4-006 从 needs_revision 提升到满足 verified 标准。

