    2_cell_empty_prediction:
      verdict: pass
      note: |
        【独立重建笛卡尔积并逐格归属——对照四条父推论原文】

        第一步：抽取每条父推论的核心自变量（对照原文）

        DED-016: 群体规模 {<Dunbar, >Dunbar}。因变量 = 公平维护模式 (A/B/C)。
        核心机制: 规模 → 信任断裂 + 层级嵌套 + 身份衰减 → 档A不可持续 → 碎片化或制度化。
        关键约束: >Dunbar 且无制度 → 碎片化（档B），档A在>Dunbar时空格。

        DED-023: TP强度 × INT强度（正交轴）。因变量 = 规范结构类型（四象限）。
        核心机制: TP 由旁观者利益占比驱动（BR-L2-018），INT 由发育窗口条件驱动（BR-L2-019）。
        关键约束: (−TP,+INT) 不稳定 → 向 (−TP,−INT) 漂移；迁移不对称（顺时针慢/逆时针快）。
        排除范围: 正式法律系统（制度化惩罚混淆 TP 测量）→ 已由 scope_bridge 桥接。

        DED-025: M1（受害叙事）× M2（道德创业者）→ 通胀；M3（TP 瓦解）+ M4（代际 INT 断裂）→ 紧缩。
        核心不对称: 通胀需要主动推力（M1+M2 合取），紧缩是熵增默认（PHY-001）。
        排除范围: "法律强制推动的道德标准变化"——已委托给 L4-006。
        已由 scope_bridge 桥接: M3/M4 机制不依赖"无法律"前提。

        DED-024: 对等性信号 × 意识形态资源 → 内化瓦解轨迹（四阶段，刚性顺序，阶段3 不可逆）。
        替代路径: 意识形态转换可跳过阶段2 直接进入阶段3。
        能量不对称: 瓦解快/重建慢。

        第二步：笛卡尔积逐格归属分析

        轴定义:
        X1: 群体规模 {<Dunbar (~<150), >Dunbar (~>150)} — DED-016
        X2: 法律制度化 {无, 弱（proto-C）, 强（专职机构 >50% 执行）} — DED-016 档C + L4-006 强弱二分
        X3: 道德 TP×INT 配置 {高 TP+INT, TP-only, 碎片化（档B）} — DED-023 + DED-016 档B

        总计 2×3×3 = 18 格。排除 <Dunbar + 强法律 3 个物理上不可能格 = 15 有意义格。
        L4-006 分析 G1-G14 共 14 格，第 15 格（<Dunbar + 弱法 + 碎片化）诚实标注为经验上近空不再单独列格。计数正确。

        —— 规模 <Dunbar ——

        G1: <D, 无法, 高 TP+INT → 面对面道德，秩序稳定。
        独立验证: DED-016 档A 单独强制——规模内面对面公平可行 + 共享身份维持统一规范。
        DED-023 提供结构标签 (+TP,+INT) 但不改变预测 → DED-016 solo。平凡。

        G2: <D, 无法, TP-only → 外部执行无内化，暂稳。
        独立验证: DED-023 (+TP,-INT) 单独预测行为签名。无父推论强制此格为空 → DED-023 solo。平凡。

        G3: <D, 无法, 碎片化 → 小群不应碎片化。
        独立验证: DED-016 档A 隐含此格近空（小群共享身份 → 碎片化经验上罕见）→ DED-016 solo。平凡负预测。

        G4: <D, 弱法, 高 TP+INT → proto-C 制度 + 强道德。
        独立验证: DED-016 档C 门槛 + DED-023 Q1（完全道德）。2 父合力。L4-006 自认"经验上罕见，非核心贡献格"——诚实。

        G5: <D, 弱法, TP-only → 制度 + 外部执行。
        独立验证: DED-016 + DED-023。2 父合力。

        —— 规模 >Dunbar ——

        G6: >D, 无法, 高 TP+INT → 【T2 格】法律真空 + 道德自我维持。
        独立验证:
        - DED-016: 预测 >Dunbar + 无制度 → 碎片化。故 DED-016 预测此格不稳定/近空。角色 = 负向约束（解释为什么罕见）。
        - DED-023: (+TP,+INT) 可自我维持。DED-023 不涉及规模限制 → 正向机制。
        - DED-024: 提供 INT 不瓦解的边界条件（对等性信号完好 + 发育窗口满足）→ 正向机制。
        - DED-025: M3/M4 紧缩通道——解释为什么即使存在，此格仍需持续维护能量。
        → ≥3 父合力（DED-016 负向约束 + DED-023/DED-024 正向驱动 + DED-025 紧缩风险）。
        真合力——"可以存在但罕见且边界条件苛刻"这一完整预测需要多父推论。注意：DED-016 在此为阻力/约束而非推力——这不影响合力计数但影响合力质量（负向约束 ≠ 正向机制交互）。

        G7: >D, 无法, TP-only → TP 正在瓦解（DED-025 M3），无 INT 兜底，无法接管 → 霍布斯式失序。
        独立验证: DED-016 隐含此格不稳定（档A 不可持续 + 两者皆无 → 失序）。DED-025 M3 给出 TP 瓦解的具体机制通道。
        DED-016 solo 为主，DED-025 补充机制细节。近平凡。

        G8: >D, 无法, 碎片化 → DED-016 档B 标准路径。
        独立验证: DED-016 单独强制。平凡。

        G9: >D, 弱法, 高 TP+INT → 【O 格——交叠区】弱法律 + 强道德 → 双重覆盖，最稳定。
        独立验证:
        - DED-016: 制度化存在（弱法归于档C 谱系）→ 正向。
        - DED-023: (+TP,+INT) 表征 + 自我维持条件 → 正向。
        - DED-025: 道德端熵增默认（M3/M4）→ 交叠区需持续能量维护。但此熵增适用于任何含道德的格——非 G9 特有。
        - 法律端熵增（PHY-001 → 组织熵增）：来自 L0，非 L3 父推论。合法但不增加父推论合力计数。
        - "两端熵增"合取是真正的增量——不在任何单条父推论中。但合取的一半来自 PHY-001 而非 L3 父推论。
        → ≥2 父合力（若仅计 L3 父推论）或 ≥3（若计入 DED-025 通用熵增）。
        合力成立——"交叠区的最稳定性需两端持续砸能量"这一完整逻辑需要多父 + PHY-001。

        G10: >D, 弱法, TP-only → 弱法律 + 外部执行。
        独立验证: DED-023 (+TP,-INT) + DED-016（弱法存在）。2 父合力。

        G11: >D, 弱法, 碎片化 → 弱法律桥接碎片化道德——张力格。
        独立验证: DED-016（碎片化 + 制度化并存）+ DED-023（内容独立性）。2 父合力。

        G12: >D, 强法, 高 TP+INT → 【C1 风险格——Round 2 验证修复质量】
        Round 1 修后机制链: 阶段A（external_bridge: SDT 过度合理化——法律在场 → 归因外化 → INT 渐进削弱，月-年级）+ 阶段B（法律弱化后 → 实际违规出现 → DED-024 stage 2 sucker effect 激活 → 加速瓦解，周-月级）。DED-025 M4 代际传导贯穿两阶段。
        独立验证逐父推论:
        - DED-016: 强法的规模条件（>Dunbar 使制度化可能）。角色: 弱背景条件。✓
        - DED-023: 区分 TP 和 INT——无此区分看不到"INT 被挤出而 TP 仍在"。角色: 强表征。✓
