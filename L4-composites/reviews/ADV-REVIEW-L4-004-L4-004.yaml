      cases:
        - id: CE-round3-1
          label: "电报(19 世纪中叶):信息传输成本崩塌但未触发相变"
          description: |
            电报将信息传输时间从数周(物理邮件)降至数分钟——传输成本下降了远超
            一个数量级。但 1850-1900 年间:
            - 组织深度:铁路公司/早期跨国公司有所扩张,但管理层级未出现 ≥2 级的跃迁
            - 规范数:无大规模法律成文化由电报直接触发
            - 交换半径:电报加速了已在进行中的全国市场整合,但未触发新的交换制度形态
            - 支配制度化:权力结构仍以民族国家为基本单元,未因电报发生相变

            这是"IT 成本在单一维度(传输)发生数量级下降,但社会复杂度无相变"的案例。

            L4 吸收机制:IT 成本的操作化涵盖存储+传输+检索三类成本。电报主要降低了
            传输成本,存储和检索成本基本未变——按 L4 的复合 IT 成本定义,电报可能
            不构成"≥1 数量级的综合 IT 成本跃迁"。此外,L4 已提及"电报、广播/电视
            可能构成额外的亚相变",暗示这些单一维度 IT 跃迁的相变强度较弱。

            审查评估:不是 clean kill——L4 的复合 IT 成本定义(三类成本)已为此类
            案例预留吸收空间。但此案例对 L4 的"IT 成本"测量提出了 sharper 的操作化
            要求:三类成本的综合度量如何加总?需要加权吗?当前操作化(information_
            technology_cost.measurement)给出了三种成本的独立测量方法,但未给出
            综合判据——三类成本中至少几类需要数量级下降才算"触发相变"?
          status: observation
          severity: observation
          note: |
            建议(非 required):在 operationalization 中补充综合判据——
            "≥1 数量级综合跃迁"的操作化:如"三类成本中至少两类各自下降 ≥1 数量级,
            或综合指数(对数加权)下降 ≥1"。电报若只满足传输成本下降,则不触发全相变
            预测(仅触发亚相变/单维度响应)。这会使 L4 的判别力更强。

        - id: CE-round3-2
          label: "Song 中国路径依赖极端条件边界——外部冲击确实存在"
          description: |
            L4 将中国活字印刷未触发民族国家相变归入路径依赖的"极端压制条件":
            (i) IT 跃迁幅度接近下限,(ii)强制度锁定(科举+郡县),(iii)无外部冲击。

            但 Song 中国面临显著外部冲击:Jurchen 征服北方(1127,靖康之变)→Song 南迁;
            Mongol 征服(1279 灭宋)。这些是破坏制度均衡的 massive external shocks——
            条件(iii)"无外部冲击"可能不成立。

            路径依赖的极端条件是否应在外部冲击存在时仍能压制相变?关键在时序:
            活字印刷 ~1040,靖康之变 ~1127(Δ≈87 年)。87 年内活字印刷是否有充分时间
            在 Song 制度框架内扩散并产生相变效应?活字印刷在 Song 中国确实未大规模
            替代雕版印刷(汉字数万字符使活字排版的经济性远低于欧洲拼音文字)——
            这暗示"IT 跃迁幅度接近下限"可能才是更关键的条件,而非"无外部冲击"。

            L4 的回应:极端条件为充分条件(满足→相变信号不可见),非必要条件。即便
            条件(iii)不完全满足,只要条件(i)+(ii)足够强,相变信号仍可被压制。

            审查评估:非反例——L4 的"极端条件"逻辑自洽,活字印刷在 Song 的低扩散率
            (技术可用≠社会使用)本身就是条件(i)的体现。但此案例暴露:四个事前路径依赖
            指标的预测方向是概率性的,在实际应用中可能出现"多个指标指向不同方向"的
            模糊情况。这需要 L4 给出指标间冲突时的裁决规则(如优先级排序)。
          status: observation
          severity: observation
          note: |
            建议(非 required):在 path_dependency operationalization 中补充
            指标间冲突的裁决规则。如:当政体结构(指标 a)指向"强化既有官僚制"而
            权力集中度(指标 b)指向"被迫制度化"时,如何综合判定预测方向?

        - id: CE-round3-3
          label: "\"联合可行域\"构念的附加经验内容有限"
          description: |
            即使 synchronicity_threshold 为"联合"提供了经验内容(≥3/4 维度同步),
            "联合可行域"作为理论构念,其大部分预测内容仍可由四个独立维度的测量
            各自提供。真正的"联合"增量仅在同步性检验和路径依赖方向约束中体现。

            这不是反例——L4 已诚实标注此局限("联合可行域是理论构念,精确边界需要
            编码方案校准")。但若未来操作化发现四个维度在三个跃迁案例中均不同步
            (全部落入 fallback→异步响应),则"联合可行域"构念的经验增量进一步收缩
            至零——只剩下概念统一(consilience)的理论价值,不再有经验预测价值。
          status: observation
          severity: observation
          note: |
            这是 L4 的固有局限,非可修复缺陷。若 Transition 2 和 Transition 3 的
            synchronicity 检验也落入 fallback,L4 自然退守为"异步梯次响应模型"——
            这仍是比四条独立因果链更强的理论(因为有共享约束+时序模式),
            但比"同相跃迁"弱。退守路径已内置,理论不会因退守而塌陷。

    hunt_summary: |
      本轮独立猎捕:
      - 未获 scope 内干净击杀(即"四条父推论机制都成立,但 L4 的交互预测在某案例中
        被明确证伪"的案例)
      - 猎到三个观察级近失/边界案例:
        CE-round3-1(电报):暴露 IT 成本复合度量需综合判据
        CE-round3-2(Song 中国边界):暴露路径依赖指标冲突时需裁决规则
        CE-round3-3(联合可行域增量):暴露构念的经验内容可能随检验结果退化

      三个案例均不构成证伪——L4 已内置吸收机制(fallback、极端条件、诚实标注)。
      它们指向的是操作化精细化方向,而非逻辑缺陷或经验反驳。

      与 round 1-2 猎获的对比:
      - round 1 CE-2(四个维度不同步)已在 round 1 RF-1(synchronicity_threshold)
        和 round 2 RF-6(Transition 1 fallback)中解决
      - round 1 CE-3(伊斯兰纸张革命)已在 round 1 RF-3(anti-talisman)中封堵
      - round 2 CE-2a(Transition 1 内部不一致)已在 round 2 RF-6 中解决
      - round 2 CE-4(丝绸之路)和 CE-5(查士丁尼法典)已在 round 2 SF-6
        ("主驱动量"→"硬边界条件")中吸收
      先前所有 near-miss 案例均已通过定向修复被吸收或封堵,本轮无新 near-miss 升级为 kill。

  # ============================================================
  # 与 DED-004 / DED-007 的对照 — round 3 复核
  # ============================================================

  non_recurrence:
    ded004_check:
      verdict: pass
      note: |
        DED-004 死因:条件双重身份(自变量同时也是被预测量)+事后用结果反推条件。
        L4-004 经三轮加固后已规避:
        - IT 成本由物理-技术指标独立测量(存储介质成本/传输速度/检索人时),不由社会
          复杂度结果反推
        - 社会复杂度由四个维度的独立测量方案测定,不与 IT 成本共享测量源
        - anti_talisman 四硬约束封堵了所有循环论证路径
        - 路径依赖四指标在 IT 跃迁前可独立判定,不由相变结果反推
        未重蹈 DED-004。维持 pass。

    ded007_check:
      verdict: pass
      note: |
        DED-007 死因:三个假说各自吸收各自的案例,缺乏可被共同证据裁决的争议点。
        L4-004 经三轮加固后已规避:
        - falsifiability 给出四个明确的证伪条件(a-d),所有案例共享同一组独立可测变量
        - synchronicity_threshold 提供了统一的裁决判据(≥3/4 维度在 N 年窗口内响应)
        - fallback 机制确保判据失败时有明确的退守路径(异步响应模型),而非弹性调整
        - prediction (v)给出了 L4 特有空格,其填满或落空直接裁决 L4 的核心主张
        未重蹈 DED-007。维持 pass。

  # ============================================================
  # 综合评估
  # ============================================================

  overall_assessment: |
    【三轮审查轨迹】

    Round 1(5 required + 4 should):识别出核心操作化赤字——synchronicity 无时间窗口、
    Cell-C 机制嫁接、anti-talisman 缺位、锚点复用、路径依赖弹性过大。全部定向修复。

    Round 2(2 required + 2 should):识别出内部不一致——Transition 1 不满足自定 200 年
    窗口、Cell-A 标注与 Anchor 1 诚实分析矛盾。全部定向修复,fallback 激活,标注统一。

    Round 3(0 required,3 observations):未发现新的 required 级缺陷。三个观察级案例
    (电报综合判据、Song 指标冲突裁决、联合可行域增量退化)指向操作化精细化的方向,
    不构成逻辑缺陷或经验反驳。

    【理论骨架定论】

    L4-004 的坚固内核:
    1. IT 成本是四条社会天花板共享的硬边界条件——概念统一(consilience),非平凡合取
    2. 天花板移动的模式(同步/异步/梯次)是可检验的经验主张——prediction (v)
    3. 相变方向受制度禀赋约束——路径依赖四指标事前预测框架
    4. 每个 IT 水平定义了社会复杂度的联合可行域——边界外"长不出"某些制度形态

    这四个命题形成一条完整的理论链:边界条件(IT 成本)→四条天花板→移动模式(同步/
    异步)→方向选择(路径依赖)。链条的每个环节都有操作化判据和证伪路径。

    【诚实的理论定位】

    与初始版本相比,当前版本已大幅诚实化:
    - "相变"不再是物理学意义(claim_type=co_evolution+启发式隐喻)
    - "同相跃迁"不再对三次 IT 跃迁等同(Transition 1 标注为异步/梯次)
    - "复合锚点"不再伪装交互证据(三个降级为 common-cause/external/partial)
    - "父推论合力"不再过度声称(仅 Cell-B 为弱合力,其余诚实标注)
    - "主驱动量"弱化为"硬边界条件"(区分边界与边界内驱动)

    这种诚实不是理论的削弱——恰恰相反,它使理论的可检验性清晰、证伪路径明确、
    退守路径内置。这是一条诚实的、有判别力的中层理论。

    【剩余观察(非 required)】

    1. Transition 2(印刷)的 synchronicity 检验 pending——若也落入 fallback,
       L4 的"同相"主张仅剩 Transition 3(数字,进行中未确认),整体退守为异步模型
    2. IT 成本的三类成本(存储/传输/检索)综合判据待精细化——当前"≥1 数量级综合跃迁"
       的操作化可进一步说明三类成本的加权/聚合方式
    3. 路径依赖四指标冲突时的裁决规则——当不同指标指向不同预测方向时如何综合

    这些问题不阻塞 verified——它们属于"进一步操作化"而非"修复缺陷"。L4 的当前
    操作化精度已足够支撑其核心主张的可检验性。

  required_fixes: []

