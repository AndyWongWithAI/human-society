        真为主驱动量"(塌则全塌)。secondary_suspect 为"数字相变是质变还是加速"
        (仅影响 prediction iii)。调换正确合理。round 1 SF-3 landed。

  # ============================================================
  # L4 专属红旗 (11-17) — round 2 逐条深攻
  # ============================================================

  l4_exclusive_red_flags:
    11_spectator_brick:
      verdict: pass
      round1_status: "pass — 维持"
      note: |
        逐一移除检验(round 2 独立重做,对照父推论原文):
        - 移除 DED-001:失去"信息传递衰减→层级天花板"——DED-001 原文自变量=r(保真率),
          L4 将其归约为 IT 成本的函数。移除后无法解释组织规模非线性扩张。不冗余。
        - 移除 DED-002:失去"规范认知负荷上限→成文化突破"——DED-002 原文自变量=E(外部存储),
          L4 将其归约为 IT 成本。移除后无法解释法律体系与 IT 跃迁同步涌现。不冗余。
        - 移除 DED-006:失去"信任半径天花板→制度外化"——DED-006 原文自变量=交换网络突破
          信任半径(匿名×广度),L4 将其归约为 IT 成本的后果。移除后无法解释交换半径扩张。
          不冗余。
        - 移除 DED-010:失去"权力信号衰减→制度化降本"——DED-010 原文自变量=衰减率×规模,
          L4 将其归约为 IT 成本的函数。移除后无法解释支配形态转型。不冗余。

        四条各提供不可替代的因果通路,无观众砖。

        但本轮补充观察:L4 的"共享驱动量"论证实际上对每条父推论做了一步
        【概念归并】——将各自的自变量(r/E/匿名×广度/衰减率×规模)统一解释为
        "信息技术成本"的不同侧面。这个归并步骤本身不是从父推论中导出的——
        父推论各自独立定义了自变量,没有一条说"我的自变量本质上是 IT 成本"。
        这是 L4 添加的新主张。正因如此,四条父推论都不是观众砖——
        它们各自提供了 L4 归并所依赖的底层机制。

    12_trivial_conjunction:
      verdict: pass_with_caveat
      round1_status: "needs_revision(required) → 部分修复"
      note: |
        【本轮核心战场之一】

        round 1 的核心攻击:Cell-A(文字×四维度)是 common-cause parallelism
        非父推论合力;Cell-C(印刷×民族国家)依赖外部(Anderson)机制非 DED-002;
        仅剩 Cell-B(数字×组织深度双向选择)为唯一合力格且弱。

        作者回应(RF-2):Cell-C 已诚实修正为 external_bridge。Cell-A 维持
        "需四条父推论合力"标注(理由:"单条只能描述单维度,描述整体跃迁需四条")。

        本轮独立复核——笛卡尔积逐格归属:

        | IT水平 \ 维度 | 组织深度 | 规范数 | 交换半径 | 支配制度化 |
        | 口头 | DED-001 solo | DED-002 solo | DED-006 solo | DED-010 solo |
        | 文字 | DED-001 solo | DED-002 solo | DED-006 solo | DED-010 solo |
        | 印刷 | DED-001 solo | DED-002 solo | DED-006 solo(+Anderson) | DED-010 solo |
        | 数字 | DED-001+DED-010(弱合力) | DED-002 solo | DED-006 solo | DED-010 solo |

        需要父推论合力的格子:
        Cell-B [数字×组织深度]:DED-001 预测"数字→r 提高→可更深",
        DED-010 预测"数字监控→中层被替代→可更平"。
        两力合起来给出"技术使组织可双向选择(深或平)"。
        → 技术上满足 ≥2 父推论合力,但为弱合力(AND of two independent
        possibility predictions,not interaction producing novel necessity)。

        非合力的格子(诚实标注):
        Cell-A [文字×四维度]:文字发明作为单一共同原因→四条独立因果链→
        四个并行变化。这是 common-cause parallelism,不是交互。
        "四个维度都变了"可由各父推论独立认领;"它们构成整体相变"是概念概括
        (construal),不是机制交互。作者在 Anchor 1 的 composite_specific
        中已诚实承认此点("本锚点为 common-cause parallelism 的案例展示,
        非复合交互效应"),但在 derivation Cell-A 中仍标注"需四条父推论合力"——
        这两处自相矛盾。应将 Cell-A 降级标注以与 Anchor 1 保持一致。

        L4 的非平凡内容不在逐格交互,而在:
        (a) 共享驱动量的概念归并(consilience)——将 r/E/匿名×广度/衰减率×规模
            统一为"IT 成本"
        (b) 同相跃迁的经验主张——四个维度是否同步响应 IT 跃迁
        (c) 路径依赖对相变方向的约束
        这三者均非父推论 AND 拼接。(a)是概念统一,(b)(c)是新经验主张。
        故 trivial_conjunction 通过——L4 有非 AND 内容,不是平凡合取。

        但 caveat:非平凡内容较 thin。L4 的 bulk empirical weight 仍在父推论
        各自已覆盖的单维度变化上;L4 的真正增量(共享驱动量+同相+路径依赖)
        是三层较薄的理论层,叠加在父推论的厚实经验基础上。

    13_emergence_missing:
      verdict: needs_revision
      severity: required
      note: |
        【本轮审查核心产出——逐格判空归属分析 + 内部一致性审查】

        逐格判空重建(独立重做,对照四条父推论原文):

        1. 提取每条父推论的核心自变量:
           - DED-001: 信息传递保真率 r (操作化:序列传递实验)
           - DED-002: 外部存储容量 E (口头=0,文字>0,印刷>>0,数字→∞)
           - DED-006: 交换网络突破信任半径 = 匿名度×广度
           - DED-010: 权力信号衰减率 δ × 被支配规模

        2. 四个自变量与"IT 成本"的关系:
           父推论原文均未声称其自变量"本质上是 IT 成本"或"由 IT 成本驱动"。
           DED-001 的 r 由通信媒介的实验测量决定,不由 IT 成本决定;
           DED-002 的 E 由存储介质物理特性决定;
           DED-006 的"匿名×广度"由交易网络结构决定;
           DED-010 的"δ×规模"由权力关系结构决定。
           L4 将这些自变量统一归约为"IT 成本"的不同侧面——这是概念归并,
           非从父推论逻辑中必然推出。

        3. 笛卡尔积逐格标注(见 #12 表格):
           - 口头行:全部 solo
           - 文字行:全部 solo(见下方 Cell-A 分析)
           - 印刷行:全部 solo(交换半径格需 Anderson 外部,nor parent synergy)
           - 数字行:仅组织深度格需合力(弱),其余 solo

        4. 合力格深度审查:

        Cell-B [数字×组织深度双向选择]——L4 标注"需 DED-001+DED-010 合力"
        审查裁决:技术上确需两父推论(每人只贡献一个方向),但为弱合力。
        DED-001 本身不强制"更深"(只说"天花板上升→更深变为可能"),
        DED-010 本身不强制"更平"(只说"监控降低中层需求→更平变为可能")。
        两力合起来是"两种可能性同时开放"(AND of possibilities),
        非"交互产生单一不可分解的新预测"。任何同时读过两父推论的人
        都能独立推出此结论——L4 的"涌现"在此格中增量有限。
        评分:通过最低门槛(至少一个合力格),但标注为 weak_synergy。

        Cell-A [文字×四维度→整体社会形态跃迁]——L4 标注"需四条父推论合力"
        审查裁决:【不成立——此为 common-cause parallelism,非交互】

        逐父推论检验:
        - DED-001 独立推导:文字→r 提高→更深组织可能。不依赖其他三维度。
        - DED-002 独立推导:文字→E>0→成文化可能。不依赖其他三维度。
        - DED-006 独立推导:文字(书面契约)→可追踪性提高→交换半径扩张可能。不依赖其他三维度。
        - DED-010 独立推导:文字→职位可记录→制度化可能。不依赖其他三维度。

        四个维度的变化之间没有交叉依赖——没有一条父推论说"我的维度的变化
        以另一维度的变化为前提条件"。它们是同一事件(文字发明)通过四条
        独立因果链产生的并行效果。类似于太阳升起同时使温度上升、亮度增加、
        植物光合作用、动物活动——这四条链独立运作,不需要交互来解释"白天"。

        L4 的论证:"单条父推论只能描述单维度变化,但描述整体社会形态跃迁
        需四条合力"——这混淆了"描述需要"与"预测需要"。描述四个维度的变化
        当然需要四个父推论(这是平凡的),但预测每个维度的变化只需要各自的
        父推论——四个预测是独立可得的,不需要交互。

        【关键:内部自相矛盾】作者在 real_world_anchors.Anchor_1.composite_specific
        中已诚实承认:"本锚点为 common-cause parallelism 的案例展示,非复合交互效应"、
        "四个维度各自的变化可被各条父推论独立认领"、"L4 的贡献不在此锚的证据层面,
        而在概念统一层面"。但在 derivation.steps.4 的 Cell-A 分析中,
        仍标注"需四条父推论合力描述这个整体跃迁"——与 Anchor 1 的分析直接矛盾。

        裁决:Cell-A 应诚实降级,移除"父推论合力"标注,与 Anchor 1 保持一致。
        Cell-A 的贡献在概念统一(consilience)层面,不在机制交互层面。

        归零检查:
        排除 Cell-A(common-cause parallelism)、Cell-C(external_bridge,
        已由 round 1 修正),仅剩 Cell-B(弱合力)。
        Cell-B 技术上满足"至少一个合力格"的最低门槛,但合力强度弱——
        任何同时读过 DED-001 和 DED-010 的人都能独立推出"数字技术使组织
        可更深也可更平",L4 在此格中的"涌现"增量有限。

        L4 的真正涌现不在逐格交互层面,而在:
        (i) 概念统一:四个天花板共享底层逻辑(信息操作的物理成本)
        (ii) 同相/异步的经验主张:四个维度是否同步响应 IT 跃迁(prediction v)
        (iii) 路径依赖:相变方向受相变前制度禀赋约束

        这三者确非任何单条父推论所包含。但 L4 在逐格判空中过度声称
        Cell-A 为父推论合力——这不仅技术上不成立(是 common-cause parallelism),
        且与作者自己在 Anchor 1 中的诚实分析自相矛盾。

        Required 修复:要么(a)移除 Cell-A 的"需四条父推论合力"标注,
        诚实标注为 common-cause parallelism(与 Anchor 1 一致);
