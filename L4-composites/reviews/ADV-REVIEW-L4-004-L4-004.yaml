id: ADV-REVIEW-L4-004
target: L4-004
date: 2026-07-14
type: adversarial_review
layer: L4-composites
round: 1
reviewer: "独立对抗审查者 (全新上下文, round 1)"
人话摘要: "L4-004 有真东西——找到四条父推论共享的信息技术成本这一共同驱动量——但核心弱点有三: (1) 逐格判空只找到一个弱合力格 (Digital × Org), 且 Cell-C 把 DED-002 不包含的'语言标准化→民族国家'机制硬塞给 DED-002; (2) 四个'复合锚点'中有三个只是在复述各父推论各自在同一历史时期的锚点, 未提供交互证据; (3) '同相跃迁'的时标阈值未操作化, 使核心可证伪预测漂浮。判 needs_revision, 给出了 5 条 required 最小修复清单。"

# ============================================================
# 标准红旗 (1-10) — 逐条攻击
# ============================================================

standard_red_flags:
  1_brick_conclusion:
    verdict: pass
    note: |
      L4 的核心命题——"四条天花板共享同一主驱动量(信息技术成本)且以同一相位跃迁"——
      不在任何单条父推论的结论中:
      - DED-001 只说"口头 r→天花板 5-7; 形式化系统可突破", 不说跨维度共移。
      - DED-002 只说"口头规范有复杂度天花板; 成文化可突破", 不说与管理/交换/支配天花板共享驱动量。
      - DED-006 只说"交换网络突破信任半径→外化制度", 驱动量是"半径突破(匿名×广度)", 不是"IT 成本"。
      - DED-010 只说"权力信号衰减×规模→展示成本或制度化", 驱动量是"衰减率×规模", 不是"IT 成本"。
      无单条父推论包含"四个领域由同一脉冲同时推动"这一系统层次命题。

  2_cell_empty_prediction:
    verdict: pass_with_concern
    note: |
      L4 prediction (iv) 的逐格判空——"无文字+组织深度>7层+长期稳定预测为空"——
      是 DED-001 的空格, 不是 L4 特有的空格。DED-001 已将此格排除。
      L4 真正的独特空格在 falsifiability (b): "四个维度的天花板移动由不同的时间表和
      触发条件驱动"——若此格被现实填上(各维度不同步), L4 被证伪。这是一个真正的
      经验主张, 非同义反复。
      建议: 把 L4 特有空格明确放到 prediction 节, 而非仅放在 falsifiability 节。

  3_measurement_orthogonal:
    verdict: pass_with_concern
    note: |
      IV(信息技术成本)由物理-技术指标测(存储介质成本、传输速度、检索人时),
      独立于社会结构产物。DV(社会复杂度联合可行域)由各父推论的独立测量方案测。
      轴是正交的。但"相变"的操作化定义("IT 成本下降 ≥1 个数量级 且 ≥2 维度出现
      ≥2 倍非线性扩张")有循环风险: "≥2 倍非线性扩张"的一部分(非线性 vs 线性)
      在历史数据中难以严格判定——历史案例能显示"变了", 但很难区分"指数增长"与
      "S 曲线的前半段"。诚实标注此局限。

  4_excluded_outcomes:
    verdict: pass
    note: |
      两个排除结果都有事前可测的渠道:
      - "无文字社会出现官僚制帝国": 文字=独立考古学判据, 官僚制帝国=独立结构判据
      - "IT 跃迁后无任何社会形态变化": IT 指标独立测, 社会形态独立测
      不存在"事后因结果而调整射程"的结构性漏洞。

  5_classification_bin_match:
    verdict: pass
    note: |
      IT 水平的四档(口头/文字/印刷/数字)基本合理, 每档的信息成本差距大致在一个
      数量级以上。"≥2 维度扩张"的双维度阈值虽是任意的, 但在社会理论中适合作
      操作化起点。建议增加一个"敏感度分析": 如果阈值改为 ≥1 维或 ≥3 维, 结论
      是否稳健?

  6_anti_talisman:
    verdict: should_fix
    note: |
      L4-004 缺少显式的 anti-talisman 条款。DED-006 和 DED-010 都包含详细的
      anti-talisman_clause(禁止由"是否出现制度/是否崩溃"反推"是否突破天花板/成本
      是否发散")。L4 面临同类风险: 观察到"社会复杂度扩张了"就倒推"IT 成本必然下降
      了一个数量级", 或观察到"社会复杂度没变"就倒推"IT 成本下降不够大"——这将使
      "IT 成本是主驱动量"沦为不可证伪的循环。
      当前 operationalization.information_technology_cost.limitations 中有一句
      "技术可用≠社会使用"部分触及此问题, 但未形成硬约束。需补充显式的 anti-talisman
      条款, 禁止由社会复杂度结果反推 IT 成本是否发生了"数量级跃迁"。

  7_real_world_anchor_fact_check:
    verdict: pass
    note: |
      锚点事实基本准确:
      - 楔形文字与美索不达米亚官僚化: 时间线大致正确(前3400计数→前2600完整书写→
        前2100法典), 1000 年延迟被诚实记录
      - 印刷术与民族国家: 古腾堡1450→民族国家体系(1648威斯特伐利亚及以后),
        200-350 年延迟被诚实标注
      - 中国书写系统与早熟官僚制: 甲骨文→秦汉简牍→郡县制, 时间线正确
      - 数字技术与平台组织: 描述准确, confidence 诚实标为 moderate
      无事实性错误。

  8_definition_vs_prediction:
    verdict: pass
    note: |
      "IT 成本下降 ≥1 个数量级→社会复杂度联合可行域在 ≥2 维度上出现非线性扩张"
      是可证伪的预测, 非定义。"四个天花板共享同一驱动量且同相跃迁"也是可检验的
      经验主张(通过比较四个维度的变化时点来检验)。条件句不是隐藏的定义。

  9_enumeration_exhaustiveness:
    verdict: pass_with_concern
    note: |
      "三次相变"(文字/印刷/数字)的枚举是否穷尽? 电报(实时长距离传递)、广播/电视
      (一对多信息传播)是否构成额外的相变或亚相变? L4 把"数字"作为一个大筐装进了
      互联网+智能手机+LLM 等多个亚阶段, 这些亚阶段之间的信息成本差异可能也跨越了
      数量级。L4 的相变判据(≥1 个数量级 IT 成本下降)如果严格应用, 可能产生 >3 次
      相变。这不是致命问题——核心主张是"IT 成本↓→社会复杂度非线性跳跃"的机制,
      而非"恰好三次"的具体数字。但"三次"的表述暗示穷举, 应诚实标注为"至少三次"或
      "以 ≥1 数量级 IT 成本跳跃为判据划界(操作化后可能识别出 >3 次)"。

  10_primary_suspect:
    verdict: pass
    note: |
      primary_suspect 定位合理: "数字相变是质变还是量变加速"是最弱腿, 因为第三次
      相变仍在进行中, 无法观测稳态。同时 L4 诚实标注了 secondary_suspect("共享驱动量
      是否真的是主驱动量还是仅为使能条件")——这实际上可能比 primary 更根本。建议
      交换: 把"共享驱动量"作为 primary_suspect(如果四个天花板的移动时间表与 IT 跃迁
      时间表不完全对齐, L4 的核心主张直接塌陷), "数字相变的质变性质"作为 secondary。

# ============================================================
# L4 专属红旗 (11-17) — 逐条攻击
# ============================================================

l4_exclusive_red_flags:
  11_spectator_brick:
    verdict: pass
    note: |
      逐一移除检验:
      - 移除 DED-001: 失去"信息传递衰减→层级天花板"机制 → 无法解释组织规模为何
        随 IT 跃迁而非线性扩张。不冗余。
      - 移除 DED-002: 失去"规范认知负荷上限→成文化突破"机制 → 无法解释复杂法律
        体系与 IT 跃迁的同步涌现。不冗余。
      - 移除 DED-006: 失去"信任半径天花板→制度外化"机制 → 无法解释交换网络半径
        随 IT 跃迁而扩张。不冗余。
      - 移除 DED-010: 失去"权力信号衰减→制度化降本"机制 → 无法解释支配形态随
        IT 跃迁而从纯人格化走向制度化。不冗余。
      四条父推论各提供一条不可替代的因果通路。无观众砖。

      但诚实标注: DED-001 的"信息传递保真衰减"和 DED-010 的"权力信号衰减"在机制
      底层共享同一逻辑(AXIOM-002 信息熵增+层级中介), 在 L4 的"共享驱动量"论证中,
      两者合并为"信息操作的物理成本"的一个侧面。这不使任何一条成为观众砖(各有不同
      的被预测量和操作化), 但说明四条机制在概念空间的独立性并非完全正交——有共享
      底层逻辑, 这本身正是 L4 想说的。

  12_trivial_conjunction:
    verdict: needs_revision
    severity: required
    note: |
      【这是本轮审查的核心战场】

      L4 的结论有两个层次:
      (a) "IT 改善→四个天花板各自移动"——这是 AND(parent predictions), 平凡。
          每条父推论独立推导了自己的天花板-IT 关系, L4 只是把它们并排放在一起说
          "它们都受 IT 影响"。鉴于四条父推论都以"信息"为核心概念(信息熵增、
          信息传递、信息存储、信息衰减), "信息技术影响它们"接近概念上的必然,
          而非经验发现。

      (b) "四个天花板由同一个驱动量(IT 成本)以同一相位跃迁→构成社会复杂度的相变"
          ——这才是 L4 声称的非平凡部分。它主张(i)共享驱动量,(ii)同相跃迁,
          (iii)联合可行域的非连续扩张构成相变。

      对于 (b)-(i) "共享驱动量": 每条父推论的原始推导中, 其天花板函数的自变量
      并不完全重合:
      - DED-001 的天花板函数自变量是"信息传递保真率 r"
      - DED-002 的是"外部存储容量 E"
      - DED-006 的是"信息可追踪性/可验证性"(且 DED-006 的驱动量明确定义为
        "交换网络突破信任半径", 不是"IT 成本")
      - DED-010 的是"权力信号衰减率 δ × 被支配规模"

      L4 把这些不同的自变量统一归约为"信息技术成本"这一更高层变量。这是一个
      【概念归并】(conceptual unification), 有理论价值——类似于物理学中把热、
      光、电统一为能量的不同形式。但它不是从父推论逻辑中必然推出的——
      它是对父推论底层机制的一种【重新解读】, 需要经验证据支持这种归并是
      有信息增量的(而非仅仅是换个标签)。

      对于 (b)-(ii) "同相跃迁": 这是 L4 最有经验内容的主张——它不仅说"四个天花板
      都受 IT 影响"(那近乎同义反复), 而是说"它们以同一相位、由同一脉冲触发"。
      这意味着可以检验: 四个维度的变化时点是否对齐? 如果不齐(如印刷术出现后
      DED-001 的组织变化在 50 年内发生、DED-002 的法律成文化在 200 年后、
      DED-006 的民族国家在 300 年后——L4 自己的锚点显示这些延迟确实存在),
      则"同相"主张被削弱或证伪。

      裁决: L4 的非平凡性不是零——"同相跃迁"是可检验的经验主张, 超越了平凡的
      AND(parent predictions)。但"共享驱动量"的论证中, 概念归并(把不同自变量
      统称为"IT 成本")与经验发现(这些自变量实际上一同变化)之间的界线不够清晰。
      需要 sharpened: 明确指出哪些是概念归并(不增加经验内容), 哪些是经验主张
      (可被独立检验), 并让后者承担 L4 的证伪重量。

  13_emergence_missing:
    verdict: needs_revision
    severity: required
    note: |
      【多父逐格判空归属分析——本轮审查的核心产出】

      重建笛卡尔积: [IT水平 {口头, 文字, 印刷, 数字}] × [维度 {组织深度, 规范数,
      交换半径, 支配制度化}]

      逐格标注(哪个父推论强制该格的预测):

      | IT水平 \ 维度 | 组织深度(DED-001) | 规范数(DED-002) | 交换半径(DED-006) | 支配制度化(DED-010) |
      |---|---|---|---|---|
      | 口头 | ≤5-7 [DED-001 solo] | ≤认知上限 [DED-002 solo] | ≤熟人圈 [DED-006 solo] | 纯人格化/小规模 [DED-010 solo] |
      | 文字 | >7 可能 [DED-001 solo] | 成文化可能 [DED-002 solo] | 城邦/早期帝国 [DED-006 solo] | 职位记录可能 [DED-010 solo] |
      | 印刷 | 更深可能(更高r) [DED-001 solo] | 大规模标准化可能 [DED-002 solo] | 民族国家尺度 [DED-006 solo] | 法律标准化→更制度化 [DED-010 solo] |
      | 数字 | 双向可能 [需 DED-001+DED-010] | →∞(数据库) [DED-002 solo] | 全球 [DED-006 solo] | 实时监控可能 [DED-010 solo] |

      合力格分析:

      1. [数字 × 组织深度] — 标注为"需 DED-001 + DED-010 合力"
         论证: DED-001 说"形式化系统提高 r→可以更深"; DED-010 说"监控降低→
         中层被替代→可以更平"。双力方向相反, 合力给出"技术使组织形态可双向选择"。

         审查裁决: 这是真实合力, 但强度有限。DED-001 本身不强制"更深"(只说
         "天花板上升→更深变为可能"), DED-010 本身不强制"更平"(只说"监控降低
         中层需求→更平变为可能")。两者合起来是"两种可能性同时开启", 而非
         "两力交互产生单一不可分解的预测"。这是弱合力(AND of possibilities,
         not interaction producing a novel necessity)。

         评分: 通过门槛(至少一个合力格), 但为 weak synergy。

      2. [印刷 × 交换半径 = 民族国家尺度] — L4 标注为"需 DED-002 + DED-006 合力"
         论证: DED-006 单独能说"印刷降低信息成本→交换半径扩张", 但不能解释
         "为何扩张到民族国家而非更大帝国"。需要 DED-002(标准化)合力解释形态选择。

         审查裁决: 【这一格的合力论证有问题——DED-002 不包含"语言标准化→民族
         认同"机制】。DED-002 的核心机制是"口头规范有认知负荷上限→外化到物理
         介质(成文化)突破天花板"。DED-002 讲的是【规范条数的认知上限】被成文化
         突破, 不讲"印刷使民族语言标准化从而创造共同身份认同"。

         Anderson 的"想象的共同体"机制(印刷资本主义→标准化民族语言→民族认同)
         是 L4 在此格中实际调用的逻辑, 但这个机制不在 DED-002 的射程内。DED-002
         涉及的是"成文法使法律规范数量突破口头记忆上限", 不是"印刷使语言标准化
         从而划定民族边界"。

         裁决: Cell-C 的合力标注不成立——它把 DED-002 不包含的机制(语言标准化→
         民族认同)归因于 DED-002。这不是两个父推论的真合力, 而是 L4 引入了一个
         外部机制(Anderson 的民族主义理论)并把它嫁接在 DED-002 的标签上。

         修正方向: 要么(a)在 DED-002 中补充"大规模标准化"机制(需走 Rule B 修订
         DED-002), 要么(b)诚实标注此格需要的是 DED-006 + 外部(非父推论)机制,
         不能声称是 L4 的父推论合力。

      3. Cell-A [文字 × 四维度同时超口头天花板→整体社会形态跃迁]
         L4 将此标注为需要四条父推论合力。审查裁决: 不需要。

         每个父推论各自预测"文字→我的维度天花板移动"。四者同时移动是因为
         【同一事件(文字发明)同时触发了四条独立的因果链】——这是共同原因
         (common cause)导致的共变, 不是父推论之间的交互(interaction)。

         比喻: 太阳升起同时使温度上升、亮度增加、植物开始光合作用、动物开始
         活动。这四个变化不需要"温度机制与光合作用机制的交互"来解释——它们是
         同一原因通过四条独立因果链产生的并行效果。气象学不会说"温度和光合作用
         的交互产生了'白天'这一涌现现象"——"白天"就是太阳升起后多条独立因果链
         的并行产物, 可以被称为"涌现"(昼间的生态系统行为), 但这种涌现的机制
         不需要子机制之间的交互。

         L4 的情况类似: 文字发明作为共同原因→四条独立因果链各自运作→四个维度
         各自变化。L4 将这一并行变化称为"相变", 这在描述层面是可以的(类似"白天"
         是对多条并行变化的概括), 但在机制层面不需要父推论合力——每条父推论
         独立运作, 没有交叉依赖。

         裁决: Cell-A 不是合力格。它是 common-cause parallelism, 不是 interaction。

      归零检查:

      排除 Cell-A(非合力)、Cell-C(机制嫁接), 仅剩 Cell-B(数字×组织深度双向选择)。
      Cell-B 是唯一真正的合力格, 且为弱合力(AND of possibilities, not interaction
      producing necessity)。

      按 L4 评分卡:"至少一个合力格"是硬门槛。Cell-B 技术上满足"一个"的最低下限,
      但其合力强度弱——任何同时读过 DED-001 和 DED-010 的人都能独立推出"数字
      技术使组织可更深也可更平", 不需要 L4 来"涌现"这个洞察。

      裁决: emergence 勉强通过最低门槛(有一个弱合力格), 但强度远不足以支撑 L4
      宣称的"涌现性质"(phase transition, joint feasible region, simultaneous shift
      as emergent property)。需要至少增加一个强合力格(真正不可由单父推论推出的
      交叉预测), 或将现有弱合力加深(从"两种可能性同时开放"到"两力交互产生不可
      分解的新预测")。

  14_weak_parent_premise:
    verdict: pass
    note: |
      四条父推论状态:
      - DED-001: verified (经 ADV-REVIEW-001/004 两轮审查 + EMP-TEST-001 + ICV-001)
      - DED-002: verified (经 ADV-REVIEW-002/005/007 三轮审查 + EMP-TEST-002)
      - DED-006: verified (经 ADV-REVIEW-011 三轮审查)
      - DED-010: verified (经 ADV-REVIEW-015 两轮审查)
      全部为 verified, 无 candidate 被用作主前提。通过。

  15_anchor_theft:
    verdict: needs_revision
    severity: required
    note: |
      L4 声称四个"复合特有锚点", 逐一审查:

      Anchor 1 (楔形文字→美索不达米亚帝国): L4 说"不是因为有文字所以帝国出现
      (DED-001 单独能说)——而是文字同时改变了四个维度的可行域, 四者共变构成
      社会形态跃迁"。但这个"同时改变四个维度"完全可以是四条父推论各自独立运作
      的结果——每个父推论都可以用美索不达米亚作为自己的锚点。L4 在此没有提供
      任何"交互"的独立证据(如某维度的变化以另一维度的变化为前提条件)。这是
      【锚点复用, 非复合锚点】。

      Anchor 2 (印刷术→民族国家): 同上。DED-006 可以用此锚(印刷→交换半径扩张),
      DED-002 可以用此锚(印刷→法律标准化)。L4 的"复合特有"分析依赖 Anderson
      的机制(印刷资本主义→民族认同), 但该机制不在 DED-002 中(见 #13 Cell-C 分析)。
      这是【外部机制借用, 伪装为父推论合力】。

      Anchor 3 (中国书写系统→早熟官僚制): 同上。DED-001 和 DED-010 各自可独立
      使用此锚。L4 没有提供交互的独立证据。

      Anchor 4 (数字技术→平台组织/DAO): 这是四个锚点中最接近真正复合锚点的——
      展示了数字技术使组织形态双向选择(Cell-B 的实证)。但即便如此, 它展示的是
      "DED-001 的方向和 DED-010 的方向同时存在", 而非"两者交互产生第三方向"。

      裁决: 四个锚点中三个是锚点复用(每个父推论可独立认领), 一个是弱复合(展现
      了两力并存, 未展现交互产物)。L4 需要至少一个锚点展示真正的交互效应——
      即"父推论 A 和 B 单独都不能解释的结果"。

  16_interaction_measurement_gap:
    verdict: needs_revision
    severity: required
    note: |
      L4 的核心可检验主张是"四个天花板同相跃迁"。这需要:
      (a) 独立测量四个维度的变化时点
      (b) 判定它们是否"同相"

      问题在 (b): "同相"的操作化定义缺失。什么算"同相"? 四个维度的变化发生在
      同一世纪? 同一 500 年窗口? L4 自己承认的延迟——楔形文字从计数到法律用了
      1000 年, 印刷术到民族国家用了 200-350 年——如果这些算"同相", 那几乎任何
      在 IT 变革后 1000 年内发生的社会变化都可以被归入"同相跃迁", 命题将不可证伪。
      如果这些不算"同相", 那 L4 已被自己的锚点数据证伪。

      L4 在 phase_transition.measurement 中试图通过对照设计(同一文明前后对比+
      跨文明横向对比)来操作化, 但没有给出判断"同步"的时间窗口阈值。没有这个阈值,
      "同相跃迁"无法被经验检验——任何观察到的异步都可以被辩称为"仍在相变窗口内"
      (如"以文明时间尺度为'快'")。

      修正要求: 必须给定一个可操作的时间窗口判据, 如"四个维度中至少三个的变化
      起始点在 IT 跃迁后的 N 年内(N 需事前指定并论证)", 或采用更结构化的判据
      (如"四个维度中至少两个的变化【必须在时间顺序上互以对方为前提】")。

      同时, 复合输出变量("联合可行域的非连续扩张")能否被测量为"区别于 A 单独 +
      B 单独 + C 单独 + D 单独"的东西? 目前 L4 的测量方案只是把四个维度的测量结果
      并列, 然后声称它们的联合构成相变。但如果联合可行域只是四个独立维度的笛卡尔积,
      那么"联合"没有增加任何经验内容——它就是四个测量结果的列表。L4 需要说明
      "联合可行域"作为一个构念如何比"四个维度各自的测量值"提供更多的信息。

  17_claim_type_mismatch:
    verdict: needs_revision
    severity: should
    note: |
      claim_type = "phase_transition"。在物理学中, 相变证据标准包括:
      (a) 控制参数的连续变化触发序参量的非连续变化
      (b) 临界点附近的发散行为(临界指数)
      (c) 不同系统的普适性类

      L4 提供的证据是历史-比较案例研究(四个锚点的叙事分析)。这不是相变证据——
      这是定性比较史学。L4 没有提供:
      - 序参量(社会复杂度联合可行域)在 IT 成本阈值附近的【非连续性】定量证据
      - 临界行为(如相变前后社会复杂度的标度律变化)
      - 跨文明的普适性检验(同样的 IT 成本阈值得出同样的社会复杂度跳跃幅度)

      L4 诚实标注了这些局限(如"联合可行域是理论构念, 精确边界需要编码方案校准",
      "物理上不可能的判定依赖反事实推理"), 但这些标注恰恰说明 claim_type 与证据
      标准之间存在落差。

      这不是致命问题——社会科学中"相变"常用作启发式隐喻(如"人口相变""工业革命
      相变")。但 L4 应:
      (a) 将 claim_type 降级为更诚实的标签(如 "social_form_prediction" 或
         "co_evolution"), 保留"phase_transition"作为启发式标签在 statement 中
      (b) 或者明确声明 claim_type 是在启发式/隐喻意义上使用的, 不声称满足物理学
         相变的严格证据标准
      (c) 同时保留定量预测("≥2 维度 ≥2 倍非线性扩张")作为未来操作化检验的方向

# ============================================================
# 反例猎捕
# ============================================================

counterexample_hunt:
  methodology: |
    按 L4 评分卡要求, 猎两类反例:
    (1) 某父推论不成立 → L4 天花板受损
    (2) 父推论都成立, 但交互不产生 L4 预测的结果(重点)

  type1_parent_failure:
    cases: []
    note: "四条父推论均为 verified, 各自的机制经多轮对抗审查与经验检验。无 scope 内反例。"

  type2_interaction_failure:
    cases:
      - id: CE-1
        label: "中国活字印刷: IT 跃迁但无相变(路径依赖完全压制了相变信号)"
        description: |
          毕昇发明活字印刷(约 1040 CE)是一个真正的 IT 突破——排版效率远高于雕版。
          但中国没有经历类似欧洲印刷术后的"相变"(民族国家、法律标准化、市场整合)。
          L4 将此解释为"路径依赖"(中国已是统一帝国, 印刷强化了帝国官僚制而非催生
          民族国家)。

          攻击点: 如果路径依赖可以完全决定相变的方向和幅度, 甚至在极端情况下使
          相变在观察上不可见(中国案例中, 活字印刷后几百年的社会形态变化与雕版印刷
          时期并无质的差异), 那么 IT 成本作为"主驱动量"的地位被严重削弱——
          真正的驱动量是制度禀赋, IT 只是使能条件。

          L4 的回应("这不是反例, 它验证了路径依赖")在逻辑上是自保的, 但使理论
          的证伪难度大幅上升: 任何"IT 跃迁但无相变"的案例都可以被"路径依赖"吸收。
          需要 L4 给出路径依赖的独立操作化(即在 IT 跃迁前, 可事前预测哪些制度禀赋
          会导致哪种相变方向), 否则"路径依赖"成为万能消化酶。

        status: not_a_clean_kill_yet
        severity: high
        required_response: |
          需补充 path_dependency 的操作化——在 IT 跃迁前, 由可独立测的制度禀赋
          预测相变方向。否则此反例暴露了理论的弹性过大问题。

      - id: CE-2
        label: "四个维度不同步——楔形文字 1000 年延迟是常态而非例外"
        description: |
          L4 承认楔形文字从会计到法律用了 1000 年, 印刷术到民族国家用了 200-350 年。
          如果这些延迟是常态(即 IT 跃迁后各维度的响应确实有系统性时差), 则"同相跃迁"
          的核心主张不成立。1000 年和 200 年的延迟在以文明为尺度的历史上可能算"快",
          但在机制层面, 它们表明四条因果链的响应时间常数根本不同——管理/行政领域
          (DED-001)可能在 IT 变革后几十年内响应, 而法律/规范领域(DED-002)需要几个
          世纪。如果响应时间常数不同, 四条机制就不是"由同一脉冲同时触发", 而是
          "由同一脉冲先后触发, 各自按自己的时间常数响应"。

          这与"同相"有本质区别: 前者预测四个维度在时间轴上聚成一簇; 后者预测四个
          维度在时间轴上散开, 仅共享一个远因。后者的理论价值远低于前者——它不构成
          "相变", 只构成"共享远因的多个独立过程"。

        status: near_miss
        severity: critical
        required_response: |
          这是 L4 最脆弱的点。如果 L4 的"同相"是宽松意义上的(500-1000 年窗口),
          那么几乎所有人类社会的大转型都可以被描述为"同相跃迁"——命题失去判别力。
          如果 L4 的"同相"是严格意义上的(同一世纪或更短), 那么历史证据不支持它。
          L4 必须走钢索: 给出一个有判别力的、可操作的时间窗口, 且该窗口要让
          L4 不被自己的锚点数据证伪。

      - id: CE-3
        label: "伊斯兰世界纸张革命: IT 跃迁但仅单维度显著扩张"
        description: |
          阿拔斯王朝 8 世纪引入中国造纸术后, 纸张成本远低于羊皮纸/莎草纸——
          可合理视为一次 ≥1 个数量级的信息存储成本下降。纸张推动了官僚制扩张
          和学术繁荣(翻译运动), 即 DED-001(组织深度)和 DED-002(规范/知识存储)
          维度有所响应。但 DED-006(交换半径→制度外化)和 DED-010(权力制度化)
          维度未出现相变级别的响应——伊斯兰世界未走向非人格化市场制度或制度化
          权力交接(哈里发继承始终是高度人格化的)。

          攻击点: 如果纸张革命只触发了四维度中的 1-2 个而非 ≥2 个的显著扩张,
          则 L4 的"≥2 维度非线性扩张"判据不被满足——这不是一次相变。但纸张革命
          确实是一次 IT 成本的数量级下降。所以要么"纸张革命不算 IT 成本数量级下降"
          (事后修改自变量阈值以保护理论), 要么 L4 预测被此案证伪(IT 成本数量级
          下降但无相变)。

          L4 的回应("纸张跃迁幅度小于印刷术, 不符合相变标准")相当于在观测到
          无相变后回头调整了"IT 跃迁幅度"的判定——这正是 anti-talisman 要防止的。

        status: near_miss
        severity: high
        required_response: |
          IT 成本的数量级下降必须事前可判定(在不知道社会复杂度是否扩张的情况下,
          由独立的物理-技术指标判断是否构成了 ≥1 个数量级的下降)。L4 需要给出
          纸张相对于羊皮纸/莎草纸的成本下降数量级估计, 以事前判定纸张革命是否
          应触发相变预测, 而非在观测到"无相变"后回头说"跃迁幅度不够大"。

  hunt_summary: |
    未猎到 scope 内干净击杀(即"四条父推论机制都成立, 但 L4 的交互预测在某案例中
    被明确证伪"的案例)。但猎到三个近失案例:
    - CE-1: 暴露了"路径依赖"可能使理论弹性过大
    - CE-2: 暴露了"同相"判据的时标缺失使核心预测无法检验
    - CE-3: 暴露了"IT 成本数量级跃迁"的事后判定风险

    三个近失案例的共性: 它们不直接证伪 L4, 但暴露了 L4 的操作化不足——
    L4 的核心概念("同相""数量级跃迁""路径依赖")尚未达到可被经验检验的精度。
    这不是逻辑错误, 是操作化赤字。

# ============================================================
# 与 DED-004 / DED-007 的对照
# ============================================================

non_recurrence:
  ded004_check:
    verdict: pass
    note: |
      DED-004 的死因: 条件双重身份(自变量同时也是被预测量) + 事后用结果反推条件。
      L4-004 未犯此病: IT 成本(物理-技术指标)与社会复杂度(组织结构指标)在不同
      测量轴上, 且 IT 成本不由社会复杂度结果反推(至少在原则上是这样——操作化
      上需加强 anti-talisman, 见红旗 #6)。
  ded007_check:
    verdict: pass
    note: |
      DED-007 的死因: 三个假说各自吸收各自的案例, 缺乏可被共同证据裁决的争议点。
      L4-004 未犯此病: 它给出了明确的、可共同裁决的证伪条件(falsifiability a-d),
      四个预测共享同一组可独立测量的变量。

# ============================================================
# 裁决
# ============================================================

verdict: needs_revision
verdict_note: |
  L4-004 有一个真的理论贡献——识别出四条独立推导的 L3 推论以"信息"为共享底层
  概念, 并将其统一到"信息技术成本"这一更高层变量下。这种概念统一(consilience)
  在理论建设中是有价值的, 与 DED-001 的区分效度自评("解释性统一, 非新经验预测")
  属同一类贡献。

  但 L4 声称的"涌现"(phase transition as emergent from parent interaction)在
  多父逐格判空中只兑现了一个弱合力格(Digital × Org 双向选择)。其余"合力"要么
  是 common-cause parallelism(Cell-A), 要么是机制嫁接(Cell-C 把 Anderson 的
  语言标准化机制归因到 DED-002)。四个"复合锚点"中三个是锚点复用。核心可检验
  主张("同相跃迁")因缺少时间窗口操作化而漂浮。

  不判 rejected 的理由: (a) 共享驱动量的概念统一有理论价值; (b) 至少有一个
  真正的合力格(虽然弱); (c) 问题本质是操作化不足而非逻辑塌陷——与 DED-004 的
  结构性死病不同; (d) 给出了可定向修复的清单。

  判 needs_revision: 需 5 条 required 修订 + 2 条 should 修订后才能进入 round 2。

required_fixes:
  - id: RF-1
    priority: required
    title: "操作化'同相跃迁'的时间窗口"
    description: |
      给出"同相"的可操作时序判据。至少需要:
      (a) 一个事前指定的时间窗口 N(如"IT 跃迁后 200 年内")
      (b) 一个维度覆盖阈值(如"≥3/4 维度在该窗口内启动显著变化")
      (c) 显著变化的独立操作化判据(各维度按父推论测量方案)
      如果历史数据不支持严格的同相判据, 降级为"共享驱动量的异步响应"并相应
      调整 claim_type 和核心主张的措辞。
    affects: operationalization.phase_transition, statement

  - id: RF-2
    priority: required
    title: "修正 Cell-C 的合力论证——DED-002 不包含语言标准化机制"
    description: |
      要么 (a) 走 Rule B 为 DED-002 增加"大规模标准化"机制(需该推论的全部
      引用者评估影响), 要么 (b) 诚实标注 Cell-C 依赖的是外部机制(Anderson
      民族主义理论)而非 DED-002, 并说明 L4 在此格中的角色是"桥接 DED-006 +
      外部理论", 而非"父推论合力"。
      如果选 (b), 需要另一个真正的合力格来补强 emergence_demonstration。
    affects: derivation.steps.4 的 Cell-C 分析, emergence_demonstration.multi_parent_cells

  - id: RF-3
    priority: required
    title: "补充显式 anti-talisman 条款"
    description: |
      在 operationalization 或独立节中添加 anti-talisman_clause, 至少覆盖:
      - 不得因"社会复杂度扩张"就倒推"IT 成本必然发生了数量级下降"
      - 不得因"社会复杂度未扩张"就倒推"IT 成本下降未达数量级阈值"
      - "IT 成本数量级下降"必须由物理-技术指标(存储成本/传输速度/检索人时)
        事前独立判定, 不参考社会复杂度结果
      - 路径依赖的解释不得仅由结果反推(需有事前可测的制度禀赋指标)
    affects: operationalization, 新增 anti_talisman_clause

  - id: RF-4
    priority: required
    title: "替换或大幅改造三个弱复合锚点"
    description: |
      Anchor 1-3(楔形文字/印刷术/中国书写)当前是各父推论的锚点复用,
      不加"复合特有"的独立证据。要么:
      (a) 为每个锚点补充真正的交互证据——证明某一维度的变化以另一维度的变化
          为前提条件(而非仅同时发生), 或证明交叉维度的变化产生了不可分解的新现象
      (b) 降级这些锚点, 将其标注为"各父推论机制的并发运作(common-cause parallelism)",
          而非"复合交互效应", 并在 anchor 的 composite_specific 分析中诚实标注
          哪些是交互证据、哪些只是并发现象
      (c) 增加至少一个新的、真正的复合锚点(展示交互效应的历史案例)
    affects: real_world_anchors 的 composite_specific 分析

  - id: RF-5
    priority: required
    title: "提供路径依赖的操作化——防止其成为万能消化酶"
    description: |
      中国活字印刷案例暴露了"路径依赖"可能使理论弹性过大。需要:
      (a) 在 IT 跃迁【前】, 由可独立测的制度禀赋(政体结构/权力集中度/文化同质性)
          事前预测相变方向的操作化方案
      (b) 明确哪些制度禀赋在何种方向上约束相变(目前只有"相变前制度禀赋约束方向"
          的模糊陈述)
      (c) 给出"路径依赖使相变不可见"的极限条件——在什么情况下路径依赖可以完全
          压制相变信号? 如果答案是"任何时候", 则 L4 的证伪空间被清零。
    affects: statement, falsifiability, real_world_anchors.counterexamples

