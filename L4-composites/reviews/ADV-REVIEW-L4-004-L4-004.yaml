  counterexample_hunt:
    methodology: |
      按 L4 评分卡要求,猎两类反例:
      (1) 某父推论不成立 → L4 天花板受损
      (2) 父推论都成立,但交互不产生 L4 预测的结果(重点——L4 特有猎法)

    type1_parent_failure:
      cases: []
      note: "四条父推论均为 verified,各自经多轮对抗审查与经验检验。无 scope 内反例。"

    type2_interaction_failure:
      cases:
        - id: CE-2a
          label: "Transition 1(文字)不满足自定 synchronicity 判据——内部证伪"
          description: |
            按 L4 自定的 synchronicity_threshold(前现代 200 年窗口,≥3/4 维度):
            - 楔形文字完整书写系统约公元前 2600 年
            - 组织深度:阿卡德帝国约公元前 2334 年 → Δ≈266 年(超窗口或边界)
            - 规范数:乌尔纳姆法典约公元前 2100 年 → Δ≈500 年(明确超窗口)
            - 交换半径:长距离贸易逐步扩展,难以精确断代,但系统性书面契约
              在公元前 2500-2000 年间进展 → 部分可能超窗口
            - 支配制度化:行省总督制约公元前 2100 年 → Δ≈500 年(明确超窗口)

            按 ≥3/4 判据,Transition 1 不满足"同相跃迁"标准。
            L4 的 fallback("降级为异步响应")已就位,故这不是逻辑塌陷,
            但 statement 仍以"至少三次相变"措辞等同对待三次跃迁,
            与自定操作化之间存在 honest 落差。

            注意:这不是"父推论都成立但交互不产生 L4 预测"——这是
            "L4 的自定判据未被自己的锚点数据满足"。属于内部一致性
            问题而非外部反例。
          status: internal_inconsistency
          severity: required
          required_response: |
            要么(a)论证 Transition 1 确有 ≥3/4 维度在 200 年窗口内显著变化
            (需提供具体证据),要么(b)明确激活 fallback,将 Transition 1
            标注为"异步/梯次响应"而非"同相跃迁",并相应调整 statement 措辞。

        - id: CE-4
          label: "丝绸之路:交换半径在无 IT 跃迁条件下大规模扩张"
          description: |
            丝绸之路(约公元前 2 世纪起)连接罗马、波斯、印度、中国,
            交换网络半径大幅扩张——但这是在文字发明后约 2000 年,
            期间无 IT 成本的数量级跃迁。扩张的驱动因素是政治稳定
            (Pax Romana/汉帝国)、交通基础设施、奢侈品需求——
            而非 IT 成本下降。

            攻击点:如果交换半径(DED-006 维度)可以在无 IT 跃迁的
            条件下发生 ≥2 倍的扩张,则"IT 成本是四个维度的共享主驱动量"
            这一核心主张被削弱——IT 成本可能是使能条件(permissive
            condition)而非主驱动量(primary driver)。

            L4 的可能回应:丝绸之路的扩张在"文字"IT 水平的可行域内——
            IT 成本定义了可行域的边界,但不决定边界的哪个点被实际占据。
            路径依赖/政治/经济因素决定实际占据点。

            审查评估:此回应在逻辑上自洽(IT 是硬约束,非充分条件),
            但它将 L4 的"主驱动量"降格为"使能条件"——如果可行域内的
            大部分变动由非 IT 因素驱动,则"IT 成本是主驱动量"的说法
            需要弱化为"IT 成本是边界条件"。
          status: near_miss
          severity: moderate
          note: |
            不构成 clean kill——L4 可通过区分"边界"(IT 成本定义)与
            "边界内移动"(其他因素驱动)来吸收此案例。但这暴露了
            "主驱动量"措辞可能过于强势:在给定 IT 水平下,社会复杂度
            的变动主要由非 IT 因素驱动;IT 成本只在跨越数量级阈值时
            才成为主导因素。

        - id: CE-5
          label: "罗马法大全(查士丁尼法典)在无 IT 跃迁条件下的规范大规模成文化"
          description: |
            查士丁尼法典(公元 529-534 年)是罗马法的系统化编纂——
            这是一次大规模的规范成文化(DED-002 维度)事件,
            但发生在文字发明后约 3000 年,codex(册子本)取代卷轴后
            约 300 年——期间无 IT 成本的数量级跃迁。
            驱动因素是政治/行政性的(查士丁尼的法律改革 ambition),
            而非 IT 成本下降。

            攻击点:同 CE-4——规范复杂度(DED-002 维度)的大幅跃升
            可以在无 IT 跃迁的条件下由非 IT 因素驱动。
          status: near_miss
          severity: moderate
          note: "同 CE-4 的逻辑——IT 是边界条件,边界内变动由其他因素驱动。"

    hunt_summary: |
      未猎到 scope 内干净击杀(即"四条父推论机制都成立,但 L4 的交互预测
