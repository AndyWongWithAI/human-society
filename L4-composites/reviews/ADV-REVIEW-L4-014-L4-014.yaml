id: ADV-REVIEW-L4-014
target: L4-014
date: 2026-07-15
type: adversarial_review
layer: L4-composites

人话摘要: |
  L4-014 说"平台(Uber/淘宝)是公司和市场之外的第三种组织"。第一轮独立审查发现:
  它有真东西(招牌格确实要三条父机制合力,eBay/出租车公司两个区分案例做得干净,
  "身份张力"预测已被英国最高法院判例印证),但有一个内部硬伤——它声称给父推论
  DED-006 的信任分类加了新档位 D(算法评分),可 DED-006(已 verified)的原文
  【明文把"平台评分"划进 C 档】、并把支付宝/eBay 当 C 档边界案例消化过了。
  孩子不能悄悄改父亲已定论的分类。加上淘宝真正解决信任靠的是支付宝担保交易
  (押金制度,不是评分)、Uber 靠背景审查+保险+平台垫付,几个锚点都高估了评分的
  作用;"50%以上信任靠 D 档"的门槛没登记口径;承重的 L2 砖 BR-L2-025 只是
  weakly_verified,它没解决的"质变还是量变"问题恰好就是本推论自己的头号证伪条件。
  判 needs_revision,5 条 required。

round_1:
  reviewer: "独立对抗审查者 (全新上下文, round 1, 与作者无关)"
  verdict: needs_revision
  verdict_note: |
    核心不塌:招牌格 [算法式协调 × 算法化声誉] 的三父合力论证结构成立,
    eBay(有评分无算法调度)与传统出租车公司(有算法无中层替代)两个判别案例
    干净地把两条轴拆开,预测 (iii)(身份张力→重新分类压力)是真风险预测且已被
    现实(Uber 英国最高法院 2021 判"worker"、加州 AB5)印证。但五处 required:
    (1) D 档与 verified 父推论 DED-006 的既有裁决正面冲突(父原文把"平台评分"
    编码为 C 档并消化过支付宝/eBay 案例)——这不是"扩展",在未走反馈流程前是
    "篡改";(2) 三大 supporting anchors 系统性低估平台内嵌的制度性(C 档)支撑
    (担保交易/保险/背景审查/平台垫付),按推论自己的"纠纷追索路径"编码判据,
    这些案例的事后执行走的是平台裁决+押金退款而非声誉;(3) "信任基础≥50%为 D 档"
    的阈值无分子/分母/口径注册(L3 红旗 11,L4-009 判例);(4) 承重前提 BR-L2-025
    仅 weakly_verified(IEA 1.6 < 1.8,仪器折扣被其自审标为承重红旗),且其未决的
    "质变 vs 量变"问题与本推论 falsifiability (a) 是同一个问题——置信度天花板
    必须显式声明,当前不可能升 verified;(5) discriminant_validity 完全没有处理
    组织经济学最近的竞争理论——Williamson 混合形态(特许经营/长期合约/合资),
    特许经营在前数字时代就实现了"非雇员统一调度",主张 (C) 的新颖性因此不独立成立。
    另有 2 处 should(涌现类型 interaction 声明过高,应降为 conjunction;
    primary_suspect 定位偏移)。可靠定向修订救活,判 needs_revision。

  # ============================================================
  # 通用红旗 1-11(L3 评分卡)逐条
  # ============================================================
  general_red_flags:
    1_brick_conclusion:
      verdict: pass_with_concern
      note: |
        "第三组织形态"的合成主张(算法即中层 + 评分即信任 + 非雇员统一调度)
        不在任何单砖原文中——DED-001 只讲层级天花板与三种适应,DED-006 只讲
        信任外化路径,BR-L2-025 只讲机器可处理性,通过。
        但 concern:信任半边的非平凡内核被父推论部分预载——DED-006 的
        boundary_cases 已把"现代数字平台声誉(支付宝/eBay/评分系统)"作为
        "制度化的非人格化信任,计入外化(C 档),非反例"消化过。即父推论不仅
        "只有 A/B/C 三档",而是【已对平台评分这个案例作了 C 档裁决】。
        L4-014 statement 中"评分系统不是'制度'——它没有立法机关、没有正当程序"
        的论证是在与父推论的既有裁决对抗而未披露。此点在红旗 7 与 D 档专项
        升级为 required(见 RF-1)。

    2_cell_empty_prediction:
      verdict: pass_with_concern
      note: |
        2×2 表的三个非招牌格均有真实占位者(传统公司/引入评分的传统公司/
        钉钉式算法辅助组织),招牌格的预测 (i)(协调层级数 ≤2 而参与者
        十万-百万级)是真经验主张,非同义反复——它可被"平台实际上依赖多级
        人类运营管理"的发现证伪。
        concern:2×2 的信任轴是"D 档 vs A/B/C 合并"的二分——这个轴本身
        以"D 档是独立档位"为前提。若 D 档塌回 B 或 C(见 D 档专项),
        信任轴退化为无差异,招牌格与"算法式 × 人际/制度"格合并,判空表
        整体失效。即判空表的有效性是 D 档独立性的下游,不是独立证据。

    3_measurement_orthogonal:
      verdict: pass
      note: |
        coordination_mechanism 按实际指令流编码(看指令流不看架构图),
        trust_basis 按纠纷时实际追索路径编码,platform_organization 三条件
        "各自独立编码,不由'是否是平台'反推"——测量轴设计合格,无 DED-007 式
        焊死。anti_talisman (3) 要求"算法即中层"须证明替代了至少一级人类
        管理决策,防止了"用了算法就算"的软化。
        注意:trust_basis 的编码判据(纠纷追索路径)恰好是打穿锚点的武器——
        见红旗 7,按这把尺子量,作者自己的锚点量不出 D 档主导。

    4_excluded_outcomes:
      verdict: pass
      note: |
        四条排除(商业模式/规范判断/必然取代/普适化)都是按渠道事前划的,
        不是事后按结果开脱。"失败的平台仍然是平台"(anti_talisman 2)进一步
        锁死了成功偏差。通过。

    5_classification_bin_match:
      verdict: pass_with_concern
      note: |
        信任四档(A/B/C/D)继承 DED-006 的三档谱系再加一档,档位粒度与被救
        对象匹配;协调二值编码有明确的主导通道判据。
        concern:D 档的定义混装了两个可分离的机制——(甲)事前筛选信号
        (评分聚合帮陌生人决定跟谁交易)与(乙)事后执行(降权/停权/封号)。
        (甲)是信息机制,(乙)是执行机制;DED-006 的 A/B/C 分档按【执行】
        结构划(执行是否依赖纽带/共同体/普适制度),而 L4-014 的 D 档时而
        指(甲)时而指(乙)。按执行结构看,(乙)"平台封号"是有界共同体的
        逐出机制——结构上是 B 档(共同体=平台会员体);按信息机制看,(甲)
        是新东西但不在 DED-006 的分类维度上。档位混装,须拆开(并入 RF-1)。

    6_anti_talisman:
      verdict: needs_revision
      severity: required
      note: |
        条款本身写得对(不由成功反推分类/失败平台仍是平台/算法须证明替代
        一级人类决策)。但兑现检查失败:没有任何一个承重锚【真的用推论自己的
        编码判据】独立测出"信任基础≥50%为 D 档"。按 trust_basis 的编码依据
        ("交易发生纠纷时的实际追索路径,看行为不看声称"):
        - 淘宝纠纷的实际追索路径 = 平台裁决(小二)+ 支付宝担保交易退款——
          担保交易是押金/托管制度,属制度性保障,不是声誉;
        - Uber 纠纷 = 平台客服裁决 + 平台垫付 + 商业保险 + 条款仲裁;
        - Airbnb = 平台理赔(host guarantee 保险)+ 平台裁决。
        三个锚的事后执行主通道都不是"评分",评分做的是事前筛选。锚点没有
        兑现"D 档 ≥50%"这一构成性条件的独立测量——该条件目前只是声称。
        required:要么给出一个按追索路径编码后 D 档确实主导的实测案例,
        要么把 platform_organization 定义中的 (b) 条件改写为可兑现的形式
        (如"事前筛选主要由算法化声誉承担",并诚实声明事后执行由平台制度承担)。

    7_real_world_anchor_fact_check:
      verdict: needs_revision
      severity: required
      note: |
        三处系统性过度解读,方向一致(全部高估评分、低估制度性支撑):
        (a) 淘宝锚:"评分系统是买家决策的核心依据"部分成立(事前筛选),但
        "这是 D 档独立于 C 档的干净证据"事实性站不住——淘宝早期解决信任的
        标志性机制是【支付宝担保交易】(2003-2004,买家付款入托管、确认收货
        才放款),这是押金/托管型制度保障(DED-006 C 档工具箱里的"抵押担保"),
        不是声誉。省略担保交易谈淘宝信任,是对经济史的选择性引用。
        (b) Uber 锚:"依赖评分而非法律契约或人际信任"过度陈述——Uber 信任栈
        包含司机背景审查(监管强制)、商业保险、平台支付担保(乘客不付钱
        平台垫付司机)、GPS 全程留痕、服务条款仲裁——全是制度性机制。
        评分是其中一层,非全部。
        (c) Airbnb 锚:证词自我拆台——原文自己写"评分+验证+保险将信任成本
        降至可规模化",验证与保险都是制度机制,却把功劳记给评分。
        另:"淘宝小二/Amazon A-to-Z 不经过法院"为真,但"不经过法院"≠"非制度"
        ——平台裁决是第三方执行(私序制度,private ordering),在合同法阴影下
        运作,结构上更接近"私有化的 C 档"而非"非 C"。
        required:重写三锚,把事前信号(评分)与事后执行(平台制度)分开记账,
        删除"干净证据"级措辞。注意:重写后平台仍可能是新形态(算法协调半边
        不受影响),但信任半边的证据强度须诚实降级。

    8_definition_vs_prediction:
      verdict: pass_with_concern
      note: |
        文件自己诚实声明了危险:"'平台是新组织形态'这一命题的真值取决于分类
        框架的效用而非经验数据的拟合"——即核心分类主张是半定义性的。救它的
        是预测 (i)-(iii) 的经验内容:(i) 协调层级 ≤2 + 百万参与者是可测的;
        (iii) 重新分类压力是结构性预测且有真实风险(可被"平台规模化而无任何
        法律再分类争议"证伪)——且已被 Uber UK 2021 / 加州 AB5 / 欧盟平台
        工作指令印证,这是全文最硬的一条腿。(ii) 依赖未注册口径(见红旗 11)。
        结论:定义性风险被 (i)(iii) 部分对冲,但 (ii) 修好前对冲不完整。

    9_enumeration_exhaustiveness:
      verdict: pass_with_concern
      note: |
        推论未声称信任档位穷尽(D 是"新档位"主张,非"仅有四档"主张),故不
        构成 DED-008 式枚举缺陷。但主动猎第 N+1 档收获一个提示性案例:
        智能合约/链上质押(执行既不靠共同体、不靠法院、也不靠平台运营方的
        裁决,靠代码+抵押物自动执行)——若 D 档能加,E 档同样能加,说明
        "外化档位"空间是开放的。这不打击 L4-014,但反衬 D 档入册必须走
        与父推论(DED-006)的正式分类对齐流程,不能在子推论里各自开档——
        否则档位系统会在 L4 层碎片化(每条 L4 私开一档)。并入 RF-1 的修法。

    10_primary_suspect:
      verdict: needs_revision
      severity: should
      note: |
        文件自认 primary = "第三形态 vs 连续谱",secondary = "D 档独立性"。
        方向对但主次判反了:本轮审查发现最锋利的活威胁恰是 secondary——
        D 档独立性【已经】被体系内部证据(DED-006 verified 原文的 C 档编码 +
        锚点的追索路径事实)双面夹击,falsifiability (d) 不是假想敌而是
        现在进行时;而"第三形态 vs 连续谱"的攻击(Williamson 混合形态)
        经操作化判据(算法是否唯一主导通道/追索路径)尚可抵挡。
        should:primary/secondary 对调,并在 secondary(现 primary)下补
        与 DED-006 既有裁决的冲突披露。

    11_caliber_registration:
      verdict: needs_revision
      severity: required
      note: |
        L4-009 判例直接适用。两处"只有数字没有口径":
        (a) platform_organization 条件 (b) "信任基础≥50%为 D 档"——50% 的
        分母是什么?交易笔数?纠纷笔数?信任保障成本?GMV?不同口径下同一
        平台会落在线两侧(按交易笔数,绝大多数交易无纠纷、评分是唯一可见
        信任机制→过线;按纠纷追索路径,平台裁决/担保主导→不过线)。口径
        未注册,且两种自然口径的裁决方向相反——按歧义反向裁决原则,现状下
        条件 (b) 不得计为已满足。
        (b) 预测 (ii) "单位交易中用于信任保障的成本占交易价值的比例"——
        分子包含什么(平台抽成中的信任份额?保险费?押金的资金成本?)完全
        未定义,不可操作。
        required:一次性注册两处口径(分子/分母/测量来源),(ii) 若无法
        操作化则降级为示意性预测并明标。

  # ============================================================
  # L4 专属红旗 12-18 逐条
  # ============================================================
  l4_exclusive_red_flags:
    12_spectator_brick:
      verdict: pass_with_concern
      note: |
        逐一移除测试:
        - 移除 BR-L2-025:算法协调与声誉聚合失去技术前提,招牌格塌。不是观众。
          (但注意:它是 L2 辅前提却承主重——见红旗 15。)
        - 移除 DED-006:D 档失去定位坐标,"新档位"主张无法陈述。不是观众。
        - 移除 DED-001:最弱的一块。移除后"算法直接调度百万参与者"这一现象
          仍可完整描述,失去的是"这为什么算突破"的意义框架与预测 (i) 的
          r^n/n 机制语言。它的贡献偏解释基线而非独立机制。攻不穿(预测 (i)
          的"≤2 级 vs 纯层级天花板"对照确实要 DED-001 供给基线数值),但
          贡献是三父中最薄的,应在 necessity 中诚实标注贡献类型差异(基线
          供给 vs 机制供给)。should 级。

    13_trivial_conjunction:
      verdict: pass
      note: |
        不是父结论的 AND/OR 拼接。"非雇员统一调度"(主张 C)是合取产物:
        它需要算法替代监督(A,来自 BR×DED-001)与声誉替代合同保障(B,
        来自 BR×DED-006)同时在场才成立——任一父推论及其两两拼接都给不出
        "既非雇员亦非纯市场主体的第三种参与者位置"。eBay 案例(有 B 无 A,
        结果只是"有评分的市场"而非平台)是合取非平凡性的干净现实演示。
        通过——但主张 C 的【历史新颖性】另有伤(特许经营,见反例猎捕),
        那是红旗 10/discriminant 的问题,不是合取平凡性问题。

    14_emergence_missing:
      verdict: needs_revision
      severity: should
      note: |
        亲自验证 2×2 逐格判空(任务要求):
        - [管理层级 × 人际/制度] = 传统公司/官僚制:单由 DED-001+DED-006
          背景即可覆盖,非新形态。核实:成立。
        - [管理层级 × 算法化声誉] = 传统公司引入评分(如企业内部互评):
          DED-006 扩展可给。核实:成立(现实占位者存在,如内部 360 评分)。
        - [算法式 × 人际/制度] = 钉钉式算法辅助组织/算法调度+劳动合同
          (如 Amazon 自有仓储的算法排班——雇员+算法):DED-001 扩展可给。
          核实:成立,且文件自己的 boundary_case(钉钉)就是占位者。
        - [算法式 × 算法化声誉](招牌格):需 BR-L2-025(技术可能性)+
          DED-001(层级替代的基线与机制)+ DED-006(D 档的定位坐标)。
          核实:三父合力论证结构成立,≥1 格需 ≥2 条 L3 父推论——Rule E
          最低门槛通过,不是 L3 chaining。
        但 severity=should 的缺陷:emergence_type 声明为 interaction,过高。
        interaction 的定义是"一条【父推论】的机制修改了另一条【父推论】的
        机制的运作条件"——本条中发生机制修改的两处(n→1 压缩、D 档开档)
        都是 L2 辅前提 BR-L2-025 分别修改 DED-001 与 DED-006,而两条 L3
        父推论【彼此之间】无机制修改(协调轴与信任轴平行运作,靠 AND 合成)。
        这是"两个 L2×L3 修改的合取",按分级应报 conjunction(或诚实混合
        声明)。且 multi_parent_cells 仅 1 格 → 按 emergence_to_status_mapping,
        本条即使全部修好,天花板也是 verified(薄涌现),不是 verified*。

    15_weak_parent_premise:
      verdict: needs_revision
      severity: required
      note: |
        任务点名项,逐一核查:
        - L3 父推论:DED-001 [verified]、DED-006 [verified]——合格。
        - BR-L2-025:实际状态为 weakly_verified(非任务简报所说的 candidate
          ——其并行审查已出结果:IEA=1.6 < 1.8 阈值,media_theory 1.0 锚源 +
          两票 partially_agree 各 0.3),文件位于 L2-bridging/weakly_verified/。
        三重问题:
        (1) 结构:L4 方法论规定 L2 只能作辅前提,但 necessity 自己写明
        "移除 BR-L2-025 → 招牌格塌"——它是功能上的承重墙,挂着辅前提的名。
        (2) 置信度:承重前提未达 verified。validate.py 的 confidence_floor
        只机械检查 L3/L4 父链,L2 状态不进 CAP 表——这条走机器闸门查不出来,
        必须人裁:承重砖 weakly_verified,L4-014 不得升 verified,天花板
        目前是 candidate(保持现状,等 BR-L2-025 定论)或在显式条件化声明
        下的降格表述。
        (3) 最重的一层:BR-L2-025 审查中【未被排除】的证伪条件 (a)("数字
        效果可被'成本降低+人脑中介'完全解释,质变主张不成立")与 L4-014 自己
        的 falsifiability (a)("平台可被'市场+合约'或'公司+IT'完整解释,
        第三形态降格为数字化程度差异")是【同一个问题的两层表述】。即 L4-014
        的头号证伪条件,恰好悬在其承重 L2 砖没有解决的问题上——这不是普通的
        置信度传播,是证伪条件的同构传染。required:在 statement 或
        epistemic status 中显式声明"本推论的'第三形态(质变)'主张与
        BR-L2-025 的'质变'主张同呼吸:BR-L2-025 被证伪条件 (a) 击中,则
        本推论同时降格",并声明状态天花板受制于 BR-L2-025。

    16_anchor_theft:
      verdict: pass
      note: |
        Rule G 核查:Uber 锚是真复合锚——单一案例中同时呈现算法协调(A)、
        评分信任(B)、非雇员身份(C)及三者的交互产物(身份张力诉讼),
        不是"换个案例说 A 存在且 B 存在"。eBay 反衬案例(有 B 无 A → 不是
        平台)进一步证明锚点测的是合取而非单机制。通过。
        (锚点的【事实解读】问题归红旗 7,与锚点的【复合性】是两回事。)

    17_interaction_measurement_gap:
      verdict: pass_with_concern
      note: |
        复合输出(platform_organization)= 三个独立编码条件的合取,原则上
        可测量为区别于"A 单独"(钉钉格)与"B 单独"(内部评分格)的东西,
        且 eBay/出租车公司两个判别案例演示了单维在场、复合缺席的可观测差异
        ——合取的可测量性成立。
        concern:复合输出中唯一无法兑现测量的正是条件 (b)(D 档 ≥50%,
        口径未注册,红旗 11),即三条腿里信任腿的测量目前是空的。修好红旗
        11 后本旗自动闭合。

    18_claim_type_evidence_match:
      verdict: pass_with_concern
      note: |
        claim_type=structural_hypothesis(validate.py 合法枚举内)。结构性
        假说的证据标准是跨案例结构比较——文件提供 N=5-8 大平台定性比较 +
        2 判别案例 + 1 边界案例,且诚实声明"缺少系统性的跨平台定量检验"。
        与 trajectory_prediction 需纵向序列不同,结构假说用横断比较是匹配的。
        concern:预测 (ii) 实质是效率比较主张(D 档成本低于 B/C 档),这
        需要成本数据而非结构编码——当前证据类型不支持 (ii),与红旗 11 (b)
        叠加。(ii) 降级或补数据前,claim 的证据覆盖是 2/3。

  # ============================================================
  # 反例猎捕(L4 版:含"父推论都成立但交互不产生预测"型)
  # ============================================================
  counterexample_hunt:
    methodology: |
      三路猎捕:(甲) 关键拷问——"第三形态"vs Williamson 混合形态(hybrid):
      若平台与"混合形态的数字版"不可区分,涌现主张塌;(乙) D 档专项——
      算法声誉是否只是 B 档(有界声誉共同体)或 C 档(非人格化制度)的
      数字化;(丙) L4 专属——父机制都在场但不产生"第三形态"的案例。

    hunt_1_williamson_hybrid:
      case: "特许经营(McDonald's 加盟体系,1950s-)、包买制(putting-out)、长期供应合约——前数字时代的混合形态"
      attack: |
        Williamson (1991) 的市场-科层谱系中间早有 hybrid:特许加盟商在法律上
        是独立主体(非雇员),却接受品牌方的统一运营控制(选址/菜单/定价指导/
        质检/培训)——"非雇员统一调度"(主张 C)在前数字时代已被实现。
        若主张 C 是第三形态的构成性特征之一,而它不需要任何数字机制就存在,
        则"第三形态需要 BR-L2-025 作为物理前提"的必要性论证漏水。
      result: "未净杀,但揭出两处过度伸张"
      analysis: |
        (1) 操作化判据能挡住归类混淆:特许经营的协调是合同+人类督导
        (field consultant 巡店),非算法主导通道→编码为管理层级式;信任是
        品牌契约+法律执行(C 档)→落 [管理层级 × 制度信任] 格,不进招牌格。
        平台与特许经营在两条轴上都可区分,归类不塌。
        (2) 但两处过度伸张成立:(a) 主张 C("非雇员统一调度"是"以前根本
        不存在的"参与者位置)的历史新颖性不成立——特许经营就是这个位置的
        前数字占位者,平台的增量只在调度的粒度与实时性(逐单调度 vs 制度性
        框架控制),须降格表述;(b) discriminant_validity 只判别了"网络化
        组织"与"数字市场",对最强竞争理论(Williamson hybrid / 特许经营
        文献)只字未提——这是判别效度章节的结构性缺失,required。
        修法方向明确:补一节对 hybrid 的判别,判据可直接复用 operationalization
        (任务分配的算法主导通道 + 纠纷追索路径),并把人话摘要/statement 中
        "以前根本不存在"的措辞收敛到招牌格组合而非主张 C 单独。

    hunt_2_d_tier_collapse:
      case: "D 档 vs B 档同构检验:马格里布商人联盟/中世纪行会 vs 平台评分体系;以及体系内部证据 DED-006 的既有 C 档裁决"
      attack: |
        B 档定义(DED-006 boundary_criterion):"双方彼此不认识,但同属一个
        有界、身份可追溯的声誉/逐出共同体,执行靠共同体的多边声誉与逐出机制"。
        逐项代入平台:平台会员体=有界共同体(注册准入);账号=身份可追溯;
        评分=多边声誉;封号=逐出。四要素全中——按父推论自己的判据,平台评分
        的【执行结构】是 B 档的机器放大版。差异(聚合由算法而非闲话完成、
        规模大四个数量级、执行者是中心化运营方而非分布式共同体)是不是
        "结构差异"而只是"实现差异",恰是 falsifiability (d) 的问题——而
        L4-014 对此只给了主张,没给判别测试。
        更重的一击来自体系内部:DED-006(verified,三轮审查)的 boundary_
        criterion C 档例示明文含"平台评分",其 boundary_cases 把"支付宝/eBay/
        评分系统"裁为"制度化的非人格化信任,计入外化(C 档),非反例"。即
        父推论已对同一案例作出与 D 档主张【相反】的档位裁决。L4-014 声称
        "DED-006 只有 A/B/C 三档"(暗示父对此案例沉默)是对父推论内容的
        事实性误述。
      result: "揭出 required 级缺陷(未净杀核心,但净杀'D 档现状可用'"
      analysis: |
        不判净杀的理由:D 档作为【提案】仍有可辩护的实质——机器聚合的
        声誉信号在无共同体社会纽带的百万级匿名池上运作,确实既不满足 B 档的
        "共同体成员身份纽带"的社会学含义,也不满足 C 档的"不取决于任何
        成员身份"(封号即失去执行覆盖,执行【恰恰取决于】平台成员身份——
        按 DED-006 C 档判据的字面,平台评分其实也不干净地落 C!父推论自己的
        C 档例示与自己的 C 档判据存在张力)。即:平台信任在 DED-006 的三档
        判据下落不进任何一档的干净格——这反而是 D 档提案的最强论据,但
        L4-014 没有发现也没有使用它,而是用"没有立法机关/正当程序"这种
        修辞级论证。
        required 修法:(a) 按反馈原则向 DED-006 提交正式反馈(其 C 档例示
        "平台评分"与其 C 档判据"不取决于任何共同体成员身份"内部张力,
        由架构平台/作者流程决策是否开 D 档或改例示),L4-014 引用该反馈的
        结论而非单方面开档;(b) 在 D 档定义中拆开事前信号与事后执行两个
        机制(红旗 5),用"执行取决于平台成员身份但不取决于社会性共同体
        纽带"这一可操作判据取代"没有立法机关"修辞。

    hunt_3_parents_present_no_emergence:
      case: "FICO 信用评分体系(美,1958-/1989 普及)——算法聚合的行为声誉,前互联网"
      attack: |
        L4 专属猎捕:机器可处理性(批量数据处理)+ 声誉聚合(信用分)在场,
        却没有催生任何"第三组织形态"——FICO 只是给 C 档(信贷合同+法律
        执行+抵押)加了一个筛选信号,组织形态纹丝不动。若 BR×DED-006 的
        交互自动产生新档位/新形态,FICO 应该已经产生了。
      result: "被消化,反哺推论"
      analysis: |
        FICO 案例恰好演示了 L4-014 自己的格局:它是 [管理层级 × 算法化声誉]
        格的占位者(银行协调仍是层级式,只是信任部分依赖算法评分)——文件
        对该格的判定("混合形态,单父扩展可给,非新形态")被独立案例证实。
        它同时证明:算法声誉【单独】不产生第三形态,必须与算法协调合取——
        支持红旗 13 的合取非平凡性。建议作者把 FICO 收进 boundary_cases
        (比"传统公司引入评分系统"的假想例更硬)。

    hunt_4_signature_cell_outperformed:
      case: "falsifiability (b) 检验:证券交易所中央撮合引擎——算法协调百万级参与者 + 制度信任(清算所/证券法),规模与效率不输平台"
      attack: |
        交易所的撮合引擎以算法直接分配(订单匹配)协调百万级独立参与者,
        协调层级数 ≈1,信任靠 C 档(中央对手方清算+监管)——协调规模与
        效率【不低于】任何双边平台。这是否触发 falsifiability (b)(非招牌格
        等同或优于招牌格)?
      result: "未触发,但暴露预测 (i) 的表述漏洞"
      analysis: |
        (b) 的字面只针对 [管理层级 × 人际/制度] 格(要求管理层级式协调达到
        平台规模),交易所落 [算法式 × 制度信任] 格,不在 (b) 射程内。
        但它击穿预测 (i) 的一个隐含伸张:"协调层级 ≤2 + 百万参与者——这是
        任何纯层级组织无法复现的"为真,却不是招牌格独有——算法式 × C 档
        同样做到。即预测 (i) 只判别"算法 vs 层级"轴,对信任轴无判别力;
        招牌格的独有预测其实只剩 (ii)(D 档成本优势)——而 (ii) 恰是
        口径未注册、证据未覆盖的那条(红旗 11/18)。should:在 (i) 旁诚实
        标注其判别范围,避免读者把 (i) 的强证据误记到"第三形态"整体头上。

    net_verdict: |
      无净杀。四路猎捕结果:hunt_1 揭出主张 C 新颖性过度伸张 + discriminant
      结构缺失(required);hunt_2 揭出 D 档与 verified 父推论的正面冲突
      (required,但同时发现了 D 档提案的更强重构路径——父推论 C 档判据与
      例示的内部张力);hunt_3 被消化反哺;hunt_4 揭出预测 (i) 判别范围的
      过度伸张(should)。核心(招牌格合取结构 + 预测 (iii))在所有攻击下
      存活——推论可修,不该毙。

  # ============================================================
  # 不再犯检查
