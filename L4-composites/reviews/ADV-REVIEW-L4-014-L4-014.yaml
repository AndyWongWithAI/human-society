  counterexample_hunt: |
    按 L4 评分卡必做项,主动构造反例,聚焦"父推论都成立、但交互不产生 L4 预测结果"。

    **hunt_1: 沃尔玛的算法供应链(2010s-)—— 协调半边在场但信任半边不在 b1∧b2 构型**
    沃尔玛有算法协调(供应商管理库存 VMI、需求预测算法、自动补货系统协调数万家供应商),但供应商筛选走长期合约+合规审计+EDI 接入审核(C-制度),纠纷追索走合同法+仲裁(C-制度),评分系统不参与决策(无 b1,b2 不在私序)。父推论 DED-001(算法突破层级天花板)、DED-006(信任外化到 C-制度)都成立,BR-L2-025(机器处理 EDI/需求数据)成立。**结果**:落[算法式 × C-制度]格,即判空表的[算法式 × 其他]格,不进招牌格。验证招牌格判据(必须 b1∧b2 复合构型)的判别力——一个算法协调但信任不在 b1∧b2 的实例精确落到非招牌格。被消化,反哺判空表[算法式 × 其他]格的占位。

    **hunt_2: Kickstarter(2009-)—— b1 在场但协调半边不在算法式**
    Kickstarter 有声誉信号(creator 历史项目成功率+backer 评论),但项目筛选由 backers 自行决策(算法只做推荐/排序),创作者定价/进度/内容设计完全自主,平台不做调度。父推论 DED-006(b1 系声誉信号)、BR-L2-025(机器处理项目数据)都成立。**结果**:落[撮合式 × b1]格,协调半边弱(撮合中介而非命令中介,按 hunt_6 亚判别),不进招牌格。被消化,反哺[算法式 × 其他]格与[管理层级 × 其他]格之间的边界——声誉信号在场但协调非命令中介时,平台身份进一步弱化,接近"市场+评分"。

    **hunt_3: 比特币区块链(2009-)—— 协调算法化但 b1 结构性缺席**
    比特币有算法协调(工作量证明+最长链规则),参与者为非雇员(独立矿工/节点),但无 b1:无评分系统,无声誉信号,信任靠密码学证明+共识机制。父推论 DED-001(无层级天花板)、BR-L2-025(机器处理哈希/签名)都成立,信任由密码学机制承担(C-制度亚型,但更接近"算法即法律"的极端形态)。**结果**:落[算法式 × 其他(C-密码学)]格,信任构型与 C-算法亚型截然不同(无成员身份依赖,任何地址可参与)。这是新的细分可能性——C 档内部除 C-制度/C-算法外还有 C-密码学亚型,但这是 DED-006 反馈流程的事,本推论无权开档。被消化,揭出 DED-006 父推论 C 档内部还有第三种亚型的可能性,但不影响本推论结论(区块链仍落非招牌格)。

    **hunt_4: 钉钉/企业微信(2015-)—— hunt_1/r2 boundary_cases 已收录,本轮复查无新发现**
    协调算法化(任务/审批/打卡),参与者为雇员,信任走雇佣关系+公司制度(C-制度)。落[算法式 × C-制度]格,这是边界案例不是反例。已消化,无新净杀。

    **hunt_5: 成熟期 Amazon Marketplace(2018-)—— 生命周期的反向失败模式**
    Amazon FBA(代发货+ Prime 徽章)使第三方卖家身份对买家近乎不可见,A-to-Z 保障覆盖所有 FBA 订单,公开界面上"平台自营担保"信号占比远超"声誉信号"——按作者 b1 注册口径,b1 应编码为不满足(担保/验证类占比更大)。按作者生命周期条件化收敛路径(成熟期 b1 衰减、向算法协调+私序收敛),精确命中条件化预测。**结果**:被消化(条件化收敛路径得到 1 锚支持)。但同时揭出**反向失败模式 A**:Amazon 的成熟期演化不是 b1 衰减,而是 b1 被平台内化为 C-制度子集——AmazonBasics、Amazon 自营品牌在第三方平台上与第三方卖家竞争,买家实际决策从"选哪个卖家"转向"在 Amazon 上买",b1 在买家决策界面被"Amazon 平台品牌"取代。这一演化路径与作者条件化收敛方向(算法协调+私序)不同,实际方向是"算法协调+平台品牌+C-制度"。本推论未注册此反向路径。required。

    **hunt_6: 淘宝 2018-2024 演化—— 协调轴 hunt_6 亚判别的二次复查**
    淘宝 2018 后大规模推天猫品牌店、淘宝直播(主播评分+品牌评分叠加)、直通车广告位购买。算法协调:搜索排名 = 直通车出价权重 + 历史销量 + DSR 评分 + 平台标签 → 算法是命令中介(降权/封号阈值生效),协调半边成立。b1 演化:店铺评分仍可见,但品牌店占比上升后,买家决策依据从"评分"更多转向"品牌信任(品牌天猫店身份)",声誉信号占比下降。按作者注册口径,b1 应编码为不满足(品牌验证类信号占比超过声誉类)。**结果**:与 hunt_5 收敛方向一致(成熟期 b1 衰减),条件化路径再次命中。但揭出**反向失败模式 B**:淘宝直播催生的"KOL 私域复购"是算法不可见的信任信号(交易发生在直播间外,通过主播微信/粉丝群完成),公开界面审计系统性低估此类信任信号占比。b1 注册口径假设"公开界面=实际决策依据",假设本身未注册,成熟期 b1 实测可能有 ≥50% 系统性低估。required。

    **hunt_7: 微信公众号私域流量(2014-)—— 成熟期信任信号全面脱离公开界面**
    大量公众号-读者关系在公众号+朋友圈闭环中沉淀信任,实际成交通过微信支付完成。平台信任栈完全不依赖公开声誉信号(无评分系统),信任完全私域化。这不是平台,而是私域闭环——但揭示了成熟期"声誉信号→私域沉淀"的迁移路径。**结果**:被消化(私域闭环不在本推论射程内,平台指双边/多边市场平台,不指私域闭环)。但揭出条件化收敛的边界:成熟期平台若催生大规模私域迁移,平台本身可能"空壳化"为流量入口,实际信任完全转移到私域——这是第三形态主张在成熟期的潜在塌缩路径,作者未注册。should 级,留 r4。

    **hunt_净杀结果**:无净杀。所有反例均落判空表的非招牌格或反哺 boundary_cases / discriminant_validity。父推论交互(耦合点 = 信号回馈算法)经多例验证仍为招牌格独有。但 hunt_5/hunt_6 揭出两条反向失败模式未注册,标记 required。
