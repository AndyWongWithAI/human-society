  counterexample_hunt:
    methodology: |
      r2 三路:(甲) 按重编码后的 b1 猎"成熟平台信任栈演化"——若头部
      平台的事前信号已由平台担保/品牌主导,招牌格占位者清零;(乙) 攻
      协调轴——算法撮合(市场机制的机器执行)与算法命令(层级功能的
      机器替代)在 coordination_mechanism 编码下是否可区分,若不可区分
      则"替代层级(DED-001)"的链接漏水;(丙) 复核 r1 四路猎捕在新
      地基上是否有翻案。
    hunt_5_mature_platform_b1_decay:
      case: "Amazon FBA/Prime 徽章(2006-)、Airbnb AirCover(2021)、Uber 品牌担保——成熟平台的事前信任信号向平台自营担保迁移"
      attack: |
        按 b1 注册口径(成交前决策界面可见信任信号构成),今天的头部
        平台上:Amazon 买家主要看 Prime/FBA/A-to-Z 徽章而非第三方卖家
        评分(FBA 混库使卖家身份对买家近乎不可见);Airbnb 首页主推
        AirCover 全额保障;Uber 乘客几乎不看司机评分即上车(品牌担保
        足够)。若界面审计显示担保/验证类信号占比超过声誉信号,b1 在
        成熟平台上不过线→招牌格占位者清零→"第三形态"退化为"算法协调+
        私有化 C 档"——恰好落进 falsifiability (a) 的降格分支,且
        暗示招牌格至多是平台生命周期早期的过渡构型而非稳定形态。
      result: "未净杀,但揭出 required 级缺口+一个射程威胁"
      analysis: |
        不判净杀的理由:b1 原则上可测(口径已注册),且平台早期
        (eBay 1997-2005/淘宝 2003-2008/Airbnb 2008-2014)声誉信号
        主导的定性证据充分——招牌格可能在"信任栈尚未制度化增厚"的
        阶段真实被占据。但两个后果必须兑现:(a) 至少一个承重锚给出
        注册口径下的 b1 实测(哪怕是历史界面的审计),否则红旗 6 不过;
        (b) 若实测确认衰减,主张须条件化到平台生命周期阶段(如"第三
        形态构型在平台建立期可观测,成熟期向算法协调+私序制度收敛")
        ——这本身仍是可辩护的结构命题,甚至与 DED-006 的"外化不可逆
        推进"机制呼应,但与现文的无时间限定表述不同,须显式选择。
    hunt_6_matching_vs_command:
      case: "算法撮合(市场出清的机器执行)vs 算法命令(层级功能的机器替代)——Uber surge 定价其实是价格信号"
      attack: |
        协调轴编码("任务分配由自动化系统直接推送,无人级审批")无法
        区分两种结构完全不同的东西:交易所撮合引擎做的是市场出清
        (价格中介),Uber 派单做的是指令分配(命令中介)。若平台算法
        实为高频化的市场撮合,则"算法替代层级(DED-001 链接)"漏水,
        平台=高频市场+私序制度,第三形态塌回市场变体。
      result: "攻不穿(对 Uber),但暴露协调轴的一个未标注歧义"
      analysis: |
        Uber 挡得住:接单率惩罚/目的地盲派(历史上)/路线指令/封号
        阈值是监督-指挥功能,非价格信号;anti_talisman (3) 的"须证明
        替代至少一级人类管理决策"判据恰好卡住纯撮合。但淘宝锚的协调
        半边偏弱——搜索排名/推荐更接近撮合与中介(市场功能)而非
        指挥(层级功能),"替代采购经理/品类管理层级"的类比有伸张;
        交易所案例(r1 hunt_4)在协调轴上与平台同格,说明编码判据
        应补一条亚判别(分配是否伴随对执行过程的指令与惩罚,而非仅
        价格/排序中介)。should 级,记入清单。
    recheck_r1_hunts: |
      hunt_1(特许经营)——RF-5 消化到位,无翻案;hunt_2(D 档塌缩)
      ——已由细分提案+待反馈项框架消化,但其残留(旧框架论证句)见
      required_fix_verification.RF-1;hunt_3(FICO)——在新地基上判别
      价值上升(信号不回馈执行=耦合点的对照),仍未收进 boundary_cases,
      并入清欠;hunt_4(交易所)——在新地基上判别价值上升(b1 恒空=
      复合构型的对照),预测 (i) 判别范围标注仍未做,并入清欠。
    net_verdict: |
      无净杀。hunt_5 揭出 b1 零实测的红旗 6 缺口与"过渡构型 vs 稳定
      形态"的射程威胁(required+条件化选择);hunt_6 攻不穿核心但暴露
      协调轴亚判别缺失(should)。核心(重定义后的招牌格三父合力+
      预测 (iii))在所有攻击下存活——可修,不毙。

