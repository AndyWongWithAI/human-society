  non_recurrence:
    ded_004_unfalsifiable_loop: |
      未重蹈。falsifiability (a)-(d) 四条全部给出独立于结果的操作化路径,
      anti_talisman 禁止由成功反推分类。"分类框架效用"的半定义性风险被
      (i)(iii) 的经验预测对冲(红旗 8)。
    ded_007_welded_axis: |
      未重蹈。协调编码(指令流)与信任编码(追索路径)异源,被预测量
      (规模/成本/再分类压力)另测——无焊点。唯一测量病灶是 50% 口径
      未注册(红旗 11),那是 L4-009 病,不是 DED-007 病。
    l4_009_caliber: |
      部分重蹈——"≥50% D 档"与预测 (ii) 成本比例两处只有数字没有口径,
      与 L4-009 被毙的病灶同型。按判例,修订必须一次性注册,且在注册前
      相关边界裁决一律按不利于推论方向执行。

