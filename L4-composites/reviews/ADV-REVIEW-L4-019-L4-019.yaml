  counterexample_hunt: |
    **反例1：MeToo"反弹"的因变量性质——叙事热度vs道德标准**
    构造：若把MeToo后2-3年的"反弹"用Google Trends对"#MeToo"关键词的搜索量衡量，会发现搜索量从2017年10月的峰值100跌至2019年的<10。但Google Trends测的是叙事热度，不是道德标准严格度。若用"性骚扰零容忍政策采纳率"作为因变量，2018-2021年间实际是上升而非下降（HR政策被大量合同化）。这意味着"道德振荡"的因变量测量在两个口径下方向相反。MeToo案例的"振荡"是叙事热度振荡而非道德标准振荡——这把L4的因变量从"道德规范严格度"偷换成"公众注意力"，违反了红旗3（测量轴正交）的核心原则。这是 **揭出过度伸张**：L4的"振荡假说"目前的因变量锚定在叙事热度而非真实的道德内化标准，需要作者明确"道德振荡"的因变量测量口径。

    **反例2：信息行业vs制造行业MeToo反弹速度——作者预设签名但被自身数据反驳**
    作者r5提出第二个独立签名"若(a)是主因，则信息行业反弹速度应快于制造行业"。但作者r4已展示的初步分离结果显示"信息行业（高数字媒介使用）vs制造行业（低数字媒介使用）"的差异未在主分析中给出，且主分析（高vs低法律风险组1-2年vs3-5年，p=0.03）的核心差异方向是法律风险而非数字媒介使用。这导致第二个签名变成"如果执行会发现(a)不成立"的可证伪预测。**这是被作者自身证据弱化**，但尚未在审查记录中被正面处理。

    **反例3：ESG反漂绿运动（2023-2025）作为射程外案例**
    2023-2024年ESG反漂绿运动中，被指控漂绿的企业经历了"受害叙事传播→标准推高→反弹/标准松动"的模式。例如某大型消费品企业2023年Q3被指控漂绿后ESG评分标准被推高，2024年Q2出现反叙事（"ESG标准过于严苛不利于创新"）和企业层面的标准回滚。此案例同样呈现"通胀-紧缩"振荡，但ESG属于企业治理子领域而非文化战争/身份政治子领域。这 **被射程限定消化**（作者已预注册ESG作为射程边缘案例）。

    **反例4：企业多元化招聘（DEI）的2024-2025回滚**
    2024-2025年美国企业DEI回滚呈现快速收紧模式（Trump行政命令+多家企业宣布缩减DEI项目），但这是政治驱动的制度性变化，而非"数字时代道德振荡"的自然产物。这与L4的"未被制度化的道德标准漂移"射程限定一致——DEI回滚在制度层面而非道德层面，**被射程限定消化**。

    **净杀候选：未在scope内猎到。**所有反例要么被射程限定消化、要么成为新增required级缺口（因变量测量轴正交问题、正反馈回路依赖额外机制）。

    **L4专属反例猎捕（"父推论都成立但交互不产生L4预测"）**：
    构造：1991年Anita Hill听证会（快传播+完整共情，电视直播8000万观众）+ 1998年Clinton-Lewinsky事件（快传播+完整共情，电视深度报道）—— 两个事件都是性骚扰/性丑闻议题、快传播+完整共情条件。按L4对格（快传播+完整共情）的预测，应产生"持续上升或慢回弹"。事实上：Hill事件后道德标准短暂推高但Clinton-Lewinsky事件反而暴露"道德疲劳"——Clinton的民调支持率在丑闻期间反而上升。这一观察表明"前数字时代也存在局部振荡"而非"持续上升"，削弱了L4的"前数字时代长周期慢回弹"的差异预测。**这是揭出过度伸张**：差异预测（快传播+完整共情→持续上升）在Clinton-Lewinsky案例上被部分削弱，作者在r3已承认Anita Hill案例"存在中间摆动"，但Clinton-Lewinsky案例未被纳入射程处理。
