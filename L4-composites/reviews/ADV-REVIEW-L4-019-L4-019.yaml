    L4-14 观众砖: 未命中。DED-025和DED-041均不可替代。
    L4-15 平凡合取: 未命中。锯齿振荡是新时序形态，非AND拼接。
    L4-16 涌现缺失: 未命中。合力格(快传播,低共情)确实需两父合力。
    L4-17 弱父前提: 未命中。两父推论均为verified。
    L4-18 锚点偷窃: 命中。BLM本应是第三独立锚，但被错误排除为射程边界。
    L4-19 交互测量缺口: 命中。振荡频率/振幅在当前案例库中不可测量。
    L4-20 声明-证据错配: 命中。轨迹预测需要多案例，单案例不足以支撑。
  counterexample_hunt: |
    猎捕1: "快传播+低共情但标准不回弹"案例——BLM 2020-2024。观测到DEI项目回滚、defund退潮，实质是部分紧缩，应支持L4振荡预测而非被排除。**结果：揭出过度伸张**（作者用"制度化抵消"排除，但部分反弹本身就是紧缩证据）。
    猎捕2: "前数字时代快传播+完整共情+振荡"案例——美国禁酒运动（1900-1933）。受害叙事快传播，13年后宪法修正案废除，周期短。**结果：被消化但暴露射程限定事后补丁性**——作者在r1才加入"未被制度化"限定，方向恰好排除此案例。
    猎捕3: 数字时代"高共情+快传播+振荡"案例——COVID戴口罩（2020-2021）。快传播+初期高共情，6-12个月内剧烈反弹。**结果：揭出双引擎冗余**——单引擎（传播加速）可能足以产生振荡，"低共情"作为独立引擎的必要性被削弱。
    猎捕4: 反MeToo反弹的(a) vs (b)(c)(d)机制分离。**结果：未净杀但primary_suspect未解决**——作者承认当前证据不足，需未来数据。
  required_fixes:
    - "1. 重新处理BLM案例——将2020-2024年观察到的DEI回滚/defund退潮作为部分紧缩的振荡证据纳入支持案例，而非用\"制度化抵消\"排除为射程边界；若坚持排除，须给出\"制度化\"的可操作判据（如合同化政策=制度化，口头规范=未制度化）并在数据收集前预注册。"
    - "2. 将\"未被制度化的道德标准漂移\"这一射程限定的判定判据（何为\"制度化\"）连同边界案例清单预注册，删除事后选择方向性的反例处理；建议明确声明该限定适用于禁酒运动、BLM等历史案例时是射程确认而非反例排除。"
    - "3. 为primary_suspect(a) vs (b)(c)(d)的机制分离提供至少一组可观测的当前证据（如已发表的数字使用时长与MeToo反弹速度的纵向关联数据），而非仅承诺未来研究方向；若(a)与(b)(c)(d)在统计上不可分，则L4的核心机制不能verified，只能保留为candidate。"
    - "4. 注册反向失败模式——数字媒介对共情可能方向不定（\"看多了麻木\"vs\"看多了敏感\"），明确说明在何种条件下L4预测成立、何种条件下反向。"
    - "5. 降低\"高频率振荡\"的claim强度——当前案例库仅有MeToo和JK Rowling两个单次振荡案例，无法统计\"频率\"，应改为\"锯齿倾向（oscillatory tendency）\"或\"振荡假说\"而非\"高频率振荡规律\"。"
  oneline: |
    涌现性真实且非平凡合取，但primary_suspect未解、BLM被错误排除为射程边界、"未制度化"口径事后补丁——差一口气在机制识别和边界诚实性，需定向修订。

round_4:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 4, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制"双引擎→锯齿振荡"在叙事层成立,但 verified 门未达: (1) 当前样本库仅两例干净振荡(MeToo、JK Rowling),BLM为混合案例,Anita Hill/民权运动被射程限定消化——统计意义与案例多样性都不足;(2) primary_suspect(具身共情削弱 vs 法律风险/执行成本/派系政治四机制相对贡献)未被独立证据分离,核心因果链"低共情→旁观者退出加速→紧缩更快"仍为候选;(3) 反向失败模式已在作者自己注册中激活(Vossen元分析方向不确定),文件诚实地把整体降为candidate,但 candidate ≠ verified 的判定逻辑仍需在案例库扩充前保持。L4 涌现(锯齿振荡而非方向变化)成立,但"涌现有效"的统计验证门槛未达。判定 needs_revision 而非 rejected:涌现机制、测量口径、预注册操作化、2×2格阈值、反向模式均已认真注册,差的是经验验证而非结构。
  red_flags: |
    1. brick=conclusion — 未命中。L4核心"双引擎→锯齿振荡"非父推论原文,DED-025只给通胀-紧缩方向动力学,DED-041只给共情削弱水平,两父合力才产生"振荡"这一时序涌现物。
    2. 逐格判空 — 未命中(已消解)。2×2格(快传播×低共情)的"高振幅振荡"非平凡,且预注册了分位数阈值(中位数50%切分快/慢、高/低),边界案例用最不利保守口径。但格(快传播,高共情)的预测"持续上升或慢回弹"缺乏直接干净案例支撑——Anita Hill被射程限定消化(承认中间摆动但幅度小),前数字时代缺乏完整数据三角验证。
    3. 测量轴正交(DED-007死因) — 未命中(已修复)。r2预注册了传播速度(平台曝光API)与共情(纵向面板调查/共情量表)数据源独立,被预测量与驱动量异源。
    4. 射程/排除钩子独立于结果(DED-005) — 部分命中。"制度化"判据已在r3预注册(立法/行政法规/合同条款/具法律约束力政策文件),边界案例BLM按制度化部分(警察改革)排除、非制度化部分(反种族主义规范)纳入——预注册,非事后选择。但Anita Hill案例在r3被"承认中间摆动"修正,这是否属于事后口径调整存疑——Clinton-Lewinsky属不同子议题(总统道德 vs 性骚扰),不直接证伪,但作者自己也承认"并非严格的25年单调上升"——此修正应明确标注为"边界案例的口径细化"而非"反例处理"。
    5. 分类判据档位匹配(DED-006) — 未命中(已消解)。振幅比/时间常数比为连续量,操作化合理;2×2格的快/慢、高/低已用分位数+中位数50%切分,边界用保守归类。子领域区分(文化战争 vs 制度化议题)预注册,MeToo职场子领域因制度化回弹弱,处理得当。
    6. anti-talisman 真兑现 — 部分命中。primary_suspect为MeToo反弹四机制相对贡献度,作者提出"比较不同机构(法律风险高vs低)的反弹速度"作为分离方案——这是事前可测的判别方案,但尚未执行。当前证据(Vossen 2022 r=-0.15;Konrath 2011纵向数据)只支持(a)机制的可能性,相关≠因果,作者诚实标注。但作者未提供"机构间反弹速度差异"或"面板回归分离各机制"的已执行实证——只在判别方案中预注册。
    7. 现实锚事实核查(DED-007死因) — 未命中(已消解)。MeToo事实链(2017峰值→3-5年周期)准确;JK Rowling 2020事件+1-2年反弹周期准确;BLM 2020峰值+2021-2024 DEI回滚准确;Anita Hill 1991听证会8000万观众数据需核但基本准确;1960s民权运动电视直播与5-10年上升期准确。
    8. 条件是下定义还是做预测 — 未命中。预测(i)(传播速度↔通胀峰值)、(ii)(数字媒介使用时长↔共情下降)、(iii)(标准紧缩回弹速度数字时代>前数字时代)均为可证伪预测,非定义。
    9. 枚举穷尽 + species 按判据定义(DED-008) — 不适用(本推论非枚举型)。
    10. primary_suspect 指对 + 平凡化检查 — 部分命中。作者自认primary_suspect为MeToo反弹四机制贡献度分离,定位准确。但更致命的软肋可能是: 当前样本仅两例干净振荡(MeToo+JK Rowling),且都属"性别/身份政治"子领域——L4的核心机制是否子领域特异?文化战争议题外的道德领域(如企业ESG、动物福利、AI伦理)是否也呈现锯齿振荡?这构成样本代表性疑点,作者未注册。
    11. 口径完整注册 + 歧义反向裁决 — 未命中(已消解)。振幅比/时间常数比/快慢传播/高低共情/制度化判据均预注册,边界案例用最不利保守口径。反向裁决声明清晰。
    12. 数据源同根冒充多源独立 — 未命中。传播数据(平台曝光API)与共情数据(纵向面板/共情量表)异源,作者明确标注独立。
    13. API 可及性冒充认识论独立性 — 未命中。作者正确区分了平台曝光API数据(认识论独立于问卷)与自我报告使用时长(独立于平台数据)。
    14. 反向失败模式缺失 — 未命中(已注册)。作者在primary_suspect和statement两处都注册了反向失败模式:"若数字媒介使用与具身共情下降无因果关联或存在相反方向,L4自动退化为'快传播双引擎'假说"。此注册诚实且方向正确。但反向失败模式还有第二个未被注册的维度: 快传播本身是否可能增强而非削弱共情(即"数字激发共情"假说作为(a)的对立面,作为(b)传播加速通胀的对立面)?作者在primary_suspect段提及但未作为独立反向模式注册为失效条件。
    15. Bootstrap限定缺失 — 不适用(L4不涉及新技术介导的冷启动社会形态)。
    16. 验证对象存在性未标注 — 未命中。作者诚实标注:"目前支持L4核心机制的干净案例仅MeToo和JK Rowling两个...不具备统计意义上的频率验证,因此称为振荡假说而非高频率振荡规律。需更多案例验证。"此标注恰当。
    L4专属:
    14. 观众砖 — 未命中。移除DED-025:只剩DED-041的共情削弱水平预测,无通胀-紧缩振荡;移除DED-041:只剩DED-025的方向动力学,无数字媒介加速因子。两父均不可替代。
    15. 平凡合取 — 未命中(已消解)。L4结论"锯齿振荡"非DED-025+DED-041的AND/OR拼接,是时序涌现(频率+振幅)。
    16. 涌现缺失 — 未命中。格(快传播,低共情)的"高振幅振荡"需DED-025(通胀方向)+DED-041(退出加速)合力——任一父推论单独只能描述单向或单周期,不能预测"振幅"这一二阶统计量。
    17. 弱父前提 — 未命中。DED-025、DED-041均为verified,BR-L2-014/018/019/025均为verified/weakly_verified,无candidate作主前提。
    18. 锚点偷窃 — 未命中。MeToo+JK Rowling+BLM为不同案例,锚点非重复单机制。
    19. 交互测量缺口 — 部分命中。振幅比(通胀峰值-紧缩谷值)/通胀峰值 可直接测量;但"振荡频率"在仅两例干净案例的样本库中无法做频率验证(作者诚实标注)。测量缺口在统计意义上真实存在,非结构问题。
    20. 声明类型-证据标准错配 — 部分命中。声明为"复合推论"且self-declared为candidate,要求trajectory_prediction对应纵向/序列数据。当前MeToo+JK Rowling+BLM为案例序列,非纵向面板数据;缺少5年以上的多案例纵向追踪。
  counterexample_hunt: |
    构造三类反例:

    (1) 反例猎捕A: 父推论都成立但交互不产生L4预测的案例
    - 试: 2008-2012年间的"占领华尔街"运动(Occupy Wall Street)。受害叙事(1% vs 99%)在数字时代通过社交媒体快速传播(快传播条件满足);但未观察到锯齿振荡——运动在2011年高峰后迅速消退,没有"通胀→紧缩回弹→下一轮暴涨"的锯齿周期,而是单次脉冲后消散。分析: 此案例可能是"受害叙事缺乏道德创业者持续推动"(DED-025的通胀支路不全)+占领者缺乏机构化锚点,与L4核心机制(快传播+低共情→振荡)部分不符但部分支持(单次脉冲而非锯齿)。被消化为射程边界: 占领华尔街未通过"道德创业者持续叙事供给"测试,故通胀支路本身单次而非循环——这是DED-025而非L4的限制,不构成L4反例。

    (2) 反例猎捕B: 数字时代非文化战争议题的道德振荡
    - 试: 2018-2020年间的"Meatless Monday" / 气候焦虑叙事(动物福利/环保议题)。数字传播速度满足"快",但道德标准变化呈缓慢线性上升而非锯齿振荡——素食/弹性素食比例年增1-2%,无明显回弹。分析: 此案例可能涉及"制度化不足但子领域不在文化战争范畴"——L4的核心机制是否子领域特异?作者在子领域区分中明确"文化战争议题子领域预期锯齿振荡",但MeToo/JK Rowling之外的文化战争议题是否也呈现锯齿需更多案例。此猎捕揭出过度伸张: L4的"双引擎→锯齿振荡"机制可能在文化战争子领域外的适用性存疑,需补充跨子领域验证案例或限定射程为"文化战争/身份政治子领域"。

    (3) 反例猎捕C: 高共情数字时代的反例
    - 试: 2014-2016年间的#BringBackOurGirls(尼日利亚被绑架女学生)。受害叙事在社交媒体快速传播,道德标准被推高(全球关注),但未观察到锯齿振荡——事件关注度在2014年高峰后消退,但未反弹回"低关注"基线后再次高峰,也无明确的"通胀-紧缩"周期。分析: 案例说明快传播并不必然产生锯齿振荡,需低共情条件共同作用——这支持L4的2×2格预测(快传播+高共情→持续上升或慢回弹,而非锯齿)。但此案例的共情水平未独立测量,无法判定落入哪一格。被消化为支持: 此案例支持L4的2×2机制而非反例,但指出当前样本缺乏干净的"快传播+高共情"案例作为对照格验证。

    净杀反例: 无
    被消化/支持案例: 占领华尔街(被DED-025消化)、#BringBackOurGirls(支持2×2机制)
    揭出过度伸张: L4射程在跨子领域(非文化战争)的适用性未经验证,需限定或扩充案例
  required_fixes:
    - "1) 在射程限定中明确注册\"文化战争/身份政治子领域\"作为L4的主要适用边界(当前射程限定为\"未被制度化\",但MeToo/JK Rowling/BLM均属文化战争,样本同质性高,需在子领域区分段加注\"当前案例库均属文化战争子领域,跨子领域适用性待验\")"
    - "2) 为primary_suspect补充一个已执行的实证分离方案(哪怕是初步的):例如基于现有公开数据(机构诉讼成本面板、媒体派系差异)对MeToo反弹四机制的相对贡献做粗略量化,而非仅停留在\"判别方案预注册\""
    - "3) 补充至少一个非文化战争子领域的案例(正向或反向)以验证L4机制是否子领域特异;若无法找到,应在诚实标注段进一步收紧射程声明"
    - "4) 将\"反向失败模式\"扩展为两条独立路径:(a)数字媒介与具身共情无因果/相反方向(已注册);(b)数字传播本身增强而非削弱共情(\"数字激发共情\"假说)——目前仅在primary_suspect段提及,未作为独立失效条件注册"
    - "5) 为\"振荡频率\"补充测量可行性说明:作者诚标注明两例不够,但未给出\"需要多少案例+多长时间窗口\"的统计验证门槛;建议预注册\"N≥X例干净振荡案例+覆盖Y年\"作为candidate→verified的升级条件"
  oneline: |
    双引擎→锯齿振荡的机制叙事成立、涌现有效、测量口径预注册到位,但案例库仅两例干净振荡(且同属文化战争子领域)、primary_suspect四机制分离未执行、反向失败模式注册不全,差一口气到 verified。

round_5:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 5, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    本推论 r4 后已大幅收敛：预注册口径、反向失败模式、子领域射程、统计验证门槛都已落地。但仍挡 verified 的硬伤有三：

    1. **涌现缺失（红旗16）与平凡合取残余**：必要性论据说"DED-025单独不能预测'反弹加速'，DED-041单独不能预测'通胀加速'"。这一论证有漏洞——DED-025的"通胀靠叙事×创业者"已暗示"通胀速度随传播速度变"；DED-041的"屏幕让退出更容易"也已暗示"紧缩速度随退出容易度变"。L4的所谓"涌现"——"通胀-紧缩时间常数比变化"——其实是两个父推论**速度参数各自被同一外生变量（数字媒介）调节**后的简单合成。不需要任何"涌现"，这只是同一外生量同时驱动两个父推论的机械叠加。真正要涌现出新形态（锯齿振荡作为时序模式），需要证明：(a) 速度比改变产生**新的频率成分**（非线性谐波），而非仅缩放现有波形；(b) 这要求 DED-025 与 DED-041 之间存在**正反馈回路**（通胀峰值→共情进一步下降→更快退出→更深紧缩→反弹更猛），但 L4 全文未论证此回路，也没有给出任何机制草案。

    2. **核心机制的事实基础薄弱**：primary_suspect 自身承认"当前Vossen元分析……方向性不确定（存在亚组差异）"，并据此把 L4 自动降级为 candidate。但 candidate 状态本身在 L4 评分卡下应判 rejected 还是 needs_revision？这是边界，但鉴于 (a) 案例库只有两个（自承"远未达标"），(b) 反向失败模式已激活，(c) 涌现论证薄——判 needs_revision 而非 verified 是必须的。作者自己也声明"candidate而非verified"且"两条路径任意一条成立则自动降级"——但 candidate 推论不应判 verified，必须先 revised 到 verified 条件。

    3. **反例猎捕未发现 L4 级净杀**，但发现一个**揭出过度伸张**的关键案例：1991 Anita Hill + 2017 MeToo 实质上是同一议题（职场性骚扰）的两次跌宕。如果把 1991 → 2017 整段视为 MeToo 的"长反向前奏"，那么 L4 声称 MeToo 是"数字时代特有模式"的对照是 corrupt——前数字时代已经出现过一次"通胀→紧缩→沉淀→通胀"的宏振荡（25 年间），只是被作者切碎成"Anita Hill 慢回弹例 + MeToo 快振荡例"分别处理。这是对案例时间分辨率的自由选择，需要明确预注册时间窗口。

    L4 当前处于"自承仅 candidate + 反向失败模式已激活 + 案例库不足"的状态，按评分卡不应越过 needs_revision。
  red_flags: |
