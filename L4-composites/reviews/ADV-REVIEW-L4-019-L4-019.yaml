    L4 专属：
    14. 观众砖 — **部分命中**。移除 DED-041，"双引擎"还有"快传播单引擎"——能描述MeToo通胀加速，但不能描述"快反弹"为何快。DED-041 是承重砖。移除 DED-025，"低共情→易退出"还能单独成立，但不能解释"为何数字时代通胀也加速"。两者都不是纯观众砖。但详见红旗16——多父合力的"涌现格"判空薄弱。
    15. 平凡合取 — **部分命中**。"快传播+低共情=双引擎加速"可被理解为"同一外生变量同时加速两个父推论的速度参数"。L4 要从这平凡合取中脱出，需要证明两条支路存在**非线性交互**（例如通胀峰值降低旁观者共情，从而进一步加速下一次通胀的"反弹后回调"——一种正反馈）——目前未提供。
