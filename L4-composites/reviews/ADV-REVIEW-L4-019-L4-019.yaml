    17. 弱父前提 — **未命中**。DED-025 verified，DED-041 verified，BR-L2-014/018/019/025 全部 verified 或 verified*。
    18. 锚点偷窃 — **未命中**。MeToo 的"快涨快退"作为复合锚是 OK 的——它要求快传播支路（已锚）和低共情支路（机制级）和振荡形态（涌现级）都被同一案例支持。
    19. 交互测量缺口 — **命中**。"振幅比"和"时间常数比"区分数字 vs 前数字时代，这是测得到的。但"通胀峰值 → 共情进一步下降 → 更快退出"这条正反馈回路——L4 涌现的核心机制——目前没有任何案例试图测量。这是一个被遮蔽的交互测量缺口。
    20. 声明类型-证据标准错配 — **未命中**。candidate 状态与声称匹配。
  counterexample_hunt: |
    猎捕目标：父推论 DED-025 与 DED-041 都成立，但**交互**不产生L4预测的"锯齿振荡"的案例。

    **猎捕1：瑞士/北欧长期道德变化的"前数字时代长周期振荡"**——按DED-025+DED-041的数字时代框架，前数字时代预期"慢传播+完整共情→长周期低振幅"。瑞士 1970s 反核运动（快传播、自组织上街）后 1990s 政策落定，但 2011 福岛后又出现第二波反弹——这是"慢共情≠消解反弹"的反例吗？**消化结果**：边界案例，反核运动涉及结构性制度（能源政策），制度化后的反弹由"制度成本"驱动，非L4射程范围内的"未被制度化社会规范"。

    **猎捕2：1991 Anita Hill → 2017 MeToo 跨 26 年的两次跌宕**——把这两段视为同一议题的两波。1991通胀（电视）→ 1990s紧缩（Clinton-Lewinsky等"反MeToo前夕"反叙事）→ 2017再通胀（数字）→ 当前紧缩。作者把这段切成"前数字时代长周期慢回弹"+"数字时代快振荡"两个独立案例处理。**结果：揭出过度伸张**。这其实是一个跨越媒介世代的长程振荡，数字时代的"快振荡"只是同一长振荡在数字放大器下的高分辨率切片。如果按25年窗口测量 1991→2017，振幅比与周期数并不小于 MeToo 单周期的快振荡——只是被作者的时间切片选择掩盖了。这削弱了 L4 声称的"数字时代特有"。

    **猎捕3：1960s 民权运动**已在 review 中消化，射程边界处理得当。

    **猎捕4：LGBTQ+ 权利运动 1970s→2010s→2020s**——这是"快传播+低共情"格的潜在测试。Stonewall(1969)通胀慢→艾滋病危机(1980s)紧缩→同性婚姻合法化(2015)再通胀→当前反DEI反弹(2020s)再紧缩。这是数字时代前的"三段式长振荡"，还是数字时代的"快反弹"？**结果：被消化**。L4 已限定射程为"未被制度化部分"，同性婚姻属制度化议题（已立法），按判据射程排除。这是为了不让反对案例破坏L4，但也减少了L4可证伪的范围。

    **猎捕5：反吸烟运动的"长周期振荡"**——1964 Surgeon General 报告至 1990s 全面禁烟。L4 框架下这是"快传播+慢回报（制度化抑制）"——制度化阻止了 L4 预测的振荡。但 2020s 出现电子烟反弹（Juul 风波），这是数字时代+部分去制度化的反弹吗？**结果：边界**。烟草议题属"健康/监管"子领域，非文化战争子领域，按作者射程声明属跨子领域待验区。这强化了"射程收紧是必要的，但也是限制"的双刃剑——L4 在保护自己的同时暴露了它尚未跨越的边界。
  required_fixes:
    - "1) 多父逐格判空强化（必要性强补）：在 2×2 格\"高振幅振荡\"格中，明确区分\"同一外生量驱动的速度缩放\"与\"涌现频率成分\"；若无法区分，须证明\"通胀峰值 → 共情进一步下降 → 更快退出\"的正反馈回路（哪怕仅是机制草案 + 一个间接观测签名如\"通胀峰值后30-60天的共情量表再下降\"）。"
    - "2) Anitа Hill-MeToo 跨世代案例的处理：在诚实标注中明确把 1991-2017 视为单议题长程振荡，并对\"数字时代特有\"声称加一个时间窗口预注册（如\"数字时代=2010-2025\"），在此窗口内外的振荡振幅比对比作为独立检验。"
    - "3) primary_suspect 的进一步分离：即使无面板数据，也应给出\"区分机制(a)与机制(b)\"的第二个独立签名（如：比较信息行业 vs 制造行业的 MeToo 反弹速度——前者高数字媒介使用，应有机制(a)加成），而不是仅靠机构法律风险做单变量分离。"
    - "4) 子领域射程的反例预设：预注册一个\"非文化战争子领域\"的具体议题（如企业 ESG 中的反漂绿运动、AI 安全的开源 vs 闭源辩论）作为射程边缘案例，承诺如果在 3 年内观测到锯齿振荡则扩张射程，反之则确认边界。"
    - "5) 把\"目前仅 2 例干净振荡\"具体化：明确写出 N≥10 的\"案例准入判据\"——什么算\"干净\"？振荡周期边界、传播速度阈值、反弹幅度阈值——这些判据必须预注册而非事后调用，以防止 cherry-picking。"
  oneline: |
    作者 r4 已基本清掉技术性红旗，但 L4 的"涌现"仍是同一外生量驱动的速度缩放而非真正的非线性新形态，且 candidate 状态 + 反向失败模式已激活 + 仅 2 例核心案例，使 verified 不可及；判 needs_revision。

round_6:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 6, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心焊接叙事（DED-025通胀-紧缩动力学 + DED-041具身共情削弱 → 数字时代道德锯齿振荡）在概念层有真实内容，但距离 verified 仍有三道硬门：

    1. **涌现的"焊点"被前轮审查反复补强但仍偏弱**：第5格（快传播+低共情→锯齿振荡）的涌现必须依赖"通胀峰值→共情进一步下降→更快退出→更深紧缩"的正反馈回路。作者在r5加入了"通胀峰值后30-60天共情量表再下降"作为可观测签名，但这个签名本身要么（i）需要DED-041之外的额外机制（即通胀事件本身就改变共情，而不只是数字媒介使用时长改变共情——这把"数字激发共情"假说或"道德疲劳"机制偷渡进来），要么（ii）沦为循环论证（用共情削弱来解释共情削弱）。这是 genuine required 缺口，不是措辞可消解。

    2. **primary_suspect 仍指向法律风险（机制b），不是具身共情削弱（机制a）**：作者自己执行的初步分离尝试（NYT报道汇编、t检验 p=0.03）显示"法律风险高组去零容忍化更快"，这恰恰偏倚支持(b)机制而非(a)。这意味着L4的核心新颖主张——"低共情驱动振荡"——目前的实证证据是反向的。元分析Vossen(2022)总体效应为负但方向性不确定+相关非因果，作者诚实降级到candidate。这是诚实的，但candidate状态本身就不达verified。

    3. **案例库N=2仍远低于自设门槛**：作者自设"N≥10例干净振荡+覆盖≥10年"作为candidate→verified升级条件，当前仅MeToo+JK Rowling两例，且JK Rowling案例的"振荡"（通胀→紧缩→反弹）证据强度中等（没有跨数据源交叉验证、没有独立量化振幅比/时间常数比测量）。这条不是新缺陷，是门槛自设但未达，不能verified。

    另外反例猎捕发现一个净杀型压力点：**MeToo的"反弹"本身是否真的是"道德标准回落"而非"叙事热度回落"**？如果回弹是公众注意力转移（叙事疲劳），而非道德内化标准的真实下降，那么"道德振荡"的因变量本身就是叙事热度，不是道德标准。这就把L4的因变量从"道德规范严格度"悄悄换成"叙事热度"，违反测量轴正交——这是一个潜在的DED-007型陷阱，目前没有被作者主动注册为失效条件。

    不判rejected是因为：（a）核心焊接叙事在概念层有真实内容（快传播+低共情→振幅放大是有机制基础的）；（b）所有缺陷是定向可修的——补正反馈回路的独立证据、重新审视因变量测量、或干脆把candidate降级到N=10门槛达标前都诚实标注为"理论可能性"。
  red_flags: |
    1. brick=conclusion — 未命中。DED-025+DED-041各自单独不预测"锯齿振荡"，焊接后产生新预测（振幅比/时间常数比在数字时代vs前数字时代的差异），有真实涌现。攻不穿。

    2. 逐格判空 — 部分命中。第5格（快传播+低共情→锯齿振荡）需要正反馈回路（通胀峰值→共情进一步下降）才能避免平凡合取。作者在r5加入了间接观测签名，但该签名要么需要额外机制、要么循环论证。核心涌现主张未完全独立支撑。

    3. 测量轴正交（DED-007死因） — 命中。MeToo"反弹"的因变量测量有陷阱：如果"反弹"实际测的是叙事热度/公众注意力（用Google Trends/媒体覆盖量衡量），而非真实的道德标准严格度（用第三方惩罚意愿/政策采纳率衡量），则自变量（数字传播）和因变量（叙事热度）共用数字媒介使用量作为底层测量，焊死在数字媒介这一共同载体上。这是一个潜在的DED-007型陷阱，但没有被作者注册为失效条件。required。

    4. 射程/排除钩子独立于结果 — 未命中。射程限定为"未被制度化的道德标准漂移"，且"制度化"判据已预注册（立法/行政法规/合同条款），在数据收集前锁定。Anita Hill、BLM、MeToo子领域的射程裁决有方向性但已声明反向口径。可接受。

    5. 分类判据档位匹配 — 未命中。振幅比、时间常数比均为连续量，作者用了连续标量+预注册边界口径，档位匹配。攻不穿。

    6. anti-talisman真兑现 — 部分命中。"干净振荡"案例准入判据已预注册（5条判据：传播速度、共情水平、周期、反弹幅度、非制度化），前数字时代窗口（2010-2025）已预注册。但"反弹幅度≥0.3"的阈值在MeToo和JK Rowling案例上是事后拟合还是事前锁定？需要作者明确是prior to observation。这是should级。

    7. 现实锚事实核查 — 部分命中。MeToo的"零容忍政策反弹"叙述需要核对具体年份/机构数量，目前作者给的是"1-2年vs3-5年"的初分离结果，p=0.03但未控制机构规模/行业/公众关注度。这一初步结果不应作为"初步支持(b)机制"的强证据——p值在未控制混淆的小样本中是脆弱的。should级。

    8. 条件是下定义还是做预测 — 未命中。"快传播"（≤30天百万级曝光）和"低共情"（<20百分位）都是可观测的事前阈值，不是定义性条件。攻不穿。

