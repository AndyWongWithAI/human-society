    2. 逐格判空 — **部分命中**。2×2 格(快传播,低共情)的"高振幅振荡"可被消化为同一外生变量的速度缩放，非真正涌现。详见 VERDICT_NOTE 第1条。
    3. 测量轴正交 — **未命中**。传播速度和数字媒介使用时长的数据源已分离（平台API vs 面板调查），振幅比/时间常数比口径已预注册。
    4. 射程/排除钩子独立于结果 — **未命中**。"制度化"判据已预注册，BLM混合案例已按判据分割处理。
