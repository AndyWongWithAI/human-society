    (b) 裁判权：既非数字网络也非实物金网络——按DED-027自身原理，权重
    由竞争发生地网络的特征外生决定，金与数字资产同台竞争的网络是储备
    配置网络，其特征可独立于胜出者观测（冻结事件/COFER换手/披露制度）。
    r0"以数字网络特征为全体候选定权重"系统性偏向挑战者主场，已撤回。
    (c) worked example【已实跑，诚实记录】：BTC vs 金全六维打分（含
    修正后耐久性/同质性测量），秩级为{网络可携带性,可验证性,供给稳定性}
    =秩1、耐久性=秩3、同质性=秩4、可分性≥5，同秩取算术平均（预注册），
    δ=0.1。结果：中位输入下秩级1差距0.20>δ→BTC胜出；可辩护保守输入
    （矿池集中/审查风险/安全预算折价取下界、金托管取上界）下秩级1差距
    0.034<δ→进入秩级2耐久性→金1.0 vs BTC 0.55→金胜出。裁决对秩级1
