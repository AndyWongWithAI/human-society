      (e) 证伪条款(b)(c)——同样不依赖(a1)，有近期独立检验面。
      (f) (a2)机构配置——距触发差1国，是干净的二值未来事件，(a1)不满足
      不改变(a2)的可判定性。
      (g) DED-029原始预测（C3→金价↑）在(a1)不满足期间仍为最优可用预测——
