id: ADV-REVIEW-L4-013
target: L4-013
date: 2026-07-15
type: adversarial_review
layer: L4-composites

人话摘要: |
  L4-013 说的是"数字资产可能在下次信用危机里抢走原本流向黄金的避险钱"。第一轮独立
  审查的结论：这条推论诚实得罕见（自己标注了射程扩展、证据薄、检验窗口在未来），
  条件结构和二值化触发也吸取了 L4-009 的教训，反例猎捕没有猎到净杀。但打穿了五处
  必须修的洞：(1) 六维权重重排协议冒"继承 DED-027"之名，实际偷换了权重判据——
  DED-027 按网络特征定权重，本条按"候选间差异化程度"定权重，这是两种不同原理，
  且"数字网络的特征说了算"这一裁判权分配本身偏向挑战者主场；(2) 数字耐久性的测量
  掺入了节点/开发者网络规模——那是接受度(E_network)的代理，恰好违反本条自己
  anti_talisman 第 4 条坚持的"物理筛选 vs 网络正反馈"防火墙（DED-007 型焊点）；
  (3) "数字资产同质性≈1.0"是事实错误——透明账本资产有污染币折价/黑名单问题，
  熔炼后的金反而更同质；(4) 机构级配置的"当前基线=0"在美国战略比特币储备（2025.3
  行政令、财政部持有）与不丹主权基金持仓已存在的世界里属可争议口径，边界必须事前
  裁决而非事后选边（L4-009 判例）；(5) claim_type=phase_transition 要求阈值两侧
  案例对比，而阈值另一侧的案例集当前为空集，且全部三个锚点都没有展示两父机制的
  可观察交互（Rule G 的诚实标记缺失）。判 needs_revision，5 required + 3 should。
  第二轮独立审查（round 2，全新上下文）核验五条 required 全部真实消解，但独立
  复算暴露两个新的口径级硬洞：(1) 打分裁决不仅对三个争议评分敏感，对"耐久性排
  第几级"这个结构选择更敏感——把耐久性提进第一梯队后连中位输入都翻成金胜，而
  现行排位理由只有一句话；(2) 评分带内取哪个点没有事前规则——中位输入比特币胜、
  保守输入金胜的现状下，"挑战者得分是否超金"这个开关在未来任何时点都掰不动，
  一锤定音的证伪格进不去也出不来。再判 needs_revision，2 required（RF-6/RF-7，
  修复方向唯一：保守角取值+跨秩位稳健）+ 3 should。

round_1:
  round: 1
  reviewer: "独立对抗审查者 (全新上下文, round 1, 与作者无关)"
  date: 2026-07-15
  verdict: needs_revision

  verdict_note: |
    核心未塌：条件命题结构完整（前置条件×触发窗口×份额预测），证伪条款 (a) 是真的
    一锤定音格，anti_talisman (5) 自带 20 年降格自毁开关（波普尔式诚实），二值化
    触发判据（≥1% 冻结事件）连同分子分母一次性注册（吸取 L4-009 教训），反例猎捕
    无净杀——SDR/1980 白银/2022 比特币三个候选反例全部被预注册判据干净消化，
    且消化路径不是事后开脱而是事前判据（对手方风险分类/前置条件未满足）。
    但 verified 不够格：权重重排协议的独立性（本条自认的 primary_suspect）经检验
    确实存在比作者自认更具体的三处硬伤（判据偷换/E_network 焊点/同质性事实错），
    加上口径注册缺口与 Rule G 复合特有锚点缺失。全部可定向修复，列 5 required。

  # ============================================================
  # 通用红旗 (1-11) — 逐条攻击
  # ============================================================

  standard_red_flags:
    1_brick_conclusion:
      verdict: pass
      note: |
        非平凡内核——"数字网络系统性重排六维权重方向 + 信用重定价窗口把赢家通吃
        从代际尺度压缩到窗口尺度 → 下次危机增量非主权SOV需求不再理所当然归金"——
        逐一对照承重砖：BR-L2-021 是商品物理筛选的静态框架，无数字域、无权重重排、
        无窗口概念；DED-027 自宣射程止于商品货币时代且其预测(iii)只设想单维度供给
        冲击（电解铝），未设想交换介质本身改变导致全六维测量标准重排；DED-029 把
        非主权SOV候选池简化为金单元素，其 formal statement 只说 C3→金价↑，确实
        未断言唯一受益者。核心命题不在任何单砖中原文或近义存在。通过。

    2_cell_empty_prediction:
      verdict: pass_with_concern
      note: |
        招牌空格（预测iv：挑战者合格+窗口打开+金捕获>80%且挑战者<5% 预测为空）
        是真经验主张——不被任何砖平凡强制（DED-029 的默认预测恰好会填上此格，
        故此格非空恰恰是 DED-029 单父世界的预期，本条断言其空是真赌注）。非同义反复。
        concern（归入 RF-4）：预测(ii)的成功线是 >20%，证伪格的死线是 <5%——
        中间带（挑战者捕获 5–20%）的裁决后果未注册。若现实落在 10%，预测(ii)
        字面失败但证伪条款均不触发，这个未注册带在事后必然引发"算部分成功还是
        算失败"的口径之争。按 L4-009 判例（歧义反向裁决），必须现在注册：
        中间带 = 预测(ii)被推翻（份额模块降格），核心机制（分流存在性）另由
        <5% 死线单独裁决。

    3_measurement_orthogonal:
      verdict: needs_revision
      severity: required
      note: |
        主轴正交性表面成立：六维得分禁由市值/央行采用反推（anti_talisman 1/4），
        重定价期由冻结事件独立编码（anti_talisman 2），需求份额由需求侧数据计算
        禁由价格反推（anti_talisman 3）。设计意图正确。

        但实测出一个 DED-007 型焊点【required】：耐久性的数字测量标准=
        "协议存续概率估计（基于协议年龄/Lindy效应+开发者/节点网络规模+抗攻击历史）"
        ——【开发者/节点网络规模是采用度的直接函数】。节点数随接受者网络扩张而增长，
        它就是 E_network 的物理代理。把它写进六维得分，意味着自变量（物理/技术
        固有属性得分）偷用了结果侧变量（网络接受度）来测——这恰好违反本条自己
        anti_talisman 第 4 条用来划界的核心原则："市值/价格反映的是 E_network 的
        现状而非物理/数字属性的固有得分——这正是 DED-027 框架区分'物理筛选'与
        'E_network 正反馈'的核心贡献，不得在此混淆"。节点/开发者规模与市值的
        混淆程度是同一数量级的。后果：挑战者的 E_network 越大→耐久性得分越高→
        "六维得分超金"的前件被结果部分决定→赢家通吃的检验被软循环污染。
        修复方向：耐久性测量剔除采用度衍生量，只保留采用度无关成分（协议年龄、
        抗攻击历史事件记录、密码学假设的数学强度、私钥安全模型的技术结构），
        或显式承认耐久性维度在数字域不可去 E_network 化并把它移出前件得分、
        单列为已知混淆。

        次级问题（归入 RF-4）：demand_migration 分子的"链上数据中标记为'机构/主权'
        地址的净流入"——标记方法论（哪家标记源、判定规则、误标率）完全未注册，
        而链上地址标记业界现状是启发式+传闻混合，且标记行为本身受价格叙事影响。
        测量轴的独立性在此未被落实为可执行口径。

    4_excluded_outcomes:
      verdict: pass
      note: |
        五条排除全部按事前可测渠道划：价格点位（份额vs价格的被预测量类型区分）、
        数字资产间内部竞争（候选池层级区分）、CBDC（对手方风险≈0判据，资产的
        技术/法律结构事前可判）、存量替代（增量vs存量，DED-030存量厚度独立事实）、
        平稳期竞争（C1/C3通道区分，事前可识别）。CBDC 排除尤其干净——用的是
        与分母构建同一把对手方风险标尺，无事后开脱结构。通过。

    5_classification_bin_match:
      verdict: pass
      note: |
        重定价期用二值化离散事件触发（≥1%冻结/排除），机构配置用二值化门槛
        （≥2国+>0.5%）——被救对象是"窗口打开/关闭"与"前置条件满足/未满足"的
        离散判定，二分档位匹配。对连续缓变情形（渐进信用侵蚀、渐进配置）的漏判
        风险在 limitations 中诚实标注为边界情形而非被强行塞进二分。窗口关闭
        条件（解除+2年 或 存续+3年购金回落±1σ）也已注册。吸取 L4-009 判据
        复杂度教训的简化是真实的。通过。

    6_anti_talisman:
      verdict: pass_with_concern
      note: |
        五条护身符条款方向全部正确，第(5)条的 20 年不可检验→主动降格条款是
        全体系罕见的自毁开关，加分。第(2)(3)条的"自变量不由金价/数字资产价格
        反推"有可执行的独立数据源（冻结公告日期+规模、WGC吨数、披露文件）。

        concern（归入 RF-1）：条款(1)(4)要求六维得分事前独立标定，但整个推论
        文件从未对任何现实候选（如比特币 vs 金）实际执行过一次注册协议下的
        完整评分——协议的可执行性与非空洞性（能否在某些现实输入下输出"金胜出"）
        均未演示。counterexamples 第一条自己承认"比特币的六维得分是否系统性
        超越黄金是一个需要按 weight_protocol 独立评估的问题…存在争议"——
        承重前件处于"已注册但从未运行"状态。若协议一运行就注定挑战者胜出
        （见红旗8），护身符(1)(4)形同虚设。修复：提交一份 worked example
        （比特币 vs 金的全六维打分+rank比较），并展示协议存在输出"金胜出"
        的现实输入区域。

    7_real_world_anchor_fact_check:
      verdict: needs_revision
      severity: required
      note: |
        核对通过的事实：2024年1月SEC批准11只现货比特币ETF——属实；ETF累计净流入
        超数百亿美元——属实；2022年2月G7冻结俄央行约3000亿美元（约占全球官方储备
        2.5%）——属实；2022–2024央行净购金连续三年超1000吨——属实；1979年美国冻结
        伊朗央行约120亿美元（约占当年全球官方储备3%）、金价$200→$850——属实；
        萨尔瓦多情形的排除理由（美元化经济、无独立储备管理框架）——可辩护。

        两处事实性问题【required】：
        (i) "当前基线：0"（机构级配置）在本文件写作日（2026-07）是可争议口径而非
        干净事实。已存在的边界案例至少有二：美国战略比特币储备（2025年3月行政令
        设立，财政部持有、来源为罚没资产，规模约20万枚），与不丹主权基金
        DHI（Druk Holding & Investments）多年挖矿累积的比特币持仓（相对不丹官方
        储备规模占比远超0.5%）。前者卡在"财政部≠央行/主权财富基金"的机构口径上，
        后者卡在"披露渠道是否算官方披露"与"主权基金持仓是否计入官方储备资产"上。
        文件只裁决了萨尔瓦多，对这两个更近的边界案例只字未提，且"基线=0"的裁决
        方向恰好推迟本条的检验窗口——按 L4-009 判例，未事前注册的边界口径若在
        事后按有利方向定死，一律反向裁决。必须现在注册：财政部形态的战略储备
        算不算"主权国家层面的储备管理者"、主权基金非COFER渠道披露算不算
        "公开披露"，并据裁决重述基线。
        (ii) "同质性：数字资产≈1.0，金≈0.9"——方向性事实错误。透明账本资产的
        每一单位携带全部历史：被盗币/受制裁地址关联币被交易所冻结、场外折价
        （污染币折价）、监管黑名单（如2022年对混币协议的制裁）是已记录现象；
        而熔炼后的金物理上不可追溯、完全可互换。按本条自己的定义（"任意两单位
        是否完全可互换"），透明账本数字资产的同质性得分应【低于】金，且同质性
        在数字候选之间（透明账本 vs 隐私账本）恰恰构成差异化维度——连带推翻
        "同质性所有数字候选均近满分→rank≥5"的秩位理由。

    8_definition_vs_prediction:
      verdict: pass_with_concern
      note: |
        宏观上，前件"六维得分超金+获机构配置"是可证伪预测而非定义——机构配置
        是未来事件，得分由注册协议测定。但协议结构有一个准定义化风险（归入RF-1）：
        rank≤2 的三个维度（网络可携带性/独立可验证性/供给稳定性）的测量标准
        全部被重定义为"去信任化/密码学验证/算法化供给"——这些标准本身就是
        成熟去中心化数字资产的定义性特征，金在这三个维度的重定义标准下结构性
        低分（金的所有权验证依赖托管审计=中心化权威）；而金占优的维度（物理
        耐久性、价值密度便携性）或被重定义、或被压到 rank 3–4 以下；加上
        逐级比较在差距>δ=0.1 即终止——只要存在一个成熟的去信任化数字资产，
        比较大概率在 rank 1–2 层终止且挑战者胜。这使"挑战者得分超金"逼近
        "存在成熟去中心化数字资产"的重述——前件的预测性被协议设计侵蚀。
        与红旗6的修复合并：worked example 必须演示协议的非空洞性。

    9_enumeration_exhaustiveness:
      verdict: pass_with_concern
      note: |
        本条未声称新的 N 类枚举，六维继承自 BR-L2-021。主动猎第七维：候选
        "监管/法律可识别性"属制度变量而非物理/技术筛选维度，不构成伞级判据内
        的新种；"交易历史可追溯性/隐私"初看像新维度，实际是同质性维度在数字域
        的正确测量内容（见红旗7(ii)）——不是缺一个维度，是有一个维度被测错了。
        枚举本身守住，测量错误已在红旗7记为 required。

    10_primary_suspect:
      verdict: pass
      note: |
        文件自认的 primary_suspect（权重重排协议的事前可辩护性 + DED-027 射程
        扩展）与本轮审查实际打穿的位置高度重合——RF-1/RF-2/RF-3 全部落在这两个
        suspect 的射程内，自我诊断准确。secondary（机构配置门槛的双向风险）与
        secondary_2（需求窗口的增量/存量结构）定位也合理。未认的软肋（同质性
        事实错、耐久性焊点、口径缺口）属 suspect 射程内的具体化而非更致命的
        未知软肋。平凡化检查：防平凡化守卫的(a)(b)(c)三项承诺中，(b)赢家通吃
        结构预测与(c)计时机制已兑现，(a)"更好的可操作定义"部分兑现（协议已
        注册但未运行且有偷换，见RF-1）——未被稀释成"更好的东西会赢"的常识。通过。

    11_caliber_registration:
      verdict: needs_revision
      severity: required
      note: |
        已注册得好的：重定价期阈值≥1%连同分子（受影响央行资产负债表内被冻结
        储备，窄口径）分母（事件年IMF COFER含未分配储备）一次性注册；0.5%配置
        比例连同分子分母注册；分母的非主权SOV分类判据（对手方风险≈0）事前可
        执行且实操建议自带保守性偏差声明。这部分是全体系口径注册的较好示范。

        三个缺口【required，合并为RF-4】：
        (a) 需求份额测量的部门口径不对称：金的增量份额分子=央行购金+金条金币+
        ETF净流入（官方+私人零售+私人机构全计），挑战者分子=链上"机构/主权"
        标记地址净流入+官方披露增持（私人零售不计，且机构标记方法论未注册）。
        同一被预测量（增量非主权SOV需求分配）两侧用不同部门覆盖面测量，边界
        案例（如挑战者ETF净流入算不算？）未裁决。必须注册对称口径：两侧均按
        相同部门清单（官方储备+私人机构+私人零售可识别部分）构建，并注册链上
        标记的数据源与判定规则。
        (b) 预测(ii)的 >20% 成功线与证伪格 <5% 死线之间的 5–20% 中间带后果
        未注册（见红旗2）。
        (c) 机构配置判据的机构形态边界（财政部战略储备/主权基金非COFER披露）
        未注册（见红旗7(i)）。

  # ============================================================
  # L4 专属红旗 (12-18) — 逐条攻击
  # ============================================================

  l4_exclusive_red_flags:
    12_spectator_brick:
      verdict: pass_with_concern
      note: |
        逐一移除检验：
        移除 DED-027 → 六维筛选裁判标准、赢家通吃收敛动力学、技术冲击换主逻辑
        全部消失，预测(i)(ii)(iii)(iv)全塌。非观众砖 ✓（但其承重是射程外承重，
        见红旗14）。
        移除 DED-029 → 窗口计时器消失，预测(ii)(iii)失去时间锚定，退化为
        "迟早会发生"。非观众砖 ✓。
        concern：DED-029 被【薄用】——其 verified 状态的独有内容（四引擎统一
        E_network通道、四轴测度正交性、U≈0近似）在本条中几乎未承重，实际用到的
        只有 C3 方向（法币信用↓→非主权SOV需求↑），而 C3 的这一步与 L2 砖
        BR-L2-024（"法币信用下降→替代储藏需求变化"）高度重叠——若允许 L2 砖
        当主前提，BR-L2-024 几乎可以顶替 DED-029 的位置（"窗口是候选中性的"
        这一关键延伸本来就是本条自己做的，不是 DED-029 的）。DED-029 不是
        观众砖（E_network 单通道的候选中性论证确实借了它的通道统一性），但
        其贡献厚度接近下限。应在 necessity 中诚实缩窄"DED-029 给触发时机"的
        表述为"DED-029 的 C3 通道+通道统一性给触发时机，其四引擎结构与测度
        正交性在本条中不承重"。should 级。

    13_trivial_conjunction:
      verdict: pass
      note: |
        平凡合取检验：本条是否只是"更好的候选终将胜出(027) AND 信用危机推高
        非主权SOV需求(029)"的AND拼接？拼接版本给不出：(a) 招牌格的方向反转——
        DED-029 在[重定价, 挑战者合格]格的默认预测是"金受益"（其写作语境下
        非主权SOV≈金），本条在同一格预测"分流"——同格不同向，一个覆盖改写了
        另一个，这不是AND能产生的；(b) 时间尺度压缩命题——027的赢家通吃无
        时间参数，029的窗口无竞争者概念，"窗口把决赛轮从代际压缩到数年"需要
        两者拼合后再加一步。诚实性加分：文件自己声明 conjunction（薄涌现）、
        自己标注加速效应"不等同于交互级涌现"、自己声明 state ceiling: verified
        ——没有把薄涌现包装成厚涌现。
        注意：加速效应的"同步唤醒"机制（储备管理者在信用事件后集中审视配置）
        是本条自建的行为假设，非任何父推论所有——文件在 Emergent property 段
        有标注其依赖性，可接受，但它应与"获机构级配置"一样计入自建前提的
        诚实清单（should）。

    14_emergence_missing:
      verdict: needs_revision
      severity: required
      note: |
        【独立多父逐格判空归属分析——审查者亲自重做】
        父推论核心自变量：DED-027 → 六维加权得分排序+网络正反馈（自宣射程：
        商品货币时代自发交换网络，"无中央银行……现代法币体系不在射程内"——
        原文明确）；DED-029 → 四引擎独立测度，本条只用C3（法币信用），输出=
        金价方向。
        2×2（信用体制{平稳,重定价} × 挑战者{≤金/无, >金且获配置}），被预测量=
        窗口内增量非主权SOV需求分配：

        格[平稳, ≤金]：金在位+C1主导。DED-027（在其射程内的类比延伸）与
        DED-029 各自覆盖。平凡格 ✓（与作者一致）。
        格[平稳, >金且获配置]：方向由 DED-027（射程扩展）给出"终将取代"；
        时间尺度定性（慢）是本条借"无同步唤醒→渐进"的自建机制逻辑补的——
        严格说这不是 DED-029 给的（DED-029 无采用时间尺度内容）。作者标注
        "半合力格(0–1父合力)"已算诚实，我进一步压为：0父合力+1条射程扩展+
        1条自建假设。不计入合力格数（作者也未计入）。
        格[重定价, ≤金]：DED-029 C3 单父标准预测。平凡格 ✓。
        格[重定价, >金且获配置]（招牌格）：DED-027 单独不知何时（无窗口概念），
        DED-029 单独在此格给出相反方向的默认预测（金受益）——填此格确需两条
        机制链合力，且是"覆盖改写"而非"叠加"，合力的真实性成立。
        【但】：DED-027 在此格的那条腿站在其自宣射程之外——现代央行储备配置域
        的六维筛选+赢家通吃适用性是未经父推论验证的外推。按 L4-009 round_1
        判例（同样是 DED-027 射程外应用）：此格应标注为【合力格*（带射程外
        星号）】。后果链：
        (1) 本条唯一的合力格是星号格 → 涌现最低门槛（≥1格需≥2父合力）的满足
        依赖于接受"射程扩展作为承重桥接前提"。METHODOLOGY 的
        emergence_to_status_mapping 条件(b)明文允许"核心涌现属性依赖外部理论
        桥接（external_bridge 作为承重前提）"映射到 verified（薄涌现）——
        有先例（L4-005 自建桥接前提诚实标注后成立为 novel composite hypothesis）。
        故不判死，但必须显式走这条通道而非默认通道。
        (2)【required——诚实声明覆盖不足】：Epistemic status (1) 只把"自担赌注、
        不享受 DED-027 verified 背书"的免责范围限定在"预测(iii)涉及挑战者取代
        的部分"。但预测(ii)（>20%分流）、预测(iv)（招牌空格）、以及招牌格本身
        【同样】完全依赖 DED-027 六维筛选+赢家通吃在储备配置域的射程外适用——
        免责声明系统性地少盖了主承重区。必须把射程扩展标注从(iii)扩展到
        (ii)(iv)与招牌格，并在 multi_parent_cells 中给招牌格打上射程外星号、
        显式声明"涌现门槛经由桥接前提通道满足（mapping 条件b），故 state
        ceiling 为 verified（薄涌现）而非 verified*"——这与文件现有 ceiling
        声明一致，但成立理由必须从"conjunction+1格"修正为"conjunction+1星号格
        +桥接前提"。

    15_weak_parent_premise:
      verdict: pass
      note: |
        DED-027 verified、DED-029 verified，均非 candidate，CAP=3，ceiling
        声明（verified）合规。形式通过。实质弱化（射程外使用/薄用）已分别在
        红旗14/12处理，不重复计。

    16_anchor_theft_and_composite_anchor:
      verdict: needs_revision
      severity: required
      note: |
        锚点逐个检查：
        - 2022俄储备冻结：这是 DED-029 C3 通道的单机制锚点（且已被 L4-009/
          L4-011 使用）——文件自己也承认它"当前的顶级候选仍是金……仅提供基线
          而非分流演示"。无两父交互。
        - 1979伊朗冻结：同上，C3 单机制的历史复刻+基线。无交互。
        - 比特币ETF获批：展示的是调节变量（机构配置通道）的前驱步骤 + DED-027
          式正反馈在数字域的初现——是单机制（E_network正反馈）演示加通道演示，
          不是"六维筛选×信用窗口"两父机制的可观察交互。其"复合特有性"段落
          的论证（"单用DED-027无法解释ETF制度事件、单用DED-029无法关联需求
          竞争"）是解释框架层面的复合，不是交互产生了可区别于单机制预测的
          【观测结果】。
        结论：Rule G 的两条硬要求（至少一个锚点涉及父机制的可观察交互；至少
        一个锚点中交互产生可区别于单机制预测的结果）均未满足——而这在阈值
        另一侧无案例的现状下【不可能】满足。Rule G 为此留了显式出口："若确实
        找不到复合特有锚点，必须诚实标记'独立锚点：无复合特有锚点，置信度完全
        继承自父推论'——使其脆弱性可见"。文件没有打这个标记，反而给锚点挂了
        moderate/high 置信度标签。修复（廉价但必须）：在 real_world_anchors
        显式加注"无复合特有锚点——全部锚点为单机制演示/基线/通道前驱，复合
        预测的置信度完全继承自父推论+机制论证"，并将比特币ETF锚点的"复合
        特有性"措辞降级为"调节变量通道演示"。

    17_interaction_measurement_gap:
      verdict: pass
      note: |
        复合输出变量（窗口内增量非主权SOV需求在金/挑战者间的份额分配）在类型上
        区别于两父各自的输出（DED-029：金价方向；DED-027：媒介主导度）——它是
        一个真正的复合可观测量，且其测量（WGC需求数据 vs 链上/披露数据，同一
        分母）原则上可与"A单独+B单独"区分：DED-029 单独只预测金侧总量方向，
        DED-027 单独只预测终态归属，份额的窗口内分配只有合成命题预测。测量
        定义存在（口径缺陷已在红旗11处理）。当前不可测（前置条件未满足）是
        前瞻性固有属性，归红旗18处理。通过。

    18_claim_type_evidence_mismatch:
      verdict: needs_revision
      severity: required
      note: |
        claim_type=phase_transition，METHODOLOGY 对应证据标准="阈值两侧案例
        对比证据"。核查：阈值（挑战者六维得分超金+获机构级配置）的【此侧】
        （无合格挑战者）有两个干净基线案例（1979/2022，金独占增量需求）；
        阈值的【彼侧】案例集=空集——文件自己承认（Epistemic status 3：
        "当前尚无数字资产同时满足两个条件……历史锚点只能提供机制演示而非完整
        经验检验"）。即：phase_transition 所宣称的证据标准在结构上只完成了
        一半，另一半在可预见的中期内依赖未来事件。
        裁决考量：前瞻性不自动等于 rejected——本条已注册可证伪条件（含20年
        降格自毁开关）、预测(i)与证伪条款(b)(c)在数字资产竞争现实中有近期
        检验面、逻辑链完整。但 claim_type 字段承诺的证据类型与实际证据基础的
        错配必须显式化，不能靠 verified/candidate 标签外的读者自己发现。
        修复【required，与RF-5合并】：在 claim_type 处或 statement 头部加
        前瞻性标记——"phase_transition（前瞻性）：阈值彼侧案例集当前为空，
        两侧对比证据标准结构性未满足；当前验证状态的经验内容仅覆盖(a)机制链
        与基线侧锚点、(b)预测(i)的方向性框架；核心预测(ii)(iii)(iv)为未来
        窗口检验"——并接受其状态语义上限为"薄涌现verified（机制链）+核心
        预测未经验检"的组合，或维持 candidate 直至 RF-1 的 worked example
        交付。

  # ============================================================
  # 反例猎捕（L4版：猎"父推论都成立但交互不产生L4预测"的案例）
  # ============================================================

  counterexample_hunt:
    methodology: |
      按招牌格的最强证伪形式构造：寻找历史上"存在一个（在当时可辩护的口径下）
      属性得分不低于金的非主权储备候选 + 已获机构级配置 + 信用重定价窗口打开，
      而增量需求仍全部流向金"的案例；同时对预测(i)（权重方向重排）在已发生的
      数字资产内部竞争中找反向案例。

    ce_1_sdr_1979:
      case: "SDR（特别提款权）× 1979-1980 信用重定价窗口"
      analysis: |
        表面上是招牌格的完美历史填充：SDR 1969年创设、1970-72年向全体IMF成员
        分配（远超"≥2主权国家"）、占各国储备比例普遍超0.5%、在多个维度上
        （可分性/同质性/无运输成本）得分不低于金；1979-80年窗口打开（伊朗冻结
        +通胀），若SDR分流了增量需求→本条预测的历史先例；若SDR被完全忽视而
        金独占（事实如此，金$200→$850而SDR配置角色边缘化）→招牌格被填上→
        核心机制被推翻？
        裁决：不构成反例——被本条预注册的分母分类判据干净排除：SDR是对IMF
        成员可自由使用货币的潜在索取权，其价值完全依赖成员方履约承诺→
        对手方风险>0→不属于非主权SOV候选池（与CBDC排除同一把标尺）。
        此消化是事前判据（资产的法律结构）而非事后开脱。净效果：反而演示了
        分类判据的区分力——它能在不知道结果的情况下把SDR和比特币分进不同池。
      status: consumed_by_preregistered_criterion

    ce_2_silver_1980:
      case: "白银 × 1979-1980 窗口——非主权、零对手方风险、六维得分接近金的在场竞争者"
      analysis: |
        白银完全满足非主权SOV分类（无发行方、对手方风险≈0），六维物理得分
        历史上与金接近（曾长期并任货币金属），1979-80窗口内白银涨幅（$6→$50，
        约8倍）甚至超过金（约4倍）。这是否证明"窗口打开时需求流向多个候选而
        非赢家通吃"、从而反驳DED-027逻辑在SOV域的适用？
        裁决：不构成净杀，两点：(a) 白银在窗口前【未获机构级储备配置】——
        19世纪末各国已完成白银的储备退位，1979年无央行以银为储备资产——
        本条前置条件不满足，此格不在预测射程；(b) 白银1980年的暴涨随即在
        Silver Thursday（1980.3）崩塌且从未进入储备资产池——长期看恰是
        "赢家通吃在SOV生态位运作"（金胜出、银被逐出储备角色）的支持性演示。
        净效果：消化为支持。但此案例揭示一个真实张力：白银的百年储备退位
        史说明SOV生态位的赢家通吃时间尺度可以极长（数十年）——给"同步唤醒
        压缩至数年"的自建加速假设提供了一个反向权重（银的退位并未因任何
        单次信用窗口而集中完成）。已在红旗13记为should级诚实标注项。
      status: consumed_as_support_with_tension_noted

    ce_3_bitcoin_2022:
      case: "比特币 × 2022 重定价窗口——父推论都成立、交互未产生分流"
      analysis: |
        2022窗口干净打开（俄储备冻结≥1%判据触发），比特币已存在13年、市值
        曾破万亿美元、六维若干维度得分可辩护地高——而央行增量需求100%流向金
        （连续三年千吨购金），比特币机构级储备配置为零。父推论都成立（C3引擎
        如期运作→金价受益；六维筛选在商品域无恙），交互未产生L4预测的分流。
        裁决：不构成反例——本条预测(ii)是条件命题，2022年两个前置条件
        （六维得分系统性超金的注册协议评估、≥2主权国家配置>0.5%）均未满足，
        检验窗口未打开。文件自己已将此案例注册为基线锚点，处理正确。
        但此案例数出本条的保护带宽度：迄今所有现实事件都落在"窗口未打开"
        保护带内——这不是作弊（条件是事前注册的），但它把全部检验力压到
        未来，正是红旗18错配的经验面。
      status: not_a_counterexample_window_not_open

    ce_4_prediction_i_internal:
      case: "预测(i)方向重排在已发生的数字资产内部竞争中的反向检验"
      analysis: |
        按证伪条款(b)的逻辑在已实现的数字SOV竞争中找反例：胜出者（比特币，
        数字SOV生态位公认在位者）是否在"独立可验证性/供给稳定性"上系统性
        低于被淘汰者？核查：比特币供给上限的算法确定性与治理变更门槛
        （区块大小战争中硬分叉派失败）高于以太坊（供给政策多次变更）、
        高于XRP（发行方集中持有）、高于无上限的模因币——胜出者恰在预测(i)
        声称权重上升的维度上得分更高。方向一致，不构成反例，弱支持。
        注意：这一支持受红旗3焊点的折价——若耐久性/采用度混淆同样污染
        这类回溯归因（比特币胜出也可用先发网络效应完整解释），则此弱支持
        不可升格为独立验证。
      status: weak_directional_support_discounted

    hunt_summary: |
      无净杀。四路猎捕：SDR被对手方风险判据事前消化（且反证判据区分力）、
      白银1980消化为赢家通吃支持但暴露加速假设的反向张力、2022比特币落在
      预注册保护带内、预测(i)在数字内部竞争中方向一致（弱支持，受焊点折价）。
      猎捕的最大产出是结构性确认：招牌格阈值彼侧的案例集=空集，phase_transition
      的两侧对比证据标准当前不可满足（红旗18）；以及白银退位史对"同步唤醒
      数年内完成"的时间尺度假设构成温和反向证据。

  # ============================================================
  # 不重蹈检查
  # ============================================================

  non_recurrence:
    ded004_check: |
      不可证伪循环检查：未重蹈——证伪条款(a)是可执行的一锤定音格（四个条件
      全部有注册口径），anti_talisman(5)的20年降格自毁开关主动限制了"永远
      等下一个窗口"的逃逸；预测(i)与条款(b)(c)在数字资产竞争现实中有近期
      检验面。保护带宽（迄今全部事件落在条件未满足区）是条件命题的代价而非
      循环，已在红旗18计价。
    ded007_check: |
      测量轴焊死检查：【部分重蹈】——耐久性测量把节点/开发者网络规模（采用度
      =E_network的代理）掺入自变量得分，构成"物理筛选得分偷用网络接受度来测"
      的DED-007型焊点，直接违反本条自己anti_talisman(4)的防火墙。可修（剔除
      采用度衍生量），已列RF-2。此外链上机构标记的分子构建未注册方法论，
      有二次焊点风险（标记热度随价格叙事变动），已并入RF-4。

  # ============================================================
  # 裁决
  # ============================================================

  required_fixes:
    - id: RF-1
      fix: |
        权重重排协议去偷换+可执行性演示：(a) 明示当前秩位规则使用的是"候选间
        差异化程度"判据，而DED-027 Step A/B的判据是"交换网络特征→权重"——
