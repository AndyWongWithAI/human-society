      analysis: |
        构造边界操作：将"矿池算力集中"拆分为两个子项——算力集中度Gini系数与
        OFAC合规区块占比。若拆分后的两个子项带宽之和>拆分前的单一带宽[0.7-0.9]
        （带宽=0.2），属于实质性地扩大保护带。裁决：拆分后总带宽缩窄或持平+
        窗口开启前注册→可接受（如r7d边界注记所述）；拆分后总带宽扩大→违反
        r7d。此边界已在本轮rf_resolution_check的RF-7中明确注册，不构成隐蔽漏洞。
        关键判据："带宽"的计量单位是得分范围（0-1标尺上的区间宽度），不是折价
        项的个数——增加折价项数量但总带宽不变不是扩大保护带。
      status: boundary_registered_not_counterexample

    ce_2_gold_already_digital:
      case: "金已通过ETF/LBMA/黄金互换在数字网络中运行——'数字挑战者'的数字化
      优势被夸大"
      analysis: |
        金ETF（GLD等）提供数字化可携带性与可分性；LBMA未分配账户使金以数字
        形式交易；央行间黄金互换实现跨境价值转移而不物理移动。若这些机制使金
        "事实上也是数字资产"，则预测(i)宣称的"数字网络重排权重"对金的冲击
        被高估——金与数字挑战者共享同一数字基础设施。
        裁决：此攻击的致命性取决于对手方风险判据的区分力。(a) 金ETF=托管人
        对手方风险>0→不在非主权SOV候选池（与分母分类判据一致）；(b) LBMA
        未分配账户=银行对手方风险>0→同上；(c) 黄金互换=互换对手方+黄金需归还
        →双重对手方风险；(d) 只有实物自持金（对手方风险≈0）才是与自托管BTC
        对标的形式——而实物自持金的跨境转移摩擦（物理运输成本/海关/保险）正是
        网络可携带性重定义后金结构性低分的根源。分类判据（对手方风险≈0）在
        数金交叉领域中再次经受住边界测试——它将"数字皮肤的金"与"原生数字资产"
        干净分入不同候选池，与本条operationalization的demand_migration分母
        判据完全一致。
      status: consumed_by_preregistered_counterparty_risk_criterion

    ce_3_prediction_i_counter_hunt:
