      (r7a)保守角规则——挑战者取带下界×金取带上界：这是全盘不利于本条的方向。
      核验：BTC网络可携带性下界0.7（矿池集中+OFAC区块）、供给稳定性下界0.8
      （安全预算）、耐久性下界0.5（量子不确定性）；金网络可携带性上界0.6（本国
      金库）、可验证性上界0.8（本国金库+化验）——每个边界均由具名可观测折价项
      锚定。规则关闭了"中位vs保守"的事后选边空间。
      (r7b)跨结构规则——保守角下结构I与结构II双跑，均胜才判满足：此规则与r7a
      复合后，结构I保守（金胜出）当场判(a1)不满足，连结构II都不用等。纯冗余保护。
      (r7c)"系统性超越"操作定义=跨分歧带稳健×跨秩位结构稳健：将模糊词"系统性"
      替换为可执行判据，关闭了"部分维度超越=系统性超越"的语义拉伸空间。
      (r7d)分歧带纪律——边界由具名折价项事前锚定+禁事后增删调宽+新折价项仅可在
      窗口开启前注册：这是L4-009判例精神的直接适用。现有折价项（矿池集中/OFAC
      区块/安全预算/托管审计）均为2026-07前已记录的独立现象。

      一个边界压力测试（主动猎捕规则漏洞）：r7d禁止"新增/移除折价项或调整带宽"——
      但"精细化"现有折价项（如将"矿池算力集中"拆分为"算力集中度×审查阻力指数"
      两个子项）属于新增还是精细化？裁决：若拆分后的总带宽>拆分前，属实质性调整带宽
      →违反r7d；若拆分仅重新分配带宽（总带宽不变或缩窄）且发生在窗口开启前→可接受。
      此边界当前无实际争议（尚无窗口开启前需要执行此操作的情境），注册为r7d的
      边界注记即可，不构成required洞。

      结论：(a1)在2026-07按r7a-r7c判【未满足】——是一个干净、可判定、事后不可
      争议的读数。证伪条款(a)一锤定音格的前件(a1)恢复可判定性——未来时点按协议
      执行即得唯一裁决，无带内取值或结构选择的自由度残余。RF-7完全消解。

      【程序披露从严检查——同一整改者跨轮立场偏差】：r7a-r7d全部四条规则的方向
      均不利（con）——保守角不利、跨结构双跑不利、"系统性"定义收窄不利、分歧带
      纪律不利。若整改者存在"保住自己r1方案"的立场偏差，最自然的做法是在r7d留下
      "折价项幅度可酌情调整"的后门，或把"系统性"定义为"多数维度超越"。实际四条
      规则均无此后门——立场偏差在此整改轮次中未被检测到。

