    ce_1_network_segmentation:
      case: "地缘阵营分割：f1暴露度异质→储备配置网络可能不是单一权重向量的连通网络"
      analysis: |
        f1（对手方风险）在现实储备网络中暴露度高度异质：美元体系盟友国
        （日/欧/韩等）面临的冻结风险≈0，非阵营国（俄/伊朗型）风险显著。
        若网络按阵营分割为两个局域网络，各自f1权重不同→按DED-027自身
        原理（权重由局域网络特征决定）可能各出各的胜者→金与挑战者分段
        共存，既不违反赢家通吃（各局域网络内仍单一主导）也不产生本条
        预测的全局分流格局。这攻击的是"单一储备配置网络+单一f1–f5向量"
        的隐含前提。
        裁决：不构成净杀，三点：(a) 证伪条款(c)已带"在一个连通的全球
        储备配置网络中"限定词——分割情形被事前排除出(c)的射程，且阵营
        分割可独立观测（制裁清单/互换协议网络），非事后开脱；(b) 分割
        情形下预测(ii)的读数（全球增量份额）仍可执行——分段共存会表现
        为挑战者捕获份额介于5–20%（非阵营国配置挑战者），落入已注册的
        中间带裁决（份额模块被推翻但分流存在性存活）——本条对此情形
        并非无言；(c) 桥接前提的失稳风险（制度性协调vs自发选择）已注册
        为primary_suspect(2)，本案例是其具体化。
        净效果：无净杀，但揭示"单一权重向量"是桥接前提的隐含加强版——
        已并入SF-6建议登记。
      status: no_net_kill_registered_as_bridge_premise_sharpening

    ce_2_rank_structure_stress:
      case: "协议级猎捕：耐久性秩位的对抗性替代方案翻转中位裁决"
      analysis: |
        对协议本身做对抗性压力测试（前件测定协议是承重口径，协议级反例
        等价于测量轴反例）。构造可辩护替代秩位：f2（持有期十年–百年尺度）
        同时驱动供给稳定性与耐久性——对代际持有者，"协议还在不在"与
        "供给规则稳不稳"至少同级重要，甚至前者更基础（协议死亡=供给规则
        无意义）。将耐久性并入秩级1后重跑worked example：中位输入
        BTC 0.825 vs 金0.7875，差距0.0375<δ→秩级2同质性金0.95 vs 0.75，
        差距0.20>δ→【金胜出】。即：在同样由f2驱动、论证强度不弱于现行
        方案的替代秩位下，协议连中位输入都输出金胜。
        裁决：这不是对推论核心机制的净杀（权重重排方向性预测(i)不受
        影响，条件命题结构不受影响），但它净杀了"(a1)裁决仅对秩级1三个
        评分敏感"这一敏感性声明的完备性——实际敏感面=评分带×秩位结构。
        已列RF-6。
      status: kills_completeness_of_sensitivity_claim_not_core

    ce_3_sovereign_adjacent_challengers:
      case: "边界猎捕：代币化黄金/主权金币数字凭证——'数字得分+金的耐久性'的杂交候选"
      analysis: |
        若出现广泛采用的代币化黄金（数字凭证+实物金背书），它在网络
        可携带性/可分性上取数字得分、耐久性/同质性上取金得分——岂非
        协议下的必胜候选？若它胜出，算"数字挑战者分流金需求"还是
        "金以数字皮肤继续在位"？分类未注册？
        裁决：不构成反例——被既有分母判据事前消化：代币化黄金的价值
        依赖托管方履约（实物赎回承诺）→对手方风险>0→不属于非主权SOV
        候选池（与USDT/USDC稳定币同一把标尺，operationalization原文
        已含"由中心化实体发行/管理的数字资产不计入"）。完全去中心化
        且无托管背书的"合成金"不存在实物赎回，则其耐久性/同质性得分
        回落为纯数字资产得分，杂交优势消失。判据区分力再次经受住
        边界测试。
