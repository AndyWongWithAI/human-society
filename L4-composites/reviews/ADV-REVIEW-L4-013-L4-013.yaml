      analysis: |
        r1 ce_4只在BTC vs 被淘汰者方向验证了预测(i)（BTC在可验证性/供给稳定性
        上高于被淘汰者）。本轮专攻反向：若隐私币（Monero/Zcash型，同质性≈1.0、
        网络可携带性≈1.0——不可审查、不可冻结）在数字SOV生态位中获得显著份额，
        则：它在预测(i)声称权重上升的维度（网络可携带性/可验证性）上得分高于
        BTC（透明账本的可审查性构成网络可携带性的折价），但预测(i)并未预测
        隐私币会胜出BTC（因为BTC的先发E_network锁定可能压倒纯物理得分优势）。
        裁决：这不构成对预测(i)的反例——预测(i)只声称"权重重排的方向"（哪些
        维度权重↑），不声称"得分最高的候选一定胜出"（那是DED-027赢家通吃的
        预测，且E_network锁定时间尺度>短时窗口）。在2026-07，隐私币在数字SOV
        生态位的份额远低于透明账本BTC——若未来隐私币凭借其网络可携带性优势
        显著侵蚀BTC的份额，反而是对预测(i)方向重排的支持（权重上升的维度上
