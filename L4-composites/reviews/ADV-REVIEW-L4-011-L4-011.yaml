id: ADV-REVIEW-L4-011
type: adversarial_review
reviews: L4-011
layer: L4-composites
target: L4-011
date: 2026-07-15

人话摘要: |
  对 L4-011（主权信用事件的储蓄端传导链，status=candidate）的 round_1 独立对抗审查。
  裁 rejected。三处核心塌陷：(1) 唯一的现代完整事件窗口（2022 俄储备冻结）按推论
  【自己注册的】私人需求口径（金条金币+ETF 合计）测量，私人峰值在 2022 Q1（约 551 吨，
  含 ETF 净流入 269 吨），官方峰值在 Q3（459 吨），τ=−2——正中 falsifiability (b)
  预注册的"一锤定音——时序反转"净证伪条件；锚点里 τ=0 的读数是丢掉 ETF、只用金条金币
  算出来的，违反自身操作化定义，按 L3 评分卡第 11 条（事后口径选择反向裁决）不得改口径
  自救。(2) 1979 锚点事实错误——官方部门在 1979-1980 事件窗口是净卖方向（美国财政部
  拍卖至 1979 年 11 月、IMF 拍卖至 1980 年 5 月，总体官方持金量下行），"央行从净卖家
  转净买家"不成立；三个历史触发窗口呈三种不同时序（1971 官方需求先于事件、1979 私人
  先行、2022 机构私人先行）——"固定三环节方向"是对单一事件的单一口径读数的过拟合。
  (3) 招牌涌现内容（官方→私人的固定时序）的承重前提"官方信息+制度优势→最先行动"
  不出自任何父推论（文件自认"非 DED-028 原文所有"），也推不出来——BR-L2-024 的认知
  扩散机制不区分央行与专业机构投资者的响应速度；剥掉这条注入假说后，剩余内容退化为
  DED-028 AND DED-029 的平凡合取（文件自己的判别效度节承认此时"L4 不是涌现"）。

protocol: |
  Rule B 独立对抗审查（作者≠审查者，全新独立上下文）。
  L3 通用红旗 1-11 + L4 专属红旗 12-18 逐条攻 + 独立多父逐格判空归属分析 +
  L4 版反例猎捕（猎"父推论都成立但交互不产生 L4 预测"的案例，特别猎三环节
  被跳过/重排的历史窗口）。裁决三态：verified / needs_revision / rejected。

round_1:
  reviewer: "独立子 Agent (round 1, 全新独立上下文, L4 对抗审查者, 与作者无关)"
  verdict: rejected
  verdict_note: |
    核心主张——"传动方向固定（官方→私人→价格），且该方向是结构性保证而非经验巧合"——
    被三路独立攻击同时打穿，且三路均不可靠定向修订救活：
    (1) 净杀反例（自家预注册闸门触发）：2022 事件按注册口径（私人=金条金币+ETF 合计）
        测得 τ=−2，falsifiability (b) 明文规定 τ≤−1 → "本推论被净证伪"。改用金条金币
        单独口径可把读数救成 τ=0（不可判），但该口径切换发生在数据方向已知之后、方向
        恰好救推论——按第 11 条判例一律反向裁决。两种口径下预测 (ii) 的支持均为零，
        其中注册口径直接净杀。
    (2) 历史窗口时序异质：1971（官方黄金需求先于且引发触发事件——欧洲央行挤兑金窗
        导致停兑）、1979（官方部门净卖方向、私人恐慌买盘驱动 $850——锚点"央行转净买家"
        为事实错误）、2022（机构私人 ETF 当季响应最快、官方 Q2-Q3 跟进、零售金条金币
        Q3 见峰）。三个窗口三种排序——"三环节固定方向"不是规律，是对 2022 单事件
        单口径读数的过拟合。
    (3) 涌现塌陷：官方→私人时序这一招牌新颖性命题不由父推论合力推出——其承重排序
        标准（信息+制度优势）是 L4 自建注入假说，且被 2022 触发季度数据在类型上证伪
        （触发季官方购金 84 吨低于自报基线均值 ~120 吨，私人合计 551 吨创多年新高——
        最快响应者恰是私人专业段）。剥离该假说后剩余内容 = "SOV 先动" AND "信用↓→金↑"
        的平凡合取，文件 discriminant_validity 自认此形态"L4 不是涌现"。
    另有多处 required 级操作化缺陷（Link III 检验统计量的时间尺度错配、锚点基线窗口
    与注册定义不一致、利比亚口径继承的第 11 条问题 + anti_talisman(5) 与
    falsifiability(c) 的内部矛盾），但即便全部修复也救不回 (1)(2)(3)。
    判 rejected——救活需要把核心主张改写为"响应速度由行动者的制度摩擦与专业化程度
    分层（机构私人最快、官方居中、零售最慢）"，那是另一条推论的重新立项，不是修订。

  # ===== 通用红旗 1-11 =====

  standard_red_flags:
    1_brick_conclusion:
      verdict: pass
      note: |
        "三环节固定时序链 + 二值触发"不在任何承重砖原文中：DED-028 只给 SOV/MOE
        二分时序，DED-029 只给 C3 连续方向，BR-L2-024 只给认知扩散的一般机制。
        无砖被专为本推论窄化。通过（但见旗 13/14——不在砖里不等于能从砖推出来）。

    2_cell_empty_prediction:
      verdict: hit
      severity: required
      note: |
        预测 (iv) 的空格——"触发 ON + 官方无上跳 + 私人与价格照跑"预测为空——是真
        经验主张，但独立核查发现该格【很可能已被历史填充】：1979 年触发窗口（文件
        自己编码为 ✓，3%）内，官方部门为净卖方向（美国财政部黄金拍卖持续至 1979 年
        11 月、IMF 拍卖持续至 1980 年 5 月，世界官方总持金量 1970s 末下行），而私人
        需求与金价（$300→$850）照跑——正是 falsifiability (d) 描述的"跳过官方环节"
        填格。文件用"央行从净卖家转净买家"的错误编码把这个格挡住了（见旗 7）。

    3_measurement_orthogonal:
      verdict: hit
      severity: required
      note: |
        主轴设计（触发编码独立于金价与购金量、官方/私人分数据源、τ 为复合被测量）
        在纸面上正交，值得肯定。但两处 required 级测量缺陷：
        (a) Link III 检验统计量时间尺度错配——"后 8 季度【累计】涨幅 > 基线【季度】
            变动率的 μ_ret + 1.645σ_ret"把 8 个季度的累积漂移与单季度噪声带比较，
            任何有正漂移的资产几乎必然"显著"——该检验结构性偏向确认。正确形式应
            与基线期 8 季度累计涨幅的分布（或 bootstrap 分布）比较。
        (b) 锚点实际执行与注册定义不一致——2022 锚点 Link III 用"2014 Q1–2021 Q4"
            做基线（32 个季度），而 operationalization 注册的是"事件前 8 季度"；
            Link II 用金条金币单独序列而注册的是金条金币+ETF 合计。两处都是
            "注册一套、算another套"，且偏差方向均有利于推论。

    4_excluded_outcomes:
      verdict: pass
      note: |
        五条排除（触发时点/具体点位/非金资产/多事件叠加/幅度）均按事前可判渠道划，
        无按结果收缩射程。"金以外目的地不证伪传导链存在"一条略宽但已诚实标注削弱
        检验力。通过。

    5_classification_bin_match:
      verdict: pass_with_concern
      note: |
        触发二值化（≥1% 类别翻转）有独立机制理由（理论可能→公开先例是二态跳跃），
        档位选择本身可辩护。concern：二值化把 1971（锚货币制度撤回）与 2022（第三方
        资产冻结）归入同一 ON 态，文件自认二者性质不同——若时序结构在两类事件下
        不同（事实上不同，见反例猎捕），二值化掩盖的恰是致命异质性。

    6_anti_talisman:
      verdict: hit
      severity: required
      note: |
        anti_talisman 条款写得密，但第 (2) 条（"环节时序必须用独立数据源的原始时间戳
        确认——不得用窗口裁剪制造滞后假象"）被锚点自身违反：私人需求序列裁掉了 ETF
        分量（注册口径的一半），裁剪后 τ 从 −2 变成 0。这正是该条款要防的操作，
        发生在作者自己身上。另外 anti_talisman(5) 与 falsifiability(c) 内部矛盾：
        (5) 说利比亚过线 → 2011-2013 金价大跌成"一锤定音反例"（rejected 级），
        (c) 说价格不响应只降格预测 (iii)（verified* 级）——同一事态两个不相容的
        预注册后果，检验时必然面临事后择轻，本身就是护身符结构。

    7_real_world_anchor_check:
      verdict: hit
      severity: required
      note: |
        三处事实核查不过：
        (a) 1979 锚点"央行部门从净卖家转净买家"——事实相反方向：美国财政部
            1978-1979 拍卖黄金约 500 吨（最后一场 1979 年 11 月，与冻结同月）、
            IMF 1976-1980 拍卖约 778 吨，世界官方总持金量在窗口内下行。个别发展中
            国家央行有零星买入，但加总官方部门无"转净买家"跳变。"方向一致性 ✓"
            编码不成立，该锚点应从 narrative support 转为潜在反例（见旗 2）。
        (b) 同锚点括注"布雷顿森林解体后欧洲央行持续以美元换金"——时间错位：欧洲
            央行的美元换金潮发生在 1971 年 8 月【之前】并且是停兑的原因；1971 年后
            金窗已关，官方间按官价换金通道不存在。
        (c) 2022 锚点 Link II 数据不完整——只列金条金币，注册口径含 ETF。补上 ETF
            （Q1 +269t / Q2 −39t / Q3 −227t / Q4 −90t，WGC 公开数据）后私人合计
            峰值移至 Q1，τ 由 0 变 −2。这不是解读分歧，是变量遗漏。

    8_definition_or_prediction:
      verdict: pass
      note: |
        "官方先行"作为可证伪预测而非定义给出，falsifiability (a)(b)(d) 提供了真实
        证伪路径——事实上正是这些路径被本轮触发。条件是预测不是定义。通过
        （对推论本身而言这是诚实设计；诚实设计不挡净杀）。

    9_enumeration_species:
      verdict: pass
      note: |
        本推论不做 N 类枚举主张。触发事件清单为编码表而非 species 枚举。
        预注册清单 12 项覆盖已知候选，未猎到第 N+1 类遗漏事件
        （审查者补查：2014 克里米亚制裁未冻结俄央行储备，<<1%，不构成漏项）。

    10_primary_suspect:
      verdict: hit
      severity: should
      note: |
        文件自认的 primary_suspect（利比亚口径边界）确实是真软肋，但不是最致命的。
        更致命的软肋文件未认：私人需求口径内部的 ETF/金条金币分歧——文件在
        limitations 里已经意识到"ETF 响应速度可能快于金条金币"，却没有意识到这
        直接威胁主预测 (ii) 的符号（只当作 τ 的测量噪声处理）。真正的第一嫌疑
        是"官方最先"这一排序前提本身，secondary 才是口径边界。

    11_caliber_registration:
      verdict: hit
      severity: required
      note: |
        两处：
        (a) 继承性问题——≥1% 阈值的央行窄口径在 L4-009 攻防中被判"口径在反例
            （利比亚）出现后才定死、方向恰好救推论"。L4-011 原样继承该口径并称
            "预注册"。新文件里重新登记不能洗掉口径诞生的事后性——按第 11 条判例
            精神，利比亚边界格不得计为守住。适用后果：2011 转触发 ON。有趣的是
            适用后 Link I 反而表面成立（2011 央行购金 457 吨大跳），但文件的
            supporting anchor 3 把同一数据编码为"无触发期的常态化多元化"——同一
            购金数据在两种口径下被两种相反叙事征用，暴露触发编码在做全部工作。
        (b) 本体问题——私人需求口径注册为合计、执行为金条金币单独（见旗 3/7），
            属"注册与执行不一致 + 偏差方向救推论"，按本条一律反向裁：τ 以合计
            口径为准 = −2。

  # ===== L4 专属红旗 12-18 =====

  l4_red_flags:
    12_spectator_brick:
      verdict: hit
      severity: required
      note: |
        DED-028 接近观众砖：其独有内容是 SOV vs MOE 的跨域时序，但 L4-011 的全部
        五条预测 (i)-(v) 都在 SOV 域内测量（官方购金/私人购金/金价），MOE 侧只出现
        在自认"边缘拓展、非核心环节"的格 H，无任何预测检验它。传导链真正用到的
        只是"信用事件时储蓄端会动"——这在 DED-029 的 C3 通道（法币信用↓→非主权
        价值储藏需求↑）中已经包含。移除 DED-028 后，损失的只是"SOV 先于 MOE"这句
        无预测引用的背景陈述，(i)-(v) 一条不塌。necessity 论证声称移除 DED-028 就
        失去"谁先动的结构性理由"——不成立：官方 vs 私人的排序理由文件自认来自
        "信息+制度优势"（L4 自建），不来自 DED-028 的无法律缓冲机制（官方和私人
        储蓄者同样无法律缓冲）。BR-L2-024 以辅前提身份诚实标注，不计观众砖。

    13_trivial_conjunction:
      verdict: hit
      severity: required
      note: |
        分解 L4-011 的三条自称增量：
        (a) SOV 域行动者分层 + 固定时序——不是父推论合取的产物，是注入假说（见旗 14），
            且被数据净杀（见反例猎捕）；
        (b) 触发二值化——方法论选择，非机制命题，且与 DED-028/029 的连续谱机制
            相抵（父机制是连续的，二值化是外加的检验装置）；
        (c) 目的地=金 × 储蓄端先动——这是 DED-029 AND DED-028 的直接拼接。
        剥掉 (a)（净杀）与 (b)（装置非命题）后只剩 (c)。文件 discriminant_validity
        自设的判准："若 L4-011 可被'在 DED-029 里加一条 footnote'等价替代——则
        L4 不是涌现"。剥离后恰好落入此形态。命中。

    14_emergence_missing:
      verdict: hit
      severity: required
      note: |
        涌现声明为 conjunction（薄涌现），但招牌涌现签名（格 A→格 B 的序贯关系）
        经独立复核不由任何父推论组合强制：
        - DED-028 给不出（官方与私人都在 SOV 域，机制无差别适用）；
        - DED-029 给不出（不区分需求来源）；
        - BR-L2-024 给不出——认知扩散机制说"经历/看到信用事件的 Agent 更新认知
          需要时间"，但它不蕴含"央行的认知-行动链比专业机构投资者更短"。ETF/对冲
          基金同样有专职团队与实时信息；央行反而有委员会决策、分批执行、避免
          冲击市场的制度摩擦。从父推论出发，同样合法（甚至更自然）的推导是
          "制度摩擦最小的专业私人段最先动"——2022 年 Q1 数据正是这个方向。
        序贯方向的锁定靠的是 derivation step 2 里"官方即时、私人需要媒体叙事"的
        断言，这是未标注的外部注入前提，非父推论内容。涌现签名 = 注入假说 ≠ 涌现。

    15_weak_parent:
      verdict: pass
      note: |
        DED-028 verified、DED-029 verified（均经独立审查），BR-L2-024 verified 且
        以辅前提身份使用。无 candidate 父前提承重。通过。

    16_anchor_theft:
      verdict: hit
      severity: required
      note: |
        2022 锚点自评"链的存在感强于链的精确可测——是'三件事都发生了且顺序不矛盾'
        的锚"。按旗 16 判准，"A 存在且 B 存在（且 C 存在）"不算复合锚点——复合
        特有内容恰恰是时序 τ，而 τ 在该锚点上按作者口径不可判（0）、按注册口径
        为反向（−2）。1979 锚点自认 narrative support，1981-2021 空白期自认
        indirect。即：本推论【没有任何一个】复合特有锚点，且未按 Rule G 要求
        诚实标注"无复合特有锚点，置信度完全继承自父推论"。

    17_interaction_measurement_gap:
      verdict: pass_with_concern
      note: |
        设计层面无缺口——τ 是真正的交互被测量（区别于官方单独与私人单独的输出），
        双数据源独立，这是全文件最好的部分。concern：测出来的 τ 杀死了推论。
        另有粒度问题（季度原子单位 + 官方平台型购买使峰值定义脆弱）已被文件
        诚实标注为 secondary_suspect，不重复计缺陷。

    18_claim_type_evidence_match:
      verdict: hit
      severity: required
      note: |
        claim_type=trajectory_prediction 要求纵向/序列证据。现状：唯一有季度序列的
        窗口（2022）按注册口径给出反向序列；1979 无私人序列且官方方向编码错误；
        1971-1980 复合窗口自认归因不可分解。可用的纵向证据 = 0 条支持、1 条反向。
        文件的 Epistemic status 诚实声明了 N=1 与低检验力，但"N=1 且该 1 为反向"
        与"N=1 尚待检验"是两回事——前者不是证据不足，是证据在场且不利。

  # ===== 多父逐格判空归属分析（独立复核） =====

  multi_parent_cell_attribution:
    description: |
      按文件的 16 格框架（SOV/MOE × 触发+C3 四态 × 官方/私人）独立复核归属，
      重点核招牌格 A/B 及其序贯关系的归属。
    findings:
      - cell: "格 A [SOV, 事件 ON+C3, 官方] = 官方购金"
        claimed: "3 父合力"
        independent_attribution: |
          实为 2 父合取：DED-029 的 C3（信用事件→金需求↑）+ DED-028 或 DED-029
          任一即可覆盖"储蓄端动"（C3 通道本身就定义在价值储藏需求上）。
          BR-L2-024 在此格不出力（官方不需要认知扩散机制——文件自己说官方是
          "即时"的，即该格的填充恰恰【不经过】BR-L2-024 的扩散通道）。
          降级：2 父合取格，成立但内容平凡（央行在信用事件后买金 ≈ C3 的直接实例）。
      - cell: "格 B [SOV, 事件 ON+C3, 私人] = 私人购金滞后跟随"
        claimed: "3 父合力"
        independent_attribution: |
          "私人购金"部分 = DED-029 单父可判（C3 不区分行动者，私人买金是 C3 直接
          实例）。"滞后跟随"部分不由任何父组合强制（见旗 14）——BR-L2-024 给
          "认知扩散需要时间"，但没有给"比官方慢"：官方的决策-执行链同样耗时。
          该格的非平凡内容（滞后）归属为 L4 注入假说，非多父合力。
      - cell: "格 A→格 B 序贯关系（招牌涌现签名）"
        claimed: "不在任何单父射程内 → L4 独有"
        independent_attribution: |
          确认不在任何单父射程内——但也不在父推论【合取】射程内。"不在父推论里"
          有两种情形：涌现（合起来能推出）与注入（合起来也推不出、另加了前提）。
          本格属后者。且注入前提（官方响应速度>专业私人响应速度）与 2022 触发
          季度证据方向相反。招牌格判定：非涌现格，注入格，且已被填反。
      - cell: "格 H [MOE, 事件 ON, 私人]"
        claimed: "2 父合力"
        independent_attribution: "成立（DED-028 的 MOE 崩塌时机 + DED-029 方向），但文件自认边缘拓展、无预测检验——不能为核心涌现承重。"
      - cell: "其余 12 格"
        independent_attribution: "同意文件标注（单父可判或空格），无异议。"
    conclusion: |
      复核后 ≥2 父合力格 = 格 A（2 父、平凡）+ 格 H（2 父、边缘无检验）。
      招牌格 B 的非平凡分量与 A→B 序贯关系均为注入假说。满足"至少一格 ≥2 父合力"
      的字面最低门槛，但涌现的全部实质内容集中在被净杀的注入假说上——
      Rule E 的 novelty 子条件失败（核心新命题既非单父断言也非父合取可推，
      而是父推论之外的自由参数，且为假）。

  # ===== 反例猎捕（L4 版：猎"父推论都成立但交互不产生 L4 预测"） =====

  counterexample_hunt:
    strategy: |
      核心拷问：三环节（官方→私人→价格）是唯一时序结构，还是历史上存在多种传导
      模式？逐一检查全部三个触发窗口（1971 / 1979 / 2022）的实际环节顺序，
      再猎"环节被跳过/重排"的窗口。父推论（SOV 先动、信用↓→金↑、认知有滞后）
      在所有窗口都成立——问题全部出在 L4 附加的固定排序上。
    hunts:
      - direction: "2022 窗口按注册口径重测 τ（净杀检验）"
        case: "2022 俄储备冻结——推论自己的招牌锚点"
        analysis: |
          注册口径：private = Bar&Coin + ETF 合计。WGC 公开数据：
          Bar&Coin 2022 Q1 282t / Q2 263t / Q3 352t / Q4 321t；
          ETF 净流入 2022 Q1 +269t / Q2 −39t / Q3 −227t / Q4 −90t
          （Q1 为 2020 Q3 以来最大单季流入，集中在入侵后的 3 月）。
          合计：Q1 ≈ 551t（多年峰值）/ Q2 ≈ 224t / Q3 ≈ 125t / Q4 ≈ 231t。
          2023-2024 无更高合计季度（ETF 2023 全年净流出，金条金币 ~300t/季量级）。
          官方（文件自报）：Q1 84t / Q2 180t / Q3 459t / Q4 359t，峰值 Q3。
          τ = argmax(private) − argmax(official) = Q1 − Q3 = −2 ≤ −1。
          预注册的 2 季度滚动和处理不改变结论（私人滚动峰值仍在窗口头部，
          官方在 Q3-Q4）。falsifiability (b)："τ ≤ −1 → 时序方向反转 →
          本推论被净证伪"。
          加重情节：触发季度（Q1）官方购金 84t 低于事件前 8 季基线均值
          （文件自报 ~120t）——在事件发生的那个季度，官方需求处于基线【之下】，
          私人合计创多年新高。"官方先行"在触发季度的读数是反向的。
          可能的消化路径逐一封死：
          (a) "改用金条金币单独口径" → 注册-执行不一致 + 方向救推论 →
              第 11 条反向裁决，不得改；且金条金币口径下 τ=0 也只是不可判，
              仍是零支持。
          (b) "Q1 ETF 流入含 1-2 月加息对冲盘" → 3 月单月为最大流入月，
              事件驱动明确；且季度为注册的最小原子单位，禁止亚季度重构
              （anti_talisman(4) 自禁）。
          (c) "ETF 是机构行为不代表'私人认知扩散'" → 那是承认注册口径选错了
              变量——机制与测量脱钩，同样 required 级死伤。
        verdict: "净杀——推论自设的一锤定音条件 (b) 在唯一完整现代窗口上被触发"
      - direction: "1979 窗口——官方环节是否被跳过（填空格 (iv)/(d)）"
        case: "1979 伊朗央行资产冻结（文件编码 ✓，3%）"
        analysis: |
          官方部门实际行为：美国财政部 1978-79 拍卖黄金约 500 吨（最后一场
          1979 年 11 月，与冻结同月）；IMF 1976-1980 拍卖约 778 吨（持续到
          1980 年 5 月，跨越整个事件窗口）；世界官方总持金量在窗口内净减。
          即：触发 ON，官方部门加总为净卖方向，无任何"上跳"；私人需求爆发
          （中东与零售恐慌买盘）+ 金价 $300→$850 照跑。
          这正是 falsifiability (d) 的"跳过官方环节"格：触发 ON + 官方无上跳 +
          私人→价格链自启 → "官方先行非必要环节 → 三环节结构不成立 →
          降格为 rejected"（文件原文）。
          文件用"央行从净卖家转净买家"的错误编码将此格标记为"方向一致性 ✓"——
          事实核查不支持该编码（旗 7）。
        verdict: "第二击净杀候选——按文件自己的 (d) 条件，1979 填充了跳过官方的空格（年度粒度留有申辩余地，但举证责任在推论侧且现有证据方向不利）"
      - direction: "1971 窗口——环节重排（官方需求先于触发事件）"
        case: "1971 美元停兑黄金"
        analysis: |
          因果顺序倒置：欧洲央行的美元换金潮发生在 1971 年 8 月之【前】，
          是停兑（触发事件）的【原因】而非响应。官方黄金需求 → 触发事件 →
          私人需求（1974 美国私人持金合法化后）→ 价格。
          "官方先动"在此窗口为真，但先于的是【事件本身】——传导链的
          "事件→官方→私人"结构变成"官方→事件→私人"。三环节的启动器
          位置被重排。
        verdict: "结构重排实例——支持'时序结构因事件类型而异'，反对'固定方向是结构性保证'"
      - direction: "父推论全成立、交互预测失败的定性归纳"
        analysis: |
          三个窗口中 DED-028（储蓄端先于支付端）、DED-029（信用事件后金需求
          与金价方向为正）、BR-L2-024（零售段确有认知扩散滞后——2022 金条金币
          峰值确实晚于 ETF 峰值 2 个季度）全部成立。失败的只有 L4 附加的
          固定排序。实际数据呈现的模式是"响应速度按制度摩擦与专业化分层：
          专业私人（ETF，日级）→ 官方（委员会决策+分批执行，1-2 季度）→
          零售私人（认知扩散，2-3 季度）→ 价格（累积）"。这是一条与 L4-011
          不同的（且与父推论同样相容的）传导结构——证明父推论合取并不唯一
          决定 L4-011 的链，L4-011 只是可能结构之一且是与数据不符的那一个。
        verdict: "三环节是 overfitting 不是规律——同一父前提集至少相容两种传导结构，数据偏向另一种"
    conclusion: |
      净杀成立（2022/τ=−2 触发自设 (b) 条件），另有 1979 的 (d) 格填充强候选与
      1971 的结构重排。三个触发窗口三种时序——"固定三环节"的核心被打穿。
      按 L4 猎捕要求区分归因：所有击杀均属"交互本身不成立"（父推论无一被
      反例波及），是 L4 自己的问题，不连累 DED-028/DED-029/BR-L2-024 的状态。

  # ===== DED-004 / DED-007 复发检查 =====

  non_recurrence:
    DED-004: |
      部分复发风险（不可证伪循环的软形态）：anti_talisman(5) 与 falsifiability(c)
      对同一事态（利比亚过线后的 2011-2013 价格路径）预注册了两个不相容后果
      （一锤定音 rejected vs 仅降格 (iii) 为 verified*）——双预注册等于把裁决
      自由度留到了事后，属护身符结构的变体。另外锚点对注册口径的偏离（ETF 遗漏、
      基线窗口替换）显示预注册纪律在执行层失守。但推论主体给出了真实证伪条件
      且本轮正是靠这些条件完成净杀——不构成 DED-004 级的定义循环。
    DED-007: |
      未复发测量轴焊死。触发编码独立于结果变量，官方/私人双数据源采集路径独立，
      τ 为真复合测量。测量设计是本文件质量最高的部分——也正因为设计诚实，
      净杀才干净。

  # ===== 裁决与修复清单 =====

  required_fixes:
    - "R1（不可修复级）：预测 (ii) 与 statement 的固定方向主张已被注册口径下的 2022 数据触发自设净证伪条件 (b)（τ=−2）——按 falsifiability 原文本推论应 rejected；任何口径改动均落入第 11 条反向裁决。"
    - "R2：1979 锚点'央行从净卖家转净买家'为事实错误（美/IMF 拍卖贯穿事件窗口、官方总持金量下行），该窗口应重编码为 falsifiability (d) 的候选填格而非 narrative support。"
    - "R3：官方→私人排序的承重前提（官方信息+制度优势→最先行动）非父推论可推，须显式标注为外部注入假说——标注后涌现签名失效，剩余内容为平凡合取（旗 13/14）。"
    - "R4：Link III 检验统计量修正——8 季度累计涨幅不得与单季度 μ+1.645σ 比较，须与基线 8 季度累计涨幅分布比较；锚点基线窗口（2014-2021）与注册定义（事件前 8 季度）须一致。"
    - "R5：解除 anti_talisman(5) 与 falsifiability(c) 对利比亚过线情形的双重不相容预注册（择一），并正面处理窄口径继承的 L4-009 第 11 条判例适用。"

  fixes_note: |
      R1-R3 触及核心：即使 R4/R5 全部修复，固定三环节方向仍被数据净杀、涌现签名
      仍是被证伪的注入假说。可救的后继命题（按行动者制度摩擦分层的响应速度结构：
      专业私人→官方→零售→价格）是重新立项，不是本推论的修订。故裁 rejected。
