id: ADV-REVIEW-L4-018
type: adversarial_review
reviews: L4-018
layer: L4-composites

人话摘要: |
  对 L4-018 的 round_1 独立对抗审查（MiniMax-M3 异血统）。

target: L4-018
protocol: |
  Rule B 独立对抗审查（作者≠审查者，MiniMax-M3 异血统独立上下文，ICV 协议）。

round_1:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 1, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    L4-018(注意力贫困:集体行动的数字屏障)有一条真实的因果链:DED-017 的三条件框架 + DED-046 的注意力-消费螺旋 + L1 概念化 → "注意力贫困是集体行动通信条件被攻击的软性、非意图、市场驱动的渠道"。涌现声明合理,不是父推论的 AND/OR 拼接,有多父逐格判空(高注意力贫困 × 条件满足的"反例格"消化,高注意力贫困 × 条件不满足的"非平凡格"由焊接带来的可操作化增量)。但当前 draft 在三处有 required 级缺陷,挡住 verified:

    1. **复制作业错误/锚点失锚(红旗 7 + 红旗 18)**:整个 `emergence_demonstration` 块谈的是"SOV/MOE 窗口长度 = f(r_trust)",与本推论(注意力贫困 × 集体行动)无关。这一节显然是错误粘贴自 L4-016 的草稿(且 L4-016 自身也用同样的窗口论)。涌现论证因此在字面上是无效的——本推论还没真正写出自己的涌现论证。

    2. **主嫌疑人/弹内生性未被可操作化击穿(红旗 6 + 红旗 14)**:primary_suspect 标的是"注意力贫困是原因还是相关",secondary_suspect 标的是"算法推送强度的内生性——个体社交被动性同时驱动算法喂养与低参与"。第二条(内生性)比第一条更致命,因为它直接威胁 **证伪条件 (b)** 的解释力——若低社交互动倾向同时驱动"被推更多"和"参与更少",则推送强度与参与的负相关可全归因于社交被动性而非推送本身,证伪 (b) 的解释权彻底打不开。作者必须重新排序软肋权重,并对内生性提供工具变量/倾向评分/断点回归等任一类识别方案,否则 (b) 这条证伪条件等同于"可被任何并行故事救活",违反 anti-talisman。

    3. **falsifiability 口径未注册(红旗 11)**:(a) "控制了不公感知度/合法渠道可得性"——哪个量表、阈值、聚合方法未注册;(b) "屏幕时间占比"如何区分被动推送与主动社交(平台 metadata 通常无法干净区分);(c) "受影响区域的社会运动发起率"——分子分母、地理口径、时间窗口都不锁定,且未声明预注册。这与 L4-009 判例(利比亚冻结宽窄口径)同类风险:反例出现后可以靠重新定义"被动推送"或"区域"来救推论。

    判 needs_revision 而非 rejected,因为核心机制主张确实非平凡,涌现声明是真的,只是涌现论证块被错误粘贴、内生性未被反证、证伪口径未注册——这些都是可定向修复的缺陷。
  red_flags: |
    1. brick=conclusion — 未命中。核心声明"注意力贫困通过压低主动社交注意力时段攻击 DED-017 通信条件"未在任一承重砖原文中找到近义表述。DED-017 的通信条件只提"群体内通信能力",DED-046 只提注意力-消费螺旋,焊接产物"软性、非意图、市场驱动的通信屏障"不是任一砖的窄化重述。
    2. 逐格判空 — 未命中。2×2 网格在 nontriviality_test 块中已给出,且对"反例格"和"非平凡格"都提供了可观测变量。格(高注意力贫困,条件不满足)的可操作化增量(注意力贫困作为条件缺失的具体原因)有清晰判据。
    3. 测量轴正交(DED-007 死因) — 命中警示。证伪 (a) 中"认知带宽占用量"与"集体行动参与"的测量链相对正交(前者是认知负荷量表,后者是行为自报/组织记录);证伪 (b) 中算法推送占比与参与率的测量同根于"个体自我报告的手机使用"——若屏幕时间自报存在系统性偏差,两个变量会同时偏。但这是测量误差问题,不是焊死,可在修订中加设备数据替代自报。
    4. 射程/排除钩子独立于结果 — 未命中。推论未设 excluded_outcomes 钩子,因而无"事后开脱"嫌疑。
    5. 分类判据档位匹配 — 未命中。2×2 二分档位合理(集体行动条件是否满足是布尔型问题)。
    6. anti-talisman 真兑现 — 命中。secondary_suspect(算法推送强度的内生性)未被真正兑现:作者只指出问题,没有给出识别方案(IV/倾向评分/断点回归/外生冲击)。primary_suspect(因果 vs 相关)有"注意力释放事件的自然实验"作为识别策略,但这把识别压力全放在证伪 (c) 上,而 (c) 的"大规模数字服务中断>6小时"事件在低收入群体区域样本极稀缺(低收入区往往是数字基础设施薄弱区,宕机更多但难以归因到算法推送释放;高数字渗入区又非低收入),自然实验的统计功效未被估算。
    7. 现实锚事实核查 — 命中警示。anchors 中"2020 年夏季全球抗议浪潮与 COVID 封锁窗口重叠"——这是方向性证据而非因果证明,且具体到 BLM、泰国、白俄罗斯,各国的触发原因都不同(美国是种族不公、泰国是政治压制、白俄罗斯是选举舞弊),与"数字戒断释放注意力"的因果链弱。作者自评 confidence: weak 是诚实的,但 weak 的方向性证据不应作为单一支持锚。
    8. 条件是下定义还是做预测 — 未命中。证伪条件 (i)(ii)(iii) 都是可操作的经验命题,不是同义反复。
    9. 枚举穷尽 — 不适用(本推论不声称枚举 N 类)。
    10. primary_suspect 指对 + 平凡化检查 — 命中。primary_suspect 标的"原因 vs 相关"是次致命;真正的最致命腿是 secondary_suspect 标的"算法推送内生性",作者应把它升级为 primary_suspect。平凡化检查:本推论若去掉"注意力"概念,只留"DED-017 + DED-046 各自结论的拼接"——只能说"低收入群体消费更多算法内容同时集体行动更少",这是相关而非机制推论。当前版的核心机制主张(被动推送占用主动社交时段 → 通信条件失守)有相对可观测的中介变量,"被动/主动时间比"作为中介,使推论不完全平凡化——但这条中介链正被 (b) 中的内生性问题威胁。
    11. 口径完整注册 + 歧义反向裁决 — 命中。三条证伪条件都缺口径预注册:(a) 的"控制了不公感知度"无注册量表,(b) 的"被动推送 vs 主动社交"无注册划分规则(尤其当用户在 TikTok 刷到一条抗议视频并转发——这是被动推送还是主动社群?),(c) 的"受影响区域"无注册地理口径。这是 L4-009 同类风险。
    12. 数据源同根冒充多源独立 — 未命中(本推论未声称多源验证)。
    13. API 可及性冒充认识论独立性 — 未命中。
    14. 反向失败模式缺失 — 命中警示。需要考虑的反向失败是:算法推送内容本身可以承载集体行动信息(抗议教学、维权模板、群体身份符号),若推送强度↑但推送内容中"行动导向内容"占比也↑,则推送可能反而促进而非抑制集体行动。作者证伪 (b) 只测了"推送强度-参与率"的相关方向,没测"推送内容构成"的交互项,需要补"行动导向内容占比 × 推送强度"的交叉效应。
    15. Bootstrap 限定缺失 — 未命中(本推论不涉及冷启动阶段)。
    16. 验证对象存在性未标注 — 未命中。

    L4 专属红旗:
    14. 观众砖 — 未命中。移除 BR-L2-013(不公平厌恶),DED-017 失去第一前提(集中感知的不公是触发条件);移除 BR-L2-027(注意力稀缺),DED-046 失去认知带宽机制;移除 BR-L2-029(MPC 收入梯度),DED-046 失去低收入群体特异性的来源。每条父推论都有不可替代贡献。
    15. 平凡合取 — 未命中。L4 结论"注意力贫困通过压低主动社交注意力时段→攻击 DED-017 通信条件,产生市场驱动的软性通信屏障"不是父推论结论的 AND/OR 拼接——父推论分别谈集体行动触发条件和注意力-消费螺旋,焊接给出"集体行动失败的渠道-机制-媒介"这一新解释层。
    16. 涌现缺失 — 未命中,但论证错位。emergence_demonstration 块谈"SOV/MOE 窗口长度 = f(r_trust)"——这是 L4-016 的涌现论证,被错误粘贴到本推论。本推论的真正涌现论证应在"高注意力贫困 × 条件不满足"格(传统理论说"条件未满足所以无行动",加上 DED-046 后可被解释为"注意力贫困是条件未满足的具体原因")和"被动推送→主动社交时段被压缩"这条中介链的可操作化。这条 should/required 级缺陷是上面裁决说明中的"涌现论证被错误粘贴"。
    17. 弱父前提 — 未命中但需警示。DED-046 自身是 verified 但 nontriviality_test 中对反例格的消化路径"延迟而非阻止"未在 L4-018 中继承继承并考验。如果 DED-046 反例格成立(高注意力贫困下集体行动仍可能发生,只是延迟或需要更高触发阈值),L4-018 的核心机制可被收窄为"提高触发阈值"而非"阻止"——这是非平凡的退化,但作者应在文中显式吸收这个收窄,而不是只放在 DED-046 的佐证里。
    18. 锚点偷窃 — 未命中。anchors 块未做复合锚展示;这是缺失而不是偷窃。
    19. 交互测量缺口 — 命中。"被动推送时间"和"主动社交时间"通常必须在同一测量链(屏幕时间数据)中互相独立测出;而真正支撑本推论的交互量是"被动推送占比 × 主动社交占比"——这要求两者必须同时注册,而不是分别报一个占比。如果只用单个时间占比,无法排除"同时减少"(屏幕时间整体下降)的冗余解释。
    20. 声明类型-证据标准错配 — 命中。claim_type 实质上是"trajectory_prediction + mechanism_extension",但 real_world_anchors 只给了一个 weak 的方向性证据(BLM/泰国/白俄罗斯),没有提供任何匹配 trajectory_prediction 的纵向/序列数据(如面板数据、地区时间序列、自然实验)。作者依赖证伪 (a)(b)(c) 来说明反证可能性——这是 ground truth testability,但当前没有一项被实际执行。声明类型-证据的匹配通过"理论可证伪"来兑现,而非"经验已证实",这在 candidate 阶段是可接受的,但应在文中显式说明 status=candidate 与证据现状的对应。
  counterexample_hunt: |
    猎捕 1:**平台型集体行动的当代反例——香港反送中(2019-2020)**
    低收入群体中,参与者大量使用 Telegram/Lihkg(高推送密度的算法驱动平台)同时发起高度组织化的集体行动(数百万人在缺乏传统资源条件下数月内持续动员)。这指向"推送强度↑+集体行动↑"的反向模式。
    - 结果:**被消化**。本推论的射程是"被动推送内容(消费)"攻击"主动社群互动"。香港案例中,Lihkg/连登是用户主动参与的发帖型平台,推送内容偏用户生成而非算法推荐。消化路径:本推论应限定到"算法个性化推送(中心化推荐算法驱动,如 FB/TikTok)"而非一般性平台使用,而不是泛指"数字通信"。这是射程窄化,不算净杀。

    猎捕 2:**孟加拉国 2024 学生抗议(Quota Reform Movement)**
    极低收入背景的学生(很多是中等收入家庭但教育投入挤出消费)在 Facebook/TikTok 高使用的同时,组织起跨地区、跨阶层的集体行动,最终迫使总理哈西娜辞职。
    - 结果:**被消化(部分)**。与猎捕 1 同类,而且这条案例中 TikTok/FB 的算法推送/社群结构都介入,削弱了"被动推送占用注意力 → 无法参与集体行动"的机制强度。**部分揭出过度伸张**:推论的射程应窄化到"在高被动/主动比的低收入亚群体",而不是泛指"低收入群体"。

    猎捕 3:**美国阿片类药物危机中的集体行动缺失 vs. 黑人社区的低集体行动缺失**
    阿片成瘾重灾区的低收入白人社区出现极端的注意力贫困(成瘾占用认知带宽 + 经济衰退压力 + 算法推荐同类内容),但同一时期这些社区几乎无集体行动记录。这与推论方向一致,可视为支持。
    - 结果:**被消化为支持**。但样本量小,且阿片成瘾引入"成瘾行为占满注意力"这一更直接的机制,与算法推送的占比关系模糊——支持力度中等。

    猎捕 4:**2011 阿拉伯之春 vs 同年英国 2011 伦敦骚乱**
    阿拉伯之春:社交媒体促成集体行动(数字赋能);伦敦骚乱:BlackBerry Messenger 作为高加密通信工具促成短期行动。两条案例都涉及"数字工具促进行动"。
    - 结果:**揭出过度伸张**。"数字通信工具的存在"从历史经验看往往是促进行动而非阻止;本推论的合法性要求实证 (a) 中"控制不公感知度后认知带宽-参与"仍显著——如果行为模式更可能是"数字通信促进行动"而非"数字推送抑制行动",则本推论的因果方向需要重新校验其特异性。这不是净杀(猎捕 1 给了消化路径),而是提示推论的因果方向选择偏窄:不是"数字通信是否存在"而是"推送内容类型 vs 主动社交时间的占比"才是核心变量。

    猎捕 5:**父推论都成立但交互不产生 L4 预测的反例搜寻**
    L4 专属要求:在 DED-017 三条件都满足 + DED-046 注意力螺旋存在的群体中,集体行动仍发生的案例。
    - 结果:猎捕 2(孟加拉 2024)即为此——DED-017 条件满足(集中不公+通信渠道+无合法渠道)+ DED-046 螺旋存在(低收入+注意力稀缺+算法推送),但集体行动强度极高。这直接挑战 L4-018 核心。消化:孟加拉参与者多为学生(教育投入挤出→消费注意力螺旋尚未完全建立)+ 拥有较高数字素养(主动/被动比高)。这消化为"螺旋成熟度阈值+主动社交能力群体边界"两个限定条件,而非完全净杀。**但这两条限定必须在主文中显式注册,否则推论射程过宽**。

    净杀:**无**。
    被消化/支持:1 + 3(两条次要消化案例已纳入射程窄化的考量)。
    揭出过度伸张:**猎捕 2 + 5 必须使推论收窄到:1) 被动推送占比要足够高(主动/被动比<阈值);2) 螺旋成熟度要足够(不是初发状态);3) 主动社交能力本来就要被算法推送偷走(数字素养低)而非被推送偷走增强(数字素养高)**。这三条限定当前 draft 未声明,过度伸张中。
  required_fixes:
    - "1. **修复 emergence_demonstration 块的错位粘贴**——当前块谈 SOV/MOE 窗口,与本推论主题不符。应改写为针对\"高注意力贫困 × 条件不满足\"格的可操作化增量(注意力贫困作为条件缺失的具体机制)和\"主动社交时段被压缩\"这条中介链的涌现论证,引用 DED-017 的通信条件 + DED-046 的注意力螺旋 + L1 概念化(信息需依附物理载体/认知带宽)的三方合力。"
    - "2. **重新排序软肋权重,把\"算法推送内生性\"提升为 primary_suspect**,并对 (b) 证伪条件提供至少一种识别方案(IV/倾向评分匹配/外生冲击/挤压回归),否则 (b) 在反例出现后可被\"社交被动性\"故事整段救活,违反红旗 6 的 anti-talisman 要求。"
    - "3. **预注册证伪口径**:(a) 锁定\"认知带宽占用\"的量表/阈值/聚合方法 + \"不公感知度\"的控制变量集;(b) 注册\"被动推送 vs 主动社交\"的划分规则(具体到:哪些 app 类型、哪些交互模式算主动,哪些算被动),并承诺数据源(屏幕时间 app metadata 优于自报);(c) 锁定\"受影响区域\"地理口径(以手机信号塔服务区/平台用户 IP 段还是行政分区?)和\"集体行动发起率\"分子分母(以新闻报道?Google Trends?Telegram 公共频道数?)。"
    - "4. **收窄射程以消化反例猎捕结果**(孟加拉 2024 + 香港反送中):显式声明 L4-018 针对\"高被动/主动比 + 螺旋成熟 + 低数字素养\"的低收入亚群体,而非泛指低收入群体。把\"高数字素养的主动型低收入群体(学生/自由职业/小商户)可能反向受益于算法社群\"作为 excluded_outcomes 显式排除。"
    - "5. **补一条反向失败模式的注册**(对应红旗 14):若算法推送内容中\"集体行动导向内容\"占比也随推送强度↑,则推送可能促进而非抑制集体行动——需要在 (b) 中补\"行动导向内容占比 × 推送强度\"的交叉效应作为证伪条件 (d),且若此交叉显著为正,本推论须被收窄到\"非行动导向推送(如纯消费/娱乐)\"的子集。"
  oneline: |
    机制真实涌现但论证块错位、内生性未被反证、证伪口径未注册——差一口气在反例猎捕暴露的射程过度伸张和识别策略缺失,定向修订可救。

round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
