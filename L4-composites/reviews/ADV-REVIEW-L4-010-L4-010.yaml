  rejection_grounds: |
    1. METHODOLOGY 涌现条件 (c) 归零：静态合力格 0（作者承认），时序腿经
       本轮裁决不可计入（原意为静态格；宽读法下贡献经自制承重桥且注册检验
       不含第二父内容且该腿自标 should 级）。
    2. 旗 12 观众砖不可消解：DED-029 对结论无不可替代机制贡献（necessity
       检验：移除后结论完整存活于 DED-030 + 自制假说之上）；唯一消解路径
       (a) 在当前证据状态下属 motivated rewiring，等价于另立新推论。
    3. 叠加态：无涌现 + 无复合特有锚点（Rule G 不满足）+ 唯一承重检验 (a)
       所检命题可完整立在单父上——L4 资格要件空集。
    4. 作者事前承诺一致：unresolved_for_round_2 第 1 条明言"裁定不满足则
       本条应 rejected 或降写为 DED-030 的 L3 扩展"。

  salvage_path: |
    非本条复活，仅供未来独立立项参考：可测内核（gate 构造 + RF-1 注册口径 +
    单调性检验 (a) + flow_coverage 条件 + 两豁免判据）可重组为一条 L3
    chaining deduction（主前提 DED-030，"引擎→买家弹性"映射作为该新推论
    自有的经验赌注显式立为前提），走完整 DED 管线全新审查。立项前置问题
    （本轮猎获遗赠）：(i) signature 格资格区的历史可达性必须先证明，否则
    砍掉 (d) 只留 (a)；(ii) flow_coverage 与 gate 的跌价窗口反相须纳入
    操作化分析；(iii) 2013 反例候选与 2008H2 豁免记账随内核继承，不得清洗。
