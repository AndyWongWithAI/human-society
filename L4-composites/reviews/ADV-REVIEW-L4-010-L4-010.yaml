id: ADV-REVIEW-L4-010
target: L4-010
date: 2026-07-15
type: adversarial_review
layer: L4-composites
round: 2
reviewer: "独立对抗审查者 (全新上下文, round 1, 与作者及 L4-009 各轮审查者无关)"
人话摘要: |
  L4-010 把 L4-009 里最硬的交互（放大器被需求构成门控）剥出来单独提案，操作化确实比
  L4-009 干净得多——连续 gate、无阈值、秩检验，这些是真实进步。但本轮独立审查打出了
  五处 required 级缺口，其中两处伤及承重结构：(1) 旗舰锚点的"单位流量价格冲击"算术
  用了与注册口径不一致的口径（2022–24 用三年累计价格变动除以一年流量，2013 用年对年；
  流量口径也与 operationalization 注册的分母不同）——按注册口径统一年化重算，2013
  （低 gate、ETF 抛售主导）的单位流量冲击幅度反而【大于】2022–24（高 gate），旗舰对比
  方向反转，两大承重锚点按第 11 条判例反向裁决不得计为支持；(2) DED-029 在操作层面
  接近观众砖——gate 完全由 DED-030 自己的持有者身份分层构造（央行/金条金币 vs ETF/
  回收金），引擎信号只出现在"可选一致性核查"里，而"引擎→买家弹性"映射文件自认不是
  DED-029 原文——交互级涌现声称按当前构造不成立，至多合取级+自制承重桥。另有三处
  required：2008 流动性危机消化引用了不存在的 excluded_outcomes 条目（COVID 瓶颈声称
  "见 boundary_cases"但该表无此条）；gate 口径遗漏矿产供给（~3600 吨/年的永在场卖方
  流量）与 WGC "OTC 及其他投资"大项（N+1 猎获）；claim_type=phase_transition 与本条
  "无阈值无相变"的设计卖点自相矛盾。核心机制可能仍真，检验设计可定向修复——判
  needs_revision，5 required + 4 should。

round_1:
  round: 1
  reviewer: "独立对抗审查者 (全新上下文, round 1)"
  date: 2026-07-15
  verdict: needs_revision

  verdict_note: |
    不是 rejected 的理由——核心命题（放大倍数随需求构成系统性变化）未被净杀：全样本
    四分位检验尚未执行，2013 反转是"注册口径的一种自然读法下的反例候选"而非已运行的
    统计裁决；观众砖有明确消解路径（引擎信号承重化或涌现降格）；未注册排除可事前化补注。
    不是 verified 的理由——两大承重锚点在注册口径下失效（Rule G 复合特有锚点暂归零）、
    交互级涌现声称按当前构造不成立、三处口径/注册缺口均为 required 级。

  standard_red_flags:
    1_brick_conclusion:
      verdict: pass_with_concern
      note: |
        独立复核父推论原文。DED-030 的结论已给出"定价权在存量持有者保留价格边际分布+
        持有者弹性分层（首饰≈央行 < 金条金币 < ETF）"，且其步骤 5(c) 明写金条金币
        "跌价时可能抄底买入（counter-cyclical）"——即 DED-030 自己已含买入行为的弹性
        描述。DED-029 只给四引擎方向预测，显式把多因素交互让渡给 L4。
        "gate 比率构造 + gate-弹性单调性"这两个命题字面上不在任何一块砖里——通过。
        concern：命题的机制内核"买卖双边都低弹性时单位流量的价格冲击更大"极接近
        教科书微观（双边弹性决定价格调整幅度）+ DED-030 自己的持有者分层的直接应用——
        非平凡性几乎全部压在 gate 的可测构造与单调性检验上，而后者目前有旗 3/7/11 的
        缺陷（见下）。与旗 12/13/14 连动。

    2_cell_empty_prediction:
      verdict: pass
      note: |
        招牌格预测（gate > 0.7 且高弹性卖出低 → 单位需求冲击价效应最大）是真经验主张，
        不被任何砖平凡强制——可被"gate 高但弹性平平"的现实窗口填上（falsifiability (d)
        给了可执行裁决）。空格是活的。通过。

    3_measurement_orthogonal:
      verdict: needs_revision
      severity: required
      note: |
        两处焊点风险，其一未披露且与文件的自我声称矛盾：
        (i)【变量共享未披露】gate 的构成变量（央行购金、金条金币、ETF 流量）与
        price_impact_elasticity 的分母（净需求变动量 = 央行+金条金币+ETF+其他制造）
        共用同一批 WGC 流量系列——自变量与被预测量的分母高度重叠。文件却在
        discriminant_validity 里宣称"不面临 L4-009 的变量共享困境（gate 分子分母正交）"
        ——这只回答了 gate 内部的正交性，回避了 gate 与结果变量分母的共享。共享的
        机械后果复杂（可能偏向也可能偏离假说），但按 L4-009 判例，共享必须显式披露
        并给出方向性分析，不得以"分子分母正交"的措辞盖过。
        (ii)【符号结构的机械满足风险】gate 高 ≈ 低弹性净买入主导 → 净买压 → 价格倾向
        上行 → 弹性（ΔlogP/净需求）为正；gate 低 ≈ ETF 净流出主导 → 价格倾向下行，
        而分母（含逆周期的金条金币买入）仍可为正 → 弹性为负。若裁决 (a) 的"Q4 平均
        弹性 > Q1 平均弹性"按带符号弹性比较，则 Q4 > Q1 在相当程度上由符号结构近乎
        机械地强制（高 gate 窗口弹性为正、低 gate 窗口弹性为负），检验退化为
        "gate 高 ↔ 价格在涨"——这不是放大器强度命题，是买卖压力方向的复述。
        命题的真正内容要求比较【幅度】（|ΔlogP|/|流量|），但符号/绝对值口径未注册
        （归旗 11 / RF-1）。

    4_excluded_outcomes:
      verdict: needs_revision
      severity: required
      note: |
        注册的五条排除本身按事前渠道划分（点位/高频/供给冲击/低弹性净卖出/回收金弹性
        边界），合格。但反例消化引用了【不存在的排除条款】：
        (i) 2008 年下半年反例的消化写"属于 excluded_outcomes 的'市场微观结构/流动性
        危机驱动'情形"——逐条核对 excluded_outcomes，无任何流动性危机条款；最接近的
        第 2 条只排除"日内/周度高频波动"，而 2008 年 9–12 月是季度尺度的走势，不在
        其字面内。这是对未注册排除的事后引用——DED-005 型缺陷。
        (ii) 2020 COVID 锚点写"此边界已被事前识别（非事后开脱，见 boundary_cases）"
        ——逐条核对 boundary_cases（gate≈0.5 区/2010 前数据/金条金币非对称弹性），
        无物理结算瓶颈条目。声称的注册位置查无此条。
        两项豁免（流动性危机、物理/物流瓶颈）都属"gate 假设市场正常运作"的调节变量，
        必须事前注册且各配独立可编码触发判据（如跨资产融资压力指标越 2σ、精炼厂停工
        的可注日期事件），并计入 L4 调节变量预算——注册后即用满 2/2，此点须显式声明。

    5_classification_bin_match:
      verdict: pass
      note: |
        连续量配秩检验/四分位比较，不设离散阈值——档位设计与被救对象（连续的门控强度）
        匹配。这是本条对 L4-009 的真实方法论改进，四分位边界事后确定不影响秩检验效度的
        论证也成立。通过。

    6_anti_talisman:
      verdict: pass_with_concern
      note: |
        五条护身符方向正确且硬：gate 禁由金价反推、口径一次性定死+事后歧义反向裁决、
        引擎信号独立判定、模糊干扰不构成消化、口径修订消耗唯一信用并记 retrofit——
        条款文本是全体系里最严的之一。
        concern：护身符的精神在支持锚点上已经失守——锚点算术使用的流量口径
        （"央行净购金扣除 ETF 净流出后的净增约 1000 吨"）与 operationalization 注册的
        弹性分母（央行+金条金币+ETF+其他制造）不一致，窗口口径（累计 vs 年化）也未
        统一。条款 (1)(5) 写了"口径定死"，但被定死的只有 gate；弹性口径留了自由度，
        而锚点恰好用了对推论有利的那种算法。归旗 7 与 RF-1。

    7_real_world_anchor_fact_check:
      verdict: needs_revision
      severity: required
      note: |
        逐项核查。属实的部分：央行购金 2022≈1082 / 2023≈1037 / 2024≈1045 吨（WGC）；
        金条金币 2022–24 约 1200–1300 吨/年；2013 年 ETF 净流出约 880–900 吨、金价约
        −28%、央行约 600–625 吨、金条金币约 1700 吨；2011 年央行 457 吨、ETF 净流入
        约 185 吨、金条金币约 1500 吨；2008 年 9–12 月价格轨迹；2020 年精炼厂停工。
        以上与 WGC 公开数据一致。
        【两处事实/算术问题，第一处为承重错误】：
        (i)【单位流量对比的口径不一致——旗舰锚点的支持方向依赖口径选择】
        锚点给出"2022–2024 约 +0.05%/吨净增 vs 2013 约 −0.03%/吨净减"。复算：
        0.05%/吨只能由【三年累计】价格变动（约 +50%）除以【单年】流量（约 1000 吨）
        得到；而 2013 的 0.03%/吨是【单年】价格变动除以【单年】流量。两窗口用了
        不同的时间口径。统一为年化口径：2022–24 年均价格变动约 +13–17%，年均流量
        按锚点自己的"净增量需求约 1000–1100 吨"计 → 约 0.012–0.017%/吨；2013 为
        28%/900 吨 ≈ 0.031%/吨。低 gate 窗口的单位流量冲击幅度约为高 gate 窗口的
        2 倍——旗舰对比【方向反转】。
        若改用 operationalization 注册的分母（央行+金条金币+ETF+其他制造），反转更甚：
        2013 分母 ≈ 625+1700−900 ≈ +1400 吨、|ΔlogP|≈33% → ≈0.024%/吨；2022–24
        分母 ≈ 1050+1250−100 ≈ +2200 吨/年、ΔlogP≈12–16%/年 → ≈0.006%/吨。
        差距约 4 倍，仍是反转。且注意：2013 按注册分母净需求为正而价格暴跌——带符号
        弹性为负，"单位需求的价格冲击"在该窗口如何计入 Q1/Q4 比较完全取决于未注册的
        符号处理。按第 11 条判例（事后口径选择反向裁决），两大锚点当前不得计为支持。
        (ii)【2011 回收金数字偏低】2011 年全球回收金约 1600–1660 吨（金价历史高位
        驱动回收激增），锚点用约 1300 吨 → gate 应为 (457+1500)/(457+1500+0+1650)
        ≈ 0.54 而非 ≈0.60。方向不变，should 级修正。

    8_definition_vs_prediction:
      verdict: pass_with_concern
      note: |
        gate-弹性单调性是可证伪预测非定义；falsifiability (a)–(e) 各有可执行判别，
        (a) 预注册了统计方法与样本门槛，(d) 给了比 (a) 更严的招牌格序关系——证伪
        条款的工程质量高于多数存量推论。
        concern：符号结构可能使 (a) 部分机械化（见旗 3(ii)）——在符号/绝对值口径
        注册前，(a) 的"预测"成色打折。归 RF-1。

    9_enumeration_exhaustiveness:
      verdict: needs_revision
      severity: required
      note: |
        gate 声称覆盖边际流量活动的双边（低弹性买入 vs 高弹性卖出）。主动猎第 N+1 类，
        猎获两项：
        (i)【矿产供给】年约 3500–3600 吨、永远在场的卖方流量，量级超过 gate 分母中
        ETF 流出与回收金之和——gate 分母完全不含。后果：gate → 1 并不意味着"高弹性
        卖出近乎为零、必须从低弹性持有者手里抢货"——矿产新供给每年吸收约 3600 吨
        需求，"双向低弹性夹击"的招牌格论证在矿产流量在场时被稀释。DED-030 说生产者
        不能【快速增产】，但没说年流量不存在——省略矿产流量是一个未辩护的口径选择。
        (ii)【WGC "OTC 及其他投资"项】2023–2024 年该项达数百吨/年（家族办公室/高净值
        /机构场外购金，WGC 明文单列），是近年最大的需求分项之一——弹性归类不明，
        gate 分子分母均不含。主权基金漏网风险文件已自认（primary_suspect (ii)），
        但 OTC 大项的存在使"漏网"不是尾部风险而是主流量级缺口。
        两项均须纳入或给出事前可辩护的省略理由，否则 gate 的"总边际流量活动"定义
        名不副实（一致性原则——能力与名称一致）。

    10_primary_suspect:
      verdict: pass_with_concern
      note: |
        文件自认的最弱腿（引擎→买家弹性映射为自制经验赌注）指得准，且诚实标注了
        映射不在 DED-029 原文——这份诚实是本条的加分项。secondary（金条金币动机
        混合）与 unlikely（S/F 事实、WGC 数据质量）定位合理。
        concern：更致命的软肋文件没认——弹性口径的未注册自由度（旗 7/11）与 gate
        口径的矿产/OTC 缺口（旗 9）都排在"映射对不对"之前受检：口径不定，映射对错
        根本无法被检验。primary_suspect 排位应修正。

    11_caliber_registration:
      verdict: needs_revision
      severity: required
      note: |
        gate 的口径注册质量高（分子/分母/来源/符号处理一次性定死+修订信用条款）——
        这半边合格。但被预测量 price_impact_elasticity 的口径存在三个未注册自由度：
        (i) 符号 vs 绝对值（带符号比较会被符号结构机械化，见旗 3(ii)）；
        (ii) 窗口口径（年化 vs 多年累计——旗舰锚点恰好两窗口用了不同口径，且选法
        有利于推论，见旗 7(i)）；
        (iii) 流量分母口径（注册的"央行+金条金币+ETF+其他制造" vs 锚点实际使用的
        "央行−ETF"——两者给出的单位冲击相差数倍）。
        按第 11 条判例：发现"只有数字没有口径"→ required；口径歧义一律按不利于
        推论方向裁决 → 两大锚点的单位流量对比暂裁为【反向证据候选】而非支持。

  l4_exclusive_red_flags:
    12_spectator_brick:
      verdict: needs_revision
      severity: required
      note: |
        逐一移除检验（亲自做）：
        【移除 DED-030】gate 仍可算，但"gate 高为何冲击大"失去供给结构论证——文件
        自己的 necessity 论证成立，DED-030 承重真实。无问题。
        【移除 DED-029】文件声称 gate 分子的选择（央行+金条金币）"丧失理论基础"。
        不成立——DED-030 步骤 5 自己就给出：(b) 央行极低弹性、(c) 金条金币弹性介于
        首饰与 ETF 之间且跌价时逆周期买入、(d) ETF 中高弹性。gate 的身份类别及其
        弹性排序【完整地】来自 DED-030 的持有者分层，不需要 DED-029 的任何内容。
        操作层面更严重：gate 的计算"完全由 WGC 实物流量数据构造"（文件原文），
        引擎信号只进入 buyer_elasticity_profile——一个明文"不用于 gate 计算"的
        一致性核查。DED-029 对可测内核的操作负载为零。
        文件对 DED-029 的实际使用是"引擎→买家类型→弹性"映射——而这个映射文件自认
        "不是 DED-029 原文的内容"（primary_suspect 第一段）。即：DED-029 的承重
        贡献经由一座自制桥，桥本身是 L4-010 的经验赌注。
        DED-029 不是纯装饰（falsifiability (c) 把引擎信号缺失设为 rejected 条件，
        防循环条款引用其独立测量轴）——但"出现在证伪条款的可选核查里"不等于
        "对结论有不可替代的机制贡献"。消解路径（二选一）：
        (a) 引擎信号承重化——把"C3/C2 至少一个独立激活"写进招牌格判定与检验窗口
        资格的必要条件（不只是高 gate 窗口的事后核查）；或
        (b) 诚实降格——承认买家弹性分类操作上取自 DED-030 分层，DED-029 经自制桥
        提供动机解释，涌现类型降为 conjunction、天花板 verified（薄涌现）。

    13_trivial_conjunction:
      verdict: pass_with_concern
      note: |
        结论不是父结论的 AND/OR 拼接——"放大倍数是需求构成的单调函数"这个命题
        在两父的字面之外，文件的 novelty 论证 (a)(b)(d) 成立。不判平凡合取。
        concern：机制内核"双边都不肯让价时价格必须多动才出清"是标准微观常识的
        应用；把非平凡性与常识区分开的唯一东西是 gate 的具体可测构造与单调性
        检验——而这正是旗 3/7/9/11 打中的部位。修好口径，非平凡性成立；修不好，
        本条退化为"教科书弹性逻辑 + DED-030 分层"的复述。

    14_emergence_missing:
      verdict: needs_revision
      severity: required
      note: |
        独立重做 2×2 逐格判空（买方弹性{低,高} × 卖方弹性{低,高}）：
        【格 [买高, 卖高]】平凡格，DED-030 单独覆盖——同意文件归属。
        【格 [买高, 卖低] / [买低, 卖高]】文件称需两父合力。复核：卖方弹性腿来自
        DED-030（无争议）；买方弹性腿——ETF 高弹性、央行/金条金币低弹性——同样
        写在 DED-030 步骤 5 的持有者分层里。文件的辩护是"DED-030 假设持有者不管
        买卖都同弹性，买方弹性由动机（引擎）决定"——但这个"动机决定买方弹性"
        恰是自制桥（旗 12），且 gate 的测量根本不区分动机、只区分身份。按 gate
        的实际构造，这两格可由 DED-030 分层 + 标准双边弹性逻辑填满。
        【招牌格 [买低, 卖低]】同上——"央行在买、ETF 没在卖、回收金没激增 →
        冲击最大"的判断所需的全部弹性标签都在 DED-030 分层内。DED-029 的不可
        替代贡献收缩为"为什么低弹性买家【此刻】入场"（C3/C2 激活）——这是动机
        解释与时序预测（预测 iii 的先行性），不进入招牌格的静态填格。
        结论：按当前操作化，需要 ≥2 父合力的格子数存疑趋零——本条有退化为
        "DED-030 的扩展（L3 chaining）+ 一条自制买方弹性假说"的真实风险。
        interaction（厚涌现）声称不成立；文件自设的降格条款（单调性检验不支持时
        降为 conjunction）触发条件写的是经验检验失败，但本审查在【构造层面】就
        判定交互级不达标——除非执行旗 12 的消解路径 (a)（引擎信号承重化，使
        DED-029 的测量轴真正进入格子判定），否则涌现至多为合取级、状态天花板
        verified（薄涌现），且合取级资格本身也依赖 RF-1/RF-4 修复后单调性命题
        仍站得住。

    15_weak_parent_premise:
      verdict: pass
      note: |
        DED-029 [verified]（ADV-REVIEW-035 r1 verified）、DED-030 [verified]
        （ADV-REVIEW-032 r1 needs_revision → r2 verified），INDEX 确认，无 candidate
        父前提。诚实记录：DED-030 自我声明"核心独有预测零经验检验、well-formed
        hypothesis"——按体系规则 verified 即合格作父，但这意味着 L4-010 的地基里
        有一块方法论合格、经验未证实的砖，置信度天花板论证时不应再往上加码。通过。

    16_anchor_theft:
      verdict: needs_revision
      severity: required
      note: |
        Rule G 要求至少一个复合特有锚点（不能被任何单父单独解释）。本条的复合特有
        内容 = 两窗口的【单位流量冲击差异】——而该差异的算术在旗 7/11 下失效
        （口径统一后方向反转）。剥掉这个差异后剩下什么：
        - 2022–24 锚剩"央行大买 + 金价涨"——这接近 DED-029 C3 的方向预测（央行
          购金潮本身就是 C3 通道的表达；DED-029 把该窗口标为引擎冲突出射程，但
          "低弹性需求增 → 价涨"的定性方向 DED-030 预测 (iii) 也已覆盖）；
        - 2013 锚基本复用 DED-030 自己的 anchor #2（ETF 流出事件），且文件自己
          承认该窗口 gate≈0.51 缺乏区分力、需要"有效 gate 实质偏低"的口头修正——
          一个需要绕开自家指标读数的锚点不是干净对照。
        当前状态：无幸存的复合特有锚点，Rule G 不满足。修复取决于 RF-1——若统一
        口径重算后单位流量差异真实存在且方向正确，复合特有性即恢复；若反转坐实，
        本条失去 Rule G 资格并直接面对活反例。

    17_interaction_measurement_gap:
      verdict: pass_with_concern
      note: |
        复合输出（gate-弹性斜率/秩相关）原则上是区别于"DED-029 单独（方向对错）+
        DED-030 单独（有无放大）"的第三个可测量——测量缺口在设计上不存在，这是
        本条优于多数 L4 的地方。
        concern：该测量的两端目前都有伤——gate 端缺矿产/OTC（旗 9），弹性端口径
        未注册（旗 11）；且测量中不含任何 DED-029 内容（旗 12），故当前能测到的
        交互是"DED-030 分层 × DED-030 分层"的买卖双边交互，不是"DED-029 × DED-030"
        的跨父交互。随 RF-1/RF-2/RF-4 修复。

    18_claim_type_evidence_mismatch:
      verdict: needs_revision
      severity: required
      note: |
        claim_type = phase_transition，其注册证据标准是"阈值两侧案例对比证据"。
        但本条的整个设计卖点（对 L4-009 的改进）就是【无阈值、无离散体制、连续
        单调门控】——statement 原文："不预设放大器开/关的二元状态，不注册阈值"。
        类型标注与主张结构自相矛盾：一个自我声明没有相变的推论标了相变类型，
        永远无法满足相变类型的证据标准。现有枚举里最接近的是 trajectory_prediction
        （纵向序列证据——gate 序列 vs 弹性序列的单调/先行关系恰好对应）；或按
        反馈流程向架构侧提出增补"dose_response/连续调节"类型。改标签是小改，
        但按第 18 条属 required——类型-证据错配不修，检验标准就锚在错误的靶上。

  counterexample_hunt: |
    按 L4 版要求，猎"父推论都成立、但交互不产生 L4 预测"的案例。三个猎场：

    【猎获一（最重）：2013 vs 2022–24 的口径统一重算——旗舰对比反转】
    2013 年 DED-029 成立（C1 主导、方向预测对）、DED-030 成立（需求端驱动价格）——
    两父都活着。L4-010 预测低 gate 窗口单位流量冲击应【小】。统一年化口径复算
    （无论用锚点自己的流量口径还是注册分母口径）：2013 ≈ 0.024–0.031%/吨，
    2022–24 ≈ 0.006–0.017%/吨——高弹性主导窗口的单位冲击反而是低弹性主导窗口的
    2–4 倍。这不是最终净杀（全样本四分位检验未跑；2013 的金条金币逆周期买入使
    分母内生膨胀，作者有一条可辩护的消化路径——但该路径要求修改弹性分母口径，
    而口径修订按 anti_talisman (5) 消耗唯一重校准信用且方向须事前可辩护）。
    当前裁决：按第 11 条反向裁决原则，该对比暂记为反例候选而非支持证据。
    归类：交互本身的问题（非父推论被推翻）——直接打在 L4 的核心可测命题上。

    【猎获二：2008 年下半年——gate 高位 + 价格暴跌，靠未注册排除消化】
    2008 Q3–Q4 两父均成立（DED-029 的 C1/C3/C4 同向看涨——其自家锚点即用此窗口；
    DED-030 结构在场），gate 按构造应处高位，但金价 −24% 后才反弹。文件引用
    不存在的"流动性危机"排除条款消化（旗 4）。在该排除被事前化注册之前，
    2008H2 是 scope 内的活反例；注册后转为射程豁免，但消耗调节变量预算。

    【猎场三：矿产流量稀释招牌格——构造性反例】
    构造：某窗口央行+金条金币净买 500 吨/季、ETF 零流出、回收金低位 → gate ≈ 1、
    放大器"全开"。但同期矿产供给约 900 吨/季全额在场——低弹性买家根本无需从
    低弹性持有者手中抢存量，边际卖家是矿商产出而非"不肯让价的持有者"，
    "双向低弹性夹击"的出清逻辑不触发。该构造表明 gate → 1 不蕴含招牌格的机制
    前提（可卖存量枯竭），除非 low_inflow 显著超过矿产+回收的流量供给——而这个
    条件不在 gate 里。归 RF-4（可通过把矿产流量纳入分母或加流量覆盖率条件修复）。

    净结论：无已坐实的净杀，但猎获一在注册口径的自然读法下方向反转、猎获二在
    当前注册状态下是活反例、猎获三揭出招牌格论证的构造缺口——三者共同支撑
    needs_revision 而非 verified。

  emergence_cell_analysis: |
    亲自逐格判空归属（详见旗 14）。裁决：按 gate 的实际构造（纯身份类别、纯 WGC
    流量），四格的弹性标签全部可由 DED-030 步骤 5 的持有者分层供给，DED-029 的
    测量内容不进入任何格子的判定——"需要 ≥2 父合力"的格子数按操作化字面趋零。
    DED-029 的真实贡献（动机解释 + 引擎独立核查 + 先行性预测 iii）是有价值的，
    但按当前布线属辅证而非承重。交互级涌现声称不成立；合取级资格在 RF-2 消解
    路径 (a) 执行后可重估为交互级，路径 (b) 执行后定格为合取级。

  non_recurrence: |
    DED-004（不可证伪循环）：未重蹈——falsifiability (a)–(e) 有可执行裁决点，
    anti_talisman 五条款硬。但旗 3(ii) 的符号机械化风险若不修，(a) 有部分自证倾向。
    DED-007（测量轴焊死）：部分风险——gate 与弹性分母共享 WGC 流量系列且未披露，
    反而声称无变量共享困境（旗 3(i)）。非全焊死（ΔlogP 来自 LBMA，异源），
    但共享必须披露并做方向性分析。
    L4-009（口径未注册反向裁决判例）：本条 gate 半边吸取了教训，弹性半边重蹈了
    ——被预测量的窗口/符号/分母三个自由度未注册，且锚点算术恰好用了有利口径。

  required_fixes:
    - "RF-1（旗 3/7/11）：price_impact_elasticity 口径一次性注册——(a) 绝对值口径（|ΔlogP|/|流量|）或明确的符号处理规则；(b) 统一窗口口径（年化）；(c) 分母与 operationalization 注册口径一致（锚点算术当前用'央行−ETF'，注册的是'央行+金条金币+ETF+其他制造'）。然后按注册口径重算两大锚点——若 2013 反转坐实，锚点转入 counterexamples 并直面消化，不得静默改口径（消耗重校准信用条款自动适用）。"
    - "RF-2（旗 12/14）：DED-029 观众砖消解，二选一——(a) 引擎信号承重化：C3/C2 独立激活写进招牌格判定与检验窗口资格的必要条件，使 DED-029 测量轴真正进入可测内核；或 (b) 涌现声称降格为 conjunction + 显式披露'引擎→买家弹性映射'为自制承重桥，状态天花板改为 verified（薄涌现），emergence_type 与 statement 的厚涌现段落同步改写。"
    - "RF-3（旗 4）：流动性危机与物理结算瓶颈两项射程豁免事前注册进 excluded_outcomes/boundary_cases——各配独立可编码触发判据（如跨资产融资压力指标、可注日期的精炼/物流中断事件），并显式声明调节变量预算用满 2/2；注册前 2008H2 按活反例记账。"
    - "RF-4（旗 9 + 猎获三）：gate 口径缺口——矿产供给（~3600 吨/年卖方流量）与 WGC 'OTC 及其他投资'项（2023–24 数百吨/年）纳入 gate 或给出事前可辩护的省略理由；招牌格论证补'低弹性买入 vs 流量供给覆盖率'条件，否则 gate→1 不蕴含存量争夺。"
    - "RF-5（旗 18）：claim_type 改注——phase_transition 与'无阈值连续门控'设计自相矛盾，改 trajectory_prediction（纵向 gate-弹性序列证据）或走反馈流程增补连续调节类型。"

  should_fixes:
    - "2011 年回收金约 1600–1660 吨（非 ~1300），gate ≈ 0.54 非 ≈0.60，重算并复核对该反例分析的影响。"
    - "gate 与弹性分母的 WGC 流量系列共享显式披露 + 方向性分析；删除/修正 discriminant_validity 中'不面临变量共享困境'的过度声称。"
    - "statement 中'min(CAP)=3 → verified*'表述与 METHODOLOGY 的映射不符——CAP=3 对应 verified；verified* 由涌现类型（interaction + ≥2 合力格 + 无外部承重桥）决定，而非 CAP 值。按 RF-2 的结果改写。"
    - "primary_suspect 排位修正：弹性口径自由度与 gate 流量覆盖缺口先于'映射对不对'受检——口径不定则映射不可检验。"

author_response_round_1:
  date: 2026-07-15
  responder: "整改者（独立上下文，非 round_1 审查者）"
  summary: |
    5 条 required 全部处理，无一朝隐藏方向消解；其中 RF-1 与 RF-2 按"对推论不利"
    方向落地。逐条：
  responses:
    - rf: RF-1
      action: |
        接受。price_impact_elasticity 口径一次性注册（绝对值 |ΔlogP|/|流量|、一律
        年化、分母锁定为注册的"央行+金条金币+ETF+其他制造"），带符号弹性仅作独立
        方向核查、不进幅度比较（封死旗 3(ii) 符号机械化）。按注册口径重算两大锚点：
        反转坐实——2013 ≈ 0.024–0.031%/吨 vs 2022–24 ≈ 0.006–0.017%/吨（2–4 倍）。
        作者【不启动】口径挽救：审查者指出的消化路径（2013 分母被金条金币逆周期买入
        内生推高）确实存在，但启动它需修改注册分母、消耗唯一重校准信用，且在已见
        反转结果后启动即属事后挑口径（第 11 条红线）——两锚点整体移入
        counterexamples 作 counterexample_candidate，rule_g_note 显式声明 Rule G
        当前不满足、核心命题为证据状态不利的待检验假说，存亡交 falsifiability (a)
        全样本四分位检验。附带修复变量共享披露（should-2）：共享的机械偏误方向
        经分析为压低高 gate 组弹性（不利于本条预测），故不伪造支持、但放大逆周期
        窗口反例表观强度——已写入 operationalization。
    - rf: RF-2
      action: |
        接受，选路径 (b) 诚实降格（非路径 a）。理由：在旗舰锚点已反转、单调性检验
        未跑的证据状态下，以引擎信号承重化来保住厚涌现声称，实质是为救结论而改布线
        ——与"宁可毙掉弱推论不放水"的最高原则相悖。落地：emergence_type →
        conjunction；statement 涌现段、derivation 步骤 3(c)/4、emergence_demonstration
        全部同步改写；"引擎→买家弹性"映射全文显式标注为自制承重桥；v1 的"3 个静态
        合力格"声称撤回（承认四格弹性标签全部可由 DED-030 步骤 5 供给）；合取级
        资格改为依托先行性时序腿（预测 iii 需 DED-029 引擎-惯性内容 + DED-030 放大
        结构合力）——该时序腿是否满足 METHODOLOGY 合取级条件 (c) 的原意，作者不
        自行裁定，显式留给 round_2；裁定不满足则本条无 L4 资格、应 rejected。
        天花板改 verified（薄涌现），should-3 的 verified* 表述一并修正。
    - rf: RF-3
      action: |
        接受。流动性危机（触发：TED/FRA-OIS > 10 年均值+2σ 且 VIX 季均 > 40）与
        物理结算瓶颈（触发：可注日期精炼/物流中断 ≥ 全球产能 10% 持续 ≥2 周，或
        EFP 超 99 分位）两豁免注册入 excluded_outcomes，判据均独立于金价与 gate。
        预算声明 2/2 用满、今后新豁免一律不得注册。2008H2 诚实记账：注册前为活反例；
        判据回溯满足（2008Q4 TED >4%、VIX >50），但注册对该案属事后，status 定为
        live_counterexample_pending，round_2 复核后方可转 boundary_case——不单方面销账。
        COVID 锚点的不实声称（"见 boundary_cases"）已更正并标注该锚点不计入任何支持。
    - rf: RF-4
      action: |
        接受。矿产供给不塞入 gate 分母（塞入会错标其弹性——矿产是低弹性新流量而非
        高弹性持有者卖出），改为：(i) gate 名称收窄为"持有者边际流量构成比"（一致性
        原则）；(ii) 新增独立注册的 flow_coverage 条件（low_inflow / 扣除首饰工业后
        的剩余流量供给 > 1）作为招牌格的存量争夺前提，falsifiability (d) 同步更新。
        OTC 项给出事前省略辩护（弹性异质+WGC 残差项估计质量低），配注册触发
        （OTC > 300 吨/年的窗口须标注+剔除敏感性检验）。诚实代价已记入 Epistemic
        Status：2022–24 粗算 flow_coverage ≈ 0.9–0.95，v1 旗舰窗口连招牌格资格都
        未清晰满足。
    - rf: RF-5
      action: "接受。claim_type → trajectory_prediction（纵向 gate 序列 vs 弹性序列证据），与连续门控设计一致。"
  unresolved_for_round_2:
    - "合取级资格裁决：静态合力格趋零已承认；先行性时序腿（预测 iii 需两父合力）能否满足 METHODOLOGY 合取级条件 (c)（原意面向静态笛卡尔积格）——作者不自行裁定。若不满足，本条应 rejected 或降写为 DED-030 的 L3 扩展。"
    - "RF-1 反例候选的最终裁决依赖 falsifiability (a) 全样本四分位检验（样本门槛每组 ≥8 季度）——本轮未执行统计检验，仅完成口径注册与锚点重算/降格。"
    - "2008H2 的 live_counterexample_pending → boundary_case 转换需 round_2 复核豁免判据的回溯核对。"

round_2:
  round: 2
  reviewer: "独立对抗审查者 (全新上下文, round 2, 与作者及 round_1 审查者无关)"
  date: 2026-07-15
  verdict: rejected

  verdict_note: |
    存亡裁决轮。五条 required 的整改本身全部诚实落地（逐条核验见下），无一处朝隐藏
    方向消解——这是底线，不是加分项。杀死本条的不是证据状态不利（"待检验"在本体系
    是合法状态——DED-030 自己就是以"well-formed 零经验检验假说"的身份 verified 的），
    而是层级资格：r1 旗 12/14 判定的观众砖/涌现缺失，经作者选择消解路径 (b) 后
    【被诚实披露、但没有被消解】——整改后的推论把 L4 资格全部押在先行性时序腿
    （预测 iii）的"两父合力"上，本轮独立裁决该腿不满足 METHODOLOGY 涌现条件 (c)，
    理由有四（详见 existential_ruling）：(1) 条件 (c) 的原意与操作化检验（构建父推论
    自变量的笛卡尔积表格、逐格标注归属、审查者必须亲做逐格判空）明确面向静态格，
    时序命题不是该积空间中的格子；(2) 即便按最宽读法（"任一预测需两父合力"也算），
    DED-029 对预测 (iii) 的贡献仍然全部经由"引擎→买家弹性"这座 L4-010 自制承重桥
    输入——与静态格被判死的缺陷同型同源，宽读法救不了它；(3) 预测 (iii) 的注册检验
    （falsifiability e：gate 对弹性的 Granger 先行）中不含任何 DED-029 测量轴的内容
    ——合力声称在操作层面测不到；(4) 文件自己把 (e) 标为 should 级、其失败不影响
    核心机制——L4 资格不能悬挂在一条连本条自己都不视为承重的腿上（否则会出现
    "L4 资格被证伪而推论无恙"的自相矛盾结构）。
    条件 (c) 归零 → 按旗 14 的语义"归零 = 这不是 L4，是 L3 chaining"，且作者已
    事前承诺"裁定不满足则本条无 L4 资格，应 rejected"。剩余的可测内核（gate 构造 +
    注册口径 + 单调性检验 (a)）干净、可证伪、有真经验内容——但它是一条以 DED-030
    为唯一承重父的单机制扩展命题，属 L3 chaining deduction 的射程，留在 L4 层
    是层级错位。裁决：L4-010 rejected（层级资格塌陷，非证据净杀）；可测内核可按
    salvage_path 以新 L3 推论身份重新立项走完整 DED 管线（非本条复活）。

  required_fix_verification: |
