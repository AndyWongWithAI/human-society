    一律年化 / 分母锁定"央行+金条金币+ETF+其他制造"）一次性注册，带符号弹性隔离为
    独立方向核查，封死 r1 旗 3(ii) 的符号机械化。本审查独立重算核对反转算术：
    2013 |ΔlogP|≈33%、注册分母≈625+1700−880+420≈1865 吨 → ≈0.018%/吨；
    2022–24 年均 |ΔlogP|≈12–17%、注册分母≈2300–2500 吨/年 → ≈0.006%/吨。
    反转坐实（约 3 倍），与整改陈述一致。两锚点移入 counterexamples 作候选、
    rule_g_note 声明 Rule G 不满足、不启动口径挽救——第 11 条判例执行到位。
    【RF-2 涌现降格】形式上已落地（emergence_type=conjunction、自制承重桥全文标注、
    静态合力格撤回、天花板改 verified），作者显式把合取级资格的存亡留给本轮——
    该存亡问题本身在 existential_ruling 裁决为不满足。故 RF-2 的处置是"诚实披露
    缺陷"而非"消解缺陷"——按 rubric 裁决语义，观众砖无法消解属 rejected 级核心塌陷。
    路径 (a)（引擎信号承重化）作者弃用的理由（在锚点已反转的证据状态下改布线属
    为救结论而重接线）本审查认可——在 r2 强推路径 (a) 同样构成 motivated rewiring，
    且改布线后的推论实质是一条新推论，需全新推导与全新审查，不是 L4-010 的修订。
    【RF-3 豁免注册】已消解。两豁免判据独立可编码（TED/FRA-OIS>10 年均值+2σ 且
    VIX 季均>40；精炼中断≥10% 产能持续≥2 周或 EFP 超 99 分位），预算 2/2 显式用满。
    2008H2 回溯核对（本轮亲验）：2008Q4 TED 峰值≈4.6%（10 年均值≈0.5%、+2σ 约
    1.5–2%，远超）、VIX 季均≈58>40——判据事实满足，live_counterexample_pending →
