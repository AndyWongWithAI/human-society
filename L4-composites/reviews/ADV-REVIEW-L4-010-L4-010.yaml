  counterexample_hunt: |
    照常猎捕（按 L4 版要求猎"父推论都成立、交互不产生预测"的案例），并检查
    整改是否引入新缺陷。两项猎获：

    【猎获一：flow_coverage 与 gate 在仅有的两个已检窗口中反相】
    亲算：2013 年 flow_coverage = low_inflow 2325 吨 /（矿产 3050 + 回收 1260 +
    ETF 流出 880 − 首饰 2700 − 工业 420）≈ 2325/2070 ≈ 1.12 > 1——低 gate 的
    2013 反而满足存量争夺条件；2022–24 coverage ≈ 0.92 < 1（文件自算一致）——
    高 gate 的旗舰窗口反而不满足。机制根源：金条金币逆周期买入与首饰逆周期
    买入在价格下跌窗口同时推高 coverage 的分子并压缩分母——RF-4 新增的条件
    与 gate 在跌价窗口系统性反向。这不是净杀（2013 gate≈0.52 未过 0.7，
    signature 格两条件仍双双不满足），但表明整改后的 signature 格两前提在
    现实数据中呈负相关搭配——加剧猎获二的空置怀疑。
    【猎获二：signature 格可能全史空置——整改引入的新缺陷】
    gate > 0.7 在 ETF 零流出时要求季度 low_inflow > 2.33 × 回收金。WGC 时代
    （2010 起）季度回收金约 250–400 吨 → 需季度央行+金条金币净买 580–930 吨、
    即年化 2300–3700 吨——历史峰值（2022–24）年均约 2200–2300 吨，未及下限；
    ETF 一旦流出门槛更高。叠加 flow_coverage > 1 的要求后，1971 年以来
    【可能不存在任何一个满足 signature 格资格的窗口】。后果：falsifiability (d)
    的招牌格预测在可观测历史内不可检验——不是"样本不足待累积"，是资格条件的
    联合可达性存疑。若本条存续，此为 required（须证明资格区可达，或把 (d)
    降为纯前瞻声明并承认招牌格无历史证据基础）；本条 rejected 后记入 salvage
    指引。诚实注明：这恰是 RF-4 把 gate 的隐性缺口显式化后才变得可见的——
    整改是诚实的，缺陷是原生的。
    【复核 r1 猎获一（2013 反转）】独立重算维持：注册口径下低 gate 窗口单位
    流量冲击约为高 gate 窗口 3 倍（0.018 vs 0.006 %/吨），反例候选挂账正确，
    尚非统计净杀（四分位检验未执行）。
    净结论：无新的净杀反例；但两项猎获共同显示——整改后幸存的"独有预测"里，
    (d) 可能不可检验、(iii) 是 should 级、(a) 是唯一真承重检验——而 (a) 检验
    的命题（gate-弹性单调性）恰是那条可以完整立在 DED-030 单父上的命题。
    这从证伪面再次印证 existential_ruling 的层级判定。

