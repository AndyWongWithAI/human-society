    【RF-5 claim_type】已消解，trajectory_prediction 与连续门控设计一致，旗 18 关闭。
    【should 1–4】抽验：2011 回收金 1600–1660 吨/gate≈0.54 已改；变量共享披露 +
    方向性分析（机械偏误压低高 gate 组弹性、不利于本条）已入 operationalization
