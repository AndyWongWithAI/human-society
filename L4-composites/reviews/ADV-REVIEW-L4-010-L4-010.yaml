  existential_ruling: |
    【核心裁决：时序腿不满足 METHODOLOGY 涌现条件 (c)，本条无 L4 资格】
    亲验路径——独立重读 DED-029/DED-030 原文全文 + METHODOLOGY rule_e 原文，
    不依赖 r1 结论转述。

    一、条件 (c) 的原意。rule_e 对 multi_parent_cells 的操作化检验五步写死：
    抽取每条父推论的核心自变量 → 构建笛卡尔积表格 → 逐格标注归属 → 全部非平凡格
    由单父强制则为平凡合取 → 至少一格标注"需 X+Y 合力"才通过。这是静态格语义；
    enforcement 条款要求审查者亲做的也是"逐格判空归属分析"。三级 tier 中 conjunction
    的正例（L4-005 四向分化）里，每条父的【机制内容本身】直接进入合成命题——
    四个方向各自是四条父的字面输出。"时序格"不在任何父自变量的笛卡尔积空间里，
    按原意不可计入 multi_parent_cells。

    二、宽读法核查（对推论最有利的读法）：若把 (c) 放宽为"至少一条核心预测需
    两父合力才能推出"，时序腿过得了吗？过不了，三重理由：
    (1) 预测 (iii) 的机制表述是"机构配置与零售储蓄行为的惯性大于价格发现速度"。
    逐项溯源：央行配置的战略惯性——DED-030 步骤 5(b)（战略储备、极低弹性）已含；
    金条金币储蓄粘性——DED-030 步骤 5(c)（物理持有、交易成本、逆周期）已含；
    "调整价值储藏组合有惯性、以月–年为尺度"——DED-029 的 excluded_outcomes 确有
    此句，但它说的是 E_network 总量的伸缩惯性，不是"需求构成（谁在买）"的惯性。
    把引擎惯性接到"买家构成"上，必须经过"引擎→买家类型→弹性"映射——文件自认的
    自制承重桥、非 DED-029 原文。即：时序腿对 DED-029 的依赖与静态格对 DED-029
    的依赖走的是【同一座自制桥】——r1 旗 12/14 判死静态格的理由原封不动适用于
    时序腿。作者把合力声称从静态格挪到时序腿，缺陷跟着桥一起挪了过去。
    (2) 操作层面：预测 (iii) 的注册检验（falsifiability e）是 gate 序列对弹性
    序列的 Granger 先行性——检验的两端都是 WGC 流量与 LBMA 价格的函数，DED-029
    的四条测量轴（TIPS/盈亏平衡/CDS/VIX）不进入该检验的任何一侧。"需两父合力"
    的命题若在其自身的注册检验里测不到第二父的任何内容，合力就只是推导叙事里的
    修辞（r1 旗 17 的判準：能测到的交互才算交互）。
    (3) 结构自洽：文件自己把 (e) 标为 should 级——"先行性失败不影响核心机制"。
    若 L4 资格系于时序腿，则会出现"(e) 被证伪 → 合取级资格塌 → 本条丧失 L4
    资格，但按文件规则本条核心无恙、无需降级"的自相矛盾。L4 资格必须由承重
    命题背书，不能挂在自认非承重的腿上。

    三、DED-029 的残余角色是否足以构成"不可替代的机制贡献"（rule_e necessity）？
    falsifiability (c) 确以引擎信号缺失为 rejected 条件、防循环条款引用其独立
    测量轴——这是真实的证伪通道贡献，非纯装饰。但 necessity 的检验是"移除后
    结论是否仍成立"：移除 DED-029，gate 构造、弹性标签、单调性命题、招牌格
    条件全部仍可由 DED-030 步骤 5 + 教科书双边弹性逻辑完整立起（作者已在
    necessity 段承认），失去的是动机叙事与一条核查通道——结论本身无恙。
    "为检验提供一条通道"不等于"对结论承重"；r1 已作此裁定，本轮维持。

    四、体系允许"证据状态不利的待检验假说"存活为 candidate 吗？允许——前提是
    该假说具备所在层的资格。本条被杀不在证据（四分位检验未跑、反例候选未坐实
    净杀），而在层级：合取级资格归零后，剩余内核是"主前提实质为 1 条 L3 推论
    （DED-030）+ 自制买方弹性假说"的单机制扩展——METHODOLOGY 边界条款明文：
    "主前提恰好 1 条 L3 推论 + 若干 L1/L2 → L3（chaining deduction），不是 L4"。
    让它以 L4 candidate 存活等于把层级边界让给措辞。故 rejected 是对射程的
    诚实归位，不是对假说价值的否定——可测内核的去处见 salvage_path。

