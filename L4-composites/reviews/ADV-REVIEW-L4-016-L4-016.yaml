round_4:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 4, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（制度信任衰减速率r_trust压缩SOV-MOE解耦窗口）在概念上成立，涌现逻辑（窗口长度作为r_trust的函数而非静态经验值）真实且非平凡。r3已修复大量前轮缺陷：测量链分离（falsifiability a补充跨境汇款/海外资产作为纯外部SOV锚）、政策干预判据预注册（IMF AREAER资本管制+强制结汇+计价货币强制令三档，Venezuela 2016-2021据此排除）、MOE阈值分母预注册（新增合同占比/零售标价占比）、nontriviality扩展为2×2×2含高/低基线调节、纵向检验(c)降级为探索性并补充土耳其/墨西哥案例。但仍有三个未关闭的required/should级缺口挡住verified：(1) 应用域扩展的注册声明虽然在falsification_trace.primary_suspect和derivation.step 6中标注，但"补充机制"段未在depends_on.deductions或emergence_demonstration.novelty中明确标记此为应用域扩展而非原文射程内——这构成红旗14（观众砖/射程声明不完整）的弱命中；(2) 反向失败模式(d)(e)已注册但(f)针对俄罗斯1998/委内瑞拉2018-2021的检验在反例猎捕中发现需要更精细的处理（详见counterexample_hunt）；(3) emergence_demonstration.multi_parent_cell的格子分析承认"快衰减+高基线→短窗口"和"慢衰减+低基线→短窗口"两个非平凡格均需要"双父+基线调节"，但"基线调节"实质上是第三条父推论（BR-L2-009信任衰减梯度或一个未被列为父推论的隐含变量），这构成红旗17（弱父前提/隐藏父推论）的应命中。三条缺口均为可定向修复，不触及核心塌陷，故判needs_revision而非rejected。
  red_flags: |
    1. brick=conclusion：未命中。结论"窗口长度=f(r_trust,记忆滞后,功能替代品可得性)"不是BR-L2-031或DED-028任一父推论的近义复述，焊接产物真实。
    2. 逐格判空：未命中。核心预测"快r_trust→短窗口"是真经验主张，可被跨案例数据证伪，非同义反复。
    3. 测量轴正交（DED-007死因）：部分命中但已修复。r3已补充跨境汇款币种构成、海外资产持有量变动等纯外部SOV锚，MOE锚使用新增合同计价/零售标价（独立于存款数据）。仍残留弱风险：跨境汇款与海外资产持有量高度共因（均反映资本外逃），独立性<1。should级。
    4. 射程/排除钩子独立于结果（DED-005）：已修复。Venezuela 2016-2021按资本管制覆盖率>80%预注册标准排除，方向独立于窗口长度。
