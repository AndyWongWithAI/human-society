    6. anti-talisman真兑现：部分命中但已注册。(1)(2)(3)三条anti-talisman条款明确禁止事后反推，信任测量与冲击烈度均锁定外部标准(V-Dem/WGI/全球金融压力指数)。攻击点：V-Dem法治指数与制度信任的概念重叠度高于作者声明——需在后续修订中补充独立信任锚(如主权CDS利差或IMF Article IV报告信任评分)做三角验证。should级。
    7. 现实锚事实核查（DED-007死因）：未命中致命错。土耳其/津巴布韦/阿根廷三案例的事实陈述经核验基本准确：土耳其2018-2023美元化率从约35%升至约60%的轨迹与公开数据一致；津巴布韦2008-2009闪崩时序与公认史实一致；阿根廷2001corralito与2018-2023窗口差异的对比成立。黎巴嫩2019-2023案例的事实陈述也成立（银行自发资本管制、非正式美元化）。无致命事实错。
    8. 条件是下定义还是做预测：未命中。三条件（无强力政策干预/事前信任基线/SOV-MOE时序）均为可测量的可证伪条件，非同义反复。
    9. 枚举穷尽+species按判据定义（DED-008）：未命中。2×2×2表的8格定义清晰，每格按快/慢×高/低×短/长的判据定义，非按相关但不等价的表征。
    10. primary_suspect指对+平凡化检查：已修复。r3替换了循环的"窗口压缩量=残差"方案，改用事前信任水平分层作为独立分层变量。primary_suspect指对准确。
    11. 口径完整注册+歧义反向裁决（L4-009判例）：基本命中但仍有缝隙。MOE崩塌阈值（新增合同非本币计价>30%/零售标价本币占比<70%）已预注册分母（新增合同总数/零售交易总量）。缝隙：SOV逃离起点的"外汇储备月降幅首次>2σ偏离趋势"未明确分母（是趋势拟合的具体窗口？），跨境汇款/海外资产作为补充锚的阈值同样未注册。should级。
    12. 数据源同根冒充多源独立：未命中。IMF AREAER、Chainalysis、世界黄金协会、V-Dem、WGI均为独立测量链，无共享底层数据源。
    13. API可及性冒充认识论独立性：未命中。无此类风险。
    14. 反向失败模式缺失（DED-039/047判例）：已注册但执行存疑。(d)快r_trust+长窗口、(e)慢r_trust+短窗口均已注册，(f)针对DED-038跨域推理的检验也已注册。攻击点：反例猎捕中发现俄罗斯1998案例同时满足"快r_trust"（1998年8月违约+GKO违约）但MOE崩塌滞后较长（卢布在2001年才完全稳定化），作者在(f)中归因于"功能替代品可得性"调节——但这一归因是事后选择方向救推论，违反L4-009判例精神。required级。
    15. Bootstrap限定缺失（DED-039判例）：未命中。本推论不涉及冷启动/稳态区分。
    16. 验证对象存在性未标注（DED-039判例）：部分命中。津巴布韦2008作为唯一明确闪崩孤例已被标注，闪崩预测已降级为"强趋势而非定量必然"。但黎巴嫩案例在nontriviality中被作为"慢衰减+低基线→短窗口"非平凡格的核心证据——这一案例的实际窗口长度估计存在争议（部分学者认为是bank-imposed capital controls人为延长了MOE崩塌而非自然窗口），需在推论中诚实标注这一争议。should级。

    L4专属红旗：

    14. 观众砖：基本未命中。逐一移除：DED-028单独给出窗口存在但不区分长短，DED-038单独给出SOV逃离加速但不涉及MOE时序。两条父推论均有不可替代的机制贡献。但"基线调节"在multi_parent_cell中作为第三条贡献出现却未被列为父推论——这构成红旗17的弱命中。
    15. 平凡合取：未命中。结论非父推论AND/OR拼接，窗口函数形式是真实涌现。
    16. 涌现缺失：未命中。格(快衰减,高基线,短窗口)需要DED-028+DED-038+基线调节合力，非任一单父可解释。
    17. 弱父前提：命中。BR-L2-031为weakly_verified（status=weakly_verified），DED-028与DED-038均为verified。BR-L2-031作为承重砖之一是weakly_verified，理论上应可接受（BR-L2-031已被上游推论DED-038和DED-042引用且通过审查），但本推论的nontriviality_cell分析中"基线调节"实际指向BR-L2-009（人际信任衰减梯度）或一个未被注册的隐含变量——若基线调节确实是第三条父推论，则当前depends_on不完整。should级。
    18. 锚点偷窃：未命中。土耳其/津巴布韦/阿根廷三锚点各有独立机制叙事，不重复。
    19. 交互测量缺口：未命中。窗口长度作为r_trust的函数可被独立测量，区别于DED-028的静态窗口观测和DED-038的SOV逃离幅度。
    20. 声明类型-证据标准错配：未命中。claim_type为cross_case_pattern，横截面证据与该声明类型匹配；纵向探索性部分已诚实降级。
  counterexample_hunt: |
    猎捕目标1：父推论都成立但交互不产生L4预测的案例。构造：俄罗斯1998。r_trust极快（1998年8月17日GKO违约+卢布贬值触发失信事件，主权违约+银行体系崩溃，制度信任在数周内触底）。DED-028预测SOV-MOE窗口存在；DED-038预测SOV逃离加速。L4预测窗口<90天。但俄罗斯1998的实际窗口约3-6个月（SOV逃离快速但卢布作为MOE在银行重组后仍流通，2001年才完全稳定化）。结果：窗口未达L4预测的"快衰减+极短窗口"。替代解释：俄罗斯拥有高功能替代品可得性（美元现金/外币存款广泛可得）+IMF紧急援助提供的上层锚。作者在falsifiability(f)中已注册此案例并归因于功能替代品调节。评估：归因方向是事后选择——功能替代品作为第三调节变量是在反例出现后才被正式纳入derivation.step 3的（在r1/r2版本中功能替代品未被显式注册）。这违反L4-009判例精神，但作者在r3中已预注册功能替代品口径（黄金储备/人均+外币存款/人均+稳定币流通量/人均），且黎巴嫩案例作为"慢衰减+低基线→短窗口"已被消化。净杀？不。揭出过度伸张？是——闪崩预测的强趋势性需要更精确的功能替代品交互项，而非仅作为事后调节变量。

    猎捕目标2：父推论都不成立的案例（边界检验）。黎巴嫩2019-2023。作者在real_world_anchors.counterexamples中标注此案例为"consumed"，归因为事前基线极低。攻击点：黎巴嫩2019年的银行自发资本管制并非"自然窗口"——它是银行体系作为最后贷款人的失效而非SOV逃离的自然时序。如果将黎巴嫩窗口视为"人为延长+自然缩短"的混合而非纯自然窗口，则该案例不能作为基线调节的支持证据。净杀？不，但过度伸张：是——"事前基线作为独立调节变量"的主张需要更干净的案例支持。

    猎捕目标3：测量轴正交性的硬检验。土耳其2018-2023的SOV锚（美元化率35%→60%）与MOE锚（里拉计价工资合同开始指数化/商铺标价直接用美元）是否真正独立？攻击：两者高度共因——高通胀预期同时驱动SOV逃离和MOE解体。作者在falsifiability(a)已补充跨境汇款/海外资产作为纯外部SOV锚，但土耳其2018-2023的纵向数据中跨境汇款变动幅度远小于美元化率变动——说明本土SOV信号（美元化率）与本土MOE信号（合同计价）仍存在通胀预期共因。净杀？不，但should：补充至少一个跨境/离岸SOV指标作为主锚而非补充锚。

    净杀反例：无。已注册反例：俄罗斯1998（功能替代品调节）、黎巴嫩2019-2023（基线调节）。揭出过度伸张：闪崩预测需要功能替代品交互项的更精确定位（不仅是事后调节变量），黎巴嫩案例不能作为基线调节的干净证据。
  required_fixes:
    - "1. 将DED-038的\"应用域扩展\"（从幅度加速扩展至时序压缩）从falsification_trace.primary_suspect和derivation.step 6的上移至depends_on.deductions注释或emergence_demonstration.novelty首段，明确标注为\"本推论对DED-038的应用域超出其原文射程的扩展\"，并在nontriviality_test中对应格子明确说明\"此扩展是L4涌现的来源而非父推论原文射程\"。"
    - "2. 在falsifiability(f)或reverse_failure_modes中为俄罗斯1998案例预注册功能替代品交互项的判定标准（如：人均外币存款/人均GDP > X% 或 稳定币流通量/人均 > Y 则视为功能替代品充裕，窗口延长），而非仅在反例出现后将其归因为事后调节变量。"
    - "3. 将nontriviality_test中的\"基线调节\"提升为明确的第三条父推论或注册为隐含假设——若选择前者，在depends_on中新增BR-L2-009（人际信任衰减梯度）或一条新的L3推论处理\"事前信任基线对窗口长度的独立调节\"；若选择后者，在anti_talisman_clause中明确\"事前信任基线的事前测量标准已锁定（V-Dem法治指数+WGI法治指标取均值），不因窗口长度测量结果而调整基线分层\"。"
    - "4. 在real_world_anchors.counterexamples的黎巴嫩案例中诚实标注\"该案例的窗口被人为银行资本管制延长，非纯自然窗口，作为基线调节证据存在方法论局限\"，并补充至少一个更干净的\"慢衰减+低基线→短窗口\"案例（如苏丹2018-2021或委内瑞拉2018年Bolívar Soberano重组前的窗口）或明确放弃将此格作为非平凡核心预测。"
    - "5. 在falsifiability(a)中为SOV逃离补充锚的优先级做明确排序：跨境汇款币种构成/海外资产持有量作为主锚，美元化率/外汇储备变动作为补充锚，而非将本土SOV信号与本土MOE信号并列作为主证据——当前r3版本两者仍处于并列位置，通胀预期共因风险未充分隔离。"
  oneline: |
    涌现机制真实且非平凡，r3已修复大量前轮缺陷，但应用域扩展声明不完整、功能替代品交互项预注册缺失、基线调节作为隐藏父推论未明确——三条可定向修复缺口挡住verified。

round_5:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 5, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（r_trust↑→窗口↓）有真东西，DED-028+DED-038焊接真实，涌现非平凡。但有三个required级缺陷挡住verified：(1)L4专属红旗#14观众砖——DED-038的"衰减起点基线"在文件里被反复用作调节变量（步骤3、4、5、nontriviality_test的基线维度），但这条调节机制不是任何一条父推论提供的，而是被偷渡进来的第三轴（"事前制度信任水平"），导致涌现的归属分析被污染——DED-028和DED-038单独都未声明基线是独立调节量，窗口压缩的"两父合力"实际是"两父+一个偷渡的第三变量"合力；(2)L4红旗#18锚点偷窃——real_world_anchors的三个supporting案例（土耳其/津巴布韦/阿根廷）都是事后叙事匹配而非事前独立测量，土耳其案例的"18个月窗口"是文件自己定义的而不是从外部独立数据源测出的，津巴布韦"<90天"同样无独立测量协议，阿根廷两案例的"事前信任差异"也无独立量化；(3)通用红旗#15 Bootstrap限定缺失——所有supporting案例都是事后已发生的危机，无冷启动vs稳态区分，文件未注册"信任缓冲机制的建立需要事前制度信任的长期积累"这一冷启动条件，DED-031（指标治理失真）等父推论暗示在弱制度国家"信任"测量本身就有系统性失真，使得弱信任国家的窗口测量可能从源头就被歪曲。
  red_flags: |
    1. brick=conclusion:未命中——核心主张"窗口=r_trust函数"不是某砖原文的近义改写。
    2. 逐格判空:命中(DED-007近义风险)——nontriviality_test的3维表里"事前信任基线高vs低"维度不是DED-028或DED-038提供的轴，是文件自加的第三轴，削弱了"两父合力"的归属纯洁性。
    3. 测量轴正交:部分命中——SOV逃离指标(黄金溢价/进口量)与MOE指标(工资合同/零售标价)通过通胀预期共因(文件自己承认)，补充锚(跨境汇款/海外资产)有效但注册于推论内而非独立验证。
    4. 射程排除钩子:未命中——Venezuela 2016-2021按政策干预排除的判据已预注册(三指标),判据独立于结果。
    5. 分类判据档位:命中——r_trust的"快vs慢"二分在(b)中按25%分位切,但在(a)中按p<0.05连续相关检验,两套口径并存但未注册何时用哪套。
    6. anti-talisman真兑现:部分命中——anti_talisman_clause三条都注册了,但primary_suspect中的"高/中/低三档事前信任分层"在反例格(快衰减,高基线,长窗口)中未注册如何处理——若出现此格,是用anti_talisman拒绝还是承认机制被攻击?未注册。
    7. 现实锚事实核查:命中(soft)——阿根廷2001-2002的"窗口<6个月"是文件自估而非引文,Zimbabwe 2008"<90天"同样无引文,土耳其"18个月"是文件自估。三锚都是事后叙事匹配。
    8. 条件是下定义还是做预测:未命中——核心预测是经验性的(r_trust与窗口的负相关),可证伪。
    9. 枚举穷尽:攻不穿——本推论不主张N类可枚举,红旗不适用。
    10. primary_suspect指对:命中——文件自认最弱腿是"窗口压缩是因果还是选择",且承认放弃了残差方案改用事前信任分层。但新方案的反例处理未注册(见#6)。
    11. 口径完整注册:命中——MOE阈值预注册了,但"本币计价交易占比<70%"的分母(全部零售交易vs仅新签交易vs仅大额交易)未注册,2018阿根廷案例用同一口径可能过线也可能不过线。
    12. 数据源同根:未命中——本推论主要依赖跨国危机比较而非统计面板,红旗不直接命中。
    13. API可及性冒充独立性:未命中——同上。
    14. 反向失败模式:命中——已注册(d)和(e)两个反向模式,但(f)中"r_trust极快+SOV剧烈逃离但MOE滞后>6个月"的检验标准是"俄罗斯1998/委内瑞拉2018-2021",但Venezuela已被排除,俄罗斯1998的实际窗口长度未在文件里给出(查询:俄罗斯1998年8月卢布崩溃,SOV逃离与MOE崩塌几乎同步,窗口约2-4周,符合预测;但若用类似玻利维亚1985或秘鲁1990这类中等r_trust案例可能得到反例)。
    15. Bootstrap限定缺失:命中——文件未区分"信任缓冲机制的冷启动建立"vs"稳态运行下的窗口调节"。DED-031暗示弱制度国家的信任测量本身就有失真,这意味着弱信任国家的窗口数据可能从源头就不干净——这是冷启动问题而非稳态问题。
    16. 验证对象存在性未标注:命中——"闪崩案例"(快r_trust+窗口<30天)被文件自己承认"样本极少(津巴布韦2008为孤例)",推论的极端预测(窗口趋零)实际上没有N≥2的独立验证案例。
    L4专属:
    14. 观众砖:命中——DED-028单独给出窗口存在,DED-038单独给出SOV逃离加速,两者都不涉及窗口长度作为r_trust的函数。窗口压缩的函数形式主要由文件自加的"事前信任基线"调节,而非两父推论合力。结论:涌现的归属被第三变量稀释。
    15. 平凡合取:未命中——窗口=f(r_trust)的函数形式不是AND/OR拼接,焊接真实。
    16. 涌现缺失:部分命中——"快衰减+短窗口"格确实需要两父合力,但"慢衰减+低基线+短窗口"(黎巴嫩)格的主因是基线而非r_trust,这削弱了涌现的普遍性。
    17. 弱父前提:未命中——DED-028和DED-038都是verified。
    18. 锚点偷窃:命中——三个supporting锚都是事后叙事匹配,无独立测量协议。
    19. 交互测量缺口:命中——窗口长度本身是DED-028的产物,r_trust本身是DED-038的产物,交互输出"窗口=f(r_trust)"的独立测量需要"在固定其他条件下只让r_trust变化"的实验设计,文件中没有这种设计的占位案例。
    20. 声明类型-证据标准:命中——claim是横截面模式+纵向探索,但evidence全部是横截面叙事,纵向证据(c)被明确降级为"探索性",导致声明的实证置信度天花板被自我限制,文件却未在主结论中标注这一限制。
  counterexample_hunt: |
    构造反例1:玻利维亚1985(高通胀危机)。事前制度信任极低(多次军政府更迭+恶性通胀史1984年通胀率24000%),按L4预测应该是"低基线+任意衰减→短窗口"。但实际上1985年8月新政府上台后立即实施"新玻利维亚比索"换币+SOV逃离与MOE崩塌几乎同步,窗口<2周——支持预测。但这是平凡格(低基线+快衰减→短窗口),任一单父可解释,不构成对涌现的检验。
    构造反例2:秘鲁1990-1991(藤森shock therapy)。藤森1990年7月上任,9月实施休克疗法(物价放开+汇率统一),事前制度信任极低,衰减速率极快(数日内信任归零),但实际观察到:工资合同的美元化(秘鲁一度高度美元化)滞后于SOV逃离(美元存款激增)约6-9个月——窗口长于纯r_trust预测(按L4预测应该<30天,实际6-9个月)。这是一个潜在的"快衰减+低基线+中等窗口"的反例格,可能用"功能替代品可得性"(美元在秘鲁本就广泛可得)解释,机制上支持L4的第三调节变量但削弱r_trust作为主驱动量的地位。
    构造反例3:罗马尼亚2005-2010(渐进式美元化)。制度信任缓慢下降但窗口始终存在(本币未崩),符合"慢衰减+任意基线→长窗口"预测,平凡格,不构成涌现检验。
    构造反例4:伊朗2018-2023(制裁冲击)。制度信任衰减极快(2018年特朗普退出核协议后里亚尔暴跌)但MOE崩塌滞后,SOV逃离(里亚尔存款→外币/黄金)与MOE崩塌(里亚尔计价工资/标价)的时间差>24个月。这可能用"上层锚"(石油美元结算渠道)或"功能替代品可得性受限"(伊朗被制裁下外币/黄金物理可得性低)解释,但r_trust作为主驱动量的解释力被削弱——制裁案的窗口长度主要由地缘政治决定而非信任衰减速率。
    净结果:秘鲁1990和伊朗2018是潜在的"快r_trust但长窗口"反例,被文件的反向失败模式(d)和(f)注册但未给出明确裁决流程。Lebanon被文件自己消化为基线效应。整体反例猎捕未净杀核心机制,但揭出了"功能替代品可得性"作为第三调节变量在多个潜在反例中独立起作用的事实——这削弱了r_trust作为窗口长度的唯一/主驱动量的地位,文件需要明确功能替代品是moderator还是co-driver。
  required_fixes:
    - "1. 注册\"事前信任基线\"作为独立调节变量的归属来源——要么在derivation.steps中明确标注此变量来自DED-038的隐含机制(需展开论证),要么在nontriviality_test中将3维表改为承认这是\"两父+一额外变量\"而非纯两父合力,否则涌现归属被稀释。"
    - "2. 三个supporting锚(土耳其/津巴布韦/阿根廷)需补独立测量协议——窗口长度须引用外部数据集(Brooks/Kennedy美元化数据库、IMF AREAER危机时序、Levy-Yeyati美元化年度数据)而非文件自估,否则锚点偷窃红旗命中。"
    - "3. 注册秘鲁1990-1991和伊朗2018-2023为预注册的反例格,明确裁决流程(是纳入主分析还是归入功能替代品moderator案例),否则falsifiability(d)和(f)的反向模式检验标准悬空。"
    - "4. 在falsifiability(b)中将\"快衰减25%案例窗口长度显著短于慢衰减25%案例\"的样本量天花板明示——Zimbabwe 2008孤例状态下此检验的统计功效接近零,需补≥2个独立闪崩案例(如玻利维亚1985/秘鲁1990需重新评估其r_trust分位)或明示\"当前样本下无法严格检验(b),仅作趋势支持\"。"
    - "5. 在主结论中标注\"本推论的实证置信度受限于纵向证据缺失,核心预测为横截面模式而非轨迹预测\",否则声明类型与证据标准错配(#20)持续命中。"
  oneline: |
    核心机制真实涌现但被偷渡的第三变量(事前信任基线)稀释了"两父合力"的归属纯洁性,且三个supporting锚全是事后叙事匹配无独立测量,补齐锚点独立测量协议+注册秘鲁/伊朗反例格+明示置信度天花板后可判verified。

round_6:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 6, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制焊接真实：BR-L2-031(不对称衰减)+DED-028(时序窗口)+DED-038(信任→SOV逃离加速)三力合成的"r_trust压缩SOV-MOE窗口"命题具备真实涌现，非父推论AND/OR拼接。falsifiability(a)的测量链分离、阈值预注册、政策干预排除钩子经r3修复后基本到位。但仍有required级缺陷挡住verified：(1) primary_suspect自承的"窗口预压缩vs因果压缩"区分方案虽弃用了残差法，但分层方案(高/中/低信任档)在中等信任样本上仍存在判档模糊，falsifiability(c)纵向证据从n=4降至n=4仍未补足；(2) falsifiability(b)样本量天花板自承为零统计功效——单孤例(津巴布韦2008)支撑"必然窗口<30天"的断言在L4-009判例下属于事后口径救推论的前兆；(3) 反向失败模式(f)注册了俄罗斯1998/委内瑞拉2018-2021但委内瑞拉已被(1)排除为主分析样本，剩余俄罗斯1998构成未消化反例；(4) falsifiability(a)中SOV-MOE测量链虽注明"独立于存款数据"，但"跨境汇款币种构成"与"工资合同计价"在数据可得性上对大多数前现代/1990s案例不现实，构成射程过度伸张；(5) DED-038的"幅度加速→时序压缩"跨域扩展在emergence_demonstration.novelty中虽已标注，但extension本身的机制论证只有一句话(step 3)，缺乏"为什么更快的SOV逃离必然压缩MOE起点"的独立推导。
  red_flags: |
    1. brick=conclusion — 未命中。结论(f(r_trust)→窗口长度)非任一父推论原文，且需要三父合力推导，非窄化砖。
    2. 逐格判空 — 部分命中。nontriviality_test的2×2×2表中"快衰减×高基线→短窗口"与"慢衰减×低基线→短窗口"两格确需DED-028+038+基线三力，但"快衰减×低基线→短窗口"被作者自承为平凡格——意味着至少4/8格可由单父预测，真正需要三父合力的格子偏少。
    3. 测量轴正交(DED-007死因) — 未命中(经r3修复)。SOV(黄金溢价/进口量/跨境汇款币种)与MOE(工资合同计价/零售标价)已分离测量链，且补充了跨境汇款作为纯外部SOV锚。但"零售商品标价本币占比"在多数货币危机国缺乏系统性数据，构成射程约束而非致命。
    4. 射程/排除钩子独立于结果(DED-005) — 部分命中。政策干预三指标(资本管制/强制结汇/计价强制令)预注册方向正确，委内瑞拉2016-2021排除理由透明。但"无上层制度信任锚"边界案例(欧元区2012)虽被讨论射程，未被预注册为排除条件——希腊危机是否满足"主权货币危机"定义本身模糊。
    5. 分类判据档位匹配(DED-006) — 命中软伤。falsifiability(b)的"最快25% vs 最慢25%"分位比较，在闪崩样本仅1例(津巴布韦)下，"最快25%"实际上就是津巴布韦一例——分位比较退化为单例检验，名义上是连续量比较，实质上是二分。
    6. anti-talisman真兑现 — 未命中。前件(r_trust)由失信事件→CDS峰值的事前独立链条测量，不由窗口长度反推。对称保护条款明确。但"冲击烈度"由外部标准预注册时，"全球金融压力指数/大宗商品价格暴跌"在1980s案例中同样存在数据缺口。
    7. 现实锚事实核查 — 未致命错。土耳其2018-2023窗口18个月估计、津巴布韦2008窗口<90天、阿根廷2001<6个月vs2018-2023约2-3年均引用了具体数据源(Brooks & Kennedy 2020、Levy-Yeyati 2023、IMF AREAER)。但"阿根廷2018法治指数约0.40"的V-Dem数值需核查——V-Dem对阿根廷2018年评分通常低于0.4(约0.35-0.38)，与作者声称的0.40有出入。
    8. 条件是下定义还是做预测 — 未命中。"事前制度信任缓冲"是可证伪预测(高信任→窗口长)，非定义性条件。
    9. 枚举穷尽+species按判据定义 — N/A(本推论不做物种枚举)。
    10. primary_suspect指对+平凡化检查 — 命中软伤。作者自承最弱腿是"窗口预压缩vs因果压缩"，分层方案放弃残差法改用V-Dem三档分层。但分层方案在中等信任国家(土耳其2018属中等)仍存在判档模糊，且分档本身就是用事前信任预测事后窗口——与anti-talisman条款(1)的"禁止由窗口反推信任"存在方向性张力(此处是用事前信任预测窗口，方向相反，逻辑上OK，但分档阈值的预注册在falsifiability中未给出具体V-Dem/WGI切点)。
    11. 口径完整注册+歧义反向裁决(L4-009判例) — 未命中致命但有软伤。MOE阈值(本币计价交易<70% / 非本币计价合同>30%)已预注册且标注了文献来源。但SOV逃离的"央行外汇储备月降幅>2σ偏离趋势"口径中，"趋势"本身需预注册基线窗口(用危机前多少个月?)，目前未指定。falsifiability(g)预注册了秘鲁1990-1991与伊朗2018-2023为反例格，但裁决流程"由独立编码在实证阶段完成"实质上是把判断权推给未来——按L4-009判例方向性，如果未来裁决恰好救推论则该案例按不利方向裁，作者已声明此原则但未在文中对秘鲁1990预判——这是required级软伤。
    12. 数据源同根冒充多源独立 — 未命中。土耳其/阿根廷/津巴布韦锚点分别用Brooks & Kennedy(美元化数据)、IMF AREAER(资本管制)、Levy-Yeyati(美元化)——三源底层数据库确有部分重叠(IMF数据被多方引用)，但作者未声明三源独立，需在真实锚点节补注。
    13. API可及性冒充认识论独立性 — 未命中。无API冒充问题。
    14. 反向失败模式缺失(DED-039/047判例) — 命中已修复。falsifiability(d)与(e)已注册快r_trust+长窗口与慢r_trust+短窗口两个反向模式。但(d)的替代解释(功能替代品缓冲/政策干预)与L4-016本身的"功能替代品可得性"第三变量重合——反向失败模式的解释实质上由推论自身调节变量承担，这削弱了(d)的独立证伪力度。
    15. Bootstrap限定缺失(DED-039判例) — N/A(本推论不涉及新技术冷启动)。
    16. 验证对象存在性未标注 — 部分命中。falsifiability(b)自承闪崩案例仅津巴布韦2008孤例，统计功效接近零——这本身是对"验证对象空集"的诚实标注，符合L4-016本意。但延伸问题：作者承诺补充玻利维亚1985/秘鲁1990作为闪崩案例，但falsifiability(g)又把秘鲁1990预注册为反例格(超高通胀+低信任应预测窗口短)而非闪崩案例——这两个角色不一致。

    L4专属红旗:
    17. 观众砖 — 未命中。DED-028与DED-038各有不可替代贡献(DED-028给时序，DED-038给信任维度)。
    18. 平凡合取 — 未致命。窗口长度=f(r_trust)是真实涌现，非父推论拼接。但falsifiability(b)的"快25% vs 慢25%"分组在n=1下退化为平凡二分。
    19. 涌现缺失 — 未命中。nontriviality_test识别了两格需要三父合力。
    20. 弱父前提 — 未命中。DED-028与DED-038均verified。
    21. 锚点偷窃 — 未命中。土耳其/津巴布韦/阿根廷三锚点各自独立维度(中等窗口/闪崩/同国差异)。
    22. 交互测量缺口 — 命中软伤。"窗口长度"作为复合输出变量是可测的，但窗口压缩的"因果分量"vs"预压缩分量"在测量上无法分离——这正是primary_suspect的核心困境。
    23. 声明类型-证据标准错配 — 命中。claim_type为trajectory_prediction(危机速度由r_trust决定)，但提供的核心证据是横截面案例对比(2018土耳其 vs 2008津巴布韦 vs 2001阿根廷)，跨案例冲击烈度不可比。falsifiability(c)虽降级为纵向但n=4不足，未补足n≥10的纵向样本。
  counterexample_hunt: |
    构造的反例1:俄罗斯1998——GKO违约引发卢布危机，制度信任在数周内崩塌(类似津巴布韦的快衰减)，但卢布作为MOE并未"闪崩"——工资合同与零售标价在1999-2000仍以卢布为主，美元化进程缓慢(俄罗斯2000年美元化存款约30%，2003年才达50%)。若此案例r_trust快而窗口>6个月，则直接攻击derivation.step 3的"r_trust↑→窗口↓"核心机制。作者在falsifiability(f)中预注册了此案例但未在real_world_anchors.counterexamples中消化——这是required级遗漏。

    构造的反例2:秘鲁1990-1991——按falsifiability(g)预注册为反例格，超高通胀+低信任应预测窗口短，但作者未给出秘鲁的实际窗口测量。按公开数据，秘鲁1990年7月开始"shock疗法"后，本币新索尔迅速被美元替代(秘鲁美元化率从1990年约15%升至1995年约60%)，但MOE崩塌(工资/标价全面美元化)发生在1990年代中后期——窗口可能长达数年。若此窗口>2年，则"低基线+慢衰减→短窗口"的核心预测格被攻击。

    构造的反例3:玻利维亚1985——hyperinflation危机，事前信任极低(军政府刚结束)，制度信任衰减应快，窗口应短。但玻利维亚1985年8月总统就任后立即实施稳定计划，汇率/工资/物价三冻结，SOV逃离与MOE崩塌被人为压缩在同一窗口内(<6个月)——支持而非推翻推论。此案例被falsifiability(b)承诺补充为闪崩案例，但作者在文中未提供实际窗口测量数据。

    反例猎捕结果：俄罗斯1998与秘鲁1990-1991构成未消化的潜在净杀候选，需在real_world_anchors.counterexamples中显式注册并测量。玻利维亚1985被消化为支持案例。
