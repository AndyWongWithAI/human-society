  verdict_note: |
    Core mechanism (r_trust compression of policy window) is mechanistically plausible and not trivially contained in either DED-028 or DED-038. The two-parent welding is real — window as function of r_trust is genuinely emergent. Real-world anchors are directionally correct (Turkey medium/slow, Zimbabwe fast/near-zero, Argentina comparative).

    挡 verified 的 required 缺陷:
    1. 功能替代品可得性作为第三调节变量,仅在 falsifiability (f) 中提及但未在 derivation.step 中作为正式机制纳入 — 俄罗斯1998案例净击中此缺口(r_trust极快 + SOV逃离剧烈 + MOE滞后数年,因外币可得性高而推迟)。这是 DED-038 跨域应用域扩展的必然伴随变量,必须写入主推导。
    2. 政策干预"强力"的判据未预注册 — Venezuela 2016-2021 是 mid-strength 干预案例,边界模糊。需在 falsifiability (a) 前提一中补充"强力"的判据(例如:资本管制覆盖>80% 跨境流动 / 强制结汇率>50% / 计价货币强制令覆盖>60% 零售交易)。
