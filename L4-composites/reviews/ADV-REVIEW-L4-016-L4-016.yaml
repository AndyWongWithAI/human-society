    14. 观众砖：未命中。逐一移除 DED-028 和 DED-038 任一条，核心机制塌陷——DED-028 缺则"窗口"概念无来源，DED-038 缺则"信任衰减压缩窗口"的因果机制无来源。无观众砖。
