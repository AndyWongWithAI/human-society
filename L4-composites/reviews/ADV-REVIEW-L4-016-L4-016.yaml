id: ADV-REVIEW-L4-016
type: adversarial_review
reviews: L4-016
layer: L4-composites

人话摘要: |
  对 L4-016 的 round_1 独立对抗审查（MiniMax-M3 异血统）。

target: L4-016
protocol: |
  Rule B 独立对抗审查（作者≠审查者，MiniMax-M3 异血统独立上下文，ICV 协议）。

round_1:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 1, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    L4-016的双引擎命题在概念层面有真东西——把DED-028的功能解耦窗口当作"被制度信任衰减速率门控的动态函数"确实产生了父推论各自不预测的涌现输出（窗口长度跨案例变异的统一机制）。涌现必要性论证通过、非平凡性2×2表的设计合理、falsifiability的三条判据在形式上可证伪。

    然而有三条required级缺陷挡在verified门前：
    1. **测量轴焊死的潜在复发（DED-007死因的变种）**：SOV逃离起点（本币存款/M2降幅>2σ）与MOE崩塌起点（本币计价交易占比<70%或美元化率>30%）在概念上有重叠区间——"美元化率>30%"既是SOV逃离的"逃离去向"指标又是MOE解体的"本币使用率"指标。两条操作化指标测量同一底层过程的不同切面，会系统性地缩小或膨胀窗口长度估计，尤其在"快衰减"案例中。若不分离测量链，p<0.05的相关性可能是测量重叠的人为产物。
    2. **反因果/选择效应未被隔离（primary_suspect未解）**：作者自认最弱腿是"低信任国家可能本就在高美元化均衡→窗口预压缩"。然而作者提出的"压缩量=实际值-基于冲击烈度+事前信任的预测值"方案要求事先有一个窗口长度的预测模型——而该预测模型本身就是本推论试图建立的东西。这构成了循环：先用r_trust预测窗口→再用预测残差检验r_trust是否还预测窗口。是DED-004型不可证伪风险的近亲。
    3. **boundary case的射程限制未在statement中显式声明**：欧元区2012案例暴露了推论的射程依赖于"不存在上层制度信任锚兜底"这一隐含条件。ECB/IMF/美联储充当兜底锚时窗口可以无限延长——这不是边界条件而是核心边界，未在statement或prediction中显式注册会让推论在"何时适用"上含糊，且会让反例猎捕者（以及未来的实证检验者）以"上层锚存在"为由豁免所有闪崩反例。

    L4专用红旗：涌现必要性通过、非平凡合取通过、多父逐格判空通过。但weak parent前提有松动（DED-038是verified但其内部SOV逃离与MOE解耦的连接是本研究要焊的，不是DED-038已证的——这是L4的"父推论被过度解读"风险）。

    反例猎捕：构造了三个候选反例——黎巴嫩（被作者消化为"衰减起点低"的子案例，实际是射程边界问题）、欧元区（被消化为"上层锚兜底"，本应触发statement修改而非仅footnote）、以及一个未消化的反例：俄罗斯2022年卢布危机——制度信任崩塌速率极快（西方冻结外汇储备属"急性失信事件"），SOV逃离剧烈（民众抢购美元/黄金），但卢布MOE在3-6个月内相对快速反弹（因强制结汇+天然气卢布结算令）。窗口长度既非"趋零"也非"长"——而是SOV逃离被政策反向抑制。这揭出过度伸张：推论的窗口长度依赖"政策不强力反向干预SOV"的隐含假设——这是预测(ii)和(iii)的第三层前提。

    综合：核心理论野心真实、涌现有效、判据形式可证伪，但测量轴重叠、循环化风险、隐含假设未注册三条都是可定向修订的required级问题。判needs_revision。
  red_flags: |
    1. brick=conclusion — 未命中。结论"窗口长度=f(r_trust)"不是某条父推论原文的近义重复，DED-028原文是静态窗口存在性，DED-038原文是SOV逃离加速，不含此函数。
    2. 逐格判空 — 未命中。格(快衰减,短窗口)的预测是经验主张（"窗口趋零"），不是同义反复。但格(慢衰减,长窗口)确实是平凡格（任一父推论单独可推出），作者已诚实标注。
    3. 测量轴正交(DED-007死因) — 命中/required。SOV逃离指标（本币存款/M2降幅）与MOE崩塌指标（本币计价交易占比/美元化率）共享同一底层数据源（货币交易行为），两指标测量同一过程的不同维度。在闪崩案例中两者几乎同时变化，窗口测量误差会系统性地压缩实际窗口——人为制造"快衰减→短窗口"的相关性。需要分离测量链（例：用央行外汇储备变化衡量SOV逃离，用工资合同货币选择衡量MOE）。
    4. 射程/排除钩子独立于结果(DED-005) — 命中/should。falsifiability(a)的"纳入标准"未排除ECB/IMF兜底案例，但这些案例的窗口长度被人为延长（兜底锚效应）。如果实证检验时这类案例被排除，排除标准的设定需要事前注册。
    5. 分类判据档位匹配(DED-006) — 未命中。连续变量（r_trust）用分位数分组（最慢25% vs 最快25%）合理，无离散化错误。
    6. anti-talisman真兑现 — 部分命中/required。条款(1)(2)(3)形式上独立，但primary_suspect承认的"窗口压缩量=实际-预测"方法在操作上需要事先有窗口预测模型——而这正是本推论要建立的，构成循环风险。需要换用"事前信任水平"作为分层变量（独立于窗口长度）来检验预测(iii)，而非用预测残差。
    7. 现实锚事实核查(DED-007死因) — 未命中。土耳其、津巴布韦、阿根廷案例的事实陈述基本准确，黎巴嫩案例被消化合理。但俄罗斯2022案例（审查者构造）的事实层需要查证：卢布在2022年3-7月从150/USD回升至50/USD区间，确实是"政策强力反向干预SOV逃离"的典型，但window的客观测量需要更精细的指标——这里我未做实证测量，仅做机制层判断。
    8. 条件是下定义还是做预测 — 未命中。条件"窗口长度=f(r_trust)"是可证伪的预测，不是定义。但"快衰减/慢衰减"二分通过分位数定义，可操作。
    9. 枚举穷尽 — N/A。本推论不涉及枚举。
    10. primary_suspect指对+平凡化检查 — 命中/required。作者自认的最弱腿（选择效应）确实是最致命的，但提出的解决方案（残差化）反而引入了新循环。这不是"自认不准"而是"自认的问题没解"。另外有更致命的软肋作者没认：政策反向干预假设（俄罗斯案例暴露）——这是statement未声明的第三层前提。
    11. 口径完整注册+歧义反向裁决(L4-009判例) — 命中/required。"本币计价交易占比首次<70%"的70%阈值未注册——为何70%？为何不是80%或60%？若阈值在见反例后才定死，按L4-009判例该边界案例按不利于推论方向裁。需要预注册阈值。
    12. 数据源同根冒充多源独立 — 未命中。推论未声称多源验证。
    13. API可及性冒充认识论独立性 — 未命中。本推论不涉及API数据。
    14. 反向失败模式缺失(DED-039判例) — 命中/required。推论未注册"快r_trust→长窗口"或"慢r_trust→短窗口"的反向模式。仅有的"意外格"(慢衰减,短窗口)被归因为"功能替代品可得性"——但这本身是未注册的第三驱动量。俄罗斯案例（政策干预→窗口被反向延长）就是反向失败模式。需要补登反向模式判据。
    15. Bootstrap限定缺失(DED-039判例) — 未命中。本推论不涉及冷启动问题（货币危机是稳态现象）。
    16. 验证对象存在性未标注(DED-039判例) — 未命中。货币危机案例丰富，不存在空集问题。

    L4专属：
    17. 观众砖 — 未命中。DED-028和DED-038各自单独不预测"窗口长度=f(r_trust)"，移除任一推论结论塌陷。
    18. 平凡合取 — 未命中。"窗口是r_trust的函数"既不是AND也不是OR拼接，是新函数关系。
    19. 涌现缺失 — 未命中。格(快衰减,短窗口)确需双父合力。
    20. 弱父前提 — 部分命中/should。DED-028和DED-038都是verified，形式上合格。但DED-038原文是"制度信任→SOV逃离加速"，本推论把DED-038的SOV逃离"加速"重新解读为"压缩窗口的驱动力"——这是把父推论的应用域从"幅度"扩展到"时序"，超出了DED-038原文的射程。需要DED-038原文明确"SOV逃离加速也压缩SOV-MOE时序间隔"才算干净。
    21. 锚点偷窃 — 未命中。三个真实案例（土耳其/津巴布韦/阿根廷）确实提供了不同档位的(r_trust,窗口)组合，不是重复单机制锚点。
    22. 交互测量缺口 — 命中/required。"窗口长度"作为L4的复合输出变量，其测量完全依赖SOV起点和MOE起点的差值——这两个起点分别由DED-028和DED-038的机制定义。L4的"交互"（r_trust压缩窗口）在测量上无法与"主效应"（DED-028的窗口存在性+DED-038的SOV加速）分离——因为窗口本身是它们的复合。无法证伪"窗口长度全部由主效应线性相加解释、L4的交互项为零"这种替代假说。需要构造一个"窗口长度不能用DED-028和DED-038的主效应线性外推得到"的检验。
    23. 声明类型-证据标准错配 — 命中/should。statement宣称"轨迹预测"（trust是crisis的油门）但real_world_anchors全是横截面案例对比，无纵向/序列数据。需要补一组"同一国家多次危机前后窗口长度变化"的纵向证据，或诚实降级claim_type为"cross-sectional_pattern"。
  counterexample_hunt: |
    猎捕1：俄罗斯2022卢布危机
    - 构造：制度信任急性崩塌（西方冻结外汇储备）→SOV逃离剧烈（民众抢购美元黄金、卢布兑美元盘中跌至150）→预期窗口应<30天（闪崩）→但卢布在3-6个月内反弹至50区间（强制结汇+天然气卢布结算令政策反向干预）→MOE未崩塌（卢布仍是主要计价单位）。
    - 结果：净杀预测(ii)的隐含假设（"SOV逃离不被政策强力干预"）——这是statement未声明的第三层前提。揭出过度伸张：推论仅适用于"政策制定者无法或不不会强力反向干预SOV逃离"的国家——这一限制比已声明的"无上层制度信任锚兜底"更窄。
    - 处理：可救。需要statement加第三层前提。

    猎捕2：欧元区2010-2012（边界案例）
    - 构造：希腊主权债务危机→制度信任严重衰减（对本国政府）→但ECB"不惜一切代价"→窗口无限延长。
    - 结果：boundary case。被作者消化为"上层锚兜底"效应。但statement和prediction未注册此边界——任何持有ECB/IMF/美联储"上层锚"的法币都豁免本推论。这意味着推论的实际适用范围比statement暗示的窄得多。
    - 处理：可救。需要statement显式声明"无上层制度信任锚兜底"为核心前提之一。

    猎捕3：父推论都成立但L4不成立的"中性交互"案例
    - 构造：假设DED-028的窗口存在性成立（普遍规律），DED-038的SOV逃离加速也成立（普遍规律），但所有跨案例的窗口长度变异完全由"冲击烈度"而非"r_trust"解释。
    - 结果：未能找到明确的历史反例（数据不够）。但黎巴嫩案例（慢衰减起点低→窗口短）和俄罗斯案例（快衰减+政策干预→窗口不短）联合暗示冲击烈度+政策干预+事前信任水平三者的相对权重在真实数据中可能压过r_trust的主效应。这构成"主效应可以吸收交互"的潜在反例。
    - 处理：标记为潜在风险，列为L4-009型测量轴焊死的变种。

    猎捕4：格(慢衰减,短窗口)的填充尝试
    - 构造：寻找"r_trust慢+窗口短"的历史案例。
    - 结果：黎巴嫩（已记录，2019+窗口短但r_trust在10年尺度上是慢衰减）。被作者消化为"衰减起点低"——这一消化可接受，因为它确实揭示了推论需要区分"衰减速率"和"衰减起点"两个独立变量。

    猎捕5：格(快衰减,长窗口)的填充尝试
    - 构造：寻找"r_trust快+窗口长"的案例。
    - 结果：俄罗斯2022案例符合此格（快r_trust+中等窗口长度+政策干预后相对稳定）。揭出反向失败模式——已在猎捕1中处理。
  required_fixes:
    - "1. 分离SOV逃离与MOE崩塌的测量链：用央行外汇储备变动/外部黄金储备需求作为SOV逃离的独立指标（不依赖本币交易数据），用工资合同计价货币选择/零售商品标价货币选择作为MOE功能的独立指标（不依赖存款数据），消除两指标的同根性。"
    - "2. 显式注册\"无政策强力反向干预SOV逃离\"作为第三层前提：在statement和prediction中加此假设，否则俄罗斯型反例会持续累积。同步预注册政策干预强度的测量口径（例：央行是否实施外汇管制/强制结汇/计价货币强制令）。"
    - "3. 预注册MOE崩塌起点的阈值（例：本币计价交易占比<70%）并锁定在见反例前，按L4-009判例：若阈值事后调整，调整后的方向若恰好救推论则该边界案例按不利于推论方向裁。"
    - "4. 解决primary_suspect的循环风险：放弃\"窗口压缩量=实际-预测残差\"方案，改用\"事前制度信任水平\"作为分层变量（高/中/低三档，独立于窗口长度本身），检验预测(iii)。同时补登DED-038原文未明确的\"SOV逃离加速也压缩SOV-MOE时序间隔\"机制，或在depends_on中标注\"本推论对DED-038的应用域超出原文射程\"。"
    - "5. 补登反向失败模式：在falsifiability中增加\"快r_trust+长窗口\"和\"慢r_trust+短窗口\"的判据，以及它们对应的替代解释（功能替代品可得性、政策干预强度、衰减起点水平）。同步将claim_type从\"轨迹预测\"降级为\"横截面模式\"直至提供纵向证据，或补一组同一国家多次危机的纵向数据。"
  oneline: |
    双引擎概念真实且涌现有效，但SOV/MOE测量链同根、primary_suspect的循环风险未解、政策反向干预与上层锚两大隐含前提未注册，三条required可定向修订。

round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    L4-016 的核心直觉（制度信任衰减速率决定 SOV-MOE 窗口长度）有真实的新颖性，DED-028+DED-038 的焊接不是平凡 AND/OR——"快衰减×短窗口"格确实需要两父推论合力（涌现验证通过）。反例猎捕未净杀：黎巴嫩（已消化为衰减起点调节变量）、欧元区（已消化为上层锚边界条件）、阿根廷 2001 vs 2018（被消化为信任缓冲支持）。

    挡住 verified 的缺陷是 r1 五条 required 修复虽落地、但落地不彻底，新出现 3 条 required：
    (1) 应用域扩展未注册——L4-016 把 DED-038 的"SOV 逃离幅度加速"机制跨原文射程扩到"SOV-MOE 时序压缩"，作者在 derivation.step 6 承认此扩展但未作为前提预注册，也没有 falsifier 专门检验此跨域推理。
    (2) 闪崩预测（窗口<30 天）的样本量天花板——falsifiability(b) 要求"最快 25% 案例中存在窗口<30 天"，但历史上满足"快衰减+无政策干预+无上层锚"三条件的案例极少（津巴布韦 2008 一个孤例），样本不足以支撑"必然存在"的预测，应降级为"趋势"而非"必然"。
    (3) 测量链"独立"声明过强——falsifiability(a) 声称 SOV 逃离指标用"外汇储备月降幅/黄金溢价/进口量"，MOE 崩塌指标用"工资合同计价/零售标价"。但在高通胀环境下，黄金溢价和进口量本身就受本币计价预期影响（"本币即将贬值"推高进口囤货），SOV 信号和 MOE 信号通过通胀预期形成隐藏焊点。这是 DED-007 测量轴焊死的复发风险。

    非致命但应改进：事前制度信任缓冲的横截面比较在"冲击烈度不可比"的跨国数据上几乎不可行（2001 阿根廷 vs 2018 阿根廷同国不同冲击，但跨案例比较则冲击类型差异巨大），应在 (c) 中明确承认这是同国多危机的纵向检验而非真横截面。

    总结：r1 的 required 修了大半但有三条没修透；涌现真实存在；反例猎捕未净杀；不是 rejected，应 needs_revision。
  red_flags: |
