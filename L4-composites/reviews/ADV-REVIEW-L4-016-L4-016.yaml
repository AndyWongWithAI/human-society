    - "3) 在 derivation.step 6 基础上正式注册 DED-038 跨原文射程的应用域扩展：\"SOV 逃离幅度加速→SOV-MOE 时序压缩\"为 L4-016 的额外机制假设（非父推论原文断言），并在 falsifiability 中补一条 (g) 专门检验此跨域推理：若出现 r_trust 极快且 SOV 逃离幅度剧烈但 MOE 崩塌滞后>6 个月的案例（如俄罗斯 1998/委内瑞拉 2018-2021），则跨域推理被攻击，需引入功能替代品可得性作为第三调节变量。"
    - "4) 将功能替代品可得性（黄金/外币/数字美元的物理可得性）注册为独立调节变量——反例 3、4 已证明 r_trust 不是窗口唯一驱动量；当前推论 (a)(b)(c) 全部默认其他条件相同，应明确标注\"控制功能替代品可得性\"为隐含假设并在射程中声明。"
