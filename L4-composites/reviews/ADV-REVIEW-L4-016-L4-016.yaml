  counterexample_hunt: |
    主动构造三类反例：

    **反例 1：魏玛 1923**——制度信任在 1923 年中前已完全崩塌（基线极低），r_trust 极快，SOV 逃离（外汇抢购/黄金囤积）与 MOE 崩塌（工资和标价转外汇）几乎同时发生，窗口<30 天。这条**支持**推论的闪崩预测，被消化。

    **反例 2：日本 1997-1998（桥本冲击后）**——制度信任衰减（金融厅检查丑闻+北海道拓殖银行破产），但日元作为 MOE 从未崩塌，SOV 逃离有限（部分转黄金但规模小）。窗口表现"慢衰减+长窗口"。**支持**推论的预测(iii)，且与欧元区 2010-2012 锚点一致（上层制度信任锚兜底）。被消化。

    **反例 3：俄罗斯 1998**——制度信任崩塌极快（主权违约+GKO 违约），SOV 逃离剧烈（卢布存款暴跌），但 MOE 崩塌并非"立即"——卢布在日常交易中仍广泛使用，零售标价未大规模转美元。窗口长度约 6-9 个月。这条**部分攻击**推论：r_trust 极快但窗口非零。可能的解释：(a) 俄罗斯当时功能替代品可得性有限（国际支付通道在违约后部分冻结，硬通货进口受阻），SOV 逃离虽快但 MOE 替代品缺；(b) 1998 年的零售美元化在俄罗斯本就低（苏联遗留的本币惯性），MOE 崩塌的阈值（70%/30%）可能未越过。这条反例**未净杀**，但揭示了"功能替代品可得性"作为第三个调节变量的射程边界。

    **反例 4：委内瑞拉 2018-2021**——制度信任崩塌极快（马杜罗连任争议+石油制裁），SOV 逃离剧烈（玻利瓦尔存款归零），MOE 崩塌渐进（2020-2022 年零售美元化从~30% 升至~70%）。窗口估计 12-24 个月。这条**部分支持**推论：r_trust 极快但窗口非零。可能解释：委内瑞拉的功能替代品可得性高（与哥伦比亚/美国的硬通货跨境流动便利），SOV 替代唾手可得反而延后了 MOE 崩塌——因为 MOE 替代需要时间和基础设施（找零/验钞/找零钱），而 SOV 替代只需要抢美元存款。

    **反例 5（最致命试探）：阿根廷 1989**——Alfonsín 政府的恶性通胀前夕，制度信任崩塌极快（hyperinflation 启动），但窗口较长（约 3-6 个月）——因为 Austral 计划（1985）已部分恢复了部分信任，SOV 逃离相对有序。**攻击预测(ii)**：r_trust 极快但窗口非零。但 Austral 计划本身是强力政策干预，应被 policy_intervention 排除钩子排除。被消化。

    **猎捕结论**：未净杀。所有反例要么被消化为边界条件（上层锚/政策干预/衰减起点水平），要么被吸收为第三个调节变量（功能替代品可得性）。但反例 3 和反例 4 系统性提示：r_trust 不是窗口长度的唯一驱动量，功能替代品可得性是独立调节变量。这一发现要求推论要么将功能替代品可得性纳入核心机制（升级为三变量函数），要么在射程中诚实标注此遗漏。
  required_fixes:
    - "1) 在 falsifiability(a) 中明确\"SOV 逃离指标（黄金溢价/进口量）在高通胀环境下受本币贬值预期影响，与 MOE 指标存在通过通胀预期的隐藏共因\"；补充 SOV 逃离的纯外部锚（如跨境汇款币种构成/海外资产持有量变化），与通胀预期解耦。"
