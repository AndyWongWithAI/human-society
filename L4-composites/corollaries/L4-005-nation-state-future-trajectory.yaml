    满足 L4 涌现硬门槛：
    - 至少 6 个核心格子标注为需要 ≥2 条 L4 父推论合力。
    - 招牌空格（数字=高+零功能分化+长期稳定=空）需要四条 L4 父推论全部合力——
      任一单条不可单独强制该空格。【参数限定】此空格在低税基跨国+数字威权维持低透明度+
      强锁定的参数组合（格G）中不必然为空——空格仅在税基跨国=高 AND 透明度被迫=高
      AND 锁定=强的条件下被强制。
    - 最尖锐的涌现格为"数字=高+税基跨国=高+透明被迫=高+锁定=强→最不稳定/危机驱动分化"：
      需要 L4-001（向上推力）+L4-002（透明侵蚀威权区）+L4-003（锁定积累张力）+L4-004
      （技术使四向分化物理可能）四条合力。

    【合力格类型标注】
    上述多父合力格均属〖合取(conjunction)〗——每条父推论独立提供自己方向的压力，
    合起来产生综合效果（多压力并行叠加）。无格属于〖交互(interaction)〗（机制互相
    修改运作条件）。本推论唯一的交互效应 prediction (iii)（L4-003+L4-004 机制咬合）
    不在笛卡尔积中的某个特定格里，而是贯穿多格的动态机制——
    详见 Emergent property 节 (B) 交互级涌现。

# === 可证伪性 ===

falsifiability: |
  本推论可被以下发现证伪：
  (a) 存在一个政体同时满足（均由独立于结构事实测得）：
      (1) 数字技术高采用（四个维度中至少三维的数字成本比印刷时代低 ≥1 个数量级）；
      (2) 国家功能完全不分化——经济调节/社会福利/文化再生产/暴力终裁+终局规则制定权
      全部由国家级机构执行（按 functional_differentiation_degree 独立测→分化度 ≈ 0）；
      (3) 长期（>30 年/一代人以上）稳定——无制度崩溃/革命/分裂/内战，且合法性
      在败方/受损群体中持续被接受。
      → 命中招牌空格 → L4-005 核心被证伪或需修正。

  (b) 数字技术高采用的政体中，功能分化度与数字采用度无显著正相关——
      即"数字普及"和"功能分化"之间在统计上独立。
      → 证伪"数字相变→功能分化"这一核心因果链路。

  (c) 高数字采用+高税基跨国度的政体系统性走向了"新的集中"（如全球数字帝国/世界政府）
      而非"功能分化"——即功能不是分散到多个方向，而是集中到一个新的更高层级。
      → 证伪"分化"方向——若技术使全球集中而非分散成为主流，L4-005 的"四向分化"
      被"向上集中"替代。

  (d) 低数字采用+低税基跨国度的政体也出现了与高数字+高跨国政体同等程度的功能分化。
      → 证伪"数字+跨国税基是功能分化的驱动量"。

falsification_trace:
  primary_suspect: |
    "向上交"（超国家治理）的方向和速度——是否真的会"向上交"在现实中遭遇政治反弹
    （民族主义/脱欧/贸易战），可能分化方向不是线性向前而是振荡甚至逆转？
    这已在预测(iv)中以"保留多少、交出去多少"的变量形式被吸收——但如果振荡幅度
    大到使"分化"本身可逆（即国家重新集中功能），则推论的'方向性'主张需限定。
    更精确地，本推论预测的是【长期结构趋势】而非【短期单向运动】——如果 50 年
    尺度上功能分化度整体未上升（允许中途振荡），则被证伪。短期（10-20 年）
    的反向摆动（如英国脱欧代表的"收回主权"）在可接受振荡范围内——条件是长期趋势
    仍为分化。此腿最先受检——因为"向上交"的政治反弹是当代最可见的逆势现象。
    诚实声明：L4-001 为 verified*（非 verified），其 DED-003 的瑞士案例 unresolved
    状态是 L4-005 置信度天花板的一部分。
    L4-001 降级量化：若 L4-001 的"外部竞争必要性"被内部合法化替代路径削弱（瑞士案例成立）：
    (a) prediction (i) 的"向上交是不可逆结构趋势"→限缩为"向上交是税基跨国化的结构推力
    方向，但政治反弹的振荡幅度可能大到使向上交在 20-30 年尺度上可逆"；
    (b) prediction (iv) 中由 L4-001 税基结构预测"向上交的程度和速度"→该维度的解释力
    下降，需补充非竞争性因素（如内部协同效率/文化偏好）；
    (c) prediction (iv) 中由 L4-002 政体参数预测"交多少"不受影响（独立于 L4-001）。
  secondary_suspect: |
    "数字使威权稳定区（低透明）的存在条件被侵蚀"——如果数字监控技术反而使威权国家
    能够在"高透明（信息公开）+高监控（行为控制）"的新配置下维持长期稳定，则预测(ii)
    的侵蚀方向被证伪：威权区不是被侵蚀，而是被"再稳定化"（数字威权=低独立+中高透明
    +高监控→新稳定区）。此腿若断，功能分化的"无法不走"逻辑被削弱——威权国家可以通过
    技术维持全包（在全包同时压制不满），不需要分化。
  unlikely_suspect: |
    L4-004 的"数字相变使信息成本崩塌"这一基本事实——存储/传输/检索/监控成本确实
    已经发生了数量级跃迁，这是物理技术事实，极少是失效根源。L4-003 的"锁定效应存在"
    有大量制度变迁文献支持，单体稳定性高。失效更可能出在 L4-001 的跨国税基逻辑
    （"让权方向随税基地理分布而变"是否在超国家尺度上同构成立）和 L4-002 的透明度
    方向（监控技术是否扭转了透明度的政治效应方向）。

excluded_outcomes:
  - outcome: "纯印刷时代的社会（无任何数字技术渗透）"
    description: |
      本 L4 的射程起点是"数字相变已经开始且对社会产生了可观测的影响"。
      纯印刷时代社会中，功能分化的机制尚未启动→出射程。按 digital_technology_adoption
      三维度独立测——若信息存储/传输/检索/监控成本均未达到"比印刷时代低 ≥1 个数量级"
      →出射程。
  - outcome: "数字技术尚未普及的局部/传统社会"
    description: |
      射程限于"数字相变已显著影响制度运作"的社会。技术和制度尚未数字化的社会
      →仍在 L4-001~004 各自印刷时代的射程中，不在本 L4 射程。
  - outcome: "短期（<10 年）的反向摆动（如英国脱欧/贸易保护主义反弹）"
    description: |
      本推论预测的是【长期结构趋势】（50 年以上尺度），允许中途振荡。短期的"收回主权"
      运动是可接受的逆势——唯有长期（>30 年）趋势不变才构成证伪。按时间窗事前判定。

anti_talisman_clause: |
  【防不可证伪护身符——L4 合成层面】四个自变量（数字采用度/税基跨国度/透明度/锁定度）
  与复合输出（功能分化度）必须各自独立测、不互相反推。尤其：
  - 不得因"国家功能在分化"就倒推"数字技术必然普及"或"税基必然跨国化"；
  - 不得因"国家功能未分化"就倒推"数字技术尚未到位"或"锁定太强"；
  - "锁定强"须由制度调整时滞独立测（条件变化→制度调整的延迟），不得因"功能未分化"
    就事后标注为"锁定强"；
  - "功能分化度"须由四个功能域的实际分配状态独立测，不得因"数字技术已普及"就预期
    分化度必然高（DED-004 循环病根）。
  尤其不得遇到"数字普及+零分化+长期稳定"的疑似空格填充案例时，事后调低数字采用估值
  或调高锁定估值来消化——此即不可证伪循环在 L4 合成层面的具体形态。

# === 方法论声明 ===

methodological_caveat: |
  【claim_type 与证据标准的对齐】

  本推论的 claim_type = "trajectory_prediction" 声称对民族国家功能的未来轨迹做预测。
  这一类型要求纵向/序列证据——展示功能分化度随时间的变化趋势。但当前证据（五个锚点）均为
  横截面快照——展示当前存在的现象，不展示时间趋势。这不是致命问题（关于未来的轨迹预测
  本质上无法有完整的未来数据），但需诚实标注证据策略。

  (a) 证据策略：本推论是 future-oriented 的结构预测，证据策略 = "当前锚点展示机制已在运作
      + 机制逻辑推导未来方向"，而非"已有完整纵向数据拟合轨迹"。五个锚点（EU/社交媒体/
      平台资本主义/苏格兰-加泰罗尼亚/数字威权）均属于"机制已在运作"的横截面证据。

  (b) 两阶段验证策略：
      第一阶段（当前可检）：机制链各环节是否已在运作——当前锚点可覆盖。若机制链中任一
      环节在当前已被证伪（如"透明度被迫提高→威权稳定区侵蚀"被数字威权的长期稳定反例
      推翻），则本推论的机制基础被削弱。
      第二阶段（未来可检）：50 年尺度上功能分化度是否整体上升——当前不可完成，需要
      纵向数据（至少覆盖 30+ 年的功能分化度时间序列）。在当前阶段，本推论不可被最终
      验证或最终证伪。

  (c) 当前可被什么削弱：在当前阶段，本推论可被"机制链断裂"（某条父推论被推翻）或
      "中期趋势反向"（20-30 年尺度上功能重新集中）所削弱。短期（<10 年）的反向摆动
      （如英国脱欧）已在 excluded_outcomes 中排除。

  (d) 诚实标注：本推论在当下的认识论层级是"基于当前机制的趋势外推"，而非"已完成纵向
      追踪的轨迹拟合"。读者应理解：当前锚点展示方向、机制逻辑预测终点，但两者之间的
      路径充满政治反弹/技术军备竞赛/外部冲击等不可精确预测量。

# === 现实锚点 ===

real_world_anchors:
  supporting:
    - anchor: "欧盟——'向上交'的最强锚点：税基跨国化→超国家治理的制度化"
      evidence: |
        欧盟是"国家把部分功能向上交"的最系统化案例：成员国将货币政策（欧元区）、
        贸易政策（共同商业政策）、竞争政策（欧盟竞争法）、部分环境/农业/数据保护
        主权移交至超国家机构（ECB/EC/ECJ）。驱动机制与 L4-001 的"让权方向随税基
        地理分布而变"一致：欧盟单一市场的跨国商业税基使成员国有动机"让权给超国家
        制度以换取市场准入和税收协调"。这是"向上交"的案例——但欧盟未覆盖其他三维
        （成员国保留暴力垄断+终局规则），即"功能分化是交一部分而非全部主权"——
        支持本推论的"分化"而非"替代"主张。
      independent_test: |
        税基跨国度由欧盟内部贸易/GDP、跨国投资占比独立测（不依赖是否已有超国家制度）；
        功能分化度由主权移交的政策域数量独立编码（不依赖"是否因经济压力而移交"）。
      composite_specific: |
        复合特有锚点：欧盟展示了 L4-001（税基跨国化→让权给超国家制度）和 L4-004
        （数字/现代交通使跨国交换可行）的交互——没有现代交通+通信技术，单一市场在
        物理上不可行（L4-004）；没有商业税基的跨国化，"让权给超国家制度"缺乏动机
        （L4-001）。两条 L4 父推论的机制在此可观察交互：技术可行（L4-004）+经济
        动机（L4-001）→超国家制度化。
      confidence: "moderate-strong"
      composite_specific: true

    - anchor: "社交媒体→多层公平冲突的'前台化'——DED-022 被数字技术放大的复合特有锚点"
      evidence: |
        数字时代之前，不同社会层的公平标准之间的不可通约（DED-022）在"信息隔离"下
        运作——家族层的"自家人优先"和职业层的"按绩效分配"和国家层的"法律面前人人平等"
        各自在不同场合运作，互不正面碰撞。社交媒体（L4-004 的数字检索/传输成本崩塌）
        使这三种公平标准在同一个屏幕上正面碰撞：
        - 某人被公司裁员（职业层：按绩效→合理裁撤）→在社交媒体上公开求助→家族层
          "我们得帮自己人"和国家层"劳动法保护"的公平标准被同时激活→公司"按绩效分配"
          在舆论中被家族公平标准判定为"不公"。
        这是 L4-004（数字相变使信息可见）和 DED-022（多层公平冲突）的交互：数字技术
        不是创造了公平冲突——DED-022 说冲突本来就存在——而是使冲突从"各层独立运作"
        升级为"多层同一舞台正面碰撞"。这种冲突的可见性和频率在印刷/广播时代不可达到。
      independent_test: |
        数字技术采用度由互联网普及率/社交媒体渗透率独立测；
        层间公平冲突频率由公开争议事件（如社交媒体舆论事件/网络争议）的编码独立测；
        不由"冲突是否多发"反推"数字技术是否普及"。
      composite_specific: true
      confidence: "moderate"

    - anchor: "平台资本主义+零工经济——'向外包'的锚点：市场替代国家福利功能"
      evidence: |
        数字平台（Uber/Airbnb/美团/滴滴）用算法替代了传统上由国家/工会提供的劳动保障
        和职业规范功能——平台评分替代职业资格认证、算法派单替代劳动法工时规定、
        顾客评价替代劳动仲裁。这不是国家主动"外包"——是市场/网络在数字技术使能下
        "填补"了国家制度供给的滞后（L4-003 的锁定效应：劳动法锁定于工业时代雇佣关系，
        无法适应平台经济→平台自建替代治理体系）。这是 L4-004（数字使市场/网络替代
        制度可行）和 L4-003（国家制度锁定滞后→市场填补空缺）的交互锚点。
      independent_test: |
        数字技术采用度由平台经济渗透率独立测；
        国家制度滞后由劳动法/社保制度与平台经济形态的匹配度独立编码（不依赖"平台是否
        自建了替代制度"）；
        功能分化度由国家 vs 平台在劳动保障/职业规范上的实际执行占比独立测。
      composite_specific: true
      confidence: "moderate"

    - anchor: "苏格兰/加泰罗尼亚/魁北克次国家民族主义的数字时代复兴——'向下放'锚点"
      evidence: |
        数字技术使小群体自组织成本大幅降低（L4-004 的组织变平效应）：苏格兰独立公投
        （2014）和加泰罗尼亚独立运动（2017）中，社交媒体和即时通讯工具使分离主义群体
        的组织/动员/跨境传播成本远低于印刷/广播时代。同时 DED-003+DED-022 的机制
        ——当国家层面的外部竞争消失（欧盟消除了传统安全竞争），次国家层面的身份活跃
        （DED-003："我们不是他们"的最省力锚定在国家层失效→下沉到次国家层），且
        该次群体对"国家统一标准"的公平异议（DED-022 多层冲突）被数字放大。
        这是 L4-004（数字使小群体可行）+DED-003（外竞退→内聚沉）+DED-022（多层
        冲突）三条父推论的交互锚点。
      independent_test: |
        数字采用度由社交媒体渗透率独立测；
        次国家身份活跃度由公投/选举/社会运动独立编码；
        不因"分离运动多发"反推"数字技术普及"。
      composite_specific: true
      confidence: "weak-moderate"

    - anchor: "数字威权——预测(ii)的张力锚：高监控维持稳定但合法性空洞化"
      evidence: |
        某大国的人脸识别+社会信用系统+网络审查→用数字监控维持低轮替+低独立政体的稳定。
        这落在 L4-002 的"威权稳定区"（低轮替+低独立+数字监控维持的低透明假象）和
        L4-004 的"监控成本暴跌使威权更便宜"的交叉格。关键检验：数字威权的稳定是否
        是可持续的？L4-005 的预测(ii)说：透明被迫提高（尽管有防火墙，信息泄露的物理
        成本已崩塌）→低透明不可长期维持→威权稳定区被侵蚀。若数字威权在 30+ 年尺度
        上持续稳定且合法性无空洞化，则预测(ii)被证伪。当前仍在检验窗口内。
      independent_test: |
        数字技术采用度/监控技术部署由独立技术指标测；
        透明度由信息泄露成本+信息自由度独立测；
        稳定性由制度崩溃事件独立测；
        不由"是否稳定"反推"监控是否有效"或"是否真的不透明"。
      confidence: "weak（仍在进行中，未到判定窗口）"
      composite_specific: true

  counterexamples:
    - case: "英国脱欧——'收回主权'是功能分化的逆转还是振荡？"
      analysis: |
        英国脱欧（2016-2020）表面是"从超国家收回主权"——逆"向上交"方向而行。
        但仔细分析：(1) 脱欧后英国立即需要签署大量双边贸易协定（FTA），本质是换了一种
        "向上交"的形式——从"多边超国家制度（EU）"改为"双边国际制度（FTA网络）"，
        是在"交多少、交给谁"上的选择，而非"完全不交"；(2) 脱欧后英国在国内启动了
        "levelling up"（向下放给地方）和继续依赖全球市场（向外包）——其他三个方向的
        分化并未逆转。短期看脱欧是"向上交"的回摆，但中期看是在"功能分化的不同配置"
        之间切换——支持而非证伪预测(iv)。判定：不是脱欧证伪功能分化——如果英国在
        脱欧后建立了"完全自给自足、无任何国际制度约束、功能完全不分化"的模式且长期
        稳定，才命中空格。目前不满足。
      status: "not_a_counterexample（属预测(iv)的变量范围内）"

    - case: "数字技术完全普及+零功能分化+长期稳定——活空格"
      analysis: |
        目前已知政体中无同时满足数字=高+分化=0+长期(>30年)稳定的案例。
        最接近的候选是某些数字威权国家——在数字监控下维持了类似全包国家的形态
        （国家统管经济/社会/文化/安全），但：(1) 这些国家的"全包"是名义而非实质的——
        灰色市场/地下教会/网络亚文化在数字技术支持下的"向外"和"向下"实际上已在
        并行运作，只是被压制而非不存在（计为"不分化且不稳定"而非"不分化且稳定"）；
        (2) 这些国家大多尚未达到 30+ 年数字高采用窗口——仍在检验中。
        此格保持开放猎捕。
      status: "counterexample_hunt_open"

  boundary_cases:
    - case: "美国——'向内收'的张力案例：国家核心功能的重新宣示"
      analysis: |
        美国同时展示了功能分化的三个方向和"向内收"的逆势：
        - 向上交：USMCA/对华关税→贸易主权在"多边→双边→单边"之间摆动；
        - 向下放：州权扩张（堕胎/大麻/环保）——联邦与州的功能分配在重新谈判；
        - 向外包：SpaceX/私营监狱/私人军事承包商→传统国家功能被市场替代；
        - 向内收：移民管控加强/关税作为主权工具→国家在核心功能（边界/安全）上宣示独占。
        四个方向同时运作——这是 L4-005 的"四向拉扯"格局的微缩版。美国的"向内收"
        恰恰展示了功能分化的另一面——国家在不可替代的核心功能上收紧，在可替代的
        非核心功能上松手。这不是反例——是验证：功能分化不是单方向的"弱化国家"，而是
        "有松有紧的结构重组"。
      status: "boundary_case(支持方向但单案例混杂)"

    - case: "全球数字平台（Meta/Google/Tencent）作为'准国家'——向外包的极限"
      analysis: |
        超大型数字平台在内容审核（替代司法）、用户协议（替代法律）、虚拟货币（替代
        国家货币）、身份验证（替代公民登记）等领域的权力已经接近国家功能。如果这种趋势
        持续且不被国家"收回"→则"向外包"可能越过临界点→"功能分化"变成"功能替代"——
        国家不仅交出功能、而且失去收回能力。这超越了 L4-005 的核心主张（国家保留暴力
        终裁+终局规则制定权）→如果平台在终局规则制定上也替代了国家，则 L4-005 的
        "向内收（核心独占）"主张被削弱→功能分化的上限需重新设定。当前仍在演进中。
      status: "boundary_case(挑战'向内收'上限)"

# === 判别效度 ===

discriminant_validity: |
  【与"世界政府"论（Rodrik 三难困境）的判别】
  Rodrik（2011）的全球化三难困境：深度全球化/民主政治/国家主权——三选二。
  核心主张是"三者不可兼得"→必须牺牲一个。
  本 L4 与 Rodrik 的本质区别：(1) Rodrik 说"三选二"是逻辑上的不可能三角——
  给定三个目标的定义，同时满足在逻辑上矛盾。本 L4 不说"逻辑不可能"——说"四个
  参数同时位移→功能分化是多维合力的结构趋势"。(2) Rodrik 的框架是静态的——
  给定三个目标，选择哪个牺牲。本 L4 是动态的——参数在变、系统在演化。"向上交"
  （超国家）不是"选"出来的——是税基跨国化（L4-001）"推"出来的；不是"牺牲主权"——
  是"交出部分主权以保留核心主权"。(3) 本 L4 的独有可证伪预测：如果 Rodrik 正确
  （三难不可兼得），则要么"全球化+民主+无主权"、要么"全球化+主权+无民主"、要么
  "民主+主权+无全球化"——三种静态均衡。本 L4 预测的不是静态均衡，而是"四种力同时
  拉→功能分化"的持续演化：向上交（不是全交）、向下放、向外包、向内收同时进行。
  Rodrik 的三难框架无法导出"四向分化"——只能导出"三选二"的三种静态解之一。
  若现实中只观察到"向上交"或"向下放"的单向位移，而无多维同时位移→Rodrik 的单维
  三难框架优于本 L4 的多维分化框架。

  【与"历史终结论"（Fukuyama）的判别】
  Fukuyama（1992）说自由民主是人类意识形态演化的终点和政体的最终形式。
  本 L4 与 Fukuyama 的本质区别：Fukuyama 说"自由民主是终点"——是终态论。
  本 L4 说"任何政体都是参数空间的稳态，参数一变稳态就移"——是过程论。本 L4 预测
  "民主稳定区"（L4-002 的高轮替+高独立）也会经历功能分化——民主国家同样要向上交
  （贸易协定约束国内立法）、向下放（地方自治/公投）、向外包（私有化/外包公共服务）。
  如果自由民主是"终点"，那功能分化应该只发生在非民主国家——民主国家已经是终态、
  不需要再分化。Fukuyama 不预测"民主国家也在功能分化"→如果民主国家确实在经历
  功能分化，则"终点论"被削弱、过程论占优。

  【与"国家回缩论"（Strange）的判别】
  Susan Strange（1996）的"国家撤退"（Retreat of the State）：国家在经济/社会领域
  的权力在向市场和非国家行为体转移。本 L4 与 Strange 的本质区别：Strange 说国家在
  "撤退"——是单向的权力丧失。本 L4 说不是"撤退"，是"分化"——国家在有些维度更强
  （监控/安全）、有些更弱（经济调控/文化权威）。"分化"是"交出部分功能+保留核心
  功能+在核心功能上可能变得更强"——总体的国家权力不是净减少而是结构重组。
  独有可证伪预测：若观察到国家的监控/安全功能与经济调控功能同步弱化→国家"净萎缩"
  而非功能分化→Strange 优于本 L4。若观察到国家在交出经济调控的同时增强了监控/安全
  →"分化"优于"撤退"。

  【防平凡化守卫】
  最严重的平凡化威胁是："功能分化"被简化为"国家功能在变"或"全球化使国家弱化"的
  近义复述。防线的关键：(1)"四向分化"的格局（向上+向下+向外+向内同时）是具体且
  可证伪的结构预测——如果只出现单一方向（如只向上交）而其他方向不变，则"四向分化"
  被证伪；(2) 招牌空格（数字普及+零分化+长期稳定=空）是可被现实反例填上的真空格——
  它以四条父推论的合力为基础，不是"全球化使国家变弱"的空洞复述；(3) 预测(iv)——国家间
  差异在于"交多少、留多少、分多快"而非"是否分化"——给出可量化的交叉变异预测：
  L4-002 的政体参数和 L4-001 的税基结构共同预测分化速度和配置。

