id: L4-005
type: composite_deduction
layer: L4-composites
deduction_form: composite
status: verified*
term: "民族国家的未来：功能分化轨迹 (Nation-State Future: Functional Differentiation Trajectory)"
claim_type: trajectory_prediction

人话摘要: |
  民族国家不会消亡、也不会永恒——它在被四个方向同时拉扯：往上交（跨国税基→超国家）、
  往下放（数字让小群体自组织）、往外包（市场/网络替代制度）、往里收（暴力+终局规则
  是唯一剩下的独门生意）。最后每个国家都得功能分化，区别只在于：交多少、留多少、分多快。

statement: |
  【Composite claim】
  ⚠️ 置信度天花板声明：本推论因 L4-001 为 verified*（非 verified），整体置信度受其约束。
  L4-001 的 "外部竞争→让权" 机制是 "向上交（超国家治理）" 方向的核心支柱——若 L4-001 的
  外部竞争必要性被内部合法化替代路径削弱（DED-003 瑞士案例 unresolved），则本推论的
  prediction (i)"向上交是不可逆结构趋势"需限缩为"向上交是税基跨国化的结构推力方向，但政治
  反弹的振荡幅度可能大到使向上交在中期可逆"。prediction (iv) 中由国家间税基结构差异预测
  "交多少"的部分不受影响（该部分仅依赖 L4-001 的税基类型机制，不依赖外部竞争必要性）。
  详见 falsification_trace.primary_suspect。

  民族国家不是历史的终点——它是特定参数组合（信息技术=印刷/广播级、经济交换=国家-国际双轨、
  公平标准=国家层主导+多层冲突被压制、外部竞争=大国间军事竞争）下的稳态。当前这四个参数都在
  位移，四个参数同时位移意味着民族国家这个稳态正在同时承受四个维度的压力。L4-001~004 各自
  描述了单一维度的演化逻辑——本条将它们合起来，预测民族国家的演化方向：不是消亡（Westphalian
  替代论）、不是永恒（现实主义）、而是【功能分化】——国家把某些功能上交（超国家）、某些下放
  （次国家）、某些外包（市场/网络），只保留一个不可替代的核心：暴力终裁+领土内终局规则制定权。

  【Parent mechanisms】
  L4-001（国家形成轨迹）给：商业税基+外部竞争→让权换税型国家——当经济交换全球化、税基变得
  跨国流动时，"让权"逻辑是否从"让给国内商人（议会）"位移到"让给国际制度（贸易协定/仲裁）"？
  即：国家形成轨迹的让权方向随税基地理分布而变。
  L4-002（政体稳定相图）给：低轮替+低独立+高透明→最不稳定区——数字技术使透明度被迫提高
  （信息泄露成本崩塌），威权稳定区（低透明）的存在条件被侵蚀。
  L4-003（制度共演锁定）给：制度化时的初始条件被"冻结"——民族国家在印刷/工业时代冻结的公平
  制度配置（国家福利/劳动法/教育均等化）现在面临数字时代的新条件（零边际成本信息/全球劳动力市场），
  但锁定效应使其抗拒适应→制度滞后积累张力。
  L4-004（IT→社会形态）给：数字相变使信息存储/传输/检索/监控成本崩溃——这同时改变组织深度
  天花板（可更平也可更深）、规范复杂度天花板（法律可无限复杂但人脑跟不上）、信任替代机制
  （区块链/算法评分替代制度信任）、权力制度化成本（监控成本暴跌使威权更便宜也使其更脆弱——
  DED-020 的透明×独立交互）。

  【Emergent property】
  本推论的"涌现"有两个层次——需诚实区分，不可混为一谈：

  (A) 合取级涌现（conjunction / 薄涌现）：四条父推论各自独立产生一个方向的压力——
  L4-001 产生"向上"推力（税基跨国化→让权给超国家制度），L4-004 产生"向外+向下"推力
  （数字技术使市场替代+小群体自治物理上可行），L4-002 产生"无法不走"的推力（透明度被迫
  提高→威权全包国家难以为继），L4-003 产生"不会顺利走"的制动（锁定迟滞→张力以危机驱动
  而非平滑过渡）。四条独立机制的并行压力在民族国家这一共同对象上叠加→产生"四向同时位移"
  的综合效果。这是四条独立机制各自发力、合起来产生矢量综合效果——类似四人从四个方向同时
  推一个箱子。此层次有理论价值（将四条独立发展的 L4 推论同时应用于同一对象的"合成"本身
  是新贡献），但机制结构是【合取】，不是【交互】。

  (B) 交互级涌现（interaction / 厚涌现）：仅 prediction (iii) 属于此类——L4-004 的数字
  信息流（信息成本崩塌）侵蚀 L4-003 锁定效应所依赖的"信息控制"维护条件→锁定的制度滞后期
  缩短（但仍存在）→张力释放形式从 L4-003 单独预测的"革命（大爆发、低频率）"转变为"合法性
  危机（小爆发、高频率）"。这不是两条独立压力的叠加，而是一条父推论的机制（L4-004 的信息
  成本崩塌）【修改了】另一条父推论的机制（L4-003 的锁定维护条件）的运作方式——结果类型
  被改变（革命→合法性危机），非仅量级被调整。这是真正的 L4 级机制交互。

  【交互假说根基诚实声明】本假说的桥接前提——"信息控制是锁定效应的维护条件"——不在
  L4-003 原文机制中。L4-003 的锁定维持机制是多层互锁（结构属性：改一层触发其他层反制），
  而非依赖信息隔离。L4-004 不论述锁定效应。prediction (iii) 的因果链（"数字信息流
  →侵蚀信息控制→锁定更难维持"）是 L4-005 自建的新颖复合假说（novel composite
  hypothesis constructed by L4-005），它结合了 L4-003 的锁定存在性（结构事实）和
  L4-004 的信息成本崩塌（技术事实），但两者之间的桥接前提（信息控制维持锁定）是
  L4-005 自身的理论延伸，非从父推论原文直接推导。这不意味着 prediction (iii) 是错的——
  L4 复合推论的正当贡献方式包括从父推论机制出发构建新假说——但应诚实标注其认识论层级：
  "novel composite hypothesis"而非"derived from parent mechanism interaction"。

  诚实总结：L4-005 的"功能分化"主要是 (A) 合取级——四条独立机制并行运作的综合效果。
  真正的交互级涌现 (B) 仅覆盖 prediction (iii) 这一条，不足以支撑"功能分化是四条 L4
  推论交互涌现的产物"这一整体宣称。本推论将 (A) 称为"薄涌现"、将 (B) 称为"厚涌现"，
  不再将四向分化的整体格局包装为"交互"。

  【Prediction】
  (i) 民族国家不会消亡，但会功能分化——保留暴力终裁+领土内终局规则制定权，其他功能（经济调节/
  社会福利/文化再生产）向上/向下/向外转移。
  (ii) 数字相变使"威权稳定区"（L4-002 的低轮替+低独立+低透明）的存在条件被侵蚀——
  不是因为民主化，而是因为透明被迫提高、低透明不再可行。
  (iii) 制度锁定（L4-003）+数字相变（L4-004）的交互：锁定使公平制度抗拒适应，数字相变使锁定
  更难维持（因为信息流动侵蚀"冻结"所需的信息控制）→制度滞后期缩短但仍存在→张力以更频繁的
  "合法性危机"而非"革命"形式释放。
  (iv) 国家间差异不在于"是否功能分化"（都得分化），而在于"保留多少、交出去多少"——这个比例
  由 L4-002 的政体参数（轮替度+独立度）和 L4-001 的税基结构共同决定。
  (v) 逐格判空：在【税基跨国度高 AND 透明度被迫高 AND 锁定强】的参数条件下，"数字技术
  完全普及+国家功能完全不分化（仍然全包）+长期稳定"这一格预测为空。在低税基跨国+数字威权
  维持低透明度+强锁定的参数组合中，此格不必然为空——全包国家可在高压下维持稳定（格G）。

# === 规则 A：操作化定义 ===

operationalization:
  digital_technology_adoption:
    definition: |
      【自变量之一/技术条件量】社会在信息存储/传输/检索/监控四个维度上采用数字技术的程度。
      这是 L4-004 的核心自变量在本 L4 中的落地——数字相变是否已经发生、发生到什么程度。
    measurement: |
      三维度合成（继承 L4-004 的 information_technology_cost 操作化框架，取数字/非数字对比）：
      (a) 信息存储与复制的边际成本：是否趋近于零（数字复制成本 vs 印刷复制成本）；
      (b) 信息传输的速度与带宽：实时全球传输是否成为默认（互联网普及率+移动宽带覆盖率）；
      (c) 信息检索与监控的成本：是否已从"需要专门机构"降为"普通个体可操作"
      （搜索引擎/社交网络/监控技术的普及度）。
      三维取主导档位：高数字采用=至少两维的数字成本比印刷时代低 ≥1 个数量级。
      【硬约束】不得用"是否出现了新组织形态"反推数字采用程度。
    limitations: |
      数字技术在各国、各领域的渗透不均——在"数字技术完全普及"这一格，需取全球或特定
      社会的覆盖率>80%为阈值。连续量非二分，混合态常见。

  tax_base_transnationality:
    definition: |
      【自变量之二/经济维度量】一国税基中跨国流动部分的占比与增速——即经济交换从国家尺度
      向全球尺度的位移程度。这是 L4-001 的 tax_base_type 在本 L4 中的延伸：不仅是
      "商业 vs 农业"，而是"商业中的国家可征税部分 vs 跨国/数字可逃税部分"。
    measurement: |
      三维度：
      (a) 跨国资本流动：FDI+证券投资的跨境流量/GDP；
      (b) 数字经济的跨境可征税比例：跨国数字服务贸易/总贸易，以及实际征税率 vs 法定税率；
      (c) 跨国公司的利润转移：BEPS（税基侵蚀与利润转移）估计规模/企业所得税总收入。
      三指标独立于"是否出现了超国家治理"测得。
      【硬约束】不得用"签署了税收协定"反推税基跨国性——协定本身可能是对跨国税基的响应（内生）。
    limitations: "跨国税基的测量受避税天堂数据不透明的限制；企业注册地≠经济活动实际发生地。"

  digital_transparency_level:
    definition: |
      【自变量之三/信息维度量】数字技术条件下，信息控制的物理成本——即"不让信息公开"需要
      付出多大代价。这是 L4-002 的透明度维和 L4-004 的数字相变在本 L4 中的交互落地：
      数字技术使"信息泄露成本崩塌"→透明度被迫提高。
    measurement: |
      三维度分轴测：
      (a) 信息泄露的物理成本：在数字技术条件下，阻止一段信息的公开传播所需的资源投入
      （与印刷时代相比下降了多少数量级）；
      (b) 公民信息获取渠道的广度：互联网自由度（非政府审查外的信息可及性）；
      (c) 信息管控的有效性衰减：政府投入的审查预算/GDP 与信息自由度的弹性——即每增加
      一单位审查投入能压制多少单位的信息自由（边际效率）。
      【硬约束】不得用"政体是否稳定"反推透明度高低。
    limitations: "政府审查在数字时代同时在技术上更可行（防火墙/深度包检测）和更易被绕过
      （VPN/卫星互联网/暗网）——净效果取决于审查方与被审查方的技术军备竞赛，非单调方向。"

  institutional_lock_in_degree:
    definition: |
      【中介变量/历史惯性量】民族国家在印刷/工业时代建立的公平制度配置（国家福利/劳动法/
      教育均等化/公民权）对数字时代新条件的抗拒程度。这是 L4-003 的锁定强度在本 L4 中的落地。
    measurement: |
      三维度（继承 L4-003 锁定强度操作化）：
      (a) 底层条件变化的幅度：数字技术带来的稀缺度/亲缘度/规模条件的变化量（与工业化时期对比）；
      (b) 制度配置的调整时滞：从条件变化（如零边际成本信息出现）到制度回应（如数据权利立法）
      的年数；
      (c) 多层冲突的可见频率：DED-022 层间公平冲突在数字时代因各层标准互相可见而上升的幅度。
      【硬约束】锁定强度由条件变化幅度和调整时滞独立测，不得因"制度未调整"就反推"锁定了"。
    limitations: "区分'锁定迟滞'与制度调整的正常时程需要前数字化时期的调整速度基线。"

  functional_differentiation_degree:
    definition: |
      【被预测量/复合输出变量】国家功能的分配状态——哪些功能由国家级机构执行、哪些向上
      （超国家）/向下（次国家）/向外（市场/网络）转移。操作化为四个功能域在"国家独占↔
      多元分配"谱系上的位置。
    measurement: |
      四个功能域分轴测：
      (a) 经济调节功能：货币政策/财政政策/产业政策的制定权在国家层 vs 超国家层（如央行独立性、
      贸易协定约束、数字平台自治）的比例；
      (b) 社会福利功能：教育/医疗/养老/失业保险的提供者在国家 vs 市场 vs 次国家 vs 网络社区的占比；
      (c) 文化再生产功能：语言/教育内容/历史叙事的控制权在国家层 vs 全球平台（互联网内容）vs
      次国家层（地方语言/文化自治）的分配；
      (d) 暴力终裁+终局规则制定权：是否仍为国家独占——若超国家组织（如国际刑事法院/联合国安理会）
      或非国家行为体（如私人军事公司/平台仲裁）系统性地替代了国家的暴力终裁或终局规则制定，
      则国家核心被侵蚀。
      功能分化度=1-(国家级执行占比)，连续量从 0（全包国家）到 1（完全功能分化）。
    limitations: |
      "终局规则制定权"与"规则被实际遵守"之间有距离——国家法律可能名义上仍为终局，
      但实际被国际仲裁/平台条款/地方自治架空。需区分 de jure vs de facto。
    composite_measurement_independence: |
      功能分化度的测量可分解为各父推论测量的组合——经济调节维对应 L4-001 的 tax_base_type
      跨国延伸、信息维对应 L4-004 的数字相变程度、政体稳定维对应 L4-002 的相区定位、
      锁定维对应 L4-003 的锁定强度。

      【"同步位移方向"的操作化——区分"四条独立趋势同时发生"与"交互产生的不可分解复合输出"】
      当前仅能测量四个维度的各自位移并综合描述为功能分化，无法在测量层面区分以下两种情况：
      (a) 合取（四条独立趋势同时发生）：四个维度各有独立的因果链，同时运作但互不依赖。
      (b) 交互（维度间因果耦合）：维度 A 的位移导致或显著放大了维度 B 的位移。
      为此新增三个判据（诚实声明：当前仅判据 (a) 可在横截面数据中操作化，判据
      (b)(c) 需要纵向数据，当前不可完成，仅作为未来研究路标）：

      (a) 时序判据（当前可操作化）：四个维度的位移是否在同一时间窗口（±5 年）内启动？
          若启动时间显著不同（如经济调节的向上移交在 t₁、社会福利的向外转移在 t₁+15 年），
          且后续维度的启动可被先启动维度的事件解释（如"向上移交→财政收入减少→触发
          社会福利向外转移"），则支持交互假说。若四个维度各有独立的时间表（异步），
          则支持合取假说。操作化：取四个功能域首次出现 ≥1 个标准差的功能分配位移
          的时间点，计算四分位距（IQR）。IQR ≤ 10 年 → 弱同步；IQR > 20 年 → 异步。

      (b) 因果判据（需纵向数据）：维度 A 的位移是否【导致或显著放大】维度 B 的位移？
          如：经济调节的向上移交（L4-001）→减少国家财政收入→加速社会福利向外转移
          （L4-004 的技术可能被财政压力激活）→形成跨维度正反馈。操作化需格兰杰因果
          检验或面板 VAR，当前不可得。

      (c) 反事实判据（需纵向+比较案例）：若移除某维度的位移，其他维度的位移是否仍以
          同等幅度发生？若各维度独立（移除 A 不影响 B 的幅度）→合取；若维度间互相依赖
          （移除 A 使 B 的幅度显著降低）→交互。操作化需比较案例设计（如找到"税基未
          跨国但数字高采用"的案例 vs "税基跨国且数字高采用"的案例，比较其社会福利
          向外转移的幅度），当前可行但需系统化收集。

      【诚实标注】prediction (iii) 的交互主张（L4-003+L4-004 机制咬合）目前仅在机制
      层面论证，尚未在测量层面以判据 (b) 或 (c) 操作化。本推论当前的复合性证据主要
      是判据 (a) 级——将四条独立趋势综合描述为同一系统的多维位移。

# === 推导链 ===

derivation:
  from_l3:
    deductions: [DED-022, DED-006, DED-020, DED-003]
  from_l4:
    deductions: [L4-001, L4-002, L4-003, L4-004]
  from_l1:
    axioms: [AXIOM-001, AXIOM-002, AXIOM-003]
    theorems:
      - THEOREM-hierarchy-depth-limit
      - THEOREM-norm-energy-saver
      - THEOREM-cooperation-precondition
      - THEOREM-power-signal-decay
      - THEOREM-group-identity-decay
      - THEOREM-exchange-competition-alternative
      - THEOREM-relation-information-asset
      - THEOREM-conflict-cost
      - THEOREM-position
  from_l2:
    bridging:
      - BR-L2-003
      - BR-L2-004
      - BR-L2-006
      - BR-L2-008
      - BR-L2-009
      - BR-L2-010
      - BR-L2-013
      - BR-L2-015
      - BR-L2-017
  steps: |
    1. 父机制摘要——民族国家稳态的四根支柱
       在印刷/广播级信息技术 + 国家-国际双轨经济交换 + 国家层主导公平标准 +
       大国间军事竞争这四个参数组合下，民族国家是一种稳态（stable equilibrium）：
       - L4-001 解释这个稳态的财政基础：商业税基在国家尺度上流动→让权换税→代议制度。
         税基的地理分布与政治权力的地理边界大致重合。
       - L4-002 解释这个稳态的政体条件：不同的政体因轮替度+独立度+透明度组合落在
         不同的稳定区，但印刷/广播技术条件下低透明是可维持的→威权稳定区存在。
       - L4-003 解释这个稳态的制度惯性：在印刷/工业时代关口制度化时冻结的公平配置
         （国家福利/劳动法/教育均等化）因多层互锁而抗拒变化。
       - L4-004 解释这个稳态的技术边界：印刷/广播技术定义了可行域边界——组织深度
         可支撑民族国家规模、规范复杂度可支撑现代法律体系、交换半径可支撑国家市场。

    2. 四个参数的位移
       (a) 信息技术从印刷/广播级→数字级（L4-004 第三次相变）：
           信息存储/传输/检索/监控成本崩塌。这不仅是"更快"——它改变了组织形态的物理
           可能空间：组织可更平（去中层化）也可更深（全球监控），规范可无限复杂但人脑
           跟不上，信任可外包给算法/区块链替代制度信任，权力制度化成本暴跌（监控成本
           趋零→威权更便宜也使其更脆弱——DED-020 的透明×独立交互在数字时代被放大）。
       (b) 经济交换网络从国家尺度→全球尺度（L4-001 商业税基逻辑扩展到跨国）：
           数字技术使资本/信息/服务可瞬时跨境流动→税基的地理分布不再与政治权力的地理
           边界重合。DED-006 的核心机制——交换网络超出信任半径→非人格化制度涌现——
           在国家尺度上已完成（民族国家内的非人格化制度），现在在【超国家尺度】重新
           上演：跨国交换网络超出任何单一国家的管辖半径→需要超国家制度（贸易协定/
           投资仲裁/税收协调）。L4-001 的"让权方向随税基地理分布而变"在此被推向
           新边界：让权对象从"国内商人（议会）"位移到"国际制度（WTO/ICSID/OECD）"。
       (c) 公平标准从'国家层主导'→多层冲突无法再被压制（DED-022 的逻辑被数字技术放大）：
           DED-022 的核心机制——个体同时嵌入多层（家族/职业/国家/宗教）、各层公平标准
           可能不可通约→层间冲突是结构特征。在印刷/广播时代，信息流动的物理成本高→
           各层之间的不可通约不易被大范围曝光→冲突可被"信息隔离"缓冲。数字技术使不同
           层的"公道"互相可见：社交网络让家族层的公平标准（"自家人优先"）与职业层的
           公平标准（"按绩效分配"）和国家层的公平标准（"法律面前人人平等"）在同一屏幕上
           正面碰撞→不可通约性被可视化→冲突烈度与频率上升。这不仅是"透明提高"——
           它是 DED-022 的层间冲突从"背景噪声"升级为"前台政治"。
       (d) 外部竞争从大国军事竞争→非国家行为体+跨国风险：
           传统民族国家的外部竞争（DED-003 的核心自变量）主要是其他民族国家的军事威胁。
           数字时代的外部威胁扩散到非国家行为体（跨国恐怖网络/网络犯罪组织/巨型科技
           平台）和跨国风险（气候/疫情/金融传染）——这些威胁不尊重国家边界，无法用
           传统国家间军事竞争的方式应对。DED-003 的"外部竞争→内部凝聚"机制在此面临
           转型：当"外部敌人"不是一个明确的民族国家而是一张跨国网络或一种无国界风险时，
           "我们不是他们"的免费锚定效应是否仍然有效？如果外部威胁不再以"国 vs 国"的
           方式运作，则 DED-003 的负面身份锚定失去明确目标→民族国家层面的内部凝聚力
           维护成本上升。

    3. 合力逻辑——四维位移的合力方向
       【诚实标注合力类型】四向各自对应一条独立机制的延伸应用，合起来是【合取（conjunction）】
       而非交互——四条独立机制各自在自己的领域产生压力方向，四个压力方向同时作用于同一个
       系统（民族国家），产生"四向分化"的综合效果。类似四人从四个方向同时推一个箱子——
       这是独立压力的矢量叠加，非"交互产生不可分解的新现象"。
       仅 prediction (iii) 有真正的机制交互（见下文 step 4 和 Emergent property 节）。
       四条 L4 推论的合力不是加法——是同一个系统在四个维度上同时被推。
       - L4-001 的税基逻辑决定"国家怎么收税、对谁负责"：税基跨国化→国家在经济调节
         维度上的"对谁负责"发生漂移——对国内公民（via 代议）的负责和对国际市场/
         跨国资本（via 信用评级/投资者信心）的负责之间出现张力。
       - L4-004 的数字相变决定"什么组织形态物理上可能"：组织深度可深可平→国家可以
         更集权（数字监控）也可以更去中心化（数字自治/DAO）→为功能分化提供了技术可能。
         信任替代机制多元化（区块链/算法评分/平台仲裁）→为"向外包"提供了可行方案。
       - L4-002 的政体相图决定"政体往哪移"：数字使透明度被迫提高→威权稳定区（低透明）
         的存在条件被侵蚀→高轮替+高独立区的"民主稳定区"并非自动获胜——因为数字也
         使监控成本暴跌，威权国家可利用技术维持"高监控+中透明"的新配置（数字化威权
         =低独立+中高透明+高监控≠数字民主化）。
       - L4-003 的锁定逻辑决定"公平制度能否跟上"：在印刷/工业时代锁定的公平制度配置
         （国家福利/劳动法/教育均等化）面临数字时代新条件（零边际成本信息/全球劳动力市场/
         平台经济）→锁定抗拒改变→制度滞后积累张力。数字技术同时侵蚀"冻结"所需的信息
         控制→锁定更难维持→滞后期缩短但仍存在→张力释放的频率上升但每次的烈度可能下降
         （以"合法性危机"而非"革命"形式）。
       四个维度的位移方向凑在一起，指向同一个结论：功能分化。因为：
       - 向上交（超国家）→ 税基跨国化（L4-001）+ 跨国风险无法由单一国家应对（DED-003 转型）
         → 国家被迫在贸易/税收/气候/金融监管上移交主权。
       - 向下放（次国家）→ 数字使小群体自组织可行（L4-004 组织变平效应）+ DED-022
         多层冲突使"统一国家标准"的前提崩解（不同群体要求不同的公平标准）→ 地方/社群
         自治空间扩大。
       - 向外包（市场/网络）→ 数字降低外部制度替代成本（L4-004 信任替代机制多元）+
         L4-003 锁定导致国家制度供给滞后（公众需求超越国家供给能力）→ 市场/网络填补空缺。
       - 向内收（核心独占）→ 暴力终裁+终局规则制定权在国家间竞争（DED-003）和内部
         秩序（DED-012 坐寇逻辑）中仍是不可替代的功能——没有超国家实体能替代国家的
         暴力垄断与领土内终局裁决，这部分"向内收"是功能分化的稳定内核。

    4. 涌现论证（详见 emergence_demonstration）
       功能分化这一结论不能被任何单条 L4 父推论推出：
       - L4-001 单独只能预测"税基变化→让权方向位移"——但不说让权后国家的其他功能
         （社会福利/文化再生产/安全）往哪走。
       - L4-002 单独只能预测"透明度上升→威权稳定区缩小"——但不预测"分化"作为
         所有政体的共同方向，也不预测分化后的功能配置。
       - L4-003 单独只能预测"锁定迟滞积累张力"——但不预测张力的释放形式（向上/向下/
         向外分散而非集中革命），也不预测锁定的"冻结"本身被数字技术侵蚀。
       - L4-004 单独只能预测"技术可行域扩张"——但不预测扩张后社会选择"分化"而非
         "新的集中"（技术上数字可以支持极致的中央监控=反向集中）。
       四条合力才推出"四个方向同时拉→功能分化"这一多维位移格局。

    5. 多父逐格判空（详见 emergence_demonstration.multi_parent_cells）
       在数字技术采用度 × 税基跨国度 × 透明度 × 锁定度的笛卡尔积空间中，
       多个格子需要父推论合力。招牌空格"数字完全普及+零功能分化+长期稳定"需要
       L4-001+L4-002+L4-003+L4-004 四条合力——任一单条都无法单独强制该格为空。

# === 涌现证明 ===

emergence_demonstration:
  necessity: |
    逐一移除每条 L4 父推论，L4-005 的结论无法成立：
    - 移除 L4-001（国家形成轨迹）：失去"税基地理分布→让权方向"的机制——无法解释
      为什么功能分化的"向上交"方向是超国家治理而非别的安排。税基跨国化是"向上交"
      的核心驱动力→无此则功能分化的四方向缺一角，"向上+向下+向外+向内"的格局被打破。
    - 移除 L4-002（政体稳定相图）：失去"透明度上升→威权稳定区侵蚀"的机制——无法解释
      为什么功能分化是所有政体的共同方向（而非仅民主国家的选择）。L4-002 解释了为什么
      连威权国家也无法保持"全包国家"——因为透明被迫提高→"不分化"所需的信息控制不再
      可持续。无此则功能分化退化为"民主国家自己选的路线"而非"结构必然"。
    - 移除 L4-003（制度共演锁定）：失去"锁定迟滞→张力积累"的机制——无法解释为什么
      功能分化不是平滑过渡而是"危机驱动"的阶梯式进程。L4-003 解释了制度配置抗拒
      适应的惯性→张力积累→阶段性释放→分化的节奏是"合法性危机→被迫让渡功能"而非
      "理性设计→主动移交"。无此则分化的动力学丢失，退化为静态的功能重新分配图。
    - 移除 L4-004（IT→社会形态）：失去"技术可行域扩张"的机制——无法解释为什么
      "向外包"和"向下放"在物理上变得可能。数字技术使市场/网络替代制度（向外包）和
      小群体自组织（向下放）的成本降至物理可行→无此则功能分化的两个方向（向外和
      向下）失去技术基础，分化退化为"向上交（超国家）+向内收"的二分——这正是传统
      "超国家治理"论（如 Rodrik 三难困境）的射程，不是 L4-005 的独有主张。
    结论：四条 L4 父推论每一条都承载不可替代的机制贡献——无"观众砖"。

  novelty: |
    逐条对照各 L4 父推论的单独结论与 L4-005 的核心预测：
    L4-001 单独结论：税基类型×外部竞争→国家形态分叉（制度型/采掘型/退化）。
      不说"国家功能的多维分化（向上/向下/向外/向内）"，不说"让权对象从国内议会
      转移到国际制度"，不说数字时代税基跨国化对国家形态的影响。
    L4-002 单独结论：轮替度×独立度×透明度→四区稳定相图+相变边界。
      不说"所有政体都走向功能分化"，不说"分化后的功能配置由政体参数决定"，
      不说数字技术使透明度被迫提高→威权稳定区不可维持。
    L4-003 单独结论：Dunbar 关口的初始条件（亲缘度+稀缺度）被制度化冻结→锁定迟滞。
      不说"锁定在数字时代被信息流动侵蚀"，不说"锁定+数字的交互使张力以合法性危机
      而非革命形式释放"，不说锁定对国家功能配置的影响。
    L4-004 单独结论：IT 成本数量级跃迁→四条天花板共移→社会复杂度相变。
      不说"相变的具体归宿是功能分化（而非新的集中）"，不说"数字技术同时使向上交（全球
      协调）、向下放（小群体自治）、向外包（市场替代）都不矛盾地成为可能"，
      不说"数字技术不必然导向功能分化——技术上同样可以支持极致中央集权"。

    L4-005 的下列核心命题不能被任何单条父推论推出：
    (a) "四个维度的位移方向（向上+向下+向外+向内）凑在一起→功能分化是多维合力
       的必然结果，而非任何单维的充分条件"：
       L4-001 给向上推力（税基跨国化→超国家）；L4-004 给向外+向下推力（技术使市场/
       网络替代可行+小群体自组织可行）；L4-002 给"无法不走"的推力（透明度→威权稳定区
       侵蚀→国家无法维持全包）；L4-003 给"不会顺利走"的制动（锁定→张力积累→危机驱动）。
       任一条单独只给出一个方向或一个约束，不能导出"四个方向同时拉→功能分化"的综合结论。
    (b) "功能分化的具体格局——向上交（超国家治理）、向下放（次国家自治）、向外包（市场/
       网络替代）、向内收（暴力+终局规则独占）——这四维分配"：
       不在任何单条父推论中。传统超国家治理理论（Rodrik）给"向上交"但不给"向下放"和
       "向外包"；地方自治/联邦主义理论给"向下放"但不给"向上交"和"向外包"；私有化/
       外包理论给"向外包"但不给其余三维。四维同时位移的格局是 L4-005 独有的合成产物。
    (c) "数字技术完全普及+国家功能完全不分化+长期稳定=空格"：
       需要 L4-001（税基跨国化→不分化则经济调节失效）+ L4-002（透明度被迫提高→
       不分化则威权稳定区不可维持）+ L4-003（锁定导致制度滞后→不分化则张力积累无出口）
       + L4-004（技术可行域已变→不分化则技术压抑了组织可能空间→效率损失）四条合力。
       任一条单独不强制该格为空。
    (d) "锁定（L4-003）+数字（L4-004）的交互：锁定抗拒适应、数字侵蚀冻结所需的信息
       控制→滞后期缩短但仍存在→张力以'合法性危机'而非'革命'频率释放"：
       L4-003 单独只给"锁定→迟滞"，不说锁定被侵蚀的机制。L4-004 单独只给"技术改变
       组织形态可能"，不说技术侵蚀锁定。两者合力才给出"锁定仍在但效力衰减"的动态。
    结论：L4-005 的核心预测中有至少四条不能在任一条父推论中读出。其中：
    - (a)"四维同时位移"和 (b)"四向分化格局"属于合取级新颖性（conjunction）——四条独立
      机制的并行压力在民族国家这一共同对象上产生的综合效果，不能被任何单条父推论推出。
    - (d)"L4-003+L4-004 机制咬合→滞后期缩短→合法性危机替代革命"属于交互级新颖性
      （interaction）——一条父推论的机制修改了另一条父推论的运作条件，产生不可分解
      的新预测（结果类型被改变，非仅量级调整）。这是本推论中唯一的真正 L4 级交互。
    - (c)招牌空格属于合取级——需多条父推论合力才能强制为空，但机制结构是"多条独立压力
      叠加"，非"机制交互产生第三方向"。
    综上：满足 L4 新颖性门槛（合取级），prediction (iii) 额外提供交互级新颖性。

  multi_parent_cells: |
    参数空间 = 数字技术采用度（高/低）× 税基跨国度（高/低）× 透明度（高/低）
              × 制度锁定度（强锁定/弱锁定/已解冻）。
    被预测量 = 功能分化度（完全分化/部分分化/几乎不分化/不分化且稳定/不分化且不稳定）。

    基线行:印刷/广播时代（数字采用=低）——此时民族国家稳态仍然可行。
    ┌──────────────────────┬──────────────────────────┬──────────────────────────┐
    │ 数字=低              │ 税基跨国=低              │ 税基跨国=高              │
    ├──────────────────────┼──────────────────────────┼──────────────────────────┤
    │ 透明=低+锁定=强      │ 经典民族国家稳态          │ 税基-制度错配            │
    │                      │ 来源:L4-001(税基-政治     │ 来源:【L4-001+L4-003     │
    │                      │   边界重合→让权换税在     │   合力】                │
    │                      │   国内闭合)+L4-002(低透明 │ L4-001:税基跨国化→      │
