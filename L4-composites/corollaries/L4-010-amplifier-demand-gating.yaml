id: L4-010
type: composite_deduction
layer: L4-composites
deduction_form: composite
status: rejected
term: "价值储藏放大器的需求部门门控 (Demand-Side Gating of the Store-of-Value Amplifier)"
claim_type: trajectory_prediction  # r1 RF-5: 原 phase_transition 与"无阈值连续门控"设计自相矛盾，改注纵向序列证据类型（gate 序列 vs 弹性序列的单调/先行关系）

人话摘要: "金价对增量需求的'放大器'不是常开的——央行和储户抢金子时放大器全开、等量买盘能掀翻价格；ETF玩家主导时放大器休眠、买卖更'讲道理'。谁在买、决定了买多少会动多少。"

statement: |
  【Epistemic Status 诚实声明（r1 整改后更新）】
  本条的核心机制——"DED-030 的存量-流量放大器由需求端构成门控"——源自 L4-009
  （金价体制切换，rejected）五轮审查中唯一未被红旗打穿的交互贡献，本条将其剥离为
  独立 L4 推论。round_1 独立对抗审查判 needs_revision（5 required），整改后的诚实
  证据状态：
  (1) 涌现声称已从 interaction 降格为 conjunction（薄涌现，RF-2 路径 b）——gate 的
  全部弹性标签操作上取自 DED-030 步骤 5 的持有者分层，DED-029 经"引擎→买家弹性"
  【自制承重桥】提供动机解释、独立核查轴与先行性预测，不进入格子判定；
  (2) v1 的两大支持锚点（2022–24 / 2013）的单位流量对比在注册口径（|ΔlogP| 年化 /
  注册分母）下方向反转，已按第 11 条判例移入 counterexamples 作反例候选——当前
  【无幸存的复合特有支持锚点】，Rule G 暂不满足，核心单调性命题是"证据状态暂时
  不利的待检验假说"，其存亡压在 falsifiability (a) 的全样本四分位检验上；
  (3) 招牌格新增 flow_coverage > 1 存量争夺条件（RF-4）后，v1 旗舰窗口 2022–24
  按粗算（≈0.9–0.95）连招牌格资格都未清晰满足。
  如获 verified，置信度天花板 = verified（conjunction/薄涌现按 METHODOLOGY 不授
  verified*；min(父 CAP)=3 只是上界之一，涌现类型才是 verified* 的判据——r1 should-3 修正）。

  【核心命题】
  DED-030 确立了金价对增量需求的"结构性放大器"——存量/流量比约 50–70 倍 → 供给近乎
  垂直 → 年增量需求仅占存量 0.5% 却可造成不成比例的价格移动。但这个放大器【不是常开的】。
  它的激活强度取决于需求端的构成——即 DED-029 的四引擎此刻在驱动"谁"进入市场。

  当边际买家来自低弹性层（央行/C3 驱动、金条金币储蓄型/C2 驱动），价格几乎不构成买入
  决策的约束——买家"不管多贵都要买"。此时等量增量需求的价格冲击数倍于高弹性买家
  （ETF/投机型/C1 驱动）主导期。原因不只是买家不敏感——更关键的是低弹性买家争夺的
  对手方（存量持有者中的低弹性层——首饰、其他央行、金条金币长期持有者）同样不肯卖，
  形成"双向低弹性夹击"——买家不计价、卖家不让价 → 价格必须大幅移动才能出清。

  反之，当边际流量由高弹性层吸收（ETF 流入/流出、回收金供给），放大器趋弱——高弹性
  参与者对价格敏感，买卖双方的弹性都在高位 → 等量流量对应较小的价格移动。

  【门控变量——连续量，无需离散阈值（吸取 L4-009 教训）】
  gate = low_inflow / (low_inflow + high_outflow)

  其中：
  - low_inflow = 央行季度净购金量 + 金条金币季度净投资需求（吨），≥ 0 时取原值，< 0 时
    取 0（低弹性层净卖出归入另一分析域，本条的核心预测只覆盖低弹性净买入情形）。
  - high_outflow = |ETF 季度净流出| + 季度回收金供给量（吨）。ETF 净流入时该项的 ETF
    分量为 0（ETF 在买 → 属高弹性买家在场，不产生高弹性卖出压力）。
  - gate ∈ [0, 1]。gate → 1 表示低弹性净买入主导、高弹性卖出压力近乎为零。
    gate → 0 表示高弹性卖出主导或低弹性买入缺位 → 放大器休眠。
    【r1 RF-4 补注】gate → 1 本身不蕴含"必须从低弹性持有者手中抢存量"——矿产供给
    （~3600 吨/年）是永在场的卖方流量、不在 gate 分母内（省略理由见 operationalization）。
    放大器"全开"（招牌格）额外要求流量覆盖条件 flow_coverage > 1（低弹性买入超过
    扣除首饰/工业需求后的剩余流量供给，见 operationalization.flow_coverage）；
    仅 gate 高而覆盖不足时，预测降为"冲击升高但非最大"。

  连续量的设计动机（与 L4-009 的离散体制二分对比）：不预设放大器"开/关"的二元状态，
  不注册阈值，不面临"阈值两侧案例归错格"的闸门击穿风险。gate 是连续驱动量，预测是
  "gate 越高 → 单位流量的价格冲击越大"的单调方向性假说——可被 gate 与价格冲击的
  秩相关/单调回归直接检验，不需离散分类。

  【独有可证伪预测——区别于两条父推论各自给出的东西】
  (i) 单位增量需求的价格冲击弹性（Δ金价% / 净增量需求吨）不是常数——它是 gate 的
  单调增函数。gate 高（低弹性买家主导）时弹性数倍于 gate 低（高弹性层主导）时。
  (ii) "双向低弹性夹击"格——gate > 0.7 且高弹性卖出压力低（ETF 未大规模流出、回收金
  未激增）且 flow_coverage > 1（低弹性买入超过剩余流量供给——存量争夺条件，
  r1 RF-4 补注）时——单位需求冲击的价效应最大。此格是 L4-010 的招牌预测：DED-029 单独
  不给价格弹性、DED-030 单独不给需求端构成 → 二者的交互才产生"何时放大最猛"的条件命题。
  (iii) gate 本身是先行指标——需求端构成（gate）的变化领先于金价的放大/非放大响应，
  因为机构配置（央行购金按季披露）和零售储蓄行为（金条金币购买的粘性）的惯性大于
  价格发现的速度。

  【Parent mechanisms——每条父给什么】
  DED-029 给需求端的构成逻辑：四引擎各自驱动不同类型的买家入场——
  C1（实际利率↓→机会成本↓）主要驱动 ETF/投机型高弹性买家；
  C2（通胀预期↑→购买力保值）驱动金条金币储蓄型中等偏低弹性买家；
  C3（法币信用↓→主权风险规避）驱动央行极低弹性买家；
  C4（不确定性↑→避险配置）驱动混合型买家，构成取决于不确定性来源。
  独有贡献：需求端"谁在买、为什么买"的分类依据——四引擎各自对应不同的买家弹性剖面。
  诚实标注：DED-029 原文未显式给出"引擎→买家类型→弹性"的映射——该映射是本条的
  合成贡献，四引擎与买家弹性的对应关系是经验赌注（见 falsification_trace.primary_suspect）。

  DED-030 给供给端的放大器结构：S/F ≈ 50–70 → 供给曲线近乎垂直 → 定价权在存量持有者
  的保留价格分布；持有者异质性 → 弹性排序为 首饰≈央行 < 金条金币 < ETF/投机者≈金矿商 →
  边际卖家的弹性决定增量需求的价格冲击大小。
  独有贡献：放大器的"硬件"——S/F 结构 + 持有者分层 + "谁在卖决定了卖盘的弹性"。
  诚实标注：DED-030 原文未给出放大器的门控条件——它描述的结构是"随时在场"的，
  本条的增量在指出"在场 ≠ 同等激活"。

  【Emergent property——涌现类型声明: conjunction（薄涌现，r1 RF-2 降格）】
  v1 曾声称 interaction（厚涌现）。r1 审查在构造层面推翻：按 gate 的实际构造
  （纯 WGC 实物流量、纯持有者身份类别），四格的弹性标签全部可由 DED-030 步骤 5
  的持有者分层供给，DED-029 的测量内容不进入格子判定——"引擎→买家弹性"映射是
  本条的自制承重桥（非 DED-029 原文）。本条选择诚实降格：涌现类型 = conjunction。
  合成命题（gate 构造 + gate-弹性单调性 + 先行性）仍不在任一父推论字面内、非父
  结论的 AND/OR 拼接（r1 旗 13 认可），但不再声称"一条机制修改另一条机制的运作
  条件"。状态天花板相应改为 verified（薄涌现不授 verified*）。

# === 规则 A：操作化定义 ===

operationalization:
  gate_ratio:
    definition: |
      放大器门控变量——低弹性净买入占总边际流量活动（低弹性买入 + 高弹性卖出）的比重。
      连续量 ∈ [0, 1]，不设离散阈值。gate 越高 → 放大器激活越强 → 单位增量需求的
      价格冲击越大。
    measurement: |
      分子 = max(0, 央行季度净购金量 + 金条金币季度净投资需求)，数据来源为 WGC
      Gold Demand Trends 季度报告（央行购金 + 金条金币需求），以吨计。
      分母 = 分子 + |min(0, ETF 季度净流量)| + 季度回收金供给量。
      ETF 季度净流量同样来自 WGC（ETF 及类似产品），正值为净流入（属高弹性买入，
      不计入分母的高弹性卖出项——ETF 在买时不产生高弹性卖出压力），负值为净流出
      （其绝对值计入分母的高弹性卖出项）。
      回收金供给量来自 WGC 季度回收金统计，始终 ≥ 0。
      低弹性净买入 ≤ 0 时 gate = 0（低弹性层净卖出属另一分析域，本条核心预测
      只覆盖低弹性层净买入情形——该限定是事前的射程声明，非事后开脱）。
      口径定死：分子=央行购金+金条金币（WGC 投资需求分项中的"金条与金币"子项，
      零售投资），分母=分子+ETF 净流出绝对值+回收金。WGC 的"金条金币"与"ETF"
      分属投资需求的不同子项，互不重叠——分子/分母各项独立可加。
      【r1 RF-4 两项省略的事前注册（一次性辩护，事后不得改口）】
      (i) 矿产供给（~3500–3600 吨/年）不入 gate 分母。理由：gate 度量的是
      "低弹性买入 vs 高弹性【持有者卖出】压力"的构成对比——矿产是新流量、
      非持有者行为，且其短期弹性极低（DED-030：生产者无法快速增产），塞入
      "高弹性卖出"项会错标其弹性。但矿产流量的在场使 gate → 1 不蕴含存量
      争夺——该角色由独立注册的 flow_coverage 条件承担（见下），不由 gate 承担。
      gate 的定义名称相应收窄为"持有者边际流量构成比"，不再声称覆盖
      "总边际流量活动"（一致性原则）。
      (ii) WGC "OTC 及其他投资"项（2023–24 达数百吨/年）不入 gate 分子/分母。
      理由：该项弹性异质（家族办公室/高净值/机构场外，动机混合）且 WGC 将其
      部分作为供需平衡残差项估计、数据质量低于其他分项——强行归入任一弹性桶
      会注入未经验证的弹性标签。代价诚实声明：OTC 大项在场的窗口（注册触发：
      WGC 年报 OTC 项 > 300 吨/年），gate 对"低弹性买入主导"的度量存在
      主流量级缺口，此类窗口的 gate 读数须标注并做剔除敏感性检验；若未来
      检验显示 OTC 窗口系统性偏离预测，此省略即为 primary_suspect 层级的
      操作化根因之一。
    limitations: |
      WGC 数据按季发布、有 1–2 个月的滞后（如 Q1 数据通常在 4–5 月发布），
      实时 gate 不可得——但滚动 gate（滞后 1 季）在操作上是可行的先行指标。
      央行购金的部分国家延迟披露或仅按半年/年度报告，WGC 季度估计含插值——
      插值误差在季度级 gate 中引入噪声但不改方向（年度级 gate 更干净但牺牲时间粒度）。
      金条金币需求含"投资"与"收藏/送礼"动机的混合——WGC 不区分两者，
      "低弹性"假设对收藏/送礼动机更强（情感黏性）、对纯投资动机更弱——
      这是 primary_suspect 的操作化根因。
      回收金的弹性归类：回收金供给在金价上涨时通常增加（正弹性），归入高弹性层；
      但在极端经济压力下（如印度农户被迫卖金饰求生），回收金可能变为非弹性——
      此类窗口的 gate 读数会高估放大器激活强度，需在窗口分析中独立标注。

  price_impact_elasticity:
    definition: |
      单位净增量需求对应的金价百分比变动——放大器激活强度的被预测量。
      以季度为观测单位：Δlog(金价) / 净需求变动量（百吨），此为简化弹性——
      承认需求与价格互为内生，此处的"弹性"是条件相关而非因果弹性估计。
    measurement: |
      【r1 RF-1 口径一次性注册——符号/窗口/分母三个自由度全部定死，事后不得再选】
      (a) 符号口径：单调性检验（falsifiability a/d）比较的是【幅度】——
      |Δlog P| / |净需求变动量|。带符号弹性只用于独立的方向核查（高 gate 窗口
      带符号弹性应为正），不进入 Q1–Q4 幅度比较——防止"gate 高↔价格在涨"的
      符号结构机械满足（r1 旗 3(ii)）。
      (b) 窗口口径：一律年化。季度观测用季度 Δlog P / 季度流量；多年窗口必须
      逐年（或逐季）计算后取均值，禁止"多年累计价格变动 ÷ 单年流量"的混合口径
      （v1 旗舰锚点即栽在此，见 counterexamples）。
      (c) 流量分母口径：同期 WGC 可识别净需求 = 央行净购金 + 金条金币净需求 +
      ETF 净流量 + 其他制造需求净变动（以百吨计）——锚点算术必须用此注册分母，
      不得换用"央行−ETF"等未注册变体。
      分子：LBMA 金价定盘价的季度末对数差（Δlog P）。
      分母不包含回收金（回收金是供给而非需求，已计入 gate 分母的高弹性卖出项）。
      在 gate 高四分位窗口与 gate 低四分位窗口分别计算平均幅度弹性，比较组间差异。
      【变量共享披露（r1 旗 3(i)，修正 v1 discriminant_validity 的过度声称）】
      gate 的构成变量（央行/金条金币/ETF 流量）与本弹性的分母共用同一批 WGC
      流量系列——自变量与被预测量的分母高度重叠，此为已披露的测量焊点。
      方向性分析：共享使高 gate 窗口（低弹性买入大）倾向于分母偏大 → 幅度弹性
      被【压低】——机械偏误方向【不利于】本条预测（高 gate 组弹性被低估），
      故该共享不会伪造支持性结果；但它会放大反例的表观强度，解读 2013 类
      逆周期买入窗口时须记入此偏误。价格分子（LBMA）与流量分母（WGC）异源。
    limitations: |
      需求量与价格互为内生（金价上涨吸引 ETF 流入、金价下跌挤出回收金），
      OLS 弹性估计有联立性偏误。干净检验需以外生需求冲击为工具（如央行购金公告、
      储备冻结事件的短期窗口），或至少诚实标注为"条件相关"而非因果弹性。
      季度频率的样本量小——clean gate 极端窗口（gate > 0.7 或 < 0.3）的季度数
      有限，统计功效受制。年度频率降低内生性但牺牲 gate 的时间变化精度。

  flow_coverage:
    definition: |
      【r1 RF-4 新增】存量争夺条件——低弹性买入对"无需持有者让货即可获得的流量
      供给"的覆盖倍数。招牌格（双向低弹性夹击 → 冲击最大）的机制前提是"可买的
      流量不够、必须诱使低弹性存量持有者让货"；矿产供给永在场（~3600 吨/年），
      仅 gate 高不构成该前提。
    measurement: |
      flow_coverage = low_inflow / max(1, 矿产供给 + 回收金供给 + |min(0, ETF 净流量)|
      − 首饰净需求 − 工业净需求)，同期同频（季度或年度），全部取 WGC/Metals Focus
      公开统计。分母为"扣除非投资渠道（首饰/工业）吸纳后、留给投资性买家的剩余
      流量供给"；分母 ≤ 0 时（首饰+工业吃掉全部流量）取 1 使 coverage 饱和为高位。
      招牌格资格 = gate > 0.7 且 flow_coverage > 1（低弹性买入超过剩余流量供给 →
      必须动用存量 → 存量持有者的保留价格分布成为边际定价者）。
      flow_coverage ≤ 1 时即便 gate 高，预测降为"冲击升高但非最大"（合力格待遇）。
      此条件为事前注册，与 gate 同受 anti_talisman (5) 的口径锁定约束。
    limitations: |
      首饰/工业需求本身含价格弹性（涨价抑制首饰），使分母内生于价格——coverage
      的极端读数（>>1 或 <<1）比临界读数（≈1）可靠。粗算示例（年度、WGC 口径）：
      2022–24 low_inflow ≈ 2200–2300 吨/年，剩余流量供给 ≈ 3600+1250+100−2200(首饰)
      −300(工业) ≈ 2450 吨/年 → coverage ≈ 0.9–0.95——v1 声称的旗舰"放大器全开"
      窗口按本条件连招牌格资格都未清晰满足，此为 RF-4 修复的诚实代价，记入
      Epistemic Status。

  buyer_elasticity_profile:
    definition: |
      边际买家的价格弹性特征——由 DED-029 四引擎的活跃状态推断，不由金价行为反推。
      用于 cross-validate gate 的构成合理性（gate 声称的低弹性买家入场是否对应
      C3/C2 引擎的独立激活）。
    measurement: |
      对每个季度，评估 DED-029 四引擎各自的活跃状态（各沿用 DED-029 的独立测量轴：
      TIPS 实际利率变动方向、盈亏平衡通胀率变动方向、主权 CDS 利差变动方向、VIX
      变动方向）——标记该季度各引擎的"方向性信号"（↑/↓/→）。
      C3 或 C2 任一发出看涨信号（法币信用↓/通胀预期↑）且 C1 未发出强反向信号 →
      低弹性买家在场的前提条件成立。
      不用于 gate 的计算（gate 完全由 WGC 实物流量数据构造），仅用于：
      (a) 检验期的独立 gate-引擎一致性核查——若 gate 高但四引擎无一指向低弹性买家
      入场，gate 的构成解释被质疑；(b) 为 falsifiability (c) 的独立引擎确认提供操作化。
    limitations: |
      四引擎的季度级信号有噪声——TIPS 变动可能反映流动性冲击而非实际利率的实质变化。
      仅作一致性核查，不替代 gate 自身（gate 是实物流量测度，与引擎信号正交）。

derivation:
  from_l3:
    deductions: [DED-029, DED-030]
  from_l1:
    axioms: [AXIOM-001]
    theorems: [THEOREM-value-attribution]
  from_l2:
    bridging: [BR-L2-021, BR-L2-022, BR-L2-024]
  from_l4: []
  steps: |
    1. 父机制摘要
       DED-029：金价由 E_network × S 驱动（U≈0, S 稳定），E_network 随四个独立测度
       的引擎伸缩——实际利率(−)/通胀预期(+)/法币信用(−)/不确定性(+)。四引擎统一走
       E_network 通道，各自驱动不同类型的主体调整其黄金配置。单因素阶段只做方向预测，
       多因素交互显式让渡给 L4。
       DED-030：S/F ≈ 50–70 → 供给曲线近乎垂直 → 定价权在存量持有者的保留价格分布
       而非生产者的边际成本。持有者异质性形成弹性分层——首饰≈央行 < 金条金币 <
       ETF/投机者≈金矿商 → 边际卖家的身份决定增量需求的价格冲击大小。
       区分性预测：金价可在 AISC 以下长期运行（标准成本定价模型不可给出此预测）。

    2. 交互逻辑——需求构成如何门控供给侧的放大器
       DED-030 给出的放大器是一个"硬件"——S/F 极端不对称使供给无弹性，需求冲击
       天然被放大。但它不回答：这个放大器是否在所有需求冲击下同等地表达？
       DED-029 给出的四引擎不仅驱动"买不买"——不同引擎激活不同类型的买家，而不同
       买家的价格弹性有系统性差异：
       - C3（法币信用↓→主权风险规避）激活央行——储备配置决策不基于金价高低
         （央行买金不看价、看的是储备资产的安全属性），是市场中最低弹性的买家。
       - C2（通胀预期↑→购买力保值）激活零售金条金币储蓄——对价格有一定敏感性
         （贵了少买、跌了多买）但调整弹性远低于 ETF 层（物理持有 + 储蓄惯性的粘性）。
       - C1（实际利率↓→机会成本↓）激活 ETF/投机型资金——对价格高度敏感，
         追涨杀跌，是市场中最高弹性的边际参与者。
       - C4（不确定性↑）激活混合型买家——构成取决于不确定性的来源：
         地缘不确定性 → 央行+主权基金（低弹性）；金融不确定性 → 机构避险
         （中等弹性）；政策不确定性 → 零售避险（中等偏低弹性）。

       当 C3 或 C2 引擎主导、而 C1 引擎未发出强反向信号时，边际买家来自低弹性层——
       这些买家"不管多贵都要买"（央行）或"贵了少买但跌了多买"（金条金币逆周期）。
       此时 DED-030 的放大器【全开】：供给无弹性 + 买家无弹性 → 价格必须大幅移动
       才能出清。

       当 C1 引擎主导时，边际买家来自高弹性 ETF 层——买家对价格敏感，涨多了买盘
       退缩、跌多了买盘涌入。此时放大器【部分开启或休眠】：供给的无弹性仍在，
       但买方的弹性提供了一种缓冲——价格稍动就能调节需求量，不需要大幅移动来出清。

       更进一步：不仅买家弹性重要，卖方的弹性也重要。当 low_inflow（低弹性买入）
       主导市场而 high_outflow（ETF 卖出+回收金）低时，意味着"低弹性买家在买、
       高弹性卖家没在卖"——双向低弹性夹击 → 边际卖家沿保留价格分布大幅上移（因为
       在卖的都是不肯让价的低弹性持有者）→ 等量买入推动数倍的价格移动。
       当 high_outflow 高时（ETF 在抛售、回收金涌入），意味着"市场上同时有低弹性
       买家和大量高弹性卖家"——高弹性卖家提供了缓冲，价格冲击被部分吸收。

       这个双向弹性分析是任何单条父推论不能给出的：
       - DED-029 单独：知道谁在买、为什么买，但不知道买方弹性差异如何转化为不对称
         的价格冲击（价格弹性不在其射程内——它只做方向预测）。
       - DED-030 单独：知道供给无弹性 + 持有者分层，但不知道哪种需求构成会激活
         哪个持有者层成为边际卖家——"谁在买"决定了"谁在卖"（买的是低弹性层锁仓 →
         可卖的存量变少 → 边际卖家上移到更低弹性层 → 价格冲击更大），这个链条的
         前半段（谁在买→推导谁将成为边际卖家）是 DED-030 不处理的。

    3. 涌现论证——为什么不是平凡合取
       gate_ratio 作为复合变量的涌现资格：
       (a) gate 不在任何单条父推论中——DED-029 有四引擎但无 gate，DED-030 有弹性
       分层但无"低弹性买/高弹性卖"的比率构造。
       (b) gate 的预测（gate 越高的窗口单位需求的价格冲击越大）不是 AND 拼接——
       DED-029 的预测是方向（C_i↑→金价↑/↓），DED-030 的预测是"需求冲击天然被放大"。
       两者的 AND 是"需求冲击天然被放大 + 四引擎决定方向"——这是平凡合取。
       本条的非平凡增量在："放大的【倍数】随需求构成系统性变化"——DED-029 不说倍数，
       DED-030 不说变化。合起来才产生"gate-弹性单调性"这个新命题。
       (c) 涌现级别的诚实定位（r1 RF-2 降格后）：v1 曾声称交互级（DED-029 的需求
       构成"修改了"DED-030 放大器的运作强度）。r1 审查在构造层面推翻该声称：
       gate 的计算完全由 WGC 实物流量构造、其弹性标签（央行/金条金币低弹性、
       ETF/回收金高弹性）完整来自 DED-030 步骤 5 的持有者分层——DED-029 的测量
       内容不进入格子判定，"引擎→买家弹性"映射是本条自制承重桥（非 DED-029 原文）。
       本条接受降格：涌现级别 = conjunction（薄涌现）。合取级资格的论证：
       两条父推论各自独立供压——DED-029 独立给出"低弹性买家【何时、为何】入场"
       （C3/C2 引擎激活的时序与动机，及由此派生的先行性预测 iii：机构配置与零售
       储蓄的惯性使 gate 领先于价格响应——此腿离开 DED-029 的引擎-时序内容无法
       成立）；DED-030 独立给出放大器结构与持有者弹性分层。二者的矢量合成命题
       （"放大倍数随需求构成系统性变化，且构成变化可被引擎信号提前读出"）不在
       任一父的字面内、也非父结论的 AND/OR 拼接（r1 旗 13 认可）。
       诚实标注遗留风险：静态 2×2 填格的"两父合力"按 r1 旗 14 判定趋零（弹性
       标签全在 DED-030 内）——合取级资格现依托于先行性/动机腿对 DED-029 的
       不可替代依赖，该依托是否满足 METHODOLOGY 合取级条件 (c)（至少一格需两父
       合力），留待 round_2 裁决。若裁决不满足，本条应退化为 DED-030 的 L3 扩展
       并 rejected（作者不预先辩护）。

    4. 多父逐格判空
       2×2 判据表——自变量为两个维度：
       维度 1（DED-029 贡献）：边际买家弹性。低弹性（C3/C2 引擎激活，央行/金条金币
       主导净买入，gate > 0.5）vs 高弹性（C1 引擎激活，ETF 主导净流量，gate < 0.5）。
       维度 2（DED-030 贡献）：边际卖家弹性。低弹性（ETF 未流出、回收金未激增，
       卖方以首饰/央行/金条金币长期持有者为主，供给紧）vs 高弹性（ETF 在流出、
       回收金激增，卖方弹性高，供给松）。

       格 [买低弹性, 卖低弹性] — 「招牌格」
       预测：单位增量需求的价格冲击最大。低弹性买家（央行/储蓄型）争夺低弹性存量
       （首饰/其他央行持有/金条金币长期仓位）→ 双向低弹性夹击 → 等量买入驱逐价格
       至最高。资格条件（r1 RF-4 后）= gate > 0.7 且 flow_coverage > 1（否则矿产
       等永在场流量吸收买盘、存量争夺不触发，降为合力格待遇）。
       父归属（r1 旗 14 修正后的诚实版）：本格的静态弹性标签（央行低弹性/ETF 高
       弹性/金条金币居中）【全部可由 DED-030 步骤 5 的持有者分层供给】——v1 声称
       "DED-030 不知道买家弹性"不成立（其步骤 5 对各持有者类别的弹性描述覆盖买卖
       两侧）。DED-029 对本格的贡献收缩为：低弹性买家【此刻为何、何时】入场的动机
       与时序（C3/C2 激活），以及 falsifiability (c) 的独立引擎核查轴（gate 高但
       引擎无信号 → rejected 条件，承重于证伪而非填格）。静态填格意义上本格
       不再声称需两父合力——此让步是 RF-2 降格 conjunction 的直接后果。
       现实对应（r1 RF-1/RF-4 修正后）：v1 以 2022–2024 央行购金潮为本格现实实例并
       声称单位流量冲击数倍于 2013——该算术用了未注册的混合口径，按注册口径
       （|ΔlogP| 年化 / 注册分母）重算后对比【方向反转】，且该窗口 flow_coverage
       粗算 ≈ 0.9–0.95、连招牌格资格都未清晰满足。该窗口已按第 11 条判例移入
       counterexamples 作反例候选。当前本格【无已确认的现实实例】——招牌格预测
       是纯前瞻的待检验命题。

       格 [买低弹性, 卖高弹性] — 「合力格」
       预测：单位增量需求的价格冲击高于基准但仍弱于招牌格。低弹性买家在买，但
       高弹性卖家（ETF 在抛、回收金涌入）提供缓冲 → 价格移动部分被吸收。
       父归属（r1 旗 14 修正）：静态弹性标签同样可由 DED-030 分层 + 标准双边弹性
       逻辑填满；DED-029 的贡献限于动机/时序腿。不再声称静态填格需两父合力。

       格 [买高弹性, 卖低弹性] — 「合力格」
       预测：单位增量需求的价格冲击弱于招牌格。高弹性买家（ETF 追涨）遇低弹性卖家
       （供给紧）→ 买家追涨但价格稍动买盘即退缩 → 冲击受限。
       父归属（r1 旗 14 修正）：同上——静态标签由 DED-030 分层供给。

       格 [买高弹性, 卖高弹性] — 「平凡格」
       预测：单位增量需求的价格冲击最小/放大器近休眠。双边高弹性 → 标准供需逻辑
       主导，即便 S/F 结构在场，高弹性双边参与者使价格调整更"讲道理"。
       DED-030 单独已给出：当边际卖家是高弹性层（ETF/回收金），价格冲击被吸收——
       买家弹性高是标准金融市场的默认假设（无需 DED-029 特别主张），故此格为平凡格。

       合力格统计（r1 旗 14 修正后的诚实版）：静态填格意义上需 ≥2 父合力的格子数
       趋零——四格弹性标签全部可由 DED-030 步骤 5 供给。本条的两父合力不在静态
       格子里，而在纵向命题上：先行性预测 (iii)（gate 领先于价格响应）需要
       DED-029 的引擎-时序内容（机构配置与零售储蓄惯性的来源）+ DED-030 的放大
       结构，缺一不可。此"时序格"是否可计入 METHODOLOGY 合取级条件 (c) 的
       multi_parent_cells，由 round_2 裁决；不可计入则本条无 L4 资格。

# === 涌现论证 ===

emergence_demonstration:
  emergence_type: conjunction  # 薄涌现——r1 RF-2 由 interaction 降格；弹性标签全在 DED-030 分层内，DED-029 经自制承重桥供动机/时序腿
  emergence_type_note: |
    【r1 RF-2 降格声明】v1 声称 interaction（厚涌现）。r1 审查在构造层面判定不成立：
    gate 的弹性标签完整来自 DED-030 步骤 5 的持有者分层，DED-029 的测量内容不进入
    格子判定，"引擎→买家弹性"映射是本条【自制承重桥】（primary_suspect 自认非
    DED-029 原文）。本条按审查消解路径 (b) 诚实降格为 conjunction：两条父推论各自
    独立供压（DED-029 = 低弹性买家入场的动机与时序；DED-030 = 放大器结构与持有者
    分层），矢量合成命题（放大倍数随需求构成变化 + gate 先行性）不在任一父字面内。
    状态天花板相应改为 verified（薄涌现，按 emergence_to_status_mapping）。
    合取级资格本身的遗留风险见 multi_parent_cells 末段与 derivation 步骤 3(c)。

  necessity: |
    逐一移除每条父推论（r1 旗 12 修正后的诚实版）：
    去掉 DED-029 → 静态部分损失有限（v1 声称"gate 分子选择丧失理论基础"被 r1
    推翻——DED-030 步骤 5 自己就给出央行极低弹性/金条金币居中且逆周期/ETF 中高
    弹性，gate 的身份类别及弹性排序可完整取自 DED-030）。真实损失在纵向部分：
    (a) 先行性预测 (iii) 塌掉——"gate 领先于价格响应"的论证依赖 DED-029 的引擎
    机制（C3/C2 驱动的机构配置与零售储蓄行为的惯性来源）；(b) falsifiability (c)
    的独立引擎核查轴消失——gate 高读数将无法与"非信用相关的流量噪声"区分，
    核心机制解释（需求构成反映引擎驱动的买家类型）失去独立检验通道。
    去掉 DED-030 → 失去供给端的放大器结构与持有者弹性分层。gate 仍可计算，但
    "gate 高为何冲击大"失去全部结构论证，"双向低弹性夹击"沦为修辞——本条的
    增量（放大倍数的条件性）完全消失。
    结论：DED-030 承重于全部静态结构；DED-029 承重于动机解释、先行性与独立核查
    ——属辅证偏承重之间的灰区，此定位已诚实披露（不再声称"无观众砖"的强版本，
    由 round_2 裁决 DED-029 的承重份额是否够格作父）。

  novelty: |
    以下命题不在任何单条父推论中，也不是父推论结论的 AND/OR 拼接（r1 旗 13 认可
    非拼接，但其 concern 一并诚实记录：机制内核接近教科书双边弹性逻辑 + DED-030
    分层的应用，非平凡性几乎全部压在 gate 的可测构造与单调性检验的成色上）：
    (a) "DED-030 的 S/F 放大器不是常开的——其激活强度是需求端构成的函数。"
    DED-030 将放大器描述为结构性在场特征，不说门控条件；DED-029 不涉价格弹性。
    (b) "gate = low_inflow/(low_inflow+high_outflow) 越高 → 单位增量需求的价格冲击
    幅度（|ΔlogP|/|流量|，注册口径）越大——该关系是单调的。" 这是本条的独有
    可检验命题，不在任何父推论中。当前证据状态：未经统计检验，且唯一做过的
    两窗口对比在注册口径下方向反转（见 counterexamples）——此命题目前是
    证据状态不利的待检验假说。
    (c) "'双向低弹性夹击'+流量覆盖（gate > 0.7 且 flow_coverage > 1）产生最大的
    价格放大"——条件格命题，弹性标签取自 DED-030 分层，条件组合与可测构造为本条新增。
    (d) "gate 本身可作为金价放大器的先行指标——需求构成的变化领先于放大效应的
    完全显现。" 此为新时序命题，其机制论证需要 DED-029 的引擎-惯性内容，
    不在任一条父推论中。

  multi_parent_cells: |
    2×2 判据表（买者弹性{低,高} × 卖者弹性{低,高}）——r1 旗 14 修正后的诚实版：
    静态填格意义上，四格的弹性标签全部可由 DED-030 步骤 5 的持有者分层供给，
    需 ≥2 父合力的静态格子数趋零（v1 的"3 个合力格"声称撤回）。
    本条主张的两父合力移至纵向命题：先行性预测 (iii)（gate 序列领先弹性序列）
    需要 DED-029（引擎驱动的机构/零售配置惯性——领先性的机制来源）+ DED-030
    （放大器结构——被领先的响应对象）合力，任一父单独均无法给出该时序命题。
    诚实遗留：该"时序格"是否满足 METHODOLOGY 合取级条件 (c)（multi_parent_cells
    至少一格需 ≥2 父合力）的原意（原意面向笛卡尔积静态格），作者不自行裁定，
    留待 round_2。若裁定不满足，本条不具 L4 资格，应 rejected 或改写为 DED-030
    的扩展性 L3 命题。

# === 可证伪性 ===

falsifiability: |
  本推论在以下条件之一满足时被证伪或降格：

  (a) 【一锤定音裁决点——gate-弹性单调性被推翻】
  在可独立识别 gate 的季度/年度窗口（WGC 实物流量数据）中，按 gate 四分位分组，
  各组的平均 price_impact_elasticity【幅度】（|ΔlogP| / |净需求变动量|，注册口径
  见 operationalization——r1 RF-1 后统一为绝对值+年化+注册分母）未呈现 gate 越高 →
  弹性幅度越大的单调序关系。具体裁决：将全部可用窗口按 gate 从低到高分为四组（Q1–Q4），
  检验 Q4（gate 最高组）的平均弹性幅度是否【统计显著高于】Q1（gate 最低组）。
  若 Q4 ≤ Q1（方向错）或差异不显著（无法区分），→ 核心机制（放大器由
  需求构成门控）被推翻，本条 rejected。
  带符号弹性另做独立方向核查（高 gate 组带符号弹性应为正），但不进入幅度比较——
  防符号结构机械满足（r1 旗 3(ii)）。
  若方向对（Q4 > Q1）但中间组（Q2/Q3）不单调 → 核心方向存活但"单调"声称降格，
  本条降格为 verified* 并标注"单调性未确立、仅极端组差异成立"。
  统计方法预注册：两组间单侧 Welch t 检验（不等方差），显著性水平 α = 0.05。
  样本要求预注册：每组合计 ≥ 8 个季度观测（若历史样本不足，顺延至未来数据累积到
  门槛后执行，本条在当前保持 candidate 状态并诚实标注"检验力不足"）。
  此项检验不需要离散分类（gate 是连续量、四分组只是秩检验的统计工具），不面临
  L4-009 的"阈值两侧案例归错格"风险——四分位边界由全样本分布事后确定不影响
  检验效度（秩相关/单调性的方向性不依赖分组边界的具体位置）。

  (b) 【单调性弱化降格——r1 RF-2 后基线已是 conjunction】
  本条涌现级别经 r1 已降格为 conjunction（薄涌现），不存在再向 conjunction 降格
  的余地。若裁决 (a) 中 Q4 > Q1 成立但单调性不成立（中间组乱序），→ 核心命题
  从"连续单调门控"弱化为"极端组差异"：仅保留"极端低弹性买家主导时放大器显著
  强于极端高弹性买家主导时"，claim 相应改写并标注"单调性未确立"。
  若连极端组差异也不成立，走 (a) 的 rejected。

  (c) 【买家弹性分类被推翻——gate 构成与独立引擎信号不一致】
  若 gate 持续高位（> 0.7）的窗口，经独立引擎信号核查（buyer_elasticity_profile
  操作化），C3 和 C2 引擎均未发出激活信号（法币信用未降 + 通胀预期未升），→ gate
  的高读数反映的不是低弹性买家入场，而是其他原因（如金条金币的季节性需求波动、
  央行购金的非信用相关因素如储备多元化再平衡）。在此情况下，gate 与低弹性买家入场
  的理论联系断裂 → gate 退化为纯统计量（无机制解释的实物流量比率），本条的核心
  机制（需求构成门控放大器）被釜底抽薪 → rejected。
  防循环条款：引擎信号的判定必须由 DED-029 的独立测量轴执行（TIPS/通胀预期/CDS/
  VIX），不得由 gate 或金价反推。

  (d) 【双向低弹性夹击的独有预测被推翻——招牌格填上反例】
  若出现 gate > 0.7 + flow_coverage > 1（r1 RF-4 新增的存量争夺条件）+ ETF 未净流出
  （< 50 吨/季）+ 回收金未激增（低于历史中位数）的窗口，而 price_impact_elasticity
  幅度与其他 gate 水平的窗口无显著差异 →
  招牌格的核心预测（"双向低弹性夹击产生最大价格冲击"）被推翻。此裁决比 (a) 更严——
  (a) 只要求 Q4 > Q1，而 (d) 要求招牌格（低买低卖）的弹性显著高于合力格
  （低买高卖或高买低卖）——此为更强的序关系声称。
  裁决方法：三组（招牌格窗口 / 合力格窗口 / 平凡格窗口）的单因素 ANOVA +
  事后两两比较（Tukey HSD），招牌格 vs 非招牌格的 planned contrast。
  样本不足时不强推——诚实标注"当前样本不足以检验三组差异，暂不裁决"。

  (e) 【gate 先行性被推翻】
  gate 的变化（t 季）与 price_impact_elasticity 的变化（t+1 或 t+2 季）之间无
  统计显著的正向 Granger 因果关系（控制了金价自身滞后项后）→ 预测 (iii) 被推翻。
  此项为 should 级——先行性失败不影响核心机制（同期 gate-弹性关系仍可成立），
  但削弱 gate 作为操作化先行指标的实用价值。

  适用区间：1971 年布雷顿森林解体后至今（金价市场化定价期）。金本位/复本位时代
  出射程（金价被制度固定、无放大器可言）。WGC 季度数据自 2010 年起覆盖较全，
  2010 年前仅年度数据——2010 年前的检验降级为年度频率、统计功效更弱。

falsification_trace:
  primary_suspect: |
    【r1 should-4 排位修正】受检顺序更新：(0) 弹性口径与 gate 流量覆盖的操作化
    成色（r1 RF-1/RF-4 已注册修复，但其修复质量先于一切机制问题受检——口径不定
    则下述映射对错无法被检验）；然后才是——
    DED-029 四引擎到买家弹性的映射——本条声称 C3→央行（极低弹性）、C2→金条金币
    （中等偏低弹性）、C1→ETF（高弹性）、C4→混合。该映射不是 DED-029 原文的内容——
    DED-029 只给出方向预测（C_i↑→金价↑/↓），不说"各引擎驱动不同类型的买家"，
    更不说"不同类型买家的价格弹性有系统性差异"。

    两重风险：
    (i) 映射本身是错的——例如 C2 驱动的金条金币需求在金价上涨时的弹性可能与 ETF
    相当（投资者在金价涨时追买金条金币，行为类似 ETF 追涨）→"低弹性买家"的
    分类在金条金币层不成立。此时 gate 的分子（央行+金条金币）高估了低弹性买家的
    真实比重 → gate 与弹性的单调关系被削弱或反向。
    (ii) 映射中有遗漏的低弹性/高弹性买家类型——例如主权财富基金（非央行）的大宗
    购金可能在 WGC 统计中被归类为他项、未进入 gate 的分子 → gate 系统性地低估了
    低弹性买家在场的情况，导致 gate 低但弹性高的"反例"出现（实为 gate 读数错误）。

    缓解：(i) 可由 buyer_elasticity_profile 操作化做一致性核查——若 gate 高位窗口
    的 C3/C2 引擎信号也高位，映射是一致的（虽不能证明因果但可排除明显误分类）；
    (ii) WGC 的央行购金统计近年已较完整覆盖（含未公开披露的估计），主权基金购金
    漏网的风险在 2022 年后已降低（因购金规模大到无法隐匿），2010 年前的风险更高。
    最先受检。

  secondary_suspect: |
    gate 分子的"金条金币"项含"投资"与"收藏/送礼"动机的不可分性。WGC 不区分金条
    金币的购买动机——对婚礼/节庆/礼品的金饰/金条需求（文化弹性极低、与价格近乎无关）
    和对金价上涨的纯投资需求（弹性类似 ETF）被归入同一统计项。
    在印度/中国等文化驱动市场，金条金币项的弹性可能系统性低于纯投资驱动市场——
    这意味着 gate 的绝对值在不同市场结构下不可直接比较。缓解：gate 的核心检验
    （gate-弹性单调性）是组内比较（同一市场结构下的 gate 高 vs gate 低），
    而非跨市场绝对水平比较——此问题在单调性检验中不致命但会增加噪声。

  unlikely_suspect: |
    DED-030 的 S/F ≈ 50–70 事实（WGC/USGS 双源，地质+统计事实）与 THEOREM-value-attribution
    的 V=(U+E)×S 结构——极少是错误根源。WGC 季度流量数据的整体质量（全球黄金市场
    最权威的一手统计源，方法论公开可查）——即使个别国家有估计误差，总量的方向性
    可信。DED-029 四引擎的测度正交性（已通过其自身的独立审查 ADV-REVIEW-035）。

excluded_outcomes:
  - "金价的具体点位或 gate 的具体数值预测——本条只预测 gate 与价格冲击弹性的单调方向关系，不预测 gate 何时达到何值、金价到多少。"
  - "金价日内/周度高频波动——继承 DED-029 的排除，E_network 伸缩以月–年为尺度。"
  - "供给侧冲击（矿脉发现/罢工/技术突破）导致的金价变动——走 S 通道，继承 DED-029/030 的排除。"
  - "低弹性层净卖出的情形——当央行或金条金币持有者成为净卖家（low_inflow ≤ 0，gate = 0），本条的核心预测（gate 越高→弹性越大）不覆盖——低弹性层净卖出代表另一类市场状态（价值储藏功能弱化/去金融化），其价格动力学需独立分析。该排除是事前的射程声明，非事后开脱。"
  - "回收金与 ETF 的弹性边界模糊窗口——如印度农户在极端经济压力下被迫卖金饰求生，此时回收金的弹性可能向低弹性偏移。此类窗口需独立标注、排除出标准 gate 分析或做敏感性检验（剔除该窗口后重跑）。"
  - "【r1 RF-3 事前注册·调节变量 1/2】跨资产流动性危机窗口——gate 的操作化假设实物流量反映持有者偏好而非被迫变现；系统性流动性挤兑（dash-for-cash）使一切资产被抛售换取美元流动性，gate-弹性关系在该窗口出射程。独立可编码触发判据（缺一不豁免）：(i) TED 利差或 FRA-OIS 利差 > 其 10 年滚动均值 + 2σ，且 (ii) 同季 VIX 季均值 > 40。判据由货币市场数据独立判定，不得由金价或 gate 反推。诚实记账：2008H2 在本条款注册【之前】曾被 v1 引用不存在的排除条款消化——注册前该窗口按活反例记账（见 counterexamples），注册自本版起才对未来窗口生效为事前豁免。"
  - "【r1 RF-3 事前注册·调节变量 2/2】物理结算/精炼瓶颈窗口——gate 假设供给弹性完全由持有者行为决定；当精炼/物流/制度性中断独立于持有者行为压低可交割供给（如 2020 年瑞士三大精炼厂停工），实际放大器表达偏离 gate 读数。独立可编码触发判据：可注日期的精炼厂停工/物流中断公开事件（产能受影响 ≥ 全球精炼产能 10%，持续 ≥ 2 周），或 EFP（期现价差）超历史 99 分位。判据由供应链事件与期现基差独立判定。"
  - "【调节变量预算声明（r1 RF-3）】本条的 L4 调节变量预算为 2，上两条注册后已用满 2/2——今后任何新的射程豁免不得再注册，出现豁免外的反例一律按活反例记账，不得以任何未注册调节变量消化。"

anti_talisman_clause: |
  【防不可证伪护身符】
  (1) gate 的计算完全由 WGC 实物流量数据（央行购金、金条金币、ETF 流量、回收金）
  独立确定——永远不得由金价行为反推或事后调整。不可因"这季度金价涨得猛"就修改
  gate 的分子口径。分子/分母口径已在 operationalization 中一次性定死，事后口径
  选择一律按不利于推论方向裁决（适用 L4-009 判例——rubric 第 18 条）。

  (2) price_impact_elasticity 的计算中，净需求变动量（分母）必须取同期 WGC 的
  实物流量数据——不得用金价变动反推"需求肯定变了多少"。金价变动是分子，需求变动
  是分母，二者来源正交（LBMA 定盘价 vs WGC 统计），不存在"用金价算需求"的循环。

  (3) 引擎信号的一致性核查（falsifiability c）中，C3/C2 引擎的活跃状态必须由
  DED-029 的独立测量轴（TIPS/盈亏平衡通胀率/CDS/VIX）判定——不得因"gate 高"就
  声称"引擎信号肯定也高"。

  (4) gate 高但弹性低（即 gate-弹性单调性被反例填上）时，不得以"那个窗口肯定有别
  的因素在干扰"来消化——除非能独立指出具体的干扰因素（如可编码的供给冲击事件、
  可独立测量的市场微观结构异常），并以该干扰因素在 gate 高/低组之间的分布不均衡
  来论证其为混淆变量。模糊声称"市场情绪不同"不构成有效消化。

  (5) gate 构成的口径（分子=央行+金条金币，分母=分子+ETF净流出绝对值+回收金）已
  一次性注册——后续不得因反例出现而调整口径（如"金条金币弹性其实没那么低，我们
  把它从分子挪到分母"）。若未来的独立审查判定当前口径有瑕疵，可启动一次口径修订
  但须：(a) 修订方向必须在经验检验之前（而非之后）可辩护；(b) 消耗本条的唯一一次
  重校准信用；(c) 修订后全史数据重跑、所有历史裁决窗口重新评估；(d) 修订被记录为
  retrofit 并公开披露。

# === 现实锚点 ===

real_world_anchors:
  rule_g_note: |
    【r1 RF-1 整改后的诚实状态声明】v1 的两大支持锚点（2022–24 央行购金潮 / 2013
    缩减恐慌）的"单位流量价格冲击对比"使用了未注册的混合口径（多年累计价格 ÷ 单年
    流量 vs 年对年；流量分母也偏离注册口径）。按 r1 注册口径（|ΔlogP| 年化 / 注册
    分母）统一重算后对比【方向反转】，两锚点按第 11 条判例（事后口径歧义反向裁决）
    移入 counterexamples 作反例候选。当前本条【没有幸存的复合特有支持锚点】，
    Rule G 暂不满足——核心单调性命题为"证据状态暂时不利的待检验假说"，其存亡
    压在 falsifiability (a) 的全样本四分位检验（样本门槛见该条）。作者不以任何
    事后口径调整挽救锚点；若全样本检验坐实反转，本条 rejected。

  supporting:
    - anchor: "2020 年 COVID——混合 gate 窗口，gate-弹性关系的压力测试（非单调性支持锚点）"
      evidence: |
        需求构成复杂：上半年 ETF 净流入创纪录（高弹性买家涌入）+ 下半年金条金币需求
        激增（中等偏低弹性买家）+ 央行全年净购金放缓（约 250 吨，为 2010 年代以来
        最低）。供给特殊：COVID 导致全球贵金属精炼厂停工/物流中断（瑞士三大精炼厂
        停工数周），实物金条的可交割性受限 → 短期供给弹性被人为压低（非持有者行为
        而是物理瓶颈）。
        gate 按公式计算（约 0.4–0.6 视季度）属中等，但供给侧的物理中断使实际放大
        器表达强于 gate 读数预示。金价全年 +25%（从 ~1520 升至 ~1900，年中触及 2070）。
        此窗口不是 gate-弹性单调性的干净检验（供给侧的物理中断是混淆变量），仅提供
        gate 操作化的射程边界识别：gate 假设供给弹性完全由持有者行为决定，当物理/
        物流/制度瓶颈独立于持有者行为影响供给弹性时，gate 的预测力下降。
        【r1 RF-3 更正】v1 曾声称"此边界已被事前识别（见 boundary_cases）"——审查
        核对为不实（boundary_cases 无此条），属对未注册排除的事后引用。该瓶颈豁免
        现已作为调节变量 2/2 注册进 excluded_outcomes（含可编码触发判据）；对 2020
        窗口而言注册仍属【事后】，故本锚点只作射程边界识别用，不计入任何支持。
      confidence: "weak（混杂窗口，不支持核心命题；价值仅在射程边界识别，且其豁免注册对本窗口为事后）"

  counterexamples:
