      analysis: |
        v1 曾以"2022–2024 约 +0.05%/吨净增 vs 2013 约 −0.03%/吨净减"作旗舰支持。
        r1 复算揭示口径不一致：0.05%/吨由【三年累计】价格变动（约 +50%）除以【单年】
        流量（约 1000 吨）得出，2013 却用年对年；流量口径（"央行−ETF"）也偏离注册
        分母。按 r1 注册口径（|ΔlogP| 年化 / 注册分母=央行+金条金币+ETF+其他制造）
        统一重算：
        - 2013（低 gate、ETF 抛售主导）：|ΔlogP| ≈ 28–33%，流量分母 ≈ 625+1700−900
          ≈ 1400 吨（或用 v1 自用流量口径 900 吨）→ 幅度 ≈ 0.024–0.031%/吨。
        - 2022–24（高 gate、央行购金主导）：|ΔlogP| ≈ 12–17%/年，流量分母 ≈
          1050+1250−100 ≈ 2200 吨/年（或 v1 自用口径 1000–1100 吨）→ 幅度 ≈
          0.006–0.017%/吨。
        低 gate 窗口的单位流量冲击幅度反而是高 gate 窗口的约 2–4 倍——与核心预测
        （gate 越高幅度越大）【方向相反】。按第 11 条判例（事后口径歧义一律反向
        裁决），本对比记为反例候选、原两锚点不得计为支持。
        尚非净杀的理由（诚实记录，非开脱）：(i) 全样本四分位检验（falsifiability a）
        未执行，两窗口对比不构成统计裁决；(ii) 2013 的流量分母被金条金币逆周期买入
        （1700 吨）内生推高，且变量共享偏误（见 price_impact_elasticity 披露）在
        逆周期窗口会放大反例表观强度——存在一条消化路径，但该路径要求修改注册
        分母口径，按 anti_talisman (5) 须消耗本条唯一一次重校准信用且修订方向须在
        经验检验之前可辩护——在已见到反转结果的当下启动即属事后挑口径（第 11 条
        反向裁决红线），故本版【不启动】，反例候选原样挂账，交 falsifiability (a)
        的全样本检验裁决。
      status: "counterexample_candidate——直接压在核心可测命题上；全样本检验坐实则本条 rejected"

    - case: "2011 年金价创历史新高（~1900 美元）但 gate 的信号方向与弹性关系模糊"
      analysis: |
        2011 年央行净购金约 457 吨（创当时 20 年新高，但低于 2022–2024 的 1000+ 吨
        量级）、ETF 净流入约 185 吨、金条金币约 1500 吨。回收金约 1600–1660 吨
        （金价历史高位驱动回收激增；v1 误用 ~1300 吨，r1 should-1 已更正）。
        按公式 gate ≈ (457+1500)/(457+1500+0+1650) ≈ 0.54（v1 误算 ≈0.60；更正后
        更接近均衡区、gate 读数的"不低"程度减弱，但方向性分析不变）。金价的后续
        走势（2011 年 9 月
        见顶 1900 后至 2013 年跌至 1200，−37%）使 gate 作为"放大器持续激活"指标
        的可靠性受质疑：gate 在 2011 年高位但金价随后暴跌——这不违反 gate-弹性
        单调性预测（2011 年 gate 高 + 金价涨，方向对），但揭示 gate 作为先行指标
        （预测 iii）可能不稳定——2011 年的高 gate 主要来自金条金币（逆周期抄底）
        而非央行（战略性锁仓）→ 金条金币驱动的 gate 高位可能比央行驱动的 gate 高位
        更不可持续（金条金币买家在金价转跌时可能转为观望，而央行买家不因金价转跌
        而抛售）。这指向 primary_suspect 的核心关切——gate 分子内不同成分（央行 vs
        金条金币）的弹性差异可能使 gate 的"低弹性"解释力度因构成而异。
        当前判定：不构成净证伪（gate-弹性单调性的方向预测未被 2011 年推翻——2011 年
        gate 高 + 金价涨，方向对），但暴露了 gate 作为复合指标的内部异质性风险。
      status: "boundary_counterexample——不推翻核心机制，但揭示 gate 内构成异质性的
      承重风险，归 primary_suspect 的持续检验窗口"

    - case: "2008 年下半年——gate 高位但价格先暴跌后暴涨，gate-弹性关系被极端波动淹没"
      analysis: |
        2008 年 9–12 月：雷曼破产后金价从 ~900 暴跌至 ~680（−24%）再反弹至 ~870。
        同期央行从净卖转净买、金条金币需求激增（gate 分子高位）、ETF 未大幅流出
        （gate 分母低位）→ gate 应处于高位。但金价的暴跌段（9–10 月）与 gate 高位
        矛盾——极高波动的金融危机窗口内，gate 与价格冲击弹性的短期关系被"一切资产
        被抛售以换取美元流动性"的 dash-for-cash 效应覆盖。2008 年的暴跌不是黄金市场
        内部的需求构成驱动的——它是跨资产的流动性挤兑溢出到金市。
        【r1 RF-3 更正】v1 曾引用 excluded_outcomes 中"市场微观结构/流动性危机驱动"
        条款消化本案——该条款当时【不存在】，属对未注册排除的事后引用（DED-005 型
        缺陷）。诚实记账：在流动性危机豁免注册（调节变量 1/2，本版 excluded_outcomes）
        之前，2008H2 是 scope 内的活反例。注册后按其可编码判据回溯核对：2008Q4
        TED 利差峰值 >4%（远超 10 年均值+2σ）、VIX 季均 >50——判据满足，该窗口
        转为射程豁免；但因注册对本案属事后，本案在 round_2 复核前保留
        "活反例（已注册豁免待复核）"的双重标注，不单方面销账。
      status: "live_counterexample_pending——注册前为活反例；豁免判据回溯满足，待 round_2 复核后方可转 boundary_case"

  boundary_cases:
    - case: "gate ≈ 0.5 附近的窗口——gate-弹性关系的区分力最弱区"
      analysis: |
        当 gate 接近 0.5（低弹性买入与高弹性卖出力量大致均衡），本条的预测力最弱——
        gate-弹性单调性假说在此区间的斜率预期最平、噪声最大。此区间的大部分季度
        gate-弹性关系可能不显著——这不是对核心预测的推翻（核心预测是极端组差异），
        但限制了 gate 作为连续预测变量的操作价值：它在极端组（Q1 vs Q4）的区分力
        可能强于在中段（Q2 vs Q3）的区分力。这与 L4-009 的"灰区"问题不同——
        本条不将 gate 二分（不设阈值），故无"灰区误分类"风险；但单调关系的统计
        检验在 gate 中段功效低是诚实的射程局限。
      status: "boundary_case——非推翻性边界，统计功效局限的诚实声明"

    - case: "2010 年前 WGC 仅年度数据——gate 季度级检验的历史局限"
      analysis: |
        gate 的操作化以季度为自然频率，但 WGC 的央行购金/ETF 流量/金条金币的
        细分季度数据仅自 2010 年起系统可得。2010 年前的窗口只能用年度 gate，牺牲
        gate 的时序精度（年度 gate 平滑了季度级的需求构成变动，可能低估 gate 的
        极端值）。1971–2009 的 gate-弹性检验降级为年度频率——统计功效（样本量）
        与 gate 精度均低于 2010 后的季度级检验。
      status: "boundary_case——数据可用性边界，影响历史检验力但不影响推论的逻辑结构"

    - case: "金条金币需求的逆周期特性对 gate 分子的弹性异质性污染"
      analysis: |
        gate 分子将"央行购金"与"金条金币需求"加总——隐含假设二者同属"低弹性"。
        但金条金币在涨价时"少买"的弹性（顺周期收缩）和跌价时"多买"的弹性
        （逆周期扩张）使它的"低弹性"特性是【非对称的】——涨价时弹性类似 ETF
        （顺周期退缩）、跌价时弹性类似央行（逆周期买入）。这意味着 gate 分子
        中金条金币的权重在牛市和熊市中对 gate-弹性关系有【方向相反】的贡献，
        可能削弱单调性。这是 primary_suspect 的进一步操作化——在 future 检验中，
        可考虑将 gate 拆分为 gate_CB（仅央行分子）和 gate_full（含金条金币），
        比较二者的预测力差异。当前版本不做此拆分（保持操作化简单），但诚实标注
        此异质性风险。
      status: "boundary_case——操作化简化与机制精度的权衡，归 primary_suspect 持续受检"

discriminant_validity: |
  【与 DED-030 自身判别——防止 L4 只是父推论脚注】
  DED-030 的持有者弹性分层给出"谁在卖 → 价格冲击多大"的静态结构。本条的增量在：
  (a) 把"谁在买"加入等式的另一边——买方弹性与卖方弹性共同决定价格冲击的强度。
  DED-030 的持有者分类（首饰/央行/金条金币/ETF）覆盖了买卖双方，但它用的是同一套
  弹性排序（首饰≈央行 < 金条金币 < ETF）且假设"持有者不管买卖都同弹性"——
  本条指出：同一主体（如金条金币买家）在买入和卖出时的弹性可以不同（逆周期买入
  是低弹性、顺周期卖出可能是中弹性），买方弹性不完全由持有者身份决定——
  它由买入动机决定（本条经"引擎→买家弹性"自制承重桥把动机接到 DED-029 的
  四引擎上——r1 RF-2 后诚实标注：此"动机决定买方弹性"主张是本条自己的经验
  赌注，不是 DED-029 原文，也不进入 gate 的测量）。

  (b) gate_ratio 作为连续复合变量不在 DED-030 中。DED-030 不构造"低弹性买/高弹性卖"
  的比率——这个比率是需求构成（DED-029）与供给结构（DED-030）的交互产物，
  单父各自无法构造。

  【与"金价由供求决定"的标准经济学判别】
  标准供求分析预期：需求曲线外移 → 价格上升的幅度取决于供给弹性。本条与此兼容
  但不平庸——本条的特有增量在：(i) 供给弹性本身是内生的（取决于边际卖家的身份，
  而边际卖家的身份取决于谁在买——买方身份改变了卖方的构成）；(ii) 需求曲线的
  弹性也是内生的（取决于需求由哪个引擎驱动——不同引擎激活不同弹性的买家）；
  (iii) 两重内生性合成出一个 gate 变量来近似度量。标准供求不提供 gate 的构造方法，
  更不给出 gate-弹性单调性的可检验预测。

  【与 L4-009 的判别——本条是 L4-009 中唯一幸存交互的独立化】
  L4-009 预测的"体制切换"是离散相变（商品体制 ↔ 货币体制），需要 4 个独立指标
  的复合判据来确认"当前在哪个体制"，且需要预注册 4 个指标的各自阈值/口径/分布窗口
  /足龄规则——复杂度导致其被 rejected（5 轮审查未收敛，操作化在利比亚窄口径上
  被第 18 条击穿）。

  本条剥离了 L4-009 的全部离散分类包袱：
  - 不用 4 指标复合判据（→ 只用 1 个连续 gate 比率）
  - 不用阈值（→ gate 是连续量，检验用四分位秩比较，不设"开/关"边界）
  - 不用分布窗口 / 足龄规则（→ WGC 季度数据，有则有、无则标注）
  - 不用体制退出规则（→ 无"两体制"，只有连续的门控强度）
  - 变量共享（r1 should-2 修正 v1 的过度声称）：gate 分子分母内部正交成立，但
    gate 的构成变量与 price_impact_elasticity 的流量分母共用 WGC 系列——此焊点
    已在 operationalization 显式披露并给出方向性分析（机械偏误方向不利于本条
    预测），不再声称"不面临变量共享困境"。

  L4-009 的核心洞察——"DED-030 放大器不是常开的"——被本条保留并重新操作化。
  如果本条通过独立审查，它可以作为 L4-009 的最硬交互贡献的"存活形态"独立存在。
  这是 L4-009 五轮攻防的方法论红利——不是废掉一条 rejected 推论的全部工作，
  而是将其在对抗中验证过的组件重新打包为更简洁的独立推论。

  【防平凡化守卫】
  非平凡内核：(a) gate 作为交互变量的构造——不是 DED-029 或 DED-030 任一条
  能单独构造的变量；(b) gate-弹性单调性作为可检验的经验命题——不是"供求出价格"
  的复述；(c) "双向低弹性夹击"作为价格冲击最大化的条件格——不是 AND 拼接，
  而是两条父机制的交互产物。

review_summary: |
  r1 needs_revision（5 required + 4 should）：弹性口径三自由度未注册且旗舰锚点口径混用（RF-1）、DED-029 操作层观众砖（RF-2）、未注册排除被事后引用（RF-3）、gate 漏矿产/OTC（RF-4）、claim_type 错配（RF-5）。全档见 ADV-REVIEW-L4-010 round_1。
  r1 整改: RF-1 注册绝对值/年化/注册分母口径并按注册口径重算——2013 vs 2022–24 旗舰对比方向反转坐实，两支持锚点按第 11 条移入 counterexamples 作反例候选，Rule G 当前不满足（无幸存复合特有支持锚点）、核心命题降为证据状态不利的待检验假说，未做任何口径挽救；RF-2 走路径(b)诚实降格 conjunction（薄涌现，天花板 verified），"引擎→买家弹性"披露为自制承重桥，静态合力格声称撤回、合取级资格移到先行性时序腿并留 round_2 裁决其是否够格（不够格则应 rejected）；RF-3 流动性危机+物理瓶颈两豁免带可编码判据注册，预算 2/2 用满，2008H2 注册前按活反例记账；RF-4 矿产/OTC 省略事前辩护注册 + 新增 flow_coverage>1 存量争夺条件（诚实代价：2022–24 粗算 coverage≈0.9–0.95，连招牌格资格都未清晰满足）；RF-5 claim_type 改 trajectory_prediction；should-1/2/3/4 一并修（2011 回收金 1600→gate≈0.54、变量共享披露+方向性分析、verified* 表述改按涌现类型、suspect 排位）。作者回应详见 ADV-REVIEW-L4-010 author_response_round_1，见 round_1。
  r2 rejected（存亡裁决，独立 r2 审查者）：5 条 required 整改核验全部诚实落地（含反转算术独立复算一致、2008H2 豁免判据回溯亲验满足）；但存亡问题裁决为不满足——时序腿（预测 iii）不计入 METHODOLOGY 涌现条件 (c)：原意面向静态笛卡尔积格，且宽读法下 DED-029 的贡献仍全部经"引擎→买家弹性"自制承重桥输入、注册检验 (e) 不含任何 DED-029 测量轴、该腿自标 should 级非承重。合力格数归零 = L3 chaining 非 L4；DED-029 观众砖不可消解（移除后结论完整存活于 DED-030+自制假说）；叠加 Rule G 不满足 → L4 资格要件空集，按作者事前承诺 rejected。死因是层级资格而非证据净杀（四分位检验未跑，反例候选未坐实）。r2 新猎获：flow_coverage 与 gate 在仅有两个已检窗口反相（2013≈1.12 vs 2022–24≈0.92）；signature 格（gate>0.7 且 coverage>1）资格区可能全史空置——(d) 或不可检验。可测内核（gate 构造+注册口径+检验 a）可另立 DED-030 的 L3 chaining 新推论重新立项（非本条复活），前置问题见审查档 salvage_path。全档见 ADV-REVIEW-L4-010 round_2。

