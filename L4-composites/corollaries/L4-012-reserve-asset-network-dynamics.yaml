id: L4-012
type: composite_deduction
layer: L4-composites
deduction_form: composite
status: candidate
term: "储备资产地位变迁的网络效应动力学 (Network-Effect Dynamics of Reserve Asset Status Transition)"
claim_type: trajectory_prediction

人话摘要: "储备货币的改朝换代不是各国各自算账的独立决策——它是网络效应驱动的体制切换。谁会赢由六维物理-制度适应性决定，谁先动手看储蓄端（法币信用下滑时储蓄先跑、支付后崩），为什么现在动手看四个触发引擎（利率、通胀、信用、不确定性）。当多个候选得分接近且老霸主信用快速崩塌时，赢家由先发优势决定，不一定是纸面上分最高的那个——这就是路径依赖锁死。"

statement: |
  【Composite claim】
  储备资产地位（某种资产在全球央行储备、主权财富配置、国际债务发行中充当主导
  价值储藏工具的程度）不是各国独立最优化决策的加总——它是在网络效应框架中被
  三条独立机制合力驱动的体制级动力学：
  (a) 方向——储备资产竞争遵循 E_network 正反馈收敛，胜出者在六维适应性格局
  中占据加权最优位置，赢家通吃锁定（DED-027）；
  (b) 时序——储备资产迁移遵循 SOV 先逃逸、MOE 后崩塌的结构性时序，储蓄端
  （央行储备配置、主权财富基金）对信用变化最敏感、最先重新配置，支付/结算端
  因制度惯性和网络效应滞后调整（DED-028 向主权/机构尺度的扩展）；
  (c) 触发——四个独立测度的 E_network 伸缩因素（实际利率、通胀预期、法币信用、
  不确定性）各自提供储备资产迁移的方向性推力，其组合决定了迁移的速度、幅度和
  受益候选者（DED-029 从金向任意储备候选的泛化）。
  三条机制的合成产生一个其各自无法单独给出的结论：储备资产体制切换不是独立
  候选者的线性加权竞赛，而是网络效应驱动的收敛过程——收敛的方向由六维适应性
  筛选决定，收敛的时序由 SOV-MOE 解耦的储蓄端先行决定，收敛的触发和速度由
  四因素配置决定。在多候选得分接近 + 老霸主信用快速崩塌的组合下，收敛的赢家
  由路径依赖（谁先拿到第一个大国买盘、谁在危机中最具流动性）决定，不一定是
  事前六维得分最高的那个。

  【Epistemic status——诚实声明】
  本推论的三条承重扩展均未在父推论原文中经过独立验证：
  (a) DED-027 自宣射程是"商品货币时代的自发交换网络（无中央银行/法定货币的
  制度强制）"；本推论将其六维物理筛选 + E_network 收敛框架外推到现代主权储备
  配置域，属未经父推论验证的射程扩展——预测 (i)(iv) 不享受 DED-027 verified
  状态的完全背书。
  (b) DED-028 的 SOV-MOE 解耦时序预测基于家庭/私人部门的资产配置行为；本推论
  将其扩展到主权/机构储备管理者层面——主权行为者面临地缘政治约束、制度 mandate
  和信号效应，其 SOV-MOE 分化可能与家庭部门存在机制差异。此扩展的逻辑一致性
  （SOV 无法律强制 → 储蓄端先动，此逻辑对主权和非主权持有者均适用）使扩展
  合理但未经独立检验。
  (c) DED-029 的四因素框架仅覆盖金；本推论将其泛化为"任意储备资产候选的
  E_network 伸缩均可由 C1-C4 独立驱动"——因 DED-029 的四因素皆走 E_network
  这一统一通道、并非金特有的机制，泛化有结构依据，但未经独立检验。
  (d) 交互级子预测 (iv)（急性信用崩塌 + 多候选得分接近 → 赢家由路径依赖决定
  而非事前最高分者）同时依赖上述三项扩展——是最弱、最远的承重环节。
  置信度天花板：三条父推论均为 verified（CAP=3）→ 本条状态天花板 verified*；
  但射程扩展使有效天花板低于状态字面——预测 (iv) 尤甚。
  检验执行前，"路径依赖赢家"应读作带预注册降格条款的机制假说。
  (e)【r1 加注——校准集=检验集的单样本风险】六维重标定、SOV-MOE 机构
  映射、迟滞条款均在英镑→美元这同一案例上校准，该案例又被用作
  supporting 锚——锚 1 对预测 (i)(ii)(v) 只提供一致性而非独立检验力。
  全球尺度的已完成切换样本 n=1：(iii)(iv) 的全球尺度检验力完全依赖
  未来观测；其统计证伪门（falsifiability c/d 的 ≥5/≥3）由 r1 注册的
  子全球代理事件池承担，代理检验对全球预测的传递力打折（见
  falsifiability c 的诚实标注）。
  (f)【r2 预记——verified* 星号语义消歧待 finalize 处理】r1 预标的
  定论上限 verified* 用的是 L3 传统"带未了悬案"义；而 METHODOLOGY 的
  emergence_to_status_mapping 中 verified* 专指"厚涌现验证"（要求
  emergence_type=interaction + ≥2 合力格 + 无外部桥承重）。两种语义
  指向不同结论：本条主体为合取级（薄涌现），按涌现分档字面只能落
  verified 档；(iv) 的交互级升档以 falsifiability (d) 检验存活为前提
  （emergence_type 字段已如此声明）。finalize 时必须按 METHODOLOGY
  裁定采用哪种星号语义，并显式列出悬案清单：六维重标定桥未经独立
  验证 / 储备域 rank-δ 协议未注册 / 事件池首编码未执行 / 2022 与
  1971 急性资格待 σ 实算。

  【Parent mechanisms——每条父推论给了什么】
  DED-027 给"谁会赢"——六维物理-制度适应性加权得分 × E_network 正反馈 →
  赢家通吃。在储备资产竞争中：哪个候选资产在六维（对主权储备配置重标定的
  六个维度，见 operationalization）上评分最高、且一旦 E_network 越过阈值就
  锁定——给方向预测的硬核。
  DED-028 给"谁先动"——SOV 无法律强制缓冲 → 储蓄端对信用下滑最先反应 →
  价值储藏迁移先于交易媒介崩塌。在储备资产竞争中：央行储备配置（SOV 的机构级
  对应物）先于贸易结算货币重构（MOE 的机构级对应物）——给时序预测的结构性保证。
  DED-029 给"为什么现在动"——四个独立测度的因素各自伸缩 E_network。
  在储备资产竞争中：何种触发配置（利率崩塌/通胀恐慌/主权信用事件/地缘不确定性）
  在运作，决定了储备迁移的速度、幅度以及哪个候选因该触发配置而最受益——
  给触发的操作性框架。
  三条父推论各自独立描述一个截面——方向（谁赢）、时序（先动什么）、触发
  （为什么动）——没有一条能单独给出完整的储备资产体制切换轨迹。合成后，
  方向×时序×触发 = 三维动力学。

  【Emergent property】
  涌现类型声明：主体为合取级（conjunction / 薄涌现）——三条父推论各自独立
  产生自己的压力方向（DED-027→收敛方向、DED-028→时序结构、DED-029→触发
  推力），在同一对象（储备资产竞争）上并行运作，综合格局（三维动力学）不能
  被任一单父推出。预测 (iv) 声称交互级（interaction / 厚涌现）——
  DED-028/DED-029 的信用下滑速度【修改了】DED-027 的 E_network 收敛的
  运作条件：慢速下滑时收敛渐变（事前最优者自然赢），急性下滑时收敛被压缩为
  先发优势竞赛（赢家由路径依赖决定、未必是事前最高分者）——结果类型被改变
  （从"最佳者胜"变为"先动者胜"）。交互级证据标准（需展示机制 A 改变了机制 B
  的运作条件）在预测 (iv) 中尚未经由独立经验检验满足，诚实标注其证据条件；
  (iv) 的证伪门槛（falsifiability d）按交互级设计（要求跨事件比较而非单格反例）。

  【Prediction】
  (i) 方向性收敛——当在任储备资产（当前为美元）的法币信用沿连续谱下滑时，
  储备资产迁移的方向收敛于六维适应性加权得分最高的候选资产（或候选集合中的
  胜出者）。迁移不是各候选资产按各自得分比例瓜分流量的线性过程——E_network
  正反馈将流量集中于领先候选、挤出接近竞争者。收敛方向由六维适应性预先约束：
  得分系统性低的候选不会因"偶然被选中"而胜出（DED-027 的物理筛选硬核）。

  (ii) 时序结构性——储备资产迁移遵循 SOV 先于 MOE 的结构性时序，该时序在
  主权/机构层面与家庭层面同构。SOV 对应：央行外汇储备币种配置、主权财富基金
  资产配置——这些无法律强制维持、由信心驱动、对信用下滑最敏感。MOE 对应：
  国际贸易结算货币构成、国际债务发行币种构成、外汇市场交易货币对构成——
  这些有制度惯性（现有结算基础设施、合约惯例、网络外部性）提供缓冲。
  预测：央行储备币种分散化（SOV 指标）的变动在时序上领先于且幅度上大于贸易
  结算货币构成的变动（MOE 指标），差距（delta）在信用下滑速度越快时越大。

  (iii) delta-速度非线性——信用缓慢下滑时（如美元储备份额以每年 <0.5 百分点
  的速度下降，持续十年以上），SOV-MOE delta 小（储备微调而结算结构基本不变，
  市场有充足适应时间）。信用急性下滑时（由离散信用事件触发——如储备货币发行国
  的资产冻结/制裁、主权违约/降级、恶性通胀），SOV 迅速逃逸而 MOE 滞后调整，
  delta 显著放大。delta 与信用下滑速度的共变关系应呈现非线性（凹向上）：慢速
  时 delta 接近常数（微小的结构性时差），快速时 delta 跳跃式扩大。

  (iv) 路径依赖收敛【交互级子预测——最弱腿】——当以下三个条件同时满足时：
  (a) 在任储备资产法币信用急性下滑（trigger）；(b) 存在 ≥2 个六维适应性得分
  接近的候选储备资产（接近 = 按储备域 rank/δ 协议判定——该协议尚未注册，
  DED-027 的商品时代秩位规则不可平移；注册前本条件不可操作，(iv) 为未来
  才可检的机制假说，见 operationalization 的 r1 标记）；(c) 该急性下滑事件
  的性质使各候选的 E_network 触发不对称（触发不对称按预测 (vi) 的 C 轴
  编码判定：主导触发类型 + 各候选在该触发类型下的先验受益方向）——则储备
  资产竞争的胜出者由路径依赖决定（谁先获得首个大国
  央行的配置、谁在危机窗口中最具流动性），且事后胜出者可能不是事前六维得分
  最高的候选。预测：在多个独立急性信用下滑事件中，事前六维得分排名与事后
  储备资产收敛方向的一致性应显著低于慢速下滑事件中的对应一致性。

  (v) 锁定与迟滞——一旦新的储备资产 E_network 越过主导阈值（该资产在全球
  央行储备中占比 >50% 或系统性超过前任），即使触发该迁移的在任储备资产信用
  下滑被逆转（如发行国完成财政整顿、恢复信用），已建立的 E_network 正反馈
  不会自动反转——储备资产体制切换呈现迟滞（hysteresis）。预测：储备资产
  份额的逆转所需的条件比当初触发迁移的条件更苛刻——恢复信用不足以逆转，
  需新的候选资产在六维适应性上系统性超越当前主导者且伴生自身的信用触发事件。

  (vi) 触发类型差异化受益【r1 新增——让 DED-029 的独有内容落地为被测
  变量】——按 DED-029 的独立测量轴编码触发事件的主导类型：C1（实际
  利率，TIPS 收益率）、C2（通胀预期，密歇根调查/盈亏平衡通胀率）、
  C3（法币信用，CDS 利差/评级/r1 事件类清单）、C4（不确定性，VIX/EPU）。
  【r3 一次性注册——C3 离散事件类的主导判定分支】C3 轴混装连续量
  （CDS 利差/评级利差）与 r1 事件类清单中的离散事件（储备冻结/主权违约/
  评级下调/恶性通胀确认）。离散事件如何进入四轴 z 比较，三选一，须一次
  性注册、注册后不得再调：
  ——选项 A（本注册选用）：清单内 C3 离散事件在事件窗口内发生时，C3 自动
  判定为主导触发类型，跳过连续轴的 z 比较。理由（独立于 2022 案例结果）：
  离散事件（尤其资产冻结/主权违约）是法币信用崩塌的直接可观测表现——
  它们不是信用崩塌的市场代理而是信用崩塌本身；某些离散事件（如资产冻结）
  在 CDS 合约覆盖范围外、连续量 CDS 无法捕获其信用冲击。当信用崩塌以
  直接形式发生时，其信号优先于市场代理的连续读数——此为测量理论的一般
  原则（直接观测优先于代理），不依赖任何特定案例的结果。
  ——选项 B（不选用）：离散事件折算为等效 z 值参与比较。否决：无自然
  折算尺度（二进制事件→连续 z），任意性不可接受。
  ——选项 C（不选用）：仅连续量参与 z 比较（离散事件不参与主导判定）。
  否决：后果是 CDS 覆盖不到的信用崩塌类型（资产冻结）永不可能成为主导
  触发，使 C3 轴失去对此类最重要信用事件的覆盖，与设立事件类清单的初衷
  矛盾。
  主导类型（一般规则）：事件窗口内标准化变动幅度（各轴按自身历史分布
  z 化）最大者——若 C3 离散事件在窗口内发生，按上述分支规则 C3 自动
  判为主导，不再比较连续轴 z 值。预测：(a) C1 主导触发（实际利率崩塌）
  时，非生息候选（黄金）的 E_network 份额增益系统性高于生息主权候选；
  (b) C3/C4 主导触发时，不依赖对手方履约的候选（黄金等非主权资产）的
  相对增益高于与在任者共享同类主权风险的候选（如同为冻结方的欧元/日元）。
  增益测量 = 事件后 4 个季度各候选 E_network 综合指标变化量（标准化）。
  此预测同时为预测 (iv) 条件 (c) 的"触发不对称"提供测量定义。
  【r3 第 11 条不利记账——2022 对 (vi) 活性张力】分支规则系 2022 冻结
  窗口两种读法裁决翻转的歧义被 r3 审查者指出后注册——2022 对 (vi) 记为
  活性张力（不享受事前注册效力，裁决待分支规则生效后按规则执行一次、
  不得再调）；r2 的"(vi) 方向核验通过"声明限定为 2011/2013 两事件
  （此两事件不涉及 C3 离散事件类 vs 连续量的歧义，核验有效）。

operationalization:
  储备资产地位（被预测量）:
    definition: "某种资产在全球主权/超主权机构的价值储藏配置中充当主导工具的
      程度——操作化为该资产在三个维度上的综合份额。"
    measurement: |
      (a) 全球已分配外汇储备币种份额（IMF COFER 季度数据）——最直接且覆盖最广。
      (b) 主权财富基金资产配置币种/资产类别份额（SWFI 年度报告、各基金年报汇总）。
      (c) 国际债务证券发行币种份额（BIS 国际债务证券统计）。
      综合指标 = (a)×0.5 + (b)×0.25 + (c)×0.25（r1 整改：权重现予一次性
      锁定，不再调整——旧文"可在预注册阶段调整"之门关闭；权重逻辑：
      COFER 覆盖最广、报告最规范，主权基金和债务证券各捕捉配置和发行端）。
    limitations: "COFER 仅覆盖已分配储备且报告国有选择偏差（部分央行不报告
      币种构成）；中国等主要储备持有国报告不完整；黄金在 COFER 中被单独统计
      但以市值计量受金价干扰。主权基金数据口径不一、报告频率低。"

  在任储备资产信用下滑速度（自变量，继承自 DED-028/029）:
    definition: "在任储备资产（当前为美元）的发行者信用沿 BR-L2-024 连续谱
      的移动速率。"
    measurement: |
      多代理综合（避免单代理的局部敏感度偏差）：
      (a) 美国 5 年期主权 CDS 利差的季度变化（捕捉极端低信用段信号）。
      (b) 密歇根大学 5 年通胀预期调查的两年滚动斜率（捕捉中段信用侵蚀）。
      (c) 美元在全球已分配储备中份额的 5 年滚动下降速率（捕捉行为实现）。
      三代理至少两个同向且显著性超过各自历史噪声水平 → 确认信用下滑。
      硬规则（r1 整改，堵 DV 自确认通道）：纯外部代理（CDS 或通胀预期）
      必须位于同向确认腿之内——代理 (c)（储备份额速率）是被预测量成分，
      不得与自身组合完成确认。
      急性下滑判据【r1 重注册——一次性注册，此后不得再调】：同一季度内
      同时满足两腿——
      (i) 事件腿（纯外部）：发生预注册事件类清单之一——在任储备资产
      发行者对主权持有者的储备冻结/没收；主权违约（含选择性违约）；
      主要评级机构下调发行者主权评级；恶性通胀确认（月通胀 >50%）。
      事件类以公开官方公告/评级公告日期独立标定。或替代满足：CDS 利差
      周度展宽 ≥ 3σ（σ 按事件前 10 年周度变化分布一次性计算）。
      (ii) 行为腿：储备份额季度下降 ≥ 3σ——σ 按 COFER 1999Q1 起至事件
      前一季度的份额季度变化分布（经估值效应调整）一次性计算并锁定。
      撤回旧注册中"0.3pp≈3σ"的标定——其把历史季度波动【均值】0.1pp
      误当 σ 用，标定依据不成立。
      反向裁决记录（通用红旗第 11 条 / L4-009 判例）：2022 俄储备冻结在
      旧注册下两腿均不过线，旧文临场改走的"定性制度断裂"路径属注册外
      事后口径——2022 暂不计为已确认急性事件；待本次重注册的 σ 实际计算
      执行后对 2022 重新编码一次（事件腿在清单内，行为腿待 σ 判定），
      过线与否均不得再调。
      【r2 一次性注册——分时代/分子网络代理映射与 σ 口径（RF-7，吸收
      r1 SF-2）】上文各代理与 σ 锚定现代数据源（CDS、密歇根调查 1978
      起、COFER 1999Q1 起）；子全球代理事件池与历史锚点大半跨出这些
      数据源的覆盖范围。现注册如下映射——一次性、先于池的首次编码、
      注册后不得再调：
      时代分层——
      T1 现代（1999Q1 后）：按上文注册执行，不变。
      T2 战后至 1999（1945-1999）：(a') 长期国债收益率对主要储备货币
      参照篮子的利差变动，替代 CDS；(b') 实现通胀的两年滚动斜率替代
      密歇根调查（1978 后仍用密歇根）；(c') IMF 年报官方储备币种构成
      序列（COFER 前身口径，年度频率）替代 COFER。σ 口径通则：按所用
      序列自身在事件前可得的全部区间的变化分布一次性计算；行为腿最短
      样本要求 ≥20 个观测，不足则该事件行为腿判"不可编码"悬置，不得
      放宽门槛代替。年度频率序列下"季度降幅 ≥3σ"重标定为"年度降幅
      ≥3σ（σ 按年度变化分布计算）"。
      T3 1945 前（锚 1 适用）：信用代理 = 债务/GDP 趋势 + 金平价事件
      （脱钩/贬值的公开公告日期，独立标定）；储备构成用学术重建序列
      （Eichengreen-Flandreau 一系）——该时代数据仅支持方向与时序
      编码，不支持 σ 级行为腿判定（如实降格：锚 1 的 delta 只提供
      方向一致性，与其 confidence 标注一致）。
      子网络映射——SOV 指标 = 该子网络成员官方储备中在任锚资产的
      份额（数据源：IMF 年报 / 各成员央行公开报告 / 学术重建序列）；
      MOE 指标 = 该子网络内贸易结算或债务发行中锚资产的份额；σ 按
      该子网络自身序列依上文通则一次性计算。
      可编码性诚实声明（按第 11 条，不容许"名义可满足"充数）：
      - 英镑区退出潮 1960s-70s：T2 映射下原则可编码（BoE/IMF 历史
        统计与 Schenk 一系重建序列为候选数据源），序列实际可得性
        须在首编码时核实——核实失败则移出可编码子集，不得改用未
        注册代理。
      - 卢布区解体 1992-93：事件腿可编码（恶性通胀确认，公开统计
        独立标定）；行为腿依赖各共和国储备构成序列的重建，当前
        【不可编码】——悬置，待序列重建后按本协议编码。
      - 拉美美元化 episodes（厄瓜多尔 2000、阿根廷多轮）：事件腿可
        编码（主权违约/恶性通胀在清单内）；行为腿 = 该国官方储备 +
        银行体系存款美元化率序列（各国央行公开数据），T1/T2 映射下
        原则可编码。
      - 1997 亚洲危机后东亚重构：跨 T2/T1 边界；行为腿用 IMF 年报
        序列衔接 COFER，衔接规则（年度→季度口径转换）在首编码时
        一次性锁定后不得再调，原则可编码。
      ≥5/≥3 门按可编码子集重估：慢速样本 ≈ 3（锚 1 方向级、
      1971-1990 已编码、2000-2024 经时窗披露后）；急性候选 ≈ 3-4
      （2022、厄瓜多尔 2000、阿根廷、亚洲危机——全部待行为腿实算，
      无一已确认）。falsifiability (c) 的 ≥5 门在可编码子集上具备
      名义可满足性且首次有明确执行路径，但在首编码执行前不得声称
      已满足；(d) 的 ≥3 门额外依赖储备域 rank/δ 协议（未注册），
      维持未来才可检。
    limitations: "CDS 在正常时期变动微小→低速下滑窗口期信号弱（诚实：慢速
      下滑的操作化依赖储备份额趋势 + 通胀预期斜率，CDS 在此区间仅作确认）。
      不同代理捕捉谱的不同段——要求至少两个同向降低单代理误报率。"

  候选储备资产六维适应性（自变量，继承自 DED-027——射程扩展）:
    definition: |
      候选资产在六个储备配置相关维度上的加权得分。六维从 DED-027 的商品货币
      物理框架向主权储备域重标定（此重标定是本推论的射程扩展，诚实声明）：
    measurement: |
      D1-可分性（原"可分性"）：候选资产可被细粒度配置的程度。
      操作化为：该资产是否有覆盖短/中/长端的完整期限结构、是否有小额配置工具
      （ETF/期货/衍生品使小国央行可参与）、最小交易单位是否适配储备管理操作。
      D2-耐久性（原"耐久性"→重标定为"制度耐久性"）：候选资产发行者的制度/
      治理稳定性。操作化为：发行国央行独立性指数、财政可持续性（债务/GDP
      趋势）、政治稳定性（World Bank Governance Indicators 相关子项）。
      D3-便携性（原"便携性"→重标定为"市场可接入性"）：候选资产市场的
      跨境可接入程度。操作化为：资本账户开放度（IMF AREAER）、市场深度
      （Bid-Ask spread / 日均交易量）、是否有时区/结算基础设施覆盖缺口。
      D4-可识别性（原"可识别性"→重标定为"透明度与可验证性"）：候选资产
      的信息可得性和可靠性。操作化为：发行国数据透明度（IMF SDDS 订阅）、
      央行政策沟通清晰度（可预测性指数）、储备资产的审计/托管链条完整性。
      D5-同质性（原"同质性"→重标定为"标准化与可替换性"）：候选资产的
      标准化程度。操作化为：是否有活跃的基准收益率曲线、证券标准化程度
      （ISIN 覆盖）、衍生品市场流动性（可对冲）。
      D6-供给稳定性（原"供给稳定性"→重标定为"政策可信度"）：候选资产的
      发行纪律。操作化为：央行通胀目标制的可信度（长期通胀预期锚定程度）、
      财政赤字规则遵守记录、历史上是否发生过违约/资产冻结/没收。
      每维得分用 0-1 标准化（同 DED-027 methodology）。
      权重由全球储备配置网络的特征外生决定（同 DED-027 逻辑）：
      全球金融深度↑ → D1 可分性、D5 同质性权重↑；
      跨境资本流动限制↑ → D3 便携性权重↑；
      信息不对称（新兴发行国）→ D4 可识别性权重↑；
      地缘紧张→ D2 制度耐久性、D6 政策可信度权重↑。
      【r1 整改——诚实标记：储备域 rank/δ 协议未注册、当前不可操作待补】
      DED-027 的 rank-protocol 秩位规则（冶金温度、一日陆路行程、试金石
      制度）是商品货币时代专用判据，无一可平移到储备域。上述四条权重
      方向性规则尚无配套的储备域秩位判据、δ 数值与测量口径（分子分母、
      标准化方法）。后果如实登记：轴 A"单一显著 vs 多候选接近"的列归属
      判定、预测 (iv) 条件 (b)、falsifiability (d) 的"得分接近的候选"
      在协议注册前均不可操作。协议注册须一次性完成、先于任何入格编码，
      注册后不得再调——在此之前，涉及"多候选接近"的格 4/6 与预测 (iv)
      按未来才可检处理。
      【r3 一次性注册——SF-5 δ-free 支配序过渡判据（RF-8 配套升格）】
      在完整 rank/δ 协议注册前，以 δ-free 支配序为轴 A 列归属的过渡可操作
      判据——一次性注册、先于任何正式列归属编码、注册后不得再调：
      (a) 挑战者间支配（"单一显著"列判据）：若候选 A 在 ≥4/6 维度上得分
      高于候选 B，且不存在 B 在任一维度上得分高于 A 超过边际容差（容差 =
      0.05/1.0，即可忽略差异），则 A 支配 B。若存在一个候选支配所有其他
      候选，且不存在相互支配的对，则落入"单一显著"列。
      (b) 在任者 vs 挑战者支配（"合格挑战者存在"判据）：若在任者在 ≥4/6
      维度上得分高于某挑战者，且不存在该挑战者在任一维度上得分高于在任者
      超过 0.05 边际容差，则在任者支配该挑战者。若在任者支配【全部】挑战者，
      则落入"无合格挑战者"列——DED-027 的收敛机制在此列不发动。
      (c) 既非 (a) 也非 (b) 的位形落入"多候选接近"列。
      支配序是【充分条件】（支配成立即判列归属），非必要条件（未支配不判
      接近——落入"多候选接近"列后由 δ 协议精细区分，δ 协议注册前该列
      维持不可操作）。支配序仅依赖维度序数比较，不依赖 δ 数值——在 δ
      协议注册前即可操作化。
      诚实边界：(i) 容差 0.05 与门槛 4/6 是标定选择，非数据推导——合理性
      待对抗审查；(ii) 支配序对锚 1（战间期美元 vs 英镑）和 1971-1990
      （马克/日元 vs 美元）的支配关系标定须按独立制度数据完成（本文不代跑），
      且须符合 anti_talisman (2)（不由事后储备份额反推）。
    limitations: |
      "制度耐久性"和"政策可信度"等维度涉及主观判断成分高于 DED-027
      的物理维度（如金密度是物理事实、法院独立性是制度事实——后者的
      测量方差更大）。此重标定是 DED-027 射程扩展的核心风险点——
      若六维重标定不能有效区分候选（所有主要经济体得分都接近）、
      则 DED-027 在本推论中的区分力被架空。权重推导在网络特征稳定期
      变化微小——急性下滑事件中网络特征快速变化但权重重标定可能滞后，
      此为预测 (iv) 路径依赖的时间窗口来源之一。

  E_network for 储备候选（中介变量）:
    definition: "接受某资产作为储备/价值储藏工具的全球主权/超主权机构的
      网络广度与强度——即'有多少央行、在多强的程度上配置该资产'。"
    measurement: |
      (a) 配置广度：持有该资产的央行数量 / 全球央行总数（至少报告储备
      构成的央行子集）。
      (b) 配置强度：该资产在已配置该资产的央行储备中的平均份额。
      (c) 趋势方向：连续四个季度配置广度与强度的滚动变化方向。
      E_network 综合指标 = (a)标准化 × (b)标准化。
      (d) 连通性入格前提（r1 注册，锚 1 战间期消化的代价条款）：收敛类
      预测（(i)(iv)(v) 与格 3-6 的收敛部分）仅在全球储备网络连通时入格。
      连通性操作化：主要储备持有经济体之间不存在把储备网络分割为互不
      侵蚀子网络的货币集团/资本管制分区——按 anti_talisman (5) 的份额
      交叉弹性判据测量，跨集团交叉弹性 ≈0（各集团内各自主导、互不侵蚀）
      即判分区，分区期不入格、不计收敛证据也不计收敛反例。
    limitations: "配置数据不完整（非所有央行报告）；季度频率可能掩盖
      月内快速迁移；配置广度可能受'已有该资产发行国货币互换协议的国家'
      的样本偏差影响——需控制双边互换网络变量。"

  SOV-MOE delta（复合因变量——储备层面的解耦程度）:
    definition: "储备资产配置变化（SOV 的机构对应物）领先于且幅度上大于
      贸易结算/国际债务发行货币构成变化（MOE 的机构对应物）的程度。"
    measurement: |
      SOV 指标 = COFER 中非在任储备资产币种份额的季度变化（经估值效应调整）。
      MOE 指标 = SWIFT 支付中非在任储备货币份额的季度变化（或 BIS 国际债务
      证券中非在任储备货币发行份额的季度变化，取二者更连续者）。
      delta_t = SOV 指标在 t 期的累计变化 − MOE 指标在 t 期的累计变化，
      基期 = 信用下滑事件被确认的季度。
      慢速下滑 delta 操作化为 3 年滚动窗口均值；急性下滑 delta 操作化为
      信用事件后 4 个季度的累计值（给 MOE 最低限度调整时间）。
    limitations: "SWIFT 仅覆盖报文流量非实际结算额；估值效应（汇率变动
      改变储备份额）需剥离；基期选择对急性事件的 delta 读数敏感——
      基期须按预注册规则锁定（信用事件确认的季度）、不得事后调整。"

derivation:
  from_l3:
    deductions: [DED-027, DED-028, DED-029]
  from_l1:
    axioms: [AXIOM-001, AXIOM-002, AXIOM-003]
    theorems: [THEOREM-value-attribution, THEOREM-exchange-competition-alternative,
               THEOREM-relation-information-asset, THEOREM-cooperation-precondition]
  from_l2:
    bridging: [BR-L2-021, BR-L2-022, BR-L2-024, BR-L2-007, BR-L2-011, BR-L2-012]
  from_l4: []
  steps: |
    1. 父机制摘要——三条 L3 推论各自捕捉储备资产竞争的一个截面：
       DED-027：方向截面——E_network 正反馈使系统收敛到单一主导媒介，
       胜出者须是六维加权最优（但得分接近时赢家由路径依赖决定→胜出偶然），
       赢家通吃锁定。对应到储备资产竞争：哪个候选成为下一个主导储备资产
       由六维适应性筛选 + E_network 正反馈共同决定。
       DED-028：时序截面——法币信用下滑时，SOV 因无法律强制最先逃逸，
       MOE 因法律强制和制度惯性滞后崩塌，二者之间存在结构性时间差。
       对应到储备资产竞争：央行储备配置（SOV 的机构对应物）先变化，
       贸易结算货币结构（MOE 的机构对应物）后变化——时序同构。
       DED-029：触发截面——金价的 E_network 成分被四个独立测度的因素驱动
       （实际利率/通胀预期/法币信用/不确定性），各自沿独立通道起效且均走
       E_network 这一统一通道。对应到储备资产竞争：任一个储备候选的
       E_network 同样被这四个因素驱动——给操作化触发框架。

    2. 交互逻辑——三条父推论不是平行独立运作，而是存在序贯交互：
       (a) DED-029 的四个触发因素决定了 DED-028 的信用下滑速度——
       若 C3（法币信用事件）和 C4（地缘不确定性）同时触发且强度高 →
       DED-028 的"快速下滑"区间 → delta 大。
       (b) DED-028 的信用下滑速度【修改了】DED-027 的 E_network 收敛
       动力学——慢速下滑时，E_network 收敛是渐进的，六维适应性事前最佳者
       有充足时间通过边际配置流入积累 E_network 优势 → 自然胜出；
       急性下滑时，E_network 收敛被压缩——配置决策在高度不确定下快速作出，
       事前最佳者的信息优势被噪声淹没，"谁先在危机窗口中获得第一个大国
       央行的大额配置"成为 E_network 收敛的初始条件 → 路径依赖赢家
       （第一推动者优势）。这是预测 (iv) 的交互机制。
       (c) DED-029 的触发配置决定了迁移的受益候选者——不同的 C_i 触发
       指向不同候选的竞争优势：C1（实际利率崩塌→持有非生息资产机会成本↓）
       对黄金最有利、对生息储备资产不利；C3（法币信用崩塌→逃离主权资产）
       对非主权资产（黄金/Bitcoin/一篮子货币）有利、对单一主权候选不利；
       C4（地缘不确定性）对"不依赖任何对手方履约"的资产最有利。

    3. 涌现论证（详见 emergence_demonstration）：
       (a) 必要性——逐一移除父推论后核心结论均不完整：去掉 DED-027 则
       不知迁移方向与锁定条件；去掉 DED-028 则不知迁移时序（可能误以
       为结算端会与储蓄端同步）；去掉 DED-029 则不知触发机制和迁移速度。
       (b) 新颖性——至少 5 条命题不在任何单父推论中（见 novelty）。
       (c) 多父逐格判空——6 格中有 4 格需要 ≥2 父合力，2 格需要全部 3 父
       合力，其中"急性下滑 + 多候选"是签名格（见 multi_parent_cells）。

    4. 多父逐格判空——以两条父推论核心自变量构造 3×3 笛卡尔积表：
       轴 A（从 DED-027/DED-029 合成）：储备替代候选格局
         - 单一显著候选：某种资产的六维适应性加权得分显著高于其他候选
           （差距 > δ；过渡判据：SF-5 δ-free 支配序，见 operationalization）
         - 多候选接近：≥2 个候选得分接近（所有维度耗尽后差距仍 < δ）
         - 无合格挑战者：全部挑战者六维得分均系统性低于在任者（过渡判据：
           SF-5 δ-free 支配序下在任者支配全部挑战者）
         （r1 诚实标记：储备域 rank/δ 协议未注册——DED-027 的商品时代
         秩位规则不可平移；r3 以 SF-5 δ-free 支配序为过渡可操作形式，
         新增第三列"无合格挑战者"——1971-1990 位形此前无归属格、一次性
         注册后不得再调，见 operationalization）
       轴 B（从 DED-028）：在任储备资产信用轨迹
         - 稳定：信用谱在"高信心"端、无方向性移动
         - 缓慢下滑：信用沿连续谱以每年可测量速率向低端移动（无离散事件触发）
         - 急性下滑：由可独立识别的离散信用事件触发（预注册事件类清单 +
           行为腿 3σ，见 operationalization 的 r1 重注册判据）
       被预测量 = 储备资产体制状态（维持现体制 / 过渡态 / 新均衡锁定）
       详见 emergence_demonstration.multi_parent_cells 的逐格归属分析。

emergence_demonstration:
  necessity: |
    逐一移除每条 L3 父推论，检验核心结论是否仍成立：
    (a) 移除 DED-027（方向与锁定）：失去"哪个候选胜出"的方向预测和
       "赢家通吃锁定"的均衡选择。剩余 DED-028 + DED-029 只能描述
       "储备会从在任资产逃逸"这一方向（且仅当 C3 触发时）、和逃逸时序
       （SOV 先动）——但无法预测逃逸【去哪里】、也无法预测逃逸后
       【是否收敛到新均衡】还是永久碎片化。核心结论"储备资产体制切换
       朝特定候选收敛"不成立。
    (b) 移除 DED-028（时序与 delta）：失去"SOV 先逃逸、MOE 后崩塌"的
       结构性时序。剩余 DED-027 + DED-029 只能描述"信用下滑时储备资产
       应朝六维最佳候选迁移"的方向，但无法预测迁移的【阶段】（是储备配置
       先变还是结算结构先变？）、也无法预测 delta 幅度与信用下滑速度的
       关系。核心结论"储蓄端先行→储备资产竞争的先行指标在央行配置端"
       不成立——可能误判为储备端和结算端同步迁移。
    (c) 移除 DED-029（触发与速度）：失去四个独立测度的 E_network 伸缩
       触发因素。剩余 DED-027 + DED-028 只能给出"如果信用下滑则储备朝
       最佳候选迁移、SOV 先动"的条件句——信用下滑本身的监测由 DED-028
       一系代理（CDS/通胀预期/储备份额速率）已覆盖（r1 修正：旧文
       "失去事前监测能力"系夸大，删）；真正塌掉的是 DED-029 的独有
       增量——C1（利率）/C4（不确定性）两条独立触发通道，以及"触发
       类型决定哪个候选受益"的不对称推力：预测 (vi) 全塌，预测 (iv)
       条件 (c) 失去测量定义，格 6 无法区分不同急性事件类型（制裁型
       vs 违约型 vs 战争型）对候选的差异化推力。
    结论：三条父推论均为承重前提——无一为观众砖（DED-029 的承重
    经由 r1 新增的预测 (vi) 与 (iv)(c) 落地）。

  novelty: |
    以下命题不在任何单条父推论的断言中，也不是父推论 AND/OR 的平凡拼接：
    (a) "储备资产竞争不是候选资产的独立线性竞赛，而是 E_network 正反馈
       驱动的收敛过程——方向由六维适应性约束、时序由 SOV-MOE 解耦结构
       约束、触发由四因素 E_network 伸缩通道约束"——这是三维合力的系统
       命题，DED-027 单独只说"一般等价物会收敛到单媒介"（且限于商品货币
       自发交换网络），不涉及主权储备域也不涉及时序与触发。
    (b) "在急性信用下滑 + 多候选得分接近的条件下，储备资产竞争的胜出者
       由路径依赖（先发优势、危机窗口流动性）决定，而非事前六维得分排名"——
       DED-027 的"胜出偶然"指 E_network 放大微小初始优势导致两个得分
       接近者中一人胜出，但不区分慢速/急性下滑对选择机制的不同影响——
       在慢速下事前最优者有时间自然胜出、在急性下先发优势压倒事前排名，
       这一"下滑速度改变了胜出机制（从择优到抢先）"的区分不在 DED-027 中。
       DED-028/029 均不涉及多候选竞争或胜出者选择。
    (c) "储备资产体制切换存在迟滞——一旦新主导者的 E_network 越过锁定
       阈值，在任者的信用恢复不足以逆转网络效应"——DED-027 的 E_network
       正反馈暗示锁定的存在但未讨论逆转向条件；DED-028 未讨论 SOV 回流
       的对称性（其 excluded_outcomes 显式声明"信用恢复期反向 delta"不在
       射程）；DED-029 不涉及均衡选择或锁定。
    (d) "DED-028 的 SOV-MOE 解耦时序在主权/机构层面与家庭层面同构——
       央行储备配置（无法律强制）是 SOV、贸易结算货币构成（有制度惯性）是
       MOE——且二者的 delta 可独立测量"——DED-028 原文的 operationalization
       全部基于家庭/私人部门指标（家庭金融资产调查、商户法币接受率），不涉及
       央行储备或国际结算货币构成。同构扩展是本推论的新命题。
    (e) "DED-029 的四因素 E_network 伸缩框架从金泛化到任意储备资产候选——
       因四因素均走 E_network 通道而非金特有的机制通道"——DED-029 的
       falsifiability 和 operationalization 全部围绕金价编写，其 excluded_outcomes
       显式排除"两个以上因素同时变动时金价走向"——从金到任意候选的泛化
       以及多候选同时受压的格局不在 DED-029 中。

  multi_parent_cells: |
    笛卡尔积表：储备替代候选格局（单一显著 / 多候选接近）×
    在任储备资产信用轨迹（稳定 / 缓慢下滑 / 急性下滑）→ 被预测量 =
    储备资产体制状态（维持现体制 / 过渡态 / 新均衡锁定）。

    【格 1: 稳定 + 单一显著】→ 维持现体制，替代候选在边际配置中占比微升。
    归属: 零父（常识格）——没有信用下滑压力、无需收敛，每条父推论均不
    预测体制切换。DED-029 单独可预测金价受 C1-C4 驱动的日常波动，
    但不涉及储备体制变迁。

    【格 2: 稳定 + 多候选接近】→ 维持现体制，储备配置有轻微分散化但无
    方向性趋势（随机游走或均值回归，因无信用下滑触发任何迁移）。
    归属: 零父（常识格）——无信用下滑即无 SOV 逃逸（DED-028），无逃逸
    即无 E_network 收敛的原始推动力（DED-027），无触发即 E_network
    无方向性伸缩（DED-029）。三条父推论在此格均"在场但不发功"——
    体制切换的发动条件不满足。

    【格 3: 缓慢下滑 + 单一显著】→ 储备资产缓慢但方向确定地向单一显著
    候选迁移。SOV 端（央行储备配置）领先于 MOE 端（贸易结算重构），
    delta 小（DED-028 慢速 delta 预测）。E_network 逐渐在候选上积累，
    锁定为时间问题。此格预测的方向（向谁迁移）由 DED-027 的六维筛选强制、
    时序（SOV 先、delta 小）由 DED-028 强制、速度（缓慢）由 DED-029
    （C1-C4 均无急性触发）约束。
    归属: ★ 需要 DED-027 + DED-028 合力（2 父）。
    - DED-027 单独：只知"如有迁移则收敛到最优候选"，不知迁移是否发生
      或时序如何（其自宣射程不含现代法币信用下滑场景）。
    - DED-028 单独：只知"如有信用下滑则 SOV 先动、delta 小"，不知
      迁移去哪、收敛到谁——SOV 可以分散到多种资产而永不收敛。
    - DED-029 单独：只知各 C_i 对金的方向性效应，不知储备资产整体
      迁移格局，也不知除金外的候选的存在。
    合力格——DED-027 给方向、DED-028 给时序、二者缺一不可。

    【格 4: 缓慢下滑 + 多候选接近】→ 储备资产迁移初期碎片化（多候选
    各吸入部分 SOV 流出），中期 E_network 正反馈逐渐在事前的加权得分
    最优者上积累优势（DED-027 的 rank-protocol 逐级比较→微小优势被
    慢速正反馈放大），后期收敛到事前的最高分者或其附近。SOV-MOE delta
    比格 3 更小（碎片化迁移→交易端更难辨别信号→MOE 调整更慢）。
    归属: ★★ 需要 DED-027 + DED-028 + DED-029 合力（3 父）。
    - DED-027 单独：只知"多候选得分接近时仍收敛、赢家通吃、胜出由
      路径依赖偶然决定"，但在慢速下路径依赖的程度被"充裕的适应时间"
      稀释——事前最优者有足够时间自然胜出，DED-027 未对此精细化。
    - DED-028 单独：只知 SOV 先动、delta 小，不涉及碎片化迁移到收敛
      的过渡动力学。
    - DED-029 单独：只知各 C_i 的方向，不涉及多候选竞争。
    合力格——需 DED-027（收敛方向 + 优胜劣汰）+ DED-028（SOV 先行
    时序 + delta 规模）+ DED-029（触发速度决定碎片化窗口长短）。

    【格 5: 急性下滑 + 单一显著】→ 储备资产快速向单一显著候选迁移。
    SOV 端迅速逃逸（DED-028 快速 delta），增量需求无供给缓冲（在任
    资产的网络效应仍在但新配置集中涌入候选）、价格/份额快速移动。
    E_network 快速锁定（DED-027 赢家通吃加速）。
    归属: ★★ 需要 DED-027 + DED-028 合力（2 父，DED-029 提供急性
    识别的操作化但非本格的增量预测内容）。
    - DED-027 单独：不知迁移何时发生、以什么速度发生。
    - DED-028 单独：不知向谁迁移——"SOV 快速逃逸"可逃向多种资产。
    - DED-029 单独：可识别急性触发但不涉及收敛目标。
    合力格——DED-027 给方向 + DED-028 给时序与速度。

    【格 6: 急性下滑 + 多候选接近】★ ★ ★ 签名格（本推论的最强非平凡贡献）。
    预测：储备资产迁移初期急速碎片化——SOV 从在任资产大量逃逸，但逃向
    何方在短期内不成比例（因决策在高度不确定下作出、信息不完整）。随后
    E_network 正反馈在"先拿到第一个大国央行大额配置的候选"上率先启动→
    该先发优势被正反馈放大→其他接近候选被挤出→系统仍收敛到单一主导者，
    但该胜出者【未必是事前六维得分最高的候选】——胜出者是事前得分最高者
    附近集合中的一员，具体由路径依赖（谁在危机窗口中最具流动性、谁先获
    得关键行为者的配置）决定。口径统一（r2 修 SF-1——先于任何格 6/(iv)
    编码完成）：本格对"胜出者是否最高分者"的声称是【概率式】而非确定式，
    与预测 (iv) / falsifiability (d) 一致——跨多个独立急性事件，非最高分
    者胜出的频率应显著高于慢速事件中的对应频率；单一急性事件中最高分者
    胜出【不】构成本格反例；所有急性事件中最高分者恰都胜出时，路径依赖
    与"择优必然"不可区分——按 anti_talisman (4) 诚实标注为不可检验，
    而非虚报检验力（旧文"胜出者的六维得分必然接近最高但不等于最高"的
    确定性措辞撤回）。
    归属: ★★★ 需要全部三条父推论合力，且任何两条的组合均无法推出完整预测。
    - DED-027 + DED-028（缺 DED-029）：可推出"急性下滑→多候选→仍收敛
      但胜出可能偶然"，但无法区分不同急性下滑【事件类型】（制裁型 vs 违约型
      vs 战争型）对哪个候选更有利——即无法精细化路径依赖的方向性来源。
    - DED-027 + DED-029（缺 DED-028）：可推出"四因素触发→各候选 E_network
      伸缩不对称→收敛到受最大推力的候选"，但缺失"SOV 先逃逸"使急性期
      的决策特征（恐慌、信息不完全）被忽略——而正是这一特征创造了路径依赖
      的窗口。
    - DED-028 + DED-029（缺 DED-027）：可推出"急性下滑→SOV 快速逃逸→
      逃逸方向由触发配置决定"，但无法预测逃逸后【收敛】到单候选主导——
      SOV 可以永久碎片化到多种资产而不收敛（缺 DED-027 的"赢家通吃"）。
    合三者才能给出完整的"碎片化→路径依赖收敛→可能非最高分者胜出"轨迹。
    【r3 一次性注册——轴 A 第三列"无合格挑战者"（3 个新增格）】
    以下为轴 A = 无合格挑战者（全部挑战者六维得分系统性低于在任者）的位形。
    此列下 DED-027 的收敛机制不发动（无合格挑战者则"收敛到谁"的问题无解，
    六维筛选只给出"谁也打不过在任者"的否定性约束），储备迁移由 DED-028
    （时序）与 DED-029（触发速度）驱动、但不朝向替代储备候选收敛。

    【格 7: 稳定 + 无合格挑战者】→ 维持现体制，与格 1/2 同。
    归属: 零父（常识格）——无信用下滑即无迁移动力。

    【格 8: 缓慢下滑 + 无合格挑战者】→ 储备资产碎片化分散（SOV 从在任资产
    逃逸、分散到多种备选资产），但不发生收敛式体制切换——备选资产因六维
    得分系统性低，无法积累 E_network 正反馈所需的初始临界质量。碎片化属于
    组合再平衡，非收敛中间态。若触发逆转（信用重建确认），迁移中止/回流——
    回流不构成"收敛被推翻"也不构成"收敛被证实"（收敛机制从未发功）。
    SOV-MOE delta 方向同格 3/4（SOV 先动），但 delta 可能更小（无清晰收敛
    目标→交易端更难辨别信号→MOE 调整更慢）。
    归属: ★ 需要 DED-028 + DED-029 合力（2 父，DED-027 在此列不发动）。
    - DED-028 单独：只知 SOV 先动、delta 存在，不知为何碎片化不终结。
    - DED-029 单独：只知触发速度，不知迁移后是否有收敛。
    - DED-027 单独：只给否定性约束（无合格挑战者），不给正向预测。
    合力格——需 DED-028（SOV 先行时序 + delta）+ DED-029（触发速度决定
    碎片化窗口长短）共同描述"碎片化组合再平衡"的时间结构；DED-027 提供
    列前件（无合格挑战者的判定）。
    【r3 诚实声明——1971-1990 位形】本条位形的注册预测（缓慢下滑 + 无合格
    挑战者 → 碎片化组合再平衡 + 触发逆转则中止回流）正是 1971-1990 案例的
    实际位形。消化中路径一（六维不接近）即依赖本列逻辑。前件系 1971-1990
    被消化【之后】注册，按第 11 条该案不享追溯效力（未遂张力维持），但
    前件本身由 DED-027 六维筛选的结构逻辑独立论证——无合格挑战者时
    E_network 收敛缺乏施加对象，此推断不依赖该案的结果。

    【格 9: 急性下滑 + 无合格挑战者】→ 储备资产急性逃逸——SOV 从在任资产
    大量流出，但因无合格挑战者，流入方向为低风险安全资产（黄金等无发行者
    风险资产）和/或多资产的碎片化分流，非朝向替代储备候选的收敛式切换。
    若触发逆转确认，迁移中止/回流。SOV-MOE delta 大（急性逃逸 + MOE 惯性）。
    与格 6（急性+多候选接近）的关键区别：本格不预测路径依赖赢家——因为
    没有候选能赢，安全资产不是"新储备体系"的候选而是过渡避难所。
    归属: ★★ 需要 DED-028 + DED-029 合力（2 父，DED-027 提供列前件）。
    - DED-027 单独：只知无合格挑战者，不知迁移速度与避难所选择。
    - DED-028 单独：只知 SOV 先动、delta 大，不知为何无候选收敛。
    - DED-029 单独：只知触发速度与类型不对称，不知为何碎片化。
    合力格——需 DED-028（急性 SOV 逃逸 + delta）+ DED-029（触发类型决定
    避难所选择：C3/C4 → 黄金占优；C1 → 生息安全资产占优）。

    合力格数量统计：9 格中 6 格需要 ≥2 父合力（格 3/4/5/6/8/9），3 格需要
    全部 3 父合力（格 4/6，维持 r2 裁定），1 个签名格（格 6）。

  emergence_type: "混合——主体为合取级（conjunction / 薄涌现），三条父推论
    各自独立产生压力方向（方向/时序/触发），在同一对象上并行运作产生三维
    动力学综合格局，任一单父不可推。预测 (iv) 声称交互级（interaction /
    厚涌现）——急性下滑速度修改了 DED-027 的 E_network 收敛的运作条件，
    从'择优收敛'变为'抢先收敛'，结果类型被改变。诚实：交互级子预测的
    证据标准（跨多个独立急性事件的统计比较）尚未满足，按 interacting
    落档 verified*（厚涌现验证）仅当 falsifiability (d) 的检验被执行
    且存活后成立；当前 status=candidate 下此项搁置。"

falsifiability: |
  本推论可被以下发现证伪（按致命程度排序）：

  (a) 方向性收敛被推翻——在至少一个可独立确认的信用下滑事件中（按
  operationalization 的预注册判据），在任储备资产信用显著下滑，
  【且】存在至少一个六维得分接近或超过在任者的合格挑战者，但储备
  资产迁移【未朝六维适应性得分最高（或接近最高）的候选收敛】，而是
  (i) 朝一个六维得分系统性更低的候选大规模迁移；或 (ii) 永久碎片化到
  多个候选而不呈现任何收敛趋势（5 年以上无收敛迹象）。
  【r3 一次性注册——(a)(i)(ii) 的"合格挑战者存在"前件】本条证伪条件
  仅适用于【存在合格挑战者】的位形——与预测 (i) 的前件同步注册。
  当无合格挑战者时，(a)(i)(ii) 不适用：碎片化属组合再平衡而非"收敛
  机制失败"，不构成方向预测的证伪（见 multi_parent_cells 轴 A 第三列
  的注册预测）。前件系 1971-1990 案例消化后被指出缺口后注册，按第 11 条
  对该案不追溯（未遂张力记账维持不变），仅对后续案例生效；注册后
  不得再调。
  【r2 一次性注册——(ii) 的触发持续性限定（与 1971-1990 事件编码同步
  注册）】(ii) 的无收敛观察窗要求信用下滑在窗内持续存在：观察窗起点 =
