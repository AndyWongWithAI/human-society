  尺度同一套预注册判据（该子网络内在任锚资产的信用下滑代理 + 该子
  网络内的 SOV/MOE 指标）编码为缩尺度体制切换。事件池初始清单（一次
  性注册，之后按 anti_talisman (6) 的 pre-commit 规则运作）：卢布区
  解体 1992-93 后各共和国储备重配；英镑区成员 1960s-70s 退出与储备
  转换；拉美美元化与逆美元化 episodes（如厄瓜多尔 2000、阿根廷多轮）；
  1997 亚洲金融危机后东亚储备重构。诚实标注：子全球事件的外部效度
  低于全球尺度（网络规模、候选集结构不同），检验结果对全球预测的
  传递打折——但这是把 (c)(d) 从"检验域为空"救回"可检"的代价。
  【r2 补注（RF-7）】池的分时代/分子网络代理映射、σ 计算口径与逐事件
  可编码性声明见 operationalization"在任储备资产信用下滑速度"的 r2
  注册段——卢布区行为腿当前不可编码悬置；≥5 门按可编码子集重估为
  "名义可满足、待首编码执行"；1971-1990（RF-6 编码后）进入本条慢速
  样本池。
  → 击穿 DED-028 的非线性 delta 预测在储备域的适用性。

  (d) 路径依赖赢家被推翻【交互级——最远承重】——在 ≥3 个独立急性信用
  下滑事件中（每个事件确认时存在 ≥2 个六维得分接近的候选——"接近"待
  储备域 rank/δ 协议注册后方可操作判定，见 operationalization 的 r1
  标记；事件取自 (c) 注册的含子全球代理的事件池），事后储备
  资产收敛方向（事件后 5 年跟踪）的胜出者【全部】都是事前六维得分最高
  的候选（无一例外由非最高分者胜出）。若统计上无法区分"最高分者每次
  都赢"与"路径依赖有时让非最高分者赢"→ 路径依赖交互效应不存在或太弱
