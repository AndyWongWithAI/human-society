    - anchor: "英镑→美元的储备资产体制切换（1914-1944）——缓慢下滑 + 单一显著候选"
      evidence: |
        在任者（英镑）的信用在 1914-1945 年间沿连续谱缓慢下滑：
        WWI 大规模债务积累（1914-1918）→ 金本位中止（1919-1925 浮动，
        1925 错误回归战前平价→高估→经常账户恶化）→ 1931 彻底脱钩金本位
        → WWII 再次大规模债务积累 + 帝国瓦解。信用下滑速度：慢→中速，
        跨越约 30 年（1914-1944），非单一离散事件触发。
        挑战者（美元）：单一显著候选——美国在 20 世纪初已是最大经济体，
        WWI 后成为净债权国，拥有全球最大黄金储备（1930s 达全球 ~70%），
        深度且流动性强的金融市场。六维适应性（在当时的全球金融网络特征下）：
        制度耐久性（政治稳定 + 联邦储备体系成熟度 1913+）→优；
        市场可接入性（纽约金融市场深度 + 资本账户相对开放）→优；
        政策可信度（金本位承诺直至 1933，1933 年美元对黄金贬值）→中。
        r1 撤回旧文"1933 后全球央行继续增持美元"——无据；1931 后的
        主导行为是清算外汇储备逃向黄金（见下）。
        【r1 重写——非单调实录（Eichengreen-Flandreau）】储备端的实际
        轨迹不是单调迁移：美元在 1920s 中期即超过英镑成为第一储备货币，
        英镑在 1930s 重新夺回领先——两大储备货币以接近份额并存并互换
        领先约 20 年；且 1931 英镑脱金后全球央行的主导行为是清算外汇
        储备整体逃向黄金（外汇占总储备比例大幅塌缩），而非增持美元。
