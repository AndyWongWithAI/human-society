  判为主导→(vi)(b) 预测非主权占优、与实际观测相符）。分支规则注册后
  （本注册选用读法二的机制依据——直接观测优先于代理），2022 对 (vi)
  按规则执行一次裁决、不得再调。在裁决完成前，2022 对 (vi) 记为活性
  张力——不享事前注册效力。r2 的"(vi) 方向核验通过"声明限定为 2011/2013
  两事件（此两事件不涉及 C3 离散事件类 vs 连续量的歧义，核验有效）。  → 击穿 DED-029 四因素泛化在候选差异化受益上的承重（预测 vi），
  不连带推翻 (i)(ii)(iii)(v)。

falsification_trace:
  primary_suspect: |
    DED-027 的射程扩展——从商品货币自发交换网络到现代主权储备配置域。
    DED-027 自宣射程明确排除"有法定货币/固定兑换率的制度干预"，其
    falsifiability 声明"现代法币体系不在射程内"。本推论将其六维物理筛选
    框架重标定为六维制度-市场适应性框架并应用于主权储备竞争——这是承重
    扩展但未经父推论验证。若六维重标定不能有效区分主要储备候选（如美元/
    欧元/人民币在重标定后的六维得分高度接近且趋于共移——所有主要经济体
    的制度和市场质量同步改善），则 DED-027 的筛选约束在本推论中失去
    区分力，预测 (i) 的方向性收敛退化为"谁已经在赢就继续赢"——与
    DED-027 的赢家通吃合并为同义反复（在位者因在位而赢）。
    诚实：BR-L2-021（DED-027 的承重砖）的六维框架的 IEA=2.4，物理事实
    确定性高，但本推论的制度性重标定未经 IEA 或等效多源验证。
    最先受检——若审查者判定此射程扩展不可接受，则预测 (i)(iv)(v) 的
    承重被大幅削弱，推论需降级或限定为"仅适用于商品货币式储备竞争
    （如黄金 vs 白银式的央行储备之争——但现代央行几乎不持有白银储备，
    此限定使推论实证射程趋近于零）"。

  secondary_suspect: |
    DED-028 向主权/机构层面的同构扩展——主权储备管理者与家庭部门存在
    本质差异：主权行为者受地缘政治约束（制裁风险、同盟义务）、制度 mandate
    （通胀目标、储备充足率要求）、信号效应（储备变动被市场解读为政策信号）。
    这些因素可能使主权 SOV-MOE 分化呈现出与家庭部门不同的模式——
    如地缘政治信号使央行"即使信用下滑也不愿公开减持盟友货币"，
    导致 SOV 逃逸在主权层面比家庭层面更慢、更隐蔽。
    如果主权 SOV 逃逸的幅度和速度在控制信用下滑程度后系统性低于家庭
    SOV 逃逸——不是否定 DED-028 本身（其对家庭的预测仍成立），而是
    否定"同构扩展"的有效性——则预测 (ii)(iii) 的跨层适用被削弱。

  unlikely_suspect: |
    DED-029 的四因素框架——E_network 伸缩的四条独立通道已在金价实证中
    有广泛文献支撑（虽 DED-029 自身未执行统计检验，但各 C_i 的方向性
    效应在金融经济学中有独立经验基础）。四因素向任意储备候选的泛化
    走的是 E_network 通道的结构同一性——只要 THEOREM-value-attribution
    的 V=(U+E)×S 结构对该候选成立（对任何资产均成立——价值三分是 L1
    定理），四因素就可通过 E 通道起效。此泛化的结构依据强于 DED-027
    的射程扩展。

excluded_outcomes:
  - outcome: "单一储备资产（如美元）的信用未下滑场景下的储备多元分散化"
    description: |
      即使在任资产信用稳定，央行也可能因"不把所有鸡蛋放一个篮子"的
      组合管理逻辑而进行边际多元分散化。这不是体制切换——体制切换的
      定义要求信用下滑作为迁移的发动机（E_network 在在任资产上收缩 +
      在挑战者上扩张）。无信用下滑下的组合再平衡不在本推论射程。
      区分判据：信用下滑速度代理（多代理综合）在多元分散化期间是否
      显著为负——若无信用下滑信号，则多元分散化是组合管理非体制切换。

  - outcome: "武力/殖民强制推行的储备货币替代"
    description: |
      若储备资产体制切换主要由军事征服/殖民强制推行（如二战后的美元
      霸权建立在布雷顿森林的制度设计 + 美国战后绝对经济军事实力之上），
      而非经由法币信用的内生下滑触发的自发网络效应收敛——则不在本
      推论射程。本推论覆盖的机制是"持有者因信心丧失而主动重新配置"，
      而非"被枪指着用某种货币"。此排除由事前可识别的强制指数（如
      驻军存在、条约义务、制裁威胁）判定，不依赖切换结果。

  - outcome: "主权货币联盟形成导致的储备资产合并（如欧元诞生）"
    description: |
      多国货币合并为单一货币（欧元 1999）使原各币种的储备资产统计上
      "消失"并合并——这不是"一个储备资产战胜另一个"的网络效应收敛，
      而是制度设计的"合并吸收"。合并后的新资产（欧元）的储备份额上升
      不是 E_network 收敛——是分母重组。此排除不构成逃逸门：货币合并
      是事前可独立识别的事件（欧元诞生有明确日期和成员国列表）。

  - outcome: "数字货币/CBDC 作为全新资产类别对储备资产竞争格局的根本重塑"
    description: |
      若 CBDC 或去中心化数字资产从根本上改变了"储备资产"的操作定义
      （如可编程货币使储备可被实时冻结/监控→所有主权储备候选均面临
      新型风险→六维适应性的维度本身需要重新定义），则本推论的六维制度
      重标定可能不再适用。此排除诚实标注射程边界：推论适用于当前制度
      框架（主权法币 + 黄金 + 有限数字资产）的储备竞争；若数字资产
      根本重塑竞争维度，需重新标定六维框架。

anti_talisman_clause: |
  【防不可证伪护身符——六项硬约束】

  (1) 判定"信用下滑"必须独立于"储备资产迁移"——不得因"观察到储备从
  美元向外迁移"就反推"美元信用必已下滑"。信用下滑必须由预注册的多代理
  （CDS 利差/通胀预期斜率/储备份额下降速率——至少两个同向确认）独立
  标定。储备份额下降速率作为代理之一与同侧的迁移指标存在概念重叠——
  硬规则（r1 升级）：纯外部代理（CDS 或通胀预期或事件类编码）必须位于
  同向确认腿之内为必要条件，储备份额代理不得参与自我确认。

  (2) 判定"六维适应性加权得分"时——每维得分须由独立于"谁是当前主导
  储备资产"的制度/市场指标测量（如央行独立性指数不依赖"该央行发行
  的货币是否是主要储备货币"——制度评估先于结果）。权重须从全球储备
  配置网络特征独立推导（同 DED-027 的 weight_protocol），严禁因"结
  果是美元持续主导"就倒推"制度耐久性权重必然最高"。重标定的六维得分
  须在不知储备份额走向的前提下完成 ranking——此为 DED-027 的
  anti_talisman (1) 的储备域对应物。

  (3) 判定"SOV-MOE delta"时——SOV 端（COFER 储备份额变化）与 MOE 端
  （SWIFT/BIS 结算/发行份额变化）须各自独立测量、不互相推导。不得因
  "储备端变了"就声称"结算端必然滞后"——滞后必须是两侧独立数据对比的
  结果。不得在观察结果后调整 delta 的基期或阈值——基期（信用下滑事件
  确认的季度）和阈值（SOV 指标的历史均值 +2σ）须在预注册阶段锁定。

  (4) 判定"路径依赖赢家"时——须先独立标定：(a) 事前六维得分排名
  （在急性事件发生前由独立制度/市场数据锁定，不得事后调整权重或维度
  使胜出者"恰好"得分最高）；(b) 急性事件的性质分类（制裁型/违约型/
  战争型——按事件触发日期的独立新闻报道和金融市场数据分类，不得事后
  按"谁赢了"来分类事件类型）；(c) 胜出者的路径标记（谁先获得首个大国
  央行的大额配置、谁在危机窗口中流动性最优——按公开央行公告和金融市场
  微观结构数据独立标定）。"路径依赖让非最高分者胜出"的反面是"最高分者
  每次都赢"——若数据无法区分二者（所有急性事件中最高分者恰都赢了），
  则预测 (iv) 未被证伪但也未被验证——诚实标注为"不可检验"而非虚报
  检验力。

  (5) 功能分化 vs 储备竞争——DED-027 的 anti_talisman (5)（TDO+MS
  判据）在储备域需重标定：若两种资产（如美元和欧元）在全球储备中均
  占高份额，需区分"在不同地缘/区域子网络中各自主导（功能分化/地理
  分区）"与"在同一全球网络中竞争同一储备资产角色（竞争）"。TDO 重标定
  为：两资产在同一地区央行储备中的共现频率与份额交叉弹性——若 A 份额
  的上升系统性伴随 B 份额的下降（高负交叉弹性、同一央行子集内）→竞争
  关系；若 A 和 B 在不同地区各自主导、互不侵蚀→分区主导。此判据独立
  于"最终只有一个全球主导者"的结果——可在任一截面上测量交叉弹性。

  (6) "急性下滑"的事件识别不得在事后挑选——必须使用 pre-commit 清单：
  所有满足预注册判据（事件类清单 + 行为腿 3σ，见 operationalization 的
  r1 重注册文本）的事件自动纳入"急性下滑事件池"——不满足的不准
  事后补入。事件池锁定后，预测 (i)-(iv) 的检验在该池上执行——
  不得因某事件的检验结果不理想而事后将其剔出池外。

regulator_variable_budget: |
  【r3 一次性注册——调节变量预算入账（RF-10，METHODOLOGY regulator_variable_budget 硬约束）】
  METHODOLOGY 规定每条 L4 至多引入 2 个调节变量（非从父推论继承、用于消化
  反例的变量）。r1/r2 两轮均未正式入账——现予一次性注册并锁定：
    调节变量清单（2/2 预算已耗尽）——
    ①【调节变量 1】网络连通性入格前提（r1 注册，消化战间期 1926-1944
      分区期双储备并存+领先互换）：当全球储备网络被货币集团/资本管制分割
      为互不侵蚀的子网络时，E_network 收敛预测不适用（连通性以
      anti_talisman (5) 的份额交叉弹性判据独立测量）。
    ②【调节变量 2】局域 vs 全局信用下滑限定（消化 1997 亚洲危机反向
      案例）：仅全局信用下滑（涉及在任储备资产发行者）触发体制切换；局域
      信用下滑（新兴市场本币崩塌）反而强化在任者（"逃向安全"）。
      预算状态：2/2 已耗尽。今后任何反例消化不得再引入新调节变量。若必须
      引入，按 METHODOLOGY 硬约束该推论的普遍性声称须条件化或反例重分类
      为净杀。
    ③【触发持续性限定词——裁定：继承而非新增调节变量】r2 注册的 (a)(ii)
      触发持续性限定词（无收敛观察窗要求信用下滑持续存在，触发逆转则截断）
      作者辩护为 DED-028/029 触发-响应结构的直接蕴含。r3 审查要求写死裁定
      ——现裁定：【认可为继承而非新增调节变量】。裁定依据：(a) DED-028
      原文的预测结构显式以"法币信用下滑"为条件——信用下滑消失则预测的
      前件消失，这是机制本身的对称蕴含，非新引入的消化变量；(b) DED-029
      原文的 excluded_outcomes 显式声明"两个以上因素同时变动时金价走向
      不在射程"——即 DED-029 自身也不声称在驱动量同时归零的位形有预测力。
      结论：持续性限定词不占用调节变量预算——其为父推论触发-响应结构的
      显式化（对称反向读），不是新增自由度。计入后总预算 = 2（①连通性 +
      ②局域/全局），不超额。
    ④【RF-8 合格挑战者前件——不入调节变量预算】RF-8 注册的"合格挑战者
      存在"前件走轴 A 操作化前提通道（定义性列前提，见 derivation 轴 A 与
      operationalization SF-5），不走调节变量通道——它是 DED-027 六维筛选
      机制本身的结构性前提（筛选需要存在可被筛选的对象），不是为消化特定
      反例而引入的 ad hoc 变量。不在此处计数。

real_world_anchors:
