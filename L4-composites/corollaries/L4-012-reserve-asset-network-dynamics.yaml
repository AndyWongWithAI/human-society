        且慢速 delta 绝对值小→测量噪声可能解释部分 apparent delta。"

  counterexamples:
    - case: "布雷顿森林体系（1944-1971）——美元的制度锁定而非网络效应收敛？"
      analysis: |
        布雷顿森林制度以美元为唯一黄金挂钩货币（$35/oz）→ 其他货币
        挂钩美元 → 创造了一个制度强制（非法定比价但近似——各国央行有
        义务维持对美元平价）使美元成为近乎唯一的官方储备资产。
        这是否构成对本推论"网络效应收敛"主张的反例——储备资产地位
        由制度设计（1944 年一次会议）而非 E_network 自发收敛决定？
        消化：(i) 布雷顿森林的制度设计本身是"网络效应收敛的结果已发生"
        之后的制度化——美元的储备地位在 1944 年之前已通过 1914-1944
        的市场收敛（见 supporting anchor 1）确立，布雷顿森林是"把已发生
        的事实写成法律"，而非"从零创造美元储备地位"。(ii) 体系存续 27 年
        后崩溃（1971 尼克松冲击）恰证明制度强制在长期无法对抗市场自发
        收敛——当美国通胀/财政赤字侵蚀美元信用（C2+C3），外国央行开始
        将美元兑为黄金（SOV 端的逃逸），最终制度崩解。(iii)【r2 改写——
        撤回旧读法】旧文把"崩溃后美元并未丧失储备资产地位"读作锁定
        （预测 v）的正面证据——误读：预测 (v) 说的是【新主导者】的
        E_network 越过主导阈值后、老霸主信用恢复亦不可逆转迁移的迟滞；
        1971 后没有任何新主导者越过阈值，(v) 的前件根本未满足，本案对
        (v) 无证据力。实情是：美元份额 1971-1990 大跌约 30pp 后，经由
        沃尔克信用重建（触发逆转）+ 无合格挑战者（马克/日元六维得分
        事前可标定地不接近美元）的合力才回升——美元主导的维持不是
        网络效应自动兜底的结果（完整编码与双路径消化见下一条
        1971-1990 反例条目）。
      status: "consumed_as_support —— 制度设计是收敛结果的制度化，非自发收敛的替代；r2 注：其(iii)旧读法已撤回，1971 后维持主导对预测 (v) 无证据力"

    - case: "1971-1990 美元份额大跌与 1990s 全额回升（约80%→约46-51%→约71%）——r2 补编码（RF-6，修选择性用锚）"
      analysis: |
        事件实录：布雷顿森林崩溃（1971-08-15 尼克松关闭黄金窗口）+
        1970s 大通胀 + 1978-79 美元危机（卡特债券发行、IMF 替代账户
        谈判——各国央行寻求减持美元有公开历史记录）。美元储备份额从
        1970s 初约 80% 跌至 1990-91 低点约 46-51%（马克升至约 18-20%、
        日元约 8-9%），随后 1990s 全额回升至 1999-2000 的约 71%。
        本事件在推论射程内、按自注册判据可确认为信用下滑期，r1 前全文
        未编码——r2 审查判定为选择性用锚，现予补编码（不挑口径）：
        (1) 信用下滑确认——多代理判据满足：通胀预期代理同向（1978 起
        密歇根调查高企；1978 前按 RF-7 的 T2 映射用实现通胀斜率）+
        储备份额 5 年滚动下降速率同向，纯外部代理位于确认腿内。
        1971-1980 确认为信用下滑期。
        (2) 事件类裁决——1971 尼克松关闭黄金窗口是事件类清单"选择性
        违约"的候选（对官方黄金兑换义务的单方面中止），按 anti_talisman
        (6) pre-commit 必须裁决、不得跳过：事件腿【过线】（公开官方
        公告日期独立标定）；行为腿（份额降幅 ≥3σ）待 RF-7 的 T2 口径
        σ 实算（1971 无 COFER，用 IMF 年报序列按年度口径）——急性资格
        悬置待实算，与 2022 同等待遇，过线与否均不得再调。
        (3) 档位记录——1978-1990 年均约 2-3pp 的份额下降在现注册下
        编码为"缓慢"（无已确认急性事件触发该段），但档位语义被拉伸
        （实为中速）——如实记录在案，稳定/缓慢/中速的量化边界仍待
        SF-4 处理。
        (4) 无收敛的双路径消化——1971-1980 近十年流量碎片化流向马克/
        日元/黄金而无收敛，字面上逼近 falsifiability (a)(ii)。两条
        消化路径并用，各附独立机制论证：
        路径一（六维筛选——事前可独立标定，不依赖事后结果）：马克/
        日元的六维得分【不】接近美元——德国央行与日本大藏省在
        1970s-80s 主动抵制本币国际化（公开政策记录：德国限制非居民
        购买国内债券、日本外汇管制延续至 1980 外汇法修订），资本管制
        压低 D3（市场可接入性），可投资资产供给窄压低 D1（可分性）/
        D5（同质性）。以上均由独立制度数据在不知储备份额走向的前提下
        可标定（符合 anti_talisman (2)），非由"美元最终维持"反推。
        六维筛选的预测恰是：无合格挑战者时不发生收敛式体制切换——
        碎片化分散是组合再平衡，不是收敛的中间态。此路径成立则本
        案例转化为六维筛选区分力的正面证据（DED-027 承重的支持项）。
        （诚实边界：此为基于制度事实的定性标定；严格量化打分仍待
        储备域 rank/δ 协议注册——"不接近"的定性判定由 D1/D3/D5 多维
        同向显著劣势支撑，与 SF-5 的支配序思路同构，不冒充已完成
        量化标定。）
        路径二（触发逆转——机制论证独立于本案结果）：1979-1985 沃尔克
        紧缩重建美元信用，触发逆转按多代理反向读确认（通胀预期回落 +
        实际利率大幅转正 + 份额止跌回升，纯外部代理在确认腿内）——
        驱动量消失则迁移中止（DED-028/029 触发-响应结构的直接蕴含），
        回流是触发消失后的中止回流，不是"收敛机制被证伪"。
        不利记账：路径二依赖的 (a)(ii) 持续性限定词系本案例被 r2 指出
        后补注册——按第 11 条，1971-1980 碎片化对方向收敛预测记为
        一次未遂张力（见 falsifiability (a) 的 r2 注册段），消化的
        主承重放在事前可独立标定的路径一上。
        (5) 时序方向——1970s 储备分散化（SOV）领先于结算重构（MOE：
        石油美元计价、欧洲美元市场的美元惯性极强）——方向支持预测 (ii)。
        (6) 编码后本事件进入 falsifiability (c) 的慢速样本池（+1）。
      status: "counterexample_digested —— 双路径消化（六维无合格挑战者
        [主承重、事前可标定] + 触发逆转[限定词按第 11 条不利记账]），
        路径一（SF-5 支配序判据注册并复核通过后方可反哺推论为六维区分力
        正面证据——当前为条件式消化，因合格挑战者前件系本案被消化后注册、
        按第 11 条不享追溯效力）；1971-1980 碎片化记为未遂张力；1971 急性
        资格与行为腿 σ 实算悬置，不得再调。"

    - case: "1997 亚洲金融危机后东亚央行大规模积累美元储备——'信用下滑'的反向案例"
      analysis: |
        危机后东亚央行不是逃离美元而是加速积累美元（预防性储备动机→
        增加而非减少美元配置）。这是否否定了"信用下滑→储备迁移"的
        方向预测？消化：亚洲金融危机不是美元信用的下滑——它是一次
        区域性的新兴市场货币信用崩塌（本币信用→0、美元信用→相对上升）。
        BR-L2-024 的连续谱是多币种的——当新兴市场法币信用下滑时，
        价值储藏逃入而非逃出美元（"逃向安全"flight-to-safety）。
        此案例揭示本推论的一个未显式建模的复杂性：法币信用下滑可以是
        局域的（某国/某区域货币的信用崩塌）而非全局的（储备货币发行国
        的信用崩塌）——全局信用下滑才触发储备体制切换，局域信用下滑
        反而强化在任储备资产。此判别在 operationalization 中需补充——
        信用下滑的"全局性"（是否涉及在任储备资产发行者）须独立判定。
      status: "counterexample_digested —— 揭示'局域 vs 全局'信用下滑的
        未建模区别，不击穿核心但限定适用条件：仅全局信用下滑（涉及在任
        储备资产发行者）触发体制切换。在 operationalization 中补充此限定。"

  boundary_cases:
    - case: "黄金作为储备资产的特殊地位——六维重标定的极限"
      analysis: |
        黄金在现代储备配置中是一种特殊存在：它没有发行者→六维适应性中
        D2（制度耐久性）和 D6（政策可信度）的概念不适用（没有发行人就没有
        制度风险，但也意味着没有收益、没有发行者 lender of last resort）。
        D1（可分性）受限于实体交割和存储成本；D3（便携性/市场可接入性）
        优（全球 24h 交易，深度好）；D4（可识别性/透明度）优（化验/审计
        成熟）；D5（同质性/标准化）优（标准化金条）。黄金的"无发行者风险"
        在 C3 触发（主权信用崩塌）和 C4 触发（地缘不确定性）时成为独特
        优势——但当 C1（实际利率上升→持有非生息资产机会成本上升）触发时
        是劣势。这使得黄金在"急性信用下滑+多候选"格中可能成为过渡性赢家
        （SOV 的临时安全港），但长期是否被有收益的主权替代候选挤出取决于
        替代候选的制度耐久性建立速度。本推论的六维框架在黄金上的维度缺失
        不是框架的失败而是诚实——框架必须容纳"不完美映射"的存在。
      status: "boundary_case —— 黄金考验六维重标定的完备性，在无发行者资产上
        部分维度不适用但方向预测仍可工作：黄金在 C3/C4 触发时占优（低机会成本
        环境下更突出），在 C1 反向触发时受压。此边界不构成证伪。"

    - case: "全球储蓄过剩（global savings glut）——非信用因素驱动的储备积累"
      analysis: |
        2000s 新兴市场的储备积累部分由经常账户顺差和干预外汇市场
        （抑制本币升值）驱动——这不是"因为信任美元所以买美元"的
        信心驱动 SOV，而是"因为要卖本币所以被动买美元"的干预驱动。
        这种非信心驱动的储备积累是否在框架内？消化：干预驱动的储备
        积累属于 MOE 端（外汇市场交易中美元是核心媒介货币）的惯性而非
        SOV 端（信心驱动价值储藏）的主动选择——它不反映 E_network
        扩张（央行不是"越来越信任美元"才买，是"需要买美元来卖本币"）。
        在此意义上，干预驱动的储备积累是 MOE 网络效应的表现（美元在
        外汇市场中的核心结算/媒介角色→被动吸储）——这符合而非违反
        DED-028 的 MOE 滞后机制：MOE 端的制度惯性（美元在外汇市场中
        的不可替代性）使即使在 SOV 信心缓慢下降时，储备总量中的美元
        份额仍可通过干预渠道维持。此边界案例位于 MOE 与 SOV 的测量
        重叠区——COFER 统计中的部分美元储备是"干预工具"（MOE）而非
        "价值储藏"（SOV），SOV 端逃逸可能被 MOE 端惯性在 headline
        COFER 数字中部分掩盖。操作化需在 SOV 指标中剥离被动干预成分
        （按汇率制度分类控制）或使用可区分主动配置与干预持有的更精细数据。
      status: "boundary_case —— 不击穿核心但揭示 SOV-MOE 测量在 COFER 中
        的交叉污染，需在 operationalization 中加强对被动干预储备的控制。"

discriminant_validity: |
  与本推论竞争的已知理论/框架的判别：

  (i) 相对最优货币区（OCA）理论 / 国际货币经济学标准框架：
  OCA 框架解释"何种货币会在国际交易中被使用"（网络外部性+交易成本+
  发行国经济规模/贸易份额），但它处理的是一般性的国际货币使用，不区分
  SOV（储备配置）和 MOE（贸易结算）的不同驱动机制和时序。本推论从
  DED-028 继承的 SOV-MOE 时序结构（储蓄先动、支付后滞）是 OCA 框架
  不提供的动态预测——OCA 预测货币的国际使用会随发行国经济体量缓慢变化，
  但不预测"储备配置端的变化领先于并大于结算端的变化"这一结构性时序。

  (ii) 相对"储备货币多样化"（reserve diversification）的标准政策文献
  （如 IMF 工作论文、Eichengreen et al.）：
  标准文献承认美元储备份额在缓慢下降、储备在向多元货币和黄金分散——
  但将其描述为"组合优化"（分散风险、追求收益）或"地缘政治驱动"
  （制裁恐惧）。本推论的独有可证伪预测不在"存在分散化趋势"（那已是
  共识），而在：(a) 分散化的时序结构——储备配置分散化（SOV）系统性
  领先于贸易结算分散化（MOE）；(b) 分散化最终收敛（在存在合格挑战者时）
  到单一新主导者而非永久碎片化——E_network 的赢家通吃在切换收敛期
  禁止按比例瓜分流量、终局收敛于单一主导者（此为收敛期动力学声称，
  非任何时点对第二名储备资产的静态垄断声称；无信用下滑期间的第二名
  共存属组合管理射程，见 excluded_outcomes 1）；(c) 急性信用下滑时的
  路径依赖赢家（不一定是得分最高的候选）。

  (iii) 相对"货币霸权衰落"文献（如 Kindleberger、Gilpin 的霸权稳定论）：
  霸权稳定论认为储备货币地位是霸权国提供公共品（开放市场、安全保护）
  的副产品，霸权衰落→储备货币地位衰落。本推论的独有增量在：(a) 提供
  了从霸权衰落到储备货币地位丧失的【机制链】（信用下滑→SOV 先迁移→
  E_network 在挑战者上收敛→锁定——不只是"霸权衰了所以货币衰了"）；
  (b) 迟滞预测——霸权衰落可以逆转（如美国财政整顿、重建信用），但
  储备资产的 E_network 收敛一旦完成不可逆转——与霸权稳定论的对称假定
  （霸权恢复→货币地位恢复）不同。

  防平凡化守卫——
  本推论的非平凡内核不在"储备资产会变"（那已是国际货币经济学的常识），
  而在：(a) 变化有结构性时序（SOV 先、MOE 后，由机制差异保证）；
  (b) 变化的方向由六维适应性 + E_network 收敛共同决定（非线性加权、非
  简单组合优化）；(c) 多候选得分接近 + 急性信用下滑时，赢家由路径依赖
  决定（非事前最优者的线性必然）；(d) 一旦锁定迟滞生效，信用恢复不可逆
  转网络效应。去掉这四件，本推论坍缩为"储备货币地位会随信用变化而改变"
  ——那已是常识，不需要 L4 合成。

review_summary: |
  1) r1 needs_revision（5 required + 4 should），status 保持 candidate
  2) 合取涌现成立（格 3/5 双父合力扎实、诚实声明段全库最规范之一），但五处 required：急性判据在 2022 旗舰锚上走未注册的"定性制度断裂"逃逸路径（L4-009 判例反向裁决，2022 暂不计急性）；δ/储备域 rank 协议未注册（轴 A 与预测 iv 不可操作）；两处锚点事实错（人民币 COFER 实为 2.9%→2.2% 方向反了、战间期美元英镑领先互换 20 年未消化）；DED-029 在已注册预测集内近观众砖（C1/C4 与触发类型无被测着陆点）；falsifiability (c)(d) 的 ≥5/≥3 事件门在全球尺度检验域为空。修复后定论上限预标 verified*（六维重标定桥未经独立验证悬案）
