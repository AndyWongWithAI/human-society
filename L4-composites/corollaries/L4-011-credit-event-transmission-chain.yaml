id: L4-011
type: composite_deduction
layer: L4-composites
deduction_form: composite
status: rejected
term: "主权信用事件的储蓄端传导链 (Savings-Side Transmission Chain of Sovereign Credit Events)"
claim_type: trajectory_prediction

人话摘要: "当一个大国储备资产被冻结（≥全球储备1%），钱跑的路线是可预测的——央行先动（换黄金、调结构），老百姓后跟（买金条金币），最后金价重估。这不是大家同时慌，是央行反应最快（管着国家储蓄的），信号慢慢散开后私人投资者才跟上。2022年冻了俄罗斯3000亿，这条链就走了一遍。"

statement: |
  【Composite claim】
  当储备资产对手方风险被公开证实（冻结/排除结算，量级 ≥ 全球官方外汇储备 1%），
  储蓄端（SOV 域）配置迁移沿一条可预测的三环节传导链展开：
  (I) 官方部门先行——央行购金与储备结构调整最先启动，因其管理的国家储蓄
  无任何法律缓冲（DED-028 的 SOV 机制），且对对手方风险有信息与制度优势；
  (II) 市场认知扩散——私人部门（金条金币/ETF）的黄金需求以可测滞后跟随，
  滞后源于认知扩散需要时间（BR-L2-024 的记忆通道：私人投资者需看到官方信号+
  媒体叙事+同群行为才将认知转化为配置行动）；
  (III) 体制性重定价——金价在累积需求推动下发生结构性位移，此位移不是
  瞬时套利式一跳，而是随三环节逐次激活的多季度跨年过程。
  三环节的传动方向是固定的（官方→私人→价格），且该方向是结构性保证而非经验巧合——
  因为最先响应的环节（官方 SOV）恰好是信息最敏锐且无法律缓冲的环节，
  最后响应的环节（价格）恰好需要累积需求的确认。

  【触发二值化】
  触发事件的判据二值化，不走 L4-009 的四指标复合判据路径：
  单一判据——"受影响主权方的央行资产负债表内储备资产被冻结/排除结算，
  且其量级 ≥ 当年全球官方外汇储备总额（IMF COFER 含未分配）的 1%"。
  事件发生 = 触发 ON；否则 OFF。二值化的机制理由：对手方风险从"抽象尾部风险"
  变为"公开证实事实"是类别翻转而非连续读数——储备管理者对"我的储备也可能被冻"
  的评估在事件前后是二态跳跃（从理论可能 → 实际先例），不沿连续谱平滑移动。
  量级限定（≥1%）的机制理由与 L4-009 共享（演示效应："下一个可能是我"的强度
  取决于受害方与重估者的量级相似度），但 L4-011 不设 (a)(b)(d) 的复合判据——
  单 (c) 类事件即构成触发，因为传导链预测的是"事件发生后储蓄端配置的时序响应"，
  不是"是否进入了某种体制"。

  【Epistemic status——诚实声明】
  三环节传导链的主张当前由机制论证支撑（DED-028 的 SOV 无缓冲时序 +
  DED-029 的 C3 通道方向 + BR-L2-024 的认知扩散机制），裁决性统计检验
  （事件研究法检验三环节时序显著性、格兰杰因果检验官方需求→私人需求）
  尚未执行。2022 年俄储备冻结是首个满足窄口径 ≥1% 且黄金市场数据完备的
  现代事件——仅此一个全数据事件窗口（1979 伊朗冻结虽有金价数据但私人部门
  金条金币需求的季度拆分不可得），统计功效极低。诚实声明：当前置信度受限于
  N=1 的现代完整样本；每增加一个未来触发事件，检验力翻倍。

  【Parent mechanisms】
  DED-028 给时序结构与"谁先动"——SOV 无法律缓冲、对信用变化最敏感，
  信用下滑时价值储藏先逃逸；这解释了为何官方部门（管理国家储蓄/储备 =
  SOV 功能）先于私人交易者（日常仍用法币 = MOE 功能）启动配置迁移。
  但 DED-028 只在 SOV vs MOE 的二分上给出先后——它不区分 SOV 域内
  的不同行动者（官方 vs 私人储蓄者谁更先动），也不指定 SOV 迁移的目的地。
  DED-029 给传导方向与目的地——其 C3 通道（法币信用↓→非主权价值储藏↑→
  金 E_network 扩张）指定了迁徙的目的资产是黄金（而非广义的"实物资产"）。
  但 DED-029 只做单因素方向预测，不区分需求来源（央行购金 vs 私人购金）
  及其时序先后。
  BR-L2-024 给认知扩散的微观行为基础——法币信用在连续谱上的位移 +
  记忆滞后效应（经历过信用崩塌的 Agent 永久性增持非法币资产），
  这为"私人部门不是立即跟进而需认知扩散时间"提供了行为机制支撑。
  但 BR-L2-024 是 L2 桥接层，不单独产出可检验的链式时序预测。

  【Emergent property】
  涌现类型声明：conjunction（合取级薄涌现）——两条 L3 父推论的独立机制
  （DED-028 的时序 + DED-029 的方向）在同一对象（储蓄端配置迁移）上
  并行运作，合成产生三环节传导链；BR-L2-024 提供认知扩散的辅前提。
  各父机制之间不存在机制互相修改——DED-028 的"无法律缓冲端先动"在传导链中
  照常运作，DED-029 的"C3→金 E_network 扩张"同样照常运作；L4-011 的增量
  不在修改这些机制，而在：(a) 将"SOV 域"细分为官方/私人两个行动者层级；
  (b) 断言二者的响应有固定时序（官方→私人，不由单父推出）；
  (c) 二值化触发判据替代连续谱触发。
  合成逻辑：DED-028 的时序（SOV 先动）× DED-029 的方向（去黄金）×
  BR-L2-024 的认知扩散（私人滞后）= 三环节传导链。
  任何单条 L3 都只描述一个截面——DED-028 不讲目的地、DED-029 不讲行动者
  时序、BR-L2-024 不讲具体资产方向。
  置信度天花板：两条 L3 父推论均为 verified（CAP=3），BR-L2-024 为 verified
  → 本条状态天花板 verified/verified*（按合取级分档规则，emergence_type =
  conjunction → 薄涌现验证 → status 天花板 verified）。

  【Prediction】
  (i) 官方先行——触发事件发生后 0-4 季度内，全球央行净购金量（WGC 季度统计）
  出现统计显著的上跳（相对于事件前 8 季度均值的 ≥1σ 偏离，且方向为正）。
  (ii) 私人跟进——私人金条金币+ETF 需求（WGC 季度统计，独立于央行购金数据源）
  的季度峰值出现在官方购金季度峰值【之后】至少 1 个季度（预测 τ ≥ 1Q）。
  (iii) 体制性重定价——触发事件发生后 8 季度内，金价（LBMA PM fix）的
  累计涨幅统计显著大于"无非事件基线期"（取事件前 8 季度）同长度窗口的
  累计涨幅分布（单尾检验，α=0.05）。且该价格位移的时机与官方+私人的
  累积需求时间序列一致（格兰杰因果：累积需求→价格，F 统计 p<0.05）。
  (iv) 逐格判空——"触发事件发生 + 官方购金无显著上跳 + 私人购金与金价
  仍按三环节链运行"该格预测为空：若官方环节被跳过而私人→价格链仍启动，
  则三环节链的"官方先行"环节被证伪（触发→私人自启替代路径存在）。
  (v) 时序不可逆——在任何满足触发条件的事件窗口中，私人购金季度峰值
  系统性领先于官方购金季度峰值的概率应不高于随机水平（等价于预测 (ii)
  的符号一致性检验的 p 值面）。

# === 规则 A：操作化定义 ===

operationalization:
  trigger_event:
    definition: |
      【自变量/二值触发】受影响主权方的央行资产负债表内储备资产被外国政府/
      国际机构冻结或排除出主要结算体系（SWIFT/CHIPS 等），且冻结/排除资产量级
      ≥ 当年全球官方外汇储备总额的 1%。
      二值变量——事件发生=1，未发生=0。不设中间灰区（连续触发被 L4-009 判例
      证明易死于事后口径选择——二值化是吸取该教训的显式设计选择）。
    measurement: |
      分子：受影响主权方央行资产负债表内被冻结/被排除的储备资产（窄口径——
      主权财富基金、政府其他实体的资产不计入）。口径机制理由：传导链的启动者
      是各国储备管理者（央行），其重估对象是自身储备资产的对手方属性——
      主权财富基金被冻结演示的是"政府海外资产有风险"而非"央行储备资产会被冻"，
      不对储备管理者的风险评估产生同等的演示效应。
      分母：当年 IMF COFER（Currency Composition of Official Foreign Exchange
      Reserves）全球官方外汇储备总额（含已分配 allocated + 未分配 unallocated）。
      数据源：冻结/排除公告（官方声明、SWIFT 通知、OFAC/欧盟官方期刊），
      IMF COFER 年度与季度数据库，各国央行资产负债表年报。
      预注册事件清单（继承 L4-009 的 (c) 判据编码工作，按窄口径复核）：
      - 1971 年美元停兑黄金 ✓（系统锚货币本身，全球持有者受影响，量级平凡满足）
      - 1979 年美冻结伊朗央行资产 ≈$12B/全球储备约 $0.4T≈3% ✓
      - 1982 年英冻结阿根廷在英资产（马岛，≈$1.4B/全球储备≈$0.4T≈0.35%）✗
      - 1990 年美英冻结伊拉克政府资产（<<1%）✗
      - 2003 年伊拉克战后资产没收（<<1%）✗
      - 2011 年利比亚 CBL 资产冻结：窄口径最不利上限≈$90B（央行海外存放，
        不含 LIA 主权基金≈$60-70B）/全球储备≈$10.2T≈0.88%<1% ✗
      - 2011 年叙利亚央行冻结（<<1%）✗
      - 2012 年伊朗银行 SWIFT 除名（无新增冻结量级，<<1%）✗
      - 2018 年伊朗央行 Bank Markazi 被排除出 SWIFT（<<1%）✗
      - 2019 年美冻结委内瑞拉政府资产+英央行拒还存金（≈0.07%）✗
      - 2021 年美冻结阿富汗央行 DAB ≈$7B（≈0.05%）✗
      - 2022 年 G7 冻结俄央行储备 ≈$300B/全球储备≈$12T≈2.5% ✓
      触发事件编码表（1971-2024）：1971-1980 触发 ON（含 1971+1979 两次事件，
      复合触发窗口）；1981-2021 触发 OFF（无过线事件）；2022-2024 触发 ON。
    limitations: |
      1971 年美元停兑黄金与 2022 年俄储备冻结性质不同——前者是锚货币的
      制度承诺被撤回（全体储备持有者受影响），后者是特定主权方的资产被冻结
      （演示效应）。将二者归为同一"触发 ON"状态可能掩盖其传导链的幅度差异。
      但 L4-011 的核心预测是传导链的方向与时序（定性结构），非幅度——
      两种事件均可检验"官方→私人→价格"的时序方向。
      1971-1980 为复合触发窗口（1971+1979 两次事件叠加），无法归因到单一事件；
      1981-2021 四十年无触发事件（长空白期使 N 极低）。
      窄口径继承自 L4-009 的校准且经五轮审查存活，但 2011 利比亚的 0.88%
      读数距 1% 线仅 0.12pp——若后续独立核数发现央行海外存放超过此前估计，
      利比亚可能过线 → 2011 年转为触发 ON → 2011-2013 金价 −28% 将成为
      本推论的活反例（触发 ON 在金价大跌之前，传导链预测相反）。
      这是本推论的 primary_suspect 的核心承重点。

  official_gold_demand:
    definition: |
      【传导链第一环节/中间变量】全球央行部门（含中央银行与准主权储备机构）
      的净黄金购买量——操作化为 WGC 季度央行净购金数据（Gold Demand Trends,
      Central Banks & Other Inst. 类别）。
    measurement: |
      数据源：WGC Gold Demand Trends 季度报告，央行净购金（吨）系列。
      备选：IMF IFS（International Financial Statistics）各国央行黄金储备
      月度变动加总——但 IFS 数据有报告滞后与口径不一致（部分央行按市值重估
      而非实际交易量报告），WGC 的 dedicated central bank survey 优先。
      基线窗口：触发事件前 8 个季度的央行季度净购金均值 μ 与标准差 σ。
      上跳判定：触发事件后连续 2 个季度中至少 1 个季度购金量 ≥ μ + 1σ。
      【不得用金价反推】——购金量必须来自 WGC/IMF 独立数据源。
    limitations: |
      央行购金数据有报告滞后（部分央行延迟 1-2 季度报告，WGC 用估算填补）；
      不披露购金量的央行（如中国人民银行在 2015-2022 年间未公开增持数据）
      造成低估——但若低估是系统性的（非仅在触发事件后出现），不影响"上跳"的
      相对变化方向（除非央行在事件后系统性地更多隐藏购金——这本身是支持预测
      的信号但无法用公开数据捕获）。
      1971 年与 1979 年事件无 WGC 季度数据（WGC 系列始于 2010）→ 这两次
      历史触发事件的 Link 1 检验只能用 IMF IFS 年度数据或历史研究替代。

  private_gold_demand:
    definition: |
      【传导链第二环节/中间变量】私人部门的黄金投资需求——操作化为 WGC 季度
      金条金币需求（Bar & Coin）与黄金 ETF 净流入的合计（吨）。
    measurement: |
      数据源：WGC Gold Demand Trends 季度报告，Bar & Coin + ETFs & similar
      产品类别（二者合计为私人投资性黄金需求）。
      基线窗口：同 official_gold_demand 的前 8 季度。
      峰值识别：触发事件后 0-12 季度内，取私人季度需求的最高值所在季度
      t_private_peak。同窗口内取官方季度需求的最高值所在季度 t_official_peak。
      时序检验：τ = t_private_peak − t_official_peak（以季度为单位）。
      预测 (ii) 要求 τ ≥ +1（即私人峰值严格晚于官方峰值至少 1 个季度）。
      【数据源独立于官方购金】——WGC 将央行购金与私人金条金币/ETF 分表统计，
      数据采集路径不同（央行调查 vs 加工商/零售商/ETF 发行商报告）。
    limitations: |
      ETF 需求受金融市场情绪驱动，可能与官方购金的"认知扩散"机制不同——
      ETF 投资者（机构、高频交易者）对新闻的响应速度可能快于金条金币购买者
      （家庭、零售投资者），导致 τ 的测量对"私人需求"的子类别构成敏感。
      在敏感度分析中拆分为"ETF 需求 τ_ETF"与"金条金币需求 τ_bar"两个子 τ，
      预测私人金条金币的 τ_bar ≥ τ_ETF（即零售滞后 ≥ 机构滞后）。
      WGC Bar & Coin 数据在 1970 年代不可得——1979 年事件窗口的 Link 2
      无法用季度数据检验。

  gold_price_response:
    definition: |
      【传导链第三环节/被预测量】金价的体制性位移——不要求预测具体点位，
      只预测"触发事件后 8 季度内的累计价格位移显著大于基线同期窗口"。
    measurement: |
      数据源：LBMA Gold Price PM Fix（美元/盎司），日频→季末值。
      基线：触发事件前 8 季度的季度价格变动率分布（均值 μ_ret，标准差 σ_ret）。
      检验窗口：触发事件后 8 个季度。
      体制性重定价判定：(a) 后 8 季度累计涨幅 > μ_ret + 1.645σ_ret
      （单尾 α=0.05），且 (b) 官方+私人累积净需求（吨）对金价季度变动率的
      格兰杰因果检验在 p<0.05 水平显著（即累积需求格兰杰-导致价格，而非反之）。
      【不得用金价是否为"历史新高"判定系统性重定价】——"历史新高"含通胀与
      长期趋势，与传导链的重定价概念不同。金价必须相对自身基线行为显著位移。
    limitations: |
      8 季度窗口可能太短无法捕获完整重定价（若认知扩散极慢）；也可能太长
      纳入其他无关冲击。窗口长度 8 季度为首次注册，事后不调——
      若未来事件显示重定价在 8 季度后才完成，此为本条窗口选择误差，非证伪。
      格兰杰检验的效度依赖样本量——单次事件（N=1 窗口）的格兰杰检验无意义，
      需积累至少 3 次触发事件后方可执行。

  transmission_lag:
    definition: |
      【复合被预测量】官方购金季度峰值与私人购金季度峰值之间的滞后 τ
      （以季度计），预测 τ ≥ +1。
    measurement: |
      τ = argmax_q(private_demand[q]) − argmax_q(official_demand[q])，
      其中 q 遍历触发事件后 0-12 季度。若峰值不唯一（平台型），取首个峰值。
      【不得】用移动平均平滑后的序列取峰（平滑会使滞后读数偏向零）。
    limitations: |
      峰值识别对单季度噪声敏感——若官方购金因单季度大单而出现孤立尖峰、
      私人购金在远期因不相关因素出现更大的尖峰，τ 被拉大但非由传导链驱动。
      缓解：在 τ 计算前对两序列做 2 季度滚动和（非移动平均——滚动和不改变
      序列的时间对齐）以压平孤立噪声尖峰。此处理为预注册——事后不调窗口宽度。

# === 推导链 ===

derivation:
  from_l3:
    deductions: [DED-028, DED-029]
  from_l1:
    axioms: [AXIOM-001, AXIOM-002]
    theorems: [THEOREM-value-attribution]
  from_l2:
    bridging: [BR-L2-022, BR-L2-024]
  from_l4: []
  steps: |
    1. 父机制摘要
       DED-028（价值储藏-交易媒介解耦动力学）：SOV 无法律缓冲→信用下滑时
       最先迁移；MOE 有法律强制缓冲→滞后崩塌。SOV 与 MOE 的时序分化是结构性
       保证（由功能机制差异驱动，非经验巧合）。但 DED-028 只给"SOV 先于 MOE"
       的二分时序——不区分 SOV 域内的不同行动者（官方储备管理者 vs 私人储蓄者），
       也不指定 SOV 迁移的目的资产类别（金/外汇/房产/其他实物资产均可）。
       DED-029（金价单因素驱动）：金价波动由 E_network 驱动（V≈E×S），四引擎
       中 C3（法币信用）单独变动时——法币信用↓→非主权价值储藏需求↑→金
       E_network 扩张→金价↑。C3 通道指定了方向（信用下滑→金需求上升）和
       目的地资产（黄金）。但 DED-029 只给方向——不区分"谁在买"（央行 vs
       ETF vs 私人金条）、不涉及时序（是同时买还是先后买），且 C3 在连续谱上
       运作，无二值化触发判据。
       BR-L2-024（法币信用的连续可逆性与记忆滞后）【辅前提】：法币信用是连续谱
       非二值开关；信用崩塌后恢复不完全（记忆滞后——经历过崩塌的 Agent 永久
       增持非法币资产）。这为传导链的 Link II（私人跟进）提供了行为微观基础：
       私人投资者的认知转变需要"看到+相信+行动"三个步骤——记忆通道（亲眼见证
       或媒体报道信用事件）→认知更新（"法币储备不再绝对安全"）→配置行动
       （购买黄金）。该认知扩散需要时间，故私人需求滞后于官方需求。

    2. 交互逻辑——两机制如何合成三环节链
       DED-028 的"无法律缓冲端先动"原则指定了【绝对时序】：在信用下滑场景中，
       任何处于 SOV 功能位置的主体都比处于 MOE 功能位置的主体先动。
       DED-029 的 C3 通道指定了【方向与目的地】：信用下滑触发的储蓄迁移流向
       黄金（非主权、无对手方风险的价值储藏）。
       BR-L2-024 的认知扩散机制指定了【SOV 域内的相对时序】：在 SOV 域内，
       信息最敏锐的官方部门（央行——全天候监控全球储备风险、有情报网络、
       有专职团队分析对手方风险）最先完成认知更新与配置行动；私人部门
       （分散的家庭与机构投资者——依赖媒体叙事、同群信号、财务顾问建议）
       需要额外时间完成认知扩散→配置行动的三步链。
       交互不是并行运作的独立压力叠加——是【同一触发事件】依次激活三个环节：
       (a) 事件 → 官方认知（即时——专职团队监控）→ 官方配置（购金/调结构）；
       (b) 官方配置的信号（WGC 季度报告、媒体解读"央行在买金"）→ 私人认知
          （"连央行都在买，是不是出大事了"）→ 私人配置（金条金币/ETF）；
       (c) 官方+私人累积净需求→争夺存量（卖家沿保留价格分布上移）→金价重估。
       环节之间不是"同时在场"而是"序贯触发"——前一个环节的【可观察输出】
       （央行购金数据、金价初涨）是后一个环节的部分输入。
       这区分了 L4-011 与"信用事件→大家同时买金"的朴素叙事。

    3. 涌现论证
       单用 DED-028：知道 SOV 先动于 MOE，不知道动去哪（金？外汇？房产？），
       不知道 SOV 域内谁先谁后（央行和私人储户都在 SOV 域），不知道触发条件
       是什么（信用谱上哪一点算"开始滑了"不明确）。
       单用 DED-029：知道信用↓→金↑，不知道是同时买还是先后买，不知道
       触发条件（C3 是连续驱动量，无事件边界）。
       单用 BR-L2-024：知道认知扩散需要时间，不知道扩散什么信号（哪个资产）、
       不知道扩散从谁到谁。
       合成后出现三个任何单父推论都没有的结构特征：
       (a) SOV 域内的行动者分层——官方-私人的时序先后是 DED-028 的机制逻辑
          （无法律缓冲端先动）向 SOV 域内部的延伸——在 SOV 内部，"信息敏锐度+
          制度能力"充当了亚层排序机制。DED-028 原文不涉及此亚层排序。
       (b) 三环节序贯触发——不是"信用下滑→同时发生 A 和 B"，而是信用事件的
          可观察信号沿三个环节逐次传递。这需要父推论之外的附加结构（环节间
          的 causal link 方向锁定）。
       (c) 触发二值化——将 DED-028/029 的连续驱动量替换为二值事件判据，
          使传导链的检验从"相关性是否随连续变量变化"转为"事件前后是否出现
          可识别时序模式"。这是方法论层面的涌现（改变了检验的靶子类型）。

    4. 多父逐格判空
       笛卡尔积：DED-028 轴（SOV / MOE）× DED-029+触发轴（信用事件 ON+C3 /
       信用事件 ON+C3 非主导 / 信用事件 OFF+C3 活跃 / 信用事件 OFF+C3 沉寂）
       × 行动者轴（官方 / 私人）。共 2×4×2 = 16 格，以下标注关键格：

       招牌空格（emergent / novelty）为格 [SOV, 信用事件 ON, 官方] 与格
       [SOV, 信用事件 ON, 私人] 之间的时序关系——即两格不仅各自非空且存在
       "官方格先填充、私人格后填充"的序贯模式——该序贯本身是 L4 的独有预测
       （任何单父推论不预言两格间的时序方向）。

       格归属详表（以下标注每格封装的预测由哪条父推论或哪几条组合强制）：

       格 A [SOV, 信用事件 ON+C3, 官方] = 官方购金先行
       → 需 DED-028（SOV 无缓冲→先动）+ DED-029（C3→去黄金）+ BR-L2-024
         （认知机制：官方信息优势→最先完成认知→配置）。【3 父合力格】
       → 单 DED-028 不指定目的地（去黄金还是去其他资产未知）；
         单 DED-029 不区分行动者（不区分官方 vs 私人购金）；
         二者合力才推出"官方购金先行"的非平凡预测。
         【招牌子格之一】

       格 B [SOV, 信用事件 ON+C3, 私人] = 私人购金滞后跟随
       → 需 DED-028（SOV 域内私人也需迁移）+ DED-029（C3 方向）+
         BR-L2-024（认知扩散需要时间 → 滞后期）。【3 父合力格】
       → 单 DED-028 只说 SOV 会迁移，不说私人会跟在官方后面而非同时；
         单 DED-029 只说信用↓→金↑，无时序。
         【招牌子格之二】

       格 C [SOV, 信用事件 ON+C3 非主导, 官方] = 官方 SOV 迁移至非金资产
       → 需 DED-028 即可强制。【单父格——DED-028 覆盖】
       → DED-029 的 C3 在此格为弱/沉默（金非主要目的地），预测由 DED-028
         单独给出。

       格 D [SOV, 信用事件 ON+C3 非主导, 私人] = 私人 SOV 迁移至非金资产
       → 需 DED-028 即可强制。【单父格】

       格 E [SOV, 信用事件 OFF+C3 活跃, 官方] = 无信用事件时官方购金
       → 需 DED-029 即可强制（C1/C2/C4 驱动官方购金）。【单父格】
       → 如 2011-2013 新兴市场央行常态化补库存——无对手方风险事件，
         C3 非主导，购金由其他引擎驱动。

       格 F [SOV, 信用事件 OFF+C3 活跃, 私人] = 无信用事件时私人购金
       → 需 DED-029 即可强制。【单父格】

       格 G [SOV, 信用事件 OFF+C3 沉寂, 任何行动者] = 空——基线无动作。
       【单父共通——无任何父推论在此格预测非空】

       格 H [MOE, 信用事件 ON+C3, 私人] = MOE 域晚期黄金恐慌
       → 需 DED-028（MOE 最终崩塌）+ DED-029（C3 方向）。
         【2 父合力格】——DED-028 单独不讲金，DED-029 单独不讲 MOE 崩溃时机。
         诚实声名：此格属 L4-011 预测的边缘拓展，非传导链核心环节——
         传导链核心只在 SOV 域的三环节。

       格 I [MOE, 其余组合] = 空或单父可判（DED-028 覆盖 MOE 行为，
       DED-029 覆盖非事件期的 MOE 侧黄金需求）。不构成涌现贡献。

       逐格判空结论（核心贡献）：16 格中至少 2 格（格 A 与格 B）需 3 父合力、
       至少 1 格（格 H）需 2 父合力，且最关键的是【格 A→格 B 的序贯关系】
       （官方格先于私人格被填充）不在任何单父推论射程内——此为 L4 的涌现签名。

# === 涌现证明 ===

emergence_demonstration:
  emergence_type: conjunction
    # 合取级薄涌现：DED-028 的"无法律缓冲端先动"+ DED-029 的"C3→金"+
    # BR-L2-024 的认知扩散 = 三环节传导链。各父机制独立运作、不互相修改
    # 运作条件——DED-028 的 SOV 先动不因金是目的地而改变，
    # DED-029 的 C3 通道不因行动者是官方还是私人而改变。
    # 合成产生的新结构（三环节序贯链+行动者时序）不在任何单父推论中。

  necessity: |
    逐一移除每条父推论，L4 的结论无法成立：
    - 移除 DED-028 → 失去"谁先动"的结构性理由。官方先行的预测退化为
      "央行可能信息更灵通所以先动"的经验揣测，而非结构性保证（SOV 无法律缓冲
      →储蓄端配置者对信用变化最敏感→最先重新配置）。三环节链失去环节排序的
      机制基础，退化为"可能官方先动、也可能同时、看情况"的弱命题。
    - 移除 DED-029 → 失去传导方向与目的地。不知道储蓄逃离后去哪个资产——
      金？瑞郎？不动产？比特币？传导链退化为"储蓄端有配置迁移、可能分先后"，
      但无法指定观测哪个市场来检验。且 C3 通道的"信用→金"方向是整个传导链
      的承重轴——若无此轴，链只剩空的时序壳而无内容。
    - 移除 BR-L2-024 → 失去认知扩散的微观行为基础。私人部门为何滞后于官方
      部门——是因为"需要时间看到+相信+行动"还是因为"钱没到位"或"不相关"？
      无 BR-L2-024 的记忆/认知机制，私人滞后退化为无解释的 stylized fact，
      无法断言"滞后是结构性的（认知扩散必须时间）"而非"这一次碰巧滞后了"。
      但 BR-L2-024 为辅前提（非 L3 父推论），其移除不直接使 L4 结论完全崩塌——
      传导链的形式结构（三环节+时序）仍可由 DED-028+DED-029 推出，只是
      失去"滞后是结构性"这一强化主张。故以辅前提身份承重低于两条 L3 父推论。

  novelty: |
    L4-011 的下列核心命题不被任何单条父推论包含，也不是父推论 AND/OR 的拼接：
    (a) "触发事件后，官方购金需求与私人购金需求之间存在固定的时序先后
       （官方先行，私人跟随，滞后 ≥1 季度）"——
       DED-028 只说 SOV 先于 MOE——官方与私人【都在 SOV 域内】，DED-028
       无法排序它们。DED-029 只给方向——"信用↓→金需求↑"，不区分需求来源
       的时序。二者 AND—"SOV 先于 MOE" AND "信用↓→金↑"——推出的是
       "金需求在 SOV 迁移期上升"而非"官方需求→私人需求的序贯传导"。
       从"共同原因（信用事件）→两个后果（官方购金+私人购金）"到
       "信用事件→官方购金→私人购金"这一步是因果链方向的重述——父推论
       给的是一因多果，L4 断言的是因果链内的一果→另一果。
    (b) "触发条件可二值化为'≥1%全球储备的对手方风险证实事件'"——
       这不是任何父推论的断言。DED-028 用信用下滑速度（连续量），DED-029
       用 C3 作为连续驱动量，BR-L2-024 是连续谱。二值化的机制理由（类别翻转：
       从理论可能→公开证实）属 L4-011 自建的方法论选择。
    (c) "SOV 域内存在行动者分层——官方部门因信息与制度优势构成 SOV 域内
       最先响应层"——DED-028 不涉及 SOV 域内部分。这是 L4-011 在 DED-028
       的机制逻辑（无法律缓冲→先动）基础上增加了一层内部排序维度——其排序
       标准（信息+制度优势）非 DED-028 原文所有，属 L4 的扩展论据。

  multi_parent_cells: |
    在 SOV/MOE × 信用事件状态 × 行动者的 16 格笛卡尔积中：
    格 [SOV, 信用事件 ON, 官方] 需 DED-028 + DED-029 + BR-L2-024 合力
    （DED-028 给 SOV 先动 + DED-029 给金方向 + BR-L2-024 给认知基础）。
    格 [SOV, 信用事件 ON, 私人] 同上需 3 父合力。
    格 [MOE, 信用事件 ON, 私人] 需 DED-028 + DED-029 合力。
    其余 13 格为单父可判（DED-028 或 DED-029 单独强制）或空格。
    ≥2 父合力格数 = 3 格，其中招牌格（官方先行的时序方向）为 3 父合力。
    满足 L4 涌现最低门槛（≥1 格需 ≥2 父合力），且在 conjunction 等级上
    达到 verified 分档条件（≥2 合力格）。

# === 可证伪性 ===

falsifiability: |
  本推论在以下条件之一满足时被证伪或降格：

  (a) 一锤定音——官方先行环节失败：
      在任一触发事件（独立编码，≥1% 窄口径）发生后 4 季度内，
      全球央行季度净购金量无统计显著上跳（事件后连续 2 季度中无一季度
      购金量超过事件前 8 季度均值 +1σ）→ Link I 断裂 → 三环节链的第一个
      环节不存在。本推论被净证伪——结论降格为 rejected。
      所需的最小独立检验：一个触发事件 + 完整 WGC 季度数据（2010 年起）。
      2022 事件已满足此条件（Q2-Q3 2022 购金量远超 +1σ）。

  (b) 一锤定音——时序反转：
      在任一触发事件窗口（独立编码）中，私人购金季度峰值 τ < +1 且为负值
      （即私人峰值严格领先于官方峰值，τ ≤ −1）→ 时序方向反转 →
      传导链的"官方→私人"方向被推翻。本推论被净证伪。
      若 τ 在 [0, +1) 区间（即私人峰值与官方峰值在同一季度或紧邻季度、
      统计上不可区分先后）→ 该事件为"非判别窗口"（不提供时序证据、
      也不证伪）——因为季度数据精度不足以分辨同季度内的先后。
      连续积累 3 次以上非判别窗口（τ 始终落在 [0, +1) 无法判断方向）
      → 降格评估（时序主张在现有数据精度下不可检验，需更细粒度数据
      或更长窗口积累——诚实承认检验力的数据瓶颈）。
      所需的最小独立检验：一个触发事件 + 完整的 WGC 季度官方+私人数据
      （2010 年起）。2022 事件可检验。

  (c) 降格——价格不响应：
      触发事件后 8 季度内金价累计涨幅未显著大于基线同长度窗口（p≥0.05
      单尾检验）→ Link III 传导断裂（需求侧发生了迁移但未重定价，
      可能供给弹性吸收了全部增量需求）→ 预测 (iii) 被证伪。
      此失败仅降格预测 (iii)，不连带推翻预测 (i)(ii)（传导链的前两环节
      仍可成立而价格不响应——传导链≠价格预测）。诚实声明：若预测 (i)(ii)
      成立而 (iii) 失败，本条 status 标记为 verified* 而非 rejected——
      传导链的方向与时序仍成立，只是"足以重定价"的幅度主张被削弱。

  (d) 空格被填——跳过官方环节：
      出现"触发事件 ON + 官方购金无统计显著上跳 + 私人购金与金价按
      三环节链运行（私人峰值清晰、金价累计涨幅显著）"的历史或未来窗口 →
      预测 (iv) 被证伪——存在"事件→私人自启"的替代传导路径，官方先行
      非必要环节 → 传导链的三环节结构不成立 → 降格为 rejected。

  (e) 时序符号一致性失败：
      在 3 次以上独立触发事件窗口中，τ 的正负号若在统计上不显著偏离
      随机（二项检验 p≥0.05 双侧，H₀: P(τ≥+1)=0.5）→ 预测 (v) 被证伪
      → 时序方向无统计可靠性 → 降格为 verified*（方向主张存疑但有机制
      基础）。所需最小：3 次以上独立触发事件 → 当前 N=1，统计检验尚不可执行。
      诚实声明当前检验力为 0。

  适用区间：1971 年布雷顿森林解体后的法币储备体系时代（此前金是货币锚，
  无"非主权价值储藏"的角色分离可谈）。央行购金数据完备的检验区间为
  2010 年至今（WGC 季度系列）。1971 与 1979 的两次历史触发事件仅可做
  方向一致性弱检验（年度数据、多因混杂）。

anti_talisman_clause: |
  【防不可证伪护身符——吸取 L4-009 教训】
  (1) 触发事件的编码必须使用预注册的 ≥1% 阈值与央行窄口径，独立于金价
  与购金量——永远不得因"金价涨了/央行买金了"而事后宣布"所以肯定是
  触发事件"。触发事件清单已在 operationalization 中一次注册——后续新增
  候选事件必须按同口径显式裁决，任何口径调整触发降格评估。
  (2) 传导链的环节时序必须用独立数据源的原始时间戳确认——不得用平滑/
  插值/窗口裁剪制造"刚好滞后 1 季度"的假象（处理步骤已预注册：
  2-季度滚动和压噪声、峰值取首个、季度为最小原子单位）。
  (3) 若触发事件发生、官方购金无上跳、金价大涨——此窗口为本推论的
  潜在反例（格 [SOV, 事件 ON, 官方] 被跳过），不得用"央行一定在偷偷买、
  只是数据没报"来消化。若事后证明央行确实隐匿购金——此为本推论
  的"数据不透明→检验力受限"条款，非护身符。
  (4) 非判别窗口诚实条款——若触发事件窗口内官方与私人购金峰值在
  同季度（τ ∈ [0, +1)），该窗口为"时序不可判"——不计入支持亦不计入
  反例。不得靠同季度内的叙事重构（"肯定是央行先买然后私人同季度跟进"）
  来制造伪支持。非判别窗口的占比若超过已检事件数的 2/3，须触发降格评估
  （数据粒度不足以检验时序主张）。
  (5) 窄口径边界诚实条款——2011 年利比亚的 0.88% 距 1% 线仅 0.12pp。
  若未来独立核数使利比亚过线 → 2011 年自动转为触发 ON → 2011-2013
  金价 −28% 成为本推论的一锤定音反例（触发 ON 在价格大跌之前）。
  本条款预注册此判例——利比亚裁决的口径敏感性是本推论 primary_suspect
  的核心承重点，口径不设事后调整空间。

# === 排除的结果 ===

excluded_outcomes:
  - outcome: "触发事件的具体发生时间或下一个触发事件是谁"
    description: |
      本推论只预测"若触发事件发生→传导链的时序结构"，不预测触发事件
      何时发生、在哪个国家发生。主权信用事件的发生本身是政治/地缘变量，
      不在 L4-011 的射程。
  - outcome: "传导链中金价的具体点位或目标价"
    description: |
      本推论只预测"触发事件后 8 季度内价格位移统计显著大于基线"，
      不预测价位。点位预测需供给/需求的量级模型，属更细粒度的 L5 命题。
  - outcome: "金以外的非主权价值储藏（比特币、房地产、艺术品等）
    在传导链中的角色"
    description: |
      传导链的目的地由 DED-029 的 C3 通道限定为黄金。若信用事件后
      储蓄迁移主要流向非金资产——不在本推论射程（DED-029 的 C3 方向被
      覆盖，金价不涨不证伪传导链的存在——只是目的地不是金）。
      但这种情况会削弱本推论的操作化检验力（因为选了金做检验对象）。
  - outcome: "多个信用事件叠加或连续触发时的传导链交互"
    description: |
      若在上一事件的传导链尚未完成时（如 8 季度窗口内）发生新的触发事件，
      两次事件的传导链可能叠加或互相干扰——不在当前射程。
  - outcome: "传导链的幅度——官方 vs 私人购金的各自绝对量级"
    description: |
      只预测方向与时序，不预测各自的绝对吨数或相对占比。

# === 真实世界锚点 ===

real_world_anchors:
