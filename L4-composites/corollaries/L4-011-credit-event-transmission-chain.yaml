      analysis: |
        若受影响的国家非主要储备货币发行国（如小型新兴市场国家的储备被冻结，
        且其全球储备份额极小），≥1% 阈值可能不满足 → 触发 OFF → 传导链
        不启动。若未来出现"某非储备货币国家的储备被冻结、量级 <1% 但全球
        金价仍出现传导链模式"——此为阈值的 I 类错误（漏判），阈值可能需要
        下调。但按预注册承诺，阈值事后不调——此类案例记为边界遗漏，触发
        阈值适用性讨论而非推论证伪。
      status: "boundary_case——量级边界下的 I/II 类错误权衡"

# === 判别效度 ===

discriminant_validity: |
  【与"央行买金所以金价涨"的朴素叙事判别】
  朴素叙事："信用事件→大家同时买金→金价涨"。无环节区分、无时序预测、
  无可操作化 τ。本 L4 与朴素叙事的独有差别：
  (a) 区分官方 vs 私人需求（二者数据源独立、驱动机制不同——官方=制度性
     储备重配、私人=认知触发的储蓄重配）→ 非"大家同时买"。
  (b) 预测二者有固定时序（τ ≥ +1）→ 可检验、可证伪。
  (c) 断言 τ > 0 是结构性的（由机制的"信息+制度优势"保证），非经验巧合。

  【与 DED-029 自身判别——防止 L4 只是父推论脚注】
  DED-029 的 C3 通道："法币信用↓→金 E_network 扩张→金价↑"——
  这是单因素方向预测，操作化为金价的连续驱动模型。若 L4-011 只是
  "C3 在触发事件后更活跃"——那是 DED-029 的注释，不是 L4。
  本 L4 与 DED-029 脚注的区分：(a) 行动者分离——DED-029 不讲谁买；
  (b) 序贯时序——DED-029 不讲先后；(c) 二值化触发——DED-029 是连续量。
  三者在 DED-029 框架内均不存在。若审查发现 L4-011 可被"在 DED-029 里
  加一条'官方购金可能领先于私人购金'的 footnote"等价替代——则 L4 不是涌现。

  【与 L4-009 判别——体制切换 vs 传导链】
  L4-009 的核心主张：金价在商品体制与货币体制间切换——切换由四指标复合判据
  判定，切换后定价结构整体改变。L4-009 问的是"现在是什么体制"。
  L4-011 的核心主张：信用事件发生后，储蓄端配置沿固定三环节链传导——
  事件二值化触发。L4-011 问的是"事件发生后钱怎么一步步流"。
  二者的关系是互补而非竞争——L4-009 的货币体制是传导链运行的"环境"
  （传导链在货币体制内展开），L4-011 的传导链是货币体制内部的"过程"
  （体制切换后配置如何具体执行）。一条推论的证伪不连带另一条：
  - 若传导链被推翻（τ ≤ 0）→ L4-011 rejected 但 L4-009 的体制切换
    主张不受影响（体制切换不以环节时序为判据）。
  - 若 L4-009 的体制切换被推翻（连续模型优于离散模型）→ 传导链仍可
    在连续信用下滑背景下运作（此时τ应随信用谱位置连续变化而非仅由事件触发）。

  【防平凡化守卫】
  非平凡内核三件，缺一即平凡化：
  (a) 官方→私人的时序 τ ≥ +1 是可检验可证伪的结构性预测（非 stylized fact）；
  (b) SOV 域内的行动者分层依据（信息+制度优势）是 DED-028 机制在亚层
     的扩展应用——非纯经验描述；
  (c) 触发二值化（≥1% 窄口径）是主动的方法论选择（替代连续谱判据）——
     非因懒惰不测连续量，而是因"对手方风险从抽象可能→公开证实"是类别翻转。

# === 证伪追踪 ===

falsification_trace:
  primary_suspect: |
    窄口径与 ≥1% 阈值的事前可辩护性——2011 年利比亚的 0.88% 距 1% 仅
    0.12pp，是推论存亡的单一最大风险点。L4-009 的五轮攻防中，该阈值的
    口径选择已被判定为"事后口径选择"（窄口径定死晚于反例发现），并被
    反向裁决导致 L4-009 降格。L4-011 继承同一阈值并预注册同一窄口径——
    利比亚的边界威胁以同样方式存在。若后续审查按 L4-009 第 18 条判例
    （"阈值注册时未同步注册口径→事后口径选择→一律按不利于推论方向裁"）
    将利比亚裁决为过线（宽口径 ≥1%），则 2011 年成为触发 ON 窗口 →
    2011-2013 金价暴跌成为 Link III 的活反例 → 按预注册承诺降格。
    承重点：窄口径的"央行资产负债表"限定能否在独立审查中存活——
    辩护要点是机制理由的事前可辩护性（储备管理者重估的是自身储备资产属性，
    非主权财富基金的海外风险），非事后数据拟合。
    最先受检。

  secondary_suspect: |
    季度数据粒度对时序判断的敏感度——2022 事件中官方与私人峰值落在同一
    季度（Q3 2022），τ 落在 [0, +1) 区间 → 不可判。若未来多起事件持续
    出现同季度峰值（τ 始终不可判），非判别窗口占比触及 anti_talisman(4)
    的 2/3 降格线 → "传导链有时序先后"的主张在现有数据粒度下不可检验，
    需月频甚至更高频数据。这是数据瓶颈而非机制失败——但"不可检验"对
    推论同样是致命伤（等于无法获得 verified 状态）。

  unlikely_suspect: |
    DED-028 的 SOV 无法律缓冲机制——多历史案例交叉验证，结构稳健。
    DED-029 的 C3 方向性——四引擎体系的一部分，已通过独立审查和测度
    正交性检验。BR-L2-024 的记忆滞后——有 Malmendier & Nagel (2011) 的
    直接经验支撑（虽然金持有非直接因变量）。三条父级前提的核均 unlikely
    是错误根源——L4-011 的脆弱性集中在操作化（口径/阈值/数据粒度）而非
    在机制基础。

review_summary: |
  r1 rejected（ADV-REVIEW-L4-011）：①2022 唯一完整窗口按注册口径（私人=金条金币+ETF 合计，
  ETF Q1 +269t）测得 τ=−2，触发自设一锤定音条件 (b)（时序反转净证伪）；锚点 τ=0 系丢 ETF
  的口径偏离，按第 11 条反向裁决不得改口径自救。②1979 锚点"央行转净买家"事实错误（美/IMF
  拍卖贯穿窗口、官方持金量下行）→ 该窗口为 (d)"跳过官方环节"候选填格；1971 官方需求先于
  事件——三窗口三种时序，固定三环节属过拟合。③招牌涌现签名（官方→私人排序）的承重前提
  "官方信息+制度优势→最先动"非父推论可推（文件自认），且被触发季数据反向（官方 84t<基线
  120t、私人 551t 峰值）——注入假说非涌现，剥离后剩 DED-028 AND DED-029 平凡合取。
  父推论 DED-028/DED-029/BR-L2-024 不受连累。可救后继命题（按制度摩擦分层的响应速度结构）
  需重新立项。

