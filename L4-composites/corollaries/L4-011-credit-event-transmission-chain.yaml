  boundary_cases:
    - case: "资本管制/黄金进口限制下的信用事件——私人环节被制度阻断"
      analysis: |
        若触发事件发生在实施严格黄金进口管制或资本管制的国家（如中国在部分
        时期的黄金进口配额、印度曾有的黄金进口限制），私人环节（Link II）
        可能被制度性阻断——金条金币需求无法自由响应。此情况下 Link I（官方）
        与 Link III（价格——通过国际市场）仍可运作，但 Link I→Link II 的
        传导被制度墙挡住 → τ 无法测量 → 窗口为"部分不可检"。
        此非证伪——私人滞后的认知机制仍然存在但被制度压制（相当于实验室的
