        全球全体储备持有者受影响）。此后的 1971–1980 期间：
        - 官方购金加速（欧洲央行兑换潮+1979 伊朗冻结强化）
        - 私人金条金币需求兴起（美国 1974 年重新允许私人持金后）
        - 金价从 $35→$850
