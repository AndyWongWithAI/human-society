      confidence: "moderate（机制演示而非完整检验——未满足'≥2个主权国家
        央行配置>0.5%储备'的门槛，也未发生在信用重定价期内）"

    - anchor: "2022年俄罗斯央行储备冻结——信用重定价期的干净案例+DED-029 C3通道充分激活"
      evidence: |
        2022年2月G7冻结俄罗斯央行约3000亿美元储备资产（约占当年全球
        官方储备的2.5%），构成DED-029 C3通道的充分激活：储备资产的
        对手方风险被公开证实，"不依赖任何对手方履约"从溢价属性变为
        储备的必要属性。该事件后：(a)全球央行净购金量创历史新高
        （2022–2024年连续三年超1000吨）；(b)对"非主权数字资产"的讨论
        升温——虽然尚无央行公开将比特币纳入储备，但该事件直接催化了
        对"无法被冻结的价值储藏"的搜索——比特币在2022年冻结后至2024年
        价格显著上涨（虽然也受其他因素影响）。该锚点干净地演示了本条
        的机制逻辑：信用重定价（对手方风险证实）→打开非主权SOV需求
        窗口→需求流向候选池中的顶级候选。当前的顶级候选仍是金（数字
        挑战者尚未满足前置条件）——但这正为本条提供了基线：在下一次
        信用重定价期（若挑战者前置条件已满足），可对比需求流向的变化。
      confidence: "high（作为信用重定价期锚点——离散事件+独立数据+
        后续央行行为可独立验证）；moderate（作为本条完整预测的锚点——
        挑战者前置条件未满足，仅提供基线而非分流演示）"

    - anchor: "1979年伊朗央行资产冻结——上一次信用重定价期的历史复刻"
      evidence: |
        1979年美国冻结伊朗央行约120亿美元资产（约占当年全球官方储备
        的3%），随后1979–1980年金价从约200美元飙升至850美元的历史峰值。
        该锚点与2022年形成跨时间的模式复刻——每次储备资产的对手方风险
        被证实→央行与私人部门重新评估SOV配置→金受益。两次事件的结构
        相似性强化了DED-029 C3通道的可重复性。对于本条：1979年没有
        数字挑战者，因此金捕获了全部增量非主权SOV需求。若未来发生
        第三次此类事件而挑战者前置条件已满足，1979与2022的基线将与
        未来的分流结果形成对比——两条基线（金独占100%）vs 未来结果
        （金<100%）→可量化分流幅度。
      confidence: "high（作为重复模式锚点——两起独立事件、相同机制、
        相同方向结果）；moderate（作为本条的对比基线——1979/2022无
        挑战者，不直接检验分流预测）"

  counterexamples:
    - case: "比特币2021–2025年期间未能在2022年信用重定价期中显著分流黄金需求"
      analysis: |
        2022年的信用重定价期（俄罗斯储备冻结）中，金捕获了压倒性的增量
        非主权SOV需求（央行购金量创纪录），而比特币在此期间的机构级
        "储备配置"几乎为零（萨尔瓦多的持有不算储备配置，且仅一国）。
        这是否构成对本条的反例？——不构成。本条预测(ii)的前置条件
        （六维得分系统性超金+获机构级储备配置）在2022年均未满足：
        (a) 比特币的六维得分是否系统性超越黄金是一个需要按weight_protocol
        独立评估的问题——在可携带性、可验证性维度上比特币可能得分更高，
        但在耐久性（协议存续仅15年 vs 金数千年）、供给稳定性（比特币
        供给规则虽算法化但历史上经历过硬分叉/区块大小战争→治理门槛
        并非无限高）等维度上存在争议；(b) 比特币在2022年【未】获机构级
        储备配置——无≥2个主权国家央行/主权基金公开配置>0.5%储备。
        故2022年不构成对预测(ii)的检验——前置条件未满足→预测(ii)的
        检验窗口尚未打开。本条将2022年记录为基线锚点（见supporting）
        而非反例。
      status: "not_a_counterexample——前置条件未满足，不构成检验"

    - case: "未来可能出现'得分更高的候选迟迟无机构配置'的漫长过渡期"
      analysis: |
        若某数字资产在六维得分上系统性超越黄金（按weight_protocol的独立
        评估），但长期（>15年）无主权国家将其纳入储备（机构配置门槛未能
        跨越），那将揭示本条的调节变量（"获机构级配置"）可能是一个比
        预期更难满足的瓶颈——可能因为：(a) 主权部门对数字资产的制度性
        抵制（监管/政治障碍）远强于预期；(b) 数字资产在耐久性/供给稳定
        性维度上的得分实际上弱于当前评估。此情形不构成对本条的"净杀"——
        因为预测(ii)的前置条件未被满足（就像"如果明天下雨地会湿"不被
        "明天没下雨"证伪一样）——但它将使本条退化为长期不可检验命题，
        按anti_talisman_clause第(5)条（20年无检验窗口→主动降格）触发
        降格（r1勘误：原误指falsifiability条款(e)——该条款是调节变量
        必要性检验，与长期不可检验降格无关）。
      status: "risk_scenario——检验窗口被无限推迟的风险，非反例但威胁操作化"

  boundary_cases:
    - case: "多个数字资产同时满足前置条件——多元竞争而非二元竞争"
      analysis: |
        本条只建模了"数字挑战者 vs 黄金"的二元竞争。若现实中同时出现
        多个数字资产均满足"六维得分超金+获机构配置"，则模型的二元框架
        需扩展为多元竞争。多元竞争下，DED-027的赢家通吃预测"多元候选中
        不能稳定共存，必收敛到单一主导者"——但收敛过程可能更长、路径
        更复杂（数字资产之间先竞争出一个占优者→再与金竞争）。本条不对
        数字资产之间的内部竞争做预测——那是DED-027框架在纯数字域的
        二次应用。若多元竞争格局出现，本条的核心主张（"金不再是唯一
        受益者"）仍成立——因为无论数字资产之间的竞争胜出者是谁，
        增量非主权SOV需求都从金分流了。
      status: "boundary_case——模型简化假设的边界，核心机制不受影响"

    - case: "央行数字货币(CBDC)与私人数字资产的竞争混淆"
      analysis: |
        若未来出现广泛采用的CBDC（数字人民币、数字欧元等），它们作为
        主权负债，【不】属于本条定义的非主权SOV候选池（对手方风险>0）。
        CBDC对金的竞争走DED-029的C3通道：若CBDC提升了法币信用→C3反
        向（金需求↓）；若CBDC被视为法币信用扩张（印钱工具）→C3正向
        （金需求↑）。CBDC与私人非主权数字资产（如比特币）是不同类别——
        前者是主权负债的数字形式，后者是去中心化协议的原生资产。将CBDC
        的采用误归为"数字资产挑战者得分超金"的证据是类别错误——本条
        的非主权SOV候选池定义（operationalization中demand_migration的
        分母）将此边界显式划定。
      status: "boundary_case——分类边界的显式划定，防止类别混淆"

# === 判别效度 ===

discriminant_validity: |
  【与DED-029的判别——本条不是DED-029的脚注或"竞争者扩展版"】
  DED-029的核心是"金价由四引擎驱动，统一走E_network通道"——它处理
  的是"给定金是唯一非主权SOV的情况下，什么因素驱动其E_network伸缩"。
  本条的核心是"当非主权SOV候选池不止金一个元素时，DED-029的C3预测
  （法币信用↓→金↑）不再单调——受益者由DED-027的筛选框架决定"。
  DED-029如果在某一天被扩展去考虑数字竞争者，那就是本条的内容——
  但DED-029没有做这个扩展，它显式将多因素交互让渡给L4，也从未声称
  "金是唯一受益者"——它仅仅是未讨论"如果不是唯一受益者会怎样"。
  本条的可独立证伪预测不同于DED-029：DED-029的C3预测法币信用↓→
  金价↑（方向）；本条预测该方向的强度在挑战者存在时衰减。若未来
  信用重定价期中金价仍以与历史同等强度响应（挑战者前置条件已满足），
  DED-029的C3成立而本条被证伪——两条推论在同一事件中给出不同预测，
  是干净的判别。

  【与L4-009 prediction (iv)的判别——本条是独立发展的挑战者模块】
  L4-009 prediction (iv)以极简形式（一段statement）提出了挑战者判据，
  且DED-027在其中被标注为"射程扩展、辅助前提、不计入合力格数"。
  本条将这一辅助模块升级为独立L4复合推论：(a) 给它完整的六维权重
  标定协议（L4-009没有）；(b) 给它独立的操作化、证伪条款、现实锚点
  （L4-009的挑战者模块没有独立操作化）；(c) 给它独立的涌现论证——
  证明DED-027 + DED-029 合力可独立支撑挑战者命题（L4-009的挑战者
  模块从未被独立审查其涌现性，因为它只是四条prediction中带星号的一条）。
  L4-009的核心是"金价体制切换"（商品体制 vs 货币体制的相变），挑战者
  只是其天花板模块；本条的核心是"数字挑战者与金在非主权SOV生态位上的
  竞争"，信用重定价只是其触发窗口。两条推论共享父前提（DED-027, DED-029）
  但claim_type不同（phase_transition vs phase_transition）、被预测量
  不同（金价的相关性结构 vs 增量非主权SOV需求的资产间分配）。

  【与"数字黄金"(digital gold)叙事的判别】
  "比特币是数字黄金"是加密货币社区常见的叙事——它将比特币定位为
  黄金的数字类比。这个叙事的常见形式是平凡合取："金是好的SOV AND
  比特币有类似属性→比特币也是好的SOV"。本条的非平凡增量不在"比特币
  像金"这个类比，而在三件事：(a) 六维权重的【系统性重排】——数字
  网络不只是在"金"的六个维度上给比特币打一个分，而是改变了评分标准
  本身（某个维度上的"好"在数字网络下意味着不同的东西）；(b) 赢家通吃
  的【逻辑必然】——不是"比特币和金可以愉快共存、各自服务不同人群"，
  而是"同一生态位上得分接近的两个候选不能稳定共存"；(c) 信用重定价
  作为【加速器】——数字资产取代金不需要在日常平稳期中慢慢说服市场，
  下一次信用危机就是"决赛轮"。这三件是社区叙事没有提供的机制论证。

  【防平凡化守卫】
  有人可能说："这不就是'如果出现比金更好的SOV，钱会流向更好的'——常识吗？"
  非平凡内核不在"更好的东西会赢"这个方向，而在：(a) 六维筛选提供了
  "更好"的可操作定义（不是市值/历史/知名度——是六个正交维度的加权
  得分），使"更好"从事后合理化变为事前可测；(b) 赢家通吃提供了"赢了
  会怎样"的结构预测（不是和平共存、不是慢慢过渡——是不稳定共存+窗口
  期加速集中）；(c) 信用重定价窗口提供了"什么时候见分晓"的计时机制。
  这三件合起来构成一个有时序、有机制、可证伪的条件命题——而不只是
  "更好的东西最终会赢"的常识复述。若审查者判定(a)(b)(c)中任一项
  未被本条兑现，应降格或拒绝。

falsification_trace:
  primary_suspect: |
    六维权重重排的weight_protocol——本条的最弱承重环节。
    两重风险：(1) 权重rank协议中"数字网络特征→秩位"的映射是基于机制
    论证的初始标定，未经独立经验验证。若后续审查或经验检验判定：数字
    网络特征与六维权重之间不存在方向性关系（例如高密码学验证能力并不
    系统性地导致高可验证性权重——因为所有数字资产在这方面都差不多→
    该维度实际上不构成差异化→其秩位应低于而非高于传统框架），则预测(i)
    权重重排的方向性被推翻。该风险与DED-029的primary_suspect（U≈0近似）
    形成结构性对应：DED-029赌的是"金的使用价值可忽略"，本条赌的是
    "数字网络特征→权重方向性重排"。两处都是机制论证强但经验标定弱的
    环节。(2) DED-027的射程扩展——本条将DED-027的商品货币时代筛选逻辑
    外推到现代央行储备配置域，论据是域的结构相似性（自发选择网络）。
    但现代央行储备配置是否真的构成"自发选择网络"——各央行的储备配置
    决策受地缘政治联盟、IMF框架压力、双边货币互换协议等制度性因素影响
    的程度可能显著高于DED-027原始射程内的自发交换网络。若央行储备配置
    被证明主要是制度性协调的结果而非自发选择，DED-027的六维筛选+赢家
    通吃逻辑在此域不适用→本条核心承重机制失稳。最先受检。
    桥接前提的隐含加强版（r2登记，SF-6）：本条实际依赖的不仅是"储备
    配置构成自发选择网络"，还有其加强形式——"储备配置网络是【单一连通、
    共享单一f1–f5权重向量】的网络"。现实中f1（对手方风险）暴露度按
    地缘阵营高度异质（美元体系盟友国冻结风险≈0，非阵营国显著）——
    若网络按阵营分割为局域网络、各自权重分化，则按DED-027自身原理
    可能各出各的胜者→金与挑战者分段共存，全局分流格局不出现。
    可观测判据（独立于结果）：制裁清单覆盖面/双边货币互换协议网络的
    连通性可独立编码为网络分割度。对预测读数的影响：分段共存情形下
    预测(ii)的全球份额读数预期落入5–20%中间带→按既注册裁决（份额
    模块被推翻、分流存在性由<5%死线单独裁决），本条对此情形并非无言；
    证伪条款(c)的"连通的全球储备配置网络"限定词事前排除了分割情形
    进入(c)射程。
  secondary_suspect: |
    "获机构级配置"调节变量的门槛设定——≥2个主权国家+>0.5%储备配置。
    若数字资产在未满足此门槛的情况下（如仅被私人机构/ETF广泛持有+
    1个小国央行配置），于信用重定价期中已显著分流黄金需求，则调节变量
    的高门槛被证明是过度保守的——这不推翻核心机制（需求分流仍在发生），
    但揭示操作化的门槛选择偏差。反之，若数字资产满足此门槛后仍在信用
    重定价期中未能分流金的需求，则可能揭示：(a) 主权部门配置的示范效应
    弱于预期（私人部门不跟进）；或(b) 六维得分"超越金"的标定存在缺陷
    （某个被忽视的维度在主权部门的实际决策中权重远高于预期，而挑战者
    在该维度得分低）。
  secondary_suspect_2: |
    DED-029的"信用重定价打开需求窗口"机制本身——C3通道的方向预测
    （法币信用↓→金↑）虽已过独立审查(verified)，但其隐含假设
    "非主权SOV需求窗口打开后，需求必然流向候选池内某个资产"未经
    独立检验。如果信用重定价期中，增量非主权SOV需求本身（分母）的
    扩张幅度极小——即信用重定价并没有显著扩大非主权SOV的总需求，
    只是改变了现有SOV配置的结构——则本条的"需求窗口"隐喻夸大了
    需求扩张效应，"分流"将主要表现为存量结构调整而非增量分配，
    预测(ii)的>20%门槛将更难达到。
  unlikely_suspect: |
    THEOREM-value-attribution的V=(U+E)×S结构（L1定理，多领域交叉
    验证）与BR-L2-021的六维物理筛选框架（IEA=2.4，材料科学+考古+
    实验经济学+博弈论四路交叉验证）——极少是错误根源。
    DED-027的赢家通吃逻辑（在多Agent博弈中已独立验证）同样稳健。
    金的地质稀缺性（约20万吨地上存量、年产量/存量≈1–2%）——
    地质事实，不会因数字资产的出现而改变。

