id: L4-013
type: composite_deduction
layer: L4-composites
deduction_form: composite
status: verified
term: "数字时代价值储藏媒介竞争格局 (Digital Era Store of Value Medium Competition Landscape)"
claim_type: phase_transition  # 前瞻性——阈值彼侧案例集当前为空集，两侧对比证据标准结构性未满足，见statement Epistemic status (5)

人话摘要: "数字交换网络把'什么东西适合当钱/当储备'的六条老规矩重新洗牌了——可分割、可验证、可携带这三条在数字世界里彻底变了含义。如果某个数字资产在新的权重下综合得分超过了黄金，而且央行级的机构真金白银地配置了它，那么按照赢家通吃的逻辑，金和它没法长期共享'顶级非主权价值储藏'这把交椅。下一次法币信用出事、大家从主权资产往外跑的时候，增量需求可能就不去金那里了——黄金的'乱世英雄'天花板被挑战者压低了。这不是说金会归零，是说它在未来信用危机中的相对受益会比过去小。"

statement: |
  【Composite claim】
  数字交换网络对一般等价物的六维物理筛选框架(BR-L2-021 / DED-027)产生权重重排——
  可验证性、可携带性、耐久性三个维度的测量标准被数字化根本重定义
  （r1修正：原表述含可分性，现修正为耐久性——可分性在储备配置网络中
  是非约束维度，见预测(i)与weight_protocol）。
  在此新权重下，若某数字资产在六维加权得分上超越黄金，且已获得机构级储备配置
  （央行/主权基金将一定比例的储备分配至该资产），则DED-027的赢家通吃动力学
  禁止二者在"顶级非主权价值储藏"生态位上长期稳定共存。
  DED-029的信用重定价机制（法币信用下滑→非主权SOV需求窗口打开）为这一竞争
  提供了触发时机：下一次信用重定价期打开的需求窗口，增量需求可能从黄金迁移至
  得分更高的数字挑战者——黄金在信用危机中的"避险溢价"天花板被结构性压低。
  这不是"黄金归零"的预测——黄金因其存量厚度与历史E_network锁定，仍将保有
  大量价值储藏份额；预测的是【边际增量需求的流向改变】——下一次信用重定价期
  中，黄金捕获的增量份额将系统性低于此前可比信用重定价期。

  【Epistemic status——诚实声明】
  (1) DED-027自宣射程为商品货币时代自发交换网络（无中央银行/法定货币，
  现代法币体系明文不在射程内）。本条将其六维筛选+赢家通吃逻辑外推到
  现代央行储备配置域——该域的结构相似性（储备资产选择无法定强制、
  各央行自主配置→构成自发选择网络）是外推的论据，但外推本身未获父推论
  验证。本条标注"射程扩展，自担赌注"——预测(ii)(iii)(iv)与招牌格
  [重定价期, >金且获配置]的全部承重均依赖DED-027六维筛选+赢家通吃在
  储备配置域的射程外适用，一律不享受DED-027 verified状态的背书
  （r1修正：免责范围从仅预测(iii)扩展到全部依赖射程外腿的预测与格子）。
  (2) 数字资产的六维权重标定尚无公认的标准化方法——当前方向性关系
  （储备配置网络特征→网络可携带性/可验证性/供给稳定性权重上升、
  耐久性重定义、同质性居中、可分性权重下降，见weight_protocol）是
  机制论证而非已校准的实证测量。权重推导的事前
  可辩护性（见operationalization的weight_protocol）是核心承重点。
  (3) 当前尚无数字资产同时满足"六维得分系统性超越黄金"与"获多国央行
  机构级储备配置"两个条件——(a1)按r2注册的保守角×跨秩位结构规则在
  2026-07判【未满足】（见weight_protocol的(a1)判定规则汇总）；(a2)经
  e1–e3裁决基线≈1国（美国SBR计入）、距触发（≥2国）仅差1国——不再是
  遥远条件，但在2026-07仍未触发（r2措辞一致化：原"距'多国央行储备
  配置'仍有距离"已按重述后基线收紧）。这意味着本条的预测主要在
  "下一次信用重定价期"的时间尺度上可检验——未来窗口的检验力是真实的，
  但历史锚点只能提供机制演示而非完整经验检验。
  (4) 涌现类型声明为conjunction（薄涌现）——DED-027给竞争规则（谁胜出+
  赢家通吃），DED-029给触发时机（信用重定价打开需求窗口），二者是独立
  因果链在储备资产选择域上的并行叠加。信用重定价的触发并不修改赢家通吃
  机制本身——它只是激活了赢家通吃在新旧候选之间的"决赛轮"——故非交互级
  （厚涌现）。涌现最低门槛的满足通道（r1修正）：本条唯一的双父合力格
  （招牌格）的DED-027腿站在其自宣射程之外——涌现门槛经由METHODOLOGY
  emergence_to_status_mapping条件(b)（核心涌现属性依赖桥接前提承重）满足，
  而非默认通道；state ceiling: verified（薄涌现验证），成立理由为
  "conjunction + 1个星号合力格 + 射程扩展桥接前提"，父推论均为verified(CAP=3)。
  (5) claim_type前瞻性标记（r1新增）——phase_transition要求阈值两侧案例
  对比证据：阈值此侧（无合格挑战者）有1979/2022两个干净基线；阈值彼侧
  （挑战者得分超金+获机构配置）案例集当前为空集，两侧对比证据标准
  【结构性未满足】。当前验证状态的经验内容仅覆盖(a)机制链与基线侧锚点、
  (b)预测(i)的方向性框架；核心预测(ii)(iii)(iv)为未来窗口检验。
  本条状态语义上限="薄涌现verified（机制链）+核心预测未经验检"的组合。

  【Parent mechanisms】
  DED-027 给竞争规则——三条机制全部承重：
  (a) 六维物理筛选框架：任何商品要成为被广泛接受的一般等价物/价值储藏，
  须在可分性、耐久性、可携带性、可识别性、同质性、供给稳定性六个维度上
  达到足够分数；各维度权重由交换网络特征外生决定。→ 本条将其外推到数字
  交换网络：数字网络特征（零运输成本、密码学验证、协议化供给）重新标定
  六维权重的方向与秩位。
  (b) E_network正反馈与赢家通吃：被接受度越高的候选→用它交易/储藏越方便
  →更多人接受它→正反馈锁定。两个得分接近的候选不能长期稳定共存——微小
  初始优势被放大后必有一方胜出，均衡状态是单媒介主导。→ 本条将其外推
  到"顶级非主权价值储藏"生态位：金与数字挑战者的关系不是互补的功能分化
  （一个管实物结算、一个管数字结算），而是同一生态位（非主权、不依赖
  对手方履约的价值储藏）上的竞争者——交易域重叠度(TDO)与媒介可替代性(MS)
  判据（继承自DED-027的anti_talisman_clause第5条）决定二者是竞争还是
  功能分化。
  (c) 技术冲击可换主：物理维度权重随交换网络规模/技术条件变化。→ 本条
  将"数字交换网络"本身视为一次技术冲击——不是改变单一维度的供给参数
  （如电解法改变铝的供给稳定性），而是【系统性地重排全部六维权重的测量
  标准】——这是比DED-027预测(iii)设想的"单维度供给冲击"更深层的参数变更。

  DED-029 给触发时机——两条机制承重：
  (a) E_network通道统一性：金价波动几乎全由E_network驱动（V≈E×S，U≈0，
  S稳定）。四个独立引擎（实际利率−/通胀预期+/法币信用−/不确定性+）全部
  走E_network通道。→ 本条将此单通道逻辑从金扩展到"非主权价值储藏"这个
  更一般的候选池：信用重定价打开的不仅是对金的需求窗口，而是对整个
  非主权SOV候选池的需求窗口——窗口本身是候选中性的，谁得分最高谁受益最大。
  (b) 法币信用引擎(C3)：法币信用下降→价值储藏从主权资产逃逸至非主权资产
  →E_network扩张。→ 本条将C3重新解释为"非主权SOV需求窗口的触发器"——
  窗口打开后需求流向哪个非主权候选，由DED-027的六维筛选框架决定。
  DED-029单独假设金是默认受益者（因为在其写作时代，金是唯一具备深度市场
  与历史E_network的非主权SOV），但该假设不是DED-029的逻辑必然——
  DED-029的formal statement只说"法币信用↓→E_network扩张→金价↑"，
  未断言"金是唯一受益者"。本条将"唯一受益者"这一隐含假设显式化为可检验
  命题：若存在另一非主权SOV候选且其六维得分超金，C3的需求增量应分流。

  【Emergent property】
  涌现类型：conjunction（薄涌现）。两条父推论各自给出独立机制——DED-027
  给"谁在竞争规则下胜出"（六维筛选+赢家通吃），DED-029给"什么时候竞争
  的赌注最大"（信用重定价打开需求窗口）。二者合成后产生的新命题是：
  下一次信用重定价期，非主权SOV增量需求的受益者不再是理所当然的金——
  而是DED-027框架在数字网络权重下的加权最优者。这个命题不在任何单条
  父推论中：
  - DED-027不处理"信用重定价期"这个概念（那是法币信用体系的产物，在其
  自宣射程外），因此无法回答"竞争何时加速"；
  - DED-029不处理"金的竞争者"——它把金当作非主权SOV的唯一候选，因此
  无法回答"如果有了更好的候选会怎样"。
  合成后的涌现结构=【候选筛选规则（DED-027）+ 需求窗口计时器（DED-029）】
  →"谁在下一次危机中受益"的条件命题。这不是AND拼接（"金是好的SOV且
  信用危机会推高SOV需求"→平凡），而是竞争格局的结构性改变（"如果有
  更好的候选，金在下次危机中的受益将被分流"→非平凡）。
  加速效应（honest标注）：信用重定价的作用不只是"给一个时间点"——
  它大幅压缩了赢家通吃的时间尺度。DED-027描述的赢家通吃在没有外部触发时
  是缓慢的（通过代际更替、网络效应逐步锁定）；信用重定价创造了一个
  "所有主体同时重新评估其SOV配置"的集中决策时刻——赢家通吃不是在数十年
  尺度上缓慢运行，而是在信用重定价窗口（数年）内集中表达。这一加速效应
  使竞争结果可在我们这一代人的观测尺度上检验——若竞争仅在百年尺度上展开，
  本条将无法操作化。此加速效应的存在依赖于信用重定价的"同步唤醒"机制：
  储备管理者在信用事件后集中审视其SOV配置，而非在日常平稳期渐进调整。
  诚实标注：加速效应增强了本条的可检验性但不等同于交互级涌现——它修改
  的是赢家通吃的时间参数（快/慢）而非运作逻辑（正反馈锁定的基本机制不变）。

  【Prediction】
  (i) 权重方向性重排——储备配置网络特征（跨辖区对手方风险/超长持有期/
  超大单笔规模/机构验证与披露制度，见weight_protocol的f1–f5）导致六维
  权重相对传统商品货币框架的方向性重排：可携带性重定义且权重↑（物理
  价值密度子维度让位于"网络可携带性"——抗冻结/抗审查/跨辖区自主转移，
  由f1对手方风险驱动）；可验证性重定义且权重↑（从"物理检验难易度"转为
  "不依赖对手方即可独立验证持有"——密码学验证可行性+去信任化程度，
  由f1驱动）；供给稳定性权重↑（超长持有期f2→供给可预测性是核心维度；
  算法化供给规则是传统地质约束之外全新的优势来源）；耐久性重定义
  （从"物理抗腐蚀"转为"协议存续概率/抗攻击韧性/私钥安全模型"的采用度
  无关成分，权重居中，由f2驱动）；同质性权重居中（r1修正：透明账本
  资产有污染币折价/黑名单问题→同质性在数字候选间构成真实差异化维度，
  且当前对金有利——撤回r0"数字天然同质→权重↓"的错误论断）；可分性
  权重↓（两类候选的最小实务单位均远小于最小储备交易单位f3→非约束维度）。
  预测(i)本身不给出"哪个数字资产胜出"——它给出权重重排的方向，使
  特定类型的数字资产（供给规则透明可验证+去信任化+网络可携带性高）
  在重排后的框架下获得比传统六维权重下更高的相对得分。

  (ii) 边际需求分流【基于DED-027射程扩展，本条自担赌注】——若某数字资产
  在重排后的六维加权得分系统性超越黄金
  【且】该资产已获机构级储备配置（≥2个主权国家的央行/主权基金公开披露
  将其纳入储备资产，且配置比例超过其总储备的0.5%），则在下一轮满足
  DED-029 C3触发条件的信用重定价期中，该数字资产将捕获显著份额（操作化
  为>20%）的增量非主权SOV需求——该份额从黄金的增量需求中分流。若下一轮
  信用重定价期发生时上述前置条件均未满足，则预测(ii)的检验窗口尚未打开，
  DED-029的原始预测（C3→金价↑）在该窗口仍为最优可用预测。

  (iii) 黄金天花板下移【基于DED-027射程扩展，本条自担赌注】——长期来看
  （跨多个信用周期），一旦存在一个六维加权得分系统性超越黄金且获机构级
  配置的数字资产，黄金在每次后续信用重定价期中捕获的增量非主权SOV需求
  份额将呈递减趋势——不是因为金本身的属性变差，而是因为数字挑战者分流了
  原本流向金的边际需求。黄金的"信用危机天花板"（信用危机中金价能涨到
  的最高实际价格水平，以不变美元计）将在后续信用周期中下行或持平，而非
  如无挑战者情形那样随全球储备总量增长而上移。本预测失败只砍天花板模块，
  不连带预测(i)(ii)。

  (iv) 逐格判空招牌格【基于DED-027射程扩展，本条自担赌注】——以下格子
  预测为空（若被现实填上则本条证伪）：
  "存在一个六维加权得分系统性超越黄金+已获机构级储备配置的数字资产，
  且发生了满足DED-029 C3触发条件的信用重定价期，但该期增量非主权SOV
  需求仍全部/几乎全部（>80%）由黄金捕获，数字资产捕获份额<5%。"
  该格的空是DED-027赢家通吃+DED-029需求窗口合力的必然推论——
  若需求窗口打开+挑战者得分更高+网络效应正反馈运转，需求不可能
  完全忽视挑战者而全部流向在位者。若该格非空，本条核心机制被推翻。

# === 规则 A：操作化定义 ===

operationalization:
  digital_six_dimension_weighted_score:
    definition: "候选资产在六个维度上的标准化得分 × 数字交换网络特征下的权重向量的内积。六个维度继承BR-L2-021的定义但测量标准针对数字资产重定义。"
    measurement: |
      每维得分0–1标准化（同BR-L2-021方法论），数字资产的各维度测量标准如下：
      (1) 可分性：资产可分割的最小单位 / 总供给单位 → 数字资产天然≈1.0
      （可分至最小通证单位），金≈0.7（受限于铸币/称重的最小实务单位）；
      (2) 耐久性（重定义）：数字耐久性=协议存续概率估计——【只保留采用度
      无关成分】（r1修正，拆除E_network焊点）：协议年龄/Lindy效应、
      抗攻击历史事件记录（已发生攻击的类型与协议存活结果）、密码学假设的
      数学强度（哈希/签名方案的已知攻击面）、私钥安全模型的技术结构
      （多签/社交恢复/冷存储等降低单点故障风险的机制）。
      【显式排除】开发者/节点网络规模等采用度衍生量——节点数随接受者网络
      扩张而增长，是E_network的直接代理，掺入自变量得分将使"六维得分超金"
      的前件被结果侧变量部分决定（违反anti_talisman(4)的物理筛选vs网络
      正反馈防火墙，DED-007型焊点）。诚实代价：剔除后数字耐久性对
      "协议存续概率"的估计力下降（节点分布确实与抗攻击韧性相关），此为
      已知混淆的保守处理——宁可低估挑战者耐久性也不许软循环。
      物理耐久性=化学惰性/抗腐蚀性（金≈1.0）；
      (3) 可携带性（重定义）：物理可携带性=价值密度（金≈1.0，单位重量承载
      极高价值）；网络可携带性=资产在跨境/跨平台/跨司法辖区转移的摩擦——
      数字资产需评估：转移延迟/成本、是否受资本管制、是否可被单方冻结/审查；
      (4) 可验证性（重定义）：传统=物理检验难度（试金石/密度测量→金≈0.9）；
      数字=独立密码学验证的可行性——运行全节点验证的门槛、是否依赖可信第三
      方、共识机制的去信任化程度。关键判据：一个理性主体能否在不依赖任何
      中心化权威的情况下独立验证该资产的真实性与所有权？
      (5) 同质性：任意两单位是否完全可互换。（r1事实修正）透明账本数字资产
      的每一单位携带全部交易历史——被盗币/受制裁地址关联币被交易所冻结、
      场外"污染币折价"、监管黑名单（如2022年对混币协议的制裁）是已记录
      现象→透明账本数字资产同质性【低于】金（估≈0.7–0.85，取决于账本
      透明度与黑名单执行强度）；熔炼后的金物理上不可追溯、完全可互换
      （金≈0.95–1.0）。同质性在数字候选之间（透明账本 vs 隐私账本）
      恰恰构成差异化维度，原"数字≈1.0，金≈0.9"为方向性错误，已撤回；
      (6) 供给稳定性：传统=年产量/存量比+矿脉发现概率（金≈0.95）；数字=
      供给规则的算法化确定性+规则变更的治理门槛——供给规则是否可被少数
      主体单方修改？修改的历史先例？供给上限的数学可证明性？
      每维得分由独立第三方（如材料科学数据库/区块链浏览器/协议文档）确定，
      不得由"该资产当前市值"或"是否已被央行采用"反推。
    weight_protocol: |
      【权重标定pre-registration协议——r1重做声明】
      (0) 方法论出身诚实声明：本协议r0版曾自称"继承自DED-027 Step A/B结构"，
      但实际使用的秩位判据是"候选间差异化程度"（某维度所有候选得分接近→
      秩位降低）——这与DED-027的判据（"局域交换网络特征→权重"，如交易规模↑
      →可分性权重↑）不同源。r1修正：秩位规则改为从竞争实际发生的交换网络
      ——【储备配置网络】——的特征独立推导（回归DED-027原理但规则须重新
      推导，属射程扩展赌注的一部分）；"差异化程度"判据保留为自建辅助规则
      （仅用于压低非差异化维度的秩位），显式标注为本条自建方法、非继承。

      (0b) 裁判权论证——哪个网络的特征拥有为全体候选定权重的权力：
      既非数字转移网络、也非实物金网络——按DED-027自身原理，权重由竞争
      发生地的交换网络特征外生决定。本条的竞争发生在【储备配置网络】
      （各国央行/主权基金的储备资产选择与跨辖区转移网络）——金与数字资产
      在此同台竞争，故由该网络的特征定权重。以数字网络特征为全体候选定
      权重（r0做法）会系统性偏向挑战者主场，已撤回。储备配置网络的特征
      可独立于"谁胜出"观测：(f1)跨辖区转移在制裁/冻结风险下进行（2022
      冻结事件可独立编码）；(f2)持有期为十年–百年尺度（储备资产的代际
      性质，COFER持仓换手率可独立测量）；(f3)单笔配置规模极大（十亿美元
      级）；(f4)机构级验证/托管基础设施存在（审计制度、金库、托管行）；
      (f5)披露制度（COFER申报/年报）。

      Step A（方向约束——从储备配置网络特征f1–f5推导每维权重方向）：
      - f1（对手方风险显著）→"网络可携带性"（抗冻结/抗审查/跨辖区自主
      转移）权重↑；"可验证性"（不依赖外国对手方即可验证持有）权重↑；
      - f2（持有期极长）→耐久性权重↑、供给稳定性权重↑；
      - f3（单笔规模极大）→可分性权重↓——两类候选的最小实务单位均远小于
      最小储备交易单位，该维度在此网络中不构成约束（网络特征论证，
      非差异化论证）；
      - f4+f5（机构验证/披露制度）→同质性权重居中——储备资产须可互换以
      维持市场深度与抵押品资格，污染/黑名单风险直接侵蚀此维度。

      Step B（rank协议——须在不知道哪个候选"最终胜出"的条件下执行）：
      由Step A的特征映射定秩（r1版，撤回r0的差异化定秩）：
      - 网络可携带性 rank≤2（f1）；可验证性 rank≤2（f1）；
      - 供给稳定性 rank≤2（f2）；耐久性 rank=3（f2）；
      - 同质性 rank=4（f4/f5）；可分性 rank≥5（f3，非约束维度——此处
      引用自建辅助规则：该维度候选间亦无差异化）。
      同秩处理规则（预注册）：同秩维度得分取算术平均后作为该秩级得分比较。
      逐级比较：从rank=1秩级开始，差距>δ（δ=0.1）即判胜；≤δ则引入下一
      秩级；所有秩级耗尽仍<δ→"得分接近"→触发赢家通吃动态（DED-027预测ii）。
      不允许在得知哪个候选胜出后调整秩位、同秩规则或δ。
      【秩位结构稳健性规则（r2注册，RF-6——选(b)路线）】：
      r2独立审查实算暴露：裁决不仅对秩级1评分敏感，对秩位结构本身更
      敏感。f2（持有期极长）同时驱动供给稳定性与耐久性，r1版"供给
      稳定性秩1、耐久性秩3"的不对称理由（"候选均须先过供给/转移关"）
      论证强度不足以承担其后果权重——该不对称恰好把金最大的单维优势
      （耐久性1.0 vs 0.55，全六维最大分差）压到比较大概率终止的层级
      之下，构成单点自由度。诚实处理：【撤回该一句话理由的承重地位】，
      不强行补造更强论证（有事后合理化风险），改为注册跨秩位稳健
      取严规则——任何(a1)判定必须同时在两种秩位结构下运行：
      结构I（现行）：秩级1={网络可携带性,可验证性,供给稳定性}，
      耐久性=秩3；
      结构II（替代——f2两个子维度对称处理）：耐久性并入秩级1，
      秩级1={网络可携带性,可验证性,供给稳定性,耐久性}四维均值，
      下一秩级=同质性。
      两种结构的结论不一致→按不利于本条方向判【未系统性超越】。

      Step C（worked example——BTC vs 金，r1按上述协议+修正后测量实际运行）：
      得分（0–1标准化，含r1修正的耐久性/同质性测量；[区间]=可辩护分歧带）：
      - 网络可携带性：BTC 0.9 [0.7–0.9]（自托管跨境转移无需对手方许可；
      折价项：矿池算力集中与OFAC合规区块的协议层审查风险取下界0.7）；
      金 0.55 [0.5–0.6]（境外托管金可被冻结——本国金库金抗没收但跨境
      动员需实物运输）；
      - 可验证性：BTC 0.95（全节点独立验证，无需信任第三方）；金 0.65
      [0.6–0.8]（本国金库+化验可验证，境外持有依赖托管审计=中心化权威）；
      - 供给稳定性：金 0.95（地质存量/年产比稳定）；BTC 0.9 [0.8–0.9]
      （算法上限+区块大小战争中变更派失败=治理门槛已经受考验；折价项：
      远期安全预算问题取下界0.8）；
      - 耐久性（rank 3，修正后采用度无关测量）：金 1.0；BTC 0.55
      [0.5–0.65]（协议年龄17年Lindy尚薄、抗攻击历史良好、密码学假设
      面临远期量子不确定性）；
      - 同质性（rank 4，修正后）：金 0.95；BTC 0.75（污染币折价/黑名单）；
      - 可分性（rank≥5）：BTC 1.0；金 0.7。
      运行（结构I，现行秩位）：秩级1（网络可携带性+可验证性+供给稳定性均值）——
      中位得分：BTC (0.9+0.95+0.9)/3=0.917 vs 金 (0.55+0.65+0.95)/3=0.717，
      差距0.20>δ→【BTC在秩级1胜出，比较终止】。
      保守得分（各BTC折价项取下界、金取上界）：BTC (0.7+0.95+0.8)/3=0.817
      vs 金 (0.6+0.8+0.95)/3=0.783，差距0.034<δ→引入秩级2（耐久性）：
      金1.0 vs BTC 0.55，差距0.45>δ→【金胜出】。
      运行（结构II，替代秩位——r2补跑，RF-6(b)）：秩级1（网络可携带性+
      可验证性+供给稳定性+耐久性四维均值）——
      中位得分：BTC (0.9+0.95+0.9+0.55)/4=0.825 vs
      金 (0.55+0.65+0.95+1.0)/4=0.7875，差距0.0375<δ→引入下一秩级
      （同质性）：金0.95 vs BTC 0.75，差距0.20>δ→【金胜出】。
      即结构II下连中位输入都输出金胜——秩位结构敏感性实算入档。
      【(a1)判定规则汇总（r2一次性注册，RF-7）】：
      (r7a) 保守角规则：未来任何时点判定"六维加权得分系统性超越黄金"，
      凡评分落在已注册可辩护分歧带内的维度，一律按不利于本条方向取值
      ——挑战者取带下界、金取带上界（保守角）。仅当挑战者在保守角下
      仍按协议胜出，才进入下一检查。
      (r7b) 跨结构规则（衔接RF-6）：保守角判定须在结构I与结构II下
      各跑一次，两者均判挑战者胜才判(a1)满足；任一结构下金胜或
      "得分接近"→(a1)不满足。
      (r7c) "系统性超越"的操作定义据此固定 = 跨分歧带稳健（保守角
      仍胜）×跨秩位结构稳健（两种结构均胜）。
      (r7d) 分歧带纪律：分歧带的边界必须由具名的可观测折价项事前锚定
      （现行worked example的做法——矿池集中/OFAC区块/安全预算/托管
      审计等具名折价项——固化为规则）；禁止在得知窗口结果后新增/移除
      折价项或调整带宽；新折价项只能在窗口开启前注册。
      诚实记录（r2更新）：按r7a–r7c，(a1)在2026-07判【未满足】——
      保守角下结构I金胜（秩级2耐久性0.45>δ）、结构II下连中位输入
      金胜（同质性层0.20>δ）。r1"未满足/存争议"的表述据此收紧为
      可判定的"未满足"，消除事后选边空间；与counterexamples第一条
      的既有裁决一致。本worked example不改变本条任何预测的当前触发
      状态（前置条件不满足→预测(ii)无预测，DED-029原始预测仍为
      最优可用预测）。
      Step D（非空洞性演示——协议存在输出"金胜出"的现实输入区域）：
      除上述保守带外，独立的现实输入区域：供给政策经历过多次变更的
      透明账本候选（ETH型：供给稳定性≈0.6、同质性≈0.7、网络可携带性
      ≈0.9、可验证性≈0.9）——秩级1均值 (0.9+0.9+0.6)/3=0.8 vs 金0.717，
      差距0.083<δ→引入秩级2耐久性：金1.0 vs ≈0.5，差距>δ→金胜出。
      即：协议并非"存在成熟去中心化数字资产即挑战者必胜"的重述——
      耐久性与供给稳定性两道闸在现实输入下足以让金胜出。
    limitations: |
      数字资产的六维得分标定尚无公认的标准化方法——当前每维得分的操作化
      定义（如上）是本条的pre-registration，诚实标注其方法论风险：
      (1) 耐久性得分依赖协议存续概率估计——对新协议（<5年）的Lindy效应
      不适用，得分噪声大；(2) 供给稳定性的"治理门槛"评分有主观成分——
      需要独立的事前评分协议（如基于治理代币分布集中度的Gini系数），
      不得事后调整；(3) 权重rank协议的秩位标定在数字网络特征与秩位之间的
      映射尚未经独立验证——当前rank映射是基于机制论证的初始标定，
      其经验校准需未来实证检验。本条不声称权重标定已臻完善——它声称
      权重【变化的方向】是结构性的（数字网络特征→权重方向改变），
      且该方向性关系可在数字资产竞争的实际演进中检验。

  fiat_credit_repricing_period:
    definition: "主权部门与私人部门对主要储备法币未来购买力/可用性的信心发生显著重估的时期——DED-029 C3通道的充分激活窗口。"
    measurement: |
      二值化触发判据（吸取L4-009教训，优先二值化而非连续阈值）：
      以下"对手方风险被证实类事件"（定义同L4-009判据c的核心逻辑）的发生
      即判定为重定价期开启：
      任一主要储备货币发行国对其境外官方储备资产实施冻结、没收、或排除
      出结算体系，且受影响资产的规模 ≥ 全球官方外汇储备总额的1%。
      口径预注册——分子：受影响主权方的央行资产负债表内被冻结/排除的
      储备资产（窄口径，同L4-009的challenger_reserve_allocation窄口径）；
      分母：事件发生年IMF COFER全球官方外汇储备总额（含未分配储备）。
      阈值≥1%的机制理由（继承自L4-009）：触发全球储备管理者集体重估的是
      演示效应——"储备资产可能被对手方控制"——其强度取决于受害方与重估者
      的量级相似度；被冻结资产占全球储备≥1%时，"下一个可能是我"的感知
      足够强以触发体制性重估。
      重定价期持续至：(a)触发性冻结/排除被正式解除且其后连续2年无新触发
      事件；或(b)触发事件存续但其后连续3年央行净购金量回落至触发前5年均值
      附近（±1σ）且替代储备安排份额不再上升。
      【窗口状态登记与新触发规则（r2注册，SF-5）】：
      (w1) 2022窗口当前状态：按上述关闭条件核算——触发性冻结（俄储备）
      在2026-07未正式解除、央行净购金2022–2024连续三年超1000吨未回落至
      触发前均值±1σ→2022重定价期按本条自身口径在2026-07判【仍开启】。
      (w2) 新触发事件规则：开启窗口期间若发生新的、独立满足≥1%判据的
      触发事件→【开启一个新的重定价窗口】（自新事件公告日起计，旧窗口
      读数在该日截断，前置条件满足性以新窗口开启日为判定时点）。机制
      理由：同步唤醒是事件驱动的集中决策时刻，新的对手方风险证实事件
      构成新一轮集中重估，而非旧重估期的延续。裁决方向说明：此规则使
      检验可更早发生（前置条件在长窗口中途满足后不必等旧窗口自然关闭）
      ——是增加本条被证伪机会的反有利方向，非保护带扩张。
      (w3) 保护带后果显式登记：预测(ii)原文要求前置条件"在该重定价期
      开启前已满足"——美SBR（2025.3）发生在2022窗口开启之后，故即使
      第二国配置发生+（a1）满足，2022这个窗口内本条仍"无预测"；检验
      顺延至下一个全新触发窗口（含w2规则下的新窗口）。这是条件命题的
      诚实代价：现实最可能路径（条件在长窗口中途逐个满足）落在无预测区，
      如实入档、不重释。
    limitations: |
      (1) 仅覆盖"对手方风险被证实"类信用重定价——由评级下调、债务上限危机、
      财政赤字担忧等引发的缓慢信用侵蚀不在此二值化判据射程内（这些是
      DED-029 C3通道的连续读数部分，非本条需要的"窗口打开"离散事件）。
      诚实标注：若信用重定价以连续缓变而非离散事件的形式发生（如美元储备
      份额的渐进下滑），本条的"需求窗口"隐喻可能夸大了迁移的集中性——
      此时预测(ii)(iii)的增量需求分流仍可能发生，但将以缓变而非集中的形式
      呈现，检验力的时间精度降低。
      (2) 历史样本中满足此判据的事件极少（1979伊朗冻结≈3%、2022俄罗斯冻结
      ≈2.5%）——判据区分力的真正检验在未来窗口。未来每次对手方风险事件
      都是一次活检验。
      (3) 仅使用对手方风险被证实事件（而非L4-009的多指标复合判据）——
      这是刻意的简化（吸取L4-009判据复杂度过高导致第三次重校准的教训）。
      简化保留了最干净的二值化触发信号。代价：若信用重定价由多因素聚合驱动
      而没有单一离散事件（如央行购金潮+储备多元化+地缘紧张同时升级），
      本条的"窗口打开"二分法可能漏判——此为边界情形，如实标注。

  institutional_allocation:
    definition: "主权国家层面的储备管理者（央行/主权基金/承担储备职能的
    财政部门，机构形态边界见measurement的e1–e3裁决）将数字资产纳入
    其官方储备/战略持有的公开、持续配置。"
    measurement: |
      二值化判据（优先二值化）：
      ≥2个主权国家的央行或主权财富基金公开披露（通过IMF COFER申报/年报/
      官方声明）将同一数字资产纳入其储备资产组合，且每家配置比例 > 其
      总官方储备的0.5%。
      口径预注册：
      - "主权国家"不含个人/企业/ETF/信托持有——必须是央行资产负债表内或
      主权基金官方披露的储备配置；
      - "配置比例" = 该数字资产的持有市值 / 该国总官方储备资产市值；
      - ≥2个主权国家（非≥1个）——排除单一小国的试验性配置噪声；
      - 0.5% 阈值（同L4-009 challenger_reserve_allocation口径）——排除
      象征性/试探性配置（如<0.1%的"研究性持有"）；
      - 配置须"公开披露"——排除未披露的隐性持有（无法独立验证）。
      【机构形态边界事前裁决（r1一次性注册，按机制理由裁决、不按对
      结论有利方向裁决）】：
      (e1) 财政部形态的战略储备（如美国2025年3月行政令设立的战略比特币
      储备，财政部持有、来源为罚没资产）——【计入】。机制理由：本判据
      捕捉的是"主权级储备管理者公开将该资产指定为储备/战略持有"的示范
      效应；机构挂在央行、主权基金还是财政部名下不改变示范效应的运作，
      从窄口径（仅央行/主权基金）排除财政部形态会构成对本条有利的口径
      选择（推迟检验窗口），按L4-009判例反向裁决为从宽计入。罚没来源
      不排除——"持有而不变卖+官方指定为储备"本身即配置决策；但若后续
      被立法/行政决定清算出售，则该国退出计数。
      (e2) 主权基金的非官方披露持仓（如不丹DHI型——持仓主要由第三方
      链上归因推断）——【不计入】，直至该主权基金/政府发布正式官方
      披露文件（持仓规模+储备定位）。机制理由（与limitations一致）：
      隐性/第三方归因的持有无法独立验证，且不构成官方示范行为——
      不产生E_network示范效应，对赢家通吃动态无贡献。一旦正式披露
      即计入（DHI型主权基金的机构形态本身合格）。
      (e3) 披露渠道从宽：COFER申报/年报/官方声明/行政令均算"公开披露"，
      不要求COFER专属渠道。
      当前基线（r1重述，依据e1–e3）：≈1国（美国，经e1计入；其披露的
      持有规模以任一合理的官方储备分母口径计均>0.5%）。不丹经e2暂不
      计入；萨尔瓦多仍不计入（比特币是其法币而非储备资产，且无独立
      央行储备管理框架）。故判据整体（≥2国）在2026-07【未触发】，但
      与r0"基线=0"不同：距触发仅差1国，前置条件(a2)不再是遥远条件。
      未来事件例：任一第二国央行/主权基金/财政部满足e1–e3口径的披露
      →本判据触发。
    limitations: |
      官方储备披露有滞后（季度/年度）与隐匿动机（部分央行不愿披露非传统
      储备构成）——"公开披露"标准可能低估真实配置规模。但本条的检验逻辑
      不要求捕捉全部隐性配置：只有在'公开可验证'的条件下，配置行为才能
      产生E_network的示范效应——隐性配置不产生网络外部性，对赢家通吃
      动态无贡献。故用公开披露作为门槛在机制上是合理的（不仅是数据局限）。

  demand_migration:
    definition: "预测变量——信用重定价期内，增量非主权SOV需求在黄金与
    数字挑战者之间的分配比例变化。"
    measurement: |
      在独立判定的重定价期窗口内，计算以下两个份额并比较：
      【部门口径对称化（r1一次性注册）】两侧分子均按同一部门清单构建——
      官方部门（央行/主权基金/储备职能财政部门的披露增持）+ 私人机构部门
      （受监管基金/ETF/上市公司披露持仓变动）+ 私人零售可识别部分（金条
      金币零售销量 vs 挑战者侧的零售通道净流入可识别部分）。任一部门在
      一侧计入则必须在另一侧计入；挑战者ETF净流入【计入】（与金ETF对称）。
      (a) 金的增量份额 = 窗口内全球金的净投资需求（央行净购金+金条金币+
      黄金ETF净流入，WGC年度数据，以美元计） / 窗口内全球非主权SOV
      的总增量需求（金+数字挑战者+其他可编码的非主权SOV，以美元计）；
      (b) 数字挑战者的增量份额 = 窗口内（官方披露增持 + ETF/受监管基金
      净流入 + 链上标记为机构/主权地址的净流入中未被前两项覆盖的部分，
      以美元计）/ 同一分母。
      【链上机构标记方法论（r1注册）】：数据源=至少两家独立链上分析商
      （如Glassnode/Chainalysis类）的实体标记交集；判定规则=仅采用
      "已验证实体归因"（交易所冷钱包/托管商/已公开披露实体），排除
      启发式聚类的"疑似机构"标签；两家标记分歧的地址不计入分子（保守
      处理）；标记快照须在窗口判定前后各取一次，禁止用窗口结束后回溯
      重标的数据（标记热度随价格叙事变动是已知污染源）。若无满足上述
      规则的数据，挑战者分子退化为"官方披露+ETF/受监管基金"两项
      （低估挑战者份额→对本条主张不利，保守方向）。
      预测(ii)：如果数字挑战者的前置条件（六维得分超金+获机构级配置）在
      该重定价期开启前已满足→预期 (b) > 20%；若前置条件未满足→无预测。
      【5–20%中间带裁决（r1一次性注册）】：若前置条件满足且窗口内
      挑战者捕获份额落在5%–20%之间——预测(ii)的份额模块【被推翻】
      （>20%是预测(ii)的字面承诺，未达即失败，不得事后重释为"部分
      成功"）；核心机制（分流存在性）另由<5%死线单独裁决——份额≥5%
      则分流存在性存活、本条降格保留分流方向命题，份额<5%则触发
      falsifiability(a)的招牌格证伪。
      预测(iii)：跨多个信用周期的 (a)/(b) 趋势——若前置条件持续满足，
      (a) 应呈递减趋势。
      分母口径预注册：非主权SOV=那些价值不依赖于任何中心化对手方履约承诺
      的资产。金的对手方风险≈0（无发行者）；完全去中心化的数字资产（无
      发行者/管理者的协议）对手方风险≈0；由中心化实体发行/管理的数字资产
      （如USDT/USDC稳定币）的对手方风险>0 → 不计入非主权SOV分母。
      此分类判据在测量之前可独立执行（不需要知道价格/流量结果）——
      对手方风险是否≈0可基于资产的技术/法律结构事前判定。
    limitations: |
      分母构建需要界定"非主权SOV"的边界——实物房地产/艺术品的"SOV"成分
      难以从"使用/消费"成分中干净分离（有一套房子住 vs 买来纯粹保值）。
      实操建议：以金融资产口径为主（金+数字资产+主权基金另类资产中
      与对手方无关的部分），实物资产暂不入分母——低估分母→高估份额→
      对"需求迁移"主张不利（更难达到>20%的门槛），是保守性偏差。

# === 推导 ===

derivation:
  from_l3:
    deductions: [DED-027, DED-029]
  from_l1:
    axioms: [AXIOM-001, AXIOM-002, AXIOM-003]
    theorems: [THEOREM-value-attribution, THEOREM-exchange-competition-alternative,
               THEOREM-relation-information-asset, THEOREM-cooperation-precondition]
  from_l2:
    bridging: [BR-L2-021, BR-L2-022, BR-L2-024]
  from_l4: []
  steps: |
    1. 父机制摘要
       DED-027：交换网络中单一一般等价物的涌现是结构必然（E_network正反馈），
       但具体哪种商品胜出由六维物理筛选的局域加权得分决定。赢家通吃：得分
       接近的两个候选不能长期稳定共存。技术冲击可通过权重重排改变胜出者。
       DED-029：金价波动几乎全由E_network驱动（V≈E×S，U≈0），E_network
       随四个独立测度引擎伸缩——实际利率(−)/通胀预期(+)/法币信用(−)/
       不确定性(+)。法币信用(C3)下降→价值储藏从主权资产逃逸至非主权资产。
       单因素阶段显式让渡多因素交互给L4。
       DED-027的射程声明："适用区间：商品货币时代的自发交换网络（无中央银行
       /法定货币/固定兑换率的制度强制）；现代法币体系不在射程内"。本条以
      射程扩展使用，标注"自担赌注"。

    2. 交互逻辑——竞争规则 + 需求窗口 = 挑战者取代条件
       第一步：权重重排（DED-027机制的数字网络扩展）
       DED-027确立"各维度权重由局域交换网络特征外生决定"。数字交换网络
       的特征（零物理运输成本、密码学验证、协议化供给规则）与物理交换网络
       有系统性差异→六维权重的方向发生系统性重排（见operationalization的
       weight_protocol Step A）。这是本条的第一个非平凡扩展：DED-027的
       prediction (iii)（技术冲击换主）只设想了"单维度供给参数改变"（电解法
       改变铝的供给稳定性），未设想过"交换网络介质本身的改变导致全部六个
       维度的测量标准与权重同时重排"。本条断言：从物理交换网络到数字交换
       网络的迁移本身构成一次"元技术冲击"——它不改变任何单一维度的参数，
       而是改变了筛选框架的权重结构。

       第二步：需求窗口（DED-029 C3通道的重新解释）
       DED-029的C3通道说"法币信用下降→非主权SOV需求↑→金价↑"。最后一步
      的"→金价↑"依赖一个隐含假设：金是唯一（或至少是默认的占优）非主权
      价值储藏候选者。该假设在DED-029写作时（2026年的世界状态下）几乎为真——
       没有任何其他非主权资产具备金的市场深度与历史E_network。但该假设不是
       DED-029 formal statement的演绎结果——formal statement只说E_network扩张
       导致金价上升，未断言E_network只能扩张到金上。本条将该隐含假设提取
       为可检验命题：C3通道打开的"需求窗口"本身是候选中性的——它增加的是
       对"非主权SOV"这一【类别】的需求，具体哪个候选受益取决于该类别内
       各候选的相对竞争力（由DED-027的筛选框架决定）。

       第三步：合成——挑战者取代的条件命题
       [DED-027的筛选规则] × [DED-029的窗口计时器] → 以下条件命题：
       若重排后的六维加权得分(数字挑战者) > 六维加权得分(金)，则在信用
       重定价期（DED-029 C3窗口）打开时，增量非主权SOV需求将不成比例地
       流向得分更高的挑战者。理由：(a) 窗口打开后所有储备管理者同时审视其
       SOV配置→新进入者（数字挑战者）不需要在日常平稳期中逐个说服储备
       管理者（那太慢）；(b) 窗口期的决策是"我从主权资产跑出来，去哪？"——
       在候选之间做横向比较（而非在"维持现状 vs 改变"之间犹豫），这有利于
       得分更高的候选者展示其优势；(c) DED-027的赢家通吃意味着：一旦挑战者
       在窗口期内获得初始配置→E_network正反馈启动→后续配置加速→在位者
       的增量份额被挤压。

       第四步：加速效应——窗口如何压缩赢家通吃时间尺度
       DED-027描述的赢家通吃是一个缓慢的代际过程（物理交换网络中，新媒介
       取代旧媒介需要数百年——如金取代贝币）。信用重定价期的"同步唤醒"
       效应压缩了这一时间尺度：所有主体在信用事件驱动下同时重新评估SOV
       配置，而非在平稳期渐进调整。这对本条的可检验性至关重要——
       若无此加速效应，挑战者取代在位者可能需要50–100年，本条预测将无法
       在我们这一代人的观测窗口内检验。诚实标注：加速效应的幅度是否能将
       百年压缩至数年，取决于信用重定价事件的严重程度与数字挑战者的E_network
       初始强度——本条不做精确时间预测，只做方向+份额预测。
       自建前提清单（r1登记，SF-2）：本条有两个不来自任何父推论的自建
       前提——(自建1)"同步唤醒/集中决策时刻"行为假设（储备管理者在信用
       事件后集中审视SOV配置），承担加速效应；(自建2)"获机构级配置"
       调节变量（消耗调节变量预算1个）。已知反向证据登记：白银的储备
       退位跨数十年完成、未因任何单次信用窗口（含1979–80）集中完成——
       对"同步唤醒可将取代压缩至数年"构成温和反向证据，加速效应的幅度
       是开放经验问题（见审查档ce_2）。

    3. 涌现论证——为什么是conjunction级涌现
       DED-027单独：拥有完备的竞争规则框架（筛选+赢家通吃+技术冲击换主），
       但不拥有"信用重定价期"这一概念——该概念是法币信用体系的产物，
       在DED-027自宣的商品货币时代射程外。DED-027可以讨论"如果某候选的
       加权得分超越在位者，它将渐渐取代在位者"，但不能讨论"什么时候加速、
       由什么触发"——它无法区分"渐进取代（数百年）"与"窗口期取代（数年）"。
       DED-029单独：拥有完备的需求触发框架（四个引擎+E_network通道+单因素
       边界），但不拥有"竞争者"的概念——它把非主权SOV候选池简化为单一
       元素（金）。在DED-029的世界里，"法币信用下滑→金价涨"是单调的——
       有没有数字挑战者它不关心，因为数字挑战者不在其分析框架内。
       合成贡献：DED-027提供"谁是更好的候选"的裁判框架；DED-029提供"什么时候
       换裁判的哨响"——信用重定价的窗口是"所有人同时重新审视SOV配置"的时刻。
       这不是"金是好的SOV AND 信用事件推高SOV需求"（平凡合取）——这是
       "如果有了更好的候选，信用事件推高的SOV需求不再理所当然地归金"——
       一个DED-029在无DED-027时【不会做出】、DED-027在无DED-029时
       【无法定时】的预测。

    4. 多父逐格判空
       核心2×2：法币信用体制{平稳期, 重定价期} × 数字挑战者六维加权得分
       vs 金{≤金（含无挑战者）, >金且获机构级配置}。
       被预测量=信用重定价期的增量非主权SOV需求在二者之间的分配。

       格[平稳期, ≤金]：无竞争压力+无需求窗口。金稳定占据非主权SOV主导
       地位。DED-027单父给出（加权最优者胜出→金在位）且DED-029给出
       （平稳期C1主导→金价随实际利率走，无E_network剧烈扩张）。
       → 平凡格（两父各自覆盖，无合力需求）。

       格[平稳期, >金且获配置]：得分更高的挑战者已存在，但无信用重定价
       触发窗口。DED-027 prediction (iii)预测"技术冲击（此处为权重重排）→
       胜出者可能换主"——DED-027单独给出方向（挑战者最终会胜出）。但
       DED-027无法给出时间尺度——是10年还是200年？本条补：在无信用重定价
       触发的情况下，取代将是缓慢的（代际尺度），因储备管理者在平稳期无
       集中动力重新审视其SOV配置→渐进调整而非窗口期集中迁移。
       → 半合力格：DED-027给方向，本条（通过DED-029的机制逻辑——平稳期
       无集中决策触发→缓慢取代）给时间尺度的定性区分。但方向的预测
       主要是DED-027的。

       格[重定价期, ≤金]：信用窗口打开，金仍是加权最优→增量需求流向金。
       DED-029单父给出方向（C3→E_network扩张→金价↑）。这是DED-029的
       标准预测场景。→ 平凡格。

       格[重定价期, >金且获配置]：【招牌格——需DED-027 + DED-029合力】
       信用窗口打开+挑战者得分更高→增量非主权SOV需求分流至挑战者。
       - DED-027单独：不知道"窗口打开"何时发生，无法回答"这个信用周期
       还是下个信用周期"；
       - DED-029单独：在此格的默认预测是"C3→金价↑"（因为DED-029假设金
       是唯一的非主权SOV受益者），该预测与本条相反——本条断言DED-029的
       默认预测在此格被挑战者条件覆盖。
       两条父推论均不能单独给出本格的完整预测：DED-027无窗口概念，
       DED-029无挑战者概念。且DED-029的【显式沉默】在此格暴露——
       DED-029从未断言"金是唯一受益者"，但它也未考虑"如果有更好候选"的
       情形——本条填上这个沉默格。→ 需要≥2父合力。

       预测(iv)的空格声明（防不可证伪）：格[重定价期, >金且获配置]的
       子格——"挑战者得分更高且获配置且信用窗口打开，但增量需求仍
       全部/几乎全部（>80%）流向金，挑战者捕获<5%"——预测为空。
       若该子格非空，证伪核心机制。

       挑战者维度不计入合力格数的附加格（第三轴）：数字资产获机构级配置
       是一个额外的前置条件（非承重父推论的自变量）——它不来自DED-027或
       DED-029，而是本条的调节变量。加上它后产生2×2×2的8格，但本条以
       2×2为核心判据表，"获机构级配置"作为预测(ii)的显式前置条件而非
       第三轴（简化笛卡尔积，吸取L4-009操作化过于复杂的教训）。

# === 涌现论证 ===

emergence_demonstration:
  emergence_type: conjunction  # 薄涌现——两条父推论各自独立给出机制，合成产生新命题；信用重定价触发不修改赢家通吃机制本身，只压缩其运作时间尺度
  necessity: |
    去掉DED-027 → 失去竞争规则框架。"谁得分更高"的裁判标准消失，"赢家
    通吃"的收敛动力学消失，"技术冲击可换主"的逻辑前提消失。剩余DED-029
    只能给出"信用重定价→非主权SOV需求↑→金价↑"——永远无法推出"需求
    可能流向非金候选"。核心预测(ii)(iii)全部塌掉。
    去掉DED-029 → 失去触发时机框架。"什么时候需求窗口打开"的计时器消失，
    "C3通道→非主权SOV需求扩张"的机制消失。剩余DED-027只能给出"如果
    得分更高，最终会胜出——但不保证何时、多快"——预测(ii)(iii)失去
    时间锚定，退化为"迟早会发生"的不可操作命题。核心预测(ii)(iii)塌掉
    或被推至不可检验的遥远未来。
    DED-029承重范围诚实缩窄（r1，SF-1）：本条实际承重的是DED-029的
    C3通道方向+E_network通道统一性（"所有引擎走同一通道"支撑本条
    "窗口是候选中性的"延伸——窗口作用于非主权SOV类别而非特定资产）；
    DED-029的四引擎结构与四轴测度正交性在本条中不承重。与BR-L2-024
    的承重边界：BR-L2-024仅给"法币信用下降→替代储藏需求变化"的L2级
    方向命题，无E_network通道统一性论证——候选中性延伸须以DED-029
    为父，BR-L2-024不可顶替。
    结论：两条父推论各自承重，无观众砖。
  novelty: |
    以下命题不在任何单条父推论中，也不是父推论结论的AND/OR拼接：
    (a) "数字交换网络的特征导致六维筛选权重的系统性方向重排"——
    这是一个独立于两条父释论的中间命题。DED-027的prediction (iii)只讨论
    单一维度的供给冲击（电解铝），不讨论交换网络介质本身的改变导致的
    权重结构重排。DED-029完全不涉及筛选框架。此命题是DED-027机制逻辑的
    外推应用，但其具体内容（哪些维度权重↑/↓）不在DED-027中。
    (b) "下一次信用重定价期中，非主权SOV增量需求的受益者不再理所当然
    是黄金——取决于挑战者的相对六维得分"——DED-029的单因素预测(C3→金↑)
    在本条的条件（挑战者得分超金+获机构配置）下被覆盖改写。这不是DED-029
    的否定——DED-029从未声称金是"唯一"受益者——而是对其隐含假设的显式
    提取与条件化修正。
    (c) "黄金在信用危机中的天花板因数字挑战者的存在而结构性下移"——
    这不是"金有竞争者"（那太平凡——任何资产都有竞争者），而是"竞争者
    改变了DED-029所描述的金-信用关系本身"——该关系（C3→金价↑）在
    挑战者得分超金后不再是单调的。DED-029没有挑战者维度，无法推出此命题；
    DED-027没有信用重定价维度，也无法推出此命题。
    (d) 招牌格的逐格判空：格[重定价期, >金且获配置]在DED-029的默认框架
    下预测"金受益"——本条预测"挑战者分流"——这是两个相反的方向预测
    （对同一个被预测量——增量非主权SOV需求的流向——的不同方向预测）。
    这种"同格不同向"的预测冲突是涌现的最强证据：不是"两个方向加在一起"，
    而是"一个推翻了另一个"。
  multi_parent_cells: |
    2×2核心判据表（信用体制{平稳, 重定价} × 挑战者得分 vs 金{≤金, >金}）：
    - [平稳, ≤金]：平凡格，DED-027 + DED-029 各自覆盖  (0父合力)
    - [平稳, >金]：半合力格，DED-027给方向，本条借DED-029机制逻辑补时间尺度 (0–1父合力)
    - [重定价, ≤金]：平凡格，DED-029单父覆盖  (0父合力)
    - [重定价, >金]：招牌合力格*（带射程外星号——DED-027腿站在其自宣
      射程"商品货币时代自发交换网络"之外，现代央行储备配置域的适用性
      是未经父推论验证的外推，本条自担赌注），需DED-027 + DED-029
      双父合力 (2父合力*)
    → 至少1个格需要≥2父合力（实际是招牌格的双父合力），但该格为星号格：
    涌现最低门槛的满足经由METHODOLOGY emergence_to_status_mapping
    条件(b)（核心涌现属性依赖桥接前提承重——此处桥接前提=DED-027六维
    筛选+赢家通吃在储备配置域的射程扩展，其论据为域的结构相似性：储备
    资产选择无法定强制、各主体自主配置→自发选择网络）满足，而非默认
    通道。合力格数=1（星号格），state ceiling: verified（薄涌现验证）
    的成立理由据此为"conjunction + 1个星号合力格 + 桥接前提"（r1修正，
    原理由"conjunction+1格"已撤回）。有先例：L4-005自建桥接前提诚实
    标注后成立。

    对招牌格的归属分析（防自欺）：
    DED-027在此格能给出什么？→"如果新候选得分更高，它最终会胜出"——
    但"最终"没有时间定义，且DED-027是在商品货币时代射程内说这句话的——
    对现代央行储备配置域，DED-027自宣出射程。
    DED-029在此格能给出什么？→"C3→非主权SOV需求↑→金价↑"——但这是
    在"非主权SOV≈金"的隐含假设下。DED-029的formal statement不含此假设
    的否定或确认——它只是未讨论"如果该假设不成立会怎样"。
    单父无法给出本格完整预测的具体理由：
    - DED-027不知道"什么时候"（哪个信用周期）发生取代——缺失DED-029
    的窗口计时机制；
    - DED-029不知道"被谁"取代——缺失DED-027的候选筛选框架。
    故本格预测必须是双父合力的。

    挑战者维度不计入合力格声明：数字资产的"获机构级配置"前置条件不来自
    任何父推论——它是本条的调节变量（来源于"没有机构采用→没有E_network
    正反馈→得分高只是理论优势"的机制论证）。按METHODOLOGY的调节变量预算，
    消耗1个配额，剩余1个。

# === 可证伪性 ===

falsifiability: |
  本推论在以下条件之一满足时被证伪或降格（按致命程度排序）：

  (a) 【一锤定音裁决点——招牌格被填上】
  出现同时满足以下全部条件的窗口，而增量非主权SOV需求仍全部/几乎全部
  （>80%）流向黄金、数字挑战者捕获<5%：
  (a1) 六维加权得分(数字挑战者) > 六维加权得分(金)——由独立于结果
  的物理/数字属性测定（见operationalization），不由资产价格/市值反推；
  (a2) 该数字挑战者已获机构级储备配置——≥2个主权国家央行/主权基金
  公开披露配置 > 其总储备的0.5%；
  (a3) 发生了满足预注册判据的信用重定价期——主要储备货币的对手方风险
  被证实事件（≥1%全球官方储备的冻结/排除）；
  (a4) 该重定价期窗口内，增量非主权SOV需求的金捕获份额 > 80%。
  —→ 若上述四个条件同时满足，本条核心机制（DED-027筛选+DED-029窗口
  →需求分流）被推翻。——> 本条 rejected。

  (b) 六维权重重排的方向性预测被系统性地推翻——
  在实际数字资产竞争格局中，被广泛采用为价值储藏的某个数字资产，
  其在"独立可验证性"和"供给稳定性"两个维度上的得分系统性低于其
  被淘汰的竞争者（即：胜出者恰恰是在预测(i)声称"权重应上升"的维度上
  得分更低者）。→ 预测(i)被推翻，权重重排的机制论证失实。
  注意：(b)需要"被广泛采用为价值储藏"的事实确立后检验——在此之前，
  预测(i)仅提供方向性框架。被(a)推翻更致命。

  (c) 赢家通吃失效——在重排后的六维框架下得分接近（所有维度耗尽，
  加权得分差距<δ=0.1）的两个数字资产或数字资产与金，在一个连通的
  全球储备配置网络中长时段（>10年）稳定并行充当顶级非主权SOV，
  各自捕获的增量需求份额无收敛趋势。→ DED-027的赢家通吃在此域失效，
  连带本条承重机制被削弱。

  (d) 【射程扩展被拒——不杀核心但砍天花板】
  若挑战者（得分超金+获机构配置）存在，但后续多次信用重定价期中金的
  增量需求份额未见递减趋势（跨3次以上可编码信用重定价期，金的增量
  份额无单调下降或统计学上无显著负趋势）→ 预测(iii)天花板模块被推翻。
  核心预测(i)(ii)不受影响——即使天花板不下移，需求分流仍可能发生
  但只是"一部分"而非"递增的一部分"。预测(iii)失败只砍天花板命题，
  本条从预测(iii)退回到预测(ii)的较弱形式。

  (e) 【调节变量必要性被否定——操作化问题非机制问题】
  若"获机构级配置"（调节变量）被证明不是需求分流的必要条件——
  即挑战者在【未】获机构级配置的情况下，于信用重定价期中仍捕获了
  >20%的增量非主权SOV需求——则本条高估了机构级配置的门槛重要性，
  调节变量应被移除。这不推翻核心机制（需求分流仍发生了），但揭示了
  操作化的保守性偏差。

  anti_talisman_clause: |
    【防不可证伪护身符——五条硬约束】
    (1) 六维权重的标定必须事前独立完成——每维得分由资产的技术/物理属性
    独立测定（金的密度/化学惰性/地质存量→物理测量；数字资产的共识机制/
    供给代码/节点分布→技术分析），不得由"该资产当前市值更高"或
    "该资产已被更多央行配置"反推其得分。
    (2) 信用重定价期的判定必须由独立于金价与数字资产价格的指标执行——
    对手方风险事件是否发生（可编码的离散事件：冻结/排除/没收储备资产的
    公告日期+规模）不由金价或数字资产价格反推。不得因"金价涨了"就说
    "信用重定价期来了"——信用重定价期是自变量（触发条件），金价/数字
    资产价格行为是因变量。
    (3) 增量非主权SOV需求的金vs挑战者份额分配，必须由独立的需求侧数据
    计算（央行购金吨数/WGC数据/链上机构地址净流入），不得由价格变动
    反推需求——不得因"金价涨得多"就说"需求肯定去了金那里"——
    价格变动受供给弹性（DED-030的S/F结构）与计价单位效应等混淆。
    (4) 挑战者得分"系统性超越"金需要所有六个维度均完成独立标定并执行
    weight_protocol的rank比较——不得因某个数字资产涨得多或市值大就声称
    其"六维得分高"。市值/价格反映的是E_network的现状而非物理/数字属性
    的固有得分——这正是DED-027框架区分"物理筛选"与"E_network正反馈"
    的核心贡献，不得在此混淆。
    (5) 本条的核心预测（招牌格需求分流）的检验窗口取决于未来事件——
    信用重定价期与数字资产机构级配置均为未来可能事件，其发生时间
    不受本条控制。若20年内无满足预注册条件的窗口出现，本条不应被
    标记为"已证伪"（因为检验条件未满足），但应被标记为"长期不可检验→
    降格为candidate/weakly_verified"，并如实记录——一个无法在合理时间
    尺度上检验的预测不是科学命题。此条款是波普尔式科学哲学要求，非护身符。

# === 排除的结果 ===

excluded_outcomes:
  - outcome: "金价的具体点位或数字资产的具体价格——本条只预测增量非主权SOV
    需求的流向（份额），不预测价格。价格的绝对水平受供给弹性(DED-030)、
    计价单位效应、市场微观结构等多重因素影响，不在本条射程。"
  - outcome: "两个以上数字资产之间的竞争格局——本条只处理'数字挑战者 vs
    黄金'的二元竞争。数字资产之间的内部竞争（如BTC vs ETH vs 央行数字货币
    vs 其他数字资产）是DED-027框架在数字域内部的进一步应用，需独立推论。"
  - outcome: "央行数字货币(CBDC)对黄金的替代——CBDC是主权负债（发行方=
    中央银行→存在对手方风险），按本条operationalization的非主权SOV定义
    （对手方风险≈0），CBDC【不】属于非主权SOV候选池。CBDC与金的竞争
    走DED-029的C3通道（法币信用），不属于DED-027框架下的非主权SOV竞争。"
  - outcome: "数字挑战者完全取代黄金成为'唯一'非主权SOV——本条预测的是
    增量需求分流（金的边际受益下降），不是存量替代（既有金储备被抛售
    换数字资产）。DED-030指出的金存量厚度（约20万吨地上存量）意味着
    存量替代需要远超本条射程的更大规模与更长时间。"
  - outcome: "平稳期（非信用重定价期）的需求分配——DED-029的C1（实际利率）
    在平稳期主导金价，此时非主权SOV之间的竞争由C1的机会成本逻辑而非
    C3的逃逸逻辑驱动。本条只覆盖C3窗口打开时的需求分流，平稳期的竞争
    格局由DED-029的C1/C2/C4框架覆盖。"

