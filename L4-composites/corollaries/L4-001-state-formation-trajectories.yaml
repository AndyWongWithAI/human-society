id: L4-001
type: composite_deduction
layer: L4-composites
deduction_form: composite
status: verified*
term: "国家形成轨迹：从流寇到国家的多条路径 (State Formation Trajectories: Multiple Paths from Roving Bandits to States)"
claim_type: trajectory_prediction

人话摘要: |
  流寇变坐寇只是第一步——坐寇最终交出制度型国家、采掘型帝国、还是退化回碎片化，
  取决于三股力量的同时拉扯：外面有没有敌人、税是从商人身上收还是农民身上收、
  个人权力能不能跨过制度化门槛。三条路的分叉口，立着这三个条件的不同组合。

statement: |
  【Composite claim】
  国家形成不是一条路而是多条。流寇变坐寇(DED-012)之后，最终长成什么样的国家
  （竞争制度型/采掘型稳态/碎片化军阀均衡），由三个前件的交互决定：
  (a) 坐寇是否面临可信外部竞争(DED-003)、
  (b) 税基是商业流还是农业存量(DED-006——商业需要非人格化制度撑交换网络)、
  (c) 统治者个人化权力能否跨过制度化门槛(DED-010)。
  三条父推论的交互产生一个分叉树：
  - 外部竞争 + 商业税基 → 竞争制度型国家（统治者必须让权换税）；
  - 外部竞争 + 农业税基 → 采掘型稳态（只需榨取、不需制度）；
  - 无外部竞争 → 制度化动机归零、坐寇退化或内爆。

  【Parent mechanisms】
  DED-012(坐寇化): 控制地盘固定 + 可再生税基 → 流寇变坐寇——给出"有了固定统治者"这一起点。
  DED-010(权力制度化): 纯人格化统治过了规模天花板必须制度化——给出"必须变"的压力。
  DED-006(非人格化制度): 交换网络超出信任半径 → 非人格化制度涌现——给出"制度往哪儿长"的方向
    （商业税基需要非人格化制度、农业税基不需要）。
  DED-003(外部竞争→凝聚): 外部对手的存在 → 内部凝聚力维护成本降低 → 统治者有动机建设制度
    （为战争筹款/征兵需要制度能力）——给出"有没有动机让权/建制度"的条件。

  【Emergent property】
  三条父推论的交互产生了一个分叉树——这不是任何单条父推论能预测的：
  (i) 商业税基 + 可信外部威胁 → 统治者让渡权力、建立非人格化制度的概率显著高于其他组合
      → 竞争制度型国家（ruler concedes power for tax）；
  (ii) 农业税基 + 可信外部威胁 → 采掘型稳态（强税敛、弱制度）的概率最高
      → 只需榨取、不需非人格化制度；
  (iii) 无外部威胁 → 无论税基类型，长期制度退化或内爆
      （因 DED-003: 无外压 → 凝聚动机归零 + 统治者无让权动机）；
  (iv) 逐格判空: "无外部竞争 + 商业税基 + 长期保持强非人格化制度"这一格预测为空。

  【Prediction】
  (i) 商业税基(commercial flow) + 可信外部威胁(credible external competition)
      → 竞争制度型国家(competitive-institutional state):
      统治者必须"让权换税"——商人阶级的流动性(bargaining power) + 战争对制度能力的需求
      → 代议机构、法治、非人格化契约执行。
  (ii) 农业税基(agricultural stock) + 可信外部威胁
      → 采掘型稳态(extractive steady-state):
      税基缺乏流动性与议价能力、不需要非人格化交换制度
      → 强税敛机器 + 弱制度约束 + 高展示维持(DED-010的递增展示路径)。
  (iii) 无外部竞争(no credible external threat)
      → 制度化动机归零 → 无论税基类型，长期坐寇退化或内爆:
      要么被DED-010的递增展示成本压垮(碎片化)，
      要么维持低水平均衡(军阀割据、封建碎片化)。
  (iv) 逐格判空(招牌空格): "无外部竞争 + 商业税基 + 长期维持强非人格化制度"
      这一格预测为空——DED-003说无竞争则无建制度的动机，
      DED-006说商业税基需要非人格化制度但不会在无动机时自发产生。
      若发现此类案例(如无外敌的商港城邦长期维持法治与契约执行)，
      → 空格被填 → L4核心被证伪或需修正(可能DED-003的外部竞争可被内部合法化替代)。

# === 规则 A：操作化定义 ===

operationalization:
  tax_base_type:
    definition: |
      【自变量之一/方向决定量】统治者所抽取税基的主导类型，
      落在"商业流(commercial flow) ↔ 农业存量(agricultural stock)"的连续谱上。
      商业流: 可移动的、对制度敏感的税基——贸易税、关税、工商业利润，
      其税基持有者具流动性(资本/人可迁移)、交换依赖非人格化制度(BR-L2-010)。
      农业存量: 不可移动的、对制度不敏感的税基——土地税、人头税、粮食贡赋，
      税基持有者被绑定于土地、交换主要靠人际信任即可。
      这是DED-006的核心自变量在L4中的落地——税基类型决定了"制度往哪儿长"。
    measurement: |
      由独立结构事实测: 财政收入中贸易税/关税/工商业税 vs 土地税/人头税/粮食贡赋的占比;
      经济的商业化程度(货币化水平、市场网络广度);
      税基持有者的地理流动性(商人 vs 农民)。【不得】用"是否已出现非人格化制度"反推税基类型
      (anti-talisman: 否则循环——"有制度→必商业、没制度→必农业")。
    limitations: |
      连续非二值; 混合税基常见(农业帝国也有商业税)，按主导成分标注;
      税基类型可随时间变化(如从农业转为商业)，须测【当期】主导类型。

  external_competition_pressure:
    definition: |
      【自变量之二/动机条件量】坐寇是否面临可信的外部竞争威胁——存在明确的、
      被统治者感知为生存威胁的外部对手。这是DED-003的核心自变量在L4中的落地。
    measurement: |
      三维度(任一满足即计为"存在"):
      (a) 军事威胁: 存在领土争端或军事对峙(独立于统治者主观宣称，由边境兵力部署/
          战争频率/军事开支占比独立测);
      (b) 制度竞争: 存在邻国的替代性制度模式且本国内部有群体可"用脚投票"或效仿;
      (c) 生存性经济竞争: 存在被广泛感知的经济竞争对手且竞争结果影响政权存续。
      通过军事开支占比、战争频率、精英言论中外部威胁占比独立测，
      【不得】用"是否建了制度"反推竞争压力大小。
    limitations: |
      "可信"是程度量，非二元; 被感知但实际不存在的威胁也可驱动制度(重要的是感知而非客观);
      威胁的类型(军事 vs 经济 vs 制度)可能影响驱动的制度类型——此为L4的内部细化问题。

  institutional_threshold_crossed:
    definition: |
      【中间态/中介变量】统治者是否已从纯人格化支配跨入制度化——
      权威从"怕这个人"转为"怕这个位子/这条规矩"(DED-010的核心被预测量在L4中的落地)。
      这是DED-010的二选一结果: 递增展示(A) vs 制度化(B)。
    measurement: |
      结构签名(同DED-010):
      成文继承规则的存在、职位制/官僚制的在场、非人格法律执行、
      "统治者死亡时权威是否随位子平移"(the king is dead, long live the king)。
      【不得】用"国家存续"反推制度化程度(DED-004循环)。
    limitations: |
      混合态常见(个人崇拜 + 官僚制并存); 制度化是程度量; 跨过门槛≠完全制度化。

  state_type_outcome:
    definition: |
      【被预测量/复合输出】国家形态——由两个正交维度合成:
      (1) 税敛强度(tax extraction intensity): 统治者从社会抽取资源的规则化程度与占比;
      (2) 制度约束度(institutional constraint): 非人格化制度对统治者专断权的约束程度。
      交叉产生三种理想型:
      - 竞争制度型: 高税敛 + 高制度约束(统治者让权换税，代议/法治)
      - 采掘型稳态: 高税敛 + 低制度约束(强税敛机器、弱制度)
      - 碎片化/退化: 低税敛 + 低制度约束(军阀割据、封建碎片化)
      注意: 高制度约束 + 低税敛(如小型共和城邦)不在本推论射程(坐寇前件不成立)。
    measurement: |
      税敛强度: 财政收入/GDP(或等价物)、税率规则化程度、
      征取的制度化(官僚征税 vs 包税/掠夺)。
      制度约束: 代议机构的存在与实权、法治(统治者是否受法律约束)、
      契约执行的非人格化程度、权力交替的规则化(选举/继承法 vs 政变/清洗)。
      两维独立测、正交——不得用同一来源判定两者。
    limitations: |
      理想型，现实为混合态; 按主导形态标注; 税敛与约束不一定单调共变。

# === 推导链 ===

derivation:
  from_l3:
    deductions: [DED-012, DED-010, DED-006, DED-003]
  from_l1:
    axioms: [AXIOM-001, AXIOM-002, AXIOM-003]
    theorems: [THEOREM-conflict-cost, THEOREM-power-signal-decay,
               THEOREM-relation-information-asset, THEOREM-group-identity-decay,
               THEOREM-cooperation-precondition, THEOREM-exchange-competition-alternative]
  from_l2:
    bridging: [BR-L2-003, BR-L2-008, BR-L2-009, BR-L2-010, BR-L2-004, BR-L2-006]
  steps: |
    1. 父机制摘要
       DED-012(坐寇化): 领地固定性 + 可再生税基 → 流寇变坐寇，
       给出"有了固定统治者"这一起点——暴力垄断者内生演化出抽税-供秩序契约。
       但DED-012只到此为止，不预测坐寇之后国家长成什么形态。
       DED-010(权力制度化): 纯人格化支配的维持成本随规模发散 →
       在天花板处二选一: 递增展示(A) or 制度化(B)。给出"必须变"的压力。
       但DED-010不说制度化【往哪个方向走】。
       DED-006(非人格化制度): 交换网络超出信任半径 →
       非人格化制度涌现(当净收益>制度成本)。给出"制度往哪儿长"的方向:
       商业税基需要非人格化制度(契约/法庭/货币)、农业税基不需要(人情/声誉足够)。
       DED-003(外部竞争→凝聚): 外部对手存在 → 内部凝聚力维护成本降低 →
       统治者有动机建设制度(为战争筹款/征兵需要制度能力)。
       给出"有没有动机让权/建制度"的条件。

    2. 交互逻辑
       DED-012给出"有了固定统治者"这个起点。
       DED-010给出"必须变"的压力——纯人格化统治撑不住规模。
       DED-006和DED-003共同决定"往哪变":
       - 税基类型(DED-006)决定"需要什么样的制度":
         商业税基 → 需要非人格化交换制度 → 统治者必须让渡部分权力以换取商人阶级的税入;
         农业税基 → 不需要非人格化制度 → 统治者只需榨取、不需让权。
       - 外部竞争(DED-003)决定"有没有动机去建":
         有外部竞争 → 建制度的动机强(战争需要钱和兵 → 需要制度能力);
         无外部竞争 → 建制度的动机弱或归零(无生存压力 → 不需制度能力)。
       交互不是加性的: 商业税基 × 外部竞争 → 让权换税的"拉力"×"推力"同时存在;
       农业税基 × 外部竞争 → 只有"推力"没有"拉力" → 榨取型制度(只建税敛机器、不建约束);
       无竞争 × 任何税基 → 推力归零 → 退化或内爆。

    3. 涌现论证
       分叉树不是任何单父推论的产物:
       - 单看DED-012: 只知道坐寇会抽税供序，不知抽完之后国家长什么样。
       - 单看DED-010: 只知道必须制度化，不知往哪个方向制度化(制度可以只是继承规则/官僚科层，
         不一定是代议/法治)。
       - 单看DED-006: 只知道商业需要非人格制度，不知统治者是否有动机建立它。
         统治者完全可以选择压制商业而非让权。
       - 单看DED-003: 只知道外部竞争驱动凝聚，不知凝聚在什么制度形态上。
         凝聚可以导向法西斯式的制度硬化而非让权。
       唯有四条合力: DED-012(DED-010(DED-006 × DED-003))——坐寇化后，
       制度化压力(DED-010)叠加税基需求(DED-006)和竞争动机(DED-003)，
       才产生分叉树——而这四条的交互效应(商业×竞争→让权，农业×竞争→榨取，
       无竞争→退化)是任一单条无法单独推出的。

    4. 多父逐格判空
       轴1: 税基类型(商业流 / 农业存量)——来自DED-006
       轴2: 外部竞争(可信 / 无)——来自DED-003
       轴3: 制度化(跨过门槛B / 递增展示A)——来自DED-010
       (前提: DED-012给定——已存在坐寇/固定统治者，且税基可再生；
       若坐寇前件不成立则不在射程。)

       笛卡尔积(3轴共8格，排除2格前件不成立/无意义，剩6格):
       - 商业+竞争+制度化(B) → 竞争制度型
         父推论合力: DED-012(有坐寇) + DED-006(商业需制度) + DED-003(竞争驱动建制度)
         + DED-010(制度化降本) → 四者皆需。
       - 商业+竞争+递增展示(A) → 不稳定，趋于向B迁移
         父推论合力: DED-010(递增展示不可持续) + DED-003(竞争驱动让权)
         → 若统治者在A则被竞争压向B，否则淘汰。
       - 商业+无竞争+制度化(B) → 【预测为空】(招牌空格)
         父推论合力: DED-006(商业需制度) vs DED-003(无竞争=无动机)
         → DED-003+DED-006合力推出空。若被填→需DED-003修正(承认内部合法化替代)。
       - 商业+无竞争+递增展示(A) → 碎片化/退化
         父推论合力: DED-003(无外压退凝聚) + DED-010(递增展示不可持续)
         → 坐寇退化或内爆。
       - 农业+竞争+制度化(B) → 采掘型稳态(只建税敛、不建约束)
         父推论合力: DED-012(有坐寇) + DED-003(竞争驱动建制度)
         + DED-006(农业不需非人格制度) + DED-010(制度化降税敛成本但不含让权)
         → DED-006说明为什么制度只往税敛长、不往约束长。
       - 农业+无竞争+递增展示(A) → 碎片化/退化
         父推论合力: DED-003(无外压) + DED-010(递增展示不可持续)。

       关键多父格:
       (a) "商业+竞争+制度化→制度型"需4条合力——任何单条缺失则预测不同;
       (b) "商业+无竞争+制度化→空"需DED-003+DED-006合力——单有DED-006预测"需要制度"、
          单有DED-003预测"无动机"，合力才推出"需要但不会出现"=空。
       (c) "农业+竞争→采掘型"需DED-006的"农业不需非人格制度"来排除制度型路径——
          若无DED-006，DED-003+DED-010会预测"竞争→建制度"但不区分制度类型。

# === 涌现证明 ===

emergence_demonstration:
  necessity: |
    逐一移除每条L3父推论，L4的结论无法成立:
    - 移除DED-012(坐寇化): 无"固定统治者"起点 → L4无法讨论国家形态。
      任何关于坐寇之后往哪走的命题失去前提。
    - 移除DED-010(权力制度化): 无"必须变"的压力 → 坐寇可永远维持纯人格化统治，
      分支树中所有"制度化B"路径消失 → 只剩"流寇变坐寇"而不知坐寇之后。
    - 移除DED-006(非人格化制度): 无"制度往哪儿长"的方向 → 无法区分制度型和采掘型。
      DED-003+DED-010会说"竞争→建制度"但不区分制度类型(税敛机器 vs 法治约束)。
      L4的分叉树被压平——失去"商业需让权、农业不需"这一关键分叉条件。
    - 移除DED-003(外部竞争→凝聚): 无"有没有动机"的条件 → 只剩DED-006的"商业需要制度"
      和DED-010的"必须制度化"，但统治者可在"不让权"的前提下拼凑非制度化替代
      (如包税制、徭役——这些不需要让渡权力)。竞争制度型路径消失。
      且"无竞争→退化"的(iii)预测完全依赖DED-003。

  novelty: |
    L4的下列核心命题不能被任何单条父推论推出，也不是父推论的AND/OR平凡拼接:
    (a) "商业税基+外部竞争 → 统治者让渡权力、建立非人格化制度(竞争制度型国家)":
        - DED-012: 只说"坐寇会抽税供序"，不说"让权"。
        - DED-010: 只说"制度化降维持成本"，不说"让权给商人阶级"。
        - DED-006: 只说"商业需要非人格制度"，不说"统治者会让渡权力去建它"。
          统治者完全可以选压制商业(如明清海禁)——DED-006单独不预测"让权换税"。
        - DED-003: 只说"竞争驱动凝聚"，不说"凝聚在让权型制度上"。
          凝聚可以导向法西斯/军国主义——DED-003单独不区分制度方向。
        → 合成给出"竞争迫使统治者向商人让步、以非人格化制度换税入"——
        这需要竞争(动机) + 商业(制度方向) + 制度化(形式)三者同时在场，
        不是AND拼接(AND会说"竞争存在 AND 商业存在 AND 制度化存在"——
        那是平凡合取；L4说的是三者交互产生"让权换税"这一特定结果)。

    (b) "农业税基+外部竞争 → 采掘型稳态(强税敛、弱制度)":
        - DED-012: 只说坐寇抽税供序，不说"只建税敛、不建约束"。
        - DED-010: 只说制度化降本，不说"制度化为单向税敛机器"。
        - DED-006: 只说农业不需要非人格制度，不在射程内(农业未突破信任半径)。
        - DED-003: 只说竞争驱动凝聚，不说凝聚在什么具体制度形式上。
        → 合成给出"竞争推高税敛能力但不产生制度约束"——
        这在父推论中无对应物(父推论都不讨论"税敛vs约束"这一对张量)。

    (c) "无外部竞争+商业税基+长期强非人格制度=空格":
        这不是任何父推论的结论或AND组合。
        DED-006会说"商业需要制度"(预测应有)、DED-003会说"无竞争→退凝聚"(预测制度弱)。
        两条单独给出相反的预测方向，不拼在一起不会推出"这一格为空"。
        推出"空"需要DED-003+DED-006的【交互】: 需要但无动机 → 不会出现。

  multi_parent_cells: |
    在税基类型(商业/农业) × 外部竞争(可信/无) × 制度化(A/B)的笛卡尔积中:
    - "商业+竞争+制度化→竞争制度型": 需DED-012+DED-006+DED-003+DED-010合力。
      单DED-006缺动机、单DED-003缺方向、单DED-010缺具体形态。
    - "商业+无竞争+制度化→空": 需DED-003+DED-006合力。
      DED-006单独预测"需要→应有"、DED-003单独预测"无动机→应无"——
      两条合力才推出"需要但不会出现"=空。
    - "农业+竞争→采掘型": 需DED-006的"农业不需非人格制度"来堵住制度型路径。
      若无DED-006，DED-003+DED-010会错误预测"竞争→让权型制度"(不分税基类型)。
    至少三个格子需要≥2条父推论合力，满足L4涌现门槛。

# === 可证伪性 ===

falsifiability: |
  本推论可被以下发现证伪:
  (a) 发现一个经独立测定满足"无可信外部竞争(按external_competition_pressure独立测)
      + 商业税基(按tax_base_type独立测) + 长期(>50年)维持强非人格化制度
      (按state_type_outcome的制度约束维独立测)"的政体
      → 填满招牌空格 → L4核心被证伪或需修正(可能DED-003的外部竞争必要性被高估，
      存在"内部合法化替代路径")。
  (b) 发现"商业税基+可信外部竞争"的政体系统性未走向竞争制度型
      (如多个商业城邦在强敌环伺下仍维持寡头榨取而从未建立代议/法治)
      → 证伪"商业+竞争→让权换税"的交互机制。
  (c) 发现"农业税基+可信外部竞争"的政体系统性走向了竞争制度型
      (如纯农业帝国自发产生代议制度与法治约束)
      → 证伪"税基类型决定制度方向"的主张。
  (d) 发现"无外部竞争"的政体系统性维持强制度约束
      (多个无外敌的政体长期不退化、不内爆、保持强非人格化制度)
      → 证伪"无竞争→退化"的主张及DED-003在此L4中的必要性。

falsification_trace:
  primary_suspect: |
    外部竞争的必要性可能被高估——是否存在"内部合法化"替代路径(如意识形态/宗教)?
    即DED-003的外部竞争是否可被内部因素替代?
    这是DED-003自身verified*状态(瑞士unresolved)的向上传播:
    若DED-003的外部竞争必要性被削弱(存在非竞争驱动的凝聚力与制度动机),
    则L4-001中"无竞争→退化"的(iii)预测和招牌空格(iv)同时松动。
    此腿受检优先级最高——因为直接关系L4的最强可证伪预测(空格)。
    诚实声明: DED-003为verified*(非verified)，其瑞士案例的unresolved状态是L4-001置信度天花板的一部分。
  secondary_suspect: |
    DED-006的"商业税基→需要非人格化制度"可能过于线性——
    统治者可能开发替代方案(如国家垄断商业、包税制、官商合流)
    在不让渡政治权力的前提下榨取商业税基(如明清的盐商/广州十三行体系)。
    若此类"不给制度也让商业交税"的案例足够多且稳定,
    则"商业税基→让权换税"的交互机制被削弱——
    商业税基可能只产生财政创新而不产生政治制度约束。
  unlikely_suspect: "DED-012坐寇化本身——流寇变坐寇的机制有多重跨文化锚、伪造难度高。"

# === 排除的结果 ===

excluded_outcomes:
  - outcome: "非坐寇前件的政体(无固定领地控制的暴力垄断者)"
    description: |
      若某政体尚未完成坐寇化(仍为流寇/无领地固定控制),
      则DED-012的前件不成立 → 不在本L4射程。
      本L4只讨论【已坐寇化之后】的国家形态分化。
  - outcome: "DED-005射程内的换/抢边界选择"
    description: |
      给定净收益在交换与掠夺之间的选择属DED-005射程;
      本L4在"已施暴控制、已坐寇化"之后讨论国家的制度形态,
      不重复DED-005。
  - outcome: "现代建立即非人格化的政体(殖民地独立后的宪法国家等)"
    description: |
      若国家从一开始就以宪法/官僚制建国(非从坐寇演化),
      前件"个人化统治→制度化"的DED-010路径不成立 → 不在射程。

# === 现实锚点 ===

real_world_anchors:
  supporting:
    - anchor: "雅典 vs 斯巴达(同外部威胁、不同税基 → 不同制度路径)——复合特有锚点"
      evidence: |
        古典时期希腊，雅典与斯巴达面临【同一】外部竞争压力(波斯帝国的军事威胁 +
        希腊城邦间竞争)，但税基类型截然不同:
        - 雅典: 商业流税基——劳里昂银矿 + 比雷埃夫斯港贸易 + 提洛同盟贡金
          → 演化出竞争制度型: 公民大会、陪审法庭、海上贷款契约执行、
          非人格化法律(德拉古/梭伦/克里斯提尼改革) → 统治者(公民集体)让权给制度。
        - 斯巴达: 农业存量税基——黑劳士(helot)农业 + 征服土地
          → 维持采掘型稳态: 军事寡头制、无商业制度发展、强税敛(黑劳士贡赋) +
          弱制度约束(gerousia/ephor虽有制衡但不保护非公民)。
        外部竞争压力近似不变、税基类型变动 → 制度结果分叉。
        这是"税基类型×外部竞争交互产生不同制度路径"的复合特有锚点——
        不能被任何单条父推论解释(DED-003单独预测"两者皆有凝聚"但不区分制度方向;
        DED-006单独预测"雅典需要制度、斯巴达不需要"但不说竞争如何激活此差异)。
      independent_evidence: |
        税基类型由财政收入来源(贸易税/贡金 vs 土地/黑劳士产出)独立测;
        制度结果由政治制度(公民大会 vs gerousia)和法律制度(陪审法庭 vs 军事法)独立测;
        外部竞争由波斯战争+城邦竞争独立测。三者不互偷定义。
      confidence: "moderate-strong(同威胁对照干净，但两城邦规模差异混杂)"

    - anchor: "英格兰(1688后) vs 法兰西(路易十四)——同竞争、不同税基 → 不同制度"
      evidence: |
        17-18世纪，英法面临【同一】大陆竞争压力(西班牙王位继承战、七年战争等)，
        但税基类型存在关键差异:
        - 英格兰: 商业流税基占比上升(羊毛贸易、海外殖民、伦敦金融城)
          → 光荣革命(1688): 议会控制财政、英格兰银行(1694)、法治约束王权
          → 统治者(王权+议会)让权换税 → 竞争制度型。
        - 法兰西: 农业存量税基主导(taille土地税 + gabelle盐税)
          → 绝对主义(absolutism): 包税制(farmers-general)、无代议约束、
          卖官鬻爵(venality of office) → 采掘型稳态。
        竞争压力近似、税基类型差异 → 制度路径分叉。
      independent_evidence: |
        税基类型由财政收入结构(英国关税/消费税占比 vs 法国土地税占比)独立测;
        制度结果由议会实权/法治/中央银行 vs 绝对王权/包税制独立测。
      confidence: "moderate(英法差异多因混杂——宗教/法律传统/岛国地理，诚实降级)"

    - anchor: "荷兰共和国(商业税基 + 生存性竞争 → 高度制度化联邦)"
      evidence: |
        16-17世纪荷兰: 极度商业化的税基(波罗的海贸易、东印度公司、阿姆斯特丹金融)
        + 生存性外部威胁(西班牙哈布斯堡帝国) → 极度制度化的联邦:
        联省议会(States General)、东印度公司(VOC)作为联合股份公司、
        阿姆斯特丹汇兑银行(1609)、法治与契约执行的黄金标准。
        这是"商业+竞争→制度型"的强正例。
      independent_evidence: |
        商业税基由贸易量/金融创新独立测; 外部威胁由八十年战争独立测;
        制度结果由联邦结构/公司治理/银行制度独立测。
      confidence: "moderate-strong"

    - anchor: "中华帝国周期(农业税基 + 周期性竞争 → 采掘型稳态)"
      evidence: |
        秦汉至明清: 农业税基绝对主导(土地税/人头税/粮食贡赋)
        + 周期性外部竞争(草原游牧帝国: 匈奴/突厥/蒙古/满洲)
        → 采掘型稳态: 强官僚税敛机器(郡县制/科举/户部)、
        弱制度约束(无代议、无法治、皇帝个人专断未被制度化约束)。
        王朝周期性崩溃可部分归因于DED-010的递增展示成本 +
        DED-003外患退去后的内聚退化。
      independent_evidence: |
        税基类型由田赋/盐税/商税占比独立测; 制度约束由缺乏代议机构/法治独立测;
        外部竞争由边境战争频率独立测。
      confidence: "moderate(王朝周期多因混杂——人口/气候/财政，诚实降级)"

    - anchor: "后罗马西欧碎片化(无外部竞争 → 退化/碎片化)"
      evidence: |
        西罗马崩溃后(5-10世纪): 无有效外部竞争者(伊斯兰扩张在东南、维京在北方但非系统性)、
        坐寇(地方军阀/封建领主)退化为碎片化军阀均衡——
        无制度硬化、维持成本高(DED-010)、无竞争驱动(DED-003)。
        "无竞争→退化"的锚。
      independent_evidence: |
        外部竞争缺失由军事威胁的系统性缺席(与罗马时期对比)独立测;
        退化由制度复杂度下降(贸易萎缩/城市收缩/法律消失)独立测。
      confidence: "weak-moderate(多因混杂——贸易萎缩、人口下降，不能纯归因于竞争缺失)"

  counterexamples:
    - case: "瑞士(1815-至今): 无外部竞争 + 商业税基 + 强非人格化制度——招牌空格候选人"
      analysis: |
        瑞士自1815年维也纳会议获永久中立后约200年无外部军事竞争;
        高度商业化经济(银行、制药、精密制造); 强非人格化制度(联邦制、
        直接民主/公投、法治、契约执行一流)。
        表面符合"无外部竞争+商业税基+长期强非人格化制度"——
        若独立判定坐实，则填满L4招牌空格 → L4核心被证伪或需修正。
        【可能的免证伪路径】
        (1) 瑞士的替代维护机制(全民公投制度，每年3-4次全国公投)
        作为DED-003的"内部合法化替代"——这正是DED-003自身verified*的原因
        (瑞士unresolved)。若瑞士的公投参与率在和平期显著高于此前的战争期，
        则瑞士符合DED-003预测C(替代投入增加→抵消衰减)——此时瑞士并未
        证伪DED-003，故也不证伪L4。
        (2) 瑞士的强制度在1815年前(中世纪/宗教改革时期)已形成——
        外部竞争(哈布斯堡)推动制度在竞争期建成，中立后只是【维持】而非【新建】。
        若瑞士在无竞争期的制度【净新建量】极低，则本L4的预测"无竞争+商业税基
        →无制度新建"未被证伪(制度存量的维持≠流量的新建)。
        当前裁定: unresolved——需数据判定瑞士制度是"竞争期建成后维持"还是"无竞争期新建"。
      status: unresolved_requires_data

    - case: "威尼斯共和国(晚期): 商业税基 + 竞争消失 → 制度硬化/寡头退化"
      analysis: |
        威尼斯早期(1000-1500): 商业税基 + 地中海竞争(热那亚/拜占庭/奥斯曼)
        → 竞争制度型: 大议会、法治、商业契约执行。
        晚期(1500-1797): 商业税基仍在 + 竞争减弱(地中海被奥斯曼封锁后转向大陆、
        大西洋贸易绕开威尼斯) → 制度退化: 寡头固化(Serrata del Maggior Consiglio)、
        不扩张制度、最终被拿破仑废除。
        此案例同时支持L4的两个预测:
        (a) 早期"竞争+商业→制度型"(支持);
        (b) 晚期"竞争消失→退化/寡头硬化"(支持DED-003在L4中的必要性)。
        【极其吻合】→ 中等强度支撑。
      confidence: "moderate(单案例,但跨时对照干净)"

  boundary_cases:
    - case: "汉萨同盟(商业税基 + 无统一坐寇 + 分散竞争)"
      analysis: |
        商业城邦联盟，无统一坐寇(多中心)，外部竞争分散(丹麦/挪威/英国)。
        因DED-012前件"统一的暴力垄断者/坐寇"不完全成立 → 非典型射程内案例。
      status: boundary_case

# === 判别效度 ===

discriminant_validity: |
  与三个竞争理论的区别:

  【与Tilly"战争缔造国家"的判别】
  Tilly(1985): "war makes states"——战争和战争准备→国家形成(单一路径)。
  本L4: 战争类型 × 税基类型 → 【不同路径】——不是"战争→国家"而是
  "什么样的战争(on what tax base)→什么类型的国家"。
  独有可证伪预测: (a) 分叉条件(商业+战争→制度型; 农业+战争→采掘型);
  (b) 空格预测(Tilly不预测任何空格——其框架下"战争+商业税基+无制度约束"
  不被排除); (c) 无战争→退化/内爆(Tilly只说战争→国家，不逆否说无战争→无国家进化)。

  【与North/Weingast"光荣革命"的判别】
  North & Weingast(1989): 光荣革命→制度约束王权(英国特例)。
  本L4: "商业税基+外部竞争"是一般条件，光荣革命是其一个实例而非唯一路径——
  荷兰(更早)、雅典(更早)均满足同样条件。
  独有可证伪预测: 若"商业税基+竞争"在其他时空不走向制度型，
  则North/Weingast的英国特例优于本L4的一般化主张。

  【与Olson"坐寇论"的判别】
  Olson(1993): 流寇→坐寇(固定统治者抽税供序)。不到"什么类型的国家"这一步。
  L4-001的直接前提DED-012继承并操作化了Olson的核心洞见(加入事前固定性归因+
  税基可再生性)，L4-001在此基础上往前走了一步: 坐寇之后往哪走?
  Olson未覆盖此问题。

  【防平凡化守卫】
  若只读DED-006(商业需要非人格制度)+DED-003(竞争驱动凝聚)，
  理性观察者会预测"商业+竞争→有制度"但不会预测"统治者让渡权力"——
  制度可能是统治者单方面强加的商业管理规则(包税/行会监管/特许垄断)
  而非代议/法治/契约执行。
  本L4的增量=(a) "让权换税"这一具体机制(非仅"有制度");
  (b) 分叉树(商业+竞争→制度型 vs 农业+竞争→采掘型——非Tilly的单线);
  (c) 逐格判空(无竞争+商业+强非人格制度=空——DED-003+DED-006合力推出)。

