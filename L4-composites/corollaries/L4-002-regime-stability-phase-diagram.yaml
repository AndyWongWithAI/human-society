id: L4-002
type: composite_deduction
layer: L4-composites
deduction_form: composite
status: verified
term: "政体稳定相图 (Regime Stability Phase Diagram)"
claim_type: phase_diagram

人话摘要: |
  政权稳不稳，不是看它"民主不民主"一个指标——是三股力量的同时博弈：输了的人还有没有路走、
  裁判是不是自己人、不公平有没有集中到某个群体且让他们组织起来。三个参数的不同组合，画出
  从"稳如泰山"到"一推就倒"的完整地图。

statement: |
  【Composite claim】不同政体的稳定性不是单一维度的"好/坏"——它是三个独立参数的函数：
  (a) 精英轮替开放度(DED-011——输家有没有路走)、(b) 裁决独立度×透明度组合(DED-020——
  透明是放大器)、(c) 不公-集体行动三条件是否到位(DED-017——集中+组织+无渠道)。
  三个参数定义了一个三维相空间，其中有四个可区分的稳定/不稳定区域和一个跨区域相变边界。

  【Parent mechanisms】
  DED-011(派系必然+轮替):派系是结构必然——有轮替→输家有未来预期→体系稳定；无轮替→
  输家绝望→派系撕裂。贡献参数(a)精英轮替开放度。
  DED-014(程序公平天花板):无轮替时程序透明反成羞辱放大器——这个交互结构(前件=轮替
  开放度)被 DED-020 迁移到"裁决独立度"前件:裁决不独立+高透明=羞辱放大器。
  DED-020(透明×独立交互):程序透明不是万灵药，是放大器——裁判独立时透明让公道更亮，
  裁判不独立时透明反把偏私曝光、让人更难咽。贡献参数(b)独立度×透明度交互。
  DED-017(不公→集体行动临界):不公要引爆集体行动需三条件同时到位(集中+组织+无渠道)
  ——缺一就犬儒。贡献参数(c)集体行动临界条件+跨区域相变边界。

  【Emergent property】三维相空间中的稳定区/不稳定区分区与相变边界。没有任何单一父推论
  能独立描绘这个完整相图：DED-011 只讲轮替→派系撕裂(单轴)，DED-014 只讲轮替×透明
  的乘积天花板(单交互)，DED-020 只讲独立×透明的交互(单交互、不同前件)，DED-017 只讲
  不公→集体行动的三条件临界(单临界)。只有四条合起来，才能定义三维参数空间中的分区结构
  和跨区域相变边界。

  【Prediction】
  (i) 高轮替+高独立→"民主稳定区":任何透明度下都稳定——透明没有坏处可放大。轮替给输家
  出路(DED-011)，独立裁决保证程序合法性(DED-020 正效应区)，DED-017 条件不典型集中。
  (ii) 低轮替+低独立+低透明→"威权稳定区":不公存在但未被曝光、输家无组织→犬儒而非
  造反(DED-017 三缺一)。轮替缺失的撕裂压力(DED-011)被低透明缓冲——不公不被公开展示
  (DED-020 的羞辱放大器未激活)。
  (iii) 低轮替+低独立+高透明→"最不稳定区":透明把偏私公开展示(DED-020 羞辱放大器)、
  输家无出路(DED-011)、不公集中且有目共睹——离 DED-017 的集体行动临界最近。
  此格为最尖锐的涌现预测:任一单父推论都不给它——DED-011 给"无轮替→不稳定"但不区分
  透明度、DED-020 给"不独立+透明→羞辱"但不说轮替、DED-017 给三条件临界但不说透明度
  的放大器角色。三机制同时在场时才出现"最不稳定"的合成态。
  (iv) 低轮替+高独立(罕见但存在:如殖民地独立司法)→"法治威权区":程序合法性缓冲了轮替
  缺失——稳定但天花板取决于 DED-014 的"轮替归零→程序合法性归零"极限。独立裁决提供
  合法性供给(DED-020 正效应区)，但轮替缺失使合法性供给有天花板(DED-014 乘积关系)。
  此格的稳定性是条件性的——程序合法性可以撑一阵子，但轮替长期归零时合法性迟早空心化。
  【时间尺度锚定】"天花板逼近"操作化为跨代际尺度:在轮替持续趋零的条件下，独立裁决的
  程序合法性供给预计在两代以上(约 40-60 年)尺度上进入递减区间——但该锚定为启发式，
  天花板的具体速度取决于合法性供给的初始存量(DED-020 正效应强度)和外部冲击频率。若无
  时间尺度,"65年未到天花板"无法判定是"时间不够"还是"预测有误"——本锚定使(iv)区预测
  可被纵向检验。
  (v) 任何区域+不公集中在可识别群体+该群体已有预存组织+无改革渠道→集体行动临界逼近
  (DED-017 三条件)——这是跨区域的相变边界，不与(i)-(iv)的稳定区分区互斥。
  (vi) 逐格判空:"低轮替+低独立+高透明+长期稳定"这一格预测为空——DED-011 说无轮替→
  输家无出路、DED-020 说依附+透明→羞辱放大器，两者合力预测该组合无法长期稳定。任一
  单父推论单独不强制该格为空(DED-011 不区分透明度、DED-020 不区分轮替开放度)，只有
  两条合力才使之空。可被现实反例填上。

operationalization:
  精英轮替开放度:
    definition: |
      权力交替的【事前独立概率】——存在成文的定期换届/轮值规则，且该规则在常规(非危机)
      运作中被例行兑现。连续量从0(终身制/无轮替规则或从未兑现)到1(制度化定期轮替且每次
      兑现)。继承自 DED-011 turnaround_credibility 中的轮替维度测量。
    measurement: |
      成文换届规则清晰度 + 任期届满改选/轮换是否按期例行发生(结构+程序事实)。
      【硬约束】不得用"是否发生过和平交权"测——那是结局侧代理，与"输家不掀桌"同轴。
    limitations: "连续量非二分；'兑现例行性'需至少覆盖一轮完整任期的时间窗观测。"

  裁决独立度×透明度组合:
    definition: |
      复合参数(b)，由两个子维度合成:
      (1) 裁决者独立度——裁决者与争议双方之间是否存在利益共享关系(经济利益/亲缘/政治隶属)。
          连续量从完全独立(与双方均无任何利益共享)到完全依附(与一方高度利益共享)。
          继承自 DED-020 adjudicator_independence。
      (2) 程序透明度——决策过程的成文规则清晰度、裁决者遴选公开度、发言机会、一贯执行。
          继承自 DED-020 procedural_transparency。
      两维度不压成单标量——交互结构(DED-020)要求分轴记录:独立+高透明=正效应区，独立+
      低透明=弱效应区，不独立+高透明=羞辱放大器区，不独立+低透明=隐匿区。
    measurement: |
      独立度由经济/亲缘/政治结构事实独立测(不依赖裁决结果)；
      透明度由制度成文事实+程序运作记录测(不依赖败方接受度)。
      【分轴测】两维度各自独立测，不互相污染。
    limitations: |
      隐蔽依附(表面无关系、私下有交易)难以事前测出——此为本推论 primary_suspect 的来源之一。
      高独立+高透明与高轮替在现实中常伴生，使极限格的独立变异有限。

  不公-集体行动三条件:
    definition: |
      复合参数(c)，来自 DED-017 的临界结构——三条件必须同时到位:
      (1) 不公集中度:感知不公集中在可辨识的社会群体身上(受益/受损群体的资源差×群体可区分度)；
      (2) 预存组织密度:该群体内部是否有任何形式的组织/网络(正式或非正式)可通气协调；
      (3) 改革渠道缺失度:是否无可信改革渠道(选举/申诉/退出等)，即 DED-011 伞级判据下俱缺。
      三者缺一→不公转犬儒不转行动(DED-017 预测 ii)。
    measurement: |
      不公集中度由资源差距统计+群体可区分度事前编码独立测；
      预存组织密度由社会组织登记/民族志/居住就业数据独立测；
      改革渠道由制度结构事实+非结局侧程序事实测。
      三个条件各自独立测，【不得】由"是否已爆发"反推。
    limitations: "高度封闭社会中三条件均难以独立测(信息不透明)；非正式网络在史料中常难精确量化。"
    honest_note: |
      【非完全正交诚实标注】参数(c)的"改革渠道缺失度"子条件(选举/申诉/退出)与参数(a)轮替开放度
      共享 DED-011 turnaround_credibility 的概念祖先——两者在概念上非完全正交。DED-017 的"改革渠道"
      是伞级判据"给受损群体不掀桌也有改善可能的路"，其在场/缺失独立于轮替水平，但概念的测项交叠
      意味着在极端值区域(轮替→0、改革渠道→全缺)两个参数会共变。参数(c)整体(含不公集中度+预存组织
      密度两个独立于(a)的子条件)仍与参数(a)可独立变异，不影响合力论证的结构，但"三个参数正交"的
      宣称须在交叠子维度上限缩。

  政体稳定性(复合输出变量):
    definition: |
      政体在长时段内维持其基本制度结构和权力分配格局、不经历制度性崩溃(革命/政变/内战/
      国家分裂)的能力。非单一维度——包含结构层(是否撕裂，DED-011 被预测量)和认知层
      (合法性是否空心化，DED-014 被预测量)两个维度，两者可分离:一个政体可在"结构上暂未
      撕裂"时"认知上合法性已空心化"。
    measurement: |
      结构维度:长时段内是否发生制度性崩溃事件(革命/政变/内战/分裂)——由独立事件数据库
      或史料编码；
      认知维度:败方/受损群体是否在行为上持续接受制度框架(不掀桌、不清洗、不退出)，与
      DED-014 loser_acceptance 同一测量轴。
      两维度分轴测，不互相反推。稳定性是这两个维度的联合函数——结构暂稳+认知空心化=
      "虚假稳定"(已在解体边缘)，是本推论独有可测区间。
    limitations: "稳定性是程度非二分；'基本制度结构'的边界需逐案界定(宪法变更算不算制度崩溃)。"

derivation:
  from_l3:
    deductions: [DED-011, DED-014, DED-020, DED-017]
  from_l1:
    axioms: [AXIOM-001]
    theorems: [THEOREM-position]
  from_l2:
    bridging: [BR-L2-015, BR-L2-006, BR-L2-013, BR-L2-014]
  steps: |
    1. 父机制摘要
       DED-011:派系必然+轮替开放度决定输家是否有未来预期→体系撕裂vs流动。
       DED-014:程序公平效应在轮替→0处断裂——轮替×透明乘积关系，透明反成羞辱放大器。
       DED-020:程序透明×裁决独立交互——独立时透明为正向、依附时透明反转为羞辱放大器。
       DED-017:不公→集体行动需三条件同时到位(集中+组织+无渠道)，缺一不公转犬儒不转行动。
       四条父推论各自覆盖机制的不同"切面":DED-011 管轮替通道，DED-014 管程序合法性天花板，
       DED-020 管裁决独立度的交互，DED-017 管集体行动临界。没有任一条覆盖完整的稳定相空间。

    2. 交互逻辑——三维参数空间的构建
       参数(a)精英轮替开放度(DED-011):决定"体系给不给输家出路"——这是稳定性的第一轴。
       参数(b)裁决独立度×透明度(DED-020):决定"程序是否被感知为公平"——独立×透明=
       正效应区、依附×透明=羞辱放大器。DED-014 的"轮替×透明"交互结构为 DED-020 的
       "独立×透明"交互提供了结构模板——两者同构但前件不同(轮替 vs 独立)，两个前件可独立
       变异。参数(c)不公-集体行动三条件(DED-017):定义"什么时候犬儒变成造反"的相变边界
       ——这是跨越(i)-(iv)稳定分区的通用临界。

       三个参数可独立变异(有轮替+裁决依附、无轮替+裁决独立、有轮替+裁决独立+不公集中→各自落在
       不同区域)——但须诚实标注:参数(c)的"改革渠道缺失度"子条件与参数(a)共享 DED-011 概念祖先，
       在极端值区存在共变,非完全正交(详见 operationalization 中参数(c)的 honest_note)。三维参数
       空间的笛卡尔积产生多个可区分的稳定/不稳定分区。

    3. 涌现论证(详见 emergence_demonstration)
       四条父推论各自描述独立机制。合起来能产生它们各自产生不了的东西:完整的稳定相图分区+
       跨区域相变边界。这与"父推论A说X、父推论B说Y、所以X+Y"的平凡合取不同——相图中的
       每个区域都由多条父推论【合力】定义，且至少"最不稳定区"(低轮替+低独立+高透明)和
       "法治威权区"(低轮替+高独立)两个区的预测需要父推论合力才能推出。

    4. 多父逐格判空(详见 emergence_demonstration.multi_parent_cells)
       在参数(a)×(b)×(c)的笛卡尔积空间中，逐格标注预测来源。至少两个格标注为"需要
       DED-X + DED-Y 合力"——满足 L4 涌现硬门槛。

emergence_demonstration:
  necessity: |
    逐一移除每条 L3 父推论:
    - 移除 DED-011:轮替轴消失——无法区分"民主稳定区"(i)和所有低轮替区域(ii/iii/iv)，
      相图退化为"裁决独立度×不公集中度"的二维平面，丢失轮替通道这整个维度。
    - 移除 DED-014:程序公平天花板逻辑消失——无法解释"法治威权区"(iv)的"稳定但天花板
      有限"这一条件性判断。"轮替归零→程序合法性归零"的乘积关系是(iv)区的核心约束。
    - 移除 DED-020:独立×透明交互消失——无法区分(ii)和(iii)(威权稳定 vs 最不稳定)，
      因为两者的差别恰在透明度的【方向】(在依附条件下是羞辱放大器而非无作用)。丢失交互
      结构后，透明度在所有条件下都是中性或正向——与(ii)/(iii)的分区矛盾。
    - 移除 DED-017:跨区域相变边界消失——只剩(i)-(iv)的稳定分区，但缺了"任何区域在什么
      条件下越过临界→集体行动"这一动态边界。相图变成纯静态分区、丢失动力学上的相变。
    结论:四条父推论每一条都承载不可替代的机制贡献——没有任何"观众砖"。
    【诚实标注】DED-014 的不可替代贡献集中于(iv)法治威权区(提供轮替→0 处程序合法性
    天花板机制)。在(i)(ii)(iii)三个区域中，DED-014 无直接预测贡献——(i)区仅需
    DED-011+DED-020，(ii)区仅需 DED-011+020+017，(iii)区仅需 DED-011+020。
    DED-014 对 L4 的另一贡献是结构模板层面(轮替×透明交互结构启发 DED-020 的
    独立×透明交互)，此为发现过程贡献而非逻辑必然性贡献。DED-014 是四条父推论中
    边际贡献最窄的一条，但它在(iv)区的贡献是真实且不可替代的。

  novelty: |
    列出所有父推论各自的结论，逐条对照 L4 的每个核心预测:
    DED-011 结论:派系必然→轮替开放度决定撕裂vs流动(单轴，不管透明度/独立度/不公集中度)。
    DED-014 结论:轮替→0时程序公平效应断崖+透明反成羞辱(单交互:轮替×透明，不管裁决独立度
      和不公集中度)。
    DED-020 结论:裁决独立×透明交互——依附时透明反转为羞辱(单交互:独立×透明，前件不同于
      DED-014 的轮替，不管不公集中度)。
    DED-017 结论:不公三条件同时到位→集体行动临界(单临界:集中+组织+无渠道，不管轮替和裁决
      独立度)。

    L4 核心预测对照:
    - 预测(i)"民主稳定区":高轮替+高独立→稳定。DED-011 给高轮替→稳定，但不给"高独立"
      的贡献——DED-011 不管裁决独立度。需要 DED-011 + DED-020 合力。
    - 预测(ii)"威权稳定区":低轮替+低独立+低透明→稳定(犬儒)。DED-011 给低轮替→不稳定，
      但此处却说稳定——与 DED-011 单条预测方向相反！需要 DED-020(低透明=羞辱放大器未激活)+
      DED-017(三缺一→犬儒)合力才能解释为什么低轮替在此条件下反而稳定。任一条单独推不出"稳定"。
    - 预测(iii)"最不稳定区":低轮替+低独立+高透明→最不稳定。DED-011 给"无轮替→不稳定"
      但不说"最"——需要 DED-020(依附+透明→羞辱放大器)合力才升级为"最不稳定"。
      任一单父推论不区分透明度的程度。
    - 预测(iv)"法治威权区":低轮替+高独立→条件性稳定(天花板有限)。DED-011 给"无轮替→
      不稳定"，DED-020 给"独立→正效应"，两条方向相反——合力才产出"条件性稳定但天花板
      有限"。再加 DED-014 给出天花板的具体机制(轮替归零→程序合法性归零)。任一条单独
      都推不出"条件性稳定+天花板"。
    - 预测(v)跨区域相变边界:需要 DED-017(三条件)+任意稳定分区。DED-017 单独只说三条件
      →集体行动，没说"在什么稳定分区背景下"。需要与(i)-(iv)的区域划分结合。
    - 预测(vi)空格"低轮替+低独立+高透明+长期稳定为空":DED-011 不区分透明度，DED-020
      不说轮替——两条合力才强制该格为空。任一单独不产生这个空格预测。

    结论:L4 的六个核心预测中，至少(ii)(iii)(iv)(vi)四个不能在任一条父推论中读出，也不能
    通过 AND/OR 拼接父推论结论得到——它们涉及交互效应、方向反转和合力约束。满足新颖性。

  multi_parent_cells: |
    参数空间 = 精英轮替开放度(a)×裁决独立度×透明度(b)×不公三条件(c)。
    为清晰计，将(b)拆为最关键的四个组合格:(高独立+高透明)/(高独立+低透明)/(低独立+高透明)/
    (低独立+低透明)。(c)先固定为"三条件不全(犬儒)"的基线，然后在相变边界格中激活。

    基线笛卡尔积(三条件不全，c=犬儒基线):
    ┌──────────────────┬──────────────────────┬──────────────────────┐
    │                  │ 高轮替(a=high)       │ 低轮替(a=low)         │
    ├──────────────────┼──────────────────────┼──────────────────────┤
    │ 高独立+高透明    │ (i)民主稳定区         │ (iv)法治威权区        │
    │                  │ 来源:DED-011+020合力  │ 来源:DED-011+014+020  │
    │                  │ DED-011:轮替→稳定     │ 【合力3条】           │
    │                  │ DED-020:独立+透明→正  │ DED-011:无轮替→不稳   │
    │                  │ 任一单独不区分解独立  │ DED-020:独立+透明→正  │
    │                  │ 贡献                  │ (反向拉力)            │
    │                  │                       │ DED-014:轮替→0→天花板 │
    ├──────────────────┼──────────────────────┼──────────────────────┤
    │ 高独立+低透明    │ 中稳定(DED-011单独)   │ 低稳定(DED-011单独)   │
    │                  │ 来源:DED-011          │ 来源:DED-011          │
    │                  │ 轮替→稳定            │ 无轮替→不稳定        │
    ├──────────────────┼──────────────────────┼──────────────────────┤
    │ 低独立+高透明    │ 中低稳定              │ (iii)最不稳定区       │
    │                  │ 来源:DED-011+020合力  │ 来源:【DED-011+020    │
    │                  │ DED-011:轮替→稳定     │   合力】              │
    │                  │ DED-020:依附+透明→羞辱│ DED-011:无轮替→不稳   │
    │                  │ (两力反向,合力中等)   │ DED-020:依附+透明→    │
    │                  │                       │   羞辱放大器          │
    │                  │                       │ →两条同向加剧→最不稳定│
    ├──────────────────┼──────────────────────┼──────────────────────┤
    │ 低独立+低透明    │ 中稳定(DED-011单独)   │ (ii)威权稳定区        │
    │                  │ 来源:DED-011          │ 来源:【DED-011+020+017│
    │                  │ 轮替→稳定            │   合力】              │
    │                  │                       │ DED-011:无轮替→不稳   │
    │                  │                       │ DED-020:低透明=羞辱    │
    │                  │                       │   放大器未激活(缓冲)   │
    │                  │                       │ DED-017:三缺一→犬儒    │
    │                  │                       │ →三条合力→稳定(犬儒)  │
    ├──────────────────┴──────────────────────┴──────────────────────┤
    │ (vi)空格:低轮替+低独立+高透明+长期稳定 →【预测为空】            │
    │ 来源:【DED-011+020 合力】                                      │
    │ DED-011:无轮替→不稳定。DED-020:依附+透明→羞辱放大器。          │
    │ 两条同向→不可长期稳定。任一单独不强制该格为空。                │
    └────────────────────────────────────────────────────────────────┘

    跨区域相变边界(激活 c=三条件全满足):
    当(c)从"三条件不全"切换到"三条件全满足"(不公集中+预存组织+无改革渠道):
    任何(i)-(iv)区域 → 集体行动临界逼近(DED-017)。
    来源:【DED-017 + 所在区域的父推论合力】。
    例如:在(ii)威权稳定区中，若不公集中到可辨识群体+该群体出现组织+改革渠道关闭→
    需要 DED-011+020+017 三条合力:从"稳定(犬儒)"跨越到"临界"。

    满足 L4 涌现硬门槛:
    - 至少 5 个格子标注为需要 ≥2 条父推论合力(含空格)。
    - (ii)(iii)(iv)(vi)四个格的预测无法由单条父推论单独强制。
    - 最尖锐的涌现格(iii):DED-011+020 同向加剧→"最不稳定"——这在任一条父推论中都不存在。

falsifiability: |
  本推论可被以下发现证伪:
  (a) 存在一个政体同时满足(均由独立于结局的结构指标测得):
      (1) 低轮替(无制度化轮替规则或从未兑现)；
      (2) 低独立+高透明(裁决者与执政方有明显利益共享，且程序规则成文公开、一贯执行)；
      (3) 长期(跨多轮分配/裁决周期)稳定——无革命/政变/内战/分裂，且败方/受损群体
          行为上持续接受制度框架(不掀桌、不清洗、不退出)。
      ⇒ 命中空格(vi)，证伪本推论最尖锐的涌现预测。
  (b) 低轮替+低独立+高透明组合的政体稳定性【不低于】低轮替+低独立+低透明组合的稳定性。
      ⇒ 证伪(iii)与(ii)之间的方向排序——即透明在依附条件下不是羞辱放大器而是中性或正向。
  (c) 裁决独立×透明度的交互项在轮替开放度不同的条件下效应方向一致(无三轮替水平)——即
      裁决依附+透明=羞辱这一效应在有轮替时同样成立且等强，而非被轮替机制缓冲或逆转。
      ⇒ 证伪三维交互结构的必要性——二维(DED-020 自身)已足够，无需 DED-011 的轮替维。

falsification_trace:
  primary_suspect: |
    "高轮替+高独立"组合在现实中是否真的完全不受透明度影响——如果极度透明的选举揭露了
    "轮替只在两个相似精英集团之间"，合法性是否也会受损(DED-014 的 ceiling 逻辑在此适用)？
    两个疑点:(a)高轮替+高独立+高透明的"民主稳定区"稳定上限是否被高估——现实中该区的
    政体也经历合法性危机(民主国家的政治信任下降)；(b)轮替开放度和裁决独立度在现实中
    高度正相关(有制度化轮替的政体通常也有独立司法)，使低轮替+高独立和高轮替+低独立
    这两个交叉格的天然案例稀少——(iv)"法治威权区"的实证基础最薄。此腿最先受检。
  secondary_suspect: |
    裁决独立度的隐蔽依附问题(继承自 DED-020)——表面无关系、私下有交易的依附难以事前
    测出，若测量噪声大将稀释交互效应。此外，三维参数空间中的"透明度"在政体层面含义
    可能与 DED-020 的个体裁决层面不同——政体透明(信息自由/媒体独立)与裁决透明(庭审公开/
    规则成文)是不同构念，不可混淆。
  unlikely_suspect: |
    DED-011(派系必然→轮替抑制)和 DED-017(不公→集体行动三条件临界)本身——前者是
    AXIOM-001+THEOREM-position 的直接结构推论，后者有丰富的革命史经验支持。两条的
    单体稳定性远高于 L4 的合成交互结构。失效更可能出在三维参数的交互项上，而非任一
    父推论的单体失效。

anti_talisman_clause: |
  【防不可证伪护身符——L4 合成层面】在三维参数空间(a×b×c)中遇到疑似反例时，四个
  参数(a 轮替开放度 / b 裁决独立度×透明度 / c 不公三条件)与复合输出(政体稳定性)
  必须各自独立测、不互相反推。尤其不得遇到空格(vi)似被填上的案例时，事后调高轮替估值
  或调低透明度估值或默认"裁决其实独立"来消化——此即 DED-004 病根(不可证伪循环)在
  L4 合成层面的具体形态。各参数的估值须由独立的制度/结构/程序事实坐实，不由"是否稳定"
  反推。本条款与各 operationalization 子段的分散防循环约束构成双层防线：子段约束保障
  单参数测量正交，本条款保障合成层面的参数-输出交叉污染防范。

excluded_outcomes:
  - outcome: "非持久性政体(过渡政府/临时行政当局)"
    description: |
      前件"持久分配稀缺资源"不成立——无长期轮替/裁决/不公分配的稳定博弈，出射程。
      按政体持续时间(不足一轮完整任期)事前测。
  - outcome: "无中央政府/无裁判机制的社会(无政府状态/部落社会无正式裁决)"
    description: |
      裁决独立度和程序透明度的概念在无正式裁决机制的社会中无法操作化，出射程。
      按"是否存在制度化裁决机制"事前判。

real_world_anchors:
  supporting:
    - anchor: "民主稳定区(i)——发达民主政体的长期稳定"
      evidence: |
        制度化轮替(定期选举并兑现)+独立司法(法官终身制/独立薪酬/回避规则)→败选方接受
        结果为合法、等下届再争——DED-011 轮替在场+DED-020 独立+透明正效应区同时运作。
        战后西欧/北美/大洋洲的稳定民主政体落在(i)区，未经历制度性崩溃(革命/政变)。
      independent_test: |
        轮替=成文换届规则+换届按期例行兑现(结构+程序事实)；裁决独立=法官任免/薪酬/
        回避规则(制度事实)；稳定性=未发生制度崩溃(史料独立编码)。
      confidence: "moderate-strong(属 DED-011+DED-020 共锚；本推论的新增贡献是将两锚合在同一相图格内)"
      composite_specific: false

    - anchor: "最不稳定区(iii)——高透明+依附裁决+无轮替政体的脆弱性"
      evidence: |
        某些一党长期执政但维持了较高信息透明度和程序形式的政体(如某些前苏联晚期/东欧
        1980s末):无制度化轮替(一党制宪法规定)、裁决者高度依附于执政党、但程序透明和信息
        公开度在改革期上升→败方/反对派将公开程序视为"赢家的装饰"→合法性空洞并在条件
        积累到位后爆发(1989连锁崩溃)。方向性支持(iii)的"最不稳定"预测——高透明+依附
        +无轮替的组合确实极脆弱。
      independent_test: |
        轮替=有无成文定期换届+兑现(结构事实)；裁决独立=政治隶属/任命链(结构事实)；
        透明度=信息自由/公开庭审/成文规则(制度事实)——三者均独立于"是否崩溃"测得。
      honest_note: "1989多因交织(经济停滞/外部示范/戈尔巴乔夫不干预)，单案归因需谨慎；
        此处只作方向性合成支持——轮替缺失+裁决依附+高透明的组合确实出现在了崩溃前夕。"
      attribution_note: |
        【归因特异性限缩】苏联/东欧 1989 锚存在多重混淆变量:经济停滞(独立于 L4 三参数的
        经济因素)、外部示范(邻国崩溃的传染效应)、戈尔巴乔夫不干预(精英个人决策)——这些
        混淆变量无法干净排除，使该锚对(iii)区特异性机制(轮替缺失×依附裁决×高透明→羞辱
        放大器→最不稳定)的支持是方向性而非归因性的。本锚不能作为"L4 交互机制独立驱动
        崩溃"的干净证据——仅作为"该参数组合确实出现在崩溃前夜"的方向性合成锚。
      confidence: "weak-moderate(方向性支持,归因特异性不足——混淆变量无法独立排除)"
      composite_specific: true

    - anchor: "威权稳定区(ii)——低透明+无轮替+依附裁决的长期存续"
      evidence: |
        高度封闭的无轮替政体中(如某些绝对君主制/封闭一党制):无制度化轮替(终身制)、
        无独立裁决(裁决者就是执政者/直接任命)、信息高度不透明(无独立媒体/程序不公开/
        无成文规则公众可查)→不公存在但不被公开展示、受损群体原子化(DED-017 三条件不全)
        →长期犬儒而非造反。部分此类政体存续数十年甚至更久。
      independent_test: |
        轮替缺失+裁决依附+低透明由制度结构事实独立测——不以"长期存续"作为"透明度低"的
        证据(否则循环)。透明度须由信息自由/程序公开的独立指标(如媒体自由度、信息公开法)
        测，不由"是否崩溃"反推。
      honest_note: "封闭政体内部信息难以获取，透明度/裁决独立的独立测量可靠性有限。"
      confidence: "weak-moderate"
      composite_specific: true

    - anchor: "法治威权区(iv)——低轮替+高独立的存续与天花板"
      evidence: |
        殖民地时期的独立司法(如英国殖民地的普通法体系):无政治轮替(总督由帝国任命)但
        有相对独立的司法体系(法官职业化、遵循普通法传统、回避规则)→程序合法性部分缓冲了
        轮替缺失——但天花板随时间推移逼近(DED-014):当独立运动兴起(轮替缺失的合法性空洞
        被激活)，独立司法本身成为殖民统治的合法性争议对象。方向性支持(iv)的"条件性稳定+
        天花板有限"预测。
      independent_test: |
        轮替=有无成文自治/选举制度；裁决独立=法官任免与帝国政府的距离(制度事实)；
        稳定性=长期未崩溃但最终在独立运动中解体(纵向观察)。
      honest_note: "单个殖民地案例多因交织(民族主义/二战后的帝国撤退/经济)，归因需谨慎。
        此锚是(iv)区最薄弱的实证基础——天然案例稀少。"
      confidence: "weak"
      composite_specific: true

    - anchor: "跨区域相变边界(v)——DED-017 三条件激活后稳定区跨越"
      evidence: |
        法国大革命前旧制度:落在(iv)法治威权区或(ii)威权稳定区(有相对独立的高等法院但
        无制度化政治轮替)→不公集中在可辨识群体(第三等级)+预存组织在场(三级会议/俱乐部/
        巴黎各区议会)+改革渠道关闭(1787-1788显贵会议失败)→DED-017 三条件全满足→
        从"稳定(犬儒/有条件稳定)"跨越临界→1789爆发。此锚展示了:同一个政体可以在三条件
        不全时处于(ii)或(iv)稳定区，三条件一旦激活则跨越到(v)相变边界→崩溃。
      independent_test: |
        轮替/裁决独立/透明度由制度事实独立测(旧制度的结构编码)；不公集中度/预存组织/
        改革渠道由 DED-017 的独立指标测——不由"是否爆发"反推。
      honest_note: "法国大革命是多因交织的经典案例，单一解释必然不充分；此处只作'三条件
        激活→临界跨越'方向性合成锚。"
      confidence: "moderate"
      composite_specific: true

  counterexamples:
    - case: "高轮替+高独立+高透明度下的民主合法性下降——挑战(i)区的上限"
      analysis: |
        近年部分稳定民主政体出现政治信任持续下降、民粹主义崛起——如果这是"轮替只在
        两个相似精英集团之间"的 DED-014 ceiling 效应发作，则(i)区的"任何透明度下都稳定"
        需要诚实限缩:在极度透明揭露轮替实质性局限(两个精英集团轮流坐庄)时，合法性
        也可能受损——这正是 primary_suspect 所点的弱点。暂不算净杀反例(整体仍是稳定区，
        未到制度崩溃)，但迫使诚实地降低(i)区"任何透明度下都稳定"的绝对语气。
      status: "counterexample_hunt_open(边界反例——挑战(i)区上限但未到制度崩溃)"

    - case: "低轮替+低独立+高透明+长期稳定——活空格，待独立检"
      analysis: |
        若存在同时满足以下条件的政体(均由独立结构指标测得):(1)轮替→0(无制度化轮替或
        从未兑现)；(2)裁决依附(裁决者与执政方有明显利益共享)；(3)程序透明度高(规则成文
        公开、一贯执行)；(4)长期稳定(跨多轮周期无制度崩溃)且败方行为上和平接受——
        则命中空格(vi)，证伪本推论。
        诚实守门:(1)(2)(3)须由独立的结构+制度事实测，不得因(4)成立就事后调低(1)(2)或
        调高(3)的估值(DED-004 病根)。若此类案例存在且通过独立测量，推论归 rejected。
      status: "counterexample_hunt_open"

  boundary_cases:
    - case: "新加坡/香港——高独立+低轮替(iv区)的边界测试"
      analysis: |
        新加坡有制度化轮替(定期选举+事实上长期一党执政)且司法高度独立——接近(iv)区但
        轮替并非完全趋零(反对党可参选且偶有席位)。香港在殖民时期是(iv)区的典型案例
        (无政治轮替+独立司法)。两例均可检(iv)区"条件性稳定+天花板"的预测:司法独立是否
        确实缓冲了轮替缺失，以及天花板(合法性空洞)在何种条件下逼近。暂不算净杀或净支持，
        需细致编码。
      status: "boundary_case"

    - case: "北欧国家——高轮替+高独立+极高透明度(i区极限)"
      analysis: |
        北欧民主政体落在(i)区，且透明度极高(信息自由/媒体独立/政府公开)——是(i)区
        "任何透明度下都稳定"的最强测试。若极高透明度的条件下出现合法性下降(政治信任
        下降、民粹主义)，则(i)区需要限缩——此正是 primary_suspect。目前整体仍稳定，
        但长期趋势待观察。
      status: "boundary_case"

discriminant_validity: |
  【与 Acemoglu-Robinson(包容性vs采掘性制度)的判别】
  Acemoglu-Robinson 的二元框架(包容性经济制度+包容性政治制度→繁荣稳定，采掘性制度→
  不稳定)没有"交互效应"——在他们的模型里，(a)包容性政治制度(≈轮替+独立裁决)和(b)包容性
  经济制度是加性关系，透明度始终是好的(包容性的组成部分)。本推论的独有可证伪预测是:
  (1)透明度在依附条件下是坏的(DED-020 的交互——Acemoglu-Robinson 不给这个方向)；
  (2)独立裁决+无轮替可以是一个"条件性稳定区"(iv 法治威权区——Acemoglu-Robinson 的
  采掘性政治制度下不应有"条件性稳定"的细分)；
  (3)将交互效应嵌入更大的三维稳定相空间——而非"包容性↔采掘性"的单一维度。
  Acemoglu-Robinson 无法解释为什么"低轮替+低独立+低透明"(按他们=采掘性制度)比"低轮替
  +低独立+高透明"(同样是采掘性，但透明度不同)更稳定——这正是(iii)vs(ii)的方向排序，
  本推论独有。

  【与 Linz(威权主义类型学)的判别】
  Linz 的威权主义分类学(极权/威权/后极权/苏丹式等)是分类学——回答"有什么类型"。
  本条是动力学——回答"什么参数组合→什么稳定状态+相变边界"。Linz 的分类是静态标签，
  不给出参数空间中的稳定/不稳定分区和相变条件。例如，Linz 不会预测"同一个威权政体，
  在透明度从低升高的过程中会从稳定区(ii)跨越到最不稳定区(iii)"——这是本推论的动力学
  独有预测。Linz 的分类学可以作为被预测量(不同政体类型落在相图的不同格)但不等同于本
  推论的相空间结构。

  【防平凡化守卫】
  非平凡不在"民主比专制稳定"、"独立司法好"这些常识性命题。非平凡内核集中在:
  (1)三维相空间中交互效应的方向——透明不是单调好，在依附条件下是坏的(DED-020)，
  且这个交互与轮替轴(DED-011)共同决定稳定分区；
  (2)四个区域的完整分区——尤其"威权稳定区"(ii)和"法治威权区"(iv)的细分是任何双维
  框架(轮替×透明 或 轮替×独立 或 独立×透明 之一)产生不了的；
  (3)跨区域相变边界(v)——DED-017 的三条件在任何区域都可能激活，将稳定区变为临界区；
  (4)空格(vi)预测——"低轮替+低独立+高透明+长期稳定"为空。
  若这些被证伪，推论实质归零。

