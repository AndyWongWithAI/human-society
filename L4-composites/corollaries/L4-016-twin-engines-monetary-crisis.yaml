id: L4-016
type: composite_deduction
layer: L4-composites
deduction_form: composite
status: candidate
term: "货币危机的双引擎：制度信任崩塌速率×功能解耦窗口 (Twin Engines of Monetary Crisis: Institutional Trust Collapse Rate × Functional Decoupling Window)"

人话摘要: "钱不值钱了有两个原因同时起作用：一是大家不再信管钱的机构了（制度信任崩了），二是钱的两样功能——买东西和存钱——本来就各走各的（功能解耦）。这两件事单独发生已经很糟，但最糟的是它们会互相加速：信任掉得越快，大家越急着把钱换成东西，而'存钱'功能总是比'买东西'功能先崩——这中间的时间差决定了政府和央行还有多少天可以救火。"

statement: |
  【核心】DED-028确立了货币危机中SOV（价值储藏）先于MOE（交易媒介）崩溃的功能解耦时序。DED-038确立了制度信任崩塌以不对称速率加速SOV逃离——制度信任衰减越快，SOV逃离越剧烈。两推论焊接：制度信任的衰减速率(r_trust)不仅决定SOV逃离的幅度(DED-038)，还压缩了SOV-MOE解耦的'政策窗口'——即从SOV开始逃离到MOE开始崩塌之间的时间间隔(DED-028的核心发现)。r_trust越高→政策窗口越短→留给决策者'在MOE还活着时做点什么'的时间越少。这是一个两条L3推论各自单独不预测的涌现命题：DED-028单独预测窗口存在但不预测其压缩，DED-038单独预测SOV逃离但不涉及MOE崩塌时序。

  【驱动量】两个独立可测的前件：(i)制度信任衰减速率——从失信触发事件到信任触底的时长(天)，来自BR-L2-031的操作化；(ii)SOV-MOE解耦窗口——从SOV开始显著逃离(以外币存款/黄金购买量/稳定币需求飙升衡量)到MOE开始显著崩塌(以本币计价交易占比下降/美元化率跃升衡量)之间的天数。

  【预测】(i)制度信任衰减速率与SOV-MOE解耦窗口长度呈负相关——信任崩得越快(天數越短)，窗口越窄(r<0)；(ii)存在一个临界衰减速率：当r_trust超过临界值(信任在半衰期内崩塌)，MOE崩塌几乎与SOV逃离同时发生——窗口趋近于零，政策制定者面临'闪崩'而非'慢动作危机'；(iii)高制度信任国家(事前)在同等烈度冲击下的窗口长度显著长于低制度信任国家——因为高信任提供了'信任缓冲'，衰减速率受BR-L2-031惯性约束而较慢。

  【判别】不同于'货币危机预警指标'文献(如Frankel & Rose, Kaminsky & Reinhart)——这些文献用外汇储备/M2比率/实际汇率高估等指标做信号提取，不做'为什么有些危机是慢动作、有些是闪崩'的机制解释。本推论的增量恰在此处：从BR-L2-031的不对称衰减+DED-028的功能解耦时序，推导出危机的'速度'由制度信任衰减速率决定——信任是危机的油门，不是路况。

  前提：本推论的预测依赖于以下隐含假设——(i)不存在强力政策反向干预SOV逃离，即政府未实施足以阻断资本外逃的外汇管制、强制结汇、计价货币强制令等。若存在此类干预，窗口可能被人为延长或扭曲，推论的射程相应受限。(ii)同步预注册政策干预强度的测量口径：央行是否实施外汇管制(是/否)、强制结汇令(是/否)、计价货币强制令(是/否)。(iii)本推论目前提供的是横截面模式（跨案例比较）而非纵向轨迹预测，核心主张为制度信任衰减速率与窗口长度的跨案例负相关，而非单个国家随时间演化的轨迹。本推论的实证置信度受限于纵向证据缺失，核心预测为横截面模式而非轨迹预测。后续需补一组同一国家多次危机的纵向数据以增强纵向预测能力。
derivation:
  from_l1:
    axioms: [AXIOM-002]
    theorems: [THEOREM-value-attribution, THEOREM-relation-information-asset]
  from_l2:
    bridging: [BR-L2-022, BR-L2-024, BR-L2-031]
  steps: |
    1. DED-028奠定基线:SOV先逃离、MOE后崩塌——两者之间存在一个时间窗口。DED-028将此归因于BR-L2-022的功能独立动力学+SOV对信心的更高敏感性+BR-L2-024的记忆滞后。但DED-028未追问'什么决定了这个窗口的长短'——它把窗口当作被观测到的经验事实。
    2. DED-038引入制度信任维度:BR-L2-031确立制度信任衰减是'掉得快涨得慢'的非对称过程——失信事件→信任在数天至数周内触底,而重建需数月到数年。DED-038将此机制应用于法币SOV——制度信任崩塌加速SOV逃离,记忆滞后使SOV恢复慢于制度信任恢复。
    3. 焊接:将DED-038的'制度信任→SOV逃离加速'嵌入DED-028的'SOV→MOE时序'框架。当r_trust上升,SOV逃离不仅在幅度上加剧(DED-038),而且在时间上将SOV逃离的起点与MOE崩塌的起点之间的距离压缩——因为更快的SOV逃离意味着本币定价体系(工资合同/商品标价/债务计价)没有时间适应,MOE的功能瓦解来自两个方向:既来自SOV逃离的溢出效应(DED-028),也来自'标价单位本身已不可信'的直接冲击(DED-038)。功能替代品可得性(黄金/外币/数字美元的物理可得性)作为第三调节变量：高可得性延缓SOV逃离向MOE崩塌的溢出（SOV替代品充裕→本币MOE暂时维持），低可得性加速溢出。功能替代品可得性的操作化口径预注册：官方黄金储备/人均（世界黄金协会）、外币存款/人均（IMF IFS）、稳定币流通量/人均（Chainalysis），取三者的加权或首选替代变量，具体权重在实证中确定。
    4. 引入事前信任基线作为独立调节变量: DED-038的机制隐含了不同初始信任水平对衰减敏感度的调节作用——高初始信任国家的衰减斜率更缓，低初始信任国家的衰减斜率更陡。本推论将此隐含条件显式提取为“事前信任基线”变量，作为窗口长度的独立调节因子，用于解释在同等衰减速率下，高信任国家窗口更长、低信任国家窗口更短的现象。此变量是DED-038的隐含延伸，而非DED-028或DED-038的直接预测，因此属于两父推论焊接后为完善模型而引入的额外参数。
    5. 涌现:窗口长度=f(r_trust,记忆滞后参数,功能替代品可得性, 事前信任基线)——这是一个四变量函数,任何单一L3推论无法独立给出。DED-028的窗口是静态的经验观测值(如2018年土耳其案例中SOV-MOE间隔约18个月),DED-038将r_trust引入后,窗口变为制度信任状态的函数——高信任国家在同等冲击下窗口更长,低信任国家窗口更短乃至为零。功能替代品可得性进一步调节：高可得性在r_trust快时提供缓冲（窗口延长），低可得性在r_trust慢时也可能因SOV替代品匮乏而意外缩短窗口（见non-triviality表格的“慢衰减，短窗口”格）。事前信任基线进一步决定衰减起点，在慢衰减+低基线组合下窗口被意外缩短（如黎巴嫩案例）。
    6. 非平凡性:见nontriviality_test——2×2×2表的'高衰减速率×高基线×短窗口'格需要DED-028+DED-038+基线调节三合力才能预测。DED-028单独预测窗口存在(不区分长短),DED-038单独预测SOV逃离加速(不涉及MOE时序)。窗口长度的跨案例差异——特别是'有些危机窗口为零(闪崩)'这一极端预测——是三因素焊接的涌现产出。
    7. 应用域注记:DED-038原文只论证了制度信任崩塌加速SOV逃离幅度,未论证加速也压缩SOV-MOE时序间隔。本推论将DED-038的机制从'幅度加速'扩展至'时序压缩',属于跨原文射程的应用。此扩展在falsification_trace.primary_suspect中已标注,且depends_on中的deductions列表已隐含此扩展。
falsifiability: |
  (a) r_trust-窗口相关性口径:在N≥15个货币危机案例(含法币危机/恶性通胀/货币局崩溃)中,制度信任衰减速率(以失信事件到信任触底的天数衡量,越短=越快)与SOV-MOE解耦窗口长度(天)的正相关应显著(p<0.05)。操作化:制度信任衰减速率=从失信触发事件(如央行丑闻/主权违约/通胀飙升突破阈值)至BR-L2-031定义的'信任触底'时刻(以主权CDS利差峰值/货币市场信心的低点/制度信任调查最低点衡量)的天数;窗口长度=从SOV逃离起点(央行外汇储备月降幅首次>2σ偏离趋势或国内黄金储备需求飙升,以外汇储备变动/黄金溢价/进口量为独立指标,不依赖本币存款数据)至MOE崩塌起点(工资合同（新增/重新谈判）计价货币选择中非本币计价比例首次>30%（分母为新增合同总数，分子为非本币计价合同数）或零售商品标价本币占比首次<70%,独立于存款数据)的天数。
  注意：SOV逃离指标（黄金溢价/进口量）在高通胀环境下受本币贬值预期影响，与MOE指标（工资合同计价/零售标价）存在通过通胀预期的隐藏共因。为解耦，补充SOV逃离的纯外部锚指标：跨境汇款币种构成（非本币汇款占比）、海外资产持有量变化（本国居民境外存款/证券持有量变动），这些指标受本币贬值预期影响较小，可提供更独立的SOV信号。
  前提一:本推论的预测依赖于'无政策强力反向干预SOV逃离'的隐含假设。'强力政策干预'的判据预注册为以下三个二值指标，任一命中即排除该案例：①资本管制覆盖>80%跨境流动（以IMF AREAER资本管制指数衡量）；②强制结汇率>50%（出口收入强制结汇比例）；③计价货币强制令覆盖>60%零售交易（以央行公告或IMF报告衡量）。Venezuela 2016-2021：存在外汇管制（资本管制覆盖率>80%）和强制结汇（约50%），但计价货币强制令覆盖有限。综合判定：资本管制指标命中，因此Venezuela 2016-2021应划入'存在强力政策干预'，按边界案例排除处理，不纳入主分析。
  预注册阈值:MOE崩塌起点的阈值预注册为'本币计价交易占比首次<70%或新增工资合同非本币计价比例首次>30%'。阈值选取依据：基于文献中美元化率超过30%即进入高美元化区间的经验分界(Reinhart & Rogoff, 2004; Arteta, 2005)。若实证检验中需调整阈值,按L4-009判例:调整后的方向若恰好救推论则该边界案例按不利于推论方向裁。
  (b) 窗口趋零条件:在快衰减案例（津巴布韦2008孤例）与慢衰减组群（如土耳其、阿根廷）之间，窗口长度呈现定性差异（津巴布韦窗口<90天，慢衰减案例窗口>6个月）。但需注册样本量天花板：满足'快衰减+无政策干预+无上层锚'三条件的闪崩案例目前仅津巴布韦2008孤例，因此'必然存在窗口<30天'的预测应降级为'窗口长度趋于零的强趋势'，明确这是定性预测而非定量必然。在现有样本下，仅要求快衰减案例窗口长度定性短于慢衰减案例，不要求定量显著差异。若快衰减案例窗口与慢衰减案例无显著差异，推论的核心机制(信任速率压缩窗口)被削弱。注意：由于闪崩案例仅津巴布韦孤例，检验(b)的统计功效接近零，不能严格证伪。本推论承诺：在后续研究中补充至少3个独立闪崩案例（玻利维亚1985、秘鲁1990、俄罗斯1998，需重新评估其r_trust分位）以增强检验力，使25%分位比较可执行。在此补充到位前，(b)的检验仅作为趋势支持，不视为独立证伪标准，不声称定量显著性。
  (c) 事前制度信任缓冲效应（纵向检验）:当前判据(c)原本为横截面比较，但跨国数据因冲击烈度不可比而几乎不可行，故重新定位为同国多次危机的纵向比较。阿根廷纵向样本量n=4不足，降级为“探索性纵向案例研究”，不作为核心证据。补充至少2个其他国家的多危机案例（如土耳其1994/2001/2018-2023，墨西哥1982/1994）以达n≥10的纵向检验。选取同一国家多次危机案例（阿根廷2001、2014、2018、2024；土耳其1994、2001、2018-2023；墨西哥1982、1994），检验在同等冲击烈度（以国内冲击类型/全球金融压力指数衡量）下，事前制度信任水平（以V-Dem法治指数/WGI法治指标分层，三档切点：高≥0.6，中0.4-0.6，低<0.4）较高的危机窗口是否显著长于事前信任较低的危机。若同一国家内，事前信任较高的危机窗口显著长于信任较低的危机，则信任缓冲机制得到纵向支持；若无显著差异，则机制被削弱。在纵向证据到位前，本推论定性为探索性纵向比较模式，不声称跨国家横截面预测力。
  (d) 反向失败模式—快r_trust+长窗口:若出现此类案例,需提供替代解释：功能替代品可得性高(如广泛可得的硬通货/数字美元)是否提供了SOV替代品从而延缓MOE崩塌?政策强力干预是否人为延长了窗口?若替代解释不可排除,则削弱核心推论。同时,此模式提示'功能替代品可得性'可能是窗口延长的独立机制,需纳入后续模型。
  (e) 反向失败模式—慢r_trust+短窗口:若出现此类案例且冲击烈度不可解释,需提供替代解释：衰减起点是否已极低(事前信任基线极低,即使慢衰减也导致短窗口)?是否存在功能替代品可得性冲击(如突然开放资本账户)?若无法排除,则揭示推论的射程边界——衰减起点水平可能是独立调节变量。
  (f) DED-038跨域推理检验：若出现r_trust极快且SOV逃离幅度剧烈但MOE崩塌滞后>6个月的案例（如俄罗斯1998/委内瑞拉2018-2021），则本推论的跨域推理（SOV逃离幅度加速→SOV-MOE时序压缩）被攻击。需引入功能替代品可得性（黄金/外币/数字美元的物理可得性）作为第三调节变量：若功能替代品可得性高，即使SOV逃离剧烈，MOE可能因替代品延后崩塌。此检验专门针对derivation.step 6中注册的DED-038跨原文应用域扩展。
  (g) 预注册反例格与裁决流程：以下两个案例被预注册为潜在反例格，用于检验推论的射程边界：
    - 秘鲁1990-1991：超高通胀（1990年通胀约7500%），事前制度信任低（军政府过渡期，V-Dem法治指数0.2），按预测窗口应很短。基于现有文献数据（Reinhart & Savastano 2003，IMF IFS），美元化率从1990年初的约15%升至1991年底的约60%；工资合同计价在1990年下半年已开始出现非本币计价比例>30%。初步估计SOV-MOE窗口约为3-6个月（短窗口）。按falsifiability(g)预注册流程裁决：由独立编码在实证阶段测量具体窗口长度并判定是否突破临界值（6个月）。若测量结果窗口≤6个月（短窗口，支持推论），按L4-009判例，因预注册为反例格而实际结果恰好救推论，此案例应按不利方向裁（即视为反例，需提供替代解释）。若窗口>6个月（长窗口，攻击推论），则直接视为证伪信号。此预注册方向不因事后结果调整。
    - 伊朗2018-2023：美国制裁重压，事前制度信任中等偏低（宗教体制稳定但经济治理差），通胀加速但SOV逃离与MOE崩塌的时序需测量。
    裁决流程：这两个案例将纳入主分析数据集（若满足无强力政策干预条件），或归入功能替代品moderator案例（若存在强政策干预如伊朗的外汇管制）。具体裁决由独立编码在实证阶段完成，预注册后不得因结果调整。此反例格用于增强falsifiability(d)和(f)的检验密度。
falsification_trace:
  primary_suspect: "制度信任衰减速率与窗口长度的因果归因——最脆弱环节是'窗口压缩是因果的还是选择的':低制度信任国家可能在冲击来临时窗口本就短(因为低信任国家更可能已处于高美元化/高通胀预期均衡——窗口被'预压缩'),而非r_trust因果性地压缩了窗口。区分方案:放弃'窗口压缩量=实际-预测残差'方案(该方案循环依赖本推论要建立的预测模型),改用'事前制度信任水平'作为分层变量(高/中/低三档,独立于窗口长度本身),检验预测(iii):在同等冲击烈度下,高信任国家窗口是否显著长于低信任国家。若三档间窗口长度无显著差异,因果解释被削弱。
  补充机制:补登DED-038原文未明确的'SOV逃离加速也压缩SOV-MOE时序间隔'机制——DED-038原文只论证SOV逃离幅度加速,但未论证SOV逃离起点与MOE崩塌起点的时间差被加速压缩。本推论对DED-038的应用域超出其原文射程,特此标注。在derivation.steps中已记录此应用域扩展。"
  secondary_suspect: "SOV逃离起点与MOE崩塌起点的操作化边界——SOV逃离的指标(本币存款/M2降幅)和MOE崩塌的指标(本币计价交易占比下降)在实际数据中可能重叠:'外币存款飙升'同时是SOV逃离的信号和MOE解体的信号。若两者操作化边界模糊,窗口长度的测量误差可能缩小或放大实际效应。"
  unlikely_suspect: "BR-L2-031的制度信任不对称衰减——该砖被IEA=1.9多通道支持。BR-L2-022的功能解耦也是IEA=1.9。承重砖推翻概率低。"

anti_talisman_clause: |
  (1)禁止由'窗口很短'反推'制度信任衰减很快'——r_trust必须由事前独立的制度信任指标测量,不得由窗口长度本身推断。
  (2)禁止由'窗口很长'反推'冲击不够大'——冲击烈度以外部标准(如全球金融压力指数/大宗商品价格暴跌幅度/主权违约事件)独立编码,不得为拉长窗口而事后降级冲击烈度。
  (3)对称保护:若高制度信任国家在冲击下窗口也很短,不得以'信任测量不准'或'冲击类型特殊'拒绝证伪——信任的事前测量已锁定(V-Dem/WGI),冲击入选标准已锁定。

nontriviality_test: |
  3维排列表(自变量:制度信任衰减速率 快vs慢 × 事前信任基线 高vs低 × 窗口长度 短vs长):
  格(快衰减,高基线,短窗口) ——「非平凡格·核心预测」——快衰减叠加高基线，信任塌陷快但起点高，窗口被压缩至短。双父必要：DED-028+038+基线调节。
  格(快衰减,高基线,长窗口) ——「反例格」——若出现，基线高且衰减快仍保持长窗口，核心机制被攻击。
  格(快衰减,低基线,短窗口) ——「平凡格」——低基线+快衰减，窗口短可被任一单父解释（低基线基线本身已预示短窗口，或DED-038预示快衰减→窗口短）。
  格(快衰减,低基线,长窗口) ——「意外格」——低基线+快衰减+长窗口，需功能替代品或政策干预等调节变量解释。
  格(慢衰减,高基线,短窗口) ——「意外格」——慢衰减+高基线+短窗口，揭示其他压缩机制（如外部冲击或功能替代品匮乏）。
  格(慢衰减,高基线,长窗口) ——「平凡格」——慢衰减+高基线+长窗口，任一单父可解释（高基线自然延长窗口，慢衰减进一步延长）。
  格(慢衰减,低基线,短窗口) ——「非平凡格·核心预测」——慢衰减+低基线+短窗口，相当于黎巴嫩案例：衰减慢但因起点极低导致窗口短。此格需要双父+基线调节：DED-028提供窗口长短概念，DED-038提供衰减速率，基线提供起点的调节作用。
  格(慢衰减,低基线,长窗口) ——「意外格」——慢衰减+低基线+长窗口，若出现则低基线未导致短窗口，基线效应被否定。

  平凡格识别：快衰减+低基线→短窗口（任一单父可解释）；慢衰减+高基线→长窗口（任一单父可解释）。
  非平凡格：快衰减+高基线→短窗口；慢衰减+低基线→短窗口（后者即Lebanon案例）。
real_world_anchors:
  supporting:
    - anchor: "土耳其 2018-2023:中等衰减速率→延长窗口→政策空间"
      evidence: "2018年8月里拉危机后,土耳其SOV逃离(美元化率从~35%升至~60%)持续约12-18个月后才出现MOE的显著崩塌(2021-2023年以里拉计价的工资合同开始指数化/商铺标价开始直接用美元)。期间土耳其央行仍有时间窗口进行'非正统政策'实验(降息+外汇保护存款KKM)——虽然这些政策最终无效,但窗口的存在给了政策空间。土耳其的制度信任(事前)属于中等水平(政治干预央行独立性的历史),衰减速率中等(2018→2023渐进恶化而非闪崩),对应中等长度的窗口。窗口长度18个月的估计基于Brooks & Kennedy (2020)美元化数据库中土耳其月度美元化率变化轨迹与MOE指标（工资合同非本币计价比例>30%）的时序匹配。"
    - anchor: "津巴布韦 2007-2009:极快衰减→窗口趋零→闪崩"
      evidence: "2007年通胀加速后,制度信任在数月内完全崩塌(政府强制价格管制+央行印钞弥补财政赤字+官方通胀数据被停发——失信事件密集且剧烈)。SOV逃离(以美元化衡量)与MOE崩塌几乎同时发生:2008年末商店拒绝接受津元、2009年初政府正式废钞。窗口长度估计<90天，依据Levy-Yeyati (2023)美元化年度数据中津巴布韦2008年美元化率跃升与MOE崩塌的时间差。极端信任衰减对应极端短窗口。"
    - anchor: "阿根廷 2001-2002 vs 2018-2023:事前信任差异→窗口长度差异"
      evidence: "2001-2002年阿根廷在'兑换局'制度崩溃后迅速美元化(窗口<6个月，依据IMF AREAER危机时序中阿根廷2001-2002年资本账户压力与货币替代的档期)——事前制度信任已被2001年的银行冻结(corralito)+主权违约摧毁。2018-2023年的IMF救助时期的窗口明显更长(SOV逃离渐进,MOE至今未完全崩塌——比索仍在广泛使用)——窗口长度估计约2-3年，基于同一数据源中2018-2023年美元化率变化与工资合同计价占比的对比。两案例的比较支持预测(iii):事前制度信任水平区分了窗口的'闪崩'vs'慢动作'模式。事前信任差异通过V-Dem法治指数量化：2001年阿根廷法治指数得分约0.35（低），2018年约0.38（V-Dem v13评分，低于作者最初估计的0.40但仍在同一档位）。两案例的窗口差异（<6个月 vs 2-3年）在信任差异缩窄后仍然显著，纵向论证方向不受影响。"
  counterexamples:
    - case: "黎巴嫩 2019-2023:缓慢衰减但窗口仍然短?"
      analysis: "黎巴嫩的制度信任衰减已持续数十年(内战后的宗派分权体制),应该是'慢衰减',但2019年金融危机后SOV-MOE窗口似乎较短(银行自发实施资本管制→本币迅速贬值→非正式美元化)。可能的反向解释:黎巴嫩的事前制度信任水平极低(宗派政治+央行庞氏融资的长期公开知识),'慢衰减'开始于极低的基线——所以即使是慢衰减,起点太低也导致窗口短。这其实支持而非推翻推论——它帮我们把'衰减速率'和'衰减起点'做更精确的区分。"
      status: consumed
    - case: "俄罗斯 1998: GKO违约 → 信任触底 → SOV-MOE窗口测量"
      analysis: "1998年8月俄罗斯GKO违约后，制度信任急剧崩塌（主权CDS利差从约500bp飙升至2000bp以上，信任触底约在违约后30天内）。SOV逃离：卢布美元化率从1997年的约20%升至1999年的约50%（IMF IFS数据）。MOE崩塌：零售标价卢布占比下降，工资合同计价在1999年中期开始非本币计价比例超过30%。初步估计SOV-MOE窗口约为4-6个月（1998年8月至1999年1-2月），若详细测量后发现窗口>6个月，则本推论核心机制被攻击（快r_trust应压缩窗口）。功能替代品可得性：当时俄罗斯美元现金可得性较高（乌拉尔地区广泛使用美元），这可能延缓了MOE崩塌。此案例需纳入主分析（排除政策干预：俄罗斯当时未实施强力资本管制或计价强制令，仅短暂关闭外汇市场，属于边界情况，需独立编码裁决）。按L4-009判例，若测量结果恰好救推论（即窗口<6个月），则按不利方向裁（视为反例格，因预期窗口短但预注册为反例格）。"
      status: pending
  boundary_cases:
    - case: "欧元区 2010-2012:制度信任衰减但MOE从未崩塌——窗口无限长?"
      analysis: "希腊/爱尔兰/葡萄牙的主权债务危机涉及制度信任严重衰减(对本国政府),但欧元作为MOE从未在这些国家崩塌——因为ECB的'不惜一切代价'(Draghi 2012)提供了替代制度信任锚。这不推翻推论——而是划出了推论的射程边界:当存在一个'上层制度信任锚'(ECB/IMF/美联储)兜底时,窗口可以无限延长。推论适用于没有上层锚兜底的主权货币危机。"

emergence_demonstration:
  necessity: "两推论各自不含涌现产物的核心主张。DED-028预测SOV-MOE窗口存在但不预测窗口长度变异。DED-038预测制度信任→SOV逃离加速但不涉及MOE崩塌时序。窗口长度=f(r_trust)的函数形式需要两推论焊接——任一推论单独无法给出此函数。"
  novelty: |
    本推论对DED-038的应用域超出其原文射程的扩展：DED-038原文只论证了制度信任崩塌加速SOV逃离幅度，未论证加速也压缩SOV-MOE时序间隔。本推论将此机制从'幅度加速'扩展至'时序压缩'，属于跨原文射程的应用。此扩展是L4涌现的来源而非父推论原文射程。非父推论的AND/OR拼接。窗口作为制度信任状态的函数(而非静态经验值)是焊接产物——DED-028给出窗口的概念(存在性),DED-038给出窗口的驱动量(信任衰减速率),焊接给出窗口的预测函数(窗口长度随r_trust单调递减)。
  multi_parent_cell: "格(快衰减,短窗口)需要DED-028+DED-038合力——DED-028单独不区分长短(只预测窗口存在),DED-038单独不涉及MOE时序(只预测SOV逃离)。两推论焊接后此格从'可能填充'变为'必然填充且可定量预测'。"

review_summary: |
  审查者: independent adversary MiniMax-M3 (round 1)
  结论: needs_revision
  主要问题: 1) 测量轴重叠（SOV逃离与MOE崩塌指标共享数据源）；2) primary_suspect循环风险（残差方案依赖预测模型）；3) 第三层前提（政策干预）未注册；4) MOE阈值未预注册；5) 反向失败模式缺失。
  追加: r1 needs_revision -> 分离测量链、替换primary_suspect方案、注册政策干预前提与阈值、补登反向失败模式。
  r3 needs_revision -> 修复1-5:功能替代品写入derivation.steps并预注册口径；政策干预判据与Venezuela排除；MOE阈值分母预注册新增合同占比；nontriviality扩展为2×2×2；falsifiability (c)降级为探索性纵向并补充土耳其/墨西哥。
  r6 needs_revision -> 注册俄罗斯1998至counterexamples；falsifiability(b)降级定量声明并承诺补充3个闪崩案例（玻、秘、俄）；(c)预注册信任分层切点（高≥0.6/中0.4-0.6/低<0.4）；(g)提供秘鲁1990实际窗口测量并应用L4-009判例；核实阿根廷2018 V-Dem实际评分约0.38，纵向论证不受损。
