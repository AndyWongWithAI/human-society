id: L4-007
type: composite_deduction
layer: L4-composites
deduction_form: composite
status: verified
term: "数字时代道德碎片化 (Digital Moral Fragmentation)"
claim_type: trajectory_prediction

人话摘要: "算法让邻居活在两个道德宇宙——TP默契崩了，一个社会挤着好几个互不通气的道德部落。"

statement: |
  【Composite claim】
  数字通信（算法推荐、社交媒体、个性化信息流）从根本上改变了道德规范维持所需的信息条件。
  当同一地理空间内的个体不再共享"什么违规正在被惩罚"的对等性信号，第三方惩罚的协调基础
  瓦解→规范在群体边界处（DED-026）沿信息泡边缘重新分化→分化自强化（DED-025 的 M3+M4
  熵增通道在每个子道德空间内独立运转）→代际锁定后不同信息泡之间连"什么算不公平"的共享
  前提都瓦解了（道德不可译性）。碎片化在高道德密度议题最严重，在共享威胁时暂时逆转。

  【Parent mechanisms】
  DED-026（道德群体边界推论）给：(a) TP 强度在群体边界处结构性陡降（阶梯效应），
  (b) 群体边界可被通信技术和共享灾难外推，(c) 旁观者效应的结构稀释受群体身份线索调节。
  DED-025（道德标准通胀-紧缩）给：(a) 通胀需 M1（受害叙事）+M2（道德创业者）合取推动，
  (b) 紧缩是熵增默认——M3（第三方执行瓦解）和 M4（代际内化断裂）任一激活即自动松绑，
  (c) 通胀需要刻意能量投入、紧缩只需维护能量断裂的方向不对称。

  【Emergent property】
  本推论的涌现属合取级（conjunction / 薄涌现）：两条父推论各自独立产生自己的机制，在
  "数字通信碎片化信息生态"这一新条件下并行运作→产生的综合效果（多道德空间共存互不通约）
  不能由任一条父推论单独推出。

  DED-026 单独讲"通信技术可外推群体边界"——它预测边界移动（扩展或收缩），不预测边界
  *增殖*——即同一地理空间内冒出多个互不重叠、各自维持独立 TP+内化循环的道德子空间。
  DED-025 单独讲"道德标准在 M3/M4 激活时社会层紧缩"——它预测社会整体的方向变化，
  不预测同一社会内不同亚群体可同时发生不同方向（甚至相反方向）的道德标准变化。
  只有将"通信技术不是外推边界而是增殖边界"（DED-026 的边界机制在新信息条件下的扩展）
  与"增殖后的每个子空间独立运转 M3+M4 熵增通道"（DED-025 的紧缩机制并行化）合起来，
  才推出"一个社会挤着好几个互不通气的道德部落"这一综合格局。

  涌现类型声明：合取级（conjunction）。两条父推论独立产生各自方向的压力——DED-026 解释
  "信息泡如何成为新群体边界"，DED-025 解释"每个边界内的熵增如何独立运转"——
  二者是独立因果链的并行叠加，非一条修改另一条的运作方式。涌现强度在"合起来产生
  道德不可译性这一新结果类型"——任一单条父推论的方向是"单一道德空间内的变化"，
  合取才产生"多个不可通约的道德空间同时共存"这一结构性结果。

  【Prediction】
  (i) 道德不可译性（moral untranslatability）：不同信息泡之间的道德判断差异不再是
  "程度不同"（同一标准上的高低），而是"种类不同"（不同的标准体系）——连"什么算不公平"
  的共享前提都瓦解了。这比 DED-022（多层公平冲突——同一人多重身份对应不同公平标准但
  标准框架本身共享）更极端：碎片化后不同泡的成员之间连公平的基本定义框架也不再共享。
  (ii) 碎片化梯度——道德密度调节：碎片化在"高道德密度"议题（需细粒度语境信息才能判定
  对错，如性骚扰、文化挪用、仇恨言论）上远比"低道德密度"议题（信号强、共识门槛低，
  如谋杀、偷窃）严重。机制：低密度议题的信号足够强，跨泡仍可共享识别→基本共识可维持；
  高密度议题的信号弱且依赖特定信息泡内的语境→各泡用各自的语境判断→不可通约。
  (iii) 共享威胁→暂时逆转：共享威胁（恐怖袭击、疫情、自然灾害）瞬时创造跨泡共享信息→
  所有人的信息流短暂对齐→道德判断暂时重新同步（对应 DED-026 的"共享灾难外推群体边界"
  机制）→但威胁消退后碎片化恢复且可能加速（"敌人消失后我们又是敌人了"的反作用力）。
  (iv) 代际锁定：新一代（在其发育窗口期）接收到的对等性信号已经是碎片化的→他们内化的
  是其所在信息泡的道德规范→成年后对其他信息泡的道德判断感到匪夷所思→跨泡道德沟通
  不仅是意愿问题更是认知/语义问题——双方缺乏共享的"违规事件"参照库。

# === 规则 A：操作化定义 ===

operationalization:
  information_source_fragmentation:
    definition: "个体不再从同一套共享信息源接收'什么违规正在被社会惩罚'的信号的程度——即对等性信号源的共享度。"
    measurement: |
      三维度：(a) 信息源重叠指数——两随机个体的每日信息消费中有多大比例来自同一原始信源
      （如两者都看到同一地方新闻/都刷到同一事件的推送），独立于其态度；
      (b) 算法个性化程度——平台的内容推荐中，同一事件对不同用户的曝光率方差（高方差=高碎片化）；
      (c) 跨泡信息渗透率——一个信息泡中广泛传播的道德事件在另一泡中的知晓率。
      三者的聚合：低碎片化=两随机个体的共享信息源比例>50%且算法曝光方差<0.3；
      高碎片化=共享比例<20%或算法曝光方差>0.7。
    limitations: "信息源碎片化≠意见分歧——共享同一信息源的人仍可持相反道德判断。碎片化测量的是'是否接收到同一事件的信息'（信息接触层），不是'如何评价该事件'（态度层）。不得因'他们意见不同'反推'他们信息源必碎片化'。"

  moral_density:
    definition: "一个议题的道德违规判定所需的细粒度语境信息量。低密度=违规识别仅需少量可公开观测的信号（如暴力行为的物理证据）；高密度=违规识别需大量依赖特定语境和主观解读的信息（如'这句话是否构成骚扰'取决于双方关系历史、语气、文化语境等）。"
    measurement: "独立编码者对同一议题的道德违规判定所需信息条目数来标定。低密度（1-3条信息可判定）；中密度（4-10条）；高密度（>10条或存在不可公开获取的私人信息）。编码须在指定信息泡外、使用最广泛共享的信息进行，不得动用特定信息泡内的独有语境信息——否则'高密度'本身已被碎片化污染。"
    limitations: "道德密度可随时间变化——随着社会对某议题的理解深化，原本高密度议题可降低密度（如性骚扰从模糊地带走向明确法律标准）。纵向比较需标定测量时点的社会共识水平。"

  moral_fragmentation_index:
    definition: "复合输出变量——同一地理空间内不同亚群体之间的道德判断不可通约程度。"
    measurement: |
      三步：(a) 识别亚群体（按信息源重叠度聚类，独立于其道德判断内容）；
      (b) 对同一组道德违规vignette，测量不同亚群体的平均惩罚强度评分（TP强度）和
      违规认定的二值判断（"这是否构成违规"）；
      (c) 计算跨群体道德判断的结构性歧化指数，拆为两个子指标：
      - 强度歧化指数 = 1 - [跨群体评分相关系数/群内评分相关系数]——捕获"程度差异"
      （同一道德判断框架内不同群体惩罚强度不同，DED-026 + DED-019 可解释）；
      - 框架歧化指数——对各群体分别做道德判断 vignette 的探索性因子分析（EFA）
      或层次聚类，计算跨群体因子一致性指数（如 Tucker's congruence coefficient），
      若 congruence < 0.85 → 因子结构实质歧化 → 道德不可译性（L4-007 独有预测）。
      仅当框架歧化指数也显著时，L4-007 才获得超越父推论（DED-026 单独）的
      独立经验支持——程度差异可由 DED-026 解释，框架差异需 L4-007 的复合机制。
    limitations: "道德碎片化≠政治极化——后者可用单一左-右轴描述，碎片化意味着不可约化为一个维度。若跨群体差异可用单一连续维度捕捉（如自由-保守），则不构成'碎片化'而是'极化'——本推论的碎片化特指多维不可通约。"

  tp_coordination_collapse:
    definition: "中介变量——原本共享同一道德规范的个体之间，因信息源分化导致的第三方惩罚协调成本上升→TP实际发生频率下降。"
    measurement: |
      (a) 协调成本代理指标：对同一违规事件，不同信息泡的个体对该事件"是否构成违规"的判断一致性
      （若一致性<随机水平→协调不可能）；
      (b) TP频率：田野中可观察的第三方制裁行为（排斥/羞辱/举报）的跨泡频率——若TP几乎全部
      发生在泡内（制裁者和被制裁者同信息泡）而极少发生在泡间→协调已瓦解。
      独立于 moral_fragmentation_index：TP协调瓦解是过程变量（机制链的中间站），
      碎片化是终局状态——两者须独立测量，不得循环论证。
    limitations: "TP行为的可观察性受平台架构影响——不同平台的举报/屏蔽/取消关注等功能设计决定了TP的表达形式。跨平台比较需标准化。"

# === 推导 ===

derivation:
  from_l3:
    deductions: [DED-026, DED-025]
  from_l1:
    axioms: [AXIOM-001, AXIOM-002, AXIOM-003, PHY-001]
    theorems: [THEOREM-moral-third-party-enforcement, THEOREM-moral-internalization, THEOREM-group-identity-decay]
  from_l2:
    bridging: [BR-L2-006, BR-L2-014, BR-L2-018, BR-L2-019]
  from_l4: []
  steps: |
    1. 父机制摘要
       DED-026 确立：TP 执行强度在群体边界处结构性陡降（阶梯效应），群体边界可被人为移动
       （通信技术+共享灾难是两个独立渠道）。关键结构事实：TP 是绑在群体边界上的——边界在哪，
       TP 的阶跃就在哪。
       DED-025 确立：道德标准的紧缩是熵增默认状态——M3（TP 瓦解）和 M4（代际内化断裂）
       是两条独立通道，任一激活标准自动松绑；通胀需要 M1+M2 合取推动。关键不对称：紧缩不需要
       "反道德创业者"——维护能量一断，熵增接管。

    2. 交互逻辑——数字通信的特殊性
       前数字时代：通信技术（报纸、广播、电视）是共享信息源→DED-026 的道德圈扩展逻辑成立——
       通信使远方苦难"可见"→群体边界外推→TP 延伸。此时通信技术发挥的是"桥"的功能。
       数字时代关键转折：算法推荐不再发挥"桥"的功能——它按用户画像分发个性化内容，
       使同一地理空间内的不同个体接收到互不重叠的道德事件集合。DED-026 的"通信技术外推边界"
       逻辑在此处被反转——通信技术不再统一信息生态，而是分裂它。这不是 DED-026 预测的"边界移动"
       （边界还是那条边界，只是位置变了），而是"边界增殖"（冒出多条新边界，每条对应一个信息泡，
       且泡与泡之间的信息重叠度可趋近于零）。

    3. 涌现论证——合取级
       DED-026 单独看：只预测"通信技术移动群体边界"，不预测"通信技术增殖群体边界"。
       增殖是新现象——需要解释的不是"边界移到哪"，而是"为什么同时存在多条边界且不重叠"。
       DED-025 单独看：只预测"社会整体道德标准在 M3/M4 激活时紧缩"，不预测"同一社会内
       多个子空间同时发生不同方向的紧缩/通胀"。DED-025 的 M3 机制假设"TP 是社会整体的执行
       机制在瓦解"——它不考虑 TP 执行在泡内反而可能加强（"我们的人还在管"的替代叙事）而
       仅在泡间瓦解。

       【per-bubble 扩展论证——M3/M4 的泡间/泡内不对称运作】
       DED-025 的 M3（TP 瓦解）和 M4（代际内化断裂）原文均为社会整体层概念——
       M3 假设单一社会的 TP 系统在整体瓦解，M4 假设社会整体的对等性信号断裂。
       在碎片化条件下，二者的运作面发生不对称分化：
       (a) M3 的泡间面——跨泡 TP 协调瓦解：跨泡利益占比趋近于零→旁观者不再跨泡
       执行第三方惩罚。这本质是 DED-026 的群体边界→TP 阶跃逻辑的直接应用，
       DED-026 已覆盖此机制，非 L4-007 对 DED-025 的独立扩展。
       (b) M4 的泡内面——代际锁定 per-bubble 扩展（L4-007 的有效贡献）：
       新一代在发育窗口期内接收到的对等性信号来自泡内而非社会整体——
       DED-025 的 M4 条件"对等性信号断裂"在碎片化社会中表现为
       "对等性信号仅在泡内存在、在泡间断裂"→新一代内化泡的规范、
       对泡外的规范无内化→代际锁死泡内规范。此为 M4 从社会整体层向
       per-bubble 的有效扩展：原机制（对等性信号断裂→代际内化断裂）的
       因果逻辑不变，但运作单元从单一社会拆分为多个信息泡。

       合取才给出：增殖后的每个信息泡=新群体边界（DED-026 的边界机制）→
       泡间 M3（跨泡 TP 瓦解）由 DED-026 覆盖，泡内 M4（代际锁定）由 DED-025
       的 per-bubble 扩展独立运转→不同泡的紧缩方向和速度由各自的 M1+M2 或
       M3+M4 状态独立决定→结果是一个社会内出现多个不可通约的道德子体系。

    4. 多父逐格判空
       2×2 判据表：道德密度{低，高} × 信息生态{共享，碎片化}，被预测量=道德碎片化程度。
       低密度×共享→碎片化最低（平凡——强信号+共享信息，双方一致预测共识可维持）。
       低密度×碎片化→碎片化有限【需 DED-026 + DED-025 反向合力】：
       DED-026 严格应用（信息泡=新群体边界→TP 在泡间阶跃）→碎片化推力方向；
       DED-025 的 M1（受害叙事）在低密度条件下信号足够强、不需细粒度语境→
       可跨信息泡传播→反碎片化推力方向。两力相反→合力预测净效果为"碎片化有限"
       （跨泡基本共识可维持，但泡间 TP 协调仍弱于泡内）。
       高密度×共享→通胀/紧缩同步变化（DED-025 可单独预测此格的方向性——M1+M2 在场则通胀
       仍可发生；M3+M4 激活则紧缩发生——但变化是社会整体的，非碎片化的）。
       高密度×碎片化→严重碎片化，道德不可译性——【需要 DED-026 + DED-025 合力】：
       DED-026 解释"信息泡边缘=新群体边界→TP 在此处结构性陡降"，
       DED-025 解释"泡内 M4 代际锁定（每泡独立运转 DED-025 的对等性信号断裂→内化断裂→
       代际锁死泡内规范）→正反馈螺旋"。
       单用 DED-026：预测信息泡间 TP 弱，但预测不了"泡内规范自强化→代际锁定→不可逆"——
       它不提供自强化动力学。
       单用 DED-025：预测 M3+M4 导致整体标准松绑，但预测不了"不同泡松绑到不同方向"——
       它的 M3/M4 是社会整体层概念，无"并行多方向"的机制。
       该格是 L4-007 的非平凡贡献格——预测了"多个互不通约的道德空间在同一地理社会内长期共存"
       这一新社会形态。

# === 涌现论证 ===

emergence_demonstration:
  emergence_type: conjunction  # 薄涌现——DED-026(边界)+DED-025(熵增)在数字条件下的并行运作，合取级
  necessity: |
    去掉 DED-026→无法解释为何信息泡的边界会成为"结构性约束 TP 的道德群体边界"——
    碎片化将退化为"人们意见不同"而非"道德执行机制的结构性分裂"。去掉 DED-025→
    无法解释碎片化为何会自强化+代际锁定——碎片化将是一次性的"分裂"事件而非
    持续的"歧化"过程：DED-026 可解释泡间 TP 瓦解（M3 的泡间面）但不提供泡内
    自强化动力学；DED-025 的 M4 在 per-bubble 扩展后提供代际锁死机制——每泡
    新一代仅接收泡内对等性信号→内化泡规范→泡间差异随时间累积加深，
    群体成员更换（新一代）不重置而加固。
  novelty: |
    道德不可译性——不同信息泡之间连"什么算不公平"的共享前提都瓦解了——不在任一条
    父推论的结论中。DED-026 讲"TP 强度在群体边界处阶跃"，但默认"群体边界是可辨识的"
    且"边界两侧的人共享一个道德判断框架（只是执行力度不同）"。DED-025 讲"标准整体收紧
    或松绑"，默认"社会有一个整体的道德标准在变化方向"。两者都不讨论"同一社会中同时
    存在多个互不通约的道德判断框架"——碎片化不是内群体偏好（DED-019+026），不是多层
    公平冲突（DED-022——那仍是同一框架内的冲突），而是框架本身的增殖与隔离。
  multi_parent_cells: |
    2×2 判据表：道德密度{低,高} × 信息生态{共享,碎片化}，被预测量=道德碎片化程度。
    低密度×共享→碎片化最低（平凡——双方一致）。
    低密度×碎片化→碎片化有限【需 DED-026 + DED-025 反向合力】：
    DED-026 严格应用→碎片化推力（信息泡边界→TP 阶跃），
    DED-025 的 M1 低密度可跨泡→反碎片化推力，两力相反→净效果为碎片化有限。
    高密度×共享→整体变化同步（DED-025 可单独预测方向，非碎片化）。
    高密度×碎片化→严重碎片化+道德不可译性——【需 DED-026+DED-025 合力】：
    DED-026 给"信息泡=新群体边界→TP 结构性陡降"，DED-025 给"泡内 M4 代际锁定
    （per-bubble 扩展）→正反馈螺旋"。单条父推论填不出"多个互不通约的道德空间
    长期共存且歧化持续加深"的预测。

falsifiability: |
  本推论在以下条件之一满足时被证伪：
  (a) 发现信息源高度碎片化的群体仍长期维持了跨泡无争议的道德共识（共享的 TP 对
  同一违规行为的惩罚强度跨泡无显著差异）→M1→M2 链被推翻——信息源碎片化不影响
  对等性信号，或对等性信号分化不影响 TP 协调。需控制：道德密度须涵盖高密度议题，
  低密度议题的共识不构成证伪。
  (b) 发现高道德密度议题与低道德密度议题的跨泡碎片化程度无统计显著差异→
  预测(ii)被推翻——道德密度不调节碎片化程度。
  (c) 发现一个地理空间内所有信息泡对某高密度议题的 TP 强度和方向完全一致——
  且该议题在该群体中曾有显著争议历史→碎片化并非不可逆，存在未识别的去碎片化
  路径。需区分"共享威胁的暂时逆转"(iii)与"永久去碎片化"——若逆转持续超过
  一个代际周期（~20年）且新一代的跨泡道德判断一致→预测(iii)(iv)均被削弱。

falsification_trace:
  primary_suspect: |
    预测(iii)的"共享威胁→暂时逆转"机制——共享威胁创造跨泡信息对齐的假设（DED-026
    的共享灾难→边界外推）在数字时代可能被削弱：即使面对同一威胁（如疫情），算法仍可能
    向不同用户推送不同框架（"公共卫生危机"vs"个人自由危机"），使"共享威胁"本身也被
    碎片化。若实证发现共享威胁在数字时代不再能显著提升跨泡 TP 协调→预测(iii)最脆弱。
  secondary_suspect: |
    预测(iv)的 M4 代际锁定——若新一代（Gen Z/Alpha）因其数字原生特性而发展出
    "跨泡信息消费习惯"（主动寻求多元信息源、对不同泡的道德话语有更高元认知），
    代际锁定可能被高估。具体：若测量发现新一代的跨泡道德判断一致性显著高于其父母
    一代→M4 锁定在数字原生代上不成立或方向相反。
  unlikely_suspect: |
    DED-026 的 TP-群体边界绑定机制和 DED-025 的 M3+M4 熵增通道——二者均为
    跨文化稳健的已验证机制。若这些机制被推翻，受影响的远不止本推论。

excluded_outcomes:
  - "碎片化的绝对速度或时间表——本推论只做方向性+结构性预测（往碎片化走+道德不可译性），不做速率定量。"
  - "具体哪个道德领域先碎片化——M1-M4 机制链是通用结构，特定领域的触发时机由外部历史偶然性决定。"
  - "仅政治态度分化而无道德判断歧化——政治极化不同于道德碎片化，后者涉及'什么算违规'的判断框架分化而不仅是'违规后该罚多重'的态度差异。若跨泡差异被证明仅存在于政治态度维度而道德判断维度无显著差异→不构成对碎片化的支持。"
  - "法律强制统一的道德标准——若某道德领域已由法律统一标准且国家暴力强制执行（如谋杀），碎片化在该领域被法律替代道德（L4-006 路径）压制，不提供对本推论的检验。"
  - "单一信息泡内的道德标准变化——本推论预测的是跨泡关系（不可通约性），不是泡内动力学。"

real_world_anchors:
  supporting:
    - anchor: "美国口罩争议（2020-2021）——高道德密度×碎片化信息生态"
      evidence: |
        同一地理空间内两个信息泡对"戴口罩"的道德判断截然相反——左泡：不戴口罩=不顾
        他人健康=道德违规（应被第三方惩罚：公开羞辱/拒绝服务）；右泡：被要求戴口罩=
        侵犯个人自由=道德违规（应被第三方惩罚：抗议/抵制）。两边各自内化了自己泡的版本
        （'不戴口罩我丢脸'vs'戴口罩我丢脸'），跨泡 TP 协调为零——双方不是对同一行为
        的惩罚强度有分歧，而是对"戴口罩是否构成道德问题"的判断框架本身分化。高道德密度
        特征：口罩的道德含义依赖细粒度语境（是否有症状/室内还是室外/有无高危人群在场/
        政府的信任度等），不同泡用各自的语境填充→不可通约。
      confidence: "high（近完美实例，但混杂政治身份重叠——难以完全分离'道德碎片化'与'政治极化'）"

    - anchor: "George Floyd 后的短暂对齐与再碎片化（2020）"
      evidence: |
        共享事件（Floyd 被杀视频）瞬时创造了短期跨泡信息对齐——所有人看到了同一段视频→
        道德判断短暂同步（跨党派对警察暴力的谴责率骤升）→但数月后重新碎片化
        （Defund the Police vs Back the Blue）→且碎片化加速（双方各自加固了
        '对方是非理性的'的认知）。符合预测(iii)的"共享威胁/事件→暂时逆转→恢复且加速"
        的时间模式。
      confidence: "moderate（因果归因需审慎——重新碎片化可能由政党精英 cue-taking 驱动而非纯粹自发的信息泡动力学）"

    - anchor: "中美社交媒体生态对同一国际事件的完全不可通约叙事（持续现象）"
      evidence: |
        对同一事件（如新疆、香港、COVID 起源），中美社交媒体用户的"道德事件集合"几乎
        完全无交集——各自平台推送的'受害叙事'(M1)和'违规行为'完全不同→各自的
        第三方惩罚（制裁/谴责/抵制）针对的是对方完全没听说过的事件→道德不可译性：
        不是'你判得重我判得轻'，而是'你判的事情我根本没在我的信息生态中见过'。
      confidence: "moderate（混杂国家审查+地缘政治利益，非纯信息泡效应）"

  counterexamples:
    - case: "#MeToo 运动（2017-）——数字原生道德通胀成功跨泡"
      analysis: |
        #MeToo 从社交媒体发起（高度碎片化的数字空间），但成功跨越信息泡边界，
        实现了社会整体的道德标准通胀（性骚扰从'灰色地带'变为'明确道德违规'）。
        这对本推论构成压力——它证明即使在高碎片化数字生态中，M1（受害叙事）+M2
        （道德创业者）仍可突破信息泡边界实现通胀。消化：MeToo 的成功条件是
        (a) 低道德密度——'我被非自愿触碰'的信号足够强，不需细粒度语境，
        跨泡仍可被识别；(b) 共享的人类体验（身体侵犯的跨文化普适厌恶）创造了
        一个'准共享信息源'——这与预测(ii)的道德密度梯度一致（低密度议题跨泡
        仍可维持共识）。但这不推翻核心主张——若高道德密度议题（如'什么算文化挪用'）
        也能出现同等规模的跨泡通胀，则需修正碎片化严重性的梯度预测。
      status: "partial_pressure——对碎片化的不可逆性有压力，但与道德密度梯度预测(ii)一致"

  boundary_cases:
    - case: "强共享制度缓冲——公共广播+共同教育的北欧社会"
      analysis: |
        若一个社会维持强共享信息制度（强力公共广播、共同课程标准、有限的算法推荐
        市场渗透），碎片化可被制度性压制。此时本推论的预测不是"碎片化必然发生"，
        而是"若算法推荐替代共享信息源成为主导信息摄入渠道→则碎片化沿所述机制链发生"。
        北欧社会提供了反向测试：强共享制度环境下，碎片化程度应系统性低于算法推荐的
        市场份额。本推论的射程边界：信息生态共享度是前置条件——若共享度不降，
        碎片化预测不激活。
      status: "boundary_case"

measurement_limitations: |
  【当前测量工具的硬限制——2026-07-15 诚实标注】

  信息泡边界:
    在实证上与政治极化(political polarization)极难干净切割。
    现有工具(因子结构一致性/Tucker's congruence)可测量"框架是否分化"，
    但无法排除混杂——政党cue-taking效应、教育分化、城乡分化等替代解释
    与"道德信息泡"假说共享相似的经验签名。当前没有纯化该构念的
    黄金标准实验范式。退而求其次：用多群体验证性因子分析(multi-group CFA)
    测量不同信息生态中MFQ因子结构的测量不变性(measurement invariance)——
    但此工具只能检测"分化已发生"，不能因果归因于"算法推荐vs其他原因"。

  M4代际锁定:
    直接检验需要15-20年代际窗口。现有支持证据均为间接——
    截面代际比较(confounded by period effects)或短期纵向追踪(<5年)。
    最接近的准实验设计：比较同一社会中算法渗透率不同的社区的青年
    道德判断分化程度——但社区选择偏误(算法渗透率与收入/教育/城市化共变)难以消除。

  道德密度标定:
    高/中/低三级分类依赖编码者对"判定违规所需信息条目数"的主观判断。
    跨研究一致性(inter-rater reliability for vignette information-requirement
    coding)尚未建立基准——当前仅为作者标定，需独立的跨文化编码验证。

discriminant_validity: |
  【相对于"信息茧房"（filter bubble, Pariser 2011）的判别】
  信息茧房是现象层描述——"你只看到跟你观点一致的信息"。本推论是机制层——讲的是
  碎片化信息生态对道德执行机制（第三方惩罚协调+内化）的结构性影响。独有可证伪预测：
  (a) 信息茧房理论预测态度极化（已有态度被强化），本推论预测判断框架分化（连"什么算
  违规"的定义也分化了）——若跨泡差异仅表现为态度强度差异（双方对"X是违规"的同意程度
  不同）而非框架差异（双方对"X是否属于道德议题"的判断不同）→本推论被削弱。
  (b) 信息茧房理论不预测道德密度梯度（高密度议题碎片化更严重）——这是本推论从信息条件
  出发的独有预测。

  【相对于"道德部落"（moral tribes, Greene 2013）的判别】
  Greene 的道德部落来自进化心理学——不同群体有不同道德直觉（因进化环境的道德问题不同）。
  本推论的道德部落来自信息生态——同一进化禀赋的人类因信息输入不同而分化。独有可证伪预测：
  若碎片化来自进化禀赋差异→碎片化应稳定（因进化禀赋不随通信技术变）；若碎片化来自
  信息生态→碎片化程度应追踪信息生态的共享度变化。若信息生态重构（如算法推荐被禁止或
  公共广播重新主导）后碎片化程度不变→进化禀赋解释更强，本推论被削弱。

  【防平凡化守卫】
  不要将本推论简化为"社交媒体让人偏激"（常识）或"不同群体道德标准不同"（DED-026+019
  已给）或"没人管了所以道德松了"（DED-025 已给）。非平凡内核在：(a) 数字通信从"桥"
  变为"墙"——同一技术从 DED-026 的边界外推渠道逆转为边界增殖引擎；(b) DED-025 的
  熵增通道从"社会整体"并行化为"每个信息泡独立运转"——导致同一社会内出现多个不同方向、
  不同速度的道德标准变化；(c) 最终产品不是"标准松了"而是"框架不可通约"——跨泡比较
  本身失去共享参照系。

