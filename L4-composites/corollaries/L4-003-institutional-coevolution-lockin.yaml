id: L4-003
type: composite_deduction
layer: L4-composites
deduction_form: composite
status: verified
term: "制度共演锁定 (Institutional Co-evolution Lock-in)"
claim_type: co_evolution

methodological_caveat: |
  co_evolution 类型的经验检验需要纵向追踪制度与公平规范的共变轨迹。完整纵向数据——
  同一社会从 Dunbar 关口前到制度化后锁定维持的完整序列——在人类历史中不可得
  (不存在从小群连续内生成长到大国而无征服/合并/文化传播的干净单例)。本推论的证据
  策略是 converging consilience:不同时间尺度的片段拼接(狩猎采集对照+关口案例+锁定
  迟滞案例)+结构机制论证(规模→制度化必要性→多层互锁→变革成本非线性上升)。各锚点
  独立编码且不由"是否锁定"反推初始条件,但整条因果链的【完整单例纵向验证】在原则上
  不可能。这使 co_evolution 的证据标准实质上是跨案例的机制三角测量(cross-case
  mechanism triangulation)而非 within-case longitudinal tracking。此非逻辑缺陷,
  但应诚实标注:本推论的检验力更多来自四条父推论各自的独立证伪+锁定机制的物理/结构
  论证,而非来自完整纵向数据的直接拟合。

人话摘要: |
  一个社会用什么样的公平规矩分东西，不是某个人拍板定的——是亲缘远近、人多不多、
  资源够不够这三股力量在历史关口上一起决定的。而且一旦定下来，不同层级的公平规矩
  就会互相卡住：改公司的分法会跟家里的规矩打架，改国家的法律会跟行业的规矩顶牛。
  这就是公平制度的"锁定效应"——不是不能改，是改一处就要动全身，所以常常改不动。

statement: |
  【Composite claim】不同公平规范(亲缘平等/按需分配、互惠贡献/按劳分配、程序公平/
  规则面前人人平等)在社会规模跨越 Dunbar 阈值时不仅各自独立演化——它们【共演】并
  【互相锁定】制度路径。一个社会在 Dunbar 关口(DED-016)采纳的公平制度配置，一旦
  在多层级(DED-022)中硬化，就会通过层间冲突反馈形成自强化锁定——即使底层条件
  (亲缘度 DED-018、稀缺度 DED-013)后续发生变化，制度配置也因其多层级互锁而抗拒
  改变。这是四条 L3 推论各自覆盖不了的涌现属性:各自解释"什么在驱动公平规范变化"，
  合起来解释"为什么变不动"。

  【Parent mechanisms】
  DED-018(亲缘-绩效分配切换):亲缘度决定默认分配标准——高亲缘→平等/需要可行且默认，
  低亲缘→贡献标准必然。这是公平制度的"初始条件"引擎——在 Dunbar 关口前，亲缘度
  决定了哪个公平规范是群体的默认基线。
  DED-016(面对面→制度化公平相变):规模越过~150人→面对面公平(档A)不可持续→必须在
  碎片化(档B)或制度化(档C)之间二择。这是公平制度的"关口"引擎——Dunbar 阈值为制度
  化提供了结构必要性，但不决定制度化后选取哪种公平规范配置。
  DED-013(稀缺度-分配标准位移):资源稀缺度改变会系统性位移默认公平分配标准——充裕
  →平等可行，稀缺越过生存线→平等物理塌缩→贡献或需要标准必然。这是公平制度的"选择
  压力"引擎——在 Dunbar 关口制度化时，当时的稀缺度决定了哪些公平规范在物理上可维持。
  DED-022(多层公平冲突):大规模社会中个体同时嵌入多层(家族/职业/国家/宗教)，每层
  有各自独立的公平标准且可能不可通约——层间冲突是大规模社会的结构特征。这是公平制度
  的"锁定"引擎——一旦多层制度化，层间冲突使单层改革受制于其他层的反制，产生锁定。

  【Emergent property】四条父机制的【交互】产生了它们各自产生不了的"共演锁定"现象:
  (1) Dunbar 关口(DED-016)触发制度化二择——这是"锁定"的起点。
  (2) 关口时的初始条件——亲缘度(DED-018)和稀缺度(DED-013)——决定了制度化时
      选取哪种公平规范配置。高亲缘+充裕→制度化平等/需要；低亲缘+稀缺→制度化贡献。
  (3) 制度化后，大规模社会的多层结构(DED-022)使不同层的公平规范互相牵制——
      改一层的规范会触发其他层的冲突反馈，使整体配置抗拒改变。
  (4) 后续稀缺度变化(DED-013)或亲缘度变化(DED-018)不再能自由改变配置——锁定的
      制度配置限制了可选范围。但锁定非绝对:极端稀缺冲击可突破锁定、强制重配。
  任一单父推论只覆盖其中一个环节——合起来才构成完整的"锁定→维持→(有条件)解锁"循环。

  【Prediction】
  (i) 小型社会(<Dunbar)+高亲缘→面对面平等/需要公平(档A)——无制度化→无锁定。
      公平规范可随稀缺度和亲缘度灵活摆动(DED-018+DED-013 自由运作)。
  (ii) Dunbar 关口制度化时:高亲缘+充裕条件→更可能制度化平等/需要型公平(如宗族
      为基础的再分配制度)；低亲缘+稀缺条件→更可能制度化贡献/绩效型公平(如市场
      契约+按劳分配)。关口时的初始条件通过制度化被"冻结"为长期配置——此即锁定的
      起点(需要 DED-016+DED-018+DED-013 三条合力)。
  (iii) 同一社会，制度化后遭遇稀缺度变化→公平规范【不会】像前制度化时期那样自由随
      稀缺度位移。例如:制度化贡献型公平的社会遭遇长期丰裕→不会自动切换到平等分配，
      因为(a)现有的贡献型制度有多层既得利益(DED-022 层间反馈)，(b)切换会触发与
      其他层(市场契约/财产权/职业规范)的冲突。锁定效应使切换滞后于条件变化——这是
      本推论最尖锐的涌现预测:它预测 DED-013 的稀缺度→标准位移在制度化社会中【失效
      或严重迟滞】。
  (iv) 两个社会在 Dunbar 关口时初始条件不同(一个高亲缘+充裕、另一个低亲缘+稀缺)→
      即使后来亲缘度和稀缺度趋同，两个社会的公平制度配置仍保持系统性差异——路径依赖。
      需要 DED-016(关口)+DED-018(初始亲缘)+DED-013(初始稀缺)+DED-022(锁定)四条合力。
  (v) 极端稀缺冲击(长期生存线以下)→可以突破锁定、强制公平制度重配(DED-013 的物理
      可行性塌缩压倒 DED-022 的锁定反馈)。但重配的范围受限于既有制度配置的"残骸"——
      路径依赖即使在解锁后仍留下痕迹。需要 DED-013(物理塌缩)+DED-022(既有配置约束)合力。
  (vi) 逐格判空:"大规模制度化社会(>Dunbar)+多层公平规范不可通约(DED-022 条件满足)
      +长期(>一代人)无任何层间公平冲突+无单一层霸权压制"这一格预测为空。即使存在
      单一层霸权压制，其维持成本随 DED-022 的层间不可通约性递增——压制可持续但不可
      低成本持续(与 DED-022 空格(iii)互补但非同一空格)。

operationalization:
  社会规模(Dunbar 关口):
    definition: "群体成员总数——共享同一套资源分配与冲突解决机制的稳定交互边界内的成员数。"
    measurement: "人口普查/考古聚落规模/民族志记载。关口区间~100-250人(继承 DED-016)。"
    limitations: "Dunbar 数的争议区间(~100-250)使关口的精确位置有模糊带，但关口的【存在性】
      比其精确位置更承重。"

  亲缘度(初始条件):
    definition: "群体成员间的平均遗传相关度 r 或拟制亲缘强度。继承自 DED-018。"
    measurement: "谱牒重建+拟制亲缘制度签名独立测。"
    limitations: "继承 DED-018 的全部测量局限(隐蔽拟制亲缘、混合群体)。"

  稀缺度(初始条件+后续冲击):
    definition: "人均资源相对该群体生存线的比例。继承自 DED-013。"
    measurement: "人均卡路里可得性/人均生产资料/资源存量÷人口——独立于分配标准测得。"
    limitations: "继承 DED-013 的全部测量局限。"

  公平制度配置:
    definition: |
      制度化后的公平规范组合——哪个公平标准(平等/贡献/需要/程序)在哪个社会层(家族/
      经济/政治/宗教)占主导。操作化为:各主要社会层的成文规则或制度化实践所嵌入的公平
      标准类型(按 CONCEPT-fairness(e)的种编码)。
    measurement: |
      对每个主要社会层，由独立编码员将其成文规则或制度化实践的公平标准映射至
      CONCEPT-fairness(e)的种。同一社会可同时有不同层的不同标准——这不矛盾，恰是
      DED-022 多层冲突的结构基础。
    limitations: "混合态常见(同一层内可能有多个标准的制度化痕迹)；配置不是静态快照而是
      制度竞争中的动态均衡。"
    dominant_configuration: |
      当不同社会层的公平标准不同(如家族层为平等/需要、经济层为贡献/绩效),判定该社会
      "整体公平制度配置"的操作化:
      (1) 支配性配置=覆盖社会多数资源分配决策的制度层的公平标准组合。
      (2) 若最高制度层(国家法律/宪法层)为制度化贡献型且子系统层(家族/职业)的平等/需要
          覆盖面<社会总分配决策的50%,则支配性为贡献型。
      (3) 若多层并存且无层级统摄(如宗教法与世俗法平行管辖不同领域),按覆盖>50%分配
          决策的层判定;若无层过半数,则标注为"混合配置"——此时锁定主张的条件化为:
          混合配置的整体变革阻力来自各层各自锁定+层间冲突的综合,变革成本仍≥单层变革。

  锁定强度:
    definition: |
      公平制度配置抗拒变化的结构性程度——操作化为:当底层条件(稀缺度/亲缘度)发生超过
      一个标准差的变化后，制度配置的调整时滞(年)与调整幅度(与"条件预测的应然配置"的
      距离)。
    measurement: |
      纵向追踪:记录底层条件发生显著变化(稀缺度从充裕变稀缺或反之)的时间点 T0，
      测量制度配置对此变化的响应:是否调整?调整了多少?调整滞后了多久?
      高锁定=底层条件已变但制度配置在≥一代人(>20年)内无显著调整。
    limitations: "锁定强度在现实中难以干净测出(制度配置本身演化慢，区分'锁定迟滞'与'常态
      渐变'需要对照——前制度化时期或未制度化对照组的调整速度作为基线)。"

  measurement_decomposition_note: |
    诚实标注:本推论的测量结构存在"可分解性"特征。
    - 公平制度配置的判定可分解为各父推论测量的组合:亲缘度(DED-018)→分配标准方向、
      规模(DED-016)→制度化在场、稀缺度(DED-013)→标准可行集、嵌入层数(DED-022)
      →层间不可通约性。对任一截面 t, fairness_config(t) 本质上是各父推论自变量的函数。
    - 真正不可分解的复合测量是【锁定强度】——它需要同时观测"底层条件变化(Δ稀缺度/
      Δ亲缘度)"和"制度配置响应(Δ配置幅度+Δ时滞)",且方向性不由条件变化单变量推导
      (需制度在场×层间反馈的交互项)。锁定强度测的是"A 和 B 合起来才有的东西"——
      单独测 A(条件变化)或 B(制度配置快照)都测不到锁定。
    - 这不是致命缺陷(有效合成理论可建立在已有测量之上+一个真正的新测量),但应诚实
      区分:trajectory 的主体在测量上是父推论测量的时序拼合,锁定强度才是独有的复合测量。

derivation:
  from_l3:
    deductions: [DED-013, DED-016, DED-018, DED-022]
  from_l1:
    axioms: [AXIOM-001, AXIOM-003]
    theorems:
      - THEOREM-position
      - THEOREM-group-identity-decay
      - THEOREM-cooperation-precondition
  from_l2:
    bridging:
      - BR-L2-002
      - BR-L2-004
      - BR-L2-006
      - BR-L2-009
      - BR-L2-013
      - BR-L2-015
      - BR-L2-017
  steps: |
    1. 父机制摘要
       DED-018:亲缘度 moderates 分配标准——高亲缘→平等/需要默认，低亲缘→贡献必然。
       这是公平规范的"初始条件"引擎。
       DED-016:规模>~150→面对面统一公平不可持续→二择:碎片化或制度化。这是"关口"引擎
       ——它创造了制度化的结构必要性，但不决定制度化后选取哪种公平规范配置。
       DED-013:稀缺度系统性位移公平分配标准——充裕→平等可行，稀缺越过生存线→平等物理
       塌缩→贡献或需要标准必然。这是"选择压力"引擎——在关口时决定哪些公平规范可维持。
       DED-022:大规模社会多层嵌入→不同的公平标准可能不可通约→层间冲突是结构特征。
       这是"锁定"引擎——多层之间的冲突反馈使单层改革受制于其他层的反制。

    2. 交互逻辑——共演锁定的四个阶段
       阶段一【关口前·自由摆动】:社会规模<Dunbar(DED-016 档A)，公平规范随亲缘度
       (DED-018)和稀缺度(DED-013)自由摆动——无制度化→无锁定。高亲缘+充裕→平等盛行，
       低亲缘+稀缺→贡献主导。同一群体可随季节/年景在两个标准间摆动。
       阶段二【关口·初始锁定】:社会规模跨越 Dunbar(DED-016)→制度化为必然(DED-016 的
       档C)。此时的亲缘度(DED-018)和稀缺度(DED-013)决定了哪些公平规范被制度化:
       - 高亲缘+充裕→制度化平等/需要型配置(宗族再分配、共同体福利)；
       - 低亲缘+充裕→制度化贡献型配置(市场契约、按劳分配)+可能的制度化福利(需要型层)；
       - 高亲缘+稀缺→制度化需要型配置(谁最缺谁先得，以亲缘网络为中轴)；
       - 低亲缘+稀缺→制度化贡献型配置(按劳分配)，且平等/需要在物理上不可维持
         (DED-013 物理塌缩)。
       关键:关口时的初始条件被制度化"冻结"——制度一旦建立，就不仅反映当时的条件，
       而且开始塑造未来的条件(制度的反馈效应)。
       阶段三【锁定维持·多层互锁】:制度化后，大规模社会必然产生多层公平标准(DED-022)。
       每层(家族/职业/国家/宗教)的公平制度有各自的既得利益捍卫者(THEOREM-position→
       每层成员对维持该层的公平标准有立场)。当试图改革某一层的公平制度时:
       - 该层的既得利益者抵抗(直接抵抗)；
       - 其他层的公平制度因其标准不可通约→改革在一层被视为"更公平"的变化在另一层
         被视为"不公平"(DED-022 层间冲突)→引发跨层反弹。
       多层互锁使制度配置的变革成本远高于前制度化时期——此即锁定机制的核心。
       阶段四【锁定突破·极端冲击】:极端稀缺冲击(长期生存线以下，DED-013)→物理可行性
       塌缩压倒锁定反馈→制度重配。但重配的范围受限于既有制度配置的"残骸"——之前锁定的
       制度层即使被废弃，其规范遗产(法律框架/社会期待/既得利益结构)仍约束重配方向。

    3. 涌现论证(详见 emergence_demonstration)
       四条父推论各自独立运作时:
       - DED-013 预测稀缺→平等退潮——但它预测的是【无制度中介】的群体自发位移。
         在制度化社会中，DED-013 的预测会因锁定而被阻滞——这是 DED-013 不自知的失效边界。
       - DED-016 预测>Dunbar→制度化——但它不预测制度化后配置的抗拒变化(锁定)。
       - DED-018 预测亲缘度→分配标准——但它不预测制度化后亲缘度变化不再能自由驱动
         制度调整。
       - DED-022 预测多层→冲突——但它不预测这些冲突会形成自强化锁定、抵抗制度变革。
       合起来:四条父机制的交互产生了它们各自预测不了的现象——制度化公平配置的内生锁定。

    4. 多父逐格判空(详见 emergence_demonstration.multi_parent_cells)
       在(关口前亲缘度×关口前稀缺度×是否制度化)的笛卡尔积空间中，预测(iii)锁定迟滞和
       预测(iv)路径依赖两个格需要父推论合力。空格(vi)需要 DED-016+DED-022 合力。

emergence_demonstration:
  necessity: |
    逐一移除每条 L3 父推论:
    - 移除 DED-013:失去稀缺度作为选择压力和锁定突破的机制——无法解释为什么关口时的
      稀缺度影响制度化配置的方向，也无法解释极端稀缺冲击可以突破锁定。共演锁定退化为
      "制度一旦建立就永远不变"的绝对锁定——丧失条件性。
    - 移除 DED-016:失去 Dunbar 关口——没有"制度化发生"的起点，共演锁定的整个故事
      失去时间原点。大规模社会的多层结构(DED-022)可以在无制度化的碎片化状态下存在，
      但碎片化下的公平规范不产生锁定(各亚群各自灵活调整)。制度化是锁定的必要前提。
    - 移除 DED-018:失去亲缘度作为初始条件的引擎——无法解释为什么不同社会在 Dunbar
      关口制度化时选取了不同的公平规范配置(有的偏向平等/需要、有的偏向贡献)。共演锁定
      退化为"所有社会制度化后都一样"——丧失路径依赖(iv)这一核心预测。
    - 移除 DED-022:失去多层互锁机制——没有层间冲突反馈，制度配置的改革阻力仅来自
      单层内的既得利益(常规制度惯性)，而非多层之间的结构性冲突。锁定的独特机制(跨层
      反制→变革成本非线性上升)消失——共演锁定退化为普通制度惯性。
    结论:四条父推论每一条都承载不可替代的机制贡献——无观众砖。

  novelty: |
    逐一对照各父推论的单独结论与 L4 的核心预测:
    DED-013 单独结论:稀缺度→分配标准位移(单机制，无制度化中介，无锁定)。
    DED-016 单独结论:>150→碎片化或制度化(关口，不预测制度化后的锁定，不预测制度
      配置的选择方向)。
    DED-018 单独结论:亲缘度 moderates 分配标准(单机制，无制度化中介，无锁定)。
    DED-022 单独结论:多层嵌入+不可通约→冲突(冲突存在，不预测冲突形成锁定)。

    L4 核心预测对照:
    - 预测(i):小型社会的自由摆动——DED-018+DED-016 合力给出(需要 DED-016 定位
      "关口以下"+ DED-018 解释高亲缘为何→平等/需要)。任一条单独不完整。
    - 预测(ii):关口初始条件冻结——需要 DED-016(关口)+DED-013(稀缺选择压力)+
      DED-018(亲缘选择压力)三条合力。任一条单独不解释"制度化将初始条件冻结"。
    - 预测(iii):锁定迟滞——DED-013 预测稀缺→平等退潮，但 L4 预测这一效应在制度化
      社会中被锁定阻滞。这是 L4 对 DED-013 的【限定】——DED-013 不自知其自身的
      制度化失效边界。需要 DED-013(位移驱动)+DED-022(锁定抵抗)合力。这条预测是
      最尖锐的涌现:它说 DED-013 在制度化条件下会【失效或严重迟滞】——没有任何单父
      推论包含"DED-013 的失效边界"。
    - 预测(iv):路径依赖——需要四条父推论合力。任一条单独只看到"某个条件影响制度"，
      看不到"初始条件差异→制度化后收敛条件下配置仍不同"。
    - 预测(v):极端冲击突破锁定——需要 DED-013(物理塌缩压倒锁定)和 DED-022(既有
      配置残骸约束重配)合力。DED-013 单独说"稀缺→重配"但不考虑既有制度的约束；
      DED-022 单独说"冲突存在"但不考虑物理塌缩压倒冲突。
    - 预测(vi):空格——需要 DED-016(制度化前提)+DED-022(多层冲突机制)合力。任一条
      单独不强制该格为空。
    结论:L4 的六个核心预测中有五个需要父推论合力。满足新颖性。

  multi_parent_cells: |
    参数空间 = 关口前亲缘度(高/低)×关口前稀缺度(充裕/稀缺)×制度化(是/否)。
    后续稀缺度变化为第二个时间维(纵向)。

    关口时刻的笛卡尔积(横截面——制度化时的配置选择):
    ┌──────────────┬──────────────────────┬──────────────────────┐
    │              │ 高亲缘               │ 低亲缘               │
    ├──────────────┼──────────────────────┼──────────────────────┤
    │ 充裕         │ 制度化平等/需要      │ 制度化贡献            │
    │              │ 来源:DED-018+013合力  │ 来源:DED-018主导      │
    │              │ DED-018:高亲缘→平等   │ (+DED-013可容多标)   │
    │              │ DED-013:充裕→平等可行 │ DED-018:低亲缘→贡献   │
    │              │                       │   (方向性由DED-018    │
    │              │                       │   单父强制;DED-013    │
    │              │                       │   充裕→多标准可维持   │
    │              │                       │   提供可行性上下文    │
    │              │                       │   非方向性必要)       │
    ├──────────────┼──────────────────────┼──────────────────────┤
    │ 稀缺         │ 制度化需要            │ 制度化贡献            │
    │              │ 来源:DED-018+013合力  │ 来源:DED-018主导      │
    │              │ DED-018:高亲缘→按需   │ (+DED-013塌缩排除平等)│
    │              │ DED-013:稀缺→平等塌缩 │ DED-018:低亲缘→贡献   │
    │              │ →需要/贡献二择        │   必然(独立断言)      │
    │              │ 高亲缘使按需优先      │ DED-013:稀缺→平等塌缩 │
    │              │                       │   →贡献必然(冗余于    │
    │              │                       │   DED-018方向性断言;  │
    │              │                       │   贡献可行性机制补充) │
    └──────────────┴──────────────────────┴──────────────────────┘

    纵向维——制度化后的锁定效应:
    ┌────────────────────────────┬──────────────────────────────────────┐
    │ 场景                       │ 预测 + 来源                          │
    ├────────────────────────────┼──────────────────────────────────────┤
    │ 制度化后稀缺度从充裕→稀缺  │ 配置向贡献/需要位移，但幅度＜前制度化│
    │                            │ 时期(DED-013 预测)                   │
    │                            │ 来源:【DED-013+DED-022 合力】         │
    │                            │ DED-013:稀缺→位移压力                │
    │                            │ DED-022:多层锁定抵抗位移              │
    │                            │ →锁定迟滞(预测 iii)                  │
    ├────────────────────────────┼──────────────────────────────────────┤
    │ 制度化后稀缺度从稀缺→充裕  │ 配置不自动回归平等(DED-013 可逆方向   │
    │                            │ 被锁定阻滞)                          │
    │                            │ 来源:【DED-013+DED-022 合力】         │
    │                            │ →锁定不对称:稀缺→贡献快,充裕→平等慢   │
    ├────────────────────────────┼──────────────────────────────────────┤
    │ 两个社会:关口时 A=高亲缘+   │ 即使后来亲缘度和稀缺度趋同，A 保持更  │
    │ 充裕,B=低亲缘+稀缺→后来   │ 多平等/需要元素，B 保持更多贡献元素   │
    │ 条件趋同                   │ 来源:【DED-016+018+013+022 合力】     │
    │                            │ →路径依赖(预测 iv)                   │
    ├────────────────────────────┼──────────────────────────────────────┤
    │ 极端稀缺冲击(长期<生存线)  │ 锁定被突破→制度重配。但既有制度残骸   │
    │                            │ 约束重配方向(如:原贡献型社会在饥荒后   │
    │                            │ 制度化需要型福利但保留贡献型市场框架)  │
    │                            │ 来源:【DED-013+DED-022 合力】         │
    │                            │ DED-013:物理塌缩压倒锁定              │
    │                            │ DED-022:既有配置残骸约束重配(预测 v)  │
    ├────────────────────────────┼──────────────────────────────────────┤
    │ 空格:制度化+多层不可通约+   │ 【预测为空】                         │
    │ 长期(>20年)零层间冲突+     │ 来源:【DED-016+DED-022 合力】         │
    │ 无单一层霸权压制           │ DED-016:制度化≠消除冲突              │
    │                            │ DED-022:不可通约→冲突结构必然         │
    │                            │ 任一条单独不强制该格为空               │
    └────────────────────────────┴──────────────────────────────────────┘

    满足 L4 涌现硬门槛:至少 7 个格子标注为需要 ≥2 条父推论合力(含纵向 5 格+关口 2 格)。
    关口时刻的低亲缘两格按严格审查标准(仅问"方向性预测是否可由单父推出")归为 DED-018
    单父主导——DED-013 在此提供可行性约束(稀缺→排斥平等)与可容性上下文(充裕→多标准
    可维持),对方向性预测非必要,但对锁定机制的完整解释(为什么某些标准在物理上被锁定而
    非仅偏好使然)有独立贡献。两者均标注,不自删 DED-013。

falsifiability: |
  本推论可被以下发现证伪:
  (a) 找到一个大规模制度化社会(>Dunbar+制度化公平制度)，其稀缺度经历了超过一个
      标准差的重大变化(如从充裕到稀缺或反之)，且其公平制度配置在≤一代人(≤20年)内
      随之成比例地调整——调整幅度与同亲缘度的小型社会(<Dunbar)在相同稀缺度变化下
      的调整幅度无显著差异。⇒ 证伪预测(iii)锁定迟滞——说明制度化不产生锁定效应。
  (b) 找到两个社会在 Dunbar 关口时初始条件(亲缘度+稀缺度)不同、制度化时选取了不同
      公平制度配置，但后来(1)亲缘度和稀缺度趋同，(2)公平制度配置也趋同——即初始条件
      差异未产生持久路径依赖。⇒ 证伪预测(iv)路径依赖。
  (c) 大规模制度化社会的多层公平冲突频率/烈度与"制度配置变革尝试的频率"无正相关——
      即多层冲突不构成变革的阻力。⇒ 证伪"DED-022 的多层冲突→锁定"这一核心机制链路。

falsification_trace:
  primary_suspect: |
    预测(iii)锁定迟滞——DED-013 在制度化条件下的失效/迟滞是否真实存在。
    两个疑点:(a)现实中很多制度化社会确实在稀缺度变化后调整了分配制度(福利国家的兴衰、
    战时配给制的建立与撤销)，这些调整是否真的比前制度化时期"迟滞"，还是只是看起来慢
    因为制度调整本身的正常时程就长于小群体的自发规范摆动？需要区分"锁定迟滞"与"制度
    调整的正常时程"——若两者的调整速度在统计上不可区分，锁定主张被架空。
    (b)DED-022 的层间冲突是否真的是锁定的【机制】而不只是【伴随现象】——多层冲突
    与锁定可能都是某个第三变量的共同结果(如:精英俘获→既产生制度僵化也产生层间冲突)，
    此时冲突与锁定的关系是相关非因果。此腿最先受检。
  secondary_suspect: |
    Dunbar 关口时"初始条件冻结"主张——现实中大多数社会的制度化是渐进过程而非在单次
    Dunbar 关口瞬间完成。如果制度化是渐进的、跨越数代人的，那么"关口时的初始条件"
    这一概念本身模糊——是取哪个时间点的亲缘度和稀缺度？初始条件的时间窗模糊性使
    预测(ii)和(iv)的检验变得困难。
  unlikely_suspect: |
    DED-016(Dunbar 关口)本身——跨域交叉验证稳健，极少是被证伪的根源。DED-013(稀缺度
    →分配标准位移)的方向性效应有大量灾荒人类学支持，单体稳定性高。失效更可能出在
    锁定机制(多层冲突→变革阻力)这一合成腿上。

excluded_outcomes:
  - outcome: "尚未制度化的社会(前 Dunbar/碎片化档B)"
    description: |
      锁定以制度化为前提。碎片化档B(DED-016)的社会中，各亚群独立调整公平规范——
      不满足锁定的结构条件(多层制度化互锁)，出射程。按 DED-016 的 A/B/C 档事前判。
  - outcome: "由外部征服/殖民强加的公平制度置换"
    description: |
      若制度配置的变化源于外部强制(被征服/殖民/占领后外来制度强加)，而非内生的
      条件变化驱动——则不是锁定在抵抗内生变革，而是外部暴力碾压了内生配置。本条只
      预测【内生条件变化→制度配置调整】的迟滞，不预测外生暴力置换。

real_world_anchors:
  supporting:
    - anchor: "中国传统社会的宗族再分配——高亲缘+制度化→平等/需要配置的锁定"
      evidence: |
        中国传统社会在 Dunbar 关口后的制度化路径中，将宗族(高亲缘)的平等/需要型公平
        制度化——族田/义庄/宗族救济(按需)与族内共产(平等)在宋代后被成文族规制度化。
        即使明清商品经济高度发展(市场交换=贡献标准扩散)，宗族再分配制度未随市场逻辑
        瓦解——制度化的宗族公平规范抵抗了市场化压力(锁定效应)。直到20世纪土地改革
        (外部暴力置换+极端稀缺冲击)，这套配置才被强制重配——突破属于 excluded_outcomes。
      independent_test: |
        宗族规模(>Dunbar)+族规成文(制度化=DED-016 档C)；亲缘度由谱牒独立测(高亲缘)；
        稀缺度由人口/土地比独立测(长期稀缺压力)；制度配置由族规内容编码(平等+需要主导)。
        各指标独立于"是否被市场化瓦解"测得。
      confidence: "moderate(方向性合成锚;宗族存续多因交织)"
      composite_specific: true

    - anchor: "英国 vs 法国福利国家路径分化——低亲缘+制度化贡献型→路径依赖"
      evidence: |
        英国和法国在工业化关口(≈Dunbar 关口后的制度硬化期)均为低亲缘、稀缺度相似的
        社会，但初始制度配置不同:英国沿济贫法传统→制度化"最小国家+市场贡献"配置；
        法国沿大革命传统→制度化"国家主导+平等公民权"配置。两个配置在后续一百五十年
        中面对相似的稀缺度波动(工业危机/大萧条/战后繁荣/石油危机)，调整方向各自沿
        初始路径:英国始终偏向市场贡献+补丁式福利，法国始终偏向国家平等+劳动保护。
        路径差异持续至今——尽管两国的当前稀缺度和亲缘度高度相似。方向性支持预测(iv)。
      independent_test: |
        19世纪初始配置由制度档案/法律文本独立编码(济贫法 vs 大革命立法)；
        当代稀缺度由人均GDP/基尼系数独立测；制度配置由福利国家类型学(Esping-Andersen)
        独立编码。不由"配置差异持续"反推初始条件不同。
      honest_note: "英法分化多因交织(政治文化/阶级结构/战争经历)，单因归因需谨慎。"
      confidence: "moderate"
      composite_specific: true

    - anchor: "战时配给制→战后解除——稀缺度逆转后制度回弹(锁定不对称)"
      evidence: |
        二战期间各参战国(均为制度化社会)在稀缺冲击下建立战时配给制(制度化需要型分配)——
        DED-013 的极端稀缺驱动成立。战后稀缺度从稀缺→充裕逆转，但配给制的解除在各国的
        速度和彻底程度远慢于——且部分配给制的"残骸"(如农业补贴/粮食管理制度/战略储备)
        长期留在制度配置中。稀缺→需要(配给制)的建立快于充裕→平等/市场(解除配给制)的
        回退——锁定不对称:稀缺→制度化需要的锁定比充裕→制度化平等的锁定更快更彻底。
        方向性支持预测(iii)锁定迟滞和(v)残骸效应。
      independent_test: |
        稀缺度=战时物资缺口(独立经济数据)；制度配置=配给立法+执行机构(制度事实)；
        解除速度=从战争结束到配给制完全废除的年数(独立历史编码)。
      honest_note: "配给制解除慢也可归因于官僚惯性/利益集团(非多层互锁)——归因竞争待拆解。"
      confidence: "weak-moderate"
      composite_specific: true

    - anchor: "狩猎采集社会的前制度化灵活摆动——预测(i)的对照锚"
      evidence: |
        !Kung San/Hadza 等小型(<Dunbar)高亲缘狩猎采集社会，公平规范随季节(稀缺度)
        灵活摆动:丰裕季→广泛平等分享，稀缺季→分享收窄至亲属优先(按需要/亲缘)。
        无制度化→无锁定→DED-013+DED-018 自由运作。此锚提供"无锁定基线"——后续
        可对照:同样稀缺度波动，制度化社会的分配标准调整幅度是否显著小于此基线。
      independent_test: |
        规模由民族志人口数据独立测(<Dunbar)；亲缘度由谱系重建独立测；分配标准由
        觅食回报观察独立编码。不由"规范灵活"反推无制度化。
      confidence: "moderate(属 DED-018+DED-013 共锚)"
      composite_specific: false

  counterexamples:
    - case: "大规模制度化社会+多层公平规范+长期零层间冲突——活空格"
      analysis: |
        若存在同时满足以下条件的社会:(1)>Dunbar+制度化公平制度(DED-016 档C)；
        (2)多层社会层(家族/职业/国家/宗教)各有经独立编码确认的、不可通约的公平标准
        (DED-022 条件满足)；(3)长期(>20年/一代人)无任何制度层面的层间公平冲突记录
        (无法院判例冲突/无立法争议/无社会运动)；(4)无单一层霸权持续压制(由独立政体
        指标确认非极权/非一党专政压制)——则命中空格(vi)，证伪本推论。
      status: "counterexample_hunt_open"

    - case: "市场化改革中的快速制度配置切换——挑战锁定迟滞"
      analysis: |
        某些制度化社会在短期内(10-20年)经历了从贡献型向平等型或反之的快速公平制度
        切换(如东欧后社会主义国家从国家平等型向市场贡献型的快速转型、北欧从市场贡献型
        向福利平等型的相对快速扩张)。如果这些切换的速度与同规模前制度化社会(如果存在)
        的规范切换速度无显著差异，则锁定迟滞(预测 iii)被削弱。
        预判:多数快速切换案例可被"外部冲击"(苏联解体=外部暴力置换→excluded_outcomes)
        或"极端稀缺危机"(DED-013 物理塌缩→预测 v)合法消化。需逐案按前件独立编码判定。
      status: "counterexample_hunt_open(需逐案按前件独立检验)"

  boundary_cases:
    - case: "苏联从战时共产主义→NEP→集体化——连续制度重配的锁定残骸"
      analysis: |
        苏联在短期内(1918-1932)经历了:战时共产主义(极端稀缺→制度化需要型配给)→
        NEP(稀缺缓解→部分恢复市场贡献)→集体化(政治强制→制度化国家贡献型)。
        每次重配都在前一配置的"残骸"上建立:NEP 保留了战时工业国有制的制度骨架，
        集体化利用了 NEP 时期建立的农村苏维埃行政架构。制度配置虽然快速更替，但
        每次更替方向受前一配置显著约束——方向性支持预测(v)的残骸效应。
      status: "boundary_case(多因交织:政治强制+极端稀缺+外生意识形态)"
      confidence: "weak"

discriminant_validity: |
  【与 North/Pierson 制度变迁路径依赖理论的判别】
  North(1990)和 Pierson(2000)的路径依赖理论核心:制度一旦建立，因递增报酬/沉没成本/
  适应性预期而自我强化→抗拒变革。本推论独有贡献:(1)指定了【具体的锁定机制】——
  不是笼统的"递增报酬"，而是 DED-022 的多层公平冲突反馈:不同社会层的公平制度因不可
  通约而互相掣肘→变革成本非线性上升；(2)指定了【锁定的起点】——Dunbar 关口的制度
  化时刻(DED-016)，而非任意制度建立的时刻；(3)指定了【初始条件为何塑造路径】——
  关口时的亲缘度(DED-018)和稀缺度(DED-013)决定了哪一种公平规范在制度化后被锁定；
  (4)指定了【锁定的突破条件】——极端稀缺冲击(DED-013 物理塌缩)而非一般性危机。
  North/Pierson 不给 Dunbar 关口、不给亲缘度/稀缺度作为初始条件、不给多层公平冲突
  作为锁定机制、不给物理塌缩作为突破条件。

  【与 Esping-Andersen 福利资本主义三个世界的判别】
  Esping-Andersen(1990)描述了三种福利国家体制(自由主义/保守主义/社会民主主义)——
  这是分类学描述，不解释为什么这三种路径会"锁定"——特别是不解释为什么面临相似的
  全球化/人口老龄化压力下三种体制仍保持差异(即不解释路径依赖的动力)。本推论的独有
  预测:三种体制的持续差异不是因为"文化偏好不同"，而是因为各自的公平制度配置已通过
  DED-022 的多层互锁形成自强化——改革福利层会触发与劳动力市场层(职业规范/工会制度)
  和家庭层(性别规范/代际契约)的冲突。

  【与 DED-016 的判别】
  DED-016 的终点正是本推论的起点。DED-016 说:>150→碎片化或制度化，到此为止。
  本推论问:制度化之后呢？答案是:制度化后的公平配置不是静态的——它在多层冲突
  (DED-022)中演化，而演化不是随机的，是被多层的互相约束"锁定"在起源条件
  (DED-018+DED-013)划定的路径上。这是 DED-016 不覆盖的纵深。

  【防平凡化守卫】
  非平凡不在"制度有惯性"(常识/North)，不在"不同社会有不同公平制度"(常识/Esping-
  Andersen)，而在:(1)锁定的【具体机制】——DED-022 多层公平冲突反馈(不是笼统的递增
  报酬)；(2)预测(iii)锁定迟滞——DED-013 在制度化条件下失效/迟滞，这是 DED-013 自身
  不自知的边界；(3)预测(iv)路径依赖——关口初始条件差异→收敛条件下配置仍不同；
  (4)预测(v)突破条件——极端稀缺的物理塌缩压倒锁定，但残骸约束重配。

