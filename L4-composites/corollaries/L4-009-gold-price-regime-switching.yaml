        该窗口判为灰区/商品体制，与观测（C1 主导）一致；round-4 RF-8 的 (d)
        全史裁决进一步确认该窗口 (d) 不越阈（本币互换爆发段被最短历史长度
        规则挡住），"单指标"定性在 (c)(d) 双列完备裁决下成立。
        本窗口永久保留为判据区分度的压力测试：任何未来的判据讨论必须先过
        双向闸门（round-2 扩展后的最终版，见 boundary_cases 编码表：2011–2013
