        伦敦金池 1968 年 3 月崩溃（官方部门放弃压制金价）——均领先于 1971 年 8 月
        尼克松关闭黄金窗口与其后的金价体制性上涨（35→850 美元，1980 年 1 月峰值）。
        符合预测 (ii)：官方储蓄配置端的迁移比价格体制启动早 3–5 年。
        体制特征：1970 年代金价与实际利率的关系紊乱（高通胀期实际利率深负但名义
        利率剧烈波动），驱动叙事是美元信用与通胀（C2/C3/C4），非机会成本单因素。
