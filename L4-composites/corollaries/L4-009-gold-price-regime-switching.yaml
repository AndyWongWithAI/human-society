        守住；闸门 (i) 已按 round-5 第 18 条反向裁决（利比亚宽口径过线→
        (a)+(c) 双越阈→击穿→降格已执行）。
        新关键承重：细则（扩展窗+n≥8）的事前可辩护性对闸门 (i)/(ii) 是决定性的
        ——若后续审查判该细则事后不可辩护、且 (d) 按可辩护读数在 2011–2013 或
        2018 越阈，则 (a)+(d) 双越阈、对应闸门击穿、按最终版锁定承诺直接降格
        评估，不得第五次修法；细则的辩护要点=实时可执行性（扩展窗无前视）+
        统计退化（小样本上四分位）+ 改判方向对本条主张不利（2022–2024 (d) 被
        同一细则裁掉）。
        敏感性诚实声明：1970 年代数据粗糙（COFER 前身统计口径不一）、2017/2020
        的 (b) 上四分位判定依赖历史分布的具体构造、1979 伊朗冻结的全球储备占比
        估算基于粗略口径（若按更严口径跌破 1%，1979–1980 退灰区、灰区占比升至
        约 22%<12/54>，仍低于 1/3 线但 1968–1980 锚点须改写为 1971–1974 单段）
        ——最不利编码（把 2011–2021 全部 11 年计为灰区 + 1975–1980 共 6 年）
        得 17/54 ≈ 31%，仍低于 1/3 但已逼近。2011 利比亚的口径敏感性【不走】
        灰区占比通道：宽口径过线后果（2011–2013 翻为误判重定价期→闸门 (i)
        击穿→降格评估）已于 round-5 第 18 条裁决执行——降格非因灰区超标而
        因程序缺陷（口径注册时机），两条敏感性通道中闸门 (i) 击穿通道已触发、
        灰区占比通道仍在 1/3 线以下受监控。该普查须在下轮独立审查中逐年复核；
        任何编码修订若使占比越过 1/3，按条款执行降格评估。
      status: "boundary_case——逐年编码表已按最终版判据重编（round-2 RF-5）+ round-3 补全 (c) 候选普查并显式裁决（RF-6）+ round-4 补执行 (d) 全史逐年裁决（RF-8，无新增越阈年）与 (c) 普查补遗（SF-6）+ round-5 第 18 条执行（RF-9，利比亚宽口径过线、闸门 i 击穿、降格已执行），基准 18.5%/最不利 31%，均未触发 1/3 降格线（降格走闸门击穿通道非灰区超标通道），闸门 (ii)(iii)(iv) 仍守住、闸门 (i) 击穿（利比亚宽口径过线→(a)+(c) 双越阈→降格已执行）；降格因程序缺陷（口径注册时机）非机制推翻——五轮逐格判空一致确认涌现成立；(d) 细则的事前可辩护性受下轮复核"

discriminant_validity: |
  【与金价多因素回归模型（华尔街常规做法）判别】
  回归模型假设因素权重连续缓变（时变参数至多平滑漂移）——本条主张权重离散跳变
  （相变），二者可用结构断点检验/模型比较区分（falsifiability a）。独有可证伪预测：
  相关性断点与独立判定的信用越阈事件在时间上重合（±1 年容差内）——连续模型
  不预测断点，更不预测断点与特定触发变量的对齐。分辨率规定（round-2 SF-2）：
  断点定位不得用 24 个月滚动相关（其 ±1 年模糊带恰等于对齐容差，检验无区分力），
  须用月度分辨率方法——Markov 切换模型的平滑体制概率越过 0.5 的月份，或
  Bai-Perron 对月度数据的断点月估计——使断点读数精度显著优于容差；若月度方法
  因数据所限不可得（如 1997 年前无 TIPS），该段的对齐检验诚实降级为"方向一致性"
  弱检验，不计入独有预测的判别力。

  【与"乱世买金"避险常识判别】
  常识只给方向（"不确定就买金"）。本条给出常识给不出的四件套：触发变量
  （法币信用的独立指标，非泛化的"乱"）、时序（储蓄端先动，支付/汇率端滞后）、
  放大机制（存量-流量不对称的门控激活）、可证伪判据（逐格判空+断点检验+
  时序检验+弹性检验）。且常识无法解释为何 2013 年"乱"（缩减恐慌、VIX 跳升）
  金价反而暴跌——本条可以（商品体制内 C1 主导；重校准判据下该窗口无 ≥2 指标
  同向越阈，仅 (a) 单指标灰区，不构成重定价期）。

  【与凯恩斯流动性偏好及其现代变体判别】
  流动性偏好是连续函数（利率与货币需求的平滑权衡）——本条是离散体制+相变边界。
  若现实是连续函数，Markov 切换模型不应显著优于连续时变模型——这是可执行的
  统计判别（falsifiability a），不是修辞差异。

  【与 DED-029 自身判别（防止 L4 只是父推论脚注）】
  DED-029 的射程止于单因素方向；其 2022 年反例被它自己标注为"归 L4 处理"。
  本条不是把四引擎加权平均（那仍是回归模型），而是断言引擎主导权的离散转移+
  弹性与买家构成的同步改变——三者被同一触发变量门控。若审查发现"体制"可被
  四引擎连续加权完全复现（无需离散结构），本条应 rejected。

  【防平凡化守卫】
  非平凡内核三件：(a) 相关性本身是被预测量（体制指示器）而非估计参数——
  这换了整个检验的靶子；(b) 先行指标的结构性位置（储蓄端）是从 DED-028 机制
  推出的，不是数据挖掘出的经验规律；(c) 弹性的体制门控把 DED-030 的静态结构
  变成动态开关。三者任一被审查判定未兑现，应降格。

