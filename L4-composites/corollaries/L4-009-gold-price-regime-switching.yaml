        依赖阈值——归 primary_suspect 持续受检。
      status: "recalibration_pressure_test——旧判据下为活反例（round-1 CE-1），重校准后正确分类为灰区/商品体制；作为判据区分度的永久压力测试保留"

    - case: "2008–2011：金价大涨但实际利率同时暴跌——两体制预测同向，无判别力窗口"
