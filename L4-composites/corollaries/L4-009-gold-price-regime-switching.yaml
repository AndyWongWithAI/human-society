      confidence: "high（长样本、TIPS 直接可测、与 DED-029 已验证锚点共享数据）"

  counterexamples:
    - case: "2011–2015：旧判据字面下的假阳性触发窗口——央行连续净买入且远超'20 年均值+1σ'（基线含 1990 年代大规模净卖出）、2011 年美国评级下调/两次债务上限危机按旧判据 (c) 可编码，两指标同向越阈应判'重定价期'，而现实是 C1 教科书式主导、2013 年金价 −28%"
      analysis: |
