        （1990 年代约 400–500 吨/年净卖出），金价二十年阴跌至 250 美元，
        金价-实际利率负相关恢复稳定——阈值两侧案例对比齐备（phase_transition
        的证据标准）。
      confidence: "moderate–high（时序与结构特征清晰；局限——TIPS 不存在于该期，实际利率用事后通胀近似，相关性读数粗糙）"

