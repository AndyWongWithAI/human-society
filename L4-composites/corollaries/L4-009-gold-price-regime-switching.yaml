id: L4-009
type: composite_deduction
layer: L4-composites
deduction_form: composite
status: rejected
  # 熔断 rejected: 5 轮独立对抗审查未收敛。r5 (适用本推论自身促成的评分卡规则第 18 条)
  # 判定 2011 利比亚窄口径为事后选择→宽口径过线→闸门 (i) 击穿→按锁定承诺降格。
  # 满 5 轮不再修法,按 CLAUDE.md 熔断原则终止。推论自身 rejected,
  # 但 5 轮攻防换来的方法论规则 (第 18 条 / 治理不对称) 由本推论记名。rejected 是正常产出,
  # 不删——体系肯毙自己的推论正是可信度来源。
term: "金价体制切换 (Gold Price Regime Switching)"
claim_type: phase_transition

人话摘要: "金价有两套定价规则来回切换——平时它是'商品'，跟着实际利率走（利率高金价跌）；法币信用出问题时它切回'钱'，实际利率失灵、央行和储户抢存量、价格被无供给缓冲放大。2022-2024 实际利率高金价还创新高，不是四引擎坏了，是体制切到了'钱'模式。切换的先行信号在储蓄端：央行买不买金，比金价本身先说话。"

statement: |
  【Composite claim】
  金价不是单一定价逻辑的产物——它在两个离散体制之间切换。
  (A) 商品体制（法币信用平稳期）——金价由 DED-029 四引擎中的实际利率（C1）单因素
  主导（机会成本逻辑），与实际利率呈稳定强负相关，等量增量需求的价格冲击温和
  （高弹性持有者层吸收边际流量）。
  (B) 货币体制（法币信用重定价期）——BR-L2-024 的信用谱位移被触发后，主导引擎切换为
  法币信用（C3）与不确定性（C4），实际利率相关性衰减甚至翻正；且 DED-030 的
  存量-流量不对称把少量增量需求（央行购金数百吨/年 vs 约 20 万吨存量）放大为
  不成比例的价格移动——货币体制中定价权完全落在低弹性存量持有者的保留价格分布上。
  体制切换不是四因素的线性加权重排——是相变：切换由法币信用越过阈值触发，
  切换后整个定价结构（哪个引擎主导、弹性多大、谁在买）同时改变。
  2022–2024 年"实际利率高企+金价新高"不是 DED-029 的反例，而是本条的正面证据——
  美元储备武器化（2022 年冻结俄央行资产）触发主权部门的法币信用重定价→央行购金潮→
  货币体制启动→实际利率引擎被压制。

  【Epistemic status——诚实声明】
  离散相变主张当前由机制论证（见推导步骤 3 的离散性论证：触发属性的类别翻转+
  边际定价者的层间跳变）与叙述性证据（相关性断裂的多机构独立记录、阈值两侧案例
  对比）支持——裁决性统计检验（Bai-Perron 多断点 / Markov 切换 vs 连续时变参数
  模型比较，falsifiability a）【尚未执行】；且预测 (iii) 承重的 DED-030 虽为
  verified，其 distinctive 预测尚无独立经验检验，证据厚度薄于状态字面。
  检验执行并支持离散性之前，"相变"应读作带预注册降格条款的机制假说，
  而非已确立的统计事实。

  【Parent mechanisms】
  DED-029 给四个方向性引擎（实际利率−/通胀预期+/法币信用−/不确定性+，统一走
  E_network 通道）与单因素阶段的显式边界——它明确声明多因素交互归 L4 管；
  本条正是接住这个钩子：体制=哪个引擎主导的离散状态，切换判据是引擎间的主导权转移。
  DED-028 给切换的时序结构与"谁先动"——法币信用下滑时价值储藏先跑、交易媒介后崩，
  时间差数年；这意味着货币体制的启动信号出现在储蓄配置端
  （央行储备结构/私人金条金币需求），而不是支付端或汇率端——这是可操作的先行指标。
  DED-030 给切换后的放大器——存量-流量极端不对称（S/F≈50–70）→供给无弹性→
  货币体制中定价权在存量持有者手里，增量避险需求没有供给缓冲，价格移动被结构性放大；
  商品体制中该放大器休眠（边际流量被高弹性持有者层吸收，无存量争夺）。
  DED-027【辅助前提——射程扩展，本条自担赌注】给体制切换的长期天花板与挑战者格：
  其自宣射程是商品货币时代自发交换网络（无中央银行，现代法币体系明文不在射程内），
  本条将其六维筛选逻辑外推到现代央行储备配置域，属未经父推论验证的扩展——
  预测 (iv) 不享受 DED-027 verified 状态的背书。扩展命题：六维物理筛选在数字
  交换网络下权重重排（可分性/可验证性/可携带性的数字化重定义），若某数字资产
  加权得分超金且锁定正反馈，赢家通吃意味着金与挑战者不会长期共存——
  货币体制下的金需求可能迁移。

  【Emergent property】
  涌现类型声明：核心主张为交互级（interaction / 厚涌现），诚实标注其证据条件（见
  emergence_demonstration）。交互结构是——法币信用越阈（DED-029 的 C3 通道 +
  DED-028 的储蓄端先动）【修改了】另外两条父机制的运作条件：(a) DED-029 的 C1 引擎
  被压制（金价-实际利率相关性从稳定强负衰减至零或翻正——机会成本逻辑对争夺存量的
  主权买家失效）；(b) DED-030 的放大器从休眠切换为激活（边际卖家沿保留价格分布上移，
  等量增量需求的价格冲击数倍于商品体制）。移除交互项后，结果不仅是强度减弱而是
  类型不同——四因素连续加权模型 vs 离散体制+相变边界，二者可用结构断点检验区分。
  交互逻辑合成：DED-029 的引擎切换（谁主导）× DED-028 的时序（谁先动）×
  DED-030 的放大（动多大）——三者构成核心"体制切换"命题；DED-027 的网络锁定
  （还能锁多久）只承预测 (iv) 的天花板模块，且属射程扩展的辅助前提（见 Parent
  mechanisms），不参与核心承重。任何单条 L3 都只描述其中一个截面：DED-029 明确
  拒绝处理引擎冲突，DED-028 不涉及价格弹性，DED-030 不涉及需求端触发。
  置信度天花板：四条 L3 父推论均为 verified（CAP=3）→ 本条状态天花板 verified/
  verified*（按涌现强度分档）；挑战者模块不计入分档的合力格计数（见
  emergence_demonstration）。

  【Prediction】
  (i) 相关性即体制指示器——金价-实际利率滚动相关系数不是常数：商品体制显著为负，
  货币体制衰减至零或翻正；相关性本身的结构断裂（非连续漂移）是切换的可观测信号。
  (ii) 先行指标在储蓄配置端——央行购金量/美元储备份额变化【领先】于金价的体制性上涨，
  而非同步或滞后（DED-028 时序机制的跨部门应用：无法律缓冲的储蓄端对信用变化最敏感，
  最先重新配置）。时序中介与射程限定（round-2 SF-3）：DED-028 只给"储蓄端先于
  支付/汇率端"的排序，不直接给"购金先于价格"；领先性需要一个显式中介——官方部门
  的配置调整先发生，而【体制级】价格重估要求更广泛市场认知到切换并完成重定价，
  该认知扩散滞后于官方配置行为（央行购金按季披露且部分不披露，市场确认需多季度
  数据累积）。与 (iii) 放大器即时性不冲突：放大器对已到场流量的价格响应近同步，
  (ii) 的领先对象是【体制性上涨的确立】（趋势级、跨多季度），不是价格对单笔
  流量的即时反应——故领先窗口预期收窄为季度级到 1–2 年级，不承诺 DED-028
  原文的"数年"量级。
  (iii) 价格弹性的体制不对称——等量增量需求（以吨计）在货币体制中造成的价格移动
  数倍于商品体制（DED-030 放大器仅在低弹性买家争夺存量时激活；商品体制中边际流量
  被 ETF/回收金等高弹性层吸收）。
  (iv) 挑战者判据【辅助模块，基于 DED-027 的射程扩展，本条自担赌注】——若央行储备
  开始配置某数字资产（六维筛选逻辑向储备域的机构级外推），金的货币体制天花板下移；
  该配置比例是金长期 E_network 侵蚀的先行指标。本预测失败只砍天花板模块，
  不连带核心切换主张。
  (v) 逐格判空——"法币信用重定价期（仅由迁移无关子集 {(c),(d)} 确认，即 (c)(d)
  同时按各自预注册阈值越阈；因判据 (a)(b) 本身即储蓄端迁移，不得用于确认此格，
  见 operationalization
  的变量共享披露）+ 金价仍由实际利率单因素稳定主导 + 无储蓄端配置迁移"该格预测为空；
  若该格非空（信用重定价但金价乖乖跟实际利率走且无人换仓），本条被证伪。

# === 规则 A：操作化定义 ===

operationalization:
  fiat_credit_repricing_period:
    definition: "主权部门与私人部门对主要储备法币未来购买力/可用性（含被冻结/被排除结算的对手方风险）的信心发生显著重估的时期——BR-L2-024 信用连续谱上的一次可识别位移，体制切换的触发变量。"
    measurement: |
      复合判据，全部独立于金价，预注册阈值。以下四个指标中至少两个
      同向越过阈值 → 判定为重定价期：
      (a) 全球央行部门年度净购金量（WGC 季度统计）连续 4 个季度净买入，且年化超过
      过去 20 年均值 +1σ【且创过去 20 年新高】——双重条件针对基线漂移稳健化：
      单纯"均值+1σ"在基线含 1990 年代央行大规模净卖出（CBGA 时代年净卖 400–500 吨、
      20 年均值为负或近零）时，会把新兴市场央行常态化补库存（2011–2013 约 457–629
      吨/年）误判为体制信号；"创 20 年新高"要求购金行为本身处于分布的极端，
      而非仅相对被压低的历史基线偏高。
      (b) 美元在全球官方外汇储备中的占比（IMF COFER）年降幅超过历史分布的上四分位；
      (c) 主要储备货币的【对手方风险被证实类】离散事件——储备资产冻结、兑换限制、
      被排除出结算体系（可编码、可注明日期），【且须满足系统重要性量级限定】：
      受影响主权方的被冻结/被排除储备资产占当年全球官方储备总额 ≥ 1%（预注册
      阈值，一经注册不得再调）。一般性评级下调、债务上限博弈、主权 CDS 利差展宽
      【不计入】判据 (c)：机制理由（事前可辩护，取自推导步骤 2）——本条的触发
      机制是"不依赖任何对手方履约"从溢价属性变为储备的必要属性，只有对手方风险
      被证实类事件改变该属性定位；评级/债务上限事件只改变违约概率的连续读数，
      不改变属性类别，属信用噪声。量级限定的机制理由（同样事前可辩护）：触发
      全球储备管理者重估的是演示效应——"下一个可能是我"——其强度取决于受害方
      与重估者的量级相似度；对被制裁边缘国的小量级冻结/排除（受影响资产占全球
      储备 <<1%）不改变系统级持有者对自身储备属性的评估，属地缘制裁噪声。
      【量级口径定死（round-3 RF-6，口径补全非第三次重校准）】：分子=受影响主权方
      【央行资产负债表内】被冻结/被排除的储备资产（窄口径，与本条
      challenger_reserve_allocation 的既有窄口径一致——主权财富基金与政府其他
      实体的资产不计入分子）；分母=当年全球官方外汇储备总额（IMF COFER 含未分配）。
      口径的机制理由（事前可辩护，同演示效应逻辑）：重估主体是各国储备管理者
      （央行），其重估对象是自身储备资产的属性——主权财富基金被冻结演示的是
      "政府海外资产有风险"，不直接演示"央行储备资产会被冻结"。≥1% 阈值本身不变。
      按此限定与口径统一裁决 1971–2024 全部 (c) 候选事件：1971 美元停兑黄金（系统锚
      货币本身，全体持有者受影响，平凡过线）✓；1979 美国冻结伊朗央行资产（约 120
      亿美元均为央行存款/存金，窄口径下分子不缩，≈当年全球官方储备约 3%）✓；
      1990 美英冻结伊拉克政府资产（伊拉克自有储备数十亿美元级，<1%；同期科威特
      资产冻结为保护性质——替流亡合法政府保管而非对所有者证实对手方风险，
      不属 (c) 类别）✗；2011 联合国/美/欧冻结利比亚资产（round-3 审查猎获的普查
      缺口，本版显式裁决：全球合计通常引述约 1000–1500 亿美元、宽口径 ≈1.0–1.5%
      跨在 1% 线上，但其中利比亚投资局 LIA 约 560–700 亿为主权财富基金、按窄口径
      不入分子；round-4 审查独立核数更新敏感性上限——CBL 行长 2011 年 9 月自报
      总持有约 1150 亿、其中约 900 亿存放海外（被冻结 ≤ 海外持有），故窄口径
      分子的最不利上限 ≈900 亿 / 当年全球官方储备约 10.2 万亿 ≈0.88%，仍低于
      1% 线；LAFB（CBL 全资子行，美国单边冻结约 300 亿为 CBL+LAFB 合并口径）
      入不入窄口径分子存在歧义，入亦不过线）✗【round-5 第 18 条裁决（RF-9）：判据 (c) 的 ≥1% 阈值在 round-2 注册时未同步
      注册分子分母口径，窄口径在 round-3 RF-6 中定死——晚于 round-3 CE-4 反例
      发现——属"口径在反例出现后才定死且方向救推论"。按 rubric 第 18 条"一律
      按不利于推论方向裁、对应闸门不得计为守住"：利比亚按宽口径裁决
      （≈1.0–1.5% ≥ 1%，(c) 越阈成立）→2011 年 (a)+(c) 双越阈→闸门 (i)
      击穿→按最终版锁定承诺触发降格评估。降格已执行（status→verified*，
      闸门 i 击穿标注），降格因操作化注册程序的口径注册时机缺陷（程序缺陷），
      非因核心机制被推翻——五轮独立逐格判空一致确认涌现成立。窄口径事实读数
      不变（最不利上限 0.88%<1%，round-4 独立核数结论不被动摇），变的是
      第 18 条下的程序地位】；2012 伊朗银行被逐出 SWIFT
      （史上首次除名，但无新增冻结量级，<<1%）✗；2018 伊朗央行 Bank Markazi 被
      排除出 SWIFT（同上，<<1%）✗；2019 美国冻结委内瑞拉政府资产+英央行拒还委存金
      （≈0.07%）✗；2021 美国冻结阿富汗央行 DAB 约 70 亿美元（≈0.05%）✗；
      2022 G7 冻结俄央行储备（约 3000 亿美元均为央行储备资产，窄口径下分子不缩，
      ≈2.5%）✓。round-4 普查补遗（SF-6，均清晰线下、不改任何年份编码）：1982
      英格兰银行冻结阿根廷在英资产约 14 亿美元（马岛战争，同年 9 月解除，宽口径
      ≈0.4%、窄口径更低）✗；2003 伊拉克战后资产没收/转移（美境内约 17–19 亿，
      <<1%）✗；2011 欧美冻结叙利亚央行资产（叙储备总额约 180 亿，冻结部分更小，
      <<1%）✗。穷尽性声明改为可守卫表述（连续四轮补猎的止损）：候选清单
      【已穷尽已知窄口径 ≥0.3% 量级的候选事件】，线下小量级事件不逐一列名、
      后续补报一律显式裁决入表。同口径复核结论：1979 与 2022 的既有 ✓ 裁决在
      窄口径下均不改判（两案被冻结资产本就全部或几乎全部在央行资产负债表内）。
      (d) 替代结算/替代储备安排的份额上升（预注册阈值，round-3 RF-7 补齐——此前
      为四指标中唯一无阈值者）：以下任一序列的年增幅超过其历史分布上四分位
      → 判 (d) 越阈：①主要非美元替代结算系统（CIPS 等）的跨境结算份额；
      ②IMF COFER "非传统储备货币"（非美元/欧元/日元/英镑）占比；③双边本币互换
      协议存量（对齐 (b) 的"上四分位"形式，方向为更难满足的收紧而非放松裸描述）。
      对历史样本（布雷顿森林期）用等价物序列：官方部门黄金兑换请求量、伦敦金池
      干预量的年增幅超其历史分布上四分位。
      【(d) 序列细则注册（round-4 RF-8，漏注册细则补全，方向更严）】：①分布窗口
      定死为【扩展窗】——判定第 t 年时，分布=该序列自可用起点至 t−1 年的全部
      年度增幅（实时可执行、无前视）；不用全史分布——全史分布含未来数据、且会把
      young-series 自身的爆发年计入分布，属事后前视，事前不可辩护。②最短历史
      长度规则——序列须累积 ≥8 个年度增幅观测方可判越阈，n<8 一律不判（机制
      理由：上四分位在 n<8 时由 1–2 个观测决定，统计退化；8 为一次注册，不得
      再调），对布雷顿森林期等价物序列同样适用。③三序列可用起点注册：CIPS
      2015 年上线（首个完整年 2016，年增幅观测自 2017，足龄自 2025）；COFER
      非传统储备货币占比可构造自 2012（年增幅自 2013，足龄自 2021；2016Q4
      人民币单列的重分类跳升年份如实标注、不剔除）；人行双边本币互换存量自
      2009（年增幅自 2010，足龄自 2018）。④多重比较披露（RF-8e）——任一-of-3
      并联在三序列均足龄后使 (d) 年机械触发率上限约 1−0.75³≈58%，如实披露；
      缓解为结构性而非修辞性：(d) 单独越阈只构成灰区候选、重定价期判定仍需
      ≥2 指标同向，且证伪格 (v) 要求 (d) 与稀有事件 (c) 同年共现；"改为 ≥2
      序列同向"的更严形式已考虑未采（三序列足龄期错开，2025 年前 2-of-3 不可
      判、会使 (d) 实质失能），按锁定承诺未来任何 (d) 误触发直接记真反例。
      【(d) 1971–2024 全史逐年裁决（RF-8 执行）】：1968–1971——等价物序列
      （官方兑换请求量自 1958 主要货币恢复经常项目可兑换起可构造，至 1968
      足龄）兑换请求潮/金池崩溃 → (d) 越阈 ✓；1972–2009——三序列不存在、
      等价物序列随金窗关闭终止 → 不判；2010–2017——三序列均未足龄（互换
      2011 年仅 1 个增幅观测、2013 年 3 个；CIPS 2015–2016 上线初期；COFER
      非传统 2013 起）→ 按最短历史长度规则一律不判越阈——本币互换爆发段
      （2011–2013，存量约 0.8→2.5 万亿元，全序列最陡段）与 CIPS 上线初期
      （2015–2016）均被该规则挡住，(a)+(d) 双越阈角不成立，闸门 (i) 不受
      威胁；2018–2020——仅③足龄：互换存量已入平台期（约 3–4 万亿），年增幅
      远低于扩展窗上四分位（分布含 2011–2013 爆发年）→ ✗，2018 CIPS 高增长
      年因①未足龄不判——闸门 (ii) 不受威胁；2021——②③足龄，均 ✗；
      2022–2024——②③足龄（①足龄自 2025）：③存量平台期（约 4.0–4.3 万亿，
      年增幅个位数）✗；②年增幅平缓（约 0.3–0.8pp/年），未稳定超出扩展窗上
      四分位 ✗；①即便忽略足龄规则，年增幅 21–43% 亦低于其扩展窗上四分位
      （约 60–75%，分布由上线初期高增长年占据）→ 【(d) 在 2022–2024 改判
      不越阈】。
      【RF-7 复核结论的如实改判】：round-3 曾记"(d) 在 2022–2024 越阈仍成立"
      ——该复核未定义分布窗口与足龄规则，细则补全后被推翻，如实改判。改判
      方向对本条主张【不利】（2022–2024 少一个越阈指标、证伪格 (v) 的现代
      实现窗口归零），与利比亚窄口径同理属"对己不利的收紧"，事前可辩护；
      2022–2024 重定价期判定不受影响（(a)+(c) 双指标足额）。本次为漏注册
      细则补全+按更严细则的改判，无任何判据放松、无假阳性消化，不消耗最终版
      锁定承诺、不构成第三次重校准。
      【重校准披露与锁定承诺（最终版）】：本操作化已经历【两次】retrofit，诚实
      记账如下。第一次（round-1 后）：判据 (a) 加"创 20 年新高"条件、判据 (c)
      限缩为对手方风险被证实类，起因是旧判据在 2011–2013 假阳性触发。第二次
      （round-2 后，即本版）：判据 (c) 补系统重要性量级限定（≥1% 全球官方储备），
      起因是 round-2 审查发现限缩后的 (c) 按字面仍在 2012（伊朗 SWIFT 除名）与
      2018（Bank Markazi 被排除）产出假阳性、且编码表对 1979 伊朗冻结的计入与
      对 2012/2018/2019 的不编码互相矛盾——round-1 的锁定承诺（"此后判据不得
      再调"）由本次消耗，信用已耗。两次重校准均发生在已知相关窗口结局之后，
      retrofit 风险如实标注：判据区分力的真正检验在未来窗口。锁定承诺更替为
      最终版：【第三次重校准不可用】——此后再有误触发，按锁定承诺直接记为对
      本条操作化的真反例并触发降格评估，不得再修判据。
      【round-3 口径补全与阈值补齐（非第三次重校准，如实声明）】：round-3 审查
      发现两处操作化执行缺口——(c) 候选普查漏裁 2011 利比亚（量级跨在 1% 线上）、
      (d) 无预注册阈值。本版处理：①给 (c) 的 ≥1% 阈值定死分子分母口径（央行窄
      口径分子/COFER 分母），②给 (d) 补上四分位阈值。二者均为【对已注册判据的
      口径补全/漏注册阈值补齐】，方向皆为"更严或等严"，不放松任何已过线事件的
      判定，故不消耗最终版锁定承诺、不构成第三次重校准（第三次重校准专指"因误
      触发而放松/改写判据字面"）。诚实边界：若 (c) 的窄口径被后续审查判为事前
      不可辩护、或 2011 利比亚按可辩护口径实际过线，则退回过线角、按锁定承诺
      执行降格评估——口径补全的存活押在窄口径的事前可辩护性上。
      【体制退出规则（round-3 SF-5，预注册）】：以上判据只定义重定价期的进入；
      切回商品体制的退出条件预注册如下——满足任一即判体制退出：①触发性 (c) 事件
      被正式解除/相关储备资产解冻或恢复结算准入，【且】其后连续 2 年无任何指标
      （a/b/c/d）越阈；②(c) 事件仍存续但其后连续 3 年 (a) 与 (d) 均回落至阈值
      以下（信用重定价已被市场消化、储蓄端配置迁移停止）。历史退出点回验：
      1981 年伊朗资产释放（1981.1）+沃尔克紧缩重建美元信用→央行 1980 年代转净卖、
      各指标回落，按规则①判 1981 起切回商品体制，与编码表 1981–2009 商品体制
      一致 ✓；2011 年 12 月利比亚 CBL 解冻——因 2011 未判重定价期（灰区），
      无退出问题，规则不适用。诚实标注：2022– 俄储备冻结无限期存续，按规则②
      需 (a)(d) 连续 3 年双回落方可切回，制裁存续期内若 (a)(d) 维持越阈则货币
      体制持续，"切回商品体制"预测在此窗口暂不可检验——这是本条对当前窗口
      检验力受限的如实声明，非规则缺失。
    limitations: |
      指标 (a) 央行购金量在本推论中身兼两职——体制判别指标（用水平与持续性）与
      先行指标（预测 (ii)，用时序领先关系）。二者不循环：判别只用购金量是否越过
      阈值水平，不用它与金价的先后关系；预测 (ii) 检验的是时序领先，分类不强制
      时序。为进一步隔离，判别要求至少两个指标同向，购金量单独越阈不构成重定价期
      判定。
      【变量共享披露（RF-3）】：指标 (a)(b) 本身就是储蓄端配置迁移的测量——
      (a) 是央行购金、(b) 是储备结构变化，与预测 (ii) 的先行指标及证伪格 (v) 的
      "无储蓄端迁移"共享变量。若重定价期的确认用了 (a) 或 (b)，则"无储蓄端迁移"
      被构造性排除，格 (v) 逻辑上不可能非空。故显式规定：falsifiability (b) 与
      预测 (v) 的检验只在迁移无关确认子集 {(c),(d)}（即 (c)(d) 同时越阈）上执行。
      剩余检验力评估：该收窄使空格检验依赖 (c)(d) 双越阈的稀有窗口——(d) 全史
      裁决（round-4 RF-8）后，历史样本中仅 1968–1971 等价物段满足（2022– 段的
      (d) 按补全细则改判不越阈，不再计入），检验频率更低但非同义反复：
      (c)(d) 与储蓄端正交（结算/冻结事件与购金行为可独立编码），一旦此类窗口出现
      而 C1 仍稳定主导且储蓄端无迁移，本条即被证伪；未来每次对手方风险事件都是
      一次活检验（②③序列已足龄、①自 2025 足龄）。灰区风险（历史样本无法清晰
      二分体制）是本推论的 primary_suspect。

  regime_indicator:
    definition: "复合输出变量——金价-实际利率滚动相关系数的结构状态。商品体制=显著负相关；货币体制=相关性不显著或为正。"
    measurement: |
      24 个月滚动窗口内金价月度变动（LBMA 定盘价）与 TIPS 10 年实际收益率月度变动的
      相关系数。商品体制判定为 corr ≤ −0.3 且统计显著；货币体制判定为 corr ≥ −0.1。
      离散 vs 连续之争用结构断点/体制切换检验裁决：Bai-Perron 多断点检验或
      Markov 体制切换模型 vs 连续时变参数模型的拟合优度比较（信息准则）。
      若 Markov 切换模型显著优于连续时变权重模型 → 支持离散相变；反之核心增量失守。
    limitations: "滚动窗口长度影响断点定位精度（24 个月窗口使断点读数有 ±1 年的模糊带）；TIPS 数据始于 1997 年，此前样本需用名义利率−调查通胀预期近似，测量误差更大。"

  regime_price_elasticity:
    definition: "单位增量需求的价格冲击——每 100 吨年度净增量需求对应的金价年度百分比变动，分体制估计。"
    measurement: "在独立判定的商品体制窗口与货币体制窗口内，分别回归年度净增量需求（央行净购金+ETF净流入+金条金币净需求，WGC 数据，以吨计）对金价年度变动率；比较两组弹性系数。预测 (iii) 要求货币体制弹性显著大于商品体制弹性（方向性+倍数级差异）。"
    limitations: "需求量与价格互为内生（价格上涨吸引流入）——弹性估计需以外生事件为工具（如储备冻结公告、评级事件），或至少诚实标注为条件相关而非因果弹性。样本中干净的货币体制窗口少（1971–1980、2022– 两段），统计功效有限。"

  dominant_engine:
    definition: "特定窗口内对金价变动解释力最大的单一引擎（DED-029 四引擎之一）。"
    measurement: "窗口内金价月度变动对四引擎代理变量（TIPS 实际利率、盈亏平衡通胀率、主权 CDS/储备指标、VIX/EPU）的方差分解或占优回归——各代理沿用 DED-029 的独立测量轴，不由金价反推。"
    limitations: "四引擎代理在危机期间同向共变（多重共线性）使方差归属模糊——主导权判定在共变窗口内只能给出'C1 不再主导'的否定性结论，未必能唯一指认 C3 vs C4 谁主导。本推论的核心主张只需要否定性结论（C1 主导权丧失）成立。"

  challenger_reserve_allocation:
    definition: "预测 (iv) 的自变量——各国官方储备中配置于非主权数字资产的比例。"
    measurement: "央行/主权基金公告与 IMF 储备构成统计中的数字资产头寸；当前基线约为零（个别小国试点），任何持续、多国、超过储备 0.5% 的配置构成'机构级验证'的操作化起点。"
    limitations: "官方储备披露有滞后与隐匿动机；主权基金（非央行）的配置是否算'储备'需事前定义——本推论采窄口径（央行资产负债表内），避免用宽口径事后凑数。"

# === 推导 ===

derivation:
  from_l3:
    deductions: [DED-027, DED-028, DED-029, DED-030]
  from_l1:
    axioms: [AXIOM-001, AXIOM-002, AXIOM-003]
    theorems: [THEOREM-value-attribution]
  from_l2:
    bridging: [BR-L2-021, BR-L2-022, BR-L2-023, BR-L2-024]
  from_l4: []
  steps: |
    1. 父机制摘要
       DED-029：金价波动几乎全由 E_network 驱动（V≈E×S，U≈0，S 稳定），E_network 随
       四个独立测度的引擎伸缩——实际利率(−)/通胀预期(+)/法币信用(−)/不确定性(+)；
       每个 C_i 只做单因素方向预测，多因素交互显式让渡给 L4。
       DED-028：SOV 与 MOE 功能解耦有结构性时序——SOV 无法律缓冲、对信用变化最敏感，
       信用下滑时储蓄端先跑、支付端后崩，时间差数年。
       DED-030：S/F≈50–70 → 供给曲线近乎垂直 → 定价权在存量持有者的保留价格分布；
       持有者分层（首饰≈央行 < 金条金币 < ETF/投机者）→ 弹性排序决定谁是边际卖家。
       DED-027：一般等价物地位由 E_network 正反馈锁定，但赢家通吃+技术冲击可换主——
       六维筛选的权重随网络特征重排，得分被超越则媒介地位迁移。

    2. 交互逻辑——四个截面如何咬合成一个相变
       触发（DED-029 C3 + BR-L2-024）：法币信用沿连续谱下滑越过阈值——对主权部门，
       阈值事件是"储备资产的对手方风险被证实"（冻结/排除结算），这使"不依赖任何
       对手方履约"从溢价属性变为储备的必要属性。
       时序（DED-028 跨部门应用）：最先响应的必然是储蓄配置端——央行储备与私人
       金条需求是主权/私人部门的 SOV 仓位，无任何法律缓冲、调整成本最低；
       支付端（货币替代）与汇率端有法律强制与网络惯性缓冲，滞后数年。
       故体制切换的先行指标结构性地位于储蓄端——这不是经验巧合，是 DED-028
       机制差异（SOV 无缓冲、MOE 有缓冲）的直接推论。
       主导权转移（DED-029 引擎间）：新增买家（央行等主权 SOV 配置者）的动机是
       信用重定价与对手方风险（C3/C4 通道），对机会成本（C1 通道）不敏感——
       买入决策不因实际利率上升而逆转。当此类买家成为边际定价者，C1 的相关性
       结构性衰减——这是"相关性即体制指示器"的机制来源。
       放大（DED-030 体制条件化）：商品体制中边际流量的对手方是高弹性持有者
       （ETF/投机者/回收金），增量需求被现价附近的卖盘吸收→冲击温和；
       货币体制中买家是买入即锁仓的最低弹性层（央行），且既有低弹性持有者
       （首饰/央行）在信用重定价期更不肯卖→边际卖家沿保留价格分布大幅上移→
       等量增量需求造成数倍价格移动。放大器的激活条件是需求端触发（谁在买），
       这正是 DED-030 自己不处理的（其 primary_suspect 之外的射程边界）。
       相对流量中介——显式射程边界（round-2 SF-4，承 round-1 CE-2）：放大器
       激活还有一个隐含中介——低弹性部门的净流量须实际成为边际定价流量，
       操作化为相对流量条件：低弹性净流入（央行+金条金币）显著超过高弹性
       净流出（ETF+回收金），否则高弹性层仍是边际定价者、体制不切。
       2022–2024 满足（购金约 1000 吨/年 vs ETF 净流出约 110 吨），但判据
       (a)–(d) 本身不保证该条件——若未来出现"真对手方事件+购金越阈但 ETF
       大流出压制"的窗口而金价仍随 C1 走，按此边界归为放大器未激活的射程外
       情形，不计入招牌格失败，但须如实记录并检讨该中介是否应升格入判据。
       天花板（DED-027 的射程扩展应用——辅助前提，本条自担赌注）：DED-027 自宣
       适用区间为商品货币时代自发交换网络（无中央银行/法定货币/固定兑换率的制度
       强制，现代法币体系明文不在射程内）。本条将其筛选逻辑外推到现代央行储备
       配置域，论据是该域的结构相似性——储备资产选择无法定强制（各央行自主配置），
       构成自发选择网络；但这与父推论字面射程冲突，属未经验证的机制外推，
       预测 (iv) 不享受 DED-027 verified 状态的背书，其成败由本条自担
       （falsifiability (e)），失败只砍天花板模块不连带核心。
       扩展命题本身：金的货币体制需求依赖其在"非主权价值储藏候选池"中的六维加权
       得分领先+E_network 锁定；数字交换网络重排权重（可分性/可验证性/可携带性
       数字化重定义）后，若某数字资产得分超金且获机构级采用，赢家通吃禁止长期
       共存→下一次信用重定价期的增量需求可能流向挑战者而非金。

    3. 涌现论证——为什么是相变而非加权重排
       离散性的机制来源（为何预测断点而非渐变）——三个环节各自离散，且被同一
       触发变量串联：(i) 触发本身是类别翻转不是连续读数——"不依赖对手方履约"
       从溢价属性变为储备的必要属性（步骤 2），属性类别只有两态，没有中间态；
       (ii) 边际定价者的层间跳变——DED-030 的持有者弹性分层是离散的层
       （首饰≈央行 < 金条金币 < ETF/投机者），体制切换时边际卖家/买家从高弹性
       层跳到最低弹性层，是换人不是同一群人连续调整参数；(iii) 主导引擎的
       买家构成变化——当对 C1 不敏感的主权买家成为边际定价者，C1 相关性的
       衰减随边际买家身份切换而非随权重连续漂移。诚实标注：此为机制论证而非
       统计证明——若 Bai-Perron/Markov 检验（尚未执行，见 statement 的
       epistemic status）判连续模型不劣，按 falsifiability (a) 降格，机制论证
       不得用作对抗检验结果的护身符。
       单用 DED-029：重定价期实际利率与法币信用两引擎反向拉锯，净方向不可判——
       DED-029 自己声明该情形出射程。单用 DED-028：给时序不给价格——它预测储蓄
       先跑，但"跑多远、价格动多大"不在其射程。单用 DED-030：放大器常开无门控——
       它不知道需求端何时涌入、由谁触发。单用 DED-027：讲媒介地位的锁定与换主，
       不讲价格动力学。
       合成后出现三个任何单父都没有的结构特征：(a) 定价结构的整体同变——主导引擎、
       弹性、买家构成三者被同一个触发变量（信用越阈）同时改变，而非各自独立漂移；
       (b) 相关性断裂作为可观测的相变签名——连续加权模型预测相关系数缓变，
       本条预测断点；(c) 储蓄端先行的跨市场时序——分类触发变量（信用）、
       先行指标（储蓄配置）、价格响应（金价）三者的固定时序链。

    4. 多父逐格判空
       2×2 判据表：法币信用{平稳, 重定价} × 实际利率{低, 高}，
       被预测量=金价行为+相关性结构+弹性。
       平稳×高利率 → 金价承压、相关性强负、弹性低（DED-029 C1 单独强制——商品体制平凡格）。
       平稳×低利率 → 金价受支撑、相关性强负、弹性低（DED-029 C1 单独强制）。
       重定价×低利率 → 金价上涨方向可由 DED-029 C3 单独给出，但幅度的不成比例
       【需 DED-029 + DED-030 合力】——方向来自引擎，倍数来自放大器；
       且先行结构【需 DED-028 + DED-029 合力】——储蓄端指标领先价格。
       重定价×高利率 → 招牌格：金价仍可创新高+相关性衰减/翻正+弹性放大
       【需 DED-029 + DED-028 + DED-030 三父合力】——DED-029 单独在此格无净预测
       （两引擎冲突出射程）；DED-028 给"谁先动"锁定切换已发生的独立证据；
       DED-030 给"为何少量央行购金能压倒利率引擎"（存量争夺+无供给缓冲）。
       措辞校准（round-4 SF-7）：格内价格/相关性/弹性的动力学内核由 029+030
       两父机制合力强制，028 承担的是独立切换确认腿（不依赖价格即可判定已入格）
       ——认识论承重而非动力学承重；最严读数下该格仍为 ≥2 父合力格。
       该格是 2022–2024 的现实格，也是本条区别于一切连续加权模型的非平凡贡献格。
       挑战者维度（第三轴，DED-027* + DED-029，带射程外星号）：重定价期 × 数字资产
       获机构级配置 → 金的体制性上涨弱于历史同类期——单用 DED-027 无价格预测，
       单用 DED-029 无媒介竞争维度；但 DED-027 在此为射程扩展应用（见步骤 2 天花板），
       该格不计入涌现分档的合格合力格数。
       空格声明（预测 v）："重定价（仅由 {(c),(d)} 子集确认）+ C1 仍稳定主导 +
       储蓄端无迁移"预测为空——该格被填上即证伪本条。

# === 涌现论证 ===

emergence_demonstration:
  emergence_type: interaction  # 厚涌现声称——信用越阈修改 C1 引擎运作条件并门控 DED-030 放大器，结果类型改变（连续加权→离散体制）；该声称的存活压在结构断点检验上，若断点检验不支持离散性则降格为 conjunction
  necessity: |
    去掉 DED-029 → 失去引擎清单与"多因素交互归 L4"的接口——"主导权转移"无从定义，
    体制退化为无机制的经验分期。去掉 DED-028 → 失去切换的时序结构——先行指标为何
    在储蓄端（而非支付/汇率端）无法推出，预测 (ii) 塌掉，体制判别失去独立于价格的
    早期信号。去掉 DED-030 → 失去放大机制——无法解释年增量占存量 0.5% 的央行购金
    为何能压倒实际利率引擎造成体制级价格移动，预测 (iii) 塌掉，"相变"退化为
    "相关性碰巧变了"。去掉 DED-027 → 只有预测 (iv) 与证伪条款 (e) 塌，核心切换
    主张、招牌格、相关性断裂、弹性不对称、储蓄端先行均不受影响——诚实承认：
    DED-027 对核心结论的机制贡献接近零，它只承预测 (iv) 的天花板一面，且该面是
    向央行储备域的射程扩展（父推论自宣"无中央银行……现代法币体系不在射程内"）。
    故核心承重为 DED-029/028/030 三父各承一面；DED-027 为射程扩展的辅助前提，
    不计入"无观众砖"声明的承重清单。
  novelty: |
    以下命题不在任何单条父推论中，也不是父推论结论的 AND/OR 拼接：
    (a) 金价-实际利率相关性不是常数而是体制指示器，其断裂是可观测的相变签名——
    DED-029 只给恒定方向（C1 恒为负），不给相关性的体制依赖；
    (b) 体制切换的先行指标结构性地位于储蓄配置端——DED-028 讲同一法币内 SOV/MOE
    的时序，不讲金价体制的跨市场先行指标（此为 DED-028 机制逻辑的跨部门扩展，
    诚实标注：扩展的因果逻辑不变——无法律缓冲端最先动——但运作对象从"一国储户"
    扩展为"主权储备配置者"）；
    (c) 价格弹性的体制条件性——DED-030 的放大器是无门控的结构事实，本条给出其
    表达的门控条件（低弹性买家入场争夺存量时激活、高弹性层吸收边际流量时休眠）；
    (d) "2022–2024 实际利率高+金价新高"作为正面证据而非反例的系统性重解释——
    DED-029 只能将其标注为边界反例（其 counterexamples 正是如此处理），
    本条将其转正为招牌格预测。
  multi_parent_cells: |
    2×2 表（法币信用{平稳,重定价} × 实际利率{低,高}）中至少两个格需要 ≥2 父合力：
    格[重定价×高利率]（招牌格）需 DED-029+DED-028+DED-030 三父合力——
    DED-029 单独在此格显式无净预测（引擎冲突出其射程），DED-028 单独无价格预测，
    DED-030 单独无触发判据；三者合力才给出"金价新高+相关性断裂+弹性放大+
    储蓄端先动"的完整格预测。措辞校准（round-4 SF-7，与审查逐格判空的最严
    读数一致）：严格说该格为"029+030 两父机制合力+028 独立确认腿（认识论
    承重）"——028 对格内价格机制非必要、对格的可判定性必要；即便按最严读数
    只计 029+030，该格仍是 ≥2 父合力格，分档条件不受影响。
    格[重定价×低利率]的幅度与时序需 DED-029+DED-030（不成比例幅度）与
    DED-028+DED-029（先行指标）两组合力。
    挑战者格[重定价×数字资产机构级配置]名义上需 DED-027+DED-029，但 DED-027
    在此为射程扩展应用（带星号），该格【不计入】verified* 分档条件 (b) 的合格
    合力格数。剔除后仍有 ≥2 个合格合力格（招牌格三父合力 + [重定价×低利率]的
    幅度/时序两组两父合力），满足分档条件 (b)；条件 (c)：核心涌现属性
    （相变结构）由 DED-029/028/030 三条父推论自身机制合成，无外部理论承重前提。

falsifiability: |
  本推论在以下条件之一满足时被证伪或降格：
  (a) 结构断点检验失败——在独立判定的信用重定价期前后，金价-实际利率滚动相关性
  无统计显著断点，连续时变权重模型的拟合不劣于体制切换模型 → "离散相变"主张降格为
  "连续权重位移"，本条核心增量失守（承认降格即本条 rejected 或改写回 DED-029 的
  多因素脚注）。
  (b) 逐格判空格被填上——出现"重定价期【仅由迁移无关子集 {(c),(d)} 确认，即 (c)(d)
  同时越阈，且二者均按预注册阈值判定——(c) ≥1% 央行窄口径、(d) 年增幅越扩展窗
  上四分位（round-4 RF-8 细则补全后：分布窗口=扩展窗、最短历史长度 n≥8、序列
  起点均已注册，确认路径不再含自由裁量端口）；判据 (a)(b) 本身即
  储蓄端迁移，用于确认会构造性排除'无迁移'，故不得
  用于本格】+ 金价仍由实际利率稳定主导（滚动相关显著负且弹性无变化）+ 央行购金/
  储备结构/私人金条需求均无迁移"的历史或未来窗口 → 预测 (v) 被证伪。
  诚实标注：该限定收窄了空格的可检验域——(d) 全史裁决（RF-8）后，历史样本中
  (c)(d) 双越阈仅余 1968–1971 等价物段（2022– 段的 (d) 按补全细则改判不越阈，
  现代实现窗口当前为零），剩余检验力集中于未来对手方风险事件窗口（②③序列
  已足龄、①自 2025 足龄）——每次此类事件都是一次活检验。
  (c) 时序反转——跨多次切换事件，金价的体制性上涨系统性领先于（而非滞后于）
  央行购金量/储备份额变化 → 预测 (ii) 被证伪，储蓄端先行的跨部门应用不成立。
  (d) 弹性不对称不存在——分体制估计的单位增量需求价格弹性无显著差异 →
  预测 (iii) 被证伪，DED-030 放大器的体制门控主张不成立（DED-030 本身不受伤）。
  (e) 挑战者判据失效——央行储备持续、多国、超阈值地配置某数字资产，而其后的
  信用重定价期中金的增量需求份额不降 → 预测 (iv) 被证伪（预测 (iv) 本就是本条
  自担的射程扩展赌注，其失败记在本条账上而非 DED-027；砍掉天花板命题，
  核心切换主张不连带）。
  适用区间：法币储备体系时代（1971 年布雷顿森林解体后为主样本；1968–1971 过渡期
  为准样本）；金本位/复本位时代不在射程（彼时金本身是货币锚，无"两体制"可切换）。

falsification_trace:
  primary_suspect: |
    体制判别的独立性——"法币信用重定价期"必须用独立于金价的指标测量（央行购金吨数、
    COFER 美元份额、主权 CDS、替代结算份额），否则"金价涨了所以是货币体制、
    货币体制所以金价涨"构成循环。两重风险：(1) 灰区过宽——若历史样本中复合判据
    无法清晰二分体制（多数年份落在"一个指标越阈、一个不越"的灰区），则离散相变
    主张须降格为连续权重位移，核心增量即告失守；(2) 判别指标与先行指标共用
    央行购金量——虽已用"水平判别 vs 时序预测"分离角色并要求 ≥2 指标同向，
    但若其余指标（COFER/CDS/结算份额）在历史切换事件中不可得或不敏感，
    判别将实质上退化为单指标，循环风险回升。最先受检。
  secondary_suspect: |
    DED-028 与 DED-027 的射程外推。DED-028 的时序机制原文限于同一法币体系内
    SOV/MOE 的功能解耦，本条将"无法律缓冲端先动"的机制逻辑外推到主权储备配置——
    若主权部门的储备决策被证明主要由地缘政治联盟/军事依附驱动而对信用信号不敏感，
    先行指标命题失去 L3 支撑。DED-027 的筛选机制原文射程是商品货币时代自发交换
    网络，本条以"储备资产选择无法定强制、属自发选择网络"为由外推——若该域的
    选择被制度性协调（如 IMF 框架）主导，预测 (iv) 的挑战者判据失效。
    两处外推均只伤及各自对应的预测（(ii) 与 (iv)），不直接毁核心相变主张。
  unlikely_suspect: |
    DED-030 的 S/F≈50–70 事实（地质+统计事实，WGC/USGS 双源）与 DED-029 的
    四引擎方向性（已过独立审查、测度正交）——极少是错误根源。
    THEOREM-value-attribution 的 V=(U+E)×S 结构同样稳健。

excluded_outcomes:
  - "金价的具体点位或切换的日历时点预测——本条只预测'触发条件→结构改变'的条件命题与切换后的结构特征（相关性/弹性/时序），不预测触发何时发生、价格到多少。"
  - "金价日内/周度高频波动——继承 DED-029 的排除，E_network 伸缩以月–年为尺度。"
  - "供给侧冲击（矿脉发现/罢工/技术突破）导致的金价变动——走 S 通道，继承 DED-029/030 的排除。"
  - "其他避险资产（瑞郎、美债、日元）的体制动力学——它们是主权资产，有对手方风险，不共享 DED-030 的存量-流量结构与 DED-027 的非主权筛选逻辑，各自需要独立推论。"
  - "商品体制内部四引擎的相对权重微调——只要 C1 主导权未失、相关性未断裂，权重缓变属 DED-029 单因素框架的正常噪声，不构成体制切换。"
  - "金本位/复本位时代的金价——彼时金是货币锚而非被定价资产，无两体制可言，出射程。"

anti_talisman_clause: |
  【防不可证伪护身符】
  (1) 体制归属必须由预注册的复合独立指标（央行购金水平/COFER 份额/CDS/结算份额）
  事前判定，永远不得由金价行为反推——不可因"金价与利率脱钩了"就宣称"必是货币体制"。
  相关性断裂是被预测量（相变签名），不是分类输入。
  (2) 商品体制窗口内的预测失败（如利率升金价不跌）不得用"肯定是体制悄悄切了"消化——
  除非复合判据在该窗口独立越阈。判据不越阈而价格失灵 → 记为对本条或 DED-029 的
  真反例，不得开脱。
  (3) 先行指标检验中，"储蓄端先动"须由储备/购金数据的时间戳独立确认，
  不得因"金价后来涨了"倒推"央行当时肯定在买"。
  (4) 灰区诚实条款——若复合判据给出的历史二分中灰区年份占比过高（预注册：超过
  样本的 1/3），须主动报告并触发降格评估，不得靠挑选窗口制造清晰二分的假象。
  普查执行见 boundary_cases 的 1971–2024 逐年编码表（round-3 补全 (c) 候选普查、
  round-4 补执行 (d) 全史逐年裁决后：基准 18.5%/最不利 31%，未触发但受监控；
  条款执行基础=编码表 (c)(d) 双列完备性——(c) 候选清单已穷尽已知窄口径 ≥0.3%
  量级候选并逐一显式裁决（1971/1979/1982/1990/2003/2011 利比亚/2011 叙利亚/
  2012/2018/2019/2021/2022），(d) 已按注册细则（扩展窗+最短历史长度 n≥8+
  序列起点）逐年裁决 1971–2024）。

real_world_anchors:
  supporting:
    - anchor: "2022–2024 美元储备武器化后的体制切换——复合特有锚点（招牌格的现实实例）"
      evidence: |
        触发（独立于金价）：2022 年 2 月 G7 冻结俄罗斯央行约 3000 亿美元储备资产——
        储备资产的对手方风险被公开证实，构成可编码的离散信用事件（判据 c）。
        储蓄端先动（判据 a）：全球央行净购金量从此前十年均值约 500 吨/年跳升至
        2022 年约 1082 吨、2023 年约 1037 吨、2024 年约 1045 吨（WGC）——连续
        越阈；美元 COFER 份额延续下行（约 59%→57–58%）。
        价格响应与相关性断裂：TIPS 实际利率从 −1% 升至 +1.5～2% 高位（DED-029
        C1 单独预测金价深跌），金价却从约 1800 美元升至 2024 年的 2700 美元上方；
        金价-实际利率滚动相关性在 2022 年后显著衰减——多家机构研究独立记录了
        该相关性断裂。
        弹性放大：年增量约 1000 吨 ≈ 存量的 0.5%，对应价格 +50% 以上——
        单位增量的冲击远超商品体制窗口（对比 2013 年 ETF 减持约 900 吨对应 −28%，
        同量级流量、但彼时是高弹性层在卖）。
        复合特有性：该锚点不能被任何单条父推论解释——DED-029 在此窗口显式出射程
        （引擎冲突）；DED-028 不讲金价；DED-030 不讲触发；DED-027 不讲价格。
        四机制的可观察交互（信用事件→购金潮→相关性断裂→不成比例涨幅）齐备。
