        "购金未越 +1σ 阈值""无储备信用事件"消化此窗口——两处均为事实错误：
        (i) 判据 (a) 旧字面的 20 年基线（1991/1993–2012）覆盖 CBGA 时代央行
        年净卖 400–500 吨，均值为负或近零，2011 约 457 吨/2012 约 569 吨/
        2013 约 629 吨远超该低基线 +1σ——指标 (a) 按旧字面自 2011 年起持续越阈；
        (ii) 旧判据 (c) 明文含"评级下调、债务上限危机"——2011 年 8 月标普下调
        美国主权评级、2011/2013 两次债务上限危机、2010–2012 欧债危机 CDS 展宽
        均可编码。(a)+(c) 同向越阈 → 旧判据误判"重定价期"，而该窗口金价随实际
        利率走、相关性稳定强负、边际卖家是 ETF 高弹性层——招牌格预测在旧判据
        确认的窗口内失败。
        性质：不是父机制失效（C1 方向对、S/F 结构在、央行确在买），是复合判据
        把触发条件划错了位置——无法区分"新兴市场央行常态化储备多元化+发达国
        评级噪声"（2011–2013）与"储备资产对手方风险被证实"（2022 冻结）。
        消化（已重校准，见 operationalization 的重校准披露）：判据 (c) 限缩为
        对手方风险被证实类事件后，2011–2013 的评级/债务上限事件不再计入；
        判据 (a) 加"创 20 年新高"条件后 2011–2013 仍越阈（当年净买入均创
