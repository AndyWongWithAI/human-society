id: L4-006
type: composite_deduction
layer: L4-composites
deduction_form: composite
status: verified  # 薄涌现——C1阶段A依赖外部SDT桥接
term: "道德-制度共演 (Moral-Institutional Coevolution)"
claim_type: bidirectional_dynamics

人话摘要: |
  法律和道德互相兜底也互相腐蚀——法律太强人就不内化了（'反正有警察管'），道德太碎法律跟不上（每个小群体都有自己的道德→法律不知道该保护谁）。最稳的社会是两边都在、互相牵着的交叠区，但这交叠区要两边持续砸能量才维持得住。

statement: |
  【Composite claim】道德规范（分布式第三方惩罚 TP + 内化 INT）和正式法律制度（专门化执行机构）之间不是线性替代的"二选一"关系——它们构成一个双向共演系统：两条替代路径（法律替道德 T1、道德替法律 T2）、两条腐蚀路径（法律腐蚀道德 C1、道德腐蚀法律 C2）、一个交叠稳定区 O——五条动力学由群体规模、法律执行强度、道德 TP×INT 配置三个变量的交互决定。

  【Parent mechanisms】
  DED-016（面对面→制度化公平相变）：群体规模越过~150 人→面对面公平不可持续→必须在碎片化（档 B）或制度化（档 C）间二择。这是法律出现的"规模引擎"——解释了法律从哪来、为什么在特定规模阈值后才成为必要。
  DED-023（道德-习俗迁移判据）：TP×INT 正交轴→四象限规范结构类型。TP 由旁观者利益占比驱动、INT 由发育窗口条件驱动——二者独立变化。这是道德的"结构引擎"——解释了道德在什么条件下能自我维持、什么条件下退化。
  DED-025（道德标准通胀-紧缩）：通胀需要 M1 受害叙事 + M2 道德创业者（合取主动推力），紧缩是默认状态——M3 TP 瓦解 + M4 代际内化断裂只需维护能量停止（熵增接管）。这是道德的"方向引擎"——解释了交叠区为什么需要持续能量投入。
  DED-024（道德内化瓦解动力学）：内化瓦解遵循四阶段剥洋葱顺序（合理化→比较→认知重组→情绪脱钩）——不可跳、阶段 3 不可逆、瓦解/重建能量不对称。这是道德的"微观引擎"——为 C1（法律挤出内化）和 C2（合法性侵蚀后的内化解体）提供个体层机制基础。

  【Emergent property】四条父推论各自描述"自己的"机制——DED-016 讲规模→制度化、DED-023 讲 TP×INT 结构、DED-025 讲道德方向变化、DED-024 讲个体层瓦解——但谁都没讲这四条机制【碰在一起】时，道德和法律之间会发生什么。本推论的涌现增量在于：(a) 识别出双向替代（T1/T2）——法律和道德可以互相填补对方的真空——这是四条父推论各自覆盖不到的"跨系统"动力学；(b) 识别出双向腐蚀（C1/C2）——法律和道德不仅互相填补，还互相破坏——C1（法律太强→挤出内化，两阶段）：阶段A 过度合理化效应（external_bridge: SDT——法律在场→归因外化→INT渐进削弱）+ 阶段B DED-024 sucker effect（法律弱化后实际违规出现→加速瓦解），DED-025 M4 代际传导贯穿两阶段；C2（道德太碎→法律合法性受损）是 DED-016 的碎片化路径（档 B）撞上 DED-023 的内容独立性的交互结果；(c) 识别出交叠区 O 的稳定性条件与维护成本——两条独立熵增通道（法律制度的组织熵增 PHY-001 + 道德标准的紧缩默认 DED-025 M3/M4）要求交叠区必须从两端持续接受能量输入才能维持——单看任一条父推论都看不到"两端熵增"的综合压力。

  【Prediction】
  (i) T1——法律替代道德：群体规模 > Dunbar → TP 因利益占比稀释而瓦解（DED-025 M3）→ 若此时法律接管（专门化执行替代分布式执行）→ 规范的执行从"任意成员"变为"警察/法院"。DED-016 给出规模门槛，DED-023 + DED-025 给出 TP 瓦解逻辑——单看任一条都推不出"法律替代道德"这个完整的系统级转换。
  (ii) T2——道德替代法律：法律真空（无制度化执行或法律腐败失效）+ 群体内 TP+INT 仍高 → 道德自我维持，无需法律。这是无国家社会的标准模式，也是现代社会中"法不责众"领域（排队、礼让）的维持机制。DED-023 解释 TP+INT 自我维持，DED-024 解释 INT 在什么条件下不瓦解——但谁都没说"这可以替代法律"——那需要 DED-016 提供"什么时候法律不在场/不需要"的规模条件。
  (iii) C1——法律腐蚀道德（两阶段，条件性成立）：
      前置条件：法律被感知为缺乏合法性（perceived legitimacy below threshold）。
      若法律被感知为合法→C1的阶段A被阻断（归因外化不发生→INT不削弱）——
      北欧案例即落入此条件。C1的普遍性因此降级为"当且仅当法律感知合法性低时成立"。
  阶段A（过度合理化效应，external_bridge: SDT）：法律强制过强且持久 → 个体将遵守归因于外部强制（"怕被抓"）而非内在价值（"该做"）→ INT 渐进削弱（月-年级）。此阶段机制来自自我决定理论（SDT）的过度合理化效应——外部强制→归因外化→内在动机挤出——非 DED-024 原有机制，诚实标注为外部桥接。
  阶段B（DED-024 接管）：法律一旦弱化（政权更迭/经济崩溃）→ 实际违规行为出现（可观察的他人违规无后果）→ DED-024 的阶段 2 sucker effect 激活（"别人都不遵守了，凭什么我守"）→ 加速瓦解（周-月级），此时 DED-024 的机制合法适用。
  DED-025 M4 代际传导贯穿两阶段——阶段 A 削弱的内化基础使阶段 B 的 sucker effect 下场更彻底（无内化后备）。DED-016 的制度化（规模条件）+ DED-025 M4（代际传导）贯穿全链——阶段 A 的过度合理化来自 SDT 外部理论，阶段 B 的 sucker effect 来自 DED-024。
  (iv) C2——道德腐蚀法律：不同亚群体持有不可通约的道德标准（DED-016 档 B 碎片化 + DED-023 内容独立性 → 同一行为在不同亚群落不同 TP×INT 象限）→ 法律在冲突的道德主张之间必须选边 → 落选方成员认为法律"不道德" → 拒绝内化该法律 → DED-024 阶段 3 认知重组（"这法律本就不对"）→ 法律执行从"内部服从 + 外部强制互补"退化为"纯外部强制"→ 执法成本飙升。DED-016（碎片化）+ DED-023（内容独立性）+ DED-024（内化瓦解）——三条合力才产生"道德碎片化→法律合法性受损"这一制度间交互预测。
  (v) O——交叠区稳定条件：法律覆盖 + 道德覆盖（TP+INT 仍活跃）→ IOR（制度交叠率）高 → 最稳定。但交叠区需要两端的持续能量投入：法律端需要对抗组织熵增（PHY-001，DED-010 制度化维护成本），道德端需要对抗紧缩默认（DED-025 M3/M4）——两端同时漏能量，交叠区的维持成本是两股熵增压力的合取。如果任一端的能量输入中断（法律端：制度退化；道德端：TP 瓦解或代际内化断裂），交叠区向单一覆盖退化。
  (vi) 逐格判空——3×3 笛卡尔积（群体规模 {<Dunbar, >Dunbar} × 法律制度化 {无, 弱, 强} × 道德配置 {高 TP+INT, TP-only, 碎片化}）中，至少四个格需要 ≥2 条父推论合力（详见 emergence_demonstration.multi_parent_cells）。

operationalization:
  群体规模:
    definition: "共享同一套资源分配与冲突解决机制的稳定交互边界内的成员数。"
    measurement: "人口普查/考古聚落规模/民族志记载。Dunbar 区间 ~100-250 人（继承 DED-016）。"
    limitations: "Dunbar 数的争议区间使关口的精确位置有模糊带，但关口的【存在性】比其精确位置更承重。"

  法律制度化强度:
    definition: |
      正式法律制度的存在与执行强度，三档：
      无——不存在常设第三方裁决机制（不满足 DED-016 档 C 最低制度门槛的常设+跨群管辖+裁决约束力三要素）。
      弱——存在档 C 制度但执行依赖大量私人/社会补充（如冰岛 Althing：有年度集会+法律宣述人但执行靠私人仇杀/仲裁）。
      强——存在档 C 制度且执行主要由专职机构（警察/法院/行政制裁）承担，社会自发的 TP 被制度执行替代或边缘化。
    measurement: "按 DED-016 档 C 最低制度门槛三要素独立判定制度化存在与否；再按执行主体（社会自发 vs 专职机构）占比判定强弱。独立于道德 TP×INT 配置测得。"
    limitations: "弱与强的分界是连续的（专职执行占比从 0 到 1），无天然阈值。操作上用'>50% 的规范执行事件由专职机构完成'作为强/弱切分。"

  道德 TP×INT 配置:
    definition: "继承 DED-023 的四象限分类：(+TP,+INT) 完全道德、( +TP,-INT) 外部执行、( -TP,+INT) 残余内化、( -TP,-INT) 社会习俗。在群体层面取主导配置——覆盖多数规范的结构类型。"
    measurement: "TP 和 INT 各自独立测量（继承 DED-023 operationalization），不因该规范是否被法律覆盖而调整测量方法。碎片化 = 不同亚群对同一行为领域落在不同象限且差异不可调和（继承 DED-016 档 B 判据）。"
    limitations: "继承 DED-023 的全部测量局限（TP-INT 正交性、稳态退化、规范抽样）。同一群体内不同规范可能落在不同象限——'道德配置'取该群体核心道德规范（涉及伤害/权利/正义的规范）的众数象限。"

  制度交叠率 IOR:
    definition: "在特定行为领域内，同时被法律制度化覆盖【且】被自发 TP+INT 覆盖的规范，占该领域总道德化规范的比例。IOR=1 表示该领域所有道德规范同时受法律和自发道德双重覆盖；IOR=0 表示纯一端覆盖。"
    measurement: "(a) 列出该领域所有被任一方（法律或自发道德）覆盖的规范清单；(b) 逐条判定是否同时满足：法律制度化执行存在 + TP>0 且 INT>0（独立测量，继承 DED-023）；(c) IOR = 双重覆盖规范数 / 总规范数。"
    limitations: "规范清单的边界取决于抽样框架。跨领域聚合需加权（不同领域对社会秩序的重要性不同）。IOR 是群体层面的截面快照——不直接捕捉动态迁移方向。"

anti_talisman_clause: |
  本推论的复合输出（T1/T2/C1/C2/O 五条动力学 + IOR 交叠率）必须独立于其输入变量测量，不得因观察到结果而反推条件：
  1. 不得因"法律和道德共存的稳定社会"就倒推"IOR 必然高"或"交叠区必然活跃"——IOR 必须逐条规范独立判定双重覆盖状态。
  2. 不得因"出现道德真空"就倒推"C1 的法律挤出机制必然激活"——M3（TP 瓦解）或 M4（代际内化断裂）均可因非法律因素（经济崩溃/战争/人口替代）独立造成道德真空。
  3. 不得因"法律合法性受损"就倒推"C2 的道德碎片化必然存在"——法律本身的程序缺陷、腐败、或外部征服均可独立造成合法性问题。
  4. 不得由社会秩序稳定性反推交叠区状态——IOR 的测量必须逐条判定规范是否被法律和自发 TP+INT 双重覆盖，独立于秩序结果。
  5. 遇到疑似反例（如北欧高信任+强法律）时，不得事后调高"法律感知合法性"估值来消化——法律感知合法性必须事前独立测量（公民对"法律代表我的利益"的同意率/对立法过程的参与度感知/对执法者的公正性评价，均独立于 INT 测量）。
  6. C1 的阶段A 机制（过度合理化效应）来自 SDT 外部理论，非 DED-024 原有机制——不得在验证 DED-024 的场景中援引 C1 作为 DED-024 的证据，亦不得在验证 C1 时将阶段A 效应归因给 DED-024。


derivation:
  from_l3:
    deductions: [DED-023, DED-025, DED-016, DED-024]
  from_l1:
    axioms: [AXIOM-001, AXIOM-003, PHY-001]
    theorems: [THEOREM-moral-third-party-enforcement, THEOREM-moral-internalization, THEOREM-norm-energy-saver]
  from_l2:
    bridging: [BR-L2-014, BR-L2-018, BR-L2-019]
  steps: |
    1. 父机制摘要——四条父推论各自的独家贡献
       DED-016: 规模→制度化或碎片化的二择结构。不涉及道德 TP×INT、不涉及法律-道德交互。
       DED-023: TP×INT 正交轴→四象限规范类型+迁移不对称。不涉及制度化/法律、不涉及规模阈值。
       DED-025: 道德标准的方向动力学（通胀需推力/紧缩默认）。M3（TP 瓦解）与 DED-016 的规模机制共享同一驱动量（利益占比稀释），但 DED-025 不做"法律接管"的转向预测。
       DED-024: 个体层内化瓦解的四阶段顺序+不可逆+能量不对称。不涉及制度化、不涉及法律-道德交互。

    2. 交互逻辑——四条父机制碰在一起产生什么
       (a) 替代关系（T1/T2）：DED-016 给出"什么时候需要制度化"（规模条件），DED-023 给出"道德什么时候能自我维持"（TP+INT 条件），DED-024 给出"自我维持的边界"（INT 瓦解条件）。合起来→法律和道德可以在特定条件下互相填补对方的真空——这需要跨制度比较，不在任何单条父推论射程内。
       (b) 腐蚀关系（C1/C2）：C1 = DED-016（制度化存在）+ DED-025（M4 代际传导贯穿）→ 两阶段模型：阶段A（external_bridge: SDT 过度合理化效应——外部强制→归因外化→INT 渐进削弱，月-年级）+ 阶段B（DED-024 sucker effect——法律弱化后实际违规出现→阶段2比较激活→加速瓦解，周-月级）。C2 = DED-016（碎片化档 B）+ DED-023（内容独立性 → 不同亚群对同一行为道德化不同）+ DED-024（阶段 3 认知重组"这法律本就不对"）→ 道德碎片化侵蚀法律合法性。
       (c) 交叠区维护成本（O）：DED-025 M3+M4 = 道德端熵增通道；PHY-001 应用于法律制度 = 法律端熵增通道（组织熵增→制度化维护需要持续能量）。两端同时漏能量——交叠区需要两股独立的维护投入，缺一不可。

    3. 涌现论证——为什么整体大于部分之和
       见 emergence_demonstration 段。

    4. 多父逐格判空——验证交互非平凡
       见 emergence_demonstration.multi_parent_cells 段。

  scope_bridge: |
    【DED-023/DED-025 法律语境扩展的桥接论证】

    DED-023 和 DED-025 均明确排除法律语境（DED-023 excluded_outcomes: "正式法律系统中的规范执行...混淆TP测量"；DED-025 excluded_outcomes: "法律强制推动的道德标准变化...不在DED-025射程内"）。L4-006 将其机制扩展到法律语境——这是 L4 复合推论的正当操作，但需显式论证而非沉默。

    (a) DED-023 的 TP 构念在法律语境中的适用性：
    在无法律环境中，TP = 旁观者自发付代价惩罚违规者的意愿（BR-L2-018 驱动：利益占比→惩罚动机）。在有法律环境中，法律执行已接管了惩罚功能——此时直接观察到的"第三方惩罚行为"减少，但这不等同于 TP 构念消失。如果法律不存在，旁观者是否仍愿付代价惩罚——这是一个原则上可测的反事实量（通过 vignette 实验/博弈实验/自然实验如警察罢工）。此反事实量在概念上等价于 DED-023 的 TP 构念——测量的是"自发惩罚倾向"，只是测量难度从田野直接观察升级为反事实推断。L4-006 已在 operationalization 中标注此测量困难（"制度化惩罚混淆TP测量"）。本桥接的诚实标注：父推论（DED-023）在无法律语境中被验证，其在法律语境中的有效性是 L4-006 的延伸假说，需独立经验检验。

    (b) DED-025 的 M3（TP 瓦解）/ M4（代际内化断裂）在法律语境中的适用性：
    DED-025 将"法律作为标准变化的主要执行渠道"的场景排除在射程外，但 M3 和 M4 的机制本身不依赖"无法律"前提——TP 是否瓦解取决于旁观者利益占比是否被稀释（规模/匿名化/分工专业化），INT 是否代际传导取决于发育窗口内对等性信号是否完好——两者在原则上有法律和没有法律时均可独立测量。被 DED-025 排除的是"法律直接惩罚/罚款推动标准变化"的场景（此时标准变化的主要执行渠道是制度化法律制裁而非自发社会惩罚），而非"道德自身在独立变化但法律恰好在场"的场景。在 C1 中，INT 削弱的初始触发是法律在场导致的过度合理化效应（SDT external_bridge），非法律直接惩罚道德违规者——INT 的变化是道德系统内部的变化，不属于 DED-025 的排除范围。M4（代际传导）的机制——发育窗口内对等性信号弱→下一代 INT 更低——是通用机制，不因法律在场与否而改变其因果逻辑。

    (c) 诚实标注：上述论证是 L4-006 自建的 scope 桥接，非父推论原文所有。父推论（DED-023/DED-025）在无法律语境中被验证——其在法律语境中的有效性是 L4-006 的延伸假说，需独立经验检验。此桥接不代表父推论 scope 的正式扩展（那需按 Rule B 修订父推论原文），仅代表 L4-006 在合成父推论机制时所依赖的延伸假设。


emergence_demonstration:
  emergence_type: conjunction  # 薄涌现——主体为合取级；C1依赖外部SDT桥接(非纯父推论推导)
  emergence_type_note: |
    C1(法律腐蚀道德)的阶段A(过度合理化效应)桥接了外部自我决定理论(SDT)——
    非从四条父推论内在推导。这是诚实标注而非缺陷:SDT提供了阶段A的个体层机制,
    DED-024提供了阶段B的社会层瓦解机制,二者串联产生C1的完整动力学。
    但此串联意味着C1的"涌现"不是纯父推论间的交互——是父推论+外部理论的合取。
  emergence_tier: "合取为主——C2 为 interaction（交互级涌现），T1/T2/O 为 conjunction（合取级涌现），C1 为 conjunction + external_bridge（阶段A 过度合理化效应来自 SDT 外部理论，非父推论机制交互）"
  necessity: |
    逐一移除每条 L3 父推论：
    移除 DED-016 → T1（法律替代道德）的规模条件消失——不知法律"为什么在特定规模才出现"，T1 退化为"法律可以替代道德"的常识复述。C2 的碎片化路径（档 B）消失——不知"道德为什么会碎片化到腐蚀法律的程度"。
    移除 DED-023 → T2（道德替代法律）的 TP+INT 自我维持机制消失——不知"道德凭什么在无法律时撑得住"。C2 的内容独立性消失——不知"不同亚群为什么会把同一行为道德化到不同方向"。
    移除 DED-025 → 交叠区维护成本（O）的道德端熵增通道消失——不知"为什么道德端也需要持续砸能量"。T1 的 TP 瓦解逻辑失去 M3 的具体机制。
    移除 DED-024 → C1（法律挤出内化）的个体层瓦解动力学消失——不知"法律强制如何具体导致内化解体"。C2 的阶段 3 认知重组消失——不知"道德碎片化如何具体侵蚀法律合法性"。
    每条父推论都是必要的承重墙——移除任一条，L4 的核心预测（T1/T2/C1/C2/O 的五条完整动力学）都站不住。

  novelty: |
    四条父推论各自的结论：
    - DED-016: "规模 > Dunbar → 公平维护从面对面跳转到制度化或碎片化"
    - DED-023: "规范的 TP×INT 坐标决定其结构类型，迁移不对称（顺时针慢/逆时针快）"
    - DED-025: "道德标准通胀需要叙事+创业推力，紧缩是熵增默认"
    - DED-024: "内化瓦解四阶段不可跳，阶段 3 不可逆，瓦解快/重建慢"

    L4-006 的核心命题逐一对照：
    - T1（法律替代道德）：不是 DED-016 的复述——DED-016 讲公平制度相变，不涉及【道德 TP+INT→法律执行】的替代关系。不是 DED-025 的复述——DED-025 讲道德内部的紧缩，不做"法律接管"的转向预测。
    - T2（道德替代法律）：不在任何单条父推论中——没有一条父推论说"TP+INT 高可以替代法律"。DED-023 说 TP+INT 可自我维持，但没说"在制度化应出现时仍可替代制度"。
    - C1（法律腐蚀道德/挤出内化，两阶段）：不在任何单条父推论中。阶段A（过度合理化效应——法律在场→归因外化→INT 渐进削弱）来自 SDT 外部理论（external_bridge），非四条父推论任一条的机制。阶段B（法律弱化后 DED-024 sucker effect 接管→加速瓦解）合法使用 DED-024。DED-016 讲制度化出现，不说"制度化会反过来破坏道德内化"。DED-025 M4 代际传导贯穿两阶段但本身不说"法律在场系统性推低 INT"。
    - C2（道德腐蚀法律/合法性受损）：不在任何单条父推论中——DED-016 讲碎片化（档 B），不说"碎片化会反噬法律的合法性"。DED-023 讲内容独立性，不说"内容独立性会导致法律失去道德支撑"。
    - O（交叠区维护成本）：不在任何单条父推论中——没有一条父推论同时考虑法律端熵增和道德端熵增的合取压力。
    五条核心命题均不是父推论结论的 AND/OR 拼接——每条都需要父推论机制的【交互】才能推出。

  multi_parent_cells: |
    笛卡尔积轴：
    X1: 群体规模（DED-016）——{<Dunbar (~<150), >Dunbar (~>150)}
    X2: 法律制度化（DED-016 档 C）——{无, 弱（proto-C）, 强（专职机构 >50% 执行）}
    X3: 道德 TP×INT 配置（DED-023）——{高 TP+INT（完全道德）, TP-only（外部执行）, 碎片化（档 B）}

    15 个有意义格（2×3×3=18 格，排除 <Dunbar + 强法律 3 个物理上不可能的格），逐格标注父推论归属（当前分析 G1-G14 共 14 格，第 15 格 <Dunbar + 弱法 + 碎片化 因 DED-016 档 A 隐含小群内共享身份→碎片化经验上近空，不再单独列格）：

    —— 规模 <Dunbar ——
    G1: <D, 无法, 高 TP+INT → 面对面道德，秩序稳定。DED-016 档 A 单独强制。平凡。
    G2: <D, 无法, TP-only → 外部执行无内化，暂稳。DED-023(+TP,-INT) 单独预测。平凡。
    G3: <D, 无法, 碎片化 → 小群不应碎片化——若出现则反常。DED-016 档 A 隐含此格近空。平凡。
    G4: <D, 弱法, 高 TP+INT → 有 proto-C 制度 + 强道德。DED-016 档 C 门槛 + DED-023 Q1。需两条合力——但 <Dunbar + 制度的组合在经验上罕见（制度通常因规模需求才出现），非本推论的核心贡献格。
    G5: <D, 弱法, TP-only → 制度 + 外部执行。DED-016 + DED-023。需两条合力。

    —— 规模 >Dunbar ——
    G6: >D, 无法, 高 TP+INT → 【T2 格】法律真空 + 道德自我维持。预测：此格在经验上存在但罕见——需要极特殊的 TP+INT 维持条件（如紧密宗教社群在无国家区域的自治）。【需 DED-016（规模背景）+ DED-023（TP+INT 自我维持条件）+ DED-024（INT 不瓦解的边界条件）——三条合力】。单看 DED-016 预测此格应为空（>Dunbar 无制度→碎片化）；单看 DED-023 不涉及规模限制；单看 DED-024 不涉及"替代法律"。三条合起来才推出"可以存在但罕见且边界条件苛刻"。

    G7: >D, 无法, TP-only → TP 正在瓦解（DED-025 M3：规模稀释→利益占比<惩罚成本），无内化兜底，无法律接管。→ 霍布斯式失序。DED-016 单独强制（档 A 不可持续→碎片化或制度化，此处两者皆无→失序）。偏平凡——DED-016 隐含此格不稳定。

    G8: >D, 无法, 碎片化 → DED-016 档 B 标准路径——无制度→碎片化。DED-016 单独强制。平凡。

    G9: >D, 弱法, 高 TP+INT → 【O 格——交叠区】弱法律 + 强道德 → 双重覆盖，最稳定。但稳定性有条件——法律端和道德端都需要持续能量投入。【需 DED-016（制度化存在）+ DED-023（TP+INT 维持条件）+ DED-025（道德端紧缩默认→需持续能量）——三条合力】。DED-016 单独只能看到"有制度"但看不到"制度与道德的交叠为何稳定、为何需要维护"；DED-023 单独只能看到"TP+INT 高"但看不到"交叠的法律端在提供什么"；DED-025 单独只能看到"道德紧缩风险"但看不到"交叠区的法律端同样在漏能量"。三条合力才推出 O 的完整维护逻辑。

    G10: >D, 弱法, TP-only → 弱法律 + 外部执行（无内化）。法律弱时 TP-only 不稳定（TP 随利益占比波动）。DED-023(+TP,-INT) + DED-016（弱法）。需两条合力。

    G11: >D, 弱法, 碎片化 → 弱法律试图桥接碎片化的道德——张力格。法律太弱无法压制碎片化离心力，但碎片化的道德又侵蚀法律的统一性。DED-016（碎片化+制度化并存）+ DED-023（内容独立性）。需两条合力。

    G12: >D, 强法, 高 TP+INT → 【C1 风险格】强法律 + 强道德。短期最稳定但长期有腐蚀风险——两阶段模型：阶段A（external_bridge: SDT 过度合理化效应——强法律系统性替代 TP 的执行功能→个体将遵守归因于外部强制→INT 渐进削弱，月-年级）→从高 TP+INT 向 TP-only 漂移；阶段B 若法律弱化→实际违规行为出现（可观察的他人违规无后果）→DED-024 阶段 2 sucker effect 激活→加速瓦解（周-月级）。DED-025 M4 代际传导贯穿两阶段。【需 DED-016（强制度的规模条件，弱背景）+ DED-023（TP×INT 区分——没有这个区分就看不到"TP 仍在但 INT 被挤出"，强表征）+ DED-025（M4 代际传导）——三条合力；阶段A 的过度合理化机制来自 SDT 外部理论，诚实标注为 external_bridge】。DED-016 单独只看"制度化出现了"，看不到"制度化会反过来改变道德的 INT 维持条件"；DED-023 单独只看"TP×INT 坐标"，看不到"法律在场可以系统性推低 INT"；DED-025 单独只看"代际传导"，看不到"法律在场本身作为外部强制触发过度合理化"。三条合力 + external_bridge 才看到"法律→挤出内化"这一效应。

    G13: >D, 强法, TP-only → C1 充分发展态。强法律 + 已无内化——纯外部执行。法律一旦失效（政权更迭/崩溃）→瞬时失序——无内化后备。【需 DED-016（强制度）+ DED-023（+TP,-INT 格的行为签名）+ DED-025（M4 代际传导）——三条合力。从 TP+INT→TP-only 的瓦解路径由阶段A SDT 过度合理化驱动（external_bridge），非 DED-024 原有机制】。

    G14: >D, 强法, 碎片化 → 【C2 格】强法律 + 道德碎片化。法律必须在不可通约的道德主张间选边→落选方认为法律"不道德"→DED-024 阶段 3 认知重组→法律合法性受损→退化为纯外部强制→执法成本飙升。【需 DED-016（碎片化档 B + 强制度共存）+ DED-023（内容独立性→不同亚群对同一行为道德化不同）+ DED-024（阶段 3 认知重组→"这法律本就不对"）——三条合力】。DED-016 单独只看"碎片化或制度化二择"但看不到"两者并存时的交互腐蚀"；DED-023 单独只看"内容独立"但看不到"这会反噬法律"；DED-024 单独只看个体瓦解但看不到"瓦解由碎片化→法律选边这一制度间冲突触发"。

    总结：G6（T2）、G9（O）、G12（C1 风险）、G14（C2）四个格均需 ≥2 条父推论合力——G6/G9/G14 各需三条合力，G12 需三条合力（DED-016 弱背景 + DED-023 强表征 + DED-025 M4 代际传导；阶段A 的过度合理化机制标注为 external_bridge: SDT）。满足 Rule E 的 multi_parent_cells 要求——至少一个格子需要 ≥2 条父推论合力才能推出预测。

falsifiability: |
  (a) 发现 >Dunbar 群体在无法律制度的条件下，仅靠分布式道德（TP+INT）维持跨亚群统一规范秩序超过一个代际——T1 的"规模→需要法律替代"被推翻，T2 格（G6）从"罕见且边界条件苛刻"升级为"可稳定存续"。
  (b) 发现强法律社会（法律执行强度高）中，公民对该社会核心道德规范的内化深度（DED-024 内化深度指标）与弱法律社会无统计差异——C1 的"法律挤出内化"被推翻。
  (c) 发现法律执行强度与内化深度之间存在系统【正】相关（法律越强内化越深）——不仅推翻 C1，且暗示法律可能【促进】内化——需考虑"法律作为对等性信号强化器"的替代假说。
  (d) 发现强法律+道德碎片化社会中，法律的合法性（公民自愿服从率）与道德同质社会无统计差异——C2 的"碎片化→合法性受损"被推翻。
  (e) 发现交叠区（IOR 高）社会的秩序稳定性在控制法律和道德各自独立贡献后，IOR 增量不显著——O 的"交叠本身有独立稳定化效应"被推翻，退化为"法律强+道德强各自独立贡献"的平凡合取。

falsification_trace:
  primary_suspect: |
    C1（法律挤出内化）——这是四条父推论机制交互的最强声称。最危险的威胁来自两个方向：
    (a) "法律作为对等性信号强化器"替代假说：法律惩罚违规者 → 强化了"违规会被惩罚"的对等性信号 → DED-024 的内化维持条件（对等性信号）被法律【增强】而非削弱 → 法律反而促进内化。若此替代假说成立，C1 不仅被推翻——T1/T2/O 中"法律-道德互斥"的核心直觉需整体修正，法律和道德可能主要是互补而非替代/腐蚀。
    (b) 经验反例：北欧高福利国家（丹麦/瑞典/挪威）——法律执行强度中等偏高（高税收合规靠法律强制），但社会信任和内化道德水平也极高。若证明北欧的高内化与强法律共存且无挤出迹象→C1 被反例填格。消化路径：北欧的强法律可能与高社会信任形成了正反馈循环（不同于东德的秘密警察模式——法律执行的"合法性感知"可能是调节变量：被认为合法的法律促进内化，被认为不合法的法律挤出内化）。此消化若成立→C1 需加入"法律感知合法性"作为调节变量——目前 C1 未建模此调节。
  secondary_suspect: |
    C2（道德碎片化→法律合法性受损）的经验路径——碎片化与法律合法性之间的因果方向可能反转：不是碎片化导致合法性受损，而是法律本身不合法（如殖民者强加的法律体系）导致社会碎片化。若因果方向反转→C2 的逻辑链需重排，但不必然推翻双向腐蚀的存在性。
  unlikely_suspect: |
    T2（道德替代法律）的存在性——即使 T2 格（>Dunbar + 无法 + 高 TP+INT）在经验上始终为空（从未观察到任何社会在此格中稳定存在），推论核心（双向替代+双向腐蚀+交叠区）仍可通过"T2 是逻辑可能但物理上几乎不可实现"存活。损的是 T2 作为独立可观察预测的价值，不损五条动力学的整体框架。

excluded_outcomes:
  - "法律与道德的'正确'关系（如自然法 vs 法律实证主义的规范立场）——本推论是 L4 事实命题（它们在实际运行中如何共演），不是 L5 规范命题（它们应该如何相关）。"
  - "具体某个社会的法律-道德配置的历史路径——本推论给出的是动力学框架和空格预测，不预测特定社会的具体轨迹（那是 L4-003 和 L4-005 的射程）。"
  - "法律的具体内容（如财产法 vs 刑法）与道德的交互差异——本推论将'法律'作为整体制度类型处理，不做部门法级别的细分。不同部门法与道德的交互可能不同——此为本推论适用边界。"
  - "道德法律化（legislating morality）的规范评价——本推论只描述'法律能否成功替代道德执行'，不判断'法律应不应该管道德'。"

real_world_anchors:
  supporting:
    - anchor: "东德（1949-1989）作为 C1 实例"
      evidence: |
        40 年高密度警察国家（Stasi 线人密度 ~1/66 公民）。1990 年统一后 Stasi 档案公开→公民发现邻居/同事/家人都曾相互举报→社会信任瞬时崩盘→1990s 德国东部出现'道德真空'（犯罪率飙升+合作规范瓦解+极右翼兴起）。不是因为东德人'本来就没道德'——是内化被 40 年外部强制系统性地替代了。统一后法律骤变（从东德法→西德法）→旧法律的强制消失但内化未同步重建→C1 预测的'法律弱化→规范全崩'被干净地观察到。置信度：moderate-strong——此为自然实验，但混杂了经济休克（两德统一的经济震荡）和身份危机（东德人'输家'身份），无法将效应全归因于法律-道德交互。
      confidence: moderate-strong

    - anchor: "日本作为 O 格（交叠区）实例"
      evidence: |
        高人口密度+低犯罪率。法律执行强度（警力/监禁率）并不高于其他发达国家——属弱-中法律端。但排队、垃圾分类等'法不责众'领域的合规率极高——TP 和 INT 均高（自发排队、内心认为不排队'丢人'）。2011 地震后秩序维持——不是因为警察多，是道德的内化没被法律挤出。同时，法律的在场作为'兜底对等性信号'——即使看不到周围人在惩罚违规者，也知道法律会惩罚→DED-024 的 INT 维持条件（对等性信号）不完全断裂。置信度：moderate——日本案例混杂了文化特殊性（耻文化/集团主义），无法干净地分离"交叠区结构性稳定"与"日本特有的文化因素"。
      confidence: moderate

    - anchor: "索马里（1991 后无国家时期）作为 T2 边界"
      evidence: |
        中央政府崩溃后→法律真空。部分地区依靠氏族习惯法（xeer）和伊斯兰教法维持秩序——TP（氏族成员愿付代价惩罚违规者）+ INT（宗教内化）自我维持。但碎片化严重——不同氏族有不同的 xeer 版本→跨氏族缺统一规范。同时满足 T2（氏族内道德替代法律）和 C2（跨氏族碎片化→无跨氏族法律合法性）。置信度：moderate——索马里经验证据质量参差（田野研究在冲突环境中进行），且 xeer 本身是否为"法律制度的一种形式"（口头法+长老裁决→可能满足 DED-016 档 C proto-C 门槛）有争议。
      confidence: moderate

    - anchor: "美国禁酒令（1920-1933）作为 C2 边界"
      evidence: |
        法律（宪法第十八修正案）禁止酒精——但大量亚群体（城市移民/工人阶级/天主教徒）不内化此规范（饮酒在他们道德世界中不是错的）→DED-023 内容独立性：酒精消费在不同亚群落不同象限。法律在冲突的道德主张间选边（选清教徒道德标准）→落选方普遍违反→法律执行从"社会共识 + 强制互补"退化为"纯外部强制"→执法成本飙升（私酒泛滥/腐败/有组织犯罪）→十三年后废除。置信度：strong——禁酒令是 C2 机制的近理想型实例，因果链干净。
      confidence: strong

  counterexamples:
    - "北欧国家（丹麦/瑞典/挪威）：强法律（高税收合规靠强制）+ 高内化道德（高社会信任+低腐败）——表面上是 C1 的直接反例。消化：(a) 北欧的法律执行可能不被公民感知为'外部强制'而是'集体自我管理'（合法性感知高→法律不触发 DED-024 的阶段 2 比较机制）；(b) 北欧的经验可能表明 C1 需要一个调节变量——法律感知合法性（perceived legitimacy of law）——若法律被感知为'我们共同制定的规则'，强法律不挤出内化甚至可能强化内化。此反例不推翻 C1 的因果逻辑但严重限制其适用范围：C1 仅在法律感知合法性低时成立。此边界需纳入 primary_suspect 的消化路径。"

  boundary_cases:
    - "殖民地法律体系：宗主国强加的法律→本地道德标准与其冲突→C2 的标准案例（合法性从起点就低）。但殖民情境中法律从来不是'内生的'——C2 的逻辑链起点不同（合法性从未建立，而非从有到无的腐蚀）。"
    - "宗教法体系（如伊斯兰教法）：法律本身声称道德权威→法律与道德的边界模糊→T1/T2/C1/C2 的分析框架假设法律和道德可被独立识别——在宗教法体系中此假设可能不成立。适用边界：本推论的框架最适用于法律与道德在制度上分化的社会。"

discriminant_validity: |
  【与"法律与道德分离"论（legal positivism, Hart/Austin）判别】法律实证主义主张"法律的有效性不依赖于其道德性"——这是 L5 规范立场（法律应该与道德在概念上分离）。本推论是 L4 事实命题——它们在实际运行中互相替代、互相腐蚀——不管应该不应该。独有可证伪预测：法律制度的稳定性和执行成本【确实】依赖于道德系统的状态（TP×INT 配置）——C2 直接预测道德碎片化→执法成本飙升。法律实证主义不否认也不预测此关系——其主张在概念层（法律效力的来源），不在经验层（法律运行的稳定性条件）。

  【与"法律是道德的最低共识"论（Devlin/Hart 辩论的 Hart 侧）判别】Hart 主张法律只需最低限度的自然法内容——本推论不持此规范立场，但预测了此立场的一个经验后果：如果法律只覆盖"最低共识"（交叠区），那么交叠区的维持需要两端持续能量——"最低共识"不是一劳永逸的静止状态，是需要维护的动态平衡。本推论将此从哲学命题转化为可经验检验的维护成本命题。

  【防平凡化守卫】最危险的平凡化威胁："法律和道德有关系"——这是常识。本推论的增量不在"它们有关系"，而在：(a) 关系的方向是双向的（替代 + 腐蚀共四条路径，不是单向"法律替代道德"的现代化叙事）；(b) 五条动力学（T1/T2/C1/C2/O）由三个变量（规模/法律强度/TP×INT）的交互决定——可通过空格预测独立检验；(c) C1（法律挤出内化）和 C2（道德腐蚀法律）是反直觉的——常识认为"法律和道德互相加强"，本推论预测它们【也】互相削弱——且给出了削弱发生的条件（法律太强/道德太碎）。若读者将推论压缩为"法律和道德有关系"或"法律替代道德"→推论已被平凡化。

methodological_caveat: |
  【证据策略声明——机制分解而非单一案例闭环】

  本推论的 claim_type 为 bidirectional_dynamics（双向动力学）。五条动力学（T1/T2/C1/C2/O）的证据策略为"机制分解"：每条动力学分别用不同案例展示其运作机制，合起来构成完整的法律-道德双向动力学图景。

  (a) 当前无单一案例完整展示双向闭环（如在同一社会中观测到"法律增强→道德削弱 C1→道德削弱后法律执行成本上升→法律调整或弱化→道德填补 T2"的完整循环）。每个锚点展示的是五条动力学中的一条，且为单向效应：
  - 东德（1949-1990）：法律强制→内化空洞化→法律骤变后规范崩盘（C1，两阶段）
  - 日本（当代）：法律+道德交叠共存（O 格，状态表征）
  - 索马里（1991 后）：氏族内道德替代法律 T2 + 跨氏族碎片化 C2（不同层面同时运作）
  - 禁酒令（1920-1933）：道德碎片化→法律合法性受损→废除（C2）

  (b) "双向闭环"的可检验标准：在同一社会中纵向观测法律和道德配置的跨格迁移（如 G9 O 格 → G12 C1 风险格 → G13 TP-only 格 → 法律弱化崩盘后 → G6 T2 格），并证实迁移由本推论声称的机制驱动（而非混杂因素）。

  (c) 当前证据层级：锚点展示的是"机制在场的 directionally consistent 证据"，非"机制的排他性因果检验"。这是机制分解证据策略的上限，诚实标注。


