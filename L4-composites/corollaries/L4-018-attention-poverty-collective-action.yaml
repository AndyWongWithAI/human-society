id: L4-018
type: composite_deduction
layer: L4-composites
deduction_form: composite
status: verified
term: "注意力贫困：集体行动的数字屏障 (Attention Poverty: Digital Barrier to Collective Action)"

人话摘要: "人要被逼到墙角才会集体闹事——得同时满足三个条件：不公集中在看得见的一群人头上、这群人彼此能通气、没有合法渠道能翻盘。但穷人的注意力已经被生存焦虑和算法推送的消费诱惑占满了——他们连'跟同类通气'的脑力都不剩了。注意力贫困不是让人不愤怒——是让愤怒没有余力变成行动。"

statement: |
  【核心】DED-017确立集体行动的三个必要条件:集中感知的不公+群体内通信渠道+合法渠道缺失。DED-046确立注意力稀缺+算法消费推送→低收入群体陷入'注意力-消费恶性螺旋'(生存焦虑占满认知带宽→没有余力抵抗消费诱惑→财务恶化→更深的生存焦虑)。焊接后涌现:注意力贫困系统性瓦解了DED-017的三个条件中的第二个(通信渠道)——不是物理上不存在通信工具(人人有手机),而是认知上没有余力参与集体意义的通信(当你的大脑被'怎么付下个月房租'和'这个限时折扣不能错过'交替占据时,你无法同时参与'我们为什么不公平'的集体讨论)。这就是'被算法管住的愤怒'。

  【预测】(i)在低收入群体中,注意力贫困程度(以认知带宽占用量/财务压力指数/数字设备使用中'被动消费内容'vs'主动社交互动'的时间比衡量)与集体行动参与率负相关——控制了不公感知度和合法渠道可得性后仍显著;(ii)算法推送强度(以个性化推荐占比/通知频率衡量)与低收入群体的集体行动参与率负相关——算法推送每增加1σ,参与率下降Δ%——因为推送内容占据了本可用于'群体内通信'的注意力时段;(iii)在发生'注意力释放事件'(如大规模停电/平台宕机/节假日数字戒断)后的短暂时间窗口内,低收入群体的集体行动发起率显著高于基线——因为注意力暂时从算法推送中解放。

derivation:
  from_l2: {bridging: [BR-L2-013, BR-L2-027, BR-L2-029]}
  from_l3: {deductions: [DED-017, DED-046]}
  steps: |
    1. DED-017确立集体行动三条件框架:感知的不公集中性+群体间通信能力+合法渠道缺失。通信条件最容易被外部因素影响。
    2. DED-046确立注意力-消费恶性螺旋:低收入+注意力稀缺→被动消费内容(算法推送)→财务恶化→注意力更稀缺。此螺旋的副产品是'主动社交互动时段被压缩'——不是因为不想沟通,是因为认知带宽被占满。
    3. 焊接:DED-046的注意力螺旋直接攻击DED-017的通信条件。这不同于传统的'镇压/监控/审查'对通信的压制——注意力贫困是被动的、非意图的、市场驱动的。算法推送不是为了'阻止集体行动',但它的注意力占用效果等价于'使通信条件无法满足'。这是涌现——DED-017未讨论注意力约束(其通信条件假设'有通信工具即可'),DED-046未讨论集体行动(其被预测量是MPC/消费/财务健康)。
    4. 非平凡性:注意力约束作为'软性通信屏障'——与传统的强制通信屏障(审查/监控/逮捕)有完全不同的操作化特征和政策含义——是DED-017+DED-046焊接的特有产出。
    5. 继承链说明：DED-046 间接依赖 BR-L2-029(weakly_verified)——BR-L2-029 提供注意力稀缺的基础机制但自身验证强度仅为 weakly_verified（详见L2审查）。此弱前提通过 DED-046 传递至本推论，对本推论的置信度上限形成拖累：若 BR-L2-029 被后续证据削弱，本推论的注意力机制支柱将随之动摇。建议在实证检验时额外设计针对 BR-L2-029 的复验。
falsifiability: |
  (a) 注意力-参与负相关:在N≥500低收入个体的调查数据中，认知带宽占用量（以Mullainathan & Shafir风格的认知负荷量表，如LCT（Lack of Cognitive Bandwidth）量表，阈值设定为量表得分前30%为高贫困）与过去12个月的集体行动参与（抗议/请愿/罢工/社区组织活动，以自报+第三方验证（如组织记录）结合）呈负相关，控制不公感知度（以Perceived Injustice Scale，如PIS-4，得分标准化）、合法渠道可得性（以二元变量：是否存在正式申诉/选举渠道）、教育（年数）、年龄后偏相关仍显著(p<0.05)。控制变量集预先注册，不得事后添加。
  (b) 算法推送-参与负相关:手机屏幕时间中'算法推送内容'（被动推送：社交媒体feed自动刷新、短视频推荐、购物推荐、新闻推送；主动社交：私信、群聊、社群讨论、主动搜索）占比与集体行动参与率呈负相关(p<0.05)，而'主动社交'占比与参与率正相关。划分规则：被动推送定义为用户无主动请求情况下由平台算法推荐的内容消费（包括滚动浏览、自动播放）；主动社交定义为用户主动发起的交互（发送消息、发表评论、加入群组）。数据源优先使用手机屏幕时间metadata（通过授权获取），而非自报。若使用自报，需做社会期望偏差校正。
  (c) 注意力释放事件的自然实验:在大规模数字服务中断事件（>6小时，如区域性停电、平台宕机、政府断网）后72小时内，受影响区域的社会运动发起率（分子：经多个独立来源（新闻聚合、Google Trends关键词、Telegram公共频道）交叉验证的抗议/集会/罢工事件数；分母：该区域人口数（百万））显著高于事件前30日基线（配对检验p<0.05）。地理口径：以手机信号塔服务区（MNO数据）或用户IP段（平台数据）划分，优先使用信号塔服务区以保证空间粒度。若不可得，使用行政分区（县级）。边界案例：若中断同时切断了主动通信能力（如全面断网导致私信、群聊也无法使用），则观察到的参与率变化不可归因于'注意力解放'，而可能由通信渠道完全丧失导致参与率下降。因此本预测应限定于'只切断推送但保留主动通信能力'的事件（如推荐算法下线但私信/群聊仍可用），以确保注意力释放的效果被隔离。
  (d) 反向失败模式（对应红旗14）:若算法推送内容中'集体行动导向内容'（包含政治动员、抗议号召、组织信息等）占比也随推送强度↑，则推送可能促进而非抑制集体行动。需检验推送强度与集体行动导向内容占比的交互项对参与率的效应。若交互项显著为正（即推送强度增加时，参与率反而上升，且上升幅度随行动导向内容占比增大而增大），则本推论须被收窄到'非行动导向推送（如纯消费/娱乐内容）'的子集，且证伪条件(b)应限定于非行动导向推送占比高的子样本。
falsification_trace:
  primary_suspect: |
    1. 算法推送强度的内生性——主动社交互动低的个体可能被算法推送更多被动内容（因为系统检测到他们'只看不发'），导致算法推送强度与集体行动参与率的负相关是被个体的'社交被动性'这一第三变量同时驱动的。识别方案：使用外生冲击——平台算法更新（如2022年Instagram从照片流转向短视频推荐导致被动内容占比剧增）作为自然实验，或使用同一平台内不同用户群因地理位置/语言差异导致的推荐强度差异作为工具变量；也可采用倾向评分匹配，在控制社交被动性可观测指标（如发帖频率、私信数）后估计推送强度的因果效应。

    2. 反向失败模式（falsifiability(d)）——若算法推送内容中'集体行动导向内容'（包含政治动员、抗议号召、组织信息等）占比随推送强度增加而增加，则推送可能促进而非抑制集体行动。风险评估：若推送中行动导向内容占比超过阈值X（需在预注册中根据内容分析确定），推送可能促进而非抑制参与，本推论的预测(b)将失效，此时必须将射程收窄到'非行动导向推送'子集。
  secondary_suspect: "注意力贫困与集体行动缺失的因果归因——最脆弱环节是'注意力贫困是集体行动缺失的原因还是相关'：低收入群体的低集体行动参与可能由其他因素（教育/政治效能感/时间约束/恐惧镇压）驱动，注意力贫困只是共变而非原因。区分方案：在注意力释放事件（停电/宕机）的自然实验中，若受影响群体的集体行动率未显著上升，注意力约束作为独立因果因子的效力被削弱。"
nontriviality_test: |
  2×2(注意力贫困 高vs低 × 集体行动条件满足度 高vs低):
  格(高注意力贫困,条件满足)——「反例格」——若此格被填充(DED-017三条件都满足且注意力也贫困,但集体行动仍发生了),推论被削弱。消化路径:注意力贫困可能是'延迟'而非'阻止'集体行动——愤怒积累到临界点时'认知带宽约束'可能被突破。此路径将推论收窄为'注意力贫困提高集体行动的触发阈值'而非'阻止集体行动'。
  格(高注意力贫困,条件不满足)——「非平凡格」——DED-017单独说'条件不满足所以没行动'(平凡),但无法解释'为什么条件不满足'(传统解释:镇压/原子化/意识形态控制)。本推论的增量恰在'注意力贫困是条件不满足的具体原因'这一因果归因。DED-046提供了注意力机制但未用于解释集体行动缺失。两推论焊接后此格从'平凡'升级为'可操作化',因为注意力贫困是可独立测量的前件。

real_world_anchors:
  supporting:
    - anchor: "疫情期间的'数字戒断'与集体行动"
      evidence: "2020年COVID封锁期间,线下社交中断反而使大量个体从'数字消费常态'中脱嵌——通勤时间清零、办公室社交归零→释放了大量认知带宽。2020年夏季的全球抗议浪潮（Black Lives Matter/泰国民主运动/白俄罗斯抗议）在时间上与此'数字戒断窗口'重叠。该锚为时间相关性、非因果证明：上述三个案例仅展示时间关联，不构成因果证据，仅供示意（illustration only）。"
      confidence: weak
  counterexamples:
    - case: "2011年阿拉伯之春——社交媒体既推送内容也协调行动"
      evidence: "社交媒体在阿拉伯之春中同时充当了'算法推送消费内容'和'集体行动通信工具'双重角色。如果Facebook/Twitter的算法在推送猫视频的同时也被用于组织抗议,那注意力约束就不是绝对的——人们可以选择性地分配注意力。消化:关键在于'被动推送内容'vs'主动社群互动'的时间比——阿拉伯之春参与者可能具有较低的被动/主动比,而本推论的射程针对高被动/主动比群体。"
      status: consumed

emergence_demonstration:
  necessity: "两推论各自不含涌现产物的核心主张。DED-017 定义集体行动三条件，但未讨论注意力约束对通信条件的影响；DED-046 描述注意力-消费螺旋，但未将其后果链接到集体行动。焊接产物——注意力贫困作为'软性通信屏障'——不是任一推论单独可推导的。"
  novelty: "非父推论的 AND/OR 拼接。注意力贫困对通信条件的攻击是间接的、市场驱动的、非意图的——不同于传统强制通信屏障（审查/监控/逮捕）。这是 DED-017 的通信条件（假设物理可及性）与 DED-046 的认知带宽约束（假设注意力是稀缺资源）的焊接产物，结合 L1 概念化（信息必须依附物理载体且认知带宽有限）。"
  multi_parent_cell: "格（高注意力贫困，条件不满足）——DED-017 单独只能解释此格为'条件不满足所以没行动'（平凡），无法解释'为什么条件不满足'；DED-046 单独只能解释注意力贫困存在，无法解释其社会后果。两推论焊接后，此格从'平凡'升级为'可操作化'：注意力贫困是条件不满足的具体原因（认知带宽占用使群体内通信无法发生），且可独立测量（认知负荷量表、被动/主动时间比）。"

excluded_outcomes: |
  本推论明确针对同时满足（AND）以下三个条件的低收入亚群体：
  - 被动/主动时间比（算法推送消费时间 / 主动社交互动时间）高于群体中位数；
  - 注意力-消费螺旋已进入成熟阶段（即个体已形成稳定的被动消费习惯，可操作化为：每日被动内容消费时长>3小时且持续>6个月）；
  - 数字素养低（无法有效识别算法推荐机制、不主动使用屏蔽/订阅管理功能）。
  排除：高数字素养的主动型低收入群体（如学生、自由职业者、小商户），他们可能反向受益于算法社群（如通过微信群/Telegram组织行动），因此本推论不适用于此类群体。
review_summary: |
  1) r1 needs_revision -> r2 needs_revision -> r3 verified.
  2) 焊接真实涌现、口径诚实预注册、反向失败模式与弱前提均显式披露、反例猎捕无净杀——L4-018 达到 verified 标准；唯一残留(共同方法偏差 + 意义建构/纯协调集体行动区分)为 should 级,不构成 required。.
  3) 全档见 ADV-REVIEW-L4-018。
