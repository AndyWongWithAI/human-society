id: L4-018
type: composite_deduction
layer: L4-composites
deduction_form: composite
status: candidate
term: "注意力贫困：集体行动的数字屏障 (Attention Poverty: Digital Barrier to Collective Action)"

人话摘要: "人要被逼到墙角才会集体闹事——得同时满足三个条件：不公集中在看得见的一群人头上、这群人彼此能通气、没有合法渠道能翻盘。但穷人的注意力已经被生存焦虑和算法推送的消费诱惑占满了——他们连'跟同类通气'的脑力都不剩了。注意力贫困不是让人不愤怒——是让愤怒没有余力变成行动。"

statement: |
  【核心】DED-017确立集体行动的三个必要条件:集中感知的不公+群体内通信渠道+合法渠道缺失。DED-046确立注意力稀缺+算法消费推送→低收入群体陷入'注意力-消费恶性螺旋'(生存焦虑占满认知带宽→没有余力抵抗消费诱惑→财务恶化→更深的生存焦虑)。焊接后涌现:注意力贫困系统性瓦解了DED-017的三个条件中的第二个(通信渠道)——不是物理上不存在通信工具(人人有手机),而是认知上没有余力参与集体意义的通信(当你的大脑被'怎么付下个月房租'和'这个限时折扣不能错过'交替占据时,你无法同时参与'我们为什么不公平'的集体讨论)。这就是'被算法管住的愤怒'。

  【预测】(i)在低收入群体中,注意力贫困程度(以认知带宽占用量/财务压力指数/数字设备使用中'被动消费内容'vs'主动社交互动'的时间比衡量)与集体行动参与率负相关——控制了不公感知度和合法渠道可得性后仍显著;(ii)算法推送强度(以个性化推荐占比/通知频率衡量)与低收入群体的集体行动参与率负相关——算法推送每增加1σ,参与率下降Δ%——因为推送内容占据了本可用于'群体内通信'的注意力时段;(iii)在发生'注意力释放事件'(如大规模停电/平台宕机/节假日数字戒断)后的短暂时间窗口内,低收入群体的集体行动发起率显著高于基线——因为注意力暂时从算法推送中解放。

derivation:
  from_l2: {bridging: [BR-L2-013, BR-L2-027, BR-L2-029]}
  from_l3: {deductions: [DED-017, DED-046]}
  steps: |
    1. DED-017确立集体行动三条件框架:感知的不公集中性+群体间通信能力+合法渠道缺失。通信条件最容易被外部因素影响。
    2. DED-046确立注意力-消费恶性螺旋:低收入+注意力稀缺→被动消费内容(算法推送)→财务恶化→注意力更稀缺。此螺旋的副产品是'主动社交互动时段被压缩'——不是因为不想沟通,是因为认知带宽被占满。
    3. 焊接:DED-046的注意力螺旋直接攻击DED-017的通信条件。这不同于传统的'镇压/监控/审查'对通信的压制——注意力贫困是被动的、非意图的、市场驱动的。算法推送不是为了'阻止集体行动',但它的注意力占用效果等价于'使通信条件无法满足'。这是涌现——DED-017未讨论注意力约束(其通信条件假设'有通信工具即可'),DED-046未讨论集体行动(其被预测量是MPC/消费/财务健康)。
    4. 非平凡性:注意力约束作为'软性通信屏障'——与传统的强制通信屏障(审查/监控/逮捕)有完全不同的操作化特征和政策含义——是DED-017+DED-046焊接的特有产出。

falsifiability: |
  (a) 注意力-参与负相关:在N≥500低收入个体的调查数据中,认知带宽占用量(以Mullainathan & Shafir风格的认知负荷量表衡量)与过去12个月的集体行动参与(抗议/请愿/罢工/社区组织活动)呈负相关,控制不公感知度/合法渠道可得性/教育/年龄后偏相关仍显著(p<0.05)。
  (b) 算法推送-参与负相关:手机屏幕时间中'算法推送内容'(社交媒体feed/短视频推荐/购物推荐)占比与集体行动参与率呈负相关(p<0.05),而'主动社交'(私信/群聊/社群讨论)占比与参与率正相关。关键区分在'被动接收'vs'主动互动'。
  (c) 注意力释放事件的自然实验:在大规模数字服务中断事件(>6小时)后72小时内,受影响区域的社会运动发起率(Twitter/Google Trends/新闻报道中的抗议/集会事件数)显著高于事件前30日基线(配对检验p<0.05)。

falsification_trace:
  primary_suspect: "注意力贫困与集体行动缺失的因果归因——最脆弱环节是'注意力贫困是集体行动缺失的原因还是相关':低收入群体的低集体行动参与可能由其他因素(教育/政治效能感/时间约束/恐惧镇压)驱动,注意力贫困只是共变而非原因。区分方案:在注意力释放事件(停电/宕机)的自然实验中,若受影响群体的集体行动率未显著上升,注意力约束作为独立因果因子的效力被削弱。"
  secondary_suspect: "算法推送强度的内生性——主动社交互动低的个体可能被算法推送更多被动内容(因为系统检测到他们'只看不发'),导致算法推送强度与集体行动参与率的负相关是被个体的'社交被动性'这一第三变量同时驱动的。"
nontriviality_test: |
  2×2(注意力贫困 高vs低 × 集体行动条件满足度 高vs低):
  格(高注意力贫困,条件满足)——「反例格」——若此格被填充(DED-017三条件都满足且注意力也贫困,但集体行动仍发生了),推论被削弱。消化路径:注意力贫困可能是'延迟'而非'阻止'集体行动——愤怒积累到临界点时'认知带宽约束'可能被突破。此路径将推论收窄为'注意力贫困提高集体行动的触发阈值'而非'阻止集体行动'。
  格(高注意力贫困,条件不满足)——「非平凡格」——DED-017单独说'条件不满足所以没行动'(平凡),但无法解释'为什么条件不满足'(传统解释:镇压/原子化/意识形态控制)。本推论的增量恰在'注意力贫困是条件不满足的具体原因'这一因果归因。DED-046提供了注意力机制但未用于解释集体行动缺失。两推论焊接后此格从'平凡'升级为'可操作化',因为注意力贫困是可独立测量的前件。

real_world_anchors:
  supporting:
    - anchor: "疫情期间的'数字戒断'与集体行动"
      evidence: "2020年COVID封锁期间,线下社交中断反而使大量个体从'数字消费常态'中脱嵌——通勤时间清零、办公室社交归零→释放了大量认知带宽。2020年夏季的全球抗议浪潮(Black Lives Matter/泰国民主运动/白俄罗斯抗议)在时间上与此'数字戒断窗口'重叠。方向性证据——不构成因果证明但与前件方向一致。"
      confidence: weak
  counterexamples:
    - case: "2011年阿拉伯之春——社交媒体既推送内容也协调行动"
      evidence: "社交媒体在阿拉伯之春中同时充当了'算法推送消费内容'和'集体行动通信工具'双重角色。如果Facebook/Twitter的算法在推送猫视频的同时也被用于组织抗议,那注意力约束就不是绝对的——人们可以选择性地分配注意力。消化:关键在于'被动推送内容'vs'主动社群互动'的时间比——阿拉伯之春参与者可能具有较低的被动/主动比,而本推论的射程针对高被动/主动比群体。"
      status: consumed

emergence_demonstration:
  necessity: "两推论各自不含涌现产物的核心主张。DED-028预测SOV-MOE窗口存在但不预测窗口长度变异。DED-038预测制度信任→SOV逃离加速但不涉及MOE崩塌时序。窗口长度=f(r_trust)的函数形式需要两推论焊接——任一推论单独无法给出此函数。"
  novelty: "非父推论的AND/OR拼接。窗口作为制度信任状态的函数(而非静态经验值)是焊接产物——DED-028给出窗口的概念(存在性),DED-038给出窗口的驱动量(信任衰减速率),焊接给出窗口的预测函数(窗口长度随r_trust单调递减)。"
  multi_parent_cell: "格(快衰减,短窗口)需要DED-028+DED-038合力——DED-028单独不区分长短(只预测窗口存在),DED-038单独不涉及MOE时序(只预测SOV逃离)。两推论焊接后此格从'可能填充'变为'必然填充且可定量预测'。"
