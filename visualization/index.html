<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人类社会公理体系 · 知识图谱</title>
<style>
:root {
  --bg: #f8f9fa;
  --surface: #ffffff;
  --border: #e2e8f0;
  --text: #1a202c;
  --text2: #718096;
  --primary: #5B8FF9;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== Color tokens per type ===== */
.type-colors {
  --c-physical_constraint: #5B8FF9;
  --c-concept: #5AD8A6;
  --c-definitional_axiom: #F6BD16;
  --c-theorem: #9270CA;
  --c-bridging_proposition: #5D9CEC;
  --c-deduction: #F08080;
  --c-composite_deduction: #E8684A;
}

/* ===== Top Bar ===== */
.top-bar {
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  flex-shrink: 0;
  z-index: 10;
}
.top-bar h1 { font-size: 15px; font-weight: 700; white-space: nowrap; }
.top-bar .search-wrap { flex: 1; max-width: 360px; position: relative; }
.top-bar .search-wrap input {
  width: 100%; height: 32px; padding: 0 12px 0 32px;
  border: 1px solid var(--border); border-radius: 6px;
  font-size: 13px; outline: none; font-family: inherit;
}
.top-bar .search-wrap input:focus { border-color: var(--primary); }
.top-bar .search-wrap .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text2); font-size: 13px; }
.top-bar .stats { font-size: 12px; color: var(--text2); white-space: nowrap; }

/* ===== Main Layout ===== */
.main-layout { display: flex; flex: 1; overflow: hidden; }

/* ===== Left Sidebar ===== */
.sidebar {
  width: 280px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}

.layer-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.layer-tab {
  flex: 1; padding: 10px 4px; text-align: center; font-size: 11px; font-weight: 600;
  cursor: pointer; color: var(--text2); border-bottom: 2px solid transparent;
  transition: all 0.15s; background: none; border-top: none; border-left: none; border-right: none;
  font-family: inherit;
}
.layer-tab:hover { color: var(--text); background: #f7fafc; }
.layer-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.layer-tab .count { font-size: 10px; font-weight: 400; opacity: 0.7; }

.entity-list { flex: 1; overflow-y: auto; padding: 0; }
.entity-item {
  padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f0f0f5;
  transition: background 0.1s; display: flex; align-items: flex-start; gap: 8px;
}
.entity-item:hover { background: #f7fafc; }
.entity-item.active { background: #eef2ff; border-left: 3px solid var(--primary); padding-left: 11px; }
.entity-item .dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px;
}
.entity-item .info { flex: 1; min-width: 0; }
.entity-item .info .name { font-size: 13px; font-weight: 600; line-height: 1.4; }
.entity-item .info .id-line { font-size: 11px; color: var(--text2); margin-top: 2px; }
.entity-item .info .excerpt { font-size: 11px; color: var(--text2); margin-top: 3px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-left: 4px; vertical-align: middle; }
.status-dot.verified, .status-dot.verified\* { background: #48BB78; }
.status-dot.weakly_verified { background: #ECC94B; }
.status-dot.candidate, .status-dot.rejected { background: #A0AEC0; }

/* ===== Right Detail ===== */
.detail {
  flex: 1; overflow-y: auto; padding: 24px 32px;
}
.detail-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: var(--text2); font-size: 14px; text-align: center;
}
.detail-empty .icon { font-size: 40px; margin-bottom: 12px; opacity: 0.3; }

/* Breadcrumb */
.breadcrumb { font-size: 12px; color: var(--text2); margin-bottom: 16px; }
.breadcrumb span { color: var(--primary); }

/* Entity header */
.entity-header { margin-bottom: 20px; }
.entity-header h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.entity-header .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--text2); }
.entity-header .meta .badge {
  display: inline-block; padding: 2px 10px; border-radius: 10px;
  font-size: 11px; font-weight: 600; color: #fff;
}
.entity-header .meta .status-tag {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 600;
}
.status-tag.verified, .status-tag.verified\* { background: #C6F6D5; color: #22543D; }
.status-tag.weakly_verified { background: #FEFCBF; color: #744210; }
.status-tag.candidate { background: #E2E8F0; color: #4A5568; }
.status-tag.rejected { background: #FED7D7; color: #822727; }

/* Cards */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 20px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.card h3 { font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.card .renhua {
  font-size: 15px; line-height: 1.8; padding: 12px 16px;
  background: #fffbeb; border-left: 3px solid #F6BD16;
  border-radius: 0 6px 6px 0; margin-top: 4px;
}
.card .statement {
  font-size: 13px; line-height: 1.7; color: var(--text2);
  white-space: pre-wrap; max-height: 240px; overflow: hidden;
  position: relative;
}
.card .statement.open { max-height: none; }
.card .expand-btn {
  display: inline-block; font-size: 12px; color: var(--primary); cursor: pointer;
  margin-top: 8px; background: none; border: none; padding: 0; font-family: inherit;
}
.domain-tag {
  display: inline-block; padding: 1px 8px; border-radius: 10px;
  font-size: 11px; background: #EDF2F7; color: var(--text2); margin: 2px;
}

/* Dep links */
.dep-section { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.dep-section.full { grid-template-columns: 1fr; }
.dep-column h4 { font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.dep-column h4 .cnt { font-size: 11px; font-weight: 400; color: var(--text2); }
.dep-link {
  display: flex; align-items: flex-start; gap: 8px; padding: 10px 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  margin-bottom: 6px; cursor: pointer; transition: all 0.15s;
}
.dep-link:hover { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.dep-link .mini-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px;
}
.dep-link .dep-info { flex: 1; min-width: 0; }
.dep-link .dep-info .dep-name { font-size: 13px; font-weight: 600; }
.dep-link .dep-info .dep-id { font-size: 11px; color: var(--text2); }
.dep-link .dep-info .dep-rel { font-size: 10px; color: var(--text2); margin-top: 1px; }
.dep-link .dep-info .dep-excerpt { font-size: 11px; color: var(--text2); margin-top: 3px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dep-link .arrow { color: var(--text2); font-size: 12px; flex-shrink: 0; margin-top: 2px; }

.search-highlight { background: #FEFCBF; padding: 0 2px; border-radius: 2px; }

.empty-hint { font-size: 12px; color: var(--text2); padding: 12px; text-align: center; }

@media (max-width: 768px) {
  .sidebar { width: 220px; }
  .dep-section { grid-template-columns: 1fr; }
  .detail { padding: 16px; }
}
</style>
</head>
<body>

<div class="top-bar">
  <h1>🔬 人类社会公理体系</h1>
  <div class="search-wrap">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索 ID / 术语 / 摘要..." />
  </div>
  <div class="stats" id="stats"></div>
</div>

<div class="main-layout">
  <!-- Left Sidebar -->
  <div class="sidebar">
    <div class="layer-tabs" id="layerTabs"></div>
    <div class="entity-list" id="entityList"></div>
  </div>

  <!-- Right Detail -->
  <div class="detail" id="detail">
    <div class="detail-empty" id="detailEmpty">
      <div class="icon">📋</div>
      <div>选择左侧实体查看详情</div>
      <div style="font-size:12px;margin-top:4px;color:var(--text2)">包含上游依赖和下游延伸关系</div>
    </div>
    <div id="detailContent" style="display:none"></div>
  </div>
</div>

<script src="graph-data.js"></script>
<script>
// ===== Data =====
const data = window.GRAPH_DATA;
const nodes = data.nodes;
const edges = data.edges;

// Build lookup maps
const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);

const downstreamMap = {}; // node id -> list of nodes that depend on it
const upstreamMap = {};   // node id -> list of nodes it depends on
nodes.forEach(n => { downstreamMap[n.id] = []; upstreamMap[n.id] = []; });
edges.forEach(e => {
  if (downstreamMap[e.target]) downstreamMap[e.target].push({ id: e.source, relation: e.relation_label });
  if (upstreamMap[e.source]) upstreamMap[e.source].push({ id: e.target, relation: e.relation_label });
});

// ===== Type config =====
const TYPE_COLORS = {
  physical_constraint: "#5B8FF9",
  concept: "#5AD8A6",
  definitional_axiom: "#F6BD16",
  theorem: "#9270CA",
  bridging_proposition: "#5D9CEC",
  deduction: "#F08080",
  composite_deduction: "#E8684A",
};
const TYPE_LABELS = {
  physical_constraint: "物理约束",
  concept: "概念",
  definitional_axiom: "公理",
  theorem: "定理",
  bridging_proposition: "桥接命题",
  deduction: "推论",
  composite_deduction: "复合推论",
};
const LAYER_ORDER = ["L0","L1","L2","L3","L4"];
const LAYER_LABELS = { L0:"物理约束", L1:"定义", L2:"桥接", L3:"推论", L4:"复合" };
const STATUS_LABELS = {
  verified: "已验证", "verified*": "已验证*", weakly_verified: "弱验证",
  candidate: "候选", rejected: "已驳回",
};

// ===== State =====
let activeLayer = "L0";
let activeNodeId = null;
let searchQuery = "";

// ===== Init =====
function init() {
  document.getElementById("stats").textContent = `实体 ${nodes.length} · 关系 ${edges.length}`;
  buildLayerTabs();
  switchLayer("L0");
  document.getElementById("searchInput").addEventListener("input", debounce(handleSearch, 250));
}

function buildLayerTabs() {
  const container = document.getElementById("layerTabs");
  const counts = {};
  nodes.forEach(n => counts[n.layer] = (counts[n.layer]||0) + 1);
  LAYER_ORDER.forEach(layer => {
    if (!counts[layer]) return;
    const btn = document.createElement("button");
    btn.className = "layer-tab";
    btn.innerHTML = `${LAYER_LABELS[layer]} <span class="count">${counts[layer]}</span>`;
    btn.onclick = () => switchLayer(layer);
    btn.dataset.layer = layer;
    container.appendChild(btn);
  });
}

function switchLayer(layer) {
  activeLayer = layer;
  activeNodeId = null;
  document.querySelectorAll(".layer-tab").forEach(b => b.classList.toggle("active", b.dataset.layer === layer));
  renderEntityList();
  showEmptyDetail();
}

// ===== Entity List =====
function renderEntityList() {
  const container = document.getElementById("entityList");
  const query = searchQuery.toLowerCase();
  let filtered = nodes.filter(n => {
    if (query) {
      return (n.id.toLowerCase().includes(query) ||
              (n.term||"").toLowerCase().includes(query) ||
              (n.term_zh||"").toLowerCase().includes(query) ||
              (n["人话摘要"]||"").toLowerCase().includes(query));
    }
    return n.layer === activeLayer;
  });

  // If searching, group by layer
  if (query) {
    container.innerHTML = "";
    const byLayer = {};
    filtered.forEach(n => {
      if (!byLayer[n.layer]) byLayer[n.layer] = [];
      byLayer[n.layer].push(n);
    });
    LAYER_ORDER.forEach(layer => {
      if (!byLayer[layer] || byLayer[layer].length === 0) return;
      const header = document.createElement("div");
      header.style.cssText = "padding:8px 14px;font-size:11px;font-weight:700;color:var(--text2);background:#f7fafc;border-bottom:1px solid var(--border);";
      header.textContent = `${LAYER_LABELS[layer]} (${byLayer[layer].length})`;
      container.appendChild(header);
      byLayer[layer].forEach(n => container.appendChild(createEntityItem(n)));
    });
  } else {
    container.innerHTML = "";
    filtered.forEach(n => container.appendChild(createEntityItem(n)));
  }

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-hint">无匹配结果</div>';
  }
}

function createEntityItem(n) {
  const div = document.createElement("div");
  div.className = "entity-item" + (n.id === activeNodeId ? " active" : "");
  div.innerHTML = `
    <span class="dot" style="background:${TYPE_COLORS[n.type]||'#999'}"></span>
    <div class="info">
      <div class="name">${highlightMatch(n.term_zh || n.term)}</div>
      <div class="id-line">${n.id} · ${TYPE_LABELS[n.type]||n.type}${n.status ? ' <span class="status-dot '+n.status.replace('*','\\*')+'"></span> '+STATUS_LABELS[n.status] : ''}</div>
      ${n["人话摘要"] ? `<div class="excerpt">${highlightMatch(n["人话摘要"])}</div>` : ""}
    </div>`;
  div.onclick = () => selectNode(n.id);
  return div;
}

function highlightMatch(text) {
  if (!searchQuery || !text) return text;
  const q = searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${q})`, 'gi'), '<span class="search-highlight">$1</span>');
}

// ===== Detail Panel =====
function selectNode(id) {
  activeNodeId = id;
  const n = nodeMap[id];
  if (!n) return;

  document.getElementById("detailEmpty").style.display = "none";
  document.getElementById("detailContent").style.display = "block";
  document.getElementById("entityList").querySelectorAll(".entity-item").forEach(
    el => el.classList.toggle("active", false)
  );
  // Find and highlight the active item
  const items = document.getElementById("entityList").querySelectorAll(".entity-item");
  items.forEach(el => {
    // Match by looking at the onclick or content
  });
  // Re-render list to update active state
  renderEntityList();
  document.getElementById("detail").scrollTop = 0;

  const deps = upstreamMap[id] || [];
  const dependents = downstreamMap[id] || [];
  const statusClass = (n.status||"").replace("*","\\*");
  const domainTags = (n.domain||[]).map(t => `<span class="domain-tag">${t}</span>`).join("");

  const statementText = n.statement || "";
  const isLong = statementText.length > 300;
  const hasRenhua = n["人话摘要"] && n["人话摘要"].trim();
  const hasStatement = statementText.length > 0;
  const hasDeps = deps.length > 0;
  const hasDependents = dependents.length > 0;

  let html = `
    <div class="breadcrumb">${LAYER_LABELS[n.layer]} <span>›</span> ${n.id}</div>
    <div class="entity-header">
      <h2>${n.term_zh || n.term}</h2>
      ${n.term !== (n.term_zh||n.term) ? `<div style="font-size:12px;color:var(--text2);margin-bottom:4px">${n.term}</div>` : ""}
      <div class="meta">
        <span>ID: <strong>${n.id}</strong></span>
        <span class="badge" style="background:${TYPE_COLORS[n.type]}">${TYPE_LABELS[n.type]||n.type}</span>
        <span>${LAYER_LABELS[n.layer]}</span>
        ${n.status ? `<span class="status-tag ${statusClass}">${STATUS_LABELS[n.status]||n.status}</span>` : ""}
      </div>
      ${domainTags ? `<div style="margin-top:6px">${domainTags}</div>` : ""}
    </div>`;

  // 人话摘要
  if (hasRenhua) {
    html += `<div class="card"><h3>📖 人话摘要</h3><div class="renhua">${escapeHtml(n["人话摘要"])}</div></div>`;
  }

  // 完整陈述
  if (hasStatement) {
    html += `<div class="card">
      <h3>📝 完整陈述</h3>
      <div class="statement${isLong ? '' : ' open'}" id="stmtText">${escapeHtml(isLong ? statementText.slice(0,300)+'…' : statementText)}</div>
      <div id="stmtFull" style="display:none;font-size:13px;line-height:1.7;color:var(--text2);white-space:pre-wrap">${escapeHtml(statementText)}</div>
      ${isLong ? '<button class="expand-btn" id="expandBtn" onclick="toggleStatement()">展开全文 ▾</button>' : ""}
    </div>`;
  }

  // 依赖关系
  if (hasDeps || hasDependents) {
    html += `<div class="dep-section${(!hasDeps || !hasDependents) ? ' full' : ''}">`;
    if (hasDeps) {
      html += `<div class="dep-column"><h4>⬆️ 上游依赖 <span class="cnt">(${deps.length})</span></h4>`;
      deps.forEach(e => html += renderDepLink(e, "up"));
      html += `</div>`;
    }
    if (hasDependents) {
      html += `<div class="dep-column"><h4>⬇️ 下游延伸 <span class="cnt">(${dependents.length})</span></h4>`;
      dependents.forEach(e => html += renderDepLink(e, "down"));
      html += `</div>`;
    }
    html += `</div>`;
  } else {
    html += `<div class="card"><h3>🔗 依赖关系</h3><div class="empty-hint">此节点无上下游关系</div></div>`;
  }

  document.getElementById("detailContent").innerHTML = html;
}

function renderDepLink(e, dir) {
  const n = nodeMap[e.id];
  if (!n) return "";
  const arrow = dir === "up" ? "→" : "←";
  return `
    <div class="dep-link" onclick="event.stopPropagation(); selectNode('${n.id}')">
      <span class="mini-dot" style="background:${TYPE_COLORS[n.type]||'#999'}"></span>
      <div class="dep-info">
        <div class="dep-name">${n.term_zh || n.term}</div>
        <div class="dep-id">${n.id} · ${TYPE_LABELS[n.type]||n.type} · ${LAYER_LABELS[n.layer]}</div>
        <div class="dep-rel">${arrow} ${e.relation}</div>
        ${n["人话摘要"] ? `<div class="dep-excerpt">${n["人话摘要"]}</div>` : ""}
      </div>
    </div>`;
}

function showEmptyDetail() {
  document.getElementById("detailEmpty").style.display = "flex";
  document.getElementById("detailContent").style.display = "none";
}

// ===== Statement toggle =====
function toggleStatement() {
  const short = document.getElementById("stmtText");
  const full = document.getElementById("stmtFull");
  const btn = document.getElementById("expandBtn");
  if (full.style.display === "none") {
    short.style.display = "none";
    full.style.display = "block";
    btn.textContent = "收起 ▲";
  } else {
    short.style.display = "block";
    full.style.display = "none";
    btn.textContent = "展开全文 ▾";
  }
}

// ===== Search =====
function handleSearch() {
  searchQuery = document.getElementById("searchInput").value.trim();
  if (searchQuery) {
    // Search across all layers
    document.querySelectorAll(".layer-tab").forEach(b => b.classList.remove("active"));
  } else {
    document.querySelectorAll(".layer-tab").forEach(b => b.classList.toggle("active", b.dataset.layer === activeLayer));
  }
  renderEntityList();
}

// ===== Utils =====
function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
