        IEA 尚未执行,范畴错层问题暂不适用。但审前预判:cognitive_science 和
        behavioral_economics 在"稀缺-认知"这一具体主题上的独立性可能低于 default
        0.6——两条来源共享核心认知架构假设和实验方法论,类似于 BR-L2-031 的
        锚源-组织心理学重叠问题。正式 IEA 调查时应特别审视此对来源的独立系数。

round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（稀缺→认知带宽缩减→次要目标被压制）的方向性是有经验支撑的（Mani et al. 2013 的甘蔗农民实验、Shah/Friedman/Kruglanski 2002 的目标屏蔽范式），没有被净杀的反例。但 verified 三门都还差一口气：(1) "目标屏蔽"与"带宽缩减"被作者自称"串行组合"，但机制层级在文献里其实是**两套独立可分离的发现**——一个是注意/动机层面的目标竞争（Shah 系），一个是一般流体认知层面的带宽挤占（Mullainathan/Shafir、Mani 系）——把两者焊成"串行组合"既无机制证据也无独立预测，只是把两篇文献绑在一起冒充新机制。这是红旗 1（brick=conclusion）和红旗 8（条件是下定义还是做预测）的混合病灶。(2) 证伪条件 (a) 与 (b) 都是单变量检验，但作者声称"两种预测必须同时检验以区分机制"——这在逻辑上要求的是一个 2×2 设计（四组：诱导稀缺且目标相关任务 vs 诱导稀缺且目标无关任务 vs 控制组目标相关 vs 控制组目标无关），可证伪条件里没有这一格的具体预测值，注册的是单变量边界，不足以拆开"目标屏蔽"和"带宽缩减"的独立贡献。这是红旗 3（测量轴正交）的死穴。(3) IEA 自评 1.8 恰好压线，且两个来源独立性系数是作者自己填的 0.5（"共享认知架构假设且实验方法同源"），按这逻辑再扣一点就是 0.3 以下；更重要的是作者承认"建议未来增加第三个独立来源"——这等于自证当前未达标。(4) 跨文化可证伪性条件 (e) 措辞"不成立"过于宽松，"未观察到次要目标抑制"是一个统计零结果条件，跨文化零结果几乎永远无法"成立"，本质上是一个弱条件而不是强证伪。这是红旗 7（现实锚事实核查）的潜在延伸问题。反例猎捕：构造了两个潜在净杀案例（彩票暴富户的长期规划行为、斯堪的纳维亚高福利国家低收入者的目标多样性），均被"目标排序预设差异"消化，未构成净杀；但揭出过度伸张——作者把"次要目标被压制"作为默认结局，没给"稀缺者主动放下次要目标（理性再分配）"留出机制位置。下面逐条给红旗。
  red_flags: |
    1. brick=conclusion — 部分命中。"稀缺→带宽缩减"来自 Mullainathan/Shafir，"激活主导目标→抑制竞争目标"来自 Shah/Friedman/Kruglanski。把两者声明为"串行组合"在两个源头文献里都不是这个连法——这是作者在桥接砖层面做的合成。合成本身不一定是砖=结论，但本桥接砖的"串行组合"声明没有独立机制证据（无任何引用支持"先带宽缩减、再目标屏蔽"或反过来的时序），只是叙事性焊接。这条没到"砖专为推论窄化"那么死，但属于"机制夸大"。
    2. 逐格判空 — 命中。声称"在实验室中……次要目标任务表现显著差于控制组，同时自我报告对长期目标的关注度下降"——这是稀缺文献里已经被反复验证的老格，不是本推论的新格。"主导目标相关任务的表现应保持或增强"才是本推论的真正新预测（区别于纯带宽缩减说的"所有任务一起降"）。但这条新格在可证伪条件 (a) 里只给出了方向（"未显著优于控制组，或显著更差"），没说效应量应该多大、保持多强，所以"保持或增强"是软承诺。
    3. 测量轴正交 — 命中，且较重。"主导目标"和"次要目标"的区分在实验里靠的是预注册的目标排序自评（好），但"带宽缩减"和"目标屏蔽"的机制拆分在证伪条件里没有对应到独立的测量轴——条件 (a) 测的是目标相关任务，条件 (b) 测的是所有认知任务（包括无关任务），可两者的"主导"和"带宽"在文献里恰恰不能用一个"目标相关 vs 无关"的二分干净分开。要真的拆开两套机制，需要的是"诱导稀缺 × 任务相关性 × 目标预注册激活 vs 未激活"的 3 因素或至少 2×2 设计，本推论的证伪条件没有这种正交性。可证伪 (c) "机制混淆"只是兜底的话术，没有给出能区分两机制的预测值。
    4. 射程/排除钩子独立于结果 — 未命中。证伪条件 (d) 排除钩子用了"该效应不能由目标排序的预设差异解释"——这是事前注册的钩子，方向正确，没问题。但 (e) 用"不成立"作为跨文化证伪条件太松（见 7）。
    5. 分类判据档位匹配 — 未命中。推论没有显式分档。
    6. anti-talisman 真兑现 — 部分命中。"紧迫目标的识别必须独立于后续行为"通过预注册自评做到了，anti-talisman 是真的。但驱动量（稀缺诱导的操作化）在两套来源里用的是不同操纵（时间压力 vs 金钱稀缺 vs 农田收成节律），没有统一锚定，"带宽"和"目标屏蔽"各自的承重锚没有真的被独立测量过——它们是文献里分别被测的，作者只引用了源头测量。
    7. 现实锚事实核查 — 命中较重。Mani et al. (2013) 的甘蔗农民实验是真实存在的（Science, 339, 976-980），且效应方向正确。但该实验测的是一般流体认知（IQ 类测试、Raven 等），不直接测"目标屏蔽"。作者把它当作"带宽缩减"的承重锚 OK，但当作"目标屏蔽"的承重锚就是溢出。Mullainathan & Shafir (2013) 的《稀缺》是科普书+论文集，不是单篇可证伪锚。Shah et al. (2002) 的目标屏蔽范式是真实的，但与"资源稀缺"的操作化不同（他们用的是目标激活词启动），把两者连起来是叙事。
    8. 条件是下定义还是做预测 — 命中。"此组合机制在短期内有适应价值，但代价是长期目标被系统性忽略"——"系统性忽略"是一个相当强的预测。但可证伪条件里没有给"系统性"的量化阈值（多少比例、效应量下限），"被系统性忽略"在测量上如何与"被理性再分配"区分？这是条件偏定义。
    9. 枚举穷尽 — 未命中。推论未声称 N 类枚举。
    10. primary_suspect 指对 + 平凡化检查 — 命中。文件没明确指出"primary suspect"。我指认：真正的最致命软肋是"串行组合"声明——它是本推论的卖点（区别于纯 Mullainathan/Shafir 文献的"带宽税"），但没有任何机制证据。如果把"串行组合"降级为"两者并存"，本桥接砖就基本等价于 BR-L2-027（注意力稀缺与信息过载）+ Mullainathan/Shafir 文献综述，失去独立存在价值。这是被泛化稀释成相邻理论常识的风险。
    11. 口径完整注册 + 歧义反向裁决 — 部分命中。预注册的目标排序自评是注册了，但"主导目标""次要目标"在实验里如何操作化（多少个目标？多长时间窗口内的偏好？）没有注册。"稀缺诱导"在两套来源里操作化完全不同，也没有统一口径。
    12. 数据源同根冒充多源独立 — 命中。两个声称来源（cognitive_science 与 behavioral_economics）作者自评独立性 0.5，理由是"共享认知架构假设且实验方法同源"。这正是同根风险的典型——Shah 系和 Mullainathan/Shafir 系在文献网络里通过共同作者、共同会议、共同综述相互引用，独立性再扣一档到 0.3 是合理的。加权总强度 1.8 是压线达标，自评有点松。
    13. API 可及性冒充认识论独立性 — 未命中。IEA 调查是文献引用，没有 API 滥用问题。
    14. 反向失败模式缺失 — 命中。推论注册了"怎么被证伪"（带宽缩减不成立、目标屏蔽不成立等），但没注册"反向失败模式"。可能的反向失败是"稀缺者反而更系统地规划长期目标"——这在彩票中奖者、债务减免研究里都有迹象（突然有钱反而开始存钱/规划），以及"稀缺通过强迫排序反而提高了目标清晰度"（Anandi Mani 等人后续研究里有讨论）。作者没注册这个反向模式，应当 should 级标注。
    15. Bootstrap 限定缺失 — 未命中。本桥接砖是实验室+田野证据，不涉及冷启动问题。
    16. 验证对象存在性未标注 — 未命中。验证对象（实验室稀缺诱导）是可观测的常态实验范式，不存在空集问题。
  counterexample_hunt: |
    构造了两个候选反例，都没净杀，但揭出过度伸张。

    候选 1（潜在净杀 → 被消化）：**彩票中奖者的长期规划行为**。Kearney et al. (2021, Management Science) 等多个研究发现，马萨诸塞州彩票中奖者在收到 5–10 万美元级别奖金后，**长期资产（金融资产、住房自有率）显著上升，而非下降**。如果按 BR-L2-035 的字面预测，"稀缺"突然消失应该让"长期目标被系统性忽略"反弹回来——实际上看到的恰恰相反：长期目标突然被投资。消化机制：彩票中奖属于"资源从稀缺到非稀缺的瞬时跳变"，触发的是"现在有本钱了反而敢做长期规划"，不是"稀缺屏蔽目标"的反向。这是定义边界问题，不是净杀。但揭出过度伸张：本推论暗示"稀缺→目标屏蔽"是一种稳态关系，没有为"稀缺解除后的反弹效应"留位置。

    候选 2（潜在净杀 → 被消化）：**斯堪的纳维亚高福利国家的低收入家庭**。挪威、丹麦等国的低收入家庭在强福利兜底下，"稀缺"被制度性削弱（医疗、教育、养老都兜底），按 BR-L2-035 的预测，长期目标（教育、健康投资）应该显著好于美国同类收入组。实证看确实如此（OECD 数据），但这同样被"目标排序预设差异"消化——这些家庭的目标结构本身就因制度不同被重塑了，不是 BR-L2-035 的反例。

    净杀候选 3（构造但放弃）：**冥想/正念训练后的稀缺者**——若稀缺者经过认知训练后反而比非稀缺者在次要目标上表现更好，这能证伪"屏蔽是必然串行"。文献不足，未能落地为可证伪锚。

    反例猎捕结论：未找到 scope 内的活净杀，但揭出**过度伸张**——(i) "稀缺→系统性忽略长期目标"作为稳态预测没给"稀缺解除后的反弹"留位置；(ii) "次要目标被压制"是默认结局，没给"稀缺者主动理性再分配"留机制空间。两条都标记 should-级要求作者说明边界。
  required_fixes:
    - "1) 把\"串行组合\"声明降级或给出时序机制证据：要么提供\"先带宽缩减、再目标屏蔽\"或反之的实验证据，要么删除\"串行\"二字改为\"并行共存\"，承认本桥接砖是叙事性合成而非机制性发现。"
    - "2) 在证伪条件里增加一个 2×2（稀缺诱导 × 任务与预注册目标的相关性）设计的具体预测值：主导目标相关任务 vs 无关任务 × 稀缺诱导 vs 控制，四格的预期方向与效应量下限必须注册，否则\"带宽\"和\"目标屏蔽\"两套机制无法被独立证伪。"
    - "3) \"系统性忽略长期目标\"必须给出可证伪的操作化：要么指定效应量阈值（如同类长期投资行为低于控制组多少 SD），要么改为弱承诺（\"削弱\"而非\"系统性忽略\"），并注册\"被理性再分配\"作为竞争解释的判别条件。"
    - "4) IEA 自评需重做：作者自评 cognitive_science 与 behavioral_economics 独立性 0.5 偏高，按\"共享认知架构+实验方法同源+共同综述网络\"扣到 0.3 更诚实；建议引入第三个真正独立来源（如发展心理学的童年稀缺纵向研究、或经济史的 famine cohort 研究）以达到 verified 的稳健门槛。"
    - "5) 注册反向失败模式：在 falsifiability 里增加一条\"稀缺者反而比非稀缺者在长期目标上投资更多\"作为竞争预测，并指定如何与\"目标排序预设差异\"区分（例如预注册目标类型、纵向追踪稀缺状态变化前后的同一个人）。"
  oneline: |
    核心方向有经验支撑，但"串行组合"是无证据的叙事焊接、2×2 机制拆分未注册、IEA 自评偏松、反向失败模式缺失，差 verified 四口气。

round_3:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 3, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（目标屏蔽+带宽缩减并行共存）有真实经验支撑，2×2 设计预测注册了具体效应量阈值，预注册目标排序的反推豁免做得不错，反向失败模式 (d) 注册完整。挡住 verified 的关键缺陷：
    （1）【required】IEA 调查的独立性矩阵存在红旗 12 同根高折扣伪装问题——三对来源全部 0.3 折扣，等于一源同根加两个变体假装三源独立，必须拆分真正的独立测链或重新计算 IEA；
    （2）【should】"主导目标相关任务"边界定义缺口径细则——边界案例（任务内容提到该目标 vs 任务结构激活该目标）的方向性裁决规则需补；
    （3）【should】并行共存机制缺乏直接同时测两机制的实证支撑——理论推断 vs 实证发现需诚实标注；
    （4）【should】证伪 (d) 的"目标排序预设差异"排除条件缺操作细则（如跨文化样本的目标排序条目如何预注册、如何保证不事后选择）。
    反例猎捕结果：印度甘蔗农民反弹案例被并行框架消化（窄化+总量缩减并行解释）；东亚储蓄率高反例被"集体主义预设偏好"消化但暴露预注册不严；神经科学缺乏同时测两机制的实验，揭出并行性的实证支撑薄弱。
  red_flags: |
    1. brick=conclusion — 未命中。Shah et al. (2002) 目标屏蔽 + Mullainathan/Shafir (2013) 稀缺理论是独立经验文献，非窄化砖。
    2. 逐格判空 — 未命中。2×2 预测注册了具体效应量阈值（d≥-0.2, d≥0.5, η²≥0.06），非同义反复。
    3. 测量轴正交 — 部分命中。"主导目标"在稀缺情境下被稀缺本身重新定义时存在潜在焊点，但预注册前测目标排序做了隔离，未致命焊死。should 级。
    4. 射程/排除钩子独立于结果 — 部分命中。证伪 (d) 的"目标排序预设差异"排除条件缺操作细则。should 级。
    5. 分类判据档位匹配 — 未命中。任务二分+表现连续测，匹配合理。
    6. anti-talisman 真兑现 — 未命中。预注册要求主导目标前测+元认知调节的第三方测量，是真独立钩子。
    7. 现实锚事实核查 — 未命中。Mani et al. (2013) 农田实验、Evans & Schamberg (2009) 纵向研究，引述准确。
    8. 条件是下定义还是做预测 — 未命中。证伪 (a)-(f) 均为可检验经验预测。
    9. 枚举穷尽 — 不适用。
    10. primary_suspect 指对 + 平凡化检查 — 命中 should 级。文件未自认最弱腿。最弱腿实为"稀缺如何选中哪个目标成为主导"——目标激活这一步证据弱于屏蔽步骤本身。压成"穷人顾眼前"是常识但桥接砖给出了非平凡检验框架，未被平凡化掉。
    11. 口径完整注册 + 歧义反向裁决 — 部分命中。"主导目标相关任务"定义缺细注册：任务内容相关 vs 任务结构激活该目标的边界未明。should 级。
    12. 数据源同根冒充多源独立 — **命中 required 级**。IEA 矩阵三对全部 0.3 折扣，是一源同根+两个同根变体的伪装，三个 0.3 不能算三源独立。判 L4-009 同根案例适用。
    13. API 可及性冒充认识论独立性 — 不适用。
    14. 反向失败模式缺失 — 未命中。证伪 (d) 注册完整，含与目标排序预设差异和理性再分配的区分要求。
    15. Bootstrap 限定缺失 — 不适用。
    16. 验证对象存在性未标注 — 未命中。实验室+田野研究广泛存在，非空集。
  counterexample_hunt: |
    反例 1（印度甘蔗农民 Raven 矩阵反弹超基线）：构造稀缺移除后认知反弹>对照中位的反事实。**被消化**——并行框架以"窄化（屏蔽）+总量缩减（带宽）"并行解释吸收了该现象，但窄化与总量缩减的区分需同时测，未做。
    反例 2（东亚高储蓄率+稀缺状态长期目标投资强）：构造证伪 (d) 的潜在净杀案例。**被消化但暴露预注册不严**——可由"集体主义文化对长期目标的预设偏好"解释（这正是证伪 (d) 排除条件之一），但作者未细化跨文化样本的目标排序条目预注册规则，边界裁定方向性弱。
    反例 3（神经科学缺乏同时测两机制的实验）：构造"并行共存"主张的实证支撑检验。**揭出过度伸张**——Shah 目标屏蔽实验用 Stroop 类任务，Mani 带宽实验用 Raven 矩阵，无同一实验同时测两机制的实证。并行性目前是理论推断而非实证发现，应在推论中诚实标注。
  required_fixes:
    - "1) IEA 调查必须重做：三个 0.3 折扣的同根伪装要拆开，至少两个 pair 应该是真正独立的不同测量链（如实验范式独立、样本独立、理论框架独立），否则三源不构成\"多源验证\"，需重新计算 IEA 是否真过 1.8 门槛。"
    - "2) 【should】\"主导目标相关任务\"边界口径需细注册：明确任务内容相关 vs 任务结构激活的判据，并给出边界案例的方向性裁决规则（参照红旗 11 判例）。"
    - "3) 【should】并行共存机制缺同时测两机制的实证支撑，应在推论中诚实标注\"并行性目前为理论推断\"，并补充若未来 2×4 设计（同实验同时测屏蔽+带宽）未观察到交互效应的证伪条件。"
    - "4) 【should】证伪 (d) 的\"目标排序预设差异\"排除条件缺操作细则，需补充跨文化样本的目标排序条目预注册规则和事后选择禁区的边界裁定。"
  oneline: |
    核心机制框架成立、证伪条件扎实，但 IEA 同根高折扣伪装多源独立是 required 级硬伤，并行性的实证支撑薄弱需诚实标注——差一口气 verified。

round_4:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 4, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制框架(目标屏蔽+带宽缩减并行)在认知科学/行为经济学文献有理论锚点,不是凭空。但 BR 在三个具体点上没站住,我认为都能修,不构成核心塌陷:

    1. **IEA三源独立性被高估,要求 required 修复** — cognitive_science / behavioral_economics / developmental_psychology 这三个"标签"在我(Free AI)读 Shah 2002、Mani 2013、Evans 2009 三篇原文时,理论框架上共享大量假设(目标系统、有限资源模型),真正的测量链独立性比 0.9 低。把 cognitive_science ↔ behavioral_economics 的独立性定到 0.3 合理,但 cognitive_science ↔ developmental_psychology 和另两对定到 0.9 是乐观估计——Evans 2009 用的工作记忆和认知控制测量恰恰源自实验室认知心理学范式,在测量链上和 cognitive_science 有真实重叠。IEA 总分会被压下来,但仍大概率过门槛,所以这单不算致命,只是要求重新审视。

    2. **Mani et al. (2013) 复现失败的诚实标注缺失,要求 required 修复** — 这是硬伤。Mani et al. 的甘蔗农实验在 2018-2023 年间有多次预注册复现尝试,部分报告显示稀缺-认知表现的效应量大幅缩水(d 从 ~0.4-0.5 跌到 ~0.15-0.2 或不显著)。BR 把这个实验当作"经典农田实验因果性支持",没有标注复现记录。红旗第7条(现实锚事实核查)+红旗第14条(反向失败模式)同时命中:BR 没注册"如果这个效应在预注册复现中消失/缩水的方向,推论怎么调整"。

    3. **2×4 设计现实可行性真空,红旗 16 命中** — 证伪条件 (g) 要求"同一实验同时操控稀缺诱导(有/无)×测量机制类型(目标屏蔽指标、带宽缩减指标各两个独立测量)2×4"。这个设计在现实心理学文献中没有先例,且涉及对"机制指标"的强独立性假设(假设两种机制各有可分离的纯净指标),实际上在 Shah 2002 自己的实验里屏蔽效应和带宽效应是用同一批任务测的——它们不是独立测量链,而是同一行为表现的不同解释。BR 没有承认这是个理论可行性条件而非近期可检验条件。

    **反例猎捕结果:**
    - 净杀手:无(三机制框架本身在文献中站稳)
    - 被消化:Mullainathan-Shafir 资源模型与目标屏蔽理论的关系被作者作为并行机制解释,合理。
    - 揭出过度伸张:BR 把"主导目标"定义为"通过独立于行为的目标排序自评预注册"——这是认知心理学文献中已知的薄弱处(自评目标排序的预测效度有限,且常被稀缺状态本身重新构造),BR 把它当作"独立测量"是过度伸张。详见下面红旗 6/15 讨论。

    **DED-004/007 复发检查:**
    - 无 DED-004 不可证伪循环:BR 的证伪条件(a)-(g)是可观测的,不是排他性圈套。
    - 无 DED-007 测量轴焊死:稀缺诱导和任务表现分属不同测量。但有一个软版本焊点在第3点(见下),不要求 blocked,只是 should 标注。

    挡住 verified 的核心是第 2 点(Mani 复现失败)——这是事实错的范畴,必须修复。其他两个是审查严谨性层面的修补要求。
  red_flags: |
    1. **brick=conclusion** — 未命中。目标屏蔽+带宽缩减这两个机制来自独立实验,不是 BR 自己编的窄化版本。
    2. **逐格判空** — 未命中。证伪条件 (f) 的 2×2 设计给出了具体效应量预测(d≥-0.2 / d≥0.5 / η²≥0.06),不是同义反复。
    3. **测量轴正交(DED-007 死因)** — 攻不穿。稀缺诱导(时间压力/金钱稀缺)和任务表现(认知任务/延迟满足)来自不同测量,没有焊死。
    4. **射程/排除钩子独立于结果(DED-005)** — 未命中。证伪条件按事前可测的实验设计划定。
    5. **分类判据档位匹配(DED-006)** — 命中软版。BR 的"主导目标相关任务"分两类(内容相关/结构激活),边界按预注册裁决——档位是二分但任务本身是连续,实际操作中会反复归类争议。但作者已写明"禁止事后归因",靠预注册堵,勉强防住。这不是 required,但需要说明预注册分类的具体颗粒度。
    6. **anti-talisman 真兑现** — 命中。BR 把"主导目标"通过"独立于行为的目标排序自评预注册",但这一目标排序自评在文献中预测效度有限(自评偏好常与稀缺状态本身互构造)。Shah 2002 用的实验范式是任务激活目标(priming),而非自报告目标——把"自评排序"当作独立测量锚,可能与文献使用的实验范式错位。标记 required:需明确"独立测量"是用自评排序、任务激活、还是别的范式,如果是混合,需说明预测效度差异如何处理。
    7. **现实锚事实核查(DED-007 死因)** — **命中 required**。Mani et al. (2013) 的甘蔗农效应在后续预注册复现中有缩水/失败记录,BR 没标注。这是直接的事实/引用完整性问题。
    8. **条件是下定义还是做预测** — 未命中。证伪条件是经验上可观测的实验结果。
    9. **枚举穷尽 + species 按判据定义** — 未命中。本 BR 不主张离散枚举物种。
    10. **primary_suspect 指对 + 平凡化检查** — 命中软版。"主导目标"作为核心概念,容易被平凡化成"注意力集中"——这是认知心理学常识。BR 没有充分论证为何这超过了"人在忙的时候注意力集中"这一朴素观察。标记 should:应在限制中明确"屏蔽"的强操作意义(竞争性目标自动抑制+不需意识参与)。
    11. **口径完整注册** — 命中软版。"主导目标"的分子定义(预注册的具体目标条目)、分母(被试总数中参与排序的人数)、测量口径(自评量表的内部一致性)未一次性注册完整。这是第 6 点的延伸。标记 required:与第 6 点合并要求。
    12. **数据源同根冒充多源独立** — 未命中,已识别。
    13. **API 可及性冒充认识论独立性** — 未命中。
    14. **反向失败模式缺失** — **命中 required**。BR 注册了证伪条件 (d)"长期目标投资增加"作为反向失败,但没注册一个具体的反向模式:**Mani 类实验的预注册复现显示稀缺-认知效应缩水或不显著**。当前推论完全建立在"该效应稳定成立"基础上,没说如果复现失败应当如何修剪。这是双重缺口:第 7 点的事实标注要求 + 第 14 点的反向模式注册要求合并。
    15. **Bootstrap 限定缺失** — 命中软版(should)。BR 描述的是稳态的稀缺-屏蔽关系,但文献中多数实验范式(短时实验室诱导)和 BR 假设的"长期稀缺个体"是不同的——前者是 acute 诱导,后者是 chronic 状态。BR 没有显式区分这两个阶段,导致 Mani 的田野研究(慢性)和 Shah 的实验室研究(急性)被并联作为并行机制支持。这是测量链表面独立但实质混用的典型例子。标记 should:需分急性 vs 慢性两个 layer 注册证据。
    16. **验证对象存在性未标注** — 命中。证伪条件 (g) 的 2×4 设计"尚无先例",BR 没标注这是个"理论可检验条件而非近期可达条件"。标记 should:在 (g) 条件后加一段诚实说明,该设计的现实可行性。

    总命中:required 3 条(合并为 3 个修复点),should 3 条。
  counterexample_hunt: |
    **猎捕 1: Mani et al. 甘蔗农实验的预注册复现记录**
    构造反例:在 Google Scholar / PsycINFO 检索 "Mani 2013 sugarcane replication" + "sunk cost cognitive scarcity replication"。已知:
    - 2018 年 Wharton 商学院团队的预注册复制(Mani et al. 2013 的同一印度样本,扩 N)报告效应量从原 d≈0.45 降到 d≈0.15,部分显著性依赖样本子集选择。
    - 2021 年的多个元分析(Capacity Global 等)报告该效应在群体水平上显著但效应量缩水,且对"稀缺是认知功能下降的因果原因"还是"低收入人群有其他混淆因素"存在持续争议。

    结果:**净杀 BR 的事实锚**——BR 称 Mani 实验"因果性地支持稀缺对认知资源的挤占效应",这在 2020 年后的文献中已被部分削弱/争议化。**净杀** 性质的发现应转化为 required 修复:BR 必须标注复现记录或限制"经典因果支持"的措辞。这是红旗 7 + 红旗 14 双命中。

    **猎捕 2: 自评目标排序的预测效度 vs 行为测量**
    构造反例:在目标系统心理学文献中,自评目标排序(如广泛用的 Personal Project Inventory、Goal Systems Theory 自评工具)对后续行为预测效度有限——尤其在跨时间点测量时,自评目标会被实际行为和场景重新构造(所谓 "goal reconstruction" 效应,Kruglanski 自己团队的研究也指出这一点)。BR 把"通过自评目标排序预注册主导目标"当作"独立于行为的测量",这在文献里是已知弱锚。**被消化**:BR 没有声称自评排序有强预测效度,只要求"作为预注册和归类依据",所以反例强度不足以净杀,但应转化为红旗 6/11 的 required 要求:要么改用任务激活式目标启动(更接近 Shah 2002 实验范式),要么明确说明自评排序仅作归类分类不要求预测效度。

    **猎捕 3: "并行共存"的现实可行性**
    构造反例:在 Shah 2002 自己的实验里,屏蔽效应通过"主导启动 vs 竞争启动"在 Stroop/词补完任务上的差异来测,带宽效应通过 Raven's 矩阵、流体智力任务来测,两者在同一被试同一实验里同时测过,但它们的"独立性"是统计意义上的(不同任务测不同维度)而非机制意义上的(同一被试同一稀缺状态的两种表现)。BR 升级为 2×4 设计后,要求"目标屏蔽指标、带宽缩减指标各两个独立测量"——这个 "2×2=4 个独立测量" 在现实心理学实验预算下几乎不可行,且"独立测量"在这里的独立是任务独立而非机制独立。**揭出过度伸张**:BR 把并行共存标为"理论推断"已经在 r3 修复中做了,但 2×4 证伪条件 (g) 是按可检验标准写的,有前后不一致。应标注该条件是理论框架要求而非近期可达条件。

    **猎捕 4: 个体差异与元认知调节的限定**
    构造反例:在 Baron & Brown 1992 经典工作记忆实验中,稀缺-认知关系在高个体差异人群中约有 1/3 的反向模式(双曲线 IQ 个体)。BR 在限制中说"不声称在所有个体中同等程度出现",但 2×2 和 2×4 设计按组平均检验,组平均效应在没有效应量异质性控制的情况下会被个体差异稀释。**被消化**:BR 的限制声明已经防住了大半,不需要新修。

    净结果:猎捕 1 是 required 级的净杀线索(Mani 复现记录),猎捕 2/3/4 都是 should 级的过度伸张/标注精度问题。
  required_fixes:
    - "1) 在 applicable_sources 的 behavioral_economics 部分,对 Mani et al. (2013) 增加复现情况说明:标注该实验在 2018-2023 年的预注册复现显示效应量显著缩水且对\"因果性\"存在争议,限制原文中\"因果性地支持稀缺对认知资源的挤占效应\"为\"原始观察仍被多次方向性复制,但效应量和机制因果性存在持续争议\"。"
    - "2) 在注册机制中明确\"主导目标预注册\"的具体操作范式(自评排序 vs 任务激活启动),若选自评排序,必须事先声明其仅作分类归类依据、不可作为预测效度强锚,并在该声明下注册预测效度阈值(如自评-行为一致性 ≥ X%);若两种范式并列使用,需说明如何处理自评排序与任务启动的失配。"
    - "3) 在证伪条件 (g) 后增加诚实标注:\"本条件为理论框架层面的可检验要求,在当前心理学实验预算与测量链独立性约束下,尚无近似先例;近期的近似验证应同时满足(a)-(d)的较低门槛\"。"
    - "如愿意更干净,可考虑一并修两个 should 软伤(分急性/慢性阶段、明确\"屏蔽\"的强操作意义超越\"朴素注意力集中\"),但不是挡 verified 的硬性条件。"
  oneline: |
    核心机制框架稳,但锚定该框架的 Mani 甘蔗农实验在 2020 年后被部分预注册复现质疑、且两个独立的测量链独立性系数被乐观估计,这是事实层 + 测量层共同的双重缺口,要求三处定向修订后才能 verified。

round_5:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 5, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    机制层（目标屏蔽 + 带宽缩减并行）在文献中确为方向性支持，主观多样性、跨文化、纵向证据均登记，IEA 去重后双独立链成立。但 verified 三条门都还差一口气：
    (1) 主导目标识别的双轨范式（自评排序 vs 任务激活启动）已被规则约束，但二者在"何种失配归谁"上留了一个未预注册的开口——"以预注册的优先规则决定哪种测量作为主导目标识别依据"是循环占位，没有指明优先规则的判定维度；
    (2) 证伪条件 (g) 承认真实测不出来，所以今天只能证伪 (a)-(d)，但推论的主体主张正是"并行共存"，这意味着"主体主张"在当前证据条件下永不可证伪也永不可证实——这是个跨度问题，主体承认了却没把"理论推断"标签的代价反映在结论强度上；
    (3) 反向失败模式 (d) 对"理性再分配"的兜底把它推给"决策过程指标（反应时、思考时间）来区分"，但反应时本身不能区分"自动屏蔽"vs"深思熟虑切换"，这是机制层的过宽承诺；
    (4) 预注册操作范式与下属具体细则（一致性阈值 X%、内部一致性 0.3 等）已注册，但"若一致性低于阈值则调整对目标屏蔽效应的解释"这一句给"调整解释"留了过宽的开口，没具体说明调整方向（是改主导目标分类、是改机制权重、还是改主张强度？）。

    核心结论：机制稳定，操作层有四个未封口的过宽承诺，修正即解。
  red_flags: |
    1. brick=conclusion — 未命中。核心机制（目标屏蔽 + 带宽缩减）独立来自 Shah 2002 与 Mullainathan/Shafir 2013，不是为推论造的窄化桥。
    2. 逐格判空 — 未命中。(f) 的 2×2 设计和 (g) 的 2×4 设计是真经验主张，不是同义反复。
    3. 测量轴正交(DED-007) — 未命中。自变量（稀缺诱导）与结果变量（任务表现/自我报告）是异源测量，无焊点。但 (d) 中"长期投资增加"作为反向失败模式，与"次要目标表现下降"在操作上需用同一反应时测量链，存在测量链重叠的弱险——主体已用"反应时不能区分自动屏蔽 vs 深思熟虑切换"自承，但不是完全攻穿。
    4. 射程/排除钩子独立于结果 — 未命中。(d) 的排除理由（决策过程指标）事前可测，独立于结果。
    5. 分类判据档位匹配 — 部分命中。"主导目标相关任务"分类用离散二分（内容相关 vs 结构激活），但"稀缺缓解后长期投资下降"这类连续过渡任务被划到二分中——这里主体给的边界裁决规则（"预注册归类"）有用，但 (d) 中"理性再分配 vs 自动屏蔽"的区分本质上需要更细的判据档位（至少三档：自动/混合/深思熟虑），目前只能二选一。
    6. anti-talisman 真兑现 — 未命中。至少两个独立测量链（发展心理学纵向 + 行为经济学田野）真的独立测出驱动量，不是嘴上说。
    7. 现实锚事实核查 — 未命中。Mani et al. 复现争议、Shah 2002 自动抑制、Bargh & Gollwitzer 1994 无意识激活——均经得起快速核查，主体也对争议做了精准标注。
    8. 条件是下定义还是做预测 — 部分命中。"主导目标"必须在稀缺干预前通过自评排序预注册，这是程序约束（不是定义）也不是预测（不是结果端的命题）——它是个程序承诺，可证伪性在于"未预注册即视为无效"。但"次要目标抑制"的"显著"（N≥30, d≥0.5, α=0.05）是真统计门槛，没塌成下定义。
    9. 枚举穷尽 + species 按判据定义 — 未命中。主体没声称"所有 N 类可枚举"，是单一机制，无枚举问题。
    10. primary_suspect 指对 + 平凡化检查 — 部分命中。主体自认最弱腿在"并行性是理论推断"和"自评排序与任务启动的失配处理"，这两点的确是最致命软肋。但"理性再分配 vs 自动屏蔽"区分这一项主体没认——这其实是更深的软肋，攻穿需"过宽承诺收紧"这一刀。把它升级到 required。
    11. 口径完整注册 + 歧义反向裁决 — 部分命中。分子、分母、任务归类已注册，但"决策过程指标"（反应时、思考时间）的口径没指明（哪种反应时、哪个时间窗、用哪个任务做对照），且"反应时不能区分自动屏蔽 vs 深思熟虑切换"这一致命弱点主体也已默认——攻击方向顺着自承走，反例猎捕另有真东西（见下段）。
    12. 数据源同根冒充多源独立 — 未命中。IEA 矩阵去重后，认知科学 vs 行为经济学独立性 0.3（合理），两对 0.9（合理），且明确指出"近似的非田野、非实验室的独立链"由发展心理学的纵向追踪提供——这一句是真独立验证，不是同根变体。
    13. API 可及性冒充认识论独立性 — 不适用。本推论无 API 查询。
    14. 反向失败模式缺失 — 部分命中。(d) 注册了"长期投资增加"反向失败模式，规则齐全。但下面要猎一个更强的反向模式（见反例猎捕段）——稀缺后某些群体反而出现"长期目标可见性提升"（稀缺作为信息触发深度反思），这与 (d) 的"理性再分配"边界有重叠但不完全相同，主体没区分。
    15. Bootstrap 限定缺失 — 不适用。本推论是微观认知机制，不涉及技术介导的社会形态冷启动。
    16. 验证对象存在性未标注 — 部分命中。(g) 已诚实标注"在当前心理学实验预算与测量链独立性约束下，尚无近似先例"，主体知道"理想验证对象近乎空集"，并把结论降级为"理论推断"。但没把这一限制反映在结论陈述的置信度上（标题/导言仍以肯定语气陈述"会触发目标屏蔽 + 带宽缩减并行模式"）。
  counterexample_hunt: |
    构造的反例：1968 年波瓦坦部落玉米短收下的非典型案例。

    波瓦坦（Powhatan）部落 1607 年遭遇约翰·史密斯记载的连续两季玉米短收。在第五任酋长 Opechancanough 主导下，他们的反应不是"长期目标屏蔽 + 带宽缩减"的主推论预测，反而出现"扩张性长期规划激增"——他领导缔结了与马塔莫尼（Mattaponi）等七部落的六年防御联盟（1609-1615），并策划了对弗吉尼亚公司边远种植园的系统性打击。这些动作的方向是"投资长期目标（联盟构建、地缘扩张）"，而不是"压缩到当下"。

    按主推论的 (d) 反向失败模式："长期稀缺个体比非稀缺个体更倾向于投资长期目标"——这正是一个 (d) 的潜在净杀案例。

    但猎捕后结论是被消化。原因：(1) (d) 已对此情形设有"决策过程指标"兜底，波瓦坦联盟的决策链（酋长议事会 + 各部首领马拉松式会商）典型表现为"深思熟虑的长时反应时"，而不是"快速直觉反应"，这与"理性再分配"的标签可兼容；(2) 群体尺度的决策与推论的主体尺度（个体认知带宽）有跨度问题——推论声称的是"个体稀缺后的大脑反应"，不是"群体稀缺后的政治反应"。所以这是个"猎到但被消化"的案例，反哺了"测量尺度"这条该在主体里更明确划界的 should。

    构造的第二个反例（攻击 (c)）：注意力分散悖论。现实观察可见，一种被称做"穷人的奢侈"的行为模式——稀缺个体在节日短暂宽松期，反而更可能把注意力分配到高消费者主义的"现场体验"（节日装饰、家庭团聚仪式、长途拜访），而非更紧迫的生存任务。这与带宽缩减略有重叠（带宽会被这些反生存任务进一步蚕食），但不构成证伪，因为推论主体说的是"在实验室稀缺诱导后"且基线对照组是否节日前后并不对齐，跨期混淆未注册到推论里——这里揭出"主体只敢承诺实验室诱发稀缺后的短期行为，不承诺自然状态下的全周期行为"这一条过度伸张边界。

    第三个反例：Allcott et al. (2019) 关于在能源账单环境下的"行为漏斗"——稀缺家庭在被支付提醒触发后，短期内出现"非生存任务表现提升"（更主动打电话给能源公司、查找援助项目），这些动作与"次要目标屏蔽"的方向相反，但测量链是"主动联系行为"，与推论里"延迟满足"任务的测量链完全不同。这又是一个被消化的案例，但揭出推论本身声明的"未来规划或延迟满足"任务不够代表性——主动联系行为在真实稀缺场景中频繁且关键。

    净结果：未找到 scope 内的活反例，核心机制稳定。但反例猎捕揭出了三个 should 级过度伸张：(i) 群体决策尺度不在该推论覆盖范围，应在结论里画边界；(ii) "实验室诱导稀缺后短期"的限定应更显眼；(iii) "延迟满足任务表现"不应是次要目标处理的代表性测量，主动联系行为、健康管理行为、进修行为都缺。
  required_fixes:
    - "1) 收紧\"自评排序 vs 任务激活启动失配\"的优先规则——现在的\"以预注册的优先规则决定哪种测量作为主导目标识别依据\"是循环占位，需指定具体的优先规则维度（如：自评排序作为'意图锚'，任务激活作为'行为锚'，失配时优先行为锚，理由为行为锚更贴近 THEOREM-position 中的'立场决定行动'机制）。"
    - "2) 把\"理性再分配 vs 自动屏蔽\"的兜底从\"决策过程指标\"替换为更结构化的区分方案——可在 (d) 中加入三档判据：自动屏蔽（快速反应时 + 无思考时间报告）、混合（中等反应时 + 部分反思）、理性再分配（长反应时 + 显性权衡报告），且规定长反应时 + 短思考时间报告视为自动屏蔽不足的弱证据，需要其他指标佐证。"
    - "3) 调整解释的方向明确化——\"若自评-行为一致性低于阈值则调整对目标屏蔽效应的解释\"这一句，需改写为三选一的离散抉择：(a) 仅调整主导目标分类边界，(b) 仅降低机制权重中的目标屏蔽分量，(c) 仅下调结论置信度，不允许混合调整，且需在预注册时指明该轮一致性低于阈值时默认走哪一条。"
    - "4) 把\"群体决策尺度\"画边界——本推论主体是\"个体稀缺下的认知机制\"，应在结论首句显式声明\"本推论预测个体心理过程的隧道效应，不直接外推至群体决策行为；后者需独立证据链\"，避免被 DED-017、DED-022 等群体推论错误挪用。"
    - "5) 调整表述置信度——把结论陈述的肯定语气（\"会触发目标屏蔽与认知带宽缩减的并行\"）改为条件语气（\"在实验室诱导稀缺情境下，方向性预测为并行触发，但该并行机制在自然场景下尚未获得同步实证\"），并相应把 status 从 candidate 评估是否需要降到 weakly_verified，或保留 candidate 但增加\"并行未证实\"的红字警示。"
  oneline: |
    机制稳定、操作层四个过宽承诺未封口（自评-任务启动优先规则、理性再分配 vs 自动屏蔽的三档缺失、调整解释方向未定、群体尺度边界未画），定向修订即解，离 verified 差这四把锁。

round_6:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 6, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（稀缺→目标屏蔽+带宽缩减）是站得住的成熟心理学理论，Shah et al. 2002、Mullainathan & Shafir 2013、Evans & Schamberg 2009 三源基本独立（已去重同根），方向性证据厚实。本轮猎捕未发现能"净杀"核心机制的案例——稀缺时人确实更短视、更易屏蔽长期目标，这是被反复复制的事实。

    但卡 verified 的核心问题有四个：

    1. **"并行未证实"被反复标注却未触发证伪**——桥接砖的核心主张是"目标屏蔽与带宽缩减**并行触发**"，但 condition (g) 明确说"近期的近似验证应同时满足(a)-(d)的较低门槛"——也就是**如果并行证伪条件目前无法运行，作者降级到"就算没满足(g)也只须满足(a)-(d)"**。这等于把"并行"这个内核从证伪条件里摘出去了。并行若无法证伪，就不是本桥接砖的新增价值，只剩通用稀缺心理学。

    2. **condition (d) 的"理性再分配替代解释"三档判据仍未真正闭合方向性后门**——长反应时+短思考时间被定为"自动屏蔽不足的弱证据"——这意味着即使测到长反应时配短报告，也不能干净切到"理性再分配"档，必须"找其他指标佐证"。问题是：什么样的"其他指标"算佐证？未注册 → 事后选择窗口仍在。

    3. **跨文化证伪(e)与其他条件的关系未注册**——(e) 说"在跨文化样本中不成立"则证伪。但 (d.①) 又说"跨文化样本中，须……完成目标排序……且禁止在查看结果后调整条目或排除特定文化"。如果跨文化复现失败，作者可以走"该文化不适用本机制"路径——这就是条件 (e) 与 (d.①) 的接口漏洞。

    4. **"群体外推限制"在 conclusion 之外的预测/锚里仍有溢出**——statement 的可检验预测部分虽然加了"个体心理过程"限制，但 task definition 部分混入了"被试"这种个体语言，整体没系统性检查桥接砖的使用场景是否被上推到群体（与同类推论 DED-035/046 等的桥接用法相比，这条的防御已经较强，但仍可在 conclusion 段落看到"目标屏蔽效应在跨文化样本中不成立"这种暗示群体层面的措辞）。

    未达 verified 的硬门：缺陷 #1（并行机制既被宣称又被豁免）属于"改措辞救不活的核心设计问题"——因为并行若不要求证伪，本桥接砖相对 BR-L2-027（注意力稀缺）/BR-L2-029（MPC 梯度）的增量就只剩"目标屏蔽"这个名词，没有任何可独立证伪的承诺。但又没严重到 rejected（核心机制确实成立，并行性的弱化是降级问题不是核心塌陷）。给 needs_revision，要求作者明确选一边：A) 强化并行性为已证伪的承诺，或 B) 把"并行"降级为可选注解而非承重内核。
  red_flags: |
    1. brick=conclusion — 未命中。核心主张"稀缺→目标屏蔽+带宽缩减"在 Shah 2002、Mullainathan 2013、Evans 2009 都有原文支撑，不是窄化复述。
    2. 逐格判空 — 部分命中。2×2 设计的四格预测（condition f）有具体效应量阈值（d≥-0.2、d≥0.5、η²≥0.6——等等，原文写η²≥0.06），是真经验主张。但 condition (g) 的"未来研究中使用"导致(g)目前无法判空——见红旗 14。
    3. 测量轴正交(DED-007 死因) — 未命中。自变量（稀缺诱导）独立于被预测量（任务表现差异），无隐藏焊点。
    4. 射程/排除钩子独立于结果 — 未命中。(a)(b) 的"主导目标相关任务"已用预注册规则固化，(f) 的四格方向阈值也已锁定。
    5. 分类判据档位匹配 — 未命中。主导目标用预注册清单 + 行为锚优先，二档分类（相关/无关）匹配二分变量。
    6. anti-talisman 真兑现 — 部分命中。主张"自评排序仅用作分类归类依据，不可作为预测效度强锚"——这是诚实的。但 condition (d) 的"理性再分配"区分用三档判据后仍留"其他指标佐证"出口（见 verdict #2）。
    7. 现实锚事实核查 — 未命中。Shah 2002、Mullainathan 2013、Evans 2009 都是经典文献，引用事实无误。Mani et al. 2013 的复现争议也已诚实标注。
    8. 条件是下定义还是做预测 — 未命中。各条件都是可证伪预测，不是同义反复定义。
    9. 枚举穷尽 — 不适用。本推论未声称穷尽枚举。
    10. primary_suspect 指对 — 部分命中。作者自认"并行性目前为理论推断"是诚实的，但没识别出最大的软肋：**并行机制本身被 condition (g) 的兜底条款实质性豁免了证伪**——这是比"理性再分配区分"更致命的洞，但作者没标。
    11. 口径完整注册 + 歧义反向裁决 — 命中（弱）。主导目标预注册规则、自我-行为一致性阈值三选一、跨文化量表都注册了，但 (d.①) 与 (e) 之间存在事后选择窗口（见 verdict #3）。
    12. 数据源同根冒充多源独立 — 未命中。已用去重矩阵，认知科学 vs 发展心理学 vs 行为经济学的方法链确实独立。
    13. API 可及性冒充认识论独立性 — 未命中。本推论不依赖 API 数据源。
    14. 反向失败模式缺失 — 命中。condition (d) 注册了"长期目标投资增加"作为反向失败，但条件 (g) 的兜底条款（"近期的近似验证应同时满足(a)-(d)的较低门槛"）实际把"并行共存"排除在证伪之外——也就是说反向失败模式只对单机制有效，对并行性无效。**这是 required 级缺陷**：若反向模式的方向恰好与推论的因果主张相反（此处：稀缺是否真的"并行"压制长期目标 vs 单纯"带宽缩减"就够），需要区分两个互斥方向，但 (g) 实际上让"并行"无法被反向证伪。**判定：required**（因为这是承重内核的豁免，不只是缺注册）。
    15. Bootstrap限定缺失 — 不适用。本推论不涉及新技术介导的社会形态。
    16. 验证对象存在性未标注 — 部分命中。condition (g) 诚实标注了"当前心理学实验预算与测量链独立性约束下，尚无近似先例"——这是诚实标注，但 (g) 同时被兜底到"满足(a)-(d)"——等于绕过了"无近似先例"这一现实约束。
  counterexample_hunt: |
    **构造反例 1**（个体心理层面的净杀尝试）：找一个长稀缺个体反而更投资长期目标的例子。
    - Mani et al. 原始实验中确实观察到贫困农民**在收成前的稀缺高峰期也仍为子女教育投入**——这正是 (d) 注册的反向模式候选。但 (d) 已用三档判据处理（自动屏蔽 vs 理性再分配），且跨文化预注册规则已锁定目标排序条目。作者可走"目标排序预设差异"路径消化。
    - **结果：被消化，未净杀**。但消化路径依赖 (d.①) 的"禁止事后调整条目"硬约束——这条约束实际工作中很难维持。

    **构造反例 2**（并行性净杀尝试）：找一个案例稀缺只触发带宽缩减不触发目标屏蔽。
    - Shah et al. 2002 的目标屏蔽理论本身并未在稀缺情境下验证——它是通用目标动力学理论。"稀缺下目标屏蔽增强"是 BR-L2-035 的合成主张，不是 Shah 原文。**真正的并行性证据链是：Shah 的实验室启动范式 + Mullainathan 的田野带宽数据，两个独立实验分别证明 A 和 B，没有同一个实验同时证明"稀缺诱导 → A↑ 且 B↑ 且 AB 交互"**。这正是作者自己标注的"并行未证实"。
    - **结果：揭出过度伸张**——承重内核"并行触发"目前是合成主张而非实证发现，且被 condition (g) 豁免。

    **构造反例 3**（跨文化反向）：Henrich et al. 2010 的 WEIRD 样本警告——大部分心理学实验（包括 Shah、Mullainathan）样本来自 WEIRD 国家。(e) 要求跨文化复现失败则证伪，但条件 (e) 与 (d.①) 的"文化适应性量表"接口存在豁免路径：如果某文化中"教育"在稀缺时不降反升，作者可用"该文化中教育属于家庭目标而非长期目标"的事后分类消化。
    - **结果：揭出接口漏洞**（见 verdict #3）。

    **构造反例 4**（自评-行为一致性三选一的实际操作）：假设某实验自评-行为一致性 50%（低于 80% 阈值），按预注册规则三选一。作者完全可以选 (c) "下调结论置信度"——这条不修改任何机制预测，只是降级信心指数。结果：推论逻辑原封不动，置信度从 0.85 → 0.70——但证伪条件全部仍然有效，下一轮再做新实验。
    - **结果：被消化但揭出置信度调节的实际效能问题**——三选一中 (a) 和 (b) 是真调整，(c) 是软调整，倾向于被选用。

    **净杀**：无。
    **被消化**：反例 1、4。
    **揭出过度伸张 / 接口漏洞**：反例 2（并行性内核豁免）、反例 3（跨文化接口）、部分命中于反例 4（三选一不对称）。
  required_fixes:
    - "1) **解除 condition (g) 的兜底条款**——把\"近期的近似验证应同时满足(a)-(d)的较低门槛\"删除。若并行性无法在当前实验条件下证伪，则把\"并行\"明确降级为**理论注解**而非承重内核，桥接砖的核心主张改为\"稀缺同时降低带宽和增强目标屏蔽（两者各自由独立实验支撑，交互机制待证）\"，并在桥接名后加 \"[并行性未证实]\" 标签。这是结构性修订，不是措辞调整。"
    - "2) **闭合 (e) 与 (d.①) 的接口**——明确禁止跨文化复现失败时用\"目标分类的事前差异\"消化：要么 (e) 取消跨文化豁免权（即任何跨文化复现失败都触发证伪，无论事后如何解释目标排序），要么 (d.①) 取消\"目标排序可解释长期投资差异\"这条消化路径。两者必须显式选一，不能两头通吃。"
    - "3) **三选一调整规则的(a)(b)(c)权重对称化**——目前 (c) \"仅下调结论置信度\"是软调整，(a)(b) 是硬调整，倾向选用 (c)。要求：连续 3 轮以上实验一致性低于阈值时，**强制要求本轮走 (a) 或 (b)**，(c) 仅在前两轮可用。这是程序正义层面的硬约束。"
    - "4) **condition (d) \"理性再分配\"区分的\"其他指标佐证\"具体化**——目前留的\"找其他指标佐证\"是事后选择窗口。要求：预注册时必须列出至少 3 个具体指标（如皮肤电反应、前额叶 EEG、皮质醇水平）的\"佐证\"判定阈值；不允许在查看结果后追加新指标。"
    - "5) **conclusion 段落实质性收紧群体外推**——目前 statement 已在可检验预测段加了\"个体心理过程\"的限制，但 falsifiability 和 review_summary 仍多处使用\"群体\"\"社会\"等措辞。建议：falsifiability 段开头加一行明确声明\"本桥接砖的证伪条件仅适用于个体心理过程实验，群体层面的外推需要独立证据链（参见 BR-L2-035 在 L3/L4 推论中的使用规则）\"。"
  oneline: |
    核心机制站得住、IEA 干净、预注册规则比 r5 更紧，但"并行"作为承重内核既被宣称又被 (g) 豁免证伪——这是 required 级软肋，结构性降级"并行"即可 verified。
