        IEA 尚未执行,范畴错层问题暂不适用。但审前预判:cognitive_science 和
        behavioral_economics 在"稀缺-认知"这一具体主题上的独立性可能低于 default
        0.6——两条来源共享核心认知架构假设和实验方法论,类似于 BR-L2-031 的
        锚源-组织心理学重叠问题。正式 IEA 调查时应特别审视此对来源的独立系数。

round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（稀缺→认知带宽缩减→次要目标被压制）的方向性是有经验支撑的（Mani et al. 2013 的甘蔗农民实验、Shah/Friedman/Kruglanski 2002 的目标屏蔽范式），没有被净杀的反例。但 verified 三门都还差一口气：(1) "目标屏蔽"与"带宽缩减"被作者自称"串行组合"，但机制层级在文献里其实是**两套独立可分离的发现**——一个是注意/动机层面的目标竞争（Shah 系），一个是一般流体认知层面的带宽挤占（Mullainathan/Shafir、Mani 系）——把两者焊成"串行组合"既无机制证据也无独立预测，只是把两篇文献绑在一起冒充新机制。这是红旗 1（brick=conclusion）和红旗 8（条件是下定义还是做预测）的混合病灶。(2) 证伪条件 (a) 与 (b) 都是单变量检验，但作者声称"两种预测必须同时检验以区分机制"——这在逻辑上要求的是一个 2×2 设计（四组：诱导稀缺且目标相关任务 vs 诱导稀缺且目标无关任务 vs 控制组目标相关 vs 控制组目标无关），可证伪条件里没有这一格的具体预测值，注册的是单变量边界，不足以拆开"目标屏蔽"和"带宽缩减"的独立贡献。这是红旗 3（测量轴正交）的死穴。(3) IEA 自评 1.8 恰好压线，且两个来源独立性系数是作者自己填的 0.5（"共享认知架构假设且实验方法同源"），按这逻辑再扣一点就是 0.3 以下；更重要的是作者承认"建议未来增加第三个独立来源"——这等于自证当前未达标。(4) 跨文化可证伪性条件 (e) 措辞"不成立"过于宽松，"未观察到次要目标抑制"是一个统计零结果条件，跨文化零结果几乎永远无法"成立"，本质上是一个弱条件而不是强证伪。这是红旗 7（现实锚事实核查）的潜在延伸问题。反例猎捕：构造了两个潜在净杀案例（彩票暴富户的长期规划行为、斯堪的纳维亚高福利国家低收入者的目标多样性），均被"目标排序预设差异"消化，未构成净杀；但揭出过度伸张——作者把"次要目标被压制"作为默认结局，没给"稀缺者主动放下次要目标（理性再分配）"留出机制位置。下面逐条给红旗。
  red_flags: |
    1. brick=conclusion — 部分命中。"稀缺→带宽缩减"来自 Mullainathan/Shafir，"激活主导目标→抑制竞争目标"来自 Shah/Friedman/Kruglanski。把两者声明为"串行组合"在两个源头文献里都不是这个连法——这是作者在桥接砖层面做的合成。合成本身不一定是砖=结论，但本桥接砖的"串行组合"声明没有独立机制证据（无任何引用支持"先带宽缩减、再目标屏蔽"或反过来的时序），只是叙事性焊接。这条没到"砖专为推论窄化"那么死，但属于"机制夸大"。
    2. 逐格判空 — 命中。声称"在实验室中……次要目标任务表现显著差于控制组，同时自我报告对长期目标的关注度下降"——这是稀缺文献里已经被反复验证的老格，不是本推论的新格。"主导目标相关任务的表现应保持或增强"才是本推论的真正新预测（区别于纯带宽缩减说的"所有任务一起降"）。但这条新格在可证伪条件 (a) 里只给出了方向（"未显著优于控制组，或显著更差"），没说效应量应该多大、保持多强，所以"保持或增强"是软承诺。
    3. 测量轴正交 — 命中，且较重。"主导目标"和"次要目标"的区分在实验里靠的是预注册的目标排序自评（好），但"带宽缩减"和"目标屏蔽"的机制拆分在证伪条件里没有对应到独立的测量轴——条件 (a) 测的是目标相关任务，条件 (b) 测的是所有认知任务（包括无关任务），可两者的"主导"和"带宽"在文献里恰恰不能用一个"目标相关 vs 无关"的二分干净分开。要真的拆开两套机制，需要的是"诱导稀缺 × 任务相关性 × 目标预注册激活 vs 未激活"的 3 因素或至少 2×2 设计，本推论的证伪条件没有这种正交性。可证伪 (c) "机制混淆"只是兜底的话术，没有给出能区分两机制的预测值。
    4. 射程/排除钩子独立于结果 — 未命中。证伪条件 (d) 排除钩子用了"该效应不能由目标排序的预设差异解释"——这是事前注册的钩子，方向正确，没问题。但 (e) 用"不成立"作为跨文化证伪条件太松（见 7）。
    5. 分类判据档位匹配 — 未命中。推论没有显式分档。
    6. anti-talisman 真兑现 — 部分命中。"紧迫目标的识别必须独立于后续行为"通过预注册自评做到了，anti-talisman 是真的。但驱动量（稀缺诱导的操作化）在两套来源里用的是不同操纵（时间压力 vs 金钱稀缺 vs 农田收成节律），没有统一锚定，"带宽"和"目标屏蔽"各自的承重锚没有真的被独立测量过——它们是文献里分别被测的，作者只引用了源头测量。
    7. 现实锚事实核查 — 命中较重。Mani et al. (2013) 的甘蔗农民实验是真实存在的（Science, 339, 976-980），且效应方向正确。但该实验测的是一般流体认知（IQ 类测试、Raven 等），不直接测"目标屏蔽"。作者把它当作"带宽缩减"的承重锚 OK，但当作"目标屏蔽"的承重锚就是溢出。Mullainathan & Shafir (2013) 的《稀缺》是科普书+论文集，不是单篇可证伪锚。Shah et al. (2002) 的目标屏蔽范式是真实的，但与"资源稀缺"的操作化不同（他们用的是目标激活词启动），把两者连起来是叙事。
    8. 条件是下定义还是做预测 — 命中。"此组合机制在短期内有适应价值，但代价是长期目标被系统性忽略"——"系统性忽略"是一个相当强的预测。但可证伪条件里没有给"系统性"的量化阈值（多少比例、效应量下限），"被系统性忽略"在测量上如何与"被理性再分配"区分？这是条件偏定义。
    9. 枚举穷尽 — 未命中。推论未声称 N 类枚举。
    10. primary_suspect 指对 + 平凡化检查 — 命中。文件没明确指出"primary suspect"。我指认：真正的最致命软肋是"串行组合"声明——它是本推论的卖点（区别于纯 Mullainathan/Shafir 文献的"带宽税"），但没有任何机制证据。如果把"串行组合"降级为"两者并存"，本桥接砖就基本等价于 BR-L2-027（注意力稀缺与信息过载）+ Mullainathan/Shafir 文献综述，失去独立存在价值。这是被泛化稀释成相邻理论常识的风险。
    11. 口径完整注册 + 歧义反向裁决 — 部分命中。预注册的目标排序自评是注册了，但"主导目标""次要目标"在实验里如何操作化（多少个目标？多长时间窗口内的偏好？）没有注册。"稀缺诱导"在两套来源里操作化完全不同，也没有统一口径。
    12. 数据源同根冒充多源独立 — 命中。两个声称来源（cognitive_science 与 behavioral_economics）作者自评独立性 0.5，理由是"共享认知架构假设且实验方法同源"。这正是同根风险的典型——Shah 系和 Mullainathan/Shafir 系在文献网络里通过共同作者、共同会议、共同综述相互引用，独立性再扣一档到 0.3 是合理的。加权总强度 1.8 是压线达标，自评有点松。
    13. API 可及性冒充认识论独立性 — 未命中。IEA 调查是文献引用，没有 API 滥用问题。
    14. 反向失败模式缺失 — 命中。推论注册了"怎么被证伪"（带宽缩减不成立、目标屏蔽不成立等），但没注册"反向失败模式"。可能的反向失败是"稀缺者反而更系统地规划长期目标"——这在彩票中奖者、债务减免研究里都有迹象（突然有钱反而开始存钱/规划），以及"稀缺通过强迫排序反而提高了目标清晰度"（Anandi Mani 等人后续研究里有讨论）。作者没注册这个反向模式，应当 should 级标注。
    15. Bootstrap 限定缺失 — 未命中。本桥接砖是实验室+田野证据，不涉及冷启动问题。
    16. 验证对象存在性未标注 — 未命中。验证对象（实验室稀缺诱导）是可观测的常态实验范式，不存在空集问题。
  counterexample_hunt: |
    构造了两个候选反例，都没净杀，但揭出过度伸张。

    候选 1（潜在净杀 → 被消化）：**彩票中奖者的长期规划行为**。Kearney et al. (2021, Management Science) 等多个研究发现，马萨诸塞州彩票中奖者在收到 5–10 万美元级别奖金后，**长期资产（金融资产、住房自有率）显著上升，而非下降**。如果按 BR-L2-035 的字面预测，"稀缺"突然消失应该让"长期目标被系统性忽略"反弹回来——实际上看到的恰恰相反：长期目标突然被投资。消化机制：彩票中奖属于"资源从稀缺到非稀缺的瞬时跳变"，触发的是"现在有本钱了反而敢做长期规划"，不是"稀缺屏蔽目标"的反向。这是定义边界问题，不是净杀。但揭出过度伸张：本推论暗示"稀缺→目标屏蔽"是一种稳态关系，没有为"稀缺解除后的反弹效应"留位置。

    候选 2（潜在净杀 → 被消化）：**斯堪的纳维亚高福利国家的低收入家庭**。挪威、丹麦等国的低收入家庭在强福利兜底下，"稀缺"被制度性削弱（医疗、教育、养老都兜底），按 BR-L2-035 的预测，长期目标（教育、健康投资）应该显著好于美国同类收入组。实证看确实如此（OECD 数据），但这同样被"目标排序预设差异"消化——这些家庭的目标结构本身就因制度不同被重塑了，不是 BR-L2-035 的反例。

    净杀候选 3（构造但放弃）：**冥想/正念训练后的稀缺者**——若稀缺者经过认知训练后反而比非稀缺者在次要目标上表现更好，这能证伪"屏蔽是必然串行"。文献不足，未能落地为可证伪锚。

    反例猎捕结论：未找到 scope 内的活净杀，但揭出**过度伸张**——(i) "稀缺→系统性忽略长期目标"作为稳态预测没给"稀缺解除后的反弹"留位置；(ii) "次要目标被压制"是默认结局，没给"稀缺者主动理性再分配"留机制空间。两条都标记 should-级要求作者说明边界。
  required_fixes:
    - "1) 把\"串行组合\"声明降级或给出时序机制证据：要么提供\"先带宽缩减、再目标屏蔽\"或反之的实验证据，要么删除\"串行\"二字改为\"并行共存\"，承认本桥接砖是叙事性合成而非机制性发现。"
    - "2) 在证伪条件里增加一个 2×2（稀缺诱导 × 任务与预注册目标的相关性）设计的具体预测值：主导目标相关任务 vs 无关任务 × 稀缺诱导 vs 控制，四格的预期方向与效应量下限必须注册，否则\"带宽\"和\"目标屏蔽\"两套机制无法被独立证伪。"
    - "3) \"系统性忽略长期目标\"必须给出可证伪的操作化：要么指定效应量阈值（如同类长期投资行为低于控制组多少 SD），要么改为弱承诺（\"削弱\"而非\"系统性忽略\"），并注册\"被理性再分配\"作为竞争解释的判别条件。"
    - "4) IEA 自评需重做：作者自评 cognitive_science 与 behavioral_economics 独立性 0.5 偏高，按\"共享认知架构+实验方法同源+共同综述网络\"扣到 0.3 更诚实；建议引入第三个真正独立来源（如发展心理学的童年稀缺纵向研究、或经济史的 famine cohort 研究）以达到 verified 的稳健门槛。"
    - "5) 注册反向失败模式：在 falsifiability 里增加一条\"稀缺者反而比非稀缺者在长期目标上投资更多\"作为竞争预测，并指定如何与\"目标排序预设差异\"区分（例如预注册目标类型、纵向追踪稀缺状态变化前后的同一个人）。"
  oneline: |
    核心方向有经验支撑，但"串行组合"是无证据的叙事焊接、2×2 机制拆分未注册、IEA 自评偏松、反向失败模式缺失，差 verified 四口气。

round_3:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 3, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（目标屏蔽+带宽缩减并行共存）有真实经验支撑，2×2 设计预测注册了具体效应量阈值，预注册目标排序的反推豁免做得不错，反向失败模式 (d) 注册完整。挡住 verified 的关键缺陷：
    （1）【required】IEA 调查的独立性矩阵存在红旗 12 同根高折扣伪装问题——三对来源全部 0.3 折扣，等于一源同根加两个变体假装三源独立，必须拆分真正的独立测链或重新计算 IEA；
    （2）【should】"主导目标相关任务"边界定义缺口径细则——边界案例（任务内容提到该目标 vs 任务结构激活该目标）的方向性裁决规则需补；
    （3）【should】并行共存机制缺乏直接同时测两机制的实证支撑——理论推断 vs 实证发现需诚实标注；
    （4）【should】证伪 (d) 的"目标排序预设差异"排除条件缺操作细则（如跨文化样本的目标排序条目如何预注册、如何保证不事后选择）。
    反例猎捕结果：印度甘蔗农民反弹案例被并行框架消化（窄化+总量缩减并行解释）；东亚储蓄率高反例被"集体主义预设偏好"消化但暴露预注册不严；神经科学缺乏同时测两机制的实验，揭出并行性的实证支撑薄弱。
  red_flags: |
    1. brick=conclusion — 未命中。Shah et al. (2002) 目标屏蔽 + Mullainathan/Shafir (2013) 稀缺理论是独立经验文献，非窄化砖。
    2. 逐格判空 — 未命中。2×2 预测注册了具体效应量阈值（d≥-0.2, d≥0.5, η²≥0.06），非同义反复。
    3. 测量轴正交 — 部分命中。"主导目标"在稀缺情境下被稀缺本身重新定义时存在潜在焊点，但预注册前测目标排序做了隔离，未致命焊死。should 级。
    4. 射程/排除钩子独立于结果 — 部分命中。证伪 (d) 的"目标排序预设差异"排除条件缺操作细则。should 级。
    5. 分类判据档位匹配 — 未命中。任务二分+表现连续测，匹配合理。
    6. anti-talisman 真兑现 — 未命中。预注册要求主导目标前测+元认知调节的第三方测量，是真独立钩子。
    7. 现实锚事实核查 — 未命中。Mani et al. (2013) 农田实验、Evans & Schamberg (2009) 纵向研究，引述准确。
    8. 条件是下定义还是做预测 — 未命中。证伪 (a)-(f) 均为可检验经验预测。
    9. 枚举穷尽 — 不适用。
    10. primary_suspect 指对 + 平凡化检查 — 命中 should 级。文件未自认最弱腿。最弱腿实为"稀缺如何选中哪个目标成为主导"——目标激活这一步证据弱于屏蔽步骤本身。压成"穷人顾眼前"是常识但桥接砖给出了非平凡检验框架，未被平凡化掉。
    11. 口径完整注册 + 歧义反向裁决 — 部分命中。"主导目标相关任务"定义缺细注册：任务内容相关 vs 任务结构激活该目标的边界未明。should 级。
    12. 数据源同根冒充多源独立 — **命中 required 级**。IEA 矩阵三对全部 0.3 折扣，是一源同根+两个同根变体的伪装，三个 0.3 不能算三源独立。判 L4-009 同根案例适用。
    13. API 可及性冒充认识论独立性 — 不适用。
    14. 反向失败模式缺失 — 未命中。证伪 (d) 注册完整，含与目标排序预设差异和理性再分配的区分要求。
    15. Bootstrap 限定缺失 — 不适用。
    16. 验证对象存在性未标注 — 未命中。实验室+田野研究广泛存在，非空集。
  counterexample_hunt: |
    反例 1（印度甘蔗农民 Raven 矩阵反弹超基线）：构造稀缺移除后认知反弹>对照中位的反事实。**被消化**——并行框架以"窄化（屏蔽）+总量缩减（带宽）"并行解释吸收了该现象，但窄化与总量缩减的区分需同时测，未做。
    反例 2（东亚高储蓄率+稀缺状态长期目标投资强）：构造证伪 (d) 的潜在净杀案例。**被消化但暴露预注册不严**——可由"集体主义文化对长期目标的预设偏好"解释（这正是证伪 (d) 排除条件之一），但作者未细化跨文化样本的目标排序条目预注册规则，边界裁定方向性弱。
    反例 3（神经科学缺乏同时测两机制的实验）：构造"并行共存"主张的实证支撑检验。**揭出过度伸张**——Shah 目标屏蔽实验用 Stroop 类任务，Mani 带宽实验用 Raven 矩阵，无同一实验同时测两机制的实证。并行性目前是理论推断而非实证发现，应在推论中诚实标注。
  required_fixes:
    - "1) IEA 调查必须重做：三个 0.3 折扣的同根伪装要拆开，至少两个 pair 应该是真正独立的不同测量链（如实验范式独立、样本独立、理论框架独立），否则三源不构成\"多源验证\"，需重新计算 IEA 是否真过 1.8 门槛。"
    - "2) 【should】\"主导目标相关任务\"边界口径需细注册：明确任务内容相关 vs 任务结构激活的判据，并给出边界案例的方向性裁决规则（参照红旗 11 判例）。"
    - "3) 【should】并行共存机制缺同时测两机制的实证支撑，应在推论中诚实标注\"并行性目前为理论推断\"，并补充若未来 2×4 设计（同实验同时测屏蔽+带宽）未观察到交互效应的证伪条件。"
    - "4) 【should】证伪 (d) 的\"目标排序预设差异\"排除条件缺操作细则，需补充跨文化样本的目标排序条目预注册规则和事后选择禁区的边界裁定。"
  oneline: |
    核心机制框架成立、证伪条件扎实，但 IEA 同根高折扣伪装多源独立是 required 级硬伤，并行性的实证支撑薄弱需诚实标注——差一口气 verified。
