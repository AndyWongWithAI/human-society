id: ADV-REVIEW-BR-L2-035
type: adversarial_review
reviews: BR-L2-035
layer: L2-bridging
target: BR-L2-035
target_term: 稀缺状态下的目标屏蔽效应 (Goal Shielding Under Scarcity)
rounds: 1

人话摘要: |
  对 BR-L2-035(稀缺状态下的目标屏蔽效应)的 round-1 独立对抗审查。
  裁 needs_revision:核心直觉(资源稀缺→认知聚焦于紧迫目标→次要/长期目标被抑制)
  在经验上有方向性支撑,反例猎捕未发现能净杀核心的干净案例。但存在 4 条 required 缺陷:
  (1)证伪口径未注册——"大规模""显著""可复现"全无阈值;
  (2)机制混淆——声称的目标屏蔽(goal shielding=目标竞争)与引用证据的认知带宽
  (bandwidth=资源耗竭)是不同的因果路径,桥接砖未区分;
  (3)"最紧迫目标"的事后柔性指定掏空了长期目标抑制预测的可证伪性;
  (4)IEA/cross_verification 缺失——文件仅有 applicable_sources 而未计算 IEA 分数,
  无法判断多源独立支撑是否达标。

round_1:
  reviewer: independent-adversarial-reviewer
  date: 2026-07-16
  verdict: needs_revision
  verdict_note: |
    本桥接砖的核心直觉——资源稀缺会无意识地将认知资源聚焦于当前最紧迫目标,
    同时抑制次要和长期目标——在经验上有方向性支撑。Shah, Friedman & Kruglanski (2002)
    的目标屏蔽理论在认知心理学中经过二十余年跨方法积累,是稳固的机制模板;
    Mullainathan & Shafir (2013) 的稀缺-认知税研究为"稀缺压缩认知空间"这一方向
    提供了田野与实验的双重证据。反例猎捕未发现能干净杀灭核心机制的经验案例——
    最尖锐的挑战(东亚高储蓄-贫困并存、自愿简朴者的长期聚焦)均被机制的柔性解释力
    消化,但恰恰是这种"能解释任何结果"的柔性,暴露了机制的证伪力不足。

    四条 required 级缺陷阻止 verified 裁决:

    1.【证伪口径缺失——REQUIRED】
    falsifiability 段的三条证伪条件使用了"大规模""可复现的观测""显著差异"等未注册
    阈值的术语。多少样本算"大规模"(N≥?)、多大的效应量算"显著"(d≥?)、多少次独立
    复现算"可复现"(k≥?)——全未注册。按 L4-009 判例,阈值连同分子/分母/测量口径
    必须一次性注册。未注册的证伪条件是"永远约等于明天"的护身符——任何不利证据
    都可被归为"规模不够大"或"尚未充分复现"而排除。此为口径注册红旗(红旗 11)的
    直接命中。

    2.【机制混淆:目标屏蔽≠认知带宽——REQUIRED】
    桥接砖在 statement 中声称的机制是目标屏蔽(goal shielding)——激活主导目标时自动
    抑制竞争性目标,认知资源在目标间重分配。但全文引用权重最高的经验证据——Mani et al.
    (2013) 印度蔗农实验、Mullainathan & Shafir (2013) 的认知税——主要证明的是认知
    带宽缩减(cognitive bandwidth reduction):稀缺导致可用的总认知资源减少,所有认知
    任务表现下降。两条机制做出不同的预测:
    - 目标屏蔽:次要目标任务表现下降,但主导目标任务表现保持或增强
    - 带宽缩减:所有认知任务表现下降(包括与稀缺直接相关的任务)
    桥接砖将此二者混为一谈,而证伪测试从不区分它们。若实证发现"稀缺组在所有任务上
    均下降"(带宽缩减模式)而桥接砖以此作为目标屏蔽的证实,则推理链存在概念偷换。
    需在 core_mechanism 中厘清:(i)声称的是目标竞争机制(goal shielding),还是资源
    耗竭机制(bandwidth reduction),还是二者的串行组合;且(ii)对应的证伪测试必须能
    区分这两种机制。

    3.【"最紧迫目标"的事后柔性指定——REQUIRED】
    桥接砖的核心因果链:稀缺→目标屏蔽→认知资源优先分配给"当前最紧迫的目标"→抑制
    次要/长期目标。但"当前最紧迫的目标"如何被识别?若由观察到的行为反推("他做了什么,
    什么就是他的最紧迫目标"),则命题陷入不可证伪循环:
    - 若稀缺个体追求短期目标(冲动消费)→"紧迫目标是当下生存,隧道效应成立"
    - 若稀缺个体追求长期目标(为子女教育存钱)→"紧迫目标已切换为长期安全,
      目标屏蔽仍然成立"
    两种相反的行为模式均被同一机制"消化",无需调节命题。这使"长期目标被系统性抑制"
    这条方向性预测在操作层面不可证伪——因为"紧迫目标"的认定总是事后的,且总与
    观察到的行为对齐。需预注册一个独立于行为的"紧迫目标"识别方法(如稀缺诱导前的
    目标排序自评、独立于实验任务的目标激活测量),使"主导目标是什么"在观察行为前
    已被锁定。此外,限制段("不否认个体存在元认知调节能力")进一步扩大了逃生舱——
    任何反例均可归因于元认知调节的介入。此条与 mechanism_conflation 合力时尤其致命:
    目标屏蔽+元认知逃逸的组合可以消化任何行为模式。

    4.【IEA/cross_verification 缺失——REQUIRED】
    桥接砖列出了 applicable_sources(cognitive_science + behavioral_economics),
    但无 cross_verification 段,无 IEA 分数计算,无来源独立系数折价,无仪器折扣披露。
    按 L2 验证规则,verified 要求 IEA≥1.8(下限 1.2)。当前桥接砖的独立来源支撑量
    无法评估——不仅是"未达到"的问题,是"未被测量"。两条来源之间的独立性本身存疑:
    cognitive_science(目标屏蔽)和 behavioral_economics(稀缺-认知税)共享核心认知
    架构假设(有限注意力、双加工理论)和实验方法论(实验室行为实验),独立性可能低于
    default 0.6。但此判断在 IEA 调查执行前只能是假设。此缺陷需通过运行 IEA 调查
    (iea_survey.py)生成 cross_verification 段来修复。

    四条 required 均可通过定向修订修复:注册口径、厘清机制、锁定紧迫目标识别方法、
    运行 IEA 调查。不是结构塌陷,故判 needs_revision 而非 rejected。

    附 5 条 should:反向失败模式未注册(红旗 14)、自愿/非自愿稀缺未区分、急/慢性稀缺
    机制混同、锚源研究复制争议未标注、L1 锚定过弱(仅引概念未引公理/定理)。

  red_flags:
    brick_is_conclusion:
      hit: false
      detail: |
        目标屏蔽×稀缺的隧道效应不是 L1 定理的复述。CONCEPT-goal 定义"目标"的存在,
        CONCEPT-agent 定义"行动者"的概念,CONCEPT-resource 定义"资源"的有限性——
        三者均未声称"资源稀缺时会无意识激活目标屏蔽机制并系统性抑制长期目标"这一
        具体的经验命题。AXIOM-002(信息熵增)说信息不维护会衰减,不涉及稀缺-认知
        的动力学。本命题将认知心理学的目标屏蔽理论与行为经济学的认知税研究结合,
        产生了一个非 L1 可推导的经验主张。非平凡经验内核成立。

        但与体系内其他桥接砖的关系值得注意:BR-L2-001(有限理性)覆盖了"认知资源有限"
        这一底层前提,BR-L2-027(注意力稀缺与信息过载)覆盖了"注意力有限→判断力下降"。
        本桥接砖的核心增量是"稀缺状态下的自动化目标屏蔽机制及其对长期目标的系统性挤压"——
        这个增量是真实的,但桥接砖未在 statement 或 relation_to_system 中定位自己与
        BR-L2-001/BR-L2-027 的边界(是平行互补、是细化、是竞品?),列为 should。

    empty_cell_tautology:
      hit: false
      detail: |
        核心空格预测:若稀缺不触发目标屏蔽(即认知资源的分配与稀缺状态无关),则
        (a) 实验室稀缺组与对照组在次要目标相关任务上应无差异;
        (b) 现实稀缺个体应在长期目标投资上与富裕个体无差异或更优;
        (c) 跨文化一致。
        这些都是可观察的反事实,不是"否定它就不成立"的定义性真理。对称世界(稀缺
        不影响目标优先级分配)在逻辑上自洽。空格有经验内容,非空洞。

    measurement_axis_orthogonality:
      hit: false
      detail: |
        在实验室范式中:自变量(稀缺状态)由实验者独立操纵(时间限制/预算约束),
        因变量(次要目标任务表现/长期目标关注度自评)在独立的测量环节收集。
        IV 的设定不依赖于 DV 的读数——这与 DED-007 的"分母用实际获授者"型焊点
        有本质区别。Mani et al.(2013)的蔗农研究中,IV(收成前/后)由农业日历决定,
        DV(认知测试)独立施测——这条关键锚的 IV-DV 确为正交。

        但存在一个次级风险:若"最紧迫目标"由行为反推(见 required_fix #3),
        则 IV 的"目标优先级"维度与 DV 的行为表现在分析层面构成循环——不过这是
        目标识别方法的问题,而非 IV-DV 测量轴焊接,级别不同。

    scope_exclusion_independent:
      hit: false
      detail: |
        限制段列出的排除项("不声称在所有个体中同等程度出现""不否认个体存在
        元认知调节能力""不声称目标屏蔽总是负面的")在原则上可独立于结果判断:
        - 个体差异:可通过个体差异变量(如 working memory capacity / trait
          self-control )事前测量,非事后看结果再归类
        - 元认知调节:可通过实验指导语(如"请刻意关注长期目标")独立操纵
        - 负面性:可通过独立于任务表现的结果测量(如事后自我报告的情绪/满意度)
          判断"是否负面"
        排除方向独立于结果,未开启事后 cherry-pick 通道。

        但"元认知调节"逃逸舱需收紧——见 required_fix #3。

    classification_granularity:
      hit: false
      detail: |
        桥接砖处理连续量(稀缺程度、认知表现、目标关注度),未强行将连续体切为
        离散箱。不适用 DED-006 式的分档失配红旗。

    anti_talisman:
      hit: false
      detail: |
        三条证伪路径在原则上是可事前测的真证伪路径:
        (a) 稀缺组=或>控制组→核心被削弱或推翻。这是可预注册的实验假设。
        (b) 现实稀缺个体反而更投长期→核心被推翻。可操作化为可观测的人口统计指标。
        (c) 跨文化失败→命题范围被限定,或核心被推翻(若在多个文化中系统失败)。

        三条均不依赖结果反推前件。证伪的结构条件满足。

        但存在两处 talismanic 风险:
        (i) 证伪口径未注册(required_fix #1)——"大规模""显著""可复现"永远是移动靶;
        (ii)"最紧迫目标"的事后指定(required_fix #3)——可消化任何方向的行为证据。
        这两条合力使命题在操作层面更难被击穿,但它们是口径/方法问题而非结构性
        不可证伪(不像 DED-004 的"否定它就说不通")。

    reality_anchor_fact_check:
      hit: false
      detail: |
        独立复核桥接砖引用的关键经验锚:
        (1) Shah, Friedman & Kruglanski (2002, Psychological Review) 目标屏蔽理论——
        发表属实,Google Scholar >2500 引用,是目标系统理论的核心文献。实验证明激活
        一个目标会自动抑制竞争目标,机制成立。
        (2) Bargh & Gollwitzer (1994, 目标自动激活)——发表属实,但 Bargh 的实验
        方法在后来的直接复现运动中有争议(priming 效应的 replicability 问题)。
        此文献在目标自动激活领域的影响毋庸置疑,但 priming 范式的 replicability
        争议应被标注。
        (3) Mullainathan & Shafir (2013, 《稀缺》)——出版属实,影响力巨大但属于
        科普-学术交叉作品。书中引用的实验和田野研究大多经同行评审,但书本身的
        综合叙事可能高于单篇论文的证据标准。作为 IEA 锚源的引用应指向原始论文
        而非书籍。
        (4) Mani et al. (2013, Science) 蔗农研究——发表属实,是稀缺-认知领域的
        标志性研究。但需要标注:此研究的效应量在后续独立复现和元分析中有争议
        (详见 should_fix #4)。核心发现(贫困状态与认知功能下降的因果关联)在方向
        上被后续研究支持,但效应量可能小于原始报告。

        无致命事实错。所有引用发表属实,方向正确。但 Bargh priming 争议和
        Mani et al. 效应量争议应在 applicable_sources 的 rationale 中标注,
        列为 should。

    definition_vs_prediction:
      hit: false
      detail: |
        "稀缺→目标屏蔽→长期目标抑制"是经验主张,非定义性真理。在逻辑上,稀缺
        也可以触发相反的反应——如"穷则思变"式的长期导向增强,或"破罐破摔"式的
        全面放弃(非选择性抑制)。这三种反应(短期聚焦/长期激活/全面放弃)在逻辑上
        均为可能——桥接砖选择其中一种并声称它是普遍的自动化反应,这是经验选择问题,
        非概念必然。落入经验预测范畴,非纯定义。

    enumeration_exhaustiveness:
      hit: false
      detail: |
        桥接砖未声称可枚举的物种/类别划分,不适用 DED-008 红旗。

    primary_suspect_accuracy:
      hit: false
      detail: |
        L2 桥接砖无 formal primary_suspect 字段(L3 要求),但按红旗精神审查最弱腿:

        文件自识的弱项:限制段承认"不声称在所有个体中同等程度出现,不否认个体存在
        元认知调节能力"——隐式承认了个体差异和主动调节是两个潜在的调节变量。
        此自识准确,但未被视为"缺陷"而是"诚实限制"。

        本审查者识别的更致命软肋(文件未自认):
        (i) 机制混淆(goal shielding vs bandwidth)——见 required_fix #2。
        这是最致命的——若核心机制的定义不清,所有经验证据的归属都悬空。
        (ii) "最紧迫目标"的认法循环——见 required_fix #3。
        若"什么是最紧迫目标"由行为反推,则命题无法被行为证据证伪。
        (iii) cognitive_science 和 behavioral_economics 的独立性可能被高估——
        两者共享核心认知架构假设(有限注意力/双加工理论)和 lab 实验方法论,
        在"稀缺如何影响认知"这一具体问题上并非独立学科通道。见 should。
        (iv) 桥接砖仅引 L1 概念(CONCEPT-goal/agent/resource),未引任何 L1
        公理或定理——它更像一个独立经验发现,而非"从 L1 公理推至经验世界"的桥。
        见 should_fix #5。

    caliber_registration:
      hit: true
      detail: |
        本红旗命中——"口径完整注册"要求阈值连同分子/分母/测量口径一次性注册,
        且反例出现后的事后口径选择一律反向裁决(判例 L4-009)。本命题在该维度
        存在严重缺口:

        falsifiability 段的三条证伪条件:
        (a) "大规模、可复现的观测"——"大规模"的最小 N 是多少?"可复现"的独立
        复现次数 k 至少为几?复现的严格程度(直接复现/概念复现/跨实验室复现)?
        (b) "长期处于稀缺状态的个体反而比非稀缺个体更倾向于投资长期目标"——
        "长期处于稀缺"的时间窗口是多少(月?年?)?"更倾向于"的效应量阈值是多少
        (d≥?OR≥?)?"投资长期目标"的具体操作化指标有哪些(储蓄率/教育年限/创业
        启动率——桥接砖未列)?
        (c) "跨文化或跨人群样本中不成立"——"不成立"的判据是什么(效应方向反转?
        效应不显著?效应显著但方向一致只是量级小?)?需多少文化/人群样本?

        全无注册。按 L4-009 判例精神:若反例出现后桥接砖试图补充定义这些阈值
        来消化反例,此补充一律按不利于桥接砖的方向裁决——因为预注册漏洞的成本
        必须由推论承担。列入 required_fix #1。

        此外,"限制"段的"不声称在所有个体中同等程度出现"使得任何不完美的组间
        差异都可被归因于个体差异而被稀释——这不是口径缺口(是个体差异 scope
        的诚实注册),但配合未注册的效应量阈值时,使命题几乎无法被 group-level
        实验证伪:任何小于某个(未注册)阈值的组间差都可被归因为"个体差异范围的
        正常波动"。

    data_source_cloning:
      hit: false
      detail: |
        桥接砖引用的两个学科(cognitive_science + behavioral_economics)使用独立
        的实验数据和独立的研究者社群,不属于 CNBS/WB/IMF 式的同源多次发布。
        不适用数据源同根折扣。

    api_accessibility_masquerade:
      hit: false
      detail: |
        桥接砖不依赖 API 可及的数据源。不适用此红旗。

    reverse_failure_mode:
      hit: true
      detail: |
        本红旗命中(should 级)——"反向失败模式缺失"要求注册"驱动量的变化是否
        可能产生与被预测方向恰好相反的观测结果?"(判例 DED-039/047)。

        桥接砖预测:稀缺→短期目标优先、长期目标抑制。反向失败模式:稀缺→长期
        目标被【激活】而非抑制——由于稀缺使长期安全/保障的【显著性】上升,
        长期目标反而成为被目标屏蔽保护的"最紧迫目标"。此时桥接砖的机制仍可
        "解释"这个结果(说"紧迫目标已切换为长期"),但解释方向与原始预测相反。

        东亚高储蓄文化(贫困→高储蓄率→高教育投资)是一个可能的实证场景:
        若在此场景中,稀缺不仅没有抑制长期目标,反而系统性地【增强】了长期目标
        追求(通过将长期安全推至最高优先级),则桥接砖应当注册这个反向模式:
        - Δ长期目标追求>0(而非<0)是反向失败
        - Δ长期目标追求<0 是正向预测(隧道效应)
        - 两者不可同时被同一无条件的"目标屏蔽"机制容纳而不调整命题

        当前桥接砖未注册此反向模式。列入 should_fix #1。

    bootstrap_limitation:
      hit: false
      detail: |
        桥接砖涉及个体认知机制(不涉及技术中介的社会形态),不适用 Bootstrap 限定
        红旗(判例 DED-039)。无需区分冷启动 vs 稳态。

    verification_object_existence:
      hit: false
      detail: |
        稀缺及其认知效应在实验室和现实世界中均可大量观测,验证对象非空集。
        不适用此红旗。

  iea_independence_check:
    status: not_conducted
    detail: |
      桥接砖的 YAML 文件含 applicable_sources(cognitive_science + behavioral_economics)
      但缺少 cross_verification 段——无 IEA 分数计算,无来源独立系数折价,
      无仪器折扣披露,无多源投票记录。按 L2 验证规则,verified 要求 IEA≥1.8
      (下限 1.2),当前状态无法判断多源独立支撑是否达标。

      独立审查者对两条来源的独立性做初步评估(待 IEA 调查正式确认):

      cognitive_science (目标屏蔽理论):
      - 代表文献:Shah, Friedman & Kruglanski (2002); Bargh & Gollwitzer (1994)
      - 方法论:实验室认知实验,priming 范式,反应时+任务表现测量
      - 核心假设:目标在心智中以竞争性知识结构表征,激活一个自动抑制其他

      behavioral_economics (稀缺-认知税):
      - 代表文献:Mullainathan & Shafir (2013); Mani et al. (2013)
      - 方法论:实验室+田野实验,认知测试+经济决策任务测量
      - 核心假设:稀缺消耗认知带宽,降低一般认知表现

      独立性评估:两条来源的"血统"确实不同——目标屏蔽来自社会认知/动机心理学
      传统,认知税来自行为经济学/发展经济学传统。但两者共享:
      (i) 有限认知资源假设(注意力/working memory 的瓶颈)
      (ii) 实验室行为实验方法论(被试+任务+反应时/正确率 DV)
      (iii) 底层认知架构(双加工理论/自动 vs 控制加工)
      对于本命题的具体主张("稀缺→认知聚焦→长期目标抑制"),两源的独立程度
      可能低于完全异源学科(如认知科学 vs 经济史学)的 0.6。初步估计认知科学
      与行为经济学在这一特定命题上的独立系数可能在 0.35-0.5 之间(共享理论
      框架+实验方法论,研究者社群有交叠),低于 default 0.6。

      若 cognitive_science 为锚源(weight 1.0),behavioral_economics 为次源:
      IEA = 1.0 + 0.35~0.5 = 1.35~1.5 —— 低于 verified 线 1.8,但可能
      高于 weakly_verified 下限 1.2(取决于独立系数的最终估值)。

      上述为审查者预判,非正式 IEA 计算。正式 cross_verification 段须通过
      iea_survey.py 生成。列入 required_fix #4。

    instrument_correlation:
      disclosed: false
      detail: |
        桥接砖无 cross_verification 段,因此没有仪器折扣披露。按 independence-model
        instrument_correlation.discount_rule 的要求,当 L2 桥接命题的 cross_verification
        由单一 LLM 执行时,必须披露"报告的 IEA 是学科独立性上限,仪器有效独立性
        低于此"。此披露将在 IEA 调查完成后追加至 cross_verification.verdict_note。

  counterexample_hunt:
    method: |
      主动构造/搜寻能证伪核心主张的跨文化/历史/跨情境经验案例。核心主张:
      资源稀缺无意识地激活目标屏蔽→认知资源优先分配给当前最紧迫目标→次要目标
      和长期目标被系统性抑制→隧道效应(短期适应,长期代价)。逐一评估净杀 vs
      被消化 vs 揭示过度伸张。
    cases:
      - case: 东亚高储蓄-贫困并存——稀缺下长期目标反被激活
        description: |
          中国(1990-2010 高速增长期)、日本(1950-1970 战后复兴期)、韩国(1960-1980
          工业化期)、新加坡(1965-1990 建国期)在广泛贫困阶段,居民储蓄率均达 20-40%,
          远高于同期富裕国家。贫困家庭为子女教育和住房延迟消费十年以上——这是
          长期目标在稀缺状态下的系统性【激活】而非抑制。
        challenge: |
          若稀缺→目标屏蔽→抑制长期目标成立,东亚贫困家庭应表现出更高比例的短期
          冲动消费和更低的教育/储蓄投资。实证方向恰好相反——稀缺伴随的是极端
          的长期导向和延迟满足。
        defense_available: |
          桥接砖可辩称:在东亚文化中,"子女教育"和"家庭长期安全"被编码为最紧迫目标,
          目标屏蔽保护了这些目标,压缩的是个人休闲/消费等次要目标。这与目标屏蔽
          机制不矛盾——只是"什么是最紧迫目标"的文化差异。
        evaluation: |
          此案不构成净杀——桥接砖的机制足以消化(通过"最紧迫目标"的文化相对性)。
          但消化方式恰好暴露了 required_fix #3 的核心问题:若"最紧迫目标"可以
          由文化任意指定(今天是"当下生存",明天是"子女教育"),则命题无法对"长期
          目标是会被抑制还是被保护"做出可证伪的预测——答案永远取决于"紧迫目标"
          的文化定义,而这个定义可以在看到行为结果后调整。
        verdict: 被消化,但揭示机制的事后柔性(见 required_fix #3)

      - case: 战争配给下的长期社会规划——Beveridge 报告
        description: |
          二战期间英国实施严格食物配给(1940-1954),民众经历极端物质稀缺。
          同期,贝弗里奇委员会(1941-1942)起草了《社会保险与相关服务》报告,
          设计了 NHS 和福利国家制度——这是极长期的制度规划。法国在战后
          (1945-1946)同样在物资匮乏期启动了"计划总署"的五年经济计划。
        counter_claim: |
          极端稀缺没有压制长期规划——反而催生了二十世纪最具远见的长期制度设计。
        evaluation: |
          此案涉及集体/制度层面的长期规划,而桥接砖声称的是个体层面的自动化认知
          机制。两者层面不同——委员会的长期规划是少数精英在有组织资源支持下的
          审慎行为,不直接检验个体在稀缺下的自动化认知偏向。不构成净杀。
        verdict: 不适用(层面错位——制度规划≠个体认知)

      - case: 自愿简朴者的长期目标增强
        description: |
          佛教僧侣、方济各会修士、自愿极简主义者选择物质稀缺作为生活方式。
          他们报告的长期精神/道德目标投入远超普通人群。若稀缺必然触发短期聚焦,
          自愿简朴应导致精神目标的退化——事实完全相反。
        challenge: |
          falsifiability (b) 的措辞("长期处于稀缺状态的个体")不区分自愿/非自愿
          稀缺——自愿简朴者满足"长期稀缺"条件,但他们表现出增强的长期目标追求。
        defense_available: |
          桥接砖可辩称:(i)自愿稀缺不同于非自愿稀缺——可控感改变了稀缺的心理编码;
          (ii)这些人的"最紧迫目标"恰恰是精神/道德目标,目标屏蔽保护了它;
          (iii)元认知调节(冥想/祈祷)覆盖了自动化机制。
        evaluation: |
          不构成净杀——有 plausible defenses。但桥接砖的 falsifiability 条件
          未事先排除自愿稀缺,而在反例出现后才做区分——按 L4-009 的事后口径
          反向裁决原则,成本应由命题承担。此案揭示了 scope 边界未预注册的问题。
        verdict: 揭出 scope 过度伸张(自愿/非自愿稀缺未区分,见 should_fix #2)

      - case: 移民第一代的延迟满足——稀缺下的长期投资
        description: |
          第一代移民常同时面临经济稀缺(低收入、长工时)、时间稀缺(多份工作)、
          社会稀缺(语言障碍、社会网络缺失)。但他们系统性地将资源投入子女教育——
          延迟自身消费数十年。美国移民子女的教育向上流动率高于本土同龄人
          (Card 2005; Chetty et al. 2020)。
        challenge: |
          多重稀缺叠加,但长期目标(子女教育)被系统性追求而非抑制。
        evaluation: |
          同 case #1——"子女未来"可被编为最紧迫目标,被目标屏蔽保护而非抑制。
          机制可以消化。不构成净杀,但再次暴露"最紧迫目标"指定的事后柔性。
        verdict: 被消化,强化 required_fix #3 的紧迫性

      - case: 稀缺增强域内决策——挑战"认知带宽全面下降"
        description: |
          Shah, Mullainathan & Shafir (2012, Science) 的稀缺实验表明:稀缺确实
          导致"过度借用"(over-borrowing),但稀缺被试在与其稀缺领域直接相关的决策
          上反而表现更好(更有效地利用有限资源)。这与"认知带宽全面下降"的预测
          矛盾——稀缺在某些领域提升、而非降低认知表现。
        challenge: |
          这是挑战机制(bandwidth reduction),而非目标屏蔽。但桥接砖将两者混用——
          若机制是 bandwidth reduction,此案构成反例;若机制是 goal shielding,
          此案是支持(主导目标域内表现保持/增强)。区分机制在此处有直接判决意义。
        evaluation: |
          不构成净杀(可通过切换机制标签为"目标屏蔽"来消化),但揭示了
          mechanism_conflation(required_fix #2)的实务后果——同一证据在一条机制
          下是反例,在另一条机制下是支持,而桥接砖不对机制做出选择,等于对证据
          保持"赢了算我的、输了算另一条机制的"的赌场优势。
        verdict: 揭出机制混同的结构性后果(强化 required_fix #2)

    net_kill: none
    exposed_overreach: |
      三条过度伸张被揭示:
      (1) "最紧迫目标"的事后柔性指定使命题可消化任何方向的行为证据——见
      required_fix #3。
      (2) 自愿/非自愿稀缺未在 falsifiability 条件中区分——若反例出现后再区分,
      按 L4-009 判例成本由命题承担。见 should_fix #2。
      (3) 机制混同(goal shielding vs bandwidth)使证据归属可在两条机制间
      随意切换——见 required_fix #2。
    conclusion: |
      五条挑战路径逐一猎捕。未发现能干净杀灭核心机制的经验案例——最尖锐的挑战
      (东亚高储蓄、自愿简朴者、移民延迟满足、稀缺增强域内决策)均被机制消化,
      但消化的方式(通过"最紧迫目标"的事后重指定)恰恰暴露了命题的证伪力不足。

      这不是"命题是错的"——稀缺确实改变了认知资源的分配方式,这个方向性经验
      是稳固的。问题是"具体改变了什么、在什么条件下、向什么方向"——当前命题
      在这些关键点上的未指定,使它覆盖了比证据实际能分辨的更宽泛的现象空间。

      反例猎捕结论:未发现净杀,但揭示了命题当前 specification 的不足——这些不足
      本身不 kill 命题(可靠定向修订修复),但阻止 verified 裁决。

  required_fixes:
    - |
      【证伪口径注册——REQUIRED】
      在 falsifiability 段一次性注册所有阈值:
      (a) "大规模"→最小总样本 N≥?(建议 ≥200 per condition for between-subjects)
      (b) "可复现"→最少独立复现次数 k≥?(建议 ≥2,包括至少一次独立实验室/独立
      研究者团队的预注册复现)
      (c) "显著差异"→效应量阈值 d≥?(建议 ≥0.2,即 small effect;低于此则
      即便统计显著,命题的实际预测力值得质疑)
      (d) "跨文化不成立"→定义"不成立":效应方向反转(稀缺组比控制组更投长期目标)?
      效应不显著?效应显著但方向一致仅量级小?至少覆盖多少文化/人群样本?
      (e) "长期处于稀缺状态"→操作化:时间窗口≥?月/年,稀缺指标(收入/时间使用/
      主观报告)的具体测量方法
      (f) "更倾向于投资长期目标"→具体操作化指标列表(储蓄率/教育支出占比/
      延迟满足实验选择/自评长期目标重要性得分),连带分子分母定义

      按 L4-009 判例:在阈值注册后出现的反例,若桥接砖试图重新定义阈值来消化,
      此重新定义一律反向裁决(不利于桥接砖)。注册日期必须在任何系统性实证检验之前。
    - |
      【厘清机制:目标屏蔽 vs 认知带宽——REQUIRED】
      在 core_mechanism 或 statement 中:
      (i) 明确声称的是目标竞争机制(goal shielding——认知资源在目标间重分配,
      主导目标被保护、次要目标被抑制)、还是资源耗竭机制(bandwidth reduction——
      总认知资源缩减,所有任务表现下降)、还是二者的串行/交互组合(如:稀缺先缩减
      总带宽,然后在缩小的带宽内再执行目标屏蔽)
      (ii) 为选择的机制提供对应的证伪测试:若声称 goal shielding→实验应测量
      主导目标任务表现(不应下降或应增强)+次要目标任务表现(应下降);若声称
      bandwidth reduction→实验应测量全品类认知任务表现(应全面下降)
      (iii) 将 cited evidence (Mani et al. 2013, Mullainathan & Shafir 2013,
      Shah et al. 2002) 按机制分类归属——哪些证据支持 goal shielding、
      哪些支持 bandwidth reduction、哪些同时支持两者
      (iv) 若声称的是复合机制(串行/交互),需注册两条子机制的独立可分离测试
    - |
      【锁定"最紧迫目标"的独立识别方法——REQUIRED】
      在 falsifiability 段或专门的 operationalization 段预注册:
      (i) 如何在不看行为结果的前提下识别"当前最紧迫目标"?候选方法:稀缺诱导前
      的目标排序自评(如"请对以下目标按重要性排序")、独立于实验任务的目标激活
      测量(如词汇决策任务中的目标相关词汇反应时)、生态 Momentary 评估(EMA)
      中的目标提及频率
      (ii) 识别方法必须在数据收集前锁定,不允许在看了被试的行为表现后再调整
      "他的紧迫目标是什么"的判断
      (iii) 承诺:若稀缺组在预注册的"紧迫目标"任务上表现未显著优于控制组(即目标
      未被屏蔽保护),则命题在该实验中被削弱——不允许事后将"另一个目标才是真正
      的紧迫目标"作为解释
      (iv) 收窄限制段——将"不否认个体存在元认知调节能力"改为可操作化版本:
      "当实验指导语显式要求被试关注长期目标时(=元认知调节被激活),本命题预测的
      目标屏蔽效应预期减弱或消失——此为命题的限定条件,也是可独立检验的次生预测"
      这样就把救命稻草变成了可检验的附加预测。
    - |
      【运行 IEA 调查,生成 cross_verification 段——REQUIRED】
      运行 iea_survey.py 对 BR-L2-035 做正式的独立来源调查:
      (i) 确认 cognitive_science 和 behavioral_economics 在本命题上的独立系数
      (ii) 计算 IEA 分数
      (iii) 如 IEA<1.2,命题连 weakly_verified 都不够——需考虑是否追加第三来源
      (如 neuroscience/scarcity 神经影像研究、development_economics 的贫困-
      认知面板数据)
      (iv) 在 cross_verification 段中按 independence-model 要求诚实披露仪器
      折扣(单 LLM 执行→报告的是学科独立性上限,有效独立性低于此)
      (v) 如 IEA≥1.8 且独立审查 verified,可进入翻牌流程;如 IEA 在 1.2-1.8,
      应考虑 weakly_verified;如 IEA<1.2,需追加来源否则命题无法推进

  should_fixes:
    - |
      【注册反向失败模式——SHOULD (红旗 14)】
      在 falsifiability 段追加:稀缺也可能通过增强长期安全的【显著性】而将长期目标
      推至"最紧迫"位置——此时目标屏蔽将保护(而非抑制)长期目标。若实证发现稀缺组
      在长期目标任务上显著优于控制组(Δ>0,方向相反),此案构成反向失败——命题的
      "不声称目标屏蔽总是负面"不足以消化方向性反例,因为"不是负面"和"相反方向"
      是不同的逻辑层级。需注册此反向模式作为独立的证伪/削弱条件。
    - |
      【区分自愿/非自愿稀缺——SHOULD】
      在 falsifiability (b) 或"限制"段中明确:本命题的"稀缺"指非自愿、外部施加的
      资源约束(贫困、时间压力、机会缺失),不包括主动选择的简朴生活(自愿贫穷/
      极简主义/禁欲主义)。自愿稀缺者对资源的主观可控感可能逆转目标屏蔽的方向。
      此区分应在见反例前预注册——按 L4-009 判例,若区分在反例(自愿简朴者)出现后
      才做出,成本由命题承担。
    - |
      【标注锚源研究的复制争议——SHOULD (红旗 7 部分命中)】
      在 applicable_sources 的 rationale 中诚实标注:
      (i) Bargh priming 范式在 2010s 的直接复现运动中有系统性争议——目标自动激活
      效应的 replicability 证据混合。这不是否定目标屏蔽理论(Shah-Kruglanski 的
      目标系统理论有独立于 priming 范式的多方法支撑),但应诚实标注。
      (ii) Mani et al.(2013)的蔗农研究效应量在后续独立复现和元分析中有争议——
      方向性结论(贫困→认知下降)被多数后续研究支持,但效应量可能小于原始报告。
      此标注不削弱命题的核心主张(命题不捆绑特定效应量),但诚实性要求桥接砖的
      经验锚证据不隐瞒有利方向的不确定性。
    - |
      【区分急/慢性稀缺的不同机制——SHOULD】
      实验室稀缺诱导(数十分钟的时间/金钱约束)与现实慢性稀缺(数十年贫困)可能涉及
      不同的心理机制。急性稀缺可能触发应激反应(肾上腺素→注意力窄化),慢性稀缺
      可能涉及习惯化/习得性无助/适应性应对策略。桥接砖目前将两者视为同一"稀缺"
      构造的不同强度——应在 statement 或"限制"段中标注:本命题的机制主要从急性
      稀缺实验证据外推,慢性稀缺下可能存在额外的调节变量(如应对策略学习、社会
      支持缓冲、制度补偿),这些调节因素的方向和量级是目前经验上开放的问题。
    - |
      【强化 L1 锚定——SHOULD】
      当前 bridges_to 仅引三个 L1 概念(CONCEPT-goal/agent/resource),未引任何
      L1 公理或定理。L2 桥接砖的定位是"将 L1 公理/定理接到经验世界"——仅引概念
      (其本身是定义,不含动力学主张)削弱了桥接砖在体系内的结构性角色。建议:
      考虑将 AXIOM-002(信息熵增——认知表征如不维护会自然衰减,长期目标因不被
      激活/复述而更快衰减)加入 bridges_to 或 derivation,使桥接砖从"独立经验发现"
      变为"公理在稀缺条件下的经验投影"。此外,应在 statement 或 relation_to_system
      节中定位本砖与 BR-L2-001(有限理性)和 BR-L2-027(注意力稀缺)的关系——是
      互补、细化还是竞品?避免读者困惑于三块砖在"认知有限"主题上的重叠。

  non_recurrence:
    DED-004_cycle:
      status: clean
      detail: |
        本轮未发现 DED-004 式的不可证伪循环。falsifiability (a)/(b)/(c) 在原则上
        是可事前测的真证伪路径。但证伪口径的缺失(required_fix #1)和"最紧迫目标"
        的事后指定(required_fix #3)在操作层面制造了类似 DED-004 的循环风险——
        修复后可消除。
    DED-007_weld:
      status: clean_at_primary_axis
      detail: |
        主 IV(稀缺状态)与主 DV(认知/行为表现)在实验室和田野设计中均可独立测量,
        不存在 DED-007 式的分母焊点。但"最紧迫目标"若由行为反推(required_fix #3
        修复对象),则在分析层面构成了次级循环。
    DED-008_enumeration:
      status: not_applicable
      detail: |
        命题未声称可枚举物种/类别,不适用 DED-008 死因。
    L4-009_caliber_retrofit:
      status: at_risk
      detail: |
        证伪口径全未注册(required_fix #1),处于 L4-009 判例所禁的"事后口径选择"
        风险敞口中。修复(一次性注册全部阈值)后此风险关闭。
    BR-L2-031_category_mismatch:
      status: not_yet_applicable
