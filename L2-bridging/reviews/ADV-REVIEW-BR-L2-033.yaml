id: ADV-REVIEW-BR-L2-033
type: adversarial_review
reviews: BR-L2-033
layer: L2-bridging
target: BR-L2-033
target_term: "冲突升级中的损失厌恶不对称 (Conflict Escalation Loss-Aversion Asymmetry)"
rounds: 1

人话摘要: |
  对 BR-L2-033(冲突升级中的损失厌恶不对称——当双方都觉得已经投入了太多，就不愿意放弃，
  宁可继续打下去)的 round_1 独立对抗审查。
  裁 needs_revision：核心直觉(损失厌恶使决策者将撤退编码为"承认损失"，将继续战斗
  编码为"可能挽回损失")在行为经济学中已充分证实，应用到冲突领域有其直觉合理性，
  但三条 required 缺陷阻止 verified：(1)测量轴不正交——用终局累计伤亡作为沉没成本
  度量，与冲突持续时间存在机械相关(持续时间越长，累计伤亡自然越多)，使核心预测
  在逻辑上必然成立，不可证伪；(2)证伪条件(b)要求测量集体行动者(国家/叛军)的
  "损失厌恶倾向"，这是个体心理学构念到集体层面的组合谬误，无可行的操作化手段，
  构成 anti-talisman 护身符；(3)缺少 IEA cross_verification 节，无法评估独立
  来源加权，桥接砖无法进入 verified 流程。
  反例猎捕发现 Egypt-Israel 案例(最高累积沉没成本的国家最早选择和平)挑战
  单调性声称，但非净杀——桥接砖的概率化/倾向性框架可消化单案例。

round_1:
  reviewer: independent-adversarial-reviewer
  date: 2026-07-16
  verdict: needs_revision
  verdict_note: |
    本命题的核心直觉——损失厌恶(Prospect Theory, Kahneman & Tversky 1979)使
    冲突中的决策者将"撤回"编码为"实现损失"(承认已投入全部沉没)，将"继续战斗"
    编码为"可能挽回损失"——在行为经济学层面已获大量实验证实(Arkes & Blumer
    1985 的沉没成本实验; Staw 1976 的承诺升级)。将此机制投射到冲突研究领域
    有直觉上的合理性:如果个体在 10 美元沉没成本下都会非理性地继续投资，那么
    在国家存亡、数万伤亡的冲突中，此效应的方向至少不应更弱。

    但三条 required 级缺陷阻止 verified 裁决:

    1.【测量轴不正交:累计伤亡与冲突持续时间的机械相关——REQUIRED】
    这是本命题最根本的方法论缺陷。桥接砖的 falsifiability (a) 将"冲突持续时间"
    作为因变量，将"累计伤亡数/军费开支"作为自变量(沉没成本)。但在任何冲突中，
    累计伤亡数机械地随持续时间增长——打了 10 年的仗的累计伤亡自然大于打了
    1 年的仗，这不依赖于任何损失厌恶机制。

    问题不在"相关性是否存在"(它几乎必然存在)而在"这个相关性是否为损失厌恶
    机制提供了证据"——它不能。即使在一个损失厌恶对冲突持续时间影响为零的世界里，
    你仍然会观察到累计伤亡与持续时间的正相关，因为时长是累计伤亡的机械构成要素。
    这不是 DED-007 式的分母=结果闭环焊接(分母不偷用实际结果)，而是另一种方法
    论缺陷:自变量(终局累计伤亡)与因变量(终局时长)共享了同一个累积过程，
    二者之间的相关性是部分定义性的(partly definitional)。

    修复方向:(i)将沉没成本操作化为决策点的前瞻度量——如"冲突前 6 个月的
    累计伤亡预测第 7-12 个月继续战斗的概率"(使用 survival/hazard 模型+
    时变协变量);或(ii)使用冲突爆发前的沉没成本(战前动员投入/军备采购);
    或(iii)至少诚实标注"终局累计伤亡与持续时间的正相关本身不足以作为
    损失厌恶机制的证据，因为时长是累计伤亡的机械上限"。按目前的操作化，
    falsifiability (a) 太容易被满足，不具有真正的证伪力。

    2.【anti-talisman 护身符:falsifiability (b) 的组合谬误——REQUIRED】
    Falsifiability (b) 要求"在冲突双方均报告'损失厌恶'倾向的样本中，早期调解
    成功率并不高于后期"。问题:"损失厌恶倾向"是一个个体心理学构念，通过
    彩票选择实验(Kahneman & Tversky 的经典范式)在个体层面测量。没有任何
    已建立的方法论可以将"损失厌恶倾向"归因给一个集体行动者(国家、叛军组织、
    族裔群体)。这不是"当前测量工具有限所以暂时测不出"的问题——这是范畴
    错误:将个体心理属性赋予集体实体。

    具体的不可操作性:(i)一个国家的"损失厌恶"是多少?是领导人的?决策圈
    平均的?选民的?(ii)即使能测出领导人的损失厌恶(假设领导人做了 Kahneman
    的彩票题)，领导人的个体心理倾向是否能代表国家决策?(iii)当领导人更替时，
    国家的"损失厌恶"是否跟着变?若发生政变/换届，前后领导人的损失厌恶不同，
    该冲突算"双方均报告损失厌恶"还是"一方报告一方不报告"?

    这使得 falsifiability (b) 在实践中是一条不可操作的证伪路径——任何攻击
    都可以被"你找的样本没有正确测量集体损失厌恶"挡回。这是 anti-talisman
    护身符的典型症状。

    修复方向:(i)删除 falsifiability (b) 中对"损失厌恶倾向"的个体化测量要求，
    替换为可在冲突层面直接观测的操作化指标——如"双方领导人的公开声明中是否
    出现'不能让牺牲白费/不能让烈士白白牺牲/我们已经付出了太多不能回头'等
    沉没成本语言";或(ii)将 falsifiability (b) 改为更干净的群体层面测试:
    "在可比冲突样本中，控制了冲突烈度(月均伤亡率)后，早期调解(冲突前 25%
    时段内)的成功率是否显著高于后期调解(冲突后 25% 时段内)"——这个测试
    不需要测量心理构念，只需要可观测的冲突事件数据。

    3.【IEA cross_verification 缺失——REQUIRED】
    桥接砖 YAML 当前不含 cross_verification 节。桥接砖引用了两个来源
    (behavioral_economics + conflict_studies)，但未进行正式的独立来源加权
    投票。L2 桥接砖的 verified 需要 IEA ≥ 1.8，weakly_verified 需要 IEA ≥ 1.2。
    没有 cross_verification，就没有 IEA 分数，桥接砖无法进入任何已验证状态。

    即使未来补上 cross_verification，本条砖面临两个独立的 IEA 挑战:
    (i) behavioral_economics 和 conflict_studies 之间的独立性系数不明确——
    conflict_studies 引用 Fearon (2004) 的实证发现(伤亡-时长相关)，但 Fearon
    的解释机制是 rationalist(承诺问题/信息不对称)而非 psychological(损失厌恶)。
    这两个学科对本命题投的"同意票"是在同意"同一相关性存在"还是"同一因果
    机制成立"？如果两源同意的是不同的东西(一个同意相关性存在，一个同意
    行为机制成立)，则 IEA 计权需要分命题分维度打折。
    (ii) 按 independence-model.yaml 的 instrument_correlation discount_rule，
    若 cross_verification 由单一 LLM 执行，必须披露"仪器有效独立性低于学科
    独立性上限"——对于新颖/争议命题(如本条砖:将个体心理构念应用于国家层面
    的冲突决策)，此折扣应视为承重红旗。

    4.【替代机制未区分——should 级附加缺陷】
    桥接砖将"冲突持续时间与伤亡正相关"归因于损失厌恶机制，但理性主义冲突
    理论(如 Fearon 1995 的承诺问题/私有信息/议题不可分割)同样预测冲突持续
    时间与代价正相关——在消耗战(war of attrition)模型中，双方都在等对方
    先放弃，自然耗时更长、代价更高。如果损失厌恶和理性承诺问题预测同一
    可观测模式，那么"观察到正相关"不能区分两个机制——桥接砖声称为损失
    厌恶提供了冲突领域的证据，但实际上提供的是"与损失厌恶一致的证据"
    (也可与理性模型一致)。这应列为 should 而非 required:不是不修则砖倒塌
    的核心缺陷，但若桥接砖要声称自己为损失厌恶在冲突中提供了【独特的】
    经验支撑，就需要建立什么观测可区分损失厌恶机制与理性承诺问题机制。

    综合裁决:三条 required 均可通过定向修订修复——修复路径明确且不推翻
    核心直觉。测量轴的修复(使用前决策点度量+survival model)在冲突研究
    文献中有现成方法论先例;anti-talisman 的修复(用行为指标替代心理构念)
    是操作化的标准升级;IEA 的补全(加 cross_verification)是流程性修复。

  red_flags:
    brick_is_conclusion:
      hit: false
      detail: |
        BR-L2-033 的核心机制(损失厌恶→沉没成本谬误→承诺升级)来自行为经济学
        (Kahneman & Tversky 1979; Arkes & Blumer 1985; Staw 1976)，不是任何
        L1 公理/定理的重述。

        L1 实体覆盖度评估:
        - AXIOM-001(稀缺性-竞争):说竞争因资源稀缺必然存在，不涉及心理框架效应
        - AXIOM-002(信息熵增):说信息需要维护投入，不涉及决策偏差
        - THEOREM-conflict-cost(冲突成本定理):说直接开打比守规矩竞争更费资源，
          从理性资源角度出发，不涉及损失厌恶的心理编码
        - CONCEPT-conflict:定义冲突为双方直接较劲，不预设冲突持续的心理机制
        - CONCEPT-agent:定义行动者是有目标、能看清处境、会主动做事的主体，
          不预设行动者的决策偏差
        - CONCEPT-value:定义价值是三方关系(谁想要×有多想要×愿意付出什么)，
          这是价值的本体论定义，非关于价值感知偏差的经验命题

        桥接砖将行为经济学的损失厌恶机制引入冲突领域，连接了 CONCEPT-conflict
        (冲突场景)、CONCEPT-agent(决策主体)和 CONCEPT-value(对沉没成本与未来
        收益的主观估值)，构建了一条"心理机制→冲突行为"的因果链——这是 L1
        所未覆盖的新经验主张。非 brick=conclusion。

        但警惕一条边界:桥接砖未 bridge 到任何 axiom 或 theorem，仅 bridge 到
        三个 concepts。这意味着桥接砖的核心机制(损失厌恶)完全来自体系外部
        (行为经济学)，而非从体系的 L0/L1 推导而出。这使桥接砖的"桥接"功能
        较弱——它更像"进口外部理论到体系的某个概念上"而非"在两个 L1 实体
        之间建立经验连接"。这不构成 brick=conclusion(砖毕竟不是复述已知)，
        但值得诚实标注:当前 bridges_to 结构未体现该砖在本体系内部的推导链——
        它主要靠外部文献的信用背书而非体系内逻辑连接。

    empty_cell_tautology:
      hit: false
      detail: |
        核心空格预测:若世界是"损失厌恶不影响冲突持续时间"，则:
        (1)在控制其他因素后，沉没成本(累计伤亡/军费)与冲突持续时间无显著正相关;
        (2)在可比的冲突样本中，早期调解成功率不高于后期;
        (3)实验室中损失厌恶与沉没成本谬误的相关性 < 0.1。

        这些都是可观察的经验预测——如果这些预测在系统性检验中被拒绝，
        桥接砖就被证伪。预测(1)-(2)至少在形式上可测(测量操作化的问题
        在红旗 3 和红旗 6 中处理)。非同义反复。

        但需注意:在当前的测量操作化(终局累计伤亡 vs 终局时长)下，
        空格(1)的实际可证伪性被机械相关削弱——见红旗 3 的详细论证。
        这不是同义反复问题(桥接砖确实做了可错的经验声称)而是测量
        有效性问题。

    measurement_axis_orthogonality:
      hit: true
      detail: |
        本红旗命中——自变量(沉没成本)与被观测量(冲突持续时间)之间存在
        机械相关，使核心预测在现有操作化下对数证伪不敏感。

        【核心问题:时间累积的机械共变】
        Falsifiability (a) 的自变量操作化是"累计伤亡数、军费开支"，
        因变量是"冲突持续时间"。在一个持续 10 年的冲突中，累计伤亡自然
        多于一个持续 1 年的冲突——这是与损失厌恶完全无关的机械事实。
        时长越长→累计量越大，这个正相关是定义性地存在的。

        这意味着:falsifiability (a) 当前的表述(
        "控制其他因素后...无显著正相关")几乎不可能被观测到——因为即使
        损失厌恶对冲突持续时间的影响为零，时长的机械效应仍然存在。桥接砖
        的"证实条件"(发现正相关)太容易满足，而"证伪条件"(发现无正相关)
        太难满足。这不是可证伪的经验命题，而是近乎必胜的赌博。

        【与 DED-007 的差异】
        DED-007 的测量轴焊接是"分母用实际获授者定义"(闭环——用结果定义
        前提，不可救)。本条砖的缺陷不同于此:它不是因为用结果定义前提，
        而是因为自变量和因变量共享同一个累积过程(时间)。这不是结构死罪
        (可通过更换测量策略修复)而是测量设计缺陷。

        【修复路径】
        (i)【前瞻度量替代回溯度量】将沉没成本从"终局累计"改为"决策点的
        前瞻度量"。例如:在 survival/hazard 模型中，用 t 时刻的累计伤亡
        预测 t→t+Δt 时段内的冲突终止概率。这拆开了时间共享——
        前期伤亡预测后期行为，不再是用终局总量解释终局总时长。
        (ii)【使用冲突爆发前的沉没成本】如战前军事动员规模/战前军备采购/
        战前联盟承诺的公开程度。这些都是冲突开始前已沉没的成本，其
        测量完全不依赖冲突持续时间。
        (iii)【至少诚实标注当前度量的局限性】在 statement 或 falsifiability
        中标注"终局累计伤亡与持续时间之间的正相关部分来自时长本身的
        机械累积效应，此相关性本身不足以作为损失厌恶机制的独特证据"。

        【额外的测量独立性关切】
        Falsifiability (b) 的另一层测量问题:自变量(早期 vs 后期调解的
        时间窗口划分)与被观测量(调解成功率)的测量独立性存疑。如果
        "早期"和"后期"的划分是基于冲突总长度的百分比(如"调解发生在
        冲突前 25% 时段内算早期")，则此划分本身依赖冲突总时长——这
        又引入了与因变量的依赖性。适当的操作化应基于绝对时间(如
        "冲突爆发后 6 个月内提出的调解")而非相对时间。

        整体裁定:REQUIRED 级——测量轴的机械共变使核心预测失去了经验
        风险(几乎不可能被观测为假)，不修则命题从"可证伪的经验主张"退化
        为"必胜的定义性相关"。

    scope_exclusion_independent:
      hit: false
      detail: |
        排除项按可事前测的渠道划界:
        - "不声称损失厌恶是唯一决定因素"——排除的是因果排他性，可在
        统计模型中通过多因素回归检验(即允许损失厌恶与其他因素共存)。
        - "不适用于完全理性或极端意识形态驱动的冲突"——排除的是适用范围，
        "完全理性"和"极端意识形态"有独立于损失厌恶的操作化标准(如
        理性选择模型可被独立拟合;意识形态强度可通过内容分析量化)。
        上述排除在见反例前声明，方向合理，非事后开脱。

        但有一小缺陷:排除项未提供"完全理性"和"极端意识形态"的操作化判据。
        在什么条件下一个冲突被判定为"完全理性驱动"vs"受损失厌恶影响"？
        若此判据的事后裁决可以救命题(如:某个高沉没成本但快速结束的冲突
        被归入"完全理性"排除区)，则属于 hidden talisman。建议补充操作化
        判据以确保排除钩子不可在见反例后任意使用。此缺陷已(部分)被
        anti-talisman 红旗中的 falsifiability (b) 修复要求间接覆盖
        (修复后的 falsifiability 应不依赖此类模糊排除)。

    classification_granularity:
      hit: false
      detail: |
        桥接砖的核心变量(沉没成本/冲突持续时间/调解成功率)均为连续量，
        桥接砖未做不必要的离散化。预测形式(正相关/成功率差异)保持连续
        度量，档位匹配不触发。

    anti_talisman:
      hit: true
      detail: |
        本红旗命中——falsifiability (b) 依赖不可操作的测量构念，
        构成 anti-talisman 护身符。

        【falsifiability (a) 的分析】
        Falsifiability (a):"控制其他因素后，冲突持续时间与沉没成本
        无显著正相关"——形式上可测，但测量轴的机械共变(红旗 3)
        使其在实践中的证伪力极弱。这属于"操作化缺陷使证伪路径变窄"
        而非"证伪路径本身是护身符"。可修复。

        【falsifiability (b) 的分析——REQUIRED】
        Falsifiability (b):"在冲突双方均报告'损失厌恶'倾向的样本中..."

        此条件的核心不可操作性在于:
        (1)【组合谬误】"损失厌恶"是在个体层面通过标准化实验范式
        (Kahneman & Tversky 的彩票选择题)测量的心理学构念。将个体心理
        属性归因给集体行动者(国家、叛军组织)是范畴错误——集体不是
        有统一心理状态的个体。即使某个国家的领导人完成了损失厌恶测量，
        该得分:(i)不代表前任或继任领导人;(ii)不代表决策圈其他成员;
        (iii)无法解释官僚政治/军种竞争/议会博弈等集体决策机制对最终
        决策的修正。
        (2)【测量对象不存在】没有一个标准数据集以"国家/叛军组织的损失
        厌恶得分"为字段。无法在现有冲突数据中筛选"双方均报告损失厌恶"
        的样本——因为此变量在冲突研究文献中根本不存在。
        (3)【证伪的不可操作性】即使你想证伪桥接砖——你想证明"在双方
        均高损失厌恶的冲突中，早期调解并不更有效"——你也无法执行此证明，
        因为你无法识别哪些冲突满足"双方均高损失厌恶"这一前件。

        综合而言，falsifiability (b) 的前件本身是不可测量的(在集体层面)。
        桥接砖可以永远声称"还没有找到真正满足前件的样本来检验"，使
        此证伪条件在操作上形同虚设。这是 anti-talisman 的经典模式:证伪
        条件在形式上可陈述，但在实践上不可执行。

        【falsifiability (c) 的分析——缩射程问题】
        Falsifiability (c):"实验室实验中损失厌恶与沉没成本谬误的相关系数
        <0.1"——此条件在实验室层面可操作(已有现成的实验范式)，但测试的
        是"损失厌恶与沉没成本谬误是否相关"这个已(在 Arkes & Blumer 1985
        等)被反复确证的命题，而不是"损失厌恶是否导致冲突持续时间延长"
        这个 L2 桥接砖的核心主张。证伪条件(c)退回到了桥接砖赖以建立的
        前提命题上，而不敢直接测试桥接砖本身的冲突层面预测。

        综合:红旗命中——falsifiability (b) 是 anti-talisman(不可执行
        的证伪路径);falsifiability (a) 因测量轴问题证伪力极弱;
        falsifiability (c) 缩射程退回到前提命题而非本命题。

    reality_anchor_fact_check:
      hit: false
      detail: |
        引用文献的核心事实检查:

        (1)【Kahneman & Tversky (1979), Econometrica——发表属实】
        前景理论(Prospect Theory)的奠基论文。核心发现:损失带来的效用
        变化(绝对值)大于等量收益——即损失厌恶。此为行为经济学最稳健的
        经验发现之一，跨数百次实验复现。引用准确。

        (2)【Arkes & Blumer (1985), Organizational Behavior and Human
        Decision Processes——发表属实】
        沉没成本效应的经典实验。结论:人们因已投入而继续投资(sunk cost
        fallacy)。引用准确。

        (3)【Staw (1976), Administrative Science Quarterly——发表属实】
        "承诺升级"(escalation of commitment)的奠基研究。发现:当决策者
        感到对先前决策负有责任时，会继续投入资源。引用准确。

        (4)【Fearon (2004), American Political Science Review——发表属实】
        "Why Do Some Civil Wars Last So Much Longer Than Others?"。
        Fearon 的实证发现:内战持续时间(1)与叛乱方是否为"土地之子"
        (sons of the soil)正相关;(2)与叛乱方是否有违禁品融资(毒品/钻石)
        正相关;(3)与派系数正相关。Fearon 确实报告了持续时间与死亡人数
        的正相关，但其因果机制强调承诺问题(commitment problems)和
        信息不对称，而非损失厌恶。

        关键区分:桥接砖正确引用了 Fearon 的【实证发现】(伤亡-时长相关),
        但将 Fearon 的发现归因于损失厌恶机制——而 Fearon 本人的解释框架
        是 rationalist(承诺问题/私有信息)，不是 psychological(损失厌恶)。
        Fearon (1995, International Organization)的"Rationalist Explanations
        for War"是冲突研究中理性主义范式的基准文献，Fearon (2004)在该
        范式内工作。

        这不是引用造假(Fearon 确实发现了正相关)，但桥接砖将某个机制
        (损失厌恶)的标签贴在另一个机制(承诺问题)的实证发现上。这属于
        归因过度——正相关证据支持 X 也支持 Y，桥接砖宜诚实标注此相关
        与多个机制(损失厌恶/承诺问题/私有信息/受众成本)一致，而非
        将其作为损失厌恶的专属验证。列为 should 而非 required:不影响
        引用的事实正确性，但影响机制声称的证据排他性。

        (5)【Collier, Hoeffler & Ward (2009)——引用需核实】
        声称"Collier, Hoeffler & Ward (2009) 的定量研究表明，冲突持续
        时间受初始沉没成本(如武器购买、人员动员)的显著影响，且调解在
        冲突前两年成功的概率是后期的两倍以上"。Collier 是内战经济学
        的主要学者，其工作强调经济激励(贪婪/可行性)而非心理偏差。
        "调解...概率是后期的两倍以上"这一具体数字——若来自 Collier 等
        的实证发现(而非桥接砖作者的解读)，则是对 mediation timing
        预测的强支持;若此数字实际上是冲突研究中多个研究汇总的趋势
        而非该论文的独立发现，则引用的精确度存疑。

        不做事实造假判断(无法在当前工具限制下验证原文)，但标记供后续
        核查:Collier et al. (2009) 关于"调解前两年成功率>后期两倍"
        的声称应在整改时附注原文页码或具体表号，以提升引用可验证性。

    definition_vs_prediction:
      hit: false
      detail: |
        "损失厌恶使冲突持续时间延长"是可证伪的经验预测——在逻辑上
        自洽的可能世界中，(1)损失厌恶效应存在但被制度约束完全抵消
        (如严格的议会战争授权使领导人无法单方面继续冲突);(2)损失厌恶
        在个体层面存在但在集体决策中被 average out(委员会决策减少了
        个体偏差的影响);(3)冲突中存在其他更强的反制力量(如国际制裁
        威胁使继续战斗的成本急剧上升，压倒损失厌恶效应)。

        这些替代可能性均不违反任何逻辑约束——桥接砖的命题是经验选择
        而非定义。但需注意:当前的操作化(见红旗 3)使预测的"证伪空间"极窄，
        这是测量有效性问题而非命题的定义性/经验性问题——命题本身是
        经验主张，但当前操作化未能为其提供真实的经验风险。

    enumeration_exhaustiveness:
      hit: false
      detail: |
        桥接砖未声称对冲突持续机制做穷尽枚举——其 statement 明确说
        "不声称损失厌恶是唯一决定因素"。故即使存在遗漏的其他机制，
        不触发红旗 9 的 required 标准。桥接砖将自身的射程诚实限定在
        损失厌恶这一特定机制，不假装这是冲突持续的唯一解释。

    primary_suspect_accuracy:
      hit: false
      detail: |
        L2 桥接砖无 formal primary_suspect 字段(L3 要求)，按红旗精神
        审查最弱腿:

        外部识别的最致命软肋(砖未自认):
        (i)【测量轴的机械共变——最致命】红旗 3 已详细论证:终局累计伤亡
        与持续时间共享累积过程，使核心预测近乎必胜。这是桥接砖当前
        最脆弱的经验腿——任何方法论审查者都会首先攻击这一点。
        见 required_fixes #1。

        (ii)【falsifiability (b) 的组合谬误——第二致命】桥接砖要求
        在集体层面测量个体心理学构念，此为范畴错误。见 required_fixes #2。

        (iii)【Fearon 引用的归因过度——中等脆弱】桥接砖将 Fearon (2004)
        的实证发现(伤亡-时长相关)归因于损失厌恶，而 Fearon 本人的
        解释机制是 rationalist(承诺问题/私有信息)。这使桥接砖的行为
        机制声称缺乏独立的经验锚——它借用了理性主义文献的实证发现来
        支撑心理学主张。见 should_fixes。

        (iv)【缺少 cross_verification——流程性脆弱】无法进入 verified
        流程。见 required_fixes #3。

    caliber_registration:
      hit: true
      detail: |
        本红旗命中——关键测量口径未预注册。

        (1)【沉没成本的测量时间点未注册——REQUIRED】
        Falsifiability (a) 使用"累计伤亡数、军费开支"作为沉没成本度量，
        但未指定:(i)测量时点——是终局累计还是 t 时刻的累计?(ii)累计
        范围——包含冲突双方的总伤亡还是单方?(iii)军费开支——包含机会
        成本(如征兵对经济的生产力损失)还是仅直接军费?

        这些口径选择直接影响检验结果。按 L4-009 判例精神:若在反例出现后
        桥接砖试图调整口径(如"我们说的累计伤亡是单方的不是双方的")来
        救命题，此调整一律按不利方向裁决。口径的预注册空白需修复。

        (2)【"早期"调解的操作化未注册——should】
        Falsifiability (b) 提到"早期调解"，但未定义"早期"。是"冲突爆发
        后 6 个月内"?是"冲突总时长的前 25%"?前者是绝对度量(不依赖因变量),
        后者是相对度量(依赖因变量——因为你不知道总时长所以不知道前 25%
        对应什么绝对时间)。若使用相对度量，则划分本身就依赖了因变量，
        引入新的不正交性。

        (3)【排除范围的口径未注册——should】
        "不适用于完全理性或极端意识形态驱动的冲突"中的"完全理性"和
        "极端意识形态"缺乏操作化判据。应在见反例前锁定判据如:若冲突中
        双方领导层均由经正规军事学院训练的军官团主导且决策过程有明确
        的成本收益文件记录，按"完全理性"排除;若冲突双方的公开宣言中
        意识形态术语(如"圣战/无产阶级革命/民族解放")占比 > X%，按
        "极端意识形态"排除。

    data_source_common_root:
      hit: false
      detail: |
        桥接砖引用的全部经验证据来自学术文献(行为经济学实验室实验报告+
        冲突研究量化分析论文)，不涉及宏观经济统计指标(如 WB/IMF/CNBS
        的 GDP 数据)。不触发 data_source_origin 折扣(该折扣专门建模多个
        数据发布机构将同一底层国家账户重新包装的情况)。

        behavioral_economics 和 conflict_studies 确实使用了不同的底层数据:
        - behavioral_economics: 实验室受试者的个体行为数据(选择/反应时/
        生理指标)
        - conflict_studies: 冲突事件层面的观测数据(UCDP/PRIO 武装冲突
        数据库, Correlates of War 项目等)
        两源在测量链层面完全分叉——它们测量不同层面的不同现象，不共享
        底层原始观测。

    api_pretending_independence:
      hit: false
      detail: |
        桥接砖当前没有 cross_verification 节，故不存在 IEA 投票。未来若
        补上 cross_verification，需注意:跨学科投票(行为经济学 vs 冲突研究)
        是学科层面的独立性判断，不是"通过 API 查到相同数据"的假独立。
        API 可及性冒充独立性不适用。

    reverse_failure_mode:
      hit: true
      detail: |
        本红旗命中——桥接砖仅注册了证伪条件(怎么被推翻)，未注册
        反向失败模式(怎么在相反方向失败)。

        桥接砖的核心方向性主张是:"更高的沉没成本→更长的冲突持续时间/
        更强的继续意愿"。反向失败模式——即驱动量(沉没成本)的变化产生
        与被预测方向【恰好相反】的观测结果——逻辑上可能:

        (1)【沉没成本→更短冲突的"止损认知"反向模式】
        较高的沉没成本可能触发"止损"认知:"我们已经损失了这么多——
        不能再继续损失下去了"。在此反向模式下，预测应为:沉没成本越高的
        冲突，双方越有动力寻求快速终止(止损)。这与桥接砖的"损失厌恶→
        继续战斗"方向正相反。历史上的例子:斯大林在苏德战争初期遭受巨
        大损失后(1941年夏秋，数百万红军被歼)曾通过保加利亚渠道试探与
        纳粹德国和谈——此为"止损"逻辑而非"沉没成本→继续"逻辑。

        (2)【沉没成本→更短冲突的"军事崩溃加速"反向模式】
        极高的沉没成本(兵力伤亡达临界点)可能直接导致军事能力崩溃——
        一方不再有继续战斗的物理能力，冲突被迫终结。在此反向模式下，
        极高的沉没成本导致冲突终结而非持续。虽桥接砖可辩称"不适用于
        一方被完全军事击败的情况"，但这恰是需要注册的射程限定。

        桥接砖未注册这两种反向失败模式，也未提供判据以区分"损失厌恶→
        继续"(正向)与"止损认知→终结"(反向)或"军事崩溃→终结"(反向)。
        这使得:如果在一项系统性研究中发现"更高沉没成本→更短冲突"
        的反向关联，桥接砖可以声称"这不是本命题的射程(是因为军事崩溃/
        止损认知)"——但此射程限定是在看到反向证据后才划出的。

        红旗触发级别:should(非 required)。理由:反向失败模式与正向预测
        不同方向但并非互斥因果(即"损失厌恶→继续"和"止损认知→终结"
        可能同时正确，取决于沉没成本的大小和其他调节变量)。这是一个射程
        注册完整性缺口，可通过注册"预测在沉没成本的哪个区间成立/反转"来
        修复——非命题核心塌陷。

    bootstrap_limitation:
      hit: false
      detail: |
        Bootstrap 限定(新技术介导社会形态的冷启动 vs 稳态阶段的区分)是
        DED-039 判例的红旗，针对的是涉及新技术(如 AI 代码协调/算法治理)
        的命题。本桥接砖涉及的心理机制(损失厌恶)不依赖新技术，不触发
        此红旗。

    verification_object_existence:
      hit: true
      detail: |
        本红旗命中——桥接砖的 ideal 检验对象在实践可及性上存在显著缺口。

        桥接砖验证所需的理想数据条件是:(1)大量冲突的时间序列数据，
        含时间分层的累计伤亡/军费数据(需要月级甚至周级粒度);(2)各方
        决策者的个体心理测量数据(损失厌恶得分);(3)各时间点调解尝试的
        记录及成败标注;(4)可比的对照组(低损失厌恶方 vs 高损失厌恶方
        在其他条件相同下的冲突行为差异)。

        在当前的冲突研究数据生态中:
        - 条件(1):部分可及——UCDP/PRIO 提供年度的冲突死亡数据，
        COW 的 Militarized Interstate Disputes 提供结构化的事件数据，
        但月级/周级粒度的伤亡规模数据对许多冲突(尤其是前现代或非西方
        冲突)不可得。
        - 条件(2):完全不可及——不存在以"冲突方决策者的损失厌恶得分"
        为字段的数据集。
        - 条件(3):可及性参差——调解研究有专门数据集(如 Civil War
        Mediation Dataset)，但覆盖率受限于可获得记录的冲突。
        - 条件(4):不可及——无法构造"其他条件相同、仅损失厌恶不同"
        的对照组。

        这使得桥接砖当前的 most stringent test 在实践上极难执行——
        不是逻辑上不可能(证伪条件在概念上清晰)，而是数据获取成本
        极高。桥接砖应诚实标注此"验证对象稀缺"的处境，并在 statement
        或 cross_verification 中说明:当前经验证据支持的主要是"损失厌恶
        在冲突领域的【适用性 plausibility】"(基于行为经济学实验→现实
        冲突的类比外推)，而非"损失厌恶对冲突持续时间的【因果效应的
        精确量级估计】"。

        此标注应为 should 级:不影响可证伪性(证伪条件在概念上仍清晰)，
        但诚实地限制了命题在当前证据生态下的实证置信度上限。

  iea_independence_check:
    cross_verification_present: false
    note: |
      桥接砖 YAML 当前不含 cross_verification 节。无 IEA 分数。
      L2 verified 门槛为 IEA ≥ 1.8，weakly_verified 下限为 IEA ≥ 1.2。
      必须补上 cross_verification 才能进入任一已验证状态。

      桥接砖引用了两个学科来源:
      - behavioral_economics: Kahneman & Tversky (1979), Arkes & Blumer
      (1985), Staw (1976) 的实验室实验
      - conflict_studies: Fearon (2004), Collier et al. (2009) 的量化
      冲突研究

      初步 IEA 结构建议:
      - 锚源: behavioral_economics (weight 1.0)——实验室证据最直接地
      证实损失厌恶+沉没成本效应机制的存在
      - 独立票: conflict_studies (weight × 独立系数)——冲突研究的量化
      证据在【不同层面】(真实冲突 vs 实验室)用【不同方法】
      (observational vs experimental)检验了相关预测

      两个源的独立性挑战:
      (i) conflict_studies 的贡献需要诚实限定: Fearon (2004) 报告了
      伤亡-时长正相关(与桥接砖预测一致)，但其因果归因是 rationalist
      (commitment problems)而非 psychological(损失厌恶)。将此论文
      计入 "agree" 票时，需区分其投票的是"正相关存在"(agree)还是
      "损失厌恶是机制"(未必 agree)。
      (ii) 按 independence-model.yaml 的 instrument_correlation
      discount_rule:若 cross_verification 由单一 LLM 执行，必须披露
      仪器有效独立性低于学科独立性上限。此桥接砖涉及将个体心理学
      构念应用于集体冲突决策——属新颖/争议命题，按 mitigation 条款，
      仪器折扣应视为承重红旗。

      IEA 补全为 required_fix #3。

    instrument_honesty:
      disclosed: false
      assessment: |
        桥接砖当前无 instrument_disclosure 字段——因为尚无 cross_verification。
        未来补全 IEA 时必须包含 instrument_disclosure。

    no_data_source_common_root:
      applicable: true
      detail: |
        不触发 data_source_origin 折扣——引用的全部是学术文献而非
        宏观经济统计数据(WB/IMF/CNBS 的 GDP 等)。两源(实验室实验+
        冲突观察数据)在测量链层面完全独立分叉。

  counterexample_hunt:
    methodology: |
      四个反例方向:(1)高沉没成本但短冲突(挑战核心方向性预测);
      (2)低初始沉没成本但长冲突(挑战"沉没成本驱动持续时间"的机制);
      (3)早期调解失败但晚期调解成功(挑战"早期更有效"预测);
      (4)同方不同冲突中沉没成本与持续时间的非单调关系(挑战单调性)。
      在数据不可及的约束下，以历史案例推理+逻辑分析为主。
    cases:
    - direction: "最高累积沉没成本→最早选择和平:Egypt-Israel (1948-1979)"
      description: |
        Egypt 与 Israel 之间经历了四次全面战争(1948, 1956, 1967, 1973),
        累计沉没成本在阿拉伯国家中最高:
        - 累计军事伤亡: 估计 40,000-50,000+
        - 领土损失: 西奈半岛被 Israel 占领(1967-1982)
        - 经济代价: 苏伊士运河关闭 8 年(1967-1975), 运河收入损失数十亿美元
        - 军事支出: 四次战争的动员+装备成本(含苏联军援的隐含政治代价)

        按桥接砖的单调性逻辑,Egypt(最高沉没成本)应是 Arab 国家中最不情愿
        与 Israel 和平的——"已经牺牲了这么多，现在收手等于烈士白死了"。
        然而历史事实是:Egypt 是第一个与 Israel 签订和平条约的 Arab 国家
        (Camp David Accords, 1978; Egypt-Israel Peace Treaty, 1979)。
        Sadat 选择了"承认损失"(承认 Israel 的生存权、接受 Sinai 非军事化)
        而非"继续战斗以挽回损失"。
      counter_impact: "揭出过度伸张——不净杀"
      analysis: |
        Egypt 的案例不净杀桥接砖，因为:
        (i) 桥接砖声明的不是"高沉没成本→绝不和平"而是"高沉没成本→继续
        意愿更强(概率上)"。Egypt 确实在 30 年间经历了四次战争才选择和平——
        桥接砖可说"这恰好支持:高沉没成本使 Egypt 坚持了 30 年才放弃"。
        (ii) Egypt 的和平选择受强外部因素驱动:美国提供了大规模援助
        (每年 ~$2B, 1979 年至今)、Sinai 的完整归还、美国对 Israel 的
        安全保障——这些"交换条件"可以被桥接砖解释为"外部补偿抵消了
        损失厌恶效应"。
        (iii) 桥接砖已限定"不声称损失厌恶是唯一决定因素"——外部援助、
        领土归还等完全可以作为其他决定因素。

        但 Egypt 案例揭示了一处过度伸张:
        Egypt 是 Arab 国家中唯一与 Israel 有长期正面和平关系的案例——
        其他 Arab 国家(Jordan 1994 年和平但关系冷淡; Syria/Lebanon/
        Iraq 至今无和平条约)。如果按照桥接砖的单调性逻辑，应该期望
        "沉没成本最低的 Arab 国家最早和平"——但 Syria(在 1967 和 1973
        战争中损失远小于 Egypt)至今未与 Israel 和平;Jordan(损失很小)
        在 Egypt 之后 15 年才签和平条约;而 Egypt(损失最大)最早和平。
        这个排序与单调性预测方向【相反】。

        这压力测试的是命题的单调性声称而非存在性声称——"沉没成本越高
        →继续战斗的意愿越强"在 Arab-Israel 冲突的系统级比较中面临
        反例张力:最低沉没成本的国家不最早和平，最高沉没成本的国家
        不最晚和平。桥接砖可通过引入调节变量(如外部援助规模/领土让步
        幅度/领导人的个体差异)来消化此张力，但当前版本的朴素单调性
        声称确实是过度伸张。

    - direction: "低初始沉没成本但极长冲突:Transnistria (1990-至今)"
      description: |
        Transnistria 冲突(Moldova vs 分离的 Transnistria 地区)自 1992 年
        停火以来已冻结 30+ 年。1992 年的热战阶段仅数月，伤亡估计 ~700-1,000。
        初始沉没成本(战斗人员伤亡+财产破坏)在所有后苏联冲突中最低之一。
        然而冲突以"冻结"形式持续至今(双方在停火线两侧对峙，无和平条约)。

        这是"低初始沉没成本→极长冲突"的案例——冲突持续时间(30+年)远超
        其初始沉没成本(数月战斗+数百伤亡)按桥接砖的简单正相关预测应
        对应的时长。
      counter_impact: "揭出过度伸张——不净杀"
      analysis: |
        不净杀——桥接砖未声称沉没成本是冲突持续的唯一驱动量。Transnistria
        的持续时间可由其他机制(外部赞助者 Russia 的战略利益、现状对 elites
        的既得利益、认知冻结)解释。但案例揭示:在"沉没成本作为持续时间
        预测因子"的解释力上，冲突的"冻结"阶段(停火后不战不和)可能遵循
        与"热战"阶段不同的逻辑——冻结更多由现状偏好(status quo bias)和
        既得利益驱动，而非由损失厌恶(来回溯评估已沉没的代价)驱动。

        这实际上勾勒了桥接砖的一个隐含射程边界:桥接砖的机制(损失厌恶
        →防止撤退)主要适用于【活跃战斗阶段】("撤退意味着承认失败")而
        非【冻结阶段】("维持现状不需要做决策")。桥接砖宜显式标注此边界。

    - direction: "早期调解失败、晚期调解成功:Bosnia (1992-1995)"
      description: |
        Bosnian War (1992-1995):多个早期和平计划失败——Carrington-Cutileiro
        (1992 年 2 月), Vance-Owen (1993 年 1-5 月), Owen-Stoltenberg
        (1993 年 8-9 月), Contact Group (1994 年 7 月)。上述早期调解均被
        至少一方拒绝。Dayton Agreement (1995 年 11 月)是第一个被各方接受
        的调解方案——此时冲突已持续 3+ 年, 累计死亡 ~100,000, 沉没成本
        极高。这是"早期调解全部失败→只有晚期调解成功"的案例。
      counter_impact: "被消化——非净杀"
      analysis: |
        桥接砖的预测是"早期调解成功率【高于】后期"(概率比较)，非"早期
        调解总是成功、晚期调解总是失败"。Bosnia 的单一数据点(早期 4 次
        失败 vs 晚期 1 次成功)不构成对概率比较的系统性挑战。

        但 Bosnia 案例勾勒了一个更微妙的压力点:在 Bosnia 中，早期调解
        失败的原因可能与损失厌恶【无关】——早期调解失败更多是因为各方
        的战争目标不可调和(Vance-Owen 的地图划分方案各方都不满意)、
        外部干涉者(NATO/UN)的军事承诺不明确、战场态势不确定。晚期调解
        (Dayton)成功的条件包括:战场态势明朗(克罗地亚+波黑联军在 1995
        年夏季取得重大军事进展)、NATO 大规模空袭(Operation Deliberate
        Force)改变了 Serb 方的成本计算、美国以强担保人身份主导谈判。

        这实际上揭示:调解时机与成功率的关系可能更多由"战场态势是否
        形成僵局(mutually hurting stalemate)"和"外部担保人是否愿意
        投入足够资源"驱动，而非由"沉没成本累积程度"驱动。这点列在
        should_fixes 中——并非要求桥接砖承认自己的机制被推翻，而是
        要求诚实承认:当前的实证文献中，调解时机-成功率的关系有多个
        竞争解释，桥接砖的损失厌恶解释是其中之一而非唯一解释。

    - direction: "止损认知作为反向机制:Stalin 1941 年和谈试探"
      description: |
        Nazi Germany 于 1941 年 6 月 22 日入侵苏联。在战争的头五个月，
        苏联遭受了灾难性损失:红军伤亡和被俘 ~400 万人，丧失大片领土。
        1941 年 7-10 月间，斯大林通过保加利亚驻苏大使 Stamenov 多次
        试探与 Nazi Germany 进行停战谈判的可能性(据 Khrushchev 回忆录
        和 Volkogonov 的斯大林传记)。这些试探发生在苏联的沉没成本已经
        极为惨重但尚未到军事能力完全崩溃时——斯大林的选择是"止损"而非
        "因损失厌恶继续战斗"。
      counter_impact: "被消化——非净杀"
      analysis: |
        此案例不净杀:斯大林的和谈试探是秘密的、未成功的、且在军事形势
        稍稳(Moscow 战役守住)后即放弃。桥接砖可辩称:正是因为损失厌恶，
        苏联才没有在 1941 年 10 月(Moscow 面临直接威胁、政府部分撤离时)
        投降——而是继续战斗并最终反攻。和谈试探只是双轨策略的一部分。

        但此案例为反向失败模式(红旗 14)提供了历史例证:在沉没成本极高时，
        决策者可能同时受两条相反力量拉扯——损失厌恶(继续战斗以挽回损失)
        和止损认知(不能再继续承受损失)。桥接砖当前仅注册了前一条路径，
        未注册后一条路径的存在及两者的交互条件。这应在 should_fixes 中
        处理:注册"止损认知"作为反方向的心理机制，并提供何时哪一方
        占主导的调节条件。

    overall_counterexample_verdict: |
      四方向上未获净杀反例:
      (1) Egypt-Israel 案例挑战单调性排序但不推翻倾向性主张;
      (2) Transnistria 案例揭示活跃战斗 vs 冻结状态的不同逻辑;
      (3) Bosnia 案例示意调解时机的竞争解释(战场僵局 vs 沉没成本);
      (4) Stalin 1941 案例显示反向机制(止损认知)的存在。

      未出现满足以下全部条件的净杀案例:(i)属于桥接砖的声称域内(冲突双方
      均非完全理性/极端意识形态驱动);(ii)高沉没成本是可独立验证的事实;
      (iii)冲突终结原因是决策者自愿承认并接受损失(而非军事战败);(iv)该
      决策与损失厌恶预测方向系统性地相反且在可比案例中复现。

      反例猎捕的主要贡献不是推翻命题，而是:(1)精确识别命题的单调性声称
      为过度伸张(应降格为"倾向"而非"单调");(2)揭示命题的射程边界
      (活跃战斗阶段 vs 冻结阶段/止损条件);(3)提出应将"止损认知"注册为
      反向失败模式。这些发现对应 verdict_note 中的 should_fixes。

  non_recurrence:
    - check: DED-004
      status: pass
      detail: |
        DED-004 的死因是不可证伪循环(命题的核心主张无法被任何经验观测拒绝)。
        本桥接砖的证伪条件在概念上清晰——逻辑上可能观测到"沉没成本与冲突
        持续时间无显著正相关"。问题的根不在"不可证伪"而在"测量操作化使
        证伪极难观测"(红旗 3)。两者有本质区别:DED-004 的命题形式本身是
        免疫的(immunizing),本桥接砖的命题形式是可错的(falsifiable in
        principle)——只是当前的操作化未能给可错性提供真实通道。可通过
        更换测量策略修复。

    - check: DED-007
      status: pass_with_caveat
      detail: |
        DED-007 的死因是测量轴焊死(分母偷用实际结果——用"实际获授者"定义
        授信对象，闭环)。本桥接砖不存在此级别的结构死罪——自变量(沉没成本)
        不由因变量(冲突持续时间)定义，二者在概念上是独立的(沉没成本 ≠
        持续时间)。

        但如红旗 3 详述，当前操作化(终局累计伤亡 vs 终局时长)产生了不同
        性质的测量轴不正交:自变量和因变量共享累积过程(时间)——二者之间的
        相关性是部分定义性的。这不是 DED-007 的分母闭环(分母=结果→不可救)，
        而是测量设计缺陷(可救——通过使用前瞻度量/时变协变量/survival
        model 来拆开时间共享)。缺陷级别低于 DED-007，修复路径明确。

  required_fixes:
    - id: REQ-BR-L2-033-A
      severity: required
      what: |
        修复测量轴不正交——将沉没成本的操作化从"终局累计"改为"决策点前瞻度量"。

        具体修复:
        (i)在 statement 和 falsifiability (a) 中将沉没成本的操作化改为:
        "使用 survival/hazard 模型，以 t 时刻的累计伤亡/军费为时变协变量，
        预测 t→t+Δt 时段内的冲突终止概率。若在控制其他因素后，时变协变量
        的 hazard ratio 不显著小于 1(即累计沉没成本不降低冲突终止的 hazard)，
        则桥接砖的核心预测被削弱。"

        或者:
        (ii)将沉没成本操作化替换为冲突爆发前的前定(pre-determined)指标——
        如战前军事动员规模(以占人口比例度量)、战前军备采购(以占 GDP 比例度量)、
        战前公开的联盟承诺(0/1 或分级)。这些前定指标的测量完全不依赖冲突
        持续时间。

        或者至少:
        (iii)在 statement 和 falsifiability 中诚实标注:"终局累计伤亡与
        持续时间之间存在来自时长本身的机械累积效应。仅当此机械效应被
        统计控制后仍存在显著的正向残余相关时，该残余才构成对损失厌恶
        机制的【独特】证据。未控制此机械效应的原始正相关本身不构成
        对本命题的独特经验支撑。"

        推荐方案 (i)——它在方法上最干净，且在冲突研究文献中有成熟的
        计量经济学先例(Box-Steffensmeier & Jones 2004 的 survival
        analysis of conflict duration)。
      rationale: |
        当前的核心预测在操作上近乎必胜(终局累计伤亡与终局时长共享
        累积过程，正相关是机械的)。不修则命题的经验风险为零，实质上
        不可证伪——这是 required 级缺陷。

    - id: REQ-BR-L2-033-B
      severity: required
      what: |
        重写 falsifiability (b) 为可在冲突层面直接操作化的条件。

        删除要求测量集体行动者"损失厌恶倾向"的表述。替换为以下之一:

        (i)【行为指标替代心理构念】"在可比冲突样本中，若冲突双方领导人
        的公开声明中从未出现'沉没成本语言'(如'不能让牺牲白费/不能让
        烈士白白牺牲/我们已经付出了太多不能回头/不能让孩子们的死亡
        毫无意义'等表述)的冲突，其早期调解成功率并不显著低于出现了
        此类语言的冲突。"

        或者:
        (ii)【纯事件数据测试】"在可比冲突样本中(控制冲突烈度/外部干预/
        地形等)，若冲突前 25% 时段内发起的调解成功率不显著高于冲突后
        25% 时段内发起的调解成功率，则桥接砖关于'调解时机效应'的
        预测被削弱。"

        或者:
        (iii)【实验室到田野的连锁】"若在 meta-analysis 中，实验室测得的
        个体损失厌恶效应量(Cohen's d)与田野中对应国家的冲突持续时间
        (在控制了 GDP/政体类型/族群分化度后)之间的跨层相关系数 < 0.1，
        则桥接砖的核心机制(个体心理→国家行为)被削弱。"

        推荐方案 (ii)——最干净、不依赖心理学构念的集体化测量，证伪
        负担最低且完全可操作。
      rationale: |
        当前的 falsifiability (b) 要求测量集体行动者的"损失厌恶倾向"——
        此构念在当前社会科学中不存在有效测量方法(组合谬误)。这使得
        证伪条件在实践上无法执行，构成 anti-talisman 护身符。

    - id: REQ-BR-L2-033-C
      severity: required
      what: |
        补充 cross_verification 节——进行正式的 IEA 独立来源加权投票。

        结构要求:
        (i) 列出各来源的 vote(agree/disagree/partial, with rationale)
        (ii) 应用 independence-model.yaml 的 source_pairs 独立系数计算 IEA
        (iii) 包含 instrument_disclosure——引用 META-REVIEW-001 的
        instrument_correlation discount_rule，诚实标注"本次投票由单一
        LLM 执行，有效独立性低于报告的学科独立性上限"
        (iv) 若 conflict_studies 的 agree 票是基于"伤亡-时长正相关"
        的实证发现(而非对"损失厌恶是机制"的确认)，需在 cross_verification
        中分维度标注:behavioral_economics 投票给机制(损失厌恶的存在及其
        行为效应)，conflict_studies 投票给预测(伤亡-时长正相关的田野
        确认)——两源投票的是同一命题的不同侧面。
        (v) 计算有效 IEA，与 verified 门槛(1.8) 和 weakly_verified
        下限(1.2) 对照。

        若 IEA < 1.8 但 ≥ 1.2，桥接砖可取 weakly_verified 状态;
        若 IEA < 1.2，桥接砖在当前证据生态下不应进入任何已验证状态。
      rationale: |
        L2 桥接砖的验证必须通过 IEA 加权投票。当前无 cross_verification，
        桥接砖无法进入任何已验证状态——这是流程性 required 缺陷。

  should_fixes:
    - id: SHOULD-BR-L2-033-D
      severity: should
      what: |
        诚实地将 Fearon (2004) 的引用与桥接砖的机制声称的对应关系
        精确化。当前 statement 暗示"Fearon 的发现支持损失厌恶机制"，
        但 Fearon 本人的归因是 rationalist(承诺问题/私有信息)。修正方向:
        "Fearon (2004) 的实证分析确认了冲突持续时间与死亡人数/资源投入
        之间的正相关——此相关是桥接砖的预测之一，但 Fearon 本人的因果
        归因(承诺问题)不同于本砖的心理归因(损失厌恶)。这一相关同时
        与多个机制(损失厌恶/承诺问题/私有信息/受众成本等)一致，本身
        不构成对任一机制的专属验证。"

    - id: SHOULD-BR-L2-033-E
      severity: should
      what: |
        注册"止损认知"作为反向失败模式。在 statement 或 falsifiability
        中新增: "反向失败模式:若在可比冲突样本中，更高的沉没成本系统性地
        缩短了冲突持续时间(如通过触发'止损'认知或加速军事崩溃)，则桥接砖
        的损失厌恶→继续战斗这一方向性主张被挑战。"

    - id: SHOULD-BR-L2-033-F
      severity: should
      what: |
        将"活跃战斗阶段 vs 冻结/对峙阶段"的射程边界显式化。桥接砖的
        损失厌恶机制依赖于"撤退决策"(撤退意味着承认失败)——在活跃战斗
        阶段此决策持续存在，但在冻结阶段(停火线两侧对峙，不战不和)，
        维持现状是被动的而非需要主动决策的。标注:"本命题的核心机制
        (损失厌恶→避免承认损失)主要适用于冲突的活跃战斗阶段;冻结/
        对峙阶段的持续时间可能由其他机制(status quo bias/既得利益/
        外部担保人维持)主导。"

    - id: SHOULD-BR-L2-033-G
      severity: should
      what: |
        将"桥接砖的实证基础以个体心理实验→集体冲突行为的类比外推
        为主"诚实标注在 statement 或 cross_verification 中。桥接砖
        当前的证据链是:实验室个体行为(Kahneman & Tversky 的彩票选择/
        Arkes & Blumer 的沉没成本实验/Staw 的承诺升级)→现实冲突行为
        (Fearon 的伤亡-时长相关/Collier 的调解时机效应)。此链条的
        关键推论步骤(从个体心理到集体冲突决策)在桥接砖中未获独立验证。
        标注此缺口不影响可证伪性(证伪条件仍清晰)，但诚实限制命题在
        当前证据生态下的实证置信度上限。

    - id: SHOULD-BR-L2-033-H
      severity: should
      what: |
        锁定"完全理性"和"极端意识形态"两个排除条件的操作化判据。
        在见反例前注册:例如,"完全理性"的操作化判据为"冲突双方决策
        层由经正规军事学院训练的军官团主导且存在文档化的成本收益
        评估流程";"极端意识形态"的操作化判据为"双方公开宣言中意识形态
        术语(按预注册词典)占比 > 50%"。

round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制(沉没成本→继续冲突)在心理层和行为经济学层有强支持,但桥接到集体冲突后,机制在三个证伪条件上都存在严重测量焊死或同义反复风险。前轮作者已修复(a)的前瞻性问题和(b)的归因问题,但修复后的版本仍存在3条required缺陷:(1)证伪条件(a)沉没成本"伤亡"与冲突烈度"月均伤亡率"在线性风险模型下高度共线,即使分时段仍存在结构性自相关,该证伪门实际极难过,接近同义反复;(2)证伪条件(b)把"调解成功率受沉没成本影响"作为唯一预测,但调解早期成功可能由非沉没成本机制(如议题尚未刚性化、外部窗口更宽)驱动,损失厌恶机制与该观测并非一一对应;(3)机制声称"继续=可能挽回"vs"撤回=实现损失"的二分编码,缺乏对该编码本身的独立测量,桥接层面只能验证相关性,无法承诺机制唯一性。此外cross_verification的IEA被作者自评<1.2、未达weakly_verified,需要补强。
  red_flags: |
    1. brick=conclusion — 未命中。核心机制在AXIOM-001(稀缺性-竞争)和THEOREM-conflict-cost(冲突成本定理)下可被桥接,但原文未声明该底砖依赖,因此不构成"砖专为推论窄化"。
    2. 逐格判空 — 未命中,有轻微问题。预测(a)和(b)是经验主张非同义反复,但见旗3、旗11。
    3. 测量轴正交(DED-007死因) — 命中。前6月累计伤亡(沉没成本代理)与第7-12月继续冲突概率,在Cox/Logistic风险模型中必然存在"持续烈度自相关"——若冲突本身就是高烈度持续事件,前6月与后6月烈度天然正相关,即使无损失厌恶机制,纯随机泊松过程下也会呈显著正相关。该证伪门被焊在了一个先天高自相关的轴上,实际接近平凡化。
    4. 射程/排除钩子独立于结果 — 部分命中。Limitation排除了"完全理性"和"极端意识形态驱动"冲突,但这两类排除条件是事后可分类的橡皮钩——任何反例都可被归为"意识形态驱动"。需要至少一条可事前测的排除指标(如领导人更替、政体类型)。
    5. 分类判据档位匹配 — 未命中。前25% vs 后25%时段二分,粗但可用。
    6. anti-talisman真兑现 — 命中,严重。(a)的"时变协变量前6月→预测后6月"声称前瞻但实际仍受同时段生存过程影响。声称独立测量驱动量(沉没成本),但驱动量与被预测量用的是同一过程(伤亡流)的不同切片,非真正独立。
    7. 现实锚事实核查 — 部分命中需核实。Fearon 2004确实报告内战持续时间与伤亡正相关,但其解释并非单一锁定损失厌恶(也提过机会成本、信息不对称、承诺问题)。Collier-Hoeffler-Ward 2009的调解时段分析需核实具体数据是否真支持"前两年成功的概率是后期两倍"——这是高强度经验声称,需要二级文献复核。
    8. 条件是下定义还是做预测 — 部分命中。"沉没成本越高继续冲突意愿越强"是机制定义;但证伪条件(a)因旗3已接近同义反复,无法有效区分机制vs零假设。
    9. 枚举穷尽 — 不适用。
    10. primary_suspect指对 — 作者自认最弱腿是(falsifiability),实际最致命软肋是机制不可证伪(证据来源用相关性冒充因果机制),比作者自认更糟糕。
    11. 口径完整注册 — 命中。证伪条件(b)未注册"调解成功"的定义口径——是协议签署?是协议执行6个月以上?口径在反例出现时才定死会失稳。需注册。
    12. 数据源同根冒充多源独立 — 未命中(本桥接砖样本是定量文献,非实时数据)。
    13. API可及性冒充认识论独立性 — 未命中。
    14. 反向失败模式缺失 — 命中。推论未注册反向失败模式:"损失厌恶也可能预测冲突过早终止"(双方均害怕继续投入,反而抢先撤出以锁定现有收益)。这是一个理论上对称的相反预测,文件未提。
    15. Bootstrap限定缺失 — 部分命中。调解窗口效应可能存在"冷启动依赖"——早期调解成功未必是因沉没成本低,而是议题尚未刚性化、外部干预时机更友好。文件未区分这两种冷启动vs稳态的解释。
    16. 验证对象存在性未标注 — 未命中。
  counterexample_hunt: |
    主动构造三类反例:
    (1)1975-1991安哥拉内战:双方均承受极高沉没成本(南非/古巴/苏联/美国介入、总伤亡超50万),按预测应拒绝停火,但《Bicesse协定》和后续《新和平协议》最终终止了冲突——尽管沉没成本极高仍签署停火。被消化:可解释为"双方均到损失厌恶峰值时同时触发'再打一轮→再停'"的循环,而非"持续打下去"。但也揭出过度伸张:沉没成本单调预测继续冲突,但实际呈现"积累→爆发停火→再积累"循环,推论的预测应是概率性而非单调的。文件中的"越投入越继续"措辞过于强。
    (2)阿根廷1982马岛战争:阿根廷军事政府在国内政治压力下入侵,沉没成本(军人荣誉、军事投入)极高,按预测应继续,但6周后投降。被消化:可解释为"国内政治压力盖过沉没成本",但这要求限制条件覆盖该案例,目前limitation未涵盖此情境。
    (3)朝鲜战争1953停战:双方沉没成本极高(中苏美朝韩,死亡数十万),按预测应继续,但停战谈判在僵持两年后达成。再次确认模式(1)。
    结论:无净杀,但(1)+(3)+马岛显示"沉没成本单调预测继续冲突"是过度伸张——实际相关性在高成本阶段出现非线性(峰值后反而谈判动力上升)。这是被消化的反例+揭出过度伸张。
  required_fixes:
    - "1) 把核心机制陈述从\"沉没成本越高继续冲突意愿越强\"改为\"沉没成本在中等区间正向预测继续、在极高区间出现倒U型——阈值后双方同时触发'再打成本超挽回收益'的止损编码\",并对证伪条件(a)加上\"在控制极高成本区段后,前6月累计伤亡对后6月继续概率的正向系数应消失或转负\"的修正版。"
    - "2) 注册证伪条件(b)\"调解成功\"的可观测口径:协议签署 vs 协议执行6个月以上,二者择一并预注册;同时注册\"前25%\"的切分点(基于全样本持续时间分布中位数,非随意阈值)。"
    - "3) 在limitation中加入可事前测的排除指标(如领导人更替、政体类型、是否有外部担保方),替代当前模糊的\"完全理性/意识形态\"二分。"
    - "4) 注册反向失败模式:损失厌恶也可能产生\"双方均想止损而提前终止\"的相反预测,需说明在何种条件下两种预测被分别激活。"
    - "5) 补强cross_verification:补一个独立学科来源(如博弈论/演化博弈中的承诺升级模型,或心理学中的escalation of commitment元分析),将IEA推至≥1.5以达weakly_verified。"
  oneline: |
    核心机制方向对,但(a)预测被结构自相关焊死、(b)口径未注册、反向失败模式未注册、调解双因果未分离,需4-5条required修复方可达verified;当前非净杀但多处过度伸张。

round_3:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 3, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心问题有三：（1）倒U机制是杂烩——左半段损失厌恶、右半段能量耗竭，两个机制共用一个标签；（2）证伪条件 (a) 的"极高区段"分组基于持续时间分布（结果变量），构成 DED-007 弱变体的测量轴焊死；（3）证伪条件 (b) 的调解口径给出二选一、FARC 案例直接打破"早期调解成功率高于后期"的预测，按红旗 #11 的歧义反向裁决规则必须按不利于推论方向裁，FARC 净杀 (b)。内核 H1 已被 Fearon/Collier 等文献平凡覆盖、H2 右半段被本体系公理（PHY-002 + AXIOM-001）平凡强制——桥接砖的独立贡献稀薄。机制标签"损失厌恶不对称"在宏冲突层面被政治成本、外部支持、财务崩溃等力量盖过，机制归属过度伸张。
  red_flags: |
    1. brick=conclusion：部分命中——H1 是文献复述，H2 右半段借公理平凡强制。
    2. 逐格判空：命中——核心空格预测几乎不由本砖独立承担。
    3. 测量轴正交：命中——(a) 中"极高区段"基于"持续时间分布上四分位"，分组变量与结果变量焊死。
    4. 射程/排除钩子独立于结果：部分命中——(b) 调解口径二选一未预注册，政权更迭窗口任意。
    5. 分类判据档位匹配：命中——民主/专制二分粗；内战/国际冲突混样。
    6. anti-talisman 真兑现：未命中——所有承重锚都是文献声称，无作者独立测量。
    7. 现实锚事实核查：命中——FARC 案例净杀 (b)。
    8. 条件是下定义还是做预测：部分命中——倒U右半段触发条件"双方预期成本均超阈值"几乎不可事前观测。
    9. 枚举穷尽 + species 按判据定义：未命中——内战/国际冲突未按统一判据分门别类。
    10. primary_suspect 指对 + 平凡化检查：命中——更致命软肋是机制杂烩和跨尺度跳跃，作者未识别。
    11. 口径完整注册 + 歧义反向裁决：命中——(b) 调解口径二选一，FARC 案例作为反例出现后两个口径都能救推论，按此红旗必须按不利于推论方向裁，FARC 净杀。
    12. 数据源同根冒充多源独立：未命中。
    13. API 可及性冒充认识论独立性：未命中。
    14. 反向失败模式缺失：命中——未注册"单方面因政治/财务/外部机制退出"的反向失败。
    15. Bootstrap 限定缺失：未命中。
    16. 验证对象存在性未标注：未命中。
  counterexample_hunt: |
    构造四例反例：
    - 反例 1（一战西线）：极高沉没成本下未出现"双方对称止损"，被消化为机制补丁但补丁条件近真空。
    - 反例 2（越南战争）：美国单方面因政治成本退出、非损失厌恶对称止损——揭出反向失败模式缺口。
    - 反例 3（福克兰战争）：中等沉没成本阶段终止，与 H1 一致，被消化；同时 (b) 在此类短冲突中无可检验调解样本。
    - 反例 4（哥伦比亚 FARC 1964-2017）：调解从第 48 年开始（远超 25% 时段）、2016 年成功——**净杀 (b)**。按红旗 #11 歧义反向裁决，调解口径无论挑哪个都救不了"早期调解成功率高于后期"这条核心预测。
  required_fixes:
    - "1) (a) 中\"前6月累计伤亡 → 后6月继续概率\"的窗口（6个月）预注册切点（候选5/10/15月）；\"极高成本区段\"分组判据改为基于独立测得的资源消耗（军费/GDP占比/武器存量），禁止使用持续时间分布分位数作为分组变量。"
    - "2) (b) 调解成功口径在分析前单选预注册、删除\"或\"字选项；FARC 案例按\"协议签署\"口径计为后期调解成功，必须在修订中处理此反例（可改为\"早期调解成功率高于后期\"为趋势性主张而非显著性主张，并诚实报告 FARC 例外）。"
    - "3) 倒U右半段诚实标注为\"能量耗竭型理性止损\"（借用 PHY-002/AXIOM-001），或整条桥接砖改名\"沉没成本对冲突持续的非单调效应\"、损失厌恶仅作为诸多解释之一。"
    - "4) 注册真正反向失败模式：\"单方面因政治成本/财务崩溃/外部压力退出\"——这在宏冲突层面比\"双方对称止损\"更常见，并加入证伪条件 (a) 的非线性项检验。"
    - "5) 内战和国际冲突分开讨论或分样本独立检验，禁止混在同一\"冲突样本\"里。"
  oneline: |
    倒U机制杂烩 + 测量轴焊死 + FARC 反例净杀 (b) + 调解口径事后救援——核心塌陷需强修订，未达 verified。

round_4:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 4, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（损失厌恶+倒 U 型）有承重砖支撑，反例猎捕未猎到净杀案例（朝战/两伊支持，叙利亚通过排除钩子被消化）。但有两条 required 级缺陷挡住 verified：(1) 可检验预测 (iii)"早期调解>后期调解"叠加了三层缓和条款（FARC 例外、极高成本再升、趋势性非显著性），加上北爱尔兰等未被注册的同类例外，预测接近不可证伪——这是 DED-004 不可证伪循环的部分复发；(2) falsifiability (b) 中"前 25% 时段"切分基于"全样本持续时间分布中位数"，持续时间本身是结果变量，用它切自变量构成测量轴焊死——这是 DED-007 死因的部分复发。另有一条 should 级（(a) 中极高成本分组"独立测得的资源消耗"口径未注册切点档位）和两条 should 级（conflict_studies 内部 Fearon/Collier 可能共享 UCDP/PRIO 数据源；FARC 调解年份应为第 52 年而非第 48 年——事实小错）。(a) 的倒 U 统计预测本身有真经验内容、且 FARC 例外和反向失败模式（单方面退出）已诚实注册，方向正确。差一口气即可达 verified，但必须先拆掉 (iii) 的不可证伪叠加和 (b) 的焊点。
  red_flags: |
    1. brick=conclusion — 未命中：倒 U 型是 PHY-002 的新增合成，承重砖（损失厌恶/沉没成本/承诺升级）未专为这条窄化。
    2. 逐格判空 — 未命中：(i)(ii) 倒 U 形状是统计预测，(iii) 是趋势性——后者虽弱但非空。
    3. 测量轴正交 — 弱命中：(a) 中"独立测得的资源消耗——军费/GDP占比"若取自冲突中数据，与"冲突是否继续"反向因果；应明确为冲突前/外部供给测度。
    4. 射程/排除钩子独立于结果 — 未命中：排除指标（领导更替/政体/外部担保）均为事前可测渠道。
    5. 分类判据档位匹配 — 弱命中：极高成本分组档位未注册（几档？什么切点？），仅排除用持续时间分布分位数。
    6. anti-talisman — 部分命中：(b) 中前 25% 切分基于全样本持续时间中位数，是用结果变量切自变量，违反 anti-talisman 独立性。
    7. 现实锚事实核查 — 弱命中：FARC 调解年份应为第 52 年（2016-1964），文件写第 48 年，事实小错。
    8. 条件是下定义还是做预测 — 未命中：(i)(ii)(iii) 均为可证伪预测。
    9. 枚举穷尽 — 未命中：不涉及 N 类枚举。
    10. primary_suspect 指对 + 平凡化 — 命中（required）：(iii) 三层缓和条款（趋势性+FARC例外+极高成本再升）使预测接近不可证伪，且北爱尔兰等同类例外未被注册——这是过度伸张。
    11. 口径完整注册 — 命中：(b) 前 25% 切分用结果变量分位数，口径方向性焊死。
    12. 数据源同根 — 弱命中（should）：Fearon 2004 与 Collier-Hoeffler-Ward 可能共享 UCDP/PRIO 冲突数据集，独立系数应降。
    13. API 可及性冒充独立性 — 未命中。
    14. 反向失败模式缺失 — 未命中：单方面退出已注册并要求非线性项检验。
    15. Bootstrap 限定 — 未命中：不涉及新技术介导。
    16. 验证对象存在性 — 未命中：内战/国际冲突案例丰富。
  counterexample_hunt: |
    猎捕 1（叙利亚内战 2011-）：极高成本区段未触发对称止损，持续至今——但被排除指标"外部担保方"覆盖，**被消化**。猎捕 2（北爱尔兰 1998 贝尔法斯特协议，冲突约 30 年后期调解成功）：与 FARC 同类例外但未注册——**揭出过度伸张**，(iii) 趋势性主张被掏空至接近空集。猎捕 3（朝战 1953、两伊战争 1988）：双方耗竭后对称止损——**支持推论**。猎捕 4（越南战争 1973、阿富汗战争 2021）：单方面退出而非对称止损——**符合注册的反向失败模式**。净杀=0，揭出过度伸张=1，被消化=1，支持=2。
  required_fixes:
    - "1. 删去或重写可检验预测 (iii) 中\"早期调解>后期调解\"——要么降级为方向性备注不作为可证伪预测，要么去掉\"极高成本阶段可能再次上升\"的第三次缓和（叠加 FARC 例外+趋势性已使其接近不可证伪）。"
    - "2. falsifiability (b) 中\"前 25%/后 25% 时段切分\"改用基于冲突起始特征的预注册切点（如初始烈度/初始死亡人数中位数），禁止使用持续时间分布分位数——这是拆 DED-007 焊死的核心。"
    - "3. 注册极高成本分组的切点档位（建议预注册军费/GDP 占比上四分位为\"极高\"档），并明确\"独立测得的资源消耗\"取自冲突前数据或外部供给指标以断反向因果。"
    - "4. 注册北爱尔兰 1998 等同类后期调解成功例外至 (iii) 适用范围（或在删 (iii) 后此条不适用）。"
    - "5. 修正 FARC 年份为第 52 年（2016-1964）而非第 48 年——事实小错但应修。"
  oneline: |
    核心机制+倒 U 统计预测有支撑、反例猎捕未净杀，但 (iii) 三层缓和条款接近不可证伪 + (b) 用持续时间分位数切分构成 DED-007 焊点，两条 required 挡住 verified，差一口气。

round_5:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 5, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（中等沉没成本→承诺升级，左半段）经反例猎捕后存活，排除条款消化了所有擦边反例（越战、一战西线）。右半段（极高成本→能量耗竭止损）有适用范围窄的问题但非致命——被苏联-阿富汗等案例支持。主要挡住 verified 的缺陷：(1) required 级——falsifiability (b) 调解成功口径"协议签署后6个月维持停火"或"协议签署"二选一未预注册选哪个，命中红旗11；(2) required 级——falsifiability (a) 多个相邻窗口的时变协变量未注册如何处理序列相关（cluster-robust SE 或 AR(1)），命中红旗3；(3) should 级——右半段"能量耗竭型理性止损"被现实主义国际关系理论的常识稀释（Levy 战争疲劳、Clausewitz 摩擦累积），作者未声明与该理论的接续关系，命中红旗10；(4) should 级——falsifiability (b) "早期调解成功率高"的经验证据来自 Collier et al. 横截面，未严格控制"早期成本本身的物理效应"，沉没成本的心理效应与物理效应未隔离，命中反例猎捕揭出的过度伸张。
  red_flags: |
    1. brick=conclusion：未命中。倒U型机制非承重砖直接抄写，是合成机制。
    2. 逐格判空：未命中。极高成本档位用独立测量的资源消耗指标，不依赖结果。
    3. 测量轴正交：命中。falsifiability (a) 多个相邻窗口的时变协变量未注册序列相关处理方式，标准误可能被低估。
    4. 射程/排除钩子独立于结果：未命中。排除指标事前可观测，FARC/北爱为例外而非反推。
    5. 分类判据档位匹配：轻微命中。调解成功率早期/后期二分对趋势性主张勉强可接受。
    6. anti-talisman 真兑现：未命中。极高成本档位用军费/GDP、武器存量等独立测量。
    7. 现实锚事实核查：轻微命中。FARC 第52年、北爱30年事实正确；两者作为后期调解例外实际上补强而非削弱趋势。
    8. 条件是下定义还是做预测：未命中。两个区段都是经验预测。
    9. 枚举穷尽：未命中。本推论不声称 N 类枚举。
    10. primary_suspect + 平凡化：命中。右半段"能量耗竭止损"被现实主义 IR 战争疲劳理论稀释，未声明接续关系。
    11. 口径完整注册 + 歧义反向裁决：命中。falsifiability (b) 调解成功口径二选一未预注册选哪个，构成 DED-007 轻量复发。
    12. 数据源同根冒充多源独立：未命中。已自我折扣。
    13. API 可及性冒充认识论独立性：未命中。
    14. 反向失败模式缺失：未命中。已注册单方面退出反向模式。
    15. Bootstrap 限定缺失：未命中。
    16. 验证对象存在性：未命中。样本充足。
  counterexample_hunt: |
    构造四类反例：(1) 越战——极高沉没成本但继续，被"极端意识形态驱动"排除条款消化；(2) 苏联-阿富汗——极高成本止损，被"单方面外部压力退出"反向模式消化；(3) 一战西线——极高成本双方继续，被意识形态因素部分消化；(4) 西班牙内战——被政权类型排除条款消化。净杀结果：无。被消化/揭出过度伸张：(b) 中"早期调解成功率高"未隔离沉没成本的心理效应与物理效应（成本本身的物理效应），是 should 级过度伸张。
  required_fixes:
    - "1) falsifiability (b) 调解成功口径\"协议签署后6个月维持停火\"或\"协议签署\"必须在分析前预注册选哪个并锁定，禁止事后调整。"
    - "2) falsifiability (a) 多窗口时变协变量生存分析必须注册序列相关处理方式（cluster-robust SE 或 AR(1) 协方差），并声明显著性阈值。"
    - "3) 在机制描述中明确声明右半段\"能量耗竭型理性止损\"与现实主义国际关系理论（战争疲劳/摩擦累积）的接续关系，标注新意主要在左半段。"
    - "4) falsifiability (b) 增加排除条件：当早期成本本身物理上就不够高（双方尚未到 commitment trap）时，需控制初始烈度/初始死亡人数的交互项，以隔离\"沉没成本的心理效应\"与\"成本本身的物理效应\"。"
  oneline: |
    核心机制存活但 (b) 调解口径二选一未预注册选哪个是 DED-007 轻量复发，(a) 多窗口序列相关处理方式缺失，(b) 心理效应与物理效应未隔离——需修这四处才能进 verified。

round_6:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 6, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    本推论经历5轮修补，方法论注册已基本完备：窗口预注册、调解口径单选禁止事后调整、极高成本档位要求独立资源消耗、序列相关处理（cluster-robust SE/AR(1)）、显著性阈值（p<0.05）、排除条件（含初始烈度交互项）、反向失败模式（单方面退出）、FARC+北爱尔兰例外注册、右半段与现实主义IR接续关系声明——以上required级修补全部落地。
    核心缺陷剩两条：一是"极高成本档位"的独立测量锚（军费/GDP占比 或 武器存量）在内战样本中系统性数据稀疏，使(a)的核心可证伪条件在多数案例上跑不通——这是注册方法论无法落地的问题，差一口气到verified；二是"累计伤亡"作为沉没成本的代理变量存在机制瑕疵——决策者心理上的沉没成本严格定义是"已投入的资源"，而累计死亡是"已投入资源的副产物"，两者并不等同，但作者已用独立锚点缓解。
    反例猎捕：黎巴嫩内战、苏联-阿富汗、日俄战争、福克兰、朝鲜战争——五种典型案例都被注册的反向失败模式（单方面退出）和例外条款（FARC/北爱尔兰）吸收，未净杀。
    未复发DED-004（不可证伪循环）和DED-007（测量轴焊死）。
    新意主要在"倒U拐点的合成"，右半段与IR理论接续已被诚实声明，左半段是沉没成本谬误向冲突场景的迁移。
    左半段 + 中间拐点是合理桥接砖；右半段作为独立预测薄弱但已被合理对冲。
  red_flags: |
    1. brick=conclusion — 未命中。倒U合成+与IR理论的对接作为非平凡内核存在，左半段是承重砖应用，右半段自我标注与IR接续——诚实的平庸而非平凡化问题。
    2. 逐格判空 — 未命中。"对应窗口继续冲突概率"是真实二元事件，非同义反复。
    3. 测量轴正交 — 部分命中（should）。累计伤亡作为沉没成本代理存在机制瑕疵（死亡是"投入的副产物"而非"投入本身"），但独立锚点缓解；未达required级。
    4. 射程/排除钩子独立于结果 — 未命中。排除指标（领导人更替6月内、政体类型、外部担保方）均可事前测；FARC/北爱尔兰例外是注册诚实而非事后开脱。
    5. 分类判据档位匹配 — 部分命中（should）。中/高成本档位用时间切点（5/10/15月）划分而非成本阈值划分，意思上对应但口径上不对齐；不是致命错配。
    6. anti-talisman真兑现 — 未命中。极高成本档位要求"独立测得的资源消耗（军费/GDP占比）或武器存量"，至少一个独立锚已注册——真独立测的驱动量。
    7. 现实锚事实核查 — 未命中。FARC 1964-2016第52年事实正确；北爱尔兰1968-1998约30年正确。
    8. 条件是下定义还是做预测 — 未命中。(a)(b)均为真预测，非定义。
    9. 枚举穷尽 — 未命中。仅两段（升+降）声明，无强行枚举N类。
    10. primary_suspect+平凡化 — 未命中。作者诚实声明右半段与IR接续、新意在左半段，未自欺。
    11. 口径完整注册+歧义反向裁决 — 部分命中（should）。(b)已单选预注册调解口径（"协议签署后6个月以上维持停火"或"协议签署"），但"维持停火6个月"在不同冲突中含义差异未精细注册。
    12. 数据源同根冒充多源独立 — 不适用。本推论无经验数据集引用，无同根问题。
    13. API可及性冒充认识论独立性 — 不适用。
    14. 反向失败模式缺失 — 未命中。已注册"单方面因政治成本/财务崩溃/外部压力退出"，通过非线性项检验区分，方向与主claim因果相反——真反向失败模式已注册。
    15. Bootstrap限定缺失 — 不适用。不涉及新技术介导。
    16. 验证对象存在性 — 部分命中（required）。UCDP/PRIO ACD有冲突伤亡数据，但(a)所要求的"极高成本档位的独立资源消耗测度（军费/GDP占比或武器存量）"在多数内战样本中数据稀疏，使核心可证伪条件的可执行性受限——这是已注册方法论的落地性问题。
  counterexample_hunt: |
    构造五例反例猎捕：
    (1) 黎巴嫩内战（1975-1990, 约15年）——多次早期调解失败、最终由塔伊夫协议外部斡旋解决。被反向失败模式（单方面退出+外部压力）吸收。
    (2) 1979-1989苏联-阿富汗战争（9年）——苏联单方面撤军，是"极高成本+单方面退出"的原型案例。被注册的反向失败模式完全吸收，强支持主推论的现实诚实声明。
    (3) 1904-1905日俄战争——双方打到极高成本、俄国国内革命直接导致停战谈判。被反向失败模式吸收。
    (4) 1982福克兰群岛战争（74天）——短期高烈度国际冲突，英方升级、阿方投降，非对称结局。被反向失败模式吸收。
    (5) 1950-1953朝鲜战争——中等沉没成本区段调解成功，符合本推论中间地带预测。支持。
    未净杀。被消化/支持。
  required_fixes:
    - "1) 在falsifiability(a)中添加\"极高成本档位数据可行性检查\"：明确注册当军费/GDP占比和武器存量数据均缺失时该案例应被排除、不得以\"低数据质量\"标签事后保留——这是预注册式可行性约束而非事后开脱。允许的备选代理指标（如冲突前动员人口比例、初始军事装备清单）也须一次性注册并列明数据源。"
    - "2) 在falsifiability(b)中注册调解\"成功\"操作化的二级口径：除\"协议签署后6个月维持停火\"或\"协议签署\"二选一外，须进一步规定\"维持停火\"的物理判定标准（如双方无超过X人的致死性交火事件、X的取值预注册），以避免\"冷和平\"或\"冻结冲突\"被错误计为调解成功。"
  oneline: |
    方法论注册五轮修补已趋完备，反向失败模式真正注册且被反例吸收，差一口气在内战数据稀疏性使核心可证伪条件的执行性受限，应升至required级修补。
