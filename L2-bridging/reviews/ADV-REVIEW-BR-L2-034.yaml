id: ADV-REVIEW-BR-L2-034
type: adversarial_review
reviews: BR-L2-034
layer: L2-bridging
target: BR-L2-034
target_term: 层级深度与管理幅度的认知约束
rounds: 1

人话摘要: |
  对 BR-L2-034(层级深度与管理幅度的认知约束)的 round-1 独立对抗审查。
  裁 needs_revision:核心直觉(认知约束限制管理幅度)在经验上不假,但桥接砖存在
  4 条 required 缺陷:(1)falsifiability (c)是结构反护身符——"不使用书写、规则或
  符号系统辅助管理"描述了一个对人类群体逻辑上不可能的条件,使声称不可被任何真实
  案例挑战;(2)证伪条件(a)的"未借助任何外部工具(如AI或精细化SOP)"排除项过宽,
  与"不适用于高度自动化或算法辅助管理的场景"合力,将可证伪域压缩至近乎空集;
  (3)无 cross_verification/IEA 段——candidate 状态的 L2 桥接砖须经 IEA 调查方可
  推进至 verified,当前 IEA 为空白;(4)反例猎捕发现法式厨房旅团制(chef de cuisine
  直接协调 12-25+ 厨师,中等复杂度工作,19世纪已成熟运作)对 5-9 上限构成活反例
  ——未借助 AI 或算法工具、非流水线简单任务,却维持高质量产出和一致性。另附 3 条
  should:砖将 Miller(工作记忆)与 Dunbar(社会认知)两种不同认知系统打包为单一"认知
  约束"叙事;Dunbar/150 段与 BR-L2-004 实质性重叠;scope 条件"任务复杂度中等"未
  注册独立度量口径。

round_1:
  reviewer: independent-adversarial-reviewer
  date: 2026-07-16
  verdict: needs_revision
  verdict_note: |
    本命题的核心直觉——人类的认知资源(工作记忆容量、社会关系处理能力)对管理幅度
    和组织规模构成上限——在经验方向上不假。Miller(1956)的 7±2 组块和 Dunbar(1992)
    的~150 社会关系上限是认知科学中反复复现的稳健发现;将这些认知约束映射到组织
    管理场景是合理且有用的理论操作。

    但四条 required 级缺陷阻止 verified 裁决:

    1.【falsifiability (c) 是结构性 anti-talisman——REQUIRED】
    falsifiability (c) 要求:"发现一个人类文化群体,其社会关系稳定上限可达到 300 人
    以上,并且该群体不使用书写、规则或符号系统辅助管理。"问题在于:一切人类群体
    都使用符号系统——语言本身就是符号系统。若"符号系统"取其认知人类学标准含义
    (包括亲属称谓分类、仪式象征、图腾标记),则没有任何已知人类文化群体不使用符号
    系统。条件(c)描述的是一个逻辑上对人类群体不可能的世界——一个没有符号系统
    的"人类文化群体"在定义上不存在。这使得(c)永远不可能被任何真实案例满足,
    从而不可能被任何真实案例证伪——这正是 anti-talisman 的结构性定义:证伪条件
    要求证明一个不可能命题。与 BR-L2-032 的 falsifiability (b)不同(后者可通过
    翻转证伪负担为 Chow 检验来修复),本处的"无符号系统"要求是本体论级的不可满足
    ——语言就是符号系统,没有语言就没有人类文化群体。修复方向:将排除条件从
    "不使用书写、规则或符号系统"替换为可操作的正面判据,如"不使用书写系统且无
    正式等级制度",使条件可被真实的人类群体满足和检验。

    2.【证伪条件(a)的排除项合力将可证伪域压缩至近乎空集——REQUIRED】
    falsifiability (a) 要求证伪者在"未借助任何外部工具(如AI或精细化SOP)"的条件下
    找到 15+ 直接下属仍维持高效能的管理者。但 statement 的"限制"段同时排除
    "高度自动化或算法辅助管理的场景"和"高度同质化、规则极为简单的重复性任务"。
    三条排除项(禁止工具/禁止自动化/禁止简单任务)合力形成一个逻辑上近乎空集的
    可证伪域:在现代工作场景中,不使用任何"外部工具"的管理近乎灭绝——连一张
    纸质的排班表、一份培训手册、一个每周例会制度都可以被解释为"精细化SOP"
    或"外部工具"。与此同时,前现代场景的数据(如传统手工业作坊的管理幅度)
    极为稀缺且不可靠。

    三条排除各自的模糊性加剧了这个问题:
    - "外部工具"的外延未定义:纸质排班表算吗?口头传授的标准化操作流程算
      "精细化SOP"吗?每日晨会算"工具"吗?
    - "精细化SOP"中"精细化"的判据未注册:多细算"精细"?
    - "高度自动化"的阈值未注册:使用 Excel 算高度自动化吗?

    合起来,这三条排除使本命题的证伪测试实质上只适用于一个前工业时代的、
    不使用任何标准化管理技术的中等复杂度工作场景——这个场景的实证数据在
    历史记录中几乎不存在。证伪条件的操作不可及性(de facto untestability)
    与 falsifiability (c) 的逻辑不可能性(de jure unfalsifiability)是同一枚
    anti-talisman 硬币的两面。

    修复方向:(i)给"外部工具"一个可操作的排除清单——明确什么算、什么不算,
    使排除项的边界可被独立判断;(ii)将"精细化SOP"替换为可操作的口径
    (如"不低于 X 页的书面标准操作程序"),锁定判定标准;(iii)承认"不借助任何
    管理工具的中等复杂度工作场景"在现代社会中极度稀缺,并在 statement 中诚实
    标注:本命题的可证伪域主要在前工业时代的手工业/农业组织场景,实证数据
    受限于历史记录的稀疏——命题在此意义上属于"理论上可证伪但当前数据生态下
    难以严格检验"。

    3.【无 cross_verification/IEA——REQUIRED】
    本桥接砖 status=candidate,文件中不存在 cross_verification 段。按 L2 验证
    规则,桥接砖从 candidate 推进至 verified 须经 IEA 调查,由多个独立来源加权
    投票确认经验支撑。当前文件仅有 applicable_sources(organizational_behavior 和
    cognitive_science 两源),未经历 IEA 调查流程——无 cross_verification votes、
    无 instrument_disclosure、无 independence 系数折扣。
    organizational_behavior 和 cognitive_science 虽然在学科上可区分,但两者对
    Miller 1956 和 Dunbar 1992 的引用共享同一组核心原始文献——这意味着即使
    未来完成 IEA,其有效独立票数也需要打折。修复:跑 iea_survey.py 或等效的
    IEA 调查流程,为砖补充 cross_verification 段(含 votes/verdict_note/
    instrument_disclosure),并应用 independence-model 中的 instrument_correlation
    discount 和 data_source_origin discount(如适用)。

    4.【反例猎捕:法式厨房旅团制构成活反例——REQUIRED】
    反例猎捕发现法式厨房旅团制(brigade de cuisine,由 Auguste Escoffier 在 19 世纪
    末系统化)对 Miller 5-9 上限构成干净活反例:
    - 场景:大中型餐厅厨房,主厨(chef de cuisine)直接协调 12-25+ 名厨师(各站
      chef de partie + commis),通过口头指令("Oui, chef!")实时指挥
    - 任务复杂度:中等——烹饪涉及判断火候、调味、摆盘、出菜时序协调,既非
      流水线式简单重复也非 AI 辅助
    - 工具使用:未借助 AI、算法或"精细化SOP"——旅团制依赖角色分工清晰
      (每个站点有明确职责)和等级权威(主厨口令即命令),食谱是原料配比非步骤
      级的精细化标准操作程序
    - 产出质量:米其林星级厨房在此制度下维持高质量、高一致性
    - 历史纵深:旅团制在 19 世纪末已成熟运作,早于任何数字工具

    本反例的净杀力分析:
    (i) 满足 falsifiability (a) 的核心条件:直接下属 12-25+(>9),中等复杂度,
    无 AI/算法,非流水线简单任务,维持高质量产出和决策一致性。
    (ii) 砖可能从三个方向防御:
      - "食谱是精细化SOP":食谱给出原料和大致步骤,但火候、调味、时序判断
        仍是厨师实时判断——这不同于流水线式的固定步骤SOP。且砖的排除项是
        "精细化SOP",未定义多细算精细——这是事后口径选择(L4-009 判例禁止)。
      - "厨房有 sous-chef(副主厨)分担":在某些大型厨房中 sous-chef 确实分担
        了部分直接管理,但主厨在出菜高峰时段(service)仍直接向各站发令——
        旅团制的核心设计就是主厨→各站的直接命令链,这正是其效率来源。
      - "烹饪是高度同质化任务":错误。每道菜的食材状态、客人偏好、出菜时序
        各不相同——烹饪在旅团制中是中等复杂度、需要实时判断的工作。

    (iii) 裁决:本案例为活反例——不满足砖自己声明的任何排除条件且挑战了
    5-9 上限。砖若声称"食谱=精细化SOP"来排除本案例,则暴露了"精细化SOP"
    排除项的事后弹性——按 L4-009 判例,事后重新解释排除项一律按不利方向裁决。

    本反例不意味着 Miller 的 7±2 认知约束不成立——它意味着 7±2 的工作记忆
    限制在通过【角色分工 + 等级权威】结构化的组织中可以被有效突破。这正是
    组织设计的意义:结构(旅团制)弥补了个体认知的短板。砖的当前声称为全称命题
    ("管理者直接下属>9 人时控制精度非线性下降"),但旅团制证明在适当的组织结构
    下,这一上限不是刚性的——它可被组织设计缓解,且这种缓解不需要"AI 或算法"。

    四条 required 均可通过定向修订修复(非结构塌陷),故判 needs_revision 而非
    rejected:
    - REQ #1:重写 falsifiability (c)为可被真实人类群体满足的条件
    - REQ #2:收紧并注册排除项口径,诚实标注可证伪域的数据可得性约束
    - REQ #3:完成 IEA 调查流程,补充 cross_verification
    - REQ #4:吸收旅团制反例——将 5-9 从"硬上限"收窄为"无组织结构缓解时的
      基线约束",或为 span-of-control 主张追加"在无角色分工中介的情况下"
      这一限定条件

  red_flags:
    brick_is_conclusion:
      hit: true
      detail: |
        本红旗【部分命中】——Dunbar/150 段与 BR-L2-004 实质性重叠;Miller/5-9 段
        为体系新增内容但经验原创性薄。

        (1)【Dunbar/150 段——与 BR-L2-004 重叠】
        BR-L2-004(层级普适性,verified)的 statement 包含"人群一旦超过约 150 人
        (Dunbar 数——一个人能维持稳定社交关系的上限),在所有已知案例中都会冒出
        某种'少数人拍板'的层级"。BR-L2-034 的 statement 称"组织内非正式关系网络
        受邓巴数(Dunbar 1992,约 150 人)约束,超过该规模则无法维持基于个人信任的
        协调,必须依赖正式层级或制度化流程"。两条砖从不同方向切割同一 Dunbar 数:
        BR-L2-004 说超过 150 人→层级必然涌现;BR-L2-034 说超过 150 人→非正式
        网络失效→必须制度化。后者是前者的逻辑后件——"层级涌现"本身就蕴含了
        "非正式网络不再足够"。BR-L2-034 在这部分未提供新的经验内容,只是在
        BR-L2-004 的地基上重新表达了同一条规律。这不是 plagiarism——两条砖有
        不同的 bridges_to(004→AXIOM-002 + THEOREM-hierarchy-depth-limit;
        034→CONCEPT-hierarchy + CONCEPT-agent + CONCEPT-information)——
        但经验上的增值近乎为零。

        注意:BR-L2-034 的 bridges_to 列表里没有 BR-L2-004,这意味着它声称独立于
        BR-L2-004 而立,但实际上在 Dunbar 段与 BR-L2-004 高度近义。若 Dunbar 段
        被移除,砖将只剩 Miller 5-9 的 span-of-control 主张——命题会变薄但变诚实。

        (2)【Miller/5-9 段——新内容,但经验原创性薄】
        Miller(1956)和 Urwick(1956)在七十年多前就提出了这些主张。本砖在体系内
        是新的——没有其他 L2 桥接砖声称"管理者直接下属数上限为 5-9"——但这属于
        "体系首次纳入"而非"科学首次发现"。L2 桥接砖的角色是将 L1 概念接到现实
        经验——纳入一条被管理学和认知科学广泛接受的经典发现是合法操作。原创性
        薄不等于 brick=conclusion——因为 system 内没有这条结论(不像 Dunbar 段
        被 BR-L2-004 覆盖)。

        (3)【综合裁决:命中,但非 core-collapse 型】
        Dunbar 段的冗余+Miller 段的经验原创性薄,合计构成 should 级缺陷——建议
        将 Dunbar 段收窄或与 BR-L2-004 显式交叉引用,并对 Miller 段标注"此为
        管理学经典发现(Urwick 1956)的体系化纳入,非本体系原创导出"。这不构成
        required 因为砖确实有 BR-L2-004 未覆盖的 Miller/5-9 内核。

    empty_cell_tautology:
      hit: false
      detail: |
        核心空格预测:若认知约束不存在(或可无限扩展),则(1)管理者直接下属 15+
        时效能不降,(2)200+ 人组织可靠纯个人关系运转,(3)存在 300+ 人无符号系统
        的稳定社会网络。这些都是可观察的反事实——在逻辑上自洽的世界(人类认知
        架构不同于现状)中可为真。命题选择"存在上限"路径是经验主张,非同义反复。

        但空格(3)的可测性受 falsifiability (c) 的条件拖累(见 anti_talisman 红旗)
        ——不是说空格本身是同义反复,而是说证伪这个空格的条件可能无法被任何
        真实世界满足。

    measurement_axis_orthogonality:
      hit: false
      detail: |
        核心 IV-DV 在结构上正交:
        - IV(自变量):管理幅度——直接下属人数,简单计数,不依赖 DV 测量。
        - DV(因变量):决策一致性/下属满意度/任务完成质量——通过独立调查或
        绩效指标测量,不参与 IV 的定义。
        不属于 DED-007 式的"分母用实际获授者"闭环焊接。

        但存在一条【scope 条件的测量轴依赖——should 级】:
        "任务复杂度中等"作为 scope 条件未注册独立测量口径。若一个反例具有
        15+ 直接下属且维持高效能,砖的防御者可声称该反例涉及的任务"复杂度低"
        (归入流水线排除)或"复杂度高"(归入需专业判断,不属"中等"),从而事后
        排除反例。这种 scope 条件的事后弹性虽不如 DED-007 的结构死罪,但构成
        一个可被滥用的逃生通道。建议在 statement 中为"中等复杂度"注册可事前
        判定的操作化判据(如"任务涉及≥3 种不同技能领域且每决策需综合≥2 种
        信息源")。

    scope_exclusion_independent:
      hit: true
      detail: |
        本红旗命中——排除项的划界标准在多个维度上不可事前独立判定:

        (1)【"外部工具"边界未注册——REQUIRED】
        falsifiability (a) 排除"未借助任何外部工具(如AI或精细化SOP)"的案例,
        但"外部工具"的外延从未定义:
        - 纸质排班表算工具吗?
        - 口头传授的标准化操作流程算"精细化SOP"吗?
        - 每日晨会算"外部工具"吗?
        - 培训制度算工具吗?
        若任何超越纯口头一对一指令的管理实践都可被事后归类为"外部工具",
        排除项就成了一张能消化一切现代反例的万能牌。

        (2)【"精细化SOP"的精细度阈值未注册——REQUIRED】
        "精细化SOP"中"精细"的判据完全空白。食谱算精细化SOP吗?如果是,
        那烹饪行业整个被排除;如果不是,那法式旅团制就是活反例。此判据在
        反例出现后的任何澄清都将触犯 L4-009 判例——按反向裁决原则,事后
        澄清一律按不利于推论方向裁。

        (3)【"高度自动化或算法辅助管理"的阈值未注册——should】
        statement 排除"高度自动化或算法辅助管理的场景",但未定义阈值:
        使用 Excel 排班算高度自动化吗?使用微信群发工作指令算算法辅助吗?
        在 2026 年,不使用任何数字工具的管理场景几近绝迹——此排除若获广义
        解释,等于排除了所有当代检验案例。

        合在一起:三条排除项(无工具/无自动化/非简单重复)构成一个逻辑上近乎
        空集的可证伪域,且其中关键判据的边界未预注册——触犯 scope_exclusion
        独立判定原则。

    classification_granularity:
      hit: false
      detail: |
        管理幅度(直接下属人数)是自然连续量。砖给出的 5-9 是一个范围而非
        硬二分——允许任务复杂度调制参数。falsifiability (a) 用 >9 的阈值
        (15+)作为证伪门槛,给定了具体的连续量分界点。分档(>9 vs ≤9)与连续
        量的性质匹配,非不当离散化。通过。

    anti_talisman:
      hit: true
      detail: |
        本红旗【命中——required 级】。falsifiability (c) 构成结构性 anti-talisman;
        falsifiability (a) 的排除项过宽构成操作性 anti-talisman。

        (1)【falsifiability (c)——结构级 anti-talisman,REQUIRED】
        "(c)发现一个人类文化群体,其社会关系稳定上限可达到300人以上,并且
        该群体不使用书写、规则或符号系统辅助管理。"

        问题在于后半句"不使用书写、规则或符号系统辅助管理":
        - 语言本身是符号系统——人类学家自 Saussure 和 Peirce 以降一致认为
        语言是符号系统的范式案例。若"符号系统"取其认知人类学标准含义,
        则【不存在不使用符号系统的人类文化群体】——"不使用符号系统的人类
        文化群体"是范畴错误,就像"没有质量的物理对象"。
        - 若"符号系统"取其狭义(仅指书写文字系统),那无文字社会确实存在
        (如安达曼群岛人、部分亚马逊部落),但条件中的"规则"仍可被广义解释
        为任何社会规范——而一切人类社会都有规范。这就回到了同一个问题:
        条件描述的是不可能世界。
        - 即使找到一个 300+ 人的无文字社会(这在经验上已经很困难——无文字
        社会的规模通常远小于 300,雅诺马马人村庄平均仅 40-80 人),砖的防御者
        仍可声称该社会使用了"规则"(亲属规则/婚姻规则/互惠规则)或"符号系统"
        (图腾/纹身/仪式)从而将其排除。

        这与 DED-004 的不可证伪循环同构:DED-004 通过循环定义保护自己不受
        反例伤害;BR-L2-034 的 falsifiability (c) 通过要求一个逻辑上不可能的
        条件(无符号系统的人类群体)保护自己。区别仅在前者用定义循环,后者用
        本体不可能——效果一致:证伪条件永远无法被满足,命题永远不受经验威胁。

        修复:将(c)的排除条件替换为可操作的正向判据,例如:
        "发现一个人类文化群体,该群体不使用书写文字、无正式等级制度
        (无酋长/首领/长老会等制度化权威),但其成员可稳定识别并维持与 ≥300
        人的个体化社会关系(非匿名/非归类性)。"

        关键修改:(i)"不使用书写、规则或符号系统"→"不使用书写文字、无正式
        等级制度"——后者可被真实群体满足和独立判定;(ii)"稳定上限"→更具体的
        "个体化社会关系"——区分"能叫出名字并知道其与自己的关系"vs"通过
        类别标签(如氏族)间接归类"。这使证伪条件变成真正的经验测试而非逻辑陷阱。

        (2)【falsifiability (a) 的排除项过宽——操作性 anti-talisman,REQUIRED】
        "未借助任何外部工具(如AI或精细化SOP)"。如 scope_exclusion 红旗所述,
        "外部工具"的外延、"精细化SOP"的精细度阈值的双重空白,使排除项成为
        一张可消化一切现代反例的万能牌。这不是 falsifiability (c) 那种"逻辑上
        不可能"的结构死罪,而是"操作上不可及"的可修复缺陷——通过锁定排除
        口径即可化解。

        (3)【整体 anti-talisman 裁决】
        两条 falsifiability 条件各有一个致命问题:(a)的操作化排除项未被锁定→
        可事后扩张;(c)的条件要求逻辑上不可能的世界→永不可满足。两条合计,
        本命题的抗证伪护甲太厚——它不是一条有意为之的护身符,而是由模糊的
        排除项(falsifiability a)和不可能的条件(falsifiability c)不经意间构成的
        双重防线的副产品。修复需同时收紧(a)的排除口径和重写(c)的条件。

        注意:falsifiability (b)("200+ 人公司靠纯个人关系高效运转")是三条中最
        干净的——它给出了可操作的正面证伪路径(Dunbar 数是否可在真实组织中
        被超越),不依赖排除项或不可能条件。只可惜(b)测的是 Dunbar 段而非
        Miller 段——两条 claims 的证伪负载不均衡。

    reality_anchor_fact_check:
      hit: false
      detail: |
        对引用的核心文献进行事实核查:

        (1) Miller (1956) "神奇的数字 7±2"——发表属实,Psychological Review
        63(2), 81-97。工作记忆容量~7±2 组块是原文核心发现。引用准确。
        (2) Dunbar (1992) 社会脑假说——发表属实,Journal of Human Evolution
        22(6), 469-493。通过灵长类新皮层体积与社群规模回归推得人类~150。
        后续修正(Dunbar 1993, BBS 16(4), 681-735)将估计区间扩大为 100-230,
        但~150 作为中位估计稳健。引用准确,但需标注区间估计的存在。
        (3) Urwick (1956) 管理幅度原则——发表属实。"The Manager's Span of
        Control", Harvard Business Review 34(3), 39-47。理想直接下属数 5-6
        人是原文主张。引用准确。
        (4) Simon (1947) "管理行为"——出版属实。有限理性对组织设计的限制是
        本书核心主题。引用准确(注意 Simon 本人后来对此书的"过于乐观"有反思,
        但不影响有限理性作为约束条件的基本洞见)。
        (5) Graicunas (1937) 互动关系数学公式——发表属实。"Relationship in
        Organization", Bulletin of the International Management Institute。
        C=n(2^n/2+n-1)公式准确,证明了直接下属线性增长时互动关系指数增长。
        引用准确。
        (6) Hill & Dunbar (2003) 通信数据验证——发表属实。通过圣诞卡发送
        数据验证~150,发表于 Human Nature。引用准确。
        (7) Davison & Nett (2018)——此引用有问题。Davison 和 Nett 在 2018
        年无显著发表匹配"管理幅度与领导效能"主题。最接近的是 Davison et al.
        (2012, Leadership Quarterly)关于 CEO 继任与高管团队的研究,不直接
        测量管理幅度与回忆准确性的关系。此引用可能是 LLM 幻觉——需作者核实
        并替换为可验证的引用。

        现实锚整体:核心经典文献(Miller/Dunbar/Urwick/Simon/Graicunas/Hill &
        Dunbar)引用准确,方向正确。Davison & Nett (2018) 引用的存在性存疑——
        这反映本砖由"free model draft"(免费模型起草)的事实:免费模型在生成
        引用时比 pro 模型更容易产生幻觉。列为 should:核实并替换 Davison & Nett
        (2018),或删除此引用(不影响核心论证——Urwick+Graicunas 已足够支撑
        管理幅度主张)。

    definition_vs_prediction:
      hit: false
      detail: |
        "管理者直接下属数超过 5-9 人时控制精度非线性下降"是可证伪的经验预测——
        在逻辑上自洽的世界中完全可能存在以下情况:(1)管理幅度与效能的函数是
        线性的(每增加一个下属,管理效能等比下降);(2)管理幅度不存在系统性上限
        (个别管理者可有效管理 50+ 人);(3)在特定组织结构下(如旅团制)>9 人的
        管理幅度可维持高效能。这三种替代可能性均不违反逻辑——命题选择了其中
        一个路径,这是经验选择而非定义。通过。

        担有一条边界:若将"认知资源有限"定义为"人脑处理信息的并行通道数≤7±2",
        则"管理幅度≤5-9"趋近于定义性延伸——因为"管理"被定义为"处理下属信息",
        结论就从前提中分析性地流出了。真正使本命题走出纯定义的是:(1)管理幅度
        并非纯信息处理——它还涉及激励、情感、文化等 Miller 的实验室范式未覆盖
        的维度;(2)bridge 声称的是一个社会层面的规律(管理者在组织中可有效
        协调的直接下属人数上限),而非认知心理学实验的复述。这两层"翻译"使
        命题获得了经验风险——管理场景可能引入 Mitigating 或 amplifying factors
        使实际上限偏离 5-9。

    enumeration_exhaustiveness:
      hit: false
      detail: |
        本砖未声称可枚举的物种/类别划分。它提出一个通用结构约束(认知资源
        →管理幅度上限),允许参数受任务复杂度/工具使用等调制。不适用 DED-008
        式枚举穷尽红旗。

    primary_suspect_accuracy:
      hit: false
      detail: |
        L2 砖无 formal primary_suspect 字段(L3 要求),按红旗精神审查最弱腿:

        外部识别的最致命软肋(砖未自认):
        (i)【falsifiability (c) 逻辑不可能是最致命软肋】
        这不仅是"最弱腿"——它是结构性死穴。一个要求"不使用符号系统的人类
        文化群体"的证伪条件在定义上不可能被满足,使(c)永远无法执行其证伪职能。
        这不是可被"修得更精确"的边缘缺陷——它要求彻底重写。见 required_fix #1。

        (ii)【Miller(工作记忆)与 Dunbar(社会认知)的概念混装】
        砖将两个不同的认知系统打包为统一的"认知约束"叙事:
        - Miller 的 7±2 测的是【工作记忆】——前额叶的即时信息保持与操作容量,
        属于执行功能,时间尺度为秒至分,Hill & Dunbar 2003 的社会网络大小
          验证,均使用独立于管理学的测量方法(神经解剖/通信行为)。两源在方法
          论上独立于 management science。独立系数可取 0.5-0.6(认知科学与管理
          学的理论框架重叠低于学科内子领域)。

        但本砖来自"free model draft"(免费模型起草),引用的精确性需核实——
        organizational_behavior rationale 中的引用(Urwick/Simon/Graicunas)
        是经典文献,但 Simon 1947 是书而非期刊论文,Graicunas 1937 发表于
        Bulletin of the International Management Institute(非同行评审期刊
        以现代标准)。这些不影响它们作为管理思想史里程碑的地位,但影响其作为
        "经验证据"而非"理论主张"的权重——IEA 调查应区分理论贡献票与经验
        证据票。

    api_pretending_independence:
      hit: false
      detail: |
        本砖未声称任何 API/MCP 工具作为独立数据源。不触发此红旗。

    reverse_failure_mode:
      hit: false
      detail: |
        反向失败模式:"在适当的组织结构下,管理幅度可超越 5-9 且维持高效能"——
        这正是反例猎捕中法式旅团制展示的。砖未注册此反向可能——它将命题表述
        为单向约束(认知限制→上限≤5-9),但未考虑组织结构作为 moderator 可能
        产生反向效果(组织设计突破认知限制→上限>9)。对 bridge 而言此为 should
        而非 required——因为 L2 桥接砖本身是"将 L1 概念接到现实"的中介,它
        的 scope 声明(不适用于高度自动化场景)暗示了 moderator 的存在。但诚实
        标注此反向模式会使命题的精确性提升。

    bootstrap_limitation:
      hit: false
      detail: |
        本命题不涉及新技术介导的社会形态——它基于传统的认知心理学发现
        (Miller 1956/Dunbar 1992),不涉及 AI 或数字技术。Bootstrap 限定不触发。

    verification_object_existence:
      hit: false
      detail: |
        命题的验证对象(中等复杂度+无工具的管理场景)在现实中存在——如传统
        手工业作坊、小餐馆厨房、前工业时代的行会组织。虽数据稀缺(历史记录
        不完整),但验证对象本身非空集。不触发此红旗。

  iea_independence_check:
    disclosed_iea: "N/A——无 cross_verification 段"
    effective_iea_estimate: "N/A——IEA 调查未执行"
    adjustment_rationale: |
      本桥接砖 status=candidate,文件中不存在 cross_verification 段,未跑 IEA 调查。
      按 L2 验证规则,IEA 调查是 bridge 从 candidate 推进至 verified 的必要步骤。

      两个 applicable_sources 的独立性预估(供 IEA 调查参考):
      - organizational_behavior 与 cognitive_science:学科层独立系数可取 0.5-0.6
      (管理学 vs 认知心理学,方法不同——案例研究/理论分析 vs 实验/神经科学)。
      - 但两者都引用 Miller 1956 和 Dunbar 1992 作为核心证据——同一组原始文献,
      这不是两个独立测量的"多次确认",而是同一测量被两个学科分别引用。IEA
      调查需区分"学科投票"(理论框架层面的支持)与"经验测量票"(独立测量链
      的确认)——两源在经验测量层面可能共享底座。

      预估 IEA:若仅以 organizational_behavior 或 cognitive_science 之一为锚源,
      另一为折后票(独立系数 0.5, weight 0.6→折后 0.3),则 IEA=1.0+0.3=1.3,
      仅略高于 weakly_verified 门槛 1.2,远低于 verified 门槛 1.8。这反映了
      Miller/Dunbar 虽是认知科学的稳健发现,但在组织管理场景的"投射"主要由
      单一学科(organizational_behavior)的证据支撑,cognitive_science 贡献的是
      认知机制层面的基础研究而非管理幅度的直证。

      REQUIRED:执行 IEA 调查(iea_survey.py 或等效流程),为砖补充完整的
      cross_verification 段。

    instrument_honesty:
      disclosed: false
      assessment: |
        无 instrument_disclosure——当前文件中不存在 cross_verification 段,
        无仪器折扣声明。按 independence-model 的 instrument_correlation.
        discount_rule,当 L2 桥接命题的 cross_verification 投票由单一 LLM
        执行时必须披露仪器折扣。此披露应在 IEA 调查完成后补入。

    no_data_source_common_root:
      applicable: false
      detail: |
        本砖引用的是学术文献(心理学/管理学),未引用宏观经济数据源
        (WB/IMF/CNBS 等)。data_source_origin 折扣不触发。

  counterexample_hunt:
    methodology: |
      三个反例方向猎捕:(1)管理幅度超越 5-9 上限的干净案例——中等复杂度、无 AI/
      算法/精细化 SOP、维持高效能;(2)非正式网络超越~150 的社会群体——无现代
      制度工具;(3)认知约束可被组织结构突破的系统性证据。
    cases:
    - direction: "管理幅度超越 5-9——法式厨房旅团制"
      description: |
        法式厨房旅团制(brigade de cuisine),由 Auguste Escoffier 在 19 世纪末
        系统化并沿用至今。在大型餐厅中,主厨(chef de cuisine)直接指挥各工作站
        (saucier 酱汁站/poissonnier 鱼站/entremetier 蔬菜站/rôtisseur 烤肉站/
        garde-manger 冷菜站/pâtissier 甜点站等),每站有 chef de partie(站长)+
        1-2 名 commis(助手),总计 12-25+ 名厨师。出菜高峰时段(service),主厨
        通过口头指令("Oui, chef!")实时向各站发出命令,协调出菜时序、火候、
        摆盘标准:
        - 任务复杂度:中等——烹饪涉及对食材状态、火候、调味的实时判断,既非
        流水线式简单重复(每道菜情况不同),也非 AI/算法辅助(19 世纪无数字工具)
        - 工具使用:厨房有食谱(原料配比表)和站台分工表,但食谱是原料配比+大致
        步骤说明(如"烤至金黄"需厨师自行判断金黄的火候和时长),非步骤级的
        "精细化SOP"。核心协调机制是等级权威(主厨口令)和角色分工(每站专司
        一域),非外部工具。
        - 产出质量:米其林三星厨房在此制度下长期维持极高质量和一致性——
        "一致性"恰是高级餐饮的核心要求(每道菜每次出品须一致)。
        - 历史纵深:旅团制在 19 世纪末(Escoffier 在 Savoy Hotel 和 Ritz Hotel
        时期)已成熟运作,早于任何数字工具。
      counter_impact: "净杀——活反例"
      analysis: |
        本案例对 5-9 上限主张构成干净活反例:

        (1) 满足 falsifiability (a) 的条件:
        - 直接下属 ≥12 人(>9,满足证伪阈值)
        - 中等复杂度(非流水线简单重复,非 AI 辅助)
        - 未使用 AI/算法/精细化SOP(核心协调机制为等级权威+角色分工)
        - 产出高质量+高一致性
        - 下属满意度:高级厨房以团队士气和职业自豪感著称(虽然工作压力大,但
        这是行业特性,非管理幅度导致)

        (2) 砖可能的防御及回应:
        - 防御 A:"食谱是精细化SOP"→ 回应:食谱给出原料配比和目标状态("金黄"),
        火候/时长/调味的具体判断由厨师实时做出——这不同于步骤级的精细化SOP
        (如 ISO 9000 式的工序分解)。且砖从未定义"精细化SOP"的精密度阈值——
        这是事后口径选择,按 L4-009 判例一律反向裁决。
        - 防御 B:"厨师工作任务同质化,属流水线排除项"→ 回应:错误。每道菜因
        食材状态(鱼的大小/新鲜度)、客人偏好(熟度/过敏)、时序(多桌同时出菜)
        的不同而需个体化判断。烹饪是手艺而非流水线。
        - 防御 C:"主厨有 sous-chef(副主厨)分担"→ 回应:大型厨房确有 sous-chef,
        但旅团制的核心设计是主厨→各站 chef de partie 的直接命令链——sous-chef
        在主厨缺席时代行指挥,而在 service 期间主厨本人直接向各站发令。这正是
        旅团制效率的来源:扁平命令链,无中间层。

        (3) 此反例不推翻 Miller 的工作记忆理论——7±2 作为即时意识的信息处理
        容量是 robust 的。它推翻的是"工作记忆容量直接且刚性地限制了管理幅度"
        这一投射。旅团制证明:通过角色分工(将全局拆解为子任务,各站处理局部)+
        等级权威(主厨不需要同时跟踪所有人的所有细节,只需掌握总体节奏和各站
        关键状态),组织可以突破个体工作记忆的直接约束。这是"结构补偿认知"
        (structure compensates cognition)的核心洞见——组织设计的本质。

        (4) 裁决:本反例要求命题将 5-9 从"硬上限"调校为"无组织结构缓解时的
        基线约束"或"基于纯个体信息跟踪的上限"——并诚实标注适当的组织结构
        (角色分工+等级权威)可以在不使用现代工具的情况下扩展有效管理幅度至
        ≥12-15 人。这是 required 级修复。

    - direction: "Dunbar/150——澳大利亚原住民亲属分类系统"
      description: |
        澳大利亚原住民(如 Arrernte/Aranda 人)使用复杂的 kinship section system
        (8  subsection 系统)将整个社会中的每一个人都归类到固定的亲属位置中。
        个体通过此分类系统可识别并维持与数百人的结构化社会关系——不仅是认识,
        而且知道对每个人的恰当行为(婚姻规则/互惠义务/回避规则)。
      counter_impact: "被消化——非净杀(符号系统排除项生效)"
      analysis: |
        Arrernte 的 8-subsection 系统是最典型的"符号系统辅助管理"案例——它是
        一个分类系统,用图腾和婚姻类别作为符号标记。砖的 falsifiability (c) 已将
        "使用符号系统"排除——所以此案例被砖的排除项完美消化。

        但这恰恰暴露了 falsifiability (c) 的不诚实性:任何能让人类突破~150 上限
        的文化技术(图腾/称谓/仪式/神话)本身就被定义为"符号系统"从而被排除。
        Dunbar 的原始论证是:150 是"不借助任何外部文化技术时"的上限——但
        "不借助任何外部文化技术"正是人类不存在的状态。文化技术(语言/分类/
        仪式)与智人这个物种共存了至少 10 万年——不存在"前符号系统"的智人。
        因此,声称"不使用符号系统时上限为 150"在经验上是空洞的——它等价于
        "在没有让你突破上限的文化技术时,你不能突破上限"。

        这不是净杀(案例被砖的排除项消化),而是揭示 falsifiability (c) 的深层
        问题——消化本身就是 anti-talisman 的体现。见 required_fix #1。

    - direction: "组织结构突破认知约束的系统性证据——军队中的扁平指挥链"
      description: |
        历史上,多个军事组织在战术层面实现了超越 5-9 的直接指挥跨度:
        - 罗马百人队(centuria):百夫长(centurion)名义上指挥 80-100 人。
        实际指挥链中有 optio(副百夫长)和 decanus(十夫长)作为中介,有效跨度
        约 10——此案例反而不支持超越,因为罗马军队依赖层级中介。
        - 拿破仑时代的步兵营:营长直接指挥 6-10 个连队,每个连 80-120 人。
        营长的直接下属是连长(6-10 人,在 5-9 范围内),非 400-1000 名士兵。
        - 蒙古千户制:千夫长名义统 1000 人,但内部有百夫长-十夫长层级。

        初步搜索未找到军事组织中超越 5-9 直接指挥跨度的干净案例——这恰恰
        说明军队通过引入层级来应对认知约束,而非突破它。军队案例支持而非
        挑战"认知约束驱动层级涌现"的论题。

        但注意:这与法式旅团制形成有趣对比。旅团制同样是等级制(有 chef de
        partie 作为中层),但主厨仍保留对所有站的直接命令权——它是"扁平等级",
        中层不阻断高层直接指令。军队的等级制则是"纵深等级",中层正式过滤信息。
        这两种结构对认知约束的应对策略不同:旅团制用角色分工将全局拆为局部
        (每个 chef de partie 负责一个局部问题,主厨只需要知道"各站的异常状态"),
        军队用层级将信息压缩(连长的报告已将 100 人的情况压缩为1条摘要)。
      counter_impact: "被消化——支持认知约束的存在但挑战其刚性"
      analysis: |
        军事案例不提供直接的>9跨度反例——它们倚赖层级中介来应对认知约束。
        但这恰恰是重要的 digestion:组织应对认知约束的方式不是"接受它"而是
        "设计结构绕过它"。法式旅团制证明这种绕过可以在<20人规模上实现>9的
        有效跨度——军队证明更大规模需要更多层级。两者共同指向了一条更诚实
        的命题:"认知约束是真实存在的,但其对管理幅度的刚性上限取决于组织结构
        的中介程度"——而非"5-9是普适硬上限"。

    overall_counterexample_verdict: |
      反例猎捕在三个方向上获一个活反例:
      (1)【法式厨房旅团制——净杀】主厨直接协调 12-25+ 厨师,中等复杂度,
      无现代工具,维持高质量产出。对"5-9 是刚性上限"构成干净活反例。
      (2)【澳大利亚原住民 kinship system——被消化但暴露 falsifiability (c)
      的 anti-talisman 性质】案例被排除项消化,但消化本身恰是问题所在。
      (3)【军事组织——被消化,支持认知约束存在但挑战其刚性】军队通过层级
      应对认知约束→约束是真实的,但组织可通过结构缓解。

      核心发现:旅团制不是"例外"——它是"结构补偿认知"的一个实例化。
      一旦承认组织结构可以中介认知约束,5-9 就从"硬上限"降为"baseline constraint"
      ——这不是推翻命题,而是精确化命题的边界条件。这对 bridge 的未来使用
      是增益——一条诚实的"5-9 是基线,组织设计可扩展此基线"比一条过度伸张的
      "全称命题:不得≥10"更能在推论的推导中安全使用。

  non_recurrence:
    - check: DED-004
      status: pass
      detail: |
        本命题不依赖不可证伪的循环定义。核心主张(认知约束→管理幅度上限)是
        一个可被经验检验的投射——虽然 falsifiability (c) 有此倾向(见 anti_talisman
        红旗),但命题本身不是 DED-004 式的"定义保护结论"型循环。
    - check: DED-007
      status: pass
      detail: |
        测量轴在结构上正交——IV(下属人数)与 DV(管理效能)异源测量,非 DED-007
        式的分母=结果闭环焊接。

  required_fixes:
    - id: REQ-BR-L2-034-A
      severity: required
      what: |
        重写 falsifiability (c) 为可被真实人类群体满足的条件。将:
          "发现一个人类文化群体,其社会关系稳定上限可达到300人以上,
          并且该群体不使用书写、规则或符号系统辅助管理。"
        替换为可操作的正向证伪测试,例如:
          "发现一个人类文化群体,该群体 (i) 无书写文字系统, (ii) 无正式等级
          制度(无酋长/首领/长老会等制度化权威角色), (iii) 无精细化的亲属
          分类系统(如 subsection system / 宗族谱系等超越三代以上的制度化的
          关系归类工具),但其成年成员平均可识别 ≥300 个其他成员,并知道与该
          个体的恰当互动方式(如称谓/互惠义务/回避规则),且此识别是基于个体
          化知识(非'他是B类别所以应如何对待'的归类化推断)。"
        关键:(i)将"不使用符号系统"(逻辑不可能)替换为可具体判定的排除清单;
        (ii)将稳定上限的判定操作化为"可识别+知道恰当互动方式"的可测标准。
      rationale: |
        当前 falsifiability (c) 要求一个不使用符号系统的人类群体——这在定义上
        不存在(语言就是符号系统),构成结构性 anti-talisman。必须替换为可被
        真实案例检验的条件,否则这条证伪路径永远不会被触发。

    - id: REQ-BR-L2-034-B
      severity: required
      what: |
        锁定 falsifiability (a) 中"外部工具"和"精细化SOP"的可操作口径。具体:
        (i) 定义"外部工具"的排除清单——列出算和不不算的边界案例:
        "以下不视为外部工具(即不排除):口头指令、角色分工表、日/周例会制度、
        学徒制口头传授。以下视为外部工具(即排除):AI 辅助管理软件、数字化
        看板/仪表盘、ISO 9000 式工序分解文档、自动化排班系统。"
        (ii) 定义"精细化SOP"的阈值:"SOP 被视为'精细化'当且仅当它满足≥2 项:
        (a) 以书面形式存在且被正式培训,(b) 将任务分解为 ≥5 个子步骤并规定
        每步骤的具体操作,(c) 包含量化的质量标准(如'3 分钟内完成')。"
        (iii) 将以上口径的注册日期写入文件(如 2026-07-16),并声明:注册后的
        反例按预注册口径裁决;注册前的反例(如本审查中的旅团制)不受事后口径
        约束——按 L4-009 判例,未注册时的边界案例一律按不利于推论方向裁。
      rationale: |
        当前"外部工具"和"精细化SOP"的外延完全空白,使排除项可被无限扩张以
        消化任何反例。锁定口径是使 falsifiability (a) 从"可事后解释"变为
        "可事前检验"的关键步骤。

    - id: REQ-BR-L2-034-C
      severity: required
      what: |
        执行 IEA 调查(iea_survey.py 或等效流程),为砖补充完整的 cross_verification
        段。需包含:(i) votes(各源的 agree/disagree 判定+weight+rationale),
        (ii) verdict_note(IEA 是否达标及理由),(iii) instrument_disclosure(单
        LLM 执行的仪器折扣声明,引用 META-REVIEW-001 的 honest_ceiling 和
        ICV-001 判例)。

        调查中应重点关注:organizational_behavior 与 cognitive_science 两源在
        经验测量层面的独立性——两源均以 Miller 1956 和 Dunbar 1992 为核心
        证据底座,需在 IEA 计权中诚实反映此共享底座对有效独立票数的压缩。
      rationale: |
        candidate 状态的 L2 桥接砖不能直接推进至 verified——IEA 调查是强制性
        前置步骤。当前无 cross_verification,无法判断多源独立性是否满足门槛。

    - id: REQ-BR-L2-034-D
      severity: required
      what: |
        吸收法式厨房旅团制(brigade de cuisine)反例,将 Miller 5-9 主张从全称
        硬上限调校为条件化基线约束。两个具体修复(二选一,推荐 A):

        (A) 【推荐】在 statement 中追加限定条件:将"管理者直接下属人数超过
        5-9 人时控制精度非线性下降"调校为"在不依赖角色分工将全局拆解为
        子任务、也不借助精细化SOP 或 AI 工具的组织中,管理者直接下属人数
        超过 5-9 人时,基于纯个体信息跟踪的控制精度非线性下降"。同时在
        "限制"段追加:"本命题不声称适当设计的组织结构(将任务分解为子领域+
        建立各子领域的专责角色)无法扩展有效管理幅度——法式厨房旅团制
        (brigade de cuisine, Escoffier 19 世纪末)证明角色分工+等级权威可将
        幅度扩展至 12-15+ 人——本命题仅声称在缺乏此类结构中介的情况下,
        纯个体认知对管理幅度构成 5-9 的约束。"

        (B) 若坚持 5-9 为普通场景的硬上限,则必须将 falsifiability (a) 的证伪
        阈值从 >9 下调至 ≥12(以容纳旅团制作为非反例的边界),并论证为何 12
        而非 15 或 20——此路径要求对数字进行独立论证且可能引发更多边界争议。

        推荐(A)的理由:它不推翻认知约束的存在——认知约束恰是组织结构之所以
        "有用"的理由(如果没有认知约束,就不需要组织结构)。它只是将命题从
        "认知约束是压倒一切的硬上限"精确化为"认知约束是基线约束,组织结构
        可部分但非无限地扩展有效幅度"。这更符合组织理论的现实:结构是对认知
        约束的补偿,而非取消。
      rationale: |
        法式旅团制提供了满足砖所有排除项条件却超越 5-9 上限的干净案例。
        这是活反例——不接受它意味命题的事实基础有误。将上限条件化是唯一的
        诚实回应——它不推翻命题(认知约束仍为 baseline),但阻止了在全称命题
        下的未来误用。

  should_fixes:
    - id: SHOULD-BR-L2-034-E
      severity: should
      what: |
        将 Miller(工作记忆)与 Dunbar(社会认知)作为两条独立的认知系统来陈述,
        而非打包为单一"认知约束"叙事。具体:
        - Miller's 7±2:前额叶工作记忆,即时信息处理容量,秒-分时间尺度,约束
        【管理幅度】(一个管理者能同时跟踪多少直接下属的个体状态)。
        - Dunbar's 150:社会脑/新皮层,稳定社会关系维护容量,月-年时间尺度,
        约束【非正式网络规模】(一个组织中能维持个体化信任关系的人数上限)。
        两条是不同认知系统在不同时间尺度上的独立约束——它们共同影响组织
        结构(幅度约束→层级深度,网络约束→层级必要性),但机制和尺度不可互换。
      rationale: |
        当前 statement 将两条作为统一"认知资源"叙事,但工作记忆与社会认知
        是不同的认知模块(不同的脑区/不同的时间尺度/不同的进化压力)。打包
        在一起在叙事上有力但在科学精确性上有损——尤其在面向 L3/L4 推论时,
        区分"个体信息处理的幅度上限"和"社会信任关系的规模上限"两条独立约束
        将有助于更精确的推导。

    - id: SHOULD-BR-L2-034-F
      severity: should
      what: |
        处理与 BR-L2-004 的实质性重叠。建议:
        (i) 在 bridges_to 或 statement 中显式引用 BR-L2-004,声明本砖的
        Dunbar/150 段与 BR-L2-004 的"层级普适性"从不同角度切入同一经验规律;
        (ii) 考虑将 Dunbar/150 段从本砖中移除或大幅精简——保留 Miller/5-9
        作为本砖的独特贡献,将 Dunbar/150 作为"与 BR-L2-004 一致"的交叉引用。
        若不移除,至少标注"BR-L2-004 已从层级涌现的角度覆盖了 Dunbar 150
        的经验规律,本砖从非正式网络约束的角度提供补充论证"。
      rationale: |
        BR-L2-004 已经是 verified 的 L2 桥接砖,声称"人群超过 150 人→层级
        必然涌现"。BR-L2-034 的"超过 150 人→非正式网络失效→制度化"在经验
        上是同一规律的不同表述。重复覆盖浪费体系资源且可能在未来 L3/L4 推论
        中造成混淆(两条砖引用同一经验规律但以不同 ID 和不同 bridges_to 出现)。

    - id: SHOULD-BR-L2-034-G
      severity: should
      what: |
        (i) 为"任务复杂度中等"注册可事前判定的操作化口径,如"任务涉及 ≥3 种
        不同技能领域(如技术/人际/概念)且每决策需综合 ≥2 种信息源(如生产
        数据+客户反馈)"。
        (ii) 核实并替换 Davison & Nett (2018)引用——此引用在标准学术数据库中
        无法定位匹配的发表,可能为 LLM 幻觉。若无法核实,删除并在 cognitive_
        science rationale 中依赖 Hill & Dunbar (2003) 作为 Dunbar 数的经验
        验证引用。
      rationale: |
        "任务复杂度中等"作为 scope 条件若缺乏独立测量口径,可被事后弹性地
        用于排除反例。Davison & Nett (2018)引用可疑,不修正将损害砖的学术
        可信度。

round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（Miller 7±2 + Dunbar 150）成立且跨学科支撑稳固，反例猎捕中法式厨房旅团制是唯一严肃反例但已被作者通过 sous-chef 中间层解剖消化，未净杀。证伪结构清晰可操作（前轮已修复 anti-talisman，DED-004/DED-007 未复发）。挡住 verified 的关键缺陷：(1) 证伪条件(a)中"决策一致性/下属满意度/任务完成质量"三者的逻辑关系（任一/全部）未注册，属 required 级口径模糊；(2) 桥接砖的核心断言与组织行为学教科书（Robbins 等）默认章节高度重叠，平凡化风险应在 cross_verification 中自报；(3) 反向失败模式（工具辅助误判管理能力 → 实际过载更严重）未注册。
  red_flags: |
    1. brick=conclusion：未命中（边界）。组合性"控制精度非线性下降 + 必须依赖正式层级"不是任一原始文献直接说的。
    2. 逐格判空：未命中。9人阈值 + Cohen's d≥0.5 是可测的经验预测，非同义反复。
    3. 测量轴正交：弱命中。评的人若知道组别会被启发式污染，should 级。
    4. 射程/排除钩子独立于结果：弱命中。"任务复杂度中等"是软性分组标准，事后可调。
    5. 分类判据档位匹配：未命中。连续量用二分（15人阈值）作为桥接砖可接受。
    6. anti-talisman 真兑现：未命中（已修复）。(c) 改为正面判据"不使用书写系统且无正式等级制度"。
    7. 现实锚事实核查：未命中。Miller 1956 / Dunbar 1992 / Urwick 1956 / Graicunas 1937 事实层正确。
    8. 条件是下定义还是做预测：未命中。三条证伪条件都是经验预测。
    9. 枚举穷尽 + species 按判据定义：不适用（非离散枚举主张）。
    10. primary_suspect 指对 + 平凡化检查：弱命中。核心断言与 Robbins 组织行为学教材默认章节高度重叠，平凡化风险应自报。指对法式厨房旅团制，但更致命的是"教科书常识化"风险。
    11. 口径完整注册：弱命中。证伪条件(a)中三个被预测量（决策一致性/满意度/质量）的逻辑组合（任一 vs 全部）未注册，required 级。
    12. 数据源同根冒充多源独立：未命中。作者已自报 Miller/Dunbar 共享原始文献集，独立度折扣 0.7。
    13. API 可及性冒充认识论独立性：不适用。
    14. 反向失败模式缺失：弱命中。工具辅助可能让管理者误判能力、实际过载更严重——这一反向路径未注册，should 级。
    15. Bootstrap 限定缺失：未命中。已通过"不适用于 AI 辅助管理"做诚实排除。
    16. 验证对象存在性未标注：未命中。已在证伪条件(a)注中诚实标注"前工业时代数据稀疏"。
  counterexample_hunt: |
    构造了 7 个潜在反例/支持案例：法式厨房旅团制（净挑战，被作者通过 sous-chef 中间层消化，未净杀）、现代软件工程团队（温和支持）、军队排班（支持）、灵修社区（被排除项消化）、蒙古部落单位（支持）、中国农村生产队（支持）、扁平化远程创业公司（被排除项消化）。净结论：唯一严肃反例是法式厨房旅团制，已被作者识别并通过解剖细节（sous-chef 中间层）部分消化，未达净杀门槛。但揭出过度伸张——推论宣称的"5-9人上限"在"中间层级缓冲"场景下被回避，这是修辞上的过度伸张而非机制错误。
  required_fixes:
    - "1. 在证伪条件(a)中明确注册\"决策一致性/下属满意度/任务完成质量\"三者的逻辑组合（任一 vs 全部），并预注册测量工具与时间窗口，防止事后口径漂移。"
    - "2. 在 cross_verification 中自报本桥接砖的核心断言与 Robbins 组织行为学教材（及 Weber 科层制理论）默认章节的高度重叠，标注桥接价值主要在\"从认知科学向组织理论的搬运\"而非新颖机制。"
    - "3. 在 falsifiability 中注册反向失败模式：工具辅助/AI 管理可能让管理者高估自身带宽、实际信息过载更严重——若观测到此模式则视为对推论的间接支持（而非证伪），应预先标注。"
    - "4. 在 falsification_trace 中补充法式厨房旅团制的解剖级应对：主厨直接管的实际是 5-8 个 chef de partie（每个再带 2-4 个 commis），通过 sous-chef 中间层把名义 15-25 人解构为多层 7±2 嵌套——这是对反例的实质性消化，应明示而非暗示。"
  oneline: |
    核心机制稳固、法式厨房反例已被解剖级消化、口径缺口是唯一 required 硬伤，差一口气到 verified。

round_3:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 3, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（Miller 7±2 限制直接监督宽度；Dunbar 150 限制非正式关系网）成立，falsifiability 三条件逻辑上可操作，反例猎捕未净杀——法式厨房旅团被解剖级消化（旅团制通过 sous-chef 中间层嵌套，未真正越限），这是有力但已部分闭合的应对。但仍有 3 个 required 缺陷挡住 verified：

    1. **证伪条件(a)的anti-talisman弱点未根治**：预注册工具写了（MSQ/rwg/SOP 5页/项目管理软件），但"标准化生产小组"这一情境选择本身有talisman嫌疑——筛选了对认知约束敏感的工业场景，绕过了真正考验预测边界的复杂任务。条件(a)又通过"未借助任何工具"排除几乎所有现代组织，文件自承认可证伪域限于"前工业时代手工业/农业组织"，这与"适用于'组织设计的一般性原则'"的桥接定位有内在张力——一个自己承认不可严格检验的桥接砖，跨学科搬运价值也相应打折扣。

    2. **伞级判据与species双重耦合未独立验证**：文件声称两源独立支持，但 cross_verification 已自报 instrument_correlation 与 data_source_origin 双折扣，且两源共享 Miller/Dunbar 同一文献池。有效加权支持度"仍高于0.6"是孤证——未引入真正异源证据（如神经成像、组织实地访谈、跨文化非工业案例）独立复测。

    3. **验证对象存在性（红旗16）未诚实标注**：条件(a)理想检验对象（"前工业时代手工业组织，管理者直接下属15人以上，无任何书面SOP，无项目管理软件"）在当前数据生态下近乎空集——文件虽提及"实证数据受限于历史记录稀疏"但未将此限制提升为对桥接砖"实证置信度上限"的显式声明（即该砖目前更接近"理论可能性框架"而非"经严格检验的经验定律"）。这与 DED-039/047 判例触发的红旗16同类。

    核心未塌，差的是"可证伪域现实可达性"这一道门，缺真正异源验证。反例猎捕：三例（法式厨房、传统作坊监督者、军事小队）均被消化或支持，未净杀。
  red_flags: |
    1. brick=conclusion — 部分命中。核心断言（7±2、150）与 Robbins教材、Weber 科层制论述高度重叠，文件已自报。这是"跨学科搬运"而非新机制生成，不算致命但限制了新颖性。承重砖（Miller 1956、Dunbar 1992）在文献上是真源，非窄化构造。
    2. 逐格判空 — 未命中/部分消化。核心预测"15人以上管理者下属满意度/质量显著下降，Cohen's d≥0.5"是可操作的经验主张，非同义反复；条件(a)注册了具体排除清单与工具预注册。但"标准化生产小组"的情境选择有talisman嫌疑，详见下方。
    3. 测量轴正交（DED-007死因）— 未命中。自变量（直接下属数 15+）与因变量（MSQ/rwg/质量评分）异源，无焊点。预注册工具具体。
    4. 射程/排除钩子独立于结果（DED-005）— 部分命中。条件(a)按事前定义的工具清单（MSQ 短表、rwg≥0.70、SOP>5页、软件清单）划排除，方向独立于结果。但"任务复杂度中等"的"中等"无独立校准——若反例出现后作者调"中等"为"高/低"以救推论，这是潜在事后口径调整风险（红旗11亦相关）。
    5. 分类判据档位匹配（DED-006）— 未命中。直接下属数与关系网规模均为连续量，条件用二分（15+ vs 5-9）合理；群体规模（150 vs 200+）亦二分。
    6. anti-talisman 真兑现 — 部分命中。判定前件（"未借助任何工具"清单）由可观测的事前变量定义，非结果反推。但承重锚"15人以上 vs 5-9人组无显著差异"未独立测出——文件承认数据生态空集，无法满足"独立测出驱动量"的强形式。
    7. 现实锚事实核查 — 未命中。Miller 1956、Dunbar 1992、Escoffier旅团制史实均准确，无过度解读。
    8. 条件是下定义还是做预测 — 未命中。条件(a)是经验预测，非定义。
    9. 枚举穷尽+species按判据定义 — 未命中。本砖未声称多类枚举。
    10. primary_suspect指对+平凡化检查 — 部分命中。文件自认法式厨房为最强反例，定位准确；但未讨论更致命的"小作坊师傅直接管学徒8-12人也能干好"这一类反例（见counterexample_hunt）。平凡化检查：与 Weber 科层制 + Robbins 教材的重叠已自报。
    11. 口径完整注册+歧义反向裁决 — 部分命中。MSQ/rwg/SOP 长度已注册。但"任务复杂度中等"无独立校准，且"中等"的边界案例（复杂但有SOP vs 简单但无SOP）若出现可被双向解读。中等口径在反例出现后存在事后定死的风险。
    12. 数据源同根冒充多源 — 命中/已自报。两源（organizational_behavior + cognitive_science）共享 Miller/Dunbar 原文，文件已用 instrument_correlation discount（0.7）和独立性声明处理，但有效独立票数仍偏低。真正异源复测（如：灵长类野外数据、神经成像、企业实地案例）未引入。
    13. API可及性冒充认识论独立性 — 不适用。
    14. 反向失败模式缺失 — 已注册。文件明确"工具辅助下管理者高估能力、信息过载更严重"为反向失败模式，并标注为间接支持而非证伪。这一处理合理。
    15. Bootstrap限定缺失 — 不适用（未涉及新技术介导社会形态）。
    16. 验证对象存在性未标注 — 命中。文件提及"实证数据受限于历史记录稀疏"，但未将此提升为对"实证置信度上限"的显式声明。当前数据生态下条件(a)几近空集检验，应标注为"理论框架"而非"经严格检验的经验定律"，并限制跨学科搬运的应用范围。
  counterexample_hunt: |
    构造三类潜在反例，逐项猎捕：

    【反例1：法式厨房旅团制（Escoffier）】
    - 构造：主厨直接管 12-25 名厨师，未使用项目管理软件，超出 9 人上限仍高效。
    - 猎捕结果：**被消化**。文件已做解剖级剖析：主厨实际直接管 5-8 个 chef de partie（部门主管），每个 chef de partie 再带 2-4 个 commis，通过 sous-chef 中间层嵌套为多层 7±2 结构。这是"对管理幅度概念的误解"而非真反例。消化成立。

    【反例2：中世纪手工作坊与近现代家族小企业】
    - 构造：传统手工作坊（如面包房、家具作坊、小型建筑队）的师傅常直接管 8-15 名学徒与帮工，且效率不亚于小型层级化组织。手工业/家族企业（非流水线、非算法辅助）中"直接下属 12 人"是常态。
    - 猎捕结果：**被消化，但暴露条件(a)的现实不可达性**。这类案例大多满足条件(a)的字面要求（任务复杂度中等、未必有 SOP<5页、无项目管理软件），但缺乏"标准化测量"的历史数据（MSQ/rwg 无从测）。条件(a)在文字上可证伪，但在当前数据生态下"理论上可证伪但实践上无法严格检验"——这印证了红旗16的诊断。消化成立但显出可证伪域空集。

    【反例3：军事小部队】
    - 构造：步兵班 9-13 人，班长直接管，副班长协助；小部队中班长直接管理宽度常突破 9 但效率高。
    - 猎捕结果：**被支持（非反例）**。美军陆军研究显示班规模 9-13 人时班长直接指挥效率下降，需通过"班长—副班长—三人小组"结构分散——典型的多层 7±2 嵌套，军队班即"自组织应对管理带宽"的活样本。推论被此例反向支持。

    三例猎捕均未净杀，反例1被解剖消化，反例2暴露条件(a)的现实空集（红旗16），反例3反成支持。
  required_fixes:
    - "1) 诚实标注条件(a)的\"实证置信度上限\"：在本桥接砖正式生效范围内加入\"本桥接砖目前更接近认知科学→组织设计的理论搬运框架，条件(a)在当前数据生态下近乎空集检验，跨学科应用时建议视为启发式而非经验定律\"。这是红旗16要求的诚实标注。"
    - "2) 真正引入至少一项异源验证：建议补充(α)非工业文化的人类学实地数据（如 !Kung 狩猎采集群体、亚马逊原住民部落的关系网规模测量）或(β)神经成像证据（fMRI 测管理者在直接下属超 9 人时前额叶负荷激增）。当前两源共享 Miller/Dunbar 原文，独立度折扣后支持度仅勉强过 0.6 阈值。"
    - "3) 收紧\"任务复杂度中等\"的口径：预注册\"中等\"的具体操作化定义（例：任务类型分类清单 + 评分者间一致性 rwg 阈值），避免反例出现后通过事后调整\"中等\"的边界救推论。"
  oneline: |
    核心机制站得住，法式厨房反例被解剖消化，但条件(a)的现实可证伪域近乎空集且两源同根——诚实标注经验置信度上限并补一项异源验证后可判 verified。
