id: ADV-REVIEW-BR-L2-036
type: adversarial_review
reviews: BR-L2-036
layer: L2-bridging
target: BR-L2-036
target_term: 权力削弱共情准确性
rounds: 1

人话摘要: |
  对 BR-L2-036(权力削弱共情准确性——权力让人不再那么需要关注别人,共情就退化了)
  的 round-1 独立对抗审查。裁 needs_revision:核心直觉(权力通过降低依赖感知削弱
  共情动机)在实验社会心理学中有坚实证据锚,但存在 3 条 required 缺陷:
  (1)IEA/cross_verification 段完全缺失——无独立性评估、无仪器折扣披露,不满足
  L2 verified 的 IEA≥1.2 门槛;(2)两篇神经科学证据(Hogeveen 2014 与 Obhi 2015)
  共享 2/3 作者、出自同一实验室,独立性趋近于零——文件未披露此共享;(3)引用准确性
  存疑——Van Kleef et al. 标注为 EASI 理论模型论文但归因其一个特定经验发现,而
  EASI 论文是理论综述非原始实验报告。反例猎捕发现治疗师/医生在职业权力下维持高
  共情——揭示机制受激励结构调节,非权力的均匀后果。核心直觉成立,三条 required
  均可通过定向修订修复,故判 needs_revision 而非 rejected。

round_1:
  reviewer: independent-adversarial-reviewer
  date: 2026-07-16
  verdict: needs_revision
  verdict_note: |
    本命题的核心直觉——权力通过降低个体对他人依赖的感知,减少共情信息收集的动机,
    进而导致共情准确性下降——是社会心理学中一条有稳固实验证据支撑的经验发现。
    Galinsky et al.(2006)的权力启动-视角采纳实验(写"E"字体任务)和 Kraus et al.
    (2010)的 SES-共情准确性研究共同构成了一条可复现的经验链:在实验操纵和自然
    社会分层中,更高的权力/地位确实与更低的共情准确性相关联。

    但三条 required 级缺陷阻止 verified 裁决:

    1.【IEA/cross_verification 段完全缺失——REQUIRED】
    当前文件不含任何 cross_verification 段。validate.py 要求在 L2 verified 状态下
    IEA≥1.2——没有 IEA 计算,就不可能评估桥接命题的多源独立证据支撑。这是阻塞级
    缺陷:即使命题本身经验上稳固,也无法在体系内获得 verified 状态。此外,
    independence-model.yaml 的 instrument_correlation discount_rule 要求单 LLM
    执行的 IEA 必须披露仪器折扣——此披露也不存在。缺失的不仅是数字,更是整个
    独立性评估框架。

    若补全 IEA 段,粗略估算如下:
    - 锚源:社会心理学(Galinsky 2006, weight 1.0)
    - Kraus 2010(同为社会心理学,范式重叠):折后贡献 ~0.3
    - Van Kleef 2008(同为社会心理学,引用准确性待核实):折后贡献 ~0.3
    - Hogeveen 2014(认知神经科学,EEG 镜像神经元):独立性 ~0.5 → 贡献 ~0.5
    - Obhi 2015(与 Hogeveen 同实验室,共享作者):独立性 ~0.1 → 贡献 ~0.1
    粗略 IEA ≈ 1.0 + 0.3 + 0.3 + 0.5 + 0.1 = 2.2
    但 Hogeveen/Obhi 同实验室的近零独立性(见 required_fix #2)和仪器折扣会
    显著压低有效 IEA。在补全正式 IEA 调查前,IEA 的精确值不确定,但大概率
    ≥1.2(weakly_verified 下限)。

    2.【神经科学两源同实验室、共享作者——独立性趋近于零,未披露——REQUIRED】
    Hogeveen et al.(2014,"Power changes how the brain responds to others",
    JEP:General)的作者为 Hogeveen/Inzlicht/Obhi。Obhi et al.(2015,"Power
    and the brain: A TMS study of perspective taking",Social Cognitive and
    Affective Neuroscience)的作者为 Obhi/Hogeveen/Inzlicht。
    两篇论文的 3 位作者中有 2 位完全重叠(Hogeveen 与 Inzlicht),且 Obhi 本人
    出现在两篇中——这是同一研究组用两种互补方法(EEG mu 抑制 + TMS rTPJ 干扰)
    检验同一假设。两篇论文在认识论上不构成独立验证——它们是同一研究纲领的
    两块拼图,而非两个独立实验室的独立复现。
    按照 IEA 框架:同一实验室/同一研究组的第二个来源,独立性系数 ≤0.1。
    文件在 applicable_sources 中并列五源,未标注(2)和(3)的实际独立关系,
    使读者可能误认为有五条独立证据链——实际上是社会心理学三条(有一定独立性
    但范式重叠)+神经科学同一实验室两条(近乎零独立)。这构成 required 级
    诚实性缺陷。

    3.【引用准确性存疑——REQUIRED】
    Van Kleef et al.的 citation 标注为 EASI 理论模型论文(Advances in
    Experimental Social Psychology, 42, 45-96),但 rationale 描述了一个
    具体实验发现:"高权力被试在观看情绪面部表情时,对痛苦情绪的识别准确率
    低于低权力被试,且伴随自身生理唤醒降低"。EASI 模型论文是一篇理论综述,
    不是原始实验报告——它可能在文献回顾中提及此发现,但不可能是该发现的
    原始数据来源。此具体发现更可能来自 Van Kleef, Oveis, Van der Lowe,
    LuoKogan, Goetz, & Keltner (2008, Psychological Science)的"Power, distress,
    and compassion"——该文测量的是生理反应和同情,而非严格意义上的"情绪
    识别准确率"。
    这不是引用造假(权力-共情的关联确实存在且被多篇论文支持),但将理论综述
    误标为特定经验发现的来源,会削弱后续审查者对文献基础的信任。需要核查
    并修正引用:要么将 Van Kleef et al.的引用替换为真正报告了"高权力者情绪
    识别准确率下降"的原始实验论文,要么在 rationale 中诚实标注"该发现引自
    EASI 综述的文献回顾部分,原始实验见[X]"。

    三条 required 均可通过定向修订修复(非结构塌陷),故判 needs_revision
    而非 rejected。核心机制(权力→依赖感知降低→共情动机下降→共情准确性下降)
    在实验社会心理学中有真实证据支撑,反例猎捕未发现能干净推翻核心主张的
    案例。修复后(补 IEA + 诚实标注同实验室 + 核实引用),本命题的基础骨架
    足以进入 weakly_verified 或 verified(取决于 IEA 的实际计算结果)。

    附 2 条 should:注册反向失败模式(Red Flag 14);收紧 scope 条件以指定
    激励机制作为调节变量。

  red_flags:
    brick_is_conclusion:
      hit: false
      detail: |
        权力削弱共情准确性这一核心主张不在任何 L1 公理/定理/概念中。
        - CONCEPT-power 定义权力为"甲能让乙做出本来不会做的事的能力",
        不涉及权力对权力持有者自身心理的影响。
        - CONCEPT-agent 定义目标导向的行动者,不预判行动者的共情能力如何
        随权力变化。
        - CONCEPT-cooperation 定义合作的互利性,不涉及权力-共情关系。
        - THEOREM-power-signal-decay 论述权力信号会自然衰减(需展示来维持),
        这是权力的外部效果(对受控者的影响),非权力对持有者内部心理的影响。
        - AXIOM-002(信息熵增)断言信息不维护会衰减,但未指定'权力高的人
        更少维护关于他人情绪的信息'这一具体因果链。

        本命题将一般性的"依赖感知→信息收集动机"逻辑特化投射到权力-共情
        域,产生可检验的经验主张:随机分配高权力角色→情绪识别准确率下降,
        且此效应由依赖感知中介。这不是 L1 的复述——L1 甚至没有"共情"概念。
        非平凡经验内核成立:核心负载落在(1)实验室权力操纵→共情准确性的
        因果效应,(2)依赖感知作为中介变量,(3)神经机制(镜像神经元抑制、
        rTPJ 关键作用)的可检验性。攻不穿。

    empty_cell_tautology:
      hit: false
      detail: |
        核心空格预测:若权力不降低共情准确性,则(1)随机分配高权力角色的被试
        在情绪识别任务中的准确率不应系统性低于低权力角色被试;(2)职位晋升后
        共情准确性不应下降;(3)跨文化中权力与共情不应系统性地呈负相关。

        这些都是可观察的经验预测,非同义反复。"权力不影响共情"的世界在逻辑上
        完全自洽——权力者可以维持同样的情绪识别能力、甚至可以因为需要管理
        下属而提高共情。选择"权力降低共情"是经验主张,非定义必然。逐格判空
        未命中。

    measurement_axis_orthogonality:
      hit: false
      detail: |
        自变量(权力)与被观测量(共情准确性)在原则上异源测量:
        - IV(权力):在实验研究中通过随机分配角色/启动操纵(与结果独立);
        在相关研究中通过 SES/职位测量(社会经济指标)。
        - DV(共情准确性):通过标准化的情绪识别任务(RMET、动态面部表情识别、
        视角采纳任务)测量。
        不存在 DED-007 式的"分母用实际获授者"型闭环焊接——IV 的分配/测量
        不依赖于 DV 的读数。

        实验研究中的随机分配提供了最强的测量轴正交性保证——权力操纵与
        情绪识别能力在因果上独立。相关研究(Kraus et al. 2010 的 SES-共情)
        存在混杂风险(教育水平、认知负荷、压力等可能同时影响 SES 和共情
        表现),但核心因果主张由实验证据承重,相关证据只提供生态效度补充。
        整体测量轴正交性达标,攻不穿。

        有一个次级关切:实验室权力操纵(写一段关于权力的回忆/角色扮演)与
        真实世界的结构性权力(CEO/法官/军官)在心理效应上可能不同——前者是
        "状态权力"(transient state),后者是"特质权力"(chronic trait)。
        但这属于生态效度/推广链问题,非测量轴焊接。列为 counterexample_hunt
        中的考察维度。

    scope_exclusion_independent:
      hit: false
      detail: |
        排除项按可事前测的渠道划界:
        - "不声称权力在任何文化或情境下都必然削弱共情"→排除全称普适性,
        方向合理(允许文化/情境调节),排除了一个几乎不可能为真的强声称。
        - "不声称权力对共情的影响是永久性的(失去权力后共情可恢复)"→排除
        不可逆性,方向合理。

        上述排除均在见反例前声明。但"不声称权力在任何文化或情境下"这一排除
        的开放度过高——它没有指定哪些文化/情境会反转效应、反转的条件是什么。
        如果任何反例都可以被归入"不同情境"而排除,那排除就成了万能逃生舱。
        证伪条件(c)(跨文化正相关 d>0.3)部分收紧了此排除——它要求反转效应
        必须具有中等以上效应量才算对命题构成挑战。但"情境"维度仍未被操作化。
        列为 should:指定至少 2-3 个关键的边界条件(如"权力持有者依赖下属
        的程度"、"职业规范是否要求共情"、"权力是否伴随照顾责任")。

    classification_granularity:
      hit: false
      detail: |
        本命题处理连续量(权力程度、共情准确性),未强行将连续体切为离散箱。
        falsifiability 的阈值(d>0.3、"显著高于")是连续谱上的分界点,非不当
        二分。不适用 DED-006 档位匹配红旗。

    anti_talisman:
      hit: false
      detail: |
        三条证伪路径均可事前测量,不依赖结果反推前件:
        (a) ≥3 项独立预注册实验显示 null 或反向效应——要求多个独立实验室
        的预注册复制失败。这是苛刻但可操作的证伪条件:复制危机中,许多经典
        社会心理学效应未通过预注册复制,此条件可被满足。
        (b) 纵向研究:职位晋升→一年后共情准确性提升——可事前设计的自然实验,
        判据清晰。
        (c) 跨文化正相关 d>0.3——可事前注册的跨文化研究,效应量和方向阈值
        明确。

        有一条需要注意:条件(a)的"显著高于"未指定显著性水平(p<0.05?调整后?)、
        效应量阈值、具体的情绪识别任务版本。不过这些是操作化细化问题
        (口径注册红旗的管辖范围),而非 anti-talisman 的结构问题——证伪方向
        和判据本身是清晰的。anti-talisman 的结构条件满足。

        但"不声称"段的开放性("不声称在任何文化或情境下")提供了一定的
        talismanic 缓冲——见 scope_exclusion_independent 的分析。列为
        should 而非 required,因为 falsifiability (c) 已给出了跨文化反证
        的操作化门槛。

    reality_anchor_fact_check:
      hit: true
      detail: |
        本红旗命中——存在引用准确性问题,非致命事实错但需修正。

        (1)【Van Kleef et al. 的引用-经验发现错位——REQUIRED】
        applicable_sources 中 Van Kleef et al.的 citation 标注为:
        "Van Kleef, G. A., De Dreu, C. K. W., & Manstead, A. S. R. (2008).
        An interpersonal approach to emotion in social decision making:
        The emotions as social information model. Advances in Experimental
        Social Psychology, 42, 45-96."

        这篇是 EASI 理论模型论文——一篇理论综述,非原始实验报告。rationale
        称"具体实验:高权力被试在观看情绪面部表情时,对痛苦情绪的识别准确率
        低于低权力被试,且伴随自身生理唤醒降低"。EASI 综述可能在文献回顾中
        提及此类发现,但该发现若来自原始实验,其出处更可能是:
        - Van Kleef, Oveis, Van der Lowe, LuoKogan, Goetz, & Keltner (2008).
        "Power, distress, and compassion: Turning a blind eye to the suffering
        of others." Psychological Science, 19(12), 1315-1322.
        (该文测量的是权力对共情性生理反应和同情的影响,与 rationale 描述的
        "生理唤醒降低"一致;但其 DV 主要是生理反应和自述同情,非严格意义上
        的"情绪识别准确率")

        年号也可能有误:Adv. Exp. Social Psychology 第 42 卷出版于 2010 年
        (可能 2009 年在线优先)。2008 年作为出版年是可疑的。

        这不是引用造假——权力-共情的关联在多个实验室被多次复现。但将理论
        综述误标为特定经验发现的来源,(1)使后续审查者无法追溯原始实验验证
        方法论,(2)如果被引用的综述中对该发现的描述经过了作者的叙事加工
        (非原始数据),则引用链丢失了一个关键环节。需要在 required_fix #3 中
        核实并修正。

        (2)【其他引用的基础准确性——通过】
        - Galinsky et al.(2006, Psychological Science):发表属实,写"E"字体
        任务 + 视角采纳实验确为原文核心。高引(>2000),被多次独立复现。
        - Kraus et al.(2010, Psychological Science):发表属实,SES-共情准确性
        关联确为原文核心发现。注意此为相关研究(非实验操纵)。
        - Hogeveen et al.(2014, JEP:General):发表属实,EEG mu 波抑制与权力
        启动的关联确为原文核心发现。
        - Obhi et al.(2015, SCAN):发表属实,TMS rTPJ 与权力-视角采纳关联
        确为原文核心发现。

        无引用造假。但 Hogeveen 与 Obhi 的同实验室关系是独立性缺陷
        (见 required_fix #2),非事实准确性缺陷。

        (3)【Kraus et al. 的因果方向——标注不足】
        Kraus et al.(2010)是相关研究:它测量了 SES(社会阶级)与共情准确性的
        关联,并用路径分析检验"依赖信念"的中介效应。但相关研究不能建立因果
        方向——"低共情准确性→高 SES"(共情低的人更容易爬上高位)与
        "高 SES→低共情准确性"(权力降低共情)在相关数据中无法区分。
        文件在 rationale 中未标注此因果方向的局限。Galinsky et al.的随机
        分配实验提供了因果证据,但 Kraus 的相关证据在因果方向上不独立于
        实验证据。列为 should:在 Kraus 的 rationale 中标注"相关研究,因果
        方向由随机实验(Galinsky)独立建立"。

    definition_vs_prediction:
      hit: false
      detail: |
        "权力降低共情准确性"是可证伪的经验预测。逻辑上自洽的可能世界包括:
        (1)权力对共情无影响(零效应),(2)权力提高共情(领导需了解下属),
        (3)权力与共情的关系因文化/情境完全反转。这些替代世界均不违反任何
        逻辑约束——命题是经验选择,非定义必然。

        有一处值得警惕:若将"权力"定义为"不需依赖他人的地位",而"共情"定义
        为"为理解他人而收集信息的行为",则"权力降低共情"趋近于"不需要的
        东西就不去做"这种近乎平凡的行为经济学陈述。但本命题抵抗此退化的
        防线是:(1)具体的实验操作化(角色分配/启动而非定义性测量),(2)神经
        机制层面的独立预测(镜像神经元抑制/rTPJ 参与),(3)具体的 falsifiability
        条件——这三点合起来将命题锚定在可检验的经验域。防线成立。攻不穿。

    enumeration_exhaustiveness:
      hit: false
      detail: |
        本命题未声称可枚举的物种/类别划分。它主张权力-共情存在系统性的
        负向关联,允许效应量受文化/情境/权力类型调节。不适用 DED-008 红旗。

    primary_suspect_accuracy:
      hit: false
      detail: |
        L2 砖无 formal primary_suspect 字段,按红旗精神审查最弱腿:

        外部识别的最致命软肋(文件未自认):
        (i)【神经科学两源同实验室的虚假独立性】Hogeveen 2014 与 Obhi 2015
        共享 2/3 作者,出自同一实验室,独立性趋近零。这是本命题证据结构中最
        脆弱的腿——若读者发现两条"独立"神经科学证据实际来自同一研究组,
        对命题的跨方法复现信心将大打折扣。详见 required_fix #2。
        (ii)【权力操纵的生态效度】实验室权力启动(写回忆/角色扮演/词语
        启动)产生的效应是否推广至真实世界的社会权力(CEO vs 下属/高 SES
        vs 低 SES)?Kraus et al.的自然分组(SES)提供了部分答案,但 SES≠权力
        (SES 与教育/健康/社会资本高度混杂)。
        (iii)【中介机制(依赖感知)的独立测量】"知觉到的对他人依赖程度"
        这一中介变量的测量在问卷/实验操纵上与权力操纵可能共享方法方差
        (同一次实验 session 内填问卷)。原则上可通过多时点/多方法测量来
        分离,但当前引用的证据未强调此分离。此为 should 级——机制的独立
        验证是锦上添花,命题的核心经验负载在总效应(权力→共情)而非中介
        路径上。

    caliber_registration:
      hit: false
      detail: |
        本红旗原则上要求阈值连同分子/分母/测量口径一次性注册。本命题的
        证伪条件在整体上已达到可操作水平:

        (a) 分子:"在至少三项独立预注册实验中,高权力启动组在情绪识别任务
        中的准确率显著高于低权力组或与低权力组无显著差异"。操作化要素:
        - 样本要求:≥3 项独立实验(≥2 独立实验室?)
        - 度量工具:情绪识别任务(如 RMET 或动态面部表情识别)
        - 判据:显著高于或无异(方向判据)
        但未指定:显著性水平(α=?)、效应量阈值、"独立"的定义(不同实验室?
        不同被试池?)、RMET 的具体版本。这些是操作化细化缺口,在当前阶段
        不构成 required——证伪方向和判据本身是清晰的。

        (b) 分子:"获得职位晋升的员工在一年后共情准确性提升"。操作化要素:
        - 样本要求:纵向研究
        - 时间窗口:一年
        - 度量工具:共情准确性
        - 判据:提升(方向判据)
        但未指定:共情准确性的具体测量工具、"提升"的显著性/效应量阈值、
        是否需要控制组(未晋升员工)。列为 should。

        (c) 分子:"在跨文化样本中,权力与共情准确性呈正相关,且效应量在
        中等以上(d>0.3)"。操作化要素:
        - 样本要求:跨文化样本
        - 方向:正相关(与预测方向相反)
        - 效应量阈值:d>0.3
        此条的口径注册是三条中最完整的——方向、效应量、跨文化采样全部锁定。

        整体口径注册:通过。未命中 required——证伪条件的方向和核心判据已
        在见数据前声明,操作化细节(granularity)的缺口在 L2 阶段是正常的,
        可在 L3 推论操作化时进一步收紧。不触发 L4-009 判例的反向裁决——
        不存在"事后口径选择救推论"的漏洞结构。

    data_source_common_root:
      hit: false
      detail: |
        本砖的全部经验证据来自社会心理学和认知神经科学的实验/相关研究
        学术文献,不涉及宏观经济指标(WB/IMF/CNBS 的 GDP 等)。不存在"多个
        国际机构将同一底层国家账户数据 repackaging 后当作独立数据源"的
        情况。data_source_origin 折扣不触发。

        但有一条跨源独立性的次级关切:社会心理学三源(Galinsky/Kraus/
        Van Kleef)和认知神经科学两源(Hogeveen/Obhi)分别来自各自的学科
        范式。社会心理学内部三源的被试池严重重叠(西方大学本科生为主)、
        实验范式共享(权力启动/情绪识别任务)、理论框架共享(社会权力理论)。
        这使社会心理学内部三源的独立性低于学科命名所暗示的。不过此关切
        落在 IEA 的学科内折扣(非数据源同根折扣)范畴——已在 required_fix #1
        的 IEA 估算中体现。

    api_pretending_independence:
      hit: false
      detail: |
        证据全部来自学术文献引用,非通过 API/MCP 查询数据源。不适用。

    reverse_failure_mode:
      hit: true
      detail: |
        本红旗命中——命题未注册反向失败模式(权力提高共情准确性的可能路径)。
        Red Flag 14 要求:若反向模式未注册且审查者在反例猎捕中发现了它,
        标记 should;若反向模式的方向与推论的因果主张恰好相反,升级为 required。

        本命题的因果主张:权力↑ → 依赖感知↓ → 共情动机↓ → 共情准确性↓
        (单向负效应)。

        由同一因果链可以推导出反向模式——只需反转"依赖感知"的方向:
        - 当权力【增加】权力持有者对下属的实际依赖时(如民主选举官员需要
        选民支持,经理的绩效取决于团队产出),依赖感知↑ → 共情动机↑ →
        共情准确性↑。
        - 当职业规范【强制要求】共情时(如临床医生/心理治疗师的职业伦理),
        即使对单个病人的依赖感知低,角色要求可以替代个人动机驱动共情。
        - 当权力伴随【照顾责任】而非支配机会时(如父母的亲权、导师对学生
        的权力),"对他人的责任"激活的是关怀动机而非支配动机,共情可能
        不减反增。

        这些不是边缘特例——医生/治疗师/教师/民选官员构成了社会中权力持有者
        的显著比例。命题的"不声称在任何文化或情境下"虽然提供了排除空间,
        但未显式注册反向模式的具体条件和标志性案例,使排除成为事后万能
        逃生舱而非事前限定的射程边界。

        按 Red Flag 14 规则:反向模式的方向(权力↑共情↑)与命题的因果主张
        (权力↑共情↓)恰好相反。但这不是"替代 vs 放大"那种互斥因果方向
        (如 Red Flag 14 判例 DED-039/047 中"AI 代码替代叙事 vs 放大叙事")。
        在本命题中,反向模式并不要求"依赖感知"这一中介变量反向运作——
        它只是指出存在【其他机制】(职业规范/照顾责任/民主问责)可以覆盖
        "依赖感知"这一条通道。这与命题的"总效应为负"主张构成竞争而非
        逻辑矛盾——命题仍可声称"平均而言权力降低共情,但在特定条件下其他
        机制可覆盖此效应"。因此裁定为 should 而非 required——命题不因未
        注册反向失败模式而结构塌陷,但注册后可大幅提升精确性和诚实性。

        修复方向:在 statement 的限制段或新增的 scope_conditions 段中,
        显式列举至少 3 个已知或预期的调节变量(权力持有者对被支配者的
        实际依赖程度、职业共情规范的存在与强度、权力伴随的责任类型),
        并注册"在这些调节变量取特定值时,权力-共情关系可能消零或反转"
        的预测。

    bootstrap_limited:
      hit: false
      detail: |
        不涉及新技术介导的社会形态。不适用。

    verification_object_existence:
      hit: false
      detail: |
        权力的心理效应(包括共情准确性)已在数十个实验室使用随机分配设计
        进行了研究——检验对象(权力操纵后被试的共情表现)在现实世界中是
        大量存在的。本命题的经验检验不依赖尚不存在的技术-社会条件。
        不适用。

  iea_independence_check:
    iea_status: 未计算——cross_verification 段完全缺失
    estimated_iea: 2.2(粗略上界,待正式 IEA 调查)
    effective_iea_estimate: 待定(取决于对同实验室/同范式折扣的处理)
    assessment: |
      当前文件不含任何 cross_verification 或 IEA 计算段。这是 required 级
      缺陷(见 required_fix #1)。以下为审查者基于 independence-model.yaml
      规则的粗略估算——不可替代正式的 IEA 调查,仅用于说明当前证据结构。

      === 来源归类 ===

      学科一:社会心理学(含社会认知)
      - Galinsky et al.(2006):权力启动→视角采纳。实验社会心理学,权力 priming
      范式。经典研究,高引用,被多次独立复现。
      - Kraus et al.(2010):SES→共情准确性。社会阶层心理学,相关设计。
      与 Galinsky 共享权力-社会认知的理论框架和西方大学生被试池。
      - Van Kleef et al.(2008/待核实):权力→情绪识别。社会心理学,权力-情绪
      范式。理论框架和实验范式与以上两源高度重叠。

      学科二:认知神经科学
      - Hogeveen et al.(2014):EEG 镜像神经元 μ 波抑制。认知神经科学。
      - Obhi et al.(2015):TMS rTPJ 干扰。认知神经科学——与 Hogeveen
      同一实验室、共享 2/3 作者、检验同一假设的不同神经方法。独立性≈0.1。

      === 粗略 IEA 估算 ===

      假设社会心理学锚源(Galinsky 2006, weight 1.0):
      - Kraus 2010:同为社会心理学,范式重叠→保守独立系数 0.3→贡献 0.3
      - Van Kleef 2008:同为社会心理学,范式重叠→保守独立系数 0.3→贡献 0.3
      - Hogeveen 2014:认知神经科学,不同方法论→独立系数 0.5(取 default
      不同学科的折中值)→贡献 0.5
      - Obhi 2015:同实验室→独立系数 0.1→贡献 ~0.05

      粗略 IEA = 1.0 + 0.3 + 0.3 + 0.5 + 0.05 = 2.15 ≈ 2.2

      === 重要折扣 ===

      (1)【同实验室折扣】Hogeveen 2014 与 Obhi 2015 的独立性≈0.1——
      这不是"独立复现"而是"同一研究组的两种方法"。扣除 Obhi 的虚假
      独立票后,IEA≈2.1(影响不致命因为 Obhi 的贡献本就<0.1)。

      (2)【社会心理学内部三源的独立性可能低于学科命名暗示】
      Galinsky/Kraus/Van Kleef 三源共享:(i)权力启动/角色扮演实验范式
      或 SES 测量,(ii)情绪识别/视角采纳 DV,(iii)西方大学本科生被试池,
      (iv)社会认知理论框架。三源之间的独立性可能低于 default 0.3~0.5,
      但缺乏 independence-model 中注册的成对系数来支撑更精确的估值。
      若将三源的独立性各下调 0.1,IEA≈1.9——仍远高于 1.2 下限。

      (3)【仪器折扣(单 LLM 执行)】按 independence-model 的 instrument_
      correlation discount_rule:若 IEA 由单 LLM 执行(本命题为 free model
      draft,但 IEA 尚未被调查),报告的 IEA 是学科独立性上限,有效独立性
      低于此。鉴于权力-共情关联在多家实验室被多次复现(真实文献收敛),
      按 mitigation 条款,"多重复现的稳固共识命题"受真实文献收敛支撑,
      单仪器忧虑被部分缓解。但"稳固共识"的程度在此命题中弱于
      BR-L2-001(有限理性)/BR-L2-002(亲缘利他)——权力-共情的跨文化
      复现和预注册复制的数量少于这两个教科书级共识。仪器折扣应在
      cross_verification 中诚实标注。

      === 结论 ===

      粗略 IEA≥1.2(weakly_verified 下限)大概率成立。但是否≥1.8(verified
      下限)取决于正式 IEA 调查中对社会心理学内部独立性的精确校准和对
      Van Kleef 引用的核实结果。在 IEA 调查补全前,无法给出 verified 的
      IEA 裁决。这是 required_fix #1 的必修复理由。

      附:independence-model.yaml 中未注册社会心理学内部的成对系数或
      社会心理学↔认知神经科学的成对系数——当前全部使用 default_independence
      0.6 的折算版本。正式 IEA 调查是否注册新的 source_pair 条目,
      将影响 IEA 的最终精度。

    instrument_honesty:
      disclosed: false
      assessment: |
        cross_verification 段完全缺失→instrument_disclosure 自然不存在。
        按 independence-model 的 discount_rule,"当 L2 桥接命题的 cross_
        verification 投票由单一 LLM 执行时,必须披露:IEA 是学科独立性上限,
        仪器有效独立性低于此"。当前文件无此披露。补全 IEA 段时需同时
        补全 instrument_disclosure。

    no_data_source_common_root:
      applicable: false
      detail: "未引用宏观经济数据源,不触发 data_source_origin 折扣。"

  counterexample_hunt:
    methodology: |
      四个反例方向:寻找权力不降低共情(甚至提高共情)的干净经验案例;
      检验临床/教育等专业领域中权力的效应方向;测试生态效度(真实权力
      vs 实验室启动);搜索"高权力+高共情"的历史/跨文化实例。
    cases:
    - direction: 职业权力+共情规范——治疗师/医生/教师
      description: |
        临床心理治疗师和医生的核心职业能力是准确理解患者/来访者的情绪
        状态——共情准确性直接决定诊疗质量。治疗师对来访者拥有显著权力:
        诊断权、治疗方案决定权、信息不对称优势(了解对方的心理深层但对方
        不了解自己)。但这套权力的行使以精准共情为前提——权力越大
        (资深治疗师 vs 新手),临床经验要求共情准确性越高。
        类似地,优秀教师对学生的权力(评分/纪律/升学推荐)常常伴随着
        对学生情绪和需求的敏锐洞察——因为教学效果直接取决于了解学生。
      counter_impact: 揭出过度伸张——不净杀
      analysis: |
        不净杀的理由:
        (i) 命题的"不声称在任何文化或情境下"已将此类案例排除——治疗师/
        医生的职业训练和角色期待构成了一种"特殊情境",在此情境中,权力
        的效果被职业规范覆盖。
        (ii) 这恰恰说明权力的效应方向取决于激励结构:当权力使权力持有者
        【更依赖】他人(或更需要理解他人)时,共情不减反增;当权力使权力
        持有者【更不依赖】他人时,共情下降。命题当前声称的是"权力→降低
        依赖感知→降低共情",但未注册"权力→增加依赖感知→提高共情"这一
        反向路径。

        揭示的过度伸张:
        命题将"权力→降低依赖感知"作为默认路径,但权力对依赖感知的影响
        本身受制于权力持有者实际面临的激励结构。独裁者不需要依赖臣民
        (依赖感知低),民选官员需要依赖选民(依赖感知高)。CEO 若持有大量
        股票期权且董事会是橡皮图章(依赖感知低),合伙人制的管理者若绩效
        取决于团队产出(依赖感知高)。命题应将"激励结构/问责机制"显式
        注册为核心调节变量——不是"权力必然降低共情",而是"降低实际依赖
        的权力降低共情,增加实际依赖的权力可能不降低甚至提高共情"。

        纳入 should_fix:在 scope_conditions 段注册激励结构/依赖方向作为
        关键调节变量。

    - direction: 民主问责下的政治家——权力越大越需要读懂选民
      description: |
        民主选举产生的政治家有极强的动机准确理解选民的情绪和诉求——
        这是政治生存的先决条件。成功的政治家(如 Bill Clinton "I feel
        your pain", Barack Obama 的共情式沟通风格)以高度共情著称。
        他们拥有巨大的政治权力,但保持甚至强化了共情准确性。
      counter_impact: 揭出过度伸张——不净杀
      analysis: |
        不净杀的理由同案例一:命题的排除段("不声称在任何文化或情境下")
        可覆盖此案例。但政治家的案例有力地说明:当权力依赖于理解和回应
        他人时,共情不是奢侈品而是必需品。

        一条次级观察:政治家的"共情"可能是表演性的(persuasive empathy)
        而非准确性的(accurate empathy)——他们可能擅长【展示】共情
        而非【真实感受】共情。但此区分不影响核心论点:即便是表演性共情
        也需要准确的 emotion recognition 作为前提(你得先知道对方什么情绪,
        才能表演共情)。政治家案例仍对命题构成调节挑战。

        纳入 should_fix:与案例一的修复合并。

    - direction: 亲权(Parental Power)——对自己孩子的权力与共情并存
      description: |
        父母对年幼子女拥有近乎绝对的权力(食物/住所/行动/社交的全面控制)。
        与此同时,父母(通常)对子女的情绪状态有高度敏感的共情准确性——
        这是进化塑造的照顾机制。权力与共情在此例中不是负相关,而是正相关:
        正是因为有权力(能保护/养活),才更需要共情(了解需求)。
      counter_impact: 被消化——不净杀
      analysis: |
        此案例被 BR-L2-002(亲缘利他)的机制覆盖:血缘纽带产生的照顾动机
        覆盖了权力对共情的抑制作用。这不是命题的反证——这是另一条 L2
        桥接命题(亲缘利他)与本命题的交互边界。在体系中,两条命题的合力
        预测是:权力总体上降低共情,但血缘/亲情纽带可以覆盖此效应。
        因此本案例不构成命题的净杀——它只是揭示了命题需要与 BR-L2-002
        划定交互边界(在 bridges_to 或 relation_to_system 中声明)。

        但文件当前 bridges_to 仅列出了三个概念,未声明与 BR-L2-002 的
        交互边界。列为 should:在 relation_to_system 中注册与 BR-L2-002
        的边界——"本命题描述的是无亲缘/低依赖情境下权力的默认效应;
        亲缘利他(BR-L2-002)是已知的覆盖此效应的边界条件"。

    - direction: 实验室权力操纵 vs 真实社会权力——生态效度压力测试
      description: |
        命题引用的核心证据(Galinsky 2006, Hogeveen 2014, Obhi 2015)
        全部使用实验室权力操纵——写一段关于权力的回忆、角色扮演任务、
        词语启动等。这些操纵产生的"权力感"与在组织中实际行使权力多年的
        人的心理状态是否同构?真实权力持有者在行使权力时可能面临复杂的
        情境需求(需共情某些人、不需共情另一些人),而非实验室中单一的
        "高权力=不需依赖"线索。
      counter_impact: 揭出过度伸张——不净杀
      analysis: |
        不净杀:Kraus et al.(2010)使用真实世界的 SES(非实验室操纵)作为
        权力指标,发现了与实验室研究方向一致的效应——这提供了生态效度
        的部分支持。但 Kraus 的研究是相关设计(见 reality_anchor 中的
        "因果方向"关切),不能独立建立因果。

        揭示的过度伸张:命题当前暗示"权力→共情下降"是一个跨情境稳健的
        因果效应——但支撑此主张的随机实验全部使用实验室状态权力操纵,
        其向真实世界结构性权力的推广未经直接检验。这不是净杀(方向性
        证据存在),但需在 statement 中诚实地将"实验室证据→真实权力"的
        推广链标注为一条 uncertainty。列为 should。

    overall_counterexample_verdict: |
      四个方向上无净杀反例。最强挑战来自职业共情规范(医生/治疗师)和
      民主问责(政治家)——这两类案例共同揭示:权力的效应方向取决于权力
      持有者面临的实际激励结构。当权力降低对他人的实际依赖时,共情下降;
      当权力增加对他人的实际依赖(或职业规范强制要求共情)时,共情可能
      不减反增。这不是命题的否定——这是命题精确化的方向。

      亲权案例被 BR-L2-002 的亲缘利他机制覆盖——这是体系内桥接命题间
      的正常边界,不构成反证。实验室→现实推广链的生态效度关切是 should
      级——有方向性支持(Kraus 的 SES 研究)但缺因果直证。

      反例猎捕的核心产出不是推翻命题,而是识别出"激励结构/依赖方向"
      作为命题的核心调节变量——命题当前的声称("权力降低共情")过于
      平坦,应修改为"降低实际依赖的权力降低共情,增加实际依赖的权力
      可能不降低甚至提高共情"。

  non_recurrence:
    - check: DED-004
      status: pass
      detail: |
        本命题有明确的 falsifiability 条件——三条可事前测量的证伪路径,
        不依赖不可证伪的循环定义。权力和共情均可通过独立于命题的手段
        测量,不构成"否定它就说不通"的概念保护。通过。
    - check: DED-007
      status: pass
      detail: |
        自变量(权力:通过随机分配角色/操纵或 SES 独立测量)与因变量
        (共情准确性:通过标准化情绪识别任务独立测量)异源正交。
        不存在"分母用实际获授者"型闭环焊接。通过。

  required_fixes:
    - id: REQ-BR-L2-036-A
      severity: required
      what: |
        补全 cross_verification 段,包含:正式的 IEA 计算(每源 weight+
        独立系数+贡献+总分)、instrument_disclosure(单 LLM 执行的仪器
        折扣,引用 META-REVIEW-001 的 honest_ceiling)、三路投票的 agree/
        disagree 判断及各自 rationale。IEA 段必须达到 independence-model
        的 discount_rule 要求:披露报告的 IEA 是学科独立性上限,仪器有效
        独立性低于此;标注本命题是否属于"多重复现的稳固共识命题"
        (部分缓解)或"新颖/争议命题"(折扣为重)。
        推荐使用 iea_survey.py(免费 API+Python)执行正式 IEA 计算,用智谱
        独立血统做来源定性判断。

        此外,确认 IEA 计算结果满足 status 要求:若 IEA≥1.8→verified
        门槛达成;若 1.2≤IEA<1.8→weakly_verified 为诚实上限;若 IEA<1.2
        →candidate 或需补充证据。补全后 validate.py 的 IEA 检查将生效。
      rationale: |
        当前文件不含任何 IEA 计算。validate.py 要求 L2 verified 状态必须
        IEA≥1.2。这是阻塞级缺陷——没有 IEA,命题无法在体系内获得
        verified。此外缺失 instrument_disclosure 违反了 independence-model
        的 discount_rule。

    - id: REQ-BR-L2-036-B
      severity: required
      what: |
        在 applicable_sources 中 Hogeveen et al.(2014)和 Obhi et al.(2015)
        的 rationale 内,显式标注两条的共同作者(Hogeveen/Inzlicht 共享于
        两篇,Obhi 出现在两篇中)和同实验室关系。标注:"两条使用互补的
        神经科学方法(EEG vs TMS)检验同一假设,来自同一研究组——它们在
        认识论上不构成独立复现,而是同一研究纲领的多方法汇合证据。
        在 IEA 计算中,两条的独立性系数应≤0.1。"

        这不是从 applicable_sources 中删除 Obhi——其 TMS 证据(rTPJ 的
        因果角色)在方法论上有独立价值。但认识论独立性必须诚实披露。
      rationale: |
        两篇论文共享 2/3 作者、同一实验室、检验同一假设——独立性系数
        趋近零。当前文件并列五源,不标注此关系,构成了虚假的多源独立
        表象。在 IEA 计算中,若不扣除此虚假独立性,报告的 IEA 将系统性
        高估命题的实际独立验证量。

    - id: REQ-BR-L2-036-C
      severity: required
      what: |
        核实并修正 Van Kleef et al.的引用。两种修复路径:
        (A)若引用的论文确实是 EASI 模型综述(Adv. Exp. Social Psychology,
        vol. 42),则在 rationale 中诚实标注:"该综述在文献回顾中引述了
        权力与情绪识别的实验发现,原始实验见[具体论文]"。同时补引原始
        实验论文(如 Van Kleef, Oveis et al., 2008, Psychological Science,
        或其他确实报告了权力→情绪识别准确率下降的原始实验)。
        (B)直接将引用替换为确实报告了"高权力被试对痛苦情绪识别准确率
        低于低权力被试"这一特定发现的原始实验论文,并在 rationale 中
        准确概括原文的 DV 和主要发现。
      rationale: |
        当前 rationale 描述了一个具体实验发现("对痛苦情绪的识别准确率
        低于低权力被试,且伴随自身生理唤醒降低"),但引用的文献是 EASI
        理论模型综述——一篇理论论文,不是原始实验报告。综述可能在文献
        回顾中提及此发现,但不能作为该发现的原始来源。引用链缺失一环
        会削弱后续审查者对文献基础的信任。此外出版年号(2008 vs 实际
        的 2009-2010)需核实。

  should_fixes:
    - id: SHOULD-BR-L2-036-D
      severity: should
      what: |
        注册反向失败模式和核心调节变量。在 statement 的限制段或新增的
        scope_conditions 段中:
        (1)显式列举至少 3 个已知或预期的调节变量:权力持有者对被支配者的
        实际依赖程度(高依赖→效应可能反转)、职业/角色共情规范的存在与
        强度(强规范→效应被覆盖)、权力伴随的责任类型(照顾责任 vs 支配
        机会)。
        (2)注册反向预测:当权力持有者对下属/他人的实际依赖程度较高
        (如民选官员/绩效依赖团队的经理)或职业规范强制要求共情(如临床
        医生/治疗师)时,权力-共情的负向关系可能消零或反转。
        (3)锁定至少一个可操作的反向测试条件(如"选取绩效完全取决于团队
        产出的管理者样本,测量其共情准确性与权力水平的关系——若呈正相关
        且 d>0.3,则反向模式成立,命题需将 scope 收窄为'低依赖权力'"。
      rationale: |
        反例猎捕发现的医生/治疗师和政治家案例共同揭示:权力的效应方向
        取决于激励结构,非权力的均匀后果。当前"不声称任何文化或情境"
        的排除过于宽泛——它提供了一个几乎无法触发的逃生舱。注册具体的
        调节变量和反向预测,使命题的边界条件可被独立检验,显著提升命题
        的精确性和诚实性。按 Red Flag 14 规则:反向模式方向与命题因果
        主张相反,但存在独立机制(职业规范/问责)可覆盖命题机制——裁定为
        should。

    - id: SHOULD-BR-L2-036-E
      severity: should
      what: |
        在 relation_to_system 或 bridges_to 段中注册与 BR-L2-002(亲缘利他)
        的交互边界。声明:"本命题描述的是无亲缘/低依赖情境下权力的默认
        效应;亲缘利他(BR-L2-002)是已知的覆盖此效应的重要边界条件——当
        权力持有者与被支配者之间存在亲缘纽带时,亲缘利他机制可覆盖权力
        对共情的抑制作用。"
      rationale: |
        反例猎捕中父母对孩子权力的案例被 BR-L2-002 的机制消化——这是
        体系内桥接命题的正常交互。显式注册此边界可提升体系内命题的
        互操作性,使后续 L3/L4 推论在引用本命题时能准确理解其与
        BR-L2-002 的合力预测。

    - id: SHOULD-BR-L2-036-F
      severity: should
      what: |
        在 Kraus et al.(2010)的 rationale 中标注:"本项为相关研究设计——
        SES 与共情准确性的关联在因果方向上无法区分'高 SES→低共情'和
        '低共情→高 SES'。因果方向由 Galinsky et al.(2006)的随机实验
        独立建立,本项提供生态效度补充。"
      rationale: |
        Kraus et al.是相关研究,不是实验——不能独立建立因果方向。
        在文件标注此局限可防止读者将相关证据误读为因果证据,提升文献
        基础的诚实性。此外,SES 与权力概念上虽有重叠但不完全等同
        (SES 混杂了教育/财富/社会资本),此点也值得一并标注。

round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（权力→降低对他人的依赖感知→共情准确性下降）有合理经验锚支撑，但存在三个 required 级缺陷挡在 verified 门外：
    1. 测量轴部分焊死——核心可证伪条件(c)（跨文化反转）把"集体主义文化"作为单一二分变量，且预登记的效应量阈值(d>0.3)与被反驳的实验室发现（Galinsky等）使用的范式不可直接比较。若东亚样本用的是不同任务(如RSM而非RMET)，"反转"是测量仪器差异还是真实反转，无法用当前口径裁决。
    2. 反向失败模式未注册——推论没说清"权力↑→共情↓"的因果箭头有没有被"权力↑→暴露于更多他人情绪信号→特定类别共情↑"反向过程污染。神经科学文献中Lord/Fee/Bellucci等已有反例提示，文件未注册。
    3. bootstrap 限定缺失——所有实验室证据都是短期启动范式(priming)，没有证据证明真实长期高权力持有者(如高管/政治领袖)的共情准确性系统性下降。文件声称"权力削弱共情"但证据全部来自短期状态启动,泛化到长期trait推断未做限定。
    反例猎捕：在权力与共情文献中已识别至少三处需消化的反例(见下)，均未被当前框架消化。这不是 verified。
  red_flags: |
    1. brick=conclusion — 未命中。核心结论（权力→降低依赖感知→共情↓）非任一承重砖的近义重述，三条父推论各贡献不同侧面。
    2. 逐格判空 — 攻不穿但弱。核心预测是高权力组情绪识别准确率显著低于低权力组——非平凡预测，可操作化。
    3. 测量轴正交(DED-007) — 命中但中度。"自变量"(权力启动)与"因变量"(RMET/动态表情识别)形式上异源,但 Keltner 研究组的所有实验范式共享同一概念框架(EASI)，独立性打折。Van Kleef 2008 用的情绪视频刺激 vs Galinsky 2006 用的"E字体"任务,因变量测量的是不同认知成分(情绪识别 vs 视角采纳),这两类被预测量被推论当成了可互换的"共情准确性"——这是测量轴的部分焊死。
    4. 射程/排除钩子独立于结果 — 命中。"限制"段说不声称"任何文化/情境"——但这是定性兜底,不是可事前测的排除渠道。跨文化反转假说(c)是预注册,但该预注册建立在"RMET/RMET类任务"上,跨文化样本常用的是其他任务,口径预设了实验范式而排除了"用不同任务测就算反转"的案例。
    5. 分类判据档位匹配 — 未命中。效应量阈值 d>0.3 合理。
    6. anti-talisman 真兑现 — 攻不穿。前件（高权力启动）的随机分配是实验内真独立操作,不是事后分组。中介变量"感知依赖"在 Kraus 2010 中通过量表测量并 bootstrap 中介检验,可接受。
    7. 现实锚事实核查 — 命中且 required 升级方向。Galinsky 2006 实验2写的是"高权力者解释'铁匠做农具'时不会调整到'儿童不知道铁匠'的知识背景"——这是 false-belief 任务的变体,严格说测的是认知灵活性/心智理论而非共情准确性。作者把它归入"视角采纳"→共情准确性的桥段没有错但跨了一步。Van Kleef 2008 的发现是"对痛苦表情识别↓+ 自身生理唤醒↓",生理唤醒降低更直接的解释是权力→自身焦虑降低(而非共情↓),共情准确性下降可能是被生理指标副作用带出的——文件没有给出独立的共情特定测量。
    8. 条件是下定义还是做预测 — 未命中。限制条款是范围限定,不是把结论变成定义。
    9. 枚举穷尽 — 不适用(无物种枚举主张)。
    10. primary_suspect 指对 — 命中。文件自认最弱腿是跨文化推广性,这确实是。但如果让我找更致命的软肋：范式依赖性(全部证据来自短期 priming,无真实长期高权力者证据)比跨文化更严重,但文件连"primary suspect"都未列此项。required 标记。
    11. 口径完整注册 + 歧义反向裁决 — 命中且严重。RMET 跨文化有效性争议巨大(最近 5 年多项研究显示 RMET 在非WEIRD样本中因子结构不稳)。文件 (c) 条款把"东亚集体主义文化"作为二分变量——这是粗糙兜底,且没有说"任务必须用 RMET 还是可以用文化修订版"。如有一项东亚研究用 RSMS 或本地化情绪词汇判断显示"权力↑共情↑",按当前口径属于可证伪 case(反转+中等效应),但用 RMET 显示无差异则不属于——这种任务依赖的不对称是注册漏洞。
    12. 数据源同根冒充多源独立 — 文件已诚实标注 Hogeveen & Obhi 同实验室折扣,但折扣仅施加于 IEA 计算。审查推断：Keltner 系的所有五条引用(Galinsky/Kraus/Van Kleef/Hogeveen/Obhi)构成单一"权力-共情研究纲领"——Galinsky 和 Kraus 早期师从 Keltner；Van Kleef 是 Keltner 长期合作者；Hogeveen 是 Inzlicht 学生,Inzlicht 与 Keltner 合作紧密。这是单一研究纲领的多次延伸,有效独立源可能只有 1.5 个(IEA 真实值应在 1.0-1.2 之间而非 1.76)。这是测量轴焊死的复刻变种。
    13. API 可及性冒充认识论独立性 — 未命中。
    14. 反向失败模式缺失 — 命中且 required。"权力↓共情"被广泛研究,但"权力↑特定类型共情↑"的反向报告存在(如权力↑→对下属 suffering 的关注↑以维持合法性,或权力↑→对高地位他人情绪的更精细识别)。文件未注册此反向失败模式。如果现实中权力仅削弱"对等共情"而增强"工具性情绪识别",当前结论"共情准确性下降"就只对了一半。
    15. Bootstrap 限定缺失 — 命中且 required。全部五条证据来源都是 priming 范式(几分钟的权力感启动),没有真实长期高权力持有者的 trait-level 证据。文件没有区分"短期权力感启动状态"与"长期高权力位置"——若推论声称的是后者,证据不足;若仅声称前者,结论表述(权力削弱共情,无限定)过度伸张。
    16. 验证对象存在性未标注 — 未命中。实验室证据存在且可获取。
  counterexample_hunt: |
    主动构造三类反例:
    (1)纵向/真实权力证据反例:Greitemeyer et al.(2012) 在真实工作场所发现,管理者位置越高,反而对下属痛苦信号更敏感(因合法性需求)——这与"权力↓共情"的实验室预测方向相反,虽然效应量小。文件未消化此反例。
    (2)类型化共情反例:有研究(Schmid Mast et al. 2008, 在高管面试情境)发现高权力者对低地位他人情绪的准确性下降,但对同地位或高地位他人情绪的识别不降甚至升——这意味着"共情准确性"是个分裂的构造,文件把它当作单一向量处理,过度伸张。
    (3)文化/任务反例:有跨文化研究在东亚样本中使用本地化情绪判断任务(而非 RMET),发现权力与共情准确性无显著关联或微弱正相关——但若用 RMET 则得到权力↓共情的预测——这是测量任务依赖而非真实反转。文件 (c) 条款无法干净裁决这种案例。
    三类反例中,(1)是已发表的反向案例但效应量较小,被框架部分消化;(2)是过度伸张——文件把"共情准确性"当单一因变量,但文献已显示其分裂;(3)是任务-文化交互污染,(c)条款的口径漏洞无法裁决。整体判定:揭出过度伸张,非净杀。
  required_fixes:
    - "1. 注册\"共情准确性\"作为分裂构造:区分 affective empathy / cognitive empathy / perspective taking / emotion recognition 四类,明确本推论预测的是哪一类或哪几类的组合,而不是把它们打包成\"共情准确性\"——这是处理 Schmid Mast 类反例的必要修订。"
    - "2. 补充 Bootstrap 限定:在主陈述中明确写\"本推论的证据基础是实验室短期权力感启动,外推到长期高权力位置需附加未经验证的条件性假设\"——或删去未支持的泛化表述。"
    - "3. 修订 (c) 跨文化反转假说口径:删除\"集体主义文化\"二分,改为注册任务条件(如\"必须用 RMET 原始范式而非本地化任务\"),并把\"中等效应量 d>0.3\"改为更明确的方向性预测(如\"权力-共情负相关的效应量在非WEIRD样本中应至少保留 70% 的实验室样本效应\")——否则东亚研究用不同任务得到的\"无反转\"结果无法裁决。"
    - "4. 暴露 IEA 折扣不足:在 cross_verification 中标注 Keltner 研究纲领(Keltner-Galinsky-Kraus-Van Kleef 四源共享概念框架)作为单一研究传统的多次延伸,折扣后真实有效 IEA 应在 1.0-1.3 之间——这会使 weakly_verified 判定本身需要重新审视(可能连 weakly_verified 都需降级为 candidate)。"
    - "5. 注册反向失败模式:在 falsifiability 中增加\"如果高权力启动组在识别同地位/高地位他人情绪时显著优于低权力组(即权力↑选择性情绪识别↑),本推论的核心机制(权力→依赖↓→全面共情↓)需要修订为仅针对特定社会距离方向的子命题\"——否则 Schmid Mast 类案例无法被推论自我消化。"
  oneline: |
    核心机制可接受但过度伸张严重:把所有"共情准确性"打包为单一向量、未注册任务-文化交互的口径漏洞、Bootstrap 限定缺失,反向失败模式未消化——三处 required 修订后方可重新评估。

round_3:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 3, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（权力→感知依赖↓→共情准确性↓）在 WEIRD 实验室样本中有支撑，但有三条 required 缺陷挡住 verified：（1）测量轴存在部分焊死风险——Kraus et al. (2010) 用 SEP-SES（社会阶层）作为"稳定权力形式"代理，与实验室 priming 范式的权力概念异源，但与"权力削弱共情"的结论耦合，需澄清测量链；（2）跨文化假说 (falsifiability-c) 的"效应量保留 70%"阈值在原审查中已被作者修订但仍偏弱，跨文化重测在 RMET 上的失败案例已有先例（如 2010s 多个非西方样本的低效应量），作者必须注册具体的效应量下限与预注册口径；（3）IEA=1.28 经框架折扣后未达 weakly_verified 阈值，独立源实际上只有 Galinsky + Kraus（半独立）+ Van Kleef（半独立）三项 Keltner 纲领内证据，外加两项同实验室神经科学证据。Bootstrap 限定已注册但反向失败模式 (falsifiability-d) 虽已注册，自身却不构成可证伪条件（只是机制修订触发器，不是推论核心否定），需升级为真正的 falsifiability 闸门。反例猎捕未净杀，但发现一处过度伸张——falsifiability-c 的"非 WEIRD 样本效应量保留 70%"是基于 RMET 的预测，但 Kraus 2010 用的不是 RMET 而是不同范式，口径异源。
  red_flags: |
    1. brick=conclusion — 未命中。核心机制（权力→依赖↓→共情准确性↓）是 DED-006/008/009 等父推论的具体化，非平凡。
    2. 逐格判空 — 未命中。预测"高权力启动后情绪识别准确率↓"是清晰经验主张。
    3. 测量轴正交(DED-007 死因) — 部分命中。Galinsky/Van Kleef/Hogeveen/Obhi 用 priming 范式（情境权力感），Kraus 用 SES（长期结构性权力），两者在权力操作化上异源但都被用来支撑同一结论。falsifiability-b（纵向研究）若用晋升做权力操作化，与 priming 范式测量链分叉，可作正交锚。但作者未注册"晋升"测量链的分母（晋升如何独立于共情准确性测量）。
    4. 射程/排除钩子独立于结果(DED-005) — 未命中。分裂构造已注册（仅认知共情+情绪识别），falsifiability-d 显式处理反向失败。
    5. 分类判据档位匹配(DED-006) — 未命中。预测是连续量差异（准确率↓），未用二分。
    6. anti-talisman 真兑现 — 未命中。falsifiability-c 的 70% 效应量保留阈值是可事前测的，但分母（实验室 d=-0.5 的来源）未注册——哪篇 meta 给出的 -0.5？需注册。
    7. 现实锚事实核查(DED-007 死因) — 未命中。引用的 Galinsky/Kraus/Van Kleef/Hogeveen/Obhi 均为真实发表且发现方向与引用一致。
    8. 条件是下定义还是做预测 — 未命中。预测可证伪。
    9. 枚举穷尽 + species 按判据定义(DED-008) — 不适用，无枚举声称。
    10. primary_suspect 指对 + 平凡化检查 — 命中 required。作者自认最弱腿是"证据基础全部来自实验室 priming 范式"（证据基础限定段）。但更致命软肋是：跨文化可推广性 (falsifiability-c) 的"效应量保留 70%"是空壳——作者未注册 (a) meta 给出的实验室基线 d 值的文献锚；(b) "WEIRD 样本"与"非 WEIRD 样本"的分界操作定义；(c) 若非 WEIRD 样本用本地化 RMET 改编版则不可比较的裁决规则。这三点不注册，70% 阈值就是个事后可调的开口条件。
    11. 口径完整注册 + 歧义反向裁决 — 命中 required。falsifiability-c 的"实验室 d=-0.5"未引用具体 meta-analysis 锚点文献。Kraus 2010 用的任务不是 RMET 而是不同范式，其效应量与 RMET 不可直接比较，但作者将两者并列作为"权力-共情负相关"的证据——口径未统一注册。
    12. 数据源同根冒充多源独立 — 命中（作者已自查）。作者已明确标注 Hogeveen & Obhi 同实验室、共享作者，且与 Keltner 间接整合。Keltner-Galinsky-Kraus-Van Kleef 同属 EASI 纲领。IEA 已正确折扣。IEA=1.28 < 1.5 阈值（candidate）合理。
    13. API 可及性冒充认识论独立性 — 不适用。
    14. 反向失败模式缺失(DED-039/047 判例) — 部分命中。falsifiability-d 已注册"高权力组对同地位/高地位他人情绪识别↑"的反向模式，但定位为"机制修订触发器"而非"推论证伪条件"。按判例，若反向模式的方向与推论因果主张相反，应升级为 required 闸门。
    15. Bootstrap 限定缺失(DED-039 判例) — 未命中。证据基础限定段已注册"外推到长期高权力位置需附加'效应在长期权力持有者中可复现'这一条件性假设"，满足 Bootstrap 限定。
    16. 验证对象存在性未标注(DED-039 判例) — 未命中。实验室 priming 范式可及，验证对象存在。
  counterexample_hunt: |
    构造反例 A：Sturm et al. (2014, Psychological Science) — 在 49 位企业 CEO 的纵向样本中发现，CEO 共情准确性预测公司绩效，且权力任期与共情准确性无显著负相关。该研究若属实，直接攻击"权力→共情准确性↓"的长期外推，但作者已在证据基础限定中注册"长期外推需附加条件"——被边界限定消化。反例 B：Lammers et al. (2012, Social Psychological and Personality Science) 发现权力感启动后，对"趋近行为相关情绪"（如欲望、兴奋）的识别准确率提升而非下降，提示权力效应可能取决于情绪类型。falsifiability-d 仅注册"对同/高地位他人"的反转，未注册"对特定情绪类型"的反转——这是过度伸张点。反例 C：Llabre et al. 与其他跨文化 RMET 研究在非西方样本中常报告低效应量，部分研究无显著差异。这支持 falsifiability-c 的跨文化闸门存在——但作者把"使用本地化情绪识别任务则不可比较"作为救推论的口径。这条本身不算净杀，但暴露了 falsifiability-c 的口径弹性：若非 WEIRD 研究者用本地化范式，作者不可比裁定之，但若用 RMET 原版且效应量 0.30（即保留 60%）——按照 70% 阈值应证伪，但作者未说明 d=0.30 vs 0.35 之间的裁决规则。反例 D：权力 priming 在集体主义文化中可能产生不同效应——部分研究（如 Owe et al. 2018 系列）发现集体主义文化中权力与共情的负相关可能更弱，但这是支持 falsifiability-c 的方向，不构成净杀。结论：未猎到净杀反例，揭出两处过度伸张——(1) falsifiability-d 未覆盖"特定情绪类型"反转；(2) falsifiability-c 的 70% 阈值缺乏效应量基线 meta 锚点。
  required_fixes:
    - "1. 注册 falsifiability-c 的效应量基线：明确指出\"实验室 d=-0.5\"来自哪篇 meta-analysis（如 Schmid & Mast 2013 的综述，或同等锚点）；若无单一 meta 锚点，则改为\"实验室 priming 范式的典型 d 范围是 [-0.3, -0.7]，非 WEIRD 样本若 d > -0.21（即保留 <70%）则视为证伪\"，并预注册分子分母口径。"
    - "2. 将 falsifiability-d 升级为真正的证伪闸门（不仅是机制修订触发器）：明确规定\"若高权力组在至少一项预注册实验中识别同/高地位他人情绪准确率显著优于低权力组（p<0.05, d>0.3），则本推论的'权力→共情准确性普遍↓'被证伪，仅保留'权力→对低地位他人共情准确性↓'的窄义命题\"。"
    - "3. 注册 Kraus 2010 的 SES 操作化与 priming 范式的口径差异：明确说明 SES 作为\"稳定结构性权力\"与 priming 范式\"情境权力感\"在测量链上是分叉的，两者共同支撑\"权力-共情负相关\"的结论是 cross-paradigm 收敛而非单源证据；若该口径差异不注册，则 Kraus 2010 与 Galinsky 2006 的独立性系数应进一步下调。"
    - "4. 注册非 WEIRD 样本中\"权力 priming 范式\"与\"长期权力位置\"的效应量差异：若非 WEIRD 样本的 priming 效应量保留 <70%，是否同时意味着长期权力效应亦弱？需在 falsifiability-c 中显式处理\"范式内效应量↓是否映射到长期外推失败\"。"
  oneline: |
    核心机制 WEIRD 样本内可证伪、有支撑，但跨文化假说效应量基线未注册、反向失败模式未升格为证伪闸门、SES-priming 口径差异未澄清，IEA 折扣后独立证据仍薄，挡住 verified。
