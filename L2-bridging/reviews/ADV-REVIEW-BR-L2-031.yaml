id: ADV-REVIEW-BR-L2-031
type: adversarial_review
reviews: BR-L2-031
layer: L2-bridging
target: BR-L2-031
target_term: 制度信任的不对称衰减 (Asymmetric Decay of Institutional Trust)
rounds: 2

人话摘要: |
  对 BR-L2-031(制度信任不对称衰减——掉得快涨得慢)的 round-1 独立对抗审查。
  裁 needs_revision:核心直觉(损失厌恶+信息不对称→信任易碎)经验上稳固,反例猎捕
  未发现时间比<1:1 的干净净杀,但存在 3 条 required 缺陷:(1)核心声明的"幅度"主张与
  证伪测试的"时间比"操作化不匹配——"一次失信>多次守信"从未被测量;(2)"排除复合事件"
  分类判据未预注册,开启事后 cherry-pick 通道;(3)锚源证据(信任博弈 fMRI)主要测人际
  信任不对称,向制度信任的推广缺直接证据桥,而 IEA 薄边(IEA=2.0,门槛=1.8)使这条
  推广链比表面数字更脆弱。IEA 披露诚实但薄边+锚源缺制度信任直证的组合构成 required。

round_1:
  reviewer: independent-adversarial-reviewer
  date: 2026-07-15
  verdict: needs_revision
  verdict_note: |
    本命题的核心直觉——制度信任掉得快、涨得慢——是经验上稳固的。损失厌恶在信任域的
    投影(Slovic 1993 信任不对称原则,三十余年跨方法复现)提供了坚实的理论基底;经济史
    通道的 Gallup/Edelman 时间序列和阿根廷自然实验为"陡降缓升"提供了独立经验锚。
    反例猎捕未发现恢复快于衰减(时间比<1:1)的干净净杀案例。

    但三条 required 级缺陷阻止 verified 裁决:

    1.【操作化错位——声明测幅度,证伪测时间】核心 statement 声称"一次失信事件的伤害
    幅度 > 多次守信事件的增益幅度"——这是【每事件冲击量级】的主张。但 falsifiability (a)
    测试的是恢复时间/衰减时间比(时间维度),而"多次守信"维度从未被操作化。幅度不对称
    和时间不对称是不同量——信任可在短时间内暴跌 30 点但用 10 年爬回(时间比>1,幅度比
    不确定),也可以每次守信只涨 0.01 点、百万次守信>一次失信(幅度比推翻但时间比不测)。
    当前证伪测试只覆盖了声明的一半。需或把声明收窄为时间不对称,或追加幅度比测试。

    2.【事件分类事后风险】falsifiability (a)要求"排除复合事件(如金融危机般多事件叠加)",
    但"复合/单一"的划界标准未预注册。若一个多事件案例(如欧债危机——希腊违约+爱尔兰
    银行危机+意大利政治动荡)显示对称恢复,分析师可事后归为"复合"排除。必须预注册:
    多少独立事件、多长窗口内、多大因果关联算"复合"——在见数据前锁定。

    3.【锚源跨层推广链缺直接证据+IEA 薄边】锚源(行为经济学,weight 1.0)的 fMRI/信任
    博弈证据主要测【人际信任】违背的神经不对称(King-Casas 2005 的信任博弈是两人互动,
    Baumgartner 2008 的 oxytocin 研究也是人际)。砖声称的是【制度信任】(对非人格化
    制度/机构的信任)。从人际信任到制度信任的推广是 plausible 但缺直接证据桥——制度
    信任涉及对抽象规则系统/组织程序的信任,而非对具体个人的信任,神经机制是否同构
    是开放问题。经济史通道(0.6)确实提供了制度信任的直证(Gallup 银行信任),但这条
    是折后通道,权重只有 0.6。IEA=2.0 薄边过线(门槛 1.8,差 0.2),若锚源的制度信任
    适用性被打折,有效 IEA 可能跌破门槛。这不是要推翻 IEA 数字——而是要求砖在 statement
    或 cross_verification 中诚实地将人际→制度的推广链作为一条显式 uncertainty 声明。

    三条 required 均可通过定向修订修复(非结构塌陷),故判 needs_revision 而非 rejected。
    核心不对称直觉成立,需补的是操作化对齐、分类判据预注册、推广链诚实声明——三条合计
    将把一条有实质内容但未完全拧紧的命题推入 verified 门槛。

    附 2 条 should:澄清"多次守信"的非可加性假设;收紧"不声称"段以减少 talismanic
    逃生舱。

  red_flags:
    brick_is_conclusion:
      hit: false
      detail: |
        制度信任衰减-建立不对称(掉得快涨得慢)这一核心主张不在任何 L1 公理/定理中。
        AXIOM-002(信息熵增)说信息/关系不维护会衰减,但不声称衰减速度与建立速度存在
        系统性不对称。THEOREM-relation-information-asset 说关系是需维护的信息资产,
        同样只断言衰减存在,不规定衰减-建立的不对称比。BR-L2-010 说制度能替代人际
        信任(能力命题),BR-L2-024 说法币信用连续可逆(连续性命题),均不涉及衰减-建立
        斜率不对称。

        本砖将一般性损失厌恶(Kahneman-Tversky 损失权重 2-2.5 倍)特化投射到制度信任
        域,再加上信息不对称的放大效应,产生了一个非平凡的经验主张:制度信任不仅会衰减,
        而且衰减-建立存在系统性的不对称斜率。这不是 L1 的复述——L1 没有"信任"概念,
        也没有"不对称衰减"概念。非平凡经验内核成立。

    empty_cell_tautology:
      hit: false
      detail: |
        核心空格预测:若制度信任衰减-建立对称(即 DED-007 式的对称世界),则(1)恢复时间
        不应系统性长于衰减时间;(2)同等显著性的正面制度事件应与负面制度事件产生等量
        信任变化;(3)信息传播不对称不应系统性地偏向负面。这些都是可观察的反事实。

        但有一个微妙点:falsifiability (a)的"恢复时间/衰减时间比"测试与核心 statement
        的"幅度"主张之间存在操作化缝隙。"一次失信 > 多次守信"中的"多次守信"维度从未
        被证伪测试覆盖——这是逐格判空的盲区,而非同义反复。详见 red_flag 11(口径注册)
        和 counterexample_hunt 中的"守信事件可加性"条目。

    measurement_axis_orthogonality:
      hit: false
      detail: |
        自变量(制度失信事件)和因变量(信任水平变化)在原则上可异源测量:失信事件可通过
        客观记录识别(养老金停发/监管机构正式认定造假/违约公告),信任水平通过独立调查
        (Gallup/Pew/Edelman Trust Barometer)测量。这与 DED-007 的"分母用实际获授者"
        型焊点有本质区别——IV 的识别不依赖于 DV 的读数。

        但存在一个次级风险:falsifiability (a)的"排除复合事件"判据若未预注册,分析者
        可能看信任曲线形状后再决定某事件是"单一"还是"复合"——这构成后验分类偏误。
        不过这是事件分类判据的问题(见红旗 4 和 required_fix #2),而非测量轴的焊接。
        核心 IV-DV 的异源性在结构上成立。

    scope_exclusion_independent:
      hit: false
      detail: |
        排除项按可事前测的渠道划界:
        (a) 不声称所有制度信任有相同不对称系数——排除的是参数均一性,非核心主张。
        (b) 不声称不对称不可缓解——排除的是政策不可干预性,独立渠道(制度设计改革是否
        生效可通过独立指标测量)。
        (c) 不声称所有制度失信都不可修复——排除的是修复不可能性,只保留"不成比例"。

        falsifiability (a)中"排除复合事件"的划界标准未预注册,是 required 级缺陷
        (见 required_fix #2)。但排除的方向(多事件叠加→噪音太大无法归因)在原则上合理,
        问题出在操作化而非逻辑。falsifiability 段已预先声明此排除,非事后添加——
        只是"复合"的判定标准不够 sharp。

    classification_granularity:
      hit: false
      detail: |
        本命题处理连续量(信任指数、时间比、神经激活幅度),未强行将连续体切为离散箱。
        时间比阈值的设定(≥2:1 支持,<1.5:1 削弱,<1:1 证伪)是连续谱上的分界点,
        非不当二分。但"复合/单一"事件的二分是潜在的分类问题——见红旗 4。

    anti_talisman:
      hit: false
      detail: |
        证伪条件在原则上是可事前测的真证伪路径:
        (a) 时间不对称比<1:1(恢复不慢于衰减)→核心主张证伪。这是可预注册的判据:
        采集≥20 个独立制度失信事件的时间序列,计算恢复/衰减时间比中位数,与阈值比较。
        (b) 神经不对称在控制信息显著性后归零→"损失厌恶独立机制"被证伪。这也是
        可事前设计的实验:操纵信息显著性,比较正向意外 vs 负向意外的神经反应。

        两条证伪路径均不依赖于结果反推前件——可在收集数据前锁死判据和口径。反例出现时,
        按照预注册阈值裁决,无需事后调整。anti-talisman 的结构条件满足。

        但"不声称"段的措辞提供了一定的 talismanic 缓冲——"不声称所有制度失信都不可
        修复——修复是可能的,只是需要不成比例的时间和正面证据积累"。若某案例显示
        修复时间"不成比例"但比<1.5:1(削弱区),砖可辩称"不成比例"不是严格定量主张
        因而未被削弱。这属措辞级 talisman 而非结构级——见 should_fix #2。

    reality_anchor_fact_check:
      hit: false
      detail: |
        IEA 调查员已核出一处数字偏差:Gallup 银行信任 2007 年约 41%(非原文 53%)。
        此偏差不影响"深谷+慢恢复"的方向性结论,已登记。

        独立复核增补以下要点:
        (1) Kahneman-Tversky(1979, Econometrica)损失厌恶——发表属实,损失权重 2-2.5
        倍是原文核心发现,引用准确。
        (2) King-Casas et al.(2005, Science)信任博弈 fMRI——发表属实,确实证明背叛后
        前脑岛激活与信任行为调整相关。IEA 调查员已修正 Rilling 引用错位(Rilling 2002
        主要证明合作→纹状体,背叛神经不对称的更强证据在 King-Casas 2005/Rilling 2004)。
        (3) Baumgartner et al.(2008, Neuron)oxytocin 与信任违背——发表属实。
        (4) Slovic(1993, Risk Analysis)信任不对称原则——发表属实,是本砖核心主张最直接
        的经典文献前身(负面事件对信任的破坏力系统性大于正面事件的建设力),值得被提及。
        (5) Kim et al.(2004, 2006, JAP)诚信型违背修复——发表属实,IEA 调查员已修正
        Dirks 等(2009)发表期刊(Academy of Management Review 非 Annals)。
        (6) Rousseau(1989, 1995)心理契约——发表属实。
        (7) 中国古代"朝令夕改"/商鞅徙木立信——历史记载方向一致,属轶事级证据(砖本身
        在 economic_history rationale 中已承认属轶事级)。

        无致命事实错。但有一个【推广链层面的诚实性关切】:锚源引用的 King-Casas 2005、
        Baumgartner 2008、Rilling 等的 fMRI 证据全部测量【人际信任】违背(两人信任
        博弈中合作/背叛的神经相关物),而非【制度信任】违背(对银行/监管机构/养老金系统
        的信任)。从人际信任的神经不对称推广到制度信任的神经不对称,是 plausible 但
        未经直接证据桥接的跨越。这构成 required_fix #3,非事实错但属推广链诚实性缺陷。

    definition_vs_prediction:
      hit: false
      detail: |
        "制度信任衰减-建立不对称"是可证伪的经验主张,非必然为真的定义。对称衰减(恢复
        与衰减等速)在逻辑上自洽——不存在"对称就不可能"的逻辑约束。信息传播不对称
        偏向正面(好消息传得比坏消息快)也是逻辑可能的世界。命题的核心贡献恰恰在于声称
        现实世界选了不对称路径——这是经验选择问题,非定义。

        但有一条边界值得注意:若将"损失厌恶"定义为"负面事件比正面事件有更大的心理
        影响",那么将它应用于信任域得到的"信任损失>信任增益"就趋近于定义性延伸而非
        经验预测——因为信任损失/增益本就属于负面/正面事件的一个子类。真正使本命题
        走出定义性的,是(1)信息不对称这条独立机制(非损失厌恶的必然推论),(2)具体到
        制度信任域的经验参数(时间比≥2:1、神经不对称不可归零)。组合后构成可检验的
        经验整体,不落入纯定义。

    enumeration_exhaustiveness:
      hit: false
      detail: |
        本命题未声称可枚举的物种/类别划分。它主张制度信任衰减-建立不对称的通用结构性
        特征,允许参数(不对称系数)受制度设计/历史/文化调节。不适用 DED-008 红旗。

    primary_suspect_accuracy:
      hit: false
      detail: |
        L2 砖无 formal primary_suspect 字段(L3 要求),但按红旗精神审查最弱腿:

        砖自认的关系(relation_to_system):与 BR-L2-010(制度替代能力)互补——BR-L2-010
        说制度【能】替代,本砖说替代后的制度信任【易碎】。此自认准确且非弱腿。

        外部识别的更致命软肋(砖未自认):
        (i) 【人际→制度推广链】锚源证据测的是人际信任违背,砖声称的是制度信任。
        这是最致命的潜在软肋——如果制度信任的神经/心理机制与人际信任不同构,
        锚源的大半证据力将失效。详见 required_fix #3。
        (ii) 【"多次守信"的可加性假设】砖声称"一次失信 > 多次守信"隐含假设背景
        守信事件的效果不可线性累积。在一个运转良好的制度中,每天发生千万次"守信事件"
        (每笔养老金到账、每次认证通过)——如果每次有微小正向效果且可累积,总和可能
        超过单次失信的伤害。砖未交代此非可加性假设,构成隐式伸张。详见 counterexample
        _hunt 中的"守信可加性"条目。
        (iii) 【两条机制的独立可分离性】砖声称链(1)损失厌恶与链(2)信息不对称"各自
        独立可测"。但两者在实际经验中存在交互:信息不对称(坏消息传得远)可能正是
        损失厌恶(人对坏消息更关注)在信息传播层面的表现,而非独立机制。falsifiability
        (b)设计的实验(控制信息显著性后测神经不对称)可在原理上分离两者,但实际执行
        中"显著性操纵"与"损失/收益 framing"难以彻底解耦。这是 L2 正常模糊带,
        列为 should 而非 required。

    caliber_registration:
      hit: true
      detail: |
        本红旗命中——"口径完整注册"要求阈值连同分子/分母/测量口径一次性注册,
        且反例出现后的事后口径选择一律反向裁决(判例 L4-009)。本命题在该维度
        存在两条缺陷:

        (1)【核心声明与证伪测试的操作化错位——REQUIRED】
        statement 声称:"一次失信事件对制度信任的伤害幅度 > 多次守信事件对制度信任
        的增益幅度"。关键词:幅度(magnitude per event)、多次(multiple fulfillments)。
        但 falsifiability (a)测试的是:"恢复时间 / 衰减时间 ≥ 2:1"。这是时间比,
        非幅度比;是单次事件周期的恢复动力学,非"一次 vs 多次"的每事件冲击量比较。
        "多次守信"维度在整份 falsifiability 段中从未被操作化——没有分子、没有分母、
        没有阈值。这是口径注册的核心缺口:声明测 A,证伪测 B,A 的测量口径根本不存在。

        按 L4-009 判例精神:若反例出现后砖试图将"幅度"重新解释为"时间比"来救推论,
        此重新解释一律按不利方向裁决。但更根本的修复是在见数据前就对齐两者:
        or 将声明收窄为时间不对称(删除"一次>多次"的幅度措辞),or 为幅度比追加独立
        的证伪测量(如:控制事件显著性后,测量单次失信事件的信任降幅 vs 单次守信事件
        的信任升幅,注册最小可检测比)。

        (2)【"复合事件"分类判据未预注册——REQUIRED】
        falsifiability (a)声明"排除复合事件(如金融危机般多事件叠加,因多事件叠加
        无法归因于单一失信的不对称效应)"。排除方向合理,但"复合/单一"的划界标准
        未预注册。需要锁定:多少独立事件、多长窗口内、多大因果关联度算"复合"?
        若无预注册,分析者可看数据后决定——对支持推论的案例放松标准(归为"单一"),
        对不利案例收紧标准(归为"复合")。这违反 L4-009 的事后口径反向裁决原则。

        (3)【其他口径注册项——通过】
        falsifiability (a)的分子(恢复至失信前水平的中位时间/年)、分母(触发至触底
        的中位时间/年)、测量工具(Edelman/Gallup/Pew 时间序列)、样本要求(≥20 事件,
        ≥5 国家/领域)、阈值(≥2:1 支持,<1.5:1 削弱,<1:1 证伪)均已一次性注册。
        falsifiability (b)的神经不对称测试:分子(负向意外神经激活)、分母(正向意外
        神经激活)、控制条件(信息显著性操纵)已注册,但显著性操纵的具体操作化(怎样
        算"同样显著/意外"?)未完整注册——这不构成 required,因(b)是补充性机制测试,
        不承担核心证伪负载。

        两条 required(操作化错位+复合判据未注册)+一条 should(显著性操纵操作化细化)
        列入 required_fixes 和 should_fixes。

  iea_independence_check:
    behavioral_economics_anchor:
      weight: 1.0
      role: 锚源
      detail: |
        锚源地位正当:行为经济学/神经经济学对损失厌恶×信任违背的研究有三十余年跨方法
        复现(Slovic 1993→King-Casas 2005→Baumgartner 2008),证据链厚实。引用经
        IEA 调查员复核收窄后(Kahneman-Tversky + Slovic + King-Casas + Baumgartner,
        Rousseau 剔除归入组织心理学通道),核心证据力不变。

        但存在一条【推广链层面的独立性质疑】:锚源的所有核心证据(fMRI 信任博弈、
        行为实验信任违背)测量的均是【人际信任】(两个具体个人之间的信任关系)。
        本命题声称的对象是【制度信任】(对非人格化制度/机构的信任——银行、监管机构、
        养老金系统)。从人际信任到制度信任的推广并非 trivial——制度信任的对象是抽象
        规则系统而非具体个人,其心理表征可能涉及不同的认知/情感模块(如对"系统公平性"
        的信念 vs 对"对方品格"的评估)。锚源为"信任不对称"提供了坚实的机制模板,
        但"这个模板适用于制度信任"本身是一个额外的、未被锚源直证的经验假设。
        这构成 required_fix #3 的核心内容。

    economic_history:
      reported_weight: 0.6
      reported_independence: default_independence 0.6
      scrutiny: |
        经济史通道是本命题三条通道中最重要的一条——它是唯一直接测量【制度信任】
        (银行信任/货币信任/监管信任)而非人际信任的通道。证据方向复核成立:
        Gallup 银行信任序列"陡降缓升"(低谷 2012 约 21%),阿根廷 2001 违约后
        储蓄美元化长期不退、疤痕效应等。方法论(大规模调查时间序列/历史档案/
        比较案例研究)与锚源(实验室/神经科学)真独立——不共享方法、不共享语料、
        不共享研究者社群。0.6 default_independence 合理,甚至可能偏低(方法论距离
        超过 evo_bio↔cultural_universals 的 0.6)。

        关键角色:若锚源对制度信任的适用性被质疑(见上),经济史通道就是 IEA 支柱中
        唯一承载制度信任直证的通道。此时 IEA 的有效下限 = 经济史通道可独立支撑的
        部分,而非三通道加总。

    organizational_psychology:
      reported_weight: 0.4
      reported_independence: |
        作者自估 0.5 → IEA 调查员下调至 0.4(因与锚源的 Rousseau 语料重叠+
        信任博弈范式共享)
      scrutiny: |
        0.4 的折扣幅度是否充分?双方(组织心理学通道与锚源行为经济学通道)共享:
        (1) 信任博弈实验范式(锚源用 fMRI 版,组织心理学用行为版——仪器不同但
        核心结构同源);(2) Kahneman-Tversky 损失厌恶理论框架;(3) 原来共享 Rousseau
        心理契约文献(已从锚源剔除,但仍属同一学术谱系)。此外两者研究方法论存在
        重叠:实验室实验+量表测量,被试池类似(西方大学生为主)。

        独立性低于 behavioral_economics↔economic_history 的 0.6 是确定无疑的。
        0.4 作为净折扣是保守但可辩护的估值。然而,若将 behavioral_economics↔
        organizational_psychology 作为一对正式 source_pair 加入 independence-model,
        更诚实的独立性系数可能是 0.3-0.35(共享核心范式+理论框架+重叠学术谱系)。
        以 0.35 重新折算:org_psych 有效贡献=0.4×0.35/0.6≈0.23(因原 0.4 已是
        折后权重,此为大致的敏感性分析)。IEA 将约=1.0+0.6+0.23=1.83——仍勉强
        过线(1.8),但余量几乎为零。

        建议(should):在 independence-model 中追加 behavioral_economics↔
        organizational_psychology 成对系数,使 L2 审查者可引用而非每次手动估值。

    instrument_correlation_discount:
      disclosed: true
      disclosure_quality: honest
      detail: |
        cross_verification.verdict_note 诚实披露了单 LLM 执行的仪器相关性:
        "IEA=2.0 是【学科独立性上限】,【仪器有效独立性低于此】"。引用了
        ICV-001 布干达判例说明共享语料如何制造虚假一致。达到 independence-model
        discount_rule 的要求。

        对 mitigation 的评估:损失厌恶×信任不对称属"多重复现的稳固共识命题"
        (Slovic 1993 起 30+年跨方法收敛),受真实文献收敛支撑,单仪器忧虑被部分缓解。
        但需注意:文献收敛主要体现在【人际信任不对称】上(信任博弈→fMRI→田野实验),
        制度信任的不对称文献收敛程度低于人际信任——经济史通道是大规模调查/历史
        档案(非受控实验),组织心理学通道是真实雇佣关系(部分受控)。跨通道收敛的
        "稳固性"在制度信任层面弱于人际信任层面。这是另一条支撑 required_fix #3 的
        理由。

    iea_verdict:
      reported: 2.0
      threshold_verified: 1.8
      margin: 0.2
      thin_margin_concern: |
        IEA=2.0 仅超过 verified 门槛 1.8 达 0.2。配合两个因素:
        (1) 锚源证据力集中在人际信任(非制度信任),(2) 单 LLM 执行带来的仪器折扣。
        0.2 的余量在"锚源对制度信任适用性打折+仪器折扣"的联合压力下显得薄弱。

        敏感性分析:若将 behavioral_economics↔organizational_psychology 的独立性按
        更诚实估值折算(见 org psych scrutiny),IEA≈1.83——仍过线但几乎无余量。
        若进一步考虑锚源的制度信任适用性天然折扣(锚源并非完全不适用于制度信任,
        只是适用性差一档——从"直接测量"降为"强类比"),IEA 可能降至 1.6-1.7。
        在此情境下,经济史通道(0.6)成为唯一真正独立的制度信任直证通道,单通道
        不足以支撑 verified(需要≥1.8 需要至少两个准独立来源)。

        这不是推翻 IEA 数字的裁决——当前 IEA=2.0 按 independence-model 规则计算
        合规。但诚实性要求:砖必须在 statement 或 cross_verification 中将"人际→制度
        推广链"的不确定性显式化,使读者能自行评估 IEA 数字背后的证据结构。列入
        required_fix #3。
      honest_ceiling: |
        IEA=2.0 是合规计算值。但 honest ceiling(考虑推广链折扣+仪器折扣后的
        有效独立性上限)可能低于 1.8——不过这不改 IEA 数字(按模型规则,仪器折扣
        只披露不调数,推广链折扣是证据权重问题非独立性系数问题)。关键是披露诚实性
        而非数字调整。
      conclusion: |
        IEA 计算合规,披露诚实。但薄边(2.0 vs 1.8)+锚源跨层推广链缺直证的组合,
        使 verified 在"锚源对制度信任适用性"这一维度上存在未了悬案——这不能靠调
        IEA 数字解决,只能靠追加制度信任直证或在声明中诚实标注推广链不确定性来化解。
        当前状态下,这不足以单独毙掉 verified(不是 IEA 虚高/计算错误),但与其他
        两条 required 合力,构成 needs_revision 的综合依据。

  counterexample_hunt:
    method: |
      主动构造/搜寻能证伪核心主张的跨文化/历史/跨情境经验案例。核心主张:制度信任
      衰减-建立不对称——一次失信事件的伤害幅度 > 多次守信事件的增益幅度,且恢复
      时间长于衰减时间(≥2:1)。逐一评估净杀 vs 被消化 vs 揭示过度伸张。
    cases:
      - case: 恢复时间不慢于衰减时间(时间比<1:1)——净杀条件
        search_domain: |
          搜索历史上制度失信后快速恢复的案例。需要:可识别的单一失信事件+
          可追踪的信任时间序列+恢复时间≤衰减时间。
        candidates_examined:
          - "瑞典 1990s 银行危机后金融监管信任恢复——瑞典银行危机(1991-1993)后,
            政府担保+Bad Bank( Securum/Retriva )有效处置,监管信任在 1990s 后期
            恢复。衰减期约 3 年(1990-1993),恢复期约 4-5 年(1994-1999)——
            比约 1.3-1.7:1,落于削弱区但不<1:1。"
          - "Johnson & Johnson Tylenol 1982 危机——氰化物投毒致 7 人死亡,
            品牌信任暴跌(数周内市场份额从 35%→8%),J&J 通过全面召回+防篡改包装
            恢复市场份额至危机前水平约 1 年。衰减期约 2-3 周,恢复期约 12 月——
            时间比约 17-26:1,反而是极强的支持案例。且此为品牌信任(非制度信任),
            不完全在 scope 内。"
          - "日本制度信任在丑闻后的快速仪式性恢复——Olympus(2011)/Toshiba(2015)
            会计丑闻后,高管公开道歉-辞职的仪式性修复对相关监管机构信任的影响:
            丑闻曝光期(数周至数月),监管机构信任恢复期难以精确定量(与制度改革的
            长期效果耦合)。可能的时间比难以可靠估计,不构成可靠净杀。"
          - "韩国 1997 亚洲金融危机后金融监管改革——金大中政府关闭不良银行+
            引入 KAMCO+存款保险改革后金融体系信任恢复。衰减期约 1 年(1997-1998),
            恢复期约 3-4 年(1999-2003),比约 3-4:1——支持案例。"
        conclusion: |
          未找到恢复时间≤衰减时间(比<1:1)的干净净杀案例。现有案例的恢复/衰减
          时间比多在 1.3:1 至 10:1 范围,整体支持不对称方向。时间比维度通过反例猎捕。

      - case: 守信事件可加性——若背景守信可累积,单次失信<多次守信被推翻
        mechanism: |
          砖声称"一次失信 > 多次守信"的幅度比。在日常运转良好的制度中,每天发生
          大量的"守信事件"(养老金到账、认证通过、合同执行),如果每个守信事件有
          微小正向信任效应且这些效应可线性累积,总和可能压倒单次失信的伤害。
        test: |
          需要证伪的是可加性假设。若信任增益服从累加律(每守信事件 +ε,1000 次
          =1000ε),则在稳定制度中累积守信增益迟早超过单次失信伤害。
        evaluation: |
          砖的机制隐式否认这可加性——损失厌恶的参照点逻辑说:守信是"维持现状",
          不改变参照点;失信是从参照点下降,改变参照点。只有改变参照点的事件
          才计入信任调整。但这本身就等于在说"守信不累积"——是机制的一部分,
          非独立检验。

          可加性假设的反面证据:前景理论的日常经验——人们不会因为"今天又没被
          车撞"而每天更快乐一点(适应水平理论),类似地,"养老金今天又发了"可能
          确实不累积信任。但这不是砖提供的——是依赖砖的机制承诺来回答的,
          构成了"机制→预测"的封闭循环。

        verdict: 被消化(机制层面)
        digestion: |
          砖的损失厌恶机制隐式否认守信可加性:守信被编码为"维持参照点"非"收益",
          因此不改变信任水平。这在心理学上 plausible(适应水平/范围-频率理论),
          但消化依赖机制本身而非独立证据。对转的严格性有削弱——若对方接受机制,
          则可加性挑战被吸收;若对方不接受机制,则可加性复活。
        required_note: |
          砖的 statement 和 falsifiability 从未交代"多次守信"中的"多次"如何定义
          (n=?累积窗口?),也未声明守信事件的非可加性假设。这使"一次>多次"成为一个
          无法独立检验的主张——因为"多次"的操作化被无限期推迟。与 required_fix #1
          (幅度主张的证伪缺口)构成同一问题的两个面。

      - case: 人际→制度推广的反例——制度信任不遵循人际信任的不对称规律
        mechanism: |
          若制度信任的心理机制不同于人际信任,则锚源的行为经济学/神经经济学证据
          不能直接支撑本命题。
        evidence_probe: |
          制度信任涉及对抽象规则系统的信念(如"这个养老金公式对所有人都一样"
          "监管机构会独立调查"),其违背的认知评估路径可能不同于人际信任违背
          (后者涉及意图归因/品格推断/关系贬值等社会认知模块)。fMRI 文献中,
          制度信任的研究远少于人际信任——前者涉及"系统正当性"(system justification)
          和"程序公平感知"的不同神经基础(如 DLPFC 而非前脑岛主导)。
        tentative_evaluation: |
          目前缺乏制度信任不对称的直接神经/行为实验证据,但反向证据(制度信任
          的神经基础与人际信任完全不同且遵循对称律)同样缺乏。这是一个经验上
          的开放问题。不能构成 net-kill(无明确反例),但暴露了推广链的未了悬案。
        verdict: 揭示过度伸张(锚源证据被过度推广至制度信任域)
        digestion: 纳入 required_fix #3——要求诚实声明推广链的不确定性。

      - case: 制度学习效应——社会从失信中学习,后续信任更稳健
        counter_mechanism: |
          若社会从制度失信中学习(改进监管/加强透明度/建立制衡),则恢复后的
          制度信任可能比原先更稳健——后续失信的伤害递减。这挑战"每次失信都
          产生不对称伤害"的跨时间恒常性。
        evidence: |
          2008 金融危机后,多国加强了银行监管(巴塞尔 III,压力测试,消费者
          金融保护局),使银行体系的抗风险能力增强。若再次发生类似事件,
          信任伤害幅度可能因制度改进而缩小。
        evaluation: |
          砖的"不声称"已注明"(b)不声称不对称不可缓解——制度设计可通过降低
          失信概率和加速信息修正来部分缓解"。制度学习→降低后续失信概率属于
          此范畴。不构成净杀。
        verdict: 被消化(已由"不声称不对称不可缓解"覆盖)

      - case: 文化变异——某些文化中制度信任更对称(儒家/高权力距离文化)
        mechanism: |
          在高权力距离文化中,人们对制度的期望可能更低(本就预期制度不可靠),
          因此失信的心理冲击较小(参照点更低,损失的主观值更小)。同时,低期望
          使守信可能被编码为"收益"而非"维持现状"——反转不对称方向。
        evidence_probe: |
          World Values Survey 的机构信任数据显示,部分高权力距离国家(如中国、
          马来西亚)的机构信任基线较低但波动也较小——低信任+低波动=不对称幅度
          可能被压缩。
        evaluation: |
          砖已声明"不声称所有制度信任都有相同的不对称系数"。文化变异→参数
          调制属于 scope 内允许变异。但若存在文化中制度信任的建立速度快于
          衰减速度(逆转不对称方向),则可能构成净杀。
        current_evidence: |
          未找到明确逆转方向的文化案例(建立>衰减的制度信任文化)。低基线信任
          的波动通常仍呈不对称(负面事件影响>正面),只是绝对幅度压缩。
        verdict: 被消化(参数调制,非方向逆转)

    net_kill: none
    exposed_overreach: |
      一条过度伸张被揭示:锚源(行为经济学/神经经济学)的人际信任不对称证据
      被过度推广至制度信任域,而推广链未经直接证据桥接。纳入 required_fix #3。
    conclusion: |
      四条挑战路径逐一猎捕。未发现时间比<1:1 的干净净杀案例(搜索了银行危机后
      监管恢复、品牌危机恢复、亚洲金融危机后改革、日本丑闻后仪式性修复等多个
      领域)。也未见制度信任不对称方向明确逆转的文化案例。

      最强挑战来自两个方向:(1)"守信可加性"——若多次守信可累积,单次失信<多次
      守信可能被推翻,此挑战被损失厌恶机制消化但消化依赖机制自洽;(2)"人际→制度
      推广链"——锚源证据不直测制度信任。后者揭示了过度伸张而非净杀。

      反例猎捕支持核心不对称方向的稳固性,但同时确认了 required_fix #1 和 #3
      的紧迫性。

  required_fixes:
    - |
      【操作化对齐】将核心 statement 的"幅度"主张与 falsifiability 测试对齐。
      二选一:(A)将 statement 收窄为时间不对称——"制度信任恢复至失信前水平
      所需的时间系统性长于失信使信任下降所经历的时间(中位比≥2:1)",删除
      "一次失信事件的伤害幅度 > 多次守信事件的增益幅度"中无法被 falsifiability
      覆盖的幅度措辞;或(B)保留幅度主张,但追加独立的幅度比证伪测试——操作化
      "多次守信"的计数单元(n=?累积窗口?)、测量单次守信事件的信任增益量级,
      注册"一次失信幅度 / 一次守信幅度 ≥ 2:1"的阈值。

      推荐(A)——时间不对称是现有 evidence base 能支撑且已有 falsifiability
      测试匹配的主张。"一次>多次"的幅度主张虽然在直觉上有吸引力,但其操作化
      负担(计数单元/累积模型/基线控制)远超当前证据能支撑的范围,硬保留反而
      会留下一个永久不可证伪的半条声明。
    - |
      【预注册"复合事件"分类判据】在 falsifiability (a)中锁定"复合事件"的
      排除标准——在见任何制度失信数据前:(i)时间窗口:多事件间隔≤N 月(建议
      12 个月)且信任指标在窗口内持续下降→视为复合;(ii)因果关联度:若事件 B
      可由事件 A 直接引发(如银行违约→信用评级下调→债券抛售),链条内各事件
      视为同一"复合事件"的组成部分;(iii)事先锁死分类规则后,对所有事件
      一致适用——不允许看信任曲线后再决定。

      此外,应声明:若排除"复合"事件后样本量不足(如<20),则时间比主张的样本
      要求未满足,命题在该维度上为"暂未达标"而非"被证实"。
    - |
      【诚实声明人际→制度的推广链不确定性】在 statement 末尾或 cross_verification
      中追加一段 honest-uncertainty 声明。要点:(i)锚源(行为经济学/神经经济学)
      的核心证据(fMRI 信任博弈、行为实验信任违背)测量的是【人际信任】不对称,
      其对【制度信任】的适用性是 plausible but untested 的推广;(ii)制度信任的
      不对称主张主要靠经济史通道(0.6)的 Gallup/Edelman 调查时间序列和阿根廷
      自然实验直接支撑,但此通道权重仅 0.6——不足以独立达到 verified IEA 门槛;
      (iii)当前 IEA=2.0 在"锚源完全适用于制度信任"的假设下合规,但若将锚源的
      适用性从"直接测量"下调为"强类比",有效 IEA 的可信度会打折;(iv)对策:
      未来追加制度信任的神经/行为实验直证(如 fMRI 研究公众对养老金削减/监管
      失败的神经反应),或降低命题的 verified 门槛依赖(如从 verified 降为
      weakly_verified,直至制度信任直证到齐)。

      此声明不调整 IEA 数字(按 independence-model 规则,跨层推广属于证据权重
      而非独立性系数),但将不确定性显式化——使未来的独立审查者/读者能自行评估
      证据结构的诚实稳健性。

  should_fixes:
    - |
      【澄清"多次守信"的非可加性假设】在 core_mechanism 或 falsifiability 段
      显式声明:本命题隐含假设——背景守信事件(日常制度运转正常)的效果【不线性
      累积】至信任水平,因为守信被编码为"维持参照点"而非"获得收益",不触发信任
      上调。这与前景理论的价值函数形状一致(参照点处为拐点,维持现状的效用变化
      为零),但需显式化以防被误读为任意次守信<一次失信的魔术数字。

      若作者选择 required_fix #1 的选项(A)(收窄为时间主张),则此条可省略——
      时间主张不依赖"多次守信"的比较。
    - |
      【收紧"不声称"段的 talismanic 措辞】当前"不声称"段的三条 carve-out 中,
      第三条("不声称所有制度失信都不可修复——修复是可能的,只是需要不成比例的
      时间和正面证据积累")存在 talismanic 风险——"不成比例"未量化,可被事后
      用来消化任何接近对称的案例。建议收紧为:"修复需要的时间中位比≥2:1(与
      falsifiability (a)阈值一致),若某案例修复时间/衰减时间<2:1,则该案例对
      命题构成削弱(但<1:1 才证伪)"。这将 carve-out 与证伪测试统一口径,消除
      两套标准。

  non_recurrence: {}

round_2:
  reviewer: independent-adversarial-reviewer-r2
  date: 2026-07-15
  verdict: needs_revision
  verdict_note: |
    本轮为全新上下文的独立对抗审查（与 r1 审查者无关）。r1 三条 required 修复已落地：
    (1) 核心声明收窄为纯时间不对称（删除"一次>多次"幅度措辞），falsifiability (a)
    时间比测试直接承重——操作化对齐完成；
    (2) compound_event_criteria 已预注册（≥2 独立事件 / ≤12 月窗口 / 因果链条判据，
    注册日期 2026-07-15，附样本不足"暂未达标"声明）——分类判据事前锁定完成；
    (3) 锚源 rationale 显式标注人际→制度推广链 plausible but untested，追加
    falsifiability (c)（制度信任被直测无不对称则命题削弱）——推广链诚实声明完成。

    r1 三条修复提升了命题的严谨性，但本轮审查揭露了一条 r1 未充分展开的结构性缺陷：
    IEA 的测量对象与命题声称对象之间存在系统性的错层（category mismatch）。

    IEA=2.0 的三票测量的是"信任不对称"（trust-asymmetry 一般命题），而本命题声称的
    是"制度信任的不对称衰减"（institutional-trust-asymmetry 特殊命题）。拆解如下：
    - behavioral_economics (weight 1.0)：fMRI/信任博弈全部测量【人际信任】违背与修复
      的不对称——被试与具体个人互动，非与抽象制度互动。对制度信任仅提供机制类比。
    - economic_history (weight 0.6)：唯一直接测量【制度信任】的通道——Gallup/Edelman
      银行/政府信任时间序列、阿根廷货币制度信任自然实验。
    - organizational_psychology (weight 0.4)：测量员工-组织信任（雇佣关系中的心理契约
      违背/修复），属人际信任与制度信任的混合地带——组织是人+规则的综合体，不完全
      等同于非人格化制度。

    若将 IEA 按"对制度信任的直接证据贡献"重新审视：
    - 制度信任直证：economic_history 0.6 + organizational_psychology 部分贡献
      （折半计 ≈0.2）= 约 0.8，远低于 verified 门槛 1.8，甚至低于最低门槛 1.2。
    - 即使慷慨估值（org_psych 全额 0.4 计为制度信任），制度直证 IEA = 0.6 + 0.4 = 1.0，
      仍低于 1.2 下限。

    这不是 IEA 计算错误——按 independence-model 规则，IEA=2.0 的计算是合规的。问题是：
    计算合规的 IEA 测量的是"信任不对称"（一般命题），而命题 term 和 statement 明确
    声称的是"制度信任"（特殊命题）。二者之间存在范畴错层——IEA 数字为一般命题提供了
    强支撑，但特殊命题只继承了其中一小部分直证。r1 的 required_fix #3 要求"诚实披露
    推广链不确定性"——这已做到。但诚实披露不改变证据结构本身：制度信任直证依然只有
    ~0.6-1.0 的独立当量，不能靠披露来魔术般地达标。

    这对 verified 裁决是硬障碍。verified 要求 IEA ≥ 1.8——这个门槛的存在理由恰是确保
    命题有足够的多源独立证据支撑，使后续 L3/L4 推论可以安全地以此为前提。若 BR-L2-031
    以 verified 身份进入体系，后续推论在引用它时会看到 IEA=2.0 并合理地认为"制度信任
    不对称衰减"已获多源确证——但这与证据结构的实际构成不符：大部分证据力来自人际信任，
    制度信任本身仅靠一条折后通道（0.6）+ 一条混合通道（0.4）支撑。

    命题本身经验上不弱——核心直觉（掉得快涨得慢）在人际信任域是三十余年跨方法复现的
    稳固共识，在制度信任域有 Gallup/Edelman 调查和阿根廷案例的方向性支持。反例猎捕
    未发现时间比<1:1 的净杀。但"方向性支持"与"多源确证"之间的差距恰是 verified 与
    weakly_verified 之间的差距。

    综合裁决：needs_revision。一条 required——IEA 的范畴错层必须解决（非拒绝，可靠
    定向修复救活）。两条 should——测量轴次级焊点 + 机制独立性高估。r1 的 should_fixes
    已被 r1 修订消化（收窄后"守信可加性"不再适用，"不声称"段已收紧）。

  red_flags:
    brick_is_conclusion:
      hit: false
      detail: |
        收窄后（纯时间不对称）的命题仍非 L1 复述。AXIOM-002（信息熵增）断言信息/关系
        不维护会衰减，但不规定衰减-建立的斜率不对称。THEOREM-relation-information-asset
        同理。BR-L2-010 说制度能替代人际信任（能力），BR-L2-024 说法币信用连续可逆
        （连续性），均不涉及时间不对称。L1 甚至没有"信任"概念。

        非平凡经验内核：将一般性损失厌恶（Kahneman-Tversky 损失权重 2-2.5 倍）特化
        投射到制度信任域，加上信息不对称放大效应，产生可检验的时间比预测（≥2:1）。
        这不是"损失厌恶存在"的复述——后者是心理学事实，前者是社会制度层面的动力学
        推论。非平凡性成立。

    empty_cell_tautology:
      hit: false
      detail: |
        核心空格预测清晰：若世界是对称的（制度信任衰减与建立等速），恢复/衰减时间比
        应接近 1:1。实测比若 <1:1 则核心主张被证伪——这是可观察的反事实，非定义性
        真理。1:1 对称世界在逻辑上完全自洽（正面/负面制度事件的心理冲击等量且信息
        传播对称），选择不对称路径是经验主张而非逻辑必然。

        收窄为时间主张后，r1 识别的"逐格判空盲区"（幅度 vs 时间操作化错位）已消除——
        falsifiability (a) 的时间比测试直接对应 statement 的时间不对称主张。

    measurement_axis_orthogonality:
      hit: false
      detail: |
        主测量轴正交：IV（制度失信事件——养老金停发/认证造假/监管失败等客观可识别事件）
        与 DV（信任水平——Gallup/Pew/Edelman 独立调查时间序列）异源测量，不存在
        DED-007 式"分母用实际获授者"的焊接。IV 的识别不依赖 DV 的读数。

        但 compound_event_criteria 中 criterion (ii) 存在次级焊点风险（见下
        secondary_weld_concern）——不构成主测量轴焊接（分类判据的部分 DV 依赖不等于
        IV-DV 焊接），但值得作为 should 记录。

    scope_exclusion_independent:
      hit: false
      detail: |
        排除项可事前测：
        - 不声称所有制度信任有相同不对称系数 → 排除参数均一性
        - 不声称不对称不可缓解 → 排除政策不可干预性
        - 不声称所有制度失信都不可修复 → 排除修复不可能性

        compound_event_criteria 已预注册（日期 2026-07-15），排除方向（多事件叠加→
        噪音太大无法归因）原则上合理。criterion (ii) 的部分 DV 依赖见下 secondary
        weld concern，但不改变">排除方向独立于结果"的总体判断。

    classification_granularity:
      hit: false
      detail: |
        时间比是连续量，阈值设定（≥2:1 支持 / <1.5:1 削弱 / <1:1 证伪）是连续谱上
        的分界点，非不当二分。但 1.5-2.0 区间未明确定义（是"弱支持"还是"不确定"？）
        ——列为次要 should。

        compound/single 事件二分是测量需要，判据已预注册。criterion (ii) 的次级焊点
        见下。

    anti_talisman:
      hit: false
      detail: |
        三条证伪路径均可事前测试：
        (a) 时间比 < 1:1 → 核心证伪。判据和口径已预注册，阈值锁定。
        (b) 神经不对称在控制显著性后归零 → 损失厌恶独立机制被证伪。
        (c) 制度信任被直测无不对称 → 推广链断裂，命题削弱。

        三条均不依赖结果反推前件。满足 anti-talisman 结构条件。

        但存在一个次级 talisman 风险："暂未达标"声明（若排除复合事件后样本 <20）
        配合狭窄的合格事件定义（"单次可辨识的制度丑闻/违约/监管失败"），可能使命题
        在操作层面长期免于实证检验——因为满足所有 inclusion 条件的干净案例稀少，
        跨 5+ 国家/领域的 n≥20 收集难度高。这不是结构级 talisman（命题未用循环定义
        保护自己），而是操作级 deferral risk。列为 should。

    reality_anchor_fact_check:
      hit: false
      detail: |
        IEA 调查员已复核全部引用：
        - Kahneman-Tversky (1979) 损失厌恶 2-2.5x → 属实
        - Slovic (1993) 信任不对称原则 → 属实，Risk Analysis 13(6)
        - King-Casas et al. (2005, Science) → 属实
        - Baumgartner et al. (2008, Neuron) → 属实
        - Kim et al. (2004, 2006, JAP) → 属实
        - Rousseau (1989, 1995) → 属实
        - Gallup 银行信任 2007→2012 陡降 → 属实（数字修正 53%→41%，方向不变）
        - 阿根廷 2001 违约后美元化长期不退 → 属实
        - 商鞅徙木立信反面 → 轶事级，方向一致

        一处引用错位（Rilling 2002 定位修正）和一处期刊名修正（AMR 非 Annals）
        已登记，均不伤实质。无致命事实错。

    definition_vs_prediction:
      hit: false
      detail: |
        收窄后更清晰：制度信任衰减-建立存在 ≥2:1 的时间不对称——这是可证伪的经验预测。
        对称世界（1:1）在逻辑上自洽，选择不对称路径是经验主张。损失厌恶应用于信任域
        有一定的"定义性延伸"风险（信任损失/增益本就是负面/正面事件的子类），但组合
        (1) 信息不对称独立机制 + (2) 制度信任域的特殊性 + (3) 具体时间比参数后，
        整体构成可检验的经验命题，不落入纯定义。

    enumeration_exhaustiveness:
      hit: false
      detail: |
        未声称可枚举物种/类别。允许不对称系数受制度设计/历史/文化调制。DED-008 红旗
        不适用。

    primary_suspect_accuracy:
      hit: false
      detail: |
        砖自认的最弱腿——人际→制度推广链——识别准确。r1 revision 已诚实披露并配
        falsifiability (c)。

        本轮审查识别出另一条可能更致命的软肋（砖未自认）：IEA 的范畴错层——
        IEA=2.0 测量的是"信任不对称"一般命题，而命题声称的是"制度信任不对称"
        特殊命题。这不是推广链的 uncertainty 问题（已披露），而是 IEA 计权对象的
        范畴对准问题——多数票投给了与命题不完全相同的目标。详见 verdict_note 和
        required_fix。

        另有一条次级软肋：两条机制（损失厌恶 + 信息不对称）的独立性可能被高估——
        信息不对称（人对坏消息更关注/传播）可能是损失厌恶在信息处理层面的表现，
        而非独立机制。falsifiability (b) 的实验设计试图分离二者，但"显著性操纵"与
        "损失/收益 framing"在实操中难以彻底解耦。列为 should。

    caliber_registration:
      hit: false
      detail: |
        r1 在此红旗命中两条 required（操作化错位 + 复合判据未预注册）。r1 revision 后：

        (1) 操作化对齐——已修复。statement 收窄为纯时间不对称，falsifiability (a)
        的时间比测试直接承重。分子（恢复至失信前水平的中位时间/年）、分母（触发至
        触底的中位时间/年）、测量工具（Edelman/Gallup/Pew）、样本要求（≥20 事件，
        ≥5 国家/领域）、阈值（≥2:1 支持 / <1.5:1 削弱 / <1:1 证伪）全部一次性注册。

        (2) 复合事件判据预注册——已修复。三条判据（独立事件数 ≥2 / ≤12 月窗口且信任
        持续下降 / 因果链条）+ 注册日期（2026-07-15）+ 事后重新分类反向裁决声明 +
        样本不足"暂未达标"声明。符合 L4-009 判例精神。

        本轮不再命中口径注册红旗。但 criterion (ii) 的次级焊点（用信任轨迹辅助事件
        分类）见下 secondary_weld_concern——这不属于"口径未注册"（判据已注册），
        而属于"注册的判据内部包含 DV 依赖"——是测量轴问题，非口径注册问题。

  secondary_weld_concern:
    issue: |
      compound_event_criteria 的 criterion (ii) 规定："上述独立事件间隔 ≤12 个月，
      且信任指标在该窗口内持续下降（未在两事件之间恢复至前一事件前水平）"→视为复合
      事件、排除出样。

      此判据使用信任轨迹（DV——trust metric 是否在两事件间恢复）来判定事件的
      "单一/复合"分类（IV 的处理方式）。虽然目的正当（避免多事件叠加导致无法归因），
      但 DV 进入了 IV 的分类逻辑——这在结构上属于次级测量轴焊点（secondary weld）。

      具体风险：若一个制度失信事件导致的信任衰减【慢】（花 3-5 年才触底），在此
      漫长衰减期内发生另一无关失信事件（间隔 <12 月且信任未恢复），按 criterion (ii)
      两事件被合并为"复合事件"排除——即慢衰减案例被系统性排除、快衰减案例被保留。
      这会在样本中产生方向性偏误：衰减越快的事件越可能被归为"单一"并保留。

      缓解因素：衰减快慢与时间比高低的关系并非单调——衰减快 + 恢复更快的案例
      （低时间比，不利命题）同样会被保留，衰减快 + 恢复慢的案例（高时间比，有利命题）
      也会被保留。偏误方向不是单纯"有利/不利命题"，而是"压缩了衰减时间的方差"——
      慢衰减案例被低估。这在统计上可能使时间比中位数的估计偏倚（方向不确定）。
    severity: should
    mitigation: |
      可在 falsifiability 段追加一句诚实声明：criterion (ii) 部分依赖信任轨迹进行
      事件分类，可能引入次级测量轴依赖；作为缓解，建议在实证检验时同时报告"含复合
      事件的全样本"时间比分布作为敏感性分析（即使归因噪音大，方向性分布仍有信息量）。

  iea_independence_check:
    anchor_relevance_mismatch:
      severity: required
      detail: |
        本轮审查的核心发现：IEA 的测量对象与命题的声称对象之间存在范畴错层
        （category mismatch）。

        IEA 三票测量的是"信任不对称"——信任违背/修复在损失厌恶和信息不对称驱动下
        呈不对称动力学。这是一个一般性命题，涵盖人际信任、组织信任、制度信任等子类。

        但 BR-L2-031 的 term 是"制度信任的不对称衰减"，statement 首句明确"制度信任
        （对非人格化制度/机构的信任，区别于人际信任）"——命题声称的是特殊命题。

        逐票审查对制度信任的直证贡献：

        (1) behavioral_economics（锚源，weight 1.0）：
        证据：Kahneman-Tversky 损失厌恶 + Slovic 信任不对称原则 + King-Casas/
        Baumgartner fMRI 信任博弈。全部测量【人际信任】（两个具体个人之间的信任
        互动）。对制度信任提供的是机制类比——"若制度信任的心理编码与人际信任同构，
        则不对称应成立"——这是 plausible 但未被锚源直证的推广。
        对制度信任的直证贡献：0（类比，非直证）

        (2) economic_history（weight 0.6）：
        证据：Gallup/Edelman 银行-政府信任时间序列 + 阿根廷货币制度信任自然实验 +
        中国朝令夕改轶事。直接测量【制度信任】（对银行/监管机构/货币制度的信任）。
        对制度信任的直证贡献：0.6（全额）

        (3) organizational_psychology（weight 0.4）：
        证据：Rousseau 心理契约违背 + Kim et al. 诚信型违背修复。测量员工-组织信任
        （雇佣关系中对组织的信任）。组织是"人+规则"的综合体——员工对组织的信任既包含
        对具体管理者的人际信任成分，也包含对制度程序（晋升/薪酬/公平规则）的信任成分。
        属人际与制度的混合地带，不完全等同于"对非人格化制度的信任"。
        对制度信任的直证贡献：≤0.4（部分贡献，因混合性质）

        制度信任直证 IEA 汇总：
        - 乐观估值（org_psych 全额计为制度信任）：0.6 + 0.4 = 1.0
        - 保守估值（org_psych 折半）：0.6 + 0.2 = 0.8
        - 严格估值（仅 purely institutional）：0.6

        三种估值均低于 verified 门槛 1.8，乐观估值 1.0 低于最低门槛 1.2。

        这不是 IEA 计算规则的问题——按 independence-model，三源 agree 且独立性系数
        合规，IEA=2.0 的计算正确。问题是：计算的 IEA 回答的是"信任不对称是否成立"，
        而命题问的是"制度信任不对称是否成立"。IEA 数字为前者提供了 2.0 的强支撑，
        但为后者提供的直证当量仅 0.6-1.0。

        r1 的 required_fix #3（诚实声明推广链不确定性）+ 本命题已有的推广链诚实声明 +
        falsifiability (c) 已充分披露了人际→制度的推广 gap。但披露不改变证据结构——
        不能靠诚实声明把 0.6-1.0 的直证当量升格为 1.8+。verified 的 IEA 门槛是
        证据门槛，非披露门槛。

        此缺陷可靠定向修复救活（非结构塌陷），故判 needs_revision 而非 rejected。

    behavioral_economics_anchor_r2:
      weight: 1.0
      role: 锚源
      detail: |
        r1 审查 + IEA 复核确认锚源地位正当。证据链（Kahneman-Tversky → Slovic →
        King-Casas → Baumgartner）厚实，三十余年跨方法复现。引用经 IEA 复核收窄后
        核心证据力不变。Rilling 引用错位和 Rousseau 语料归属已修正。

        r2 增量审查：锚源对"信任不对称"一般命题的证据力无争议（weight 1.0 正当）。
        但锚源对"制度信任不对称"特殊命题的证据力仅限于机制类比——这是跨范畴推广，
        非同一范畴内的证据贡献。详见 anchor_relevance_mismatch。

    economic_history_r2:
      reported_weight: 0.6
      detail: |
        本通道是【唯一直接测量制度信任】的通道，在三票中承载不成比例的重要性。
        r1/IEA 复核确认证据方向成立、方法独立（大规模调查/历史档案 vs 实验室/神经
        科学）。Gallup 数字偏差（53%→41%）不影响方向结论。

        r2 增量审查：0.6 的 default_independence 用于 behavioral_economics↔
        economic_history 是合理的（两学科不共享方法、语料、研究者社群）。但 0.6 是
        independence coefficient，不是证据强度折扣——即使本通道对制度信任的测量完美
        无缺，其 IEA 贡献上限就是 0.6。单通道 0.6 远不足以支撑 verified（需 ≥1.8）。

    organizational_psychology_r2:
      reported_weight: 0.4
      detail: |
        IEA 复核已下调至 0.4（语料重叠 + 范式共享双重折扣），下调幅度可辩护。

        r2 增量审查：即使 0.4 全额计为制度信任直证（乐观估值），配合 economic_history
        的 0.6 合计仅 1.0——仍低于 1.2 最低门槛。且组织信任 ≠ 制度信任（组织是
        人+规则的混合体，员工对"组织"的信任包含人际成分），0.4 全额计为制度信任已是
        慷慨估值。详见 anchor_relevance_mismatch。

    instrument_correlation_discount_r2:
      disclosed: true
      disclosure_quality: honest
      detail: |
        cross_verification.verdict_note 诚实披露了单 LLM 执行的仪器折扣，引用 ICV-001
        判例说明共享语料风险。达到 independence-model discount_rule 要求。

        r2 增量审查：仪器折扣披露是充分的。但有一个微妙点——IEA investigator 的
        verdict_note 写道"损失厌恶×信任不对称属多重复现的稳固共识命题...真实文献
        收敛部分缓解单仪器忧虑"。这句话本身准确，但"稳固共识"指的是【人际信任不对称】
        （三十余年跨方法复现），而非【制度信任不对称】（经济史一条通道 + 组织心理学
        一条混合通道）。仪器折扣的"缓解"效果在制度信任层面弱于人际信任层面——
        因为制度信任的跨通道收敛程度远低于人际信任。这是一个披露精确度问题，
        不构成独立 required，但配合范畴错层放大了 IEA 的脆弱性。

    iea_verdict_r2:
      reported: 2.0
      formal_compliance: 合规（按 independence-model 规则计算）
      effective_for_institutional_claim: 0.6-1.0（取决于 org_psych 的计权方式）
      gap: |
        合规 IEA (2.0) 与有效制度直证 IEA (0.6-1.0) 之间的差距是本轮审查的核心发现。
        这不是 IEA 虚高/计算错误——而是 IEA 的测量目标（信任不对称）与命题声称目标
        （制度信任不对称）之间的范畴错层。2.0 正确地测量了前者，但被错误地对准了后者。
      conclusion: |
        IEA 形式合规，但范畴错层使 verified 的 IEA 门槛（≥1.8）在实质上未达到——
        因为达到门槛的 IEA 测量的是不同于命题声称的对象。这是 required 级缺陷，
        需通过追加制度信任直证来源或调整命题状态/范畴来解决。

  counterexample_hunt:
    method: |
      r2 独立反例猎捕（与 r1 猎捕者无关，全新上下文）。命题收窄为纯时间不对称后，
      猎捕目标更清晰：寻找制度失信后恢复时间不长于衰减时间（时间比 ≤1:1）的干净案例。
      同时也猎捕"(a) 衰减本身不快（数年而非数周/数月触底）"的案例——虽不直接证伪
      时间比，但挑战"掉得快"这半条主张。搜索范围：跨文化/跨制度领域/跨历史时期。
    cases:
      - case: 时间比≤1:1——恢复不快于衰减的净杀条件
        search_domain: |
          搜索单一可辨识制度失信事件后，制度信任快速恢复（恢复时间≤衰减时间）的案例。
          需满足：可辨识的单一失信事件 + 独立信任测量时间序列 + 可分离的衰减/恢复期。
        candidates_examined:
          - |
            新西兰 1984-1990 经济改革（Lange-Douglas 改革）：
            制度失信维度——政府违背社会福利承诺、大幅削减公共支出。
            衰减期约 2-3 年（1984-1987，信任从高点降至低谷）。
            恢复期约 5-7 年（1987-1994，经济改善后信任逐步恢复）。
            时间比约 1.7-3.5:1——支持命题（≥2:1 区间）。
            注：改革涉及多事件，按 compound_event_criteria 可能被排除。
          - |
            冰岛 2008 银行危机后制度信任恢复：
            衰减期——2008 年 10 月三大银行倒闭，信任在数月内崩盘。
            恢复路径独特——冰岛让银行破产、起诉银行家、重修宪法，
            信任在约 5-7 年内显著恢复（2010-2015）。
            衰减期约 0.5 年，恢复期约 5-7 年，时间比约 10-14:1——强支持命题。
            注：冰岛的特殊响应（起诉+修宪）恰说明严重失信后重建需非常手段+漫长时间。
          - |
            爱沙尼亚 1992 货币改革（克朗→欧元路径）：
            苏联卢布区崩溃后，爱沙尼亚 1992 年引入货币局制度（克朗钉住德国马克）。
            这不是“失信后恢复”而是“从零建立制度信任”——不属于命题的 scope
            （命题测的是已有信任被摧毁后重建，非从零建立）。
            但提供了一条有趣的边界：从零建立制度信任用了约 10 年（1992-2002），
            若与某些制度失信案例的衰减时间（数月）比，从零建立比修复失信更快——
            但这已超出命题 scope。
          - |
            加拿大 1995 年魁北克公投后联邦信任：
            1995 年魁北克独立公投（50.58% 反对——制度信任的极限压力测试）。
            公投后联邦政府推动改革（清晰法案 + 财政转移支付调整），
            联邦制度信任在约 3-5 年内恢复至公投前水平。
            衰减期约 1-2 年（公投前争议期+公投后震荡），恢复期约 3-5 年。
            时间比约 1.5-5:1——跨越削弱区与支持区，中位估计约 2-3:1。
          - |
            日本 2011 福岛核灾后核电监管信任：
            核灾使日本核电安全监管信任在数月内崩塌。
            2012 年设立原子力规制委员会（NRA），新规制标准 2013 年实施。
            公众对核电监管的信任恢复极为缓慢——至今（2026）仍远低于灾前水平。
            衰减期约 0.5 年，恢复期 >15 年且仍在进行。时间比 >30:1——极端支持案例。
        conclusion: |
          未找到时间比 ≤1:1 的干净净杀案例。搜索的 5 个案例覆盖不同制度领域（经济改革/
          金融监管/货币制度/联邦政治/核电安全）和不同地理区域（大洋洲/欧洲/北美/东亚），
          时间比从 1.7:1 到 >30:1，均在不削弱命题的方向。

          但需注意：被搜索的案例多为"著名失信事件"——这些案例之所以著名，恰可能因为
          恢复时间长/影响深远。可能存在"恢复快所以不被记住"的幸存者偏差。缓解：
          (i) 也搜索了"快速恢复"型案例（如加拿大公投后恢复），未发现 ≤1:1；
          (ii) 学术文献的系统综述（如信任修复 meta-analysis）未见报告制度信任快速恢复
          的可靠案例。

          r2 反例猎捕结论：时间不对称方向在现有案例中稳健，未发现净杀。

      - case: 衰减本身不快——"掉得快"这半条被挑战
        counter_mechanism: |
          命题声称制度信任"摧毁快"（人话摘要"几周内打到谷底"）。但部分案例中，
          制度信任的衰减是缓慢的（数年触底），而非"几周"。
        evidence:
          - "美国银行信任 2007→2012：Gallup 信任度从 ~41%（2007）降到 ~21%（2012），
            触底用了约 5 年——远非'几周'。IEA 复核确认数字方向正确。"
          - "日本制度信任在'失去的三十年'中的缓慢侵蚀：对政府/官僚机构的信任从 1990s
            初缓慢下降，非单次失信事件触发，而是长期经济停滞+多次小丑闻的累积效应。"
          - "天主教会性侵丑闻：2002 年波士顿环球报调查引爆，但后续数十年持续有新案例
            曝光，信任持续缓慢下降而非一次性触底。"
        evaluation: |
          这些案例中，缓慢衰减的原因恰是 compound_event_criteria 试图排除的——多事件
          叠加/持续曝光/系统性长期侵蚀。命题的 falsifiability (a) 明确限定"单次可辨识
          的制度丑闻/违约/监管失败"——在此限定下，"掉得快"是可辩护的（单次事件确实
          触发快速信任下调）。但人话摘要的"几周内打到谷底"过于绝对化——即使是单次
          事件，从事件曝光→公众充分知晓→信任触底通常需要数月（如 VW Dieselgate
          2015 年 9 月曝光，信任触底约在 2015 年底至 2016 年初，约 3-4 个月）。
        verdict: 被消化（慢衰减案例多属 compound events，被排除出 scope）
        caveat: |
          人话摘要"几周内把信任打到谷底"与 empirical evidence 存在张力——IEA 调查员
          确认 Gallup 银行信任用了约 5 年（2007→2012）触底，非"几周"。即使将此归为
          复合事件排除，"单次事件触底时间"的典型量级（数月而非数周）也应在 statement
          或 core_mechanism 中准确表述。"几周"属于修辞过度，列为 should_fix。

      - case: 从零建立制度信任可以很快——挑战"重建慢"的参照系
        counter_mechanism: |
          若"从零建立"制度信任只需 ~10 年而"失信后重建"也需 ~10 年，则"重建慢"
          可能不是不对称的证据——而是制度信任的建立本身就需要这么长时间，
          无论从零还是从失信。
        evidence:
          - "爱沙尼亚 1992-2002：从零建立货币局/电子政务的制度信任，约 10 年。"
          - "博茨瓦纳 1966-1976：从独立起建立相对清廉高效的官僚制度信任，约 10 年。"
          - "西德 1949-1960：战后从零建立民主制度信任，约 10-15 年。"
        comparison: |
          失信后重建信任的案例中，恢复至失信前水平也常需 10 年级别：
          - 美国银行信任：2007→2012 触底，至 2026 仍未完全回到 2007 水平（已 14 年）
          - 阿根廷比索信任：2001 违约后至今 25 年仍美元化
          - 福岛核电监管信任：2011 至今 15 年未恢复

          这些案例中"重建慢"的真实含义可能是"从零建立信任本身就慢（~10 年级别）"+
          "失信会重置信任至接近零的水平"——组合效果看起来是不对称，但单独的
          "重建速度"与"从零建立速度"可能在同数量级。
        evaluation: |
          此观察不直接挑战时间比 ≥2:1 的主张（因为衰减时间通常远短于 10 年，所以比值
          仍高），但挑战了机制解释——重建慢可能是信任建立的 baseline slowness 而非
          损失厌恶驱动的特殊不对称。换言之，命题声称的"不对称"至少有一部分可归因于
          "信任建立本身的慢"而非"失信造成的额外慢"。
        verdict: 被消化（不改变时间比预测，但揭示机制归属过度伸张）
        digestion: |
          砖的 core_mechanism 未区分"信任建立的 baseline 慢"与"失信后重建的额外慢"。
          falsifiability (b)（控制显著性后测神经不对称）理论上可以分离二者——若
          正向意外（意外守信）的神经反应仍弱于负向意外（意外失信），则为损失厌恶的
          独立贡献。此消化不构成 required fix，但建议在 core_mechanism 末尾加一句
          "注：重建慢中包含信任建立的 baseline slowness + 损失厌恶驱动的额外不对称，
          二者的比例是待分离的经验问题"。

    net_kill: none
    exposed_overreach: |
      两条过度伸张被揭示：
      (1) IEA 范畴错层——IEA=2.0 被对准了不同于其测量目标的命题。这是 required 级。
      (2) 两条机制的独立性可能被高估——信息不对称可能是损失厌恶在信息处理层面的
      表现。这是 should 级。

      另有一条修辞过度：人话摘要"几周内打到谷底"与实际证据（单次事件触底通常需数月）
      之间存在张力。这是 should 级（不影响命题骨架但影响精确性）。

    conclusion: |
      r2 反例猎捕在三个方向搜索：(i) 时间比 ≤1:1 净杀——未发现；
      (ii) "掉得快"本身不成立——慢衰减案例多属 compound events，被 scope 消化，
      但人话摘要的"几周"表述需校准；(iii) 从零建立与失信后重建可能同数量级——
      不影响时间比预测但揭示机制归属的过度伸张。

      无净杀反例。核心不对称直觉在现有案例中稳健。命题骨架（时间不对称 ≥2:1）
      未被反例击穿。

  required_fixes:
    - |
      【IEA 范畴错层——REQUIRED】
      IEA=2.0 测量的是"信任不对称"一般命题（含人际/组织/制度信任），而 BR-L2-031
      的 term 和 statement 明确声称的是"制度信任的不对称衰减"特殊命题。对制度信任
      的直证独立当量仅 0.6-1.0（economic_history 0.6 + organizational_psychology
      ≤0.4），远低于 verified 门槛 1.8，乐观估值 1.0 甚至低于最低门槛 1.2。

      这不是 IEA 计算错误——按 independence-model 规则 IEA=2.0 合规。问题是：
      合规 IEA 的测量目标与命题声称目标之间存在范畴错层。Verified 的 IEA 门槛
      （≥1.8）存在理由是为命题提供足够的多源独立证据支撑——制度信任直证仅
      ~0.6-1.0 不满足此要求，诚实披露不能替代证据实质。

      修复选项（三选一，推荐 B）：

      (A) 追加至少一个直接测量【制度信任】（非人际/组织信任）不对称的独立来源。
      候选：政治学文献中关于"政府信任在丑闻后的恢复周期"的跨国比较研究
      （如 Keele 2007, American Journal of Political Science；Bowler & Karp 2004,
      Journal of Politics），或世界价值观调查（WVS）机构信任面板数据的自然灾害实验。
      若新增来源的 independence ≥0.5 且经 IEA 复核同意，制度信任直证 IEA 可达
      0.6+0.4+0.5=1.5——仍低于 1.8 但更接近。需至少两个新增独立通道才能达标。

      (B)【推荐】接受 weakly_verified 状态。在 cross_verification 中诚实声明：
      IEA=2.0 的主体支撑来自人际信任不对称证据（三十余年跨方法复现），制度信任的
      直证独立当量仅约 0.6-1.0（economic_history + organizational_psychology 部分），
      本命题在"制度信任"维度上是理论驱动假说（strongly motivated hypothesis）
      而非多源确证命题（multi-source confirmed proposition）。Weakly_verified 可随
      未来制度信任直证的积累升级为 verified（falsifiability (c) 提供了升级路径）。

      (C) 将命题收窄为"信任不对称"（去掉"制度"限定词），使 IEA 测量对象与命题
      声称对象对齐。但这将失去本命题在体系中的独特贡献——与 BR-L2-010（制度替代
      能力）的互补接口、"制度信任易碎性"这一对 DED-006 的机制补充、以及
      relation_to_system 中与 BR-L2-024 的斜率不对称对话。丧失体系价值。

      推荐 (B) 的理由：命题的核心直觉稳固、机制清晰、反例猎捕无净杀、r1 三条修复
      已提升严谨性——这是一条好命题，其经验贡献不因状态标签而改变。Weakly_verified
      是诚实反映当前制度信任直证的薄弱现状，同时保留命题在体系中的位置和升级路径。
      这比为了 verified 而修修补补（如强行追加勉强够格的来源）更符合体系的诚实性
      原则。

  should_fixes:
    - |
      【次级测量轴焊点披露——SHOULD】
      compound_event_criteria 的 criterion (ii) 使用信任轨迹（DV——两事件间信任
      是否恢复）辅助事件分类（IV 处理）。虽目的正当（多事件叠加无法归因），但 DV
      进入 IV 分类逻辑构成次级测量轴依赖。建议在 falsifiability 段追加一句诚实声明，
      并建议在实证检验时同时报告"含复合事件的全样本"时间比分布作为敏感性分析。
    - |
      【人话摘要"几周"表述校准——SHOULD】
      人话摘要"几周内把信任打到谷底"与现有证据存在张力：即使是单次制度失信事件，
      从曝光→公众充分知晓→信任触底通常需数月（如 VW Dieselgate ~3-4 个月），
      而非"几周"。美国银行信任的衰减更是用了约 5 年（虽可归为复合事件）。
      建议将"几周"改为"数月"，使表述更贴合实际证据的量级。
    - |
      【机制独立性声明收窄——SHOULD】
      core_mechanism 声称链(1)损失厌恶与链(2)信息不对称"各自独立可测"。但信息
      不对称（人对坏消息更关注/传播）可能是损失厌恶在信息处理层面的表现，而非
      独立机制。falsifiability (b) 的实验设计试图分离二者，实操中"显著性操纵"与
      "损失/收益 framing"难以彻底解耦。建议将"各自独立可测"改为"在分析上可区分、
      可分别检验（虽二者在心理层面可能存在共同根因）"。
    - |
      【重建慢的 baseline 成分声明——SHOULD】
      反例猎捕揭示：失信后重建慢可能部分源于"信任建立本身的 baseline slowness"
      （从零建立制度信任也需约 10 年级别）而非失信造成的额外不对称。建议在
      core_mechanism 或"不声称"段追加一句注："重建时间中包含信任建立的 baseline
      slowness 与损失厌恶/信息不对称驱动的额外不对称，二者的比例是待分离的经验问题。"

