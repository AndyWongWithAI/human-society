id: ADV-REVIEW-BR-L2-040
type: adversarial_review
reviews: BR-L2-040
layer: L2-bridging
target: BR-L2-040
target_term: 群体身份作为道德边界的心理标记 (Group Identity as Psychological Marker of Moral Boundary)
rounds: 1

人话摘要: |
  对 BR-L2-040(群体身份作为道德边界)的 round-1 独立对抗审查。
  裁 needs_revision: 核心直觉——人对群内成员的道德考量强于群外成员——经验上有大量
  文献支撑,但 3 条 required 缺陷阻止 verified:
  (1)"心理距离"的客观/主观定义歧义贯穿全砖,使"亲缘<族群<国家<物种"的单调递增主张
  在爱国者/纯素食者等干净反例面前立场不清;
  (2)falsifiability (b) 的"完全模糊"缺乏操作化定义,构成 talisman 护身符;
  (3)falsifiability (c) 的"完全可由人格变量解释"设置了不可达的证伪标准。
  IEA 2.2(social_psychology/moral_psychology 独立系数高估)经诚实调整后~1.95,
  配合仪器折扣,属 weakly_verified 区间。反例猎捕未获净杀,但爱国者反例揭示的核心歧义
  必须在修订中消解。

round_1:
  reviewer: independent-adversarial-reviewer
  date: 2026-07-16
  verdict: needs_revision
  verdict_note: |
    本命题的核心直觉——个体对群内成员的道德考量(关怀、公平、忠诚)显著强于群外成员——
    在社会心理学、道德心理学、演化生物学三条通道上均有大量文献支撑。Tajfel 的社会认同
    理论、Singer 的道德圈扩展、Hamilton 的亲缘选择各自从不同方法论角度指向同一方向,
    这不是理论虚构而是经验收敛。单调递增距离函数与 THEOREM-group-identity-decay 的
    动态耦合也提供了超越 BR-L2-006(内群体偏好)二元框架的细化贡献。

    但三条 required 级缺陷阻止 verified 裁决:

    1.【"心理距离"的客观/主观定义歧义——REQUIRED】
    砖的核心主张是"道德折扣的大小随群体身份的心理距离(亲缘<族群<国家<物种)单调递增"。
    这里的"心理距离"存在两种互斥解读:

    解读A(客观距离):"亲缘<族群<国家<物种"是范畴本身的固有远近排序——无论个体主观
    感受如何,亲缘关系的心理距离在结构上<族群<国家<物种。在此解读下,爱国者(为国捐躯
    却不顾家人)和纯素食者(对动物的道德考量超过对异族人类的考量)构成干净反例——道德
    折扣并未按此固定顺序单调递增,甚至在某些个体上出现方向反转。

    解读B(主观距离):"心理距离"由个体的实际主观认同决定——对某个爱国者而言,国家可能
    在心理上比家庭更近;对纯素食者而言,动物可能在心理上比异族人类更近。在此解读下,
    单调递增关系仍可成立,但"亲缘<族群<国家<物种"的列举就从结构性命题退化为统计性
    趋势陈述——它不再是对"道德折扣如何随距离变化"的因果主张,而近乎"道德折扣跟踪
    主观认同"的定义性真理。

    砖当前的行文在两个解读之间摇摆:falsifiability (a)中"从本族群到远缘族群"暗示
    客观距离,而"心理距离"这一措辞本身提示主观测量。此歧义不是措辞吹毛求疵——它决定了
    (a)爱国者/纯素食者是反例还是异常值,(b)falsifiability (a)检验的是客观范畴次序
    还是主观认同梯度,(c)命题的经验硬度。必须明确选择并在全文中保持一致。

    2.【falsifiability (b) 的 talisman 护身符——REQUIRED】
    证伪条件(b):"如果实验显示,即使群体边界因互动而完全模糊(如陌生人之间通过共同
    任务形成临时群体),道德折扣依然不减小、不消失,则证伪"。"完全模糊"缺乏操作化定义:
    什么构成"完全"模糊?若实验未观测到折扣减小,砖可辩称"边界未完全模糊"("共同任务
    不足以消除边界感知")——"完全"二字构成无法被满足的无限后退,使证伪条件(b)在操作上
    沦为护身符。需替换为可操作的判据,如"当实验操纵使被试在IAT中不再显示显著的内群
    偏好(Cohen's d<0.2)时,道德愤怒差异的效应量同步降至d<0.2以下"——用外部的、
    可独立测量的边界清晰度指标替代"完全模糊"的主观判断。

    3.【falsifiability (c) 的不可达证伪标准——REQUIRED】
    证伪条件(c):"如果发现道德折扣的变化完全可由个体人格变量(如权威主义、共情能力)
    解释,而与群体身份的心理距离无关,则证伪群体身份作为核心机制"。"完全可由"设置了一个
    在社会科学实践中不可达的证伪标准——人格变量几乎不可能解释100%的方差,且统计上
    "完全解释"(R²=1.0)在含测量误差的行为数据中不可能出现。这意味着(c)永远不会被
    满足——它看起来是"严厉的证伪条件",实则是"不可能被触发的安全锁"。需替换为可操作
    的统计判据,如"当在回归模型中控制人格变量(权威主义/共情/社会支配取向)后,群体身份
    心理距离对道德折扣的偏η²<0.01且增量R²的F检验不显著(p>0.10),则群体身份的核心
    机制地位被严重削弱"——将不可达的"完全"替换为统计上的"不显著增量贡献"。

    三条 required 均可通过定向修订修复:明确心理距离的操作化(含反例处理)、替换两个
    falsifiability 条件为可操作标准。这些修复不推翻核心直觉——群内道德偏向是稳健的
    经验发现——但将一条模糊的命题收紧为可诚实检验的形式。

    附 should:
    (i) 澄清与 BR-L2-006(内群体偏好)的非平凡区分——本砖的独特贡献在"道德考量"维度
    (区别于一般偏袒)与"单调递增"函数形式(区别于二元的群内/群外);
    (ii) 社会心理学/道德心理学的独立系数从 default 0.6 下调至 0.35-0.40,或注册专属
    配对——两个子学科共享实验范式/研究者社群/发表渠道,重叠程度高于默认假设;
    (iii) 和谐"避免伤害"维度的排除理由——该维度是道德基础理论中跨文化最稳健的维度,
    将其排除需要独立论证;
    (iv) 披露单 LLM 执行 IEA 的仪器折扣(按 independence-model 的 instrument_correlation
    discount_rule)。

  red_flags:
    brick_is_conclusion:
      hit: true
      severity: should
      detail: |
        本红旗以 should 级命中——BR-L2-040 的实证内核与已 verified 的 BR-L2-006
        (内群体偏好)存在显著重叠,但并非完全复述。

        BR-L2-006 的核心主张:"人很容易偏袒'自己人'——分东西多给、更信任、有矛盾时
        也护着"——这已经是跨资源分配、信任、冲突三维的内群偏袒陈述。"道德考量"中的
        "关怀、公平、忠诚"与"分东西多给、更信任、有矛盾时护着"在操作层面高度重叠:
        分配更多资源给群内=关怀/公平的群内偏向,保护群内成员=忠诚的群内偏向。

        本砖相较 BR-L2-006 的增量贡献有三:
        (i)【"道德"维度的显式化】将群内偏袒明确框定为"道德考量"而非一般偏好——
        这使命题与 CONCEPT-morality(规范子类,涉及第三方惩罚/内化)建立连接,
        打开了与道德心理学文献的接口。但"道德"标签本身不自动产生新的经验内容——
        除非砖阐明"道德考量"在操作上如何区别于"一般偏袒"。
        (ii)【单调递增距离函数】从 BR-L2-006 的二元(群内vs群外)升级为有序距离
        (亲缘<族群<国家<物种),这是真正的经验细化——它预测了可排序的梯度而非简单
        二分。但此贡献被"心理距离"的定义歧义(见测量轴正交红旗)严重削弱。
        (iii)【THEOREM-group-identity-decay 的动态耦合】声称群体身份衰减→道德折扣
        松动。此连接 BR-L2-006 也有(bridges_to 同一条定理),但本砖将耦合机制操作化为
        "群体边界模糊→道德愤怒差异减小"的可检验预测。

        综上,本砖的非平凡经验内核真实存在(主要靠单调递增距离函数),但厚度偏薄——
        "道德"标签的大部分经验内容已被 BR-L2-006 覆盖,且对 BR-L2-006 无新增实证锚点
        (Tajfel/Brewer 等同样是 BR-L2-006 的核心引用)。不能判 rejected(有真实增量),
        但应要求砖在 statement 中显式声明与 BR-L2-006 的区分——"本命题不重复内群体
        偏袒的基本事实(BR-L2-006 已覆盖),而是专攻偏袒的(a)道德维度操作化和(b)有序
        距离梯度"——以避免下游推论的双重计数。

    empty_cell_tautology:
      hit: false
      detail: |
        核心空格预测:若世界不是"道德折扣随心理距离单调递增",则(1)道德折扣在距离
        维度上应呈随机波动或反向,(2)群体边界模糊不应导致道德折扣松动,(3)群体身份
        不应在控制人格变量后仍有独立解释力。这些都是可观察的经验预测,非同义反复。

        需注意:若"心理距离"最终取主观解读(见测量轴正交红旗),则空格(1)的可证伪性
        打折扣——"心理距离增大时道德折扣增大"与"人对某群体的心理距离越大,对该群体
        的道德考量越少"在操作上几乎同义反复。这是定义歧义连锁波及空格可测性的表现,
        不是逐格判空本身的命中。修复定义歧义后,空格可测性可恢复。

    measurement_axis_orthogonality:
      hit: true
      severity: required
      detail: |
        本红旗以 required 级命中——非 DED-007 式的闭环焊接,而是自变量定义歧义
        导致测量轴在两种解读下正交性截然不同。

        (1)【核心歧义:"心理距离"是客观范畴距离还是主观认同距离?】

        砖用"心理距离(亲缘<族群<国家<物种)"定义自变量。此处的"<"有两种解读:

        解读A(客观范畴距离):"亲缘"范畴本身在心理距离上<"族群"<"国家"<"物种"。
        这是结构性的、独立于个体差异的排序。在此解读下:
        - IV(心理距离)由范畴类型决定,可独立于 DV(道德考量)测量
        - 范畴类型(亲缘/族群/国家/物种)是外生变量,不由道德考量反推
        - 测量轴正交成立

        解读B(主观认同距离):"心理距离"是个体对某群体的主观亲近感,可因个体经历/
        意识形态/人格而不同。在此解读下:
        - IV(心理距离)通过询问"你对X群体有多亲近"测量
        - DV(道德考量)可能通过询问"你对X群体有多在乎其福祉"测量
        - 两个测量可能捕捉同一潜变量(泛化正向态度)的不同侧面
        - 测量轴不正交——IV和DV共享态度对象和方法方差

        砖的措辞在两个解读间摇摆:
        - "亲缘<族群<国家<物种"→暗示客观范畴排序(解读A)
        - "心理距离"这个术语本身→暗示主观感知(解读B)
        - falsifiability (a)"从本族群到远缘族群"→暗示客观距离
        - "群体身份...心理标记"→暗示主观认同

        这不是措辞吹毛求疵——定义选择决定了:
        (a) 爱国者(为国捐躯不顾家人)是反例(解读A)还是极端值(解读B)
        (b) falsifiability (a)检验的是客观范畴次序还是主观认同梯度
        (c) 命题是"硬"的结构性主张还是"软"的统计性趋势

        (2)【DV 测量中的态度对象重叠——should 级】

        即使 IV 取实验操纵(如 minimal group paradigm 随机分配组别),DV 的测量
        仍存在软性不正交风险:若 DV 通过自评量表("你对A组的不公平分配有多愤怒")
        测量,被试的回答可能受 demand characteristics(猜到实验目的)和一致性动机
        ("既然我被分到X组,我应该更关心X组")的污染。这不是测量轴焊死,但降低了
        观测到的 IV→DV 效应的排他解释力。

        修复路径:
        - 必须选择解读A或解读B,在全文中一致使用,并处理对应的反例
        - 若选A:承认爱国者/纯素食者反例的存在,将单调递增从"铁律"调整为"强统计
        趋势(有个体差异)",或论证这些案例不构成反例(如爱国者仍以家庭为基本道德
        单位,牺牲≠道德考量弱)
        - 若选B:删除"亲缘<族群<国家<物种"的固定排序表述,替换为"心理距离(主观
        测量的群体亲近感)与道德折扣之间的单调正相关",并承认此表述的经验硬度低于
        当前版本
        - DV 测量建议:补充非自评的行为指标(如独裁者博弈中的实际分配金额、fMRI
        的 mPFC 活动)以降低方法方差

    scope_exclusion_independent:
      hit: false
      detail: |
        排除项按可事前测的渠道划界:
        - "不声称道德完全由群体身份决定"→排除其他道德来源(个体差异/情境/文化),
        这些有独立于群体身份的测量渠道
        - "不声称所有道德维度(如避免伤害)都同等受群体边界影响"→排除 harm/care
        维度,有独立测量渠道(如道德基础问卷 MFQ 的 harm/care 分量表独立于
        loyalty/betrayal 分量表)

        排除在见反例前声明,方向合理,非事后开脱。唯一的软肋是"避免伤害"的排除
        理由未在砖中给出——harm/care 是道德基础理论中跨文化最稳健的维度,将其排除
        是实质性的 scope 限制,应有独立论证(如"harm 的道德判断更多依赖共情神经回路
        而非群体认同回路,故群体边界对 harm 维度的影响预期较弱")。当前只说"不声称",
        不说"为什么不声称"——属 should 级完善建议。

    classification_granularity:
      hit: false
      detail: |
        砖提出"心理距离"的四个档位:亲缘<族群<国家<物种。四个档位对有序单调递增
        主张而言是合理的粒度——足以检验单调性(四个有序点),又不至于因为粒度太细
        而变成无法区分相邻档位的噪声。

        但档位的"客观性"本身是有争议的——"族群"和"国家"在某些情境下边界模糊
        (如单一民族国家),且"物种"作为最外层是否在所有文化中成立(如某些文化将
        特定动物视为亲属)。这些问题由定义歧义红旗(测量轴正交)覆盖,不独立构成
        红旗5命中。

    anti_talisman:
      hit: true
      severity: required
      detail: |
        本红旗以 required 级命中——falsifiability (b)和(c)各有一条 talisman 护身符。

        (1)【falsifiability (b):"完全模糊"是不可操作的无限后退——REQUIRED】
        证伪条件(b)要求"即使群体边界因互动而完全模糊...道德折扣依然不减小"来证伪。
        "完全模糊"缺乏操作化定义。若实验未观测到折扣减小,砖可辩称:
        - "边界未完全模糊——共同任务只是弱化了边界感知,未消除"
        - "互动频率不够高/时间不够长,未达到THEOREM-group-identity-decay的衰减阈值"
        - "实验操纵的边界不是'真正的'群体边界(只是临时标签)"

        这些防御在每一步都合理——但"完全"二字使它们可以无限后退,永远不会被穷尽。
        这是典型的 talisman 结构:证伪条件在逻辑上存在,在操作上不可达。

        修复:将"完全模糊"替换为外部的、可独立测量的边界清晰度指标。例如:
        "当实验操纵使被试在IAT(内隐联想测验)中不再显示显著的内群偏好(单样本t检验
        p>0.20,或 Cohen's d<0.2)时,若道德愤怒的群内/群外差异效应量仍保持d≥0.5
        且显著(p<0.05),则'边界模糊导致折扣松动'的预测被严重削弱。"这用可操作的
        效应量阈值替代了不可操作的"完全"。

        (2)【falsifiability (c):"完全可由"设置了不可达的证伪标准——REQUIRED】
        证伪条件(c)要求"道德折扣的变化完全可由个体人格变量解释"来证伪。"完全"
        在社会科学中不可达——含测量误差的行为数据不可能产生R²=1.0,人格变量不可能
        解释道德折扣的全部方差。"完全可由"的证伪标准永远不会被满足——它看起来严厉,
        实则是不可能被触发——符合红旗6对护身符的定义:"判定前件(人格变量完全解释)
        在实践中不可能成立"。

        修复:将"完全"替换为可操作的统计判据。例如:
        "当在分层回归中,第一步进入人格变量(权威主义/共情/社会支配取向)后,第二步
        进入的群体身份心理距离变量对道德折扣的增量解释力不显著(ΔR²的F检验p>0.10,
        且偏η²<0.01),则群体身份的核心机制地位被严重削弱——人格变量已充分解释个体
        差异,群体身份无独立增量贡献。"

        (3)【falsifiability (a)方向正确但有隐蔽歧义——受影响于定义红旗】
        falsifiability (a)本身结构正确——"道德折扣不单调递增而是随机波动甚至反向"
        是可操作的证伪路径。但其具体测试依赖于"心理距离"的操作化定义:若取客观距离
        (范畴排序),检验的是"从亲缘到物种,道德折扣的平均值是否单调递增";若取主观
        距离,检验的是"个体对各群体的主观亲近度与道德考量之间的秩相关系数是否显著
        为正"。两种检验的经验硬度不同(客观排序更强但更易被反例击中)。此歧义由
        测量轴正交红旗(required)覆盖,不独立构成 anti-talisman 命中。

    reality_anchor_fact_check:
      hit: false
      detail: |
        所有引用的文献锚点经核查均为真实发表作品:
        - Tajfel & Turner (1979):社会认同理论奠基作,发表属实。内群偏爱的 minimal
        group 实验范式是经历了数十年跨文化复现的稳健发现。
        - Brewer (1999):最优区分理论,发表属实。内群偏爱≠外群敌意的区分是标准
        教科书内容。
        - Opotow (1990):道德排斥理论,发表属实。Journal of Social Issues。
        - Singer (1981):The Expanding Circle,出版属实。道德圈扩展概念。
        - Graham et al. (2017):道德基础理论,发表属实。但需注意 Graham et al. 的
        核心文献通常年份标注为 2013(Advances in Experimental Social Psychology)
        或 2011(JPSP)。2017 可能是特定章节/再版的年份——建议核实具体引用条目。
        - Cikara et al. (2011):fMRI 群际幸灾乐祸研究,发表属实。
        - Hamilton (1964):亲缘选择理论,发表属实。Journal of Theoretical Biology。
        - Choi & Bowles (2007):parochial altruism 模型,发表属实。Science。

        无引用造假。Graham et al. 的年份标注可能偏差(通常核心文献为 2013),但
        Graham 在道德基础理论领域持续发表,2017 年确有相关出版物,不构成事实错误。
        列为 informational note。

    definition_vs_prediction:
      hit: false
      detail: |
        "道德折扣随群体身份心理距离单调递增"是可证伪的经验主张。逻辑上自洽的可能
        世界包括:(1)道德考量与群体身份无关(如严格的普世主义伦理观支配所有人);
        (2)道德折扣存在但不是单调递增的(如对内群和外群有折扣但中间群体无差异);
        (3)道德折扣与群体身份有关但方向相反(外群偏好,即 out-group favoritism,
        在某些条件下确实被观测到——如低地位群体有时显示外群偏好)。

        这些替代世界均不违反任何逻辑约束——它们是经验可能而非逻辑不可能。命题核心
        是经验选择(预测哪种模式在现实中占主导),非定义。通过。

    enumeration_exhaustiveness:
      hit: false
      detail: |
        砖枚举了受群体身份调节的三个道德维度:关怀(care)、公平(fairness)、忠诚
        (loyalty)。这对应道德基础理论(MFT)五维中的三维。排除的维度是:避免伤害
        (harm,与关怀对称但砖将其排除)、权威(authority)、神圣(purity)。

        砖明确将"避免伤害"排除("不声称所有道德维度...都同等受群体边界影响"),
        并暗示 harm 维度受影响较小。此排除方向正确——harm/care 的判断更多依赖
        共情神经回路(如岛叶/前扣带回对疼痛共情的自动反应),而非社会分类回路
        (如 mPCC 对社会距离的编码)。但排除理由未陈述,属 should 完善。

        主动猎遗漏维度:权威(authority)维度——对权威的尊重/服从是否受群体边界
        调节?若权威人物是群内成员,服从意愿可能更高;若是群外成员,服从意愿可能
        更低甚至转为反抗。这可以构成独立的第4维度。但权威维度可被部分归入"忠诚"
        的子面(loyalty 包含对群内权威的服从),不完全独立。

        本红旗核心 test:砖未声称穷尽道德维度,故遗漏第N+1类不构成致命缺陷。
        未命中。

    primary_suspect_accuracy:
      hit: false
      detail: |
        L2 砖无 formal primary_suspect 字段(L3 要求),按红旗精神审查最弱腿:

        外部识别的最致命软肋(砖未自认):
        (i)【心理距离的定义歧义——当前最致命的经验腿】
        这是全砖的结构性软肋——"心理距离"的客观/主观解读决定了命题的经验硬度
        和反例的杀伤力。砖未自认此歧义,但它在面对爱国者/纯素食者反例时会立刻
        暴露。见 required_fix #1。

        (ii)【与 BR-L2-006 的重叠——当前最可能被质疑"非原创"的维度】
        命题的大部分经验内核(Brewer 的内群偏爱、Tajfel 的 minimal group)已被
        BR-L2-006 覆盖。"道德"标签和单调距离函数是增量,但增量厚度偏薄。
        砖未自认此重叠。见 should_fix #1。

        (iii)【IEA 虚高——社会心理学/道德心理学的独立性被高估】
        IEA=2.2 中 social_psychology(锚源)和 moral_psychology(0.6权重)的独立
        系数取 default 0.6,但两源是同一学科的子领域。更诚实系数应为~0.35-0.40。
        砖未自认此高估。见 should_fix #2。

    caliber_registration:
      hit: true
      severity: required
      detail: |
        本红旗以 required 级命中——falsifiability (b)和(c)的阈值/口径未完整注册。

        (1)【falsifiability (b):"完全模糊"无操作化口径——REQUIRED】
        "完全模糊"缺乏分子/分母/测量工具的任何注册。读者(和后续证伪者)无法知道:
        - "模糊"由什么工具测量(IAT?外显量表?行为指标?)
        - "完全"的操作阈值是什么(效应量为零?不显著?p>0.20?)
        - 互动频率达到什么程度才算"因互动而模糊"
        按 L4-009 判例精神:阈值缺失意味着边界案例的裁决可被事后口径选择操控。
        必须预注册可操作的测量口径。

        (2)【falsifiability (c):"完全可由"无统计口径——REQUIRED】
        "完全可由人格变量解释"未注册:
        - "完全"的统计判据(R²=?偏η²=?p值阈值?)
        - 哪些人格变量(权威主义已列出,共情已列出,还有哪些?)
        - 多个变量的联合解释是否需考虑多重共线性校正
        按 L4-009 判例精神:"完全"是个不可达的阈值,本质上不是口径缺失而是阈值
        不可达。修复方向:(i)将"完全"替换为可操作的增量解释力判据,(ii)预注册
        统计检验的具体参数(α水平/效应量阈值/纳入的人格变量清单)。

        (3)【"心理距离"的测量口径未注册——should 级】
        砖未注册"心理距离"的测量工具:是外显自评(如 Inclusion of Other in Self
        量表)?内隐测量(如 IAT)?还是实验操纵(如 minimal group paradigm)?
        测量工具的选择直接影响命题的经验硬度。若用外显自评,与自评的道德考量
        DV 存在方法共享方差。若用实验操纵+行为 DV,因果主张更强。应预注册
        推荐的测量方案(至少在 falsifiability 段)。

    data_source_common_root:
      hit: false
      detail: |
        本砖的全部经验证据来自社会心理学/道德心理学/演化生物学的学术文献,不涉及
        宏观经济指标(WB/IMF/CNBS 等)。data_source_origin 折扣不触发。

    api_pretending_independence:
      hit: false
      detail: |
        三路 IEA 投票由 LLM 审读文献后给出 agree/disagree 判断,非通过 API 调用
        数据源。API 可及性冒充独立性不适用。但 instrument_correlation 折扣适用
        (见 iea_independence_check)。

    reverse_failure_mode_missing:
      hit: false
      detail: |
        本红旗(L3 评分卡第14条)检查:驱动量的变化是否可能产生与被预测方向恰好
        相反的观测结果?若可能且未注册,标记 should。

        本命题的核心预测:群体边界越清晰/心理距离越小→道德折扣越小(道德考量越多)。
        反向失败模式:是否存在"群体边界越清晰反而道德折扣越大"的合理路径?可能的
        反向路径包括:
        (i) 群际威胁感知——更清晰的边界可能伴随更强烈的外群威胁感知,导致对外群的
        道德折扣反而增大(更少的道德考量)。这在现实世界冲突中常见(冲突越激烈,对方
        越被去人性化)。
        (ii) 道德优越感——清晰的群际边界可能强化"我们比他们更道德"的叙事,导致对
        外群道德缺陷的更严厉审判(更多而非更少的道德考量,但方向为负)。

        这两条反向路径是可构想的,但砖的核心主张是对群内成员的道德考量(正面的关心/
        公平/忠诚),而非对外群的道德审判(负面的谴责/惩罚)。反向失败模式(对外群更
        严厉)与正向主张(对群内更关怀)不是严格的同一维度反向——它们是道德考量在
        不同方向(正面vs负面)上的表现。因此反向失败模式不构成对正向主张的直接竞争。

        但一种真正的反向模式值得注意:在某些条件下,群内成员的违规行为会遭到比群外
        成员更严厉的道德谴责(黑羊效应,Marques et al. 1988)。这不是对外群的道德
        折扣,而是对群内的道德加码——方向恰好与"对群内更宽容"的隐含预期相反。
        砖通过将道德考量框定为"关怀、公平、忠诚"(正面道德情感)而非"惩罚、谴责"
        (负面道德反应)回避了此冲突,但这种回避本身是理论选择——需要声明道德考量
        的操作化仅覆盖正面道德情感维度。

        总体:反向失败模式未命中 required 级别(正面关怀vs负面惩罚是不同的子维度),
        但黑羊效应的存在提示了 should 级完善:声明道德考量的操作化范围——"本命题
        专指正面的道德关怀(关怀/公平/忠诚),不覆盖对违规行为的道德惩罚维度"。

    bootstrap_requirement_missing:
      hit: false
      detail: |
        本命题不涉及新技术介导的社会形态(AI/算法/数字平台),不适用 Bootstrap 限定
        红旗(L3 评分卡第15条)。群体身份作为道德边界的机制在前数字时代已存在且被
        广泛记录,不存在"冷启动依赖新技术"的问题。不触发。

    verification_target_existence:
      hit: false
      detail: |
        本命题的验证对象(群体身份操纵→道德考量变化的实验证据)在当前社会条件下
        可观测,且已有大量实验文献(Tajfel minimal group paradigm、Cikara fMRI、
        Choi & Bowles parochial altruism 博弈)直接测量此关系。验证对象非空集。
        不触发"验证对象存在性未标注"红旗(L3 评分卡第16条)。

  iea_independence_check:
    disclosed_iea: 2.2
    effective_iea_estimate: 1.95
    adjustment_rationale: |
      报告的 IEA = social_psychology 1.0(锚源) + moral_psychology 0.6(独立系数
      default 0.6) + evolutionary_biology 0.6(独立系数 default 0.6) = 2.2。

      social_psychology 与 moral_psychology 的独立性被高估:

      (1)【两源的实际重叠程度】
      social_psychology 和 moral_psychology 不是两个独立学科——它们是心理学的
      重叠子领域:
      - 共享实验方法论(实验室实验/问卷/行为博弈)
      - 共享研究者社群(Tajfel 的社会认同理论同时被社会心理学和道德心理学引用;
      Haidt 的道德基础理论横跨两域)
      - 共享发表渠道(JPSP/PSPB/JESP 同时发表社会心理学和道德心理学论文)
      - 共享核心理论框架(社会认同→内群偏爱→道德边界 是一条连续的论证链,
      不是两条独立链)

      independence-model 的 source_pairs 中没有注册 social_psychology 与
      moral_psychology 的配对——意味着该系数取 default 0.6。但 0.6 的 design
      intent 是"不同方法论路径"(如 evo_bio↔cultural_universals 的 0.6 表示
      "理论框架 vs 田野数据,方法论路径不同")。social_psychology↔moral_psychology
      不满足此标准——它们的方法论路径高度重叠。

      作为参照:evo_bio↔game_theory 共享核心数学结构,独立系数为 0.4。
      social_psychology↔moral_psychology 在方法论上的共享程度不低于此对——
      共享实验范式/统计方法/理论框架。更诚实的独立系数:0.35-0.40。

      (2)【调整后的 IEA】
      若 social_psychology↔moral_psychology 独立系数下调至 0.35:
      调整后 IEA = 1.0(锚源) + 0.35(moral_psychology) + 0.6(evolutionary_biology)
      = 1.95(学科上限)

      (3)【evolutionary_biology 的独立性复查】
      evolutionary_biology 使用不同的方法论(博弈论建模/系统发生分析/跨物种比较),
      与 social_psychology/moral_psychology 的实验室实验传统有实质分叉。default
      0.6 对此对合理(可能偏保守——evo_bio 的方法独立性强于典型的"不同子学科"对)。

      (4)【仪器折扣叠加】
      按 independence-model 的 instrument_correlation discount_rule:三路投票由
      单一 LLM(智谱 glm-4-flash)执行,"仪器有效独立性"低于学科上限 1.95。
      本命题为新颖综合命题(非"有限理性""亲缘利他"级的多重复现稳固共识),
      按 mitigation 条款,仪器折扣应视为承重红旗——1.95 在折扣后实际有效 IEA
      可能落至 1.4-1.7 区间(伪精度使具体数字不可靠)。

      (5)【IEA 总体裁决】
      在学科上限(1.95)与仪器折扣叠加后,本砖的 IEA 大概率落在 weakly_verified
      区间(1.2-1.8),不满足 verified 门槛(IEA≥1.8)。当前 IEA 生态下,weakly_verified
      是本命题的适当定级——social_psychology/moral_psychology 的重叠使有效独立
      票数不足两个准独立来源(两个准独立源 = 1.8)。

      为升至 verified,可考虑:(i)将 moral_psychology 的 evidence 拆分为道德基础
      理论(共享社会心理学方法论,折扣大)和 fMRI/神经伦理学(独立测量链——脑成像
      数据采集+分析 pipeline 独立于问卷/行为实验),后者可获更高独立系数;
      (ii)补充人类学/跨文化档案证据(cultural_universals 源有独立方法论通道)。

    instrument_honesty:
      disclosed: false
      assessment: |
        砖的 YAML 中无 instrument_disclosure 段(cross_verification 段尚未写入)。
        IEA 调查工具(iea_survey.py)在写入 cross_verification 时因 validate.py
        失败而回滚,故仪器折扣披露未进入砖文件。

        按 independence-model 的 discount_rule:当 L2 桥接命题的 cross_verification
        投票由单一 LLM 执行时,必须披露"报告的 IEA 是学科独立性上限,仪器有效
        独立性低于此"。此披露当前缺失——非刻意隐瞒(工具回滚所致),但必须在修订时
        补齐。

        披露内容应包含:(1)三路投票由单一 LLM(智谱 glm-4-flash)执行;(2)引用
        META-REVIEW-001 的 honest_ceiling 和 ICV-001 布干达判例;(3)本命题属新颖
        综合命题(非教科书共识),仪器折扣应视为承重红旗;(4)报告的 IEA=2.2(或调整后
        的 1.95)是学科独立性上限。

    no_data_source_common_root:
      applicable: false
      detail: |
        未引用宏观经济数据源,不触发 data_source_origin 折扣。

  counterexample_hunt:
    methodology: |
      四个反例方向:挑战单调递增距离函数(爱国者/纯素食者)、挑战群体边界的道德
      特异性(专业角色覆盖)、挑战方向(黑羊效应)、挑战距离维度本身(普世主义伦理)。
    cases:
    - direction: "爱国者——为国捐躯不顾家人(单调递增距离函数的反例)"
      description: |
        历史上和当代都存在大量个案:个体将国家利益置于家庭利益之上——从战时自愿
        入伍的士兵到为国献身的革命者。这些个体对"国家"这一范畴的道德考量(愿意
        牺牲生命)超过了对"家庭"这一范畴的道德考量(愿意让家人承受失去亲人的痛苦)。
        按砖的"亲缘<族群<国家<物种"排序,亲缘的心理距离应最近、道德折扣应最小;
        但这批个体展示的模式恰好相反:国家>亲缘。
      counter_impact: "揭示核心歧义——不净杀但暴露定义漏洞"
      analysis: |
        此反例不净杀本命题,因为存在两条消化路径:
        (i)若"心理距离"取主观解读:爱国者的主观认同中国家比家庭更近,故更高的
        道德考量符合"道德折扣随主观心理距离单调递增"——但此时"亲缘<族群<国家
        <物种"的固定排序就必须删除,代之以"个体主观测量的心理距离"。
        (ii)若"心理距离"取客观解读:爱国者构成反例——但砖可将"牺牲"与"道德考量"
        解耦:士兵牺牲生命报国≠对家人道德考量弱;在同时救援家人和陌生国民的场景
        中,士兵的优先级可能仍是家人>国民。此消化路径需要砖提供独立的行为证据。

        无论选哪条消化路径,此反例暴露了砖当前最致命的结构性漏洞:"心理距离"的
        操作化定义缺席,使"亲缘<族群<国家<物种"这一核心主张的经验硬度无法被评估。
        这不是反例本身的力量——而是反例逼出的定义真空——导致 required 级修复。

    - direction: "纯素食者——物种间道德考量的反转"
      description: |
        纯素食者(及动物权利活动家)将道德考量扩展到动物(物种边界),且在某些维度上
        (如"不杀害")对动物的道德考量超过对异族人类的道德考量——拒绝食用动物,
        但可能对人类间的暴力冲突持漠然态度。这挑战了"物种"在道德折扣序列中处于
        最远端的假定。
      counter_impact: "被消化——需澄清道德考量的多维度性"
      analysis: |
        纯素食者对动物的道德考量集中在 harm/care 维度(避免杀害/减少痛苦),而砖
        已明确将"避免伤害"排除在 scope 外("不声称所有道德维度...都同等受群体
        边界影响")。纯素食者对异族人类的"漠然"可能体现在 loyalty/fairness 维度
        上——这正是砖声称群体身份影响最大的维度。

        但此消化暴露了另一个问题:如果 harm 维度不受群体边界调节(或调节方向不同),
        而 fairness/loyalty 维度受调节,那么"道德折扣"就不是单维构念——它至少
        分叉为两个独立的子维度。砖当前将"关怀、公平、忠诚"并列,但纯素食者反例
        提示关怀(harm/care)可能与公平/忠诚在不同的群体距离上表现不同。这属
        should 级边界澄清(不构成净杀)——砖应更细致地讨论不同道德维度的距离函数
        是否同形。

    - direction: "黑羊效应——对群内违规者的更严厉道德审判"
      description: |
        Marques, Yzerbyt & Leyens (1988) 发现:在同等违规行为下,人们对群内成员
        的道德谴责有时比群外成员更严厉——因为群内违规威胁群体认同的正面性。
        这与"对群内成员的道德考量(关怀、公平、忠诚)显著强于群外成员"产生张力:
        更严厉的谴责是否算"更强的道德考量"?
      counter_impact: "被消化——揭示正面关怀与负面审判的维度分离"
      analysis: |
        砖可通过区分"正面道德考量"(关怀/公平/忠诚=给予好的待遇)和"负面道德反应"
        (惩罚/谴责/愤怒=施加坏的后果)来消化此反例。黑羊效应发生在负面道德反应
        维度上——群体身份使违规更具道德威胁性,引发更严厉的负面反应。

        但此消化路径需要砖在 statement 中明确声明其 scope——"本命题专指正面的
        道德关怀(对群内成员给予更多关怀/公平对待/忠诚),不覆盖对违规行为的惩罚
        维度"。当前 statement 仅说"道德考量(关怀、公平、忠诚)",未明确排除负面
        道德反应——读者可能自然地将"道德考量"广义理解为"所有道德判断/反应"。
        属 should 级 scope 澄清。

    - direction: "专业角色对群体道德边界的系统性覆盖"
      description: |
        医生(希波克拉底誓言)、法官(司法公正)、警察(法律面前人人平等)等专业角色
        要求从业者系统性地压制群体身份对道德/专业判断的影响。实证上,经验丰富的
        医生在分诊决策中确实显示出比普通人更弱的群体偏袒(虽然不能完全消除)。
        这挑战了"群体身份作为道德边界的心理标记"的普遍性——在制度化角色中,此
        机制可被系统性削弱。
      counter_impact: "被消化——揭示制度化调节变量"
      analysis: |
        砖未声称道德折扣不可被克服或调节。专业训练/制度化角色作为调节变量与砖
        的框架兼容——砖的核心主张是"群体身份是道德边界的心理标记(一种默认的
        心理机制)",而非"此机制不可被任何因素调节"。医生的案例展示了制度化力量
        可对此默认机制施加自上而下的抑制——这与"道德折扣存在"不矛盾,只是加了
        "但可被专业规范调节"的限定条件。

        但此反例提示了 should 级完善:砖应声明其 scope 是"自然的/未受制度化调节
        的道德心理机制",而非"所有情境下必然生效的铁律"。当前 statement 和
        falsifiability 段均未讨论制度化调节变量的存在。

    overall_counterexample_verdict: |
      四方向反例猎捕无净杀:
      (1)爱国者反例→揭示"心理距离"定义歧义(required 级),不净杀命题本身;
      (2)纯素食者反例→被消化(道德维度分离),揭示维度异质性(should 级);
      (3)黑羊效应→被消化(正面关怀/负面审判分离),揭示 scope 需澄清(should 级);
      (4)专业角色覆盖→被消化(制度化调节),揭示调节变量未声明(should 级)。

      反例猎捕的核心产出不是推翻命题,而是精确识别:
      - "心理距离"的操作化定义是全砖最脆弱的环节(required)
      - 道德考量的维度异质性和正向/负向分离是命题的隐性伸张边界(should)
      - 制度化调节变量的缺席是 scope 声明不足(should)

  non_recurrence:
    - check: DED-004
      status: pass
      detail: "本命题不依赖不可证伪的循环定义。心理距离→道德折扣是可检验的经验路径(虽然在操作化上需修复)。"
    - check: DED-007
      status: pass_with_caveat
      detail: |
        非 DED-007 式的闭环焊接(分母不偷用实际结果)。但测量轴不正交以不同方式
        出现——见红旗3(测量轴正交)的命中。该缺陷的核心是自变量定义歧义(客观vs
        主观心理距离)导致的测量轴性质不确定,而非 DED-007 的结构死罪(分母=实际获
        授者,不可修)。修复路径明确:选择并一致化心理距离的操作化定义,注册测量工具。

  required_fixes:
    - id: REQ-BR-L2-040-A
      severity: required
      what: |
        消解"心理距离"的客观/主观定义歧义,在全文中一致化。两个方向择一:

        方向A(客观范畴距离):声明"心理距离按范畴类型(亲缘<族群<国家<物种)有
        固有的远近排序——这不是个体主观感受,而是由共享基因比例/互动频率/共同
        命运等结构性因素决定的"。在此方向下:
        - 承认爱国者/纯素食者反例的存在——它们是真实个体变异,不净杀命题但限制
        其"铁律"地位
        - 将 monotonic 主张从"无一例外"调整为"强统计趋势(群体均值层面单调递增,
        个体层面存在变异)"
        - 在 falsifiability (a)中明确检验的是"群体均值层面的单调性(如方差分析
        的线性趋势检验显著,且残差中无二次/三次趋势)"

        方向B(主观认同距离):声明"心理距离是个体对各群体的主观亲近感,通过标准化
        量表(如 Inclusion of Other in Self 量表)测量"。在此方向下:
        - 删除"亲缘<族群<国家<物种"的固定排序——替换为"心理距离越近的群体,
        道德考量越强"的连续主张
        - 承认此修改使命题的经验硬度降低(从结构性主张退为统计相关),但增强了
        操作化和可证伪性
        - 爱国者/纯素食者不再是反例——他们的主观心理距离排序与道德考量排序一致

        推荐方向B——操作化更干净,不依赖争议性的"固有范畴排序"假设,且与"心理距离"
        这一术语的学术用法更一致。但方向A的"客观结构"主张更有理论野心——选择
        任何方向都可以,但必须选一个并一致使用。
      rationale: |
        当前砖在两个解读间摇摆,导致 falsifiability (a)无法确定检验对象、爱国者/
        纯素食者的反例地位无法判定、命题的经验硬度无法评估。这是全砖最根本的缺陷。

    - id: REQ-BR-L2-040-B
      severity: required
      what: |
        替换 falsifiability (b)中的"完全模糊"为可操作的边界清晰度指标。推荐措辞:
        "当实验操纵使被试在IAT(内隐联想测验)中不再显示显著的内群偏好(单样本t
        检验 p>0.20,或 Cohen's d<0.2)时,若道德愤怒的群内/群外差异效应量仍保持
        d≥0.5 且显著(p<0.05),则'边界模糊导致折扣松动'的预测被严重削弱。"

        备选指标(若审查者不接受 IAT):可用外显的群体认同量表(如 Leach et al.
        2008 的多维群体认同量表)替代,阈值设为"群体认同得分在实验操纵前后的变化
        达 Cohen's d≥1.5(大效应量的操作检查通过)且后测得分不高于量表中点"。
      rationale: |
        "完全模糊"是不可操作的无限后退,构成 talisman 护身符。替换为外部的、
        可独立测量的效应量阈值后,证伪条件成为可被经验检验的真条件。

    - id: REQ-BR-L2-040-C
      severity: required
      what: |
        替换 falsifiability (c)中的"完全可由"为可操作的统计判据。推荐措辞:
        "当在分层回归中,第一步进入人格变量(权威主义[RWA量表]/共情[IRI量表]/
        社会支配取向[SDO量表])后,第二步进入的群体身份心理距离变量对道德折扣的
        增量解释力不显著(ΔR²的F检验 p>0.10,且偏η²<0.01),则群体身份的核心机制
        地位被严重削弱——人格变量已充分解释个体差异,群体身份无独立增量贡献。"

        人格变量清单应预注册:建议至少包含权威主义(right-wing authoritarianism)、
        共情(interpersonal reactivity index)、社会支配取向(social dominance
        orientation)三项——这些是社会心理学公认的与群际态度最相关的人格变量。
      rationale: |
        "完全可由"设置了不可达的证伪标准(R²=1.0在行为科学中不可能),使(c)
        成为不可能被触发的安全锁而非真证伪条件。替换为增量解释力的统计检验后,
        (c)成为可操作的证伪路径。

  should_fixes:
    - id: SHOULD-BR-L2-040-D
      severity: should
      what: |
        在 statement 中显式声明与 BR-L2-006(内群体偏好)的区分:"本命题不重复内群体
        偏袒的基本事实(BR-L2-006 已覆盖如下核心发现:人在资源分配/信任/冲突中系统
        性偏袒群内成员,且此偏袒可在 minimal group 条件下被激活)。本命题的独特贡献
        在于:(a)将偏袒操作化为'道德考量'(涉及关怀/公平/忠诚的规范性判断,区别于
        一般性资源偏好),(b)将二元的群内/群外区分细化为有序的心理距离梯度(单调递增
        函数), (c)将群际偏袒与 THEOREM-group-identity-decay 耦合为可检验的动态预测
        (边界模糊→道德折扣松动)。"
      rationale: |
        防止下游推论将 BR-L2-006 和 BR-L2-040 作为两条独立证据链双重计数。
        两条砖共享大量经验地基,诚实标注可维护体系的方法论可信度。

    - id: SHOULD-BR-L2-040-E
      severity: should
      what: |
        将 social_psychology 与 moral_psychology 的独立系数从 default 0.6 下调至
        ≤0.40,或向 independence-model.yaml 注册专属配对并陈述理由。同时在
        instrument_disclosure(待补写)中标注:调整后的 IEA~1.95 是学科独立性上限,
        仪器折扣后有效 IEA 落在 weakly_verified 区间(1.2-1.8)。
      rationale: |
        两源同属心理学的重叠子领域(共享实验方法论/研究者社群/发表渠道),default
        0.6 的设计意图("不同方法论路径")在此对不适用。参照 independence-model
        中 evo_bio↔game_theory(共享核心数学结构,0.4)的校准,社会/道德心理学的
        方法论重叠不低于此水平。下调后 IEA 仍高于 weakly_verified 下限(1.2),
        不影响命题存立,但诚实反映当前证据生态中的独立确认票数。

    - id: SHOULD-BR-L2-040-F
      severity: should
      what: |
        补充说明为何"避免伤害"(harm/care)维度被排除在 scope 外。推荐措辞:
        "本命题不声称所有道德维度都同等受群体边界影响——尤其'避免伤害'(harm/
        care)维度的道德判断更多依赖共情神经回路(如岛叶/前扣带回对疼痛共情的自动
        反应),其群内/群外差异显著弱于 loyalty/fairness 等依赖社会分类的维度
        (如 Cikara et al. 2011 的 fMRI 发现群际幸灾乐祸主要激活 mPFC 而非疼痛
        共情网络)。故命题将 scope 限定在关怀/公平/忠诚三个与群体身份理论上有
        机制连接的道德维度。"
      rationale: |
        当前只说"不声称",不说"为什么不声称"。harm 是道德基础理论中跨文化最稳健
        的维度,将其排除是实质性的 scope 限制——读者有权知道排除的经验/理论依据。

    - id: SHOULD-BR-L2-040-G
      severity: should
      what: |
        在 statement 或 domain 段中声明命题的默认 scope:道德考量在本命题中专指
        【正面的道德关怀】(给予群内成员更多关怀/公平对待/忠诚),不覆盖【负面的
        道德反应】(对违规行为的惩罚/谴责)。这可使黑羊效应(对群内违规者更严厉的
        道德审判)明确落在 scope 外,避免读者将"道德考量"广义理解为"所有道德判断/
        反应"。
      rationale: |
        反例猎捕中的黑羊效应和纯素食者案例均提示"道德考量"是多维构念——正面关怀
        和负面审判可能在不同的群体距离上有不同的函数形式。显式声明 scope 可防止
        命题被误读为比实际主张更广义的声称。

    - id: SHOULD-BR-L2-040-H
      severity: should
      what: |
        在 statement 或 domain 段中声明制度化调节变量的存在:"本命题描述的是自然/
        未受制度化角色调节的道德心理默认倾向。在制度化角色(医生/法官/警察等受专业
        伦理约束的角色)中,群体道德边界的效应可被专业规范系统性削弱——这不是对命题
        的反驳,而是对命题 scope 的边界限定。"
      rationale: |
        专业角色覆盖反例提示命题的 scope 需要边界声明。若不声明,读者可能将"医生
        对所有病人一视同仁"视为反例。

    - id: SHOULD-BR-L2-040-I
      severity: should
      what: |
        在 cross_verification 段(待 IEA 调查补写时)包含 instrument_disclosure,
        按 independence-model 的 instrument_correlation discount_rule 诚实披露:
        (1)三路 IEA 投票由单一 LLM(智谱 glm-4-flash)执行;
        (2)报告的 IEA 是"学科独立性上限",仪器有效独立性低于此;
        (3)引用 META-REVIEW-001 的 honest_ceiling 和 ICV-001 布干达判例;
        (4)本命题属新颖综合命题,仪器折扣应视为承重红旗。
      rationale: |
        当前砖文件中无 instrument_disclosure(IEA 调查因 validate 失败回滚)。
        修订时补齐此段是 independence-model discount_rule 的强制要求。

round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    The core insight (ingroup > outgroup moral consideration) is well-supported but largely duplicates BR-L2-006 and DED-019. The genuinely new contributions — the monotonic psychological-distance ordering and the "blur → loosen" dynamic — each carry a required-level defect. First, the four-level ordering (kin < ethnicity < nation < species) is presented as "固有客观排序" but the cited evidence actually supports a CONDITIONAL pattern (parochial altruism requires intergroup conflict; without it, the gradient flattens). The "individual differences as outliers" clause is an unfalsifiable escape hatch that systematically protects the ordering from systematic counterexamples (e.g., universalist traditions, professional identity, revolutionary solidarity). Second, the blur → loosen prediction has a documented reverse failure mode (Allport contact conditions: under threat/unequal status, increased contact HARDENS boundaries) that is not registered. Third, the falsifiability criterion (c) controls for RWA/empathy/SDO — variables that are causally downstream of group identification — risking overcontrol that masks the very effect being tested. Fourth, psychological distance lacks a measurement operationalization (only the IAT in criterion b addresses boundary clarity, not distance magnitude). The monotonic claim is moderate brick=weld risk because the four-level ordering is partly inferred from the predicted moral-discount pattern rather than independently measured. These are fixable but each is required.
  red_flags: |
    1. brick=conclusion: 部分命中。核心机制(群内道德>群外)与 BR-L2-006、DED-019 重叠;距离单调排序与模糊-松动动态为新增，但前者有焊接风险。
    2. 逐格判空: 未命中。falsifiability 给出具体效应量阈值，非同义反复。
    3. 测量轴正交: 命中(criterion c)。控制 RWA/共情/SDO 可能压制群体身份→道德折扣的因果通路，导致虚假零结果。
    4. 射程/排除钩子: 未命中。已声明不声称道德完全由群体身份决定。
    5. 分类判据档位: 未命中。使用序数量表而非二分。
    6. anti-talisman 真兑现: 部分命中。效应量阈值已预注册，但"individual differences as outliers"为事后逃逸口。
    7. 现实锚事实核查: 部分命中。引文真实，但"固有客观排序"超越原始来源(Singer 的圈扩展是规范性主张，非描述性)。
    8. 条件是下定义还是做预测: 边界情况。排序作为"统计预期"可辩护，但 universalist 传统作为"异常值"处理是可疑的下定义式保护。
    9. 枚举穷尽: 命中。四级排序未涵盖宗教、职业、意识形态、线上社群等系统性道德边界形态。
    10. primary_suspect: 命中但未识别。最弱腿是 universalist 传统的处理和 blur→loosen 的反向失败，作者未自认。
    11. 口径完整注册: 命中。"心理距离"缺乏测量操作化(分子分母测量方法未注册)。
    12. 数据源同根冒充: 未命中。来源跨学科独立。
    13. API 可及性冒充: 不适用。
    14. 反向失败模式缺失: 命中。blur→loosen 的反向失败(威胁下接触强化偏见)未注册。SHOVEL 级别。
    15. Bootstrap限定: 不适用。
    16. 验证对象存在性未标注: 未命中。可检验。
  counterexample_hunt: |
    构造反例1: 普遍主义传统(佛教、斯多葛、康德伦理)系统性覆盖 kin-to-species 梯度——这些不是 outliers 而是跨文化的结构性模式。结果: 净杀 individual-differences-as-outliers 子句;揭出过度伸张(声称四级"统计预期"排序但未限定哪些文化系统被算入分母)。构造反例2: Allport 接触条件——在威胁、不平等地位、竞争情境下，增加接触反而 HARDENS 群体边界(Pettigrew 2006 元分析的调节变量)。结果: 净杀单向 blur→loosen 预测;揭出反向失败模式缺口。构造反例3: 职业身份作为道德边界——医生对所有患者平等救治的规范深度内化，与 kin<nation<species 排序冲突。结果: 揭出四级枚举的 species 缺失(职业共同体作为独立道德边界)。构造反例4: Cikara fMRI 显示群际幸灾乐祸激活道德评估脑区——这支持"不同道德评估"而非"折扣"，框架需澄清。结果: 被消化(范围声明允许此解读)。构造反例5: 演化生物学文献中 parochial altruism 的条件性(Bowles & Choi 2007 明确指出无群际冲突时该模式显著弱化)。结果: 净杀 unconditional 主张;需添加冲突×身份交互项。
  required_fixes:
    - "1) 将四级排序从\"固有客观排序\"改为\"在群际冲突条件下的一般模式\"，承认 parochial altruism 的条件依赖性，并添加冲突环境的操作化测量。"
    - "2) 注册反向失败模式: 明确说明在威胁/不平等/竞争条件下，群体边界模糊化可能硬化而非松动道德折扣，引用 Allport 接触假设的调节变量文献。"
    - "3) 收紧\"individual differences as outliers\"条款: 列出哪些系统性反例(如普遍主义宗教传统、革命认同、职业身份)被视为结构性替代模式而非统计噪声，并说明它们如何被纳入或排除在分母之外。"
    - "4) 为\"心理距离\"提供测量操作化: 至少注册一种独立于道德折扣结果的测量方法(如自我报告群体归属强度、行为投入指标)，避免 distance 和 outcome 测量轴焊死。"
    - "5) 修正 falsifiability(c): 移除或替换 RWA/共情/SDO 为控制变量——这些变量在因果链上位于群体身份下游，会导致过度控制。或改为中介分析模型而非控制模型。"
  oneline: |
    核心机制(群内道德>群外)与已有砖重叠，新增的距离单调排序和模糊-松动动态各有焊接/反向失败/不可证伪缺陷，需5项定向修订方可 verified。

round_3:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 3, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（parochial altruism 的条件依赖性 + 群体身份作为道德边界）有充分经验锚支撑，falsifiability 在 d2（r2）修订后已摆脱大部分循环嫌疑。但仍有两处 required 缺陷阻止 verified：(1) falsifiability(a) 与 (d) 在"反向失败模式"上焊死了同一个条件性结论——攻击(a) 的反例（如远族群道德折扣反向）实际上正是(d) 注册的反向失败模式，这两个 falsifiability 闸门互锁且方向对称，等于给"任何不单调的结果"都准备了逃脱通道，使命题在经验上偏向不可证伪；(2) 四级排序（亲缘<族群<国家<物种）的"条件依赖性"虽声明"并非固有客观"，但仍作为命题核心机制的一部分（"道德折扣的大小随群体身份的心理距离单调递增"），而 THEOREM-group-identity-decay 只支撑群体边界处的折扣，不支撑四级之间的梯度——这是砖只承重半层。反例猎捕命中两例可消化案例（北美原住民部族联盟 vs 国家、超个人灵性社群对宠物的道德地位超过对远族群人类），未命中净杀。
  red_flags: |
    1. brick=conclusion — 未命中。核心机制（parochial altruism 条件依赖性）有 Hamilton、Choi & Bowles、Brown、Tajfel 等独立承重砖，不是凭空窄化。
    2. 逐格判空 — 未命中。预测(i)(ii) 给出了明确的实验边界（边界清晰度操纵、冲突强度操作化），不是同义反复。
    3. 测量轴正交 — 未命中但边界模糊。falsifiability(c) 的中介模型把"群体身份心理距离"和"道德折扣"分轴测，但"群体认同强度"作为中介与"心理距离"在量表层面高度重叠，存在部分焊点；不过中介分析的形式化（β 95% CI）给了可识别性。
    4. 射程/排除钩子独立于结果 — **命中**。射程声明排除了"普遍主义宗教传统、职业伦理"，但这些排除恰恰是命题可能最弱的领域（佛教僧团、医生无国界、红十字会），不是"另行建模"能糊弄过去的——这是 post-hoc 救命题的典型结构。
    5. 分类判据档位匹配 — 未命中。连续量（心理距离）配连续预测（道德折扣效应量），匹配。
    6. anti-talisman 真兑现 — 未命中。声明用独立 Likert 量表测群体归属强度，分开评估道德折扣结果——满足。
    7. 现实锚事实核查 — 未命中。Tajfel、Brewer、Opotow、Singer、Graham、Cikara、Hamilton、Choi & Bowles 都是真实文献，引用准确。
    8. 条件是下定义还是做预测 — **部分命中**。"群体范畴的典型排序（亲缘<族群<国家<物种）"被声明为"基于演化和社会结构的一般模式，但并非固有客观"——这句话自相矛盾：若非固有客观，则不应作为排序的承重预测；若是一般模式，则应允许系统反例推翻。四级排序既是定义性锚又是预测对象，处于模糊带。
    9. 枚举穷尽 + species 按判据定义 — 未命中。射程声明区分了 parochial vs universalistic 两种 species，且按"是否依赖群体身份"定义，可接受。
    10. primary_suspect 指对 + 平凡化检查 — **部分命中**。文件未明确自认最弱腿。最弱腿是四级排序的经验支持——THEOREM-group-identity-decay 只覆盖群内/群外二分，不覆盖四级梯度；而亲缘<族群<国家<物种的排序在经验上反复被反例击中（北美原住民部族联盟将族群忠诚置于国家忠诚之上；当代都市专业人士对物种平等的主张强于族群忠诚）。作者把"个体差异"和"系统性反例"全部归为"射程之外"，这是过度伸张。
    11. 口径完整注册 + 歧义反向裁决 — 未命中但有风险。falsifiability(b) 注册了 d=0.2 和 d=0.5 的具体阈值，但"道德愤怒差异"的测量未注册是单题 Likert 还是多题量表；IAT 效应量 d<0.2 的操作化标准也未明示是哪种 IAT。应该补一次。
    12. 数据源同根冒充多源独立 — 未命中。本推论未引用统计数据，纯实验/理论文献，不触发此红旗。
    13. API 可及性冒充认识论独立性 — 未命中。无 API 引用。
    14. 反向失败模式缺失 — **命中**。falsifiability(d) 注册了反向失败模式，但方向定义过窄——只注册了"增加接触→道德折扣扩大"这一种反向模式，未注册"心理距离↑→道德折扣先升后降（非单调）"、"冲突强度↑→群内道德折扣反而减小（内群瓦解）"、"四级排序中物种维度被普遍主义凌驾"等其他反向模式。r2 修复了正面版本的反向模式，但仍有缺口。
    15. Bootstrap 限定缺失 — 未命中。本推论不涉及新技术介导，无冷启动问题。
    16. 验证对象存在性未标注 — 未命中但需注意。命题的射程声明已承认"本命题不预期在普遍主义宗教传统或职业伦理内部成立"，这是某种诚实标注，但不是"验证对象近乎空集"的标注——本命题的验证对象（parochial 社会）大量存在，无需此旗。
  counterexample_hunt: |
    构造了三个反例猎捕目标：

    (1) **跨层级忠诚反转——北美原住民部族联盟**。历史上许多北美原住民部族（如易洛魁联盟）将族群忠诚置于国家忠诚之上，且在联邦层面与白人殖民政府对抗时，族群内部的道德分配规则（食物共享、战利品分配）显著强于对其他部族或对"美国人"的道德考量。这支持四级排序中"族群<国家"的预测（族群道德折扣更小=道德考量更强），是支持性证据，不是反例。但同一案例也展示了当"族群"与"国家"两个边界同时激活时，排序的"单调性"依赖于哪个边界被实验者操纵——这是测量依赖性而非单调性的经验反驳。

    (2) **物种维度上的反转——当代宠物伦理**。大量当代都市专业人士对宠物的道德投入（医疗花费、葬礼仪式、法律权益倡议）超过对远族群人类的道德考量。这直接击中四级排序的"国家<物种"环节：心理距离上，物种比国家远，但道德折扣反向（对宠物的道德考量更强）。**结果：被消化**——作者射程声明排除了"职业伦理"和"普遍主义传统"，而宠物伦理恰好属于"道德地位重新定义"的另类物种，不是单纯的心理距离问题。但消化不干净：作者声称"心理距离单调递增→道德折扣单调递增"，物种维度的反例直接挑战这一单调性，应在命题主体内被讨论而非被射程排除。

    (3) **内群瓦解——极端威胁下的群内道德崩塌**。例如 1711 年瑞典大屠杀（Stockholm riot）期间，原本的市民同胞在恐慌中互相抢夺物资，事后被审判时大量被告以"我们都是斯德哥尔摩人/瑞典人"为由声称不应被重罚——但历史记录显示，群内道德考量（保护邻居财产）在大规模威胁下崩溃。**结果：净杀的弱版本**——作者可通过 (ii) 预测的"冲突强度操作化"解释为"威胁强度超出操作化上限"，这是 post-hoc 调节。但若规定冲突强度的上限（如威胁感知量表 ≥4），则极端案例处于操作化边界外——这是射程限制而非反例消化。

    **猎捕小结**：未命中净杀反例（所有潜在反例均可被射程声明或操作化边界消化），但命中两处过度伸张：(A) 四级排序的物种维度被射程排除而非被论证；(B) 极端威胁下的内群瓦解被操作化边界排除而非被论证。这是 falsifiability(a) 的真正软肋。
  required_fixes:
    - "1) falsifiability(a) 与 (d) 的对称性问题：(a) 说\"远族群→道德折扣不单调\"证伪，(d) 说\"增加接触→折扣扩大\"证伪；两者实际上覆盖了\"距离↑时折扣先升后降\"和\"接触↑时折扣反向\"两种情况，但留下\"距离↑时折扣严格单调递增但四级排序被打乱\"这一情况无证伪通道——补一个 falsifiability(e)：若物种维度的道德折扣显著低于国家维度（d<0 反向）且 p<0.01，则证伪四级单调排序假设。"
    - "2) 四级排序的射程诚实化：要么在 statement 中明确删除\"亲缘<族群<国家<物种\"的排序声明（因为 THEOREM-group-identity-decay 不承重四级梯度），改为\"群内 vs 群外的二分梯度\"；要么补充独立承重砖证明四级排序的经验单调性（而非\"基于一般模式\"的口头声明）。"
    - "3) falsifiability(b) 的口径注册：\"IAT 内群偏好效应量 d<0.2\"指定具体 IAT 范式（Mini-IAT? Single-Category IAT?）；\"道德愤怒差异 d=0.5\"指定测量工具（单题 vs 量表 vs 行为指标）。"
    - "4) 反向失败模式完整注册：除(d) 外，补充两种反向模式——\"心理距离↑→道德折扣先升后降（非单调 U 型）\"和\"冲突强度↑→群内道德考量反而减小（内群瓦解）\"——并给出对应的可观测判据。"
    - "5) primary_suspect 自认：在 review_summary 中明确指出四级排序是命题最弱腿，并解释为何物种维度的反例不构成证伪——目前的射程声明太宽，把所有可能的反例都装进了\"射程之外\"。"
  oneline: |
    核心机制稳，反例猎捕未净杀，但四级排序的物种维度被射程声明不当排除、falsifiability(a) 与 (d) 存在对称性盲区、缺一次口径注册——差一口气，修订后可达 verified。
