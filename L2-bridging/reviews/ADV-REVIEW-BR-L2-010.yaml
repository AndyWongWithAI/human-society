id: ADV-REVIEW-BR-L2-010
type: adversarial_review
reviews: BR-L2-010
layer: L2-bridging
# status 字段仅为通过 validate.py 的 L2 目录状态枚举检查;语义=本审查档的裁决结果
status: verified
target: BR-L2-010
target_term: 非人格化制度能替代人际信任支撑陌生人交换

round_1:
  reviewer: |
    独立对抗审查者(全新上下文子 Agent,与写砖者及 IEA 调查员无关)。
    唯一校准来源为 docs/pipeline/review-rubric.md(L3 评分卡 11 条通用红旗)+ L2 专属 5 项重点。
  date: 2026-07-15
  verdict: verified
  verdict_note: |
    三条 verified 硬门逐一核过——(1) 无 required 级缺陷;(2) 本轮亲自做了反例猎捕
    (沉默贸易/后苏联执行真空/法律移植不采用/马格里布联盟四路),无 scope 内活反例,
    全部被消化且其中两例反哺命题;(3) 未重蹈 DED-004(capability 主张配有事前可测的
    (b) 型证伪条件——引入制度后匿名交易应变得可行,可用自然实验检验)、未重蹈 DED-007
    (制度按结构特征事前定义,不由交易成败反推)。
    两处压秤但不到 required 的软肋已在下方红旗与 IEA 检查中明记:
    (i) IEA=1.9 只高出门槛 0.1,而 independence-model 自注"系数 ±0.2 内不宜过度解读
    小数差异"——数字边缘,靠真实文献收敛(North/Greif/MNW 多重复现)兜底而非靠小数;
    (ii) "各自只填补特定信任缺口"有被事后当开脱用的潜在空间,但三类缺口(执行/信息/
    承诺)已事前注册且可独立识别,现文本未越线。维持 verified。

  red_flags:
    f1_brick_equals_conclusion: |
      未命中。THEOREM-cooperation-precondition 只说"陌生人合作脆弱、需要替代机制"
      (存在性缺口),并未断言替代机制【经验上存在且走得通】。本砖的非平凡经验内核=
      四类结构上事前可辨认的制度(第三方执行/声誉登记/标准契约/抵押货币)在匿名/
      一次性交换中【实际能】顶住信任缺口——这在逻辑上完全可能为假(可想象世界:信任
      纯靠情感联结,任何执法都替不了)。也非"专为某条推论窄化":INDEX 显示 DED-008/
      009/010/012/016 与 L4-001/004/005 多点承重,是通用砖。
    f2_cell_nontriviality: |
      未命中。"制度能替代信任"不是同义反复:反面世界可设想且历史上被认真主张过
      (嵌入性学派曾主张市场交换必然嵌入人际关系)。(b) 款"不免费+各填特定缺口"
      是附加经验内容,非砖平凡强制。
    f3_measurement_orthogonality: |
      未命中(重点排查过 DED-007 死因)。自变量=四类制度的在场,按结构特征(是否存在
      不依赖私人关系的惩罚/曝光系统)事前判定,可从法律档案/平台规则/铸币实物独立测;
      被观测量=匿名交换是否可行(交易量/违约率/信贷期限)。无"哪里陌生人交易成了就把
      当地随便什么东西追认成制度"的反推焊点——制度类型清单已封口为四类。
    f4_exclusion_hooks_ex_ante: |
      未命中。"只主张 capability 不主张必然采用"是事前写进 statement 的射程声明,
      不是见了反例后才开的口子。注意事项:排除"未被采用"案例时,制度的可信度
      (法院执行率/腐败指数)必须用独立于交易结果的指标测,否则会退化为护身符——
      现文本未犯,列为观察项。
    f5_classification_granularity: |
      未命中。四类制度按填补的缺口类型(执行/信息/承诺)分档,对象是离散的制度形态,
      不是被硬二分的连续量。
    f6_anti_talisman: |
      攻不穿。前件(制度在场+结构特征)不由结果反推;falsifiability (b) 是真证伪条件:
      引入制度后陌生人交易不因此可行→削弱。且存在真实的独立测量案例:声誉系统的
      自然/田野实验(如 eBay 卖家声誉对成交价的因果效应)是在结果之外独立操纵前件的。
      (a) 款的"普遍地"一词偏弱(单个反例社会不足以触发),但 (b) 款可单例检验,整体
      证伪面足够。
    f7_real_world_anchors_factcheck: |
      未命中。逐条核对:Milgrom-North-Weingast 1990 law merchant 模型——真实;
      Kandori 1992 社区执行——真实;Greif 马格里布 vs 热那亚——真实,且
      Edwards-Ogilvie 2012 质疑已被砖诚实预披露;Henrich 等 2010(Science,15 社会
      市场整合与匿名公平/惩罚)——真实,砖已自注"相关非因果";铸币在吕底亚/中国/印度
      独立出现——标准经济史结论。无事实错或过度解读。
    f8_definition_vs_prediction: |
      未命中。"能替代"是可证伪的经验预测(制度引入应因果性地扩大匿名交易可行域),
      不是把"凡是支撑了交易的都叫制度"的定义游戏——制度清单已按结构特征事前封口。
    f9_enumeration_hunt_n_plus_1: |
      部分命中但攻不穿。砖列四类(第三方执行/声誉/契约/抵押货币)。主动猎第 5 类:
      (a) 技术性自执行(智能合约/自动售货机式同时交割)——可归入"承诺缺口"的抵押/
      机制设计延伸;(b) 保险/风险分摊池——可归入担保;(c) 宗教超自然惩罚(big gods)
      ——非人格化但非本砖列举。不过砖的措辞是"一组非人格化制度"而非"仅此四类可枚举",
      未声称穷尽,故第 N+1 类不构成 required 洞;建议(should 级以下)后续推论引用时
      勿把清单当封闭枚举用。
    f10_primary_suspect_and_trivialization: |
      未命中。L2 砖无 falsification_trace 强制字段,但 honest_note 自认"教科书命题、
      新颖性在其上的推论"——自我定位准确。上位泛化检查:它没有被稀释成"合作需要执行"
      的常识,因为它断言的是【非人格化】系统对【人际信任】的可替代性,这在嵌入性
      理论下并非常识。
    f11_caliber_registration: |
      未命中(无数字阈值,n/a)。唯一近似口径的是 IEA=1.9 的算法——分子分母(锚源 1.0
      + 对已计源取最小成对系数)已在 independence-model.yaml 事前注册,计算可复核:
      1.0 + 0.5(gt__cu) + min(0.4 evo__gt, 0.6 evo__cu)=0.4 → 1.9。无事后选口径。

  l2_specific_checks:
    c1_brick_equals_conclusion: 见 f1,未命中。
    c2_axis_orthogonality: 见 f3,未命中。
    c3_anti_talisman: 见 f6,攻不穿。
    c4_iea_honesty: 见 iea_independence_check。
    c5_counterexample_hunt: 见 counterexample_hunt。

  iea_independence_check: |
    结论:诚实,维持 IEA=1.9 / verified,但明记其边缘性。
    (1) 算术复核——1.0(gt 锚) + 0.5(cu,gt__cu 成对系数 0.5) + 0.4(evo_bio,对已计
    两源取最小 min(0.4,0.6)=0.4 防重复计权) = 1.9 ≥ 1.8。规则执行正确,未见把共享
    数学结构的来源按满权重复计(evo_bio 与 gt 的"制度即扩展合作"共享逻辑已被 0.4
    系数吃掉)。
    (2) 单仪器折扣——已双重披露(verdict_note + instrument_disclosure 专门字段),
    明说 1.9 是学科独立性上限、仪器有效独立性低于此,符合 instrument_correlation
    discount_rule;且按 mitigation 条款,本命题属"多重复现的稳固共识"(North/Greif/
    MNW 为真实文献收敛),缓解适用。
    (3) 最弱一票压力测试——evo_bio 票(Henrich 2010)实质支持的是"市场整合与匿名
    亲社会性相关",与"制度能替代信任"只是方向一致的间接证据,且相关非因果、范式与
    gt 共享。砖已如实降权至 0.4 并写明缺陷。即便对抗性地把该票整个剔除,IEA=1.5
    仍 ≥1.2(降为 weakly_verified 而非 rejected)——即 verified 档位确实系于这张
    0.4 的弱票 + 系数小数,这是边缘但规则内的结果,independence-model 的 ±0.2
    校准告示提醒不过度解读;鉴于 gt+cu 两通道(形式化证明 vs 档案/物质证据)方法论
    路径确实异质且各自扎实,判定 1.9 的定性含义("约两个准独立来源")成立。
    (4) 无虚高手法——未发现把同一文献(如 Greif)在两个通道重复计权:gt 通道计的是
    MNW/Kandori 形式模型,cu 通道计的是档案/物质证据,分工干净。

  counterexample_hunt: |
    必做项,四路主动猎捕,结果:无净杀,全部被消化,其中两例反成支持。
    【猎 1:无制度的陌生人交换——沉默贸易(silent trade)】希罗多德记载的迦太基-
    西非海岸哑巴交易、诸多民族志平行案例:无第三方、无声誉登记、无契约、无货币,
    陌生人也完成了交换。是否净杀 (a)?否——沉默贸易靠【同时交割+随时可撤】把交易
    做成了零信任敞口的现货互换,它不是"用临时人际信任支撑了本会流产的交易",而是
    把需要信任的成分(赊欠/时间差/质量承诺)整个砍掉;其规模与品类因此被死死压在
    极窄区间,恰好反向印证:一旦要做有信任敞口的大规模交换,就绕不开制度。被消化,
    且反哺 (b) 款"各填特定缺口"。
    【猎 2:制度引入而交易未起——法律移植失败】发展中国家/转型国家大量存在"纸面
    法院在、人们仍只跟熟人做生意"(90 年代越南、中国的关系型契约)。是否净杀 (b)?
    否——(b) 的检验前件是"可信运作的制度被引入",而这些案例中执行率/司法可信度
    (可用独立于交易结果的指标测:判决执行率、腐败指数)不达标,属"未引入有效前件"。
    ⚠️ 此处是本砖最接近护身符的边缘:若"制度可信度"永远只在交易失败后才被宣布不足,
    即为反推。现文本靠可独立测量的可信度指标守住,列为观察项而非 required。
    【猎 3:执行真空下的替代——后苏联俄罗斯 90 年代】国家法院失灵后,交易未回退到
    纯人际信任,而是长出私人保护(黑手党"krysha")与中间人担保——即另一种第三方执行。
    反成支持:执行缺口必须被【某个】非人格化-ish 系统填上,填法可以很难看。
    【猎 4:马格里布联盟(Greif)——人格化声誉也能撑远程贸易?】联盟靠社区多边声誉
    执行,成员彼此非严格陌生人,似乎绕开了非人格化制度。被消化:(i) 联盟是有边界的
    封闭共同体,Greif 本人的论点正是这种人格化机制【锁死了规模】,与热那亚非人格化
    法律路径的扩张力形成对照——恰好是本砖 capability 主张的对照组;(ii) 多边声誉
    广播本身已是"不依赖与受害者私人关系的惩罚系统",处在人格化→非人格化的过渡带;
    (iii) Edwards-Ogilvie 2012 对该案例实证强度的质疑已被砖预披露。
    跨物种检查:非人类物种无任何非人格化制度,其合作/交换也从未越出亲缘+熟识互惠
    的圈——与砖的机制方向一致。
    净结论:无活反例;猎捕揭出的唯一注意点(猎 2 的可信度判定须独立于结果)已记入
    f4/f6 观察项,不构成 required。

  non_recurrence: |
    DED-004(不可证伪循环)——falsifiability (b) 为事前可测的干预型条件,eBay 声誉
    field experiment 类设计可独立操纵前件,非护身符。DED-007(测量轴焊死)——制度
    按结构特征事前定义、四类封口,不由交易成败追认。DED-008(枚举漏类)——砖未声称
    穷尽枚举,第 N+1 类(如超自然惩罚)不构成洞。L4-009(事后口径)——无数字阈值,
    IEA 算法系数均为事前注册。

  required_fixes: []
