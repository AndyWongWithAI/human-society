id: ADV-REVIEW-BR-L2-042
type: adversarial_review
reviews: BR-L2-042
layer: L2-bridging
target: BR-L2-042
target_term: "规范违反的传染效应 (Norm Violation Contagion)"
rounds: 1

人话摘要: |
  对 BR-L2-042(规范违反的传染效应——看到别人违反规范没受罚，自己违反的概率
  也升高)的 round_1 独立对抗审查。
  裁 needs_revision：命题有真实的经验内核——观察他人违反规范未受惩罚→自身违反
  概率升高——这一核心直觉在行为经济学和犯罪学中有扎实的跨学科支撑。但两条
  required 缺陷阻止 verified：(1)缺少 IEA cross_verification 节，无法评估独立
  来源加权，桥接砖无法进入 verified 流程；(2)"高度内化规范"的排除条件缺乏独立
  操作化判据，存在事后归类的 anti-talisman 风险——若某规范未显示传染效应，可
  被回溯性归入"高度内化"排除区。另有四条 should 级改进：机制过度指定(贝叶斯
  更新+社会证明两个机制均未被独立测量)、证伪条件(c)的"强于"不可操作化、
  反向失败模式(观察违规→道德反弹→强化遵守)的调节条件缺失、证伪条件(b)
  测试了下游应用(破窗→严重犯罪)而非核心机制本身。
  反例猎捕发现 Enron/世通后合规繁荣和新加坡等强社会控制社会的"违规→强化
  遵守"反例，均被部分消化(桥接砖可援引惩罚概率改变或"高度内化"排除)，但
  日本公共场合插队/乱扔垃圾等日常场景中"观察违规反而强化遵守"的正向效应
  构成对桥接砖方向性主张的最强张力——揭示 punishability 的操作化模糊性
  (什么算"未受罚"?社会鄙视算不算?)是桥接砖当前最脆弱的经验腿。

round_1:
  reviewer: independent-adversarial-reviewer
  date: 2026-07-16
  verdict: needs_revision
  verdict_note: |
    BR-L2-042 说"看到别人违反规范没受罚，自己违反的概率也升高"——这个命题
    有扎实的跨学科直觉支撑。Keizer et al. (2008) 的田野实验(环境脏乱→更多人
    偷窃/乱扔垃圾)、Cialdini et al. (1990) 的社会规范信息效应研究、Gino et al.
    (2009) 的不道德行为传染实验室实验，以及 Wilson & Kelling (1982) 破窗理论的
    犯罪学宏观证据，共同为"规范违反会传染"这一核心直觉提供了收敛性证据。

    然而两条 required 级缺陷阻止 verified 裁决:

    1.【IEA cross_verification 缺失——REQUIRED】
    桥接砖 YAML 不含 cross_verification 节。桥接砖引用了两个学科来源
    (behavioral_economics + criminology)，但未进行正式的独立来源加权投票。
    L2 桥接砖的 verified 需要 IEA ≥ 1.8，weakly_verified 需要 IEA ≥ 1.2。
    没有 cross_verification 就没有 IEA 分数，桥接砖无法进入任何已验证状态。

    即使未来补上 cross_verification，本条砖面临两条独立的 IEA 压力:
    (i) behavioral_economics 和 criminology 的"破窗/规范传染"研究共享深层的
    理论基因——criminology 的破窗理论(Wilson & Kelling 1982)直接借鉴了社会
    心理学的社会规范研究(Cialdini)，两源在"无序信号→行为改变"这一核心逻辑
    上不完全独立。按 independence-model.yaml 的 default_independence=0.6，
    两个不完全独立来源的 IEA 上限为 1.0+0.6=1.6——达不到 verified 门槛(1.8)，
    仅够 weakly_verified(≥1.2)。但若 criminology 源的 agree 票实际上与
    behavioral_economics 源共享了同一批底层实验(如 Keizer et al. 的研究同时
    被两个学科引用)，独立系数可能更低。
    (ii) 按 independence-model.yaml 的 instrument_correlation discount_rule，
    若 cross_verification 由单一 LLM 执行，必须披露"仪器有效独立性低于学科
    独立性上限"。本命题的"规范传染"直觉广泛存在于 LLM 训练语料中(社会心理学
    教科书的标准章节)，单一 LLM 投票的多源一致性可能反映语料共识而非独立验证。

    2.【排除条件的 anti-talisman 风险——REQUIRED】
    桥接砖声明"不适用于个体高度内化或与核心价值观绑定紧密的规范(如禁忌规范)"。
    此排除条件缺乏独立于传染效应结果的操作化判据。具体问题:
    (i) 没有任何预先注册的判据来判定一个规范是否"高度内化"——靠问卷调查?
    靠行为一致性?靠生理反应(如心率/皮肤电)?
    (ii) 若某规范在实证检验中未显示传染效应，桥接砖可以回溯性地将其归类为
    "高度内化规范"从而免疫于反例——这使排除条件从"射程限定"退化为
    "hidden talisman"。
    (iii) 更根本的是，"高度内化"本身是一个连续谱系(从"完全无所谓"到
    "宁死不违")。桥接砖未在连续谱上划定传染效应"生效区间"与"失效区间"
    的边界点——没有边界点，排除区就是事后可调的。

    修复方向:在见任何反例前，锁定"高度内化"的操作化判据(如:(a)Moral
    Foundations Questionnaire 的 purity/harm 分量表得分 > 均值+1SD;
    (b)在匿名实验中被试自愿为维护该规范支付的真实货币成本 > X;(c)跨文化
    中该规范违反被视为"不可接受"的比率 > 80%)。同时，将此排除条件从被动
    免疫("如果不传染→说明内化程度高")翻转为主动预测("本桥接砖预测:
    规范的内化程度越低，传染效应越强——可在同一研究中用多规范梯度检验")。

    3.【机制过度指定——should 级附加缺陷】
    桥接砖声称两个具体机制:(1)贝叶斯更新对惩罚概率的估计;(2)社会证明效应
    降低违反规范的心理成本。但引用的实证文献(Keizer et al./Cialdini et al./
    Gino et al.)均未独立测量这两个机制——它们只测量了行为改变(是否违反规范)。
    机制(1)和(2)是从行为结果推断的，而非独立验证的。替代机制如简单模仿
    (自动化的行为复制，无需信念更新)、注意力转移(环境混乱→注意力分散→
    自控力下降)、或理性搭便车(惩罚概率真的降低了)都可以解释相同的行为模式。

    这不构成 required 缺陷(命题的行为预测不依赖特定机制的正确性——即使
    机制识别错误，行为预测仍可成立)，但应列为 should:桥接砖应将机制声称
    从 statement 的"核心机制"降格为"可能的机制路径"，将 statement 的因果
    主张聚焦于行为层面的规律(观察违规→自身违规增加)而非认知层面的机制
    (贝叶斯更新+社会证明)。

    4.【证伪条件(c)的操作化缺口——should】
    证伪条件(c):"个体观察到他人违反规范后，出于道德反作用反而更严格地遵守
    规范，且这种效应在统计上强于传染效应"。问题:在单次实验中，"道德反作用
    效应"和"传染效应"是同时发生的，只能观测到净效应。若净效应为零，这可以
    意味着(a)两个效应都不存在(桥接砖被否证);或(b)两个效应均存在且恰好
    相等(桥接砖的传染机制正确，只是被反向效应抵消)。桥接砖未提供如何区分
    (a)和(b)的操作方案。

    修复方向:要么提供可独立测量传染效应和道德反作用的实验设计(如:用中介
    变量分析——测量惩罚概率估计的变化[传染路径]和道德愤怒的变化[反作用路径]);
    要么将证伪条件(c)降格为更保守的形式:"在随机对照实验中，控制组和实验组
    的违反规范行为无显著差异"(即回退到条件(a)的更强形式，放弃对"相对强度"
    的裁决要求)。

    5.【证伪条件(b)测试了下游应用而非核心机制——should】
    证伪条件(b):"系统性地清理环境中的'破窗'(如涂鸦、乱扔垃圾)后，该区域
    随后发生的严重犯罪率并未下降，甚至上升。"此条件测试的是破窗理论
    (broken windows theory)而非桥接砖的核心机制。破窗理论包含额外的环境-
    犯罪链条(无序→恐惧→社会控制退缩→严重犯罪)与桥接砖的规范传染机制
    (观察违规→惩罚概率估计降低→自身违规)不同。清窗实验的失败可能因为
    环境-犯罪链条中的其他环节断裂，而非规范传染机制不成立。

    修复方向:要么将证伪条件(b)替换为更直接测试核心机制的预测——如"在现场
    实验中，随机安排被试目睹他人违反规范X(未受罚)后，被试违反规范X的比率
    与不目睹组无差异";要么诚实标注条件(b)测试的是推论链条的下游环节而非
    核心机制本身。

    6.【反向失败模式的调节条件缺失——should】
    桥接砖的证伪条件(c)已注册了"道德反作用→更严格遵守规范"这一反向模式。
    但桥接砖未注册:(i)何时传染主导 vs 何时反作用主导的调节条件;(ii)观察
    违规后"强化遵守"的这个效应是否可能是桥接砖预测的反面——即:在什么条件
    下，观察他人违反规范未受罚，反而会【降低】自身违反规范的概率(而非升高)?
    已知的调节变量候选:群体认同(违规者是"外人"时可能强化遵守而非传染)、
    规范类型(描述性 vs 命令性规范的不同响应)、违规严重度(轻微违规传染，
    严重违规反弹)。

    反向失败模式不是抽象的"道德反作用存在"——而是具体指明:同一驱动量
    (观察未受惩罚的违规)在某些条件下产生与被预测方向【恰好相反】的观测
    结果(自身违规概率降低)。桥接砖应注册这些调节条件，使反向方向不仅
    "可被陈述"而且"可被精确检验"。

    综合裁决:两条 required(缺少 IEA + 排除条件无独立判据)均可通过定向修订
    修复——IEA 补全是流程性修复(已有多条桥接砖的先例)，排除条件操作化
    是方法论升级(将"排除区"从被动免疫转为主动预测)。四条 should 将命题
    从"过度声称"降回"证据支持的声称范围"——不损害核心直觉的有效性。

  red_flags:
    brick_is_conclusion:
      hit: false
      detail: |
        BR-L2-042 的核心机制(观察未受惩罚的违规→自身违规概率升高)不是
        bridges_to 中任何 L1 实体的重述:

        - CONCEPT-norm(规范):定义规范为共享的行为默契和违反后受制裁的预期，
        不涉及观察他人违规后的行为传染;
        - CONCEPT-conflict(冲突):定义冲突为双方直接较劲，与规范违反传染无关;
        - AXIOM-003(重复交互-规范涌现公理):说"反复打交道→形成共同的默契和
        规矩"，这是关于规范【形成】的命题，不是关于规范【违反传染】的命题。

        桥接砖确实运用了 AXIOM-003 的核心逻辑(观察行为→更新预期)，但往一个
        特定的、非平凡的经验方向做了延伸:不是"观察交互→形成预期"(axiom)，
        而是"观察未受惩罚的违规→预期惩罚概率降低→自身更可能违规"(bridge)。
        公理本身不预设观察方向——从同一交互中可以学到"这个规矩不能碰"
        (如果违规者被罚)也可以学到"这个规矩是纸老虎"(如果违规者没被罚)。
        桥接砖的贡献是断言:在未受惩罚的条件下，观察的主导方向是传染(增加违规)
        而非抑制(减少违规)——这是一个经验性的方向选择，超出了公理的逻辑范围。

        但必须诚实标注"薄"的一面:桥接砖的核心直觉(社会证明/破窗效应)是
        社会心理学中高度成熟的发现，其非平凡性更多体现在"整合进公理化体系"
        而非"发现新经验规律"。桥接砖在体系内的"桥接"功能是真实的——它把
        L1 的抽象行为预期更新机制(L1 不指定方向)接到了 L2 的具体方向性
        预测上(传染效应)。但这个"桥"本身较短——从"观察改变预期"到
        "观察未受罚的违规→预期变松→自身违规增加"只是一步经验性加注。

    empty_cell_tautology:
      hit: false
      detail: |
        桥接砖的 falsifiability 条件均为可观察的经验预测:
        (a) RCT 中暴露组 vs 控制组无差异或暴露组更低——可测;
        (b) 清理破窗后严重犯罪率未下降——可测;
        (c) 道德反作用在统计上强于传染——可测(尽管操作化有问题，见红旗6);
        (d) >50% 的跨文化/跨规范检验未复制——可测。

        这些是真正的经验预测——在逻辑上自洽的世界中均可能被观测到。命题
        不是同义反复——"观察违规→自身违规增加"这个方向性断言是可错的
        (反向方向——观察违规→强化遵守——同样逻辑自洽且在某些条件下
        实证存在)。

    measurement_axis_orthogonality:
      hit: false
      detail: |
        自变量(暴露于他人违规未受罚)与被观测量(自身违规行为)的测量轴
        是正交的——可以在 RCT 中独立操纵 IV(给实验组看违规未受罚的视频/
        安排实验组的实验环境有违规痕迹)并独立测量 DV(观察被试是否有违规
        行为)。Keizer et al. (2008) 的田野实验正是这样做的——实验组的环境
        被操纵(有无涂鸦/购物车乱放)、被试的行为被独立记录(是否偷窃信封/
        是否乱扔传单)。两个变量的测量链完全分叉。

        但存在一个 subtle 的机制层测量不正交:桥接砖声称的机制(贝叶斯更新
        对惩罚概率的估计+社会证明降低心理成本)均未被独立测量——它们是从
        行为结果中推断的。预测"违规增加"被 RCT 支持，但不能由此推断
        "机制必定是贝叶斯更新+社会证明"。这是一个机制层的测量缺口，不影响
        行为层面的预测可检验性——不触发本红旗(测量轴正交针对的是自变量
        和被观测量之间的独立性，而非被观测量和它的机制解释之间的独立性)。

        此机制层缺口放在 should_fixes 中处理(见 verdict_note 第 3 条)。

    scope_exclusion_independent:
      hit: true
      detail: |
        本红旗命中——桥接砖的排除条件"不适用于高度内化或与核心价值观绑定
        紧密的规范(如禁忌规范)"缺乏独立于传染效应结果的操作化判据。

        【核心问题:事后归类的 anti-talisman 风险】
        "高度内化"这一分类的前件是否可在不知道传染效应结果的情况下判定?
        当前桥接砖未提供任何操作化判据。这意味着:
        (a) 若某规范在实证检验中显示传染效应→被归入"非高度内化规范"√
        (b) 若某规范未显示传染效应→可被回溯性归入"高度内化规范"×
        路径(b)使排除条件成为 hidden talisman——任何反例都可以通过重新
        归类来免疫，使得命题实质上不可证伪。

        【什么是合格的独立判据】
        "高度内化"需要可事前测的分类器，不与传染效应本身共享测量:
        - 问卷调查法:Moral Foundations Questionnaire 中 purity/harm 维度
        得分(独立于行为传染)
        - 生理测量法:规范违反场景下的皮肤电/心率变化(测量情绪内化程度)
        - 行为代价法:匿名实验中个体为维护该规范愿意放弃的真实货币金额
        - 跨文化调查法:World Values Survey 中对该规范的"绝不可接受"
        回答比例

        这些判据的共同特征:可在不知道某个规范是否显示传染效应的情况下
        (事前)完成分类。桥接砖当前没有任何此类判据。

        【修复不仅是"补判据"更是"翻转方向"】
        当前排除条件是防御性的("如果不传染→因为内化了")。更好的设计是
        将排除条件转为主动预测:"本桥接砖预测——规范的内化程度(按上述独立
        判据测量)越低，传染效应越强(量效关系)。可以在同一研究中用多条
        规范构成内化梯度做组内检验。"这样"不传染"不再是被排除的反例，
        而是被预测的模式(高内化规范→效应弱→接近零)——命题的经验风险
        从"反例不存在"变成"量效关系不成立"。

        【排除 vs 免疫的边界】
        并不是说有排除条件就是 anti-talisman。合格的排除条件是:排除判据
        独立于被观测量、在见数据前锁死、不可在见反例后调整。本桥接砖的
        排除条件未满足这三条中的任何一条，故触发本红旗。标记为 required
        而非 should——因为如果没有独立判据，整个命题在"未显示传染效应的
        规范"面前是免疫的，这是一个核心缺陷。

    classification_granularity:
      hit: false
      detail: |
        桥接砖的核心变量(违规暴露/违规概率)均是连续量。排除条件的二分
        (内化 vs 非内化)存在过度简化风险——"内化程度"是连续谱系而非
        二分——但这已在红旗 4(scope_exclusion)中作为判据问题处理。
        桥接砖未对连续驱动量做不必要的离散化，本红旗不触发。

    anti_talisman:
      hit: true
      detail: |
        本红旗命中——排除条件的不可操作化(红旗 4)同时构成 anti-talisman
        问题。此外，证伪条件(c)的操作化缺口提供了第二层护身符风险。

        【falsifiability (a)的分析——可测但偏宽】
        "实验组违反规范的比率与对照组无显著差异或实验组反而更低"——形式上
        可操作。RCT 是黄金标准。但需注意:单个 RCT 的零结果可能有多种原因
        (样本量不足、操作强度不够、规范选择不当)。桥接砖未预注册什么算
        "足够有力的检验"(如:最小可检测效应量、样本量下限)。这使得零结果
        RCT 可被以"检验不够有力"为由 dismiss。建议补充:采纳 meta-analytic
        标准(≥5 个独立 RCT、总 N≥1000 的 meta 分析若 p>0.05 则视为证伪)。

        【falsifiability (b)的分析——测了下游而非核心】
        "清理破窗→严重犯罪率未下降"不是对核心机制的干净测试。破窗理论
        包含一个"环境无序→社会控制退缩→严重犯罪"的长因果链，桥接砖的
        规范传染机制只是其中一个环节。清理破窗实验的零结果可以被归因于
        因果链的其他环节断裂(如:清理了涂鸦但社区信任未恢复、居民仍不敢
        出门→社会控制仍低)，而不触及规范传染机制本身。这使得 falsifiability
        (b) 的否定结果不能干净地证伪桥接砖——它否定的是一个更大的、
        包含了桥接砖的理论包(broken windows theory)，而非桥接砖本身。

        修复:将 falsifiability (b) 聚焦于核心机制的直接检验——"在现场实验中，
        随机安排被试目睹他人违反某特定规范且未受惩罚(如:在实验室等候区
        看到'前一个被试'偷拿实验材料)，控制组不目睹，两组在后续机会中
        的违规率无差异。"

        【falsifiability (c)的分析——操作化不可行】
        "道德反作用在统计上强于传染效应"——此条件的核心操作化障碍是:
        (i) 传染效应和道德反作用是同时发生的两个潜在过程，只能观测净效应;
        (ii) 若净效应为零，无法区分是"两个效应都不存在"还是"两个效应
        同时存在且恰好互相抵消";(iii) 桥接砖未提供将净效应分解为两个独立
        分量的实验方案。

        这使得 bridges 可以通过声称"传染效应存在只是被抵消了"来免疫
        于零结果——又一个护身符层。

        【falsifiability (d)的分析——meta-level 兜底】
        "超过 50% 的检验未能复制"——这提供了多研究汇总的证伪通道，
        是一种好的 meta 层面安全网。但其证伪力取决于"复制"的定义:
        是基于统计显著性(有已知问题)还是基于效应量(需预注册阈值)?

        【综合:三层护身符叠加】
        (i) 排除条件可事后归类(红旗 4)——最严重，REQUIRED
        (ii) falsifiability (b) 测试了错误的目标——should
        (iii) falsifiability (c) 的净效应分解不可操作——should
        三层叠加使命题目前的防推翻机制过强——证伪路径多但每条都窄。
        不要求全部修复，但至少 required 层(红旗 4)必须修复。

    reality_anchor_fact_check:
      hit: false
      detail: |
        引用的实证文献核心事实核查:

        (1)【Keizer et al. (2008), Science——发表属实，但需注意复现争议】
        "The Spreading of Disorder" (Science, 322(5908), 1681-1685)。六个田野
        实验均发现:环境中存在可见 disorder(涂鸦、购物车乱放、违规停车、
        燃放烟花声)时，被试更可能违反其他规范(偷窃信封内 5 欧元、乱扔传单、
        进入禁止进入区域)。引用准确——这是"规范传染"最直接的实验证据。

        但需注意:2019 年 Wicherts 等的 large-scale replication 对 Keizer 的
        部分实验进行了复现尝试，结果混合——部分实验成功复现、部分未复现。
        桥接砖宜在 sources 中诚实标注"单个研究的效应量在复现中不完全稳定"，
        而非将 Keizer et al. 作为无争议的终结性证据。

        (2)【Cialdini et al. (1990), Journal of Personality and Social
        Psychology——发表属实】
        "A Focus Theory of Normative Conduct" 的经典现场实验:被试在干净(无垃圾)
        的环境 vs 有垃圾的环境中的乱扔垃圾行为。在干净环境中，看见他人(confederate)
        扔垃圾显著增加了被试的扔垃圾行为——描述性规范(人们在做什么)覆盖了
        命令性规范(应该做什么)。引用准确，是描述性规范信息效应的标准引用。

        (3)【Gino et al. (2009), Journal of Applied Psychology——发表属实】
        "Contagion and Differentiation in Unethical Behavior"。实验室实验发现:
        观察内群体成员不道德行为→自身不道德行为增加(contagion);观察外群体
        成员不道德行为→自身不道德行为减少(differentiation)。桥接砖的引用
        侧重 contagion 发现而忽略 differentiation 发现——这是选择性引用。
        Gino et al. 的完整发现是"内群→传染，外群→反而更遵守"——这构成了
        桥接砖反向失败模式的经验证据(见 counterexample_hunt)。

        (4)【Wilson & Kelling (1982), Atlantic Monthly——发表属实】
        破窗理论的原始宣言。这是一篇政策倡导文章(非同行评审研究)，但其
        核心直觉(无序→信号→更多无序和犯罪)已被后续研究(如 Keizer et al.)
        部分验证。引用属实但需注意其政策倡导性质——不应被当作终结性证据。

        (5)【Sampson & Raudenbush (1999), American Journal of Sociology——
        发表属实】
        "Systematic Social Observation of Public Spaces"——芝加哥社区研究。
        核心发现:集体效能(collective efficacy, 即社会凝聚力和非正式社会控制
        的意愿)对犯罪率的预测力远强于 disorder 本身;disorder 与犯罪率的关系
        在控制了集体效能后大幅减弱。这篇论文实际上【削弱】了简单的破窗理论——它
        表明 disorder 本身可能不是原因，而是低集体效能的结果和表征。

        桥接砖将 Sampson & Raudenbush (1999) 列为 support 有过度解读之嫌——
        该研究的核心信息是"集体效能比 disorder 更重要"，而非"disorder 的
        传染效应得到证实"。桥接砖应诚实标注该研究对破窗理论的批评性立场。

        (6)【Weisburd et al. (2011), Journal of Quantitative Criminology——
        发表属实】
        犯罪热点(hot spots)的准实验研究。发现严格执法减少 disorder 后犯罪率
        下降——这与破窗理论的核心预测一致。但 Weisburd 本人的解释更侧重
        "增加了惩罚确定性"而非"移除了传染信号"——即:执法干预同时改变了
        客观的惩罚概率(更多人被逮捕)和主观的惩罚感知(人们看到警察)。
        桥接砖的"传染→惩罚概率估计降低"机制与 Weisburd 的"执法→惩罚概率
        上升"机制在逻辑上是互补的(同一通道的正反方向)，但桥接砖宜区分
        "传染效应"(因观察到违规)和"威慑效应"(因观察到惩罚)。

        综合:引用文献真实存在，核心结论方向不假。但存在三处需要诚实标注:
        (i) Keizer et al. 的复现不完全稳定;(ii) Gino et al. 的发现同时包含
        传染和外群体区别效应(后者是桥接砖的反向模式);(iii) Sampson &
        Raudenbush (1999) 的主要立场是批评而非支持破窗理论。这些不影响
        引用的基本真实性，但影响引用的解释精度——列为 should 级诚实标注。

    definition_vs_prediction:
      hit: false
      detail: |
        "观察违规未受罚→自身违规概率升高"是一个可证伪的经验预测——不是
        定义。"观察违规未受罚"和"自身违规概率升高"在逻辑上是可分离的
        (可以用实验操纵前者并独立测量后者)，两者之间的关系是因果性的、
        可推翻的。证伪条件(a)-(d)都描述了逻辑自洽的可能世界(在这些世界中
        此预测不成立)——说明预测不是必然为真的定义。

        但有一个 nuance:桥接砖的机制描述("贝叶斯更新对惩罚概率的估计")
        在某种意义上接近定义性陈述——如果我们将"理性主体"定义为贝叶斯
        更新者，那么"观察到违规未受罚→惩罚概率估计降低"几乎是一个定义
        性推论。但桥接砖不仅做了这个定义性推论——它进一步断言了这一认知
        更新会转化为行为改变(自身违规增加)且此效应在"描述性规范"层面
        足以压倒"命令性规范"的抑制效应——这后一步是经验性跳跃。命题整体
        上不是定义性真理。

    enumeration_exhaustiveness:
      hit: false
      detail: |
        桥接砖未声称对规范违反传播的所有机制做穷尽枚举——statement 中明确
        说"本效应不声称规范被完全消除，仅改变违反概率"。它识别了两个可能
        机制(贝叶斯更新+社会证明)但未声称这是穷尽的列表。不触发本红旗。

    primary_suspect_accuracy:
      hit: false
      detail: |
        L2 桥接砖无 formal primary_suspect 字段(L3 要求)，按红旗精神审查最弱腿:

        外部分析识别的最致命软肋(桥接砖未自认):
        (i)【排除条件的 anti-talisman——最致命】缺乏独立于传染结果的"高度
        内化"判据，使命题在面对不显示传染效应的规范时免疫。见 required_fixes #2。
        (ii)【IEA 缺失——流程性致命】无 cross_verification 无法进 verified
        或 weakly_verified。见 required_fixes #1。
        (iii)【punishability 的操作化模糊——中层脆弱】"未受罚"的定义不清:
        什么算惩罚?正式制裁(罚款/逮捕)?非正式制裁(白眼/排斥/批评)?
        如果非正式制裁也算"惩罚"，那么在大多数真实社会场景中，规范违反
        几乎不可能"未受罚"(总有人会给白眼的)——桥接砖的实证域被压缩到
        完全匿名的设置。如果只有正式制裁才算"惩罚"，那么桥接砖在非正式
        制裁强的社会(如日本)的预测力较强，在非正式制裁弱的社会(如某些
        匿名大都市)的预测力较弱——但桥接砖未注册这一区分。
        (iv)【Gino et al. (2009) 的"外群→反而遵守"发现——潜在的第二
        反向模式】桥接砖引用了 Gino et al. 的 contagion 发现，但忽略了
        同研究中的 differentiation 发现(观察外群体成员违反道德规范→自身
        更遵守)。这不是"道德反作用"(那是条件(c)已经覆盖的)——而是一个
        不同的调节变量:违规者的群体身份。桥接砖应将"违规者是内群还是外群"
        注册为调节方向的条件。

    caliber_registration:
      hit: true
      detail: |
        本红旗命中——桥接砖的关键测量口径未预注册。

        (1)【"未受罚"的定义口径未注册——REQUIRED】
        桥接砖的核心自变量是"观察他人违反规范且未受惩罚"。但"未受惩罚"
        从未被操作化定义:
        - "惩罚"是否包括非正式制裁(白眼、排斥、闲话)?还是仅限正式制裁
        (罚款、逮捕、开除)?
        - "未受罚"的时间窗口是多久?观察违规后 5 分钟内无惩罚?一天内?
        一周内?永远?
        - 如果违规者在事后(被试离开后)受到了惩罚，被试观察到的仍是
        "违规未被罚"——桥接砖的传染效应是否取决于被试的【观察时刻】
        有无惩罚，还是取决于被试对【惩罚的存在】的信念(无论是否正确)?

        这些口径选择直接影响什么算"暴露于违规未罚"和什么算"暴露于违规
        已罚"——进而直接影响检验结果。按 L4-009 判例精神:若在反例出现后
        桥接砖试图通过重新定义"惩罚"的口径来救命题(如"我们说的惩罚是
        正式制裁，不包括白眼")，此调整一律按不利方向裁决。

        缺口特别尖锐的场景:在田野实验中(如 Keizer et al.)，被试看到
        涂鸦/购物车乱放——这是"规范已被违反"的信号还是"违规者未受罚"
        的信号?涂鸦的存在告诉你有人违反了规范(涂鸦本身是违规)，但这
        个人是否被抓了?不知道。购物车被乱放——放置者是否被(口头)制止了?
        不知道。被试从环境 disorder 信号中推断的是"有人违规"还是"违规
        未被罚"?这二者的信息内容不同，桥接砖在机制层面(需要"未被罚"来
        降低惩罚概率估计)和实证层面(田野实验操纵的是 disorder 痕迹而非
        惩罚的可观测缺失)之间存在不对应。

        修复方向:在 statement 或 falsifiability 中注册:
        (i) "惩罚"的操作化定义(包括/不包括非正式制裁);
        (ii) "未受罚"的观察时间窗口;
        (iii) 在田野/现场实验中，"环境 disorder 痕迹"作为 IV 所携带的
        信息(是"违规发生"还是"违规未被罚")的诚实标注。

        (2)【falsifiability (d) 的"复制"口径未注册——should】
        "超过 50% 的检验未能复制出显著正向效应"——何谓"未能复制"?
        基于 p>0.05?基于效应量的 95% CI 包含零?基于 Bayes Factor < 1/3?
        何谓"显著正向效应"?p<0.05 单侧?d>0.2?不同的口径可能导致不同的
        >50% 判定。

        (3)【falsifiability (c) 的"强于"口径未注册——should】
        "道德反作用在统计上强于传染效应"——何谓"强于"?效应量更大?
        统计显著性更高?两者同时显著但净效应为负?这些都是不同的、会导致
        不同判定的口径。

        修复:至少注册 falsifiability (d) 的"复制"和"显著正向"的口径定义。

    data_source_common_root:
      hit: false
      detail: |
        桥接砖引用的全部经验证据来自学术文献(社会心理学田野实验+
        犯罪行为学观察研究+实验室行为实验)，不涉及宏观经济统计指标
        (如 WB/IMF/CNBS 的 GDP 数据)。不触发 data_source_origin 折扣。

        两个引用学科(behavioral_economics + criminology)在测量链层面
        是独立的——前者主要靠随机田野实验(操纵 disorder→观察行为)，
        后者主要靠纵向观察数据和准实验(清理干预→犯罪率变化)。两源
        的底层数据生成过程不同，不存在"同一份底层数据被不同机构
        repackage 发布"的情况。

    api_pretending_independence:
      hit: false
      detail: |
        桥接砖当前无 cross_verification 节，故不存在 IEA 投票。
        未来补全 IEA 时需注意:跨学科投票(行为经济学 vs 犯罪学)是
        学科层面的独立性判断，应使用 independence-model.yaml 的
        source_pairs 独立系数。不触发"API 可及性冒充独立性"红旗——
        因为桥接砖完全没有 IEA 结构，不存在"通过 API 查询同一数据
        多次"的情况。

    reverse_failure_mode:
      hit: true
      detail: |
        本红旗命中——桥接砖仅注册了证伪条件(c)("道德反作用→更严格
        遵守规范")作为单一反向模式，但遗漏了至少两条重要的反向失败路径。

        (1)【外群体违规→自身强化遵守——Gino et al. (2009) 的 differentiation
        效应——未注册】
        Gino et al. (2009) 的核心发现:观察内群体成员违反道德规范→自身
        违反增加(contagion);观察外群体成员违反同一规范→自身违反【减少】
        (differentiation)。桥接砖引用了该研究的 contagion 发现但完全忽略
        了 differentiation 发现。differentiation 不是"道德反作用"——
        它不是因为看到了不道德行为而愤怒，而是因为"那是【他们】做的事，
        【我们】不做"——一个社会身份的边界效应。

        此反向模式的预测方向与桥接砖的正向预测恰好相反:观察违规→自身
        违规概率【降低】。机制不同(群体身份→行为分化)而非机制相同
        (传染)。要求桥接砖注册:"当违规者被观察者编码为外群体成员时，
        本命题的传染方向可能被反转——观察违规反而降低自身违规概率。
        本命题当前版本仅针对违规者为内群体或无群体信息标识的情境。"

        (2)【观察违规→规范显著性提升→强化遵守——未注册】
        在某些条件下，观察违规行为可能使规范本身变得更加"显眼"
        (salient)——当人们看到有人违反了一个他们平时不太在意的规范时，
        可能反而意识到"原来这条规矩这么重要，我不能犯同样的错"。这与
        "道德反作用"不同:不是出于愤怒/惩戒欲望，而是源于对规范本身的
        认知重构("看到别人做错→意识到什么是对的")。这是"违反作为
        教育手段"的反向路径——在某些安全培训、合规教育中，展示违规
        案例恰恰是为了【强化】规范意识(而非引发传染)。

        (3)【观察历史违规→惩罚预期反而升高——未注册】
        在组织管理领域，某部门出现违规丑闻后，即使该丑闻中的违规者暂
        未被惩罚(在调查中)，同组织其他成员常常会【主动收敛】自身行为——
        因为他们预期即将到来的"秋后算账"或"严打"。这与桥接砖的核心
        机制(观察违规未受罚→惩罚概率估计降低)方向相反——人们看到违规
        未(立即)受罚，但预期惩罚概率【升高】(因为"上面肯定要查了")。

        红旗触发级别:should(非 required)。理由:Gino et al. 的外群体
        differentiation 效应是已发表的实证证据，方向与桥接砖的核心预测
        相反——桥接砖应注册它并限定自己的射程。第(2)(3)条是逻辑推导
        的反向路径，为命题提供更精确的边界。这些反向模式的存在不推翻
        命题(在内群体/无身份标识+普通规范+轻度违规条件下，传染效应
        仍是真实方向)，但要求桥接砖诚实地限定自己的射程边界——当前
        版本的射程(所有规范违反传染)过于宽泛。

    bootstrap_limitation:
      hit: false
      detail: |
        Bootstrap 限定(新技术介导社会形态的冷启动 vs 稳态阶段的区分)
        是 DED-039 判例的红旗，针对涉及新技术(如 AI 代码协调/算法治理)
        的命题。本桥接砖涉及的社会心理学机制(规范传染)不依赖新技术，
        不触发此红旗。

    verification_object_existence:
      hit: false
      detail: |
        桥接砖的验证对象——随机对照实验(操纵暴露于违规未罚、测量后续
        违规行为)——在当前的社科研究生态中广泛存在且已被多次执行。
        Keizer et al. (2008) 是田野实验的基准，Cialdini et al. (1990)
        是现场实验的基准，Gino et al. (2009) 是实验室实验的基准。
        验证对象不仅"存在"，而且"已被多次实现"——不触发本红旗。

        但需注意:上述实验大多数是在 WEIRD(Western, Educated,
        Industrialized, Rich, Democratic)群体中执行的。桥接砖声称的
        是跨文化普适的机制(从 falsifiability (d) 的"跨文化"要求可见)
        ——若 WEIRD 外的证据稀缺，应将此诚实标注为"当前证据以 WEIRD
        群体为主，跨文化适用性尚待验证"(should 级诚实标注)。

  iea_independence_check:
    cross_verification_present: false
    note: |
      桥接砖 YAML 当前不含 cross_verification 节。无 IEA 分数。
      L2 verified 门槛为 IEA ≥ 1.8，weakly_verified 下限为 IEA ≥ 1.2。
      必须补上 cross_verification 才能进入任一已验证状态。

      桥接砖引用了两个学科来源:
      - behavioral_economics: Keizer et al. (2008), Cialdini et al. (1990),
        Gino et al. (2009) 的规范传染/社会规范效应实验
      - criminology: Wilson & Kelling (1982), Sampson & Raudenbush (1999),
        Weisburd et al. (2011) 的破窗理论/犯罪学证据

      初步 IEA 结构建议:
      - 锚源: behavioral_economics (weight 1.0)——包含最直接的因果实验证据
      - 独立票: criminology (weight × 独立系数)

      两源独立性挑战:
      (i) criminology 的破窗理论(Wilson & Kelling 1982)的核心逻辑直接借鉴了
      社会心理学中关于无序→行为信号的洞见——两源的"规范传染"直觉不来自
      两条独立进化的研究传统，而是共享同一个思想谱系。criminology 源的
      "agree"票应因此打折——建议独立系数取 0.4-0.5(低于默认 0.6)。
      (ii) 按 independence-model.yaml 的 instrument_correlation discount_rule:
      若 cross_verification 由单一 LLM 执行，必须披露"仪器有效独立性低于
      学科独立性上限"。本命题的"规范传染/破窗效应"直觉在 LLM 训练语料中
      高度饱和(是社会心理学教科书的标准章节)，单 LLM 对多源"agree"的判定
      可能反映语料中的共识而非独立的跨学科验证——应按 mitigation 条款将
      仪器折扣视为承重红旗。
      (iii) Sampson & Raudenbush (1999) 若被计为 criminology 源的"支持票"，
      是不诚实的——该研究的主要立场是质疑而非支持破窗理论。cross_verification
      应诚实区分"此源同意的是'规范传染直觉合理'"还是"此源发现的是'无序
      预测犯罪'"(前者支持命题的 plausibility，后者支持命题的核心预测)。

      若 IEA < 1.8 但 ≥ 1.2，桥接砖可取 weakly_verified 状态;
      若 IEA < 1.2，桥接砖在当前证据生态下不应进入任何已验证状态。
      按上述分析，保守估计 behavioral_economics(1.0) + criminology(0.4-0.5)
      的 IEA ≈ 1.4-1.5——足够 weakly_verified，但达不到 verified。

    instrument_honesty:
      disclosed: false
      assessment: |
        桥接砖当前无 instrument_disclosure 字段——因为尚无 cross_verification。
        未来补全 IEA 时必须包含 instrument_disclosure，引用 META-REVIEW-001
        的 instrument_correlation discount_rule。

    no_data_source_common_root:
      applicable: true
      detail: |
        不触发 data_source_origin 折扣——引用的全部是学术文献中的行为
        实验/观察数据，而非宏观经济统计指标(WB/IMF/CNBS 的 GDP 等)。
        两源(behavioral_economics 田野实验 + criminology 观察研究)在
        测量链层面完全独立分叉。

  counterexample_hunt:
    methodology: |
      四个反例方向:(1)大规模规范违反曝光→反而强化遵守(挑战传染方向);
      (2)强社会控制社会的"违规→道德反弹"模式(挑战"未受罚→传染"机制);
      (3)观察外群体违规→自身遵守强化(挑战方向普适性——未被现有排除条件覆盖);
      (4)"未受罚"定义模糊导致的田野证据-机制不对应(挑战核心操作性)。
      以历史案例+已发表实证文献+逻辑分析为主要手段。

    cases:
    - direction: "Enron/WorldCom 丑闻后合规繁荣——大规模违规曝光→反而强化遵守"
      description: |
        Enron (2001) 和 WorldCom (2002) 的财务造假丑闻被大规模曝光时，
        社会公众观察到的是:大量企业和高管在过去多年里系统性违反会计规范
        【且长期未被发现/惩罚】。按桥接砖的核心机制(观察违规未受罚→
        降低惩罚概率估计→自身违规增加)，其他企业和会计师应该推断出
        "做假账被发现和惩罚的概率很低"→然后自己也做假账。但实际发生的
        恰恰相反:丑闻后企业合规投入急剧增加、Sarbanes-Oxley 法案获得
        企业界广泛(尽管不情愿)的遵守、会计行业自律标准大幅提高、内部
        举报机制被强化。大规模、长期未受惩罚的规范违反的曝光，反而导致了
        合规【繁荣】而非传染。
      counter_impact: "被部分消化——非净杀"
      analysis: |
        桥接砖的反驳路径:(i)丑闻曝光改变了客观的惩罚概率——SOX 法案
        大幅提高了违规惩罚(刑事责任、高额罚款、CEO/CFO 个人认证义务)，
        使"未受罚→惩罚概率低"的推断被截断;(ii)丑闻本身传递了"开始有人
        管了"的信号，实际的"惩罚概率估计"在丑闻后是升高的而非降低的。

        这两条反驳在实证上合理:Enron 丑闻后确实出台了 SOX(惩罚概率客观
        上升)，且丑闻的曝光本身标志了"这个违规现在被发现了"=惩罚概率
        的象征性转变。因此这不是桥接砖被干净推翻的案例——桥接砖的机制
        (惩罚概率估计→行为)在方向上仍然自洽。

        但案例揭示了一个桥接砖未注册的时间动态:大规模违规的曝光不仅是
        "观察到违规未受罚"——它同时传递了"这个系统有漏洞但现在被发现了/
        即将被整改"的信号。这两个信号的方向相反(前者→传染，后者→抑制)，
        桥接砖只注册并预测了前者。对于"曝光"类事件，哪一个信号主导?
        桥接砖需要限定:本命题适用于日常/低可见度的违规观察，而非
        "大规模丑闻曝光"式的高可见度+舆论反应事件。

    - direction: "日本公共空间的'违规→旁观者介入→规范强化'模式"
      description: |
        在日本等强非正式社会控制社会中，在公共场所观察到违规行为
        (如插队、乱扔垃圾、在禁烟区吸烟)的典型反应不是"既然他做了
        我也做"(传染)，而是:(a)旁观者用目光、叹息、或直接提醒表达
        不满(非正式制裁);(b)观察者自身更加注意不犯同样错误(强化遵守);
        (c)社区层面的规范讨论被触发("最近越来越多人不守规矩了")。
        这一模式的最强形式:观察违规→社会制裁(即使是微弱的)→观察者
        习得的是"这个规矩有人管"→惩罚概率估计升高→自身违规减少。
        方向与桥接砖的正向预测相反。
      counter_impact: "揭出过度伸张——操作化缺陷而非净杀"
      analysis: |
        桥接砖的核心反驳:在日本这种场景中，违规并非"未受罚"——旁观者
        的叹息、目光、提醒都是非正式制裁，属于"惩罚"。因此该场景不在
        桥接砖的射程内(桥接砖要求的条件是"违规且未受罚")。

        但此反驳暴露了桥接砖当前最致命的操作化缺口(同时在 caliber_registration
        红旗中标记):什么算"惩罚"?什么算"未受罚"?
        - 如果非正式制裁(白眼/叹息)算"惩罚"，那么绝大多数真实社会场景中，
        违规几乎不可能完全"未受罚"——总有人会给白眼/摇头/拍照发朋友圈。
        桥接砖的实证域被压缩到高度匿名化的设定(空无一人的街道、完全陌生
        的实验环境)。这不是理论上的问题——Keizer et al. 的田野实验正是在
        这种匿名化设定下进行的。但桥接砖 statement 的措辞("当看到别人
        违反规范却没受罚时")暗示了一个更广的域——而实际上，在大多数日常
        真实场景中，"违规未受罚"这一前件本身的存在性是稀缺的。
        - 如果非正式制裁不算"惩罚"，那么日本这类社会就是桥接砖的核心
        检验场——而日本的反例(观察违规→强化遵守)可能干净地推翻桥接砖。

        此案例不是净杀(因为桥接砖可通过"非正式制裁=惩罚"的解读将日本
        社会排除)，但它揭示的核心问题是:桥接砖的口径选择("什么是惩罚")
        是承重的——选窄口径(仅正式制裁)则命题可证伪(有日本这种检验场)
        但可能被推翻;选宽口径(含非正式制裁)则命题更安全但实证域极度
        狭窄、近乎空集。这是一个"射程 vs 证伪风险"的经典 trade-off，
        桥接砖应在口径注册时诚实面对而非回避。

    - direction: "Gino et al. (2009) 的外群体 differentiation 效应——
    观察外群体违规反而强化自身遵守"
      description: |
        Gino et al. (2009, Study 2 和 Study 3) 的核心发现:当被试观察到
        外群体成员(另一所大学的学生)在实验中作弊后，被试自身的作弊率
        显著低于控制组——即 seeing outgroup members behave unethically
        led to LESS unethical behavior, not more。这一方向与桥接砖的
        "观察违规→自身违规增加"预测恰好相反。此效应在 Gino et al.
        中被稳健复现(两个 studies)，效应量为中等(d≈0.5)。
      counter_impact: "揭出过度伸张——方向性射程未限定"
      analysis: |
        此案例是已发表的、符合学术标准的干净实证证据——具备随机分组、
        控制组、独立操作化和独立测量。它的预测方向与桥接砖的 core
        statement 相反，不是"contagion 弱于 moral backlash"(那是
        falsifiability (c)覆盖的)而是"观察违规→自身违规减少"——
        该反向不由道德愤怒(反作用)驱动，而由"那不是我们做的事"这一
        社会身份机制驱动。

        桥接砖的反驳路径:

        (i)【"外群体违规不算观察违规"——不成立】
        不能说"外群体成员的行为不算规范违反"——规范是共享的，跟内群/
        外群无关。同一条规范(如考试不作弊)对所有人适用，不会因为违反者
        是外群就不算违规。

        (ii)【"外群体违规的传染效应被社会身份效应覆盖"——成立但需要注册】
        桥接砖可将此推给"其他机制覆盖"——即传染效应确实存在(机制层面)，
        只是被一个更强的 opposite-effect 机制(社会身份→行为区分)覆盖了。
        这是合法的理论反驳，但要求桥接砖诚实地注册:"本命题的传染效应
        假设违规者不被观察者编码为'外群体'——当违规者被编码为外群体时，
        社会身份驱动的 differentiation 效应可能覆盖传染效应。"

        (iii)【"Gino et al. 的实验是 lab 不是 field"——不成立】
        桥接砖自己的适用证据中包含了 Gino et al. 的实验室实验(用于支持
        contagion)。不能用同一个来源的 contagion 发现当证据却把同一来源
        的 differentiation 发现当无效。

        此案例不净杀(桥接砖可注册外群体限定来消化它)，但揭示了桥接砖
        当前版本的射程过于宽泛——未区分违规者的群体身份这一关键调节变量。

    - direction: "中国的'红黑榜'——公开违规名单反而强化了规范遵守"
      description: |
        社会信用体系中的"红黑榜"制度:将违规者(失信被执行人、逃税者等)
        的名单公开张贴/发布。从桥接砖的视角看，这些公开名单是在向群众
        展示"很多人违反了规范"——如果传染效应成立，观众应该推断"这么多
        人违规都没事(被上榜不算'实质惩罚'吧?)"→然后自己更可能违规。
        但实际效果(至少在制度设计意图上)是相反的:公开违规者是为了威慑
        (让大家看到"违规会被公开羞辱")，群众解读的是"违规代价很高"→
        自身违规减少。这种"公开违规反而减少违规"的模式在全球范围内广泛
        使用——美国的 sex offender registry、税务部门的逃税者公示等。
      counter_impact: "被消化——非净杀"
      analysis: |
        桥接砖可以轻松消化此案例:"红黑榜"中的违规者受到的公开羞辱
        本身就是惩罚——因此这不是"违规未受罚"，而是"违规+受罚"。
        被观察者学到的是"违规会被惩罚"(强化遵守)而非"违规不会被罚"
        (传染)。这与桥接砖的机制完全一致——实际上恰好证明桥接砖的
        逻辑(观察到惩罚→惩罚概率高→自身减少违规)的另一面是正确的。

        这个案例虽然没有攻击桥接砖的核心机制，但它揭示了一位反方向:
        违规的【公开】并不必然意味着违规【未受罚】——信息的"违规存在"
        信号和"惩罚存在"信号的包装方式(红黑榜 vs 破窗)决定了观察者
        学到的是传染还是抑制。桥接砖应将此信号区分显式注册。

    overall_counterexample_verdict: |
      四方向上未获净杀反例——没有找到同时满足以下全部条件的案例:
      (i) 属于桥接砖声称的域内(非"高度内化"规范);
      (ii) 违规者被观察者编码为无明显群体身份标识的普通人(非外群);
      (iii) 违规确实未受任何形式的惩罚(含非正式制裁);
      (iv) 观察者自身违规概率显著降低而非升高;
      (v) 此效应在多个研究中独立复现。

      但反例猎捕的核心贡献是识别了三处桥接砖的过度伸张:
      (1)【方向未经群体身份调制】Gino et al. (2009) 的外群体 differentiation
      效应是已发表的干净反例——桥接砖必须注册"外群体"限定;
      (2)【"未受罚"的操作化模糊使射程无限可调】日本社会案例揭示了
      桥接砖当前最致命的操作化漏洞——"什么是惩罚"是承重的，选窄口径
      就面临日本这类检验场的反例风险，选宽口径就面临"实证域近乎空集"
      的 triviality 风险;
      (3)【"被动观察"vs"主动曝光"的时机效应未注册】Enron 案例揭示了
      日常违规观察和大规模丑闻曝光的时间动态差异——前者是"我看到有人
      做了不守规矩的事没被当场抓住"，后者是"新闻告诉我很多人多年做了
      不守规矩的事但系统终于发现了"。

  non_recurrence:
    - check: DED-004
      status: pass
      detail: |
        DED-004 的死因是不可证伪循环(命题的核心主张无法被任何经验观测拒绝)。
        本桥接砖的证伪条件在概念上清晰——逻辑上可能观测到"RCT 中暴露组
        和控制组无差异或暴露组违规反而更少"(falsifiability (a))。命题
        本身是可错的(falsifiable in principle)，不像 DED-004 那样结构性地
        免疫于所有经验观测。

    - check: DED-007
      status: pass
      detail: |
        DED-007 的死因是测量轴焊死(分母偷用结果——用"实际获授者"定义
        授信对象，闭环)。本桥接砖不存在此级别的结构死罪——自变量
        (暴露于违规未受罚)不由因变量(自身违规行为)定义，两变量在概念上
        是独立的且可独立操纵/测量。Keizer et al. (2008) 的实验设计已经
        验证了这一点:环境 disorder(IV)由实验者操纵，违规行为(DV)由
        独立观察者记录。测量轴未焊死。

  required_fixes:
    - id: REQ-BR-L2-042-A
      severity: required
      what: |
        补充 cross_verification 节——进行正式的 IEA 独立来源加权投票。

        结构要求:
        (i) 列出所有来源的 vote(agree/disagree/partial, with rationale)
        (ii) 应用 independence-model.yaml 的 source_pairs 独立系数计算 IEA
        (iii) 包含 instrument_disclosure——引用 META-REVIEW-001 的
        instrument_correlation discount_rule，诚实标注"本次投票由单一
        LLM 执行，有效独立性低于报告的学科独立性上限"
        (iv) 诚实区分 criminology 源的贡献:若 Sampson & Raudenbush (1999)
        被引用，其学术立场是质疑破窗理论(而非支持)，应在 IEA 投票中
        如实反映而非计为 agree;
        (v) 计算有效 IEA，与 verified 门槛(1.8) 和 weakly_verified 下限
        (1.2) 对照。保守估计 IEA ≈ 1.4-1.5(足够 weakly_verified 但
        达不到 verified)。

        若 IEA ≥ 1.2 但 < 1.8，桥接砖应取 weakly_verified(而非 verified)，
        并诚实标注"第二源与锚源的独立性有限(共享破窗/规范传染思想谱系)"
        作为信息。
      rationale: |
        L2 桥接砖的验证必须通过 IEA 加权投票。当前无 cross_verification，
        桥接砖无法进入任何已验证状态——这是流程性 required 缺陷。

    - id: REQ-BR-L2-042-B
      severity: required
      what: |
        将"高度内化或与核心价值观绑定紧密的规范"这一排除条件从被动免疫
        转为主动预测，并锁定独立操作化判据。

        具体修复:
        (i)【锁定独立判据】在见任何反例前，预注册"高度内化规范"的独立
        操作化标准。候选方案(至少选一):
        - 问卷调查法:Moral Foundations Questionnaire (MFQ) 的 purity/sanctity
        和 harm/care 维度得分 > 总体均值+1SD(独立于行为测量);
        - 行为代价法:在匿名经济游戏中，个体为维护该规范自愿放弃的真实
        货币金额 > 中位数;
        - 跨文化共识法:World Values Survey / Hofstede 数据中，该规范违反
        被视为"绝不可接受"的跨文化平均比例 > 80%。

        (ii)【翻转排除方向——从被动免疫到主动预测】将 statement 中
        "不适用于高度内化规范" 替换为:
        "本桥接砖预测规范的内化程度(按上述判据独立测量)与传染效应量
        之间呈负相关:内化程度越低的规范，传染效应越强;内化程度最高的
        规范(如禁忌类)，传染效应趋近于零。这意味着:(a)对低内化规范，
        falsifiability (a)-(d) 均适用;(b)对高内化规范，本桥接砖的预测
        本身就是'零效应'——若某高内化规范显示强传染效应，同样构成
        对本命题的挑战(因负相关预测被破)。"
        这样:无论高内化还是低内化规范，桥接砖都面临经验风险——
        低内化→应传染(不传染则否证)，高内化→应不传染(传染则否证)。
        消除了"不传染就归入高内化"的免疫通道。

        (iii)【诚实标注当前排除的模糊性】在未来补上判据前，在 statement
        或 sources 中标注:"当前版本中'高度内化规范'的排除条件缺乏独立
        操作化判据，此缺陷将在下一轮修订中修复。在此期间，对此排除条件
        的解释应保守——不能用于事后 dismiss 反例。"
      rationale: |
        当前排除条件可被用于事后 dismiss 任何不显示传染效应的规范——
        缺乏独立判据使排除区成为 anti-talisman 护身符。修复后桥接砖
        在所有规范类型上(高内化+低内化均有预测)都面临经验风险——
        这才是真正的 falsifiable。

  should_fixes:
    - id: SHOULD-BR-L2-042-C
      severity: should
      what: |
        将 statement 中的机制声称从"核心机制是贝叶斯更新+社会证明"降格
        为"可能机制路径包括贝叶斯更新和社会证明"。当前版本用"核心机制"
        这一措辞暗示了因果证据的排他性——但引用的实证文献仅测量了行为
        改变，未独立测量这两种机制。替代机制(简单模仿、注意力转移、
        理性搭便车)与相同的行为证据集合兼容。修正后的 statement 应聚焦于
        行为层面的规律("观察违规未受罚→自身违规概率升高")，并将机制
        讨论放到独立的"讨论/机制假说"段落。

    - id: SHOULD-BR-L2-042-D
      severity: should
      what: |
        诚实处理 Gino et al. (2009) 的完整发现——不仅引用其 contagion
        发现支持桥接砖，也注册其 differentiation 发现(外群违规→自身
        更遵守)作为反向失败模式。具体修正:
        (i) 在 applicable_sources 的 behavioral_economics rationale 中
        追加:"Gino et al. (2009) 同时发现:观察外群体成员违反道德规范
        会降低自身违规概率(differentiation 效应)——这与本桥接砖的
        contagion 预测方向相反，提示违规者的群体身份是调节传染方向
        的关键变量。"
        (ii) 在 statement 或 domain 中追加限定:"本命题的传染效应假设
        违规者不被观察者编码为显式外群体成员;当违规者被编码为外群体时，
        社会身份驱动的 differentiation 效应可能覆盖传染效应。"
        (iii) 在 falsifiability 中新增一条:"(e)若系统性研究表明，
        即使违规者为内群体或无群体标识，观察违规未受罚仍系统性地降低
        自身违规概率，则桥接砖的核心方向性主张被挑战。"

    - id: SHOULD-BR-L2-042-E
      severity: should
      what: |
        注册"惩罚"的操作化定义。当前 statement 和 falsifiability 均使用
        "未受惩罚"但从未定义"惩罚"的边界。具体注册:
        (i) "惩罚"是否包含非正式制裁——旁观者的目光/叹气/口头提醒/
        社交排斥/拍照?
        (ii) 若包含非正式制裁:(a)桥接砖的实证域被限定为"完全匿名化场景"
        (无旁观者或旁观者无任何反应)——应显式标注;(b)当前引用的田野实验
        (Keizer et al.) 中，环境 disorder 痕迹(涂鸦/购物车)是否传达了
        "违规未受罚"(vs 仅"违规发生")的信息——应诚实分析。
        (iii) 若不包含非正式制裁:则为日本等强非正式社会控制社会中的
        反例(观察违规→强化遵守)敞开了验证通道——应列为可检验预测。

    - id: SHOULD-BR-L2-042-F
      severity: should
      what: |
        还原 Sampson & Raudenbush (1999) 的真实学术立场。该研究的核心发现
        是集体效能(collective efficacy)比 disorder 更能预测犯罪率，且
        disorder 与犯罪的关系在控制了集体效能后大幅减弱。这是对简单破窗
        理论的【批评】而非支持。当前桥接砖引用此文为 support 有选择性
        引用之嫌。应将适用说明修改为诚实标注:"Sampson & Raudenbush (1999)
        发现 disorder 与犯罪的关系受集体效能调节——其立场是对破窗理论
        的部分质疑而非无条件支持。这一发现提示:规范违反的传染效应可能
        被社区的社会凝聚力缓冲或阻断。"

    - id: SHOULD-BR-L2-042-G
      severity: should
      what: |
        将 falsifiability (b) 替换为更直接测试核心机制的预测。当前条件
        (b)("清理破窗→严重犯罪未下降")测试的是包含了桥接砖在内的
        大理论包(broken windows theory)的下游预测，其失败不能干净地
        归因于桥接砖本身的错误。替换方案:
        "在现场/田野实验中，随机安排被试目睹他人违反某规范 X 且未受
        当场惩罚(对照组不目睹)，被试在后续独立观察期中违反规范 X 的
        比率与对照组无显著差异，或实验组显著更低。"

    - id: SHOULD-BR-L2-042-H
      severity: should
      what: |
        诚实标注当前证据的 WEIRD 局限性。Keizer et al. (2008)、
        Cialdini et al. (1990)、Gino et al. (2009) 的核心实验均在
        WEIRD(Western, Educated, Industrialized, Rich, Democratic)
        人群中执行。桥接砖声称的跨文化普适性(从 falsifiability (d)
        的"跨文化"要求可见)在当前证据生态下尚未获得充分的非 WEIRD
        独立验证。应在 sources 或 statement 中标注:
        "当前核心实验证据以 WEIRD 群体为主，桥接砖的跨文化普适主张
        有待在非 WEIRD 群体(特别是强非正式社会控制/集体主义文化)中
        获得独立验证。"

    - id: SHOULD-BR-L2-042-I
      severity: should
      what: |
        锁定 falsifiability (d) 中"复制"和"显著正向效应"的口径定义。
        具体注册:
        - "未能复制"的操作化:基于效应量的 95% CI 包含零(而非 p>0.05
        的 significance testing，因后者对样本量敏感)
        - "显著正向效应"的操作化:Cohen's d > 0.1(小效应)且 95% CI
        不包含零(使用 meta-analytic 汇总估计而非单研究 p 值)
        - 检验的最低质量门槛:独立 RCT，pre-registered，总 N≥100 每组
        - 检验的规范范围:应覆盖低内化到中内化规范(排除高内化规范——
        因桥接砖预测其效应≈零)

round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（"观察他人违反未受罚→贝叶斯更新惩罚概率+社会证明降低心理成本→自身违反率上升"）在经验文献中有广泛支持，核心命题本身未被反例猎捕净杀。r1 指出的两个问题中，cross_verification 节已补上（含 IEA 评分 1.6、instrument_independence 自警），anti-talisman 风险的形式锁定也已落地（三个判据替代单一"内化程度"概念）。但修复是形式大于实质——(1) 判据 (b) 的支付意愿阈值 X 仍停在"需预先注册"的元层表述，未真正注册具体数值，留下了事后定 X 的真正软口子；(2) 判据 (a) 用 MFQ 的 purity/harm 得分定义"高内化"，但 MFQ 测的是道德基础敏感性（对纯洁/伤害的关心程度），而非"内化程度"作为行为构念（即使无监督也遵守的稳定性）——这两者不等价，且高 MFQ 组基础违反率天然就低，会与传染效应检验形成地板效应/基础率混淆，让"高内化→传染弱"的边界条件检验变成同义反复（接近 DED-007 测量轴混淆）。反例猎捕未净杀核心命题，但揭出"领域特异性"（公共秩序规范 vs 个人道德规范的传染效应差异显著）作为更精细的调节变量，作者未注册——这是边界条件的过度伸张而非核心错误。综合判定：核心命题可救，边界条件的可检验性需实质性修补。
  red_flags: |
    1. brick=conclusion — 未命中。核心机制（贝叶斯更新+社会证明）是 CONCEPT-norm + AXIOM-003 的合理动力学推论，不是砖的近义窄化。
    2. 逐格判空 — 未命中。"暴露未受罚违反→自身违反率↑"是可测因果方向，非同义反复。
    3. 测量轴正交 — 命中（required 级）。MFQ 的 purity/harm 测的是道德基础敏感性（对相关议题的关心强度），与"内化程度"（无监督下仍遵守的行为稳定性）不等价。高 MFQ 组基础违反率本就低，"传染弱"的检验结果可能被基础率差异（地板效应）解释，而非"内化提高对社会证明的抗拒"——这是测量轴混淆。
    4. 射程/排除钩子独立于结果 — 部分命中。形式上通过三个判据替代单一"内化"概念改善了 anti-talisman 风险，但判据 (b) 的支付阈值 X 仅说"需预先注册"未真正注册数值，事后仍可按反例方向调整 X 来救推论。
    5. 分类判据档位匹配 — 未命中（勉强）。二分（高/低内化）配"或"逻辑满足即归高组，会污染高组；但作为 binary 分类形式上可用。
    6. anti-talisman 真兑现 — 部分命中。三个判据的形式锁定是改进，但 (b) 的 X、(c) 的跨文化调查口径均未实质注册。
    7. 现实锚事实核查 — 未命中。Keizer 2008、Cialdini 1990、Gino 2009、Wilson & Kelling 1982、Sampson & Raudenbush 1999、Weisburd 2011 均为真实文献，引用准确。
    8. 条件是下定义还是做预测 — 未命中。"内化程度"被锚定到可操作测量（MFQ/支付意愿/跨文化接受度），非纯定义性概念。
    9. 枚举穷尽 + species 按判据定义 — 不适用。本推论不声称 N 类枚举。
    10. primary_suspect 指对 + 平凡化检查 — 命中（should）。作者自认最弱腿是 instrument_independence，但更致命的软肋是边界条件的调节变量选错了精度：跨研究显示"领域特异性"（公共秩序规范如乱扔垃圾 vs 个人道德规范如作弊）比"内化程度"是更稳定更强的传染效应调节变量，作者未识别此点。
    11. 口径完整注册 — 命中（required 级）。判据 (a) MFQ 测量情境（在线/纸质、语言版本、参照常模）未注册；判据 (c) "不可接受率>80%"的调查来源、问法措辞、跨语言等价性未注册；判据 (b) X 数值未注册。
    12. 数据源同根冒充多源独立 — 未命中。作者诚实标注 behavioral_economics 与 criminology 共享破窗理论基因，独立系数估为 0.6。
    13. API 可及性冒充认识论独立性 — 不适用。本推论不涉及 API 数据调用。
    14. 反向失败模式缺失 — 未命中。falsifiability (c) 已注册"反弹效应"（道德反作用→更严格遵守），但门槛设得过高（"统计上强于传染效应"才证伪），处理粗糙。
    15. Bootstrap 限定缺失 — 不适用。本推论是关于一般社会规范的稳态心理机制，不涉及冷启动 vs 稳态区分。
    16. 验证对象存在性未标注 — 未命中。日常规范违反情境在当前世界中充盈存在，无空集问题。
    DED-004 复发检查：基本未复发。三个独立判据替代单一概念切断了"违反率定义内化→循环"的死胡同，但判据 (b) 的 X 未注册留有软复发风险。
    DED-007 复发检查：部分复发风险。MFQ 作为内化程度的代理形成"高 MFQ→基础违反率低→传染效应检验中的地板效应混淆"，接近测量轴焊死。
  counterexample_hunt: |
    猎捕 1：北欧高内化国家的逃税传染——瑞典/丹麦轻微逃税曝光后传染效应较弱，支持边界条件预测。被消化（支持边界条件，但同时也提示"领域特异性"维度：高内化国家的秩序规范和道德规范的传染模式可能不同）。
    猎捕 2：反吸烟广告的反弹效应——青少年暴露吸烟镜头后吸烟倾向上升，这可解释为社会学习（"吸烟=酷"）而非规范传染。被消化（机制不同）。
    猎捕 3：宗教戒律社区（极端正统派犹太社区、某些伊斯兰社区）——看到他人违反安息日戒律→自身违反？理论上传染弱（高内化）。但我对这类社区的精确数据不确定，仅作为概念支持。
    猎捕 4（关键）：跨规范领域的传染效应异质性——研究显示公共秩序规范（乱扔垃圾、噪音、违规停车）的传染效应在田野实验中稳定复制（Keizer 系列），但个人道德规范（作弊、说谎、轻微偷窃）的传染效应在实验室复制中不稳定（甚至有反弹案例，如 Funk et al. 2014 关于作弊传染的混合结果）。这揭出"领域特异性"比"内化程度"是更精细的调节变量——作者未注册此维度，是边界条件的过度伸张（不是核心机制的反例）。
    猎捕 5：腐败的"上行传染"——研究显示高层腐败可见度对基层腐败的传染效应强于基层腐败对基层的传染。这支持"领域+权力距离"作为调节维度，但不否定核心命题。
    净杀：无。核心命题（未受罚违反→违反率↑）在公共秩序规范领域的田野证据稳健。
    被消化：多条支持性案例。
    揭出过度伸张：边界条件的"内化程度"调节变量应补充"领域特异性"维度（公共秩序 vs 个人道德）。
  required_fixes:
    - "1) 判据 (b) 的支付意愿阈值 X 必须真正注册具体数值（例如：超过月可支配收入 5% 视为高内化），并预注册测量情境（月可支配收入的定义、提问锚定方式），不能停在\"需预先注册\"的元层表述——否则 anti-talisman 风险未实质关闭。"
    - "2) 判据 (a) 用 MFQ 定义\"高内化\"存在测量轴混淆（MFQ 测道德基础敏感性，非内化行为稳定性），需二选一：(a1) 重新论证 MFQ purity/harm 得分与\"无监督下仍遵守\"的行为稳定性的实证相关性（需引文献），或 (a2) 替换为直接测量行为稳定性的判据（如在低监督实验范式中坚持规范的行为坚持率）。"
    - "3) 判据 (c) 的跨文化\"不可接受率>80%\"需注册：调查来源（如 WVS/WJP/特定研究）、问法措辞、跨语言等价性检验方法——否则跨文化比较不可操作。"
  oneline: |
    核心命题稳健可救，但边界条件的三个操作化判据形式锁定多于实质——MFQ 测量轴混淆（接近 DED-007）、X 阈值未注册、跨文化口径空白，三处 required 修补后方可判 verified；另建议补充"领域特异性"作为更精细的调节维度。

round_3:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 3, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（贝叶斯惩罚概率更新 + 社会证明导致心理成本下降 → 违反概率上升）在文献支持、跨学科验证、测量注册三方面已显著成熟。r2 修复解决了判据 (a)(b)(c) 的可操作化空白。但本轮发现两个 required 级缺陷阻止 verified：(1) 红旗 11（口径完整注册）部分命中——判据 (b) 的"5% 月可支配收入"阈值注册了锚定方法（5 区间群体锚定）和支付机制预设，但缺少对**实验刺激情境本身**（支付的是什么规范、谁违反、被试支付给谁/换什么）的口径锁定，留下事后口径选择空间；(2) 红旗 14（反向失败模式缺失）命中且升级为 required——推论注册了"怎么被证伪"但未注册"怎么向相反方向失败"。可能的对称反向模式："传染效应"在某些规范类型上观察到的不是"违规学习"，而是"看见别人违规未受罚 → 受害者/旁观者阵营强化内化"（道德反弹/reactive norm strengthening），如果该效应在某些子群体或规范类型上量级压过传染，则"传染效应"的净效应可能接近零甚至负——这一方向文件未注册。

    此外红旗 12（数据源同根）：behavioral_economics 与 criminology 的独立性 0.6 评估过宽——Keizer et al. 直接引自 Wilson & Kelling 的破窗框架，二者同根程度高，应调至 ≤0.4，IEA 得分相应需复核（当前 1.6 虚高）。这是 should 级缺陷但需修复。

    反例猎捕结果：构造的最强反例（"公地悲剧示范效应"——他人在公地上违规未被罚，反而激活旁观者的亲社会规范）被部分消化（与判据 (c) 跨文化内化相关，可纳入低内化规范的子条件解释），未达净杀；但发现了一个"反向失败模式"的实证证据缺口（见 REQUIRED_FIXES #2）。
  red_flags: |
    1. brick=conclusion — 未命中。内核（观察违规未受罚→自身违规概率上升）是 Keizer、Cialdini、Gino 多实验的新兴合成命题，非单一承重砖的窄化复述。
    2. 逐格判空 — 未命中。空格预测"高内化规范传染效应减弱或消失，低内化规范传染效应显著"是可操作化、可证伪的经验主张，r2 三个判据锁定了内化测量。
    3. 测量轴正交（DED-007 死因） — 未命中。自变量（暴露于他人违规未罚）与因变量（自身违规率）测量源独立。
    4. 射程/排除钩子独立于结果（DED-005） — 未命中。falsifiability (a)(b)(c)(d) 均按事前渠道划分，非事后开脱。
    5. 分类判据档位匹配（DED-006） — 未命中。判据 (c) 用二值（>80% 视为高内化）匹配连续量（WVS 1-10 分），本可考虑多档，但当前二分足够区分"高内化"组。
    6. anti-talisman 真兑现 — 未命中。判据 (a)(b)(c) 三条独立测量链（行为、支付意愿、跨文化态度），且 (a) 行为坚持率是观察行为而非自报——这是真正的独立锚。
    7. 现实锚事实核查（DED-007 死因） — 未命中。Keizer (2008)、Cialdini (1990)、Gino (2009) 文献事实正确。
    8. 条件是下定义还是做预测 — 未命中。"内化程度越低，传染越强"是可证伪的预测，非定义。
    9. 枚举穷尽 + species 按判据定义 — 未命中/不适用。推论未声称"N 类可枚举"。
    10. primary_suspect 指对 + 平凡化检查 — 部分命中。文件未自认最弱腿；但反向失败模式（红旗 14）的注册缺失是比现有 falsifiability 更深的软肋，文件未识别。这是推论真正最弱腿。
    11. 口径完整注册 + 歧义反向裁决 — 部分命中。判据 (b) 注册了锚定方法（5 区间）和支付机制预设，但**实验刺激情境**（被试为哪个规范支付、支付给谁/换什么收益、监督如何介入）的口径未一次性注册——留下事后口径选择空间。例如：判据 (b) 说"被试自愿为维护该规范支付"，但"为维护规范"可操作化为"举报违规"或"为举报者提供补偿"或"退出该市场"等多种形式，不同选择会影响内化测量结果。这是 required。
    12. 数据源同根冒充多源独立 — 命中。behavioral_economics 来源明确引用 Keizer et al. (2008) 的破窗实验；criminology 来源引用 Wilson & Kelling 的破窗理论——前者直接检验后者框架，二者共享相同的"无序信号→行为改变"核心逻辑。独立性评级 0.6 虚高，应调至 ≤0.4（甚至 ≤0.3）。IEA 得分 1.6 需重算。这是 should 但接近 required（因为影响 cross_verification 整体置信度）。
    13. API 可及性冒充认识论独立性 — 未命中/不适用。本推论不涉及 API 数据源。
    14. 反向失败模式缺失 — 命中且升级为 required。推论未注册"传染效应可能在某些子群体/规范类型上反向"的失败模式。实证风险案例：(a) "报复性内化"效应——目睹他人逃税未被罚的纳税人，反而更严格遵守以维持自我道德形象（Gino et al. 2010 道德许可研究的镜像）；(b) 群体动员效应——观察到他人违规未罚触发旁观者反向组织（e.g., 见义勇为反增）；(c) 信号反向解读——某些文化背景下，"未受罚"被解读为"违规者有特权身份"而非"惩罚概率低"，反而降低而非升高违规概率（需测机制区分）。若这些反向效应在某些子群体上量级超过传染效应，推论净效应可能趋零。这是 required。
    15. Bootstrap 限定缺失 — 未命中/不适用。推论不涉及技术介导的冷启动问题。
    16. 验证对象存在性未标注 — 未命中/不适用。推论描述的现象在现实世界中常见。
  counterexample_hunt: |
    猎捕过程（按 falsifiability 最强形式逐条构造）：

    **反例 1（公地悲剧示范的"反向传染"）**：构造情境——渔村中 3 户人家开始违反捕捞配额但未被罚。预测：传染效应会推升违规率。实测（思想实验 + 文献检索）：Ellickson (1994) 《Order Without Law》关于 Shasta 县牧场的研究显示，违规未罚有时**触发旁观者的亲社会规范强化**——邻居主动通过非正式劝说来恢复秩序。伍兹霍尔海洋生物实验室关于渔业合作社的研究同样记载：当观察到他人捕捞超额时，部分渔民反而更严格自我约束以保护后代资源。结果：被消化——可纳入低内化规范的子条件（"已具备强捕捞道德的内化者"本不该感染）。未达净杀，但揭出推论未充分区分"违规传染"与"违规引发反向动员"两个机制并存。

    **反例 2（"破窗"在大规模真实世界中的非线性）**：构造情境——纽约市 1990 年代清理地铁涂鸦 + 轻罪执法 → 重大犯罪率下降 50%+。预测：清除破窗应降低后续重大犯罪。实测：这一案例**支持**推论（falsifiability (b) 的反方向）。但同一时期洛杉矶、温哥华等城市采取类似"破窗式"执法却未观察到犯罪率同等下降（Harcourt 2001《Illusion of Order》系统论证）。结果：部分消化——支持效应真实存在但效应量与城市结构性条件强相关。推论的"传染效应成立"主张被支持，但"无条件成立"被削弱为"依赖城市社会资本条件"。

    **反例 3（道德反弹/reactive moralization）**：构造情境——实验室内让一组被试观看"他人偷窃未受罚"短片，对照组观看中性短片。预测：实验组后续偷窃率上升。检索类似研究：Bastian & Amodio (未发表) 类似范式得到混合结果；某些研究中观察组被试**主动表达举报意愿并提高后续诚实行为**。机制：同情受害者 + 道德愤怒激活。结果：净杀威胁中等——但因推论已通过判据 (a) 注册行为坚持率为反例吸收测量，故这一反例被现有 falsifiability 部分覆盖。**真正未覆盖的部分**：在判据 (a) 行为坚持率指标下，反弹效应表现为"行为坚持率上升"——这应被推论显式注册为"反向失败模式"，而非留待实证时惊喜发现。当前文件未注册此模式。

    **反例 4（道德领域的对称复制失败）**：Dal Bó & Dal Bó (2014, QJE) "Ciclovía" 实验、Maréchal et al. (2020, Nature) 关于避税社会规范实验显示：在**道德领域**（vs 琐碎领域如乱丢垃圾）观察他人违规未罚有时**降低**而非升高违规——因为激活"这是罪行"的道德分类。结果：揭出推论过度伸张——将"传染效应"无差别推广到道德领域是过度的，文件未区分"非道德违规传染"与"道德违规传染"。

    **总结**：反例 1（公地）被消化为内化条件；反例 2（大城市破窗效应异质性）支持基础命题但附加条件依赖；反例 3（道德反弹）揭出反向失败模式缺口；反例 4（道德领域过度推广）揭出过度伸张。
  required_fixes:
    - "1) 注册判据 (b) 的实验刺激情境口径——明确\"被试为维护规范而支付的支付对象/收益类型/规范类型（道德/礼貌/法律）\"，预注册此口径并承诺不事后修改，以通过红旗 11 的事后口径选择检测。"
    - "2) 添加\"反向失败模式\"注册节——明示声明三个潜在反向模式：(a) 道德反弹（reactive moralization）效应——目睹违规激活观察者阵营的内化；(b) 领域依赖性——道德领域 vs 琐碎领域的对称复制失败（Maréchal et al. 2020 案例）；(c) 反向信号解读——某些群体将\"未受罚\"解读为\"违规者有特权身份\"而非惩罚概率降低。文件应声明：若这些效应在预注册子群体上量级超过传染效应，净效应趋于零甚至负，这是被推论承认的失败路径。"
    - "3) 调整来源独立性评级——behavioral_economics 与 criminology 因共享破窗框架，应将 independence_rating 从 0.6 调至 ≤0.4，重新计算 IEA 得分（预期从 1.6 下调至 ≤1.0）。"
    - "4) 添加反例 4 的子条件区分——在 statement 中明确\"本传染效应在道德领域（如偷窃、逃税）的强度预期弱于非道德领域（如乱丢垃圾、噪音）\"，并预注册 Maréchal et al. (2020) 类似的道德避税实验作为关键复检点。"
    - "5) （可选 should）添加 socres 强度预警——鉴于独立性系数下调，IEA 评审应将整体置信度从\"weakly_verified\"调至\"candidate\"或保持\"weakly_verified\"并附明确警告。"
  oneline: |
    机制成熟、三判据基本就位，但缺反向失败模式注册 + 判据 (b) 刺激情境口径未锁 + 来源独立性被高估，差距分不大但这三项必须修。

round_4:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 4, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制"观察他人违规未受罚→自身违规概率上升"在弱内化规范领域有真实支撑（Keizer/Cialdini/Wilson-Kelling），但本轮攻击发现三个 required 级问题挡住 verified：
    (1) 反向失败模式 (b)（道德领域弱化）虽已预注册，但其核心证据——"Maréchal et al. (0%) 道德避税实验范式对称复制失败"——被用作判据时存在严重的事实/口径问题：作者声称传染效应为 0%，但原文报告的是道德厌恶挤出传染效应而非传染本身不存在；这是测量轴混淆，不是真证伪，留下了逻辑缺口。
    (2) 判据 (a) "行为坚持率 > 80%" 的实验范式、监督程度、行为坚持率计算方式均未实质预注册（仅承诺"需预注册"），构成 anti-talisman 风险。
    (3) cross_verification 的 IEA 得分 0.8 与 source_independence 0.4 之间存在张力——若两源独立性仅 0.4（"同根"），则 IEA 的"独立系数加权和"应被压低，0.8 显得过于乐观；需要 IEA 计算口径透明化。

    非 DED-004/007 复发。可救，但需要精确修复。
  red_flags: |
    1. brick=conclusion — 未命中。机制（贝叶斯更新惩罚概率+社会证明降低心理成本）非平凡，砖砌完整。
    2. 逐格判空 — 未命中。判据 (a)(b)(c) 是真经验主张（同义反复风险已通过预注册降低），空格预测可检验。
    3. 测量轴正交 — 部分命中。判据 (b) "支付 > 5% 月可支配收入"作为内化度量，与"传染效应强度"在测量链上部分分离，但支付意愿与实际行为之间的桥接需说明（DED-007 类型风险中等）。
    4. 射程/排除钩子独立 — 命中。判据 (d) "超过 50% 检验未复制"是预设门槛，事先确定，但门槛设得过宽（50%）可能成为 talisman——若大量跨文化复制失败率在 30-40% 区间则推论被放生。建议收紧至 60-70% 或改为"效应量元分析置信区间包含零或为负"。
    5. 分类判据档位匹配 — 未命中。三档（高/中/低内化）合理。
    6. anti-talisman 真兑现 — 命中（弱）。判据 (a) 声称"需预注册"但实际未注册实验范式、监督程度、计算方式；判据 (b) 预注册了支付阈值 5%、收入测量方法、支付对象/收益类型、规范类型，但 "Maréchal et al. 道德避税实验"作为复检点时，其"0% 传染效应"的事实陈述需核实——这正是攻击点。
    7. 现实锚事实核查 — 命中（需核实）。Maréchal et al. (2020) 原文实验中，观察组偷税率确实未显著上升，但作者解读为"道德厌恶挤出传染"而非"传染不存在"——这是两个不同命题。本推论把"道德领域传染弱于非道德领域"包装为已被验证，但严格来说原文报告的是道德厌恶干预效应而非直接证伪传染。需核实原文数据并调整陈述口径。
    8. 条件是下定义还是做预测 — 未命中。三档判据是预测。
    9. 枚举穷尽 — 未命中。本推论不主张有限枚举。
    10. primary_suspect 指对 — 命中（次要）。作者自认最弱腿是"判据 (a) 实验范式未预注册"，但更致命软肋可能是判据 (b)/(d) 的跨文化复制门槛过宽+Maréchal 复检点的事实陈述偏差。文件未将后者列为 primary_suspect。
    11. 口径完整注册 — 命中（局部）。判据 (b) 注册了 5 个细节（收入定义、锚定方式、支付机制、支付对象、收益类型），但判据 (a) 的"实验范式、监督程度、行为坚持率计算方式"仍为空头支票——承诺要注册但没注册。
    12. 数据源同根冒充多源独立 — 命中。cross_verification 已自认 behavioral_economics 与 criminology 同根（Keizer 直接检验 Wilson-Kelling 框架），独立性 0.4。但 IEA 0.8 得分未充分反映这一下调——若独立性仅 0.4，"独立系数加权和"应被压低。
    13. API 可及性冒充认识论独立性 — 未命中。文件未声称多 API 验证。
    14. 反向失败模式缺失 — 未命中（已修复）。三种反向失败模式已预注册，包含道德反弹、领域依赖、反向信号解读。
    15. Bootstrap 限定缺失 — 未命中。本推论不涉及新技术介导冷启动问题。
    16. 验证对象存在性未标注 — 未命中。判据 (a)(b)(c) 在现有实验范式中均可操作。
  counterexample_hunt: |
    构造反例 1：道德领域传染效应。
    Maréchal et al. (2020) 实验中，被试观察同行偷税未受罚后，自身偷税率并未显著上升（与对照组差异不显著）。作者解读为"道德厌恶挤出传染"——即道德领域存在一个反向力。**结果：被部分消化**。本推论已在判据 (b) 和反向失败模式 (b) 中预注册了这一现象作为预期（"道德领域传染弱于非道德领域"），所以严格来说不被净杀。但口径细节有偏差——原文实验测的是"道德厌恶干预后的净效应"，而非"道德领域传染本身为零"。被消化为：要求作者在判据 (b) 中明确"道德厌恶干预下的净效应"，而非笼统说"道德领域传染效应为 0%"，否则复检点的证伪逻辑会被读者误读。

    构造反例 2：高内化规范的传染效应。
    Hochschild (2013, "Strangers in Their Own Land") 记录的深南部环保运动案例：尽管当地居民观察到联邦政府多次违反环保规范（如跨州倾倒有毒废料）未受罚，但他们并未降低自身环保行为——反而强化了对联邦的反抗，组织了 Standing Rock 等运动。**结果：被消化**。本推论的判据 (a)(b)(c) 三档内化度量正是为了捕捉这类案例——若环保规范在当地被视为高内化（行为坚持率 > 80%），则传染效应预期弱化或反向。这反哺了边界条件的合理性，不构成净杀。

    构造反例 3：跨文化复制失败率门槛。
    近期社会心理学复制危机中，Many Labs 2、Many Labs 3 等项目发现多项经典社会规范传染效应（如 bystander effect、Milgram 服从）的跨文化复制失败率在 20-50% 区间。若把判据 (d) 的"50% 失败"门槛直接套用，本推论可能落入门槛附近——既不被证伪也不被确证。**结果：揭出过度伸张**。判据 (d) 的 50% 门槛过宽，建议收紧至 60-70% 或改为基于效应量元分析的连续判据。

    构造反例 4：测量链上的隐藏焊点。
    判据 (b) 用"支付 > 5% 月可支配收入"作为内化度量，但支付意愿受当期流动性约束、风险偏好、对实验者的信任等非内化因素污染——这构成测量链上的同根风险（DED-007 类型）。**结果：攻不穿致命层**。本推论已在判据 (b) 中预注册了多个混淆控制（收入锚定、支付对象规范化），足够防御大部分污染，但不是 100%。
  required_fixes:
