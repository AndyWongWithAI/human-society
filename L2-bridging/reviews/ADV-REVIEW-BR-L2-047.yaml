id: ADV-REVIEW-BR-L2-047
type: adversarial_review
reviews: BR-L2-047
layer: L2-bridging
target: BR-L2-047
target_term: "冲突催化规范涌现 (Norm Emergence Catalyzed by Conflict)"
rounds: 1

人话摘要: |
  对 BR-L2-047(冲突催化规范涌现——当两个群体反复争夺资源且谁也灭不了谁时，
  他们会比和平时期更快地形成关于"谁该得多少"的规矩)的 round_1 独立对抗审查。
  裁 needs_revision：核心直觉(冲突成本→紧迫性→加速规范试错收敛)有直觉合理
  性和部分文献支撑(Ostrom/Ellickson 的田野研究均展示冲突情境下规范的涌现过程)，
  但三条 required 缺陷阻止 verified：(1) anti-talisman 未兑现——"均势"是关键
  作用域条件但无独立于规范涌现结果的操作化定义，构成免疫策略逃生口；
  (2) 测量口径未注册——"规范的出现时间"缺少操作化定义(何为"出现"？)，证伪
  条件形式可测但实质不可执行；(3) IEA cross_verification 缺失——桥接砖 YAML
  不含 cross_verification 节，无 IEA 分数，无法进入 verified/weakly_verified 流程。
  额外两条 should 级缺陷：(4) 现实锚过度解读——引用的文献(Ostrom/Ellickson/
  Knight/Young/Bowles & Gintis)支持"冲突→规范"方向，未直接支持速度比较主张；
  (5) 反向失败模式不全——未注册"冲突摧毁既有规范基础设施、使新规范更难形成"
  这一反向路径。反例猎捕在四方向上未获净杀反例，但暴露了作用域模糊(什么是"双方"？)
  和"均势"的事后归因风险——这反哺而非推翻 required 缺陷的紧迫性。

round_1:
  reviewer: independent-adversarial-reviewer
  date: 2026-07-16
  verdict: needs_revision
  verdict_note: |
    本命题的核心直觉——冲突使无规则默认状态变得不可持续，迫使双方投入认知
    资源寻找稳定的均衡点，从而加速非正式规范的试错-收敛过程——在直觉层面合理：
    如果和平时期的"还可以忍受"状态让规范涌现缺乏紧迫性，那么冲突将这种
    "无规则成本"具象化和放大，确实应产生加速效应。

    这一机制在部分田野研究中获得间接支撑：
    - Ostrom (1990) 展示了公共资源冲突如何催生社区自组织规则
    - Ellickson (1991) 记录了牧场主之间的篱笆纠纷加速非正式边界规范的固化
    - Knight (1992) 从理论角度论证分配冲突是制度变迁的关键驱动力
    - Young (1993) 的随机稳定均衡模型表明冲突引发的支付变化可缩短规范收敛时间
    - Bowles & Gintis (2011) 的 agent-based 模拟显示群体间冲突加速利他与规范出现

    然而，三条 required 级缺陷阻止 verified 裁决：

    1.【anti-talisman 未兑现——"均势"的独立操作化缺失——REQUIRED】
    这是本命题最根本的方法论缺陷。命题的 statement 声明：
    "仅当冲突重复发生且双方均无法彻底击败对方时，该加速效应才成立。"
    "均势"(stalemate/双方均无法彻底击败对方)是命题最关键的 scope condition——
    如果此条件不成立（一方可碾压另一方），命题不声称任何预测。

    但此条件的操作化存在严重的"看结果定义前提"风险：
    - 如果观测到冲突场景中规范加速涌现 → "你看，均势成立"
    - 如果观测到冲突场景中规范未加速甚至更慢 → "这说明均势不成立（可能
    一方实际占优）"
    - "均势"本身没有独立于规范涌现结果的测量标准

    均势的可独立测量指标（军事实力比、经济资源比、领土控制面积比、外部
    援助对称性等）在命题中完全缺席。这使命题拥有一个经典的 anti-talisman
    护身符：任何表面上不符合预测的观测都可以被"均势不成立"挡回——而
    "均势是否成立"的判定可能依赖于观测者的事后解释而非事前可测的标准。

    修复方向：(i) 为"均势"注册事前可测的操作化指标——如"冲突前五年内
    双方军事力量比在 0.5-2.0 之间"、"任何一方在冲突爆发后两年内无法取得
    决定性军事胜利(定义为控制对方≥50%领土或消灭对方≥50%战斗力)"；
    (ii) 或者将"均势"从必要条件降格为调节变量——"均势程度越高，加速
    效应越强"，使命题在均势不完美的情境中仍可检验（而非被免疫）。

    2.【测量口径未注册——"规范的出现时间"无操作化定义——REQUIRED】
    Falsifiability 全部三个条件均依赖"规范的出现时间"这一核心被观测量：

    (a) "规范的出现时间与无冲突情境无显著差异，甚至更慢"
    (b) "冲突频率与规范涌现速度呈负相关"
    (c) "冲突组规范涌现的中位时间不短于非冲突组"

    但"规范的出现时间"在任何地方都未被操作化定义。以下问题全未回答：
    - 什么算规范"出现了"？第一次被观察到的行为规律？持续 N 次的稳定模式？
    口头共识？被违反后遭到制裁？
    - 测量起点是什么？从冲突首次爆发？从群体首次接触？从资源首次变得稀缺？
    - 规范"出现"的判定是否需要某种持久性检验（如"出现后连续 M 次交互中
    被双方遵守"）？
    - 对于模糊的、逐渐形成的规范（如从"偶尔遵守"到"通常遵守"到"几乎总是
    遵守"），"出现时间"取哪一个点？

    这不是"有操作化但不够精确"——是完全没有操作化。三个证伪条件在形式上
    可陈述，但在实质上不可执行：如果你想证伪命题（证明冲突组中位时间不短于
    非冲突组），你首先需要知道如何测量"中位时间"——但命题本身没有告诉你。

    按 L4-009 判例精神（红旗 11 口径完整注册）：若测量口径在看见反例后才
    定死，且定死方向恰好救命题，则一律按不利方向裁决。当前命题连初始口径
    都没有——等于为事后选择留下了无限空间。这是 required 级缺陷：不修则
    falsifiability 三条件纯属摆设。

    修复方向：(i) 至少注册一个可执行的实验室操作化——如"在公共池资源实验
    中，从第一轮交互到组内平均提取量收敛至 Nash 均衡±10% 范围内并持续 ≥5
    轮的轮次数"；(ii) 对田野情境注册一个更粗但可编码的操作化——如"从冲突
    首次记录到第一次出现被双方引用为'规矩/惯例/老规矩'的行为规则的时间跨度
    （以年为单位，由田野研究者编码）"。

    3.【IEA cross_verification 缺失——REQUIRED】
    桥接砖 YAML 当前不含 cross_verification 节。L2 桥接砖的 verified 需
    IEA ≥ 1.8（两个准独立来源的加权支持），weakly_verified 下限为 IEA ≥ 1.2。
    没有 cross_verification，就没有 IEA 分数，桥接砖无法进入任何已验证状态。

    桥接砖引用了两个可计入 IEA 的学科来源：
    - conflict_studies: Ostrom (1990), Ellickson (1991), Knight (1992)
    - evolutionary_game_theory: Young (1993), Bowles & Gintis (2011)

    初步 IEA 结构建议：
    - 锚源: conflict_studies (weight 1.0)——田野/案例研究最直接地观察
    到冲突→规范涌现的过程
    - 独立票: evolutionary_game_theory (weight × 独立系数)——用不同方法
    （形式模型/agent-based 模拟）在人工系统中复现了冲突加速规范涌现的动力学

    两个源之间的独立性评估：
    - 按 independence-model.yaml，game_theory 与 cultural_universals
    的成对独立系数为 0.5（"gt 提供范式，cu 提供样本"）。conflict_studies
    属于 cultural_universals 的相邻领域（田野/案例方法）。以 0.5 为参考，
    conflict_studies ↔ evolutionary_game_theory 的独立系数预估在 0.4-0.6
    范围内——源于"田野 vs 模型"的方法论分叉，但共享"冲突驱动制度变迁"
    的理论共识。
    - 按 instrument_correlation discount_rule：若 cross_verification
    由单一 LLM 执行，必须披露仪器有效独立性低于学科独立性上限。本命题
    涉及的新颖/争议性（将"速度"维度加入冲突-规范关系）触发 mitigation
    条款——仪器折扣应视为承重红旗。
    - data_source_origin 折扣不适用：引用的是学术文献（田野研究+理论模型），
    非宏观经济统计指标。

    IEA 补全为 required_fix #3。

    4.【现实锚与速度主张的不匹配——should 级附加缺陷】
    桥接砖引用的全部文献(Ostrom/Ellickson/Knight/Young/Bowles & Gintis)
    支持的核心主张是"冲突情境下规范会涌现"——这是已(被 THEOREM-competition-norm
    和 THEOREM-conflict-cost 在 L1 层面)覆盖的命题。桥接砖在此基础上做了
    一项关键外推：冲突不仅导致规范涌现，而且比和平情境更快。

    但上述文献均未直接检验这个速度比较主张：
    - Ostrom 的案例展示了冲突→自组织规则，但未设置"和平对照组"比较速度
    - Ellickson 展示了纠纷→规范固化，但未测量"如果没纠纷，固化有多快"
    - Young 的模型展示了冲突可改变收敛速度，但此为模拟中的比较静态分析，
    非对真实世界的速度测量
    - Bowles & Gintis 的模拟展示了群体间冲突加速合作，但同样为模拟证据

    桥接砖宜诚实标注：当前经验支撑的主要是"冲突→规范"的【方向性】证据
    （田野+模型均支持），而"冲突加速规范（比和平快）"的【速度比较】主张
    更多依赖机制推理（冲突成本→紧迫性→加速试错）而非直接的田野/实验速度
    比较证据。这不影响命题的可证伪性（可以用实验检验速度），但影响命题在
    当前证据生态下的实证置信度。列为 should。

    5.【反向失败模式不全——should 级附加缺陷】
    Falsifiability (a) 覆盖了"规范出现时间无差异或更慢"的反向观测——这在
    形式上注册了反向失败方向。但未注册另一条重要的反向路径：冲突可能不仅
    不加速规范涌现，反而【摧毁既有规范基础设施】，使新规范的形成比和平时期
    更困难。

    机制链：冲突→信任破坏+物质基础设施摧毁+认知资源被生存需求占据→规范形成
    的"社会资本"基础被削弱→即使在冲突结束后，规范重建也需要更长时间
    （比从未经历冲突的群体更长）。

    历史例证：
    - 卢旺达 genocide (1994) 后：尽管 Hutu 与 Tutsi 经历了极端冲突且双方
    均无法消灭对方（战后在统一国家内共存），但族群间的非正式资源分享规范
    至今脆弱——冲突摧毁了跨族群的信任基础，使规范重建极为缓慢。
    - 刚果(金)东部：数十年的资源冲突中，多方武装团体处于均势（谁也无法消灭
    谁），但资源掠夺成为低水平均衡——非正式规范的涌现并未加速，反而被
    持续的暴力循环阻止。

    桥接砖可通过射程限定来消化这些案例（如"不适用于一方对另一方实施了
    大规模暴行的冲突"或"仅适用于双方均保持基本组织结构的冲突"），但
    当前版本未注册此反向路径。列为 should：不影响核心可证伪性，但影响
    命题的射程完整性和读者的信任——如果这些明显的反向案例已被考虑并排除，
    读者需要看到排除的理由。

    6.【brick=conclusion 边界警觉——非 required 但值得诚实标注】
    本命题的核心逻辑链可以在 L1 定理中几乎完整追踪：
    - THEOREM-competition-norm: 竞争+重复交互→规范涌现
    - THEOREM-conflict-cost: 冲突成本→竞争规范化的选择性压力
    冲突是竞争的子类（CONCEPT-conflict 继承 CONCEPT-competition），
    而"选择性压力增强→加速涌现"是从"压力"到"速度"的直接推理跳跃。

    命题的非平凡增量仅在于：【速度比较】维度——"比和平快"。这是 L1
    定理未覆盖的新经验声称，因此 brick=conclusion 不命中。但这个增量
    非常薄：命题的绝大部分逻辑结构是 L1 定理的重组，"速度"是唯一
    原创贡献。这不是缺陷（L2 桥接砖本就该"桥接" L1 到经验世界），
    但值得诚实标注：本桥接砖的创新密度较低，其经验贡献聚焦于一个
    调节变量（冲突作为规范涌现的加速器/减速器），而非一个全新机制。

    综合裁决: 三条 required 均可通过定向修订修复——修复路径明确且不
    推翻核心直觉。anti-talisman 的修复(注册"均势"的事前操作化判据)
    是标准的方法论升级；口径的修复(定义"规范出现时间")是操作化的基本
    要求；IEA 的补全是流程性修复。两条 should 可通过 scope 限定和诚实
    标注快速处理。

  red_flags:
    brick_is_conclusion:
      hit: false
      detail: |
        BR-L2-047 的核心机制链在 L1 层面有近乎完整的覆盖:
        - THEOREM-competition-norm: "竞争+重复交互→规范涌现"
        - THEOREM-conflict-cost: "冲突成本→竞争规范化的选择性压力"
        冲突(CONCEPT-conflict)是竞争(CONCEPT-competition)的子类——
        概念继承关系使"冲突→规范"这条链的绝大部分已在 L1 成立。
        "选择性压力→加速"是从"压力"到"速度"的直接推理。

        但命题的非平凡增量在于【速度比较】维度——"比和平快"。这一主张:
        (i) 未被任何 L1 实体断言——THEOREM-competition-norm 只说规范
        "会涌现"不说"多快"；THEOREM-conflict-cost 只说冲突产生"选择性
        压力"不说压力的时间维度。
        (ii) 是原则可错的——逻辑上可能的世界中，和平时期因认知资源充裕
        而更快形成规范（不急不躁反而想得清楚），冲突因认知资源被生存需求
        占据而更慢。
        (iii) 可被实验检验——随机分配群体到冲突 vs 和平条件，测量规范
        收敛时间。

        因此 brick=conclusion 不命中。但诚实标注: 速度比较是此命题的唯一
        原创经验贡献，创新密度较低。命题的绝大部分逻辑架构是 L1 定理的
        重组——这在 L2 桥接砖的定位中正常(桥接=连接 L1 与经验)，但提醒
        此命题在体系内的"桥接"功能强于"发现"功能。

    empty_cell_tautology:
      hit: false
      detail: |
        核心空格预测: 若世界是"冲突不加速（甚至减速）规范涌现"，则:
        (a) 在重复冲突+均势条件下，规范出现时间与无冲突情境无显著差异
        或更慢；(b) 冲突频率与规范涌现速度呈负相关；(c) 冲突组中位时间
        不短于非冲突组。

        这些是可观察的经验预测——逻辑上可能被观测到。有别于 DED-004
        的不可证伪循环(命题在任何经验证据下均成立)。非同义反复。

        但需注意: 在当前的测量操作化缺失下(红旗 11)，空格(a)-(c)的形式
        可测性无法兑现为实质可测性。这不是同义反复问题而是测量有效性
        问题——不触发本红旗，但触发口径注册红旗。

    measurement_axis_orthogonality:
      hit: false
      detail: |
        自变量（冲突存在/频率）与被观测量（规范出现时间）在概念层面正交:
        - 冲突的测量: 行为观测（资源争夺事件计数、烈度评分、持续时间）
        - 规范出现的测量: 行为规律性检测（互动模式的收敛、规则引用的
        频率、违规惩罚的出现）
        二者不共享测量链。不与 DED-007（分母偷用实际获授者）的结构死罪
        同级。

        但存在一个次级不正交风险: 在田野观察中，"规范出现"常被研究者以
        "冲突减少/停止"作为操作化信号之一。如果研究者以"冲突频率下降至
        某阈值以下"作为规范出现的判据，则自变量（冲突频率）和被观测量
        （规范出现=冲突下降）将共享同一测量通道——冲突频率的下降既是
        自变量的消失也是因变量的到场。这会制造"冲突越多→规范越快"的
        机械关联: 基线冲突频率越高的群体，从基线降到阈值所需的绝对下降
        量越大，但因基线本身就高，"下降到阈值"这件事可能更早被观察到
        （floor effect）。

        此不正交风险源于操作化选择——如果规范出现被定义为"行为规律的
        正面证据"(如规则的第一次被口头引用)而非"冲突的消失"，则风险
        消除。列为 required_fix #2 的附注: 注册规范出现的操作化时，应
        避免使用"冲突频率下降"作为规范出现的判据。

    scope_exclusion_independent:
      hit: false
      detail: |
        排除项按可事前测的渠道划界:
        - "不适用于一次性的毁灭性冲突"——一次性 vs 重复可按可观测的
        冲突事件计数判定(冲突事件≥2 次 = 重复)，独立于规范涌现结果。
        - "仅当冲突重复发生且双方均无法彻底击败对方时"——"重复"可事前
        判定(见上)；"无法彻底击败"的问题见 anti-talisman 红旗(红旗 6)。
        排除方向在见反例前声明，非事后开脱。但"均势"的操作化缺席意味着
        此排除钩子可能在实践中被事后调用（见红旗 6）。

    classification_granularity:
      hit: false
      detail: |
        命题的核心变量(冲突存在/频率、规范出现时间)均为连续量(或可
        在连续尺度上度量的二分变量)。命题未做不必要的离散化。预测形式
        (时间差异/相关性)保持连续度量，档位匹配不触发。

    anti_talisman:
      hit: true
      detail: |
        本红旗命中——"均势"(双方均无法彻底击败对方)是关键作用域条件，
        但无独立于规范涌现结果的操作化标准，构成 anti-talisman 护身符。

        【核心问题: "均势"的事后归因风险】
        Statement 声明: "仅当冲突重复发生且双方均无法彻底击败对方时，
        该加速效应才成立。" 这意味着: 如果在一项研究中观察到冲突组
        的规范涌现未加速(甚至更慢)，命题可以辩称"这不构成证伪——
        因为均势条件不满足(可能一方事实上占优)"。

        命题未提供"均势"的任何独立操作化判据——如:
        - 军事实力比在什么范围内算"均势"？
        - 经济资源比？
        - 领土控制比例？
        - 外部援助的对称性？
        - 冲突持续 N 年未分出胜负是否算均势？（如果是，N=？）

        没有这些事前判据，"均势是否成立"就可能变成事后解读——
        如果观测结果支持命题 → 均势成立（规范加速涌现本身就是均势的证据）；
        如果观测结果不支持命题 → 均势不成立（规范未加速涌现说明一方其实
        更强）。这不是"命题有明确前件但操作化模糊"——这是"命题的前件
        是否满足本身依赖于命题预测的结果"——anti-talisman 的典型症状。

        【与 DED-004 不可证伪循环的区别】
        这不是 DED-004 的结构死罪（命题内容本身在任何观测下均成立）。
        命题的核心方向性主张（冲突加速规范）是可错的——逻辑上可能观测到
        不加速甚至减速。问题在于"均势"这个前件的免疫效应: 它使任何表面
        上的反例都可以被"均势不成立"这一声称挡回。命题的形式可证伪性
        （falsifiability in principle）没有被摧毁，但实质可证伪性
        （falsifiability in practice）被严重削弱。

        【修复方向】
        (i) 为"均势"注册事前可测的操作化指标——如"冲突爆发时双方军事
        力量(兵力+装备价值)比在 1:3 至 3:1 之间"、"冲突爆发后两年内
        任何一方未能取得决定性军事进展(定义为控制对方≥50%领土或消灭
        对方≥50%作战力量)"。
        (ii) 或者将"均势"从必要条件降格为调节变量——"双方力量越均衡，
        冲突对规范涌现的加速效应越强"。这使命题在均势不完美的情境中
        仍可检验——你可以用力量比作为连续调节变量来预测加速效应的大小，
        而不是用"是否均势"二分地将不理想案例整体排除。
        推荐方案 (ii)——它在方法论上更稳健（连续变量→更多统计 power）
        且消除了二分阈值的事后选择性风险。

        【falsifiability 三个条件的实质评估】
        (a) 规范出现时间无差异或更慢——形式上可测，但受"均势"免疫效应影响：
        如果观测到无差异/更慢，可声称均势不成立。实质证伪力弱。
        (b) 冲突频率与规范涌现速度负相关——受同样免疫效应影响。
        (c) 系统综述中中位时间不短于非冲突组——此条件在原则上最干净：
        如果做大规模的系统综述并诚实编码所有冲突案例（包括均势判定模糊的），
        总体效应应支持命题。但"均势"的事后排除仍可被用于筛选入组标准。

        综合裁定: REQUIRED——不修则命题的实质可证伪性在"均势"这个
        escape hatch 上严重受损。

    reality_anchor_fact_check:
      hit: false
      detail: |
        引用文献的核心事实检查:

        (1)【Ostrom (1990) "Governing the Commons"——发表属实、内容准确】
        核心发现: 社区可通过自组织成功管理公共池资源，避免"公地悲剧"。
        Ostrom 的多个案例（瑞士 Törbel 高山牧场、日本森林、西班牙
        Huerta 灌溉系统）展示了资源使用者如何在冲突和资源压力下自发创建规则。
        引用准确——冲突情境确实是 Ostrom 案例中规则涌现的重要驱动力。

        (2)【Ellickson (1991) "Order without Law"——发表属实、内容准确】
        核心发现: 加州 Shasta 县牧场主通过反复的纠纷（牲畜越界吃草/
        篱笆维护责任归属）形成了非正式的边界规范——谁负责哪段篱笆、
        越界牲畜如何处理。引用准确——反复冲突确实加速了非正式规范的固化。
        但需注意: Ellickson 的核心论点是"紧密群体中社会控制优于法律"，
        而非"冲突比和平更快产生规范"。他将规范形成归因于重复互动和紧密
        社会网络，而非冲突本身。

        (3)【Knight (1992) "Institutions and Social Conflict"——发表属实、
        内容准确】
        核心论点: 制度（包括非正式规范）是分配冲突的产物——社会行动者
        在资源分配上的冲突驱动制度变迁，优势方塑造制度以巩固其优势。
        引用准确——Knight 确实从理论层面论证分配冲突是制度变迁的关键驱动力。
        但 Knight 强调的是制度反映权力不对称(强势方按自身利益设计规则)
        而非"均势双方加速达成共识"。这两种动力学——权力不对称下的制度
        设计 vs 均势下的规范试错——是不同的机制路径。桥接砖引用 Knight
        时未区分这两种机制。

        (4)【Young (1993) "The Evolution of Conventions"——发表属实、
        内容准确】
        Young 的随机稳定均衡模型表明: 当支付结构发生变化（如引入新冲突
        维度），系统的收敛路径和收敛时间也会改变。在某些条件下，冲突引发
        的支付变化可缩短收敛时间。引用准确——此模型确实为"冲突可加速规范
        收敛"提供了形式化支撑。但需注意这是比较静态分析的模拟证据，非
        直接经验测量。

        (5)【Bowles & Gintis (2011) "A Cooperative Species"——发表属实、
        内容准确】
        核心发现: 群体间冲突(group-level conflict)与组内合作/利他规范的
        共演化——群体间战争压力加速了组内合作规范的演化。引用准确。
        这是桥接砖最有力的经验支撑——Bowles & Gintis 的考古/人类学证据
        和 agent-based 模拟直接支持"冲突加速规范涌现"。

        【总体评估: 引用准确但速度比较证据薄弱】
        全部引用均属实、内容引用基本准确。但存在一个关键鸿沟:
        - 全部文献支持"冲突→规范"的方向性(方向性证据 = 强)
        - 仅 Young (1993) 和 Bowles & Gintis (2011) 的模拟部分涉及"速度"
        维度
        - 无任何引用文献提供了"冲突 vs 和平"的速度比较的田野/实验直接证据

        这不构成引用造假或事实错——桥接砖正确引用了每篇文献的内容。
        但桥接砖宜诚实标注: 当前经验支撑的强度在"方向性验证"("冲突
        导致规范")上远高于在"速度比较验证"("冲突加速规范比和平快")上。
        列为 should_fix 而非 required: 不影响引用的准确性，但影响命题
        声称的经验证据力度和读者的校准。

    definition_vs_prediction:
      hit: false
      detail: |
        "冲突使双方加速形成资源分配规范"是可证伪的经验预测——逻辑上
        自洽的可能世界中:
        (1) 冲突使认知资源被生存需求占据，实际减慢规范形成(减速假说)
        (2) 冲突的破坏性效应(信任瓦解/物质摧毁)恰好抵消其紧迫性效应，
        使冲突和和平条件下的规范涌现速度无显著差异(零效应假说)
        (3) 规范涌现速度完全由其他因素(群体规模/沟通成本/资源类型)
        决定，冲突与否无关(无效应假说)

        这三种替代可能均不违反任何逻辑约束——命题是经验选择而非定义。
        "冲突重复发生且均势"作为条件是对 scope 的定义(何种冲突下命题
        适用)，而非对"规范必然加速涌现"的定义性声明。命题在形式上
        是经验主张。

    enumeration_exhaustiveness:
      hit: false
      detail: |
        命题未声称对规范涌现的加速/减速因素做穷尽枚举。其 statement
        明确限制射程("不声称冲突强度越大规范越快，也不适用于一次性
        的毁灭性冲突")。不触发穷尽性红旗。桥接砖将自己定位为冲突-
        规范关系中的一个特定因果主张(加速效应)，不假装覆盖所有可能
        的冲突-规范动力学。

    primary_suspect_accuracy:
      hit: false
      detail: |
        L2 桥接砖无 formal primary_suspect 字段(L3 要求)，按红旗精神
        审查最弱腿。外部识别的最致命软肋(砖未自认):

        (i)【"均势"的事后归因——最致命】anti-talisman 红旗(红旗 6)
        已详细论证: "均势"无独立操作化 = 命题拥有免疫策略。见
        required_fix #1。

        (ii)【"规范出现时间"的操作化缺席——第二致命】证伪三条件依赖
        的核心度量未被定义。见 required_fix #2。

        (iii)【速度比较的直接经验证据薄弱——中等脆弱】引用的全部文献
        支持"冲突→规范"的方向性，仅模拟证据(Young, Bowles & Gintis)
        涉及速度维度。见 should_fix。

        (iv)【缺少 cross_verification——流程性脆弱】无法进入 verified
        流程。见 required_fix #3。

        (v)【冲突作为"规范不存在"的信号: ceiling effect 困境——隐蔽脆弱】
        未被充分讨论的方法论挑战: 冲突之所以发生，常是因为规范恰好不存在
        (或已瓦解)。和平之所以维持，常是因为规范已经存在且有效。
        这意味着: 冲突组的"规范涌现空间"远大于和平组(和平组已经接近
        规范的 ceiling)。如果冲突组的规范涌现更多/更快，这可能不是
        因为冲突加速了规范——而是因为冲突组从更低的基线出发，有更多
        的"涌现"可供观测。这是一个观测不等价(observational non-equivalence)
        问题，在非实验条件下极难排除。列为 should_fix 的附注。

    caliber_registration:
      hit: true
      detail: |
        本红旗命中——关键测量口径未预注册。按 L4-009 判例精神(阈值/
        判据须连同分子、分母、口径一次性注册): 发现"只有概念没有口径"
        → 直接标记 required。

        (1)【"规范的出现时间"——REQUIRED】
        Falsifiability 全部三个条件均使用"规范的出现时间/涌现时间/
        中位时间"作为被观测量，但此变量无任何操作化定义。

        以下操作化维度全部未注册:
        - 定义维度: 规范"出现"的定义是什么？
          · 行为规律首次被观测到？
          · 行为规律持续 N 次交互？
          · 规则被参与者首次口头引用("我们这儿的规矩是...")？
          · 违反规则的行为首次被第三方惩罚？
        - 起点维度: 时间测量的起点是什么？
          · 从冲突首次爆发？
          · 从群体首次接触？
          · 从资源首次变得稀缺？
        - 持久性维度: "出现"的判定是否需要持久性检验？
          · 如果是，持久性标准是什么（"出现后连续 M 次交互中被遵守"）？
        - 模糊边界维度: 对于逐渐形成的规范，取哪一个点？
          · 首次偶尔遵守？通常遵守？几乎总是遵守？

        这不是"有操作化但不够精确"——是完全没有操作化。后果: 你不可能
        执行任何证伪条件——因为你不知道要测量的"东西"到底是什么。
        按 L4-009 判例精神: 若事后补充口径且补充方向恰好救命题，按不利
        方向裁决。但当前无口径 = 为事后选择保留了最大空间。

        修复方向: 至少注册 (i) 一个可执行的实验室操作化——如"从第一次
        交互到组内平均资源提取量进入 Nash 均衡±10% 范围并持续≥5 轮的时间
        (轮次数)"；(ii) 对田野情境注册一个更粗但可编码的操作化——如
        "从冲突首次记录到第一次出现被双方独立引用为'规矩/惯例'的行为
        规则的时间跨度(以年为单位)"。

        (2)【"均势"的口径空缺——REQUIRED】
        已在 anti-talisman 红旗详述: "双方均无法彻底击败对方"的判据口径
        未注册。需要的操作化: 什么指标、什么阈值、什么测量时点——
        全缺失。见 required_fix #1。

        (3)【"控制群体规模、资源类型和沟通成本"的操作化——should】
        Statement 声称"在控制群体规模、资源类型和沟通成本等条件下"可检验
        预测，但未为这些控制变量注册测量口径。在 lab 实验中这些可被
        实验设计自然控制，但在田野比较中，需要为"沟通成本是否可比"
        "资源类型是否相同"等提供编码方案——否则不同研究之间的比较
        无法判定控制是否已"控制"。

    data_source_common_root:
      hit: false
      detail: |
        桥接砖引用的全部经验证据来自学术文献（田野案例研究+形式理论
        模型+agent-based 模拟），不涉及宏观经济统计指标（如 WB/IMF/CNBS
        的 GDP 数据）。不触发 data_source_origin 折扣。

        conflict_studies 和 evolutionary_game_theory 使用完全不同的底层
        数据和测量方法:
        - conflict_studies: 人类学/社会学的田野观察数据（参与观察、访谈、
        档案研究）
        - evolutionary_game_theory: 数学模型的分析解 + 计算机模拟的
        涌现行为
        两源在测量链层面完全分叉——它们测量不同层面的不同现象，不共享
        底层原始观测。

    api_pretending_independence:
      hit: false
      detail: |
        桥接砖当前没有 cross_verification 节，故不存在 IEA 投票。未来若
        补上 cross_verification，需注意: 跨学科投票（冲突田野研究 vs
        演化博弈论）是学科层面的独立性判断，不是"通过 API 查到相同数据"
        的假独立。API 可及性冒充独立性不适用。

    reverse_failure_mode:
      hit: true
      detail: |
        本红旗命中（should 级）——命题未注册一条重要的反向失败路径:
        "冲突摧毁既有规范基础设施，使新规范形成比和平时期更困难"。

        桥接砖的 falsifiability (a) 已注册"无差异或更慢"的反向观测——
        这在形式上覆盖了"不加速"的反向结果。但未注册的反向失败模式是
        【毁灭性反向】——冲突不仅不加速，反而因信任破坏、物质摧毁、
        认知资源挤占等原因，系统性地【阻碍】新规范形成。

        机制链: 冲突→人际/群体间信任崩溃 + 物质基础设施(集会场所/
        沟通渠道)被毁 + 认知资源被生存需求占据 + 创伤导致的风险规避
        增强 → 规范形成的"社会资本"基础被削弱 → 即使在冲突结束后，
        规范形成比从未经历冲突的群体更慢。

        这与命题注册的正向机制（冲突成本→紧迫性→加速收敛）方向相反，
        但并非互斥——同一冲突可能同时触发紧迫性(加速力)和破坏性
        (减速力)，最终观测结果取决于两力的净效应。

        历史例证:
        - 卢旺达(1994 genocide 后): Hutu 与 Tutsi 在 genocide 后共同
        生活于统一国家——符合"双方均无法彻底击败对方"的条件。但跨族群
        的非正式资源分享规范至今脆弱——冲突摧毁了跨族群的社会信任基础，
        使规范重建比从未经历大规模暴行的多族群社会更慢。
        - 刚果(金)东部(Kivu): 数十年的资源冲突中，多方武装团体处于
        均势(谁也无法消灭谁)。但资源掠夺——而非资源分享规范——
        成为低水平均衡。持续的暴力循环阻止了非正式规范的形成和固化。

        桥接砖可通过射程限定来消化这些案例——如"不适用于一方对另一方
        实施了大规模暴行/genocide 的冲突后情境"或"仅适用于双方均保持
        基本社会结构与组织完整性的冲突"。但当前版本未注册此反向路径。

        红旗触发级别: should。理由: (i) 命题的 falsifiability (a) 已在
        形式上注册了反向方向(更慢/无差异)；(ii) 毁灭性反向与加速正向
        非互斥因果(两者可能同时成立，取决于冲突类型和烈度)；(iii) 可通过
        射程限定而非机制重写来修复。但此反向模式的缺失意味着命题的射程
        边界不完整——读者无法判断命题是否考虑了这些明显的反向案例，
        还是恰好遗漏了它们。

    bootstrap_limitation:
      hit: false
      detail: |
        Bootstrap 限定(新技术介导社会形态的冷启动 vs 稳态阶段的区分)是
        DED-039 判例的红旗，针对涉及新技术(如 AI/算法治理)的命题。
        本桥接砖涉及的社会机制(冲突→规范涌现)不依赖任何现代技术——
        它声称适用于前文字社会的部落冲突和现代社会的资源纠纷一样。
        不触发此红旗。

    verification_object_existence:
      hit: false
      detail: |
        本命题验证所需的理想数据条件——在控制群体规模、资源类型和
        沟通成本的条件下，比较冲突组与和平组的规范涌现速度——在实验室
        实验中原则可及（公共池资源实验 + 冲突/无冲突操纵）。田野
        情境中，历史案例的规范涌现时间难以精确测量，但人类学/历史
        比较研究可提供近似证据。

        与 BR-L2-033（要求在集体层面测量个体损失厌恶——对象不存在）
        不同: 本命题的核心变量（冲突、规范行为规律）在实验室和田野
        均有可操作化的先例。验证对象不是"空集"——冲突催生规范的
        案例在 Ostrom/Ellickson 的田野研究和 Bowles & Gintis 的实验
        经济学中均可找到。问题不在对象不存在，而在核心变量的操作化
        未预注册（见红旗 11）。

  iea_independence_check:
    cross_verification_present: false
    note: |
      桥接砖 YAML 当前不含 cross_verification 节。无 IEA 分数。
      L2 verified 门槛为 IEA ≥ 1.8，weakly_verified 下限为 IEA ≥ 1.2。
      必须补上 cross_verification 才能进入任一已验证状态。

      桥接砖引用了两个可计入 IEA 的学科来源:
      - conflict_studies: Ostrom (1990), Ellickson (1991), Knight (1992)
      - evolutionary_game_theory: Young (1993), Bowles & Gintis (2011)

      初步 IEA 结构建议:
      - 锚源: conflict_studies (weight 1.0)——田野/案例研究最直接地
      观察到冲突→规范涌现的过程
      - 独立票: evolutionary_game_theory (weight × 独立系数)——用不同
      方法（形式模型/agent-based 模拟）在人工系统中复现了冲突加速规范
      涌现的动力学

      两个源之间的独立性挑战:
      (i) 按 independence-model.yaml，evolutionary_game_theory ↔
      cultural_universals 的成对独立系数为 0.5。conflict_studies 属于
      cultural_universals 的相邻领域（共享田野/案例方法论），以 0.5 为
      近似参考值，conflict_studies ↔ evolutionary_game_theory 的独立
      系数预估在 0.4-0.6 范围——源于"田野 vs 模型"的方法论分叉，但共享
      "冲突驱动制度变迁"的理论共识(Bowles & Gintis 本身就是跨这两个
      领域的学者)。
      (ii) 按 instrument_correlation discount_rule: 若 cross_verification
      由单一 LLM 执行，必须披露仪器有效独立性低于学科独立性上限。
      本命题涉及的速度比较维度在文献中的支撑较弱（见 reality_anchor
      红旗的评估），触发新颖/争议命题的 mitigation 条款——仪器折扣
      应视为承重红旗。
      (iii) data_source_origin 折扣不适用——引用的是学术文献（田野研究+
      理论模型），非宏观经济统计指标。

      IEA 补全为 required_fix #3。

    instrument_honesty:
      disclosed: false
      assessment: |
        桥接砖当前无 instrument_disclosure 字段——因为尚无 cross_verification。
        未来补全 IEA 时必须包含 instrument_disclosure，按 independence-model.yaml
        的 instrument_correlation discount_rule 披露单 LLM 执行的仪器折扣。

    no_data_source_common_root:
      applicable: true
      detail: |
        不触发 data_source_origin 折扣——引用的全部是学术文献（田野观察+
        形式模型+模拟）而非宏观经济统计数据。两源在测量链层面完全独立。

  counterexample_hunt:
    methodology: |
      四个反例方向: (1) 均势冲突但规范涌现不加速甚至减速——最直接挑战核心
      方向性预测; (2) 和平时期规范涌现比冲突时期更快——挑战"冲突是加速器"
      的排他性; (3) 冲突导致规范倒退/摧毁——挑战命题未注册的反向失败模式;
      (4) "冲突"与"规范缺席"的共线性——挑战因果方向的识别。
      以历史案例推理+跨学科文献探查为主。
    cases:
    - direction: "均势冲突但规范涌现减速: 刚果(金)东部的资源冲突 (1996-至今)"
      description: |
        刚果(金)东部(Kivu/Ituri)自 1996 年以来经历了持续的资源冲突。
        多方武装团体(M23/ADF/FDLR/Mai-Mai 民兵等数十支)争夺矿产(钶钽铁矿/
        黄金/锡石)控制权。关键特征:
        - 均势性: 没有任何一支武装力量能永久消灭其他武装——政府军无力
        控制全境，叛军之间互相制衡，UN 维和部队(MONUSCO)无力改变均势
        - 重复性: 冲突反复爆发——1996-1997(第一次刚果战争)、1998-2003
        (第二次刚果战争/非洲世界大战)、2003 至今(低烈度持续冲突)
        - 资源竞争: 冲突的核心标的物是矿产控制权(资源配置)，正符合命题
        的 domain

        可观测结果: 经过近 30 年的重复均势冲突，Kivu 地区的资源分配
        规范不仅未加速涌现，反而维持着暴力掠夺的低水平均衡——武装团体
        之间、武装团体与地方社区之间未形成稳定的非正式资源分享规范。
        矿产开采权由暴力决定，不是由规范决定。
      counter_impact: "揭出作用域模糊——不净杀"
      analysis: |
        此案例不净杀桥接砖，因为:
        (i) 命题的条件是"双方"(two-party)均势，刚果(金)东部是"多方"
        (multi-party)动态——数十支武装团体之间的互动结构可能不满足命题
        隐含的"二元"交互前提。但命题的 statement 只说"双方"未限定二元，
        这是作用域模糊被反例利用的典型案例——揭示命题需要明确: "双方"
        是否隐含地要求二元结构?
        (ii) 命题的另一个条件——"冲突重复发生且双方均无法彻底击败对方"——
        在表面上是满足的(多方均无法消灭彼此)，但"均势"在多极系统中的
        含义可能与两极系统不同: 在多极系统中，"我今天不抢你，明天别人
        会抢你"的协调问题使任何双方规范都容易被第三方破坏。
        (iii) 命题可说刚果(金)东部的冲突烈度已超出其 scope——"大规模
        暴行"级别的冲突可能触发反向失败模式(信任摧毁>紧迫性)。

        此案例对命题并非净杀，但精确暴露了当前作用域的两个关键模糊:
        (1) "双方"是否隐含要求二元结构？(2) 冲突烈度是否存在一个
        使得"加速效应"反转为"摧毁效应"的阈值? 这些应在修复中澄清。

    - direction: "和平时期规范涌现可能比冲突时期更快: California 水权制度演化"
      description: |
        加州水权制度从 19 世纪中期的"先占先用"(prior appropriation)
        到 20 世纪逐步建立的水权交易市场和水资源分配框架，是一个在
        【相对和平】(有法律框架、无武装冲突)条件下规范涌现的案例。
        尽管存在利益冲突(农民 vs 城市 vs 环保)，但这些冲突主要在
        法院和行政机构内解决——非命题定义的"直接对抗性冲突"。
        在约 50 年间，加州从无规范到建立了复杂的水权分配规范体系。

        对比: 命题预测和平条件下规范涌现慢于冲突——但加州的规范涌现
        速度(50 年从零到成熟体系)是否真的慢于冲突情境？命题缺乏速度
        比较的基准线。

        类似和平但快速的规范涌现案例: 互联网域名系统的规范(ICANN 之前
        的非正式治理)、开源软件社区的合作规范(Linux kernel 开发流程)、
        维基百科的编辑规范——均在无武装冲突、"和平"条件下快速涌现。
      counter_impact: "被消化——不净杀，但暴露基准线问题"
      analysis: |
        此案例不净杀: 命题的"冲突"指直接对抗性交互(资源争夺中的面对面
        对抗)，不包含制度化冲突(诉讼/游说)。加州的利益冲突通过制度渠道
        解决，不符合"无规则默认状态不可持续"的前提——因为有法律框架作为
        默认规则。

        但此案例揭示了一个深层的基准线问题: 命题声称"和平时期规范涌现慢"
        但未定义"慢"的基准——多慢算慢? 与什么比? 如果和平时期也能快速
        涌现规范(如互联网社区的案例所示)，那么"冲突作为加速器"的经验
        增量是什么? 命题需要一个"如果没有冲突，同样这些群体在多长时间内
        会形成规范"的反事实基线——这在田野研究中几乎不可得。这使速度
        比较主张在田野层面的可检验性打了折扣。

        此压力不构成 required 缺陷(实验室实验可以解决基线问题)，但说明
        命题在田野层面的验证依赖于强反事实假设——应诚实标注。

    - direction: "冲突摧毁规范而非加速: 卢旺达 genocide 后的规范重建"
      description: |
        Hutu-Tutsi 冲突在 1994 年 genocide 中达到顶峰(约 80 万 Tutsi
        和温和 Hutu 被杀)。Genocide 后:
        - 双方继续共存于统一国家(RPF 领导的政府)
        - 均势条件可辩论成立: Hutu 虽在军事上被击败，但占人口多数(~85%)；
        Tutsi 领导的政府控制国家机器但无法消灭 Hutu 身份
        - 重复交互持续: 双方在日常生活中持续互动(市场、工作场所、学校)

        30 年后(1994-2024)，跨族群的非正式资源分享和经济合作规范仍然
        高度脆弱——信任重建极为缓慢。冲突不仅未加速规范涌现，反而因
        创伤和信任彻底瓦解，使新规范的形成比从未经历 genocide 的多族群
        社会(如坦桑尼亚)更慢。
      counter_impact: "揭出反向失败模式——不净杀"
      analysis: |
        此案例不净杀命题——已在反向失败模式红旗(红旗 14)中列为 should_fix。
        命题可通过射程限定("不适用于一方对另一方实施了大规模暴行的冲突")
        来排除此案例。但此限定本身需要独立于规范涌现结果的判据: 什么是
        "大规模暴行"的阈值? 如果阈值在案例出现后才定义——且定义恰好
        排除不利于命题的案例——则此限定本身成为次级 anti-talisman。

        更重要的是: 卢旺达的案例提出了一条理论挑战——冲突烈度可能不是
        线性调节变量。低烈度冲突(Ellickson 的篱笆纠纷)可能确实加速规范
        固化，但高烈度冲突(genocide)摧毁了规范形成的信任基础。二者之间
        存在非线性关系，命题当前的线性/单调性声称(有冲突 → 更快)可能
        只在低-中烈度范围内成立。这个非线性边界未被注册。

    - direction: "因果方向逆转: 冲突是规范缺席的症状，非规范涌现的原因"
      description: |
        一个未被命题考虑的解释性挑战: 冲突之所以发生，常是因为规范恰好
        不存在(或已瓦解)。和平之所以维持，常是因为规范已经存在且有效。

        如果冲突 → 规范涌现的正相关被观测到，这可能不是因为冲突加速规范，
        而是因为: (1) 冲突群体从一开始就缺乏规范(选择效应)——这些群体
        可能因某种前定特征(如异质性高/社会资本低)而既有冲突又缺乏规范;
        (2) 和平群体从一开始就有规范——他们的规范涌现发生在更早的、
        不可观测的时期。

        这制造了一个 ceiling effect: 冲突组有大量"规范涌现空间"
        (baseline norm level 低)，和平组接近 ceiling(baseline norm
        level 高)。在没有随机分配的情况下(田野比较的常态)，观测到的
        速度差异可能是 baseline 差异的产物——不是因为冲突加速了规范，
        而是因为冲突组有更多规范需要涌现。
      counter_impact: "揭出因果识别困境——不净杀"
      analysis: |
        此挑战不净杀命题——命题的预测是可以在实验室中通过随机分配来
        检验的(随机分配群体到冲突 vs 和平条件，控制 baseline norm level
        为 0)。实验室检验可以干净地排除选择效应和 ceiling effect。

        但在田野/历史比较研究中，选择效应和 ceiling effect 是无法排除的
        严重混淆——观测性证据不能区分"冲突加速规范"和"需要规范时才
        有冲突"。命题应在 statement 或域限定中诚实标注: 田野证据支持
        的是相关性(冲突与规范涌现的共现)，因果方向(冲突→加速)的
        最干净证据来自实验室/模拟。

        此挑战不构成 required 缺陷——它不影响命题的可证伪性(实验室
        可以解决)。但命题当前的 confidence 语气可能超出其经验支撑的
        强度——建议在 cross_verification 中按 evidence type 分层加权
        (实验证据 weight 高，田野比较证据 weight 低)。

    overall_counterexample_verdict: |
      四方向上未获净杀反例:
      (1) 刚果(金)东部案例暴露作用域模糊("双方"=? "均势"在多极系统中如何定义?);
      (2) 加州水权/互联网案例暴露速度比较的基线问题;
      (3) 卢旺达案例揭示冲突烈度的非线性效应和反向失败模式缺口;
      (4) 因果方向分析揭示田野研究中的选择效应和 ceiling effect 混淆。

      未出现满足以下全部条件的净杀案例: (i) 严格的二元冲突结构;
      (ii) 可独立验证的军事/经济均势; (iii) 冲突过程未达大规模暴行级别;
      (iv) 可精确测量的规范涌现时间; (v) 规范涌现速度显著慢于可比的
      无冲突对照组。净杀案例的缺席部分源于命题本身——作用域条件
      （"双方均势""非一次性毁灭性冲突"）足够模糊，使得任何表面反例
      都可以通过事后作用域调整被排除。这恰恰是 anti-talisman 红旗命中的
      后果——不是证明命题正确，而是证明命题的保护壳太厚。

      反例猎捕的主要贡献不是推翻命题，而是: (1) 精确识别"均势"操作化
      缺席的免疫效应(支撑 required_fix #1); (2) 揭示命题在田野比较
      研究中的因果识别困境(支撑 should_fix); (3) 发现冲突烈度的非线性
      效应和反向失败模式缺口(支撑 should_fix)。

  non_recurrence:
    - check: DED-004
      status: pass
      detail: |
        DED-004 的死因是不可证伪循环(命题的核心主张无法被任何经验观测
        拒绝——命题形式本身是免疫的)。本桥接砖的证伪条件在概念上清晰:
        逻辑上可能观测到"规范出现时间在冲突组不短于非冲突组"。命题的
        形式可错性不依赖于循环定义。可证伪性在形式上合格。

        但需注意: anti-talisman 红旗(红旗 6)揭示了一个接近 DED-004 的
        模式——虽非命题层面的免疫，但"均势"的事后归因为命题提供了
        操作层面的免疫。这是一个操作化的 DED-004-light——命题在形式上
        可错，但在实践中可通过前件调整来规避反例。修复 required_fix #1
        正是要堵住这个操作层面的免疫通道。

    - check: DED-007
      status: pass
      detail: |
        DED-007 的死因是测量轴焊死——分母偷用实际结果(用"实际获授者"
        定义授信对象，形成不可拆的闭环)。本桥接砖不存在此级别的结构
        死罪: 自变量(冲突存在/频率)不由因变量(规范出现时间)定义，
        二者在概念上独立。

        但存在一个次级不正交风险(在红旗 3 中详述): 如果田野研究中以
        "冲突频率下降"作为"规范出现"的操作化信号，则自变量和因变量
        将共享测量通道。这不是 DED-007 的结构死罪，而是操作化设计的
        注意事项——可通过避免此操作化来预防。列为 required_fix #2 的
        附注。

  required_fixes:
    - id: REQ-BR-L2-047-A
      severity: required
      what: |
        修复 anti-talisman——为"均势"（双方均无法彻底击败对方）注册
        事前可测的独立操作化指标，消除事后归因免疫。

        具体修复（推荐方案二，更稳健）:
        将"均势"从必要条件降格为连续调节变量:
        - 在 statement 中，将"仅当冲突重复发生且双方均无法彻底击败对方时"
        改为"双方力量越均衡，冲突对规范涌现的加速效应越强"。
        - 注册力量均衡的操作化指标: (i) 军事力量比(兵力+装备)；
        (ii) 经济资源比(GDP/可支配财富)；(iii) 外部援助对称性；
        (iv) 冲突前 N 年内任一方未能取得决定性军事胜利(定义:
        控制对方≥50%领土或消灭对方≥50%战力)。
        - 将 falsifiability 更新为: "在控制其他因素后，双方力量均衡度
        与规范涌现速度的正相关不显著，或方向为负"。

        此方案的优势: (i) 用连续变量替代二分阈值，消除"均势/非均势"
        二分的事后选择性；(ii) 保留命题的核心方向性(越均势越加速)；
        (iii) 使命题在均势不完美的情境中仍可检验(你可以用不完美的
        力量比数据来检验其预测)；(iv) 在方法论上更稳健(连续变量→
        更多统计 power)。

        或备选方案一（若坚持必要条件形式）:
        注册"均势"的二分操作化判据:
        - 军事力量比在 1:3 至 3:1 之间(战前估计)
        - 冲突爆发后两年内任何一方未能取得决定性军事进展(定义同上)
        - 双方均保持独立指挥结构和领土/人口基础
        三者同时满足 = 均势成立。此判据在观测到反例之前锁定。

      rationale: |
        当前"均势"条件的操作化缺席 = anti-talisman 护身符。任何表面
        反例都可被"均势不成立"挡回。不修则命题的实质可证伪性严重受损。

    - id: REQ-BR-L2-047-B
      severity: required
      what: |
        注册"规范的出现时间"的完整操作化定义——含定义维度、起点维度、
        持久性维度和模糊边界处理规则。

        至少注册以下之一（推荐两者都注册）:

        (i) 实验室操作化:
        "在公共池资源实验中，从第一轮交互(t=1)到组内平均资源提取量
        进入[理论均衡值的 80%-120%]范围并在此范围内持续≥5 轮的轮次数，
        作为规范涌现时间。规范内容为'关于资源提取量的共享行为期望'——
        操作化为组内各成员提取量的标准差 ≤ 前 5 轮标准差的 50%。"

        (ii) 田野操作化:
        "在田野研究中，从冲突首次被记录到第一次出现被至少两个独立
        信息提供者引用为'规矩/惯例/老规矩'的行为规则的时间跨度(以年
        为单位)。判据需满足: (a) 规则内容可被信息提供者口头复述;
        (b) 信息提供者能举出至少一个'按规矩办'和至少一个'违反了规矩
        被罚'的具体事例; (c) 两个信息提供者来自不同家庭/派系。"

        附加要求: 注册操作化时同时声明——规范出现的判定不得使用
        "冲突频率下降至某阈值以下"作为判据(避免自变量与因变量共享
        测量通道——见红旗 3 的次级不正交风险)。

      rationale: |
        当前 falsifiability 三个条件全部依赖"规范的出现时间"但该变量
        无任何操作化定义。不修则三个证伪条件纯属摆设——你不知道要测
        什么。

    - id: REQ-BR-L2-047-C
      severity: required
      what: |
        补全 IEA cross_verification 节——在桥接砖 YAML 中添加正式的
        cross_verification 段，含来源逐条投票 + IEA 总分 + 仪器披露。

        具体操作: 运行 `python scripts/iea_survey.py BR-L2-047`（默认
        使用智谱独立血统模型做来源定性判断，Python 做精确算术）。
        预期 IEA 结构:
        - 锚源: conflict_studies (weight 1.0)——Ostrom/Ellickson/Knight
        的田野/理论研究提供了"冲突→规范"的最直接经验证据
        - 独立票: evolutionary_game_theory (weight × 独立系数 ~0.5)——
        Young/Bowles & Gintis 的模型/模拟用不同方法论独立支持方向性
        预测，但速度比较维度的支撑较弱

        补充 instrument_disclosure:
        "本 cross_verification 的来源定性判断由单一 LLM (智谱 glm-4-flash)
        执行。按 independence-model.yaml instrument_correlation 的
        discount_rule，有效来源独立性低于学科独立性上限。真实独立文献
        通道(异血统模型面板或独立人类专家)可部分恢复独立性，但当前
        IEA 分数反映的是'学科独立性的仪器折扣上限'。"

      rationale: |
        L2 桥接砖进入 verified (IEA ≥ 1.8) 或 weakly_verified (IEA ≥ 1.2)
        的前提条件。无 cross_verification = 无 IEA 分数 = 无法进入任何
        已验证状态。此为流程性修复——不影响命题的经验内容，但阻塞了
        状态推进。

  should_fixes:
    - id: SH-BR-L2-047-A
      severity: should
      what: |
        诚实标注经验支撑的强度分层: 方向性证据(冲突→规范)强于速度
        比较证据(冲突加速规范 vs 和平)。在 statement 或 cross_verification
        中区分:
        - 强支撑: "冲突情境下规范会涌现"（Ostrom/Ellickson/Knight 的
        田野证据 + THEOREM-competition-norm 的 L1 推导)
        - 中等支撑: "冲突可加速规范涌现"（Young 的模型 + Bowles & Gintis
        的模拟证据)
        - 弱支撑: "冲突【比和平】更快"（无直接田野/实验速度比较证据，
        主要依赖机制推理: 冲突成本→紧迫性→加速试错)

      rationale: |
        当前引用将所有文献平铺为 equally supportive，模糊了证据强度的
        分层。读者无法区分"有文献支持冲突导致规范"（强、已建立）和
        "有文献支持冲突使规范涌现更快"（弱、主要是模拟证据）。诚实
        标注不影响命题的可证伪性——但显著提升文献引用的诚实度和读者的
        校准精度。

    - id: SH-BR-L2-047-B
      severity: should
      what: |
        注册反向失败模式: "冲突摧毁既有规范基础设施，使新规范形成
        比和平时期更困难"——作为需通过射程限定排除的替代路径。

        在 statement 中增加:
        "本命题不适用于冲突烈度达到大规模暴行(genocide/ethnic cleansing)
        级别的情境——在此类情境中，冲突对信任和社会结构的摧毁效应
        可能压倒其加速规范涌现的紧迫性效应。二者的分界线需在未来的
        经验研究中校准。"

        同时注册冲突烈度作为潜在的调节变量——低-中烈度冲突可能加速
        规范(紧迫性效应主导)，高烈度冲突可能阻碍规范(破坏性效应主导)。
        这使命题从单调性声称升级为非线性声称——方法论上更诚实地反映
        了现实世界的复杂性。

      rationale: |
        卢旺达和刚果(金)案例显示高烈度冲突可能产生与命题预测相反的
        效果——规范形成被阻碍而非加速。当前命题未注册此反向路径，
        也未提供区分"加速"和"阻碍"的烈度阈值。注册此反向模式并限定
        射程可消除读者"命题似乎忽略了明显反例"的不信任感。

    - id: SH-BR-L2-047-C
      severity: should
      what: |
        标注田野比较研究中的因果识别困境: 观测性证据中"冲突→规范涌现"
        的正相关可能部分来自选择效应(冲突组 baseline norm level 更低、
        有更多规范需要涌现)和 ceiling effect(和平组已接近规范 ceiling)。

        在 statement 或 cross_verification 中诚实标注:
        "田野/历史比较研究中的冲突-规范涌现正相关受选择效应混淆——
        冲突常发生于规范缺席的群体(selection)，而规范缺席的群体有
        更大的'规范涌现空间'(ceiling effect)。因果方向(冲突→加速
        而非规范缺席→冲突+涌现)的最干净证据来自实验室随机分配实验
        和 agent-based 模拟。田野证据宜被视为'方向一致'(consistent
        with)而非'因果确认'(confirming)本命题。"

      rationale: |
        不标注此混淆会使读者误以为田野案例直接证实了因果加速效应——
        而实际上这些案例只能证实相关性。诚实标注提升命题的科学可信度，
        且不影响可证伪性(实验室仍可检验因果主张)。

    - id: SH-BR-L2-047-D
      severity: should
      what: |
        澄清"双方"的作用域——是否隐含二元结构？还是允许多方(多极)
        系统？

        在 statement 中明确:
        "本命题的'双方'指互动结构中存在可识别的两个主要竞争方。在
        多方(≥3)系统中，命题的预测可能因'第三方破坏双边规范'的协调
        问题而减弱或反转——多方系统中的规范涌现可能需要额外的协调
        机制(如联盟结构/轮替规则)，此为命题未覆盖的扩展域。"

      rationale: |
        刚果(金)东部的反例猎捕揭示了此模糊——多方冲突中的规范涌现
        动力学可能与双方冲突有质的不同。当前命题的"双方"措辞可能
        被解读为包含多极系统(多方中的任两方之间)，但多极系统中的
        双边规范不稳定(易被第三方 opportunism 破坏)。澄清作用域可
        防止此模糊在未来被用于事后扩大或缩小射程。

round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心直觉（均势冲突催化分配规范涌现）在经验上有支撑，IEA=1.5属于中等，测量口径在stalemate和norm_emergence两侧已基本注册。但推论被判needs_revision的核心原因是红旗10命中：因果增量机制的独立性未被显式化。文件声称"冲突比无冲突更快"，但承重砖AXIOM-003+THEOREM-competition-norm已经覆盖了"反复交互→规范涌现"，BR-L2-047的增量应当是"冲突作为反复交互的特定子类型，为什么额外加速"。文件没有给出独立的因果通道（如冲突提高了违约的可见性与代价/改变了信息结构/增加了规范试错的反馈信号强度），而是把"反复碰面"直接替换为"反复冲突"——这是把结论替换为前提的弱论证。反例猎捕未净杀（5例中2个被消化），但揭出3个should级过度伸张（群体层级未限定、规范类型预设过窄、反向失败模式缺失）。总体差一口气：核心机制的因果增量需要被显式论证才能verified。
  red_flags: |
    1. brick=conclusion：未命中——增量("冲突比无冲突更快")不被AXIOM-003/THEOREM-competition-norm平凡强制，原砖不区分有冲突与无冲突的时间差。
    2. 逐格判空：未命中——"出现时间显著短于对照"是真经验主张，含时间变量与对照组。
    3. 测量轴正交：轻度命中——"规范出现"的田野判定标准("被引用为规矩")可能受冲突可见性影响，需注意但非fatal。
    4. 射程/排除钩子独立于结果：未命中——"一次性毁灭性冲突"按事前军事力量/领土控制渠道排除，非事后开脱。
    5. 分类判据档位匹配：未命中——均势用连续量(0.5-2.0力量比/0-10量表)，规范涌现时间也用连续量，档位匹配。
    6. anti-talisman真兑现：真兑现——军事力量比、UCDP编码、轮次收敛等多重独立事前可测指标已注册。
    7. 现实锚事实核查：轻度命中——Ellickson夏斯塔县篱笆纠纷是个体层面而非群体层面的锚点，外推到"两个群体"需额外论证。
    8. 条件是下定义还是做预测：未命中——"冲突重复+均势"是可证伪的预测条件，非定义。
    9. 枚举穷尽+species按判据定义：未命中——无枚举声明，不适用。
    10. primary_suspect指对+平凡化检查：命中——文件自认最弱腿是IEA不足，但真正的更致命软肋是因果增量机制未被显式化：凭什么"冲突"比泛化的"反复交互"额外加速？文件未给出独立的因果通道，仅把THEOREM-competition-norm中的"反复碰面"替换为"反复冲突"。这是required级缺陷。
    11. 口径完整注册+歧义反向裁决：轻度命中——"无冲突对照群体"的口径未注册(地理隔离/时间前后对比/跨文化比较？)，需should级补充。
    12. 数据源同根冒充多源独立：未命中——Ostrom/Ellickson/Knight与Young/Bowles & Gintis来自不同机构不同方法，独立性成立。
    13. API可及性冒充认识论独立性：不适用——推论不依赖API查询。
    14. 反向失败模式缺失：轻度命中——推论注册了证伪条件但未注册"冲突烈度过高反而抑制规范涌现"的反向失败模式(超出"一次性毁灭性"的中间地带)，should级补充。
    15. Bootstrap限定缺失：不适用——不涉及新技术介导。
    16. 验证对象存在性未标注：未命中——长期均势冲突群体(冷战、边界争端、资源争夺)在历史与实验室中均可观测。
  counterexample_hunt: |
    构造5个反例：(1)瑞士钟表行业和平但快速涌现规范——被消化(不否定冲突情境更快，只否定无冲突不能涌现)。(2)索马里长期冲突但无分配规范——被消化(被"均势"限制条件排除，非双方均势而是多碎片化)。(3)印巴均势冲突但克什米尔水资源分配规范至今未稳定——揭出过度伸张：推论未限定群体层级(社群vs主权国家)，should级。(4)部落复仇循环中均势冲突催化出的是报复规范而非分配规范——揭出过度伸张：推论预设了"分配规范"为被催化对象，实际催化类型可能更宽泛，should级。(5)冷战均势中部分规范由外部大国推动而非纯内生——被消化(内生+外部不矛盾)。净结果：未净杀，但揭出3个should级问题(群体层级未限定、规范类型预设过窄、反向失败模式缺失)。
  required_fixes:
    - "1) 因果增量机制必须显式化：为什么\"冲突\"比泛化的\"反复交互\"额外加速规范涌现？需给出至少一条独立的因果通道(如：冲突提高了违约代价的显性化→试错反馈信号更强；或冲突改变了信息结构使得违规可见性陡升；或冲突压缩了试错的容忍窗口迫使快速收敛)，而非仅把\"反复碰面\"替换为\"反复冲突\"。"
    - "2) 注册\"无冲突对照群体\"的操作化口径：是地理隔离的相邻群体、历史前后对比、还是跨文化匹配？需在norm_emergence_measurability中追加对照群体定义。"
    - "3) 注册反向失败模式：补充\"冲突烈度过高(虽未达一次性毁灭)反而抑制规范涌现\"这一边界条件，给出烈度上限的事前可测指标(如单位时间冲突事件数/伤亡率)。"
    - "4) 限定适用层级：将\"两个群体\"明确区分为社群层面/部落层面(强支持)与国际主权层面(弱支持/不适用)，避免从Ellickson个体层面锚点过度外推。"
    - "5) 拓宽被催化规范的类型：从\"资源分配规范\"扩展为\"冲突调节类规范(含分配、互不侵犯、报复对等、领土承认等)\"，或显式论证为何仅限于分配规范。"
  oneline: |
    核心直觉有支撑但因果增量机制未被显式化(为什么冲突比单纯重复交互额外加速)，反例猎捕未净杀但揭出3个should级过度伸张，差一轮定向修订即可达verified。

round_3:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 3, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制(a)(b)(c)三通道在均势+重复条件下基本成立,因果增量也有显式化,反向失败模式已注册,IEA达1.5。但有几条硬伤挡住 verified:
    1. **红旗#11(口径注册)**——"无冲突对照群体"定义有未注册边界:对照的"无武装冲突或公开敌对行为"被定义为 UCDP=0,但 UCDP 只编码国家级/有组织武装冲突(>25战斗死亡/年),完全漏掉了低烈度族群冲突、牲畜偷盗、边界摩擦、诅咒/巫术冲突等被本地人认知为"冲突"的事件。这意味着在田野情境中,对照组可能根本不是"无冲突",而是"无 UCDP 编码冲突"——这恰好是事后按结果选口径的典型。
    2. **红旗#8(条件是下定义还是做预测)**——"冲突使无规则默认变得不可持续"这句话里"不可持续"没有独立于规范涌现的可测操作化。什么时候算"不可持续"?这接近于用结果定义前提。
    3. **红旗#15(冷启动限定缺失)**——作者宣称在"社群/部落层面强支持,在国际主权层面弱支持或不适用",但中间层(酋邦/早期国家/帝国边陲)未明确划线,且未注册"冷启动阶段"——即首次冲突后短期内是否反而规范解体(报复螺旋)而非涌现。
    4. **红旗#4(排除钩子)**——d子句"冲突烈度超过阈值……规范涌现时间反而延长,甚至出现规范倒退"是个排除条件,但阈值未注册分母(年均>3次怎么数?什么算一次事件?),且"伤亡率>2%"的分母(谁的人口?)未注册。
    5. **红旗#9(枚举穷尽)**——推论限定适用"社群/部落",但规范类型拓宽到"资源分配、互不侵犯、报复对等、领土承认",这四类未按【伞级判据】(是否冲突调节类)穷尽枚举,猎捕后我找到"信息交换规范"、"婚姻交换规则"也属冲突调节类但未列。
  red_flags: |
    1. **brick=conclusion**——未命中。核心命题"重复冲突+均势→规范涌现加速"未在THEOREM-competition-norm或AXIOM-003中以原文/近义窄化形态出现,桥接有真实增量。
    2. **逐格判空**——未命中。空格预测(出现时间显著短于对照)是真正可证伪的经验主张,不是同义反复。
    3. **测量轴正交(DED-007死因)**——部分命中。"冲突烈度"测量与"规范出现时间"测量异源,无明显焊点。但"均势"的0.5-2.0力量比与"控制≥50%领土"的决定性胜利定义之间存在隐含焊点(力量比用于前测,领土用于后测,但都试图捕捉同一概念)。
    4. **射程/排除钩子独立于结果**——命中(soft)。d子句的阈值"年均>3次"和"伤亡率>2%"未注册分子分母,且2%伤亡率对1000人村庄(20人死亡)和对100人村庄(2人死亡)意义完全不同,口径粗糙。
    5. **分类判据档位匹配**——未命中。"均势"从二分(是/否)放宽到连续调节变量是合理匹配。
    6. **anti-talisman 真兑现**——未命中。UCDP/PRIO的stalemate编码是事前可查的,均势指标至少有一个独立锚是真的独立测出。
    7. **现实锚事实核查**——部分命中。Ostrom的瑞士阿尔卑斯牧场案例本身支持"冲突催生规则",但 Ostrom 自己强调的是长期重复博弈与边界资源稀缺,不是"冲突催化"——作者对锚的解读有轻微过度伸张(把长期重复博弈案例包装为"冲突催化")。
    8. **条件是下定义还是做预测**——命中。"冲突使无规则默认变得不可持续"里的"不可持续"没有独立于规范涌现的操作化——什么时候算"不可持续"?接近"等到规范出现"那一刻。需注册独立于规范涌现的"不可持续"操作化(如资源损耗率、伤亡积累、退出率等)。
    9. **枚举穷尽**——命中(soft)。声称的规范类型只列了四类,但"冲突调节类规范"按伞级判据(是否调节冲突)至少还应包括:信息交换规范(战时/平时信息分享规矩)、婚姻交换规则(用以化解群体间敌意)、仪式性补偿规范、第三方调停角色。这些是相邻同类但未列。
    10. **primary_suspect 指对 + 平凡化检查**——未命中。作者自认最弱腿是"无冲突对照群体口径",指对。但还有一个更致命软肋未自认:推论的"加速"对比基线没注册——和平情境下规范涌现的自然速度是多少?有没有一个独立基线锚?若没有,"显著短于"就是个无法量化的空头支票。
    11. **口径完整注册 + 歧义反向裁决**——命中(硬)。对照群体口径"UCDP=0"未注册"低烈度冲突是否计入",且这恰好是事后选口径的典型漏洞——若猎捕到一个反例(对照组其实有低烈度冲突),作者可以事后将"无冲突"重新定义为"无UCDP编码冲突"以救推论。
    12. **数据源同根冒充多源独立**——未命中。本推论未做多源数据合并,IEA的两源(冲突研究+演化博弈)方法差异确实大。
    13. **API 可及性冒充认识论独立性**——未命中。无关。
    14. **反向失败模式缺失**——已注册(d子句),基本合格。但"反向失败"的强度未注册——是说"显著延长"还是"可能延长"?没有量级。
    15. **Bootstrap 限定缺失**——命中(soft)。未区分"首次冲突后短期(冷启动)"与"长期持续冲突"。冷启动期可能出现报复螺旋导致规范解体而非涌现,这一窗口未注册限定。
    16. **验证对象存在性未标注**——未命中。社群/部落层面的可观测案例充足,不存在空集问题。
  counterexample_hunt: |
    构造反例1:**努尔人(Nuer)与丁卡人(Dinka)1910-1930年代的边界冲突**。两族在共享牧场反复冲突、英埃共管当局无力单方压制任何一方(均势)、冲突烈度中等(年均牲畜劫掠>3次,但伤亡率<1%)。按推论预测,应快速涌现"谁该得多少"的分配规范。实际历史记录(Evans-Pritchard 1940)显示,这段时间内两族的资源分配规范不是涌现而是**退化**——从原有的"季节性迁徙默契"被频繁冲突破坏,直到殖民当局引入硬性边界才稳定下来。**结果:被部分消化**——可解释为"冷启动期规范解体"未被注册,但作者的反向失败模式(d子句)确实涵盖了"规范倒退",所以这个案例被现有框架接住,但暴露了**冷启动窗口未被显式标注**的弱点(红旗#15)。

    构造反例2:**冰岛"年代记时代"(Saga Age, 930-1030)的无王期**。冰岛无中央权威、群体间资源冲突反复发生但无人能单方消灭对方——这是教科书级的"均势+重复冲突"情境。按推论,应加速资源分配/边界规范涌现。实际上冰岛的规范(Althing、Goðorð系统、Grágás法典)的**形成时间跨越近百年**,且许多规范不是"冲突催化"而是**由特定立法者(úlfljótr等)主动编写**——说明"涌现"成分可能被高估,而"设计"成分未在推论中注册。**结果:揭出过度伸张**——推论用"涌现"(emergence)措辞,暗示自发过程,但冰岛案例显示冲突环境下的规范"涌现"经常混合了主动制度建构,这意味着推论需在"涌现 vs 设计的混合比例"上做限定。

    构造反例3:**索马里 1991-2006 的部族冲突**。均势+重复冲突+无法互相消灭——完美匹配条件。但实际观察:此期间**几乎无新规范涌现**,相反原有氏族规范被军阀武力重组取代,资源分配靠枪杆子而非规矩。**结果:净杀(soft)**——可被d子句(冲突烈度过高)救回(年均冲突事件远超3次),但暴露d子句阈值过松——索马里这类案例是否真的"烈度过高"?伤亡率2%在人口分母不同下意义差异极大。这是**红旗#4的口径粗糙**问题。

    净判:无硬净杀,但冰岛案例(混合设计成分)和努尔/丁卡案例(冷启动退化)共同暴露了**"涌现"vs"设计"的混合问题**与**冷启动窗口未被注册**两个软伤。
  required_fixes:
    - "1. 注册\"无冲突对照群体\"口径的硬边界:明确 UCDP=0 是否包括低烈度族群冲突/牲畜盗劫/边界摩擦/巫术冲突,若不包括则注册\"低烈度冲突漏计\"的事前测口径(而非事后选口径)。"
    - "2. 注册\"不可持续默认状态\"的独立于规范涌现的操作化(资源损耗率、伤亡累积速率、群体退出率中的至少一个),避免用结果定义前提。"
    - "3. 注册冷启动窗口限定:首次冲突后N年内(建议≤2年或首个5次冲突)规范涌现不必然加速,可能反而退化——需将推论主张限定在\"持续冲突≥某阈值时间后\"。"
    - "4. 收紧d子句阈值口径:注册\"年均>3次\"的分子(什么算一次?伤亡事件?劫掠事件?)和分母(双方总人口?成年男性?),以及\"伤亡率>2%\"的分母是冲突期累计还是年均、是双方合计还是单方。"
    - "5. 注册\"涌现 vs 设计\"的混合比例限定:推论应明确声称\"自下而上涌现成分占比≥某阈值(如≥50%)\"才算匹配预测;纯设计型规范(如冰岛法典由特定立法者编写)不适用本推论。"
  oneline: |
    核心机制在均势+重复条件下成立且因果增量清晰,但"对照群体口径"+"不可持续默认的操作化"+"冷启动窗口"+"涌现/设计混合"四个口径缺口拦住 verified,补齐即可。

round_4:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 4, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制"不可持续→紧迫→试错收敛"是新增增量，未与 AXIOM-003 / THEOREM-competition-norm 重叠为平凡结论，这是推论的真贡献。但存在 required 级硬缺口：(1) 反向失败模式未注册——"紧迫→耗竭-退出-重组"或"紧迫→暴力升级脱离均势"是机制可走的非涌现替代路径，这两条通道不只削弱预测，而是直接挑战核心机制的完备性。普什图-英属印度边界（19世纪到20世纪初）的百年均势冲突提供了具体活反例：年均冲突>3、伤亡率>2%、不可持续明显、双方都无法消灭对方，但稳定的资源分配规范百年未涌现。这不是边界口径微调能解释的，需要作者引入"认知跃迁"（把对方视为可谈判主体）作为前置假设或承认机制不完整。(2) 涌现时间编码的观察者盲法未强制——测量涌现时间的人如果知道冲突史，会主观压缩涌现时间，构成测量轴隐性焊点。(3) "自发试错≥50%"的精确测量协议未给。d 子句阈值、层级限定、对照口径、IEA 标注均已做扎实，三轮修订积累有效。非 DED-004/007 复发。
  red_flags: |
    1. brick=conclusion：未命中。新增增量（紧迫催化）确实不在父砖里平凡强制。
    2. 逐格判空：未命中。预测有经验内容、可证伪。
    3. 测量轴正交（DED-007 死因）：未命中但有缺口——观察者盲法未强制（should 级）。
    4. 射程/排除钩子独立于结果：未命中。d 子句、冷启动、层级均事前可测。
    5. 分类判档匹配：未命中。连续量阈值合理。
    6. anti-talisman 真兑现：未命中。均势和不可持续均为前测指标。
    7. 现实锚事实核查：未命中。Ostrom/Ellickson/Knight/Young/Bowles&Gintis 引文均正确，但 Ostrom 案例并不直接论证"加速"而是论证"长期自主治理"——这是论证力度问题，不是事实错。
    8. 条件是下定义还是做预测：未命中。可证伪预测。
    9. 枚举穷尽+species 判据：未命中。4子类限定清晰，第 N+1 类（停火管理、战时沟通）已被层级限定吸收。
    10. primary_suspect+平凡化：部分命中。作者自认弱腿正确（IEA 弱、田野对照难得），但更致命软肋是反向失败模式和观察者盲法。
    11. 口径完整注册：未命中。所有阈值的分子分母、口径均完整注册，无事后选择。
    12. 数据源同根冒充多源独立：未命中。仅 2 来源且独立性系数 0.5 已诚实标注。
    13. API 冒充独立性：未命中。无 API。
    14. 反向失败模式缺失：**命中（required 级）**。"紧迫→耗竭-退出-重组"和"紧迫→暴力升级脱离均势"两条通道未注册，与核心机制因果方向相反，必须补。
    15. Bootstrap 限定缺失：未命中。冷启动窗口已注册。
    16. 验证对象存在性未标注：未命中。难获得纯无冲突对照已在 r3 显式标注。
  counterexample_hunt: |
    猎捕#1【净杀候选】：普什图部落区 vs. 英属印度边界（19-20世纪初）——百年均势冲突，年均冲突事件>3、伤亡率累积远超2%、双方军事力量长期1:1、不可持续明显、双方都无法消灭对方（最终英国也没能征服普什图部落），但稳定的资源分配规则在百年间未涌现。命题预测涌现加速，实际是规范停滞。结果：未被命题干净吸收——辩护只能事后调"均势不彻底"或引入"可谈判性主体性"这一**未注册前提**。这构成 required 级洞见，因为机制的反向失败通道未注册。猎捕#2【被消化】：纯无冲突+涌现快的案例不可获，但这是经验事实，已在 r3 通过"低烈度冲突漏计"前测机制吸收。猎捕#3【被命题吸收】：d 子句高烈度阈值已注册反例空间。猎捕#4【轻微缺口】："自发试错≥50%"的精确测量协议未给（should）。猎捕#5【被吸收】：战时沟通规范、停火管理属设计成分高的子类，被 e 子句排除。
  required_fixes:
    - "1) 在核心机制旁注册\"反向失败通道 A\"——\"紧迫→耗竭-退出-重组（部分成员迁出使群体缩小后自然均衡）\"，明确这是机制可走的非涌现路径，并对该路径下的可观测签名（群体规模单调下降、资源人均占有回升）做事前描述。"
    - "2) 在核心机制旁注册\"反向失败通道 B\"——\"紧迫→暴力升级脱离均势（单方面决定升级到能消灭对方）\"，并明确 d 子句阈值（>3次/年、>2% 伤亡）是机制失效的边界。"
    - "3) 显式引入\"双方均把对方视为可谈判主体\"作为涌现的前置假设（level-2 前提），并在普什图案例上自检：该前置在此案例中是否成立？如果不成立，明确标注\"机制在此类不成立前置下失效\"，不靠事后调参解释。"
    - "4) 强制涌现时间编码者对冲突史盲法（编码者不应知道群体的冲突史），否则测量轴存在观察者期望效应导致的隐性焊点。"
    - "5) 为\"自发试错≥50%\"补充精确测量协议（例如：随机抽样 N 个微事件，由两名独立编码者盲法分类为\"自发\"或\"设计\"，要求 Cohen's κ≥0.7 视为可测）。"
  oneline: |
    核心机制真有新增增量，但"紧迫→收敛"漏掉了"紧迫→耗竭退出/暴力升级"这两条反向通道，普什图百年案例构成活反例，不是措辞能救的微调——必须补反向通道和前置假设。

round_5:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 5, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: rejected
  verdict_note: |
    核心机制方向性可疑：反例猎捕发现索马里（1991至今，部族层级，均势持续30+年，无规范涌现）与北美平原印第安人平原（重复冲突+均势+自发试错，未发展出资源分配规范）两个未被任何已注册口径消化的活反例。两者都满足推论的"适用层级（社群/部落）+ 重复冲突+均势+冷启动已过+自发试错占主导"全部条件，但未观测到加速的规范涌现——这是净杀级反例。诊断：① 均势常常是规范涌现的结果而非前因（方向性可疑，命中红旗10）；② 测量轴共因（冲突持续时间同时驱动均势认知和规范涌现时间，命中红旗3/DED-007 部分复发）；③ "自发试错≥50%"编码的盲法不彻底（命中红旗6）；④ 验证对象在当前文献中近乎空集而文件未诚实标注（命中红旗16）。4轮needs_revision积累了大量限定词，但每次修补都是在推论的适用边界上挖沟，而非修补核心机制。当限定词多到推论只在"满足X+Y+Z+且不发生A/B/C"时才成立时，实质等价于"几乎不成立"——这是需要被 rejected 而不是继续打补丁的信号。
  red_flags: |
    1. brick=conclusion — 未命中。加性增量主张非承重砖直接重述。
    2. 逐格判空 — 弱命中。核心空格是真经验主张，但均势与规范涌现的方向性可疑（均势可能本身是规范涌现产物）。
    3. 测量轴正交 — 命中（required）。均势用"控制≥50%领土或消灭≥50%战斗力"——达到该状态常需双方先承认打不出胜负，这本身已是规范涌现证据，分母偷用结果。"不可持续默认状态"用资源损耗率与冲突高度共因。
    4. 射程/排除钩子 — 命中。d子句"或"关系让阈值极难触发（2%伤亡在低烈度冲突中几乎不可达），未真正划出可证伪边界。
    5. 分类判据档位 — 未命中。连续量合理。
    6. anti-talisman — 命中（required）。编码盲法对象是冲突史，但自发vs设计的区分本身需要知道规范形成史——盲法不彻底。真正的独立驱动量（认知资源投入量、违约代价显性化程度）未被独立测量。
    7. 现实锚事实核查 — 弱命中。Ellickson篱笆案是和平时期产权纠纷而非重复暴力冲突，引用为"冲突催化"核心锚是过度解读。Ostrom瑞士/日本案例未做冲突vs无冲突对照。
    8. 条件是下定义还是做预测 — 未命中。可证伪。
    9. 枚举穷尽 — 不适用。
    10. primary_suspect — 命中（required）。文件自认最弱腿是"和平对照组操作化"，但真正软肋是"冲突→均势→规范涌现"的方向性：均势常常是规范涌现的结果而非前因。
    11. 口径完整注册 — 部分命中。规范出现时间"持续6个月"分子分母未注册完整。
    12. 数据源同根 — 不适用。
    13. API冒充 — 不适用。
    14. 反向失败模式 — 未命中。r4已注册通道A/B且自检普什图，较充分。
    15. Bootstrap限定 — 未命中。r3已注册冷启动窗口。
    16. 验证对象存在性 — 命中（should）。当前文献中"重复冲突+均势+田野对照+可测规范涌现时间"的研究近乎空集，文件未诚实标注"推论描述理论可能性而非当前实践常态"。
  counterexample_hunt: |
    猎捕了4个案例：(1) 以色列-巴勒斯坦1978-2000：被消化为"主权层级弱适用"；(2) 索马里部族冲突1991至今：**未消化**——满足全部适用条件但30+年无规范涌现，维持"持续冲突+无规范"稳态；(3) 瑞士vs意大利城邦对比：差异可能由宗教改革、地形等共因解释，冲突本身贡献不明；(4) 北美平原印第安人：重复冲突+均势+自发试错，但未发展出资源分配规范。**净杀**：(2)和(4)均为未消化的活反例，削弱核心预测力。
  required_fixes:
    - "核心塌陷，无可定向修复路径（拒绝继续打补丁）："
    - "1. 若想救活，必须放弃\"冲突是规范涌现的独立催化剂\"这一强主张，改为\"在特定子条件下（如均势+社群规模适中+共享资源型经济），规范涌现概率提高\"——但这等价于放弃核心预测力。"
    - "2. 必须正面处理索马里与平原印第安人两个反例——要么论证它们不满足某个未明示的前置条件（如\"必须有共同经济活动\"），要么承认预测失败。"
    - "3. 测量轴共因问题需通过工具变量（如外生冲击导致的冲突爆发）或自然实验设计解决，否则因果方向不可识别。"
  oneline: |
    4轮needs_revision积累的限定词已把核心预测蚕食殆尽；索马里与平原印第安人是未被消化的活反例，证伪了"重复冲突+均势催化规范涌现"的强主张——这是机制方向性问题，不是措辞能救的。
