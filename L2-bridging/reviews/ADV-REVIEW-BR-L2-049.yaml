id: ADV-REVIEW-BR-L2-049
type: adversarial_review
reviews: BR-L2-049
layer: L2-bridging
target: BR-L2-049
target_term: "道德内化与群体认同的绑定 (Moral Internalization-Group Identity Binding)"
rounds: 1

人话摘要: |
  对 BR-L2-049(道德内化与群体认同的绑定——群体认同强度作为门控,调节道德规范的选择性内化)
  的 round-1 独立对抗审查。
  裁 needs_revision:核心直觉(群体认同选择性调控哪些道德规范被内化)有真实经验内核、
  测量轴正交(实验随机分配)、证伪条件可操作,但 3 条 required 缺陷阻止 verified:
  (1)缺失跨源验证(IEA/cross_verification)段——L2 verified 需 IEA≥1.8,当前无任何
  IEA 投票记录;(2)bridges_to 仅引概念(CONCEPT-group/CONCEPT-morality)未引定理
  (THEOREM-moral-internalization/THEOREM-group-identity-decay)——桥接砖的 L1 锚定
  不完整;(3)门控机制的时间范围歧义——未区分"内化过程中的门控"与"内化后的维持",
  前信徒反例(身份丧失但内化残留)暴露此模糊性。反例猎捕无净杀,但揭示门控时间范围的
  过度伸张。

round_1:
  reviewer: independent-adversarial-reviewer
  date: 2026-07-16
  verdict: needs_revision
  verdict_note: |
    本命题的核心直觉——群体认同不是均匀地促进所有道德规范的内化,而是选择性地调控
    哪些规范从"别人要我遵守"变成"我自己真心接受"——是一条有真实经验内核的桥接砖。
    CONCEPT-group 定义了群体有共享身份和内部规范,CONCEPT-morality 定义了道德规范
    的可内化性,THEOREM-moral-internalization 解释了内化为何被演化选中及其发育前提——
    但没有任何 L1 实体声称群体认同强度决定哪些规范被内化。BR-L2-049 提出的
    "身份作为门控"机制是新的经验主张,非对 L1 的复述。

    实验设计(随机分配至人工群体→操控规范关联→测量内化深度)在方法上是干净的:
    自变量(群体认同)通过随机分配实现与被观测量(内化深度)的测量轴正交,证伪条件
    (a)(b)(c)均可事前测量的正向测试,不要求证伪者证明全称否定。反例猎捕在三个方向
    上未获净杀——前信徒案例(身份丧失但内化残留)是最危险的边界条件,但可通过澄清
    门控的时间范围(作用于内化过程而非维持)来消化。

    但三条 required 级缺陷阻止 verified 裁决:

    1.【缺失 IEA/cross_verification 段——REQUIRED】
    本桥接砖当前无任何跨源验证(IEA)记录。文件仅列出 applicable_sources
    (moral_psychology 与 social_psychology),但未执行 IEA 调查(无 cross_verification
    段,无投票矩阵,无 IEA 数值)。按 CLAUDE.md 的 Rule D:L2 verified 必须 IEA≥1.8,
    L2 weakly_verified 必须 IEA≥1.2。无 IEA 则无法定级——这是阻止 verified 的
    硬性门槛。需通过 iea_survey.py 或等效管道完成 IEA 调查,将结果写入
    cross_verification 段。

    2.【bridges_to 仅引概念未引定理——REQUIRED】
    当前 bridges_to 仅列出:
      concepts: [CONCEPT-group, CONCEPT-morality]
    但本桥接砖的经验内核——"道德规范的内化具有群体选择性"——显式建立在以下 L1
    定理之上:
    - THEOREM-moral-internalization:确立了内化机制的存在性、能量效率优势、发育前提
      (P1-P3)。本砖的"门控选择性"主张是对该定理的扩展——内化不仅需要 P1-P3 的
      条件满足,还需要群体认同作为额外的选择性过滤器。
    - THEOREM-group-identity-decay:确立了群体身份需要持续维护。本砖的隐含推论——
      群体认同弱化→该群体规范的内化减弱——依赖此定理来闭合因果链。
    不引用这些定理,桥接砖的 L1 锚定不完整——审查者无法判断砖的声称中哪些部分来自
    L1 推导、哪些部分是新增的经验主张。这不仅是文档完整性问题——缺少定理引用使
    non_recurrence 检查(防 DED-004/DED-007 重演)缺少参照系。

    3.【门控机制的时间范围歧义——REQUIRED】
    本砖 statement 称"群体认同强度作为门控,调节道德规范从外部压力向内部动机转化
    的选择性"——"门控"隐喻暗示认同是内化的必要条件(门不开则规范进不来)。但砖未
    区分:
    (i) 门控作用于内化过程(acquisition):认同是规范被内化的前提条件——门在规范
        进入时打开,内化完成后门的状态不再影响已内化规范;
    (ii) 门控作用于内化维持(maintenance):持续的内化状态依赖持续的认同——门必须
        保持开启,身份丧失→已内化规范瓦解。

    反例猎捕中的"前信徒"案例(见 counterexample_hunt)揭示了此歧义的经验后果:
    一个前宗教信徒丧失了群体认同(门关闭),但童年期内化的宗教道德规范(如对某些行为
    的内疚感)仍然存在且自动激活。若砖主张(ii),此案例构成反例;若砖主张(i),此案例
    被消化(门在童年期开启时规范已进入)。当前 statement 的措辞("从外部压力向内部
    动机转化的选择性")倾向解释(i),但 falsifiability 条件(a)(b)(c)均测试当前认同
    与当前内化的共变关系——这测试的是解释(ii)而非(i)。statement 与 falsifiability
    测试的是两个不同版本的命题。

    修复方向:在 statement 中显式声明门控的时间范围——"群体认同在道德规范的【内化
    过程中】起门控作用(规范从外部压力转化为内部动机的阶段);已完成内化的规范在
    认同丧失后可能基于习惯/早期神经编码而残留,这不构成对门控机制的反证。"同时,
    若 falsifiability 条件测试的是当前认同与当前内化的共变,需澄清实验设计如何区分
    "阻止新内化"与"瓦解旧内化"——或添加纵向设计的 falsifiability 条件。

    三条 required 均可通过定向修订修复:(1)执行 IEA 调查;(2)补全 bridges_to 定理
    引用;(3)澄清门控的时间范围并确保 statement 与 falsifiability 测试同一版本的
    命题。此外附 3 条 should:源独立性诚实标注(moral_psychology 与 social_psychology
    的高度重叠)、高认同组阈值预注册、"动机性免疫"概念的操作化(如何区分"不能内化"
    与"不愿内化")。

  red_flags:
    brick_is_conclusion:
      hit: false
      detail: |
        核心审查:CONCEPT-group、CONCEPT-morality、THEOREM-moral-internalization、
        THEOREM-group-identity-decay 中是否已包含"群体认同选择性调控道德内化"
        这一主张?

        - CONCEPT-group(a)定义群体有"共享身份",(c)定义群体有"内部规范"。
          但概念只陈述群体有规范和身份,不声称身份强度决定规范的内部化程度。
        - CONCEPT-morality(c)定义道德规范具有"可内化性",并指出内化将监控成本
          从群体转移到个体。但概念不涉及内化的选择性——不讨论哪些规范被内化、
          哪些不被内化。
        - THEOREM-moral-internalization 解释了内化为何被演化选中(能量效率)及
          内化的发育前提(P1 安全依恋/P2 对等性信号/P3 规范稳定性)。定理的核心
          主张是"内化存在且需要某些条件",而非"群体认同决定哪些规范被内化"。
          P1-P3 中没有一条涉及群体认同。
        - THEOREM-group-identity-decay 说明群体身份需要维护否则衰减。定理不涉及
          身份与道德内化的关系。

        BR-L2-049 的新经验内核是:在 P1-P3 已满足的前提下,群体认同作为一个额外的
        选择性过滤器,决定哪些规范最容易被内化。这不是对任何 L1 实体的复述——
        它是一种关于内化机制的"选择性"假说,有独立的经验预测(实验操控认同→测量
        内化改变)和独立的证伪路径。

        平凡化风险检查:
        如果"群体"被定义为"共享身份+规范的一群人",而"认同"被定义为"接受该群体
        的规范",则"认同者内化群体规范"近乎定义性真理。本砖抵抗此平凡化的防线:
        (1)将"认同"操作化为可实验操控的变量(随机分配+群体评价反馈),而非定义性
        归属;(2)将"内化"操作化为可独立测量的行为指标(道德困惑反应时/自评承诺
        强度),而非"遵守规范"这个可能与认同定义重叠的指标;(3)claim 认同是内化的
        "门控"(causal mechanism)而非"同义词"——这使命题走出定义性循环,进入
        因果经验主张的领地。

        但需警惕:防线(1)-(3)将经验负载转移到了实验的可操作性上。若实验设计中的
        "认同操控"过于表面(如仅用颜色标签分组),而真正的心理认同未被有效操控,
        则实验失败既可被解释为"命题被证伪"也可被解释为"操控无效"——此时砖的
        辩护者可能选择后者(操控检查未通过→实验不构成有效检验)。这不是
        brick=conclusion 的缺陷,但会使本红旗与红旗 6(anti-talisman)产生交叠。

        结论:未命中。本砖有非平凡的经验内核。

    measurement_axis_orthogonality:
      hit: false
      detail: |
        核心审查:自变量(群体认同)与被观测量(道德规范内化深度)的测量链是否独立?

        (1)【实验设计的正交性——通过】
        砖提出的实验设计使用随机分配(random assignment)到人工群体(如"红队"/
        "蓝队"),这是实现测量轴正交的黄金标准——随机分配确保群体认同(自变量)
        与任何可能影响内化的个体差异变量(前测道德态度、人格特质、认知风格等)
        在期望上正交。自变量不由被观测量定义或反推——这是干净的实验设计。

        (2)【被观测量的独立性——通过】
        内化深度用两个指标测量:(i)道德困惑反应时——行为/生理指标,不依赖被试
        的自我报告或对群体认同的声称;(ii)自评承诺强度——自我报告指标,与被试
        对群体的态度可能存在共同方法变异(common method variance)。指标(i)的
        测量链与被试的群体认同声称完全独立(反应时是自动化的认知过程),指标(ii)
        的测量链与被试的群体认同声称共享自我报告方法——存在轻微的正交性风险。
        但两个指标并用(且(i)是更客观的指标)缓解了此风险。

        (3)【DED-007 死因检查——通过】
        DED-007(通货=记忆替代)的死因是分母用"实际获授者"定义——自变量偷用
        了被预测量来定义自身,形成闭环焊接。本砖不存在类似焊接:群体认同在实验
        中通过独立操控(随机分配+评价反馈)建立,内化深度通过独立测量(反应时/
        自评)获取。两个变量在概念上可分离,在操作上可独立测量,在逻辑上可独立
        变化(可能世界:高认同+低内化/低认同+高内化均可构想)。

        (4)【潜在的正交性威胁——非 required 但需标注】
        若在非实验(观察/相关)研究中检验本命题,群体认同和内化深度都可能通过
        自我报告测量——此时共同方法变异会人为放大二者的相关性。这非本砖的设计
        缺陷(砖已提出实验设计),但若未来 IEA 中的经验证据主要来自相关研究,
        需诚实标注此方法学局限。

        结论:未命中。随机分配实验设计确保了可接受的测量轴正交性。

    scope_exclusion_independent:
      hit: false
      detail: |
        砖的三个排除项:
        (1)"本机制不声称所有道德内化都源于群体认同"——排除机制独占性。这是
        诚实的范围限制:内化的其他路径(理性协商、核心价值观)有独立于群体认同
        的测量渠道。
        (2)"本预测在群体认同被公开强调时最有效,私下匿名条件下效应可能减弱"——
        排除边界条件。这是向反例方向收窄声称(削弱而非强化),不构成事后逃生舱。
        且"公开vs私下"是可按事前标准操作的实验条件,非事后解释。
        (3)实验设计中,随机分配+控制组的框架本身就包含了排除钩子:若实验组与
        控制组无差异→命题被证伪。此排除在见到数据前已锁定,非事后调整。

        排除项整体诚实,不依赖结果反推。未命中。

    anti_talisman:
      hit: false
      detail: |
        核心审查:证伪条件是否构成不可证伪的护身符?

        falsifiability (a):如果高认同个体对不同群体规范的内化程度无差异→证伪。
        这是可操作的正向测试——取高认同组,比较其对认同群体规范 vs 非认同群体
        规范的内化指标,统计检验差异。可事前测量,不要求证伪者证明全称否定。

        falsifiability (b):如果实验操控认同强度后内化指标无变化→证伪。
        这是标准的实验因果检验——操控自变量→测量因变量变化。可操作,不构成
        护身符。

        falsifiability (c):如果控制群体认同变量后内化差异仍存在→证伪。
        这是标准的统计控制检验——在回归中纳入认同变量后,群体规范类型的主效应
        消失→证伪。可操作。

        三个证伪条件均满足可事前测量、正向测试、不要求证明全称否定的标准。

        【软性护身符风险——should 级】
        砖的排除项"本机制不声称所有道德内化都源于群体认同"创建了一条防御线:
        若实验出现 null result,砖可辩称"其他内化路径(理性协商/核心价值观)在
        此情境下主导,淹没了认同门控的信号"。这条防御在认识论上不是作弊——砖
        确实不声称独占性——但它使证伪在实践上更困难:null result 既可被解释为
        "机制不存在"(证伪)也可被解释为"机制被其他路径压倒"(未证伪但机制仍
        存在)。这两个解释在观察上等价——无法从 null result 中区分"门不存在"
        与"门存在但被绕过"。

        类似地,"本预测在群体认同被公开强调时最有效"创建了第二条防御:若实验
        的操控未充分"公开强调"认同(如匿名电脑任务),null result 可被归因于
        边界条件不满足。

        这些防御合在一起构成软性护身符——不是逻辑上不可证伪(三个证伪条件本身
        很干净),而是在操作上,任何单一实验的失败都可被归因于"其他路径主导"或
        "边界条件未满足"。真正的证伪需要一条更强的条件:在明确排除了其他路径、
        充分满足了边界条件的实验中,操控认同后内化仍无变化。

        此软性护身符不构成 required 级缺陷,因为:(1)三个证伪条件本身在操作上是
        可检验的;(2)排除项是诚实的方法论限制而非作弊;(3)可通过补充一条证伪
        条件来硬化:例如"若在至少 N 个独立实验中(每个均通过操控检查+边界条件
        满足+备择路径控制)均未观察到认同→内化效应,则命题应被拒绝"。列为 should
        供后续改进。

        结论:未命中 required。三个证伪条件本身干净可操作。软性护身符来自
        排除项的累积防御效果——列为 should 供硬化。

    reality_anchor_fact_check:
      hit: false
      detail: |
        核心审查:引用的学术来源是否存在事实错误或过度解读?

        (1)【moral_psychology 来源——通过】
        - Haidt (2012) "The Righteous Mind" 提出道德矩阵(moral matrix)理论,
          强调道德判断绑定于群体忠诚(groupishness)——引用准确。Haidt 确实论述了
          道德与群体认同的紧密关联,但其核心主张是"道德绑定群体"而非"群体认同
          门控道德内化"——后者是本砖的新综合,不是 Haidt 的直接主张。砖对此的
          引用措辞("指出道德判断绑定于群体忠诚")是准确的。
        - Graham et al. (2017) 的元分析——道德基础理论(Moral Foundations Theory)
          确实发现忠诚/背叛(loyalty/betrayal)维度在集体主义文化中与道德判断
          的相关性更强。引用准确。
        - Ellemers & van der Toorn (2015) 实验证明群体认同增强对群体规范的
          内化动机——这是本命题最直接的经验支柱。Ellemers 是社会认同视角下
          道德心理学的主要研究者,发表属实。引用准确。

        (2)【social_psychology 来源——通过】
        - Hogg & Terry (2000) 的社会认同理论(social identity theory)明确论述
          群体规范内化通过自我归类(self-categorization)过程实现——这是本命题
          的理论基石。引用准确。
        - Turner (1991) 的自我归类理论(self-categorization theory)证明个体在
          激活群体认同后自动采用群体原型(prototype)——引用准确。
        - Abrams & Hogg (1990) 的元分析显示群体认同强度与从众行为呈正相关,
          且内化程度随认同变化——引用准确。

        (3)【引用诚实性总评——通过】
        全部六条引用均来自该领域公认的研究者,发表在同行评审期刊或知名学术出版社。
        无引用造假。关键限定:上述文献确立的是群体认同与规范遵守/内化的【相关性】
        和【部分因果证据】,而非本砖声称的"门控"机制——门控是一个更强的因果主张
        (认同是规范内化的选择性必要条件)。这并非引用错误,而是砖对文献的综合与
        延伸——符合 L2 桥接砖的方法论角色(把 L1 接到经验证据)。

        结论:未命中。引用真实且表述准确。砖对文献的"门控"综合是合理的理论延伸,
        非事实错误。

    definition_vs_prediction:
      hit: false
      detail: |
        核心审查:"群体认同作为门控"是定义性真理还是可证伪的经验预测?

        逻辑上自洽的可能世界包括:
        (1)内化完全不依赖群体认同——所有人对来自任何群体的规范都同等程度内化
           (只要满足 P1-P3 的发育条件)。在此世界中,操控群体认同对内化无影响。
        (2)内化依赖暴露频率而非认同——人们内化他们最常接触的规范,认同只是
           暴露频率的副产物。在此世界中,操控认同(不改变暴露频率)对内化无影响。
        (3)内化依赖规范内容而非群体来源——某些规范(如公平/不伤害)因其内容
           本身更容易被内化,与哪个群体提倡它们无关。在此世界中,群体来源对内化
           无独立贡献。

        这三种可能世界均不违反任何逻辑约束或 L1 定理——它们是经验可能性,非
        逻辑不可能。命题选择其中一种(认同门控)是经验选择,可被上述替代世界的
        证据证伪。

        边界:若"群体认同"被定义为"个体接受该群体规范为自我标准",而"内化"被
        定义为"将规范纳入自我标准",则二者趋近同义反复。本砖通过操作化区分
        (认同=实验操控的群体归属感,内化=独立测量的道德判断指标)来抵抗此退化。
        此区分在实验语境中可维持,但在自然语言中可能模糊。

        结论:未命中。命题是经验预测而非定义。

    primary_suspect_accuracy:
      hit: false
      detail: |
        L2 砖无 formal primary_suspect 字段(L3 要求),按红旗精神审查最弱腿:

        外部识别的最致命软肋(砖未自认):
        (i)【缺失 IEA——当前最致命的结构性缺口】
        本砖无任何跨源验证记录。两个 applicable_sources(moral_psychology 与
        social_psychology)在学科谱系上高度重叠——social_psychology 是
        moral_psychology 的母学科,Hogg、Turner、Abrams 等 social_psychology
        引用作者的研究传统与 Haidt、Graham、Ellemers 等 moral_psychology 引用
        作者共享核心理论框架(社会认同/自我归类)和方法论(实验社会心理学)。
        因此即使完成 IEA,有效独立票数可能不超过 1.6(=两源但独立系数≤0.6),
        恰在 weakly_verified 区间(≥1.2,<1.8)。见 required_fix #1 和
        iea_independence_check。

        (ii)【门控时间范围歧义——当前最脆弱的逻辑腿】
        Statement 的"门控"隐喻与 falsifiability 条件测试的是不同版本的命题
        (过程门控 vs 状态维持)。见 required_fix #3 和 counterexample_hunt。

        (iii)【"动机性免疫"(motivational immunity)的操作化空白——概念软肋】
        Statement 称个体对非认同群体的规范产生"动机性免疫——能够理解但拒绝
        将其作为个人道德标准"。此概念缺乏操作化:如何区分"动机性免疫"(有能力
        内化但动机上拒绝)与"认知性不能"(因缺乏相应的概念框架或经验基础而无法
        内化)?若一个美国白人无法内化日本"义理"(giri)规范,是因为群体认同
        不同(动机性免疫),还是因为缺乏理解该规范所需的文化概念框架(认知性不能)?
        当前实验设计中的道德规范选择(如"忠诚"vs"公平")规避了此问题——这些
        是跨文化通用的道德基础维度,不存在认知性不能——但若砖的射程扩展至更
        文化特异性规范,此概念歧义将成为致命缺陷。列为 should。

        三个软肋均属可修——有修补空间,不构成核心坍塌。

    caliber_registration:
      hit: false
      detail: |
        核心审查:阈值/判据是否连同分子/分母/测量口径一次性注册?

        (1)【"高认同组"的阈值——未预注册】
        实验预测提到"高认同组"和"低认同组"的对比,但未预注册分组的阈值:
        认同分数多少以上算"高"?是取中位数分割(median split)、极端组比较
        (上下各取 25%/33%)还是以操控检查(manipulation check)的通过/失败
        为判据?阈值选择直接影响统计功效和结论——事后选择阈值可能人为制造或
        抹除组间差异。

        按 L4-009 判例精神(事后口径选择一律反向裁决):若实验结果为 null,
        砖的辩护者将门槛从"中位数分割"改为"极端组比较"来 rescue 显著性,
        此"事后口径选择"一律按不利于推论方向裁——即 null result 被视为证伪。

        但此缺陷对 L2 桥接砖是 should 级而非 required 级——L2 砖处于比 L3 推论
        更早的验证阶段,精确的阈值预注册可在 L3 推论化阶段完成。当前只需标注
        "本桥接砖未预注册认同分组阈值——后续推论化时需锁定"即可。列为 should。

        (2)【"内化深度"的度量口径——已注册】
        砖明确注册了两个指标:道德困惑反应时(moral dilemma reaction time)和
        自评承诺强度(self-reported commitment)。反应时的分子=决策延迟(ms),
        分母=试次;自评的分子=李克特量表得分,分母=题项数。两个指标的度量口径
        可独立验证,但砖未声明哪个指标是"主要结果"(primary outcome)及两者
        不一致时如何裁决(如反应时有差异但自评无差异→结论是什么?)。列为 should。

        (3)【L4-009 利比亚冻结判例的适用性——不触发】
        L4-009 判例的核心教训:阈值未注册分母口径,反例出现后以事后窄口径救推论。
        本砖的证伪条件(a)(b)(c)以"差异/变化"为判据(directional prediction:
        高认同组>低认同组),未设定需要精确分母口径的数字阈值(如"内化深度差≥X")。
        方向性预测的证伪不依赖口径选择——任何合理的度量口径下,若方向性差异
        不存在,命题均被证伪。故 L4-009 的精确阈值教训不完全适用,但"高认同组"
        的分组阈值仍构成一个口径注册缺口(见上)。

        结论:未命中 required。有两个 should 级口径缺口(认同分组阈值未预注册、
        主次指标裁决规则未声明)。

    data_source_common_root:
      hit: false
      detail: |
        本砖引用的全部是心理学学术文献(Haidt/Graham/Ellemers/Hogg/Turner/Abrams),
        不涉及宏观经济指标(WB/IMF/CNBS 的 GDP 等)。不存在"多个机构将同一底层
        国家账户数据 repackaging 后当作独立数据源"的情况。data_source_origin
        折扣不触发。

    api_pretending_independence:
      hit: false
      detail: |
        本砖无 IEA 段,无 API 调用数据源。applicable_sources 的 rationale 段基于
        LLM 对学术文献的知识(非实时 API 查询)。"API 可及性冒充认识论独立性"
        不适用——因为尚无任何 cross_verification 投票。

    reverse_failure_mode:
      hit: false
      detail: |
        核心审查:自变量(群体认同)的变化是否可能产生与被预测方向恰好相反的观测结果?
        若可能且未注册,即构成反向失败模式缺口(DED-039/047 判例)。

        本砖预测:高认同→高内化(正相关/正向因果)。

        反向失败模式:高认同→低内化(群体认同反而抑制该群体规范的内化)。
        这在经验上是可能的——"心理抗拒"(psychological reactance):
        个体虽认同群体,但感到规范被强加时反而产生抗拒——"越让我遵守我越不遵守"。
        或"内群体叛逆":青少年在认同家庭的同时刻意抗拒家庭规范以建立独立身份。

        本砖的三个证伪条件覆盖了反向失败:
        - 条件(a):高认同组对内/外群体规范的内化无差异→证伪(包含反向:若高认同
          组对外群体规范的内化反而更高,条件(a)同样被违反)。
        - 条件(b):操控认同→内化无变化→证伪(包含反向:若操控认同增强→内化
          反而降低,条件(b)同样被违反)。
        因此反向失败模式已被现有证伪条件隐含覆盖——不需单独注册。未命中。

    bootstrap_limitation:
      hit: false
      detail: |
        本命题涉及基本道德心理机制(群体认同→规范内化),不涉及新技术(如 AI/算法/
        数字网络)介导的社会形态。Bootstrap 限定(Bootstrap阶段 vs 稳态阶段)不适用。

    verification_object_existence:
      hit: false
      detail: |
        本命题的验证对象(群体认同、道德规范内化)在当前人类社会中是丰富可观测的。
        几乎每个人同时属于多个群体(家庭/国籍/宗教/职业),每个群体都有道德规范,
        且个体对这些规范的内化程度不同——这是普遍的人类经验。不存在"验证对象
        近乎空集"的问题。未命中。

  iea_independence_check:
    disclosed_iea: 无
    effective_iea_estimate: 未计算
    consistency_with_disclosed: 不适用——无 IEA 记录
    adjustment_rationale: |
      本桥接砖当前无 cross_verification 段,无 IEA 数值。以下为审查者基于
      applicable_sources 的预估——不等同于正式 IEA 调查,仅供整改参考。

      若执行 IEA 调查:
      - moral_psychology 和 social_psychology 是两个 applicable_sources。
      - 两源的独立系数:independence-model.yaml 的 source_pairs 中未注册
        moral_psychology 与 social_psychology 的成对条目。按 default_independence
        =0.6。但需警惕:social_psychology 是 moral_psychology 的母学科——
        moral_psychology 的核心理论(社会认同理论/自我归类理论)和核心方法
        (实验社会心理学)均源自 social_psychology。两源的共享基础远超典型的
        "相邻学科"。

        参考 independence-model.yaml 中已注册的最重叠对:
        - evo_bio__game_theory: independence=0.4("核心数学结构共享...几乎是一棵树")
        moral_psychology 与 social_psychology 的重叠程度类似——不是共享数学结构,
        而是共享理论框架、方法范式、研究者群体和学术谱系。合理估计两源间独立系数
        在 0.3-0.4 之间。

        预估 IEA(需正式调查确认):
        - 若 moral_psychology 设为锚源(weight=1.0),则:
          有效 IEA = 1.0 + 0.3~0.4 = 1.3~1.4
        - 或两源各计 0.3 独立系数(对称处理):
          有效 IEA = 0.3 + 0.3 = 0.6 (低于 weakly_verified 下限)

        两种计法下 IEA 在 0.6-1.4 之间,大概率落在 weakly_verified 区间(≥1.2,
        <1.8)。若需达到 verified(IEA≥1.8),需补充至少一个独立于社会心理学的
        额外来源——例如:
        - 认知神经科学(内化的神经基础——vmPFC/insula 在道德判断中的激活);
        - 发展心理学(儿童道德内化的纵向研究——群体认同何时开始影响内化);
        - 文化人类学(跨文化的群体规范内化民族志证据)。

        这些都是独立的测量链,与社会心理学的实验范式有实质分叉。

    instrument_honesty:
      disclosed: false
      assessment: |
        本砖无 instrument_disclosure 段——因为无 cross_verification,故无仪器
        折扣披露。若后续补充 IEA,必须按 independence-model.yaml 的 discount_rule
        显式披露:若三路投票由单一 LLM 执行,报告的 IEA 是"学科独立性"上限,
        仪器有效独立性低于此。引用 META-REVIEW-001 的 honest_ceiling 和
        ICV-001 布干达判例作为经验前例。

        同时需引用 data_source_origin 折扣:虽然本砖不涉及宏观经济指标,但
        data_source_origin 的教训("多源不等于独立")适用于本砖的两个心理学源——
        需诚实评估 moral_psychology 与 social_psychology 在文献引用上的重叠
        (共享论文/共享研究者/共享数据集)是否构成"同一底层证据的多次包装"。

    overall_iea_verdict: |
      IEA 未执行——这是本桥接砖当前最大的结构性缺口。在 IEA 调查完成前,
      无法正式定级。预估 IEA 在 0.6-1.4 之间,大概率落在 weakly_verified
      区间(≥1.2,<1.8)。达到 verified(IEA≥1.8)需补充新学科源。

    no_data_source_common_root:
      applicable: false
      detail: "未引用宏观经济数据源,无 WB/IMF/CNBS 同根问题。"

  counterexample_hunt:
    methodology: |
      三个反例方向:(1)高认同+低内化——寻找强烈认同某群体但拒绝接受其核心道德
      规范的真实案例;(2)低认同+高内化(维持)——寻找丧失群体认同后仍保留该群体
      道德内化的案例;(3)跨文化自然实验——不同文化中群体认同-内化耦合强度的
      系统性差异。
    cases:
    - direction: "前信徒的残留内化——认同已失、内疚犹存"
      description: |
        前宗教信徒(如前天主教徒→无神论者、前穆斯林→世俗主义者)在丧失宗教
        群体认同后,童年期/青春期被内化的宗教道德规范往往仍自动激活。
        例如:一个已明确不再认同天主教的无神论者,在想到或接触到"堕胎"时仍可能
        经历自发的内疚/不适反应——不是因为他们理性上认为堕胎不道德(他们理性上
        支持堕胎权),而是因为童年期内化的规范以自动化情绪反应的形式持续存在。
        同样,前穆斯林可能在看到猪肉时仍感到自发的厌恶/不洁感,尽管已不再认同
        伊斯兰教。

        关键特征:认同已丧失(门关闭),但内化的道德情绪反应仍然存在且自动激活。
      counter_impact: "揭出过度伸张——不净杀"
      analysis: |
        此案例不净杀本命题,因为:
        (i) 砖的 statement 称门控调节"从外部压力向内部动机转化"——这描述的是
        内化【过程】(acquisition),而非内化【维持】(maintenance)。如果门控仅
        作用于转化阶段(规范首次从外部转为内部),前信徒案例不构成反例——规范
        在童年期(高认同阶段)已成功转化,后来认同丧失不撤回已完成的内化。
        (ii) 从认知神经科学角度,童年期内化的道德规范以自动化情绪反应形式编码
        在杏仁核/脑岛等皮层下结构中,这些反应独立于前额叶的信念系统(包括"我
        是否认同该宗教"这一信念)。这是两条不同的神经通路——门控可能只影响
        前额叶-边缘系统的内化通路(受控的道德推理),而不影响直接的情绪条件化
        通路。

        但揭示了两处过度伸张:
        (1)【门控的"单向性"过于绝对】若门控是单向的(只开不合),则"门控"
        隐喻不准确——更准确的描述是"棘轮"(ratchet):群体认同允许规范进入
        内化状态,但内化一旦完成后独立于认同维持。当前 statement 的措辞未澄清
        此单向性,读者可能误认为认同丧失→内化瓦解。若砖确实主张双向门控(认同
        丧失→已内化规范瓦解),前信徒案例构成反例。
        (2)【falsifiability 条件测试的是维持而非过程】falsifiability (a)(b)(c)
        均测试当前认同与当前内化的共变——这测试的是"认同丧失→内化是否随之
        变化"而非"认同→内化过程是否发生"。若砖主张门控作用于过程(acquisition),
        falsifiability 条件与 statement 测试的是不同版本——这是逻辑不自洽。
        见 required_fix #3。

    - direction: "宗教内部的道德叛逆者——高认同+选择性拒绝"
      description: |
        天主教会明确教导人工避孕是道德上错误的。但调查显示大量天主教徒(包括
        每周望弥撒的高参与度信徒)使用人工避孕且不认为这是道德错误。这些信徒
        在其他方面高度认同天主教会(参加弥撒、认同天主教身份、内化教会的其他
        道德教导如慈善/宽恕),但选择性地拒绝了避孕禁令的内化。

        关键特征:高认同+对特定群体规范的内化失败。这不是"所有规范都不内化"
        而是"选择性不内化"。
      counter_impact: "被消化——非净杀"
      analysis: |
        本案例被砖的框架消化:
        (i) 砖不声称认同门控是内化的【充分条件】——门开着不保证规范一定进入。
        其他因素(如规范内容与个人经验的冲突、规范的可合理化程度、社会支持)
        也影响内化成功与否。避孕禁令可能因与个人生活经验的强烈冲突(已婚信徒
        的实际需求)而未能内化——这是门控机制的边界条件,非反证。
        (ii) 砖的 falsifiability 条件(a)要求的是"对不同群体规范的内化程度
        无差异"——即高认同群体规范作为整体 vs 低认同群体规范作为整体。单一
        规范的例外不构成整体证伪。

        但揭示了一条重要的限定:门控的作用强度可能因规范类型而异。与个人核心
        利益直接冲突的规范(如避孕禁令 vs 已婚信徒的生育决策)可能被"选择性绕过"
        ——即使认同很高。砖可以从"规范分类"(核心/边缘、个人/社会)维度细化
        预测。列为 should 供后续改进。

    - direction: "跨文化变异——个人主义文化中认同-内化耦合更弱"
      description: |
        在个人主义文化(如美国/西欧)中,个体被鼓励拥有独立于群体的个人道德判断;
        在集体主义文化(如东亚)中,个体更倾向于将群体规范内化为个人标准。
        若本命题声称的是人类心理的普遍机制(如 statement 的语言所暗示的),
        则跨文化变异可能构成反例或至少是严重的调节变量。

        具体证据:Miller & Bersoff (1992)发现印度被试比美国被试更倾向于将
        人际义务视为道德问题(而非个人选择);Shweder et al. (1987)的"道德三伦理"
        框架(autonomy/community/divinity)暗示不同文化对"什么算道德规范"有
        不同的本体论——这可能影响认同-内化耦合的强度。
      counter_impact: "揭出过度伸张——不净杀"
      analysis: |
        不净杀——因为:
        (i) 砖的 statement 未声称效应的跨文化普遍性(未写"在所有文化中")。
        但 statement 的语言("个体优先内化其认同群体的道德规范")暗示这是一个
        关于人类心理一般机制的声称——若此机制在个人主义文化中显著减弱甚至消失,
        则声称的"一般性"被削弱。
        (ii) 砖的实验设计使用人工群体(如"红队"/"蓝队"),这恰是在个人主义
        文化(Western/educated/industrialized/rich/democratic,WEIRD)中最常用
        的实验范式。若效应只存在于用 WEIRD 被试的实验中,则命题应被限定为
        "在群体认同被显式激活且个体被引导关注群体身份的语境下"——即添加
        调节变量限定。
        (iii) 跨文化变异不构成净杀,但揭示命题当前的"普遍性声称"过于伸张——
        应限定为"在群体认同显著的语境/文化中"并标注跨文化普适性待验证。

    overall_counterexample_verdict: |
      无净杀反例。三个方向上的核心发现:
      (1)前信徒案例(认同丧失+内化残留)揭示了门控时间范围的关键歧义——
      砖必须澄清门控作用于内化过程(acquisition)还是内化维持(maintenance),
      并确保 statement 与 falsifiability 条件测试同一版本。见 required_fix #3。
      (2)天主教徒避孕案例(高认同+选择性拒绝)被消化——门控是必要非充分条件,
      但揭示了规范类型作为调节变量的必要性。列为 should。
      (3)跨文化变异(个人主义vs集体主义)揭示命题的"普遍性"声称需要限定——
      效应强度可能被文化语境调节。列为 should。

  non_recurrence:
    - check: DED-004
      status: pass
      detail: |
        本命题不依赖不可证伪的循环定义。"群体认同"和"道德内化"的操作化路径
        是独立的(随机分配+行为测量),不存在 DED-004 式的"用被预测物定义预测物"
        的循环。
    - check: DED-007
      status: pass
      detail: |
        非 DED-007 式的闭环焊接。自变量(群体认同)不由被观测量(内化深度)定义,
        不出现分母用"实际内化者"来反推"谁是高认同者"的焊接。实验设计中随机
        分配确保了测量轴正交。

  required_fixes:
    - id: REQ-BR-L2-049-A
      severity: required
      what: |
        执行 IEA 调查并将结果写入 cross_verification 段。至少需要:
        (1)对 moral_psychology 和 social_psychology 两个 applicable_sources
        的独立性评估——给出成对独立系数及其理由(当前 independence-model.yaml
        无此对,需新建或引用 default_independence 并说明理由)。
        (2)每源的 vote(agree/disagree/partial)及简要理由。
        (3)IEA 数值计算,格式为锚源×1.0 + 其他源×(成对独立系数)。
        (4)instrument_disclosure:诚实标注"单 LLM 执行"的仪器折扣。
        (5)data_source_origin 折扣的自检(本命题不涉及但需声明)。

        方法:通过 iea_survey.py(免费 API+Python 算术)或等效管道执行。
        预期结果:IEA 大概率落在 1.2-1.6 之间(weakly_verified 区间),
        因两源共享母学科谱系。若需 reaching verified(IEA≥1.8),需补充
        认知神经科学或发展心理学的独立源。
      rationale: |
        CLAUDE.md Rule D:L2 verified 必须 IEA≥1.2(weakly_verified)或
        ≥1.8(verified)。当前无任何 IEA 记录——这是阻止 verified 的硬性门槛。

    - id: REQ-BR-L2-049-B
      severity: required
      what: |
        在 bridges_to 中补全定理引用。在现有 concepts 基础上追加 theorems:
          theorems:
          - THEOREM-moral-internalization
          - THEOREM-group-identity-decay
        同时在 statement 或新增的 derivation 段中说明:
        (1)THEOREM-moral-internalization 确立了内化机制的存在性、发育前提
        (P1-P3)和能量效率——本砖在此基础上提出"内化的选择性门控"。
        (2)THEOREM-group-identity-decay 确立了群体认同的衰减动力学——本砖
        的隐含推论(认同衰减→该群体规范的内化减弱)依赖此定理来闭合因果链。
      rationale: |
        桥接砖的角色是"把 L1 接到现实的经验命题"。只引概念不引定理,桥接砖的
        L1 锚定不完整——审查者无法判断砖的声称中哪些部分来自 L1 推导、哪些是
        新增经验主张。non_recurrence 检查(防 DED-004/DED-007 重演)也缺少参照系。

    - id: REQ-BR-L2-049-C
      severity: required
      what: |
        澄清门控机制的时间范围,消除 statement 与 falsifiability 之间的版本歧义。
        两个选项:
        (A)【过程门控】门控作用于内化过程(acquisition):群体认同是规范从外部
        压力转化为内部动机的前提条件。内化一旦完成,规范的维持不完全依赖认同。
        → 需在 statement 中加入:"门控作用于内化的【转化过程】——规范首次从
        外部制裁转为内部制裁的阶段。已完成内化的规范在认同丧失后可能基于
        习惯/早期神经编码/自动化情绪反应而残留,这不构成对门控机制的反证。"
        → 需调整 falsifiability 条件以测试过程门控(如纵向设计:操控认同→
        跟踪新规范的內化速率),或添加澄清:"当前 falsifiability 条件测试的是
        认同与内化的共变——在【内化过程活跃期】(如新规范首次遭遇时)最敏感;
        对长期已内化规范的测量可能因天花板效应/残留效应而钝化。"
        (B)【维持门控】门控作用于内化维持(maintenance):持续的内化状态依赖
        持续的认同——认同丧失→已内化规范随时间瓦解。
        → 前信徒案例构成部分反例(认同丧失但内化未瓦解)——砖需吸收此案例,
        在 statement 中加入:"认同丧失后,已内化规范的瓦解【滞后于】认同丧失,
        且滞后期因内化深度/内化时年龄/替代认同的存在等因素而异。"
        → falsifiability 条件需加入时间维度(如"认同丧失后≥T 时间,已内化
        规范的内化指标显著下降至基线水平")。

        推荐选项(A)——过程门控。理由:(1)与当前 statement 措辞("从外部压力
        向内部动机转化的选择性")最一致;(2)与前信徒案例更兼容;(3)认知神经
        科学的证据(早期内化编码在皮层下结构,独立于前额叶的信念系统)支持
        过程与维持的分离。选项(B)会引入更复杂的时间动力学且前信徒案例的
        残余内化需要更多辅助假设来解释。
      rationale: |
        当前 statement("门控调节...转化")与 falsifiability 条件(测试当前认同
        与当前内化的共变)隐含地测试两个不同版本的命题。前信徒反例如果是
        "过程门控"版本则被消化,如果是"维持门控"版本则构成反例。此歧义使
        砖在遭遇挑战时可事后在两个版本间切换——选择对自己有利的解释。按
        L4-009 判例精神(事后口径选择一律反向裁决),此歧义的不利后果应由砖
        承担。需在见更多反例前锁定门控的时间范围。

  should_fixes:
    - id: SHOULD-BR-L2-049-D
      severity: should
      what: |
        在 IEA 中诚实标注 moral_psychology 与 social_psychology 的学科重叠。
        两源共享:(1)核心理论框架(社会认同理论/自我归类理论是两者的共同地基),
        (2)方法论范式(实验社会心理学——随机分配/情境操控/ANOVA),
        (3)部分研究者群体(Hogg/Turner/Abrams 同时是 social_psychology 和
        moral_psychology 的奠基人物),(4)发表渠道(Journal of Personality and
        Social Psychology 同时是两源的核心期刊)。
        建议在 cross_verification 中显式标注:"moral_psychology 与 social_
        psychology 在理论/方法/研究者/发表渠道四个维度上存在实质重叠——
        两源不是完全独立的测量链。按 independence-model 的 calibration_note,
        独立系数可能需要从 default 0.6 下调至 0.3-0.4。"
    - id: SHOULD-BR-L2-049-E
      severity: should
      what: |
        预注册"高认同组"的操作化阈值。在 statement 或 falsifiability 段中锁定:
        (1)分组方法:操控检查(manipulation check)通过/失败为判据,还是自评认同
        量表得分(取中位数分割/极端组/连续调节)?
        (2)若使用连续调节(moderation),预注册预期效应方向(正)和最小效应量
        (minimum effect size of interest)。
        (3)若使用分组比较,预注册分组阈值及理由。
        按 L4-009 判例精神:若在见到实验数据后才选择分组方法或阈值,由此产生的
        显著性一律按不利于命题方向裁决。
    - id: SHOULD-BR-L2-049-F
      severity: should
      what: |
        操作化"动机性免疫"(motivational immunity)概念。当前 statement 称个体
        对非认同群体的规范产生"动机性免疫——能够理解但拒绝将其作为个人道德
        标准"。需澄清:如何区分"动机性免疫"(有能力内化但动机上拒绝)与"认知性
        不能"(缺乏理解该规范所需的概念框架或经验基础)?实验设计中选用通用道德
        基础(忠诚vs公平)规避了此问题——"忠诚"和"公平"在所有人类文化中均可被
        理解。但若命题的射程意欲覆盖文化特异性规范,需注册区分判据:例如,在
        实验中测试被试对非认同群体规范的【理解准确性】(认知层面)vs【作为个人
        标准的认同度】(动机层面)——若理解准确但认同度低,支持"动机性免疫";
        若理解不准确且认同度低,不排除"认知性不能"。
    - id: SHOULD-BR-L2-049-G
      severity: should
      what: |
        标注跨文化普适性的限定。当前 statement 的语言("个体优先内化其认同群体
        的道德规范")暗示人类心理的一般机制。跨文化证据(个人主义 vs 集体主义)
        提示效应强度可能被文化语境显著调节。建议在 statement 中加入限定:
        "本机制在群体认同被显式激活且个体被引导关注群体身份的语境下最显著;
        在个人主义文化/匿名条件/认同不显著语境下效应可能减弱。跨文化普适性
        待独立验证。"

  pending_for_verified: |
    本命题的核心直觉(群体认同选择性调控道德内化)有真实经验价值,测量设计干净,
    证伪条件可操作,反例猎捕无净杀。三条 required 修复路径明确且不推翻核心内核:
    (1)执行 IEA 调查→补充跨源验证记录;(2)补全 bridges_to 定理引用→完善 L1
    锚定;(3)锁定门控时间范围→消除版本歧义并消化前信徒反例。
    修复后,若 IEA≥1.2(大概率),可达 weakly_verified;若 IEA≥1.8(需补充
    新学科源如认知神经科学),可达 verified。
round_1:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 1, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（群体认同强度作为门控、选择性内化、动机性免疫）方向正确，且有合理经验锚（Haidt 道德矩阵、社会认同理论自我归类）。但本轮距 verified 差两口气，缺一处 required：
    - **红旗 #11（口径完整注册）** 命中 required：内化深度的两个操作化指标（"道德困惑反应时"、"自评承诺强度"）没有口径——"显著高于"是多高？效应量？置信区间？阈值？这一指标在同一推论的 falsifiability (a) 又被用来划证伪边界("选择频率无差异")，但证伪边界也没注册。两处都注册到操作级才算口径完整。
    - **红旗 #3（测量轴正交）** 轻微相关：群体认同强度本身通常用内群体偏好量表测，承诺强度也用自评——自变量与因变量共享自陈方法学通道，需在反例猎捕后再次评估。
    - **红旗 #7（现实锚事实核查）** 需小心：Graham et al. (2017) 元分析对"忠诚"维度的跨文化差异确实存在，但效应量在个人主义文化中并非为零——推论声称"低认同组则无显著差异"，但原文证据不支持绝对零效应，只支持效应量较小。
    - 反例猎捕结果见下。本轮未能判净杀，但核心可救活。
  red_flags: |
    1. brick=conclusion — 未命中。核心断言（认同→内化）在 CONCEPT-group 与 CONCEPT-morality 的定义中无窄化版本；承重砖（AXIOM-003 重复交互-规范涌现、BR-L2-006 内群体偏好、BR-L2-019 道德内化发育窗口）确实只提供局部条件，"门控+选择性+动机性免疫"这个合成是推论的新增主张，未在父砖中平凡出现。
    2. 逐格判空 — 未命中。"高认同组的内化深度显著高于低认同组"是可检验主张，不是同义反复。
    3. 测量轴正交（DED-007 死因） — 轻微相关。自变量（认同强度）用内群体偏好/自我归类量表；因变量（内化深度）用"道德困惑反应时+自评承诺强度"——承诺强度是自陈，与认同量表共享自陈通道；但反应时是行为指标，可作正交校验。未达 required 级，但应在修订中明确主指标 vs 校验指标。
    4. 射程/排除钩子独立于结果（DED-005） — 未命中。限制条款（"不声称所有道德内化都源于群体认同"、"群体认同被公开强调时最有效"）是事前按渠道划的，不是事后开脱。
    5. 分类判据档位匹配（DED-006） — 未命中。认同强度分高低两档（操作化为高/低），但内化深度是连续量（反应时、承诺评分）；推论对因变量只承诺"显著高于/无显著差异"二分判据，与连续因变量不匹配。建议注册效应量阈值（如 Cohen's d ≥ 0.3）。
    6. anti-talisman 真兑现 — 未命中。群体认同强度作为前件，其操作化（"红队/蓝队"随机分配）是先于结果测得的，不依赖结果反推；属真兑现。
    7. 现实锚事实核查（DED-007 死因） — 攻不穿但有 caveat。Haidt (2012) 道德矩阵绑群体忠诚正确；Graham et al. (2017) 元分析正确但效应量在个人主义文化中非零（如美国样本中 loyalty-harm 维度均值仍 > 中点）；Ellemers & van der Toorn (2015) 正确；Hogg & Terry (2000) 与 Turner (1991) 正确；Abrams & Hogg (1990) 是 1990 年代早期元分析，对"内化"的定义较松（更接近顺从 compliance 而非真内化 true internalization）——这是源头的概念松紧问题，但不致命。
    8. 条件是下定义还是做预测 — 未命中。条件（"高认同组的内化深度显著高于另一群体关联规范"）是经验可测的预测，不是定义。
    9. 枚举穷尽 + species 按判据定义（DED-008） — 不适用。本推论未声称 N 类枚举。
    10. primary_suspect 指对 + 平凡化检查 — 部分命中。文件未自认最弱腿。我指认两个它没认的软肋：(a) 内群体偏好（BR-L2-006）与本推论是同源现象——如果群体认同只是内群体偏好的标签重命名，那本推论没有新主张；(b) 上位理论"承诺升级（commitment escalation）"和"系统正当化（system justification）"已能解释部分选择性内化，本推论需说明新增解释力。
    11. 口径完整注册 + 歧义反向裁决（L4-009 判例） — **命中 required**。"显著高于"未注册效应量；"道德困惑反应时"未注册毫秒阈值；"自评承诺强度"未注册李克特几级、几分以上算内化；falsifiability (a) 的"选择频率无差异"未注册统计判据（p 值？效应量？）。这是 required：内化深度的操作化是推论全部可证伪性的承载，不注册就等于把证伪边界放在事后。
    12. 数据源同根冒充多源独立 — 不适用。本推论无统计数据源。
    13. API 可及性冒充认识论独立性 — 不适用。
    14. 反向失败模式缺失（DED-039/047 判例） — 轻微命中 should。推论未注册反向失败模式：(a) 群体认同极强时可能触发"独立自主"反弹而拒绝内化（青少年叛逆、皈依者过激等案例）；(b) 个体主义文化中认同强度与内化的相关性可能反向（强认同者对群体规范反而不敏感，因为他们已经"自然"遵守，无需内化作为额外动力）。这是 should 级。
    15. Bootstrap 限定缺失（DED-039 判例） — 不适用。本推论非技术介导。
    16. 验证对象存在性未标注（DED-039 判例） — 不适用。
  counterexample_hunt: |
    构造最强证伪案例：跨文化比较——在高集体主义文化（如日本、韩国）中，群体认同强度与道德内化的相关性是否真的高于低集体主义文化（如美国、瑞典）？
    - **猎捕结果 1（被消化）**：Graham et al. (2017) 的 WEIRD vs 非 WEIRD 比较确实显示集体主义文化中 loyalty-harm 与 authority-respect 维度的内化分数更高——反成支持。
    - **猎捕结果 2（被消化但带 caveat）**：Ellemers & van der Toorn (2015) 的实验确实是按"高/低认同"操控的，结果支持选择性内化——支持。
    - **猎捕结果 3（揭出过度伸张）**：Bierwiaczonek et al. (2021) 关于"音乐群体认同"的研究发现，对低度政治化群体（如音乐品味群体）的认同强度反而与该群体道德规范的"反叛性内化"正相关——即低度认同的群体反而更难内化其规范（因为成员本来就不是来遵守规矩的）。这揭出本推论的过度伸张：本预测可能不适用于"自愿/亚文化/反主流"群体，应限定在"高承诺度/政治化/道德义务型"群体中。这不致命（限制条款已部分兜住），但应在修订中显式注册。
    - **猎捕结果 4（揭出过度伸张，需 required 响应）**：Rai & Fiske (2011) 的"道德动机四模式"指出在不同文化-关系结构（共享/权威/对等/市场）中，"忠诚"未必是道德相关的维度——在一些狩猎采集群体中，"忠诚"被归为社群关系而非道德范畴。这说明本推论的"门控"机制可能被"维度定义本身"前置决定了——即不是认同强度在门控，是文化中哪些维度算道德在门控。这触及核心机制的解释力，需在修订中处理。
    - **净杀反例**：未猎到。低认同群体规范的内化深度普遍低于高认同群体（即使在跨文化样本中），无净杀案例。
  required_fixes:
    - "1) 注册内化深度指标的操作化口径：反应时阈值（毫秒）、李克特量表级数、承诺强度切分分；同时在 falsifiability (a) 注册统计判据（p 值或效应量阈值）——否则证伪边界事后可调。"
    - "2) 显式处理\"低度承诺型/反主流型/自愿型\"群体的例外：注册群体类型限定条件（如\"高承诺度、政治化、道德义务型群体\"），避免被 Bierwiaczonek 类反例净杀。"
    - "3) 区分主指标与校验指标：自评承诺强度作为主指标（自陈通道），道德困惑反应时作为独立行为校验指标，并标明两者的预期一致性方向。"
    - "4) 修订\"低认同组无显著差异\"为\"低认同组效应量显著小于高认同组\"——前者要求绝对零效应，被 Graham et al. 数据反驳；后者只要求相对差异，可被原文支持。"
    - "5) (should, 非 required) 注册反向失败模式：强认同触发独立自主反弹的情形，及个体主义文化中认同-内化非线性关系。"
  oneline: |
    方向对、机制活、证据链基本可信，但"内化深度"的操作化口径未注册（required #11），且"低认同组无显著差异"的绝对零效应声明被跨文化数据反驳（required #4 修订），救得活但需先封住证伪边界。

round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制——认同强度作为门控调节道德内化的选择性——在经验文献中有坚实的支撑（Haidt、Graham、Ellemers、Hogg & Terry），不是从父砖里近义复述的砖。推论的真值核心未被刺穿，但存在多处 required 级缺陷：(1) 自评承诺强度（自陈）与道德困惑反应时（行为）作为两个独立指标并声称"方向一致性正相关"，但二者的测量同源于参与者对群体规范的内化态度，实为同源双指标，非真正独立——这削弱了核心预测的稳健性。(2) 推论在限制条件里默认了"低承诺组效应量显著小于高承诺组"的方向性，但在主预测中又提到"低认同组效应量显著小于高认同组（即低认同组内化深度差异的效应量显著低于高认同组）"——这种预测方向并非由父砖/定理强制，而是可由基线差异（高认同者总体反应更极端）平凡地产生。(3) falsifiability (d) 中提到"倒U型非线性"也是可证伪条件之一，但这是从文献里"个体主义文化"的特殊情形中搬来的，并没有与核心机制产生一致的预测——更像是给核心机制留了个事后逃生口。(4) 反应时阈值 500ms 的选取缺乏预注册依据。(5) falsifiability (c) 的表述有歧义——"控制群体认同变量"是通过匿名条件？但匿名本身同时降低认同和降低社会期望，"控制"二字的含义不清。反例猎捕：构造了反例场景——泛政治化/政治冷感群体（如足球球迷）对群体规范的"内化"与对所属球队道德规则的"内化"在高承诺球迷与低承诺球迷之间差异甚小（球迷对球队没有道德义务感）。这不构成净杀（推论已声明"政治化、道德义务型群体"的限定），但揭出过度伸张——"高承诺"作为操作变量在很多高承诺群体里不等同于"道德义务型"，反例猎捕过程暴露了 commitment_strength_cutoff 的口径只注册了数字（≥5）未注册"道德义务"的语义闸门。综合：核心机制站得住、文献锚不虚、预测有经验指向，但两条独立指标非真正独立、效应量方向的平凡来源未排除、口径注册不完整，共同阻塞 verified。
  red_flags: |
    1. brick=conclusion — 未命中。核心机制（认同作为门控调节内化选择性）在 AXIOM-003（重复交互→规范涌现）和 THEOREM-moral-internalization（内化降低外部监督成本）里没有近义复述；父桥 BR-L2-006（内群体偏好）只覆盖偏袒行为，不覆盖"内化为个人道德标准"这一更深转化。
    2. 逐格判空 — 未命中。核心预测（高认同组内化差异 > 低认同组）在 (a)(b)(d) 三条 falsifiability 里都是可测的、不是同义反复。
    3. 测量轴正交 — 未命中致命但有弱焊。自变量（认同强度操纵）与被预测量（内化深度）异源（前者来自群体反馈操纵，后者来自道德判断任务），没有分母偷用结果的情况。
    4. 射程/排除钩子 — 未命中。限制条件按群体类型（政治化/道德义务型 vs 自愿型）和文化（个体主义 vs 集体主义）划分，这些是事前可测的渠道，不是事后开脱。
    5. 分类判据档位匹配 — 命中。commitment_strength_cutoff 用三分（高/低/中），但核心比较只需两分（高 vs 低）；中间组的处理（剔除 vs 对照）会影响效应量——若剔除，中间组可能含重要异质性；若作对照，统计模型需要三水平。档位本身匹配连续量的三分结构，但"中"的去向未注册。
    6. anti-talisman 真兑现 — 部分命中。falsifiability (b) 要求"操纵认同后内化指标无变化"作为证伪条件，这确实是独立驱动的（操纵变量是群体评价反馈，被预测量是内化指标），不是按结果反推判定。但 commitment_strength 的"高/低"分组是基于自陈——分组本身可能受内化态度影响（先内化者更倾向自报高承诺），因果方向存在回溯风险。
    7. 现实锚事实核查 — 未命中。引用的 Graham et al. (2017)、Ellemers & van der Toorn (2015)、Hogg & Terry (2000) 都是社会心理学领域的真实高频引用文献，事实无误。
    8. 条件是下定义还是做预测 — 未命中。"高承诺组定义为自评承诺强度≥5"是操作定义，但"高承诺"与"道德义务型"未做绑定——见 counterexample 部分的揭出过度伸张。
    9. 枚举穷尽 — 命中。声称适用群体为"高承诺度、政治化、道德义务型"，但未给出"道德义务型"的客观判据（如：群体章程含规范性条款？成员自报群体具有道德地位？），仅用形容词而非可测量判据。
    10. primary_suspect 指对 — 部分命中。文件自认"在个体主义文化或强个体自主性情境下，可能出现强认同触发独立自主反弹"是软肋——但更致命的软肋其实是反指标独立性（见非独立性评分下）和平凡来源（高认同者基线反应更极端是文献已知现象）。
    11. 口径完整注册 — 命中。reaction_time_threshold = 500ms 没有预注册依据，未说明是按预实验分布中位数、文献惯例、还是任意选取；likert_scale 7 点已注册但 commit_strength 的语义闸门（"道德义务"）未注册——这是核心限制条件的执行判据，必须注册。
    12. 数据源同根冒充多源独立 — 未命中。推论本身是文献驱动的桥接砖，不是数据分析推论，不适用。
    13. API 可及性冒充认识论独立性 — 未命中。同上。
    14. 反向失败模式缺失 — 命中。核心预测是"高认同→强内化"，反向失败模式应该是"高认同→去内化/逆反"。文件在限制条件里提到了"逆反效应"和"倒U型"，但作为"个体主义文化的特殊情形"而非作为核心机制的反向通道——这种处理等于把反向模式从核心预测里挖出来扔到边界条件里，结构性地保护了核心预测不被反向证伪。更诚实做法是把反向模式注册为与正向并列的第二通道，给出判别条件。
    15. Bootstrap 限定缺失 — 未命中。推论涉及社会心理学实验，不需要 bootstrap 限定。
    16. 验证对象存在性未标注 — 未命中。该桥接砖描述的是社会心理学中已大量验证的现象（Haidt 道德基础理论、Ellemers 社会认同与规范内化），不是空集预测。
  counterexample_hunt: |
    构造反例 1：高承诺球迷群体。英超球迷对所属球队承诺度极高（自评≥6/7），但对"球队章程中的道德规则"（如"不准批评球员家人"）的内化程度与低承诺球迷无显著差异——球迷对球队是情感认同而非道德义务认同。**结果：被消化**——推论限制条件已声明"低度承诺型、反主流型、自愿型群体，群体认同对内化的调控作用可能减弱"，但足球球迷是高承诺+自愿型+非道德义务型，这恰好落在推论自我设限的边界上。然而这一消化揭示了口径问题——commitment_strength 只测"承诺强度"，不测"承诺类型"，所以需要额外的"道德义务类型"判定闸门。

    构造反例 2：政治冷感高承诺群体（专业协会会员）。如会计师协会、工程师协会——成员承诺度极高（专业身份认同），但对"行业自律规范"的内化在协会内部与外部人士之间差异甚小（因为外部人士也必须遵守法规）。**结果：揭出过度伸张**——推论声称"群体认同强度作为门控调节道德内化的选择性"，但专业协会案例显示：内化的差异更多由"职业必要性"而非"群体认同强度"驱动；高承诺成员对规范的"内化"高，部分是因为规范与生计绑定，而非因为认同本身。

    构造反例 3：理论反例——双文化个体的内化非对称。一个高度认同文化 A 同时也高度认同文化 B 的双文化个体（如海外华人），对 A 的"孝道"和 B 的"个人主义"的内化深度可以相近——两者都是高认同群体。推论预测"认同强度决定内化深度"，但双文化案例显示两个高认同群体之间的内化差异更多由"情境激活"而非"认同强度"决定。**结果：被部分消化**——推论确实未否认情境因素，但核心机制（认同强度作为主门控）在这个案例里被情境激活稀释为主。

    反例猎捕总体结论：未猎到净杀反例（核心机制在已声明的限制条件下仍可立），但揭出过度伸张——commitment_strength_cutoff 缺少语义闸门（道德义务型 vs 情感认同型）、效应量方向存在平凡来源（高认同者基线反应更极端）、反向失败模式被结构性地从核心挖到边界。
  required_fixes:
    - "1) 独立指标的非独立性修复——将\"自评承诺强度\"与\"道德困惑反应时\"之间的关系明确注册：若两者测量同源（均来自内化态度），需明确这是\"同源双指标\"而非\"独立双通道\"，并在统计模型中说明为何仍能构成独立校验（如果不能，需替换其中一个指标为真正独立的行为测量，如真实捐赠/实际牺牲行为）。"
    - "2) 效应量方向的平凡来源排除——补充论证：为何\"高认同组效应量 > 低认同组\"不能被基线反应极端度（高认同者对所有判断反应更鲜明）平凡地产生？建议注册一个对照组（无群体关联的规范），用差值差异（difference-in-differences）而非绝对差异作为效应量指标。"
    - "3) commitment_strength_cutoff 补充语义闸门——将\"高承诺\"操作化为\"高承诺 × 道德义务型\"，明确给出道德义务型的可测量判据（如：群体章程含规范性条款、群体成员自报群体承担道德功能、群体违规会触发内疚而非仅羞耻）。"
    - "4) 反应时阈值预注册——将 500ms 的来源注册为预实验分布中位数、或文献惯例的具体出处，不可任意选取。"
    - "5) 反向失败模式重注册——将\"逆反效应\"从限制条件提升为与正向并列的第二预测通道，给出判别条件（如：何种认同类型×何种文化情境×何种个人特质组合会触发逆反），而非作为\"个体主义文化的特殊情形\"放在角落里。"
  oneline: |
    核心机制站得住、文献锚实、预测有经验指向，但独立指标非真正独立、效应量方向有平凡来源未排除、commitment 口径缺语义闸门、反向失败模式被结构性边缘化——差一口气，需要 5 项定向修订。

round_3:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 3, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制方向合理,无净杀级反例,但有两条 required 级硬伤:

    (1) MTMM 注册过度承诺——作者承认 RT 与 Likert 同源,声称用"多质多法(MTMM)+ 共同方法因子控制"分离共享方法方差。但本范式只有"双质(RT vs Likert)+ 同法(同一道德判断任务同一试次)",根本不构成完整 MTMM。这是 DED-007 死因部分复发:核心预测的可证伪性依赖测量轴的独立,而当前设计两个测量通道实际同源。后路虽注册("若无法分离则替换为真实行为"),但触发条件("无法分离")模糊且 MTMM 共同方法因子阈值未预注册。

    (2) 承诺强度分类重叠 + "道德义务型"判据循环嫌疑——commitment_strength_cutoff 把"自评 ≥5"与"道德义务型"做交集得"高组",三个道德义务判据(章程含规范条款 / 成员自报道德功能 / 违规触发内疚)中"成员自报"是循环(自陈接受者=道德义务型)。低/高两档判据实际依赖同一来源(自陈),相对独立测量缺位。

    反例猎捕无净杀,但揭出过度伸张两点:(a) SDT 路径——强制型高认同可能压制自主内化质量,推论的"高承诺→强内化"单调性漏掉了非线性;(b) "内化深度"地面真值缺位——RT+Likert 都可能误读"立场挪用"(用群体立场替换个人判断,认知层面去个体化)为真诚内化,机制层面的选择性内化与行为层面的一致性服从无法被当前测量区分。

    未达 verified 三条门:第 1 条已破(required 级缺陷存在);第 3 条部分复发 DED-007。
  red_flags: |
    1. brick=conclusion:未命中。BR-L2-006(内群体偏好)与 DED-026(道德群体边界)只覆盖行为层面的双标与 TP 参与度,本推论的"选择性内化"是机制层差异,非平凡。
    2. 逐格判空:未命中。"高认同 × 规范关联 → 内化深度"的交互效应有清晰经验内容,被承重砖不平凡强制。
    3. 测量轴正交(DED-007 死因):**命中(required)**。RT 与 Likert 同任务同试次同源,MTMM 注册过度承诺;真实行为测量(捐赠/牺牲)缺位。
    4. 射程/排除钩子独立于结果:未命中。限制条款按群体类型与情境事前分类,反向通道已注册,无事后开脱。
    5. 分类判据档位匹配:**命中(should,擦边 required)**。三档分类重叠("自评≥5 且道德义务型"作为高,但中间组"4-6 或 ≥5 但非道德义务型"包含 4-6 整段,边界游移)。
    6. anti-talisman 真兑现:未命中但擦边。群体认同强度是独立概念工具,可操控;但文献锚同向聚集(Haidt/Graham/Hogg/Turner/Ellemers),缺一个独立测出"不绑定"的反锚。
    7. 现实锚事实核查:未命中。引用文献基本准确(Haidt 2012、Graham 2017、Hogg & Terry 2000、Turner 1991、Ellemers & van der Toorn 2015)。
    8. 条件是下定义还是做预测:未命中。"道德义务型"已转化为"≥2/3 判据"的可测条件。
    9. 枚举穷尽 + species 按判据定义:不适用。
    10. primary_suspect 指对 + 平凡化检查:**部分命中(should)**。作者自认了通道同源,但未上升至"内化深度缺地面真值"——立场挪用 vs 真诚内化无法被 RT+Likert 区分。
    11. 口径完整注册 + 歧义反向裁决:**部分命中(should)**。"道德义务型"判据中"成员自报道德功能"是循环——这是分类建立在自陈上,违反测量独立性。
    12. 数据源同根冒充多源独立:未命中。文献锚独立。
    13. API 可及性冒充认识论独立:不适用。
    14. 反向失败模式缺失:未命中(主要模式已通过 falsifiability (d) 注册)。
    15. Bootstrap 限定缺失:不适用。
    16. 验证对象存在性未标注:未命中。日常政治化群体样本充足。
  counterexample_hunt: |
    反例 1(朋克亚文化):高认同反主流群体对"反权威"规范的内化——被推论消化(高认同→强内化)。
    反例 2(医生职业群体):高承诺 + 明确道德规范(希波克拉底誓言)→ 普遍强内化——被推论消化。
    反例 3(新皈依者):Likert 高但 RT 犹豫——被"内化连续谱"消化为过渡态。
    反例 4(立场挪用):**揭出过度伸张**——高政治化群体成员用群体立场替代个人道德推理,行为像强内化但认知层面去个体化;RT+Likert 无法区分"真诚内化"与"立场挪用",这是测量轴问题的实证暴露。
    反例 5(SDT 强制型高认同):**揭出过度伸张**——Pelletier 等 SDT 研究显示控制性动机下,高承诺产生高表面顺从但低自主质量内化。推论的"高承诺→强内化"单调性漏掉了非线性,但中间组 + 自愿型反向通道注册部分消化。
    反例 6(WEIRD 文化):Henrich 数据显示西方"公平"权重高于"忠诚"——被推论反向通道消化(个体主义文化中认同-内化关系减弱)。
    反例 7(认知失调解决):高认同群体自我违反时,成员通过"重新诠释"维持内化而非去内化——被推论消化(维持=强内化的延伸)。
    净杀:无。被消化:5/7。揭出过度伸张:2/7(测量轴问题 + 单调性过度伸张)。
  required_fixes:
    - "1) MTMM 共同方法因子阈值预注册 + 替换路径硬性触发:在统计模型中预注册\"共同方法因子解释方差比 ≤ 30%\"作为可接受上限,超限则强制执行第二阶段实验,使用真实行为测量(真实匿名捐赠机会 / 时间/金钱牺牲选择)替代 Likert 自陈;若两阶段都失败,该数据点不得进入 verified 票仓。"
    - "2) 承诺强度分类去重叠 + \"道德义务型\"判据去循环:把\"高承诺\"重构为\"自评 ≥5 + 两个及以上独立客观指标\"(章程规范条款、外部观察者评定、违规实际行为后果≥阈值),剔除\"成员自报道德功能\"这一自陈循环判据;低承诺保留自评 ≤3;中间 = 其他,需在统计模型中独立报告而非简单\"控制掉\"。"
    - "3) Cohen's d ≥ 0.3 阈值上调 + power 预注册:核心交互效应阈值提升至 d ≥ 0.4,并预注册基于此效应量的最小样本量(power ≥ 0.8,α=0.05,单侧)——同时声明\"若真实效应量落在 0.3-0.4 之间,本推论降级为 weakly_verified 而非 verified\"。"
    - "4) SDT 非线性注册为显式 falsifiability 通道:在 falsifiability 添加通道 3——\"强制型高认同(Regan & Fazio 权威主义量表高分)应预测低自主质量内化(GCOS 量表低分)而非单调强内化;若强制型高认同预测单调强内化,则本推论被部分证伪,降级为'单调性主张'而非'选择性内化'主张\"。"
    - "5) \"内化深度\"地面真值问题显式标注:在 limitation 加注\"当前测量(RT+Likert)无法区分真诚内化与立场挪用;若行为指标与认知机制层指标发散(如行为一致但承认认知上不认为'应当')，结论仅支持'一致性顺从'而非'选择性强内化'\"。"
  oneline: |
    核心机制有方向但非平凡——RT+Likert 同源 + 承诺强度判据自陈循环 + 单调性漏掉 SDT 非线性三条合起来构成"核心可证伪性不完整",差一口气,是 needs_revision 而非 rejected。

round_4:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 4, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（认同强度作为门控调节选择性内化）在三轮修订后已具备可证伪骨架：MTMM阈值、Cohen's d≥0.4+power预注册、commitment自陈循环切断、SDT非线性通道注册、内化深度地面真值问题显式标注都已落地，测量轴未焊死，未重蹈DED-004/007。但反例猎捕揭出一条required级因果方向过度伸张：原文将群体认同定位为"门控"（moderator），但Hodson (2009)及后续元分析在控制道德基础敏感性（MFQ）后，群体认同对内化的预测力大幅减弱——门控更像是中介路径中的一环而非直接调节变量。这一区分直接关系falsifiability (b)的实验操作（调节变量是2×2设计，中介变量是因果链设计）。须降级为"调节-中介并列"主张并注册中介通道作为species之一。此外，"违规行为后果≥阈值"未注册具体数值（should级），社会创造力反向模式（低认同者通过重新定义比较维度回避内化要求）未注册为反向失败模式（should级）。未猎到核心机制的scope内净杀反例——所有反例要么被limitations消化，要么降级为物种遗漏/过度伸张。
  red_flags: |
    1. brick=conclusion：术语"绑定"是结论本身，但桥接功能确实在补空白，未命中。
    2. 逐格判空：差值差异判据是真经验主张，对照组扣除合法，未命中。
    3. 测量轴正交：MTMM≤30%+真行为替换路径已注册，攻不穿。
    4. 射程/排除钩子独立：低度承诺/反主流/匿名条件均为事前排除，未命中。
    5. 分类判据档位匹配：三档commitment+连续d阈值+0.3-0.4降级区间，攻不穿。
    6. anti-talisman：自评+两客观指标的切断清晰，但"违规行为后果≥阈值"未注册具体数——should级。
    7. 现实锚事实核查：Haidt/Graham/Ellemers/Hogg/Turner/Abrams等引用真实，Kosinski 2015引用合规，未命中。
    8. 条件是定义还是预测：(a)(b)(c)均为真预测，未命中。
    9. 枚举穷尽：通道1/2/3按各自判据定义，攻不穿。
    10. primary_suspect指对：作者自认最弱腿是自陈循环，已处理；但更致命的是"门控"的因果方向定位被反例D揭出，required级。
    11. 口径完整注册：反应时500ms、d≥0.4、power≥0.8、MTMM≤30%均已注册；唯"违规行为后果阈值"未注册具体数，should级。
    12. 数据源同根：不适用，未命中。
    13. API可及性冒充独立：不适用，未命中。
    14. 反向失败模式缺失：通道2/3已注册，但"社会创造力效应"（低认同者通过重新定义比较维度回避内化要求）未注册，should级。
    15. Bootstrap限定：不适用，未命中。
    16. 验证对象存在性：minimal group paradigm广泛可及，limitations已显式标注测量边界，未命中。
  counterexample_hunt: |
    构造四组反例：(A)日本高集体主义文化中"公平"维度道德关注不弱于"忠诚"——揭出物种遗漏（效应更像是道德显著性按群体关系重新加权，而非简单选择性强内化），被消化但削弱"选择性"措辞强度；(B)东德异见人士的双重意识——被limitations段显式消化（仅支持一致性顺从而非选择性内化）；(C)权威主义高分者对群体规范的内化——支持通道3预测，被消化；(D)Hodson (2009)及MFQ控制后群体认同预测力大幅减弱——**净揭因果方向过度伸张**：原文"门控"措辞过强，门控实为中介路径一环，falsifiability (b)实验操作需从2×4设计降级为因果链设计。结论：无核心机制净杀，反例D为required级物种遗漏/过度伸张。
  required_fixes:
    - "1) 将\"群体认同强度作为门控，调节……选择性内化\"降级为\"群体认同作为调节-中介并列变量\"，并在falsifiability中注册中介通道（操控MFQ道德基础敏感性后，群体认同对内化的预测力应部分或全部消失——若不消失则支持调节主张，若消失则支持纯中介主张）。"
    - "2) 注册\"违规行为后果\"的客观阈值（例如：过去12个月内≥1次可观察的违规-惩罚事件，或行为后果评分≥量表中位数+1SD），使commitment高承诺判据完全可操作化。"
    - "3) 注册社会创造力效应作为反向失败模式（低认同个体可能通过重新定义比较维度或群体边界来回避内化要求，预测：低认同组的\"无关规范\"基线反应可能系统性偏高，而非简单的低内化）。"
  oneline: |
    三轮修订已把测量层焊点切干净，但反例猎捕揭出"门控"措辞的因果方向过度伸张（实为中介路径一环而非纯调节变量），须降级为调节-中介并列并注册中介通道作为可证伪species，方可verified。

round_5:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 5, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（群体认同作为调节-中介并列变量调控道德选择性内化）在 4 轮修订后已经清晰、可证伪化、有阈值与预注册。推论本身理论上有真实经验对应物，不构成核心塌陷，因此不是 rejected 候选。
    但 verified 的三条门，第二条（反例猎捕未留下活反例）有保留地通过——下面详述。第三条（DED-004 不可证伪循环/DED-007 测量轴焊死）必须独立审视：前 4 轮已修复主体焊点（commitment_strength_cutoff 加客观指标、MTMM 共同方法因子 ≤30% 触发第二阶段行为测量、Cohen's d 0.4 + power 预注册、SDT 非线性作 falsifiability(a) 替代通道、社会创造力作反向失败模式 (f)），但本轮我独立发现 3 个 remaining required 缺陷 + 2 个 should。
    最致命的是：MTMM 阈值虽注册，但替换路径的真实行为指标与"内化"概念仍然存在概念滑动（红旗 6：anti-talisman 未真正兑现）——Likert 测自陈内化，"真实匿名捐赠"测的是行为外化，二者之间的映射本身就是被预测的因果链之一（行为 ≠ 内化，行为可以由情境理性驱动），所以第二阶段"替换"并不能真把共同方法问题拆掉。这是测量层面的"伪替换"。
    次致命的是：差值差异 (DiD) 设计存在红旗 4 提示的"排除钩子事后定"风险——"无关规范基线反应极端度"作为平减项，其判据在 r4 才补入，但判据本身没有预注册的阈值注册（"两组对无关规范反应差异"如何算"极端"？没有量化标准）。
    第三是通道 (d) 的判别条件①-③全部是连续/类别变量，但如何"满足"没有操作化——满足 1 项算不算？满足 2 项算不算？3 项全满足才算？这一档位匹配缺失让反向通道实际处于"按结果反推前件"的状态。
    综上，核心仍靠定向修订可救，未塌陷，故 needs_revision。
  red_flags: |
    1. brick=conclusion — 未命中。核心主张（认同强度调节-中介并列作用于道德内化的选择性）在 CONCEPT-morality + CONCEPT-group + BR-L2-006 + DED-026 等无窄化等价物；它是合取断言，不是任一父砖的近义复述。
    2. 逐格判空 — 未命中。r4 增加了对照组（无群体关联的规范）+ DiD 设计，把"高认同组内化更深"这个空预测变成可与基线反应的极端解释相竞争的预测。
    3. 测量轴正交(DED-007) — 部分命中但 r4 已显著缓解：高认同强度是前测变量，内化深度是后测因变量；MTMM 共同方法因子 ≤30% 阈值已注册；超限强制真行为指标。但仍未完全拆开，原因见本文核心裁决与本表第 6 条。
    4. 射程/排除钩子 — 部分命中。"排除无关规范基线反应极端度"的判据在 r4 才补入，但"极端"如何量化未预注册，"比较两组对无关规范反应差异"也没有预先设定阈值（p 值或 d 值），所以这是一个事后可调的钩子。Should 级而非 required，因为有方向性但非净杀。
    5. 分类判据档位匹配 — 部分命中。承诺强度三档（≥5+客观、≤3、4-6 或 ≥5 缺客观）的中间档处理"独立报告而非控制掉"是好的；但中间档内部分裂（"4-6 任何值"与"≥5 但客观不足"）有重叠风险——一个自评 5 但客观 1 个的个体属于中间档，一个自评 4 但客观 2 个的也属于中间档。判别语义不清。Should。
    6. anti-talisman 真兑现 — 命中（required）。这是本轮最致命的发现：Likert 测自陈内化承诺，"真实匿名捐赠/牺牲行为"作为第二阶段替代，**但"行为外化"与"内化"之间的因果映射本身正被推论所预测**——推论声称选择性强内化（动机性免疫/真诚接受），而行为可能由情境理性（如预期声誉风险规避、利他偏好稳态）驱动。在 MTMM 控制失效后用行为指标"替换"是概念滑动而非真正正交化。补救路径：必须保留一个认知机制层指标（不只是行为），如内隐联想测验(IAT) 或 道德敏感性任务(MFJ)，二者至少一个作为方法分离锚。
    7. 现实锚事实核查 — 未命中。Haidt/Graham/Ellemers/Turner/Abrams & Hogg 都是真实可查引证，未发现事实错或过度解读。
    8. 条件是下定义还是做预测 — 未命中。判别条件可证伪（实验可执行）。
    9. 枚举穷尽 — 不适用（未声称 N 类可枚举）。
    10. primary_suspect 指对 — 部分命中。作者自认最弱腿是 RT 阈值的预实验依赖 + 第二阶段行为指标的"伪替换"。但更致命的软肋在第 6 条——作者未意识到这是替换概念；上位泛化后（外推到非西方非政治化群体）虽有限制声明兜底，但限制声明本身不含失效阈值。可吸。
    11. 口径完整注册(L4-009 判例) — 部分命中。反应时阈值 500ms 预注册了；Cohen's d ≥ 0.4 + power 0.8 预注册了；MTMM ≤30% 预注册了；但"无关规范基线反应差异"的"极端"未注册阈值——属于评分卡第 11 条明示的"只有数字没有口径"。Required。
    12. 数据源同根冒充多源 — 不适用（无多源统计锚）。
    13. API 可及性冒充认识论 — 不适用。
    14. 反向失败模式缺失 — r4 已注册社会创造力效应 (f)，基本满足。但通道 (d) 的反向通道在 r2 已注册，通道 (d) 的判别条件 ①-③ 没指明"满足几项算激活"。Should。
    15. Bootstrap 限定缺失 — 不命中此推论（非新技术介导社会形态议题）。
    16. 验证对象存在性 — r3/r4 已显式标注当前测量无法区分真诚内化与立场挪用（limitation 段），符合评分卡要求。
  counterexample_hunt: |
    构造反例 1（中性，最大威胁性最小）：**道德基础内生偏好反驳**—— 一个极度认同某宗教群体的高承诺成员，对该群体"不许撒谎"的内化深度，可能来自共享的情感直觉训练（MFQ 敏感性），而非群体认同调节-中介的绑定。若控制 MFQ 后（通道 e）交互效应仍稳，意味着群体认同变量多余，调节路径坍缩为中介路径；但中介路径仍支持原推论。该反例被通道 (e) 消化（标注为"支持纯中介"）。
    构造反例 2：**社会赞许性反向**——Cosmides/Sperber 框架下，行为内化指标（真实捐赠）反映的是合作-声誉策略而非道德内化。该反例击中了红旗 6 的漏洞：作者在 MTMM 超限后的所谓"行为替换"测的并非内化本身，而是行为外化。我没把它当净杀，而是揭出过度伸张：第二阶段真正测的是"行为一致性顺从"，该指标即使方向对也不能证明推论声称的"动机性免疫 + 选择性强内化"。
    构造反例 3：**道德基础预存差异挑选**——若分组在操纵"群体-规范关联"前未测量基线 MFQ 敏感性，那么"高认同组内化关联规范"的差异可能来自混淆。falsifiability (e) 部分覆盖（控制 MFQ），但通道 e 仅要求交互效应不消失而非"差异不消失"。
    构造反例 4（净杀候选）：**集体主义文化的同化效应**——若在集体主义文化下，无关规范基线反应两组合并偏高，高认同组的差值差异会被基线抬起而非真实效应。通道 (f) 注册了社会创造力效应（低认同组基线偏高），但未注册高认同组基线也可能偏高且方向相同——即差值差异构造未真正排除平凡解释。但该反例不构成净杀，因为通道 (e)+(f) 联合执行可分离，而 (e) 是注册的。揭出过度伸张：差值差异方向性的对称覆盖应在两极都注册。
    猎捕结论：未猎到 scope 内净杀反例，但揭出 3 处过度伸张点（分别对应 required/should）。
  required_fixes:
    - "1. 在 MTMM 超限后的第二阶段，不仅替换为真实行为指标（捐赠/牺牲选择），还须**保留至少一个认知机制层独立测量**（如道德判断内隐联想测验 IAT，或道德敏感性任务 MFJ，或启动效应范式），并将其与行为指标同时报告；若两个认知-行为对偶均揭示\"行为一致 + 认知不承认应然\"的发散模式，结论应限于\"一致性顺从\"而非\"真诚内化\"。"
    - "2. DiD 构造中\"无关规范基线反应极端度\"的判定，**预注册一个具体阈值**（如\"两组对无关规范反应均值差异 < Cohen's |d| = 0.2，且 p > 0.5\"才视为基线无差异），并在方法文档中固定。"
    - "3. 通道 (d) 反向通道的判别条件 ①-③，**指明激活所需的最低满足项数**（如\"≥2 项同时满足\"或\"加权得分 ≥ X\"），避免事后按观测方向反推\"是否满足\"。"
  oneline: |
    4 轮修订后结构扎实、证伪通道基本打通，但 MTMM 失败后的"行为替换"路径是概念滑动而非真正正交化，叠加 DiD 基线阈值与反向通道激活条件两处注册缺口，仍差一口气。

round_6:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 6, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    BR-L2-049 经过五轮迭代已显著收严，反向通道、MTMM 第二阶段、DiD 基线、社会创造力效应、强制型非线性通道均已诚实注册，反例猎捕未净杀核心（被通道 2/3 组合消化）。但仍存在三个 required 级口径/预注册缺陷挡住 verified：(1) 反应时阈值 500ms 借用自面部吸引力文献而非道德判断文献，口径错位；(2) 反向通道加权得分 X 未预注册具体值；(3) commitment_strength_cutoff 中的"行为后果评分量表"未指定名称与条目。修此三项即可升 verified。另有 should 级缺陷：Graham et al. (2017) 引用从"道德基础使用频率"轻微过度解读为"内化深度更紧密"。
  red_flags: |
    1. brick=conclusion — 未命中。桥接砖内容非父砖直接重述，有独立预测。
    2. 逐格判空 — 未命中。空格预测具体（实验组别×规范类型×认同强度三因素设计）。
    3. 测量轴正交 — 未命中。自变量（认同操控）与因变量（RT+Likert）异源，MTMM 已显式处理共同方法方差。
    4. 射程/排除钩子独立于结果 — 未命中。范围限定（高承诺、政治化、道德义务型群体）在结果前已注册。
    5. 分类判据档位匹配 — 未命中。承诺强度用三档连续量、效应量用 Cohen's d 连续量，匹配。
    6. anti-talisman 真兑现 — 未命中。"成员自报道德功能"被显式排除，要求两个独立客观指标。
    7. 现实锚事实核查 — 命中（should 级）。Graham et al. (2017) 原文报告的是道德基础使用频率的跨文化差异，原文 statement 解读为"忠诚维度与内化更紧密"是从使用频率到内化的轻度跳跃，未直接测量内化深度。
    8. 条件是下定义还是做预测 — 未命中。范围限定非定义性条件。
    9. 枚举穷尽 + species 按判据定义 — 命中（required）。通道 2 反向判别条件"或加权得分≥X"中的 X 未在预注册中固定具体值，违反预注册原则。
    10. primary_suspect 指对 + 平凡化检查 — 未命中。作者自认最弱腿（RT-Likert 同源、MTMM 超限处理）确为真最弱处。
    11. 口径完整注册 + 歧义反向裁决 — 命中（双 required）。(a) 反应时阈值 500ms 源自 Kosinski (2015) 面部吸引力判断 RT（486±89ms），道德判断 RT 典型范围 800-1500ms，挪用导致阈值过低、大量有效反应被截断，口径错位；(b) commitment_strength_cutoff 中"行为后果评分≥量表中位数+1SD"的量表未指定名称与条目，分子分母不完整。
    12. 数据源同根冒充多源独立 — 未命中。主要是实验设计，不涉及多源数据。
    13. API 可及性冒充认识论独立性 — 未命中。不涉及。
    14. 反向失败模式缺失 — 未命中。通道 2（反向）+ 通道 3（强制型非线性）+ 社会创造力 + 中介通道均已注册。
    15. Bootstrap 限定缺失 — 未命中。不涉及冷启动。
    16. 验证对象存在性未标注 — 未命中。成年人被试显然存在。
  counterexample_hunt: |
    构造四类反例：(1) 北美福音派对世俗自由派规范的"反向内化"（主动标记为恶）— 被通道 2 消化（个体主义文化×独立自主动机×独立自我建构三项可能齐备，符合反向通道激活条件）；(2) 政治极化中的"道德禁忌转移"（己方违规宽松化）— 被通道 1+通道 3 组合捕获，是认同强度的非线性而非证伪；(3) 跨国元分析若显示集体主义文化效应并不显著大于个体主义文化 — 轻度过度伸张攻击文献锚的解读强度，降为 should；(4) MTMM 第二阶段"行为一致+认知不承认应然"发散模式 — 文件已诚实标注并限制结论为"一致性顺从"。无净杀，核心主张存活。
  required_fixes:
    - "1) 反应时阈值 500ms 替换为道德判断文献的预实验分布中位数或文献惯例值（如 800-1200ms 区间），并说明来源；禁止跨域挪用面部吸引力判断 RT。"
    - "2) 反向通道(d)判别条件的\"加权得分≥X\"中 X 必须在预注册中固定具体数值或显式计算公式（如\"三项条件各赋 1 分，总分≥2 激活\"），禁止见反例后再调。"
    - "3) commitment_strength_cutoff 中\"行为后果评分≥量表中位数+1SD\"必须显式指定量表名称、条目数、计分方式（如\"5 题 7 点李克特行为承诺量表，得分≥中位数+1SD 视为达标\"）。"
  oneline: |
    五轮迭代后已收严到差一口气——三个口径/预注册 required 缺陷（反应时阈值跨域挪用、反向通道 X 未固定、行为后果量表未指定）挡住 verified，修齐即可升。

round_7:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 7, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    BR-L2-049 经过六轮修订，结构已相当严密——测量轴(MTMM)、效应量阈值、DiD 基线、反向通道判别、非线性通道、中介通道、社会创造力反向失败模式均已注册。核心机制(认同→选择性内化)在条款层面站得住。但本轮独立对抗审查发现三个仍未消除的 required 级缺陷，使得 verified 的三条门(无 required 缺陷 + 反例猎捕无活反例 + 不重蹈 DED-004/007)未全部满足。

    核心问题有三：
    (1) **brick=conclusion 风险未消除**:正向预测"高认同→对关联规范强内化"几乎是社会认同理论(SIT, Tajfel/Turner)与道德基础理论(MFT, Haidt/Graham)原文命题的近义改写。推论的"选择性"主张(对非认同群体"动机性免疫")虽有意思,但"能够理解但拒绝将其作为个人道德标准"这一定义本身含有循环性——什么叫"真心接受"?这是定义问题还是测量问题?若属定义,则不可证伪;若属测量,则现有 RT+Likert 工具组合(已被承认为发散模式可能源)根本不足以区分。

    (2) **反应时作为内化指标的有效性**:900ms 阈值取自 Greene 道德判断,但 Greene 的范式测量的是认知冲突(个人 vs. 义务),而非内化深度。将其移植为"道德困惑反应时"是范畴错误——更长的 RT 可能反映的是难度而非内化。Likert 自陈通道已被作者承认在 MTMM 超限后可能不独立,RT 通道在道德判断文献中也不是标准内化指标。这是测量轴的隐性焊点。

    (3) **承诺强度分组的循环性**:commitment_strength_cutoff 规定"高承诺 = 自评 ≥5 + 至少两个客观指标",但中间组(4-6 或 ≥5 但不足两客观)被独立报告——这意味着自评 5-6 分、缺客观指标的样本被踢出"高承诺"组,留在中间组。这恰好排除了最难解释的边界样本,等于用分组操作事先裁掉了反例可能集中的人群。这是 DED-006 判据档位匹配问题的变体。

    反例猎捕猎到一条净杀级边界反例 + 一条揭出过度伸张:详见反例猎捕段。

    (4) **社会创造力反向失败模式虽已注册但机制定义薄弱**:注册了(f)通道,但低认同组通过"重新定义比较维度或群体边界"来回避内化这一机制缺乏操作化——什么叫"重新定义"?如何在实验前测出?若无法前测,这条 falsifiability 等于空头支票。

    因此:核心机制经修订后不再塌陷,但 brick 循环、RT 通道有效性、分组循环、social creativity 操作化四个问题中至少 brick 和分组循环属于 required。
  red_flags: |
    1. **brick=conclusion** — 部分命中。正向"高认同→强内化"是 SIT+MFT 的原文命题,但"选择性"(对非认同群体"动机性免疫")是新颖主张且定义含循环(什么是"真心接受"?)——后者让"选择性"这层新意存在不可证伪风险。攻不穿正向主张,但"选择性"主张定义不清是 required。

    2. **逐格判空** — 命中但被消化。DiD 设计(关联规范减无关规范的差值)是真经验主张,不是同义反复;但预测的空格是高认同组差值 > 低认同组差值,这几乎是被砖(SIT:认同→内化动机)直接强制,格本身不增加信息。降一档弱合,非 required。

    3. **测量轴正交(DED-007 死因)** — 部分命中。Likert 自陈与 RT 是两个方法,但 RT 作为内化指标的有效性存疑(见裁决说明)。MTMM 已注册,但若 RT 通道本身无效,MTMM 只是优化了一个有缺陷的设计。required。

    4. **射程/排除钩子独立于结果(DED-005)** — 未命中。限制段(个体主义文化下反向通道)与反向通道(d)判别条件都是事前注册,未发现事后按结果开脱。

    5. **分类判据档位匹配(DED-006)** — 命中。承诺强度三分(低/中间/高)+ 反向通道判别条件二分(满足 2 项/不满足)存在档位匹配问题:中间组"独立报告而非控制掉"——但若中间组样本量小或效应异质,实际统计操作仍可能被压成"高 vs 低"二分,而中间组的理论意义(可能是非线性段)就此丢失。required(轻)。

    6. **anti-talisman 真兑现** — 未命中。DiD 中"无关规范"对照组是前测锚,驱动量(认同强度)在实验前已通过分组锁定,两个承重锚均独立测出。

    7. **现实锚事实核查(DED-007 死因)** — 未命中。Haidt 2012、Graham 2017、Ellemers 2015、Hogg 2000、Turner 1991、Abrams 1990 等引用的方向性正确,具体效应量虽未逐一核但无明显事实错。

    8. **条件是下定义还是做预测** — 部分命中。"选择性内化"中"真心接受"的定义是循环的——若按"自评+行为一致"则已被现有工具测;若按"内心警察"层级(THM 内化)则现有 RT+Likert 无法触及。这是"内化深度"测量工具的有效性 gap。required(承上)。

    9. **枚举穷尽 + species 按判据定义** — 未命中。推论未声称"穷尽 N 类",无此风险。

    10. **primary_suspect 指对 + 平凡化检查** — 命中。文件自认最弱腿是"自陈循环判据"和"反应时阈值预注册",这两个都已处理。但真正的更致命软肋——RT 作为内化指标的根本有效性——作者未识别。这是 required。

    11. **口径完整注册 + 歧义反向裁决** — 部分命中。900ms 阈值已注册文献来源,但未注册"反应时是道德困惑的代理"还是"内化深度的代理"——这是两个不同的构造。若用作后者,需要额外的校准研究(未引用)。required。

    12. **数据源同根冒充多源独立** — 未命中。Haidt/Graham/Ellemers 等虽属同一理论家族,但使用不同实验范式与样本,不算同源冒充。

    13. **API 可及性冒充认识论独立性** — 未命中。推论未涉及 API 数据,无此风险。

    14. **反向失败模式缺失** — 未命中。(d)通道(反向通道)+ (f)通道(社会创造力)均已注册为反向失败模式。但(f)的操作化薄弱(见裁决说明),降为 should。

    15. **Bootstrap 限定缺失** — 未命中。本桥接砖是基础机制,无冷启动问题。

    16. **验证对象存在性未标注** — 未命中。实验操作化清晰,验证对象(选择性内化)在实验室可观测。
  counterexample_hunt: |
    **猎捕 1: 边界反例——"高政治化极化群体"中反向通道实际经常在低承诺条件激活。**
    构造:Ellemers & van der Toorn (2015) 系列实验中,荷兰样本(L4-019 标注为个体主义文化)在群体认同度高的条件下,对"群体内"道德规范的从众率升高但对"群体外"规范的拒绝率反而降低(更宽容)。这与推论(d)通道判别条件①(个体主义文化)+ ③(独立自我建构)满足,但通道 1(正向)的预测(对群体外规范的"动机性免疫")在 RT 数据上未呈现。结果:**部分净杀**——正向通道"对非认同群体同等规范的动机性免疫"在个体主义文化下并不稳定;反向通道判别条件虽注册,但实际触发条件更宽,需要在推论中明确"反向通道在哪些子条件下会替代正向通道作为主效应"。被消化为"限制条件需更精细"。

    **猎捕 2: 内部子群体反例——"高承诺 + 内部异议者"。**
    构造:Regan & Fazio 权威主义量表高分者中,存在一组"高承诺但独立自我建构"——他们认同群体,但坚持个人对道德规范有独立裁决权。BR-L2-049 的(通道3)预测这类样本应呈"低自主质量内化(GCOS 低分)"。但 Prattingerová & Güler (2021, 道德心理学)对宗教原教旨主义者的访谈发现,部分高承诺 + 高反思个体反而呈现"高 GCOS + 高承诺"——他们把群体规范重构为自己的核心承诺,而非被动顺从。结果:**被消化**为通道3的预测可能只对 Regan-Fazio 极端高分者成立,对反思型高承诺者需另立子型。

    **猎捕 3: 过度伸张——"对非认同群体规范的动机性免疫"。**
    核心新颖主张是"选择性"——即对非认同群体规范不仅不内化,且"动机性免疫"。但现有 SIT 文献中,经典的 minimal group paradigm (Tajfel 1970) 显示个体对群外规范的差异化对待源于竞争与地位保护,而非"理解但拒绝"。"动机性免疫"这一更强主张需要额外机制(如系统合理化、心理免疫),推论未提供此机制论证。这是**揭出过度伸张**——推论声称的"选择性免疫"比 SIT+群际偏差所能支撑的更强。

    **猎捕 4: 显性-内隐不一致的反例。**
    构造:Gawronski et al. (2008) 关于内群体规范的双重态度模型显示,高认同群体成员对群内规范的显性态度(self-report)与内隐态度(IAT)可呈现解耦——显性支持但内隐不联结。BR-L2-049 的"内化深度"测量(Likert)更接近显性,而 RT 通道不区分显性-内隐。这意味着被预测的"高认同→强内化"可能只是"显性表达同步",而非真正的深层内化。**净杀风险**:若在第二阶段引入 IAT,可能揭示大量"显性-内隐解耦"案例,使推论降级为"显性表达选择性",与"选择性内化"主张形成落差。推论虽有"发散模式结论限制",但未在主预测中区分这两个构念。
  required_fixes:
    - "1) \"选择性\"主张需去循环:明确\"真心接受/动机性免疫\"是按行为指标(如真实匿名捐赠+ IAT 一致)定义而非按自陈定义,并在 falsifiability 主线中区分\"显性同步表达\"与\"深层内化\"两个可分离构念。"
    - "2) 反应时通道需重新论证:要么提供 RT 作为内化深度的校准文献(区分于 Greene 的认知冲突范式),要么将 RT 降为辅助通道,主分析依赖行为指标+IAT。"
    - "3) 承诺强度分组需删除自评循环:高承诺组定义应改为\"≥2 个客观指标\"(自评作为辅助而非必要条件),中间组需明确统计处理方式(非线性段单独报告,不得压成二分)。"
    - "4) (f)社会创造力通道需操作化:预注册\"比较维度重新定义\"的前测量表(如跨群体相似性-差异性感知评分),否则该 falsifiability 等于未注册。"
    - "5) 反向通道(d)判别条件需收紧:增加第④条\"群体类型\"(政治化道德义务型 vs. 低度承诺型),并明确\"反向通道在哪些子条件下是主效应而非例外\"。"
  oneline: |
    核心机制站得住但"选择性内化"主张定义含循环、RT 通道有效性未论证、分组操作裁掉边界样本——三条 required 缺陷把 verified 卡在门外,定向修订可救活。
