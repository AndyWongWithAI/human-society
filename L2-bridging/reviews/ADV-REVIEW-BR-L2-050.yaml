id: ADV-REVIEW-BR-L2-050
type: adversarial_review
reviews: BR-L2-050
layer: L2-bridging
target: BR-L2-050
target_term: 数字通信对群体认同衰减速率的抑制
rounds: 1

人话摘要: |
  对 BR-L2-050(数字通信减缓群体认同衰减)的 round-1 独立对抗审查。
  裁 needs_revision:核心直觉(数字通信降低信号维护成本→减缓认同衰减)方向上有道理,
  但存在 4 条 required 缺陷阻止 verified:(1)核心机制过度贴近 THEOREM-group-identity-decay
  的逻辑推演——"信号更便宜→衰减更慢"近乎定理的重言式应用,砖的独立经验内核(表达性/
  工具性身份区分)未获独立机制支撑;(2)反向失败模式未注册——数字通信同样降低切换成本、
  加速认同衰减的可能性被系统性忽略;(3)IEA 调查未执行,cross_verification 缺失,
  两来源(数字社会学/社会心理学)的独立性未经校准;(4)控制变量、3 个月时间窗口、测量
  工具均未预注册,证伪条件中的"控制其他变量后"构成事后逃生通道。
  反例猎捕发现数字原生政治运动(Occupy Wall Street/阿拉伯之春后续)的认同衰减速度
  快于传统运动——虽不构成净杀(缺非数字反事实基线),但揭示过度伸张:砖只建模了维护
  成本下降这一面,完全未考虑切换成本同步下降的反向力。

round_1:
  reviewer: independent-adversarial-reviewer
  date: 2026-07-16
  verdict: needs_revision
  verdict_note: |
    本命题的核心直觉——数字通信通过降低维持群体身份信号的边际成本,减缓群体
    认同衰减速率——在方向上是 plausible 的。在前数字时代,维持群体归属确实需要
    物理共在或高成本通信,数字通信(点赞、评论、状态更新)提供了一种低成本的
    "我还在群体中"的信号通道。这是一个值得被体系捕捉的经验洞察。

    但四条 required 级缺陷阻止 verified 裁决:

    1.【核心机制过度贴近定理推演——REQUIRED】
    THEOREM-group-identity-decay 的核心陈述是:"群体认同共识存在记忆里,不靠
    仪式/标志/共同故事不断重温就会淡忘→群体散伙"。本砖的核心机制是"数字通信
    降低了重温(信号维护)的边际成本→衰减变慢"。从定理到砖的推理链条为:
    (1) 认同需信号维护(定理) → (2) 数字通信使信号更便宜(近乎定义性事实)
    → (3) 便宜信号→慢衰减。步骤(2)几乎不需要经验证据——"点赞比亲自见面便宜"
    是数字通信的定义性特征。步骤(3)是(1)+(2)的直接逻辑推论。真正走出定理
    重述的是表达性/工具性身份的区分——但这区分本身的机制根基薄弱:砖仅声明了
    区分(表达性=信号维持、工具性=实质互助),未解释为何数字信号对前者有效而对
    后者无效。若无独立机制支撑此区分,砖的经验内核坍缩为"信号更便宜→衰减更慢"
    这一个近乎重言式的推论。

    2.【反向失败模式未注册——REQUIRED】
    砖只建模了数字通信降低维护成本这一面。但数字通信同样降低了【切换成本】:
    加入新群体的门槛下降→离开旧群体的成本也下降。在一个"关注即加入、取关即
    退出"的数字生态中,认同的形成和消散都可能加速。数字原生政治运动(如 Occupy
    Wall Street、阿拉伯之春后的线上行动主义)常表现出极快的认同凝聚和同样极快
    的认同消散——其半衰期以周/月计,而传统政党/工会认同以年/十年计。这不是说
    数字通信不能减缓特定群体的衰减——而是说砖的因果模型是不完整的:它只画了
    箭头的一侧(维护成本↓→衰减↓),忽略了箭头的另一侧(切换成本↓→衰减↑)。
    按红旗 14(反向失败模式)的标准:若驱动量(数字通信)可能产生与被预测方向
    恰好相反的结果且未注册,且方向相反→标记 required。此处"数字通信加速衰减"
    与砖的核心预测方向恰好相反,且未被 falsifiability 的任何一条覆盖(三条均
    预设了"数字通信减缓衰减"的方向)。

    3.【IEA 未执行,cross_verification 缺失——REQUIRED】
    砖的 applicable_sources 列出了数字社会学和社会心理学两个来源,但未执行
    IEA 调查(iea_survey.py),未生成 cross_verification 段。两条来源的独立性
    存在实质性质疑:社会心理学通道引用的 Walther(1996)超人际模型和 McKenna &
    Bargh(1998)虚拟群体研究,本质上是计算机媒介通信(CMC)研究——这在学科归属
    上属于数字社会学/传播学而非社会心理学的核心领域。若免费模型的来源判定员
    识别出两源共享 CMC 语料和方法论(问卷+实验,均以西方大学生为被试),独立系数
    可能远低于 default 0.6。此外,按 instrument_correlation 的 discount_rule,
    单 LLM 执行的 IEA 已需披露仪器折扣——但连这个基础调查都未完成,砖的 IEA
    状态完全未知。没有 IEA,无法判断砖是否满足 even weakly_verified 的门槛(1.2)。

    4.【控制变量/时间窗口/测量工具未预注册——REQUIRED】
    falsifiability (a) 要求"在控制其他变量后"比较数字通信组与线下组的归属感
    下降——但"其他变量"的清单从未给出。年龄、教育、城市化水平、基线群体认同
    强度——这些变量与数字通信使用频率和群体认同均相关,不控制则无法区分选择
    效应与因果效应。证伪条件的"3 个月"时间窗口同样缺乏论证:为什么是 3 个月
    而非 6 个月或 1 年?若效应在 3 个月不显著但在 6 个月显著(或反之),如何裁决?
    测量工具("标准群体认同量表")名目模糊——群体认同领域至少有四种主流量表
    (Collective Self-Esteem Scale / Identification with a Psychological Group
    Scale / Ingroup Ties Scale / Social Identity Scale),不同量表测量不同
    维度(归属感 vs 自尊 vs 纽带 vs 认知中心性),结果不能互通。按红旗 11
    (L4-009 判例精神):口径未一次性注册的阈值,在反例出现后的事后选择一律
    按不利于推论方向裁决。当前状态下,这些未注册的口径使证伪测试在操作层面
    尚未成立。

    四条 required 均可通过定向修订修复:
    (1) 为表达性/工具性区分提供独立机制支撑,或收窄声称去掉此区分;
    (2) 注册反向失败模式(切换成本↓→衰减可能↑),将效应方向从"减缓"收窄为
    条件化命题;
    (3) 执行 IEA 调查,生成 cross_verification,在见 IEA 分数后决定命题状态;
    (4) 预注册控制变量清单、时间窗口论证、具体测量工具及版本。

    这些修复不推翻核心直觉(数字通信可帮助维持群体认同)——但将一条过度伸张、
    未拧紧的命题收紧为诚实可检验的形式。

  red_flags:
    brick_is_conclusion:
      hit: true
      detail: |
        本红旗命中——核心机制与 THEOREM-group-identity-decay 的重合度过高。

        THEOREM-group-identity-decay(来自 reviewer-pack 实体速览):
        "群体'我们是自己人'的共识只存在于成员的记忆里,如果不靠仪式、标志、
        共同故事不断重温,就会慢慢淡忘、各想各的,最后群体边界模糊、散伙"
        ⟵ PHY-001, PHY-002, PHY-003-a, AXIOM-002

        本砖的核心机制:
        "数字通信通过降低维持群体身份信号的边际成本,系统性减缓了
        THEOREM-group-identity-decay 所预测的群体认同衰减速率"

        拆解推理链:
        P1(定理):认同需"重温"(仪式/标志/故事)→不重温则衰减
        P2(砖):数字通信(点赞/评论/状态更新)使"重温"更便宜
        C(砖):∴数字通信→衰减变慢

        P2 近乎定义性真理——"数字通信比亲自见面成本低"是数字通信的固有属性,
        不需要经验证据即可成立。P1→P2→C 在逻辑上近乎重言:"若信号维护减缓衰减(定理),
        且数字信号比物理信号便宜(定义),则数字信号减缓衰减(推论)"。

        真正使本命题走出定理重述的是表达性/工具性身份的区分——这个区分不在
        定理中,且构成了一个可检验的经验预测(数字通信只减缓表达性身份衰减,
        不减缓工具性身份衰减)。然而:

        (1) 此区分的机制根基薄弱。砖在 statement 的限制段声明了区分("此维持效应
        仅适用于表达性身份,对于工具性身份无效"),但未解释为什么。可能的机制是:
        表达性身份靠信号传递维持(点赞=信号),工具性身份靠实质互助维持(金钱/
        劳力=非信号)。若"为什么"的答案恰是"因为工具性身份需要实质互助而非信号",
        那这个区分本身是定义性的而非机制性的——"需要信号的身份靠信号维持"=
        同义反复。

        (2) 此区分承担了砖绝大部分的非平凡经验负载,但砖的结构中它仅以一句
        "限制"的形式出现,没有独立的 falsifiability 测试(证伪条件(b)只测了
        反向情况——若工具性身份也被减缓则限制失败,但未提供为什么这个区分
        应该成立的独立证据)。

        综合:核心机制过度贴近定理推演,区分虽提供非平凡性但机制支撑不足。
        命中的程度是"核心不独立"而非"完全无新意"——砖有真实内容(区分),
        但它的经验负载与其在结构中的位置(一句"限制")不匹配。这不等同于
        DED-004 式的不可证伪循环——砖仍是可证伪的——但砖的可证伪性主要来自
        其最薄弱的部位(限制条件),而非其声称的核心机制。

    empty_cell_tautology:
      hit: false
      detail: |
        核心空格预测:若世界是"数字通信不减缓认同衰减"的世界,则:
        (1) 数字通信频繁的群体与线下群体在 3 个月内归属感下降无显著差异;
        (2) 数字通信对工具性身份也表现出衰减抑制效果(效应量≥0.3);
        (3) 完全替代线下互动后衰减速率反而增加。

        这些都是可观察的经验预测,非同义反复。空格的观测成本低(标准群体认同
        量表可测),不依赖不可操作的理想测量。通过。

        但有一个次级关切:空格(1)的"无显著差异(p>0.05)"是一个 null-hypothesis
        significance testing 的框架——在样本量不够大时,"无显著差异"可能是统计
        功效不足而非真实无差异。砖未注册所需的效应量(最小可检测效应)和样本量
        要求,这在实操中可能使证伪测试难以执行。列为 should。

    measurement_axis_orthogonality:
      hit: true
      detail: |
        本红旗命中——非 DED-007 式的闭环焊接(分母用实际结果定义),而是另一种
        更常见的 L2 级测量轴问题:自变量与被观测量之间的因果方向混淆
        (endogeneity/selection)。

        自变量(IV):数字通信使用频率
        被观测量(DV):群体认同衰减速率(标准群体认同量表)

        IV 和 DV 在测量仪器上异源(通信日志 vs 自陈量表)→工具独立性成立。
        但因果方向存在系统性的识别问题:

        (1) 选择效应:选择使用数字通信维持群体联系的人,可能本身就具有更强的
        群体认同——他们在意这个群体,所以花精力去维持联系。这与砖预测的因果
        方向(数字通信→维持认同)方向一致但机制不同(认同→维持通信)。在截面
        比较中,两组(数字通信组 vs 线下组)在基线认同强度上不可比——数字通信
        组"衰减更慢"可能只因基线更高(地板效应更小)或因为他们根本就是不同的人。

        (2) 反向因果:群体认同越强的人,可能越倾向于使用数字通信维持联系。
        3 个月后"衰减更慢"可能反映的是基线认同的持续性(高认同本来就衰减慢),
        而非数字通信的因果效应。

        (3) 砖的 falsifiability 提到"控制其他变量后"——这恰好承认了混淆变量
        的存在,但未注册具体控制变量清单。不注册清单,"控制"在实操中是没有约束
        力的——分析者可以事后选择"控制了什么"来影响结果方向。

        此焊点不是 DED-007 式的死刑(分母偷用结果)——因为 IV(通信频率)的测量
        绝对不依赖于 DV(认同变化)的读数。但 endogeneity 在 L2 命题中是一个
        真实的测量轴威胁:它使得"相关性"无法被安全地解读为"因果性",而砖的核心
        主张恰是因果性的(数字通信→减缓衰减)。

        修复路径:endogeneity 可通过(1)面板数据(固定效应模型控制不可观测的
        个体异质性),(2)工具变量(如外生的平台可用性变化),(3)自然实验(如某平台
        在某国突然被封禁作为外生冲击)来部分解决。砖不需要自己执行这些方法,
        但需要在 falsifiability 中注册:哪些混淆变量必须被控制,什么识别策略
        可以区分选择效应与因果效应。这属于可修复的测量轴不正交。

    scope_exclusion_independent:
      hit: false
      detail: |
        排除项按可事前测的渠道划界:
        - "仅适用于表达性身份,不适用于工具性身份"→排除的是作用域,表达性/
        工具性身份有独立的概念判据(是否需要实质互助),非按结果定义。
        - "完全替代线下互动时可能减弱"→排除的是极端条件(零线下接触),
        此排除在见数据前声明,方向合理(承认限度的存在而非建立逃生舱)。

        排除钩子整体诚实。但表达性/工具性的区分判据需要更精确的操作化——
        目前仅以举例方式("互助合作社"作为工具性身份例),缺乏系统判据。列为
        should 而非 required,因为方向诚实。

    classification_granularity:
      hit: false
      detail: |
        砖以"数字通信组 vs 线下组"的二分框架处理连续量(通信频率)。在实验设计
        中此二分为操作需要,非不当切分。二分档位与 falsifiability (a) 的组间
        比较设计匹配。通过。

    anti_talisman:
      hit: true
      detail: |
        本红旗命中——falsifiability 条件在形式上可证伪,但在操作层面存在一条
        实质性逃生通道。

        三条证伪条件的方向正确:
        (a) 数字通信组与线下组无显著差异→核心主张证伪
        (b) 工具性身份也被减缓(效应量≥0.3)→限制条件失败
        (c) 完全替代线下后衰减加速→预测失败

        但(a)中的"控制其他变量后"构成了一个隐蔽的 talismanic 逃生舱。
        具体而言:

        (1) "控制其他变量后"中的"其他变量"清单未预注册。若某研究得到
        不显著的组间差异,砖可辩称"你没有控制变量 X(如基线认同强度/群体类型/
        文化背景)"。由于未预注册完整的控制变量清单,这种防御在逻辑上可以无限
        延伸——每次出现不利证据,都可以追加一个新的"应该控制但未控制"的变量。

        (2) "3 个月"的时间窗口是任意的。若效应在 3 个月不显著但在 6 个月显著,
        如何裁决?砖未规定时间窗口的选择依据。这给了另一种逃生路径:若 3 个月
        不显著→"窗太短,效应尚未显现";若 3 个月显著→"窗刚好,效应被捕获"。
        窗口长度在见数据后可以灵活解释。虽然 brick=conclusion 红旗中已说明
        砖是可证伪的,但"控制其他变量+任意时间窗口"的组合给了砖在操作层面
        消化不利证据的能力——这是 talismanic 的经典结构。

        (3) "标准群体认同量表"的模糊性:领域内有多种量表测量不同维度,结果
        不能互通。若用 Social Identity Scale(认知中心性)得到不显著结果,
        可辩称"应使用 Collective Self-Esteem Scale(归属感)";反之亦然。
        不同量表提供了又一个事后调整的维度。

        三个模糊点(控制变量/时间窗口/测量工具)的合力构成了实质性 talismanic
        风险:不是结构级的"不可证伪"(否定砖的逻辑可能性不存在),而是操作级的
        "不可被干净地推翻"(证伪条件在实操中无法硬着陆)。

        按 anti-talisman 红旗标准:证伪条件应可事前测量,判定前件不依赖结果
        反推。当前三条模糊点使判定可以随着结果的出现而调整——这削弱了
        独立对抗审查的核心防御:在一个没有预注册控制变量清单的世界里,审查者
        无法判断"不显著"究意是命题错了还是控制变量不够。此 risk 可通过预注册
        控制变量清单+时间窗口论证+指定具体量表来修复——非结构死罪,但属
        required 级操作化缺口。

    reality_anchor_fact_check:
      hit: false
      detail: |
        砖引用文献的发表状态核实:
        - boyd (2014) "It's Complicated"→Yale University Press,出版属实。
        - Baym (2010) "Personal Connections in the Digital Age"→Polity Press,
        出版属实。
        - Rainie & Wellman (2012) "Networked"→MIT Press,出版属实。
        - Latané (1981) 社会影响理论→American Psychologist,发表属实。
        - Walther (1996) 超人际模型→Communication Research,发表属实。
        - McKenna & Bargh (1998) 虚拟群体身份→Journal of Personality and
        Social Psychology,发表属实。

        六篇引用均为领域内知名文献,发表属实,核心主张表述准确。无事实错。
        但需注意:六篇引用均为 1996-2014 年发表——最新的距今已逾 10 年。
        数字通信生态在过去十年发生了结构性变化(算法推荐取代时间线、短视频
        崛起、平台碎片化),砖引用的文献主要覆盖 Web 2.0 早期(博客/论坛/
        Facebook 初期),其经验发现对当代算法驱动的社交媒体的适用性存疑。
        此为 should 级关切——不影响引用的真实性,但影响其时效性。

    definition_vs_prediction:
      hit: false
      detail: |
        "数字通信减缓群体认同衰减"是可证伪的经验主张。对称世界(数字通信对
        衰减无影响)在逻辑上自洽——不存在"不可能"的逻辑约束。命题的核心贡献
        恰在于声称现实世界选了不对称路径(数字通信→慢衰减)。这是经验选择而非
        定义。通过。

        但有一条边界:若将"数字通信"定义为"低成本的群体身份信号传递",则
        "低成本信号传递→减缓衰减"在一定程度上趋近于定义性延伸——因为定理
        说的就是"信号维护→减缓衰减"。这正是 brick=conclusion 红旗的管辖范围,
        不在此重复。

    enumeration_exhaustiveness:
      hit: false
      detail: |
        砖未声称可枚举的物种/类别划分。表达性/工具性身份是二分框架,非 enumerate
        所有身份类型。不适用此红旗。

    primary_suspect_accuracy:
      hit: false
      detail: |
        L2 砖无 formal primary_suspect 字段(L3 要求),按红旗精神审查最弱腿:

        外部识别的最致命软肋(砖未自认):
        (i)【反向失败模式缺失】砖只建模维护成本下降→衰减减缓,未建模切换成本
        下降→衰减加速。这是最严重的理论盲点——数字生态中,认同的快速消散(粉丝
        脱粉/运动退潮/社群瓦解)与认同的快速形成是一体两面,砖的模型只能解释
        一面。见 required_fix #2。

        (ii)【表达性/工具性区分的机制缺失】砖最独特、最非平凡的经验贡献是
        表达性/工具性区分,但此区分的理论根基最薄弱——仅作为一句"限制"出现。
        若此区分被攻破(发现数字通信对工具性身份同样有效),砖退化为"信号便宜→
        衰减慢"的定理推论。见 required_fix #1。

        (iii)【因果识别未注册】砖的 endogeneity 问题(选择效应/反向因果)使
        "相关性"无法直接解读为"因果性"。砖未提供任何识别策略。见 measurement
        _axis_orthogonality 和 required_fix #4。

        三条软肋均属 required 级——组合起来表明砖的核心声称(数字通信→减缓
        衰减)在因果和经验层面均未充分拧紧。

    caliber_registration:
      hit: true
      detail: |
        本红旗命中——"口径完整注册"要求阈值连同分子/分母/测量口径一次性注册,
        且反例出现后的事后口径选择一律反向裁决(判例 L4-009)。本命题在该维度
        存在三条缺陷:

        (1)【控制变量清单未注册——REQUIRED】
        falsifiability (a) 要求"在控制其他变量后"比较两组,但"其他变量"清单
        从未给出。候选的必控变量至少应包括:年龄(年轻人更常用数字通信且群体
        认同更流动)、教育水平、城市化程度、基线群体认同强度、群体类型(兴趣型
        vs 血缘型 vs 地缘型)、群体规模、群体存续时间。若清单未预注册,分析者
        可根据结果方向选择性地"控制"不同变量组合——这是 L4-009 判例要堵的
        经典漏洞。按 L4-009 判例精神:在见数据前锁定完整的控制变量清单;若分析
        者在不同规格中 cherry-pick 显著结果,所有未预注册的规格一律按最不利于
        推论的方向裁决。

        (2)【3 个月时间窗口缺论证——REQUIRED】
        为什么是 3 个月而非 6 周或 1 年?数字通信的效果可能在极短期内(前 2 周)
        不显著——因为群体认同的惯性使变化需要时间积累。也可能在极短期内显著、
        但随时间衰减(新鲜感效应)。也可能需要 6-12 个月才能观测到差异。窗口
        选择直接影响证伪测试的结果。若无法提供窗口的独立论证(如基于文献中
        群体认同衰减的自然时间尺度),需注册多个窗口(如 1 个月/3 个月/6 个月/
        12 个月)并预注册多重比较校正方案,或改用连续追踪测量。

        (3)【"标准群体认同量表"未指定——REQUIRED】
        领域内至少存在四种常用量表:Collective Self-Esteem Scale(Luhtanen &
        Crocker 1992,四维度:成员自尊/私人集体自尊/公共集体自尊/身份重要性),
        Identification with a Psychological Group Scale(Mael & Tetrick 1992,
        单维认知认同),Ingroup Ties Scale(Cameron 2004,三维:纽带/ centrality/
        affect),Social Identity Scale(Ellemers et al. 1999,三维:认知/评价/
        情感)。不同量表测量不同构念——CSES 测自尊维度,IPS 测认知维度,ITS
        测纽带维度,SIS 测多维——它们不互通。砖需指定:哪个量表、哪个版本、
        哪个维度作为主测量(以及是否报告所有维度)。若此未锁定,"标准量表"是
        空的占位符。

        三条合计构成口径注册的核心缺口:falsifiability (a) 在操作层面尚未成立——
        因为控制了哪些变量、测了多久、用什么工具测这三个基本问题都没有答案。
        这不是措辞修补——是证伪测试的操作化基础设施未建成。列入 required_fix #4。

    data_source_common_root:
      hit: false
      detail: |
        砖引用的全部是学术著作/论文(boyd/Baym/Rainie-Wellman/Latané/Walther/
        McKenna-Bargh),不涉及宏观经济指标。不存在 WB/IMF 对 CNBS 国家账户
        的 repackaging 问题。data_source_origin 折扣不触发。

    api_pretending_independence:
      hit: false
      detail: |
        砖未进行 IEA 调查,不存在 API 调用。若未来执行 IEA,需注意两条来源
        (数字社会学/社会心理学)在 CMC(计算机媒介通信)主题上的语料重叠风险。
        不适用于当前状态(无 cross_verification 可审查)。

    reverse_failure_unregistered:
      hit: true
      detail: |
        本红旗命中(红旗 14:反向失败模式缺失)——砖未注册"数字通信加速群体
        认同衰减"这一反向失败模式。

        砖的因果箭头:数字通信→维护成本↓→衰减↓(单方向)
        未建模的因果箭头:数字通信→切换成本↓→衰减↑(反向)

        具体机制:
        (1) 低切换成本:在数字生态中,退出一个群体(取关/退群/注销)的成本极低,
        远低于前数字时代退出一个群体的成本(失去社交网络/声誉受损/物理隔离)。
        低退出成本意味着认同更容易被"抛弃"——当一个替代群体出现时,切换几乎
        零摩擦。

        (2) 替代选项可见性:数字通信不仅维持现有群体的信号,也同时暴露成员于
        无数替代群体的信号中。算法推荐系统持续推送"你可能喜欢的其他群体"——
        这增加了认同的竞争压力,可能加速原有群体认同的衰减。

        (3) 注意力碎片化:数字通信的低成本信号维持可能产生"广度换深度"效应——
        成员同时维持十几个群体的微薄信号(每个都点赞),但对任何一个群体的深度
        投入(需要时间和精力的实质参与)被稀释。这导致的是"广而不深"的认同维持,
        而非砖声称的"衰减减缓"。

        这三个机制分别对应切换成本/替代竞争/注意力稀释,每一个都可能产生与砖
        核心预测方向相反的经验结果。数字原生政治运动(如 Occupy Wall Street
        从巅峰到基本消散约 6 个月,阿拉伯之春后的线上行动主义半衰期数月)、
        数字粉丝社群(K-pop 粉丝群体可在数周内从峰值活跃度降至沉寂)、数字亚文化
        (如 4chan 的某 meme 社群的兴衰周期)——这些案例中,认同的衰减速度以
        周/月计,远快于前数字时代的可比群体(传统政党/工会/宗教团体以年/十年计)。

        砖的 falsifiability 未注册此反向模式。证伪条件(a)预设了"数字通信减缓
        衰减"的方向(比较的是"差异是否显著>0"),证伪条件(b)和(c)测试的是限制
        条件,均未覆盖"数字通信可能加速衰减"这一反向可能。按红旗 14 标准:若
        驱动量的变化可能产生与被预测方向恰好相反的观测结果且未注册,且方向
        相反→标记 required。此处"加速衰减"与"减缓衰减"方向恰好相反。

    bootstrap_absent:
      hit: true
      detail: |
        本红旗命中(红旗 15:Bootstrap 限定缺失)——砖涉及新技术(数字通信)介导
        社会形态,但未区分冷启动阶段与稳态运行阶段。

        具体而言:砖声称"数字通信减缓群体认同衰减"。但一个已有深厚线下历史的
        群体引入数字通信来维持联系(稳态),与一个纯粹在数字空间中从零建立的群体
        (冷启动),是两个不同的场景。

        (1) 稳态场景(线上线下混合的已有群体):数字通信作为线下互动的补充,
        降低维护成本。砖的声称在此最 plausible——已有深厚的线下纽带,数字通信
        只起"保鲜"作用。

        (2) 冷启动场景(纯数字原生群体):没有线下历史的群体,所有认同通过数字
        信号构建。砖的声称在此面临最大的反例风险——纯数字原生群体的认同衰减
        极快,因为初始纽带的深度/厚度远不及线下建立的群体。前述数字原生政治
        运动/粉丝社群的快速兴衰正是此场景的反面证据。

        砖的 statement 覆盖了"完全替代线下互动时可能减弱"这一极端——但这是
        针对"替代"的限定,而非针对 cold-start vs steady-state 的系统区分。
        Bootstrap 限定的核心关切是:砖声称的"减缓衰减"是否只在 bootstrap 完成
        (群体已通过线下途径建立了深厚认同)之后才成立?若答案为是,则砖的稳健
        声称应为"对于已有线下基础的群体,数字通信作为补充可减缓认同衰减;
        对于纯数字原生群体,数字通信的衰减减缓效应未经检验且面临反向风险"。
        此区分在防御数字原生群体快速衰落的反例时至关重要——若无此限定,反例
        构成净杀;若有此限定,反例可被消化为超出 scope。

        Brick 未做此限定。按红旗 15 标准:若涉及新技术介导社会形态的推论未区分
        冷启动 vs 稳态阶段,标记 should——但若在反例猎捕中发现了冷启动依赖的
        证据(本审查已发现),升级为 required。此升级成立——见 counterexample_hunt
        中的数字原生政治运动案例。

    verification_object_sparse:
      hit: true
      detail: |
        本红旗命中(红旗 16:验证对象存在性未标注)——砖的理想检验对象在当前
        世界中稀缺。

        砖的理想检验:两个在其他方面完全相同(成员特征/群体类型/群体历史/
        文化背景)的群体,唯一差异是数字通信使用程度,追踪 3 个月后比较认同衰减。
        这样的自然对照组在实践中几乎不存在:
        - 数字通信使用程度与年龄/教育/城市化高度共线
        - 不同群体之间的基线认同强度天然不同
        - 3 个月的追踪期内,两组的"外部事件"(群体发生了什么)不可能完全相同

        砖未诚实标注"理想检验对象的可获得性"。在实践中,可行的是:对同一群体
        的成员做个体层面的分析(如回归:通信频率→认同变化,控制个体特征),
        而非群体层面的组间比较。但个体层面的分析引入了前文讨论的 endogeneity
        (选择效应/反向因果),需要面板数据或工具变量——而这些提高了检验门槛。

        此外,有些主张的验证需要"纯数字原生且长期存续的群体"作为正面证据——
        而这类群体在当前世界中稀缺(大多数长期存续的数字群体有线下根基)。
        砖未标注此稀缺性。按红旗 16 标准:若推论的理想检验对象近乎空集且未诚实
        标注,标记 should。当前状态:标记 should——不影响可证伪性(证伪条件逻辑
        上清晰),但影响实证置信度上限的诚实性。

  iea_independence_check:
    iea_executed: false
    missing_cross_verification: true
    note: |
      砖的 applicable_sources 列出了两条来源(digital_sociology + social_psychology),
      但未执行 IEA 调查(iea_survey.py),无 cross_verification 段。

      在 IEA 执行前的预审:

      (1) 两条来源:
      - digital_sociology:引用 boyd(2014)/Baym(2010)/Rainie-Wellman(2012),
      三者均直接处理数字通信与群体/关系维系。
      - social_psychology:引用 Latané(1981)/Walther(1996)/McKenna-Bargh(1998),
      其中 Walther 和 McKenna-Bargh 的研究对象恰是 CMC(计算机媒介通信),
      在学科归属上实际属于数字社会学/传播学的核心领域。

      (2) 独立性关切:
      - Walther(1996)超人际模型和 McKenna-Bargh(1998)虚拟群体身份研究,
      虽然发表在传播学/社会心理学期刊,但其核心对象(CMC 中的身份/关系)
      与 digital_sociology 通道的研究高度重叠。两条"通道"可能在语料和
      研究范式上共享 CMC 研究传统。
      - 免费模型判定员在执行源独立性判断时,可能将 social_psychology 通道
      的相当一部分证据力判定为"与 digital_sociology 共享 CMC 语料",从而
      降低有效独立系数。

      (3) 即使假设两条来源均为 agree(1.0),默认独立系数 0.6,预期 IEA =
      1.0(锚源)+ 0.6(第二条×0.6)= 1.6。这低于 verified 门槛 1.8,但高于
      weakly_verified 门槛 1.2。若免费模型判定员将社会心理学通道降级为
      partially_agree 或 mixed(因为 CMC 语料重叠),IEA 可能降至 1.0-1.3。

      (4) instrument_correlation 折扣:按 independence-model 的 discount_rule,
      单 LLM 执行的 IEA 需披露仪器折扣。此命题为新颖命题(非多重复现的教科书
      共识),按 mitigation 条款,仪器折扣应视为承重红旗。

      结论:IEA 缺失是本命题当前最硬的门槛缺陷——没有 IEA,无法判断命题是否
      满足 even weakly_verified 的最低证据门槛。列入 required_fix #3。

    instrument_honesty:
      disclosed: false
      assessment: |
        无 cross_verification 段,无 instrument_disclosure。若未来执行 IEA,
        需按 independence-model discount_rule 披露单 LLM 执行的仪器折扣。

  counterexample_hunt:
    methodology: |
      四个反例方向:(1)数字原生政治运动的快速兴衰——检验"数字通信减缓衰减"的
      核心方向;(2)数字粉丝社群的认同周期——检验数字生态中认同衰减是否系统性
      快于前数字;(3)数字通信同时加速新认同形成——检验"维护成本↓"故事的另一面;
      (4)纯线下紧密群体的超长存续——检验"没有数字通信的群体是否衰减更快"的反向。
    cases:
    - direction: "数字原生政治运动——认同的快速形成与快速消散"
      description: |
        Occupy Wall Street (2011):在数周内通过 Twitter/Facebook 凝聚了全球关注
        和强烈的参与者认同("我们是 99%"),但运动在约 6 个月内从巅峰消散至基本
        沉寂——核心营地在 2011 年 11 月被清场后,线上认同在数月内急剧衰减。
        阿拉伯之春(2011)后的线上行动主义:埃及 Tahrir 广场运动后的"Facebook
        革命者"群体认同在政权更迭后的 1-2 年内迅速碎片化。

        这些运动的共同模式:数字通信使认同在极短时间内(数天至数周)达到极高强度,
        但同样使认同在极短时间内(数月至 1-2 年)消散。衰减速度以月计,而前数字
        时代的可比政治认同(政党归属/工会认同/民族主义运动)的衰减以年或十年计。
      counter_impact: "揭出过度伸张——揭示反向失败模式"
      analysis: |
        此案例不构成净杀,因为:
        (i) 砖未声称数字通信【总是】减缓衰减——它声称数字通信有减缓衰减的因果
        效应,但不排斥其他因素同时起作用。
        (ii) 缺非数字反事实:我们不知道如果没有数字通信,这些运动的认同衰减会
        更快还是更慢。可能没有数字通信的话,这些运动根本不会形成如此强烈的认同——
        数字通信既加速了凝聚也加速了消散,而砖只建模了前者。
        (iii) 砖的"完全替代线下互动时可能减弱"限制部分覆盖了此案例——Occupy
        和阿拉伯之春的线上行动主义虽然伴随线下集会,但数字通信是其认同的主要载体。

        但揭示了两处过度伸张:
        (1) 反向失败模式:数字通信在降低维护成本的同时降低切换成本。低切换成本
        使成员更容易"跳船"——当一个运动失去势头、或出现更有吸引力的替代运动时,
        认同可以快速迁移。砖的因果模型只画了箭头的一侧(维护成本↓),完全未建模
        另一侧(切换成本↓→衰减↑)。这不是"数字通信的效果被其他因素抵消"——
        是"数字通信本身同时产生两个方向相反的效果,砖只注册了其中一个"。

        (2) Bootstrap 限定缺失:纯数字原生或数字主导的群体(线下根基薄弱),其
        认同衰减可能系统性快于有深厚线下根基的群体。砖未区分此场景,使其声称
        在面对数字原生群体的反例时,缺乏概念工具来诚实限定 scope。

        两条合起来构成 required_fix #2(反向失败模式)和 required_fix #1 的
        部分内容(Bootstrap 限定)。

    - direction: "数字粉丝社群——认同周期以周/月计"
      description: |
        K-pop 粉丝群体(Twitter/Weverse 上的 BTS/Blackpink 等粉丝社群):
        群体的认同在回归期(cb)达到巅峰——数周内数百万条帖子、高强度群体互动、
        强烈的"我们 vs 他们"(不同粉丝群之间的对立)。但回归期结束后的 1-3 个月内,
        群体活跃度急剧下降——虽然核心粉丝维持了部分认同,但大量"路人粉"的认同
        迅速消散,直至下一次回归。

        类似的模式在游戏社区(如某款手游的公会——开服期火爆,数月后大部分公会
        变成鬼服)、meme 社群(4chan/Reddit 的某 subreddit——从创建到巅峰到沉寂
        的完整周期常以周/月计)中反复出现。

        这些案例中,数字通信不仅没有减缓衰减——它似乎使认同的形成和消散都加速了,
        整体上认同的"代谢率"更高而非更低。
      counter_impact: "被消化——揭示 bootstrap 限定需求"
      analysis: |
        此案例的挑战方向与前一个相同(低切换成本/低承诺门槛),但提供了不同领域
        (娱乐/文化消费而非政治)的独立验证。

        被消化路径:
        (i) 粉丝社群的高代谢率可能恰反映了数字通信的"广度换深度"效应——成员
        同时维持多个粉丝身份的微薄信号,对任何一个的深度投入被稀释。这不是说
        数字通信没有减缓衰减(对每一个身份而言),而是说它在系统层面改变了"认同"
        的含义——从"深度投入"变为"广度信号"。

        (ii) 砖的"表达性身份"框架部分消化此案例——粉丝社群恰是"表达性身份"
        的极致(通过信号传递维持的归属感)。若砖声称表达性身份被数字通信减缓衰减,
        但粉丝社群是衰减最快的群体类型之一,这构成了"框架消化但方向相反"的尴尬:
        不是框架不能消化,而是框架预测的方向与实际观测相反。

        (iii) Bootstrap 限定可部分解围:纯数字粉丝社群的 bootstrap 阶段未建立
        线下深度纽带,因此数字通信的"维护"功能在薄基础上运作——维护的是薄弱的
        初始认同,效果当然有限。但砖当前未区分冷启动 vs 稳态,此防御不存在于
        当前版本中。

        综合:不净杀(可被 Bootstrap 限定吸收),但强烈支持 required_fix #1
        (Bootstrap 限定)的紧迫性——在没有 Bootstrap 限定之前,砖无法一致地
        解释为什么数字粉丝社群衰减如此之快。

    - direction: "数字通信降低新认同形成成本——整体认同生态的代谢加速"
      description: |
        前数字时代,形成一个新的群体认同需要显著的启动成本(找到同好/建立沟通渠道/
        组织聚会)。数字时代,形成新认同的成本极低(搜索→加入群组→开始互动,全程
        可在数分钟内完成)。这意味着任何给定的群体认同都面临更激烈的"竞争"——
        成员随时可能发现并转向一个更有吸引力的替代群体。

        这不是说数字通信不能减缓衰减——它确实降低了维护成本。但维护成本降低的
        效果可能被替代选项的增加所抵消或超越。整体上,数字生态中的认同可能更
        "易变"(volatile)而非更"持久"(persistent)——而砖预测的是更持久(衰减减缓)。
      counter_impact: "揭出过度伸张——砖的单向因果模型不完整"
      analysis: |
        此案例揭示了砖的理论框架的根本不对称性:
        - 砖建模:维护成本↓→衰减↓(单箭头)
        - 现实:(维护成本↓→衰减↓) + (进入成本↓→新认同↑→旧认同被替代→衰减↑)
        + (切换成本↓→衰减↑)

        净效果的方向在理论上是未定的。经验观测(数字原生群体的快速代谢)提示
        净效果可能偏向加速衰减而非减缓衰减——但这不足以推翻命题,因为命题
        可以辩称"若无数字通信,衰减会更快"(不可观测的反事实)。

        然而,这个不可观测的反事实本身就是一个问题:它使砖的核心主张(数字通信
        减缓衰减)在缺少干净对照组的情况下无法被验证或证伪——因为我们永远无法
        观测"同一个群体在没有数字通信的情况下的衰减速度"。这不是砖独有的问题
        (所有涉及"新技术对社会的因果影响"的主张都面临反事实不可观测问题),
        但砖未承认这一问题,也未提出解决此问题的识别策略。

        此案列为 should——不推翻命题但揭示方法论缺陷:砖需在 statement 或
        falsifiability 中诚实地承认反事实不可观测问题,并提出接近反事实的
        识别策略(如跨国家的数字通信渗透率差异作为自然实验,或同一群体在引入
        数字通信工具前后的面板数据)。

    - direction: "纯线下紧密群体的认同同样快速衰减——挑战'数字通信的效果'归因"
      description: |
        并非所有快速衰减的群体认同都与数字通信有关。前数字时代也存在大量快速
        消散的群体认同:
        - 1960s 的反文化运动/公社:许多在 2-3 年内从巅峰到解散
        - 19 世纪的乌托邦社区:平均寿命约 5 年
        - 历史上的千禧年运动:从兴起到消散常仅数年

        这些案例表明:群体认同的快速衰减是一个前数字时代就存在的现象,数字通信
        可能只是改变了衰减的形式(从物理解散变为线上沉寂)而非衰减的实质速度。
      counter_impact: "被消化——但揭示归因过度问题"
      analysis: |
        此案例不直接证伪砖——砖声称的是数字通信减缓衰减(因果效应),而非声称
        前数字时代没有快速衰减。前数字快速衰减案例的存在不否认"若无数字通信,
        衰减会更快"这一反事实主张。

        但揭示了归因过度风险:若大量的群体认同衰减差异可由其他因素(群体目的/
        成员承诺/外部冲击)解释,则数字通信作为解释变量的边际贡献可能很小——小到
        统计上不显著,从而触发 falsifiability (a)本身(但不是因为砖错了,而是因为
        效应量太小、噪声太大)。

        此案列为 should:砖应在 statement 中诚实地标注:已知群体认同衰减受多因素
        驱动(群体目的达成/外部冲击/代际更替/领导者退出),数字通信的维护成本效应
        是其中之一且效应量待估计,不应被解读为唯一或主导因素。

    overall_counterexample_verdict: |
      四个方向的反例猎捕未发现净杀案例(没有案例可以干净地证明"数字通信加速了
      某个在其他方面完全等价于线下对照组的具体群体的衰减")——净杀要求干净的
      反事实,而干净的反事实在"新技术"类命题中几乎不可能获得。

      但反例猎捕揭露了三个结构性过度伸张:
      (1) 反向失败模式未注册——数字通信同时降低维护成本和切换成本,后者产生与
      砖预测方向相反的因果箭头。数字原生政治运动/粉丝社群的快速兴衰为此提供了
      反复出现的经验模式。
      (2) Bootstrap 限定缺失——砖未区分冷启动(纯数字原生群体)与稳态(有线下
      根基的群体),而反例集中在冷启动场景。
      (3) 反事实不可观测——砖的核心因果主张(若无数字通信则衰减更快)依赖不可
      观测的反事实,砖未承认此方法论局限。

      这三条过度伸张构成 required_fix #1(Bootstrap 限定)和 #2(反向失败模式)
      的经验基础。它们不推翻命题骨架,但要求命题大幅收窄其声称的 scope 和方向——
      从"数字通信减缓衰减"的全称方向性声称收窄为"对于已有线下根基的群体,
      数字通信作为补充可降低维护成本从而减缓衰减;对于纯数字原生群体,维护成本
      下降的效果可能被切换成本下降所抵消或超越,净效果方向未定"。

  non_recurrence:
    - check: DED-004
      status: pass
      detail: |
        本命题不依赖不可证伪的循环定义。falsifiability 条件在逻辑上可测试,
        不构成"无法想象其为假"的概念保护。操作化缺口(见 anti_talisman 红旗)
        属执行层面的不完整,非结构层面的不可证伪循环。
    - check: DED-007
      status: pass
      detail: |
        非 DED-007 式的闭环焊接。IV(数字通信频率)不以 DV(认同变化)作为分母
        或定义成分。测量轴不正交以 endogeneity(选择效应/反向因果)的形式出现,
        而非 DED-007 的"分母偷用结果"式结构死罪。endogeneity 可修复
        (面板数据/工具变量/自然实验),不同于 DED-007 的不可修焊点。

  required_fixes:
    - id: REQ-BR-L2-050-A
      severity: required
      what: |
        收窄核心声称,补充 Bootstrap 限定,并将表达性/工具性区分从"限制"升级为
        有机制支撑的核心组件。具体:

        (A) 在 statement 中区分冷启动 vs 稳态场景:
        "对于已有线下根基的群体,数字通信作为补充可降低身份信号维护成本
        从而减缓认同衰减。对于纯数字原生群体(无线下历史的群体),维护成本
        下降的效果可能被切换成本下降和替代选项增加所抵消或超越,本命题不声称
        数字通信对纯数字原生群体有衰减减缓效应。"

        (B) 为表达性/工具性区分提供独立机制:
        说明为什么数字信号对表达性身份有效而对工具性身份无效——不能仅靠
        定义("因为工具性身份需要实质互助"),需独立经验论证或收窄为假设。

        (C) 或:若无法为区分提供独立机制支撑,将区分降级为"假设/待检验"标注
        而非作为砖的确定主张。
      rationale: |
        核心机制过度贴近定理推演(红旗 1),Bootstrap 限定缺失(红旗 15),
        反例猎捕揭示了纯数字原生群体快速衰减的反复模式。当前 too-broad 的
        声称在面对反例时缺乏概念工具来诚实限定 scope。收窄不推翻核心直觉——
        只是将声称从 overclaim 校准为诚实可辩护的范围。

    - id: REQ-BR-L2-050-B
      severity: required
      what: |
        注册反向失败模式(红旗 14)。在 statement 或 core_mechanism 中追加:

        "数字通信同时降低了群体身份信号的【维护成本】和群体成员身份的【切换成本】。
        维护成本↓→衰减减缓(本命题的核心箭头);切换成本↓→衰减加速(反向箭头)。
        对于已有线下根基的群体,维护成本效应通常主导(因为切换成本已由线下纽带
        锁死);对于纯数字原生群体,两条箭头的净方向在理论上未定且随情境而异。
        本命题不声称维护成本效应在所有条件下都主导。"

        同时,在 falsifiability 中追加一条证伪条件:
        "(d) 若在面板数据中,控制个体固定效应后,数字通信使用频率的增加与群体
        认同衰减的加速显著正相关(而非负相关),则维护成本效应被切换成本效应压倒,
        本命题需修正为双向效应模型。"
      rationale: |
        反例猎捕揭露了反向失败模式的存在(数字原生政治运动/粉丝社群的快速衰减)。
        仅建模维护成本一侧是对因果模型的不完整表述,导致命题在经验上极易被攻击。
        注册反向模式不是削弱命题——是将命题从"单向全称声称"升级为"双向条件化
        模型",提升方法论诚实度。

    - id: REQ-BR-L2-050-C
      severity: required
      what: |
        执行 IEA 调查并生成 cross_verification。运行:
        `python scripts/iea_survey.py BR-L2-050`

        在获得 IEA 分数后:
        - 若 IEA ≥ 1.8:命题满足 verified 的 IEA 门槛(但仍需其他 required
        fixes 全部落地);
        - 若 1.2 ≤ IEA < 1.8:命题满足 weakly_verified 门槛,IEA 不是 verified
        的单独障碍,但与其他 required fixes 合力;
        - 若 IEA < 1.2:命题连 weakly_verified 的门槛都未达到——需追加独立
        来源通道或接受 rejected/candidate 状态。

        在 cross_verification 中需额外标注:
        (1) digital_sociology 与 social_psychology 在 CMC(计算机媒介通信)
        主题上的语料重叠风险;
        (2) 按 instrument_correlation discount_rule 披露单 LLM 执行的仪器折扣;
        (3) 此命题属新颖命题(非教科书共识),按 mitigation 条款仪器折扣应视为
        承重红旗。
      rationale: |
        无 IEA 分数,无法判断命题是否满足任何证据门槛。这是当前最硬的 procedural
        缺陷——不是"IEA 不够高",而是"IEA 根本不存在"。

    - id: REQ-BR-L2-050-D
      severity: required
      what: |
        预注册 falsifiability (a) 的完整操作口径(红旗 6 + 红旗 11):

        (A) 锁定控制变量清单:至少包括年龄、教育水平、城市化、基线群体认同强度、
        群体类型(兴趣/血缘/地缘/职业)、群体规模、群体存续时间(年)、成员在群体
        中的角色(核心/边缘)。声明:所有控制变量在见数据前锁死;若分析在多种控制
        变量规格中选择报告,必须预注册主规格并报告所有规格的敏感性分析结果。

        (B) 论证/替换 3 个月时间窗口:提供窗口的独立依据(如文献中群体认同自然
        衰减的典型时间尺度),或改用多窗口测量(1 个月/3 个月/6 个月/12 个月)并
        预注册多重比较校正方案。

        (C) 指定具体测量工具:指定量表名称、版本、维度。例如"群体认同以
        Cameron(2004)的 Ingroup Ties Scale(三维:Ingroup Ties/ Centrality/
        Affect)的 Ingroup Ties 子量表为主测量,Centrality 和 Affect 为次要测量"。

        (D) 注册效应量预期:不仅注册"显著差异(p<0.05)",还需注册预期效应量的
        方向和大致范围(如 Cohen's d ≥ 0.3),以及所需的最小样本量(基于 power
        analysis)。这使 null 结果可以被区分为"效应不存在"和"样本不够大"。
      rationale: |
        当前 falsifiability (a) 在操作层面不具备可执行性——"控制其他变量"、
        "3 个月"、"标准量表"三个关键参数的模糊性使证伪测试无法硬着陆。
        预注册清单直接堵住 L4-009 判例要堵的"事后口径选择"漏洞。

  should_fixes:
    - id: SHOULD-BR-L2-050-E
      severity: should
      what: |
        在 statement 中诚实标注反事实不可观测问题:
        "'若无数字通信,群体认同衰减会更快'这一因果主张依赖不可观测的反事实。
        在实践中,可用跨国家数字通信渗透率差异、或同一群体引入数字通信工具前后
        的面板数据,作为接近反事实的识别策略。本命题的实证置信度受制于反事实
        识别的质量。"
    - id: SHOULD-BR-L2-050-F
      severity: should
      what: |
        在 statement 中标注归因多元性:
        "群体认同衰减受多因素驱动(群体目的达成/外部冲击/代际更替/领导者退出),
        数字通信的维护成本效应是其中之一。本命题不声称数字通信是认同衰减的
        唯一或主导决定因素——它的效应量可能小到被其他因素淹没。"
    - id: SHOULD-BR-L2-050-G
      severity: should
      what: |
        补充 2014 年后的数字生态文献,更新引用的时效性。boyd(2014)是该砖最新
        的引用——距今已逾 10 年。数字通信生态在此期间经历了算法推荐取代时间线、
        短视频崛起(TikTok)、平台碎片化等结构性变化。建议补充 2020 年后的综述
        或元分析(如社交媒体与心理健康/归属感的最新研究),验证旧文献的发现对
        当代数字生态是否仍然成立。
    - id: SHOULD-BR-L2-050-H
      severity: should
      what: |
        在 falsifiability (a) 中注册所需的统计功效参数:最小可检测效应量、
        所需样本量(power ≥ 0.8)。此注册使"无显著差异"可被区分为"效应不存在"
        (足够的 power 仍无显著差异)和"样本不够大"(power 不足以检测合理效应量)。
        若不注册,任何"不显著"结果都面临"可能只是样本不够大"的质疑——这给了
        null 结果一个额外的生存空间(talismanic 的统计版本)。

round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    本桥接(BR-L2-050)的核心机制方向(数字通信降低维持群体身份信号的边际成本→减缓认同衰减)有真实经验基础(boyd、Baym、Rainie&Wellman、Walther超人际模型),且已自觉区分"补充 vs 替代"、"表达性 vs 工具性"两个边界,并预注册了控制变量和时间窗口。但仍差一口气到 verified,被 3 条 required 缺陷挡在门外:

    (1) 红旗#11 口径未完整注册 —— 测量工具(Leach et al., 2008 的 Identification with a Psychological Group Scale)被指定了,但"3个月内的归属感下降幅度"的分子分母未注册:下降幅度是按绝对差、相对比例、还是效应量(d)算?基线测量在哪个时间点(t0)?只有数字没有口径,这是 L4-009 判例的精确重演。

    (2) 红旗#2 逐格判空弱 —— 核心预测"数字通信补充线下的群体,3个月内归属感下降幅度显著低于仅依赖线下互动的群体"在经验上几乎是 trivial 的:补充>纯线下,本身就是"加了东西比没加好"的同义反复。需要更强预测:数字通信是否能把衰减半衰期从 X 拉到 Y?或者把衰减速率压缩到某个具体数量级?否则空格是平的不是硬的。

    (3) 红旗#14 反向失败模式注册不完整 —— 文件自称注册了"切换成本主导→加速衰减"的反向模式,但漏掉了第二个独立反向通道:算法推荐的群体多样性暴露(parasocial/多群体并置)对单一群体认同的稀释效应。这一通道在 Rainie & Wellman 的"网络化个体主义"框架里是独立于切换成本的(free model 在 sources 里自己引用了但没纳入机制)。

    反例猎捕:我构造了 4 个候选反例,均被消化或揭出过度伸张而非净杀 —— 见猎捕段。因此判 needs_revision 而非 rejected,这是可定向修订救活的。
  red_flags: |
    1. brick=conclusion — 未命中。核心机制(数字通信降低边际成本→减缓衰减)未在父定理 THEOREM-group-identity-decay 中被原文断言,该定理只说"不重温就衰减",不包含数字技术作为抑制通道的具体形式。非窄化砖。

    2. 逐格判空 — 命中(弱)。核心空格"补充>纯线下"近乎同义反复;需要更强预测(具体半衰期、效应量下限、量级差)。required。

    3. 测量轴正交 — 未命中。自变量(数字通信频率)与因变量(认同强度变化)异源,可分离测量。

    4. 射程/排除钩子独立于结果 — 未命中。排除条件("完全虚拟化""工具性群体")按群体类型事前划,未事后按结果开脱。

    5. 分类判据档位匹配 — 未命中。连续变量(数字通信频率)用连续预测,工具性/表达性二分用在适当位置。

    6. anti-talisman 真兑现 — 未命中(部分疑虑)。控制变量清单齐全,但"基线群体认同强度"作为协变量,本身可能内生(认同强的人更爱用数字通信维系),需用 IV 或滞后基线。should 而非 required。

    7. 现实锚事实核查 — 未命中。引用文献真实存在,论点未被过度解读。

    8. 条件是下定义还是做预测 — 未命中。条件是经验可检验的(补充vs替代、稳定性、投资感),非定义性。

    9. 枚举穷尽 — 不适用。本桥接未声称枚举完备类。

    10. primary_suspect 指对 + 平凡化检查 — 未命中。自认最弱腿(切换成本反向)是真实弱腿之一,但漏掉了算法多样性暴露通道(见红旗#14)。

    11. 口径完整注册 + 歧义反向裁决 — 命中(required)。3 个月下降幅度的分子分母、基线 t0、合并规则、最小可检测效应量均未注册。这是 L4-009 判例的精确类比:数字给出但口径没给 → 一旦反例出现作者可事后选救命的口径。required。

    12. 数据源同根冒充多源独立 — 未命中。本桥接主要靠二手文献综合,未声称多源数据验证。

    13. API 可及性冒充认识论独立性 — 未命中。无 API 滥用。

    14. 反向失败模式缺失 — 命中(部分 required)。已注册"切换成本→加速衰减",但漏掉"算法多样性暴露(parasocial/多群体并置)→单一认同稀释"。该通道在所引 Rainie & Wellman (2012) 框架中是独立于切换成本的:即使不切换群体,持续暴露于多群体信号也会拉低单一群体认同强度。required(因为它直接挑战"数字通信减缓衰减"的核心主张方向,且与作者引用的理论框架直接冲突而作者未察觉)。

    15. Bootstrap 限定缺失 — 未命中。本桥接不涉及冷启动/稳态区分(数字通信已是稳态技术)。

    16. 验证对象存在性未标注 — 未命中。数字时代的真实群体(线上社群+线下社群)是充分可观测的对象,非空集。
  counterexample_hunt: |
    我构造了 4 个候选反例/边界案例:

    (A) 跨国移民 WhatsApp 群(高流动性、高数字通信、高表达性) — 猎捕结果:被消化为支持案例。许多移民研究显示 WhatsApp 群确实延缓了离散社群的认同衰减,与桥接预测一致。

    (B) Reddit 长期 subreddit(完全虚拟化、零线下、纯表达性) — 猎捕结果:部分被消化、部分揭出过度伸张。许多 subreddit 在 3-6 个月内有显著的用户活跃度衰减,即使数字通信极频繁。这支持桥接"完全虚拟化时加速衰减"的限制条件,但同时揭出一个新问题:即使在纯表达性群体中,"数字通信补充线下"的假设也无法成立——纯线上群体的高数字通信强度并未减缓衰减,这与桥接"3个月内数字通信>线下"的笼统预测存在张力。过度伸张点是"3个月"窗口可能太短,纯线上群体可能需要更长时间才显出衰减差异。

    (C) 中国家族微信群(高表达性、高数字通信、有线下家族聚会作为补充) — 猎捕结果:被消化。这类群普遍呈现高认同维持率,与桥接"补充>纯线下"预测一致。

    (D) 算法推送下的多群体并置(用户同时是 5+ 个 Facebook 群活跃成员) — 猎捕结果:揭出过度伸张。这一情境下用户报告的"群体归属感"在单一群体维度上显著低于单群体深度参与用户,这与本桥接"数字通信补充线下→减缓衰减"的单一群体层面预测不矛盾,但与隐含假设"数字通信的总使用量越大、单一群体认同维持越好"矛盾。这是红旗#14 漏掉的反向通道的经验证据。

    净杀:无。被消化:2 个(A、C)。揭出过度伸张:2 个(B 的时间窗口、D 的多样性通道)。因此不构成 rejected,构成 needs_revision 的充分理由。
  required_fixes:
    - "1) 注册完整测量口径:3 个月下降幅度的分子(终测认同分数)、分母(基线认同分数,及 t0 定义)、合并规则(每位被试的相对变化 vs 组均值差)、最小可检测效应量(预先声明能拒绝 H0 的 d 下限)——直接对应红旗#11。"
    - "2) 把\"算法多样性暴露→单一群体认同稀释\"作为独立反向失败模式注册,并预注册其操作化(同时活跃群体数 N 与单一群体认同分数的偏相关),承认它与切换成本是两条独立通道——直接对应红旗#14。"
    - "3) 收紧核心空格预测:把\"补充>纯线下\"提升为更硬的预测,例如\"数字通信补充线下的群体,其认同衰减半衰期相比纯线下群体延长至少 X 倍(预注册 X 值,如 1.5 倍)\"或\"在 6-12 个月窗口内,补充组的认同分数下降不超过纯下线组的 50%\"——直接对应红旗#2,否则空格是同义反复。"
    - "4) (should) 处理\"基线认同强度\"的内生性:用滞后基线(t0 前 1 个月的测量)或工具变量,避免反向因果——对应红旗#6。"
    - "5) (should) 在限制条件里补一句\"3 个月窗口对纯线上群体可能太短,纯线上场景建议延至 6-12 个月\"——对应反例猎捕 B 揭出的过度伸张。"
  oneline: |
    核心机制方向对、口径注册缺一半、反向失败模式漏一条独立通道、空格预测偏软——差一口气到 verified,3 条 required + 2 条 should 可定向修复救活。

