id: ADV-REVIEW-BR-L2-038
type: adversarial_review
reviews: BR-L2-038
layer: L2-bridging
target: BR-L2-038
target_term: 道德哑口无言现象的跨文化普遍性
rounds: 1

人话摘要: |
  对 BR-L2-038(道德哑口无言现象的跨文化普遍性)的 round-1 独立对抗审查。
  裁 needs_revision:双加工模型(直觉先行、理性追认)作为人类道德认知的基本架构在
  认知科学中有扎实支撑,但本命题声称的"跨文化普遍性"存在 3 条 required 缺陷:
  (1)核心预测的条件结构("且被试无法给出理性解释时")自封——条件预选了预测结果,
  使"被试会坚持判断"近乎 tautology,真正的经验内核("每种文化中都存在无法被该文化
  自身理性化解的禁忌")未被操作化;
  (2)falsifiability (c)的"所有道德判断"全称量词使其在实践中不可证伪——反例猎捕者
  不可能穷举一个群体的全部道德判断来证明"不存在直觉先行";
  (3)缺 IEA/cross_verification 独立核算——两份来源(道德心理学/文化人类学)共享
  Shweder→Haidt 学术谱系,理论上不独立,且当前无任何正式的独立性加权。
  反例猎捕发现:在具备系统化道德理性传统的文化(如塔木德法学、伊斯兰教法学)中,
  "无法给出理由"这一条件本身取决于"什么算合格理由"的文化标准——因变量(哑口无言)
  的测量标准是文化相对的非中立量尺,挑战了跨文化比较的效度。

round_1:
  reviewer: independent-adversarial-reviewer
  date: 2026-07-16
  verdict: needs_revision
  verdict_note: |
    本命题的核心直觉——道德判断由快速直觉系统主导、慢速理性化系统追认——在认知
    科学中有深厚根基。Haidt (2001) 的经典实验和 Greene et al. 的 fMRI 研究确实
    提供了双加工模型的稳健证据,且该模型在认知心理学中已获广泛接受。命题的贡献在于
    将此认知架构主张推至"跨文化普遍性"——这是一个可检验的经验扩展,不是纯理论复述。

    但三条 required 级缺陷阻止 verified 裁决:

    1.【预测条件自封——tautology 风险——REQUIRED】
    核心 statement 的可检验预测为:"当实验者呈现一件被该文化视为禁忌但无明显危害的
    行为...且被试无法给出理性解释时,被试仍会坚持该行为是错误的,并且表现出认知失调"。
    此预测的"且被试无法给出理性解释时"条件预选了结果——哑口无言(dumbfounding)的
    定义本身就是"无法给出理由但仍坚持道德判断并表现认知失调"。换言之,预测说的是
    "当哑口无言的条件满足时,哑口无言会出现"——这在逻辑上趋近于 tautology。

    真正的非平凡经验主张应该是:"在每种文化中,都存在一些被该文化视为禁忌的行为,
    对于这些行为,该文化的一般成员无法提供 harm-based 的充分理性理由,但即便如此
    他们仍坚持该行为是错误的并表现认知失调。"换言之,主张应是"每文化中都有 dumbfounding
    的靶行为",而非"如果你找到了 dumbfounding 的靶行为,你会看到 dumbfounding"。
    当前 statement/falsifiability 的措辞混淆了这两者,而只操作化了后者(tautology 侧)。
    需重新操作化前者(经验侧)。

    2.【falsifiability (c) 不可操作——全称量词护身符——REQUIRED】
    falsifiability (c) 要求"人类学家在某个自然群体中发现,所有道德判断均为纯粹的
    理性推理产物,不存在任何'直觉先行'的案例"。此条件中的"所有道德判断"使用了
    全称量词——证伪者需穷举一个群体的全部道德判断并证明无一例外。这在实践中不可行:
    道德判断的集合是开放的、边界模糊的(什么算"道德判断"?),且在任何有文字记载的
    社会中,道德判断的数量多到不可能被穷尽检验。这不是一个可操作的证伪路径,而是
    一个逻辑上可陈述但实践中不可执行的护身符。按 anti-talisman 红旗标准:证伪条件
    必须是可事前测量的正向测试,不应要求证伪者证明全称命题。

    3.【IEA 缺失——无独立核算——REQUIRED】
    文件无 cross_verification 段,IEA 未经正式计算。两份来源(道德心理学 moral_psychology
    与文化人类学 cultural_anthropology)之间存在显著的学术谱系重叠——Shweder 是
    Haidt 的博士导师,MFT(道德基础理论)直接建立在 Shweder 三领域框架之上。按
    independence-model 的 instrument_correlation discount_rule:即使两学科在方法论
    上有分叉(实验室实验 vs 田野调查),其理论框架共享同一学术谱系,且均由单一 LLM
    执行判断,仪器有效独立性低于表面学科独立性。需执行正式的 IEA 调查(cross_verification),
    应用仪器折扣,并诚实披露"多学科同意可能是同一学术谱系内的回声而非独立验证"。

    另附一条承重红旗:桥梁只接到 CONCEPT-morality/CONCEPT-norm/CONCEPT-agent 三个
    概念,未接到 THEOREM-moral-internalization。该定理(道德内化——进化给每个人装了
    免费内部警察)恰是本命题双加工模型在体系中的自然 L1 锚点:定理解释 WHY(道德直觉
    为什么进化出来),本命题解释 HOW(直觉在认知层面如何运作)。缺少此连接使桥梁的
    体系整合不完整。

    三条 required 均可通过定向修订修复(非结构塌陷):(1)重写预测为"每种文化中都
    存在 dumbfounding 靶行为",移除自封的条件结构;(2)将 falsifiability (c)替换为
    可操作的证伪条件(如"在某文化中,随机抽取 N 个道德判断场景,>X% 的被试在判断后
    立即给出 harm-based 理由且理由被独立评委判定为充分→削弱命题");(3)执行 IEA
    调查并诚实披露学术谱系重叠。故判 needs_revision 而非 rejected。

  red_flags:
    brick_is_conclusion:
      hit: false
      detail: |
        "道德判断由直觉先行、理性追认的双加工系统驱动且此架构具有跨文化普遍性"这一
        核心主张不在任何 L1 公理/定理中。

        THEOREM-moral-internalization 说的是"进化为什么给人类装了内部警察"——道德
        内化的演化功能(省去外部监控成本)。该定理不涉及认知加工架构,不规定直觉与理性
        的加工顺序,不声称跨文化普遍性。它是一个演化功能解释(ultimate cause),本命题
        是一个认知机制描述(proximate mechanism)——层次不同。

        CONCEPT-morality 定义了道德作为规范子类的结构位置,不涉及心理加工。CONCEPT-norm
        定义了规范的涌现机制,不涉及个体认知。CONCEPT-agent 定义了行动者的目标导向性,
        不涉及道德判断的具体认知流程。

        本命题将道德心理学中已确立的双加工模型(Haidt 2001, Greene et al. 2001/2004)
        引入体系作为 L2 桥接砖,是体系此前未覆盖的经验内容。非平凡经验内核成立。

        但存在一条边界风险:若将"直觉先行"定义为"大脑中情绪相关脑区(vmPFC/杏仁核)
        先于理性相关脑区(DLPFC)激活",将"理性追认"定义为"DLPFC 后续激活且被试
        口头报告的理由搜索过程",则命题的"跨文化普遍性"在 fMRI 可及的文化中退化为
        定义性对比(脑区激活时序本身就是定义)。抵抗此退化的防线是:(1)行为层面的
        dumbfounding 现象(非仅神经层面),(2)跨文化的行为实验可复现性(非仅在 fMRI
        文化中),(3)falsifiability 的多元路径(行为+神经+人类学)。防线存在,但需在
        修复中加固——尤其需澄清"直觉"和"理性"的操作化定义不依赖神经成像(否则
        命题在无 fMRI 的文化中不可检验)。

    empty_cell_tautology:
      hit: true
      detail: |
        本红旗命中——核心预测的条件结构自封,使空格预测趋近 tautology。

        当前预测:"当实验者呈现一件被该文化视为禁忌但无明显危害的行为(如吃狗肉、
        乱伦等),且被试无法给出理性解释时,被试仍会坚持该行为是错误的,并且表现出
        认知失调(dumbfounding)。"

        拆解此预测的逻辑结构:
        - 前提 1:行为被该文化视为禁忌 → 被试认为该行为是错的(这是"禁忌"的定义性
        后果——禁忌就是被文化标记为不可为的行为)
        - 前提 2:被试无法给出理性解释 → 这是 dumbfounding 的输入条件
        - 结论:被试坚持该行为错误 + 表现认知失调 → 这是 dumbfounding 的定义性输出

        从前提 1+2 到结论的推理:人们认为禁忌是错的(前提 1),当被追问理由时找不到
        理由(前提 2),于是坚持原判并感到不适(结论)。前提 1 保证了"坚持原判"的方向,
        前提 2 保证了"无法给出理由"的事实,结论只是将两者组合并附加了"认知失调"的
        心理状态描述。整个推理链条中,唯一不是定义性/tautological 的元素是"认知失调"
        ——即被试在被问住后是否真的感到不适/困惑/情绪不安。而这恰恰是 dumbfounding
        文献的核心现象学特征:不是"不会说理"而是"不会说理 + 同时感到不安"。

        真正的空格预测应该是:"在任何文化中,存在一套禁忌行为集合 S,对于 S 中的
        行为,该文化的一般成员(i)认为它们是错的,(ii)当被要求给出 harm-based 理由时
        无法给出充分理由,(iii)在无法给出理由后不改变判断,(iv)在此过程中表现出可观测
        的认知失调。"其中(ii)和(iii)分开——(ii)是关于文化资源(该文化是否为这些禁忌
        提供了充分的理性化话语),(iii)是关于心理反应(在缺乏理性化资源的条件下人们
        如何反应)。当前预测将(ii)和(iii)合并为条件-结论,取消了独立检验两者的可能。

        修复方向:将预测重写为"每种文化中都存在 dumbfounding 靶行为"(存在性主张),
        而非"如果你找到了 dumbfounding 靶行为,你会看到 dumbfounding"(条件性定义)。
        详见 required_fix #1。

    measurement_axis_orthogonality:
      hit: false
      detail: |
        自变量(文化、道德违规类型)与被观测量(dumbfounding——无法给出理由+维持判断+
        认知失调)在原则上可异源测量:
        - 文化/违规类型:由实验者独立选择(民族志知识+实验设计)
        - dumbfounding:由独立评分者对被试口头报告进行编码(理由充分性评分+判断维持+
        情绪指标)

        这与 DED-007 式的"分母用实际获授者"闭环焊接有本质区别——IV 的选择不依赖于
        DV 的读数。

        但存在一个次级测量独立性风险:"理由是否充分"的判定标准具有文化相对性。在
        Haidt 的原始实验中,理由被判定为"不充分"的标准是 harm-based consequentialist
        框架("有没有人受到伤害?"——当被试说"可能有心理伤害"但场景已排除此可能时,
        被认为理由不充分)。但在一个以"神圣诫命"为终极道德权威的文化中,"因为神禁止"
        是一个在该文化框架内完全充分的理由——被试不会感到认知失调,因为他们认为自己
        已经给出了充分的理由。

        这意味着因变量(dumbfounding)的测量依赖于一个文化上非中立的"理由充分性"标准。
        如果标准是 harm-based(西方世俗道德哲学的默认框架),则非 harm-based 文化的
        道德判断会系统性地被编码为 dumbfounding,即使在该文化内部这些理由被视为完全
        充分。这不是 IV-DV 焊接,而是 DV 测量的跨文化效度问题——列为 should 而非
        required,因为可通过预注册文化中立的理由充分性判据来缓解(如"被试自己是否
        对给出的理由感到满意"而非"实验者是否认为理由充分")。

    excluded_outcomes_independence:
      hit: false
      detail: |
        排除项按可事前测的渠道划界:
        - "不声称所有道德判断都完全由直觉主导" → 排除了全称量化,保留了理性可干预的
        空间。此排除在见数据前声明,渠道独立(是否有理性干预可独立检验)。
        - "不排除理性化在特定条件下能够改变直觉判断" → 排除了不可修正性。此排除有
        独立的实验检验渠道(训练/反思是否改变道德判断的神经基础)。
        排除方向合理,不事后开脱。

        falsifiability 段的排除(见下 anti-talisman 分析)的问题不在方向,而在可操作性。

    classification_granularity:
      hit: false
      detail: |
        本命题处理的是二元分类(直觉先行 vs 理性先行)和连续维度(跨文化 dumbfounding
        程度)。未将连续体强行切为不当离散箱。dumbfounding 的存在/不存在是自然的二分
        (要么出现要么不出现),不涉及 DED-006 式的"连续量被二分"问题。

    anti_talisman:
      hit: true
      detail: |
        本红旗命中——falsifiability (c) 构成不可操作的护身符。

        falsifiability (a):"在某文化中,当被试面对一个其文化明确视为禁忌但无法给出
        理由的行为时,绝大多数被试会自发改变判断(如从'错误'转为'可接受'),且不表现
        出认知失调或情绪不安"——此条件在方向上可操作(找文化+找禁忌+测反应),但存在
        与核心预测相同的自封问题:条件中的"无法给出理由"预选了测试对象。如果将"无法
        给出理由"从条件改为待检验的结果(即:先随机抽取禁忌行为,然后测试其中多少比例
        的被试无法给出理由+改变判断),则可操作性会大幅改善。

        falsifiability (b):"通过功能性神经成像研究发现,跨文化被试在道德判断中情绪
        脑区的激活从不早于理性脑区,或者直觉系统与理性化系统的加工顺序存在可复现的
        跨文化反转"——此条件在方向上可操作(fMRI+跨文化样本+时序分析)。但需 fMRI
        设施,限制了可在哪些文化中检验。

        falsifiability (c):"人类学家在某个自然群体中发现,所有道德判断均为纯粹的
        理性推理产物,不存在任何'直觉先行'的案例"——此条件使用全称量词"所有道德判断",
        是实践中不可操作的护身符。理由:
        (i)"所有道德判断"的集合是开放的、无明确边界的——什么算"道德判断"本身
        依赖理论框架,不同人类学家可能划定不同边界;
        (ii)在任何社会中,道德判断的数量多到不可能被穷尽检验;
        (iii)即使 99% 的道德判断被证明是直觉先行,砖可辩称"还剩 1% 没查完,所以
        (c)未被触发"——全称量词使此条件永远无法被证伪者"完成"。

        按 anti-talisman 红旗标准:证伪条件必须是可事前测量的正向测试,不应要求证伪者
        证明全称命题。修复方向:将(c)替换为可操作的统计条件——如"在某文化中,随机
        抽取 N≥20 个道德判断场景,独立评委判定其中 >Y% 的被试能够给出 harm-based
        充分理由且理由在给出后不被实验者挑战推翻→该文化中 dumbfounding 不普遍,
        命题被削弱"。详见 required_fix #2。

    reality_anchor_fact_check:
      hit: false
      detail: |
        引用文献的准确性逐条复核:

        (1) Haidt (2001) 经典 dumbfounding 实验——发表属实(Psychological Review,
        "The emotional dog and its rational tail")。核心发现(乱伦场景引发强烈道德
        谴责但被试无法给出充分理由)表述准确。

        (2) Greene et al. (2001, Science; 2004, Neuron) fMRI 研究——发表属实。
        确实发现道德判断中情绪脑区(vmPFC)与理性脑区(DLPFC)的竞争性激活。引用准确。

        (3) Cushman et al. (2006) 行为实验——发表属实(Psychological Science)。
        证实了意图和结果的分离加工路径。引用准确。

        (4) Shweder et al. (1997) 道德三领域框架——发表属实。自主/社群/神性三分
        确为跨文化道德心理学的奠基性框架。引用准确。

        (5) Haidt & Joseph (2004) 道德基础理论(MFT)——发表属实。MFT 确实通过跨文化
        问卷证实了公平/关怀/忠诚/权威/神圣等直觉通道的跨文化存在。引用准确。

        (6) Henrich et al. (2010) WEIRD 样本偏差——发表属实(Behavioral and Brain
        Sciences)。确实强调了 WEIRD 样本偏差问题。引用准确。

        (7) Atran & Norenzayan (2004) 跨文化道德直觉研究——发表属实(Behavioral
        and Brain Sciences)。确实在非 WEIRD 群体中研究了道德直觉。引用准确。

        无引用造假。但有一处【证据过度伸张】需标记:
        文件声称"在非WEIRD群体中也重复了dumbfounding现象"(cultural_anthropology
        rationale)。MFT 和 Shweder 的跨文化研究主要证实的是道德【直觉内容】的跨文化
        差异(不同文化对不同的道德领域有不同的直觉反应强度),而非 dumbfounding【现象】
        (无法给出理由+认知失调)的跨文化复现。MFT 问卷测量的是"人们对不同道德违规的
        情感反应强度",而非"人们在被追问理由时的认知失调程度"。Atran & Norenzayan
        (2004) 研究的是宗教/道德直觉的认知机制,非专门的 dumbfounding 复现研究。
        换言之,现有证据支持"道德直觉是跨文化的",但不直接支持"dumbfounding 现象是
        跨文化的"——这是两个不同层面的主张。详见 counterexample_hunt 中的分析。

        此证据过度伸张不构成事实造假(引用的文献都存在且发现方向与命题一致),但构成
        证据链的推广过度——建议在 cross_verification 中诚实标注"dumbfounding 的跨文化
        直接复现证据目前以 WEIRD 样本为主,非 WEIRD 复现主要为道德直觉内容(非专门的
        dumbfounding 现象)"。

    definition_vs_prediction:
      hit: false
      detail: |
        "直觉先行、理性追认"的加工顺序是可证伪的经验主张——逻辑上自洽的可能世界包括:
        (1)理性判断先于直觉判断,(2)直觉与理性同时启动,(3)不同文化有不同的加工顺序。
        这些替代可能性均不违反逻辑约束,故命题是经验选择而非定义。

        但前提 1(行为被文化视为禁忌→被试认为错)+前提 2(被试无法给出理由)的组合已
        近乎定义性地蕴含结论(被试坚持原判),使得可检验的经验负载几乎全部落在"认知失调"
        这个现象学要素上。这是 tautology 红旗(红旗 2)已覆盖的问题,非定义-vs-预测
        的独立命中。

    enumeration_exhaustiveness:
      hit: false
      detail: |
        本命题未声称可枚举的道德判断类型/物种。它主张的是加工架构(直觉→理性)的跨文化
        普遍性,而非道德内容的类型学。DED-008 红旗不适用。

    primary_suspect_accuracy:
      hit: false
      detail: |
        L2 砖无 formal primary_suspect 字段(L3 要求),按红旗精神审查最弱腿:

        外部识别的最致命软肋(砖未自认):
        (i)【跨文化 dumbfounding 直接证据薄弱】砖声称 dumbfounding 现象具有跨文化
        普遍性,但引用的跨文化证据(MFT/Shweder)主要证实道德直觉内容而非 dumbfounding
        现象的跨文化存在。这是当前最脆弱的经验腿——详见 reality_anchor_fact_check
        和 counterexample_hunt。

        (ii)【预测条件自封】核心预测的"且被试无法给出理性解释时"条件预选了结果,
        使预测近乎 tautology。这是当前最脆弱的逻辑腿——详见 empty_cell_tautology。

        (iii)【"理性理由"的文化相对性未处理】不同文化对"什么算充分的道德理由"有
        不同的标准。在一个"神圣诫命=终极理由"的文化中,被试不认为自己"无法给出理由"
        ——他们已经给了(在文化内部)充分的理由。DV(哑口无言)的跨文化测量效度因此
        存在问题。这是当前最脆弱的测量腿。

        (iv)【桥梁未接到 THEOREM-moral-internalization】该定理解释道德直觉为何进化
        出来,本命题解释道德直觉如何运作——两条之间存在天然的理论连接,但 bridges_to
        中未包含此定理。这不仅削弱了桥梁的体系整合度,也意味着命题没有利用体系已有的
        理论资源来加固自己的论证。

    caliber_registration:
      hit: true
      detail: |
        本红旗命中——"口径完整注册"要求阈值连同分子/分母/测量口径一次性注册(判例
        L4-009)。本命题在此维度存在两条缺陷:

        (1)【dumbfounding 的操作化口径未注册——REQUIRED】
        命题声称"被试无法给出理性解释"+"仍坚持该行为是错误的"+"表现出认知失调",
        但三项的操作化均未注册:
        - "无法给出理性解释":什么样的解释算"理性"?谁来判定(Haidt 实验中是实验者
        通过反复追问来判定,但这是否可跨文化标准化)?几轮追问算"最终无法给出"?
        - "坚持该行为是错误的":需被试明确表述"仍然是错的"还是从其他回答中推断?
        - "认知失调":通过什么指标测量(口头表达的困惑/情绪自评/生理指标/行为指标)?

        按 L4-009 判例精神:这些口径必须在见数据前注册,否则在反例出现后调整口径来
        救推论的风险无法排除。当前文件未注册任何一项的操作化细节。

        (2)【falsifiability (a) 的"绝大多数"阈值未注册——REQUIRED】
        falsifiability (a) 说"绝大多数被试会自发改变判断"。但"绝大多数"的百分比
        阈值未注册。是 >50%? >80%? >95%? 不同阈值对应不同的统计检验效力,且会影响
        证伪的难度。需锁定具体阈值。

        两项合计构成 required 级口径注册缺陷。修复:在 falsifiability 段或独立的
        operationalization 段中注册:(i)dumbfounding 三项指标的编码手册(含跨文化
        适用的判定标准),(ii)"绝大多数"的百分比阈值及统计检验方案。

  iea_independence_check:
    moral_psychology:
      weight: N/A (IEA 未计算)
      role: 主证据源(Haidt/Greene/Cushman 实验+神经科学)
      detail: |
        道德心理学的实验/神经科学证据构成了本命题的核心经验支撑。Haidt (2001) 的
        dumbfounding 实验是命题的直接经验前身,Greene et al. 的 fMRI 研究提供了
        神经机制层面的独立验证。方法论:行为实验+fMRI——在心理学内部构成方法三角
        验证。但所有核心证据均来自 WEIRD 被试(Western, Educated, Industrialized,
        Rich, Democratic),这正是砖声称要超越的样本局限。

    cultural_anthropology:
      weight: N/A
      role: 跨文化证据源(Shweder/MFT/Atran & Norenzayan)
      detail: |
        文化人类学/跨文化心理学提供了道德直觉跨文化差异的证据,但其直接测量的是道德
        【直觉内容】(什么行为引发什么直觉),而非 dumbfounding【现象】(无法给出理由+
        认知失调)。换言之,这一来源支持"不同文化有不同的道德直觉"但不直接支持"所有
        文化中人们在无法给出理由时都表现 dumbfounding"。

    source_independence:
      moral_psychology_vs_cultural_anthropology:
        reported: 未计算
        actual_assessment: |
          两份来源之间存在显著的学术谱系重叠:
          (1) Shweder(芝加哥大学)是 Haidt 的博士导师。MFT 的三领域→五基础扩展直接
          建立在 Shweder 的自主/社群/神性框架之上。
          (2) 两份来源共享同一核心理论框架:道德直觉主义(moral intuitionism)。这不是
          两个独立学派从不同前提出发达成共识——这是同一学派的内部分工(实验验证+
          跨文化扩展)。
          (3) 方法论上有分叉(实验室实验/神经成像 vs 民族志/跨文化问卷),但理论前提
          和核心概念框架高度重叠。

          按 independence-model 的 calibration_note,此类"理论框架 vs 田野数据"的
          方法论分叉独立系数约为 0.6(evo_bio↔cultural_universals)。但 moral_psychology↔
          cultural_anthropology 的理论重叠程度显著高于 evo_bio↔cultural_universals
          (两者从同一学术谱系出发),更诚实的独立系数应在 0.3-0.4 范围。

          若正式计算 IEA(假设两条均为锚源级证据,各 weight=1.0,独立系数 0.35):
          IEA = 1.0 + 1.0 × 0.35 = 1.35。在 weakly_verified 门槛(1.2)以上但远低于
          verified 门槛(1.8)。这还是在假设备来源内部证据均完美支撑命题的前提下的
          上限估计——若考虑跨文化 dumbfounding 直接证据的薄弱(见 reality_anchor),
          有效 IEA 可能更低。

    instrument_correlation:
      applicable: true
      detail: |
        本命题当前无 cross_verification 段,因此无 instrument_disclosure。但按
        independence-model 的 discount_rule:当 L2 桥接命题的 cross_verification
        由单一 LLM 执行时,必须披露仪器折扣。在未来的 IEA 调查中,必须包含:
        (1) 诚实披露单 LLM 执行的仪器相关性;
        (2) 引用 ICV-001(布干达)判例说明共享语料如何制造虚假一致;
        (3) 评估缓解因素:双加工模型属"多重复现的稳固共识命题"(30+ 年跨方法复现),
        但"跨文化 dumbfounding 的普遍性"这一扩展主张并非教科书共识,仪器折扣对其
        更具杀伤力(按 mitigation 条款,"新颖/争议命题应把此折扣视为承重红旗")。

    iea_verdict:
      status: 未计算
      required_action: |
        必须执行正式的 IEA 调查(cross_verification):
        (1) 对两来源分别判定 agree/disagree/partially_agree;
        (2) 登记成对独立系数(诚实反映学术谱系重叠);
        (3) 应用 instrument_correlation 折扣并诚实披露;
        (4) 若 IEA ≥ 1.2(weakly_verified 门槛)但 < 1.8(verified 门槛),接受
        weakly_verified 为当前证据生态下的诚实定级——跨文化 dumbfounding 的直接
        证据确实薄弱,不应强行冲 verified;
        (5) 特别标注:两来源的"一致同意"可能是同一学术谱系(Shweder→Haidt)的内部
        共识,而非独立验证——需在 verdict_note 中诚实地将学术谱系重叠视为对独立性
        的实质性削弱。

  counterexample_hunt:
    method: |
      主动构造/搜寻能证伪核心主张的跨文化经验案例。核心主张:道德哑口无言(直觉先行、
      理性追认,无法给出理由但仍坚持判断+认知失调)是人类跨文化不变的认知架构特征。
      三个猎捕方向:(1)存在能系统性提供充分道德理由的文化——挑战 dumbfounding 的
      普遍性;(2)存在直觉与理性加工顺序反转的文化——挑战双加工架构的普遍性;
      (3)"理性理由"标准的文化相对性——挑战测量的跨文化效度。

    cases:
      - direction: "系统化道德理性传统使 dumbfounding 消失——塔木德法学案例"
        description: |
          在正统犹太教传统中,拉比法学(Talmudic jurisprudence)为饮食律法(kashrut)、
          安息日律法(shabbat)、洁净律法(taharat ha-mishpacha)等所有主要禁忌提供了
          多层级的理性化解释。以"为什么猪肉被禁止"为例,一个受过基础宗教教育的犹太
          人可以给出:
          - 文本层:利未记 11:7-8 和申命记 14:8 直接禁止
          - 评注层:拉希(Rashi)和迈蒙尼德(Maimonides)提供了健康/伦理/象征性解释
          - 哲学层:卡巴拉神秘主义提供了宇宙论层面的理由
          在这一传统中,几乎不存在"无法给出理由"的禁忌——因为整套塔木德法学体系的
          核心功能就是为每一条诫命(mitzvah)提供理由(ta'amei ha-mitzvot)。

          类似的系统化道德理性传统也存在于:
          - 伊斯兰教法学(fiqh):五范畴分类(wajib/mandub/mubah/makruh/haram)配合
          沙里亚目标(maqasid al-sharia——保护宗教/生命/理智/血统/财产)提供了
          每条教法的理性化框架
          - 天主教道德神学:自然法理论+决疑术(casuistry)为道德禁令提供系统的理性论证

        counter_impact: 揭出测量效度问题——不净杀
        analysis: |
          此案例不直接净杀命题,因为:
          (i) 即使一个文化为禁忌提供了理性化话语,个体成员是否内部化了这些理由仍是
          经验问题——一个未受过充分宗教教育的信徒面对"为什么不能吃猪肉"依然可能
          表现出 dumbfounding("因为...就是不能吃...");
          (ii) Haidt 式的 dumbfounding 实验可以选择该文化中恰好缺乏理性化传统的
          禁忌——例如正统犹太教中 shatnez(羊毛和亚麻不可混纺)的理由确实比猪肉禁忌
          的理由薄弱得多,即使在拉比文献中也存在争议。

          但揭示了命题的一个深层测量效度问题:
          【什么算"充分的理性理由"?】
          在 Haidt 的原始实验中,理由被判定为"不充分"的标准基于 harm-based
          consequentialist 框架——被试说"可能有人受伤害"但场景已排除伤害可能时,
          被认为理由不充分。但在正统犹太教/伊斯兰教/天主教的道德理性传统中,道德理由
          的结构可能是:
          - 权威理由(deontic):"因为神/先知/教会如此规定"——在该文化内部这是充分理由
          - 美德理由(aretaic):"因为这使人不洁/不圣洁"——在神圣框架内这是充分理由
          - 宇宙论理由(cosmological):"因为这扰乱神圣秩序"——同样是内部充分的理由

          当被试说"因为神禁止"时,在一个世俗 harm-based 框架下这被编码为"没有理由"
          (因为不是 harm-based),但在该文化内部这是最充分的理由。这里的核心问题是:
          dumbfounding 的判定依赖于一个文化上非中立的"理由充分性"标准——如果你用
          harm-based 标准去衡量神圣/权威/美德道德文化,你会系统性地高估 dumbfounding
          的发生率。

          这是测量效度问题而非核心主张的净杀——因为命题可以说"我们用文化中立的
          理由充分性标准(如被试自己对理由的满意度而非实验者的外部判定)重新定义
          dumbfounding"。但当前文件未做此区分。

        verdict: 揭出过度伸张——DV(dumbfounding)测量的跨文化效度未经检验

      - direction: "日本/东亚文化中的道德沉默——不是哑口无言而是文化规范"
        description: |
          在日本文化中,对某些道德/社会规范问题保持沉默("腹芸"——以心传心的默契)
          被视为一种社交美德,而非认知失调的表现。当被问及"为什么这样做是错的"时,
          日本被试可能沉默或给出简短回答——不是因为找不到理由,而是因为在日本
          文化中,过度解释道德判断本身被视为不恰当的(暗示对方缺乏"读空气"的能力)。
        counter_impact: 揭出混淆因子——不净杀
        analysis: |
          此案例揭示:在跨文化实验中,"无法给出理由"可能与"不愿给出理由"(文化规范的
          沉默偏好)相混淆。如果某文化中人们在被追问道德理由时保持沉默是出于礼貌
          而非 dumbfounding,那么实验者会将文化礼貌误编码为认知失调。
          这进一步强化了 DV 测量标准需文化中立化的必要性。

        verdict: 揭出混淆因子——沉默的文化意义因文化而异,不可简单等于 dumbfounding

      - direction: "专业伦理学家——理性系统性地压制直觉"
        description: |
          受过系统伦理学训练的专业人士(道德哲学家、生命伦理学家)在面对道德困境时
          能够系统性地抑制直觉反应,基于伦理理论(功利主义/义务论/美德伦理)进行推理
          并得出与直觉相反的结论。Peter Singer 的有效利他主义论证使许多人放弃了
          "家人优先"的道德直觉——这是理性改变直觉的明确案例。
        counter_impact: 被消化
        analysis: |
          命题的"不声称"段已声明"不排除理性化在特定条件下能够改变直觉判断"。专业
          伦理学训练恰是"特定条件"的典型例子——高度专业化、长期训练、且有明确的
          替代性理性框架。命题声称的是默认认知架构(default mode),非在一切条件下
          不可覆盖。此案例在命题的 scope 内被消化。

        verdict: 被消化

      - direction: "冥想传统中的直觉观察与悬置——上座部佛教"
        description: |
          在上座部佛教的内观禅修(vipassana)传统中,长期修习者被训练观察自心念头的
          生起与灭去,包括道德直觉(如"这个行为是错的"的感受),并练习不立即认同这些
          直觉。资深禅修者报告能够在道德直觉生起的瞬间识别它、观察它、并选择是否
          按它行动。换言之,他们可以通过元认知训练将直觉从"自动主导行为"降级为
          "被观察的心理事件"。
        counter_impact: 被消化——但揭示"普遍性"的程度问题
        analysis: |
          命题的"不声称"段已排除"理性化在特定条件下能够改变直觉判断"。长期冥想训练
          是"特定条件"的极端例子。但此案例揭示了"直觉主导"的程度可能是一个受文化
          实践调制的连续谱,而非不变常量。在冥想传统深厚的文化(如缅甸/泰国/斯里兰卡)
          中,有一定比例的人可能达到了比普通 WEIRD 被试高得多的直觉悬置能力。这不推翻
          "默认架构是直觉先行"的主张,但提示"跨文化普遍性"应更精确地表述为"跨文化
          默认模式"而非"跨文化不变常量"。

        verdict: 被消化——但建议在 statement 中为"普遍性"加入程度限定

    net_kill: none
    exposed_overreach: |
      两条过度伸张被揭示:
      (1)【DV 测量的文化效度】dumbfounding 的判定依赖于"理由充分性"的文化非中立
      标准——harm-based 框架会将非 harm-based 文化的道德推理系统性误判为 dumbfounding。
      这挑战了跨文化比较的效度,但不推翻命题(可通过采用文化中立的理由充分性标准来修复)。
      (2)【跨文化 dumbfounding 直接证据的薄弱】引用的 MFT/Shweder 文献证实的是道德
      直觉内容的跨文化差异,而非 dumbfounding 现象的跨文化复现。证据链存在范畴错层:
      道德直觉内容 vs dumbfounding 现象是两个不同层面的主张,当前文件将前者的证据
      当作后者的支撑。
    conclusion: |
      反例猎捕未发现净杀案例。哑口无言在 Haidt 范式下的稳健性已被大量 WEIRD 复现
      确认,而跨文化方向的直接反例(某文化中人们系统性给出充分 harm-based 理由并改变
      判断)未被发现——但这可能部分因为跨文化 dumbfounding 的专项研究本身稀少。
      最有力的发现不是对命题骨架的净杀,而是对"跨文化普遍性"声称的测量效度挑战:
      "理性理由"的判定标准具有文化相对性,当前文件未处理此问题。这加上预测条件的
      自封结构和 falsifiability (c) 的不可操作性,构成 needs_revision 的综合依据——
      命题骨架(双加工模型)稳固,但跨文化普遍性的经验声称需要更严谨的操作化和
      更诚实的证据标注。

  required_fixes:
    - |
      【重写核心预测以消除条件自封——REQUIRED】
      当前预测:"当实验者呈现一件被该文化视为禁忌但无明显危害的行为...且被试无法
      给出理性解释时,被试仍会坚持该行为是错误的,并且表现出认知失调"——此条件结构
      预选了结果(被试已"无法给出理由"),使预测趋近 tautology。

      修复:将预测重写为存在性主张。建议措辞:
      "在任何文化中,存在至少一个行为集合 D(被该文化视为禁忌),对于 D 中的行为:
      (i) 该文化的一般成员认为它们是错的;
      (ii) 当被要求给出 harm-based 的充分理由时,一般成员无法提供(理由不充分);
      (iii) 尽管(ii),他们仍坚持该行为是错误的;
      (iv) 在此过程中表现出可观测的认知失调(语言困惑/情绪不安/自我报告的不适)。"

      关键改动:将"无法给出理性解释"从【筛选条件】改为【待检验的结果】——实验者
      先随机抽取该文化的禁忌行为(按民族志知识而非预判理由充分性),然后对所有禁忌
      行为测试(ii)(iii)(iv),观察其中多少比例的禁忌行为引发 dumbfounding。命题的
      主张是该比例 >0(每文化中至少存在一些 dumbfounding 靶行为),而非 100%。

      同时需注册:用于判定(ii)的"理由充分性"的跨文化中立标准——建议使用被试自己
      对理由的满意度("你觉得你给出的解释是否充分?")而非实验者的外部理论框架判定,
      以消除"harm-based 框架系统性误判非 harm-based 文化的道德推理"这一 DV 测量
      效度问题。

      此修复不推翻核心直觉(双加工模型),但将预测从近乎 tautology 的条件式转变
      为可检验的经验存在性主张。
    - |
      【替换 falsifiability (c) 为可操作证伪条件——REQUIRED】
      当前 falsifiability (c):"人类学家在某个自然群体中发现,所有道德判断均为纯粹的
      理性推理产物,不存在任何'直觉先行'的案例"——全称量词"所有道德判断"使此条件
      在实践中不可证伪(无法穷举一个群体的全部道德判断),构成 anti-talisman 护身符。

      修复:将(c)替换为可操作的统计证伪条件。建议措辞:
      "(c) 在某文化中,随机抽取 N≥20 个涵盖不同道德领域(伤害/公平/忠诚/权威/神圣)
      的道德判断场景,对每个场景独立测试该文化的一般成员(N≥30):
      (i) 他们是否认为该行为是错误的;
      (ii) 他们是否能给出 harm-based 的充分理由(理由充分性由独立评委按预注册编码
      手册判定);
      (iii) 在(ii)中被评为'理由不充分'的场景中,他们是否改变判断。
      若在被测文化中,>80% 的'理由不充分'场景下被试改变了判断(而非坚持原判+表现
      认知失调),且此模式在至少两个独立文化样本中复现,则本命题的核心主张(直觉主导
      判断是跨文化默认模式)被削弱。"

      关键改动:
      - 将"所有道德判断"的全称量词替换为"随机抽取 N≥20 的样本";
      - 将"不存在直觉先行"的否定存在命题替换为正向量化阈值(>80% 改变判断);
      - 锁定 N≥20 场景和 N≥30 被试的样本量;
      - 保留跨文化复现要求以抵御单文化偶然性。

      此修复使(c)从不可操作的护身符变为可预注册、可执行的证伪实验设计。
    - |
      【执行 IEA 调查并诚实披露学术谱系重叠——REQUIRED】
      当前文件无 cross_verification 段,IEA 未经计算。

      修复:执行正式的 IEA 调查(cross_verification),最少覆盖:
      (i) 对 moral_psychology 和 cultural_anthropology 两来源分别判定
      agree/disagree/partially_agree(使用 iea_survey.py);
      (ii) 登记成对独立系数——诚实反映 Shweder→Haidt 学术谱系重叠,建议独立系数
      取 0.3-0.4(而非 default 0.6),因两来源从同一道德直觉主义学派出发,理论框架
      重叠程度高于典型的"学科间"独立;
      (iii) 应用 instrument_correlation 折扣(单 LLM 执行)并诚实披露——引用
      ICV-001 判例,标注"新颖/争议命题(跨文化 dumbfounding 普遍性)应将仪器折扣
      视为承重红旗";
      (iv) 若 IEA ≥ 1.2 但 < 1.8,接受 weakly_verified 为当前证据生态下的诚实
      定级——因为跨文化 dumbfounding 的直接复现证据确实薄弱,且两来源共享学术谱系;
      (v) 在 verdict_note 中诚实地将"道德直觉内容≠dumbfounding 现象"的证据范畴
      错层显式化。

      此修复不推翻命题,但将通过诚实标注证据生态的当前局限来提升命题的方法论可信度。

  should_fixes:
    - |
      【桥梁到 THEOREM-moral-internalization——SHOULD】
      当前 bridges_to 只包含 CONCEPT-morality/CONCEPT-norm/CONCEPT-agent 三个概念,
      未包含 THEOREM-moral-internalization。该定理(进化给每个人装了免费内部警察)
      恰是本命题双加工模型在体系中的自然 L1 锚点:
      - THEOREM-moral-internalization 回答 WHY:道德直觉为什么进化出来(节省外部
      监控成本,PHY-002 能量守恒)
      - BR-L2-038 回答 HOW:道德直觉在认知层面如何运作(双加工:直觉先行、理性追认)

      两条之间的关系是演化功能(ultimate cause)与近因机制(proximate mechanism)
      的经典互补——这正是 L2 桥接砖应该建立的 L1→经验世界的连接。建议在 bridges_to
      中增加 THEOREM-moral-internalization,并在 statement 中加一句:
      "本命题描述的是 THEOREM-moral-internalization(道德内化的演化功能)在个体认知
      层面的近因实现机制:演化赋予人类的道德直觉(内部警察)在认知加工中以双加工架构
      运作——直觉系统快速自动生成'对/错'判断,理性系统随后为判断搜索理由。"

      此外,也可考虑桥接到 AXIOM-002(信息熵增),论证方向:理性化(维护道德理由的话语
      体系)需持续认知能量投入,这解释了为什么直觉系统作为"低能耗默认模式"在进化上
      占优——直觉判断是认知熵增压力下的节能策略,理性化是只在必要时才启动的高能耗模式。
    - |
      【标注跨文化 dumbfounding 直接证据的薄弱——SHOULD】
      在 applicable_sources 的 cultural_anthropology rationale 中诚实标注:
      "注意:MFT(道德基础理论)和 Shweder 三领域框架证实的是道德【直觉内容】的跨文化
      差异(不同文化有不同的道德直觉),而非专门的 dumbfounding【现象】(无法给出理由+
      认知失调)的跨文化复现。dumbfounding 的直接复现目前主要集中在 WEIRD 样本中
      (Haidt 2001 及后续),非 WEIRD 群体中的 dumbfounding 专项研究尚不充分。
      因此,本命题的'跨文化普遍性'主张在 dumbfounding 维度上目前属于理论驱动假说
      (strongly motivated hypothesis)而非多源确证命题。"

      此标注不影响 IEA 内的 agree/disagree 判定(文化人类学仍可 partial-agree——
      它支持"道德直觉跨文化存在"这一命题的必要前提),但提升证据诚实的精确度。
    - |
      【注册 dumbfounding 的操作化编码手册——SHOULD】
      在 falsifiability 段或独立的 operationalization 段中预注册:
      (i) "无法给出理由"的操作化:几轮追问(建议≥3 轮渐进式追问)、追问脚本(建议
      使用 Haidt 2001 的标准化追问协议或跨文化改编版)、终判标准(被试在最后一次追问
      后仍无法给出 harm-based 理由或明确表示"我不知道为什么,但就是错的");
      (ii) "坚持判断"的操作化:被试在追问结束后被直接询问"那么你现在仍然认为这个
      行为是错的吗?"——以明确的 yes/no 回答为准;
      (iii) "认知失调"的操作化:建议使用至少两种独立指标取并集——口头困惑标记
      (如"um...""这很奇怪...""我不知道..."等犹豫/困惑表达,由独立编码者按预注册
      编码手册判定)+情绪自评量表(如 1-7 点的不适/困惑程度自评);
      (iv) "绝大多数"阈值:建议锁定为 >2/3(>66.7%)的被试,配合二项检验(单侧,
      H0: p ≤ 0.5, H1: p > 0.5)的统计方案。

