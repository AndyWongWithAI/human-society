round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（双加工 + 直觉先行）在道德心理学主流文献中有真实经验支撑，不是砖=结论。但本推论有一处真实塌陷：falsifiability (a) 与"任何文化都存在"的全称量词焊死，作者用"如吃狗肉、乱伦"作为"无明显危害"代表案例恰恰挖了自己的墙根——因为（1）作者自承"如"二字暗示这是举例而非穷尽，但全称量词要求穷尽；（2）"无明显危害"本身就是 harm-based 判定标准，等于在用被推翻的范式（harm-based rationalism）来定义"违反 harm-based 范式"，逻辑套套；（3）IEA 折扣已落地但 0.85 的初始估计偏高，实际独立性应更低。修复方向已标。可靠修订能救活，故 needs_revision。
  red_flags: |
    1. brick=conclusion — 未命中。Haidt 双加工模型有独立实验支撑（Greene fMRI, Cushman 行为实验），不是把某个承重砖的结论直接搬来当本推论结论。
    2. 逐格判空 — 部分命中。核心预测"任何文化都存在无明显危害禁忌 + dumbfounding"在经验上可被检验，不是同义反复；但"无明显危害"判定标准是 harm-based，等于用被推翻范式定义违反该范式的现象，存在概念循环（见红旗 8）。
    3. 测量轴正交（DED-007 死因）— 未命中。被预测量（dumbfounding 行为）和驱动量（双加工架构）是异源正交的两个测量层。
    4. 射程/排除钩子独立于结果（DED-005）— 命中风险。限制条款说"不排除理性化在特定条件下能够改变直觉判断"——这把"为什么这次反例没出现"开了一个事后合理化后门（"恰好特定条件不满足"）。这是射程弹性钩子，方向不对。
    5. 分类判据档位匹配 — 未命中。dumbfounding 是连续量（说不出理由的程度），本推论做了质的二分（有/无），但在 falsifiability (a) 中允许"绝大多数被试自发改变判断"这种二分操作化，档位匹配。
    6. anti-talisman 真兑现 — 部分命中。作者承认证据来源存在学术谱系重叠并应用了 instrument_correlation discount，但 0.85 的 IEA 估计偏高，未扣除：① Shweder-Haidt 师承链；② MFT 直接建立在三领域框架上；③ 跨文化验证研究大量使用 MFT 量表（问卷工具同源）；④ 单一 LLM 执行判断。扣除后 IEA 应降至 0.5-0.6 区间。
    7. 现实锚事实核查 — 未命中。Haidt 2001 乱伦实验、Greene fMRI、Cushman 2006 行为实验事实正确。但"非 WEIRD 群体也重复 dumbfounding"的引用过于宽泛——Atran & Norenzayan 2004 主要研究宗教承诺而非 dumbfounding 本身；真正跨文化 dumbfounding 重复研究（如 McNamara 等）样本量和方法细节未在引文中给出。
    8. 条件是下定义还是做预测 — 命中。falsifiability (a) 中"无明显危害"这一条件本身就是 harm-based 判定，而本推论要挑战的恰恰是"道德=harm"的还原论。用被挑战范式的术语来定义"违反该范式的案例"，这是下定义而非做预测。需要作者明确"无明显危害"由谁、按什么标准判定（且这一标准必须独立于 harm-based 框架）。
    9. 枚举穷尽 — 部分命中。"如吃狗肉、乱伦"明显是举例非穷尽，但全称量词"任何文化都存在一些"要求穷尽（或至少给出穷尽判据）。作者未给出"什么样的行为算此类禁忌"的独立判据。
    10. primary_suspect 指对 — 未命中。作者自认最弱腿是 IEA 同源问题（已部分修复），但更致命的软肋是红旗 8 的概念循环——这是作者未识别的。
    11. 口径完整注册 — 命中风险。falsifiability (c) 中"N=100, X=80%"是举例性的"例如"，未做预注册；"独立评委判定为充分"的口径未定义——什么算 harm-based 理由"充分"？这正是 dumbfounding 文献四十年来未解决的判定问题。
    12. 数据源同根冒充多源独立 — 命中。道德心理学和文化人类学两来源的学术谱系已承认为同根（Shweder-Haidt 师承链），IEA 折扣部分落地；但 0.85 的初始估计过高，实际独立性应更低。
    13. API 可及性冒充认识论独立性 — 未命中。本推论不涉及 API 数据调用问题。
    14. 反向失败模式缺失 — 未命中。本推论是认知架构主张，反向失败模式（"理性先行、直觉追认"的文化）已被 falsifiability (b) 部分覆盖。
    15. Bootstrap 限定缺失 — 未命中。本推论不涉及技术介导的社会形态，冷启动/稳态区分不适用。
    16. 验证对象存在性未标注 — 未命中。dumbfounding 现象在经验研究中可观测，不存在空集问题。
  counterexample_hunt: |
    构造三类猎捕：

    猎捕 1：跨文化 dumbfounding 的实际边界——Haidt 本人（2001, 2012）多次承认 dumbfounding 在某些文化（如美国自由派）中可能更弱，且"说出理由"的能力受语言表达能力和反思训练强烈影响。印度教社群对"神性领域"禁忌（如跨种姓饮食）能提供 harm-based 理由吗？跨文化研究显示印度被试对种姓食物禁忌给出的是"污染"叙事而非 harm 叙事，但"污染"是否算 harm-based 理由取决于 harm 的定义。这是把"无明显危害"判定的争议推给读者，未解决。

    结果：揭出过度伸张——本推论声称"无法提供 harm-based 充分理由"作为 dumbfounding 的诊断标准，但 harm 的定义本身受文化塑造（美国 harm = 物理伤害，印度 harm 可包含精神污染），用单一 harm 标准判定"无理由"等于文化偏见。

    猎捕 2：理性改变直觉的反例——Greene 等道德心理学研究反复显示，对功利主义难题（如电车难题的脚手架版本）的判断可通过引导被试做认知反思而被改变。Haidt 本人承认这一现象。这正好落入限制条款"不排除理性化在特定条件下能够改变直觉判断"，所以本推论不会被这些反例证伪——但这同时意味着本推论的核心承诺（"直觉先行、理性追认"的加工顺序是跨文化不变架构）被掏空成不可证伪的架构声明。

    结果：揭出过度伸张——核心承诺太抽象，无法被经验证据真正威胁。falsifiability (b) 要求"直觉系统与理性化系统的加工顺序存在可复现的跨文化反转"，但神经成像的时间分辨率和实验范式争议使得这种"反转"在操作上极难确认。这是 falsifiability 的可操作性弱点而非完全不成立。

    猎捕 3：是否存在真正"无危害"的文化禁忌？——所有人类文化禁忌的"无危害"都是相对特定文化框架而言的。从外部观察者视角看，所有禁忌都有某种文化内可辩护的功能（避免疾病、维护神圣、维持等级）。这意味着"无明显危害"作为 dumbfounding 的前提条件本身就是文化相对判断。如果本推论承认这一点（"无明显危害"由文化内成员判定），则"任何文化都存在"的预测变成同义反复（"任何文化都存在它认为无危害的禁忌"——总能找到，因为禁忌定义的弹性）。

    结果：被消化/揭出过度伸张——红旗 8 的概念循环在猎捕 1 和 3 中都被独立确认，这是本推论最致命的弱点。

    综合：未猎到净杀反例（核心双加工机制有真实经验支撑），但猎到两处过度伸张（harm 标准循环 + 核心承诺不可操作证伪）。
  required_fixes:
    - "1) 在 falsifiability (a) 中明确\"无明显危害\"由谁、按什么独立于 harm-based 框架的判据来裁定（例如\"被独立跨文化评委一致判定无生理伤害、无第三方可识别损害、无违反该文化主流福祉概念\"，且这一判据注册时不能预知被试的 dumbfounding 结果），或承认\"无明显危害\"本身就是文化内判定从而把全称预测改为\"任何文化都能找到至少一类禁忌使其成员倾向于 dumbfounding\"（这更可操作但更弱）。"
    - "2) 限制条款收紧射程：把\"不排除理性化在特定条件下能够改变直觉判断\"改为\"理性化能改变直觉判断的具体条件集合需被指定\"，否则 falsifiability (b) 失去牙齿——任何\"反转\"案例都可用\"特定条件不满足\"开脱。"
    - "3) IEA 折扣落地：把 0.85 降至 0.5-0.6 区间，明确列出扣除项（Shweder-Haidt 师承链 + MFT 量表同源 + 跨文化验证研究多使用 MFT 框架 + 单一 LLM 判断），并标注哪些是独立测量链、哪些是同源回声。"
    - "4) falsifiability (c) 预注册 N 和 X（不能再用\"例如 N=100, X=80%\"的举例语气），并明确\"独立评委判定为充分 harm-based 理由\"的操作化口径（包括：评委人数、评委独立性保证、\"充分\"的最小理由结构、评分者间信度阈值）。"
    - "5) 引用补强：把\"非 WEIRD 群体重复 dumbfounding\"的具体研究从泛指（Atran & Norenzayan 2004 等）改为实证文献条目（Brosch et al. 2013 跨文化道德情绪研究、或具体跨文化 dumbfounding 复制研究），或承认现有跨文化复制证据弱于表述。"
  oneline: |
    核心机制有真实经验支撑但"无明显危害"的判定概念循环未解、IEA 折扣不足、falsifiability 可操作性弱点未补——三处 required 缺陷定向修复可救活。

round_3:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 3, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制(双加工:直觉先行、理性追认)在 moral psychology 内部是稳健的主流范式,Haidt-Greene-Cushman 三条独立测量链(fMRI 竞争激活、行为分离、跨文化问卷)支撑了直觉先行的方向。falsifiability (a) 在 r2 修补后有了"预注册式独立跨文化评委+无明显危害裁定标准",不再是条件自封。限制条款已收紧到"加工顺序是跨文化不变的认知架构特征",不再是"所有道德判断都由直觉主导"。

    但仍差一口气,卡在两条 required 上,均与"跨文化普遍性"这一**核心声称**有关,而非机制本身:

    **R1(红旗9+11复合):species 枚举与判据档位错配。** 推论声称"在任何文化中都存在禁忌但无明显危害的行为",这是"N 类可枚举"式断言。但判据"该文化视为禁忌且独立评委裁定无明显危害"含一个判据档位问题——"禁忌性"和"无危害性"是两条独立维度,二者的交集在经验世界中有大量灰色地带。文件没有注册"如果某文化的行为在本地框架内就是有危害的(只是 WEIRD 评委看不出),裁定谁说了算"。这正是 DED-006 类问题的变体——分类判据与被救对象的档位不匹配。

    **R2(红旗14 反向失败模式缺失):** 反向模式是——"也许某些文化根本不会出现 dumbfounding,因为该文化的成员对所有禁忌都能给出饱满的理由(因为他们的道德语言里 harm 概念比 WEIRD 框架宽得多)"。这不证伪双加工,但证伪"哑口无言的跨文化普遍性"。文件没有注册这条反向失败模式,也没有解释为什么 WEIRD 框架的 harm 概念应该被强加为"理由充分"的标尺。

    **反例猎捕结果:** 猎到一条半活反例(见下),属于"揭出过度伸张"——不是机制被净杀,而是"跨文化普遍性"这一外推超出当前证据。

    **DED-004/007 复发:** 未复发。(a) 用了独立评委口径,(c) 预注册了 N 和评委标准。没有隐藏焊点。
  red_flags: |
    1. brick=conclusion — 未命中。推论核心("直觉先行、理性追认")确实在 Greene 双加工 fMRI 和 Cushman 行为分离里有独立支撑,不是从某个承重砖原文搬来的。
    2. 逐格判空 — 部分命中。r2 后 (a) 有了独立评委口径,不再是同义反复。但 (c) 的"理由充分"判据把"理由"狭隘化为"harm-based 理由",这是一个见下条的攻击面。
    3. 测量轴正交 — 未命中。自变量(文化中禁忌且无危害的行为)和被预测量(dumbfounding 率)异源,评委与被试独立。
    4. 射程/排除钩子 — 部分命中。(a) 的"无明显危害"由独立跨文化评委裁定,且预注册了"不能预知 dumbfounding 结果",这是好的。但"该文化主流福祉概念"这条为评委留了过大裁量空间——若评委用本地福祉概念,则几乎一切禁忌都可被裁定为"有危害"(因为该文化认为它危害了精神秩序/神圣性),推论变成不可证伪。需要更紧的口径。
    5. 分类判据档位匹配 — 命中(R1)。"禁忌+无危害"两维交叉,但"禁忌"本身按被试自报,"无危害"按评委外评。档位错配:被试说禁忌时,其理由可能恰恰包含"我文化认为这有危害",此时"无危害"裁定把该理由取消了,等于用评委框架替换了被试框架。判据需要补一条:"即使在被试所在文化的内部框架内,该行为也不被认为造成可指认的危害"。
    6. anti-talisman 真兑现 — 未命中。前件"经独立跨文化评委裁定为无明显危害"不依赖 dumbfounding 结果,真兑现。
    7. 现实锚事实核查 — 未致命。Haidt 2001 乱伦案例、Grey Matter/纽约地铁两个经典 dumbfounding 场景是真实的;fMRI 竞争激活结果真实。但 file 自认"跨文化复制证据弱",且 IEA 已降至 0.55,文件诚实。
    8. 条件是下定义还是做预测 — 命中(轻度)。(a) 的"无明显危害"在裁定上有定义性危险(见 R1 和 #5)。需要把"无危害"操作化为"行为本体不造成可观测的生理/物理伤害、不消耗稀缺资源、不破坏可识别第三方权利",剥离"违反神圣秩序也算危害"这种文化内定义。
    9. 枚举穷尽 + species 按判据定义 — 命中(R2,这是主要攻击面)。推论隐含声称"任何文化都至少存在若干禁忌但无危害的行为",但没有给"无危害"的判据留出文化中立操作化。可能的第 N+1 类:**某些文化根本不给"harm-based 理由"和"其他理由"分界线留位置**(如把违反宗教洁净直接视为 harm,不是分类缺失而是范畴融合)。推论需要注册这条失败模式。
    10. primary_suspect 指对 + 平凡化检查 — 文件自认"跨文化复制证据弱",准了。但还有一个未认的软肋:Haidt 自己的"社会直觉模型"在 2010s 后期受到了来自 Prinz (道德判断的生态理性观) 和 Gazzaniga (左脑解释器) 的方法论挑战——后者认为 dumbfounding 不是"理性系统跟不上直觉",而是"理性系统从不在场,左脑只是事后编故事"。这条若成立,dumbfounding 现象仍存在,但机理解释(直觉先行、理性追认)被改写为"根本没理性系统参与"。文件没碰这条。
    11. 口径完整注册 — 命中(见 #5+#8)。"无明显危害"和"主流福祉概念"未注册分子分母和边界仲裁规则,容易事后选择。
    12. 数据源同根 — 未命中。IEA 已降至 0.55,扣除了 Shweder-Haidt 师承链等。文件诚实标注。
    13. API 可及性 — 未命中(不适用,无 API 数据)。
    14. 反向失败模式缺失 — 命中(R2,主要攻击面)。反向模式:"某些文化的成员对禁忌都能给出饱满理由(因为他们的道德语言里 harm 范畴更宽)"。这条一旦成立,证伪的是"哑口无言普遍性"而非双加工,但二者绞在一起被推论当一回事。文件未注册。
    15. Bootstrap 限定 — 未命中(不适用,这是稳定认知架构,不涉及冷启动/稳态区分)。
    16. 验证对象存在性 — 命中(轻度)。当前几乎不存在大规模跨文化 dumbfounding 复制的实证研究。文件自承"跨文化复制证据弱",但没有诚实标注"该命题的实证置信度上限由跨文化复制文献的空缺决定"。建议加一句。

    附加(红旗 L4 不适用,跳过)
  counterexample_hunt: |
    构造三个反例候选:

    **CE1(WEIRD 框架外的 harm 范畴融合):** 在印度教正统文化中,吃牛肉是禁忌。被试可能给出"这违反 dharma/神牛神圣性"作为 harm-based 理由——但 WEIRD 评委看这不算 harm(无生理伤害、无第三方权利损害)。问题是:若把"违反 dharma"也算 harm,大多数印度教被试都能给出"充分理由";若不算,则禁忌被裁定为"无危害",但被试的"理由"被评委一刀切掉。**结果:揭出过度伸张**。推论在两类裁定下都失败——裁定太宽则哑口无言消失,裁定太窄则失去跨文化评委的"无危害"判据。这不是机制被证伪,而是"哑口无言普遍性"这一核心外推在 harm 范畴跨文化不可比时站不住。

    **CE2(经典 dumbfounding 在不同文化中的功能性变体):** Haidt 自己报告过,他在巴西和菲律宾做过非正式访谈,某些案例里被试不会 dumbfound——他们会直接说"我们不这样做,这就够了",拒绝提供任何理由,也没认知失调。**结果:被消化(部分)。** 这是 dumbfounding 的文化调节变量而非证伪,但作者没把"被试拒绝回答并保持平静"作为 falsifiability 的独立路径注册。

    **CE3(神经层面的反向证据):** Koenigs et al. (2007) 发现 vmPFC 损伤病人(情绪削弱)的功利主义判断反而增多——支持情绪参与道德判断。但有研究(如 Borg et al. 2006 的催眠抑制厌恶实验)显示,被暂时抑制厌恶情绪的受试在道德判断上变化较小,挑战"情绪是道德判断的必要驱动"。**结果:攻不穿。** 主流证据仍支持情绪/直觉参与,但参与≠主导,主导关系在跨文化样本中未被严格复制。

    **猎捕结论:** 净杀 0 条,被消化 1 条(CE2,文化调节变量),揭出过度伸张 1 条(CE1)。挡 verified 的不是机制错,是"跨文化普遍性"在 harm 范畴跨文化不可比时缺乏操作化锚。
  required_fixes:
    - "1. 在 falsifiability (a) 中将\"无明显危害\"从\"独立跨文化评委裁定\"改为双盲分层裁定:第一层剥离文化内定义(违反神圣秩序/洁净/风水等不算 harm),只看行为本体是否造成可观测生理伤害、稀缺资源消耗、可识别第三方权利损害;第二层才允许评委考虑\"该文化主流福祉概念\"。同时明确若两层裁定冲突,以第一层(行为本体)为准。"
    - "2. 注册反向失败模式:\"若某文化的成员对其文化禁忌行为均能给出在文化内框架中被该文化成员自发判定为充分的理由,且不表现出认知失调,则本命题被证伪。\"——独立于 (a) 的 harm-based 路径,因为该文化的 harm 范畴可能比 WEIRD 框架更宽。"
    - "3. 把 CE2 类型的\"拒绝回答并保持平静\"作为第三条 falsifiability 路径(d),预注册操作化(如:被试在 30 秒内未说出任何理由且自报无认知失调情绪,则计为\"非 dumbfounding 响应\")。"
    - "4. 在 applicable_sources 或 review_summary 中诚实标注:\"该命题的实证置信度上限由跨文化 dumbfounding 复制文献的当前空缺决定;在跨文化大规模复制出现前,'普遍性'应理解为理论预期而非已证事实。\""
  oneline: |
    双加工机制本身站稳,但"哑口无言跨文化普遍性"在 harm 范畴跨文化不可比时缺乏操作化锚,需要收紧"无危害"判据、注册反向失败模式、并把"拒绝回答"纳入证伪路径——不是机制错,是外推太宽。

round_4:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 4, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: verified
  verdict_note: |
    经过三轮修补后，命题的 falsifiability 架构完整：(a) 双盲分层 harm 裁定+独立跨文化评委、(b) fMRI 加工顺序、(c) harm-based 理由定量阈值与 kappa 信度、(d) 反向失败模式（文化内 harm 扩张路径，独立于 WEIRD 框架）、(e) 静默响应路径。五条证伪路径各自独立预注册口径，互不焊死。IEA 已被诚实降至 0.55 并显式列出 Shweder-Haidt 师承链、MFT 继承、双 LLM 三项同源回声扣除。跨文化复制文献空缺已被 r3 诚实标注为置信度上限限制，"普遍性"明确定义为理论预期而非已证事实。16 条红旗逐条检查无 required 命中。反例猎捕三靶（印度教吃牛给出经济理由、日本出轨禁忌弱化、跨文化 harm 概念不可通约性）均被 (d) 反向失败模式路径和 r3 诚实标注所消化。未重蹈 DED-004 循环（无自指证伪）或 DED-007 焊死（自变量与因变量异源）。
  red_flags: |
    1. brick=conclusion — 未命中。双加工模型是 Haidt 独立理论，非为本命题窄化发明。
    2. 逐格判空 — 未命中。"无明显危害"的裁定标准在 (a) 中双盲分层注册，非同义反复。
    3. 测量轴正交（DED-007）— 未命中。自变量（文化禁忌×无明显危害裁定）与因变量（dumbfounding 行为）异源。
    4. 射程/排除钩子独立于结果 — 未命中。(a) harm 裁定标准预注册锁定，不依赖被试结果。
    5. 分类判据档位匹配 — 未命中。(c) 用预注册 N 和 X 连续量，非硬切。
    6. anti-talisman 真兑现 — 未命中。(a) 要求评委不知道实验假设和被试 dumbfounding 结果。
    7. 现实锚事实核查 — 未命中。Haidt/Greene/Cushman 实验和 Shweder-Haidt 师承关系均确凿。
    8. 条件是下定义还是做预测 — 未命中。"禁忌但无明显危害"是可观测行为，非定义。
    9. 枚举穷尽 — 未命中。命题不做 N 类枚举声称。
    10. primary_suspect — 未命中。作者承认的最弱腿（跨文化复制证据弱）已被诚实标注。
    11. 口径完整注册 + 歧义反向裁决 — 未命中。(a)(c)(d)(e) 均有预注册口径和 kappa 阈值。
    12. 数据源同根冒充多源 — 已处理。IEA 降至 0.55 并列出三项同源扣除。
    13. API 可及性冒充认识论独立性 — 未命中。不涉及 API。
    14. 反向失败模式缺失 — 未命中。(d) 专为文化内 harm 扩张注册。
    15. Bootstrap 限定缺失 — 未命中。不涉及技术冷启动。
    16. 验证对象存在性未标注 — 未命中。实验在技术上可执行（Brosch 2013 类扩展），跨文化复制空缺已被 r3 标注。
  counterexample_hunt: |
    构造三靶：(1) 印度教城市精英对吃牛肉能给出经济 harm 理由不 dumbfounding → 被 (d) 路径消化（"均能给出"标准未满足：乡村信徒仍 dumbfounding）；(2) 日本年轻一代对出轨禁忌弱化 → 不证伪（命题是"存在一些禁忌行为"的存在性主张，非全称）；(3) 跨文化 harm 概念不可通约性（"狗权利"WEIRD 偏见）→ 被 (a) 第一层裁定和 r3 诚实标注（"理论预期而非已证事实"）所处理。猎捕结果：被消化/揭出过度伸张（已注册）。
  required_fixes: []
  oneline: |
    三轮修补后 falsifiability 架构完整、五条独立证伪路径预注册、IEA 诚实扣除、跨文化空缺诚实标注；反例猎捕三靶均被现有路径消化，达到 verified 门槛。
