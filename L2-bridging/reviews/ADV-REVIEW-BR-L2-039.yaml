id: ADV-REVIEW-BR-L2-039
type: adversarial_review
reviews: BR-L2-039
layer: L2-bridging
target: BR-L2-039
target_term: 锦标赛激励下的努力分布不均 (Tournament Incentives → Uneven Effort Distribution)
rounds: 1

人话摘要: |
  对 BR-L2-039(锦标赛激励下的努力分布不均)的 round-1 独立对抗审查。
  裁 needs_revision:核心直觉(锦标赛结构扭曲努力分布)方向正确且扎根于成熟理论(Lazear-Rosen
  1981),但 4 条 required 缺陷阻止 verified:(1)缺少 cross_verification/IEA 调查——
  桥接砖无多源独立验证数据,candidate 状态尚不满足 verified 的 IEA≥1.2 最低门槛;
  (2)bridges_to 仅引 3 条 L1 概念、零公理/定理,与体系中其他 L2 桥接砖的结构深度不匹配;
  (3)"中段放弃+底部搭便车"的通用声称忽略锦标赛设计异质性(多奖项/淘汰制/信息公开)的
  调节效应,且在对抗性运动联赛(保级激励→底部不搭便车)中遇到直接反例;
  (4)falsifiability (b)存在地板效应护身符风险——低能力者若已在零努力地板,扩大奖金差距
  无法被观测。
  反例猎捕发现运动联赛保级战(底部死战非搭便车)+学术终身教职锦标赛(中部最拼非放弃)
  两类挑战,虽不净杀(可通过 scope 限定化解),但揭示当前"通用声称"的过度伸张。

round_1:
  reviewer: independent-adversarial-reviewer
  date: 2026-07-16
  verdict: needs_revision
  verdict_note: |
    本命题的核心直觉——锦标赛式激励结构(按相对排名而非绝对产出给报酬)会导致努力
    分布偏离均匀、呈现系统性不均——方向正确,扎根于成熟的锦标赛理论(Lazear & Rosen
    1981 "Rank-Order Tournaments as Optimum Labor Contracts")和寻租竞赛文献
    (Tullock 1980)。Bandiera et al. (2011)的田野实验直接比较了相对锦标赛与固定工资
    下工人的努力分布,为"锦标赛→努力分化"提供了干净的因果证据。这条桥接砖试图将
    经济学中已被反复验证的锦标赛效应提升为"人类社会公理化体系"中的一条经验命题——
    方向正确,但执行存在四项结构性缺陷。

    四条 required 级缺陷阻止 verified 裁决:

    1.【缺少 cross_verification/IEA——REQUIRED】
    BR-L2-039 的文件中完全没有 cross_verification 段落——没有多源投票、没有 IEA
    计算、没有独立性系数查表。candidate 状态的桥接砖在进入 verified 之前必须通过
    IEA 调查(≥1.2 为下限,≥1.8 为 verified 门槛)。当前文件的 applicable_sources
    仅列出两个来源(organizational_economics 与 game_theory),且二者共享理性选择/
    均衡分析核心框架,独立系数可能低至 0.3-0.4。若按 independence-model 计权,
    IEA ≈ 1.0 + 0.4 = 1.4(以 game_theory 为锚,org_econ 的独立系数≤0.4 折扣),
    刚过 weakly_verified 门槛 1.2 但远低于 verified 门槛 1.8。更关键的是——IEA
    根本未被计算、未被记录。这是结构性的缺失,不能靠审查者事后估算来弥补。

    2.【bridges_to 仅引概念,无公理/定理锚定——REQUIRED】
    本桥接砖的 bridges_to 仅列出 3 条 CONCEPT(CONCEPT-competition, CONCEPT-agent,
    CONCEPT-goal),全部是 L1 定义层的概念——相当于只说了"竞争存在""行动者有目标"。
    这与体系中其他 L2 桥接砖的结构深度形成鲜明对比:
    - BR-L2-001(有限理性):概念 + AXIOM-002(信息熵增)
    - BR-L2-006(内群体偏好):AXIOM-001(稀缺-竞争) + THEOREM-group-identity-decay
    - BR-L2-013(不公平厌恶):AXIOM-001 + THEOREM-competition-norm + THEOREM-cooperation-precondition
    本桥接砖的核心机制("努力分布不均")显然与 AXIOM-001(稀缺→竞争)和 THEOREM-competition-norm
    (竞争规范化定理)有直接的推导关系——竞争者面对稀缺奖励、按相对排名竞争,这正是
    AXIOM-001 和 THEOREM-competition-norm 的典型场景。但这些连接未被显式标注,
    使桥接砖在体系中的推导链不完整,读者无法追踪"从哪条 L1 定理出发得到这个经验预测"。

    3.【"中段放弃+底部搭便车"通用声称忽略锦标赛设计异质性——REQUIRED】
    statement 声称"中等能力者提前放弃(Quit),底部竞争者搭便车"。这一声称将锦标赛
    下的努力分布描述为一种近乎通用的形态特征,但忽略了锦标赛设计的三个关键调节维度:
    (a) 奖项结构:单一大奖(winner-take-all) vs 多级奖项(top 10%/25%/50%各有奖);
    (b) 信息结构:能力信息公开 vs 未知(对称不确定性);
    (c) 淘汰/惩罚:底部是否有降级/淘汰惩罚 vs 纯奖励型。
    当存在多级奖项时,中等能力者接近下一级奖项的阈值,有强烈激励继续努力——这正是
    Lazear-Rosen 模型中当奖项梯度设置得当时的效果。当底部有降级惩罚(如运动联赛
    保级战),底部竞争者不仅不搭便车,反而可能付出超量努力以求生存。通用声称的
    "中段放弃+底部搭便车"只有在一阶近似(单一大奖+无底部惩罚+能力已知且异质)下
    成立——这个 scope 限制应在 statement 或 domain 中显式声明。

    4.【falsifiability (b)地板效应护身符——REQUIRED】
    falsifiability (b)要求:"加大排名奖励差距后,低能力参与者的努力水平反而上升或
    维持不变"作为证伪条件。但此测试隐含假设:低能力参与者的基线努力水平 > 0(非地板)。
    若低能力者已在均衡中选择零努力(Hillman & Riley 1989 的全支付拍卖均衡分析
    证明了当能力差距足够大时,低能力者零努力是纳什均衡),则扩大奖金差距后观测到的
    "努力不变(仍为零)"不构成证伪——因为努力已经在地板上,无法再下降。这使
    falsifiability (b) 在低能力者处于零努力地板的情境中失去证伪力——它变成一个
    无法被触发的测试。按 anti-talisman 红旗标准:证伪条件必须是可事前测量的正向
    测试,不应有无法被触发的隐藏豁免区。修复:在 falsifiability (b) 中追加前置条件
    ——"低能力参与者的基线努力水平显著大于零",或将其替换为使用中等能力参与者的
    测试(中等能力者不太可能处于地板)。

    四条 required 均可通过定向修订修复:(1)补充 IEA 调查;(2)补充 bridges_to 的
    公理/定理连接;(3)增加锦标赛设计异质性的 scope 声明;(4)修复 falsifiability (b)
    的地板效应。这些修复不推翻核心直觉——锦标赛结构确实扭曲努力分布——但将一条
    过度通用的命题收紧为诚实、可检验的形式。

    附 3 条 should:匹配"能力"的操作化定义(如何在不借助努力/产出反推的情况下
    独立测量能力);标注"底部搭便车"与"理性放弃"的概念区分;扩充 domain 声明以
    涵盖运动经济学与教育经济学中的锦标赛证据。

  red_flags:
    brick_is_conclusion:
      hit: false
      detail: |
        本命题声称"锦标赛激励结构导致努力分布极度右偏——少数顶尖超量努力、大量
        中段提前放弃、底部搭便车"。这一核心主张不在任何 L1 公理/定理中。

        AXIOM-001(稀缺性-竞争公理)说"多个人都要同一份不够分的资源,竞争就必然
        存在"——它断言竞争的存在性,但不规定竞争者的努力分布形态。THEOREM-competition-norm
        (竞争规范化定理)说"反复碰面的竞争者会自发形成比赛规矩"——它断言规范涌现,
        但不规定规范约束下的努力函数形状。CONCEPT-competition 定义竞争为"两个以上
        主体争同一份不够分的资源",不涉及努力分布。CONCEPT-agent 定义行动者的
        目标导向性,不涉及在特定激励结构下的行为模式。

        本桥接砖将标准锦标赛理论(Lazear-Rosen)的均衡预测——异质能力下努力分布
        非均匀——从经济学文献中提取并重新表述为可嵌入公理化体系的经验命题。
        这个翻译本身是非平凡的:公理化体系关心"为什么人类社会必然出现这种现象",
        而经济学文献关心"给定这些假设,均衡是什么"。桥接砖的角色恰是将后者的
        实证发现嫁接到前者的推导链上——这是体系分工,不是 brick=conclusion。

        边界警惕:若将"按排名给奖→努力分化"弱化为"竞争激励→努力不均",则命题
        退化为"稀缺资源竞争下大家不会一样努力"——后者几乎可以从 AXIOM-001 +
        CONCEPT-agent(不同人有不同能力)直接推出,趋近于平凡。抵抗此退化的防线是
        (1)具体的分布形态声称(右偏、死亡谷),(2)可检验的因果方向(奖项差距↑→右偏↑),
        (3)与替代激励结构的对比(锦标赛 vs 固定工资/计件工资)。防线仍在,但需
        警惕泛化后失去经验锐度。

    empty_cell_tautology:
      hit: false
      detail: |
        核心空格预测:若世界不是"锦标赛→右偏努力分布",则:
        (1)中等能力者的努力水平不低于高能力者(甚至更高);
        (2)加大奖金差距后努力分布不变或趋于均匀;
        (3)实验室锦标赛中努力分布呈均匀或正态。
        这些都是可观察的反事实,非同义反复。特别是(1)——"中段努力不低于顶部"在
        很多现实组织中确实被观察到(如学术终身教职锦标赛中,助理教授的努力水平
        常超过正教授),所以这个空格不是逻辑不可能,而是经验上(在特定条件下)可能
        被证实的替代假说。逐格判空通过。

    measurement_axis_orthogonality:
      hit: true
      detail: |
        本红旗命中——不是 DED-007 式的闭环焊接(分母用实际结果定义),而是"能力"
        这一关键调节变量的测量独立性问题。

        statement 的核心因果链是:能力 × 锦标赛激励 → 努力决策 → 努力分布。其中
        "能力"是决定努力决策的关键前件——高能力者努力有利可图故超量投入,中能力者
        追赶成本>预期收益故放弃,低能力者无望故搭便车。但"能力"的操作化定义和
        独立测量在本桥接砖中完全未交代。

        问题在于:在许多经验研究中(包括本桥接砖引用的 Bandiera et al. 2011),
        "能力"是通过【过去的产出/排名】来推断的——即通过被观测量(产出)反推前件
        (能力)。这构成一个软性焊点:如果某人的产出低,被归为"低能力",然后砖预测
        低能力者努力低——但产出低在多大程度上是"能力低"vs"努力低"是一个识别
        问题,砖的因果链在此处存在同义反复的风险("因为他产出低所以他是低能力,
        因为他是低能力所以他努力低所以产出低")。

        这不是 DED-007 级的死焊(因为能力可原则上有独立测量——如 IQ 测试、技能
        评估、过往独立于本锦标赛的绩效记录),但当前文件未注册能力的独立测量路径,
        也未声明"本命题假设能力可在事前被独立测量(且被参与者知晓)"这一关键
        scope 条件。在反例猎捕中,此缺口会使任何"中段比顶部更努力"的案例被辩解
        为"那些中段其实才是高能力者"。

        裁定为 required 级缺陷——需要显式注册"(a)能力的独立测量路径,(b)能力
        信息在参与者中是否对称/公开的假设"。这不是结构死罪,可靠定向修复解决。

    scope_exclusion_independent:
      hit: true
      detail: |
        本红旗命中——shift 而非 hit 在排除逻辑上,而是 hit 在排除的范围过于窄。

        当前文件仅有 statement 末尾一句限制:"本命题仅描述努力分布形态,不声明
        总体平均努力水平的变化方向"。这是一个非常弱的 scope 限制——它只排除了
        "平均努力"的推断,但没有排除以下关键异质性来源:
        (a) 锦标赛设计:单奖 vs 多奖,线性 vs 凸性奖金梯度,淘汰制 vs 积分制;
        (b) 能力信息:能力公开 vs 未知(对称不确定性);
        (c) 惩罚结构:底部有降级/淘汰 vs 纯奖励;
        (d) 重复博弈:单次 vs 重复锦标赛(声誉/职业顾虑)。

        这些维度中的每一个都会系统性地改变努力分布形态。例如,多级奖项的锦标赛
        (如 salesforce 中 top 10%/25%/50% 各有奖金)会在每个奖项阈值附近产生
        努力集中——中段不仅不放弃,反而在阈值附近超量努力。这不是"反例"——
        这是同一机制(排名激励)在不同设计参数下的不同表现。但砖当前的通用声称
        ("中段提前放弃、底部搭便车")未声明这些 scope 条件,使其面临被设计参数
        不同的锦标赛轻易挑战的风险。

        排除项未在见反例前注册这些 scope 条件——这违反了"排除钩子独立于结果"
        的原则(这些 scope 条件恰在反例出现后最容易被追加为"我们本来就假设了
        单一大奖锦标赛")。裁定为 required 级缺陷:需在 statement 或 domain 中
        预注册scope 条件(至少覆盖奖项结构和底部惩罚两个最关键的调节维度)。

    classification_granularity:
      hit: true
      detail: |
        本红旗命中——不是致命级,但揭示了一个概念粗糙度问题。

        本桥接砖将努力分布的主体分为三类:"顶尖/高能力者""中等能力者""底部/低能力者"。
        这是三分法,但底层的"能力"是连续变量。更关键的是,三分法的边界判据未注册:
        什么算"中等能力"?在正态分布的能力假设下,是 25-75 百分位还是 40-60 百分位?
        "死亡谷"的宽度有多大?

        在 Lazear-Rosen 原模型中,均衡努力是能力的连续函数——不存在 rigid 的
        三类划分,而是存在一个"努力-能力"函数形状(典型的倒 U 型,峰值在能力分布
        的中上段)。砖的"中段放弃"是将连续函数的一个区段(努力较低的能力区段)
        做了离散化表述。这种离散化的代价是:(1)失去了对"放弃"边界移动的预测
        (奖金差距变化时,哪个百分位的人开始放弃?),(2)使不同锦标赛设计(不同
        参数)下的不同努力-能力函数形状都被迫挤进同一个三分类框架。

        裁定为 should 级而非 required——三分法作为人话摘要层面的简化是可接受的,
        但 statement 应诚实地将底层逻辑(努力是能力的连续函数,存在一个低努力的
        能力区段)与三层分类的关系说清楚,避免读者误认为"能力天然分为三类"。

    anti_talisman:
      hit: true
      detail: |
        本红旗命中——falsifiability (b)存在地板效应护身符风险。

        falsifiability (b)规定:若"加大排名奖励差距后,低能力参与者的努力水平反而
        上升或维持不变"则命题被证伪。此测试有两个结构性漏洞:

        (1)【地板效应】若低能力者基线努力水平 = 0(已在均衡中选择不参与/零努力,
        Hillman & Riley 1989 的全支付拍卖均衡证明当能力差距足够大时这是纳什均衡),
        则"加大奖金差距后努力不变(仍为零)"不能证伪命题——因为努力已在地板上,
        无法再向下。砖可辩称"不变是因为已在地板"而非"命题预测正确"。这使
        falsifiability (b) 在大量现实锦标赛中成为无法触发的测试——只要低能力者
        已理性弃赛,扩大奖金差距的测试就无信息量。

        (2)【基线依赖性】测试的预期结果是"努力上升或维持不变"为证伪信号。但"努力
        上升"本身可能有两种解释:(i)命题错误——低能力者并非永远搭便车,在激励
        足够大时也会投入;(ii)命题正确但参数域不同——奖金差距大到足以覆盖低能力者
        的参与门槛时,低能力者从"搭便车"切换为"参与竞争"(这是锦标赛理论的自然
        预测,非反例)。若砖在见到"努力上升"时选择解释(ii),则 falsifiability (b)
        再次失去证伪力。

        lab falsifiability (c)是三条证伪路径中最刚硬的一条——外生设定能力差异+
        受控实验环境+可观测的努力分布形态,是干净的证伪测试。但(a)和(b)作为现实
        世界的证伪路径,都存在操作化层面的护身符风险。

        裁定为 required 级缺陷(falsifiability (b)的地板效应)和 should 级关切
        (falsifiability (b)的双可解释性)。修复方向见 required_fixes #4。

    reality_anchor_fact_check:
      hit: false
      detail: |
        独立复核本桥接砖引用的文献:

        (1) Lazear & Rosen (1981, JPE) "Rank-Order Tournaments as Optimum Labor
        Contracts"——发表属实。该文的核心贡献是证明在对称能力下,锦标赛与计件工资
        在风险中性条件下等价;在风险规避下锦标赛可更优。该文不直接声称努力分布
        右偏或"中段死亡谷"——它证明的是均衡努力水平,非分布形态。引用准确但需
        标注:原文的"锦标赛→努力分化"主要存在于异质能力扩展中,而非基准模型。

        (2) Prendergast (1999, JEL) "The Provision of Incentives in Firms"——
        发表属实。该综述总结了锦标赛导致努力分化的证据,但核心结论是"锦标赛对努力
        的影响取决于能力异质性程度和奖金梯度"——并非无条件支持"中段放弃+底部
        搭便车"。引用方向正确但砖的表述比综述结论更强。

        (3) Bandiera et al. (2011, JEL) "Field Experiments with Firms"——
        发表属实。该文确实比较了相对锦标赛与固定工资下的努力分布,发现锦标赛下
        低能力工人努力显著下降——这直接支持本命题的核心方向。但需注意:该田野
        实验的锦标赛设计为【单一大奖+每日排名公开】,砖的通用声称在此特定设计下
        成立,但不必然推广至其他锦标赛设计。

        (4) Tullock (1980) "Efficient Rent Seeking"——发表属实。寻租竞赛模型
        展示了高能力者投入更多、低能力者投入递减——支持命题方向。

        (5) Hillman & Riley (1989, AER) "Politically Contestable Rents and
        Transfers"——发表属实。全支付拍卖均衡分析证明当参与者能力差异足够大时,
        低能力者在均衡中选择零努力——直接支持"底部搭便车"的理性基础。

        文献引用整体属实,无造假。但有两处"表述强度大于引用证据"的偏差:
        (i) Lazear-Rosen 的基准模型(对称能力→均衡努力相等)不直接支持"努力分布
        不均",需异质能力扩展;(ii) Prendergast 综述的结论比砖的声称更条件化
        (依赖于能力异质性和奖金梯度)。这两点不是事实错误——文献的方向性支持
        成立——但砖的表述强度过度外推,已在其他红旗(scope exclusion 和分类粒度)
        中处理。

    definition_vs_prediction:
      hit: false
      detail: |
        "锦标赛激励→努力分布右偏"是可证伪的经验主张,非必然为真的定义。以下
        逻辑自洽的替代世界均存在:
        (1) 锦标赛下努力分布均匀(所有竞争者无论能力高低付出同等努力);
        (2) 锦标赛下努力分布左偏(低能力者更努力——如"追赶效应"主导);
        (3) 锦标赛下中等能力者最努力(倒 U 型——恰是某些实证研究的发现);
        (4) 锦标赛下努力分布与固定工资无差异。

        这些替代世界均不违反任何逻辑约束——它们是经验可能而非逻辑不可能。
        命题的核心贡献在于声称现实世界(在特定的 scope 条件下)选了右偏分布而非
        其他形态——这是经验选择,非定义。通过。

        但有一条边界:若将"锦标赛"定义为"按排名分配的激励结构",将"最大化行为"
        定义为"行动者选择使期望效用最大的努力水平",则"异质能力→努力分化"可以从
        这两个定义加上标准优化逻辑推导出来——此时"努力分布不均"接近定理而非
        经验预测。真正使命题走出定义性的是:(1)分布的具体形态(右偏、死亡谷),
        (2)与替代激励结构的对比(锦标赛 vs 固定工资的差分预测),(3)可被 lab
        experiment 证伪的具体分布预测(正常/均匀 vs 右偏)。

    enumeration_exhaustiveness:
      hit: false
      detail: |
        本命题未声称可枚举的类别划分,不适用 DED-008 式枚举穷尽红旗。但有一个
        相关的概念问题:砖将努力分布主体分为三类(顶部超量/中段放弃/底部搭便车),
        这暗示了"这三类涵盖了所有参与者"。是否存在第四类——如"阈值战士"
        (threshold warriors)——在奖项阈值附近(如刚好在 top 10% 边界)投入
        超量努力的中等能力者?这类个体既不是"顶部"(绝对能力不高),也不是"中段
        放弃"(他们在特定阈值附近最拼),也不是"底部搭便车"。这揭示了三分类的
        覆盖盲区——不过三分类是启发式简化,不是声称枚举穷尽,故不触发 required。

    primary_suspect_accuracy:
      hit: false
      detail: |
        L2 桥接砖无 formal primary_suspect 字段(L3 要求),按红旗精神审查最弱腿:

        外部识别的更致命软肋(砖未自认):
        (i)【缺少 IEA】文件完全无 cross_verification 段落——这是当前最脆弱的
        结构腿。见 required_fix #1。
        (ii)【bridges_to 无定理锚】仅引 3 条概念,使桥接砖在体系中定位模糊——
        读者无法追踪"从哪条 L1 公理/定理出发推导出这条经验命题"。见 required_fix #2。
        (iii)【"能力"的独立测量缺口】砖的因果链核心前件(能力)未注册独立测量
        路径——构成软性焊点,在反例出现时可被"那些中段其实才是高能力者"防御。
        见红旗3(measurement_axis_orthogonality)。
        (iv)【锦标赛设计异质性未被 scope 覆盖】"中段放弃+底部搭便车"的通用声称
        在多奖项/底部惩罚/能力未知的锦标赛中受到挑战——这是反例猎捕的核心发现。
        见 required_fix #3 和 counterexample_hunt。

        上述四条软肋中,(i)和(ii)是结构级(文件缺陷),(iii)和(iv)是经验级(声称过度)。
        均属 required 级,但可定向修复——不构成核心塌陷。

    caliber_registration:
      hit: true
      detail: |
        本红旗命中——核心变量的测量口径未注册。

        (1)【"能力"的测量口径缺失——REQUIRED】
        statement 的因果链依赖"能力"作为关键前件(高/中/低能力→不同努力决策)。
        但"能力"的分子(什么构成能力?)、分母(相对于谁的分布?)、测量工具(用什么
        独立指标?)、信息假设(能力是否被参与者知晓?是否对称?)均未注册。
        按 L4-009 判例精神:若反例出现后砖试图调整"能力"的分类标准来救推论,
        此调整一律反向裁决。当前的未注册状态恰为这种事后调整留了空间——必须先锁死。

        (2)【"努力"的测量口径缺失——should】
        砖未定义"努力"的操作化——是工作时间?产出?投入的资源?在锦标赛理论中,
        "努力"通常被定义为投入的成本(disutility of effort),但在经验检验中
        只能通过代理变量(如产出)来测量——产出 = f(能力, 努力, 噪音)。若能力
        未独立测量,则努力也无法从产出中干净地分离出来。这是与红旗3(测量轴正交)
        同一缺陷的另一面。

        (3)【"放弃(Quit)"的操作化——should】
        "中段提前放弃"中的"提前"的参照点未定义——相对于什么"提前"?是相对于
        锦标赛结束?相对于其能力的潜在最大努力?相对于固定工资下的努力水平?
        不同的参照点导致对同一观测的不同归类。

        裁定:required 级(能力测量口径) + should 级(努力与放弃的操作化)。

    data_source_common_root:
      hit: false
      detail: |
        本桥接砖当前无 IEA 调查(见 required_fix #1),因此不涉及宏观经济数据源的
        同根问题。引用的全部是学术文献中的理论模型和田野实验发现,不涉及 WB/IMF/CNBS
        等国际组织的宏观经济指标。data_source_origin 折扣不触发。

    api_pretending_independence:
      hit: false
      detail: |
        本桥接砖无 cross_verification,因此不存在"多路 API 查询同一底层数据源
        冒充多源独立"的问题。API 可及性冒充独立性不适用。

        但需警示:若未来补充 IEA 调查,organizational_economics 和 game_theory
        两条来源的独立性系数需诚实评估——两者共享理性选择/均衡分析核心框架,
        不是跨学科独立验证。见红旗1(brick=conclusion)中对两条来源独立性的初步
        估算(可能低至 0.3-0.4)。

    reverse_failure_mode:
      hit: true
      detail: |
        本红旗命中——推论未注册"反向失败模式"(Red Flag 14, DED-039/047 判例)。

        砖声称"加大排名奖励差距→努力分布右偏加剧"。反向失败模式问:若缩小排名
        奖励差距(或取消排名奖励、改用固定工资),努力分布是否趋于均匀?按砖的
        机制逻辑,答案应为"是"——缩小差距应减弱分化。但这个反向预测未被显式
        注册在 statement 或 falsifiability 中。

        更重要的是反向失败模式的强形式:若缩小奖金差距后,努力分布【仍然右偏】
        甚至【更加右偏】,这是否证伪命题?按砖的机制,如果奖金差距趋近于零(近乎
        固定工资)而努力仍极度右偏,则"锦标赛→右偏"的因果链接被削弱——暗示
        右偏可能来自其他机制(如能力本身的分布、内在动机的差异等),而非锦标赛
        结构。这个反向测试未被注册。

        裁定为 should 级——不升至 required 因为:
        (i) 缩小奖金差距→分布趋于均匀这个预测方向可从 statement 中自然读出
        (只是未显式化);(ii) 反向失败模式在 L2 桥接砖层面的强制力弱于 L3 推论层
        (Red Flag 14 的判例 DED-039/047 均在 L3 层)。

    bootstrap_limitation:
      hit: false
      detail: |
        本命题不涉及新技术介导的社会形态(如 AI 代码协调/算法治理/DAO),不适用
        Bootstrap 限定红旗(Red Flag 15)。

    verification_object_existence:
      hit: false
      detail: |
        本命题的验证对象(锦标赛式激励组织)在现实世界中大量存在——企业销售竞赛、
        学术晋升、体育联赛、政治选举、研发竞赛等。验证对象存在且可观测,不触发
        Red Flag 16(验证对象存在性未标注)。

  iea_independence_check:
    disclosed_iea: null
    effective_iea_estimate: 1.4
    adjustment_rationale: |
      本桥接砖【缺少 cross_verification 段落】——这是结构性缺陷,必须补齐。
      以下为审查者基于文件现有 applicable_sources 的初步估算,不能替代正式的
      IEA 调查(IEA 调查需调 iea_survey.py 或等效工具,查 independence-model.yaml
      的系数表,由独立 LLM 做来源定性判断):

      假设以 organizational_economics 为锚源(weight 1.0):
      - 锚源引用了 Lazear-Rosen (1981) + Prendergast (1999) + Bandiera et al.
        (2011),证据链覆盖理论+综述+田野实验,作为锚源合理。
      - game_theory 为第二源。organizational_economics 与 game_theory 的独立性:
        两者共享理性选择/均衡分析/数学建模的核心框架。锦标赛理论(Lazear-Rosen)
        本身就是博弈论在劳动经济学中的应用。independence-model.yaml 的 source_pairs
        中未注册"organizational_economics↔game_theory"专属对。保守估计独立系数
        为 0.4(参考 evo_bio↔game_theory 的 0.4,两者均涉及"核心数学结构共享")。

      则 IEA = 1.0(锚源) + 0.4(gt × 0.4 独立系数折扣) = 1.4。

      1.4 ≥ 1.2(weakly_verified 下限),但 < 1.8(verified 下限)。本桥接砖只能
      达到 weakly_verified 的 IEA 阈值。若要升至 verified,需补充一个独立于
      经济学传统的新学科源——如 social_psychology(社会心理学对竞争行为/社会比较
      的实验研究)、evolutionary_biology(动物支配层级中的锦标赛行为)、或
      cultural_universals(跨文化的竞赛/排名激励人类学证据)。

      警示:以上为审查者的非正式估算。正式 IEA 计算需由 IEA 调查工具执行,包括
      (1)各来源的 agree/disagree 定性判断,(2)independence-model.yaml 的系数查表,
      (3)仪器折扣披露。

    instrument_honesty:
      disclosed: false
      assessment: |
        本桥接砖无 cross_verification 段落,因此无 instrument_disclosure。
        补齐 IEA 调查时必须同步披露:(1)多路投票是否由单一 LLM 执行,(2)单 LLM
        仪器会使有效独立性低于学科上限,(3)参考 META-REVIEW-001 的 honest_ceiling
        和 ICV-001 布干达判例。本命题属"新颖/争议命题"(非有限理性/亲缘利他等
        教科书共识),按 independence-model 的 mitigation 条款,仪器折扣应视为
        承重红旗。

    no_data_source_common_root:
      applicable: false
      detail: "未引用宏观经济数据源,不触发 data_source_origin 折扣。"

    overall_iea_verdict: |
      IEA 未计算——这是 required 级结构缺陷。初步估算表明 IEA 约 1.4,满足
      weakly_verified 下限(1.2)但远低于 verified 门槛(1.8)。补齐正式 IEA 调查
      是进入 verified 的前提条件。在当前的两源证据生态下(IEA≈1.4),weakly_verified
      是本命题可达到的最高 IEA 定级——除非补充独立的第三学科源。

  counterexample_hunt:
    methodology: |
      四个反例方向:(1)寻找运动联赛中底部不搭便车反而死战的案例(挑战"底部搭便车"
      通用声称);(2)寻找学术/职业锦标赛中中段最努力的案例(挑战"中段放弃"声称);
      (3)寻找多奖项锦标赛中努力集中在阈值附近的案例(挑战右偏分布的唯一性);
      (4)寻找能力未知的锦标赛中全员努力的案例(挑战"能力差异→努力分化"的
      必然性)。每个方向评估:净杀 vs 被消化 vs 揭出过度伸张。
    cases:
    - direction: "底部不搭便车——运动联赛保级战"
      description: |
        欧洲足球联赛(英超/西甲/德甲等)是典型的锦标赛式激励结构:排名决定奖金
        分配、欧战资格、以及——最关键——底部三名降级至低级别联赛。降级意味着
        收入断崖(英超降级队损失约 1 亿英镑/年)、球员流失、品牌贬值。

        在保级战中,排名靠后的球队(底部竞争者)不是"搭便车"——他们往往在赛季
        末段付出超量努力:加大投入引援(冬季转会窗)、更换教练、球员带伤上阵。
        保级战的比赛强度经常高于中游球队之间的"无欲无求"比赛。bottom teams
        fighting for survival ≠ free-riding —— they fight the hardest
        precisely because the penalty for last place is existential.
      counter_impact: "揭出过度伸张,不净杀"
      analysis: |
        不净杀——运动联赛有降级惩罚,这是砖的 scope 外的激励结构。砖的 implicit
        model 是"纯奖励型锦标赛"(赢家有奖,输家无害),而保级战的激励机制是
        "损失规避型"(输家有重罚)。这两个激励结构下的行为预测可以是反方向的。

        但揭示了两处过度伸张:
        (1) 砖的"底部搭便车"声称未声明"纯奖励型锦标赛"这个 scope 条件。
        在现实世界的锦标赛中,底部惩罚(降级/淘汰/解雇)极为常见——销售竞赛的
        末位淘汰、政治选举的落选代价、学术晋升的"非升即走"。如果砖仅适用于
        "无底部惩罚的纯奖励型锦标赛",其 scope 将大幅缩小。
        (2) 砖在 statement 中使用"搭便车"一词带有价值判断——暗示底部竞争者
        在"占便宜"。但在保级战中,底部球队付出超量努力——这不是"搭便车",
        这是"为生存而战"。砖的机制(底部无望→理性弃赛)与 sports economics
        的实证发现(底部保级→努力激增)存在张力,根因在于砖忽略了"损失"和
        "收益"在激励上的不对称——这恰恰是 Kahneman-Tversky 损失厌恶的核心
        洞见,而砖未将其纳入机制模型。

    - direction: "中段不放弃——学术终身教职锦标赛"
      description: |
        学术终身教职(tenure)制度是一个典型的锦标赛:助理教授在约 6 年内竞争
        有限的终身教职名额,按研究成果的相对排名(同行评审+引用+发表记录)决定
        谁获终身教职、谁被淘汰("非升即走")。

        在这个锦标赛中,努力分布不是"顶部超量、中段放弃、底部搭便车"。相反:
        - 顶部(已获终身教职的正教授):努力可能下降(终身教职的" Cliffs"效应),
        部分人减少研究产出;
        - 中段(助理教授,tenure-track):这是最拼命的阶段——教学+研究+服务,
        为通过 tenure 评审付出最大努力;
        - 底部(博士后在非 tenure-track 岗位):可能已退出锦标赛(选择业界),
        或仍试图挤入 tenure-track(边缘参与者)。

        这个努力分布更接近"中部峰值"(倒 U 型)而非"右偏+死亡谷"。
      counter_impact: "揭出过度伸张,不净杀"
      analysis: |
        不净杀——tenure 锦标赛有一个关键特征:它是【重复博弈+淘汰制】而非
        【单次+纯奖励】。(1)只有通过 tenure 才能留在博弈中——失败=永久退出
        学术界(或降至较低层级)。(2)评估是多维的(教学/研究/服务),非单一产出
        排名。(3)能力信息在过程中逐渐揭示(通过年度评审/会议报告/预印本),
        而非事前已知。

        但揭示三处过度伸张:
        (1) 砖假设能力事前已知且固定。在 tenure 锦标赛中,能力(研究潜力)是
        在多年过程中逐渐揭示的——处于中段的助理教授并不知道自己"能力中等"
        (他们可能认为自己有 top 潜力但尚未证明),因此不会提前放弃。这是
        "对称不确定性→中段努力"的机制,砖未覆盖。
        (2) 砖忽略淘汰制的激励不对称:"失败=退出"比"失败=无奖"产生更强的
        激励,因为前者涉及身份/职业认同的损失,不只是金钱。
        (3) 砖忽略多维评估对努力策略的影响:当考核是多维的(教学+研究+服务),
        竞争者可在不同维度上差异化投入(比较优势),而非在单一产出排名上竞争。
        多维锦标赛的努力分布形态可能与单维锦标赛有质的不同。

        这个案例也反向凸显了砖的一个隐含假设:锦标赛是"单次、单维、纯奖励、
        能力公开且固定"的——这是一组非常特殊的参数。在更一般的锦标赛结构下,
        努力分布形态可能呈现倒 U 型、双峰型、或均匀型——砖当前的通用声称
        过度简化了。

    - direction: "多奖项阈值效应——Salesforce 多级锦标赛"
      description: |
        企业销售竞赛经常设置多级奖项:top 10% 获大奖,top 25% 获中奖,top 50% 获
        小奖。这样的多级结构在每个奖项阈值附近产生努力集中——接近 top 10% 边界
        的销售员(中高能力)会超量努力以确保进入顶级;接近 top 25% 边界的中能力者
        也会努力以至少获得中奖;甚至接近 top 50% 边界的较低能力者也为避免"一无所获"
        而努力。

        Courty & Marschke (2004, AER) "An Empirical Investigation of Gaming
        Responses to Explicit Performance Signals" 发现政府培训项目中,机构在
        绩效评估截止日期附近集中投入努力以达到下一级评级阈值——这正是阈值效应的
        证据。
      counter_impact: "揭出过度伸张,不净杀"
      analysis: |
        不净杀——多级奖项结构下的阈值效应并不推翻"锦标赛→努力不均",而是将
        "不均"的具体形态从"右偏+死亡谷"改变为"多峰+阈值集中"。机制的根(相对
        排名决定报酬)不变,但机制的表现(努力分布形态)随奖项结构变化。

        揭示的过度伸张:砖将努力分布形态(右偏+中段死亡谷+底部搭便车)作为锦标赛
        的通用特征提出,但实际上这只是特定奖项结构(单一大奖+无底部惩罚)下的
        均衡形态。当奖项结构不同时,同一机制可产生截然不同的分布形态。砖的
        statement 应诚实标注这一依赖性。

    - direction: "能力未知的对称锦标赛——初创公司全员拼搏"
      description: |
        早期初创公司是一个能力信息高度不透明的锦标赛:谁是最有能力的工程师/
        产品经理/销售在事前基本不可知——能力在过程中逐步揭示。在能力未知的
        情况下,Lazear-Rosen 基准模型(对称能力→均衡努力相等)预测:所有参与者
        付出同等努力(因为没有理由认为自己的胜率比别人低)。

        许多初创公司的"全员 996"(所有员工超长工时)现象——从实习生到联合创始人
        都在拼命——与此预测一致:能力事前未知→无人提前放弃。
      counter_impact: "被消化——支持命题的边界条件必要性"
      analysis: |
        此案例不构成反例——它恰恰验证了"能力异质且已知"是"中段放弃"的必要
        条件。当能力未知时(对称不确定性),Lazear-Rosen 基准模型预测均衡努力
        相等——不存在中段放弃。这与砖的机制一致:能力差异是努力分化的前提。

        消化方式:此案例实际上强化了 required_fix #3(需在 statement 中注册
        "能力事前已知且异质"这一 scope 条件)。当这个条件满足时,砖的"右偏"
        预测成立;当不满足时,预测变为"努力分布均匀"——这不是证伪,而是边界
        条件的精确化。

    overall_counterexample_verdict: |
      无净杀反例。四个方向上的发现:
      (1) 运动联赛保级战→挑战"底部搭便车",但可被"纯奖励型 vs 损失规避型"
      的 scope 区分消化。揭示过度伸张:砖的通用声称忽略了底部惩罚这一关键
      调节变量。
      (2) 学术终身教职→挑战"中段放弃",但可被"能力事前未知+淘汰制+多维评估"
      的 scope 区分消化。揭示过度伸张:砖的隐含假设集合(单次/单维/纯奖励/
      能力已知)是高度限定的,通用声称过度外推。
      (3) Salesforce 多级奖项→挑战"右偏分布的唯一性",但可被"多奖项=多阈值"
      的机制变体消化。揭示过度伸张:努力分布形态是奖项结构的函数,非锦标赛本身
      的必然属性。
      (4) 初创公司全员拼搏→支持命题的边界条件必要性。不构成反例。

      反例猎捕的核心贡献不是推翻命题,而是精确定位命题的 scope 边界:
      "中段放弃+底部搭便车+右偏分布"在【单次、单一大奖、纯奖励型、能力事前
      已知且异质】的锦标赛下成立;在更一般的锦标赛结构下,努力分布形态是奖项
      结构、信息结构、惩罚结构的函数——形态各异但机制同根(相对排名决定报酬)。

  non_recurrence:
    - check: DED-004
      status: pass
      detail: |
        本命题不依赖不可证伪的循环定义。falsifiability (c)的实验室锦标赛测试
        提供了干净的可证伪路径——外生设定能力差异,观测努力分布形态,若呈均匀
        或正态则证伪。不存在"否定它就说不通"的概念保护。

    - check: DED-007
      status: pass_with_caveat
      detail: |
        非 DED-007 式的闭环焊接(分母不偷用实际结果定义自变量)。但测量轴不正交
        以不同方式出现——"能力"的独立测量路径未注册(见红旗3 measurement_axis_
        orthogonality)。该缺陷可通过预注册能力独立测量路径来修复,不同于 DED-007
        的结构死罪(分母=结果,不可修)。

  required_fixes:
    - id: REQ-BR-L2-039-A
      severity: required
      what: |
        补充 cross_verification/IEA 调查。调用 IEA 调查工具(iea_survey.py
        或等效管线),对两条 applicable_sources(organizational_economics 和
        game_theory)进行正式的来源定性判断(agree/disagree)、独立性系数查表
        (independence-model.yaml)、IEA 计算、仪器折扣披露。当前初步估算 IEA
        约 1.4(weakly_verified 区间),正式调查可能确认或调整此估算。至少需
        IEA ≥ 1.2 才能从 candidate 进入 weakly_verified。
      rationale: |
        IEA 是 L2 桥接砖验证管线的核心环节——没有 IEA 的桥接砖相当于没有
        经过测试的代码。当前文件的 applicable_sources 仅列出文献引用,但未
        经过(1)来源定性判断(每条来源是否真的 agree?)、(2)独立性折扣(两源
        共享理性选择框架→独立系数应打折)、(3)仪器折扣披露。这些是结构性地
        缺失的。

    - id: REQ-BR-L2-039-B
      severity: required
      what: |
        补充 bridges_to 的公理和定理连接。最小集:AXIOM-001(稀缺性-竞争公理)
        ——多个人争同一份不够分的资源,竞争必然存在,这是锦标赛激励存在的前提。
        推荐追加:THEOREM-competition-norm(竞争规范化定理)——反复竞争会自发形成
        "比赛该怎么打"的规矩,锦标赛恰是这种规范化的制度表现。这两条连接为
        桥接砖提供了从 L1 公理/定理出发的推导锚点,使体系中后续的 L3/L4 推论
        可以清晰地引用"本推论依赖 BR-L2-039,后者从 AXIOM-001 和 THEOREM-competition-norm
        出发"。
      rationale: |
        当前 bridges_to 仅引 3 条 CONCEPT,结构深度远低于体系中其他 L2 桥接砖。
        CONCEPT 层只提供术语定义(什么是竞争/行动者/目标),不提供因果机制
        (为什么竞争必然导致某种行为模式)。AXIOM-001 和 THEOREM-competition-norm
        提供了缺失的因果链:稀缺→竞争→竞争规范化→锦标赛激励→努力分布不均。
        没有这个链,桥接砖在体系中的推导关系是不完整的。

    - id: REQ-BR-L2-039-C
      severity: required
      what: |
        在 statement 或 domain 中预注册 scope 条件,明确本命题的适用范围。
        至少需覆盖以下四个最关键的调节维度:
        (a) 奖项结构:本命题的"中段放弃+底部搭便车+右偏分布"声称适用于
        【单一大奖或高度凸性奖金梯度】的锦标赛。当存在多级平缓奖项时,
        努力分布可能呈现多峰或倒 U 型——这是同一机制的不同参数表现,非反例。
        (b) 底部惩罚:本命题假设【纯奖励型锦标赛】(输家无额外损失)。当底部
        有降级/淘汰/解雇惩罚时,底部竞争者努力可能上升——这是因为损失规避的
        激励不对称叠加在排名激励之上。
        (c) 能力信息:本命题假设【能力事前已知且异质】(参与者知道自己的能力
        相对于他人的位置)。当能力未知(对称不确定性)时,均衡预测为努力均匀。
        (d) 博弈次数:本命题描述的是【单次锦标赛】的均衡形态。重复锦标赛中的
        声誉效应/职业顾虑可能改变努力策略。
        无底部惩罚+能力已知+单次是窄 scope,但诚实标注比留下模糊被攻击要好。
      rationale: |
        反例猎捕发现的四类挑战(运动保级/学术 tenure/多级销售/初创全员)均非
        净杀——它们全可以在上述 scope 条件内被消化为"参数不同的同机制表现"
        或"scope 外案例"。但当前的通用声称("锦标赛→中段放弃+底部搭便车")
        未标注这些 scope 条件,使桥接砖面临被轻易挑战的风险。预注册 scope
        条件可以将四个反例方向从"攻击面"转化为"边界精确化的贡献"。

    - id: REQ-BR-L2-039-D
      severity: required
      what: |
        修复 falsifiability (b) 的地板效应护身符。两个选项:
        (A) 在 falsifiability (b) 中追加前置条件:"低能力参与者的基线努力水平
        显著大于零(非地板)"。若低能力者基线努力为零,则此测试不适用,改用
        falsifiability (c)(实验室锦标赛)或其他证伪路径。
        (B) 将证伪测试的对象从"低能力者"改为"中等能力者",因为中等能力者
        不太可能处于地板:如"加大排名奖励差距后,中等能力参与者的努力水平
        上升或维持不变"——若中段因奖金差距增大而从放弃变为参与,则命题关于
        '中段放弃'的声称被削弱。
        推荐(A)+(B)组合——保留低能力者测试(加前置条件),追加中等能力者测试
        作为补充。
      rationale: |
        当前 falsifiability (b) 在低能力者处于零努力地板的情境中无法被触发,
        构成一个"声称可证伪但实际测不了"的测试。按 anti-talisman 红旗标准,
        证伪条件必须可事前测量——不可有无法触发的隐藏豁免区。修复方向明确
        且不改变命题内核。

  should_fixes:
    - id: SHOULD-BR-L2-039-E
      severity: should
      what: |
        注册"能力"的独立测量路径。在 statement 或 core_mechanism 中声明:
        (a) 能力在本命题中如何定义——是相对于锦标赛任务的生产率/技能/天赋,
        非事后从产出反推;(b) 能力的独立测量方法——如过往独立于本锦标赛的
        绩效记录、标准化技能测试、或实验室中由实验者外生分配的能力水平;
        (c) 信息假设——能力是否被参与者知晓?是否对称?(本命题假设已知且对称)。
        此改进将消除红旗3(measurement_axis_orthogonality)中识别的软性焊点。
    - id: SHOULD-BR-L2-039-F
      severity: should
      what: |
        区分"搭便车"与"理性放弃"。底部竞争者的零努力在 Hillman & Riley (1989)
        的全支付拍卖均衡中是理性最优策略(能力差距足够大时,参与竞赛的负期望
        收益使弃赛成为唯一理性选择)。这不是经济学意义上的"搭便车"(free-riding
        = 享受他人努力的成果而不付出成本)。底部竞争者在纯奖励型锦标赛中没有
        "搭便车"的对象——他们输了就是零,没有"别人的努力让我获益"的机制。
        建议将"搭便车"改为"理性弃赛"或"零努力均衡",避免价值判断混淆机制分析。
    - id: SHOULD-BR-L2-039-G
      severity: should
      what: |
        注册"反向失败模式"(Red Flag 14)。在 statement 或 falsifiability 中
        显式声明:若缩小排名奖励差距(趋近固定工资)后努力分布仍然右偏,则命题
        被削弱——因为这意味着右偏可能来自锦标赛结构以外的机制(如能力本身的
        分布差异、内在动机差异等)。此反向预测是命题的合理推论,显式化后使命题
        更可检验。


round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: verified
  verdict_note: |
    核心机制（Lazear-Rosen 锦标赛模型 + 全支付拍卖均衡）非平凡，跨两个独立子领域支撑。falsifiability 三组条件可观测、不循环、未重蹈 DED-004/007。scope_limitation 三要件（单一大奖/无底部惩罚/能力已知）事前划定，反例猎捕中发现的体育反例（多级奖金）、学术反例（晋升后激励切换）、全支付拍卖边界（小 N）、养殖业反例（沉没成本）均落在 scope 之外或触及已声明边界——被消化而非净杀。r1 修复全部落地：falsifiability (b) 加了基线努力>0 的前置条件堵住了地板护身符，scope_limitation 三要件明确化，IEA=1.4 诚实标注。挡 verified 的仅余一个 should 级口径注册问题（"右偏程度"的测度未注册），不构成 required 级。独立 sufficient。

    两条 should 残留：(1) 右偏测度的口径注册；(2) 反向失败模式注册（重复博弈中段可能反转）。
  red_flags: |
    1. brick=conclusion — 未命中。Lazear-Rosen + Hillman-Riley 跨领域。
    2. 逐格判空 — 未命中。"奖励差距↑→右偏加剧"是可证伪经验主张。
    3. 测量轴正交 — 未命中。自变量/因变量测量链分离。
    4. 射程/排除钩子独立于结果 — 弱命中。scope 三要件是事前设计维度。
    5. 分类判据档位匹配 — 弱命中。奖金结构连续量被三档二分化，可改进非致命。
    6. anti-talisman 真兑现 — 未命中，但能力用过去表现代理可能与努力混淆（should）。
    7. 现实锚事实核查 — 未命中。Lazear-Rosen 1981、Prendergast 1999、Bandiera 2011、Tullock 1980、Hillman-Riley 1989 均真实。
    8. 条件是下定义还是做预测 — 未命中。三要件可观测。
    9. 枚举穷尽 — 未命中。不声称枚举。
    10. primary_suspect — 未命中。文件未自认最弱腿。"中段放弃"与"底部搭便车"被压缩成"右偏"一标签（should）。
    11. 口径完整注册 — 命中 should。"右偏程度"测度未注册（基尼/偏度/分位比未指定）。
    12. 数据源同根 — 未命中。已诚实标注 IEA=1.4 独立系数 0.4。
    13. API 可及性 — 未命中。不适用。
    14. 反向失败模式缺失 — 命中 should。重复博弈 + 学习效应下中段可能反转（Erkal 2018 方向）未注册。
    15. Bootstrap 限定 — 未命中。不适用。
    16. 验证对象存在性 — 未命中。实验室 + 田野证据充分。
  counterexample_hunt: |
    构造五组反例场景：(1) 体育多级奖金反例（Malchow-Møller 2006 自行车）→被消化（scope a 不满足）；(2) 学术晋升反例（终身教职后发文下降）→被消化（scope b 不满足，存在淘汰/晋升切换）；(3) 小 N 全支付拍卖反转（Bartoloni 2013）→边界，中段概念塌缩，scope 默认大 N；(4) Knoeber 1989 火鸡业底部努力不塌缩→被消化（scope b 不满足，存在沉没成本/退出壁垒）；(5) Erkal 2018 重复博弈学习中段反转→ scope 未声明单期/重复，触及未注册的反向失败模式。无 scope 内净杀。
  required_fixes: []
  oneline: |
    核心机制成立、falsifiability 修复落地、反例猎捕无净杀；仅余"右偏"测度注册与反向失败模式注册两条 should，不挡 verified。
