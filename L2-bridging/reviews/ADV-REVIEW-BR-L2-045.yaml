id: ADV-REVIEW-BR-L2-045
type: adversarial_review
reviews: BR-L2-045
layer: L2-bridging
target: BR-L2-045
target_term: "多任务目标干扰效应 (Goal Interference Multitasking Effect)"
rounds: 1

人话摘要: |
  对 BR-L2-045(多任务目标干扰效应——同时做几件评判标准冲突的事比按顺序做更慢更累)
  的 round_1 独立对抗审查。裁 needs_revision:核心直觉(评判标准冲突导致切换成本+
  侵入性激活)在认知心理学中有大量任务切换文献支持,但三条 required 缺陷阻止 verified:
  (1)falsifiability (c)"任何未控制的第三个变量可完全解释"是无限大的证伪逃逸口——
  任何实验失败都可以归因于未测变量,构成 anti-talisman 护身符;
  (2)IEA cross_verification 缺失,桥接砖无法进入 verified 流程;
  (3)测量轴——"评判标准冲突"与"资源竞争"的分离在认知实验中缺乏独立于结果的操作化手段,
  使得桥接砖的核心领域边界(资源竞争微弱但标准冲突强烈)在见结果后可任意重划。
  反例猎捕四个方向上未获净杀,但发现:创造性约束(十四行诗/爵士即兴)中冲突标准可促进
  而非抑制产出——揭示了反向失败模式的未注册缺口。

round_1:
  reviewer: independent-adversarial-reviewer
  date: 2026-07-16
  verdict: needs_revision
  verdict_note: |
    BR-L2-045 的核心直觉——当两个任务要求不同的评判标准(如一个要快一个要准)时,
    在两者间切换会产生成本,且未完成目标的残留激活持续消耗注意资源——在认知心理学
    的任务切换(task switching)和 Zielgarnik 效应(未完成任务的记忆优势)文献中有
    坚实的经验基础。将此机制从单一任务内的速度-准确权衡扩展到多目标任务间的干扰,
    有其直觉上的合理性。

    但三条 required 级缺陷阻止 verified 裁决:

    1.【anti-talisman 护身符:falsifiability (c) 的"任何未控制第三变量"逃逸口
    ——REQUIRED】
    Falsifiability (c) 的表述:"若存在任何未控制的第三个变量可完全解释该干扰效应
    (如工作记忆容量差异),则证伪。"

    这是本桥接砖最致命的方法论缺陷。问题不在承认存在潜在混淆变量(这本身是诚实的),
    而在将证伪条件设置在了一个永远无法被攻击者触发的门槛上:
    (i)"任何未控制的第三个变量"——这个集合在原则上无限大。任何一项实验无法穷尽
    控制所有可能的第三变量,因此总存在"未控制的第三个变量"被提出作为替代解释。
    (ii)"可完全解释"——这是一个不可能达到的证明标准。攻击者需要证明某个第三变量
    "完全"解释了效应(而非部分解释),而保留变量永远可以被主张"只能部分解释"。
    (iii)组合效应:条件(i)+(ii)意味着:无论实验证据对桥接砖多么不利,作者都可以
    主张"你发现的替代解释只是部分解释,未完全解释;且仍可能存在其他未控制的变量
    需要排除"。这使得 falsifiability (c) 成为一条永远走不通的证伪死胡同——
    攻击者永远输,桥接砖永远赢。

    这是 anti-talisman 护身符的经典模式:证伪条件在形式上可陈述,在操作上不可触发。
    不是"证伪条件苛刻"(要求高也可以满足),而是"证伪条件的逻辑结构使触发在原则上
    不可能"。

    区分:DED-004 的不可证伪是命题本身就不可错(循环定义);本缺陷是命题本身可错
    但其中一条证伪路径是护身符。修复路径明确:将 falsifiability (c) 替换为具体的、
    可前定的第三变量列表,并在见数据前锁定每个变量的控制方式和判定标准。

    2.【IEA cross_verification 缺失——REQUIRED】
    桥接砖 YAML 当前不含 cross_verification 节。L2 桥接砖的 verified 需要
    IEA >= 1.8, weakly_verified 下限为 IEA >= 1.2。没有 cross_verification 就
    没有 IEA 分数,桥接砖无法进入任何已验证状态。

    桥接砖引用了两个来源:
    - 目标系统理论与认知实验(Kruglanski et al. 2002; Shah & Kruglanski 2002;
    Orehek et al. 2015)
    - 组织行为中的多目标绩效证据(Locke & Latham 2002; Ordonez et al. 2009;
    DeShon & Gillespie 2005)

    初步 IEA 结构建议:两源均来自认知/组织心理学的同一研究传统(目标理论)。
    Kruglanski 的目标系统理论(goal systems theory)和 Locke & Latham 的目标设置
    理论(goal setting theory)虽有不同侧重点(前者关注目标间动态关系,后者关注
    目标属性对绩效的影响),但在学科归属、方法论(实验室实验+问卷调查)、核心构念
    (目标/动机/绩效)上有大量重叠。按 independence-model.yaml 的 source_pairs,
    无直接对应条目(两源均属 cognitive/organizational psychology),default_independence
    为 0.6——但考虑到两源共享同一学科范式和方法论,实际独立性可能更低。

    即使未来补上 cross_verification,本条砖面临独立的 IEA 挑战:
    (i)两源在多大程度上是"独立"的?如果目标系统理论和目标设置理论是同一心理学
    传统的两个分支,那么"两个来源都说目标冲突降低绩效"不是两票独立验证——
    它是一棵树上两个分叉的一致。
    (ii)按 independence-model.yaml 的 instrument_correlation discount_rule:
    若 cross_verification 由单一 LLM 执行,必须披露仪器有效独立性低于学科独立性
    上限。本桥接砖将认知心理学的实验室发现外推至一般 agent 行为(不限人类),
    属于"新颖/争议命题"(非多重复现的稳固共识),按 mitigation 条款,仪器折扣
    应视为承重红旗。

    IEA 补全为 required_fix。

    3.【测量轴:评判标准冲突 vs 资源竞争的分离缺乏独立操作化——REQUIRED】
    桥接砖的核心领域限定是:"在目标间资源竞争微弱(例如两个纯认知任务,无感官冲突)
    但评判标准冲突强烈(例如一个要求速度、一个要求准确)的条件下。"

    此限定的经验有效性依赖于一个关键预设:"资源竞争"和"评判标准冲突"是两个可以
    被独立测量和分离的维度。但这一预设存在以下问题:

    (i)【"纯认知任务,无感官冲突"仍有资源竞争】
    任何两个需要同时执行的认知任务,无论感官模态是否冲突,都会竞争同一套中央执行
    资源(工作记忆、注意控制、反应选择)。"无感官冲突"不等于"无资源竞争"——
    两个纯认知任务(如心算+词义判断)即使使用不同感觉通道(听觉+视觉),它们在
    中央执行层面的资源竞争仍然是实质性的。桥接砖声称"资源竞争微弱"的实验条件,
    在认知架构的现实约束下可能是一个空集。

    (ii)【"评判标准冲突"的操作化依赖任务设计,但不能独立于"资源竞争"测量】
    桥接砖给出范式案例:"一个要求速度、一个要求准确"。但在经典的 speed-accuracy
    tradeoff 研究中,速度与准确是同一任务内的两个维度,而非两个独立任务的目标。
    将它们分配到两个不同任务(a 任务要求速度,b 任务要求准确)后,任务本身的内容
    差异(而不是评判标准差异)也会贡献干扰。分离"因评判标准不同导致的切换成本"
    和"因任务内容不同导致的切换成本"需要一个桥接砖未提供的对照设计。

    (iii)【领域边界在见结果后可重划】
    假设一项实验发现:速度任务+准确任务的并行执行并不显著低于序列执行。桥接砖
    可以辩称:这是因为实验中的"资源竞争"实际上不弱(中央执行资源被共享了)——
    所以此结果不在桥接砖声称的域内(该域要求资源竞争微弱)。但"资源竞争是强是弱"
    在实验前没有任何独立于任务绩效的操作化标准——它只能通过实验后的绩效模式
    来推断。这构成了一个闭环:如果并行<序列,解释为"标准冲突+资源竞争弱"→
    支持桥接砖;如果并行>=序列,解释为"资源竞争实际不弱"→不挑战桥接砖。

    修复方向:(i)在见数据前注册一个"资源竞争强度"的独立操作化指标——如使用
    与实验任务不同的独立任务(如 n-back)测量剩余认知容量,作为资源竞争的代理;
    (ii)或者放弃"资源竞争微弱"这一限定,改为诚实注册"本效应在资源竞争和标准
    冲突的联合贡献上成立,当前无法分离两者的独立效应量";
    (iii)或者提供可独立操纵两个维度的实验设计(因子设计:资源竞争高/低 x
    标准冲突高/低),使两个维度在实验层面可分离。

    4.【bridges_to 连接薄弱——should 级附加缺陷】
    桥接砖仅 bridges_to 三个 L1 概念:CONCEPT-agent、CONCEPT-goal、CONCEPT-resource。
    这三个概念为桥接砖提供了"agent 有目标、目标可冲突、资源有限"的 L1 基础,
    但桥接砖的核心机制——评判框架切换成本和侵入性目标激活——并非从这三个概念的
    交互中推导而出。它们来自认知心理学的外部文献(任务切换范式/Zielgarnik 效应),
    而非体系的 L1 公理/定理。

    对比本体系中 bridges_to 更丰富的 L2 桥接砖:
    - BR-L2-009(人际信任有界) bridges_to AXIOM-002 + THEOREM-relation-information-asset
    + THEOREM-group-identity-decay + THEOREM-cooperation-precondition——信任衰减的
    机制可以从 L1 定理的交互中推导。
    - BR-L2-045 则不同:三个 concepts 提供了"多目标+有限资源"的定义框架,但未提供
    "为什么评判标准冲突会导致切换成本"的推导起点。"切换成本"和"侵入性激活"
    是 L1 体系外的实证发现,被导入后贴上 L1 标签。

    这不构成 required 缺陷(L2 桥接砖不要求其机制完全从 L1 推导),但诚实标注:
    当前 bridges_to 结构较薄,桥接砖的经验信用主要来自外部认知心理学文献而非
    体系内部的逻辑连接。建议:考虑是否 bridge 到 CONCEPT-information(信息处理
    需要载体→切换评判框架=切换信息处理模式)或 AXIOM-002(信息熵增→记忆中的
    目标激活需要能量维持→侵入性激活消耗有限维护预算),以加强体系内推导链。

  red_flags:
    brick_is_conclusion:
      hit: false
      detail: |
        BR-L2-045 的核心机制(评判框架切换成本+侵入性目标激活)来自认知心理学
        的任务切换文献和目标系统理论,不是任何 L1 公理/定理的重述。

        L1 实体覆盖度评估:
        - CONCEPT-agent:定义行动者有目标、能感知、能行动——不涉及多目标任务
        切换成本
        - CONCEPT-goal(d):"Agent 可同时持有多个目标,目标之间可能存在冲突"——
        这是目标间冲突可能性的定义,不涉及冲突如何具体表现为认知干扰及其程度
        - CONCEPT-resource:资源有限→agent 必须选择如何分配——这是资源分配的
        必要性,不涉及评判标准切换的具体认知机制
        - AXIOM-002(信息熵增):信息需要维护投入——与切换成本有微弱联系,但
        并未被桥接砖引用

        桥接砖的非平凡经验内核:(a)区分了"评判标准冲突"和"资源竞争"作为两种
        独立的干扰源;(b)指定了两种具体认知机制(切换成本+侵入性激活);
        (c)做出了方向性预测(并行<序列)。这些不是 L1 的逻辑重述——
        CONCEPT-goal(d)只说了"目标可冲突",没说冲突会导致并行效率低于序列。
        在逻辑上,并行效率高于序列的世界(如并行处理优于串行处理的计算架构)
        与三个 bridges_to L1 概念均不矛盾——因此"并行<序列"是一个有经验风险
        的声称,不是定义。

        但需注意:桥接砖的核心机制与 BR-L2-027(注意力稀缺与信息过载)存在
        功能重叠。BR-L2-027 声称"脑子只能同时想几件事",BR-L2-045 声称
        "评判标准冲突降低并行效率"——后者可被视为前者的一个具体机制实例。
        重叠不构成 brick=conclusion(045 有 027 未涵盖的机制细节),但体系应
        注意两者之间的推导关系:045 是否可被 027 蕴含?如果 027 的"注意力有限"
        足以推导 045 的"标准冲突→干扰",则 045 的新增量较薄。

    empty_cell_tautology:
      hit: false
      detail: |
        核心空格预测:若"评判标准冲突不影响并行效率",则:
        (a)在标准冲突强烈但资源竞争微弱的实验中,并行执行的总产出不显著低于
        序列执行;
        (b)侵入性目标激活的神经指标与效能下降无显著相关;
        (c)效应完全被已控制的第三变量解释。

        这些是可观察的经验预测——如果这些条件在系统性检验中被满足,桥接砖
        的核心主张就被削弱或推翻。预测在形式上是可错的(在逻辑上,一个并行
        优于或等于序列的世界与 L1 概念不矛盾),非空洞的同义反复。

        但需注意:falsifiability (c) 的表述("任何未控制的第三变量可完全解释")
        在实践中的证伪力极弱——见 anti-talisman 红旗的详细论证。这属于"一条
        证伪路径形同虚设",不属于"所有证伪路径都空洞"。空格本身有内容,只是
        其中一条路径是护身符。

    measurement_axis_orthogonality:
      hit: true
      detail: |
        本红旗命中——"评判标准冲突强度"与"资源竞争强度"的分离缺乏独立于
        结果的操作化手段,使桥接砖的领域边界在见结果后可重划。

        【核心问题:两个维度的分离不可独立测量】
        桥接砖的限定:"资源竞争微弱但评判标准冲突强烈"定义了效应的适用域。
        这意味着需要独立测量两个维度:
        (i)资源竞争强度——多任务对同一有限资源(注意/工作记忆/反应通道)的
        竞争程度;
        (ii)评判标准冲突强度——各任务评价标准(速度/准确/质量等)的不兼容程度。

        问题:在认知实验中,这两个维度不能以独立于任务绩效的方式被前定测量:
        - "资源竞争强度"通常通过双任务干扰量(double-task interference)来度量——
        即通过绩效下降来推断资源竞争。但绩效下降恰是桥接砖的因变量。
        - "评判标准冲突强度"通过任务指令的操作定义(要求速度 vs 要求准确),
        但指令的"冲突程度"是类别性的(冲突/不冲突)而非量化的,且两个任务
        的内容差异(而非评判标准差异)也会贡献干扰量。

        这意味着:在一个实验中观察到"并行<序列"后,桥接砖可声称"这是因为标准
        冲突强烈+资源竞争微弱,符合预测";在一个实验中观察到"并行>=序列"后,
        桥接砖可声称"这是因为资源竞争实际上不弱(中央执行资源被共享),不在
        声称域内"。领域边界的重划完全依赖于已观测到的结果方向——这是闭环。

        【与 DED-007 测量轴焊死的区别】
        DED-007 的测量轴焊死是分母偷用结果(用"实际获授者"定义授信对象,闭环),
        属结构死罪。本缺陷不同于此:两个维度(标准冲突/资源竞争)在概念上是可
        分离的,且存在将它们分离的可行实验设计(因子设计:操纵资源竞争 高/低 x
        标准冲突 高/低)。问题不在结构不可能,而在桥接砖当前版本未提供此分离
        的操作化方案,使领域边界目前是事后可重划的。

        【修复路径】
        (i)【因子设计+独立操作化】注册具体的实验设计:2x2 因子(资源竞争×标准
        冲突),每个格子使用预注册的任务组合和操作定义。例如:
        - 高资源竞争:两任务共享同一感觉通道(均为视觉)
        - 低资源竞争:两任务使用不同感觉通道(视觉+听觉)
        - 高标准冲突:任务 A 指令强调速度,任务 B 指令强调准确
        - 低标准冲突:两任务指令均强调速度(或均强调准确)
        在此因子设计下,桥接砖预测:低资源竞争×高标准冲突 格子的并行-序列差异
        最大(显著负值),其他格子的差异较小或不显著。
        (ii)【至少诚实注册当前不可分离性】在 statement 中标注:"当前版本未提供
        将'评价标准冲突'效应从'一般资源竞争'效应中独立分解的操作化方案。
        因此,本命题当前在'标准冲突+资源竞争'的联合贡献层面成立,两个维度的
        独立效应量待后续实验分离。"

        裁定:REQUIRED 级——领域边界的可重划性使命题在实践中的证伪风险被
        掏空。修复路径明确(因子设计或诚实标注),不构成命题核心塌陷。

    scope_exclusion_independent:
      hit: true
      detail: |
        桥接砖注册了两个排除条件:
        (1)"不适用于目标间评判标准兼容(如两个任务都要求速度)";
        (2)"不适用于资源竞争占主导的场景"。

        排除条件(1)按可事前测的渠道划界——"评判标准兼容"可通过任务指令的
        预注册来判定(如两任务指令均要求速度→标准兼容)。不触发本红旗。

        排除条件(2)有事后重划风险——"资源竞争占主导"的判定缺乏预注册的
        操作化标准。见测量轴正交(红旗 3)的详细论证:当前无法在不依赖结果的
        情况下判定"资源竞争是否占主导"。这使得条件(2)在反例出现后可用于
        救命题(将反例归入"资源竞争占主导"的排除区)。

        修复:注册"资源竞争占主导"的前定操作化判据——如"当两任务使用同一
        感觉通道且任务内容高度相似时,认定为资源竞争占主导"。

    classification_granularity:
      hit: false
      detail: |
        桥接砖的核心变量(评判标准冲突程度/资源竞争程度/并行vs序列效率差异)
        均为连续量或有序类别。桥接砖未做不必要的粗暴离散化。预测形式保持
        连续度量,档位匹配不触发。

    anti_talisman:
      hit: true
      detail: |
        本红旗命中——falsifiability (c) 是无限大的证伪逃逸口,构成 anti-talisman
        护身符。

        【falsifiability (a) 的分析】
        "在评判标准冲突严重但资源竞争弱的多任务实验中(如同时进行速度-准确矛盾
        任务),并行执行的总产出显著高于序列执行,则本理论被证伪。"

        此条件在形式上可操作——设计速度-准确矛盾的双任务实验,比较并行与序列
        执行的总产出。若并行显著优于序列,桥接砖的核心方向性预测被推翻。
        这是一个可执行的证伪路径,不是护身符。

        但需注意:实验操作化的细节(见测量轴红旗)使领域边界的重划可以在见结果
        后进行——如果"并行>序列"被观测到,桥接砖可辩称"资源竞争实际上不弱"。
        这是测量轴问题(红旗 3)而非 falsifiability (a) 本身不可操作。

        【falsifiability (b) 的分析】
        "若侵入性目标激活的神经指标(如前扣带皮层激活)与效能下降无关,且切换
        成本无法分解为独立因素,证伪。"

        此条件在神经科学层面可操作但实践门槛极高——需要 fMRI/EEG 设备、神经
        影像分析专门知识、大样本量(神经指标个体差异大)。这不是护身符(原理上
        可测),但实践的不可及性使此证伪路径极少被使用。应列为 should 而非
        required——极高的测量成本不等于不可证伪。

        【falsifiability (c) 的分析——REQUIRED 护身符】
        "若存在任何未控制的第三个变量可完全解释该干扰效应(如工作记忆容量差异),
        则证伪。"

        此条件的逻辑结构使它在原则上不可触发:
        (1)【无限可能空间】"任何未控制的第三个变量"的集合在原则上无限大。
        无论实验控制了多少变量,永远存在未控制的候选变量——这是实验科学
        的认识论常态,不是特定实验的设计缺陷。将证伪的门槛设定为"不存在
        任何可完全解释该效应的未控制变量"等于将证伪搁置到认识论的终点——
        一个永远不会到达的点。
        (2)【不可能满足的证明负担】"可完全解释"要求替代变量解释 100% 的
        方差——这在社会科学中几乎从不成立。即使一个替代变量解释了 80% 的
        方差,桥接砖仍可主张"剩下的 20% 是标准冲突机制贡献的"。攻击者永远
        无法达到"完全解释"的标准。
        (3)【不对称的游戏规则】桥接砖不需要提供自己"可完全解释效应的证据"
        ——只需要说"效应存在"。但攻击者需要提供替代变量"可完全解释效应的
        证据"。桥接砖的证实标准是"存在",而证伪标准是"不存在任何替代"——
        两者的证明负担完全不对称。

        这不是"证伪条件难满足"——许多 valid 的证伪条件也很难满足但终究可满足。
        这是"证伪条件的逻辑使触发永远不可能"。在所有可能世界(无论实际经验
        证据如何),falsifiability (c) 都不会被触发——不是因为它正确,而是因为
        它的门槛在原则上无限高。

        综合:红旗命中——falsifiability (c) 是 anti-talisman 护身符。修复路径:
        将其替换为具体的前定第三变量列表,每个变量的控制方式、判定标准在见
        数据前注册。见 required_fixes #1。

    reality_anchor_fact_check:
      hit: false
      detail: |
        引用文献的核心事实检查:

        (1)【Kruglanski et al. (2002)——目标系统理论,发表属实】
        "A theory of goal systems" 发表于 Advances in Experimental Social
        Psychology (2002)。该理论提出:目标之间存在促进与抑制的连接,激活一个
        目标会自动抑制竞争目标(目标屏蔽,goal shielding)。这是目标系统理论的
        核心主张,与桥接砖的标准冲突→干扰机制一致。引用准确。

        (2)【Shah & Kruglanski (2002)——JPSP,发表属实】
        Shah & Kruglanski 的实验证明:当被试被启动一个焦点目标后,对竞争目标
        的反应时显著增加,且此效应在具有高"认知闭合需要"(need for cognitive
        closure)的个体中更明显。此证据支持"目标干扰存在"这一基础主张,但不直接
        测试桥接砖的特定预测(评判标准冲突→并行<序列)。引用准确但不完全对口。

        (3)【Orehek, Vazeou-Nieuwenhuis (2015)——Motivation Science,发表属实】
        Orehek & Vazeou-Nieuwenhuis 在 Motivation Science 上量化了多目标切换的
        认知成本。但 Motivation Science 是 2015 年创刊的较新期刊,该具体论文
        的被引和复现情况需要后续跟踪。引用在文献存在性上可信。

        (4)【Locke & Latham (2002)——American Psychologist,发表属实】
        "Building a practically useful theory of goal setting and task motivation"
        是目标设置理论 35 年研究的综述。核心发现:具体且有挑战性的目标比模糊目标
        带来更高绩效(goal specificity effect);单一目标优于多目标。与桥接砖的
        "多任务降低效率"方向一致,但 Locke & Latham 的机制是注意力的方向性和
        努力的持续性(motivational mechanism),而非桥接砖的切换成本+侵入性激活
        (cognitive mechanism)。引用准确但机制不同。

        (5)【Ordonez et al. (2009)——AMR,发表属实】
        "Goals Gone Wild: The Systematic Side Effects of Over-Prescribing Goal
        Setting" 发表于 Academy of Management Perspectives (2009,非 AMR——
        AMR 是 Academy of Management Review,不同期刊)。该综述确实指出了多目标
        冲突的负面效应。引用的期刊名称可能有小误(AMR vs AMP),但论文存在且主题
        对口。

        (6)【DeShon & Gillespie (2005)——发表属实】
        DeShon & Gillespie (2005) 的多目标绩效评估研究。引用在文献存在性上可信,
        但缺乏具体论文标题或期刊名,可验证性较低。

        整体评估:引用的文献在存在性和大致主题上可信,无明显的造假迹象。但存在
        两处小瑕疵:(i) Ordonez et al. 发表的期刊可能是 AMP 而非 AMR;
        (ii)部分引用(DeShon & Gillespie 2005)缺乏完整的发表信息,降低了外部
        核实者定位原文的便利性。这些不影响引用的实质可信度。

    definition_vs_prediction:
      hit: false
      detail: |
        "评判标准冲突导致并行效率低于序列"是可证伪的经验预测。在逻辑上自洽的
        可能世界中:
        (i)评判标准冲突可能迫使 agent 发展出更高效的整合策略(类比:并行计算
        架构),使并行效率高于序列;
        (ii)侵入性目标激活可能提供认知唤醒(cognitive arousal)的正面效应,
        抵消甚至反转切换成本;
        (iii)评判标准冲突可能触发元认知监控(metacognitive monitoring)的增强,
        使 agent 更准确地分配注意资源,反而提升并行效率。

        这些替代可能性均不违反任何 L1 概念的逻辑约束。命题是经验选择而非定义。
        但需注意:当前的测量操作化(见红旗 3)使预测的"可观测伪范围"过窄,
        这是测量有效性问题而非命题的定义性问题。

    enumeration_exhaustiveness:
      hit: false
      detail: |
        桥接砖未声称对多任务干扰机制做穷尽枚举。它指定了两种机制(切换成本+
        侵入性激活),但未声称这是仅有的两种。statement 中"来自两个独立过程"
        可被解读为"这两者被识别为独立过程"而非"只有这两个过程"。不触发
        红旗 9 的 required 标准。但建议将"来自两个独立过程"改为"至少来自
        两个可独立识别的过程",避免被误读为穷尽声称。

    primary_suspect_accuracy:
      hit: false
      detail: |
        L2 桥接砖无 formal primary_suspect 字段(L3 要求),按红旗精神审查最弱腿:

        外部识别的最致命软肋(砖未自认):
        (i)【falsifiability (c) 的护身符结构——最致命】任何持有方法论训练
        的审查者都会一眼看出"任何未控制的第三个变量可完全解释"是不可触发的
        证伪门槛。见 required_fixes #1。
        (ii)【评判标准冲突与资源竞争的不可分离——第二致命】领域边界的可重划
        性掏空了命题的经验风险。见 required_fixes #3。
        (iii)【bridges_to 太薄——中等脆弱】三个泛型概念(agent/goal/resource)
        未为桥接砖的具体机制(切换成本/侵入性激活)提供推导起点。机制信用完全
        来自外部文献而非体系内部。见 should_fixes。
        (iv)【反向失败模式缺失——中等脆弱】未注册"评判标准冲突在某些条件下
        可能促进而非抑制产出"的可能性。见 should_fixes。

    caliber_registration:
      hit: true
      detail: |
        本红旗命中——关键测量口径未预注册。

        (1)【"资源竞争微弱"的操作化未注册——REQUIRED】
        桥接砖声称其效应在"资源竞争微弱"的条件下成立,但未提供"微弱"的任何
        操作化标准。是"两任务使用不同感觉通道"?"两任务的刺激呈现时间不重叠"?
        "独立任务(如 n-back)测得的剩余认知容量 > 某个阈值"?
        在缺乏前定操作化的情况下,"资源竞争是强是弱"的判定只能事后根据绩效
        结果进行——这使领域边界具有了见结果后可重划的弹性。按 L4-009 判例
        精神:若在反例出现后桥接砖试图调整"资源竞争微弱"的操作化来拯救命题,
        此调整一律按不利于命题的方向裁决。

        (2)【"评判标准冲突强烈"的操作化未注册——should】
        桥接砖给出范式案例(一个要求速度一个要求准确),但"强烈"的程度未定义。
        如果两个任务的速度和准确权重分别是 90/10 和 10/90,这算"强烈冲突"吗?
        如果是 70/30 和 30/70 呢?冲突的"强度"需要一个可注册的度量——如
        两任务指令中速度与准确权重的夹角(余弦距离)。

        (3)【"总产出或效率"的操作化未注册——should】
        Falsifiability (a) 的因变量是"总产出或效率",但未定义如何计算。
        "总产出"是两个任务完成的单元数之和?"效率"是单位时间的产出?如何
        归一化两个不同性质的任务(速度 vs 准确)到一个可比较的"总产出"?
        速度任务的成功标准是反应时,准确任务的成功标准是错误率——这两者的
        单位不同,需要一个预注册的归一化方法(如将每个任务的表现转化为
        z-score 后求和)。

    data_source_common_root:
      hit: false
      detail: |
        桥接砖引用的全部经验证据来自认知心理学的学术文献(目标系统理论/
        目标设置理论/任务切换实验),不涉及宏观经济统计指标(如 WB/IMF/CNBS
        的 GDP 数据)。不触发 data_source_origin 折扣。

    api_pretending_independence:
      hit: false
      detail: |
        桥接砖当前没有 cross_verification 节,故不存在 IEA 投票。未来若补上
        cross_verification,需注意:两个引用源(目标系统理论+组织行为)均来自
        认知/组织心理学的研究传统——它们共享核心构念、方法论范式和研究纲领。
        "两个来源都同意"可能反映的是学科内共识,而非跨学科独立验证。API 可及
        性冒充独立性不适用,但学科内多源一致需要区别于跨学科独立验证。

    reverse_failure_mode:
      hit: true
      detail: |
        本红旗命中——桥接砖仅注册了证伪条件,未注册反向失败模式。

        桥接砖的核心方向性主张:"评判标准冲突→并行效率低于序列"。反向失败
        模式——评判标准冲突在某些条件下反而促进产出——在逻辑上和经验上均可能:

        (1)【创造性约束的反向模式】
        在某些创造性领域,形式约束(准确性要求)与表达自由(创造性要求)的冲突
        可能反而激发更高质量的产出。经典案例:十四行诗的严格韵律格式(形式约束)
        并未抑制莎士比亚的创造性表达——约束本身成为创造力的催化剂。类似地,
        jazz 即兴中的和声约束+旋律自由并非零和博弈。在设计中,"约束驱动创新"
        (constraint-driven innovation)是一个被实践反复确认的原则。

        在这些案例中,评判标准的冲突(准确性 vs 创造性)并未降低总产出——
        它可能提升了产出的质量维度(规范性为创造性提供了结构支撑)。

        (2)【元认知增强的反向模式】
        当 agent 意识到评判标准之间的冲突时,认知监控(metacognitive monitoring)
        可能被触发——agent 更仔细地分配注意资源、更精确地在两套标准间切换。
        在标准冲突极其明显时(如一个任务必须 100% 准确,另一个只计时不计准确),
        agent 的元认知策略调整可能使并行效率达到甚至超过序列执行。

        (3)【整合涌现的反向模式】
        在长期实践中,agent 可能发展出将两套标准整合为一套新的、更高效的评判
        框架的能力(如棋手将"局面评估"和"战术计算"整合为统一的决策直觉)。
        当整合发生时,并行处理不再是"在两个标准间切换"而是在"一个更高的综合
        标准下运作"——并行效率可能超越序列。

        这些反向失败模式与桥接砖的正向预测不是互斥的(两者可共存,取决于调节
        变量),但它们揭示了桥接砖一个重要的未注册射程边界:桥接砖的机制可能
        主要适用于"agent 尚未发展出整合策略的初期阶段",而在"agent 已经内化了
        两套标准的协调机制的后期阶段"失效甚至反转。

        红旗触发级别:should(非 required)。理由:反向模式与正向预测方向不同但
        不互斥——约束促进创造力与标准冲突降低效率可能同时为真,取决于任务
        领域(创造性 vs 执行性)和 agent 的专业水平。但桥接砖应诚实注册这些
        反向模式的存在和调节条件,以划定命题的有效射程。

    bootstrap_limitation:
      hit: false
      detail: |
        Bootstrap 限定(新技术介导社会形态的冷启动 vs 稳态阶段的区分)针对的是
        涉及新技术的命题。本桥接砖涉及的是通用认知机制,不依赖特定技术阶段。
        但有一个弱相关的关切:桥接砖未区分"agent 首次面对标准冲突"vs"agent
        已有该特定冲突的练习经验"这两种状态。大量任务切换文献显示:练习可
        大幅降低切换成本,甚至在某些任务组合中达成近零双任务成本(perfect
        time-sharing)。如果桥接砖声称的是"标准冲突结构性导致干扰",则练习
        消除成本的事实对命题构成压力;如果桥接砖实际描述的是"未练习状态下
        的效应",则应在 statement 中显式标注此限定。

    verification_object_existence:
      hit: true
      detail: |
        本红旗命中——桥接砖的理想检验对象在实践可及性上存在显著缺口。

        桥接砖声称的 clean 检验条件:"资源竞争微弱(两个纯认知任务,无感官冲突)
        但评判标准冲突强烈(一个要求速度,一个要求准确)"。要 clean 地满足此条件,
        需要:(i)两个任务的内容足够相似(排除内容差异的混淆);(ii)两个任务共享
        同一评判维度(如都在速度-准确连续体上,只是要求的相对权重不同);
        (iii)两个任务没有感官通道冲突(如一个视觉一个听觉,或刺激呈现时间错开);
        (iv)两个任务不竞争反应输出(如两个任务都要求手动按键→资源竞争)。

        条件(i)-(iv)的同时满足在实验设计中是一个非平凡的约束。特别是条件(i)
        和(ii)之间存在张力:任务内容越相似,内容间的干扰越可能被误归为评判标准
        冲突;任务内容越不同,内容差异本身的切换成本越大,淹没了评判标准冲突的
        信号。

        这使桥接砖的"理想检验"在实验上高度困难——不是逻辑上不可能,但设计一个
        干净分离"评判标准冲突效应"和"一般任务切换效应"的实验需要非常精细的
        控制条件。桥接砖应诚实标注:当前经验证据支持的主要是"存在评判标准冲突
        相关的切换成本"(基于任务切换文献和目标系统理论),而非"评判标准冲突
        效应已被从一般任务切换效应中独立分解出来"。

        此标注应为 should 级:不影响可证伪性(证伪条件在概念上仍清晰),但诚实
        限制了命题在当前实验证据生态下的实证置信度上限。

  iea_independence_check:
    cross_verification_present: false
    note: |
      桥接砖 YAML 当前不含 cross_verification 节。无 IEA 分数。
      L2 verified 门槛为 IEA >= 1.8, weakly_verified 下限为 IEA >= 1.2。
      必须补上 cross_verification 才能进入任一已验证状态。

      桥接砖引用了两个学科来源:
      - 目标系统理论与认知实验(Kruglanski et al. 2002; Shah & Kruglanski 2002;
      Orehek et al. 2015)
      - 组织行为中的多目标绩效证据(Locke & Latham 2002; Ordonez et al. 2009;
      DeShon & Gillespie 2005)

      初步 IEA 结构建议:
      - 锚源: goal_systems_theory (weight 1.0)——Kruglanski 的目标系统理论
      最直接地提供了目标间抑制/屏蔽机制的实验室证据
      - 独立票: organizational_behavior (weight × 独立系数)——Locke & Latham
      的目标设置理论从组织现场角度提供了多目标冲突降低绩效的田野证据

      两个源的独立性评估:
      (i) goal_systems_theory 和 organizational_behavior 均来自心理学的认知/
      动机研究传统。两者共享核心构念(目标/动机/绩效)和方法论(实验室实验+
      问卷调查)。按 independence-model.yaml,两者不直接对应任何 source_pair,
      取 default_independence = 0.6。但需注意:0.6 可能偏高——两个源是
      同一学科内的两个分支,而非跨学科独立验证。建议在 cross_verification
      中诚实下调至 0.4-0.5。
      (ii)按 independence-model.yaml 的 instrument_correlation discount_rule:
      若 cross_verification 由单一 LLM 执行,必须披露仪器有效独立性低于学科
      独立性上限。本桥接砖将认知心理学的实验室发现外推至一般 agent 行为
      (不限人类个体),属于"新颖/争议命题",按 mitigation 条款,仪器折扣
      应视为承重红旗(红色警告而非黄色注意)。

      IEA 补全为 required_fix #2。

    instrument_honesty:
      disclosed: false
      assessment: |
        桥接砖当前无 instrument_disclosure 字段——因为尚无 cross_verification。
        未来补全 IEA 时必须包含 instrument_disclosure,引用 META-REVIEW-001 的
        instrument_correlation discount_rule。

    no_data_source_common_root:
      applicable: true
      detail: |
        不触发 data_source_origin 折扣——引用的全部是学术文献而非宏观经济
        统计数据。两源(目标系统理论实验室实验+组织行为田野研究)在测量链
        层面独立分叉。

  counterexample_hunt:
    methodology: |
      四个反例方向:(1)评判标准冲突强烈但资源竞争弱→并行>=序列(挑战核心
      方向性预测);(2)评判标准兼容→并行<序列(挑战"标准冲突是必要条件"的
      边界);(3)侵入性目标激活与效能下降无神经关联(挑战机制(b));
      (4)创造性领域中标准冲突提升而非抑制产出(挑战命题的射程)。
      以历史案例推理+认知心理学文献分析为主。
    cases:
    - direction: "创造性约束反转:形式规范×表达自由的冲突可能提升产出"
      description: |
        在多个创造性领域中,严格的形式约束(准确性要求)与表达自由(创造性要求)
        之间的评判标准冲突不仅未降低产出,反而被视为创造力的催化剂:
        - 十四行诗(sonnet):14 行、ABAB CDCD EFEF GG 的韵律格式、每行 10 音节
        的抑扬格——极其苛刻的形式约束。然而这种约束并未抑制莎士比亚、彼特拉克
        的创造性表达。文学批评中的共识是:形式约束通过限制选项空间,迫使诗人
        在有限空间中寻找更深层的表达——约束成为创造力的"脚手架"而非"牢笼"。
        - Jazz 即兴:和声进行(准确性——必须落在正确的和弦音上)+旋律即兴
        (创造性——须在给定的和声框架内创造新旋律)。两个"目标"的评判标准
        存在张力(准确性限制可能性空间 vs 创造性要求探索可能性空间),但爵士
        乐手在即兴中不仅不觉得约束有害,反而认为约束使即兴成为可能——"没有
        和声框架就没有即兴,只有噪音"。
        - 建筑设计:建筑规范(安全性/结构可行性——准确性约束)+美学表达
        (创造性)。许多标志性建筑(如悉尼歌剧院)是在极端约束下诞生的——约束
        迫使建筑师在受限空间中寻找突破性解决方案。
      counter_impact: "揭出射程缺口——非净杀"
      analysis: |
        不净杀桥接砖,因为:
        (i)桥接砖的范式案例是"速度 vs 准确"的执行性任务(execution task),
        而非创造性任务(creative task)。两类任务的认知过程有本质差异:执行性
        任务的目标是"按照预定标准完成",约束是干扰;创造性任务的目标是
        "在约束空间中探索可能性",约束是生成器。桥接砖可通过显式注册这一
        区分来消化此反例方向。
        (ii)创造性领域的"标准冲突促进产出"不代表评判标准冲突在一般执行性
        任务中也促进产出。桥接砖的预测仍然可以在执行性任务域内成立。

        但此案例方向揭示了一处关键的射程未注册:桥接砖的 statement 未区分
        "执行性(optimization)任务"与"探索性(exploration)任务"。在探索性
        任务中,约束可能通过减少搜索空间来提升效率——这与桥接砖的"标准冲突
        →效率降低"方向相反。桥接砖应注册此射程边界:效应的方向可能取决于
        任务类型——在执行性任务中为负(标准冲突降低效率),在探索性/创造性
        任务中可能为正或中性。

    - direction: "元认知通道:意识到的标准冲突可触发补偿策略"
      description: |
        当 agent 被显式告知"任务 A 要求速度,任务 B 要求准确"时,agent 可能
        发展出主动的认知管理策略——如在任务 A 前"切换为速度模式",在任务 B 前
        "切换为准度模式"。这种主动的、有意识的准备式切换(proactive switching)
        的成本远低于反应式切换(reactive switching——在任务中间被动调整标准)。

        Rogers & Monsell (1995, JEP:General) 的任务切换经典实验发现:当被试
        有充足的准备时间(>600ms)提前知道下一个任务是什么时,切换成本大幅下降
        (residual switch cost)。如果评判标准冲突是 agent 已知的信息(而非意外),
        agent 可以预先加载正确的评判框架——这时的"并行"执行实际上已经包含了
        主动的顺序式准备,模糊了"并行"与"序列"的边界。
      counter_impact: "揭出调节变量缺口——非净杀"
      analysis: |
        不净杀:桥接砖可主张其"切换成本"机制已涵盖准备不充分的情况,而充分
        准备可降低但不完全消除切换成本(residual switch cost 在 Rogers &
        Monsell 中仍然显著 > 0)。但此案例方向揭示:桥接砖未注册"准备时间/
        切换可预测性"作为调节切换成本幅度的关键变量。效应的大小(甚至是否
        可观测)强烈依赖于 agent 是否提前知道标准冲突、是否有时间做认知准备。

    - direction: "双任务训练的完美时间共享:Spelke, Hirst & Neisser (1976)"
      description: |
        Spelke, Hirst & Neisser (1976, JEP:General) 的经典实验:两名大学生
        经过 85 小时的训练后,能够在阅读短篇故事的同时听写单词,两个任务的表现
        均不差于单任务条件——达成了"完美时间共享"(perfect time-sharing)。
        这两个任务显然有不同的评判标准(阅读的评判是理解,听写的评判是拼写
        准确),但训练消除了所有可测量的双任务成本。

        如果桥接砖声称的是"评判标准冲突结构性导致干扰",那么训练不应消除
        干扰——结构性的东西不会被练习改变。如果训练消除了干扰,那么干扰的
        来源不是"标准冲突"本身,而是"agent 对标准间协调的未自动化"。
      counter_impact: "揭出机制归因过度——非净杀"
      analysis: |
        不净杀:桥接砖可从两个角度消化此案例:
        (i)机制(a)——切换成本随练习降低。如果"评判框架切换"本身是可自动化
        的认知技能(如熟练的双语者不费力地在两种语言间切换),那么练习完全消除
        成本与机制(a)一致——"切换成本存在,但可经练习消除"。
        (ii)Spelke et al. 的实验条件可能不满足"评判标准冲突强烈"。阅读和
        听写虽然评判标准不同,但两者不需要在"同一维度上相互排斥"——你可以在
        保持对故事的充分理解的同时正确拼写单词,两者不互为 tradeoff。

        但此案例揭示了一处需要澄清的关键区分:桥接砖声称的"标准冲突"是由于
        标准本身的逻辑矛盾(速度快必然牺牲准确),还是由于 agent 的认知架构
        不支持同时维护两套标准?如果是前者,练习不应消除干扰(逻辑矛盾不因
        练习而消失);如果是后者,那么命题应从"结构性的"改为"agent 认知架构
        在当前训练水平下的"——这是一个重要的归因限定。

    - direction: "单一任务内的速度-准确权衡:并行 vs 序列的范畴混淆"
      description: |
        速度-准确权衡(speed-accuracy tradeoff, SAT)是认知心理学中最稳健的
        发现之一:在几乎任何认知任务中,要求更快反应必然增加错误率,要求更高
        准确率必然增加反应时。但 SAT 的经典研究(Pachella 1974; Wickelgren
        1977)是在单一任务内发现的——同一个任务有两套评价标准,而非两个独立
        任务各有不同标准。

        如果桥接砖的机制成立,那么即使在单一任务内,同时持有"要快"和"要准"
        两个目标也应导致干扰——但 SAT 的实验并不支持"并行持有两个标准导致
        比序列持有更差"。实验设计通常是:被试在某个 block 内被给予明确的
        速度或准确强调,而非同时被要求"既快又准"。当被试被同时要求"既快又准"
        时,他们的表现通常落在速度-准确函数曲线的某个中间点上——不是比分别
        强调更差,而是自然地在两个标准间折中。
      counter_impact: "揭出概念边界未澄清——非净杀"
      analysis: |
        此案例不净杀桥接砖,但揭示了一个概念混淆:桥接砖说的"多任务"是指
        两个独立的任务(如 task A 要求速度+task B 要求准确)还是指一个任务
        上的两个评价维度(如做 math 既要比上次快又要比上次准)?

        桥接砖的范式案例暗示前者(两个独立任务),但 statement 的语言("同时
        持有多个竞争性目标,且这些目标共享同一评判标准")在概念上不排除后者
        (同一任务的多重标准)。这个模糊性影响命题的可检验性:检验两个独立
        任务的并行 vs 序列(桥接砖暗示的)与检验单一任务的速度-准确折中
        (经典 SAT 范式)是完全不同的实验设计。桥接砖应澄清"目标"的操作
        定义是指独立的任务目标(不同任务)还是同一个任务的不同评价维度。

    overall_counterexample_verdict: |
      四个方向上未获净杀反例:
      (1)创造性约束反转:揭示执行性 vs 探索性任务的射程未注册;
      (2)元认知准备降低切换成本:揭示准备时间作为关键调节变量未注册;
      (3)完美时间共享:揭示练习效应的归因未澄清(结构性 vs 可消除);
      (4)单任务 SAT vs 多任务标准冲突:揭示"目标"的操作定义模糊(独立
      任务 vs 同一任务的多维度)。

      未出现满足以下全部条件的净杀案例:(i)属于执行性任务域(排除创造性
      约束的混淆);(ii)评判标准冲突是 agent 已知且无法预先准备的(排除
      元认知补偿);(iii)agent 不拥有针对该特定任务组合的预先训练(排除
      完美时间共享);(iv)两个任务确实可由同一 agent 以序列方式执行
      (排除实时性要求使序列不可能的约束);(v)实验在因子设计中分离了标准
      冲突效应和一般资源竞争效应;(vi)并行执行的标准化总产出显著高于
      序列执行。

      反例猎捕的主要贡献不是推翻命题,而是:(1)精确识别了桥接砖的射程
      未注册缺口(执行性 vs 探索性/准备时间的调节作用/练习与自动化的
      归因/单任务多维度 vs 多任务单维度的概念澄清);(2)确认了 falsifiability
      (c)的护身符结构;(3)确认了评判标准冲突与资源竞争的不可分离性;
      (4)提出了反向失败模式(创造性约束促进产出)的注册需求。

  non_recurrence:
    - check: DED-004
      status: pass
      detail: |
        DED-004 的死因是不可证伪循环(命题的核心主张无法被任何经验观测拒绝)。
        本桥接砖的证伪条件在概念上清晰——逻辑上可能观测到"评判标准冲突强烈
        但并行效率不低于序列"的实验结果。问题的根不在"不可证伪"而在
        "falsifiability (c) 提供了无限逃逸口"+"领域边界可事后重划"。
        两者有本质区别:DED-004 的命题形式本身是免疫的,本桥接砖的命题形式
        是可错的——但一条证伪路径是护身符,且领域边界的操作化不足以锁定
        命题的经验风险。可通过替换 falsifiability (c) + 预注册领域边界的
        操作化来修复。

    - check: DED-007
      status: pass
      detail: |
        DED-007 的死因是测量轴焊死(分母偷用实际结果——用"实际获授者"定义
        授信对象,闭环)。本桥接砖不存在此级别的结构死罪——自变量(评判标准
        冲突)不由因变量(并行 vs 序列效率)定义,两者在概念上是独立的。
        问题不在变量定义中存在闭环,而在:(a)"评判标准冲突"和"资源竞争"
        两个维度不能在见结果前被独立操作化,使领域边界的重划在见结果后有
        弹性(红旗 3);(b) falsifiability (c) 的护身符结构(红旗 6)。
        这些缺陷的级别和性质均不同于 DED-007——非结构死罪,可修复。

  required_fixes:
    - id: REQ-BR-L2-045-A
      severity: required
      what: |
        删除或重写 falsifiability (c),消除"任何未控制的第三变量"护身符。

        方案 A(推荐——删除+替换为具体列表):
        删除现 falsifiability (c),替换为:
        "若在控制了以下前定变量后,评判标准冲突对并行vs序列效率差异的效应量
        不再显著(meta-analytic mean effect size 的 95% CI 包含零或负值):
        (i)工作记忆容量(以预注册的标准测量工具如 OSPAN 或 n-back 测量);
        (ii)任务切换的一般能力(以预注册的任务切换范式独立测量);
        (iii)动机水平(以预注册的自评量表测量)。上述控制变量的操作化定义
        和判定标准须在见数据前注册。"

        方案 B:
        将 falsifiability (c) 从证伪条件降格为 honest caveat:
        "诚实地:任何实验都无法穷尽所有可能的第三变量。因此,本命题的经验
        支持始终建立在'当前已知的替代解释已被控制'的基础上,而非'不存在
        任何可替代解释'的绝对基础上。随着新的替代解释在文献中被提出,
        本命题的置信度应被更新。"

        推荐方案 A——方案 B 只是诚实标注,不能替代可操作的证伪路径。
      rationale: |
        当前的 falsifiability (c) 在逻辑上永远不可触发("任何"+"完全解释"
        的组合使攻击者永远达不到举证标准)。这是 anti-talisman 护身符的
        经典模式,与 DED-004 的不可证伪循环同类(都使命题免于经验风险),
        但修复路径明确且不推翻命题核心。

    - id: REQ-BR-L2-045-B
      severity: required
      what: |
        补充 cross_verification 节——进行正式的 IEA 独立来源加权投票。

        结构要求:
        (i)列出各来源的 vote(agree/disagree/partial, with rationale)。
        (ii)应用 independence-model.yaml 的 source_pairs 独立系数计算 IEA。
        注意:goal_systems_theory 和 organizational_behavior 均属认知/组织
        心理学,若 source_pairs 无直接对应条目,取 default_independence=0.6,
        但应在 cross_verification 中诚实讨论是否应下调(同一学科内两个分支
        的独立性可能 <0.6)。
        (iii)包含 instrument_disclosure——引用 META-REVIEW-001 的
        instrument_correlation discount_rule,诚实标注"本次投票由单一
        LLM 执行,有效独立性低于报告的学科独立性上限"。
        (iv)分维度标注各源的投票内容:goal_systems_theory 投票给"目标间
        抑制/屏蔽机制的存在"(实验室机制证据);organizational_behavior
        投票给"多目标降低个体绩效"(田野预测确认)。区分"投票给机制存在"
        和"投票给预测成立的田野证据"。
        (v)计算有效 IEA,与 verified 门槛(1.8)和 weakly_verified 下限(1.2)
        对照。

        若 IEA < 1.2,桥接砖在当前证据生态下不应进入任何已验证状态。
      rationale: |
        L2 桥接砖的验证必须通过 IEA 加权投票。当前无 cross_verification,
        桥接砖无法进入任何已验证状态——这是流程性 required 缺陷。

    - id: REQ-BR-L2-045-C
      severity: required
      what: |
        预注册"资源竞争微弱"和"评判标准冲突强烈"的操作化判据。

        具体修复:
        (i)在见数据前注册"资源竞争微弱"的操作化——至少提供其中一种:
        - 感官通道判据:两任务使用不同感觉通道(如一个视觉一个听觉),且刺激
        呈现时间不重叠(如交替呈现而非同时呈现);
        - 剩余容量判据:在与实验任务不同的独立任务(如听觉 n-back)中测得
        的剩余认知容量不低于单任务基线 80%;
        - 任务不相似性判据:两任务在 Anderson (1990) 或等价的认知任务分类
        法中属于不同的"基本认知操作"类别。

        (ii)注册"评判标准冲突强烈"的操作化——如:
        - 两任务指令中速度与准确权重的余弦距离 > 预注册阈值(如 cos θ < 0,
        即两指令在速度-准确方向上有相反强调);
        - 或在预实验(pilot)中确认:在单任务条件下,A 任务的指令使速度>准确
        的权重差异与 B 任务的对应差异方向相反且绝对值之差 > 预注册阈值。

        (iii)在 statement 中诚实标注:"当前版本未提供将'评价标准冲突'效应
        从'一般资源竞争'效应中完全独立分解的操作化方案。对本命题的最 clean
        检验——因子设计同时操纵资源竞争(高/低)和标准冲突(高/低)——是未来
        实验工作的方向。在目前证据生态下,本命题在'标准冲突+资源竞争'的联合
        贡献层面成立。"
      rationale: |
        当前"资源竞争微弱但评判标准冲突强烈"的领域边界缺乏独立于结果的操作化
        手段,使桥接砖的适用范围在见反例后可重划。这是经验风险被掏空的测量
        轴缺陷——非命题本身不可证伪(命题在结构上是可错的),而是当前操作化
        未能给可错性提供真实通道。修复路径明确:预注册操作化判据+诚实标注
        当前不可分离性。

  should_fixes:
    - id: SHOULD-BR-L2-045-D
      severity: should
      what: |
        注册反向失败模式:评判标准冲突在某些条件下可能促进而非抑制产出。

        在 statement 或 falsifiability 中新增:
        "反向失败模式:在探索性/创造性任务域中(如诗歌创作、建筑方案设计、
        即兴演奏),形式约束与表达自由之间的评判标准张力可作为创造力的催化剂
        而非抑制因素——此时约束冲突可能提升产出质量而非降低效率。本命题的
        正向预测(标准冲突→效率降低)主要适用于执行性/优化性任务域,不必然
        适用于探索性/创造性任务域。"

    - id: SHOULD-BR-L2-045-E
      severity: should
      what: |
        区分"未练习状态"与"已自动化状态"下的效应幅度。

        桥接砖应标注:大量任务切换文献显示切换成本随练习递减,且在特定任务
        组合中可达近零成本(perfect time-sharing)。本桥接砖描述的效应幅度
        适用于"agent 首次或早期面对该特定标准冲突组合"的阶段;随着练习,
        效应幅度可能降低。命题结构性的部分(标准冲突必然引入某种切换成本)
        与可消除的部分(切换成本的大小可通过自动化降低)应在 statement 中
        区分。

    - id: SHOULD-BR-L2-045-F
      severity: should
      what: |
        澄清"目标"的操作定义:是独立任务还是同一任务的多个评价维度。

        桥接砖的范式案例(一个要求速度一个要求准确)暗示两个独立任务,但
        速度-准确权衡的经典文献是在单一任务内操作的。桥接砖应在 statement
        中澄清:本命题的"多目标"指的是两个独立任务各自携带不同的评价标准
        (task A 指令强调速度,task B 指令强调准确),而非同一任务携带两个
        评价维度(对 task A 同时要求又快又准)。两者的认知机制可能不同
        (inter-task vs intra-task criterion conflict),且前者的并行-序列
        比较在实验上更易操作化。

    - id: SHOULD-BR-L2-045-G
      severity: should
      what: |
        考虑扩充 bridges_to,加强体系内推导链。

        当前 bridges_to 仅含三个泛型概念(agent/goal/resource)。建议考虑:
        - bridge 到 CONCEPT-information:信息处理需要物理载体→评判框架作为一种
        "信息处理模板"的切换=载体重配置→切换成本可溯源到信息处理的物理约束
        - bridge 到 AXIOM-002(信息熵增):维持活跃目标表征需要能量投入→侵入性
        目标激活的本质是未完成目标表征需要额外维护能量→干扰效应的来源是
        维护预算被多目标瓜分
        这两个连接可为桥接砖的机制提供体系内部的推导锚点,减少对外部认知
        心理学文献的独家依赖。

    - id: SHOULD-BR-L2-045-H
      severity: should
      what: |
        注册"准备时间/切换可预测性"作为效应大小的调节变量。

        Rogers & Monsell (1995) 的经典发现:当 agent 有充足准备时间(>600ms)
        且提前知道下一个任务的评判标准时,切换成本大幅下降。桥接砖应在
        statement 中注册:效应的幅度依赖于 agent 是否预知评判标准切换的
        时机和方向——可预测的、有准备时间的切换成本低于不可预测的、无准备
        时间的切换成本。

round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（切换成本 + 侵入性激活）有认知心理学文献支撑，不算捏造，但存在多个 required 级缺陷阻止 verified：

    (1) **机制(a)与(b)未独立可分**——声明说"两个独立过程"，但操作化上两者必然共变（切换必然涉及侵入性激活），证伪条件(b)要求"切换成本无法分解为独立因素"——但什么叫"分解为独立因素"？没定义。这是 vague killer。

    (2) **证伪条件(c)的不对称焊点**——所谓"前定第三变量"列表（工作记忆容量、任务优先级、语义关联性）是作者的"可能混淆因素清单"，但完全没有说明为什么这三个就是完备集。如果存在第四个混淆变量（比如 arousal/stress、动机强度、练习效应），整组证伪逻辑就漏。**这是 brick 没穷尽枚举的软肋**——它不是 DED-008 那种物种枚举问题，而是混淆变量集未闭合。

    (3) **核心机制的因果方向存在反例猎捕未覆盖的失败模式**——当评判标准冲突严重到一定程度（如 0% 速度容忍 vs 100% 准确性要求），被试可能采取"完全放弃一个目标"的策略，此时并行 = 序列（因为实质上退化为单任务），干扰效应消失。这违反"严重冲突下并行 < 序列"的隐含预测，但声明的限制条款没处理这种边界。

    (4) **限制条款自相矛盾**——声明说"不适用于目标间评判标准兼容的场景"，但又说"也不声称所有多任务都必然低于序列执行"——前者是排除钩子，后者几乎取消了普适性主张。射程被砍到"冲突型多任务"狭窄区间，但操作上"冲突"程度从 0% 到 100% 连续，所谓"冲突"何时触发效应是连续档而非二分（红旗 #5）。

    (5) **跨源独立性不足已被作者自认**（IEA = 0.35 < 1.2 阈值），但作者没给出可执行的补充路径，只是"建议"补充神经科学/计算建模证据——这条桥目前 empirical basis 太薄。

    挡 verified 的核心：(2) 混淆变量集未闭合 + (1) 两过程不可独立分解 + (3) 边界失败模式未注册。这三条至少需要修复才能升级。
  red_flags: |
    1. brick=conclusion：**未命中但临界**——切换成本 + 侵入性激活确实是认知心理学的独立构念，不是从 BR-L2-001（有限理性）或 BR-L2-027（注意力稀缺）平凡推出。**但**两者的边界在声明里没讲清，机制(a)和(b)是否真的"独立"是个悬而未决的假设，不是事实。

    2. 逐格判空：**命中部分**——核心预测"并行 < 序列"在"评判标准冲突 + 资源竞争弱"条件下是经验主张，不是同义反复。但"显著低于"的"显著"未定义（p < .05？还是 effect size > X？），操作化缺口。

    3. 测量轴正交：**未命中**——自变量（评判标准冲突程度）与因变量（并行 vs 序列产出差）是异源测量，无焊点。

    4. 射程/排除钩子独立于结果：**命中弱**——排除条款"目标兼容时不适用"和"资源竞争主导时不适用"是事前可测的渠道（评判标准的兼容性评分可独立于产出测量），不像 DED-005 那种事后开脱。但"资源竞争占主导"的判据未给——什么叫"占主导"？脑力负荷 60% 阈值？工作记忆占用率？

    5. 分类判据档位匹配：**命中**——"评判标准冲突"是连续变量，声明用了"冲突严重 vs 不冲突"的二分框架，这是红旗 #5 的标准违规。需要分级：低/中/高冲突，或连续度量。

    6. anti-talisman 真兑现：**命中部分**——锚"评判标准冲突被独立操作化（任务A唯一绩效标准为反应速度，任务B唯一绩效标准为准确性）"是事前可测的实验设计，不是 talisman。但"两个任务使用不同感觉通道和效应器"这个约束（视觉-手动 + 听觉-言语）的资源竞争测量没明确——是事后脑力负荷测量还是事前通道占用表？

    7. 现实锚事实核查：**命中**——声称引用 Kruglanski (2002)、Shah & Kruglanski (2002)、Orehek & Vazeou-Nieuwenhuis (2015)、Locke & Latham (2002)、Ordóñez et al. (2009)、DeShon & Gillespie (2005)。Shah & Kruglanski (2002) 确实在 JPSP 发表；Kruglanski et al. (2002) 的目标系统理论在 Psychological Review 有过框架论文——但具体引用细节（年份、期刊）无法在审查时核实，存在引用漂移风险。不算事实错，但标 should。

    8. 条件是下定义还是做预测：**命中弱**——"评判标准冲突"条件是可证伪的预测条件，不是定义。但"显著低于序列执行"的"显著"缺操作化。

    9. 枚举穷尽：**命中**——证伪条件(c)列了三个混淆变量，但声称这是完备集（"每个变量需在实验前定义操作化"）。混淆变量集的完备性从未被证明——第四个混淆变量（练习效应、动机强度、个体差异如 trait self-control）可任意加入。这是 DED-008 风格的枚举未闭合。

    10. primary_suspect 指对：**未命中但作者自认**——作者把 IEA 不足（0.35 < 1.2）标为需要补充的弱点，是诚实的。但更致命的弱点（机制(a)(b)不可分 + 混淆变量集未闭合）作者没认。primary_suspect 偏了。

    11. 口径完整注册：**命中弱**——"显著低于"的"显著"和"冲突严重"的"严重"都没阈值注册。"资源消耗未接近认知容量上限的60%"——这个 60% 怎么算？是 n-back 负荷？双任务代价？工作记忆占用率？缺。

    12. 数据源同根冒充多源独立：**未命中**——本推论主要是机制声明，不是数据驱动型，不直接踩这条。

    13. API 可及性冒充认识论独立性：**未命中**——同上。

    14. 反向失败模式缺失：**命中**——推论预测"并行 < 序列"在冲突条件下，但未注册反向失败模式：(i) 当冲突极端严重时被试退化为单任务策略，干扰消失；(ii) 当被试通过训练获得特定任务自动化，切换成本消失；(iii) 高动机/高奖励下，目标激活可能从"干扰源"变成"激励源"，并行反而更高。

    15. Bootstrap 限定缺失：**命中弱**——推论描述的是稳态多任务，未区分新手 vs 专家阶段。专家通过 chunking 和自动化可大幅降低切换成本，这条桥是否对专家群体适用未限定。

    16. 验证对象存在性未标注：**未命中**——实验对象（人类被试在冲突任务下的并行/序列比较）大量存在，可观测。
  counterexample_hunt: |
    **主动构造的反例 1：极端冲突下的策略性退化**
    当任务 A 唯一标准 = 速度（必须 < 500ms 反应）、任务 B 唯一标准 = 准确性（必须 100% 正确），冲突极端。被试可能采取"完全放弃 B 优先做 A"的策略，此时并行执行的产出 ≈ 单任务 A 的产出；而序列执行（先 A 后 B）也是 ≈ A 产出 + B 产出。**如果 B 在序列中也无法达到 100% 准确（因为 B 难度高），那序列的 B 产出很低，而并行的"放弃 B"产出 ≈ 0——两者可比性塌缩**。这个边界场景下，并行可能不 < 序列，或者差异无法归因到"目标干扰"而非"策略选择"。**结果：揭出过度伸张——推论的隐含预测（冲突越严重并行越低）有反例边界**。

    **主动构造的反例 2：自动化与 chunking 的抹平效应**
    钢琴家在视奏 + 节拍器双任务中，演奏精度不显著低于视奏单任务（已训练）；飞行员在自动驾驶 + 通讯双任务中绩效不低（chunking）；急诊医生在多病人监护中不显著低（pattern recognition 自动化）。**这些都是冲突型多任务（速度 vs 安全/准确），但并行 ≈ 序列**。**结果：被部分消化——可解释为"专家效应限定"，但推论没注册这条限定**。

    **主动构造的反例 3：目标兼容下的干扰**（用以测排除条款的真伪）
    声明排除"目标兼容时不适用"。但目标兼容的多任务（如同时做两道数学题、都要求速度 + 准确性）仍可能因 working memory 共享而干扰——这违反排除条款。**结果：揭出过度伸张——"目标兼容 = 无干扰"的排除过于绝对**。

    **主动构造的反例 4：资源竞争可同时存在而非互斥**
    声明说"资源竞争占主导时不适用"。但在冲突型多任务中，资源竞争（共享 working memory）和评判标准冲突（speed vs accuracy）**几乎必然共现**——因为冲突型任务往往需要更高的认知控制。两个排除条件很难同时不满足，所以排除条款的射程被砍到极窄区间。**结果：揭出过度伸张——"限制条款"实际上几乎取消了推论的适用范围**。

    **反例猎捕净结果**：4 个构造中 3 个揭出过度伸张（边界失败模式、专家效应、资源/冲突共现），1 个部分消化。无净杀，但反例密度足以阻止 verified。
  required_fixes:
    - "1) 在 falsifiability 节追加反向失败模式注册：明确\"冲突极端严重时（评判标准互斥率 > X%）被试可能退化为单任务策略，预期干扰效应消失而非放大\"，给出判据阈值；同时注册\"高训练水平下切换成本被自动化吸收\"的限定条件。"
    - "2) 证明证伪条件(c)的混淆变量集是闭合的（不是开放列表）：要么用实验前注册的混淆变量预登记表锁死，要么将证伪逻辑改为\"任一混淆变量可解释干扰 > Y%\"而非\"任一可完全解释\"。"
    - "3) 操作化\"评判标准冲突严重度\"为连续度量（而非二分），给出低/中/高阈值或评分量表，使预测可在不同冲突强度下分别检验；同步操作化\"资源竞争占主导\"的判据（建议用双任务代价或 working memory 占用率）。"
    - "4) 在机制节明确(a)切换成本与(b)侵入性激活的可分离操作（建议：双任务范式中加入 cue-to-task 切换间隔作为切换成本指标，侵入性激活用目标相关词汇的 stroop 干扰测量），并在 falsifiability (b) 中给\"分解为独立因素\"的判据。"
    - "5) 补充 IEA 证据：要么引用神经科学文献（fMRI 显示前扣带皮层在多目标冲突下激活）作为独立来源，要么引用计算建模（如 ACT-R 或 Leabra 的多目标仿真）作为第二独立验证，否则应降级为 weakly_verified 并在 status 标注当前 IEA = 0.35。"
  oneline: |
    核心机制不假但边界全软——混淆变量集未闭合、机制(a)(b)不可分、极端冲突策略性退化和专家自动化两条反向失败模式未注册、IEA 自认 0.35 远低于阈值，需要补五条才能升级。

round_3:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 3, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    BR-L2-045 在前两轮已经修复了 DED-004/007 类不可触发证伪条件、补充了反向失败模式和跨源验证。本轮审查未发现 DED-004(不可证伪循环)或 DED-007(测量轴焊死)复发——证伪条件(a)(b)(c)均有前定操作化与触发标准,双过程分解的测量锚(CTI/Stroop)来源于不同范式,mutex 率可独立于结果构造。

    但本轮发现三个 required 级缺陷:
    (1) "认知容量上限的60%"是未经引用的魔术数字,无来源依据;
    (2) 机制(a)为内源性"反复调整评价标准",操作化却用外源性 cue-to-task 间隔(CTI)——测量靶与机制靶错配,这是 DED-007 类焊点的微缩版;
    (3) falsifiability(c) 中"解释干扰效应 >50%(即效应量 partial η² > 0.06)"是定义性跳跃——0.06 是固定值,与"50%"的关系需数学明示,否则读者无法验证触发条件。

    反例猎捕:净杀未果。被消化的反例——Goldschmidt(2014)linkography 显示并行标准切换可提升创造性产出质量,这是 BR-L2-045 未注册的反向失败模式(应限定在效率/数量,不覆盖质量维度),降为 should 级。
  red_flags: |
    1. brick=conclusion:未命中。两过程分解(切换成本+侵入激活)是 Kruglanski 目标系统理论的窄化+操作化,非简单复述。
    2. 逐格判空:未命中。核心预测(资源竞争控制+评判标准冲突下并行<序列)是经验性主张,非同义反复。
    3. 测量轴正交:未命中。mutex 率可独立于任务奖励结构构造,CTI/Stroop/ACC 来自不同范式。
    4. 射程/排除钩子独立于结果:未命中。排除条件按可前测的"标准是否兼容/资源是否占主导"划,非事后开脱。
    5. 分类判据档位:未命中。mutex 率连续(0-100%),资源竞争连续(>20% 或 OSpan<50%),档位匹配。
    6. anti-talisman 真兑现:未命中。mutex 率、CTI、Stroop 干扰均可独立前测。
    7. 现实锚事实核查:未命中。Kruglanski/Shah/Locke-Latham/Ordóñez/Botvinick/Kerns 引用均准确。
    8. 条件是下定义还是做预测:未命中。冲突与资源竞争均有可证伪的操作化。
    9. 枚举穷尽:未命中。声称两个独立过程,基于 Kruglanski 框架的范围性声明,非全枚举主张(但应明示——见 should)。
    10. primary_suspect 准确:命中一处软肋——机制(a)与 CTI 操作化的内/外源性错配未被作者认作最弱腿,实际比作者自认的更严重(升为 required)。
    11. 口径完整注册:命中 required——"60% 认知容量"无来源;">50% = partial η² > 0.06"定义性跳跃需数学明示。
    12. 数据源同根:未命中。三源跨认知/组织/神经,非同根。
    13. API 冒充独立性:不适用。
    14. 反向失败模式缺失:命中 should——质量产出维度(创造性任务中并行标准切换可优于序列单标准优化,如 Goldschmidt 2014 linkography)未注册。
    15. Bootstrap 限定:不适用。
    16. 验证对象存在性:未命中。实验范式成熟,可观测。
  counterexample_hunt: |
    猎捕一:Goldschmidt(2014) linkography——设计任务中并行标准切换产生更多新颖解,序列单标准迭代反而过早锁定。结论:被消化,揭出过度伸张——BR-L2-045 默认适用于"总产出或效率",但未明示仅适用于数量/速度/准确性维度,不适用于创造性产出的质量维度。降为 should。

    猎捕二:专家并行多准则任务(国际象棋手同时评估子力/王安全/兵形;指挥家同时控制速度/力度/平衡/音准)。结论:被消化——被反向失败模式(ii)高训练水平吸收,专家切换成本被自动化。

    猎捕三:CTI 范式与"内源性标准切换"的实证关联。CTI 在任务线索呈现后 100-300ms 内的准备效应是被动外源性切换成本。BR-L2-045 声称的"个体在目标间反复调整评价标准"是内源性、未线索驱动的过程。两者在 Monsell(2003)、Rubinstein et al.(2001)等任务切换文献中被视为不同构念,神经基底部分重叠但不完全相同。结论:净杀未遂,但暴露测量靶-机制靶错配(升为 required)。

    猎捕四:寻找"标准冲突+并行 > 序列"的实证研究。已查 dual-task paradigm 中 SART、心理运动警戒、Stroop-n-back 等——无净杀案例,主流文献支持并行 < 序列(尤其在外显计时与外显反馈条件下)。结论:无净杀。
  required_fixes:
    - "1) \"认知容量上限的60%\"阈值为魔术数字,需引用 Kahneman(1973) 或其他容量模型来源,或改为有文献依据的具体值(如工作记忆容量 4±1 chunks / Cowan 2001 等),否则删除该限定。"
    - "2) 机制(a)与 CTI 操作化的内/外源性错配:要么将机制(a)改述为\"外源性线索驱动的评判标准切换\",要么为内源性标准切换提供独立测量(如自主思维采样、pupillometry 在未线索双任务下的 tonic 变化)。"
    - "3) falsifiability(c) 的\"解释干扰效应 >50% (即 partial η² > 0.06)\"是定义性跳跃——需明示数学关系(如\"原干扰效应 partial η² ≈ 0.10,第三变量解释 6% 即占原效应 60%,触发证伪\"),或改用更直接的\"第三变量单独回归后原始效应下降 >50%\"判据。"
  oneline: |
    双过程分解+多源验证扎实,但 60% 容量阈值为无源魔术数字、CTI 与内源标准切换的测量靶错配、证伪(c)的定义性跳跃三处 required 缺陷挡住 verified。
