        (i) 删除条件(a)或将其降级为"概念澄清"而非证伪条件;
        (ii) 按 r1 的 R-R6 方案重写条件(b),去掉"原则上";
        (iii) 新增一个基于比较案例的可操作证伪条件——建议使用电报(速度→极限+
