        api_operations 票(权重 0.6)的结构性不诚实必须修正。三种可接受方案:
        (a) 将该票从 IEA 中移除,接受 IEA 在 1.3-1.7 区间(低于 1.8),对应维持
        weakly_verified 状态。同时将该票的证据(CNBS memo)降级为正文中的
