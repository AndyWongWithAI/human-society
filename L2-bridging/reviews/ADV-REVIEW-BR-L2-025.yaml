        (b) 保留该票但应用显式自引折扣:独立系数 ≤0.1(而非当前 0.6),权重降至
        ≤0.1,并显式标注"自生成确认性证据——与砖作者同一管线产出,非独立来源"。
        (c) 若作者认为 api_operations 的证据价值不可放弃,则必须找到【真正独立
        的外部操作化证据】(不同研究者/不同工具链/不同时间的独立实证)替代当前
        的自生成 memo。自生成证据不可同时充当独立验证。
