id: ADV-REVIEW-BR-L2-048
type: adversarial_review
reviews: BR-L2-048
layer: L2-bridging

人话摘要: |
  对 BR-L2-048(深层层级中的权力扩散)的 round-1 独立对抗审查。判 needs_revision:
  砖的核心方向(层级越深→名义权力与实际控制力的剪刀差越大)有直觉合理性,
  不是全盘胡言。但有三条 required 级缺陷阻挡 verified:①applicable_sources
  中多个引用的具体统计数字(Blau 15%/20%、Tsebelis 30%、Huber & Shipan 40%)
  无法与原著核心主张对应,定量经验基础不可靠;②不同来源测量的是不同的东西
  (信息偏向 vs.细节遗漏 vs.否决概率 vs.控制力下降),却被统一归入"≥10%/层
  控制力衰减"的帽子下——这是跨构造混淆;③Michels(1911)的引用方向与原著相反
  ——寡头铁律说的是权力向顶层集中而非扩散,砖将其读成"顶层名义权力大但控制力
  下降"是对核心论点的误读。另有四条 should 级缺陷:名义权力未操作化、"非线性"
  与"≥10%/层"内矛盾、IEA 缺失、定性内核已含于 THEOREM-hierarchy-depth-limit。

target: BR-L2-048
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与写砖者及 IEA 调查员无关)。
  审查者阅读包通用红旗 16 条 + L2 专属 5 条(brick=conclusion / 测量轴正交 /
  anti-talisman / IEA 独立性诚实含单 LLM 折扣 / 反例猎捕必做)。
  默认怀疑,宁可错杀不放水。方法论 > 任何单条命题。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新独立上下文, 与写砖者及 IEA 调查员无关)"
  verdict: needs_revision
  verdict_note: |
    BR-L2-048 主张:组织层级超过有效管理幅度时,信息在每层被压缩美化,指令被重新
    解释和选择性执行,导致高层名义权力与实际控制力出现剪刀差,且实际控制力随层级
    深度呈非线性衰减(≥10%/层)。

    方向正确:层级越深→控制衰减的直觉是合理的,与"传话游戏越传越歪"的日常经验
    一致。THEOREM-hierarchy-depth-limit 已从信息熵增角度得出定性结论:层级过深
    后"高层掌握的情况和基层实际就基本对不上了"。砖的贡献在于将这一信息失真命题
    翻译为权力术语(名义权力 vs.实际控制力)并给出定量预测(≥10%/层)。

    但砖有三条 required 级缺陷阻挡 verified:

    【Required ① — 引用文献中的具体数字无法与原著核心主张对应,定量经验基础不可靠】

    砖引用了五个来源并从中提取了具体统计数字来支撑"≥10%/层"的定量预测。逐条核查:

    (i) Blau (1968):砖称 Blau 在"《组织动力学》"中发现"每增加一层,中层管理者
    向上汇报的信息中'有利偏向'比例平均增加15%,向下传达的指令中'细节遗漏'比例
    增加20%"。Blau 的已知主要著作包括"The Dynamics of Bureaucracy"(1955,1963
    修订版)和"Exchange and Power in Social Life"(1964),1968 年他在 AJS 发表了
    "The Hierarchy of Authority in Organizations"。但"15%有利偏向/层"和"20%细节
    遗漏/层"这两个具体数字在 Blau 研究的二手文献和综述中并非其标志性发现——
    Blau 的核心贡献是区分了科层制的正式与非正式维度,而非提供逐层衰减的精确
    百分比。这两个数字更像是后人总结或砖作者合成的估算,而非 Blau 原文的直接报告。

    (ii) Tsebelis (2002):砖称"每增加一个否决点,顶层政策被完全执行的概率下降约30%"。
    Tsebelis 的《Veto Players》核心论点是:否决者数量增加 → 政策稳定性增加(现状
    更难改变),而非"每增加一个否决点→执行概率下降30%"。Tsebelis 的理论框架是
    空间模型(spatial model),关注的是政策变化的" winset "(可替代现状的政策集合)
    大小,而非层级中指令执行的逐级衰减。30%这个数字在他的框架中没有对应位置。

    (iii) Huber & Shipan (2002):砖称"每增加一个委托-代理层级…控制力下降约40%"。
    Huber & Shipan 的《Deliberate Discretion?》研究的是立法机关如何通过法律文本的
    详细程度来控制官僚机构的裁量权,其核心发现是:当立法机关与官僚机构的政策偏好
    分歧大时,法律写得更详细以限制裁量权;一致时则授予更多裁量权。书中分析了
    立法→部门→办公室的委托链,但"每增加一层控制力下降40%"并非该书的量化发现——
    书的核心方法是博弈论模型+美国州政府数据的计量分析,不产生"逐层40%衰减"这种
    参数估计。

    这不是说这些作者"错"了——砖不是在引用假文献。问题是砖给每个文献附加了一个
    高度具体的数字(15%/20%/30%/40%),而这些数字(1)在原著中难以定位为作者的
    核心实证发现;(2)很可能将不同研究所测的不同构念(信息偏向、细节遗漏、否决
    概率、控制力)混在一起,用来支撑砖自己的"控制力衰减"统一叙事。这属于对一个
    真实参考文献进行过度具体化、过度定量化的解读——近似引用掺水。

    修法:砖必须(1)逐个核验每个数字能否在原文中定位到具体段落/表格;(2)无法
    核验的数字应降级为"方向性支持"(如"Blau 的方向性发现是层级增加→信息失真
    增加"而非"15%");(3)如果多个来源的数字来自不可比的不同构念,必须诚实标注
    跨构念比较的局限性,而非将它们统一在"控制力衰减"的同一量纲下。

    【Required ② — 不同来源的构念被统一归入"控制力衰减"帽子下,属跨构造混淆】

    即使假设上述数字均可在原文定位,砖仍然存在一个结构性缺陷:它把四个测量不同
    东西的数字(Blau 的信息偏向 15%、Blau 的细节遗漏 20%、Tsebelis 的否决概率
    衰减 30%、Huber & Shipan 的控制力下降 40%)统一转化为"≥10% 控制力衰减/层"
    的单一预测。但:
    - "信息偏向"测量的是中层管理者向上汇报时的选择性呈现,是信息质量问题
    - "细节遗漏"测量的是指令向下传达时的信息丢失,也是信息质量问题
    - "否决概率衰减"测量的是政策被完整执行的制度概率,是制度设计问题
    - "控制力下降"测量的是委托人对代理人的产出控制,是委托-代理问题

    这四个构念虽然都在"层级"这个共同背景下,但它们测量的是层级效应的不同侧面,
    不能简单地取最小值(10%)作为统一的"控制力衰减"下界。这相当于把"汽车每公里
    油耗""轮胎每公里磨损""发动机每公里噪音增加""每公里事故概率"统一为"≥某值/公里
    的车辆性能衰减"——概念上不诚实。

    修法:要么(1)为"控制力"给出一个精确定义,限定其测量范围(只用指令执行准确率),
    并只引用直接测量该构念的文献;要么(2)分别注册不同维度的衰减(信息衰减、
    执行衰减、制度衰减)及其各自的下界,承认它们不完全可公度。

    【Required ③ — Michels (1911) 的引用方向与原著核心主张相反】

    砖对 Michels 的解读称"顶层名义权力虽大,但无法有效指挥基层,形成'寡头铁律'
    的悖论"。Michels 的"寡头铁律"恰恰主张:组织规模扩大后,权力集中在少数领导者
    (oligarchs)手中,这些领导者通过控制信息渠道、组织财务和行政机器来巩固自己的
    权力。寡头铁律的核心是"权力向顶层集中且有效"——领导者控制组织,而非组织
    失控于领导者。Michels 观察到的"悖论"是民主组织(如德国社民党)口头上承诺民主
    但实质上走向寡头——这是理想与现实的悖论,而非"名义权力大但控制力下降"的悖论。

    这不是说文意的微妙偏差可以忽略。Michels 是砖引用的第一个、也是理论分量最重
    的来源。如果一个桥接砖对其核心权威来源的解读是反向的,那么该来源不仅不能
    支撑砖的主张,反而构成了需要解释的张力:Michels 说权力集中有效,砖说权力扩散
    衰减——两者在同一个组织现象上的方向性判断是相反的。

    修法:要么(1)删除 Michels 引用,或将其改为"与本命题形成张力的对照观点",
    诚实标注 Michels 的发现方向与本命题相反;要么(2)精确限定:Michels 观察到的是
    权力在"领导层小圈子内"集中,而本命题关注的是领导层对"基层"的控制衰减——
    两者可能是同一枚硬币的两面(权力在顶层圈子内集中+顶层对基层控制衰减),
    但需要明确论证而非隐晦暗示 Michels 支持本命题。

    【Should 级缺陷四条】

    4. 名义权力未操作化。Falsifiability(a)要求比较"指令执行准确率"与"名义权力
    (如正式命令权重)",但"正式命令权重"如何量化为与"执行准确率"可比的数值?
    如果名义权力的量化方式是"100%执行"(因为正式层级结构中命令应当被执行),
    则需显式声明;如果是其他操作化方式,需定义。这是可修的——但需在证伪条件
    中注册,否则(a)的统计检验不可执行。

    5. "非线性衰减"与"≥10%/层"存在内部表述矛盾。"非线性衰减"暗示衰减速率随
    深度变化(通常理解为加速衰减),"≥10%/层"则描述了恒定的逐层衰减率(至少
    不低于某常数)。如果衰减是非线性的,则该非线性函数的具体形式才是真正的预测,
    "≥10%/层"只是一个线性下界近似。砖需澄清衰减的函数形式(线性?指数?超指数?)
    或删除"非线性"措辞。

    6. IEA cross_verification 缺失。砖仅有 applicable_sources 段(政治社会学/
    组织行为学/政治学),无 cross_verification 段、无 IEA 计权、无 instrument_
    disclosure。L2 verified 要求 IEA ≥ 1.2 且 cross_verification 已写入。这不是
    命题缺陷而是流程缺失,但当前状态下不可判 verified。

    7. 定性内核在 THEOREM-hierarchy-depth-limit 中已有实质覆盖。该定理明确推导:
    "n 级上行后顶层收到原始信息的 r^n 保真度"→"顶层决策与底层现实的信息关联
    趋近于零"。砖将其翻译为"名义权力 vs 实际控制力"的权力语言,这种翻译本身是
    合法的桥接操作(把信息术语映射到权力术语),但厚度较薄——砖的核心认知增量
    仅在定量预测(≥10%/层)上。如果定量预测的经验基础被 Required ①/② 削弱,
    砖的剩余厚度将逼近 brick=conclusion。这不是独立的 required 缺陷(前述三条
    required 已覆盖),但在修复后需重新评估厚度。

  red_flag_findings:
    brick_conclusion: |
      【命中 should——定性内核已含于 L1,定量增量是砖仅有的非平凡贡献】。

      逐一核查 L1 实体:
      - CONCEPT-power:定义权力为"A 影响 B 选择的能力",含"可潜伏"(权力可以不
        施加)。未涉及层级深度与权力有效性的关系。
      - CONCEPT-hierarchy:已在 l0_constraints 中写明"PHY-001:层级制造信息梯度
        ——信息从底层向上汇总时衰减,从顶层向下传达时失真——熵增的双向侵蚀"。
        这一条已经等于说了"层级越深→信息越失真"。
      - THEOREM-hierarchy-depth-limit:完整推导了"n 级→r^n 保真度→顶层决策与
        底层现实脱节"的全链条,明确定理结论为"层级结构的有效深度存在自然极限
        ——超过某一层数后,顶层决策与底层现实的信息关联趋近于零"。

      砖的新增贡献:(1)将"信息关联趋近于零"翻译为"名义权力与实际控制力的剪刀差"
      ——即从信息术语映射到权力术语;(2)给出定量下界"≥10%/层";(3)引入社会
      学/政治学文献作为经验锚。

      其中(1)是合法的桥接操作——L2 的职责就是把 L1 的抽象命题接到经验领域。
      但厚度取决于(2)和(3)的可靠性。如果定量经验基础(Required ①/②)和文献
      引用(Required ③)出现问题,砖的厚度将大幅缩水——只剩下信息术语到权力
      术语的翻译,而 CONCEPT-hierarchy 的 l0_constraints 已经说"层级制造信息
      梯度",CONCEPT-power 的 l0_constraints 已经说"信息延迟→权力的有效作用
      范围受通信速度约束"。

      结论:不单独标记为 required(砖仍有合法的翻译贡献和定量野心),但列为 should:
      砖在修复后需自问——如果去掉所有存疑的定量引用,砖剩余的非平凡内核是什么?

    measurement_axis_orthogonal: |
      【大致正交——但 falsifiability(a) 的"名义权力"基线破坏了一条路径的独立性】。

      自变量(IV):层级深度——通过组织架构图/人员汇报关系计数,属结构测量。
      被观测量(DV):控制力衰减——通过指令执行准确率、信息反馈一致性测量,属
      行为测量。两条测量链在方法上分叉:IV 测的是"这个组织有几层"(静态结构),
      DV 测的是"命令被执行得怎么样"(动态行为)。不存在 DED-007 式的分母偷用
      结果测的焊点。

      但有一个测量路径上的问题:falsifiability(a)的比较基准是"名义权力(如正式
      命令权重)"。如果"名义权力"被操作化为"在正式层级制度下,命令被预期以 100%
      准确率执行"(因为层级定义本身就包含'上层对下层具有更大的决策权/控制力'),
      那么执行准确率从 100% 出发的任何下降本身就是"衰减"的证据——此时"名义
      权力"与"实际控制力"的差距不是一个被独立测量的量,而是用同一个执行准确率
      测量值减去一个定义性的 100% 基准得出的。这种情况下,falsifiability(a)
      不是比较两个独立测量值,而是比较一个测量值与一个定义常数。

      这不影响 falsifiability(b)(跨组织相关系数)的测量独立性——(b)中 IV 和 DV
      完全异源。但(a)中的比较基准需要明确:名义权力的操作化值从哪来、如何独立
      于实际控制力的测量获得。这是一个可修复的测量问题,非结构性焊死。

    anti_talisman: |
      【轻微命中 should——"至少"下界+条件(c)的不可达技术共同收窄了证伪窗口,
      但未达到结构性护身符水平】。

      检查三条 falsifiability 条件:

      (a)"存在一个组织,层级深度≥5,管理幅度≤5,但指令执行准确率与名义权力
      无显著差异(p>0.05)"——这是一个可操作的证伪条件。问题仅在于"名义权力"
      的操作化(见上),但结构本身是诚实的:给定了组织规格(深度≥5,幅度≤5),
      给定了统计标准(p>0.05),给出了测量指标(指令执行准确率)。

      (b)"跨行业/跨规模样本中,层级深度与实际控制力下降比例之间相关系数≤0.2"
      ——标准的社会科学证伪结构,诚实且可操作。

      (c)"证明通过完全透明的信息传输技术可以使得实际控制力与名义权力完全相等,
      且不受层级深度影响"——这个条件要求的技术("完全透明的信息传输技术")在
      当前世界中不存在,因此(c)是一个理论上的证伪路径而非实践上可执行的测试。
      但这不是 DED-004 式的不可证伪循环——因为(a)和(b)在实践上是可测试的。
      只要至少一条证伪路径是实践上可操作的,命题整体就不是不可证伪护身符。

      轻微担忧:"至少"(≥10%)的下界设定使量化预测变得容易存活——任何衰减率
      ≥10%都算"预测成功"。如果真实验证发现平均衰减率=11%,那"至少10%"是对的;
      如果发现=9%,命题被证伪。这个下界的锐度取决于 10% 从哪来——如果 10% 是从
      存疑引用中提取的最小值(Required ①),那 10% 的选择本身就是有问题的。
      但这不是 anti-talisman——下界预测是可证伪的(观测到 <10% 就倒了),
      只是"至少"让证伪门槛变低(预测更容易活)。

      结论:不命中 anti-talisman required。条件(a)(b)可操作,命题结构诚实。
      但"至少"下界的经验来源(是否来自可靠测量的最小值)与 Required ① 联动。

    real_world_anchor_factcheck: |
      【命中 required——见 verdict_note 中 Required ① 和 Required ③】。

      逐一核查 applicable_sources:

      1. Michels (1911) 寡头铁律:
         — 文献真实存在。Michels, R. "Zur Soziologie des Parteiwesens in der
           modernen Demokratie"(1911,英译"Political Parties",1915)。
         — 核心主张:组织规模扩大→权力集中在少数领导者手中→寡头铁律。
           这是关于权力【集中】的理论,不是权力【扩散】的理论。
         — 砖的解读("顶层名义权力虽大,但无法有效指挥基层")与 Michels 的
           核心主张方向相反。Michels 认为寡头们通过控制信息/财务/行政机器
           有效地控制组织——他们用权力为自己的利益服务,而非权力衰减到无法
           控制。这是事实性误读,非解读偏差。→ Required ③。

      2. Weber (1922) 官僚制:
         — 文献真实存在。Weber, M. "Wirtschaft und Gesellschaft"(1922,
           英译"Economy and Society")。
         — Weber 确实分析了官僚制的控制困境:形式理性与实质理性的张力、
           科层官员的"本位利益"可能导致目标置换(goal displacement)。
         — 砖的引用方向(层级越深→指令扭曲)与 Weber 的分析一致,但 Weber
           的分析框架比"层级深度→衰减"更复杂:他强调的是规则系统自身的
           非人格化逻辑与实际后果之间的张力,而非单纯的逐层信息衰减。
         — 判定:方向正确但简化了 Weber 的多维分析。不构成 required。

      3. Blau (1968) 组织层级与信息失真:
         — Blau, P.M. 在 1968 年发表了"The Hierarchy of Authority in
           Organizations"(AJS),研究的是科层权威的分布。但砖所称的具体统计
           数字("有利偏向 15%/层""细节遗漏 20%/层")在 Blau 研究传统的综述
           和二手文献中并非其标志性实证发现。这些高度具体的数字更像是后人
           的估算或砖作者的合成。
         — 判定:文献真实存在(Blau 确实研究了组织层级),但附加的具体数字
           无法可靠归因于 Blau 的原著发现。→ Required ①。

      4. Tsebelis (2002) 否决者理论:
         — 文献真实存在。Tsebelis, G. "Veto Players: How Political Institutions
           Work"(2002, Princeton University Press)。
         — 核心主张:否决者数量↑ → 政策稳定性↑(winset 缩小→更难改变现状)。
           与"否决点增加→政策执行概率下降 30%"是不同方向的论述。
         — 判定:文献真实但砖的解读违背原著因果方向。→ Required ①。

      5. Huber & Shipan (2002) 委托-代理链:
         — 文献真实存在。Huber, J.D. & Shipan, C.R. "Deliberate Discretion?
           The Institutional Foundations of Bureaucratic Autonomy"(2002,
           Cambridge University Press)。
         — 核心主张:立法机关通过调整法律文本的详细程度来控制官僚裁量权,
           详细程度取决于立法-官僚偏好分歧度和立法机关的专业能力。
         — "控制力下降 40%/层"不是该书的量化发现。
         — 判定:文献真实但附加的数字无法可靠归因。→ Required ①。

      总结:五个引用中,Weber 的方向正确(仅被简化),Michels 的方向与原著相反,
      Blau/Tsebelis/Huber & Shipan 三个引用附加了无法从原著核心主张中可靠定位
      的具体数字。定量经验基础不可靠,属 required 级事实错。

    condition_is_prediction_not_definition: |
      【未命中——是经验预测】。

      核心主张"层级深度每增加一层,控制力下降至少 10%"是经验预测——其真值不由
      CONCEPT-power 或 CONCEPT-hierarchy 的定义担保。"层级"的概念定义不包含
      "每层衰减 10%"——这必须由组织行为的实证数据决定。

      即使 THEOREM-hierarchy-depth-limit 已经说了"信息会衰减",定理也只在定性
      层面断言衰减存在,未给出衰减率。10% 是一个额外的事实主张。

      如果"控制力"的定义被扩张为"执行准确率"的同义词,而"名义权力"被定义为
      "100% 执行基准",那么"名义权力≠实际控制力"(只要执行率<100%)确实是定义
      性的——因为没有任何组织的执行率能达到完美的 100%。但这不是问题:预测的
      核心不是"有差距"(这确实是平凡的),而是"差距至少 10%/层"(这是非平凡的)。
      因此红旗不命中。

    enumeration_exhaustiveness: |
      【未命中】。砖未声称"N 类可枚举"结构,不涉及该红旗。

    primary_suspect_and_trivialization: |
      【命中 should——砖未设 primary_suspect 字段,审查者自诊最弱腿】。

      审查者自诊最弱腿排序(从最致命到最次要):

      (1) 最致命软肋 = 定量经验基础不可靠(Required ①/②)。
          砖的五个应用来源中有三个(Blau/Tsebelis/Huber & Shipan)被附加了
          无法可靠归因于原著核心发现的具体统计数字,第四个(Michels)被反向解读。
          如果剥除这些存疑的引用,砖仅剩 Weber(方向正确但被简化)和一个从定理
          延伸出来的定性直觉。砖的非平凡内核(≥10%/层)失去了经验文献支撑。

      (2) 次致命软肋 = 定性内核的"厚度"不够。
          CONCEPT-hierarchy 的 l0_constraints 已经写了"层级制造信息梯度——
          信息从底层向上汇总时衰减",CONCEPT-power 的 l0_constraints 已经写了
          "信息延迟→权力的有效作用范围受通信速度约束"。THEOREM-hierarchy-
          depth-limit 完整推导了 n 层→r^n 保真度衰减。砖的核心洞察"层级越深
          →名义权力与实际控制力的剪刀差越大"基本上是这两条 L1 陈述在"权力"
          术语空间下的重述。砖的厚度完全压在定量预测(≥10%/层)上——如果定量
          基础不可靠,砖的剩余厚度将逼近命名性翻译(把定理的信息术语改成权力术语)。

      (3) 第三软肋 = Michels 被反向引用(Required ③)。
          这更像是粗心而非恶意,但 Michels 作为砖的第一个也是最具理论分量的来源,
          如果其引用方向与命题方向相反,会对砖的可信度造成不对称打击:读者会问
          "如果 Michels 说的是相反的事,那其余引用有没有类似的误读?"

      (4) 第四软肋 = "非线性衰减"与"≥10%/层"内部矛盾。
          这是措辞层面的问题,容易修复,但暴露了砖在定量表达上不够严谨。

      泛化/稀释检查:"层级越深→控制越弱"在管理学和公共行政文献中已有大量讨论
      (如 Downs 1967 "Inside Bureaucracy"的控制递减律,Williamson 1967 的
      "控制损失"概念)。砖如果无法提供可靠的定量锚或新颖的机制区分,确实面临
      被稀释为"管理学常识"的风险。这不是当前的致命缺陷(砖有定量野心),但警示
      砖需要在修复后确保其贡献不降级为"众所周知,层级越深越难管"。

    caliber_completeness: |
      【命中 should——名义权力口径未注册,证伪路径(c)的技术前提不可达】。

      砖注册了三项 falsifiability 条件,覆盖了:
      - 单案例证伪(a):找到一个深度≥5 但控制不衰减的组织
      - 统计证伪(b):跨组织相关性不显著
      - 技术消除证伪(c):完全透明技术可抹平衰减

      未注册的口径:
      - "名义权力"的操作化定义和测量方法(影响(a)的可操作性)
      - "管理幅度≤5"中的"管理幅度"如何计数(直接下属?含虚线汇报?)
      - "指令执行准确率"的测量方案(抽样哪些指令?谁评估?)
      - 衰减"比例"的计算方式:是绝对百分点(从 100% 到 90% = 下降 10 个百分点)
        还是相对比例(从 100 到 90 = 下降 10%)?
      - "至少 10%"与"非线性衰减"之间的函数关系

      这些不是细节后补层面的缺失——名义权力的操作化直接影响(a)能否被执行。
      修法:在 falsifiability 段中为(a)注册名义权力的操作化定义;为"衰减比例"
      注册计算方法(绝对/相对);为(b)注册样本量要求(如 n≥30);澄清"非线性"与
      "≥10%/层"的关系。不需要全部一次注册完——但至少名义权力和衰减比例的计算
      方式是证伪测试的基本前提。

  iea_independence_check: |
    【IEA 未完成——blocking should】。

    砖仅有 applicable_sources 段(政治社会学/组织行为学/政治学),无 cross_verification
    段,无 IEA 计权,无 instrument_disclosure。按 independence-model.yaml,这三类
    来源均属社会科学相邻学科,独立性系数不会高。

    审查者粗略估算(非正式,不能替代正式 IEA 调查):
    - 政治社会学(Michels + Weber 的官僚制分析) → 锚源 1.0
    - 组织行为学(Blau) → 与政治社会学共享"大型组织的结构分析"方法论传统,
      取 independence-model 的 default=0.6,因主题重叠折至 ~0.4
    - 政治学/公共行政(Tsebelis + Huber & Shipan) → 与政治社会学共享制度分析
      框架,取 ~0.4
    - 粗略 IEA ≈ 1.0 + 0.4 + 0.4 = 1.8 → 看似过线(≥1.2)

    但此估算在三个方面可能高估:

    (1) data_source_origin 折扣:Michels/Weber/Blau 均基于欧洲和美国的组织案例,
       非独立文化样本。不同学科的分析共享同一批经典案例(德国社民党、美国联邦
       官僚机构),数据源层面的独立性低于学科方法论的独立性。

    (2) instrument_correlation 折扣:五个来源的判断均由单一 LLM 执行阅读和解读,
       同一仪器的语料先验横加于多路投票。按 instrument_correlation.discount_rule,
       必须披露"报告的 IEA 是学科独立性上限,仪器有效独立性低于此"。

    (3) 如果 Required ① 成立(三个引用中的具体数字不可靠),则这些来源对"≥10%"
       的支撑力本身就很弱——IEA 计权的前提是来源确实在支持这个命题,而非被
       过度解读为支持。

    正式 IEA 调查必须:
    (i) 按 independence-model.yaml 查表确定学科独立系数
    (ii) 应用 instrument_correlation.discount_rule 披露单 LLM 仪器折扣
    (iii) 评估每个来源对砖的核心主张(≥10%/层)的实际支撑强度(而非只记录
          "此来源讨论了层级")
    (iv) 写回 cross_verification 段,含 evidence tags 和 verdict_note

    注意:若 Required ① 导致部分来源被降级或移除,IEA 可能跌破 1.2。

  counterexample_hunt: |
    主动猎捕(scope=深度层级组织,证伪目标=falsifiability(a)和(b))。
    寻找:层级深度≥5、管理幅度≤5、但高层对基层的控制力衰减<10%/层(或不显著)
    的组织。优先寻找:军事组织、宗教组织、高度标准化的特许经营、以及有严格
    SOP 的危险行业(核电/航空)。

    猎捕方向 1 —— 现代职业军队(以美国陆军为例):
    - 层级:火力组(4人)→班(9人)→排(40人)→连(150人)→营(600人)→旅
      (3000人)→师(15000人)→军。管理幅度在 2-5 之间,深度可达 7-8 层。
    - 控制机制:标准化训练(共同的战术语言)、详细 SOP(作战手册)、任务式指挥
      (mission command——上级指定意图和目标,下级自主决定执行方式)、事后审查
      (AAR——每项任务后的结构化复盘)。
    - 评估:高层(师/军级)的作战意图确实能被基层(排/连级)准确理解和执行。
      但这是否意味着"控制力衰减<10%/层"?
      - 有利砖的解读:任务式指挥恰恰承认了控制力衰减——上级只给意图不给详细
        指令,因为知道详细指令在传递中会失真。战术手册和共同训练是"缓解"而非
        "消除"——符合砖的限制条款。
      - 不利砖的解读:如果"高层只给意图→基层自主执行→结果符合意图"算作有效
        控制(而非衰减),那么美军的控制力衰减可能远低于 10%/层。因为意图传导
        的保真度在高度标准化的训练下非常高。
    - 根本困难:无法获得"每层控制力衰减%"的测量数据。军事组织的内部指挥效能
      评估是机密的。砖的定量预测在这个领域无法被公开数据检验。
    - 结果:【未猎到净杀——数据不可及,案例在概念上可被双向解读】。但数据不
      可及本身是一个问题:如果砖最自然的检验对象(层级深、控制强的组织)的
      数据是机密的,那么 falsifiability 在实践上面临一个"可测但不可得"的困境。

    猎捕方向 2 —— 天主教会:
    - 层级:神父→主教→总主教→枢机主教→教宗(约 5 层,管理幅度不均)。
    - 控制机制:统一教理(天主教教理)、统一礼仪(弥撒规程)、神学院标准化培训、
      教廷信理部的教义监督。
    - 评估:天主教会在教义层面上对全球基层的控制力相当高——一个非洲村庄的
      弥撒与梵蒂冈的弥撒在核心要素上高度一致。但"教义一致性"是否等于砖所说的
      "指令执行准确率"?
      - 有利砖的解读:地方教会的"民间天主教"(folk Catholicism)与官方教义的
        偏离恰恰证明了控制衰减——拉丁美洲的民间圣徒崇拜、非洲的融合仪式都是
        教廷控制力在基层衰减的证据。
      - 不利砖的解读:如果砖把"民间偏离"编码为衰减,这是事后解释——任何基层
        与高层的差异都可以被解释为"衰减",无论其程度如何。
    - 结果:【被消化——支持案例,但暴露"控制力"概念弹性】。天主教会说明:在
      高度标准化的制度中,核心指令(教义)的保真度可以很高,但非核心维度(民间
      实践)的偏离始终存在。砖需要区分"哪些指令的衰减"——如果核心/非核心维度
      的衰减率不同,那么统一声称"≥10%/层"可能过于粗糙。

    猎捕方向 3 —— 麦当劳/高度标准化特许经营:
    - 层级: crew→shift manager→store manager→district manager→regional
      manager→VP→CEO(约 7 层,管理幅度 5-30 不等)。
    - 控制机制:极端详细的操作手册(每项任务都有精确步骤和时间标准)、神秘顾客
      审计、标准化培训(汉堡大学)、实时监控(KPI 仪表盘)。
    - 评估:麦当劳的核心产品(巨无霸)在全球的高度一致性是"控制力不随层级衰减"
      的证据。一个在芝加哥总部制定的新产品配方和操作流程,能在 3 万多家门店中
      以极高保真度执行。
      - 有利砖的解读:这恰恰是因为麦当劳用"技术手段(操作手册/培训/审计)部分
        缓解了衰减"——砖的限制条款已预注册了这一可能性。同时,非核心维度(如
        本地化菜单、门店清洁度的波动)确实存在衰减。
      - 不利砖的解读:如果在核心产品上,7 层深度的控制衰减近乎为零(执行准确率
        >95%),那么"≥10%/层"的预测在麦当劳这个案例上被证伪(除非采用指数衰减
        模型 0.9^7≈48%,那显然不是)。但如果采用加法模型(每层衰减 10pp,7 层
        =70pp 衰减,执行率仅 30%),那预测明显是错的。所以砖需要澄清衰减的计算
        模型(绝对还是相对?加法还是乘法?)——不同的模型会导致完全不同的预测值,
        也会影响哪些案例构成证伪。
    - 结果:【边缘挑战——取决于衰减计算模型】。砖未注册衰减是绝对百分点还是
      相对比例、是加法还是乘法,导致同一案例在不同模型下既可被视为支持也可被
      视为证伪。这不构成净杀,但暴露了"≥10%/层"的表述歧义(见 Should 级缺陷中
      衰减比例的操作化)。

    猎捕方向 4 —— Linux 内核开发/开源社区:
    - 层级:维护者→子系统维护者→Linus Torvalds(约 3 层,深度不足 5,不满足
      falsifiability(a)的前件)。不适用。

    猎捕方向 5 —— 中国科举-官僚体系(明清):
    - 层级:知县→知府→道台→巡抚→总督→六部→内阁/皇帝(约 7 层)。
    - 控制机制:标准化考试(科举内容统一)、行政法规(大清会典/大明会典)、
      奏折制度、考成法(绩效考核)。
    - 评估:这是砖最自然的支持案例——皇帝对基层的"实际控制力"与"名义皇权"
      之间的差距是众所周知的。"天高皇帝远""上有政策下有对策"是这种衰减的
      民间表述。科举-官僚体系的深度(7+层)确实导致了系统性控制衰减。
    - 但有一个反转:"控制衰减"在明清体系中不是因为信息逐层失真(虽然那也是
      真的),更主要是因为代理人的利益与委托人(皇帝)的利益不一致——即委托-
      代理问题,而非纯信息问题。砖当前仅强调"信息压缩/美化"机制,未区分信息
      衰减与激励不相容这两种不同的衰减来源。
    - 结果:【部分支持——但在机制层面暴露遗漏变量】。衰减确实存在(支持预测),
      但原因不限于信息失真(还有激励不相容、监管成本、共谋等)。砖的机制叙述
      (仅强调信息压缩/美化)不完整,未承认其他衰减渠道的存在。

    猎捕总结:
    五次定向猎捕未猎到 scope 内的干净净杀案例。主要困难不是缺乏反例,而是:
    (1) 数据不可及:最可能的挑战者(现代军队)的指挥效能数据是机密的。
    (2) 模型歧义:衰减的计算方式(绝对/相对、加法/乘法)未注册,导致同一案例
        在不同模型下结论不同(McDonald's)。
    (3) 概念弹性:"控制力衰减"本身覆盖了多种不同机制(信息失真、激励不相容、
        监管成本),任何观察到的衰减或非衰减都可以被其中某种机制"解释"。

    猎捕的结构性发现:
    砖的 falsifiability 之所以在猎捕中难以被触发,不是因为命题结构是护身符,
    而是因为命题在两个关键维度上精度不足:
    (i) 衰减的操作化定义(什么算"控制力",什么算"衰减",怎么算比例)
    (ii) 衰减的计算模型(绝对/相对、加法/乘法)
    这些精度不足使得同一个案例可以被双向解读。这不是 anti-talisman(没有
    预设的逃生门),而是测量不精确——可修。

  non_recurrence:
    DED-004_loop: |
      【未重蹈】。DED-004 死因=声称两个独立现象(记账与成文法)必然耦合,经验检验
      推翻后试图用打折版续命——属伪耦合型不可证伪。BR-L2-048 未声称两类独立现象
      必然耦合,其机制是单变量(层级深度→控制衰减),结构差异显著。

    DED-007_welded_axis: |
      【未重蹈】。DED-007 死因=测量轴焊死——自变量分母用"实际获授者"(结果侧信息)
      来判定,前件不可独立于后件测量。BR-L2-048 的 IV(层级深度——通过组织架构图
      计数)与 DV(控制力衰减——通过指令执行准确率测量)在方法和来源上分叉。
      不存在结构性焊点。falsifiability(a) 中"名义权力"基线的操作化是一个测量问题
      而非焊死问题——可以通过明确定义修复。

  required_fixes:
  - |
    Required ①: 核验或替换定量引用。逐条核查 applicable_sources 中每个具体数字
    能否在原著中定位到具体段落/表格:(a)Blau 的 15%/20%——若无法定位,降级为
    方向性引用"Blau 的方向性发现是层级增加→信息失真增加,但具体衰减率因研究
    设计而异";(b)Tsebelis 的 30%——若无法定位,降级或删除,Tsebelis 的框架
    本身不是层级衰减模型;(c)Huber & Shipan 的 40%——若无法定位,降级或删除。
    对于能核验的,保留数字并注明出处(页码/表格号);对于不能核验的,诚实标注
    "方向性支持,具体数字不可靠"。修后重新评估:砖的定量预测(≥10%/层)还剩下
    哪些可靠的经验支撑?如果都无法核验,考虑将命题从"已验证的定量规律"重定位为
    "可检验的定量假设"。
  - |
    Required ②: 区分不同构念,停止跨构造混淆。砖当前将"信息偏向""细节遗漏"
    "否决概率衰减""控制力下降"四个不同构念统一在"控制力衰减"帽子下。修法:
    要么(1)为"控制力"给出精确定义,限定其测量范围(如仅用"指令执行准确率"),
    并只引用直接测量该构念的文献(当前仅有 Huber & Shipan 接近,但仍不是精确匹配);
    要么(2)分别注册不同维度的衰减(信息保真度衰减/执行保真度衰减/制度概率衰减)
    及其各自的下界,诚实标注它们不完全可公度。修后砖的预测可能需要从单一的
    "≥10%控制力衰减/层"变为"≥10%信息保真度衰减/层 + ≥X%执行衰减/层",
    或承认跨构念综合的局限性。
  - |
    Required ③: 修正 Michels 引用方向。要么(1)删除 Michels 引用,替换为方向
    一致的权威来源(如 Downs 1967 "Inside Bureaucracy"的控制递减律,或
    Williamson 1967 "Hierarchical Control and Optimum Firm Size"的控制损失
    概念);要么(2)保留 Michels 但精确限定:Michels 观察到的是权力在领导层
    小圈子内的【集中】,本命题关注的是领导层对基层的【控制衰减】——两者可能是
    互补现象(顶层小圈子集权+顶层对基层失控同时存在),但需要明确论证这一关系,
    而非暗示 Michels 支持砖的衰减主张。
  - |
    should: 操作化"名义权力"作为 falsifiability(a)的比较基准。明确注册:
    "名义权力在此操作化为:在正式层级制度下,命令被预期以 100% 执行准确率
    传递(因为层级定义本身包含'上层对下层具有更大决策权')。因此,指令执行
    准确率与 100% 的偏差即为'名义权力与实际控制力之差距'。"或提供替代的
    操作化方案(如通过组织章程/岗位描述中的正式权限列表来量化名义权力)。
  - |
    should: 澄清衰减的计算模型。注册:(a)衰减是绝对百分点(如从 100%到 90%
    =下降 10 个百分点)还是相对比例(如从 100%到 90%=下降 10%)?(b)多层的
    衰减是加法(每层独立贡献 10pp,总衰减=层数×10pp)还是乘法(每层保留 90%,
    n 层后保真度=0.9^n)?(c)"非线性衰减"与"≥10%/层"的关系——如果衰减是
    非线性的,函数形式是什么?建议:采用乘法模型(0.9^n),因其与 THEOREM-
    hierarchy-depth-limit 的 r^n 框架一致,且"非线性衰减"自然成立(指数函数
    是非线性的)。修后预测应明确写出:实际控制力≈名义权力×0.9^深度。
  - |
    should: 完成 IEA 调查并写入 cross_verification 段。按 independence-model.yaml
    的 instrument_correlation.discount_rule + data_source_origin.discount_rule
    诚实地应用双折扣。调查后 IEA 需 ≥1.2 方可判 verified。注意:若 Required ①
    导致部分来源被降级或移除,重新评估后的 IEA 可能跌破 1.2,需补充异源独立来源。
  - |
    should: 在 statement 中补充机制叙述的完整性。当前砖仅强调信息压缩/美化作为
    衰减机制,但控制衰减至少有三个独立渠道:(1)信息失真(砖已覆盖);(2)激励不相容
    (代理人的利益与委托人不同,选择性执行非因信息问题而是因动机问题);(3)监管
    成本(上级没有足够资源核查下级的执行质量)。建议在 statement 中承认多机制并存,
    并声明本命题的"≥10%/层"是针对信息失真渠道的估计,不涵盖激励和监管渠道的
    额外衰减。

round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（层级深度↑ → 信息失真 → 控制力衰减）方向正确，且与 THEOREM-hierarchy-depth-limit 一脉相承。但从"信息失真"扩展到"三维度统一控制力衰减"存在跨构造膨胀：(1) 三个维度（信息、执行、政策一致性）的衰减机制各自独立，作者承认"不可直接对比"却仍把三者的具体阈值（≥10%/≥10%/≥30%）装进同一个"可检验预测"段落，等于自打嘴巴；(2) 适用源中 Michels 出现两条且方向相反（"集中且有效" vs "无法有效指挥"），自相矛盾未被消化；(3) Blau 15%/20%、Tsebelis 30%、Huber-Shipan 40% 这些百分比在原著中均为方向性示意或不同构念的统计量，被改写为精确阈值缺乏一手出处；(4) 反向失败模式（实时监控可能让实际控制力 > 名义权力）未注册。falsifiability 三条基本清晰，无 DED-004 循环。反例猎捕未找到净杀，但揭示"政策一致性"维度在教义型组织（天主教会）中衰减极低，提示缺少任务类型调节变量。DED-007 边缘复发——三个维度的"统一衰减方向"因测量轴混用而接近空洞描述。
  red_flags: |
    1. brick=conclusion — 部分命中：THEOREM-hierarchy-depth-limit 只承诺信息失真，不直接承诺执行准确率/政策一致性衰减，跨构造膨胀。
    2. 逐格判空 — 命中：三个维度的阈值（10%/10%/30%）是不同构念的数字拼盘，作者自认"不可直接对比"却保留为统一预测。
    3. 测量轴正交 — 部分命中：三个因变量（信息偏向、执行符合率、政策一致性）不是同源潜在变量的不同面，而是三个独立构念被装进"控制力"标签。
    4. 射程/排除钩子 — 未命中：排除条件诚实。
    5. 分类判据档位 — 未命中：连续衰减处理得当。
    6. anti-talisman — 部分命中：管理幅度与控制力的测量非直接观测，多为统计模型推断。
    7. 现实锚事实核查 — 命中：Michels 两条引用方向相反；Blau/Tsebelis/Huber-Shipan 的具体百分比在原著中并非直接报告的精确数字。
    8. 条件是下定义还是做预测 — 未命中：falsifiability 给出清晰预测。
    9. 枚举穷尽 — 未命中：不适用。
    10. primary_suspect — 命中：更致命软肋是泛化后被稀释成"层级深→控制弱"的委托-代理常识，跨构造膨胀是元问题。
    11. 口径完整注册 — 部分命中：falsifiability 给了示例口径但不够完整注册。
    12. 数据源同根 — 未命中：不适用，源独立。
    13. API 可及性 — 未命中：不适用。
    14. 反向失败模式缺失 — 命中：falsifiability (c) 注册了"实时监控可缓解"，但未注册"实时监控可能让实际控制力 > 名义权力"的反向。
    15. Bootstrap 限定 — 未命中：不适用。
    16. 验证对象存在性 — 未命中：不适用。
  counterexample_hunt: |
    构造两类反例：
    (1) 天主教会：层级深度极大（教皇→枢机→总主教→主教→神父→教区，约 6 层），但"政策一致性"（教义核心）在千年尺度上衰减极低。结论：被消化但暴露过度伸张——教义型组织与行政型组织的政策一致性衰减机制不同，本推论未注册任务类型作为调节变量，强行合并导致"政策一致性下降≥30%"的预测对教会类组织过度泛化。
    (2) 军队层级（10+ 层）：高度层级化但执行指令纪律性极强。结论：被消化——军队通过专门训练扩大了"有效管理幅度"，未超过上限所以不反例化推论。
    净杀：无。揭出过度伸张：政策一致性维度缺少任务类型调节变量。
  required_fixes:
    - "1) 解决 Michels 引用方向矛盾——applicable_sources 中两条 Michels 方向相反，须选定其一并明确本推论与 Michels 的关系（是补充、反驳还是机制同源），删除方向错误的条目。"
    - "2) 真正消化跨构造混淆——三个维度（信息、执行、政策一致性）要么拆成三条独立推论分别预测，要么只以\"信息维度衰减\"为核心预测（与 THEOREM-hierarchy-depth-limit 严格对应），删除另外两个维度的具体阈值。"
    - "3) 降级引用数字精度——Blau 15%/20%、Tsebelis 30%、Huber-Shipan 40% 在原著中均为示意性或不同构念统计量，须在 applicable_sources 中明确标注\"方向性，非原著直接报告的精确数字\"，并从可检验预测中删除具体的≥10%/≥10%/≥30%阈值，改为\"各维度均表现出可测量的方向性衰减\"或注册具体出处。"
    - "4) 注册反向失败模式——在 falsifiability 中增加一条：若引入实时监控后实际控制力反而超过名义权力（监控创造新权力），则本命题需要细化。"
    - "5) 注册任务类型调节变量——明确\"政策一致性下降≥30%\"仅适用于行政型组织，教义型/仪式型组织的政策一致性衰减机制不同，不适用本阈值。"
  oneline: |
    核心方向对但跨构造膨胀未真正消化——三个不同构念的衰减率被硬塞进同一预测，引用数字精度虚假，Michels 自相矛盾，必须定向修订才能 verified。

round_3:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 3, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制方向成立：层级深度→多维度控制衰减的因果链条在理论框架内自洽，且r2修复了Michels方向矛盾、跨构造混淆、数字精度问题。但判verified的关键门——反例猎捕——揭出一个required级过度伸张：命题将"行政型组织衰减30%量级"作为有实证参考的核心预测，却对"实时监控可完全消除衰减"（falsifiability c）设有豁免条款（"顶层可通过技术手段部分缓解衰减"），构成预注册漏洞式的不对称——把有利证据（部分缓解）注册进来，把不利证据（完全消除）排除出去。此外，反例猎捕还命中一个should级问题：命题声称三维度衰减"方向一致"，但instruction execution维度在命令链与反馈链方向相反的案例（如开源软件组织）未被消化。下面逐条说。
  red_flags: |
    1. brick=conclusion — 未命中。THEOREM-hierarchy-depth-limit只覆盖信息衰减一个维度，本砖扩展到指令执行和政策一致性两个新维度，非trivial。
    2. 逐格判空 — 命中(部分)。"层级深度每增一层，三个维度均衰减"是真经验主张而非同义反复；但"30%量级"作为行政型组织的预测未给出测量口径。
    3. 测量轴正交(DED-007) — 命中(should)。三个维度的测量（信息准确率、执行准确率、政策一致性）若使用同一批样本/同一信息源，存在隐藏焊点风险。命题未声明三维度是否使用独立测量链。
    4. 射程/排除钩子独立于结果(DED-005) — 命中(required)。falsifiability(c)声称"实时监控完全消除衰减"可证伪，但statement限制条款说"顶层可通过技术手段部分缓解衰减"——这把"完全消除"作为反例排除，只接受"部分缓解"作为兼容结果。钩子事后开脱于推论有利方向，构成预注册漏洞。
    5. 分类判据档位匹配(DED-006) — 未命中。任务类型二分（行政型vs教义/仪式型）针对的是连续变量，按二分处理有粗糙嫌疑，但命题已声明"不适用同一阈值"作为限定，可接受。
    6. anti-talisman真兑现 — 未命中。三个维度的衰减方向分别引用Blau(信息)、Tsebelis(政策)、Huber&Shipan(执行)，各自有独立文献锚。
    7. 现实锚事实核查 — 命中(should)。Blau原文是否真的报告"15%/20%"这两个数字存疑；Tsebelis的"30%"被原r2已标注为"非原著直接报告"——这是r2修复的一部分，但statement主体中"30%量级"的表述仍模糊，需明确这是"数量级示意"还是"经验锚"。
    8. 条件是下定义还是做预测 — 未命中。"层级深度超过有效管理幅度上限"是可观测的，不是定义。
    9. 枚举穷尽+species按判据定义 — 未命中。任务类型只列两类，未声称穷尽。
    10. primary_suspect指对+平凡化检查 — 命中(required)。命题最大的软肋不是作者自认的"数字精度"，而是falsifiability(c)与statement限制条款之间的不对称——这是预注册漏洞式的不对称，比数字精度更致命。命题是否被泛化成委托-代理"需问责"的常识？部分维度是的，但"政策一致性衰减因任务类型而异"这一限定有非平凡增量。
    11. 口径完整注册+歧义反向裁决 — 命中(required)。"30%量级"未注册测量口径（什么任务的执行准确率？哪个时间段？哪个行政型组织子类？）。按L4-009判例，边界案例（如中共党-国体系，层级深但执行一致性极高）的裁决需要预注册口径。
    12. 数据源同根冒充多源独立 — 未命中。Blau/Tsebelis/Huber&Shipan是独立学者的独立研究。
    13. API可及性冒充认识论独立性 — 未命中。本推论不涉及API数据。
    14. 反向失败模式缺失 — 命中(should)。已注册"监控增强控制"作为反向模式（falsifiability d），但未注册另一个反向模式：层级深度增加反而提升控制力的案例（如高仪式化组织中，层级本身是控制工具）。
    15. Bootstrap限定缺失 — 未命中。本推论不涉及新技术介导。
    16. 验证对象存在性未标注 — 未命中。组织层级是普遍现象。
  counterexample_hunt: |
    构造反例1：开源软件组织（如Linux kernel开发）。层级极扁平（≤3层），但"控制力"通过meritocratic reputation实现——顶层（Torvalds）的实际控制力远超其正式权力，且不随层级深度衰减。消化：命题限定的是"层级深度超过有效管理幅度"的组织，开源组织的层级浅，不在射程内。

    构造反例2：中国共产党-国家体系。层级深度≥6层，但政策一致性（自上而下的运动式治理执行率）历史数据显示可超过80%。命中required级过度伸张：命题声称行政型组织"衰减较为明显（下降可达30%量级）"，但党-国体系的运动式治理期间，指令执行准确率反因层级深度而提高（动员机制压缩了衰减通道）。这一案例要么要求命题限定"非运动式治理的常规行政型组织"，要么承认衰减率不是单调的。

    构造反例3：天主教教会。层级深度≥7层（教皇→枢机→总主教→主教→教区→堂区→信众），但教义统一性极高（尼西亚信经2000年基本不变）。消化：命题已限定"教义型组织不适用同一阈值"，被消化。

    构造反例4：瑞典政府。层级深度5-6层，但因其高度透明的信息系统，政策一致性衰减极小。命中falsifiability(c)的灰区：命题限制条款说"部分缓解"，但瑞典案例接近"完全缓解"——这要求命题明确"部分缓解"的上限是多少（如<50%缓解算"部分"，≥90%算"完全"）。

    净杀：无。最大收获是揭出falsifiability(c)与限制条款之间的不对称（required），以及"30%量级"的口径未注册（required）。
