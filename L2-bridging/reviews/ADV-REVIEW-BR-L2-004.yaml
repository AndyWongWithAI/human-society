            恰好反套砖的核心预测方向(规模>~150就顶不住)。Amish并非'无层级'
            (主教/牧师/执事为正式职位),而是通过分裂将每个单元的规模压在线下。
            这构成对砖的间接支持:层级是规模压力的应对方案,若想避免它就得分裂。
        - case: '大型贵格会(Quaker)年会的纯共识治理'
          outcome: |
            维持round_1消化结论。大型年会有clerk制度,clerk的'辨明会议心意'
            角色含议程权+总结权——虽非投票否决权,但议程设定权即测量指标二。
            Clerk职位通常由有经验者长期担任(非短期轮换),构成常态化决策权
            不对称。非反例。
        - case: 'DAO(去中心化自治组织),如MakerDAO(2015-,>10年,>1000持币者)'
          outcome: |
            不进入scope:存续~11年不满足>20年条件。且即使进入:(a)DAO的治理
            代币即制度化投票权(1 token=1 vote或类似),代币分布不均=资源分配权
            不对称的精确形式;(b)大多数DAO有核心开发团队+多签委员会,即事实
            上的执行层级。号称'去中心化'的组织在实践中迅速再中心化——这反而
            反套砖的预测(层级涌现不可抵抗)。非反例。
        - case: 'Wikipedia编辑社群(2001-,>24年,>100,000活跃编辑)'
          outcome: |
            确认层级存在。Wikipedia的权限阶梯(steward→bureaucrat→admin→
            autoconfirmed→IP editor)构成正式职位体系(有名称/明示权责/
            晋升规程)。Admin拥有删除/保护页面/封禁用户等约束力权限,
            远超'非捆绑式建议'。高度层级化。非反例。
        - case: 'Rojava/北叙利亚民主邦联主义(2014-,~12年)'
          outcome: |
            仍不进入scope(存续<20年)。补充观察:commune→council→cantonal
            多层协调体系虽以共识/轮值为原则,但层级结构已深度制度化。
            军事力量(YPG/YPJ/SDF)有刚性指挥链。正逼近20年线,历史会给出
            最终检验——若到2034年再无层级的实质扩展,可触发重审。
            当前不构成活反例。
      assessment: |
        两轮共14个案猎捕(round_1的7案+本轮追加7案),覆盖狩猎采集者/
        海盗/基布兹/贵格会/原住民邦联/分割型部落/占领运动/自治公社/
        DAO/数字社区/宗教社区/革命政体。未获任何满足全部证伪条件的干净
        活反例(>200人+>20年+完全无超三类排除的决策权不对称)。

        猎捕暴露出一个规律性模式:凡是满足前两个门槛条件(>200+>20年)的
        群体,层级以某种形式不可避免——要么显式(正式职位/指挥链,如
        Wikipedia/Iroquois),要么隐式(议程权/信息权不对称,如贵格会clerk),
        要么通过分裂维持小规模(如Amish,间接支持)。唯一的擦边案例是
        Zapatista caracoles的极快轮值(1-2周),但JBG的约束力裁决权将其
        推出(ii)排除范围。

        这不是因为命题的证伪窗口窄——证伪窗口(200+20年)本身在人类历史
        上是常见的群体规模-持续性组合,大量案例落入此窗口。落入窗口的案例
        却无一通不过层级检测,说明命题在经验上有区分力。若层级判定仅靠
        '常态化'弹性模糊,则Zapatista/DAO等边缘案例会在定义战中成为争议
        焦点;但三类排除+三指标的组合提供了干净的裁决规则,使得即使在
        最难判的边缘案例中,判定方向也明确且一致(均指向层级存在)。
