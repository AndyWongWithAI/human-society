id: ADV-REVIEW-BR-L2-004
target: BR-L2-004
review_type: adversarial_review
rounds:
  round_1:
    reviewer: |
      独立对抗审查者(L2桥接砖审查管线)。全新上下文,与写砖者及IEA调查员无关。
      职责:尽最大努力打穿BR-L2-004,给硬裁决。默认怀疑,宁可错杀不放水。
    verdict: needs_revision
    verdict_note: |
      BR-L2-004有真实的经验内核——~150人阈值(Dunbar数)作为层级涌现的经验标度
      不是任何L1实体的复述。但存在四个required级缺陷:(1)层级操作性定义过宽,
      '任何常态化的决策权不对称'可吸收几乎所有潜在反例,anti-talisman未兑现;
      (2)~150阈值的机制来源(Dunbar社会脑)与砖声称的机制(O(n²)协调成本)
      是两条不同的经验链,砖未区分,造成机制缝合假象——O(n²)本身不预测~150;
      (3)IEA对阈值特异性证据实质上是单一来源(evo_bio),游戏论和文化普适
      只支持方向不验证阈值,独立性虚高;(4)'必然'一词过强,L2是经验命题应
      降为强经验规律。这些均可通过定向修订修复,不构成核心坍塌(rejected门槛),
      故判needs_revision。
    red_flags:
      brick_is_conclusion:
        verdict: 未命中(攻不穿)
        detail: |
          CONCEPT-hierarchy已编码了'层级降低协调成本O(n²)'的功能理由,且
          THEOREM-hierarchy-depth-limit涉及层级的信息衰减极限。但两者均未声称
          层级在群体规模超过某一经验阈值时【必然涌现】——这是一个真正的经验命题。
          ~150的具体数字来自Dunbar灵长类社会脑假说(经验观察),不是任何L1定义。
          CONCEPT-hierarchy说层级'是方案'(一种可能),未说它'必然'在~150出现;
          THEOREM-hierarchy-depth-limit说的是已存在层级的深度上限,不是层级是否
          会在特定规模出现。因此砖含有L1未编码的非平凡经验内核,不命中brick=conclusion。

          但这不意味着砖毫无问题——见下anti-talisman和mechanism_disconnect。
      逐格判空:
        verdict: 未命中
        detail: |
          核心空格:'群体>~150人+持续>20年→必然出现层级'。如果层级被操作
          化为独立于群体规模的可检测状态(如是否存在正式化决策位、常设领导角色),
          这是一个真正的经验预测——它禁止'大群体永远无层级'这个可能世界。
          反例猎捕(见下)未找到干净活反例,但这不是因为命题完美——而是因为
          层级的当前定义弹性过大(见anti-talisman),边界案例的裁决方向不确定。
          空格本身不是同义反复(不是'有层级的群体就有层级'),但需要收紧操作性
          定义后才能判定是否真可检验。
      测量轴正交:
        verdict: 未命中(有警告)
        detail: |
          IV(群体规模)通过计数测量,独立于DV(层级存在与否)。Dunbar数本身从
          灵长类新皮层比率推算(非层级数据),两条轴异源。

          警告:砖的~150阈值来自Dunbar社会认知限制(一个人能维持稳定社交关系的
          上限),但砖的机制论证用的是O(n²)协调成本——这两个机制在数学上【不是
          同一件事】。社交关系数是O(n),协调信道数是O(n²),它们在不同n值处
          撞上可行边界。砖让它们共享同一个~150阈值,存在事后缝合嫌疑——先用
          Dunbar数定阈值,再用O(n²)讲道理。这种'双机制共享同一数字'的结构,
          若阈值事先不是从O(n²)推导出来的,就构成一种隐式测量轴焊点:
          阈值不独立于机制声称。此为warning而非required,因为Dunbar数本身
          是独立测量的,只是砖未诚实区分两条证据链。
      excluded_outcomes_independence:
        verdict: 命中(should级)
        detail: |
          证伪条款使用了两个缓冲参数:(a)200人(>150的缓冲区),(b)20年(一代人)。
          这两个参数方向合理(理论需要缓冲区),但选择的具体值未被论证:为什么是
          200不是180?为什么是20年不是15或30?如果作者在见到反例后调整了这些
          数字,那就构成DED-004/DED-007式的射程后门。当前未见调整证据,但缺乏
          预先论证,判定为should级:建议补充缓冲区选择的理由(如Dunbar观测的
          95%置信区间上界、社会结构稳定的代际定义),或明示其为'可争论的经验
          边距'而非护身符。
      classification_granularity_match:
        verdict: 未命中
        detail: |
          砖做的是二元判断(有/无层级),被救对象是门槛性命题(群体规模超过某
          点后出现层级)。层级本身虽是连续的(影响力梯度→正式层级→刚性等级),
          但命题关注的是存在性而非程度,二元分档合理。不需要分层级程度谱。
      anti_talisman_delivery:
        verdict: 命中(required级)
        detail: |
          这是本砖最严重的缺陷。证伪条款说'完全没有层级结构——所有决策全对等
          参与,无任何常态化的决策权不对称'。问题出在'常态化'这三个字:

          (a)若'常态化'=正式制度化的角色(有名称、有任期、有明示权责),则
          大量无正式官衔但事实上有人说了算的群体(如自治公社的'大家公认的
          有威望的老人')算不算有层级?若算,'非正式层级'使命题更难被证伪;
          若不算,命题可能被大量200+人的非正式层级群体推翻。

          (b)若'常态化'=反复出现的模式(即使每次参与人不同),则轮值制(如
          Zapatista caracoles的轮值委员会)在轮值期间存在临时决策权不对称——
          这种'角色常态化但人员轮替'算不算层级?砖未给出裁决。

          (c)最关键的前件判定问题:一个200+人群体存续了25年,研究者去调查
          它是否有层级。研究者如何在不事先知道层级定义弹性范围的情况下,
          独立判断'这个群体有没有常态化决策权不对称'?如果'有人更有影响力'
          就算层级,那几乎任何人类群体都有——前件判定实质上依赖直觉而非操作规程。

          综上,anti-talisman未兑现:层级的存在判定无法在见到结果后不产生争议;
          边界的弹性使理论可以通过定义伸缩吸收反例。修复方向:必须给出排除层级
          的操作性判据——至少列出三种【即使有影响力差异也不构成层级的组织形态】,
          且这三种形态的划定独立于群体规模。这是required级,不修则推论不可证伪。
      anchor_fact_check:
        verdict: 未命中(有小注)
        detail: |
          三个经验锚点逐一核查:
          (1)Dunbar~150:稳健。灵长类新皮层比率与群体规模的log-log回归斜率
          经30年多数据集验证(Dunbar 1992,1998,2010),人类~150的预测从狩猎采
          集族群(25-50→季节性聚合~150)、军事单位(连队~100-200)、学术合作
          网络等多渠道收敛。事实基础扎实。

          (2)灵长类支配等级:狒狒到黑猩猩的支配等级文献充足,无争议。

          (3)所有超越狩猎采集规模的复杂社会都有层级:方向正确但需加注——这句话
          中的'复杂'若以'有层级'为判据则循环,但跨文化田野(酋邦→王国→帝国)
          确认为稳健的经验规律,且有George Murdock/Herbert Spencer等经典框架的
          独立支撑。

          小注:人种志记录中存在一些'有组织的无政府'社会(如部分分割型部落),
          它们超过150人但不服从单一领导——但它们内部有长老会议/年龄组等层级
          分化。目前未见对锚点的严重事实错误。
      condition_definition_vs_prediction:
        verdict: 命中(should级)
        detail: |
          砖的核心条件'层级'是定义出来的(CONCEPT-hierarchy已定义),但砖进一步
          声称层级在~150【必然】出现——这已从定义跳到了预测。然而,层级的操作
          化定义若不够锋利(见anti-talisman),'必然出现'的预测就可能退化为
          '我们会把观察到的决策影响力差异解释为层级'——即从预测滑向定义。

          目前的危险:若'常态化决策权不对称'的操作化不预先锁死,遇到可疑案例时
          可以通过重新定义'什么算层级'来维持'必然'——这使'必然'从预测沦
          为下定义('大于150的群体必然有我们定义为层级的东西')。should级:
          把层级操作化收紧(与anti-talisman联动修复)后,这个问题自行消退。
      enumeration_exhaustiveness:
        verdict: 未命中
        detail: |
          砖未声称'层级有N种类型可枚举',不涉及枚举穷尽问题。
      primary_suspect_accuracy:
        verdict: 命中(should级)
        detail: |
          砖文件无primary_suspect字段(L2格式不自带),但审查者自行诊断最弱腿:

          最致命软肋=anti-talisman兑现(已在红旗6标required)。

          次致命软肋=机制缝合(已在测量轴正交警告):Dunbar社会脑(~150来自
          关系追踪上限)与O(n²)协调成本(信道数爆炸)是两条独立的经验链,
          砖将它们缝合在同一阈值下而未区分——O(n²)本身预测的临界点取决于
          单次协调成本、可接受总成本等参数,不必然堆到~150。这两条链恰好
          在~150处交汇是经验巧合还是深层同构?砖未回答。

          第三软肋:'必然'一词过强,见下一条。
      caliber_completeness:
        verdict: 命中(should级)
        detail: |
          证伪条件注册了阈值(>200)、时间窗口(>20年)、和DV定义('无任何常
          态化决策权不对称')。但以下口径缺失:
          - 群体规模如何计数?成员/常驻人口/参与决策者?
          - '一代人=20年'的论证依据?
          - 200缓冲区的依据?(为什么不是150+2σ?)
          - '决策权不对称'的测量规程?(需要观察哪些行为指标?需要多少证据
          才能定论'存在'?)

          这些缺失不构成required——理论在早期阶段有权留缓冲——但仍属should级
          改进项:至少需要在证伪协议中声明'这些参数可在经验检验前精化'。
    iea_independence_check:
      result: 独立性虚高(does_not_falsify_verified但需披露)
      detail: |
        核算:IEA = 1.0(evo_bio锚) + 0.4(gt对锚折算,coefficient=0.4) + 0.6(cu对锚折算,
        coefficient=0.6) = 2.0。数学计算本身正确,超verified阈值1.8。

        但独立性结构存在实质性弱点:

        (1)阈值特异性单源问题:
        砖的核心经验主张=层级在~150涌现。这条主张分为两个子主张:
          子主张A(方向):层级随规模↑概率↑\层级减少协调成本
          子主张B(阈值):临界点≈150
        evo_bio同时支撑A和B(灵长类社会脑给出~150)。
        game_theory只支撑A(协调成本的机制方向),不支撑B(自述'不预测阈值')。
        cultural_universals只支撑A(复杂社会有层级的方向),不支撑B(自述'只确认相关不提供因果机制')。

        这意味着对子主张B(~150阈值),有效独立来源≈1.0(仅evo_bio锚)。
        砖的IEA=2.0主要反映子主张A的三角确证,而非对阈值特异性的独立验证。
        这不是计算错误,但属于独立性夸耀——三个'agree'声量掩盖了只有一个来源
        在验证阈值。

        (2)仪器折扣已披露,合规。
        cross_verification的instrument_disclosure诚实地报告了单一LLM执行折扣,
        并引用了META-REVIEW-001的honest_ceiling。措辞得体,不隐瞒。

        (3)共享语料重叠:
        game_theory与evo_bio共享'演化博弈论数学结构'(ESS,replicator dynamics,
        kin selection, signaling theory)——已在0.4系数中反映。
        cultural_universals与evo_bio共享'演化心理学/人类行为生态学'的理论
        框架——已在0.6系数中反映。
        这些折扣合理。

        综合判断:IEA的数学计算合规,仪器折扣已披露,但【阈值特异性独立验证
        不足】构成实质性缺陷。不是IEA造假,是证据结构使IEA=2.0的'两个准独立
        来源'印象对阈值主张并不诚实。这需要在砖中披露(见required_fixes),
        但不必然推翻verified——因为~150阈值本身已有Dunbar30年文献做多数据集
        收敛。
    counterexample_hunt:
      result: 未猎到scope内的干净活反例
      cases_searched:
        - case: '以色列基布兹(kibbutzim)早期激进平等主义阶段'
          outcome: |
            被消化。早期kibbutzim在全盛期通常<150核心成员;规模较大者设有
            委员会和轮值秘书——轮值秘书在任期内具备决策权不对称,构成广义层级。
            且关键反例缺失:没有>200人+20年+完全无常态决策权不对称的kibbutz记录。
        - case: '贵格会(Quakers)大型月会/年会'
          outcome: |
            被消化。贵格会商业会议可达数百人,实行共识决策+书记员(clerk)制度。
            clerk在"辨明会议心意"(discerning the sense of the meeting)过程中拥有
            议程权与总结权——这是一种温和但真实的常态决策权不对称。且个别会议
            规模>200时通常会拆分为小分会。
        - case: '圣(San/Bushmen)旱季水坑大聚集'
          outcome: |
            被消化。多支San小队在水源地聚集可超200人,维持平等主义规范
            (拉平机制:嘲讽/八卦/按需分享)。但(a)聚集是季节性临时(~1-3月),
            不满足>20年持续;(b)基本社会单元仍是小队(25-50人),决策在小队层级;
            (c)跨小队冲突通过非正式长老调解而非正式层级。若砖聚焦的是"稳定
            群体",此例不进入scope;但若砖声称的是"只要规模超~150就会出现层级
            ——即使临时",则此例接近擦边。当前砖的证伪条款明确了">20年",故
            不命中。
        - case: '罗贾瓦(Rojava)民主邦联主义(2014-)'
          outcome: |
            被消化。(a)存续时间~12年,未满20年;(b)体系内有 commune→
            council→cantonal 的多层协调,虽以共识/轮值为运作原则,但协调结构中
            存在事实上的议程设定权与信息权不对称;(c)军事组织(YPG/YPJ)有明确
            指挥链,属显式层级。不是无层级的干净案例。
        - case: '17世纪海盗船的民主治理'
          outcome: |
            被消化。海盗船有选举办船长+舵手(quartermaster)制,船长在战斗
            时独裁、平时受限。船队规模典型<150,不能满足>200的条件。此为规模的
            支持案例:海盗在有退出机制时选择了有限层级,说明在<150时层级是可选的
            而非必然——但砖本来就只声称>150必然,<150范围层级可选,海盗案例
            反而反套砖的预测方向。
        - case: '分割型部落(Segmentary Lineage Societies),如努尔人(Nuer)'
          outcome: |
            被消化。努尔人无中央权威,但(a)有豹皮酋长(leopard-skin chief)
            作为仪式性调解者(非政治权威但拥有宗教-仪式性不对称角色);(b)年龄组
            系统(age-set system)产生代际层级——年长组对年轻组有规范约束力;
            (c)部落分支在冲突时临时产生军事领导。这些结构中的影响力差分可被
            归类为"常态化的决策权不对称"的特定形式。分割型部落以"无国家"著称,
            但并非"无层级"——这恰是砖的关键区分。
        - case: 'Occupy Wall Street 及类似占领运动(2011-2012)'
          outcome: |
            不进入scope。短暂(<1年),远不满足>20年条件。但提供了有趣的
            边界观察:即使如此短暂的存续,运动内部也迅速出现了非正式权力结构
            ("栈主"/早起者/麦克风检查员),暗示层级涌现的速度可能很快——这
            偏支持而非反对砖。
      assessment: |
        猎捕未获净杀反例。但这不完全是因为命题无懈可击,而是因为:
        (a)砖的证伪条件(>200+>20年+无常态决策权不对称)设定了很高的反例门槛,
        满足前两个条件(>200+>20年)的人类群体几乎必然发展出某种形式的制度化
        角色分化——这是组织社会学的基本观察;
        (b)'常态化的决策权不对称'定义足够宽,使几乎所有符合前两条的案例
        都可被吸收。

        核心担忧:反例猎捕'没猎到'的原因可能不是命题强,而是证伪窗口窄。
        这构成anti-talisman红旗的实证支撑——层级操作性定义的弹性使理论在
        反例猎捕中过于安全。通过anti-talisman修复(收紧层级操作化定义)后,
        应重新猎捕:特别是为'非正式但有影响力'的案例提供明确分类规则。
    non_recurrence:
      DED-004_loop:
        verdict: 未重蹈
        detail: |
          DED-004死因='记账与成文法绑定出现'假说被20个古代政体经验检验推翻,
          再加'打折版'被第三轮审查驳回。BR-L2-004未犯同类错误——它不声称两种
          独立现象必然耦合,而是声称一个门槛效应(规模→层级)。其证伪条件也非
          DED-004式的事后打折维修,而是前置了证伪窗口。两个命题的结构差异显著。
      DED-007_welded_axis:
        verdict: 部分重蹈(警告)
        detail: |
          DED-007死因=测量轴焊死(通货三驱动用结果反推前件,前件不可独立测量)。
