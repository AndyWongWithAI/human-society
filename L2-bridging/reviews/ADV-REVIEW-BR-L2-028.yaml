    cultural_universals 0.3:mixed 判定+部分支撑折扣(0.6×0.5)沿 BR-L2-027
    判例,无虚高;该通道对核心(b)段确实只有间接支持,判 mixed 诚实。
    单 LLM 仪器折扣:已按 discount_rule 强制披露("IEA=1.8 是学科独立性上限,
    仪器有效独立性低于此"),并正确引用 mitigation(稳固共识文献缓解)与
    honest_ceiling 语义。未把共享语料来源当独立重复计权:三票中真正承重的
    独立性主张(锚源准实验/跨制度环境 DID 复现/跨文化民族志)在文献层面
    真实异源,LLM 单仪器读取的折扣已显式声明而非隐藏。
    零余量警示:1.8 恰在线上。这不是虚高(权重是被审查逐轮压出来的诚实
    位点),但意味着本砖的 verified 没有任何缓冲——已在 verdict_note 写明
    重审触发条件。结论:IEA 报告诚实,达标。
  counterexample_hunt: |
    本轮全新猎捕(不复用 round_1 的四个候选,scope=整改后命题):

    候选A(对(b)保障收缩支——逆向检验):中国 1990s 国企改革砸"铁饭碗"
    (医疗/养老/住房的单位保障骤减),家庭储蓄率同期大幅上升(Chamon & Prasad
    2010 AEJ-Macro;He, Huang, Liu & Zhu 关于国企改革与预防性储蓄的准实验)。
    结果:【反成支持】——保障收缩→私人缓冲上升,是替代关系的镜像方向确认,
    且与 NCMS(扩张方向)构成同一制度环境内的双向变异。
    候选B(对(a)最强猎杀尝试):墨西哥 Seguro Popular——大规模医保推开,
    King et al. 2009 Lancet 的整群随机评估在 10 个月内未发现家庭非医疗消费/
    储蓄的显著反应,表面上是"保障扩张、净消费反应为零"的候选证伪案例。
    结果:【被消化,且消化不靠护身符】——按(a)注册口径检验:该评估随访仅
    10 个月、有效参保率低,对储蓄率 1pp 变化的检验功效不足,CI 无法排除
    注册阈值,不满足"功效足以检出最小效应"的证伪门槛;且后续准实验文献
    发现 SP 显著降低灾难性医疗支出并降低预防性储蓄(方向顺向)。关键:
    这一消化走的是事前注册的功效条款(双条件),不是"更小效应仍可能存在"
    的托辞——注册口径同时规定了何种零结果【能】杀死命题(足功效+CI 排除
    1pp),证伪出口真实存在。
    候选C(对(b)风险敞口支——时序猎杀尝试):美国 1980-2007"大风险转移"
    (Hacker):收入波动性与医疗/养老风险个体化上升,家庭储蓄率却持续下降
    ——方向与"敞口↑→缓冲↑"相反。结果:【非净杀——被事前证据分层挡住】:
    宏观时序被信贷扩张、住房/股市资产升值(资产升值替代流量储蓄)严重混淆,
    而砖已事前把横截面/时序聚合证据双向注册为不承重(整改后此注册是对称的:
    顺向东亚与逆向美欧同等弃权),(b)的证伪窗口注册在微观层(控制生命周期
    与收入后跨数据集检验)——该层证据(Carroll-Samwick 等)方向稳定为正。
    非事后开脱,是事前口径的正当适用。
    候选D(对(c)整改后新口径的猎杀尝试):安第斯"盛宴经济"/中美洲 cargo
    体系——高风险农户把剩余大量投入节庆与仪式性开支而非可见储备,表面是
    "高敞口不积累缓冲"。结果:【被消化】——cargo/节庆开支本身是民族志中
    事前编码的互惠义务网络投资(可记录的转移与分享网络,在整改后的缓冲集
    清单内),且(c)的检验形式是同社会内高敞口 vs 低敞口家户的相对比较;
    实物侧证据(Rosenzweig & Wolpin 1993 印度耕牛、Fafchamps 等布基纳法索
    牲畜对天气冲击的缓冲)方向稳定。
    候选E(跨物种旁证):松鼠/橡树啄木鸟等贮食物种随环境波动性调整贮藏
    强度——机制的演化深度旁证,非独立票,不计权重。

    结论:无净杀。候选B 反向确认了(a)注册口径的双刃性(既封开脱也留死法),
    候选C 确认证据分层的对称性在整改后成立。核心存活,且比 round_1 更硬。
  non_recurrence: |
    DED-004(不可证伪循环):round_1 识别的两条事后开脱通道(功效托辞/亲族
    义务救援口)已被注册口径+禁追加条款事前封死;注册口径同时保留了真实
    证伪路径(足功效零结果可杀),未复发。DED-007(测量轴焊死):政策变异
    与家户结果异源正交,净化口径不用结果反推,未复发。L4-009(事后口径
    反向裁决):本轮逐案核查无边界案例依赖事后口径选择,未复发。
