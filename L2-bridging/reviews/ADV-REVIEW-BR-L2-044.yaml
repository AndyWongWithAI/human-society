  counterexample_hunt: |
    反例猎捕过程(亲自做,scope:零分离+利益量级可比≥20%情形下竞合是否能在两回合内不瓦解):

    **反例 1:IBM-Microsoft OS/2 合作(1987-1991)**
    - 结构:无独立法人,双方共用联合开发团队
    - 时间:同项目内同时合作开发与竞争(MS DOS vs OS/2)
    - 利益量级:OS/2 是双方旗舰产品,合作域占比远>20%
    - 结果:合作在 ~4 年内瓦解为纯竞争(MS 转向 Windows)
    - 周期:长期项目约跨 4 年,按产业周期(软件 2-3 年一迭代)≈1.5-2 回合
    - 裁决:**被消化**。落入"两个回合内瓦解"预测范围,符合本推论。

    **反例 2:1990 年代日韩半导体联盟(DRAM 联合研发)**
    - 结构:联合实验室共用人员
    - 时间:同窗口同时合作(技术开发)与竞争(市场份额)
    - 利益量级:技术合作域占比>30%
    - 结果:多家联盟在 3-5 年内瓦解(日本日立/三菱退出),或转为非正式合作
    - 周期:半导体周期约 3-4 年,跨 1-2 回合
    - 裁决:**被消化**。符合零分离短期瓦解。

    **反例 3:瑞士钟表产业集群竞合(Swatch 集团前 1980s)**
    - 这是潜在反例:瑞士钟表企业在 1970s-80s 长期在同地域既合作(共用零件供应商、技术工坊)又竞争(品牌差异化销售),看似零结构分离但稳定 20+ 年
    - 细查:**其实存在隐性时间分离**——机芯生产(合作)与终端品牌(竞争)在产业周期上是错开的;且部分企业通过专业分工(机芯厂 vs 品牌商)实现隐性结构分离
    - 裁决:**被消化**。所谓的"零分离"在细查下并不为零,符合推论的判据要求(只要满足结构/时间任一即可算分离)。

    **反例 4:开源联盟 vs 商业竞合(Linux 基金会 vs 各成员企业)**
    - 潜在反例:Red Hat/IBM/Intel 等在 Linux 基金会内合作开发,同时在云服务/服务器市场激烈竞争,看似无分离但稳定 20+ 年
    - 细查:**存在明确结构分离**——Linux 基金会作为独立法人(IP 管理、品牌、治理)与各成员商业实体分开;**时间分离**——合作项目(内核开发)与竞争活动(商业化)在年度节奏上错开
    - 裁决:**被消化**。分离度>0,不在预测范围。

    **反向模式猎捕**:
    - 真正稳态的零分离竞合关系在历史和当代样本中**几乎找不到**(经多轮审查者也反复确认这一空集信号)
    - 这正是 L4-009 判例所警示的"验证对象存在性未标注"风险——但本推论已通过"20% 利益量级"限定和"产业周期>5年按比例放大"做了诚实限定
    - 反向失败模式(分离度过强)已被 (e) 注册

    **反例猎捕总结**:四个案例无净杀,scope 内无活反例,反向失败模式已注册。
