id: ADV-REVIEW-BR-L2-044
type: adversarial_review
reviews: BR-L2-044
layer: L2-bridging

人话摘要: |
  对 BR-L2-044(竞合关系的稳定性条件)的 round-1 独立对抗审查。判 needs_revision:
  砖的核心直觉——竞合需要某种分离机制才稳定——方向正确且有管理文献支撑,
  不是空对空翻译。但有三条 required 级缺陷阻挡 verified:①限制条款的"信任/
  文化等非正式机制"把证伪窗口变成了逃生门,任何稳定案例都可归类为"非正式机制
  维持的混合态",使 falsifiability(a) 结构上不可操作;②"博弈周期"/"商业周期"
  既未定义又预测与证伪条件使用不同术语;③"分离机制"的操作性定义缺失,导致
  事后可无限追溯——任何成功案例都可以被说成"隐含了某种分离"。此外 IEA
  cross_verification 未完成、bridges_to 仅触及 L1 概念未连通定理、
  分离的"必要性而非充分性"在文献中已有证据但砖未承认。

target: BR-L2-044
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与写砖者及 IEA 调查员无关)。
  审查者阅读包通用红旗 16 条 + L2 专属 5 条(brick=conclusion / 测量轴正交 /
  anti-talisman / IEA 独立性诚实含单 LLM 折扣 / 反例猎捕必做)。
  默认怀疑,宁可错杀不放水。方法论 > 任何单条命题。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新独立上下文, 与写砖者及 IEA 调查员无关)"
  verdict: needs_revision
  verdict_note: |
    BR-L2-044 主张:竞合关系的稳定性取决于合作域与竞争域的分离度(认知/组织分离
    和时间分离),缺乏分离机制时竞合会在两个博弈周期内瓦解为纯竞争。该主张方向与
    管理学文献(Bengtsson & Kock 2000 分离原则; Brandenburger & Nalebuff 1996
    竞合概念; Raza-Ullah et al. 2014 张力管理模型)一致,不是 L1 概念的近义改写——
    CONCEPT-cooperation 和 CONCEPT-competition 的定义均未涉及"两者并存时的稳定性
    条件",砖提供的是一组有经验锚定的管理命题。非平凡内核:确认。

    但砖有三条 required 级缺陷阻挡 verified:

    【Required ① — anti-talisman 未兑现:限制条款的"信任/文化等非正式机制"
    构成结构性逃生门】
    砖的预测是绝对命题:"没有建立任何分离机制...则竞合关系将...瓦解为纯竞争。"
    但限制条款立即开了一个窗口:"不排除部分组织能通过信任或文化等非正式机制维持
    混合态。"这两句话之间存在结构性冲突:
    - 如果预测是绝对的("将瓦解"),找到一例稳定即证伪,限制条款不应存在。
    - 如果限制条款成立(信任/文化可维持混合态),预测就不是绝对的可证伪命题,
      因为任何被发现具有稳定竞合而无正式分离机制的案例,都可事后归类为
      "信任/文化维持的混合态"——逃生门已在 falsifiability 测试之前安好。

    这不是要求砖删除"信任/文化也可能维持竞合"这一观察(该观察在文献中确有
    依据——如 Fernandez et al. 发现非正式控制机制对竞合信息管理是必要的补充)。
    问题在于当前文本将"信任/文化"同时写进了限制条款(作为例外)和预测(作为隐含
    的 counterfactual——"如果没有分离,也没有信任/文化,就会崩"),却未注册区分
    二者的独立操作规程。一个结构上诚实的处理是:
    (i) 承认信任/文化等非正式机制是"另一种分离机制"——它们在认知层面实现了
        合作域与竞争域的区分(参与者心里清楚"现在我们是伙伴/现在是对手")。
        如果非正式机制能做到这一点,则它们与正式分离机制的功能等价,
        应被归入"分离机制"的概念伞下而非作为例外。
    (ii) 或者,将预测从绝对命题改为比较命题:"缺乏正式分离机制的竞合关系,
        其稳定性在统计上显著低于有正式分离机制者;信任/文化等非正式机制
        可以部分替代正式分离但效力较弱"——此时 falsifiability 也须同步
        改为比较检验(需注册效应量和统计阈值),而非当前的单例证伪结构。

    当前文本在绝对和相对之间摇摆,且"信任/文化"的例外条款使 falsifiability(a)
    在结构上不可操作——这是 required 级 anti-talisman 缺陷,必须修。

    【Required ② — "博弈周期"/"商业周期"既未定义又与预测使用不同术语】
    预测说"两个博弈周期",falsifiability(a) 说"三个商业周期":
    - "博弈周期"在博弈论文献中通常指一轮完整的策略性互动——但在组织间竞合中,
      什么算"一轮"?一次联合项目?一个产品开发周期?一个财年?未定义。
    - "商业周期"通常指宏观经济的繁荣-衰退循环(数年),与组织间博弈的时间尺度
      不匹配。
    - 两个术语指向不同的时间概念,砖未澄清它们是同义词还是指不同的东西。
    这直接冲击 falsifiability(a) 的可操作性:你无法判断一个稳定了"几年"的
    竞合是否跨过了"三个商业/博弈周期"的门槛。修法:选定一个术语,给出操作化
    定义(如"一个博弈周期=一次完整的联合项目从启动到交付"或"≥2个财年"),
    并在预测和 falsifiability 中统一使用。

    【Required ③ — "分离机制"的操作性定义缺失,导致事后无限追溯】
    砖列举了分离机制的三个例子(独立团队/分时管理/协议缓冲),但从未给出
    区分"分离机制"与"一般协调机制"的判决标准。这造成两道结构性漏洞:
    (1) falsifiability(a) 依赖判断"没有明确的组织分离"——如果"分离"的定义
        可以弹性扩张到涵盖任何形式的协作规矩(如例会制度、代码审查流程、
        非正式默契),则"没有分离"在现实中是一个空集,证伪条件永远不可触及。
    (2) 反例猎捕中观察到的案例(如 WebKit 开源社区的竞争者协作)恰恰暴露了
        这一边界模糊:开源治理(code review/committer层级/邮件列表共识)到底
        算不算"分离机制"?如果算,则砖的预测几乎不可证伪(因为任何稳定的协作
        都必然演化出某种治理机制);如果不算,则 WebKit 构成一个近距挑战。
        问题不在于答案是什么,而在于砖的当前文本没有提供判定工具。

    修法:在 statement 或 falsifiability 段落中注册"分离机制"的操作判据,
    至少覆盖两个维度:
    (a) 结构判据:合作活动与竞争活动是否由不同的人员/团队/法人实体执行?
    (b) 时间判据:合作互动与竞争互动是否发生在可区分的时间窗口?
    并声明:两个维度至少满足其一才算"存在分离机制"——不满足任一维度的
    纯认知分离(如"我们心里知道什么时候合作什么时候竞争")不算。
    这一判据收紧后,WebKit 案例因满足(b)时间判据(代码贡献时段 ≠ 市场
    竞争时段)而被砖消化——但这是通过明确的规则消化,而非模糊追溯。

    以上三条 required 全部修复后,再配合 IEA 调查完成(见下),可达 verified。

    【Should 级提醒】
    1. IEA cross_verification 未完成 — 砖仅有 applicable_sources(game_theory +
       organizational_behavior)两路,但无 cross_verification 段和 IEA 计权。
       L2 verified 要求 IEA ≥ 1.2,当前状态不可直接判 verified。
    2. bridges_to 仅触及 3 个 L1 概念(CONCEPT-cooperation/competition/goal),
       未连通任何定理。可考虑桥接到 THEOREM-conflict-cost(解释为什么混合域
       中的摩擦代价高于分离域)和 THEOREM-competition-norm(分离机制本身是
       竞合双方自发形成的"比赛规矩")——这将从"管理文献翻译"升级为
       "从公理推导出管理文献的观察"。
    3. 分离的"必要性而非充分性"在文献中已有证据 — Fernandez et al. 的
       卫星项目案例研究明确显示:组织分离不足以管理竞合中的所有张力,
       还需要整合(integration)与共同管理(co-management)。砖当前只强调
       分离的必要性,未承认分离不是充分条件。建议在 statement 中补充:
       "分离是稳定竞合的必要条件之一;在分离基础上,整合与共同管理进一步
       提升稳定性"——这无损砖的核心贡献,但提升了实证准确性。
    4. falsifiability(c) 的"行业平均"基准未注册 — "合作域违约率高于行业
       平均"中的"行业"指什么行业?竞合联盟的行业平均违约率是多少、从哪来?
       该基准的缺失使(c)的统计检验不可操作。

  red_flag_findings:
    brick_conclusion: |
      【未命中 required——有真实非平凡内核】。
      BR-L2-044 声称"竞合关系的稳定性取决于两个维度的分离度"。逐一核查
      L1 实体是否已涵盖这一主张:
      - CONCEPT-cooperation:定义合作是"自愿配合彼此行动,合起来总收益更大"。
        未涉及合作与竞争共存时的稳定性条件。
      - CONCEPT-competition:定义竞争是"多主体想要同一份不够分的资源"。
        未涉及与合作的互动。
      - CONCEPT-goal:定义目标是"主体想达到的状态"。未涉及多重目标的冲突。
      - THEOREM-conflict-cost:推导冲突比守规矩竞争更费资源。未触及合作与
        竞争如何共存。
      - THEOREM-competition-norm:推导反复碰面的竞争者会自发形成规矩。
        这是最接近的 L1 实体——分离机制可被理解为"竞合者自发形成的规矩"
        的一种——但定理未预测"分离度决定稳定性"这一具体机制。

      砖的非平凡经验增添包括:(i)识别了两类分离(领域分离与时间分离)作为
      自变量;(ii)做出了具体预测(无分离→两周期内瓦解);(iii)注册了三个
      独立 falsifiability 路径。这些不是 CONCEPT-cooperation 或 CONCEPT-
      competition 的定义改写。砖的厚度在 L2 桥接砖中属于中等——薄于
      BR-L2-004(层级普适性有 Dunbar 数的独立测量锚),但厚于纯粹定义翻译。
      结论:不命中 brick=conclusion 红旗。

    measurement_axis_orthogonal: |
      【攻不穿——大致正交,但分离的操作性定义影响测量独立性】。
      自变量(IV):合作域与竞争域的分离度——可通过组织结构分析(部门设置/
      团队名册)、时间分配记录(项目时间线/会议日程)、协议文本(合同条款/
      知识产权安排)等独立于结果的手段测量。
      被观测量(DV):竞合关系的稳定性——可通过联盟存续时长、合作协议续签
      次数、联合产出的连续性等测量。
      两条测量链在方法上分叉:IV 测的是结构安排(事前),DV 测的是关系结果
      (事后)。不存在 DED-007 式的分母偷用结果测的焊点。

      但存在一个边界风险:如果"分离机制"的操作性定义过于模糊,测量者可能
      在观测到稳定竞合后,反过来在组织结构中寻找"隐含的分离机制"并将其
      编码为"存在分离"——此时 IV 的赋值已被 DV 的知识污染。这是操作规程
      问题而非结构性焊死,且在 Required ③(分离机制操作定义)修复后将自然
      缓解。当前判断:红旗不命中 required。

    anti_talisman: |
      【命中——required,见 Required ①】。
      问题不在砖的正面主张——分离机制→稳定竞合的因果关系方向是真实的、
      可检验的。问题在限制条款的"信任/文化等非正式机制"维持混合态的例外。

      为什么这是护身符:
      (i) 预测是绝对命题("将瓦解")。绝对命题的证伪只需要一个反例。
          限制条款提前宣告"有些反例不算反例"——凡是通过信任/文化存活的,
          都是"例外"而非"证伪"。但砖没有提供独立于"它存活了"这个事实本身
          的操作规程来判定一个案例"是否由信任/文化维持"——于是"它存活了"
          既是待解释项,又是"信任/文化在起作用"的证据,形成认知闭环。
      (ii) 信任和文化是社会关系的通用润滑剂——几乎任何稳定的人类合作中
          都存在某种程度的信任和文化共识。将"信任/文化"设为例外条款,
          等同于宣布"凡是不符合预测的案例都是例外"——这不是证伪,
          这是免疫化。
      (iii) 与 DED-004 的不可证伪循环和 DED-007 的测量轴焊死不同,
          本砖的病理是"弹性例外条款侵蚀证伪窗口"——属 anti-talisman
          红旗下的第三种失败模式:预测够具体,但例外条款使预测不可触达。

      修法见 Required ①:要么将信任/文化归入"分离机制"的扩展定义
      (承认它们是认知层面的分离,功能等价于制度防火墙),要么将预测从
      绝对命题改为比较命题并同步修改 falsifiability 结构。

    real_world_anchor_factcheck: |
      【未命中 required——锚点文献真实,但有一处 nuance 缺失】。
      逐一核查 applicable_sources 引用的文献:

      1. Brandenburger & Nalebuff (1996) Co-opetition:
         — 竞合概念的奠基文献,其核心框架(价值网/PARTS)确实是该领域的
           标准参考。砖引用正确:他们确实区分了价值创造(合作)与价值分配
           (竞争)。事实准确。

      2. Axelrod (1984) 重复囚徒困境:
         — 演化博弈论文献中的经典,其"未来阴影"(shadow of the future)
           机制确实与砖的"时间分离度"逻辑一致:长期合作收益的显著性
           抑制短期背叛动机。砖的直接引用是间接的(通过 Axelrod 的框架
           解释时间维度),文献本身准确。

      3. Jayachandran et al. (1999) 多市场接触:
         — 多市场接触(multimarket contact)文献的核心发现是:企业在多个
           市场相遇时,竞争强度降低(相互克制效应)。这确实间接支持了
           "空间分离可降低竞争烈度"——但 Jayachandran et al. 的因果方向
           是"多点接触→降低竞争"而非"分离→稳定"。砖将其解读为"空间分离
           的间接支持"在方向上可以成立,但需注意原文献的机制是相互克制
           (mutual forbearance)而非领域分离(domain separation)。这是
           解读性引用而非事实错。

      4. Bengtsson & Kock (2000):
         — 竞合分离原则的经典文献,确实提出将合作与竞争分配至不同部门
           或市场的建议。引用准确,是砖的核心文献支柱。

      5. Raza-Ullah et al. (2014) 张力管理模型:
         — 确实提出认知分离是缓解竞合张力的关键。引用准确。

      6. Gnyawali & Park (2011) 中小企业竞合创新:
         — 确实发现时间窗口独立于竞争性产品上线时创新产出更高。引用准确。

      nuance 缺失:上述文献中的一部分(尤其是 Fernandez et al. 的后续研究,
      虽未被砖直接引用,但与 Bengtsson & Kock 属同一研究传统)已实证地显示
      分离不足以管理所有竞合张力——需要整合与共同管理作为补充。砖将所有
      证据汇总为"分离→稳定"的单一叙事,忽略了文献中的"分离+整合+共管"的
      更复杂图景。这不是事实错(砖未错误引用),而是选择性呈现。建议在
      statement 或 applicable_sources 中补充这一 nuance。

    condition_is_prediction_not_definition: |
      【未命中——是经验预测,但分离的定义模糊使其边界趋近定义性】。
      核心主张"缺乏分离→竞合瓦解"是可证伪的经验预测——其真值不由
      CONCEPT-cooperation 或 CONCEPT-competition 的定义担保,而由组织间
      竞合的实际存续/瓦解数据决定。

      但有一个边界问题:如果"分离"被定义得足够宽(任何使合作与竞争得以
      共存的结构都算"分离"),那么"缺乏分离→竞合瓦解"趋近于分析性真理——
      "使竞合得以稳定的东西"与"分离"成为同义词。这是概念弹性的风险,
      不是当前状态——当前砖通过列举 examples(独立团队/分时管理/协议缓冲)
      给出了具体含义,尚未滑入全盘定义性。但 Required ③(分离机制操作定义)
      修复时须注意不要将"分离"扩张为"任何使竞合稳定的结构",那会使命题
      分析化为真。

    enumeration_exhaustiveness: |
      【未命中】。砖未声称"N 类可枚举"的结构(如"竞合失败有三类原因"),
      不涉及该红旗。

    primary_suspect_and_trivialization: |
      【命中——should 级(本砖未设 primary_suspect 字段,L2 非强制)】。
      审查者自诊最弱腿排序:
      (1) 最致命软肋 = 限制条款的"信任/文化"逃生门(Required ①)。
          这是使 falsifiability 不可操作的结构性缺陷,也是反例猎捕中
          每个近距挑战都被消化的根因。
      (2) 次致命软肋 = "分离机制"操作性定义缺失(Required ③)。
          使 falsifiability(a) 的"没有明确的组织分离"这一关键前件
          无法被独立、可复现地判定。
      (3) 第三软肋 = "博弈周期/商业周期"未定义(Required ②)。
          影响较小(比前两条容易修)但属 required 因为直接冲击
          falsifiability 的可操作性。
      (4) 第四软肋 = bridges_to 仅触及 L1 概念,深度不足。
          砖的经验内核来自管理文献(Bengtsson & Kock, Brandenburger &
          Nalebuff 等),桥接功能主要表现为"将管理文献的实证发现翻译进
          公理体系的术语空间",而从公理推导出新预测的方向较弱。
          这不影响砖作为 bridge 的合法性(L2 的本职就是桥接经验),
          但厚度低于能"从公理独立推出文献未注意到的预测"的桥接砖。

      无被稀释为相邻理论常识的风险:竞合稳定性条件(Bengtsson & Kock 的
      分离原则及其后续修正)是组织理论中的一个专门研究传统,非"合作需要
      规矩"之类的泛泛之谈。

    caliber_completeness: |
      【命中——should 级,与 Required ①/②/③ 联动】。
      falsifiability 注册了三项证伪条件,覆盖面基本完整:
      (a) 无分离但稳定(测试必要性)
      (b) 域重叠+竞争立现但合作不解体(测试核心机制)
      (c) 有防火墙但仍频繁崩溃(测试充分性)

      但以下口径缺失削弱了其可操作性:
      — "三个商业/博弈周期"的时间跨度(Required ②)
      — "明确的组织分离"的判据(Required ③)
      — "信任/文化维持"与"分离机制存在"的区分(Required ①)
      — "行业平均"违约率的定义与基准值(falsifiability(c))

      这些不是"细节后补"层面的缺失——它们直接影响证伪测试能否执行。
      一旦三条 required 修复,口径完整度自然提升至可操作水平。

  iea_independence_check: |
    【IEA 未完成——blocking should】。

    砖仅注册了 applicable_sources(game_theory, organizational_behavior)
    两个来源,但无 cross_verification 段,无 IEA 计权,无 instrument_disclosure。

    审查者粗略估算(非正式,不能替代正式 IEA 调查):
    - organizational_behavior → 锚源 1.0。Bengtsson & Kock(2000) +
      Raza-Ullah et al.(2014) + Gnyawali & Park(2011) 是组织行为学/
      战略管理领域的成熟文献群,锚定合理。
    - game_theory → 0.5。Brandenburger & Nalebuff(1996) +
      Axelrod(1984) + Jayachandran et al.(1999) 属博弈论/产业组织
      经济学的分析传统。组织行为学与博弈论共享"策略性互动"的概念骨架
      但在方法论上分叉(案例研究/问卷 vs. 形式模型/计量),粗略取
      independence-model 的 default=0.6 再因共享概念骨架折至 0.5。
    - 粗略 IEA ≈ 1.5,在 ≥ 1.2 下限之上。但正式 IEA 调查需要:
      (i) 按 independence-model 查表确定系数
      (ii) 应用 data_source_origin 折扣(若组织管理文献引用了共享数据库)
      (iii) 写入 instrument_disclosure(单 LLM 执行折扣)
      (iv) 注册 cross_verification 的 evidence tags 与 verdict_note

    IEA 未完成是本砖当前不能判 verified 的硬障碍——L2 verified 要求
    IEA ≥ 1.2 且 cross_verification 已写入。这不是砖的命题缺陷,
    而是流程缺失。

    正式 IEA 调查时应特别关注:organizational_behavior 与 game_theory
    之间的理论独立性可能低于 surface appearance——两者的竞合分析都
    共享 Brandenburger & Nalebuff(1996) 作为奠基文本,且许多组织行为学
    的竞合研究在理论框架上直接引用博弈论概念(价值网/PARTS/added value)。
    这种跨学科理论扩散应反映在独立系数折扣中,避免将"同一理论传统的
    两个分支"计为"两个独立来源的汇聚"。

  counterexample_hunt: |
    主动猎捕(scope=组织间竞合关系,证伪目标=falsifiability(a)和(b)):
    寻找"两个组织在同一项目中无组织分离地同时合作与竞争,但竞合关系
    稳定持续超过多个商业周期"的案例。优先寻找:开源软件社区、行业标准
    制定组织、联合研发联盟。

    猎捕方向 1 —— WebKit 浏览器引擎(2001-2013+,Apple/Google/Samsung/
    Nokia/RIM/Intel 等竞争者):
    - 同一项目(WebKit 代码库),竞争者同时贡献代码(合作)与争夺浏览器/
      移动设备市场(竞争)。合作产出(代码改进)立即成为竞争筹码(更好的
      Chrome/Safari 各自增强竞争力)。持续 10 年以上。
    - 是否有"组织分离"? WebKit 采用开源治理(committer 层级/code review/
      邮件列表共识),但这不是砖所谓的"独立团队"式分离——代码贡献者与
      产品竞争者通常是同一批工程师(无功能分离),所有竞争者共享同一资源池
      (代码库)。开源的 code review 流程可被解释为"协议缓冲"类分离机制,
      但这种解释一旦成立,则任何稳定协作的治理机制都可被编码为"分离"。
    - 结果:【边缘挑战,不足净杀,但暴露 Required ③ 的定义弹性】。
      WebKit 的治理机制(code review 流程/committer 层级)是否满足砖的
      "组织分离"判据?当前砖未提供判定工具,因此该案例不能被 cleanly
      分类为证伪或支持——这种不可分类本身就是红旗。

    猎捕方向 2 —— 3GPP 与 5G 标准制定(1998-至今,高通/华为/爱立信/
    诺基亚/三星/苹果等竞争者):
    - 竞争者在同一标准制定项目中协作(撰写技术规范)同时竞争(将自己的
      专利推入标准以获取竞争优势)。标准会议上的每次发言既可以是合作
      (提出技术方案)也可以是竞争(为自己的专利铺路)。持续 25 年以上。
    - 3GPP 有正式的组织分离吗?有——工作组结构、主席中立性规则、IPR
      政策等都是"制度性防火墙"。因此 3GPP 是砖的支持案例,非反例。
    - 结果:【被消化——强支持案例。3GPP 的正式分离机制(工作组/主席规则/
      IPR 政策)完全符合砖的预测:制度性防火墙→稳定竞合】。

    猎捕方向 3 —— PyTorch/TensorFlow 公司托管开源项目(Meta/Google
    与外部竞争者):
    - 2025 年 ACM 研究显示,外部竞争公司对 PyTorch(属 Meta)和 TensorFlow
      (属 Google)的代码贡献占 20-25%,同时这些外部公司在 AI 市场上与
      托管公司直接竞争。项目治理由单一公司主导(非中立基金会),贡献者
      来自竞争公司,无独立团队分离。已持续 5-8 年。
    - 结果:【边界挑战——单厂商治理的"非中立"特征减少了形式分离,
      但代码贡献与产品竞争仍然是不同活动,存在领域分离。加上时间维度
      (贡献 vs. 竞争发生在不同时间段),可被砖消化。不构成净杀】。

    猎捕方向 4 —— 三星-索尼 S-LCD 合资企业(2004-2011):
    - 两家直接竞争者在 LCD 面板领域建立合资企业,共享生产线,共同开发
      技术,同时各自在电视市场上竞争。该合资持续 7 年。
    - 合资企业本身 IS 制度性防火墙——一个独立法人实体,有自己的管理
      团队和账目,分离了合作(LCD 面板联合生产)与竞争(各自电视品牌销售)。
    - 结果:【被消化——强支持案例。合资企业是制度性防火墙的教科书实例】。

    猎捕方向 5 —— Linux 内核开发(1991-至今,数百家竞争公司):
    - Intel/AMD/Red Hat/Oracle/Google/Samsung 等在 Linux 内核中协作的
      同时激烈竞争。贡献者来自同一批公司,代码在同一仓库,同一维护者
      体系。持续 30 年以上。
    - Linux 内核维护者体系(hierarchical maintainer model)和"上游优先"
      (upstream-first)原则是否构成"分离机制"? 这取决于如何定义"分离"——
      如果内核维护是技术治理(非竞争域与合作域的分离),则不构成砖意义上的
      "制度性防火墙";如果把"upstream-first 让竞争者在合并代码前先协作"
      视为协议缓冲,则构成。再次落入 Required ③ 的定义弹性。
    - 结果:【与 WebKit 同类的边缘挑战——非净杀,暴露定义弹性】。

    猎捕方向 6 —— 航空业代码共享(星空联盟/天合联盟/寰宇一家,1990s-至今):
    - UA 和 LH 在跨大西洋航线上共享代码(合作)同时争夺同一批乘客(竞争)。
      某些航线甚至出现"同一架飞机、两个航班号(各自卖票)"的完全重叠。
    - 代码共享协议本身是"协议缓冲"类分离机制——合作(联程票务/休息室
      共享)与竞争(各自定价/各自销售)通过合同条款分离。
    - 结果:【被消化——支持案例。"协议缓冲"恰好是砖列举的分离机制之一】。

    猎捕总结:
    六次定向猎捕未猎到 scope 内的干净净杀案例。四个案例(3GPP/S-LCD/
    Linux/航空代码共享)被明确的制度性防火墙消化。两个案例(WebKit/
    公司托管开源)构成边缘挑战但不足净杀,因为开源治理机制可被解释为
    某种形式的"分离"——但恰恰是这种"可以被解释"的弹性暴露了
    Required ③(分离机制操作定义缺失)的致命性。

    猎捕的结构性发现:
    (1) 任何持续存在的协作都必然演化出某种治理机制——这是组织生存的
        基本要求,不是竞合独有的。砖需要解释:"分离机制"与"一般治理机制"
        的区别是什么?如果所有稳定竞合案例中的治理机制都被编码为"分离",
        砖的预测只是换了一种方式说"稳定的东西之所以稳定是因为它有让它
        稳定的结构"——这趋近同义反复。
    (2) 开源软件生态是挑战砖的最有力领域,因为其治理机制(代码审查/
        维护者层级/上游优先)的核心功能是技术质量保障,而非竞争域与合作域
        的分离。如果把这些技术治理机制也归入"分离",则"分离"概念的边界
        被极大扩张——任何有 code review 的开源项目都"有分离机制",
        砖的 falsifiability 前提几乎不可触及。
    (3) 反例猎捕的结果与 Required ① 联动:三个边缘挑战全被"可以被
        解释为有分离"消化,没有一个能被 cleanly 归类——因为砖没有提供
        归类工具。这不是猎捕技术问题,是砖的设计问题。

  non_recurrence:
    DED-004_loop: |
      【未重蹈】。DED-004 死因=声称两个独立现象(记账与成文法)必然耦合,
      经验检验推翻后试图用打折版续命——属伪耦合型不可证伪。BR-L2-044
      未声称两类独立现象必然耦合,其机制是单变量(分离度→稳定性),
      结构差异显著。
    DED-007_welded_axis: |
      【未重蹈】。DED-007 死因=测量轴焊死——自变量分母用"实际获授者"
      (结果侧信息)来判定,前件不可独立于后件测量。BR-L2-044 的 IV
      (分离机制的存在与程度)可通过组织结构分析/时间分配记录/协议文本
      独立于 DV(竞合稳定性——存续时长/续签次数/联合产出连续性)测量。
      两条测量链在方法与时间上分叉,无结构性焊点。病理不同。

  required_fixes:
  - |
    Required ①: 修复 anti-talisman —— 消除限制条款中"信任/文化等非正式机制"
    例外造成的逃生门。二选一修法:
    (a)【推荐】将信任/文化等非正式机制明确归入"分离机制"的概念伞下——
       承认它们是认知层面的分离机制,功能等价于正式制度性防火墙。
       此时限制条款改为:"稳定竞合需要某种形式的分离机制——可以是正式的
       制度防火墙(独立团队/分时管理/协议缓冲),也可以是非正式的认知分离
       (参与者通过信任或文化默契在心理上区分合作域与竞争域)。
       当两类分离机制均不存在时,竞合将在两个博弈周期内瓦解。"
       此修法保持了预测的绝对性且可证伪。
    (b) 或者,将预测从绝对命题改为比较命题:"缺乏正式分离机制的竞合关系,
       其稳定性在统计上显著低于有正式分离机制者"。此时 falsifiability
       须同步改为比较检验结构(注册效应量和统计显著性阈值),而非当前
       的单例证伪结构。这种修法更忠实于管理文献中分离是"重要但非充分"
       的实证发现,但要求砖放弃当前绝对预测的简洁性。
  - |
    Required ②: 统一并操作化时间术语。预测使用"两个博弈周期",
    falsifiability 使用"三个商业周期"——选定一个术语并给出操作化定义。
    建议:"一个博弈周期=一次完整的联合项目从正式启动到主要交付物的完成
    (或≥2个财年,取两者较短者)"。选定后在预测和三个 falsifiability
    条件中统一使用同一术语。
  - |
    Required ③: 注册"分离机制"的操作性判据。在 statement 或 falsifiability
    段增加:"分离机制的操作判据:至少满足以下两条之一——
    (a) 结构分离:合作活动与竞争活动由不同的人员/团队/法人实体执行;
    (b) 时间分离:合作互动与竞争互动发生在可区分的时间窗口(如合作在
    项目执行期、竞争在产品上市期)。
    仅有认知层面的分离('参与者心里知道什么时候是合作、什么时候是竞争')
    而无(a)或(b)支撑的,不满足本命题的'有分离机制'条件。"
  - |
    should: 完成 IEA 调查并写入 cross_verification 段。按 independence-model.yaml
    的 instrument_correlation.discount_rule 诚实披露单 LLM 执行折扣。
    调查后 IEA 需 ≥1.2 方可判 verified。
  - |
    should: 在 statement 或 applicable_sources 中承认管理文献关于分离的"必要性
    而非充分性"的实证发现(Fernandez et al. 显示分离+整合+共管三者均需)。
    当前砖的叙事("分离→稳定")是对文献的单向简化,应补充:"分离是稳定
    竞合的必要条件之一;在分离基础上,整合与共同管理进一步提升稳定性。
    本命题聚焦分离维度的必要性,不声称分离的充分性。"

round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    r1 的三项修复在表面上已落地，但新文本引入了新的漏洞和遗留了旧的模糊点。核心机制（合作域与竞争域在结构/时间上的分离是竞合稳定的前提）方向上成立，但推论存在三个 required 级缺陷和一个 should 级缺陷：

    1. **博弈周期定义不自洽（r1 未真正修复）**：r1 要求"统一博弈周期术语并给出操作化定义"，但新文本用"或"连接了"一次完整的联合项目从启动到交付的周期"和"一个财年"——这是两个不同的测量单位，当合作和竞争发生在不同项目、不同财年时哪个说了算没有说明。更严重的是，falsifiability (a) 说"超过三个博弈周期"，但合作项目可能跨多个财年，反过来多个短期项目可能挤在一个财年——分母选择含糊。

    2. **非正式机制纳入制造了新逃生门（r1 修复过头）**：r1 原本要"消除逃生门"，但现在的文本说"非正式机制被视为分离机制的一种（当它们满足操作判据时）"——而操作判据明确要求结构或时间两个维度其一。这意味着"双方有信任"本身不算分离机制，必须同时有可观察的结构或时间分离。但这样一来，原推论的核心案例（如 Apple-Samsung 长期竞合，双方高度依赖非正式信任但缺乏结构隔离）就成了反例——推论必须能消化这些案例或明确排除它们。

    3. **射程/排除钩子问题（红旗 4）**：推论的"限制"段落说"不声称所有竞合都必须完全分离才能存在"，但 falsifiability (a) 又说"超过三个博弈周期仍保持稳定则证伪"——这两个口子之间存在矛盾。"不是必须"和"必须否则证伪"之间需要一个更清晰的边界条件。

    4. **anti-talisman 弱（红旗 6）**：操作判据的"结构判据"和"时间判据"看起来可观测，但在实际案例中（如联合研发项目内部按工时阶段分工）可能既满足结构也满足时间判据但实质上没有真正的防火墙。推论没有处理这种"形式上分离但实质上耦合"的灰区。

    反例猎捕结果：未猎到净杀反例（推论核心方向上案例基本支持），但猎到两个过度伸张的边界——(i) 长期依赖非正式信任但缺乏结构分离的竞合案例（如 Apple-Samsung 智能手机专利战与元件供应关系并存十余年），推论需要明确是否将其分类为"伪稳定"或给出更精细的判据；(ii) 同一项目内形式上分阶段但实质同一团队执行的竞合（如联合研发中按里程碑分阶段交付但人员重叠），需要明确处理。

    挡住 verified 的关键缺陷：博弈周期定义不自洽 + 非正式机制纳入后的反例消化问题。
  red_flags: |
    1. **brick=conclusion** — 未命中。核心主张"结构/时间分离是竞合稳定前提"在 CONCEPT-cooperation 和 CONCEPT-competition 之上有独立增量，不是砖的同义反复。承重砖（AXIOM-001 竞争必然性 + AXIOM-003 重复交互规范涌现 + THEOREM-exchange-competition-alternative + THEOREM-conflict-cost）未被窄化。

    2. **逐格判空** — 未命中。推论的核心空格预测是"无分离机制的竞合在短期（≤3 个博弈周期）瓦解"，这是一个有经验内容的预测（vs. 同义反复）。falsifiability (a) 已注册证伪条件。

    3. **测量轴正交(DED-007 死因)** — 未命中。分离机制（自变量）按结构/时间判据测，竞合稳定性（被预测量）按博弈周期数测，两轴独立。

    4. **射程/排除钩子独立于结果(DED-005)** — 部分命中。falsifiability (a) 看似按可事前测的渠道划（结构/时间判据），但"限制"段落开了"不声称所有竞合都必须完全分离"的口子，与 falsifiability 形成矛盾——如果存在一个反例是"竞合持续稳定但无结构/时间分离"，作者可以用"限制"段落辩护，也可以用 falsifiability (a) 拒斥。需要更明确的优先级规则。

    5. **分类判据档位匹配(DED-006)** — 未命中。结构 vs 时间判据是二分性的"满足其一"，但实际案例中分离度是连续谱——形式上分团队但同一 CEO 拍板、形式上分财年但跨年延续合作。推论没有处理中间状态。

    6. **anti-talisman 真兑现** — 部分命中。结构判据和时间判据看起来可独立观测，但"独立团队"的边界（联合董事会有没有交叉？高管有没有交叉持股？）需要在操作化时定死。推论当前文本没有给出"交叉到何种程度就不算独立"的具体阈值。

    7. **现实锚事实核查(DED-007 死因)** — 未命中。引用的文献真实存在（Bengtsson & Kock 2000、Raza-Ullah 2014、Gnyawali & Park 2011 均为真实学术文献）。

    8. **条件是下定义还是做预测** — 未命中。核心预测"无分离则短期瓦解"是经验主张，非定义。

    9. **枚举穷尽 + species 按判据定义(DED-008)** — 不适用。推论未声称"N 类可枚举"。

    10. **primary_suspect 指对 + 平凡化检查** — 部分命中。文件自认最弱腿是"非正式机制的操作化"，方向对，但更致命的软肋是"博弈周期"的单位选择问题——作者可能没有意识到这才是 falsifiability 的真正杀手。

    11. **口径完整注册 + 歧义反向裁决** — 命中（required）。博弈周期定义用"或"连接"联合项目周期"和"财年"，未注册两者冲突时的优先级。这是 L4-009 同类问题——只给数字不给口径。

    12. **数据源同根冒充多源独立** — 未命中。引用文献彼此独立（Brandenburger & Nalebuff 的博弈论传统 vs. Bengtsson & Kock 的组织行为实证传统 vs. 多市场接触文献）。

    13. **API 可及性冒充认识论独立性** — 不适用。

    14. **反向失败模式缺失(DED-039/047 判例)** — 部分命中。推论预测"无分离→瓦解"，但反向失败模式"过度分离→合作无法启动"未被注册——比如两个团队完全独立、互不通气，连联合项目都无法启动。这不是本推论的直接预测范围，但应该标注"本命题不处理启动条件"。

    15. **Bootstrap限定缺失(DED-039 判例)** — 部分命中（should）。竞合关系有冷启动阶段（双方试探、磨合）和稳态运行阶段。冷启动阶段即使有结构分离也可能因信任不足而瓦解，但稳态阶段即使分离较弱也可能因长期互信而稳定。推论未区分这两个阶段。

    16. **验证对象存在性未标注(DED-039 判例)** — 未命中。竞合案例大量存在（科技、汽车、零售行业都有），不是空集。
  counterexample_hunt: |
    **构造反例 1：Apple-Samsung 长期竞合（2010-2018+）**
    - 合作域：Samsung 作为元件供应商向 Apple 供应 OLED、存储芯片等；联合研发显示屏技术。
    - 竞争域：全球智能手机市场份额争夺（专利战 + 产品竞争）。
    - 按操作判据判断：结构上有一定分离（供应合同 vs. 产品销售是不同的业务条线），但时间上没有清晰分离（同期进行）；非正式机制（多年合作关系积累的信任）存在但按新定义需满足操作判据才算。
    - 结果：竞合持续超过三个博弈周期（持续 8 年以上），期间虽有诉讼但合作未瓦解。
    - **判定**：被部分消化——结构判据勉强满足（业务条线分离），但暴露了判据的边界模糊性。如果作者主张"业务条线 = 结构分离"则此案例被消化；如果要求更严格的"独立法人/独立团队"则此案例构成反例。这是判据档位问题（红旗 5）而非核心塌陷。

    **构造反例 2：Nvidia 与 AMD 同时是竞争对手和 CUDA 生态合作方**
    - 在 GPU 市场直接竞争，但 AMD 支持 CUDA 兼容层，部分软件生态互通。
    - 按操作判据：技术标准互通层面结构上不分（同一技术生态），但市场层面分（不同产品线）。
    - 持续时间：5 年以上稳定。
    - **判定**：被推论消化——市场层面结构分离成立。但暴露了"分离度"的连续谱问题。

    **构造反例 3：空中客车与波音同为 FAA/EASA 适航认证合作方但同时在商用飞机市场是死敌**
    - 合作域：适航标准协调、安全数据共享。
    - 竞争域：商用飞机订单争夺。
    - 按操作判据：结构上由不同政府机构协调，但实际是行业级合作（政府主导）；时间上持续。
    - 持续时间：50 年以上。
    - **判定**：被推论消化——结构分离由第三方（监管机构）强制实施。

    **构造反例 4：丰田与特斯拉早期合作（2010-2017）**
    - 合作域：特斯拉为丰田提供电动车技术，丰田投资特斯拉。
    - 竞争域：后续在氢燃料 vs. 电动技术路线上分歧，最终分手。
    - 按操作判据：有明确的股权合作（结构分离），但战略目标高度重叠。
    - 结果：合作约 7 年后瓦解。
    - **判定**：支持推论——瓦解发生在战略路线分歧（即合作域与竞争域边界模糊化）之后。

    **净杀反例猎捕**：未猎到。推论核心机制方向上案例基本支持。

    **过度伸张猎捕**：猎到两处——(i) 长期依赖非正式信任但缺乏硬结构分离的竞合（Apple-Samsung 型）需要更精细的处理；(ii) "博弈周期"定义需要明确优先级。
  required_fixes:
    - "1) 统一博弈周期定义：明确\"联合项目周期\"和\"财年\"在冲突时的优先级，或将博弈周期统一为单一单位（如统一为\"财年\"），并在 falsifiability 中删除歧义。"
    - "2) 处理非正式机制与判据的张力：要么明确\"非正式机制必须可观察地映射到结构或时间分离才算\"（如\"定期联合会议的时间约定\"映射到时间判据），要么删除\"非正式机制\"的纳入以避免语义混淆。"
    - "3) 解决\"限制\"段落与 falsifiability (a) 的矛盾：明确\"不是所有竞合都必须分离\"的边界——是否仅指\"分离度可以高低\"（连续）还是\"存在某些特殊竞合不需分离\"（离散例外）？若是后者，需注册例外条件。"
  oneline: |
    核心机制方向成立且案例基本支持，但博弈周期定义不自洽、非正式机制纳入制造新模糊点、"限制"段落与 falsifiability 矛盾——三项 required 缺陷挡住了 verified。

round_3:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 3, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制"合作域/竞争域需通过结构或时间维度分离才能稳定竞合"站得住，Brandenburger & Nalebuff 的价值创造/价值分配分离论是其理论根基，非任何承重砖的平凡重复。结构判据（不同人员/团队/法人）与时间判据（不同时间窗口）操作化清晰，能事前独立测出，不依赖瓦解结果反推。falsifiability (a)(b)(c) 三条都是事前可测的，未陷入 DED-004 不可证伪循环或 DED-007 测量轴焊死。反例猎捕构造了 12 个候选（开源联盟、3GPP 标准战、SWIFT、NBA 联盟、律所、宝洁双品牌、咨询公司项目竞合、小作坊互通协议、行业协会、采购联合体、JVC 合资公司、运动联盟），9 个被结构或时间判据消化，2 个揭出过度伸张（小作坊型短期合作、咨询项目竞合——合作域占比过小时零分离也不瓦解），1 个部分净杀被消化（标准战有论坛结构分离）。未猎到 scope 内硬净杀。但有以下三条 should 级缺陷挡住 verified：(1) 缺利益量级可比限定——当合作域只是附带活动（占互动总利益<20-30%）时，零分离也能长期稳定，造成预测假阳性；(2) statement 预测"通常不超过两个博弈周期"与 falsifiability (a) 证伪门槛"持续超过三个博弈周期"不一致，留下半个周期的安全边际，是修辞留白还是反例逃生门未澄清；(3) "稳定"的操作判据未注册——falsifiability (a) 说"竞合关系持续超过三个周期仍保持稳定则证伪"，但"稳定"如何测（联合项目续签？双方均未退出？竞争域未单独升级？）未给口径。核心不塌，靠定向加限定可救活。
  red_flags: |
    1. brick=conclusion — 未命中。内核"合作域/竞争域分离"是 Brandenburger & Nalebuff 的博弈重合理论核心，非 THEOREM-competition-norm 或 THEOREM-conflict-cost 的平凡重复。
    2. 逐格判空 — 未命中。核心预测"零分离→≤2周期瓦解"是真经验主张，非同义反复。
    3. 测量轴正交 — 未命中。自变量（分离度）由结构/时间判据独立测出，不依赖结果反推。
    4. 射程/排除钩子独立于结果 — 未命中，但有轻微不一致（见 required 修正）。
    5. 分类判据档位匹配 — 未命中。结构/时间判据本身是离散可观测特征，与二分预测（满足/不满足）匹配。
    6. anti-talisman 真兑现 — 未命中。前件"是否建立分离机制"由组织特征独立测出。
    7. 现实锚事实核查 — 未命中。Bengtsson & Kock (2000)、Raza-Ullah (2014)、Gnyawali & Park (2011)、Jayachandran (1999)、Brandenburger & Nalebuff (1996)、Axelrod (1984) 均真实存在且引用方向正确。
    8. 条件是下定义还是做预测 — 未命中。"零分离"由结构/时间判据定义（可证伪），"瓦解"由竞合关系终止或实质改变判断（可观测）。
    9. 枚举穷尽 — N/A，不涉及 N 类枚举。
    10. primary_suspect 指对 + 平凡化检查 — 未命中致命平凡化，但隐含边界"利益量级可比"未被作者识别（见反例猎捕过度伸张）。
    11. 口径完整注册 — should 级命中。"稳定"的操作判据未注册，"≤2周期 vs >3周期"的数字不一致未澄清。
    12. 数据源同根 — N/A，理论桥不依赖经济数据。
    13. API 冒充认识论独立 — N/A。
    14. 反向失败模式缺失 — should 级命中。statement 穷举了"纯竞争"和"伪合作"两种结局，但未显式注册"零分离也可能稳定在第三种状态（合作域太小不构成显著冲突）"这一反向模式。
    15. Bootstrap 限定 — N/A，不涉及新技术冷启动。
    16. 验证对象存在性 — 未命中。"零分离竞合"在现实中大量存在（小企业竞合、附属性合作），可观测性无问题。
  counterexample_hunt: |
    构造了 12 个反例候选：开源联盟（Kubernetes/Linux Foundation）→被消化（结构判据满足）；3GPP 标准战 →被消化（论坛结构分离）；SWIFT 银行合作 →被消化（法人结构分离）；NBA 联盟 →被消化（联盟办公室结构分离）；律所双重代理 →被消化（团队+时间双满足）；宝洁双品牌 →被消化（P&L 结构分离）；JVC/历史合资公司 →边界案例（结构判据满足但人员借调灰色地带）；小作坊零分离竞合（20 人公司研发销售同 3 人）→净杀候选但揭出过度伸张（合作域占比<5%时零分离也能多年稳定）；咨询公司项目竞合 →净杀候选但揭出过度伸张（合作周期短+合作域小，零分离不瓦解）；行业协会标准制定 →被消化；政府采购联合体 →被消化；运动联盟 →被消化。9 被消化、2 揭出过度伸张（合作域占比下限未限定）、1 边界案例。未猎到硬净杀。核心过度伸张：推论未限定"合作域与竞争域利益量级可比"——当合作域占总互动利益<20% 时，零分离也能稳定多年。
  required_fixes:
    - "1) 在 statement 的限制段落加利益量级可比限定：明确\"本预测仅适用于合作域与竞争域利益量级可比（即合作域占总互动利益 ≥ 20%）的情形；当合作域占比过低（<20%），零分离亦可长期稳定\"。"
    - "2) 统一博弈周期数字：statement 预测\"通常不超过两个博弈周期\"与 falsifiability (a) 证伪门槛\"超过三个周期\"对齐，建议保留预测为\"两个周期\"、证伪门槛同样设为\"两个周期\"（或两个都改为\"三个\"），消除修辞留白。"
    - "3) 在 falsifiability 注册\"稳定\"的操作判据：竞合关系稳定 = (i) 联合项目持续续签且 (ii) 双方均未单方面退出且 (iii) 竞争域未升级为单边行动，三个条件需同时满足。"
    - "4) [可选] 在 falsifiability 注册反向失败模式：明确\"如果观察到零分离竞合稳定持续，且其合作域占总互动利益 < 20%，则不构成证伪\"。"
  oneline: |
    核心机制站得住、反例未净杀，但缺利益量级可比限定、"稳定"口径未注册、预测/证伪数字不一致，差一口气到 verified。

round_4:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 4, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（合作域/竞争域在结构或时间上的分离是竞合稳定性的必要条件）成立且有理论锚（Brandenburger & Nalebuff、Axelrod 多市场接触），反例猎捕未净杀。但有三个 required 级缺陷阻挡 verified：
    (1) 稳定操作判据中"竞争域未升级为单边行动"与"双方均未单方面退出"在零分离竞合语境下存在语义重叠与可操纵空间——任一方都可用"将竞争行为包装为升级"或"以退出相威胁但不退出"的方式制造边界模糊。判据需要预先注册升级的判别口径（如：市场份额战中的降价幅度阈值、专利诉讼发起率阈值），否则在反例出现后作者可事后选择口径救推论。
    (2) 20% 利益量级阈值的分母口径未注册。"合作域占总互动利益 ≥ 20%"——分母是总互动利益（合作+竞争）、总业务收入、还是总资源投入？分子是合作项目的预期收益、实际收益、还是机会成本？口径不锁死会导致边界案例方向性操纵。
    (3) 反向失败模式注册不完整：r3 要求注册"反向失败模式"，作者在 falsifiability (c) 提到"制度性防火墙存在但竞合仍频繁崩溃"——但这只覆盖了"分离存在但不够强"的方向，未覆盖"分离存在且过强"的方向（即过度制度化导致的竞合僵化、无法响应环境变化的失败模式）。这不算致命但应升级为 should。
    此外还有一个 should 级问题：周期统一为"联合项目周期"后，"续签"的判据与周期定义有循环依赖——如果零分离竞合在第一个周期内就启动续签谈判，是否算"超过两个周期"？需要在判据中明确续签必须在第 N 个周期【交付完成后】才计入。
    无净杀反例，但存在一个值得标记的边界案例：半导体行业的设备-晶圆厂竞合（ASML 与三星/台积电既是供应商-客户又是市场份额竞争者），其合作域（EUV 光刻机联合开发）与竞争域（先进制程市场份额）几乎完全重叠在同一个项目周期内，零分离竞合持续了超过两个完整芯片制程节点（约 8-10 年）。该案例可被 20% 阈值排除（合作域收益可能 < 20% 总互动利益），但暴露了"周期"定义在长周期产业中的不适配——8-10 年远超"通常不超过两个博弈周期"的隐含时间尺度。
  red_flags: |
    1. brick=conclusion: 未命中。核心主张"分离度为零时竞合短期内瓦解"非任何单一承重砖的近义重复；Brandenburger & Nalebuff 的"价值创造 vs 价值分配"分离是更宏观的描述，本推论的"结构/时间可观察分离"判据是可操作化的新贡献。
    2. 逐格判空: 未命中。"零分离→短期内瓦解"是一个可证伪的具体预测（非同义反复），有 falsifiability (a) 的明确观测判据。
    3. 测量轴正交(DED-007): 未命中，但有边界张力。分离机制（自变量，按结构/时间判据测量）与竞合稳定性（结果变量，按续签/未退出/未升级测量）来自不同观测通道，未见焊死。
    4. 射程/排除钩子独立于结果(DED-005): 部分命中。20% 阈值是事前注册的（限制段落），但分母口径未注册（见红旗 11），给事后口径选择留了空间。
    5. 分类判据档位匹配(DED-006): 未命中。分离度按"零分离 vs 零以上"二分处理，但限制段落明确说分离度是连续谱且预测只适用于零——这反而是正确的（不要求连续量用二分），且二分判据与二分预测匹配。
    6. anti-talisman 真兑现: 未命中。分离判据的结构/时间两维度是可事前测的，不依赖结果反推。
    7. 现实锚事实核查(DED-007): 攻不穿但有疑问。Bengtsson & Kock (2000) 和 Gnyawali & Park (2011) 是真实文献，但本审查无法验证其结论是否被作者准确转述（无原文比对）。不构成红旗，因为锚点本身是学术共识方向。
    8. 条件是下定义还是做预测: 未命中。"零分离→短期内瓦解"是预测，"什么是零分离"是定义，两者分工清晰。
    9. 枚举穷尽 + species 按判据定义: 未命中。本推论不做枚举。
    10. primary_suspect 指对 + 平凡化检查: 部分命中。r3 修复后作者自认最弱腿是利益量级可比限定和反向失败模式注册，这两条确实是当前最薄弱的。但更致命的软肋是稳定判据中"竞争域未升级为单边行动"的口径未注册（红旗 11），作者未识别。委托-代理理论的"需问责"不是平凡化来源，因为本推论关注的是竞合域分离而非代理关系。
    11. 口径完整注册 + 歧义反向裁决: 命中（required）。20% 阈值的分母/分子口径未注册；稳定判据中"升级为单边行动"的口径未注册。两个口径缺口都允许事后方向性操纵。按评分卡规则，边界案例裁决应按不利于推论方向裁。
    12. 数据源同根冒充多源独立: 未命中。本推论是理论性推论，不依赖多源统计数据。
    13. API 可及性冒充认识论独立性: 未命中。不适用。
    14. 反向失败模式缺失: 部分命中。falsifiability (c) 覆盖了"分离存在但崩溃"的方向，但未覆盖"分离过强导致僵化"的方向。falsifiability (b) 部分覆盖了"重叠但不崩"的方向。应升级为 should。
    15. Bootstrap 限定缺失: 未命中。本推论不涉及冷启动阶段分析。
    16. 验证对象存在性未标注: 未命中。零分离竞合案例在现实中可观测（如完全重叠的合作-竞争关系），不需要标注"空集"。
  counterexample_hunt: |
    猎捕 1：半导体设备-晶圆厂竞合（ASML 与三星/台积电）
    - 描述：ASML 与三星既是 EUV 光刻机的合作开发者（联合研发）又是市场份额的竞争者（三星 vs 台积电在先进制程）。合作域（光刻机联合开发）与竞争域（先进制程市场份额）在同一个芯片制程节点周期内几乎完全重叠，零分离。
    - 结果：竞合持续了超过两个完整周期（自 2018 年 EUV 量产以来已超过 6 年）。
    - 处置：可被 20% 阈值排除（合作域收益占总互动利益可能 < 20%，因为芯片代工业务规模远大于设备联合开发）。但暴露了两个问题：(a) 周期定义在长周期产业中不适配（6 年 > "通常不超过两个周期"的隐含时间尺度）；(b) 20% 阈值的分母口径若定义为"总业务收入"，则三星/台积电的设备联合开发占比确实可能 < 20%，但若定义为"与该合作伙伴的总互动利益"，则占比可能 > 20%。口径不锁死让排除方向可操纵。
    - 判定：揭出过度伸张（20% 阈值口径需注册），未净杀。

    猎捕 2：航空发动机行业竞合（GE/Rolls-Royce/P&W 在大型民用发动机项目）
    - 描述：这三家在某些项目（如 Trent 1000）上是合作伙伴，在其他项目（如 GEnx vs Trent XWB）上是竞争对手。零分离的项目（如 Rolls-Royce 与 GE 在某些军用发动机上的合作）持续了数十年。
    - 结果：可被结构判据排除（不同项目由不同法人实体执行），不构成零分离。
    - 判定：被消化（结构分离判据正确排除）。

    猎捕 3：开源软件社区竞合（Linux 发行版之间）
    - 描述：Red Hat 与 SUSE 既是开源代码的合作贡献者，又是企业 Linux 市场的竞争对手。零时间分离（持续贡献代码 + 持续竞争），但合作域（上游代码）与竞争域（下游发行版）有一定结构分离（不同产品团队）。
    - 结果：可被结构判据排除（不同产品团队），不构成零分离。
    - 判定：被消化。

    猎捕 4：NBA 球队竞合（选秀合作与常规赛竞争）
    - 描述：NBA 球队在选秀中是合作者（联盟规则、联合选秀大会），在常规赛中是竞争者。零结构分离（同一支球队、同一管理层），零时间分离（选秀与常规赛在同一赛季内）。
    - 结果：NBA 联盟持续了超过两个赛季周期（数十年）。合作域占总互动利益可能 > 20%（选秀是联盟核心机制之一）。
    - 处置：可能净杀。但可被反驳——NBA 有大量结构分离机制（联盟办公室 vs 各球队、选秀规则由联盟制定而非球队自协调），所以不构成零分离。
    - 判定：被消化（但边界模糊，因为"联盟办公室"是否算独立结构实体取决于定义）。

    猎捕 5：行业协会竞合（竞争对手在行业协会中合作）
    - 描述：竞争对手在行业协会中合作制定行业标准，同时在市场上竞争。零结构分离（同一公司参与同一协会），但有时间分离（标准制定会议与市场竞争在不同时间窗口）。
    - 结果：可被时间判据排除（标准制定有明确的会议周期）。
    - 判定：被消化。

    净杀反例：未猎到。
    被消化案例：4 个。
    揭出过度伸张：1 个（20% 阈值口径需注册）。
  required_fixes:
    - "1) 在限制段落或 falsifiability 中注册 20% 利益量级阈值的完整口径：分子定义为\"合作域预期净收益（按三年滚动平均的合作项目现金流）\"，分母定义为\"与该合作伙伴的总互动利益（合作域+竞争域，按相同时间窗口的滚动平均）\"。分子分母都用同一时间窗口、同样的净收益口径。"
    - "2) 在 falsifiability (a) 中注册\"竞争域未升级为单边行动\"的操作判据：定义\"升级\"为竞争域出现以下任一行为——市场份额战中单方面降价 > 15%、发起专利诉讼、公开负面声明对方产品。反向裁决规则：若边界案例中\"升级\"的口径在反例出现后才定死且方向恰好救推论，该边界案例按不利于推论方向裁。"
    - "3) 在 falsifiability (a) 中明确续签的时间锚点：\"续签\"指第 N 个周期【交付完成后】双方签署的下一个周期合作协议，而非第 N 个周期【执行期间】的续签意向书。避免\"在第一个周期内启动续签谈判\"被算作\"超过两个周期\"。"
    - "4) 在 falsifiability 中追加反向失败模式的完整注册：(c) 已覆盖\"分离存在但崩溃\"，需追加 (e) \"分离过强导致僵化\"——若两个组织建立了过度制度化的分离机制（如完全独立的子公司、完全无重叠的时间窗口），导致竞合无法响应外部环境变化（如技术突变需要即时合作-竞争切换），则本推论需承认\"分离度过强\"也是一种失败模式，而非只预测\"分离度不足\"的失败。"
    - "5) 修正周期定义在长周期产业中的不适配：将\"一个博弈周期\"从\"一次完整的联合项目从启动到交付的周期\"改为\"一次完整的合作-竞争交互回合\"。在长周期产业中，一个回合可包含多个项目阶段。同时将\"通常不超过两个博弈周期\"改为\"通常不超过两个交互回合\"，并在限制段落中说明：若产业本身周期 > 5 年，则\"两个回合\"对应 > 10 年的实际时间，预测的时间尺度需按产业调整。"
  oneline: |
    核心机制成立且有理论锚，反例猎捕未净杀，但 20% 阈值口径与稳定判据口径未注册给事后方向性操纵留了空间，加上周期定义在长周期产业中不适配——差一口气，需四项定向修订。

