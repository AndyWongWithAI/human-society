             note中"联动演化策略"措辞可能让读者误解联动为实证事实而非模型假设。
             should级建议在evo_bio note中加一句限定("模型预测联动;人类数据中
             内群体偏好与外群体敌意不完全耦合,Brewer 1999")。
      condition_definition_vs_prediction:
        verdict: 未命中(维持round_1判断)
        detail: |
          主要主张(存在+任意划分触发+延伸至三领域+显著性调节)是预测而非定义。
          本轮关注:证伪条件的AND逻辑将所有领域捆绑——"同时无显著差异"将一个
          本应是"可被任一领域单独挑战"的预测结构变成了"须被所有领域同时挑战"
          的堡垒。这不改变条件本身是预测的性质,但稀释了单个预测的可证伪力度。
          联动domain-alignment修复(required-1)一并处理。
      enumeration_exhaustiveness:
        verdict: 未命中
        detail: 本砖未声称N类可枚举。维持round_1判断。
      primary_suspect_accuracy:
        verdict: 命中(should级,本轮新识别)
        detail: |
          文件无primary_suspect字段(L2格式不要求),审查者自行诊断当前最弱腿:

          最致命软肋(本轮required)=领域不对齐(红旗11联动):证伪条件检查的领域
          与声明延伸的领域不匹配,导致冲突领域漏检、资源分配错位。修复后消除。

          次致命软肋=IEA脆弱性:保守IEA=1.96距阈值1.8仅0.16,对social_psychology
          的default_independence(0.6)敏感。±0.2校准容差内可跌破verified线。
          已在verdict_note记录为should。

          前轮最弱腿(anti-talisman/IEA分类错位/摘要过强)均已修复,不再是软肋。
      caliber_completeness:
        verdict: 命中(required级,本轮新识别)
        detail: |
          红旗11(口径完整注册+歧义反向裁决)要求:阈值/判据连同分子/分母/测量口径
          一次性注册;发现"只有数字没有口径"→required;事后口径选择一律反向裁决。

          本轮识别出一个口径注册缺陷:证伪条件声明的检查域列表与statement声明的
          延伸域列表不匹配。具体:
          - Statement: 延伸至{信任, 合作, 冲突}
          - Falsifiability: 检查{资源分配, 信任, 合作}
          - "冲突"在statement中存在但在falsifiability中缺席
          - "资源分配"在falsifiability中存在但在statement延伸三元组中缺席

          这不是"只有数字没有口径"——数字(α=0.05)和部分口径(操作化定义)已注册。
          但【领域列表口径】出现不匹配:两个关键概念(延伸域/检查域)的集合不同,
          使证伪条件与声明之间的映射不透明。读者无法从证伪条件确切推断:"冲突"
          领域的表现是否影响证伪裁决。

          按红旗11的预注册精神(口径须在见反例前定死,且定死的口径须与声明一致),
          这是一个口径注册缺陷。修复方向:(i)统一领域列表;或(ii)在falsifiability中
          显式声明为何冲突未被纳入检查域(若有正当理由)。当前为required级——
          领域不对齐使证伪条件与声明之间的逻辑连接断裂。
    iea_independence_check:
      result: 诚实披露但脆弱(距阈值0.16,default系数敏感)
      detail: |
        === 本轮IEA概览 ===
        名义IEA = 1.0(social_psychology锚) + 0.6(evo_bio, default=0.6) + 0.6(cu, default=0.6) = 2.2
        保守IEA = 1.0 + 0.6 + 0.6×(1-0.4) = 1.0 + 0.6 + 0.36 = 1.96
        (cu×evo_bio重叠40%已扣除, independence-model给出evo_bio__cultural_universals=0.6)
        Verified阈值=1.8。差额=0.16。

        === Round_1修复确认 ===
        (a)锚源已从game_theory→social_psychology,分类错误已修正。✓
        (b)cu对evo_bio的残余重叠(40%)已在保守IEA中扣除。✓
        (c)仪器折扣(单LLM执行)已显式披露。✓
        (d)mitigation限定为"Tajfel核心锚属多重复现稳固发现;显著性调节与跨领域
           覆盖的收敛强度低于核心锚"。✓

        === 本轮新关注:default_independence脆弱性 ===
        social_psychology的所有成对系数均走default_independence=0.6,因independence
        -model.yaml当前仅覆盖{evo_bio, game_theory, cultural_universals}三源两两
        系数。砖的verdict_note已诚实声明此缺口。

        敏感度测试(在calibration_note标明的±0.2容差内):
        - 若social_psych⟷evo_bio实际独立性=0.4(而非default 0.6):
          保守IEA = 1.0 + 0.4 + 0.36 = 1.76 < 1.8 ✗
        - 若social_psych⟷cu实际独立性=0.4(而非default 0.6):
          cu有效贡献 = 0.4×(1-0.4) = 0.24; 保守IEA = 1.0 + 0.6 + 0.24 = 1.84 ≈ threshold
        - 若两者同时降至0.4:
          保守IEA = 1.0 + 0.4 + 0.24 = 1.64 < 1.8 ✗

        注意:calibration_note说"不宜过度解读小数差异",上述敏感度测试仅说明
        verified状态对未校准系数的依赖程度,非主张IEA应为更低值。

        === 对social_psych⟷evo_bio独立性的细化论证 ===
        Round_1审查者的论证(社会心理学与演化生物学方法论根本不同→独立性应高于
        evo_bio⟷game_theory的0.4)有道理但需限定:
        - evo_bio note引用的Choi & Bowles 2007使用演化博弈论(ESS/复制者动态)
          建模狭隘利他主义——evo_bio确实使用了博弈论数学结构。
        - social_psychology的Tajfel范式不使用博弈论——方法论确实是隔离的。
        - 但两者的【理论对话】紧密:社会认同理论(Tajfel & Turner 1979)与演化
          心理学对群体认同的解释共享高阶理论关切。学科方法论独立≠理论框架独立。
        - 0.6的独立性估计(即40%重叠)比0.4(60%重叠)更乐观,但在合理范围内。

        === 仪器折扣 ===
        单LLM执行折扣已披露。Tajfel最小群体效应(百次以上跨文化复现)使核心锚
        受真实文献收敛支撑,单仪器忧虑被缓解——这一mitigation对核心主张有效,
        对延伸主张(信任/合作/冲突三领域全覆盖)的保护较弱。

        === 综合判断 ===
        IEA披露诚实(三源重叠已扣/仪器折扣已声明/模型缺口已承认)。但保守IEA=1.96
        距verified阈值1.8仅0.16,对social_psychology的default_independence敏感,
        属结构性脆弱。当前不构成required推翻verified的理由(≥1.2下限无争议),
        但若未来对social_psychology的校准将default下调至0.4或更低,verified状态
        可能需要重新论证。
    counterexample_hunt:
      result: 未猎到净杀反例;揭出领域不对齐导致的证伪盲区
      cases_searched:
        - case: '日本uchi/soto(内/外)在商业场景中的反转——对外群体(客户)的资源分配
            超过内群体(同僚)'
          outcome: |
            被消化。日本文化的uchi/soto区分是内群体偏好的经典案例,但在商业场景中,
            资源(最好的产品/服务/座位)往往分配给外群体客户而非内群体同僚。这与
            "资源分配中偏袒内群体"表面矛盾。

            消化路径:(a)对客户的优待是工具性的(维护商业关系),不是群体偏好驱动;
            (b)在非工具性场景(如信任、合作)中,uchi/soto区分仍然牢固——日本人更信任
            内群体成员;(c)商业优待的最终目的是服务于内群体(公司的生存/繁荣),属于
            间接内群体偏好。

            此案例不构成净杀,但揭示"资源分配"作为测量领域需要区分工具性分配与
            偏好性分配——砖当前未做此区分。should级建议。
        - case: '完全市场定价下的跨群体交易——敌对族群在匿名市场上按市价交易,
            无内群体偏好表现'
          outcome: |
            被消化。在竞争性市场中,价格机制替代了群体身份作为分配依据——卖方卖给
            出价最高者,不论其群体归属。这在表面上构成"资源分配无内群体偏好"的案例。

            消化路径:(a)市场制度本身就是抑制内群体偏好的机制(BR-L2-010非人格化制度
            替代人际信任)——市场中的"无偏好"是制度约束的结果,非偏好不存在;
            (b)一旦离开市场场景(如合作/信任),内群体偏好重新出现;(c)在市场监管
            缺失时(如黑市),群体身份迅速成为信任/合作的决定因素。

            此案例支持而非证伪——它说明内群体偏好可以被制度抑制,但抑制需要制度
            持续在场(与THEOREM-group-identity-decay的维护动力学同构)。不构成反例。
        - case: 'Williams综合征患者的低社会恐惧与弱化的种族/群体偏见'
          outcome: |
            被消化(边界外的病理案例)。Williams综合征患者表现出异常高的社交趋近行为,
            包括对陌生人和外群体成员的亲近,部分研究显示其内隐种族偏见低于对照组。

            消化路径:(a)这是神经发育异常的病理状态,不在砖声称的"人类倾向于"的
            典型范围内;(b)Williams综合征患者仍形成社会偏好和依恋——偏好未被消除,
            只是边界选择异常;(c)砖的falsifiability针对的是"一个人类群体"(正常
            变异范围),不要求覆盖所有病理状态。

            不构成反例。
        - case: '禅宗/贵格会等激进平等主义修行社群在行为层面的内群体偏好消除'
          outcome: |
            不构成净杀(证据不充分),但构成对证伪条件AND逻辑的压力测试。

            某些禅宗僧团和贵格会(Quaker)社群经过数十年修行,在行为层面可能表现出
            极低的内群体偏见(对僧团内外成员在资源分配/信任/合作中无明显差别)。
            但目前缺乏严格的行为经济学实验证据(如trust game/独裁者游戏在禅修者中
            的群际差异测量),且:(a)修行社群本身构成新的内群体("修行者"vs"俗人"),
            内群体偏好可能只是换了附着对象;(b)即使行为层面无差异,内隐测量(IAT)
            可能仍检出残余偏好。

            此案例的启示:砖的证伪条件使用显式行为测量(资源分配/信任/合作),
            而内隐偏好可能在不同测量通道中持续存在。这不构成对砖的证伪(砖未声称
            覆盖内隐测量),但说明"行为无差异≠偏好不存在"——对证伪条件解释需加
            此限定。should级建议。
        - case: '构造反例——领域不对齐导致的证伪盲区'
          outcome: |
            净杀(对砖的当前证伪结构而言——但此"杀"来自审查者对证伪结构的攻击,
            非来自外部经验事实)。

            构造以下群体:
            - 成员明确认同内群体(Likert≥4/5) ✓ 满足(a)
            - 与外群体有经济交易 ✓ 满足(b)
            - 在资源分配领域:无内群体偏好(p>0.05) ✓ 检查域通过
            - 在信任领域:无内群体偏好(p>0.05) ✓ 检查域通过
            - 在合作领域:无内群体偏好(p>0.05) ✓ 检查域通过
            - 在冲突领域:强烈内群体偏好(与外群体冲突时一致对外) ✗ 声明域支持

            此群体的证伪裁决:证伪条件触发(三个检查域全无差异)→"本命题被证伪"。
            但该群体在冲突领域表现出强烈内群体偏好,而冲突恰是statement声称
            "偏好延伸至"的领域之一——即该群体同时满足"证伪条件触发"和"声明被
            经验支持"。

            这不是外部反例,而是证伪结构的内部矛盾——领域不对齐使"证伪"和"支持"
            可以在同一群体上共存,证伪条件与声明之间的逻辑连接断裂。

            裁决:此构造案例揭示了required-1(领域不对齐)的实质危害——当前证伪条件
            不能正确映射到声明空间,产生了"证伪盲区"(conflict)和"错位检查"
            (resource allocation)。修复required-1后此盲区消除。
      assessment: |
        猎捕未获能独立净杀核心主张的外部反例。内群体偏好的存在性(minimal group
        paradigm)是人类行为学中最稳健的发现之一,跨文化、跨方法、跨测量通道的
        收敛证据极其强大。本轮猎捕的所有外部案例(日本uchi/soto/市场定价/Williams
        综合征/禅修社群)均被消化或归入边界条件。

        但猎捕过程揭出了一个重要的内部缺陷:领域不对齐使证伪条件与声明之间的逻辑
        映射断裂。构造案例(冲突领域有偏好但证伪仍触发)展示了这一缺陷的实质后果——
        虽非外部经验反例,但构成对证伪结构完整性的有效攻击。

        此外,猎捕过程中识别了两个should级限定:
        (a)"资源分配"测量需区分工具性分配与偏好性分配(日本uchi/soto启示);
        (b)行为无差异≠偏好不存在——内隐偏好可能持续(禅修社群启示)。这两条
        不构成required,但可提升证伪条件的解释精度。
    non_recurrence:
      DED-004_loop:
        verdict: 未重蹈
        detail: |
          DED-004死因=声称两种独立现象必然耦合,被经验检验推翻。BR-L2-006的领域
          延伸主张(信任/合作/冲突)是最小群体效应的横向泛化,非声称独立现象耦合。
          证伪条件前置,结构不同。本轮识别出的领域不对齐是新类缺陷(注册对齐),
          非DED-004模式的复现。
      DED-007_welded_axis:
        verdict: 未重蹈
        detail: |
          DED-007死因=自变量偷用结果测。BR-L2-006核心IV(群体身份)在最小群体
          范式中由实验者随机分配,正交性干净成立。经round_1修复后,显著性调节
          子主张的测量规程已预注册,不再构成焊点风险。本轮无新焊点发现。
    required_fixes:
      - |
        1.【required-domain-alignment】统一statement延伸领域与falsifiability
        检查域的领域列表。当前statement说延伸至{信任,合作,冲突}而falsifiability
        检查{资源分配,信任,合作}——两集合不一致导致证伪条件与声明之间的逻辑
        映射断裂(详见counterexample_hunt构造案例)。修复方案(二选一):

        方案A(推荐):分层证伪——将核心主张(Tajfel资源分配效应)与延伸主张
        (信任/合作/冲突)在证伪条件中分层处理:
        (i)核心主张证伪:若一个群体在资源分配中无内群体偏好→核心主张被挑战;
        (ii)延伸主张证伪:若在信任/合作/冲突【任一】延伸领域中无内群体偏好
            →该领域的延伸主张被削弱(OR逻辑,非AND);
        (iii)整体证伪:若(a)核心主张被挑战+所有延伸主张均被削弱→本命题被证伪。
        此方案更精确反映"核心+延伸"两层主张结构,且OR逻辑避免AND捆绑的过度保护。

        方案B(最小改动):将"冲突"补入falsifiability检查域,使检查四元组=
        {资源分配,信任,合作,冲突},与完整声明空间对齐。此方案改动最小但进一步
        加严AND逻辑(四领域全部无差异才证伪),保护性更强。

        Round_1的should-5(scope-precision)建议了AND逻辑;本轮在领域对齐的背景下
        重新审视,建议OR逻辑用于延伸主张。最终选择由作者在修订中决定,但领域
        列表必须统一。
      - |
        2.【should-iea-sensitivity】在verdict_note中记录IEA对default_independence
        的结构性敏感:social_psychology的所有成对系数均走default=0.6,保守IEA=1.96
        距verified阈值(1.8)仅0.16。按independence-model校准注记的±0.2容差,
        若任一default系数被下调,verified可能面临降级。建议后续将social_psychology
        的专用系数校准入库,替代default依赖。
      - |
        3.【should-resource-allocation-disambiguation】在falsifiability或适用
        source说明中区分"工具性资源分配"与"偏好性资源分配"。当前证伪条件将
        "资源分配"列为检查域,但未区分:对客户的商业优待(工具性)vs对同僚的
        偏袒性分配(偏好性)。日本uchi/soto案例显示工具性分配可能反向于偏好性
        分配,不区分则可能导致误判。建议在falsifiability中加注"资源分配测量需
        排除工具性/战略性分配动机(如商业交易中的顾客优待)"。
      - |
        4.【should-implicit-bias-caveat】在falsifiability中加注:证伪条件使用
        显式行为测量(资源分配/信任/合作任务/冲突行为),不覆盖内隐测量(IAT等)。
        行为层面无差异不必然意味着偏好不存在——内隐偏好可能在显式行为被规范
        抑制后仍以其他通道持续。此注不改变证伪条件的操作化,但提升解释诚实度。
      - |
        5.【should-evo-bio-coupling-caveat】在evo_bio note中为"联动演化策略"
        加限定句:Choi & Bowles(2007)模型预测内群体利他与外群体敌意联动演化;
        但人类数据中该联动不一定成立(Brewer 1999"内群体爱不需要外群体恨")。
        当前note中的"联动演化策略"措辞可能让读者误将模型假设当作实证事实。
  round_3:
    reviewer: |
      独立对抗审查者(L2桥接砖审查管线,round_3)。全新上下文,与写砖者、IEA调查员
