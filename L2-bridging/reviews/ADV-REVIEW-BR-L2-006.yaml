    iea_independence_check:
      result: 诚实披露但结构性脆弱(距阈值0.16,default系数敏感)
      detail: |
        === 数学核算(确认) ===
        名义IEA = 1.0(social_psychology锚) + 0.6(evo_bio, default=0.6)
                + 0.6(cultural_universals, default=0.6) = 2.2

        保守IEA(扣除evo_bio-cultural_universals 40%重叠,
        independence-model给出该对独立性=0.6):
        cu有效 = 0.6 × (1−0.4) = 0.36
        保守IEA = 1.0 + 0.6 + 0.36 = 1.96

        1.96 ≥ 1.8(verified阈值) → 核算通过。

        === 扣减链(按综合顺序) ===
        1. 锚源=social_psychology,权重1.0(实验方法+百次跨文化复现)。
        2. evo_bio扣至0.6(default_independence,无专用系数)。
        3. cu先扣至0.6(default vs social_psych),再扣至0.36(vs evo_bio重叠40%)。
        4. 未扣项:social_psych-cu残余重叠(默认独立=0.6→40%重叠)与social_psych-evo_bio
           残余重叠(默认独立=0.6→40%重叠)——两者均走default,尚无专用校准系数。
        5. 仪器折扣(单LLM执行):已披露,按规则不强制改数字。

        === 敏感度分析 ===
        按independence-model calibration_note的±0.2容差:
        - 若social_psych⟷evo_bio实际独立=0.4(非default 0.6):
          保守IEA = 1.0+0.4+0.36 = 1.76 < 1.8 ✗
        - 若social_psych⟷cu实际独立=0.4(非default 0.6):
          cu有效 = 0.4×(1−0.4) = 0.24; 保守IEA = 1.0+0.6+0.24 = 1.84 ✓(擦边)
        - 若两者同时降至0.4:
          保守IEA = 1.0+0.4+0.24 = 1.64 < 1.8 ✗

        严格解读:calibration_note说"不宜过度解读小数差异",其含义是不应因一次
        敏感度测试即推翻verified。但该敏感度分析说明verified状态对未校准系数
        有结构性依赖——这不是计算错误而是模型覆盖缺口。

        === 独立论证 ===
        social_psychology(Tajfel实验)与evo_bio(演化理论/比较行为学)共享较低的
        理论和数学结构重叠(社会认同理论不使用ESS/复制者动态)——该论证支持
        独立性不低于0.6。但与cultural_universals(人类学)共享跨文化心理学方法论
        和部分语料(民族志)——独立度可能低于0.6。default=0.6同时用于两对,
        可能一对合理一对偏高。总体上default占位在合理区间内偏高一侧。

        === 综合判断 ===
        三源重叠已扣、仪器折扣已披露、模型缺口已承认——IEA披露诚实,按现行规则
        达标。结构性脆弱(距阈值0.16+default敏感)是真实的,作为should级记录
        而非required推翻。建议将social_psychology专用系数校准入库列为优先事项。
    counterexample_hunt:
      result: 未猎到净杀反例;核心主张极其稳健;揭出两个should级边界细化
      cases_searched:
        - case: '【新鲜构造】极端个人主义者——既无群体认同也无偏好'
          outcome: |
            被消化(scope限定吸收)。考虑一个假想的"极端个人主义者":此人不认同任何
            群体(无共享身份)、不参与任何群体活动、声称对所有人群一视同仁。砖的
            falsifiability条件(a)要求"成员明确认同自己属于该群体"——若此人无任何
            群体认同,则条件(a)不满足,此个案不在证伪范围内。

            这不是talisman护身符——条件(a)的"明确认同"操作化(Likert≥4/5)提供
            了独立的进入门槛。若一个群体(非单一个人)的所有成员均未能通过此门槛,
            则该群体本身无法被测试(不属于砖声称范围内的"群体")。这是一个合理的
            scope限定,非逃避证伪。
        - case: '【新鲜构造】全匿名加密市场中的纯算法交易——身份不可观测'
          outcome: |
            被消化。在纯算法驱动的加密市场中(如DeFi协议),交易对手的身份完全不可
            观测——不存在"内/外群体"的信息可用于歧视。此时资源分配不表现内群体
            偏好是信息条件的结果(不知道对方是谁),非偏好机制不存在。

            消化路径:(a)砖的证伪条件(b)要求"与至少一个外群体有可观测的互动"——
            "可观测"意味着群体身份信息在场。若身份信息完全不可用,这不构成对偏好
            机制的检验,而是对信息通道的检验;(b)一旦群体身份信息被引入(如NFT头像
            显示文化归属),内群体偏好在链上交易中重新出现(已有文献初步支持)。

            此案例揭示了"可观测互动"定义的一个细微之处:群体身份信息必须在互动中
            可被感知。当前操作化("经济交易或社会交往")隐含此前提但不显式。
            Should级建议:在falsifiability中加注"互动中群体身份信息需可被参与者感知"。
        - case: '【跨物种·新鲜角度】裸鼹鼠(Heterocephalus glaber)的群内无差别对待'
          outcome: |
            被消化(跨物种,不影响人类主张)。裸鼹鼠是哺乳动物中罕见的真社会性物种,
            同一群体的成员高度合作且几乎无群内攻击/歧视。但:(a)这是跨物种,不直接
            证伪人类主张——砖是关于人类的经验命题;(b)真社会性与人类社会的结构差异
            巨大(繁殖分工/世代重叠/合作育幼),不能类比;(c)裸鼹鼠对外来群体展示
            极端攻击性——外群体敌意强烈,说明"内群体爱"与"外群体恨"在此物种中以
            不同形式共存。不构成人类命题的反例。

            启示:此案例与倭黑猩猩/黑猩猩对照共同形成跨物种连续谱——内群体偏好
            在不同社会性物种中以不同强度/形式存在,人类处于该连续谱的某一位置。
            这不削弱人类命题,反为其提供比较生物学背景。
        - case: '【历史·新鲜角度】宗教迫害中的"内鬼"现象——内群体成员背叛本群体'
          outcome: |
            被消化(aggregate tendency不受single counter-instance否定)。宗教迫害
            中常见内群体成员出卖本群体同胞以换取自身安全或利益(西班牙宗教裁判所
            中的converso出卖、文革中的子女举报父母等)。这构成"内群体偏好"的
            个体级反例——内群体成员不但不偏袒,反而主动伤害本群体。

            消化路径:(a)砖的声称是统计tendency("倾向于"),非universal law。个体
            反例不推翻统计倾向;(b)在被迫害场景中,背叛行为是在更高阶生存压力下
            的理性选择,不表示偏好机制的消失;(c)若在系统性压力撤除后,内群体偏好
            重新出现(如迫害结束后社群重建内部团结),这反为偏好机制的韧性提供证据。

            此案例不构成净杀,但揭示:砖当前的falsifiability条件聚焦在"一个群体"
            的整体统计差异,未讨论群体内部个体变异——有些成员偏袒内群体、有些背叛。
            Falsifiability声称"成员在资源分配中无统计显著差异"隐含审视的是群体
            均值而非个体分布——这是合理的(社会心理学惯例),但值得记录为解释性备注。
        - case: '【场域竞争·新鲜角度】体育迷的"反内群体偏好"——故意贬低本队'
          outcome: |
            被消化。某些体育迷会在主队输球后贬低本队("我们打得真烂"),甚至暂时
            认同对方队伍("他们确实更强")。这表面上是内群体偏好反转。

            消化路径:(a)贬低本队往往是失望的表达,暗含"我们本该更好"的群体优越
            期望——内群体偏好作为期望基准存在,失望正是偏好的反面证据;(b)这种
            "反偏好"是暂时的,且在下一场比赛或赛季中内群体偏好迅速恢复;(c)即使
            在贬低时刻,球迷仍自认为"我们"(our team)——群体认同未被放弃。

            不构成反例。实际反向支持内群体偏好的韧性:即使在失望/自我批评中,
            群体身份仍是框架性参照点。
      assessment: |
        本轮+前两轮的累计猎捕覆盖:跨文化(日本uchi-soto)、跨历史(多民族帝国/
        宗教迫害)、跨物种(黑猩猩/倭黑猩猩/裸鼹鼠)、跨场域(市场/学术/体育/
        加密市场)、病理(Williams综合征)、极端(禅修社群/极端个人主义)、发展
        (儿童发育窗口)共15+案例。无一例能同时满足falsifiability(a)(b)(c)并
        产生净杀。

        核心主张(Tajfel最小群体效应)的稳健性来自百次以上跨文化复现的实证收敛,
        而非证伪条件过于宽松或talisman护身。经round_1 anti-talisman修复后,
        显著性调节子主张已具备独立测量规程,不再能吸收任意不一致案例。

        猎捕过程揭出两个should级边界细化:
        (i)"可观测互动"的操作化需显式声明"群体身份信息可被参与者感知"(全匿名
           算法市场启示);
        (ii)证伪条件的群体均值检验不承诺群体的个体内部变异均一(内鬼现象启示)。
        两者均不构成required——当前操作化已足够,加注仅提升解释精度。
