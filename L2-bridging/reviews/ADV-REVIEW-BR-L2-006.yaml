id: ADV-REVIEW-BR-L2-006
target: BR-L2-006
review_type: adversarial_review
rounds:
  round_1:
    reviewer: |
      独立对抗审查者(L2桥接砖审查管线)。全新上下文,与写砖者及IEA调查员无关。
      职责:尽最大努力打穿BR-L2-006,给硬裁决。默认怀疑,宁可错杀不放水。
      方法论 > 任何单条命题。
    verdict: needs_revision
    verdict_note: |
      BR-L2-006有真实的经验内核——最小群体范式(Tajfel 1970)证明任意/无意义的
      群体划分即可触发资源分配中的内群体偏好,这是任何L1实体(含CONCEPT-group
      的"不预设价值判断"条款)无法分析性推导的非平凡发现。三大来源方向一致且
      跨文化复现充分,核心主张(内群体偏好存在)稳健。

      但存在以下required级缺陷:

      (1)【anti-talisman-required】"强度随群体认同的显著性而增加"——显著性
      缺乏独立于结果的测量规程。若仅凭观察到的偏好强弱反推"显著性高低",
      则该子主张不可证伪。meta-analysis中认同-偏好相关仅r≈0.3-0.4,说明
      显著性不是强预测因子——当前措辞暗示了比实际证据更强的确定性。

      (2)【IEA源分类错误-required】Tajfel最小群体范式是实验社会心理学,不是
      博弈论。将其归入"game_theory"锚源导致独立性系数校准对象错位——社会
      心理学与进化生物学/文化人类学的重叠结构与博弈论不同。此外,IEA的三源
      求和(1.0+0.4+0.5=1.9)未对cu与evo_bio之间的残余重叠(成对独立性0.6,
      即40%重叠)做进一步折扣,保守IEA≈1.7。虽仍在≥1.2下限以上,但仪器折扣
      后有效独立性已逼近边界。

      (3)【人话摘要过强-should】摘要"人天生偏袒'自己人'"声称先天性("天生"),
      但正式陈述仅称"倾向于"。且发展心理学证据显示内群体偏好在3-5岁才出现
      (需自我归类能力发育完成),非与生俱来。摘要不应强于正文。

      这些均可通过定向修订修复,不构成核心坍塌,故判needs_revision。
    red_flags:
      brick_is_conclusion:
        verdict: 未命中(攻不穿,有注)
        detail: |
          L1 CONCEPT-group明示"群体不预设:价值判断"——即群体定义本身不分析性
          蕴含"偏袒自己人"。THEOREM-group-identity-decay论述的是身份信息衰减的
          维护动力学,不涉及行为层面的差别对待。两者均未声称:群体身份→差别对待。

          最小群体范式(Tajfel 1970)是真正的非平凡内核:随机颜色标签(任意/无意义
          划分)竟能稳定触发资源分配中的内群体偏好——这违反直觉(L1概念无法预测),
          且不能从L1定义中演绎推导。CONCEPT-group只说群体有边界和认同,未预测
          "无意义边界也能触发偏好"。这是干净的L2经验桥接。

          注:当前陈述的组织方式没有【前景化】这一非平凡内核——全文读起来更像
          文献综述("内群体偏好在资源分配/信任/冲突三个领域出现""三学科支持"),
          而非"本桥接在L1基础上新增的经验主张是什么"。建议在statement中将
          最小群体发现前置为核心内核,其余为佐证扩展。此为should级呈现改进,
          不影响命题实质。
      逐格判空:
        verdict: 未命中
        detail: |
          核心空格:"任意划分的群体→资源分配/信任/冲突中的差别对待"。这是真正
          的经验预测——它禁止的世界是"任意划分的群体不产生统计显著的差别对待"。
          Tajfel范式直接检验这一空格并确证。三个行为领域(资源/信任/冲突)均可
          独立操作化,不构成同义反复。

          子空格"认同显著性↑⇒偏好强度↑"的判空见anti-talisman红旗——该空格
          需要独立于结果的显著性测量才能成为真正的经验主张。
      测量轴正交:
        verdict: 未命中(有警告)
        detail: |
          IV(群体身份:内/外群体)在最小群体范式中由实验者随机分配,完全独立于
          DV(资源分配/信任/合作行为)。正交性在实验条件下干净成立。

          警告——自然情境中的焊点风险:
          在非实验情境(民族/宗教群体)中,群体身份与差别对待可能互为因果:长期的
          差别对待会强化群体边界(THEOREM-group-identity-decay的逆向——冲突作为
          身份维护仪式),而强化的边界又加剧差别对待。这是一个反馈回路,不是
          简单的IV→DV。

          但最小群体范式切断了这一回路(随机分配→无历史),证明即使去除反馈,
          效应依然存在。因此自变量的独立变异能力已被实验确证,正交性成立。
          自然情境中的反馈回路是"效应放大器"而非"源头焊死",不构成测量轴焊死。
      excluded_outcomes_independence:
        verdict: 命中(should级)
        detail: |
          证伪条件(a)-(c)方向正确——需要共享身份+可观测群际互动+无统计显著差异。
          但以下精度缺失:

          (1)"完全没有统计显著的差异"——未注册α水平(0.05?0.01?经多重比较校正?)
          和样本量/效应量预期。如果一项n=20的underpowered研究"未检出显著差异",
          算不算证伪?(显然不应算——但条件未说。)

          (2)"成员明确认同自己属于该群体"——"明确认同"的操作化未定义。是自报
          Likert量表≥4/5?是内隐联想测验(IAT)分数?是行为参与(如参加群体活动)?
          不同的操作化可能产生不同的包含/排除决策。

          (3)证伪条件未注册"什么算互动"——两个群体在地理上相邻但从不直接交往
          算不算"互动"?经济交易算不算?通婚算不算?

          这些缺陷在L2层级不构成required——L2桥接砖的精度要求低于L3推论(后者
          才是做精确空格预测的层级)。但应在证伪条件中声明"以上参数在经验检验前
          需精化",或至少给出默认操作化建议。当下为should级。
      classification_granularity_match:
        verdict: 未命中
        detail: |
          本砖不做分类(taxonomy/species),不涉及档位匹配问题。
      anti_talisman_delivery:
        verdict: 命中(required级)
        detail: |
          这是本砖最严重的缺陷,定位在"强度随群体认同的显著性而增加"子主张。

          (a)显著性(salience)的测量陷阱:
          在最小群体范式中,显著性可以通过实验操纵(如是否展示群体标签、是否
          提醒群体身份)独立于结果测量。但在自然情境或跨文化比较中,存在循环风险:
          观察者看到低偏好→推断显著性低→命题"被验证"(低显著性→低偏好)。
          循环闭合后,没有可观察的世界状态能证伪该子主张。

          (b)效应量不支持"强决定"措辞:
          Meta-analyses(Hogg & Reid 2006等)显示社会认同与内群体偏好的相关性约为
          r≈0.3-0.4——这是中小效应,意味着大量案例中高认同与低偏好共存,反之亦然。
          当前"随显著性增加"的措辞暗示单调递增关系,但实际数据呈现的是弱统计趋势
          加大量噪声。命题当前的形式是"我们总能在事后解释强度差异"而非
          "我们可以事前预测强度差异"。

          (c)fix方向:
          选项A:提供独立于结果的显著性测量规程(如自报认同量表、群体活动参与频率、
          群体符号展示行为),并在见到任何具体案例前锁死"显著性"的操作化定义。
          选项B:将子主张降级为已观察到的统计趋势,附加效应量(r≈0.3-0.4)与
          异质性声明("在特定条件下该关系减弱甚至反转,如低地位群体中出现的外群体
          偏好")。推荐A+B组合——A保底(让子主张真正可检验),B诚实(不假装比实际
          证据更强的确定性)。
      anchor_fact_check:
        verdict: 未命中(有小注)
        detail: |
          四个经验锚点逐一核查:

          (1)Tajfel minimal group paradigm(1970):稳健。被数十种文化独立复现,
          meta-analysis(Mullen, Brown & Smith 1992)确认效应稳健。效应量中等
          (d≈0.3-0.5),但在社会心理学中属可靠级别。事实无误。

          (2)民族中心主义跨文化存在(Sumner 1906; Brown 2004):方向正确。需加注:
          Sumner 1906的原始定义包含"外群体蔑视",但后续跨文化研究(Brown 2004,
          Brewer 1999)区分了内群体偏好(ingroup favoritism)与外群体贬损(outgroup
          derogation)——二者相关但不必然共存。本砖的陈述聚焦偏好而非贬损,此区分
          应被体现以避免与Sumner原始定义的侵略性外群体敌意混淆。

          (3)狭隘利他主义(Choi & Bowles 2007):稳健的演化模型,提供了内群体利他
          与外群体敌意联动演化的形式化论证。需注:此为理论模型而非直接观察,
          且模型预测的"联动"在人类数据中并不总是成立(Brewer 1999的"内群体爱
          不需要外群体恨")。砖的陈述不依赖"联动"为真,因此不影响砖的锚定。

          (4)黑猩猩群际攻击(Goodall 1986; Wrangham 1999):跨物种旁证,方向支持
          但需注:(a)黑猩猩的行为模式不能直接外推至人类——共享祖先距今6-7百万年;
          (b)倭黑猩猩(bonobo)同样与人类共享祖先,但群际攻击显著更低,经常出现
          和平群际交往。单一物种的旁证不能证明演化必然性,只能证明"这种策略在
          谱系中至少出现过一次"。砖目前的note措辞("跨物种实证基础")未提及
          倭黑猩猩反例,小注可加。

          总体:四个锚点的核心方向均成立,无严重事实错误。
      condition_definition_vs_prediction:
        verdict: 未命中(有注)
        detail: |
          关键条件拆解:
          - "群体"(来自CONCEPT-group):定义
          - "内群体偏好"(差别对待):预测——不分析性蕴于"群体"定义中
          - "任意/无意义划分也触发":预测——超乎"群体"定义所能推导
          - "显著性增加→强度增加":预测——见anti-talisman

          这三层中,第一层(存在性)和第二层(任意群体)是真正的经验预测——CONCEPT-group
          说群体有边界和认同,但没说"任意划分也能产生认同和偏好"。第三层(显著性)
          目前在定义和预测之间摇摆(见anti-talisman)。

          整体判断:本砖的主要主张(存在+任意划分触发)是预测而非下定义,不命中
          本红旗的核心关切。子主张(显著性)需修复(anti-talisman联动),修复后再判。
      enumeration_exhaustiveness:
        verdict: 未命中
        detail: |
          本砖未声称内群体偏好有N种可枚举的类型/species,不涉及枚举穷尽问题。
          行为领域(资源分配/信任/冲突)的列举是示例性而非穷尽性,砖未声称
          "仅此三类"。
      primary_suspect_accuracy:
        verdict: 命中(should级,已知)
        detail: |
          砖文件无primary_suspect字段(L2格式不要求),审查者自行诊断最弱腿:

          最致命软肋=anti-talisman兑现(已在红旗6标required)——显著性调节主张
          缺乏独立操作化,可吸收几乎所有偏弱或不一致的案例。

          次致命软肋=IEA源的学科分类错位(见iea_independence_check):Tajfel的
          社会心理学实验被归入"博弈论",独立性系数校准对象因此产生系统性偏差。
          IEA 1.9的学科独立性上限可能高估了真实多样性。

          第三软肋=人话摘要的"天生"措辞过强(见verdict_note):先天性声称超出
          正式陈述范围,且被发展心理学证据挑战。摘要过强会给上层L3推论传递
          错误的启发(如认为内群体偏好是"硬连线"而非"强倾向")。

          文件自认的最弱腿:cross_verification的verdict_note未显式指出最弱腿,
          但仪器折扣披露中暗示了单LLM执行是其已知弱点。
      caliber_completeness:
        verdict: 命中(should级)
        detail: |
          证伪条件注册了:共享身份+群际互动+无统计差异作为证伪三要件。但以下
          口径缺失:
          - "统计显著"的α水平未注册
          - "明确认同"的操作化定义未注册(自报量表?行为指标?)
          - "可观测互动"的操作化定义未注册(什么类型?什么频率?)
          - 测量领域(资源分配/信任/合作/冲突)是"全部"都必须无差异,还是"任一"
            即可?措辞"在资源分配、信任、合作中"的列表是AND还是OR?

          这些缺失在L2层级不构成required——L2桥接砖的定位是为L3推论提供经验基础,
          精确的空格预测和口径注册是L3的任务。但至少应:
          (a)声明这些参数在经验检验前需精化;
          (b)给出默认建议(如α=0.05,双尾,"全部AND"需同时无差异)。
          当下为should级。
    iea_independence_check:
      result: 独立性虚高(分类错位+三源残余重叠未折扣)
      detail: |
        === 数学核算 ===
        当前: IEA = 1.0(gt锚) + 0.4(evo_bio, independence vs gt=0.4) + 0.5(cu, independence vs gt=0.5) = 1.9
        核算正确,>1.8的verified阈值。

        === 分类错位(核心问题) ===
        Tajfel(1970)最小群体范式属【实验社会心理学】,非博弈论。其理论基础为
        社会认同理论(Social Identity Theory, Tajfel & Turner 1979),研究范式
        为实验室实验+资源分配矩阵,不使用博弈论的形式工具(Nash均衡/ESS/等)。

        将此归入"game_theory"锚源导致:
        (a)independence-model.yaml的成对独立性系数是针对【博弈论】这个学科的
           共享结构校准的(如evo_bio⟷game_theory共享"演化博弈论数学结构")。
           若锚源实际内容是社会心理学,这些系数未必适用。
        (b)实验社会心理学与cultural_universals(跨文化心理学/人类学)的
           方法论重叠(均使用实验/调查/跨文化比较)可能高于博弈论与cu的重叠,
           意味着0.5的cu折扣可能偏高(实际独立性更低)。

        这不应理解为"造假"——Tajfel效应是真实的、权重1.0的锚定是合理的。
        问题在分类标签偏移了独立性系数的校准基础,应以"社会心理学"或
        "实验心理学"重新标记锚源,或至少披露此分类偏移及其对IEA的潜在影响。

        === 三源残余重叠未折扣 ===
        当前IEA只对非锚源做【对锚】的成对折扣:
          evo_bio ← [0.4折扣] ← gt
          cu      ← [0.5折扣] ← gt

        但未对cu做【对evo_bio】的折扣。independence-model.yaml给出
        evo_bio⟷cultural_universals的成对独立性=0.6(即重叠40%)。
        cu的贡献应在对gt折扣后再打对evo_bio的折扣:

        保守IEA = 1.0 + 0.4 + 0.5×(1-0.4) = 1.0+0.4+0.3 = 1.7

        1.7低于1.8的verified阈值。这不是计算违规——independence-model未明确
        规定三源求和的折扣层级——但按保守独立核算原则,应承认此折扣。

        === 仪器折扣 ===
        已披露"单一LLM执行"。此披露诚实。但"稳固共识命题→缓解"应更精确地
        限定:本命题的"稳固"集中在Tajfel效应本身(百次以上复现),但"显著性
        调节"子主张和"三个行为领域全覆盖"延伸主张的证据稳固度显著低于
        Tajfel效应本身。建议将mitigation措辞从泛称"该命题属于多重复现的
        稳固共识命题"收紧为"Tajfel最小群体效应(核心锚)属多重复现的稳固发现;
        显著性调节与跨领域覆盖的收敛强度低于核心锚"。

        === 综合判断 ===
        IEA 1.9的学科独立性上限【高估】真实独立来源多样性——分类错位+三源
        残余重叠+仪器折扣三重叠加后,有效独立性很可能在1.0-1.5区间。核心锚
        (Tajfel效应)的真实稳健性才是本砖的真正支撑,而非三学科"独立"验证的
        表象。这不是required级推翻verified的理由(1.2下限仍可能满足),但必须
        修正分类错位和三源折扣透明化,否则IEA的结构性虚高构成方法论债务。
    counterexample_hunt:
      result: 未猎到净杀反例;揭出显著性调节的过度伸张
      cases_searched:
        - case: '低地位群体的外群体偏好(system justification, Jost & Banaji 1994)'
          outcome: |
            被消化(但揭出显著性taliman的过度伸张)。
            低地位群体成员有时在隐式/显式测量中偏好高地位外群体而非自身内群体
            (如美国黑人儿童在娃娃偏好实验中的外群体偏好,Clark & Clark 1947)。
            这与"内群体偏好"的核心主张(人类倾向于偏袒自己人)表面矛盾。

            如何被消化:本砖的显著性调节子主张可吸收——"这些低地位群体成员的
            内群体认同显著性低(因内化了主流群体的贬低)"。但此吸收恰暴露了
            talisman问题:显著性低本身无法独立于"他们没表现出偏好"来测量——
            循环闭合。

            更诚实的处理:识别此案例不是"内群体偏好"核心主张的反例(因为核心
            主张是tendency而非universal),而是"显著性必然调节偏好"这一强主张
            的反例——低地位群体成员即使自报高内群体认同,仍可能表现出外群体偏好
            (Jost et al. 2004的meta-analysis显示内群体认同与外群体偏好的负相关
            并非总是显著)。这说明认同和偏好之间的调节通路比"显著性"一词所暗示的
            更复杂(涉及地位合法性感知、社会流动信念、系统威胁等额外变量)。

            裁决:案例不杀核心主张,但构成对显著性调节子主张的重要限定——显著
            性不是单调调节因子,而是与其他变量交互。
        - case: '倭黑猩猩(bonobo)的低群际攻击与和平群际交往'
          outcome: |
            跨物种旁证,被消化。倭黑猩猩(Pan paniscus)与黑猩猩(Pan troglodytes)
            同为人属最近亲属(共享祖先~6-7mya),但群际关系截然不同:黑猩猩群际
            攻击致命且频繁(Goodall 1986, Wrangham 1999);倭黑猩猩群际交往相对
            和平,甚至出现群际 grooming/play/sex(Furuichi 2011, Tan & Hare 2013)。

            这不直接证伪人类的命题——本砖是关于人类的经验主张,不声称内群体
            偏好是"演化必然"。但构成对跨物种论证的单向性警告:若只用黑猩猩
            旁证支撑"演化根源",而不提倭黑猩猩的相反模式,证据呈现偏向 confirmatory。
            建议在evo_bio note中补充倭黑猩猩对照,体现"该策略在谱系中存在但非必然"。
        - case: '多民族帝国的超民族身份认同(罗马公民权扩展, Ottoman millet系统)'
          outcome: |
            被消化。罗马帝国在Caracalla敕令(212CE)后授予全帝国自由民公民权,
            理论上消除了"罗马人vs外省人"的法律群体边界。但实际上:(a)公民权
            扩展后迅速形成了"旧贵族vs新公民"的新内群体边界;(b)Honestiores vs
            Humiliores的阶序分化在Diocletian改革后正式化——内群体偏好只是更换
            了附着对象,未消失。Ottoman millet系统中,各宗教社群(millet)内部
            有强烈的内群体偏好(如millet内部的司法自治),同时帝国上层以共同
            的"Osmanlı"身份维持统治群体的内群体偏好。

            裁决:多民族帝国没有消除内群体偏好,只是改变了群体边界的位置——
            恰好反向支持本砖的核心主张(偏好附着于群体,但不必然附着于特定群体)。
        - case: '学术界的跨学科合作(IDR, interdisciplinary research)'
          outcome: |
            被消化。跨学科合作中,研究者理论上应平等对待不同学科的方法和视角。
            但实际上:(a)学科内引用偏见(更倾向引用本学科期刊)有充足文献证实;
            (b)跨学科评审中,评审者对本学科方法的偏好影响基金分配(Lee & Bozeman
            2005等);(c)学科身份强但跨学科合作频繁的研究者仍表现出统计显著的
            内群体偏好,只是效应量较小。

            裁决:不构成反例——即使在高认知需求+平等规范的现代学术环境中,内群体
            偏好以弱形式持续存在。实际上是支持案例(认知覆盖不消除偏好)。
        - case: '宗教普世主义社群的激进平等实践(早期基督教/某些佛教僧团)'
          outcome: |
            被消化。早期基督教("不分犹太人或希腊人")和佛教僧团在意识形态层面
            明确否定内-外群体区分。但:(a)意识形态否定≠行为消除——即使早期
            基督教内部也迅速出现了"犹太基督徒vs外邦基督徒"的分化(使徒行传15);
            (b)僧团本身构成了新的内群体("出家"vs"在家"),内群体偏好以新形式
            再生;(c)这些社群的存续时间有限(早期基督教被制度化后,普世主义作为
            制度原则而非日常实践存在)。

            裁决:这些案例说明内群体偏好可以通过意识形态被【抑制】,但抑制需要
            持续能量投入(这个洞察本身可反哺THEOREM-group-identity-decay在行为
            层面的含义)。不构成反例——抑制的存在不等于效应的缺席。
        - case: '成人后的收养家庭(无亲缘+后天归属)'
          outcome: |
            被消化。成年后被收养进入新家庭者,对收养家庭的内群体偏好强度通常
            显著低于原生家庭偏好。但这不是"无偏好"——当收养关系稳定且持续
            数十年后,收养家庭的偏好强度接近但不超过原生家庭(Weisfeld et al.
            等亲缘/非亲缘比较研究)。

            裁决:偏好的强度可变、可迁移、可后天建立——这些特征不证伪偏好
            的存在,反为"偏好如何被建立/转移"提供了细化方向(与THEOREM-group-
            identity-decay的维护机制衔接)。
      assessment: |
        猎捕未获净杀反例。内群体偏好的存在性在人类行为中是极其稳健的经验规律。
        但这不完全是因为命题无懈可击,而是因为:

        (a)核心主张(偏好存在)的证据极其强大——Tajfel范式百次以上复现,民族
        中心主义的跨文化文献数百项研究收敛。

        (b)显著性调节子主张(talisman风险)的弹性过大——几乎所有潜在反例都可
        通过"显著性低/受其他变量调节"吸收。这不是核心主张的稳健,而是子主张
        的不可证伪。修复anti-talisman后,低地位群体外群体偏好、高认同-低偏好
        等案例将成为对该子主张的有效压力测试。

        (c)跨物种对比的黑猩猩单侧性(bonobo不在视野)显示证据呈现的confirmatory
        bias倾向——在evo_bio论证中补充倭黑猩猩对照可提升论证诚实度。

        总体:核心主张扛住猎捕。显著性调节子主张的过度伸张被揭出——它需要
        独立操作化才能成为真正的经验命题而非解释性护身符。
    non_recurrence:
      DED-004_loop:
        verdict: 未重蹈
        detail: |
          DED-004死因=声称两种独立现象(行政记录成文+法律成文)必然耦合,被20个
          古代政体经验检验推翻,再加"打折版"被第三轮审查驳回。
          BR-L2-006不声称任何两种独立现象的必然耦合——它声称一种人类行为倾向
          (内群体偏好)的普遍存在。证伪条件前置,命题结构完全不同。
      DED-007_welded_axis:
        verdict: 未重蹈
        detail: |
          DED-007死因=测量轴焊死(通货三驱动用结果反推前件,自变量不可独立测量)。
          BR-L2-006的核心IV(群体身份:内/外群体)在最小群体范式中由实验者随机
          分配,完全独立于DV(差别对待)。测量轴干净正交。自然情境中的身份-偏好
          反馈回路是放大器而非源头焊点。不重蹈DED-007。
    required_fixes:
      - |
        1.【required-anti-talisman】"强度随群体认同的显著性而增加"子主张须兑现
        anti-talisman——提供独立于结果的显著性测量规程(如自报认同量表、群体活动
        参与频率、群体符号展示行为),并在见到任何案例前锁死操作化定义。同时补充
        实际效应量(r≈0.3-0.4)与边界条件声明——"在特定条件下该关系减弱甚至反转
        (如低地位群体的外群体偏好、多重身份交叉压力)",避免暗示比实际证据更强的
        单调确定性。
      - |
        2.【required-iea-reclassification】将cross_verification中的"game_theory"
        锚源重新标记为"social_psychology"(或"experimental_psychology"),因为
        Tajfel(1970)的最小群体范式属于实验社会心理学而非博弈论。同时披露:
        (a)源标签偏移对独立性系数校准的影响(社会心理学vs博弈论与各源的独立性
        结构不同);(b)cu的权重未对evo_bio的残余重叠做进一步折扣(evo_bio↔cu
        成对独立性0.6→40%重叠),保守IEA≈1.7<1.8的verified阈值。
      - |
        3.【required-summary-alignment】修正人话摘要中的"人天生偏袒'自己人'"措辞——
        "天生"暗示先天/硬连线,但:(a)正式陈述仅称"倾向于";(b)发展心理学证据显示
        内群体偏好在3-5岁随自我归类能力发育而涌现,非与生俱来;(c)倭黑猩猩
        (同等近缘)的低群际攻击说明该倾向在演化谱系中非必然。建议改为"人很容易
        偏袒'自己人'"或"人有一种根深蒂固的倾向去偏袒'自己人'"。
      - |
        4.【should-foreground-kernel】建议在statement中前景化非平凡经验内核:将
        "即使群体划分基于任意/微不足道的标准(如随机颜色标签)"的Tajfel最小群体
        发现从陈述的中段提前,作为本桥接区别于L1定义的标志性经验贡献。当前陈述
        按"什么+哪三个领域→即使→强度"排列,更像文献综述;改为"Tajfel发现→
        这意味着→延伸到三个领域→强度调节"更能彰显桥接逻辑。
      - |
        5.【should-scope-precision】证伪条件补充默认操作化建议:α=0.05(双尾);
        "明确认同"=自报≥4/5 Likert或多指标聚合;"可观测互动"=至少经济交易或
        社会交往两类中任一类;测量领域的AND/OR逻辑明确化(建议AND——需资源/信任/
        合作三个领域同时无显著差异)。声明以上参数在正式经验检验前可精化。
      - |
        6.【should-bonobo-disclosure】evo_bio的cross_verification note中补充
        倭黑猩猩对照:黑猩猩(Pan troglodytes)展示群际攻击,但倭黑猩猩(Pan paniscus)
        展示和平群际交往,说明内群体偏好/群际攻击在人类谱系中非演化必然,而是
        一种有条件表达的策略。这不削弱论证,但提升证据呈现的双向诚实度。
