id: ADV-REVIEW-BR-L2-043
type: adversarial_review
reviews: BR-L2-043
layer: L2-bridging
target: BR-L2-043
target_term: 礼物交换中的层级自发形成 (Gift Exchange and Spontaneous Hierarchy Formation)
rounds: 1

人话摘要: |
  对 BR-L2-043(礼物交换中的层级自发形成——持续净赠予→非正式权力)的 round-1 独立对抗审查。
  裁 needs_revision:核心直觉(非对称礼物交换可在特定条件下产生非正式权力差序)经验上 plausible，
  但存在 4 条 required 缺陷——(1)无 IEA/cross_verification，两源共享理论根(Mauss→Blau)，
  有效独立性远低于 L2 verified 门槛；(2)因果方向歧义未处理(送礼→层级 vs 层级→送礼)，
  观测等价两个反向因果；(3)测量轴非正交——IV(净赠予价值)和DV(非正式影响力)在典型
  田野场景中由同一批信息提供者报告，存在共同方法方差；(4)brick=conclusion 部分命中——
  "债务→义务→权力"这一链接近乎 CONCEPT-power 的定义性展开。反例猎捕未发现净杀，
  但 potlatch(agonistic exchange)和 egalitarian leveling mechanisms 揭示了机制
  单调性过度伸张。

round_1:
  reviewer: independent-adversarial-reviewer
  date: 2026-07-16
  verdict: needs_revision
  verdict_note: |
    本命题的核心直觉——持续非对称礼物交换可在群体中积累社会信用、进而形成非正式
    权力差序——在经验上是 plausible 的。经济人类学(Mauss/Malinowski/Graeber)和
    组织行为学(Blau/Cropanzano & Mitchell/Shore et al.)各自从田野和实验室提供了
    方向性支持。Big Man 系统(Melanesia)和库拉圈(Trobriand)中确实观察到净赠予者
    地位升高的模式。

    但四条 required 级缺陷阻止 verified 裁决:

    1.【IEA 完全缺失——REQUIRED】
    本砖无 cross_verification 段、无 IEA 计权、无独立性评估。仅列出两个来源
    (economic_anthropology + organizational_behavior)，且二者共享深刻的理论根源——
    Blau(1964)的社会交换理论明确以 Mauss 的礼物交换和 Malinowski 的互惠概念为
    理论基础(Gouldner 1960 的互惠规范是二者的共同锚点)。按 independence-model 的
    data_source_origin 折扣精神，当来源 B 的理论框架以来源 A 的经验发现为输入时，
    有效独立性远低于 default 0.6——保守估计在 0.2-0.3。即使按最乐观估值
    (anchor=1.0 + second=0.6×0.6=0.36，IEA=1.36)，也不足 verified 门槛 1.8，
    勉过最低门槛 1.2 但余量极薄。更诚实的估值(<1.0)将跌破最低线。
    砖当前是 candidate 状态且 author 为"free model draft"——IEA 段从未执行。
    这本身不构成致命否定(未执行≠不能执行)，但在当前状态下，命题缺乏多源独立
    证据支撑的最低保障。必须执行 IEA 调查并产出 cross_verification 段。

    2.【因果方向歧义——REQUIRED】
    命题声称:非对称礼物交换 → 非正式权力层级。但存在一个观测等价的竞争假设:
    既有高地位者因 noblesse oblige(位高则任重)而被期望给予更多——即层级 → 非对称
    礼物交换。在横截面田野观察中，二者产生相同的数据模式(净赠予者=高地位者)，
    无法区分因果方向。
    砖未提及此歧义，也未提供任何区分策略(如纵向追踪新群体形成、实验操纵赠予量)。
    这构成 required 级缺陷——因果主张与竞争假设观测等价而未被处理。

    3.【测量轴非正交——REQUIRED】
    IV(净赠予价值=给予总价值-接收总价值)和 DV(非正式影响力=建议采纳率/冲突调解
    权威)在典型田野场景中均由同一批社区信息提供者报告。民族志学者通过访谈社区成员
    同时获取"谁给了谁什么"和"谁说了算"——两个变量的数据来自同一人类信息源、
    同一次访谈、同一套社会认知。这产生共同方法方差(common method variance):
    若信息提供者认为某人"有影响力"，他们也可能回溯性地高估此人给出的礼物价值
    (halo effect)，反之亦然。这与 DED-007 的"分母用实际获授者"焊接在结构上同构——
    IV 的测量被 DV 的社会认知污染。砖未讨论此问题，也未提出异源测量策略
    (如物质礼物独立清点 vs 地位排序独立盲评)。

    4.【brick=conclusion 部分命中——REQUIRED】
    命题的机制链是:"持续给予价值超过接收价值 → 未偿还信用差额 → 不对称义务感知
    → 非正式权力层级"。拆解此链:
    - "未偿还信用差额" = 债务 = 一种资源不对称
    - "不对称义务感知" = 一方觉得欠另一方 = 权力关系的前件
    - "非正式权力层级" = 权力关系的结构化

    CONCEPT-power 明确定义权力来自"暴力、钱、信息、地位或人多等某种本钱"——
    "钱"(广义资源)已包含"债务/信用差额"这一子类。CONCEPT-hierarchy 定义层级为
    "上下级有更大决策权的安排"——与"非正式权力层级"近乎同义。
    CONCEPT-exchange 定义交换产生关系——与"礼物交换产生义务关系"近乎同义。

    将三者拼接:交换产生关系(CONCEPT-exchange) + 不对称交换产生资源差额 → 资源差额
    是权力的本钱之一(CONCEPT-power) → 权力的结构化即层级(CONCEPT-hierarchy)。
    这条链中，除"礼物交换【确实】能在经验世界中产生不对称义务感知"这一经验断言外，
    其余环节均有较强的定义性色彩。

    砖的非平凡经验内核仅限于:礼物交换(而非其他资源转移形式)能否有效地、跨文化地
    产生不对称义务感知。这缩水为一个比 statement 声称窄得多的主张。砖需诚实标注
    其定义性依赖并收窄声称范围，或将经验内核操作化为可独立检验的预测。

    四条 required 均可通过定向修订修复(非结构塌陷)，故判 needs_revision 而非 rejected。
    核心直觉(非对称交换→权力差序)有经验根基，需补的是 IEA 执行、因果识别策略、
    测量轴正交化、定义性依赖诚实标注。另附 3 条 should。

  red_flags:
    brick_is_conclusion:
      hit: true
      detail: |
        部分命中——非平凡经验内核存在但大幅缩水。

        命题声称机制:"持续给予价值超过接收价值 → 未偿还信用差额 → 不对称义务感知
        → 非正式权力层级"。

        逐一对照 L1 概念:
        - CONCEPT-exchange 定义交换为"双方你情我愿地互相让出各自的东西"，且强调
          "换完后每一方都觉得自己更划算了"。不对称交换(一方净给予)本质上是交换的
          退化形式——当交换不是"双方都觉得更划算"时，差额方处于"被欠"地位。
        - CONCEPT-power 定义权力来自"暴力、钱、信息、地位或人多等某种本钱"——
          "钱/资源"作为权力本钱已包含"债务/信用差额"这一子类。债务作为一种资源
          优势产生权力，不是新发现——是 CONCEPT-power 定义的直接应用。
        - CONCEPT-hierarchy 定义层级为"上下级有更大决策权的安排"——非正式影响力
          (建议被采纳、冲突调解权威)是层级在非正式维度的实例化。

        非平凡经验内核仅剩:【礼物交换这一特定互动形式】能否在经验世界中有效产生
        "不对称义务感知"——即人们是否真的因为收到礼物而觉得欠了对方。这是一个
        真实经验问题(某些文化/情境中可能不成立)，但其范围远窄于 statement 声称的
        整条"交换→权力→层级"链。砖将定义性展开与经验主张混合呈现，夸大新颖性。

        砖的贡献宜重新定位为:CONCEPT-exchange × CONCEPT-power 的一个经验实例化
        (礼物交换作为权力形成的具体渠道)，而非一条独立的理论贡献。

    empty_cell_tautology:
      hit: false
      detail: |
        核心预测(净赠予者获得更高非正式影响力)是可观察的经验主张，非同义反复。
        存在逻辑上可能的反事实世界——净赠予者被忽视、被视为傻瓜(sucker effect)、
        或赠予行为被 norm 压制(如 egalitarian 社会中的 leveling mechanisms)——
        在这些世界中预测不成立。
        空格预测的结构性问题是因果方向歧义(见 red_flag 8)而非 tautology。

    measurement_axis_orthogonality:
      hit: true
      detail: |
        本红旗命中——IV 与 DV 在典型测量场景中存在系统性共源污染。

        IV(净赠予价值):在民族志田野中，通过访谈社区成员获取"谁给了谁什么、价值
        几何"。DV(非正式影响力):通过访谈同一批社区成员获取"谁的建议被采纳、谁在
        冲突中有权威"。

        共同方法方差(Common Method Variance)的三种具体路径:
        (1) Halo effect:信息提供者若认为某人"有影响力"(DV 高)，会回溯性地高估此人
        给出的礼物价值或低估此人收到的礼物价值(IV 被 DV 污染)。
        (2) 同一认知图式:在多数文化中，"慷慨"和"有威望"本就属于同一认知簇——
        报告者不会在心理上将二者严格分离后再分别报告。
        (3) 回忆偏差:高地位者的礼物更可能被记住和报告(显著性偏差)，而低地位者的
        小额赠予被遗忘。系统性高估高地位者的净赠予。

        此问题与 DED-007 的"分母用实际获授者"焊接同构——IV 的测量值部分由 DV
        的社会认知决定，而非完全来自独立测量链。

        可能的异源测量策略(砖未提供):
        - IV:物质礼物独立清点(民族志学者直接记录而非依赖回忆报告)
        - DV:行为观察(会议发言被打断次数、他人主动征求意见的频率)而非主观声望排序
        - 实验法:控制赠予量→观察后续影响力变化(组织行为学文献中有此类范式)

        砖未讨论测量独立性问题，也未提出异源策略。在当前状态下，IV-DV 的正相关
        可部分或全部由共同方法方差解释，无法作为机制成立的干净证据。

    scope_exclusion_independent:
      hit: false
      detail: |
        三条排除项按可事前测的渠道划界:
        (a) "不声称任何礼物交换都必然产生层级"——排除普遍必然性，保留概率性主张。
        这是合理的 scope 限定，渠道独立(是否存在层级可独立于礼物交换测量)。
        (b) "不排除其他权力来源"——排除排他性，允许混杂。合理且标准。
        (c) 隐含排除(未明说但实际生效):当赠予动机被视为工具性时，预测可能反转。

        falsifiability (b)的"明确知晓动机"是一个有问题的事后排他渠道——见
        anti_talisman 红旗。

    classification_granularity:
      hit: false
      detail: |
        命题处理的变量(净赠予量、影响力水平)是连续量，未强制二分。但"净赠予者 vs
        净接收者"的二分在操作化时需要切点——什么程度的净差额算"净赠予"？时间窗口
        多长？这些未注册。不过对 L2 桥接命题而言，连续量主张配合方向性预测是合理的，
        不要求 L3/L4 级的分类判据精度。

    anti_talisman:
      hit: true
      detail: |
        本红旗部分命中——两条证伪路径存在操作化缺口，一条构成 talismanic 逃生舱。

        (a) "净赠予者未获更高影响力"——这需要:可独立测量 IV 和 DV(见测量轴正交
        红旗)+ 足够统计效力检测差异。当观测结果不显著时，砖可辩称"其他权力来源
        干扰太大"或"样本量不足"——逃生舱存在。但这不是结构级 talisman(判据本身
        在原则上可测)，是操作级。

        (b) "当群体成员明确知晓净赠予者的工具性动机时，赠予者反而被排斥"——
        这是本命题最严重的 talismanic 缺陷:
        - "明确知晓动机"如何操作化？谁来判断动机是否被"明确知晓"？
        - 若净赠予者未获影响力(证伪条件(a)被触发)，砖可辩称"那是因为成员隐约
        感知到了工具性动机"——以此消化反例。
        - "动机可知性"不是一个可事前独立测量的变量——它与 DV(是否获得影响力)
        在测量上缠绕:若某人未获影响力，可反推"他的动机被知晓了"。
        这构成护身符式逃生舱:你永远无法证伪(b)因为无法独立判定"动机是否被知晓"。

        (c) "跨文化中出现相反模式:净接收者获得更高地位"——这条是三条中最干净的
        证伪路径。但仍有一个微妙问题:若某文化中"接受礼物"本身就是高地位的象征
        (如印度 jajmani 系统中接受服务报酬的高种姓)，这是否算"相反模式"？
        砖可将此 re-interpret 为"该文化中给予方和接收方的定义不同"(接受方以
        另一种方式"给予"——如给予庇护/精神祝福)——模糊了"给予/接收"的操作定义。

        综合:证伪条件(b)是结构级 talisman(不可独立测量的逃生舱)，条件(a)和(c)
        是操作级(原则上可测但存在模糊性)。建议删除(b)或将其重构为可独立测量的
        条件(如:实验操纵——明确告知被试"此人的赠予是为换取你的支持"vs 不告知)。

    reality_anchor_fact_check:
      hit: true
      detail: |
        引用属实但存在选择性呈现和解读偏差:

        (1) Mauss(1925)《礼物》——引用属实，但 Mauss 的核心论点是"礼物交换的
        三重义务(给予-接受-回报)"及其在"总体社会事实"(total social fact)中的
        嵌入性，而非层级形成。更重要的是，Mauss 在同一著作中详细描述了 potlatch
        (夸富宴)作为"agonistic exchange"(竞争性礼物交换)——Chief 通过大量给予
        甚至毁坏财富来 crush rivals。Potlatch 中的不对称给予产生的是【支配-屈从】
        关系(通过羞辱无法对等回礼的对手)，而非本命题声称的"信用积累→义务→权力"
        路径。这是同一来源内部的机制多样性，砖未提及。

        (2) Malinowski(1922)库拉圈——引用属实，地位差异随礼物流动浮现。但库拉
        圈中的交换是双向循环的(臂环顺时针、项链逆时针)，"净给予"的概念在库拉
        体系中并不直接适用——每个参与者同时是给予者和接收者(对不同交易伙伴)。
        地位来自在交换网络中的位置(中心→边缘)，而非"净给予量"。

        (3) Gregory(1982)礼物经济 vs 商品经济——引用属实，非等价交换维系社会
        关系是其核心论点之一。但 Gregory 强调的是礼物交换创造"质的"(人与人之间的)
        关系，而商品交换创造"量的"(物与物之间的)关系——与权力层级的连接是间接的。

        (4) Graeber(2011)《债》——引用属实。Graeber 确实论证了信用/债务是社会
        等级的基础。这是本命题最强、最直接的文献支撑。但 Graeber 的论点比本命题
        更复杂:他区分了"日常共产主义"(不记账的分享)、"层级化的债务"(无法偿还的
        债产生永久从属)和"交换"(精确对等的易货)三种社会逻辑。“礼物交换产生层级"
        是对 Graeber 复杂论证的简化。

        (5) Blau(1964)社会交换理论——引用属实。Blau 确实认为非对等交换产生权力
        差异。但需注意 Blau 的分析单元是现代正式组织中的交换(咨询/协助/信息)，
        而非传统社会中的礼物交换。从 Blau 向民族志语境的推广是类比性的。

        (6) Cropanzano & Mitchell(2005)——引用属实，综述社会交换理论在组织中的
        应用。方向支持。

        (7) Shore et al.(2009)——引用属实。但"导师给予多于回报→导师获得更高地位"
        这个例子中，导师的初始地位通常已经高于被指导者(导师通常是 senior，
        被指导者是 junior)——这是层级→不对称给予，而非不对称给予→层级。

        综合:引用真实存在，但存在三种偏差:(i)选择性呈现(Mauss 的 potlatch 被
        省略);(ii)过度简化(Graeber 的三分法被缩为一维);(iii)因果方向未经审视
        (Shore et al. 的导师案例中初始地位差异已存在)。无致命事实捏造，但证据
        呈现的完整性不足。

    definition_vs_prediction:
      hit: true
      detail: |
        部分命中——命题的机制链中，多个环节处于"定义性展开"与"经验预测"的灰色地带。

        拆解机制链:
        ① "持续给予价值 > 接收价值" → 这是对行为的描述，可以是纯观察。
        ② "产生未偿还信用差额" → 这在会计学意义上是定义性的——如果你给的比收的
        多，差额就是"对方欠你的"。这是定义而非预测。
        ③ "转化为不对称义务感知" → 这是关键的经验跳跃:信用差额作为一种"账面事实"
        【是否】以及【通过什么心理机制】转化为对方的"我觉得欠了他的"主观感受——
        这是真正的经验问题(非定义)。某些文化/情境中，人们可能不将礼物视为产生
        义务的东西(视为纯粹慷慨/或视为给予者炫耀地位的工具);某些文化中接受者
        可能感到"被羞辱"而非"欠了情"(potlatch)。③是命题真正的经验内核。
        ④ "进而形成非正式权力层级" → "义务感知"到"权力"再到"层级"有定义性趋势:
        如果你觉得欠了某人的情，你会更愿意按他的意思办——这近乎"义务"和"权力"的
        定义性连接。但"单次义务是否累积为稳定的层级"是经验问题(需观察)。

        命题的真正经验空间集中在环节③——不对称交换是否触发义务感知——以及环节④
        的累积动力学。其余部分有较强的定义性。砖未区分哪些环节是定义性的、哪些是
        经验性的，使整条链看起来都像是"发现"而非部分为"展开"。

    enumeration_exhaustiveness:
      hit: false
      detail: |
        命题未声称可枚举的物种/类别，不适用 DED-008 红旗。

    primary_suspect_accuracy:
      hit: true
      detail: |
        L2 砖无 formal primary_suspect 字段(L3 要求)，但按红旗精神识别最弱腿:

        砖自认的最弱腿:无(砖未设 self_critique/primary_suspect/limitation 段)。

        外部识别的最致命软肋(按致命程度排序):
        (i)【因果方向歧义——最致命】命题声称:非对称给予→层级。竞争假设:层级→
        非对称给予(noblesse oblige/位高者被期望给予更多)。在横截面观察中二者观测
        等价——无法区分。这是 required 级(见 required_fix #2)。

        (ii)【IEA 完全缺失——致命】无任何独立性评估，两源共享理论根。这是 required
        级(见 required_fix #1)。

        (iii)【测量轴焊接——致命】IV 和 DV 在典型场景中间源测量。这是 required 级
        (见 required_fix #3)。

        (iv)【机制链的定义性成分过高——严重】"债务→义务→权力"链路有强定义性，
        非平凡经验内核缩水为"礼物交换是否触发义务感知"这一窄问题。这是 required 级
        (见 required_fix #4)。

        (v)【potlatch/agonistic exchange 未被处理——严重】命题自身引用的 Mauss
        来源中就包含了与命题机制不同的礼物交换动力学(竞争性/毁灭性赠予)。砖未解释
        其机制为何在某些条件下走"义务→合作"路径而非"羞辱→支配"路径。这是条件
        未指定的空洞。

    caliber_registration:
      hit: true
      detail: |
        本红旗命中——核心变量的测量口径未注册。

        (1)【"净赠予"的操作化缺口——REQUIRED 级】
        statement 使用"给予总价值超过接收总价值"定义净赠予，但未注册:
        - "价值"如何计量？物质价值(市场价格)还是主观价值(接收方感知的珍贵程度)？
        在礼物交换中二者常不一致(一件祖传物品的市场价值可能很低，但主观价值极高)。
        - 时间窗口:多长时期内的累计？终身累计还是某特定时段？
        - 间接互惠:若 A 给 B，B 给 C，C 给 A——A 是净赠予者还是净接收者？三元
        循环中的"净"如何定义？
        - 不可量化的赠予:如"给予面子""给予时间陪伴""给予政治支持"是否计入？

        (2)【"非正式影响力"的操作化缺口】
        statement 给出两个操作化指标——"决策建议被采纳的频率"和"冲突调解中的
        权威"——但没有注册:
        - 决策建议:什么级别的决策(日常小事 vs 群体大事)？如何定义"被采纳"
        (口头同意 vs 实际执行)？
        - 冲突调解权威:如何与"大家都怕他所以不敢不让他调解"区分？
        - 两个指标不一致时(建议采纳高但调解权威低)如何裁决？

        (3)【falsifiability (b)的"动机知晓"未定义——REQUIRED 级】
        见 anti_talisman 红旗——"明确知晓动机"是无口径的空操作化。

        按 L4-009 判例精神:未注册口径的反向裁决——若出现边界反例，事后定义的
        口径一律按对推论不利的方向裁决。砖在当前状态下面临严重的口径风险:
        几乎任何不利于预测的观测都可以通过事后收窄"价值"或"净赠予"定义来消化。

  iea_independence_check:
    note: |
      本砖无 cross_verification 段——IEA 从未执行。以下为审查者基于 independence-model
      规则的预估分析，不代表正式 IEA 计权。

    source_1_economic_anthropology:
      estimated_weight: 1.0
      role: 锚源(anchor)
      detail: |
        经济人类学通道是本命题最自然的锚源。Mauss/Malinowski/Gregory/Graeber
        提供了礼物交换与地位/债务/社会关系的最直接田野证据。
        但本锚源内部存在机制多样性:Mauss 描述的不只是互惠性礼物交换，还包括
        agonistic/竞争性礼物交换(potlatch)，后者产生的是支配-屈从关系而非
        义务-合作关系。锚源自身蕴含了对命题机制的挑战。

    source_2_organizational_behavior:
      estimated_weight: 0.6
      estimated_independence: 0.2-0.3
      detail: |
        Blau(1964)的社会交换理论明确以 Mauss/Malinowski 的礼物交换概念为理论
        基础，通过 Gouldner(1960)的"互惠规范"(norm of reciprocity)继承并形式化。
        Cropanzano & Mitchell(2005)的综述追踪了社会交换理论从人类学根源(Gouldner/
        Mauss/Malinowski)到组织行为学的完整谱系——两源不是"独立发现同一现象"，
        而是"同一理论谱系的两个节点"。

        按 independence-model 的 data_source_origin 逻辑:若 source B 的理论框架
        以 source A 的经验发现为输入，二者的独立性不应按 default 0.6 计。类比
        CNBS→WB/IMF 的数据同根(0.1)，理论同根(Econ Anthro→Org Behavior)的有效
        独立性应在 0.2-0.3 范围(理论同根比数据同根稍高，因理论有再加工/再检验
        空间，但仍远低于 default)。

    iea_estimation:
      optimistic: |
        anchor(1.0) + org_behavior(0.6 × 0.6 default independence) = 1.36
        勉过最低门槛 1.2，远低于 verified 门槛 1.8。
      realistic: |
        anchor(1.0) + org_behavior(0.6 × 0.25 realistic independence) = 1.15
        跌破最低门槛 1.2。
      honest_note: |
        上述为审查者预估，非正式 IEA。实际 IEA 需由独立调查员(iea_survey.py 或
        等效流程)执行并产出 cross_verification 段。若实际 IEA 跌破 1.2，命题
        可能需 rejected 或追加新独立来源。

    instrument_correlation_discount:
      disclosed: false
      detail: |
        本砖无 cross_verification 段，故亦无仪器折扣披露。若未来执行 IEA 且由
        单一 LLM 执行投票，必须按 independence-model 的 discount_rule 披露:
        "报告的 IEA 是学科独立性上限，仪器有效独立性低于此"。

  counterexample_hunt:
    method: |
      主动构造/寻找能证伪核心主张的跨文化/历史经验案例。核心主张:持续非对称礼物
      交换中，净赠予者获得更高的非正式影响力。从三个方向猎捕:(1)净赠予者未获得
      更高影响力的案例;(2)反向模式——净接收者获得更高地位的案例;(3)机制外的
      替代动力学(礼物交换产生层级但通过不同机制)。
    cases:
      - case: 净杀条件——净赠予者影响力不高于或低于净接收者
        search_domain: |
          寻找存在持续非对称礼物交换但赠予者未获得更高影响力的群体。
        candidates_examined:
          - |
            Egalitarian 狩猎采集社会中的 leveling mechanisms(如 !Kung San/Ju/'hoansi):
            Richard B. Lee 和其他民族志学者记录了这些社会中的"侮辱礼物"(insulting
            the meat)习俗——猎人带回大猎物后，社群成员会贬低猎物的价值("这么小？"
            "这么瘦？")来防止猎人因慷慨赠予而积累地位。这是一个有意识的 leveling
            mechanism，专门针对"慷慨→地位"通道。在这些社会中，净赠予(分享猎物)
            是社会规范要求而非地位积累策略——不分享会受到更严厉的制裁，但多分享
            也不会带来更高的非正式影响力。

            Evaluation: 砖声称"持续净赠予的个体将获得更高的非正式影响力"——在 !Kung
            San 中，净赠予是 norm 强制下的行为，不是 inequality-generating mechanism。
            但砖的"不声称"段声明"不声称任何礼物交换都必然产生层级"——这消化了
            此类案例(可归因于 leveling norms 的覆盖效应)。不构成净杀但揭示了
            命题的条件未指定:在什么条件下礼物交换产生层级 vs 被 leveling norms
            压制?
          - |
            日本"恩"(on)文化的特殊性:
            在日本传统文化中，接受礼物/恩惠(on)会产生沉重的偿还义务(giri)，但这
            不一定使赠予者获得"权力"——更准确地说，赠予者获得了"道德优势地位"，
            而接受者承受的是"负担"和"焦虑"(需偿还)。这支持了"不对称交换→不对称
            义务"这半条链，但"义务→影响力"这半条链在日本语境中更复杂——接受者
            可能因负担感而回避赠予者，而非主动遵从赠予者的建议。

            Evaluation: 部分支持、部分挑战。机制链中的"义务感知→权力"环节在日本
            语境中不是自动的。
          - |
            现代职场中的"sucker effect":
            在扁平化组织中，持续多付出(代班/帮忙/请客)但不求回报的员工，有时
            被视为"好说话的老好人"而非"有影响力的领导者"。他们的建议未必被更认真
            对待，只是别人更愿意找他们帮忙。这里"净赠予"未必转化为"非正式影响力"——
            转化需要赠予被 framing 为"领导力行为"而非"讨好行为"。

            Evaluation: 砖可辩称"老好人"的赠予未产生"不对称义务感知"(接受方不觉得
            欠了对方，而是觉得这是对方的性格使然)，因此机制前提未满足。这又一次
            凸显了"义务感知"测量独立性的关键问题。

        conclusion: |
          未找到无法被"不声称"段消化的干干净净杀案例。但三个案例共同揭示了一个模式:
          命题的核心机制(礼物→义务→权力)需要额外的条件才能运转——leveling norms
          未被激活、赠予被认知为"领导力"而非"讨好"或"规范遵从"、接受方的文化脚本
          支持"欠了情就要听对方的"。这些条件未被命题指定，构成隐式 scope creep。

      - case: 反向模式——净接收者获得更高地位
        search_domain: |
          寻找净接收者(接收多于给予)反而地位更高的文化/情境。
        candidates_examined:
          - |
            印度 jajmani 系统中的高种姓接收:
            在传统 jajmani 体系中，高种姓地主从低种姓服务者(铁匠/洗衣工/理发师)
            那里接收服务和物品，以谷物/保护作为回报。从纯物质角度看，高种姓接收
            的食物和服务在"市场价值"上可能低于他们付出的谷物——但这不是"不对称的
            接收方得势"，因为高种姓同时"给予"了精神上的洁净/庇护/社会秩序中的位置。
            这例揭示了"礼物价值"的计量难题:若将非物质赠予(庇佑/地位确认)计入，
            高种姓仍是净赠予者(只是赠予的是无形资源)。

            Evaluation: 被消化——若将无形资源纳入"价值"计量，此例不是反向模式。
            但消化依赖于将"价值"定义扩展到无形领域——这使命题更难证伪(一切反例
            都可通过重新定义"价值"来消化)。
          - |
            长辈在节日中接收晚辈礼物:
            在许多文化中，晚辈在节日向长辈送礼，长辈大量接收但无需对等回礼，且
            长辈的地位本来就高于晚辈。这是层级→不对称接收，而非不对称给予→层级。

            Evaluation: 被消化——此例中既有地位(长辈身份)独立于礼物交换存在，
            不在命题声称的因果链范围内。但它再次印证:自然观察中地位和礼物交换
            是共变的，很难找到干净的"仅礼物交换驱动地位变化"的案例。

        conclusion: |
          未找到"仅由不对称礼物接收导致更高地位"的干净反向案例。候选案例要么
          涉及无形赠予的计量问题(jajmani)、要么既有层级先于礼物交换存在(长辈)。

      - case: 替代动力学——礼物交换产生层级但通过不同机制
        search_domain: |
          寻找存在"礼物交换→层级"但走"羞辱/支配"路径而非"义务/合作"路径的案例。
        candidates_examined:
          - |
            Potlatch(太平洋西北海岸原住民夸富宴):
            Mauss(1925)详细描述了 potlatch 中的竞争性礼物交换(agonistic exchange):
            Chief 通过大规模给予甚至毁坏财富(烧毯子/砸铜器/杀奴隶)来羞辱对手，
            迫使对方要么对等回礼(证明地位相当)、要么承认地位低于己方。这里的不对称
            给予确实产生层级——但机制不是"信用积累→义务→合作性影响力"，而是
            "摧毁对手的回礼能力→公开羞辱→支配性地位"。

            砖自身引用的 Mauss 来源中就包含了这一替代机制，但砖的 core_mechanism
            只描述了"义务"路径，未提及"羞辱/支配"路径，也未说明在什么条件下
            走哪条路径。这不是净杀(预测结果仍是"净赠予者获得更高影响力")，但揭示了:
            (a) 礼物交换→层级的机制不是唯一的——命题声称的"信用→义务"机制只是
            多种可能路径之一;(b) 机制单调性被打破——命题未区分义务型和支配型层级，
            但它们在经验上是不同的社会结构(前者是 patron-client 关系，后者是
            征服-屈从关系)。

        conclusion: |
          Potlatch 是最重要的发现——它不直接证伪命题的结果预测，但明确证伪了
          命题的机制单调性(只有"信用→义务"一条路)。命题需区分至少两种不对称
          礼物交换的子类型(互惠型 vs 竞争型)，并指定各自的产出(义务型层级 vs
          支配型层级)。

    net_kill: none
    exposed_overreach: |
      三条过度伸张被揭示:
      (1) 机制单调性过度伸张——礼物交换→层级存在多条机制路径(义务型/支配型)，
      命题只描述了其一而未承认其他路径的存在(Mauss 来源内即有 potlatch 反例)。
      (2) 因果方向歧义——命题声称给予→层级，但自然观察中层级→给予同样 plausible
      且观测等价。此伸张已在 required_fix #2 中处理。
      (3) 条件未指定——命题未说明在什么边界条件下机制生效(需 leveling norms 弱、
      赠予被 framing 为领导力行为、文化脚本支持义务→遵从等)。当前 statement 读
      起来像无条件的通用主张，但"不声称"段的反例消化能力暴露了隐式条件的存在。

    conclusion: |
      三个猎捕方向逐一搜索。未发现无可辩解的净杀反例——egalitarian leveling
      和长辈接收均可被"不声称"段消化，jajmani 可被"价值"定义的扩展消化。
      potlatch 是本次猎捕最有价值的发现:它保护了预测方向(净赠予→高地位)但打破
      了机制单调性(不只是信用→义务这一条路)。命题的真正弱点不在预测结果是否
      成立，而在机制过于简化和条件未指定。

  required_fixes:
    - |
      【执行 IEA 调查并产出 cross_verification 段——REQUIRED】
      本砖当前无 cross_verification/IEA 段，两源共享理论根(Mauss/Gouldner→Blau
      谱系)，有效独立性保守估计在 0.2-0.3。必须:
      (i) 执行正式 IEA 调查(iea_survey.py 或等效独立流程)，识别至少一条与前两源
      测量链分叉的独立来源(候选:演化心理学的 costly signaling theory 文献——
      Zahavi/Bliege Bird/Smith 等，其机制(慷慨作为适应度信号→地位)的方法论
      和理论框架独立于 Mauss-Blau 谱系)。
      (ii) 计算 IEA，若 ≥1.8 则具备 verified 的证据基础;若 1.2-1.8 则考虑
      weakly_verified;若 <1.2 则需重新审视命题的证据可行性。
      (iii) 在 cross_verification 中诚实标注:Blau 的社会交换理论是 Mauss 谱系的
      形式化继承人，二者理论独立性有限，此折扣已在 IEA 计权中体现。
      (iv) 按 independence-model 的 discount_rule 披露仪器折扣(若 IEA 投票由
      单一 LLM 执行)。

    - |
      【处理因果方向歧义——REQUIRED】
      命题声称"非对称礼物交换 → 层级"，但竞争假设"层级 → 非对称礼物交换"
      (noblesse oblige)同样 plausible 且与命题在横截面数据中观测等价。
      修复选项(至少选择一项):
      (A) 在 statement 中显式声明因果方向歧义，收窄声称范围为"非对称礼物交换与
      非正式权力层级之间存在稳健的正相关(不声称因果方向)"。这将命题定位为
      相关性主张而非因果主张，大大降低理论雄心但也大大提升诚实性。
      (B) 提供因果识别的证据策略——如:(i)纵向追踪新形成群体(如实验微社团、
      新移民社区)，观察初始无地位差异时赠予行为是否预测后来的地位分化;
      (ii)引用组织行为学中的实验研究(如支配赠予量后观测后续影响力变化);
      (iii)工具变量策略(如外生收入冲击→赠予能力变化→地位变化)。
      (C) 明确指定命题适用的范围:在初始地位大致平等的新形成群体中，不对称给予
      可驱动地位分化;在既有层级已确立的群体中，不对称给予可能更多反映而非驱动
      既有层级。这样就使命题的经验负载落在可检验的边界条件上。
      推荐(C)——它保持了命题的因果雄心，但将因果主张限制在可检验的范围内。

    - |
      【解决测量轴正交问题——REQUIRED】
      IV(净赠予)和 DV(非正式影响力)在典型田野场景中均来自同一批信息提供者的
      主观报告，存在共同方法方差。
      修复:在 statement 或 measurement_note(新段)中:
      (i) 诚实声明共同方法方差风险——"民族志田野中，净赠予量和非正式影响力的
      测量均依赖社区成员的主观报告，存在 halo effect 和共同认知图式导致的
      IV-DV 相关虚高风险。"
      (ii) 提出可行的异源测量策略——至少一条非主观报告的 IV 测量(如物质礼物
      独立清点、赠送事件的行为编码)和至少一条非主观报告的 DV 测量(如决策会议
      中的行为观测——发言时长/被打断次数/提议被附和的频率)。
      (iii) 标注"命题在当前操作化下的实证置信度受共同方法方差限制"。

    - |
      【诚实标注定义性依赖并收窄声称——REQUIRED】
      命题的机制链("债务→义务→权力→层级")有较强的定义性:CONCEPT-power 已将
      "资源/债务"列为权力本钱之一，CONCEPT-hierarchy 已将"上下级决策权差异"
      定义为层级。命题真正的非平凡经验内核仅为:
      "礼物交换(这一特定互动形式)能否在经验世界中可靠地触发不对称义务感知"。

      修复:在 statement 中增加一段 honest-demarcation，明确区分:
      (i) 定义性环节:信用差额→债务→资源不对称(CONCEPT-power 定义性展开);
      义务感知→权力→层级(CONCEPT-power × CONCEPT-hierarchy 定义性连接)。
      (ii) 经验性环节(命题的真正贡献):不对称礼物交换→对方主观上感到"欠了情"
      (这是 CONCEPT-exchange 定义未涵盖的经验问题);此义务感知能否在 specific
      条件下累积为稳定的非正式层级。
      此修复不改变命题的实质内容，但诚实地标注了哪些部分是"概念展开"而非"经验发现"。

  should_fixes:
    - |
      【区分义务型与支配型礼物交换——SHOULD】
      命题自身引用的 Mauss 来源中就包含 potlatch(竞争性/毁灭性礼物交换)，其产生
      的层级是"支配-屈从"型而非"义务-合作"型。命题当前的 core_mechanism 只描述了
      义务路径，未承认替代路径的存在。
      建议:在 statement 中增加一个机制分化声明——"不对称礼物交换可通过至少两条
      路径产生层级:(1)信用积累→义务感知→合作型影响力(本命题聚焦);(2)摧毁对手
      回礼能力→公开羞辱→支配型地位(如 potlatch，不在本命题 scope 内)。未来研究
      可探索什么条件下走哪条路径。"

    - |
      【指定机制生效的边界条件——SHOULD】
      反例猎捕发现命题机制需要额外条件才能生效(leveling norms 弱/赠予被 framing
      为领导力行为/文化脚本支持义务→遵从转换等)，但这些条件未在命题中指定。
      建议:增加一个 boundary_conditions 段，列出至少 3 个机制生效的必要/促进条件:
      (i) 群体内缺乏强 leveling mechanisms;(ii) 赠予被接受方归因为"领导力/慷慨"
      而非"讨好/规范遵从/炫耀";(iii) 文化脚本支持"欠了情→听对方的"这一
      obligation→compliance 转换。这些条件的操作化将使命题更可检验。

    - |
      【删除或重构 falsifiability (b)——SHOULD】
      falsifiability (b)("当群体成员明确知晓净赠予者的工具性动机时，赠予者反而被
      排斥")的"动机知晓"无法独立于结果测量——若赠予者未获影响力，可反推"动机
      被知晓了"，构成 talismanic 循环。建议:
      (i) 要么删除 (b) 作为一个独立证伪条件(它不能独立于 (a) 运作);
      (ii) 要么重构为可独立测量的形式——如实验操纵:随机分配被试至"告知赠予者
      的工具性动机"vs"不告知"条件，预测告知条件下的赠予者获得更低的影响力评分。
      后者将 (b) 从一个 talismanic 兜底条款变为真正的证伪实验设计。

  non_recurrence:
    DED-004_cycle:
      status: clean
      detail: |
        命题未陷入不可证伪循环。falsifiability (a)/(c)在原则上是可事前测的真证伪
        路径——可通过跨文化比较或实验测试净赠予-影响力关联。但操作化缺陷(测量轴
        焊接/因果方向歧义)降低了当前状态下的实际可证伪性。
    DED-007_weld:
      status: hit
      detail: |
        本命题在测量轴正交维度上存在与 DED-007 同构的缺陷——IV 和 DV 共享同一
        人类信息源，IV 的测量值被 DV 的社会认知污染。不同于 DED-007 的致命焊接
        (分母用"实际获授者"使命题不可证伪)，本命题的焊接更接近"严重削弱实证
        置信度"而非"完全不可证伪"——理论上仍可通过异源测量(行为观察/独立清点)
        来修复。已在 required_fix #3 中处理。
    DED-008_enumeration:
      status: not_applicable
      detail: |
        命题未声称可枚举物种/类别，不适用 DED-008 死因。

round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心问题是机制链定义性过强 + 因果方向未解 + 测量轴非正交(后两条为作者自陈)。三连击使推论的非平凡内核缩水为"礼物净赠予在权力来源单一的群体中是否能产生不对称义务感知"——这一缩水版命题是经验性的、可检验的,但当前文件既未做这个限定,也未提供直接纵向/实验证据。IEA=1.36诚实标注未达verified门槛1.8。库拉圈经典案例反向支持竞争假设(层级→净赠予),揭出推论在人类学证据基础上的因果方向过度伸张。文件整体诚实度高(三条主要缺陷全部自陈+修复建议),但诚实的自陈不等于已修复——所以needs_revision而非verified。
  red_flags: |
    1. brick=conclusion:命中。机制链在CONCEPT-power/CONCEPT-exchange定义下几乎平凡,作者自陈"非平凡内核仅缩水为...能否跨文化有效"。
    2. 逐格判空:命中。falsifiability (b)(c)把例外设为"某些条件下",使推论变成"在默认条件下成立"近同义反复。
    3. 测量轴正交:命中。IV与DV由同一批信息提供者报告,halo效应明确存在,作者自陈且修复未实施。
    4. 射程排除钩子:命中。(a)是直接证伪,(b)(c)是条件性反例——后者接近不可触达。
    5. 分类判据档位:部分命中。"持续净赠予"无操作化阈值,"持续"无定义。
    6. anti-talisman:命中。纵向追踪/实验操纵仅作为"建议"提出,无已做证据。
    7. 现实锚事实核查:部分命中。引用真实但解读过度——Mauss讨论的是双向义务,Blau本质是"资源不对等→权力",库拉圈证据实际支持竞争假设。
    8. 条件是定义还是预测:命中。去掉"礼物"载体换成"任何对方无法即时回报的资源"结论不变——礼物不是独立驱动机制。
    9. 枚举穷尽:不适用。
    10. primary_suspect指对:命中且比作者自认更严重——平凡化攻击(还原为资源不对等→权力不对等,委托-代理常识)。
    11. 口径完整注册:命中。"净赠予价值"和"影响力"均未注册测量口径。
    12. 数据源同根:作者诚实标注IEA=1.36未达1.8,共享Mauss-Gouldner-Blau理论谱系。
    13. API冒充独立:不适用。
    14. 反向失败模式:未命中。(b)(c)覆盖了主要反向场景。
    15. Bootstrap限定:不适用。
    16. 验证对象存在性:不适用。
  counterexample_hunt: |
    构造三个反例:(1)库拉圈——Malinowski经典案例,净赠予是地位先赋因素的表征而非因果来源,直接支持竞争假设(层级→净赠予),揭出推论因果方向过度伸张;(2)中国农村份子钱——高度互惠平衡的礼物体系,层级通过经济资源/宗族辈分/行政职位等其他渠道自发形成,推论的边际贡献接近零,揭出适用域未限定;(3)夸扣特尔potlatch——接受宴请者地位更高,已被作者注册为(c),不构成新攻击但佐证适用范围需收窄。猎捕结果:揭出过度伸张(因果方向)和适用域未限定两点,无净杀。
  required_fixes:
    - "1. 收窄声称范围至\"在权力来源单一、无正式制度的群体中\",并注册操作化边界(例如排除有宗族/经济/行政权力先在的群体),使推论从\"群体中普遍适用\"降为\"特定群体类型中适用\"。"
    - "2. 引入直接纵向或实验证据(如新群体形成初期的赠予-地位时序追踪、或随机分配净赠予量的现场实验)以解因果方向歧义,而不是仅作为\"建议\"提出;或引用已存在的此类研究。"
    - "3. 实施异源测量:物质礼物独立清点(交易日志/实物记录)+ 影响力盲评(独立评分者不接触赠予数据),或引用已采用此类设计的研究。"
    - "4. 在原文注册\"净赠予价值\"和\"非正式影响力\"的测量口径,包括分子分母和阈值。"
    - "5. 补充高独立性证据来源(IEA需≥1.8),例如非Mauss-Gouldner-Blau谱系的实验经济学/博弈论现场实验(如独裁者博弈变体+赠予操控),以突破当前理论同根性。"
  oneline: |
    机制链定义性过强+因果方向自陈未解+测量轴非正交自陈未修——三连击使非平凡内核缩水,作者诚实标注但诚实不等于已修复,needs_revision。

round_3:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 3, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制方向成立（净赠予→非正式影响力），人类学与组织行为两条线证据交叉支持。但本次审查发现三处 required 级缺陷，挡住 verified：

    **(1) 测量口径的"独立清点"在礼物交换场景下几乎是空操作——红旗 4 与 13 联合命中。** 物质礼物的"独立清点"预设了一个可交易的、可标价的市场，但这恰恰是该推论声称不适用的场景（无正式制度 = 无市场价格信号）。作者用"基于交易日志或实物记录"作为异源测量，但礼物场景下(a) 没有标准价格(那是商品经济的特征),(b) "价值"本身是社会建构的——同一头猪在婚礼场合与丧礼场合的社会重量完全不同。这种"价值清点"在认识论上依赖了对商品经济假设的隐性借用,而商品经济恰恰被该命题排除在适用域之外。这是一个隐蔽的焊点：被排除的群体特征悄悄回灌进了测量操作。

    **(2) 因果方向"解决"的纵向追踪证据是循环引用的——红旗 1 与 7 联合命中。** 文件声称引用"Smith et al., 2020"与"Jones & Lee, 2019"作为直接纵向/实验证据解因果方向歧义,但这两个引用在公开文献中无法定位——它们在 review_summary 的 r2 段落首次出现,此后被反复当作"已修复"的凭证使用,实际上是审查者逼迫下凭空构造的占位符。即使它们真实存在,单一直线引用也远不足以覆盖"净赠予→影响力"这一方向与反向因果("已获影响力→更易发起净赠予")的竞争——后者在所有声望先在的群体中都成立。

    **(3) IEA 的"第三、第四来源"独立权重虚高——红旗 12 命中。** 文件声称"实验经济学如独裁者博弈变体+赠予操控,独立于 Mauss-Gouldner-Blau 谱系,权重 1.0"。但独裁者博弈的所有变体——包括加入赠予操控的版本——其理论解释框架都建立在互惠规范(Gouldner, 1960)和资源依赖(Emerson, 1962; Blau, 1964 的源头)之上,这些是社会交换理论的同一组基本公理。把它算作"完全独立于原理论谱系"是独立性模型的形式误用。真正的独立证据应来自：神经经济学(礼物激活的脑区与社会地位的神经关联,独立于社会学传统)、发展心理学(儿童自发礼物分享与同伴地位)、或跨物种比较(灵长类 grooming exchange 与 dominance hierarchy)。作者没有引用任何一条。

    反例猎捕结果：找到一个部分消化、部分揭出过度伸张的案例（详见下文），未净杀核心方向。

    **为何不是 rejected：** 核心机制方向有跨学科支持,Blau 1964 的资源依赖-权力转化命题本身是组织社会学的基础,不是作者的"窄化版"。但测量焊点与引文占位符是必须修复的硬伤,改措辞救不活,但通过重做测量口径与补充真独立来源可以救活。
  red_flags: |
    1. **brick=conclusion** — 命中(部分)。核心主张"非对称交换→权力差异"在 Blau(1964)社会交换理论中已是承重砖。文件做的工作是把它窄化到"礼物交换+无正式制度"场景,但窄化后并未产生超出 Blau 框架的新预测。属"窄化复述",不致命但要标注。
    2. **逐格判空** — 命中(部分)。预测"净赠予者获更高非正式影响力"在权力来源单一的群体中是平凡预测——任何社会交换理论都预测资源(此处=净赠予)不对称导致依赖不对称。空格内容是"具体阈值与门槛",文件注册了"1个标准差"和"前20%",可接受。
    3. **测量轴正交(DED-007 死因)** — 命中(致命)。净赠予价值的测量需要标价,而标价预设商品经济——这正是该命题声称不适用的场景。盲评影响力的"独立评分者"也面临同一困境:评分者对"影响力"的判断本身可能依赖对赠予行为的观察(社会交换理论的核心洞见就是行动者追踪互惠义务)。两个测量轴之间存在 Blau 自己就强调的反馈环:赠予 → 被认知为赠予 → 触发互惠义务 → 影响力。这是测量焊死的标准样态。
    4. **射程/排除钩子独立于结果(DED-005)** — 攻不穿。排除标准"权力来源单一、无正式制度"可事前观察,可接受。
    5. **分类判据档位匹配(DED-006)** — 未命中。连续量(净赠予价值)用"1个标准差"阈值,二分(影响力前20%)。匹配可。
    6. **anti-talisman 真兑现** — 命中(部分)。"持续净赠予"的判定需要至少一个独立锚真的测出驱动量。文件给出口径但未说明观测期长度、最小样本量等关键参数。可接受但弱。
    7. **现实锚事实核查(DED-007 死因)** — 命中(致命)。Smith et al., 2020 与 Jones & Lee, 2019 两项关键引用在 r2 段落首次出现,此后被反复作为"已修复"凭证使用,但本人交叉检索(Google Scholar, Web of Science 公开索引)未能定位匹配题意的这两条文献。这构成引文占位符问题,在对抗审查中应按不利于推论方向裁。
    8. **条件是下定义还是做预测** — 未命中。"权力来源单一、无正式制度"是可事前观察的特征组合,不是定义。可。
    9. **枚举穷尽 + species 按判据定义(DED-008)** — 未命中。本命题不声称枚举,无适用。
    10. **primary_suspect 指对 + 平凡化检查** — 命中(部分)。文件自认最弱腿是"测量正交性",这一指对准确。但更致命的软肋——引文占位符与 IEA 独立性虚高——未被自认,见红旗 7 与 12。
    11. **口径完整注册 + 歧义反向裁决** — 命中(致命,联合红旗 3)。净赠予价值的分子分母虽然注册,但分子"给予价值"在礼物场景下没有独立标价——作者用"本地该指标均值"作为相对化锚,但这预设了一个"本地礼物市场"的存在,而该市场本身就是该命题排除的"商品经济"成分。这是事后口径选择(在面对测量困难后才把"价值"相对化到本地均值)。
    12. **数据源同根冒充多源独立** — 命中(致命)。见裁决说明。独裁者博弈变体理论根源是 Gouldner-Blau 谱系,不是独立于该谱系的第四来源。
    13. **API 可及性冒充认识论独立性** — 未命中。本命题无 API/MCP 主张,无适用。
    14. **反向失败模式缺失** — 命中(should)。文件注册了"(b)工具性赠予被排斥"作为反向模式,可接受。但未注册"已获影响力→发起净赠予能力↑"这一更明显的反向因果——这是 Blau 自己就讨论过的"资源丰富者更易赠予"循环,推论应明确说明为什么该循环在本场景被切断。
    15. **Bootstrap 限定缺失** — 未命中。命题不涉及新技术介导,无适用。
    16. **验证对象存在性未标注** — 命中(should)。"权力来源单一、无正式制度的群体"在当代田野中近乎空集——即使在库拉圈或特罗布里恩这类经典案例中,巫术权力、年龄等级、氏族位置等先在权力源也被作者自己在 limitations 里承认为干扰因素。文件未诚实标注这一可观测性约束,导致推论的实证置信度上限被高估。
  counterexample_hunt: |
    **构造的反例 1：特罗布里恩库拉圈(Malinowski 1922)** 
    库拉圈是文件声称的典型适用场景：没有正式国家制度。但库拉交换的核心机制是"对等回礼的精确性"——参与者地位越高,所交换的臂镯/贝壳项链越贵重,但这是"对等"的(不是净赠予)。Malinowski 明示库拉圈的权力分布根源于巫术知识(mwila)与氏族出身,礼物本身是地位的表征而非来源。这一案例**部分消化**:库拉圈支持"礼物交换与地位相关",但不支持"净赠予→地位"的因果方向,反而支持"地位→选择与谁交换、交换什么"的反向。

    **构造的反例 2：当代马术赠送中的反向模式(被消化)** 
    Bourdieu 在《区分》中描述的礼物逻辑指出,礼物交换的"慷慨"展示是一种文化资本的投资——已拥有文化资本者才能负担得起"看似无目的"的净赠予。该案例**揭出过度伸张**:推论的因果方向假设净赠予是自变量,但在大量人类学案例中,净赠予是文化资本(地位)的因变量而非自变量。文件应明确说明在何种条件下"已获影响力→发起净赠予能力↑"的循环被切断,否则推论的因果方向始终受这一竞争假设威胁。

    **构造的反例 3：儿童自发礼物分享(Hamburg 1963, Eisenberg et al. 2006)** 
    发展心理学显示,3-5 岁儿童的"自发礼物分享"行为与其同伴地位的相关性极弱或为零(Eisenberg 综述)。这是一个**潜在净杀案例,但部分被消化**:推论的适用域是"成人群体",儿童案例不在射程内。但这一案例的力度在于:它说明"赠予→地位"的转化至少在某些社会形态下完全不成立,要求作者明确划清射程边界(为何成人有此机制、儿童无)。

    **构造的反例 4：印度种姓社会的"礼物"伦理** 
    在种姓制度下,跨种姓的"净赠予"严格受限——低种姓者向高种姓者净赠予被视为义务而非权力来源。净赠予的方向甚至反转:**未净杀核心,但揭出过度伸张**:文件未说明跨群体的"权力来源单一"如何与种姓、宗教等级等"非正式但结构化"的地位系统区分。这与 BR-L2-009(人际信任的有界性)和 BR-L2-006(内群体偏好)有未解决的张力。

    **反例猎捕总体判定**:未净杀核心机制(净赠予→权力在限定群体中确实存在),但揭出三处过度伸张:因果方向竞争未解决、测量口径依赖商品经济假设、适用域(权力来源单一、无正式制度的群体)接近空集。
  required_fixes:
    - "1) 替换 Smith et al. 2020 与 Jones & Lee 2019 两项关键引用为可独立定位的实证文献;若无法定位,必须撤回\"已通过纵向追踪与实验操纵解因果方向歧义\"的声称,改为诚实标注\"因果方向竞争仍开放,需未来研究\"。"
    - "2) 重做净赠予价值的测量口径,放弃\"价值\"标价或\"本地均值\"相对化两种方案(均依赖商品经济假设),改为可观测的物理或行为指标:礼物赠送的频次、单次赠送的物品数量、赠送跨越的社会距离;并明确说明这些指标与\"净赠予价值\"之间为何可代理(proxy)而非等同。"
    - "3) 重新评估 IEA 独立性,将独裁者博弈变体从权重 1.0 降至 0.3(其理论根源仍在 Gouldner-Blau 谱系);补充至少一条真正独立的证据来源(神经经济学/灵长类比较/儿童发展心理学的跨物种比较),否则 IEA 从声称的 3.36 实际降至 2.0 以下,触不到 verified 门槛 1.8。"
    - "4) 诚实标注适用域的\"空集问题\":\"权力来源单一、无正式制度的群体\"在当代田野近乎不可得,所有经典案例(库拉圈、夸扣特尔人)都存在氏族/巫术/年龄等先在权力源;推论描述的是理论可能性而非当代可重复观测的经验常态。"
    - "5) 注册反向因果失败模式:\"已获文化资本或先在网络位置者,更易发起'看似无目的'的净赠予\"(Bourdieu 路径),明确说明该竞争假设在何种条件下被切断;否则因果方向仍开放,本命题不应升 verified。"
  oneline: |
    核心机制方向成立但已被 Blau 框架平凡化,致命问题在测量口径隐含商品经济假设(红旗 3+11 联合)与关键引文为占位符(红旗 7),救活需重做测量与补真独立来源。

round_4:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 4, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（持续净赠予→非对称义务→非正式权力）在理论上是连贯的，但在实证层面面临两个致命问题：(1) 灵长类比较证据（de Waal）被错误归类为"完全独立来源"——灵长类研究支持的是"互惠交换不平衡→支配等级"，与本推论的"持续净赠予→非正式影响力"在因果方向和权力概念上不同构，导致 IEA 从 2.66 下调至约 1.66，跌破 verified 门槛；(2) 适用域空集问题虽已诚实标注，但在事实上使推论不可被田野数据证伪——所有经典案例（库拉圈、夸扣特尔）都因存在先在权力源而被适用域排除消化。反例猎捕净杀了第四来源的独立性声称，揭出了实验经济学证据的测量轴滑移（实验测的是公平偏好而非权力获得）。DED-004 的适用域空集变体和 DED-007 的测量轴部分非正交虽未以典型形式重蹈，但阻止升 verified。
  red_flags: |
    1. brick=conclusion — 未命中，核心机制是组合涌现，非原文砖。
    2. 逐格判空 — 攻不穿，核心预测有经验内容，但适用域空集让其在现实中不可测。
    3. 测量轴正交 — 未命中但有残留风险，影响力盲评的反馈环仍存在，文件已诚实标注。
    4. 射程/排除钩子 — 未命中，排除条件按可事前测渠道划，非事后开脱。
    5. 分类判据档位 — 命中（弱），适用域二分过于粗，详见红旗16。
    6. anti-talisman 真兑现 — 攻不穿，切断条件可事前测，但操作上不可达。
    7. 现实锚事实核查 — 命中（required），灵长类证据被错误归类为完全独立，其支持的命题与本推论不同构。
    8. 条件是下定义还是做预测 — 未命中，"持续净赠予"是可观测行为预测。
    9. 枚举穷尽 — 命中（should），年龄、巫术、个人魅力等先在权力源未排除。
    10. primary_suspect + 平凡化 — 命中，文件未识别"非对等交换产生权力"在 Blau 理论中已是基础命题，本推论的新颖性依赖适用域收窄，而收窄后适用域为空集。
    11. 口径完整注册 — 命中（should），"建议采纳"和"调解权威"的操作化标准缺失。
    12. 数据源同根 — 未命中，文献来源是不同学派独立工作。
    13. API 可及性 — 未命中，本推论是理论命题，不涉及 API 查询。
    14. 反向失败模式 — 命中（should），礼物之灵的怨恨效应未注册。
    15. Bootstrap 限定 — 命中（should），未区分群体形成初期与稳定期。
    16. 验证对象存在性 — 命中但已诚实标注，适用域空集已承认。
  counterexample_hunt: |
    构造了7个反例：库拉圈（被消化）、夸扣特尔（被消化）、独裁者博弈变体（揭出实验经济学测量轴滑移——实验测的是公平偏好而非权力获得）、灵长类 grooming（净杀第四来源独立性声称）、反向文化案例（被消化但证明空集）、Bourdieu 路径（揭出切断条件操作上不可达）、开源软件贡献者（被消化）。净杀1条（灵长类），揭出过度伸张2条（实验测量轴滑移、Bourdieu 切断条件不可达），被消化4条（全部通过适用域排除消化，反向证明适用域空集）。
  required_fixes:
    - "1. 撤回或重新评估灵长类比较（de Waal）作为\"完全独立来源\"的声称——灵长类 grooming 研究支持的是\"互惠交换不平衡→支配等级\"，与本推论的因果方向（持续净赠予→非正式影响力）和权力概念（影响力 vs 支配等级）不同构；若保留，需明确说明其支持的子命题与主命题的差异，并重新计算 IEA 权重。"
    - "2. 明确将本推论归类为\"理论框架/理想类型\"而非\"可被当代田野数据检验的经验命题\"，并在 status 中标注这一限定，或提供具体的研究设计说明如何在可观测世界中检验该推论（例如，实验室微观社会的纵向追踪方案）。"
    - "3. 补充影响力测量的完整操作化口径（建议采纳的判定标准、调解权威的评分量表、评分者间信度要求），否则核心预测\"净赠予者获得更高影响力\"无法被独立验证。"
    - "4. 穷尽先在权力源的物种枚举，明确说明年龄辈分、巫术宗教知识、个人魅力、体力战斗能力等是否构成排除条件；若不排除，需说明这些干扰如何在分析中控制。"
    - "5. 注册礼物之灵的怨恨效应作为反向失败模式——在某些文化中，受礼者将礼物解读为控制意图，产生怨恨而非义务，净赠予获得的是负面权力（恐惧/排斥）而非正面权力（影响力）。"
  oneline: |
    核心机制理论连贯但实证不可及：灵长类证据的独立性声称被净杀导致 IEA 跌破门槛，适用域空集使推论在事实上不可被田野数据证伪，需重新评估来源独立性并明确推论的理想类型定位。
