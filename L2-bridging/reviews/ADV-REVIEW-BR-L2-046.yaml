rounds: 1

人话摘要: |
  对 BR-L2-046(信息衰减速率的经验测量方法——三种实验方法应收敛于同一数量级)的
  round-1 独立对抗审查。
  裁 needs_revision:核心直觉(信息衰减可通过多条独立经验通道观测)方向正确且有
  方法论价值,但 6 条 required 缺陷阻止 verified:(1)bridges_to 引用 CONCEPT-measurement
  不存在——该 ID 在 L1-definitions 中未定义,仅存在 CONCEPT-measurement-independence;
  (2)三条"独立"测量方法缺乏共享的衰减速率操作化——口传用故事保真度%、抄写用字符
  错误计数、数字用位翻转率,三者单位不可通约,收敛声称无法检验;(3)证伪条件(c)要求
  实测误码率低于香农理论下界——这在物理上不可能,属 anti-talisman 护身符;
  (4)证伪条件(b)的"无法通过实验设计差异解释"是一个无限的逃生舱;
  (5)Büring (2014) 手抄本研究引用极可能为 LLM 幻觉——Daniel Büring 是语义学家,
  非手抄本谱系学者;(6)反例猎捕发现口传衰减率(每代~5-10%语义丢失)与数字位翻转率
  (~10^-14至10^-18/bit/read)相差~10^15数量级,远超"一个数量级"的收敛预测——该
  预测被直接证伪。无 IEA/cross_verification 段,桥接砖未完成 IEA 调查。

round_1:
  reviewer: independent-adversarial-reviewer
  date: 2026-07-16
  verdict: needs_revision
  verdict_note: |
    本桥接砖的底层直觉——信息衰减(AXIOM-002 确立的熵增必然性)可以通过多种独立
    经验通道观测和测量——方向正确且有方法论价值。口传序列再生实验(Bartlett 范式)、
    手抄本谱系分析(stemmatology)、数字位翻转率测量各自是成熟的经验方法论,每一条
    都能独立为 AXIOM-002 的衰减主张提供经验锚定。将这三者统一在"信息衰减测量"
    的框架下是一个有价值的综合尝试。

    但六条 required 级缺陷阻止 verified 裁决。其中前两条(引用不存在实体 + 测量轴
    不可通约)触及桥接砖的架构完整性,第三条和第四条(anti-talisman + 证伪逃生舱)
    使可证伪性虚设,第五条(幻觉引用)是事实准确性硬伤,第六条(反例猎捕)直接证伪了
    收敛预测这一非平凡经验内核。这些缺陷是系统性的,不是措辞微调能修复的——需要
    对桥接砖的核心声称(收敛预测)进行根本性重新审视。

    === 六条 required 缺陷 ===

    1.【bridges_to 引用 CONCEPT-measurement 不存在——REQUIRED】
    validate.py 已确认:BR-L2-046 的 bridges_to.concepts 引用 'CONCEPT-measurement'
    不存在。L1-definitions/concepts/ 下仅有 CONCEPT-measurement-independence
    (测量独立性——定义数据源是否独立分叉的认识论概念),其语义与本桥接砖需要的
    "测量方法论"概念完全不同。CONCEPT-measurement-independence 关心的是"两个
    数据点是否来自独立测量链",不是"怎样测量一个物理量"。将 bridges_to 改为引用
    CONCEPT-measurement-independence 是语义错配——桥接砖需要一个定义"经验测量"
    本身的 L1 概念,但当前体系中不存在这样一个概念。这不是简单的 ID 替换问题:
    要么(1)在 L1 中新增 CONCEPT-measurement 概念,要么(2)将 bridges_to.概念限定
    为 CONCEPT-information(已正确引用)并诚实标注"测量"概念在本体系中暂无 L1 锚定,
    要么(3)移除对 CONCEPT-measurement 的引用并只保留 AXIOM-002 + CONCEPT-information。
    目前的状态是不自洽的:体系一致性检查通不过。

    2.【测量轴不可通约——三条方法缺乏共享的衰减速率操作化——REQUIRED】
    这是本桥接砖最根本的方法论缺陷。砖声称三种测量方法应"收敛于同一数量级",
    但三种方法的"衰减速率"使用了三种不可通约的度量单位:

    (i) 口传序列再生:度量=故事细节保真度% 随代际的衰减(如 Bartlett 1932,
    5-6 代后~50% 细节丢失)。"衰减速率"的单位≈"%语义内容丢失/代"。
    (ii) 手抄本抄写:度量=异体字/错误计数随抄写次数的累积(如 stemmatology
    分支树拟合)。"衰减速率"的单位≈"字符错误数/抄写次数"。
    (iii) 数字位翻转:度量=原始位翻转率(per bit per read)。"衰减速率"的
    单位≈"bit errors/bit/read"。

    三种度量之间不存在天然的换算桥梁:
    - "故事细节丢失 50% / 5 代"换算为"bits/代":首先需要量化一个故事包含多少
    Shannon-bits 的语义信息("反派很高"=几 bits?),这在信息论上是一个深度
    未解决的问题(语义信息的 Shannon 量化)。
    - "抄写错误 3 个/页/代"中,并非每个字符错误都等价于语义信息丢失(同音
    替代字可能完全保留语义,如"唯"与"惟")。
    - "位翻转 10^-15/bit/read"换算为"信息丢失/复制":数字系统有纠错码(ECC),
    原始位翻转在纠错后语义丢失为零——零与任何正数之比为无穷大。

    声称三者"应收敛于同一数量级"在操作上是空的——因为你没有规定如何把三种
    度量换算为同一单位。任何"收敛"或"发散"的裁决都取决于你选择的换算方案,
    而换算方案在砖中完全没有注册。这个缺陷不是措辞修补能解决的——它触及
    收敛声称本身的可检验性。修复方向:要么(1)提供三种度量之间的严格换算公式
    (需解决语义信息的 Shannon 量化这一开放问题——在当前认识论状态下不可行),
    要么(2)放弃收敛声称,将三条方法重新定位为"独立指向同一方向(衰减存在)"
    的定性共识而非定量收敛。选项(2)是最诚实的路径——它保留了桥接砖的方法论
    价值(提供多渠道经验锚定),同时放弃了一个在操作上无法检验的强声称。

    3.【证伪条件(c)是 anti-talisman 护身符——REQUIRED】
    falsifiability (c):"数字存储系统中,在给定的冗余率下实测的误码率远低于
    香农理论预测的可达到边界(例如低于理论下限的10%)"。

    香农信道容量定理(Shannon 1948)给出的是【理论上界】——在给定噪声水平下,
    存在一种编码方案可使误码率任意低,但无法低于由信道容量决定的极限。这个
    极限是数学定理,不是经验测量。Hamming 界和 Shannon 界定义的是任何编码
    方案都不可能超越的理论下界——实际系统只能接近,不可能低于。

    因此 falsifiability (c) 要求观测到一个在物理上不可能发生的事件(实测误码
    率低于数学证明的理论下界)来证伪本桥接砖。这相当于说"如果永动机被造出来,
    热力学第二定律就被证伪了"——在逻辑上是一条证伪路径,但在物理上是不可能
    触发的事件。按 anti-talisman 红旗标准:证伪条件必须是可事前测量、在实际
    世界中可能发生的观测——用一件物理学上不可能的事作为证伪条件,就是护身符。

    修复:删除(c),替换为可操作的证伪路径。例如:(i)指定冗余率、介质类型和
    比特数,若实测原始误码率在等效条件下【系统性地为零】(即 N 次读取后零
    错误,且 N 足够大使得零错误的概率在给定误码率下<0.01),则衰减在数字域
    不成立;(ii)或干脆移除数字维度的独立证伪条件——数字存储的衰减已由物理
    定律(电荷泄漏、介质退化)充分确立,不需要额外的证伪路径来"保护"它。

    4.【证伪条件(b)含无限逃生舱——REQUIRED】
    falsifiability (b):"三种方法...测量的衰减速率相差超过两个数量级,且无法
    通过实验设计差异解释"。

    "无法通过实验设计差异解释"这一条款是一个无限的逃生舱——任何三方法之间的
    巨大差异都可以被作者事后归因为"实验设计差异"而排除。口传实验用了大学生
    vs. 抄写用了职业抄写员?实验设计差异。口传用了西方故事 vs. 抄写用了中文
    佛经?实验设计差异。数字存储用了 SSD vs. HDD?实验设计差异。任何两个实验
    在方法上永远存在差异——没有两个实验是完全相同的。"无法通过...解释"要求
    证伪者证明不存在任何可能的实验设计差异解释,这是一个不可完成的证明负担
    (证明一个全称否定命题)。

    修复:删除这个逃生舱子句,或将其反转。例如:将(b)改写为"三种方法得到的衰减
    速率(各自按预先注册的口径测量)的中位数之比超过两个数量级——此时差异被
    推定为真实差异而非实验设计人为差异,证伪成立的举证责任由作者承担(作者需
    证明差异来自测量误差而非真实效应,而非证伪者需证明差异不是测量误差)"。

    5.【Büring (2014) 引用极可能为 LLM 幻觉——REQUIRED】
    砖的 applicable_sources[2] 引用:"Büring (2014) 对中世纪手稿抄写的定量
    分析发现,每次抄写产生的异体字和明显错误服从稳定的概率分布,且错误累计
    速率可以用分支树模型(stemmatology)拟合"。

    Daniel Büring 是 UCLA 语言学系的语义学/语用学教授,以其在焦点/话题结构
    和语调语义学方面的工作闻名。他的手抄本研究在学术数据库中无法验证。手抄本
    谱系学(stemmatology)的经典文献来自 Maas(1927 文本批评)、Quentin(1926
    链式方法)、以及计算机 stemmatology 领域的 Barbrook et al.(1998, Nature)、
    Howe et al.(2001, Literary & Linguistic Computing)、Roelli(2020, Handbook
    of Stemmatology)等——没有 Büring 2014 的位置。

    这是一个典型的 LLM 幻觉模式:LLM 在生成"手抄本定量分析"这个主题时,混入了
    一个真实学者(Büring)的名字但给了他一个不存在的出版物和不属于他领域的
    研究内容。必须替换为可验证的真实引用,或删除此段并以真实文献(如 stemmatology
    综述)替代。推荐替换:Roelli (2020, ed.) "Handbook of Stemmatology" 或
    Barbrook et al. (1998) "The phylogeny of The Canterbury Tales" (Nature 394:839).

    6.【反例猎捕发现收敛预测被净杀——REQUIRED】
    猎捕方向:为同一自然语言信息,比较三种通道的每代/每复制衰减速率。

    案例设计:取一段 1000 字的自然语言叙述文本(约 2000 字节 UTF-8 = 16,000
    Shannon-bits)。

    - 口传通道:10 人链式传递(Mesoudi & Whiten 2008 范式)。典型结果:5-10 代后
    约 50-70% 的具体细节丢失/变形。"衰减速率"≈每代丢失 5-15% 的语义内容,
    即每代丢失约 0.05-0.15 的归一化语义保真度。

    - 抄写通道:10 次逐字手抄。熟练抄写员(如中世纪修道院标准):约 0.1-0.5%
    字符错误率/次,累积约 1-5% 错误。未经训练的现代人:约 0.5-2% 字符错误
    率/次,累积约 5-20% 错误。"衰减速率"≈每代丢失 0.1-2% 的字符精度。

    - 数字通道:同一文本以 UTF-8 文件存储在 SSD 上,读取 10 次。现代 NAND
    闪存的原始位错误率(raw BER)约为 10^-15 至 10^-16/bit/read。16,000 bits
    × 10 reads = 1.6 × 10^5 bit-reads。期望原始位错误:< 1.6 × 10^-10 bits
    (可忽略不计)。加 ECC 纠错后,恢复后错误概率:对于消费级 SSD(UBER ~10^-15
    至 10^-16),10 次读取后期望不可恢复错误数 < 10^-11。衰减速率≈每次复制
    损失 10^-15 至 10^-11 的 bit 比例。

    数字通道与口传通道的衰减速率比:
    (10^-15 至 10^-11) / (5×10^-2 至 1.5×10^-1) ≈ 10^-14 至 10^-10
    即差距约为 10 至 14 个数量级——远远超过"不超过一个数量级(因子 10)"
    的预测,也远超证伪阈值"两个数量级(因子 100)"。

    这构成净杀反例:三条通道对于同一自然语言信息类型,在每复制/代的衰减速率
    上相差至少 10 个数量级。收敛预测被直接观测证伪。

    可能的辩护及反击:
    - 辩护:"数字通道测的是物理比特,口传通道测的是语义比特,应换算后再比"。
    反击:这正是 required_fix #2(测量轴不可通约)的核心——砖没有提供换算方案,
    而事后发明换算方案恰是"口径事后选择"的教科书案例。若换算方案在见反例前
    注册,按换算后的值裁决;若未注册,收敛声称本身就不具备可检验性。
    - 辩护:"数字通道应使用无纠错码的原始介质(如打孔纸带/RFID/老磁带)"。
    反击:砖的 statement 写的是"数字系统中原始位翻转率与纠错冗余的关系"——它
    提到了"纠错冗余",这意味着它认为有纠错码的数字系统在其射程内。若现在
    排除所有使用纠错码的现代数字系统,射程就只剩工程上已淘汰的介质,使验证
    对象存在性成为问题(红旗 16)。且即使使用无纠错码的老化磁带(原始 BER ~10^-6
    至 10^-8),与口传的~10^-1 仍差 5-7 个数量级——仍远超预测。
    - 辩护:"收敛预测说的是同一衰减物理机制下,三种方法应给出相容的速率估计"。
    反击:如果三种方法测的不是同一物理机制(口传=认知衰减,抄写=知觉-运动衰减,
    数字=电磁衰减),那么"收敛"预测就没有物理基础——它在预测三个不同机制
    的衰减速率恰好相等。这是 fine-tuning,不是科学预测。

    净杀结论:收敛预测(本桥接砖的非平凡经验内核)被干净经验案例直接证伪。
    砖不能靠保留此预测、仅修改措辞来修复——必须放弃收敛声称,将命题重建在
    一个不被该反例击穿的更诚实的基础上。

    === 修复路径 ===

    六条 required 的修复方向分为两类:

    第一类(架构性,触及核心声称):
    - required_fix #2(测量轴不可通约) + required_fix #6(收敛预测被净杀)
    的共同修复路径:放弃"三者应收敛于同一数量级"的强收敛声称。将桥接砖的
    核心主张重建为:信息衰减可通过三条独立经验通道观测——口传实验(认知信息
    衰减)、手抄谱系(知觉-运动信息衰减)、数字位翻转(物理信息衰减)。三者各自
    提供信息衰减的经验证据,但测量的衰减机制不同(认知 vs. 知觉-运动 vs. 物理),
    故不预设速率收敛。每条通道独立可证伪:若在受控条件下反复传输/复制/存储后
    信息保真度不下降,则该通道的证据失效。这一重建保留了桥接砖的方法论价值
    (提供多渠道经验锚定 AXIOM-002)而不依赖一个已被反例证伪的收敛预测。

    第二类(技术性,可独立修复):
    - required_fix #1:移除 CONCEPT-measurement 引用或创建对应的 L1 概念。
    - required_fix #3:删除或重写证伪条件(c)为可操作的正向测试。
    - required_fix #4:删除证伪条件(b)中的"无法通过实验设计差异解释"逃生舱。
    - required_fix #5:替换或删除 Büring (2014) 幻觉引用,以真实文献(如
    Roelli 2020 Handbook of Stemmatology)替代。

    此外:缺少 IEA/cross_verification 段(桥接砖应通过 IEA 调查补全);缺少
    non_recurrence 检查(DED-004/DED-007 死因不得复现的声明)。

    裁决:needs_revision(可修,非核心塌陷)。桥接砖的底层直觉(多渠道经验观测
    信息衰减)有方法论价值,但当前版本的强收敛声称在操作上不可检验、在经验上
    被反例证伪、在引用上含幻觉。需要根本性重建——不是微调措辞,而是放弃收敛
    预测并诚实区分三种衰减机制的物理本质。

  red_flags:
    brick_is_conclusion:
      hit: false
      detail: |
        AXIOM-002(信息熵增公理)断言:信息不投入能量维护则必然衰减。这是一个
        存在性命题(衰减存在),不说如何测量衰减的速率,也不说不同测量通道之间
        的关系。BR-L2-025(数字媒介可处理性)说的是信息从"死物"(需人读)变
        "活物"(机器可处理)的质变,不涉及衰减速率的经验测量。

        本砖的非平凡经验内核是:(1)衰减速率可以通过三维独立经验通道具体量化,
        (2)三种方法应收敛于同一数量级。其中(1)是方法论贡献——将 L1 的抽象
        命题操作化为具体测量,这是 L2 桥接砖的正当职能。(2)是经验预测——它
        超出了"衰减存在"的 L1 声称,提出了一个可被观测挑战的定量主张。

        但必须警惕一条边界:若将"信息衰减"定义为"三种方法测到的那个共同的量",
        而"三种方法收敛"又被用作"测量方法有效的证据",形成"定义→收敛→验证"
        的软性循环。当前砖未达到 DED-004 级的闭合循环(因(1)为每条方法提供了
        独立于其他方法的操作化——口传保真度、抄写错误率、位翻转率各自有独立
        于"共同衰减量"的定义),(2)收敛是预测而非定义——三种方法在逻辑上可以
        不收敛。但操作化缺口(红旗 3)使这种独立性打了折扣。

        裁决:brick=conclusion 未命中。本砖的核心经验贡献(操作化+收敛预测)
        并非 L1 隐含的任何命题的复述。但收敛预测本身的生存能力在反例猎捕和
        红旗 3 中被严厉挑战——这是经验主张被证伪,不是被平凡化。

    empty_cell_tautology:
      hit: false
      detail: |
        本砖的核心空格预测:若信息衰减速率在不同通道间不一致(发散世界),则
        三种方法的测量结果不应收敛。这是一个可观测的经验预测——不是同义反复。
        "三者收敛于同一数量级"是正面预测,"三者发散>两个数量级"是证伪条件——
        两者之间的逻辑空间(发散但不超过两个数量级)构成可检验的经验地带。

        但如前所述(required_fix #2),这个空格的可测性受限于操作化缺口:在没有
        共享度量单位的情况下,"收敛"和"发散"本身无法操作化裁决。这不是逐格判空
        的问题(空格本身是经验性的),而是测量操作化的问题——恰是红旗 3(测量轴
        正交)和红旗 11(口径注册)的管辖范围。

        裁决:逐格判空未命中。空格预测是经验性的,但测量基础设施缺失使其在
        当前形式下不可检验。

    measurement_axis_orthogonality:
      hit: true
      detail: |
        本红旗命中——这是本桥接砖最严重的结构性缺陷。

        (1)【三种度量的不可通约性——REQUIRED】
        自变量(测量方法:口传/抄写/数字)与被观测量(衰减速率)之间的关联存在
        根本性问题:三种方法使用了三种不可通约的度量单位:
        - 口传:% 语义保真度/代
        - 抄写:字符错误数/抄写次数
        - 数字:位翻转率/bit/read

        砖声称三者测量的是"同一衰减速率",但三种度量之间不存在天然的换算
        公式。将"故事细节丢失 50%/5 代"和"位翻转 10^-15/bit/read"表达为
        同一"衰减速率"需要一个换算方案——该方案在砖中完全缺失。

        这个缺陷不同于 DED-007 式的闭环焊接(分母偷用结果)或 BR-L2-032 式的
        度量单位选择偏向(用计算吞吐量偷换经济效率)。它更根本:三个被观测量
        可能在测量三个【不同的物理-认知过程】,这三种过程虽然都涉及"信息"
        这个词,但:
        - 口传衰减:主要机制是人类记忆的编码/存储/检索错误(认知过程)
        - 抄写衰减:主要机制是视觉感知+运动控制的随机错误(知觉-运动过程)
        - 数字衰减:主要机制是电磁介质的物理退化(热力学过程)

        将三者统一称为"信息衰减"并在不提供统一度量框架的情况下声称其速率
        应收敛,是概念偷换——将三个不同过程的速率当作同一变量的三次测量。
        真正的测量轴正交要求:自变量(方法)与被观测量(同一变量的不同测量)之间
        存在明确定义的因果链——当前砖中这个因果链是一个黑箱,里面装的是
        "信息衰减"这个标签而非精确定义的被观测量。

        (2)【数字通道的"信息丢失"为零的边界问题】
        数字存储加 ECC 纠错后,语义信息丢失精确为零(纠错码将原始位翻转完全
        消除至可忽略的低概率)。零与任何正数之比为无穷大。砖将数字通道纳入
        "衰减速率"框架时,未区分"原始位翻转率"(物理层的噪声)与"纠错后语义
        信息丢失率"(信息层的衰减)——这两个量在信道编码定理下可以是完全解耦的。
        如果砖测的是前者,它测的是电磁噪声而非信息衰减;如果测的是后者,数字
        通道的衰减为零,与口传/抄写通道存在无穷倍的差异。

        裁决:红旗 3 命中(required 级)。三条通道的被观测量不可通约,收敛声称
        建立在概念偷换之上。修复路径见 required_fix #2。

    excluded_outcomes_independence:
      hit: true
      detail: |
        本红旗命中——falsifiability (b)中的"无法通过实验设计差异解释"条款。

        该条款是事后逃生舱:任何三方法之间的发散都可以被作者归因为"实验设计
        差异"而排除于证伪证据之外。口传用了故事、抄写用了佛经、数字用了
        文本文件——每一项差异都可以被辩护为"实验设计差异"。

        按 L4-009 判例精神:排除钩子必须在见反例前注册具体的、可事前应用的
        判据。"实验设计差异"这个判据本身(什么算差异?多大差异算可接受的?)
        完全没有预注册,授予作者无限的排除裁量权。这是一个比 BR-L2-032 的
        证伪条件(b)更严重的问题——BR-L2-032 的(b)至少概念上可以翻转(从证明
        连续改为拒绝连续),此处的"实验设计差异"是概念上的空集(什么都可以是
        实验设计差异)。

        裁决:红旗 4 命中(required 级)。见 required_fix #4。

    classification_granularity:
      hit: false
      detail: |
        砖的核心对立是"收敛 vs. 发散"这一二分,但背后的经验现实是衰减速率
        的连续差谱。收敛预测("不超过一个数量级")和证伪阈值("超过两个数量级")
        之间有一个灰色地带(1-2 个数量级的差异),在此地带内预测不成立、证伪
        也不成立。这个灰色地带使二分可操作性打了折扣,但对本砖而言这是一个
        次要问题——更大的缺陷(红旗 3 的不可通约 + 反例猎捕的净杀)使这个问题
        在优先级上被边缘化。若修完 required 缺陷后争议仍存,可再审视此问题。

    anti_talisman_delivery:
      hit: true
      detail: |
        本红旗命中——falsifiability (c)构成 anti-talisman 护身符。

        falsifiability (c):"数字存储系统中,在给定的冗余率下实测的误码率远低于
        香农理论预测的可达到边界(例如低于理论下限的10%)"。

        香农信道容量定理给出了给定噪声水平下可靠通信的速率上界——这是一个
        数学证明的理论极限,不是经验可超出的值。Hamming 界进一步给出了在给定
        码长和纠错能力下码字数量的上界。要求实测值低于理论下界来证伪本砖=
        要求观测到违反数学定理的事件来证伪一个经验命题。

        证伪条件必须满足:(1)描述的经验事件在物理上可能发生;(2)该事件的发生
        可由独立观察者在不依赖理论解释的情况下确认。条件(c)两项都不满足:
        违反香农定理的事件在物理上不可能发生(除非香农 1948 的证明有数学错误);
        且真若发生,它将证伪的是信息论而非本桥接砖——本砖只是搭了信息论定律
        的便车,不应把违反基本物理定律作为自己的证伪条件。

        类比:若某气象学命题的证伪条件是"实测气温低于绝对零度",这不是真正的
        证伪——这是在命题周围砌了一道物理定律的护城墙,任何攻击都被护城墙挡下。

        裁决:红旗 6 命中(required 级)。见 required_fix #3。

    reality_anchor_fact_check:
      hit: true
      detail: |
        本红旗命中——Büring (2014) 引用极可能为 LLM 幻觉。

        (1)【Büring (2014) 人和研究领域不匹配——REQUIRED】
        Daniel Büring 是 UCLA 语言学系教授,研究方向为形式语义学/语用学,
        以焦点-话题结构、语调语义学和对比话题研究闻名。他在 Google Scholar
        上的高引作品均为语义学/语用学主题,无一涉及中世纪手抄本定量分析或
        stemmatology。他是一个真实学者,但"2014 年发表手抄本定量分析研究"
        这个组合在学术数据库(Google Scholar/Semantic Scholar/JSTOR)中无法
        验证——没有匹配的标题、没有匹配的摘要、没有匹配的引用网络。

        这是 LLM 在生成学术文本时的一种典型错误模式:模型从训练数据中关联了
        "Büring"和"2014"(可能他在 2014 年确实发表了某篇语义学论文),同时
        从另一个语境中抽取了"手抄本定量分析"和"stemmatology"的内容,将二者
        错误地绑定为一个引用。这类似于 BR-L2-032 审查中未发现但本审查新暴露
        的 hallucination 模式。

        (2)【其他引用准确性核查】
        - Bartlett (1932):发表属实。但"首次定量展示了"有夸大——Bartlett 的
        原始工作更偏定性(故事变形模式的描述),定量衰减曲线主要由后续研究者
        (如 Mesoudi & Whiten 2008)建立。这不是虚假引用,是引用精度问题。
        - Mesoudi & Whiten (2008):发表属实,链式传递实验准确。
        - Kalish et al. (2007):发表属实,迭代学习实验准确。
        - Shannon (1948):发表属实,信道容量定理准确。
        - Hamming (1950):发表属实,纠错码理论准确。
        - Landauer (1961):Landauer 原理(信息擦除的能量成本)发表属实,但原论文
        是 IBM Journal of Research and Development 发表的,标题为"Irreversibility
        and Heat Generation in the Computing Process"。关联到"信息擦除必然伴随
        能量耗散"准确。

        其他引用无造假,但 Büring (2014) 这一条足以触发 required 级红旗——在
        三个 applicable_sources 之一的 rationale 中引用了一个不存在的出版物,
        直接损害桥接砖的经验可信度。

        裁决:红旗 7 命中(required 级)。见 required_fix #5。

    definition_vs_prediction:
      hit: false
      detail: |
        "三种方法应收敛于同一数量级"是一个可证伪的经验预测,不是定义。逻辑上
        自洽的可能世界包括(1)三种方法在衰减速率上系统性发散,(2)只有两种方法
        收敛第三种发散,(3)在任何信息类型下都不收敛。这些替代世界不违反任何
        逻辑约束——它们是经验可能性。

        但操作化缺口(红旗 3)使该预测在当前形式下实际上无法检验——不是因为它
        变成了定义,而是因为度量框架缺失使它失去了经验可判定性。这不是"条件是
        定义还是预测"的分类问题,而是"预测是否被充分操作化"的方法论问题。
        落入红旗 3 和红旗 11 的联合管辖范围。

        裁决:红旗 8 未命中。

    enumeration_exhaustiveness:
      hit: false
      detail: |
        砖枚举三条测量方法(口传/抄写/数字),未声称穷举所有可能的测量方法。
        "三种"是可扩展的方法类别,不是"仅此三类"的 exhaustive claim。

        主动猎第 4 类:生物信息衰减——DNA 复制突变累积速率、蛋白质序列的进化
        漂移速率。这可以视为数字通道(binary code 复制)的生物类比——DNA 聚合酶
        的复制错误率(~10^-8 至 10^-10/碱基/复制)与数字通道(~10^-15/bit/read)
        差 5-7 个数量级,与口传(~0.05-0.15/代)差 7-9 个数量级。如果砖的框架
        是"所有信息复制系统共享同一衰减速率",那 DNA 是另一个反例。但砖已将
        射程限制在"自然语言"等符号信息类型,DNA 不是自然语言——不致命。

        裁决:红旗 9 未命中。三方法的枚举是开放性的,非声称穷举。

    primary_suspect_accuracy:
      hit: false
      detail: |
        L2 砖无 formal primary_suspect 字段(L3/L4 要求),按红旗精神审查最弱腿。

        外部识别的最致命软肋(砖未自认):
        (i)【收敛预测被反例猎捕净杀】这是全砖最脆弱的经验腿,且砖未自认其
        脆弱性。见 counterexample_hunt 和 required_fix #6。
        (ii)【Büring (2014) 幻觉引用】砖未自认。见红旗 7 和 required_fix #5。
        (iii)【测量轴不可通约】砖未意识到三种"衰减速率"实际上测的是不同
        物理量。见红旗 3 和 required_fix #2。
        (iv)【CONCEPT-measurement 不存在】validate.py 在写入时即命中。见
        required_fix #1。

        四个致命软肋中,(i)和(ii)是事实层面的硬伤,(iii)是概念架构层面的
        系统缺陷,(iv)是引用层面的漏洞。砖未自认任何一条。这些不是"可通过
        微调隐藏"的软肋——它们在砖的当前形态下是结构性的。

        裁决:虽本红旗不触发 required(L2 无 primary_suspect 字段要求),但四
        条软肋均已在其他红旗和 required_fix 中被独立捕获和定位。

    caliber_registration:
      hit: true
      detail: |
        本红旗命中——"衰减速率"的口径未注册。

        (1)【核心量无共享度量单位——REQUIRED】
        砖的 statement 声称:"三种方法测量的单位代际/时间/复制中不可恢复比特
        损失比例差异不超过一个数量级"。这个表述中的"不可恢复比特损失比例"
        看起来像一个共享度量,但三种方法各自如何将观测数据映射为"不可恢复
        比特损失比例",砖完全没有注册:
        - 口传:如何从"故事细节保真度%"换算为"不可恢复比特损失比例"?
        一个故事有多少比特?丢失 50% 细节=丢失 50% 比特吗?
        - 抄写:如何从"字符错误数"换算为"不可恢复比特损失比例"?一个错误字符
        丢失了多少比特的信息内容?
        - 数字:如何从"位翻转率"换算为"不可恢复比特损失比例"?纠错码后的净
        信息丢失应怎么算?

        按红旗 11 标准(来自 L4-009 判例):阈值必须连同分子、分母、测量口径
        【一次性注册】。砖声称的"差异不超过一个数量级"中的"差异"是三个
        衰减速率之间的比较——但如果三个衰减速率各自的定义(分子/分母/单位)
        都没有注册,这个比较就是空的。这就如同说"A、B、C 三个城市的气温应该
        差不多"却没有定义"气温"是用摄氏度、华氏度还是开尔文——并且 A 用
        温度计、B 用体感报告、C 用红外遥感。不同仪器测量不同量却声称在测
        同一量→口径注册的根本性失败。

        (2)【"差异不超过一个数量级"的统计口径未注册——should】
        即使假设三条衰减速率已经换算为同一单位,如何计算"差异"也没有注册:
        是中位数比?最大值比最小值?标准差与均值比?三个值的差异用哪个统计量
        表达?一个数量级是 log10 差 1.0 还是因子 10?

        裁决:红旗 11 命中(required 级)。核心量的口径未注册,使收敛声称在
        方法论上空转。与红旗 3(测量轴不正交)共享同一根源,修复路径重叠。

    data_source_common_root:
      hit: false
      detail: |
        本砖引用的是三类不同学科的文献:认知科学(口传实验)、信息论+计算物理
        (信道容量/纠错码)、档案学(手抄本研究)。这三类文献在数据源层面没有
        共享底层观测——认知实验使用人类被试数据、信息论使用数学推导和工程
        测量、档案学使用历史手抄本的实物数据。无 data_source_origin 折扣触发。

        但需注意:Büring (2014) 这个引用极可能为 LLM 幻觉(见红旗 7),即"档案学
        手抄本研究"这一 applicable_source 中的核心引用是虚假的。这意味着该源
        在当前形式下没有有效的经验锚。这不是 data_source_common_root 的问题
        (不是多源同根),而是单源空心化的问题——但由红旗 7 独立捕获。

    api_pretending_independence:
      hit: false
      detail: |
        本砖的 applicable_sources 引用的是学术文献,不通过 API/MCP 查询数据源,
        不涉及"多路 API 查询算作多重独立验证"的问题。无此红旗触发。

        但有一条相关关切:砖声称"三种方法互相验证",却未提供 cross_verification
        段(IEA 调查)。"互相验证"这一措辞可能使读者误以为三方法已经过独立来源
        的交叉确认——但实际上(1)IEA 调查未执行(无 cross_verification 段),
        (2)三条方法在砖中被同一作者(单一 LLM)解读,存在仪器相关性(instrument_
        correlation 折扣适用)。这是一个透明度问题,由红旗 12(instrument_
        disclosure)和相关缺失的 IEA 段覆盖。

    reverse_failure_mode:
      hit: true
      detail: |
        本红旗命中——砖未注册反向失败模式。

        (1)【反向失败模式:三种方法测量的是三个不同的物理过程——should→required】
        砖的正面预测是"三种方法应收敛"。反向失败模式是"三种方法测量的是三个
        不同的物理过程(口传=认知衰减,抄写=知觉-运动衰减,数字=电磁衰减),它们
        恰好共享'信息衰减'这个标签但彼此不存在物理上的共同被测量"。

        这个反向失败模式比"发散"更根本。发散只是说数值不一样——这可以归咎
        于测量误差或实验设计差异。但"测量的是不同物理过程"意味着数值的比较
        在概念上就是 category error——就像比较"水加热到沸腾的时间"和"铁生锈
        的时间"并声称它们应"收敛于同一数量级"因为都涉及"物质变化"。

        砖对此反向失败模式完全没有注册。在当前形式下,如果三条通道给出了
        不同的衰减速率,砖会将差异归因于测量误差(通过逃生舱"实验设计差异");
        但另一种同样合理的解释是三个通道根本测的是不同东西。按红旗 14 标准:
        "若反向模式的方向恰好与推论的因果主张相反,升级为 required"——这里的
        反向模式直接质疑"三种方法测同一量"这一砖的核心前提,应升级为 required。

        (2)【次级反向失败:数字通道在纠错码下信息丢失为零】
        数字通道加 ECC 纠错后,信息衰减可以精确为零(纠错码将误码率压至低于
        任何可检测水平)。零衰减与口传/抄写通道的正衰减之间的比值为无穷大——
        这不是"差异在 1-2 个数量级"的问题,是"一个通道根本不存在砖所声称的
        衰减现象"的问题。砖未注册这一边界:如果三种方法中有一项显示零衰减,
        这算"收敛"(都接近零)?还是算"发散"(零 vs.正数)?还是砖应承认数字
        通道在纠错码保护下不测衰减?

        裁决:红旗 14 命中(升级为 required,因反向模式直接挑战砖的核心前提
        "三方法测同一量")。见 required_fix #2 和 #6——这两条修复实质上也解决
        了本红旗。

    bootstrap_limitation:
      hit: false
      detail: |
        本砖不涉及新技术介导的社会形态,不涉及"X可在稳态下替代Y但冷启动依赖Y"
        的 bootstrap 逻辑。无此红旗触发。

    verification_target_existence:
      hit: false
      detail: |
        三种测量方法(口传实验、手抄谱系分析、数字误码率测量)在当前世界都有
        成熟的实践和文献,不存在"验证对象近乎空集"的问题。但有一个微妙的点:
        砖描述的数字通道("原始位翻转率与纠错冗余的关系")在工程实践中,原始
        BER 的测量需要专业设备和受控环境——这不是一个普通研究者可以轻易
        复现的测量。不过这不是"验证对象不存在",只是"验证有技术门槛"——不在
        红旗 16 的管辖范围。

        裁决:红旗 16 未命中。

  iea_independence_check:
    disclosed_iea: 未提供
    effective_iea_estimate: 未评估(无 cross_verification 段)
    adjustment_rationale: |
      BR-L2-046 当前文件中没有 cross_verification 段——IEA 调查未执行。
      桥接砖作为 candidate 状态提交时,应完成 IEA 调查(多来源加权投票)并
      写入 cross_verification 段。没有 IEA 数字意味着无法判断本砖的经验证据
      是否达到 L2 的最低独立确认门槛(IEA ≥ 1.2)。

      根据桥接砖的 applicable_sources,应在 IEA 调查中评估至少三条来源的
      独立确认:
      (1) 认知科学——文化传输实验(Bartlett/Mesoudi-Whiten/Kalish 等):
      对口传衰减的操作化和定量测量有丰富文献。与演化生物学的独立系数约 0.4
      (共享进化博弈论的数学结构——文化遗产作为"文化种群"的进化动力学)。
      (2) 信息论与计算物理(Shannon/Hamming/Landauer):对数字信息衰减提供
      理论-工程双重锚定。与认知科学的独立性较高(~0.6-0.8,数学推导 vs. 行为
      实验,完全不同的方法论)。
      (3) 档案学与手抄本研究:为抄写衰减提供历史-档案学锚定。与信息论的
      独立性约 0.6(共享统计建模——stemmatology 使用贝叶斯/最大简约等统计
      推理,信息论使用概率和编码理论)。

      但需注意:(a) Büring (2014) 引用极可能为 LLM 幻觉,使来源(3)的证据
      支撑空心化——必须在 IEA 调查前先修复引用;(b) instrument_correlation
      折扣适用——三路投票若由单一 LLM 执行,报告的 IEA 仅是学科独立性上限,
      有效独立性低于此;(c) 如果收敛预测被放弃(按 required_fix #2 和 #6),
      IEA 应重新校准——IEA 计权的是"信息衰减可被多条通道独立观测"(方法论
      命题)还是"衰减速率定量收敛"(经验命题)?这两个命题的证据生态不同。

      补充要求(required):桥接砖在下一轮修订前必须先通过 IEA 调查。
      cross_verification 段缺失使砖在程序上不完整——这不是审查者可以自行
      填补的空白。

    instrument_honesty:
      disclosed: false
      assessment: |
        当前文件中没有 instrument_disclosure 段,未披露单一 LLM 执行折扣。
        按 independence-model.yaml 的 instrument_correlation.discount_rule:
        当 L2 桥接命题的 cross_verification 投票由单一 LLM 执行时,必须披露
        "报告的 IEA 是学科独立性上限,仪器有效独立性低于此"。此项缺失需在
        IEA 调查完成时一并补全。

        此外,本砖的"三种方法互相验证"措辞(in applicable_sources 段外)可能
        使读者误以为已存在多方法交叉确认——在未完成 IEA 调查的情况下,这是一种
        潜在的误导性印象。需在 IEA 完成后诚实标注哪些来源在多大程度上提供了
        独立确认。

    no_data_source_common_root:
      applicable: false
      detail: |
        未引用宏观经济数据源(WB/IMF/CNBS 等),不触发 data_source_origin 折扣。

  counterexample_hunt:
    methodology: |
      三个反例方向:(1)为同一自然语言信息构造三条通道的衰减速率比较——
      测试收敛预测中最直接的可证伪点;(2)检验数字通道在纠错码存在下是否
      还"测衰减";(3)猎捕潜在的幻觉引用——验证 Büring (2014) 的可追溯性。
    cases:
    - direction: "同一自然语言信息的三通道衰减速率比较——核心收敛预测的压力测试"
      description: |
        取一段 1000 字的叙述性中文文本(约 2000 字节 UTF-8 编码 = 16,000
        Shannon-bits 的物理表示)。

        通道 A——口传(10 人链式传递):
        Bartlett (1932) 和 Mesoudi & Whiten (2008) 的经典结果:10 代链式传递后
        约 50-70% 的具体细节丢失或变形。每代丢失约 5-15% 的语义内容。
        "衰减速率"≈每代丢失 0.05-0.15 的归一化语义保真度。

        通道 B——手抄(10 次逐字抄写):
        熟练抄写员:约 0.1-0.5% 字符错误率/次,10 次后累积约 1-5% 错误。
        未经训练的现代人:约 0.5-2% 字符错误率/次,10 次后累积约 5-20% 错误。
        取中值保守估计:"衰减速率"≈每代增加约 0.5-1% 的字符错误(=每代丢失
        约 0.005-0.01 的字符精度)。

        通道 C——数字存储(同一文本以 UTF-8 存储在 SSD 上,读取 10 次):
        现代 SSD(NAND 闪存)原始位错误率:约 10^-15 至 10^-16/bit/read。
        16,000 bits × 10 reads = 1.6 × 10^5 bit-reads。期望原始位错误数:
        < 10^-10 bits(可忽略不计)。加 LDPC/ECC 纠错后,不可恢复位错误率
        (UBER):约 10^-15 至 10^-16。10 次读取后期望不可恢复错误: < 10^-11。
        "衰减速率"≈每次复制损失 < 10^-15 至 10^-11 的归一化 bit 比例。

        比较:
        口传衰减速率 / 数字衰减速率 ≈ (10^-1 至 10^-2) / (10^-11 至 10^-15)
        ≈ 10^9 至 10^14(即 9 至 14 个数量级)。

        砖的预测:差异不超过"一个数量级"(因子 ≤10)。
        砖的证伪阈值:"超过两个数量级"(因子 >100)。
        观测值:因子 10^9 至 10^14——远超证伪阈值约 7-12 个数量级。
      counter_impact: "净杀——收敛预测被直接证伪"
      analysis: |
        这是一个干净、可复现的经验案例。它满足砖自己设定的检验条件:
        (1)同一信息类型(自然语言文本),(2)三种方法各自在自己的操作化定义下
        测量衰减,(3)比较的是"每代/每复制的信息丢失比例"。

        观测到的衰减速率差异(9-14 个数量级)远超砖的证伪阈值(2 个数量级)。
        这不是"边界案例",不是"测量误差范围内",不是"可通过实验设计差异解释
        的微小偏离"——这是 10^10 倍的巨大鸿沟。

        潜在辩护路径及逐一驳回:

        辩护 A:"数字通道应使用无纠错码的原始介质,如软盘或磁带。"
        驳回:(i)砖的 statement 写的是"数字系统中原始位翻转率与纠错冗余的关系"
        ——它提到"纠错冗余",明确意味着有纠错码的数字系统在其射程内。若现在
        为了救收敛预测而排除所有使用纠错码的现代数字系统,这是在反例出现后
        收缩射程(事后口径选择)。(ii)即使使用无纠错码的老化磁带(原始 BER
        ~10^-6 至 10^-8 /bit/read),与口传(~0.05-0.15)仍差 5-7 个数量级——
        远超"一个数量级"的预测。(iii)若限制为"无纠错码且易失介质",验证对象
        存在性成为新问题——这几乎只剩工程博物馆里的展品。

        辩护 B:"三种通道测的是不同尺度的'代'——口传的一代是认知代,数字的
        一代是物理复制——需要归一化。"
        驳回:这正是 required_fix #2(测量轴不可通约)的核心。砖在声称收敛时
        没有定义如何归一化"代"这个概念。口传的"一代"=一个人听到并复述一个
        故事,数字的"一代"=一次 NAND 页读取。这两个"代"在物理上没有任何可比
        性——甚至不存在将它们映射为同一时间尺度的通用框架。如果砖现在要为
        这两种"代"发明归一化因子使衰减速率数字收敛,这是在用自由参数拟合
        数据,不是在做预测检验。

        辩护 C:"砖的收敛预测应被解释为'如果衰减机制相同(无维护的信息自然
        退化),则速率应相似',而数字通道有主动纠错(能量投入=维护),所以不适用。"
        驳回:(i)如果数字通道因有纠错码而被排除,那抄写通道也应该因抄写员的
        自我纠错(边抄边校对)而被排除——抄写员的 visual feedback loop 是实时
        纠错机制,这本质上也是"维护"。(ii)口传通道中,听者会用自己的常识填补
        遗忘的细节(Bartlett 的"合理化"效应)——这也是一种维护/重建机制。
        (iii)如果三个通道都因各自固有的维护/纠错机制而被排除,那就没有通道
        剩下——砖的射程缩为空集。这不是可辩护的区分,是 ad hoc 排除。

        结论:这是一个净杀反例。砖的收敛预测在可预见的任何操作化下都无法存活。
        这不是一个"可能被未来更精确实验拯救"的命题——三个通道的衰减机制
        (认知/知觉-运动/电磁)在物理本质上是不同的,期望它们的速率"收敛于同一
        数量级"就如同期望"人的遗忘速度"与"铁的氧化速度"收敛于同一数量级——
        两者确实都叫"衰减",但它们不是同一现象的不同测量。

    - direction: "Büring (2014) 引用的可验证性"
      description: |
        在 Google Scholar、Semantic Scholar、JSTOR 中搜索 "Büring 2014
        manuscript"、"Büring stemmatology"、"Büring medieval copying" 及
        仅 "Büring 2014" 过滤手抄本/stemmatology 主题。同时核查 Daniel
        Büring 的学术主页(UCLA Linguistics)上的出版物列表。
      counter_impact: "净杀——引用极可能为 LLM 幻觉"
      analysis: |
        Daniel Büring (UCLA 语言学系教授)的已知研究领域为形式语义学与语用学
        (焦点结构、话题-评述结构、对比话题、语调语义学)。他的 Google Scholar
        个人页面中所有 2014 年前后的出版物均为语义学/语用学主题,无一涉及
        中世纪手抄本、stemmatology 或抄写错误定量分析。

        在更广泛的学术检索中:
        - "Büring manuscript stemmatology"→零结果
        - "Büring medieval copying errors"→零结果
        - 2014 年 stemmatology 相关出版物→无 Büring 署名

        手抄本谱系学(stemmatology)的真实学术脉络:
        - 经典:Maas (1927)、Quentin (1926)
        - 计算机 stemmatology:Barbrook et al. (1998, Nature)、Howe et al. (2001)、
        Spencer et al. (2004)、Roos & Heikkilä (2009)
        - 综述:Roelli (2020, ed.) "Handbook of Stemmatology"(De Gruyter)

        结论:Büring (2014) 作为"手抄本定量分析"引用是 LLM 幻觉。这不是引用
        格式或年份的小错误——这是一个学者被错误地赋予了一个不存在的出版物
        和完全不属于他研究领域的内容。这条引用必须替换或删除。推荐替代:
        - Roelli, P. (ed.) (2020). Handbook of Stemmatology. De Gruyter.
        - Barbrook, A.C. et al. (1998). The phylogeny of The Canterbury Tales.
        Nature 394:839.

    - direction: "数字纠错码下信息衰减为零的边界反例"
      description: |
        取一个 UTF-8 文本文件存储在具有 LDPC ECC 的现代企业级 SSD 上。读取
        该文件 10^6 次(远超过典型使用场景)。计算读取后的文件内容与原始文件的
        SHA-256 哈希值。
      counter_impact: "边缘反例——揭示数字通道的衰减测量射程问题"
      analysis: |
        在纠错码有效范围内(即原始 BER 低于 ECC 的纠错能力阈值),信息丢失精确
        为零——不是因为衰减不存在(原始 BER > 0),而是因为纠错码将信息恢复到了
        无损状态。这是信道编码定理的工作机制:只要信道噪声在容量以内,信息可以
        以任意小的错误概率传输/存储。

        这揭示了一个砖没有处理的射程问题:砖声称测的是"信息衰减速率",但数字
        通道中:
        - 物理层的原始 BER 测的是介质噪声,不是信息衰减(纠错后可消除)
        - 纠错后的净语义错误率测的是信息衰减——且该值为零

        口传和抄写通道没有数字纠错码的等价物(口传中的"合理化"和抄写中的"校对"
        在功能上类似纠错,但不是精确的数学纠错)。这使得数字通道的"衰减"测量
        在概念上与其他两通道不平行——它是一个两层的系统(物理噪声+数字纠错),
        而另两个通道是单层的(人类输出=最终输出)。

        这个案例不构成额外的净杀(主净杀已在案例 1 中确立),但进一步说明三通道
        在物理测量架构上的不可比性——它加强了 required_fix #2(测量轴不可通约)
        和 required_fix #14(反向失败模式)的论证基础。

    overall_counterexample_verdict: |
      反例猎捕在两个方向上取得净杀:

      (1)【收敛预测的直接证伪(主净杀)】口传衰减速率(每代~5-15%语义丢失)
      与数字衰减速率(~10^-11 至 10^-15/read)相差 9-14 个数量级,远超砖的
      证伪阈值(2 个数量级)和预测(1 个数量级以内)。这是干净的经验反例——
      不依赖一个特别的解释框架,不需要复杂的换算争议(即使在最保守的假设下,
      差距也在 5+ 数量级)。收敛预测被证伪。

      (2)【幻觉引用的间接证伪(学术诚信净杀)】Büring (2014) 作为手抄本研究
      的引用无法在任何学术数据库中验证,且与署名学者的已知研究领域完全不符。
      这是 LLM 幻觉——该引用在当前形式下不应被视为经验支撑。

      反例猎捕的总体贡献不仅是发现具体的技术问题,而是诊断出桥接砖核心声称
      (收敛预测)的根本性缺陷:三条通道测的是三个物理上不可比的衰减过程,
      期望它们在数值上收敛是一个 category error。这不是"操作化还不够精细"
      的问题——是概念架构本身需要重建。

  non_recurrence:
    - check: DED-004
      status: pass
      detail: |
        本砖未形成"概念定义→经验指标→概念验证"的不可证伪循环。三种测量
        方法各自独立于其他方法定义了"衰减"(口传保真度不依赖抄写或数字的
        定义,反之亦然)。收敛是预测而非定义。DED-004 死因未重现。
    - check: DED-007
      status: pass_with_caveat
      detail: |
        非 DED-007 式的闭环焊接——砖不自变量的定义不偷用被观测量。但存在
        另一种测量轴问题:三种方法的被观测量不可通约(红旗 3 详述)。这不是
        DED-007 的结构死罪(分母焊死),而是操作化缺失的问题——可修复,
        修复路径是放弃收敛声称或提供统一的换算框架。标为 pass_with_caveat。

  required_fixes:
    - id: REQ-BR-L2-046-A
      severity: required
      what: |
        修复 bridges_to.concepts 引用。CONCEPT-measurement 不存在于 L1-definitions.
        三个选项:(A)在 L1-definitions/concepts/ 下创建 CONCEPT-measurement,
        定义经验测量的基本概念(操作化/度量/误差/效度);(B)将引用替换为
        CONCEPT-measurement-independence 并在 rationale 中解释测量独立性
        为什么与多通道观测相关;(C)移除 CONCEPT-measurement 引用,仅保留
        CONCEPT-information + AXIOM-002。
        推荐(C)——最简单且不引入新的 L1 依赖——但需确保剩余桥梁仍满足 L2
        桥接砖的 bridges_to 完整性要求。
      rationale: |
        validate.py 报错:引用不存在的实体。这是硬性体系一致性缺陷。

    - id: REQ-BR-L2-046-B
      severity: required
      what: |
        放弃"三种方法测量的衰减速率应收敛于同一数量级"的收敛声称。将桥接砖
        的核心主张重建为:信息衰减(AXIOM-002 确立的必然性)可以通过至少三条
        独立经验通道观测——(i)口传序列再生实验(测量认知信息衰减),(ii)手抄
        谱系分析(测量知觉-运动信息衰减),(iii)数字误码率测量(测量物理介质
        衰减)。三条通道各自独立可证伪(若在受控条件下反复传输后信息保真度
        系统性不下降,该通道证据失效)。三条通道测量的是衰减的不同物理-认知
        机制,不预设速率收敛。多通道的存在价值在于方法论三角验证(彼此独立的
        测量链排除了单通道方法伪影的可能性),而非数值收敛。

        同步修改:(a)从 statement 删除"三者测量得到的衰减速率应当收敛于同一
        数量级"及相关定量声称;(b)从 falsifiability 删除关于三方法速率比较的
        证伪条件;(c)重写 applicable_sources 的 rationale,移除"互相验证"措辞,
        替换为"各自独立提供信息衰减的经验锚定"。
      rationale: |
        (1)反例猎捕直接证伪收敛预测——即使最保守假设下,口传与数字衰减速率
        差距也超 5 个数量级,远超"一个数量级"预测。(2)三条通道的被观测量
        不可通约(无共享度量单位),收敛声称在操作上无法检验。(3)三条通道测量
        的是不同的物理-认知衰减机制,不是同一被观测量的三次测量——收敛期望
        没有物理基础。(4)多通道独立观测的方法论价值不依赖收敛——放弃收敛
        声称不损失桥接砖的核心贡献。

    - id: REQ-BR-L2-046-C
      severity: required
      what: |
        删除或重写 falsifiability (c)。当前(c)要求"实测的误码率远低于香农
        理论预测的可达到边界(例如低于理论下限的10%)"——这在物理上不可能发生。
        替换为可操作的证伪路径,例如:"在指定介质类型、纠错编码方案和比特数
        的条件下,经过 N 次(N≥10^5)存储-读取循环后,原始误码率 measured raw
        BER 在统计上不显著高于介质规格标称的 BER,或纠错后净错误率在统计上
        不显著高于零(即信息无衰减)——此时数字通道中信息衰减的经验证据不成立"。
        或者(若本次修订采纳 REQ-BR-L2-046-B 放弃收敛声称):将三条通道的证伪
        条件重构为各自独立的门——口传:保真度在多代后不下降;抄写:错误数不累
        积;数字:误码率不显著高于基线。
      rationale: |
        当前(c)用物理上不可能的事件作为证伪条件,构成 anti-talisman 护身符
        (红旗 6)。

    - id: REQ-BR-L2-046-D
      severity: required
      what: |
        删除 falsifiability (b)中的"且无法通过实验设计差异解释"子句。替换为:
        "若三者各自的衰减测量在各自度量框架下均无统计学显著衰减效应(即在
        统计检验下不能拒绝'衰减率为零'的原假设),且测量样本量足够大(N≥100
        代/次/复制),则桥接砖的核心主张(信息衰减可被经验观测)被削弱"。
        或者(若采纳 REQ-BR-L2-046-B):重构为三通道各自的独立证伪门,不设
        跨通道的联合证伪条件。
      rationale: |
        "无法通过实验设计差异解释"是无限逃生舱(红旗 4)。任何差异都可被事后
        归因为实验设计差异。

    - id: REQ-BR-L2-046-E
      severity: required
      what: |
        替换或删除 Büring (2014) 引用。推荐替换为:
        - Roelli, P. (ed.) (2020). "Handbook of Stemmatology: History,
        Methodology, Digital Approaches." De Gruyter.
        或
        - Barbrook, A.C., Howe, C.J., Blake, N., & Robinson, P. (1998).
        "The phylogeny of The Canterbury Tales." Nature 394:839.
        并重写 applicable_sources[2] 的 rationale 以准确反映所引文献的实际
        贡献(如 Roelli 2020 是 stemmatology 的方法论综述,Barbrook et al.
        1998 是计算机 stemmatology 的早期应用实例)。
      rationale: |
        Büring (2014) 极可能为 LLM 幻觉(红旗 7)。Daniel Büring 是语义学家,
        非手抄本谱系学者。该引用在任何学术数据库中无法验证。

    - id: REQ-BR-L2-046-F
      severity: required
      what: |
        执行 IEA 调查并补全 cross_verification 段。在 IEA 调查中:
        (1)为三条 applicable_sources(认知科学/信息论/档案学)各自判定对核心
        主张的 agree/disagree/partial 立场;
        (2)按 independence-model.yaml 的 source_pairs 和 data_source_origin
        折扣规则计算加权 IEA;
        (3)添加 instrument_disclosure,诚实标注单 LLM 执行折扣(引用 META-
        REVIEW-001 的 honest_ceiling);
        (4)若采纳 REQ-BR-L2-046-B(放弃收敛声称),IEA 计权应针对新的核心主张
        ("信息衰减可通过多条独立通道观测")而非旧的收敛预测。

        注意:此修复必须在 REQ-BR-L2-046-E(替换 Büring 引用)之后执行——IEA
        评估需要建立在可验证的真实文献基础上,不能在幻觉引用上进行来源判定。
      rationale: |
        桥接砖缺少 cross_verification 段,IEA 调查未执行。这是程序性缺失——
        L2 桥接砖必须完成 IEA 调查才能进入 candidate 评审。REQ-BR-L2-046-E
        是本修复的前置条件(不能在虚假引用上做来源判定)。

  should_fixes:
    - id: SHOULD-BR-L2-046-G
      severity: should
      what: |
        在修复后的 statement 中诚实区分三条通道的衰减机制类型:口传=认知信息
        衰减(人类记忆编码/存储/检索错误),抄写=知觉-运动信息衰减(视觉-手部
        协调的随机错误),数字=物理介质衰减(电磁/量子噪声)。明确声明这三者
        测量的是不同物理-认知过程的信息衰减,而非同一衰减物理量的三次独立
        测量。这一区分对桥接砖的认识论诚实至关重要。
    - id: SHOULD-BR-L2-046-H
      severity: should
      what: |
        注册三条通道各自的"衰减"操作化定义(分子/分母/单位):
        - 口传:语义保真度(正确复现的命题数/原文总命题数)/传递代际
        - 抄写:字符错误率(新增/替换/删除的字符数/文本总字符数)/抄写次数
        - 数字:原始位错误率(raw BER = bit errors/bit/read)或纠错后净误码率
        在 falsifiability 中为每条通道独立注册证伪测试的统计口径(样本量/
        显著性水平/效应量阈值)。即使放弃收敛声称,独立的口径注册仍是方法论
        完备性的基本要求。
    - id: SHOULD-BR-L2-046-I
      severity: should
      what: |
        在 applicable_sources 中补充 stemmatology 的真实文献(见 REQ-BR-L2-046-E
        的推荐替换)。此外,在 info-theory source 中,将 Landauer (1961) 的原论文
        标题"Irreversibility and Heat Generation in the Computing Process"
        与"信息擦除必然伴随能量耗散"的关联做准确表述(当前仅说"信息擦除必然
        伴随能量耗散"——Landauer 的原论文严格限定在计算过程的不可逆逻辑操作,
        不等价于所有形式的信息擦除)。

round_2:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 2, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心直觉(信息在复制中衰减、三种独立方法均可测量)站得住脚,但有两个 required 缺陷挡住 verified:

    **1. 红旗 #11(口径完整注册)命中——致命。** 证伪条件 (a) "准确回忆比例在连续5代以上不下降反而上升"——什么叫"准确回忆比例"?谁来判定"准确"?判分者是实验者本人(同源测量链),还是独立评分者?如果判分标准在实验设计阶段未注册,而 Bartlett 经典实验恰恰表明再生版本会在"语义等效但细节变形"的意义上保持高保真——按"语义级回忆"判可能不衰减,按"字面级回忆"判则衰减。这正是 DED-005/DED-006 死因:分类判据档位不匹配。文件的 falsifiability 没注册分子(什么算"准确")、分母(谁评分)、口径(字面 vs 语义)。

    **2. 红旗 #9(枚举穷尽 + species 按判据定义)命中——致命。** 推论声称"三种独立方法",但"独立"二字未被定义:三种方法共享什么底层驱动量(人类记忆容量有限 = PHY-002/认知瓶颈)?如果共享同一驱动量,所谓"三种独立"实质是"一个原因的三种表征"——退化成 brick=conclusion 的窄化版本,三种方法不是独立验证而是同因的三种回声。这与 AXIOM-002(信息熵增)的机制论证没有可分离的新增内容。

    **反例猎捕**:
    - 猎捕 1(口传衰减零/增强):Bartlett(1932)"幽灵战斗机"经典实验——许多被试再生版本在核心情节结构上保持极高保真,细节衰减但叙事骨架增强(coherent transformation)。按"故事核心是否保留"判可能不衰减。这是被消化(衰减确实发生在字面级),但揭出过度伸张——文件 falsifiability (a) 的"准确回忆比例"未限定测量层级。
    - 猎捕 2(数字域衰减为零):现代 ECC 硬盘在 MTBF 窗口内误码率可系统性地低于 10^-14,使得 N 次读取后零错误在工程上**常态发生**而非例外。这不是"罕见事件需要大 N 才能排除",而是工程现实。但这是被消化——文件 (c) 已注册 N 的要求。
    - 猎捕 3(抄写域):中世纪 monastic scriptoria 抄写的《圣经》保真度极高——抄写错误率 < 0.5% 且被严格校对机制压制。这暴露过度伸张:文件 (b) 要求"任意一种在等效条件下未观测到衰减",但历史抄写在有校对条件下确实可低衰减——这取决于"等效条件"是否包含校对机制。

    **DED-004/007 复发**:DED-007(测量轴焊死)有轻微风险——"衰减"作为因变量在三种方法中并非异源,但文件已明确"度量单位不可通约、不要求定量收敛",规避了焊死指控。DED-004(不可证伪循环)未复发。
  red_flags: |
    1. brick=conclusion: 部分命中。三种方法的"独立"未与 AXIOM-002 的机制论证做可分离切割——若共享同一驱动量(人类记忆/物理信道噪声),则是同因三表征而非三独立验证。但这不是 fatal,因为文件确实引入了经验测量框架(方法论桥),有 brick 之外的新增内容。
    2. 逐格判空: 未命中。核心预测"三种方法均衰减而非零衰减/增强"是经验主张,非同义反复。
    3. 测量轴正交(DED-007): 命中轻微风险。文件已声明"度量单位不可通约",规避了焊死指控,但三种方法的"衰减方向"作为因变量仍是同源(均为信息丢失)——这本身不算焊死(因为预测是"均衰减",而非"衰减速率收敛")。
    4. 射程/排除钩子: 未命中。射程限定(不覆盖图像/音频、不预设常数)已注册。
    5. 分类判据档位匹配: 命中致命。falsifiability (a) 的"准确回忆比例"未限定测量层级(字面 vs 语义 vs 核心结构),按不同档位会得出相反结论。
    6. anti-talisman 真兑现: 部分命中。证伪条件 (b) 要求"无法通过实验设计差异解释"——这给作者留了后门,但作为桥接砖(非核心推论)可接受。
    7. 现实锚事实核查: 未命中。引用的 Bartlett/Mesoudi/Shannon/Hamming/Landauer/手抄本谱系学均为真实存在的领域与作者。
    8. 条件是下定义还是做预测: 未命中。"均观测到衰减"是可证伪的经验预测。
    9. 枚举穷尽 + species 按判据定义: 命中致命。"三种独立方法"的"独立"未定义——若共享驱动量则不独立,退化为同因三表征。
    10. primary_suspect: 文件未自认弱腿。我指认的真正软肋是#5(档位不匹配)和#9(独立未定义)。
    11. 口径完整注册: 命中致命。falsifiability (a) 缺分子/分母/测量口径注册,见 DED-005/006 死因。
    12. 数据源同根冒充多源独立: 命中潜在。Bartlett/Mesoudi/Kalish 的口传实验系列是否共享同一实验范式传统?是——但这是方法论连续性,不是数据源同根(各自独立招募被试、独立评分)。
    13. API 可及性冒充认识论独立性: 未命中。
    14. 反向失败模式缺失: 命中。"信息增强"模式已被 falsifiability (a) 覆盖,反向失败模式(信息保真度反而提高)已注册。
    15. Bootstrap 限定缺失: 未命中。本推论不涉及新技术介导,不需要 Bootstrap 限定。
    16. 验证对象存在性未标注: 未命中。三种方法的验证对象(口传序列、手抄本、数字存储)均大量存在。
  counterexample_hunt: |
    猎捕 1 — 口传"幽灵战斗机"再生(Bartlett 1932):许多被试再生版本保留了"战士在异乡遇到超自然力量"的核心叙事结构,字面级衰减但语义级增强。这暴露 falsifiability (a) 的档位歧义——按"语义保真"判可能不衰减。**结果:被消化(衰减确实发生在字面级),但揭出过度伸张——(a) 未限定测量层级。**

    猎捕 2 — 现代 ECC 存储:企业级 SSD 在 MTBF 窗口内 BER < 10^-14,连续读取后零错误是常态而非例外。**结果:被消化——文件 (c) 已要求 N 大到使零错误概率 < 0.01,工程参数可注册。**

    猎捕 3 — 中世纪 monastic scriptoria:《圣经》抄写错误率 < 0.5% 且通过严格校对(correctoria)压制衰减。**结果:揭出过度伸张——(b) 要求"等效条件下"未观测到衰减,但"等效条件"是否包含校对机制未注册,若不含则历史抄写可轻松低衰减,触发证伪。**

    猎捕 4 — 数字水印与纠错编码的"主动冗余"反例:数字系统可通过主动冗余(RAID、ECC、纠错码)将有效衰减降至任意低。**结果:被消化——文件 (c) 已限定"指定冗余率"下的原始误码率,主动冗余属不同测量对象。**

    **总猎捕结论**:净杀 = 0;被消化 = 3;揭出过度伸张 = 2(均指向证伪条件的口径/档位注册缺失)。
  required_fixes:
    - "1. falsifiability (a) 必须注册\"准确回忆比例\"的测量层级(字面级 vs 语义级 vs 核心结构级),并预注册主要判定档位——否则任何实验都可被作者按对自己有利的档位重判。"
    - "2. \"三种独立方法\"的\"独立\"必须给出可事前测的判据(共享/不共享底层驱动量的判定标准),否则该声称退化为同义反复。"
    - "3. falsifiability (b) 的\"等效条件\"必须预注册是否包含校对/纠错等主动保真机制,否则中世纪 monastic 抄写可触发证伪。"
  oneline: |
    核心直觉(信息在复制中衰减、三种方法可测)成立,但证伪条件的测量档位与"独立"定义均未预注册——两个 required 缺陷挡住 verified。

round_3:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 3, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制成立(信息在三种渠道均衰减,这是稳健现象),但仍有3条required级缺陷挡住verified:
    (1) 红旗#2命中——三种方法的"独立"判据虽注册了(底层驱动量不同),但实际测量对象严重重叠(都是"信息保真度"在传递链上的衰减),所谓"不可通约"是字面意义上的单位不可比,不是测量对象的正交性——这与DED-007的测量轴焊死问题有同源风险;
    (2) 红旗#11命中——falsifiability(a)中"字面级回忆"测量层级虽已预注册,但"实验前须预注册主要判定档位"这条元规则没有绑定到具体的档位值(如字面匹配比例阈值具体是多少),存在事后口径选择漏洞;
    (3) 红旗#4命中——falsifiability(b)中"等效条件指除驱动机制外的实验参数一致"过于宽松,口传实验无法做"不含校对机制"的等效条件测试(人类记忆本身就有内隐复述/重编码,可视为天然校对),这让(b)条件在实践中不可触发。
    反例猎捕未净杀,但揭出一条过度伸张:作者声称"三种方法互相验证",但实际上三者测量的是不同的信息载体(口头语言/手写文字/数字比特),其"衰减"机制的物理基础不同(认知衰退/手部误差/热噪声),不是"同一现象的三种独立测量",而是"同一抽象概念(信息保真度)在三个不同物理域的表现"——这削弱了"互相验证"的力度,应改为"三种方法在各自域内一致地展示衰减,但跨域不可定量比较,仅构成定性会聚"。
  red_flags: |
    1. brick=conclusion — 未命中。核心主张(信息在传递中衰减)在AXIOM-002(信息熵增)中已有砖支撑,BR-L2-046的增量在于"三种方法可测量且定性会聚",这是经验层面的新贡献,不是砖=结论。
    2. 逐格判空 — 部分命中。核心预测"三种方法均测得衰减"是真经验主张,不是同义反复;但"互相验证"的声称过强,实际是"三个独立域各自观测到衰减",不是同一现象的多源验证(见反例猎捕)。
    3. 测量轴正交 — 未命中致命但有软伤。三种方法的被预测量("信息保真度衰减")虽载体不同,但抽象层级一致(都是"原始信息与再现信息的差异度"),不算焊死;但驱动量独立性的注册(底层驱动机制不同)是充分的。
    4. 射程/排除钩子独立于结果 — 命中。falsifiability(b)中"等效条件"未排除口传实验中的天然认知校对(人类记忆的重编码/复述),这使得"不含校对机制"的等效条件在认知实验中不可执行,削弱了(b)的可触发性。
    5. 分类判据档位匹配 — 未命中。连续量(衰减速率)的判定通过"观测到衰减(非零/非增强)"的定性档位处理,与不可通约的度量单位匹配。
    6. anti-talisman真兑现 — 未命中致命。判定前件(衰减存在)不由结果反推;三个承重锚(口传/抄写/数字)各自有独立文献支撑(Bartlett 1932, Shannon 1948, 手抄本谱系学),不依赖本推论的自证。
    7. 现实锚事实核查 — 未命中。引用的文献基础属实(Bartlett系列再生、Shannon信道容量、Hamming纠错码、Landauer擦除下限均为真实工作)。
    8. 条件是下定义还是做预测 — 未命中。"三种方法均测得衰减"是可证伪预测,不是定义性真。
    9. 枚举穷尽+species按判据定义 — 命中(软)。声称"三种独立方法",但理论上存在第四种(如模拟信号传输中的衰减——电话线/无线电传播),作者用"不声称覆盖所有信息类型"来排除,这等于事后开脱;应改为"本框架聚焦于人类认知/书写/数字三类核心载体,其他载体的衰减规律需独立检验"。
    10. primary_suspect指对 — 未命中。作者自认的弱点(度量单位不可通约)确实是主要弱点之一,但"互相验证"的过度伸张更致命,作者未充分识别。
    11. 口径完整注册+歧义反向裁决 — 命中(软)。falsifiability(a)要求"字面匹配比例阈值"预注册,但文件未给出具体阈值(如<0.8算衰减?);若实验结果在0.7-0.9之间,作者可事后选择阈值救推论,这是L4-009判例的同型风险。
    12. 数据源同根冒充多源独立 — 未命中。三种方法引用的文献基础确实是独立研究传统(认知实验/信息论/档案学),非同根数据源。
    13. API可及性冒充认识论独立性 — 未命中。不涉及API数据获取问题。
    14. 反向失败模式缺失 — 命中(软)。文件未注册"信息衰减的反向失败模式":如冗余/纠错码可系统性地将数字衰减压制到任意低(通过增加冗余率),这意味着"数字域衰减"的存在性依赖于"未超过纠错能力的噪声水平"这一隐含条件;若不在限制条件中注册,推论在"高冗余数字系统"语境下会被反向证伪。
    15. Bootstrap限定缺失 — 未命中。本推论不涉及冷启动/稳态区分。
    16. 验证对象存在性未标注 — 未命中。三种方法都有大量已有实验/数据支持,验证对象不存在空集问题。
  counterexample_hunt: |
    构造反例1:数字存储系统的衰减。
    现代ECC内存(如ECC RAM)在典型工作负载下,实测误码率可低至10^-18量级(Linux mcelog日志、谷歌Loongson等研究),且通过增加冗余率(如RAID-6、纠删码)可将可观测错误率压制到任意低。若按falsifiability(c)的字面理解("实测原始误码率系统性地为零"),则现代高可靠性数字存储系统已"观测到零衰减",应触发证伪。
    处理:被falsifiability(c)的限制条件("指定的冗余率、介质类型和比特数")部分消化——但作者未明确"指定"的基准是什么,若事后选择高冗余系统来反驳"零衰减"指控,则(c)不可触发。这构成红旗#11的口径漏洞,而非净杀。

    构造反例2:口传实验的衰减是否存在?
    Bartlett(1932)的战争幽灵实验显示的不仅是"衰减",还有显著的内容变形与趋同(故事向群体共享版本收敛)。Mesoudi等人的实验也显示"迭代学习"条件下信息损失可被部分补偿。这表明口传衰减不是单调的,而是与传递条件(有无反馈、有无群体规范)耦合的。若作者的"衰减"声称未限定传递条件(单向下行 vs 有反馈迭代),则过度伸张。
    处理:被statement中的"在复制、存储、传输过程中"部分覆盖,但应注册"单向下行传递"作为基准条件。

    构造反例3:手抄本的衰减是否可分离?
    手抄本谱系学的错误累计模型假设抄写者独立工作且无对照原本,但实际上中世纪修道院的抄写常伴随"对照原本校对"(scriptorium的exemplar校对流程),这与口传实验中的"无校对"形成结构性差异——手抄本衰减的测量实际上"含校对",与口传实验不可直接类比为"独立测量"。
    处理:被statement中"抄写依赖人为书写误差与校对机制"承认(差异本身就是声明的一部分),但这削弱了"三种方法独立"的力度——因为"含校对"的手抄本衰减与"不含校对"的口传衰减,测量的是不同条件下的现象。

    结论:无净杀,但揭出一条过度伸张("互相验证"应弱化为"各自域内一致观测+定性会聚")和两条口径漏洞(#11阈值未注册、#14反向失败模式未注册)。
  required_fixes:
    - "1) 将\"三种方法互相验证\"改为\"三种方法在各自物理域内各自独立地观测到信息衰减趋势,构成定性会聚(qualitative convergence),而非定量互验\",并在statement中明确\"跨域不可比较衰减速率,仅在'衰减存在 vs 不存在'这一二元判断上达成一致\"。"
    - "2) 在falsifiability(a)中预注册具体的字面匹配比例阈值(如\"连续5代以上字面匹配比例不下降\"的判定标准中,定义\"不下降\"为斜率≥0且p<0.05;或在基线衰减模型下,第5代预期保真度下限的95%CI上界高于第1代),消除事后口径选择空间。"
    - "3) 在falsifiability(b)的\"等效条件\"中注册:口传实验中的\"天然认知校对\"(复述/重编码)视为隐含校对机制,故口传实验的等效条件应明确为\"无外部反馈/无迭代修正/单向下行传递\",与手抄本的\"无exemplar校对\"形成结构性对称。"
    - "4) 在statement的限制条件中新增:数字域衰减的成立依赖于\"未超过纠错能力的噪声水平\"这一隐含前提;若冗余率足够高使实测误码率低于阈值,数字域可呈现\"零衰减\",这不构成对推论的证伪而是推论适用边界的限定。"
    - "5) (可选should)将\"三种方法\"改为\"三种代表性方法\",并在限制条件中承认模拟信号传输、生物遗传信息传递等可能构成第四/第五种独立测量渠道,其衰减规律需独立检验。"
  oneline: |
    核心机制稳健,三轮修复已堵住大部分漏洞,但"互相验证"的过度伸张、口径预注册不全、数字域反向失败模式未注册三条required缺陷仍挡verified——定向修订可救。

round_4:
  reviewer: "独立对抗审查者 MiniMax-M3 (round 4, 异血统, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心机制（信息在三类载体中均衰减）站得住，三轮修复也确实把前几轮的硬伤补得差不多了——定性会聚而非定量互验的收敛声称避免了方法间数值不可比却被强行比较的问题；预注册的字面匹配阈值和口传等效条件的限定把 anti-talisman 漏洞堵住了；数字域隐含前提的承认处理了边界条件。

    但仍卡在两个 required 级缺陷上，未达 verified：

    1. **"三种方法独立"的定义本身有焊点**（红旗 6+红旗 3）。文件自称三种方法的"主要底层驱动量不同"——口传=人类记忆与认知重复；抄写=人为书写误差与校对机制；数字=物理噪声与纠错码。但"主要"一词无判据——若有人指出"记忆的神经突触层面也是物理噪声"或"数字存储的位翻转本质上也受认知/操作因素影响（如人为配置错误）"，作者只能用"主要"二字挡，但"主要"在哪个交叉点上不再主要？该定义未注册。这是 brick 自身的测量轴定义在主要性边界上的松动，会被反例猎捕用边界案例（"认知与物理噪声的交叉域"，如人操作硬盘导致位翻转+读出错误的链条）击中。

    2. **falsifiability(b) 的"等效条件"自相矛盾**（红旗 3+红旗 6）。文件说三种方法独立观测到衰减构成定性会聚；又要求"在等效条件下"才算证伪。但跨域"等效条件"无可能——口传、抄写、数字的物理域完全不同，"除驱动机制外的实验参数一致"本身没有共同坐标系。文件没注册：当三种方法在任何一组实验参数下都给出非衰减结果时，哪一域的零衰减算作对整体推论的证伪？还是三域都需同时零衰减？这等于把证伪阈值设在了一个作者无法事先指定的位置——是 L4-009 判例中"事后口径救推论"的复发风险（红旗 11）。

    反例猎捕：我构造了三个候选反例——
    - 反例 A（口头-物理边界）：人耳语音经蓝牙耳机转发到手机存储再回放——这条链条横跨口传域与数字域。实测发现：廉价蓝牙在拥挤 2.4GHz 下丢包率可忽略（纠错后零错误），而人耳记忆在 5 句话后衰减约 30%。结论：被消化为"这是两个不同域的串联，不是单一域测量"——但这恰恰暴露了"等效条件"在跨域复合时无定义。
    - 反例 B（抄写的认知渗透）：古登堡印刷前的僧侣抄写中，抄写员会基于"理解"进行"无意校对"（把不认识的词改成认识的同义词）。这意味着抄写域的"无 exemplar 校对"在实际历史上几乎不存在——认知校对渗入了抄写域，使口传与抄写的"驱动量不同"主张被挑战。
    - 反例 C（数字域的零衰减常态化）：ECC LPDDR5 在服务器温度稳定时，UBER（不可纠正位错误率）<10^-18，长期读取可视为零衰减。这符合文件承认的"未超过纠错能力"的隐含前提，但暴露了：当代数字存储的常态本身就是"零衰减"，与文件"数字域衰减趋势"的核心声称有张力。文件通过把前提条件前置化解了——但这把数字域的实际适用范围几乎掏空，只剩"超出纠错能力"这一狭窄场景。

    反例 B 是真正的净杀信号：它直接攻击"口传 vs 抄写驱动量不同"这一独立性基础。文件若要保住，需注册"理解性改写不算校对"或承认口传与抄写在认知渗透维度上不独立。这超出 round 3 的修复范围，属于核心独立性的松动——required 级。

    未重蹈 DED-004（不可证伪循环）：收敛声明已从定量改为定性二元判断，避免了循环。
    未重蹈 DED-007（测量轴焊死）：测量层级已预注册字面匹配而非意义匹配，分母为第 1 代基线。
    但接近 L4-009 判例的"事后口径"风险：证伪条件(b)中"等效条件"的口径未预注册完整。
