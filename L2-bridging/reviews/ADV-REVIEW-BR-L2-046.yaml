    - "4) 在 statement 末段明示：当代 ECC 充裕场景下数字域常态为零衰减，\"数字域衰减趋势\"声称的适用场景限于\"超出纠错能力\"或\"无纠错系统\"的特定条件——避免读者误以为推论声称数字存储普遍衰减。"
