    14. 反向失败模式缺失 — 部分命中：作者承认数字域"零衰减"为边界限定，但未注册"在纠错能力充裕的常态下，数字域就是零衰减"这一反向失败模式如何与"数字域衰减趋势"声称调和。
    15. Bootstrap 限定缺失 — 未命中：本推论不涉及冷启动/稳态区分。
    16. 验证对象存在性未标注 — 未命中：三类测量对象在现实世界中均存在且可观测。
  counterexample_hunt: |
    构造了三个候选反例：
    - 反例 A（口传-数字串联链）：被消化为两个不同域的串联，但暴露跨域等效条件无定义。
    - 反例 B（抄写中的认知渗透 / 净杀信号）：古登堡前僧侣抄写中"理解性改写"普遍存在，使抄写域不可能纯化为"无认知校对"——攻击了口传与抄写"驱动量不同"的独立性基础。判定：揭出过度伸张，文件需注册"理解性改写不算校对"或承认认知渗透维度上的依赖性。
    - 反例 C（数字域零衰减常态化）：被文件隐含前提（"未超过纠错能力"）消化，但暴露数字域核心声称在当代实践中实际掏空。
  required_fixes:
    - "1) 在 statement 的独立性定义中注册\"主要\"的判定阈值——例如：若两域的驱动量在同一物理过程中相互渗透（如认知改写渗入抄写、神经噪声渗入认知记忆），即使各自\"主要\"驱动量不同，仍判定为非独立。或缩小声称：仅声称\"认知-神经-物理三层中，三种方法各占一层，构成跨层独立性\"以避免主要性边界的滑动。"
    - "2) falsifiability(b) 预注册跨域\"等效条件\"的具体判定口径：明确规定三域零衰减是否需同时满足、还是任一域零衰减即触发证伪、以及\"等效条件\"在反例出现后不得事后调校。"
