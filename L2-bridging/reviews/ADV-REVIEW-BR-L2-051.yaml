id: ADV-REVIEW-BR-L2-051
type: adversarial_review
reviews: BR-L2-051
layer: L2-bridging
target: BR-L2-051
target_term: "公平偏好的跨文化差异性"
rounds: 1

人话摘要: |
  对 BR-L2-051(公平偏好的跨文化差异性——公平偏好差异源于文化定义而非二元关怀差异,
  市场整合度与最后通牒出价/拒绝阈值正相关)的 round_1 独立对抗审查。
  裁 needs_revision:核心主张(Henrich et al. 跨文化实验数据显示市场整合度与最后通牒
  博弈出价正相关)有坚实的经验基础,证伪条件逻辑上可触发,测量轴未焊死。但三条 required
  缺陷阻止 verified:(1)YAML 无 cross_verification 节,IEA=1.3 低于 verified 门槛
  1.8,无法进入 verified 流程;(2)IEA 独立性不诚实——behavioral_economics 和
  cultural_anthropology 两源共享 Henrich 同一研究纲领(同团队/同数据/同框架),
  有效独立性可能低于报告的 0.3;(3)机制中间变量"文化的公平定义"缺乏独立测量,
  falsifiability(c)依赖的关系模型→博弈行为映射是事后推测而非前定验证。
  反例猎捕四个方向上未获净杀,但发现:市场整合非必要(Lamalera 合作狩猎产生同等
  公平出价)、群体内变异(美/德/日同属高市场整合但出价不同)机制未解释、Gnau 超公平
  出价被拒暴露"更高出价=更公平"的隐含假设。这些不推翻核心主张但揭示机制规范过度。

round_1:
  reviewer: independent-adversarial-reviewer
  date: 2026-07-16
  verdict: needs_revision
  verdict_note: |
    BR-L2-051 的核心主张——公平偏好的跨文化差异源于"什么是公平"的文化定义差异,
    且市场整合度与最后通牒博弈中的出价水平正相关——有 Henrich et al.(2001,2010)
    对 15 个小型社会的系统性跨文化实验数据支撑。该研究是行为经济学中被广泛引用和
    复制的发现之一。证伪条件(a)(b)(d)逻辑上可触发,命题具有真实经验风险。

    但三条 required 级缺陷阻止 verified 裁决:

    1.【IEA cross_verification 缺失 + IEA 分数不足——REQUIRED】
    桥接砖 YAML 不含 cross_verification 节。IEA 调查(iea_survey.py,zhipu 独立血统)
    计算结果:IEA = behavioral_economics 1.0(锚源) + cultural_anthropology 0.3
    (coeff=0.6×0.5) = 1.3。此分数:
    - >= 1.2(weakly_verified 下限):满足
    - < 1.8(verified 门槛):不满足
    因此本桥接砖在当前证据生态下无法达到 verified 状态。补全 cross_verification
    为 required——见 required_fixes #1。

    2.【IEA 独立性不诚实:两源共享同一研究纲领——REQUIRED】
    本桥接砖引用的两个"独立"来源——behavioral_economics 和 cultural_anthropology——
    在 Henrich et al.的研究纲领处高度收敛。具体证据:
    (i) behavioral_economics 的 rationale 引用了 Henrich et al.(2001,2010)的跨文化实验;
    (ii) cultural_anthropology 的 rationale 引用了 Henrich et al.(2005)的 WEIRD
    批评——同一个 Henrich,同一个研究团队,同一批 15 个小型社会数据,同一个理论框架
    (文化演化+行为实验)。
    (iii) Henrich 本人就是横跨这两个学科的学者(他的人类学博士+行为经济学研究),
    他的研究纲领系统地融合了两者——这意味着"两个学科都说同一件事"不是独立验证,
    而是同一研究纲领在两种期刊/学科标签下的双面发布。

    当前 iea_survey.py 给出的 effective independence 0.3(coeff=0.6×0.5)实际上
    可能【高估】了真实独立性。0.6 是 source_pairs 的 default_independence(建模
    的是学科间理论重叠),0.5 的折扣来自仪器相关性(单一 LLM 执行)。但这两源在
    Henrich 处的收敛是【更深的】——不是"两个学科范式在理论上重叠",而是"两个来源
    的支撑数据来自同一个人、同一批实验、同一个理论框架"。这是数据层面的同源,
    比学科层面的重叠更严重。

    按 independence-model.yaml 的 instrument_correlation discount_rule:
    "当 L2 桥接命题的 cross_verification 投票由单一 LLM 执行时,必须披露报告的
    IEA 是'学科独立性'上限,'仪器有效独立性'低于此"。本桥接砖的情况比这更严重——
    连"学科独立性上限"都因为两源在 Henrich 处的收敛而被高估。

    修复方向:
    (i) 在 cross_verification 中诚实标注:两源共享 Henrich(2001,2005,2010)
    为共同数据/理论核心,有效独立性可能低于 0.3;
    (ii) 引入真正独立于 Henrich 研究纲领的第三源——如发展心理学中儿童公平偏好的
    跨文化研究(Blake et al.2015, Nature),或神经经济学中公平感知的跨文化 fMRI
    研究。这些源不使用 Henrich 的 15 社会数据,测量链独立分叉。
    (iii) 若无法引入第三独立源,诚实标注:IEA=1.3 反映的是"一个研究纲领(以
    Henrich 为核心)的学科内一致性,而非跨独立研究纲领的收敛验证"。此时桥接砖
    的适当状态是 weakly_verified 而非 verified。

    3.【中间变量测量缺口:"文化的公平定义"缺乏独立于结果的操作化——REQUIRED】
    桥接砖的因果链是:市场整合度 → 文化的公平定义(匿名交易中的等值交换习惯 →
    投射到实验情境) → 最后通牒博弈出价/拒绝阈值。问题在中间变量:
    "文化的公平定义"在桥接砖的当前版本中【不是】被独立测量的。它被从同一批实验
    数据(最后通牒博弈结果)中反向推断,或从并非为此目的设计的民族志资料中事后
    提取。

    Falsifiability(c)试图通过 Fiske(1992)的关系模型类型作为"公平定义"的独立
    代理:"发现某个文化中'公平'的定义与当地关系模型类型不匹配,且最后通牒博弈
    行为与关系模型预测相反→证伪。"但这一路径存在两个问题:
    (i) Fiske 的关系模型(communal sharing / authority ranking / equality
    matching / market pricing)是描述一般社会关系的分类框架,不是专为预测最后
    通牒博弈行为设计的。从"该文化属于权威排序型"推断"该文化中最后通牒出价应
    较低"这个映射本身就需要经验验证(即——本身就是一条待检验的桥接命题)。
    (ii) 关系模型类型的判定(某文化主要属于哪种模型)在人类学中是一个解释性
    判断而非机械编码,存在跨观察者歧义。用"需要解释性判断的变量"去独立验证
    另一条也需要解释的命题,构成认知回路。

    这不是 DED-007 级别的测量轴焊死(自变量不由因变量定义,两者在概念上可分离)。
    但它是"机制承诺超出测量能力"的诚实性问题:桥接砖声称了一个因果机制(市场
    整合→通过改变'公平的定义'→影响博弈行为),但其中间环节在操作上是推测性的。
    机制的经验信用主要来自"市场整合与博弈行为的统计关联"这一直接相关,而非
    来自"文化公平定义确实中介了这一关联"的独立证据。

    修复方向:
    (i) 诚实降级因果声称:从"市场整合通过文化公平定义驱动博弈行为"降为"市场
    整合与博弈行为存在统计关联,文化公平定义是当前最 plausible 的中介机制但
    未被独立验证";
    (ii) 或者:引用独立测量了"文化公平定义"的研究——如使用 vignette 实验
    (不依赖博弈行为的独立场景判断)测量不同文化中"什么是公平分配"的判定标准,
    然后将此独立测量与最后通牒博弈行为做相关。

    4.【反例猎捕揭示的机制过度规范——should 级附加缺陷】
    反例猎捕四个方向(见 counterexample_hunt 节)发现:
    (i) Lamalera(印尼捕鲸社群):高市场整合度外的另一路径(合作狩猎规范)→同等
    公平出价,说明市场整合是产生公平出价的充分非必要条件。
    (ii) Gnau(巴布亚新几内亚):超公平出价(>50%)被拒,说明"更高出价=更公平"
    的映射不是跨文化普适的——某些文化中接受过高出价意味着承担不对等义务。
    (iii) 同属高市场整合的社会(美/德/日)之间出价仍有显著差异,桥接砖的机制
    无法解释群体内变异。
    (iv) 市场整合度的增加(如后苏联国家 1990 年代市场化改革)是否伴随最后通牒
    出价变化,缺乏纵向追踪证据。桥接砖的因果主张预测市场整合度上升应伴随出价
    上升,但此预测未经验证。

    这些不构成净杀(每一案例均可被桥接砖的"文化定义多样性"框架消化),但揭示:
    桥接砖的 statement 将市场整合与公平出价的关系表述得比现有证据支持的更紧密、
    更单向。实际上存在多条通往公平出价的路径,市场整合只是其中一条;且市场整合
    的效应大小可能被其他文化因素(个人主义-集体主义、宗教传统、制度信任等)调节。

    5.【测量口径未预注册——should 级附加缺陷】
    Statement 中的关键变量缺乏预注册的操作化:
    (i) "市场整合度"——Henrich et al. 使用了多个指标(市场采购的饮食比例/
    距市场距离/市场交易频率),不同指标的相关性不同。桥接砖未指定使用的是哪个
    (复合)指标。
    (ii) "50-50出价"——是均值还是众数?是否加权了 stake size?
    (iii) "拒绝阈值"——是 MAO(minimum acceptable offer)的均值?还是 50%拒绝
    概率对应的出价?
    虽然这些操作化可从引用文献中获取,但按 L4-009 判例精神,桥接砖应在见新数据前
    锁定操作化定义,防止事后口径选择。

  red_flags:
    brick_is_conclusion:
      hit: false
      detail: |
        BR-L2-051 的核心机制(市场整合→匿名交换习惯→最后通牒博弈中的平等出价)
        不是任何 L1 定义/公理/定理的重述。

        L1 覆盖度评估:
        - CONCEPT-fairness:定义公平为分配规范(非必然平等),不等于"市场整合
        塑造公平偏好"——后者是具体的经验主张。
        - CONCEPT-exchange:自愿交换使双方获益,不涉及交换习惯如何塑造公平规范。
        - CONCEPT-value:主观价值归因,不涉及跨文化公平偏好差异。
        - THEOREM-exchange-competition-alternative:交换替代竞争的条件,不涉及
        交换对公平规范的二级效应。
        - AXIOM-003(重复交互→规范涌现):规范可从重复交互中涌现,但不特指
        "市场交换→平等分配规范"这一特定路径。AXIOM-003 的逻辑允许多种规范方向
        (合作狩猎→按贡献分配、亲属网络→按需要分配等),桥接砖的"市场→平等"
        是众多可能规范方向中的一种具体选择,不是从公理必然推出的。

        与已有 verified 桥接砖的区分:
        - BR-L2-013(不公平厌恶):跨物种/跨发展的不利不公平厌恶存在性——不涉及
        文化差异。
        - BR-L2-017(分配规范随语境切换):同一文化内,不同关系语境切换分配标准
        ——这是 within-culture 的语境效应,不是 between-culture 的市场整合效应。
        - BR-L2-020(道德领域多样性):不同文化道德化不同领域——涉及跨文化差异
        但未指定市场整合作为驱动因素。
        - BR-L2-051 的非平凡增量:将跨文化公平偏好差异锚定到特定的、可测量的
        社会结构变量(市场整合度),并提出了一个具体的因果机制(匿名交换习惯→
        实验情境投射)。这些都不是已有实体的逻辑重述——已有实体只说了"公平会因
        文化/语境而不同"(BR-L2-017, BR-L2-020),051 说的是"这种不同在什么
        维度上、由什么驱动"。

        一个反向测试:能否想象一个"市场整合度与最后通牒出价无关或负相关"的世界
        且不与任何 L1 概念矛盾?能——CONCEPT-exchange 只要求交换是自愿的、双方
        都获益,不要求交换导致平等主义分配规范。在一个"市场高度整合但主流文化
        赞美精明交易(如'买低卖高是美德')"的世界里,最后通牒出价可能低于 50-50
        但低出价可能不被拒绝(因为"接受任何正报价才是理性的")——这与所有 L1
        概念均可兼容。因此 BR-L2-051 的"正相关"预测是一条承受经验风险的声称,
        不是被 L1 预定的结论。

    empty_cell_tautology:
      hit: false
      detail: |
        核心空格预测:如果市场整合度不驱动公平偏好差异,则应观测到:
        (a) 非市场整合社会与市场整合社会的最后通牒出价/拒绝阈值无系统性差异;
        (b) 在市场整合社会内部,出价水平与市场整合度不存在正相关。

        这是可观察的经验预测。在逻辑上,"所有文化中最后通牒出价均接近 50-50"
        的世界与 L1 概念/公理均不矛盾——如演化心理学可能预测"公平偏好是人类
        普适心理模块,跨文化表现一致"。因此否定桥接砖的空格预测是一个有经验
        风险的主张,不是同义反复。

    measurement_axis_orthogonality:
      hit: true
      detail: |
        本红旗在"should"级别部分命中——自变量(市场整合度)与因变量(最后通牒博弈
        行为)在测量链上独立,但因果链的中间变量("文化的公平定义")缺乏独立测量。

        【IV-DV 测量链独立——不焊死】
        市场整合度的测量(民族志观察:市场采购饮食比例/距市场距离/交易频率)与
        最后通牒博弈行为的测量(标准化实验:出价金额/接受/拒绝决策)使用完全不同的
        测量链。前者是人类学田野方法,后者是行为实验方法。不存在分母偷用结果、
        自变量由因变量定义等 DED-007 式死罪。

        【中间变量的测量缺口——本红旗命中的实质】
        桥接砖的因果主张是"市场整合 → [cultural definition of fairness as
        equivalent exchange] → 博弈行为"。方括号内的中间变量未被独立测量。
        当前证据生态支持的是"市场整合与博弈行为存在统计关联"这一直接相关,
        而非"文化公平定义中介了这一关联"这一更强的因果主张。

        中介检验需要:
        (i) 独立测量"文化的公平定义"(不依赖同一批博弈实验数据);
        (ii) 验证公平定义在市场整合与博弈行为之间的中介效应(如 Sobel test
        或 bootstrapping mediation)。

        当前 falsifiability(c) 试图用 Fiske 的关系模型作为"公平定义"的独立
        代理,但关系模型→博弈行为预测的映射本身是待验证的(见 verdict_note #3)。

        裁定:should 级(非 required)。理由:核心主张(市场整合与博弈行为存在
        正相关)可被直接检验而不依赖中间变量的独立测量;中间变量测量缺口降低的
        是机制宣称的置信度,而非核心预测的可证伪性。这不是 DED-007 级的结构死罪
        (IV/DV 未焊死,且中间变量在概念上可独立测量),但桥接砖应诚实标注当前
        证据只支持"相关"而不完全支持"因果中介"。

    scope_exclusion_independent:
      hit: false
      detail: |
        桥接砖注册了两个限制:
        (i)"不声称市场社会比非市场社会'更公平'"——规范判断排除,非射程排除。
        (ii)"不声称公平偏好的心理基础(对不公平的厌恶)存在跨文化差异"——这是
        射程排除(文化差异在触发条件而非心理基础),按可事前测的渠道划定。
        两个均不构成事后逃逸口。

    classification_granularity:
      hit: false
      detail: |
        市场整合度被处理为连续变量(程度),最后通牒出价也为连续变量。未做
        不必要的粗暴二分化。档位匹配适当。

    anti_talisman:
      hit: false
      detail: |
        四条 falsifiability 条件逐条分析:

        (a)"在某个非市场整合、非世界宗教参与的社会中,观察到与市场整合社会
        同样高的 50-50 出价和低拒绝阈值"
        → 可操作。找到一个满足条件的社会并运行最后通牒博弈即可。这是最干净
        的证伪路径——单一反例即可推翻"市场整合是 50-50 出价的必要条件"。

        (b)"在高度市场整合的社会中,发现提议者出价与市场整合度呈负相关,或
        拒绝阈值与市场整合度无显著相关"
        → 可操作。使用现有数据(多国最后通牒博弈元分析)即可检验。"无显著相关"
        需预注册显著性水平和效应量阈值,但逻辑上可触发。

        (c)"通过文化人类学田野调查,发现某个文化中'公平'的定义与当地关系模型
        类型不匹配,且该文化中最后通牒博弈行为与关系模型预测相反"
        → 可操作但测量链不独立(见 measurement_axis_orthogonality 和 verdict_note
        #3)。问题不在逻辑结构(非护身符),而在中间变量的操作化需要额外工作。

        (d)"在严格控制实验条件后,发现所有文化中触发不公平厌恶的阈值完全一致
        (即无文化差异)"
        → 可操作。虽然"所有文化"的穷尽测试在实践上不可能,但如果在 30+ 个
        最大化多样性(maximally diverse)的文化中发现完全一致的阈值,这构成
        对"存在文化差异"主张的强力挑战。"完全一致"需预注册容差带(如效应量
        d < 0.2 且 95% CI 不跨零)。

        总结:四条条件均非 anti-talisman 护身符。触发它们不需要循环依赖命题
        本身的验证结果。条件(c)有操作化挑战(见 #3),但挑战在测量而非逻辑结构
        ——事前约定好关系模型→博弈行为的映射规则后,(c)可被触发。这与
        BR-L2-045 的 "任何未控制的第三变量可完全解释"(逻辑上永远不可触发)
        有本质区别。

    reality_anchor_fact_check:
      hit: false
      detail: |
        引用文献事实核查:

        (1) Henrich et al.(2001)——"In Search of Homo Economicus: Behavioral
        Experiments in 15 Small-Scale Societies",发表于 American Economic Review
        (2001,91(2):73-78)。这是行为经济学/人类学交叉领域引用量最高的论文之一
        (5000+ citations)。对 15 个小型社会(包括 Machiguenga、Lamalera、Orma
        等)进行了最后通牒博弈、公共物品博弈和独裁者博弈实验。核心发现:提议者
        出价和回应者拒绝阈值与市场整合度和世界宗教参与正相关。发表属实,发现
        可靠。

        (2) Henrich et al.(2010)——"Markets, Religion, Community Size, and the
        Evolution of Fairness and Punishment",发表于 Science(2010,327:1480-1484)。
        扩展了 2001 年的分析,增加了更多社会和更系统的统计建模。核心结论与 2001
        一致。发表属实,发现可靠。

        (3) Güth et al.(1982)——"An experimental analysis of ultimatum bargaining",
        发表于 Journal of Economic Behavior & Organization(1982,3(4):367-388)。
        首次提出最后通牒博弈范式。发表属实,是该领域奠基文献。

        (4) Fehr & Schmidt(1999)——"A theory of fairness, competition, and
        cooperation",发表于 Quarterly Journal of Economics(1999,114(3):817-868)。
        提出不公平厌恶模型(inequity aversion model)。发表属实,10,000+ 引用。

        (5) Fiske(1992)——"The four elementary forms of sociality: Framework
        for a unified theory of social relations",发表于 Psychological Review
        (1992,99(4):689-723)。提出关系模型理论(communal sharing/authority
        ranking/equality matching/market pricing)。发表属实,人类学/社会心理学
        核心引用。

        (6) Henrich et al.(2005)——"The weirdest people in the world?",发表
        于 Behavioral and Brain Sciences(2010,33(2-3):61-83)。注意:桥接砖
        写的是 2005——实际 BBS 发表年是 2010(Working paper 版本可追溯到 2005
        左右)。文献存在且主题对口(WEIRD 被试问题),年份标注有小误(working paper
        vs 正式发表)。不影响实质可信度,但建议修正为 2010(或标注"2010,working
        paper circulated since ~2005")。

        总体评价:所有引用文献存在且核心发现属实。Henrich et al.的发现是行为科学
        中被广泛复制和引用的事实锚点。年份小误(Henrich 2005→2010)不改变引用的
        实质正确性。不存在虚构引用或核心事实扭曲。

    definition_vs_prediction:
      hit: false
      detail: |
        "市场整合度与最后通牒出价正相关"是可证伪的经验预测。在逻辑上自洽的
        替代可能世界:
        (i) 市场整合→"市场心態"(精明自利最大化)→低出价但也被接受(因为在
        市场文化中"任何正报价都是理性接受")——这与所有 L1 概念兼容;
        (ii) 市场整合不影响出价水平,出价由其他因素(如亲属结构/合作狩猎需求/
        资源可预测性)独立驱动——同样与 L1 兼容。
        (iii) 市场整合与出价负相关(市场越发达,出价越低,因为"市场教会人自利
        最大化")——同样可兼容。

        因此命题是经验选择而非定义。"市场整合度更高的社会更习惯等值交换"不是
        "市场整合度"的定义的一部分,也不是"等值交换"的定义——它是一个有真值
        条件的社会学假设。

    enumeration_exhaustiveness:
      hit: false
      detail: |
        桥接砖未声称对"公平偏好差异的驱动因素"做穷尽枚举。它提出了市场整合度
        和世界宗教参与作为两个具体驱动因素,但未声称这是唯一因素。不触发红旗 9。

    primary_suspect_accuracy:
      hit: false
      detail: |
        L2 桥接砖无 formal primary_suspect 字段(L3 要求),按红旗精神外部分析
        最弱腿:

        (i)【IEA 独立性——最致命】两源在 Henrich 研究纲领处的收敛使 IEA=1.3
        的实际独立票数可能更低(有效独立系数<0.3)。这是阻止 verified 的最硬
        障碍。见 required_fixes #2。

        (ii)【机制归因 vs 相关——第二致命】桥接砖声称了因果机制(市场整合→
        文化公平定义→博弈行为)但证据主要支持的是统计关联(市场整合与博弈行为
        相关)。中间变量的独立测量缺失。见 verdict_note #3。

        (iii)【群体内变异未解释——中等脆弱】美/德/日同属高市场整合但出价不同,
        桥接砖的当前机制无法区分或预测这些群体内差异。这限制了机制的解释力
        范围(只能解释 between-category 差异,不能解释 within-category 差异)。

        (iv)【市场整合的操作化未锁定——中等脆弱】Henrich et al. 使用了多个
        市场整合指标,不同指标与博弈行为的相关性不同。桥接砖未指定使用哪个
        指标。见 should_fixes。

    caliber_registration:
      hit: true
      detail: |
        本红旗在 should 级别命中——关键测量口径未在桥接砖自身文本中预注册。

        (1)【"市场整合度"的操作化——should】
        Henrich et al. 使用了多个市场整合指标:市场采购占饮食比例/距最近市场
        的距离/市场交易频率。不同指标与最后通牒博弈行为的相关性大小不同
        (如市场采购饮食比例与出价的相关性 r≈0.4-0.6,取决于具体模型规格)。
        桥接砖的 statement 只说"市场整合度"而未指定是哪个(复合)指标。
        按 L4-009 判例精神:若在反例出现后桥接砖试图在不同指标间切换以维持
        预测,此切换按不利于命题的方向裁决。建议桥接砖在 statement 中预注册
        使用的市场整合指标及其加权方式。

        (2)【"50-50出价"的操作化——should】
        是均值还是众数?是否排除 extreme stakes 实验?是否考虑 stake size
        的调节效应(Henrich et al. 发现当 stake size 较大时,出价更接近 50-50)?
        桥接砖当前用"50-50"作为方便的描述性标签,但测量的精度要求(均值在
        45%-50% 还是恰好 50%?)未注册。

        (3)【"拒绝阈值"的操作化——should】
        "拒绝阈值"可以被定义为:最低可接受出价(MAO)的均值/中位数/使拒绝概率
        达 50% 的出价水平。不同定义可能导致不同的跨文化比较结果。

        虽然这些操作化细节可从引用的源文献中获取,但按体系口径注册要求,
        桥接砖应在自身 YAML 中预注册关键操作化,避免事后在多个合理定义中
        选择性使用对命题最有利的那个。

    data_source_common_root:
      hit: false
      detail: |
        本红旗建模的是"不同机构发布同一底层数据"(如 WB/IMF 均引用 CNBS 的 GDP)。
        本桥接砖不涉及宏观经济统计数据,两个来源(behavioral_economics 和
        cultural_anthropology)不触发 data_source_origin 折扣。

        但需注意:虽然不触发本红旗,两源在 Henrich 处的收敛构成了另一种形式的
        "同源"问题——不是"多个机构发布同一份数据",而是"两个学科引用同一个
        研究纲领的同一批数据"。此问题在 IEA 独立性检查(verdict_note #2)中
        详细处理。

    api_pretending_independence:
      hit: false
      detail: |
        桥接砖不通过 API/MCP 获取数据。不触发本红旗。

    reverse_failure_mode:
      hit: false
      detail: |
        桥接砖的正向预测:市场整合度 ↑ → 最后通牒出价 ↑ / 拒绝阈值 ↓。
        反向失败模式:市场整合度 ↑ → 出价 ↓ / 拒绝阈值 ↑,通过"市场心態"
        (市场教会自利最大化→更低出价被认为合理)机制。

        此反向模式在逻辑上可能(见 definition_vs_prediction),但需注意:
        (i) 它与桥接砖的机制(匿名交易→等值交换习惯)不是同一机制的反转,
        而是【竞争性机制】(market mentality vs equivalent exchange norm)。
        也就是说,桥接砖的正向机制和反向机制不是同一机制在不同条件下的
        方向反转——它们是两个不同的因果通道。
        (ii) 在竞争性机制的情况下,"反向失败模式"红旗的适用性需要仔细判断。
        如果桥接砖声称"市场整合通过等值交换习惯机制驱动出价上升",那么存在
        竞争性机制(如市场心态→出价下降)并不构成正向机制的"反向失败"——
        它只是说"可能存在另一个机制朝相反方向拉"。正向机制仍然可以成立
        (两种机制可以同时运作,净效应取决于两者的相对强度)。

        裁定:不命中。桥接砖的机制是单向的(市场→等值交换习惯→更高出价),
        其逻辑结构不隐含"市场整合在某些条件下导致更低出价"的对称反向。
        竞争性机制的存在不影响桥接砖机制的有效性声明。但桥接砖应在
        statement 中诚实标注:市场整合可能通过多个渠道影响公平偏好(等值交换
        习惯是其中之一),不同渠道的效应方向可能不同,净效应取决于各渠道的
        相对强度。

    bootstrap_limitation:
      hit: false
      detail: |
        不涉及新技术介导社会形态的命题。不触发本红旗。

        但有一个弱相关的限定缺失:桥接砖未区分"传统社会的初始市场整合水平"与
        "社会经历市场化转型期间的市场整合变化"。Henrich et al. 的数据是横截面
        (cross-sectional)比较——比较了不同市场整合水平的社会在同一时间点的
        博弈行为。但桥接砖的因果主张隐含了纵向(within-society over time)预测:
        如果一个社会的市场整合度上升,其最后通牒出价也应上升。这一纵向预测
        未被独立验证。后苏联国家 1990 年代的市场化改革提供了一个自然实验机会,
        但据我所知,缺乏系统性的市场化前后最后通牒博弈纵向比较数据。

    verification_object_existence:
      hit: false
      detail: |
        桥接砖的验证对象(不同市场整合水平的社会中的最后通牒博弈行为)是存在的
        且已被研究。Henrich et al. 的 15 个社会提供了从近乎自给自足的觅食社会
        到高度市场整合社会的完整梯度。验证对象不是空集。

        反例验证对象也存在:可以寻找一个市场整合度低但出价高的社会(如 Lamalera)
        或市场整合度高但出价低的社会。这些在原则上可观测。

  iea_independence_check:
    cross_verification_present: false
    iea_score: 1.3
    iea_threshold_verified: 1.8
    iea_threshold_weakly: 1.2
    note: |
      IEA 调查(iea_survey.py,zhipu glm-4-flash 独立血统)计算:
      - 锚源 behavioral_economics:1.0
      - cultural_anthropology:coeff=0.6(default_independence)×0.5=0.3,加权票=0.3
      - 总 IEA = 1.3
      - >= 1.2(weakly_verified 下限):满足
      - < 1.8(verified 门槛):不满足

      关键独立性顾虑——两源在 Henrich 研究纲领处共享核心:

      1.【共享数据与理论框架】
      - behavioral_economics rationale 引用:Henrich et al.(2001,2010)跨文化实验
      - cultural_anthropology rationale 引用:Henrich et al.(2005)WEIRD 批评
      - 同一个 Henrich,同一个团队,同一批 15 社会数据,同一个文化演化理论框架
      - Henrich 本人跨 behavioral economics 和 anthropology 两学科,他的研究
      纲领系统性融合两者

      2.【有效独立性可能低于 0.3】
      当前 0.3 的计算(default_independence 0.6 × 仪器折扣 0.5)建模的是:
      - 学科间的理论重叠(0.6 折)
      - 单一 LLM 的语料重叠(0.5 折)
      但未建模"两源的数据和理论核心来自同一研究纲领"这一更深层的重叠。
      这不是"两个独立学科从不同角度验证同一现象"——这是一个学科交叉研究
      纲领从两个学科标签下发表同一套发现。

      3.【与 data_source_origin 的类比】
      虽然不触发 data_source_origin 红旗(那建模的是统计机构间的同源发布),
      但结构类似:两个"来源"对同一命题的一致性来自共享底层数据/理论,
      而非独立验证链。"Henrich et al. 2001"在 behavioral_economics rationale
      和 cultural_anthropology rationale 中均出现,这相当于"同一份数据
      在两个学科标签下被引用了两次"——不是两票独立确认。

      4.【修复路径】
      (i) 诚实标注:当前 IEA=1.3 反映的是"以 Henrich 为核心的学科交叉
      研究纲领的内部一致性",有效独立票数可能 < 1.3。
      (ii) 引入真正独立的第三源:如发展心理学中儿童公平偏好的跨文化研究
      (Blake et al. 2015 Nature——使用不同被试群体/不同实验范式/不同
      研究团队)或神经经济学中公平感知的 fMRI 跨文化比较。这些源的测量链
      与 Henrich 的 15 社会实验独立分叉。
      (iii) 若无第三独立源,桥接砖的适当状态为 weakly_verified(1.3>=1.2)
      而非 verified(1.3<1.8)。

    instrument_honesty:
      disclosed: false
      assessment: |
        桥接砖当前无 instrument_disclosure 字段(无 cross_verification 节)。
        independence-model.yaml 的 instrument_correlation discount_rule 要求:
        "当 L2 桥接命题的 cross_verification 投票由单一 LLM 执行时,必须披露
        报告的 IEA 是'学科独立性'上限,'仪器有效独立性'低于此。"

        本桥接砖的 IEA 调查由 zhipu glm-4-flash(单一 LLM)执行,因此仪器折扣
        适用。补全 cross_verification 时必须包含 instrument_disclosure。

    no_data_source_common_root:
      applicable: true
      detail: |
        不触发 data_source_origin 折扣。两源均为学术文献而非宏观经济统计指标。
        但参见上方关于"两源共享 Henrich 研究纲领"的独立性顾虑(结构类似但
        机制不同——是学术纲领层面的收敛而非机构间的数据同源)。

  counterexample_hunt:
    methodology: |
      四个反例方向:(1)市场整合低但出价高——挑战"市场整合是必要驱动因素";
      (2)市场整合高但出价低——挑战正相关的普遍性;(3)"更多=更公平"的映射
      跨文化失效——挑战因变量解释;(4)市场整合的同文化历时变化与出价变化
      的关系缺失——挑战因果方向。以 Henrich et al. 数据中的边界案例+其他
      跨文化研究文献中的已知反例模式为主。
    cases:
    - direction: "Lamalera 捕鲸社群:非市场路径产生公平出价"
      description: |
        Lamalera(印尼 Lembata 岛)是 Henrich et al.(2001)15 个社会之一。
        这是一个以集体捕鲸为主要生计的社群,市场整合度较低(大部分食物来自
        自给而非市场购买)。但在最后通牒博弈中,Lamalera 的平均出价高达约 58%
        ——甚至高于许多高度市场整合的西方社会。

        Henrich et al. 自己的解释:Lamalera 的集体捕鲸需要大规模合作,猎物的
        分配遵循严格的公平分享规范(每人的份额根据其在捕猎中的角色预先约定)。
        这种合作狩猎产生的公平分享规范,投射到实验情境中,产生了高 50-50 出价。

        此案例的含义:市场整合不是产生公平出价的必要条件。合作狩猎(或其他
        需要大规模公平分享的生计方式)可以达到同样效果。桥接砖的机制(市场
        整合→等值交换习惯)是充分非必要条件。
      counter_impact: "揭出必要性强度的过度声称——非净杀"
      analysis: |
        不净杀桥接砖,因为桥接砖的 falsifiability(a)已经注册了这种可能性:
        "在非市场整合社会中观察到高 50-50 出价"会证伪——但 Lamalera 案例
        出现后,桥接砖可以通过"该社会有其他产生平等规范的生计方式(合作狩猎)"
        来解释。这不算 falsifiability(a)的"触发"——因为 Lamalera 的高出价
        仍然是通过"文化定义(合作分享规范)→博弈行为"的路径产生的,与桥接砖
        的"文化定义是驱动因素"这一最核心主张一致。

        但此案例揭示:桥接砖的 statement 将"市场整合"作为文化定义的代理变量
        来强调,而实际上"文化公平定义"可以有多个独立来源(市场交换/合作狩猎/
        灌溉农业/宗教教义等)。桥接砖应更诚实地表述为:"市场整合度是影响
        文化公平定义的重要(但非唯一)结构性因素",而非暗示市场整合是主要或
        排他性驱动因素。

    - direction: "Gnau 超公平出价被拒:'更多=更公平'的跨文化失效"
      description: |
        Gnau(巴布亚新几内亚)在 Henrich et al. 的实验中出现了一个著名异常:
        某些提议者给出了超过 50% 的出价(如 60-70%),但这些超公平出价被拒绝
        了。拒绝的理由(根据民族志解释):接受一份过大的礼物意味着承担一份不对等
        的回报义务——在一个以互惠交换为核心的社会中,接受者不愿被绑定在这种
        不对等的关系中。

        此案例的含义:"更高出价=更公平"的映射不是跨文化普适的。在某些文化中,
        接受过高出价不是"赚了"而是"背上了还不清的债"。这直接支持了桥接砖的
        核心主张(文化定义"什么是公平"),但同时揭示:桥接砖隐含的"高市场整合→
        高 50-50 出价→高公平"这一链条中,"高 50-50 出价=高公平"的等式本身
        是文化特定的(culture-specific)。
      counter_impact: "揭出因变量解释的文化依赖性——非净杀"
      analysis: |
        不净杀而强烈支持桥接砖的核心主张(文化定义决定公平感知)。但揭示:
        "50-50出价"作为"公平"的代理变量在市场整合社会之外可能不成立。
        桥接砖应标注:将"出价水平"作为"公平偏好强度"的度量,依赖一个隐含
        假设(更高出价 = 更公平 = 更高公平偏好),这个假设本身可能受文化调节。

    - direction: "高市场整合社会之间的出价变异:美/德/日比较"
      description: |
        美国、德国、日本均属高度市场整合的工业化社会。但元分析(Oosterbeek
        et al. 2004, Experimental Economics)显示三国的平均最后通牒出价存在
        差异:美国约 40-45%,德国约 37-44%,日本约 40-45%(具体数值因实验设计
        而异)。更重要的是,这些差异在不同研究中相对稳定——日本在某些研究中
        出价甚至低于美国,尽管两者市场整合度相似。

        桥接砖的机制(市场整合→等值交换习惯→50-50 出价)无法解释这些群体内
        (within-category)差异。如果市场整合度是主要的驱动因素,那么所有高度
        市场整合的社会应该收敛到相似的出价水平——但数据显示并非如此。
      counter_impact: "揭出机制的解释范围局限——非净杀"
      analysis: |
        不净杀:桥接砖可以主张市场整合度解释了 between-category 差异(市场社会
        vs 非市场社会),而 within-category 差异需要其他文化因素(如个人主义-
        集体主义/信任水平/宗教传统)来解释。但这意味着桥接砖的机制解释力是
        有限的——它在"市场 vs 非市场"的最粗粒度上成立,但在更细的粒度上失效。

        建议桥接砖注册此解释力边界:"本机制在区分高市场整合 vs 低市场整合
        社会的粗粒度差异上成立;在高度市场整合社会之间的细粒度差异上,需要
        额外的文化维度来解释。"

    - direction: "后苏联市场化自然实验:纵向因果证据缺失"
      description: |
        桥接砖隐含了一个纵向(within-society over time)因果预测:如果一个社会
        的市场整合度上升,其最后通牒出价也应上升。后苏联国家(俄罗斯、波兰、
        捷克等)在 1990 年代经历了快速市场化改革,提供了一个自然实验机会。

        据我所知,缺乏系统性的"市场化前后最后通牒博弈行为纵向比较"的数据。
        这本身不是反例(只是证据缺失),但它暴露了桥接砖因果主张的一个未验证
        维度:当前所有证据都是横截面(cross-sectional)相关,而非纵向因果验证。
        横截面相关不能排除"第三方变量同时驱动市场整合和公平偏好"的可能性
        (如殖民历史/制度遗产/宗教传统等)。
      counter_impact: "揭出因果证据层级局限——非净杀"
      analysis: |
        不净杀(证据缺失不等于反例),但揭示:桥接砖的因果语言("市场整合度更高
        的社会更习惯等值交换,并将这一模式投射到实验情境中")暗示了纵向因果
        过程,而当前证据生态仅支持横截面统计关联。这是因果声称与证据层级之间
        的不匹配。桥接砖应标注"当前证据为横截面相关,纵向因果验证待完成"。

    overall_counterexample_verdict: |
      四个方向上未获净杀反例:
      (1)Lamalera:揭出市场整合非必要(合作狩猎是替代路径);
      (2)Gnau:揭出"更高出价=更公平"的文化依赖性,支持了桥接砖核心主张但
      暴露出价作为公平代理变量的隐含假设;
      (3)美/德/日群体内变异:揭出机制在 within-category 粒度的解释力局限;
      (4)后苏联自然实验:揭出纵向因果证据缺失,当前仅横截面相关。

      未出现满足以下全部条件的净杀案例:
      (i)属于桥接砖的声称域(非市场整合、非世界宗教参与的社会);
      (ii)该社会不具备任何替代性平等规范来源(无合作狩猎/灌溉农业/平等主义
      宗教教义等);
      (iii)该社会的最后通牒出价仍接近 50-50 且拒绝阈值低;
      (iv)该结果不能用测量误差或实验设计偏差解释。

      实际上,条件(ii)的验证极其困难——几乎任何人类社会都有某种形式的合作
      活动,而合作活动的分配规范可能独立于市场整合产生公平出价。这本身构成
      对 falsifiability(a) 证伪力的一种温和挑战:即使发现了一个"非市场但高
      出价"的社会,桥接砖可以(合理地)辩称该社会有其他产生平等规范的机制——
      因为桥接砖的核心主张是"文化定义驱动博弈行为",而文化定义可以有多种
      来源。

      反例猎捕的主要贡献:
      (1)精确识别了"市场整合"与"文化公平定义"之间的概念间距:市场整合是
      文化公平定义的充分非必要条件,桥接砖的 statement 应更精确地反映这一点;
      (2)暴露了"出价水平"作为"公平偏好强度"代理的文化依赖性;
      (3)确认了横截面相关 vs 纵向因果之间的证据层级不匹配;
      (4)确认了 within-category 变异作为未解释方差的诚实边界。

  non_recurrence:
    - check: DED-004
      status: pass
      detail: |
        DED-004 的死因是不可证伪循环——命题的核心主张无法被任何经验观测拒绝
        (因为其断言是"信息外化不对称蕴含",而外化本身就是其所声称的模式)。
        BR-L2-051 无此问题:证伪条件(a)(b)(d)均可被具体经验观测触发,命题
        具有真实的经验风险。falsifiability(c)有操作化挑战但逻辑结构可触发,
        与 DED-004 的免疫结构不在同一类别。

    - check: DED-007
      status: pass
      detail: |
        DED-007 的死因是测量轴焊死——分母偷用实际结果(用"实际获授者"定义
        授信对象,闭环)。BR-L2-051 无此问题:自变量(市场整合度)通过人类学
        田野方法独立测量,因变量(最后通牒博弈行为)通过标准化行为实验独立
        测量。两者测量链不共享任何操作化组件。

        中间变量("文化公平定义")有测量缺口(见 verdict_note #3),但这不是
        自变量-因变量闭环——是机制声称超出了当前测量能力,而非测量本身
        存在逻辑循环。

  required_fixes:
    - id: REQ-BR-L2-051-A
      severity: required
      what: |
        补充 cross_verification 节——进行正式的 IEA 独立来源加权投票,
        并诚实标注独立性限制。

        结构要求:
        (i) 列出各来源的 vote(agree/disagree/partial,with rationale)。
        behavioral_economics 应投票给"跨文化实验数据显示市场整合度与
        最后通牒博弈行为正相关"(统计关联);cultural_anthropology 应投票给
        "文化定义(关系模型)是公平偏好跨文化差异的框架性解释"。

        (ii) 应用 independence-model.yaml 的系数计算 IEA。注意:当前
        behavioral_economics 和 cultural_anthropology 两源在 Henrich 研究
        纲领处高度收敛(共享数据/团队/框架),default_independence=0.6 可能
        高估有效独立性。建议在 cross_verification 中诚实下调有效独立系数
        (<=0.3),并在 footnote 中说明"两源共享 Henrich et al.(2001,2005,2010)
        为共同数据/理论核心,报告的有效独立性是考虑到此收敛后的估计"。

        (iii) 包含 instrument_disclosure——引用 META-REVIEW-001 的
        instrument_correlation discount_rule,诚实标注"本次投票由单一 LLM
        执行,有效独立性低于报告的学科独立性上限"。

        (iv) 标注当前 IEA=1.3 满足 weakly_verified(>=1.2)但不满足
        verified(>=1.8)。若无法引入真正独立于 Henrich 研究纲领的第三源,
        桥接砖的适当状态为 weakly_verified。

        (v) 分维度标注投票内容:区分"投票给统计关联的存在"(两个源都投)
        和"投票给因果机制的独立验证"(中间变量未独立测量,两源均不能独立
        投给因果机制)。

        (vi) 计算有效 IEA,与 verified 门槛(1.8)和 weakly_verified 下限(1.2)
        对照。
      rationale: |
        L2 桥接砖的验证必须通过 IEA 加权投票。当前 YAML 无 cross_verification 节,
        桥接砖无法进入任何已验证状态。IEA=1.3 仅达 weakly_verified 下限,距
        verified 门槛(1.8)差 0.5。此差距需要额外独立来源来弥合。

    - id: REQ-BR-L2-051-B
      severity: required
      what: |
        诚实标注"文化的公平定义"这一中间变量的测量缺口。

        在 statement 末尾添加 honest caveat:
        "诚实标注:本桥接砖声称了市场整合→文化公平定义(匿名交易等值交换习惯)
        →最后通牒博弈行为的因果链,但当前证据生态直接支持的是市场整合与博弈
        行为之间的统计关联(Henrich et al. 2001,2010 的横截面相关)。中间变量
        '文化的公平定义'的独立测量(不依赖于同一批博弈实验数据)以及其在市场
        整合与博弈行为之间的中介效应,尚未被独立验证。因此,本桥接砖当前在
        '统计关联'层面成立;在'因果中介机制'层面,属于当前最 plausible 的
        理论解释,但尚未被独立经验确证。"

        或者,降级因果声称:将 statement 中的"这一现象的解释是:市场整合度高的
        社会更习惯匿名交易中的等值交换,并将这一模式投射到实验情境中"改为
        "这一现象的当前最 plausible 解释是:市场整合度高的社会更习惯匿名交易
        中的等值交换,并将这一模式投射到实验情境中(注意:此中介机制尚未被
        独立验证;当前证据支持的是统计关联而非因果中介)。"

        并将 falsifiability(c)的操作化前定:明确"关系模型类型→博弈行为预测"
        的映射规则是什么。例如:"若某文化被 Fiske(1992)框架独立判定为以
        authority ranking 为主要关系模型,则预测其最后通牒出价显著低于 market
        pricing 主导的文化。"
        此映射规则须在见新数据前锁定,防止事后调整。
      rationale: |
        当前桥接砖的 statement 使用了因果语言("习惯...并将这一模式投射"),
        但证据生态仅支持统计关联。机制承诺超出测量能力是诚实性问题——不是
        命题不成立,而是命题的语言比可验证的内容更"强"。将此标注为 required
        是因为:不修正此不匹配,桥接砖会以"因果机制已验证"的姿态进入体系,
        而实际的证据支持只到"统计关联"层面。

    - id: REQ-BR-L2-051-C
      severity: required
      what: |
        在 statement 中注册机制的充分非必要性和 within-category 解释力边界。

        在 statement 中添加:
        "范围限定:(i)市场整合是产生等值交换公平规范的充分非必要条件——
        其他生计方式(如大规模合作狩猎/灌溉农业/平等主义宗教实践)可独立
        产生类似的公平分享规范;(ii)本机制主要解释高市场整合 vs 低市场整合
        社会之间的粗粒度(between-category)差异,对高度市场整合社会之间的
        细粒度(within-category)差异(如美/德/日之间的出价变异),需要额外的
        文化维度(个人主义-集体主义/制度信任/宗教传统)来解释;(iii)当前
        证据为横截面(cross-sectional)统计关联;本机制隐含的纵向预测
        (市场整合度随时间上升→出价上升)尚未被纵向数据独立验证。"
      rationale: |
        反例猎捕系统性地揭示了桥接砖机制的三重边界:(1)市场整合非必要——
        Lamalera 合作狩猎产生同等出价;(2)within-category 变异未解释——
        美/德/日出价不同;(3)纵向因果未验证——缺乏市场化前后的博弈行为
        纵向数据。注册这些边界不削弱核心主张(核心主张在限定范围内仍成立),
        但使桥接砖的经验声称与其证据生态精确对齐,防止读者从当前表述中
        过度推断机制的解释力范围。

  should_fixes:
    - id: SHOULD-BR-L2-051-D
      severity: should
      what: |
        预注册关键变量的操作化定义。在 statement 或新增的 operationalization
        节中:
        (i)"市场整合度"的操作化——指定使用 Henrich et al. 的哪个(复合)指标,
        或诚实标注"市场整合度的不同操作化(市场采购饮食比例/距市场距离/
        交易频率)与最后通牒出价的相关性可能不同,本桥接砖以 Henrich et al.
        的复合市场整合度指标为准"。
        (ii)"出价"的操作化——说清楚是"均值"还是"控制了 stake size 后的
        标准化均值"。
        (iii)"拒绝阈值"的操作化——说清楚是"最低可接受出价(MAO)的均值"
        还是"50%拒绝概率对应的出价"。
        (iv) 按 L4-009 判例精神:"若在反例出现后桥接砖试图在上述操作化之间
        切换以维持预测,此切换按不利于命题的方向裁决。"

    - id: SHOULD-BR-L2-051-E
      severity: should
      what: |
        修正 Henrich et al.(2005)的文献引用年份。当前 YAML 写的是"Henrich
        et al. (2005)",但"THE WEIRDest people in the world?"的正式发表为
        Behavioral and Brain Sciences (2010)。建议改为"Henrich et al. (2010,
        working paper circulated since ~2005)"或直接改为"Henrich et al. (2010)",
        以免给事实核查者造成误导。

    - id: SHOULD-BR-L2-051-F
      severity: should
      what: |
        在 statement 中诚实标注"更高出价=更公平"这一隐含假设的文化依赖性。
        Gnau 案例表明:在某些文化中,接受过高出价意味着承担不对等义务,因此
        拒绝超公平出价是理性的。将"出价水平"作为"公平偏好强度"的代理依赖于
        一个隐含假设(更高出价=更偏好公平=更高公平偏好),此假设本身受文化调节。
        桥接砖应标注此局限性。

    - id: SHOULD-BR-L2-051-G
      severity: should
      what: |
        考虑在 bridges_to 中增加 CONCEPT-norm(规范)或 THEOREM-competition-norm
        (竞争规范化定理)。
        当前 bridges_to 含 CONCEPT-fairness/CONCEPT-exchange/CONCEPT-value,
        但桥接砖的核心主张是"公平作为一种规范,其定义受市场交换实践的影响"。
        CONCEPT-norm 的定义强调了"规范 = 共享的行为默契 + 违反会被制裁",
        这与桥接砖描述的"公平规范"的概念基础直接对应。增加此连接可使
        桥接砖的 L1 锚点更完整(从"公平/交换/价值"三个被规范塑造的领域
        扩展到"规范本身的形成机制")。
