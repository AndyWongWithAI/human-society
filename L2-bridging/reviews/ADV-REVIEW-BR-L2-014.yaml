id: ADV-REVIEW-BR-L2-014
type: adversarial_review
reviews: BR-L2-014
layer: L2-bridging

人话摘要: |
  对 BR-L2-014(代价第三方惩罚)的 round-1 独立对抗审查。判 needs_revision:
  第三方惩罚现象本身(Fehr & Gächter 2002, Henrich 15 社会)证据极稳,
  IEA 算术正确且仪器折扣如实披露,lab 层面的测量轴正交——这些不是失败点。
  但有两条 required 级缺陷:①反证伪条款里的"间接(声誉贬损/未来合作撤回)"
  使命题在田野里变成不可证伪的护身符——任何社交疏远都能被编码为"间接惩罚",
  活反例无法被识别;②"关键执行机制"的"关键"二字过强,第三方惩罚是执行
  机制之一,但不是唯一的,多个竞争机制(内化规范/互惠/流言排斥/超自然制裁/
  出走分裂/调解)的相对因果权重未建立。另附 borderline 提醒:本砖与
  THEOREM-moral-third-party-enforcement 的概念距离极薄,主要是经验证据汇编,
  非新颖概念桥接。

target: BR-L2-014
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与写砖者及 IEA 调查员无关)。
  L3 评分卡通用红旗 11 条 + L2 专属 5 条(brick=conclusion / 测量轴正交 /
  anti-talisman / IEA 独立性诚实含单 LLM 折扣 / 反例猎捕必做)。
  默认怀疑,宁可错杀不放水。方法论 > 任何单条命题。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新独立上下文, 与写砖者及 IEA 调查员无关)"
  verdict: needs_revision
  verdict_note: |
    本砖的经验内核真实且稳健:在受控实验室条件下(Fehr & Gächter 2002 公共品博弈
    带惩罚;Fehr & Fischbacher 2004 第三方惩罚博弈;Henrich et al. 2006 跨 15 社会
    复现),非受害旁观者确实愿付真金白银惩罚针对陌生人的不公行为,且此行为被演化
    博弈论模型(Gintis/Bowles/Boyd 的强互惠)机制性地解释,被民族志田野(Boehm 1999
    反向支配层级;Wiessner 2005 昆桑羞辱仪式)方向性地锚定。IEA=2.0 算术正确,
    仪器折扣(单 LLM 执行)在 verdict_note 如实披露,符合 instrument_correlation.
    discount_rule。Lab 层面的自变量(实验设计的支付结构/博弈规则)与被观测量(被试
    花费金钱惩罚)异源正交——测量轴无焊点。

    但本砖在从 lab 推向"人类"普遍命题的过程中,留下了两条 required 级缺陷:

    【Required ① — anti-talisman 未兑现:证伪条款的"间接惩罚"沦为护身符】
    falsifiability 的(c)条定义"惩罚"涵盖"既无直接的(抗议/排斥/冲突),也无间接的
    (声誉贬损/未来合作撤回)"。这个"间接的"二字使证伪条款在田野条件中几乎不可
    操作:在任何人类社会里,违规者被其他人冷落/回避/不合作是一个过于普遍的现象,
    且无法区分冷落是"第三方为了维护规范而设的惩罚"还是"个体自保性的趋利避害"。
    二者的观测等价且动机不可独立识别。于是只要有人在回避违规者(或仅仅是与违规者
    打交道更少),砖就能编码为"间接第三方惩罚"并声称被确认——活反例不存在不是因为
    命题对,而是因为证伪窗口被"间接"铰链焊出了逃生门。

    这并非要求砖放弃"间接惩罚"这个概念——间接惩罚(声誉、撤回合作)是真实的社会
    动力学。问题在于 falsifiability(c) 把直接和间接打包成一个"不出现任何即证伪"
    的复合条件,而间接部分的观测门槛实际上为零。修法:二选一——
    (i) 拆分 falsifiability 为两条独立路径:直接惩罚路径(抗议/排斥/冲突,有明确的
    行为编码——如公开指责、驱逐、物理对峙)与间接惩罚路径(声誉贬损/合作撤回,须
    事前注册编码规程——如"合作率与违规者交互的显著下降、须与基线比较、须排除
    自保性回避"),两者各自独立可证伪。
    (ii) 把 falsifiability 限定为直接惩罚,将"间接惩罚"从证伪条件中移除,转为
    statement 中一个独立的、未经验化的子命题(或降为注释)。

    【Required ② — "关键执行机制"是过度宣称,缺乏竞争机制排除】
    statement 断言第三方惩罚是公平规范在无中心权威群体中得以维持的"关键执行机制"。
    文献中至少有六个竞争/互补的规范维持机制——
    (1) 内化规范(CONCEPT-morality 的内化维度,违规引发内疚——不需要第三方旁观);
    (2) 双边互惠(你对我好我对你好,不需要第三方);
    (3) 流言与声誉网络(信息共享降低违规者的未来合作机会——这更接近"间接惩罚"
        但与"掏钱罚人"的代价惩罚不是同一件事);
    (4) 超自然制裁信仰(相信违规会遭天谴/祖先惩罚——低成本但有效的威慑,不需要
        人类第三方);
    (5) 出走/分裂(fission-fusion——不满的个体或亚群体干脆离开,规范通过成员的
        自选维持,非惩罚);
    (6) 调解(仲裁者/长老/仪式化冲突解决——不惩罚,而是修复)。
    本砖引用的证据(Fehr & Gächter lab + Boehm 田野 + Bowles & Gintis 模型)建立
    了第三方惩罚的存在性与重要性,但没有通过排除以上竞争机制来确立"关键的"一级。
    "关键"若要成立,需要至少展示:在控制其他机制的条件下,移除第三方惩罚会使规范
    瓦解——这类证据目前不存在(即使 Fehr & Gächter 的公共品博弈有"无惩罚"对照组,
    这只能说明惩罚在【该博弈设置】中重要,不能推广为"关键执行机制")。
    修法:把"关键执行机制"降格为"重要执行机制之一"或"在实验和田野中被反复
    观察到的核心执行机制",并诚实标注竞争机制的存在。

    满足以上两条 required 后可达 verified。IEA 独立性在 2.0 vs 1.8 阈值之间
    只有 0.2 边距,但考虑到本命题的多实验室+跨文化稳固复现,仪器忧虑被显著缓解,
    不与 required 叠加。

    附加一项 should 级提醒与本砖的定位相关:本砖与 THEOREM-moral-third-party-
    enforcement 的概念距离极薄——定理已经推导出"扩散利益+惩罚有效→第三方惩罚",
    砖主要提供的是经验证据(Fehr lab + Henrich 跨文化 + Boehm 田野)汇编。
    砖的非平凡经验增添是"这件事在真实人类群体中确实发生了(且以这些特定范式
    被测量)"——这是一个真实的桥接功能,但其分析与定理共享核心结构。如果读者
    读了 THEOREM-moral-third-party-enforcement 后再读本砖,新增的概念装备不多。
    建议在 bricks_field 或注释中诚实标注这一关系,让架构图上不产生本砖与定理
    各自"独立贡献重量相当"的错觉。

    反例猎捕(见下)未猎到 scope 内的干净活反例净杀核心,但猎捕结果恰恰暴露了
    Required① 的护身符结构——不是无猎获=命题完美,而是间接惩罚的宽口径使反例
    无立锥之地。此结构性缺陷必须修复。
  red_flag_findings:
    brick_conclusion: |
      【borderline——未命中 required,但发警告】。
      BR-L2-014 试图桥接 CONCEPT-fairness(d)的"代价执行"到"第三方惩罚"的可观测行为。
      CONCEPT-fairness(d)说:违反公平标准会激发代价行动(惩罚/抗议/退出/withhold)。
      THEOREM-moral-third-party-enforcement 说:当扩散利益+惩罚有效时,旁观者系统
      性地愿付代价惩罚违规者。本砖说:第三方代价惩罚在事实上跨文化存在,是公平规范
      在无中心权威群体中的关键执行机制。

      砖的经验内核——跨实验室+跨文化的第三方惩罚观测——不是 CONCEPT-fairness(d)
      的近义改写。概念定义说"会激发代价行动",未说"是第三方还是受害方自己"。
      砖的独特经验增添=第三方(非受害):Fehr & Fischbacher 2004 的第三方惩罚博弈
      中的旁观者 A 无利害关系但仍付费罚 B。CONCEPT-fairness(d) 和 THEOREM-moral-
      third-party-enforcement 的组合已覆盖了"第三方惩罚"的 why,砖覆盖的是 that
      (实证观测)。这是 thin but real 的桥接——不到 required 缺陷层,但厚度值得
      标记为 should 级提醒(verdict_note 尾已含)。
    measurement_axis_orthogonal: |
      【攻不穿——正交】。在 lab 层面:自变量=实验者设定的博弈结构/支付规则/规范
      (外生),被观测量=被试花费金钱惩罚(行为测量)。二者异源——支付结构由实验
      设计定,惩罚由被试的按键/分配决策测,前件不由结果反推。在田野层面:自变量=
      民族志/访谈所识别的共享规范内容,被观测量=第三方惩罚行为(排斥、羞辱、放逐
      等)——田野识别的规范(P)与惩罚(Q)在方法论上需要独立收集(参与观察+访谈可
      独立于制裁行为),但田野操作中 P 的识别有时已依赖 Q 的观察(见 anti-talisman
      红旗)。整体判断:测量轴在受控条件中正交,在田野中可正交但需操作规程,无隐藏
      焊点——本红旗不命中 required。
    anti_talisman: |
      【命中——required,见 Required①】。
      问题不在 lab(lab 中的自变量=实验结构+支付矩阵完全外生、被观测量=金钱惩罚
      行为可计数,前件不可由结果反推——此处的 anti-talisman 守住了),而在砖自己写
      的 falsifiability 条款把"间接惩罚(声誉贬损/未来合作撤回)"塞进了证伪条件(c)。

      为什么这是护身符:
      (i) "声誉贬损"和"未来合作撤回"几乎是任何人类社会里违规者必然面对的社会
      后果——不是因为第三方有意识地"惩罚",而是因为违规行为改变了其他人对违规者
      的贝叶斯更新(预期可靠性下降),于是自发地减少合作。"我用脚投票"是自保还是
      惩罚?无法区分——但砖的结构里两者都算"证实"。
      (ii) CONCEPT-fairness(d) 自身定义把"代价执行"作为真诚性的行为标志——于是
      前件("真有共享公平规范")的认定已与后件("有人付代价执行")绑在一起:如果
      没人付代价执行,我们应如何独立地断定"那是个真正共享的公平规范"?CONCEPT-
      fairness(d) 说这样判断的"真诚性是存疑的"。这意味着本砖的前件(b)条件——
      "存在共享的公平/合作规范"——在概念上已与后件(c)条件的"代价惩罚"部分绑定。
      这不是本砖独有的问题(CONCEPT-fairness 的定义本身就带了执行维度),但本砖的
      falsifiability 没有承认这个定义性张力,也没有提供独立于执行行为的规范测量
      规程来切断循环路径。

      修法:Required① 在 verdict_note 已给出。核心是拆开直接惩罚与间接惩罚,
      让各自有可操作的独立证伪路径。
    real_world_anchor_factcheck: |
      【未命中 required——但存两个小注】。
      逐一核查三个 sourced anchors:
      1. Fehr & Gächter (2002) + Fehr & Fischbacher (2004) + Henrich et al. (2006):
         — 这些是行为经济学中被反复复现的 canonical 实验。Fehr & Gächter (2002)
           的公共品博弈+惩罚在 Nature 发表后被数百次复现;Fehr & Fischbacher (2004)
           的第三方惩罚博弈范式已成标准工具;Henrich et al. (2006) 的 15 社会跨文化
           研究是跨文化实验经济学的地标级文献。事实基础扎实。
         — 小注:Henrich et al. (2006) 的真实结论是"没有社会完全符合纯自利模型
           预测,但拒绝行为跨文化差异巨大"——第三方惩罚同样存在幅度差异(某些社会
           的第三方惩罚比另一些弱很多)。砖在 behavioral_economics cross_verification
           note 中已标注"幅度文化可变",处理得当。
      2. Gintis (2000) + Bowles & Gintis (2004) 强互惠模型:
         — 演化博弈论中的成熟形式模型,数学推导清楚,所属领域共识度高。事实基准确。
      3. Boehm (1999) + Wiessner (2005):
         — Boehm 的"反向支配层级"(reverse dominance hierarchy)的田野覆盖多社会
           (狩猎采集群体的平等主义是靠"被治者联盟"反向制裁潜在支配者——这确实是
           第三方惩罚的一种,但 Boehm 的焦点是反支配,不是一般性公平规范执行)。
         — Wiessner (2005) 描述的昆桑羞辱仪式(shaming rituals)是第三方惩罚的
           田野实例——群体成员用公开羞辱来执行分享规范,独立于受害方。用法正确。
         — 小注:文化人类学 cross_verification 的 evidence tag 指向 EV-cu-001
           (一个关于内群体偏好的证据,而非第三惩罚),但 note 正文讨论的是 Boehm+
           Wiessner。这是 evidence tag 的文书不一致而非事实错,不影响锚点质量。
           建议在后续整改中把 evidence tag 对齐到正确的跨文化田野文献。
      结论:三个锚点方向正确、文献真实、无致命事实错。
    condition_is_prediction_not_definition: |
      【未命中——但离定义边界近】。
      核心主张"第三方代价惩罚跨文化存在且是规范维持的关键机制"是可证伪的经验
      预测——找不到一个符合前件(有规范+有违规观测)但零第三方惩罚的群体即可证伪。
      CONCEPT-fairness(d)已说明"代价执行是公平的真诚性标志",这使得"有公平规范
      必有某种代价执行"趋于分析性——但砖推进了一步:代价执行的【第三方形式】
      跨文化普遍存在。第三方 vs 第二方是一个经验切换(CONCEPT-fairness 不预设),
      故整体仍是预测。但离定义边界的距离比典型桥接砖近,见 red_flag_findings.
      brick_conclusion 的 borderline 警告。
    enumeration_exhaustiveness: |
      【未命中】。本砖未声称"第三方惩罚有 N 类/物种可枚举",不涉及该红旗。
    primary_suspect_and_trivialization: |
      【命中——should级(本砖未设 primary_suspect 字段,L2 非强制)】。
      审查者自诊最弱腿:
      (1) 最致命软肋= anti-talisman 的"间接惩罚"护身符(Required①)。它使证伪条件
          在田野里不可操作,砖实际上无法被独立观测推翻。
      (2) 次致命软肋= "关键执行机制"的过度宣称(Required②)。竞争机制未被排除,
          "关键"一词远超证据。
      (3) 第三软肋= 本砖与 THEOREM-moral-third-party-enforcement 的概念距离极薄。
          若把定理和砖并排阅读,砖新增的概念装备几乎是'定理说的那件事的 empirical
          corroboration'——这仍是 legitimate 的 L2 功能(定理=推导,桥接=实证),
          但厚度低于其他 L2 桥接砖。读者可能产生"定理和砖互为独立支柱"的错觉。
          建议在 bricks_field 中诚实记录这一关系。

      无被稀释为相邻理论常识的风险——第三方惩罚的实证文献是一套有其特征性实验
      范式(最后通牒/第三方惩罚博弈/公共品+惩罚)和专有文献群(Fehr/Gächter/Gintis/
      Bowles)的研究传统,不属于"规范要有人执行"这种泛泛之谈。
    caliber_completeness: |
      【命中——should级】。
      falsifiability 条款注册了(a)共享规范存在、(b)重复观测违规、(c)零第三方
      惩罚(含直接和间接)。但下列测量口径未注册:
      — "存在共享的公平/合作规范"如何独立测量?用什么工具?(问卷/访谈/实验博弈/参与观察?)
      — "重复观测"需要多少观测、什么时间窗口?
      — "从不自发付出…代价"中"从不"的样本量与时间窗口?
      — "间接的(声誉贬损/未来合作撤回)"如何与"自保性社会距离"区分编码?

      部分缺失是理论草图阶段的合理权宜(不需要注册到最后一毫米才有权做预测),
      但"从不"(绝对阈值)与"间接"的组合使未注册的具体口径选择方向会对证伪结果
      产生致命影响——这就不是可后补的细节,而是需要锁定的核心架构。因此本红旗的
      should 评级应理解为"与 Required① 联动的口径缺失":一旦 Required①
      的间接惩罚被拆分/移除,口径缺失的严重程度自然降低。

  iea_independence_check: |
    独立核算:
    IEA = 1.0 (behavioral_economics 锚源) + 0.5 (evolutionary_game_theory)
        + 0.5 (cultural_anthropology) = 2.0。

    系数逐项核对:
    — behavioral_economics → anchor, weight=1.0。Fehr & Gächter (2002),
      Fehr & Fischbacher (2004), Henrich et al. (2006) 是行为经济学的实验范式
      标准文献,锚定合理。
    — evolutionary_game_theory → 0.5。砖的路由:independence-model 无
      behavioral_economics 的独立系数,取 default=0.6;因两者共用博弈论范式
      (公共品/最后通牒/惩罚博弈结构),再折至 0.5。逻辑方向合理,default→0.6
      再折→0.5 的降幅(0.1)偏保守但不扭曲整体——在±0.2 启发性范围内。
    — cultural_anthropology → 0.5。同样取 default=0.6,再因"田野编码含研究者
      判断、与实验范式有概念传染"折至 0.5。降幅合理。
    — 加总 = 2.0, ≥ 1.8 verified 阈值,边距 0.2。

    独立性质量评估:
    1.【单 LLM 仪器折扣已诚实披露】cross_verification.verdict_note 明确写入
      "本次三路投票由单一 LLM 执行(非独立人类专家/非独立文献通道)"、"仪器有效
      独立性低于学科上限"——完全符合 instrument_correlation.discount_rule。
      此外还补充了缓解理由("为多实验室+跨文化稳固共识,非新颖/争议命题"),
      与 independence-model 的 mitigation 条款对齐。披露:过关。

    2.【共享数学/语料结构未虚高】
      — evolutionary_game_theory 与 behavioral_economics 共享博弈论范式,已在
        0.5 系数中反映(从 default 0.6→0.5 的折减就是为此)。
      — cultural_anthropology 的方法论(民族志参与观察+小规模田野人口)与
        WEIRD 实验室被试双重错开,提供了真实的边际独立性。但"第三方惩罚"作为
        分析概念有来自实验经济学向人类学扩散的知识流动——砖已在 0.5 折减中
        承认了这一点。
      — 没有把共享数学结构/共享语料当"独立"重复计权而虚高 IEA 的情况。

    3.【边际独立性的脆弱处】
      — IEA=2.0 刚好在 1.8 阈值上方 0.2。压力测试:若把 game_theory 按
        evo_bio__game_theory 的 0.4 取最保守值(砖在 verdict_note 的稳健性
        分析中也提了这点),IEA=1.9(1.0+0.4+0.5)仍≥1.8。但若对方把
        cultural_anthropology 也降到 0.4(考虑到更严格的概念传染评估),
        IEA=1.8(1.0+0.4+0.4)恰在阈值线——仅靠证明"未低于 1.8"保通过。
        这种紧贴阈值的 IEA 数值在 bricklaying 层面过关,但作为独立对抗审查者,
        我必须指出:砖的经验稳健性来自真实文献的反复复现,而非 IEA 数值的宽裕。
        单 LLM + 三源共享博弈概念骨架的有效独立性上限,也许低于 2.0 所暗示的
        "两个准独立来源"印象。
      — 证据 tag EV-cu-001 用于 cultural_anthropology 投票是一个文书不匹配
        (EV-cu-001 是关于内群体偏好而非第三方惩罚的物质证据)。这不改变 IEA
        数值(因该投票的证据依赖是其所引的民族志文献而非 EV-cu-001 本身),
        但降低 cross_verification 文书质量——建议对齐 evidence tag。

    综合: **IEA 算术正确、折扣披露诚实、未虚高**。独立性的微妙处源于
    (a)单 LLM 仪器、(b)三源共享博弈概念框架、(c)紧贴 1.8 阈值线的边距。
    这些都已在 verdict_note 中标注。不构成推翻 IEA 的理由,但应被记录为
    独立性的结构性上限——本命题的可靠性更多来自真实文献的反复复现,而非
    三个"独立"来源的 IEA 加总。

  counterexample_hunt: |
    亲自猎捕(scope=人类无中心权威群体,证伪目标=falsifiability(a)+(b)+(c)):

    候选 1——Mbuti 俾格米人的冲突避免与 camp fission(Turnbull 1961, 1965)。
    Mbuti 有共享公平规范(分享猎物、平等主义),违规时有发生,主要应对=嘲笑+
    冷落+分裂营地。嘲笑是否构成"直接的(抗议/排斥)"? 部分是的——嘲笑是
    公共的、有代价的(嘲笑者耗时耗力)。冷落是否构成"间接的(声誉贬损/未来
    合作撤回)"? 按照砖的宽口径,是的。结果:【被消化——非净杀;但恰恰暴露
    Required①:嘲笑与自保性回避被同时编码为"惩罚",无从区分】。

    候选 2——Hadza 的个体出走机制(Woodburn 1982, Marlowe 2010)。Hadza
    对违规者的主要应对=受害方搬到另一个营地。第三方介入极少,不存在群体性的、
    非受害成员付费惩罚违规者的模式。但搬离后违规者失去了与搬离者的合作机会
    ——按砖定义,这是"未来合作撤回"=间接第三方惩罚。结果:【被消化——但走
    出走的机制逻辑(exit,非 punishment)被砖的宽口径无声地重编码为惩罚】。

    候选 3——Semai 的 bcaraa' 和解大会(Dentan 1968, Robarchek 1989)。
    Semai 是已知最和平的社会之一。冲突时召开 bcaraa'——全社区讨论,不求
    惩罚而求调解与和好。但 bcaraa' 耗时(代价),由全体社区参与(第三方),
    且违规者必须出席面对讨论(一种社会压力形式)。结果:【被消化——反成支持:
    bcaraa' 是第三方代价参与的形式化版】。

    候选 4——前现代爱尔兰的"抵制"(boycott,此词即源于爱尔兰的 Charles
    Boycott 事件,1880)。社区成员集体拒绝与一名土地经纪人打交道,他被社会
    性地"抹除"——无人卖给他东西、无人与他说话。这是典型的第三方代价惩罚
    (群体成员的集体行动,非受害个体行为),且有效(他最终离开爱尔兰)。
    结果:【被消化——强支持案例:代价第三方惩罚在无国家权力的农业社会中
    作为规范执行机制的真实运作】。

    候选 5——超自然制裁为主的社会。在许多小规模社会中,对违规的主要威慑
    来自超自然信仰(祖先/神灵会惩罚)而非人类第三方。如 Evans-Pritchard
    对 Azande 巫术信仰的描述——许多规范通过"巫术恶果"的信仰维持,第三方
    人类惩罚并非必需。砖对此未排除,也未将其内化;但砖的 falsifiability
    说的是"无第三方惩罚",而非"第三方惩罚唯一存在"。超自然社会的"人类
    第三方惩罚较低"不证伪砖(砖不反对其他机制的存在),但暴露了"关键机制"
    定性(Required②)的脆弱性——如果一个社会的规范主要靠超自然信仰维持而
    人类第三方惩罚极少,砖不能称第三方惩罚为其"关键"机制。
    结果:【没有净杀核心(核心允许其他机制并存),但对 Required②("关键执行
    机制")构成压力——超自然制裁为主的社会是竞争机制的活体证据】。

    候选 6——现代城市匿名社会。邻居扰民,旁观者不干预——叫警察。
    "叫警察"不是第三方惩罚(因为你把惩罚外包给专门化权威了)。但这不在
    scope 内(砖限定"没有中心权威的群体"),不构成反例。结果:【不进入 scope】。

    总结:
    没有猎到 scope 内的干净活反例净杀核心(即:一个人类小规模群体,确有共享
    公平规范+反复违规观测,但完全零任何形式的第三方代价响应)。但这不等于
    命题无懈可击——猎捕结果的结构性特征暴露了 Required①:
    砖的"间接惩罚"口径极宽,三个最接近 falsifying 的候选(Mbuti/Hadza/
    超自然社会)全被口径的宽泛性吸收了——不是猎捕方法不行,是砖的证伪窗口
    被设计成了"什么都能消化"的消化腔。这是 anti-talisman 红旗在实证中的
    直接体现,不是命题强的证据。

    此外,猎捕(Candidate 5 超自然社会)独立地暴露了 Required②("关键"的
    过度宣称)——竞争机制在田野中是真实的、有独立因果权重的。

  non_recurrence:
    DED-004_loop: |
      【未重蹈】。DED-004 死因=两个独立现象(记账与成文法)被声称必然耦合,
      且打折版本在第三轮审查被驳回——属于伪耦合型不可证伪。BR-L2-014 未做
      此耦合——它声称第三方惩罚存在且重要,而非宣称两个独立现象必然同时出现。
      结构差异显著。
    DED-007_welded_axis: |
      【未重蹈】。DED-007 死因=自变量用分母"实际获授者"偷用结果测(焊死在
      被预测量上,前件不可独立测量)。BR-L2-014 的 IV(共享规范/违规观测)与
      DV(第三方惩罚)在 lab 层面完全异源正交;在田野层面可正交但需要操作规程。
      此处有 anti-talisman 风险(Required①),但这是证伪窗口设计问题,不是
      DED-007 式的测量轴焊死。两者的病理不同。

  required_fixes:
  - |
    Required①: 修复 anti-talisman —— 拆分或限定证伪条件中"间接惩罚"的范围。
    现状:falsifiability(c) 把直接惩罚(抗议/排斥/冲突)与间接惩罚(声誉贬损/未来合作撤回)
    打包成一个复合条件——任何形式的社会疏远都被编码为"确认"。修法二选一:
    (a)【推荐】拆分 falsifiability: 为直接惩罚(公开指责/驱逐/物理对峙——可行为编码)
    和间接惩罚(声誉/合作撤回——须注册独立的编码规程,含基线比较和自保性回避的排除规则)
    各设独立的证伪路径;任一被否证=整体受创(非 hiding 在另一条后面)。
    (b) 把 falsifiability 限定为直接惩罚,将间接惩罚从证伪条件(c)移除,降为 statement
    或注释中"可能需要进一步经验检验的子现象"。
  - |
    Required②: 修正"关键执行机制"过度宣称。现状:statement 称第三方惩罚是公平规范在
    无中心权威群体中的"关键执行机制"——但至少六个竞争/互补机制(内化规范/双边互惠/
    流言排斥/超自然制裁/出走分裂/调解)未被排除。修法:将"关键执行机制"改为
    "重要执行机制之一"或"被实验和田野反复观测到的核心执行机制",并在注释中简要
    列举竞争机制,诚实标注其与第三方惩罚的因果权重关系尚未被经验性地排定。
  - |
    should 修正 evidence tag 不匹配:cross_verification 的 cultural_anthropology 投票的
    evidence tag 指向 EV-cu-001(内群体偏好证据),但其 note 讨论的是 Boehm 1999 和
    Wiessner 2005(第三方惩罚的民族志文献)。建议将 evidence tag 对齐到正确文献,或创建
    dedicated 的第三方惩罚文化普适性证据节点。
  - |
    should 标注与 THEOREM-moral-third-party-enforcement 的概念距离:bricks_field 当前为
    "从公平定义的'代价执行'特征(d),落到可观测的第三方惩罚行为"。建议诚实补充:"本砖
    的经验内核已部分被 THEOREM-moral-third-party-enforcement 从公理推导——砖的独特
    增添是实证文献(Fehr lab + Henrich 跨文化 + Boehm 田野)的汇编与桥接"。
