      DV(第三方惩罚行为)在 lab 层面完全异源正交;在田野层面可正交——条件(a)可
      通过 elicitation/实验博弈/第二方惩罚观察等方式独立测量(见 Should①),非结构性
      焊死。与 DED-007 的病理不同:DED-007 的测量轴在设计层面就焊死了(分母必然依赖
      结果),本砖的测量轴在设计层面允许正交但需操作规程保障。

