  votes:
    evolutionary_biology:
      status: agree
      weight: 1.0
      note: |
        锚源(weight 1.0)。灵长类脑容量与社会群体规模相关(social brain hypothesis)稳健;
        Dunbar's number(~150)在狩猎采集族群/军队连队/学术合作网等多种人类组织反复验证;
        灵长类支配等级从狒狒到黑猩猩普遍存在。经验证据最直接,是全砖最强的独立通道。
    game_theory:
      status: agree
      weight: 0.4
      note: |
        对锚源折算系数 evo_bio__game_theory=0.4(与演化生物学共享演化博弈论数学结构,
        独立性最低,故折扣最重)。协调博弈形式化支持机制——n 人全对等协调成本 O(n^2),
        层级降至 O(n log n) 或更低;但博弈论只证明层级"高效",不预测"~150 出现阈值",
        阈值是经验性的。属理论性 agree,支持因果机制方向,不提供独立阈值证据。
    cultural_universals:
      status: agree
      weight: 0.6
      note: |
        对锚源折算系数 evo_bio__cultural_universals=0.6(理论框架 vs 田野数据,
        方法论路径不同,独立性较高)。所有超越狩猎采集规模的复杂社会(酋邦->王国->帝国)
        都出现层级,是社会复杂化的伴随现象;但文化普适只确认相关,不提供因果机制。
        跨文化田野样本独立于灵长类神经科学,构成对锚源的准独立确证。
  iea: 2.0
  verdict: verified
  verdict_note: |
    IEA = 1.0(evo_bio 锚) + 0.4(gt 对锚折算) + 0.6(cu 对锚折算) = 2.0,超 verified 阈值 1.8。
    订正:旧记录 IEA=1.9 用 0.5 折算 cultural_universals 有误——0.5 是 gt<->cu 的成对系数,
    而对锚源 evo_bio 的正确成对系数为 evo_bio__cultural_universals=0.6,故 IEA 由 1.9 订正为 2.0
    (calibration_note 提示 v1 系数 +-0.2 内不宜过度解读,此订正不改变 verified 裁决)。
    gt 贡献偏理论(证明层级效率)而非经验(不预测阈值),已由 0.4 低权重充分反映。

    【阈值特异性单源披露(required-iea-honesty)】:
    砖的核心经验主张分为两个子主张:子主张A(方向:层级随规模增大而出现)与
    子主张B(阈值:临界点≈150)。evo_bio 同时支撑 A 和 B;game_theory 只支撑 A
    (证明层级高效,自述不预测阈值);cultural_universals 只支撑 A(确认复杂社会有层级,
    自述不提供因果机制)。因此对子主张B(~150阈值),有效独立来源≈1.0(仅 evo_bio 锚)。
    IEA=2.0 主要反映子主张A的三角确证,对阈值特异性的独立验证并不充分——
    这不是 IEA 计算错误,是证据结构使三个'agree'的声量对阈值主张虚高。
    缓解:~150阈值本身有 Dunbar 30 年文献做多数据集收敛(狩猎采集/军事/学术网络),
    并非仅靠 IEA 投票站住;但此局限须如实披露。

    仪器折扣披露(instrument_disclosure,遵 META-REVIEW-001 discount_rule):本次投票由单一 LLM
    执行,报告的 IEA=2.0 是"学科独立性上限";三源证据实由同一 LLM + 其重叠语料读取判定,
    "仪器有效独立性"低于此数字。缓解:层级普适性属多重复现的稳固共识命题
    (Dunbar/social brain/跨文化比较三条独立文献通道真实收敛),单仪器忧虑被部分缓解——
    但按 honest_ceiling,这只是"部分的、被测量的墙",折扣仅披露不改数字。
    本次为存量回补审查,裁决维持 verified(IEA 稳超 1.8),不放水、未朝更松方向改动。
