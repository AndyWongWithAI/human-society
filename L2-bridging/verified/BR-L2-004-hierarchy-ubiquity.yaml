id: BR-L2-004
status: verified
term: 层级普适性 (Hierarchy Ubiquity)
statement: |
  当人类群体规模增大时,两条独立的经验链在约150人附近交汇:

  (a) Dunbar社会脑假说:个体能维持稳定社交关系的认知上限约150人
      (Dunbar 1992/1998/2010,灵长类新皮层比率→群体规模回归,
      狩猎采集族群/军事连队/学术合作网络多渠道收敛);

  (b) 全对等协调成本随规模O(n²)增长,层级将协调复杂度降为O(n log n)
      或更低——大群体中层级是信息效率占优的协调方案。O(n²)本身不推导
      约150这个具体阈值,阈值来自(a)的经验观测。

  在已观察的所有跨文化案例中,超过约150人的稳定群体均出现某种形式的层级结构
  (决策权归并到少数人手中)。这不是逻辑必然(L1范畴),但属已知最强的跨文化
  经验规律之一——尚未发现存活的干净反例(>200人+>20年+无任何常态化决策权不对称)。
人话摘要: "人群一旦超过约150人(Dunbar数——一个人能维持稳定社交关系的上限),在所有已知案例中都会冒出某种'少数人拍板'的层级——两条独立的链在此交汇:(1)大脑只能跟踪~150段关系;(2)人越多协调越贵(O(n²)),层级能把成本砍下来。这不是数学上的'必然',但现实里还没找到站得住的反例。"
bridges_to:
  concepts:
  - CONCEPT-hierarchy
  - CONCEPT-organization
  - CONCEPT-information
  axioms:
  - AXIOM-002
  theorems:
  - THEOREM-hierarchy-depth-limit
bridges_field: 从 L1 层级深度极限到可观测的人类组织规模-层级关联
applicable_sources:
- evolutionary-biology:
    rationale: 灵长类脑容量与社会群体规模的相关性是稳健的。 Dunbar's number (~150) 在狩猎采集族群、军队连队、 学术合作网络等多种人类组织中得到反复验证。
      层级在灵长类中普遍存在——从狒狒到黑猩猩都有支配等级。
- game_theory:
    rationale: 协调博弈的形式化——n 人协调成本随 n 增长呈 O(n²)。 层级将协调复杂度从 O(n²) 降为 O(n log n) 或更低。
      但博弈论只证明层级"高效",不预测"出现阈值"——约 150 这个具体数字完全来自演化生物学的经验观测(a)链,非博弈论推导。博弈论贡献的是机制方向(b)链,独立于阈值。
- cultural_universals:
    rationale: 所有已知的复杂社会（超越狩猎采集族群规模）都有层级。 酋邦、王国、帝国——层级是社会复杂化的伴随现象。 但文化普适性不提供因果机制——它只确认相关性。
falsifiability: |
  若发现一个人类群体满足以下全部条件,则本命题被证伪:

  (a) 规模 > 200 人(约150 + 缓冲,覆盖 Dunbar 观测的个体差异与测量误差);
  (b) 维持了至少一代人(>20 年)的稳定存在(排除创始期过渡平等主义);
  (c) 完全没有层级结构——所有决策全对等参与,无任何常态化的决策权不对称。

  层级操作化排除规则(以下三种形态即使存在影响力差异,也明确不构成层级):
  (i) 非捆绑式建议者:某人因经验/知识被频繁咨询,但其建议无约束力,
      决策仍由全体或正式角色做出;
  (ii) 限时轮值协调人:协调角色定期轮换(≤1年),任期内权限明确受限
      (如仅限议程管理),卸任后回归普通成员,无累积权力;
  (iii) 紧急独裁时限后还原:危机时授予某人临时决策权,危机解除后
      自动撤销且权力还原到常态治理结构。

  缓冲参数选择理由:
  - >200(而非150+1):Dunbar 数约150是个体差异均值,非刚性边界;
    200 覆盖约+2σ的自然变异和测量噪声,是保守但合理的证伪缓冲。
  - >20年:一代人的代际更替确保群体已度过创始期的魅力型/情境型
    平等主义,社会结构已进入稳态再生产。
  这些参数可在经验检验前精化,当前为默认边距。

  层级存在与否的测量规程:
  - 观察指标:是否存在正式职位(有名称/任期/明示权责)?是否存在常态化的
    议程设定权不对称(谁决定讨论什么)?是否存在资源分配权不对称?
  - 判定阈值:上述任一指标持续存在≥整个观察期的一半时间,即判定为'存在层级'。
  - 证据标准:需至少两种独立来源(如民族志+问卷调查,或历史档案+访谈)。
