  iea: 1.9
  verdict: verified
  verdict_note: |
    IEA = 1.0(行为经济学锚定) + 0.4(演化博弈论:取 evo_bio__game_theory = 0.4,
    共享博弈论核心数学结构) + 0.5(文化人类学:取 game_theory__cultural_universals
    = 0.5,方法论+被试群体双重错开) = 1.9, ≥ 1.8 verified 阈值。
    压力测试:即便将演化博弈论放松至 0.5(原审取值,始于 default 0.6 向下折),
    IEA = 2.0 仍 ≥ 1.8;即便同时将文化人类学压至 0.4, IEA = 1.8 仍卡在阈值上
    ——结论对合理的系数扰动稳健。
    存量回补审查裁决:维持 verified。本轮独立复核将演化博弈论权重从 0.5 下调至
    0.4(直接引用 evo_bio__game_theory 对,更严格地对齐 independence-model),
    IEA 从 2.0 → 1.9,仍高于 1.8,不触发降级。不得因"已 verified"放水——
    本轮是独立的存量回补审查,全流程重跑,下调来自独立判断非因原审有误。
    【仪器折扣披露 / instrument_disclosure】本次三路投票由单一 LLM 执行(非独立
    人类专家/非独立文献通道)。据 independence-model 的 discount_rule:报告的
    IEA=1.9 是"学科独立性"上限,"仪器有效独立性"低于此——三源证据由同一 LLM
    及其重叠语料读取判定,统一先验可能横加到三票上。缓解(mitigation):本命题为
    多实验室+跨文化(Henrich 15 社会)反复复现的稳固共识,受真实文献收敛支撑,
    单仪器忧虑被显著缓解,非新颖/争议命题的承重红旗。
