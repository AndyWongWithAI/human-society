    "学科独立性"上限,"仪器有效独立性"低于此——三源证据由同一 LLM 及其重叠语料读取
    判定,统一先验可能横加到三票上。缓解(mitigation):本命题为多实验室+跨文化
    (Henrich 15 社会)反复复现的稳固共识,受真实文献收敛支撑,单仪器忧虑被显著缓解,
    非新颖/争议命题的承重红旗。
