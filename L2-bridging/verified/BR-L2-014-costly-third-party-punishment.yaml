      note: |
        锚源。Fehr & Gächter (2002) 带惩罚的公共品博弈、Fehr & Fischbacher (2004)
        的第三方惩罚博弈:旁观者 A 在与 B/C 均无未来交互时,仍愿付真金白银去罚 B
        对 C 的不公分配。Henrich et al. (2006) 跨 15 个社会复现第三方惩罚普适存在
        (幅度文化可变)。多实验室、多文化独立复现,不存在自利解释。锚定为 1.0。
    evolutionary_game_theory:
      status: agree
      weight: 0.5
      evidence: []
      note: |
        强互惠/利他惩罚形式模型(Gintis 2000, Bowles & Gintis 2004, Boyd et al.)。
        在群体竞争/文化群体选择下代价惩罚可演化稳定,为该现象提供演化逻辑。
        独立性来源:数学建模路径,不依赖实验室数据。折扣理由(两重):
        (1) 理论 vs 实证——模型解释"为何可持续",不直接测量现实惩罚行为;
        (2) 与锚源(行为经济学)共享博弈论范式(独立模型缺 behavioral_economics 直接
        系数,取 default 0.6;因两者共用公共品/最后通牒等博弈结构,再向下折至 0.5)。
