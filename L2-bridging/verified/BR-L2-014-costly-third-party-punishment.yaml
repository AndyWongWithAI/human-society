id: BR-L2-014
status: verified
term: 代价第三方惩罚 (Costly Third-Party Punishment)
statement: |
  人类不仅在自己直接受害时惩罚不公(第二方惩罚),
  还会在自己未受直接损害的情况下,付出个人代价去惩罚
  针对陌生人的不公行为(第三方惩罚)。
  这种"多管闲事"式的惩罚是公平规范在没有中心权威的
  群体中得以维持的关键执行机制。
人话摘要: "人不光自己吃亏了要讨公道,看见陌生人欺负另一个陌生人也会气得掏自己的腰包去罚那个欺负人的——这种'多管闲事'的冲动看起来不划算,但它是公平规矩在没人管的情况下还能被执行的根基。"
bridges_to:
  concepts:
  - CONCEPT-fairness
  - CONCEPT-norm
  - CONCEPT-cooperation
  - CONCEPT-interaction
  axioms:
  - AXIOM-001
  - AXIOM-003
  theorems:
  - THEOREM-competition-norm
  - THEOREM-cooperation-precondition
  - THEOREM-conflict-cost
bridges_field: 从公平定义的"代价执行"特征(d),落到可观测的第三方惩罚行为
applicable_sources:
- behavioral_economics:
    rationale: "Fehr & Gächter (2002)的公共品博弈带惩罚条件:参与者愿付自己的收益去罚搭便车者,即使本轮自己不再与搭便车者同组(无未来互惠收益)。Fehr & Fischbacher (2004)的第三方惩罚博弈:A旁观B对C的不公分配,A愿付成本去罚B——即使A与B、C均无未来交互。Henrich et al. (2006)跨文化复现第三方惩罚的普适存在(幅度文化可变)。"
- evolutionary_game_theory:
    rationale: "强互惠(strong reciprocity)模型(Gintis 2000,Bowles & Gintis 2004):在群体间存在竞争或文化群体选择的条件下,代价惩罚可演化稳定——惩罚者短期吃亏,但其群体因合作率更高而在群体竞争中胜出。数学建模独立于实验室实验的方法论。"
- cultural_anthropology:
    rationale: "在无国家社会中,对违反集体规范的惩罚常以'众人的 disapproved + 排斥/放逐/公开羞辱'的形式出现,执行者是任意群体成员而非专门化权威(Boehm 1999,'Hierarchy in the Forest'反向支配层级;Wiessner 2005,昆桑人羞辱仪式)。这种分散化、非专门化的制裁即是第三方惩罚的田野实例。"
falsifiability: |
  若发现一个人类群体满足以下全部条件:
  (a) 群体内存在共享的公平/合作规范;
  (b) 且成员反复观测到他人违反该规范;
  (c) 但非受害第三方从不自发付出任何个人代价去惩罚违规者——
      既无直接的(抗议/排斥/冲突),也无间接的(声誉贬损/未来合作撤回);
  则本命题被证伪。
created: 2026-07-14
source_anchors:
- source_id: EV-cu-001
  support: strong
cross_verification:
  votes:
    behavioral_economics:
      status: agree
      weight: 1.0
      evidence: []
      note: Fehr & Gächter (2002)、Fehr & Fischbacher (2004)的第三方惩罚实验在多个实验室复现。被试愿付真金白银去罚从未谋面的陌生人对第三方的剥削——不存在自利解释。
    evolutionary_game_theory:
      status: agree
      weight: 0.5
      evidence: []
      note: 强互惠/利他惩罚的形式模型(Gintis/Bowles/Boyd)。数学方法独立于实验室实验,为"代价惩罚可持续"提供了演化逻辑。但模型本身不直接"测量"现实中的惩罚行为,而是解释其演化条件——独立性打折扣(理论vs实证)。
    cultural_anthropology:
      status: agree
      weight: 0.5
      evidence:
      - EV-cu-001
      note: 无国家社会的分散化规范执行(排斥/羞辱/放逐),执行者是任意群体成员而非专门权威。田野方法论(民族志参与观察)独立于实验室实验(行为博弈)。覆盖面广(Boehm的反向支配覆盖多个人类社会,Wiessner的昆桑人详细案例)。
  iea: 2.0
  verdict: verified
  verdict_note: IEA=2.0(≥1.8 verified阈值)。行为经济学锚定(1.0)、演化博弈论+0.5(数学模型独立于实验)、文化人类学+0.5(民族志独立于博弈实验)。三个源两两准独立,结论稳健:代价第三方惩罚是跨文化存在的公平规范执行机制。
