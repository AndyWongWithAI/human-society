    IEA = 1.0(行为经济学锚定)+ 0.5(演化博弈论:模型独立于实验,折扣理论vs实证
    及博弈论范式共享)+ 0.5(文化人类学:民族志+小规模社会样本,双重错开实验室)
    = 2.0,≥1.8 verified 阈值。压力测试:即便把演化博弈论按 evo_bio__game_theory
    的 0.4 系数向下取(承认与锚源共享博弈树),IEA=1.9 仍 ≥1.8——结论对系数扰动稳健。
    存量回补审查裁决:维持 verified(本相独立复核未发现推翻/降级证据)。
