bridges_field: 从公平定义的"代价执行"特征(d),落到可观测的第三方惩罚行为。注:THEOREM-moral-third-party-enforcement 已从公理推导出"扩散利益+惩罚有效→第三方惩罚"的形式条件——本砖的独特增添是实证文献(Fehr lab + Henrich 跨文化 + Boehm 田野)的汇编与桥接,确认"这件事在真实人类群体中确实发生了"。
applicable_sources:
- behavioral_economics:
    rationale: "Fehr & Gächter (2002)的公共品博弈带惩罚条件:参与者愿付自己的收益去罚搭便车者,即使本轮自己不再与搭便车者同组(无未来互惠收益)。Fehr & Fischbacher (2004)的第三方惩罚博弈:A旁观B对C的不公分配,A愿付成本去罚B——即使A与B、C均无未来交互。Henrich et al. (2006)跨文化复现第三方惩罚的普适存在(幅度文化可变)。"
- evolutionary_game_theory:
    rationale: "强互惠(strong reciprocity)模型(Gintis 2000,Bowles & Gintis 2004):在群体间存在竞争或文化群体选择的条件下,代价惩罚可演化稳定——惩罚者短期吃亏,但其群体因合作率更高而在群体竞争中胜出。数学建模独立于实验室实验的方法论。"
- cultural_anthropology:
    rationale: "在无国家社会中,对违反集体规范的惩罚常以'众人的 disapproved + 排斥/放逐/公开羞辱'的形式出现,执行者是任意群体成员而非专门化权威(Boehm 1999,'Hierarchy in the Forest'反向支配层级;Wiessner 2005,昆桑人羞辱仪式)。这种分散化、非专门化的制裁即是第三方惩罚的田野实例。"
falsifiability: |
  本命题的证伪分为两条独立路径——任一被否证即整体受创:

  路径1(直接第三方惩罚——核心主张):
  若发现一个人类群体满足以下全部条件:
    (a) 群体内存在共享的公平/合作规范;
    (b) 且成员反复观测到他人违反该规范;
    (c) 但非受害第三方从不自发付出任何个人代价进行直接惩罚——
        直接惩罚行为编码:公开指责(有记录的言语抗议)、驱逐(正式或事实上的
        群体排除)、物理对峙(威胁或实施肢体制裁)。需至少两种独立来源
        (如民族志+访谈,或历史档案+参与观察)确认零直接惩罚。
  则核心主张被证伪。

  路径2(间接第三方惩罚——次级主张,需独立于自保性回避的编码规程):
  若发现一个人类群体满足(a)(b)同上,同时:
    (c') 违规者在违规后的合作率(来自其他群体成员的互动邀请/资源交换/互助请求)
        与违规前基线无统计显著差异(α=0.05,双尾)——即不存在间接的声誉贬损或
        未来合作撤回效应;
    (d') 且排除了自保性回避的混淆:合作率下降若仅因个体自保(贝叶斯更新后降低
        对违规者的可靠性预期),而非因"维护规范"的第三方动机,则不计入间接惩罚。
        排除方法:比较违规者与未违规者在【与同一批其他人的合作率】变化差异。
  则间接惩罚子主张被证伪。

  路径1和路径2各自独立可证伪——不存在"一条被否证时躲在另一条后面"的护身符结构。
  以上编码规程在见到任何具体案例前已锁死。
