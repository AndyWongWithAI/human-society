bridges_field: 从内化定理的三前提(P1-P3)，落到可观测的发育心理学和认知神经科学证据
applicable_sources:
- developmental_psychology:
    rationale: "Kochanska et al. (2002, 2005) 的纵向研究:安全依恋的儿童在 2-5 岁期间表现出更强的'承诺遵从'(committed compliance)——不是恐惧惩罚而是内在地接受规则——和更强的内疚反应。反之，不安全依恋儿童更多表现为'情境遵从'(situational compliance)——只有在被监控时才遵守。Sroufe et al. (2005) 的 Minnesota 纵向研究:婴儿期的依恋模式可预测青春期和成年早期的道德行为和自我调节能力。注意：这是概率性预测而非决定论——不安全依恋≠不道德，但内化的情绪基础设施确实更弱。"
- behavioral_economics:
    rationale: "Fischbacher & Gächter (2010) 揭示条件合作者(conditional cooperator)占总人口的约 50%:这些人一开始合作，但一旦看到别人搭便车就降低自己的合作水平。这恰好是 THEOREM-内化 P2 的实验室微观基础——对等性信号断裂 → 合作行为下降。Fehr et al. (2008) 的神经经济学实验:在第三方惩罚博弈中，惩罚搭便车者激活了惩罚者的背侧纹状体(奖赏回路)——'惩罚搭便车者让人爽'。但如果搭便车已成为常态(对等性信号彻底断裂)，这种奖赏反应减弱。"
- cognitive_neuroscience:
    rationale: "Blakemore & Mills (2014) 综述:前额叶皮层(PFC)在青春期经历大规模突触修剪和髓鞘化——这是社会认知(包括道德推理)的神经重组期。Blasi et al. (2011) 的 fMRI 证据:青少年在道德判断任务中，从儿童期的杏仁核主导(情绪反应)逐渐过渡到成年期的前额叶主导(认知控制+视角采样)。这一神经重组恰好对应内化理论的'二阶反思窗口'——青春期不是道德的'危机期'，而是道德内化从外部输入升级为自主选择的必要过渡。"
falsifiability: |
  若发现以下情况，本命题被证伪：
  (a) 在一个已知缺乏安全依恋发育条件的群体中
      （如大规模机构化养育的孤儿院，依恋对象频繁轮换）；
  (b) 该群体的成年成员在独立测量中表现出与正常依恋群体
      同等的内化道德行为（无外部监控下的规范遵守、违规后的
      自发内疚情绪、代价性的道德执行）；
  (c) 前提：该群体的内化道德行为不能由"晚于发育窗口期的
      补偿性关系稳定性"来解释——即需要排除'虽然孤儿院轮换频繁、
      但该群体在青春期有稳定的替代照料者(如长期志愿者/导师)'
      的情况。排除方法:独立测量该群体成员在发育窗口期(0-5岁)和
      青春期(12-18岁)两个时段的关系稳定性——如果两个时段均无稳定
      照料者且内化仍正常→本命题被证伪。
      注意：这不是"反例是佐证"的免疫条款——如果补偿机制确实存在，
      恰好说明"关系稳定性是内化的条件"（方向一致但时间窗口可以后移），
      这会削弱 P1 的"发育窗口"主张（必须是 0-5 岁）但不会推翻
      核心主张（内化需要某种形式的关系稳定性）。
