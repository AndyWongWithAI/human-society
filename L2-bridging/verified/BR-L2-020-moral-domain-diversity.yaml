bridges_field: 从 CONCEPT-morality 的内容中立结构定义，落到可观测的跨文化道德领域多样性
applicable_sources:
- moral_psychology:
    rationale: "Haidt & Joseph (2004, 2007)、Haidt (2012) 的道德基础理论:通过对全球数十种文化的文本分析和数十万被试的问卷调查，识别出五个跨文化反复出现的道德直觉领域。MFT 的方法论独立于本体系的公理化推导——它从经验数据中归纳领域，而非从公理中推出领域。Graham et al. (2013) 的 Moral Foundations Questionnaire (MFQ) 提供了可量化的领域权重测量工具。"
- cultural_anthropology:
    rationale: "Shweder et al. (1997) 的'三种道德伦理'(autonomy/community/divinity)在印度和美国的跨文化比较，早于 MFT 且方法论独立（深度访谈+民族志而非大规模问卷）。三个伦理与 MFT 五基础有映射关系:autonomy 伦理对应伤害+公平，community 伦理对应忠诚+权威，divinity 伦理对应纯洁。Fiske (1992) 的四类关系模型(communal sharing/authority ranking/equality matching/market pricing)从关系结构角度独立地预测了不同社会中规范被道德化的领域分布。"
- evolutionary_anthropology:
    rationale: "Boehm (2012) 的'Moral Origins':通过对 50+ 个狩猎采集社会的民族志分析，论证道德(作为第三方执行的规范)的进化起源是由'反向支配'(reverse dominance)触发的——被支配者联合起来压制 bullying alpha males。这一路径与 MFT 的公平+伤害+忠诚基础在进化上的先后顺序一致:Boehm 的模型预测公平/伤害是最早被道德化的领域(因为直接关系到谁被谁欺负)，忠诚/权威是后来随群体间竞争加剧而叠加上去的。这一进化序列与 CONCEPT-morality 的结构定义一致——道德规范的内容可以随时间而变化和扩展。"
falsifiability: |
  本桥接有两个可分离的断言，各自独立可证伪：

  断言A（弱版——CONCEPT-morality 的内容中立性）:
  若发现 CONCEPT-morality 的结构定义无法容纳某类被跨文化反复道德化
  的行为——即某行为在多个独立文化中被道德化(满足TP+内化条件)，
  但其内容在结构上与TP+内化机制不兼容——则断言A被证伪。
  （当前未发现此类行为——此条件的存在本身是待检验的。）

  断言B（强版——五领域与TP维持的合作问题的对应关系）:
  若发现一个全新道德领域满足以下全部条件:
  (a) 跨文化反复出现（≥3个独立文化）；
  (b) 领域内的规范违反触发系统的第三方惩罚；
  (c) 该领域不能被归入现有五领域（伤害/公平/忠诚/权威/纯洁）中任何一类；
  (d) 且该领域不对应任何"需要第三方惩罚来维持的合作/协调问题"——
      即该领域的存在不能用 CONCEPT-morality 的结构定义来解释；
  则断言B被证伪。若断言B被证伪但断言A仍成立，说明 CONCEPT-morality
  可以容纳多样性但不足以解释为何是这些领域而非其他——需要补充解释。

  注意：断言B绑定于"五领域不是任意的——是被TP维持的合作问题结构
  挑选出来的"。这是比旧版更强的承诺——MFT 被修订（如发现第六领域）
  不会自动推翻断言B，除非新领域不满足(d)的结构约束。
