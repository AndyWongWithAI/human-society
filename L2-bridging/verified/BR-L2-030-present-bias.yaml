id: BR-L2-030
status: verified
term: 跨期选择的现时偏向 (Present Bias in Intertemporal Choice)
statement: |
  人类 agent 对时间上更近的收益/成本赋予不成比例的更高权重——
  贴现函数不是指数型（每期等比例折现）而是双曲型（近期陡、远期平）。

  (a) 双曲贴现与偏好反转——在指数贴现下,今天对"一年后 vs 两年后"的相对偏好
  不会随时间改变;在双曲贴现下,今天的"一年后 vs 两年后"到了明年变成
  "现在 vs 一年后",原先的远期偏好会被近期刺激推翻。这导致偏好随时间不一致——
  今天信誓旦旦"下月开始存钱",到了下月又推到下下月（自我控制问题）。
  偏好反转是双曲贴现区别于指数贴现的核心行为标志。

  (b) 即刻可得激励的行为权重畸高——在双曲贴现下,即刻可得的奖惩对行为的影响
  远大于等值的延迟奖惩。这使得:(i)现在就能拿到的小奖励比未来才能拿到的大奖励
  更有效地驱动行为;(ii)延迟满足（等待更大但更晚的奖励）需要额外的自我控制资源,
  而这种资源本身也是有限的（与 BR-L2-001 形成接口:有限理性的认知约束使自我控制
  进一步受限于注意力和执行控制资源的稀缺）。

  (c) 对承诺机制的需求——agent 意识到自己的偏好会随时间反转,
  会主动需求外部约束来"绑住"未来的自己（commitment devices）。
  承诺机制的跨文化普适性（宗教戒律、强制储蓄会、仪式化储备、事先锁定决策的规则）
  是现时偏向存在性的间接证据——若人类偏好稳定一致,
  无须发明这些"自己限制自己"的制度。

  机制根源与综合
  在演化时间尺度上,未来高度不确定:AXIOM-002（信息熵增）使关于远期回报的
  信息随时间的平方衰减;AXIOM-001（稀缺-竞争）使远期资源可能在到达之前
  已被竞争者占据。"现在的一鸟"在生态时间尺度上确实优于"林中的二鸟"——
  现时偏向是对远古环境的适应,在现代低死亡率+长寿命环境下表现为"偏差"。
  综合:BR-L2-001 说"算不过来"（计算能力约束）,本命题说"算得过来也偏向现在"
  （估值函数形状约束）——两条是独立的机制维度。
人话摘要: "明知道下月开始存钱更好,但到了下月还是推到下下月——人天生就是'现在'比'以后'看得重,近的特别重、远的特别轻,不是算不清账,是心里那杆秤本身就歪向现在。"
bridges_to:
  concepts:
  - CONCEPT-agent
  - CONCEPT-choice
  axioms:
  - AXIOM-001
  - AXIOM-002
bridges_field: 从 L1 "agent 在稀缺与信息衰减约束下做跨期选择" 到可观测的双曲贴现与自我控制失败——现时偏向是估值函数形状的独立约束,而非计算能力约束
applicable_sources:
- behavioral_economics:
    rationale: |
      双曲贴现在实验室和田野中的大量实证
      Thaler(1981)首次形式化了双曲贴现与自我控制问题的关联;
      Laibson(1997)的"准双曲贴现"模型(β-δ模型)提供了可操作的数学形式,
      其中 β<1 捕获即刻偏向、δ 为常规指数贴现;
      Frederick, Loewenstein & O'Donoghue(2002)的综述覆盖了跨期选择
      的行为证据全景。偏好反转实验(如 Ainslie 1975 的鸽子实验、
      Kirby & Herrnstein 1995 的人类实验)直接演示了"远选大、近选小"的偏好反转。
      承诺机制需求(如 Ashraf, Karlan & Yin 2006 的菲律宾储蓄实验)证明人
      愿意为自己的未来行为支付约束成本——这无法被指数贴现模型解释。
- evolutionary-biology:
    rationale: |
      现时偏向的演化适应逻辑
      在觅食生态学中,动物跨期选择普遍呈现双曲模式(Kacelnik & Bateson 1996,
      星鸦的食物储存决策;Stephens & Anderson 2001,蓝松鸦的跨期选择)。
      核心演化逻辑:在祖先环境中,延迟奖励的实际兑现概率随等待时间急剧下降——
      捕食者、竞争者、环境剧变都可能使"未来的承诺"落空。
      在生态时间尺度上,高贴现率是适应性而非偏差——
      只有进入低死亡率+制度保障的现代环境后,
      同一套心理机制才系统性地产生"错误"的跨期决策。
      Rogers(1994)的形式模型证明:在不确定环境中,双曲贴现函数
      比指数贴现函数具有更高的演化适合度。
- cultural_universals:
    rationale: |
      跨文化证据:偏好反转和现时偏向在所有被研究文化中出现,
      尽管程度受文化制度调节(如 Wang, Rieger & Hens 2016
      对53国的跨期选择调查)。承诺机制的跨文化普适性——
      宗教的戒律与斋戒周期、储蓄与信贷互助会(ROSCA)、
      仪式化的资源储备(如印加帝国的粮食仓储系统)、
      婚礼/葬礼的长期资源预存——表明各人类社会独立地
      "发现"了现时偏向这一人性约束,并独立地发明了相似的应对制度。
      这与"现时偏向是人类心理的结构性特征而非特定文化的习得偏差"一致。
falsifiability: |
  本命题的核心主张是:人类跨期选择的贴现函数在数学形式上偏离指数贴现,
  呈现"近期陡、远期平"的双曲特征;此特征导致偏好反转和自我控制问题。

  若以下条件满足,则核心主张被证伪:
  (a) 在跨文化大样本的受控跨期选择实验中,人类选择普遍符合指数贴现——
  即不存在偏好反转现象（所有被试在时间推移后保持原始偏好排序）。
  操作化:招募多个文化背景的被试,重复标准的跨期选择实验范式,
  若在所有文化组中,被试的贴现函数均可用单一指数参数 δ 拟合
  （无需 β<1 参数）,则本命题被证伪。

  (b) 或证明"偏好反转"和"自我控制失败"的所有可观测后果
  均可被 BR-L2-001（有限理性——算不过来）完全解释,
  无需引入"估值函数形状畸变"作为独立机制维度——
  即双曲贴现的β<1 参数在控制认知负荷后归零。

  不声称:
  - 不声称贴现率的具体数值（贴现因子因个体、情境、文化而异）
  - 不声称现时偏向不可克服（承诺机制、习惯养成、认知重构可部分矫正:
    人类发明承诺机制本身就证明了对偏向的自觉与约束能力）
  - 不声称所有"短视"行为都源于双曲贴现——
    流动性约束下"现在就花"可能是完全理性的生存策略
    （手头现金不足以撑到未来收益兑现的时刻,此时高贴现率
    反映的是真实的生存约束而非估值偏差;BR-L2-029
    将专门处理"短视"行为的理性基础一端,
    与本命题形成对称互补）
