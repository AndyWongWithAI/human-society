review_summary: |
  定论:verified,IEA=2.1(behavioral_economics 锚 1.0 + evo-bio 0.6 + cultural_universals 0.5)≥1.8。
  为何:双曲贴现机制在人类实验/动物觅食/跨文化承诺制度三路真独立通道收敛,反例猎捕无活反例(理性短视已让渡 BR-L2-029)。
  全档见 ADV-REVIEW-BR-L2-030。
cross_verification:
  votes:
    behavioral_economics:
      status: agree
      weight: 1.0
      evidence: []
      note: |
        锚源。双曲/准双曲贴现是行为经济学最直接、最形式化的证据链:Laibson(1997)β-δ
        模型给出可操作数学形式(β<1 捕获即刻偏向),Frederick-Loewenstein-O'Donoghue(2002)
        综述覆盖行为证据全景,Kirby-Herrnstein(1995)偏好反转实验、Ashraf-Karlan-Yin(2006)
        菲律宾承诺储蓄实验直接演示"愿为约束未来自己付费"——均无法被指数贴现解释。
        证据强度 strong,作锚点权重 1.0。
    evolutionary-biology:
      status: agree
      weight: 0.6
      evidence: []
      independence_note: |
        独立系数 0.6(独立性模型无 behavioral_economics 配对,取 default_independence)。
        证据来自完全独立的动物觅食生态学文献:Kacelnik-Bateson(1996)星鸦、Stephens-Anderson
        (2001)蓝松鸦跨期选择普遍呈双曲模式;Rogers(1994)形式模型证不确定环境下双曲贴现
        比指数贴现适合度更高。这是与人类实验室/田野经济学【平行独立】的数据通道——非人物种
        证据不可能污染人类实验语料。理论上共享适应主义叙事框架,但数据来源真独立,不折扣至更低。
    cultural_universals:
      status: agree
      weight: 0.5
      evidence: []
      independence_note: |
        default_independence 0.6 诚实下调至 0.5:承诺机制的跨文化普适性(宗教戒律/斋戒、
        ROSCA 储蓄互助会、印加粮仓、婚葬预存)属真独立的田野/档案通道,各社会独立"发现"
        现时偏向并发明相似应对制度;但本源引用的 Wang-Rieger-Hens(2016)53 国跨期选择调查
        本身就是行为经济学范式的跨文化施测,与锚源【共享实验仪器/范式】,存在部分语料重叠,
        故较 default 折价。混合考量后 0.5。
  iea: 2.1
  verdict: verified
  verdict_note: |
    IEA = 1.0(behavioral_economics 锚) + 0.6(evolutionary-biology) + 0.5(cultural_universals)
    = 2.1，≥ 1.8 学科独立性上限。三来源同向 agree，无有资格的反对票:双曲贴现/偏好反转
    是跨物种、跨文化最被反复复现的稳固共识命题之一，真实文献收敛支撑充分。
    本阶段不翻牌 status(仍 candidate)，verdict 由 Finalize 阶段按审查裁决定夺。
  instrument_disclosure: |
    本次三路投票由单一 LLM 执行(非独立人类专家/独立文献通道)。照 independence-model
    的 discount_rule:报告的 IEA = 2.1 是【学科独立性上限】，【仪器有效独立性低于此】——
    同一 LLM+其重叠语料横加统一先验到三票上，会系统性高估真实来源多样性(参 ICV-001
    布干达判例:两"独立"模型 κ=0.892 同向错)。缓解:本命题为多重复现的稳固共识
    (动物觅食+人类实验+跨文化承诺机制三条真实收敛),单仪器忧虑被部分缓解，但不消除;
    真正恢复独立性需异血统模型面板或真实独立文献通道。
