revision_note: "2026-07-14 ADV-REVIEW-012(DED-007 round-1)后拆分:原'匿名多边'焊死拆为纯 D2(本砖:匿名/可追踪缺口)+ 纯 D3(BR-L2-012:多边结算成本);Kiyotaki-Wright 移至 BR-L2-012。目的:让 D2/D3 可各自独立证伪,支撑 DED-007 的三驱动解离。"
