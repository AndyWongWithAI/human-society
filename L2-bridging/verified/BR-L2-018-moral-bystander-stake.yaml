bridges_field: 从第三方执行定理的"利益扩散"条件，落到可观测的惩罚强度与利益占比的正相关
applicable_sources:
- behavioral_economics:
    rationale: "第三方惩罚博弈中，旁观者的惩罚金额随其在该轮博弈中的利益占比系统性地变化。Carpenter & Matthews (2012) 的公共品博弈变体显示:当旁观者也是同一公共品的受益者时，惩罚强度显著高于旁观者来自不同公共品组的情境。Ostrom (1990) 的公共池资源田野研究——资源使用者自己就是监督者时，监督和执行更有效（因为他们直接受益于资源维护）。"
- evolutionary_game_theory:
    rationale: "间接互惠(indirect reciprocity)模型(Nowak & Sigmund 2005):在基于声誉的系统中，惩罚搭便车者是一项'公共品'——你惩罚了一个搭便车者，所有从该系统中获益的人都受益于你的惩罚。模型的预测是:当个人从系统中的利益占比越高，惩罚的演化稳定性越强。与 BR-L2-014 的强互惠模型互补——强互惠解释'为什么惩罚会存在'，间接互惠解释'惩罚强度随利益变化'。"
- social_psychology:
    rationale: "社会认同理论(self-categorization theory, Turner et al. 1987):个体对内群体成员的违规更愤怒、更愿惩罚——因为内群体规范直接维护了群体身份的价值，而群体身份是个体自我概念的一部分。Lieberman & Linke (2007) 的实验:被试对同一违规行为，如果受害者与自己共享群体身份，惩罚意愿显著更高。这不是'偏心'——在结构上，内群体规范直接维护着惩罚者自身的合作利益。"
falsifiability: |
  若发现以下情况，本命题被证伪：
  (a) 一个群体中存在第三方惩罚行为（BR-L2-014 已证实其存在）；
  (b) 且可以独立测量旁观者在受该规范维护的合作结构中的利益占比；
  (c) 但惩罚强度与利益占比之间无任何正相关——甚至负相关——
      即利益越少的旁观者反而惩罚越重。
