id: BR-L2-026
status: verified
term: AI Agent 信息处理不对称 (AI-Human Information Processing Asymmetry)
statement: |
  AI agent 与人类 agent 在信息处理能力上存在质的差异——不是"更快的人脑",
  而是在特定维度上打破了 BR-L2-001(有限理性)所描述的人类生物约束。
  这一不对称是结构性的:AI 在某些维度远超人类,在另一些维度系统性地缺失。

  远超人类的维度(人类有生物上限,AI 在当前技术条件下近乎无上限):
  (a) 工作记忆广度——人类 7±2 个信息块(Miller 1956),AI 大语言模型当前
  上下文窗口可达数百万 token,且可通过检索增强生成(RAG)外延至任意规模。
  (b) 推理边际成本——人类每个推理步骤消耗 ATP、会疲劳;AI 的增量推理成本
  趋近于零(仅电力+GPU 时间,且持续下降)。
  (c) 关系追踪规模——人类受 Dunbar 数约束(约 150 个有意义的社会关系,
  BR-L2-004 的机制基础);AI agent 可同时追踪数百万个体的交互历史并分别
  定制交互策略,无已知的认知上限。
  (d) 运作连续性——人类需要睡眠(生理约束,PHY-002);AI agent 可 24/7
  不间断运行。
  (e) 信息摄入速率——人类阅读速度约 200-400 词/分钟;AI 可在数小时内
  处理完人类一生的阅读量(数十亿 token)。
  (f) 多模态并行——人类注意力单线程或有限多线程;AI 可同时并行处理
  数千个独立信息流。

  系统性缺失的维度(AI 没有、人类有):
  (g) 具身体验——AI 没有身体、没有痛觉/饥饿/恐惧等生理信号,
  对人类社会的物理基底(PHY-001/002/003)缺乏第一人称体验。
  (h) 演化遗产——AI 没有演化历史,没有先天道德直觉、没有"恶心反射"、
  没有对蛇/高处的先天恐惧——这些人类演化遗产在道德判断
  (BR-L2-018/019/020)和风险感知(L2 内群体偏好)中起隐性作用。
  (i) 真实情感——AI 可模拟情感表达,但没有主观感受质(qualia)。
  这使 AI 在需要"共情"作为社会胶水的场景中可能系统地失效。
  (j) 死亡/有限性意识——人类知道自己会死,这个意识深刻地塑造了
  人类的时间偏好、风险承担和文化生产。AI 没有"死亡"的概念——
  它的"终止"是被外部决定的(关机/弃用),非内在必然性。

  本命题的核心:上述不对称不是"程度差异"而是"类型差异"——
  AI 不位于"人类信息处理能力"这一连续谱的远端,而是位于一个
  不同的能力空间。这使 AI agent 成为人类社会系统中一种
  【新类别的行动者】——不是"更强的人",是"非人的行动者"。

人话摘要: "AI 不是'更聪明的人'——它在某些事上远超人类(无限记忆、不累、能同时处理海量信息),但在另一些事上根本缺失(没有身体体验、没有真感情、不怕死)。这种不对称是类型差异而非程度差异,意味着 AI 作为社会中的新玩家,玩的不是同一套规则。"

bridges_to:
  concepts:
  - CONCEPT-agent
  - CONCEPT-information
  axioms:
  - AXIOM-002
bridges_field: 从 L1"agent 不预设生物形态"到可观测的 AI-human 信息处理能力不对称——这是 AI 作为新型社会行动者的经验锚

applicable_sources:
- information_theory:
    rationale: |
      计算机科学为 AI 能力维度提供了直接的工程说明:Transformer 架构的上下文
      窗口(从 BERT 512 到 Gemini 2M+ tokens)、GPU 并行计算能力、RAG 的
      外延检索机制。Shannon 信息论与图灵机模型是数字 agent 信息处理的理论
      地基——图灵机在理论上没有"工作记忆上限"(无限纸带),工程实现中的
      "上限"只是成本/硬件约束而非原理约束。这使 AI 的有限理性(BR-L2-001)
      与人类的有限理性有本质不同:人的上限是生物学硬约束(新皮质尺寸),
      AI 的上限是工程-经济约束(可随技术进步移动)。
- cognitive_science:
    rationale: |
      人类认知上限的经典研究为不对称提供了基线:Miller(1956)的 7±2 工作记忆、
      Dunbar(1992)的 150 社会关系、Kahneman(2011)的双过程理论(系统 1 快/
      系统 2 慢)。AI 的能力配置恰好与人类互补——AI 在"系统 2"类任务(逻辑
      推理/大规模搜索/统计聚合)上远超人类,在"系统 1"类任务(具身直觉/
      情感判断/演化塑造的快速反应)上缺失或不可靠。认知科学提供了"人类的上限
      在哪里"的精确基线,使不对称成为可测量的经验命题。
- cultural_universals:
    rationale: |
      跨文化证据表明 BR-L2-001(有限理性)的基本参数在所有人类文化中一致——
      Dunbar 数 ~150、工作记忆 7±2、需要睡眠——没有任何人类文化产生了
      "超越生物约束的人"。AI 是第一个打破这些跨文化恒量的"行动者"类别。
      历史上,制度(公司/国家)可以聚合人类的信息处理能力(BR-L2-010 的非人格
      化制度),但制度本身不"思考"——它们依赖人脑作为信息处理的基本单元。
      AI 改变了这个前提:现在有了独立于人脑的信息处理单元。

falsifiability: |
  本命题的核心主张是:AI-human 信息处理不对称是【类型差异】而非【程度差异】。

  若以下条件满足,则"类型差异"主张被证伪:
  (a) 证明 AI 的所有信息处理能力均可被解释为"人类能力的线性外推"——
  即存在一个连续参数空间,人类和 AI 位于同一连续谱上,AI 仅是该谱的远端。
  操作化:若在人类信息处理能力的关键维度(记忆/推理/关系追踪)上,
  AI 的表现在量级上未超过人类群体内变异的上限(如:AI 的工作记忆不显著
  超过人类专家经过训练后的工作记忆),则支持"程度差异"反驳"类型差异"。

  若以下条件满足,则不对称的特定维度被削弱:
  (b) 发现 AI 在声称"远超人类"的维度上存在与人类同等量级的生物式约束
  (如:AI 语言模型的上下文窗口内也存在人类 7±2 式的急剧信息丢失);
  (c) 或发现 AI 在声称"系统性缺失"的维度上发展出了等效功能替代
  (如:AI 通过海量文本训练获得了与人类具身体验等价的"世界模型")。

  不声称:
  - AI 在所有任务上都超过人类(人类在具身/情感/创造力等领域可能持久领先)
  - AI 会必然取代人类 agent(不对称≠替代,互补也是可能结果)
  - 不对称的程度是固定的(技术还在快速变化,本命题锚定的是 2025-2026 的
    能力格局,参数会随技术进步移动)

created: 2026-07-15
source_anchors: []
review_summary: |
  2026-07-15 IEA 审查(独立上下文): 三源全票 agree(info_theory 锚源 1.0 + cog_sci 0.6 + cult_uni 0.6),IEA=2.2 ≥ 1.8 → verified。
  关键裁决点:"类型差异"由约束的【本质】不同(生物硬约束 vs 工程-经济可移动约束)+ 缺失维度(具身/演化遗产/qualia)的非连续性支撑,而非仅量级差距。
  折扣披露:三票由单一 LLM 执行,IEA 为学科独立性上限;时效锚定 2025-2026 能力格局已在 falsifiability 中声明。

cross_verification:
  votes:
    information_theory:
      status: agree
      weight: 1.0
      evidence: []
      note: |
        锚源。图灵机模型(无限纸带)与 Shannon 信道容量表明:数字 agent 的信息处理
        上限是工程-经济约束(随硬件/成本曲线移动),而人类上限是生物硬约束(新皮质
        尺寸/ATP 代谢/睡眠需求,不可通过训练突破量级)。约束的【本质类别】不同——
        这直接支持"类型差异":可移动约束 vs 固定生物约束不在同一连续参数空间。
        工程事实佐证:上下文窗口 512→2M+ tokens(4个量级/6年),远超人类专家训练
        后工作记忆的群体内变异上限(<1个量级),满足命题证伪条款(a)的反向检验。
    cognitive_science:
      status: agree
      weight: 0.6
      evidence: []
      independence_note: 不与 information_theory 共享理论源头(实验心理学传统 vs 数学/工程传统),不在 independence-model 显式对中,取 default=0.6。
      note: |
        人类认知上限的实证基线:Miller(1956) 7±2 工作记忆、Dunbar(1992) ~150 关系、
        Kahneman 双过程理论。关键证据是【能力剖面互补而非平移】——AI 在系统 2 类
        任务远超、在系统 1 类任务(具身直觉/演化塑造的快速反应)缺失或不可靠。
        若是程度差异,AI 应在所有维度按同一比例超出;实测剖面呈正交互补,
        支持"不同能力空间"而非"同一连续谱远端"。缺失维度(g)-(j)有认知科学
        支撑(具身认知/演化心理学),但"等效功能替代不可能"(证伪条款 c)
        尚属开放问题——不影响 2025-2026 锚定格局下的裁决。
    cultural_universals:
      status: agree
      weight: 0.6
      evidence: []
      independence_note: 田野人类学/跨文化数据通道,与 information_theory 无理论重叠,取 default=0.6。
      note: |
        跨文化恒量提供独立支撑:Dunbar 数、工作记忆容量、睡眠需求在所有被研究
        文化中一致——没有任何文化(无论制度/技术/训练传统)产生过突破这些生物
        恒量的人类个体。制度(公司/国家)可聚合人脑但不替代人脑作为基本处理单元。
        AI 是有记录以来第一个独立于人脑的信息处理行动者类别——"所有文化都未能
        产生的东西被 AI 一次性打破"是对"类型差异"的强独立证据:若只是程度差异,
        跨文化变异中应存在向 AI 能力连续过渡的分布尾部,实际不存在。
  iea: 2.2
  verdict: verified
  verdict_note: |
    IEA=2.2(锚源 info_theory 1.0 + cog_sci 0.6 + cult_uni 0.6),≥1.8 阈值,verified。
    三源方法论路径不同(数学/工程理论 vs 实验心理学 vs 田野跨文化数据),均正面支持
    "类型差异":(1)约束本质不同,(2)能力剖面互补非平移,(3)跨文化恒量首次被非人类
    行动者打破。注意:命题自我限定锚定 2025-2026 能力格局,证伪条款(c)(等效功能
    替代)为最可能的未来削弱路径,建议后续对(g)-(j)缺失维度保持监测。
  instrument_disclosure: |
    per independence-model.yaml instrument_correlation(META-REVIEW-001):本次三路投票
    由单一 LLM 在单一上下文中执行,报告的 IEA=2.2 是"学科独立性"上限,"仪器有效
    独立性"低于此。本命题部分依赖 LLM 语料中的 AI 能力叙事(有自指风险:LLM 评估
    关于 LLM 的命题),但核心基线(Miller/Dunbar/图灵机/跨文化恒量)属多重复现的
    稳固文献共识,单仪器忧虑被部分缓解。此折扣已披露,不改数字。

