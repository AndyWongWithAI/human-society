id: BR-L2-027
status: verified
term: 注意力稀缺与信息过载 (Attention Scarcity and Information Overload)
statement: |
  人类 agent 的注意力是稀缺资源——在给定时间内只能处理有限数量的信息。
  当可用信息量超过注意力的处理容量时,决策质量反而下降——这不是"信息不够",
  而是"信息太多导致处理不过来"。

  (a) 注意力瓶颈——BR-L2-001(有限理性)描述了信息处理能力的上限;
  本命题补充了上限被突破时的后果:不是"停留在上限水平",而是"降到上限以下"。
  信息过载引发:选择性忽略(忽略可能相关的信息)、启发式简化(用粗糙替代规则)、
  决策延迟(因无法评估所有选项而推迟决策)、从众(跟随他人选择以省去自己评估)。

  (b) 信息供给与处理能力的不对称增长——信息技术(尤其是数字媒介,BR-L2-025)
  使信息供给呈指数增长,但人类信息处理能力的生物约束(Dunbar 数、工作记忆、
  阅读速度)保持恒定。这一不对称导致"信息富裕但注意力贫困"的结构性格局:
  信息的生产和分发越来越便宜,注意力的"单位成本"却不变——注意力因此成为
  数字时代最稀缺的资源之一。

  (c) 竞争性注意力——在信息过载环境中,Agent 之间不仅竞争物质资源,
  也竞争彼此的注意力。注意力的竞争性表现在:一个人的注意力分配给 A,
  就不能同时分配给 B(注意力是排他性资源,受 PHY-003-b 约束:一个 agent
  在给定时刻只能占据一个空间/注意力位置)。这使得"获取注意力"本身成为
  一种社会策略——广告、标题党、算法推荐、信息茧房——都是注意力竞争
  的产物。

  综合:AXIOM-002 说"信息无能量维护必衰减"(信息太少会丢失),本命题说
  "信息超过处理容量决策必退化"(信息太多也会失败)。两条约束对称地作用于
  信息量的两端——人类社会的信息环境同时受到"信息不足"和"信息过载"的双重
  约束,最优协调发生在信息供给与注意力容量匹配的区间内。

人话摘要: "脑子只能同时想几件事——信息太少当然不行,但信息太多、被信息淹了,判断力反而下降。数字时代信息多到爆炸,但人的注意力还是那点——注意力成了最稀缺的东西。"

bridges_to:
  concepts:
  - CONCEPT-agent
  - CONCEPT-information
  - CONCEPT-choice
  axioms:
  - AXIOM-002
bridges_field: 从 L1"agent 信息处理有物理上限"到可观测的信息过载现象——注意力稀缺是信息时代的对称性约束

applicable_sources:
- cognitive_science:
    rationale: |
      信息过载的经典研究:Miller(1956)的工作记忆上限(7±2)、Broadbent(1958)
      的注意力过滤器模型、Kahneman(1973)的注意力作为有限容量资源理论。
      Schwartz(2004)的"选择悖论"(选项越多满意度越低)提供了直接的行为证据。
      认知负荷理论(Sweller 1988)在教育心理学中系统化了"信息超过处理容量→
      学习/决策退化"的机制。这些为注意力稀缺提供了实验室级别的因果证据。
- behavioral_economics:
    rationale: |
      信息过载在市场和消费决策中的表现:过多选择导致延迟购买或后悔
      (Iyengar & Lepper 2000, jam study)。投资者面对过多信息时转向噪音
      交易(对不相关信息过度反应)。Simon 的 satisficing 模型(BR-L2-001)
      正是对"优化成本超过注意力预算"的理性适应。行为经济学提供了注意力
      稀缺在市场行为中的可观测后果——这些后果不能仅由"信息不足"解释,
      需要"注意力"作为独立约束变量。
- cultural_universals:
    rationale: |
      跨文化证据:所有已知社会都有管理信息过载的文化机制——议程设置
      (只讨论特定话题)、声誉信号作为注意力捷径("听谁的"减少了自己评估
      的成本)、仪式化简化(固定流程减少决策负担)。这些机制的跨文化普适性
      表明注意力稀缺是人类社会的结构约束而非现代数字环境的特有产物——
      数字时代只是把"信息供给-注意力容量"的剪刀差推到了前所未有的极端。

falsifiability: |
  本命题的核心主张是:存在一个信息量阈值,超过该阈值后决策质量【反而下降】
  (不是饱和,是退化)。

  若以下条件满足,则核心主张被证伪:
  (a) 证明在任何决策领域中,决策质量是信息量的单调不减函数——即无论信息量
  多大,增加信息永远不会降低决策质量。操作化:在受控实验中,将信息量从
  "适中"增加到"极多",若所有被试的决策质量均不低于适中信息量组,
  则"过载退化"主张被证伪。

  (b) 或证明"信息过载"的所有可观测后果均可被"信息不足的某种变形"完全
  解释,无需引入"注意力容量上限"作为独立约束——即"信息太多"的问题
  本质上都是"信息太少"(缺乏筛选/排序/优先级信息)的伪装。

  不声称:
  - 信息过载在所有决策领域同等严重(熟悉领域可通过经验/chunking 扩大有效容量)
  - 信息过载是不可缓解的(筛选/推荐/摘要等机制可以部分缓解)
  - 数字化是信息过载的唯一原因(前数字社会也有信息过载,只是规模不同)

created: 2026-07-15
source_anchors: []
review_summary: |
  2026-07-15 IEA审查(独立上下文): verified, IEA=1.9。
  cog_sci agree(1.0,容量退化的实验室因果证据链) + behav_econ agree(0.6,市场行为可观测退化后果)
  + cult_univ partially_agree(0.3,证明结构约束普适性,但对"退化vs饱和"的特定区分支持较弱)。

cross_verification:
  votes:
    cognitive_science:
      status: agree
      weight: 1.0
      evidence: []
      note: |
        锚源。Miller(1956) 7±2、Broadbent(1958)过滤器、Kahneman(1973)有限容量
        提供容量上限的实验室因果证据;Sweller(1988)认知负荷理论系统化了
        "超容量→表现退化(非饱和)"机制;Schwartz(2004)选择悖论给出直接行为证据。
        对核心可证伪主张(阈值后【下降】而非饱和)支持最直接。
    behavioral_economics:
      status: agree
      weight: 0.6
      evidence: []
      independence_note: |
        与cog_sci用default=0.6(不在independence-model中)。有实质理论重叠
        (Kahneman横跨两域,Simon的satisficing是共享源头),但方法论路径不同:
        实验室认知任务 vs 市场/消费田野与实验。
      note: |
        Iyengar & Lepper(2000) jam study:选项过多→购买率下降+后悔增加,
        是"退化非饱和"的直接市场证据;噪音交易表明信息过多导致更差的投资决策。
        这些后果不能仅由"信息不足"解释,需注意力作为独立约束变量——
        恰好击中证伪条件(b)的反面。
    cultural_universals:
      status: partially_agree
      weight: 0.3
      evidence: []
      independence_note: 与锚源(cog_sci)的pair未列于independence-model,用default=0.6,折半为0.3。
      note: |
        议程设置/声誉捷径/仪式化简化的跨文化普适性,支持"注意力稀缺是
        结构约束而非数字时代特产"。但这些机制与"退化"和"饱和"两种模型
        均相容——无论过载函数是哪种形状,社会都需要管理有限注意力,
        故对核心可证伪主张(阈值后【下降】非饱和)只提供间接支持。判partially_agree。
  iea: 1.9
  verdict: verified
  verdict_note: |
    IEA=1.9(1.0+0.6+0.3)≥1.8,verified。cog_sci+behav_econ两路对"过载→退化"
    提供实验室与市场双通道证据;cult_univ因无法区分退化/饱和被折半。
    命题的不声称条款(chunking扩容/可缓解/非数字独有)已预先划清边界,无护身符化倾向。
  instrument_disclosure: |
    本次三路投票由单一LLM在同一上下文中执行(非独立人类专家/独立文献通道),
    报告的IEA=1.9是"学科独立性"上限,仪器有效独立性低于此
    (independence-model.yaml instrument_correlation折扣)。缓解:信息过载/选择过载
    是多重复现的稳固共识命题(Miller/Kahneman/Iyengar-Lepper均为高引经典),
    真实文献收敛部分缓解单仪器忧虑。

