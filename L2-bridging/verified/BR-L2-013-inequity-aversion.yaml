      note: 15个传统小规模社会的跨文化最后通牒复现(Henrich et al. 2005)。不同于大学生被试池,方法论独立于标准实验室实验(田野实验+非WEIRD人口)。所有社会均拒绝极端不公,方向普适、幅度文化可变。
  iea: 2.1
  verdict: verified
  verdict_note: IEA=2.1(≥1.8 verified阈值)。行为经济学锚定(1.0)、演化生物学+0.6(动物范式独立于人类实验)、文化普适+0.5(田野实验独立于实验室被试池)。三个源两两准独立,结论干净:不公平厌恶是人类(及部分灵长类)的稳健心理特征。
