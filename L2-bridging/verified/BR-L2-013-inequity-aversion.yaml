  - THEOREM-cooperation-precondition
bridges_field: 从公平定义(CONCEPT-fairness)落到可观测的跨物种/跨文化心理反应
applicable_sources:
- behavioral_economics:
    rationale: "最后通牒博弈(ultimatum game)是行为经济学中复现最稳健的发现之一:提议者分一笔钱,回应者若拒绝则双方都得零——回应者系统性地拒绝过低报价(通常<20-30%),即使从'理性自利'角度看接受任何正金额都优于拒绝。独裁者博弈(dictator game)中分配者也系统性地给出非零份额。公共品博弈中搭便车者引发惩罚意愿。以上范式在数十个国家被复现。"
- evolutionary_biology:
    rationale: "Brosnan & de Waal (2003)的卷尾猴实验:两只猴子完成相同任务后,一只得到黄瓜(低价值)、另一只得到葡萄(高价值)——得到黄瓜的猴子拒绝继续参与或扔掉黄瓜。这一'不公平厌恶'反应在与人类亲缘最近的灵长类中被观测到,暗示其演化根底深远。注意:复制争议存在(部分实验未复现),但核心方向(对不公平的自动负反应)跨物种证据稳健。"
- cultural_universals:
    rationale: "Henrich et al. (2005,'Economic Man')在15个传统小规模社会(采集-狩猎/游牧/刀耕火种)中运行最后通牒博弈:无一社会符合纯自利预测,但拒绝行为跨文化差异极大——从Machiguenga(秘鲁亚马逊,几乎全盘接受低价、全样本仅约1次拒绝)到Au/Gnau(PNG,超公平文化、高价也被拒)。拒绝阈值从接近零到接近50%。这说明不利不公平厌恶的方向是跨文化恒定的;但方向普适性弱于幅度差异——幅度高度文化可变。"
falsifiability: |
  证伪分两分支,对应statement中区分的主次主张:

  分支1(不利不公平厌恶——核心主张,声称跨物种/跨文化普适):
  若发现一个人类群体满足以下全部条件:
    (a) 成员在分配博弈中面对客观不平等的结果;
    (b) 且该不平等是"不利的"(自己拿比对方少);
    (c) 但成员既不表现出负情绪,也不以任何代价(如拒绝/退出/减少未来合作)回应——
  则核心主张被证伪。

  分支2(有利不公平厌恶——次级主张,不声称普适):
  有利不公平厌恶本就不声称跨文化普适,其有限主张为:
    (a) 它在部分文化中存在(美/加/乌干达等,Blake et al. 2015);
    (b) 发育时序晚于不利分支(~8岁 vs ~4岁)。
  证伪条件:若被证明(a)在所有文化中完全不存在,或(b)在所有文化中的发育时序
  均不晚于不利不公平分支——则次级主张被证伪。
