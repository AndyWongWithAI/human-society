source_anchors:
- source_id: EV-cu-001
  support: strong
cross_verification:
  votes:
    behavioral_economics:
      status: agree
      weight: 1.0
      evidence: []
      note: |
        锚源(weight 1.0)。最后通牒博弈/独裁者博弈/公共品博弈三类实验范式在数十个国家
        被数百次复现,是行为经济学中复现最稳健的发现集群之一。回应者系统性拒绝过低报价
        (典型阈值 20-30%),以牺牲当期收益为代价惩罚不公平分配——这是有代价的公平执行
        行为,直接支撑"不利不公平厌恶"核心主张。对应 independence-model 的 game_theory
        通道(实验博弈范式)。独立判断:agree——该发现的可复现性在社会科学中属于最高等级,
        跨实验室/跨文化/跨年代一致,不存在实质性争议。
    evolutionary_biology:
      status: agree
      weight: 0.4
      evidence: []
      note: |
        卷尾猴/黑猩猩的不公平厌恶实验(Brosnan & de Waal 2003 起):两只动物完成相同任务
        后获得不同价值奖励(黄瓜 vs 葡萄),获得低价值奖励的个体拒绝继续参与或扔掉奖励。
        该反应在人类亲缘最近的灵长类中被观测到,暗示不公平厌恶的演化根底深远。
        对锚源(game_theory)折算:independence-model 的 evo_bio__game_theory 系数为 0.4
        (两学科在演化博弈论/合作演化/信号理论上共享核心数学结构,"几乎是一棵树")。
        方法论独立性真实存在:动物行为学观测+非语言范式在经验路径上独立于人类实验室博弈,
        有效独立性可能高于 0.4,但按任务要求采用模型成对系数,不引入伪精度。
        独立判断:agree——核心方向(对不公平的自动负反应)跨物种一致,但复制争议客观存在
        (部分实验室未复现卷尾猴效应),此为扣分项,故不宜给满权。该源支撑不利不公平厌恶
        的演化深度,与锚源在经验路径上独立但在理论框架上重叠。
    cultural_universals:
      status: agree
      weight: 0.5
      evidence:
      - EV-cu-001
      note: |
        Henrich et al. (2005, "Economic Man")在15个传统小规模社会(采集-狩猎/游牧/
        刀耕火种/园艺)中运行最后通牒博弈:无一社会符合纯自利预测,但拒绝行为跨文化
        差异极大——从 Machiguenga(秘鲁亚马逊,几乎全盘接受低价、全样本仅约1次拒绝)
        到 Au/Gnau(PNG,超公平报价也被拒)。拒绝阈值从接近零到接近50%。
        对锚源(game_theory)折算:independence-model 的 game_theory__cultural_universals
        系数为 0.5(gt 提供实验范式、cu 提供非 WEIRD 田野样本),故 weight=0.5。
        独立性来自非 WEIRD 人口+田野环境,独立于标准大学生被试池。
        独立判断:agree——不利不公平厌恶的方向跨文化恒定(无一社会符合纯自利预测),
        直接支撑核心主张;但幅度高度文化可变,与桥接砖 statement 中"方向普适性弱于
        幅度差异"的限定一致。该源提供的是跨文化稳健性检验而非全新机制证据。
  iea: 1.9
  verdict: verified
  verdict_note: |
    独立重算 IEA = 1.0(锚源 behavioral_economics→game_theory 通道)
    + 0.4(evo_bio__game_theory 成对系数) + 0.5(game_theory__cultural_universals
    成对系数) = 1.9。三票一致 agree,无 mixed 或 disagree。
    IEA=1.9 ≥ 1.8 verified 阈值,故维持 verified(存量回补审查只可维持或降级,此处维持)。

    仪器折扣披露(依据 independence-model §instrument_correlation / META-REVIEW-001):
    本次投票由单一 LLM(deepseek-v4-pro)执行,非独立人类专家或独立文献通道。
    报告的 IEA=1.9 是【学科独立性上限】——三个"独立"学科的证据实由同一仪器
    (同一 LLM + 其重叠训练语料)读取与判定,统一先验横加到三票上,真实
    【仪器有效独立性低于此】。
    缓解:本命题(不公平厌恶)受多重复现的真实文献收敛支撑(数十国实验室博弈+
    跨物种动物行为学+15个田野社会),属行为科学中少有的稳固共识而非新颖/争议命题,
    单仪器忧虑被真实文献多样性部分缓解;但折扣仍如实披露,不予隐藏。
review_summary: |
  1) 定论:verified, IEA=1.9(锚源1.0+evo_bio 0.4+cultural_universals 0.5),三票一致agree。
  2) 机制有效性:最后通牒/独裁者/公共品三类博弈范式在数十国数百次复现,跨物种灵长类实验+15个非WEIRD田野社会均支撑不利不公平厌恶的跨文化/跨物种普适性;反例猎捕全网扫描无活反例(有利不公平分支本就不声称普适,已如实限定)。
  3) 全档见 ADV-REVIEW-BR-L2-013。
