      note: 卷尾猴/黑猩猩的不公平厌恶实验(Brosnan & de Waal)。方法论与人类实验室实验完全不同(动物行为观察+非语言范式),独立性强。复制争议客观存在,但跨物种证据的方向是一致的。
    cultural_universals:
