bridges_field: 从 L1"交换替代竞争 + 价值归属（稀缺性乘数）"到金的物理属性如何使其在一般等价物筛选中胜出

applicable_sources:
- materials_science:
    rationale: |
      金的物理化学性质：原子序数 79，d 层电子全满→化学惰性（不氧化、不腐蚀）；
      密度 19.3 g/cm³（高价值密度）；莫氏硬度 2.5（足够软以便分割和验证，
      但可以合金化增强硬度）；延展性优秀（1 克金可拉成 3 公里长的线）。
      这些不是经济学家的理论——是物理事实，独立于社会科学方法论。
- archaeology:
    rationale: |
      跨文明对比：美索不达米亚银 shekel（银在旧大陆西部的胜出）、
      中国贝币（殷商时期贝壳在东亚交换网络中的胜出）、
      西非金砂（金在尼日尔河流域的胜出）。不同文明独立"选择"了不同媒介——
      但每个文明中的胜出者都在六维上得分最高。考古学方法独立于材料科学。
- experimental_economics:
    rationale: |
      多商品多轮交易实验：被试在多商品环境中自由交换，
      交易媒介自发收敛到交易成本最低的商品。
      实验方法独立于考古学和材料科学。
- game_theory:
    rationale: |
      搜寻模型（Kiyotaki-Wright 扩展至商品货币选择）：
      商品的持有成本和可接受性共同决定均衡媒介。
      与实验经济学部分共享理论框架，独立性打折。

falsifiability: |
  若发现：(a) 某种文明的一般等价物在六维得分上全面劣于同时期
  该文明可获取的另一种商品——则六维筛选被推翻。
  (b) 六维中任一维可以被删去而不影响筛选的解释力——
  则该维度是"观众砖"，应被移除。
  (c) 六维权重必须从交换网络的特征（交易规模、运输距离、验证技术、
  冶金水平）独立预测——而非从胜出商品反推。如果预设的权重向量
  未能预测正确胜出者（即：最高加权得分的商品并非实际胜出者），
  则局域权重假说被推翻。防绕锁：不允许在结果已知后调整权重
  来使胜出者"刚好"得分最高。

