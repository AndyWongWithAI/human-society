id: BR-L2-024
status: verified
term: 法币信用的连续可逆性与记忆滞后 (Continuous Reversibility and Memory Hysteresis of Fiat Credibility)

人话摘要: "法币的信用不是开关——不是'信任'或'不信任'二选一。它是一条滑梯：可以滑下去（通胀、战争、违约→大家开始把钱换成东西），也可以爬回来（央行重建信誉、通胀回落）。但爬回来的路上有个坑——滑过一次的人，永远记得'这钱曾经不值钱过'，所以永远留一部分钱在别的地方（金、房子、外币）。这就是为什么经历过恶性通胀的国家，民众对金条的感情比没经历过的国家深得多。"

statement: |
  本砖是 BR-L2-022 (d) "功能解耦可逆但不完整"的完整机制展开。
  022 确立"交易媒介与价值储藏可解耦"→024 确立"价值储藏对法币的信心
  是连续谱且恢复不完全（记忆滞后）"。

  法币信用（持有者对该货币未来购买力稳定性的信心）不是二元状态，
  而是连续谱。信用可以沿谱下降（危机→储蓄逃离），也可以沿谱
  部分恢复（重建信誉→储蓄回流）。但恢复是部分的——
  经历过信用崩塌的群体在个体生命周期内持续保留对非法币资产的配置
  （记忆滞后效应）。

  (a) 法币信用连续谱的结构：
      一端的锚：100% 有信心——持有者将长期储蓄以该法币计价资产持有，
      不考虑替代储藏工具。接近端：主要储备货币在稳定期的状态。
      另一端：0% 有信心——无人愿意持有该法币超过完成即时交易所需的时间
      （拿到手立刻换成实物/外币）。
      中间：部分信心——持有者以法币进行日常交易（交易媒介功能仍在），
      但将长期储蓄分散到非法币资产（价值储藏功能部分或全部转移）。

  (b) 信用下滑的触发机制：
      - 通胀侵蚀：法币购买力持续下降→持有者实际财富缩水→寻找抗通胀替代品
      - 政治/制度危机：政府违约、资本管制、银行系统崩溃→
        持有者对发行者的偿付能力和意愿失去信心
      - 外部冲击：战争、制裁、国际收支危机→该货币的国际可接受性下降
      这些触发机制可以是独立事件也可以是叠加的——
      叠加时信用下滑的速度和深度都被放大。

  (c) 记忆滞后效应：
      信用恢复（通胀受控、制度重建、国际信心回升）后，
      储蓄回流到法币资产是不完全的。
      原因：AXIOM-002（信息一旦进入系统就不会自动消失）——
      经历过信用崩塌的 Agent 记住了"此货币曾贬值/此政府曾违约"，
      这个信息成为其信念的一部分，使其对法币的
      信任在个体生命周期内持续低于未经历崩塌的同辈。
      表现：经历过恶性通胀的世代在其整个生命周期中
      持有更大比例的实物资产（金、房产）和外汇资产；
      货币改革后新发行的"新货币"需要更长的时间才能
      获得未经历崩塌的年轻世代的完全信任。
      【证据链与诚实标注】Malmendier & Nagel (2011) 发现
      经历过 1970s 高通胀的美国人股票投资比例长期低于未经历者——
      效应在 30+ 年后仍统计显著。但该研究的因变量是股票市场参与率，
      非黄金持有。通胀记忆→低股票持有→？→高黄金持有的链路中，
      "？"这一步（这些资金去了哪里）缺乏同等质量的直接证据。
      因此：(i) 通胀记忆→替代资产（非法币）偏好有直接证据；
      (ii) 替代资产中黄金的占比是否被通胀记忆系统性地提高——
      有经济史案例支持（德国、津巴布韦黄金溢价）但缺乏
      类似 M&N 的大样本纵向证据。本砖将此缺口标为此处——
      推论层使用此桥接时应承受相应的置信度折扣。
      【"永久"的精确含义】记忆滞后效应指个体生命周期内持续；
      代际传递（未亲身经历的子女是否继承父母的通胀记忆/资产偏好）
      是独立经验问题——M&N 未覆盖，本砖不为"代际永恒"背书。

  (d) 连续谱的操作化锚点（至少一个可行测量路径）：
      信用连续谱可用以下代理变量操作化（不同代理捕捉谱的不同段）：
      - CDS 利差（主权信用违约互换）：捕捉极端低信用段（接近违约预期）
      - 通胀预期调查（如密歇根大学 5 年通胀预期）：捕捉中间段
      - 货币流通速度：捕捉极端低信用段（货币被尽快脱手）
      - 本币存款/外币存款比：捕捉中低段（储蓄逃离程度）
      本砖不要求所有推论使用同一代理——只需至少一个可行路径
      使"连续谱"不被永久免疫于操作化。

  (e) 连续谱的实证意义：
      信用连续谱的存在意味着金价不是二元受激的
      （"信用完好→无金需求" vs "信用崩溃→全仓金"）。
      金的需求（作为价值储藏替代品）随法币信用在连续谱上
      滑动而平滑变化。这为金价波动的连续模型（而非开关模型）
      提供了行为基础。

bridges_to:
  concepts: [CONCEPT-value, CONCEPT-information]
  axioms: [AXIOM-002]
  theorems: [THEOREM-value-attribution]
bridges_field: 从 L1"价值归属（E_network 基于信心）+ 信息不自动消失（AXIOM-002）"
  到法币信用的连续可逆性和记忆滞后如何驱动金的需求

applicable_sources:
- behavioral_economics:
    rationale: |
      Malmendier & Nagel (2011) "Depression Babies"：通胀经历对投资行为
      的长期影响——个人经历的通胀率影响其几十年后的资产配置。
      这是记忆滞后效应的最直接经验证据。方法论独立于宏观经济理论。
- economic_history:
    rationale: |
      德国马克三次重生（1923 超级通胀→紧急马克→帝国马克→德国马克→欧元）：
      每次货币改革后民众对纸币的信任都需要代际时间来重建。
      魏玛通胀的经历在德国央行文化中留下深刻烙印（"永不通胀"的
      德国央行 DNA）——制度层面的记忆滞后。
      津巴布韦 2008 年恶性通胀后美元化经济——即使本地货币后来恢复，
      民众和国际市场的信任远未回到崩塌前水平。
- macroeconomics:
    rationale: |
      货币信用理论（money as credit/trust）：法币的价值源于使用者
      对其未来购买力的信心。信心可以因制度承诺（央行独立性、
      财政纪律）而建立，因制度失信而毁灭。
      连续谱模型的宏观经济理论基础。

falsifiability: |
  若发现：(a) 经历过严重通胀/违约的群体与未经历过的群体在长期
  资产配置上无统计差异——则记忆滞后效应被推翻。
  (b) 法币信用崩塌后，信用恢复总是 100% 完整（储蓄完全回流，
  无任何永久性替代资产配置增加）——则连续可逆性被推翻。
  (c) 新生代际在未亲身经历通胀的情况下，与经历过的父母代
  持有同样的非法币资产偏好——则记忆传递可能有社会学习路径
  （父母告诉孩子"别存钱，买金子"），记忆滞后不限于亲身经历。
  这并非推翻本命题（反而扩展了它的范围），但需要将"记忆"
  从个体亲身经历扩展为代际传递的社会记忆。

cross_verification:
  votes:
    behavioral_economics:
      status: agree
      weight: 1.0
      evidence: []
      note: |
        Malmendier & Nagel (2011) 通胀经历对投资行为的长期影响。
        经验证据直接支持记忆滞后效应。证据强度：strong（大样本、
        纵向数据、统计显著）。
    economic_history:
      status: agree
      weight: 0.5
      evidence: []
      note: |
        德国马克、津巴布韦等案例——信用恢复不完全的经验实例。
        史料方法独立于行为经济学实验。
    macroeconomics:
      status: agree
      weight: 0.4
      evidence: []
      independence_note: |
        货币信用理论——法币价值的信心基础。
        与行为经济学共享部分理论前提（理性预期 vs 经验学习），
        独立系数 0.4。
  iea: 1.9
  verdict: verified
  verdict_note: |
    IEA = 1.0(behavioral) + 0.5(history) + 0.4(macro) = 1.9 ≥ 1.8
    → 行为经济学 + 经济史两个准独立来源支持。
    待审查：AXIOM-002（信息不消失）在此的应用是否过度延伸——
    信息不消失 ≠ 记忆永远影响行为，需要额外的行为机制桥接。

