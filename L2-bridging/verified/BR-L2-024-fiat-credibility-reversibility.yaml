revision_note: "对抗审后修正：(1)Malmendier&Nagel证据链断开处诚实标注——通胀记忆→股票参与有证据，通胀记忆→金持有缺直接证据；(2)'永久'精确为'个体生命周期内持续'，不为代际永恒背书；(3)新增(d)信用连续谱的操作化锚点（CDS/通胀预期/货币流速/本外币存款比）；(4)显式声明本砖是BR-L2-022(d)的机制展开"
