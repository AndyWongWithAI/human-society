id: BR-L2-010
status: verified
term: 非人格化制度能替代人际信任支撑陌生人交换 (Impersonal Institutions Can Substitute for Interpersonal Trust in Stranger Exchange)

人话摘要: "熟人之间靠交情办事;陌生人之间没交情,怎么放心交易?答案是把'信任'外包给制度——第三方执法、声誉登记、标准合同、抵押/货币。这些'非人格化'安排让互不相识的人也能安全交易,等于用制度替掉了人情。它是天花板之外那条'另想办法'的路。注意:本砖只说这条路【走得通】,不说它【一定会被走】——那留给推论在具体条件下预测。"

statement: |
  在缺乏人际信任的陌生人之间,一组【非人格化制度】能替代人际信任、支撑交换:
  第三方执行(法庭/权威/行会)、声誉登记与信息中介、标准化契约、抵押担保与货币。
  其机制是【把履约保障从"我了解你这个人"转移到"违约会被一个不依赖私人关系的系统
  惩罚/曝光"】——使 THEOREM-cooperation-precondition 所说的"陌生人合作替代机制"
  得以制度化落地。
  (a) 这些制度【能】在匿名/一次性/跨群体的交换中,支撑本会因缺信任而流产的交易;
  (b) 它们【不免费】:建立与运行消耗资源,且各自只填补特定信任缺口(执行缺口、
      信息缺口、承诺缺口)。
  本命题只主张"可替代"(capability),不主张"总会被采用",也不主张"完全替代人际信任"。

bridges_to:
  concepts: [CONCEPT-exchange, CONCEPT-norm, CONCEPT-cooperation, CONCEPT-information]
  axioms: [AXIOM-003]
  theorems: [THEOREM-cooperation-precondition, THEOREM-relation-information-asset]
bridges_field: 从 L1"陌生人合作需替代机制"到可观测的非人格化交换制度

applicable_sources:
- game_theory:
    rationale: |
      机制设计与重复博弈的制度化:第三方执行、声誉机制(Kandori 社区执行、
      Milgrom-North-Weingast 的 law-merchant 模型)、抵押担保,把一次性陌生人博弈
      转化为有惩罚影子的可执行博弈。本命题最直接、最强的形式化来源。
- cultural_universals:
    rationale: |
      经济史与跨文化制度证据:Greif 的马格里布 vs 热那亚商人、社区责任制;地中海/
      中国/北非商帮的声誉与行会执行;票据信用、公证、度量衡与货币标准化在多个文明
      独立出现。物质与档案方法独立于博弈论。
- evolutionary-biology:
    rationale: |
      文化演化(Henrich、Boyd-Richerson):具第三方惩罚规范与市场型制度的社会能把
      合作扩展到陌生人并在竞争中扩张(市场整合与亲社会性的跨文化相关研究)。与 gt
      部分共享"制度即扩展合作"逻辑,独立性打折;其群体选择成分尚有争议。

falsifiability: |
  若发现陌生人之间的大规模交换普遍地【无需】任何非人格化制度(无第三方执行、无
  声誉/契约/担保),仅靠临时人际信任即可稳定支撑;或这些制度被证明【不能】在匿名
  交换中替代人际信任(引入后陌生人交易并不因此变得可行)——则本命题被削弱。

cross_verification:
  audited: 2026-07-15
  audit_type: 存量回补审查(独立 IEA 重算,只可维持或降级)
  votes:
    game_theory:
      status: agree
      weight: 1.0
      evidence: []
      note: |
        锚源。机制设计/重复博弈的制度化——law-merchant 模型
        (Milgrom-North-Weingast 1990)、社区执行(Kandori 1992)、抵押担保与
        机制设计,形式化证明第三方执行+声誉系统【能】支撑匿名/一次性交换。
        直接命中命题的 capability 主张。证据强度 strong。
    cultural_universals:
      status: agree
      weight: 0.5
      evidence: []
      note: |
        经济史/档案通道——Greif 马格里布联盟 vs 热那亚双边/法律制度、社区责任制、
        香槟集市、公证与票据信用、行会执行;铸币与度量衡标准化在吕底亚/中国/印度
        等文明独立出现。方法(档案/物质证据)独立于博弈论形式化,成对独立系数 0.5。
        诚实备注——Edwards-Ogilvie(2012)对马格里布联盟实证曾提出质疑,但中世纪
        非人格化执行制度的更广档案记录依然稳固,agree 成立。
    evolutionary_biology:
      status: agree
      weight: 0.4
      evidence: []
      note: |
        文化演化通道(Henrich、Boyd-Richerson)——Henrich 等 2010 跨 15 社会的
        市场整合与匿名公平/第三方惩罚相关研究,支持"市场型制度扩展陌生人合作"。
        但证据是相关性而非因果,实验范式(最后通牒等)与 gt 共享,群体选择成分有
        争议;对锚源成对系数 0.4(对 cu 为 0.6,取更严的 0.4 避免重复计权)。
  iea: 1.9
  verdict: verified
  verdict_note: |
    重算 IEA = 1.0(gt 锚) + 0.5(cultural_universals 对锚折算) + 0.4(evo_bio 对锚
    折算,已取与已计源的最小系数防重复计权) = 1.9 ≥ 1.8 → 维持 verified。
    三通道均 agree,无有资格的反对票;命题只主张 capability(可替代),不主张必然
    采用,证伪条款完好。仪器折扣披露——本次三路投票由单一 LLM 执行,报告的
    IEA=1.9 是【学科独立性上限】,仪器有效独立性低于此(见 independence-model 的
    instrument_correlation discount_rule)。
  instrument_disclosure: |
    三路投票由单一 LLM 执行,同一仪器+重叠语料读取三个学科通道。IEA=1.9 是学科
    独立性上限,仪器有效独立性低于此。缓解——本命题属制度经济学多重复现的稳固
    共识(North/Greif/Milgrom-North-Weingast 有真实文献收敛),且经济史档案证据
    与形式模型方法论路径确实不同,单仪器忧虑被部分缓解,但不消除。
  honest_note: |
    本命题偏"制度经济学教科书"(North/Greif)。这不是缺陷——L2 砖的职责是当经验锚,
    新颖性应体现在其上的推论(交换规模突破信任上限 ⇒ 制度外化的阈值/可逆/领域特定
    预测),而非砖本身。且本命题只声称"可替代",不声称"必被采用"——后者留给推论去在
    杠杆条件下预测。

