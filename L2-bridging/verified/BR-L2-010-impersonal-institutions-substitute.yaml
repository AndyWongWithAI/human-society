review_summary: |
  定论:verified,IEA=1.9(gt 锚 1.0 + cu 0.5 + evo_bio 0.4)。
  机制有效:第三方执行/声誉/契约/担保把履约保障从私人关系移到系统惩罚,三通道 agree,反例猎捕无活反例(Edwards-Ogilvie 质疑仅削单案例,不撼广档案)。
  全档见 ADV-REVIEW-BR-L2-010。

