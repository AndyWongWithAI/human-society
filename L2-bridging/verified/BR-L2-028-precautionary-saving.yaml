cross_verification:
  votes:
    behavioral_economics:
      status: agree
      weight: 1.0
      evidence: []
      note: |
        锚源。buffer-stock 形式化模型(Deaton 1991, Carroll 1997)建立了"目标财富比"
        的理论框架,将预防性储蓄从储蓄总量中分离为对不确定性敏感的独立分量。
        因果级证据来自政策准实验:Engen & Gruber(2001 JME)利用美国各州失业保险
        慷慨度的外生差异,发现 UI 更慷慨州的家庭金融资产显著更低;Gruber &
        Yelowitz(1999)利用 Medicaid 扩张得到同向结果——保障对私人缓冲的替代
        关系有外生政策变异支撑,非仅结构模型拟合或截面相关。Carroll & Samwick
        (1998 REStat)的实证估计独立确认收入不确定性对财富持有的正向贡献。
        多重独立复现的稳固共识文献,判 agree。
    economic_history:
      status: agree
      weight: 0.5
      evidence: []
      independence_note: |
        与锚源(behavioral_economics)的学科对未列于 independence-model 的
        source_pairs,适用 default_independence=0.6。下调至 0.5 的理由:
        本通道承重的因果级证据(NCMS/台湾健保 DID)与锚源(Engen-Gruber/
        Gruber-Yelowitz)同属"公共保险挤出私人储蓄"研究纲领——共享应用微观
        计量方法、引用网络与核心问题意识;NCMS/台湾研究是同一纲领在不同制度
        环境中的延伸应用,非独立学科通道的确证。通道真正来自经济史学科传统
        方法的独立证据(前现代农业社会实物储备模式/社保建立前东亚高储蓄的
        跨期比较)仅属背景级混淆证据、不独立承重。承重部分不独立,独立部分
        不承重——default 0.6 不能如实反映有效独立性,压至 0.5。
      note: |
        缺乏正式保障的前现代农业社会普遍维持高实物储备(谷仓/牲畜)——与命题
        方向一致的历史背景证据,但受人口结构、增长率、金融发展等严重混淆。
        中国新农合(NCMS)推开后多项 DID 研究(如 Bai & Wu 2014)发现参保农户
        非医疗消费显著上升、预防性储蓄下降;台湾 1995 全民健保后家庭储蓄率
        下降(Chou, Liu & Hammitt 2003 JPubE)。NCMS/台湾政策变异在与锚源
        不同的制度环境(农村中国/东亚新兴工业化经济体)中同向复现了保障→消费
        释放的替代关系,判 agree。对称披露:同样混淆的横截面存在方向相反的
        案例——美国社会保障弱于德/法而家庭储蓄率反而系统性更低(信贷可得性/
        资产升值/既有 Medicaid-Medicare 为混淆因子);横截面证据双向均不作数。
        仅承重的政策准实验跨制度复现提供独立方向确认,权重按独立性压至 0.5。
    cultural_universals:
      status: mixed
      weight: 0.3
      evidence: []
      independence_note: |
        与锚源(behavioral_economics)的学科对未列于 independence-model 的
        source_pairs,适用 default_independence=0.6。进一步折半至 0.3 的理由:
        本通道的证据(猎物分享规范/谷仓/互助会/ROSCA 的跨文化普适性)仅直接
        支撑命题的(a)段机制与(c)段功能等价物主张——证明"风险缓冲功能是结构
        约束而非文化特例";对核心比较静态(b)段"保障扩张→私人缓冲下降"的
        替代关系仅提供间接支持,且证据本身为纯相关性(民族志观察),无法单独
        区分预防动机与再分配/社会纽带维护等并存功能。default 0.6 × 0.5
        (仅部分支撑命题核心主张) = 0.3,沿用 BR-L2-027 的折算判例。
      note: |
        狩猎采集社会的猎物分享规范(对冲单个猎手的产出波动,Kaplan & Hill/
        Cashdan 一线民族志)、家户与公共谷仓、亲族互助义务网络、轮转储蓄
        互助会(ROSCA)在西非/东亚/拉美/南亚独立反复出现——"风险缓冲功能"
        的跨文化普适性支持(a)机制与(c)功能等价物主张,表明为不可保险的未来
        风险持有缓冲是人类社会的结构约束、非文化特例。但该证据纯相关,无法
        单独区分预防动机与再分配/社会纽带维护等并存功能,且对(b)段"保障扩张
        →私人缓冲下降"的替代关系仅提供间接支撑(砖文件 applicable_sources
        已诚实预标注此局限)。判 mixed。
  iea: 1.8
  verdict_note: |
    IEA = 1.0(锚源 behavioral_economics) + 0.5(economic_history, default
    independence 0.6→压至 0.5) + 0.3(cultural_universals, default independence
    0.6→折半至 0.3) = 1.8。恰在 verified 下限(IEA ≥ 1.8),余量为零。

    逐源独立评估摘要:
    (1) behavioral_economics(锚源):准实验因果证据(UI/Medicaid 政策变异)支撑
    核心比较静态——保障→私人缓冲下降的替代关系有外生变异识别,非仅结构模型
    拟合。多重独立复现的稳固共识,判 agree,权重 1.0。
    (2) economic_history:NCMS/台湾健保 DID 在不同制度环境中同向复现替代关系,
    判 agree。但承重的 DID 证据与锚源同研究纲领(共享方法/引用网络/问题意识),
    独立通道仅在历史横截面部分(不承重),default 0.6 压至 0.5。对称披露了美欧
    反向混淆横截面。
    (3) cultural_universals:跨文化证据支撑机制普适性(a/c 段),但对核心比较静态
    (b 段)仅间接支持,证据纯相关,判 mixed。default 0.6 折半至 0.3(部分支撑折扣)。

    命题边界清晰:四条"不声称"条款(非全解释/不要求最优动态规划/缓冲形态中立/
    非一比一挤出)预先划定了边界,无护身符化倾向。证伪口径已事前注册:最小可检
    效应为储蓄率变化 1pp 或挤出弹性 0.1;净化口径为消费反应净掉现金等价转移价值
    后为零即证伪;缓冲集限定为事前注册可测清单(存粮/牲畜/互助会/记录转移网络),
    禁事后诉诸未测亲族义务开脱。

    【仪器折扣披露 — instrument_correlation.discount_rule】
    本次三路投票由单一 LLM 在同一上下文执行,非独立人类专家或独立文献通道——
    报告的 IEA=1.8 是"学科独立性"上限,仪器有效独立性低于此。缓解:预防性储蓄/
    buffer-stock 是多重复现的稳固共识文献(Deaton/Carroll/Engen-Gruber 均为高引
    经典,被多国数据、多方法独立验证),真实文献收敛部分缓解单仪器忧虑,但不消除。
    若本命题属新颖/争议命题则此折扣为承重红旗;预防性储蓄因文献共识深厚,
    此折扣为黄色警告而非红色,但余量为零(IEA=1.8 恰在下限)意味着仪器折扣若量化
    则可能使有效 IEA 跌破 verified 阈值——Finalize 阶段需将此纳入裁决考量。
