  到金的非货币需求作为 E_network 冷启动的机制

applicable_sources:
- archaeology:
    rationale: |
      瓦尔纳墓地（保加利亚，公元前 4600-4200 年）：已知最早的加工黄金——
      金饰出现早于任何铸币 5000+ 年。埃及、美索不达米亚、印加、中国
      均独立发展了金饰/金器传统。田野/史料方法独立于所有社会科学。
- anthropology:
    rationale: |
      跨文化地位信号理论：高价值密度+耐久+光泽使金成为近乎通用的
      财富信号。不同文化独立地将金用于地位展示——与各自的语言、
      宗教、政治结构无关。人类学田野方法独立于考古学。
- materials_science:
    rationale: |
      金的物理属性使其天然适合装饰加工：延展性（1 克→3 公里线）、
      色泽（唯一具有黄色金属光泽的金属，所有其他金属均为银/灰色）、
      抗腐蚀（不氧化不变色）。物理事实独立于所有社会科学方法论。

falsifiability: |
  若发现：(a) 存在某种商品在权威指定缺位（无法律/制度强制接受）
  且无非货币需求基底（U ≈ 0 且无地位/仪式/审美用途）的情况下，
  通过自然涌现路径独立冷启动了 E_network 正反馈并成为一般等价物——
  则本砖的自然涌现必要条件主张被推翻。
  【诚实标注】此条件的检验受考古学"无证据≠不存在"的固有局限——
  难以证明某商品在历史上确实无任何非货币用途。
  该局限不使本砖免疫于证伪（自然实验/实验经济学可提供替代检验），
  但降低了检验的可操作性。
  (b) 金的装饰/仪式用途在时间上晚于其货币用途——即先有金币后有金饰
  （考古学证据已强烈反向：金饰远早于金币，瓦尔纳墓地公元前 4600-4200）。
  (c) 在控制了权威指定强度后，非货币需求基底的存在与
  E_network 的自然涌现速度无关——则冷启动加速假说被推翻
  （必要性假说可独立存活）。

