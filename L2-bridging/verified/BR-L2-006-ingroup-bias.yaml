id: BR-L2-006
status: verified
term: 内群体偏好 (Ingroup Bias)
statement: '人类倾向于对自己所属群体（ingroup）的成员给予优待——

  在资源分配中多给、在合作中更信任、在冲突中偏袒——

  即使群体划分是基于任意或微不足道的标准（如随机分配的颜色标签）。

  这种偏好的强度随群体认同的显著性而增加。

  '
人话摘要: "人天生偏袒‘自己人’——分东西多给、更信任、有矛盾时也护着；哪怕‘自己人’只是随手按颜色标签这种没意义的方式分出来的，这种偏心照样出现。"
bridges_to:
  concepts:
  - CONCEPT-group
  - CONCEPT-competition
  - CONCEPT-norm
  - CONCEPT-cooperation
  axioms:
  - AXIOM-001
  theorems:
  - THEOREM-group-identity-decay
bridges_field: 从 L1 群体身份衰减到可观测的人类群体间行为差异
applicable_sources:
- evolutionary-biology:
    rationale: '''狭隘利他主义''(parochial altruism) —— 对内群体利他 + 对外群体敌意的联动演化。 灵长类群体间竞争（黑猩猩''战争''）为内群体偏好提供了
      演化背景。群体选择理论提供了形式化框架（争议中）。'
- game_theory:
    rationale: Tajfel 的 minimal group paradigm (1970) —— 仅通过随机分配的颜色标签就能引发资源分配中的内群体偏好。
      这个实验在多种文化中被复现。群体间歧视的博弈论模型 （如 Schelling 的 segregation model）。
- cultural_universals:
    rationale: 民族中心主义 (ethnocentrism) 在所有文化中都存在—— 每个社会都发展出了'我们 vs 他们'的区分体系。 但具体的群体边界（血缘/语言/宗教/地域）因文化而异——
      这说明内群体偏好是普适的倾向，但附着于文化特定的群体定义。
falsifiability: "若发现一个人类群体:\n(a) 成员明确认同自己属于该群体（有共享身份）；\n(b) 且该群体与至少一个外群体有可观测的互动；\n\
  (c) 但成员在资源分配、信任、合作中对待内群体和外群体成员\n    完全没有统计显著的差异——\n则本命题被证伪。\n"
