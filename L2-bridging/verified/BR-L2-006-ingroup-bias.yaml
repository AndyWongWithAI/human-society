        外群体敌意为联动演化策略,为内群体偏好提供演化解释框架。

        灵长类实证:黑猩猩群体间攻击行为(Goodall 1986; Wrangham 1999)提供跨物种
        比较基础。倭黑猩猩(Pan paniscus)对照——与黑猩猩同等近缘(共享祖先约6–7 mya),
        群际交往相对和平(Furuichi 2011; Tan & Hare 2013)——说明群际攻击在人类谱系中
        非演化必然,而是有条件表达的策略。此对照不削弱现象存在性论证,但提升证据诚实度。

        对锚源折算:取 default_independence=0.6。演化理论/比较行为学 vs 受控实验——
