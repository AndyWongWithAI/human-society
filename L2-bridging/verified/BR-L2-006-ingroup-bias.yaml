      evidence: []
      note: |
        【锚源】Tajfel 最小群体范式(1970):仅通过随机颜色标签等任意标准划分群体,
        即可在资源分配矩阵中稳定触发内群体偏好。该效应在数十种文化中被独立复现
        (meta-analysis: Mullen, Brown & Smith 1992),实验证据极其稳健。范式属实验
        社会心理学(社会认同理论, Tajfel & Turner 1979),不使用博弈论的形式工具
        (Nash 均衡/ESS/复制者动态)。选为锚源(权重 1.0)——实验方法直接测量行为,
        跨文化复现规模最大,证据质量为三源最高。

        与 evo_bio 的独立性:independence-model 无 evo_bio__social_psych 直接系数,
        采用 default_independence=0.6。社会心理学与演化生物学方法论根本不同(受控实验
        vs 演化理论/比较行为学),不共享 evo_bio__game_theory 的数学结构(ESS/复制者
        动态/信号理论),独立性应高于该对(0.4)。0.6 属合理保守估计。

        与 cultural_universals 的独立性:independence-model 无 social_psych__cu 系数,
        采用 default_independence=0.6。两者均属行为科学但证据通道独立(实验 vs 田野观察);
        "跨文化社会心理学"桥梁领域存在但核心发现各自独立获得。
    evolutionary_biology:
      status: agree
      weight: 0.6
      evidence: []
      note: |
        狭隘利他主义(parochial altruism, Choi & Bowles 2007)将内群体利他与外群体敌意
        作为联动演化策略建模,为内群体偏好提供了稳健的演化解释。灵长类群体间攻击行为
        (黑猩猩"战争", Goodall 1986; Wrangham 1999)提供跨物种实证基础。倭黑猩猩对照
        (Pan paniscus):与黑猩猩同等近缘(共享祖先 ~6-7 mya),但群际交往相对和平
        (Furuichi 2011, Tan & Hare 2013)——说明内群体偏好/群际攻击在人类谱系中非演化
        必然,而是有条件表达的策略。此对照不削弱现象存在性论证,但提升证据呈现的诚实度。

        对锚源(social_psychology)折算:independence-model 无此对系数,
        采用 default_independence=0.6。方法论根本不同(演化理论 vs 受控实验),
        不共享演化博弈论数学结构——独立性高于原 game_theory 对(0.4)。
    cultural_universals:
