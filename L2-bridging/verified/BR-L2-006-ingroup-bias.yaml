  verdict_note: |
    【IEA 重算】(2026-07-15 存量回补审查,全流程独立重跑):

    名义 IEA = 1.0(social_psychology 锚) + 0.6(evo_bio, default=0.6) + 0.6(cu, default=0.6) = 2.2

    保守 IEA(校正 evo_bio-cu 残余重叠):
    independence-model 给出 evo_bio__cultural_universals 独立性=0.6,即 40%重叠。
    cu 对 IEA 的有效贡献 = 0.6 × (1 - 0.4) = 0.36。
    保守 IEA = 1.0 + 0.6 + 0.36 = 1.96 ≥ 1.8 verified 阈值。维持 verified。

    【与上次审查(同日初版)的关键差异】:
    上次审查在锚源从 game_theory 重新分类为 social_psychology 后,仍沿用原 game_theory
    成对系数(evo_bio 0.4 / cu 0.5),得出名义 IEA=1.9 / 保守 IEA=1.7(低于 verified 阈值)。
    本次重算识别出:social_psychology 不共享 evo_bio__game_theory 的核心数学结构
    (ESS/复制者动态/信号理论)——使用 0.4 系统性地低估了 social_psych 与 evo_bio
    的独立程度。修正后采用 default_independence=0.6,保守 IEA 从 1.7 升至 1.96。
    上次审查将 IEA 低估约 0.26 当量;修正后保守 IEA 稳固超过 verified 阈值,无需降级疑虑。

    【independence-model 覆盖缺口】:
    independence-model.yaml 当前仅覆盖 evo_bio/game_theory/cultural_universals 三源
    的两两系数。social_psychology 的所有成对系数均走 default=0.6。建议后续将
    social_psychology 正式校准入库(为 evo_bio__social_psych 和 social_psych__cu
    提供专用系数,替代当前 default 占位)。

    【仪器折扣披露】(依据 independence-model.yaml instrument_correlation discount_rule):
    本投票由单一 LLM 执行——报告 IEA=1.96 是"学科独立性"上限,"仪器有效独立性"低于
