        即可在资源分配矩阵中稳定触发内群体偏好。该效应在数十种文化中被独立复现
        (meta-analysis: Mullen, Brown & Smith 1992),实验证据极其稳健。

        重要分类修正(2026-07-15 回补审查):本锚原标记为"game_theory",现重新标记为
        "social_psychology"。Tajfel 范式属实验社会心理学(社会认同理论, Tajfel & Turner
