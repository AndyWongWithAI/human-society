  iea: 1.96
  verdict: verified
  verdict_note: |
    【IEA 独立核算】(2026-07-15,存量回补审查,独立调查员全流程重跑):

    名义 IEA = 1.0(social_psychology 锚) + 0.6(evo_bio, default=0.6)
             + 0.6(cultural_universals, default=0.6) = 2.2

    保守 IEA(校正 evo_bio–cultural_universals 残余重叠):
    independence-model 给出 evo_bio__cultural_universals 独立性=0.6,
    即两源有 40% 重叠(共享人类行为生态学桥梁)。
    cu 有效贡献 = 0.6 × (1 − 0.4) = 0.6 × 0.6 = 0.36
    保守 IEA = 1.0 + 0.6 + 0.36 = 1.96

    1.96 ≥ 1.8(verified 阈值) → 维持 verified。

    【independence-model 覆盖缺口】:
    当前 independence-model.yaml 仅覆盖 evo_bio/game_theory/cultural_universals
    三源的两两系数。social_psychology 作为本砖锚源,其所有成对系数均走
    default_independence=0.6(占位值,非校准值)。建议后续将 social_psychology
    正式校准入库(为 evo_bio__social_psych 与 social_psych__cu 提供专用系数)。

    【仪器折扣披露】(依据 independence-model.yaml instrument_correlation discount_rule):
    本投票由单一 LLM 执行——报告 IEA=1.96 是"学科独立性"上限,"仪器有效独立性"
    低于此值(同一 LLM + 重叠训练语料将统一先验横加于三票)。

    缓解因素:Tajfel 最小群体效应(核心锚)属百次以上跨文化复现的稳固共识发现,
    受真实文献收敛支撑——单仪器忧虑被缓解(mitigation 适用,类比 BR-L2-001 有限理性
    与 BR-L2-002 亲缘利他)。显著性调节子主张与跨领域覆盖的收敛强度低于核心锚,
    保守 IEA 计算已对此有所体现。
