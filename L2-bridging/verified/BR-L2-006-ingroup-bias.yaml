bridges_field: 从 L1 群体身份衰减到可观测的人类群体间行为差异
applicable_sources:
- evolutionary-biology:
    rationale: '''狭隘利他主义''(parochial altruism) —— 对内群体利他 + 对外群体敌意的联动演化。 灵长类群体间竞争（黑猩猩''战争''）为内群体偏好提供了
      演化背景。群体选择理论提供了形式化框架（争议中）。'
- social_psychology:
    rationale: Tajfel 的 minimal group paradigm (1970) —— 仅通过随机分配的颜色标签就能引发资源分配中的内群体偏好。
      这个实验在多种文化中被复现。注:该范式属实验社会心理学(社会认同理论,Tajfel & Turner 1979),非博弈论——它不使用 Nash 均衡/ESS 等形式工具。群体间歧视的博弈论模型(如 Schelling 的 segregation model)是后续形式化,非本锚的学科归属。
- cultural_universals:
    rationale: 民族中心主义 (ethnocentrism) 在所有文化中都存在—— 每个社会都发展出了'我们 vs 他们'的区分体系。 但具体的群体边界（血缘/语言/宗教/地域）因文化而异——
      这说明内群体偏好是普适的倾向，但附着于文化特定的群体定义。
falsifiability: |
  证伪分两层,对应 statement 中区分的主次主张:

  核心层(Tajfel 最小群体效应——资源分配中的内群体偏好):
  若发现一个人类群体满足以下全部条件:
    (a) 成员明确认同自己属于该群体(有共享身份);
    (b) 且该群体与至少一个外群体有可观测的互动;
    (c) 但成员在资源分配中对待内群体和外群体成员完全没有统计显著的差异——
  则核心主张被证伪。

  延伸层(信任、合作、冲突中的内群体偏好):
  若(a)(b)同上,同时:
    (c') 成员在信任、合作、冲突三个领域中【任一领域(OR逻辑)】对待内/外群体
        成员无统计显著差异——则该延伸领域的主张被削弱(不证伪核心,但限制其推广范围);
    (c'') 若三个延伸领域【均(AND逻辑)】无显著差异——则延伸主张被整体证伪。

  默认操作化建议(在经验检验前可精化):
  - α=0.05(双尾);
  - "明确认同"=自报 Likert ≥4/5 或多指标聚合;
  - "可观测互动"=经济交易、社会交往两类中至少任一类;
  - 资源分配测量:最后通牒/独裁者/公共品博弈或等价行为经济学范式;
  - 信任测量:信任博弈(trust game)或自报信任量表;
  - 合作测量:公共品博弈或等价合作任务;
  - 冲突测量:群际攻击/歧视行为或态度量表。

  显著性调节子主张的独立证伪:
  若在已按上述规程独立测量显著性的条件下,发现显著性-偏好强度的相关性
  (meta-analytic 加权 r)的 95% CI 包含零——则子主张被证伪。
