        meta-analysis (Mullen, Brown & Smith 1992) 确认效应稳健,证据质量为三源最高。

        选为锚源的理由:实验方法直接测量行为(资源分配决策),非问卷自报亦非模型推导;
        跨文化复现规模最大;方法论污染最少——不使用博弈论数学工具(Nash 均衡/ESS/
