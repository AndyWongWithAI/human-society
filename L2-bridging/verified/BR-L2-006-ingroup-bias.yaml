      evidence: []
      note: |
        狭隘利他主义(parochial altruism, Choi & Bowles 2007)将内群体利他与外群体敌意
        作为联动演化策略建模,为内群体偏好提供了稳健的演化解释。灵长类群体间攻击行为
        (黑猩猩"战争", Goodall 1986; Wrangham 1999)提供跨物种实证基础。机制层面的
        争议(群体选择 vs 多层次选择)不影响现象存在性本身。
        倭黑猩猩对照(Pan paniscus):与黑猩猩同等近缘(共享祖先 ~6-7 mya),但群际交往
        相对和平(Furuichi 2011, Tan & Hare 2013)——说明内群体偏好/群际攻击在人类谱系中
        非演化必然,而是有条件表达的策略。此对照不削弱论证,但提升证据呈现的双向诚实度。
        对锚源(social_psychology)折算:independence-model 无 social_psychology 直接系数,
        沿用原 game_theory 成对系数 evo_bio__game_theory=0.4(两学科在演化博弈论上共享
        数学结构);源标签偏移使此系数校准基础存在不确定性,已在 verdict_note 披露。
    social_psychology:
      status: agree
      weight: 1.0
      evidence: []
