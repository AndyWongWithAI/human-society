    ≥ 1.8 verified 阈值(名义值)。

    【IEA 源分类修正 + 保守核算】(2026-07-15 回补审查 required-iea-reclassification):
    原锚源标记为"game_theory",现更正为"social_psychology"(Tajfel 范式属实验社会心理学)。
    影响:
    (a) independence-model 成对系数按博弈论校准,社会心理学的重叠结构可能不同——
       当前沿用原系数(evo_bio 0.4 / cu 0.5),其保守性未经验证。
    (b) cu 权重未对 evo_bio 残余重叠(evo_bio↔cu 成对独立性 0.6→40%重叠)做进一步折扣。
       保守 IEA = 1.0 + 0.4 + 0.5×(1-0.4) = 1.0 + 0.4 + 0.3 = 1.7 < 1.8 verified 阈值。
    名义 IEA=1.9 可能高估真实独立来源多样性——分类偏移+三源残余重叠+单 LLM 仪器
