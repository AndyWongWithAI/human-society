id: BR-L2-017
status: verified
term: 分配规范随语境切换 (Context-Dependent Allocation Norm Switching)
statement: |
  同一群人在不同情境中会切换不同的公平分配标准:
  共享/共居的情境默认采用"平等分"或"按需要分";
  交易/生产的情境默认采用"按贡献(绩效)分";
  且当资源性质从"共享品"变为"稀缺激励品"时,
  分配标准随之位移——平等退缩、绩效权重上升。
  这不是"文化差异",而是一个文化内部的语境敏感性。
人话摘要: "同一家人,分'晚饭'是平均盛,分'谁继承祖宅'就不是平均了。人不是一辈子只认一种公平——分什么、跟谁分、在什么环境下分,会自动换标准。这不是'双标',是人的公平认知本身就嵌在语境里。"
bridges_to:
  concepts:
  - CONCEPT-fairness
  - CONCEPT-resource
  - CONCEPT-relation
  - CONCEPT-exchange
  - CONCEPT-cooperation
  axioms:
