id: BR-L2-022
status: verified
term: 价值储藏作为货币的独立功能维度 (Store of Value as Independent Functional Dimension of Money)

人话摘要: "'钱'其实做了三件不同的事——买东西（交易媒介）、标价格（记账单位）、存起来以后用（价值储藏）。这三件事可以拆开。金在被赶出'买东西'的岗位后（20世纪货币体系去金化），仍然保住了'存起来'的岗位——而且工资（价格）反而涨了。反过来，法币在'买东西'的岗位上干得不错（国家强制收），但'存起来'不一定靠谱——通胀一高，大家就把储蓄转成房子、股票、金条。这两个功能不是绑死的。"

statement: |
  货币的三个经典功能——交易媒介、记账单位、价值储藏——
  在功能上可分离。本砖仅覆盖交易媒介与价值储藏的解耦；
  记账单位的独立机制（它与交易媒介和价值储藏的关系、
  是否可独立解耦）不在本砖射程内，留待后续研究。

  交易媒介和价值储藏的驱动机制不同，
  可以在同一资产上共存也可以在不同资产上解耦。

  (a) 交易媒介功能——由网络效应驱动（BR-L2-011 记忆替代 +
      BR-L2-012 多边结算成本）。核心变量是"接受度"——
      多少人在多少场景中愿意接受此媒介。
      交易媒介功能可以通过法律/制度强制维持——
      政府在辖区中强制以法币纳税 → 法币在辖区内必然具有交易媒介功能。

  (b) 价值储藏功能——由信心驱动（对发行者信用的信任 +
      对商品耐久性的信任 + 对长期稀缺性的预期）。
      核心变量是"预期的未来购买力稳定性"。
      价值储藏功能不能被法律强制维持——
      法律可以强制我用某种货币交税，但不能强制我把它作为储蓄工具。
      当信心下降时，储蓄会转移到其他资产——即使交易媒介功能被法律保留在原货币上。

  (c) 解耦的实证锚点：
      - 20 世纪黄金非货币化：1971 年布雷顿森林体系终结后，
        金失去了官方交易媒介地位（不再与美元挂钩，
        各国央行不再以固定价格兑换黄金）。
        此后金价从 35 美元/盎司涨至 2000+ 美元/盎司——
        价值储藏功能不仅存活下来，反而因脱离了官价束缚而充分实现。
      - 恶性通胀案例：津巴布韦 2008 年——本地货币仍是法定交易媒介
        （政府强制接受），但无人用它储藏价值（储蓄涌入美元、金、
        实物资产）。交易媒介和价值储藏在同一货币上完全分离。
      - 法币的正常运行：美元同时承载交易媒介和价值储藏功能——
        因为美联储的信用（低通胀承诺）使信心维持在阈值以上。
        两个功能在同一资产上共存是常态——但这是信心的结果，
        不是功能本身的必然。

  (d) 功能解耦是可逆的——当法币信心恢复时，
      价值储藏功能可以部分回流。但回流不是完整的
      （记忆滞后效应——详见 BR-L2-024 的完整机制展开）。

bridges_to:
  concepts: [CONCEPT-value, CONCEPT-exchange, CONCEPT-information]
  axioms: [AXIOM-002, AXIOM-003]
  theorems: [THEOREM-value-attribution]
bridges_field: 从 L1"价值归属（U + E_network）× S"到货币三大功能的机制性分离——
  交易媒介 = E_network 的表征，价值储藏 = S 的预期稳定性 + U 的长期信心

applicable_sources:
- monetary_economics:
    rationale: |
      货币功能三分法（Jevons 1875, Hicks 1967）：交易媒介/记账单位/价值储藏
      作为货币的三个经典功能。功能可分离性的理论讨论在货币经济学中
      有长期传统。本砖的增量不在"三个功能存在"——这在教科书里就有——
      而在"交易媒介和价值储藏由不同机制驱动，可在同一/不同资产上解耦"。
- economic_history:
    rationale: |
      20 世纪黄金非货币化后的金价走势（1971-2020s）：
      金失去官方交易媒介功能后价值储藏功能反而充分实现。
      津巴布韦、委内瑞拉、魏玛德国恶性通胀中交易媒介与价值储藏的解耦。
      史料方法独立于货币理论。
- behavioral_economics:
    rationale: |
      通胀记忆的持续性：经历过恶性通胀的群体的投资组合中
      非法币资产比例长期偏高（Malmendier & Nagel 2011 通胀经历效应）。
      与 AXIOM-002（信息不自动消失）一致。

falsifiability: |
  若发现：(a) 在交易媒介功能被法律/制度完全移除后，
  该资产的价值储藏功能也随之消失（金在 1971 年后的表现
  已证伪此预测——金价反而飙升）。
  (b) 在恶性通胀中，交易媒介和价值储藏总是同时崩溃
  或同时保留——即两者从未独立变动（津巴布韦等案例
  已提供了独立变动的实例）。

