      note: |
        货币功能三分法的理论传统（Jevons/Hicks/凯恩斯）。
        功能可分离性是货币理论中的标准立场，非本砖独创。
        证据强度：strong（理论框架成熟）。
    economic_history:
      status: agree
      weight: 0.5
      evidence: []
      note: |
        金价在非货币化后的走势 + 恶性通胀案例。
        史料方法独立于货币理论。
    behavioral_economics:
      status: agree
      weight: 0.4
      evidence: []
      independence_note: |
        通胀记忆持续性（Malmendier & Nagel 2011）。
        与 AXIOM-002 一致但非从信息公理推导——是独立经验发现。
        独立系数 0.4。
