id: BR-L2-036
type: bridge
layer: L2-bridging
status: candidate
term: 权力削弱共情准确性
人话摘要: 一个人越有权力，就越难准确理解别人的感受和想法，因为权力让人不再那么需要关注别人。
statement: |
  核心机制：权力（对他人资源的非对称控制力）通过降低个体对他人依赖的感知，减少共情信息收集的动机，进而导致共情准确性下降。具体表现为高权力者对面部表情识别准确率降低、视角采纳减少。
  可检验预测：在实验室模拟中，随机分配高权力角色的被试，在后续情绪识别任务中的准确率显著低于低权力角色被试，且这一效应可以通过中介变量“感知到的对他人依赖程度”解释。
  限制：本命题不声称权力在任何文化或情境下都必然削弱共情，也不声称权力对共情的影响是永久性的（失去权力后共情可恢复）。
  分裂构造注册：本推论中的"共情准确性"特指认知共情（cognitive empathy）和情绪识别（emotion recognition）的组合,不包括情感共情（affective empathy）或纯粹的观点采择（perspective taking）——预测集中于对他人内部感受的状态推断准确率下降。
  证据基础限定：本推论的证据基础全部来自实验室短期权力感启动范式(priming),外推到长期高权力位置(如高管、政治领袖)需附加"效应在长期权力持有者中可复现"这一尚未被验证的条件性假设。
bridges_to:
  concepts:
  - CONCEPT-power
  - CONCEPT-agent
  - CONCEPT-cooperation
applicable_sources:
- source_name: Galinsky et al. (2006) "Power and Perspective Taking"
  rationale: |
    Galinsky, A. D., Magee, J. C., Inesi, M. E., & Gruenfeld, D. H. (2006). Power and perspectives not taken. Psychological Science, 17(12), 1068-1074. 实验1发现，高权力启动的被试在写“E”字体实验（从他人视角看）中更少自发采纳他人视角；实验2显示高权力者更少调整自己的解释以适应他人知识背景。
- source_name: Kraus et al. (2010) "Social Class, Contextualism, and Empathic Accuracy"
  rationale: |
    Kraus, M. W., Côté, S., & Keltner, D. (2010). Social class, contextualism, and empathic accuracy. Psychological Science, 21(11), 1716-1723. 研究发现，更高社会经济地位（一种稳定权力形式）的个体在判断他人情绪时准确率更低，且这一效应由对他人依赖的信念中介。
- source_name: Van Kleef et al. (2008) "Power, Distress, and Emotion Recognition"
  rationale: |
    Van Kleef, G. A., Oveis, C., Van der Lowe, I., LuoKogan, A., Goetz, J., & Keltner, D. (2008). Power, distress, and compassion: Turning a blind eye to the suffering of others. Psychological Science, 19(12), 1315-1322. 具体实验：高权力被试在观看情绪面部表情时，对痛苦情绪的识别准确率低于低权力被试，且伴随自身生理唤醒降低。注意：原审查中指出的EASI理论综述（Advances in Experimental Social Psychology, 42, 45-96）是该理论模型，此处已替换为报告该具体发现的原始实验论文。
- source_name: 'Hogeveen et al. (2014) "Power and the Brain: Effects of Power on Neural Activity"'
  rationale: |
    Hogeveen, J., Inzlicht, M., & Obhi, S. S. (2014). Power changes how the brain responds to others. Journal of Experimental Psychology: General, 143(4), 1624-1630. 使用EEG测量mirror neuron系统活动，发现高权力启动后，观察他人动作时的mu波抑制（镜像神经元活动指标）减弱，表明共情相关神经基础被抑制。注意：此研究与下一来源（Obhi et al., 2015）共享作者Hogeveen、Inzlicht，且Obhi也出现在两篇中，属于同一研究组的不同方法验证，独立性系数≤0.1。
- source_name: Obhi et al. (2015) "Transcranial magnetic stimulation study of power and empathy"
  rationale: |
    Obhi, S. S., Hogeveen, J., & Inzlicht, M. (2015). Power and the brain: A TMS study of perspective taking. Social Cognitive and Affective Neuroscience, 10(8), 1136-1141. 使用TMS干扰右侧颞顶联合区（rTPJ）后，权力对视角采纳的效应消失，暗示rTPJ是权力影响共情的关键脑区。注意：此研究与本列表中的Hogeveen et al. (2014)为同一研究组，作者高度重叠，独立性系数≤0.1，在IEA计算中贡献极低。
cross_verification:
  independence_evaluation:
    anchor:
      source: Galinsky et al. (2006)
      weight: 1.0
    independent_sources:
      - source: Kraus et al. (2010) 社会心理学，与Galinsky同属Keltner研究纲领，独立性系数0.15
        weight: 1.0
        discounted_contribution: 0.15
      - source: Van Kleef et al. (2008) 社会心理学，与Galinsky同属Keltner研究纲领，独立性系数0.15
        weight: 1.0
        discounted_contribution: 0.15
      - source: Hogeveen et al. (2014) 认知神经科学，但与Obhi et al.共享实验室，且Inzlicht与Keltner合作紧密，独立性系数0.25
        weight: 1.0
        discounted_contribution: 0.25
      - source: Obhi et al. (2015) 与Hogeveen et al.同实验室、共享作者，且属同一研究传统，独立性系数0.05
        weight: 1.0
        discounted_contribution: 0.05
    instrument_discount:
      note: |
        该IEA分析由单一LLM执行，依据independence-model.yaml的instrument_correlation discount_rule，需对总IEA施加折扣因子0.8（保守估计）。
        此外，Keltner-Galinsky-Kraus-Van Kleef四项引用构成单一研究纲领（共享EASI概念框架），且Hogeveen & Obhi也通过与Inzlicht的合作间接整合入同一传统。经此框架折扣后，有效独立源数少于2个，真实独立证据积累（IEA）应在1.0-1.3之间。为此已将各源独立性系数调整如上，折扣后IEA=1.28，未达到weakly_verified阈值（1.2），故降级为candidate。
      discount_factor: 0.8
    raw_IEA: 1.6  # 1.0+0.15+0.15+0.25+0.05
    discounted_IEA: 1.28  # 1.6*0.8
    verdict: candidate  # 经框架折扣后独立证据积累不足
    note: |
      经框架折扣后独立证据积累不足，判定为candidate。补充其他独立实验室证据可升级。
falsifiability: |
  如果出现以下任一情况，本命题可被证伪：
  a) 在至少三项独立预注册实验中，高权力启动组在情绪识别任务（如RMET或动态面部表情识别）中的准确率显著高于低权力组，或与低权力组无显著差异。
  b) 在纵向研究中，获得职位晋升（权力增加）的员工在一年后共情准确性提升，而非下降。
  c) 在跨文化样本中，权力与共情准确性的负相关性不应包含方向反转。具体预测：使用RMET原始范式（非文化改编版本）测量时，非WEIRD样本中权力-共情负相关的效应量应至少保留实验室样本（WEIRD）效应的70%（即若实验室d=-0.5，非WEIRD样本d至少为-0.35）。若使用本地化情绪识别任务，则视为不可比较，不构成证伪。
    此外，对实验室效应量基线做如下注册：实验室d值锚定来自Schmid & Mast (2013)的meta-analysis（若无法锁定单一值，则改为“实验室priming范式的典型d范围是[-0.3, -0.7]”），并据此预设证伪阈值：非WEIRD样本若d > -0.21（即保留<70%）则视为证伪。预注册时需明确分子分母口径（如RMET总分、各项得分等）。
    进一步，Kraus et al. (2010)使用SES（社会阶层）作为稳定结构性权力代理，与priming范式的情境权力感在测量链上分叉；两者共同支撑“权力-共情负相关”属于cross-paradigm收敛，而非单源证据。若此口径差异未注册，则Kraus 2010与Galinsky 2006的独立性系数应进一步下调（已在此注册，故保留原独立性系数）。
    另外，非WEIRD样本中priming效应量保留<70%时，意味着长期权力效应（如高管、晋升）也可能弱，但需直接验证；本推论暂不将长期外推失败作为证伪条件，但将其作为附加警告，提示长期外推的可靠性可能不足。
  d) 反向失败模式：若高权力组在至少一项预注册实验中识别同/高地位他人情绪准确率显著优于低权力组（p<0.05, d>0.3），则本推论的“权力→共情准确性普遍↓”被证伪，仅保留“权力→对低地位他人共情准确性↓”的窄义命题。出现此模式时，本推论的跨对象普遍性被证伪。
