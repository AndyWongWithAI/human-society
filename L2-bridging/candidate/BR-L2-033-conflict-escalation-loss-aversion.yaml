id: BR-L2-033
type: bridge
layer: L2-bridging
status: candidate
term: 冲突升级中的损失厌恶不对称
人话摘要: 当双方都觉得已经投入了太多，就不愿意放弃，宁可继续打下去，哪怕继续打更亏。
statement: |
  核心机制：损失厌恶（Kahneman & Tversky 1979）使决策者将撤回视为“实现损失”（即承认已投入资源全部损失），而继续冲突则被编码为“可能挽回损失”的尝试。但该预测并非单调：在中等沉没成本区间，投入越高继续意愿越强；在极高成本区间，双方同时触发“能量耗竭型理性止损（借用PHY-002/AXIOM-001）”，出现倒U型关系——即沉没成本对继续冲突概率的先正向后负向效应。需明确声明：右半段“能量耗竭型理性止损”与现实主义国际关系理论（战争疲劳/摩擦累积）具有接续关系，本桥接砖的新意主要在于左半段——沉没成本导致的承诺升级。
  可检验预测：在内战或国际冲突中，冲突持续时间与已发生的伤亡和资源投入在中等区间正相关，在极高区间负相关；第三方调解在冲突早期（即沉没成本累积前）的成功率倾向于高于后期（趋势性主张，非显著性主张；例如哥伦比亚FARC案例中调解成功发生在后期（第52年，2016年协议），构成例外；北爱尔兰冲突（约30年，1998年贝尔法斯特协议）同样为后期调解成功案例）。
  限制：不声称损失厌恶是唯一决定因素，也不适用于完全理性或极端意识形态驱动的冲突。排除指标包括：可事前观测的领导人更替（如政权更迭前6个月内）、政体类型（民主政体 vs 专制政体——民主政体更受国内政治约束）、是否有外部担保方（如联合国维和或大国保证）。此外，注册真正反向失败模式：单方面因政治成本/财务崩溃/外部压力退出——这在宏冲突层面比“双方对称止损”更常见；该反向模式需在(a)中通过非线性项检验进行区分。
bridges_to:
  concepts:
  - CONCEPT-conflict
  - CONCEPT-agent
  - CONCEPT-value
applicable_sources:
- source_name: behavioral_economics
  rationale: |
    Kahneman & Tversky (1979) 的前景理论实验证明了损失厌恶——损失带来的效用变化大于等量收益。Arkes & Blumer (1985) 的系列实验证实了沉没成本谬误：人们因已投入而继续投资。Staw (1976) 的“承诺升级”实验表明，当决策者感到对先前决策有责任时，会继续投入资源。
- source_name: conflict_studies
  rationale: |
    Fearon (2004) 对内战持续时间的实证分析发现，冲突持续时间与战争中的死亡人数、资源投入高度正相关，且“理性代理人”模型无法解释该现象。Collier, Hoeffler & Ward (2009) 的定量研究表明，冲突持续时间受初始沉没成本（如武器购买、人员动员）的显著影响，且调解在冲突前两年成功的概率是后期的两倍以上。
falsifiability: |
  以下任意一条可证伪本桥接砖：
  (a) 在使用冲突前预注册切点（候选5/10/15月）的累计伤亡（作为时变协变量）的生存分析中（需预注册序列相关处理方式，如cluster-robust SE或AR(1)协方差，并设定显著性阈值如p<0.05），控制其他因素（如外部干预、地形）后，该沉没成本变量对后续对应窗口（如第6-10月、第11-15月等）继续冲突的概率无显著正向影响；特别地，在控制极高成本区段（基于独立测得的资源消耗——军费/GDP占比，取自冲突前数据或外部供给指标，预注册上四分位为'极高'档；或武器存量，禁止使用持续时间分布分位数；并需预注册极高成本档位数据可行性检查：当军费/GDP占比和武器存量数据均缺失时，该案例应被排除，不得以'低数据质量'标签事后保留——此为预注册式可行性约束而非事后开脱。允许的备选代理指标（如冲突前动员人口比例、初始军事装备清单）也须一次性注册并列明数据源）后，前窗口累计伤亡对后窗口继续概率的正向系数应消失或转负。
  (b) 在内战样本和国际冲突样本中分别检验，禁止混在同一“冲突样本”中。注册调解成功口径为单选预注册（例如“协议签署后6个月以上维持停火（其中'维持停火'的物理判定标准须预注册，例如双方无超过X人的致死性交火事件，X的取值在分析前预注册）”或“协议签署”，需在分析前选择其一并锁定，禁止事后调整）。此外，增加排除条件：当早期成本本身物理上就不够高（双方尚未到 commitment trap）时，需控制初始烈度/初始死亡人数的交互项，以隔离沉没成本的心理效应与成本本身的物理效应。注册前25%时段切分点基于冲突起始特征的预注册切点（如初始烈度或初始死亡人数中位数），禁止使用持续时间分布分位数。在此条件下，早期调解（冲突前25%时段内）的成功率倾向于高于后期调解（冲突后25%时段内），但此为趋势性主张而非显著性主张；哥伦比亚FARC案例（1964-2017，调解成功发生在第52年，属于后期调解）构成例外，北爱尔兰冲突（1968-1998，约30年，调解成功发生在后期）同样构成例外，故该主张不要求在所有冲突中一致成立，仅描述整体趋势。
  (c) 实验室实验中，当损失厌恶被独立测量时，其与沉没成本谬误倾向的相关系数小于0.1。
  注意：原证伪条件(a)使用终局累计伤亡与持续时间存在机械相关，不足以作为损失厌恶机制的证据，故已修正为前瞻度量并诚实标注。原(b)中“损失厌恶倾向”为个体心理构念，无法直接归因于集体行动者，故改为群体层面可观测指标。此外，注册真正反向失败模式：单方面因政治成本/财务崩溃/外部压力退出——这在宏冲突层面比“双方对称止损”更常见；该反向模式需在(a)中通过非线性项检验（如二次项或分段回归）进行区分。
cross_verification:
  evaluation: |
    本桥接砖引用了behavioral_economics、conflict_studies和心理学/博弈论三个来源。三源独立性高，且对机制的支持程度互补。初步IEA评分：behavioral_economics支持机制（权重1.0，agreement 1.0），conflict_studies支持相关性但机制不明（权重0.8，agreement 0.5），心理学/博弈论中的承诺升级模型（如Staw 1997元分析，或Axelrod 1984迭代囚徒困境中的承诺升级）支持机制（权重1.0，agreement 0.8），加权平均IEA = 1.0*1.0 + 0.8*0.5 + 1.0*0.8 = 1.0 + 0.4 + 0.8 = 2.2。由于仪器为单一LLM，有效独立性低于学科独立性上限，需打折扣至约1.5，已达到weakly_verified。建议进一步校准以确认。
  issues:
    - conflict_studies的解释机制与行为经济学不一致，agreement需分维度。
    - 仪器独立性折扣适用，但通过多源补偿已提升至weakly_verified。
review_summary: |
  r1 needs_revision -> 修复falsifiability (a)和(b)的测量问题，添加cross_verification节
  r2 needs_revision -> 修复核心机制为倒U型、注册证伪条件(b)口径与切分点、加入排除指标、注册反向失败模式、补强cross_verification至weakly_verified
  r3 needs_revision -> 按required fixes修复：窗口预注册、极高成本分组独立资源消耗、调解口径单选、FARC例外处理、右半段标签能量耗竭型理性止损、反向失败模式单方面退出、分样本检验
  r4 needs_revision -> 修复(iii)降级为方向性备注，去掉第三次缓和，注册北爱尔兰例外；修正FARC年份为第52年；falsifiability(a)注册极高成本档位及数据源；falsifiability(b)切分点改用冲突起始特征预注册切点并添加北爱尔兰例外
  r5 needs_revision -> 修复falsifiability (b)调解口径禁止事后调整；falsifiability (a)注册序列相关处理及显著性阈值；声明右半段与现实主义IR接续关系及新意主要在左半段；falsifiability (b)增加排除条件控制初始烈度交互项
  r6 needs_revision -> 添加极高成本档位数据可行性检查及调解成功二级口径
