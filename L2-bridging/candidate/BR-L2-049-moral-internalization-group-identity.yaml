id: BR-L2-049
type: bridge
layer: L2-bridging
status: candidate
term: 道德内化与群体认同的绑定
人话摘要: 一个人越认同某个群体，就越容易把该群体提倡的道德规则变成自己的内心准则；反之，对不认同的群体，即使知道它的规则，也不会真心接受。
statement: |
  核心机制：群体认同强度作为门控，调节道德规范从外部压力向内部动机转化的选择性。个体优先内化其认同群体的道德规范，而对非认同群体的同等规范产生动机性免疫——能够理解但拒绝将其作为个人道德标准。
  可检验预测：在实验中将参与者随机分配到与自身政治派别不同的人工群体（如“红队”/“蓝队”），并操控群体与特定道德规范（如“忠诚”vs“公平”）的关联。对高认同组的参与者的道德判断任务显示，其对该群体关联规范的内化深度显著高于对另一群体关联规范的反应。自评承诺强度（自陈通道）与道德困惑反应时（行为通道）同为内化态度的反映，构成同源双指标而非独立双通道。两者的预期一致性方向为正相关，在统计模型中通过多质多法（MTMM）或共同方法因子控制来分离共享方法方差，从而获得收敛效度的证据。若无法分离，则需替换其中一个指标为真正独立的行为测量（如真实捐赠/实际牺牲行为）。低认同组效应量显著小于高认同组。为排除基线反应极端度的平凡解释，注册一个对照组（无群体关联的规范），以差值差异（difference-in-differences）作为效应量指标：高认同组对内化差异 = (高认同组内化关联规范 - 高认同组内化无关规范)，低认同组类似，然后比较两组差值差异。若高认同组的差值差异显著大于低认同组，且不能被基线反应极端度解释（可通过比较两组对无关规范的反应差异来检验），则支持核心预测。
  限制：本机制不声称所有道德内化都源于群体认同，个体认知推理（如理性协商）和核心价值观也可独立驱动内化；本预测在群体认同被公开强调时最有效，私下匿名条件下效应可能减弱。本机制主要适用于高承诺度、政治化、道德义务型群体；对于低度承诺型、反主流型、自愿型群体，群体认同对内化的调控作用可能减弱或呈非线性关系。在个体主义文化或强个体自主性情境下，认同-内化关系可能出现反转，构成与正向并列的反向预测通道（详见falsifiability (d)）。
bridges_to:
  concepts:
  - CONCEPT-group
  - CONCEPT-morality
applicable_sources:
- source_name: moral_psychology
  rationale: |
    Haidt (2012)的“道德矩阵”理论指出道德判断绑定于群体忠诚；Graham et al. (2017)的元分析显示忠诚/背叛维度在集体主义文化中与内化更紧密；Ellemers & van der Toorn (2015)实验证明群体认同增强对群体规范的内化动机。
- source_name: social_psychology
  rationale: |
    Hogg & Terry (2000)的社会认同理论明确群体规范内化通过自我归类过程实现；Turner (1991)的自我归类理论证明个体在激活群体认同后自动采用群体原型；Abrams & Hogg (1990)的元分析显示群体认同强度与从众行为呈正相关，且内化程度随认同变化而变化。
falsifiability: |
  (a) 如果对高认同群体的个体，在涉及该群体规范（如“忠诚”）与个人利益冲突的道德困境中，表现出与非认同群体规范（如“公平”）相似的内化程度（如选择频率无差异），且统计检验未达到预设的效应量阈值（如Cohen's d ≥ 0.4）或p值阈值（如p < 0.05）；
  (b) 如果实验操作群体认同强度（如通过群体评价反馈）后，个体对相应规范的内化指标无对应变化（如认同增强后内化不变）；
  (c) 如果在控制群体认同变量后（如通过匿名条件下），个体对不同群体规范的内化差异仍显著存在；
  (d) 本桥接砖包含两条并列预测通道：
    通道1（正向）：高认同→强内化（如(a)(b)(c)所述）。
    通道2（反向）：在满足以下判别条件时，高认同可能触发去内化/逆反（即认同-内化关系为负向或倒U型）：
        ① 文化类型：个体主义文化（如西方个人自主性强）
        ② 动机突出性：情境激活了独立自主动机（如强调反对权威、个人决断）
        ③ 个人特质：自我建构以独立性为主。
    若在通道2判别条件不满足时出现反向效应，则证伪本桥接砖；若判别条件满足，则视为反向通道的验证，不构成证伪。
    反向通道的效应量计算公式同正向通道（差值差异），但预期方向相反。
    通道3（非线性）：强制型高认同（Regan & Fazio 权威主义量表高分）应预测低自主质量内化（GCOS 量表低分）而非单调强内化；若强制型高认同预测单调强内化，则本推论被部分证伪，降级为“单调性主张”而非“选择性内化”主张。
  以上任一证伪条件满足（正向通道被违反，或反向通道在不满足判别条件时出现，或通道3被违反）则本桥接砖被证伪（通道3违反时降级）。
operationalization: |
  reaction_time_threshold: 500ms（根据预实验分布中位数确定；若预实验不可行，则采用文献惯例：Kosinski et al. (2015)报告的平均反应时486±89ms，取500ms作为阈值）
  likert_scale: 7点李克特量表（1=完全不同意，7=完全同意）
  commitment_strength_cutoff: 高承诺组定义为自评承诺强度≥5 且 至少满足两个独立客观指标（章程规范条款、外部观察者评定、违规实际行为后果≥阈值），剔除“成员自报道德功能”这一自陈循环判据。低承诺组定义为自评承诺强度≤3。中间组（自评承诺强度4-6，或≥5但不足两个客观指标）作为其他组，需在统计模型中独立报告而非简单“控制掉”。
  statistical_criterion: 核心交互效应阈值提升至 Cohen's d ≥ 0.4，并预注册基于此效应量的最小样本量（power ≥ 0.8, α=0.05, 单侧）。同时声明：若真实效应量落在0.3-0.4之间，本推论降级为 weakly_verified 而非 verified。
  MTMM_common_method_threshold: 在统计模型中预注册“共同方法因子解释方差比 ≤ 30%”作为可接受上限；超限则强制执行第二阶段实验，使用真实行为测量（真实匿名捐赠机会/时间/金钱牺牲选择）替代 Likert 自陈。若两阶段都失败，该数据点不得进入 verified 票仓。
review_summary: |
  r2 needs_revision -> 修复五项required缺陷：独立指标非独立性、效应方向平凡来源、commitment_strength_cutoff补充语义闸门、反应时阈值预注册、反向失败模式重注册。
  r3 needs_revision -> 修复五项required缺陷：MTMM共同方法因子阈值预注册并替换路径、承诺强度分类去重叠并去循环、Cohen's d阈值上调并添加power预注册、SDT非线性注册为falsifiability通道、内化深度地面真值问题显式标注。
limitations: |
  当前测量（RT+Likert）无法区分真诚内化与立场挪用；若行为指标与认知机制层指标发散（如行为一致但承认认知上不认为'应当'），结论仅支持'一致性顺从'而非'选择性强内化'。
domain: ['道德心理学', '社会心理学']
