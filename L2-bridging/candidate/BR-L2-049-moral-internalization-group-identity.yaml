id: BR-L2-049
type: bridge
layer: L2-bridging
status: candidate
term: 道德内化与群体认同的绑定
人话摘要: 一个人越认同某个群体，就越容易把该群体提倡的道德规则变成自己的内心准则；反之，对不认同的群体，即使知道它的规则，也不会真心接受。
statement: |
  核心机制：群体认同作为调节-中介并列变量，调节并中介道德规范从外部压力向内部动机转化的选择性。个体优先内化其认同群体的道德规范，而对非认同群体的同等规范产生动机性免疫——按行为指标（真实匿名捐赠+IAT一致）定义，而非按自我报告定义。为消除定义循环，本推论进一步区分两个可分离构念：显性同步表达（行为顺从）与深层内化（内隐态度改变）。对显性同步表达的预测通过行为指标检验，对深层内化的预测通过IAT检验。
  可检验预测：在实验中将参与者随机分配到与自身政治派别不同的人工群体（如“红队”/“蓝队”），并操控群体与特定道德规范（如“忠诚”vs“公平”）的关联。对高认同组的参与者的道德判断任务显示，其对该群体关联规范的内化深度显著高于对另一群体关联规范的反应。自评承诺强度（自陈通道）与道德困惑反应时（行为通道）同为内化态度的反映，构成同源双指标而非独立双通道。两者的预期一致性方向为正相关，在统计模型中通过多质多法（MTMM）或共同方法因子控制来分离共享方法方差，从而获得收敛效度的证据。若无法分离，则需替换其中一个指标为真正独立的行为测量（如真实捐赠/实际牺牲行为）。低认同组效应量显著小于高认同组。为排除基线反应极端度的平凡解释，注册一个对照组（无群体关联的规范），以差值差异（difference-in-differences）作为效应量指标：高认同组对内化差异 = (高认同组内化关联规范 - 高认同组内化无关规范)，低认同组类似，然后比较两组差值差异。若高认同组的差值差异显著大于低认同组，且不能被基线反应极端度解释（可通过比较两组对无关规范的反应差异来检验），则支持核心预测。
  限制：本机制不声称所有道德内化都源于群体认同，个体认知推理（如理性协商）和核心价值观也可独立驱动内化；本预测在群体认同被公开强调时最有效，私下匿名条件下效应可能减弱。本机制主要适用于高承诺度、政治化、道德义务型群体；对于低度承诺型、反主流型、自愿型群体，群体认同对内化的调控作用可能减弱或呈非线性关系。在个体主义文化或强个体自主性情境下，认同-内化关系可能出现反转，构成与正向并列的反向预测通道（详见falsifiability (d)）。
bridges_to:
  concepts:
  - CONCEPT-group
  - CONCEPT-morality
applicable_sources:
- source_name: moral_psychology
  rationale: |
    Haidt (2012)的“道德矩阵”理论指出道德判断绑定于群体忠诚；Graham et al. (2017)的元分析显示忠诚/背叛维度在集体主义文化中与内化更紧密；Ellemers & van der Toorn (2015)实验证明群体认同增强对群体规范的内化动机。
- source_name: social_psychology
  rationale: |
    Hogg & Terry (2000)的社会认同理论明确群体规范内化通过自我归类过程实现；Turner (1991)的自我归类理论证明个体在激活群体认同后自动采用群体原型；Abrams & Hogg (1990)的元分析显示群体认同强度与从众行为呈正相关，且内化程度随认同变化而变化。
falsifiability: |
  本推论区分显性同步表达（行为指标）与深层内化（IAT）两个可分离构念。证伪条件分别对应：显性同步表达对应(a)(b)(c)，深层内化对应(e)(f)，(d)和通道3涉及两个构念，需分别检验。以下具体条件：
  (a) 如果对高认同群体的个体，在涉及该群体规范（如“忠诚”）与个人利益冲突的道德困境中，表现出与非认同群体规范（如“公平”）相似的内化程度（如选择频率无差异），且统计检验未达到预设的效应量阈值（如Cohen's d ≥ 0.4）或p值阈值（如p < 0.05）；
  (b) 如果实验操作群体认同强度（如通过群体评价反馈）后，个体对相应规范的内化指标无对应变化（如认同增强后内化不变）；
  (c) 如果在控制群体认同变量后（如通过匿名条件下），个体对不同群体规范的内化差异仍显著存在；
  (d) 本桥接砖包含两条并列预测通道：
    通道1（正向）：高认同→强内化（如(a)(b)(c)所述）。
    通道2（反向）：在满足以下判别条件时，高认同可能触发去内化/逆反（即认同-内化关系为负向或倒U型）：
        ① 文化类型：个体主义文化（如西方个人自主性强）
        ② 动机突出性：情境激活了独立自主动机（如强调反对权威、个人决断）
        ③ 个人特质：自我建构以独立性为主。
        ④ 群体类型：政治化道德义务型（高承诺、高牺牲意愿） vs. 低度承诺型（低承诺、高流动性）。
    激活反向通道要求至少同时满足3项判别条件（新增④后增加至4项），或采用加权得分法：四项条件各赋1分，总分≥3激活。若在通道2判别条件满足不到3项且加权得分<3时出现反向效应，则证伪本桥接砖；若满足至少3项或加权得分≥3，则视为反向通道的验证。特别地，当全部4项条件均满足时，反向通道应作为主效应预测（即在该条件下反向效应是预期结果而非例外）；当满足3项时仍视为反向通道的验证但强度弱于主效应。
    反向通道的效应量计算公式同正向通道（差值差异），但预期方向相反。
    通道3（非线性）：强制型高认同（Regan & Fazio 权威主义量表高分）应预测低自主质量内化（GCOS 量表低分）而非单调强内化；若强制型高认同预测单调强内化，则本推论被部分证伪，降级为“单调性主张”而非“选择性内化”主张。
  (e) 中介通道：若操控道德基础敏感性（MFQ）后，群体认同对内化的预测力部分或全部消失，则支持纯中介主张；若不消失，则支持调节主张。具体检验：在回归模型中先控制MFQ各维度得分，再考察群体认同×规范类型的交互效应是否显著下降。
  (f) 社会创造力效应（反向失败模式）：为操作化“重新定义比较维度或群体边界”，预注册前测量表：跨群体相似性-差异性感知评分（7点李克特量表，例如“你认为红队与蓝队在道德信念上相似程度”和“你认为红队与蓝队在道德信念上差异程度”），作为社会创造力倾向的代理指标。低认同个体可能通过重新定义比较维度或群体边界来回避内化要求。预测：低认同组的“无关规范”基线反应可能系统性偏高，而非简单的低内化。若低认同组对无关规范的内化评分显著高于控制组（无群体关联），且该效应不被认同强度反向预测，则本桥接砖被部分证伪，需考虑社会创造力的替代解释。
  以上任一证伪条件满足（正向通道被违反，或反向通道在不满足判别条件时出现，或通道3被违反，或中介通道检验不支持原主张，或社会创造力效应导致基线偏离）则本桥接砖被证伪（通道3违反时降级）。
operationalization: |
  reaction_time_threshold: 900ms（根据道德判断文献预实验分布中位数确定；若预实验不可行，则采用文献惯例：Greene et al. (2001)报告的个人道德困境判断平均反应时约1000ms，取900ms作为阈值。反应时作为辅助通道，不参与主分析；主分析依赖行为指标（真实匿名捐赠）与IAT。）
  likert_scale: 7点李克特量表（1=完全不同意，7=完全同意）
  commitment_strength_cutoff: 高承诺组定义为至少满足两个独立客观指标（章程规范条款、外部观察者评定、违规实际行为后果：过去12个月内≥1次可观察的违规-惩罚事件，或行为后果评分（使用5题7点李克特行为承诺量表，得分≥中位数+1SD视为达标）），自评承诺强度作为辅助（不强制，但可用于验证）。低承诺组定义为自评承诺强度≤3且客观指标<2。中间组（不符合高承诺和低承诺）作为其他组，需在统计模型中独立报告而非简单“控制掉”，尤其需关注非线性段（如自评中高但客观不足的样本）单独报告，不得压入二分比较。
  statistical_criterion: 核心交互效应阈值提升至 Cohen's d ≥ 0.4，并预注册基于此效应量的最小样本量（power ≥ 0.8, α=0.05, 单侧）。同时声明：若真实效应量落在0.3-0.4之间，本推论降级为 weakly_verified 而非 verified。
  MTMM_common_method_threshold: 在统计模型中预注册“共同方法因子解释方差比 ≤ 30%”作为可接受上限；超限则强制执行第二阶段实验，同时使用真实行为测量（真实匿名捐赠机会/时间/金钱牺牲选择）和至少一个认知机制层独立测量（如道德判断内隐联想测验 IAT，或道德敏感性任务 MFJ，或启动效应范式）替代 Likert 自陈。第二阶段需同时报告行为指标与认知机制层指标的两对结果。若两阶段都失败，该数据点不得进入 verified 票仓。若两个认知-行为对偶均揭示“行为一致 + 认知不承认应然”的发散模式，结论应限于“一致性顺从”而非“真诚内化”。
  did_baseline_equivalence_threshold: 在差中差（DiD）设计中，预注册“两组对无关规范反应均值差异 < Cohen's |d| = 0.2，且 p > 0.5”作为基线无差异的判据；若超出此阈值，则基线极端度可作为平凡解释，需明确标记该效应不可排除并降级结论。
review_summary: |
  r2 needs_revision -> 修复五项required缺陷：独立指标非独立性、效应方向平凡来源、commitment_strength_cutoff补充语义闸门、反应时阈值预注册、反向失败模式重注册。
  r3 needs_revision -> 修复五项required缺陷：MTMM共同方法因子阈值预注册并替换路径、承诺强度分类去重叠并去循环、Cohen's d阈值上调并添加power预注册、SDT非线性注册为falsifiability通道、内化深度地面真值问题显式标注。
  r4 needs_revision -> 修复三项required缺陷：MTMM超限第二阶段保留认知机制层指标并明确发散模式结论限制；DiD基线极端度预注册具体阈值（Cohen's d<0.2且p>0.5）；反向通道(d)判别条件激活需至少满足2项。
  r5 needs_revision -> 修复三项required缺陷：反应时阈值替换为道德判断文献值（900ms）、反向通道加权得分固定为三项各1分总分≥2、行为后果量表指定为5题7点李克特行为承诺量表。
  r6 needs_revision -> 修复三项required缺陷：反应时阈值替换为道德判断文献值（900ms）、反向通道加权得分固定为三项各1分总分≥2、行为后果量表指定为5题7点李克特行为承诺量表。
  r7 needs_revision -> 修复五项required缺陷：定义去循环、RT降级、分组去自陈循环、社会创造力预注册操作化、反向通道判别条件收紧。
limitations: |
  当前测量（RT+Likert）无法区分真诚内化与立场挪用；在MTMM超限后的第二阶段使用行为指标与认知机制层指标的两个对偶时，若两个认知-行为对偶均揭示“行为一致 + 认知不承认应然”的发散模式，结论仅支持“一致性顺从”而非“选择性强内化”。
