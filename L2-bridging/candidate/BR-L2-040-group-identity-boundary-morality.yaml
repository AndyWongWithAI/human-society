applicable_sources:
  - source_name: social_psychology
    rationale: |
      Tajfel & Turner (1979) 的社会认同理论表明，个体通过内群偏爱提升自我评价，内群外群区分即形成道德边界。Brewer (1999) 指出内群偏爱不一定伴随外群敌意，但仍产生道德区别对待。Opotow (1990) 的道德排斥理论直接说明群体边界决定了道德关怀的范围——被归入“我们”的个体获得完整道德考量，而“他们”则被排除。
  - source_name: moral_psychology
    rationale: |
      Singer (1981) 提出道德圈扩展概念，从家族到部落再到国家，与心理距离单调对应。Graham et al. (2017) 的道德基础理论中，“忠诚/背叛”基础专门服务于群体边界功能：违背忠诚被视为道德错误，但对群外成员不适用。Cikara et al. (2011) 的 fMRI 研究发现，群际幸灾乐祸（Schadenfreude）时腹内侧前额叶活动增强，该脑区与道德情感评估相关，支持道德折扣的神经基础。
  - source_name: evolutionary_biology
    rationale: |
      Hamilton (1964) 的亲缘选择理论解释了亲缘关系越近道德偏向越大（如亲属间的利他惩罚）。Choi & Bowles (2007) 的 parochial altruism 模型通过博弈模拟表明，在群际冲突情境下，个体对同群体成员表现出利他惩罚倾向，而对异群体成员则表现出敌意，这种不平衡在演化上利于群体生存，从而将群体身份固化为道德边界。
falsifiability: |
  (a) 如果发现当心理距离增大时（例如从本族群到远缘族群），道德折扣不单调递增而是随机波动甚至反向（d<0 或 |d|<0.2，且 p<0.01），则证伪单调递增假设。
  (b) 如果实验显示，在群体边界被操纵到Mini-IAT内群偏好效应量d<0.2的条件下，群内vs群外道德愤怒差异（采用多题Likert量表测量，如“你对这种不公平分配感到愤怒的程度”3题，α>0.7）的效应量仍不低于d=0.5，则证伪“边界模糊导致折扣松动”的预测。
  (c) 如果采用中介分析模型，群体身份心理距离对道德折扣的路径系数（直接或间接）不显著（β的95% CI包含0），或中介效应（如群体认同强度）的间接效应不显著，则证伪群体身份作为核心机制。
  (d) 反向失败模式完整注册：包括以下两种情况：
    - 在群际威胁、不平等地位或竞争情境下，如果增加群体接触（边界模糊）反而导致道德折扣差异扩大（如IAT内群偏好增强且道德愤怒差异增大），且条件调节效应显著（交互项β>0.3），则证伪单向模糊→松动预测。触发该模式的前置接触条件必须预先注册：接触类型（合作性/竞争性，二选一）；接触强度最低时长（如≥15分钟）；接触双方地位（平等/不平等，二选一）。若未注册或条件不满足，该反向模式不视为可检验证伪。
    - 如果冲突强度增大（如威胁感知量表得分>4，阈值与可检验预测(ii)冲突操作化一致，且需预先注册缓冲带：若均值在3.5-4.5之间，视为不确定，需扩展样本重测）反而导致群内道德考量减小（内群瓦解），即群内道德愤怒差异缩小且效应量d<0.2，则证伪“冲突增强道德边界”的预测。
  (e) 此条作为广义单调性的边界测试：如果物种维度的道德折扣显著低于国家维度（d<0 反向）且p<0.01，则证伪广义单调性假设。注意：本命题的射程限于族群到国家层级，物种维度不在射程内，因此此测试不用于证伪本命题，仅用于检验射程外边界。
