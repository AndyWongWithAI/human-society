id: BR-L2-040
type: bridge
layer: L2-bridging
status: candidate
term: 群体身份作为道德边界的心理标记
人话摘要: 人们对自己所属群体内部的人更讲道德，对群体外的人则差一些，而且这种差别会随着群体距离变大而变大。
statement: |
  核心机制：个体对群内成员的道德考量（关怀、公平、忠诚）显著强于群外成员，且这一“道德折扣”的大小随群体边界的心理距离单调递增。心理距离在此定义为在群际冲突条件下的一般模式（parochial altruism 的条件依赖性）：群体边界清晰度（群内 vs 群外二分）在冲突情境下显著，在非冲突或合作情境下梯度可能变平或反转。该二分梯度基于演化和社会结构的一般模式，但并非固有客观。个体差异（如爱国者将国家置于亲缘之前）和系统性反例（如普遍主义宗教传统、革命认同、职业身份）被视作结构性替代模式而非统计噪声；它们在命题的射程之外——本命题适用于以族群、国家等为典型群体边界的社会心理语境，而普遍主义传统（如康德的伦理普遍主义、佛教的无我伦理）或职业规范（如医生对患者的平等救治）依赖于独立于群体身份的道德框架，需另行建模。心理距离的操作化通过独立的群体归属强度自我报告（例如“你感到自己是[群体]的一员” Likert 量表）进行测量，与道德折扣结果分开评估。
  可检验预测：
    (i) 在实验室中，通过操纵群体边界清晰度（如共同目标vs竞争框架），测量被试对群内/群外成员不公平分配的道德愤怒反应，预期边界越模糊，道德愤怒差异越小。
    (ii) 在群际冲突条件下（如资源争夺、历史仇恨启动），心理距离对道德折扣的单调效应增强；而在非冲突条件下，该效应减弱。冲突强度的操作化可通过双方威胁感知量表或竞争性奖金分配任务实现。
  限制：不声称道德完全由群体身份决定，也不声称所有道德维度（如避免伤害）都同等受群体边界影响。本命题不预期在普遍主义宗教传统或职业伦理内部成立，这些领域需要额外的边界机制。
