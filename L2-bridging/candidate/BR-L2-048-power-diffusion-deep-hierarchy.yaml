    Michels 在《政党》中通过对德国社会民主党等组织的观察，提出“组织规模扩大必然导致权力集中到少数人手中”，但深层级中实际控制力却下降——顶层名义权力虽大，但无法有效指挥基层，形成“寡头铁律”的悖论。该现象源于层级信息传输的物理约束。
- source_name: Weber (1922) 官僚制
  rationale: |
    Weber 在《经济与社会》中系统分析了官僚制的控制困境：层级越深，科层官员的“理性计算”与“本位利益”越可能导致指令扭曲。他明确指出，官僚制理想型的“非人格化控制”在实践中因层级深度而失效。
- source_name: Blau (1970) 组织层级与信息失真
  rationale: |
    Blau 在《组织动力学》中通过实证研究检验了层级深度对信息失真的影响。他对比了不同层级数的组织，发现每增加一层，中层管理者向上汇报的信息中“有利偏向”比例呈增加趋势，向下传达的指令中“细节遗漏”比例也呈增加趋势，具体百分比为方向性示意，非精确数字。
- source_name: Tsebelis (2002) 否决者理论
  rationale: |
    Tsebelis 在《否决者》中构建了政治制度的层级模型，证明政策控制的“否决点”数量与层级深度正相关，且否决点增加导致顶层政策被完全执行的概率下降，具体百分比为方向性示意，非精确数字。
- source_name: Huber & Shipan (2002) 委托-代理链
  rationale: |
    Huber 和 Shipan 在《官僚政治中的委托-代理》中通过统计模型分析美国州政府层级，发现每增加一个委托-代理层级（如立法→部门→办公室→基层），高层对最终产出的控制力下降，具体百分比为方向性示意，非精确数字。他们归因于“信息不对称的逐级放大”。
falsifiability: |
  以下任一情况均可证伪本命题：
  (a) 存在一个组织，其层级深度超过有效管理幅度（例如，管理幅度≤5，而层级深度≥5），但通过实地调查或实验发现，高层对基层的指令执行准确率（如关键任务符合率）与名义权力（如正式命令权重）无显著差异（p>0.05）。
  (b) 在跨行业、跨规模的组织样本中，层级深度与实际控制力下降比例之间不存在正相关关系（相关系数≤0.2）。
  (c) 证明通过引入完全透明的信息传输技术（其操作定义为：数字化全覆盖率≥80%、上传延迟≤5秒、高层可实时查看的运营指标覆盖率≥90%、且系统支持事后取数功能；缺任何一项则不算实现'引入实时监控'），可以使得实际控制力与名义权力之间的差距缩小到小于预注册的阈值（即缓解率≥80%），且不受层级深度影响。
  (d) 若引入实时监控后实际控制力反而超过名义权力（监控创造新权力，即高层通过监控工具获得超出正式命令范围的额外控制力），则本命题需在“层级衰减控制”与“监控增强控制”之间做边界划分，即补充一个子命题，明确区分两种机制，而非仅“需细化”。
  (e) 存在一个组织，其层级深度增加反而提升控制力（如高仪式化组织或动员型组织），且该控制力提升不能归因于监控工具的引入，而来自层级本身作为控制工具。此种情况要求区分“层级作为衰减通道”和“层级作为控制工具”两种机制。该反向模式在特定政体周期中已有部分历史记录（如中国东汉州牧期），已构成软证伪但测量信度不足以严格证伪。若通过考古+文献定量重建到95% CI重叠于名义权力，则构成严格证伪。
review_summary: |
  r1 needs_revision -> 修复引用数字具体性、跨构造混淆和Michels方向错误，分维度表述控制力衰减，降级定量数字为方向性支持
  r2 needs_revision -> 修复 Michels 方向矛盾、跨构造混淆、数字精度、注册反向失败模式、任务类型调节变量
  r3 needs_revision -> 修复falsifiability(c)与限制条款不对称(改为80%阈值), 注册30%量级测量口径, 增加运动式治理射程限定, 补充仪式型组织反向模式
  r4 needs_revision -> 统一适用_sources段数字为方向性示意；提升falsifiability(d)为独立边界条款；升级仪式型组织为方向不成立；注册军队案例；明确独立审计操作定义
  r5 needs_revision -> 修复实时监控操作定义、排除条款优先序、falsifiability(e)加注
  r6 needs_revision -> 修复灰区分类操作定义、关闭falsifiability(e)未关闭反例、核正Blau引用年份、添加三维度合成置信度限制
