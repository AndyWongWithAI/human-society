term: 信息衰减速率的经验测量方法
人话摘要: 通过三种代表性实验方法（口传代际、抄写错误、数字位翻转）可以测量信息在复制中丢失的速度，这些方法在各自物理域内独立观测到信息衰减趋势，构成定性会聚(qualitative convergence)，仅在“衰减存在与否”的二元判断上达成一致，而非定量互验。
statement: |
  核心机制：信息在复制、存储、传输过程中会不可逆地丢失部分比特，丢失速率可通过三种代表性独立经验途径（独立定义：三种方法的核心驱动量来自不同层级——口传依赖认知层的记忆与认知重复，抄写依赖神经-书写层的人为书写误差与校对机制，数字依赖物理层的噪声与纠错码；若两方法的驱动量源自同一底层物理或认知过程（例如神经噪声同时影响记忆与书写、认知改写渗入抄写），即使各自声称的"主要"驱动量不同，仍判定为非独立）测量：(i) 口传序列再生实验中保真度随代际的衰减曲线；(ii) 历史文献抄写中异体字与错误的累积速率；(iii) 数字系统中原始位翻转率与纠错冗余的关系。三种方法在各自物理域内各自独立地观测到信息衰减趋势，构成定性会聚(qualitative convergence)，而非定量互验；跨域不可比较衰减速率，仅在"衰减存在 vs 不存在"这一二元判断上达成一致。可检验预测：在同等条件下，三种代表性方法均测得衰减（而非零衰减或增强）。限制：本测量框架不声称能覆盖所有信息类型（如图像、音频的衰减可能遵循不同规律），也不预设衰减速率在所有语境下为常数；由于度量标准不同，不比较具体数值。此外，数字域衰减的成立依赖于"未超过纠错能力的噪声水平"这一隐含前提；若冗余率足够高使实测误码率低于阈值，数字域可呈现"零衰减"，这不构成对推论的证伪而是推论适用边界的限定。本框架聚焦于人类认知/书写/数字三类核心载体，其他载体（如模拟信号传输、生物遗传信息传递）的衰减规律需独立检验。需要特别说明：当代 ECC 充裕场景下数字域常态为零衰减，本框架中"数字域衰减趋势"的声称仅适用于超出纠错能力或无纠错系统的特定条件；数字域的零衰减不构成对推论的证伪，而是推论适用边界的限定。
