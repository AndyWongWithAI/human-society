term: 信息衰减速率的经验测量方法
人话摘要: 通过三种实验方法（口传代际、抄写错误、数字位翻转）可以测量信息在复制中丢失的速度，这些方法互相验证。
statement: |
  核心机制：信息在复制、存储、传输过程中会不可逆地丢失部分比特，丢失速率可通过三种独立经验途径测量：(i) 口传序列再生实验中保真度随代际的衰减曲线；(ii) 历史文献抄写中异体字与错误的累积速率；(iii) 数字系统中原始位翻转率与纠错冗余的关系。三种方法在各自度量标准下均观测到一致的信息衰减趋势（而非增强或零衰减），但各自度量单位不可通约，不要求定量收敛。可检验预测：在同等条件下，三种方法均测得衰减（而非零衰减或增强）。限制：本测量框架不声称能覆盖所有信息类型（如图像、音频的衰减可能遵循不同规律），也不预设衰减速率在所有语境下为常数；由于度量标准不同，不比较具体数值。
