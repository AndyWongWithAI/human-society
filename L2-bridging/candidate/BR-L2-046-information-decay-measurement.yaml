applicable_sources:
  - source_name: 认知科学——文化传输实验
    rationale: |
      Bartlett (1932) 的系列再生范式(serial reproduction)首次定量展示了故事在口头传递中细节丢失与变形的规律；Mesoudi & Whiten (2008) 的受控实验室链式传递实验证实传递代数与信息保真度之间存在可预测的指数衰减关系；Kalish et al. (2007) 的迭代学习实验进一步量化了群体共享信息的趋同速率与信息损失量。
  - source_name: 信息论与计算物理——信道容量与纠错码
    rationale: |
      Shannon (1948) 提出信道容量与噪声极限，建立了信息传输中最大可能速率的理论边界；Hamming (1950) 的纠错码理论给出了在给定冗余下可纠正错误比特数的工程上限；Landauer (1961) 证明信息擦除必然伴随能量耗散，即比特的不可逆丢失存在物理下限。
  - source_name: 档案学与手抄本研究——抄写错误累计
    rationale: |
      手抄本谱系学(stemmatology)的定量分析表明，每次抄写产生的异体字和明显错误服从稳定的概率分布，且错误累计速率可以用分支树模型拟合；该领域积累的大量手抄本谱系数据提供了信息衰减的档案学经验证据，补充了实验与理论结果。
falsifiability: |
  如果满足以下任意一条，本桥接砖就被证伪：(a) 在大样本（n≥100）口传序列再生实验中，故事的准确回忆比例（测量层级限定为字面级回忆，即逐词/逐句字面匹配；实验前须预注册主要判定档位及样本来源（包括实验室被试的招募方式、样本量、纳入标准，或自然语料的语料类型、时间范围、抽样方法，或历史档案的档案类型、年代、抽样策略），具体阈值：连续5代以上字面匹配比例不下降的判定标准为斜率≥0且p<0.05，或在基线衰减模型下第5代预期保真度下限的95%CI上界高于第1代）在连续5代以上不下降反而上升；(b) 口传序列再生实验或历史文献抄写实验中，在各自预注册的等效条件下未观测到衰减（即零衰减或增强），且无法通过实验设计差异解释。等效条件指除驱动机制外的实验参数一致，且不包含主动校对/纠错等保真增强机制；口传实验等效条件须预注册为"无外部反馈/无迭代修正/单向下行传递"，抄写实验等效条件须预注册为"无exemplar校对"；等效条件须在实验开始前完整预注册（包括样本来源、实验参数范围），不得根据结果事后调整；口传域或抄写域任一出现零衰减即构成证伪，无需同时满足；(c) 数字存储系统中，在指定的冗余率、介质类型和比特数下，实测原始误码率在等效条件下系统性地为零（即 N 次读取后零错误，且 N 足够大使得零错误的概率在给定误码率下<0.01），则衰减在数字域不成立；数字域等效条件须预注册（包括介质类型、冗余率、读取次数、纠错配置）。
