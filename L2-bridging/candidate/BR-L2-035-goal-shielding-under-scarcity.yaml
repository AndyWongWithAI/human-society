applicable_sources:
- source_name: cognitive_science
  rationale: |
    Shah, Friedman & Kruglanski (2002) 的目标屏蔽理论通过实验证明，当个体激活主导目标时，会自动抑制竞争性目标，且这一过程无需意识参与。Bargh & Gollwitzer (1994) 的自动目标激活实验表明，目标可以在无意识状态下被环境线索触发并引导行为。
- source_name: behavioral_economics
  rationale: |
    Mullainathan & Shafir (2013) 在《稀缺》一书中提出了认知税概念，并通过一系列实验和田野研究说明稀缺直接降低认知带宽。Mani et al. (2013) 的经典农田实验（在印度甘蔗农民收成前后测试认知表现）最初证明贫困状态导致认知功能下降，但后续 2018-2023 年的预注册复现显示效应量显著缩水且对"因果性"存在争议，因此原始观察仍被多次方向性复制，但效应量和机制因果性存在持续争议。
- source_name: developmental_psychology
  rationale: |
    Evans & Schamberg (2009) 的童年贫困纵向研究发现，早期资源稀缺经历会导致成年后工作记忆和认知控制能力下降，且目标选择偏向即时满足，支持稀缺对目标屏蔽与带宽缩减的长期塑造作用。该来源独立于实验室实验，采用自然观察和纵向追踪，增强了证据的生态效度。
