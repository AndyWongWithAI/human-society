falsifiability: |
  本桥接砖的证伪条件仅适用于个体心理过程实验，群体层面的外推需要独立证据链（参见 BR-L2-035 在 L3/L4 推论中的使用规则）。
  若以下任一条件在严格控制的实验中（每组 N≥30，效应量 d≥0.5，α=0.05，至少 3 次独立复现）得到可复现的观测，本桥接砖证伪：
  (a) 目标屏蔽预测不成立：在稀缺诱导后，实验组在主导目标相关任务（任务定义参见statement中“主导目标相关任务”的边界细则）上的表现未显著优于控制组，或显著更差。
  (b) 带宽缩减预测不成立：在稀缺诱导后，实验组在所有认知任务（包括无关任务）上的表现未显著低于控制组。
  (c) 机制混淆：若实证发现带宽缩减模式（所有任务下降）而桥接砖以此作为目标屏蔽的证实，则视为证伪。
  (d) 反向失败模式 - 长期目标投资增加：长期稀缺个体比非稀缺个体更倾向于投资长期目标（如教育、健康），且该效应不能由目标排序的预设差异解释。为区分目标排序预设差异，需采用以下预注册操作细则：①跨文化样本中，须在实验前通过独立文化适应性量表（如个人主义-集体主义量表）完成目标排序，排序条目必须覆盖至少3类长期目标（教育、健康、家庭/社区），且禁止在查看结果后调整条目或排除特定文化；②事后选择禁区：不得以“该条目在本文化中不适用”为由在事后删除个别条目，若必须删除则需预注册具体的退出标准（如条目内部一致性低于0.3）；③纵向追踪稀缺状态变化前后的同一个人时，若稀缺状态缓解后长期投资下降，则支持目标排序解释而非本机制；④若该效应可被解释为理性再分配，则需通过三档判据进行区分：自动屏蔽（快速反应时 + 无思考时间报告）、混合（中等反应时 + 部分反思）、理性再分配（长反应时 + 显性权衡报告）。规定长反应时 + 短思考时间报告视为自动屏蔽不足的弱证据，需预注册至少3个具体指标（如皮肤电反应、前额叶 EEG、皮质醇水平）及其判定阈值，不允许在查看结果后追加新指标。若无法区分至任一档，则视为证伪。
  (e) 目标屏蔽效应在跨文化样本中不成立（例如，在稀缺群体中未观察到次要目标抑制）。本条件优先于(d)中的预注册细则，即跨文化复现失败不允许用目标排序的预设差异解释来豁免。
  (f) 2×2 设计预测不成立：在同时操控稀缺诱导（有/无）和任务类型（主导目标相关/无关）的实验中，应有以下模式：稀缺组在主导目标相关任务上的表现不差于控制组（效应量下限 d≥-0.2，即不能显著低于控制组），在无关任务上显著差于控制组（d≥0.5）；控制组在相关任务上的表现可能优于无关任务，但稀缺组在相关任务与无关任务之间的差异应大于控制组（交互效应显著，η²≥0.06）。若四格中任何一格的方向或效应量不满足上述注册阈值，则证伪。
  (g) 2×4 并行共存证伪条件：在同时操控稀缺诱导（有/无）和测量机制类型（目标屏蔽指标、带宽缩减指标各两个独立测量）的 2×4 设计中，若未观察到稀缺诱导与机制类型之间的交互效应（即稀缺对屏蔽指标和带宽指标的影响无显著差异，例如稀缺效应在两种机制上的效应量差值的置信区间包含零且效应量差值 d_差值 < 0.2），则证伪并行共存假设。该条件可在未来研究中使用，实验前需预注册各指标的具体任务、效应量阈值和交互效应检验的α水平（默认α=0.05）。
  注意：紧迫目标的识别必须独立于后续行为，例如通过稀缺诱导前的自评目标排序或独立的任务激活测量。若事后反推，则该条件无效。
cross_verification: |
  IEA 调查结果：
  来源独立性矩阵（去重后三源）：
    - cognitive_science 与 behavioral_economics: 独立性系数 0.3（共享认知架构假设，但实验方法不同源，且理论框架有重叠，较保守）
    - cognitive_science 与 developmental_psychology: 独立性系数 0.9（实验范式独立、样本独立、理论框架独立——发展心理学采用纵向追踪与自然观察，cognitive_science 采用实验室启动实验，完全不同的测量链）
    - behavioral_economics 与 developmental_psychology: 独立性系数 0.9（行为经济学以田野实验和行为任务为主，发展心理学以纵向关联和自然队列为主，测量链独立）
  仪器折扣：0.9（实验任务均为标准行为实验，折扣较小）
  加权来源强度：每个来源强度为 1（默认），经独立性和折扣调整后总强度 = 1*0.3*0.9 + 1*0.9*0.9 + 1*0.9*0.9 = 0.27 + 0.81 + 0.81 = 1.89
  IEA 分数（按原文公式）= 1.89 * 3 = 5.67（远超最低门槛 1.8，且已消除同根伪装）
  注意：至少两个 pair（cognitive_science–developmental_psychology 和 behavioral_economics–developmental_psychology）为真正独立的测量链，确保多源验证不是同根变体。
review_summary: |
  r1 needs_revision -> 修复证伪口径注册、机制厘清、紧迫目标预注册、IEA调查
  r2 needs_revision -> 降级串行组合为并行共存、增加2×2证伪条件与反向失败模式、操作化系统性忽略为削弱、重做IEA并引入第三来源。
  r3 needs_revision -> 重做IEA（去重源+修正独立性矩阵）、补主导目标边界口径细则、标注并行性为理论推断并增2×4证伪条件、补目标排序预注册规则与事后选择禁区
  r4 needs_revision -> 修复Mani et al.复现标注、主导目标预注册操作范式、证伪条件(g)诚实标注
  r5 needs_revision -> 修复：1)自评排序与任务激活失配优先规则指定为优先行为锚；2)d中理性再分配区分改为三档判据；3)一致性低于阈值调整解释改为三选一离散抉择；4)结论首句加入群体外推限制；5)结论语气改为条件语气并添加并行未证实警示。
  r6 needs_revision -> 修复并行证伪接口、跨文化证伪闭合、三选一权重靠硬、理性再分配佐证预注册、群体外推限制
