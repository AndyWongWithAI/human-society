applicable_sources:
  - source_name: 组织社会学
    rationale: |
      Campbell (1979) 在“Assessing the impact of planned social change”中提出“社会指标用于决策时越容易量化，越易扭曲其衡量的社会过程”。Power (1997) 在《The Audit Society》中详细描述了审计指标如何改变组织内行为与认知。Espeland & Sauder (2007) 在“Rankings and Reactivity”中通过法学院排名实证展示了量化排名如何改变申请者、管理者及教师的注意力，使其忽视排名未覆盖的质素。
  - source_name: 认知科学
    rationale: |
      Polanyi (1966) 在《The Tacit Dimension》中论证了大量专业知识是“默会的”，难以通过数字完全捕捉。Dreyfus & Dreyfus (1986) 在《Mind over Machine》中提出技能习得五阶段模型，指出专家级判断依赖直觉与情境模式识别，而非分析性指标；若将专家置于仅依赖指标的环境中，其直觉能力会逐渐退化（“用进废退”）。Ericsson等关于刻意练习的研究也表明，若注意力从直接反馈转向指标，技能提升会停滞。
falsifiability: |
  证伪条件（满足任意一条即可）：
  (a) 在一个长期（至少2年）依赖量化指标考核的组织中，对该组织成员进行盲测（与外部专家标准对比），发现其定性判断准确率与引入指标前相比无显著下降，或略有上升。
  (b) 通过实验设计，让一组被试在模拟任务中仅依赖量化指标反馈（无现场经验），另一组接受现场经验训练，结果发现依赖指标组的定性判断能力（如识别产品缺陷、评估演讲质量）与对照组无差异或更高。
  (c) 对组织进行长期追踪观察，发现即使指标覆盖范围与真实目标存在较大偏差，成员仍能通过其他途径（如保留非正式交流）维持定性判断能力，且能力未随时间退化。

  反向失败模式：
  量化指标也可能增强定性判断，而非侵蚀。注册四种可能的反向机制：
  (a) 结构化反馈机制：量化指标提供的系统性反馈可帮助个体建立更精确的心智模型，从而增强定性判断；
  (b) 问责压力机制：量化考核创造的问责压力可能迫使个体更系统地关注细节，包括指标未覆盖的定性维度；
  (c) 脚手架机制：量化指标作为认知脚手架，释放认知资源用于定性判断；
  (d) Goodhart 对齐版本：如果量化指标与真实目标高度对齐，即指标覆盖了所有关键维度且权重恰当，则个体可能通过优化指标同时提升真实目标，从而定性判断能力未必退化。但本砖聚焦于指标覆盖存在偏差的情形，因此该反向机制不阻断核心机制，仅澄清边界：当指标完全对齐时，退化可能不发生。
  因果方向辨析：本砖主张的侵蚀方向并非普遍适用，而是在以下条件成立时占主导：①指标覆盖范围与真实目标存在偏差（指标有漏项）；②个体日常工作中缺乏足够的定性判断实践（见限制中的“额外定性训练”定义）。若上述条件不满足，增强机制可能占优。本砖的证伪条件仍可区分：若观察期内发现定性判断上升，则命题被证伪；若下降，则支持命题。反向模式的存在不推翻核心机制，而是界定了其适用边界。
