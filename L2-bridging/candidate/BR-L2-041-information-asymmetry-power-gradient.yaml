id: BR-L2-041
type: bridge
layer: L2-bridging
status: candidate
term: 信息不对称作为权力梯度
人话摘要: 当一个人知道你不知道、但你需要的信息时，他就能影响你的决定，即使他没有强迫你。这种权力的大小取决于你能否找到其他信息来源，或者能否低成本地验证他给的信息是否靠谱。
statement: |
  经验假设（非L1定义推论）：信息不对称可以导致非对称影响力，其大小随B对信息的需求程度（由信息独特性衡量）和验证成本梯度变化。这一梯度关系不是L1定义的分析性真理——L1仅将"信息优势"分类为一种权力基础，并未承诺其强度随具体特征单调变化。因此本砖的核心经验贡献在于检验该梯度关系的存在性与边界条件。
  可检验预测：在其他条件相同且其他权力基础被控制的情况下，
  (1) 信息替代来源越少，A对B的影响力越大；但需注意反向失败模式：当物理上不存在替代来源（替代来源=0）且B系统性不信任A的初始条件下，影响力不仅不是最大，且可跌穿零（B把A信源反向利用）。
  (2) 验证成本越高，影响力越大；但受限于边界条件：当验证成本超过决策可行性阈值（即B无法在决策时限内完成验证）时，影响力发生形态转换（B的反应存在以下已注册路径，而非简单的"断崖→0"）：(a) 代理决策——B委托A或第三方做出决策（如医生-患者场景，但需注意该场景可能含其他权力基础）；(b) 元认知升级——B采用信任/不信任启发式替代直接验证（参见Gigerenzer & Gaissmaier, 2011对启发式决策的综述）；(c) 决策瘫痪——B回避决策本身。在这些路径下，影响力的测量对象需相应调整：代理决策中影响力体现为委托人对代理人建议的遵从度；元认知升级中影响力体现为信任启发式下对A信源权的认可；决策瘫痪中影响力体现为B的回避行为本身（与基线状态的差异）。原声称"影响力→0"过于简化，现修订为"影响力形态转换"——影响力并未消失，而是表现为不同于"梯度单调"声称的形式。（实证参考：Gigerenzer, G., & Gaissmaier, W. (2011). Heuristic decision making. Annual Review of Psychology, 62, 451-482. 论证了高不确定性下个体采用基于信任的简单启发式而非理性验证。）
  (3) 信息独特性和验证成本的交互效应：两者均高时影响力最大；但需注意反向路径：高独特性+高验证成本可能触发B的警觉反应、替代寻求行为或决策延迟，或信息囤积（B通过长期学习消除自身信息劣势，绕过梯度本身），而非"影响力最大"；在信息囤积路径下，"影响力最大"的主张不成立。高独特性+极低验证成本（公开易验证信息）则可能触发B直接验证：若A信息正确，则通过信誉累积路径形成未来高影响；若错误，则形成负向影响（A长期信誉受损）。"最大"仅在"高独特性+中验证成本"组合下成立，但需考虑上述反向路径。当influence测量落入低影响或负影响档位时，必须二次测量B的警觉信号（如反向信息寻求行为、对A信源权的后续引用频率），以区分"影响力真小"与"影响力形态转换为警觉反应"。警觉信号测量方法见operationalization.influence的对应条目。
  限制：本桥接砖不声称信息不对称是权力的唯一来源，也不声称它总是被主动使用或导致剥削；它仅描述一种可检验的基础机制。此外，本推论不适用于以下场景：(1) B面临的是一次性无替代机会的囚徒困境（即一次性囚徒困境），且验证成本物理上无法克服；(2) A故意保留信息的沉默权（即A有权不分享信息，这本身是权力维度，不在本推论射程内）；(3) A主动加工信息形成判断性信息（即"信息加工能力"本身属于另一权力基础，本推论仅覆盖关于世界某个情况的原始表示，不包括加工过的判断）；以及更一般地，信息不可被决策利用的场景。
bridges_to:
  concepts:
  - CONCEPT-information
  - CONCEPT-power
  - CONCEPT-exchange
applicable_sources:
- source_name: information_economics
  rationale: |
    Akerlof (1970) 在《柠檬市场》中证明，二手车市场中卖方拥有信息优势，导致逆向选择和市场失灵，这直接揭示了信息不对称如何赋予卖方对买方的权力（卖方可以决定是否欺瞒）。Stiglitz (2000) 在《信息不对称与权力》一文中系统论述了信息不对称如何塑造组织内的权力关系，特别是信息租金（information rent）的概念。Principal-agent 理论进一步表明，代理人利用信息优势获取谈判力（如 Jensen & Meckling, 1976）。
- source_name: social_psychology
  rationale: |
    French & Raven (1959) 提出五种权力基础，其中"专家权力"（expert power）明确源于一方拥有另一方所需的知识或技能，这正是信息不对称的人际表现。Fiske (1993) 在权力-as-control 理论中，将信息控制列为权力的关键维度之一，指出信息拥有者可以通过选择性分享来影响他人判断。
falsifiability: |
  以下任一情况可证伪本桥接砖的经验假设：
  (a) 在控制实验环境中，B需要A的信息来完成一个客观目标（例如正确预测一个随机事件），且A提供的信息经客观证实是正确且能显著提高B的绩效，但B完全拒绝采纳A的建议（行为上与无信息基线无显著差异）。此条件避免了"真实且有利"的主观判断，通过客观绩效标准判定。
  (b) 在其他权力基础被严格控制（A对B无强制、资源控制、地位、人数优势）的条件下，当B可以从多个独立来源获得相同信息且验证成本极低时，A对B的影响力与高独特性、高验证成本场景无显著差异。
  (c) 在控制其他变量后，实测发现信息独特性与影响力呈显著负相关，或验证成本与影响力呈显著负相关，或当替代来源=0且B系统性不信任A时影响力与信息独特性呈负相关（对抗性解读）。
  (d) 当验证成本超过潜在决策收益时，A的信息优势对B的行为不产生任何可测量的影响（至少两个独立 measurement 落入低档且第三个未落入高档；不同 measurement 需来自独立数据源，避免同一行为的多 proxy 算作独立），证伪梯度单调性声称。
review_summary: |
  r1 needs_revision -> 修复brick=conclusion（重新定位经验假设）、anti-talisman（重写证伪条件）、感知循环（独立测量方案）、口径注册（三个变量操作化）
  r2 needs_revision -> 修复预测(2)(3)单调性边界条件、追加falsifiability条件(d)、增补限制段落
  r3 needs_revision -> 修复预测(2)边界声明自洽性、注册口径仲裁规则、补全预测(3)反向分支、追加信息暴露控制、明确限制段落中的一次性囚徒困境
  r4 needs_revision -> 修复预测(2)边界反向失败模式(代理决策/元认知升级/决策瘫痪),补充射程排除(沉默权/加工信息),补充实证引用Gigerenzer & Gaissmaier 2011
  r5 needs_revision -> 修复(1)决策瘫痪测量追加基线控制规则；(2)预测(3)反向路径注册警觉信号独立判据；(3)information_uniqueness和verification_cost的arbitration_rules追加阈值元规则；(4)influence注册聚合规则（均值/众数预注册）
  r6 needs_revision -> 注册信源垄断下对抗性解读反向失败模式；注册信息囤积第三反向路径；补充influence跨形态转换仲裁规则；补充矛盾档位三档交叉仲裁；修正falsifiability(d)门槛为至少两个独立低且第三个未高
operationalization:
  information_uniqueness:
    definition: "信息独特性：B能从其他独立来源获得相同信息的难易程度。"
    measurement:
      - method: "替代来源数量"
        numerator: "B能够列举的其他独立信息源数量"
        denominator: "场景中总可能独立信息源数量"
        threshold: "寡头(<3) vs 竞争(3-10) vs 充裕(>10)"
      - method: "Shannon互信息"
        numerator: "A信息与B已有信息之间的互信息量"
        denominator: "A信息的总信息量"
        threshold: "高互信息(>0.7)表示高独特性；低互信息(<0.3)表示低独特性"
    arbitration_rules: |
      当多套口径给出冲突档位时，以替代来源数量为主，Shannon互信息为辅。若两者冲突，取替代来源数量结果；若其中之一无法测量，则使用另一套。事后选择口径救推论的反向裁决规则：如果选择的口径使结论成立，则触发反向裁决，推论无效。沿用L4-009判例的预注册漏洞成本原则。
      此外，阈值元规则：预注册阈值的设定必须保证合理现实场景中落入推论声称的'最优'区间的比例不超过80%。如果超过，则判定阈值过宽，推论需修订阈值或证明该聚集是经验事实。沿用L4-009反向裁决原则。
  verification_cost:
    definition: "验证成本：B为确认A信息的真实性所需付出的资源。"
    measurement:
      - method: "时间成本"
        numerator: "验证所需时间（分钟）"
        denominator: "决策时限（分钟）"
        threshold: "高成本(>0.8时限)；中等(0.3-0.8)；低成本(<0.3)"
      - method: "金钱成本"
        numerator: "验证所需金钱（元）"
        denominator: "一次决策的潜在收益（元）"
        threshold: "高成本(>0.5收益)；中等(0.1-0.5)；低成本(<0.1)"
      - method: "认知负荷（主观）"
        numerator: "B报告的主观验证困难度（1-7 Likert）"
        denominator: "7"
        threshold: "高(>5)；中(3-5)；低(<3)"
    arbitration_rules: |
      当多套口径给出冲突档位时，以时间成本为主，金钱成本为辅，认知负荷为备用。若时间成本与金钱成本冲突，取时间成本；若时间成本无法测量，则使用金钱成本；若两者均无法测量，则使用认知负荷。事后选择口径救推论的反向裁决规则：如果选择的口径使结论成立，则触发反向裁决，推论无效。沿用L4-009判例的预注册漏洞成本原则。
      此外，阈值元规则：预注册阈值的设定必须保证合理现实场景中落入推论声称的'最优'区间的比例不超过80%。如果超过，则判定阈值过宽，推论需修订阈值或证明该聚集是经验事实。沿用L4-009反向裁决原则。
  influence:
    definition: "非对称影响力：A对B决策或行为的改变程度。"
    measurement:
      - method: "行为偏离程度"
        numerator: "B在收到A信息后的行为与B在没有A信息时的基线行为之间的差异"
        denominator: "基线行为到最优行为的最大可能距离"
        threshold: "高影响(>0.5)；中(0.2-0.5)；低(<0.2)"
      - method: "态度改变"
        numerator: "B在决策后对A的信任评分变化（前后测差值）"
        denominator: "7"
        threshold: "高(>3)；中(1-3)；低(<1)"
      - method: "资源转移"
        numerator: "B自愿转移给A的资源数额（如时间、金钱）"
        denominator: "B可控资源总额"
        threshold: "高(>0.3)；中(0.05-0.3)；低(<0.05)"
      - method: "回避行为差异（决策瘫痪路径专用）"
        numerator: "B在收到A信息后的回避行为频率（如延迟决策）与B在无A信息场景下独立测量的基线回避行为频率的差值"
        denominator: "基线回避行为频率（在A信息引入前独立测量，不能事后追溯）"
        threshold: "高影响(>0.5)；中(0.2-0.5)；低(<0.2)"
      - method: "警觉信号（反向路径判据）"
        numerator: "B的反向信息寻求行为次数、对A信源权的后续引用频率的综合评分（0-1）"
        denominator: "1"
        threshold: "高警觉(>0.5)；中(0.2-0.5)；低(<0.2)"
    cross_modal_arbitration: |
      当influence在不同路径（代理决策的遵从度、元认知升级的信任认可、决策瘫痪的回避差异）之间切换时，按决策行为是否发生做二分：
      - 若决策行为发生（B做出了明确选择），则使用遵从度与信任认可的均值作为influence测量值；
      - 若决策行为未发生（B回避决策进入决策瘫痪路径），则使用回避差异作为influence测量值。
      两类测量结果用不可比标记单独报告，不得用统计聚合。
    arbitration_rules: |
      当"行为偏离程度"测量落入低档但"警觉信号"测量落入高档时，按已注册规则（警觉信号判据）进行二次测量。
      当出现"行为偏离程度"低 + "警觉信号"高 + "信任评分变化"低的三档交叉时（信任未变化但行为已警觉），需进行三档交叉仲裁：
      - 若信任评分变化低但警觉信号高，表明B在行为层面未遵从（低偏离）但已产生对抗性反应（高警觉），而信任未变化说明对抗性反应尚未内化为态度改变。此时influence应以警觉信号为主（因为行为偏离可能因决策瘫痪而非低影响），判定为高档，并记录为"形态转换——对抗性警觉"。
      所有仲裁规则须在实验设计阶段预注册。
    aggregation_rules: |
      预测(3)声称的"影响力最大"是群体层面的聚合结果。需预注册选择使用均值或众数作为聚合统计量。若使用均值，需报告方差；若分布严重偏斜，推荐使用众数。所有聚合规则必须在实验设计阶段预注册，不能事后选择。
    independent_measurement_note: |
      为打破感知循环，B对A信息的"需要"不能由B的服从行为反推。上述操作化中的变量均采用外部客观测量或第三方评估，而非B的行为报告。例如，可采用两个阶段实验：阶段一，B在没有A信息的情况下完成一个任务（任务要求准确率），记录基线绩效；阶段二，引入A的信息，测量B的采纳率。B对信息的"客观需要"由基线绩效差（有信息时绩效提升）定义。当B无信息时绩效低于有信息时，证明B客观需要该信息，无需依赖B的主观报告或事后归因。
      此外，阶段二"信息暴露"本身对B的影响需被控制：建议引入"暴露但内容打码"对照组，将"接触信息"效应与"信息内容"效应分离，否则基线→阶段二的对比混入"是否接触信息"这一未控制变量。
