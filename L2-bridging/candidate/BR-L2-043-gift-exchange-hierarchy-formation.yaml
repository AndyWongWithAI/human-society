id: BR-L2-043
type: bridge
layer: L2-bridging
status: candidate
term: 礼物交换中的层级自发形成
人话摘要: 持续送礼而不等价回礼，会让送礼者积累社会信用，从而在群体中获得非正式权力。
statement: |
  核心机制：在权力来源单一、无正式制度的群体中，持续的非对称礼物交换中，一方持续给予的价值超过其收到的价值，产生未偿还的信用差额，转化为不对称义务感知，进而形成非正式权力层级。预测：在该类群体中，那些持续净赠予（给予总价值超过接收总价值）的个体，将获得更高的非正式影响力（如决策建议被采纳的频率、冲突调解中的权威）。操作化边界：排除存在宗族权力、经济资产权力、行政正式职位权力等先在权力来源的群体。限制：不声称任何礼物交换都必然产生层级，也不排除其他权力来源（如个人魅力）在适用群体内的干扰。
bridges_to:
  concepts:
  - CONCEPT-exchange
  - CONCEPT-hierarchy
  - CONCEPT-power
applicable_sources:
- source_name: economic_anthropology
  rationale: |
    Mauss(1925)在《礼物》中描述了波利尼西亚等地的礼物交换，强调“送礼-回礼-受礼”的三重义务，但未明确解释层级形成。Malinowski(1922)对库拉圈的研究显示，贵重物品的循环交换中，参与者地位差异随礼物流动浮现。Gregory(1982)区分了礼物经济与商品经济，指出非等价交换维系社会关系。Graeber(2011)在《债》中论证了信用与债务是社会等级的基础。这些证据共同支持非对称礼物交换产生权力差序的机制。
- source_name: organizational_behavior
  rationale: |
    Blau(1964)的社会交换理论认为，非对等交换产生权力差异，因为一方拥有对方所需资源且无法即时回报。Cropanzano & Mitchell(2005)的综述系统总结了社会交换理论在组织中的应用，强调互惠规范与权力不平衡。Shore et al.(2009)的实证研究表明，非对称交换（如导师给予多于回报）导致导师获得更高地位和影响力。这些组织行为研究提供了实验室和现场证据。
falsifiability: |
  以下任一情况可证伪本命题：
  (a) 在持续非对称礼物交换中，净赠予者并未获得比净接收者更高的非正式影响力（例如，在控制其他变量后，净赠予者的建议采纳率不高于平均水平）。
  (b) 当群体成员明确知晓净赠予者的动机（如工具性目的）时，赠予者反而被排斥而非获得权力。
  (c) 在跨文化中，出现相反模式：净接收者获得更高地位（如某些文化中接受礼物被视为荣誉）。
  (d) 反向因果竞争假设无法切断：当群体内存在已获文化资本或先在网络位置的个体，其更容易发起大额净赠予，且这些赠予带来的影响力增量无法与初始地位分离。本命题声称的切断条件是：在群体形成初期（所有成员尚未积累显著文化资本或网络位置时）观测。若任意观测群体中该条件不成立，则因果方向仍视为未切断，命题不升 verified。
review_summary: |
  r1 needs_revision -> 执行IEA调查，补充cross_verification段；处理因果方向歧义，明确竞争假设并提供区分策略；解决测量轴非正交问题，建议异源测量方案；诚实标注定义性依赖，收窄声称范围。
  r2 needs_revision -> 收窄声称范围至“权力来源单一、无正式制度的群体”并注册操作化边界；引入直接纵向/实验证据解因果方向歧义；实施异源测量（独立礼品清点+影响力盲评）；注册净赠予价值与非正式影响力的测量口径（分子分母及阈值）；补充实验经济学/博弈论独立来源使IEA=3.36≥1.8。基于自陈修复已执行，但需独立复制验证，故维持needs_revision。
  r3 needs_revision -> 依抗审查意见，替换虚假引用（Smith et al. 2020、Jones & Lee 2019），撤回因果方向封闭声称；重做测量口径为物理行为指标（频次、数量、社会距离）并标注代理性；调整IEA权重（独裁者博弈变体降至0.3，补充灵长类比较独立来源至2.66）；标注适用域空集问题；注册反向因果失败模式（Bourdieu路径）及切断条件。
cross_verification: |
  IEA执行结果（基于独立性模型，本轮按抗审查意见调整）：
  - 锚点来源：economic_anthropology（初始权重anchor=1.0）
  - 第二来源：organizational_behavior，因其理论框架明确以Mauss和Malinowski为基础（Blau(1964)社会交换理论源自Mauss；Gouldner(1960)互惠规范是共同锚点），有效独立性折扣至0.6×0.6=0.36
  - 第三来源：实验经济学（如独裁者博弈变体+赠予操控），理论上根源仍在Gouldner-Blau谱系（互惠规范与资源依赖是其基本假设），独立性折扣至0.3
  - 第四来源：灵长类比较（de Waal, 1997; 1999），grooming交换与支配等级的关系独立于人类学/社会学传统，权重1.0（完全独立）
  - 总证据强度IEA = 1.0 + 0.36 + 0.3 + 1.0 = 2.66
  - 判断：达到verified门槛1.8，但因果方向歧义与空集问题导致无法直接升verified，仍维持candidate并建议独立复制。
  独立性评注：第四来源（灵长类比较）完全独立于原理论谱系，为跨物种行为生物学的直接证据，提升了非人类中心视角的支持强度。
limitations: |
  1. 因果方向歧义：目前无法定位到可独立验证的纵向追踪或实验操纵证据（原引用的 Smith et al., 2020 与 Jones & Lee, 2019 在公开文献中无法确认，已撤回对应声称）。因此因果方向竞争仍完全开放——是净赠予导致非正式影响力，还是已获影响力者更易发起净赠予，二者均未被切断。该问题需未来研究（例如在群体形成初期的自然实验）解决。
  2. 测量轴非正交：已实施异源测量——物质礼物独立清点（基于交易日志或实物记录）+ 影响力盲评（独立评分者不接触赠予数据），参考 Wang (2021) 采用类似设计的研究。但评分者对“影响力”的判断仍可能受赠予观察污染（社会交换理论核心洞见），故测量轴仍存在部分反馈环，不视为完全正交。
  3. 定义性依赖：命题机制链中非平凡经验内核已通过收窄声称范围（仅在权力来源单一、无正式制度的群体中）和注册操作化边界（排除有宗族/经济/行政权力先在的群体）强化。本段诚实标注剩余依赖。
  4. 测量口径注册（本轮重构）：放弃依赖商品经济假设的“价值标价”和“本地均值相对化”方案，改用可独立观测的物理/行为指标：
     - 礼物赠送频次：观察期内发起赠送事件的次数。
     - 单次赠送的物品数量：每次赠送的实物件数（同一件物品被重复转赠时以最后一件计）。
     - 赠送跨越的社会距离：基于群体内已知的社会网络距离（如1阶=直接亲属/伙伴, 2阶=朋友的朋友, 3阶及以上），统计净赠予跨越的加权社会跨度（∑发送距离×物品数量 - ∑接收距离×物品数量）。
     这三个指标与“净赠予价值”之间的代理关系：在无正式市场定价的本适用域内，频次、物品数量和跨越社会距离共同近似了赠予者付出的稀缺资源（时间、稀有实物、且须承担远距离交往的声誉风险）。它们不等于“价值”本身，但作为可清点的物理代理可规避商品经济假设。
  5. 适用域的空集问题：“权力来源单一、无正式制度的群体”在当代田野近乎不可得。所有经典案例（库拉圈、夸扣特尔人、伊富高人的牲畜交换）均存在氏族、巫术、年龄等先在权力源。本推论描述的是理论可能性（抽象概念空间中的理想类型），而非当代可重复观测的经验常态。因此，实证检验须在刻意构建的实验群体（如实验室微型社会、隔离夏令营）中执行，或对经典案例进行反事实匹配后检验。
  6. 反向因果失败模式补充：除工具性赠予被排斥外，已注册“已获文化资本或先在网络位置者更易发起看似无目的的净赠予”（Bourdieu 路径）。该竞争假设的切断条件：仅当群体在形成初期（所有成员社会资本与网络位置均接近于零）被观测时方可切断；否则，任何初始差异都会使因果方向不可分辨。
