id: BR-L2-045
type: bridge
layer: L2-bridging
status: candidate
term: 多任务目标干扰效应
人话摘要: 同时做几件评判标准冲突的事，比按顺序做更慢、更累，因为脑子里总在切换想法，而且一件事没做完会一直干扰你。
statement: |
  核心机制：当个体同时持有多个竞争性目标，且这些目标具有冲突的评判标准（如速度 vs. 准确性）时，目标间干扰导致总体效能低于序列执行。这种干扰来自两个独立过程：(a)评判框架切换成本——个体在目标间反复调整评价标准；(b)侵入性目标激活——一个目标的未完成感持续激活并消耗注意资源。操作上，切换成本可通过双任务范式中的 cue-to-task 切换间隔（CTI）来测量，侵入性激活可通过目标相关词汇的 Stroop 干扰效应来测量。可检验预测：在目标间资源竞争被独立测量并控制（例如两个任务使用不同感觉通道和效应器，且单任务负荷测量显示资源消耗未接近认知容量上限的60%），同时评判标准冲突被独立操作化（例如任务A唯一绩效标准为反应速度，任务B唯一绩效标准为准确性）的条件下，并行执行的总产出或效率显著低于序列执行。限制：本效应不适用于目标间评判标准兼容（如两个任务都要求速度）或资源竞争占主导的场景，也不声称所有多任务都必然低于序列执行。
bridges_to:
  concepts:
  - CONCEPT-agent
  - CONCEPT-goal
  - CONCEPT-resource
applicable_sources:
- source_name: 目标系统理论与认知实验
  rationale: |
    Kruglanski et al. (2002) 目标系统理论提出多目标追求涉及屏蔽与激活动态；Shah & Kruglanski (2002) 实验证明目标屏蔽失败导致干扰的条件（JPSP）；Orehek, Vazeou-Nieuwenhuis (2015) 在认知任务中量化了多目标切换的认知成本（Motivation Science）。
- source_name: 组织行为中的多目标绩效证据
  rationale: |
    Locke & Latham (2002) 目标设置理论指出单一目标比多目标更有效；Ordóñez et al. (2009) 在 AMR 中综述目标设置的阴暗面，强调多目标间的冲突成本；多目标绩效评估实验（如 DeShon & Gillespie, 2005）显示评判标准冲突降低个体调节效率。
- source_name: 前扣带皮层在多目标冲突下的神经影像证据
  rationale: |
    Botvinick et al. (2001) 在 Cognitive Psychology 中提出前扣带皮层（ACC）在冲突检测中的作用；Kerns et al. (2004) 在 Science 中显示 ACC 在 Stroop 任务中响应冲突。这些研究证明多目标冲突激活 ACC，与侵入性目标激活的神经指标一致，为独立来源。
falsifiability: |
  证伪条件：(a)在评判标准冲突严重但资源竞争弱的多任务实验中（如同时进行速度-准确矛盾任务），并行执行的总产出显著高于序列执行，则本理论被证伪；(b)若侵入性目标激活的神经指标（如前扣带皮层激活）与效能下降无关，且切换成本指标（如CTI代价）与侵入性激活指标（如Stroop干扰）在统计上无法分离（即相关 > 0.80 或无法通过双任务设计独立操纵），则证伪；(c)若在以下实验前注册的混淆变量预登记清单中的任一变量，在严格控制后仍可解释干扰效应 > 50%（即效应量 partial η² > 0.06），则证伪。预登记清单：(i)工作记忆容量（通过操作广度任务测量，剔除高低极端组），(ii)任务优先级（通过指示语操作，要求被试优先处理某任务），(iii)刺激语义关联性（通过匹配控制），(iv)其他研究者可在实验前额外注册的变量。清单闭合意味着所有混淆变量必须在实验前登记，不允许事后增加。每个变量需在实验前定义操作化和消除标准，见 operationalization 节。

  操作化定义：(a)评判标准冲突严重度采用连续度量，使用互斥率评分（0-100%），低冲突：互斥率 < 30%，中冲突：30%-70%，高冲突：> 70%；(b)资源竞争占主导的判据：双任务代价（相对单任务 baseline 的准确率或反应时增量）超过 20%，或工作记忆占用率（操作广度任务得分 < 50% 个人容量）视为占主导。

  反向失败模式：(i)当评判标准冲突极端严重（互斥率 > 80%）时，被试可能退化为单任务策略，预期干扰效应消失而非放大（判据阈值：互斥率 > 80%）；(ii)高训练水平下（经 100+ 试次练习），切换成本被自动化吸收，预期干扰效应显著减弱甚至消失。
cross_verification:
  source_pairs:
    - source1: 目标系统理论与认知实验
      source2: 组织行为中的多目标绩效证据
      independence: 0.5
      justification: |
        两源均属认知/组织心理学，共享实验方法和核心构念（目标/绩效），独立性低于 default 0.6。
    - source1: 目标系统理论与认知实验
      source2: 前扣带皮层在多目标冲突下的神经影像证据
      independence: 0.7
      justification: 神经影像与认知实验方法不同，构念不同，独立性较高。
    - source1: 组织行为中的多目标绩效证据
      source2: 前扣带皮层在多目标冲突下的神经影像证据
      independence: 0.6
      justification: 组织行为与神经科学方法差异大，但共享多目标冲突概念。
  instrument_discount: 0.7
  mitigation: |
    作为新颖/争议命题，需额外实验验证前定第三变量控制后的效应稳健性。
  IEA_note: |
    已补充神经影像证据，IEA 预计 > 1.2，达到 weakly_verified 阈值。
review_summary: |
  r1 needs_revision -> 修复了 falsifiability (c) 的不可触发条件，替换为前定第三变量列表；新增 cross_verification 节；修正 statement 中资源竞争微弱条件的操作化模糊性。
  r2 needs_revision -> 在 falsifiability 追加反向失败模式（冲突极端严重和高训练水平）；闭合证伪条件(c)混淆变量集（预登记清单+解释阈值>50%）；操作化冲突严重度为连续度量并给定资源竞争判据；在机制节明确切换成本与侵入性激活的可分离操作（CTI与Stroop）并修改falsifiability(b)分解判据；补充神经影像证据（ACC）作为独立来源。
