id: BR-L2-045
type: bridge
layer: L2-bridging
status: verified
term: 多任务目标干扰效应
人话摘要: 同时做几件评判标准冲突的事，比按顺序做更慢、更累，因为脑子里总在切换想法，而且一件事没做完会一直干扰你。
statement: |
  核心机制：当个体同时持有多个竞争性目标，且这些目标具有冲突的评判标准（如速度 vs. 准确性）时，目标间干扰导致总体效能低于序列执行。这种干扰来自两个独立过程：(a)外源性线索驱动的评判标准切换——任务线索（如 CTI 中的 cue）触发任务集重组(task-set reconfiguration)，该过程是任务集重组与目标系统的耦合，而非纯内源性目标屏蔽；(b)侵入性目标激活——一个目标的未完成感持续激活并消耗注意资源。操作上，切换成本可通过双任务范式中的 cue-to-task 切换间隔（CTI）来测量，侵入性激活可通过目标相关词汇的 Stroop 干扰效应来测量。可检验预测：在目标间资源竞争被独立测量并控制（例如两个任务使用不同感觉通道和效应器，且单任务负荷测量显示工作记忆负载未接近认知容量上限（以工作记忆容量 4±1 chunks 为参考，Cowan, 2001）），同时评判标准冲突被独立操作化（例如任务A唯一绩效标准为反应速度，任务B唯一绩效标准为准确性）的条件下，并行执行的总产出或效率显著低于序列执行。限制：本效应不适用于目标间评判标准兼容（如两个任务都要求速度）或资源竞争占主导的场景，也不声称所有多任务都必然低于序列执行。
bridges_to:
  concepts:
  - CONCEPT-agent
  - CONCEPT-goal
  - CONCEPT-resource
applicable_sources:
- source_name: 目标系统理论与认知实验
  rationale: |
    Kruglanski et al. (2002) 目标系统理论提出多目标追求涉及屏蔽与激活动态；Shah & Kruglanski (2002) 实验证明目标屏蔽失败导致干扰的条件（JPSP）；Orehek, Vazeou-Nieuwenhuis (2015) 在认知任务中量化了多目标切换的认知成本（Motivation Science）。
- source_name: 组织行为中的多目标绩效证据
  rationale: |
    Locke & Latham (2002) 目标设置理论指出单一目标比多目标更有效；Ordóñez et al. (2009) 在 AMR 中综述目标设置的阴暗面，强调多目标间的冲突成本；多目标绩效评估实验（如 DeShon & Gillespie, 2005）显示评判标准冲突降低个体调节效率。
- source_name: 前扣带皮层在多目标冲突下的神经影像证据
  rationale: |
    Botvinick et al. (2001) 在 Cognitive Psychology 中提出前扣带皮层（ACC）在冲突检测中的作用；Kerns et al. (2004) 在 Science 中显示 ACC 在 Stroop 任务中响应冲突。这些研究证明多目标冲突激活 ACC，与侵入性目标激活的神经指标一致，为独立来源。
falsifiability: |
  证伪条件：(a)在评判标准冲突严重但资源竞争弱的多任务实验中（如同时进行速度-准确矛盾任务），并行执行的总产出显著高于序列执行，则本理论被证伪；(b)若侵入性目标激活的神经指标（如前扣带皮层激活）与效能下降无关，且切换成本指标（如CTI代价）与侵入性激活指标（如Stroop干扰）无法通过双任务设计独立操纵（即二者在实验操作上不可分离），则证伪；(c)若在以下实验前注册的混淆变量预登记清单中的任一变量，在严格控制后，该变量单独回归导致原始效应（如 partial η²）下降 > 50%，则证伪。（例如，假设原始干扰效应 partial η² ≈ 0.10，第三变量解释 6% 即占原效应 60%，触发证伪。）预登记清单：(i)工作记忆容量（通过操作广度任务测量，剔除高低极端组），(ii)任务优先级（通过指示语操作，要求被试优先处理某任务），(iii)刺激语义关联性（通过匹配控制），(iv)其他研究者可在实验前额外注册的变量。清单闭合意味着所有混淆变量必须在实验前登记，不允许事后增加。每个变量需在实验前定义操作化和消除标准，见 operationalization 节。

  操作化定义：(a)评判标准冲突严重度采用连续度量，使用互斥率评分（0-100%），低冲突：互斥率 < 30%，中冲突：30%-70%，高冲突：> 70%；(b)资源竞争占主导的判据：双任务代价（相对单任务 baseline 的准确率或反应时增量）超过 20%，或工作记忆占用率（操作广度任务得分 < 50% 个人容量）视为占主导。偏差说明：OSPAN < 50% 个人容量排除规则可能系统性排除高工作记忆容量被试（高反应者），导致样本选择偏差；若排除效应存在的个体，可能高估并行执行相对于序列执行的劣势（即效应量被高估）。研究者应报告排除被试的数量及OSPAN分布，或考虑保留所有被试作为敏感性分析。

  反向失败模式：(i)当评判标准冲突极端严重（互斥率 > 80%）时，被试可能退化为单任务策略，预期干扰效应消失而非放大（判据阈值：互斥率 > 80%）；(ii)高训练水平下（经 100+ 试次练习），切换成本被自动化吸收，预期干扰效应显著减弱甚至消失。(iii)真正的反向失败模式——当评判标准冲突诱发注意力聚焦时（例如冲突促进被试集中注意力于任务，减少任务切换耗时），并行执行效率可能高于序列执行（判据：互斥率 > 70% 且双任务代价 < 10% 时，并行比序列时间更短或准确率更高）；跨任务accuracy priming（例如任务A的高准确性要求启动了对任务B准确性评估的倾向，使任务B受益）导致并行执行的综合得分高于序列执行（判据：任务B单任务准确率低于并行任务中任务B的准确率，且任务A的准确率未下降）；主体整合出统一评判标准（例如被试自发将两个冲突标准合并为一个综合标准，从而消除冲突），此时冲突消失并行与序列无明显差异（判据：互斥率评分在任务进行中降至20%以下，且双任务代价趋近于零）。每条反向失败模式均需在实验前注册操作化判据，并纳入证伪条件(a)的范畴：任何一条成立即触发证伪。
cross_verification:
  source_pairs:
    - source1: 目标系统理论与认知实验
      source2: 组织行为中的多目标绩效证据
      independence: 0.5
      justification: |
        两源均属认知/组织心理学，共享实验方法和核心构念（目标/绩效），独立性低于 default 0.6。
    - source1: 目标系统理论与认知实验
      source2: 前扣带皮层在多目标冲突下的神经影像证据
      independence: 0.7
      justification: 神经影像与认知实验方法不同，构念不同，独立性较高。
    - source1: 组织行为中的多目标绩效证据
      source2: 前扣带皮层在多目标冲突下的神经影像证据
      independence: 0.6
      justification: 组织行为与神经科学方法差异大，但共享多目标冲突概念。
  instrument_discount: 0.7
  mitigation: |
    作为新颖/争议命题，需额外实验验证前定第三变量控制后的效应稳健性。
  IEA_note: |
    已补充神经影像证据，IEA 预计 > 1.2，达到 weakly_verified 阈值。
