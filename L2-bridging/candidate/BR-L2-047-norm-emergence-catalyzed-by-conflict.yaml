id: BR-L2-047
type: bridge
layer: L2-bridging
status: candidate
term: 冲突催化规范涌现
人话摘要: 当两个群体反复争夺资源且谁也灭不了谁时，他们会比和平时期更快地形成关于“谁该得多少”的规矩。
statement: |
  核心机制：在共享资源冲突中，若双方反复博弈且无法单方消灭对方，则冲突使原有的无规则默认状态变得不可持续，迫使双方投入认知资源寻找稳定的均衡点，从而加速非正式规范（如冲突调节类规范，包括资源分配规则、互不侵犯、报复对等、领土承认等）的试错‑收敛过程。冲突之所以比和平情境下的反复交互额外加速规范涌现，是因为：(a) 冲突提高了违约代价的显性化，使得试错反馈信号更强；(b) 冲突改变了信息结构，使得违规可见性陡升；(c) 冲突压缩了试错的容忍窗口，迫使快速收敛。和平情境下规范涌现慢，并非因为不需要规范，而是因为默认状态尚可接受，缺乏改变的紧迫性。
  可检验预测：在控制群体规模、资源类型和沟通成本等条件下，经历重复冲突且均势持续的群体，其冲突调节类规范（如资源分配规则）的出现时间显著短于无冲突的对照群体。
  限制：本命题不声称冲突强度越大规范越快，也不适用于一次性的毁灭性冲突；仅当冲突重复发生且双方均无法彻底击败对方时，该加速效应才成立。本命题的适用层级限定：在社群/部落层面（如共享牧场、村庄、部落）得到强支持；在国际主权层面（如国家间冲突）为弱支持或不适用，因为主权国家间规范涌现受更多外部因素（如国际法、联盟、外交）影响，且冲突烈度与持续时间差异较大。此外，首次冲突后的短期（建议≤2年或首个5次冲突内）可能出现规范解体或退化，而非涌现加速；因此本推理主张适用于持续冲突超过该时间阈值后。本推论仅适用于自下而上涌现成分占主导的规范形成过程，即由群体内多次互动自发收敛而来的规范，而非由某个权威或第三方设计并颁布的规范。操作化：如果规范形成过程中自发试错/调整的行为占比≥50%，则适用；若是明确设计并强制推行，则不适用。
bridges_to:
  concepts:
    - CONCEPT-conflict
    - CONCEPT-norm
  axioms:
    - AXIOM-003
applicable_sources:
  - source_name: conflict_studies
    rationale: |
      Ostrom (1990) 《公共资源的治理》通过多个案例（如瑞士阿尔卑斯牧场、日本森林）展示了冲突如何促使社区自发创建规则；Ellickson (1991) 《无需法律的秩序》对加州夏斯塔县牧场主之间的篱笆纠纷进行了田野调查，发现反复冲突加速了非正式边界规范的固化；Knight (1992) 《制度与社会冲突》从理论角度论证了分配冲突是制度变迁的关键驱动力。
  - source_name: evolutionary_game_theory
    rationale: |
      Young (1993) 在“The Evolution of Norms”中通过随机稳定均衡模型证明，冲突引发的支付变化可以缩短规范收敛的时间；Bowles & Gintis (2011) 《合作物种》利用agent‑based模拟表明，群体间冲突与组内合作的共演化能够显著加速利他与规范的出现速度。
falsifiability: |
  以下任一情况可证伪本命题：(a) 在重复冲突且双方均势的田野或实验情境中，规范的出现时间与无冲突情境无显著差异，甚至更慢；(b) 冲突频率与规范涌现速度呈负相关；(c) 在系统综述或大规模比较研究中，冲突组规范涌现的中位时间不短于非冲突组。(d) 冲突烈度超过阈值时，规范涌现时间反而延长，甚至出现规范倒退。阈值定义：年均冲突事件数>3次，其中"一次冲突事件"定义为由一方发起的、涉及直接暴力或财产掠夺的行动（包括但不限于牲畜劫掠、边界侵犯、致命袭击、大规模械斗），以双方都认知为事件为准，分母为观测年数；或伤亡率>2%，其中伤亡率为冲突期间双方合计死亡人数除以双方总人口（含非战斗人员），为累计值而非年均值。

operationalization:
  stalemate_measurability: |
    为"均势"(stalemate)注册事前可测的操作化指标：
    - 冲突前五年内双方军事力量比(或经济资源比)在0.5-2.0之间
    - 冲突爆发后两年内，任何一方无法取得决定性军事胜利（定义为控制对方≥50%领土或消灭对方≥50%战斗力）
    - 若无法获取军事/经济数据，可使用第三方评估(如UCDP/PRIO冲突数据库中的"stalemate"编码)或田野研究者对双方控制区域稳定性的主观编码(0-10量表，≥6视为均势)
    备选方案：若上述指标在特定情境中不可行，可将"均势"从必要条件降格为调节变量——"均势程度越高，加速效应越强"，使命题在均势不完美的情境中仍可检验。
  norm_emergence_measurability: |
    为"规范的出现时间"注册操作化定义：
    实验室情境(公共池资源实验)：从第一轮交互到组内平均提取量收敛至Nash均衡±10%范围内并持续≥5轮的轮次数。
    田野情境：从冲突首次记录到第一次出现被双方引用为"规矩/惯例/老规矩"的行为规则的时间跨度(以年为单位，由田野研究者编码)。需满足：(a) 规则被至少一方成员口头引用或书面记录；(b) 规则被违反后至少有一次被观察到非正式制裁(如抱怨、排斥、调整行为)；(c) 持续存在至少6个月(或两个观察周期)。
    对模糊渐进规范：取"从偶尔遵守(≤25%时间)到通常遵守(≥75%时间)的转变点"作为出现时间，由田野研究者根据访谈和观察确定。
    无冲突对照群体的操作化口径：优先采用地理临近但无冲突历史记录的群体（如相邻牧场但未发生冲突的社区）作为对照；若无此类群体，可采取同一群体冲突前与冲突后的时间前后对比（需控制时间效应）；或跨文化匹配人口规模、资源类型相似的群体进行比较。对照群体需满足：在观察期间内无任何武装冲突或公开敌对行为记录（UCDP编码为0），且无本地认知的各类低烈度冲突（包括但不限于族群冲突、牲畜盗劫、边界摩擦、巫术冲突），这些低烈度冲突需通过田野调查或历史记录交叉验证。若存在低烈度冲突但未被UCDP编码，则属于"低烈度冲突漏计"，需在事前设计测量方案（如列出低烈度事件清单并清点）以确认对照群体真正无冲突。若无此类事前测量，则不得声称对照为"无冲突"，应标注为"低烈度冲突状态不明"。
  unsustainability_measurability: |
    "不可持续默认状态"的独立于规范涌现的操作化定义：采用以下至少一个指标：
    - 资源损耗率：冲突前后资源存量下降速率超过该资源自然恢复速率的两倍，且持续超过一个季节周期；
    - 伤亡累积速率：冲突期间双方合计伤亡人数超过群体总人口的5%且年增长率超过1%；
    - 群体退出率：每年因冲突而迁离或解散的成员比例超过10%。
    若上述指标在观测期内超过阈值，则视为默认状态不可持续，无需等待规范涌现即可判定。
    注意：该操作化用于事前确定"不可持续"状态，避免事后用规范涌现来定义不可持续性。

cross_verification:
  anchor_source: conflict_studies
  anchor_weight: 1.0
  independent_vote: evolutionary_game_theory
  independence_coefficient: 0.5
  weighted_support: 1.0 * 1.0 + 1.0 * 0.5 = 1.5
  IEA: 1.5
  note: "IEA = 1.5，介于weakly_verified(1.2)和verified(1.8)之间，可视为weakly_verified。由于两个来源方法差异较大(田野案例 vs. 形式模型/模拟)，独立性系数取0.5属于保守估计。若未来补充更多独立来源(如实验经济学)，可提升IEA。"

review_summary: |
  r1 needs_revision -> 修复了均势的操作化指标、规范出现时间的测量口径、添加了IEA交叉验证结构。
  r2 needs_revision -> 修复了因果增量机制显式化、无冲突对照群体口径、反向失败模式、适用层级限定、规范类型拓宽。
  r3 needs_revision -> 注册了低烈度冲突漏计事前口径、不可持续默认状态操作化、冷启动窗口限定、d子句阈值分子分母、涌现vs设计混合比例限定。

