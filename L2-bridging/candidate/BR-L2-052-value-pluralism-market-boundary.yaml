id: BR-L2-052
type: bridge
layer: L2-bridging
status: candidate
term: 价值多元主义与市场边界
人话摘要: 一个社会越是看重某个东西（比如公平、健康），就越反对用钱买卖它；反过来，从人们对“用钱买”的愤怒程度，就能猜出他们有多看重那个东西。
statement: |
  核心机制：社会共享一套有限的核心价值维度（如Schwartz的10种基本价值），不同社会对这些维度的权重排序不同。当市场交换（以价格为协调机制）从“可商品化的物品”扩展到“价值排序中高权重维度所依附的物品或关系”（如器官、教育机会、政治影响力）时，触发的社会抵抗强度与该维度的权重正相关。
  可检验预测：在同一社会内，对“价值权重前30%的域被市场化”的抵抗将系统性强于“后30%的域被市场化”的抵抗。
  限制：本命题不声称价值维度是抵抗的唯一原因（其他因素如制度、历史也可能影响），也不预测所有市场化尝试都会引发同等强度的抵抗，仅聚焦于因价值权重不同而产生的系统性差异。
bridges_to:
  concepts:
    - CONCEPT-value
    - CONCEPT-exchange
    - CONCEPT-morality
applicable_sources:
  - source_name: economic_sociology
    rationale: |
      Zelizer (1979, 1994) 的货币 earmarking 研究显示，人们将特定用途的钱与特定物品绑定，拒绝以市场逻辑交换某些亲密关系；Sandel (2012) 在《金钱不能买什么》中列举了大量市场扩张引发道德抵抗的案例；Fourcade (2011) 通过比较不同国家对“生命定价”的态度，展示了市场化与道德化的互动。这些研究共同支持：当市场入侵高价值维度领域时，会触发强烈社会抵抗。
  - source_name: cross_cultural_psychology
    rationale: |
      Schwartz (1992, 2012) 提出10种基本人类价值并跨文化验证其结构；Inglehart & Welzel (2005) 利用世界价值观调查数据揭示不同社会的价值权重排序在代际变迁中的稳定性。这些证据表明价值维度具有跨文化普遍性但权重不同，为本命题提供了价值维度的可操作化基础。
falsifiability: |
  以下情形皆可证伪本命题：
  (a) 在同一社会内，对“价值权重前30%的域被市场化”的抵抗强度显著弱于“后30%的域被市场化”的抵抗；
  (b) 在不同社会之间，对同一物品（如教育机会）的市场化抵抗强度与该社会对该物品所属价值维度的权重排序无关（例如，在其他变量控制下无显著正相关）；
  (c) 通过实验或调查，无法识别出价值权重独立于收入不平等、政治制度等因素对抵抗强度的显著预测作用。
