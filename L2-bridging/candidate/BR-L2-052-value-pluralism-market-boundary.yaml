id: BR-L2-052
type: bridge
layer: L2-bridging
status: verified
term: 价值多元主义与市场边界
人话摘要: 一个社会越是看重某个东西（比如公平、健康），就越反对用钱买卖它；反过来，从人们对“用钱买”的愤怒程度，就能猜出他们有多看重那个东西。
statement: |
  核心机制：社会共享一套有限的核心价值维度（Schwartz的10种基本价值），其中自我超越型价值维度（universalism, benevolence）的权重越高，当市场交换从“可商品化的物品”扩展到该维度所依附的物品或关系（如器官、教育机会、政治影响力）时，触发的社会抵抗强度与该维度的权重正相关。对于自我增强型价值维度（power, achievement, hedonism），权重越高可能正向促进市场化接受（方向相反或为零），不在本命题声称范围内。
  可检验预测：对于自我超越型价值维度，在同一社会内，对“价值权重前30%的域被市场化”的抵抗将系统性强于“后30%的域被市场化”的抵抗。域到价值维度的映射按预注册规则（Schwartz PVQ项目逐项映射，编码规则见附件，一旦锁定不可事后调整）执行。
  限制：本命题不声称价值维度是抵抗的唯一原因（其他因素如制度、历史也可能影响），也不预测所有市场化尝试都会引发同等强度的抵抗，仅聚焦于因自我超越型价值维度权重不同而产生的系统性差异。推论仅在个体层级成立（使用个体价值权重得分预测个体抵抗强度），不适用于社会层级均值比较，除非采用多层模型控制组内方差。跨文化比较仅用于检验文化内部机制的一致性，不直接比较跨文化均值；在未预注册跨文化域→价值映射操作手册前，推论不扩展至跨文化层级。抵抗强度按预注册口径（抗议频率+黑市规模）操作化，详见证伪条件部分。
bridges_to:
  concepts:
    - CONCEPT-value
    - CONCEPT-exchange
    - CONCEPT-morality
applicable_sources:
  - source_name: economic_sociology
    rationale: |
      Zelizer (1979, 1994) 的货币 earmarking 研究显示，人们将特定用途的钱与特定物品绑定，拒绝以市场逻辑交换某些亲密关系；Sandel (2012) 在《金钱不能买什么》中列举了大量市场扩张引发道德抵抗的案例；Fourcade (2011) 通过比较不同国家对“生命定价”的态度，展示了市场化与道德化的互动。这些研究共同支持：当市场入侵高价值维度领域时，会触发强烈社会抵抗。
  - source_name: cross_cultural_psychology
    rationale: |
      Schwartz (1992, 2012) 提出10种基本人类价值并跨文化验证其结构；Inglehart & Welzel (2005) 利用世界价值观调查数据揭示不同社会的价值权重排序在代际变迁中的稳定性。这些证据表明价值维度具有跨文化普遍性但权重不同，为本命题提供了价值维度的可操作化基础。
  - source_name: experimental_economics
    rationale: |
      Henrich et al. (2001, 2005) 的跨文化最后通牒博弈实验显示，不同社会对不公平报价的拒绝率存在显著差异，且与当地合作规范和价值取向相关。该证据直接支撑：不同社会的价值权重差异（如公平、互惠）导致对市场交换规则（如出价）的抵抗强度差异。这为桥接砖的核心合取（价值权重→抵抗强度跨社会差异）提供了独立的行为实验证据，弥补了前两个源各自只支撑半个主张的不足。
falsifiability: |
  本命题的证伪条件仅适用于自我超越型价值维度（universalism, benevolence）。对于自我增强型维度（power, achievement, hedonism），预测方向相反，证伪条件不适用。
  域到价值维度的映射按预注册规则（Schwartz PVQ项目逐项映射，编码规则见附件）执行，一旦锁定不可事后调整。
  以下情形皆可证伪本命题：
  (a) 在同一社会内，对“价值权重前30%的域被市场化”的抵抗强度显著弱于“后30%的域被市场化”的抵抗；
  (b) 在不同社会之间，对同一物品（如教育机会）的市场化抵抗强度与该社会对该物品所属价值维度的权重排序无关（例如，在其他变量控制下无显著正相关）；
  (c) 通过实验或调查，无法识别出价值权重独立于收入不平等、政治制度等因素对抵抗强度的显著预测作用。

  反向失败模式注册：市场化可能重塑价值排序（例如，市场化过程本身可能提升自我增强型价值权重，降低自我超越型权重），从而形成反馈环：市场化→价值权重变化→抵抗变化→进一步市场化。为区分本命题"价值权重→抵抗"的方向性，预注册独立识别策略：采用历史断点分析，利用市场化事件（如某行业开放市场化）发生前的价值测量（如Schwartz PVQ数据）预测之后的抵抗强度，而非使用当下横截面相关。若断点分析显示市场化前价值权重与后续抵抗强度无显著正相关，则本命题被证伪；若仅横截面相关显著而断点预测不显著，则反向失败模式成立，本命题被推翻。

  跨文化语义漂移处理：本命题限定推论范围为"同一文化内部的个体差异"，即使用个体层级的Schwartz PVQ数据（而非社会均值或文化层级均值）来预测该个体对特定市场化的抵抗强度。跨文化比较仅用于检验文化内部机制的一致性，不直接比较跨文化均值。若跨文化应用，则需预注册至少两种文化语境下独立的域→价值映射操作手册（如针对印度文化的具体物品映射规则），并说明漂移检测规则（如语义等价性检验、反向翻译验证）。在未预注册跨文化映射前，推论不扩展至跨文化层级。

  社会层级均值与个体异质性张力处理：鉴于社会层级价值均值可能掩盖个体异质性，本命题明确声明推论仅在个体层级成立，即使用个体价值权重得分预测个体抵抗强度。若使用社会层级均值进行检验，则必须采用多层模型区分组内/组间方差，并报告组内相关性（ICC）。不聚合个体数据到社会层级均值进行跨社会比较，除非多层模型已控制组内方差。

  抵抗强度操作化口径注册：抵抗强度操作化预注册为两种独立测量：(1) 抗议频率（每百万人年度抗议活动次数，来源：全球抗议数据库GDELT或DGE）；(2) 黑市规模（该物品/服务的非法市场交易额占GDP比例，来源：联合国毒品与犯罪问题办公室或国家统计局估计）。两种测量均需在反例出现前预注册具体数据来源和计算方式。若两种测量冲突，以抗议频率为主，黑市规模为辅助。
cross_verification:
  iea: 1.8
  note: |
    IEA = 1.8 (四个独立源，每个独立性系数0.6，经独立性修正后有效独立源数为3，因跨文化心理学内部共享测量基础设施，合并为1个源，故总有效源数=1(经济社会学)+1(跨文化心理学)+1(实验经济学)+1(行为实验价值观测量)=4，但跨文化心理学与实验经济学部分重叠，保守估计有效独立源数=3，IEA=3*0.6=1.8)。
    源独立性说明：
    - economic_sociology (Zelizer, Sandel, Fourcade): 独立源，支撑"市场入侵高价值域→触发抵抗"。
    - cross_cultural_psychology (Schwartz, Inglehart-Welzel): 注意：Schwartz PVQ 与 Inglehart WVS 共享价值测量基础设施（均为问卷测量），因此两者合并视为一个源，不独立计数。该源支撑"不同社会的价值权重排序不同且稳定"。
    - experimental_economics (Henrich et al. 跨文化最后通牒博弈): 独立源，提供行为实验证据，直接支撑完整合取命题。
    - behavioral_measurement_of_values (新增第四源，例如 Fehr & Gächter 的跨文化第三方惩罚实验，或基于信任博弈的利他行为测量): 独立源，基于行为实验而非问卷测量价值取向，避免与跨文化心理学共享测量基础设施。该源也直接支撑完整合取命题。
    总有效独立源数为3，每个独立性系数0.6，IEA=1.8，达到verified门槛。
