applicable_sources:
- source_name: game_theory
  rationale: |
    Brandenburger & Nalebuff (1996) 在《Co-opetition》中正式提出竞合概念，并指出价值创造（合作）与价值分配（竞争）的分离是博弈重合的前提。Axelrod (1984) 的重复囚徒困境模型扩展至竞合域后，显示当合作收益（长期）与背叛收益（短期）的时间折扣差异足够大时，合作策略才能稳定，即时间分离度是必要条件。多市场接触文献（如Jayachandran et al., 1999）证明，企业在多个市场相遇时，竞争强度降低，因为不同市场的合作/竞争可以在空间上分离，间接支持了分离假设。
- source_name: organizational_behavior
  rationale: |
    Bengtsson & Kock (2000) 通过对瑞典制造业的案例研究发现，成功竞合的企业普遍将合作活动（如联合研发）与竞争活动（如销售）分配至不同部门或不同地理市场。Raza-Ullah et al. (2014) 的张力管理模型指出，竞合中的认知分离（员工清楚区分不同角色的行为规则）是缓解紧张的关键。Gnyawali & Park (2011) 对中小企业竞合创新的研究显示，当合作项目的时间窗口独立于竞争性产品上线时，创新产出更高，即时间分离提高了稳定性。
falsifiability: |
  (a) 如果观察到两个竞争对手在同一个项目上同时进行合作与竞争，且根据操作判据判断没有明确的分离机制（即不满足结构判据和时间判据中的任何一项），但竞合关系持续超过两个博弈周期仍保持稳定（稳定性判据：联合项目持续续签、双方均未单方面退出、竞争域未升级为单边行动，三项同时满足），则证伪本命题。
  (b) 如果两个组织在高度重叠的领域（如共享全部技术成果）合作，且短期竞争收益（如市场份额战）立即显现，但合作并未瓦解（即仍维持联合开发协议），则证伪。
  (c) 如果存在制度性防火墙（如独立子公司、仲裁协议），但竞合仍然频繁崩溃（例如合作域违约率高于行业平均），则证伪。
  (d) 如果观察到零分离竞合稳定持续（即不满足(a)的证伪条件），但合作域占总互动利益低于20%，则不构成证伪，因为本预测不适用该情形。
review_summary: |
  r1 needs_revision -> 修复三项 required 缺陷: 1) 将信任/文化等非正式机制纳入分离机制定义，消除逃生门；2) 统一博弈周期术语并给出操作化定义；3) 注册分离机制操作判据（结构/时间两维度，纯认知分离不计入）。
  r2 needs_revision -> 统一博弈周期为联合项目周期，明确非正式机制必须映射到结构/时间判据，限制段落改为连续谱且预测仅适用于零分离。
  r3 needs_revision -> 加利益量级可比限定、统一周期数字为两个、注册稳定操作判据、注册反向失败模式。
