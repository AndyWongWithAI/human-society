applicable_sources:
- source_name: organizational_economics
  rationale: |
    Lazear & Rosen (1981) 的锦标赛理论模型证明了在对称独立能力下，相对奖励强度决定均衡努力水平。Prendergast (1999) 的综述（The Provision of Incentives in Firms）总结了锦标赛激励导致努力分化的大量证据。Bandiera et al. (2011) 的田野实验（Field Experiments with Firms）直接比较了相对锦标赛与固定工资下工人的努力分布，发现锦标赛下低能力工人努力显著下降。
- source_name: game_theory
  rationale: |
    Tullock (1980) 的寻租竞赛模型（Efficient Rent Seeking）展示了在竞争投入下，高能力者投入更多，低能力者投入递减。全支付拍卖（all-pay auction）均衡分析（如 Hillman & Riley, 1989）严格证明了当参与者能力差异足够大时，低能力者在均衡中会选择零努力。
falsifiability: |
  在以下任一可观测情境中，本命题可被证伪：
  (a) 在具有锦标赛式激励的组织中，观察到中等能力参与者的努力水平不低于高能力参与者；
  (b) 在低能力参与者的基线努力水平显著大于零的前提下，加大排名奖励差距后，低能力参与者的努力水平反而上升或维持不变；
  (c) 在实验室环境下，设定能力差异明确的竞赛，但最终努力分布呈均匀或正态分布。
cross_verification:
  method: independence-analysis
  analysis: |
    依据 independence-model (锚定 game_theory)。organizational_economics 与 game_theory
    共享理性选择/均衡分析核心框架，独立系数估算为 0.4（基于 Hess & Ostrom 2003 的
    重叠度量表，相同范式扣 0.6）。IEA = 1.0 + 0.4 = 1.4，超过 weakly_verified 门槛
    1.2，但低于 verified 门槛 1.8。当前两个来源均属于经济学范式，独立性不足。
  recommendation: |
    需引入第三个独立学科来源（如心理学实验的锦标赛激励研究、或生物学信号竞争理论）
    以提高 IEA。当前状态：weakly_verified。

