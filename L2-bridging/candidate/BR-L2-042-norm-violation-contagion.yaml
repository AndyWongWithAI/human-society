applicable_sources:
- source_name: behavioral_economics
  rationale: |
    Keizer et al. (2008, Science) 通过田野实验验证了“破窗效应”：当环境中存在违反社会规范（如乱丢垃圾、违规停放购物车）的迹象时，人们更可能违反其他规范（如偷窃信封）。Cialdini et al. (1990) 通过现场实验证明，个体乱丢垃圾的行为受他人垃圾行为的显著影响，即社会规范信息效应。Gino et al. (2009, Journal of Applied Psychology) 实验室实验表明，观察他人的不道德行为会显著增加自身的不道德行为，机制包括道德责任感的分散和规范感知的弱化。这些研究共同支持了规范违反传染的核心机制——惩罚概率更新和道德成本下降。
- source_name: criminology
  rationale: |
    Wilson & Kelling (1982, Atlantic Monthly) 提出破窗理论：无序和轻微违法若未被处理，会传递出无人管治的信号，从而诱发更严重的犯罪。Sampson & Raudenbush (1999, American Journal of Sociology) 通过系统社会观察和调查数据，发现集体效能（社会凝聚力和非正式社会控制）能降低 disorder 与犯罪的关系，但 disorder 本身也会削弱集体效能，间接支持了传染机制。Weisburd et al. (2011, Journal of Quantitative Criminology) 利用准实验设计（针对犯罪热点的干预），发现严格执法减少 disorder 后，犯罪率下降，反证了未受罚的 disorder 会助长犯罪。这些犯罪学证据从宏观层面为规范违反的传染效应提供了支持。
falsifiability: |
  以下任一条件可证伪本陈述：
  (a) 在随机对照实验中，向一组被试展示他人违反某规范而未受罚的影像，控制组展示中性行为，结果两组被试在后续违反该规范的行为比率无显著差异或实验组反而更低。
  (b) 在现实场景中，系统性地清理环境中的“破窗”（如涂鸦、乱扔垃圾）后，该区域随后发生的严重犯罪率并未下降，甚至上升。
  (c) 存在明确证据表明，个体观察到他人违反规范后，出于道德反作用（如厌恶、惩戒欲望）反而更严格地遵守规范，且这种效应在统计上强于传染效应，且适用于一般性规范（非特殊人群）。
  (d) 规范违反的传染效应在跨文化、跨规范类型检验中，超过50%的检验未能复制出显著正向效应（需事先确定统计显著性和效应量阈值）。

cross_verification:
  iea_score: 0.8
  status: candidate
  source_independence:
    - source_pair: [behavioral_economics, criminology]
      independence_rating: 0.4
      rationale: |
        两个来源共享深层理论基因（behavioral_economics 的 Keizer et al. 直接检验 Wilson & Kelling 的破窗框架，criminology 的 Wilson & Kelling 提出该框架），在核心逻辑上同根程度高，独立性评估下调至 0.4。
  instrument_independence: |
    本评估由单一LLM执行，其训练语料可能包含社会心理学教科书内容，导致跨来源一致性部分反映语料共识而非独立验证。因此仪器有效独立性可能低于学科独立性上限0.6，但本计算按学科独立性上限评估。
  votes:
    behavioral_economics: agree
    criminology: agree
review_summary: |
  第1轮独立对抗审查（2026-07-16）结论：needs_revision。主要问题：(1)缺失cross_verification节，无IEA评分；(2)排除条件的anti-talisman风险，需预先锁定操作化判据并转为主动预测。修复后需重新审查。
    r1 needs_revision -> 添加cross_verification节并修改排除条件为主动预测形式
    r2 needs_revision -> 判据(a)替换为行为坚持率测量，判据(b)注册支付阈值5%月可支配收入及测量情境，判据(c)注册WVS来源及跨语言检验方法
    r3 needs_revision -> 修复判据(b)实验刺激情境口径、添加反向失败模式注册、修正独立性评级至0.4及IEA得分至0.8、添加道德领域弱化声明并预注册复检点、置信度调至candidate
reverse_failure_modes: |
  预注册以下三种反向失败模式，若在实证检验中任一模式在预注册子群体上的量级超过传染效应，则本推论被证伪（净效应趋于零或负）：
  (a) 道德反弹（reactive moralization）效应：目睹他人违规未受罚，反而激活观察者阵营对规范的内化（例如，旁观者更严格地坚持规范以维护群体道德标准）。
  (b) 领域依赖性：在道德领域（如偷窃、逃税）中，传染效应可能弱于甚至反向于非道德领域（如乱丢垃圾、噪音），具体表现为 Maréchal et al. (2020) 道德避税实验中的对称复制失败。
  (c) 反向信号解读：在某些文化或群体中，“未受罚”被解读为“违规者有特权身份”而非“惩罚概率降低”，从而降低而非升高违规概率。

  声明：若上述任一反向效应在预注册子群体上的量级超过传染效应，则净效应趋于零甚至负，这是本推论承认的失败路径。
