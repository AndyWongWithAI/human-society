id: BR-L2-029
status: verified
term: 边际消费倾向的收入梯度 (Income Gradient of Marginal Propensity to Consume)
statement: |
  对【未预期的一次性/暂时性收入变化】,新增一单位收入中被用于当期消费的
  比例(边际消费倾向,MPC)不是所有 agent 共享的常数——它随 agent 的
  收入/财富/流动性状况系统性变化。流动性受限的 agent(低收入、低可变现
  资产、无借贷渠道)MPC 显著更高,富裕且流动性充足的 agent
  MPC 显著更低。

  射程边界(显式登记):本命题的方向性主张只覆盖【未预期/一次性/暂时性】
  收入变化,与 falsifiability(a) 注册的"一次性等额转移"口径对齐。
  已知射程外边界案例——Kueng 2018(QJE,阿拉斯加永久基金分红准实验,
  行政+支付数据):对【事前可预期、周期性、金额大致已知】的支付,
  MPC 梯度可消失甚至反向(高收入/高流动性家庭消费反应反而更强)。
  本命题对可预期/周期性收入变化的消费反应不做方向声称。

  (a) 机制一——选择空间的资源压缩。CONCEPT-choice 说选择发生在资源约束下;
  流动性受限的 agent 存在大量"想消费而消费不了"的被压抑选择——不是没有
  消费目标,而是可支配资源不足以执行。新增一单位收入直接解锁这些排队中的
  选择,故几乎全部流向当期消费。富裕 agent 的当期高价值消费选项已基本被
  满足,新增收入面对的是边际价值递减的剩余选项(CONCEPT-value——价值取决
  于"多想要",已满足者不再想要),故更多转入储蓄/资产而非当期消费。

  (b) 机制二——跨期平滑能力的不对称。富裕 agent 可以动用存量资产或借贷,
  把消费在时间上摊平——收入的暂时波动不必传导到当期消费。流动性受限的
  agent 没有缓冲存量、也借不到钱,收入变化只能近乎一比一地传导为消费变化。
  即:MPC 梯度不需要假设穷人和富人偏好不同——同样的偏好,放进不同的
  约束集,就产生不同的 MPC。

  (c) 与有限理性(BR-L2-001)的分工。完全理性的跨期优化(永久收入假说)
  预测一次性转移的 MPC 对所有人都接近零;实证显示即使高流动性人群 MPC
  也明显非零——这部分"绝对水平偏高"的残差由 BR-L2-001(算不清最优跨期
  方案,用经验法则近似)承载,本命题引用它而不重复它。本命题独立承重的
  只是【梯度】——组间差(低流动性组 MPC 显著高于高流动性组),而组间差
  主要由 (a)(b) 的约束差异驱动,即使所有 agent 同等有限理性,梯度依然存在。

  综合:同等总量的未预期收入变化,其消费效果取决于【落在谁头上】。
  给低收入/低流动性群体的一次性转移,比给全体人口的等额转移,产生更多的
  当期消费;反过来,同等总量的暂时性收入损失落在低流动性群体头上,
  消费收缩也更剧烈。收入-消费联动是分配结构的函数,不只是总量的函数。

人话摘要: "意外多发一块钱,穷人几乎全花掉,富人大多存起来——不是穷人大手大脚,是他们本来就有一堆想买而买不起的东西,钱一到手就去补窟窿;富人想买的早买了,多的钱只能存。所以同样一笔钱,发给谁,决定了它能带动多少消费。注意:这说的是事先没料到的一次性收入;像阿拉斯加每年固定发的分红那种大家早知道、年年都有的钱,规律可能反过来。"

bridges_to:
  concepts:
  - CONCEPT-agent
  - CONCEPT-choice
  - CONCEPT-resource
  - CONCEPT-value
bridges_field: 从 L1"选择受资源约束压缩 + 价值边际递减"到可观测的消费行为异质性——同一单位收入落在不同约束状态的 agent 手里,产生系统性不同的消费量

applicable_sources:
- behavioral_economics:
    rationale: |
      MPC 异质性的自然实验与准实验证据:美国 2001/2008 年税收返还
      (Johnson, Parker & Souleles 2006; Parker et al. 2013)显示低流动性
      家庭对一次性返还的消费反应显著更强;挪威彩票中奖行政数据
      (Fagereng, Holm & Natvik 2021)在准随机收入冲击下复现了流动性-MPC
      负相关;2020 年各国疫情现金发放的实时消费数据同向。
      Kaplan & Violante 的"财富型月光族"(wealthy hand-to-mouth)进一步
      把梯度的解释变量从"收入/财富"校准为"流动性"——有房产但现金紧张的
      家庭 MPC 同样高,直接支持机制 (b) 而非"穷人偏好不同"。
      这是本命题的锚源:干净识别的组间差证据。
- cognitive_science:
    rationale: |
      round-2 独立复核裁定:该票承重引证 CMW 2016 作者自判流动性约束机制、
      明确排除稀缺-认知机制,学科归属(经济学作者/AER期刊/跨期选择激发范式/
      流动性约束机制归因)四项皆属行为经济学,"认知科学独立通道"不成立,属锚源
      学科内复现,weight 由 0.4 降至 0.25。保留 0.25 的理由:CMW 的被试内设计
      +非货币零结果对"约束状态驱动、非人群特质"这一关键区分提供了锚源组间设计
      给不出的补充信息。原 Mullainathan 系稀缺文献降级为机制辅助参照、不承重。
- economic_history:
    rationale: |
      跨时代证据:自 19 世纪 Engel 的家庭预算研究以来,各时代各社会的
      家计调查一致显示低收入家庭消费占收入比例接近或超过 100%
      (靠借贷/典当补差),高收入家庭储蓄率随收入上升;前现代农业社会中,
      歉收冲击近乎一比一地传导为贫困农户的消费收缩(饥荒史),而地主/商人
      阶层靠存粮与资产平滑消费。这表明收入-消费联动的梯度不是现代金融
      体系或福利国家的产物,而是资源约束下的结构性规律,在缺乏现代
      信贷工具的社会中反而更极端(平滑手段更少,梯度更陡)。

falsifiability: |
  本命题的核心主张是组间差:事前流动性/收入/财富更低的 agent 群体,
  对同等收入变化的当期消费反应(MPC)显著更高。

  若以下条件满足,则核心主张被证伪:
  (a) 在干净识别的转移支付实验(随机或准随机的一次性等额转移,按事前
  流动性/可变现资产分组,追踪其后若干月的消费)中,低流动性组与
  高流动性组的 MPC 无显著差异,或方向相反且跨样本稳健复现；
  或者,在将流动性/收入作为连续变量的回归框架中,MPC 对流动性
  指标的回归系数不显著(零附近且置信区间窄)或符号为正(即流动性
  越高 MPC 越高),且跨样本稳健复现。
  (b) 或证明观测到的 MPC 组间差完全由与流动性相关的其他协变量
  (年龄、家庭规模、固有偏好差异等)解释——控制这些变量后,
  流动性/收入状况本身对 MPC 无独立作用。
  (c) 或在缺乏现代信贷的历史/田野社会中,发现贫困群体消费对收入冲击的
  传导系统性【低于】富裕群体(与机制 (b) 的预测方向相反)。

  不声称:
  - 不声称精确的 MPC 数值或梯度斜率(那是各国各期的实证参数,随金融
    制度、时间窗口而变)
  - 不声称可预期/周期性收入变化下的梯度方向——已知反向案例 Kueng 2018
    (阿拉斯加永久基金分红:可预期周期性支付下梯度消失或反向)已在
    statement 射程边界中显式登记为射程外,本命题对其不承重
  - 不声称 MPC 梯度是消费的唯一决定因素(预期、习惯形成、文化消费规范
    等也影响消费,本命题只主张流动性状况是系统性因素之一)
  - 不声称总量刺激无效——只声称同等总量下,分配结构影响消费效果
  - 不声称高 MPC 是"不理性"或"大手大脚"——机制 (a)(b) 表明它是约束
    集压缩下的可理解反应,梯度不需要偏好异质假设
  - 不声称"应该"如何做转移支付(那是 L5 规范性命题,需引入目标/价值
    前提,超出本层)
  - [should→required@L3] MPC 时间窗口与"消费"操作口径(是否含还债)
    未注册,L2 容忍;跨进 L3 时必须升 required(动因:CARES 2020 刺激支票
    还债分流案例,Coibion-Gorodnichenko-Weber 2020)
