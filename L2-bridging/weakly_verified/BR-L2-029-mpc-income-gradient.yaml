  1) r1 needs_revision -> r2 needs_revision -> r3 needs_revision -> r4 verified.
  2) 收窄射程(未预期/一次性/暂时性)+ 干净分工(梯度归本砖、绝对水平归 BR-L2-001)+ 三扇证伪门 + Kueng 边界案例消化 + r3 口径标记,本体结构无 required 缺陷,达标 verified。.
  3) 全档见 ADV-REVIEW-BR-L2-029。
cross_verification:
  votes:
    behavioral_economics:
      status: agree
      weight: 1.0
      evidence: []
      note: |
        锚源。流动性-MPC 梯度是消费研究里复现最多的发现之一——
        美国 2001/2008 退税自然实验(Johnson-Parker-Souleles 2006;
        Parker et al. 2013)、挪威彩票行政数据的准随机收入冲击
        (Fagereng-Holm-Natvik 2021,识别干净)、2020 疫情现金发放
        实时消费数据同向。Kaplan-Violante 的 wealthy hand-to-mouth
        把解释变量校准为流动性而非收入本身——有房产但现金紧的家庭
        MPC 同样高,直接支持机制 (b)"约束差异而非偏好差异"。
        跨国、跨期、跨识别策略稳健,组间差方向一致。证据强度 strong。
    cognitive_science:
      status: agree
      weight: 0.25
      evidence: []
      independence_note: |
        round-2 独立复核裁定降权至 0.25。依据:CMW 2016 作者自判流动
        性约束机制、明确排除稀缺-认知机制,学科归属(经济学作者/AER期刊/
        跨期选择激发范式/流动性约束机制归因)四项皆属行为经济学,"认知科学
        独立通道"不成立,属锚源学科内复现,0.4 不可守。按 author_response
        预注册回退承诺执行降权,不争辩。保留 0.25 而非归零的理由:CMW 的
        被试内设计+非货币零结果对"约束状态驱动、非人群特质"这一关键区分
        提供了锚源组间设计给不出的补充信息,值得有限计权。
    economic_history:
      status: agree
      weight: 0.5
      evidence: []
      independence_note: |
        投 agree 但带一处方法论警示。恩格尔式家计调查展示的是
        【平均】消费倾向随收入下降的截面梯度——按 Friedman 永久收入
        批判,截面 APC 梯度部分是暂时性收入的统计伪影,不能干净识别
        【边际】倾向,这部分证据对本砖承重打折。真正承重的是冲击
        传导证据——歉收冲击近乎一比一传导为贫困农户消费收缩,
        地主/商人阶层靠存粮与资产平滑(与 Sen 的权利分析一致);
        且前现代社会平滑工具越少梯度越陡,与机制 (b) 的预测同向。
        史料/档案方法路径独立于自然实验;成对系数缺失,参照
        BR-L2-024 同对先例取 0.5(消费理论语料部分共享,低于 default)。
  iea: 1.75
  verdict: weakly_verified
  verdict_note: |
    IEA = 1.0(behavioral_economics 锚) + 0.25(cognitive_science round-2 降权)
    + 0.5(economic_history 折算) = 1.75,低于 verified 线 1.8、稳超 1.2 下限,
    定格 weakly_verified。三源方向一致,无 disagree/mixed 票。
    命题只承重【梯度】(组间差),绝对水平残差已明确划给 BR-L2-001,
    分工干净,未见来源冲突。
    仪器折扣披露(强制,per independence-model instrument_correlation
    discount_rule)——本次三路投票由单一 LLM 在同一上下文执行,并非
    独立人类专家或独立文献检索通道;报告的 IEA 是【学科独立性】上限,
    【仪器有效独立性】低于此值。缓解因素——本命题属多重复现的
    稳固共识命题(退税/彩票/疫情发放多识别策略收敛,教科书级),
    真实文献收敛部分缓解单仪器忧虑,非新颖争议命题的承重红旗场景。
    cognitive_science 降权依据(round-2 独立复核):CMW 2016 作者自判
    流动性约束机制、明确排除稀缺-认知机制,四项学科归属皆属行为经济学,
    "认知科学独立通道"不成立,属锚源学科内复现;保留 0.25 因被试内设计
    +非货币零结果补充了锚源组间设计给不出的"约束状态驱动"信息。
    economic_history 0.5 维持(round-2 确认校准误差内,不构成 required)。
    weakly_verified 是该砖诚实的稳态,经验内核(未预期一次性收入下
    流动性-MPC 负梯度)在收窄后射程内高复现、方向稳健。

