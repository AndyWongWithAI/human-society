id: BR-L2-031
status: weakly_verified
term: 制度信任的不对称衰减 (Asymmetric Decay of Institutional Trust)

人话摘要: "对制度的信任有个扎心的规律——掉得快、涨得慢。一次失信(养老金发不出了、认证标签造假了)能在几周内把信任打到谷底，但把信任建回失信前的水平，往往要以年甚至十年计。这不是人不理性——是'损失厌恶'在信任上的投影:已经有的信任是参照点，失信是从参照点往下掉(损失)，守信只是待在原地(维持现状)；而人对'失去'的心理反应天然比'得到'强烈。制度信任是易碎品——建起来要几十年，砸掉只要一件事。"

statement: |
  制度信任（对非人格化制度/机构的信任，区别于人际信任）的衰减-建立呈系统性的时间不对称：
  制度信任被摧毁所需的时间（从失信事件触发到信任触底）远短于建立/恢复所需的时间
  （从触底回到失信前水平）——下降快、回升慢。

  (a) 损失厌恶机制——已建立的制度信任构成心理参照点，失信被编码为从参照点的损失
  （激活前脑岛/杏仁核等规避相关神经回路），守信被编码为维持现状（激活纹状体奖励回路
  但幅度更弱）。Kahneman-Tversky 损失厌恶（损失的心理权重约为等量收益的 2-2.5 倍）
  在信任域的特化投影，使失信触发快速、大幅的信任下调，而守信只被编码为维持参照点、
  不触发对称的快速上调——信任重建因此只能依靠正面证据的漫长积累，摧毁快、重建慢。

  (b) 信息不对称放大——制度失信是离散、高显著性的信号事件（"养老金发不出来了"
  "认证标签造假了"），极易传播且难以撤回；制度守信是连续、低显著性的背景状态
  （"今天养老金又正常发了"），不构成新闻。信息环境天然放大负面信号、压缩正面信号，
  进一步拉大衰减-建立的不对称（AXIOM-002：信息熵增使纠正性正面信号传播慢于
  初始负面冲击）。

  (c) 与 BR-L2-024（法币信用连续可逆性）的接口——BR-L2-024 说法币信用不是开关
  而是连续可逆的；本砖补充：虽是连续可逆，但上升-下降两条曲线的斜率不对称——
  下降陡、上升缓。这不矛盾于连续性，而是在连续函数上叠加了不对称的一阶导数。

core_mechanism: |
  两条因果链叠合驱动制度信任衰减-建立的时间不对称：
  (1) 损失厌恶的估值函数形状——已建立的信任是参照点，失信=损失、守信=维持现状，
  而损失的心理权重系统性高于等量收益，使失信触发快速大幅的信任下调，
  守信只维持参照点、不触发对称的快速上调——摧毁所需时间远短于重建所需时间。
  (2) 信息环境的天然不对称——负面事件的高显著性与正面事件的低显著性，
  使失信信号比守信信号传播更远、消退更慢，进一步放大净衰减速度。
  两条链各自独立可测：链(1)可由神经科学/fMRI 独立验证（控制信息显著性后仍存在
  神经反应不对称），链(2)可由信息传播追踪独立验证（负面 vs 正面制度新闻的
  传播速度/持续时间差异）。

bridges_to:
  concepts:
