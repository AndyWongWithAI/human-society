bridges_field: 从 L1"关系是需维护的信息资产（THEOREM-relation-information-asset）+ 信息熵增使负面信号消退慢于正面信号（AXIOM-002）"到可观测的制度信任衰减-建立时间不对称——制度信任的"易碎性"是损失厌恶（估值函数形状）与信息不对称（传播动力学）共同作用的经验规律

applicable_sources:
- behavioral_economics:
    rationale: |
      锚源。损失厌恶在信任域的扩展构成最直接的理论与证据链。
      Kahneman-Tversky(1979)损失厌恶——损失的心理权重约为等量收益的
      2-2.5 倍——为不对称性提供了基础参数估计。
      信任违背的神经科学研究用 fMRI 证明：背叛（失信）激活前脑岛
      (anterior insula)和杏仁核(amygdala)——与疼痛/厌恶/规避相关的脑区——
      反应强度大于等量合作激活纹状体(striatum，与奖励相关的脑区)的幅度
      (Rilling et al. 2002, Neuron; King-Casas et al. 2005, Science;
      Baumgartner et al. 2008, Neuron)。
      心理契约违背文献(Rousseau 1989, 1995; Morrison & Robinson 1997)证明
      员工-组织关系中一次心理契约违背的伤害需多次正面经历才能修复——
      提供了不对称性的直接行为证据。
      【推广链诚实声明】需显式标注：本锚源的核心实验证据（fMRI 信任博弈、
      行为实验信任违背——King-Casas 2005、Baumgartner 2008 等）测量的均是
      【人际信任】违背/修复的不对称（两个具体个人之间的信任互动），而非本砖
      声称的【制度信任】（对非人格化制度/机构的信任）。"人际信任不对称→
      制度信任不对称"这一推广链条本身缺乏直接实验证据——将制度拟人化
      （把银行/监管机构当作"对方"来信任）有一定合理性，但不是已证事实；
      制度信任涉及对抽象规则系统的信念，其认知/神经机制是否与人际信任同构
      是开放的经验问题。锚源为"信任不对称"提供的是坚实的机制模板，
      "该模板适用于制度信任"是一个额外的、未被锚源直证的经验假设。
      制度信任的直接证据由经济史通道（Gallup/Edelman 调查时间序列、
      阿根廷自然实验）承载，但该通道权重仅 0.6。
      证据强度 strong，作锚点 weight 1.0（按审查裁决不调 IEA 数字——
      跨层推广属证据权重问题而非独立性系数问题，此处以诚实标注化解）。
- economic_history:
    rationale: |
      金融危机后制度信任恢复周期的历史证据构成独立的数据通道——
      不依赖实验室/神经科学范式，靠大规模社会调查时间序列和历史档案。
      2008 年金融危机后，美国金融监管机构信任度恢复用了约 10 年：
      Pew Research Center 和 Edelman Trust Barometer 时间序列显示，
      美国公众对银行/金融机构的信任从 2008 年低谷(Gallup:银行信任度
      从 2007 年 53% 降至 2012 年 21%)到恢复至危机前水平约至 2018 年前后。
      阿根廷比索-美元信任历史提供了多次违约-重建-再违约的"自然实验"：
      2001 年违约后比索制度信任崩盘，即使后续多年财政纪律也难以重建；
      且每次新违约使信任回落至比前次更低的谷底（滞后效应/疤痕效应）。
      中国古代"朝令夕改"的治理教训——"商鞅徙木立信"的反面：
      法令频繁变更使百姓对制度本身丧失信任，且恢复远慢于破坏
      （《史记·商君列传》《资治通鉴》相关记载）。
      方法（大规模调查时间序列/历史档案/比较案例研究）独立于锚源的
      实验室/神经科学范式，default_independence 0.6。
- organizational_psychology:
    rationale: |
      组织行为学中"心理契约违背"(psychological contract breach)
      和"信任修复"(trust repair)的实证文献构成第三条独立通道——
      在真实组织情境中研究信任不对称，而非实验室抽象博弈或宏观历史序列。
      Rousseau(1989, 1995)心理契约理论：员工-组织关系中，
      一次心理契约违背（组织未履行隐含承诺）对信任的损害，
      需要多次补偿性正面经历才能修复。
      Dirks, Kim 等的信任修复实证(Kim et al. 2004, JAP; 2006, JAP;
      Dirks et al. 2009, Academy of Management Annals)证明：
      信任违背后的修复效果取决于归因（能力 vs 诚信）——
      诚信型违背（与制度失信同构：不是"做不到"而是"说话不算话"）
      修复难度远大于能力型违背，且道歉/承诺的修复效果在诚信型违背中
      显著更弱。Kim et al.(2004, 2006)进一步发现：对诚信型违背，
      否认反而比道歉更有效（道歉承认了"说话不算话"这一制度信任的
      核心维度），佐证了不对称性的顽固。
      方法（组织实地研究/真实雇佣关系数据）与锚源共享部分实验范式
      （信任博弈变体用于组织情境），但研究问题不同（组织修补 vs 基础机制）、
      数据来源不同（真实员工 vs 实验室被试）。保守折扣至 0.5。

falsifiability: |
  本命题的核心主张是：制度信任的衰减-建立存在系统性的时间不对称，
  摧毁（衰减至谷底）所需时间远短于建立/恢复所需时间，且此不对称由
  损失厌恶（估值函数形状）和信息不对称（传播动力学）两条独立机制共同驱动。

  可证伪的校准口径：

  (a)【时间不对称比】在制度失信事件后，制度信任恢复至失信前水平
  所需的时间 / 失信事件使信任下降所经历的时间 ≥ 2:1。
  分子：从失信事件发生至信任指标恢复至失信前水平的中位时间（年）。
  分母：失信事件从触发至信任指标触底的中位时间（年）。
  测量口径：使用 Edelman Trust Barometer / Pew / Gallup 等机构信任
  时间序列；失信事件定义为单次可辨识的制度丑闻/违约/监管失败，
  排除复合事件（判据见下方 compound_event_criteria，已预注册）。
  若在大样本（≥20 个独立制度失信事件，跨 ≥5 个国家/制度领域）中，
  恢复/衰减时间比中位数 < 1.5:1，则本命题的时间不对称主张被削弱；
  若 < 1:1（恢复不慢于衰减），则核心主张被证伪。

  compound_event_criteria【复合事件分类判据——预注册，注册日期 2026-07-15，
  在见任何制度失信数据前锁定，对所有事件一致适用，不允许看信任曲线后再分类；
  事后重新分类一律按不利于本命题的方向裁决（L4-009 判例精神）】：
  满足以下任一条即判为"复合事件"、从 (a) 样本中排除：
  (i)【独立事件数】≥2 个独立失信事件（各自可单独辨识、有独立触发日期）
  发生于同一制度对象；
  (ii)【时间窗口】上述独立事件间隔 ≤12 个月，且信任指标在该窗口内持续下降
  （未在两事件之间恢复至前一事件前水平）；
  (iii)【因果关联】事件 B 可由事件 A 直接引发（如银行违约→信用评级下调→
  债券抛售），因果链条内各事件视为同一复合事件的组成部分——判定依据为
  公开的事后调查报告/监管认定中记载的触发关系，或两事件由同一根因触发。
  单一事件（一个独立触发、一条下降-触底-恢复曲线）保留入样。
  附加声明：若按上述判据排除复合事件后样本量 <20，则时间比主张的样本要求
  未满足，命题在该维度上为"暂未达标"而非"被证实"。

  (b)【神经不对称不可归零】若证明制度失信在神经层面的反应强度
  （前脑岛/杏仁核激活）与制度守信在奖励回路的反应强度之差，
  在控制信息显著性（使"守信"与"失信"同样显著/意外）后归零——
  即不对称完全由信息显著性差异驱动、无估值函数形状的独立贡献——
  则本命题的"损失厌恶独立机制"主张被证伪。
  操作化：设计实验使"制度守信"同样成为显著、意外的正面事件
  （如被试被告知"你的养老金可能被削减"但随后意外足额发放），
  比较其神经反应与等量负面事件（如被试被告知"养老金正常"
  但随后意外削减）的神经反应之差。若正向意外与负向意外的
  神经反应幅度对称（无统计显著差异），则机制主张被削弱。

  (c)【制度信任的独立不对称】本砖锚源证据测量的是人际信任不对称
  （见 applicable_sources.behavioral_economics 的推广链诚实声明）。
  若未来实证研究发现：制度信任（对非人格化制度/机构的信任，
  区别于人际信任）的衰减-建立【无】显著时间不对称——即在直接测量
  制度信任的受控实验或大样本时间序列中，摧毁与重建速度无统计显著差异——
  则"人际信任不对称→制度信任不对称"的推广链断裂，本命题被削弱
  （即使人际信任不对称本身依然成立）。

  不声称：
  - 不声称所有制度信任都有相同的不对称系数（社保信任 vs 货币信任
    的不对称幅度可能因制度设计/历史/文化而不同）
  - 不声称不对称是"硬连线"的、不可缓解的——制度设计（如独立监督、
    透明度、快速纠错机制）可通过降低失信概率和加速信息修正
    来部分缓解不对称的后果
  - 不声称所有制度失信都不可修复——修复是可能的，只是需要
    不成比例的时间和正面证据积累

relation_to_system:
  extends:
  - BR-L2-010
  supplements:
  - DED-006
  note: |
    本砖是 DED-006（信任天花板-制度外化推论）的机制补充。
    DED-006 讲了"制度能替代人际信任支撑陌生人交换"以及
    "交换网络突破信任半径→制度外化"，但没有讲制度信任本身
    的动力学——制度信任一旦建立，其衰减与建立的节奏是不对称的。
    本砖补充了这一机制缺口：制度信任不仅是"能不能替代"的问题，
    还是"替代之后容不容易碎"的问题。

    与 BR-L2-010 的关系：BR-L2-010 说制度【能】替代人际信任
    （capability），本砖说替代之后建立的制度信任【易碎】
    （fragility）。两条互补构成制度信任的完整经验画像：
    有替代方案，但替代方案本身有脆性。
    【2026-07-16 CNBS 工具实证补充】IMF 数据——中国政府债务/GDP
    从 2020 年 70.1% 飙升至 2025 年 99.2%（五年涨 29 个百分点）。
    债务/GDP 逼近 100% 是制度信用的阈值事件——这为 BR-L2-031 的
    "制度信任不对称衰减"机制提供了一个正在进行的压力测试场景：
    若后续出现财政整固/债务重组事件（失信信号），信任反应轨迹
    将直接检验"摧毁快、重建慢"的预测。反之，若无失信事件而
    债务/GDP 自然回落（正面制度绩效），则可观察信任修复的节律。
    诚实标注：此为实时观察锚而非已完成的经验证据——债务轨迹是
    前件（制度压力的积累阶段），失信/修复尚未触发，当前仅承重
    "制度信任压力测试场景存在"这一事实。


review_summary: |
  r1 (2026-07-15): needs_revision——3 条 required:(1)声明测幅度/证伪测时间的操作化错位;
  (2)"复合事件"排除判据未预注册;(3)锚源人际信任证据→制度信任的推广链缺直证。全档见 ADV-REVIEW-BR-L2-031。
  revision (2026-07-15): 按 r1 三条 required 定向整改——R1 采纳方案A,statement/core_mechanism/
  人话摘要收窄为时间不对称(摧毁时间<<重建时间),删除"一次失信幅度>多次守信幅度"措辞,
  falsifiability (a) 时间比测试(≥2:1)直接承重;R2 预注册 compound_event_criteria
  (≥2 独立事件/≤12 月窗口/因果链条判据,注册日期 2026-07-15,附样本不足"暂未达标"声明);
  R3 在锚源 rationale 显式标注人际→制度推广链 plausible but untested(不调 IEA 数字),
  并追加 falsifiability (c):制度信任被直测无不对称则命题被削弱。status 保持 candidate,待复验。
  r2 (2026-07-15): weakly_verified——IEA 范畴错层。r1 三条修复已落地、命题骨架稳固、
  反例无净杀，但 IEA=2.0 测量的是「信任不对称」一般命题（人际信任为主体证据），
  而本命题声称「制度信任」特殊命题，制度信任直证仅约 0.6-1.0
  （economic_history 0.6 + org_psych ≤0.4），远低于 verified 门槛 1.8。
  这不是 IEA 计算错——是测量目标与命题声称的范畴错层。翻牌为 weakly_verified：
  命题在制度信任维度上是理论驱动假说而非多源确证命题，人际信任不对称机制
  plausibly 可推广但推广链缺直证。保留升级路径：未来积累制度信任独立直证可补票重审。
  全档见 ADV-REVIEW-BR-L2-031 round_2。

cross_verification:
  reviewed_by: IEA-investigator (独立上下文, 2026-07-15 复算 r2——逐源重验后确认前次数字)
  votes:
    behavioral_economics:
      status: agree
      weight: 1.0
      evidence: []
      note: |
        锚源，agree。独立复核后把锚源证据【收窄】为损失厌恶 + 神经不对称
        两条——Kahneman-Tversky(1979)损失厌恶(损失心理权重约 2-2.5 倍)、
        Slovic(1993, Risk Analysis)信任"不对称原则"(trust asymmetry
        principle，负面事件对信任的破坏力系统性大于正面事件的建设力，
        是对本砖核心主张最直接的经典文献)、信任博弈 fMRI 证据
        (King-Casas et al. 2005, Science; Baumgartner et al. 2008,
        Neuron——背叛后信任行为调整与前脑岛/杏仁核相关激活)。
        两处修正:(i) Rilling et al. 2002(Neuron)主要证明【合作激活
        纹状体奖励回路】，背叛-规避不对称的直接证据应引 Rilling 2004/
        2008 与 King-Casas 2005，原引稍有错位但不伤实质;
        (ii) 原锚源理由里引用的 Rousseau/Morrison & Robinson 心理契约
        文献属组织心理学通道的核心语料，为避免重复计权，在 IEA 计权层面
        【不计入锚源】、只归组织心理学通道一次(applicable_sources 原文
        仍保留该引用，此处为计权口径而非改写来源声明)。
        收窄后锚源证据链仍 strong，weight 1.0。
        r2 复核补充:Slovic(1993)"trust asymmetry principle"经查证属实
        (Risk Analysis 13(6)，信任建立慢/摧毁快的经典表述)，
        King-Casas 2005/Baumgartner 2008 引注核实无误。
    economic_history:
      status: agree
      weight: 0.6
      evidence: []
      independence_note: |
        agree，weight 0.6。independence-model 无
        behavioral_economics__economic_history 成对系数，
        按 default_independence 0.6 折算。
        证据方向复核成立:美国银行业信任 Gallup 序列确实呈"陡降缓升"
        (低谷 2012 年约 21%，恢复用了约十年量级);阿根廷 2001 年违约后
        储蓄美元化长期不退、每次新违约谷底更深(疤痕效应)有档案支撑;
        商鞅"徙木立信"反面(朝令夕改毁信快、立信慢)方向一致但属轶事级。
        一处数据修正:Gallup 银行信任 2007 年约为 41%(53% 是 2004 年
        水平)，原文数字有偏但"深谷+慢恢复"的形状结论不受影响。
        r2 复核补充:至 2018-2019 年 Gallup 银行信任(约 30%)仍未完全
        回到 2007 年 41% 水平——"恢复以十年计"若有偏差是偏保守，
        实际恢复更慢，方向上反而强化本砖主张。
        方法论(调查时间序列/历史档案/比较案例)与锚源(实验室/神经科学)
        真独立，共享的是主题而非方法或语料，0.6 维持。
    organizational_psychology:
      status: agree
      weight: 0.4
      evidence: []
      independence_note: |
        agree，但独立复核后把权重从作者自估 0.5 【下调至 0.4】。
        证据本身成立:Kim et al.(2004, 2006, JAP)证明诚信型违背比能力型
        违背难修复、道歉对诚信型违背效果弱(否认反而更有效);
        Rousseau(1989, 1995)心理契约违背文献证明一次违背需多次正面
        经历补偿。一处引注修正:Dirks, Lewicki & Zaheer 2009 发表于
        Academy of Management Review(非 Annals)，不伤实质。
        下调理由(双重折扣):(i) 与锚源共享行为实验范式(信任博弈变体)，
        这是作者已计入的 0.5;(ii) 复核发现原锚源理由【直接引用了
        Rousseau/Morrison & Robinson 心理契约文献】——两通道存在实打实
        的语料重叠而非仅范式重叠，按"避免高度共享语料的来源重复计权"
        原则再加一档折扣至 0.4(该语料在 IEA 计权层面只归本通道一次)。
  iea: 2.0
  verdict: weakly_verified
  verdict_note: |
    r2 最终裁决（2026-07-15）：weakly_verified——IEA 范畴错层。

    IEA=2.0（1.0+0.6+0.4）的形式计算合规，但其测量的是「信任不对称」
    一般命题（以人际信任为主体证据），而非本命题声称的「制度信任不对称」
    特殊命题。逐票审视对制度信任的直证贡献：

    - behavioral_economics（锚源，weight 1.0）：fMRI/信任博弈全部测量
      【人际信任】违背与修复的不对称，对制度信任仅提供机制类比
      （「若制度信任的心理编码与人际信任同构，则不对称应成立」），
      直证贡献 0。

    - economic_history（weight 0.6）：唯一直接测量【制度信任】的通道——
      Gallup/Edelman 银行-政府信任时间序列、阿根廷货币制度信任自然实验。
      方法论（大规模调查/历史档案）独立于锚源的实验室/神经科学范式。
      直证贡献 0.6。

    - organizational_psychology（weight 0.4）：测量员工-组织信任
      （雇佣关系中的心理契约违背/修复），组织是「人+规则」的综合体，
      不完全等同于非人格化制度。属人际与制度的混合地带。
      直证贡献 ≤0.4（乐观估值，实际取决于组织中制度成分的占比）。

    制度信任直证 IEA 汇总：
    - 乐观估值（org_psych 全额计为制度信任）：0.6 + 0.4 = 1.0
    - 保守估值（org_psych 折半）：0.6 + 0.2 = 0.8
    - 严格估值（仅 purely institutional）：0.6
    三种估值均远低于 verified 门槛 1.8，乐观估值 1.0 甚至低于最低门槛 1.2。

    这不是 IEA 计算错——按 independence-model 规则计算合规——是测量目标
    与命题声称之间的范畴错层。IEA=2.0 正确地测量了「信任不对称」一般命题
    的强证据支撑（三十余年跨方法复现的稳固共识），但本命题的 term 和 statement
    明确声称的是「制度信任」特殊命题，其独立直证当量仅 0.6-1.0。

    这不等于命题「错」——人际信任不对称的损失厌恶机制 plausibly 可推广至
    制度信任域（损失厌恶是领域通用的估值函数形状，制度失信与制度守信的信息
    显著性不对称同样适用于制度域），且经济史通道提供了方向性支持
    （Gallup 陡降缓升、阿根廷疤痕效应），反例猎捕未发现时间比 <1:1 的净杀案例。
    命题骨架稳固、机制清晰。但「方向性支持」与「多源确证」之间的差距，
    恰是 weakly_verified 与 verified 之间的差距。本命题在制度信任维度上
    是理论驱动假说（strongly motivated hypothesis）而非多源确证命题
    （multi-source confirmed proposition）。

    仪器折扣披露（照 independence-model discount_rule）：本次三路投票由
    单一 LLM 执行（非独立人类专家/独立文献通道），报告的 IEA=2.0 是
    【学科独立性上限】，【仪器有效独立性低于此】。缓解（有限但真实）：
    损失厌恶×信任不对称属多重复现的稳固共识命题（Slovic 1993 起三十余年
    跨方法收敛），真实文献收敛部分缓解单仪器忧虑。

    升级路径：若未来积累制度信任的独立直证——如跨国机构信任面板数据
    （World Values Survey / European Social Survey 机构信任在丑闻/改革
    前后的准自然实验）、制度失信后恢复的独立自然实验（货币制度违约后的
    储蓄行为数据、监管失败后的市场反应时间序列）、fMRI 对制度失信
    （如养老金削减通知、监管认证造假曝光）神经反应的直接测量——达到
    IEA ≥1.8 的直证当量，可补票重审升级为 verified。falsifiability (c)
    已为此升级路径提供了可操作的经验判据。

