      - "Brynjolfsson/Smith (2000): 图书/CD市场线上vs线下搜寻成本首次大规模实证比较"
      - "Goldfarb/Tucker (2019): 60年综述,搜寻成本下降3-5个数量级是稳健的多市场复现发现"
      note: |
        锚源。信息经济学对搜寻成本的测量是支撑本命题(a)维度的最直接证据链。
        Stigler(1961)将搜寻成本形式化为市场效率核心变量——搜寻摩擦越小,价格
        越收敛于竞争均衡。Bakos(1997)实测互联网对价格离散的冲击,发现线上市场
        价格离散度显著低于线下。Brynjolfsson/Smith(2000)提供线上vs线下搜寻成本
        的首次大规模实证比较(图书/CD市场)。Goldfarb/Tucker(2019)综述确认搜寻
        成本下降3-5个数量级是稳健的、被多市场反复复现的经验发现。证据链从理论
        框架到经验测量贯通60年,多研究者多市场独立复现。证据强度strong。
        覆盖范围:仅覆盖搜寻维(a),不涉及匹配/监控维——该两维由platform_economics补充。
