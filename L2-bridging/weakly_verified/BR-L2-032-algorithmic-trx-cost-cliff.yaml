bridges_field: 从 L1"信息衰减/维护成本"到算法对交易成本的可观测数量级冲击——算法不仅是降低了成本,而且降低幅度之大构成了成本函数上的经验不连续点

applicable_sources:
- information_economics:
    rationale: |
      Stigler(1961,"The Economics of Information")首次将"搜寻成本"形式化——价格分散
      创造了搜寻的回报,最优搜寻在边际成本=边际收益处停止。Stigler 的框架确立了
      搜寻成本作为市场效率的核心变量——搜寻摩擦越小,价格越收敛于竞争均衡。
      后续 Bakos(1997)直接测量了互联网对搜寻成本的冲击,发现线上市场相比线下
      价格离散度显著降低。Brynjolfsson/Smith(2000)提供了图书/CD 市场线上vs线下
      搜寻成本的首次大规模实证比较。Goldfarb/Tucker(2019)综述了数字经济学对
      搜寻成本近 60 年的经验积累,确认搜寻成本下降的数量级(3-5 个数量级而非
      连续递减)是稳健的经验发现。信息经济学提供的是对"搜寻成本下降了多大量级"
      的测量,不涉及匹配/监控维度(由另两源补充)。
- platform_economics:
    rationale: |
      Rochet/Tirole(2003,"Platform Competition in Two-Sided Markets")建立了双边市场
      的形式理论——平台通过降低两侧用户的匹配摩擦来实现价值。Armstrong(2006)
      的竞争瓶颈模型揭示了平台如何通过交叉补贴(对一方免费/补贴以吸引另一方)
      来内化匹配外部性。Einav/Farronato/Levin(2016)对 eBay 的经验研究展示了声誉
      系统(评分机制)如何将欺诈率压低至传统分类广告无法达到的水平——声誉系统
      的监控成本断崖可直接测量为"争议率从~10%(分类广告)→<1%(eBay)"。
      Cramer/Krueger(2016)对比 Uber 与传统出租车,发现平台匹配使空驶率从~50%
      降至~30%,利用率的提升是匹配精度断崖的直接证据。
      平台经济学的独特贡献:测量了匹配/监控两维的断崖幅度——信息经济学仅覆盖
      搜寻维。与信息经济学的独立系数:不同方法(结构估计+自然实验 vs 理论
      建模+价格离散测量),不同时间(2000s/2010s vs 1960s/1990s),default_independence=0.6。
- transaction_cost_economics:
    rationale: |
      Coase(1937)开创性地提出"使用市场价格机制是有成本的"——搜寻交易对象、
      谈判合同条款、监督合同执行——这些成本决定企业的边界。Williamson(1985)
      将交易成本系统化为资产专用性×不确定性×交易频率的分析框架,并特别关注
      "度量成本"(measurement cost)作为交易成本的关键子类。Alchian/Demsetz(1972)
      论证监督/度量成本是团队生产中的核心组织问题——谁能有效降低监督成本,
      谁就能扩大有效组织规模。
      交易成本经济学的独特贡献:提供了"交易成本下降→市场边界扩张→企业边界
      收缩"的因果框架,为下游推论(如 DED-035 的企业边界分叉)提供理论锚定。
      与信息经济学/平台经济学的独立系数:不同知识传统(制度经济学 vs 芝加哥
      价格理论 vs 产业组织),不同核心变量(治理结构 vs 价格离散/搜寻 vs 匹配
      外部性/交叉补贴),default_independence 各取 0.6。

falsifiability: |
  本命题的核心主张是:算法对交易成本的降低是【断崖式下降】而非【连续递减】
  ——各维度均构成成本函数上的不连续点,断崖幅度因度量口径而异。
  具体幅度:搜寻维时间成本降~4-5数量级,匹配维利用率改善~1.4x(规模跨度
  ~10000x),监控维欺诈率降~10x。若以下条件成立,则核心主张被推翻:

  (a) 展示任一前数字制度安排(黄页/分类广告/行会口碑/商业信用报告/人际
  推荐网络/猎头/中介)在【可比的规模】上实现了算法搜索/匹配/监控的相近
  效率——即证明算法只是"更快"而非"跨过了不可能的阈值"。

  (b) 统计检验:取跨期成本数据(如搜索时间成本/欺诈率/利用率的长时间序列,
  跨越前数字→数字过渡期),拟合两竞争模型:(i)连续模型——成本=平滑函数
  (如指数衰减或对数线性)的单一曲线;(ii)断点模型——成本在数字技术引入
  时点存在结构性断点(structural break),断点前后属于不同成本体制。
  若连续模型的拟合优度(AIC/BIC)显著优于断点模型,或Chow检验无法在数字
  技术引入时点拒绝"无结构性断点"的原假设,断崖主张被削弱。若所有三个
  维度均无显著断点,核心主张被证伪。

  操作化:取一个跨过"不可能阈值"的判据——如"在 100 万候选池中于 1 秒内
  完成穷举匹配(定义为 top-10 精确率≥0.9)"。若证明前数字制度安排能在任何
  实际可部署的条件下实现此目标,断崖主张被证伪。

  本命题不声称:
  - 所有交易成本都降低了(信任建立/默会知识传递仍高昂——由 BR-L2-009 覆盖)
  - 成本断崖导致"更好的社会"(规范判断,非经验命题)
  - 断崖只发生在数字时代(前数字也有断崖,如印刷对信息复制成本的断崖——
  但各自在不同维度上,见 economic_history 的独立性讨论)

  此外,注册反向失败模式:若发现在算法部署后,某些子市场的边界反而收缩
  (如算法搜索导致赢家通吃、长尾市场萎缩),则断崖主张的普适性被削弱——
  此为可选证伪条件,不作为核心证伪条件。
