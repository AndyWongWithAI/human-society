    (价格数据库/平台运营数据/欺诈率)来自不同研究者独立采集的不同数据通道,
    不存在共享底层测量链的同源多次发布问题。WB/IMF/CNBS的GDP同根模式限用于
    宏观经济指标口径,不适用于此类微观交易成本测量。

    本阶段不翻牌status(仍candidate),verdict由后续Finalize阶段按审查裁决定夺。
  instrument_disclosure: |
    按 independence-model.yaml instrument_correlation.discount_rule 披露:
    本次三路投票由单一LLM(同一仪器+其重叠语料)执行,报告的IEA=1.6是
    "学科独立性"上限,"仪器有效独立性"低于此。

    按honest_note:META-REVIEW-001发现仪器折扣此前未传播进IEA数字,
    此处显式披露。本命题为新颖综合命题(算法交易成本断崖作为独立经验命题
    并非教科书共识),按mitigation条款,此折扣应视为承重红旗。

    真正恢复独立性需异血统模型面板(scripts/blind_coder.py)或人类专家
    的独立文献通道。

