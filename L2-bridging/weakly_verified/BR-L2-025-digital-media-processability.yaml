id: BR-L2-025
status: weakly_verified
term: 数字媒介可处理性 (Digital Media Processability)
statement: |
  数字编码的信息具有一种前数字媒介不具备的属性:可处理性(processability)。
  这是 Innis 时间偏向/空间偏向之外的第三维——信息不仅可以被存储和传输,
  还可以被机器读取、搜索、变换和重组,且边际成本趋近于零。

  (a) 近零衰减复制——数字信息可通过纠错编码实现近完美保真复制,
  边际复制成本趋零。AXIOM-002 的衰减作用在数字域中从"信息内容衰减"
  移位为"物理基底衰减"(介质老化/格式废弃),而信息内容本身可通过
  纠错码和冗余备份维持——只要投入能量维护基底和迁移格式。

  (b) 机器可处理——数字信息可被非人类 agent(计算机)直接读取和执行操作:
  搜索(全文检索/语义检索)、变换(排序/过滤/聚合/翻译)、
  重组(将不同来源的信息按规则合成新信息)、推理(基于编码知识的逻辑推导)。
  这些操作在前数字媒介中需要人类大脑作为中介——机器可处理性消除了这个中介。

  (c) 存储/传输收敛——同一数字编码同时服务于存储和传输(比特就是比特),
  前数字媒介的存储介质(泥板/纸张)与传输介质(声音/信使/电信号)是分离的。
  这一收敛使信息的"静止状态"和"流动状态"之间的边界消失。

  综合:数字媒介对信息的改变不只是"成本低了"——它改变了信息在社会系统中
  运作的方式本身。前数字媒介的信息操作受限于人脑作为必选中介(读、理解、
  决策、写);数字媒介使机器成为信息操作的独立执行者。这是"量变→质变"
  的桥接点:以下游推论的术语说,DED-001 的"信息传递衰减率 r"在数字域
  中可能不再是一个有意义的参数——当信息可以被完美复制和机器直接处理时,
  "衰减"的社会意义被根本改变了。

人话摘要: "纸上的字要人读了才有用,屏幕上的字机器自己就能读、能搜、能改、能跟别处的信息自动合成——这不是'变快了',是信息从'死物'变成了'活物'。机器成了能自己处理信息的新玩家。"

bridges_to:
  concepts:
  - CONCEPT-information
  - CONCEPT-agent
  axioms:
  - AXIOM-002
bridges_field: 从 L1"信息必有物理载体、无能量维护必衰减"到可观测的数字媒介独特属性——机器可处理性使信息的社会运作方式发生质变而不仅是量变

applicable_sources:
- information_theory:
    rationale: |
      Shannon 信息论(1948)为数字编码的数学基础——信源编码定理给出无损压缩极限,
      信道编码定理给出有噪信道上的可靠传输条件。纠错码(Reed-Solomon, LDPC, Turbo
      码等)使数字信息在物理基底退化时仍可通过冗余恢复——这使 AXIOM-002 的"信息衰减"
      在数字域中作用于物理层(介质/格式)而非信息层(内容)。图灵机模型(1936)为"机器
      可处理性"提供了理论定义——任何可计算函数都可由通用机器执行,数字编码的信息
      正是图灵机的输入。
- media_theory:
    rationale: |
      Innis(1950,1951)区分时间偏向媒介(石头/泥板——耐久、难运输)与空间偏向媒介
      (纸莎草/电子信号——轻便、易逝)。McLuhan(1964)提出"媒介即讯息"——媒介的
      物质属性比其承载的内容更根本地塑造社会结构和认知模式。数字媒介引入了第三维:
      "可处理性"(Holze/MIT 媒介研究)——数字媒体"既非口语也非书写,不偏向时间也不
      偏向空间,首先是可处理的"。Deibert(1997)的超媒介论进一步论证:数字电子环境
      "青睐"特定社会力量(非领土社区、多重身份、网络化组织),正推动从现代到后现代
      世界秩序的转型。媒介理论的独特贡献是论证了"媒介属性改变→社会结构改变"的
      因果方向,而非仅"技术使现有结构更高效"。
- economic_history:
    rationale: |
      信息存储/传输/检索成本的长期数据:从手抄到印刷(复制成本下降约 1000 倍),
      从印刷到数字(边际复制成本趋零)。数字时代的关键转折不是"更便宜"而是
      "边际成本趋零改变了信息的经济性质"——信息从竞争性商品(一本书两个人不能
      同时读)变为非竞争性商品(一份数字文件可被无数人同时使用)。平台经济、
      搜索引擎、推荐算法、大语言模型——这些数字时代的基础设施,全部建立在
      "机器可处理信息"这一属性之上,而非仅"信息成本低"。经济史提供了从"量变"
      到"质变"的经验分界线:当信息边际复制成本低于某个阈值时,社会的信息组织
      方式发生结构性改变(如印刷→宗教改革/科学革命),数字将这一阈值压至零。

falsifiability: |
  本命题的核心主张是:数字媒介引入的"机器可处理性"对社会信息运作方式
  产生了【质变】而非仅【量变】。若以下条件满足,则质变主张被证伪:

  (a) 证明数字媒介的所有社会效果均可被"信息成本降低"这一连续变量完全解释,
  无需引入"机器可处理性"作为独立维度——即,若能构造一个"成本趋零但信息
  仍须人脑中介"的反事实场景,且该场景的社会效果与真实数字社会无显著差异;

  (b) 或证明机器可处理性在任一社会领域(组织/制度/规范/交换)中从未产生
  "人脑中介下不可能"的新型信息操作——即一切机器执行的信息操作,原则上
  均可由足够多的人脑+足够低的成本复现(只是更慢)。

  操作化:取一个明确依赖机器可处理性的社会现象(如搜索引擎的全文索引——在
  无机器可处理性的条件下,即使雇佣无限人力逐页翻书,也无法在亚秒级完成
  全球网页的全文检索),若该现象可以被"仅成本降低+人脑中介"的模型完整
  解释(不需要"机器自己读"),则质变主张被削弱。

  本命题不声称:
  - 数字媒介的所有社会效果都是正向的
  - 机器可处理性完全替代了人脑(人脑仍做价值判断和意义赋予)
  - 前数字媒介完全没有可处理性(索引/目录是人工的、有限的 precursor)

created: 2026-07-15
source_anchors: []
review_summary: |
  IEA=1.6(media_theory agree 1.0 锚源; information_theory partially_agree 0.3; economic_history partially_agree 0.3)→ weakly_verified,低于 1.8 阈值。
  裁决理由:媒介理论正面支持"媒介属性→社会结构"的质变主张;但信息论只证明机器操作的技术可行性、对社会质变主张沉默,经济史证据无法区分"可处理性独立维度"与"边际成本趋零的极端量变"(恰落在本命题证伪条件(a)的火线上),两票均折半。
  仪器折扣:三票由单一 LLM 执行,报告 IEA 为学科独立性上限,有效独立性低于此;本命题为新颖综合(非教科书共识),此折扣应视为承重红旗。

cross_verification:
  votes:
    media_theory:
      status: agree
      weight: 1.0
      evidence: []
      note: |
        锚源。Innis/McLuhan 传统的核心论证正是"媒介物质属性→社会结构与认知模式"
        的因果方向,可处理性作为时间/空间偏向之外的第三维(Holze 等)是该传统内的
        直接延伸;Deibert(1997)超媒介论提供"数字媒介环境青睐特定社会力量"的
        结构转型论证。该学科正面支持"质变而非量变"的核心主张。
        限定:媒介理论素有技术决定论之讥,"第三维"框架是较新的延伸而非学科定论,
        故本票为 agree 但非无保留。
    information_theory:
      status: partially_agree
      weight: 0.3
      evidence: []
      independence_note: 与锚源无 independence-model 已列 pair,取 default_independence=0.6;partially_agree 折半→0.3。
      note: |
        Shannon 信道/信源编码定理与纠错码确凿支持(a)近零衰减复制,图灵可计算性
        确凿支持(b)机器可处理的技术定义,(c)存储/传输收敛亦为工程事实。
        但信息论是数学/工程理论,只证明这些操作【可行】,对"该可行性对社会信息
        运作产生质变而非量变"这一核心社会主张本身沉默——技术前提强支持,
        社会结论零证据,故 partially_agree。
    economic_history:
      status: partially_agree
      weight: 0.3
      evidence: []
      independence_note: 与锚源无 independence-model 已列 pair,取 default_independence=0.6;partially_agree 折半→0.3。
      note: |
        长期成本数据与"竞争性→非竞争性商品"的性质转变是真实的经验支撑;
        印刷→宗教改革/科学革命提供"成本阈值突破→结构性改变"的历史先例。
        但该先例恰是双刃:印刷的质变【无需】机器可处理性即发生,说明经济史
        证据本身无法区分"可处理性是独立维度"与"边际成本趋零的极端量变"——
        这正是本命题证伪条件(a)所要求的反事实检验,经济史现有证据不足以完成,
        故 partially_agree。
  iea: 1.6
  verdict: weakly_verified
  verdict_note: |
    IEA=1.6,低于 1.8 阈值,判 weakly_verified。锚源(媒介理论)正面支持质变主张,
    但另两源只支持技术前提/经济事实,均无法独立确证"质变而非量变"的核心主张——
    证伪条件(a)(成本趋零+人脑中介的反事实场景)尚未被任一来源的证据排除。
  instrument_disclosure: |
    按 independence-model.yaml instrument_correlation.discount_rule 披露:
    本次三路投票由单一 LLM(同一仪器+其重叠语料)执行,报告的 IEA=1.6 是
    "学科独立性"上限,"仪器有效独立性"低于此。本命题为新颖综合命题
    (可处理性作为第三维并非教科书级稳固共识),按 mitigation 条款,
    此折扣应视为承重红旗而非可忽略脚注。

