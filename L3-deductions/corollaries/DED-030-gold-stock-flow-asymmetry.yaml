id: DED-030
type: deduction
layer: L3-deductions
status: verified
term: "金的存量-流量不对称与价格弹性 (Gold Stock-Flow Asymmetry and Price Elasticity)"

人话摘要: "金价不由开采成本定——每年新挖出来的金子只占地上存量的1-2%。定价权在金条持有者手里，不在金矿主手里。"

statement: |
  【Epistemic Status 诚实声明】本推论最 distinctive 的预测（金价可在 AISC 以下长期
  运行而不必然反弹）自 1971 年以来从未被观测——当前零经验检验。三个 supporting anchor
  均为方向性/一致性示意观察，非控制实验或正式事件研究。推论当前 epistemic status：
  well-formed, falsifiable hypothesis——not empirically confirmed proposition。
  Falsifiability(b) 的跨事件弹性对比是目前可在现有数据上执行的最直接检验，尚未完成。

  【核心】金的地上存量（约20万吨）与年矿产增量（约3000–3500吨）之比约50–70倍——
  年流量仅占存量的1.5–2%。这个极端的存量-流量比使金的价格形成逻辑根本异于
  流量定价商品（如原油、谷物）。(i)供给高度无弹性——新矿从勘探到投产需5–10年，
  高品位矿脉越来越稀缺→PHY-001在地质学上的表现；(ii)定价权在存量持有者——
  年新增产量只占存量的微小比例→价格不由"开采成本"决定，而由现有持有者
  愿意出售的保留价格边际分布决定；(iii)持有者异质性→价格支撑分层——
  首饰持有者（低弹性，情感/文化黏性）、央行（极低弹性，战略储备）、
  ETF/投机者（中高弹性，逐利驱动）、金矿商（对冲套保，负反馈但占比小）。

  【驱动量】存量/流量比（S/F）作为定价机制转换的开关——S/F越高，
  供给曲线短期弹性越低，定价权越从生产者移向持有者。

  【预测】(i)金价长期底由存量持有者保留价格分布尾端决定——只要大部分持有者
  不卖，价格不会崩到开采成本（与"生产成本决定价格底"的标准逻辑相反）。
  (ii)【继承自 BR-L2-021(f)，非独立新增】新矿供给冲击被存量缓冲——发现大金矿只影响
  1–2%的年流量，对总存量微不足道。此预测在 BR-L2-021(f) 中已确立（"任何单一矿脉的
  发现都不会显著改变S"），DED-030 将其封装入"定价机制"框架。若欲升级为独立预测，
  需将经验内容从"S不变"深化至"价格不变"——即供给侧事件的金价弹性在统计上显著低于
  需求侧事件。当前陈述仅达"S不变"层面，属事实前提引用而非推论增量。
  (iii)需求冲击（如央行大规模购金）直接推升金价→新产量不能快速响应→
  价格波动主要由需求端驱动。

  【判别】本推论独有预测：金价可以在AISC以下长期运行而不必然反弹——
  标准边际成本定价模型不可能给出此预测。推论的增量不在"金很稀缺"（BR-L2-021已讲），
  而在"稀缺的什么形式决定定价的什么逻辑"——存量/流量极端不对称→定价权
  从生产者转向持有者→传统供需曲线在此失效（供给曲线近乎垂直）。

operationalization:
  stock_flow_ratio:
    definition: "地上可交易黄金总存量（吨）/ 年矿产金增量（吨/年）。"
    measurement: "存量取WGC+GFMS估算（首饰金、金条金币、央行储备、ETF持仓）；年产量取USGS矿产年鉴。两者独立来源。"
    limitations: |
      地上存量是估算值，误差不影响数量级（50–70倍）的判定。

      【S/F过渡区（10-30）的预测行为——当前未覆盖】
      本推论的2×2判据表使用两个bin:高S/F(>30)和低S/F(<10)，中间存在10-30的gap。
      当某商品的S/F落在此区间（如铂族金属S/F估10-20，银的某些子市场），
      推论的适用性模糊——未给出它应表现为"持有者定价"还是"生产者定价"的明确预测。
      预期行为（待检验假设）：
      (i) 此区间为混合定价/渐近相变——S/F在10-30的商品同时受生产者和持有者行为影响，
      两套定价逻辑的混合权重随S/F近似线性或sigmoid变化；
      (ii) 不存在陡峭的"相变临界S/F"（一旦越过立刻从一种定价机制跳到另一种），
      因为S/F是连续量且定价机制本身也是continuum（从不100%由生产者也不100%由持有者）；
      (iii) 可通过跨商品S/F横截面分析检验：取S/F从1到120的多种商品（谷物/原油/铜/铂/
      银/金/Bitcoin），测各自"价格对供给侧事件的弹性"相对S/F的函数形式——
      若弹性随S/F单调递减且在10-30区间出现过渡形态，支持渐近相变假说。
      此gap不削弱金本身的核心预测（金的S/F~50-70稳固在高档），
      但限制了推论向S/F中等商品的直接推广。正式跨商品检验尚未执行。

  pricing_regime:
    definition: "价格主导决定因素——'生产者边际成本'还是'存量持有者保留价格分布的边际卖家'。"
    measurement: "比较供给侧冲击与需求侧冲击各自对金价的弹性——若供给侧弹性显著低于需求侧，支持'存量持有者定价'。需跨多个独立事件的统计比较。"
    limitations: "黄金租赁/期货市场的金融化使'有效供给'概念复杂化——纸黄金可凭空创造短期供给，需区分实物与纸黄金市场。"

derivation:
  from_l1:
    axioms: [AXIOM-001]
    theorems: [THEOREM-value-attribution]
  from_l2:
    bridging: [BR-L2-021, BR-L2-022, BR-L2-023]
  steps: |
    1. "BR-L2-021(f)供给稳定性维度确立事实前提"
       金的年产量/存量比稳定在1–2%，地上存量约20万吨——这是物理+地质事实锚定。

    2. "THEOREM-value-attribution: V(X) = (U + E_network) × S"
       对金，S（稀缺度乘数）由S/F比直接决定——年流量1–2%→S几乎不随年产量波动而变动。

    3. "S稳定 → 短期供给曲线近乎垂直"
       与流量定价商品根本不同：原油年消耗/可采储量~3–4%，谷物年产量/期末库存~20–25%——
       生产者可通过调整产量显著影响市场。金每年只新增存量的1–2%，全行业停产也不改变
       98%+的存量可供交易这一事实。

    4. "供给无弹性 → 定价权从生产者移向持有者"
       标准成本定价依赖"生产者停产→供给收缩→价格回升"通道，但金矿商停产只能收缩
       1–2%的供给。反之，存量持有者集中抛售存量的5%（~1万吨=3年全球矿产总量）
       即制造巨大冲击→边际定价者是存量持有者的保留价格分布，不是生产者的成本。

    5. "持有者异质性 → 价格支撑分层"
       (a)首饰持有者：非货币需求基底（BR-L2-023）→U>0且独立于价格→极低卖出弹性；
       (b)央行：价值储藏功能独立于交易媒介（BR-L2-022）→战略储备，弹性极低；
       (c)金条/金币持有者（零售投资，约占年需求25-30%）：物理持有，交易成本高于ETF
          但低于首饰（纯投资属性，无情感/文化黏性）。弹性介于首饰与ETF之间——
          跌价时可能"抄底买入"（counter-cyclical，类似首饰但动机是投资驱动）；
       (d)ETF/投机者：逐利驱动，中高弹性，边际价格发现的主要参与者；
       (e)金矿商：对冲套保使在金价上涨时提前卖出（负反馈），但年套保量受限于年产量
          （存量的1–2%）→负反馈力度有限。
       弹性排序: a≈b < c < d≈e → 价格越跌卖压越小 → 形成自然的"软底"。
       工业用金持有者（电子/牙科，~7-8%年需求，存量占比极小）可忽略或归入"其他"——
       其弹性受工业生产周期驱动而非金价驱动，不参与价格支撑分层。

    6. "合成与非平凡性"
       三预测来自步骤3–5的合取。逐格判空：2×2表（S/F比:高>30 vs低<10）×
       （定价主导:持有者保留价格 vs 生产者边际成本）。低S/F→生产者定价是邻近理论
       已覆盖的「平凡格」；高S/F→存量持有者定价是本推论的「非平凡格」——
       BR-L2-021给出S/F比值但未推导定价归属；THEOREM-value-attribution给出
       V=(U+E)×S但未对S/F极端值做机制分化。唯有合取二者+持有者分层才能填满该格。

falsifiability: |
  本推论可被以下发现证伪：
  (a) 金价在长期（>5年）跌破全球金矿加权平均AISC且【不反弹】——若供给收缩不足以
  托住价格（因存量持有者也大规模抛售），"存量持有者底"被推翻。
  (b) 供给侧冲击的金价弹性【不低于甚至高于】需求侧冲击弹性——
  取多个独立供给侧事件（矿难、大矿投产）和需求侧事件（央行购金公告、ETF剧变），
  比较两组弹性均值，若供给侧>=需求侧→核心机制被推翻。
  (c) 持有者弹性排序被证明错误——例如首饰持有者在金价下跌时的卖出弹性【高于】
  ETF持有者→持有者分层推导被推翻。

falsification_trace:
  primary_suspect: |
    步骤3→4：'供给无弹性→定价权转移'。即使S/F高，若金融化（纸黄金、期货、租赁）
    使'有效供给'远超实物年产量，定价权未必在实物持有者。

    【纸黄金 bypass 的深层分析——比 anti-talisman ±2σ 框架更根本的挑战】
    当前 anti-talisman(c) 的 ±2σ 框架仅覆盖"异常期"——即 paper gold 交易量偏离
    历史均值时才可作为消解理由。但 COMEX 期货未平仓合约常规性地（非异常地）远超
    可交割实物金条（伦敦金库+COMEX 金库总量）。LBMA 日均清算量~$30-50B，年化~$10T
    名义交易量，远超年实物产量（~$200B）。此非"异常"而是"结构性特征"。
    若期货市场在正常期即创造远超实物存量的 synthetic exposure，则实物 S/F 的
    定价约束力在正常期就被系统性削弱——±2σ 框架帮不上忙。

    【arbitrage 机制的反制——挑战可能反转为支持】
    期货-现货 arbitrage 是制约：若期货价格偏离现货，arbitrageur 买卖实物金条套利→
    将期货拉回现货。但此 arbitrage 的成本和规模受制于实物金的可得性——这里 S/F 机制
    重新入场。所以 paper gold 并非完全 bypass 实物约束，而是将约束从"1-2%年流量"
    放松至"可借出的实物存量"。但可借出的实物存量（金库中的金条+ETF持有+央行可出借
    储备）仍远大于年产量——定价权仍在存量持有者（决定是否出借实物金条的人），
    不在生产者。黄金租赁市场：央行将黄金出借给 bullion banks→banks 再在市场卖出或
    套利→增加"有效流通供给"。但央行借出≠卖出——借出者有 recall 权且收取租赁费，
    本质仍是持有者"出租"行为，与推论的持有者定价框架兼容而非矛盾。

    【诚实评估】paper gold 金融化是三 suspect 中最深层挑战——正常期的结构性 bypass
    未被 ±2σ 框架覆盖。但走完 arbitrage→实物约束重新入场→定价权回到存量持有者的
    完整论证后，此挑战的核心威胁被部分缓解——持有者通过"出借/不出借"黄金仍掌握
    定价权的最终开关。真正剩余风险：若金融创新将黄金 exposure 的供给弹性松绑至
    不再需要实物 arbitrage（如现金结算期货、synthetic ETF 无实物申购），
    则实物 S/F 的约束力将永久性降级。当前尚未到达此临界点——主要黄金 ETF (GLD/IAU)
    仍以实物金条为基底，COMEX 期货虽可现金结算但 deliverable supply 约束
    在极端 backwardation 时仍 show teeth（2020年3月 COMEX-LBMA 价差异常即一例）。
  secondary_suspect: |
    步骤5持有者异质性弹性排序——首饰<央行<ETF/投机者的排序可能因金融化或文化变迁逆转。
    新增关注：加密货币（如 Bitcoin）作为"数字黄金"叙事可能改变新一代持有者的弹性行为——
    当 Bitcoin 被定位为"更好的黄金"时，年轻投资者可能将黄金视为"old tech"并降低其
    portfolio 中黄金的 inelasticity。此尚未发生但应予 watch
    （在"代际文化变迁"时间尺度上可检验）。
  unlikely_suspect: "BR-L2-021(f)维度事实——S/F比~50–70的数据（WGC/USGS），稳固。"

excluded_outcomes:
  - outcome: "金价始终高于AISC"
    description: "此时'成本支撑'和'持有者支撑'预言同向，无法区分。本推论和标准理论都不被检验。"
  - outcome: "金价低于AISC且供给显著收缩（全行业减产>30%）后回升"
    description: "回升可能来自供给收缩（标准理论）或持有者不卖（本推论），归因混同。需独立观察WGC回收金量+ETF持仓方向来解耦。"

anti_talisman_clause: |
  【防不可证伪护身符】判定"持有者未抛售"必须独立于价格结果——使用WGC季度回收金统计、
  央行储备公告、ETF逐日持仓量等独立于价格的观测源。不得因"价格没崩"倒推"持有者没卖"。
  不得用"金融化/纸黄金干扰了实物市场"消解不利证据——除非独立证明该时期纸黄金交易量
  异常（相对历史均值±2σ）。

nontriviality_test: |
  2×2判据表（自变量S/F比档位 × 被预测量定价主导机制）：
  格(低S/F,生产者定价)：「平凡格」——谷物(S/F~20-25%)、原油(~3-4%)→边际成本定价，
  标准经济学已完全覆盖。
  格(高S/F,存量持有者定价)：「非平凡格」——本推论独有真经验主张。BR-L2-021给出
  S/F≈50-70倍但未推导"定价权不在生产者"；THEOREM-value-attribution未区分
  S/F极端值的定价机制相变。该格预测"金价可在AISC以下运行而不必然反弹"——
  可被现实反例证伪，非定义性真理。
  格(高S/F,生产者定价)：「如果填充则证伪本推论」。

real_world_anchors:
  supporting:
    - anchor: "1971年后金价与AISC持续偏离"
      evidence: |
        金价从35$/oz涨至2000+$/oz，而AISC在1200-1400$/oz。金价远高于AISC→
        边际定价者不是成本敏感的生产者。2015年金价短暂~1100$/oz（接近AISC底部）
        并未崩盘→与"成本是底"不一致。若成本定底，金价应在AISC附近窄幅波动。
      confidence: strong

    - anchor: "供给侧冲击的弱价格弹性 vs 需求侧冲击的高弹性"
      evidence: |
        【方向性示意观察，非因果证据——见局限性】2010年代金矿产量从~2500增至~3500吨
        （+40%）期间，金价既从1100涨至1800又从1800跌回1100——产量与价格无单调关系。
        对比ETF需求冲击：2020年ETF持仓暴增（+40%）→金价+60%至2070；2013年ETF持仓
        暴跌（-30%）→金价-30%至1200。供给侧与需求侧的弹性差异方向鲜明但非 causal
        估计——十年间实际利率、美元指数、地缘风险、央行购金政策、ETF 持仓均同时变化，
        在无 counterfactual 条件下无法做因果推论。ETF 对比（2020/2013年两事件）
        方向一致，但 ETF 持仓变化本身内生（ETF 流入既推动金价也被金价吸引）。
        此锚当前仅为 illustrative_observation（与理论不矛盾的示意性观察），
        非正式事件研究结果。正式检验需跨多个独立供给侧/需求侧事件的 event study
        统计分析（组间弹性对比），尚未完成。
      confidence: weak
      note: "降级理由：decade级时序观察在无counterfactual条件下不能做因果推论；ETF持仓变化内生。保留此锚仅为示意'与理论不矛盾'，非作为支持证据。待正式event study完成后可升至moderate/strong。"

    - anchor: "首饰金的低价格弹性——跌价时净买而非净卖"
      evidence: |
        2013年金价-28%，全球首饰金需求反而从~2200吨增至~2700吨（+23%，WGC）。
        回收金仅从~1300增至~1400吨——增幅远小于价格跌幅，弹性极低。
        持有者在跌价时净买→支持"持有者底"的非平凡预测。
      confidence: strong

  counterexamples: []

  boundary_cases:
    - case: "2013-2015年金价大跌期间的金矿商停产"
      analysis: |
        部分高成本矿山关闭（供给收缩）和持有者不卖同时作用→归因混同。
        须独立观察WGC回收金量+ETF持仓：若供给收缩<5%而价格已企稳，倾向支持本推论。
      status: boundary_case

discriminant_validity: |
  【独有可证伪预测】金价长期底不由AISC决定而由存量持有者保留价格分布尾端决定——
  金价可持续在AISC以下运行（若持有者仍未大规模抛售）。标准边际成本定价模型不能
  给出此预测（它预测价格<成本→供给收缩→价格回升）。

  【防平凡化守卫】定位三处不可被邻近理论吸收的增量：
  (1) 标准边际成本定价→没有"存量持有者定价"概念；
  (2) 避险资产叙说→没有"持有者异质性分层→软底"机制；
  (3) BR-L2-021/金本位理论→没有"S/F极端值触发定价机制相变"。
  "金很稀缺所以贵"不是本推论的卖点——BR-L2-021已讲。本推论的增量在
  稀缺的【形式】决定定价的【逻辑】和价格的【结构】。

  【弱卖点诚实标注】"需求驱动价格波动"单独不够格做独有预测——在避险情绪高涨时
  许多资产都如此。增量在：供给不能响应需求的【物理原因】（S/F极端→不可逆），
  而非制度原因（如OPEC减产协议可逆）。此增量是否够"非平凡"由审查裁定。

