id: DED-051
type: deduction
layer: L3-deductions
status: candidate
term: "人际信任衰减梯度×通货必要性：社区货币的生态位边界 (Trust Decay Gradient × Currency Necessity: The Ecological Niche Boundary of Community Currency)"

人话摘要: "熟人之间不用钱——谁帮了谁、谁欠了谁，大家都记在心里，跑不掉。陌生人之间必须用钱——谁也不认识谁，没法赊账。但还有一大片中间地带：一个镇子、一个行业协会、一个长期混的圈子——彼此不算陌生人，有点信任，但又没熟到能记住所有人的往来账。社区货币（比如LETS、时间银行、本地交换券）就是活在这片中间地带的——它能长多大、活多久，不取决于技术上设计得多好，而是这个圈子的'信任能延伸到多远'决定的。"

statement: |
  【核心】人际信任随社会距离衰减的梯度（BR-L2-009：血亲→熟人→同乡→匿名陌生人）与通货作为匿名交换中记忆替代的功能（BR-L2-011：通货替代缺失的互惠记忆/可追踪性）合力定义了社会距离谱上的三个通货生态区间——
  区间I（低社会距离/高信任）：互惠记忆自然可行，通货是冗余的；
  区间III（高社会距离/低信任）：互惠记忆完全不可行，通用法币是结构性必需的；
  区间II（中等社会距离/部分信任）：信任不足以支撑纯互惠（不够熟、记不全），但也不到匿名陌生人的零信任——记忆开始不可行但尚未完全失效。
  社区货币/LETS正是存活于区间II的通货形态。
  社区货币的规模上限（成员数、交易量、存续时长）不由技术设计决定，
  而由该社区的信任衰减梯度（BR-L2-009）决定——梯度越陡，社区货币可覆盖的社会距离半径越小、天花板越低。

  【驱动量】(i)社会距离——交换双方在血亲→熟人→同乡→匿名陌生人谱上的位置；
  (ii)信任衰减梯度——信任水平随社会距离增加的下降速率，是社区层面的结构参数，独立于任何具体通货的设计特征。

  【预测】(i)三区间存在性——在社会距离谱上存在三个可经验区分的通货生态区间，区间II是社区货币的专属生态位：纯互惠不够用、通用法币又"杀鸡用牛刀"（法币的制度成本——央行/银行/执法——在中小规模交换网络中不成比例地高）；
  (ii)梯度决定天花板——社区货币的存续时长和交易规模与所在社区的信任衰减梯度负相关：梯度越平缓（信任半径越大），社区货币可服务的成员数越多、存活越久；梯度越陡（出了小圈子信任骤降），社区货币的天花板越低；
  (iii)技术设计不能突破梯度天花板——社区货币的清算效率、记账技术、激励设计等改进可以提升区间II内的运营效率，但不能将社区货币推入区间III（匿名陌生人社会）——法币的制度基础设施（法律强制、央行最后贷款人、存款保险）是技术设计无法替代的。

  【判别】vs 标准货币理论（Menger/搜寻模型）——标准理论解释"为什么会有钱"（双重巧合困境），不预测不同社会距离下应有不同通货形态，更不将社区货币定位为特定生态位；vs 社区货币实践文献（Lietaer/Greco/LETS手册）——实践文献聚焦技术设计（互惠信用清算、demurrage、时间本位）作为成败关键，本推论主张技术设计是区间II内的效率变量，不是跨区间突破的结构变量；vs 新制度经济学（North/Williamson）——NIE讨论制度对信任的替代，但将"制度"作为笼统类别，本推论在制度大类内部做出更细颗粒度的生态位划分。

operationalization:
  社会距离:
    definition: "交换双方在血亲→熟人→同乡→匿名陌生人谱上的位置——不是地理距离，是社会关系的类型与强度"
    measurement: |
      多指标复合编码，按优先级：(a)亲缘系数——r>0.03125(远房堂表亲以上)记为"血亲"档；
      (b)交互频率与历史——过去12个月内面对面交互≥6次且认识≥3年记为"熟人"档；
      (c)共享群体身份——同属一个常住地(同镇/同街区)/同行业协会/同宗教集会/同兴趣社群的记为"同乡"档；
      (d)上述均不满足的记为"匿名陌生人"档。
      四档为操作锚点，连续谱上的中间位置(如交互频率3-5次/年)按最近锚点归类并做稳健性检验。
    limitations: "社会距离是多维概念——交互频率、情感亲密、互助义务强度可能分叉。本操作化以'可事前观测的行为指标'(亲缘系数/交互频次/共享群体)为准，不依赖自报情感亲密度(防事后合理化)。跨文化适用性需校准——某些文化中'同乡'的信任水平可能接近其他文化中的'熟人'。"

  信任衰减梯度:
    definition: "信任水平随社会距离增加的下降速率——社区层面的结构参数，操作化为相邻社会距离档之间的信任落差"
    measurement: |
      两档间信任落差=(低距离档信任评分-高距离档信任评分)/档间距。
      信任评分通过标准信任博弈实验(trust game, Berg et al. 1995)在不同社会距离条件下测量——委托人愿意转交的平均金额占比(0-100%)作为信任水平代理。
      梯度陡峭=相邻档间信任落差>30个百分点；平缓=<15个百分点；中等=15-30个百分点。
      至少需要同一社区内"熟人档"和"同乡档"的信任博弈数据以估算梯度。
    limitations: "信任博弈实验的内部效度高(行为测量而非自报)但外部效度有限(实验室vs真实交换)；替代方案为调查数据(世界价值观调查WVS的'大多数人可信吗'按关系类型分项)但自报偏差较大。梯度可能非线性——不同档间距的落差不同，一次性注册为相邻档均值差。"

  社区货币存续时长:
    definition: "社区货币从首次发行/启动到最后一次有记录交易的连续运营年数"
    measurement: "从公开记录(发起公告/媒体报道/学术案例研究)中提取的启动日期(t0)与最后活动日期(t_end)之间的年数。t_end判定标准——连续12个月无任何可验证交易记录。"
    limitations: "幸存者偏差——已消亡的社区货币记录不完整，可能低估失败案例。休眠期(名义存在但无实质交易)与活跃期的区分需逐个案例判定。"

  社区货币交易规模:
    definition: "社区货币的年交易量(以本币单位计或折算为等值劳动时间/法币金额)"
    measurement: "年交易量=12个月内的交易记录总和。优先使用发行方的公开年报或清算记录；次选学术案例研究中的引用数据。会员数=任何12个月窗口内至少完成1笔交易的不重复参与者数。"
    limitations: "自报数据可能夸大规模(发行方有动机展示活跃度)；交易量受宏观经济周期影响(法币紧缩时社区货币交易量可能骤增)——需控制外部经济条件。"

derivation:
  from_l1:
    axioms: [AXIOM-002, AXIOM-003]
    theorems: [THEOREM-relation-information-asset, THEOREM-group-identity-decay, THEOREM-cooperation-precondition]
  from_l2:
    bridging: [BR-L2-009, BR-L2-011]
  steps: |
    1. "BR-L2-009：信任有界且随社会距离衰减"
      一个人能真正"知根知底、放心托付"的对象是有限的——出了熟人圈，
      信任就随社会距离（血亲→熟人→同乡→匿名陌生人）一路陡降。
      这意味着：在不同社会距离上，人与人之间可用的"信任资源"是不同的——
      不是文化偏好，是信息约束（AXIOM-002：关于他人可靠性的信息不会自动产生和保持）
      和关系资产（THEOREM-relation-information-asset：关系信息需要反复交互沉淀）的结构性后果。

    2. "BR-L2-011：通货替代匿名交换中缺失的记忆/可追踪性"
      熟人赊账，靠双方记得谁欠谁、以后还见面——互惠记忆可行。
      跟一个"认不出、追不到、不会再见"的人打交道，没法赊账——没人记得住、也没"下次"惩罚。
      通货的核心功能之一就是替代匿名交易中缺失的互惠记忆：
      钱把"我欠社会一笔债"变成了可转让的通用符号，
      使交换不再依赖"我记得你、你记得我"这一前提。
      此步产出：通货的必要性不是绝对的——它随"互惠记忆是否可行"而变化。

    3. "合力：社会距离谱上的三个通货生态区间"
      将(1)的信任梯度与(2)的记忆可行性逻辑叠加在社会距离谱上——
      区间I（低社会距离/高信任）：血亲与熟人之间——
      信任高(BR-L2-009)，互惠记忆因重复交互而自然维持(BR-L2-011的逻辑逆应用)。
      通货在此区间是冗余的——人情账比货币账更高效，引入通货反而增加了符号转换成本。
      区间III（高社会距离/低信任）：匿名陌生人之间——
      信任极低(BR-L2-009)，互惠记忆完全不可行(BR-L2-011的核心场景)。
      通用法币是结构性必需的——它替代了不可能存在的互惠记忆，
      且法币的制度基础设施（法律强制/央行/存款保险）为匿名交换提供了必要的信任替代。
      区间II（中等社会距离/部分信任）：同乡/同业/同好之间——
      信任存在但不完整(BR-L2-009的"同乡"层：有一定群体认同但远不如熟人知根知底)，
      互惠记忆开始不可行但尚未完全失效(BR-L2-011的中间状态：
      圈子里的人彼此能认出来但记不全所有人的往来账)。
      此区间存在一个"通货需求缺口"：纯互惠不够用，但通用法币的制度成本
      （央行/银行/执法的固定成本）在小规模网络中不成比例地高——社区货币/LETS
      正是填补这个缺口的通货形态。

    4. "梯度决定天花板"
      BR-L2-009指出信任衰减梯度可以不同——不同社会/文化中，出了小圈子后
      信任下降的速度不一样（如某些传统社会中"同乡"信任仍很高，匿名社交中迅速归零；
      某些现代社会中梯度较平缓）。区间II的宽度由信任衰减梯度决定——
      梯度越陡，区间II越窄；梯度越平缓，区间II越宽。
      社区货币只能在区间II内生存——向左被纯互惠替代，向右被法币替代。
      因此：社区货币的规模上限（成员数、交易量、存续时长）不由其技术设计决定，
      而由该社区信任衰减梯度决定的区间II宽度决定。

    5. "非平凡性（逐格判空）"
      2×3判据表：社会距离(低/中/高) × 最优通货形态(无通货/社区货币/法币)——
      格(低距离, 无通货)：BR-L2-011已暗示"记忆可行则通货多余"但未在社会距离谱上定位。
      本推论将该逻辑明确映射到BR-L2-009的低距离端，非平凡在于将两个独立砖焊接后给出确定预测。
      格(中距离, 社区货币)★：核心非平凡格。BR-L2-009不讲通货，BR-L2-011不讲社会距离分层——
      没有任何单一砖预测"存在一个中间社会距离区间，社区货币是此区间的最优通货形态"。
      该格可被现实反例填充：若所有中等距离交换均由纯互惠或法币覆盖、社区货币从未独立存活。
      格(高距离, 法币)：BR-L2-011已基本覆盖"匿名交换需要通货"，
      但对"为什么必须是法币而非社区货币"沉默——本推论补充了制度基础设施的论证
      （法币的法律强制/央行最后贷款人是匿名社会的结构性需求，社区货币无法提供）。
      标★的格为本推论的非平凡核心。

falsifiability: |
  (a) 区间II空集——若系统性地经验调查未发现任何社会距离区间，
  其中社区货币是优势通货形态而纯互惠不够用、法币又过重；
  若所有中等距离交换均由纯互惠或法币充分覆盖，社区货币从未独立存活——
  则推论的核心生态位主张被证伪。

  (b) 梯度独立性——若社区货币的存续时长和交易规模与独立测量的信任衰减梯度
  在跨社区样本中无统计相关（或方向相反——梯度越陡、社区货币越大）；
  即信任衰减梯度无法解释社区货币规模的跨社区差异——
  则"梯度决定天花板"的核心机制被证伪。

  (c) 匿名规模社区货币——若存在一个社区货币在成员间社会距离持续处于
  "匿名陌生人"档（成员互不认识、无重复交互、无共享群体身份）的条件下，
  维持活跃运营≥10年且交易规模持续增长——
  则"社区货币不能突破区间II进入区间III"的边界预测被证伪。

  适用区间：推论适用于自愿参与的社区货币/LETS/时间银行/互惠信用清算系统。
  不适用于监狱/战俘营/公司镇等强制封闭环境中的代币（参与非自愿、退出不可行）；
  不适用于加密货币（以密码学信任替代社会信任，属于不同的信任机制类别）；
  不适用于由国家/地方政府发行并强制接受的法定补充货币（如阿根廷的Lecop/Patacon——
  其接受度至少部分来自与税收义务挂钩的法律强制）。

falsification_trace:
  primary_suspect: |
    BR-L2-009——信任随社会距离衰减的存在性、可测量性和跨社区差异性。
    全推论的区间划分和梯度-天花板链接都压在这条腿上：
    若信任衰减在操作化层面无法可靠测量（社会距离档之间的信任落差信噪比过低），
    或衰减梯度在不同社区间无显著差异（所有社区的信任衰减形态趋同），
    则(b)的梯度独立性检验无法执行——核心机制不可证伪。
    次要风险：BR-L2-009的"衰减"是否单调——若存在"对同乡比对熟人更信任"
    的倒挂（如某些以地缘认同为核心的传统社会），区间划分需要更复杂的拓扑而非线性谱，
    但三区间的基本逻辑仍可存活（只需重新定义距离序）。
  secondary_suspect: |
    BR-L2-011——通货=记忆替代这一功能定位的排他性。
    若通货的核心功能不仅是记忆替代（还有计价单位/价值储藏/支付网络的网络效应），
    则"记忆可行→通货冗余"的推理链可能过于简化——即使互惠记忆可行，
    社区仍可能因计价便利/网络效应/外部连通性原因而采用通货。
    这不会推翻三区间的存在性，但会削弱区间I的边界清晰度（低距离端也可能出现通货使用）。
  unlikely_suspect: |
    三区间逻辑本身——如果BR-L2-009和BR-L2-011均成立，
    社会距离谱上存在"信任不完全但记忆开始不可行"的中间地带是近乎逻辑必然的。
    脆弱的是经验操作化（能否真的测出三个区间），而非逻辑推导。

excluded_outcomes:
  - outcome: "社区货币的设计特征（清算效率/记账技术/激励结构）对运营效率的影响"
    description: "本推论不否认技术设计影响区间II内的运营效率——只主张技术设计不能将社区货币推入区间III。技术设计是'区间内爬多高'的变量，信任衰减梯度是'区间天花板在哪'的变量。"
  - outcome: "法币在低社会距离交换中的使用"
    description: "本推论主张法币在区间I是'冗余的'而非'不被使用的'——法币使用可能因制度惯性/外部连通性/便利性而在区间I出现，不证伪推论。推论的核心主张是区间II的独立生态位存在性和梯度决定天花板，不依赖'区间I禁止法币'。"
  - outcome: "加密货币/区块链社区货币能否突破社会距离天花板"
    description: "本推论限于以社会信任（非密码学信任）为基础的社区货币。加密货币用工作量证明/权益证明替代社会信任，属于不同的信任机制类别——是否能突破社会信任的梯度天花板是独立的经验问题，不在本推论射程。"
  - outcome: "国家法币崩溃时社区货币的临时替代功能"
    description: "法币信用极端下滑时（如阿根廷2001/委内瑞拉2010s），社区货币可能作为'法币替代品'短暂充当区间III的通货——但这是法币真空期的临时填补，不等于社区货币在区间III有独立的稳态生态位。推论预测此类案例中社区货币会在法币恢复后回缩至区间II。"

anti_talisman_clause: |
  【防不可证伪护身符——信任衰减梯度必须独立于社区货币成败测量】

  (1) 禁止由"社区货币存活久/规模大"反推"该社区信任衰减梯度平缓"——
  信任衰减梯度必须通过独立于社区货币结果的方法测量
  （信任博弈实验/调查数据/WVS分项），不得以社区货币的成败事后校准梯度读数。
  (2) 禁止由"社区货币失败"反推"该社区信任衰减梯度必定陡峭"——
  社区货币失败可能有技术设计缺陷/外部冲击/发起人退出等多种原因。
  只有独立测出的梯度陡峭+社区货币失败，才构成对(b)的支持（而非事后合理化）。
  (3) 禁止将社区货币的"小众"属性当作"梯度陡峭"的替代测量——
  "成员少"不等于"信任衰减梯度陡峭"——小型社区货币可能是自愿小众
  （选择窄范围运作）而非被梯度天花板压制的。
  梯度独立测量必须至少有一个锚点真正做到——
  在同一社区内用信任博弈实验测出相邻社会距离档的信任落差，
  不看该社区是否有社区货币、社区货币多大。
  (4) 社会距离的四档编码（血亲/熟人/同乡/匿名陌生人）必须在见任何通货数据前锁定——
  不得因"这个社区货币的成员把彼此当同乡"而事后将某些成员关系重新编码为同乡档。

nontriviality_test: |
  逐格判空——2×3判据表：社会距离(低/中/高) × 最优通货形态(无通货/社区货币/法币)。

  距离\通货  | 无通货(纯互惠)       | 社区货币/LETS        | 通用法币
  低(血亲/熟人)| 可行且高效(BR-L2-011) | 可能但冗余            | 可能因惯性存在
  中(同乡/同业)| 不够用(记忆开始失效)  | 生态位/最优★          | 制度成本过高
  高(匿名陌生人)| 完全不可行            | 无法突破梯度天花板★   | 结构性必需

  标★的格为本推论的非平凡主张。

  "中距离→社区货币最优"——BR-L2-009不讲通货形态，BR-L2-011不讲社会距离分层。
  两块砖各自独立时，无法推出"存在一个中等社会距离区间，其中社区货币是最优通货形态"。
  该格可被经验反例填充：若所有中等距离交换均由纯互惠或法币充分覆盖，
  且社区货币从未在任何中等距离社区中独立存活≥5年。

  "高距离→社区货币不可行"——BR-L2-011说匿名交换需要通货，
  但未论证为什么填补这个需求的必须是法币而非社区货币。
  本推论补充了法币的制度基础设施论证：法币背后是法律强制（纳税义务）、
  央行最后贷款人、存款保险——这些是匿名社会信任替代的结构性组件，
  社区货币即使有最优技术设计也无法提供。
  该格可被经验反例填充：见falsifiability(c)。

  brick=conclusion自查——"社区货币的生态位由信任衰减梯度划定、
  规模上限由梯度而非技术设计决定"——不在BR-L2-009或BR-L2-011原文或近义中。
  BR-L2-009不含"通货""货币""社区货币"；BR-L2-011不含"社会距离""信任梯度""生态位"。
  两砖合力产生的三区间生态学模型是真组合增量。

real_world_anchors:
  supporting:
    - anchor: "瑞士WIR（1934年至今）——区间II的经典案例"
      evidence: |
        WIR是瑞士中小企业间的互惠信用清算系统，成员约5万家中小企业——
        这是典型的"同乡/同业"社会距离：成员是瑞士德语区的中小企业主，
        共享地域和行业身份（瑞士 SME 圈），彼此有一定了解但远不是"熟人"——
        5万家企业之间的互惠记忆完全不可行。WIR填补了区间II的通货需求缺口：
        成员之间不需要法郎（区间I太远），但也没有完全退回到匿名法币体系
        （WIR交易圈内的信任高于纯匿名市场）。关键证据：WIR运行~90年但从未
        扩展到非瑞士/非SME群体——它的规模天花板恰好落在BR-L2-009的"同乡/同业"
        社会距离边界上，未能进入区间III（匿名国际交易）。
        诚实标注：WIR的成员规模也受其章程（限瑞士境内企业）的人为限制——
        梯度天花板与制度自限的贡献比例未剥离。
      confidence: moderate
    - anchor: "阿根廷Trueque（2001年危机）——区间II→区间III的失败跨越"
      evidence: |
        2001年阿根廷经济崩溃后，社区物物交换俱乐部（trueque clubs）在
        全国迅速扩张——鼎盛期约6000个俱乐部、250万参与者。初始形态是
        典型的区间II社区货币：邻里/社区层面的互惠交换，成员之间有基本的
        社会识别（同一街区/同一社区集会）。但随着规模膨胀，大量匿名参与者
        涌入（区间III的社会距离），互惠识别失效，出现了系统性欺诈
        （伪造信用券/重复承诺交付），整个系统在2002-2003年迅速崩溃。
        这正是本推论预测的梯度天花板效应：trueque在其原始社区信任半径内
        （区间II）运作良好；一旦被推入区间III（匿名规模），
        缺乏法币的制度基础设施使其无法维持信任，迅速崩溃。
        诚实标注：trueque的崩溃也受阿根廷经济在2003年后企稳（法币恢复）
        的影响——法币竞争的恢复与内部欺诈压力同时作用，未剥离各自贡献。
      confidence: moderate
    - anchor: "日本社区货币（Peanut/府中市等）——梯度平缓→持久但小规模"
      evidence: |
        日本的社区货币实践（如千叶县Peanut、东京府中市等）有数十年的
        持续实验史。这些社区货币通常在町内会/商店街/居民委员会层面运作——
        社会距离属于BR-L2-009的"同乡"档：居民共享居住地身份，有一定
        相互识别但不完全熟识。日本社会的信任衰减梯度相对平缓（对"同乡/同组"
        的信任延伸较远），这解释了为什么日本社区货币虽然规模不大
        （通常数百到数千人）但存续时间异常长（多个案例超过10-20年）。
        同时，平缓的梯度也将竞争门槛降低了——日本社区货币面临来自
        "积分卡/商店街券"等半正式区間II工具的持续替代压力。
        诚实标注：日本案例的因果链条未经验检验——"梯度平缓→存续长久"
        仍是相关性观察而非因果识别。
      confidence: weak
  counterexamples:
    - candidate: "布里斯托尔镑（Bristol Pound, 2012-2020）——城市规模的社区货币"
      analysis: |
        布里斯托尔镑覆盖整个布里斯托尔市（~46万人），社会距离跨度很大——
        大多数用户之间是匿名陌生人关系（同一城市但互不认识），
        似乎落在区间III而非区间II。它存活了约8年（活跃期约5-6年）。
        若编码为"成员间社会距离=匿名陌生人"且交易量持续增长>5年，
        则构成对(c)的潜在挑战。
        初步消化：(1)布里斯托尔镑实际上只是法币的"包装"——它与英镑1:1挂钩，
        可在指定商户使用，本质上是定向消费券而非独立通货体系；
        (2)它的信任基础仍是英镑（法币）——用户接受布里斯托尔镑是因为
        它100%可兑回英镑，而非对社区成员互惠记忆的信任；
        (3)若将"1:1挂钩法币"的社区货币排除在真正的独立通货之外，
        该案例不构成反例。此排除判据需在审查中辩论。
      status: needs_digestion
  boundary_cases:
    - case: "时间银行（Time Banking）——以劳动时间为单位"
      analysis: |
        时间银行（如TimeBanks USA、英国时间银行网络）用"小时"而非
        货币单位计价——所有人的一小时等值，不区分技能。
        这在通货逻辑上不同于LETS/WIR——时间银行的"平等计价"
        本质上是规范驱动的（社区互助伦理），而非市场出清价格。
        时间银行在两个维度上挑战本推论：(1)它的信任需求可能更高
        （相信对方的一小时有价值）而非更低；(2)它的规模通常比LETS更小，
        可能是因为它要求更强的信任基础而非更弱。时间银行可能是区间II内
        的一个"高信任子区间"通货形态。本推论是否适用于时间银行，需根据
        其成员间社会距离的实际测量结果判定——若测量结果落在区间II内，
        则纳入；若其信任需求使其只能在区间I-区间II边界运作，则诚实标注
        时间银行是比社区货币更"低社会距离"的交换形态。
      status: boundary_case
    - case: "公司镇代币（Company Scrip）——非自愿社区"
      analysis: |
        公司镇代币（如19-20世纪美国煤矿镇/日本炭鉱住宅的公司券）
        在形态上类似社区货币（只在特定社区内流通），但成员参与是非自愿的
        （工资以代币支付、只能在公司商店消费）。其信任机制不是社会信任
        而是雇主的经济强制——不适用本推论的信任梯度框架。
      status: excluded

discriminant_validity: |
  【独有可证伪预测】相对相邻理论逐一判别——

  (1) vs 标准货币搜寻模型（Kiyotaki-Wright）：搜寻模型解释货币作为交易媒介
  如何从物物交换中涌现——它预测"会有某种东西被普遍接受当钱用"，
  但不预测"不同社会距离下应有不同种类的钱"。本推论独有预测：
  社会距离谱上存在三个通货生态区间，区间II的最优通货形态不是法币
  而是社区货币。可判别：若所有社会距离上的交换均由同一种通货（法币）
  最优服务——搜寻模型的"一种钱"预测被坐实、本推论的"三种生态位"被证伪。

  (2) vs 社区货币实践文献（Lietaer/Greco/Northwest LETS手册）：
  实践文献的核心主张是"设计好的社区货币可以替代法币"——
  本推论直接否定这一主张：社区货币不能替代法币，因为前者没有
  法币的制度基础设施（法律强制/央行/存款保险），该基础设施是
  区间III（匿名社会）通货的结构性需求。可判别：若存在一个社区货币
  在无1:1法币挂钩的条件下，在匿名陌生人规模（成员互不认识）
  持续运营≥10年且交易规模增长——实践文献被坐实、本推论被证伪。

  (3) vs 社会资本文献（Putnam/福山）：社会资本文献断言"信任→经济绩效"，
  是单边相关。本推论走得更远——断言社会距离谱上的通货形态分布
  存在三个结构性区间，且区间边界由信任衰减梯度刚性定义。
  可判别：若信任与经济绩效相关但通货形态不随社会距离系统性变化，
  社会资本文献被坐实但本推论的更强主张不被支持。

  【防平凡化守卫】若有人说"熟人不用钱、陌生人要用钱、社区货币在中间——
  这不是明摆着的事吗"——非平凡增量在三处：
  (i)梯度决定天花板而非技术设计——这个归因是反直觉的
  （常识倾向于认为"社区货币失败是因为设计得不好"），
  且将信任衰减梯度注册为独立可测的结构参数；
  (ii)高距离端"社区货币不可行"的刚性预测——这不是"社区货币可能
  不适合大社会"的模糊陈述，而是"社区货币在任何匿名社会距离上
  都无法建立稳态生态位"的可证伪赌注；
  (iii)三区间作为一个生态学模型——不是三个孤立的观察拼在一起，
  而是两个独立砖合力产生的、有内在结构（左→纯互惠、中→社区货币、
  右→法币）和明确边界条件的系统性理论。

