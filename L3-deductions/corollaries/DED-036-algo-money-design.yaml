id: DED-036
type: deduction
layer: L3-deductions
status: verified
term: "算法成本断崖×货币物理筛选：从发现到设计 (Algorithm Cost Collapse × Monetary Physical Screening: From Discovery to Design)"

人话摘要: "算法把搜索和评估成本压低了上万倍之后，'什么东西适合当钱'这件事的玩法彻底变了——以前是大自然花上千年慢慢筛选（金、银、铜，试了无数种东西才找到最优解），现在是人可以直接在参数空间里设计（我要供应量固定、无限可分、零重量、全球秒到——这些物理世界里根本不可能同时满足的条件，在数字世界里一行代码就搞定了）。货币从'发现大自然给的少数几个最优解'变成了'在参数空间里任意设计'。"

statement: |
  【核心】算法将货币候选品的搜索/评估/匹配成本压低4-5个数量级（BR-L2-032估计≥10,000倍，但该砖为weakly_verified，精确量级未独立测量）后，
  货币的物理筛选机制(BR-L2-021)发生质变：从依赖自然材料+社会共识在千年尺度上
  缓慢收敛到少数物理最优解的"发现(discovery)"范式，转变为在六维参数空间中
  主动编程、任意组合的"设计(design)"范式。这不是"筛选变快了"——是候选池的
  本体论变了：从"在大自然给的有限菜单里挑"变成"自己写菜单"。

  【驱动量】算法使单次货币候选品评估的成本从"社会级长时间试错"坍缩为"毫秒级
  多维计算"——这一成本断崖(BR-L2-032)使BR-L2-021的六维物理约束从外生给定
  （你只能找大自然恰好满足了这些条件的材料）变为内生可编程（你可以为任意参数
  组合创造数字载体）。成本是门槛：当搜索成本高时，只有大自然替你做了预筛选的
  材料能进入候选池；当搜索成本趋零时，候选池从有限自然材料爆炸为任意参数组合。

  【预测】(i) 分布分散化——算法筛选出的货币候选品（加密货币）在六维特征空间中
  的分布，系统性比传统金属货币的分布更分散：传统货币的特征向量集中在金/银/铜
  等少数自然材料对应的参数点附近（≤10个簇），加密货币的特征向量覆盖参数空间中
  自然材料无法到达的区域（如供应量严格算法固定+无限可分+零物理重量——这三个
  条件的组合在物理世界不可能同时满足）；(ii) 维度解耦——在算法筛选范式下，
  六个维度从"物理上互相锁定"变为"可独立编程"：物理世界中金的供应可控性（开采
  速率）与其可分性（物理切割精度）受同一物理过程约束，而数字世界中供应算法与
  可分性精度是独立的代码参数；(iii) 参数创新速率跃升——新货币候选品的"特征
  向量生成速率"从自然筛选的~百年/个（新金属的货币化）跃升到算法设计范式的
  ~天/个（新代币发行），且这一速率跃升是成本断崖的直接函数。

  【判别】不同于BR-L2-021"六维得分高者胜出"（静态筛选框架——不管是发现还是
  设计，胜出者仍是得分高者）和DED-027"筛选必然收敛到单媒介"（收敛动力学——
  不管候选池来自发现还是设计，收敛逻辑不变），本推论的增量不在"筛选的终点"，
  而在"候选池的生成方式"：从自然枚举变为参数扫描——候选池的本体论变了。
  不同于L4-013"数字网络重新洗牌六维权重"（权重变了，但筛选逻辑不变），本推论
  声称的是更深一层：候选池从哪来、候选空间从离散有限变为连续可编程。

operationalization:
  algo_evaluation_cost:
    definition: "评估一个货币候选品在六维框架下得分所需的计算/时间/社会协调成本。"
    measurement: |
      用两个可独立观测的代理测量：(a) 候选品从提出到被市场广泛评估的时间间隔——
      金用了上千年才在全球范围内被确认为最优货币金属，比特币用了约5年；
      (b) 新增候选品的边际评估成本——传统范式下每新增一个候选材料需经历数代人的
      实际使用试错，算法范式下新增一个代币参数组合的评估成本约等于一次智能合约
      审计+市场在数周内通过价格发现完成评价。
    limitations: "成本的精确数量级依赖反事实估计（没有算法时评估一个新代币参数组合需要多少社会试错成本），但方向性断言（成本下降了多个数量级）有BR-L2-032的跨域证据支撑，但其精确值（10,000倍）来自weakly_verified砖，货币领域未独立测量。"

  feature_distribution_dispersion:
    definition: "货币候选品在六维特征空间中的分布离散度——聚类在少数自然材料点附近 vs 分散在参数空间中。"
    measurement: |
      对每个候选品编码六维向量（可分性/耐久性/便携性/可识别性/同质性/供应可控性，
      每维标准化到[0,1]），计算候选品集合的成对欧氏距离均值或总方差。
      传统金属候选池：金、银、铜、铁、铅、锡、铂（≤10个自然元素，物理属性绑定）；
      算法候选池：CoinMarketCap上前100代币的参数向量。
      预测：算法池的成对距离均值 > 传统池的成对距离均值（单尾检验）。
      六维编码协议参见下文 coding_protocol。当前编码为illustrative，非独立可复现，
      分数可能存在主观偏差；后续正式研究需预先注册每维编码规则并独立编码。
      limitations: |
      部分算法代币刻意模仿黄金的参数（如PAXG），这些"桥接型"代币的特征向量会靠近
      传统簇——这恰证明了设计范式（你可以主动选择"像黄金"，而黄金没得选），不算反例。
      但需在分析中将"设计选择模仿物理最优"与"设计探索新参数区域"分开统计——
      若前者占>80%，分布分散化预测被显著削弱。

  dimension_decoupling:
    definition: "六个维度在算法范式下可独立编程的程度——物理世界中维度间的自然锁定关系在数字世界中被打破。"
    measurement: |
      对传统候选品（金属元素）：计算六维之间的Spearman秩相关矩阵——物理世界的
      维度间锁定表现为高内部相关（如金的密度同时决定便携性和同质性，来自同一
      物理实体）。对算法候选品：计算六维间相关矩阵——预测相关矩阵更稀疏、
      相关系数绝对值更低。
    limitations: "设计者可能有意模仿物理世界维度间的相关结构（如让供应计划'看起来像'采矿曲线），需区分'设计选择保持相关'与'物理被迫相关'。"

  coding_protocol:
    description: "六维→[0,1]编码协议（illustrative, 非正式注册）"
    dimensions:
      divisibility:
        anchor: "物理最优=1.0（无限可分），物理最劣=0.0（不可分割的单个实体）"
        rule: "数字代币：1.0（代码层面任意分割，如BTC的1聪）；物理商品：按实用最小切割单位/总价值比例，黄金≈0.7（可磨粉但均匀性受限）"
        confidence: "中等-高（材料科学+代码审计可独立确认）"
      durability:
        anchor: "物理最优=1.0（永不退化），最劣=0.0（瞬间腐坏）"
        rule: "数字代币持久性依赖账本持续运行→0.9（网络关闭则失去功能，但账本可恢复）；物理商品：金/银化学惰性→1.0；盐块/布匹→0.2-0.5"
        confidence: "中等（数字代币持久性定义需区分账本持久与物理解释）"
      portability:
        anchor: "物理最优=1.0（零重量全域通行），最劣=0.0（不可移动）"
        rule: "数字代币需网络基础设施→0.8（依赖互联网+节点，离线场景不可用）；金属高价值运输需安保→黄金0.3（$50K≈1kg可放入口袋但易成为目标）；贝壳无需安保但易碎→0.6"
        confidence: "中等（依赖基础设施的权重需共识）"
      identifiability:
        anchor: "物理最优=1.0（完全不可伪造），最劣=0.0（无法甄别真伪）"
        rule: "数字代币密码学验证→0.95（依赖软件，但私钥丢失等同失去）；黄金试金石/光谱仪→0.85（伪造难度高但非零）"
        confidence: "高"
      homogeneity:
        anchor: "物理最优=1.0（每单位完全相同），最劣=0.0（每件独一无二）"
        rule: "数字代币→1.0（代码等价）；黄金须提纯至标准→0.95（自然金矿含杂质）；布匹/盐块→0.5-0.8"
        confidence: "高"
      supply_controllability:
        anchor: "物理最优=1.0（供应完全可预测固定），最劣=0.0（供应随机波动）"
        rule: "数字代币算法固定→1.0（如BTC）；黄金地质+技术波动→0.7（年增量1.5-2%稳定但不可完全预测）；法币受政策影响→0.5-0.8"
        confidence: "中等（数字代币供应的算法可能被硬分叉改变，需审计合约）"
    note: "以上编码规则为初步框架，未经过独立编码者检验。后续研究应预注册每维分子/分母/标定锚点，并在编码者间考核一致性。"

derivation:
  from_l1:
    axioms: [AXIOM-001, AXIOM-002]
    theorems: [THEOREM-exchange-competition-alternative, THEOREM-value-attribution]
  from_l2:
    bridging: [BR-L2-021, BR-L2-032]
  steps: |
    1. "BR-L2-021的筛选框架：货币候选品必须同时满足六维物理条件"
    BR-L2-021确立：一种商品要成为货币，需在可分性/耐久性/便携性/可识别性/
    同质性/供应可控性六个维度上同时达标。在物理世界中，这六维约束共同作用
    的结果是：只有极少数自然元素（金/银/铜）能同时满足全部条件——因为这些
    维度锁定在同一物理实体的原子/晶体结构中（金的化学惰性→耐久性+可识别性，
    金的密度→便携性+同质性，这些属性不可解耦）。候选品必须物理存在→候选池
    =地球上存在的元素+简单化合物，总数有限（实用金属<10种）。

    2. "传统范式的候选池生成：大自然的有限菜单——'发现'"
    在无算法辅助的条件下（搜索/评估成本极高），人类只能从自然界现成的材料中
    筛选货币候选品。筛选过程：在千年尺度上通过无数交易者的反复试错→社会共识
    收敛→胜出者（金→银→法币）。这是"发现"范式：候选池外生给定（大自然），
    筛选是内生的（社会选择），二者分离。候选池的有限性是物理事实，不是理论选择。

    3. "BR-L2-032的成本断崖：从千年试错到毫秒评估"
    BR-L2-032确立：算法将搜索/匹配/监控成本压低≥10,000倍（该量级来自跨域类比，
    该砖状态为weakly_verified，货币领域具体成本降幅尚未独立测量，但方向性证据成立）。
    应用于货币筛选：评估一个候选品在六维上的得分，从"需要数代人实际使用+社会共识形成"
    坍缩为"对代币参数运行计算验证+市场在数周内通过价格发现完成评估"。成本断崖使
    "生成并评估一个新参数组合"从不可行变为近乎免费——这是候选池爆炸的使能条件。

    4. "合成：成本断崖→候选池爆炸→筛选范式从发现质变为设计"
    步骤2（候选池有限）+步骤3（评估成本崩塌）→当生成并评估一个新参数组合的
    边际成本趋零时，候选池从"自然材料的有限集合"（~10个元素）爆炸为"六维参数
    空间中任意可编程点的连续统"。这一爆炸不是量变——自然材料之间的差异是离散的、
    由元素周期表决定的（金和银是不同的元素），而参数空间中的点是连续可微调的
    （供应量可以是任意精度的浮点数）。这就是"发现→设计"的质变：候选池不再是
    "大自然给了什么"，而是"设计者想要什么参数组合"。关键：BR-L2-021的筛选逻辑
    仍适用（六维得分高者仍更可能胜出），但候选池的生成方式从外生枚举变为内生
    扫描——这是两个砖各自不覆盖的交互涌现。

    5. "非平凡性（逐格判空）"
    2×2判据表见nontriviality_test。核心空格="高评估成本+分散分布"预测为填充度受
    物理锁定约束——无算法时候选池限于物理材料，但并非绝对空（前现代贝壳、石币等
    已在参数空间中占据不同于金/银/铜的位置）。核心非平凡格="低评估成本+分散分布"
    ——这是BR-L2-021和BR-L2-032各自不单独给出的交互预测：
    BR-L2-021只说"高分者胜出"（不管是自然材料还是算法代币，胜出逻辑不变），
    不说"候选池会爆炸"；BR-L2-032只说"成本坍缩"（不管是货币领域还是其他领域），
    不说"货币候选池从有限枚举变为连续扫描"。无单砖写有"货币筛选从发现范式质变
    为设计范式"这一结论。

falsifiability: |
  本推论可被以下发现证伪（任一条成立即推翻核心）：
  (a) 算法筛选出的货币候选品（加密货币前N）的六维特征分布与传统金属货币候选品
  的分布无显著差异——两者聚类在相似的参数区域，加密货币未探索自然材料无法到达
  的参数空间→"设计范式带来新参数区域"的核心预测被推翻。
  (b) 加密货币的特征向量虽然在参数空间中更分散，但所有"成功"的代币（市值前20）
  的特征向量反而高度聚类在接近黄金参数的区域→表明设计范式的探索是噪声，
  筛选仍在奖励物理最优解附近的参数→"设计开辟新有效区域"的预测被推翻。
  (c) 维度解耦预测被推翻：加密货币六维间的相关矩阵与传统金属的六维相关矩阵
  无显著差异→算法范式下维度仍锁定在一起→"参数独立编程"的核心机制失效。
  适用区间：覆盖已部署智能合约平台的公链代币生态；纯实体贵金属代币化（如PAXG）
  属于桥接型，需与原生加密代币分开分析。

falsification_trace:
  primary_suspect: |
    候选池从"有限自然枚举"到"参数空间连续扫描"的质变声称——这是最脆弱的腿。
    两重威胁：(a) 即使算法评估成本坍缩，人类设计代币时仍倾向模仿物理世界已知
    成功模式（黄金的稀缺性→比特币的2100万上限，黄金的挖掘难度→PoW）——设计者
    的认知锚定可能使"设计"事实上只是"加速的模仿"，候选池并未真正拓展到任意
    参数组合；(b) 参数空间中大部分区域可能对应"客观上不好的货币"（如通胀率
    100%的供应计划），即使能被设计出来，市场也会迅速淘汰它们→有效候选池
    并未实际扩大。若有效候选池（被市场认真对待的候选品）的分布与传统金属池
    无显著差异，则"质变"声称坍缩为"量变"（更快筛选而非不同范式）。
  secondary_suspect: |
    BR-L2-032的"成本下降≥10,000倍"的精确量级——该砖状态为weakly_verified，
    量级估计依赖跨域类比（电商搜索/广告匹配/代码托管），在货币领域的直接成本
    测量证据稀疏。若实际成本下降仅为100-1000倍量级（而非10,000+），成本断崖
    仍可成立但"候选池爆炸的质变阈值"需重新标定。但方向性预测（分布更分散）
    在100倍量级下仍可能成立，这使该suspect为secondary而非primary。
  unlikely_suspect: |
    BR-L2-021的六维框架（IEA=2.4，材料科学+考古+实验经济学+博弈论四路交叉）
    与AXIOM-001（稀缺性-竞争公理）——物理事实与逻辑基石的确定性高，极少是
    证伪根源。即使推论被推翻，六维框架本身不受影响。
  note: "primary若被坐实（设计者认知锚定使有效候选池未扩大），推论降格为'算法加速了货币筛选'这一弱命题，但发现→设计的质变声称失效。"

excluded_outcomes:
  - outcome: "算法代币完全取代传统金属货币成为全球主导货币"
    description: "本推论预测筛选范式从发现变为设计，不预测设计范式一定胜出。设计出的东西不一定比发现的好——参数自由不等于质量保证。"
  - outcome: "具体哪个算法代币会成为主导媒介"
    description: "本推论的射程是'候选池的生成范式变了'，不是'哪个具体代币会赢'（后者是DED-027+具体市场条件的复合问题）。"
  - outcome: "法定数字货币（CBDC）的六维特征"
    description: "CBDC由中央银行设计，其参数选择受制度约束而非市场自发筛选——不在BR-L2-021自发市场筛选的射程内。"

anti_talisman_clause: |
  【防不可证伪护身符——三条硬约束】

  (1) 判定"设计范式"时：必须按候选品的六维特征向量是否落在自然材料可达的
  参数区域之外来判定——金/银/铜/铂等自然元素的六维向量定义了"自然可达区域"
  的凸包。若一个代币的特征向量落在该凸包内→它属于"加速发现"（参数与自然材料
  不可区分），落在凸包外→它属于"真正设计"（参数组合在物理世界没有对应物）。
  严禁因"某代币成功了"就称其为"设计范式的胜利"，或因"某代币失败了"就称
  "它不算真正的设计"——成败独立于来源范式。

  (2) 判定"维度解耦"时：必须用独立于代币成功的编码。物理维度间的锁定关系
  （如密度同时影响便携性和同质性）由材料科学独立给定（元素周期表事实），不依赖
  于金是不是货币。数字维度间的独立性由代码审计独立验证（供应算法与可分性精度
  是否在代码层面耦合）。不得因"两个维度在成功代币中恰好相关"就声称"它们仍锁定"。

  (3) 反例消化门：若发现一个算法代币的特征向量落在自然材料凸包内，但其参数
  确实是"设计"出来的（如PAXG刻意模仿黄金），这不算反例——因为"设计者选择模仿
  自然"本身就是设计范式的表现（自然筛选下你无法"选择模仿"，你只能"恰好是"）。
  但此消化仅当满足以下闭合条件时成立：在排除所有"主动选择模仿自然参数"的代币后，
  剩余原生算法代币的特征分布仍显著比传统金属池分散。若排除后两者无显著差异→
  anti_talisman消化失效，推论被削弱。
  【主动选择模仿的识别判据（独立于特征向量邻近度）】：
  代币在白皮书或官方设计文档中明确声明其参数设计锚定某种自然商品（如PAXG锚定黄金、
  Litecoin早期称"银"）或市场公认属于稳定币/桥接币（如USDT锚定美元）——这类代币
  无论其特征向量是否落在凸包内，均属于"主动选择模仿"。命名中包含锚定信号
  （如"Gold"、"Silver"、"Stable"）亦作为辅助证据。该判据独立于六维特征向量，
  可预先登记。若无法基于文档/命名确定，则将该代币保留在全样本中，不做排除处理。
  若排除后剩余代币的分布仍显著更分散，则anti_talisman闭合成功；否则闭合失败。

nontriviality_test: |
  2×2判据表（自变量档：评估成本高[传统范式] vs 低[算法范式] × 被预测量档：
  特征分布聚类在自然材料附近 vs 分散覆盖参数空间）：

  格（高成本，聚类）——「平凡」——历史基线。物理约束+高搜索成本→只有自然材料
  进入候选池→特征分布被元素周期表锁定→聚类不可避免。任何砖都预测此格。

  格（高成本，分散）——「填充度受物理锁定约束」——在无算法辅助时，候选品必须是
  物理存在的材料。物理定律限制了参数组合的范围，但并非绝对空：前现代社会已使用
  贝壳（高便携低供给可控）、石币（低便携低可分）、盐块（低耐久）等多元货币，
  其特征向量远非全聚类在金属簇附近。该格可被部分填充，但填充度远低于低成本范式。
  其"非空但稀疏"确认了评估成本是范式切换的必要不充分条件。

  格（低成本，聚类）——「若被大量填充，削弱推论」——若即使有了算法，所有被市场
  认真对待的代币的特征向量仍聚类在黄金/白银参数附近→表明设计者认知锚定+市场
  淘汰机制使有效候选池未实际扩大→"质变"声称坍缩为量变。此格的可填充性使本
  推论可证伪——不是所有"低评估成本"场景都自动产生"分散分布"。

  格（低成本，分散）——「非平凡格·核心预测」——算法成本断崖使候选池从有限
  自然材料爆炸为参数空间中的任意可编程点→特征分布应系统性更分散。这是
  BR-L2-021和BR-L2-032各自不单独给出的交互预测：BR-L2-021的筛选框架在两种
  范式下都适用（都是高分者胜出），不预测分布差异；BR-L2-032的成本断崖适用于
  一切搜索/评估场景，不特定于货币。两砖焊接后才产生"货币候选池从自然枚举
  变为参数扫描"这一交互涌现。

  brick=conclusion自查："算法成本断崖使货币筛选从发现质变为设计"这一结论未在
  任何承重砖中原文或近义出现。BR-L2-021描述的是静态六维筛选框架，不讨论候选池
  的生成范式；BR-L2-032描述的是跨域成本断崖，不讨论货币领域的范式后果。
  无为本推论窄化的专用砖。

real_world_anchors:
  supporting:
    - anchor: "比特币的参数组合在物理世界无对应物（维度解耦+分散分布，预测i/ii）"
      evidence: |
        依据coding_protocol重新校准后的比特币六维特征向量（illustrative）：
        可分性=1.0（1亿聪），耐久性=0.9（依赖账本持续运行，但网络关闭则功能丧失），
        便携性=0.8（全球转账但需要互联网+节点软件），可识别性=0.95（密码学验证，
        但需软件），同质性=1.0（每聪等价），供应可控性=1.0（算法固定）。
        黄金的校准后向量（对照相同协议）：
        可分性=0.7（物理切割有下限），耐久性=1.0（化学惰性），便携性=0.3
        （密度高，易受盗窃），可识别性=0.85（试金石可行但伪造存在），同质性=0.95
        （提纯可测），供应可控性=0.7（地质+开采波动但年增量稳定）。
        校准后，比特币在（可分性+便携性+供应可控性）三个维度上仍显著超出自然
        材料可达范围——"设计范式探索新参数区域"的核心预测未因分数调整而撤销。
        差异幅度缩小，但方向未变。
      independent_test: "六维编码依据coding_protocol，可独立编码检验。分数为illustrative，需正式研究预注册。"
      confidence: strong

    - anchor: "以太坊的供应计划灵活性——物理世界不可能的'可编程供应'（预测ii/iii）"
      evidence: |
        黄金的供应由地质+开采技术决定，不可编程。以太坊的供应从PoW固定发行
        （类似黄金的采矿曲线）切换为PoS可变发行（2022年The Merge后），甚至在
        EIP-1559后实现了一定程度的净通缩——供应成为治理参数而非物理给定。
        这在物理货币范式中不可想象：你无法通过投票改变地壳中的金矿储量。
        参数创新速率：以太坊在10年内经历了3次重大供应规则变更，而黄金的供应
        参数（年开采增量）在千年尺度上几乎不变。
      independent_test: "以太坊的供应规则变更为链上公开数据，独立于ETH的市场价格可验证。"
      confidence: strong

    - anchor: "稳定币（USDC/USDT）——设计范式下的'主动选择模仿物理'（边界验证）"
      evidence: |
        稳定币的特征向量高度聚类在法币美元附近（供应可控性由发行方决定而非
        算法固定，与黄金的可预测供给曲线不同）——它们的参数是刻意设计来模仿
        传统货币的。这证明了"设计范式的存在"：自然筛选下你无法选择模仿美元，
        设计范式下你可以。但这也提示了设计范式的局限：市场对"熟悉的参数组合"
        的偏好可能限制参数空间的探索范围。
      confidence: moderate

  counterexamples:
    - case: "PAXG等黄金锚定代币——特征向量完全落在金的凸包内"
      analysis: |
        PAXG的特征向量与黄金几乎重合——这是"设计选择模仿自然"的案例，
        不是反例。在自然筛选范式下，不存在"选择模仿另一种商品"这一动作。
        按anti_talisman判据(3)消化：排除PAXG+同类"桥接型"代币后，
        剩余原生加密代币的特征分布仍需显著分散→否则推论被削弱。
      status: consumed_via_anti_talisman

  boundary_cases:
    - case: "比特币的PoW机制是否属于'模仿自然'（黄金的挖掘）？"
      analysis: |
        比特币的PoW确实在叙事层面模仿了黄金的挖掘，但两者有本质差异：
        黄金的供应由地质+技术外生决定，不可编程；比特币的PoW难度调整算法
        是刻意设计的反馈机制，且2100万上限是代码写死的——自然黄金没有
        "总量上限"这一参数。比特币的"部分模仿+部分创新"恰说明设计范式的
        自由度——你可以选择在哪些维度模仿自然、在哪些维度脱离自然。
      status: boundary_case

discriminant_validity: |
  【相对于BR-L2-021（一般等价物的物理筛选）的判别】
  BR-L2-021的核心是可证伪预测："找到一个六维得分全面劣于另一种可获取商品的
  文明媒介→框架被推翻"。这个预测在"发现范式"和"设计范式"下都是可检验的——
  不管候选品来自大自然还是代码，胜出者仍须是加权得分最高的。本推论不挑战
  BR-L2-021的筛选逻辑，而是揭示当评估成本崩塌时，候选池的生成方式从"自然枚举"
  变为"参数扫描"——筛选的输入端变了，筛选本身仍是六维框架。增量不在筛选终点，
  而在候选池本体论。
  独有预测：BR-L2-021单独不能预测"算法时代的货币特征分布会比传统时代更分散"——
  它没有"候选池生成范式"这一变量。

  【相对于DED-027（物理筛选机制+E_network收敛）的判别】
  DED-027声称：高密度交换网络中，收敛到单一主导媒介是结构必然，胜出者由局域
  加权最优决定。本推论不挑战收敛逻辑——不管候选池来自发现还是设计，E_network
  正反馈仍会推动收敛。本推论的增量：在算法范式下，DED-027的E_network收敛起点
  （候选池的初始特征分布）已经变了——候选池不再聚类在自然材料附近，而是分散
  在参数空间中。这对DED-027的"胜出者由局域加权得分决定"机制有后续影响：更分散
  的候选池意味着更可能出现"多个得分接近的候选"→触发DED-027的预测(ii)（赢家
  通吃+路径依赖），使收敛的偶然性成分上升。

  【相对于L4-013（数字时代价值储藏媒介竞争格局）的判别】
  L4-013声称数字交换网络重新洗牌了六维权重——这是权重层面的变化，筛选逻辑不变。
  本推论声称的是更深一层的变化：在权重被重标之前，候选池本身的生成方式已经变了。
  L4-013与DED-036是互补关系，而非替代关系：L4-013处理"各维度相对重要性变化"，
  DED-036处理"候选品从哪来"的本体论变化。

  【防平凡化守卫】
  不要将本推论理解为"算法让货币设计变快了"——这是BR-L2-032在货币领域的平凡
  应用。非平凡内核在于：(a) 候选池从自然有限枚举到参数连续扫描的质变（不是
  量变——自然材料之间的差异是离散的元素周期表差异，参数空间的差异是连续可微调
  的）；(b) 维度解耦——六个维度从物理锁定变为独立可编程；(c) 分布分散化的可
  检验预测——如果算法只是一个"更快的搜索引擎"，它应加速收敛到同样的物理最优解，
  而非产生特征分布的系统性偏移。这三个增量均不在任何单块承重砖里。

