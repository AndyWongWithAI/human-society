id: DED-025
type: deduction
layer: L3-deductions
status: verified
term: "道德标准通胀-紧缩 (Moral Standard Inflation-Deflation)"

人话摘要: "道德变严靠故事+有人推（受害叙事+道德创业者），变松靠放手（旁观者不管了+新一代不内化了）——紧缩是默认状态，通胀需要刻意维持能量投入。"

statement: |
  【核心】社会道德标准由两条不对称机制驱动。
  通胀方向（变严）：M1 受害叙事涌现——先前不被视为受害者的人群成功建立可共情的
  伤害叙事；M2 道德创业者——少数人超额投入打破集体行动困境，推动新标准。
  紧缩方向（变松）：M3 第三方执行瓦解——个体惩罚成本>个体收益→旁观者停止惩罚，
  基于 BR-L2-018（利益占比稀释→惩罚强度下降）；M4 内化跟随瓦解——对等性信号
  断裂→新一代不内化旧规范→代际紧缩完成，基于 BR-L2-019 P2（对等性信号=内化维持
  条件）。关键不对称：通胀需要主动推动（叙事+创业=对抗熵增的集中能量输入），
  紧缩是默认状态（维护能量断了→PHY-001熵增接管，无需对称的"反道德创业者"）。

  【驱动量】道德标准严格度 = 社会对特定行为类别的集体谴责/惩罚的范围与强度，
  独立于 M1-M4 测量。通胀推力 = M1 叙事成功度 × M2 创业投入度（合取：缺一堵死）。
  紧缩通道 = M3（旁观者执行消退）+ M4（代际内化断裂）——两条独立熵增路径。

  【预测】(i) M1 或 M2 任一缺失→通胀被堵：有叙事无创业者=有意识无行动，
  有创业者无叙事=孤立倡导者无法动员。(ii) M3 或 M4 任一激活→标准自动松绑，
  无需对称的"反道德创业"。(iii) M3+M4 同时激活→紧缩加速（两条独立熵增通道并行）。
  (iv) 不对称签名：通胀方向启动成本显著高于紧缩方向——前者需组织集中投入，
  后者只需维护能量断裂。

  【判别】与"道德滑坡论"(L5 规范命题)不同——本推论只讲"怎么变"不讲"好不好"。
  与 DED-024（个体层面内化瓦解四阶段）不同——DED-024 讲个体内化崩解的顺序结构，
  本推论 M4 引用 DED-024 作为代际传导的微观基础，焦点在社会层面标准方向。
  与"道德恐慌"(Cohen)不同——道德恐慌讲反应过度性，本推论讲方向变化的结构驱动。
  与"规范生命周期"(Finnemore & Sikkink)不同——该理论描述规范采纳三阶段但不预测
  通胀/紧缩的方向不对称性。

operationalization:
  moral_standard_strictness:
    definition: "社会对特定行为类别的集体谴责/惩罚范围（多少种行为被视为道德违规）与强度（惩罚/谴责的严厉程度）"
    measurement: "(a) 法律/宗教/习俗编码中'道德违规'行为类别数的纵向变化；(b) 调查中公众道德谴责广度评分；(c) 同一违规行为的惩罚严重度纵向追踪。道德vs习俗分类使用 DED-023 判据（TP×INT坐标）"
    limitations: "跨文化可比性有限——同一行为在不同文化中可能落在 TP×INT 平面的不同象限。纵向追溯受史料完整度限制"
  M1_victim_narrative_emergence:
    definition: "先前不被主流社会视为受害者的人群，成功建立被广泛认可的可共情伤害叙事"
    measurement: "媒体框架分析（叙事出现前/后的受害标签使用率）+公众舆论调查（该群体'是否遭受不公'的认同率变化）。独立于结果：不因'标准确实变严了'反推'叙事必定成功'"
    limitations: "叙事'成功'的阈值无自然切割点——需预设认同率变化幅度的显著标准"
  M2_moral_entrepreneurship:
    definition: "少数个体/群体为推进某道德标准变革，投入远超其个人预期收益的资源（成本>个体收益→真创业，非自利游说）"
    measurement: "(a) 识别倡导者并核算其投入成本/时间；(b) 估算该标准变革对其个人的预期收益上限；(c) 成本>收益上限→确认为道德创业"
    limitations: "个人收益估算无法精确——声誉/心理收益难以货币化。创业者本人可能高估或低报预期收益"
  M3_third_party_enforcement_collapse:
    definition: "BR-L2-018 预测：当旁观者在合作结构中的利益占比被稀释到个体惩罚成本以下→旁观者停止惩罚→对等性信号断裂"
    measurement: "(a) 计算群体规模增长后个体利益占比的稀释倍数；(b) 田野/实验中观察到的第三方惩罚行为频率纵向下降；(c) 独立于结果：不因'标准松了'反推'M3 必定激活'"
    limitations: "从利益占比稀释到可观测的 TP 行为下降存在时滞——个体可能因习惯/惯性继续惩罚一段时间。BR-L2-018 未给出精确的占比-行为映射函数"
  M4_internalization_follow_collapse:
    definition: "BR-L2-019 P2+P3 预测：对等性信号断裂持续超过一个发育窗口→新一代不内化旧规范→代际紧缩完成"
    measurement: "(a) 纵向队列比较：同一规范在相邻两代人中的内化深度（使用 DED-024 操作化——IAT/情绪 Stroop/GSR）；(b) 测量新一代发育窗口期内对等性信号强度；(c) 独立于结果：不因'新一代确实更松'反推'M4 激活'——必须独立测量发育窗口期的对等性信号"
    limitations: "需要跨越至少一个发育窗口期（~15-20 年）的纵向数据。历史数据通常无法满足——需依赖同期队列比较或移民/叛逃者回忆作为代理"

derivation:
  from_l1:
    axioms: [PHY-001]
    theorems: [THEOREM-moral-third-party-enforcement, THEOREM-moral-internalization]
    concepts: [CONCEPT-morality, CONCEPT-norm, CONCEPT-agent, CONCEPT-group, CONCEPT-information]
  from_l2:
    bridging: [BR-L2-014, BR-L2-018, BR-L2-019]
  steps: |
    1. "砖的贡献——每条砖单独给出什么"
       BR-L2-014（代价第三方惩罚）：证实 TP 是跨文化存在的规范执行机制——这是 M3
       的执行基础（TP 存在→才有"TP 瓦解"可谈）。
       BR-L2-018（旁观者利益关联）：TP 强度随旁观者在合作结构中的利益占比变化——当
       群体规模/复杂度稀释利益占比，TP 系统性下降→M3 的直接发动机。注意：
       BR-L2-018 给出单调关系；THEOREM-moral-third-party-enforcement Corollary 2
       给出个体层阈值（"当个体收益低于个体成本时，第三方惩罚不再是个体层面的可持续
       策略"）。本推论将此推至社会层：当群体规模的系统性增长使大多数个体的利益占比
       越过个体成本阈值时，分散化 TP 在社会层面瓦解，构成 M3 紧缩通道。
       BR-L2-019（道德内化发育窗口）：P2（对等性信号=内化维持条件）+P3（青春期=
       关键重组窗口）→M4 的发动机——当对等性信号在发育窗口期断裂，新一代不内化。

    2. "M1+M2——通胀侧的主动推力（完全不在砖中，本推论独有）"
       M1（受害叙事涌现）：参考集体行动框架对齐理论（Benford & Snow 2000）——
       社会运动成功的必要条件是建立"不公框架"——将个人不满转化为共享的受害叙事。
       本推论精炼为：受害叙事=通胀的必要非充分条件。
       M2（道德创业者）：参考奥尔森集体行动困境——大群体中个体搭便车→无人行动→
       道德创业者是打破此困境的超额投入者——其投入>个体收益→行为偏离理性自利预期。
       关键合取逻辑：M1 解决"为什么这是问题"（认知），M2 解决"谁来做"（行动）——
       缺一堵死。

    3. "不对称——PHY-001 应用于道德系统"
       PHY-001（热力学第二定律）：不持续维护→结构退化。
       通胀=结构构建（新规范的建立和扩散=从低秩序到高秩序=对抗熵增）→需要能量输入。
       紧缩=结构退化（规范维护停止→向着更高熵状态回落=熵增）→不需要专门输入能量。
       该不对称不在 BR-L2-014/018/019 任何一处——三块砖只描述个体层机制的存在条件，
       不做"通胀/紧缩不对称"方向性论断。

    4. "逐格判空——非平凡性定位"
       2×2 判据表：方向{通胀,紧缩} × 主动推力{有,无}
       - 通胀×无推力→预测：标准不变（空白格）。若观察到无叙事+无创业者而标准自发收紧
         →推翻。砖不强制此格为空。
       - 紧缩×无推力→预测：标准仍松绑（非空）。若观察到无 M3+M4 条件下标准长期不松绑
         →推翻。
       推论非平凡内核在"通胀需要推力而紧缩不需要"这一不对称——三块砖均未声称此方向
       不对称。

falsifiability: |
  (a) 发现道德标准在无 M1（可独立确认的受害叙事）+ 无 M2（可独立确认的道德创业者）
  条件下发生显著通胀（标准显著收紧）→M1+M2 的必要合取主张被推翻。
  (b) 发现道德标准在 M3 未激活（TP 强度无下降）+ M4 未激活（新一代内化深度
  无下降）条件下发生显著紧缩→"紧缩不需要推力"主张被推翻——紧缩可能需要尚未
  识别的第三机制。
  (c) 发现紧缩方向的启动成本与通胀方向无统计差异（紧缩同样需要等量的组织集中
  投入）→核心不对称被推翻。
  适用区间：群体规模≥3 且存在稳定规范。适用于法律执行薄弱的领域（习俗/道德领域）——
  在有强法律执行的领域，法律替代 TP 混淆 M3 的独立测量。

falsification_trace:
  primary_suspect: "不对称——紧缩不需要推力。若发现紧缩系统性地需要 M1+M2 对称的
    '反道德创业'才能发生→核心不对称被推翻。最危险反例：美国禁酒令废除（1933）——
    '反禁酒'运动本身是一项有组织的道德创业（反禁酒联盟+媒体叙事），暗示紧缩可能
    也需要推力。消化：禁酒令本身是通胀产物（M1+M2 驱动的国家强制），废除是
    '弹回'而非自发紧缩——强制通胀的撤销属不同动力学，不在射程内。但若弹回速度
    显著快于通胀建立速度→方向符合不对称预测（紧缩快于通胀）。"
  secondary_suspect: "M1+M2 合取必要性。若发现无叙事有创业者仍成功推动标准收紧
    →合取逻辑需退为析取或交互。或发现叙事+创业者到位但通胀失败（阻力>推力）→
    需补充调节变量（如现存制度摩擦力）"
  unlikely_suspect: "M3 与 M4 各自独立贡献——即使 TP 从不瓦解，M4（代际遗忘）仍可
    独立驱动紧缩→推论核心（紧缩是默认状态）仍成立"

excluded_outcomes:
  - "通胀/紧缩的绝对速度预测——本推论只做方向性+不对称预测，不做速率定量"
  - "具体哪个道德领域先通胀/先紧缩——M1-M4 是通用结构机制，具体领域选择
    由外部历史偶然性决定，不在本推论射程内"
  - "法律强制推动的道德标准变化——属 L4-006 的'法律替代道德'路径，不在 DED-025 射程内。
    操作化区分判据：法律驱动=标准收紧的主要执行渠道为制度化法律制裁（罚款/监禁/行政处分）
    而非自发的社会惩罚（排斥/羞辱/声誉贬损）；道德驱动反之。判断依据：变化前后，该行为的
    非法律社会惩罚频率是否发生了独立于法律惩罚频率的变化。此判据锚定于 L4-006 的
    '法律替代道德'路径定义——参见该 L4 命题的操作化区分标准。"

anti_talisman_clause: |
  禁止因"标准松了"反推"M3/M4 一定激活"——M3 和 M4 必须独立测量。
  M3 独立测量锚：BR-L2-018 的利益占比计算——群体规模扩张前后的个体利益占比变化
  可独立量度（不依赖于是否观察到标准已经松了）。M4 独立测量锚：发育窗口期内
  对等性信号的独立测量——需纵向数据（BR-L2-019 的 Kochanska 承诺遵从范式扩至
  青少年期），不依赖成年后的行为观察。
  禁止用"大家都不在乎了"解释紧缩——同义反复。必须指出 M3 或 M4 的独立证据。
  禁止在发现通胀速度低于预期时声称"M1 叙事不够好"而不更新理论——M1 的成功
  需操作化为可测的公众认同率变化，不得事后定性。

nontriviality_test: |
  判据表:方向{通胀,紧缩} × 主动推力{有,无}

  通胀×有推力: M1+M2 合取→标准收紧（预测：可观察的通胀事件背后必可识别
  M1 和 M2。必要非充分——有 M1+M2 不保证通胀成功，推力可能被制度摩擦力压倒）

  通胀×无推力: 预测为空——标准不变。若观察到无叙事+无创业者而标准自发
  收紧→推翻。此格为空是砖不强制的主张——砖只讲执行/内化机制，不禁止
  标准可自发收紧

  紧缩×无推力: 预测——标准自然松绑。若观察到 M3+M4 均在独立测量中未激活
  而标准仍保持→推翻或需补充维持机制。此格预测非空是砖不强制的主张

  紧缩×有推力: 标准加速松绑（"反道德创业"作为放大器）→不改变不对称方向

  THEOREM 先占声明（扩展至完整 depends_on 链）：
  - THEOREM-moral-third-party-enforcement Corollary 2 已给出：M3 个体层阈值
    （"当个体收益低于个体成本时，第三方惩罚不再是个体层面的可持续策略"）。
  - THEOREM-moral-internalization Corollary 1 已给出：个体层能量不对称
    （"内化建立速率远慢于瓦解速率，月/年级 vs 天/周级"）。
  - THEOREM-moral-internalization Corollary 2 已给出：代际道德变迁框架
    （"不同对等性信号→不同内化内容"）。
  上述 THEOREM 先占物均停于个体层——不做"社会层面标准变化的方向不对称"论断，
  不做 M1（受害叙事）或 M2（道德创业者），不做 M1+M2 合取必要性，不做
  PHY-001→道德系统的熵增应用。DED-025 的独家增量收窄为：(a) M1（受害叙事
  涌现）——全新；(b) M2（道德创业者）——全新；(c) M1+M2 合取必要性（缺一堵
  死）——全新；(d) 社会层方向不对称（PHY-001 应用于道德系统→通胀需要集中能量
  输入/紧缩是熵增默认）——部分新（THEOREM 有个体层微观不对称但无社会层宏观主张）；
  (e) 四机制统一方向动力学框架——整合本身是新的。
  非平凡内核：通胀需要推力而紧缩不需要——不在三块承重砖任何一处，也不在两个
  THEOREM 的命题层（THEOREM 只描述个体层机制条件，不做"社会层面标准变化的
  方向不对称"论断）。

real_world_anchors:
  supporting:
    - "美国民权运动(1954-1968)：M1→种族隔离对黑人的系统性伤害叙事成功建立
      （媒体图像+法律论证），M2→MLK+SNCC等道德创业者超额投入（被捕/受伤/被杀
      远超个人利益）。通胀签名：标准从'隔离合法'转为'隔离不道德'——需持续
      十年以上的集中投入。"
    - "苏联解体后俄罗斯(1991-2005)：M3→国家作为第三方执行者瓦解（不再惩罚腐败+
      日常违规），M4→1990年代青春期一代在对等性信号断裂窗口内长大→
      腐败/逃税等规范松动。紧缩签名：一代人内完成——无'反道德创业者'推动。"
    - "动物权利运动(1975-)：M1→Singer《动物解放》建立动物受苦的可共情叙事，
      M2→PETA等组织超额投入→道德圈扩展。通胀签名：标准收紧持续数十年。"
    - "诚实标注：以上三个 supporting anchor 均为'M1+M2 在场+通胀发生'的充分条件
      路径展示，不直接检验合取必要性（M1+M2 缺席→通胀被堵）——必要条件路径尚无干净
      的直接经验检验案例，目前依赖'找不到反例'的间接支持。另，苏联 anchor 的因果归因
      可能过度：1990 年代俄罗斯的道德标准松动不仅来自 M3+M4，还混杂经济休克疗法
      （1992）的生存竞争激化、西方文化涌入、制度真空等因素——将复合效应归因于单一
      M3+M4 通道可能高估了这两个机制的解释力。当前案例展示的是机制在场的 directionally
      consistent 证据，非 mechanisms 的排他性因果检验。"
  counterexamples:
    - "美国禁酒令(1920-1933)：通胀（禁酒成为道德标准）由国家强制而非 M1+M2
      驱动→废除（紧缩）也是政治运动产物。消化：禁酒令是法律驱动的通胀
      （L4-006的'法律替代道德'路径）→不在本推论射程。其废除速度（13年）远
      短于通胀建立（~80年禁酒运动）→方向符合不对称预测。"
  boundary_cases:
    - "当通胀与紧缩同时发生在同一社会的不同道德领域（如1960s美国：种族平等通胀+
      性规范同时变化）——本推论不解释'哪些领域先变'，只解释给定领域
      变的方向需要什么机制条件。"
    - "道德创业者的'超额投入'边界：若创业者预期从标准变革中获得巨大个人声誉→
      投入可能仍在自利范围内→不是真创业。需个案鉴定成本-收益比。"

discriminant_validity: |
  独有可证伪预测：道德标准的紧缩不需要对称的主动推力——只需维护能量停止，熵增接管。
  与此形成对照的竞争理论：(1) 规范生命周期(Finnemore & Sikkink 1998)——描述规范
  从出现到普及的三阶段，但"规范衰退"阶段同样被描述为需要"规范反创业者"主动推动，
  不预测方向不对称。(2) 道德恐慌(Cohen 1972)——讲社会对偏离行为的过度反应，焦点在
  反应的非对称性而非道德标准方向的系统性偏移。(3) Overton 窗口——描述政治可行区间
  的漂移，但视为渐进过程，不做通胀/紧缩的不同能量需求预测。

  THEOREM 差额表（防"THEOREM 已讲过了"的精细威胁）：
  - THEOREM-moral-third-party-enforcement Corollary 2 已讲：TP 在个体层越过成本
    阈值后不可持续——DED-025 增量：将此推至社会层→M3 紧缩通道。
  - THEOREM-moral-internalization Corollary 1 已讲：个体层内化建立慢/瓦解快的能量
    不对称——DED-025 增量：将不对称推至社会层方向动力学（通胀需要推力/紧缩不需要）。
  - THEOREM-moral-internalization Corollary 2 已讲：不同对等性信号→不同内化内容
    （代际变迁框架）——DED-025 增量：将代际变迁定位为"熵增默认"的正式通道（M4）
    并与 M1-M3 整合为统一框架。
  - 三个 THEOREM 均未讲：M1（受害叙事涌现）、M2（道德创业者）、M1+M2 合取必要性、
    社会层方向不对称的"无需对称推力"主张。

  防平凡化守卫：不要将推论简化为"道德会变松也会变严"(常识)或"没人管了就不守了"
  (BR-L2-014 已讲)或"TP 消退规范就松了"(THEOREM 已讲)。核心增量在：通胀需要两种
  特定的主动推力（叙事+创业，合取），紧缩是熵增默认状态——无需推力。若读者将推论
  压缩为"社会规范会变"或"TP+内化就够了"→已被平凡化。

