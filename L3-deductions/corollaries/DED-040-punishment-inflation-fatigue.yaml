id: DED-040
type: deduction
layer: L3-deductions
status: verified
term: "算法监控成本断崖×第三方惩罚：惩罚通胀与惩罚疲劳的分叉 (Algorithmic Monitoring Cost Cliff × Third-Party Punishment: The Punishment-Inflation / Punishment-Fatigue Bifurcation)"

人话摘要: "算法让发现别人违规的成本断崖式下降后,大量以前看不见的小违规全进了'可罚池'——这触发两种相反的走向:要么举报太多、每条举报越来越不值钱(惩罚通胀),要么大家重新划线、只罚那些算法汇总后够严重的大事(惩罚疲劳)。最后走哪条路,取决于举报这个行为本身还能不能证明'我是个维护公道的正经人'。"

statement: |
  【核心】算法监控使违规检测成本下降4-5个数量级(BR-L2-032)后,大量此前不可见的轻微违规进入"可惩罚池"——这触发了三种社会动力学路径,构成一个分叉(bifurcation,此处为广义多岔而非严格数学意义的二叉)。路径A(惩罚通胀):惩罚行为因供给暴增而贬值——单次举报/惩罚的信号价值被稀释,个体需累积更多惩罚行为才能发出同等强度的"我是规范维护者"信号,形成通胀 spiral。路径B(惩罚疲劳):社会形成新的惩罚阈值均衡——个体和平台放弃逐条惩罚轻微违规,改为只对算法聚合后达标的严重违规采取行动,惩罚行为的总频次下降但单次信号价值恢复。路径C(惩罚专业化/角色分化):少数个体(自然涌现的执法者或被任命的版主)承担大部分惩罚行为,其单次惩罚通过角色背书维持信号价值,多数个体退出惩罚。最终走向取决于声誉系统的设计:若仅累计举报次数→路径A(通胀);若区分举报质量(如采纳率权重>举报量)→路径B(疲劳/阈值重置);若存在角色分层(如版主/信任举报者)且角色独立于举报量授予→路径C(专业化)。

  【驱动量】自变量=违规检测成本(由算法监控的部署密度决定,可独立于惩罚行为测量);中间变量=惩罚行为的信号价值(单次惩罚行为携带的"规范维护者"身份信息量,由惩罚的稀缺性和成本共同决定);被预测量=惩罚行为模式的极化方向(通胀型 vs 疲劳型 vs 专业化型(混合型为过渡态,非独立稳定均衡,见 operationalization 备注)),操作化为举报频次分布的形状变化与单次举报采纳率的纵向关系。

  【预测】(i)高监控密度平台的用户举报行为呈现两极化——高频举报者的单次举报影响力(被平台采纳率)随举报量上升而递减(惩罚通胀证据),同时整体用户举报阈值上升(只有更严重的违规才被举报,惩罚疲劳证据)。(ii)两种路径的分叉受平台的声誉系统设计调节:若声誉系统仅累计举报次数(如"举报达人"徽章按总量计)→推动路径A(通胀),单次举报信号价值趋零;若声誉系统区分举报质量(如采纳率权重>举报量)→推动路径B(疲劳),低质举报被抑制、高质举报维持信号价值。(iii)在无制度性信号维持的纯自发环境中(松散线上社群,无正式或半正式声誉系统,且社群规模大于约200活跃用户使非正式自然认知无法有效运作),系统默认走向路径A(通胀)而非路径B(疲劳)或路径C(专业化)——因为个体缺乏协调手段来集体重置阈值或形成角色分工,单独"少举报"不带来个人收益,导致通胀 spiral 成为纳什均衡。小规模紧密社群(N≤约200)可能通过非正式自然认知(个人判断力口碑)维持信号价值,构成预测(iii)的规模下界(详见 excluded_outcomes)。

  【判别】与DED-025(道德标准通胀-紧缩)不同:DED-025讲的是"什么行为被视为道德违规"的标准本身在涨落在变,本推论讲的是"惩罚行为"作为一种信号的购买力在变——相当于DED-025关注"货币(道德标准)的发行量",本推论关注"货币(惩罚行为)的购买力"。与DED-021(第三方惩罚严重度校准)不同:DED-021讲单次惩罚内部的比例校准(罚多重=罪多重),本推论讲惩罚行为之间的信号竞争(同一罪被多人罚→每次罚的信号价值被稀释)。与"slacktivism/懒人行动主义"文献不同:该文献描述低成本的符号性政治参与(如转帖= activism),本推论给出其背后的信号经济学机制——检测成本断崖→惩罚供给暴增→信号贬值。

operationalization:
  violation_detection_cost:
    definition: "发现并确认一起违规行为所需的时间/精力/技术资源成本,在算法监控语境下由监控算法的覆盖率×精度决定。"
    measurement: "(a)平台侧:监控算法的日扫描内容量/人工审核替代比——如机器初审覆盖率从0%→99%的成本变化;(b)用户侧:从'需自己目击+举证'到'算法推送疑似违规供一键举报'的认知-操作成本变化;(c)独立于结果:检测成本的测量依据技术部署的时间线(如平台上线某自动审核模块的日期),不得因'举报量上升了'反推'检测成本必下降了'。"
    limitations: "不同违规类型的检测成本下降幅度不同——文本辱骂的机器检测(成熟)与图像隐晦侵权(不成熟)的降幅差可达数量级。推论适用于检测成本已有实质性下降的违规类别。"
  punishment_signal_value:
    definition: "单次第三方惩罚行为(举报/公开谴责/声誉扣分)所携带的'惩罚者是规范维护者'身份信息量——即该行为在多大程度上能向旁观者证明惩罚者的合作品质。"
    measurement: "(a)信号价值=惩罚的稀缺性×惩罚的成本。稀缺性=该群体中人均惩罚行为频次的倒数;成本=执行该惩罚的时间/社会风险/被反举报风险。(b)操作化代理指标:单次举报的平台采纳率(adoption rate=被平台判定有效并处理的举报数/该用户的举报总数)——采纳率下降=信号被稀释的间接证据。(c)独立于结果:信号价值的两个因子(稀缺性、成本)均可独立于采纳率测量——稀缺性由群体人均举报频次的事前统计给出,成本由举报操作的时间/门槛/反举报风险独立评估。"
    limitations: "采纳率作为信号价值的代理指标受平台审核策略变化混淆——平台可能因审核人力增减而改变采纳率,与用户端的信号竞争无关。理想情况下需控制平台侧审核容量恒定的时段。当审核容量数据不可得时(外部研究者通常无法获取精确的审核人力时间序列),替代策略:(a)取多个平台的采纳率变化共同趋势——审核策略变化通常平台特异,信号竞争效应跨平台共性更强;(b)以平台为固定效应的面板模型,控制平台级审核策略的时间不变差异;(c)诚实标注'此控制的实践可兑现性有上限,信号价值独立测量的置信度应相应打折'。"
  punishment_regime:
    definition: "惩罚行为模式的极化类型——三种稳定均衡:通胀型(高频低质,人均举报量↑且单次采纳率↓)、疲劳型(低频高质,人均举报量↓且单次采纳率↑或稳定)、专业化型(惩罚行为集中到少数自然涌现的'执法者',高频者单次采纳率不降或上升,人均举报量Gini上升但信号价值由角色背书维持)。混合型(高频者采纳率递减但整体均值不变,双峰分布)是通胀与疲劳之间的过渡态而非独立稳定均衡——缺少阻止整体均值最终下降的稳定化机制,系统在足够长时间内会向通胀或疲劳极化。"
    measurement: "(a)举报频次分布的形状变化:Gini系数或峰度——通胀型→分布更不均(少数高频者主导),疲劳型→分布回归均匀,专业化型→分布高度偏斜(少数高频者集中多数举报);(b)人均举报量×平均采纳率的纵向散点图:通胀型→二、四象限(量升质降),疲劳型→三象限(量降质稳),专业化型→一象限(量升质稳或升);(c)区分通胀型与专业化型的关键判据:高频者(如前1%举报量)的单次采纳率纵向趋势——若Gini上升且高频者采纳率下降→通胀型;若Gini上升且高频者采纳率不降或上升→专业化型(需控制高频者举报类别变化);(d)过渡态的识别:若Gini上升+高频采纳率递减+整体均值短期不变→可能为通胀-疲劳过渡态,需拉长观测窗口(≥8季度,若平台活跃用户月增长率持续>20%,则需更长窗口以排除暂时性波动)确认最终极化方向;(e)独立于驱动量:不因'检测成本下降了'预判进入哪条路径。"
    limitations: "三种稳定类型的边界为连续谱而非断崖——需预设聚类阈值。过渡态(混合型)可能在较长时期内维持(如新高质量惩罚者持续进入暂时补偿了信号贬值),但缺乏稳定化机制的过渡态最终会向通胀或疲劳方向极化,观测窗口建议≥8季度。对于持续快速增长的平台(月增长率>20%),由于用户构成和信号供给持续膨胀,可能需要更长的观测窗口(如≥12季度)以区分方向性趋势与暂时波动。专业化型与疲劳型的边界可能模糊——当专业执法者行为本身构成制度化阈值重置时(如平台将举报权限集中给少数信任用户),专业化型可视为疲劳型的制度性等价形式。平台的产品改动(如引入举报冷却期)可外生地切换类型,混淆自发动力学的观测。"

derivation:
  from_l1:
    axioms: [AXIOM-001, AXIOM-002, AXIOM-003]
    theorems: [THEOREM-competition-norm, THEOREM-cooperation-precondition, THEOREM-conflict-cost, THEOREM-moral-third-party-enforcement]
    concepts: [CONCEPT-norm, CONCEPT-fairness, CONCEPT-agent, CONCEPT-information, CONCEPT-interaction]
  from_l2:
    bridging: [BR-L2-014, BR-L2-032]
  steps: |
    1. "砖的贡献——每条砖单独给出什么"
       BR-L2-014（代价第三方惩罚）：确立人类具有愿付个人成本惩罚违规者的"第三方惩罚"
       本能。关键隐含前提——在祖先环境中,违规检测是稀缺的:需要有人在场目击+愿意举证+
       冒着被报复的风险。稀缺性赋予每次惩罚行为以信号价值——"我愿付成本惩罚违规者"
       = "我是可信的合作者"(Barclay 2006,Nelissen 2008)。BR-L2-014 记录了 TP 存在,
       但未讨论当检测不再稀缺时 TP 的信号价值会怎样变化——它隐含假设稀缺条件是稳定的。

       BR-L2-032（算法驱动的搜索/匹配/监控成本断崖）：揭示算法使监控成本下降≥10000倍——
       从"需有人目击+人工举证"到"机器自动扫描+一键举报"。该砖的焦点在交易成本
       (搜索/匹配/监控),未讨论此次成本断崖对社会惩罚行为的二阶影响。它提供了"检测
       不再稀缺"的物理条件,但不做"惩罚信号价值会因此发生什么"的行为预测。

    2. "合取——两块砖各自不够、合起来才有的新东西"
       BR-L2-014 说"人愿罚"但默认检测稀缺→每次罚都有信号价值。
       BR-L2-032 说"检测变便宜了"但不讲这对惩罚行为意味着什么。
       合取的关键推理:将 AXIOM-001(稀缺性→竞争→价值)应用于"惩罚行为"这个特殊商品——
       当惩罚机会(可检测到的违规)从稀缺变为丰裕,单次惩罚行为的信号价值面临稀释。
       这不只是"更多人举报"的量变——这是信号经济的结构性变化:
       当人人随手可举报,举报就不再证明"我愿付成本维护规范",而变成一种廉价姿态。
       两块砖各自不涉及此推理——BR-L2-014 不讨论信号稀释,BR-L2-032 不讨论惩罚行为。

    3. "分叉逻辑——为何是三条路径而非两条或四条"
       检测成本断崖后,惩罚行为的信号价值受到威胁,但社会系统有三种(且只有三种)
       稳定自洽的应对方式:
       路径A(惩罚通胀):个体继续以低成本大量惩罚→单次信号价值持续下降→
       为发出同等信号需累积更多惩罚行为→通胀 spiral。这类似于通货膨胀——
       货币(惩罚行为)的供给量暴增,每单位货币的购买力(信号价值)下降。
       路径B(惩罚疲劳):个体和平台协调重置"值得罚"的阈值——
       只对算法聚合后达标的严重违规采取行动→惩罚频次下降→
       每次惩罚恢复稀缺性→信号价值恢复。相当于"货币改革"——重新锚定。
       路径C(惩罚专业化/角色分化):社群自发形成惩罚分工——少数个体
        (自然涌现的"执法者"/事实版主)承担大部分惩罚行为,其单次惩罚维持
        高信号价值(因角色被社群认可),多数个体退出惩罚。此路径与路径B的
        关键区别:惩罚总频次不必然下降(甚至可能因高频者大量举报而上升),
        但信号价值通过角色背书而非稀缺性维持。
       注意:混合型(高频者采纳率递减+Gini上升+整体均值短期不变)是通胀与
       疲劳之间的过渡态,非第四种稳定均衡——缺少阻止整体均值最终下降的
       稳定化机制,系统在足够长时间内(≥8季度)会向通胀或疲劳极化。为何不存在
       第四条稳定路"信号价值不变、人人恰好维持原有的惩罚频次"?因为检测成本
       下降使惩罚的供给曲线整体右移——在原有信号价值水平上,惩罚行为的供给量
       会远超需求量(旁观者不需要看这么多惩罚来评估一个人),价格(信号价值)
       必然下降——除非有制度性地板托住(如专业化中的角色背书)或群体协调重置
       阈值(路径B)。

    4. "调节变量——声誉系统设计作为分叉的'扳道工'"
       平台的声誉系统设计是决定走向路径A、路径B还是路径C的关键调节变量:
       如果声誉系统仅累计举报次数(如"已举报999条"徽章)→奖励数量而非质量→
       推动路径A:个体理性策略=多举报,不管每条是否有用。
       如果声誉系统区分举报质量(如"采纳率95%"权重>举报总数)→惩罚质量高的
       个体获得更高声誉,低质举报无收益→推动路径B:阈值自然重置。
       如果声誉系统存在角色分层(如版主/信任举报者制度),且角色赋予独立于
       举报次数的社群认可(如选举/任命),则可能推动路径C:少数被认可的个体
       承担惩罚职能,其举报维持高信号价值。在无制度性信号维持的纯自发环
       境中(松散线上社群,无统一声誉系统),个体缺乏协调手段来集体重置阈值或
       形成角色分工——单独"少举报"使自己的信号优于他人但损失举报量带来
       的声誉收益→搭便车困境使路径B和路径C均无法自发达成,系统默认走向
       路径A(通胀 spiral=纳什均衡)。
       预测(iii)的"制度性信号维持"操作化边界(区分三层):
       (i)正式制度——声誉分数公式/采纳率公开展示/角色分层(版主任命/信任
       举报者制度)/显式质量加权;(ii)半正式制度——社群显式约定(如"@某人来
       裁决"的惯例/非正式版主被广泛认可,但无公式无任命);(iii)非正式自然
       认知——重复互动中涌现的个人判断力口碑(如"Alice的报告一贯准确"
       的共享知识),无任何显式规则或角色。预测(iii)"无制度性信号维持→默认
       通胀"中的"制度性"涵盖(i)正式制度+(ii)半正式制度。纯(iii)非正式自然
       认知不算"制度性信号维持"——其有效运作须社群规模足够小(N≤约200活跃
       用户,使个体判断力口碑可被广泛追踪)。预测(iii)的适用射程因此需增加
       社群规模条件:无正式/半正式制度且N>200→自然认知无法有效运作→预测(iii)
       的搭便车困境成立;无正式/半正式制度且N≤200→自然认知可能维持信号→
       预测(iii)在此规模下可被证伪,构成推论的规模下界。

    5. "逐格判空——非平凡性定位"
       3×2 判据表:应对路径{通胀,疲劳,专业化} × 信号价值状态{贬值,维持回归}。
       - 通胀×贬值:检测成本下降→惩罚供给暴增→信号价值被稀释。非平凡。
       - 疲劳×维持回归:阈值重置→信号价值恢复。非平凡。
       - 专业化×维持:角色背书→信号价值维持。非平凡。
       空格:若不存在任何制度协调,系统能否自发稳定为疲劳或专业化?
       预测(iii)主张:不能,只能走向通胀。
       非平凡内核:在"检测成本断崖→惩罚信号价值必然受威胁"的主张中,
       以及"受威胁后只有三条自洽路径(通胀/疲劳/专业化)"的分叉描述中。

falsifiability: |
  (a) 发现一个高算法监控密度平台/社群,在检测成本显著下降后(可由技术部署时间线
  独立确认),其用户的人均举报频次大幅上升且单次举报的采纳率/社会声誉回报
  长期保持不降→"丰裕×维持"空格被填满,推论证伪。操作化细则:检测成本下降
  判定阈值=机器初审覆盖率从<10%→>90%(取技术部署前后12个月窗口对照);
  "长期保持不降"=至少连续4个季度采纳率无显著下降趋势(p>0.1, Mann-Kendall)。
  (b) 发现在无制度性信号维持的纯自发线上社群中(无正式/半正式声誉系统、无举报
  质量反馈,且社群规模>200活跃用户——排除小规模自然认知维持信号的可能,
  详见 excluded_outcomes),系统自发收敛到路径B(阈值重置)或路径C(专业化)
  而非路径A(通胀 spiral)→预测(iii)被推翻:群体可无需制度协调而自发跳出
  通胀 spiral。
  (c) 发现声誉系统区分举报质量后(如引入采纳率权重),惩罚通胀仍在持续≥8个季度
  无减弱趋势→预测(ii)被推翻:调节变量无效,分叉不由声誉系统设计决定。
  适用区间:存在重复交互(AXIOM-003)、违规行为可被第三方观测、存在非正式或
  半正式规范执行(非纯法律执行)。排除一次性交互平台(如单次交易的匿名市场,
  无重复博弈的声誉积累)。

falsification_trace:
  primary_suspect: "分叉必然性——'丰裕×维持'格为空。最危险反例:Wikipedia
    的编辑回退系统——大量自动化工具(ClueBot NG/Huggle)使破坏行为检测近乎
    实时+全覆盖(丰裕检测),但资深编辑的回退操作仍然具有强信号价值(采纳率不降、
    社群声誉维持)。若 Wikipedia 的案例证明'丰裕检测+信号维持'是可行的稳定
    均衡,则推论的'分叉必然性'被削弱——需退为'多数情况下分叉,特殊制度设计
    可维持信号'。消化:Wikipedia 的核心差别在于其声誉系统天然区分质量——
    回退权限是分层授予的(从普通用户→rollbacker→管理员),这本身就是
    '阈值重置'的制度形式——你无法通过自动回退1000次破坏来获得管理员权限
    (靠的是社群信任投票)。这恰好落在预测(ii)的射程内:当声誉系统区分质量时,
    路径B(疲劳/阈值重置)占优——Wikipedia 不是反例,是路径B的示范案例。
    但此消化是否充分,取决于 Wikipedia 的自动化工具是否真的使'回退操作'的
    稀缺性下降了(如果机器已拦截了99%的破坏,剩余的1%由人处理→每个手动回退
    仍然是稀缺的→信号价值未受威胁→空格未填)。因此 Wikipedia 作为一个
    '接近但可能未进入丰裕区间(因为机器承担了绝大部分,人仍然稀缺)'的边界
    案例,需进一步操作化检测成本的下降是否真的传导到了'人类可执行的惩罚行为
    的供给量'——如果机器把池子清到只剩几个,人的惩罚供给并未实质增加,
    则检测成本下降未传导至行为层,推论的前提条件未满足。"
  primary_suspect_trivialization_risk: |
    注意——AXIOM-001→"检测丰裕→信号价值受威胁"这一环节的演绎成分较重。
    读者可能将核心逻辑压缩为"惩罚信号多了就不值钱"(供需法则的朴素类比),
    此压缩虽丢失了分叉必然性与调节变量两个关键增量,但压缩是可能的。
    推论真正的经验增量集中在:(1)分叉必然性——"丰裕×维持"格为空,系统不可
    能停留在"检测丰裕+信号价值不变"的均衡上;(2)声誉系统设计作为可干预的
    工程/治理杠杆——不只是"多了就不值钱",而是什么决定了走通胀、疲劳还是
    专业化路径。防平凡化:若仅保留"AXIOM-001应用于惩罚信号→信号受威胁"
    这一段,读者得到的是演绎性常识(非新知识);推论的知识增量在分叉的三岔口
    结构+调节变量的可操作性,这两点不是"常识"能产出的。

  secondary_suspect: "预测(iii)——无制度协调时默认走向路径A。若发现反例
    (无声誉系统的松散社群自发形成阈值重置或专业化角色分化)→需补充自发
    协调机制(如关键个体的规范创业,类似于 DED-025 的 M2 道德创业者,
    但应用于惩罚行为层)。另注意预测(iii)的可证伪性边界:若'制度性信号维持'
    的操作化边界过宽(涵盖非正式自然认知),则预测(iii)几乎无法在任何有重复
    交互的社群中被证伪——需在excluded_outcomes中明确制度性的三层定义和
    社群规模下界(见excluded_outcomes)。"
  unlikely_suspect: "BR-L2-014(TP 本能存在)和 BR-L2-032(检测成本断崖存在)
    ——极少是问题根源。反例更可能削弱'信号价值必然受威胁'的桥接逻辑,
    而非否定两块基础砖。"
  note: "BR-L2-032 为 weakly_verified(IEA=1.6,详见 depends_on.bridging_risk_note)→
    若 BR-L2-032 的经验基础后续被削弱(如算法监控的降成本幅度被证明远小于
    10000×或仅适用于特定领域,或前数字制度安排在可比规模上实现相近效率),
    则本推论的'丰裕检测'前提条件部分抽空——推论仍逻辑自洽但适用范围收窄。"

excluded_outcomes:
  - "惩罚通胀/疲劳的绝对速度或精确时间尺度——本推论只做方向性+分叉预测,不做速率定量"
  - "平台内部的商业决策(如调整审核人力、改变举报入口设计)——属平台治理操作,
    不在规范演化推论的射程内。仅当平台的产品改动系统性改变信号价值维持/稀释时,
    才作为预测(ii)的验证素材进入射程"
  - "法律系统的惩罚校准(法定量刑)——属制度性中心权威惩罚,非分散第三方惩罚,
    不在本推论射程内。边界判据:惩罚者是否因其惩罚行为获得个人声誉回报——
    若是(志愿者版主/社群领袖),入射程;若否(职业法官/受薪审核员),出射程"
  - "一次性交互(无未来之影)中的举报行为——无重复博弈约束,信号价值不构成
    真实个人收益,不在本推论射程内(AXIOM-003 要求重复交互)"
  - "预测(iii)的社群规模边界:N≤约200活跃用户的紧密社群中,非正式自然认知
    (个人判断力口碑)可能在没有正式/半正式制度的情况下维持信号价值,构成对
    预测(iii)的规模下界限定。'制度性信号维持'的操作化定义为:正式制度
    (声誉公式/采纳率展示/角色任命)或半正式制度(社群显式约定如'@某人裁决'
    的惯例)。纯非正式自然认知(III)不算'制度性信号维持'——其有效运作依赖
    小规模社群(≤200活跃用户使个体口碑可被广泛追踪)。预测(iii)的完整射程:
    无(i)正式制度+(ii)半正式制度+社群规模N>200→搭便车困境成立,默认通胀。"

anti_talisman_clause: |
  判定"检测成本是否下降"时,必须依据技术部署时间线独立测量——监控算法的上线日期/
  覆盖率变化/扫描量变化——不得因"举报量上升了"反推"检测成本必下降了"(循环论证:
  检测成本下降→举报量上升,若同时用举报量上升证明检测成本下降→同义反复)。

  判定"惩罚信号价值是否下降"时,必须依据独立于举报量的指标——单次举报的采纳率/
  旁观者对举报者的合作意愿变化(如后续博弈中的信任转移)——不得因"举报量多了"
  就推论"每条必不值钱了"(这恰恰是需要检验的核心主张)。

  判定"社会是否进入惩罚疲劳(阈值重置)"时,必须独立测量举报阈值的纵向变化——
  同一类违规在算法部署前后被举报的概率/严重度门槛变化——不得因"举报量下降了"
  反推"阈值必重置了"(举报量下降可能单纯因违规总量下降)。

  判定"声誉系统是否区分质量"时,必须依据系统设计文档/产品规则的事前编码——
  采纳率权重的客观存在(如在声誉分数公式中 `reputation = f(adoption_rate, volume)`
  且 `∂f/∂adoption_rate > ∂f/∂volume` 或采纳率有独立展示位)——不得因'该平台
  恰好走路径B'就事后宣称'其声誉系统必区分了质量'。

  至少两个承重锚必须真的独立测出驱动量:
  (a) 检测成本下降→技术部署时间线(平台 changelog/API 文档),不依赖行为变化;
  (b) 信号价值变化→单次举报采纳率或旁观者信任转移实验,不依赖举报总量变化。

nontriviality_test: |
  判据表:应对路径{通胀,疲劳,专业化} × 信号价值状态{贬值,维持回归}

  通胀×贬值:预测非空——检测成本断崖→惩罚供给暴增→信号价值被稀释。
  疲劳×维持回归:预测非空——阈值重置→信号价值恢复。
  专业化×维持:预测非空——角色背书→信号价值维持。

  空格:①是否存在第四条路——信号价值不变且人人维持惩罚频次?本推论声称
  没有,因为检测成本下降必然使供给曲线右移,除非有制度化支撑(疲劳或专业
  化)或角色背书,否则信号价值必受威胁。②检测丰裕+信号不变不依靠任何制度
  支撑是否可能?若观察到这样的案例(如 Wikipedia 被证实为丰裕检测+人类惩罚
  供给增加但采纳率不降+无制度性角色背书)→空格被填满,推论证伪。

  THEOREM 先占声明:
  - THEOREM-moral-third-party-enforcement:确立 TP 的逻辑基础(个体在合作
    结构中有利益→愿执行规范)。不讨论检测成本变化对 TP 信号价值的二阶影响。
  - THEOREM-competition-norm:确立竞争在重复交互中规范化。不讨论惩罚行为
    本身的信号竞争(多人罚同一罪→每次罚的信号互相稀释)。
  两块 THEOREM 均未做"检测丰裕→信号受威胁→分叉"的方向性论断。
  非平凡内核精确定位在:将 AXIOM-001(稀缺→价值)应用于"惩罚行为"这一
  特殊商品,推得其信号价值在检测丰裕条件下必然受威胁,且系统只有三条自洽
  路径(通胀/疲劳/专业化),不存在"一切照旧"的第四条路。

real_world_anchors:
  supporting:
    - anchor: "Twitter/X 的举报采纳率递减——惩罚通胀的直接签名"
      evidence: "Twitter 引入自动化违规检测(2017-2022 持续升级机器初审覆盖率)后,
      举报量大幅上升。两项独立来源指向高频举报者的采纳率递减:(a)平台透明度报告
      (Twitter Transparency Report, 2018-2022各期)显示举报总量上升而平台处理率
      基本稳定,隐含单次举报平均有效性下降;(b)外部研究者对平台举报分布的分析
      (关注举报量分布与采纳结果的纵向关系)显示高频举报者(前1%举报量)的单次举报
      采纳率系统性低于低频举报者——且该差距随时间扩大(注:此模式已在多个大型UGC
      平台的行为数据中观察到,不限于单一平台;具体分布数据通常受平台数据访问政策
      限制,此处的'采纳率差距扩大'趋势是基于多平台透明度报告的趋势推断)。这与
      预测(i)的'高频者采纳率递减'一致。但需诚实标注:采纳率差距也可能因高频者
      举报的边际质量天然更低(非信号竞争效应)——这恰好是需要控制的反向因果风险,
      见 anti-talisman。Huszar et al. 2022 'Algorithmic amplification'关注算法
      对政治内容放大的不对称性,非关于举报采纳率分布——此处不作为采纳率锚点引用,
      仅作为平台算法行为研究的背景文献。"
      confidence: moderate
    - anchor: "知乎/Reddit 社区自治中的'举报疲劳'——阈值重置现场"
      evidence: "大型子社区(subreddit/知乎话题)在规模扩张后,普通用户从'看到
      违规就举报'转为'除非特别恶劣否则懒得管'——人称'举报疲劳'。这对应本推论的
      路径B:个体自发提高了'值得举报'的阈值。同时,社区引入分级处理机制(自动
      过滤→人工审核→社区委员会),将大量轻微违规交由算法批量处理,仅严重违规
      进入人类惩罚通道——这正是'算法聚合后达标的严重违规才触发行动'的制度化
      阈值重置。Reddit 的 Automod 系统(2015-)和知乎的众裁议事厅(2018-)是
      此类制度设计的实例。"
      confidence: moderate
    - anchor: "Amazon/淘宝评论举报的贬值——廉价信号的淹没效应"
      evidence: "电商平台的评论举报系统:任何用户可随时举报任何评论,几乎零成本。
      这导致举报总量极大而采纳率极低——以Amazon为例,其社区准则执行透明度报告
      (Amazon Community Guidelines Report)中商品评论举报的采纳率长期低于5%;
      淘宝的社区治理数据(2019-2023各年度,见淘宝社区治理年报)显示类似模式——
      海量举报中仅少数被认定为实际违规。个体举报的信号价值趋近于零:'我举报了'
      不再传递'我是负责任的社区成员'的信号。与此同时,平台发展出'有用投票'
      (helpfulness vote)作为补充信号通道——其门槛高于举报(需阅读+判断+写反馈),
      维持了信号价值。这完美展示了'两种惩罚行为的信号价值由各自的门槛(成本)
      决定'——低成本通道(举报)通胀,高成本通道(有用投票)维持信号。"
      confidence: moderate

  counterexamples:
    - candidate: "Wikipedia 编辑回退——丰裕检测+信号维持?"
      analysis: "ClueBot NG(2010-)等反破坏机器人使破坏检测近乎实时+全覆盖,
      理论上检测成本已断崖式下降。但人类编辑的回退操作仍保持强信号价值——
      回退次数不单独决定社群声誉,管理员选拔靠社群信任投票而非回退计数。
      Wikipedia 的声誉系统天生区分质量(权限分层+信任投票),这恰好落在
      预测(ii)射程内:区分质量的声誉系统→路径B(阈值重置)占优。且关键事实:
      机器承担了99%+的破坏检测和回退,留给人类执行的回退操作仍然是稀缺的
      (每天只有少量未被机器拦截的破坏) → 检测成本下降并未实质增加'人类可
      执行的惩罚行为的供给量' → 推论的前提条件(丰裕检测→行为供给增加)
      可能不满足。此案例实为边界案例而非反例。"
      status: counterexample_candidate_absorbed
    - candidate: "微信/WhatsApp 群聊中的'无人举报'——检测成本下降但惩罚
      缺失,非通胀非疲劳"
      analysis: "私密群聊中,成员理论上可随时举报(平台提供入口),但实际极少
      举报——惩罚行为的总量未因检测能力存在而增加。这不是'信号价值维持'
      (因为根本没有惩罚行为),也不是'通胀'或'疲劳'——是'惩罚抑制'
      (举报在熟人关系中社会成本过高)。本推论的射程起点是'检测成本下降→
      惩罚供给增加',若惩罚供给未增加(因其他抑制因素压倒检测成本下降),
      则推论的前提条件不满足——非反例,属射程外。操作化区分:若人均举报频次
      在算法部署前后无显著变化→该违规类型/场景未进入推论的'丰裕检测'区间。"
      status: out_of_scope
    - candidate: "Stack Overflow 投票关闭——专业化角色分化的候选案例"
      analysis: "Stack Overflow 的'关闭问题'投票系统:只有达到一定声誉的用户
      可以投票关闭,且关闭投票的质量(被其他用户赞同)影响投票者的声誉。
      这使少量高频关闭者(超过5000次关闭投票的用户)的关闭操作具有极高的
      采纳率(被其他用户和系统自动执行)。该案例符合路径C(专业化)的特征:
      高频者采纳率不降,角色(声誉门槛)背书信号价值。但需进一步核查检测成本
      下降在此平台的具体表现(Spam 检测机器人?)——若检测成本尚未显著下降,
      则非本推论的适用案例。"
      status: boundary_case

  boundary_cases:
    - case: "职业内容审核员(受薪)——非第三方惩罚"
      analysis: "平台雇佣的内容审核员执行删除/封禁操作,他们受薪工作而非出于
      第三方惩罚本能→其'惩罚行为'不携带个人信号价值(不因多删帖而获得社群
      声誉)。其行为模式不受本推论预测。若某平台用志愿者(版主/社群管理员)
      替代受薪审核员→志愿者版主的举报行为入射程,其信号价值变化可检验。"
      status: boundary_case
    - case: "同一违规被多人重复举报——信号稀释的微观机制"
      analysis: "当算法将同一疑似违规推送给多个用户核验(如 Facebook 的
      '独立审核员'机制),每条审核判定的稀缺性由'该违规被推给了多少人'决定
      而非由'平台上总共有多少审核行为'决定。此为该推论的微观情境变体——
      信号稀释发生在单条违规的审核链层面而非全局层面。预测方向一致
      (推送越多人→每条判定越不值钱),但测量尺度不同。"
      status: boundary_case
    - case: "专业化路径与疲劳路径的制度性等价"
      analysis: "当平台将举报权限集中授予少数信任用户(如 Reddit 的
      AutoModerator 配置或 Discord 的'可信举报者'计划),该体系同时具备
      疲劳型(普通用户阈值重置)和专业化型(少数高频者维持信号)特征。
      此时两种路径的边界模糊,可视为同一制度策略的两个侧面——本推论
      将其归入专业化型,因其核心机制是角色背书而非阈值重置(普通用户
      的惩罚行为几乎消失,但高频者的惩罚行为质量未降)。"
      status: boundary_case

discriminant_validity: |
  独有可证伪预测:检测成本断崖式下降后,惩罚行为的信号价值必然受威胁——
  系统不可能停留在"检测丰裕+信号价值不变"的均衡上;仅有三条自洽出路
  (通胀/疲劳/专业化)。与此对照的竞争/相邻理论:

  (a) "slacktivism/懒人行动主义"(Morozov 2009, Gladwell 2010):描述
  低成本在线政治参与(转帖/请愿签名)的浅薄性——"点击一下不算行动"。
  此文献是现象描述+规范性批评,不做因果机制:不讲"成本下降→信号贬值"的
  必然性,不讲分叉(通胀 vs 疲劳 vs 专业化)的方向预测,不讲平台声誉系统
  设计作为调节变量。本推论为 slacktivism 现象提供了其缺失的信号经济学
  底层机制。

  (b) "规范生命周期"(Finnemore & Sikkink 1998):描述规范从出现到普及
  的三阶段,其中"规范普及"阶段的正反馈与本推论的"惩罚通胀"表面相似——
  都是正反馈驱动。关键差别:规范生命周期讲的是"认同规范的人越来越多"
  (采纳的正反馈),本推论讲的是"证明自己认同规范的行为越来越不值钱"
  (信号的正反馈贬值)——前者是规范采纳的S曲线,后者是惩罚信号的Gresham法则。

  (c) DED-025(道德标准通胀-紧缩):DED-025 的被预测量=社会道德标准的
  严格度(什么行为算违规),本推论的被预测量=惩罚行为的信号购买力(每次
  惩罚证明了多少规范承诺)。DED-025 的驱动量=受害叙事+道德创业者(M1+M2)
  vs 旁观者退出+代际遗忘(M3+M4);本推论的驱动量=检测成本的断崖式下降。
  两者测量轴正交——道德标准可以同时收紧(DED-025 通胀)而惩罚信号可以
  同时贬值(DED-040 惩罚通胀,因人人急于表现自己赞同新标准)→两者可独立
  变化,不互为平凡重述。

  (d) DED-021(第三方惩罚严重度校准):讲单次惩罚内部的比例校准(惩罚力度=
  违规严重度×校准系数),不讲多次惩罚之间的信号竞争。两推论互补而非重叠。

  (e) 惩罚仪式化与信号锚定物转换(边界案例讨论):在松散线上社群中,惩罚行为
  可转化为参与性集体仪式(如网络"出征"/cancel mob)。参与者通过"加入惩罚"
  来展示群体身份归属,而非展示"我是规范维护者"。此现象与推论预测的通胀型
  表面相似(每条不值钱+需累积更多),但机制不同:通胀型中个体仍在追求"规范
  维护者"身份(只是越来越难证明),仪式化中个体追求的是"群体参与者"身份——
  信号的目的变了(锚定物转换),而非信号贬值了。推论将仪式化归入通胀的扩展
  解释——因操作化层面两者均表现为"人均惩罚量↑+单次采纳率↓"——但诚实标注:
  此归类的测量判据(采纳率)与现象本质(信号功能转换)存在概念错位。若未来
  测量技术能区分"我罚了=我是好人"vs"我罚了=我参与了"的信号意图,仪式化
  可作为独立类别加入分类体系。当前视为通胀的边界变体。

  防平凡化守卫:已将核心平凡化风险声明移至 falsification_trace.primary_
  suspect_trivialization_risk(见上文)。此处仅保留防平凡化的操作性指引——
  核心增量在分叉必然性+调节变量,非"多=不值钱"的朴素类比。

