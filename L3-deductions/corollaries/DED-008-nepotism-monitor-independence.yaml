id: DED-008
type: deduction
layer: L3-deductions
status: verified

term: "裙带侵蚀与监督者独立性推论 (Nepotism Erosion & Monitor-Independence Corollary)"

人话摘要: "血缘越近越愿意偏帮(那是本能,不是坏)。可一个'非人格化制度'的价值,恰恰在于【不看你是谁、一视同仁】地分配稀缺资源。把一份'我说了算'的分配权,交给一个身边有亲戚要照顾的人——偏帮亲戚对他是划算的,于是'一视同仁'不会自己守住,会慢慢滑向任人唯亲。推论:一个制度想长期保持公正,靠的【不是】人品好、也【不是】纸面规矩严,而是有一个【分享不到这份偏私好处】的监督者盯着。做到这一点有三条路:(A)把监督者从亲缘网切出去——科举回避、异地调任、招没有本地亲族的人(奥斯曼德夫希尔梅);(B)让一个靠【揭露偏私】得利、而非分赃的非亲戚来盯——独立法院、自由媒体、选票、竞争对手、职业声誉市场;(C)亲缘网【里面】但【利益相反】的人互相盯——比如共有牧场里各家都想多占,谁也不许谁多占,横向互相监督(阿尔卑斯共有草场、水利分水这类几百年的自治公地)。三条路的共同点【不是】'在不在亲缘网外',而是【监督者分享不到这份偏私好处】。关键预测:'A、B、C 三条全无、又没有任何别的外部制衡、制度却长期保持公正'这一格,基本是【空】的。而且可逆:官职一旦变成能世袭、能本地化的私产,监督者被吸回亲缘网、外部问责又被架空、横向制衡也没了,裙带就回来。驱动的是'有没有一个分享不到偏私的监督者',不是好人坏人、也不是规矩严不严。"

statement: |
  亲缘利他使"偏私亲属"带有正收益(BR-L2-002:利他强度随亲缘系数上升);非人格化制度
  的价值在于【一视同仁地按非人格化规则配置稀缺资源】、以替代人际信任(BR-L2-010 +
  AXIOM-001)。据此:

  【核心】当一个宣称一视同仁的非人格化制度,把【分配裁量权】交给一个【嵌入亲缘网】的
    Agent(其受益池中有其亲属)时,"偏私亲属"对该 Agent 是个体理性的(含亲缘收益 rB),
    故【一视同仁不自我执行】;除非存在一个【分享不到"向该受益池偏私"收益】的监督/纠偏方
    (下称"独立监督者"),否则配置会系统性地滑向任人唯亲(裙带)。若监督者【会一同分享】
    该偏私收益(与被监督者共享同一亲缘受益偏好),同一偏私梯度也俘获监督者,纠偏失效
    (俘获只上移一层)。

  【伞级判据与三条实现路径(round-2 修订:species 按"是否分享偏私收益"定义,非按"亲缘
   网内外";使枚举穷尽、"总是"为真)】独立监督者的界定判据是【监督者不分享向同一受益池
   偏私的收益】。达成它有三个 species:
    (A) 亲缘切断:监督/执行者结构上【不在】被监督者亲缘网内(本籍/亲属回避、轮调、无本地
        亲族招募、非人格化考选)。适用于把监督者从亲缘网【移出】。
    (B) 非亲缘反向问责:监督者【收益来自揭露/惩罚偏私(激励反向对齐),故不分享该偏私收益】,
        通常为亲缘外一方(独立司法、自由媒体、选票/政治问责、竞争对手、制度化职业声誉市场)。
        适用于流动/匿名社会。
    (C) 亲缘内竞争性横向监督:监督者【在】亲缘网内,但是【利益相反的竞争性索取者】,该官员
        亲属多占则监督者自家少得,故其不分享该偏私收益(敌对支系互盯、Ostrom 式自治公地的
        分布式同侪监督 + 梯度惩罚)。适用于亲缘密集、A 无法实施、B(外部问责)缺席的小共同体。
    三者共同的结构性质=【不分享该偏私收益】;A/B/C 只是达成它的不同着法。这是被预测量的驱动。

  【驱动量】驱动侵蚀有无的是【是否存在一个"分享不到偏私收益"的监督者(A 或 B 或 C)】——
    一个【可事前、独立于结果测量】的结构量;【不是】个体道德品质,【也不是】纸面规则的
    严格程度。故预测:好人 + 严规,只要无此类独立监督者,照样侵蚀;反之只要有(A/B/C 任一),
    即便个体平庸、规则简陋,也能守住公正。

  【预测】
    (i)   把分配裁量权交给嵌入亲缘网的 Agent、且【无】任何独立监督者(A/B/C)的非人格化
          制度,可预测地转为裙带/庇护——【即便纸面规则要求一视同仁、即便经手人并非"坏人"】。
    (ii)  能长期稳住公正的制度,【在裁量权被保留、亲缘嵌入非零】的前提下,其修复手段在结构上
          【总是】落到"设立一个不分享偏私收益的监督者"——亲缘切断(A)、非亲缘反向问责(B)、或
          亲缘内竞争性横向监督(C)——【而非】仅仅"把规则写得更严"或"换更廉洁的人"。("总是"由
          伞级判据【监督者非享即享偏私收益】的二值穷尽保证;A/B/C 只是其例示,非靠枚举穷尽。)
          【scope 澄清(round-3)】另有一类杠杆是【消去前件】而非设监督者:以抽签/刚性公式取消
          裁量、或以无亲族录用(德夫希尔梅)把亲缘嵌入降到零——维持公正却不设监督者,落在核心
          条件式【前件之外】,与(ii)不冲突、非活反例。
    (iii) 招牌预测(可逆/单调):提高监督者的独立度(A/B/C 任一增强) ⇒ 公正可恢复;监督者
          被吸回本地亲缘网(世袭化/本地化/捐纳)【且】外部问责与横向制衡皆失 ⇒ 侵蚀回归。
          同一制度,两个方向。且【单调】:裁量者亲缘嵌入越深、独立监督越弱,侵蚀越重
          (与 BR-L2-002 的连续亲缘梯度对齐,非二分)。

  【与现有理论的判别】本推论不等同于"腐败=法治弱/道德差"或韦伯"家产制 vs 法理型科层"
    的【描述】,也不满足于委托-代理的一般"需问责"套话。其【可证伪的独有内容】收敛为:
    (1) 失败渠道是【亲缘利他这一非道德梯度】(BR-L2-002)——故预测【好人 + 严规,无独立
        监督者仍侵蚀】,且把非亲缘偏私(党派/门客/行贿)划出射程(委托-代理不这么切);
    (2) 【可逆 + 单调】的定量方向预测;
    (3) 修复的普适结构签名=【监督者不分享偏私收益】这一伞级判据,A/B/C 为其 species。
    诚实降级(round-1/2 审查后):【不再】主张"亲缘独立唯一、而非职业声誉";驱动量收敛为
    "结构性独立监督(不分享偏私收益)胜过道德 + 纸面规则"。

# === 规则 A：操作化定义 ===

operationalization:
  kin_embeddedness_of_discretion:
    definition: "分配裁量权持有者与其【合格候选池】之间的亲缘网络重叠度——【合格候选池】中落入该 Agent 亲缘网(世系/宗族/姻亲/同乡同族)的比重与亲近度。"
    measurement: |
      谱牒学/人物志 + 制度的【合格候选/管辖对象】名册:统计裁量者所辖合格候选中与其有
      可追溯亲缘/姻亲/同族纽带者的占比与亲缘系数。
      【round-1 finding 3:必须用"合格候选池"分母,不得用"实际获授者"分母】——后者把结果
      混入自变量。【round-2 残留 minor:"合格"若由裁量者自定则有内生弹性,须用制度成文的
      资格线(如考选功名/年资)锚定"合格",不由裁量者临时圈定。】
    limitations: "亲缘边界连续(r 随距离衰减,继承 BR-L2-002),不钉硬阈值;拟制亲缘按可追溯纽带紧密度排序。"

  monitor_independence:
    definition: |
      【伞级判据(round-2 修订:按收益共享定义,与 species 对齐)】对'是否一视同仁'施加纠偏
      的那一方,是否处于【分享不到"向被监督者亲缘受益池偏私"收益】的结构位置。三条实现:
      (A) 亲缘切断——监督者与被监督者不共享亲缘纽带;
      (B) 非亲缘反向问责——监督者收益来自揭露/惩罚偏私(激励反向对齐,故不分享该偏私收益),通常为亲缘外一方;
      (C) 亲缘内竞争性横向监督——监督者在亲缘网内但为利益相反的竞争性索取者(该官员亲属
          多占则监督者自家少得),故仍不分享该偏私收益。
    measurement: |
      【结构测,承重且须防循环】
      A:谱牒 + 法典/章程中回避/锁院/轮调/无本地亲族招募规则(存在与否独立于配置结果)。
      B:监督方与被监督方无亲缘纽带 + 【制度化反向问责基础设施】的存在与强度——司法独立性、
        新闻自由、竞争性选举、【制度化职业声誉市场(执照/惩戒机构/公开绩效档案/声誉定价的
        人才流动)】。这条基础设施可由制度事实/指数独立测。
        【round-2 should:区分 species B 与"纯个人前程顾虑"】声誉要计入 B,须有上述【制度化
        声誉基础设施】;若仅裁量者【私下个人前程顾虑】而无任何制度化声誉载体,则不算 B——
        且若这种纯个人顾虑单独即能持久守住一视同仁,构成对本推论的证伪(见 primary_suspect)。
      C:被监督者亲缘网内存在【有立场、有惩罚能力的竞争性索取者】对同一稀缺资源(敌对支系、
        同侪共有者),其配置份额与该官员亲属份额【此消彼长】——由资源产权结构/共有关系/
        惩罚机制(Ostrom 设计原则:分级制裁、冲突解决场)的成文或惯例事实独立测。
      【连续量】独立度是程度:预测侵蚀随"裁量者亲缘嵌入 ÷ 独立监督强度(A/B/C 合力)"单调上升。
    limitations: |
      【硬约束】必须【结构测】(亲缘纽带 / 成文回避 / 制度化反向问责基础设施 / 竞争性索取者
      的产权与惩罚结构),【不得】用【功能反推】("有没有抓到违规""结果公不公正")定义独立与否
      ——否则与被预测量循环(DED-004 死病)。尤其【不得】遇到"A/B/C 皆无却公正"的反例,就
      事后硬塞一个非正式"同侪监督"当 C 来消化——C 的在场须由【独立的产权/竞争性索取者结构
      事实】坐实。高阶俘获("谁监督监督者")是另一较弱通道,本推论只主张【一阶】独立监督者的
      可测结构。

  impartiality_outcome:
    definition: "【被预测量】该制度的实际配置在多大程度上按非人格化规则/绩效执行 vs 按裁量者的亲缘偏私。取一段时期的主导模式。"
    measurement: "配置结果控制绩效/规则后的【亲缘】偏斜:同等资格下裁量者亲属获职位/资源/裁决的相对概率是否系统性偏高;违规是否被纠。史料/档案/任免与考绩记录。与上两个结构量分开测。"
    limitations: "'公正'是程度非二分;混合态按主导成分标注并注明分布。"

# === 推导链 ===

derivation:
  from_l1:
    axioms: [AXIOM-001]
    theorems: [THEOREM-relation-information-asset, THEOREM-norm-energy-saver]
  from_l2:
    bridging: [BR-L2-002, BR-L2-010]

  steps: |
    1. "稀缺配置需一视同仁(BR-L2-010 + AXIOM-001)"
       稀缺资源配置本是竞争焦点(AXIOM-001);非人格化制度的价值在【按非人格化规则一视同仁
       配置】以替代人际信任(BR-L2-010)。【诚实钉清 finding 1】BR-L2-010 在此贡献偏【近定义】;
       真发动机是 BR-L2-002 被【递归施加】于"裁量者→监督者",外加经验命题"无独立监督时
       亲缘偏私梯度占主导"。非平凡性由后二者承载。

    2. "亲缘利他给'偏私亲属'正收益(BR-L2-002)"
       对嵌入亲缘网、受益池含亲属的裁量者,偏私亲属带亲缘收益(rB) ⇒ 偏离一视同仁是
       【个体理性的常态梯度】,非恶意例外。

    3. "一视同仁不自我执行"
       裁量者有自由裁量且受益池含亲属 ⇒ 一视同仁缺自执行力,边际上偏私梯度胜出,漂向裙带。
       除非有外部纠偏。

    4. "需一个不分享偏私收益的监督者(A/B/C 任一)"
       外部纠偏有效,当且仅当监督者【不分享向同一受益池偏私的收益】。达成有三 species:
       A 亲缘切断 / B 非亲缘反向问责 / C 亲缘内竞争性索取者横向监督。若监督者会一同分赃
       (共享该偏私偏好且无 A/B/C),step-2 梯度俘获监督者,纠偏失效。
       【非平凡性(逐格判空)】BR-L2-002 单独只给"人偏私血亲";BR-L2-010 单独只给"制度需
       一视同仁 + 能替信任";二者【都不】给出"长期公正 ⟺ 存在不分享偏私收益的监督者"这一
       联合结构,不给出"A/B/C 皆无却公正"这一【预测为空】的格。唯合成给出。驱动量被钉为
       【结构性独立监督的有无】(事前可测),非道德/规则严格度 ⇒ 反直觉预测(好人+严规,
       无独立监督仍烂)。故非平凡、非砖内结论、非同义反复。

    5. "合成 + 可逆 + 驱动量归因"
       长期公正的非人格化制度 ⟺ 存在不分享偏私收益的监督者(A/B/C);其独立度升则公正可
       恢复,监督者被吸回本地亲缘网(世袭/本地化/捐纳)且 B、C 皆失则侵蚀回归(可逆);
       侵蚀随"亲缘嵌入 ÷ 独立监督强度"单调上升。驱动量=结构性独立监督,非道德、非纸面规则。

# === 可证伪性 ===

falsifiability: |
  本推论可被以下发现证伪：
  (a) 一个宣称一视同仁的非人格化制度,其【A、B、C 三条独立监督路径全部缺席】——监督者与
      被监督者共享偏私收益、无制度化反向问责基础设施、亦无利益相反的竞争性索取者横向制衡
      ——却【长期保持按亲缘的公正配置】。⇒ 证伪核心(命中'无独立监督却公正'的空格)。
      注:声誉/司法/媒体(B)或敌对支系互盯(C)在场解释了公正,【正是】本推论所预测,不算(a)。
      (a) 要求 A、B、C 三者【俱无】仍公正。
      【round-2 should:诚实标注适用区间】species B 是连续量,现代政体几乎都有非零司法/媒体/
      选举,故"A/B/C 俱无"这一格的干净实例主要落在【低-B 区间】(前现代 / 专制且监督被俘获);
      现代高-B 政体主要经 (b)/(iii) 检验,不指望 (a) 有现代实例。此声明防止 (a) 静默地变成
      "现代无实例故不可满足"。
  (b) 裙带侵蚀的有无与"是否存在独立监督者(A/B/C)"【无】系统关联,只随个体道德或纸面规则
      严格度走。⇒ 证伪"驱动量=结构性独立监督而非道德/规则"。
  (c) 修复裙带的持久手段被发现【系统性地不】走"设立不分享偏私收益的监督者"(A/B/C),而是
      仅靠"加严规则/道德教化"即可持久稳住。⇒ 证伪(ii)。

falsification_trace:
  primary_suspect: |
    招牌预测('无独立监督却公正'为空 + 修复签名=独立监督)最先压在这条腿:亲缘利他收益
    (BR-L2-002)是否【强到】在【A、B、C 俱缺】时盖过裁量者其余自利/守规诱因,以致一视同仁
    不自执行。【round-1/2 锋利化】关键切分:"制度化 species B 声誉市场在场"(属预测)vs
    "纯个人前程顾虑、无任何制度化声誉载体"(若后者单独即持久守公正,则证伪)。二者由
    monitor_independence.measurement 的【制度化声誉基础设施】结构测切分,不含糊。最先受检。
  secondary_suspect: "kin_embeddedness 分母须用制度成文的'合格候选池',不由裁量者临时圈定(round-2 minor);及 species C 的在场须由独立产权/竞争性索取者结构事实坐实,不由结果反塞。"
  unlikely_suspect: "BR-L2-002(亲缘利他随 r 上升)本身——演化最坚实结论之一,极少是根源。"
  note: |
    刻意规避 DED-004 死病:kin_embeddedness 与 monitor_independence 是【结构可测的事前量】,
    impartiality_outcome 是被预测量,三者不互为定义;A/B/C 皆由独立结构事实坐实,不由
    "侵蚀是否发生"反推(见 anti_talisman_clause)。

# === 排除的结果 ===

excluded_outcomes:
  - outcome: "非亲缘的偏私(党派/同乡帮派/贿赂/意识形态/裙带外庇护)侵蚀制度"
    description: |
      若侵蚀由【非亲缘】渠道驱动,其驱动砖不是 BR-L2-002,【不在射程】,既不支持也不证伪。
      判定前须【独立确认偏私沿亲缘渠道】(受益者与裁量者有可追溯亲缘纽带)。此钩子按
      【偏私渠道=亲缘 vs 非亲缘】划分,可事前测,独立于结果。
  - outcome: "存在独立监督者(A/B/C),制度却仍因【亲缘】长期侵蚀"
    description: "若一个不分享偏私收益的监督者仍压不住亲缘俘获,核心被削弱(命中 falsifiability(a) 的对称形式)。"
  - outcome: "明面上以亲缘为组织原则的机构(家族企业/王朝/义庄/部落议事会)'被亲缘侵蚀'"
    description: |
      不适用:它们【明面按亲缘配置】、不主张一视同仁,'偏私亲属'是其明示原则而非违规,非反例。
      【round-2 界定】须与 species C 的自治公地区分:宗族义庄【明面按亲缘】配 ⇒ 出 scope;
      Ostrom 式共有公地【明面按规则(轮值/按份/抽签)在成员间配】、把"某支偏袒本支"当要压制的
      裙带 ⇒ 【在 scope 内】,且其横向同侪监督正是 species C 的支持,非 excluded。

anti_talisman_clause: |
  【防不可证伪护身符 — 诚实硬约束】判定"是否存在独立监督者"时,必须【结构测】A/B/C 各自的
  制度事实(亲缘纽带 / 成文回避 / 制度化反向问责基础设施 / 竞争性索取者的产权与惩罚结构),
  并【独立于结果(是否发生侵蚀)】;不得因"发生了裙带"就倒推"必无独立监督者",也不得因
  "长期公正"就倒推"必有独立监督者"。【round-2 强化】尤其不得遇到"A/B/C 皆无却公正"的反例,
  就事后硬塞一个非正式"同侪监督"当 C 消化——C 的在场须由独立的产权/竞争性索取者结构事实
  坐实。"偏私非亲缘故不算数"这类排除,须由偏私渠道的独立测量支撑,不得纯由结果反推。
  否则本推论沦为不可证伪循环(DED-004 病根)。

# === 现实锚点 ===

