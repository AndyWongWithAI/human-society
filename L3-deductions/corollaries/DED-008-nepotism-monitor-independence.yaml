# === 判别效度 ===

discriminant_validity: |
  与韦伯(家产制 vs 法理型科层)、"腐败=法治弱/道德差"、委托-代理 高度共鸣,但本推论的
  【独有可证伪预测】收敛为:
    (1) 失败渠道 = 亲缘利他这一【非道德梯度】(BR-L2-002),故预测【好人 + 严规,无独立监督
        者仍侵蚀】,且非亲缘偏私被划出射程(委托-代理不这么切);
    (2) 【可逆 + 单调】的定量方向预测;
    (3) 修复的普适结构签名 = 伞级判据【监督者不分享偏私收益】(A/B/C 为其 species)。

  【防平凡化守卫(round-2 重述:抗稀释权重压①③,②降调)】有人会说"你上位到'需外部监督',
  岂不退回委托-代理常识?"——非平凡内核【不在】"要有监督/问责"(那确在委托-代理射程),
  而在委托-代理【不含】的两点:①俘获渠道被钉为亲缘利他这一演化-非道德梯度(故"好人也烂"
  是【预测】而非道德判断,且非亲缘偏私被排除出射程);③可逆单调的定量方向。至于"A/B/C 同
  为一个杠杆的 species"这一【统一】(原 round-1 的卖点②),round-2 审查指出:一个成熟委托-
  代理论者也能把回避制/自由媒体/同侪监督都归为"降低代理人偏离的问责装置",故"分成几个
  species"本身【不是】非平凡卖点;真正非平凡的是伞级判据本身 + ①③。故②降为"组织性说明"
  ,不再充当抗稀释主力。诚实:新意在①③ + 伞级判据,不在"需要监督"。

  【与 DED-006 的关系(自我审查)】共享【结构母题】:自我执行失败 ⇒ 外化给独立第三方。但
  域/砖/被预测量均不同:DED-006='交换突破信任半径 ⇒ 外化给非人格化制度'(BR-L2-009/010,
  被预测量=外化程度);本推论='亲缘嵌入下配置的一视同仁不自执行 ⇒ 外化给不分享偏私收益的
  监督者'(BR-L2-002/010,被预测量=公正维持 vs 裙带侵蚀),且给出'无独立监督却公正为空'
  这一 DED-006 没有的空格与 A/B/C 伞级判据。共享母题是体系发现的【复现结构】,非循环复述。

# === 对抗式审查 (Rule B) ===

