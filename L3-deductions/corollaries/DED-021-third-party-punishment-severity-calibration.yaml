id: DED-021
type: deduction
layer: L3-deductions
status: verified
term: "第三方惩罚严重度校准 (Third-Party Punishment Severity Calibration)"

人话摘要: "不光是'坏人该罚'——罚多重还得跟干了多大坏事配得上。而且罚太重或太轻,罚人的人自己会被人戳脊梁骨——'惩戒者也得守公道'。第三方惩罚不是乱来的,是自带秤砣的。"

statement: |
  【核心】第三方惩罚不仅是'罚不罚'的二元决定——惩罚力度系统性地追踪违规严重度：危害越大,旁观者愿付的惩罚成本越高。而且,'罚得跟罪不配'本身被感知为新的不公——过度惩罚引来对惩罚者的反惩罚,不足惩罚引来对惩罚者'纵容帮凶'的声誉惩罚。第三方惩罚不是任意的道德冲动——它是校准了的、有内在比例逻辑的社会执行机制。

  【驱动量】违规严重度(可事前测：伤害大小/资源损失/权利侵犯程度,独立于惩罚力度)；惩罚严重度(旁观者愿付的惩罚成本大小,独立于违规严重度评级)；惩罚-违规匹配偏差(ratio = 惩罚严重度 / 违规严重度,ratio≈1=匹配,ratio>1=过度,ratio<1=不足)。

  【预测】
  (i) [经验来源:BR-L2-016] 在无中心权威的群体中,第三方惩罚的力度与违规严重度正相关——严重伤害引来的惩罚(排斥/罚物/暴力)系统性重于轻微违规。此关联的实验室证据由 BR-L2-016 建立(Fehr & Fischbacher 2004:第三方惩罚博弈中罚金与剥削比例正相关,BR-L2-016 的 behavioral_economics source 和 falsifiability 条件已覆盖此经验内容)。本条的独立增量是:(a)将此关联操作化为 violation_severity/punishment_severity 双轴独立编码的 ratio 定量框架,(b)锁定'第三方是比例跟踪的主力执行者'这一更强比较性主张,(c)推向田野可证伪验证。此预测的经验所有权属于 BR-L2-016,本条主张 ratio 操作化+主力执行者定位+田野验证的优先权。
  (ii) 第三方惩罚过度(远超标定严重度)本身会触发来自其他旁观者的反惩罚或声誉惩罚——'罚太重变成欺负人'；第三方惩罚不足(远低于标定严重度)触发旁观者对惩罚者的声誉惩罚——'纵容帮凶'。
  (iii) 逐格判空：'无中心权威+第三方惩罚力度与违规严重度零相关或负相关+该群体跨代稳定'这一格预测为空。

  【判别】
  与DED-015(比例惩罚演化稳态)判别：DED-015的焦点在'被惩罚者一端——哪种策略稳定',本条的焦点在'惩罚者一端——第三方如何操作化比例跟踪'。DED-015的结论是比例惩罚是稳态,本条的结论是第三方惩罚是达成此稳态的具体执行机制——前者讲'结果',后者讲'过程'。二者不共享被预测量,但存在风险：本条可能是DED-015+BR-L2-014的平凡组合。防平凡化守卫见discriminant_validity。

operationalization:
  violation_severity:
    definition: "违规行为造成的客观危害大小,按三个正交维度评定——物理伤害(致死/致残/受伤/无)、资源损失(金额/财物占受害者财产比例)、权利侵犯(自由限制/财产剥夺/身体自主侵犯),各维度独立评分后等权合成综合严重度。"
    measurement: "由独立编码者根据违规行为描述评定,不参考惩罚回应。编码protocol：物理维度按最严重伤害等级评分(0-4,无→致死),资源维度按损失占受害者财产比例评分(0-4,无损失→全部),权利维度按侵犯类型评分(0-4,无侵犯→人身剥夺),等权合成。跨文化校验用文化内相对排序(同一文化内'杀人'比'偷鸡'严重)作为辅助参照——但文化内感知严重度不覆盖三维客观轴评分。分歧裁决规则(堵文化校准后门):当三维客观轴综合评分与文化内感知严重度出现实质性分歧时(如荣誉文化中侮辱:客观轴≈0但文化内评为极严重),以客观轴评分为主——ratio按客观轴计算,且该案例被标注为'跨文化测量分歧',不单独用于支持或反对理论;分歧案例的比例必须透明报告。文化内感知严重度数据须从事前独立来源收集(民族志访谈/问卷,不与惩罚行为共享数据源),不得因表面ratio失配而事后援引文化校准来消化反例。此规则堵死'事后援引文化校准吸收反例'的活门,保障 anti-talisman 防线和 falsifiability 实战窗口。"
    limitations: "严重度评定的文化敏感度——同一行为在不同文化中被感知的严重度不同(如通奸在荣誉文化中评更高)。测量时须先确认该文化内对该类违规的严重度共识存在(若无共识则violation_severity不可操作化),优先选择跨文化公认的伤害等级(杀>伤>偷>辱)。"
  punishment_severity:
    definition: "第三方为惩罚违规者付出的个人代价大小。操作化范围含直接惩罚(暴力报复/罚物/放逐)和社会制裁(公开羞辱/gossip/排斥/抵制),后者在紧密小群体中是非常真实的惩罚(声誉毁坏→合作机会丧失→生存风险)。"
    measurement: "由独立编码者评定第三方施加的惩罚成本等级,不参考违规严重度。编码protocol：按施加成本类型×强度评分——暴力(0-4,从无到致死)、经济(0-4,从无到全部财产)、社会(0-4,从无视到放逐),等权合成。若多个第三方分别惩罚同一违规,取总和惩罚成本。"
    limitations: "社会制裁(gossip/排斥)的成本量化困难——其实际伤害取决于群体紧密性和受罚者对外部替代的依赖。在松散群体中同等排斥的实际成本更低,须控制群体紧密度变量。"
  punishment_violation_ratio:
    definition: "punishment_severity / violation_severity。ratio≈1=匹配,ratio>1=过度惩罚,ratio<1=不足惩罚(含ratio=0,即零惩罚)。"
    measurement: "两个独立评分轴的比值计算,两轴不共享评分条目,确保测量正交。容差带暂定 provisional ±0.3(ratio∈[0.7,1.3]为'匹配'),理由同DED-015——跨文化公平感知实验中人们容忍约±30%的不公平而不触发惩罚反应(Henrich et al. 2005)。重要假设诚实标注:Henrich et al. 2005 的±30%容忍带来自分配公平实验(资源分配博弈中的不公平容忍度),其推广至'惩罚失配容忍带'(人们对惩罚与罪行不匹配的容忍度)是未经验证的跨领域迁移假设——惩罚失配的容忍带可能与分配不公的容忍带不同(人们对'罚错'比'分错'可能更敏感或更不敏感),待独立实验标定。此参数预注册后不得事后调参消化边界反例。"
    limitations: "跨文化严重度量表差异,须用文化内基准校准；连续量的分档阈值 provisional,同DED-015 limitations。"
  counter_punishment_to_punisher:
    definition: "其他旁观者对惩罚者的惩罚或声誉贬损,作为对惩罚者'罚得不配'的回应。"
    measurement: "独立编码：观测惩罚者施加惩罚后,其他群体成员是否对其发起新的惩罚/排斥/声誉贬损,且该反应可由惩罚偏差(ratio偏离1)预测而非由其他变量(个人恩怨/地位竞争)解释。判定须独立于ratio值——不得因'有人反罚惩罚者'反推'惩罚必是过度的'。须排除因既有派系忠诚驱动的反惩罚(与校准性反惩罚不同机制)。"
    limitations: "区分'对惩罚者的反惩罚是因惩罚过度'(校准性反惩罚)与'对惩罚者的反惩罚是因违规者是反罚者的盟友'(派系性反惩罚)——后者不校准惩罚力度而是另起冲突线。"

derivation:
  from_l1:
    axioms: [AXIOM-001, AXIOM-003]
    theorems: [THEOREM-conflict-cost, THEOREM-competition-norm, THEOREM-cooperation-precondition]
  from_l2:
    bridging: [BR-L2-014, BR-L2-016, BR-L2-013]
  steps: |
    1. "第三方惩罚是规范执行机制——但光有'罚'不够,还得'罚得对'"
       BR-L2-014 建立：在无中心权威的群体中,非受害第三方愿付个人代价惩罚违规者——
       这是公平规范得以执行的机制基础。但它只说了'罚不罚',没说'罚多少'。
       若第三方惩罚是无差别的一视同仁(偷只鸡和杀人一样重,或反过来轻微冒犯不罚、
       重罪也不罚),则惩罚信号不携带严重度信息——违规者不知道'轻罪 vs 重罪'的
       代价差,规范内部的分级结构无法通过惩罚传递,规范的精细度退化。

    2. "比例直觉为第三方惩罚提供校准标尺"
       BR-L2-016 建立：人类跨文化地持有'惩罚应与违规成比例'的直觉——该直觉不是
       特定文化灌输,而是认知禀赋。这个直觉指导第三方惩罚的操作：当第三方决定
       '罚多少'时,比例直觉提供校准标尺——违规越严重,直觉要求的惩罚越重。
       关键:BR-L2-016 的 behavioral_economics source(Fehr & Fischbacher 2004)已在实验室中
       观测到第三方惩罚力度追踪违规严重度——其经验内容已覆盖此关联。本步的增量不是
       '发现关联',而是:(a)将此关联操作化为双轴独立编码的 ratio 框架,(b)将 BR-L2-016 的
       一般命题升级为'第三方是比例跟踪的主力执行者'的比较性主张,(c)将实验室发现推向
       田野可证伪验证。

    3. "不公厌恶闭合校准循环——惩罚失配本身引发新的惩罚"
       BR-L2-013 建立：人对不公平分配持续表现出负面反应——不仅排斥自己吃亏,也
       排斥不成比例的对待。将此机制应用于惩罚场景：当第三方惩罚严重偏离违规严重度
       (过度或不足),这种'惩罚不配'本身被感知为新的不公平事件——
       (a) 过度惩罚：惩罚者给违规者施加了远超标定的伤害 → 旁观者(包括其他第三方)
       感知到惩罚者对违规者的'不公'→ BR-L2-013 的不公厌恶触发 → 旁观者对惩罚者
       发起反惩罚或声誉惩罚('罚太重变成欺负人')；
       (b) 不足惩罚：违规者仅受轻罚 → 旁观者感知到惩罚者'容许不公'或'纵容帮凶'
       → BR-L2-013 不公厌恶触发 → 旁观者对惩罚者施加声誉惩罚(贴'靠不住/偏心/
       帮凶'标签)或直接惩罚。
       这一循环闭合了校准：失配惩罚不仅'对社会不好'(长远伤规范),更重要的是它
       '当场对惩罚者不好'(立即招来反制)——惩罚者有个人利益动机去校准惩罚力度,
       而非仅靠公益心。

    4. "非平凡性——逐格判空"
       2×3 判据表A(第三方惩罚-违规匹配偏差:{过度,不足,匹配} × 群体对该惩罚的
       反应:{接受,反惩罚惩罚者})。
       空格A1='过度→接受(无反惩罚)'——预测为空,BR-L2-013 不公厌恶预测过度惩罚
       触发对惩罚者的反惩罚。
       空格A2='匹配→反惩罚惩罚者'——预测为空,匹配惩罚不触发不公厌恶。
       非空格='过度→反惩罚惩罚者'、'不足→反惩罚惩罚者'(不公厌恶驱动)、
       '匹配→接受'(不触发不公厌恶)。
       2×2 判据表B(自变量：第三方惩罚与违规严重度的相关{正相关,零或负相关} ×
       被预测量：该群体跨代稳定{是,否})。
       空格B='零或负相关→跨代稳定'——预测为空。若第三方惩罚不携带违规严重度
       信息,规范的分级结构无法通过惩罚传递,群体在该状态下不能跨代维持共享规范。
       关键：三个空格均可被现实反例填上,故非定义性真理——若找到过度惩罚但不触发
       反惩罚的稳定群体,或找到第三方惩罚不跟踪严重度但跨代稳定的群体,推论证伪。

falsifiability: |
  本推论可被以下发现证伪：
  (a) 发现在无中心权威的群体中,第三方惩罚力度与违规严重度之间零相关或负相关——
  即轻微冒犯和严重伤害引发的第三方惩罚力度无差异甚至相反——且该群体跨代稳定。
  (b) 发现在无中心权威的群体中,显著的过度第三方惩罚(ratio 持续>1.3)不引发其他
  旁观者的反惩罚或声誉惩罚——即"罚太重"被群体接受、不伤及惩罚者的地位或合作机会。
  (c) 发现在无中心权威的群体中,显著的不足第三方惩罚(ratio 持续<0.7)不引发旁观者
  对惩罚者的声誉惩罚——即"纵容违规"不被视为声誉污点。
  适用区间：有中心惩罚权威(国家法院/专门执法者)的惩罚校准不在射程内(校准由
  制度而非分散第三方执行)；一次性交互无重复观测的惩罚场景不在射程内(无未来之
  影约束,惩罚者的声誉风险不构成真实成本)。

falsification_trace:
  primary_suspect: "第三方惩罚的严重度校准本身——即预测(i)：在真实群体中第三方惩罚力度是否真的跟踪违规严重度。实验室证据扎实(Fehr & Fischbacher 2004：第三方罚金与剥削比例正相关),但田野证据以惩罚存在性为主(BR-L2-014 的 Boehm/Wiessner 锚),对'惩罚力度是否按严重度分级'的直接田野测量较薄。若第三方惩罚在自然条件下主要受'惩罚者与违规者的个人关系'或'群体政治'驱动而非违规严重度,则校准主张被削弱——惩罚尽管存在,但不携带比例信息。"
  secondary_suspect: "反惩罚循环——预测(ii)：过度惩罚触发反惩罚。BR-L2-013 不公厌恶的实验证据针对'资源分配不公平',其推广到'惩罚本身作为不公平事件'的桥接需要独立检验——过度惩罚是否真的被感知为'对违规者的不公'(这与'违规者活该'的报应心态存在张力)。若旁观者区别对待'分配不公'与'惩罚不公'(认为后者是正当的),则反惩罚循环不闭合。"
  unlikely_suspect: "BR-L2-014(第三方惩罚存在)和 BR-L2-016(比例直觉存在)——极少是问题根源。反例更可能削弱'校准'和'反惩罚循环'这两条腿,而非基础桥接砖。"
  note: "本推论的 primary_suspect 压在对 BR-L2-016 的延伸上——BR-L2-016 已在实验室建立第三方惩罚力度追踪违规严重度(Fehr & Fischbacher 2004),但实验室到田野的外部效度是未闭合的缺口。DED-021 将此缺口独立命题化、给出其专属的田野可证伪条件,正是为了把这个信息缺口切成可攻击的单元。BR-L2-014 提供'第三方惩罚存在',BR-L2-016 提供'惩罚力度正相关于严重度(实验室)',本条提供的是'ratio 操作化+主力执行者定位+闭合校准循环+田野验证'——三层递进,每层增量明确。"

excluded_outcomes:
  - outcome: "有中心惩罚权威(国家法律/专门执法机构)的惩罚校准"
    description: "本推论射程限定在无中心权威、由分散第三方执行的惩罚校准。制度化司法系统中的量刑校准通过立法/司法裁量/上诉等机制实现,与本推论的'分散第三方自校准'属不同机制,不在射程内。"
  - outcome: "一次性交互中第三方的惩罚行为"
    description: "本推论要求重复交互(AXIOM-003)——只有重复交互下,对惩罚者的反惩罚和声誉惩罚才形成可置信的威慑(惩罚者在意未来合作机会)。一次性遭遇中惩罚者无长期声誉顾虑,反惩罚循环不运行,不在射程内。"
  - outcome: "违规行为无严重度共识的领域"
    description: "若某类行为在群体内不存在'更严重 vs 更轻'的共享判断(如审美冒犯或纯仪式性违规),则违规严重度作为测量轴不可操作化,本推论对该类违规无预测力。'无共识'的事前判据:独立编码者间对该类违规严重度排序的一致性低于阈值(ICC<0.6 或 Fleiss' κ<0.4),或多源民族志报告对该类违规的严重度排序呈实质性分歧(方向不一致占≥40%的报告)。此判据须在观测惩罚行为前裁定,不得因遇到表面反例后事后辩称'该领域无共识'而排除——排除决定必须基于事前收集的独立编码者间信度数据。本推论的适用前提是群体内存在违规严重度分级共识。"

anti_talisman_clause: |
  判定'惩罚力度是否跟踪违规严重度'时,违规严重度和惩罚严重度必须在彼此独立的测量轴上评定——违规严重度由伤害大小/资源损失/权利侵犯独立编码,惩罚严重度由施加成本独立编码,两套编码 protocol 不共享条目。不得因'惩罚重'反推'违规必重'(循环论证),也不得因'群体稳定'反推'惩罚必是匹配的'(结果倒推前件)。
  判定'是否存在对惩罚者的反惩罚'时,须独立于'惩罚是否失配'的评判——先观测反惩罚行为,再检验其与 ratio 的关系,不得因 ratio>1 就声称'观测到的任何对惩罚者的负面行为都是反惩罚',须排除派系性/个人恩怨驱动的负面行为。

nontriviality_test: |
  逐格判空结论：两个判据表中各有空格预测为空的格。
  表A(惩罚偏差 × 群体反应)：'过度惩罚→接受(无反惩罚)'预测为空——不公厌恶(BR-L2-013)预测旁观者对不成比例惩罚(特别是过度)产生负面反应,若此格被现实团体填满(存在长期实施过度第三方惩罚且不受反制的群体),推论证伪。'匹配→反惩罚惩罚者'亦预测为空——匹配惩罚不触发不公厌恶。
  表B(惩罚-违规相关 × 群体稳定性)：'零相关或负相关→跨代稳定'预测为空——若第三方惩罚不携带违规严重度信息,规范的分级结构无法通过惩罚传递,群体不可能在该状态下跨代维持共享规范。此格可被现实反例填上(找到某个无国家社会长期不对违规严重度做惩罚区分且不瓦解)。
  非平凡性论证：BR-L2-014 单独只给'存在第三方惩罚',不给'力度跟踪严重度'；BR-L2-016 单独只给'比例直觉存在',不给'谁执行比例跟踪'；BR-L2-013 单独只给'不公厌恶存在',不给'惩罚失配触发不公厌恶进而闭合校准循环'。三块砖的组合才产出'第三方惩罚是比例跟踪的主力执行者且具自校准机制'——每块砖的边际贡献明确,非平凡的桥接步骤不能从任一块单独推导。

real_world_anchors:
  supporting:
    - anchor: "实验室第三方惩罚力度追踪违规严重度"
      evidence: "Fehr & Fischbacher (2004)第三方惩罚博弈：被试A旁观被试B对被试C的分配,A愿付成本罚B——且罚金金额与B的分配不公程度(B剥削C的比例)正相关。B剥削C 50%比剥削10%招来更重的第三方惩罚。违规严重度(剥削比例)由实验者独立操纵,独立于惩罚力度测量——满足 anti-talisman：驱动量外生设定。方法论限制：此为实验室一次性博弈,无重复交互、无对惩罚者的二阶反惩罚观测。"
      confidence: strong
    - anchor: "无国家社会中的分级制裁——轻罪轻罚、重罪重罚"
      evidence: "Boehm(1999)'Hierarchy in the Forest'记录多个平等主义狩猎采集社会中的分级制裁：轻微违规(如偷懒不分享)先以羞辱/嘲讽回应,重复或严重违规(企图支配/暴力)升级为放逐甚至处决。惩罚力度随违规严重度递增——同一个群体对不同程度的违规使用不同力度的制裁。注意：Boehm 的记录以定性描述为主,未做 ratio 的定量编码；且分级到底是'对同一违规类型的重复升级'还是'对不同严重度违规的分级'需要逐案区分(前者是渐进的,后者是横截面的)——目前民族志数据更多支持前者而非干净的后者。标注 confidence: moderate,待更精细的田野交叉编码验证。"
      confidence: moderate
    - anchor: "公共品博弈中第三方惩罚的声誉回报"
      evidence: "Barclay(2006)和 Nelissen(2008)的第三方惩罚声誉研究：实施第三方惩罚的个体在后续博弈中获得更多信任和合作机会(惩罚者被视作'可信的合作者')——惩罚带来声誉收益。但反向结论(滥罚者受声誉惩罚/反惩罚)的方向证据较薄：过度惩罚是否确实引来反惩罚? Cinyabuguma et al.(2006)发现过度惩罚者在后续轮次中遭报复——但该发现的跨实验复现不如'惩罚带来声誉收益'稳健。本推论的预测(ii)依赖这条较弱的经验腿,诚实标注：实验证据偏方向性而非充分复现。"
      confidence: weak
  counterexamples:
    - candidate: "荣誉文化(honor culture)中的过度第三方惩罚——微小冒犯触发远超比例的报复"
      analysis: "荣誉文化中,第三方(家族成员/同侪)可能对微小冒犯施加远超比例的暴力惩罚(如为一句侮辱杀人)。表面像'过度惩罚不引反惩罚'的反例。但关键：(a)荣誉文化常在有国家法律但执法不力的背景下存在(处于射程边界),(b)荣誉暴力本身的代价极高(引发世仇/法律制裁/社区恐惧),(c)荣誉规范在现代化过程中系统性衰退,暗示非稳态。不构成干净反例,纳入 boundary_cases。"
      status: counterexample_candidate
  boundary_cases:
    - case: "惩罚者与违规者有既有亲密关系——监护人式惩罚"
      analysis: "父母惩罚子女、长者训诫后辈——惩罚者与违规者在层级关系中,惩罚力度受亲缘利他(BR-L2-002)和长期投资逻辑影响(惩罚是为了'教好'而非仅'报复'),偏离纯第三方校准逻辑。此属嵌套关系惩罚,不完全入射程(第三方定义含'无既有互惠/亲缘绑定')。"
      status: boundary_case
    - case: "群体对特定违规类型达成'零惩罚'共识"
      analysis: "某社会对偷窃(低严重度违规)达成'不值得罚'的共识,第三方对该类违规系统性地不惩罚(ratio=0)。若此状态跨代稳定,对预测(iii)构成挑战——但须先区分：(a)ratio=0是因为群体认为'不严重所以不值得罚'(即 ratio 校准正确→与预测一致)还是(b)群体认为偷窃严重但惩罚缺位(ratio 不足→挑战预测)。判定走 anti-talisman：须独立测量群体对该违规的严重度认知,而非由 ratio=0 反推'群体必认为不严重'。"
      status: boundary_case
    - case: "血仇/世仇系统中的第三方惩罚——阿尔巴尼亚 Kanun/科西嘉 vendetta/黑山 krvna osveta"
      analysis: "无中心权威+重复交互+第三方惩罚存在的最干净天然实验之一。氏族成员为侮辱(客观轴:物理伤害=0,资源损失=0,权利侵犯≤1)执行谋杀报复(punishment=致死,ratio>>1.3)。氏族内部不对执行者施加反惩罚(执行血仇被视为荣誉义务),系统跨代稳定数世纪。对 DED-021 构成方向性张力:第三方惩罚力度不跟踪客观违规严重度,过度惩罚不引内部反惩罚。按本推论的客观轴优先裁决规则(见 operationalization),此案例被判定为 ratio>>1.3 且无反惩罚→对预测(ii)构成挑战。但跨氏族报复循环(对方氏族反击)非校准性反惩罚(属派系冲突而非因惩罚失配引发)——此区分使该案例不完全等同预测(ii)的证伪条件。该案例被标注为'跨文化测量分歧'(客观轴与文化内感知严重度显著分歧:在 Kanun 文化内侮辱被感知为与生命等价的极严重违规),按分歧裁决规则不单独用于支持或反对理论,但其存在本身揭示 DED-021 在荣誉导向的无国家社会中的适用边界——当文化将名誉编码为与生命等价的最高价值时,客观轴评分与行为生态脱钩,ratio 校准机制在此类社会中可能被荣誉逻辑覆盖。"
      status: boundary_case

discriminant_validity: |
  【独有可证伪预测】本推论独有的可证伪主张是：第三方惩罚不仅是公平规范的执行者,更是比例跟踪的主力执行者——且校准循环由不公厌恶闭合(失配惩罚→对惩罚者的反惩罚)。其他理论不做出这一断言：(a)DED-015 论证比例性是演化稳态,但不指定'谁在跟踪比例'——可以是受害者的第二方惩罚,无需第三方；(b)BR-L2-014 记录第三方惩罚存在,不讲严重度校准；(c)BR-L2-016 记录比例直觉存在且其 behavioral_economics source(Fehr & Fischbacher 2004)已观测到第三方惩罚力度追踪违规严重度——但 BR-L2-016 以一般命题形式陈述,未做 ratio 操作化、未闭合失配→反惩罚→自校准循环、未做'第三方是主力执行者'的比较性断言；(d)威慑理论(deterrence theory)主张惩罚越重越有效('严刑峻法论'),与本推论的'过度惩罚引反惩罚'直接矛盾。故本推论有独立的、可与威慑理论对决的证伪轴。

  【防平凡化守卫——本条是否只是 BR-L2-016 的平凡重述?】
  BR-L2-016 的 behavioral_economics source(Fehr & Fischbacher 2004)已明确第三方惩罚力度追踪违规严重度,其 falsifiability 条件与 DED-021 预测(i)近义——评审确认此为事实重叠,本条的对手应是 BR-L2-016 而非 BR-L2-014(与 BR-L2-014 比是避重就轻)。但 DED-021 的增量不完全归零,体现在:(a)ratio 操作化——将 BR-L2-016 的定性'正相关'变成双轴独立编码的定量 ratio 框架,'过度/匹配/不足'可操作化裁定(而非模糊的'不够匹配'),且 ratio 阈值分档来自独立测量轴而非由结果反推;(b)闭合校准循环——BR-L2-016 仅现象级描述'惩罚不配引发第二轮不满',本条将其升级为'不公厌恶(BR-L2-013)→对惩罚者的反惩罚→惩罚者有个人利益动机去校准'的闭合机制,且预测(ii)增加了 BR-L2-016 未覆盖的对称方向:不足惩罚→'纵容帮凶'声誉惩罚;(c)主力执行者定位——BR-L2-016 以一般命题形式陈述(不区分第二方/第三方),本条主张'第三方是比例跟踪的主力执行者'并给出独立溃败场景:若发现比例跟踪可由第二方惩罚单独维持且第三方从不介入→DED-021 损伤但 BR-L2-016 存活(比例性仍成立);(d)空格预测结构——表A 和表B 的空格预测非 BR-L2-016 所隐含,提供了独立于 BR-L2-016 的证伪轴。防平凡化结论:DED-021 与 BR-L2-016 共享预测(i)的经验基础,但 ratio 操作化+闭合校准机制+主力执行者定位+空格预测构成的组合增量仍具独立可攻击面——仅读 BR-L2-016 推不出 ratio 分档裁决规则、推不出不足惩罚→声誉惩罚的对称预测、推不出'第三方是主力执行者'的可独立证伪比较性主张。

  【防"黄金中道"平凡化】同 DED-015 的防卫——本推论'匹配比过度或不足好'的结构与亚里士多德中道(golden mean)表面相似但实质不同：中道是模糊启发式,不指定机制、不给可证伪条件、可消化任何结果；本推论指定具体机制(不公厌恶→反惩罚→校准循环)、给出可独立攻击的预测(i)(ii)(iii)、ratio 由独立测量轴定义而非由结果反推——specific mechanism vs vague heuristic,前者可被独立推翻。

