id: DED-011
type: deduction
layer: L3-deductions
status: verified

term: "派系必然性与轮替抑制推论 (Faction Inevitability & Rotation-Suppression Corollary)"

人话摘要: |
  只要一群人要长期分'不够分'的东西,就必然分裂成派系——有目标又牵涉利益的人对'怎么分'
  必有立场(立场定理),稀缺(AXIOM-001)使立场互相对立,立场再沿'谁和谁的利益一致'这条线
  抱成团、并借'偏袒自己人'(BR-L2-006)自我加固、靠团内'你帮我我帮你'(BR-L2-005)黏合。
  所以派系化是结构必然,不是成员人品坏、也不是文化毛病。想不让组织被派系撕裂,唯一的
  结构办法【不是】'消灭派系'(做不到),而是给暂时'输'的一方留一条可信的翻盘路——轮替
  (下届再来)、退出(不玩了走人)、申诉(还能翻案)。有这条路,输家愿意'等下轮'而不掀桌,
  派系边界就流动、不固化;没这条路,败方看不到未来,组织不是卡成僵局,就是清洗,或者分裂。
  驱动这件事的,是'分配有多稀缺 × 有没有可信翻盘机制',跟好人坏人、和谐文化无关。

statement: |
  立场定理(THEOREM-position:有目标 + 事牵涉利益 ⇒ 必有立场)给出"成员对分配必有倾向";
  AXIOM-001(稀缺→竞争)使这些立场在'不够分'的资源上必然对立;BR-L2-006(内群体偏好)给出
  "对立立场沿共同利益线聚合成派系并自我强化"的经验落地;BR-L2-005(互惠利他)给出派系内部
  的互惠黏合。据此:

  【核心】在一个【持久分配稀缺资源】的组织里,成员对'怎么分'必有对立立场,立场沿【共同
    利益线(严格指可事前独立编码的材料诉求:选区/持股/产业/部门,区别于身份/意识形态/纯
    人格)】聚合成派系——这是结构必然,非成员道德败坏或文化问题。派系【不可消除】;唯一的
    结构性抑制【不是】消灭派系,而是给暂时'输家'保留【可信翻盘希望】——其伞级判据=【给输家
    一条不掀桌也有未来的路】,着法【非穷尽】,凡满足此判据的结构机制皆算,已识别至少四类:
    轮替(下轮重分权)、退出(可安全离场/分立)、申诉(可翻案纠错)、权力分享/保底否决(共时
    相互否决/比例共治/板块自治,输家恒有一份一票、不被抹掉)——满足其一即在场。伞级判据预测
    的是【输家不掀桌 = 避免清洗/分裂】,【非】'派系边界流动不固化'——后者仅由轮替/退出类
    着法(做成员跨议题重组)专属产出;权力分享/保底/补偿类着法虽满足伞级判据、抑制清洗分裂,
    却将派系板块【冻结固化】并带【僵局】风险、不产流动(见预测(iii)限定)。任何翻盘机制
    俱缺时,败方无未来预期 ⇒ 组织走向【僵局 / 清洗 / 分裂】三结局之一。

  【驱动量】分两层:(甲)驱动【清洗/分裂(输家掀桌)】的是【分配稀缺度 × 伞级翻盘机制(任一
    着法)的缺失】——标量可事前独立测;(乙)驱动【派系边界流动(成员跨议题重组)、防【固化】】
    的是【分配稀缺度 × 轮替/退出类着法(做成员重组)的可信度】——权力分享/保底/补偿类着法
    贡献(甲)之避免清洗/分裂,但产固化+僵局风险、不产流动(方向与(乙)不同,不可跨类标量加总)。
    两层驱动均【非】成员道德品质、【非】和谐文化或纸面团结口号。故预测:好人+团结口号、封闭
    分配又无任何翻盘机制,照样清洗/分裂;有可信翻盘(尤其轮替/退出),即便成员平庸,也避免清洗
    且派系流动不固化。

  【预测】
    (i)   封闭分配(无外部资源增量可稀释竞争) + 【无】任何可信翻盘机制(轮替/退出/申诉/权力
          分享等,伞级判据下俱缺)的组织,派系可预测地【固化】并走向僵局或清洗——【即便成员
          并非"坏人"、即便有团结话术】。
    (ii)  存在可信轮替(或安全退出/申诉)的组织,派系边界【流动、不固化】:输家等下轮重来
          或退出,而非掀桌清洗;成员随议题在派系间重组。
    (iii) 招牌预测(可逆 / 单调,限定于轮替/退出类):轮替/退出类着法的可信度增强 ⇒ 派系
          流动性上升、固化下降(可恢复);轮替/退出被抽掉(领袖终身化 / 退出被堵死)⇒ 固化
          -撕裂回归。同一组织,两个方向。且【单调】:分配越稀缺封闭、轮替/退出越不可信,
          固化-撕裂越重。权力分享/保底/补偿类着法【不在此单调射程内】——其可信度增强抑制
          清洗/分裂,但方向是【固化+僵局】、非流动(着法各有代价,见权力分享锚 honest_note)。

  【逐格判空(核心空格)】'持久稀缺分配 + 立场经独立测确沿利益线对立 + 无可信翻盘机制 +
    长期既不固化也不僵局/清洗/分裂(派系边界始终流动消融)'——这一格【预测为空】,可被现实
    反例填上(见 falsifiability(a))。

  【与现有理论的判别】不等同于麦迪逊《联邦党人第10篇》"faction 不可消除、只能控制"这句
    已被吸收的常识。其【独有可证伪内容】收敛为:①【轮替/退出机制对派系流动性的定量可逆-单调
    效应】(轮替/退出可信度↑ ⇒ 边界流动↑、固化↓,可逆;限定于轮替/退出类,权力分享/保底/
    补偿类抑制清洗分裂但产固化僵局、不在此单调射程);②【派系边界沿共同【材料】利益线聚合,
    可由利益结构事前独立预测】——区别于 BR-L2-006"哪怕任意标签也致偏":本推论预测派系断层
    【track 材料利益线(选区/持股/产业/部门)】而非任意标签、身份/意识形态或纯人格。①的定性
    直觉与 Przeworski"输家同意"重叠,新意在其【定量单调-可逆】形态;麦迪逊/Przeworski/
    BR-L2-006 都不给①的定量形态与②这两条可测预测。

# === 规则 A：操作化定义 ===

operationalization:
  scarce_persistent_distribution:
    definition: |
      【前件门槛(自变量A)】该组织是否【反复、持久地】在成员/子群间分配【稀缺】资源
      (权力/职位/预算/份额)——即'资源可供量 ÷ 成员总诉求 < 1'且分配是【重复博弈】(非一次性)。
      '封闭度'另计:有无外部资源增量可稀释零和(封闭 = 无外部增量,一方多拿另一方必少拿)。
    measurement: |
      制度事实 + 预算/席位/份额账:统计分配对象是否稀缺(供需比 < 1)、分配是否周期性重复、
      是否存在外部资源注入使非零和。【anti-talisman 硬约束】此量由资源结构【独立测】,
      【不得】用'有没有闹出派系'反推'必然稀缺'。
    limitations: "稀缺是程度、非二分(供需比连续);'持久'指跨多轮,偶发一次性分配出射程。"

  turnaround_credibility:
    definition: |
      【招牌驱动量(自变量B)】暂时'输家'保有【可信翻盘希望】的强度——伞级判据=【给输家一条
      不掀桌也有未来的路】;以下为其【非穷尽的着法实例】(满足其一即在场,不排除未列的第 n 类):
      (轮替) 制度化的定期重分权/换届/轮值,败方下轮可再争;
      (退出) 可【安全离场/分立/退股】的选项,不满一方能带资源走而非被消灭;
      (申诉) 可【翻案/纠错/上诉】的独立渠道,败方裁决非终局;
      (权力分享/保底否决) 共时【相互否决/比例共治/板块自治/大联合共治】,输家恒有一份一票、
        不被抹掉(协和式民主、UNSC-P5 否决制)——既非轮替(无换届)、非退出(不离场)、非申诉
        (无上级翻案),是独立第 4 类;【注】它常以【僵局】(已列坏结局之一,如黎巴嫩/冷战 UNSC
        瘫痪)为代价抑制清洗/分裂,是对翻盘维度的丰富、非净反例。
      判据是【伞级 catch-all】而非封闭枚举:上列只是着法,凡满足'给输家不掀桌也有未来'的结构
      机制皆算在场;枚举不穷尽,允许现实补入未列类型。
    measurement: |
      【结构测,承重且须防循环】由制度成文事实独立测:有无定期换届/轮值规则(轮替)、有无
      成文退出/分立/退股条款且可实际行使(退出)、有无独立申诉/复核机构(申诉)、有无成文的
      保底否决/比例共治/板块自治条款(权力分享)。其【可信度】由【纯事前结构事实 + 非结局侧
      程序事实】测:规则是否成文且约束力可查、程序是否在【常规、非危机】的例行运作中被援引
      执行过(如换届按期发生、退出条款被行使、申诉被受理走完流程、否决被援引)。
      【结果侧禁用】可信度【不得】用'是否发生过【和平交权/成功退出/翻案先例】'等【结局邻近侧】
      先例测——'和平交权'与被预测量'输家不掀桌/不清洗'几乎同轴,用它测可信度=自变量偷用结果
      侧代理(DED-007 焊点 / DED-004 循环)。'程序被例行援引'(结构侧)须与'组织是否避免了清洗/
      分裂'(结局侧)明确切开。
      【硬约束】翻盘机制的在场【必须】由上述结构+程序事实测,【不得】用结局反推——不因'发生了
      清洗'就断'必无翻盘',也不因'长期无清洗'就断'必有翻盘'。
      【第4类专属防隐焊】对权力分享/保底否决类,其程序指标'否决被援引'与坏结局'僵局'近乎同轴
      (援引否决≈制造僵局),测其可信度时须与'僵局'结局侧明确切开:可用'保底否决条款成文且在
      非危机常规议题中被援引且未升级为制度性瘫痪'的更细程序事实,或将可信度与僵局度分轴测
      (可信度 = 否决的真实可行使性;僵局度 = 否决互锁致瘫痪的频率/时长)。若不分切,'翻盘可信'
      与'僵局'互锁,第4类专属隐焊遗留。
    limitations: "可信度是连续量(纸面有、从不援引 = 低可信);现代组织多为轮替/退出/申诉/权力分享的混合态,但不可跨类简单加总——轮替/退出类贡献流动性,权力分享/保底/补偿类贡献防清洗/分裂但产固化僵局、不产流动,两类效应方向不同、须分轴记,不可压成单标量'合力'。"

  faction_dynamics:
    definition: |
      【被预测量】三件事分开测:
      (聚合线) 派系边界是否沿【共同利益线】聚合——此处【利益线】严格限于【可事前独立编码的
        材料诉求(选区/持股/产业/部门/预算归属)】,与【身份/意识形态/纯人格恩怨】明确分开、
        与排除项①'纯观念/审美'互斥;测立场向量与【材料利益归属】的重合度(而非任意标签/纯人格);
      (固化度) 派系边界是【固化】(成员长期锁死同一阵营)还是【流动】(随时间/议题重组、成员改换);
      (结局)   长期走向:僵局 / 清洗 / 分裂 三者之一,还是流动稳定(派系存在但不撕裂组织)。
    measurement: |
      (聚合线) 投票/表决/结盟记录 + 成员【材料利益归属(选区/持股/产业/部门)】的【事前独立
        聚类】:派系断层是否与材料利益线重合,而非与任意标签或个人恩怨重合。此测【独立于】固化
        度与结局。【控制混淆】须把 identity/ideology 维【单列】、与材料利益维分开编码并测其增量
        贡献——不默认把意识形态收编进'利益线';二者共线时须注明,不能凭共线就断定 track 利益线。
      (固化度) 跨时段追踪成员阵营是否稳定锁死 vs 重组流动率。
      (结局)   史料/档案:是否出现制度性僵局(否决权互锁)、清洗(肉体/政治消灭败方)、分裂(拆伙)。
      三个维度【彼此正交】测,不互相反推。
    limitations: "固化/流动是程度非二分;'沿利益线'需控制任意标签恰好与利益线共线的混淆(注明)。"

# === 推导链 ===

derivation:
  from_l1:
    axioms: [AXIOM-001]
    theorems: [THEOREM-position]
  from_l2:
    bridging: [BR-L2-006, BR-L2-005]

  steps: |
    1. "成员必有立场(THEOREM-position)"
       持久分配稀缺资源的组织里,每个成员既有目标、分配又牵涉其利益 ⇒ 对'怎么分'必有倾向
       (立场)。此步偏【近定义】(立场定理近乎界定),不是非平凡发动机,诚实点明。

    2. "立场必然对立(AXIOM-001)"
       资源稀缺、分配封闭(一方多拿另一方少拿)⇒ 成员立场在同一资源上零和对立,非可调和的
       口味差异。此步也偏【近定义/近公理】。

    3. "对立立场聚合成自强化派系(BR-L2-006)——真发动机之一"
       对立立场沿【共同利益线】聚合成群;内群体偏好使'自己派'在分配/信任/冲突中被偏袒,
       派系一旦成形即【自我强化】(偏袒→更抱团→更偏袒)。BR-L2-005 使派系内'你帮我我帮你'的
       互惠黏合稳住阵营。此二砖是非平凡落地:把'有对立立场'升级为'成形、稳定、自强化的派系'。

    4. "派系不可消除,输家预期决定结局"
       上三步 ⇒ 派系化是结构必然、不可靠道德/口号消除。剩下的自由度只在【暂时输家有无未来
       预期】:若有可信翻盘(伞级判据'给输家不掀桌也有未来的路'下的任一着法),输家理性地
       '等下轮/退出/守住保底'而非掀桌 ⇒ 避免清洗/分裂。但【是否产出派系边界流动】取决于
       着法类型——轮替/退出类做成员跨议题重组→边界流动;权力分享/保底/补偿类抑制清洗分裂
       却产固化+僵局、不产流动。若无任何翻盘机制,败方无未来 ⇒ 只剩掀桌(分裂)、卡死(僵局)、
       或被赢家先下手(清洗)。

    5. "合成 + 可逆 + 驱动量归因(分层)"
       清洗/分裂 ⟺ 封闭稀缺分配 × 伞级翻盘机制缺失;派系流动(防固化)⟺ 封闭稀缺分配 ×
       轮替/退出类着法的可信度。轮替/退出可信度升则流动可恢复,被抽掉则固化回归(可逆);
       固化-撕裂随'稀缺封闭度 ÷ 轮替/退出可信度'单调上升。权力分享/保底/补偿类着法贡献
       防清洗/分裂项,但产固化+僵局、不产流动。驱动量=分配稀缺×(甲)伞级翻盘缺失→清洗/
       分裂,(乙)轮替/退出缺失→固化(结构可事前测),非道德/文化。
       【非平凡性(逐格判空)】BR-L2-006 单独只给"人偏袒自己人、哪怕任意标签也致偏"(给'偏袒',
       【不】给'派系断层 track 利益线'、更【不】给轮替/退出对流动性的定量单调-可逆效应);
       BR-L2-005 单独只给"熟人自发互惠"(给团内黏合、不给跨派结构);THEOREM-position/AXIOM-001
       偏近定义。四者【都不】给出"清洗/分裂 ⟺ 封闭稀缺 × 无翻盘机制"联合结构与"流动/固化
       ⟺ 封闭稀缺 × 无轮替/退出"单独层,也【都不】把'派系断层沿利益线可事前预测'与'轮替/
       退出→流动性可逆单调(限定于轮替/退出类)'识别出来。"稀缺封闭 + 沿利益线对立 + 无翻盘 +
       长期无固化"这一格被预测【为空】、且可被现实反例填上(非同义反复)。唯合成给出。

# === 可证伪性 ===

falsifiability: |
  本推论可被以下发现证伪:
  (a) 一个【持久分配稀缺资源】的组织(由 scarce_persistent_distribution 独立测确认),其成员
      立场经【事前独立测】确沿共同【材料】利益线对立,且【无任何可信翻盘机制】(轮替/退出/
      申诉/权力分享等,伞级判据'给输家不掀桌也有未来的路'下【俱缺】,由 turnaround_credibility
      的结构+程序事实独立判定),却【长期既不派系固化、也不僵局/清洗/分裂】——派系边界始终
      流动消融。⇒ 证伪核心(命中'无翻盘却无固化'的空格)。
      注:若发现其实有隐性退出/非正式轮替/可翻案渠道/事实上的保底否决(任一翻盘机制在场),
      正是本推论所预测,不算 (a);(a) 要求伞级判据下【所有】翻盘路(含未显式列举者)俱无仍长期不固化。
  (b) 派系固化-撕裂的有无与'翻盘机制有无'【无】系统关联,只随成员道德品质或和谐文化走
      (有道德/有团结文化的组织即便封闭无翻盘也不固化;反之有翻盘却因'文化好斗'照样清洗)。
      ⇒ 证伪"驱动量 = 分配稀缺 × 翻盘缺失,而非道德/文化"。
  (c) 派系边界系统性地【不】沿共同利益线聚合,而是随任意标签(BR-L2-006 式)或纯人格随机
      分布、与利益结构【无】事前关联。⇒ 证伪"派系断层 track 利益线"这一非平凡内核(把它
      降回 BR-L2-006 的复述)。

falsification_trace:
  primary_suspect: |
    最弱腿:【跨着法标量聚合是否成立 / ①的单调是否仅限轮替-退出类】——招牌载重①的'翻盘
    可信度→流动性'单调-可逆断言,被 R2 补入的【权力分享/保底否决】及整类保底-补偿型着法顶翻:
    它们满足伞级判据却产固化+僵局、非流动;故单调须限定到轮替/退出类,或拆被预测量使伞级判据
    只预测'输家不掀桌(避清洗/分裂)'、非'流动不固化'(后者仅由轮替/退出产出)。此腿最先受检。
    次弱腿:'对立立场聚合成派系'是否只是 BR-L2-006(内群体偏好)的复述——即'派系断层沿共同
    利益线聚合、可由利益结构事前预测'是否真带来 BR-L2-006(任意标签也致偏)之外的可证伪内容。
    诚实退守:即便'聚合'部分与 BR-L2-006 重叠,轮替/退出抑制的定量单调预测(轮替/退出可信度↑
    ⇒ 派系流动↑、固化↓,可逆)【独立于】聚合机制、仍可单独检验。
  secondary_suspect: |
    turnaround_credibility 须由制度结构事前测,【不得】用'是否清洗/僵局'反推'必无翻盘'(否则
    循环,DED-004 死病);faction_dynamics 的'沿利益线'须由立场向量独立聚类测,不由结盟结果反塞。
  unlikely_suspect: |
    THEOREM-position(有目标 + 牵涉利益 ⇒ 必有立场)与 AXIOM-001(稀缺→竞争)本身——近乎
    定义性/最坚实公理,极少是根源。

# === 排除的结果 ===

excluded_outcomes:
  - outcome: "不牵涉持久稀缺资源分配的分歧(纯观念/审美/技术路线之争)"
    description: |
      若立场对立【不】源于持久稀缺资源分配(AXIOM-001 不适用,不是零和),不在射程,既不支持
      也不证伪。判定按【分歧是否牵涉持久稀缺资源分配】事前测,不按结果开脱。
      【防双向逃逸(与②同源)】本排除项'纯观念'与载重②的'材料利益线'须【互斥且事前可分】:
      利益线严格限于可事前独立编码的【材料诉求(选区/持股/产业/部门/预算归属)】;身份/意识
      形态/审美/纯人格【不】算利益线。故遇到'派系沿身份/意识形态聚合'的实例,【不得】两头逃逸
      ——既不能开脱为'纯观念出射程'来回避②的证伪,也不能把意识形态硬收编进'利益线'把②稀释回
      BR-L2-006(任意标签)的复述。二者共线时须单列 identity/ideology 维、测材料利益的增量贡献。
  - outcome: "一次性/临时组织的临时结盟"
    description: |
      若组织【非持久分配】(一次性博弈、临时委员会),派系无固化压力(无'下轮'也无'长期'),
      前件不成立,出射程。
  - outcome: "明面即以派系/党派为组织原则的机构(多党制/联合政府)'被派系化'"
    description: |
      派系是其明示原则、非病症,'存在派系'本身不算 (a) 反例;但其【是否固化撕裂 vs 流动稳定】
      仍在 (ii)/(iii) 射程内,按翻盘机制有无判定。

anti_talisman_clause: |
  【防不可证伪护身符 — 诚实硬约束】判定'是否存在可信翻盘机制'时,必须由 turnaround_credibility
  的【制度结构事实 + 非结局侧程序事实】(成文换届/轮值规则、可行使的退出/分立条款、独立申诉
  机构、成文的保底否决/比例共治/板块自治条款,及其【在常规、非危机运作中被例行援引执行】的
  程序事实)独立测,并【独立于结局(是否清洗/僵局/分裂)】。【尤禁结果侧代理】不得用'是否
  发生过和平交权/成功退出/翻案先例'这类【结局邻近侧】先例测可信度——'和平交权'与被预测量
  '输家不掀桌'同轴;'程序被例行援引'(结构侧)必须与'组织是否避免撕裂'(结局侧)切开。
  不得因'发生了清洗'就倒推'必无翻盘机制',也不得因'长期无清洗'就倒推'必有翻盘机制'。判定
  '派系是否形成/固化/沿【材料】利益线'须由成员立场向量与结盟结构的事前独立测得,不由'结局
  是否撕裂'反推。尤其【不得】遇到'翻盘机制俱无却长期不固化'的反例,就事后硬塞一个非正式
  '隐性翻盘希望'来消化——翻盘机制的在场须由独立的制度/退出/权力分享结构事实坐实。否则本
  推论沦为不可证伪循环(DED-004 病根)。

# === 非平凡性 ===

nontriviality_test: |
  逐格判空(自变量档 = 稀缺持久分配【有/无】 × 翻盘机制【有/无】;被预测量档 = 派系固化-撕裂
  / 流动稳定 / 无派系):
    - 稀缺持久分配【无】(非稀缺 or 一次性)⇒ 立场不对立/不持久,派系不必固化 ⇒ 非空
      (富足配给、临时委员会)。
    - 稀缺持久分配【有】 × 翻盘机制【有】(轮替/退出/申诉类)⇒ 派系形成但边界流动、不固化 ⇒
      非空(竞争性选举政体、可退出的合伙/联盟、有申诉的科层)。权力分享/保底/补偿类翻盘机制
      在场时,派系形成、边界【固化】但避免清洗/分裂、常伴僵局 ⇒ 亦非空(协和式民主、否决制)。
    - 稀缺持久分配【有】 × 翻盘机制【无】⇒ 派系固化 → 僵局/清洗/分裂 ⇒ 非空(封闭权力核心
      内派系斗争→清洗;无退出合伙→僵局分裂)。
    - 稀缺持久分配【有】 × 沿利益线对立 × 翻盘机制【无】 × 长期【无】固化 ⇒ 【预测为空】(核心)。
  该空格是真经验主张,非被砖平凡强制:BR-L2-006 只给'偏袒自己人(任意标签亦然)'、不给'断层
  track 利益线'、更不给'翻盘→流动性'效应;BR-L2-005 只给团内互惠;THEOREM-position/AXIOM-001
  近定义。空格可被'封闭稀缺无翻盘却长期无派系固化'这一现实反例填上 ⇒ 非空可满足、非同义反复。
  【防平凡化】非平凡【不在】'派系难免'(常识/麦迪逊/BR-L2-006 已有、非卖点),而在①轮替/退出
  对派系流动性的定量可逆-单调(限定于轮替/退出类,不含权力分享/保底/补偿类——后者抑制清洗分裂
  但产固化僵局、不产流动)、②派系断层沿利益线可事前独立预测(区别于 BR-L2-006 任意标签致偏)。

# === 现实锚点 ===

real_world_anchors:
  supporting:
    - anchor: "竞争性选举政体(轮替在场)—— 派系流动、不固化"
      evidence: |
        定期选举 + 换届规则被例行兑现(任期届满即改选)使败选方'等下届'而非掀桌;政党/派系边界
        随议题与选民重组,不锁死为你死我活。相对无轮替体制,内部断裂显著低。
        (注:'和平交权'是这条路的【结果】,非其可信度的测量输入。)
      independent_test: |
        定期选举成文规则 + 换届【按期例行发生】(选举如期举行、任期届满即换人这一程序事实)是
        成文制度与例行记录,可【独立于】是否发生撕裂测得'轮替可信';【不】用'和平交权先例'这一
        结局邻近侧代理(它与被预测量'输家不掀桌'同轴)。
      confidence: "moderate-strong(轮替规则成文、换届按期发生这一程序事实可独立测;逐案流动度较难,诚实降级)"

    - anchor: "封闭权力核心内派系斗争走向清洗 —— 翻盘机制缺失"
      evidence: |
        无制度化轮替、无安全退出、无独立申诉的封闭精英集团(某些一党体制高层派系斗争),败方
        无下轮预期与安全离场 ⇒ 结局系统性偏向清洗/肉体或政治消灭,而非在野等待。
      independent_test: |
        '有无制度化权力轮替 / 安全退出 / 独立申诉'是结构事实,可独立于'是否已清洗'判定。
      honest_note: "清洗多因交织(个人野心/外部危机/意识形态),只作方向性中等支持。"
      confidence: "moderate"

    - anchor: "合伙制/合作社的退出权(exit)抑制僵局 —— 翻盘机制(退出)在场"
      evidence: |
        可自由退股/分立的合伙组织,不满一方【退出带资源走】而非死斗到底 ⇒ 派系不固化为零和
        僵局;退出成本越低,固化越弱。
      independent_test: "退出/分立/退股条款是成文合约事实,可独立测其存在与可行使性。"
      confidence: "moderate"

    - anchor: "权力分享/保底否决(协和式民主 / UNSC-P5 否决制)—— 第 4 类翻盘机制在场"
      evidence: |
        协和式民主(Lijphart:荷兰柱化/比利时/瑞士/黎巴嫩/战后奥地利)与 UNSC-P5 否决制,靠
        【相互否决 + 比例共治 + 板块自治 + 大联合共治】让输家【恒有一份一票、不被抹掉】——给了
        '不掀桌也有未来',却既非轮替(共时分权、无换届)、非退出(不离场)、非申诉(无上级翻案),
        是独立第 4 类结构机制。它抑制清洗/分裂,却常以【僵局】为代价(黎巴嫩周期性瘫痪、冷战
        UNSC 长期否决互锁)——僵局是已列坏结局之一,故此机制是对翻盘维度的丰富、非净反例。
      independent_test: "成文的否决权/比例共治/板块自治条款是制度结构事实,可独立于'是否已清洗/分裂'测其在场。"
      honest_note: "抑制清洗/分裂 ↔ 付僵局代价的权衡,使'翻盘机制'不是单调越多越好,而是着法各有代价;只作方向性中等支持。"
      confidence: "moderate"

    - anchor: "派系断层沿利益线聚合的事前测(立法投票 / 董事会表决)—— 支持非平凡内核②"
      evidence: |
        立法表决/董事表决可【事前】按材料利益归属(选区/持股/产业/部门)聚类,派系边界与材料
        利益线【部分重合】(非完美)——区别于 BR-L2-006(任意颜色标签亦致偏)。
        【诚实降级】Poole-Rosenthal 等唱名投票研究显示投票低维、且很大程度沿一条【党派/意识
        形态】主导维,该维不能干净还原为选区材料利益;故'高度重合'偏乐观,材料利益线仅解释部分
        方差,'利益线 vs 意识形态维'的分离本身是争议。
      independent_test: |
        利益归属(选区/持股/产业)可在观察结盟【之前】独立编码,再验证断层是否与之共线;但须
        【控制混淆】——把 identity/ideology 维单列、测其增量贡献,不默认收编进'利益线';二者
        共线时须注明,不能凭共线就断 track 材料利益线。
      confidence: "weak-moderate(材料利益线可事前编码,但与意识形态/党派维分离本身争议、共线难净分,诚实降级)"

  reversibility_anchor:
    - anchor: "引入/取消轮替使派系流动性反转"
      evidence: |
        同一组织引入定期换届/轮值后,派系边界松动、输家转为'等下轮';领袖终身化 / 退出被堵死 /
        申诉被架空后,边界重新固化、走向清洗或僵局。作 (iii) 可逆/单调锚。
      honest_note: "轮替变更常与外部危机/领袖更替多因交织,只作可逆方向中等支持。"
      confidence: "weak-moderate"

  counterexamples: []

  boundary_cases:
    - case: "长期稳定的一党执政却未见大清洗(某些主导党制)"
      analysis: |
        表面像'无轮替却无固化'反例。按判据:先【独立测】其是否真无翻盘机制——若党内有制度化
        派系轮流执政 / 定期党首选举(=党内轮替=翻盘机制在场),或有安全退出、或有派阀间比例
        分权/保底(权力分享),则属翻盘机制在场、非反例;若确认伞级判据下【所有】翻盘路(轮替/
        退出/申诉/权力分享及未列类型)俱无、且立场沿【材料】利益线对立、却长期不固化,则命中
        falsifiability(a)。判定回到 anti_talisman:翻盘机制在场须由制度+程序事实独立测,不由
        '没清洗'反推。
      status: boundary_case

    - case: "高凝聚小共同体(修道院 / 意识形态公社)无明显派系"
      analysis: |
        若其分配【非稀缺】(共产共享、诉求被压低,供需比≥1)或成员可【自由退出】(exit 在场),
        则出射程(前件不成立)或属翻盘机制在场——非'无翻盘却无固化'的反例。须先独立测稀缺度与退出权。
      status: boundary_case

# === 判别效度 ===

discriminant_validity: |
  【与麦迪逊《联邦党人第10篇》的判别】麦迪逊"faction 不可消除、只能控制(靠扩大共和国规模
  稀释)"已是常识;本推论的独有可证伪内容【不在】'党争难免'(那被吸收进常识、非卖点),而在
  麦迪逊未给的两条可测预测:①【轮替/退出机制对派系流动性的定量可逆-单调效应】(轮替/退出
  可信度↑ ⇒ 边界流动↑、固化↓,同一组织两方向;限定于轮替/退出类,权力分享/保底/补偿类
  抑制清洗分裂但产固化僵局、不在此单调射程);②【派系断层沿共同【材料】利益线聚合、可由利益结构
  事前独立预测】——即派系结构可从利益结构提前算出。麦迪逊只给'扩大规模稀释',不给这两条。

  【与 Przeworski「制度化的不确定性 / 输家同意」的判别 — 诚实承认重叠】①的【定性直觉】
  ——'输家预期能翻盘就等下轮而非掀桌'——与 Przeworski「民主 = 制度化的不确定性 / 输家同意
  (loser's consent)」【重叠】,非本推论首创,不作卖点。sharp 可证伪【载重显式钉在经验臂】,
  【非】定性直觉本身:①的载重是【轮替/退出可信度→派系流动性的定量单调 + 可逆】形态(连续、
  单调、同一组织两方向可恢复;限定于轮替/退出类,权力分享/保底/补偿类不在此射程——后者
  抑制清洗分裂但产固化+僵局、非流动),②的载重是【断层沿可事前独立编码的材料利益线聚合、可提前算出】。
  近解析臂'缺翻盘→掀桌/僵局/清洗'(从理性输家近乎演绎)【不】作主证伪内容。判别新意 = ①的
  定量形态(单调+可逆)+ ②的事前可测,而非'输家等下轮/输家同意'这一既有定性命题。

  【与 DED-003(内聚-外竞耦合)的判别】二者同用 BR-L2-006,但方向相反、被预测量不同:DED-003
  讲【对外】——外部对手消失则内部凝聚松散(被预测量 = 群体对外凝聚,BR-L2-006 用于'我们 vs
  他们'的外边界);DED-011 讲【对内】——持久稀缺分配下内部【必然分裂成派系】及轮替对撕裂的
  抑制(被预测量 = 内部派系动态,BR-L2-006 用于'派内 vs 派外'的内断层)。一个管对外边界的
  维系,一个管对内断层的必然与抑制。共用砖是体系【复现结构】,非循环复述。

  【防平凡化守卫】非平凡【不在】'派系难免 / 大了要控制'(常识/麦迪逊/BR-L2-006 射程内)、
  【也不在】'输家等下轮'定性直觉(Przeworski 已有),而在经验臂:①轮替/退出→流动性的【定量
  可逆单调】(限定于轮替/退出类)、②派系断层沿【材料】利益线的事前可测预测。载重可证伪新意
  主要压在①(轮替/退出抑制的定量单调形态,限定于轮替/退出类),它独立于聚合机制;①的单调限定
  (是否仅限轮替/退出类、权力分享/保底/补偿类是否顶翻它)是更新后 primary_suspect 第一受检腿。

