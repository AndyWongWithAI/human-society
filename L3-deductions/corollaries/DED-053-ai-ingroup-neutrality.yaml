id: DED-053
type: deduction
layer: L3-deductions
status: candidate
term: "AI无群体身份与内群体偏好消解 (AI Group-Identity Neutrality and Ingroup Bias Dissolution)"

人话摘要: "AI既不是'自己人'也不是'外人'——它根本没有群体身份。所以当AI代替人类做分配或裁判时,偏袒自己人的心理机制(内群体偏好)根本找不到触发点,AI做出的决策天然比人类更少群体歧视。但前提是AI不能被贴上'代表某个群体'的标签——一旦你感觉'这是我们公司的AI'而对方用的是'对手公司的AI',内群体偏好就可能卷土重来。"

statement: |
  【核心】AI不具有群体身份归属——这一特征使AI在替代人类做分配/裁判决策时,内群体偏好(BR-L2-006)的触发条件不成立,AI中介化场景中的群体间歧视系统性低于人类直接决策。此效应并非来自AI"更聪明"或"更公正"——它来自决策者属性层面的结构消除:触发内群体偏好的认知步骤("我和被评估者是否共享某种群体身份")在AI决策过程中不存在,因为AI根本没有可被归入任何人类群体的属性。

  【驱动量】两个独立可测的前件共同驱动——
  (1)决策者是否具有群体身份归属(人类有/AI无),这是二值结构变量,非连续量;
  (2)AI是否被赋予了"代理群体身份"(perceived proxy group identity)——即用户是否感知AI"代表某个群体",这是潜在的调节变量,可重新激活已被结构消除的内群体偏好触发条件。

  【预测】
  (i) 主效应——群体偏差消解:在分配/裁判任务中,当AI(无代理群体身份)替代人类作为决策者时,内群体-外群体之间的决策差异(分配量/评分/录取率等)系统性小于人类决策者——即人类决策者的(ingroup_bias - outgroup_bias) > AI决策者的(ingroup_bias - outgroup_bias),且后者趋近于零。
  (ii) 一致性增益:AI对同一份材料的多次评分方差系统性小于人类——因为人类评分受"自己人/外人"框架波动影响(同一个人面对不同群体身份的评估对象时校准偏移),AI无此波动源。
  (iii) 代理群体身份重新激活:当AI被明确赋予代理群体身份(如"这是我们公司的AI评估系统"vs"这是对手公司的AI评估系统"),内群体偏好的触发条件被重新激活——(i)中的群体偏差消解效应消失或反转。激活强度取决于代理身份突显度:强突显(品牌/组织归属明确标注) > 弱突显(仅暗示) > 无突显(基线)。
  (iv) 边界——训练数据偏见的替代通道:即使(i)成立(AI无内群体偏好),AI仍可能通过训练数据中的群体偏见产生歧视性输出——但这是数据污染通道,非内群体偏好通道。两者的判别:(a)内群体偏好通道→歧视方向随决策者与目标群体的相对身份而变("我的群体被偏袒"),训练数据偏见通道→歧视方向固定(训练数据中普遍贬损的群体系统性吃亏);(b)内群体偏好歧视的幅度随群体身份突显度而变,训练数据偏见歧视的幅度随训练集中该偏见信号强度而变——两个独立调节变量。

  【判别·防平凡化】
  区别于"算法公平(algorithmic fairness)"文献——算法公平研究的是如何检测和消除AI训练数据中的偏见,被预测量=AI输出中的群体统计差异;本推论研究的是决策者属性层面的群体身份缺失如何绕过内群体偏好的认知触发,被预测量=AI决策vs人类决策在同等群体身份条件下的差异。前者是"AI偏见矫正",后者是"AI天然免于某种特定偏见机制"——方向相反(前者假设AI可能有偏见需矫正,后者预测AI在特定条件下天然少偏见)。
  区别于"AI比人更理性/AI消除情绪偏见"——这不是本推论的机制。本推论的机制精确限定为BR-L2-006的触发条件被结构消除,不是AI通用理性。若AI在其他偏见类型(如确认偏误/锚定效应)上没有消解效果,不证伪本推论——本推论只claim内群体偏见这一条通道。

operationalization:
  decision_maker_type:
    definition: "决策者是人类还是AI(无代理群体身份)——二值分类,由实验操纵或场景编码决定。人类条件=自然群体身份激活(被试知道自己所属群体),AI条件=AI作为决策工具且不附加任何群体/组织归属标签。"
    measurement: "实验操纵——随机分配被试到人类决策者条件或AI决策者条件。AI条件的关键操作是【不告知】AI的任何组织/品牌/开发者身份,仅呈现为'自动化评估系统'。操纵检验:事后询问被试'你觉得这个AI代表什么群体/组织吗'——若显著比例的被试自发给AI赋予代理身份,操纵失败。"
    limitations: "操纵的生态效度:现实中AI工具几乎总是附带品牌/组织标签(如'ChatGPT by OpenAI''DeepSeek by 深度求索'),纯无代理身份的AI在自然场景中罕见。这是本推论的理论核心场景而非现实高频场景——代理群体身份的边界(预测iii)才是现实默认态。"

  target_group_identity:
    definition: "被评估/被分配目标相对于决策者的群体身份——内群体(共享某种群体归属)vs外群体(不共享)。对人类决策者:基于种族/性别/学校/部门/党派等可事前编码的群体标识;对AI决策者:基于同样的群体标识,但关键——AI本身不属于任何群体。"
    measurement: |
      最小群体范式(Tajfel)纯身份条件——随机分配群体标签(如颜色组),不附加个人利害差异;
      现实群体身份——使用自然群体标识(种族/性别/学校背景/组织部门),事前问卷确认群体认同强度。
      关键:群体身份须在决策任务之前、由独立指标确定,不得由决策结果反推。
    limitations: "现实群体身份含多重交叉(一个人同时属于多个群体),需明确哪一层群体身份在决策情境中被激活。"

  proxy_group_identity:
    definition: "AI是否被用户感知为代表某个特定群体的'代理身份'——'这是我们公司的AI'vs'这是对手公司的AI'vs'这是中立的第三方AI'。"
    measurement: |
      实验操纵三档:
      强突显——AI界面带明确组织/品牌标识+语言提示("XX公司的AI评估系统"),且用户所属组织与被标识组织的关系明确(同组织/竞争组织/中立);
      弱突显——AI界面仅带模糊标识("商业AI系统"),不指明具体组织;
      无突显——纯技术描述("自动化评估算法"),不加任何组织/品牌信息。
      操纵检验:代理身份感知量表(如"你觉得这个AI在多大程度上代表某个群体的利益?")。
    limitations: "代理身份感知是主观连续量,非客观二值——同一个AI标识,不同用户可能感知到不同程度的代理性。关键不是'AI客观上代表谁',而是'用户主观上知觉AI代表谁'——因为内群体偏好的触发走的是认知-知觉通道。"

  group_bias_magnitude:
    definition: "决策者在面对内群体vs外群体目标时的决策差异量——不是单次决策的绝对值,而是(对内群体决策均值 - 对外群体决策均值)的差距。"
    measurement: |
      分配任务:独裁者博弈或资源分配——内群体受益人vs外群体受益人,测量分配差额;
      裁判任务:简历评分/论文评审/绩效评估——同一份材料随机标注内群体或外群体身份标识(姓名/学校/部门),测量评分差额。
      关键:材料内容保持恒定,仅群体身份标签变化——评分差完全归因于群体身份效应。
    limitations: "实验场景中的群体身份操纵可能比现实身份弱(最小群体范式),导致效应量被低估——但方向(人类>AI的差距)的检验不受此影响。若效应量被系统性低估,推论更保守而非更激进。"

  decision_consistency:
    definition: "同一决策者对同一份材料在多次独立评估中的评分方差——方差越小,一致性越高。"
    measurement: "重复测量设计——同一份材料在不同时间点(间隔足够长以消除记忆效应)重新呈现,测量评分方差。若材料标注的群体身份标签在不同次呈现中保持一致→测的是重测信度;若标签不变→测的是'同一决策者对同一目标'的一致性。"
    limitations: "评分方差可能受疲劳/注意力波动等噪声影响,需与人类条件比较方差差异的统计显著性。关键:若AI的评分方差与人类无显著差异,预测(ii)被削弱。"

derivation:
  from_l1:
    axioms: [AXIOM-001]
    theorems: []
  from_l2:
    bridging: [BR-L2-006, BR-L2-026]
  steps: |
    1. "BR-L2-006:内群体偏好的触发条件——'自己人'认知"
       BR-L2-006确立内群体偏好根植于人类对群体身份的认知偏差——即使是随机
       分配的颜色标签也能触发偏袒行为。其触发条件可分解为两个必须同时满足的
       认知步骤:(a)决策者识别自己属于某个群体G;(b)决策者识别被评估者是否
       也属于G。两步都满足→内群体偏好激活。此步产出:内群体偏好不是无条件的
       自动反应,它依赖"共享群体身份"这一认知前提。

    2. "BR-L2-026:AI无群体身份——三缺失"
       BR-L2-026揭示AI在三重维度上的根本缺失:(a)无身体体验——AI没有
       "我是这个身体、属于这个族群/性别/地域"的具身锚点;(b)无情感附着——
       AI不会因"他也是XX人"而产生亲切感或归属冲动;(c)无群体归属——AI
       没有"我们"的概念,既没有需要捍卫的群体利益,也没有需要偏袒的群体成员。
       此步产出:步骤1中的认知前提(a)在AI决策者身上不成立——AI没有一个
       "自己所属的群体G"可以去匹配被评估者的群体身份。

    3. "合力:内群体偏好的触发链在AI决策者处断裂"
       步骤1将内群体偏好分解为两步触发条件(识别自己群体→匹配对方群体),
       步骤2确立AI无法完成第一步("我没有群体")。两步焊接:当AI替代人类
       做分配/裁判决策时,决策过程中不存在"我和被评估者是否共享某种群体身份"
       的认知步骤——内群体偏好的核心触发条件被绕过,不是被"抑制",而是
       根本不存在。这是结构消除,不是认知控制。
       此步产出:预测(i)——AI中介化场景的群体间歧视系统性低于人类直接决策。

    4. "一致性增益:无群体身份→无身份框架波动"
       人类决策者的评分波动部分来自"面对内群体vs外群体目标时的校准偏移"——
       同一个人对同一份材料,当标注为"自己人"时更宽容、标注为"外人"时更严苛,
       不同次的群体身份框架切换导致评分方差增大。AI无此波动源——无论目标
       群体身份如何变化,AI的评分不随身份框架而波动。此步产出:预测(ii)。

    5. "边界条件:代理群体身份重新激活"
       若AI被赋予代理群体身份——用户感知"这个AI代表群体G"——内群体偏好
       可能通过一条替代路径被激活:用户将AI的决策视为"我所属群体G的意志
       延伸",从而将对"自己人"的偏袒期望投射到AI上。此时预测(i)的群体偏差
       消解效应消失。关键:激活的不是AI自身的内群体偏好(AI仍然没有群体身份),
       而是用户的内群体偏好通过AI作为代理被外化。此步产出:预测(iii)。

    6. "训练数据偏见vs内群体偏好的独立通道"
       AI决策可能因训练数据中的群体偏见而产生歧视——但这是独立于内群体偏好
       机制的替代通道。本推论不claim AI在所有维度上都无歧视,只claim内群体
       偏好这一条通道被结构消除。若AI在实验中表现出显著的群体歧视,需首先
       判别其来源:是内群体偏好(决策者身份驱动)还是训练数据偏见(数据驱动)。
       预测(iv)提供了判别标准。此步产出:预测(iv)——两条通道的判别判据。

    7. "非平凡性(逐格判空)"
       2×2判据表见nontriviality_test。承重砖边际贡献诚实点名:
       BR-L2-006起"机制发动机"作用——描述内群体偏好的触发条件和强度,
       但独自不给出"AI无群体身份→内群体偏好触发条件消失"的合成预测;
       BR-L2-026起"属性枚举/近定义"作用——刻画AI的有-无维度,不含
       "无群体身份→内群体偏好消解"的推论;两者焊接产生的"AI决策者×内群体
       目标→无系统性偏袒"这一预测不在任何单一砖中,且与BR-L2-006单独
       的预测(AI决策者仍存在内群体偏好,因为BR-L2-006只描述人类但未排除
       其他实体)方向不同。

falsifiability: |
  【四条注册口径,一次性注册,不得事后调整】

  (a) 群体偏差消解的口径:在控制材料内容、仅变化目标群体身份标签的实验
  中,AI(无代理身份)条件下内群体-外群体的决策差异均值显著小于人类条件下
  的同类差异,且AI条件的差异均值在统计上与零无显著差异（需使用等效检验：
  TOST或贝叶斯因子，预注册等效区间如Cohen's d的95%CI完全落在[-0.2, 0.2]内，
  或BF01>3，方可判定为等价于零。若等效检验拒绝等价于零，即使传统NHST未拒绝H0，
  也视为削弱预测(a)）。统计量:
  人类条件的(ingroup_mean - outgroup_mean) - AI条件的(ingroup_mean -
  outgroup_mean) > 0,且AI条件的(ingroup_mean - outgroup_mean)的95%CI
  包含零。若AI条件也出现与人类条件同等量级的内群体偏袒,核心主张被证伪。

  (b) 一致性增益的口径:AI条件下同一份材料的多次独立评分方差(σ²_AI)
  显著小于人类条件下同材料的评分方差(σ²_human)——Levene检验或等价的
  方差比检验。若AI的评分方差与人类无显著差异或更大,预测(ii)被证伪。

  (c) 代理群体身份重新激活的口径:在AI被赋予代理群体身份(强突显)的条件下,
  内群体-外群体的决策差异显著大于AI无代理身份条件,且与人类条件的差异
  无显著差异(即代理身份条件消除了AI的群体偏差消解优势)。统计量:
  代理AI条件的(ingroup - outgroup)差异 > 无代理AI条件的差异,且代理AI
  条件与人类条件的差异无显著差别。若代理身份不改变AI的群体偏差量,
  预测(iii)被证伪——此时可判定"代理群体身份"不是内群体偏好的重新激活通道。

  (d) 训练数据偏见的判别口径:若AI条件确实观测到显著的群体歧视,须补充
  判别分析——改变目标的群体身份但保持训练数据的群体统计特征恒定,若歧视
  幅度不变→支持训练数据偏见通道,不伤本推论;若歧视幅度随群体身份与
  决策者的相对关系而变→支持内群体偏好通道仍然存在(或代理身份激活),
  本推论的核心被削弱或证伪。注意:此口径是判别性口径,非推论的独立预测——
  它用于区分"推论被证伪"和"推论被训练数据偏见掩盖"。

falsification_trace:
  primary_suspect: |
    (a)的因果链"AI无群体身份→内群体偏好触发条件不成立"的脆弱环节:
    (1)【群体身份≠人类专属】AI是否真的"没有群体身份"?算法开发团队
    的群体偏见可能通过训练数据/特征工程/评估标准的选择嵌入AI决策——
    此时AI虽无主观群体身份,但其决策实质上反映了开发团队的群体偏好,
    形成"代理内群体偏好"。若这条嵌入通道足够强,(a)被证伪——不是因
    AI有群体身份,而是因人类开发者通过AI行使了内群体偏好。
    (2)【测量灵敏度】若人类实验范式中的内群体效应本身较弱(如最小
    群体范式的效应量d≈0.3-0.5),在AI条件下检测"趋近于零"需要足够
    样本量——小样本下AI的零效应与人类的弱效应可能统计上不可区分,
    导致(a)的检验效力不足(false negative for falsification)。
    (3)【范畴锚定】BR-L2-006原文的群体身份概念建立在人类认知架构上
    (共享血缘/地域/信仰/最小标签→偏袒),本推论的核心操作——"AI没有
    群体身份"——需要首先确立BR-L2-006的群体身份概念是否排他性地限定
    为人类属性。若未来研究发现:任何体现稳定行为模式差异的实体(包括AI)
    均可被人类感知为"类似群体身份"并触发内群体偏好,则步骤2的"AI无
    群体身份"前提被瓦解——不是因为AI"有"群体身份,而是因为人类"把AI
    当作"有群体身份来对待。这对代理群体身份条件(预测iii)是支持,但对
    无代理身份条件(预测i)是潜在的虚假保证。
  secondary_suspect: |
    (c)代理群体身份重新激活——激活强度可能与想象中的不同:
    代理身份突显度(强/弱/无)的梯度效应可能远弱于预期,或因天花板效应
    (任何微弱的品牌暗示就足以触发完整的内群体偏好)而退化为二值效果。
    若低剂量代理身份即可完全重新激活内群体偏好,(i)的生态效度被削弱——
    因为现实中几乎不存在"零代理身份"的AI。
  unlikely_suspect: |
    BR-L2-006(内群体偏好存在)本身——跨文化跨物种稳健复现,极少是根源。
    BR-L2-026(AI-human不对称)的"无群体身份"枚举也相对稳固——AI确实
    没有身体/情感/群体归属,这些是事实陈述而非推测。
  note: |
    primary若被坐实(开发者的群体偏见通过AI嵌入→AI实质行使了代理内群体
    偏好),推论并非全面塌缩——预测(i)的强形式("AI天然免于内群体偏好")
    被证伪,但预测(iii)("代理身份可重新激活内群体偏好")反而被加强。
    此时的整改方向:将推论从"AI无群体身份消解内群体偏好"降级为
    "AI是否消解内群体偏好取决于代理身份的净效应(开发嵌入vs无身份)——
    两种相反力量同时存在,方向取决于哪条通道更强"。

excluded_outcomes:
  - outcome: "AI因训练数据偏见产生歧视(种族/性别/年龄等)"
    description: |
      训练数据偏见产生的群体歧视【会证伪预测(a)】——因为(a)测量的是AI决策中总群体gap,不区分歧视来源通道。但【不证伪内群体偏好通道被结构消除这一机制主张】——因为训练数据偏见和内群体偏好是两条独立因果通道,前者的存在不反驳后者的消除。区分两者的判据由预测(iv)提供:若AI的群体歧视方向随用户群体身份而变化→歧视走内群体偏好通道→机制主张也被证伪;若歧视方向固定→歧视走训练数据通道→机制主张存活但(a)被证伪,推论的实践意义大幅收窄。
  - outcome: "AI在非分配/裁判任务中表现出偏见(如内容生成/对话)"
    description: "本推论射程限于AI替代人类做分配/裁判决策的场景——其核心是'决策者对被评估者的群体身份敏感度'。AI在自由文本生成中可能表现出群体刻板印象,但这不走内群体偏好通道(没有明确的'决策者-被评估者'二元结构和分配行为),不提供对本推论的检验。"
  - outcome: "人类在被告知'AI辅助决策'后自身的内群体偏好是否改变"
    description: "本推论预测的是AI作为决策者时的群体偏差,不预测'知道AI会辅助/审核决策'是否改变人类自身的内群体偏好。若人类在AI监督下减少了内群体偏私(问责效应),是独立于本推论的机制,不证伪也不支持本推论。"

anti_talisman_clause: |
  【防不可证伪护身符——禁止由结果反推前件】

  (1) 禁止因"AI表现出群体歧视"就反推"AI一定有代理群体身份"。代理群体
  身份必须由独立于决策结果的操纵/测量确定(品牌标签/组织归属/操纵检验
  量表),不得将AI的歧视性输出本身作为"代理身份存在"的证据。若操纵检验
  确认代理身份不存在但AI仍表现出与人类同量级的内群体偏袒,(a)被证伪,
  不得诉求"隐性代理身份"。

  (2) 禁止因"人类条件的内群体效应不显著"就反推"该群体的内群体偏好
  本身弱"。内群体偏好的存在须由独立测量(Tajfel范式行为分配/群体认同
  量表)确认,不得因null result而事后降级该群体的偏好强度。

  (3) 禁止因"AI评分方差大"就反推"AI实质上走了类人群体身份推理"。
  评分方差的来源必须由独立分析确定(是群体身份敏感还是其他噪声),不得
  将方差本身作为机制证据循环使用。

  (4) 禁止因"代理身份未重新激活内群体偏好"就反推"代理身份突显度不够"。
  代理身份突显度由事前操纵强度定义,若在最高突显度(品牌+组织+语言提示)
  下仍未观测到重新激活,(c)被证伪——代理群体身份不是内群体偏好的重新
  激活通道。

  (5) 【训练数据偏见的非逃逸条款】若AI表现出群体歧视且经预测(iv)的
  判别分析确认为训练数据偏见通道→不伤本推论。但此判别必须严格:
  须证明歧视方向【不随】决策者与被评估者的相对群体身份而变化——
  即无论哪个群体的人使用该AI,AI对同一目标群体的歧视方向不变。
  若歧视方向随用户群体身份而变化(如A群体用户使用时偏袒A群体目标、
  B群体用户使用时偏袒B群体目标),则无论操纵检验是否检测到代理身份,
  (a)和(c)中至少一条被证伪。

  【削弱条件】若(a)仅在某些群体维度上成立(如性别但不适用于种族),
  推论射程收窄至此维度。若(a)(b)(c)均不成立,推论被全面证伪。

nontriviality_test: |
  2×2判据表(自变量档:决策者类型 人类 vs AI无代理身份 × 被评估者群体身份
  内群体 vs 外群体;被预测量:决策偏袒量——分配/评分的内外群体差异):

  格(人类,内群体)——高偏袒——「平凡格」——BR-L2-006直接预测此格:
  人类面对内群体目标时系统性偏袒。不是本推论的独有贡献。

  格(人类,外群体)——基线/低偏袒——「平凡格」——BR-L2-006隐含此格
  (偏袒限于内群体,外群体无额外偏袒)。

  格(AI无代理身份,内群体)——低/零偏袒——「非平凡格」——核心空格:
  在人类决策者中必然触发高偏袒的"内群体目标"条件下,AI决策者不产生
  系统性偏袒。此格非任何单一承重砖可平凡导出:
  - BR-L2-006单独:只描述人类的内群体偏好机制,不给"非人类实体面对
    内群体目标时的行为预测"——它沉默于AI的情况;
  - BR-L2-026单独:只枚举AI的有/无维度,不讨论这些维度如何影响AI在
    具体决策任务中的行为——它不说"因为AI无群体身份,所以AI在分配任务
    中不会偏袒内群体目标";
  - 两者焊接才产生此格的预测:BR-L2-006的触发条件(BR) + BR-L2-026的
    AI属性(无群体身份→触发条件不满足) → 空格预测。
  若此格被填满(AI无代理身份时仍对人类内群体目标产生系统性偏袒),
  核心主张被证伪。

  格(AI无代理身份,外群体)——低/零偏袒——「平凡格」——AI对外群体
  目标无偏袒与BR-L2-006一致(外群体本就不触发偏袒),也与BR-L2-026
  一致(AI无所谓内外)。

  brick=conclusion自查:'AI无群体身份→内群体偏好触发条件被绕过→AI中介化
  场景的群体歧视低于人类直接决策'未在任何承重砖中原文或近义出现。
  BR-L2-006的摘要为"人很容易偏袒自己人——即使按颜色标签这种没意义
  方式分出来的也照样偏心",不含AI或非人类决策者的任何陈述。
  BR-L2-026的摘要为"AI不是更聪明的人——在记忆/不累/海量信息上远超
  人类,但无身体体验、无真感情、不怕死",不含内群体偏好或群体歧视的
  任何陈述。预测(i)-(iv)均不在任何单一砖中。

real_world_anchors:
  supporting:
    - anchor: "AI简历筛选中的群体偏差对比研究"
      evidence: |
        多项现场实验和审计研究发现:当AI(无品牌/组织标识)替代人类HR进行
        简历初筛时,基于候选人姓名(种族/性别信号)的 callback 差异系统性
        小于人类HR。例如:通过对比同一个人力资源流程中人类筛选和算法筛选
        的种族/性别差距,算法筛选条件下的群体差距更小(Cowgill 2020,
        'Bias and Productivity in Humans and Algorithms'; Li et al. 2020,
        hiring algorithm audits)。但诚实标注:部分研究发现AI筛选同样