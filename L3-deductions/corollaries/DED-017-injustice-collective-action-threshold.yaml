id: DED-017
type: deduction
layer: L3-deductions
status: verified
term: "感知不公-集体行动临界推论 (Perceived Injustice — Collective Action Threshold)"

人话摘要: "单感到不公不会闹——得三个条件同时到位才会炸:不公都集中在看得见的一群人头上、这群人不是散沙能彼此通气、且没别的合法途径能翻盘。缺一条,不公要么忍一忍、要么变成'反正没用'的犬儒——不会上街。"

statement: |
  【核心】系统性的感知不公(非偶发、非孤立)不直接导致集体抗议/革命——需要越过一个多维临界点。
  临界点 = 不公集中在可辨识群体 × 该群体有预存组织(哪怕极松散) × 无可信改革渠道。
  三者缺一则感知不公停留在'抱怨'不转化成'行动'。
  越过临界后,'不公'本身提供协调聚焦点——你知道别人也觉得不公、你也知道别人知道你觉得不公(公共知识化),集体行动的协作成本爆降。

  【驱动量】不公集中度(受益/受损两群的资源差 × 群体可区分度,可事前测) × 预存组织密度(即使只是同村/同厂/同堂会,须独立于'是否爆发'的结果测量) × 改革渠道可信度(由制度结构事实+非结局侧程序事实测,不得用'是否已爆发'反推)——三者缺一则驱动量低于临界,不公转犬儒不转行动。

  【预测】
  (i) 满足三条件(不公集中在可辨识群体 + 有预存组织 + 无改革渠道)的案例,集体抗议/革命爆发的概率显著高于仅满足任二或任一的案例。
  (ii) 三条件不全但持续存在感知不公的案例,不公转化为'普遍犬儒/burnout'而非'集体行动'(不同渠道走出来)。
  (iii) 逐格判空:三条件全满足 + 长期感知不公 + 长期无集体行动 → 这一格预测为空(短期的可被外部镇压解释→非净杀)。

  【判别·防平凡化】与Gurr(相对剥夺)/Davies(J-curve→革命)等经典'grievance→revolt'理论判别:本条的独有可证伪贡献是(i)不公作为公识焦点(coordination device)的归因而非仅作为动机(grievance)——公识机制有特定的必要条件(三个)可独立测;(ii)预测'三缺一→不公转犬儒不转行动'是经典理论未做的区分(经典只能预测'不满足→revolt',不自证空条件)。primary_suspect:三条件是否比更简化的双条件(不公+预存组织)真正增加了预测精度——三变两是否仍然一样好。

operationalization:
  不公集中度:
    definition: |
      感知不公是否集中在可辨识的社会群体身上——而非弥散地分布在互不相识、无法归类的个体之间。操作化为:受益/受损两群在关键资源(收入/土地/权利/机会)上的差距 × 群体的可区分度(按可事前编码的标识:族群/阶级/地域/行业/代际等)。
    measurement: |
      资源差距由收入/财富/土地分配统计(Gini/分位数比)独立测;群体可区分度由社会分类的事前编码(语言/姓氏/居住隔离度/行业归属等)独立测。
      【不得】用'是否已爆发抗议'反推'必然集中'。
    limitations: "集中度是连续量,不是二分;弥散不公(如随机失业)虽个体受害但不触发本机制。"

  预存组织密度:
    definition: |
      受不公集中的群体内部,是否已有任何形式的组织/网络——从正式组织(工会/行会/宗亲会)到非正式网络(同村/同厂/同堂会/同教会/邻里)都算。关键不在'正式程度',而在'能否使群体成员彼此通气和协调'。
    measurement: |
      按社会组织密度的事前指标独立测:协会/工会/宗亲会/教会/同乡会的登记数或民族志记录;非正式网络(居住相邻度/共同工作场所/共同仪式参与)由居住/就业/宗教参与数据测。须独立于'是否爆发'测——不得因爆发了就事后补认'原来有隐性组织'。
    limitations: "非正式网络的有无和密度在史料中常难精确量化,需诚实地按'有/无/不明'三级归类。"

  改革渠道可信度:
    definition: |
      是否存在可被受损群体相信的、在不掀桌的前提下纠正不公的制度化渠道——包括选举/代议(轮替)、申诉/司法救济(申诉)、安全退出/迁移(退出)等。伞级判据='给受损群体一条不掀桌也有改善可能的路'。
    measurement: |
      由制度结构事实独立测:有无成文的选举/代议/申诉/司法救济/自由迁移条款,以及这些渠道在常规、非危机运作中是否被例行援引执行过。
      【禁止结果侧代理】不得用'是否已爆发'反推'必无改革渠道'——须由制度结构事实+非结局侧程序事实独立测。
    limitations: "可信度是连续量(纸面有、从未兑现 = 低可信);渠道关闭可由镇压/废除/架空发生,需独立编码。"

  集体行动爆发:
    definition: |
      集中的、跨个体的、公开的、以改变不公现状为诉求的协调行动——抗议/示威/罢工/暴动/革命均算,规模≥小规模地方性事件。
    measurement: |
      由独立事件数据库(如SCOOP/NAVCO/ACLED)或史料独立编码:是否有≥N人的公开协调抗议/暴力集体行动发生。
      【与自变量独立测】事件编码与不公集中度/组织密度/改革渠道的测量使用不同的数据源和编码者。
    limitations: "阈值N的设定影响灵敏度;小型地方事件和大型全国运动需明确区分标准。"

derivation:
  from_l1:
    axioms: [AXIOM-001]
    theorems: [THEOREM-position]
  from_l2:
    bridging: [BR-L2-013, BR-L2-014, BR-L2-006]
  steps: |
    1. "感知不公有自动情绪反应(BR-L2-013)——但个体愤怒不足以产生集体行动"
       BR-L2-013给:人对不公平分配有自动的负面情绪反应。但这只解释了个体的'不满',不解释为何不满会【协调成集体】行动——搭便车问题(我出头你受益)使个体理性的反应是'忍'而非'出头'。此步诚实:BR-L2-013给动机、不给协调。

    2. "不公集中在可辨识群体时,第三方惩罚降低个人行动成本(BR-L2-014)——真发动机之一"
       BR-L2-014给:人愿付代价惩罚不公——当不公集中在某一群体时,被集中的受害者获得同群体旁观者(第三方惩罚者)的成本分担。同群中有人出头,其他人因第三方惩罚冲动而愿分担风险(声援/加入/掩护),个体的'出头成本'下降。此步是BR-L2-014的非平凡延伸:BR-L2-014本身只说'人愿罚不公者',不说'群体集中度→成本分担→行动门槛降低'。

    3. "'我们这伙人被欺负了'通过内群体偏好强化集体身份(BR-L2-006)——真发动机之二"
       BR-L2-006给:内群体偏好使'我们'这个身份带有自动的偏袒和团结效应。不公集中在可辨识群体 → 刺激群体边界硬化('被欺负的人'变成内群体)→ 内群体偏好激活 → 动员效率提升。此步将BR-L2-006从'任意标签也致偏'窄化为'不公刺激群体边界硬化并动员'——BR-L2-006本身不区分边界硬化的诱因。

    4. "无改革渠道 → 翻盘希望为零 → 掀桌理性化(DED-011支撑)"
       DED-011给:无可信翻盘机制(轮替/退出/申诉等伞级判据下俱缺)时,败方无未来预期 → 走向僵局/清洗/分裂。将此逻辑从【组织内派系动态】平移至【受损群体vs体制】:若有可信改革渠道(选举/申诉/退出),受损群体的理性策略是'走渠道';无渠道时,'忍'不再是局部最优——'翻盘希望=0 → 掀桌变成理性'。

    5. "THEOREM-position:受影响必有立场→不公集中→同立场聚合→集体行动结构基底"
       THEOREM-position(有目标+牵涉利益⇒必有立场)给出:受损群体的每个成员对不公必有'希望改变'的立场。不公集中在同一可辨识群体 ⇒ 所有受损者的立场方向一致(都反对不公)⇒ 立场同向聚合 → 形成集体行动的潜在结构基底。此步偏近定义(立场定理近乎界定),不是非平凡发动机,诚实点明。

    6. "合成:三条件 × 公识聚焦 → 临界效应"
       前三步(不公感知+不公集中→成本分担+群体边界硬化)给协调潜力;第四步(无改革渠道)给'忍的局部最优消失';第五步(立场定理)给同向立场结构基底。三者【同时到位】时,不公本身通过公识效应(common knowledge)成为协调聚焦点:你知道别人也觉得不公、你也知道别人知道你觉得不公 → 协作成本爆降 → 越过临界、集体行动从'非理性'变成'个人理性'。
       【非平凡性(逐格判空)】BR-L2-013单独只给'人不喜欢不公'(给动机、不给协调);BR-L2-014单独只给'人愿罚不公'(给执行、不给群体条件);BR-L2-006单独只给'偏袒自己人'(给团结、不给'何时边界硬化');THEOREM-position偏近定义;DED-011是组织内派系动态、非群体抗议。五者【都不】给出"三条件同时到位→临界→公识聚焦→集体行动"这一合成效应,也【都不】给出预测(ii)'三缺一→不公转犬儒不转行动'。"三条件全满足 + 长期感知不公 + 长期无集体行动"这一格被预测【为空】、且可被现实反例填上(非同义反复)。唯合成给出。

falsifiability: |
  本推论可被以下发现证伪:
  (a) 找到一个案例:不公集中在可辨识群体(由不公集中度独立测确认)、该群体有预存组织/网络(由组织密度独立测确认)、无任何可信改革渠道(由制度结构事实独立测确认)、且有【长期持续的】系统感知不公——但长期无任何集体抗议/革命爆发,且【不能用外部镇压充分解释】(镇压可短期压制、不能长期维持零行动——若镇压持续有效正是"无改革渠道"的一部分、不构成净杀;但若镇压撤除/减弱后仍无行动,则命中空格)。⇒ 证伪核心。
  (b) 集体抗议/革命的爆发概率与'三条件是否同时满足'无系统关联——不公集中度/预存组织/改革渠道三个维度中任一个单独就足以预测(即双条件或单条件的预测精度与三条件无异)。⇒ 证伪"临界是三条件的联合效应"。
  (c) 三条件不全但持续感知不公的案例,其'犬儒/burnout'的发生率【不高于】三条件全满足的案例(即犬儒率与条件数无关或反方向)。⇒ 证伪预测(ii)"不公走不同渠道"。

falsification_trace:
  primary_suspect: |
    最弱腿:"三条件是否比双条件(不公集中+预存组织)真正增加了预测精度"——即'无改革渠道'这一条件是否独立贡献。若实证显示双条件(不公集中+预存组织)已足以区分'爆发vs不爆发'、'无改革渠道'没有独立增量预测力,则三条件退化为二条件——损失的是'无渠道→掀桌理性化'这一独特机制链路。此腿最先受检。
  secondary_suspect: |
    '不公作为公识焦点'的机制——即'公共知识化→协作成本爆降'是否真的是临界效应的因果通道,而非仅仅是相关。公识(focal point)本身难以直接观测;可用代理(如'不公事件的大众传播度'作为公识强度的代理)间接测。
  unlikely_suspect: |
    BR-L2-013(不公厌恶)本身——跨物种/跨文化复现极其稳健,极少是根源。

excluded_outcomes:
  - outcome: "偶发/孤立的不公事件(非系统性)"
    description: |
      前件'系统性感知不公'不成立,出射程。判定按不公是否持续/跨个体/有模式,而非按结果开脱。
  - outcome: "短期被外部镇压压制而暂无行动"
    description: |
      三条件全满足 + 感知不公 + 集体行动被暴力镇压短期压制 → 不是净杀空格。镇压撤除/减弱后若仍无行动、或镇压长期维持(数十年)且不公仍在,才命中空格。判定:镇压存在与否由独立证据(军警部署/戒严/镇压记录)测,不用'无行动'反推'必被镇压'。

anti_talisman_clause: |
  【防不可证伪护身符】判定'是否满足三条件'时,每个条件必须由独立的结构指标测,不得由'是否已爆发'反推:
  - 不公集中度:由资源差距统计+群体可区分度的事前编码测,不得因爆发了就事后认定'必然集中'。
  - 预存组织:由社会组织登记/民族志/居住就业数据独立测,不得因爆发了就事后补认'原来有隐性网络'。
  - 改革渠道:由制度结构事实+非结局侧程序事实测,不得因爆发了就反推'必无渠道',也不得因无爆发就反推'必有渠道'。
  尤其【不得】遇到'三条件全满足却长期无行动'的反例,就事后硬塞一个'其实镇压一直有效'或'其实有隐性改革渠道'来消化——镇压/渠道的在场须由独立证据坐实。

nontriviality_test: |
  逐格判空(自变量 = 不公集中[有/无] × 预存组织[有/无] × 改革渠道[有/无];被预测量 = 集体行动爆发[是/否]):
    - 三条件不全的格(共7格):预测行动爆发概率低于三条件全满足格,且不公转犬儒而非转行动——非空(多现实案例填充:零散失业者不满无组织→犬儒化;有渠道的集中受损群体→走选举/司法而非上街)。
    - 三条件全满足 + 长期感知不公 + 无外部镇压压制 → 预测爆发集体行动 ⇒ 非空(多现实案例:法国大革命前第三等级/1989东欧/阿拉伯之春前Tunisia)。
    - 三条件全满足 + 长期感知不公 + 长期无集体行动 + 且可用外部镇压充分解释 → 非空格(镇压解释了为何无行动)。
    - 三条件全满足 + 长期感知不公 + 长期无集体行动 + 镇压撤除/减弱后仍无行动 → 【预测为空】(核心空格)。
  该空格是真经验主张,非被砖平凡强制:
  BR-L2-013只给'人不喜欢不公'(给动机、不给临界条件);BR-L2-014只给'人愿罚不公'(给执行、不给'三条件须齐全');BR-L2-006只给'偏袒自己人'(给团结、不给'三缺一→犬儒'渠道切换);THEOREM-position偏近定义;DED-011讲组织内派系、非群体抗议。五者【都不】给出"三条件全部必须到位、缺一不公走不同渠道"这一合成临界结构。空格可被'三者全满足但长期无行动且非镇压压制'的现实反例填上 ⇒ 非空可满足、非同义反复。

real_world_anchors:
  supporting:
    - anchor: "法国大革命前第三等级(三条件全满足 → 爆发)"
      evidence: |
        不公集中在可辨识群体(第三等级 vs 特权等级,群体边界清晰);预存组织在场(三级会议本身+巴黎各区议会+俱乐部网络);改革渠道关闭(1787-1788显贵会议失败、高等法院被压制、三级会议程序争议)→ 1789爆发。
      independent_test: |
        等级制度(成文法)确定群体可区分度;三级会议召集记录+俱乐部登记确定预存组织;显贵会议/高等法院记录独立确定改革渠道关闭(非由'爆发了'反推)。
      confidence: "moderate(多因交织,只作方向性支持)"

    - anchor: "1989东欧剧变(三条件全满足 → 爆发)"
      evidence: |
        不公集中:经济停滞+政治压制集中在可辨识的'普通公民 vs 党国精英'群体;预存组织:教会(东德/波兰)、工会(波兰团结工会)、知识分子网络;改革渠道关闭:一党制无轮替、无独立司法、戈尔巴乔夫改革信号与本地压制矛盾 → 1989连锁爆发。
      independent_test: |
        精英-大众差距由经济统计独立测;教会/工会由登记/民族志独立测;一党制制度结构(宪法规定的领导党地位)独立测改革渠道关闭。
      confidence: "moderate"

    - anchor: "长期感知不公 + 三缺一(无预存组织)→ 犬儒非行动"
      evidence: |
        某些原子化社会:感知不公广泛存在(收入不平等高、腐败感知强),但受损群体无任何预存组织/网络(原子化个体,被刻意打散或从未形成),不满长期表现为'普遍犬儒/退出公共生活/私下的抱怨',而非集体行动。
      independent_test: |
        不公由调查/统计独立测;组织缺失由社会组织密度指标独立测(非由'无行动'反推)。
      confidence: "weak-moderate(史料中'为何没组织'常难独立证,需诚实标注因果方向不确定性)"

    - anchor: "长期感知不公 + 三缺一(有改革渠道)→ 制度化表达非革命"
      evidence: |
        某些民主政体:不公集中(阶级/族群不平等) + 预存组织(工会/民权组织) + 但有可信选举/司法渠道 → 不满走制度化表达(选举换人/诉讼/游说),不走上街革命。例:罗斯福新政前美国工人阶级——有工会(预存组织)、有投票权(改革渠道),走选举+罢工谈判而非暴力革命。
      independent_test: |
        选举/司法渠道的成文制度+例行运作记录独立测其可信度。
      confidence: "moderate"

  counterexamples: []

  boundary_cases:
    - case: "阿拉伯之春前Tunisia(三条件全满足 + 长期无行动 → 后爆发)"
      analysis: |
        看似'长期无行动'但最终爆发 → 非空格,正是预测所期:条件积累到位后临界爆发。不算反例。
      status: "boundary_case"

    - case: "长期被高度镇压的封闭社会(如北韩)——三条件难独立测"
      analysis: |
        感知不公是否存在、预存组织是否存在、改革渠道是否关闭——三个自变量在高度封闭社会中难以独立测(信息不透明)。若三条件经独立测确认全满足、长期无行动,且镇压是唯一解释 → 在排除项(excluded_outcomes)范围内,非净杀。
      status: "boundary_case"

discriminant_validity: |
  【与Gurr「相对剥夺→政治暴力」(Why Men Rebel, 1970)的判别】
  Gurr的核心是:感知到的'应有'与'实有'之间的差距(相对剥夺)的强度和范围直接预测政治暴力的概率和强度——grievance作为动机驱动revolt。Gurr不给'三条件同时到位的临界结构',不给'不公作为公识焦点(coordination device)的归因',也不给'三缺一→不公转犬儒不转行动'这一渠道切换预测。本推论【独有可证伪内容】:(i)不公的因果角色从'动机(grievance)'转向'协调装置(coordination device)'——公识机制需要三个独立可测的必要条件;(ii)预测'三缺一→不公转犬儒不转行动'这一【非爆发】出口——Gurr框架不自证为何有时候不公不转暴力(只能事后归因'相对剥夺不够强',近循环)。

  【与Davies「J-curve→革命」的判别】
  Davies的核心是:长期增长后突然下降(J-curve)产生的'期望-现实落差'导致革命。仍是grievance→revolt范式,只是细化了grievance的时间形态。本推论超越其之处:时间形态(J-curve)是'不公感知'的子类(Davies可被吸收为'系统性不公'的一种时间模式),但不公本身不产生集体行动——J-curve社会若缺预存组织或无群体集中,不公同样转犬儒而不转行动。

  【防平凡化守卫】
  非平凡【不在】'不公导致不满'(那被BR-L2-013和grievance范式覆盖、非卖点),而在:①不公的因果角色从grievance转向coordination device——三个条件同时到位的不公才有公识效应、才能协调集体行动;②'三缺一→不公走不同渠道(犬儒 vs 行动)'这一分流预测,是经典grievance→revolt理论未做、也不自证空的区别。

review_summary: |
  r1 verified。
  核心载重新意在不公的因果角色从 grievance 转向 coordination device(三条件同时到位的公识效应→协作成本爆降)+"三缺一→不公转犬儒不转行动"渠道切换预测+空格预测(三条件全满足+长期不公+长期无行动且非镇压压制→预测为空),三者皆在 Gurr/Davies 等经典 grievance→revolt 范式之外、可独立测可证伪;反例猎捕无活反例。
  全档见 ADV-REVIEW-022。

