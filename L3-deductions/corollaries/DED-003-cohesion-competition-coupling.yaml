id: DED-003
type: deduction
layer: L3-deductions
status: verified*

term: "内聚-外竞耦合推论 (Cohesion-Competition Coupling Corollary)"

statement: |
  大规模人类群体的内部凝聚力与外部竞争压力之间存在结构性耦合。
  这种耦合不是心理倾向——它是群体身份信息的维护成本结构使然。

  核心机制：
  (a) 维持大规模群体的共享身份需要持续的维护投入——
      时间（集体活动）、物质资源（仪式/机构）和制度容量
      （专门维护身份的机构）（THEOREM-group-identity-decay）

  (b) 外部竞争者的存在降低了身份维护的投入需求——
      "我们不是他们"作为一种身份锚定方式，只需要"他们"在那里
      就自动运作（BR-L2-006: 内群体偏好）

  (c) 当外部竞争者消失时，同等身份维护投入产生更少的凝聚力产出。
      如果组织不增加替代维护机制的投入，身份凝聚力会衰减。

  (d) 关键限定：外部竞争是身份维护投入的替代品，而非唯一来源。
      存在多种正面维护机制（民主参与、经济共享、文化仪式、
      公民教育）可以替代外部竞争的角色。
      推论预测的是：如果不能或没有增加替代投入，凝聚力会衰减。
      不是预测：所有和平社会都必然碎片化。

  这区别于社会心理学的"rally-around-the-flag"效应：
  后者描述短期情绪反应；本推论描述长期结构性约束——
  情绪反应是结构约束的一个表现，而非替代解释。

# === 规则 A：操作化定义 ===

operationalization:
  maintenance_investment:
    definition: |
      群体为维持共享身份认同而投入的复合资源。
      由三个可独立测量的维度构成。
    dimensions:
      time_investment:
        definition: "每个成年成员每年参与集体身份活动的平均小时数"
        measurement: "包括：国家/群体庆典、公共仪式、公民教育活动、集体纪念活动。通过时间使用调查测量。"
        unit: "小时/人/年"
      material_investment:
        definition: "政府或核心机构每年在身份维护上的货币支出"
        measurement: "包括：文化/教育/宣传/庆典预算中专门用于身份维护的部分。占 GDP 或总支出的比例。"
        unit: "货币/人/年 或 %GDP"
      institutional_capacity:
        definition: "专门从事身份维护工作的全职等效人员数"
        measurement: "包括：教育系统中历史/公民课程的教师比例、文化机构的编制数。占劳动力的比例。"
        unit: "FTE/万人"
    limitations: |
      - 三个维度的权重在不同的社会背景下可能不同
      - "身份维护"和"教育/文化"之间的界线在某些预算类别中模糊
      - 隐性身份维护（家庭内部的价值观传递）难以量化
      - 这些指标提供的是数量级比较而非精确当量

  internal_cohesion:
    definition: |
      群体成员对共享身份的认同强度和行为表现。
    indicators:
      separatist_support:
        definition: "区域主义/分离主义政党在次国家级选举中的得票率"
        measurement: "次国家级选举结果。次群体 = 按历史/语言/文化定义的区域。上升趋势表示凝聚力减弱。"
      national_identity_strength:
        definition: "在身份调查中选择国家身份 > 次国家身份的受访者比例"
        measurement: "标准化身份调查（如 ISSP National Identity 模块）。差值缩小表示凝聚力减弱。"
      collective_action_participation:
        definition: "全国性集体行动（非罢工/非抗议）的成年人口参与率"
        measurement: "如志愿者率、献血率、全国性慈善捐款率。下降趋势表示凝聚力减弱。"
    limitations: |
      - 单一指标不可靠——需要使用复合指标
      - 区域主义投票可能是对经济政策的不满而非身份分离
      - 调查数据在威权国家可能存在社会期望偏差

  external_competition_pressure:
    definition: |
      存在明确的、被广泛感知的外部竞争者。
    measurement: |
      三个维度（任一满足即可）：
      (a) 军事威胁：存在领土争端或军事对峙
      (b) 经济竞争压力：存在被广泛感知的经济竞争对手
      (c) 意识形态对手：存在被广泛感知的意识形态/价值观对手
      通过精英言论分析 + 公众舆论调查确认"广泛感知"。
    limitations: |
      - "广泛感知"是一个连续变量而非二元变量
      - 经济竞争对手的认定高度主观
      - 外部威胁的"存在"和"被感知到"之间的差距可能很大

  maintenance_mechanisms:
    definition: |
      群体可以部署的身份维护机制类型。
    known_types: |
      以下是事前枚举的已知类型。新型机制不应在事后添加来解释意外的凝聚力：
      (1) 外部竞争锚定 — "我们不是他们"（成本：低，需要外部竞争者存在）
      (2) 民主参与 — 全民公投/选举/公民大会（成本：中，需要制度基础设施）
      (3) 共享经济利益 — 经济增长/再分配/福利国家（成本：高，需要经济基础）
      (4) 文化仪式 — 庆典/纪念/宗教活动（成本：中，需要文化传统或构建）
      (5) 公民教育 — 学校历史/公民课程/国家叙事（成本：中，需要教育系统）
      (6) 外部使命 — 国际领导/人道主义/全球角色（成本：中，需要国际地位）
      (7) 跨群体联盟 — 多元交叉身份/联邦制/自治安排（成本：中，需要制度设计）
    limitations: |
      - 这个分类是开放的——可能存在未枚举的机制
      - 但在实践中，任何新提出的类型应该在检验推论之前被枚举
      - 机制的"成本"是相对于社会资源总量而言的

# === 推导链 ===

derivation: |
  from_l1:
    axioms: [AXIOM-001, AXIOM-003]
    theorems: [THEOREM-group-identity-decay, THEOREM-competition-norm]
  from_l2:
    bridging: [BR-L2-003, BR-L2-006]

  steps:
    1. "大规模合作需要共享身份 (BR-L2-003)"
      BR-L2-003: 人类大规模合作依赖于共享规范和"想象秩序"——
      关于"我们是谁"的集体信念。这不是装饰——它是陌生人之间
      合作的信息前提（THEOREM-cooperation-precondition）。

    2. "共享身份需要维护投入 (THEOREM-group-identity-decay)"
      共享身份是分布在多个成员认知中的信息模式。
      信息服从熵增——无维护则衰减。
      维护投入可以是时间、物质资源或制度容量。
      投入不足 → 身份信息衰减 → "我们"的边界模糊 → 凝聚力下降。

    3. "外部竞争锚定是成本最低的维护方式 (BR-L2-006)"
      内群体偏好的存在（BR-L2-006: IEA=1.5）意味着
      负面身份定义（"我们 ≠ 他们"）是极其自然的。
      这种定义方式几乎不需要主动投入——
      只要"他们"在那里，"我们"就有了一个免费的对比锚点。

      与之对比，正面定义（"我们是 X"）需要持续构建和刷新 X 的内容。
      这需要更多的主动投入——仪式、叙事、利益分配。

      注意：这里的"成本"指维护投入的三个维度（时间/物质/制度），
      不是热力学能量。L0 的物理约束（AXIOM-002）保证了信息必然衰减；
      但维护投入的"量"是社会层面的资源分配，不可直接化为焦耳。

    4. "外部竞争消失 → 维护投入-凝聚力转化率下降"
      当外部竞争者消失时：
      (i) 最廉价的维护机制（外部对比锚定）不再可用
      (ii) 如果要维持同等凝聚力，需要增加其他机制的投入
      (iii) 如果其他机制的投入未增加——或增加的不足以补偿——
          凝聚力下降

      关键限定：这不是说"所有和平社会都会碎片化"。
      它在说：存在一个维护投入-凝聚力的预算约束。
      不同的社会有不同的初始维护投入水平和预算弹性。
      那些严重依赖外部竞争锚定的社会（即维护投入组合中
      外部锚定占比高的）在失去外部竞争者时受到的冲击最大。
      那些已经有多元维护机制（民主参与、文化仪式、共享经济）
      的社会在失去外部竞争者时影响较小。

    5. "可检验的预测"
      预测 A: 当一个政治实体失去其主要外部竞争者，
      且事后 10 年内未显著增加至少一种其他维护机制的投入，
      其内部凝聚力指标将在 10-30 年内出现可测量的下降。

      预测 B: 失去外部竞争者后凝聚力下降的幅度，
      与失去前该实体对外部竞争锚定的依赖程度成正比。
      （依赖程度 = 在精英和公众话语中，外部竞争/威胁叙事
      在身份话语中的占比。）

      预测 C: 如果政治实体在失去外部竞争者的同时，
      显著增加了替代维护机制的投入（超过前 10 年平均水平的 50%），
      凝聚力衰减将被部分或完全抵消。

      ⚠️ 反例免疫性检查：预测 A+C 不构成逻辑闭环——
      因为"显著增加替代投入"有独立的事前操作化定义
      （≥ 50% 增长），且维护机制类型必须在事前枚举（见 operationalization）。
      如果发现一个社会：外部竞争者消失 + 替代投入未增加 +
      凝聚力未下降——这是预测 A 的直接证伪。

# === 可证伪性 ===

falsifiability: |
  本推论可被以下任一发现证伪：

  (a) 发现至少 3 个独立的大规模政治实体（人口 > 100 万），
      其同时满足：
      - 失去主要外部竞争者 > 30 年
      - 替代维护机制投入未增加（< 50% 增长，任意维度）
      - 内部凝聚力指标未下降（在所有三个指标上无显著趋势）
      这将在统计上构成推论的证伪。

      **瑞士检验：** 瑞士满足前两个条件（长期和平 + 低仪式投入增长），
      但需要检验第三个条件。以下证据支持第三个条件也满足：
      - 瑞士的全民公投制度提供了极高频率的身份参与
        （每年 3-4 次全国公投，每人每年数小时的政治参与时间）
      - 这属于维护机制类型 (2) 民主参与——
        瑞士在失去外部威胁后以公投替代了外部锚定的功能。
      - 关键检验：如果瑞士的凝聚力确实未下降且公投参与率
        在和平期显著高于战争期——则符合预测 C，
        瑞士从"潜在反例"变为"验证推论"。

  (b) 发现外部竞争压力与内部凝聚力之间在统计上无显著相关性——
      即没有比随机水平更强的证据表明失去外部竞争者的社会
      经历了更快的凝聚力衰减（相比于未失去外部竞争者的社会）。

  (c) 发现预测 B 被系统性地违反——
      即对外部锚定依赖程度低的社会反而在失去外部竞争者后
      经历了更大的凝聚力下降。

falsification_trace:
  primary_suspect: "外部竞争锚定的低成本假设——如果负面对比实际上并不比正面构建便宜（即需要同样多的主动维护投入），那么外部竞争者的消失不会导致维护投入-凝聚力转化率下降。这将削弱推论的因果机制——虽然身份维护的成本约束仍然存在，但外部竞争的'特殊角色'不成立。"
  secondary_suspect: "维护投入的操作化——如果时间投入/物质投入/制度容量不能有效刻画身份维护的实际投入量，推论的量化预测无法检验。需要承认这些指标是代理而非直接测量。"
  unlikely_suspect: "群体身份必然衰减的前提（THEOREM-group-identity-decay）——但该定理直接从 AXIOM-002（信息熵增）推导，是逻辑必然而非经验命题。"

# === 排除的结果 ===

excluded_outcomes:
  - outcome: "外部竞争消失 + 零替代投入增加 → 凝聚力无变化（多案例）"
    description: |
      至少 3 个独立的大规模政治实体（> 100 万人口），
      其失去了主要外部竞争者 ≥ 30 年，
      且未显著增加任何其他维护机制的投入（在所有三个维度上 < 50% 增长），
      且内部凝聚力的三个指标均无下降趋势。
    testability: |
      如果存在这样的案例，推论在实践上被证伪。
      目前已知的最佳候选检验案例是瑞士——
      对其公投制度作为替代维护机制的判定将决定它是反例还是验证。

  - outcome: "外部竞争增加但内部凝聚力下降"
    description: |
      一个政治实体在面临加剧的外部竞争压力时，
      内部凝聚力指标反而显著下降。
    testability: |
      这在逻辑上可能但推论的机制预测它不应该发生——
      外部竞争者的存在降低了身份维护成本。
      如果发现多个此类案例，推论的因果机制需要修正。

# === 现实锚点 ===

real_world_anchors:
  supporting:
    - anchor: "冷战结束后的南斯拉夫解体"
      evidence: |
        南斯拉夫在冷战期间处于东西方阵营之间——明确的外部压力
        维持了联邦的凝聚力锚点。冷战结束后外部压力消失。
        联邦在 1991-1992 年间解体为多个国家。
        推论的预测：南斯拉夫严重依赖外部竞争锚定（其"不结盟"身份
        本身就是以两大阵营为对照定义的），且未能在冷战结束前
        建立足够的替代维护机制——凝聚力下降 → 解体。
        与标准政治科学解释的关系：标准解释（铁托之死、经济危机、
        民族主义动员）描述的是近因——推论描述的是深层结构约束。
        两者不矛盾——深层约束定义了系统对近因冲击的脆弱性。
      confidence: moderate

    - anchor: "911 事件后的美国民族团结——时间尺度检验"
      evidence: |
        2001 年 9/11——外部威胁突然出现和感知。
        总统支持率 50% → 90%（数周内），跨党派合作急剧增加，
        国家身份认同飙升。2-3 年后消退到基线。
        推论的预测 C：外部威胁出现 → 负面身份锚定即时激活 →
        凝聚力迅速回升——不需要时间构建正面叙事。
        预测 A：威胁显著性衰减 → 如果未建立正面维护机制，
        凝聚力回落到基线。时间常数（2-3 年）与推论的预测方向一致。

        与标准"rally-around-the-flag"解释的关系：
        标准解释描述的是现象（威胁→团结）和近因心理机制。
        推论提供了深层结构约束——为什么这个效应是即时的
        （负面锚定不需要构建）、为什么它是暂时的
        （不替代正面维护则衰减）。推论超越了"描述现象"。
      confidence: strong

    - anchor: "欧盟次群体的身份运动"
      evidence: |
        苏格兰独立公投（2014）、加泰罗尼亚独立运动（2017）、
        Brexit（2016）——这些发生在欧盟成功消除了成员国之间的
        传统安全竞争的背景下。
        推论预测：当国家层面的外部竞争者减弱时（EU 消除了
        法德等传统对手之间的安全竞争），次国家层面的身份会活跃。
        因为"法国 vs 德国"这个外部锚定不再可用——
        苏格兰不再需要"英国"来防御法国——次群体的身份空间扩大。

        与标准解释的关系：标准解释指向民主化、全球化、
        福利国家压力。但这些是必要条件——它们解释了"为什么
        次群体运动在现在而不是 50 年前"，但推论解释了
        "为什么次群体运动在高外部威胁时期系统性较弱"。
      confidence: moderate

  counterexamples:
    - case: "瑞士 (1815-至今)"
      analysis: |
        瑞士是推论最重要的检验案例：
        - 人口 > 800 万（远超 100 万阈值）
        - 多语言群体（德/法/意/罗曼什）
        - 持续和平 > 200 年（1815 至今）
        - 1847 年内战（Sonderbund）后 179 年无内部武装冲突
        - 国庆日直到 1994 年才成为全国假日
        - 凝聚力指标：极高且稳定

        这是否证伪推论？
        答案取决于瑞士的替代维护机制是否"显著高于基线"。

        瑞士的全民公投制度是关键：每年 3-4 次全国公投，
        公民平均每年投入数小时在政治参与上。
        公投不是"正式仪式"——但它是极高频率的集体决策体验——
        "我们一起决定了这件事"是强有力的正面身份构建。
        这属于维护机制类型 (2) 民主参与。

        如果瑞士的公投参与率在 1815 年后的和平期显著高于
        此前的战争期，则符合预测 C——瑞士是一个验证案例：
        它用一个高成本的正面机制（民主参与）替代了外部锚定。
        如果公投参与率与战前无显著差异，则瑞士是推论的证伪。

        当前裁定：瑞士是否是反例取决于公投参与率的历史数据。
        如果没有这些数据，瑞士应被标记为未解决——既非验证也非证伪。
      status: unresolved_requires_data

    - case: "二战后日本"
      analysis: |
        日本：自 1945 年以来 ~80 年无外部军事威胁。
        宪法第九条放弃战争权。高内部凝聚力。

        分析：日本在战前严重依赖外部竞争锚定（军国主义 =
        以欧美为对照的"国体"身份）。战后外部锚定突然消失。
        但日本同时经历了：
        - 维护机制 (2) 民主参与——新宪法下的民主体制
        - 维护机制 (3) 共享经济利益——战后经济奇迹
        - 维护机制 (5) 公民教育——战后教育改革

        这些替代机制的引入时间与外部锚定的消失时间重叠——
        使得"未增加替代投入"的条件不成立。日本不是预测 A 的
        检验案例——它不能证伪推论，因为它不满足反例条件。
      status: not_a_counterexample

    - case: "加拿大 (1867-至今)"
      analysis: |
        加拿大：自 1867 年以来无内战，外部威胁极小。
        魁北克分离主义在 1995 年公投后下降。

        分析：加拿大在 20 世纪末至 21 世纪初的魁北克分离主义
        活跃时期与推论预测的方向一致（北美外部威胁低）。
        但 1995 年后魁北克分离主义的下降与以下因素有关：
        - 加拿大最高法院关于分离合法性的裁决（1998）
        - Clarity Act（2000）——提高了分离门槛
        - 联邦制中魁北克的实质性自治权

        制度设计（维护机制类型 7: 跨群体联盟/联邦制）
        提供了一种处理内部裂痕的方式——虽然不一定减少
        身份差异，但降低了分离的成本-收益比。

        加拿大案例同时包含支持（1867-1995 年的魁北克民族主义
        上升期与低外部威胁期重叠）和挑战推论的要素
        （制度设计可以管理而不消除内部裂痕）。
      status: mixed

  boundary_cases:
    - case: "中国王朝周期的身份维度"
      analysis: |
        中国历史上统一王朝的寿命通常在 200-300 年。
        王朝初期经历统一战争（高外部竞争 → 高凝聚力），
        中期和平繁荣（外部压力减弱 → 维护成本上升），
        晚期内部叛乱（凝聚力衰减的终端表现）。

        但王朝周期有太多混淆变量：财政崩溃、人口压力、气候、
        精英腐败。难以分离出身份维护成本的独立贡献。

        宋朝是一个有趣的定性对照：面对持续的外部威胁（辽/金/蒙古），
        宋朝在相对长的时间内维持了内部凝聚力——尽管军事上弱势。
        这与推论的预测方向一致（高外部威胁 → 较低的维护成本），
        但不能排除其他因素（经济发展、科举制度、文化繁荣）。
      status: boundary_case

