id: DED-024
type: deduction
layer: L3-deductions
status: verified
term: "道德内化瓦解动力学 (Moral Internalization Collapse Dynamics)"

人话摘要: "良心不是一下子没的——合理化→比较→认知重组→情绪脱钩，崩了重建比建立难得多。"

statement: |
  【核心】道德内化的瓦解遵循四阶段剥洋葱顺序——合理化→比较→认知重组→情绪脱钩——
  不可跳跃；阶段3（认知重组）是不可回头的临界点；逆转需能量指数增长。
  四阶段名目来自 BR-L2-019 P2（对等性信号断裂→逐层瓦解），
  本推论的增量在于：严格顺序与跳跃禁止、替代路径（意识形态转换可跳过阶段2）、
  阶段3不可逆性、瓦解/重建的能量不对称——四项均为砖本身未主张的可独立检验预测。

  【驱动量】内化深度 = 违规后内疚/羞耻的自发强度（独立于外部惩罚预期测量）。
  瓦解进度 = 当前内化深度 / 初始内化深度（ratio, 0=完全脱钩, 1=完好）。

  【预测】
  (i) 默认侵蚀路径有严格顺序——阶段1→2→3→4不可跳跃——
  每阶段是前一阶段认知保护层被突破后的下一层暴露。
  (ii) 替代路径——意识形态转换——可跳过阶段2直接进入阶段3：
  新思想资源（平等主义/宗教/政治意识形态）使旧规范在个体层面直接失去合法性，
  此时对等性信号可能仍完好。
  (iii) 阶段3是临界点——认知重组后内化永远无法回到初始深度：
  "此规范曾被判断为错且该判断当时感觉正确"的记忆不会消失(AXIOM-002)→
  重建内化存在天花板。
  (iv) 能量不对称——瓦解加速(1→2月级→2→3周级→3→4天级)，
  重建减速(4→3年级→3→2代际级→2→1年级)→不是意志问题，是物理不对称。

  注(诚实标注):上述数量级为理论预期典型值,来源于 THEOREM Corollary 1
  整体性比较(月/年级 vs 天/周级)的阶段间插值,尚未经纵向数据校准。
  对阶段间速率差异的方向(加速瓦解/减速重建)有 THEOREM 理论支撑,
  但具体数量级(月/周/天/年/代际)属 theory-driven quantification,
  待纵向专门检验。不排除阶段间边界为非刀切过渡→加速/减速为中心趋势
  而非均匀步进。

  【判别】与"道德滑坡论"(L5规范命题)不同——本推论是"当对等性信号断裂时
  内化按四阶段瓦解"的事实命题，不判好坏。
  与 DED-023（道德-习俗结构判据）不同——DED-023 讲规范在群体层面的 TP×INT 坐标迁移，
  本推论讲个体层面内化深度的结构瓦解过程——不同因变量。
  与 Bandura 道德脱离（即时认知策略）不同——本推论是纵向、阶段性的结构瓦解，
  Bandura 的机制可嵌入阶段1（合理化）但不能解释阶段2→3过渡和阶段4的永久情绪回路重配。

operationalization:
  internalization_depth:
    definition: "违规后自发内疚/羞耻强度，独立于外部惩罚预期。1=完全内化(无监控合规率>95%)，0=完全脱钩(无监控合规率=随机基准)"
    measurement: "IAT道德自我概念；情绪Stroop道德词汇干扰效应；GSR在回忆违规行为时的变化；田野纵向自然观察"
    limitations: "IAT/生理指标只能测当期状态，无法直接测初始基线——需纵向追踪或自然实验(移民/叛逃者回忆)作为代理。自报在阶段3后不可靠(已认知重构者声称'我仍认为这是错的'但行为上不再内化执行)。 代理基线方案(弥补T0基线不可得):(a)同群体分布估计——使用同年龄段/同文化/同规范域的未瓦解群体内化深度分布作为估计基线,均值±SD作为初始深度的群体级代理;(b)retrospective回忆——使用被试自报的'瓦解前内疚强度'回忆数据,与同群体分布交叉验证(承认回忆偏差和post-hoc合理化风险)。两条均不替代真纵向T0基线,但提供可操作检验路径,避免天花板声称因'测不了'而永久免疫于证伪。"
  stage_assignment:
    definition: "四阶段操作化判据——阶段1:违规后仍有内疚但能找到合理化理由；阶段2:内疚减弱+主动比较他人违规率+产生'凭什么我守'；阶段3:信念重构'这规矩本就不对'+违规不再引起认知失调；阶段4:违规完全不触发内疚/羞耻情绪。 【阶段间硬边界(必要非充分)】1→2过渡:被试须在非引导性提问(如'你为什么觉得可以不守')中自主提及'别人也不守'或'凭什么只我守'或等价社会比较理由——盲法编码者据此判定,非根据整体印象推断。若被试仅述'偶尔一次没关系'而未涉他人→仍处阶段1。2→3过渡:被试须自主陈述'这规矩本身是错的/不公正的',而不仅是'我做不到'(后者属行为失败,可仍在阶段2)。区分标记:阶段2的焦点在行为可行性+他人对等性,阶段3的焦点在规范本身的合法性。3→4过渡:须在至少两次独立测量(间隔≥1月)中,违规回忆均不触发GSR反应(>基线均值+1SD),且被试不自发合理化违规行为。 硬边界的设计意图:若纵向数据中被试从未满足某过渡硬判据即进入下一阶段→跳过可被干净确认,消除'加速压缩消化'的实操免疫。"
    measurement: "半结构化访谈编码(盲法:编码者不知被试对等性信号暴露史)+纵向追踪每阶段的进入/退出时间戳。阶段2可辅助测量:条件合作者博弈(sucker effect触发阈值)"
    limitations: "阶段边界非刀切——过渡期个体可能呈现相邻两阶段特征。阶段3自报可靠性低。需至少3个时间点(T0基线、T1信号断裂后、T2恢复后)的纵向数据才能区分阶段跃迁与测量噪声"

derivation:
  from_l1:
    axioms: [AXIOM-002]
    theorems: [THEOREM-moral-internalization]
    concepts: [CONCEPT-morality, CONCEPT-agent, CONCEPT-norm]
  from_l2:
    bridging: [BR-L2-019, BR-L2-014]
  steps: |
    1. "砖的贡献:四阶段名目(BR-L2-019 P2)+第三方执行机制(BR-L2-014)"
       BR-L2-019 P2 确立对等性信号断裂→内化逐层瓦解(合理化→比较→
       认知重组→情绪脱钩)。本推论将此从"瓦解的四种现象"升级为
       "瓦解动力学的形式模型"——赋予顺序、不可逆、替代路径与能量不对称。
       BR-L2-014 确立第三方惩罚是对等性信号的执行基础——
       当旁观者停止付出代价惩罚违规者时，对等性信号随之断裂。

    2. "剥洋葱机制:每层是前一层的认知保护壳"
       阶段1(合理化):行为偏离+最小代价认知调整——"偶尔一次没关系"。
       Festinger(1957)认知失调:个体优选最小调整(合理化例外)而非推翻信念。
       阶段2(比较):对等性信号断裂完成——观察到他人违规无后果→
       遵守者感到被利用(sucker effect)→THEOREM-内化 P2 在此断裂。
       阶段3(认知重组):信念调整以匹配行为——"我做错了"→"这规矩本就有问题"。
       失调消解的最后防线——此后违规不再产生失调。
       阶段4(情绪脱钩):情绪回路重新配线——BR-L2-019 的杏仁核→前额叶回路
       在此阶段完成重塑，违规不再激活内疚。

    3. "阶段3临界点的信息论基础"
       AXIOM-002:信息一旦进入系统就不会自动消失。
       个体经历"此规范曾被判断为错且判断时感觉正确"后→记忆永久存储。
       即使对等性信号恢复，旧有天真信念无法完全恢复→重建内化有天花板。

    4. "替代路径——意识形态转换"
       默认路径要求对等性信号先断裂(阶段2)才进入认知重组(阶段3)。
       但获取新思想资源可直接进入阶段3——新认知框架否定旧规范的合法性，
       无需先经历比较。此路径意味着瓦解既可是被动的(等信号断裂)，
       也可是主动的(认知自主推翻)。两种路径在瓦解/重建时间线上有不同签名。

    5. "逐格判空——非平凡性定位"
       4阶段×2方向(瓦解/重建)=8条迁移路径。
       空格①:阶段1→4直接跳(跳过2和3)——认知保护层逻辑禁止，但可被纵向检验。
       空格②:阶段4→1直接跳(跳过3和2)——信息不消失法则禁止，同样可检验。
       空格③:阶段3→2逆向迁移在年级内完成——与临界点主张矛盾。
       若纵向数据观测到这些跳跃→推论核心(顺序刚性)被削弱。
       非平凡内核不在"四阶段存在"(BR-L2-019 P2已给出名目)而在"跳不过去"+
       "回不去"→均为可独立检验的真经验主张，非砖的复述。

falsifiability: |
  (a) 纵向追踪发现个体从阶段1直接跳阶段4(跳过阶段2和3)→四阶段顺序被推翻。
  (b) 发现大量阶段4个体在无外部强制+无代际更替的条件下，年内恢复至初始内化深度
  →瓦解/重建不对称被推翻。
  (c) 发现对等性信号完全断裂后群体内化率与断裂前无统计差异→
  THEOREM-内化 P2 被推翻，本推论随之瓦解。
  适用区间:群体规模≥3且存在反复交互。单次匿交互无生态效度。
  有中心惩罚权威的制度化语境(国家法律)不在直接射程内——
  制度化惩罚混淆对等性信号的独立测量。

falsification_trace:
  primary_suspect: "阶段3不可逆性——若发现认知重组后群体在对等性信号恢复条件下内化率回归基线(≥初始80%)，临界点主张被推翻。最危险反例:宗教叛教者重新皈依原教派——需独立测量其内化深度是否真回到叛教前水平(非表面行为服从)。 【实操检验困境】天花板声称(<初始深度80%)的证伪需T0基线(瓦解前内化深度),而operationalization已自认'IAT/生理指标只能测当期状态,无法直接测初始基线'。在缺乏T0纵向数据的现实场景中(等你注意到内化瓦解时瓦解已开始),天花板声称近乎不可检——当前属预注册假设,待专门纵向实验(需在瓦解前建立基线)检验。代理基线方案:(a)使用同年龄段/同文化/同规范域的未瓦解群体内化深度分布作为估计基线;(b)使用retrospective自报的'瓦解前内疚强度'回忆数据(承认其可靠性限制)。两条均不完美但至少给出检验路径,非仅说'测不了'。"
  secondary_suspect: "四阶段严格顺序——若个体在无新思想资源条件下从阶段1→3跳跃(不经比较)，顺序刚性被推翻。但分类框架(四阶段存在)可独立存活"
  unlikely_suspect: "替代路径存在性——即使意识形态转换路径从未被田野验证，默认侵蚀路径仍成立。此路径缺失不影响核心(剥洋葱顺序+不可逆)"

excluded_outcomes:
  - '内化要么全有要么全无——剥洋葱模型本身就否定了二元跳变'
  - '道德内化瓦解 = 道德认知发展的反向——瓦解/重建的速率不对称(快溃慢建)
    不能用一个解释替代另一个'

anti_talisman_clause: |
  禁止用"这些人本来就没有道德"解释阶段4——同义反复。
  必须独立测量内化深度(瓦解前基线)和阶段判定，不得因某群体已处阶段4就声称
  "他们本来就没内化"。禁止在道德崩盘事件中发现阶段2→3转换超预期时
  声称"特殊情况不算"而不更新速率估计。
  独立测量锚:BR-L2-019 的 Kochanska et al.(2002)承诺遵从编码——
  编码者仅看儿童在被监控/不被监控时是否均遵守规则，不参考"该规则是道德还是习俗"
  的外部标签→独立测出了内化深度基线。BR-L2-014 的 Fehr & Fischbacher(2004)
  第三方惩罚博弈——被试付真金白银，与被试如何定义"道德"无关→独立测出了对等性信号。

nontriviality_test: |
  自变量:对等性信号(完好/断裂/恢复) × 新思想资源(有/无)
  被预测量:内化深度变化轨迹(阶段迁移路径)

  【THEOREM 先占声明】THEOREM-moral-internalization(depends_on.theorems)的 step 4
  已给出:四阶段名目+剥洋葱模型+记忆持久性(不可逆论据);Corollary 1 已给出:
  能量不对称+整体 timescale 量级(月/年级 vs 天/周级)。DED-024 的真实独家增量
  收窄为:(a)显式刚性不可跳约束 (b)定量天花板阈值(<初始深度80%) (c)替代路径
  (意识形态跳阶段2) (d)阶段级速率颗粒度(月→周→天,年→代际→年)。
  四项中(a)(c)为定性新主张——不在 THEOREM/BR-L2-019/BR-L2-014 任何一处;
  (b)(d)为在 THEOREM 方向性声称上的定量细化——原本的定性方向属 THEOREM,
  定量阈值和颗粒度属 DED-024 增量。

  砖已给出:四阶段名目(BR-L2-019 P2,实为 THEOREM step 4 的桥接引用)、
  第三方惩罚=执行机制(BR-L2-014)。
  砖+THEOREM 未给出(本推论真实增量):
  (a) 阶段顺序刚性——显式不可跳约束。THEOREM 说"剥洋葱"但未排除创伤等
  短路路径。若纵向数据中 ≥20% 个体跳过中间阶段→推翻。
  (b) 阶段3不可逆的定量天花板——<初始深度80%。THEOREM 说"记忆不会消失"
  但未给出可检验的定量阈值。若恢复后内化深度 ≥ 初始深度80%→天花板主张推翻。
  (c) 替代路径——意识形态转换可跳过阶段2。THEOREM 与 BR-L2-019 均无此路径。
  若所有阶段3进入者都先经历了阶段2→替代路径预测被推翻。
  (d) 阶段级速率颗粒度——月→周→天,年→代际→年。THEOREM Corollary 1 已给
  整体不对称方向+月/年 vs 天/周的粗粒度量级,DED-024 的增量在阶段间插值和
  具体数量级。
  四项均不在 THEOREM/BR-L2-019/BR-L2-014 任何一处→可独立检验→非平凡。

real_world_anchors:
  supporting:
    - "苏联解体后俄罗斯(1991-1995):旧规范对等性信号短期断裂→大量个体快速瓦解(阶段1→4数月-年)。新生代(1990s末)内化新规范(市场经济伦理)→支持'瓦解快、重建慢但可能'。"
    - "企业腐败正常化:首贪经历内疚(阶段1)→见他人也贪无后果(阶段2)→'这行业就这样'(阶段3)→拿钱无情绪波动(阶段4)。whistle-blower 常在阶段2临界点行动——要么举报阻止滑向阶段3，要么接受认知重组。"
  counterexamples:
    - "宗教皈依看似一夜内化重建——'昨日罪人今日圣徒'。但纵向检查皈依者:T0戏剧性掩盖了漫长前置过程(旧内化阶段2-3瓦解数月-年+新社群密集对等性信号重建)→非从阶段4直接跳回阶段1→不构成反例。"
  boundary_cases:
    - "儿童期内化规范(如性别角色)成年后因平等主义思想被推翻——对等性信号仍强但认知框架已变→这是替代路径(意识形态转换跳阶段2)的实例。模型初版低估此路径，现已纳入。"
    - "青春期个体 INT 值在发育窗口内不稳定(BR-L2-019 P3)→阶段判定需控制年龄≥25岁(PFC髓鞘化基本完成)。"
    - "创伤性加速瓦解(背叛创伤/战斗道德伤害)——单一高冲击事件是否可在四阶段框架内构成加速版完整序列,还是存在一个独立于四阶段的'短路路径'?BR-L2-019的杏仁核→前额叶回路重塑在急性应激障碍中可能以异常速度发生→若神经层面确实越过了逐层重配,则四阶段模型需独立建模弹道型瓦解(ballistic collapse)。当前版本将其消化为'阶段加速压缩',但此消化本身可能遮蔽一条质上不同的瓦解路径——待神经层面证据裁决。"
    - "compartmentalized internalization(分域内化)——阶段模型是per-norm还是per-person?同一个人在领域A(如职场)已处阶段4(拿回扣完全不内疚),但在领域B(如家庭)仍处阶段1(对子女撒谎仍有内疚)。若内化瓦解是domain-specific的,则:(i)'阶段3不可逆'声称需限域——领域A完成认知重组后,领域B的内化结构可能仍完好,不可逆性不跨域;(ii)阶段判定不应跨规范聚合——需在测量中指定规范域,不能对不同规范混合打分。当前模型隐式假设per-norm(对等性信号是规范特定的),需显式标注,否则一个人在域A的阶段4与域B的阶段1之间的'阶段不一致'无法被模型消化。"

discriminant_validity: |
  独有可证伪预测:(1)四阶段顺序不可跳——无任何竞争理论做出此预测；
  (2)阶段3不可逆——认知重组后内化永远有天花板；
