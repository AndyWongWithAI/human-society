id: DED-027
type: deduction
layer: L3-deductions
status: verified
term: "一般等价物的物理筛选机制 (Physical Screening Mechanism of General Equivalent)"

人话摘要: "一般等价物的涌现是必然的——交换网络足够密时，总会有某种商品被所有人接受当钱用。但具体是金、银还是贝壳胜出，取决于当地交换网络特征下六维物理筛选的加权得分——金是旧大陆的最优解，不是全人类的唯一解。而且赢家通吃：两个得分差不多的候选没法长期共存，正反馈会把一个放大、把另一个挤出。技术革命（比如电解法）能让原来的'贵金属'一夜变贱——一般等价物也会因此换主。"

statement: |
  【核心】在任何存在多商品、多Agent的反复交换网络中，某种商品自发成为被广泛接受的一般等价物是结构必然——E_network正反馈（一种商品被越多人接受→用它交易越方便→更多人接受它→正反馈锁定）必然推高至少一种商品的被接受度E>>1，使其成为交易媒介的主导候选。但具体【哪种商品】胜出是局域路径依赖的——胜出者必须是六维物理筛选框架(BR-L2-021)在局域交换网络特征下的加权最优者，而各维度权重由交易规模、运输距离、验证技术、冶金水平等局域特征外生决定，不可从全球统一标准推导。

  【驱动量】(a) E_network正反馈——接受度与交易便利性的自我强化循环，是"收敛必然"的发动机；(b) 六维物理得分的局域加权——各维度权重由局域交换网络特征外生给定，是"胜出者筛选"的外生约束；(c) 正反馈的放大效应——两个候选加权得分接近时，微小初始优势被正反馈放大→路径依赖锁定→胜出者"偶然"。

  【预测】
  (i) 收敛必然，胜出者偶然——在连通度足够高的交换网络中，单一一般等价物主导是均衡结果（结构必然），但胜出者取决于局域加权得分：不同交换网络因局域特征不同可收敛到不同媒介（旧大陆金、美索不达米亚银、殷商贝币——各自是局域加权最优解，非全局唯一解）。
  (ii) 赢家通吃——同一连通网络中，两个E值（被接受度）接近的竞争媒介不可能长期稳定共存。正反馈的winner-take-all特性意味着：若两个候选的六维加权得分接近，微小初始优势（谁先被某关键节点接受、谁先在某个集市流行）被正反馈放大后必有一方胜出，另一方被挤出媒介角色。均衡状态是单媒介主导。
  (iii) 技术冲击可换主——物理维度的权重随交换网络规模/技术条件变化；当技术冲击（如电解法）根本改变某个维度的供给参数时，原胜出者的加权得分可能被新候选超越→一般等价物换主。历史上铝在电解法发明前比金贵、发明后变贱金属——若铝当时已是某个网络的一般等价物，电解法的冲击足以换主。

  【判别·防平凡化】
  与BR-L2-021判别：BR-L2-021给出"六维得分筛选胜出者"的静态框架（谁得分高谁胜出），但它不回答三个问题：(a)收敛是必然的还是恰好的？——BR-L2-021不提供收敛的发动机（其falsifiability只要求"找到六维劣却胜出的反例"，不要求解释"网络效应是否必然推动收敛"）；(b)得分接近时谁胜出？——BR-L2-021只做排序筛选，不能处理"两个候选得分接近"的均衡选择问题；(c)胜出者会换吗？——BR-L2-021未讨论权重的可变化性及换主机制。本推论的三个非平凡增量恰在这三个缺口：(a)E_network正反馈提供收敛的发动机→收敛必然；(b)正反馈的winner-take-all→得分接近时路径依赖决定胜者→胜出偶然；(c)技术冲击通过权重重标→媒介可换主。
  与门格尔(Menger)物物交换起源论判别：门格尔解释媒介为何涌现（解决双重需求巧合），不解释具体哪种商品胜出及为何不同文明胜出者不同。互补关系：门格尔=why emerges，本推论=which one wins after emergence and why it's locally contingent。
  与格雷欣法则(Gresham's Law)判别：格雷欣描述"法定比价下劣币驱逐良币"（制度框架内的套利），本推论描述"自发交换中正反馈使一媒介挤出另一媒介"（无需法定比价的结构收敛）。不同机制、不同射程。

operationalization:
  交换网络多边度:
    definition: "交换网络中Agent之间实际存在交换关系的密度——含交易对手多样性和交易频率两个子成分。高多边度意味着每个Agent与多个不同对手交换多种商品，而非仅与固定少数对手交换。"
    measurement: "考古代理：贸易路线交叉点数、不同产地商品在同一遗址的共存度、集市数量与辐射半径。实验代理：网络拓扑参数(平均度/聚类系数)。"
    limitations: "多边度是连续量；'足够高以致触发收敛'的阈值需标定且可能因网络规模而异。小规模网络可能多边度很高但总人口少→不触发收敛。"

  六维加权得分:
    definition: "候选商品在六个物理维度(可分/耐久/便携/可识别/同质/供给稳定)上的标准化得分 × 局域权重向量的内积。每维得分由物理/化学属性独立给定(BR-L2-021)；权重由局域交换网络特征外生决定：交易规模↑→可分性权重↑；运输距离↑→便携性+耐久性权重↑；验证技术水平↓→可识别性权重↑；冶金技术水平↓→可分性+同质性权重↑。"
    measurement: "每维得分=独立于交换结果的物理/化学测量(BR-L2-021材料的材料科学方法论)。权重推导=从局域网络特征(交易规模/运输距离/验证技术/冶金水平)独立推导——这些特征可独立于'谁是最终媒介'观测。"
    weight_protocol: |
      【权重标定pre-registration协议——防事后rationalize护身符】
      权重向量(w₁,...,w₆)的标定须在不知道哪个候选最终胜出的条件下完成，分两步：
      Step A（方向约束——当前已满足）：从局域网络特征独立推导每维权重的sign。
      交易规模↑→可分性权重↑；运输距离↑→便携性+耐久性权重↑；
      验证技术水平↓→可识别性权重↑；冶金技术水平↓→可分性+同质性权重↑。
      这些方向性关系本身是可独立检验的——例如找"高运输距离但胜出媒介便携性差"
      的案例可推翻方向约束。→ 当前已满足。
      Step B（rank协议——填补magnitude缺口）：在不知道胜出者的前提下，按局域
      网络特征将六个维度的权重排秩（rank 1=最重要,...,rank 6=最不重要），秩由
      以下独立于"谁是胜出者"的规则决定：
      - 交易规模位于该文明全局分布的上三分位→可分性rank≤2；
      - 平均运输距离>该文明一日陆路行程→便携性rank≤2；
      - 冶金技术未达冶炼温度800°C→可分性rank≤2且同质性rank≤2；
      - 无标准化检验制度（如试金石/纯度标记）→可识别性rank≤2；
      - 其余维度秩位由考古学独立标定。
      rank协议允许同秩（两个维度同等重要），但不允许在得知胜出者后调整秩位。
      两候选的加权得分比较：首先比较rank=1维度的标准化得分；若差距<δ（标定阈值），
      则逐级引入rank=2,3,...直至差距>δ或所有维度耗尽。若所有维度耗尽仍差距<δ→
      判定为"得分接近"→触发预测(ii)的赢家通吃动力学。
    limitations: "权重推导模型需事先声明，不得在结果已知后调整使胜出者'恰好'得分最高(anti-talisman硬约束)。权重标定的精度受考古数据制约。诚实标注：当前方向性关系约束权重的sign但不约束magnitude——real_world_anchors中的三个supporting case（旧大陆金/美索不达米亚银/殷商贝币）的权重论证在此意义上应标注为'directionally consistent illustrations, not pre-registered tests of the weight model'——精细magnitude标定依赖未来实证校准。rank-based protocol（见weight_protocol）提供最低限度pre-registration框架，但秩位标定的考古代理精度有限。"

  单一媒介主导:
    definition: "某一特定商品在所有被观测交换行为中充当交易媒介的比例超过阈值（例如>80%），且其被接受度E（=接受该商品为媒介的Agent比例）系统性高于其他任何候选。"
    measurement: "考古代理：墓藏/窖藏中用作货币的金属种类集中度；贸易记录中计价/结算商品的种类分布。实验代理：多轮多商品交易实验中各商品被用作媒介的频率分布。"
    limitations: "阈值需标定。混合态（过渡期两种媒介并行）应被编码为'收敛中'而非'稳定共存'——需区分'尚未收敛的过渡态'与'已达均衡的稳定并存'——后者才是反例。"

derivation:
  from_l1:
    axioms: [AXIOM-001, AXIOM-003]
    theorems: [THEOREM-exchange-competition-alternative, THEOREM-value-attribution,
               THEOREM-relation-information-asset, THEOREM-cooperation-precondition]
  from_l2:
    bridging: [BR-L2-021, BR-L2-007, BR-L2-011, BR-L2-012]

  steps: |
    1. "交换网络的形成(BR-L2-007)：禀赋互补驱动多边交换网络——不同群体因各自控有对方稀缺的资源而形成多对多的商品流动。这是交换网络存在的经验基础。BR-L2-007确立无互补则交换稀疏，但互补存在时交换网络自然形成。"

    2. "通用媒介的需求端(BR-L2-011 + BR-L2-012)：交换网络的匿名性扩张(D2)与多边度上升(D3)共同催生对'人人都肯收的通用媒介'的结构性需求——记忆替代让匿名陌生人能当场两清(BR-L2-011)，通用媒介把O(N²)的多边债务压缩为单边持有节省结算成本(BR-L2-012)。这两个机制合起来确保：多边度高→通用媒介的净收益大→网络中存在系统性压力驱动某种商品成为'被所有人接受'的媒介。"

    3. "物理筛选的外生约束(BR-L2-021)：在无中心协调者的情况下，某种商品要成为通用媒介须在六个物理维度(可分/耐久/便携/可识别/同质/供给稳定)上达到足够分数——六维得分低的商品持有者面临更高的交易摩擦，在竞争中被淘汰。BR-L2-021给出筛选的方向（谁得分高谁更有机会），且指出六维得分是局域性的——不同交换网络特征影响各维度权重。"

    4. "E_network正反馈——收敛的发动机（本步合成，非单砖给出）：步骤2的需求压力 + 步骤3的物理约束→当一种商品因六维得分较高而开始被部分Agent接受为媒介时，接受它的人越多→它的流动性（被接受的广度）越高→用它交易越方便（搜索摩擦低、结算简单）→更多Agent有动力接受它→接受度进一步上升。这是正反馈：初始优势被自我强化→均衡状态是至少一种商品E>>1（E_network正反馈是收敛的发动机）。注意：BR-L2-021在便携性的价值密度子维度中已提及E_network反馈（'金因物理密度高而被选中→E_network上升→金的单位重量价值上升→便携性进一步上升'，定位为'筛选的放大器而非起点'），但将其限缩在便携性维度内——未推广为跨越全部六个维度的的一般性收敛发动机。本步的增量在于将此反馈从便携性的局部放大器升级为全维度收敛动力学：在BR-L2-021中E_network仅放大便携性维度的既有优势，而本推论将其重构为覆盖所有维度的收敛发动机——任何维度上的初始接受度优势（可分性/耐久性/可识别性/同质性/供给稳定性，不限于便携性）均可通过同一正反馈循环被自我强化，驱动系统向单媒介主导收敛。"

    5. "赢家通吃——无稳定共存（本步合成）：若两个候选商品的六维加权得分接近，E_network正反馈不会让二者稳定共存——因为'被更多人接受的候选'对尚未采用者有更高价值（用它交易匹配概率更高）→更多新用户会选择已经更流行的候选→差距只会扩大不会缩小→均衡态是单媒介主导。这与BR-L2-021的静态筛选不同：BR-L2-021说'低分者被淘汰'（平凡——高摩擦自然淘汰），但不说'两个得分接近的高分候选谁胜出'——本步断言二者不能稳定共存、必有一方胜出，且胜者由微小初始优势的路径依赖决定→'胜出者偶然'。"

    6. "技术冲击换主（本步合成）：步骤3确立权重由局域网络特征决定→这些特征可因技术变革而变→权重重标→原胜出者的加权得分可能被超越。最干净的演示案例：电解法(Hall-Héroult, 1886)使铝的供给稳定性维度发生根本变化——此前铝极稀有（拿破仑三世用铝餐具待贵客、金餐具给次等客）、此后铝产量暴增价格崩塌。若铝此前已是某个网络的一般等价物，电解法冲击足以换主→预测(iii)。"

    7. "非平凡性——逐格判空"
       2×2判据表(交换网络多边度:低/高 × 存在六维加权明显优势候选:无/有)，被预测量=单一媒介主导程度：
       低+无→多媒介并存/以物易物(平凡——网络小，不需要统一媒介)；
       低+有→媒介可选但不必然主导(平凡——网络效应弱，不强制收敛)；
       高+有→该优势候选近乎必然主导(较平凡——BR-L2-021的基本预测方向一致)；
       高+无(多候选得分接近)→仍收敛到单一媒介主导，但胜出者不可从物理得分精确预测、由路径依赖决定(非平凡——收敛必然但胜出偶然)。
       核心空格="高密度+多个候选得分接近+E值也长期接近的稳定共存"预测为空——winner-take-all禁止双E接近的稳定均衡。
       单块砖不给此格预测：BR-L2-021做静态排序不回答"得分接近时谁胜出"；BR-L2-011/012讲需求不回答供给筛选；BR-L2-007讲贸易网络形成不回答媒介收敛动态。唯合成给出"正反馈锁死→赢家通吃→胜出偶然"的交互预测。"

falsifiability: |
  本推论在以下条件之一满足时被证伪（所有条件适用于自发交换网络，排除有法定货币/固定兑换率的制度干预）：
  (a) 找到一个连通度高、长时段（跨数代）稳定存在【两种以上E值接近的竞争媒介】并行充当一般等价物的交换网络，二者均无被另一方边缘化的收敛趋势，且交换网络连通（非分区）——推翻预测(ii)的赢家通吃核心。
  (b) 找到一个文明，其最终稳定的唯一一般等价物在局域加权六维得分上【系统性低于】同期该文明可获取的另一种商品——推翻"胜出者必须是加权最优"的物理筛选约束（即BR-L2-021的基础被具体击中）。
  (c) 交换网络多边度与"存在单一主导媒介"之间无统计正相关（多边度上升不伴随媒介集中度上升）——削弱预测(i)的E_network发动机，收敛不是结构必然。
  适用区间：商品货币时代的自发交换网络（无中央银行/法定货币/固定兑换率的制度强制）；现代法币体系不在射程内（由BR-L2-024的法币信用领域覆盖）。

falsification_trace:
  primary_suspect: |
    预测(ii)的winner-take-all——两个E接近的竞争媒介不能稳定共存。这是最弱的腿：
    可能被"金银复本位长期并行"冲击——但前提是这些并行是【自发市场均衡】而非【法定比价强制维持】。
    若能在历史上找到一个无制度干预的、自发收敛到双媒介稳定并行的干净案例，赢家通吃预测被推翻。
    与金银复本位的判别见anti_talisman_clause和boundary_cases。
  secondary_suspect: |
    预测(iii)的技术冲击换主——因果链条最长：技术冲击→权重重标→媒介切换。
    历史上电解铝是干净的技术冲击案例，但铝当时并非任何网络的一般等价物（它恰好是后来才被发现的
    金属，未经历"先当媒介后被冲击换主"的完整链条）。需更干净的"媒介因技术冲击换主"的历史案例
    （如冶铁技术进步→铁器贬值→退出媒介角色？）或实验检验（在多商品动态实验中引入技术冲击）。
    若在多个技术冲击案例中媒介角色均未切换→削弱(iii)。
  unlikely_suspect: |
    BR-L2-021的六维框架(IEA=2.4,材料科学+考古+实验经济学+博弈论四路交叉验证)——物理事实
    的确定性高，极少是证伪根源。BR-L2-007/011/012(IEA均≥1.9)的稳健性也较高。

excluded_outcomes:
  - outcome: "有法定货币/固定兑换率制度干预的多媒介并行"
    description: "金银复本位制、现代多法币体系等存在法定比价或中央银行制度干预的并行——
    不在本推论射程内。本推论只覆盖自发交换网络中的涌现现象。理由：法定比价可人为维持
    两个媒介的兑换率（虽然不长久），但这不是'自发均衡'——是制度强加的。当法定比价崩坏时
    （如格雷欣法则生效），正是自发收敛重夺主导的证据。此排除不构成逃逸门——
    法定干预是可事前独立识别的制度特征，非事后开脱。"
  - outcome: "交换网络不连通的分区并行"
    description: "若同一地理区域内的两个子网络因地理/文化/政治壁垒不连通（如两座互相隔绝的
    岛屿各自用不同贝币），则各自独立收敛到不同媒介属本推论预测(i)的正常表现——此非反例。
    判定标准：网络连通性必须独立于'是否使用相同媒介'测量（用贸易路线/商品流通数据）。"

anti_talisman_clause: |
  【防不可证伪护身符——四项硬约束】

  (1) 判定"六维加权得分"时：每维得分须由独立于交换结果的物理/化学测量给出（金密度19.3 g/cm³
  是物理事实，不依赖于'金是不是钱'）；局域权重须从交换网络特征（交易规模/运输距离/
  验证技术/冶金水平）【独立推导】，这些网络特征可独立于'谁是最终媒介'观测。
  严禁因"结果是金胜出"就倒推"便携权重必然高于其他维度"。

  (2) 判定"E_network正反馈"时：须能独立测度接受度的时间序列——某商品被接受为媒介的比例
  是否随时间自我强化（如墓藏中该金属作为货币出现的比例单调上升）——而非简单宣称
  "因为最终只有一个媒介，所以正反馈在工作"。若多边度上升而媒介集中度不上升→正反馈
  发动机失效。

  (3) 判定"技术冲击→媒介切换"时：须独立验证两件事——(a)技术冲击确实改变了某物理维度参数
  （如电解法降低铝的供给稳定性得分——可独立验证的工业产量/价格数据）；(b)原媒介在技术冲击
  后加权得分确实低于新候选。不得因"媒介换了"就反推"必是某个维度的权重变了"。
  (c)若供给稳定性突变（金矿大发现）导致已有存量/新增供应比恶化，但媒介角色并未切换→
  供给稳定性维度在此网络中的权重要重新标定——这本身就是可证伪检验。

  (4) 金银复本位护身符锁：若以"金银复本位长期并行"作为预测(ii)的反例，必须证明：
  (a)金银之间不存在法定强制比价（或法定比价从未偏离市场比价）；(b)金银在被观测的交换中
  均充当一般等价物而非"金是价值储藏、银是交易媒介"的功能分化；(c)二者E值长期接近且无
  收敛趋势。以上任一不成立→该反例不成立。历史事实：19世纪金银复本位各国均频繁调整
  法定比价、且每次崩坏都因市场比价偏离法定比价(Gresham生效)→恰是自发收敛力量的证据。

  (5) 功能分化vs竞争媒介的独立判据——堵functional differentiation逃逸门：
  预测(ii)称"两个E值接近的竞争媒介不能稳定共存"。当面对双媒介并行案例时，
  "它们在功能上分化（非竞争关系）"是一种合法的理论消化——但此消化仅当以下两条
  独立于E值收敛结果的判据同时满足时才成立：
  (a) 交易域重叠度（Transaction Domain Overlap, TDO）——两个媒介在同一交易规模
  区间、同一地理市场、同一商品类别中被同时接受的频率。操作化：对每个被观测交换
  行为编码(tx_size, location, commodity_category, accepted_medium)，计算两媒介的
  co-acceptance矩阵。高TDO（如>50%交易场景中两媒介均可被接受）→竞争关系；
  低TDO（如<20%交易场景重叠）→可能为生态位分化。阈值需标定，但判据方向明确：
  TDO越高，越难主张"分化"。
  (b) 媒介可替代性（Medium Substitutability, MS）——持有人在典型交易中是否可在
  不损失显著交易便利性的情况下用一个媒介替代另一个。操作化：计算两媒介的交易
  完成时间/被拒率差异——若银在50%以上的金-可接受场景中会被拒收（或反之），
  则两媒介不可互相替代→支持分化主张；若两媒介在80%以上的场景中可互相替代→
  支持竞争主张。关键：TDO和MS均可在不知道E值是否收敛的前提下独立测量——
  TDO来自交换行为的横截面编码（不要求时间序列），MS来自交易实验或历史交易记录
  （单时间点截面即可）。若TDO高且MS高→两媒介在同一交易域竞争同一功能→预测(ii)
  禁止其稳定共存→若观察到长时段稳定共存则预测(ii)被证伪。若TDO低或MS低→
  功能分化主张成立→此案例不在预测(ii)射程内——此为独立判据，非循环"看结果"。此判据在印度洋贸易网（800-1500 CE）案例中可直接施用：金dinar主要用于高价值跨洋批发贸易（大额+长途），银dirham+铜钱+cowries主要用于中低价值本地/区域零售贸易（小额+短途）→TDO低（不同交易规模区间几乎不重叠）→功能分化主张成立→此案例不构成预测(ii)的反例——但此排除是基于独立于收敛结果的TDO/MS判据，非事后开脱。

nontriviality_test: |
  逐格判空结论（2×2：交换网络多边度[低/高] × 存在六维加权明显优势候选[无/有]，
  被预测量=单一媒介主导程度）：
  低+无→多媒介并存/以物易物：平凡——小规模网络无足够压力统一媒介，任何砖都不预测收敛。
  低+有→媒介可选但不必然主导：平凡——网络效应弱，优势候选可能被采用但收敛非强制。
  高+有→该优势候选近乎必然主导：较平凡——BR-L2-021预测方向一致（高分者胜出）。
  高+无(多候选得分接近)→仍收敛到单一媒介主导，但胜出者由路径依赖决定、不可从物理得分精确预测：非平凡——收敛必然但胜出偶然。

  核心空格="高多边度+多候选得分接近+E值长期接近的稳定并存"预测为空——winner-take-all禁止此格。
  无单块砖给出此预测：BR-L2-021（静态排序）不回答"得分接近时谁胜出"；
  BR-L2-011/012（需求端）不回答供给端筛选动态；BR-L2-007（贸易网络）不回答媒介收敛。
  唯E_network正反馈+物理筛选的合成给出正反馈锁死→赢家通吃→胜出偶然的交互预测。
  空格可被现实反例（自发、连通、长时段双媒介稳定并行）填上→非空可满足、非同义反复。

real_world_anchors:
  supporting:
    - anchor: "旧大陆金、美索不达米亚银、殷商贝币——不同网络独立收敛到不同媒介"
      evidence: |
        三个文明在没有互相借鉴的时空下，各自在交换网络中收敛到一种主导的一般等价物：
        旧大陆(地中海-欧洲-中东)用金、美索不达米亚(两河流域)用银(银shekel)、
        殷商中国用贝币。每个都在各自局域网络特征下的六维加权得分最优——
        旧大陆网络规模大+运输距离长→便携+耐久权重高→金胜出；
        两河流域网络中等+冶金技术成熟→可分+同质权重高→银胜出；
        殷商网络规模中等+热带贝壳本地丰富→可识别+可分权重高→贝币胜出。
        关键：三者均收敛到单一主导媒介（支持预测i的"收敛必然"），
        但胜出者不同（支持预测i的"胜出偶然/局域性"）。
      independent_test: |
        六维物理得分由材料科学独立测定（金的密度/化学惰性/元素周期表事实，
        银的类似属性，贝币的可分/可识别特性）；
        局域网络特征（交易规模/运输距离/冶金水平）由考古学独立重建——
        均不依赖"谁是胜出者"。
      confidence: "strong（三路独立跨文明案例，BR-L2-021按考古学+材料科学双路交叉验证）"

    - anchor: "铝的价格崩塌(1854-1890)——技术冲击改变物理维度参数"
      evidence: |
        电解法(Hall-Héroult, 1886)发明前，铝极其稀有——1855年巴黎世博会上
        铝条被作为"来自黏土的银"展出，拿破仑三世用铝餐具待最尊贵的客人。
        1854年铝价约 $17/lb（约合今 $500+/lb），远高于银的 ~$15/lb。
        电解法后铝产量暴增、价格在十年内崩塌至 ~$0.30/lb——从"贵金属"变"贱金属"。
        机制：技术冲击→供给稳定性维度参数根本改变（S暴增→存量/新增比恶化）
        →若铝此前是某网络的一般等价物→加权得分暴跌→应触发媒介切换。
        铝因历史偶然（在19世纪末才实用化，未曾在任何大网络充当媒介）恰好避开了
        "媒介换主"的完整演示——但价格崩塌本身干净地演示了"技术冲击改变物理维度参数"的机制。
      independent_test: |
        电解法的发明和扩散时间独立于铝的市场价格记录；
        铝价由伦敦金属交易所等独立市场数据记录；
        供给稳定性得分变化由工业产量数据独立标定。
      confidence: "strong（技术冲击→物理参数改变→价格崩塌的因果链干净可追溯）；
        moderate（'媒介换主'仅在反事实层面成立——铝未当过媒介，故只演示机制面）"

    - anchor: "金银复本位制的反复崩溃——自发收敛力量冲破制度干预"
      evidence: |
        19世纪法国(1803-1873)、美国(1792-1900)等国的金银复本位制反复面临
        "市场比价偏离法定比价→一种金属被窖藏/流出、另一种主导流通"的困境
        （格勒欣法则的作用）。每次法定比价调整后，新的偏离又会发生——
        直到最终各国先后放弃复本位、转向金本位（单媒介）或法币。
        这正是E_network自发收敛力量冲破制度强制维持的证据——
        制度可以在一定时间内维持双媒介并行，但市场自发力量持续往单媒介方向拉。
      independent_test: |
        法定比价=立法/铸币厂公告（独立制度指标）；
        市场比价=自由市场金银交易记录（独立市场指标）；
        媒介流通份额=铸币流通量/窖藏量（独立货币数据）。
      confidence: "strong（多国、长时段的复本位崩溃记录一致指向市场自发收敛力量）"

  counterexamples:
    - case: "现代法币体系多种货币(美元/欧元/日元/人民币)长期并行"
      analysis: |
        每种法币在各自主权领土内由法定货币法强制使用，而非自发涌现——
        不在本推论射程内。且法币的价值来自信用机制(BR-L2-024)而非物理属性，
        六维物理筛选不适用。此为射程外的不同体系，非反例。
      status: "out_of_scope"

    - case: "黄金与白银在历史上长期同时扮演货币角色(金银复本位鼎盛期)"
      analysis: |
        金银复本位制的"双媒介并行"是法定比价的制度产物，非自发均衡——
        每次复本位崩溃(市场比价偏离法定比价)恰证明自发力量趋向单媒介。
        且金银在复本位下常有"金管大额/跨国清算、银管小额/日常交易"的功能分化——
        不是"两个E>>1的竞争品并行"，而是"不同交易域用不同媒介的生态位分化"。
        若在无制度干预的条件下观察到自发、连通、长时段的金银并行充当一般等价物
        （且无功能分化），则预测(ii)被证伪——目前未发现此干净案例。
      status: "consumed_as_support"

  boundary_cases:
    - case: "金银复本位制——制度干预的边界"
      analysis: |
        金银复本位处于本推论的射程边界：其双媒介并行是制度强制的结果，
        不在自发交换网络射程内。但它的反复崩溃到最终被金本位替代的历史轨迹，
        恰为"自发收敛力量持续对抗制度强制"提供支持——边界案例标注制度干预
        可以推迟但不能消除自发收敛。
      status: "boundary_case"

    - case: "局域分区独立收敛——同一地理区划内不同子网络各自有不同媒介，但网络不连通"
      analysis: |
        若两个子网络之间因地理/文化/政治壁垒不连通（互不进行交换），各子网络
        各自独立收敛到自己的最优媒介——如太平洋诸岛各岛用不同贝币——
        这是预测(i)的正常表现（各自局域最优解），非反例。
        若这些子网络后来连通（跨岛贸易形成）→两个E值原有的稳定均衡被打破
        →预测应发生winner-take-all收敛→可检验。
      status: "boundary_case"

discriminant_validity: |
  【相对于BR-L2-021(一般等价物的物理筛选)的判别】
  承认链：BR-L2-021并非完全不涉及E_network——它在便携性的价值密度子维度中明确讨论
  E_network反馈（'金因物理密度高而被选中→E_network上升→金的单位重量价值上升→
  便携性进一步上升'），定位为'筛选的放大器而非起点'。但BR-L2-021将此反馈限缩在
  便携性维度内，未将其推广为驱动整个媒介选择过程的一般性收敛发动机，也未在此基础上
  推导赢家通吃或胜出偶然的均衡选择预测。本推论的增量在于将此反馈从便携性的局部
  放大器升级为覆盖全部六个物理维度的收敛动力学，并由此导出赢家通吃+路径依赖→
  胜出偶然的均衡选择预测——这些是BR-L2-021未给出的。

  BR-L2-021的独有可证伪核："找到六维得分全面劣于另一种可获取商品的文明媒介→框架被推翻"
  (静态排序筛选)。本推论在此基础上给出三个BR-L2-021单独不给出的增量预测：
  (a) 收敛必然——网络密度足够高时，必然有某种商品E>>1（将E_network从便携性局部放大器
  升级为全维度一般性收敛发动机，BR-L2-021的排序框架不含此动力学）；(b) 赢家通吃——
  得分接近的候选不能稳定共存（动态均衡选择，静态排序无法处理"接近"）；(c) 换主可能——
  技术冲击通过权重重标引发媒介切换（历史动力学，静态框架未覆盖）。
  独有可证伪联合预测：两个六维得分接近的候选+高密度交换网络→预测单媒介主导
  +胜出者由路径依赖决定（不可仅从物理得分精确预测）。
  BR-L2-021单独无法给出此预测——它只断言"高分者胜出"，无法处理"两个得分接近"的情况。

  【相对于门格尔(Menger)物物交换起源论的判别】
  门格尔的核心是：媒介从物物交换中自发涌现→解决双重需求巧合。
  本推论的核心是：涌现后具体哪种商品成为媒介，由六维物理筛选的局域加权得分决定。
  二者是互补的叙事层——门格尔=why it emerges，本推论=which one wins after emergence。
  独有预测：门格尔体系不能解释(a)为何不同文明有不同的一般等价物（它不区分商品物理属性），
  以及(b)为何媒介会因技术冲击而换主（它无动态权重机制）。

  【防平凡化守卫】
  不要把本推论理解为"六维得分高的商品当钱"——BR-L2-021已经给了。非平凡内核聚焦在
  三处：(1)收敛是E_network正反馈驱动的结构必然，而非偶然的高分者胜出；(2)得分接近时
  winner-take-all+路径依赖→胜出偶然——这是静态筛选框架不能给出的动态均衡选择；
  (3)技术冲击通过权重重标→媒介可换主——历史动力学增量。若去掉这三处增量，
  本推论坍缩为BR-L2-021的复述。

review_summary: |
