falsification_trace:
  primary_suspect: |
    （a）叙事-规模相关性分叉的因果归因——最脆弱环节是"代码型协调中观测到的低相关性到底是因为代码替代了叙事（本推论的机制），还是因为'相信代码'本身就构成了新形态的想象秩序？"

    致命攻击"代码只是换了壳的叙事"：若在代码型协调中，合作不是建立在"共享叙事"上而是"共享代码"上，但"相信代码的公正与不可篡改"本身是否构成一种新的想象秩序？如果是，代码型协调并没有消除对想象秩序的需要——只是建立了一种新的想象秩序（类似于"法治信仰"对"宗教信仰"的替代仍然是"另一种信仰"）。那么BR-L2-003的核心主张"大规模合作依赖想象秩序"仍然成立，本推论只是在做文字替换。

    反驳此攻击需证明"验证型信任"与"信仰型信任"的本质区别：在叙事型协调中，参与者必须"相信X是真的因为我们都信"——不可独立验证（如"这个国家值得我效忠""上帝会奖赏好人"）。在代码型协调中，参与者可以"知道X是真的因为我可以自己跑一遍验证"——可独立验证（如"这笔交易已被打包进区块N且被M个节点确认"）。区分判据：若参与者实际上"信仰代码"（不验证而信任——如从不运行全节点却相信矿工不会串通），则代码退化为新叙事；若参与者"验证代码"（独立验证协议执行结果），则代码是独立于叙事的协调基础设施。

    次致命攻击"代码替代叙事≠叙事不必要"：即使代码可以替代叙事实现合作，这只能证明"代码是叙事的充分替代品"，不能证明"叙事不再必要"——就像"汽车替代马车"不证明"交通工具不再必要"。推论的"必要条件降级"主张需要证明：在代码可用的条件下，叙事型协调不具有代码型协调缺乏的不可替代优势（如动机维持/危机应对/创新弹性）。如果叙事在这些维度具有持久优势，那么"必要条件降级"的声称过强，应修正为"基础设施形态扩展"。

    操作化陷阱：（a）的叙事厚度测量若被合作规模本身污染——成功的大规模合作自身会催生叙事（如成功的开源项目自然产生社区文化和共享价值）——观测到的"高叙事+高规模"可能是规模→叙事而非叙事→规模，相关性分叉被污染。另一面：若叙事厚度指标中的"内部话语叙事密度"计入了合作成功后的庆祝性话语（"我们做了一件伟大的事"），这些话语是合作的结果标志而非前提条件，会造成叙事厚度的系统性高估。

    范畴脆弱性：BR-L2-003讨论的是"人类独特地能够"在超亲缘规模上合作——其证伪条件是"发现一个无需想象秩序的大规模人类社会"。本推论声称找到了这种社会的原型（算法治理社区）。但BR-L2-003的"人类社会"定义是否排除算法介导的协作？若BR-L2-003的射程天然包含"任何人类组成的合作系统（不论采用的协调工具）"，那么DED-039不是限定BR-L2-003，而是直接证伪它——本推论需面对此张力而非回避。

    （2）AI特异性因果归因：Wikipedia/OpenStreetMap/Stack Overflow/Hanseatic League/SWIFT/Git（2005前）等案例表明薄叙事+大规模合作可在非AI代码协调下实现——wiki版本控制+社群规范、声望算法、标准化贸易规则、确定性版本控制均可填充非平凡格。此攻击不同于primary#1（"代码是否真的替代了叙事"）：primary#1质疑替代的真实性，此攻击质疑"替代叙事的代码是否必须是AI代码"。若AI渗透率在分离wiki式版本控制/确定性规则的贡献后边际效应不显著，推论的AI特异性主张需撤回——增量从"AI使此格可能"修正为"AI的无限记忆/关系追踪/连续性使此格在更大规模和更复杂场景下可能"。
    （b）AI渗透率-叙事边际贡献——渗透率测量的效度陷阱：AI代码协调渗透率（算法自动执行的协调决策占比）可能高估或低估真实替代程度。（i）高估——某些"自动执行"的决策实际上是人工共识的自动化呈现（代码只是执行工具而非协调基础）；（ii）低估——某些看似人工的决策实际上被算法的信息呈现框架深度塑造（隐性替代——如AI推荐的选项被人工"采纳"但人工实际上只是橡皮图章）。若渗透率测量的噪声淹没真实信号，（a）和（c）仍可独立检验——（b）倒下不致使全推论塌缩。
  unlikely_suspect: |
    BR-L2-003的"大规模非亲缘合作依赖想象秩序"主张本身稳固——人类学/历史学/社会心理学多通道证据IEA=1.9支持。BR-L2-026的AI能力枚举（记忆/关系追踪/连续性）在2025-2026技术条件下也稳固，IEA=2.2。两块砖本身不太可能被推翻——脆弱的是它们之间的焊接："AI的这些能力是否真的在因果意义上'替代'而非仅仅'补充'了叙事的功能"。
  note: "primary若被致命攻击'代码是新叙事'坐实，推论核心机制塌缩——'必要条件降级'的主张需撤回为'合作基础设施形态从叙事扩展到代码'这一更弱、更近定义的主张（后者只是'多了个选项'，不做'不再是必要'的赌注）。primary若被次致命攻击'替代≠不必要'坐实，推论降级为弱化版本（infrastructure expansion而非necessity demotion）。"

excluded_outcomes:
  - outcome: "叙事作为人类社交认知的必然涌现属性——代码可延长薄叙事半衰期但不可取消叙事必然性（r5审查要求）"
    description: |
      人类语言本身即是叙事机器——任何持续的人际交互必然产生共享叙事，这是人类认知架构的属性而非合作规模的函数。代码型社区中观测到的"叙事厚度单调递增"（所有>10年代码型社区叙事厚度均随时间增长）不是偶然经验规律，而是人类社交认知的必然产物：只要有足够多的人在一起足够久，叙事必然涌现。代码改变的是叙事的内容（从"我们信仰同一个神"到"我们相信同一套协议"）和形态（从单一厚重到多元轻薄），不改变叙事的必然性。对推论的严格推论：薄叙事+大规模合作在理论上是可能的（代码在稳态下可独立支撑合作），但在时间维度上可能是生命周期瞬态而非稳态——薄叙事半衰期取决于代码型社区的规模增长率（新成员稀释叙事密度）vs叙事涌现速率（交互深度催生叙事）的赛跑。若实证上所有薄叙事大规模合作体均在N年内演化出厚叙事，推论的"必要条件降级"需修正为"代码延长了薄叙事的半衰期——叙事在大规模合作中仍是必然的，但代码改变了叙事的生产方式（从自上而下灌输到自下而上涌现）和时间常数（从月-年级到年-十年級）"。此不证伪推论的预测（a）（b）（c）——这些预测在薄叙事的时间窗口内仍然可检验——但限定了推论的修辞范围：不应声称"叙事不再必要"，应声称"叙事在稳态运行中不再必要——薄叙事可持续的时间长度取决于代码型社区的增长率与叙事涌现速率的差值"。

  - outcome: "代码型协调不能在所有社会场景中替代叙事（如家庭/亲密关系/宗教仪式/危机决策）"
    description: |
      本推论射程限于"大规模陌生人合作"（与BR-L2-003同一射程）。小群体/亲密关系/非功能性的集体仪式/需要灵活道德判断的危机场景不在射程内。代码型协调在这些场景中的失败不证伪本推论。
  - outcome: "代码型协调在某些类型的合作中不如叙事型协调高效（如需要灵活应变/创造力/情感支持的场景）"
    description: "本推论不声称代码型协调在所有维度上优于叙事型协调——只声称它使'无叙事的大规模合作'成为物理上可能。效率比较不在射程内。"
  - outcome: "代码型社区演化出自己的叙事（如BTC maxis的意识形态/以太坊社区的核心价值）"
    description: |
      本推论预测代码型协调可独立支撑合作，不预测社区不会自行发展叙事——合作成功可能吸引更多人参与，参与者可能自然形成文化认同。关键测试是时间顺序和必要性：叙事是先于合作出现——且是合作启动的前提条件——还是合作成功后的副产品？仅凭"代码型社区也有叙事"不证伪——需证明叙事在合作启动时刻即已存在且为必要条件。操作化：对新生的代码型合作体（成立<6个月）进行叙事厚度基线测量——若薄叙事合作体在启动后6个月内规模即达>1000人，则代码独立支撑大规模合作的因果主张被支持。

      【Bootstrap限定诚实标注】当前所有已知成功代码型社区的创始期（Bitcoin 2008-2011/Ethereum 2013-2015/Linux 1991-1995/Wikipedia 2001-2005）均有远超6个月的厚叙事积累阶段——代码在叙事吸引初始社区之后才成为主导协调媒介。推论的"必要条件降级"主张在当前证据下最稳健的表述是："在合作体的post-bootstrap稳态运行阶段，代码可替代叙事作为日常协调的基础设施；bootstrap阶段（吸引首批参与者/建立初始信任）叙事可能仍为必要。"若新生代码型合作体在<6个月薄叙事条件下达到>1000月活跃规模，bootstrap限定被解除——此为比当前主张更强的经验发现，当前尚无已知正面案例。

anti_talisman_clause: |
  【防不可证伪护身符——禁止由结果反推前件】

  （1）禁止由"合作规模大"反推"叙事厚度够厚"——叙事厚度必须由独立于合作规模结果的标准测量（准入门槛+内部话语+争议叙事，见operationalization），不得将任何大规模合作体事后标记为"其实叙事很厚"。特别禁止"这个DAO成功了说明它一定有隐藏的共享叙事/文化"式的事后叙事注入——这是将falsifiability保护起来的最常见手法。

  （2）禁止由"代码型协调体合作规模不够大"反推"AI能力还不够成熟"——BR-L2-026对当前AI能力的刻画（记忆/关系追踪/连续性）已足够支撑本推论的全部预测。不得诉求"等AGI出来了推论就对了"——预测（a）（b）（c）以当前技术条件为锚定区间。若当前AI能力不足以产出预测的相关性分叉，推论在当前就是错的——未来技术发展须由新DED覆盖。

  （3）禁止由"代码型社区形成了叙事"反推"这个社区其实是叙事型协调"——叙事厚度是连续量，不得将产生了任何叙事的代码型社区事后重新归类为叙事型。分类阈值（叙事型通信占比<30%为代码主导，>70%为叙事主导）已一次性注册，不得在见结果后移动。若某合作体叙事通信占比35%但规模巨大，它属于混合型——不填补本推论的"薄叙事+大规模"非平凡格。

  （4）禁止用"代码型协调中的协议规则本身构成了新想象秩序"消解"必要条件降级"主张——若代码型协调需要参与者"相信协议价值/社区使命"（不可独立验证的信仰）而非仅仅"验证协议执行"（可独立验证）才能维持合作，则BR-L2-003的必要条件主张仍然成立——代码只是换了一个故事。此区分通过验证型vs信仰型信任判别：参与者能否仅通过"自己跑一遍代码验证结果"即接受协议执行结果？若能，代码是独立于叙事的协调基础设施；若不能（如实际依赖"相信多数验证者诚实""相信开发者不会作恶"等不可独立验证的信念），代码型协调在认识论上退化为新形态的想象秩序。此判别须独立于合作规模结果进行——不得由"规模大"反推"验证型信任占比高"。

      【clause(4)实践可检验性诚实标注】验证型vs信仰型信任的严格判据（参与者需"自己跑一遍代码验证结果"）在逻辑上精确，但在实践层面：当前绝大多数代码型协调系统的参与者并不独立验证——(i)比特币全节点运行者占总用户的估计比例<5%（约50K节点 vs >100M持有者）；(ii)DeFi协议用户中独立审计智能合约的比例<1%；(iii)绝大多数GitHub Actions用户不验证CI/CD管线逻辑。若严格应用本判据，当前几乎所有"代码型协调体"在实践中属于"信仰型协调体"（信任开发者/审计者/社区共识而非独立验证），使得本推论的实证检验对象（真正代码型协调）在当前技术-社会条件下近乎空集。

      【宽松实践判据（补充而非替代严格判据）】注册以下可操作标准：若一个合作体中，(i)≥10%的活跃参与者可（通过公开工具）独立验证关键协议执行结果，或(ii)≥30%的活跃参与者使用可独立验证的工具（如运行轻客户端/验证Merkle proof/验证zk-proof），则该合作体归类为"验证型信任可达"。若按此宽松判据，当前仍无或极少合作体达标，诚实承认"代码型协调在实践中尚未充分实现其认识论承诺——推论描述的是代码型协调的【理论可能性】而非【当前实践常态】"。

      【验证型信任可达性——基础设施上移判据（方案c,采纳r5审查对恶化条款与cl.2同构的诊断）】上述"宽松实践判据"以个体行为为测量单位（≥10%参与者独立验证），在当前技术-社会条件下近乎空集——直接导致原恶化条款的推迟逻辑与cl.2（禁止"等AGI出来推论就对"）在操作层面等价（两者共享"等待X成熟后方可检验"的推迟骨架）。解决方案:将验证型信任的操作化从个体行为层上移至基础设施可及性层——若合作体提供以下至少两项则归类为"验证型信任可达"：(i)公开可运行的独立验证节点（非核心团队运营，第三方可部署并接入主网）；（ii）独立第三方验证接口/仪表盘（如区块浏览器/zk-proof验证前端/GitHub Actions日志公开可审计）；（iii）活跃的独立验证文档子群体（非核心开发者撰写的技术解读/验证指南/独立安全分析，≥5篇/年来自≥3个独立作者）。此判据的优势：(a)今天即可鉴别——当前主要代码型社区（Bitcoin/Ethereum/Linux/Wikipedia）几乎全部满足≥2项；(b)不要求每个参与者亲自验证（消除"全节点<5%"导致的空集问题），只要求验证基础设施对任何想验证的人开放且确实被部分独立群体使用；(c)与cl.2不冲突——社会采纳度（基础设施可及性）vs AGI成熟度（技术能力天花板）是不同的推迟变量，前者在当前有可观测的正向趋势（区块浏览器/轻客户端/zk-proof验证工具的扩散），后者无——此不可等价性使恶化条款与cl.2的操作同构被打破。

        【clause(4)诚实自反性声明（r5审查要求）】本推论操作的核心区分——"验证型信任"（可独立验证的代码执行结果）vs"信仰型信任"（不可独立验证的叙事共识）——在自指时面临塌缩风险：结构叙事（"规则会被执行"这一元信任——法治/合同执行/基础设施信任）在cl.4的意义上本身也是想象秩序的一种形态。"相信代码会按规则执行"与"相信神会按天道奖惩"的区别是验证手段的有无（前者可独立验证后者不可），但两者共享一个关键属性——都需要人类"相信某套非物理实体的规则系统会稳定运作"。"代码即法律"这一信念，当被绝大多数参与者持有且不独立验证时，本身就是一种薄想象秩序——其厚度虽远低于宗教/民族主义等厚叙事，但在BR-L2-003的框架内仍属"想象秩序"的范畴。推论实际操作的因此不是"对想象秩序的消除"，而是"对想象秩序的必要层从厚内容叙事向薄结构叙事的压缩"——代码型协调并未使想象秩序消失，而是改变了想象秩序的内容（从"我们信仰同一个神"到"我们相信同一套协议会按规则执行"）和厚度（从厚到薄），以及降低了维护该想象秩序的成本（从仪式化/组织化的持续投入降至基础设施维护）。此自反性声明不改变推论的核心可证伪预测（a）（b）（c）——叙事厚度（内容层）与合作规模的解耦仍然是可检验的赌注——但诚实限定了推论的修辞范围："必要条件降级"的严格表述应为"内容叙事从必要条件降级为充分非必要条件；结构叙事从厚仪式维护形式压缩为薄基础设施信任形式"。
      （5）【对称保护——双向锁定】若代码型协调体的大规模合作确实发生了且叙事厚度经独立测量确实低，禁止以"这只是暂时的——长期来看它需要叙事才能稳定"推迟证伪——预测已注册（a）（b）（c），当前数据满足预测即视为证实，长期稳定性预测不在本DED射程内（可为后续DED的命题）。同时，若（a）未通过，禁止以"当前代码型协调体还太年轻/太小"推迟裁决——注册的检测样本条件（N≥30合作体，每类型≥15，月活跃>1000为大规模）已锁定，不达标则推论仍处于"待检验"而非"被证实"。

  【削弱条件】若（a）仅在部分代码型合作体类型中成立（如仅在链上DAO中、不在开源社区中），推论射程收窄至"在特定类型的代码型协调中成立"并诚实报告分化原因。若（a）完全不成立，推论被全面证伪——不得以（b）或（c）的局部成立来挽回（a）的失败。

nontriviality_test: |
  2×2排列表（自变量档：叙事厚度 厚 vs 薄 × 被预测量档：合作规模 大 vs 小）：

  格（厚叙事，大规模合作）——「平凡格」——BR-L2-003直接预测此格：想象秩序支撑大规模合作。此格若填充，对BR-L2-003是证据，对本推论不提供增量区分——叙事型协调和代码型协调均可产出此格（代码型+厚叙事同时成立也可能大规模合作）。

  格（厚叙事，合作规模小）——「平凡格」——叙事是必要的但非充分的，其他条件（资源/技术/时机/外部竞争）不足则合作仍无法达大规模。不提供增量信息。

  格（薄叙事，大规模合作）——「非平凡格」——本推论的特有预测，不能被任何单一承重砖平凡推导：BR-L2-003不预测此格（按其逻辑，薄叙事→缺乏想象秩序→难以大规模合作——BR-L2-003的证伪条件恰恰是"若发现无想象秩序的大规模社会则本命题被推翻"）；BR-L2-026不预测此格（BR-L2-026只描述AI能力，完全不讨论合作规模或叙事）。此格的填充需要步1-5的完整链条：BR-L2-003提供问题框架→BR-L2-026提供工具→功能替代分析→代码独立支撑合作。此格为本推论的非平凡内核——它是一项可被现实反例推翻的经验赌注：若在薄叙事条件下确实存在由代码型协调支撑的大规模合作，推论通过其核心检验；若此格为空（所有薄叙事的代码型合作体都无法达到大规模），推论被削弱或证伪。

  格（薄叙事，合作规模小）——「基准格」——既无叙事基础、也无其他协调基础设施（如成熟AI代码）的原子化人群，天然难以大规模合作。非本推论射程的焦点——此格为空或非空均不直接影响推论。

  brick=conclusion自查：'AI代码可替代想象秩序作为大规模合作的基础设施，想象秩序从必要条件降级为充分非必要条件'未在任何承重砖中原文或近义出现。BR-L2-003不含AI、不讨论代码/算法协调；BR-L2-026不含合作理论、不讨论叙事/想象秩序。推论的非平凡内核是两砖焊接后的功能等价命题——这是组合增量（compositional novelty）而非任何单砖的复述。BR-L2-003提供了叙事-合作的正向基线关系，BR-L2-026提供了AI的超人协调能力枚举，但它们之间的"替代→必要性降级"链条完全由本推论构建。

real_world_anchors:
  supporting:
    - anchor: "比特币：薄叙事+代码型协调→大规模价值协作"
      evidence: |
        比特币网络（截至2026年）作为协调数十万参与者在无中心权威下达成价值共识的系统，其叙事厚度极度薄弱：参与不需要认同任何意识形态——Whitepaper未要求信仰，只描述协议规则——仅需运行兼容软件。矿工/节点/用户之间不需要共享"我们是谁""我们信仰什么"——只需要各自独立验证区块有效性。早期社区曾试图附加叙事（cypherpunk解放叙事/数字黄金叙事/革命货币叙事），但这些叙事在社区分裂（BCH分叉/BTC vs BSV）中从未统一——恰恰证明网络的核心协调不依赖统一的叙事共识。诚实标注：（i）BTC尚未达到"百万级参与者"的超级规模，且部分参与者确有较强的意识形态认同——这表明叙事厚度分布不均；（ii）社区叙事争议曾引发分叉，但这些分叉解决了争议（各走各路）而非摧毁系统——代码型协调的"退出"机制平抑了叙事冲突的破坏力。
      confidence: strong
    - anchor: "Linux内核开发：弱意识形态+强技术流程→全球最大协作工程"
      evidence: |
        Linux内核是迄今为止规模最大的人类协作工程之一（万级贡献者/百万级代码行），其协调几乎完全依赖技术流程（补丁提交规则/审查层级/合并窗口/merge window时间表）而非共享意识形态。贡献者来自竞对公司/敌对国家/对立政治立场，不需要认同任何叙事——只需遵循同一套补丁流程并通过代码审查。Linus Torvalds的管理哲学核心："不要求任何人信仰任何东西，只要求代码能跑。"诚实标注：（i）Linux社区确有共享的工程文化价值（meritocracy/rough consensus）——但其可被解释为技术流程的副产品而非前提条件；（ii）Linux贡献网络不是严格匿名的——贡献者以实名/知名Handle运作，BR-L2-003的"陌生人"条件仅为部分匹配（代码审查者与提交者之间可能是陌生人，但长期贡献者形成了一定声誉网络）。
      confidence: strong
    - anchor: "开源运动的'大教堂与集市'——从叙事型向代码型的早期迁移实证"
      evidence: |
        Eric Raymond的The Cathedral and the Bazaar（1997）记录了"Linus法则"（"given enough eyeballs, all bugs are shallow"）在Linux开发中替代传统"集中权威=大教堂"模式的实证过程——这是从叙事型（"大教堂"=共同信仰某个权威方向/愿景）向代码型（"集市"=靠工具链+提交规则+公开审查协调）迁移的早期文档。集市模式的后续扩散（从Linux到GitHub上亿仓库/千万开发者）表明代码型协调的可复制性——GitHub的Pull Request流程本身即为"代码替代叙事"的制度化基础设施：贡献者不需要认识维护者、不需要共享价值观、只需遵循PR模板+通过CI。诚实标注：这一案例的时间序列满足解耦预测（iii）——开源运动从少数精英社群的共享文化演化到全球化的代码驱动协调，参与规模增长了数个量级而共享意识形态/文化叙事并未同步增厚。
      confidence: moderate
  counterexamples:
    - anchor: "The DAO（2016）与后续DAO的叙事依赖——危机时刻叙事回归"
      evidence: |
        The DAO（2016）作为最早的纯代码型协调实验，在黑客攻击后面临治理危机——社区在"是否回滚"的争议中迅速分裂，最终以太坊硬分叉（ETH vs ETC = 叙事分歧："代码应该是法律" vs "代码可以被社区推翻"）。此后成功的DAO（MakerDAO/Uniswap/Aave/ENS）均发展出了较强的社区叙事和治理文化——日常运营由代码执行，但危机/争议时刻（需要做出代码未预编码的决策时），叙事/共识似乎不可或缺。此反例提示：代码型协调在"常规操作"下可独立运作，但在"异常/危机"时刻（需要打破或重写规则时）可能仍需叙事型协调兜底。若异常时刻占总运营时间的>10%且异常决策对合作存续有决定性影响，则"必要条件降级"需限定为"在稳态运行条件下"。
      confidence: moderate
    - anchor: "Wikipedia——薄叙事+大规模合作但非代码型协调"
      evidence: |
        Wikipedia是薄叙事（不需要认同特定意识形态）+大规模协作（百万级编辑者）的典范，但其协调机制不是AI代码驱动的——靠的是人工编辑规范+社群共识+wiki技术（版本控制/讨论页/仲裁委员会）。这对推论的威胁：如果薄叙事+大规模合作可以在无AI代码协调的情况下实现（如Wikipedia靠社群规范+wiki版本控制），那么AI代码不是"薄叙事+大规模合作"的必要条件——这意味着观察到的"薄叙事+代码型协调→大规模合作"中的因果权重可能主要归因于"薄叙事"或"去中心化版本控制"而非AI代码本身。本推论需面对此挑战：预测（a）注册的叙事-规模相关性分叉必须证明是"代码型协调"（而非"薄叙事+任何去中心化工具"）驱动的——通过（b）AI渗透率的剂量-反应检验来分离。
      confidence: high
  boundary_cases:
    - case: "Uber/Airbnb平台：算法协调但运行于法律叙事框架内"
      analysis: |
        平台作为L4-014讨论的"第三组织形态"，确由算法执行大部分协调（匹配/定价/评价/支付）。然而平台的运行仍严重依赖法律叙事框架（合同法/消费者保护/劳动法）——司机和乘客不需要共享意识形态，但需要共享"国家会强制执行合同"这一元叙事。这提出了一个界限问题：代码型协调是否需要某种"基底叙事"（如对法治/对基础设施提供者的信任）作为前提？若回答"是"，推论需指定：代码替代的是"内容叙事"（"我们信什么"）而非"结构叙事"（"规则会被执行"这一元信任）——叙事需求不是消失，而是从上层内容向下层框架压缩（narrative compression rather than elimination）。这将推论的核心主张从"想象秩序不再必要"修正为"想象秩序的必要层被压缩至元规则层"。
      status: boundary_case

discriminant_validity: |
  【独有可证伪预测】相对相邻理论逐一判别——

  （1）vs "新制度经济学"（North/Williamson）：新制度经济学承认制度（包括非正式规范/共享信念）降低交易成本、使大规模交换可能，但将"共享信念"视为给定的制度要素而非可被技术替代的变量。本推论的特有增量：AI代码不仅可以降低交易成本（BR-L2-032已覆盖），还可以替代"共享叙事/想象秩序"这一特定类型的非正式制度——这是新制度经济学未做出、且与其"制度是经济表现的基础设施"框架存在理论张力的主张。

  （2）vs "Code is Law"（Lessig, 1999）：Lessig说代码是规制行为的四种模态之一（与法律/社会规范/市场并列），即"代码可以成为行为约束"。本推论走的更远：代码不仅直接约束行为，还替代了使其他规制模态（尤其是社会规范/市场）有效运作的叙事基础设施——在Lessig的框架中这是一个二级效应而非直接主张。

  （3）vs "理性选择/folk theorem"：Folk theorem证明自利个体在重复博弈+完美信息下可实现无外部强制的合作——承认"无共享价值仍可合作"是可能的。但其适用条件受限于小群体+重复交互+完美信息。本推论的特有增量是通过BR-L2-026（AI的无限记忆/关系追踪/连续性）将这三项约束同时放松：（i）规模——算法可处理无限参与者的信息矩阵；（ii）重复性——不可篡改的记录使一次性交互具有"永久记录+自动报复"的半重复性质；（iii）信息——无限记忆替代人类信息处理的生物上限。本推论从理性选择框架借用"无共享价值可合作"的前提，但扩展其适用边界至大规模+非重复+信息不完全的场景。

  （4）vs "DAO/Web3治理文献"（Buterin/Zamfir/De Filippi & Wright）：DAO文献记录了代码型协调的实践（链上投票/智能合约治理/自动执行），但通常将其理论化为"新型治理形式"或"算法治理"——不将经验观察焊接回BR-L2-003的理论前提。本推论的理论增量恰在此焊接点上：把DAO/开源的经验现象提升为对"想象秩序是合作必要条件"这一人类学/社会学基本命题的修正——这是DAO文献通常不做的理论工作。

  （5）vs "平台资本主义"（Srnicek/Zuboff）：这些批判理论讨论算法如何加强控制/榨取/权力不对称——算法=控制工具。本推论讨论算法如何使"无叙事的合作"成为物理可能——算法=信任替代。两个主张可同时为真：算法既加强控制又使合作不依赖叙事。但两个分析的因果方向相反（控制论的从算法到权力集中，合作论的从算法到叙事替代），各自有独立可检验的预测——不构成理论竞争。

  （6）vs "基础设施介导协调"与"社会合作"的概念区分（r5审查要求）：

  推论的实证武器库中相当比例的"代码型合作"旗舰案例实际属于"基础设施介导协调"（individually rational compliance with protocol rules）而非BR-L2-003框架中shared intentionality的"社会合作"（collective action with shared goals）。关键区分：
  - 基础设施介导协调：个体为自身利益遵循协议规则，无需共享目标或意图——NTP时间同步（所有服务器遵循相同的NTP协议但彼此无共享目标）、DNS域名解析（递归解析器遵循DNS协议但不构成"合作体"）、BGP路由（自治系统遵循BGP但不共享集体意图）、证书透明日志（浏览器验证证书但不与日志服务器"合作"）、Git的分布式版本控制（开发者各自fork/push但不构成单一合作体）。
  - 社会合作（BR-L2-003射程）：参与者共享集体目标（shared goal），且这一共享性是合作得以成立和维持的前提——国家（共享"我们是同一国的人"）、宗教（共享"我们信仰同一个神"）、市场（共享"我们都认可这套交易规则"）。

  此区分的理论重要性：若代码型"协调"无需叙事是定义性真理（基础设施协议从不依赖共享意识形态——NTP不需要"我们都信仰时间同步的重要性"这一叙事即可运行），但那只是"协调"命题而非"合作"命题。推论对BR-L2-003的理论修正程度取决于哪类案例填充了非平凡格（薄叙事+大规模合作）：若填充格的是基础设施协调型案例（如Linux kernel开发——贡献者之间shared goal是"做出最好的内核"而非仅遵循补丁提交规则），则"合作"命题成立；若填充格的是纯协调型案例（如所有人在同一区块链上各自独立交易——彼此无shared goal），则推论证明的是较弱的"协调无需叙事"命题，对BR-L2-003的理论修正仅限于"基础设施层协调"而非"社会合作"的一般理论。诚实注册此区分：推论的预测（a）（b）（c）需确保样本中的代码型合作体满足shared intentionality的合作定义（shared goal + mutual knowledge），而非仅满足"分布在协议规则下的独立行动"的协调定义。建议新增合作vs协调的操作化判据（一次性注册）——合作体成员投票/提案中引用共享集体目标的频率>20%视为shared goal存在，<5%视为纯协调。

【防平凡化守卫】若有人说"'信息透明促进合作'或'技术降低信任成本'——这有什么新鲜的？"，非平凡增量在：（i）推论不做泛泛的"技术→合作"相关，而是注册了严格的相关性分叉口径——叙事型vs代码型的相关性应统计学显著不同，且代码型中可为零相关——这不是"技术有帮助"式的弱相关预测而是"叙事不再是必要条件"的强赌注；（ii）"必要条件降级"是对BR-L2-003这一特定、已被IEA=1.9验证的理论前提的修正——这不是对常识的重述，而是在库恩意义上对现有理论范式的限定（"只在X条件下成立"）；（iii）功能替代分析（AI能力→合作三问题→替代）提供了从机制到预测的完整因果链，而非"技术改变社会"的黑箱叙事。

累程收窄声明（r5审查要求，五轮独立审查后显式标注）:
  经五轮独立对抗审查后，本推论当前有效主张显著窄于原始声称。原始headline声称"想象秩序从必要条件降级为充分非必要条件"——五轮审查后的限缩：(i)降级对象从"想象秩序（三元包）"收窄为"内容叙事（意识形态/文化认同/价值共享）"，结构叙事（规则会被执行的元信任）仍为必要——推论的实质是叙事压缩而非叙事消除（见cl.4自反性声明）；(ii)射程限定为bootstrap后的稳态运行阶段——冷启动/初始信任建立阶段叙事可能仍为必要（见excluded_outcomes bootstrap限定）；(iii)代码型协调的射程限定为验证型信任可达的合作体（基础设施上移判据三选≥2，见anti-talisman cl.4修订版）——纯协调型基础设施不在合作射程内（见discriminant_validity协调vs合作区分）；(iv)"必要条件降级"的严格表述为"内容叙事从必要条件降级为充分非必要条件；结构叙事从厚仪式维护形式压缩为薄基础设施信任形式"（见cl.4自反性声明）；(v)薄叙事+大规模合作可能是生命周期瞬态而非稳态——代码延长薄叙事半衰期但不可取消叙事涌现的必然性（见excluded_outcomes叙事必然涌现）。


