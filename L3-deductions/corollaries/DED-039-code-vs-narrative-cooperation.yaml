id: DED-039
type: deduction
layer: L3-deductions
status: candidate
term: "AI共享代码×大规模合作：想象秩序的必要性降级 (Code-Shared Cooperation: Demoting Imagined Orders from Necessary to Sufficient Condition)"

人话摘要: "人类大规模合作一直靠'大家都信同一个故事'——国家、宗教、市场都是靠人们共同相信一套叙事才让陌生人愿意合作。但AI不一样：它有无限记忆（谁干了什么全记得）、永不疲劳（7x24执行规则）、不偏袒任何人（算法面前人人平等）。这意味着，以后陌生人之间不用先'信同一个故事'，靠'信同一套代码'也能大规模合作——'想象秩序'在大规模合作中的地位，从'没它不行'降级为'有它更好但没它也行'。"

statement: |
  【六轮审查后主动停留candidate——2026-07-16架构决策】
  本推论经历了六轮独立对抗审查（r1-r6），零条required级缺陷（核心逻辑骨架从未被攻破，
  DED-004/007六轮未复发），但面临一个结构性约束：推论的证实条件（"真正代码型协调社会"——
  验证型信任可达且薄叙事+大规模合作）在当前技术-社会条件下近乎空集。这不是推论质量的问题，
  而是它的证实对象在2026年尚不存在于可观测世界中。推论描述的是代码型协调的【理论可能性】
  而非【当前实践常态】——六轮审查中每位独立审查者都会重新发现同样的测量/射程边界问题，
  不是因为没修，而是因为这些边界在当前世界中无法被经验穿越。保留核心洞察（BR-L2-003×BR-L2-026
  →内容叙事从必要条件降级）供L4复合推论使用，不追求形式上凑够verified。详见review_summary
  与ADV-REVIEW-044（六轮全档）。

  【核心】AI以无限记忆+永不疲劳+无偏袒的算法执行，可在无共享叙事共识（narrative consensus）的条件下实现同等乃至更大规模的陌生人合作——大规模合作的基础从"相信同一个故事"（imagined order）扩展为"相信同一套代码"（algorithmic order），想象秩序在合作理论中的地位需从必要条件降级为充分非必要条件。

  【驱动量】两个独立可测的前件：（1）协调媒介类型——合作体依赖"叙事型协调"（共享意识形态/文化认同/宗教信仰来对齐行为预期）vs"代码型协调"（算法规则+不可篡改的记录+自动执行来对齐行为预期）的程度；（2）叙事厚度——合作体内部共享叙事/意识形态/文化认同的强度，从"厚"（强意识形态组织：政党/教派）到"薄"（纯功能协调：开源代码仓库/链上治理投票）。两者的测量轴彼此独立：一个合作体可同时是薄叙事+代码主导、厚叙事+代码主导、薄叙事+叙事主导、厚叙事+叙事主导。

  【预测】（i）代码型协调主导的合作体中，叙事厚度与合作参与规模的相关性显著弱于叙事型协调主导的合作体——且代码型协调体中叙事厚度与合作规模可为零相关乃至不相关；（ii）同一类型合作体中，AI代码协调渗透率越高，叙事厚度对合作规模的边际贡献越低；（iii）从叙事型向代码型协调迁移时，合作规模可以增长而不伴随叙事厚度的同步增长——即"规模增长"与"叙事增厚"解耦。

  【判别】不同于"技术决定论"——本推论不声称代码必然取代叙事，只声称代码使"无叙事的大规模合作"成为物理上可能，叙事从必要条件降为选项。不同于Lessig的"Code is Law"——Lessig说代码是规制行为的一种模态（与法律/社会规范/市场并列），本推论说代码可替代使其他模态有效的叙事基础设施本身。不同于"理性选择理论"——folk theorem已承认自利个体可在无共享价值下合作，但依赖小群体+重复交互；本推论的特有主张是AI代码使这种"无价值共识的合作"在陌生人+大规模+非重复交互的条件下变得可能——这突破了folk theorem的适用范围约束。

  【范围精确化——内容叙事降级 vs 结构叙事压缩】BR-L2-003的"必要性"涵盖三重：共享规范+抽象制度+想象秩序。本推论声称被降级的是"想象秩序/共享叙事"这一特定成分——即"一群陌生人需要共同相信同一个故事/意识形态/文化认同才能合作"这一前提。在此基础上区分两层：(i)内容叙事（content narrative）——"我们信仰什么"（意识形态/文化认同/价值共享），在代码型协调中可从必要条件降级为充分非必要条件；(ii)结构叙事（structural narrative）——"规则会被执行"这一元信任（法治/合同执行/基础设施信任），在当前所有已知案例中仍为必要——边界案例（Uber/Airbnb需法律叙事框架）已揭示此张力。推论的核心主张是内容叙事层降级（narrative compression rather than elimination），结构叙事层的降级是更强的赌注，不在本DED射程内，留待后续推论。

  【可检验的降级边界】注册以下判据以区分"内容叙事降级"vs"三元包降级"：(i)若代码型协调体在无共享内容叙事（意识形态/文化认同）但保留共享制度基底（如嵌入国家法律框架/使用标准化合同）下实现大规模合作→"内容叙事降级"成立，本推论的核心主张被支持；(ii)若代码型协调体在完全无制度基底（如纯链上DAO，无任何国家法律框架的承认或合同保护）下实现大规模合作→"三元包降级"成立，这是比本推论更强的经验发现；(iii)若所有已知大规模代码型协调体均深度依赖制度基底（法律/合同/产权），则"内容叙事降级"仍可成立但理论贡献不延伸至BR-L2-003的整体必要性主张。

operationalization:
  coordination_medium_type:
    definition: "合作体中协调行动所依赖的主导媒介类型——叙事型（靠共享故事/意识形态/文化认同来对齐行为预期）vs代码型（靠算法规则+不可篡改的记录+自动执行来对齐行为预期）。一个合作体可同时包含两种媒介，按主导比例编码。"
    measurement: |
      内容分析编码（一次性注册，不得事后调整）：
      （i）抽取合作体内部协调通信样本（论坛帖子/治理提案/社区文档/投票理由陈述，样本量≥200条或全量，取时间窗口内随机抽样）；
      （ii）对每条通信编码：是否引用共享价值观/意识形态/文化认同来论证协调行动（叙事型），还是引用协议规则/链上数据/算法逻辑来论证（代码型）；
      （iii）叙事型占比 = 叙事型通信数 / 总协调通信数。叙事型占比<30%为代码型主导，>70%为叙事型主导，30-70%为混合型。
    limitations: "编码本身是解释性的，需双盲编码+编码者间信度检验（Cohen's κ≥0.7）。最关键边界：'引用协议规则'可能隐含对协议本身的价值认同——编码仅取表面论证形式，不推断深层动机。若同一通信同时引用两类论证，取主导论证形式。"

  narrative_thickness:
    definition: "合作体成员间共享的意识形态/文化认同/价值叙事的强度——不是'有没有叙事'，而是叙事在多大程度上被视为合作参与的必要前提。"
    measurement: |
      三项独立指标合成（在见任何合作规模数据前锁定权重，等权）：
      （i）准入门槛中的意识形态要求——加入合作体是否需要宣誓/认同某套叙事（如入党需认同党章，入DAO只需连接钱包；操作化：查阅组织章程/加入流程，二分编码：有意识形态门槛 vs 无）；
      （ii）内部话语中的叙事密度——随机抽取内部通信，叙事型通信占比（操作化同coordination_medium_type）；
      （iii）争议叙事中的叙事诉求——发生争议时，社区以"违背了我们的共同信念"论证的频率 vs "违背了协议规则"论证的频率（抽取争议讨论线程≥50条）。
      三项等权合成：厚 = （i）有意识形态门槛 + （ii）叙事密度>70% + （iii）叙事诉求>50%；薄：三项均不满足；中：其余。
    limitations: |
      叙事厚度是连续量，三分档是为匹配被预测量档位的操作简化。若连续测量能提供更精细的证伪，优先用连续量（将三项z-score后等权加总）。
      最关键的陷阱：不得由"该合作体成功了/规模大了"反推"它的叙事肯定够厚"——anti_talisman_clause（1）执行此禁令。
      诚实标注（测量独立性风险）：指标(ii)与coordination_medium_type共享编码方案和样本——同一批编码数据同时用于判定"该合作体是代码主导还是叙事主导"和"该合作体的叙事厚度"。这意味着两个驱动量的测量误差相关——编码者的叙事型vs代码型分类偏差会同时影响两个变量的取值。这不改变两个变量在概念上的独立性（一个回答"用什么方式协调"，一个回答"叙事有多强"），但降低了它们在统计检验中作为正交回归元的效力。建议在预测(i)的检验中补充VIF（方差膨胀因子）诊断——若VIF>5，两个驱动量不宜同时进入回归模型。

  cooperation_scale:
    definition: "合作体中持续参与协调行动的活跃主体数量——不是注册/订阅数，而是实际参与合作行为的个体数（提交代码/投票/贡献资源/参与治理讨论等）。"
    measurement: |
      分合作体类型的口径（一次性注册）：
      代码型（开源社区/DAO）：月活跃贡献者数（提交+审查+投票+提案，一个地址=一个主体，跨地址去重需额外证据——如Gitcoin Passport/POH的Sybil清洗或手动实体解析）；
      叙事型（传统组织）：(A)付费/登记成员数中实际参与集体行动的比例（需内部活动记录——会议出席/投票/志愿服务等）；(B)月活跃参与者绝对数（月内至少参与一次集体行动的唯一个体数）——口径(B)为与代码型"月活跃贡献者数"的对齐度量，预测(i)的主检验使用同类绝对数口径（两类型均用月活跃人数），参与率口径(A)作为稳健性检验；
      混合型：分别按上述口径测，取两者分别报告。
      大规模阈值锚定：月活跃>1000视为"大规模"。锚定逻辑——假设月活跃/总成员比在5-20%范围，总成员>1000↔月活跃>50-200，取保守上界>1000以确保月活跃规模确实大；引用开源社区研究的small/medium/large分类惯例作为参照。同步注册BR-L2-003兼容口径：总参与者数（或注册成员数）>1000。在预测(i)-(iii)的敏感性分析中检验月活跃阈值在500/1000/2000/5000四个档位下预测方向是否稳健。若月活跃>1000口径与总参与者>1000口径下的预测方向不一致，诚实报告并讨论口径差异对理论对接的影响。
    limitations: "一个地址≠一个主体是加密生态的核心测量难题（Sybil攻击）。保守处理：当Sybil清洗被采用时优先取清洗后数据；无清洗时报告原始数并诚实标注'可能存在Sybil注水'。若Sybil清洗后合作规模暴跌，这本身是支持本推论的额外证据——代码型协调对叙事厚度不敏感但对身份唯一性成本敏感。度量对齐诚实标注：代码型合作规模（月活跃贡献者）与叙事型合作规模的口径(A)（参与率）是不同量纲的度量——前者是绝对水平值，后者是比例。两者的量纲差异使预测(i)的相关性比较面临系统性偏差风险。首选用口径(B)(月活跃参与者绝对数)进行主检验；若口径(B)不可得，在解释相关性差异时考虑度量构造本身的贡献，并补充'总参与者数的对数'（两种合作体均可计算）作为量纲中立的稳健性检验。"

derivation:
  from_l1:
    axioms: [AXIOM-002, AXIOM-003]
    theorems: [THEOREM-cooperation-precondition]
  from_l2:
    bridging: [BR-L2-003, BR-L2-026]
  steps: |
    1. "BR-L2-003：想象秩序是当前大规模陌生人合作的基础设施"
       BR-L2-003确立：人类之所以能让成千上万素不相识的陌生人一起合作（国家、宗教、市场），靠的不是熟人互惠或血缘，而是大家共同相信的规矩和"想象出来的秩序"——共享叙事使陌生人之间产生"对方大概会怎么做"的预期，从而越过合作前提定理（THEOREM-cooperation-precondition）所要求的"双方都相信对方会配合"这一信任门槛。BR-L2-003的可证伪条件将"无共享规范/制度/想象秩序的大规模合作（N>1000）"设为反例——这意味着在当前理论中，想象秩序被认为是大规模合作的必要条件。此步产出：问题框架——大规模陌生人合作需要什么东西来桥接信任鸿沟。

    2. "BR-L2-026：AI在协调相关的维度上具有人类不具备的能力"
       BR-L2-026确立AI在三个与协调直接相关的维度上远超人类：
       （a）工作记忆广度——上下文窗口可达数百万token，RAG可外延至任意规模；替代人类记忆的有限性（7±2信息块）与关系追踪的Dunbar数约束（~150）。
       （b）关系追踪规模——可同时追踪数百万个体的交互历史并分别定制策略，无已知认知上限——这直接瓦解了BR-L2-003依赖的"陌生人之间缺乏彼此了解→信任鸿沟"这一前提。
       （c）运作连续性——24/7不间断运行，不受睡眠/疲劳/注意力波动约束——这使规则执行可以在任何时刻保持一致性，不像人类执法者会因注意力稀缺（BR-L2-027）而产生选择性执法。
       另需诚实标注：BR-L2-026也枚举了AI系统性缺失的维度（具身体验/演化遗产/真实情感/死亡意识），这些缺失在合作中的意义见下一步的功能替代分析。此步产出：工具库——AI具备人类协调者在信息记录/关系追踪/规则执行三个维度上无法企及的"硬件"。

    3. "功能替代分析：映射AI能力到合作的三个核心问题"
       大规模陌生人合作（BR-L2-003的框架）需解决三个核心问题：
       （i）信息问题——"谁做了什么贡献？谁欠谁？谁违规了？"在无AI的世界里，这靠叙事中的"集体记忆"（"我们都记得/相信那段历史"）来近似解决。AI的无限记忆（BR-L2-026a）+关系追踪（BR-L2-026c）提供确定性替代：链上数据不可篡改地记录了历史，无需任何人"相信"——只需验证。
       （ii）信任问题——"我怎么知道陌生人会配合？"在叙事型协调中，信任来自"我们都信仰同一个神/同一个理念，所以对方不会背叛/背叛有道德代价"。AI提供的替代是：代码公开透明+执行自动且不可干预——对方就算想背叛也做不到（协议强制）、或不值得（自动罚没使背叛净收益为负）。信任从"对人/对叙事的信仰型信任"转向"对代码/对验证的验证型信任"。
       （iii）执行问题——"谁去惩罚违规者？惩罚如何不被滥用？"在叙事型协调中，这靠"共同信仰的价值→义愤→第三方惩罚（BR-L2-014）"驱动。AI替代：违规自动触发罚没/降权/踢出——无需道德义愤，只需代码执行。且算法无偏袒（不受内群体偏好BR-L2-006或亲缘利他BR-L2-002干扰），执行一致性问题被消除。
       诚实标注：BR-L2-026的缺失维度（真实情感/具身体验/死亡意识）在合作的"动机维护"和"危机弹性"维度上可能构成代码型协调的短板——人在疲惫/受挫时，共享叙事提供的归属感和意义感可能在维持参与意愿上不可替代。此问题见excluded_outcomes与boundary_cases。

    4. "合力：代码型协调可独立支撑大规模合作——必要条件降级"
       步2确立AI的三种协调能力，步3确立这三种能力分别映射到合作的三核心问题。当三问题均由代码而非叙事解决时，共享叙事不再是合作的前提条件——两个陌生人可以不信同一个神、不认同同一个价值、不共享任何文化叙事，只要都（且只需要）"接受同一套代码的规则"，就能合作。
       关键限定：BR-L2-003的"想象秩序是必要条件"主张在此处被限定——它只在"人类是唯一的信息处理单元"这一隐含前提下成立。当AI成为可选的信息处理单元，该约束被移除，必要条件退化为充分条件：有想象秩序→可以大规模合作（BR-L2-003的原始主张，仍然有效），没有想象秩序但有代码→也可以大规模合作（本推论的新增主张）。

    5. "预测导出：叙事厚度-合作规模的相关性分叉"
       步4的逻辑推论：若代码型协调体中叙事非必要，则叙事厚度与合作规模的关联应显著弱于叙事型协调体。由此导出：
       预测（i）：代码型协调体中叙事厚度与规模的r显著小于叙事型（Fisher's z检验）；
       预测（ii）：同一体中AI渗透率↑→叙事厚度的边际贡献↓（交互项系数<0）；
       预测（iii）：叙事→代码迁移中Δ规模>0且Δ叙事≈0（解耦）。
       关键预测（i）中的"零相关"是强赌注——不是"弱相关"，而是统计不显著。若为弱但显著的正相关，需解释为"代码型协调中仍有叙事残余影响"而非"全替代"。

    6. "非平凡性（逐格判空）"
       2×2排列表见nontriviality_test。承重砖边际贡献诚实点名：
       BR-L2-003提供"想象秩序-合作规模"的基线关系——在纯人类协调中，叙事厚度与合作规模正相关。BR-L2-026提供AI协调能力的枚举——记忆/关系追踪/连续性。两块砖各自不含"叙事从必要条件降级"的声称：BR-L2-003完全未讨论AI，BR-L2-026完全未讨论合作理论中的叙事/想象秩序。推论本身的增量：（a）将两砖焊接为"AI可替代叙事解决合作三核心问题"的功能等价命题；（b）导出可检验的相关性分叉预测——薄叙事+代码型协调→仍可大规模合作。这是需要两砖合力的涌现格，不在任何单砖中。

falsifiability: |
  【三条注册口径，一次性注册，不得事后调整】

  （a）叙事-规模相关性分叉口径：在叙事型协调体中，叙事厚度与合作规模的正相关应显著成立（控制合作体年龄/资源/参与门槛后r>0，p<0.05）；在代码型协调体中，该相关性不显著（p≥0.05）或显著弱于叙事型（r_code < r_narrative，Fisher's z单侧检验p<0.05）。若代码型协调体中叙事厚度与合作规模仍显著正相关且与叙事型无显著差异，核心主张（叙事从必要条件降级）被证伪。检测样本量≥30个合作体（每类型≥15）。

  （b）AI渗透率-叙事边际贡献口径：在同一合作体中，AI代码协调渗透率（算法自动执行而无人工干预的协调决策占比——操作化：对合作体的协调决策日志抽样，编码各决策是否经人工讨论裁决 vs 算法直接触发执行）越高，叙事厚度对合作规模的边际贡献越低——叙事厚度×渗透率的交互项系数<0（面板固定效应模型，控制合作体年龄/资源/参与门槛）。若渗透率变化不减弱叙事厚度的边际贡献，功能替代机制被削弱。渗透率测量须独立于叙事厚度和合作规模——三者不得共享测量维度的信息源。

  （c）规模-叙事解耦口径：合作体从叙事主导转向代码主导的历史案例中（如从论坛治理→链上投票的DAO，或从集中式→分布式版本控制的开源项目），合作规模的增长不应伴随叙事厚度的同步增长——即Δ规模>0（合作主体增加）而Δ叙事厚度≈0（叙事厚度无显著时序变化，配对t检验p≥0.1）。若所有叙事→代码迁移案例均显示规模增长伴随叙事同步增厚，解耦被削弱——需进一步检验增厚是规模效应（规模大了自然需要叙事）还是代码型协调本身无法独立维持大规模合作的标志。

    【崩解非对称性——低叙事摩擦系统的加速崩解风险（r5审查要求）】代码型协调系统的崩解速度在理论上系统性快于叙事型系统——叙事型系统中的"持有信念"可缓冲恐慌传播（"别人还在信所以我也不卖"），代码型系统中无此缓冲层：当算法前提被挑战时，个体理性→率先退出，缺乏"共同渡过"的叙事黏性→正反馈加速。历史案例：(i) Iron Finance（2021年6月，72h内SOV归零）——纯算法稳定币，薄叙事，崩解呈死亡螺旋；(ii) Ethena USDe（2024-2025，算法叙事脆弱性）——市场恐慌中USDe的算法机制虽维持了锚定但社区叙事真空使持有者信心高度依赖做市商而非社群黏性；(iii) Bybit 2026黑客事件后纯代码型复苏——代码型基础设施（链上验证/自动清算/协议强制）使交易功能快速恢复，但SOV/信心层的恢复显著慢于技术层恢复——代码可快速重建"能交易"但不可快速重建"敢持有"。hazard ratio检验：代码型系统在同等烈度冲击下的崩解概率高于叙事型系统（HR_code > 1），且崩解速度更快（time-to-collapse更短）——这是"叙事→缓冲"vs"无叙事→无缓冲"的直接可测推论。若实证上代码型系统崩解概率不高于叙事型或速度不更快，则"叙事→黏性"机制需重新审视，但不推翻（a）的核心相关赌注（那已是独立检验）。
  【汇总裁决】若（a）（b）（c）中仅（a）成立而（b）（c）不成立，推论需降级：代码型协调与叙事型的差异可能是选择效应（代码型协调一开始就吸引了叙事需求低的群体/场景）而非"代码替代叙事"的因果机制。若三个均不成立，推论全面证伪。

  【AI特异性失败条件】若预测(b)显示AI渗透率的交互项系数≥0（即AI渗透率变化不降低叙事厚度的边际贡献），且薄叙事+大规模合作的观测案例主要出现在无AI代码协调系统中（如Wikipedia式wiki版本控制+社群规范、Git的分布式版本控制、SWIFT的标准化报文），则推论的核心主张需从"AI代码使想象秩序降级"修正为"代码型协调（含非AI数字工具）可替代叙事"——因果权重从AI特有能力（无限记忆/关系追踪/连续性）转移至广义技术协调基础设施（确定性规则+不可篡改记录+自动执行）。

