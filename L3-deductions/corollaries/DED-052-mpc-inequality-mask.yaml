id: DED-052
type: deduction
layer: L3-deductions
status: verified
term: "MPC收入梯度×不公平厌恶：消费Gini作为财富Gini的掩码器 (MPC Income Gradient × Inequity Aversion: Consumption Gini as a Masking Device for Wealth Gini)"

人话摘要: "富人和穷人的收入差N倍,但花的钱只差M倍(M<N)——因为富人大多存起来了。猴子实验告诉我们:公平感靠'看得见的东西'触发——邻居开什么车、穿什么衣服,而不是他股票账户里有多少钱。所以MPC梯度(穷人几乎全花、富人大多存)客观上把财富差距'压缩'成了看起来更平滑的消费差距,降低了触发'不公平!'这种感觉的可见信号。信贷扩张(穷人借钱消费追赶)进一步压平了消费差距→不公平感暂时下降→但实际财富差距继续拉大→债还不上的时候,痛苦被延迟但加倍。"

statement: |
  【核心】MPC收入梯度(BR-L2-029)充当了财富不平等的可见性掩码器——不公平厌恶(BR-L2-013)由可观察的不平等触发(灵长类实验:猴子只对"看得见的"不平等产生拒绝反应),而MPC梯度将财富Gini"压缩映射"为更平滑的消费Gini(富人收入是穷人N倍,但因高储蓄率消费可能只有M倍,M<N),客观降低了触发不公平感知的可见信号密度。这不是声称人们"被愚弄"——这是结构性的信号衰减:触发公平感知机制的客观刺激(可观察消费差异)系统性弱于实际资源分配差异(财富持有差异)。信贷扩张通过拉高穷人短期消费进一步压缩消费Gini→不公平感进一步下降→但财富Gini持续扩大→债务不可持续时崩盘→痛苦被延迟但加倍。

  【驱动量】三个前件均独立于公平感知结果可测:(1)MPC收入梯度——各收入分位对意外收入的边际消费倾向,从家庭收支调查的准实验变异中估计;(2)财富Gini与消费Gini的楔子——同一国家/时期两套Gini之差,财富Gini来自资产负债表调查,消费Gini来自家庭消费支出调查;(3)消费可见度结构——不同消费品类在社会互动中的可见度(房子/车子/衣着 vs 养老金账户/信托/离岸资产),按消费品类在社会信号文献中的可见度排名事前编码。

  【预测】(i)跨国截面:财富Gini与消费Gini差距越大的国家(即MPC梯度的Gini掩码效应越强),其居民不公平感知调查得分系统性低于财富Gini单独预测的水平——控制收入Gini后仍成立;(ii)时序:同一国家内,MPC梯度陡峭化时期(高收入群储蓄率上升快于低收入群),消费Gini增速系统性慢于财富Gini增速,且不公平感知调查得分与财富Gini的相关性在此期间减弱;(iii)信贷调节:信贷扩张(穷人消费信贷可及性外生上升)期间,消费Gini被进一步压缩、不公平感知进一步下降,但该效应在信贷收缩期逆转且幅度更大(不对称——下去容易上来难);(iv)品类梯度:高可见度消费品类(住房/汽车)的消费不平等与不公平感知的相关性,显著强于低可见度品类(金融服务/保险)的消费不平等——因为前者才是触发BR-L2-013的信号载体。

  【判别】vs标准不平等感知文献(如Alesina/Di Tella等"不平等-幸福感"回归)——标准文献将财富Gini或收入Gini直接作为自变量,未区分可见与不可见不平等,也未纳入MPC梯度作为掩码器。本推论的独有预测是:两个财富Gini相同的国家,MPC梯度更陡(或消费信贷更发达)的那个,不公平感知更低——这是财富Gini本身给不出的微分预测。vs炫耀性消费(Veblen)文献——Veblen讲富人主动炫富,本推论讲的是反向机制:富人不消费的部分(储蓄)客观上构成了掩码,且这是MPC梯度的副产品而非有意为之。vs"贫富差距感知偏差"心理学——这是认知偏误(人算不准),本推论是结构性信号衰减(信号客观上就弱),不需假设认知错误。

operationalization:
  mpc_gradient:
    definition: "各收入分位对意外收入的边际消费倾向——收入每增加一单位,消费增加的比例,按收入分位估计。"
    measurement: |
      从家庭收支调查的准实验变异中估计——利用外生收入冲击(彩票中奖/退税/政策转移支付)按事前收入分位分组,估计各组的MPC。梯度陡度=最高收入分位MPC与最低收入分位MPC之差(或比值)。统计量:国家层面MPC梯度=低收入组(底层20%)MPC - 高收入组(顶层20%)MPC。
    limitations: "干净的准实验收入冲击稀少;跨国可比性受调查口径差异影响;MPC估计对冲击类型(暂时/永久/预期内/预期外)敏感,需统一使用暂时性意外冲击口径。"
  wealth_consumption_gini_wedge:
    definition: "同一国家同一时期财富Gini与消费Gini的差距——财富Gini来自家庭资产负债表,消费Gini来自家庭消费支出调查。"
    measurement: |
      楔子 = 财富Gini - 消费Gini。财富口径:家庭净值(金融资产+非金融资产-负债),按OECD/WID/WB标准化定义;消费口径:家庭最终消费支出(含耐用品的服务流估算,不含购房支出)。两套Gini从各自独立调查中计算——不得从同一套调查同时取财富和消费(避免共同方法偏差)。统计量:跨国截面取最近可用年份;时序取同一调查工具追踪。
      【数据源独立性核查】财富Gini最常用数据源:WID.world(基于税收记录+国民账户)、OECD Wealth Distribution Database(基于各国统计局上报)、Credit Suisse Global Wealth Report(基于资产负债表外推)。三者底层测量链共享部分税收/国民账户输入,独立系数≤0.3(WID与OECD之间部分手算)。消费Gini数据源:各国HIES/HBS支出调查,与财富数据的测量链分叉点在家庭层面——消费来自流水账/回忆问卷,财富来自资产登记/估值模型,测量链独立系数约0.6-0.8。引用时诚实标注:不要将"WID+OECD+CS"三源一致当作三重独立验证。
    limitations: "财富调查顶层低报严重(富人资产隐藏/拒访),使财富Gini系统性低估;消费调查也有低报(尤其奢侈消费),使消费Gini也低估——两者低报的相对幅度不确定,楔子可能偏大或偏小。建议以财富Gini下限估计(经逃税调整)+消费Gini上限估计取保守楔子。"
  unfairness_perception:
    definition: "居民对'社会收入/财富分配是否公平'的主观评价——不是对自身经济状况的满意度,而是对社会分配结构的规范性判断。"
    measurement: |
      从跨国调查事前选取对口问题——优先ISSP Social Inequality模块的"income differences are too large"同意度(Likert 1-5)、WVS的"incomes should be made more equal"、ESS(欧洲)的"fairness of income distribution"。统计量:国家均值或"认为不公平"的人群占比。不可用"生活满意度"或"幸福感"偷换——那些混入了绝对收入效应,不是本推论的目标构念。
    limitations: "跨国调查的文化响应偏误(某些文化倾向选中间值/某些倾向极端值);翻译不等价;调查年份与Gini年份不匹配。优先使用同一波次调查内的国别均值,辅以锚点题项(anchoring vignettes)校准。"
  credit_expansion:
    definition: "消费信贷可及性的外生扩张——供给侧政策/技术事件使低收入人群的借贷门槛降低,非需求驱动的信贷增长。"
    measurement: |
      从监管政策文本事前编码——信用卡发卡门槛降低、消费贷利率上限取消、数字消费贷平台准入(如花呗/白条类产品的监管放行)、政府鼓励消费信贷的政策文件。以外生事件时点为编码节点。禁止以信贷余额增长率充当扩张度量(内生于需求)。
    limitations: "干净供给侧事件稀少;多数信贷扩张供需混杂,须以政策时点+未受覆盖对照人群(如未获授信的低收入组)识别。"
  consumption_visibility:
    definition: "不同消费品类在社会互动中被他人观察到的程度——品类A的消费比品类B的消费更可能被邻居/同事/熟人看到。"
    measurement: |
      按消费社会学文献(Heffetz 2011/Charles et al. 2009的可见度排名)事前编码,三档——高可见(住房/汽车/服装/珠宝/餐饮外食)、中可见(电子设备/家具/旅游)、低可见(保险/养老金缴款/金融服务/水电公用/食品杂货在家消费)。统计量:高可见品类的消费Gini vs 低可见品类的消费Gini。编码在见任何国家公平感知数据前锁死。
    limitations: "可见度排名随时代变化(如社交媒体改变了某些品类的可见度);排名在不同文化间有差异——以Heffetz美国消费者调查的可见度排名为基准,跨国比较时辅以当地补充编码做稳健性检查。"

derivation:
  from_l1:
    axioms: [AXIOM-001, AXIOM-002]
    theorems: []
  from_l2:
    bridging: [BR-L2-013, BR-L2-029]
  steps: |
    1. "BR-L2-013:不公平厌恶由可观察的不平等触发——信号载体是眼睛能看到的"
       灵长类实验的核心发现:猴子只对"看得见的"不平等产生拒绝反应——同伴拿到葡萄而自己拿到黄瓜时,猴子拒绝交换;但如果看不见同伴的待遇,拒绝反应消失。人类实验复制:三四岁小孩分糖果,看得见别人拿更多时才会抗议。这条砖确立了公平感知的触发条件——不是"知道"不公平存在,而是"看见"不公平信号。可观察消费(房子/车子/衣着/餐饮)是现代社会中最密集的不平等信号载体;抽象财富(股票/信托/离岸账户)不在日常社会互动的可见频谱内。

    2. "BR-L2-029:MPC随收入递减——财富差距的消费表达式被系统性压缩"
       穷人MPC高(意外多一块钱几乎全花掉——有一堆想买而买不起的东西),富人MPC低(多一块钱大多存起来——想买的早买了)。直接后果:若A的收入是B的N倍,但因A的MPC远低于B,A的消费可能只有B的M倍,且M<N。MPC梯度越陡(高收入群储蓄率越高/低收入群生活必需支出占比越大),M与N的差距越大。这不是任何人的主观选择——这是不同收入水平下"未被满足的基本需求"量的结构性差异。

    3. "合成:MPC梯度将财富Gini'压缩映射'为更平滑的消费Gini——掩码器"
       步骤1说:公平感知的触发信号在消费端。步骤2说:MPC梯度在财富→消费的映射中施加了非线性压缩(富人储蓄率高→财富增长不转化为等比例消费增长)。两砖合力:触发公平感知的信号(消费不平等)系统性弱于实际资源分配不平等(财富不平等),且弱化程度由MPC梯度的陡度决定。这不是"看不见所以不存在"的天真说法——是客观信号密度降低:在MPC梯度陡峭的社会里,财富排名前1%的人与中位家庭之间的消费差距,远小于他们之间的财富差距。邻居开奔驰而你开丰田——你感受到的差距到此为止;你不会在日常互动中"看到"邻居还有两千万信托和三套投资房。

    4. "信贷扩张的短期掩码放大与长期反噬"
       信贷让穷人消费超出当期收入(借债消费追赶)→消费Gini被进一步压缩→可见的不公平信号进一步减弱→不公平感知下降。但财富Gini并不因信贷而缩小(借贷不创造净资产,甚至因利息支付使穷人净资产更差)。这是掩码效应的短期强化——信贷充当了财富Gini与消费Gini之间的"临时填充物"。当债务不可持续(收入中断/利率上升/信贷收缩),穷人消费大幅回落→消费Gini反弹→被压抑的不公平感知集中释放→且因财富Gini在此期间已进一步扩大,暴露出来的差距比当初更大。痛苦被延迟,但被加倍。

    5. "非平凡性(逐格判空)"
       2×2判据表见nontriviality_test。承重砖边际贡献诚实点名:
       BR-L2-013贡献"公平感知依赖可见信号"这条通道——但不涉及MPC梯度,不涉及财富-消费Gini楔子,不涉及信贷的掩码-反噬动态;
       BR-L2-029贡献"MPC随收入递减"这条行为规律——但BR-L2-029完全不谈公平感知,不声称MPC梯度影响社会对不平等的判断;
       AXIOM-002(信息熵增)贡献"信息需依附物理载体"的底层约束——偏近定义砖,仅支撑"不可见信息不触发感知"的逻辑地板。
       本推论的非平凡增量:"MPC梯度的陡度是财富不平等可见性的一个结构性调节器"——两砖各自沉默,只在首尾相接时才产出。

falsifiability: |
  【四条可证伪预测,各自独立可毙】
  (a) 跨国截面检验:控制财富Gini后,消费Gini(而非财富Gini)应是不公平感知的更显著预测变量——因为公平感知的触发信号在消费端。若财富Gini在控制消费Gini后仍显著预测不公平感知且效应量不衰减(即财富Gini有超越消费Gini的独立解释力),则掩码机制的必要条件被削弱——说明民众能"穿透"消费信号感知财富不平等。
  (b) MPC梯度调节检验:财富Gini-消费Gini楔子越大的国家(即MPC梯度越陡),不公平感知对财富Gini的弹性应越小——因为更大的财富差距被压缩为更小的消费差距。若楔子与弹性无关(即不管MPC梯度多陡,民众对财富不平等的感知都一样灵敏),则掩码机制被证伪。
  (c) 品类梯度检验:高可见度消费品类(住房/汽车/衣着)的消费不平等与不公平感知的相关性,应显著强于低可见度品类(保险/金融服务)的消费不平等。若两相关系数无差异(即不管是可见还是不可见品类,消费不平等都一样触发不公平感),则BR-L2-013的"可观察不平等"触发条件在本领域不成立。
  (d) 信贷膨胀-崩盘时序检验:外生信贷扩张期间不公平感知应下降(掩码变厚),信贷收缩/债务危机期间不公平感知应反弹且超过扩张前基线(掩码撕裂+被延迟的痛苦释放)。若信贷扩张前后不公平感知无变化(掩码机制不运作),或收缩期无超调反弹(只有延迟无加倍),则该条被部分或全部证伪。
  适用区间:仅覆盖财富不平等主要通过消费信号被感知的社会(即财富信息不直接公开的社会)。在受(1a)财富信息制度透明或(1b)高强度财富不平等政治动员影响的社会,掩码机制可能不运作——此时(a)不应成立。

falsification_trace:
  primary_suspect: |
    步骤3的因果链核心——"MPC梯度压缩消费Gini→降低不公平感知的触发信号密度"。最可能的竞争解释:民众对不平等的感知并非主要来自日常消费观察,而是来自媒体/政治话语/公开统计数据的"二阶信息"。如果民众的不公平感主要由"读到的基尼系数"或"听到的政治辩论"驱动,而非"看到的邻居消费"驱动,那么消费Gini与财富Gini之间的楔子就与公平感知无关——掩码机制被核心证伪。检验路径:若(b)被证伪(楔子大小不调节不公平感知弹性),(a)仍可存活但掩码机制退化为"民众恰好看消费而非财富"的弱相关性声明,不再是归因声明。
  secondary_suspect: |
    MPC梯度的跨国可比性与稳定性——MPC估计对冲击类型/收入定义/调查工具的敏感性可能使跨国楔子比较充满噪声。若MPC梯度本身测不准,则(b)的楔子调节检验变成"用噪声预测噪声",检验力不足——推论可能因测量不可靠而非逻辑错误而无法证实。同族风险:消费Gini与财富Gini的数据源独立性问题(operationalization中已诚实标注)——若跨国比较发现两个Gini数据源实际共享底层输入(如都依赖同一套国民账户的住户部门分配),则楔子是测量人工品而非真实经济结构。
  unlikely_suspect: |
    BR-L2-013的基本机制——不公平厌恶由可观察不平等触发,在灵长类实验/儿童发展实验/成人最后通牒博弈三类独立范式中反复验证(父砖IEA≥1.2,verified),是稳固的地基。BR-L2-029的MPC梯度方向在大量消费函数估计中稳健(已weakly_verified),梯度存在性是安全的——不稳定的是梯度的跨国可比较度量,而非方向本身。
  note: "primary_suspect若被坐实——即消费Gini楔子与不公平感知无关——本推论塌缩为'消费比财富更平滑'的会计陈述(由MPC定义平凡给出),掩码机制核心被毙。"

excluded_outcomes:
  - outcome: "财富信息制度透明——税务记录/资产登记法律上公开可查(de jure)"
    description: "按法律条文(de jure)事前编码,不含媒体报道频率。"
  - outcome: "高强度财富不平等政治动员——媒体/社会运动中财富不平等议题密度超过阈值"
    description: "按媒体内容分析事前编码,阈值在见数据前锁死。"
  - outcome: "极端通货膨胀/货币崩溃期间"
    description: "货币性冲击主导消费与储蓄行为,MPC的结构关系被打破——按宏观事件(年通胀率>100%或货币改革)事前认出。"
  - outcome: "战争/革命/政权更迭等政治断裂期"
    description: "不公平感知的驱动因素从日常消费观察切换为政治动员/暴力冲突——信号通道被政治事件接管。按武装冲突数据库(UCDP/PRIO)事前编码。"
  - outcome: "以实物经济为主的非货币化社会"
    description: "MPC概念依赖货币化交易,消费/储蓄/财富的分类在此类社会需重新定义——按货币化程度(货币交易占GDP比)事前认出。"

anti_talisman_clause: |
  【防不可证伪护身符——前件判定必须独立于公平感知结果】
  (1) 禁止由'不公平感知低'反推'该国的MPC梯度陡'——MPC梯度只从家庭收支调查的准实验变异中估计,不得从事后的公平感知数据回头校准。若某国财富-消费Gini楔子大但民众不公感也高,不得以'该国的楔子其实不够大/MPC梯度其实不够陡'为由排除——编码在见公平感知数据前锁死。
  (2) 禁止由'不公平感知没降'反推'该信贷扩张不算外生'——信贷扩张的外生性只认监管/政策文本的事前编码;不得因事后公平感知数据不符合预期而追加'其实不够外生'的排除。
  (3) 禁止由'消费Gini也高了'反推'其实可见度高的消费品类占比变了'——消费可见度排名按事前锁死的分类编码,不得因各国结果方向不一致而调整某品类在特定国家的可见度档位。跨国比较的稳健性检查(文化特异性可见度排名)可作为补充分析,但不得替代主线编码。
  (4) 不利证据不得用'该国民众其实通过(1a)制度透明渠道或(1b)高强度政治动员渠道感知到了财富不平等'来消解——如果(a)被多国证伪,此类渠道的存在恰好证实本推论的边界(掩码机制只在消费主导感知的社会运作),该边界必须写入射程限制而非事后自保。
  【削弱条件(明确列出)】若跨国截面控制消费Gini后财富Gini仍有独立显著效应且效应量不衰减→掩码机制必要条件被削弱;若MPC梯度-楔子调节效应不显著→掩码机制核心被削弱;若高可见品类与低可见品类的消费不平等→不公平感知弹性无差异→BR-L2-013的可见性通道被削弱。

nontriviality_test: |
  2×2判据表(自变量档:MPC梯度陡峭度×自变量档:消费信号可见度×被预测量:不公平感知对财富Gini的弹性):
  格(MPC梯度陡, 高可见消费品类)——「非平凡格」——预测此条件下不公平感知对财富Gini的弹性最小(掩码效应最强)。BR-L2-013只说"可观察不平等触发不公平厌恶",不说MPC梯度能压缩可观察不平等;BR-L2-029只说"MPC随收入递减",不说这会影响公平感知的任何维度。两砖各自不覆盖此格——此格为真组合增量,可被现实反例填空:若MPC梯度陡峭且消费品高度可见的国家,其不公平感知仍紧密跟踪财富Gini,该格即被填上、掩码机制被证伪。
  格(MPC梯度陡, 低可见消费品类)——预测此条件下不公平感知与消费不平等的关系弱于高可见品类,但掩码效应也应存在(毕竟所有消费品类都受MPC压缩)。若此格与上一格的实证差异不显著,(c)被证伪。
  格(MPC梯度平, 高可见消费品类)——预测此条件下不公平感知对财富Gini的弹性较大(掩码效应弱——因为富人也花得多,消费Gini紧跟财富Gini)。
  格(MPC梯度平, 低可见消费品类)——对照格,预测相关最弱或不存在。
  brick=conclusion自查:核心断言"MPC收入梯度是财富不平等可见性的结构性掩码器"未在BR-L2-013或BR-L2-029中出现原文或近义。两父砖均为通用行为命题(BR-L2-013来自灵长类实验+儿童发展实验,BR-L2-029来自消费函数估计),非为本推论窄化的专用砖。

real_world_anchors:
  supporting:
    - anchor: "美国:高财富Gini×中等消费Gini×长期相对温和的不公平感知——掩码机制的典型候选"
      evidence: |
        美国财富Gini在G7中最高(约0.85,顶层1%持有约35%财富),但消费Gini显著低于财富Gini(约0.35-0.40)。MPC梯度在美国证据充分:低收入家庭MPC接近1(退税/刺激支票到手的消费率),高收入家庭显著低于此。同时美国拥有发达的消费信贷市场(信用卡/房屋净值提取/先享后付),使低收入家庭的消费能力超出当期收入。不公平感知调查(ISSP/GSS)显示:尽管财富集中度持续上升(1980s以来),"收入差距太大"的同意度并未等比例攀升,且对"富人是否应被征更多税"的态度长期分化而非单向激化。本推论提供的解释:MPC梯度+信贷扩张压缩了消费Gini,财富不平等的日常生活可见度低于其实际规模。
        诚实标注:美国不公平感知受党派认同/媒体框架的强力调节,无法将"不公平感知温和"全归因于掩码机制。该锚只承重方向一致性,不承重单因归因。
      confidence: moderate
    - anchor: "中国:财富Gini快速上升×消费Gini相对温和×信贷扩张压缩消费差距"
      evidence: |
        中国财富Gini据估计自2000年以来快速攀升(约0.7+),但消费Gini的上升幅度显著小于财富Gini(据CHFS/国家统计局住户调查)。高收入家庭储蓄率极高(部分年份超50%),低收入家庭MPC接近1。2014-2020年数字消费信贷爆发(花呗/白条/微粒贷),使大量原本受流动性约束的低收入/年轻人群获得了消费能力,进一步压缩了短期消费Gini。同时期居民不公平感知调查(如CGSS的公平感模块)显示:对"收入分配公平"的评价在信贷扩张高峰期并未随财富Gini同步恶化,部分年份甚至小幅改善。
        诚实标注:P2P爆雷(2018)和后续信贷收缩提供了一个"掩码撕裂"的自然实验机会(预测iv的检验窗口),但目前缺乏将该时段公平感知调查与信贷事件精确时序匹配的公开研究。该锚承重方向一致性,不承重(iv)的完整因果链。
      confidence: weak
    - anchor: "灵长类公平感知实验(Brosnan & de Waal 2003)——BR-L2-013的根基锚"
      evidence: |
        卷尾猴实验中,猴子在看到同伴用同样劳动换取葡萄(高价值)而自己只得到黄瓜(低价值)时,拒绝交换并表现出明显的挫折行为。关键控制条件:当同伴不在视线范围内、或自己得到的也是葡萄时,拒绝行为消失。这直接确立了"可观察的不平等"是不公平厌恶的必要触发条件——看不见的不平等不触发反应。此锚独立测出驱动量(可见性),非由结果反推。
      confidence: strong
  counterexamples:
    - case: "法国/拉丁美洲:高不公感知与财富不平等的强耦合——潜在的掩码机制反例"
      analysis: |
        法国财富Gini虽然低于美国,但民众对财富不平等的感知和不满程度远高于美国(ISSP/WVS数据)。拉美国家(如巴西/智利)财富Gini极高且不公平感知也极高——消费Gini与财富Gini的楔子似乎未有效掩码。可能消化路径:(1)法国税务记录非公开,因此不属于(1a)制度透明,而是属于(1b)高强度财富不平等政治动员(高税率+公共辩论传统+工会/左翼政党的阶级话语框架,使财富不平等即使不通过消费信号也能进入公众感知);(2)拉美的高可见消费不平等(封闭社区vs贫民窟的空间隔离)可能抵消了MPC梯度的压缩效果——极端不平等下,即使消费Gini被压缩,剩余差距仍远超触发阈值;(3)不公平感知的历史基线在这些国家本就较高。三种消化路径均为事前注册的可测条件,非事后开脱。
      status: counterexample
  boundary_cases:
    - case: "北欧国家:低财富Gini+高财富信息制度透明度((1a))——掩码机制的不运作区"
      analysis: |
        挪威/瑞典/芬兰的财富信息(个人税务记录)法律上公开可查——属于(1a)制度透明,民众不需要通过邻居的消费来推断财富不平等,可以直接查到。同时这些国家的MPC梯度因强社会福利而相对平坦(低收入者不需为医疗/教育/养老等预防性储蓄,MPC不一定接近1)。本推论预测:在这些国家,(a)和(b)应不成立或显著弱于美国式消费信号社会——因为掩码机制的必要条件(财富信息不直接可得)缺失。若这些国家中消费Gini仍是不公平感知的主驱动(超越财富Gini),则BR-L2-013的可见性触发机制需要重新审视(是否存在"制度透明下仍依赖消费信号"的其他通道)。
      status: boundary_case
    - case: "日本:高财富Gini×低消费Gini×低不公平感知——掩码+文化规范的候选"
      analysis: |
        日本的财富Gini在OECD中偏高(人口老龄化+高储蓄率老人群体持有大量金融资产),但消费Gini相对温和,且不公平感知调查得分在发达国家中处于中低水平。日本MPC梯度可能偏陡(老年人储蓄率高但消费意愿低),且消费信贷比美国克制(直到近年先享后付才兴起)。方向与本推论一致,但"低不公平感知"可能混杂了日本文化中的冲突回避/不抱怨规范,需与跨国调查的锚点校准后方可用——不可作为独立支持锚。
      status: boundary_case

discriminant_validity: |
  【独有可证伪预测】相对相邻理论逐一判别——
  (1) vs标准不平等-幸福感文献(Alesina/Di Tella/MacCulloch):标准文献用财富/收入Gini直接回归幸福感或不公平感知,不区分财富Gini与消费Gini,不纳入MPC梯度作为楔子调节器,不给品类可见度梯度预测。本推论的精确定位:两个财富Gini相同的国家,MPC梯度更陡的,不公平感知更低——这是财富Gini本身给不出的微分预测。
  (2) vs Veblen炫耀性消费理论:Veblen讲的是"富人主动多消费以展示地位"(信号发送端),本推论讲的是"富人被动少消费(高储蓄)使财富差距不可见"(信号接收端——掩码是MPC梯度的副产品,非有意为之)。两理论预测方向相反:Veblen预测"富人消费越炫耀,不平等越可见,不满越强";本推论预测"富人储蓄率越高(越不炫耀消费),不平等越不可见,不满越弱"。可联合检验:社会若同时存在高Veblen炫耀消费(高端品牌/奢侈品增长快)和高MPC梯度(顶层消费率低),两理论的净效应方向可由品类可置换性预测——炫耀品消费增长→可见信号增强(Veblen胜),但炫耀品占总消费比例极小→整体消费Gini仍被MPC梯度压缩(本推论胜)。
  (3) vs"虚假意识/意识形态霸权"类理论:此类理论声称民众"不知道"真实的不平等程度是因为精英控制媒体/教育。本推论不需这一强假设:掩码是结构的而非意识形态的——信号客观上就弱,不要求任何人"被洗脑"。
  (4) vs"政治话语作为替代感知通道"类理论:此类理论声称民众对不平等的感知主要由媒体/政治话语/社会运动的"二阶信息"驱动,而非日常消费观察。本推论将其注册为判别效度的第四对手(与上述三个判别并列)——政治话语是竞争解释而非排除标准。推论预测:在政治话语高密度国家(媒体不平等报道频率高),消费Gini→不公平感知的弹性应弱于政治话语低密度国家。此预测可与(b)(c)联合检验。
  【防平凡化守卫】非平凡内核定位在两块砖的接口处:BR-L2-029的MPC梯度决定财富→消费的压缩比,BR-L2-013决定消费→公平感知的信号通道,两者首尾相接产生"MPC梯度是可观察不平等的结构性调节器"这个归因——不在任何单块砖里。"富人比穷人储蓄更多所以消费差距比财富差距小"是会计恒等式(由MPC定义给出),是平凡的;不平凡的是"这个会计恒等式通过公平感知的信号通道,系统性影响了社会对不平等的主观体验——并且压缩程度可由事前可测的MPC梯度预测"。

