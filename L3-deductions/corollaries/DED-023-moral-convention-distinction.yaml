id: DED-023
type: deduction
layer: L3-deductions
status: verified
term: "道德-习俗迁移判据 (Moral-Convention Transition Criterion)"

人话摘要: "规范在道德与习俗之间迁移的秘密不在内容里，在两件事的变化里：有人看时罚不罚、没人看时心里过不过得去。两条轴快慢不同——执法轴能速变，内化轴只慢酿——这不对称刻出了四种状态间的迁移方向。分区本身是迁移动力学的快照，稳态社群里四格缩为两格，真正展开在规范变天时。"

statement: |
  【定位】本推论首先是一个规范迁移动力学模型，其次才是一个分类框架。
  在稳态社群中，TP 和 INT 高度共现——(+TP,+INT) 与 (−TP,−INT) 两格占绝大多数，
  四象限分类退化为两象限（道德化程度高低的两端）；四象限的完整展开发生在
  规范变迁期（社群崩解、新兴规范形成、跨文化接触）。因此推论的核心增量不在
  "如何区分道德与习俗"（静态分类），而在"规范如何在四种结构状态之间迁移"
  （动态模型），尤其是不对称迁移路径。

  【核心】一个规范的结构类型——它在 (+TP,+INT / +TP,−INT / −TP,+INT / −TP,−INT)
  四象限中处于哪一格——不取决于其内容（涉及什么领域），而取决于两个可独立测量
  的结构属性：第三方惩罚意愿（TP）和内化程度（INT）。本推论采取经验竞争立场：
  以 Turiel 社会领域理论的伤害/权利/正义判据作为道德的独立辨认标准——
  即"一个规范是否为道德规范"由 Turiel 判据（规则取消/权威允许/在别国是否仍错）
  独立判定，不依赖 TP/INT 的测量值；推论预测：被 Turiel 判据判定为道德领域的规范，
  在结构测量中平均具有更高的 TP 和 INT——而非以 TP/INT 定义道德。
  TP 是道德规范的必要条件——没有旁观者愿付代价惩罚违规的规范，不会被视为
  道德规范。INT 是附加维度——使规范从"纯粹外部执行"升级为"自我执行"。

  【驱动量】TP 和 INT 在两个正交轴上独立变化。TP 取决于旁观者在合作结构中的
  利益占比（BR-L2-018），INT 取决于发育窗口条件
  （BR-L2-019）。二者由不同的因果机制驱动，
  不存在"高 TP 必然高 INT"或"高 INT 必然高 TP"的锁定关系。

  【预测】
  (i) 四象限分类：TP×INT 交叉产生四种结构类型——完全道德(+TP,+INT)、
  外部执行(+TP,-INT)、残余内化(-TP,+INT)、社会习俗(-TP,-INT)——
  各自有独立的行为签名（私密合规率、自发执法率、Turiel 判据判断）。
  (ii) 残余内化不稳定：-TP 条件下，INT 因对等性信号断裂而逐渐瓦解
  （BR-L2-019 P2），该象限规范向 -TP/-INT 漂移。
  (iii) 迁移路径不对称：建立 INT 需满足发育窗口条件（慢），瓦解 INT 只需
  对等性信号断裂（快），因此顺时针迁移（习俗→外部执行→完全道德→残余内化→习俗
  的完整循环中左半圈）显著慢于逆时针迁移（右半圈）。
  (iv) 内容独立性：同一行为领域（饮食、着装、暴力）在不同文化/时期可落入不同
  象限——规范的结构类型不由内容锁定，由 TP 和 INT 的取值决定。

  【判别】相对于 Turiel 的社会领域理论（按内容分：道德=伤害/权利/正义，
  习俗=社会秩序），本推论主张分类判据是结构属性而非内容。独有可证伪预测：
  可在同一文化中同时找到 +TP/-INT 的"伤害规范"（仅在有监控时遵守的暴力禁令）
  和 -TP/+INT 的"习俗规范"（内心坚信不可吃某种肉但从不干涉他人）——
  按 Turiel 前者属道德（涉及伤害）后者属习俗或个人领域，
  但本推论按结构分别归入"外部执行"和"残余内化"象限。

operationalization:
  TP（第三方惩罚意愿）:
    definition: "未直接受害的旁观者愿付个人代价惩罚违规者的概率/强度。前提：旁观者与被惩罚者之间无既有互惠或亲缘绑定（排除第二方惩罚混淆）。"
    measurement: "第三方惩罚博弈（Fehr & Fischbacher 2004：被试 A 旁观 B 对 C 的不公分配，A 愿付自己收益罚 B）；田野观察中编码的第三方自发制裁行为（排斥/羞辱/放逐）计数；跨情境 vignette 问卷中的惩罚意愿评分。"
    limitations: "实验室 TP 可能被实验者监控感压低（被试知实验者在看，'多管闲事'动机弱化）。田野 TP 需与 bystander stake 独立标定（BR-L2-018），不得因'观察到惩罚'反推'旁观者利益占比高'。"
  INT（内化程度）:
    definition: "规范遵守由内部情感制裁（内疚/羞耻）而非外部惩罚驱动的程度。操作化：无外部监控时的合规行为+违规后的自发负面情绪反应。"
    measurement: "匿名/私密情境中的合规率（确信无监控+无未来交互）；违规后自发内疚/羞耻自我报告与心理生理指标（皮电/面肌电）；发展心理学中的承诺遵从（committed compliance）行为编码（Kochanska et al. 2002）。"
    limitations: "自我报告受社会赞许性偏差影响。行为测量需严格排除声誉关切——被试须确信行为不会被任何他人知晓。实验室私下合规不等于真实世界中无社会后果的私下合规。"
  行为签名（被预测量）:
    definition: "四象限各自在三个观测窗口中的预期行为模式：(a) 私下合规率，(b) 第三方自发执法率，(c) Turiel 判据分类（道德/习俗/个人领域）。"
    measurement: "三个窗口各自独立测量。Turiel 判据测量：询问'如果规则取消/权威允许/在别国'该行为是否仍错——不参考 TP/INT 数据。"
    limitations: "Turiel 判据本身预装了'内容=领域'假设。本推论需让结构判据（TP×INT）与 Turiel 判据竞争预测同一组规范——不得用 Turiel 判据验证结构判据（套套逻辑）。"
  规范抽样:
    principle: "待测规范如何从文化中被选中，必须与 TP/INT 的测量一样不受道德/习俗预标签污染。若抽样依赖研究者直觉（'这条像道德、那条像习俗'），则抽样本身已隐式使用了道德/习俗预标签，anti-talisman 防线在入口处失守。"
    method: "从该文化已记录的规范清单（民族志规范目录/法律文本的行为禁止列表/社群公约的成文规则等）中按内容领域分层抽样，确保覆盖伤害、互惠、饮食、着装、礼仪、宗教仪式、财产、性行为等多元领域。抽样时不参考研究者对规范的道德/习俗直觉分类——不因'这条看起来很道德'而选入或排除。最低要求：抽样框架在测量开始前公开注册，指明抽样的来源清单和分层方案，禁止测量开始后按结果调整抽样。"
    limitations: "盲抽无法保证各象限被均匀填充——若抽样恰好未覆盖某象限（如 (−TP,+INT) 格），该空格可能反映抽样偏差而非理论失败。补救：抽样后若某格为空，应定向补充抽样（按 same 分层规则但扩大清单范围），补充抽样需注明为 post-hoc 并在报告中与首次抽样结果分行呈现。"

derivation:
  from_l1:
    axioms: [AXIOM-001, AXIOM-003]
    theorems: [THEOREM-moral-third-party-enforcement, THEOREM-moral-internalization]
  from_l2:
    bridging: [BR-L2-014, BR-L2-018, BR-L2-019]
  steps: |
    1. "TP 和 INT 各自有独立因果来源"
       BR-L2-014 确立第三方惩罚是规范在没有中心权威时的执行机制——TP 跨文化存在。
       BR-L2-018 确立 TP 强度随旁观者在合作结构中利益占比系统变化——
       TP 不是恒定开关，是可独立操纵的连续量。
       BR-L2-019 确立 INT 依赖发育条件（安全依恋+对等性信号+
       青春期重组）——INT 有独立于 TP 的因果来源，不由 TP 锁定。

    2. "TP 和 INT 的测量轴正交"
       步骤 1 给出 TP 和 INT 各自独立的因果机制。TP 由利益占比驱动（可独立操纵：
       改变 bystander 与受害方的社会距离或利益关联），INT 由发育历史驱动
       （可独立测量：私密合规行为）。正交性可操作：存在高 TP 低 INT 的实验室证据
       （Fehr & Gächter 2002——被试在公共品博弈中有惩罚时合作率高，一旦惩罚条件
       移除合作率迅速下降，说明高合作是 TP 驱动而非 INT 驱动）和低 TP 高 INT 的
       初步田野证据（某些文化中个体内心坚信不可食用某种动物，但从不干涉他人食用，
       即纯个人道德信念——INT 存在但 TP 近零）。

    3. "正交轴交叉产生四象限分类"
       TP(+/-) × INT(+/-) → 四个逻辑可能的规范结构类型，每格对应不同的行为签名
       （见 operationalization.行为签名）。交叉轴使分类从"道德 vs 习俗"的二分
       升级为四个有独立行为预测的类别。

    4. "迁移路径不对称"
       【归属声明】BR-L2-019 P1+P2+P3 确立了 INT 慢建快溃的机制——这是迁移
       不对称的底层引擎，来自 L2 桥接砖而非本推论独创。本推论的增量在于：
       (a) 将 INT 慢建快溃（BR-L2-019）与 TP 可快速变化（BR-L2-018：改变
       利益占比→TP 可较快调整）合成，导出顺时针（需经慢建 INT）慢于逆时针
       （仅需快溃 INT + TP 消退）；(b) 将此不对称映射为四象限间的具体路径图。
       以下为路径展开：

       INT 建立慢（需经发育窗口——安全依恋+对等性信号+青春期重组，跨数年，
       BR-L2-019 P1+P3），INT 瓦解快
       （对等性信号断裂→合理化→比较→认知重组→情绪脱钩，短至数轮互动，
       BR-L2-019 P2）。因此：
       顺时针迁移（-TP/-INT→+TP/-INT→+TP/+INT→-TP/+INT→-TP/-INT 的左半：
       习俗→外部执行→完全道德）——需要建立 TP（可通过改变利益占比，较快）
       然后建立 INT（需经发育窗口，慢），合取最慢；
       逆时针迁移（+TP/+INT→+TP/-INT→-TP/-INT）——INT 瓦解仅需对等性信号
       断裂（快），然后 TP 消退（利益占比改变，较快），合取快于顺时针。

    5. "非平凡性——逐格判空"
       2×2 判据表（TP +/- × INT +/-），四格：
       (+TP,+INT) 格——被 BR-L2-014 + BR-L2-019 联合
       预测（有 TP 且有 INT），平凡。
       (+TP,-INT) 格——被 BR-L2-014 单独预测（TP 存在且不必然伴随 INT），平凡。
       (-TP,-INT) 格——两轴皆无的基线，平凡。
       (-TP,+INT) 格——【非平凡】：没有任何一块砖单独预测"没有第三方惩罚但内化
       仍存的规范可以稳定存在"。
       本推论预测此格非空但暂态——存在残余内化规范（如纯个人道德信念），
       但不稳定（向 -TP/-INT 漂移）。此为可被现实反例填上的真经验主张：
       若田野研究发现 -TP/+INT 规范在无 TP 维护的条件下稳定存续超过一个代际，
       "不稳定"预测被推翻；若发现该格始终为空，则"存在性"主张被推翻但
       分类框架可通过"该格逻辑可能但事实上几乎不存在"存活。
       迁移不对称性是额外的非平凡内核——此预测不来自任何单块砖，
       来自"INT 建立需发育窗口（慢）× 瓦解只需对等性信号断裂（快）"的合取推理。

falsifiability: |
  本推论在以下条件之一满足时被证伪：
  (a) 在一组文化样本中独立测量多种规范的 TP 和 INT（用独立于结果的测量工具），
  发现 TP 和 INT 在统计上近似共线（r > .90, p < .01）——两轴退化为单轴，
  四象限中的 (+TP,-INT) 和 (-TP,+INT) 在测量层面为空；
  (b) 或发现 -TP/+INT 规范在无第三方惩罚维护的条件下稳定存续超过一个代际——
  推翻"残余内化不稳定"预测；
  (c) 或发现迁移速度在任何方向均无系统性差异（顺时针 vs 逆时针的时间中位数
  差异不显著，p > .05）——推翻路径不对称预测。
  适用区间：群体规模 ≥ 3 且成员间存在反复交互的社会语境。纯匿名单次交互
  （实验室一次性博弈）中 TP 和 INT 的区分因缺乏生态效度可能无法有效测量。
  有中心惩罚权威的制度化语境（国家法律系统）不在本推论直接射程内——
  制度化惩罚混淆 TP 的测量（第三方 vs 代理人惩罚）。

falsification_trace:
  primary_suspect: "TP 与 INT 的正交性——若二者实际高度相关（r > .90），
  四象限退化为两象限，推论核心骨架坍塌。最危险的反例：在一个功能良好的
  道德社群中，所有成员既内化规范也愿执行第三方惩罚——此时 TP 和 INT 在群体层面
  高度共现，正交性仅在'过渡态'或'失败社群'中可见。"
  secondary_suspect: "迁移路径不对称——若 INT 建立和瓦解的速度实测无差异，
  则顺时针慢于逆时针的预测被推翻。但分类框架可独立存活。"
  tertiary_suspect: "定位偏差导致的平凡化风险——若稳态社群中 (+TP,+INT) 与
  (−TP,−INT) 两格占绝大多数，四象限退化为两象限，则推论作为'分类框架'的增量
  坍缩为'规范有道德化程度一个连续维度的两端'的常识。推论的真实价值从分类转向
  迁移动力学——此定位偏差可能使推论在传播中被误用为静态分类工具，用户在稳态
  数据上使用本推论可能只看到两格并得出'这就跟常识一样'的误解。与 primary_suspect
  （正交性）同根——都源于 TP/INT 在稳态中的高共现——但后果不同：
  primary_suspect 关乎理论真假（若 r>.90 则四象限作为经验分类不成立），
  本 suspect 关乎理论定位准确性（即使 r 未达 .90 但稳态中中间两格占比低，
  推论作为'分类工具'的实用性低于作为'迁移动力学模型'的实用性）。
  防平凡化守卫已在 discriminant_validity 段部分在位，但此风险未列入
  falsification_trace 的 suspect 清单——若定位偏差不纠正，用户可能以稳态数据
  测试并误判推论为'平凡'。"
  unlikely_suspect: "-TP/+INT 象限的存在性——即使该格始终为空，
  推论可通过'该格逻辑可能但被不稳定压力清空'来挽救核心（分类框架仍有效，
  只是某格在稳态下为空）。冲击最大的是'非空+暂态'的联合主张。"

excluded_outcomes:
  - "个体层面的道德判断差异：本推论预测的是规范在群体层面的结构类型，
  不预测同一规范下个体间 TP/INT 的方差分布。"
  - "规范内容的起源：本推论不解释为什么某个文化把特定行为（如吃牛肉）道德化——
  只解释道德化后的结构特征和象限间迁移规律。"
  - "正式法律系统中的规范执行：制度化惩罚（警察/法院）混淆 TP 测量——
  执行者是代理人而非'第三方'（代理人有职业激励，非自发代价），
  本推论先覆盖非中心权威下的规范。"

anti_talisman_clause: |
  TP 和 INT 各自必须独立于结果测量，不得由"该规范已被归为道德"反推
  "该规范必有 TP+INT"。具体而言：
  (i) TP 的测量依据：行为经济学博弈中的实际惩罚金额、田野观察中编码的
  第三方制裁行为计数——均不需事先知道该规范在当地的道德/习俗分类标签。
  (ii) INT 的测量依据：匿名/私密条件下的合规行为、违规后的心理生理指标——
  均不依赖 Turiel 判据或任何道德/习俗分类标签。
  (iii) 至少一个承重锚独立测出了驱动量：BR-L2-014 的 Fehr & Fischbacher (2004)
  第三方惩罚博弈在实验室内独立操作了 TP——被试付真金白银，与被试如何定义
  "道德"无关。BR-L2-019 的 Kochanska et al. (2002)
  承诺遵从编码独立于道德/习俗分类——编码者仅看儿童是否在被监控/不被监控时
  均遵守规则，不参考"该规则在当地是道德还是习俗"的外部标签。

nontriviality_test: |
  逐格判空结论（2×2 TP×INT）：
  (+TP,+INT) 格——BR-L2-014 + BR-L2-019 联合预测，平凡。
  (+TP,-INT) 格——BR-L2-014 单独预测（TP 不必然伴随 INT），平凡。
  (-TP,-INT) 格——两轴皆无的基线，平凡。
  (-TP,+INT) 格——【非平凡】无砖预测"无 TP 但 INT 仍存"的规范。
  本推论预测：此格非空但暂态（存在但向 -TP/-INT 漂移）。
  此为可被现实反例填上的真经验主张。若田野研究发现 -TP/+INT 规范稳定存续
  超过一个代际→"不稳定"推翻；若发现该格始终为空→"存在性"推翻但分类框架
  可通过"该格逻辑可能但几乎不存在"存活——此时非平凡性须从迁移不对称中提取。
  迁移不对称性加固非平凡性——顺时针慢于逆时针的预测不来自任何单块砖，
  来自"INT 建立需发育窗口（慢）× 瓦解只需对等性信号断裂（快）"的合取推理。
  与砖的关系诚实：(+TP,+INT) 和 (+TP,-INT) 两格是砖的自然延伸而非增量发现；
  增量在 (-TP,+INT) 格的预测和迁移不对称性。两砖（BR-L2-014 和
  BR-L2-019）各自独立讲 TP 和 INT，
  但谁都没讲"二者正交→分类四象限→迁移不对称"——组合才产出新预测。

real_world_anchors:
  supporting:
    - "Fehr & Gächter (2002) 公共品博弈——有惩罚条件时被试合作率极高（+TP），
    一旦惩罚条件移除合作率迅速下降——高合作是 TP 驱动而非 INT 驱动，
    即 (+TP,-INT) 格的行为签名：有执法但无内化。
    confidence: strong（多实验室复现）。"
    - "饮食禁忌的跨文化分化——犹太教/伊斯兰教猪肉禁忌：既内化（信徒私下不食）
    又执法（社群排斥违者），(+TP,+INT) 格。某些印度教个人素食信仰：内心坚信
    不食肉但不强制他人，(-TP,+INT) 格。同一内容领域（饮食）可落不同象限——
    这是 Turiel 内容分类无法解释的。confidence: anecdotal——本锚为印象式举证，
    未经系统 TP/INT 独立编码，仅作 illustrative example，不承担 evidence burden。
    (−TP,+INT) 格非空与内容独立性两项主张需独立实证检验，不挂靠此锚。"
  counterexamples:
    - "候选反例：礼貌规范（问候方式、餐桌礼仪）——违反时通常既无第三方惩罚
    （别人最多觉得不礼貌但极少付出代价去'惩罚'），违规者自身也几乎无内疚感。
    但这是 (-TP,-INT) 基线格，不构成挑战。真正的反例需满足：一种规范在内容上
    涉及伤害/权利/正义（按 Turiel 应为道德），但 TP 和 INT 均为低——即本地人
    坚持其为'道德问题'而结构测量却是 (-TP,-INT)。迄今无此类系统反例报告。"
  boundary_cases:
    - "微型社群（3-10 人全互识）：TP 与 bystander stake 几乎完全重叠——
    旁观者即直接利益相关者，TP 与第二方惩罚边界模糊。此时 TP 测量需额外控制
    旁观者与受害方的关系距离——若近于'熟人/亲缘'阈值则算第二方惩罚而非 TP，
    该规范不纳入本推论的四象限分类。"
    - "青少年发育窗口期过渡规范：青春期正处于 INT 重组窗口
    （BR-L2-019 P3）的个体，其 INT 值在时间维度上
    不稳定——同一规范在不同时间点测量可能落入不同象限。本推论的群体层面分类
    需控制年龄结构：应取成年人（≥25 岁，PFC 髓鞘化基本完成）的 INT 稳态值。"

discriminant_validity: |
  独有可证伪预测：同一行为领域（如伤害）可以同时存在高 TP 低 INT 和
  高 TP 高 INT 的规范——前者仅在被监控时遵守，后者无条件遵守。
  Turiel 社会领域理论将"伤害"整体归入道德领域，无法解释这种分化。
  Haidt 道德基础理论按先天模块分类（关爱/公平/忠诚/权威/神圣/自由），
  同一模块内的规范也可因 TP/INT 不同而呈现不同结构类型——
  如"忠诚"在紧密军事单位中 (+TP,+INT)，在松散社交圈中 (-TP,-INT)，
  结构判据跨越了模块边界。

  防平凡化守卫：不要把推论的核心误解为"道德规范有 TP 和 INT，
  习俗规范没有"——这是砖的复述（BR-L2-014 讲 TP，BR-L2-019
  讲 INT）。核心是：(1) TP 和 INT 是正交轴——高 TP 不保证高 INT，反之亦然；
  (2) 四象限各自有独立的行为签名，不是"道德 vs 习俗"的二分再贴标签；
  (3) 迁移不对称——顺时针慢于逆时针——是四条可独立检验的路径预测，
  不来自任何单块砖；(4) 内容独立性——结构判据与内容领域的交叉预测
  是 Turiel/Haidt/Shweder 等所有内容分类理论的竞争假说。

