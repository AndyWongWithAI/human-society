id: DED-015
type: deduction
layer: L3-deductions
status: verified
term: "对等报复演化稳态 (Proportional Retribution Equilibrium)"

人话摘要: "'以眼还眼'不是圣人发明,是博弈逼的——罚太重两家一起死,罚太轻被当软柿子;只有跟罪等量的惩罚能把信号发稳、把架停住。各文明不约而同搞出这个原则不是偶合,是只有这一个解。"

statement: |
  【核心】在重复交互且无中心惩罚权威的条件下,'以眼还眼'(惩罚与伤害成比例)不是法律发明——是唯一演化稳定的惩罚规范。三个策略的博弈:(a)过度惩罚(比伤害更重)→引发报复升级螺旋→双方耗死;(b)不足惩罚(比伤害更轻)→被当软柿子→剥削加剧;(c)成比例惩罚(跟伤害匹配)→发出'别碰我,我也不碰你'的可信信号,收敛到稳态。比例惩罚是博弈论吸引子,不是哪个文化想出来的事。

  【驱动量】惩罚比例偏差 = 惩罚大小 / 伤害大小。>1=过度,<1=不足,≈1=成比例。驱动量须独立于'是否升级/塌陷'的结果测量——不得因'结果升级了'反推'必是过度惩罚'。

  【预测】
  (i) 在无中心惩罚权威的小规模重复交互博弈中,惩罚比例偏差越大的玩家长期收益越低(过度者卷入升级链,不足者被反复剥削)→成比例惩罚者具备长期收益优势。
  (ii) 跨文化历史中,'以眼还眼'原则出现在互不相关的法律传统(美索不达米亚/希伯来/罗马/伊斯兰/中国传统)——不是偶然传播而是博弈吸引子独立涌现。
  (iii) 逐格判空:'无中心权威+重复交互+过度或不足惩罚成为群体主导并维持超代稳定'这一格预测为空。

  【判别】
  与Axelrod'以牙还牙是互惠策略'判别:Axelrod讲双边合作(以德报德),本条讲惩罚规范(以怨报怨且报的量得配)——不同域、不同机制。
  与BR-L2-016判别:BR-L2-016是桥接(叙述'人这样做'),本条是推论(解释'为什么选中这个而非别的+给出这一选择可推翻的边界条件')。

operationalization:
  punishment_deviation_ratio:
    definition: "惩罚大小 / 伤害大小的比值。>1=过度惩罚,<1=不足惩罚,≈1=成比例惩罚。"
    measurement: "由独立编码者对伤害事件与惩罚回应分别评定严重度量表,计算比值。不依赖博弈结果(是否升级/塌陷/剥削加剧)。小规模社会(民族志)可用赔偿金额/血仇死亡数比值;实验室博弈可用罚金/剥削金额比值。'惩罚'操作化范围:计入直接惩罚(暴力报复、罚物、放逐)和非直接社会制裁(gossip/ridicule/ostracism/avoidance)——后者在紧密小群体中是非常真实的惩罚(声誉毁坏→合作机会丧失→生存风险)。编码 protocol 示例:伤害严重度=物理指标组合[致死/永久伤残/暂时伤残/无物理伤害]×资源损失;惩罚严重度=施加成本[死亡/放逐/罚物/公开羞辱/社会排斥/无反应],两套量表不共享条目,确保独立测量。ratio=0(零惩罚:对该类伤害完全不触发任何惩罚反应)与 0<ratio<1(不足惩罚:触发但力度不够)在本框架中均归入'不足惩罚'档(ratio<1),二者共享同一淘汰机制(BR-L2-014 第三方惩罚不足惩罚者),但零惩罚的淘汰压力可能更弱(违规未获任何信号→社区可能未察觉或容忍→第三方惩罚触发器不启动)。若零惩罚针对特定伤害类型在无国家社会中跨代稳定,应被计入不足惩罚的反例候选、按 anti-talisman 独立测 ratio 判定——不能因'社会稳定'反推'零惩罚必够用'。"
    limitations: "伤害与惩罚的'严重度'量化有文化间差异——同一伤害在不同文化中严重度评级不同,须用文化内基准校准。连续量分档的容差带暂定 provisional ±0.3(ratio∈[0.7,1.3]为'成比例'),理论动机:跨文化公平感知实验中人们容忍约±30%的不公平而不触发惩罚反应(Henrich et al. 2005 最后通牒跨文化数据中,~70%/30%报价的接受率在多数社会中>50%),可作为操作化起点;此参数待经验标定,且预注册后不得事后调参消化边界反例(DED-004防)。若有人声称某一 ratio=1.4 的惩罚确实'该文化内感知为比例',需提供文化内独立测量证据(非由'结果收敛'反推)。"

  steady_state_outcome:
    definition: "博弈长期结果——(a)升级螺旋使双方净收益下降;(b)剥削加剧使不足惩罚者净收益下降;(c)成比例惩罚收敛到稳定交互模式。"
    measurement: "代理指标:长期净收益排名(过度者/不足者/比例者三组的跨轮累积收益);规范稳定性(惩罚规范是否被后代/新成员继承,而非仅存于当期博弈)。收益测量独立于惩罚比例偏差(不同尺度)。"
    limitations: "需足够长博弈轮次;自然观察中外部因素(生态冲击、人口变动)可能混淆。"

derivation:
  from_l1:
    axioms: [AXIOM-001, AXIOM-003]
    theorems: [THEOREM-conflict-cost, THEOREM-competition-norm]
  from_l2:
    bridging: [BR-L2-016, BR-L2-014, BR-L2-005]
  steps: |
    1. "重复交互 + 无中心权威 → 惩罚规范须自我执行"
       AXIOM-003 断言重复交互必然涌现共享行为期望。在无中心惩罚权威的条件下
       (CONCEPT-norm(d):规范可无专门执行者),惩罚规范若不能自我执行(self-enforcing),
       则无法维持——没有'上头'来罚不守规矩的人。三种惩罚策略的稳定性必须从博弈内生的
       激励结构来判断,不能靠外部强制。

    2. "三种惩罚策略的博弈稳定性逐格判"
       (a) 过度惩罚(ratio>1):惩罚比伤害重 → 被罚方感知到不成比例的新伤害 →
       互惠利他的负向镜像启动(BR-L2-005:'以怨报怨'与'以德报德'同构——正向我帮你→
       你还我,负向你伤我→我还你等量伤害) → 还手升级 → THEOREM-conflict-cost:
       升级消耗双方资源 → 双方净收益下降 → 过度惩罚策略在长期博弈中自毁。
       (b) 不足惩罚(ratio<1):惩罚比伤害轻 → 伤害方净收益为正(伤害所得>惩罚所失)
       → 剥削策略被正向强化 → 伤害方重复伤害 → 被剥削方收益持续流失 → 且第三方
       惩罚机制(BR-L2-014)使旁观者也愿付代价罚'惩罚不力的受害者'(因其助长违规)
       → 不足惩罚策略在长期博弈中也自毁。
       (c) 成比例惩罚(ratio≈1):惩罚与伤害匹配 → 发出'你敢碰我,代价正好是你给我的
       伤害'的可信信号 → 双方预期对齐 → 冲突不升级也不纵容 → 收敛到稳态。

    3. "比例性是硬约束而非事后描述——两条独立淘汰机制的交集"
       THEOREM-conflict-cost 单独只说明'过度打消耗大',不说明'必须比例'——它不能排除
       '永远不惩罚'(ratio→0)或'一次打服再不敢还手'(若力量悬殊,ratio→∞)。不足惩罚的
       淘汰靠的是另一条独立机制:BR-L2-014(第三方惩罚不足惩罚者)+ 剥削者正反馈。
       比例性之所以是唯一解,正因为它同时避开两条互不相干的淘汰通道——过度被双边冲突
       成本淘汰,不足被剥削+第三方惩罚淘汰。这不是THEOREM-conflict-cost的平凡反说。

    4. "非平凡性——逐格判空"
       2×3 判据表:自变量(惩罚比例偏差:{过度,不足,比例}) × 被预测量(长期稳态:
       {可维持超代稳定,不可维持})。
       空格①'过度→可维持超代稳定'——升级螺旋自毁。
       空格②'不足→可维持超代稳定'——剥削+第三方惩罚自毁。
       空格③'比例→不可维持'——博弈论吸引子,偏离者被拉回。
       唯一非空格='比例→可维持超代稳定'。
       关键:空格①②可被现实反例填上(若找到一个小规模社会长期以过度或不足惩罚为
       跨代规范且不瓦解,则推论证伪),故非定义性真理。

falsifiability: |
  本推论可被以下发现证伪:
  (a) 发现在无中心惩罚权威的群体中,过度惩罚(ratio显著>1)是跨代稳定的群体规范——
  即该群体长期维持'轻微冒犯也死刑/断肢'的惩罚习俗且不引发升级螺旋或群体瓦解。
  (b) 发现在无中心惩罚权威的群体中,不足惩罚(ratio显著<1)是跨代稳定的群体规范——
  即该群体长期维持'伤害几乎不受罚'且不因剥削积累或第三方惩罚而瓦解。
  (c) 发现在无中心惩罚权威的群体中,成比例惩罚者并不具备长期收益优势——
  过度者或不足者系统性优于比例者。
  适用区间:有中心惩罚权威(国家法律)或一次性交互不在射程内。

falsification_trace:
  primary_suspect: "不足惩罚的淘汰通道——这条腿最弱。BR-L2-014(第三方惩罚不足惩罚者)的实验证据主要来自一次性实验室博弈,其在真实小规模社会中能否稳定地、跨代地淘汰不足惩罚规范,直接证据较薄。若不足惩罚在实践中可持续(因为第三方惩罚本身的二阶公共品问题——谁都指望别人去罚),则'比例性是唯一解'的核心主张削弱。"
  secondary_suspect: "过度惩罚的淘汰通道——THEOREM-conflict-cost 授权'升级消耗大',但'一次打服'的可能性(力量悬殊→过度惩罚者压倒性胜利→对方不敢还手→实际收敛)对'过度必自毁'构成挑战。本推论依赖'无中心权威→无压倒性力量不对称'的前件来约束此路径。"
  unlikely_suspect: "BR-L2-016(报应比例性存在)——极少是问题根源;反例更可能削弱'演化解释'而非'现象存在'。"
  note: "primary_suspect 的'不足惩罚淘汰'压在最薄的经验腿上——BR-L2-014 从实验室推广到田野的桥接未完全落地。本轮修订补入 Boehm(1999)反向支配层级民族志锚(多社会覆盖、跨代证据),展示不足惩罚在无国家社会中的淘汰压力以田野证据+实验证据双源支撑,但田野侧的量化精确度仍低于实验室。若不足惩罚在自然条件下可持续,'唯一解'降格为'主要解',推论需 revised。"

excluded_outcomes:
  - outcome: "有中心惩罚权威(国家法律体系)下的惩罚规范"
    description: "本推论射程限定在无中心权威的重复交互。有国家法律的社会中,惩罚规范可由专门化执行机构维持,比例性可通过立法/司法而非博弈涌现——那是不同机制,不在本推论预测范围内。"
  - outcome: "一次性交互(无重复)下的惩罚行为"
    description: "本推论要求重复交互(AXIOM-003)。一次性陌生人遭遇中的惩罚选择不受'未来之影'约束,不在射程内。"
  - outcome: "力量极端不对称下的'一次打服'"
    description: "若一方对另一方具备压倒性武力优势(可忽略报复成本),则过度惩罚可能成为'有效'策略而非自毁。这不入射程——本推论前件要求'无中心权威'但未要求'势均力敌',此为诚实边界。此类案例见 boundary_cases。"

anti_talisman_clause: |
  判定'惩罚比例偏差'时必须独立于博弈结果测量——不得因'结果升级了'倒推'惩罚必是过度的',也不得因'结果收敛了'倒推'惩罚必是比例的'。需由独立编码者对伤害与惩罚分别评定量表、计算比值,判定先于且独立于结果。判定'第三方惩罚不足惩罚者'是否发生,须独立于'群体是否瓦解'观测——不得因'群体没瓦解'就宣称'第三者肯定罚了'。

nontriviality_test: |
  逐格判空结论:2×3 表(惩罚比例偏差 × 稳态可维持性)中,三个格子预测为空——过度或不足惩罚在无中心权威+重复交互下无法跨代稳定维持。这三个空格可被现实反例填上(若找到一个小规模社会长期以过度或不足惩罚为跨代规范且不瓦解,则推论证伪),故非定义性真理。核心非平凡主张:'比例性是两条独立淘汰机制(双边冲突成本+第三方惩罚不足者)的交集——任一砖单独都给不出'。THEOREM-conflict-cost 单独只排除过度,不排除不足;BR-L2-014 单独只排除不足,不排除过度。交集才产出一格活路,这是砖的组合非平凡贡献而非任何单砖的复述。

real_world_anchors:
  supporting:
    - anchor: "lex talionis 在互不相关法律传统中独立涌现"
      evidence: "'以眼还眼'原则在不同文明的法律传统中分别出现——美索不达米亚(汉谟拉比法典)、希伯来(出埃及记)、罗马(十二铜表法)、伊斯兰教法(qisas)、中国传统(杀人者死伤人者刑)。近东/地中海集群内(美索不达米亚→希伯来→罗马→伊斯兰)可能存在文化传播通道(巴比伦→希伯来、希腊→罗马、犹太-基督→伊斯兰),学术争议存在;但中国侧相对独立于近东集群,且'多个文明共同选择保留这一原则'本身(无论独立发明还是选择性保留)就指示其博弈吸引力——文化传播可以传播条文,但不能保证条文被代代保留,除非它契合恒定的博弈压力。BR-L2-016 已坐实其跨文化存在,本推论的增量是解释其'为何是这个而非别的'。"
      confidence: strong

    - anchor: "无国家社会血仇/赔偿制度的比例性"
      evidence: "努尔人血仇赔偿按伤害类型分级(杀人赔X头牛,伤人赔Y头);巴布亚新几内亚高地社会的赔偿制度同样比例性分级。这些是无中心惩罚权威的重复交互社会——比例性不依赖国家法律,由博弈涌现。"
      confidence: moderate

    - anchor: "无国家社会中第三方惩罚淘汰'惩罚不足者'的田野证据"
      evidence: "Boehm(1999)'Hierarchy in the Forest'记录多个平等主义狩猎采集社会(昆桑人、姆布蒂人等)中的'反向支配层级(reverse dominance hierarchy)':成员集体羞辱、放逐、甚至处决企图支配或反复容忍违规(即不惩罚/惩罚不足)的个体。Wiessner(2005)昆桑人羞辱仪式中,target 不仅包括违规者,还包括'老被欺负却不吭声'的个体——即不足惩罚的受害者也受社会制裁。这些田野证据指示:不足惩罚在无国家社会中面临真实的、跨代的第三方淘汰压力,非仅实验室现象。"
      confidence: moderate
      note: "此锚为补 primary_suspect 所指'不足惩罚淘汰通道的直接田野证据薄'而加。Boehm 数据覆盖面广(多社会)、但其对'淘汰力'的量化是间接的(存活案例偏倚——被淘汰的群体不留民族志记录)。标注 confidence: moderate,诚以此腿'经验证据以实验为主、田野间接'的现状,待田野检验。"
    - candidate: "荣誉文化(honor culture)中的过度报复——微小冒犯引发远超比例的暴力回应"
      analysis: "表面像过度惩罚的稳定态。但关键:(a)荣誉文化常在有国家法律的背景下存在(射程边界),(b)荣誉暴力本身代价极高(谋杀率、世仇消耗),(c)荣誉规范是否'跨代稳定'存疑——其在国家法律渗透后系统性衰退,暗示非稳态。不构成干净反例,但提示'一次打服'路径在特定条件下可短期维持——纳入 boundary_cases。"
      status: counterexample_candidate

  boundary_cases:
    - case: "力量极端不对称——殖民征服中的惩罚"
      analysis: "殖民者对原住民的惩罚常远超比例(屠杀整村报复一人)。若殖民者无惧报复(武力碾压),过度惩罚可'有效'——不以升级螺旋自我毁灭。此案前件'无中心权威+可忽略报复成本'突破了本推论隐含的势均假设,属射程边界。诚实暴露:本推论对'压倒性不对称'的预测力弱,比例性在那里的博弈约束松绑。"
      status: boundary_case
    - case: "混合策略——对不同伤害类型采用不同惩罚比例"
      analysis: "某社会对杀人采取比例血仇(ratio≈1),对偷窃采取零惩罚(ratio=0),对通奸采取过度惩罚(ratio>1)——同时分布在三格中。此非第 4 类正交策略(DED-008 式新 species),而是复合策略组合——每条伤害类型有各自的惩罚规范坡度(fines gradient)。处理方式:按伤害类型分别评估比例偏差,不要求跨类型的统一 ratio。若某一伤害类型(如偷窃)的 ratio=0 在无国家社会中跨代稳定,则对该类型而言'不足惩罚不可维持'预测被挑战——应按 falsifiability(b)逐类型检验,非整体推翻。"
      status: boundary_case

discriminant_validity: |
  【独有可证伪预测】本推论独有的可证伪主张是:在无中心权威+重复交互条件下,过度/不足惩罚无法作为跨代稳定规范持续——不是因为'冲突消耗大'(那是THEOREM-conflict-cost的同义反复),而是因为比例性是两条独立淘汰机制的【交集】,任何偏离都会被其中一条机制终止。其他理论不做出这一断言:(a)Axelrod的tit-for-tat在合作域,不讲惩罚比例性;(b)BR-L2-016只记录比例直觉存在,不讲演化选择机制;(c)威慑理论(deterrence theory)主张惩罚越重越有效,与本推论的'过度自毁'预测直接矛盾——故本推论有独立的、可与威慑理论对决的证伪轴。

  【防平凡化守卫】'比例惩罚→稳态'是否只是THEOREM-conflict-cost的平凡反说(冲突大→收敛了→必然比例)?不是——因为'冲突成本大'只能推出'不要升级',推不出'必须比例'。它排除不了'永远不罚(ratio→0)'或'若力量优势则一次打服(ratio→∞)'。本推论的机制是两条独立淘汰通道的交集——过度被双边成本淘汰,不足被剥削+第三方惩罚淘汰——交集才产出比例。守卫:若有人声称'过度惩罚也可稳态(因一次打服)',则此反例不杀伤THEOREM-conflict-cost,但杀伤本推论;对称地,若有人声称'不足惩罚也可稳态(因没人愿做第三方惩罚)',亦不杀伤THEOREM-conflict-cost,但杀伤本推论。本推论比THEOREM-conflict-cost更可证伪(更多暴露面),故非其平凡反说。

  【防"黄金中道"平凡化】本推论'过度→坏、不足→坏、适度→好'的结构与亚里士多德'中道'(golden mean)哲学表面相似。但两者不在同一层:中道是模糊启发式(vague heuristic)——不指定机制、不给可证伪预测、不解释为何这个区间而非另一个中间区间,可消化任何结果('任何稳定状态必是适度的,因为适度的定义是稳定的');本推论是特定机制(specific mechanism)——指定两条独立淘汰通道(冲突成本+第三方惩罚)、每条可被独立攻击、给出可证伪预测与明确定义的边界条件。specific mechanism 是一个严格、暴露面大的命题,可以被独立推翻;heuristic 是永远正确的模糊说法。DED-015 的可证伪性正来自其 specificity 而非'凡事适度'的泛泛而谈——若找到过度或不足惩罚的跨代稳定社会,中道 heuristic 可事后重划'适度'边界来消化反例('那说明那个社会的适度就是那个样子'),本推论不能——因为其边界由独立测量的 ratio 定义,非由结果反推。

