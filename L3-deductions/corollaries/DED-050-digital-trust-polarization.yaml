id: DED-050
type: deduction
layer: L3-deductions
status: verified
term: "数字可处理性x制度信任不对称：失信信号永久化与修复信号噪声化 (Digital Processability x Institutional Trust Asymmetry: Permanent Discredit Signals and Noised Repair Signals)"

人话摘要: "对制度的信任有个扎心规律——掉得快、涨得慢。数字时代让这规律变得更扎心：出过事的机构，坏事在搜索引擎里永远挂在首页（每次有新人搜这家机构，第一眼看到的就是当年那件事），但机构事后做的整改、发的道歉、通过的审计——这些'我在改'的信号在信息的汪洋大海里根本冒不出头，搜都搜不到。结果就是：信任跌下去被钉死了，想涨回来却被信息噪声闷住了——整体的信任水平被数字生态往下拽了一层。但这不是必然的——如果搜索引擎和信息平台不是只按'什么最吸引眼球'来排，而是给可验证的修正信息留一条独立通道，这个死结就能解开。"

statement: |
  【核心】数字可处理性(BR-L2-025——信息可由机器永久保存、即时检索、自动聚合)以不对称的方式极化制度信任的不对称衰减(BR-L2-031——掉得快、涨得慢)，将信任均衡系统性向下推移。不对称来自两个并发机制：(i)失信信号永久化——负面事件在数字生态中被永久存档且搜索引擎算法(以engagement/新鲜度/情绪冲击为排序信号)赋予高检索权重→每次新用户搜索机构名称首先触达历史负面事件→"跌"被结构性钉死；(ii)修复信号噪声化——整改报告/正面报道/第三方审计等修复信号虽同样存在于数字生态中，但因缺乏情绪载荷(冷静、技术性、非冲突性)而在engagement驱动的排序算法中获得系统性更低的检索权重与关注度→"涨"被结构性拖慢。两机制合力使信任修复周期长于可比的前数字时代危机，且净效应向下——因为修复信号的传播劣势比失信信号的持久化优势更难以通过机构单方努力逆转。

  【驱动量】两个独立可测的前件驱动信任修复的结果差异：(1)数字负面信号支配度(DNS)——搜索引擎对"[机构名称]"的中性查询返回结果中，负面/争议性内容占首页结果的比例(独立于机构的实际修复行为测量)；(2)修复信号算法可见度(RV)——机构发布的修复信号(整改声明/审计报告/正面进展)在搜索引擎中能否获得独立于engagement指标的检索权重(如通过结构化数据标记/权威站点优先索引/独立可验证性信号)。DNS捕捉BR-L2-025的失信端极化效应(永久保存+高检索权重)，RV捕捉该极化效应是否被缓解(修复信号获得了替代传播通道)。

  【预测】(i)搜索引擎结果中负面新闻占比(DNS)高的机构，在匹配严重程度的信任危机后，信任修复周期(从危机爆发到信任指标回到危机前80%水平的时长)显著长于DNS低的机构——DNS每增加10个百分点，修复周期延长X%(X>0，精确值待经验标定)；(ii)该效应在控制危机严重程度(涉事人数/经济损失/媒体报道量级)、机构规模、行业类型后仍显著——DNS不是危机严重程度的代理变量，而是独立于危机本身的数字信息生态结构性特征；(iii)修复信号算法可见度(RV)对此效应有负向调节：当机构拥有高RV(如权威站点优先索引/结构化数据标记使整改信息在搜索中获得独立展示位)，DNS对修复周期的延长效应被削弱——即修复信号获得了绕开engagement排序竞争的替代传播通道。

  【判别·与DED-042的对撞】DED-042预测算法监控的透明度设计(可验证性机制)能拉陡信任修复斜率——数字技术加速"涨"。本推论预测数字可处理性的搜索持久化效应拖慢信任修复斜率——数字技术拖慢"涨"。两条推论在同一信任域(digital-era institutional trust repair)内产生方向相反的预测，构成天然对撞——但并非逻辑矛盾：DED-042聚焦平台内生治理设计(透明度/可验证性机制是平台可控的)，本推论聚焦外生数字信息生态结构(搜索引擎排序/信息噪声比是平台单方不可控的)。两者的净效应取决于信息生态治理结构——当平台同时具备高可验证性(DED-042条件)且搜索引擎给予修复信号独立检索权重(本推论的RV条件)时，数字技术对信任修复的净效应为正；当平台缺乏可验证性且搜索引擎以纯engagement排序时，净效应为负(本推论占主导)。

operationalization:
  digital_negative_signal_dominance:
    definition: "搜索引擎对'[机构名称]'的中性查询(不含'scandal''controversy''crisis'等导向词)返回结果首页中，负面/争议性内容的占比——捕捉一个'无知用户'(对该机构无先验了解)首次搜索该机构时接触到的信息生态。"
    measurement: |
      操作步骤(一次性注册，不得事后调整):
      (a)查询词:仅机构官方名称(如'Volkswagen''United Airlines''Facebook')，不附加任何修饰词——模拟无先验信息的用户首次搜索行为;
      (b)搜索引擎:Google为主(全球多数市场的默认搜索引擎)，辅以地区主导搜索引擎(Baidu/Naver/Yandex)做稳健性检验;
      (c)首页定义:前10条自然搜索结果(不含广告位、不含知识面板/knowledge panel——这些是搜索引擎自身生成的结构化摘要，算法逻辑不同于网页排序);
      (d)编码规则:每条结果按标题+摘要片段(snippet)编码为负面(=1)/中性或正面(=0)/无法判断(=99，排除后重新计算比例):
        - 负面:标题或摘要含对该机构的批评/指控/丑闻提及/监管处罚/诉讼/事故/产品缺陷/用户投诉;
        - 中性或正面:机构官网/维基百科/常规新闻报道(非负面)/正面评测/招聘页面;
        - 无法判断:标题和摘要均为纯导航性(如'XX公司-官网')且无法从片段中判断内容倾向——排除后重新计算分母;
      (e)编码时点:在信任危机事件T0后≥1年进行(以确保搜索引擎索引已稳定)，由两名独立编码者背对背编码(遮蔽研究假设)，计算Cohen's κ，κ<0.7则增加第三编码者;
      (f)DNS=负面结果数/(10-无法判断结果数)，取值范围0-1。
    limitations: "搜索引擎结果是个性化的(基于用户位置/搜索历史/语言设置)——需在'干净'浏览器环境(无痕模式/清空cookie/不登录Google账号)下查询，并记录查询时的IP地理位置作为控制变量。不同搜索引擎的排序算法不同——以Google为主分析，以其他引擎为稳健性检验。搜索引擎结果随时间变化(DNS不是静态属性)——以T0+1年快照为主测量，辅以T0+3年/T0+5年追踪测量(检验DNS的时间衰减)。"

  trust_repair_duration:
    definition: "从信任危机事件首次公开披露(T0)到机构核心信任指标恢复至危机前基线水平的80%所需天数。修复速率=1/(T_repair - T0)。"
    measurement: |
      核心信任指标按机构类型选定(一次性注册):
      (a)上市公司:股价相对行业指数的超额收益恢复至危机前水平(控制市场beta和行业趋势——单纯股价恢复可能是市场整体上涨，非信任修复);
      (b)消费品牌:品牌信任度调查评分(Nielsen/BrandIndex/YouGov BrandIndex的Buzz score或等效指标)恢复至危机前水平;
      (c)数字平台:日活用户数(DAU)恢复至危机前30天均值的80%;
      (d)公共机构:公众信任度民调恢复至危机前水平。
      T0定义:危机事件被主流媒体(全国性报纸/通讯社/头部电视新闻网)首次报道的日期，或机构官方确认的日期——取较早者。
      基线定义:T0前90天该指标的日均值(排除T0前30天——部分危机在公开前已有泄露/传闻压低基线)。
      T_repair定义:指标首次回到基线80%水平的日期(需连续5个交易日/调查周期维持在≥80%水平，防止单日噪音误判为修复)。
    limitations: "指标选择影响修复时长——股价恢复快于声誉调查恢复(市场参与者可能比普通公众更早'原谅')——以多指标聚合为主(取各指标修复时长的中位数)。80%阈值是常规选择但包含任意性——辅以90%/100%阈值的敏感性分析。部分信任危机无清晰的单一T0(渐进式发酵的丑闻)——此时以'媒体关注度达到峰值'的日期为T0。"

  repair_signal_algorithmic_visibility:
    definition: "机构发布的修复信号(整改声明/第三方审计报告/监管合规确认/正面进展)在搜索引擎中是否获得独立于自然排序的展示位——即修复信号能否绕过'靠engagement竞争排序'的通道，通过结构化数据/权威站点优先索引/独立知识面板等替代通道获得检索可见度。"
    measurement: |
      三分制编码(一次性注册):
      0=低可见度:机构的修复信号仅以普通网页形式存在于搜索引擎索引中，无任何结构化展示位或优先索引——修复信号必须与所有其他内容在engagement排序中竞争;
      1=中等可见度:修复信号获得部分替代展示位——如机构官网的整改声明页面被搜索引擎标记为'权威来源'并优先排列、或在机构知识面板中有'近期整改/合规状态'的结构化字段(由机构通过schema.org标记提交);
      2=高可见度:修复信号获得独立于机构单方声明的可验证展示通道——如第三方审计报告被搜索引擎标记为'独立验证'并优先展示、整改进展由监管机构官网发布并被搜索引擎索引为权威来源、或区块链存证的整改记录可被搜索引擎独立抓取和验证。
      编码依据:T0+1年时点的搜索引擎结果特征，由独立编码者(遮蔽假设)评估，不得因修复结果好/坏而事后调高/调低RV评分。
    limitations: "RV测量的是'搜索引擎给予修复信号的结构性可见度'而非'机构在SEO上花了多少钱'——高SEO投入≠高RV(SEO可能被用于压制负面而非提升修复信号可见度)。RV的三分制丢失了连续差异——不同平台的实现质量差异显著。搜索引擎的算法变更可能改变RV——编码时点(T0+1年)的RV是快照，若搜索引擎在此期间发生重大算法更新(如Google Core Update)，需标注。"

derivation:
  from_l1:
    axioms: [AXIOM-002]
    theorems: [THEOREM-relation-information-asset]
  from_l2:
    bridging: [BR-L2-025, BR-L2-031]
  steps: |
    1. "BR-L2-031确立制度信任的不对称衰减结构——这是'被极化的对象'"
       BR-L2-031揭示:对制度的信任"掉得快、涨得慢"。底层机制:负面事件是"一次证伪"
       (一个反例推翻"制度可信"的信念，因为可信意味着零容忍违约)，正面修复需要
       "反复证实"(长期无问题的累积才能重建信念)。这一不对称不是制度的缺陷，而是
       人类信息处理特征:负信号的信念更新权重天然>正信号——漏掉危险信号的代价(被骗/
       被伤害) >> 过度警觉的代价(多疑/保守)。此步产出:信任不对称衰减的基本结构——
       任何信息环境变化都作用于这个已有结构。

    2. "BR-L2-025确立数字信息的可处理性——这是'极化的工具'"
       BR-L2-025揭示:数字编码的信息可由机器永久保存、即时检索、自动聚合——信息从
       "死物"(纸上的字，需人手动查阅)变成了"活物"(机器可读，可自动搜索/关联/聚合)。
       关键含义:数字信息不会像人类记忆那样自然遗忘(AXIOM-002——信息保鲜需花能量，
       但数字存储使保鲜成本趋零);数字信息可被检索(任何人在任何时间输入关键词即可
       触达);数字信息的排序不由时间自然衰减驱动，而由算法驱动。此步产出:数字信息
       生态的三个特征——永久性、即时可检索性、算法排序性——这些特征将作用于步骤1
       的不对称结构。

    3. "合力(失信侧):BR-L2-025×BR-L2-031→失信信号被永久钉死"
       在数字信息生态中，信任危机的负面信号获得三层结构性加固:
       (a)永久存储:负面新闻报道/社交媒体讨论/视频证据在数字生态中永不消失——
       不像前数字时代的报纸被回收/记忆自然淡忘/口头传闻消散;
       (b)高检索权重:搜索引擎排序算法以engagement(点击率/停留时长/分享率)、
       新鲜度(近期事件权重高)、权威性(主流媒体来源优先)为核心信号——负面事件
       的报道天然在这三个维度上得分高(高情绪冲击→高点击/高分享;危机期间被密集
       报道→新鲜度峰值;权威媒体跟进→权威性加权);
       (c)自动聚合:搜索引擎的"相关搜索""人们也在搜"等聚合机制将机构名称与负面
       事件关键词(structured snippet中的"controversy""scandal""lawsuit")自动关联，
       形成持久的语义绑定。
       这三层加固使BR-L2-031的"掉得快"升级为"跌被钉死"——不是一次失信→信任跌到
       谷底(这一步BR-L2-031已预测)，而是每次新用户搜索该机构名时，负面事件被重新
       激活——信任无法随时间自然修复，因为负面事件在数字生态中永远不会"成为过去"。

    4. "合力(修复侧):BR-L2-025×BR-L2-031→修复信号被噪声淹没"
       机构的修复努力(整改声明/审计报告/合规更新/正面进展)虽同样被数字生态永久
       保存和可检索，但它们面临结构性的传播劣势:
       (a)情绪载荷赤字:修复信号本质上是"无事发生"(整改完成=回归正常状态)、"技术性"
       (审计报告的语言)、"非冲突性"(正面进展缺乏戏剧张力)——在engagement驱动的
       排序算法中，这些信号在点击率/停留时长/分享率上系统性低于负面信号，从而获得
       更低的检索权重;
       (b)噪声竞争:数字信息生态的总信息量指数增长(BR-L2-027——信息过载)，修复信号
       必须与海量的、与该机构无关的日常信息竞争用户的注意力和搜索引擎的排序位——
       而负面信号因天然的情绪/新鲜度优势在噪声竞争中更容易突围;
       (c)"不搜即无":用户通常不会主动搜索"XX机构的整改报告"(除非是该机构的投资者/
       监管者/专业研究者)——而会搜索"XX机构出了什么事"(负面事件的搜索需求天然存在)。
       修复信号缺乏"拉动力"(pull demand)，而失信信号拥有持续的"拉动力"。
       这三层劣势使BR-L2-031的"涨得慢"进一步恶化为"涨被噪声闷住"——修复信号虽存在，
       但在信息生态中难以获得与失信信号对等的检索权重与关注度。

    5. "净效应:信任均衡向下偏移"
       步骤3(跌被钉死)+步骤4(涨被闷住)→信任净均衡向下偏移。这不是简单的"坏事传千里，
       好事不出门"——那在前数字时代也成立。数字时代的增量是:(a)负面信号的持久化程度
       从"数月到数年"(媒体周期/集体记忆)扩展到"永久"(只要搜索引擎索引存在);
       (b)修复信号在前数字时代可以通过"时间的流逝"(人们逐渐淡忘)+"新的正面互动积累"
       (持续的满意交易→口碑修复)来逐渐修复信任——这两个通道在数字时代被削弱:
       时间不再是修复的盟友(搜索引擎不遗忘)，口碑修复的效率被搜索引擎首屏结果所压制
       (用户先看到的是历史负面，而非近期的正面口碑)。

    6. "非平凡性(逐格判空)"
       2×2判据表见nontriviality_test。承重砖边际贡献诚实点名:
       - BR-L2-031是"被极化的对象"——确立不对称衰减的基本结构，但对"什么因素会极化
         或压缩这一不对称"沉默;
       - BR-L2-025是"极化的工具"——确立数字信息的可处理性，但对"可处理性如何具体
         影响信任动力学"沉默——BR-L2-025没有预测可处理性对正面/负面信号的影响是
         对称还是不对称的;
       - 推论本体是"极化的方向和幅度"——确立可处理性对失信端和修复端的影响是
         不对称的(永久化vs噪声化)，且净效应向下。这一不对称方向不在任何一块承重
         砖中——BR-L2-025不说"机器可读对坏消息的权重 > 对好消息的权重"，
         BR-L2-031不说"在数字信息生态中修复比前数字时代更慢"。

falsifiability: |
  【三条注册口径，分子/分母/测量口径一次性注册，不得事后调整】

  (a) DNS-修复周期主效应口径:
  在匹配危机严重程度(涉事人数/经济损失/媒体报道量级——三个维度各自标准化后取均值)的机构样本中,
  搜索引擎负面信号支配度(DNS, T0+1年快照)对信任修复周期(天数, 对数转换以处理右偏分布)的回归系数>0
  且p<0.05(控制行业固定效应、机构规模——员工数/营收的对数、危机类型——产品安全/财务欺诈/高管丑闻/
  操作事故)。统计量:ln(修复天数) ~ β1*DNS + controls, β1>0且95%CI下限>0。若β1≤0
  (DNS对修复周期无预测力或方向反向),核心预测(i)被证伪。

  (b) DNS独立于危机严重程度口径:
  在包含DNS和危机严重程度的回归中,DNS的系数β1保持显著(显著=控制危机严重程度后β1的95%CI仍>0),
  且DNS与危机严重程度的相关系数|r|<0.5(若r≥0.5,DNS可能是危机严重程度的代理而非独立构念)。
  若DNS的效应完全被危机严重程度吸收(加入严重程度后β1→0且不再显著),预测(ii)被证伪——
  DNS不具独立解释力,推论退化为"严重的危机→修复慢"的平凡陈述。

  (c) RV调节效应口径:
  在包含DNS×RV交互项的回归中,交互项系数<0且p<0.05(即RV越高,DNS对修复周期的延长效应越弱)。
  统计量:ln(修复天数) ~ β1*DNS + β2*RV + β3*(DNS×RV) + controls, β3<0且95%CI上限<0。
  若交互项不显著(DNS对修复周期的影响不因RV高低而异),预测(iii)被证伪——
  修复信号的替代传播通道不具实际的修复加速效果。若交互项显著但方向为正(RV加强了而非削弱了
  DNS的延长效应——即修复信号的结构化展示反而让负面事件更显眼),预测(iii)被反向证伪,
  推论需降格为"数字可处理性极化信任不对称,且机构单方修复努力无法逆转"的更悲观版本。

  【适用区间】本推论适用于:(1)搜索引擎为公众获取机构信息的主要渠道的社会(互联网普及率>50%);
  (2)信任危机具有足够公众关注度(谷歌趋势峰值≥50,或等效的本土搜索引擎热度阈值)使搜索引擎
  索引产生实质变化;(3)机构的信任关系以公众/消费者/投资者等外部利益相关者为主(非内部信任)。
  不适用于:主要利益相关者不通过搜索引擎获取机构信息的场景(B2B专用渠道/封闭社区/前数字社会)。

falsification_trace:
  primary_suspect: |
    (a)的核心因果链"搜索引擎负面结果占比→实际用户接触负面信息→信任修复被拖慢"在以下
    环节可能断裂:

    (1)【搜索行为≠信息接触】DNS测量的是"如果用户搜索会看到什么"，但现实中:
    (i)多数用户不主动搜索机构名称——他们对机构的印象来自被动推送(社交媒体feed/新闻推荐
    算法/口碑)——搜索引擎结果可能不是公众对机构认知的主要塑造渠道；
    (ii)即使搜索，用户可能不点击任何结果而只看知识面板(knowledge panel)——搜索引擎自己
    生成的结构化摘要(知识面板)可能已经包含了机构的整改信息(如Wikipedia摘要中的最新状态)，
    用户不需要点击负面文章就能看到"当前状态"——此时DNS高不等于负面信息被实际消费。
    若DNS→搜索行为→信任修复的因果链在中间环节断裂(用户不搜索/不点击/点击不改变信任)，
    (a)的统计显著可能是虚假的(由未观测的第三变量驱动——如高DNS的机构通常管理更差、
    这本身就导致修复慢)。

    (2)【反向因果】信任修复慢→公众持续关注该机构→媒体持续生产负面内容→搜索引擎索引的
    负面结果更多(DNS升高)。DNS可能是修复慢的结果而非原因——媒体对"仍在挣扎的机构"的
    持续报道推高了DNS,而非高DNS拖慢了修复。区分因果方向需要:(i)DNS的时间变化分析——
    T0+1年DNS预测T0+1年到T0+3年的修复斜率(而非同期相关);(ii)工具变量——以机构名称
    的搜索引擎优化(SEO)难度为DNS的工具变量(如机构名称是否恰好与某个负面含义的常用词
    同形/近形——此时DNS被外生地推高)。

    (3)【DNS的测量信度】搜索引擎结果高度个性化(用户位置/语言/搜索历史)——"干净"浏览器
    快照能否代表真实用户的搜索体验存疑。不同地理位置的用户搜索同一机构名可能看到完全
    不同的结果(本地化新闻优先)。DNS的快照测量可能系统性偏离真实用户的平均搜索体验。

  secondary_suspect: |
    BR-L2-025的"信息可被机器自动聚合"机制在信任修复场景中的方向性——BR-L2-025说
    信息可以被机器聚合,但没说是聚合负面信息还是聚合正面信息。搜索引擎的自动聚合机制
    (知识面板/相关搜索/featured snippet)理论上也可以聚合修复信号——如知识面板的
    "近期事件"时间线可以同时列出负面事件和整改进展。若搜索引擎的知识面板/结构化摘要
    在聚合时给予了修复信号足够的权重(如自动展示"该机构于YYYY年通过XX监管审核"),
    BR-L2-025带来的聚合效应可能帮助修复而非阻碍修复——本推论的赌注在于搜索引擎的
    聚合机制整体偏向负面(因为负面事件的信息密度和结构化程度高于修复信号——丑闻有
    明确的"事件"+"时间"+"涉案方"三元组,而整改是"过程"而非"事件")。如果搜索引擎的
    NLP/信息提取能力进化到能平等地提取和展示修复信号,本推论的BN-L2-025机制基础
    将被削弱(但不会被推翻——因为还有engagement排序的不对称在起作用)。

  unlikely_suspect: |
    BR-L2-031的"制度信任不对称衰减"基本结构——信任掉得快涨得慢这一规律在政治信任
    (政府丑闻后支持率恢复)、品牌信任(产品召回后市场份额恢复)、人际信任(背叛后关系
    修复)等多个领域的实证基础广泛而稳固。本推论即使被(a)(b)(c)部分或全部证伪,问题
    极不可能出在BR-L2-031本身,而出在BR-L2-025与BR-L2-031的交互是否走本推论预测的
    方向。
  note: |
    推论的核心赌注不在两块承重砖各自为真,而在两砖合力的方向——BR-L2-025给了信息
    生态的"结构变化"(可处理性),BR-L2-031给了"被变化的对象"(不对称衰减),推论赌
    的是这个变化在不对称的两个方向上的效应大小不等(失信端>>修复端)。若实证发现
    数字可处理性对失信端和修复端的加速效应大致相等(DNS不影响修复周期,因为搜索引擎
    也给修复信号同等的权重),则两砖合力存在但方向赌注失败——推论塌缩为"数字信息
    生态同时加速了失信和修复的传播,净效应取决于具体生态的算法设计"(这一退化的
    弱版本与DED-042的框架一致,不再是本推论的独立贡献)。

excluded_outcomes:
  - outcome: "机构通过法律手段删除负面内容(如'被遗忘权')后的信任修复"
    description: "被遗忘权/法律强制删除改变了DNS,属于干预了本推论的自变量——这不构成证伪,而是DNS→信任修复因果链的进一步验证(改变DNS→修复加速)。此案例应作为预测(i)的准实验证据而非射程外案例。"
  - outcome: "机构彻底更名/品牌重塑后的信任修复"
    description: "更名打破了机构名称与负面事件的语义绑定(搜索引擎对'新名称'的查询返回干净的索引),本质是重置DNS为零——也不构成证伪。"
  - outcome: "搜索引擎主动调整算法以提升权威修复信息的排序权重(如Google的'权威信息优先'倡议)"
    description: "搜索引擎算法变更属于RV的系统性提升(宏观RV),若算法更新后DNS-修复周期的相关减弱,恰证实了预测(iii)的RV调节效应——不构成证伪。"
  - outcome: "在搜索引擎非主导信息获取渠道的市场中(如以社交媒体/短视频平台为主要信息源),DNS对信任修复的预测力消失"
    description: "已在适用区间中排除。若在搜索引擎主导市场外DNS不预测修复周期,这是射程边界的验证而非推论本身的证伪。"

anti_talisman_clause: |
  【防不可证伪护身符——禁止由结果反推前件,四条一次性注册】

  (1) 禁止由"信任修复慢"反推"该机构的DNS应该很高(只是我们没测出来)"——
  DNS的编码规则(查询词/编码标准/首页定义/编码时点)已在operationalization中
  一次性注册。若某机构按注册编码的DNS低但修复慢,首先接受该案例为预测(i)的反例,
  不得诉求"该机构实际的数字负面支配度比我们测的高——可能是因为用户在社交媒体
  而非搜索引擎上看到了负面信息"来开脱——因为DNS的操作化定义就是搜索引擎结果
  页面的负面占比,社交媒体口碑是另一个独立变量,不得与DNS混同。

  (2) 禁止由"RV调节效应不显著"反推"搜索引擎其实给了修复信号更高的隐含权重,只是
  我们的三分制编码太粗糙没捕捉到"——RV的三分制编码标准(0/1/2的操作化门槛)已在
  见任何修复数据前一次性注册。若RV的调节效应不显著,首先接受预测(iii)被证伪的
  可能性,不得诉求"如果有更精细的连续测量,RV的调节效应就会出现"——唯一允许的
  口径调整:若搜索引擎在此期间推出了新的结构化展示机制(如Google新增了'合规状态'
  知识面板字段),允许在遮蔽修复结果的条件下由独立编码者重新编码——但重新编码
  不得因某机构的"修复快/慢"而有选择性地进行。

  (3) 禁止由"修复快于预期"反推"该机构的危机严重程度其实没匹配好——实际没那么严重"——
  危机严重程度的匹配维度(涉事人数/经济损失/媒体报道量级)已一次性注册。事后不得
  因某案例的修复方向有利而主张"该案例不应归入高严重程度组"或反之。匹配维度之外的
  严重程度差异(如该机构的'事前声誉储备'/品牌忠诚度)是可接受的混淆变量,但必须在
  分析中显式控制(通过事前品牌强度/客户满意度/NPS等独立指标),不得仅凭事后推测。

  (4) 【对称保护——禁止双标】以下学术双标同时禁止:
  (a)当观测到高DNS机构修复慢时,声称"这验证了数字可处理性极化信任不对称的机制"
  (即使未证明修复慢是通过'用户搜索→看到负面→降低信任'这一因果链);
  (b)当观测到高DNS机构修复不慢(或低DNS机构修复慢)时,声称"这是因为该机构有其他
  未建模的优势(如更强的公关团队/更忠实的用户群/更有利的媒体关系)"而不接受这
  构成推论的反例。若DNS不能系统性预测修复周期的差异(在统计上不可区分),推论关于
  "数字负面信号支配度是信任修复的显著拖累因素"的核心主张被削弱——即使推论没有
  声称DNS是唯一的拖累因素。

  【削弱条件】若仅(a)不成立而(b)成立(DNS独立于危机严重程度→但DNS不预测修复),
  推论的核心因果主张被掏空——DNS在两个前提中均获支持(它是一个独立于严重程度的
  数字生态特征)但缺乏对结果的预测力,说明DNS存在但不影响信任修复→推论的机制链
  (DNS→信息接触→信任更新)在中间断裂。若(a)(b)成立但(c)不成立(RV不调节),
  预测(iii)证伪但(i)(ii)存活——推论降级为"数字负面支配度拖慢信任修复,
  且该效应不受机构修复信息可见度的调节"的弱版本。

nontriviality_test: |
  2×2判据表(自变量档:数字负面信号支配度DNS——低vs高 × 被预测量档:信任修复周期——
  与同严重程度低DNS组可比vs显著更长):

  格(低DNS, 修复周期与同严重程度基准可比)——「基准格」——BR-L2-031单独预测:
  信任危机后修复慢是基线规律,与DNS无关。此格反映的是"数字信息生态未对机构
  构成额外负面负担"的情形——信任修复走BR-L2-031的基线轨道。平凡。

  格(低DNS, 修复周期显著长于同严重程度基准)——若被填充(低负面支配度但修复仍异常
  慢),说明存在DNS以外的、更强的信任修复阻碍因素(如机构自身管理能力极差/行业特征/
  文化因素)——不直接证伪本推论(本推论不声称DNS是唯一阻碍),但暗示DNS的解释力可能
  在实践中被其他因素压倒,推论的实际意义有限。

  格(高DNS, 修复周期与同严重程度基准可比)——「非平凡空格·可被现实填满」——
  若被填充(即高负面搜索支配度的机构修复速度与低DNS机构无差异),预测(i)被证伪。
  BR-L2-031单独预测此格为空(没有理由认为高DNS机构的修复应与低DNS机构相同——如果
  BR-L2-031是唯一在运作的机制,负面信息更多意味着信任受损更严重→修复应更慢),
  但BR-L2-031不说"搜索引擎负面结果占比不同的机构的修复速度是否有差异"(它根本不说
  '搜索引擎')。本推论预测此格应被填满(高DNS→修复更慢),若经验上此格为空
  (高DNS≠修复更慢),则BR-L2-025的"数字可处理性→不对称极化"的核心焊接不成立。

  格(高DNS, 修复周期显著长于同严重程度基准)——「非平凡格」——没有任何承重砖
  平凡地强制它:BR-L2-031不说"数字信息生态中的修复比前数字时代更慢"(它的不对称
  衰减规律是跨时代通用的基线);BR-L2-025不说"可处理性对坏消息和好消息的影响
  不对称"(它只说信息变得可被机器处理——按理说好的坏的一起变可处理)。"数字
  可处理性在失信端和修复端的效应不对称→净均衡向下"这一交互命题不在任何一块砖
  里,是两砖合力+推论关于信号竞争的逻辑链的合成增量。该格可被现实填满(若实证发现
  DNS长期预测更长的修复周期)或清空(若DNS不预测修复周期)——后者使推论塌缩。

  brick=conclusion自查:'数字可处理性极化制度信任的不对称→整体信任均衡向下偏移'
  未在BR-L2-025或BR-L2-031中原文或近义出现。BR-L2-025不含"信任"/"修复"/"不对称";
  BR-L2-031不含"数字"/"搜索引擎"/"算法排序"。从BR-L2-031的"掉得快涨得慢"跳到
  "数字时代比前数字时代更慢、且原因是搜索结果的永久性和排序不对称",需要BR-L2-025
  提供"数字信息生态的结构特征"+推论提供"这些特征不对称地作用于失信端和修复端"的
  方向性焊接——两步合成都不是已有砖的复述。

real_world_anchors:
  supporting:
    - anchor: "大众汽车排放门(Dieselgate, 2015-至今)——数字负面支配度的持久效应"
      evidence: |
        2015年9月EPA公开指控大众在柴油车上安装排放作弊软件。截至2024年(危机后9年),
        Google搜索"Volkswagen"首页结果中仍有2-4条直接提及排放丑闻(维基百科
        'Volkswagen emissions scandal'条目、新闻媒体的回顾性报道、诉讼更新)——
        DNS持续维持在0.2-0.4范围(具体取决于查询时点和地理位置,此为多次快照的
        大致范围)。大众在2016-2020年间执行了大规模整改(召回超过1100万辆柴油车、
        支付超过300亿美元罚款/赔偿、更换CEO、重组管理层、推出电动车战略转型),
        修复信号在数量和质量上均属企业危机管理的教科书级案例。然而这些修复信号
        (大众电动车转型/碳中和承诺/MEB平台发布)在Google搜索首页的可见度远低于
        排放丑闻内容——修复信号需要用户主动搜索"大众电动车战略"等特定查询词才能
        触达,而非像排放丑闻那样在通用查询"Volkswagen"下即被展示。大众的股价恢复
        至危机前水平用了约3年(2015.9→2018年中),但品牌信任度调查(YouGov)显示
        大众在美国消费者中的品牌印象在2019年仍未恢复到危机前水平——修复周期的
        不同指标测量出不同的恢复时长,且消费者层面的信任修复显著慢于资本市场。
        诚实标注:无法反事实——如果我们能跑一个"没有Google搜索的世界"作为对照,
        大众的信任修复是否会更快?这一锚承重"数字负面支配度高→修复信号可见度
