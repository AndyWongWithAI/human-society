  counterexamples:
    - case: "丰田'刹车门'(2009-2010)——召回后的搜索生态修复"
      analysis: |
        2009-2010年丰田因"突然加速"问题在全球召回超过900万辆汽车。事件初期
        媒体密集报道→DNS高。但丰田的搜索生态在此后十年间逐步"正常化"——
        Google搜索"Toyota"目前的首页结果以官方网站/购物(在售车型)/正面评测为主,
        刹车门相关内容基本退到首页之外(DNS接近0)。丰田的信任修复手段包括:(i)支付
        $12亿罚款并与美国司法部达成延期起诉协议(2014年结案)——法律结案为搜索
        结果提供了明确的"事件已解决"信号;(ii)美国国家公路交通安全管理局(NHTSA)
        和美国国家航空航天局(NASA)的联合调查最终认定"突然加速"的主因是"驾驶员
        误踩油门而非电子系统缺陷"——这一权威第三方的"无罪(部分)判定"在搜索引擎
        中获得了高权重(政府/NASA域名的权威性加成),帮助将叙事从"丰田造了杀人车"
        转变为"部分原因是驾驶员失误";(iii)丰田持续投放正面内容(新车评测/安全
        技术创新)——大量的、持续的正面内容使搜索引擎有足够多的"新鲜正面信号"
        来稀释旧的负面信号。
        该案例为边界:它显示权威第三方(政府/科学机构)的"无罪判定"是修复信号
        获得高检索权重的关键条件——第三方权威性使修复信号绕开了与负面信号的
        engagement竞争(RV=2:独立可验证+权威来源优先索引)。这恰好支持预测(iii)
        的RV调节效应——当修复信号具备独立权威性,它能有效压过负面信号的搜索
        持久性——但也提示了本推论的一个隐藏前提:大多数机构的修复信号缺乏"NASA/
        NHTSA裁定丰田无罪"级别的权威第三方背书。
      status: boundary_case
    - case: "Meta/Facebook Cambridge Analytica(2018)——DNS持续高位与不可逆的年轻用户流失"
      analysis: |
        Facebook在Cambridge Analytica丑闻后的搜索引擎生态一直未能修复——
        Google搜索"Facebook"首页长期含维基百科'Facebook-Cambridge Analytica
        data scandal'条目及隐私相关的负面报道,DNS持续偏高。Facebook的修复信号
        (Mark Zuckerberg国会听证→承诺加强隐私保护→推出'清除历史记录'工具→
        公司更名为Meta以分散品牌关联)数量不少,但:(i)修复信号缺乏第三方独立
        验证——用户无法验证Facebook是否真的停止了过度数据收集(可验证性=0);
        (ii)搜索引擎的知识面板未显示任何隐私合规状态的结构化信息(RV=0);
        (iii)Facebook的更名策略(Meta)只在新品牌上重置了DNS(搜索"Meta"不触发
        CA丑闻),但搜索"Facebook"时DNS依旧高——更名=重置DNS,恰是DNS→信任
        因果链的进一步证据。该案例为强支持——Facebook的高DNS+低RV+极慢修复
        (2024年千禧一代和Z世代用户的信任度仍远低于危机前水平),与本推论三条
        预测的方向均一致。
      status: supporting_counterexample

boundary_cases:
    - case: "搜索引擎算法更新对DNS的系统性冲击(如Google Core Update)"
      analysis: |
        搜索引擎的排序算法定期更新(Google每年多次Core Update),旨在提升权威内容/
        原创报道/专业来源的排序权重、降低低质/过时内容的权重。若某次Core Update
        将"回顾性新闻报道"(对多年丑闻的回顾)从"新鲜内容"降级为"过时内容",同时
        提升机构官网和权威第三方(如监管机构合规页面)的排序权重,等于搜索引擎从
        宏观层面提升了所有机构的RV——这符合预测(iii)的RV调节效应,但不构成对
        预测(i)(ii)的证伪(因为DNS的定义和效应是在特定搜索引擎算法版本下成立的)。
        若搜索引擎的算法进化方向整体朝着"修复信号获得更高默认可见度"发展,本推论
        的射程将从"永久性结构效应"收窄为"特定算法时代效应"——这对推论的长期有效性
        构成侵蚀,但不损害推论在当前的预测力。
      status: boundary_case
    - case: "B2B/专业服务机构的搜索生态——利益相关者不使用通用搜索"
      analysis: |
        管理咨询公司(如McKinsey/Bain/BCG)、律师事务所、会计师事务所的客户——
        企业高管/法务/采购部门——在评估这些机构的可信度时不依赖Google搜索,
        而依赖行业口碑/投标过程/专业排名(Vault/Chambers)。这些机构的DNS即使很高
        (如McKinsey在2010s涉及内幕交易/南非腐败/阿片类药物咨询等多项争议,
        搜索首页含较多负面内容),对其实际信任修复的影响也远弱于对消费者品牌的
        影响——因为利益相关者的信息获取渠道绕开了通用搜索引擎。本推论的射程在此
        边界处失效——预测(i)(ii)(iii)不适用于此类机构。此为射程边界,非证伪。
      status: boundary_case

discriminant_validity: |
  【独有可证伪预测——相对相邻理论逐一判别】

  (1) vs BR-L2-031(制度信任不对称衰减——掉得快涨得慢):
  BR-L2-031是跨时代的基本规律——它预测任何时代制度信任都"掉得快涨得慢"。
  本推论追加的增量是:数字时代修复比前数字时代更慢(不是基线水平的慢,是被
  数字信息生态额外拖慢的慢)。可判别:如果比较匹配严重程度的危机在"高数字
  渗透率时代"(2005年后)vs"低数字渗透率时代"(1990年前),前者的修复周期系统性
  更长且差异不由危机本身特征解释→支持本推论。若两个时代的修复周期无差异→
  BR-L2-031足够,本推论为冗余。

  (2) vs DED-042(算法监控×制度信任不对称:修复斜率的系统性拉陡):
  这是最核心的判别。两条推论的数字技术方向相反——DED-042赌"数字技术的透明度
  设计可加速修复",本推论赌"数字技术的搜索持久性拖慢修复"。可判别:在同时测度
  算法透明度(DED-042的自变量——可验证性/审计追踪/自动公示)和搜索引擎负面支配度
  (本推论的自变量——DNS)的研究中,两变量的效应方向分别对应各自推论的预测——
  (a)高透明度→修复快(DED-042预测);(b)高DNS→修复慢(本推论预测)。若(b)的效应
  被(a)完全压倒(高透明度下的高DNS机构修复不慢于低DNS高透明度机构),说明DED-042
  的加速效应强于本推论的拖慢效应——两条推论同时为真但DED-042在实践中更重要。
  若(a)(b)的效应共存(两者各自独立预测修复速度,方向相反),两条推论各自存活,
  净效应需个案计算。

  (3) vs "议程设置"(Agenda-Setting, McCombs & Shaw 1972):
  议程设置理论预测"媒体对议题的报道量影响公众对该议题重要性的感知"——这一经典
  理论可以解释"为什么公众持续关注某机构的丑闻"(因为媒体持续报道),但不停留在
  "为什么数字时代的修复比前数字时代更慢"。议程设置是媒体的需求侧(推送),本推论
  关注搜索引擎的供给侧(检索持久性)——两者互补但不可相互替代:议程设置解释"为何
  丑闻在被报道期间影响大",本推论解释"为何丑闻在停止报道后(搜索引擎中的历史页面)
  仍持续影响信任修复"。

  (4) vs "声誉管理/形象修复理论"(Image Repair Theory, Benoit 1995):
  形象修复理论提供了一个分类学(否认/逃避责任/减少冒犯性/修正行动/道歉),
  但不涉及"不同信息生态中同一修复策略的效果差异"。本推论预测:同一条修复策略
  (如公开道歉+整改)在低DNS环境中的恢复效果优于高DNS环境——因为高DNS意味着
  搜索引擎帮助用户跨越了时间(不需要'记得'当年的丑闻,搜索即可'被提醒'),
  修复信号必须与搜索引擎持续"提醒"的丑闻竞争。可判别:控制修复策略内容后,
  DNS仍独立预测修复效果——形象修复理论无法预测这一差异。

  (5) vs "新闻的遗忘曲线"(Ebbinghaus式的新闻注意力衰减):
  新闻注意力随时间自然衰减(今天的头条是明天的背景)——在前数字时代这是信任
  修复的盟友(公众逐渐遗忘丑闻→信任随新的正面互动而恢复)。本推论预测这个盟友
  在数字时代被削弱——搜索引擎使任何人在任何时候可以穿越时间、恢复到丑闻发生时
  的信息环境。可判别:同类丑闻在前数字时代的媒体注意力衰减速率(新闻提及频率的
  下降斜率)与数字时代DNS的衰减速率比较——若DNS的时间衰减(负面结果随时间退出首页
  的速率)显著慢于前数字时代新闻提及的衰减→支持本推论;若两者的衰减速率相同→
  数字信息生态未必比前数字时代更'持久',推论的核心前提被削弱。

  【防平凡化守卫】若有人说"互联网有记忆,坏事传千里——这是常识",非平凡增量在于:
  (a)"互联网有记忆"不区分正面和负面记忆的持久性差异——本推论赌的是搜索引擎对
  正面和负面记忆的持久性不对称(负面>>正面);(b)"坏事传千里"是传播广度的常识,
  本推论赌的是"搜索引擎使坏事跨越时间、被后来者在不知情的情况下反复重新发现"
  的检索持久性——这与传播广度的机制不同;(c)本推论对赌注进行了精确操作化——
  DNS的编码规则/修复周期的测量口径/预测(i)(ii)(iii)的统计检验——不是常识的模糊复述;
  (d)本推论预测DNS高的机构修复更慢且该效应独立于危机严重程度——若有人说"这是
  常识",请他事前预测哪些机构的DNS高而修复快(DNS对修复的预测方向是常识吗?常识
  还可能预测"高DNS→机构有更大动力修复→修复更快",常识对方向不置可否,本推论赌了方向)。

