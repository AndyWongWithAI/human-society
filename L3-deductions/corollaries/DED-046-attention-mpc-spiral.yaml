id: DED-046
type: deduction
layer: L3-deductions
status: verified
term: "注意力稀缺xMPC收入梯度：注意力-消费的恶性螺旋 (Attention-Scarcity x MPC Income Gradient: The Attention-Consumption Vicious Spiral)"

人话摘要: "穷人不是大手大脚——是脑子被生存焦虑占满了,没余力抵抗算法精准推送的消费诱惑。注意力越少→越容易被精准广告捕获→钱花得越多→越焦虑→注意力更少,形成一个越陷越深的恶性循环。这不是说穷人意志力差,是说注意力这个'认知防火墙'在贫困下被削薄了,算法的精准推送就更容易穿透。同一收入水平下,用现金/借记卡的人比高频刷直播电商的人存下更多钱——而且这个差距在低收入人群里更大。"

statement: |
  【核心】注意力稀缺(BR-L2-027)与MPC收入梯度(BR-L2-029)交互形成"注意力-MPC放大螺旋"——这是独立于收入水平和流动性约束的第三条MPC决定通道。低收入者的认知资源已被生存焦虑消耗(注意力池更浅)→更易被算法推荐的消费触发精准捕获→MPC居高不下→储蓄不足→财务焦虑加剧→注意力资源进一步萎缩,形成自我强化的恶性循环。

  【驱动量】两个独立可测的前件:(1)注意力池深度——个体在完成生存必需决策后可分配给消费决策的剩余认知资源(受收入水平/财务压力/决策负荷影响);(2)算法推荐消费暴露度——个体接触个性化消费推荐(直播电商/feed推荐/精准优惠券)的频率与强度。两前件交互:注意力越浅,算法推荐的消费捕获效率越高。

  【预测】(i)同一收入水平下(按可支配收入五分位分组),低算法暴露组(仅用借记卡/现金)的MPC显著低于高算法暴露组(高频使用直播电商/个性化推荐),且该差异在低收入组中更大(交互效应);(ii)注意力池深度中介算法暴露→MPC的效应——算法暴露对MPC的影响至少部分通过注意力稀缺渠道传导,控制注意力变量后主效应减弱;(iii)注意力-MPC螺旋在时间序列上自相关:t期低注意力→t+1期高MPC→t+2期更低注意力→t+3期更高MPC,形成跨期正反馈。

  【判别】不同于BR-L2-029的传统解释(仅从收入水平和流动性约束出发)——本推论追加第三条通道(注意力),且做出传统理论不做预测的交互效应(同一收入组内算法暴露→MPC分化,低收入组内分化更大)。不同于"稀缺心态"(Mullainathan & Shafir)的一般性认知带宽论述——本推论将其精确焊接至MPC,并加入算法推荐作为放大器,给出带计量口径的可证伪预测。不同于"冲动消费"心理学——本推论将冲动消费从个体特质重新定位为注意力稀缺×算法精准度的结构性产物。

operationalization:
  income_level:
    definition: "个体或家庭的可支配收入水平,按国家统计口径分位分组(五分位或十分位)。"
    measurement: "标准化家庭收入调查(如中国家庭金融调查CHFS、美国Survey of Consumer Finances),取等价可支配收入(家庭总收入/等价成人人数,按OECD平方根量表调整),按全国样本分位分组。"
    limitations: "截面收入波动不等于永久收入(permanent income);自报收入有低报偏差(尤其低收入端)。但本推论只需收入排序(分位),不需绝对收入水平,排序鲁棒性高于绝对水平。"

  attention_pool_depth:
    definition: "个体在完成生存必需决策(工作/住房/食物/债务)后可分配给消费决策的剩余认知资源量——不是一般智力,是特定于决策时刻的可调用认知带宽。"
    measurement: |
      多指标聚合(事前锁定权重):
      (a) 财务焦虑量表(如IFDFW——InCharge Financial Distress/Financial Well-Being Scale的8项版)——捕捉财务担忧占用的认知空间;
      (b) 认知带宽行为任务——如Raven's矩阵任务在财务压力启动前后的正确率差(借鉴Mullainathan & Shafir 2013的"甘蔗农收获前vs收获后"范式);
      (c) 决策疲劳代理变量——日消费决策数×决策复杂度(高频小额vs低频大额),控制时间压力。
      综合得分:标准化后等权聚合,不得在见数据后调整权重。
    limitations: |
      认知带宽≠注意力稀缺本身——前者是存量,后者是状态。本推论的操作化测量"可用于消费决策的剩余注意力",而非一般注意力容量。注意力和认知带宽是两个相邻但不完全重叠的构念:注意力强调"当下聚焦/过滤能力"(与BR-L2-027的信息过载→判断力下降直接焊接),认知带宽强调"总认知资源池"(与Mullainathan & Shafir文献焊接)。本推论的测量采用"注意力池深度"而非单纯"认知带宽"——强调剩余注意力的可调用量(即带宽中尚未被生存决策占用的部分),是注意力容量扣除生存决策税后的余额。此概念桥梁是推论结构中的关键焊接点:若未来研究证实"注意力池深度"与"认知带宽"在经验上不可区分,推论术语需降级为认知带宽,但核心机制(剩余认知资源→消费决策质量→MPC)不受影响。

  algorithmic_consumption_exposure:
    definition: "个体接触并通过算法推荐渠道完成消费的频率与强度——不是'上网购物'的笼统指标,而是特定于'算法主动推荐→触达→成交'这条通路的暴露量。"
    measurement: |
      两维度聚合:
      (a) 频次维度——每周通过以下渠道浏览/购买的次数:直播电商(抖音/快手/TikTok Shop)、个性化推荐feed(淘宝"猜你喜欢"/拼多多推荐/Amazon Recommended)、精准优惠券推送(基于用户画像的折扣触发);
      (b) 强度维度——上述渠道消费金额占总消费支出的比例。
      低暴露组的操作定义:主要使用借记卡/现金/非个性化电商搜索(主动搜索而非接受推荐)完成消费,上述渠道消费占比<10%。
      【一次性注册】高/低暴露的分界线为上述渠道消费占比≥30% vs <10%,中间20-30%为灰色带(主分析排除或敏感性分析)。分界线在见数据前锁定,不得事后调整。
    limitations: |
      "算法推荐"vs"主动搜索"的边界在实际使用中模糊——用户可能"主动搜索后被算法推荐引导加购"。测量采用保守分类:只要消费触发链中任一步骤含算法推荐(推荐→点击→加购→支付),即计为算法暴露。此保守偏向低估效应(低暴露组可能含微弱算法暴露,缩小两组差异),若在此保守分类下仍测得显著MPC差异,效应更可信。

  mpc:
    definition: "边际消费倾向——可支配收入增加1单位时,消费支出增加的金额(MPC=ΔC/ΔY)。消费支出操作定义为非耐用品消费(不含还债支出,按标准消费分类剔除还本付息)。"
    measurement: |
      标准方法:
      (a) 截面:家庭消费支出对可支配收入的回归系数(按收入分位分组回归,控制家庭规模/年龄/教育/地区固定效应);
      (b) 面板(更优):同一家庭跨期收入变化对消费变化的回归(控制永久收入vs暂时收入冲击,如Jappelli & Pistaferri 2010方法);
      (c) 自然实验:退税/转移支付/ stimulus check的消费响应(追踪支出变化)。
      主分析方法:面板数据回归(家庭固定效应),消费支出按非耐用品定义(不含还债)。若面板与截面/自然实验结果不一致,以面板估计为准。
    limitations: "MPC估计对收入冲击类型敏感(预期vs非预期/暂时vs永久);本推论预测适用于所有冲击类型,但效应量可能因冲击类型而异。面板数据优于截面,但面板中的MPC异质性估计需大样本。"

derivation:
  from_l1:
    axioms: [AXIOM-001, AXIOM-002]
    theorems: []
  from_l2:
    bridging: [BR-L2-027, BR-L2-029]
  steps: |
    1. "BR-L2-029:MPC收入梯度作为出发点"
       BR-L2-029确立穷人MPC高于富人——传统解释仅从收入水平(补窟窿/被压抑需求)
       和流动性约束(借钱难)出发。这些解释属实但不完整——它们解释了"为何钱到手就花",
       但未解释"为何某些穷人比同收入水平的其他穷人花得更多/存得更少"。
       此步产出:MPC在收入间存在系统性差异,但收入组内变差未被传统解释所覆盖。

    2. "BR-L2-027:注意力稀缺作为机制补充"
       BR-L2-027确立注意力是稀缺资源——人在给定时间内只能处理有限信息,且信息过载
       降低判断质量(AXIOM-002→信息超载→保真度衰减)。低收入者的独特处境:面临更多
       即时生存决策(房租/债务/食物价格的每日波动更致命),这些"认知税"消耗注意力池
       (AXIOM-001:竞争稀缺资源→穷人的注意力本身就是被更多竞争性需求争抢的稀缺资源)。
       此步产出:低收入者不仅收入低,其注意力池也更浅——这是独立于收入数字的第二个
       脆弱维度。

    3. "算法推荐作为注意力捕获放大器"
       平台推荐算法经A/B优化后,精准识别用户注意力薄弱窗口(深夜/焦虑情绪/决策疲劳
       时段)并推送消费触发。注意力池越浅→越倾向直觉式(System 1)而非深思式
       (System 2)消费决策→越易被精准推送捕获。注意:此步未引用BR-L2-032(算法成本
       断崖)——即便没有算法,注意力稀缺本身也会增加冲动消费概率(小卖部把糖果放在
       收银台就是这个原理的原始版本)。算法的作用是"放大器"——它把原本需要物理场景
       (商店布局/推销员)的注意力捕获机制数字化、个性化、7×24不间断。此步产出:
       注意力池深度×算法曝光的交互效应——注意力越浅,同样的算法推送捕获效率越高。

    4. "合力:注意力-MPC放大螺旋的闭合"
       步骤1-3首尾相接:BR-L2-029→穷人MPC更高(传统渠道);BR-L2-027→穷人的注意力池
       更浅(AXIOM-001+AXIOM-002→生存决策税);步骤3→浅注意力×算法曝光→消费捕获→
       支出增加→MPC进一步提高(注意力渠道)。螺旋闭合:支出增加→储蓄减少→财务焦虑
       加深→注意力进一步萎缩(BR-L2-027的注意力稀缺机制二次触发)→下一轮更易被
       算法捕获。合成预测:注意力池深度×算法曝光×时间→MPC的累积放大,该效应在
       低收入组中最强,且独立于收入水平和流动性约束的传统渠道。

    5. "非平凡性(逐格判空)"
       2×2判据表见nontriviality_test。承重砖边际贡献诚实点名:
       - BR-L2-029起"确定基线梯度"作用——确立穷富MPC差的存在,但不预测组内变差
         也不涉及注意力机制;
       - BR-L2-027起"提供摩擦来源"作用——确立注意力稀缺→判断力下降,但不预测
         判断力下降的具体方向(可能指向过度消费、也可能指向过度保守、或指向随机
         选择),也不涉及MPC;
       - AXIOM-001+AXIOM-002是焊接剂——AXIOM-001解释"为何穷人的注意力更稀缺"
         (竞争性需求多),AXIOM-002解释"注意力稀缺为何导致决策质量下降";
       - 组合增量:"同一收入组内算法暴露→MPC分化+低收入组内分化更大+跨期螺旋"
         不在任何单一砖中——BR-L2-029不做组内预测,BR-L2-027不做MPC方向预测,
         螺旋是二者合力+算法机制的涌现产物。

falsifiability: |
  【三条注册口径,一次性注册,不得事后调整】

  (a) 收入组内算法暴露-MPC主效应口径:
  同一可支配收入五分位组内,高算法推荐消费暴露组(算法推荐渠道消费占比≥30%)
  的MPC显著高于低暴露组(<10%)。统计量:在控制年龄/教育/家庭规模/地区固定
  效应后,算法暴露分组(高=1/低=0)的回归系数>0且p<0.05。若在任一组内效应
  不显著,该组的注意力-MPC通道未激活。若≥3/5个收入分位组不显著,(a)被证伪。

  (b) 交互效应(收入×算法暴露)口径:
  算法暴露的MPC效应随收入上升而收窄——低收入组的算法暴露-MPC差显著大于
  高收入组。统计量:算法暴露(连续变量)×收入分位(序数1-5,1=最低)的交互项
  系数<0且p<0.05(即收入越高,算法暴露的MPC效应越小)。若交互项不显著(即
  算法暴露的MPC效应在各收入组间无差异),(b)被证伪——此时算法暴露可能
  独立于注意力渠道影响MPC,注意力-MPC螺旋的核心焊接断裂。

  (c) 注意力中介口径:
  算法暴露→MPC的效应至少部分通过注意力池深度中介。统计量:以bootstrap
  percentile CI(Preacher & Hayes 2004)为中介效应主检验方法(95% CI不包含0
  即显著),Sobel检验作为敏感性分析——若Sobel与bootstrap不一致,以bootstrap
  结果为准。需满足:间接效应ab占总效应c的比例PM=ab/c ≥ 0.2(事前注册下界);
  若PM<0.2且bootstrap CI不包含0,则注意力通道存在但非主通道(机制解释力降级)。
  此外,中介效应规模在低收入组中更大是通过Hayes(2015)的index of moderated
  mediation检验(对收入分位与注意力的交互项做bootstrap 95% CI,CI不包含0即
  调节中介显著)。若注意力变量的中介效应不显著(即bootstrap CI包含0),
  注意力-MPC螺旋的机制核心被削弱——算法暴露可能通过其他非注意力渠道
  (如信息差/社交压力)影响MPC,推论退化为"算法暴露影响MPC但机制不明"。

  【(iii)螺旋跨期:预测(i)+(ii)的逻辑合成,非独立注册】
  预测(iii)"t期低注意力→t+1期高MPC→t+2期更低注意力"的跨期正反馈是
  预测(i)(ii)的动态延伸——若(i)(ii)的截面效应成立,跨期正反馈为其时序形态,
  可在面板中检验Granger因果(滞后注意力→当期MPC,控制当期注意力+滞后MPC,
  再检验滞后MPC→当期注意力)。若(i)(ii)不成立,跨期螺旋不触发。

falsification_trace:
  primary_suspect: |
    (a)(b)的因果链"注意力稀缺→更易被算法消费触发捕获→MPC升高"在每个环节
    都可能断裂:

    (1)【方向性】注意力稀缺可能导致消费增加(直觉式消费),也可能导致消费减少
    (决策瘫痪/保守退缩)。BR-L2-027本身不指定"判断力下降"的方向——判断力下降
    可能表现为"买了不该买的"(冲动消费→MPC↑),也可能表现为"该买的不买"+
    "不该买的也不买"(随机决策→MPC可能↑也可能↓),还可能表现为"什么都不买"
    (分析瘫痪→MPC↓)。本推论赌前者占主导(注意力稀缺→直觉式→易被触发捕获),
    但若经验上注意力稀缺更多地导致消费谨慎/决策瘫痪,方向性赌注失败。

    (2)【算法推荐的双刃性】算法推荐不只推送消费触发——它也可以推送省钱建议/
    理财教育/储蓄工具。若低收入者的注意力池虽浅,但接触到的算法推荐恰好以
    "性价比""省钱攻略""优惠券聚合"为主(拼多多模式),则算法暴露可能降低而非
    升高MPC。本推论赌算法推荐的商业激励机制整体偏向刺激消费(而非促进储蓄),
    但若特定平台的算法生态以省钱/团购/比价为主轴,在该平台上的效应可能反向。

    (3)【选择效应】低收入组中选择"仅用借记卡/现金"的人可能系统性不同于高频
    算法消费用户——前者可能更自律/更节俭/更年长/更农村(不依赖数字支付),
    其低MPC可能来自这些混淆变量而非去算法化本身。随机对照实验(RCT)可将
    此威胁降至最低,但观察性研究需通过工具变量/匹配/双重差分尽力排除选择效应。

    (4)【反向因果】低注意力→高MPC→低储蓄→财务紧张→更低注意力——这是
    本推论主张的方向。但反向同样成立:高MPC(由传统收入渠道驱动)→低储蓄→
    财务紧张→低注意力——这条反向路径是BR-L2-027的平凡推演,不需本推论。
    区分二者的关键是:在控制传统MPC决定因素(收入/流动性约束)后,注意力是否
    仍独立预测MPC增量。若注意力→MPC的方向不独立于传统渠道,推论塌缩为
    BR-L2-027+BR-L2-029的平凡并列(无组合增量)。
  secondary_suspect: |
    (c)注意力中介——注意力池深度的测量精度与注意力vs认知带宽的概念区分
    是薄弱环节。若"注意力池深度"的测量实质捕捉了"认知带宽"而非特定于
    消费决策的剩余注意力,(c)的显著性可能被夸大(因为认知带宽本来就与
    收入/贫困相关,中介效应可能有遗漏变量偏误)。更关键的是:注意力中介
    只是"机制通道证据"而非"机制排他性证据"——即使中介效应显著,也不能
    排除算法暴露通过其他平行渠道(社交比较/信息不对称/从众压力)影响MPC
    的可能性。推论的核心不依赖于(c)的中介效应的排他性,但若(c)完全不成立,
    注意力-MPC螺旋的"注意力"标签失去经验支撑。
  unlikely_suspect: |
    BR-L2-029的MPC收入梯度(多国多方法验证,含自然实验/面板/准实验)和
    BR-L2-027的注意力稀缺(认知科学+行为经济学多通道验证)本身不太可能
    被推翻——脆弱的是它们在本推论中的焊接方式(注意力→消费决策→MPC的
    方向特异性;算法推荐作为注意力捕获放大器的经验现实)和组合增量
    (交互效应+跨期螺旋)。
  note: |
    primary若被坐实(方向性反转——注意力稀缺使人更保守而非更冲动消费),
    推论的核心机制(注意力-MPC正反馈螺旋)塌缩。此时可考虑的退化版本:
    "注意力稀缺×MPC→消费决策不确定性增加(无论方向),但MPC的期望值不
    受注意力影响"——这条退化版本不再提供超越BR-L2-029的新预测。

excluded_outcomes:
  - outcome: "低收入者的总消费金额高于高收入者"
    description: "MPC是边际概念(增量比例),非平均消费水平。低收入者MPC高但总消费金额低——这一事实不证伪也不体面本推论。"
  - outcome: "金融教育/理财干预降低了低收入者的MPC(但未改变算法暴露)"
    description: "若通过金融教育提高了注意力分配效率(教人'先存后花'),即使未改变算法暴露水平,MPC下降也不证伪本推论——因为干预改变了注意力→决策的转化效率,而非注意力→消费的通道本身。"
  - outcome: "在无算法推荐环境中(如离线实体店),低收入者MPC仍高于同收入高收入者"
    description: "本推论追加算法作为放大器,不声称算法是注意力-MPC螺旋的唯一驱动——实体店的物理注意力捕获(收银台糖果/限时折扣/试用)是同构机制,规模更小但方向相同。若无算法时组内MPC差缩小但未消失,与本推论一致(算法是放大器,不是唯一发动机)。"
  - outcome: "算法推荐同时推送消费触发和储蓄工具,净效应模糊"
    description: |
      本推论预测算法商业激励整体偏向消费端(平台从交易抽成,储蓄工具不产生即时佣金),因此净效应方向为MPC上升。若某平台的算法生态以储蓄/省钱为差异化卖点(如Acorns/余额宝),该平台上的预测方向可能反转——这不构成全局证伪,但限制射程至"消费导向型算法平台"。

      【累积豁免上限】若≥50%的主流算法消费平台(按用户数/交易额排名的Top 10)的算法生态在独立评估中(评估标准:平台推荐流中消费触发vs储蓄/省钱触发的比例,与控制组随机feed比较)不偏向消费端,推论射程收窄至"仅消费导向型平台",但不造成全局塌缩。

anti_talisman_clause: |
  【防不可证伪护身符——禁止由结果反推前件】

  (1) 禁止由"MPC高"反推"注意力池浅"——注意力池深度必须由独立于MPC的
  测量通道(财务焦虑量表+认知任务表现+决策疲劳代理)测定,不得将高MPC者
  事后标记为"隐性高注意力稀缺组"。

  (2) 禁止由"组内算法暴露-MPC效应不显著"反推"该组的算法暴露测量低估了
  真暴露量"——算法暴露的操作性定义(推荐渠道消费占比≥30% vs <10%)已在
  见数据前一次性注册,不得事后调整阈值以"找回"显著性。

  (3) 禁止由"交互效应不显著"反推"高收入组也面临注意力稀缺只是形式不同"——
  交互效应是注意力-MPC螺旋的核心赌注。若交互效应不显著,接受(b)被证伪的
  可能性,不得将不存在的交互效应重新解释为"注意力稀缺在高收入组以其他方式
  表现"(如"富人忙于工作也是注意力稀缺")——这是因为BR-L2-027的注意力稀缺
  是普遍现象(人人注意力有限),但本推论赌的是"低收入者的生存决策税使注意力
  池额外变浅",若高收入组的算法暴露-MPC效应与低收入组无差异,则"生存决策税"
  的注意力梯度就不具经验内容,推论退化为"人人都会被算法推荐影响消费"的平凡
  陈述。

  (4) 禁止用"该组的消费是理性必需品补充(如买了必需家电)"消解高MPC组的高
  算法暴露-MPC——若事后将高MPC归为"必需品消费"而将低MPC归为"理性储蓄",
  无法独立检验。必需品vs奢侈品的分类必须事前锁定(按国家统计局的消费分类
  标准,在见任何消费数据前锁定),不得在结果出现后重新编码。

  (5)【对称保护】禁止由"低收入组去算法化后MPC未下降"反推"该组使用的现金/
  借记卡也被算法间接影响了(如银行App推送优惠)"——低暴露组的操作定义为
  算法推荐渠道消费占比<10%,已在见数据前锁定。若低暴露组MPC未被压低,首先
  接受(a)被证伪的可能性,不得通过扩大"算法暴露"的定义范围来找回效应。

  【削弱条件】若仅(a)成立而(b)不成立(组内有差异但交互不显著),推论降级为
  "算法暴露对所有收入组同等影响MPC",注意力-MPC螺旋不成立(算法可能通过
  其他渠道统一影响MPC)。若(a)(b)成立但(c)不成立(注意力中介路径不通),
  推论保留预测能力但丢失机制解释力(知道"算法→MPC",不知道"为什么")。

nontriviality_test: |
  2×2判据表(自变量档:算法推荐消费暴露度高vs低 × 被预测量档:MPC相对
  于同收入组预测值的方向 高于预测vs不高于预测):

  格(高暴露,MPC高于同收入组预测)——「非平凡格」——没有任何承重砖平凡地
  强制它:BR-L2-029只预测收入间MPC差异(穷人>富人),不做组内预测——组内
  算法暴露效应不是BR-L2-029的逻辑蕴涵;BR-L2-027只预测注意力稀缺→判断力
  下降,但不指定判断力下降的具体方向(冲动消费?决策瘫痪?随机选择?)——"判断力
  下降=消费增加"不是BR-L2-027的逻辑蕴涵,而是本推论的方向性赌注。该格可被
  现实反例推翻——若高算法暴露组的MPC并不系统性高于同收入低暴露组,该格被
  填上,推论塌缩。

  格(高暴露,MPC不高于同收入组预测)——若被填充,(a)被证伪。可能填充方式:
  (i)注意力稀缺使消费者更谨慎(分析瘫痪>冲动消费);(ii)算法推荐同时推送省钱
  工具,净效应模糊;(iii)算法暴露的主要效应是"替代搜索"(帮助找到更便宜的同款),
  实际降低了消费金额。

  格(低暴露,MPC高于同收入组预测)——传统收入/流动性约束解释可覆盖此格,
  不构成证伪:低暴露不等于低MPC,因为BR-L2-029的传统渠道(补窟窿/被压抑
  需求/流动性约束)仍独立运作。此格被填充意味着"注意力-MPC通道不是唯一的
  组内差异来源"——与本推论自洽(本推论追加第三条通道,不声称它是唯一通道)。

  格(低暴露,MPC不高于同收入组预测)——「基准格」——无算法放大+传统渠道
  的MPC效应被控制在收入组均值附近,与两砖的逻辑底线一致。

  brick=conclusion自查:'注意力稀缺×MPC收入梯度→算法暴露的MPC效应在低收入组
  中更大→注意力-MPC放大螺旋'未在任何承重砖中原文或近义出现。BR-L2-029不含
  "注意力"/"算法"/"组内变差";BR-L2-027不含"MPC"/"消费"/"算法"/"收入梯度";
  两砖的简单并列也不产生螺旋——螺旋需要额外的"注意力→消费→财务紧张→注意力"
  焊接,这个焊接不存在于任何单一砖中。

real_world_anchors:
  supporting:
    - anchor: "稀缺心态:贫困消耗认知带宽(Mullainathan & Shafir 2013, Science)"
      evidence: |
        印度甘蔗农在收获前(贫困期)的Raven矩阵正确率比收获后(富足期)低约1
        个标准差(相当于IQ下降约13分);同一农民的认知表现在两个时点间的差异
        远大于不同收入群体间的截面差异。实验排除营养/工作强度/焦虑情绪等
        替代解释——贫困本身(即资源稀缺感)大量占用认知资源。诚实标注:此锚
        承重"低收入→注意力池消耗"的机制真实性,但未涉及消费决策具体方向
        (认知带宽下降后,是花更多还是花更少?),也未涉及算法推荐放大作用。
      confidence: strong
    - anchor: "直播电商冲动消费的人口分布(中国互联网信息中心CNNIC + 各平台年报)"
      evidence: |
        中国直播电商用户层级分布:三四线城市及以下用户的直播购物频次显著高于
        一二线城市(QuestMobile 2023/2024);快手电商的复购率在低线城市更高;
        拼多多的"社交裂变+算法推荐"模型在低收入群体中的渗透率和转化率均
        高于其他平台(2023年GMV增速农村>城市)。算法推荐+低价触发+限时折扣
        的组合对低收入用户形成精准的消费触发链。诚实标注:此为观察性分布,
        非因果证据——低收入群体也可能因"更低的可选娱乐方式"而更多刷直播,
        而非注意力稀缺直接驱动。此锚承重"算法消费触发与收入等级的相关性"
        的事实基础,不承重因果方向。
      confidence: moderate
    - anchor: "收银台糖果效应——物理世界的注意力捕获"
      evidence: |
        把糖果/小商品放在收银台排队区(注意力空闲窗口)→冲动购买率上升;
        超市的"端架展示"(end-cap display)+限时折扣→将注意力捕获转换为
        消费者支出(Iyengar & Lepper 2000; Inman et al. 2009)。数字算法
        是将此物理机制7×24化+个性化:物理收银台只能对所有人放同样的糖果,
        算法收银台因人而异推送不同的"糖果"(对A推零食/对B推护肤品/对C推
        游戏充值)。诚实标注:此锚承重"注意力捕获→消费决策"的方向性赌注
        (注意力薄弱→更多消费,而非更少),是预测(i)方向性的关键经验支撑。
        但不涉及MPC收入梯度(BR-L2-029)——收银台效应在所有收入群体中均存在。
      confidence: moderate
  counterexamples:
    - anchor: "价格敏感性vs冲动消费:低收入者可能更谨慎而非更冲动"
      evidence: |
        部分消费者行为研究(Nelson 1970; Attanasio et al. 2008)表明低收入
        消费者在特定品类(食品/日用品)上的价格搜索行为更高——花更多时间
        比价/找优惠券。若低收入者的注意力虽稀缺但被导向"省钱搜索"而非
        "冲动消费",则注意力稀缺可能降低而非升高MPC(更精打细算→同样的收入
        买到更多东西→MPC定义上未变但实际消费效率提升)。诚实标注:此为
        方向性反例,尚不构成净杀——"省钱搜索"本身也消耗注意力,可能在低价
        消费上产生"虚假的省钱感"→反而增加总消费(因为觉得"赚到了")。
      confidence: weak
  boundary_cases:
    - case: "强制性储蓄制度(如中国住房公积金/新加坡CPF)是否打断螺旋?"
      analysis: |
        强制性储蓄(工资扣除型/政策强制型)从收入端而非注意力端打断螺旋——
        钱在被花掉之前已被强制划入储蓄账户。若强制储蓄制度降低了低收入
        组的可支配收入但实际上提高了净储蓄(总储蓄=自愿储蓄+强制储蓄),
        这是传统收入渠道的作用(可支配收入下降→MPC不变但消费绝对额下降),
        非注意力-MPC螺旋的证伪。但若强制储蓄后,注意力稀缺的低收入者仍
        将全部剩余可支配收入花光(MPC=1),且剩余支出的算法暴露占比更高,
        则注意力-MPC螺旋在剩余可支配收入上继续运作——强制储蓄只是将螺旋
        从"总收入→消费"压缩到"剩余收入→消费"。此为边界:本推论预测在
        强制储蓄环境下,注意力稀缺者的剩余收入MPC仍高于同收入非稀缺者,
        除非强制储蓄伴随了注意力干预(如自动储蓄的默认选项设计减少决策负荷)。
      status: boundary_case

discriminant_validity: |
  【独有可证伪预测】相对相邻理论逐一判别——

  (1) vs BR-L2-029的传统MPC理论(永久收入假说/流动性约束/预防性储蓄):
  BR-L2-029本身预测"收入越低→MPC越高"(主效应)。本推论追加:(a)同一
  收入组内,算法暴露→MPC分化(组内差异);(b)该分化在低收入组更大(交互
  效应)。传统理论不做组内算法暴露预测,也不做交互预测。可判别:若控制
  收入/财富/流动性约束后,算法暴露对MPC无增量解释力,传统理论足够——
  本推论被证伪。

  (2) vs "稀缺心态/认知带宽"(Mullainathan & Shafir):
  稀缺心态理论预测"贫困→认知带宽下降→决策质量下降(通用)"。本推论将其
  精确焊接至MPC这个单一决策结果,追加了"算法推荐作为放大器"和"螺旋正反馈"
  两个稀缺心态理论未包含的机制。可判别:给两组同认知带宽的人不同算法暴露,
  本推论预测MPC分化——稀缺心态理论不做此预测。若注意力稀缺→多种决策质量
  均下降(不只消费),稀缺心态理论成立但本推论仍可能成立(因它说了更多);若
  注意力稀缺→消费决策质量不变甚至提高,本推论被证伪。

  (3) vs "冲动消费心理学"(Rook 1987 / Baumeister 自我损耗):
  冲动消费心理学将冲动消费定位为个体特质×情境的交互(自我控制资源耗尽→
  冲动购买)。本推论将冲动消费重新定位为结构性产物:不是"某些人自控力差",
  而是"注意力池因贫困而被生存决策系统性消耗→所有人都更易冲动消费"。
  可判别:若冲动消费的个体差异(自控力人格量表)能完全解释算法暴露-MPC
  效应(即控制自控力后效应消失),本推论降级为冲动消费心理学的延伸;
  若个体自控力不能完全解释(即相同自控力下,注意力池深度仍独立预测算法
  暴露效应),本推论提供了超越个体差异的结构性解释。

  (4) vs "数字鸿沟/数字素养"理论:
  数字素养理论预测"低收入者更不会用算法工具→算法暴露更少→算法效应
  更弱"。但本推论预测相反方向:低收入者可能算法暴露更多(因为其他娱乐/
  社交替代更少),且同样的算法暴露对低收入者的消费效应更强(因为注意力
  池更浅→防御力更低)。若数字素养方向占主导(低收入→少用算法→MPC更低),
  本推论被削弱;若注意力方向占主导(低收入→多用算法且更易受影响→MPC更高),
  本推论成立且与数字素养理论构成清晰对抗——这是最干净的判别线。

  【防平凡化守卫】若有人说"穷人在直播上花钱多是因为穷,早就是常识",非平凡
  增量在:(i)"穷"不是单维的收入低——本推论分离出"注意力池深度"作为独立于
  收入水平的第二通道,并给出可操作的测量方法;(ii)"因为穷"不给出方向——
  穷可以导致更节俭(传统直觉)或更冲动(本推论),本推论赌了方向;(iii)交互
  效应(收入组内算法暴露差异在低收入组更大)是带计量口径的精确赌注,不是
  "穷人多花钱"的模糊常识;(iv)螺旋正反馈(注意力→MPC→注意力)是动态赌注,
  不是静态快照。

