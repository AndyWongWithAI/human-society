id: DED-055
type: deduction
layer: L3-deductions
status: candidate
term: "现时偏向×法币记忆滞后：前瞻指引效力的双重折扣 (Present Bias × Fiat Memory Lag: The Double Discount on Forward Guidance Effectiveness)"

人话摘要: "央行说'两年后通胀会降到2%',但老百姓听了并不会当真去买两年后的国债锁定收益——因为人天生就觉得'两年后的事太远了,先顾眼前'(现时偏向)。而且更关键的是:老百姓对'钱值不值钱'的感觉,不是听央行说了什么,而是看自己这一年买菜花了多少钱——过去5%的通胀记忆还粘在脑子里,你说2%也没用(记忆滞后)。所以央行信用的本质不是'宣布了多好的目标',而是'让人们经历了多久的低通胀'——货币政策的信用积累有一条不可绕过的时间护城河。"

statement: |
  【核心】央行前瞻指引(forward guidance)的效力被两种行为偏误双重削弱——现时偏向(BR-L2-030)使公众对远期通胀承诺赋予过低的决策权重(双曲贴现压低远期信息的现值),记忆滞后(BR-L2-024)使公众的通胀预期锚定于已发生的历史通胀而非央行宣布的未来目标。央行信用的本质不是'宣布了什么'而是'让人们经历了什么'——货币政策传导存在不可压缩的体验时滞,仅靠言辞无法跨越。

  【驱动量】(i)前瞻指引的时间距离(宣布目标实现的未来时点与现在之间的间隔年数)——激活双曲贴现,时间距离越长折扣越大;(ii)公众已体验到的低通胀历史时长(实际通胀连续低于目标的累计年数)——记忆滞后使预期仅随体验逐渐更新;(iii)央行宣布通胀目标制的年数——作为对照量,若宣布年数比体验年数更能解释预期收敛,本推论被证伪。

  【预测】(i)通胀预期向目标收敛的速度与该国'实际通胀低于目标的历史时长'(公众已体验到的低通胀年数)正相关——体验越久,预期越接近目标;(ii)该收敛速度与'央行宣布通胀目标制的年数'不显著相关(在控制体验年数后)——言辞独立于体验时不产生额外收敛力;(iii)前瞻指引对远期(>2年)通胀预期的影响力随指引的时间距离递减——同一央行发布的1年期通胀预测对预期的锚定效果显著强于3年期预测,该差距由双曲贴现(非理性贴现)预测,且不能被'远期本来就不确定'的理性噪声假说完全吸收(贴现因子衰减速度超过时间距离的线性比例)。

  【判别】vs 理性预期下的前瞻指引理论(Woodford/Eggertsson)——理性预期假设公众完全按央行宣布的路径更新预期,前瞻指引的效力仅受央行承诺的可信度(未来是否会反悔)限制,不受公众的认知偏误限制。本推论否认这一点:即使央行完全可信(绝不会反悔),前瞻指引的效力仍被公众的现时偏向和记忆滞后双重打折——这不是央行可信度的问题,是公众认知结构的问题。vs '央行信誉=制度质量'的常识——制度质量(独立性/透明度/通胀历史记录)确实影响信誉,但本推论在制度质量之外独立锁定了体验时长这一不可压缩的时间维度:两个制度质量相同的央行,一个已让人们经历了10年低通胀、另一个只经历了2年,前者的前瞻指引效力必然强于后者——制度可设计,时间不可压缩。

operationalization:
  通胀预期收敛速度:
    definition: "公众通胀预期向央行目标收敛的速率——操作化为预期值与目标值之差随时间的缩小速度"
    measurement: |
      使用专业预测者调查(如ECB SPF/US SPF/Consensus Economics)或市场隐含通胀(通胀互换/盈亏平衡通胀率)的月度/季度序列。
      收敛速度 β = |E_t[π_{t+h}] - π*| 对时间 t 的回归系数(取绝对值后的半衰期):β越大(半衰期越短)=收敛越快。
      h=2年(中期预期)为主体检验窗口;h=1年与h=5年为稳健性窗口。
      预期数据来源须与通胀目标宣布独立——同一调查工具贯穿始末,不因'宣布了目标'而切换调查机构。
    limitations: "专业预测者不代表'公众'——他们是金融从业者,可能比普通公众更快纳入央行信息。普通公众的预期数据(如密歇根大学消费者调查的通胀预期问题)可获但噪声更大。市场隐含通胀混入风险溢价(通胀风险溢价/流动性溢价),需以调查数据为主体、市场数据为交叉验证。"

  低通胀体验年数:
    definition: "公众实际经历的通胀持续低于(或等于)央行目标的累计年数——'体验'而非'宣布'"
    measurement: |
      自该国通货膨胀目标制正式宣布之年起,逐年判定:若该年实际CPI通胀率(年末同比)与央行目标值之差的绝对值 ≤ 0.5个百分点(即 target−0.5pp ≤ CPI ≤ target+0.5pp),则该年计为'低通胀体验年'。
      累计体验年数 = 宣布目标制后满足上述条件的年份总数。
      阈值(+0.5pp)一次性注册——若事后发现+0.3pp产生更强的相关性,仅可报告为稳健性检验,主口径不变。
      实际通胀数据来源:IMF IFS/各国统计局CPI序列,与央行宣布数据独立取得(IMF直接从各国统计机构获取或自行估算,非引用央行新闻稿)。
    limitations: "CPI通胀与公众感知通胀可能不同——公众对高频购买(食品/能源)价格更敏感。以核心CPI(剔除食品能源)作为稳健性检验,主口径仍用标题CPI。'体验'的操作化假设公众感知的通胀≈实际CPI,但若公众系统性高估通胀(如欧元引入后德国'感知通胀'远超实际CPI),则体验年数的编码低估了'记忆中的高通胀'——此偏差不利于本推论(预期收敛应更慢),故为保守偏差。"

  通胀目标制宣布年数:
    definition: "自该国央行正式宣布采用通胀目标制(或正式公布量化通胀目标)至今的年数——纯'言辞'维度,独立于实际通胀结果"
    measurement: |
      从央行官方声明/政策文件/法律生效日期起算:以最早的公开宣布日期为t0。
      若目标值中途修订(如从2%调至1.5%),宣布年数连续计算不中断——只计'有目标'的时长,不因目标值调整而重置。
      对照逻辑:若宣布年数在控制体验年数后仍对预期收敛有显著贡献,则(ii)被证伪。
    limitations: "部分央行在正式宣布通胀目标制之前已有隐性目标(如美联储在2012年正式宣布2%目标前已事实锚定低通胀)——以正式宣布日为准,隐性期不计数。若发现正式宣布日前预期已收敛,只能说明体验年数在此前已起作用(CPI在Volcker后持续下降),不证伪本推论。"

  前瞻指引时间距离:
    definition: "央行发布的前瞻指引中指明的未来时点与当前时点之间的年数——纯时间距离,独立于指引内容"
    measurement: |
      从央行政策声明/会议纪要/通胀报告中提取前瞻指引的日期型语句(如'预计通胀将在20XX年回到2%'),计算指引发布日到目标日期之间的年数。
      短距指引=1年内,中距指引=1-2年,远距指引=>2年。
      对同一央行同一时期的1年期通胀预测误差(=实际通胀-预测值)与3年期预测误差做配对检验:若双曲贴现成立,3年期预测的公众锚定效果(预期向预测值的收敛度)应显著弱于1年期——且差距超过纯理性噪声模型预测的'远期方差更大'。
    limitations: "央行前瞻指引的措辞常常是模糊的('中期内''在预测期末')而非精确的日期——需对措辞做定量编码(如'中期'=2-3年,'预测期末'=基于该央行报告的预测期限)。模糊措辞的编码引入判断误差,同一套编码规则一次性注册后冻结。"

derivation:
  from_l1:
    axioms: [AXIOM-001, AXIOM-002]
    theorems: [THEOREM-value-attribution]
  from_l2:
    bridging: [BR-L2-024, BR-L2-030]
  steps: |
    1. "BR-L2-030:现时偏向使远期信息在今天的决策中权重极低"
       BR-L2-030确立双曲贴现:人对近期的权重畸高、远期被系统性低估,
       且这种低估不是理性计算(指数贴现)而是时间不一致的偏好结构。
       当央行说'2年后通胀将是2%',这句话传达的信息是关于t+2时点的状态——
       但这个信息在t时的决策权重因双曲贴现而被压低:
       公众今天是否要求加薪、是否调整储蓄配置、是否改变消费计划,
       都更多地由'现在通胀是多少'决定,而非'2年后通胀会是多少'。
       此步产出:前瞻指引的信息本身具有低现值——不是信息不可信,是远期信息
       在双曲贴现下天然被低估。

    2. "BR-L2-024:记忆滞后使预期锚定于历史通胀而非政策目标"
       BR-L2-024确立法币信用的连续可逆性与记忆滞后:人们对通胀的感知和记忆
       '消退得比实际通胀下降的速度更慢'——预期牢牢锚定在已发生的历史通胀上。
       即使央行宣布了新的通胀目标,公众的预期更新并非以政策文本为锚,
       而是以自己经历过的实际通胀为锚——要等到实际通胀确实降到目标水平
       并且持续足够久,记忆才逐渐被新数据覆盖。
       这解释了为什么通胀目标制国家在宣布目标初期,预期并没有立刻跳到目标值:
       记忆中的5%通胀比纸上的2%目标更'真实'——不是公众不理性,是记忆更新
       存在结构性的滞后。
       此步产出:通胀预期的锚是体验(历史实际通胀),不是言辞(央行宣布的目标)。

    3. "两砖合力:前瞻指引面临双重折扣 + 不可压缩的体验时滞"
       步骤1和2描述的是两个同时运作的独立机制:
       (a)现时偏向压低远期信息的决策权重——央行说'未来会怎样',
       但'未来'在公众的认知估值中被打了折;
       (b)记忆滞后使预期锚定在历史体验上——公众对'钱值不值钱'的判断
       来自过去实际经历的通胀,而非央行宣布的未来数字。
       两砖首尾相衔:(a)说'央行的远期承诺被低估了'——即使这个承诺是完全
       可信的;(b)说'公众用来替代低估承诺的参照物——通胀预期——被历史体验
       牢牢锁定,不会因为一纸公告而跳变'。
       合力产生的核心命题:央行不能仅靠'说'(前瞻指引)来管理预期——
       必须靠'做'(实际把通胀降到目标)并且做得足够久——货币政策的信用积累
       存在一条不可绕过的时间壁垒。体验是慢变量,言辞是快变量,但公众的
       预期只跟慢变量走。

    4. "招牌预测:体验年数 vs 宣布年数"
       步骤3的直接推论——若体验是预期更新的真正驱动量、宣布(言辞)被
       现时偏向双重打折,则:
       (i)通胀预期向目标收敛的速度应与该国实际低通胀体验年数正相关;
       (ii)在控制体验年数后,宣布年数不应有独立显著贡献;
       (iii)前瞻指引中远距离预测的锚定效果应弱于近距离预测,且衰减超过
       理性噪声假设的预测。
       (i)和(ii)是本推论最干净的招牌预测——因为'体验'和'宣布'是两条独立
       可测的轴,将它们放在同一个回归里直接检验哪条轴驱动预期收敛。

    5. "非平凡性(逐格判空)"
       2×2判据表见nontriviality_test。承重砖边际贡献诚实点名:
       BR-L2-030(现时偏向)——是对跨期偏好的通用行为刻画,原文不含'央行'
       '前瞻指引''通胀预期'。它单独不能预测'前瞻指引效力随指引时间距离递减'
       ——因为现时偏向是通用贴现结构,没有说它会在宏观政策传导这一特定通道中
       产生可测足迹。
       BR-L2-024(记忆滞后)——是对法币信用更新方式的刻画,原文不含
       '前瞻指引''双曲贴现''央行沟通策略'。它单独不能预测'宣布年数
       对预期收敛的解释力弱于体验年数'——因为记忆滞后只说预期更新慢,
       没说'宣布'这条路径为何不加速更新。
       两砖合力的核心增量:'体验vs宣布'的独立可测对比+前瞻指引时间距离的
       双曲贴现衰减——两砖单打都只给出各自的一半方程,拼在一起才锁定
       '前瞻指引存在结构性效力天花板,天花板由体验时长而非制度设计决定'。

falsifiability: |
  【三条注册口径,分子/分母/测量口径见operationalization,一次性注册不得事后调整】

  (a) 体验驱动口径——在采用通胀目标制的国家样本中(≥20国,控制央行独立性/
  制度质量/金融发展水平/贸易开放度),通胀预期收敛速度(β,见operationalization)
  与低通胀体验年数的偏相关系数显著>0(p<0.05),且标准化效应量(β*SD_experience_years)
  的95%置信区间下限>0。若体验年数与收敛速度无显著正相关——预期收敛与'公众
  经历了多久低通胀'无关——则核心机制(a)被证伪、推论塌缩。

  (b) 宣布独立无效口径——在同一回归模型中,通胀目标制宣布年数在控制体验年数后
  的偏回归系数不显著(p>0.10),或显著但方向为负(宣布越久预期越偏离目标)。
  若宣布年数在控制体验年数后仍有显著正向独立贡献(p<0.05),则(b)被证伪——
  意味着言辞有独立于体验的锚定力,本推论的'双重折扣→宣布无效'被削弱。
  但诚实标注:即使(b)被局部证伪(宣布也有独立贡献),若体验年数的效应量
  显著大于宣布年数的效应量,(a)的核心仍存活——推论降格为'体验主导但宣布
  也有辅助作用'的弱版本。

  (c) 时间距离衰减口径——同一央行的1年期通胀预测的公众锚定效果(预期向预测值
  收敛程度)显著强于3年期预测(p<0.05,配对检验),且3年期vs1年期的锚定效果
  比值 < 1/3的年数比(即衰减超过线性比例——双曲贴现的独有签名)。
  若远期预测的锚定效果与近期预测的比值 ≈ 年数比倒数(即纯理性噪声:3年=1/3
  的1年锚定力),(c)被证伪——前瞻指引的时间距离效应可由理性噪声充分解释,
  双曲贴现的独特贡献不存在。

  适用区间:推论适用于已宣布量化通胀目标且该目标有≥5年公开历史的央行;
  不包括固定汇率制国家(固定汇率本身是另一种名义锚,通胀预期由汇率锚定而非
  央行通胀目标);不包括恶性通胀期(通胀>50%/年,预期形成机制可能切换到
  高频追踪模式,记忆滞后的时间尺度缩至数月而非数年)。

falsification_trace:
  primary_suspect: |
    BR-L2-024腿——记忆滞后作为预期锚定的核心机制。
    全推论最重的预测(b)'宣布年数在控制体验后不显著'完全压在这条腿上:
    预期之所以不跟随宣布走,是因为它们被历史体验锁住了(BR-L2-024的记忆滞后)。

    致命场景:若通胀目标宣布后,公众通胀预期在1-2年内即收敛至目标附近
    (无论该国之前是高通胀还是低通胀历史)——这意味着记忆可以被宣布迅速覆盖,
    BR-L2-024的记忆滞后在宏观政策传导通道上不成立。(a)和(b)同时塌缩。

    次致命场景:体验年数与宣布年数高度共线(多数宣布通胀目标制的国家同时
    经历了低通胀——好央行既宣布好目标又做出好结果)——两个变量在统计上
    无法分离,回归系数的置信区间宽到覆盖零和不覆盖零同时成立。此时(b)
    技术上不可检验,推论停留在'有道理但无法在现有样本中证伪'的弱状态。
    防御:扩大样本(包括宣布了目标但通胀未达标的案例——如部分新兴市场央行)、
    或使用工具变量法(利用外生供给冲击区分体验vs宣布)。

  secondary_suspect: |
    (c)腿的双曲贴现签名——7年期vs1年期锚定效果的衰减超过线性比例。
    挑战来自理性噪声假说的弹性:若远期预测本质上面临更大的基本面不确定性
    (供给冲击/油价/战争),公众对远期预测赋予更低权重可能是理性的贝叶斯行为
    而非双曲贴现——远期方差大→信息价值低→合理低权重。本推论以'衰减超过
    年数倒数'来区分双曲贴现与理性噪声,但这个区分阈值依赖'理性噪声下
    远期/近期锚定比=年数比倒数'的假设——若理性噪声的非线性结构比这个
    假设更复杂,双曲贴现的独有签名可能只是理性噪声的一个未被建模的角落。
  unlikely_suspect: |
    现时偏向(BR-L2-030)和记忆滞后(BR-L2-024)作为两条独立的经验规律
    均已verified(BR-L2-024 IEA≥1.2,BR-L2-030 IEA≥1.2),被独立推翻的概率低。
    脆弱的是两砖在本推论中的特定焊接方式——即'记忆滞后+现时偏向→宣布无效'
    的因果链条——而非两砖本身。
  note: "primary若被坐实(记忆可被宣布迅速覆盖),全推论塌缩为'央行宣布有效'
  的常识版本。secondary若被坐实(远期衰减可由理性噪声解释),仅(c)被削弱,
  (a)(b)的体验vs宣布对比仍独立存活——因为(a)(b)不依赖双曲贴现,
  只用记忆滞后一条腿即可成立。"

excluded_outcomes:
  - outcome: "央行在极端危机(金融海啸/主权违约/恶性通胀前夕)中的紧急前瞻指引效力"
    description: "极端状态下预期形成机制可能切换到高频追踪+恐慌模式,记忆滞后的时间尺度从数年缩至数周——这是不同的预期形成体制。推论射程限于正常宏观经济状态(通胀<10%/年,无主权违约/银行业系统性危机)。"
  - outcome: "央行通过非常规货币政策(量化宽松/收益率曲线控制/负利率)对预期的直接影响"
    description: "本推论讨论的是前瞻指引(言辞通道)的效力,不讨论央行通过资产购买/利率直接干预(行动通道)的效力。实际上,本推论的一个隐含推论是:行动通道之所以常常比言辞通道有效,正是因为行动制造了体验(压低实际利率→压低实际通胀→压低记忆中的通胀),而不仅仅是发出了信号。但这一隐含推论不在本文件射程内。"
  - outcome: "在从未宣布通胀目标制的国家中,通胀预期如何形成"
    description: "没有量化目标的对比缺乏'宣布年数'这一变量的操作化基础——不可检验(b)。对这些国家,本推论只做(a)的方向性预测(历史通胀水平→预期),属于BR-L2-024的直接应用,非本推论组合增量。"
  - outcome: "理性预期下前瞻指引的时间不一致问题(央行事后有动机背叛承诺)"
    description: "本推论承认时间不一致是一个独立的前瞻指引效力削弱因素(Woodford/Eggertsson已充分讨论),但独立于时间不一致论证了另一条削弱通道(公众认知偏误)。两者叠加使前瞻指引效力更低,但本推论不声称认知偏误通道替代时间不一致通道——两者并行。"

anti_talisman_clause: |
  【防不可证伪护身符——体验年数必须独立于预期收敛结果测量】

  (1) 禁止由'预期未收敛'反推'公众体验的低通胀年数不够'——
  低通胀体验年数以实际CPI同比与目标值的比较独立编码(IMF IFS/各国统计局数据),
  不得以预期是否收敛来事后裁定'公众是否真的体验了低通胀'。
  若实际CPI一直等于2%但预期就是不收敛,那正是对(b)的证伪——接受这个结果,
  不得追封'公众其实没感觉到低通胀'。

  (2) 禁止由'宣布年数贡献显著'反推'该央行宣布得特别好/沟通策略特别到位'——
  宣布年数是纯计数(自正式宣布日起的年数),不得在见结果后对某些央行的宣布
  '质量'做差异化编码以消除(b)的null result。若所有央行的宣布年数合起来
  不显著,接受(b)成立;若个别央行(如RBNZ)的宣布年数效应显著高于其他央行,
  可进行异质性分析(按沟通策略/透明度/独立性分群),但不得用分群结果替代
  全样本(b)的主检验——分群分析只可补充,不可替代。

  (3) 禁止由'远期预测锚定效果差'反推'该远期预测本身就不靠谱(基本面确实不确定)'——
  (c)的判据已将理性噪声预测作为零假设:如果远期不如近期只是因为理性噪声,
  则远期/近期锚定比应等于年数比倒数。只有当衰减超过这个比值时,
  才将超额部分归因于双曲贴现。若远期/近期比恰好≈年数比倒数,
  接受(c)被证伪——理性噪声已充分解释,双曲贴现无独有贡献。

  (4) 【对称保护】禁止由'预期收敛快'反推'该国央行宣布通胀目标特别早'作为
  (a)的正面证据却拒绝将它作为(b)的负面证据——同一个'宣布年份早'的事实,
  不能选择性解释为:当它和预期收敛正相关时=支持(体验年数长所以收敛),
  当它和预期收敛不显著时=宣布年数测量有问题需要调整。宣布年数的编码
  规则(正式宣布日起算)一次性注册,编码后冻结——变更规则只可在新检验中
  使用新口径,不得覆盖已有结果。

nontriviality_test: |
  逐格判空——2×2判据表:体验年数(长/短) × 宣布年数(长/短) → 预期收敛速度(快/慢)

  体验\宣布  | 宣布年数长(早宣布)          | 宣布年数短(晚宣布)
  体验年数长  | 预期收敛快★(体验+宣布都长)  | 预期收敛快★(体验长,宣布短)
  体验年数短  | 预期收敛慢(体验短,宣布长)    | 预期收敛最慢(体验短,宣布短)

  标★的格——'体验长→收敛快,无论宣布长短'——是本推论的非平凡核心。
  关键判据:若表中第一列(宣布长+体验短)的收敛速度显著快于第二列(宣布短+体验长),
  即宣布年数比体验年数更能解释收敛差异,则(i)(ii)被证伪——
  这意味着宣布(言辞)比体验(经历)更重要。

  非平凡性分析:
  BR-L2-024单独——只说记忆滞后使预期更新慢,并不区分'慢是因为体验不够'
  还是'慢是因为宣布无效'。它不预测'体验vs宣布'的对比——没人把体验和宣布
  同时放进一个框架里做竞争性检验,这块是BR-L2-024自带的锚。记忆滞后并未
  天然给出'宣布无效'的结论——记忆滞后说的是体验主导更新,但宣布本身可能
  通过信号效应(信号→人们预期央行做事→央行真做事→体验改变)间接加速更新。
  BR-L2-024对这条间接通道是沉默的。

  BR-L2-030单独——只说远期信息被低估,不涉及通胀预期锚定的具体机制,
  更不预测'宣布年数'这一变量在通胀预期回归中的系数。

  两砖合力的非平凡内核:将'宣布'定位为纯言辞通道(被现时偏向双重打折:
  宣布的远期内容被低估+宣布无法覆盖记忆锚),将'体验'定位为仅凭单砖
  (BR-L2-024)即可预测的预期驱动通道,从而构造出'体验vs宣布的竞争性检验'——
  这个检验的设计本身('宣布无独立贡献'的可证伪赌注)不在任何单一砖中,
  也不在现有宏观经济学文献中(现有文献讨论前瞻指引效力时,几乎从未将
  体验年数和宣布年数放进同一个回归里竞争——它们通常被当作共线的)。

  brick=conclusion自查:'央行前瞻指引的效力被现时偏向和记忆滞后双重打折,
  央行信用的本质是让人们经历了多久低通胀而非宣布了多久通胀目标'——
  不在BR-L2-024或BR-L2-030原文或近义中。BR-L2-024不含'前瞻指引''
  央行沟通''通胀目标制宣布',BR-L2-030不含'通胀预期''货币政策''体验vs宣布'。
  两砖合力产出的'体验年数vs宣布年数的竞争性检验+前瞻指引时间距离的双曲贴现签名'
  是真组合增量。

real_world_anchors:
  supporting:
    - anchor: "日本——宣布了目标但预期不收敛的长时间序列(体验不足)"
      evidence: |
        日本银行于2013年1月正式宣布2%通胀目标(与政府联合声明)。
        在此之前,日本经历了约15年的持续低通胀/通缩(1998-2012),
        公众的通胀预期深植于'物价不怎么涨'的记忆中。
        宣布目标后:尽管BOJ实施了空前规模的量化和质化宽松(QQE),
        日本的实际CPI在2014年因消费税上调短暂触及2%后迅速回落,
        此后多年在0-1%区间徘徊——公众始终没有'体验'到持续的2%通胀。
        结果是:日本的专业预测者与市场隐含通胀预期(BEI)至今仍远低于2%
        (如2024-2025年市场隐含的10年期BEI约1.0-1.5%)。
        体验年数≈0(宣布目标后几乎无年满足'实际通胀≥2%'),
        宣布年数=12+(2013-2024+),预期不收敛——与(a)(b)预测一致。
        诚实标注:日本案例的'体验年数短+宣布年数长→预期不收敛'是单一案例,
        没有控制变量(如日本的制度质量/人口结构/长期低增长预期等),
        不能单独坐实(a)(b)——需跨国对比。
      confidence: moderate
    - anchor: "新西兰RBNZ——率先实行通胀目标制且有长时间低通胀体验=预期收敛的正面案例"
      evidence: |
        新西兰储备银行于1990年率先在全球正式采用通胀目标制(0-2%目标),
        并在整个1990年代通过严格的货币政策将实际CPI从1980年代的两位数
        水平持续压低至目标区间内。新西兰公众经历了约10年的持续低通胀
        (1990s)后,通胀预期在2000年代稳定地锚定在2%附近——
        RBNZ的调查显示,企业经理人与家庭的中期通胀预期与目标值高度一致。
        关键:新西兰的体验年数(≈10年)与宣布年数(≈10年)在前10年高度共线,
        但之后的分叉更说明问题——如果宣布年数是驱动量,预期应在1990年宣布时
        跳变;实际上预期是随体验逐步收敛的(1990-2000年渐进式下降)。
        诚实标注:锚定效果同样被制度质量/央行独立性/财政纪律等其他因素混杂;
        历史数据精度有限(1990年代初的调查数据不连续)。
      confidence: moderate
    - anchor: "新兴市场通胀目标制：宣布后预期未立即收敛的跨案例模式"
      evidence: |
        多个新兴市场国家在2000年前后宣布采用通胀目标制(如巴西1999/智利1999/
        南非2000/墨西哥2001/印尼2005等),其中许多国家在宣布目标前经历了
        高通胀或超高通胀历史(巴西1990s初四位数通胀、墨西哥1994-95比索危机等)。
        宣布通胀目标制后,这些国家的通胀预期并未立即跳到目标值——
        而是随实际通胀下降逐步收敛,收敛过程通常需要5-10年(Hammond 2012
        的IMF综述;Brito & Bystedt 2010的跨国面板)。这正是本推论预测的模式:
        高通胀记忆(BR-L2-024)使预期锚定在历史高位,即使宣布了低通胀目标,
        也要等实际通胀降下来并保持足够久,预期才逐渐跟进。
        诚实标注:这些国家在宣布目标制的同时也进行了实质性的货币政策改革
        (央行独立/财政纪律)——体验年数的效应与制度改革的效应未完全分离。
        但制度质量(独立央行/透明度)是一个可加控制变量的截面差异,
        体验年数是一个时间序列差异——两者的变异来源不同,可统计分离。
      confidence: weak
  counterexamples:
    - candidate: "瑞典1993-1995——宣布通胀目标制后,在高通胀记忆背景下预期快速收敛"
      analysis: |
        瑞典于1993年1月宣布2%通胀目标(CPI口径),此时瑞典刚经历
        1990-91年金融危机,CPI通胀在1990-91年达8-10%,贬值预期强烈——
        即公众记忆中仍有高通胀。然而瑞典通胀预期(如调查数据和债券收益率)
        在1994-95年间即显著下降,部分口径显示预期在3-4年内接近2%目标。
        若('体验年数短'+'宣布年数短'而预期已收敛),则对(a)构成潜在反例——
        因为收敛速度似乎快于'体验不足→预期不收敛'的预测。
        初步消化:(1)瑞典1990s初的经济政策套餐不仅包含通胀目标宣布,
        还包括财政紧缩/养老金改革/浮动汇率制度/央行独立性立法——
        这些改革可能通过信号渠道(高公信力制度套餐)直接拉低了预期,
        绕过体验通道;(2)克朗在1992年11月被迫脱离ERM并大幅贬值后,
        此后克朗持续走强——汇率稳定(另一个名义锚)可能独立于通胀目标
        提供了预期锚定力;(3)瑞典的'预期下降'是否真的是'收敛到2%'——
        部分口径显示预期降至2-3%区间,但未精确到2%——若预期只是降了
        但未准确锚定在目标值上,则只是通胀降了(体验改善),而非证明
        宣布独立于体验有效。
      status: needs_digestion
  boundary_cases:
    - case: "欧央行ECB——'低于但接近2%'的非量化目标时期(1999-2003)"
      analysis: |
        ECB在1999年启动时宣布其通胀目标为'below but close to 2%'——
        这不是一个精确的量化点目标,而是一个模糊区间(既是数字又留有模糊性)。
        此间欧元区通胀预期在约1.5-2.0%附近保持了相对稳定,
        但这可能部分因为:(1)欧元区各国在1990s已通过马斯特里赫特趋同标准
        (通胀须接近最低三国均值)事实上经历了数年的低通胀体验——体验在宣布前
        已部分积累;(2)德国央行(Bundesbank)的隐性通胀目标提供了锚定力的延续。
        此案例对本推论是'温和支持'(体验在宣布前已积累,预期稳定=符合预测)
        但无法作为干净检验(目标格式不标准)。
      status: boundary_case
    - case: "固定汇率制国家(如香港联系汇率制/保加利亚货币局)——名义锚不是通胀目标"
      analysis: |
        这些经济体的通胀预期锚定于汇率而非央行的通胀目标宣布——
        属于不同的名义锚机制。按排除条件(excluded_outcomes),不在射程。
      status: excluded

discriminant_validity: |
  【独有可证伪预测】相对相邻理论逐一判别——

  (1) vs 理性预期下前瞻指引理论(Woodford 2005/Eggertsson & Woodford 2003):
  理性预期模型预测前瞻指引的效力等于央行承诺的可信度——只要央行可信
  (信誉好),宣布未来政策路径就能完全锚定预期。本推论直接否认这一点:
  即使央行完全可信(绝不会事后背叛),公众的认知结构(现时偏向+记忆滞后)
  仍给前瞻指引打双重折扣。可判别:(b)'宣布年数在控制体验年数后无独立贡献'——
  若理性预期成立,宣布年数应有显著独立贡献(宣布本身传递信息,公众理性处理);
  若本推论成立,宣布年数的独立贡献应不显著。这是理性预期vs本推论的
  直接对撞——有且仅有一方获胜。

  (2) vs 央行信誉/制度质量文献(Cukierman/Blinder/Clarida-Gali-Gertler):
  现有文献将通胀预期锚定力归因于央行制度特征(独立性/透明度/通胀厌恶记录)。
  本推论不否认制度质量的作用,但在此基础上独立锁定了体验时长——
  一个不可通过制度设计压缩的时间维度。可判别:两个制度质量评分相同的央行,
  体验年数不同→预期收敛速度应有差——若制度质量已完成解释、体验年数无增量,
  制度质量文献被坐实但本推论被证伪。反过来:若体验年数在控制制度质量后
  仍有独立显著贡献,本推论胜出。

  (3) vs 适应性预期/近理性模型(Evans & Honkapohja 2001的学习动态):
  适应性预期同样预测预期随实际通胀逐步调整——与(a)方向一致。
  但适应性预期不预测(b)(宣布无效)或(c)(双曲贴现的时间距离衰减)——
  因为适应性预期的学习速率是固定的(常数增益),不区分'体验'与'宣布'
  作为信息来源。本推论超越适应性预期之处——将信息分为两类
  (体验=高权重、言辞=低权重),并预测权重差异的源头(现时偏向+记忆滞后)。

  【防平凡化守卫】若有人说'央行说话不如做事管用——这不是常识吗',
  非平凡增量在三处:
  (i)'体验vs宣布'的竞争性回归是一个可执行的统计检验——
  不只是'说话不如做事'的模糊陈述,而是将一个变量(宣布年数)的系数
  预测为零的可证伪赌注;
  (ii)双重折扣的机制分解——现时偏向解释为什么远期承诺不被重视
  (双曲贴现的时间结构),记忆滞后解释为什么短期参照物(预期)
  不受宣布影响——两条独立的偏误通道各有其可测的独特签名
  ((c)的双曲贴现衰减 vs (a)(b)的体验vs宣布);
  (iii)体验时长作为不可压缩的政策约束——
  这不是'央行应该做好沟通'的操作建议,而是'即使沟通做到完美,
  信用积累仍需时间'的结构性论断——对通胀目标制的实施策略
  有不容忽视的含义。

