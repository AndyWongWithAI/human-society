id: DED-026
type: deduction
layer: L3-deductions
status: verified
term: "道德群体边界推论 (Moral Group Boundary Corollary)"

人话摘要: "对'自己人'和'外人'用两套道德不是双标——是第三方惩罚机制天然绑在群体边界上：你在一个合作系统里的利益占比决定了你愿花多大力气维护它的规矩，而利益占比在群体边界处陡降。但边界不是铁板——通信技术、共同敌人、共享灾难都能把边界往外推。"

statement: |
  【核心】道德规范的第三方惩罚(TP)执行强度不是随社会距离平滑衰减的连续函数——
  它在群体边界处出现结构性陡降(阶梯效应)，因为旁观者在合作结构中的利益占比
  随群体成员身份而非社会距离发生阶跃。群体边界是TP强度的"相变面"而非"渐变带"。

  【驱动量】群体边界(可事前测：共享身份的符号/仪式/叙事标记)调节旁观者感知到的
  利益占比——跨过边界后，同一违规行为触发的TP强度系统性低于边界内，幅度超过
  社会距离连续衰减所能解释。

  【预测】
  (i) 道德排斥萎缩：群外受害者触发更弱TP——保持违规类型和严重度不变，仅将受害者
  从内群体换为外群体，TP强度(愿付代价/惩罚金额)显著下降。此效应在"身份显著"条件下
  强于"身份不显著"条件，证明是边界效应而非一般社会距离效应。
  (ii) 道德圈扩展：群体边界可被人为外推——通信技术(使远方苦难"可见")和共享灾难/
  共同敌人(创造新的"我们")是两个独立渠道。边界外推后，对原外群体的TP强度上升，
  上升幅度追踪边界移动量。
  (iii) 旁观者效应的结构重解释：经典"旁观者越多、出手越少"不是心理上的责任扩散，
  而是利益占比感知的结构性稀释——人多时默认"他人更有利益关联"→自己利益占比
  感知下降→TP减弱。关键调节：受害者与自己共享群体身份时，稀释效应被显著削弱——
  因为"这群人里我跟他最亲"的结构直觉抵御了"别人会管"的默认假设。
  (iv) 道德帝国主义：A将道德标准强加于B = 道德圈扩展(预测ii) + 权力不对称。
  A先通过通信/共享叙事将B纳入"我们"的边界，再利用权力优势以B无法抵抗的方式
  执行A的规范——TP从"自发第三方执行"异化为"强加式执行"。这是道德圈扩展的暗面。

  【判别·防平凡化】
  与BR-L2-018(旁观者利益关联)判别：BR-L2-018给出TP强度与利益占比的连续正相关——
  它是一个"渐变"模型。本推论在BR-L2-018的渐变背景上叠了一个"阶跃"：群体边界处
  利益占比不是渐变而是陡降，因此TP不是平滑衰减而是结构性断裂。BR-L2-018本身不讨论
  "群体边界"——它只用"社会距离"描述连续梯度。本推论的增量在断言连续梯度中存在
  一个由群体身份标记的结构性断点。
  与DED-019(内群体扭曲公平感知)判别：DED-019讲"程序公平感知被群体身份扭曲"
  (认知层)，本推论讲"TP执行强度的边界绑定"(行为层)——不同被预测量。
  与Singer道德圈扩展论判别：Singer描述道德圈在历史上确实扩展了，但未给出
  扩展的结构机制。本推论给出两个具体渠道(通信技术+共享灾难)及其可证伪预测——
  边界移动幅度应追踪渠道强度的变化。

operationalization:
  群体边界:
    definition: "将人群分为'我们'和'他们'的共享身份标记——可基于血缘/语言/宗教/
    组织归属/任意符号标签(Tajfel范式)。关键：边界的测量须独立于TP强度，不得因
    'TP有差异'反推'此处必有群体边界'。"
    measurement: "事前群体认同问卷(社会认同量表/群体归属感评分)；最小群体范式中
    的随机标签分配；现实群体中的成员名册/自我报告。操纵：通过身份凸显操纵
    (identity salience prime)激活特定群体边界。"
    limitations: "个体同时属于多个群体(交叉身份)，需明确实验中哪一层身份被激活。
    现实群体身份含多重交叉，最小群体范式干净但生态效度有限。"

  TP强度:
    definition: "未直接受害的旁观者愿付个人代价惩罚违规者的程度——金额/概率/行为计数。"
    measurement: "第三方惩罚博弈(Fehr & Fischbacher 2004)：被试A旁观B对C的不公分配，
    A愿付自己收益罚B——金额即为TP强度；vignette问卷中的惩罚意愿Likert评分；
    田野中编码的第三方制裁行为(排斥/羞辱)计数。"
    limitations: "实验室TP可能被实验者监控感压低。田野TP需独立标定旁观者与受害方的
    利益关联程度(BR-L2-018)，不得因'惩罚弱'反推'利益占比低'。"

  边界外推渠道:
    definition: "使原外群体成员被重新编码为内群体(或准内群体)的机制——通信技术
    (使远方的苦难变得可见/可感)和共享灾难/共同敌人(创造新的'我们'身份)。"
    measurement: "通信技术：媒体覆盖率/信息可达性(独立于TP的通信基础设施指标)。
    共享灾难：事前独立编码的灾难影响范围与群体边界重叠度。"
    limitations: "渠道与TP变化的因果关系需时间序列或外生冲击设计来确立——
    截面相关不足以区分'渠道推动边界'与'边界已变后渠道跟进'。"

derivation:
  from_l1:
    axioms: [AXIOM-001]
    theorems: [THEOREM-moral-third-party-enforcement]
  from_l2:
    bridging: [BR-L2-006, BR-L2-014, BR-L2-018]
  steps: |
    1. "BR-L2-014 确立TP是道德规范的执行骨架——没有旁观者愿付代价惩罚违规，
       规范不会被视为道德规范。TP是道德规范从'纸上规矩'变成'活的规矩'的机制。"
       BR-L2-014 仅确立TP的存在性(跨文化普适)，不讨论TP强度的分布。

    2. "BR-L2-018 确立TP强度随旁观者在合作结构中的利益占比系统变化——
       TP不是恒定的开关，是可独立操纵的连续量。"
       BR-L2-018 用"社会距离"描述梯度——社会距离越近→利益占比越高→TP越强。
       但BR-L2-018本身不讨论"群体边界"这一结构性断点——它只给出连续梯度。

    3. "BR-L2-006确立：人对'自己人'的偏袒不仅体现在分配行为上(多给)，也体现在
       合作结构的边界上——合作结构(及其维护的规范)主要在群体内部共享，
       跨群体共享的合作结构系统性更弱。"
       BR-L2-006本身给的是分配偏斜和信任偏斜，不直接讨论TP强度。
       但BR-L2-006蕴含的关键结构事实是：合作结构(因而利益占比)在群体边界处
       出现结构性断裂——你在自己人的合作系统里有利益，在外人的系统里几乎没有。

    4. "合成——阶梯效应：TP强度∝利益占比(BR-L2-018)，利益占比在群体边界处结构性
       断裂(BR-L2-006→合作结构主要在内群体内共享)，因此TP强度在群体边界处
       出现结构性陡降——不是渐变，是阶跃。"
       这就是预测(i)的底层逻辑。非平凡性：BR-L2-018只给梯度，不给断点；
       BR-L2-006只给偏袒，不给TP的边界绑定。合成才给出"阶跃"这一新预测。

    5. "边界可移动——道德圈扩展：若群体边界是可移动的(不被生物特征锁定)，
       则改变'谁被视为我们'的渠道会影响TP的边界位置。"
       BR-L2-006的群体认同建立在共享符号/仪式/叙事上——这些是可人为操纵的。
       通信技术降低'感知远方苦难'的信息成本→远方的人从"抽象外人"变成
       "有面孔的人"→合作结构的感知边界外推→TP延伸。
       共享灾难创造新叙事("我们一起扛过来的")→新"我们"身份形成→边界移动。
       这是预测(ii)。非平凡性：BR-L2-006讲内群体偏好存在，不讲边界如何移动；
       BR-L2-018讲社会距离影响TP，不讲社会距离如何被技术/事件重构。

    6. "旁观者效应的结构重解释：预测(iii)给出一条与经典社会心理学不同的机制。"
       经典解释：人多→责任扩散→不帮。本推论的结构解释：人多→默认"他人更有
       利益关联"→自己感知的利益占比下降→TP减弱。这不是替代"责任扩散"，
       而是给出"为什么人会默认他人更有利益关联"的结构基础——在匿名人群中，
       你无从判断谁与受害者共享合作结构，默认假设是"总有人比我更相关"。
       但群体身份线索打破了这一默认——当受害者是内群体成员时，你知道"这群人里
       我和他最相关"，稀释效应被抑制。两条可独立检验的子预测：
       (a) 旁观者人数↑ → TP↓ (结构稀释，与经典方向一致但机制不同)；
       (b) 受害者群体身份线索(内群体)调节此效应——内群体受害者时稀释效应
       显著弱于外群体受害者(这是经典责任扩散理论不预测的)。

    7. "道德帝国主义——预测(iv)的推导：道德圈扩展(预测ii)描述边界如何移动；
       权力不对称描述谁能推动边界往哪个方向移动。当A既有渠道将B纳入'我们'
       (通信/叙事覆盖)，又有权力使B无法抵抗A的规范执行时，道德圈扩展从
       '互利包容'异化为'单边强加'。这是(ii)与CONCEPT-power的合成——非平凡
       在于断言'道德圈扩展'和'道德帝国主义'是同一结构机制(边界移动)的
       两种权力配置：对称权力下是包容，不对称权力下是帝国主义。"

    8. "非平凡性——逐格判空"
       2×2判据表(受害者群体身份:内/外 × 旁观者人数:少/多)，被预测量=TP强度：
       内+少→TP高(平凡——高利益占比)；
       外+少→TP中低(较平凡——低利益占比，BR-L2-018渐变预测此档)；
       外+多→TP低(较平凡——利益占比本已低+结构稀释叠加)；
       内+多→TP仍相对高(非平凡——群体身份线索抵御稀释效应)。
       核心空格="内群体受害者 + 众多旁观者 + TP强度降至外群体水平"预测为空——
       群体身份线索阻止了完整稀释。
       BR-L2-018单独预测：旁观者多→稀释→TP低，不区分内外群体。
       BR-L2-006单独预测：内群体偏好，但在"旁观者众多"语境下无特定预测。
       唯合成给出"内群体线索×旁观者数量的交互效应"。

falsifiability: |
  本推论在以下条件之一满足时被证伪：
  (a) 保持违规类型和严重度不变，仅将受害者从内群体换为外群体，TP强度无统计显著
  差异——推翻预测(i)的核心(群体边界处有阶跃)，阶梯效应不成立。
  (b) 引入通信技术/共享灾难等边界外推渠道后，对原外群体的TP强度无显著上升——
  推翻预测(ii)的核心(边界可被人为移动)。
  (c) 旁观者人数增加对TP的稀释效应，在内群体和外群体受害者条件下无显著差异
  (无交互)——推翻预测(iii)的核心调节(群体身份线索抵御稀释)。
  适用区间：群体规模≥3且存在可辨识的群体边界标记(至少Tajfel最小群体水平)；
  纯匿名单次交互中群体身份线索可能不足以激活利益占比的结构感知。

falsification_trace:
  primary_suspect: |
    预测(ii)的"通信技术→边界外推→TP上升"因果链——通信技术可能增加
    "远方的可见性"但不一定改变感知的利益占比(看得见≠觉得跟自己有关)。
    若通信覆盖率↑但TP不跟随，则(ii)被削弱——边界外推可能需要更强的
    机制(如真实的利益绑定)而非仅信息接触。此为最弱的腿。
  secondary_suspect: |
    预测(iii)的调节效应(内群体线索×旁观者数量交互)——若内群体条件下的
    旁观者稀释效应与外群体无差异，则"群体身份线索抵御稀释"被证伪。
    但预测(i)的阶梯效应可独立存活——阶梯效应不依赖旁观者数量这个维度。
  unlikely_suspect: |
    BR-L2-014(TP存在性)和BR-L2-006(内群体偏好存在性)——二者均为跨文化
    稳健复现的发现，极少是根源。若这些砖被推翻，受影响的将远不止本推论。

excluded_outcomes:
  - "违规者与受害者的个人恩怨(第二方惩罚)：本推论特指未直接受害的旁观者的
    第三方惩罚。若惩罚来自直接受害方或与受害方有亲缘/互惠关系的个体，
    不提供对本推论的检验。"
  - "有中心惩罚权威的制度化语境(法院/警察)：制度化惩罚的执行者是代理人
    而非自发第三方，代理人受职业激励而非利益占比驱动，混淆TP测量。"
  - "群体边界本身不存在(完全无差异的同质人群)：若无可辨识的群体边界，
    本推论的'阶跃'预测无适用对象——这不构成反例。"

anti_talisman_clause: |
  判定"是否存在群体边界"时，须由独立于TP强度的指标(事前身份问卷/
  随机标签分配/成员名册)完成，不得因"TP有差异"反推"此处必有群体边界"。
  判定"边界是否已外推"时，须由独立于TP变化的渠道测量(通信覆盖率变化/
  灾难影响范围)完成，不得因"TP上升了"反推"边界必已外推"。
  判定"旁观者人数"时，须为客观计数的物理在场者数量，不得由"TP低"
  反推"被试必感知到很多人"。

nontriviality_test: |
  逐格判空结论(2×2：受害者群体身份[内/外] × 旁观者人数[少/多]，
  被预测量=TP强度)：
  内+少→TP高：BR-L2-018预测(高利益占比→高TP)，平凡。
  外+少→TP中低：BR-L2-018预测(低利益占比→低TP)+BR-L2-006预测
  (对外群体利益关联弱)，平凡。
  外+多→TP低：利益占比本已低+结构稀释叠加，平凡。
  内+多→TP仍相对高：非平凡——预测群体身份线索抵御稀释效应。
  核心空格="内群体受害者+众多旁观者+TP强度降至外群体水平"预测为空。
  无单块砖给出此交互预测：BR-L2-018给稀释主效应但不给群体身份的调节；
  BR-L2-006给内群体偏好但不给旁观者数量维度的预测。
  空格可被现实反例填上→非空可满足、非同义反复。

real_world_anchors:
  supporting:
    - anchor: "最小群体范式中的TP×旁观者数量交互"
      evidence: |
        Tajfel范式中随机分配群体标签后，让被试在"独自一人"或"多人同时在场"
        条件下作为第三方旁观者对内外群体违规者的惩罚决策。预测：外群体受害者
        条件下旁观者人数↑→惩罚金额↓(标准旁观者效应)；内群体受害者条件下
        此稀释效应显著更弱。
      independent_test: |
        群体身份=随机标签(独立)；旁观者人数=实验操纵(独立)；TP=博弈金额(独立)。
      confidence: "moderate(需专门实验设计，尚未被实施——此为预注册假设)"

    - anchor: "历史案例——通信技术与道德圈扩展"
      evidence: |
        19世纪报纸和摄影技术使欧美公众首次"看见"远方殖民地的人道灾难
        (如刚果自由邦暴行)——此前这些受害者是"不可见的抽象外人"，
        此后公众TP(以请愿/捐款/政治施压形式)显著上升。
        20世纪电视对越战的覆盖同理——'客厅里的战争'将越南平民从
        '远方的抽象外人'转化为'有面孔的人'，触发美国国内反战TP。
      independent_test: |
        通信覆盖率(报纸发行量/电视普及率)=基础设施独立指标；
        TP(公众请愿/捐款/施压)=独立行为指标。
      honest_note: "历史案例为方向性支持，非控制实验。通信技术可能同时改变
        其他变量(经济利益/地缘战略)，因果关系需审慎归因。"
      confidence: "moderate"

    - anchor: "共享灾难创造新'我们'——二战后的欧洲认同"
      evidence: |
        二战前欧洲各国互视为"外人"(法德世仇)，战后共享的重建叙事和马歇尔
        计划框架下，"欧洲人"作为新群体身份形成——原属外群体的他国公民的
        福利开始被纳入本国的TP范围(如欧盟结构基金将资源转移给'我们欧洲人'
        中的较弱成员)。
      independent_test: |
        共享灾难=历史事件独立编码；新群体身份=欧盟身份认同问卷(独立)；
        TP=跨国资源转移政策(独立指标)。
      confidence: "moderate"

  counterexamples:
    - case: "社交媒体时代的信息过载——通信技术反而降低TP"
      analysis: |
        社交媒体使远方苦难"极其可见"，但TP(捐款/行动)并未同比例上升——
        甚至因"同情疲劳"而下降。这对预测(ii)构成压力：通信技术可能只是
        增加了"信息量"而非"利益关联感"，过载反致麻木。若通信覆盖率的
        持续上升与TP下降稳定共存(控制其他变量后)，则预测(ii)的"通信技术→
        边界外推"被削弱——可能需更严格的条件(不只是"可见"，还需"可互动"
        或"真实的互依"才能移动边界)。目前状态：对(ii)的渠道特异性有压力，
        但不推翻(ii)的核心(边界可被人为移动——只是"通信技术"可能不是
        充分的移动渠道)。
      status: "partial_pressure"

  boundary_cases:
    - case: "极强外群体敌意(战争/种族灭绝场景)中TP反向"
      analysis: |
        当外群体被彻底去人性化时，伤害外群体不仅不触发TP，反而可能触发
        反向TP(奖励伤害外群体者)。此时"道德"的边界不仅排除了外群体，
        还反转了道德的方向(伤害外群体=道德正确)。本推论的射程不覆盖
        此种极化——因为本推论的前提是：至少存在一个"伤害不应发生"的
        基础规范共识(由BR-L2-014的'公平规范'前提约束)。种族灭绝场景中
        该前提失效。属射程边界。
      status: "boundary_case"

discriminant_validity: |
  【相对于BR-L2-018(旁观者利益关联)的判别】
  BR-L2-018的本体论是"连续梯度"——TP随社会距离平滑衰减。本推论的本体论
  是"梯度+阶跃"——在连续衰减的背景上，群体边界处存在结构性断点，TP的
  下降幅度在此处超过连续衰减的预测值。独有可证伪预测：将社会距离保持恒定
  (如"远房亲戚"与"同族陌生人"在社会距离量表上得分相同)，仅操纵群体
  身份标记(亲戚=内群体，同族陌生人=中性)，TP强度应有显著差异。
  BR-L2-018仅凭社会距离无法预测此差异。若此操纵下TP无差异→阶跃不存在，
  本推论坍缩为BR-L2-018的复述。

  【相对于经典旁观者效应(社会心理学)的判别】
  经典旁观者效应(Latané & Darley 1968)的核心机制是"责任扩散"——人多时
  每个人觉得自己不用负责。本推论给出替代性的结构机制——"利益占比感知稀释"
  ——人默认他人更有利益关联故自己不用出手。两条机制的独有交叉预测：
  经典责任扩散预测稀释效应在(几乎)所有条件下均存在——因为人多在任何场景
  下都触发"别人会管"的默认。本推论预测稀释效应受群体身份线索调节——
  当受害者是内群体时，"别人更有利益关联"的默认假设被"这群人里我最相关"
  的结构直觉推翻。若实证发现稀释效应在所有群体身份条件下强度相同→
  本推论的结构机制被削弱(但经典责任扩散仍可成立)。

  【防平凡化守卫】
  不要把推论的核心误解为"人对内群体更好"(BR-L2-006已给)或"TP随社会距离
  衰减"(BR-L2-018已给)。非平凡内核聚焦在三处：(1)群体边界处的阶跃——
  不是渐变是结构性断裂；(2)边界可移动——通信技术和共享灾难是两个具体渠道，
  边界移动幅度应追踪渠道强度变化；(3)旁观者效应的结构重解释——群体身份线索
  调节稀释效应，这是经典责任扩散理论不预测的交互。

review_summary: |
