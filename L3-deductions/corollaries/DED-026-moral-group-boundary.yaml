  2) 核心新意：在BR-L2-018连续梯度上叠了群体边界结构性阶跃+群体身份线索调节旁观者稀释效应的交互预测，均为单砖不给出的增量；反例猎捕无scope内活反例（社交媒体同情疲劳已标partial_pressure，余均被消化或揭示对称缺口而非净杀）
  3) 全档见 ADV-REVIEW-030。

