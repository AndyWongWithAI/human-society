id: DED-020
type: deduction
layer: L3-deductions
status: verified

term: "程序透明×裁决独立交互推论 (Procedural Transparency × Adjudicator Independence Interaction Corollary)"

人话摘要: "程序透明不是万灵药，是放大器——裁判独立时，透明让公道更亮；裁判跟你不是一路人但跟对方是，透明反而把偏私曝光、让人更难咽。透明度加在错的人身上，比不透明还糟。"

statement: |
  BR-L2-015 给出一条连续正函数：程序透明 → 不利结果接受度上升。但它【未】给出
  这条函数在裁决者不独立时是否仍为正——它假定了'裁决者中立'这一隐性前件。

  【核心】程序透明度与裁决者独立性之间存在交互效应，不是'越多越好'的加法关系。当
  裁决者独立于争议双方利益时，透明度越高 → 合法性越强（BR-L2-015 标准效应，加法）；
  当裁决者不独立（与任一方共享利益）时，透明度反成'羞辱放大器'——把'裁判跟他是一伙的'
  这件事曝光得更清楚，合法性反而更低。程序透明不是万灵药，是放大器：放大独立性→合法，
  放大依附性→羞辱。

  【承重逻辑】将 DED-014 的'程序透明 × 轮替开放度'交互结构迁移到不同前件——
  用'裁决独立性'替换'轮替开放度'：
  (a) CONCEPT-fairness(a) 共享性要求——公平标准必须被争议双方共享。当裁决者与任一方
      共享偏私收益（BR-L2-006 内群体偏好 + BR-L2-002 亲缘利他驱动），其'中立'宣称
      不被争议双方共享 → 违反(a) → 公平标准本身不被共享 → 程序被认知为'设计来偏袒的'。
  (b) 透明度在此条件下不帮正忙、帮倒忙——把偏私从'可能'变成了'公开展示'。
  (c) DED-008 给：独立监督是公平的硬前件——本条定量化：独立性越低，透明度的边际效益
      越负。驱动量 = 裁决者独立度（可事前测：裁决者与争议双方是否有共享经济利益/亲缘
      关系/政治隶属，不依赖裁决结果），交互项 = 透明度 × 独立度。

  【预测】
    (i)   裁决者独立时，透明度对合法性有正效应；裁决者不独立时，透明度对合法性有
          负效应（交互为负）。
    (ii)  裁决者不独立 + 高透明度的组合，合法性评分【低于】裁决者不独立 + 低透明度
          的组合——透明反成羞辱放大器。
    (iii) 逐格判空：'裁决者不独立 + 高透明度 + 长期高合法性'这一格预测为空——可被
          现实反例填上。

  【判别·防平凡化】
    与 DED-014（程序×轮替）判别：DED-014 的前件是轮替开放度，本条的前件是裁决独立度
    ——同构的交互逻辑但不同的驱动变量，且两个变量可独立变异（有轮替但裁决者可能依附、
    无轮替但具体裁决者可能独立）。
    与 DED-008 判别：DED-008 说'裙带破坏监督'，是定性主张；本条说'透明度在依附条件下
    负效应'，是定量交互预测——DED-008 没说透明度会放大羞辱，这是一个新预测。
    primary_suspect：交互效应的方向是否可能在两类情境下都为零或为正——即'透明总是好，
    只是在不独立时好得少一点'而非'透明在不独立时是坏的'。预测(ii)是更尖锐的版本
    （透明反而更差），承载推论的非平凡内核最重。

# === 规则 A：操作化定义 ===

operationalization:
  adjudicator_independence:
    definition: |
      裁决者与争议双方之间是否存在利益共享关系——共享经济利益（共同产权/雇佣/投资）、
      亲缘关系（BR-L2-002 可追溯血亲/姻亲）、或政治隶属（同一派系/上下级/庇护链）。
      连续量：从完全独立（与双方均无任何利益共享）到完全依附（与一方高度利益共享）。
    measurement: |
      由可事前编码的结构事实独立测，三个维度：
      (a) 经济利益独立性：裁决者与任一方是否有共享产权/雇佣/投资/债务关系；
      (b) 亲缘独立性：裁决者与任一方是否有可追溯血亲/姻亲纽带（r≥0.125，二等亲以内）；
      (c) 政治隶属独立性：裁决者与任一方是否有上下级/同派系/庇护关系。
      【硬约束】不得用'裁决结果是否偏袒'或'败方是否接受'反推独立性——须由结构/关系
      事实独立测（DED-007/011 焊点教训）。
    limitations: |
      连续量，非二分；三个维度可合成但不完全正交（经济利益和政治隶属可能耦合）。
      '表面无关系但私下有交易'的隐蔽依附难以事前测——此为本条 primary_suspect 之根。

  procedural_transparency:
    definition: |
      决策过程在程序上的可观察度与规则清晰度——四个维度承自 BR-L2-015：规则成文清晰、
      裁决者遴选机制公开、各方有发言/举证机会、规则一贯执行。
    measurement: |
      由制度事实独立测：
      (a) 规则成文可查：裁决规则是否成文且公开可获取；
      (b) 裁决者遴选公开：裁决者由何程序选定、是否公示；
      (c) 发言机会：各方是否有陈述/举证/反驳的程序机会且实际被给予；
      (d) 一贯性：类似案件/争议是否类似处理（需多案例比对）。
      与裁决者独立度【分轴测】，不互相污染。
    limitations: "四个维度可合成但不完全正交；'一贯性'需多案例跨时间比对（观测成本高）。"

  legitimacy_acceptance:
    definition: |
      争议双方（尤其是'败方'——在当次裁决中处于不利结果的一方）对裁决的【接受度】
      ——以'继续在规则框架内行动、不诉诸规则外手段'为首要行为标志。
    measurement: |
      两维度分轴测：
      (a) 行为维度（主判据）：败方是否在后续互动中继续参与规则框架（不掀桌、不退出、
          不诉诸暴力/规则外报复），而非寻求体制外解决；
      (b) 态度维度（辅助）：对裁决公正性的主观评价（调查/访谈，如有）。
      行为与态度可分离，以行为维度为主。
    limitations: "态度数据依赖调查可得性且易有社会期许偏差；行为接受需长时段观测。"

# === 推导链 ===

derivation:
  from_l1:
    axioms: []
    theorems: []
  from_l2:
    bridging: [BR-L2-015, BR-L2-006, BR-L2-002]
  from_l3:
    deductions: [DED-014, DED-008]
  steps: |
    1. "BR-L2-015 给程序公平效应——但隐性前件未点名"
       BR-L2-015 的三域交叉验证（法院/选举/博弈）坐实：程序透明 → 不利结果接受度上升。
       但这是一条连续正函数，在它的标准陈述中隐含了'裁决者中立'这一前件（Tyler/Lind 的
       程序正义四要素中'中立性'是要素之一，但 BR-L2-015 并未将'中立性缺失'作为函数
       方向翻转的边界条件加以检验）。本条从这一隐性前件出发——不是复述 BR-L2-015，是
       追问：若前件（裁决中立）不成立，函数方向是否翻转？
       （砖的边际贡献诚实：BR-L2-015 是此步的出发点，不独立承载非平凡内核。）

    2. "CONCEPT-fairness(a) 共享性断裂——裁决者不独立时公平标准不被共享"
       CONCEPT-fairness(a)：公平标准必须被争议双方共享才成其为'公平'。当裁决者与一方
       共享偏私收益（BR-L2-006 内群体偏好：偏袒'自己人'；BR-L2-002 亲缘利他：偏帮血亲），
       其宣称的'中立'不被另一方共享——'你说你中立，但你跟他是一伙的'。公平标准本身
       不被共享 → 程序被认知为'设计来偏袒的'。此步偏【近定义】（fairness(a) 共享性是
       fairness 定义的从属部分），不作非平凡卖点，只作锁定隐性前件的概念工具。

    3. "DED-008 给独立监督是公平硬前件——本条定量化交互方向"
       DED-008 已建立：无独立监督者（不分享偏私收益）→ 一视同仁不自我执行 → 裙带侵蚀。
       但 DED-008 的被预测量是'公正维持 vs 侵蚀'（配置层面），且其论断是定性方向——
       未给出'透明度在依附条件下负效应'这一交互预测。本条将 DED-008 的'独立监督是公平
       硬前件'推进一步：独立性越低，透明度在认知层的边际效益越【负】——不是'透明度没用'，
       而是'透明度有害'。这是 DED-008 未给的新方向。

    4. "合成：交互结构 + 羞辱放大器 + 空格"
       由 1-3 合成：程序合法性知觉 ∝ g（程序透明度 × 裁决独立度），非可加性。裁决者不
       独立时，透明度将偏私从'可能'升格为'公开展示' → 程序沦为羞辱放大器。由此推出
       三条可证伪预测：
       (i)   交互项为负：独立度与透明度对合法性的效应方向相反。
       (ii)  反常方向：不独立+高透明的合法性【低于】不独立+低透明——羞辱放大器效应。
       (iii) 空格：不独立+高透明+长期高合法性为空。

       【非平凡性（逐格判空）】BR-L2-015 只给'透明→接受'连续正函数——不给交互、不给
       负效应方向、不给空格。BR-L2-006 只给'偏袒自己人'——不给透明×偏袒的交互效应。
       BR-L2-002 只给'偏帮血亲'——同样不给交互效应。DED-008 给'裙带侵蚀←独立监督缺席'
       ——不给透明放大羞辱。DED-014 给'透明×轮替'——同构但不同前件（轮替≠裁决独立）。
       空格'不独立+高透明+长期高合法性'是对这五者的联合边界——任一单独都【不强制】
       该格为空。非平凡内核 = 交互方向在裁决者不独立时为负（反常方向 ii + 空格 iii），
       而非'透明总是好、只是好得少一点'。

falsifiability: |
  本推论可被以下发现证伪：
  (a) 存在一个裁决场景同时满足（均由独立于结果的结构指标测得）：
      (1) 裁决者与争议任一方存在可溯的利益共享关系（非独立）；
      (2) 程序透明度高（规则成文公开、发言机会充分、一贯执行）；
      (3) 败方在长时段内行为上持续接受不利结果且态度上认可裁决公正。
      ⇒ 证伪核心（命中空格预测 iii）。
  (b) 程序透明度与裁决独立度的【交互项在统计上不显著】——合法性只随透明或独立
      【之一】走，无乘积效应；更关键地，裁决者不独立时透明度的效应【不为负】
      （即要么为零、要么仍为正但幅度减小）。
      ⇒ 证伪交互方向（预测 i/ii 的核心）。
  (c) 裁决者不独立+高透明的合法性评分【不低于】裁决者不独立+低透明的合法性评分。
      ⇒ 证伪反常方向（预测 ii），推论降级为'透明在不独立时无用但不有害'的弱版本。
  【适用区间注意】裁决者高度不独立（与一方有明显利益共享）且程序高度透明的组合
  在自然数据中可能稀少——高透明的制度通常也会约束裁决者独立性，使极限格（不独立
  ×高透明）的天然案例少。此非推论缺陷而是结构现实——需要在可及的变异范围内检验
  交互方向。

falsification_trace:
  primary_suspect: |
    交互效应的方向——裁决者不独立时透明度的效应是否真为【负】（羞辱放大器）而非
    '为零或正但减小'。此腿承载预测(ii)的全部非平凡重量和预测(iii)的大部分重量。
    两个难点：(a) 裁决者独立度的隐蔽依附（表面无关系、私下有交易）难以事前测出，
    若测量噪声大则交互项被稀释向零；(b) 高透明+高不独立的极限格在自然数据中稀少
    （高透明制度通常也约束依附），使预测(ii)所需的反常方向效应量估计方差大。
    最先受检，且若被证伪（交互不为负），推论实质归零——不存在'降级为弱版本后依然
    成立'的后路（因为弱版本'透明无害但不有用'不是本推论贡献的新预测）。
  secondary_suspect: |
    裁决者独立度的三维合成（经济/亲缘/政治）权重——三维是否等权、合成后连续量对
    交互效应的敏感性。若某维（如政治隶属）的权重被高估或低估，导致'独立度'分类
    与实际认知不一致，则交互效应被噪声掩盖。
  unlikely_suspect: |
    BR-L2-015 本身（程序公平→接受度上升，IEA=1.9）极少是失效根源。BR-L2-006
    （内群体偏好）和 BR-L2-002（亲缘利他）是演化-实验最坚实结论，极难被推翻。
    失效若发生，更可能出在'交互方向'这条合成腿上，而非任一承重砖的单体失效。

excluded_outcomes:
  - outcome: "裁决者独立（与双方均无利益共享关系）场景下的合法性变异"
    description: |
      本推论的核心预测聚焦于裁决者【不独立】的条件区域。裁决者独立条件下透明度的
      正效应由 BR-L2-015 覆盖，不在本推论专属射程。按裁决者与争议双方的结构关系
      （经济/亲缘/政治）事前独立测：若无任何可溯利益共享关系，则出射程。
  - outcome: "胜方（在当次裁决中处于有利结果的一方）对程序的认可"
    description: |
      胜方不需要'裁决中立'的认知保险——'裁判跟我是一伙的'对胜方是正面信号。胜方
      认可不检验本推论。按'裁决结果对谁有利'事前判定。
  - outcome: "单次裁决（非重复互动）场景"
    description: |
      若裁决是一次性、无后续互动，则'合法性接受'概念的操作空间受限（接受与否无
      行为后果可观测），出射程。按博弈结构（单次 vs 重复）事前测。

anti_talisman_clause: |
  【防不可证伪护身符——诚实硬约束】判定'裁决者独立度'时，必须由经济/亲缘/政治结构
  事实独立测，【不得】用'裁决结果是否偏袒'或'败方是否接受'反推独立与否——否则与
  被预测量循环（DED-004/007 死病）。判定'程序透明度'时，不得因'结果被接受'就倒推
  '程序必透明'。判定'合法性接受度'时，不得因'裁决者独立'就默认接受度高。
  三个量各自独立测、不互相反推。尤其不得遇到'不独立+高透明+高合法性'的看似反例时，
  事后调低透明度估值或默认'裁决者其实独立'来消化。裁决者独立度须由独立的结构/关系
  事实坐实，不由'败方接受了'反推。

nontriviality_test: |
  逐格判空（自变量 = {裁决者独立度: 独立 / 不独立} × {程序透明度: 高 / 低}，
  被预测量 = 败方长期行为接受度: {接受 / 不接受}）：

    - 独立 × 透明高 ⇒ 接受（BR-L2-015 标准预测）⇒ 非空。
    - 独立 × 透明低 ⇒ 不接受（BR-L2-015 标准预测）⇒ 非空。
    - 不独立 × 透明低 ⇒ 不接受/低接受（BR-L2-006 + DED-008 路径）⇒ 非空。
    - 不独立 × 透明高 ⇒ 【预测不接受，且比透明低更不接受】（反常方向 ii）⇒ 非空。
    - 不独立 × 透明高 × 败方【长期和平高接受】⇒ 【预测为空】（核心空格 iii）。

  该空格是真经验主张，非被砖平凡强制：
  BR-L2-015 只给透明→接受的连续正函数——不给交互、不给负效应方向、不给空格
  （它在 2×2 表的四个格中只覆盖了'透明高 = better'这半边，对'不独立'列不做分区预测）。
  BR-L2-006 只给'偏袒自己人'——不给透明×偏袒的交互、不给'透明→羞辱'。
  BR-L2-002 只给'偏帮血亲'——同样不给交互、不给方向翻转。
  DED-008 只给'独立监督缺席→侵蚀'——定性方向，不给'透明→羞辱'的定量交互。
  DED-014 是'透明×轮替'——不同前件同构交互，不给本条的空格。
  空格'不独立+高透明+长期高合法性'可被现实反例真填上 ⇒ 非空可满足、非同义反复。

  【防平凡化守卫】非平凡【不在】'程序透明让人接受结果'（BR-L2-015 已有），【不在】
  '独立监督重要'（DED-008 已有），而在：(a) 裁决者不独立时透明度的效应方向翻转
  （从正→负——反常方向 ii，任何现有砖/推论不给）；(b) 交互结构本身（非可加性，
  与 DED-014 同构但不同前件）；(c) 空格预测（可被反例真填上）。

real_world_anchors:
  supporting:
    - anchor: "独立司法+高透明→败诉方接受度上升——标准 BR-L2-015 效应，裁决独立在场"
      evidence: |
        法治成熟政体中，法官独立（终身制/独立薪酬/无利害冲突）+ 高程序透明（公开庭审、
        成文判决理由、上诉渠道）→ 败诉方在行为上接受裁决（不上街、不走私力救济、继续
        使用法院）。BR-L2-015 的 loser's consent 标准效应：裁决独立在场使乘积项独立度 > 0，
        透明度正效应正常发挥。
      independent_test: "法官独立由制度结构事实（任免程序/薪酬保障/回避规则）独立测，不由判决结果反推。"
      confidence: "moderate-strong（属于 BR-L2-015 共锚；多国跨域证据）"

    - anchor: "裙带法官/政治依附型法官+公开庭审→'透明反成羞辱'——预测(ii)方向性支持"
      evidence: |
        裁决者与执政方/权贵方有明显政治隶属或亲缘共享、但程序形式齐备（公开庭审、成文
        法条、律师辩论）的政体中，败诉方（尤其是反对方/体制外当事人）系统性地把公开庭审
        视为'走过场'——程序越公开、越坐实'法官跟他们一伙'的认知，合法性反而低于私下
        调解或模糊流程。方向性支持预测(ii)反常方向。
      independent_test: |
        裁决者独立度 = 政治隶属/亲缘关系（事前结构事实测）；
        透明度 = 庭审公开/规则成文（制度事实测）；
        合法性 = 败方行为接受度（独立于前二测）。
      honest_note: "个案间多因交织（对体制的整体信任/替代救济渠道），单案归因需谨慎；此处只作方向性中等支持。"
      confidence: "weak-moderate"

    - anchor: "内部仲裁/HR裁决中的'不独立+透明流程'——组织域支持反常方向"
      evidence: |
        组织内部裁决者（如 HR、部门主管）与争议一方有直接汇报关系或长期共事纽带（不独立），
        但裁定流程高度'透明'（公开评估指标、标准化面谈、成文结论）时，被裁一方对流程的
        态度可能比模糊私下处理更负面——透明使'老板护着他的人'这一事实成为公开记录，
        认知羞辱 > 认知公平。方向性支持预测(ii)。
      independent_test: |
        裁决者独立度 = 汇报关系/长期共事/利益关联（组织结构事实测）；
        透明度 = 流程标准化/公开度（制度事实测）；
        与被裁方满意度/申诉率独立测。
      honest_note: "组织心理学个案方向性支持，缺系统跨组织检验；属本条最原创方向，诚实降级。"
      confidence: "weak-moderate"

    - anchor: "DED-008 科举回避/德夫希尔梅——'独立+透明→公正'锚，复用为方向对照"
      evidence: |
        DED-008 的锚：科举回避（裁决者亲缘切断 A）+ 糊名誊录（程序透明）→ 公正度上升；
        德夫希尔梅（极端亲缘切断 A）+ 制度透明度 → 公正度上升。均落在'独立×透明→接受'
        格，与本推论方向一致，作对照锚。
      independent_test: "回避/糊名是成文制度事实，独立度与透明度可分别测。"
      confidence: "moderate（属 DED-008 共锚）"

  counterexamples:
    - case: "不独立裁决者+高透明度+败方长期和平高接受——活空格，待独立检"
      analysis: |
        若存在同时满足以下三条件的裁决场景（均由独立于结局的结构指标测得）：
        (1) 裁决者与一方有可溯利益共享（不独立）；
        (2) 程序透明度高（规则成文公开、发言充分、一贯执行）；
        (3) 败方长时段内行为上和平接受不利结果且态度上认可公正——
        则命中空格预测(iii)，证伪本推论。
        诚实守门：(1)(2) 须由结构/关系事实独立测，不得因 (3) 成立就事后调低 (1) 或调高
        (2) 的估值（DED-004 病根）。若此类案例存在且通过独立测量，推论归 rejected。
      status: "counterexample_hunt_open"

  boundary_cases:
    - case: "裁决者对双方均有同等利益共享（双边嵌入）——对称依附"
      analysis: |
        若裁决者与【双方】均有对等的利益共享（两边都是亲戚/都有经济往来），则虽然从
        任一方看裁决者都'不独立'，但对称性使偏私方向不明确——此时透明度可能不产生羞辱
        效应，因为'裁判跟谁都一伙'等价于'裁判跟谁都不是特别一伙'。此非本推论的核心
        射程（核心射程 = 裁决者与【一方】有不对称利益共享）。须先独立测利益共享的
        不对称性。
      status: "boundary_case"
    - case: "裁决者不独立但败方有替代裁决渠道（上诉/仲裁替代/退出）"
      analysis: |
        若存在可信的替代裁决渠道（可上诉至独立法院、可选仲裁、可安全退出该裁决体系），
        则败方合法性认知可能不由当前裁决者的独立性决定——翻盘机制在场（与 DED-014
        轮替在场同逻辑）。须先独立测替代渠道的存在与可信度。
      status: "boundary_case"

discriminant_validity: |
  【与 DED-014（程序×轮替）的判别】DED-014 的前件是轮替开放度（权力交替的事前独立概率），
  本条的前件是裁决独立度（裁决者与争议双方的利益共享关系）。同构的交互逻辑（透明 ×
  制度前件 → 合法性），但驱动变量不同。两个变量可独立变异：有制度化轮替的政体中具体
  裁决者仍可能依附（法官政治任命），无轮替的政体中具体裁决者可能独立（专业仲裁/技术
  官僚）。DED-014 回答'轮替归零时程序透明失效'，本条回答'裁决依附时程序透明反转'——
  两个独立的理论贡献。

  【与 DED-008（裙带-监督者独立）的判别】DED-008 的被预测量是'公正配置维持 vs 裙带
  侵蚀'（配置层——资源是否按亲缘偏斜），论断是定性方向。本条的被预测量是'败方对裁决
  的合法性认知'（认知层——程序是否被接受），且论断是【定量交互】：独立性越低，透明度
  边际效益越负。DED-008 没给'透明度在依附条件下是坏的'这一预测——它的主题是'有没有
  独立监督者决定公正与否'，而非'透明度在什么条件下反转为负'。

  【与程序正义文献（Tyler/Lind/Rawls）的判别】独有可证伪贡献非'透明→接受'（BR-L2-015
  已覆盖），而在：(1) 交互结构（非可加性、非'越多越好'单调）；(2) 反常方向（不独立
  条件下透明反为负——与'more transparency = better'这一隐含在大多数程序正义文献中的
  单调假设直接冲突）；(3) 空格预测。三条皆在现有程序正义/BR-L2-015/DED-008/DED-014
  射程之外。

  【防平凡化守卫】有人会说'裁决者不独立时人们不信任程序'——这是常识，不构成非平凡主张。
  本推论的非平凡内核不在'不独立→不接受'，而在【交互方向的反转】：不独立时透明不是
  '有用但不够'而是【有害】——高透明比低透明更差。这是非可加性的尖锐版本，任何现有
  砖/推论/文献不给。若这条被证伪（预测 ii 不成立），推论退化为'不独立时透明无用'——
  那已近于 DED-008 的复读、非本推论独有贡献。故(i)(iii)是缓冲带，(ii)是内核。

review_summary: |
  1) r1 verified → 定论 verified。
  2) 核心(交互方向反转——裁决者不独立时透明度效应为负、高透明比低透明更差)不在任何单砖内(BR-L2-015 只给透明→接受正函数、BR-L2-006 只给内群体偏袒、BR-L2-002 只给亲缘利他,均不给交互或负效应方向);反例猎捕五路攻空格"不独立+高透明+长期高合法性",均被已有机制合法消化,未猎到 scope 内净杀活反例;三量测量轴正交、DED-004/007 未复发。
  3) 全档见 ADV-REVIEW-025。

