anti_talisman_clause: |
  【防不可证伪护身符——五条硬约束】

  (1) 禁止由"SOV稳定"反推"叙事够厚"——叙事厚度必须由压力事件前的基线独立测量（三项指标：
  叙事基础设施存在性/社区话语叙事密度/叙事-退出联动），不得在系统挺过压力后补充"其实它
  有隐藏的社区共识"。特别禁止对纯算法系统的事后叙事注入（"这个系统挺过来了，说明社区
  对它一定有信仰"）——此手法是将可证伪命题保护起来的头号手法。

  (2) 禁止由"SOV崩溃"反推"技术设计有缺陷"——当纯算法系统在压力下崩溃时，不得通过事后审查
  挑出技术瑕疵来证明"不是缺乏共识的问题，是技术没做好"。技术设计质量必须由压力事件前
  的独立指标测量（代码审计报告/机制设计参数/历史故障率），事后挑刺必须诚实标注为
  "事后视角的发现，未在事件前编码"并降权处理。若所有纯算法系统的崩溃都能在事后找到
  技术维度的"瑕疵"，使得"缺乏共识"这一因子在实证中永远不被判决——
  anti_talisman失效，推论的可证伪性受质疑。

  (3) 判定"谁属于薄叙事系统"的阈值一次性锁定——三档操作化（厚=三项满足/薄=三项均不满足/
  中=其余）已注册，不得在见到各系统的SOV表现后移动阈值来"优化"叙事-SOV相关性。
  特别：不得创造"这个纯算法系统虽然没有人聚会但它有Twitter Spaces→它算中叙事"
  的事后微调——测量口径在采集任何SOV数据前锁定。

  (4) 压力情境的界定独立于系统反应——压力事件的入选标准（市场回撤>30% OR 监管严重度≥2）
  已一次性注册，不得在观察到某些系统"崩了"而另一些"没崩"后将前者纳入压力组、将后者
  归为"不算真正的压力情境"。市场回撤以加密市场总市值(BTC/USDT)为准而非任一单独系统
  的价格——消除"这个系统崩了所以定义它为压力事件"的循环推理。

  (5) 【对称保护】若薄叙事系统在压力下SOV高度稳定——不得以"压力还不够大"或
  "需要更长时间观察"推迟裁决。压力情境的烈度阈值和观察窗口（压力起始至恢复至80%或
  标注未恢复，上限12个月）已锁定。若薄叙事系统在注册的压力情境下持续表现不差于
  厚叙事系统——推论被证伪，承认即可，不以"等下次真正的危机再说"拖延。

nontriviality_test: |
  2×2排列表（自变量档：社群叙事厚度 厚 vs 薄 × 被预测量档：压力情境下SOV稳定性 高 vs 低）——

  格（厚叙事，高SOV稳定）——「平凡格」——BR-L2-022已描述此机制：SOV由信心驱动，
  当社群对某资产有深厚信念时SOV自然稳定。比特币（几次70%+回撤后恢复新高）和法币
  （即使经历危机后储蓄回流）已有大量实证。此格对本推论不提供增量区分。

  格（厚叙事，低SOV稳定）——「可能填空」——BR-L2-022(d)和BR-L2-024均指出
  记忆滞后效应——信心恢复不完整。若某"厚叙事"系统在压力下SOV崩盘且未恢复，
  需检验叙事厚度测量是否被污染（事后回溯叙事不等于事前真实的社群信念）。
  此格即便被填充，不直接威胁本推论的核心主张（本推论预测的是薄叙事vs厚叙事的差异，
  而非绝对水平）。

  格（薄叙事，高SOV稳定）——「非平凡反例格」——若被真实案例填充，本推论的核心
  主张被直接攻击：如果纯算法系统（薄叙事基线）在压力下SOV高度稳定，则"社会共识
  是SOV的必要基础"这一主张缺乏实证支撑。这是本推论刻意留给反对者的靶子——
  请找出一个纯算法、薄社群叙事、但在重大压力下SOV不倒的货币系统。
  填充此格的案例需通过anti_talisman约束(1)-(4)的检验——不得事后注入叙事、
  不得事后挑技术瑕疵说"不算真压力"、阈值需事前锁定。

  格（薄叙事，低SOV稳定）——「非平凡格·核心预测」——本推论的特有预测，
  不能被任何单一承重砖平凡推导：
  ·BR-L2-022单独预测"SOV由信心驱动"但完全不讨论AI或社群叙事——它不区分
    信心来自算法机制还是社群共识，因此不预测"薄叙事系统在压力下SOV稳定性低"；
  ·BR-L2-026单独预测"AI缺失社会性维度"但完全不讨论货币或价值储藏——它不预测
    "AI优化的货币系统在压力下SOV功能不稳定"。
  两砖焊接后才产生"纯算法系统在压力下SOV有天花板"这一交互涌现——这是需要
  BR-L2-022的SOV机制+BR-L2-026的社会性缺失合力才能产出的预测。

  总结：逐格判空的非平凡性在于"薄叙事+低SOV稳定"这一格需要两砖合力而非任何单砖的
  平凡外推。反例格"薄叙事+高SOV稳定"若被填充则推论被证伪——这正是可证伪性的保障。

  brick=conclusion自查：'AI无法从零生成SOV的社会共识，纯算法系统在压力下SOV有
  结构性天花板'——这一结论不在任何承重砖中原文或近义出现。BR-L2-022不含AI/社会共识
  讨论；BR-L2-026不含货币/SOV讨论。无为本推论窄化的专用砖。

real_world_anchors:
  supporting:
