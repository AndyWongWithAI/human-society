        LUNA-UST套利机制在正常市场条件下有效维持了锚定。但其社群叙事极度薄弱：
        无意识形态宣言（白皮书重点是技术机制）、无定期社区仪式（meetup/大会）、
        无"渡劫"共享叙事（系统此前未经历严重压力测试）。当2022年5月加息引发
        加密市场整体恐慌（外部冲击），套利机制前提（套利者有无限资金、链上无拥塞、
        预言机定价有效）同时崩坏，社群未提供任何叙事兜底——
        无"我们会回来的"型共享信仰、无社区组织起来协调持有决策、无内群体识别
        来区分"真正的信仰者"与"恐慌抛售者"。SOV功能在72小时内从"等价美元"归零。
        与推特/Reddit上LUNA社区的"我还在买/我还在持有"零散声音相比——
        这些声音未形成连贯的共享叙事，个体化的持有意图
        在算法正反馈崩坏面前毫无阻力。Terra的崩溃不是一个"设计缺陷"问题——
        其套利机制在理论上正确——而是设计假设（套利者无限资金+正常市场条件）
        在无社群叙事兜底时被压力情境系统性违反的结构性故障。
      independent_test: "技术设计质量按anti_talisman(2)在事前独立评估：Terra有
