id: DED-033
type: deduction
layer: L3-deductions
status: weakly_verified
term: "社保-消费释放的信任约束 (Social Security–Consumption Release Under Trust Constraint)"

人话摘要: "国家把医保、养老金铺开了，按说老百姓后顾之忧少了、就敢花钱了——这是教科书上的'无摩擦'预测。但现实没那么顺畅：如果一个人或他爹妈那辈人经历过保障承诺落空——比如90年代国企改制时养老金说没就没了、医保政策来回翻烧饼——他心里会留个疤：'这回说的好听，谁知道过几年又变成啥样。'于是该存的钱还是得存，社保扩面这把火，烧到信任存量低的人群身上，热度先打了个折。简单说：社保让人敢花钱，前提是人家信你这张安全网真的兜得住——信得越深，释放越充分；被晃过的，手还是紧的。"

statement: |
  【核心】社会保障制度的外生扩张（养老金覆盖扩大/医保报销比例提升/
  失业保险准入放宽）对家庭预防性储蓄的挤出、从而对当期消费的释放，
  受制度信任存量的正向调节——信任存量越低的群体/地区，同等社保扩张
  带来的储蓄率下降幅度和消费释放幅度越弱。信任存量有两个关键且独立
  可测的来源：(i) 个人/代际经历过的保障承诺落空事件（BR-L2-024
  记忆滞后机制的迁移——法币失信经历→替代资产偏好 的结构类比
  于 保障承诺落空经历→对新的保障承诺的怀疑），(ii) 制度信任的
  不对称衰减（BR-L2-031：摧毁快、建立慢）导致的信任赤字——经历过
  承诺落空的世代对新承诺的信任处于低位，且恢复所需时间远长于摧毁
  所需时间。

  【驱动量】两个前件均独立于消费结果可测——(1) 社保扩张幅度：
  从政策文本事前编码（覆盖率变化/报销比例提升/准入资格放宽的
  生效时点与幅度，按可文档化的政策文件识别）；(2) 信任存量：
  两条独立测量通道——(i) 经历档案法：按事前注册的保障承诺落空
  事件清单（见 operationalization.broken_promise_exposure），
  以个体/代际是否暴露于这些事件编码信任存量（暴露=经历过承诺
  被违背，信任存量偏低）；(ii) 调查代理法：使用 CGSS/CFPS/
  WVS 等大型调查中对"政府提供的社会保障是否可靠"的信任度题项，
  以地区/队列均值作为信任存量的连续代理。

  【预测】(i) 社保外生扩张后，经历过保障承诺落空事件的群体
  （按事前注册事件清单分类）的储蓄率下降幅度和消费率上升幅度
  显著小于未经历群体——组间差 > 0，且该差异在控制收入水平、
  金融可及性、人口结构后仍存在；(ii) 制度信任代理变量
  （调查测得的"社保可靠性"信任度，地区/队列均值）与社保扩张后
  消费释放幅度正相关——信任越高的地区/队列，消费反应越充分；
  (iii) 时间调节：保障承诺持续兑现时间越长（以政策稳定年数计），
  (i)(ii) 中的调节效应应衰减——信任存量随时间与正面经历积累
  而逐步修复，信任约束逐步松绑。

  【判别】与 BR-L2-028 无摩擦基准的区别——028 预测保障扩张→
  消费释放是普适的（对所有人群方向一致），本推论预测该效应存在
  系统性的群体异质性，异质性的方向与幅度由信任存量的事前差异
  预测，且该异质性随时间与制度稳定性的积累而收窄。与纯"信息
  不对称"解释（人群不了解新政策→反应慢）的区别——信息不对称
  预测的是延迟（反应斜率缓但终值相同），本推论预测的是衰减
  （终值本身也低，因为信任存量压低了保障的主观价值）。与纯
  "流动性约束"解释（穷人本来就没钱存，所以储蓄率降无可降）
  的区别——本预测在控制收入水平后仍成立，且预测的是储蓄率的
  变化量（一阶差分），不受储蓄率基线的机械约束。

  【边界（不声称）】不声称信任是唯一调节变量——收入水平、
  金融可及性、人口结构、社会保障替代率等也有独立影响；
  不声称信任存量可以被精确测量——只能通过代理变量和经历事件
  间接测度；不声称所有社保类型受信任调节的程度相同——养老金
  （长期承诺，信任弹性高）vs 医保（即期收益，信任弹性可能
  较低）vs 失业保险（中间态），信任弹性可能不同，本推论
  给出的是方向（正调节）而非具体弹性值；不声称保障承诺
  落空经历是信任存量的唯一来源——制度设计的透明度、
  政府整体可信度、社会信任文化等也是信任存量的来源。

operationalization:
  social_security_expansion:
    definition: "社会保障制度的外生扩张——覆盖率/保障水平/准入资格的供给侧政策变化，非需求驱动的参保率上升。"
    measurement: |
      从政策文本事前编码——养老金覆盖人口比例的外生提升（如
      制度并轨/参保资格放宽的生效时点）、医保报销比例的政策调整、
      失业保险准入门槛降低等。以政策文件生效时点为事件时点，
      以政策参数变化幅度为处理强度。禁止用参保率变化本身充当
      扩张度量（内生于需求/信任）。
    limitations: "干净的纯外生政策事件稀少；多数社保改革是打包推出的，分离单一政策效应需借助政策组分间的变异（如各省/市实施时点交错）。"

  trust_stock:
    definition: "个体/群体对社会保障制度承诺的主观信任存量——'这次承诺会持续'的信念强度。"
    measurement: |
      两条独立测量通道，事前注册、不得事后选择：
      [通道A·经历档案法] 按事前注册的保障承诺落空事件清单
      （见下方 broken_promise_event_registry），以个体/代际是否
      暴露于清单中的事件编码信任存量——暴露记为"低信任暴露组"，
      未暴露记为"对照组"。暴露判定规则（一次性注册）：个体在
      事件发生时已成年（≥18岁）且居住于受影响辖区，计为暴露；
      父母在事件发生时已成年且居住于受影响辖区，其子女计为
      "代际暴露"（弱暴露，单独分析）。事件清单见
      broken_promise_event_registry，在见任何消费数据前锁定，
      不得事后增减。
      [通道B·调查代理法] 使用大型社会调查（CGSS/CFPS/WVS
      /ESS 等）中对制度信任的相关题项——优先使用"您认为政府
      提供的社会保障是否可靠"或最近似题项。以地区/队列/时期
      均值作为信任存量的连续代理变量。调查数据必须在社保扩张
      事件【之前】采集（确保信任度量不被扩张事件本身污染）。
    limitations: |
      通道A：经历档案法捕捉的是"经历差异"而非"信任水平"本身，
      经历≠信任——经历了承诺落空的人不一定都不信任
      （有些人可能归因于特定情境而非制度本身），
      未经历的人也不一定都信任（可能通过社会学习/媒体报道
      形成了不信任）。经历是信任的工具变量，不是信任本身——
      这条工具变量链的有效性（经历→信任→消费行为）需要
      在经验检验中显式验证第一阶段（经历对信任调查题项的解释力）。
      通道B：调查代理法的信任题项在各调查中的措辞不完全一致，
      且社会期望偏差可能使信任度被高估。

  broken_promise_event_registry:
    definition: "保障承诺落空事件的事前注册清单——用于通道A的暴露编码。"
    measurement: |
      【一次性注册·按中国语境的事前清单，不得事后增减】
      满足以下任一条件的事件计入清单：
      (i) 养老金替代率发生政策驱动的大幅下调（下调幅度 ≥20%
      的政策文件生效事件）；
      (ii) 医保报销目录/比例的政策驱动大幅缩减（排除药品谈判
      导致的价格调整——那是市场行为而非承诺落空）；
      (iii) 社保基金出现公开报道的支付危机/缺口并导致发放延迟
      或削减；
      (iv) 政府公开承认社保制度不可持续并进行"并轨"/"改制"
      使已退休/已参保者的预期收益受损；
      (v) 社保制度在 ≤5 年内经历 ≥2 次方向相反的重大政策调整
      （如扩面→收缩→再扩面）——政策频繁反转本身构成承诺
      可靠性信号。其中"重大"的操作化定义：政策参数
      （覆盖率/保障水平/准入资格）变动 ≥ 10% 或覆盖人口
      ≥ 500 万（provisional，待经验标定）。
      范围限定：1900 年至今、中国大陆境内发生在国家/省级层面
      的社保政策事件。鼓励跨国比较研究（如拉美养老金私有化-
      再国有化循环、东欧后社会主义社保改革）使用本地等效清单，
      但须在研究设计阶段对标上述判据预注册。
      诚实标注：本清单按中国语境构建、覆盖中国近现代社保史，
      跨国扩展时判据 (i)-(v) 的适用性需逐国验证。
    limitations: "事件的精确时间边界（'政策什么时候算开始落空'）有时模糊——减益常是分阶段、渐进实施的，不像增益那样有明确的'生效日期'。编码规则：以政策文件首次签批/发布的日期为事件时点。"

  consumption_release:
    definition: "社保扩张对家庭消费的处理效应——保障强化后家庭消费率（消费支出/可支配收入）的变化。"
    measurement: |
      【一次性注册】分子=实际家庭消费支出（家庭调查口径，
      同一来源贯穿前后期）；分母=家庭可支配收入（同一调查口径）；
      效应=社保扩张受益人群相对未受益/晚受益对照组的 DiD 估计。
      消费释放幅度 = DiD 估计的消费率变化（百分点）。
      储蓄率变化 = -消费释放幅度（近似，忽略税与转移支付的
      会计差异——只要同一口径贯穿前后期，差分消掉水平差）。
    limitations: "DiD 识别依赖平行趋势假设；社保扩张常伴随其他政策变化（如同时期的扶贫/区域发展政策），分离干净处理效应需借助多期交错 DID 或合成控制。"

derivation:
  from_l1:
    axioms: [AXIOM-001, AXIOM-002]
  from_l2:
    bridging: [BR-L2-028, BR-L2-031, BR-L2-024]
  steps: |
    1. "BR-L2-028 给出无摩擦基准——社保扩张→预防性储蓄下降→消费释放"
       社保外生扩张（覆盖面扩大/保障水平提高）承接了家庭此前必须
       自持的风险敞口（收入中断/大病支出/长寿风险）。按照 BR-L2-028
       的比较静态：外部保障越强，自持缓冲的必要性越低，预防性储蓄
       下降、当期消费释放。这是"无摩擦"基准预测——所有受益家庭的
       消费反应方向一致，反应幅度仅由保障扩张幅度与家庭初始风险敞口
       决定。此步产出：基准方向（扩张→消费释放），不含异质性。

    2. "BR-L2-031 给出信任摩擦——制度信任可被摧毁且重建缓慢"
       BR-L2-031 的核心机制：制度信任的衰减-建立是时间不对称的——
       摧毁快（一次失信事件可在数周至数月内将信任打到谷底），
       建立慢（从谷底回到失信前水平需数年甚至十年级时间）。
       将此机制应用于社会保障域：如果个体/代际经历过保障承诺
       落空事件（养老金被削减、医保政策反复、社保基金支付危机），
       他们对"这次承诺会持续"的信任处于低位。即使当前政策文本
       与未经历者完全相同，信任存量不同意味着保障的主观价值不同——
       不被信任的保障承诺，在经济决策中打的折扣更大。
       此步产出：信任摩擦的来源与方向——经历承诺落空→信任存量低→
       保障主观价值被折扣。

    3. "BR-L2-024 给出记忆滞后——承诺落空经历留下行为遗产"
       BR-L2-024 的机制（原用于法币信用域）：经历过货币信用崩塌的
       世代长期保留对非法币资产的配置——"被贬值过的钱永远不如
       没贬过值的钱值得信任"。将此机制迁移至社会保障域：经历过
       保障承诺落空的世代对新的保障承诺持怀疑态度——"被兜过底的
       人知道底会漏"。两次迁移的类比结构：(i) 原域（法币）=
       对"价值储藏功能"的承诺，新域（社保）= 对"风险承接功能"
       的承诺；(ii) 原域经历=通胀/违约使法币购买力落空，新域经历=
       政策削减/支付危机使保障预期落空；(iii) 原域行为遗产=长期
       持有替代资产（金/房/外汇），新域行为遗产=长期维持较高
       预防性储蓄（行为功能等价物）。此步产出：记忆滞后作为信任
       存量的行为可观测足迹——不仅信任低，而且低信任是粘性的
       （不会因当前承诺而快速消解）。

    4. "合力：社保扩张的消费释放效应 = f(扩张幅度，信任存量)，∂消费释放/∂信任存量 > 0"
       将步骤 1-3 首尾相接：BR-L2-028 定义了从社保扩张到消费释放的
       因果箭头方向，BR-L2-031+BR-L2-024 共同定义了什么因素决定
       该箭头的"传导效率"——信任存量。家庭面对相同的社保扩张
       （相同的政策文本、相同的覆盖提升），但对"这份保障在需要时
       真的会兑现"的信念强度不同，其在经济决策中给保障赋予的
       主观权重也不同。信念越弱，保障对自持缓冲的替代越不完全，
       预防性储蓄下降越少，消费释放越弱。
       合成预测：∂消费释放/∂信任存量 > 0。这不是同义反复——
       BR-L2-028 没有说过"该效应在不同人群中异质"，BR-L2-031
       没有说过"此不对称会影响消费行为"，BR-L2-024 没有说过
       "法币信用的记忆滞后可类比于社保承诺落空"。三砖合力：
       028 给方向箭头，031 给信任摩擦，024 给摩擦的粘性——
       任缺一块都推不出"信任调节消费释放"的预测。

    5. "合成与非平凡性（逐格判空）"
       2×2 判据表见 nontriviality_test。承重砖边际贡献诚实点名：
       BR-L2-028 是发动机——给"社保→消费"的因果箭头，但对
       "箭头传导效率在不同人群中是否恒定"沉默；BR-L2-031 是
       摩擦来源——给"信任可被摧毁且重建慢"，但从未应用于
       消费/储蓄行为；BR-L2-024 是摩擦粘性——给"负面经历→长期
       行为偏移"，但原域是法币/资产配置而非社保/消费储蓄。
       "信任存量调节社保→消费的传导效率"这一交互命题不在任何
       一块砖里——是三砖合力的真增量。非平凡格（低信任×社保
       扩张→消费释放弱）可被现实反例填空——若未来发现经历过
       承诺落空的群体在社保扩张后消费释放与未经历群体无差异、
       且信任代理变量与消费释放不相关，则该格被填上、推论塌缩为
       BR-L2-028 的平凡复述。

falsifiability: |
  【三条注册口径，分子/分母/测量口径一次性注册，不得事后调整】

  (a) 经历-反应口径——经历过保障承诺落空事件的群体
  （按 broken_promise_event_registry 事前注册的事件清单编码暴露），
  在外生社保扩张事件后，储蓄率下降幅度（消费率上升幅度）显著小于
  未经历群体。统计量：组间 DiD 估计差 > 0（经历组的消费释放效应 -
  未经历组的消费释放效应 < 0，即经历组释放更弱）。证伪阈值：
  组间 DiD 估计差 ≤ 1 个百分点（储蓄率）即判证伪——方向为正但
  幅度太小=实质为零（provisional，待经验标定，参照 BR-L2-028
  的 1pp 先例）。若经历组的消费释放幅度 ≥ 未经历组（组间差 ≤ 0
  且非显著），则信任调节的核心预测被证伪。

  (b) 信任代理-消费释放相关口径——制度信任代理变量
  （按 trust_stock 通道B——社保扩张事件【前】采集的调查数据中，
  "政府提供的社会保障是否可靠"或最近似题项的地区/队列均值）
  与社保扩张后消费释放幅度正相关。统计量：跨地区/队列的相关
  系数 > 0（Spearman/Kendall，因信任变量可能是序数性质的）。
  证伪阈值：Spearman/Kendall τ ≤ 0.1 即判证伪——相关性太弱=
  实质无关（provisional，待经验标定）。若相关不显著或方向为负，
  则信任→消费释放的传导链被证伪。
  (c) 时间衰减口径——保障承诺持续兑现时间（自最近一次承诺落空
  事件或社保制度最近一次重大改革以来的年数）对 (a)(b) 中的
  调节效应有负向调节：承诺持续兑现越久，(a) 中的组间差越小、
  (b) 中的正相关越弱。统计量：时间×信任的交互项系数 < 0
  （在包含时间×信任交互项的多变量模型中）。若承诺持续兑现
  时间对调节效应无影响（交互项不显著），则"信任可修复"的
  假设被削弱（但 (a)(b) 的核心可独立存活）。
  诚实标注：(c) 的检验要求足够长的时间序列（≥10 年政策稳定期），
  样本量可能不足——当前为预注册，待数据积累后裁决。

falsification_trace:
  primary_suspect: |
    (a) 腿的归因——组间消费释放差异可能全部由信任以外的因素解释：
    (1) 收入水平差异——经历过承诺落空的群体（如 90 年代国企下岗
    工人）同时经历了收入/财富的永久性负面冲击，其更低的消费释放
    是收入效应而非信任效应；(2) 金融可及性差异——同一群体可能
    因信用记录/抵押物不足而被排斥在信贷市场之外，消费无法通过
    借贷平滑（流动性约束而非信任约束）；(3) 人口结构差异——
    经历群体年龄偏大、赡养负担更重，消费结构不同（医疗/教育
    刚性支出占比高、可自由压缩的消费项目少）。招牌预测压在
    "控制收入/金融可及性/人口结构后，组间差仍显著"这条腿上——
    测量最难（需要同时有社保扩张事件+家庭面板+信任代理+多变量
    控制的数据），也最可能被推翻。若多数可用证据中，控制这些
    变量后组间差不再显著，(a) 的核心被证伪，推论塌缩为"社保
    效应受社会经济地位调节"的平凡社会学陈述。
  secondary_suspect: |
    BR-L2-024 机制迁移的跨域有效性——法币信用记忆滞后→资产配置
    偏移（Malmendier & Nagel 2011 验证过的链条），与社保承诺落空
    记忆滞后→预防性储蓄行为偏移（本推论声称的链条），共享
    "记忆→风险规避行为"的底层逻辑，但在以下维度未必同构：
    (i) 法币贬值是大面积、连续可感的日常经历（物价上涨每天可见），
    社保承诺落空是离散的政策事件（养老金削减以政策文件发布为感知
    时点，感知显著性可能远低于物价上涨）；(ii) 法币贬值→替代资产
    偏好（买入金/房/外汇）是主动配置行为，社保承诺落空→维持高储蓄
    是维持现状行为（人们本来就在存钱，只是存多存少的差异）——
    维持现状比主动配置更难归因到特定经历。若跨域迁移的类比结构
    被经验证据推翻（如经历过承诺落空的群体在控制信任代理变量后
    无额外的行为偏移），本推论的 024 腿被削弱，需降格为仅依赖
    028+031 的弱版本。
  unlikely_suspect: "BR-L2-028 的无摩擦基准——社保→预防性储蓄下降→消费释放的比较静态有多个独立的准实验证据（美国 UI/Medicaid、中国 NCMS、台湾健保），跨制度同向复现，稳固。BR-L2-031 的信任不对称机制（损失厌恶驱动）是行为经济学的稳固共识，但其应用于社保域是推断而非直证——此处的脆弱点不在 031 本身，而在其跨域推广。"
  note: "primary 若被坐实，024 的跨域迁移也随之失去行为锚点——(a) 是全推论的最弱腿，此处诚实认账。"

excluded_outcomes:
  - outcome: "社保类型差异导致的信任弹性不同"
    description: "本推论只给出 ∂消费释放/∂信任存量 > 0 的方向预测，不声称养老金（长期承诺）与医保（即期收益）与失业保险的信任弹性相同。若养老金有显著信任调节而医保没有（或反之），不证伪核心主张——只将推论边界收窄为'特定社保类型'。按社保类型事前分类分析即可。"
  - outcome: "社保扩张伴随大规模转移支付/收入效应时的消费反应"
    description: "若社保扩张本身包含大量现金转移（如城乡居民养老金从无到有直接发放现金），则消费反应含收入效应+预防效应的混合，分离困难。本推论射程限于'保障水平提升而非直接收入转移'的扩张类型，按政策文本中'现金转移/实物/仅保障承诺'的分类事前编码。"
  - outcome: "非缴费型社会救助（低保/五保/社会津贴）的消费反应"
    description: "社会救助的消费反应主要走收入效应和流动性约束释放通道（BR-L2-029 的 MPC 梯度），非本推论的预防-信任通道。按社会保障类型事前分类（社会救助 vs 社会保险），社会救助类在射程外。"

anti_talisman_clause: |
  【防不可证伪护身符——前件判定必须独立于消费结果】

  (1) 禁止由"消费释放弱"反推"信任存量低"——信任存量只认两条
  事前通道：(i) broken_promise_event_registry 中注册的事件暴露状态，
  或 (ii) 社保扩张事件前采集的调查信任题项。若某地区/群体消费
  释放弱但按两条通道均测不出低信任，不得事后诉诸"隐性不信任"
  或"文化性不信任"开脱，该案例按"未解释"处理。

  (2) 禁止由"消费释放弱"反推"该事件其实是承诺落空"——
  broken_promise_event_registry 是事前锁定的封闭清单，不得因
  看到某个群体消费释放弱而将某次政策变动事后追认为"承诺落空事件"。
  清单在见任何消费数据前锁定。

  (3) 禁止在反例出现后调整"承诺持续兑现时间"的起算点——
  (c) 的时间衰减检验中，"最近一次承诺落空事件以来的年数"的
  起算时点按 broken_promise_event_registry 中事件日期计算，
  不得因某案例衰减效应不显著而事后将起算点提前或推后。

  (4) 禁止用"该群体的信任其实已被修复"消解反例——信任修复
  必须有独立证据（调查信任题项的回升/新生代际的相对信任改善），
  不得仅凭"时间已经过去很久了"推断修复。

  【削弱条件（明确列出）】若观察到：按两条事前通道测得的
  信任存量差异，在社保外生扩张后不产生消费释放幅度的组间差异
  （(a) 不成立）且信任代理变量与消费释放不相关（(b) 不成立），
  则核心主张被削弱至断裂。

  若仅 (a) 不成立而 (b) 成立——即经历-消费不相关但调查信任-
  消费正相关——且通道A的第一阶段（暴露于承诺落空事件→调查信任
  差异）不显著，则推论不被 (a) 单独毙掉，降格为"信任调节成立
  但经历档案法无效"的弱版本。

  若仅 (b) 不成立而 (a) 成立——即经历档案法有效、调查代理法
  无效——通道A的第一阶段需显式通过显著性检验（暴露差异→调查
  信任差异显著），否则 (a) 的成功不能归因于信任。若第一阶段
  通过，则信任的测量方式被削弱但信任调节的核心逻辑存活
  （经历是比调查题项更硬的信任代理）。

nontriviality_test: |
  2×2 判据表（自变量档：社保外生扩张下的"高信任存量群体/地区" vs
  "低信任存量群体/地区" × 被预测量档："消费释放充分（接近无摩擦基准）"
  vs "消费释放弱/不显著"）：

  格(高信任×社保扩张, 消费释放充分)——「基准格」——BR-L2-028 预测此格。
  此格是 028 的验证实例而非本推论的新内容。

  格(低信任×社保扩张, 消费释放弱)——「非平凡格」——没有任何承重砖平凡地
  强制它：BR-L2-028 只预测消费释放（对所有人都同向），未预测"某些人群会
  释放得少"；BR-L2-031 只说"制度信任易碎难建"，从未应用于消费行为域；
  BR-L2-024 只说"法币失信的后果是替代资产偏好"，从未扩展到社保域。
  "低信任存量→社保扩张的消费释放打折扣"这一交互命题的真增量体现在：
  (i) 028 的输出（消费释放）是 031+024 的信任机制所调节的"被调节项"——
  这不是简单的砖叠加，而是 031/024 给 028 的因果箭头装上了"传导效率
  调制器"；(ii) 调制器的存在可被现实反例填空——若未来多个社保扩张案例中，
  按事前通道测得的信任差异不产生消费释放的梯度，该格即被填上、
  推论被证伪。

  格(高信任×社保扩张, 消费释放弱)——若被填充，028 的核心被挑战（不在本推论
  射程内，但会动摇本推论的地基）。

  格(低信任×社保扩张, 消费释放充分)——若被填充（即经历过承诺落空的群体
  消费释放与未经历者同样充分），(a) 的核心预测被证伪——信任调节不成立，
  推论塌缩为 BR-L2-028 的平凡复述。

  brick=conclusion 自查：'社保扩张的消费释放效应受信任存量调节'未在任何
  承重砖中原文或近义出现。BR-L2-028 只说保障→消费的普适方向，未提异质性；
  BR-L2-031 只说信任易碎难建，未涉消费行为；BR-L2-024 在法币域运作，
  未谈社保。'信任调节社保-消费传导'是三砖合力的组合增量。

real_world_anchors:
  supporting:
    - anchor: "中国新农合(NCMS) 2003-2010 地区间消费反应差异"
      evidence: |
        新农合（新型农村合作医疗）2003 年起以县为单位分批次推开，
        中央定框架、各县自主决定参合费率与报销方案——提供了县级层面
        的识别变异。多项 DID 研究（如 Bai & Wu 2014, JHE; 其他
        中国健康与营养调查 CHNS/CFPS 的 NCMS 评估文献）发现参保
        家庭非医疗消费上升、预防性储蓄下降，总体方向与 BR-L2-028
        一致。但分地区看，东部沿海省份（如浙江、江苏）的消费释放
        效应普遍强于中西部省份（如贵州、甘肃）。解释竞争：
        东部收入高/金融发达，不能直接归因于信任差异。
        但一个值得注意的线索是——中西部省份在 NCMS 之前经历了更频繁
        的农村合作医疗"办了又停、停了又办"的反复（1950s 合作医疗
        兴起→1980s 随人民公社解体而大面积瓦解→1990s 二次尝试→
        2003 NCMS 重建），在 broken_promise_event_registry 的意义上
        属于暴露区。东部沿海则因集体经济底子厚，部分地区的合作医疗
        在 1980-90s 期间未完全中断——信任断裂的深度不同。
        诚实标注：地区间消费反应差异被收入/金融发展/医疗资源严重混淆，
        本锚只能作为方向一致的背景证据，不能独立坐实信任调节。
        正面：NCMS 推开时部分县保留了 1990s 试点的连续参保记录
        （无承诺中断），提供了同类地区内"中断 vs 连续"的自然变异——
        这是最可能分离信任效应的比较，但目前缺已发表的准实验证据。
        承重标注：承重"社保扩张→消费释放方向"（BR-L2-028 基准，
        非本推论独有）；不独立承重"信任调节"的交互命题。
      confidence: weak
    - anchor: "东德-西德统一后社保并轨的信任不对称（1990-2000s）"
      evidence: |
        1990 年两德统一后，西德社会保障制度（养老金/医保/失业保险）
        全面覆盖东德地区。从政策文本看，两地在统一后享受相同的社保
        制度——如果只有 BR-L2-028，应预测两地消费行为趋同。
        但多项研究（如 Börsch-Supan et al. 对德国储蓄率的 cohort
        分析; Fuchs-Schündeln & Schündeln 2005, AER 对东德人风险
        态度的研究）发现东德家庭在统一后长期维持更高的储蓄率和
        更保守的资产配置——且该差异在控制收入、就业状态、人口结构后
        仍存在。一个可解释的线索：东德居民经历了两个层面的承诺落空——
        (i) Stasi 体制下对"国家会照顾你"的全面保障承诺随政权崩溃
        而落空，(ii) 统一后部分东德企业倒闭/重组导致原有的企业附属
        福利（相当于中国国企的"单位保障"）消失。相比之下，西德居民
        生活在社保承诺基本未被违背的连续历史中。
        诚实标注：此锚同样被多重混淆——统一后的经济冲击（大规模失业/
        产业重组）对东德储蓄率的独立影响无法完全剥离。Fuchs-Schündeln
        & Schündeln (2005) 用 GSOEP 面板和 cohort 分析部分缓解了混淆
        （控制收入后东德人仍更偏好政府干预和社保），但判断是风险态度
        差异而非本推论注册的"信任存量调节社保-消费传导"。此为方向上
        一致的相邻证据，非本推论的干净锚。
        承重标注：承重"制度断裂经历→长期行为差异"的机制真实性
        （相邻证据，非按本推论注册口径——测的是风险态度而非信任
        存量，未与社保扩张事件挂钩）；不承重消费释放的因果检验。
      confidence: moderate
    - anchor: "智利 1981 养老金私有化→2008 年再改革后的信任修复"
      evidence: |
        智利 1981 年以个人账户制（AFP）替代现收现付养老金，当时
        承诺"个人账户积累将提供比旧制度更高的退休收入"。1990-2000s，
        随着 AFP 制度缺陷暴露（管理费侵蚀账户/覆盖率不足/性别差距
        大），部分群体实际养老金远低于承诺水平——这是一次事实上的
        承诺落空。2008 年 Bachelet 政府推行养老金改革（引入团结
        支柱/补贴非正规就业者），实质上是部分回归国家保障的再承诺。
        从本推论视角，经历了 1981 承诺落空的群体对 2008 再承诺的
        信任应处于低位，2008 改革后的消费释放应弱于（反事实的）
        "无 1981 落空"情景。
        诚实标注：智利案例的养老金改革→消费释放的因果链太长
        （养老金改革影响的是退休消费，而非即期消费），本推论预测的
        "社保扩张→当期消费释放"在此锚中无法直接观察。且 2008 年
        改革与全球金融危机同期，宏观冲击使消费路径不可分离。
        该锚仅承重"社保承诺落空经历→信任存量低"的机制真实性，
        不承重消费释放的因果检验。另有更晚近的 2019-2022 年改革
        （允许部分提前提取养老金以应对 COVID）提供了"从个人账户
        中释放资金→消费反应"的更接近消费端的自然实验，但因政策
        为临时性（非常规社保扩张），按 excluded_outcomes 在射程外。
        承重标注：仅承重"承诺落空经历→信任存量低"子机制
        （对应 derivation step 2）；不承重消费释放的因果检验
        （因果链太长——养老金改革影响退休消费而非即期消费）。
      confidence: weak
    - anchor: "中国社保覆盖扩张-储蓄率下降的宏观时序方向一致（CNBS×WB 实证，2026-07-16）"
      evidence: |
        宏观时序对照：中国总储蓄率（World Bank, % of GNI）从 2015 年
        45.1% 持续下降至 2024 年 42.7%（降幅 2.4 个百分点）。
        同期社保覆盖快速扩张——城镇职工基本养老保险参保人数从
        2015 年约 3.5 亿增至 2025 年 5.47 亿，城乡居民养老保险参保
        2025 年达 5.29 亿，合计覆盖约 10.8 亿人。居民人均消费支出
        2025 年为 29,476 元（+4.4% 实际增速），人均可支配收入中
        转移净收入增速（+5.7%）快于消费增速。
        储蓄率下降与社保覆盖率上升方向一致，与 BR-L2-028 的无摩擦
        基准预测同向。
        诚实标注（三重）：
        (i) 单条宏观时序不能确立因果——无法排除经济增速下台阶
        （GDP 增速从 7%→5%）、人口老龄化加速（老年抚养比上升）、
        房地产财富效应消退等替代解释。此为方向性线索而非干净识别。
        (ii) 储蓄率下降幅度（-2.4pp/9 年）远小于社保覆盖扩张幅度
        （养老参保 +2 亿+/9 年）——若信任无摩擦，BR-L2-028 预测的
        储蓄释放应更剧烈。这一"扩张大、释放小"的落差本身构成
        信任约束存在的弱方向线索，但不可独立坐实——储蓄率受多因素
        驱动，不能将残差全归因于信任。
        (iii) 数据源诚实——储蓄率数据和社保参保数据分别来自
        World Bank 和 CNBS，二者在数据源层面有一定独立性（WB 储蓄率
        数据不完全依赖 CNBS 国家账户），但非完全独立（WB 的中国
        GNI 估值部分参考 CNBS 公布的 GDP 和人口数据）。
        承重标注：此锚仅承重"社保扩张与储蓄率下降方向一致"的宏观
        背景事实（BR-L2-028 基准），不独立承重"信任调节"的交互命题。
      confidence: weak
  # 整体诚实标注：当前四个锚均非按本推论注册的三量（信任存量
  # +社保扩张幅度+消费释放）"全景式"完整测量的干净实例——
  # 推论在实证上仍是 hypothesis 而非 confirmed。各锚仅承重
  # 推论的片段（方向/机制真实性/子机制），无一独立验证核心
  # 交互命题"信任存量调节社保→消费传导效率"。
  counterexamples: []
  boundary_cases:
    - case: "战后日本 1961 年全民健康保险——国家重建期的快速信任建立"
      analysis: |
        日本在战后废墟上于 1961 年建立全民健康保险（国民皆保険），
        社保制度从几乎为零到全面覆盖仅用了约 15 年时间，且未见
        "信任存量低导致消费释放弱"的明显证据——日本在 1960s 的
        消费快速增长与社保体系建设同步发生。从本推论视角，这是一个
        潜在的边界反例：如果信任建立需要漫长时间（BR-L2-031），
        为何战后日本能快速建立对社保的信任？
        消化：(i) 战后日本处于"国家重建期"——整个制度体系同时
        从零重建，人们没有可供比较的"之前的承诺落空"经历——
        在 broken_promise_event_registry 的意义上，暴露为零，
        信任从零开始建不需要先修复旧伤；(ii) 战后经济增长极快
        （国民收入倍增计划），收入快速增长本身稀释了预防动机
        （BR-L2-028 的比较静态——收入稳定/增长降低风险敞口，
        预防动机弱于停滞经济体）；(iii) 1961 年全民健保是日本
        战后"国家重建叙事"的一部分——政府整体可信度处于上行
        通道，社保只是其中一个维度。本推论预测的信任调节效应
        在"高增长+无承诺落空历史+政府整体可信度上升"的环境中
        应弱甚至不出现——这仍是推论预测范围内（调节变量趋近
        上限时，约束接近消失），非净杀反例。诚实认账：该案例
        表明本推论在"clean slate"（无历史包袱）场景中实际退化为
        BR-L2-028 的无摩擦基准——信任存量够高时推论成为冗余。
      status: boundary_case

discriminant_validity: |
  【独有可证伪预测】相对相邻理论逐一判别——

  (1) vs BR-L2-028（预防性储蓄的无摩擦基准）：028 预测社保扩张→
  消费释放适用于所有群体，方向一致。本推论是 028 的调节版——
  接受 028 的方向，但预测传导效率因人而异，异质性的方向与幅度
  由信任存量的事前差异预测。若所有群体的消费释放幅度无统计显著
  差异（信任不调节），本推论退化为 028 的复述，028 存活。

  (2) vs 纯"信息不对称"解释（人群不了解新政策→反应慢）：信息
  解释预测的是延迟（平行趋势在长期趋同），本推论预测的是衰减
  （终值不同，因为信任压低了保障的主观价值）。若长期（≥5 年）
  跟踪显示低信任组的消费释放追上了高信任组，则是信息解释成立、
  信任调节不成立——通过长期跟踪可判别。

  (3) vs 纯"流动性约束"解释（穷人没钱存→储蓄率降无可降）：
  本推论在控制收入水平后预测仍存——因信任调节走的是"保障
  主观价值"通道而非"预算集"通道。(a) 的组间差在控制收入后
  应仍显著——这是本推论区别于流动性约束的头号判据。

  (4) vs "习惯形成"解释（消费习惯粘性→对新信息的反应滞后）：
  习惯形成预测所有人对新政策的反应都慢（普遍粘性），不预测
  经历/未经历群体的系统性差异——组间差是判别点。

  【防平凡化守卫】非平凡内核精确定位在两处：(i) 信任存量的
  事前差异（用经历档案或调查代理独立测出）可以预测社保扩张
  效应的群体梯度——这不是社科常识"信任重要"的模糊复述，
  而是带注册测量口径和方向的精确预测；(ii) 该梯度随时间与
  制度稳定性的积累而收窄——信任可修复，修复的节律由
  BR-L2-031 的不对称衰减给出。

  防平凡化补充——正面回应"不信任→承诺打折扣近乎分析性真理"
  挑战：(a) 本推论赌的不是"不信任会影响折扣"（那近乎定义——
  不信的东西自然不值原价），而是折扣幅度在群体层面的可事前预测
  梯度——暴露 vs 未暴露群体的折扣差、高信任 vs 低信任地区/队列
  的消费释放梯度，均可被经验数据推翻（若梯度不存在或方向反向，
  推论塌）；(b) 该梯度的方向和节律（衰减）是经验赌注——若测不到
  梯度或梯度方向相反，推论塌；若衰减节律与 BR-L2-031 预测不一致
  （如信任修复比摧毁还快），推论被削弱；(c) 三砖合力给出了为何
  折扣不能是均匀的结构理由——BR-L2-031 说信任存量因经历不同而
  不同（有人被晃过有人没有），BR-L2-024 说这种差异是粘性的
  （不会因当前政策文本而快速消解），因此不同群体的信任存量不同
  且可事前测——若所有群体信任存量相同（经历无差异或经历不产生
  信任差异），则推论在群体层面退化为 BR-L2-028 的无摩擦基准。

relation_to_system: |
  与相邻推论的分工——

  BR-L2-028（预防性储蓄）：无摩擦基准——本推论是 028 的"信任
  摩擦层"叠加。028 给"社保→消费"的箭头方向，本推论给"箭头
  传导效率因人而异"的调节。二者互补不冲突：028 的准实验证据
  是总体平均效应，本推论预测平均效应之下的群体梯度。

  BR-L2-031（制度信任不对称衰减）：机制来源——本推论承继 031
  的"信任易碎难建"内核，将其特化应用于社会保障域并连接到
  一个可测的消费行为结果（031 本身未连接消费行为）。本推论
  是 031 在社保-消费域的一个应用实例。

  BR-L2-024（法币信用记忆滞后）：机制迁移——本推论将 024
  的记忆滞后逻辑从法币域迁移到社保域，论证"承诺落空经历→
  行为偏移"的类比结构。该迁移本身是本推论的一个可证伪假设
  （见 secondary_suspect）。

  DED-032（消费信贷自噬循环）：互补——032 讲"借钱消费如何
  反噬自身"（负债通道），本推论讲"社保让人敢花钱但前提是
  信任到位"（保障通道）。两条都是消费释放的约束条件，但约束
  来源正交：032 的约束来自过度负债的跨期反噬，本推论的约束
  来自制度信任不足导致保障主观价值打折。

  BR-L2-029（边际消费倾向的收入梯度，candidate）：潜在互补——
  029 讲"多发一块钱谁花得多"，本推论讲"保障承诺让人少存钱
  但前提是信这个承诺"。029 尚未 verified，本推论不引用其为
  承重砖。两条共享的实证挑战——群体异质性可能同时由收入梯度
  （029 通道）和信任梯度（本推论通道）驱动，在经验检验时需
  通过同时控制两个变量来分离。

confidence_floor_note: |
  父砖 BR-L2-031 的 status 为 weakly_verified（IEA=2.0 但范畴错层——
  IEA 测量的是"信任不对称"一般命题，而 BR-L2-031 声称的是"制度信任
  不对称"特殊命题，制度信任直证仅 0.6-1.0，远低于 verified 门槛 1.8）。

  按 Rule D 的精神（子推论置信度不得高于父前提允许的上限），本推论的
  置信度天花板应为 weakly_verified——只要 BR-L2-031 仍为 weakly_verified，
  依赖其机制内核的任何 L3 推论都不可能达到 verified。当前 status=candidate
  符合此约束（candidate 低于 weakly_verified 的上限）。

  额外折扣：BR-L2-024 机制迁移的跨域有效性（法币记忆→社保记忆）
  尚未被经验直证（见 secondary_suspect），这是本推论超越父砖 IEA
  折扣之外的自身脆弱点。

  升级路径：若 BR-L2-031 未来通过制度信任直证积累升级为 verified
  （如跨国机构信任面板在丑闻/改革前后的准自然实验、制度失信后恢复
  的独立自然实验），本推论可同步申请复验复审。

