id: DED-032
type: deduction
layer: L3-deductions
status: verified
term: "消费信贷的自噬循环 (Credit-Consumption Autophagy Cycle)"

人话摘要: "让借钱变容易，头一两年大家确实多花了；但天生看重'现在'的人会借过头，接下来几年工资一到手先还债，手头反而更紧——而且吃过紧日子的人还会额外多存一笔防身钱。于是放贷款这脚油门，同时也在给自己挖刹车：中长期算总账，多花的远没有短期看起来那么多，债务重到一定程度、又没有还款保护机制时，算总账消费反而更少（注册预测，见证伪条款）。给贷款装上'量入为出'的笼子（按收入自动扣款、发放时卡死负债率），这个循环就明显减弱。"

statement: |
  【核心】当现时偏好人群（BR-L2-030 意义上 β<1 的行为人，按事前口径识别）面临
  消费信贷可及性的外生上升（供给侧政策/技术事件驱动，非需求驱动的信贷量增长）时，
  短期（约 t+1 年）消费显著提振；但中长期（约 t+3 年及以后）通过因果链
  "现时偏好→超时间一致基准的过度借贷→债务偿还对可支配收入的合约性侵占+
  坏状态风险敞口扩大→预防性储蓄反弹（BR-L2-028）"，净消费效应显著低于短期效应，
  且压缩幅度【超出】单纯还本付息的机械核算——负债家庭在偿债的同时还会额外重建
  流动性缓冲（预防性超调）。在借贷群体债务收入比（DTI）越过注册阈值、且无承诺
  机制约束的条件下，累计净消费效应可为负（注册强预测，口径见证伪条款）。信贷扩张同时是油门（即刻可得性激活
  现时偏好）和刹车的挖掘机（负债制造的风险敞口激活预防动机）——自噬循环。

  【驱动量】三个前件均独立于消费结果可测——信贷可及性的外生变化（监管/牌照/
  利率上限等供给侧政策文本，事前可查）、借贷人群的现时偏好暴露（产品类型与
  实验/调查测得的 β 参数，事前编码）、承诺机制的有无（合同与监管文本，事前编码）。

  【预测】(i) 外生信贷扩张后，t+3 期的每期消费处理效应显著小于 t+1 期
  （衰减本身与消费平滑共享，见判别——本推论的增量在 ii/iii）；
  (ii) 无承诺机制的扩张中，高 DTI 借贷群体在繁荣见顶后出现【超出合约还款计划】的
  储蓄反弹——一边按期偿债一边额外积累流动性资产（缓冲重建），且该超额分量在
  控制信贷供给收缩与失业冲击后仍存在；(iii) 有承诺机制（发放端 DSR/LTV 硬上限、
  或收入挂钩的状态依存还款）的扩张下，(i) 的超额衰减与 (ii) 的预防反弹显著弱于
  无承诺机制的可比扩张——承诺机制是可逆的干预杠杆。

  【判别】与生命周期/持久收入消费平滑的区别——平滑理论也预测 (i) 的衰减
  （借了要还是会计恒等式），但绝不预测 (ii) 的储蓄超调（平滑只回基线不过冲）、
  不预测 (iii) 的承诺调节、更不预测注册条件下自愿借贷的累计净效应为负（口径 (d)）。与 Minsky 式
  金融不稳定宏观叙事的区别——那是要经过资产价格崩溃/银行危机的总量故事；
  本推论给出【家庭层面梯度】预测：同一宏观环境内，高 DTI 家庭比低 DTI 家庭
  压缩更多消费、重建更多缓冲，不需要银行危机作为中介。

  【边界（不声称）】不声称消费信贷总体有害——对时间一致或受承诺机制保护的
  借贷人，信贷是纯粹的平滑工具；不声称所有信贷繁荣都以消费收缩收场——DTI 未越
  阈值或收入快速增长稀释债务时，只预测衰减不预测反转；不声称流动性约束下
  借钱应急属于过度借贷——为平滑已发生的收入冲击而借贷是预防逻辑的延伸，
  在射程外（见 excluded_outcomes）。

operationalization:
  credit_accessibility_shock:
    definition: "消费信贷可及性的外生上升——供给侧政策/技术事件使既有人群的借贷门槛、额度或成本发生非需求驱动的改善。"
    measurement: |
      从监管与行业制度文本事前编码——放贷牌照放开、利率上限取消、现金预借
      额度上限废除、税收激励刷卡、线上放贷技术准入等，以政策文件生效时点为
      事件时点。禁止用信贷余额增长率本身充当可及性度量（内生于需求）。
    limitations: "干净的供给侧事件稀少；多数信贷繁荣供需混杂，须以政策时点+未受政策覆盖的对照人群识别。"
  present_bias_exposure:
    definition: "借贷人群的现时偏好暴露程度——该人群跨期估值的 β<1 分量。"
    measurement: |
      两条独立于借贷结果的口径，事前注册——(1) 实验/调查测得的 β 参数
      （标准跨期选择范式）；(2) 产品类型代理：以'即刻到账/先享后付/循环额度'
      为卖点的高频小额产品（发薪日贷/现金预借/循环卡债）借款人 vs 抵押
      分期摊还产品借款人，产品分类按合同结构事前编码。
    limitations: "产品类型代理混入流动性约束人群（理性应急借款者），须结合借款用途与收入冲击时序剥离（见 excluded_outcomes）。"
  debt_to_income:
    definition: "借贷群体的债务收入比（DTI）——存量债务对年可支配收入之比。"
    measurement: |
      【一次性注册】分子=家庭全部债务存量（含消费贷/卡债/抵押贷，信贷登记
      或家庭调查口径，同一来源贯穿前后期）；分母=家庭年可支配收入（同一调查
      口径）；群体统计量=借贷家庭组的中位数。阈值注册：累计净效应为负的注册强预测（口径 (d)）
      仅在【组中位 DTI > 1.0（100%）】且无承诺机制时激活；'快速繁荣'定义为
      组中位 DTI 五年内上升 ≥ 20 个百分点。阈值以下只预测衰减，不预测反转。
    limitations: "跨国调查口径差异大；同一体内比较（家庭面板）优于跨国比较。"
  consumption_response:
    definition: "信贷扩张对消费的处理效应及其时间路径。"
    measurement: |
      【一次性注册】分子=实际家庭消费支出（家庭调查或国民核算居民消费，
      同一来源贯穿）；分母=家庭可支配收入（消费率口径）；效应=相对未受
      政策覆盖对照组的 DiD。衰减比 R = t+3 期每期效应 / t+1 期每期效应。
    limitations: "耐用品购买使短期效应含存量调整噪声；以三年移动平均平滑。"
  precautionary_rebound:
    definition: "偿债期内超出合约还款计划的缓冲重建——预防性储蓄的超额分量。"
    measurement: |
      【一次性注册，两层指标，角色不得事后互换】
      [头名指标·存亡检验] 超合约压缩总量 =（流动性资产净积累流量 + 超出合约
      摊还计划的还本）/ 可支配收入。合约摊还计划从信贷登记的应还 schedule 事前
      取；超出部分 = 实际还本 - 合约计划还本（正值为加速去杠杆，负值不计入）。
      【裁决口径·一次锁死】(一)群体统计量=借贷家庭组的中位数（与 debt_to_income
      的注册统计量一致，不依赖外溢）；(二)'负值不计入'的截断层级=组层面先净额、
      后截断——组实际还本总额减组合约计划总额，差为负时记零，禁止裁决日再挑
      （逐户截断后聚合的读法在零假设下产生 E[max(0,噪声)]>0 的正偏，使存亡检验
      的 rejected 触发器近乎死条款，已裁决弃用）。
      相对两个基准取差——(1) 自身繁荣前基线（同一调查工具、繁荣前三年均值）；
      (2) 同期低 DTI 对照家庭。仅按期还本付息在此指标上记零（合约内还款不计入，
      且无超额还本），故该指标与机械摊还正交。头名指标承担 falsifiability(b)
      的存亡检验——其不显著大于 0（含显著小于 0，即家庭净耗竭缓冲）时触发
      rejected（机制上等价于"只按合约还款、无超合约压缩"）。
      [分量·判别性子预测] co-holding 分量 = 流动性资产净积累流量 / 可支配收入
      （即原注册指标），保留为区分 buffer-stock（持债同时持现金）与纯不耐心
      （不持现金）的锐利子预测——该分量读零仅降格判别力，不触发 rejected。
    limitations: "流动性资产数据比债务数据更难获得；须控制繁荣后信贷供给收缩（授信额度削减是供给侧挤压，不是需求侧预防）与失业冲击。"
  commitment_mechanism:
    definition: "对借贷或还款的结构性约束——事前限制过度借贷或使还款状态依存。"
    measurement: |
      从合同与监管文本事前编码，三型注册（封闭枚举）——
      (1) 借贷约束型：发放端 DSR/LTV 硬上限、强制评估偿付能力；
      (2) 自动状态依存型：收入挂钩自动还款（如经税务系统代扣、低于收入门槛
      自动免还），低摩擦、自动触发；
      (3) 【已裁决·不计入】事后状态依存减免（破产免责/法定债务重组/信用恢复
      计划）——虽按伞级判据"使还款状态依存"属状态依存，但属高摩擦通道（须主动
      申请+信用排斥+资产损失），坏状态损失函数仍陡，预防反弹的削弱效应不成立，
      故不计入承诺机制。编码规则：仅 (1)(2) 计'有承诺机制'，任一存在即计；
      辖区破产法慷慨与否不影响编码。
      【反例追溯】美国锚的"无承诺"编码据此复核——Chapter 7 破产免责存在但不计，
      确认"无承诺"编码不翻盘，复核留痕。
    limitations: "纸面上限与实际执行有落差，须辅以'上限是否被触及'的发放数据（拒贷率/贴着上限的堆积）。"

derivation:
  from_l1:
    axioms: [AXIOM-001]
  from_l2:
    bridging: [BR-L2-028, BR-L2-030]
  steps: |
    1. "BR-L2-030 给油门——即刻可得性激活现时偏好，产生过度借贷"
       消费信贷把'现在就消费'从不可行变成即刻可得。双曲贴现下，即刻可得激励
       的行为权重畸高（BR-L2-030 (b)），借贷决策由 β<1 的近端估值主导——
       借贷量系统性超过同一 agent 在时间一致（指数贴现）基准下会选择的量。
       偏好反转（BR-L2-030 (a)）给出可观测足迹：事后后悔、以贷养贷的再融资链、
       对承诺产品的付费需求。此步产出短期消费提振 + '过度'的楔子。
       只有楔子，还没有刹车。

    2. "AXIOM-001 给传导——偿债与消费争夺同一份有限收入，且负债放大坏状态敞口"
       可支配收入有限，偿债是合约性的优先索取权——DTI 越高，未来各期收入中
       被锁定的份额越大，可自由消费的残差越小（机械挤占）。更关键的是风险
       结构变化：负债家庭遭遇收入中断时，后果从'消费下调'升级为'违约/抵押物
       损失/信用排斥'——同样的收入波动，负债使坏状态的损失函数变陡。
       即：过度借贷不仅预支了收入，还【制造了新的不可保险风险敞口】。

    3. "BR-L2-028 给刹车——风险敞口扩大触发预防性储蓄反弹，压缩超出机械核算"
       BR-L2-028 的比较静态：风险敞口越大、外部承接越弱，缓冲动机越强。
       高 DTI 家庭恰好两头占——敞口被步骤 2 放大，而外部承接被削弱（未用
       授信额度本是缓冲的功能等价物，繁荣期已被消耗；繁荣后放贷方还会收缩
       额度）。预防动机被激活：家庭在按期偿债之外【额外】重建流动性缓冲——
       消费被双重压缩（机械偿债 + 预防超调）。合成自噬循环：t 期的油门
       （步骤 1）亲手制造了 t+k 期的刹车（步骤 3），净消费效应显著低于
       短期效应；DTI 越过注册阈值且无承诺机制时，累计净效应可为负（注册强预测，
      口径见证伪条款 (d)）。

    4. "承诺机制的调节（BR-L2-030 (c) 的干预推论）"
       现时偏好催生对承诺机制的需求；反过来，外加的承诺机制切断循环的两个
       环节——借贷约束型（发放端 DSR/LTV 上限）在步骤 1 卡住过度借贷的楔子；
       状态依存型（收入挂钩还款）在步骤 2 拆除坏状态的损失陡坡（收入中断时
       还款自动暂停，敞口不被放大）。两型任一在位，(i) 的超额衰减与 (ii) 的
       预防反弹都应显著减弱——这是方向明确、可逆的干预预测。

    5. "合成与非平凡性（逐格判空）"
       2×2 判据表见 nontriviality_test。承重砖边际贡献诚实点名——
       BR-L2-030 是油门发动机（给过度借贷，但对 t+3 消费动态与储蓄行为沉默）；
       BR-L2-028 是刹车发动机（给缓冲行为，但把风险敞口当外生给定，从未说
       信贷可及性会自己制造敞口）；AXIOM-001 偏约束性（近定义砖，只给预算
       竞争的地板）。'同一信贷扩张既踩油门又挖刹车'的循环闭合不在任何一块
       砖里——两砖必须首尾相接（030 的输出'过度负债'恰好是 028 的输入
       '风险敞口'）才产出本结论，这是真组合增量。

falsifiability: |
  【三条注册口径，分子/分母/测量口径见 operationalization，一次性注册不得事后调整】
  (a) 衰减口径——外生信贷可及性上升后（供给侧政策事件识别），衰减比
  R = t+3 期每期消费处理效应 / t+1 期每期效应（消费率口径 DiD）。预测：
  干净准实验的中位 R 显著 < 1。若中位 R ≥ 1（t+3 效应不小于 t+1，无衰减），
  循环的存在被证伪。诚实标注：R < 1 与消费平滑共享，单靠 (a) 不足以确立
  本推论——(a) 是必要条件检验，独有内容在 (b)(c)。
  (b) 预防反弹口径——无承诺机制的快速繁荣（组中位 DTI 五年 +20pp 以上）中，
  高 DTI 借贷家庭在繁荣见顶（组中位 DTI 峰值年，事前注册）后五年内的头名指标
  （超合约压缩总量 = 流动性资产净积累 + 超出合约计划的还本，见
  operationalization.precautionary_rebound 两层注册）显著 > 0，且群体后续
  储蓄率与滞后 DTI 正相关。存亡检验绑在头名指标上：若头名指标不显著大于 0
  （含显著小于 0，即家庭净耗竭缓冲），则 BR-L2-028 腿被证伪，本推论塌缩为
  平凡的会计恒等式，按 rejected 处理。co-holding 分量（流动性资产净积累/可支配
  收入）保留为判别性子预测——其读零仅降格判别力（不能区分 buffer-stock vs
  纯不耐心），不触发 rejected。
  (c) 承诺调节口径——按合同/监管文本事前编码承诺机制（借贷约束型/自动状态
  依存型；高摩擦减免不计入，见 operationalization.commitment_mechanism），
  在繁荣规模可比（DTI 增幅匹配）的扩张对中，有承诺组的 (a) 超额衰减与 (b)
  头名指标显著小于无承诺组。若有承诺组效应等于或大于无承诺组，
  调节预测被证伪——此仅伤干预杠杆，(a)(b) 核心可独立存活，届时推论须降格
  为'无干预开关'版本并标注。
  (d) 负净效应口径（注册强预测，升格版）——累计窗口：自外生信贷扩张事件年起
  累计至 t+7 年的净消费处理效应（DiD，消费率口径）。统计量：激活条件满足
  （组中位 DTI > 1.0 且无承诺机制）的案例中，累计净消费处理效应的中位数
  ≤ 0。证伪条款：若激活案例中位数显著 > 0，该强预测被证伪，推论降格为
  只含 (a)(b)(c) 的衰减-反弹版本，删除负净效应声明。诚实标注：现阶段激活
  案例稀缺（仅美国 2000s 近似满足，单案例不构成检验），该口径当前靠注册
  纪律撑住，待案例积累后裁决。
  适用区间：仅覆盖消费用途信贷（产品/用途事前分类）流向现时偏好暴露人群
  （事前口径测定）的外生扩张；生产性信贷、时间一致人群、收入冲击应急借贷
  在射程外（见 excluded_outcomes）。

falsification_trace:
  primary_suspect: |
    (b) 腿的归因——繁荣崩后的消费压缩可能全部由三个竞争渠道解释：(1) 合约
    摊还的机械挤占（会计恒等式，任何借贷模型都预测）；(2) 信贷供给收缩
    （放贷方削减额度/拒绝续贷——是'借不到'不是'不敢花'，供给侧而非预防
    动机）；(3) 危机混杂（信贷繁荣常与资产价格周期同步，崩盘期的失业与
    资产缩水独立压制消费——美国 2008 锚正泡在这个混杂里）。招牌预测压在
    '超额缓冲重建在控制这三者后仍显著 > 0'这条腿上——测量最难（流动性
    资产面板数据稀缺），也最可能被推翻。若多数案例的压缩被机械摊还+供给
    收缩+危机冲击完全解释，本推论塌缩为常识会计，核心被证伪。
  secondary_suspect: |
    信贷扩张的外生性——干净的供给侧政策事件稀少（韩国 1999 是少数），
    多数繁荣供需混杂；若可用案例几乎全部内生，(a)(b) 的识别都退化为
    相关性，推论只能停在弱证据区。同族风险：现时偏好暴露的产品类型代理
    混入流动性约束人群，高估 β<1 楔子的贡献。
  unlikely_suspect: "BR-L2-030 的过度借贷步骤——以贷养贷再融资链、承诺产品付费需求在多国信贷市场反复观测，且父砖 IEA=2.1 三独立通道收敛，稳固。"
  note: "primary 若被坐实，(c) 承诺调节也随之失去机制基础——(b) 是全推论的承重心脏，此处诚实认账。"

excluded_outcomes:
  - outcome: "生产性/经营性信贷（企业贷、设备贷、经营周转贷）"
    description: "传导走生产函数不走消费-偿债循环，射程外——按贷款用途/产品分类事前认出。"
  - outcome: "收入冲击后的应急平滑借贷"
    description: "为平滑【已发生且可文档化】的收入中断/大病支出而借贷，是预防逻辑的延伸而非现时偏好楔子——按借贷时点与冲击时点的先后事前认出（冲击在前、借贷在后）。"
  - outcome: "时间一致人群（事前测得 β≈1）或纯抵押分期摊还购房贷（资产置换主导）"
    description: "步骤 1 的楔子不形成，只剩平滑——按事前 β 口径与产品结构认出。为消费目的的房屋净值提取（cash-out）仍在射程内。"
  - outcome: "信贷繁荣与恶性通胀/汇率危机同期的场景"
    description: "货币性冲击主导消费路径，本推论的家庭层面机制不可分离——按宏观事件（通胀率/汇率断裂）事前认出。"

anti_talisman_clause: |
  【防不可证伪护身符——前件判定必须独立于消费结果】
  (1) 禁止由'借过头了'反推'人群现时偏好'——现时偏好暴露只认事前口径
  （实验测得 β / 合同结构编码的产品类型）；若某案例人群按事前口径测不出
  β<1 暴露而仍现自噬循环，不得事后追封'隐性现时偏好'，该案例按机制外
  未解释处理。
  (2) 禁止由'借贷量涨了'反推'可及性外生上升'——外生性只认供给侧政策/
  牌照/技术事件文本；无文档化供给事件的繁荣不得计入支持锚。
  (3) 禁止由'违约了'反推'当初过度借贷'——过度借贷需事前标志（再融资链/
  以贷养贷/超出任何合理用途回报的利率水平/同期承诺产品需求），坏运气违约
  不算。
  (4) 不利证据不得用事后追加的前件消解——'该案例其实有隐性承诺机制'须有
  合同或监管文本证据，且文本证据仅限 commitment_mechanism 注册类型清单内
  （借贷约束型/自动状态依存型）；破产法/法定债务重组等已裁决不计入的文本
  不得用于事后启用隐性承诺机制；'DTI 其实没过阈值'不得启用注册口径之外
  的新算法。
  【削弱条件（明确列出）】若观察到：无承诺机制、组中位 DTI>1.0 的繁荣
  见顶（组中位 DTI 峰值年）后，高 DTI 家庭头名指标（超合约压缩总量）
  不显著大于 0（含显著小于 0）——BR-L2-028 腿被削弱至断裂；
  若观察到承诺机制在位的扩张出现同等强度的衰减与反弹——调节预测被削弱；
  若观察到 t+3 效应 ≥ t+1 效应的干净准实验占多数——循环整体被削弱。

nontriviality_test: |
  2×2 判据表（自变量档:无承诺+现时偏好人群+DTI越阈值的外生扩张 vs
  有承诺或未越阈值的扩张 × 被预测量档:超额压缩[衰减+超合约缓冲重建] vs
  仅平滑衰减[无超调]）：
  格(无承诺+越阈值, 超额压缩)——「非平凡格」——没有任何承重砖平凡地强制它：
  BR-L2-030 只给借贷端的过度楔子，对 t+3 的消费动态与储蓄行为完全沉默；
  BR-L2-028 只给'风险敞口→缓冲'的静态映射，把敞口当外生给定，从未主张
  信贷可及性会内生制造敞口；AXIOM-001 只给预算竞争。循环闭合（030 的
  输出恰为 028 的输入）是真组合增量，可被现实反例填空——若多个'无承诺+
  高 DTI'繁荣的事后压缩全部被机械摊还+供给收缩解释（超额指标≈0），
  该格即被填上、推论被证伪。
  格(无承诺+越阈值, 仅平滑衰减)——「如果被大量填充则证伪本推论」。
  格(有承诺/未越阈值, 仅平滑衰减)——调节/对照格，本推论的边界预测。
  格(有承诺, 超额压缩)——若被填充，调节预测 (c) 被证伪。
  brick=conclusion 自查：'信贷扩张同时制造其自身的消费刹车'未在任何砖中
  原文或近义出现；两父砖均为通用行为命题，非为本推论窄化的专用砖。

real_world_anchors:
  supporting:
    - anchor: "韩国 1999–2003 信用卡繁荣与崩溃（独立测出驱动量的干净锚）"
      evidence: |
        供给侧事件可文档化且先于结果——1999 年政府废除现金预借额度上限、
        对刷卡消费给予所得税抵扣、推行发票彩票以激励卡消费（扩内需政策文本
        可查），信用卡发卡量与卡贷余额随后爆发式增长；以贷养贷（多卡互还）
        在崩溃前被广泛记录，是过度借贷的事前标志。2003 年卡债危机爆发，
        信用不良者约达三百多万人（占经济活动人口显著比例），LG카드 等发卡
        机构陷入流动性危机；2003 年韩国私人消费在 GDP 仍正增长的背景下
        负增长，此后数年家庭消费持续疲弱。驱动量（政策文本）、过度借贷标志
        （再融资链）、结果（消费收缩）三者相互独立测得。
        诚实标注：卡债危机本身构成金融部门冲击，(b) 的超额缓冲分量与供给
        收缩（发卡方大幅削减授信）在此锚中未被干净分离——本锚强支撑
        (a)+步骤1，对 (b) 只提供方向一致的背景。
      confidence: strong
    - anchor: "美国 2002–2007 房屋净值提取繁荣 → 2008–2012 去杠杆消费收缩（家庭层面梯度）"
      evidence: |
        繁荣期房屋净值提取（cash-out/HELOC）每年数千亿美元规模流向消费；
        Mian & Sufi 系列研究以县级面板发现——2002–06 年家庭杠杆上升越多的
        县，2007–09 年消费下降越深，家庭层面 DTI 梯度与消费收缩幅度单调，
        与本推论的'高 DTI 家庭压缩更多'预测方向一致。个人储蓄率从 2005 年
        约 3% 的低点回升至 2010–2012 年的 7–9% 区间，高于繁荣前夜水平，
        且去杠杆与流动性资产回补并行发生——方向上支持 (b) 的超调。
        诚实标注：此锚泡在房价崩溃+失业的危机混杂里（primary_suspect
        点名的第 3 渠道），信贷供给同期急剧收缩；梯度证据（同一宏观环境内
        跨县比较）部分消化该混杂，但 (b) 的净超额分量未被单锚坐实。
      confidence: moderate
    - anchor: "中国 P2P 网贷 2014–2018（步骤 1 的过度借贷标志锚）"
      evidence: |
        平台数与借贷余额 2014–2017 爆发（余额峰值约万亿元级），准入近乎
        无门槛+即刻到账的产品设计精准踩中即刻可得激励；'以贷养贷'、
        多头借贷在监管通报与行业征信数据中被大量记录——偏好反转的事前
        标志密集出现。2018 年平台集中爆雷、行业清退，借款人陷入偿债链。
        诚实标注：借款人事后消费路径缺乏干净的家庭面板证据，本锚只承重
        步骤 1（现时偏好→过度借贷）与产品-人群匹配的机制真实性，
        不承重 (a)(b) 的消费动态——宁可窄用，不过度解读。
      confidence: weak
  counterexamples: []
  boundary_cases:
    - case: "英国/澳大利亚收入挂钩学生贷款（状态依存型承诺机制）"
      analysis: |
        债务存量巨大，但还款经税务系统按收入自动代扣、收入低于门槛自动
        暂停——坏状态敞口被合同结构拆除（步骤 2 被切断）。本推论预测：
        此类债务不应引发预防性储蓄反弹，消费压制显著弱于美国式固定还款
        学生债。承诺机制按合同文本事前编码，非事后开脱。若此类人群仍现
        同等强度的缓冲超调，(c) 被证伪。
      status: boundary_case
    - case: "美国 1950s 分期付款信贷繁荣——扩张但无自噬"
      analysis: |
        作者自做的反例猎捕。战后分期信贷大扩张伴随消费长期繁荣，无事后
        收缩——表面反例。按注册口径消化：(1) 收入高速增长持续稀释债务，
        组 DTI 远未越 1.0 阈值；(2) 分期合同为刚性摊还+发放端收入审查，
        属借贷约束型承诺机制的弱形式。两个消化条件（DTI 口径/承诺编码）
        都是事前注册的，非事后新增。诚实认账：该案例显示阈值与承诺编码
        承担了大量解释负荷——若未来发现'无承诺+越阈值'仍无自噬的案例，
        不得再造新豁免条款。
      status: boundary_case
    - case: "小额信贷 RCT（六国证据）——温和效应，无自噬也无奇迹"
      analysis: |
        Grameen 式小额贷带组内连带+刚性周还款计划（强承诺结构），多国
        RCT 显示消费效应温和、无系统性事后收缩——与 (c) 的'有承诺机制
        →循环减弱'一致；同时贷款多为经营用途，部分在射程外（按用途
        事前分类）。作为承诺调节的方向性支持，不承重核心。
      status: boundary_case

discriminant_validity: |
  【独有可证伪预测】相对相邻理论逐一判别——
  (1) vs 生命周期/持久收入消费平滑：平滑预测衰减 (a)，但不预测超合约的
  缓冲重建超调 (b)、不预测承诺机制的调节 (c)、绝不预测自愿借贷的累计净
  效应为负（口径 (d)）。(b)(c)(d) 是平滑理论不覆盖的独有内容。
  (2) vs Minsky/信贷周期宏观理论：那是总量金融不稳定叙事，传导必经资产
  价格崩溃/银行危机；本推论的家庭层面 DTI 梯度预测（同一宏观环境内高 DTI
  家庭压缩更多、重建更多缓冲）不需要银行危机中介，可在无危机的温和繁荣
  尾部检验。
  (3) vs '债务积压'（debt overhang）纯会计观点：积压观只讲机械挤占，
  本推论额外锁定预防超调分量（头名指标 > 0）与其承诺机制开关——
  这两条是会计恒等式给不出的。
  【防平凡化守卫】非平凡内核精确定位在三处，不压在会被常识吸收的卖点上——
  '借了要还'是会计常识，不是本推论卖点；卖点是 (a') 过度借贷楔子可由
  事前测得的现时偏好暴露预测（人群×产品匹配），(b') 偿债期的压缩超出
  机械核算的预防超调分量（头名指标·超合约压缩总量），(c') 承诺机制作为可逆干预
  杠杆——注册两型承诺（借贷约束/自动状态依存；第三类高摩擦减免不计入）分别切断循环的两个环节，
  切断点不同但方向预测相同。

relation_to_system: |
  与相邻推论的分工——DED-031 讲科层组织内指标信息的策略失真（信息通道），
  本推论讲市场中信贷-消费的跨期行为内循环（资源通道），无共享前提砖。
  与 DED-028（价值储藏-交易媒介解耦）同属货币-行为域但机制正交：028 讲
  货币功能维度的迁移次序，本推论讲负债对消费路径的自反馈。BR-L2-029
  （边际消费倾向收入梯度，candidate）与本推论互补不依赖——029 讲转移
  收入落地时谁花得多，本推论讲借来的消费如何反噬自身；029 尚未 verified，
  本推论不引用其为承重砖。首个把 BR-L2-028 与 BR-L2-030 首尾相接的 L3
  推论——030 的输出（过度负债）恰为 028 的输入（风险敞口），
  验证了两砖接口的可组合性。

review_summary: |
