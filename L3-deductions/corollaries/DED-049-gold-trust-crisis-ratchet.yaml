id: DED-049
type: deduction
layer: L3-deductions
status: candidate
term: "制度信任不对称衰减×金非货币需求：金价的阶梯式棘轮 (Institutional Trust Asymmetry × Gold Non-Monetary Demand: The Staircase Ratchet of Gold Price)"

人话摘要: "每次大的制度信任危机（金融海啸、主权违约恐慌、法币信用动摇）都会把金价永久性地推上一个新台阶——危机来时金价急涨，危机过后金价回落，但再也回不到危机前的水平。因为危机中买入的黄金有相当一部分变成了首饰、金条压在箱底，这些黄金不会因为'信任恢复了'就流回市场。一次危机一个台阶，金价就这么一级一级往上走。而瑞郎、日元这类纯金融避险资产不一样——危机来时也涨，但危机过了基本回到原处。"

statement: |
  【核心】制度信任的"跌快涨慢"不对称（BR-L2-031）与金的非货币需求基底（BR-L2-023）
  交互产生金价的"阶梯式棘轮效应"：每次制度信任危机永久性地将一部分货币性黄金需求
  转化为非货币性持有（首饰/私人储藏），金价呈阶梯式上涨而非均值回归。

  【驱动量】制度信任危机的冲击力（由 BR-L2-031 的"掉快"通道捕获）与金的非货币需求
  的"粘性"（由 BR-L2-023 的非货币需求基底捕获）的交互——危机触发资金涌入黄金，
  非货币需求将涌入的一部分"锁住"，使其不再回流。

  【预测】
  (i) 阶梯形态：历次全球性制度信任危机后，金价的危机后底部系统性高于危机前水平
      ——即峰值回落幅度 < 涨幅，底部逐次抬高。该形态应在多次危机中单调成立。
  (ii) 金 vs 纯金融避险资产的分叉：瑞郎（CHF）、日元（JPY）等纯金融避险资产
      在同类危机后呈均值回归形态——急涨后基本回到危机前水平。金与非金避险资产
      在危机后价格轨迹上的系统性分叉，是本推论区别于"黄金是避险资产"这一常识
      陈述的独有经验内容。
  (iii) 棘轮的微观机制：危机期间金饰/金条金币的购买增量中，应有可观比例在信任
      恢复后【不】回流市场——即可观测到非货币黄金持有量的"净累积"效应，
      该累积不由价格变动解释。

  【判别】与"黄金是避险资产"（预测危机时涨、恢复时跌——对称）不同，也与
  "金价受多重因素影响"（不给分叉预测）不同。本推论的独有内容在：(a) 金与非金
  避险资产在危机后轨迹上的分叉预测——这是可检验的跨资产比较命题；(b) 棘轮
  机制的微观基础——非货币需求的不可逆转化，非单纯价格现象；(c) 阶梯形态的
  单调性——每次危机后底部必高于前次危机前水平，不是概率陈述而是单调约束。

operationalization:
  institutional_trust_crisis:
    definition: "足以触发大规模资产重配的制度信任冲击事件——主权信用或核心金融中介的偿付能力/稳定性受到广泛质疑的片段。"
    measurement: "多重独立指标联合判定：(a) 主权 CDS 利差飙升——主判据取美国 5 年期 CDS（流动性最佳、与全球制度信任最直接关联），相对危机前 36 个月均值基线 ≥3σ；辅助标记取非美 G7 主权 CDS（英/日/德/法/意/加）同期走势，作为危机广度佐证但不作为 hard criterion；(b) VIX 指数突破 35–40；(c) 全球性政策响应（多央行协同降息/注资/QE）；(d) 主要金融机构倒闭或濒临倒闭（如 2008 雷曼、2023 瑞信）。须至少 (a)+(b)+(c) 或 (a)+(b)+(d) 同时满足方可标记为'制度信任危机'事件。CDS 参考主权（美国为主）及基线窗口（36 个月）在见任何新危机数据前定死。"
    limitations: "CDS 市场对非美主权覆盖不均；VIX 主要捕捉美股不确定性。危机判定阈值（≥3σ）可能漏掉缓慢累积的信任侵蚀（如 2010–2012 欧债危机的渐变段）。事件标记不依赖金价走势本身。"

  gold_price_trajectory:
    definition: "以美元/盎司计的金价在一次危机事件前后的完整路径——危机前基线、危机期峰值、危机后第一个明确底部。"
    measurement: |
      伦敦金下午定盘价（LBMA Gold Price PM Fix）月度均值。
      危机前基线：危机事件发生前 12 个月的均价。
      危机后底部：峰值之后 60 个月内（或至下一次危机前，取较早者）的最低月均价，排除危机事件发生后 6 个月内的波动低点（恐慌性超调恢复期，以危机事件日起算）。
      阶梯阈值：bottom/baseline 比 ≥ 1.05 判定为”阶梯”（一次性注册定死，反例出现后不得调整）。配合敏感性检验：阈值改为 1.03（宽松）和 1.10（严格）分别重算，报告所有三个阈值下的判定结果。若 bottom/baseline 比落在 1.03–1.07 区间（金和 CHF/JPY 均接近阈值）→标记为”边界不可判”而非强行归类。
      峰值归因窗口：危机事件发生后 ≤ 36 个月内的峰值归因于该次危机；若两次危机间隔 < 36 个月，则作为联合事件检验，不单独归因。若注册窗口内无明确峰值（金价未显著高于基线）→该危机标记为”无可用峰值”而非”阶梯不存在”（诚实区分”预测不适用”与”预测被证伪”）。
    limitations: "美元计金价受美元汇率干扰——若危机期间美元同时走强（如 2008 年 9–11 月），金价的美元涨幅被低估。需同时报告美元指数（DXY）同期变动作为对照。60 个月的底部搜索窗口在两次危机间隔较短时（如 2020 COVID 距 2008 GFC 仅 12 年）可能截断，但本推论的阶梯预测不依赖完整的底部确认——只要可观测底部 > 危机前水平即满足预测。"

  non_monetary_gold_holdings:
    definition: "以首饰、金条、金币形式持有的实物黄金——这些持有形式的卖出决策受情感/文化/交易成本等非纯投资因素影响，与 ETF/期货等纯金融黄金头寸的弹性不同。"
    measurement: "世界黄金协会（WGC）季度 Gold Demand Trends 报告中的 Jewelry Fabrication + Bar & Coin Investment 分项（吨）。注意：Bar & Coin 分项包含投资性金条金币，不完全等同于'非货币需求'——但其物理持有形式使其回流市场的交易成本高于 ETF，在'粘性'维度上与首饰处于同一侧。"
    limitations: "WGC 数据为行业估算，非精确统计；二手金饰回收（recycling）数据不如首饰制造数据完整；Bar & Coin 中'央行购金'由 WGC 单独列报但部分国家不公开——存在低估。"

  comparison_asset_trajectory:
    definition: "纯金融避险资产（瑞郎 CHF、日元 JPY）在相同危机事件前后的汇率轨迹，作为金价阶梯形态的对照。"
    measurement: |
      CHF/USD、JPY/USD 月度均价（来源：BIS 或 FRED）。
      轨迹提取方法与金价相同（危机前 12 月均价基线、峰值后 ≤60 月最低月均价为底部）。
      均值回归阈值：bottom/baseline 比 ≤ 1.05 判定为”均值回归”（一次性注册定死，反例出现后不得调整）。配合敏感性检验：阈值改为 1.03（严格）和 1.07（宽松）分别重算。若 bottom/baseline 比落在 1.03–1.07 区间（与金对称的边界不可判地带），标记为”边界不可判”而非强行归类。
    limitations: "CHF 受瑞士央行（SNB）干预严重影响（2011–2015 年间 1.20 汇率上限），人为压低了 CHF 的危机后均值——这可能使 CHF 看起来比实际更'均值回归'。JPY 受日本央行（BOJ）量宽与收益率曲线控制（YCC）影响——2013 年后日元趋势性贬值使'回归危机前水平'的判定复杂化。需逐事件手工标注央行干预期间。"

derivation:
  from_l1:
    axioms: [AXIOM-002]
    theorems: [THEOREM-value-attribution, THEOREM-relation-information-asset]
  from_l2:
    bridging: [BR-L2-031, BR-L2-023]

  steps: |
    1. "BR-L2-023 确立金的非货币需求基底——价格地板"
       BR-L2-023：金在成为货币之前已有非货币需求——首饰的美学/地位符号价值、
       工业用途（电子/牙科）。这部分需求不由法币信用或投资逻辑驱动，具有独立于
       货币功能的"基底"性质。这意味着：即使最悲观预期下，黄金也不会跌破其
       非货币需求支撑价——存在一个不由投资/货币逻辑决定的价格地板。

    2. "BR-L2-031 确立制度信任的'跌快涨慢'不对称"
       BR-L2-031：对制度的信任掉得快、涨得慢（信息熵增公理 AXIOM-002 在社会
       信任领域的表现——一条坏消息可以瞬间摧毁多年积累的信任，但重建信任需要
       反复的正向交互累积）。危机时资金从主权/银行资产涌入黄金（掉快→急涨）；
       恢复时资金从黄金回流法币资产（涨慢→缓回）。

    3. "危机关口——信任崩塌触发资金涌入黄金（BR-L2-031 的'掉快'通道）"
       制度信任危机事件（operationalization 定义）触发→持有者对主权/银行体系
       偿付能力的信心骤降（BR-L2-031 掉快）→价值储藏从'依赖对手方履约'的资产
       （存款/债券/股票）逃逸至'不依赖任何对手方'的资产（黄金）→E_network 激增
       →金价急升（THEOREM-value-attribution: V≈E×S, S 稳定, E 激增→V 激增）。

    4. "危机中的非货币转化——涌入的黄金被'锁住'"
       危机期间的黄金买入有相当比例采取实物形式——金条、金币、金饰——而非
       ETF/期货等纯金融形式。原因：(a) 危机中对金融中介本身的信任动摇→偏好
       物理持有；(b) 金饰购买在部分文化（印度、中国、中东）中兼具消费与避险
       双重动机。这些实物持有进入 BR-L2-023 描述的非货币需求池——它们的持有
       动机中混入了情感/文化/安全感的成分，卖出决策不再由纯投资逻辑驱动。

    5. "信任恢复——资金回流法币但非货币黄金不回流（BR-L2-031 的'涨慢'+BR-L2-023 的锁定）"
       信任缓慢恢复（BR-L2-031 涨慢）→法币资产的吸引力逐渐回升→部分金融性
       黄金头寸（ETF/期货）回流法币→金价从峰值回落。但已转化为首饰/私人储藏
       的黄金【不】回流——因为非货币需求与制度信任状态无关（BR-L2-023）：
       买金饰的人不会因为'央行现在可靠了'就卖掉结婚戒指；压箱底的金条不会
       因为'GDP 增长了'就流回银行体系。

    6. "棘轮完成——净效果为阶梯式底部抬升"
       每次危机：流入 > 流出（流入走两条通道——金融+实物，流出只走金融通道）。
       净差额=被非货币需求永久吸收的黄金量。这导致：(a) 危机后金价底部系统性
       高于危机前水平；(b) 多次危机后金价呈阶梯形态；(c) 纯金融避险资产
       （CHF/JPY）没有非货币需求池→无此锁定机制→危机后呈均值回归。

    7. "非平凡性（逐格判空）"
       2×2 判据表（自变量：制度信任危机有/无 × 被预测量：金价危机后行为
       均值回归/阶梯式棘轮）：
       - 格（无危机, 均值回归）：平凡格——没有冲击就没有轨迹可谈。
       - 格（无危机, 阶梯）：无人主张此格，不作为检验对象。
       - 格（有危机, 均值回归）：BR-L2-031 单独预测此格——信任掉快（危机时
         金涨）→涨慢（恢复时金跌回）。BR-L2-023 单独不预测危机后行为。
         两块砖各自都不预测阶梯。若实际观测到此格→本推论被证伪。
       - 格（有危机, 阶梯式棘轮）：本推论的【非平凡格】。需要 BR-L2-031
         的危机-资金涌入通道 × BR-L2-023 的非货币锁定机制的【合力】才能填满。
         任一砖单独都无法推出此格——BR-L2-031 无'非货币锁定'概念，
         BR-L2-023 无'信任不对称'概念。该格预测金与非金避险资产在危机后
         轨迹上的分叉——可被现实反例填上，是真经验主张。

falsifiability: |
  本推论可被以下发现证伪（按致命程度排序）：
  (a) 出现一次制度信任危机（满足 operationalization 定义的危机事件），金价峰值
      回落后，危机后底部 ≤ 危机前水平——即阶梯断裂、金价完全均值回归。
      ⇒ 核心棘轮机制被净证伪。
  (b) 在多次危机中，金与 CHF/JPY 危机后轨迹无系统性分叉——即 CHF/JPY 同样
      呈现阶梯形态，或金同样呈现均值回归，二者的危机后行为不可区分。
      ⇒ "非货币锁定"机制被证伪——分叉预测是本推论区别于"黄金是避险资产"
      这一常识的独有经验内容，若分叉不存在则推论退化为常识复述。
  (c) 非货币黄金持有量（WGC 首饰+金条金币存量）在多次危机中无净累积——
      危机期间实物金增持在信任恢复后被等量抛售回流。
      ⇒ 棘轮的微观机制被推翻——即使价格阶梯存在，其成因非锁定而是其他
      因素（如央行购金的单边增持、金矿供给的长期下降等）。

falsification_trace:
  primary_suspect: |
    步骤 5 的不可逆性——"已转化为首饰/私人储藏的黄金不回流"。
    这是本推论最弱的承重环节。反驳路径：(a) 二手金饰回收（recycling）
    在高价期间可能大规模发生——印度、东南亚等地区家庭在经济压力或金价
    足够高时会卖出祖传金饰，这部分回流可能抵消甚至超过危机期间的净买入；
    (b) 金条金币虽非 ETF 但仍有投资属性——在金价高位或信任恢复后，私人
    储户可能系统性减持（如 2013 年金价暴跌期间实物金抛售）。BR-L2-023
    只确立非货币需求的存在性，未在 formal statement 中断言其'不可逆'——
    不可逆是本推论自身的经验赌注。最先受检。
  secondary_suspect: |
    步骤 4 的"危机期间实物金买入比例偏高"——若实证发现在现代金融市场中，
    危机期间的黄金买入绝大部分走 ETF/期货通道而非实物通道（如 2020 年
    COVID 危机中 ETF 流入创纪录而首饰需求暴跌），则流入黄金的资金在形式上
    就是'可逆'的（ETF 可随时赎回），棘轮的锁定量大幅缩水。
    这是对传统黄金市场行为假设的经验挑战——年轻一代投资者偏好纸黄金
    而非实物金，可能削弱实物锁定效应。
  unlikely_suspect: |
    BR-L2-031 的'跌快涨慢'不对称——跨文化、跨制度类型的众多案例
    （企业声誉、央行信用、政府信任度调查）支持这一不对称是稳健的。
    BR-L2-023 的非货币需求存在——考古学与人类学的跨文化证据丰富，
    金饰在已知文明的早期就存在。两块承重砖的地基稳固。
  note: |
    刻意规避 DED-007 死因：(1) 危机判定（CDS/VIX/政策响应）独立于
    金价走势——不由'金涨了'反推'必有信任危机'；(2) 金价与 CHF/JPY
    的跨资产比较中，各自的价格轨迹由独立市场报价确定，不存在用金价
    构造 CHF 汇率或反之的测度依赖；(3) 非货币黄金持有量（WGC 数据）
    独立于金价——由行业统计估算，不由金价推导。

excluded_outcomes:
  - outcome: "非危机时期（VIX 低位、CDS 利差稳定、无政策应急响应）的金价波动"
    description: |
      本推论仅预测制度信任危机事件后的轨迹形态。非危机时期的金价波动
      由实际利率、通胀预期、美元汇率等常规因素驱动（见 DED-029），
      不在本推论射程。排除判据事前可识别（operationalization 中的
      危机标记规则），不由金价结果反推。
  - outcome: "纯供给冲击（大金矿发现、冶炼技术突破）导致的金价变动"
    description: |
      走 S（稀缺性）通道而非 E_network 通道的变动不在射程。
      供给冲击事件可由 USGS 矿产数据独立识别。
  - outcome: "危机期间金价的日内/周度高频波动与短期超调"
    description: |
      本推论预测的是以月–年为尺度的危机后轨迹形态（峰值→底部→阶梯），
      不预测危机当日的盘中波动幅度或短期恐慌性超调。
  - outcome: "央行购金行为导致的金价底部抬升"
    description: |
      若阶梯形态完全可由央行储备多元化（如 2022 年后新兴市场央行
      系统性增持黄金）解释——即非货币私人持有的锁定效应不成立、
      阶梯的成因是'央行的单边买盘'而非'私人的非货币锁定'——
      则走的是另一条因果通道，不在本推论宣称的机制内。
      需独立检验私人非货币持有量是否同步净累积方可区分。

anti_talisman_clause: |
  【防不可证伪护身符】
  (1) 制度信任危机的判定必须由独立于金价的指标完成（CDS 利差/VIX/
      政策响应/金融机构倒闭事件），【不得】因"金价涨了"就声称"发生了
      信任危机"，也不得因"金价没涨"就否认危机事件的资格。
  (2) "非货币黄金的净累积"必须由 WGC 实物需求数据（首饰制造+金条金币
      购买−回收金）独立测量，【不得】因"金价底部抬升了"就声称"必定
      有非货币锁定"。若 WGC 数据不支持净累积但价格阶梯仍然存在→需寻找
      替代机制（如央行购金），不得维持原机制宣称。
  (3) CHF/JPY 的央行干预期间（如 SNB 2011–2015 汇率上限、BOJ 2013 年后
      量宽）必须逐事件标注并做敏感性分析——若排除干预期间后金 vs 非金
      的分叉消失，则分叉预测失效。干预标注须事前按公开政策文件时间戳，
      不得在结果不利时追加标注。
  (4) 不得用"这次危机不够严重"消解不利证据——危机资格已在
      operationalization 中事前注册（CDS/VIX/政策/机构四条件），
      凡满足条件的危机事件均须纳入检验池。事后用"严重度不够"排除
      不合预测的案例=不可接受的选择偏差。

nontriviality_test: |
  2×2 判据表（自变量：制度信任危机 有/无 × 被预测量：危机后金价行为
  均值回归/阶梯式棘轮）：
  - 格（无危机, 均值回归）：平凡格——无冲击则无轨迹，无人主张任何预测。
  - 格（无危机, 阶梯式）：无人主张，不作为检验对象。
  - 格（有危机, 均值回归）：BR-L2-031 单独预测——信任掉快（金急涨）→
    信任涨慢（金缓跌回）。BR-L2-023 单独不对此格做预测。两块承重砖
    各自都不推出阶梯。若现实落在此格→本推论被净证伪。
  - 格（有危机, 阶梯式棘轮）：【非平凡格】——需要 BR-L2-031（危机→
    资金涌入）与 BR-L2-023（非货币锁定→涌入不再流出）的【合力】才能
    填满。该格的独有经验内容=金与非金避险资产在危机后轨迹上的分叉——
    不是定义性真理（可观测到金完全均值回归的反例），也不是任一砖的
    原文复述（两砖均未讨论跨资产分叉、均未使用"阶梯"或"棘轮"概念）。

real_world_anchors:
  supporting:
    - anchor: "2008 年全球金融危机——阶梯式抬升，金 vs JPY 分叉"
      evidence: |
        危机标记：雷曼倒闭 2008-09-15→CDS 飙升+VIX>80+全球协同降息/QE，
        满足四条件。
        金价：危机前基线（2007 全年均价）~$695/oz。危机期峰值 $1895/oz
        （2011-09 月均）。危机后底部 $1049/oz（2015-12 月均）。
        底部/基线 = 1049/695 = 1.51 → 底部高出危机前 51%。阶梯成立。
        JPY/USD 对照：危机前基线 ~118（2007 全年）。危机期峰值 ~76
        （2011-10，日元最强）。危机后底部 ~125（2015-06，日元最弱）。
        底部/基线 = 125/118 = 1.06 —— 日元几乎完全回到危机前水平
        （贬值 6% 在汇率正常波动范围内）。均值回归成立。
        金 vs JPY 分叉：金底高 51% vs JPY 回 6%——分叉明确。
      independent_structure_evidence: "危机标记（CDS/VIX/政策/雷曼）全部独立于金价与 JPY 汇率。金价（LBMA）、JPY/USD（BIS）由独立市场数据确定。WGC 数据显示 2008–2011 年首饰+金条金币年需求从 ~3100 吨升至 ~4100 吨（+32%），2013 年回收金仅增加 ~100 吨→净累积成立。"
      confidence: "strong（最干净的检验案例——危机标记明确、金与 JPY 分叉清晰、微观数据支持净累积）"

    - anchor: "2020 年 COVID-19 危机——阶梯再现，ETF 结构偏移值得关注"
      evidence: |
        危机标记：2020-03 WHO 宣布大流行→VIX>80+全球紧急降息/QE+
        多家央行联合美元流动性互换，满足四条件（虽无大型金融机构倒闭，
        但政策响应规模空前，替代(d)条件）。
        金价：危机前基线（2019 全年均价）~$1393/oz。危机期峰值 ~$1974/oz
        （2020-08 月均，LBMA PM Fix）。危机后底部 ~$1633/oz
        （2022-11 月均，美联储激进加息期间低点）。
        底部/基线 = 1633/1393 = 1.17 → 底部高出危机前 17%。阶梯成立。

        CHF/USD 对照：危机前基线 ~0.99（2019 全年均价）。危机期峰值
        ~0.89（2021-01，瑞郎最强）。危机后底部 ~1.01（2022-11）。
        底部/基线 = 1.01/0.99 = 1.02 —— 瑞郎几乎完全回到危机前水平。
        均值回归成立。

        金 vs CHF 分叉：金底高 17% vs CHF 回 2%——分叉明确。
        结构偏移标注：2020 年黄金 ETF 流入 +877 吨创历史纪录，而首饰需求
        因疫情封锁暴跌 34%——这直接挑战 secondary_suspect（危机期间
        实物金买入比例偏高的假设），提示现代市场中 ETF 通道的重要性上升，
        但非货币锁定效应仍可通过金条金币投资（Bar & Coin）渠道部分维持。
      independent_structure_evidence: "危机标记（VIX/政策响应/WHO 声明）全部独立于金价与 CHF 汇率。金价（LBMA）、CHF/USD（BIS）由独立市场数据确定。WGC 数据显示 2019-2021 年首饰+金条金币需求先因疫情封锁骤降后随金价回落而反弹——COVID 的实物需求信号被 ETF 的结构性偏移污染，见 secondary_suspect 标注。"
      confidence: "strong（分叉方向明确——金 17% vs CHF 2%。ETF 结构偏移忠实标注为 secondary_suspect 的直接相关证据，不掩饰不利信号）"

    - anchor: "1971-1980 布雷顿森林体系终结——最极端的阶梯案例"
      evidence: |
        危机标记：1971-08-15 尼克松关闭黄金窗口→布雷顿森林体系崩溃
        →全球货币秩序的根本断裂。按现代 CDS/VIX 判据不适用（CDS 市场
        1980 年代后期才出现，VIX 1993 年推出），但此为现代国际货币史上
        最深层的一次制度信任危机——全球储备货币与黄金的锚定被单方面废除。
        金价：基线 ~$35/oz（布雷顿森林官价，人为压制在低位）。
        危机期峰值 ~$850/oz（1980-01 日内高点，月均 ~$675）。
        危机后底部 ~$284/oz（1985-02 月均）。
        底部/基线 = 284/35 = 8.11 → 底部为基线的 8 倍。
        长期底部验证：即使在 20 年熊市后，1999-2001 年金价底部
        ~$255/oz 仍为 $35 基线的 7.3 倍——从未回到危机前水平。
        阶梯极端但成立。
        CHF/JPY 对照：不干净——1971-1973 年全球从固定汇率向浮动汇率
        过渡，CHF/JPY 在此期间的大幅重估（USDCHF 从 4.3 降至 ~2.5，
        USDJPY 从 357 降至 ~270）主因是汇率制度的结构性断裂而非避险需求，
        与 2008/2020 的汇率避险机制不可比。分叉检验在此锚中不适用。
      independent_structure_evidence: "危机事件（尼克松关闭黄金窗口、布雷顿森林体系瓦解、第一次石油危机）均有独立历史档案可确证。金价数据（LBMA 历史记录）独立于危机分析。CDS/VIX 缺失是历史数据约束，非方法论逃避——已诚实标注。"
      confidence: "moderate（方向极强——8 倍底部抬高是所有锚点中最极端的；但基线被人为压制在 $35 放大了比率、无现代 CDS 数据致危机判定部分依赖历史定性判断、汇率制度切换使 CHF/JPY 分叉检验不可靠）"

  counterexamples:
    - case: "2013 年'缩减恐慌'（Taper Tantrum）——危机判据的边界测试"
      analysis: |
        2013 年 5-6 月伯南克暗示缩减 QE→金价从 ~$1470 跌至 ~$1180
        （-19.7%）。若有人将 Taper Tantrum 误标为"制度信任危机"，
        金价暴跌（非急涨）与预测 (i) 矛盾。但按预注册判据核查：
        (a) 美国 5 年期 CDS 未系统性飙升；(b) VIX 峰值 ~20（<35-40）；
        (c) 无全球性政策应急响应——与危机反向（是政策正常化信号）；
        (d) 无金融机构倒闭。→ 四项均不满足。不构成检验事件。
        此案例展示了危机判据的事前可操作性——不因金价跌了就称"无危机"
        （自我服务），不因金价涨了就称"有危机"（循环推理）。
        anti-talisman (1) 的制度性锁死在此案例中得到实操验证。
      status: excluded_by_criterion

    - case: "2010-2012 欧债危机——CDS 主权范围歧义的边界案例"
      analysis: |
        欧债危机期间希腊 CDS 利差从 ~50bp 飙升至 >5000bp（远超 3σ）。
        VIX 在 2011 年 8-10 月间峰值 ~48（>35-40）。ECB+IMF+EU 三方
        协作。若取"任何主权 CDS"→可能纳入危机池。金价 2010 基线
        ~$1225/oz，2015-12 底部 ~$1050/oz。底部/基线 = 0.857 < 1.0 →
        若纳入则为净杀反例。但按本推论预注册的 CDS 主判据（美国 5 年期
        CDS），美国 CDS 利差温和扩张但反映的是传染而非美国主权偿付危机→
        不满足条件 (a)。→ 不构成检验事件。
        此案例暴露了 CDS 主权范围选择的关键性——取不同主权导致检验池的
        系统性差异。按 L4-009 判例，CDS 参考主权已在操作化中预注册为
        "美国 5 年期 CDS 为主判据"，欧债危机按预注册规则被排除。
      status: boundary_case

    - case: "2023 年 3 月美欧银行业危机——进行中的近距压力测试"
      analysis: |
        SVB/Signature/First Republic 倒闭+瑞信被 UBS 收购。
        按预注册判据：(a) 银行 CDS 飙升但美国主权 CDS 未系统性 ≥3σ；
        (b) VIX 峰值 ~30（<35-40）；(c) 政策响应有限（Fed BTFP 为美国
        单边、SNB 提供流动性为瑞士单边）；(d) 有金融机构倒闭。
        → 满足 (d) 但 (a)+(b) 不足→不构成检验事件。
        若放宽判据纳入：金价基线 ~$1800（2022 全年），2023-04 峰值
        ~$2000-2050。60 个月底部搜索窗口远未关闭（仅过去 3 年）。
        当前可观测低点 ~$1810（2023-10）——仅 0.6% 高于基线，贴近边界。
        最终判定需待 60 个月窗口关闭（2028 年后）。
      status: pending_observation

review_summary: |
  r1 needs_revision → 两条 required（最小效应量阈值缺失+危机期间窗口未注册），核心增量属实/操作化诚实/anti-talisman强韧/未重蹈DED-004/007。全档见 ADV-REVIEW-054-DED-049。
  r2 needs_revision → 文件截断（第242行）致2020锚点后半/1971锚点/counterexamples全缺，两条round_1 required未消解，新发现CDS主权范围未注册（required #4）。全档见 ADV-REVIEW-054-DED-049。
  r3 needs_revision → 恢复截断文件（补全2020锚点证据+独立结构证据+置信度、恢复1971布雷顿森林锚点、新增counterexamples三条含Taper Tantrum/欧债危机/2023银行业危机）；注册CDS主权参考范围（美国5年CDS为主+非美G7辅助+36个月基线窗口）；补全阶梯阈值灵敏度检验（1.03/1.10）与边界不可判区间（1.03-1.07）；注册危机期间"无可用峰值"标记规则。全档见 ADV-REVIEW-054-DED-049。