id: DED-048
type: deduction
layer: L3-deductions
status: candidate
term: "算法结算成本×通用媒介收敛：从技术必然到制度选择 (Algorithmic Settlement Cost × Universal Medium Convergence: From Technical Necessity to Institutional Choice)"

人话摘要: "以前大家非得用同一种钱,不是因为'用同一种钱方便',而是因为不用同一种钱的话,算清楚'我欠你、你欠他、他又欠她'这笔七拐八绕的账实在太贵了——人脑算不过来。现在算法把算账的成本压到了几乎为零,从技术上来说,同时用好几种钱、让算法自动找最优兑换路径,完全行得通。所以以后大家还用不用同一种钱,不再是'不算不行'的技术问题,而是'大家选择用同一种'的制度/习惯/网络效应问题。"

statement: |
  【核心】BR-L2-012确立多边间接结算的高计算成本是市场收敛到单一通用媒介的核心
  驱动力——多边债务网的记账/清算成本随参与者数量超线性增长,通用媒介将其压缩
  为O(N)的单边持有。BR-L2-032确立算法已将搜索/匹配/路径计算成本压低4-5个
  数量级——任意资产对之间的最优兑换路径可在毫秒级由算法(如AMM聚合器的路由
  算法)计算并执行。两砖合力产生一个交互涌现:当多边结算的计算成本不再是瓶颈时,
  市场收敛到单一通用媒介不再是技术必然,而变为制度选择、网络效应强度、参与者
  偏好共同决定的结果。收敛从"不算不行"变为"算得过来,但大家选择用同一种"。

  【驱动量】多边结算成本从"人脑/人工记账无法承受的超线性复杂度"坍缩为"算法
  毫秒级路径计算"——这一成本断崖(BR-L2-032)直接削弱了BR-L2-012中通用媒介的
  结算成本优势:当任意资产对的兑换路径都能以趋零成本计算并执行时,持有多种媒介
  并通过算法路由完成兑换的技术障碍消失。剩余推动收敛的力量来自网络效应(用同
  一种货币的人越多,每个人用它的便利越大)和制度惯性(法律/税收/合同以单一货币
  计价),而非结算成本的物理约束。

  【预测】(i) 路径集中度差异——算法驱动的多资产交易网络(如加密货币AMM聚合器)
  的交易路径集中度(通过少数枢纽资产的交易量占比)显著低于传统外汇市场的货币对
  集中度(以美元为中介的交易量占比),因为前者无需依赖少数高流动性枢纽币来完成
  任意对兑换;(ii) 集中度趋势分化——算法驱动的交易网络中路径集中度随时间下降
  (路由算法持续优化+长尾资产对直接池增加),而传统外汇市场的货币对集中度长期
  稳定(惯性/制度锁定);(iii) 网络效应仍存在——但表现为"主流币之间竞争性共存"
  而非"赢家通吃":即使算法降低了多币并行的成本,交易量仍向少数主流币集中(网络
  效应的吸引),但集中程度低于传统市场的单极格局,且稳定性更弱(切换成本更低)。

  【判别】相对于BR-L2-012"结算成本高→通用媒介涌现"的单向机制——BR-L2-012
  只说了成本高时必然收敛,没回答成本坍缩后收敛是否逆转。相对于DED-027"交换
  网络密度→收敛到单一媒介"的结构必然性——DED-027的E_network正反馈在算法
  路由下可能被削弱(算法替代了'大家都用同一种'的协调功能)。本推论的增量不在
  '高成本时收敛'(已被覆盖),而在'低成本时收敛从必然退化为可选'——以及由此
  衍生的可检验预测(集中度差异+趋势分化)。

operationalization:
  multilateral_settlement_cost:
    definition: "在N种资产/货币并存的交换网络中,完成一笔从资产A到资产B的兑换所需的信息处理与路径执行成本——包括找到最优兑换路径、跨多个交易对执行、结算清算。"
    measurement: |
      两个代理指标:(a) 时间成本——从发起兑换请求到完成结算的端到端耗时,传统
      外汇市场通过代理银行链的跨境结算需T+2,算法AMM路由的链上兑换为秒级;
      (b) 复杂度成本——在N种资产的完全图中找到最优兑换路径的计算复杂度,
      前算法时代需依赖做市商人为报价(双边报价覆盖O(N²)个货币对中仅少数),
      算法时代通过图算法(Dijkstra/Bellman-Ford变体)在O(N²)内自动穷举全图。
    limitations: "时间成本受区块链出块时间/SWIFT报文时间等物理延迟影响,与纯计算成本有交叉;复杂度成本的理论最优与实际实现的gas费/滑点存在差距。"

  trading_path_concentration:
    definition: "交易网络中,总交易量通过前K个枢纽资产(作为中介的资产)完成的比例——高集中度=大多数兑换经过少数枢纽,低集中度=兑换路径分散在多个资产对之间。"
    measurement: |
      对任意交易网络:(a) 计算每笔兑换的路径——若A→C通过A→B→C完成,则B作为
      枢纽被计数;(b) 计算枢纽集中度H(k)=通过前k个枢纽资产的交易量/总交易量。
      外汇市场:以BIS三年期调查数据,~88%交易涉及美元一侧→H(1)≈0.88;
      加密货币AMM聚合器:以1inch/Matcha等主流聚合器的路由数据,计算通过
      ETH/USDC/USDT等前k个枢纽池的交易量占比。
      预测:H_crypto(1)<H_forex(1),且d(H_crypto)/dt<0而d(H_forex)/dt≈0。
      测量口径一次性注册:H(k)的分母=该网络中的总兑换笔数(非金额,避免巨鲸
      扭曲);枢纽资产k按该时间窗口内的中介频次排序,不预设哪几个是枢纽。
    limitations: "加密货币市场中稳定币(USDC/USDT)作为事实上的计价单位可能充当'准通用媒介',其枢纽地位需与法币体系中的美元区分——前者是设计选择(可切换),后者是制度锁定(切换成本极高);若USDC/USDT占据枢纽地位≥80%,则预测(i)被削弱但方向性预测(ii)仍可检验。"

  convergence_regime:
    definition: "市场收敛到单一通用媒介的模式——'技术必然'(不收敛则交易成本高到不可行)vs'制度选择'(技术上可多币并行,但制度/习惯/网络效应驱动集中)。"
    measurement: |
      判据:存在至少一个多资产交易网络,其中(i)任意资产对之间均可直接或以短路径
      (≤2跳)完成兑换,(ii)兑换成本(价差+手续费+滑点)与通过单一枢纽媒介的兑换
      成本之比≤2x,(iii)该网络持续运行≥1年未被单一媒介主导→'制度选择'模式
      被实证支持。若所有已知低结算成本网络均收敛到单一媒介主导→'技术必然'未被
      推翻,本推论的核心主张被削弱。
    limitations: "判据(iii)的时间窗口(1年)是任意设定的——若多币并行只是过渡态、在更长时间尺度上仍收敛,则技术必然命题未被推翻而只是时间常数变长;但若收敛的时间常数从'数十年(金本位→美元本位)'延长到'不可观测的长期',则'技术必然'与'制度选择'的实践差异已足够大。"

derivation:
  from_l1:
    axioms: [AXIOM-002]
    theorems: [THEOREM-exchange-competition-alternative, THEOREM-value-attribution, THEOREM-relation-information-asset]
  from_l2:
    bridging: [BR-L2-012, BR-L2-032]
  steps: |
    1. "BR-L2-012:多边结算的计算成本是收敛到通用媒介的独立驱动力"
    BR-L2-012确立:当交换网络是多边的(众多不同对手、对子少复现)时,维护跨全网
    双边债务记账/清算本身的成本随对手数近似平方增长O(N²);一个所有参与者都肯收
    的通用媒介将O(N²)的多边债务压缩为对媒介的O(N)单边持有→多边度越高,通用
    媒介在结算成本上的净收益越大。此机制独立于"物物匹配困难"和"认不出人"——
    战俘营中配给包齐整(匹配易)、战俘长期关一起(记忆在场),但因人多+多边,照样
    冒出香烟当通用媒介。关键:通用媒介的结算成本优势是结算成本本身的函数——成本
    越高,通用媒介越不可或缺。

    2. "BR-L2-032:算法将搜索/匹配/路径计算成本压低至前数字时代不可企及的水平"
    BR-L2-032确立:算法搜索(全文索引+语义检索)将信息检索的边际时间成本从
    "小时-天"压至"亚秒级",差距约4-5个数量级;算法匹配(推荐系统/双边市场调度)
    将候选池从人工可处理~1000扩至算法可处理~1000万,规模跨度~10000x。将这一
    成本断崖映射到多边结算场景:在N种资产的完全图中找到从A到B的最优兑换路径,
    前算法时代需依赖做市商人为报价(人脑无法实时计算N(N-1)/2个货币对的交叉
    汇率),算法时代通过图算法+AMM流动性池在毫秒级完成全图路由→任意资产对之间
    的兑换从"需要通用媒介做中介"变为"算法自动找最优路径,可以经过也可以不经过
    单一枢纽"。

    3. "合成:结算成本坍缩→通用媒介的结算优势被消解→收敛从技术必然变为制度选择"
    步骤1的关键洞察:通用媒介的不可或缺性依赖于结算成本的高企——当且仅当多边
    记账/清算的成本高到人脑/人工无法承受时,市场才被迫收敛到单一媒介(BR-L2-012
    的机制在成本极高时作用最强)。步骤2的关键洞察:算法已将这一成本压到了'近乎
    为零'的水平——当任意资产对的兑换路径都能以毫秒级自动计算并执行时,持有
    多种媒介并通过算法路由完成兑换的技术障碍消失。两砖焊接:BR-L2-012的结算
    成本驱动→通用媒介的逻辑被BR-L2-032的成本断崖从根源上削弱——不是通用媒介
    变差了,而是'不用通用媒介也行'了。然而,收敛仍可能发生——网络效应(用的人
    越多越方便)和制度惯性(法律合同以单一货币计价)仍指向集中,但此时的集中是
    '参与者选择集中'而非'不集中不行'。技术约束→偏好/制度约束的转变是本推论
    的非平凡内核。

    4. "非平凡性(逐格判空)"
    2×2判据表(自变量档:多边结算成本[高/前算法 vs 低/算法时代] × 被预测量档:
    交易路径集中度[高/单一枢纽主导 vs 低/多路径分散])见nontriviality_test。
    核心非平凡格="低结算成本+低路径集中度"——这是两个承重砖各自不单独给出的
    交互预测:BR-L2-012只说高成本→高集中(不涉低成本情形),BR-L2-032只说成本
    断崖(不涉货币收敛动力学)。无单砖写有"结算成本坍缩后收敛从必然退化为选择"
    这一结论。

falsifiability: |
  本推论可被以下发现证伪(任一条成立即推翻核心):
  (a) 算法驱动的多资产交易网络(加密货币AMM聚合器,已运行≥3年)的交易路径
  集中度H(1)与传统外汇市场的H(1)无统计显著差异(均>0.8)→"低结算成本导致
  低集中度"的核心预测被推翻→表明网络效应/制度惯性压倒结算成本效应,收敛仍
  是事实上的必然。
  (b) 算法交易网络的路径集中度随时间显著上升(running趋势检验p<0.05,窗口
  ≥2年),并向传统外汇市场的集中度水平收敛→"趋势分化"(预测ii)被推翻→表明
  算法路由的优势是暂时的,市场在更长时间尺度上仍收敛到单一枢纽→技术必然
  命题在动态意义上成立。
  (c) 找到一个前数字时代的、多边度高但结算成本低的多资产交换网络(如某历史
  贸易体系),其路径集中度仍很低→表明低集中度与算法无关,本推论的归因(算法
  成本断崖是使能条件)被削弱。
  适用区间:覆盖已存在链上AMM/DEX聚合器且交易量足够形成路由数据的公链生态
  (以太坊+主要L2);不适用于仅支持单一资产或强制以特定资产为中介的封闭网络。

falsification_trace:
  primary_suspect: |
    网络效应压倒结算成本效应的可能性——这是最脆弱的腿。BR-L2-012的结算成本
    只是驱动收敛的三机制之一(D1物物匹配困难/D2匿名不可追踪/D3多边结算成本),
    即使D3被算法消解,D1和D2可能仍足以驱动收敛。更关键的是:网络效应独立于
    结算成本——使用同一种货币的便利随采用者数量增长(正反馈),这一效应不因
    结算成本下降而消失。若网络效应的强度足以在低结算成本下仍驱动收敛到接近
    单一媒介的集中度(如H(1)>0.7),则本推论的核心主张——"收敛从必然变为
    选择"——在经验上虽为真(网络效应是选择,不是物理约束),但在预测力上被
    掏空:集中度仍在,只是换了驱动力的名字。推论降格为"驱动力的重新标记"
    而非"可观测结果的改变"。
  secondary_suspect: |
    BR-L2-032的成本断崖量级(weakly_verified,IEA=1.6)——若实际结算成本下降
    仅为100-1000倍量级而非10000+倍,成本断崖仍成立但"趋零"的声称被削弱;
    结算成本虽大幅降低但未低到足以让多币并行在用户体验上与传统单一媒介
    竞争。此外,AMM路由本身引入新成本(滑点/gas费/MEV),这些算法特有的交易
    成本可能部分抵消结算成本的下降。
  unlikely_suspect: |
    BR-L2-012的核心机制(verified,IEA=1.9,搜寻货币理论+战俘营/监狱经济档案
    两个准独立来源)——即使本推论被推翻,BR-L2-012"多边结算成本驱动通用媒介
    涌现"的机制仍成立,只是其射程被限定为"高结算成本区间"。
  note: "primary若被坐实(网络效应使低结算成本下集中度仍>0.7),推论不因此被判rejected——'从技术必然变为制度选择'的定性主张仍成立,但定量预测(集中度显著更低)需降级。此时推论的核心贡献变为'揭示了谁在驱动收敛',而非'预测收敛会减弱'。"

excluded_outcomes:
  - outcome: "加密货币完全取代法币成为全球主导货币"
    description: "本推论预测多币并行在技术上可行,不预测任何特定货币胜出。多币并行生态与法币继续主导可以共存。"
  - outcome: "具体哪几种货币会共存"
    description: "本推论的射程是收敛模式(必然vs选择),不是共存货币的具体构成——后者取决于监管/地缘/技术等多重因素,不在单机制推论的射程内。"
  - outcome: "没有算法时是否也存在过多币并行"
    description: "本推论不声称多币并行是算法时代独有的——前现代也有多币并行(如金银复本位),但它们的并行受限于物理结算成本(需实际运送金属),与算法驱动的低结算成本多币并行在机制上不同。"

anti_talisman_clause: |
  【防不可证伪护身符——三条硬约束】

  (1) 判定"收敛是制度选择而非技术必然"时:必须独立于结果测量。不得因"某
  网络出现了多币并行"就声称"结算成本低→证明了选择模式",也不得因"某网络
  仍高度集中"就声称"那是因为网络效应太强(仍算选择)"。判定标准必须是事前
  注册的、独立于被解释现象的:(a)结算成本是否确实低到多币并行在技术上可行
  (用AR-1:通过聚合器完成任意资产对兑换的端到端成本与传统单一媒介兑换成本
  之比≤2x);(b)集中度是否确实下降(用AR-2:时间趋势检验)。两个锚都必须独立
  于"集中度是否下降了"来测出"结算成本是否低了"——见real_world_anchors的
  independent_*_evidence字段。

  (2) 判定"多币并行是可持续生态而非过渡态"时:必须预设时间窗口(≥2年连续
  数据),不得在集中度上升时说"还在收敛中"、在集中度下降时说"已进入选择模式"
  ——时间方向的选择必须在看到数据前锁定,事后选择方向构成反判。

  (3) 反例消化门:若发现一个低结算成本的算法交易网络(如某条链的DeFi生态)
  其路径集中度H(1)>0.8,表面构成反例。消化条件:需证明该网络存在制度性约束
  (如协议强制以特定资产为gas/计价单位)或监管约束(如法币出入金通道限制)使
  得低集中度虽然技术上可行但被制度力量压制——此时该案例不是"技术必然"的证据,
  而是"制度选择压制了技术可能"的证据。但此消化仅当存在至少另一个制度约束较弱
  的网络呈现低集中度时成立;若所有低结算成本网络均呈现高集中度,消化失效。

nontriviality_test: |
  2×2判据表(自变量档:多边结算成本[高/前算法时代 vs 低/算法时代] × 被预测量
  档:交易路径集中度[高/H(1)>0.7 vs 低/H(1)<0.5]):

  格(高成本,高集中)——「平凡」——历史基线。BR-L2-012直接预测:多边结算成本
  高→参与者被迫使用通用媒介→交易路径必然集中。外汇市场美元中介占比~88%
  是这一格的直接实例。任何包含BR-L2-012的推理都预测此格。

  格(高成本,低集中)——「预测为空·物理不可能」——在没有算法辅助的条件下,
  要在多边交换网络中维持低路径集中度,需要每个参与者实时计算并比较N(N-1)/2
  条兑换路径——这在人脑/人工记账条件下不可行。此格为空不是本推论的预测,
  是BR-L2-012的逻辑推论:正是因为这个格为空,通用媒介才必然涌现。此格的
  "空"既是BR-L2-012的经验基础,也是本推论的对照组——确认了结算成本是集中度
  的必要条件。

  格(低成本,高集中)——「可能·削弱推论但不推翻」——即使结算成本趋零,网络
  效应(用同一种货币的人越多越方便)和制度惯性(法律/税收/合同的路径依赖)仍可能
  驱动高集中度。若所有低结算成本网络都落在此格,则"收敛从技术必然变为制度选择"
  的定性主张仍成立(因为驱动力的确从结算成本切换为网络效应/制度),但定量预测
  (集中度下降)被掏空——推论的核心贡献坍缩为"驱动力归因重标注"而非"可观测
  结果的改变"。

  格(低成本,低集中)——「非平凡格·核心预测」——算法结算成本断崖(BR-L2-032)
  消解了BR-L2-012的结算成本驱动,网络效应虽仍存在但不足以在低切换成本下维持
  单极集中。这是两个承重砖各自不单独给出的交互预测:BR-L2-012不讨论"低成本
  时集中度如何"(它的机制是单向的:成本高→集中),BR-L2-032不讨论"成本断崖
  对货币集中度的影响"(它的射程是交易成本本身,不特定于货币领域)。无单砖写有
  "结算成本断崖使多币并行生态在技术上可行"这一结论。

  brick=conclusion自查:"结算成本断崖使收敛从技术必然变为制度选择"未在任何
  承重砖中原文或近义出现。BR-L2-012描述了高结算成本→通用媒介的单向机制,
  不涉及成本坍缩后的逆过程;BR-L2-032描述了算法成本断崖的跨域事实,不涉及
  货币收敛动力学。无为本推论窄化的专用砖。

real_world_anchors:
  supporting:
    - anchor: "加密货币AMM聚合器路径集中度 vs 外汇市场美元中介占比(预测i/ii)"
      evidence: |
        外汇市场(BIS 2022三年期调查):美元参与一方占所有外汇交易的~88%,
        H(1)≈0.88——几乎所有货币对的兑换都经过美元这一单一枢纽。这一集中度
        在过去20年保持稳定(~85-90%区间),无显著下降趋势。
        加密货币AMM聚合器(1inch/Matcha/Paraswap等,运行于以太坊+L2):
        聚合器通过图算法在数百个流动性池中自动寻找最优路由,可实现任意ERC-20
        代币对之间的直接/短路径兑换(无需经过ETH或USDC作为强制中介)。初步
        证据:1inch的公开路由日志显示路径多样性远超外汇市场——非ETH/USDC
        枢纽的路径占比显著,且新池(如代币A/代币B的直接池)的创建使路径选择
        随时间增加。
      independent_test: |
        independent_cost_evidence:结算成本是否确实低到可支持低集中度——通过
        测量聚合器API的端到端响应时间(从查询到返回最优路由,<500ms)和路径
        数量(单次查询通常返回≥3条不同路径)来独立验证"算法已使结算成本趋零",
        此项测量完全独立于"集中度是否下降"的结果。
        independent_concentration_evidence:路径集中度的测量使用公开的链上交易
        数据和聚合器路由日志,口径预先注册(分母=总兑换笔数,H(k)按中介频次排序);
        外汇市场集中度使用BIS公开数据。两条测量链分叉,不存在同源重复发布问题。
      confidence: moderate

    - anchor: "稳定币多币并存生态——USDC/USDT/DAI的竞争性共存(预测iii,网络效应存在但不致赢家通吃)"
      evidence: |
        截至2026年,美元稳定币市场由USDT和USDC双头垄断,但两者长期共存而非
        一家吃掉另一家——尽管它们都是"美元替代品",功能几乎完全重叠(同为
        支付媒介+价值储藏)。DAI(去中心化超额抵押稳定币)与USDC/USDT的共存
        进一步证明了多媒介并行的技术可行性。切换成本极低(在AMM中一键兑换),
        但三者均存活→网络效应没有强到消灭竞争者→与外汇市场中美元单一枢纽
        的持久垄断形成对比。
      independent_test: "稳定币的市值和交易量数据公开可查,独立于任何集中度分析;三者共存的事实本身不依赖本推论的预测方向。"
      confidence: moderate

  counterexamples:
    - case: "Bitcoin在加密货币交易中的枢纽地位——H(1)可能仍>0.5"
      analysis: |
        若测量显示BTC仍是加密货币交易网络中的支配性枢纽(BTC交易对占总交易量
        >50%),表面构成反例。但需区分:(a)BTC作为"储备资产/计价单位"的枢纽
        地位——这反映了网络效应/先发优势,符合本推论的"选择"叙事(大家选择
        用BTC不是因为技术上必须);(b)BTC作为"结算中介"的枢纽地位——这才会
        构成对预测(i)的直接挑战。关键测量:在AMM聚合器的路由路径中,BTC是否
        出现在大多数非BTC代币对的兑换路径中?若是→反例成立;若BTC交易量高但
        路由路径不经过BTC→这只是BTC作为热门资产的交易量大,不是结算集中度。
      status: pending_measurement

  boundary_cases:
    - case: "CBDC互操作性与多边结算——央行数字货币网络"
      analysis: |
        若多国CBDC上线并实现直接互换(如BIS的mBridge项目),这将是一个"制度
        设计而非市场自发"的低结算成本多币并行网络——可检验本推论的边界:
        低结算成本+制度驱动的低集中度是否可持续?若CBDC多边互换网络稳定运行
        ≥2年且无单一CBDC成为支配性枢纽→支持本推论;若迅速收敛到某一CBDC
        (如数字人民币或数字美元)作为事实中介→网络效应压倒制度设计,本推论的
        "选择"空间被压缩。
      status: boundary_case

discriminant_validity: |
  【相对于BR-L2-012(多边结算成本催生通用媒介)的判别】
  BR-L2-012的核心是可证伪预测:在身份可追踪+匹配容易但多边的交换网中,通用媒介
  必然涌现。这个预测在"高结算成本区间"成立且有战俘营等实证——本推论不挑战此点。
  本推论的增量:BR-L2-012的机制是单向的(成本高→通用媒介),它不回答"成本坍缩后
  通用媒介是否仍必然涌现"——因为BR-L2-012不包含"结算成本可变"这一变量。本推论
  补上了这个反向问题:当BR-L2-012的发动机(高结算成本)被BR-L2-032的断崖消解后,
  收敛的命运由网络效应/制度惯性/偏好接管。独有预测:BR-L2-012单独不能预测
  "低结算成本时集中度会下降"——它没有"结算成本水平"这一自变量。

  【相对于DED-027(物理筛选机制+E_network收敛)的判别】
  DED-027声称交换网络密度足够高时,收敛到单一主导媒介是结构必然,胜出者由局域
  加权最优决定。本推论不声称DED-027错了——而是揭示DED-027的收敛逻辑中存在一个
  隐含前提:结算成本非零。当BR-L2-032将结算成本压至趋零时,DED-027的E_network
  正反馈可能被算法路由部分替代——算法'替大家算好了最优路径',削弱了'大家都用
  同一种以省事'的协调动机。独有预测:DED-027单独不能预测"加密货货网络的路径
  集中度低于传统外汇市场"——DED-027对所有高密度交换网络预测相同的收敛动力学。
  若DED-048的预测(i)(ii)成立,DED-027需要增加适用条件:收敛的必然性随结算成本
  下降而减弱。

  【相对于DED-036(算法×物理筛选:从发现到设计)的判别】
  DED-036处理"货币候选品的生成范式从自然枚举变为参数设计"(候选池本体论变化),
  DED-048处理"多币并行后的收敛动力学从技术必然变为制度选择"(集中度动力学变化)。
  两条推论互补而非竞争:DED-036解释了为什么现在有这么多币可以并行,DED-048解释
  了这些币为什么能持续并行而不必然收敛到一个。两个推论共享承重砖BR-L2-032,
  但作用在不同的下游:一个作用于候选品生成端,一个作用于结算/收敛端。

  【防平凡化守卫】
  不要将本推论理解为"算法让多币并行更方便"——这是BR-L2-032在货币领域的平凡应用。
  非平凡内核在于:(a)识别出BR-L2-012的"结算成本→通用媒介"机制有一个隐含适用范围
  (高结算成本区间),并论证BR-L2-032使该适用范围收缩——这不是两个砖的并置,是
  一个砖的适用范围被另一个砖从外部压缩;(b)将"收敛"从单一状态(必然)拆解为两种
  模式(技术必然 vs 制度选择),并给出独立于结果的判别标准;(c)给出两条可检验的
  方向性预测(集中度差异+趋势分化),这两条预测均不在任何单块承重砖中。

