id: DED-010
type: deduction
layer: L3-deductions
status: verified

term: "权力维持成本与制度化推论 (Power-Maintenance Cost and Institutionalization Corollary)"

人话摘要: |
  纯靠个人威慑的权力(乙服从系于"怕甲这个人")会不断流失——乙心里"甲能影响我"这份
  记忆按信息熵增自然淡忘,甲得靠越来越贵的展示(仪式/阅兵/惩罚示众/清洗)硬撑;而且
  支配要经一层层中介传下去,规模越大、要记住这份威慑的人越多、忘得越多,展示总成本
  越高,大到一定程度就撑不住(规模天花板)。想扩张或持久,只能二选一:要么继续付
  【递增】的展示成本(纯人格化,不可持续),要么把权力【制度化】——从"怕这个人"转成
  "怕这个位子/这条规矩"。后者以【回退代价高/非对称(滞后)】把维持成本降下来、还抗继承危机(君主死了不塌),
  代价是个人专断被规则稀释。

statement: |
  纯人格化支配靠乙持有"甲能影响我"这一信息维系;该信息按 THEOREM-power-signal-decay
  (其根在 AXIOM-002 信息熵增)持续衰减,甲须周期性投入【展示】(仪式/阅兵/惩罚示众/
  清洗)刷新之。展示有成本;支配又经层级中介(BR-L2-004),被支配规模越大、须持有该信息
  者越多、衰减触点越多,刷新总成本随规模上升。据此:

  【核心】任何欲扩张或持久的支配结构,在纯人格化维系撑不住的天花板处二选一——
    (A) 持续付【递增】展示成本(纯人格化,不可持续,存在规模天花板);(B)【catch-all:
    一切【不附着于该特定个人】的权威锚定】——把权威从"怕这个人"外包为"怕这个位子/这条
    规则"(BR-L2-010"非人格化制度替代人际信任"在支配域的落地为【主要实例】),此举
    【滞后、回退代价高、非对称】地降低单位维持成本,但稀释个人专断。

  【驱动量】逼高展示成本、逼出制度化的,是【权力信号衰减率 × 被支配规模】这一乘积
    本身——须【事前、独立于"支配是否崩溃"】测量(anti-talisman);【不是】"政权垮没垮"
    这一结果。

  【预测】
    (i)   纯人格化支配者随治下规模上升,须把【递增比例】资源投入展示/清洗,存在规模
          天花板;
    (ii)  完成制度化(职位权威 > 个人权威)的支配单位,维持成本下降且抗继承危机
          (支配者死亡不塌);
    (iii) 逐格判空(招牌):"大规模 + 纯人格化 + 不制度化 + 长期低展示投入"这一格
          预测【为空】。

  【判别】与韦伯"卡里斯玛→科层制(routinization)"判别:独有可证伪内容是【维持成本
    随规模的定量发散 + 规模天花板】、【驱动量(信号衰减率×规模)的事前独立测量】、
    【制度化回退代价高/非对称(滞后)】,而非被常识吸收的"制度化更稳"。与 DED-006(交易信任外化)/
    DED-008(监督者独立/分配公平)判别:那两条讲交易信任与分配公平,本条讲【支配本身
    的维持成本】。

# === 规则 A：操作化定义 ===

operationalization:
  power_signal_decay_x_scale:
    definition: |
      【自变量/驱动量】= 权力信号衰减率 × 被支配规模。
      衰减率:被支配者持有的"支配者能影响我"这一信息,在【无新展示刷新】时的流失速度
      (THEOREM-power-signal-decay ← AXIOM-002)。
      被支配规模:【结构、离结果的事前量】= 支配/命令链名义下属人头 × 层级深度——由
      org 结构(谁在命令链里、名义下属几何)【事前编码】,【不】由"是否存续/是否活下来"
      定;经 BR-L2-004 层级中介放大(每一中介层本身是一段须独立刷新的支配关系)。
      【绝不】把"其服从对存续为必要"塞进规模口径——那是把结果(存续)偷进自变量。
      是【乘积】:衰减快 × 人多 ⇒ 刷新需求大。是【事前】量,独立于支配是否崩溃。
    measurement: |
      衰减率:【优先】用纯结构代理测——沟通信道密度、代际记忆更替速率(皆离任何服从
      结果);当辅以【自然实验】(支配者暂停展示后不服从=抗命/逃避/阳奉阴违出现的时间
      常数)时,该自然实验须在与被预测的维持/存续结果【不同时标或层级】上取样(如取微观
      短时/单层的抗命,而预测的是宏观长时/全域的维持),以免"用小结果测衰减、再预测大
      结果"。
      规模:【结构量】= 支配/命令链名义下属人头 × 层级深度(BR-L2-004),按 org 结构
      事前编码,【离】是否存续。
      【anti-talisman 硬约束】衰减率与规模须【独立于结果】测,【绝不】用"政权垮了/
      没垮"反推衰减快慢或成本高低——否则自变量偷用结果(DED-007 死病)。
    limitations: |
      衰减率连续、因信道/文字/常备镇压机器而异;规模边界按 org 结构(命令链在册名义
      下属)【事前】划,【不】按"对存续的必要性"划——后者会把结果(存续)偷进自变量口径,
      非全体人口。

  maintenance_cost_display:
    definition: |
      【被预测量之一】维系支配所需的【展示成本】——用于刷新被支配者权力信息的资源
      占比:仪式/阅兵/公开处决/示众/清洗/个人崇拜宣传所耗预算、人力、注意力占支配
      单位总资源的比重。
    measurement: |
      结构测展示活动的资源占比:处决/清洗频次与规模、阅兵/朝觐/巡幸周期、崇拜宣传
      投入——独立于"支配是否存续"。
      预测:纯人格化档下该占比随【衰减率 × 规模】上升而【递增】(非线性发散 ⇒ 天花板);
      制度化档下该占比下降。
    limitations: |
      展示兼有它用(威慑外敌/分配合法性),须扣除非"刷新内部权力信息"部分——按
      excluded_outcome#2 的【受众指向/场合类型事前编码规则】扣除,不得用途事后开脱;
      占比为程度量,对齐 (i)/(ii) 的单调。

  institutionalization_degree:
    definition: |
      【被预测量之二/逃逸态】权威附着对象:附着于【个人】(怕这个人) vs 附着于
      【职位/规则】(怕这个位子/这条律令)的程度——BR-L2-010"非人格化制度替代人际信任"
      在【支配域】的落地。
    measurement: |
      结构签名,独立于存续:成文继承规则、职位制/官僚制的在场、非人格法律执行、
      "支配者死亡时权威是否随位子平移"(the king is dead, long live the king)。
      【anti-talisman】制度化程度须由上述结构签名事前测,【不得】用"支配活下来了"反推
      "必已制度化"(否则 DED-004 循环)。
    limitations: |
      混合态常见(个人崇拜 + 官僚制并存),按主导成分或并存标注,不二分;为程度量。

# === 推导链 ===

derivation:
  from_l0:
    constraints: [PHY-002]
  from_l1:
    axioms: [AXIOM-002]
    theorems: [THEOREM-power-signal-decay, THEOREM-hierarchy-depth-limit]
  from_l2:
    bridging: [BR-L2-010, BR-L2-004]

  steps: |
    1. "人格化支配靠信息维系且必衰减(THEOREM-power-signal-decay ← AXIOM-002)"
       乙服从甲,系于乙持有"甲能影响我"之信息;该信息熵增,无刷新则流失 ⇒ 甲须周期
       展示。

    2. "刷新成本随规模【超线性】上升 ⇒ 天花板(BR-L2-004 层级传导 + 带宽有限)"
       被支配规模越大,须持有该信息者越多;而【单一支配者的个人刷新带宽有限】(PHY-002:
       其亲历展示所能投注的注意力/能量是有限存量,不能凭空扩容),衰减触点却随规模
       (人头 × 层深)增多 ⇒ 人均可供的【个人】刷新随规模【下降】,过某规模衰减压过刷新
       = 天花板——此即"展示占比【递增】"而非线性的机制。层级中介【不逃逸】:每一中介
       本身是一段须独立刷新的人格支配,且经 THEOREM-hierarchy-depth-limit 逐层失真放大,
       深度亦有极限 ⇒ 靠加层摊薄刷新也撞墙。

    3. "二选一:递增展示 or 制度化(BR-L2-010 支配域落地)"
       欲在天花板之上持久/扩张,补上衰减吞掉的绑定力二选一:(A) 继续付递增展示成本
       (纯人格化);(B) 把权威从个人外包给非人格职位/规则——BR-L2-010:非人格化制度可
       替代人际的"怕这个人"。

    4. "制度化回退代价高/非对称降本、抗继承、稀释专断 + 选择压力"
       (B) 一旦"怕位子"取代"怕人",单位维持成本降(职位权威无须个人反复展示即被承认)、
       抗继承(位子不随人死);代价是个人专断被规则稀释,且回退纯人格化代价高(滞后/
       非对称,非绝不可能)。
       选择压力:超天花板仍纯人格化者被展示成本压垮或继承危机撕裂,制度化者存续做大。

    5. "驱动量归因 + 非平凡性(逐格判空)"
       逼出 (A)/(B) 的是【衰减率 × 规模】本身,非"是否崩溃"。
       【非平凡性】THEOREM-power-signal-decay 单独只给"权力不刷新则衰减"(给发动机、
       不给规模发散与二选一);AXIOM-002 单独只给"信息不维护则流失";BR-L2-010 单独只给
       "非人格制度能替人际信任【于交换】"(不给支配维持成本发散、不给回退代价高/非对称);BR-L2-004
       单独只给"大群体必有层级"。四者【都不】给出"支配维持成本随规模发散 ⟺ (递增展示
       or 制度化)"这一联合结构,更都不给【制度化回退代价高/非对称降本】与【驱动量 = 衰减率×规模的
       事前独立测量】。"大规模 × 纯人格化 × 不制度化 × 长期低展示"一格被预测【为空】、
       且可被现实反例填上(非同义反复)。唯合成给出。

# === 可证伪性 ===

falsifiability: |
  本推论可被以下发现证伪:
  (a) 一个被支配规模经【独立测定(命令链人头 × 层深的 org 结构量,离存续)】确大、且经
      结构签名确【纯人格化】(无成文继承规则/无官僚职位制/权威附着于个人)的支配单位,
      长期维系而【展示投入占比不随规模上升、且始终低】——纯靠低展示的人格威慑撑住大规模。
      ⇒ 证伪 (i) 与核心空格(命中"大规模 × 纯人格化 × 低展示");不得事后缩"必要持有者"
      口径把此反例开脱。
  (b) 展示成本 / 制度化的涌现与【衰减率 × 规模】无系统关联,只随人口总量或产出走
      (与驱动量脱钩)。⇒ 证伪"驱动量 = 衰减率 × 规模"。
  (c) 完成制度化(职位权威 > 个人权威,结构签名坐实)的支配单位,其单位维持成本【未】
      下降、或【不】抗继承危机(支配者一死即塌,与纯人格化无异)。⇒ 证伪 (ii)。

falsification_trace:
  primary_suspect: |
    最弱腿:"制度化降本"是否被 BR-L2-010 平凡强制——本推论会不会只是"非人格制度能替
    人际信任"的支配域复述。诚实定位:BR-L2-010 只讲【交换域】的信任替代,且只声称
    "可替代"不声称"必被采用",亦不含【维持成本随规模发散】与【回退代价高/非对称】。载重新意压在
    成本-规模发散/回退代价高非对称/驱动量事前独立测量(见 discriminant),不压在"制度化更省事"
    这句近砖上。最先受检。
  secondary_suspect: |
    institutionalization_degree 须由结构签名(成文继承/职位制/权威平移)事前测,【不得】
    用"支配活下来"反推"必已制度化"(DED-004 循环);展示成本须扣除对外威慑等非"刷新内部
    权力信息"部分。
  unlikely_suspect: "THEOREM-power-signal-decay / AXIOM-002 本身——信息熵增是体系最稳的根,极少是根源。"
  note: |
    刻意规避 DED-004/007 死病:驱动量(衰减率 × 规模)与被预测量(展示成本/制度化程度)在
    正交轴上测,且均独立于"崩溃"结果;anti-talisman 明文禁止由存续/崩溃反推。

# === 排除的结果 ===

excluded_outcomes:
  - outcome: "创立即非人格化的支配(现代官僚国家/法理型政体)"
    description: |
      若支配【从不】以个人威慑为基质(立国即靠成文法/官僚制),前件"纯人格化"不成立,
      不在射程——归 (ii)/制度端支持,非 (a) 反例。按【可事前测的渠道】(创立期权威附着
      对象)划,不按结果开脱。
  - outcome: "展示投入服务于对外威慑/合法性而非刷新内部权力信息"
    description: |
      阅兵/仪式若主要指向外敌或分配合法性,须扣除,不计入本推论的内部维持成本。
      【事前编码规则(防用途事后开脱)】归类须按展示的【受众指向 / 场合类型】在【观测前】
      预先编码,不得观测后按结果辩:面向本国被支配者/官僚科层的场合(公审、清洗示众、
      朝觐、内部崇拜宣传)= 内部刷新,计入;面向外部敌国/邻邦或纯分配的场合(边境阅兵、
      对外军演、赈济)= 对外/合法性,扣除。规则双向对称——对外展示不计入支持,亦不得把
      "高内部展示"事后辩成"对外"、或把"低内部展示"事后辩成"其实有隐性内部展示"。

anti_talisman_clause: |
  【诚实硬约束】判定"维持成本是否随规模发散"必须由 maintenance_cost_display 的【展示
  投入资源占比】独立测得,判定"是否已制度化"必须由 institutionalization_degree 的
  【结构签名】独立测得——【绝不】因"政权垮台"就倒推"成本必已发散/必未制度化",也
  【绝不】因"政权长存"就倒推"必已制度化/成本必低"。尤其【不得】遇到"大规模 × 纯人格化
  × 低展示却长存"的反例,就事后硬塞一个非正式"制度化"来消化——制度化在场须由成文
  继承/职位制/权威平移等独立结构事实坐实。
  【尤其(去规模循环)】亦【绝不】因"低展示却长存"就倒推"必要持有者其实很少 / 规模其实
  不大"来缩口径救活——规模由命令/支配链人头 × 层深的 org 结构【事前】定,不随存续/崩溃
  调整;不得把结果(存续)偷进自变量(规模)。否则本推论沦为不可证伪循环。

# === 非平凡性 ===

nontriviality_test: |
  逐格判空(自变量档 = 被支配规模 小/大 × 支配模式 纯人格化/已制度化;被预测量 = 单位
  维持成本 & 抗继承):
    - 小规模 × 纯人格化 ⇒ 非空(小团伙/游群靠头目威慑,低展示可持续,常见)。
    - 大规模 × 纯人格化 × 递增展示(清洗/阅兵/崇拜)⇒ 非空(个人独裁靠高压展示硬撑,
      存在天花板)。
    - 大规模 × 已制度化 ⇒ 非空(官僚帝国/党国,维持成本降、抗继承,常见)。
    - 小规模 × 已制度化 ⇒ 脚手架可能冗余(制度化对小单位收益薄,即可逆方向)。
    - 【大规模 × 纯人格化 × 不制度化 × 长期低展示投入】⇒ 【预测为空】(核心空格)。
  该空格非被砖平凡强制:THEOREM-power-signal-decay 只给"不展示则衰减"、BR-L2-010 只给
  "交换域制度可替信任"、BR-L2-004 只给"必有层级",无一给"维持成本随规模发散 ⟺ (递增
  展示 or 制度化)"的联合结构、回退代价高/非对称、或驱动量的事前独立测量。空格可被"大规模纯人格化
  低展示却长存"的现实反例填上 ⇒ 非空可满足、非同义反复。
  防平凡化:非平凡【不在】"制度化更省事/更稳"(韦伯/常识已有、会被吸收),而在
  ①维持成本随规模的【定量发散】+ 规模天花板;②制度化【回退代价高/非对称(滞后)】降本且抗继承;③驱动量
  =【衰减率 × 规模】的【事前独立(离崩溃)测量】。

# === 现实锚点 ===

real_world_anchors:
  supporting:
    - anchor: "个人独裁的清洗/个人崇拜(斯大林/毛/朝鲜)—— 纯人格化 × 大规模 → 递增展示"
      evidence: |
        缺乏制度化继承与职位权威时,支配靠周期性大清洗、公审、阅兵、个人崇拜宣传
        【递增】刷新权力信息;规模越大、展示投入占比越高。
      independent_driving_evidence: |
        清洗频次/规模、崇拜宣传投入可独立于"政权是否垮"结构测出,坐实"展示成本随规模
        上升"而非事后归因。
      confidence: "moderate-strong"

    - anchor: "personalist vs single-party regimes(Geddes-Wright-Frantz 政体类型学)"
      evidence: |
        personalist regimes 更依赖镇压/展示、继承危机更致命、平均更短命;制度化的
        single-party regimes 抗继承、更持久。政体类型(制度化程度)可由结构签名(是否有
        制度化继承规则/党机器)事前测,独立于崩溃结果。
      independent_driving_evidence: "制度化程度按党机器/继承规则的结构在场事前编码,不由存续时长反推。"
      confidence: "moderate-strong"

    - anchor: "秦汉郡县官僚制 / 罗马元首制→科层帝国 —— 制度化(B)"
      evidence: "把统治从个人忠诚外化为职位/律令与官僚制(BR-L2-010 支配域),权威附着于位子,抗继承、单位维持成本降。"
      confidence: "moderate"

    - anchor: "世袭君主制的加冕/王冠符号与'国王已死,国王万岁'"
      evidence: "权威附着于王冠/位子而非个人肉身,支配者死亡时权威随位子平移 ⇒ 制度化抗继承危机的直接结构签名 (ii)。"
      confidence: "moderate"

  reversibility_anchor:
    - anchor: "已制度化政体被强人重新人格化后展示成本回升"
      evidence: |
        当制度化党国被强人重新人格化(削弱职位制、复活个人崇拜),展示/清洗投入回升、
        继承危机风险重现 ⇒ 支持驱动量方向。"回退代价高/非对称(滞后)"指回退成本高、非绝不可能。
      honest_note: "再人格化常伴制度残留,纯度难测,只作方向性中等-弱支持。"
      confidence: "weak-moderate"

  load_bearing_gap:
    honest_admission: |
      载重新意①(展示成本随【规模】超线性发散 + 天花板)是【最欠经验支撑】的一腿:现有
      强锚——斯大林/毛/朝鲜(皆"大规模 + 高展示")、Geddes-Wright-Frantz、秦汉/罗马
      官僚——要么撑近共识 (ii)(= GWF/韦伯),要么撑近砖 (B),【均无】"【同为纯人格化】
      内、展示占比随【规模】上升"的规模变异对照(现有个人独裁锚都是单点高展示,缺跨规模
      对照)。故①/驱动量而非 (ii)/(B) 才是本推论的【卖点】,却也最需补经验;诚实标为
      load-bearing-but-under-anchored。
    within_personalist_test_design: |
      可检验设计(类比 EMP 预注册):取一组【结构签名一致的纯人格化】支配单位(无成文
      继承 / 无官僚职位制 / 权威附着于个人),按命令链人头 × 层深【事前】排成规模谱;
      结构测各自展示投入占比(处决/清洗/阅兵/崇拜预算占比,按 excluded_outcome#2 事前
      编码扣对外部分,离存续)。预测:占比随规模【超线性】上升、并在高规模端出现天花板
      (占比封顶或单位撑不住)。若占比与规模【无系统关联或仅线性】,则①被证伪(而
      (ii)/(B) 不受影响)——把卖点钉在①/驱动量,可独立此测出结果。

  counterexamples: []

  boundary_cases:
    - case: "草原帝国(成吉思汗/阿提拉/帖木儿)看似'大规模纯人格化长存'"
      analysis: |
        表面像 (a)。按判据:这些支配【高展示】(征服/掠夺分配/个人卡里斯玛仪式)而非
        低展示,且在支配者死亡时【迅即分裂】(继承危机)⇒ 恰【支持】(i)/(ii) 的逆否,
        非反例。
      status: boundary_case

    - case: "大型王朝以真血缘继承却靠官僚制统治"
      analysis: "继承靠血缘,但大规模统治协作靠科层(制度化 B)——分层看:统治维持归制度端支持,非纯人格化反例。"
      status: boundary_case

# === 判别效度 ===

discriminant_validity: |
  【与韦伯的判别】韦伯"卡里斯玛→科层制(routinization of charisma)"给的是【类型学 +
  定性】的转化叙事(为继承而例行化)。本推论的【独有可证伪内容】:①维持成本随【规模】
  的【定量发散】+ 规模天花板(韦伯不给成本-规模函数);②驱动量 =【信号衰减率 × 规模】
  的【事前、离崩溃】独立测量(韦伯不测驱动量);③制度化的【回退代价高/非对称(滞后)】降本方向。权重压在
  ①②③,【不】压在会被常识吸收的"制度化更稳"。

  【与 DED-006 的判别】DED-006 讲【交易信任】突破熟人半径 → 外化制度(被预测量 = 交换
  外化程度);DED-010 讲【支配本身】的维持成本(被预测量 = 展示成本/制度化程度)。共享
  "可及上限 → 逃逸"母题是体系复现结构,非循环复述。

  【与 DED-008 的判别】DED-008 讲【分配公平/监督者独立】(裁量者是否偏私);DED-010 讲
  【支配维持成本】。不同被预测量与杠杆。

  【诚实前置——(B) 近砖非卖点】"制度化能降本"与 BR-L2-010 高度重叠(BR-L2-010 本就说
  非人格制度可替人际信任),故此句本身近砖、【不是】卖点;载重可证伪新意全在①②③——
  尤其②驱动量的事前独立测量与①成本-规模发散。

review_summary: |
  r1 needs_revision → r2 verified。
  载重新意在①展示成本随规模超线性发散+天花板、②制度化回退代价高/非对称(滞后)降本抗继承、③驱动量(信号衰减率×规模)事前离崩溃独立测量,三者皆在 BR-L2-010/BR-L2-004 与韦伯 routinization 之外、可事前测可证伪,两轮独立反例猎捕(草原帝国/封建/教廷/神王/军阀/长寿独裁/金氏朝鲜等)均无 scope 内活反例。
  全档见 ADV-REVIEW-015。

