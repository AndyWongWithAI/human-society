id: DED-044
type: deduction
layer: L3-deductions
status: candidate
term: "掠夺策略×制度信任替代：共生性双向塑造 (Predation Strategy × Institutional Trust Substitution: Symbiotic Bidirectional Coevolution)"

人话摘要: "抢别人东西和建立制度管住抢劫，这两件事不是简单的'制度强了就不抢了'单向关系——它们是互相塑造的。制度把内部抢劫的成本推高到不划算，压制了抢劫（制度→少抢）；但反过来，外面有人随时可能来抢你，恰恰逼着大家抱团、让渡自由、凑钱养军队建政府——制度就是这样被'怕被抢'催生出来的（外部威胁→强制度）。制度既是治抢劫的药，也是怕被抢的产物。"

statement: |
  【核心】掠夺(BR-L2-008)与制度(BR-L2-010)不是简单的单向替代关系(制度强→掠夺弱)，而是双向塑造的共生动态：(方向一)制度将内部掠夺的预期成本推高到超过预期收益→压制内部掠夺；(方向二)外部掠夺威胁制造集体行动激励→个体让渡自由、接受强制度的高昂成本以换取集体保护→催生制度。制度既是掠夺的解药，也是掠夺威胁的产物。

  【驱动量】两个独立可测的前件：(1)外部掠夺威胁强度——该政体面临的来自外部行为者的武力夺取资源之频率与烈度(战争频次、入侵风险、邻国掠夺倾向)；(2)内部交换需求密度——陌生人之间需要跨越人际信任边界进行交换的规模(贸易量/GDP、匿名交易占比)。被预测量为制度复杂度——法律条文数、官僚机构层级深度、中央税收占GDP比例。

  【预测】(i)历史上长期面临高外部威胁(频繁战争/入侵风险)的政体，其制度复杂度(法律条文数/官僚机构层级/税率)系统性高于同期同发展水平的低威胁政体，且该差异在控制了内部贸易规模后仍显著——即外部威胁对制度复杂度有独立的、正向的边际贡献；(ii)外部威胁强度与内部掠夺抑制程度之间存在正相关——但该相关由制度复杂度中介(即高威胁→强制度→低内部掠夺，而非威胁本身直接压制内部掠夺)；(iii)外部威胁骤然消失(如征服周边所有对手、地理隔绝)后，若内部交换需求不足以独立支撑既有制度复杂度，制度将出现熵增式退化(BR-L2-010的制度信任衰减+AXIOM-004的组织熵增)——即外部威胁的'催生压力'撤除后制度会回缩；(iv)双驱动量(高外部威胁+高内部交换需求)并存的政体，其制度复杂度高于仅由单一驱动量推动的政体，且二者的制度复杂度差异大于各自独立效应的线性加和——即双驱动量之间存在正向交互(非简单加性)。

  【判别】不同于Tilly"战争缔造国家"的单向历史叙事——本推论给出机制(外部威胁→集体行动→让渡自由→制度投资→内部掠夺抑制→反馈循环)和可证伪的交叉预测(威胁撤除后制度的熵增退化+双驱动量交互效应)。不同于North"制度降低交易成本"的效率导向——本推论指出制度的一个独立起源:不是为了让交易更高效，而是为了不被抢。不同于DED-012的掠夺-保护同源——DED-012讲的是暴力提供者的角色切换(流寇→坐寇)，本推论讲的是被统治者的集体行动逻辑(为什么愿意接受强制度)。

operationalization:
  external_predation_threat:
    definition: "该政体在给定时间段内面临的来自外部行为者的以夺取资源为目的的武力威胁频率与烈度——包括实际发生的战争、入侵、劫掠事件，以及可事前观测的威胁暴露(邻国掠夺倾向、地理位置处于入侵通道)。"
    measurement: |
      复合指标：(i)战争频次——给定时间段(如每世纪)内该政体参与的外部战争次数(COW战争相关数据集/历史记录)；(ii)入侵暴露——该政体是否位于历史上已知的入侵路线(草原走廊/海上劫掠通道)上，由地理信息独立判定；(iii)邻国掠夺倾向——周边政体中BR-L2-008型掠夺策略(公开劫掠/征服)的盛行程度。三项标准化后取均值。
    limitations: "战争记录存在史料偏差(文字社会记录更完整)；'威胁感知'与'实际威胁'之间存在信息不对称——本推论用的是实际威胁(事后可观测的战争/入侵事件+地理暴露)，不要求当时人准确感知威胁；地理暴露作为工具变量可缓解内生性(地理位置先于制度复杂度)。"

  internal_exchange_demand:
    definition: "该政体内部陌生人之间进行跨人际信任边界的交换规模——即需要BR-L2-010型制度支撑的交换占总经济活动的比例。"
    measurement: |
      代理指标：(i)贸易量/GDP比率——长途贸易+跨社群贸易占经济总产出比重；(ii)城市化率——城市人口占比(城市=陌生人交互密度高的环境)；(iii)货币化程度——使用通用交换媒介的交易占比。三项标准化后取均值。
    limitations: "贸易量/GDP在古代经济中的估算误差大；城市化率可能捕捉的是行政中心而非交换中心；三项代理均不完美但彼此正交，交叉验证可缓解单项偏差。"

  institutional_complexity:
    definition: "该政体制度体系的'厚度'——正式法律、官僚机构、财政提取能力三个维度的综合指标。这不是制度的'质量'或'公正性'，而是制度的'量'——用于协调、执法、提取资源的正式规则的密度和层级深度。"
    measurement: |
      三维度标准化后取均值：(i)法律条文数——正式成文法律条款/判例数量(如汉谟拉比法典282条→罗马十二表法→查士丁尼法典的条文数增长)；(ii)官僚机构层级——从最高行政首脑到基层执行者的正式层级数(DED-001的组织深度框架)；(iii)中央税收占GDP比例——政府从经济产出中提取的份额，作为制度提取能力的代理。三维度标准化(z-score)后取均值。
    limitations: "法律条文数的'条'在不同法律传统中含义不同(判例法vs成文法)——需按可比单位(独立规范性命题数)折算；官僚层级深度测量对前现代政体的史料要求高；税率在古代经济中估算困难(GDP本身是估算)。三维度取均值可缓解单项噪声。"

derivation:
  from_l1:
    axioms: [AXIOM-001, AXIOM-002, AXIOM-003, AXIOM-004]
    theorems: [THEOREM-conflict-cost, THEOREM-cooperation-precondition, THEOREM-relation-information-asset]
  from_l2:
    bridging: [BR-L2-008, BR-L2-010]
  steps: |
    1. "BR-L2-008:掠夺是理性选项——当抢的代价<抢到的收益时，掠夺占优"
       BR-L2-008确立掠夺是跨文化反复出现的真实策略(AXIOM-001稀缺性→竞争者争抢资源；
       THEOREM-conflict-cost给定掠夺成本)。在任何缺乏反制力量的社会中，掠夺都是
       一个永远存在的备选策略——它不是异常，而是默认选项之一。关键推论:内部掠夺的
       抑制需要某种力量持续地将掠夺成本推高到超过掠夺收益——否则掠夺会自发涌现。

    2. "BR-L2-010:制度替代人际信任——第三方执法使陌生人交换可行"
       BR-L2-010确立非人格化制度(第三方执法/财产权保护/声誉登记)可以替代人际信任
       支撑陌生人之间的交换(AXIOM-003重复交互→规范涌现；THEOREM-cooperation-precondition
       合作需信任；THEOREM-relation-information-asset关系是信息资产)。关键推论:
       制度的一项核心功能是提高违约/掠夺的成本——第三方执法使掠夺者面对的不再是
       单个受害者的报复能力，而是制度背后的集体强制力。制度天然地抑制掠夺。

    3. "方向一(制度→抑制掠夺):制度推高内部掠夺成本至超过收益"
       步骤1+2合取:当制度(BR-L2-010)在场时，内部掠夺的成本被系统性地推高——
       第三方执法使掠夺者面对的不再是受害者的个人报复，而是制度授权的集体强制力。
       若制度足够强(执法概率×惩罚力度>掠夺收益)，掠夺从'理性'变为'不理性'。
       此方向在DED-006(信任天花板→制度外化)和DED-012(坐寇化)中已有阐述，
       本推论将其作为双向动态的一个方向纳入。

    4. "方向二(外部掠夺威胁→催生制度):怕被抢驱动集体行动与制度投资"
       当外部掠夺威胁高时，个体面临一个经典的集体行动问题:每个人都受益于集体防御，
       但每个人都倾向于搭便车(让别人去打仗/交税)。BR-L2-008使此问题尖锐:外部掠夺
       不是抽象风险，而是真实的资源夺取(抢粮/抢人/抢地)。解决此集体行动问题的唯一
       可信途径是建立强制度——让渡个人自由、接受强制税收和兵役、授权中央权威垄断
       暴力以提供保护。这是社会契约理论的经验内核:不是哲学虚构，而是外部威胁下的
       理性选择。AXIOM-001(稀缺→竞争)+THEOREM-conflict-cost(冲突消耗资源)合力:
       不合作的成本(被抢光)远高于合作的成本(交税/服兵役)→制度作为集体防御的
       副产品被建立。

    5. "合成:双向共生反馈环"
       方向一和方向二首尾相接形成反馈环:高外部威胁→强制度(方向二)→低内部掠夺
       (方向一)→更多剩余可用于制度投资→制度更强→内部掠夺更低。同时也存在反向
       张力:制度太强→提取能力过高→制度本身可能成为掠夺工具(DED-012的坐寇化)。
       由此预测:(i)外部威胁对制度复杂度有独立正向效应(控制了内部交换需求后仍显著)；
       (ii)该效应由制度中介(非威胁直接压制内部掠夺)；(iii)威胁撤除后制度会熵增退化
       (AXIOM-004组织熵增+BR-L2-010制度信任一旦建立也需要维护)；(iv)双驱动量
       (高威胁+高交换)产生正向交互效应(制度既满足防御需求又满足交换需求→双重正当性
       →更难退化)。

    6. "非平凡性(逐格判空)"
       2×2判据表见nontriviality_test。核心非平凡增量是外部威胁→制度复杂度的独立
       正向因果通道——这块不在任何一块承重砖中:BR-L2-008只涉及掠夺的成本-收益计算，
       未涉及制度作为集体防御的副产品；BR-L2-010只涉及制度替代人际信任支撑交换，
       未涉及制度可以被'怕被抢'而非'想做买卖'催生。两块砖合力产生的"威胁→制度"
       因果通道是组合增量，同时预测(iv)(威胁撤除→制度退化)和(iv)(双驱动量正向交互)
       产生了额外的非平凡性——单砖无法生成这些预测。

falsifiability: |
  本推论可被以下发现证伪(一次性注册，不得事后调整口径):

  (a) 外部威胁-制度复杂度零效应:在控制了内部交换需求(贸易量/GDP)和发展水平(人均GDP/城市化)后，外部威胁强度与制度复杂度之间的偏相关系数不显著(|r_partial|<0.15, p>0.05)。若成立，方向二(威胁→制度)的核心因果链断裂。

  (b) 威胁-内部掠夺抑制无中介效应:外部威胁强度与内部掠夺抑制程度之间的相关不由制度复杂度中介——即加入制度复杂度作为中介变量后，威胁→内部掠夺抑制的直接路径仍显著且不减弱。若成立，说明威胁可能通过其他渠道(如人口减少/社会团结)压制内部掠夺，而非通过制度——本推论的"制度是中介"机制被削弱。

  (c) 威胁撤除后制度不退化:外部威胁骤然消失后(如征服所有邻国、地理隔绝)，制度复杂度在一个世纪内不降反升或保持不变——且内部交换需求并未显著增加以补偿威胁撤除的效应。若成立，预测(iii)被证伪，制度对外部威胁的依赖被夸大。

  (d) 双驱动量无交互效应:高威胁+高交换政体的制度复杂度不显著高于单驱动量政体的加和——即交互项(威胁×交换)的回归系数不显著(p>0.05)。若成立，预测(iv)被证伪，双驱动量只是加性关系而非共生增强。

falsification_trace:
  primary_suspect: |
    方向二的因果链——"外部掠夺威胁→集体行动激励→让渡自由接受强制度"。
    三个子风险:(1)集体行动问题可能通过非制度路径解决——如分散的民兵/季节性征召/
    雇佣兵，这些不需要强中央制度(日耳曼部落/苏格兰氏族模式)，若此类非制度防御
    路径在历史上是常态而非例外，方向二的制度专属通道不成立;(2)强制度可能由
    内部因素(阶级冲突/灌溉需求/宗教整合)独立驱动，外部威胁只是众多因素之一且
    边际贡献可忽略——此时预测(a)不成立;(3)外部威胁与制度复杂度之间可能存在
    反向因果——已经是强制度的政体更能发动战争(而非战争催生制度)，若历史数据
    主要支持反向因果，方向二的箭头方向被逆转。地理工具变量(是否位于入侵通道)
    可部分缓解反向因果但无法完全消除。
  secondary_suspect: |
    预测(iii)的制度退化机制——威胁撤除后制度是否真会退化。AXIOM-004(组织熵增)
    和BR-L2-010(制度信任需维护)授权了退化方向，但退化的速度/幅度是否显著到
    可观测是另一回事。制度一旦建立可能产生既得利益集团(官僚/军官)即使外部威胁
    消失也抵制缩编——此时预测(iii)不成立但方向二的原始因果链仍可能正确。
  unlikely_suspect: |
    BR-L2-008(掠夺是真实且普遍的策略,IEA=2.0)和BR-L2-010(制度可替代人际信任
    支撑交换,IEA=2.0)——两块都是verified高IEA桥接砖，极少是问题根源。

excluded_outcomes:
  - outcome: "制度复杂度仅由内部交换需求单独驱动，外部威胁无显著独立贡献"
    description: "若预测(a)被坐实(威胁-制度偏相关不显著)，方向二的独立因果通道被证伪——此时本推论退化为'制度抑制掠夺'的单向主张(已在DED-006/DED-012中覆盖，本推论无增量)。"
  - outcome: "威胁→制度的因果方向完全反向(强制度→更多战争，而非战争→强制度)"
    description: "若工具变量分析(地理暴露/邻国掠夺倾向作为外生工具变量)显示反向因果主导，方向二的箭头方向被逆转。此时本推论需修正为'制度扩张导致更多外部冲突'——这是不同的机制(可能与DED-010的权力制度化相关)。"
  - outcome: "非制度路径的集体防御在历史上是主流"

anti_talisman_clause: |
  【防不可证伪护身符——三把锁，一次性注册，不得事后开锁】

  (1)【禁止由制度复杂度反推威胁强度】若某政体制度复杂度高，禁止事后声称"它一定面临过高外部威胁"来解释——外部威胁必须由独立于制度结果的通道测量(战争记录/地理位置/考古防御工事)，不得由制度复杂度本身推断。否则"威胁→制度"沦为不可证伪的循环。

  (2)【禁止由制度不退化反推"威胁其实没消失"】若预测(iii)被坐实(威胁消失后制度不退化)，禁止以"其实还有残余威胁/感知威胁/文化记忆中的威胁"为由护盘——威胁撤除的判定必须独立于制度是否退化(以战争频次归零/地理隔绝完成/邻国全灭为可观测标志)。若满足所有可观测撤除标志而制度不退化，首先接受(iii)被证伪。

  (3)【禁止反向因果逃逸】若工具变量分析(地理暴露)支持"威胁→制度"方向，但OLS/时序分析显示反向因果主导，禁止以"工具变量效力不足"为由拒绝OLS结果——两套方法的结果冲突本身就是信息:若地理暴露(外生)支持方向二但时序/OLS不支持，意味着方向二的效应量可能被高估或限定于特定时段/地区，需诚实标注而非选择性报告。

nontriviality_test: |
  2×2判据表(自变量档:外部掠夺威胁 高 vs 低 × 被预测量档:制度复杂度 高 vs 低):

  格(高威胁，高制度复杂度)——【核心非平凡格】——没有任何承重砖平凡地强制它:
  BR-L2-008确立掠夺是理性策略，但未涉及"外部掠夺威胁如何驱动被掠夺方建立制度"；
  BR-L2-010确立制度替代人际信任支撑交换，但未涉及"制度可以被'怕被抢'而非'想做买卖'催生"。
  此格成立的充分条件是三个要素的合取:外部掠夺是真实的资源夺取威胁(BR-L2-008)
  +集体防御需要克服搭便车问题→制度是可信方案(步骤4的集体行动逻辑)
  +制度一旦建立即可同时压制内部掠夺(步骤3/方向一)。
  若高威胁政体的制度复杂度不显著高于低威胁政体(控制了交换需求后)，该格被现实填上→方向二塌缩。

  格(高威胁，低制度复杂度)——【备择路径格】——若此格被大量实例填满(如日耳曼部落/苏格兰氏族/草原游牧联盟等靠分散民兵/季节性征召/个人忠诚而非强中央制度应对高威胁)，方向二的"制度是专属路径"主张被削弱——存在非制度的集体防御替代方案。此格不是证伪井(本推论不声称制度是唯一路径)但会收窄射程:若实例足够多，方向二从"通用因果"降为"一条可能路径"。

  格(低威胁，高制度复杂度)——【内部驱动格】——由内部交换需求(BR-L2-010的主路径)、内部阶级冲突、灌溉协调等非威胁因素独立驱动的高制度——本推论不否认此格的存在(预测(ii)的交互效应正依赖于两类驱动量的并存)。此格的存在不证伪本推论，反而是预测(iv)(双驱动量交互)成立的前提条件之一。但若此格的实例在控制交换需求后仍压倒性地多于(高威胁，高制度)格→外部威胁对制度的边际贡献被质疑。

  格(低威胁，低制度复杂度)——【基准格】——无外部威胁催生压力+内部交换需求低→制度复杂度低。此格是两块承重砖的平凡预测(BR-L2-008不要求任何制度应对掠夺，BR-L2-010不激活因交换需求低)。本推论在此格上无增量。

  brick=conclusion自查:'外部掠夺威胁通过集体行动逻辑驱动制度复杂度上升，与内部交换需求形成双向共生反馈'未在任何承重砖中原文或近义出现。BR-L2-008不含"制度"/"集体行动"/"让渡自由"；BR-L2-010不含"掠夺威胁"/"战争"/"外部安全"。两砖合取产生的"威胁→制度"因果通道及双向反馈环是组合增量——不在任何单一砖中。

real_world_anchors:
  supporting:
    - anchor: "Tilly的'战争缔造国家'——欧洲早期现代国家形成"
      evidence: |
        Charles Tilly(1990,"Coercion, Capital, and European States")的经典论证:
        欧洲近代国家(尤其法国/普鲁士)的制度复杂度(常备军/税收官僚/法律体系)不是
        经济效率驱动的，而是军事竞争驱动的——准备和进行战争需要从社会中提取资源，
        这迫使统治者建立越来越精密的财政-行政机器。此锚直接支持方向二(外部威胁→制度)，
        但独立于本体系: Tilly本人未区分"内部交换需求"vs"外部威胁"的独立贡献。
      confidence: strong

    - anchor: "Carthage vs Rome 的制度差异——海上贸易vs陆上战争的双驱动对比"
      evidence: |
        迦太基(海上贸易帝国):高内部交换需求(地中海贸易网)、中等外部威胁(与希腊/罗马
        的间歇冲突)→制度复杂度集中在商法/海事法/契约执行领域(符合BR-L2-010内部交换
        路径)。罗马(陆上军事帝国):高外部威胁(意大利半岛上的持续战争——埃特鲁里亚人/
        萨莫奈人/高卢入侵的集体记忆)、中等内部交换需求→制度复杂度集中在军事征召/
        税收/行省治理/公法领域(符合方向二的外部威胁路径)。两个案例的"制度形态"差异
        与驱动量差异一致——不只"制度多不多"，还看"制度长什么样"。
      confidence: moderate

    - anchor: "瑞士联邦的低制度化集体防御——威胁存在但走非制度路径"
      evidence: |
        瑞士联邦从中世纪到近代面临真实的外部威胁(哈布斯堡/勃艮第)，但走的是民兵
        联盟/分散防御/直接民主路径——制度复杂度(中央税收/常备军/官僚层级)远低于
        同期同威胁水平的法国/普鲁士。此锚同时支持与限定本推论:威胁确实催生集体防御
        安排(符合方向二的一般逻辑)，但不必然走"强中央制度"这条路——预测(iv)的
        交互效应暗示"高交换需求"是制度路径的催化剂，瑞士内部交换需求(山地农业/
        低城市化)低→威胁走非制度而非制度路径。这是格(高威胁，低制度复杂度)的实例。
      confidence: moderate
      note: "此锚同时是方向二的限定条件——威胁的'制度效应'可能被内部交换需求门控。这是增加射程精度的正面信息，不是反例。"

  counterexamples: []

  boundary_cases:
    - case: "蒙古帝国——极高外部威胁输出者自身制度简单"
      analysis: |
        蒙古帝国输出极高的外部掠夺威胁，但其自身的制度复杂度(成吉思汗时期的
        法律/官僚/税收)远低于同期宋/金/欧洲。这不直接证伪方向二——方向二讲的是
        "被威胁方"而非"威胁方"的制度反应。蒙古作为威胁输出者，其成功恰恰依赖
        BR-L2-008(掠夺是理性策略)+极低掠夺成本(骑兵机动性碾压定居社会)——
        这正是方向二的镜像:威胁方不需要强制度(因为它们在抢，不是在被抢)。
        而蒙古一旦转变为"被威胁方"(元朝建立后面对内部叛乱/外部挑战)，其制度
        复杂度迅速上升(行省制/驿站系统/纸币)——方向二在时间序列上反而被支持。
      status: boundary_case

discriminant_validity: |
  【独有可证伪预测】相对相邻理论逐一判别——

  (1) vs Tilly"战争缔造国家":Tilly的论证是历史叙事而非机制性理论——它没有区分
  "战争→国家"是通过什么渠道(税收提取vs产权保护vs民族认同)，也未预测威胁撤除后
  的制度退化(预测iii)或双驱动量的交互效应(预测iv)。本推论嵌入体系的承重砖使机制
  可追踪(BR-L2-008定义威胁本质→BR-L2-010定义制度功能→集体行动逻辑连接二者)，
  并给出Tilly未给出的额外预测。可判别:若外部威胁与制度复杂度的正向关系在所有
  社会(不依赖内部交换需求)中等同→Tilly的通用叙事成立，本推论的预测(iv)被证伪。

  (2) vs DED-012"掠夺-保护同源与坐寇化":DED-012讲的是暴力提供者的视角——
  同一个暴力可以抢(流寇)也可以保护+抽税(坐寇)，以及坐寇何时交出制度化。
  本推论讲的是被统治者的视角——被威胁方为何愿意接受强制度。两条推论视角互补
  且预测正交:DED-012预测坐寇的制度化程度由"领地固定性×时间偏好"决定，
  本推论预测被威胁方的制度接受度由"外部威胁强度×内部交换需求"决定。
  可判别:若高外部威胁社会的制度全部由坐寇单方面建设(被统治者没有主动让渡自由
  的集体行动)→DED-012覆盖更全，本推论增量为零。若存在"自下而上"的制度需求
  表达(城邦联盟的集体防御条约/市民自组织民兵→制度化)→本推论有独有射程。

  (3) vs DED-006"信任天花板-制度外化":DED-006讲的是内部交换需求(陌生人交易→
  信任不够→制度外化)，是BR-L2-010的直接展开。本推论不替代DED-006，而是在其
  基础上增加第二条因果通道(外部威胁→制度)，并给出两条通道的交互预测(预测iv)。

  【防平凡化守卫】若有人说"有敌人→要军队→要收税→制度自然出现"是常识，
  非平凡增量在:(i)威胁撤除后制度会退化(AXIOM-004+BR-L2-010授权此退化方向，
  但退化幅度/速度是经验问题——常识不会预测制度会"回缩");(ii)双驱动量的
  交互效应(常识会说"两个原因各自推制度→制度更强"，不会预测交互≠加性);
  (iii)制度形态由驱动量组合决定(外部威胁→公法/军事/税收制度优先，
  内部交换→商法/契约/产权制度优先——制度不只"多不多"，还看"长什么样")。
  这三项构成了带测量口径的可证伪赌注，非模糊常识。

