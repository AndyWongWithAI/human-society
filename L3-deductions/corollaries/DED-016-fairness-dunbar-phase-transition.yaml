id: DED-016
type: deduction
layer: L3-deductions
status: verified
term: "面对面公平-制度化公平相变推论 (Face-to-Face to Institutional Fairness Phase Transition)"

人话摘要: "150人以下,公平靠'我认识你、下次还得见'维持;一超过这个数,要么各群自己玩自己的公平(碎片化),要么把公平外包给法院/契约/法官(制度化)——中间状态撑不住。公平从小圈子跳到大社会不是缓缓渐变,是跳过去的。"

statement: |
  【核心】维持公平感知的机制在群体规模越过~150人(Dunbar数)时发生结构性转换——
  当前经验证据与非线性跃升一致,但不能排除渐变可能性。群体<150:公平靠直接互惠
  ('这次分少了,下回照顾你')+声誉八卦('听说他上次坑了人')维护,因人际信任
  (BR-L2-009)覆盖全群、重复交互(AXIOM-003)使公平的共享比较标准
  (CONCEPT-fairness(a)(b))可经面对面途径维持。群体>150:层级必现(BR-L2-004),
  公平判断从人-人直接比较变为人-层-人多层嵌套;信任显著衰减(BR-L2-009:社会距离
  超出熟人圈后信任连续下降)使'我相信他会公平对我'的前提弱化;直接互惠与声誉网络
  双双过载。此时两条路径:要么公平标准碎片化——各亚群自建'自己人一套/外人一套'
  的标准(THEOREM-group-identity-decay),整体不再有统一的公平可言;要么外包给
  非人格制度——法院/契约/职业法官/选举分权——以程序公平替代结果公平(BR-L2-015),
  以制度替代人际信任来维护公平标准(BR-L2-010)。注意:三个维持条件的弱化是连续渐变
  (继承BR-L2-009'软约束非硬悬崖'性质),但维持模式本身——A/B/C三档——可在连续
  驱动量上呈现结构性转换;当前经验证据与~100-250区间的非线性跃升一致,但受限于
  区间内经验锚的稀疏,不能排除更平缓的谱系过渡。

  【驱动量】群体规模(可事前测:人数),独立于'公平制度是否出现'的结果测量;承重机制
  是规模经由层级嵌套+信任断裂+身份衰减三条链推动相变,规模本身是外生可测量。

  【预测】(i)群体规模与'非人格化公平制度(法院/成文规则/职业法官)出现概率'之间存在
  高度非线性正相关——概率在~100-250人附近(Dunbar区间)集中跃升;当前经验证据与阶跃
  模式一致,但不能排除更平缓的渐变(渐变模型需独立解释:为何<150时制度近零出现而
  数千人规模时制度近乎必然)。(ii)规模以下(≤150)而无此类制度、却维持着统一公平规范
  的群体存在且普遍;规模以上(>150)而无此类制度、且仍维持着跨亚群统一公平规范的群体
  不存在(逐格为空)。(iii)规模以上群体若不发展制度,则公平标准沿亚群体边界碎片化
  ('自己人一套/外人一套')。

  【判别】与DED-002(口头规范→成文规范)判别:同一个规模机制但不同的被测量——DED-002
  预测'规范是否写下来',本推论预测'公平是否仍在面对面人-人层面被维护还是外包给制度层
  /碎片化'。与Weber/legal sociology'现代法律制度取代习惯法'常识判别:独有贡献是定量的
  '结构性转换+空格预测+碎片化vs制度化分支',而非'现代化→法律理性化'的定性宏大叙事。

operationalization:
  group_size:
    definition: "群体成员总数——共享同一套资源分配与冲突解决机制的稳定交互边界内的成员数。"
    measurement: "人口普查/考古聚落规模/民族志记载;可独立于公平制度存在与否测得。"
    limitations: "Dunbar数(~150)本身有争议区间(100-250),故预测以'非线性跃升在区间内'而非精确阈值表述,继承BR-L2-004/009的软约束性质。'群体边界'操作上按稳定交互网络识别,边界模糊处诚实地标注。"

  fairness_maintenance_mode:
    definition: |
      公平标准在该群体中的维护机制,按三档判据(谱系非二分):
      (A) 面对面统一——公平争端通过当事方直接交涉、声誉压力、熟人调解解决,无专门制度化
      载体(规则未成文、无专职仲裁者/法官、无第三方执行机构),且公平标准跨亚群统一;
      (B) 碎片化——不同亚群体适用不同的公平标准('自己人一套/外人一套'),整体不存在跨亚群
      统一的公平判断;
      (C) 制度化——存在非人格化公平制度,公平标准(至少宣称)跨亚群统一。档C的最低制度门槛
      (minimum institutional threshold):(1)存在常设(regularly-convened)第三方裁决机制
      ——定期集会的议事会/法庭/长老裁判团,非常设的ad hoc调解不满足此要素;(2)该机制宣称
      跨亚群管辖权——其裁决意图约束多个亚群体,非仅单一亚群内部;(3)裁决被集体承认为有
      约束力(binding)。成文规则、专职法官、国家执行机构是制度化的强化形态(intensification),
      非档C的门槛必要条件——口头法+兼任仲裁者+私人执行,只要满足上述常设+跨群管辖+裁决约束
      三要素,即落入档C的proto-C端,与成文法典+职业法官+国家执行同属档C谱系。此门槛的
      锋利效果:冰岛Althing(年度常设+跨区域管辖+裁决约束力)→档C;易洛魁Grand Council
      (定期常设+跨民族管辖+裁决约束力)→档C;澳大利亚原住民 elders' councils(非定期常设、
      ad hoc召集)→不满足常设性门槛→非档C,其裁决若非跨band常设则不满足C门槛。
      关键:同一门槛统一适用于所有案例,不因案例在空格边缘而弹性调节。
    measurement: |
      档A:民族志/史料中对公平争端解决机制的具体描述——是否仅靠当事方+熟人网络、无第三方
      制度载体。档B:独立测亚群间公平标准的差异——对同类事件(资源分配/伤害赔偿)在群内vs
      群外适用不同标准,由民族志/法律多元主义文献的对比判例或vignette实验测得。档C:按最低
      制度门槛三要素独立测——(1)是否存在常设第三方裁决机制(定期集会的考古/档案/民族志证据),
      (2)该机制是否宣称跨亚群管辖权,(3)裁决是否被集体承认为有约束力。成文规则/专职法官/
      制度化执行是档C的强化证据(使判定更易),非档C必要条件。
    limitations: "A↔B↔C是谱系非二分;混合态按主导模式标注;'统一'是程度(无群体绝对统一),操作上以'存在跨亚群的共识性公平解决机制'为判据。"

derivation:
  from_l1:
    axioms: [AXIOM-003]
    theorems: [THEOREM-group-identity-decay, THEOREM-cooperation-precondition]
  from_l2:
    bridging: [BR-L2-004, BR-L2-009, BR-L2-010, BR-L2-015]
  steps: |
    1. "面对面公平的维持条件(CONCEPT-fairness + AXIOM-003 + BR-L2-009)"
      公平是共享的比较性判断(CONCEPT-fairness(a)(b))。在<~150群体中,人际信任覆盖
      全群(BR-L2-009:社会距离在熟人圈内不触发显著衰减),重复交互(AXIOM-003)使直接互惠
      ('下次补')与声誉('听说他坑人')可执行——网络小、信息可达全员。此为档A的存在条件。

    2. "规模越界:三个维持条件同时显著弱化(BR-L2-004 + BR-L2-009 + THEOREM-group-
       identity-decay)" 规模>~150:(a)层级必现(BR-L2-004)→公平比较从'我vs你'变为
      '我的层vs你的层',直接互惠不再一对一可算;(b)信任随社会距离连续衰减(BR-L2-009:
      非硬悬崖)→多数交互对象已出熟人圈,声誉网因规模过大而信息过载(无法追踪全员的
      '公平记录');(c)亚群独立身份形成(THEOREM-group-identity-decay)→各亚群自建规范,
      公平标准被拉向碎片化。档A的三个维持条件不再能可靠维持跨亚群统一公平。

    3. "两条出路(BR-L2-015 + BR-L2-010)——兼回应模式D(仪式性维持)穷尽性质疑"
      档A维持条件已显著弱化,余下两条可行路径:(a)碎片化(档B)——各亚群维护自己的公平
      标准(CONCEPT-fairness(a)共享性只在亚群内成立,跨亚群不再共享);(b)制度化(档C)
      ——外包给非人格制度:不认识对方→不能靠'交情补结果不公'→只能靠程序(BR-L2-015:
      程序公平替结果公平),程序需要制度载体;制度替代人际信任来维护公平标准
      (BR-L2-010的同构应用:公平域实例)。

      潜在模式D(周期性全体集会/仪式/跨亚群交换婚维持跨亚群统一公平标准)不影响二择
      结构,理由如下:仪式与周期性集会能【传输共享规范】(传递'什么是公平'的共识性期待),
      但不能【裁决跨亚群公平争端】——裁决某个具体争端(张某vs李某谁占了谁的便宜)需要
      要么当事方直接交涉(档A,规模>熟人圈不可靠)、要么第三方介入裁决(档C的制度最小
      形式)。若周期性集会中 elders 组成常设裁决体→此为档C的雏形(proto-C,满足最低
      制度门槛三要素);若集会仅传输规范而无常设裁决→跨亚群争端裁决退回到当事方交涉
      或亚群内解决→此为功能档B(名义规范共享但裁决碎片化)。因此模式D要么塌缩为proto-C
      (有常设裁决体)、要么塌缩为档B(无跨亚群裁决能力),不构成独立的第三条路径。
      经验注脚:澳大利亚原住民 songline 体系(语群>150,经 songline+corroboree 连接)
      展示此结构——Dreaming 传输共享规范,但争端裁决停留在地方 band 层级,跨 band
      争端靠 elders 协商(非常设、ad hoc),支持'规范共享≠裁决统一'的区分。

    4. "中间状态不可持续——非平凡性(逐格判空)" 规模>150且档A(面对面统一公平)、B/C皆
      不存在这一格预测为空。理由:维持档A的三个必要条件(全群信任覆盖+重复交互+共享身份)
      在>150时同时显著弱化至无法可靠维持跨亚群统一公平,而档B和档C是仅剩的两条可行路径
      (模式D不构成独立路径,见步骤3)。此空格是真经验主张——若发现反例(>200人、无制度
      无碎片化、跨亚群统一公平维持超过一代人),推论被证伪。注意:档A的维持条件在~150附近
      表现为逐渐失能而非瞬间蒸发(BR-L2-009软约束性质),此为谱系过渡的非平凡节点。

    5. "驱动量归因" 驱动量是群体规模本身(经上述机制链→公平维护模式相变),非经济发展程度/
      国家形成/文字出现——后者是伴随量。规模是事前可测的独立量,不依赖公平制度是否存在。

falsifiability: |
  本推论可被以下发现证伪:
  (a) 发现一个群体规模>200人、维持超过一代人(>20年),具有跨亚群统一的公平规范
  (非碎片化),且无任何常设第三方裁决机制(按档C最低制度门槛:无定期集会的裁决体/
  无跨亚群管辖权/裁决无集体约束力)——即档A在超Dunbar规模下持续存在。⇒ 证伪核心
  (空格被填)。
  (b) 非人格化公平制度的涌现与群体规模的关系为线性/平缓单调,在~100-250附近无
  可辨识的概率跃升。⇒ 削弱'结构性转换集中在Dunbar区间'的核心主张;若纯线性关系
  成立(概率仅随规模线性上升),推论失去结构性转换的独特性,退化为平凡的'规模→制度'
  单调关联。
  (c) 规模以上(>150)群体不发展制度时,公平标准并不沿亚群边界碎片化,而是以其他非制度化、
  非碎片化的方式维持跨亚群统一。⇒ 证伪(iii)。

falsification_trace:
  primary_suspect: "空格预测(档A在>150时为空)压在'档A三个维持条件在超Dunbar时全部显著弱化至不可靠'这条腿。最脆弱环节:是否存在非制度、非碎片化的机制可在>150时维持跨亚群统一公平【裁决】能力——注意区分规范传输与争端裁决(见derivation step3模式D分析)。若存在不需常设裁决体即可跨亚群统一裁决公平争端的机制,空格被填、核心证伪。"
  secondary_suspect: "BR-L2-015的'程序替结果'在公平域的适用边界——程序公平是否确实需要制度载体(法院/成文规则),还是可在非正式程序中兑现;以及BR-L2-010的'制度替信任'从交换域推广到公平域是否同构有效。"
  unlikely_suspect: "BR-L2-004的层级普适性本身——跨域证据最坚实,极少是根源。"
  note: "刻意规避'因有制度故推有需求'的循环:group_size由独立人口数据测,fairness_maintenance_mode由独立制度/民族志证据测,不由群体规模反推、也不由结果反推前件(见anti_talisman_clause)。"

excluded_outcomes:
  - outcome: "群体>150有制度(档C)但制度被精英俘获、不公平"
    description: "本推论预测制度化的【出现】,不预测制度是否被俘获(那是DED-008的射程)。只要制度载体存在(法院/成文规则/法官),即属档C、支持预测(i)。"
  - outcome: "群体<150却出现了公平制度"
    description: "不证伪——本推论只预测>150时空格,不禁止<150时出现制度(如因文化传播)。预测(ii)只说<150时无制度可维持统一公平,不说不出现制度。"
  - outcome: "公平制度由非规模因素(战争/贸易/文化传播)触发"
    description: "本推论主张规模是驱动量,不主张唯一原因。竞争性原因不证伪,除非证明规模完全无解释力(命中falsifiability(b))。"

anti_talisman_clause: |
  【防不可证伪护身符】判定群体处于A/B/C哪一档时,必须【独立于群体规模】测得——通过
  民族志/史料中对公平争端解决机制的具体描述(当事方交涉vs亚群差异vs制度载体),不得因
  '群体>150'就推断'必然是B或C',也不得因'群体<150'就推断'必然是A'。碎片化(档B)的
  判定须由独立证据(亚群间公平标准差异的可观测判例/规范陈述)支撑,不得因'>150且无制度'
  就自动推断'已碎片化'。否则空格预测沦为不可证伪循环(DED-004病根)。

nontriviality_test: |
  2×3判据表(群体规模 × 公平维护模式):
  格1(≤150,A档面对面统一):预测非空——狩猎采集族群、村落社会,有大量实例。
  格2(≤150,B档碎片化):可能出现(裂变亚群已有内外之别),但非被预测量。
  格3(≤150,C档制度化):罕见但不被禁止(如受邻邦文化传播),非证伪格。
  格4(>150,A档面对面统一):【预测为空】——唯一承载非平凡性的格。
  格5(>150,B档碎片化):预测非空——不发展制度则碎片化。
  格6(>150,C档制度化):预测非空——越过Dunbar则制度出现概率跃升。

  空格论证:格4为空不是任何单一承重砖的平凡推论。BR-L2-004单看只说>150→层级(任意组织
  制度),不说公平制度;BR-L2-009单看只说信任有界,不说公平维护模式;BR-L2-010单看只说
  制度能替代信任(交换域),不说公平域是否需要、也不预测碎片化这条替代路径;BR-L2-015单看
  只说程序可替结果,不说规模阈值。唯有四砖合成+CONCEPT-fairness的共享比较结构,才推出
  >150时档A三个维持条件同时坍塌、余下B/C两条路径、中间格(A)为空。故非平凡、非砖内结论。

  【brick=conclusion诚实审查】BR-L2-004近定义(>150→层级,不说公平制度);真发动机是
  BR-L2-009(信任随社会距离连续衰减→档A维持条件的根基瓦解)+THEOREM-group-identity-decay
  (身份衰减→碎片化拉力)+BR-L2-015(程序替结果→制度需求)三者的联合。BR-L2-010(制度能
  替代人际信任)是制度经济学教科书级常识——近定义而非发动机;其角色是确认'替代在原则上是
  可能的'(制度可行性的前提),不是驱动'为什么在Dunbar处需要替代'。本推论真正的非平凡卖点
  是碎片化档B的存在——证明制度化非自动、碎片化是独立的结构性替代路径,此卖点不依赖
  BR-L2-010。四砖各贡献不同,无一单独包含'公平制度在Dunbar处结构性转换'的结论。

real_world_anchors:
  supporting:
    - anchor: "狩猎采集族群(<150人)——面对面公平(档A)"
      evidence: "!Kung San/Hadza/Ache等:资源共享通过直接互惠+声誉维持,公平争端由当事方+熟人调解,无正式法院/法官/成文规则。民族志广泛记载。"
      confidence: strong
    - anchor: "两河流域早期城邦(乌鲁克/乌尔)——跨Dunbar后制度涌现(档C)"
      evidence: "城邦人口远超Dunbar,出现神庙法庭、法典(乌尔纳姆法典~前2100BCE)、专职法官。制度随规模跃升而涌现。"
      independent_size_evidence: "聚落考古(面积×密度)可独立估人口,不依赖法典是否存在。"
      confidence: moderate-strong
    - anchor: "冰岛共和国(Althing,930-1262)——边界案例"
      evidence: "总人口~40,000-70,000(远超Dunbar)但组织为~40酋长区(各区<Dunbar)。年度Althing+法律宣述人(logsogumadr)提供制度化框架,但执行靠私人仇杀/仲裁。处于档A→档C过渡态,支持'过渡态不稳定/相变在Dunbar附近'的预测。"
      confidence: moderate
