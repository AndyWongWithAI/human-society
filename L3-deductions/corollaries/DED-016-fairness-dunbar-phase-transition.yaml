    - case: "易洛魁联盟(Iroquois Confederacy)——已解决:confederate proto-C"
      analysis: "~20,000人跨5-6民族,Great Law of Peace(口头+wampum记忆)+Grand Council(50酋长定期集会)维持跨民族和平与规范。Round-1审查标记为潜在空格反例(>150、口头法、非专职酋长、无执行机构)。按锋利化后的档C最低制度门槛判定:Grand Council满足(1)常设——定期集会、固定成员席位;(2)跨亚群管辖权——裁决意图约束所有加盟民族;(3)裁决被集体承认为有约束力——Great Law确立了和平义务与争端解决程序。口头法与非专职仲裁者是档C谱系内的强化度差异(intensification),非门槛差异。故归档C(proto-C),支持预测(i)(规模>150→制度涌现)。注意:同一门槛下冰岛Althing同归proto-C、澳洲原住民 elders' councils 因缺常设性→非C,判据统一无弹性。"
      status: boundary_case

discriminant_validity: |
  【与DED-002判别】共享规模驱动量但被预测量不同。DED-002问'规范是否写下来(成文)',
  本推论问'公平靠面对面(档A)还是靠制度(档C)或碎片化(档B)'。同一群体会同时触发二者,
  但预测内容独立——DED-002不预测碎片化vs制度化分支,本推论不预测成文与否。

  【与Weber/法律社会学判别】Weber的'形式理性法取代实质理性法'是定性宏大叙事(现代化
  →法理性化),不给出(i)Dunbar区间结构性转换、(ii)空格预测、(iii)碎片化vs制度化分支结构。
  本推论独有可证伪内容=空格+结构性转换+分支。

  【防平凡化守卫——回应primary_suspect】最严重的平凡化威胁:'>150→公平制度'可能仅是
  '>150→任何制度(BR-L2-004)→其中碰巧包含公平制度'的同义复述。防线公平制度作为特定
  制度类型的独立需求:公平的共享比较性(CONCEPT-fairness(a)(b))要求跨亚群标准的统一,
  而一般层级(BR-L2-004)只解决决策效率、不解公平标准的跨群共享。碎片化(档B)的存在是本
  推论的逻辑锚——它证明制度化【不是】自动的(如果>150自动出任何制度、且任何制度自动含
  公平制度,则档B也应为空、与档A同空→无预测内容)。碎片化作为替代路径证明了公平制度
  的独立选择压力。若未来证据表明超Dunbar群体的制度清单中,公平制度只是随一般制度自动
  出现、无独立需求,则推论被削弱但尚非同义——因碎片化档B的存在仍维持了非平凡性。

