id: DED-002
type: deduction
layer: L3-deductions
status: verified

term: "规范成文化阈值推论 (Norm Codification Threshold Corollary)"

statement: |
  完全依赖口头传承的规范体系存在一个复杂度天花板——
  由个体认知的记忆和检索能力上限决定。

  当社会规模增长到口头规范体系的民主可达性上限之上时，
  必然出现以下两类响应之一：

  【突破型】保持单一政体，改造规范体系以承载超限复杂度：
  (a) 成文化——将规范外化到非人脑的物理存储介质；
  (b) 分层化——不同社会阶层遵循不同的规范子集；
  (c) 专业化——出现专门的规范记忆者/解释者。

  【规避型】拒绝让规范承载单元超过上限：
  (d) 分裂裂变——社会通过分裂为多个自治小单元来消化人口增长，
      每个规范承载单元始终维持在口头上限之下。

  关键区分：突破型在统一政体内改造规范体系以"突破"天花板；
  规避型不改造规范体系，而是通过不让被治理单元超限来"规避"天花板。
  分裂裂变恰恰通过尊重天花板来确认它的存在——而非违反它。

  天花板约束的不是"规范能否存在"——它约束的是
  **规范的分布式可达性**：即在一个统一的规范共同体内，每个成年
  成员能否独立、完整地获取和正确应用所有适用于自身的规范。
人话摘要: "口口相传的规矩有个复杂度上限；社会一大、规矩一多，要么把规矩写下来、分层、或找专人记诵来突破上限，要么干脆分裂成一堆小单元、让每份规矩都不超上限——分裂恰恰印证了这道坎的存在。"

# === 规则 A：操作化定义 ===

operationalization:
  explicit_behavioral_norm:
    definition: |
      一条"显式行为规范" = 一个满足以下全部条件的命题：
      (a) 可陈述性：该群体的成年成员能够用语言清晰陈述
          （不是"感觉应该这样做"而是"规则是 X"）
      (b) 规范结构：包含"在情境 S 中应做/不应做 A"的结构
      （c) 社会回应：违反该命题会引发可预期的社会回应
          （惩罚/谴责/排斥/赔偿——有具体形式）
      (d) 跨情境适用性：适用于一类情境而非单一事件
          （"不可杀人"是一条；"上周三不可杀张三"不是独立规范）
    counting_rules: |
      - 一般原则算一条规范。具体的应用细则不算独立规范。
        例："不可偷窃"是一条。"偷羊赔两只、偷牛赔五只"是细则——
        如果它们是"不可偷窃"的具体应用，不算独立规范；
        如果它们是被独立陈述且独立执行的，可以各自算一条。
      - 例外规则算独立规范（如果满足上述条件）。
        例："不可杀人"是一条，"战争中杀敌除外"是一条独立的例外规范。
      - 同一规范在不同语境中的重复陈述不重复计数。
    measurement_protocol: |
      1. 由两名独立编码者各自阅读同一份民族志材料
         （或访谈记录/法律文本）
      2. 各自按上述规则枚举所有显式规范
      3. 计算 intercoder reliability (Cohen's κ)
      4. 不一致项由第三名编码者裁决
      5. 最终规范数量 = 两名编码者达成共识的规范数
    limitations: |
      - "显式"是连续谱而非二元分类。介于显式规则和隐性习惯之间
        的灰色地带（"大家都这么做但从不说出来"）可能导致争议。
      - 民族志记录的完整性差异影响可比性。
      - 编码方案需要针对不同文化的语言习惯进行校准。
      - 由于这些限制，规范计数的跨文化比较应被视为数量级估计
        而非精确统计。

  oral_norm_system:
    definition: |
      规范的全部内容仅存储在人类记忆中——
      不存在任何形式的书面或符号记录（石碑、纸张、数字文件）。
    measurement: |
      确认该社会无文字系统（无书写符号体系、无碑文、无书面文献）。
      注意：文字的存在（如邻近社会使用文字）不等于该社会使用文字
      来记录规范——关键是被研究的社会是否将文字用于规范存储。
    limitations: |
      - 历史上有些社会有"部分文字使用"（如仪式铭文）但法律仍为口头。
        需要按"规范是否被写下来"而非"文字是否存在"来判定。
      - 考古学中的"无文字"判定可能因记录未保存而低估。

  normative_accessibility:
    definition: |
      一个普通成年成员能否在需要时独立获取并正确应用
      适用于自身情境的规范——不需要咨询专家。
    measurement: |
      - 选取 N 个成人成员（随机抽样）
      - 呈现 M 个常见社会情境（如财产纠纷、婚姻、伤害赔偿）
      - 要求成员陈述适用的规范
      - 计算"无需外部帮助正确陈述"的比例
      - 规范民主可达性 = 情境 × 成员的平均正确率
    limitations: |
      - 情境选择可能带有研究者的文化偏见
      - "常见情境"的定义在不同社会中不同
      - 在专业化社会中，预期此指标较低——但这是描述而非贬义

# === 推导链 ===

derivation: |
  from_l1:
    axioms: [AXIOM-003]
    theorems: [THEOREM-norm-energy-saver, THEOREM-cooperation-precondition]
  from_l2:
    bridging: [BR-L2-001, BR-L2-005]

  steps:
    1. "规范涌现是交互的必然产物——且规范随交互复杂度增长"
      AXIOM-003: 重复交互 → 共享规范涌现。
      BR-L2-005: 人类确实在重复互动中自发发展互惠规范。
      社会规模增长 → 交互类型增加 → 所需规范的数量和复杂度增长。

    2. "规范本身消耗认知资源"
      THEOREM-norm-energy-saver 证明规范降低协调成本。
      但应用规范需要认知操作：记住规范、识别情境、执行规范行为。
      这三个步骤受 BR-L2-001（有限理性）约束。

    3. "口头规范体系的天然上限"
      在纯口头社会中，规范内容全部存储在人类记忆中。
      三个互相强化的约束：
      (i) 个体记忆容量上限——一个人能记住的显式规则有限
      (ii) 跨代传承的累积衰减——每次口耳相传都有信息损失（AXIOM-002）
      (iii) 多人间规范一致性的协调成本——随着人数增长，维持
           "所有人对规范的理解一致"的成本非线性上升

    4. "天花板约束的是规范的民主可达性"
      天花板不禁止"复杂规范的存在"——冰岛自由邦证明了口头社会
      可以通过专业化（法律宣讲人 lögsögumaður）维持高度复杂的
      法律体系 300 年。但天花板约束的是：
      - 普通人能否独立获取规范？
      - 规范知识分布在多少人的记忆中？
      - 获取规范信息需要付出多少成本？

      冰岛恰好验证而非证伪：普通人依赖每年三次的法律宣讲会
      来获取法律知识——他们不能随时独立查询。这正是专业化适应。
      冰岛体系的脆弱性也符合推论：法律宣讲人的记忆是单点故障。

    5. "四种适应路径——突破型与规避型，各有独立检验标志"
      【突破型：保持单一政体，改造规范体系】
      (a) 成文化：规范被写下来并可供成员查阅。
          可检验：存在物理规范文本 + 成员可通过查阅文本获取规范。
      (b) 分层化：不同阶层适用不同规范子集，个体只需记忆自己的部分。
          可检验：不同社会阶层（按可观测标准定义）适用的规范集合
          有统计显著的差异（> 30% 不重叠）。
      (c) 专业化：出现专门角色负责记忆和解释规范。
          可检验：存在"当成员遇到规范问题时首选咨询的角色"+
          该角色对 > 30% 的规范有排他性解释权。

      【规避型：拒绝让规范承载单元超过上限】
      (d) 分裂裂变：社会不改造规范体系，而是分裂为多个自治小单元，
          每个单元的规范承载规模始终维持在口头上限之下。
          可检验：社会人口远超上限（如数十万至数百万），但不存在
          一个统一的规范共同体——规范由大量自治单元各自维持，
          单元规模普遍在阈值（约数千人）以下，跨单元无统一规范权威。
          经验实例：索马里 Xeer（赔命价群数百至数千人）、
          前殖民伊博（自治村落/村群），见 real_world_anchors 与 EMP-TEST-002。

      【突破型 vs 规避型的本质区别】
      前三种在统一政体内"突破"天花板——规范体系被改造。
      第四种"规避"天花板——规范体系不变，改变的是政体的组织方式。
      分裂裂变不是天花板的反例：它恰恰通过让每个单元尊重天花板
      来确认天花板的存在。区分这两类的意义在于——它防止把
      分节无国家社会（数百万人口但无统一规范体系）误判为
      "大规模口头社会民主可达"的反例。

    6. "被排除的结果——推论的证伪条件"
      一个 > 5000 人的**统一规范共同体**（不是分节社会的松散集合），
      纯口头，其中 > 80% 的成年成员能够独立陈述 > 300 条显式规范
      （不需要咨询专家），且这些规范在该共同体中被日常遵守。
      关键限定：必须是**单一规范共同体**——分裂裂变社会的总人口
      再大也不满足此条件，因为其规范承载单元是分立的小单元。
      反之，若发现分裂社会的某个自治单元本身 > 5000 人、
      规范民主可达 > 300 条且无专业化角色——这将证伪推论。

    7. "因果方向的诚实声明"
      文字发明 ↔ 社会复杂化 ↔ 规范增长 三者之间的因果关系
      不是单向的：
      - 文字最初不是为法律发明的（楔形文字始于会计记录）
      - 社会复杂度增长可能驱动文字的使用扩展（包括法律用途）
      - 成文化后又反过来释放了新的复杂度增长空间

      推论不做强因果方向主张。核心主张是：
      口头规范存在复杂度上限——当社会复杂度超过此上限时，
      必须在 (a)(b)(c) 三种适应中选择至少一种。
      成文化是其中最彻底的——它移除了天花板而非仅仅绕过它。

# === 可证伪性 ===

falsifiability: |
  本推论可被以下任一发现证伪：

  (a) 发现一个纯口头、> 5000 人的**统一规范共同体**，其 > 80%
      成年成员能够独立陈述 > 300 条显式规范，且这些规范被日常遵守。
      操作化定义见 excluded_outcomes。
      （注意"统一规范共同体"的限定：分裂裂变社会的总人口不算——
      必须是单一的、共享同一套规范权威的共同体。）

  (b) 发现一个纯口头社会，其规模 > 10000 人，持续 > 100 年，
      作为**单一规范共同体**运作（非分裂为自治小单元），
      且不存在任何形式的规范专业化、分层化或分裂裂变——
      即每个成年人都掌握所有规范且规范知识分布完全均等。

  (c) 发现在跨文化的规范计数量化研究中（使用本推论的编码方案），
      纯口头社会的显式规范中位数 ≥ 文字社会的显式规范中位数。

  (d) 发现一个分裂裂变社会，其某个自治规范承载单元本身 > 5000 人，
      规范民主可达 > 300 条且无专业化角色——
      这将证伪"裂变把单元维持在口头上限之下"的规避型机制主张。

  反证保护声明：分裂裂变作为第四种适应被加入，不得使推论变得
  不可证伪。防线是：证伪条件 (a)(b)(d) 定义了明确的、可观测的
  状态——一个统一的大规模口头社会实现规范民主可达。裂变**不是**
  达成此状态的方式，而是回避此状态的方式。因此裂变的加入不填补
  证伪空间，证伪条件依然有效。

falsification_trace:
  primary_suspect: "个体记忆容量的上限数值——如果人类长期记忆对显式规则的容量远超当前认知科学的估计（例如 > 2000 条），那么口头天花板可能在实践中永远不会被触及，推论的经验意义丧失。"
  secondary_suspect: "规范计数的编码方案——如果不同的编码方案得出截然不同的规范数量排序，推论的'规范数量存在上限'主张依赖编码方案的可靠性。"
  unlikely_suspect: "BR-L2-001（有限理性）——如果人类认知的实际约束比当前认知科学所认为的弱得多，天花板可能不存在。"

# === 排除的结果 ===

excluded_outcomes:
  - outcome: "大规模口头社会的规范民主可达"
    description: |
      一个 > 5000 人的纯口头**统一规范共同体**，> 80% 成年成员能
      独立、不需要咨询专家地陈述 > 300 条适用规范，
      且这些规范在日常互动中被遵守（> 70% 合规率）。
      "统一规范共同体"限定：分裂裂变社会（如索马里、伊博）的
      总人口不满足此条件——它们由大量分立的自治小单元构成，
      不是单一的规范共同体。必须是共享同一套规范权威的统一共同体。
    testability: |
      需要对该社会进行系统的民族志规范编码 + 成员知识测试。
      如果检测到这样的情况（在一个统一共同体中，而非分节社会），
      推论的"天花板约束民主可达性"这一核心主张被证伪。

  - outcome: "文字发明后规范数量无阶跃增长"
    description: |
      在跨文化量化研究中发现：文字社会的规范中位数
      ≤ 口头社会的规范中位数（使用统一编码方案）。
    testability: |
      需要一个跨文化规范数量的量化数据库。
      这是可做的——需要人类学家和法律史学家的合作编码。

# === 现实锚点 ===

real_world_anchors:
  supporting:
    - anchor: "狩猎采集社会的规范数量有限"
      evidence: |
        人类学研究显示，狩猎采集社会（如 !Kung San、因纽特人、
        Mbuti）拥有有限的显式行为规则——通常在几十到百余条之间。
        大多数日常协调通过隐性理解和个案协商完成。
        当社会规模增长到部落联盟和酋邦时，显式规则数量显著增加——
        同时伴随规则记忆的专业化（长老会议、酋长顾问）。
      confidence: moderate

    - anchor: "汉谟拉比法典——成文化的政治-结构双重触发"
      evidence: |
        汉谟拉比法典（约公元前 1754 年）包含 282 条法律条文，
        是已知最早的成文法典之一。
        重要语境：巴比伦在汉谟拉比之前已有楔形文字超过 1000 年——
        但文字最初用于会计（粮食/牲畜记录）而非法律。
        文字用于法律的触发点与美索不达米亚政治单位的规模膨胀
        同步。法典前言声明"使强者不欺压弱者"——既有政治动机
        （巩固王权），也有结构功能（统一规范标准）。

        1000 年延迟不削弱推论——它说明文字技术是必要条件但不是
        充分条件。文字必须首先从计数工具进化为完全语言表达系统，
        社会复杂度必须达到临界点，政治条件必须允许——
        三者共同触发了法典化。
      confidence: moderate

    - anchor: "罗马十二铜表法——从专业化垄断到成文化公开"
      evidence: |
        十二铜表法（约公元前 450 年）的背景：贵族（patricians）
        通过祭司垄断法律知识（专业化模式）。平民（plebeians）
        要求法律公开和成文——不是要求新法律，而是要求将已有法律
        从少数人的记忆中解放到公共物理介质。
        这正是"专业化适应 → 成文化转型"的历史实例。
        平民的诉求本质上是：降低规范的获取成本。
      confidence: strong

    - anchor: "判例法的'第二层外化'"
      evidence: |
        即使在有成文法的现代法律体系中，判例法（case law）的运作
        也显示了口头上限的持续存在：法官和律师无法靠记忆掌握
        所有相关判例。他们依赖法律数据库、索引和检索系统。
        这是成文化突破天花板后，规范总量继续增长到超出人脑容量
        的实例——需要"第二层外化"（从书籍到可检索数据库）。
        推论的逻辑在更高层级上重复：人脑 → 书籍 → 数据库。
      confidence: moderate

    - anchor: "索马里 Xeer 习惯法——分裂裂变的范式（EMP-TEST-002）"
      evidence: |
        索马里族历史上达数百万人，纯口头（Xeer 至 1972 年通用正字法
        确立前未被书面化）。但 Xeer 从不以一套跨百万人的统一规范运作——
        它以**分节裂变**方式运作于氏族/次氏族层级：赔命价群
        （diya-paying group）规模常为数百至数千人，每个氏族有自己的
        xeer 变体。这是规避型适应：人口增长不通过改造规范体系消化，
        而通过分裂为低于口头上限的自治单元消化。
        （单元内仍有专业化——oday 长老、xeer begti 习惯法专家有主导
        解释权——所以它也不满足"民主可达 + 无专业化"的证伪条件。）
      confidence: strong

    - anchor: "前殖民伊博族——无国家社会的分裂裂变（EMP-TEST-002）"
      evidence: |
        伊博族数百万人，纯口头，以"Igbo enwe eze"（伊博无王）著称，
        组织为自治村落/村群，单元规模数百至数千人。数百万人口靠
        **裂变**为小自治单元消化，统一规范社区始终小于阈值。
        相对民主的规范参与（村落议事会 ama-ala、年龄组）恰恰出现在
        人口小于 5000 的单元层级——不满足"> 5000 人 + 300 条独立
        掌握"的证伪条件。同时存在神谕（Arochukwu Ibini Ukpabi）与
        dibia 作为跨村专门仲裁角色。
      confidence: strong

  counterexamples:
    - case: "冰岛自由邦 (930-1262 CE)"
      analysis: |
        冰岛自由邦是最重要的边界案例：
        - 规模约 3-6 万人，持续 300+ 年
        - 无成文法典（直到 1117 年才首次书面记录）
        - 拥有复杂的法律体系：财产、侵权、婚姻、继承、杀人赔偿
        - 法律宣讲人（lögsögumaður）每年背诵三分之一的法律

        这是否证伪推论？不——它验证了预测 (c) 专业化。
        法律宣讲人正是"专门角色负责记忆和解释规范"的实例。
        普通冰岛人不能随时独立查阅法律——他们依赖每年三次的
        法律宣讲会。规范的民主可达性很低。

        但冰岛暴露了推论的重要限定：专业化在特定条件下可以
        长期（300 年）地绕过口头天花板。推论需要补充：
        专业化的稳定性条件——法律宣讲人制度需要可靠的知识
        传承机制（学徒制、三年循环背诵）和高社会地位激励。
      status: validates_specialization

    - case: "凯尔特德鲁伊的口头法律传统"
      analysis: |
        凯尔特社会的德鲁伊阶层（Druids）垄断法律和宗教知识，
        据凯撒《高卢战记》记载，德鲁伊学徒需要长达 20 年的
        口头记忆训练，且禁止将教义写下来。
        这是一个极端专业化案例——知识的深度专业化使得
        口头体系可以维持大量法律和宗教知识。
        但普通高卢人显然不能独立获取这些知识。
        验证了专业化模式，但同样暴露了专业化体系的脆弱性——
        德鲁伊阶层的消失（被罗马消灭）导致知识体系的整体灭绝。
      status: validates_specialization

  boundary_cases:
    - case: "前文字时期美索不达米亚的规范演化"
      analysis: |
        楔形文字从计数符号 → 词语符号 → 完整语言表达的过程
        花费了超过 1000 年。在此期间，美索不达米亚的城邦规模
        已经超越了口头上限。推论预测在这 1000 年间隙期应该出现
        专业化或分层化适应——而这正是考古学所显示的：
        神庙祭司阶层在社会和法律事务中的核心地位。

        但这个案例的问题是：我们无法直接观测文字发明前
        美索不达米亚的口头规范数量。论证依赖考古学推理而非直接测量。
      status: boundary_case

