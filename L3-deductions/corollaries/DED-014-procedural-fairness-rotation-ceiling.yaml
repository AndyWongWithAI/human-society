id: DED-014
type: deduction
layer: L3-deductions
status: verified

term: "程序公平的轮替天花板推论 (Procedural Fairness Rotation Ceiling Corollary)"

人话摘要: "过程再透明、裁判再中立，只要输家永远没机会翻盘——程序就不是'公道'而是'赢家的遮羞布'。程序公平能替结果公平有个硬前提：输家得信下次可能赢。信不了，崩。"

statement: |
  BR-L2-015 给出一条连续函数：程序公平（透明/中立/发言机会/一贯执行）→ 不利结果接受度
  上升——但它【未】给出这条函数在什么条件下失效。本推论定位它的失效边界。

  【核心】程序公平替代结果公平有一个硬天花板：输家得相信自己下次有机会赢。当轮替概率
  趋近于零时，再透明的程序也被认知为'赢家的遮羞布'，丧失合法性供给能力。程序信任不是
  程序质量的函数，而是【程序质量 × 轮替开放度】的乘积——轮替归零拉全部归零。

  【承重逻辑】三条原材料的联合边界（每条单独都不给这个交点）：
  (a) BR-L2-015：程序公平 → 不利结果接受度上升——只覆盖'效应存在'，不覆盖'效应何时
      归零/逆转'。连续正函数的失效边界不在其射程内。
  (b) CONCEPT-fairness(b) 比较性：公平永远是相对的——'这次我吃亏了但下次我可能赚'。
      跨期比较是程序被接受的隐性前件：主体"当下接受吃亏"的前提是"在同一个规则下我
      将来可能获利"。若轮替归零，未来获利的概率=0，比较性断裂 → 公平标准不再共享
      （违反 CONCEPT-fairness(a) 共享性），回到 CONCEPT-fairness(d) 代价执行通道
      （掀桌/退出/暴力）。
  (c) DED-011（结构层）：无轮替 → 败方无未来预期 → 掀桌理性化。本条将其从结构层
      '派系撕裂'转译到认知层'程序合法性供给崩溃'——败方'无未来预期'阻断 BR-L2-015
      的程序公平认知通道，使程序质量对接受度的贡献归零。

  【驱动量】轮替开放度——权力交替的【事前独立概率】（成文的定期换届规则被例行兑现的
  结构-程序事实），而非事后计数'换了几个人'（那是结局侧数据）。该量须独立于'是否接受
  结果'的测量。程序透明度（成文规则清晰度、裁决者中立性、发言机会、一贯执行）为控制变量。

  【预测】
    (i)   在程序透明度控制恒定的条件下，轮替开放度与败方结果接受度正相关，且当轮替→0
          时接受度【断崖式下降】——非线性。BR-L2-015 的连续正函数在轮替→0 处断裂：
          不是平滑递减，而是过某个阈值后陡降。
    (ii)  零轮替 + 程序极透明——这一组合的败方接受度，【低于】零轮替 + 程序模糊的组
          合。透明反成'赤裸裸的欺负'：当'你永远不会赢'被透明程序确证为无可争议的事实
          时，程序的安抚功能逆转、变成羞辱放大器。
    (iii) 逐格判空：'零轮替 + 程序透明 + 长期败方和平接受不利结果'这一格【预测为空】，
          可被现实反例填上。

  【判别·防平凡化】
    与 DED-011 判别：DED-011 的被预测量是'派系固化/清洗/分裂'（结构层——组织是否
    撕裂），本条的被预测量是'败方对程序公平的认知合法性'（认知层——公平知觉）。
    DED-011 走'无轮替→败方无未来预期→掀桌'的理性行动者通道；本条走'无轮替→公平
    的比较性断裂→程序不被认知为公平（透明度反转为负面信号）'的认知通道。两通道可并存
    但不等同——一个组织可在'结构上暂未撕裂'时'认知上合法性已空心化'，此态恰是本条
    可测新预测。
    与 Rawls / 程序正义文献判别：独有可证伪内容【非】'程序越公平越接受'（那是 BR-L2-015
    的复述），而是：(甲)轮替→0 处的断崖非线性；(乙)高透明+零轮替的【反常方向】（透明
    非始终好）；(丙)零轮替+透明+和平的空格。三条皆在 BR-L2-015 和传统程序正义文献的
    射程之外。
    primary_suspect：程序透明度 × 轮替开放度的'乘积关系'是否可独立测量——两个自变量
    各自独立测且效应可分离，在实际制度场景中高透明与高轮替常伴生、低轮替高透明的极限
    区域天然案例少。

# === 规则 A：操作化定义 ===

operationalization:
  rotation_openness:
    definition: |
      权力交替的【事前独立概率】——存在成文的定期换届/轮值规则，且该规则在常规
      （非危机）运作中被例行兑现（任职届满即改选/轮换这一程序事实）。连续量：
      从 0（终身制/无轮替规则或从未兑现）到 1（制度化定期轮替且每次兑现）。
      【不等于】事后计数'换了几个人'（那是结局侧数据、易与轮替开放度混淆）。
    measurement: |
      由两个独立于结局的结构-程序指标合成：
      (a) 成文换届规则清晰度：有无明确任期限制、定期改选/轮换的成文条款；
      (b) 兑现例行性：在常规（非危机）运作中，任期届满改选/轮换是否按期例行
          发生（选举如期举行、任职到期即换人——纯程序事实）。
      【硬约束】不得用'是否发生过和平交权'这一【结局邻近侧】先例测轮替可信度——
      '和平交权'与被预测量'败方接受度'近乎同轴（DED-007 焊点 / DED-011 教训）。
    limitations: |
      连续量，非二分；'兑现例行性'需至少覆盖一轮完整任期的时间窗观测。'轮替规则
      存在但从未兑现'= 轮替开放度趋零，不做假阳性。

  procedural_transparency:
    definition: |
      决策过程在程序上的公平程度——四个维度承自 BR-L2-015：规则成文清晰、裁决者
      中立不偏袒、各方有发言/申诉机会、规则一贯执行（类似案件类似处理）。
    measurement: |
      由制度成文事实 + 程序运作记录独立测：
      (a) 规则成文可查：决策/分配/裁决规则是否成文且公开；
      (b) 裁决者中立：遴选/回避机制是否制度化；
      (c) 发言机会：申诉/抗辩渠道是否开放且实际被使用；
      (d) 一贯性：规则适用是否跨案件/跨人一贯（需多案例比对）。
      与轮替开放度【分轴测】，不互相污染。
    limitations: "四个维度可合成但不完全正交；'一贯性'需多案例跨时间比对（观测成本高）。"

  loser_acceptance:
    definition: |
      暂时'败方'（在当次分配/裁决中处于不利结果的一方）对不利结果的【接受度】
      ——以'继续在规则框架内参与后续轮次、不诉诸规则外手段'为首要行为标志。
    measurement: |
      两维度分轴测：
      (a) 行为维度（主判据）：败方是否在后续轮次中继续参与规则框架（不掀桌、
          不清洗、不退出），而非诉诸规则外手段；
      (b) 态度维度（辅助）：对裁决/分配公正性的主观评价（调查/访谈数据，如有）。
      行为与态度可分离（嘴上服但行为不服、或反之）；以行为维度为主。
    limitations: "态度数据依赖调查可得性且易有社会期许偏差；行为接受需长时段观测。"

# === 推导链 ===

derivation:
  from_l1:
    axioms: []
    theorems: []
  from_l2:
    bridging: [BR-L2-015]
  from_l3:
    deductions: [DED-011]
  steps: |
    1. "BR-L2-015 给程序公平效应——但边界诚实"
       BR-L2-015 的三域交叉验证（法院/选举/博弈）坐实：程序公平 → 不利结果接受度上升。
       但这是一条【连续正函数】，它回答'程序公平是否有效'，不回答'程序公平何时失效'。
       本推论的起点恰在 BR-L2-015 的射程边界——不是复述它，是定它的失效区间。
       （砖的边际贡献诚实：BR-L2-015 是此步的真发动机。）

    2. "比较性断裂——CONCEPT-fairness(b) 给隐性前件"
       CONCEPT-fairness(b)：公平总是关于 Agent A 相对于 Agent B（或参考点）的比较。
       扩展到跨期：主体接受'当下吃亏'的前提是'在同一套规则下将来可能获利'。
       若轮替归零、未来获利概率=0，跨期比较断裂 ⇒ 公平标准不再共享
       （CONCEPT-fairness(a) 失效）⇒ 回到 (d) 代价执行通道（掀桌/退出/暴力）。
       此步偏【近定义】（公平的比较性是从属定义的一部分），不作非平凡卖点，
       只作锁定隐性前件的概念工具。

    3. "结构层 → 认知层转译——DED-011 的桥接"
       DED-011 从结构层给出：无轮替 → 败方无未来预期 → 派系固化 → 僵局/清洗/分裂。
       本条将其从结构层'派系撕裂'转译到认知层'程序合法性供给崩溃'：败方'无未来
       预期'这一认知状态（DED-011 已坐实其结构原因）→ BR-L2-015 的程序公平认知
       效应被阻断。此处不新建'无未来预期→掀桌'路径（那是 DED-011 的贡献），只建
       '无未来预期→程序公平效应归零'这一新路径。

    4. "合成：乘积关系 + 断崖 + 反常方向 + 空格"
       由 1-3 合成：程序接受度 ∝ f（程序透明度 × 轮替开放度），非可加性。轮替→0
       时乘积归零——无论透明度多高，程序沦为'赢家设计的游戏规则'，丧失合法性供给。
       由此推出三条可证伪预测：
       (i)   轮替→0 处接受度断崖——BR-L2-015 的连续函数在此不连续（非线性）。
       (ii)  零轮替+高透明 比 零轮替+低透明 更差——透明确证'你永不可能赢'，
             程序从安抚变为羞辱（反常方向，非任一砖给）。
       (iii) 零轮替+透明+长期和平的空格——非空可满足、可被现实反例填上。

       【非平凡性（逐格判空）】BR-L2-015 只给'透明→接受'的连续正函数——不给
       '轮替×透明交互'、不给'断崖'、更不给'反常方向'。CONCEPT-fairness(b)
       近定义，不给空格。DED-011 走结构层（派系撕裂），不走认知层（程序合法性
       知觉），不给认知层的交互/断崖/反常方向。空格'零轮替+透明+长期和平'是对
       三者的联合边界——任一砖单独都【不强制】该格为空。非平凡内核=轮替归零处
       程序公平效应的乘积关系断裂点（天花板），而非'程序公平有用'（已由 BR-L2-015 覆盖）。

falsifiability: |
  本推论可被以下发现证伪：
  (a) 存在一个制度场景同时满足（均由独立于结局的结构-程序指标测得）：
      (1) 轮替开放度【趋近于零】（无制度化轮替规则，或有规则从未兑现）；
      (2) 程序透明度【高】（成文规则清晰、裁决中立、发言开放、一贯执行）；
      (3) 败方在长时段（覆盖多轮分配/裁决）内行为上持续接受不利结果——
          继续参与规则框架、不掀桌不清洗不退出，且态度上认可公正。
      ⇒ 证伪核心（命中空格预测 iii）。
  (b) 程序透明度与轮替开放度的【交互项在统计上不显著】——败方接受度只随透明或
      轮替【之一】走，无乘积效应；或轮替→0 处接受度无断崖、仅为平滑线性递减。
      ⇒ 证伪乘积关系 + 断崖（预测 i 的核心）。
  (c) 零轮替+高透明的败方接受度【不低于】零轮替+低透明的败方接受度。
      ⇒ 证伪反常方向（预测 ii）。

falsification_trace:
  primary_suspect: |
    乘积关系——程序透明度与轮替开放度的交互效应是否可分离、可独立测量。两个自变
    量在实际制度场景中常高相关（有制度化轮替的政体通常程序也较透明），使交互项难
    以干净估计。轮替→0 处的'断崖'需要足够多零轮替案例才能检验——而程序高度透明
    且零轮替的案例天然稀少（空间格 III 预测恰是空的），使断崖形状的精确估计受限。
    此腿最先受检。
  secondary_suspect: |
    预测(ii)的'反常方向'（高透明+零轮替 < 低透明+零轮替）效应量可能小、需极端
    案例或大样本才能干净测出。轮替开放度与程序透明度的梯度须足够独立（自然数据中
    独立变异有限）才能分离此效应。
  unlikely_suspect: |
    BR-L2-015 本身（程序公平→接受度上升）——三域交叉验证、IEA=1.9，极少是
    失效根源。CONCEPT-fairness(b) 比较性近乎概念界定，不是经验腿。

excluded_outcomes:
  - outcome: "轮替在场（开放度 > 0）场景下的败方接受度变异"
    description: |
      本推论的核心预测聚焦于轮替→0 的【极限区域】。中等轮替区域（>0）的败方
      接受度变异由 BR-L2-015 及多因子解释，不在本推论专属射程。按轮替开放度
      的结构指标【事前独立测】：若该指标 > 0（存在可兑现的轮替规则），则出射程。
  - outcome: "胜方对程序的认可"
    description: |
      胜方（在当次分配/裁决中处于有利结果的一方）对程序的认可不检验本推论——
      他们不需要'下次可能赢'的跨期保险。按'是否处于不利结果'事前判定。
  - outcome: "一次性分配/裁决（非重复博弈）"
    description: |
      若分配/裁决是一次性、无后续轮次，则'轮替'概念不适用，出射程。按博弈结构
      （单次 vs 重复）事前测。

anti_talisman_clause: |
  【防不可证伪护身符——诚实硬约束】判定'轮替开放度'时，必须由成文换届规则 +
  任期届满改选/轮换是否按期例行发生这一程序事实独立测，【不得】用'是否发生过
  和平交权'这一结局邻近侧先例——'和平交权'与被预测量'败方接受度'近乎同轴
  （DED-007 焊点教训）。判定'程序透明度'时，不得因'结果被接受'就倒推'程序必
  透明'。判定'败方接受度'时，不得因'有轮替'就默认接受度高。
  三个量各自独立测、不互相反推。尤其不得遇到'零轮替+透明+和平'的看似反例时，
  事后调低透明估值或默认'必有隐性轮替/退出'来消化——翻盘机制在场须由独立的
  制度+程序事实坐实（DED-011 的 anti_talisman 同源约束），不由'没掀桌'反推。

nontriviality_test: |
  逐格判空（自变量 = {轮替开放度: 有(>0) / 趋零} × {程序透明度: 高 / 低}，
  被预测量 = 败方长期行为接受度: {接受 / 不接受}）：

    - 轮替>0 × 透明高 ⇒ 接受（BR-L2-015 标准预测）⇒ 非空。
    - 轮替>0 × 透明低 ⇒ 不接受（BR-L2-015 标准预测）⇒ 非空。
    - 轮替趋零 × 透明低 ⇒ 不接受（DED-011 路径：无轮替+模糊→掀桌）⇒ 非空。
    - 轮替趋零 × 透明高 ⇒ 【预测不接受，且比透明低更不接受】（反常方向 ii）⇒ 非空。
    - 轮替趋零 × 透明高 × 败方【长期和平接受】⇒ 【预测为空】（核心空格 iii）。

  该空格是真经验主张，非被砖平凡强制：
  BR-L2-015 只给程序→接受的连续正函数——不给轮替×透明交互、不给断崖、不给反常
  方向（它在 2×2 表的四个格中只覆盖了'有透明 = better'这半边，对'零轮替'列不做
  分区预测）。CONCEPT-fairness(b) 只给跨期比较的概念必要性（近定义，不给空格）。
  DED-011 走结构层'派系撕裂'，不走认知层，不给空格。空格'零轮替+透明+长期和平'
  可被现实反例填上 ⇒ 非空可满足、非同义反复。

  【防平凡化守卫】非平凡【不在】'程序公平让人接受结果'（BR-L2-015 已有），而在：
  (a) 轮替→0 处的断崖非线性（BR-L2-015 的连续函数在此断裂——天花板）；
  (b) 高透明+零轮替的反常方向（透明非始终好——任何现有砖/推论不给）；
  (c) 空格预测。三条皆非任一现有实体单独可推。

real_world_anchors:
  supporting:
    - anchor: "竞争性民主的败选接受——轮替在场，BR-L2-015 效应正常"
      evidence: |
        定期选举且换届按期兑现的政体中，败选方接受结果为合法、等下届再争——程序
        公平（选举规则透明 + 裁决中立）→ 接受度上升，BR-L2-015 的 loser's consent
        现象。轮替在场使乘积项中轮替开放度 > 0，程序公平效应正常发挥。
        但此锚同时支持 BR-L2-015，非本推论独有。
      independent_test: "选举规则成文 + 换届按期发生（程序事实），独立于败方是否接受结果测得轮替>0。"
      confidence: "strong（多国跨域证据；属 BR-L2-015 共锚）"

    - anchor: "零轮替+程序装饰型政体的合法性空洞——轮替归零，程序公平效应崩解"
      evidence: |
        无制度化轮替、但具备选举/宪法/法院等程序形式的一党长期执政或终身制政体：
        程序形式（成文宪法、定期投票、法院系统）高度齐备，但败方（反对派）系统性地
        不接受结果为合法——程序被认知为'赢家的装饰'，反而激发更大不满和体制外对抗。
        高透明程序形式 × 零轮替 → 合法性空洞，支持预测 (i) 断崖。
      independent_test: |
        轮替开放度 = 有无成文定期换届 + 任期届满是否实际改选（结构+程序事实）；
        程序透明度 = 规则成文/裁决机构/发言渠道/一贯性——【不】因'败方不接受'
        就倒推'程序必不透明'。
      honest_note: "个案间多因交织（经济绩效/意识形态/外部威胁），单案归因需谨慎；只作方向性支持。"
      confidence: "moderate"

    - anchor: "组织内部'透明的不公'——零轮替+高透明比模糊流程更伤士气"
      evidence: |
        无内部晋升轮替（领导终身/指定继承）但决策流程高度透明（公开评审、标准化
        指标、程序公正）的组织中，长期'输家'（被持续低评/无晋升者）对透明流程的
        态度可能比模糊流程更负面——透明使'你永远不会赢'变成光天化日的事实，认知上
        比'也许流程不公导致我输'更伤。支持预测 (ii) 反常方向——这是本推论最原创
        的预测方向。
      independent_test: |
        晋升轮替 = 任职是否有任期限制/定期换届并兑现（结构事实）；
        流程透明度 = 评审规则/指标/流程的成文清晰度与一贯性（制度事实）。
        二者独立于'员工满意度'测得。
      honest_note: "组织心理学个案方向性支持，缺系统跨组织检验；是本条最原创方向，诚实降级。"
      confidence: "weak-moderate"

    - anchor: "党内派系轮替的稳定效应——轮替在场，程序接受度维持"
      evidence: |
        DED-011 已覆盖：一党主导但有制度化党内派系轮替/定期党首选举的政体，
        输家'等下轮'而非清洗/分裂。本条复用为'轮替在场→乘积项非零→程序公平
        效应正常'的示范锚。
      independent_test: "党内轮替的成文规则 + 例行兑现，独立于'是否发生清洗'测得。"
      confidence: "moderate"

  counterexamples:
    - case: "长期一党执政、程序透明、败方和平接受——活空格，待独立检"
      analysis: |
        若存在同时满足以下三条件的政体（均由独立于结局的结构-程序指标测得）：
        (1) 轮替开放度趋零（无制度化轮替规则或从未兑现）；
        (2) 程序透明度高（成文规则清晰、裁决中立、一贯执行）；
        (3) 败方长时段内行为上和平接受不利结果且态度上认可公正——
        则命中空格预测 (iii)，证伪本推论。
        诚实守门：(1)(2) 须由结构/程序事实独立测，不得因 (3) 成立就事后调低
        (1) 或调高 (2) 的估值（DED-004 病根）。若此类案例存在且通过独立测量，
        推论归 rejected。
      status: "counterexample_hunt_open"

  boundary_cases:
    - case: "高凝聚小共同体（修道院/意识形态公社/自愿结社）——轮替趋零却无掀桌"
      analysis: |
        若其分配非稀缺（共产共享、诉求被压低，AXIOM-001 不适用）或成员可安全
        退出（退出 = 轮替等价物、翻盘机制在场），则前件不成立或翻盘机制在场——
        非反例。须先独立测分配稀缺度与退出权，不由'无掀桌'反推。
      status: "boundary_case"
    - case: "外部威胁压制内部不满——零轮替却和平"
      analysis: |
        外部威胁/战争/制裁使败方暂时接受现状（'先打外人'），此时'和平接受'由外部
        因素驱动、非程序合法性供给。按 scope：若外部威胁独立测得在场，则出射程
        （败方接受不由程序-轮替交互驱动）。须先独立测外部威胁强度，不由'没掀桌'反推。
      status: "boundary_case"

discriminant_validity: |
  【与 BR-L2-015（程序替结果）的判别】BR-L2-015 给'程序公平→接受度上升'这条连续
  正函数，【不】给它在轮替→0 处的断崖、【不】给轮替×透明的乘积关系、【不】给高透明
  在零轮替下的反常方向。本推论追加的不是 BR-L2-015 的证据复述，而是它的【失效边界】
  ——在轮替归零处程序公平的替代效应崩塌。本推论证伪不依赖 BR-L2-015 被推翻。

  【与 DED-011（派系必然-轮替）的判别】DED-011 的被预测量是'派系固化/清洗/分裂'
  （结构层组织撕裂），本条的被预测量是'败方对程序公平的认知合法性'（认知层公平知觉）。
  两通道可并存但不等同——一个组织可在'结构上暂未撕裂'时'认知上合法性已空心化'
  （程序成空壳），此态是本推论的独有可测区间。DED-011 不给'透明→羞辱'的反常方向
  和空格。

  【与 Rawls / 程序正义文献判别】独有可证伪贡献非'程序公平有用'，而在：
  (1) 轮替→0 处的断崖非线性（程序公平效应有天花板、非连续）；
  (2) 高透明+零轮替的反常方向（透明非始终好——与'more transparency = better'这一
      隐含在大多数程序正义文献中的单调假设直接冲突）；
  (3) 空格预测。
  三条皆在 BR-L2-015/DED-011/Rawls 等现有文献射程之外。

  【防平凡化守卫】非平凡载重在：(a) 断崖天花板（乘积关系的断裂点——它不是'再多一点
  透明就有边际收益递减'的平滑形态）；(b) 反常方向（透明在特定条件下反为负——任何
  现有砖/推论不给这方向）；(c) 空格（可被反例真填上、非同义反复）。若这三条被证伪，
  本推论实质归零——不存在'安全降级回 BR-L2-015'的后路（因为 BR-L2-015 不给这三条）。

