id: DED-012
type: deduction
layer: L3-deductions
status: verified

term: "掠夺-保护同源与坐寇化推论 (Predation-Protection Isomorphism & Bandit-Stationarity Corollary)"

人话摘要: |
  能抢的力量也能保护——同一种暴力两用。一个能有效施暴去掠夺某块地盘/人口的集团,那套本事
  同样能有效施暴去'保护'它(排他性地挡住别人来抢同一目标),掠夺与保护本是一台机器的两面。
  变数在于这伙人对地盘的控制稳不稳:当它把地盘占稳、走不了了(据点化、退出成本高、流动性低),
  '抢完就跑'(流寇)就变得不划算——因为长期抽税 + 顺手维持点秩序(治安/裁决/挡住别的抢劫者)
  的贴现收益,随控制越稳越超过一次性抢光。但这有个【前提】:税基得是【逐年可再生的流量】
  (年年产出的农业人口)——'保全税基'才划算;若所控的是【会枯竭的存量】(冲积金矿)、
  【可整批替换的劳力】(进口奴隶)或【采割即毁的暴涨一次性商品】(野生橡胶),就没有'未来流量'
  可保全,哪怕地盘占得再稳,最优仍是榨尽。于是占稳地盘【且面对可再生税基】的暴力垄断者才会内生地
  长出'抽税-供秩序'的契约,这正是国家的雏形。关键在于:驱动这一转变的是【领地固定性】+
  【税基可再生性】两个能事前测的结构量(前者:据点化/流动性/退出成本;后者:税基是流量还是存量/
  可否整批替换),不是事后拿'它建了国'反推'它坐寇化了'——否则就只是把 Olson 的坐寇论复述一遍。
  招牌预测:'地盘占得很稳、控制很久、【且税基可再生】,却仍纯一次性抢光、零秩序供给'这一格,是空的
  (把税基换成存量/可替换劳力,该格就被固定的攫取型殖民/奴役政权填满,如加勒比金矿区 encomienda)。

statement: |
  暴力是一种可【两用】的能力:能有效施暴以【非自愿夺取】某目标资源的组织(掠夺),其同一套
  组织化胁迫能力,在结构上【同时】能有效施暴以【排他性阻止第三方夺取同一目标】(保护=排他)。
  BR-L2-008 坐实掠夺是真实且随净收益上升的策略;AXIOM-001 给稀缺目标的可竞争性(故排他有价值);
  THEOREM-conflict-cost 给"反复强攻比守规矩地抽取更耗资源";BR-L2-010 给"抽税-供秩序"安排制度化
  落地的机制。据此:

  【核心】给定一个对某领地/人口施加暴力控制的集团,当其对该目标的控制【固定化】(流动性下降、
    退出成本上升、排他控制的预期时间horizon拉长)时,其最优获取模式从【流寇式一次性抽干+破坏性
    掠夺】(有效控制horizon→0 时抽取率趋于榨尽、无保全税基动机)转向【坐寇式规则化抽税+供给最低
    秩序】(horizon 拉长 ⇒ 内部化未来税基,贴现收益随控制固定性上升而反超一次性抢光;【此"内部化
    未来税基"以税基为可再生流量为前提,见【共驱动量】】)。因规则化抽取一个被压服人口,较之反复破坏性
    强攻,更省冲突成本(THEOREM-conflict-cost)。故固定化【且税基为可再生流量】的暴力垄断者内生演化出
    【抽税-供秩序契约】(=对内规则化征取、对外排他性保护、对内提供最低秩序),
    并经 BR-L2-010 制度化为非人格化征取-保护建制(国家雏形)。

  【同源判据(isomorphism,诚实定位:近结构、非驱动)】"掠夺能力"与"保护能力"同源,指同一套
    组织化施暴能力既能【夺取】又能【排他】;这一条偏【近定义的结构观察】(施暴以控制对同一稀缺
    目标的access),【不是】本推论的非平凡发动机。非平凡内容全在下面的【驱动量】与坐寇化动态。

  【驱动量】驱动'流寇→坐寇'转变的是【领地固定性 territorial_fixity】——一个【事前、独立于
    "是否抽税/是否建国"结果】可测的结构量(据点化程度/物理流动性/退出成本-资产专用性/排他控制
    的预期时间 horizon,由据点、无对手争夺、迁移成本等结构事实事前钉定),【不是】'它后来建了国'
    这一结果、【也不是】集团规模或产出总量。故预测:据点化、走不掉的集团即便规模不大,也向抽税-
    供秩序转;高流动、退出成本低的集团即便一时占地很广,仍维持纯掠夺。(反向:高固定性【但税基不可
    再生】的集团亦维持榨尽,见【共驱动量】——故固定性是必要非充分。)

  【共驱动量(税基可再生性 tax_base_renewability)】坐寇化的贴现逻辑还有一个【与固定性并列】的
    事前可测前提:所抽取的税基须是【可自我再生产的流量】(逐年产出的农业人口、可复现的产出)。唯有
    存在'未来流量'时,'保全税基以内部化未来产出'才优于一次性榨尽。当税基是【可枯竭存量】(冲积金矿
    等一次性可采尽资源)、【可整批替换的劳力】(进口奴隶——耗竭本地人口后另购一批)、或【采割即毁
    的暴涨一次性商品】(野生橡胶)时,不存在可内部化的未来流量,【即便固定性拉满、horizon 很长,最优
    仍是榨尽存量/耗竭劳力再换一批】。故坐寇化的完整条件是【高领地固定性 ∧ 可再生流量税基】;二者任一
    不足,均不向抽税-供秩序转。此量【独立于】固定性(按税基的再生/可替换结构事前测,不由抽取行为回填)。

  【预测】
    (i)   招牌预测(单调 + 可逆,【前提:税基为可再生流量】):【给定可再生流量税基】,领地固定性越高
          的暴力集团,其【抽税-供秩序比例越高、掠夺烈度越低】(可事前按据点化/流动性测,【不看】它是否
          被承认为国家);且【可逆】——同一集团固定性下降(被逐为流亡武装、控制被对手争夺、重新机动化)
          ⇒ 退回流寇式掠夺。【税基为存量/可替换劳力/一次性商品时本单调不成立,见【共驱动量】与 boundary】。
    (ii)  【无固定基地】的纯机动暴力集团(马上劫掠的游牧突袭队、无据点流寇、纯游弋无基地的海上劫掠臂)
          维持【纯掠夺】,不发展稳定的抽税-供秩序契约。但【有固定基地】的海上/机动武装(以固定都城/据点
          为基的海盗国、海商集团)会在【基地】结构上坐寇化(制度化财政/裁决/通行费),仅其机动劫掠臂纯
          掠夺——固定性须定位到【实际控制结构的基地】,故这些是支持锚而非反例。
    (iii) 逐格判空:【高领地固定性 + 长期排他控制 + 可再生流量税基 + 纯一次性掠夺、零秩序供给】这一格
          【预测为空】——不存在长期据点化、走不掉、面对可再生税基、又持续榨尽/零保护的暴力垄断者(现实
          反例可填此格)。【注:把可再生税基换成存量/可替换劳力,该格非空——那是【共驱动量】所预测的
          固定攫取型殖民/奴役(见 boundary『固定却面对不可再生税基』),不证伪本收窄格】。

  【与现有理论的判别】本推论的核心命题(坐地的暴力垄断者会抽税-供秩序、演化为国家)与 Olson
    'stationary bandit'、Tilly 'war-making = state-making' 高度重合——若仅此则 brick=conclusion 死。
    其【独有可证伪内核】在于把驱动量钉为【事前可测、独立于建国结果】的领地固定性(叠加【税基可再生性】
    共驱动量),并据此给出
    Olson/Tilly 未锐化的【单调 + 可逆】定量方向与【固定性事前独立归因】:抽税-供秩序比例由据点化/
    流动性【事前】预测,而【非】事后用'它坐大成了国'反推'它必已坐寇化'。防平凡化守卫见下。

# === 规则 A：操作化定义 ===

operationalization:
  territorial_fixity:
    definition: |
      【自变量/驱动量】暴力集团对特定领地/人口之排他控制的【固定化程度】——由四组【事前、
      结构】指标合成,均【独立于"是否已开始抽税/是否被承认为国家"】:
      (1) 据点化:是否在该领地建固定工事/驻防/永久基地(城堡/坞堡/要塞/常驻兵营);
      (2) 物理流动性(反向):集团主体是机动的(骑队/船队/无固定营地)还是绑定固定领地的;
      (3) 退出成本/资产专用性:迁离该特定领地需放弃的沉没/不可移动投资之大小、迁移之难易;
      (4) 排他控制的预期时间 horizon:【定义为 (1)据点化、(2)物理流动性、(3)退出成本 与竞争者密度/
          地形封闭性这些结构前量的【确定函数】,不是独立浮动的自由参数】——由"有无对手持续争夺该地 +
          迁移成本 + 据点"等结构事实【事前】推出的预期持续控制时长(不是事后数它实际统治了多少年,
          【尤其不得】由"是否争夺得逞/是否榨尽/是否建国"回填)。
    measurement: |
      考古/军事地理/编制史独立测(1)(2)(3):固定工事与驻防的在场、集团的机动方式(马/船/徒步
      营地 vs 城郭驻军)、沉没投资规模。(4)由结构博弈事实(竞争者密度、地形封闭性、迁移成本)
      事前估,【不得】用"它统治了多久/有没有征税"回填——(4) 无独立自由度,完全由 (1)(2)(3)+竞争者
      密度确定,【禁止】为消化反例而单独下调 horizon。
      【anti-talisman 硬约束(DED-004/007 死病规避)】territorial_fixity 必须由上述结构量独立测得,
      【绝不】用被预测量(抽税-供秩序)或最终结果(建了国/被史书称为政权)来反定义固定性——否则
      自变量偷用结果,循环。
    limitations: |
      固定性连续、非二值;帝国派驻的征取代理其【个人有效 horizon】可因轮调而低(见 boundary),
      须测【实际行使控制者】的固定性,不简单等同于领地物理上有人驻守。

  extraction_mode:
    definition: |
      【被预测量】集团对所控目标的获取模式,取一段时期的主导形态,落在【纯掠夺 ↔ 抽税-供秩序】
      的连续谱上:
      (纯掠夺/流寇端)一次性榨尽、破坏性夺取、杀鸡取卵、零秩序供给;
      (抽税-供秩序/坐寇端)规则化/可预期的征取(税率有限、保全税基)+ 供给最低秩序(治安、
      纠纷裁决、排他性阻止他人来抢同一目标=对内保护)。
    measurement: |
      征取的【规则化与烈度】:税/贡的可预期性与税率(是否留存再生产 vs 榨尽)、是否破坏生产
      基础;【秩序供给】的在场与强度:治安/裁决/防御他掠的制度签名。史料/税册/法令/工事与
      驻军记录。与 territorial_fixity【分轴独立测】——【测量轴正交】:固定性按结构(工事/流动性/
      退出成本)测,获取模式按征取规则化与秩序供给测,二者不共用同一指标。
    limitations: |
      混合态常见(既抽税又间歇劫掠),按主导成分与分布标注,不二分;"最低秩序"是程度非有无。

  tax_base_renewability:
    definition: |
      【共驱动量/自变量之二】所抽取税基的【可自我再生产程度】——落在【可再生流量 ↔ 可枯竭存量/
      可整批替换】的连续谱上,【独立于】领地固定性、且【独立于抽取结果】测:
      (流量端)逐年可再生产的税基:农业人口及其年度产出、可持续渔猎/畜牧产出——榨尽则损未来流量;
      (存量端)一次性可采尽的资源(冲积金矿/浅表银矿存量)、可整批替换的劳力(进口奴隶,耗竭本地
        人口后另购)、采割即毁的暴涨一次性商品(野生橡胶)——不存在需保全的未来流量。
    measurement: |
      按税基的【再生结构】事前测:是逐年再生产的人口/产出,还是有限可采尽的存量/可外部补充替换的
      投入品;由资源类型(可再生 vs 矿物存量)、劳力来源(本地繁衍 vs 外部输入替换)、商品采集是否
      破坏再生基础(可持续 vs 采割即毁)等【结构事实】判定,【不得】用"它是否榨尽"反定义可再生性
      (否则又落 anti-talisman 循环)。
    limitations: |
      连续非二值;同一辖地可混合(可再生农业人口 + 一次性矿脉),按主导价值来源标注。可再生性可随
      技术/市场变(矿脉采尽后转农),须测【当期】主导税基。

# === 推导链 ===

derivation:
  from_l1:
    axioms: [AXIOM-001]
    theorems: [THEOREM-conflict-cost]
  from_l2:
    bridging: [BR-L2-008, BR-L2-010]

  steps: |
    1. "暴力两用 + 掠夺真实(BR-L2-008 + AXIOM-001)"
       稀缺目标可竞争(AXIOM-001) ⇒ 排他控制其 access 有价值;能施暴夺取者,同一能力即能施暴
       排他(=保护)。掠夺是真实且随净收益上升的策略(BR-L2-008) ⇒ 无约束时暴力集团默认掠夺。
       (此步的"同源"偏近定义,非发动机。)

    2. "控制 horizon 决定榨尽 vs 保全(贴现逻辑,承 BR-L2-008 的净收益结构)"
       有效控制 horizon→0(机动、抢完即走)⇒ 未来税基与自己无关 ⇒ 最优是一次性榨尽/破坏性掠夺;
       horizon 拉长 ⇒ 内部化未来产出 ⇒ 最优抽取率下降且愿投资于保全/提升税基(供最低秩序)。
       【前提:税基为可再生流量】——此"内部化未来产出"要求存在【可再生的未来流量】;若税基是可枯竭
       存量/可整批替换劳力/采割即毁商品,则无未来流量可内部化,即便 horizon 很长,最优仍是榨尽存量/
       耗竭劳力再换一批。故贴现逻辑仅在【可再生流量税基】上给出"固定⇒保全",税基可再生性是与固定性
       并列的共驱动量。

    3. "固定化则规则化抽取省冲突成本(THEOREM-conflict-cost)"
       反复破坏性强攻同一人口比规则化征取一个已被压服人口更耗资源(THEOREM-conflict-cost)。
       故当控制固定、horizon 长,坐寇式'抽税-供秩序'的长期净收益反超流寇式反复强抢。

    4. "制度化落地(BR-L2-010)"
       固定化的抽税-供秩序若稳定复现,经 BR-L2-010 外化为非人格化征取-保护建制(成文税则、
       第三方执行、常设秩序供给)=国家雏形。掠夺集团的习惯由此凝为制度。

    5. "驱动量归因 + 单调可逆 + 非平凡性(逐格判空)"
       转变的自变量=领地固定性 ∧ 税基可再生性(二者事前独立于建国结果可测);【给定可再生流量税基】,
       固定性↑ ⇒ 抽税-供秩序比例↑、掠夺烈度↓(单调);固定性↓ ⇒ 退回流寇(可逆)。税基转为存量/
       可替换劳力时,固定性不再单调决定抽取模式(榨尽),此由共驱动量所辖、不证伪收窄后的单调。
       【非平凡性】BR-L2-008 单独只给"掠夺真实且随净收益上升"(不给流寇/坐寇之分,更不给固定性
       驱动);THEOREM-conflict-cost 单独只给"打架费资源"(不给'固定化⇒抽税优于强攻'的条件结构);
       AXIOM-001 只给稀缺竞争;BR-L2-010 只给"能制度化"(不给驱动量)。四者【都不】单独给出
       "领地固定性(事前结构量) ⟺ 抽税-供秩序比例"这一联合、带方向的经验主张。
       "高固定性 × 长期控制 × 【可再生流量税基】 × 纯一次性掠夺零秩序"这一格被预测【为空】、且可被现实
       反例填上(非同义反复)。唯合成给出 ⇒ 非平凡、非砖内结论。

# === 可证伪性 ===

falsifiability: |
  本推论可被以下发现证伪:
  (a) 一个经【结构指标独立测定】具【高领地固定性】(据点化、低流动、高退出成本、长预期 horizon,
      由 territorial_fixity 事前判定,【不因】"它有没有抽税/建没建国"浮动)【且其税基为可再生流量
      (由 tax_base_renewability 独立测)】的暴力垄断者,长期维持【纯一次性掠夺、零秩序供给、系统性
      破坏自身税基】——命中 (iii) 的空格。⇒ 证伪核心。
      注1:若该集团在场抽税/供秩序,【正是】本推论所预测,不算 (a);(a) 要求高固定性【却】纯掠夺零秩序。
      注2:若其税基是可枯竭存量/可替换劳力/一次性商品(如加勒比金矿+进口奴隶),则榨尽【正是共驱动量
      所预测】,不算 (a)——要打这一类须命中 (d),不能算作 (iii) 空格反例。
  (b) 抽税-供秩序比例与"领地固定性"【无】系统关联,只随集团规模/产出总量/或事后是否被承认为国家走
      (高流动的大集团普遍抽税供序、低流动的据点集团普遍纯掠夺)。⇒ 证伪"驱动量=领地固定性(事前结构)"。
  (c) 流动性高、退出成本低的机动暴力集团(海盗/游牧突袭/无据点流寇)被发现【系统性地】发展出稳定的
      规则化抽税-供秩序契约,与固定化集团无别。⇒ 证伪 (i)/(ii) 的固定性方向。
  (d) 税基可再生性与抽取模式【无】系统关联:在【高固定性】集团中,面对可再生流量税基者【仍】系统性
      榨尽破坏税基、或面对可枯竭存量/可替换劳力者【仍】系统性保全式规则抽税——⇒ 证伪"税基可再生性
      作为共驱动量"(该共驱动量是本轮为救活招牌所补,须与固定性一样可独立证伪)。

falsification_trace:
  primary_suspect: |
    最弱腿=【是否只是 Olson 复述】。核心(坐地暴力垄断者抽税-供秩序、演化为国家)确在 Olson
    'stationary bandit'/Tilly 射程内;本推论的存活【全押在】驱动量的【事前独立归因】——领地固定性
    能否由结构指标(据点化/流动性/退出成本)【独立于建国/抽税结果】测得,并【独立预测】抽税-供秩序
    比例。若被证明该比例只能【事后】用"它坐大成了国"反推、无任何事前固定性度量能独立预测它,则本
    推论坍缩为 Olson 的复述,非平凡内核归零(DED-004/007 式不可证伪循环)。最先受检。
    【补认:第二条(更致命)软腿——税基可再生性混杂变量】除 Olson 复述外,更能直接证伪【无条件】招牌的是:
    固定性【是否单调足以】单独决定抽取模式,抑或被【税基可再生性】混杂。这条【不攻】固定性能否独立测,
    而攻其单调充分性:高固定性遇可枯竭存量/可替换劳力仍最优榨尽(加勒比 encomienda/刚果自由邦/普图马约
    橡胶)。本推论已把它显式收进【共驱动量(税基可再生性)】、单调收窄为"给定可再生流量税基,固定性↑⇒
    抽税供序↑";若该共驱动量被证不成立(见 falsifiability(d)),招牌同样坍缩。此腿与 Olson 腿【并列】受检,
    读者勿以为唯一风险是 Olson 复述。
  secondary_suspect: |
    territorial_fixity 须由结构量测,不得用抽税/秩序供给回填(anti-talisman);且须测【实际行使
    控制者】的有效 horizon(帝国轮调代理的个人 horizon 可远短于领地物理驻守时长,见 boundary)。
  unlikely_suspect: "BR-L2-008(掠夺随净收益上升)本身——跨文化考古/民族志证据扎实,极少是根源。"
  note: |
    刻意规避 DED-004/007 死病:territorial_fixity 是【事前结构量】,extraction_mode 是被预测量,
    二者分轴测、不互为定义;固定性【绝不】由"是否建国/是否抽税"反推(见 anti_talisman_clause)。

# === 排除的结果 ===

excluded_outcomes:
  - outcome: "非暴力集团供给的秩序/保护(自愿互保会、市场声誉、亲缘/规范秩序)"
    description: |
      若某地的秩序-保护【不】由一个暴力垄断集团提供,而源自自愿制度/市场/亲缘(DED-005/006/008/009
      的射程),则前件"暴力控制集团"不成立,【不在射程】,既不支持也不证伪。判定按【秩序供给者是否为
      施暴的排他控制者】这一可事前测的渠道划,不按结果开脱。
  - outcome: "外生强加的固定性(帝国派驻的短任期征取代理)"
    description: |
      领地物理上被占,但【实际征取代理】因轮调/短任期而【个人有效 horizon 低】(高'流动性')⇒ 其
      预测倾向掠夺式榨取而非本地秩序投资。须测【行使控制者】的固定性,归 boundary(见下),非以
      "领地有人驻守"简单判为高固定性。
  - outcome: "换 vs 抢的选择本身(贸易-劫掠边界)"
    description: "给定净收益在换与抢之间的选择属 DED-005 射程;本推论只在'已选抢/已施暴控制'之后,预测抢的【形态】(流寇 vs 坐寇),不重复 DED-005。"

anti_talisman_clause: |
  【防不可证伪护身符 — 诚实硬约束】判定"是否高领地固定性"时,必须由 territorial_fixity 的
  【结构指标(据点化/流动性/退出成本/事前预期 horizon)】独立测得,并【独立于结果(是否抽税、
  是否供秩序、是否被称为国家)】;【不得】因"它开始抽税/建了国"就倒推"它必已固定化",也【不得】
  因"它纯掠夺"就倒推"它必未固定化"。尤其【不得】遇到"高固定性却纯掠夺零秩序"的反例,就事后把它
  重标为"其实控制不稳/其实是流寇"来消化——固定性的判定须由独立结构事实(工事/机动方式/沉没投资)
  坐实,不由掠夺行为反推。否则本推论沦为不可证伪循环(DED-004/007 病根)。
  【共驱动量同守此律】税基可再生性亦须由税基的【再生结构(资源类型/劳力来源/采集是否毁再生基础)】
  独立测,【不得】反过来"遇高固定性却榨尽就事后判其税基不可再生"、或"遇保全式抽税就事后判其可再生"
  ——否则共驱动量沦为消化任何抽取模式的事后开脱活门(与 (iii)/(a) 收窄互为表里)。

# === 非平凡性 ===

nontriviality_test: |
  逐格判空(自变量档=领地固定性 低/高;被预测量档=纯掠夺(流寇) / 抽税-供秩序(坐寇)):
    - 低固定性(机动/低退出成本) × 纯掠夺 ⇒ 非空(海盗、游牧突袭、无据点流寇,常见)。
    - 低固定性 × 抽税-供秩序 ⇒ 预测稀少且不稳定(机动集团偶尔收贡但难维持耐久秩序,趋于退回掠夺)。
    - 高固定性(据点化/长期排他控制) × 抽税-供秩序 ⇒ 非空(据点化军阀、封建领主、黑帮地盘保护费、
      占省建制的政权,常见)← 核心正向预测。
    - 高固定性 × 长期控制 × 【可再生流量税基】 × 纯一次性掠夺、零秩序 ⇒ 【预测为空】(核心空格)。
    - 高固定性 × 【不可再生存量/可整批替换劳力税基】 × 纯榨尽、零秩序 ⇒ 【非空】(加勒比金矿区
      encomienda/刚果自由邦/普图马约橡胶)——由【共驱动量:税基可再生性】所预测,【不】证伪收窄后的核心空格。
  该空格是真经验主张,非被砖平凡强制:BR-L2-008 只给"掠夺真实随净收益上升"、不分流寇坐寇更不给固定性
  驱动;THEOREM-conflict-cost 只给"打架费资源";AXIOM-001 只给稀缺竞争;BR-L2-010 只给"能制度化"。
  四者都不给"固定性(事前结构) ⟺ 抽税-供秩序比例"的联合带向预测。空格(限【可再生流量税基】)可被
  "据点化、走不掉、面对可再生税基却持续榨尽税基、零保护"的现实反例填上 ⇒ 非空可满足、非同义反复。
  【防平凡化】非平凡【不在】核心"坐地暴力垄断者抽税-供秩序⇒国家"(那在 Olson/Tilly 射程内、是近砖、
  非卖点),而在 Olson/Tilly 未锐化的三点:①驱动量=领地固定性作为【事前、独立于建国结果】可测量的
  独立预测子(而非事后用'坐大成国'反推'坐寇化');②单调(固定性↑⇒抽税供序比例↑、掠夺烈度↓);
  ③可逆(固定性↓⇒退回流寇)。载重可证伪新意全在①②③——尤其①的事前独立归因。

# === 现实锚点 ===

real_world_anchors:
  supporting:
    - anchor: "据点化军阀 / 封建领主(坞堡·城堡)—— 坐寇端(高固定性)"
      evidence: |
        割据一省并据点化(城郭/坞堡/常驻军)的军阀、欧洲封建领主,由反复劫掠转向规则化田赋/地租
        + 供给最低秩序(治安、裁决、以武力排他性挡开其他劫掠者=对内保护)。掠夺集团凝为征取-保护建制。
      independent_fixity_evidence: |
        据点化(筑城/坞堡)、驻军、领地绑定属【军事地理/考古结构事实】,可【独立于"是否被承认为
        政权/是否征税"】测出高固定性,把驱动量与结果分离。
      confidence: "moderate-strong(固定性结构可独立测;逐案抽取率/秩序供给度史料参差,诚实降级)"

    - anchor: "海盗 / 游牧突袭队 / 无据点流寇 —— 流寇端(低固定性)"
      evidence: |
        高机动、退出成本低【且无固定基地】的暴力集团(海上劫掠、马上突袭、流动匪股)维持一次性掠夺/
        勒赎,不发展耐久的抽税-供秩序契约,支持 (ii)。【但须限定"无固定基地":有固定都城/据点的海上
        武装(巴巴里海盗国以阿尔及尔/突尼斯/的黎波里为基,建常设财政/法庭/制度化赎金;郑芝龙-郑成功
        以厦门/台湾为基,对过往船只征制度化"令旗"通行费)会在【基地】上坐寇化,仅其机动劫掠臂纯掠夺——
        固定性定位到【实际控制结构的基地】,故它们是支持锚(基地固定⇒生秩序),非 (ii) 的反例。】
      independent_fixity_evidence: "机动方式(船/马/无固定营地)、有无固定基地属结构事实,独立于其是否抽税可测。"
      confidence: "moderate"

    - anchor: "加勒比 vs 墨西哥中部 encomienda(同制度对照,近自然实验)—— 税基可再生性作为共驱动量"
      evidence: |
        同为 territorially fixed 的 encomienda 封赠者(据点化、定居谋永业、走不掉——固定性大体相当):
        墨西哥中部稠密【可再生】农业人口 ⇒ 演化为稳定贡赋 + corregidor 本地秩序(坐寇端);加勒比冲积
        金矿存量 + 可整批替换的岛民/进口奴隶 ⇒ 灭绝式榨尽、零真实秩序(流寇端)。固定性近似不变、【税基
        可再生性变、抽取模式反转】——把摆动变量干净隔离到【税基可再生性】而非固定性,坐实共驱动量。加勒比
        一支同时【填满 (iii) 收窄前的无条件空格】,是本轮补共驱动量修订的直接锚(刚果自由邦/普图马约橡胶
        同族:暴涨型一次性商品 ⇒ 固定却榨尽)。
      independent_fixity_evidence: |
        双方 encomendero 的据点化/定居/封赠永业属结构事实,可独立于抽取结果测得固定性【相当】;税基类型
        (金矿存量+替换劳力 vs 稠密再生农业人口)由资源/人口结构独立测,独立于抽取行为。
      confidence: "moderate-strong(同制度对照隔离变量干净;逐案抽取率史料有参差,诚实降级)"

    - anchor: "黑帮地盘保护费 / 西西里黑手党(Gambetta)—— 非国家暴力垄断者的同源与坐寇化"
      evidence: |
        绑定固定地盘的犯罪集团,以同一套施暴能力【排他保护】辖区(挡开其他勒索者、供给私力裁决)
        并【规则化抽取】保护费——非国家却清晰展示掠夺-保护同源 + 坐寇式抽税-供秩序。
      independent_fixity_evidence: "黑手党家族的领地固定性(地盘绑定、难迁移)可由其地域结构独立测,独立于抽取行为。"
      confidence: "moderate"

  reversibility_anchor:
    - anchor: "维京突袭 → 定居领主(Danelaw / 诺曼底)/ 流寇占据据点转建制"
      evidence: |
        同一批(或同源)暴力集团:机动劫掠阶段=纯掠夺;获封/占据土地、据点化、流动性下降后 ⇒ 转为
        收地租 + 供给领地秩序与防御(坐寇)。反向:据点化政权失territory、被逐为流亡武装 ⇒ 退回劫掠。
        作 (i) 可逆/单调锚——同一集团随固定性升降切换获取模式。
      independent_fixity_evidence: "定居/据点化(封地、筑堡、放弃船队机动)可由土地授受与工事记录独立测,先于'是否成公国'。"
      honest_note: "定居常与人口、封授、战局多因交织,只作可逆方向中等支持。"
      confidence: "moderate"

  counterexamples: []

  boundary_cases:
    - case: "帝国派驻的短任期征取代理(轮调总督/包税人)据守却掠夺式榨取"
      analysis: |
        领地物理上高固定,但【实际征取代理】因轮调/短任期,其【个人有效 horizon 低】=高'流动性'
        ⇒ 预测偏掠夺式榨取、低本地秩序投资。按判据须测【行使控制者】的固定性,此为低有效固定性,
        非"高固定性却纯掠夺"的反例,反而支持驱动量逻辑(horizon 而非物理驻守决定模式)。回到
        anti_talisman:固定性按行使者结构测,不由领地是否有驻军简单判高。
      status: boundary_case

    - case: "高固定性却面对不可再生/可替换税基而持续榨尽(加勒比 encomienda / 刚果自由邦 / 普图马约橡胶)"
      analysis: |
        经结构指标独立测得【高领地固定性】(定居谋永业的 encomendero / 公司-国家、据点化、走不掉、核心区
        无有效军事争夺、长期控制),却持续破坏性榨尽、零真实秩序供给。表面像 (iii) 空格反例,且【不可】被
        "短任期轮调代理"或"短命割据"两口消化:加勒比封赠者是定居谋永业的坐寇原型(封赠常达两三"世"、主动
        求永久),非轮调代理;核心区原住民被迅速征服、几无持续军事争夺,按争夺判据固定性【不低】、非短命
        割据。归因不在固定性一侧,而在【共驱动量:税基可再生性】——冲积金矿=可枯竭存量、岛民可用进口奴隶
        整批替换、野生橡胶=采割即毁一次性商品,无未来流量可内部化,固定性拉满仍最优榨尽。故本类是【共驱动
        量所预测】、落在 (iii) 收窄后射程之外,【不证伪】收窄后的招牌;要打共驱动量本身须命中 falsifiability(d)。
        判定【不得】反过来用"它榨尽"回填"其实固定性低/其实税基可再生"(anti_talisman)。
      status: boundary_case

    - case: "看似'坐地却持续榨尽'的短命割据"
      analysis: |
        表面像 (iii) 空格反例。按判据先【独立测】其固定性:若控制被对手持续争夺、预期 horizon 短
        (虽有兵驻守),则属【低有效固定性】、归流寇端,非反例。【关死活门:(4) 预期 horizon 是
        (1)据点化 (2)流动性 (3)退出成本 + 竞争者密度/地形封闭性的【确定函数】(见 operationalization),
        "是否被争夺"须由【独立结构事实(竞争者密度/地形)】事前判,【绝不】由"它没维持住/它榨尽了"事后回填
        horizon 来把它重标为低固定性——否则 (iii) 沦为恒可开脱的不可证伪循环(DED-004)。】若确高固定性
        (无争夺、长 horizon、据点化)【且税基为可再生流量】却仍纯榨尽零秩序,则【是】命中 (a) 的真反例;
        若其榨尽源自税基不可再生(存量/可替换劳力),则归上一条 boundary(共驱动量所预测),非 (a)。判定
        不由掠夺行为反推固定性(anti_talisman)。
      status: boundary_case

# === 判别效度 ===

discriminant_validity: |
  【与 Olson/Tilly 的判别(生死线)】核心命题与 Olson 'stationary bandit'、Tilly 'war-making =
  state-making' 高度重合,故【不以核心命题为卖点】。独有可证伪内核=把驱动量钉为【领地固定性
  这一事前、独立于建国/抽税结果可测的结构量】,并据此给出 Olson/Tilly 未锐化的【单调 + 可逆】
  定量方向:抽税-供秩序比例由据点化/流动性【事前】预测,而【非】事后用'它坐大成国'反推'它坐寇化'。
  Olson 的流寇/坐寇偏行为类型学(以行为区分),本推论把区分【前移】到结构固定性并要求事前独立测。

  【与 DED-005 的判别】DED-005 管【换 vs 抢】(给定净收益选交换还是掠夺);本推论在'已施暴控制'
  之后,管抢的【形态】(流寇 vs 坐寇)及其向国家的演化,被预测量不同(交换/掠夺选择 vs 掠夺内部
  的抽取模式),共享 BR-L2-008/AXIOM-001 是体系复现结构,非循环复述。

  【与 DED-008 的关系】共享"自我执行失败 ⇒ 制度化/外化"母题,但域/砖/被预测量不同:DED-008 管
  亲缘域的裙带侵蚀与监督者独立(BR-L2-002/010,被预测量=一视同仁维持);本推论管暴力经济学域的
  掠夺-保护同源与坐寇化(BR-L2-008/010,被预测量=抽取模式)。共享母题是体系【复现结构】,非复述。

  【防平凡化守卫】非平凡【不在】"坐地强盗会抽税供序/演化成国"(Olson/Tilly/常识射程内、近砖、
  非卖点),而在 Olson/Tilly 【未锐化】的四点:①驱动量=领地固定性作为【事前、独立于建国结果】的
  独立预测子(反循环归因);②单调;③可逆;④【税基可再生性作为与固定性并列的共驱动量】——单调收窄为
  "给定可再生流量税基,固定性↑⇒抽税供序↑",既堵住被固定攫取型殖民/奴役(加勒比金矿区)证伪的无条件
  伸张,又新增一个可独立证伪的驱动量(falsifiability(d))。载重全在①②③④,尤其①的事前独立归因——这是把
  权重从会被吸收进'坐寇论常识'的核心命题,移到抗证伪的驱动量归因上。

