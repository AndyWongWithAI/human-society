id: DED-005
type: deduction
layer: L3-deductions
status: verified

term: "贸易-劫掠边界推论 (Trade–Predation Boundary Corollary)"

人话摘要: "我想要你手里的东西,可以换也可以抢。'有没有得换'有两条路:你有我没的互补(路①),或者大家一样但轮流接济的风险共担(路②)——所以同质的两拨人照样能靠互惠稳定地换。而'换还是抢'主要看:抢划不划算、以及'换'能不能落实且抢会不会自毁(靠反复见面,或一手交货一手取货)。同一对群体会随这两个杠杆的变化在贸易↔劫掠间翻转。"

# 修订说明(round-1 审查后):原稿把"禀赋互补"当成交换的【必要闸门】,是推导越界——
# 砖 BR-L2-007 只授权"互补越高贸易越密"的单调关系,不授权"无互补则无交换";且"自愿
# 互惠"型交换本就不需要互补(昆人 hxaro 等同质群体的稳定互惠交换即反例)。故本版把交换
# 拆成【两条独立路径】,互补降为其中一条路(R1)的强度驱动,不再是交换的必要条件。详见
# ADV-REVIEW-010。

statement: |
  在两方之间，资源转移取向【自愿交换(贸易)】还是【武力掠夺】，取决于两条
  路径的相对收益。本推论区分两个问题：【贸易能否发生】与【贸易 vs 掠夺谁主导】。

  【一、贸易能否发生 — 两条独立路径，任一即可】
    路径 R1（互补型）：双方各控对方稀缺的不同资源（禀赋互补）。
      互补越高，此路交换收益越大（BR-L2-007，单调关系）。
    路径 R2（互惠/风险共担型）：即使禀赋同质，只要收益/风险在时间上错开
      （我今年丰、你今年歉，明年可能反过来），重复接触即可撑起延时互惠交换
      （BR-L2-005 + AXIOM-003）。
    ⇒ 【禀赋互补不是交换的必要条件】，只是 R1 路的强度驱动。同质群体可经 R2
      稳定交换（如昆人 hxaro、东非牧民牛只结义、农业道义经济的谷物互借）。

  【二、给定存在得换的路径，贸易 vs 掠夺谁主导 — 两个调节杠杆】
    杠杆②（掠夺成本）：夺取的成本 + 失败风险 + 报复损失，相对交换收益越高
      ⇒ 越倾向交换（THEOREM-conflict-cost；掠夺净收益 BR-L2-008）。
    杠杆③（可执行性 + 掠夺自毁性）：延时交换需可执行——靠重复接触
      （未来之影惩罚赖账，AXIOM-003）或自我执行的交换结构（同时易货、互不先交，
      如无声贸易）。重复接触同时使掠夺招致报复、摧毁未来伙伴 ⇒ 掠夺自毁。
      二者越强 ⇒ 越倾向交换。

  【三、预测】
    (i)   存在得换的路径(R1 或 R2) + ② 高 + ③ 高 ⇒ 贸易主导；② 或 ③ 不足 ⇒ 倒向掠夺。
    (ii)  同一对群体随 ②③ 变化在【贸易 ↔ 劫掠】间翻转（招牌预测）。
    (iii) 互补型贸易(R1)系统性扎堆在生态互补的相邻群体的固定接触点；
          同质群体的稳定交换则走 R2（互惠/风险共担）。

  【注(round-2):得换路径 (R1∨R2) 近乎恒真、几乎不区分案例——真正区分"贸易 vs 劫掠"
   的预测重量全在 ②③;R1 的实质内容在"互补越高 R1 贸易越密"这条单调性上,不在"有没有
   路径"。读者不应把"存在得换路径"误当成一道有判别力的闸门。】

# === 规则 A：操作化定义 ===

operationalization:
  exchange_path_exists:
    definition: "存在使交换有净收益的路径——R1(禀赋互补>0)或 R2(收益/风险在时间上错开 + 重复接触)。二者任一即满足。"
    measurement: |
      R1：两群体主要资源/产品清单的重叠比例(重叠低=互补高)。
      R2：双方是否面临【可错开的独立冲击】(如各自歉收年不同步——可用气候/物候
      数据独立判定) + 是否重复接触。
    limitations: "R2 的'风险错开'必须独立于交换本身观测(气候/物候数据),否则有循环。"

  predation_cost:
    definition: "夺取成本 + 失败风险 + 报复损失，相对于通过交换获得同等资源的代价。"
    measurement: |
      代理指标：相对武力 × 目标可防御性(工事、地形) × 报复能力。
    honest_threshold_note: |
      【诚实声明,round-1 审查后提升到操作化正文】这些代理只测得夺取的【绝对成本
      (分子)】,测不到"夺取是否比交换更便宜"的【门槛(比值)】。故证伪只能落在分子层
      的独立可观测量(工事/兵力/地形);门槛层的归因受 anti_talisman_clause 约束——
      不得因"结果是掠夺"就倒推"必是掠夺更便宜"。
    limitations: "门槛(比值)不可事前独立测,多为事后判断。"

  executability_and_predation_self_defeat:
    definition: "延时交换可执行的程度 + 掠夺的自毁程度。来源有二:重复接触(未来之影),或自我执行的交换结构(同时易货、互不先交)。"
    measurement: |
      重复接触：接触复现率 + 身份跨次可追溯 + 地理邻接稳定性。
      自执行结构：交换是否设计成互不先交(如无声贸易的同时取放)。
    limitations: "是渐变量;'自执行结构'可【替代】'重复接触'——故③是'可执行性'的两种来源,不是单一变量。"

  outcome_trade_vs_predation:
    definition: "该对群体之间资源转移中，自愿互惠(贸易)占比 vs 【以夺取资源为目的】的武力(劫掠)占比，取一段时期。"
    scope_boundary: |
      【round-2 修订:声明"掠夺"的射程】本推论的"掠夺"【继承 BR-L2-008 的定义】——
      特指【以夺取资源为目的】的暴力(劫掠牲畜/粮食/人口/财货、以占资源为目的的征服)。
      【不计入】荣誉/复仇/血亲械斗/争地位/领土象征性冲突等【非资源获取型】暴力。
      理由:BR-L2-008 只坐实了"抢资源"这条路,本推论的杠杆②③也只调节"抢资源 vs 换资源";
      若把非资源型暴力算进结果,会让"势均力敌+常年械斗"的社会(新几内亚山地、节段世系
      牧民)假装成反例——其暴力大半是复仇/荣誉/抢地盘,不在射程内。这类社会见 boundary_cases。
    measurement: "史料/考古/民族志:贸易品流通、市集记载(贸易) vs 以夺取资源为目的的破坏层、劫掠/征服记载(掠夺)。战伤须能归因于资源夺取才计入,不一概计入。取时间窗内主导模式。"
    limitations: "混合态(边贸易边劫掠)常见,按主导模式判定并标注。射程外的非资源型暴力单列,不影响本推论判定。"

# === 推导链 ===

derivation: |
  from_l1:
    axioms: [AXIOM-001, AXIOM-003]
    theorems: [THEOREM-exchange-competition-alternative, THEOREM-conflict-cost,
               THEOREM-cooperation-precondition]
  from_l2:
    bridging: [BR-L2-005, BR-L2-007, BR-L2-008]

  steps:
    1. "两条获取路径(换 vs 抢)并存且替代"
       掠夺(BR-L2-008 坐实其真实且随净收益上升)与交换(CONCEPT-exchange)是
       资源获取的替代路径(THEOREM-exchange-competition-alternative)。

    2. "换有两条来路——互补非必要"
       R1 互补型:THEOREM-exchange + BR-L2-007,互补越高交换收益越大(单调)。
       R2 互惠/风险共担型:BR-L2-005 + AXIOM-003,同质群体靠时间错开的余缺 +
       重复接触撑起延时互惠。任一路即可开出交换收益 ⇒ 互补是 R1 的强度驱动,
       不是交换的必要条件。(此步为 round-1 修订核心:纠正原稿把①拔高为必要闸门。)

    3. "杠杆②:成本比较决定倾向"
       THEOREM-conflict-cost:掠夺对双方消耗成本。掠夺净收益(BR-L2-008)=
       抢到 − 抢的成本 − 报复损失。抢的成本/风险高于换 ⇒ 倾向换。

    4. "杠杆③:可执行性 + 掠夺自毁"
       AXIOM-003 + THEOREM-cooperation-precondition + BR-L2-005:重复接触让赖账
       被断绝往来惩罚(延时交换可执行)、让掠夺招报复并毁掉未来伙伴(掠夺自毁);
       或由自执行交换结构(同时易货)替代重复接触。一次性陌生接触且无自执行结构
       ⇒ 掠夺无后顾之忧。

    5. "合成:两来路 + 两杠杆 + 会翻转"
       得换路径存在(R1∨R2) + ②③ 足够 ⇒ 换主导;②③ 可被【不同外因】分别推动 ⇒ 同一对群体翻转。
       【round-2 诚实声明:②③ 共用一条"报复"通道】——"报复损失"在②(一次性夺取的成本)
       和③(未来之影惩罚/毁掉未来伙伴)里都出现,故二者【不完全正交】。但翻转预测只需二者
       能被不同外因分别推动:②由武力对称性/目标可防御性/边市开闭推动,③由接触频率/自执行
       结构推动——在这些外因上二者可分别变动,足以支撑翻转。"完全独立可变"是过强表述,
       已降为"可被不同外因分别推动"。
       非平凡性:翻转与扎堆来自 ②③ 的交互 + 两条来路的区分——任一砖单独都给不出。

# === 可证伪性 ===

falsifiability: |
  本推论可被以下发现证伪：
  (a) 一对群体同时满足【存在得换路径 + 固定邻居反复接触 + 高掠夺成本(互相威慑)】，
      却在长时段内以【掠夺】为主导，且 ②③ 无一实际失效。
  (b) 【禀赋互补程度】与【互补型贸易(R1)强度】之间【无】单调正关系(互补更高，
      R1 贸易并不更密)，且非因 ②③ 阻断 ⇒ 削弱 R1(BR-L2-007 的落地)。
  注:原稿的"禀赋同质却贸易主导 ⇒ 证伪"是【伪证伪条件】(已被 hxaro 等满足),
     本版已撤销——同质群体经 R2 稳定交换是【支持】,不是证伪。

falsification_trace:
  primary_suspect: "杠杆②③ 对掠夺的压制 / 交换的可执行——'重复接触或自执行结构真能撑起交换、压住掠夺'(BR-L2-005/AXIOM-003)。招牌预测(翻转)压在这条腿上,最先受检。"
  secondary_suspect: "R1 的单调性(BR-L2-007 落地)——禀赋互补是否真能独立于'是否发生贸易'来测。"
  unlikely_suspect: "掠夺是真实选项(BR-L2-008,IEA=2.0)——极少是问题根源。"
  note: "原稿把①-必要性当承重、又当可证伪命题(双重身份),经 round-1 证伪并修订:①降为 R1 强度驱动,双重身份已解除。"

# === 排除的结果 ===

excluded_outcomes:
  - outcome: "得换路径 + 反复接触 + 高掠夺成本齐备却掠夺主导"
    description: "三者齐备,却长期以劫掠为主导资源转移方式,且 ②③ 无一实际失效。若存在,推论被证伪。"

  - outcome: "互补与 R1 贸易强度无单调关系"
    description: "禀赋互补程度提高,互补型贸易(R1)强度却不随之上升(非因 ②③ 阻断)。削弱 R1。"

anti_talisman_clause: |
  【防不可证伪护身符 — 诚实硬约束】用"某杠杆失效"解释一个看似反例时,必须
  【独立于结果】地证明该杠杆确实失效(如"掠夺成本骤降"须由征服前可观测的武力
  不对称证明),不得因"结果是掠夺"就倒推"必有杠杆失效"。同理,"存在得换路径"
  (R1∨R2)不得在事后随意宣称成立以解释任何贸易——R2 的"风险错开"须由气候/物候
  等独立数据支撑。否则本推论沦为不可证伪的循环(DED-004 病根)。
  round-1 审查确认:本推论在 ②轴上真可证伪(殖民"武力骤降"独立可观测),护身符
  条款实起作用,未犯 DED-004 的病;round-2 确认 R2 的引入未制造【新的】逃逸门
  (把"得换路径存在"变得过易成立),反而更暴露自己(硬化)。

# === 现实锚点 ===

real_world_anchors:
  supporting:
    - anchor: "昆人 hxaro / 东非牧民牛只结义 / 农业道义经济互借 —— R2 路"
      evidence: |
        生态同质的群体之间,靠时间错开的余缺 + 重复接触维持稳定的延时互惠交换
        (昆人 hxaro 跨 band 数十年,珠/箭/工具;牧民互相寄养借牛分散畜疫旱灾;
        农户谷物互借换工)。驱动力是风险分摊,非禀赋互补 ⇒ 支持 R2、支持"互补非必要"。
        (round-1 审查把这些作为①-必要性的反例;本版接受,将其转为 R2 的支持锚。)
      independent_shock_evidence: |
        【round-2 修订:兑现"R2 须独立于交换验证"这把锁】R2 成立要求"各群体的冲击在
        时间上错开"能【独立于交换本身】被观测,否则是循环。此处兑现:
        (1) 昆人:卡拉哈里降雨在【空间上高度斑驳】(局地雷阵雨,相邻 band 领地丰歉常
            不同步),由降雨/气候数据独立判定,不依赖"是否发生 hxaro"。Wiessner 的经典
            分析正把 hxaro 功能归为缓冲这种【空间不同步的局地方差】。
        (2) 东非牧民:旱灾/畜疫在畜群间、地块间有局地性,牛只结义正分散这种不同步风险,
            同样可由降雨/疫情分布独立判定。
        故"同质却交换"是【R2 支持】而非①的反例,且此判定不靠交换结果倒推。
      honest_note: |
        诚实边界:上述独立证据对昆人较扎实(有降雨方差与 hxaro 功能的专门研究),对牧民/
        农业道义经济较间接(机制合理但缺同等专门的"去相关冲击"测量)。故后两者标注
        "R2 独立性待更强数据",不与昆人同等计权。
      confidence: "strong(仅昆人:有降雨方差+hxaro 功能专门研究);moderate(牧民/农业:机制合理,去相关冲击测量待数据)"

    - anchor: "游牧-定居关系的贸易/劫掠翻转 —— ②③ 驱动"
      evidence: |
        草原游牧对定居帝国:边市条件有利(准入、价格)时贸易,恶化(关闭边市、歉年)
        时劫掠——同一对手随 ②③ 反复翻转。互补(R1)大致恒定,翻转由 ②③ 驱动。
        这是招牌预测(会翻转)的直接锚点,且压在健康的 ②③ 腿上。
      confidence: moderate

    - anchor: "贸易离散社群 (trade diasporas)"
      evidence: "亚美尼亚、马格里布(Greif)、华人商帮靠可追溯身份+声誉(高③)在陌生地维持信任型长途贸易。支持③的重复/声誉执行来源。"
      confidence: moderate

  self_enforcing_substitutes_for_shadow:
    - anchor: "无声贸易 (silent trade) —— 自执行结构替代③"
      evidence: |
        (round-1 审查指出原稿把它误编码为③的支持锚。)其招牌机制恰是【不依赖】
        人际信任/重复博弈——靠同时性、互不先交、你不取货我不撤货的【交换结构本身】
        自我执行,故能在语言不通、身份匿名(人际③很低)的陌生人之间成立。本版据此
        重编码:它是"③可被自执行交换结构替代"的证据,而非重复接触的支持锚。
      confidence: moderate

  counterexamples: []

  boundary_cases:
    - case: "殖民征服 (会咬人的边界案例)"
      analysis: |
        高互补 + 反复接触,却掠夺/征服主导——表面像反例。处理:枪炮/疫病造成极端
        武力不对称 ⇒ 掠夺成本(②)骤降 ⇒ 模型预测翻向掠夺。属【支持】。诚实暴露:
        (1)② 是最强杠杆,权力骤变压倒得换路径;(2)此解释须【独立于结果】证明武力
        不对称(征服前可观测的兵力/技术/疫病),否则触犯 anti_talisman_clause。
        round-1 审查确认此案的"②失效"至少部分独立于结果成立。
      status: boundary_case

    - case: "势均力敌 + 常年械斗的社会 (新几内亚山地、节段世系牧民) —— round-2 新增"
      analysis: |
        表面像反例:R2 保证这类同质群体有得换路径,②(相互威慑、武力对称)也高,模型据此
        应预测"贸易主导",可它们却常年械斗——似乎命中(a)轴证伪。处理:这些械斗大半是
        【复仇/荣誉/新娘/领土地位】型暴力,【不在本推论"掠夺=抢资源"的射程内】
        (见 outcome.scope_boundary)。同时它们确实【也在活跃地交换】(新几内亚 moka
        交换、节段世系间通婚与牲畜流动)——即"资源转移以贸易/互惠为主"与"非资源型械斗
        并存"。round-2 独立审查竭力猛攻此类案例(moka+械斗、世系世仇+通婚、亚诺马米
        袭击+宴飨)未得干净反例:资源型夺取的强度确随生态压力(②)起落,与预测一致。
        故属【支持 + 射程声明】,不是反例。诚实暴露:本推论只解释"资源怎么转移",
        不解释非资源型暴力——这是适用范围,不是漏洞。
      status: boundary_case

