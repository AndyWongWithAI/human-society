id: DED-022
type: deduction
layer: L3-deductions
status: verified
term: "大规模社会多层公平冲突推论 (Multi-layered Fairness Conflict in Large-scale Society)"

人话摘要: "一个人既是家人又是职员又是公民——这三个身份各自的'公道'不是同一回事,而且经常打架。对公司公平的事可能对家人不公,选哪边不是人品问题——是你在哪个身份里陷得深。公平在大社会里不是一把尺,是一堆尺,而且尺子互相不认。"

statement: |
  【核心】大规模社会(远超Dunbar数)中,一个人同时嵌入多个社会层(家族/社区/公司/行业/国家/宗教),每层有各自独立的公平标准且标准之间可能不可通约——'对公司公平'和'对家人公平'不是同一把尺子的不同刻度,而是不同的尺子。公平的层间冲突是大规模社会的结构特征,非道德缺陷或'双标'。当层间冲突发生时,个体偏好哪一层的公平标准 = f(该层的关系紧密度 × 该层标准对个体利益的即时影响)。

  【驱动量】层间公平标准的可通约程度——事前可测:两标准是否共享同一判据维度(CONCEPT-fairness(e)中的同一个种:同为按贡献/同为按平等/同为按需要)、是否可用同一度量衡表达。可通约性越低,冲突越不可通过'商量商量就合一'化解。

  【预测】(i)一人同时嵌入的层数越多,经历公平层间冲突的频率越高——不是线性,在3-5层出现拐点(此后新增层的标准大概率与已有层不可通约,冲突频率递增)。(ii)当两层的公平标准正面冲突时,个体的选择倾斜向关系更紧的那一层(家人>职业规范>国家法律)——即使该选择在另一层的标准下被判断为'不公平'。(iii)逐格判空:'多层嵌入(≥3层)+至少一对层的公平标准不可通约+制度层间冲突长期为零'这一格预测为空——短期可被单一层的霸权压制消化,但长期必然冒出来。

  【判别】与DED-016(公平相变)判别:DED-016说>150人→碎片化或制度化,本条说碎片化/制度化后的稳态特征是'多层标准化冲突'——是DED-016推论的纵深延续而非复述。与角色冲突(role conflict)社会学常识判别:本条独有贡献是将其锚定到CONCEPT-fairness的属定义上(多标准=多'种'),而非'人有多种角色所以冲突',并给出可证伪的结构预测(层数-冲突频率的非线性+利益×亲密度对选择的主导)。

operationalization:
  number_of_embedded_layers:
    definition: |
      个体同时参与的、具有独立公平标准(分配规范/程序规则/互惠预期)的社会层数量。层按可事前编码的制度/组织归属识别:家族/氏族、社区/村落、公司/职场、行业/职业共同体、国家/政权、宗教/意识形态共同体。每层须有独立可查的公平标准——由该层成文规则或民族志/问卷独立确认,不等于个体的偏好。
    measurement: |
      由个体自报或档案记录的独立制度归属计数。各层的公平标准通过成文规则(公司法/劳动法/家族继承习惯/宗教戒律)或标准化vignette独立编码为CONCEPT-fairness(e)的种(平等/按贡献/按需/按资历/程序等),不得因'个体经历冲突'反推'该层必有独立标准'。
    limitations: "嵌套层(家族⊂社区)可能共享同一公平标准——仅当两层的公平标准被独立证据确证有差异时才分别计数。3层以下区分度有限(多数人在现代社会中至少3层:家族+职场+国家),核心变异在4-7层。"

  commensurability:
    definition: |
      两层的公平标准是否共享同一判据维度——即可否用CONCEPT-fairness(e)中同一种的指标表达。'可通约'=两标准均属同一种(如均为按贡献分,即使权重不同);'不可通约'=两标准属不同种(一层按资历、另一层按市场效率;一层按平等、另一层按需要),判据维度本身不可比较。
    measurement: |
      由两名独立编码员将各层的公平标准(来自成文规则或标准化vignette)映射至CONCEPT-fairness(e)的种;若映射至同一种→可通约,不同种→不可通约。编码独立于冲突频率——不得因'这两层经常打架'就推断'必为不同种'。
    limitations: "边界案例:按贡献(equity)与按需(need)在实践中可部分重叠(如'多劳者需要多得');按多数编码员判定,分歧处标注。"

  inter_layer_conflict_frequency:
    definition: |
      个体遭遇'遵从A层公平标准则违反B层公平标准'的选择事件的频次。在制度层面对应为:不同制度层(家事法vs合同法;宗教法庭vs世俗法庭)对同一案件作矛盾公平裁决的案例频次。
    measurement: |
      个体层:日记法或回顾性调查,统计冲突事件/月。制度层:法律多元主义文献中对同一案由的双重裁决记录数,独立于自变量(层数/可通约性)测量。
    limitations: "自报偏误;制度层记录偏向已公开的大案,低频冲突可能漏检。"

  choice_tilt:
    definition: |
      在公平层间冲突中,个体实际遵从哪一层的公平标准。操作化为二择:遵从关系更紧层 vs 遵从关系更疏层。
    measurement: |
      行为观察或假设vignette实验:呈现两层的公平标准正面冲突的场景,记录个体的选择及自陈理由。关系紧密度由社会距离量表独立测(BR-L2-009框架),不与选择结果混淆。
    limitations: "社会期望偏差:被试可能在vignette中选择'守法'而非实际会做的'护家人'。用匿名+激励相容设计部分缓解。"

derivation:
  from_l1:
    axioms: [AXIOM-001, AXIOM-003]
    theorems: [THEOREM-position, THEOREM-group-identity-decay]
  from_l2:
    bridging: [BR-L2-004, BR-L2-006, BR-L2-017]
  steps: |
    1. "DED-016的后继:碎片化/制度化后的稳态是多层标准并存——本条接这条的尾"
      DED-016给:>150人,面对面统一公平(档A)不可持续,出路为碎片化(档B)或制度化(档C)。
      无论B还是C,结果都是:大规模社会中,个体不再生活在单一公平标准下,而是同时暴露于
      多个社会层的不同公平标准——家族层(档B碎片化后的亚群标准或档C下未被制度替代的
      私人域)、职业层(公司/行业的内部公平规范)、国家层(法律/制度的公平标准)等。
      这是本条的出发点:多层嵌套的公平标准并存是大规模社会的结构结果,非偶然。

    2. "BR-L2-017的放大:从小群体的语境切换到大规模社会的制度层间冲突——真发动机之一"
      BR-L2-017给:同一小群体内,人在不同语境中切换公平标准(分饭vs分遗产)。在大规模
      社会中,这一机制被放大到制度层:不同层的公平标准不再是'一个人在不同场合灵活切换',
      而是不同层的规则客观冲突——因为每层的标准被各自的制度/规范硬化,不是一个人想换
      就换的。BR-L2-017本身只说'切换',不说'冲突'——冲突是当一个人同时被多层召唤、
      无法同时满足两套标准时才出现的;BR-L2-017的语境切换前提是'一次只在一个语境'。
      本条的非平凡延伸在于:大规模社会的多层同时嵌入使'一次在一个语境'的前提破碎——
      同一时刻你既是家人又是职员,两套标准同时召唤你。

    3. "BR-L2-006给'冲突时偏哪边'的引擎——真发动机之二"
      BR-L2-006给:人对内群体有自动偏袒。每层社会层都可构成内群体——家族、公司、行业、
      国家都是'我们'的不同圈层。当层间冲突时,内群体偏好预测:个体选择偏袒关系更紧的那
      一层(家人>同事>同胞)——BR-L2-006单独只说'偏袒自己人',不说'当多个自己人群体
      的规范打架时选谁'。本条将BR-L2-006从'单内群体vs外群体'延伸到'多个嵌套内群体
      的冲突排序':f(关系紧密度 × 即时利益影响)决定选择方向。

    4. "CONCEPT-fairness(c)规范性 + THEOREM-position → 冲突不可通过商量化解"
      CONCEPT-fairness(c)给:公平标准有规范性('就该这样做')。THEOREM-position给:每层
      成员对该层公平标准有立场——他们不仅认为该标准'应该被遵守',而且有利益在维持它。
      两层各有各的'正当性'且各有各的捍卫者→层间冲突不是'缺乏沟通'的认知问题、不是
      坐下来商量商量就能合一的。不可通约性在此生效:若两标准属CONCEPT-fairness(e)的
      不同种,没有共同的度量衡可以'比较'谁的公平更高——只能靠权重(紧密度×利益)决出。

    5. "合成——非平凡性(逐格判空)"
      驱动量=层间公平标准的可通约程度(事前可测、独立于冲突频率)。被预测量=层间冲突
      烈度与频率。机制:多层嵌入(结构前提,DED-016+Dunbar)→ 两标准不可通约(不同种,
      经BR-L2-017放大)→ 各有规范性拥护者(c+THEOREM-position)→ 冲突不可化解→
      当冲突时选关系更紧层(BR-L2-006的嵌套延伸)。空格:'多层嵌入(≥3层)+至少一对层
      的公平标准不可通约+制度层间冲突长期为零'预测为空——因上述机制链必然产生冲突,
      唯一可长期压制冲突的是单一层霸权(如极权国家用暴力压制所有其他层的公平主张),
      但霸权压制是短期可维系的(需持续高成本),长期必然有冲突冒出来。

falsifiability: |
  本推论可被以下发现证伪:
  (a) 发现一个社会:多数成员嵌入≥3层社会层(家族+职场+国家,可独立证),其中至少一对层的公平标准经独立编码为不同种(不可通约),但在长时段(>一代人,>20年)内,制度层面的公平冲突记录为零——且无法归因于单一层霸权压制(霸权撤除/松动时仍无冲突才命中空格,霸权持续有效压制属于excluded_outcomes)。⇒ 证伪核心空格(iii)。
  (b) 个体经历的公平层间冲突频率与嵌入层数无显著正相关——特别地,3层→4层→5层的递增不产生冲突频率的阶跃上升,拐点不存在。⇒ 证伪预测(i)的非线性主张。
  (c) 公平层间冲突中,个体的选择方向不由关系紧密度+即时利益影响主导,而是由其他因素(如社会赞许/法律惩罚威慑)完全解释;或关系紧密度对选择的效应在统计上不显著。⇒ 证伪预测(ii)。

falsification_trace:
  primary_suspect: "层间公平标准的'不可通约'主张——若不可通约性操作化为'两标准属CONCEPT-fairness(e)的不同种',且实证显示'不同种'与'可通约的同种权重差异'在预测冲突频率/烈度上无区分力(即不可通约性不比'不同规范有差异'带来额外预测精度),则本条退化为'不同群体有不同规范所以偶尔摩擦'的平凡复述(BR-L2-006+CONCEPT-norm的平凡组合),损失的是本条的非平凡内核——不可通约性作为冲突不可化解的结构根源。"
  secondary_suspect: "f(关系紧密度 × 即时利益影响)的权重函数——紧密度和利益是否真的各自独立贡献,还是高紧密度本身就是高利益暴露的函数(即家人关系紧因为利益纠葛多)。若两变量在操作上无法独立测,预测(ii)退化为'紧密=选它'的同义反复。"
  unlikely_suspect: "BR-L2-017的语境切换机制——跨方法验证(IEA=1.9)稳健,极少是根源。"

excluded_outcomes:
  - outcome: "单一层霸权用暴力持续压制所有其他层的公平主张(如极权国家),冲突未公开显现"
    description: |
      短期压制在预测范围内(空格(iii)标注'短期可被霸权压制消化')。唯有霸权撤除/松动后仍长期无冲突,才命中空格。霸权的存在与否由独立证据(镇压机构/言论控制/独立司法缺失)测,不得因'无公开冲突'反推'必被压制'。
  - outcome: "个体经历层间冲突但通过私人权衡自我消化、未升级为制度层冲突"
    description: |
      本条预测冲突【存在】(个体经历层间冲突事件),不预测每一次都升级为制度对抗。个体消化是冲突存在的一种低烈度形式,不构成反例。无冲突=个体从未感知到'遵从A层的公道就得亏待B层'的经历,或制度层从未产生矛盾裁决。
  - outcome: "只有两层嵌入(如仅家族+国家)且冲突可被明确的法律层级(国家法优先)解决"
    description: |
      两层且可通约(如国家法明确宣称高于习惯法)→冲突可被层级优先规则吸收,不在本条核心射程内。本条的非平凡主张针对'不可通约的多层(≥3)',特别是不同种间的冲突。

anti_talisman_clause: |
  【防不可证伪护身符】判定'两层的公平标准是否不可通约'时,必须由独立编码员将各层标准映射至CONCEPT-fairness(e)的种,不得因'这两层有冲突记录'就推断'必为不可通约'。判定'个体嵌入层数'时,由独立的制度归属记录计数,不得因'此人经历了很多冲突'就事后多算层数。判定'选择偏关系更紧层'时,关系紧密度由独立的社会距离量表(BR-L2-009框架)测,不得因'选了家庭'就推断'家庭必然关系更紧'。尤其不得:遇到'多层嵌入+不可通约+长期无冲突'的反例时,事后硬塞一个'其实有隐性霸权在压制'来消化——霸权的在场须由独立政体指标(如Polity/自由之家/镇压事件记录)坐实。

nontriviality_test: |
  2×2判据表(嵌入层数 × 层间可通约性;被预测量=冲突频率/烈度):
  格1(低层数≤2层,至少一对不可通约):可能出现冲突但频次低(层少则冲突面窄),非空。
  格2(低层数≤2层,各层均可通约):预测冲突极低频(可通约→可协调),非空。
  格3(高层数≥3层,各层均可通约):预测低频冲突(可通约标准纵有差异但可比较/可权衡),非空。
  格4(高层数≥3层,至少一对不可通约):【预测冲突高频/高烈度,且冲突不可化解】——核心预测格,非空但承载主要预测力。
  空格在时间轴上:格4(多层+不可通约) + 长期(>20年) + 制度层冲突记录为零 + 无独立证据的霸权持续压制 → 【预测为空】。

  空格论证:没有任何单一承重砖可独立推出该空格。BR-L2-017只说语境切换(不说多语境同时冲突);BR-L2-006只说内群体偏袒(不说多个内群体嵌套冲突);BR-L2-004只说>150→层级(不说多层公平标准);DED-016只说>150→碎片化/制度化(不说碎片间的稳态冲突);CONCEPT-fairness(c)是规范性定义(近定义砖,不起发动机作用);THEOREM-position是立场定义(近定义砖)。六者合成才得出:'多层嵌入+不可通约标准→冲突不可协商化解→长期必然冒出来→空格'。空格属真经验主张——可被'格4条件全满足且长期零冲突且非霸权压制'的现实反例填上,非逻辑必然、非被砖平凡强制。

  【brick=conclusion诚实审查】BR-L2-017近经验(语境切换的观测规律),BR-L2-006近经验(内群体偏好的观测规律),两者是真发动机——合成了从'切换'到'冲突'再到'选哪边'的完整链条。BR-L2-004是Dunbar数的经验锚(近经验)和层级结构的近定义桥,提供'多层何以存在'的结构前提而非核心引擎。CONCEPT-fairness(c)和THEOREM-position近定义——它们界定冲突为何不可靠商量化解,但不起因果驱动作用。

real_world_anchors:
  supporting:
    - anchor: "举报人困境(whistleblower):职业伦理vs公司忠诚——不可通约的公平标准冲突"
      evidence: |
        举报人面对两套公平标准的同时召唤:职业规范(会计师/医生/工程师的行会守则)要求披露违规以保护公众——这是按'公众利益/职业诚信'的公平标准;公司忠诚要求保护雇主——这是按'内外有别/团队利益'的公平标准。两套标准不可通约:一个是康德式普遍化公平(对所有人同等适用),一个是内群体偏袒式公平(自己人优先)。举报人的选择可测试预测(ii):选职业伦理优先=选了更广但更疏的社会契约层,选公司忠诚优先=选了更紧的雇佣关系层。
      independent_test: |
        职业守则和公司规章均可在举报事件发生前独立编码——职业守则属'普遍化公平'(CONCEPT-fairness种=程序公正/平等),公司规章属'内群体公平'(种=按归属/按关系),编码独立于举报人最终选择。
      confidence: moderate

    - anchor: "孝vs法:中国传统社会的家族义务vs国家法律——多层公平冲突的制度化表现"
      evidence: |
        儒家伦理要求'亲亲相隐'(亲属间包庇犯罪是孝的义务——按血缘公平:家人优先),国家法律要求'大义灭亲'(人人平等受审——按公民公平:法律面前人人平等)。两套标准不可通约:一个以血缘亲疏为判据维度,一个以法律条文为判据维度——不是同一尺子上的不同刻度。历代法律中'容隐'条款(汉律亲亲得相首匿、唐律同居相隐不为罪)的存在本身即证明:制度层面承认此冲突无法消除,只能划定妥协边界。
      independent_test: |
        儒家伦理规范('亲亲')和国家律令均可独立于具体案件编码;容隐条款的存在由法典文本判定,不由'发生了冲突案件'反推。
      confidence: moderate-strong

    - anchor: "神法vs世俗法:宗教少数群体的饮食/婚姻规范vs公民平等法——不可通约的制度性冲突"
      evidence: |
        宗教饮食律(如清真/洁食)按宗教归属的公平标准('信徒与非信徒当有不同规范,这是神圣秩序的一部分');世俗反歧视法则按公民平等的公平标准('所有公民在公共服务中应被同等对待')。两标准不仅不同——它们使用不可比较的判断维度:神法以'神圣/亵渎'为轴,世俗法以'权利平等'为轴。冲突无法通过'协商找出共同标准'化解。
      independent_test: |
        宗教规范和世俗法律均可在争端发生前独立编码——宗教规范属'按归属/按神圣秩序'(CONCEPT-fairness种=按归属),世俗反歧视法属'按平等'(种=平等),种的不同独立于冲突记录。
      confidence: moderate

  counterexamples: []

  boundary_cases:
    - case: "小型传统社会(Dunbar数以下)中的角色冲突——格式虽似但机制不同"
      analysis: |
        小型社会中个体也嵌入多层(家族中的子/父/族长、村落中的猎手/长老),但层间的公平标准冲突通过BR-L2-017的语境切换机制解决——此时只有一个共享的公平标准框架,只是在不同场合灵活调用,而非'不可通约的多种标准同时召唤'。该情形由BR-L2-017独立覆盖,不命中本条。本条射程的起点是'规模>Dunbar+公平已碎片化/制度化(DED-016)'之后的多层硬化标准。
      status: boundary_case

    - case: "瑞士联邦制:多语言/多宗教层共存且冲突长期被制度化渠道管理"
      analysis: |
        瑞士有语言层(德/法/意/罗曼什)、宗教层(天主/新教)、州层——多个社会层有各自的部分规范。但瑞士的公平冲突——如语言配额、宗教学校补贴——通过联邦投票+宪法协商的渠道被例行管理,冲突【存在且持续】(定期公民投票本身就是冲突的制度化表达),而非'长期为零'。故空格不命中,且冲突是持续的低烈度形式,实际支持而非证伪核心主张。
      status: boundary_case

discriminant_validity: |
  【与DED-016(公平相变)判别】DED-016说>150→碎片化/制度化,结论停在"分叉了"。本条说分叉之后的稳态特征是"多层标准化冲突"——是纵深延续,非复述。DED-016不预测碎片间的冲突动力学(哪个碎片胜出?冲突能否化解?层数与冲突频率的关系?),本条填补这一后-Dunbar稳态的空白。两条可共存、不矛盾、测不同的事。

  【与角色冲突(role conflict)社会学常识判别】Merton(1957)的角色冲突理论说:一人占多个社会角色时,角色期待可能矛盾→产生压力。本条独有贡献:(i)将冲突锚定到CONCEPT-fairness的属定义上——问题不只是'角色期待矛盾'而是'公平标准不可通约(不同种)',即两层的不止是规范,是彼此不承认对方公平合法性的标准体系;(ii)给出可证伪的结构预测:层数-冲突的非线性拐点、f(紧密度×利益)的选择函数;(iii)空格预测——角色冲突理论不自证何时冲突为零。

  【防平凡化守卫——回应primary_suspect】最严重的平凡化威胁:'多层公平标准不可通约'可能只是'不同群体有不同规范(BR-L2-006+CONCEPT-norm)'的换个说法。防线的关键:不可通约性有操作化定义(两标准是否可被映射至CONCEPT-fairness(e)的同一个种——同等vs按贡献vs按需)。'差异'是连续量(规范在权重/程度上不同);'不可通约'是结构上的断崖(判据维度本身不兼容,不能通过调权重化解)。如果实证中所有'不同层的规范差异'都属于'同种内的权重差异'——即现实中不存在真正跨种的层间冲突——则不可通约主张被削弱,推论退化为'层间规范差异产生摩擦'——这已包含在角色冲突理论中、不再是独立贡献。但若实证中确实存在跨种不可通约且其预测力高于同种权重差异,则防线成立。

