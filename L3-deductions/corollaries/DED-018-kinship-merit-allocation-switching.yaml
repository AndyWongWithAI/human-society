id: DED-018
type: deduction
layer: L3-deductions
status: verified

term: "亲缘-绩效分配切换推论 (Kinship-Merit Allocation Switching Corollary)"

人话摘要: |
  自家人分东西不计较谁干多干少——不是觉悟高,是血缘纽带让追踪贡献没必要;
  但跟外人合作还按平均分?没人干。亲缘越远,分配越得看功劳——从'一家人不说
  两家话'到'亲兄弟明算账'的过渡线上,立着公平标准的根本切换。

statement: |
  【核心】亲缘度系统性改变默认公平分配标准:亲缘群体(血亲/拟制亲缘)默认按平等
  或按需要分——亲缘利他削弱了追踪个体贡献的必要性和意愿;非亲缘群体则必然转向
  按贡献(绩效)分——否则搭便车无法抑制、合作塌掉。亲缘度 moderates 分配标准:
  血缘越近→平等/需要权重越高;血缘越远→绩效权重越高。这不是文化偏好,是激励
  结构逼的:亲属间追踪贡献的成本高(反正都是一家人)且利他缓冲了搭便车伤害;
  非亲属间不追踪贡献则合作必然解散。

  【驱动量】亲缘度(kinship_degree)——定义为群体成员间的平均遗传相关度 r 或拟制
  亲缘强度,由谱牒/亲缘重建或拟制亲缘制度签名独立测,【绝不】由"群体用了什么
  分配标准"反推(anti-talisman——不能因为用了平等分就判为高亲缘、用了按贡献分
  就判为低亲缘)。

  【机制链】
  (a) BR-L2-002 给:血缘越近愿付出越多、计较越少→平等/需要分不需要精确追踪
      贡献,因为利他消解了"谁干多谁干少"的紧张;
  (b) BR-L2-017 给:分配标准随关系类型切换——亲缘/共居情境=communal sharing→
      平等/需要;交易/生产关系=market pricing→绩效;
  (c) BR-L2-013 给:非亲缘群体内若按平等分而不按贡献分→高贡献者感知不公
      ("我出力多,凭啥一样?")→代价退出/惩罚→合作分崩;
  (d) 合成:亲缘度 moderates 分配标准——不是"亲缘=平等、非亲缘=绩效"的二分,
      而是亲缘梯度上分配标准的权重连续位移;归因不在文化分类,在激励结构的
      必然:搭便车问题在高亲缘下被利他缓冲、在低亲缘下致命。

  【预测】
  (i) 亲缘度越高的群体,平等/需要分配标准出现的频率越高;
  (ii) 同一群人从亲缘情境切换到非亲缘情境时,默认公平标准从平等/需要位移到
       按贡献——即使资源性质不变;
  (iii) 逐格判空:"非亲缘+长期按平等分配+无外部强制+成员贡献可区分且不等+
        不塌"这一格预测为空。

  【判别·防平凡化】
  与 DED-009 判别:DED-009 讲亲缘对"组织规模"的约束(被预测量=组织能长多大),
  本条讲亲缘度对"资源分配标准"的 moderation(被预测量=分东西按什么规矩)——不同
  被预测量、不同机制。与 DED-013 判别:DED-013 的驱动量是稀缺度,本条的驱动量
  是亲缘度——两条正交的自变量轴(稀缺度×亲缘度可交叉预测:高稀缺+高亲缘→
  按需要;高稀缺+低亲缘→按贡献)。与 BR-L2-017 判别:BR-L2-017 已给出"亲缘/
  共居情境→平等/需要"的关系类型→分配标准映射,扎根 Fiske/Deutsch 的认知分类;
  本条的新增量=(1)将归因从认知分类推进到激励结构(搭便车/利他缓冲——为什么
  亲缘情境用平等可行、非亲缘不行);(2)将二分映射精化为亲缘梯度上的连续 moderation;
  (3)空格预测——"非亲缘+平等+无强制"不可长期存续,这是 BR-L2-017 不单独给出的
  可证伪经验主张。

# === 规则 A：操作化定义 ===

operationalization:
  kinship_degree:
    definition: |
      【自变量/驱动量】群体成员间的平均亲缘强度,由两个维度合成:
      (1) 平均遗传相关度 r——由谱牒/亲缘重建按可追溯血缘独立测;
      (2) 拟制亲缘强度——结拜/义亲/收养/联宗/教父母等拟制亲缘制度签名的在场
      与强度(DED-009 species A),由独立制度签名坐实。
      落在连续谱上:高(r≥0.125,一等堂表亲及以上,或强拟制亲缘在场)→低
      (r→0,无拟制亲缘,随机陌生人)。【anti-talisman 死约束】亲缘度必须由上述
      结构指标独立测得,【绝不】由"该群体用了什么分配标准"反推。
    measurement: |
      谱牒重建+协作名册:按可追溯血缘复原成员间 r,取均值或中位;拟制亲缘强度由
      结拜/义亲/收养文书、拟血缘称谓、共祖仪式的独立在场与强度编码(制度签名法,
      同 DED-009 的 scaffolding_substrate species A)。与 allocation_norm_type
      【测量轴正交】——亲缘度从血缘+制度签名测,分配标准从行为+理由+违规反应测,
      二者不共用指标。
    limitations: |
      r 连续衰减,拟制亲缘强度亦连续(从"随口叫兄弟"到"歃血盟誓+写入族谱");
      混合群体常见(核心亲属+外围非亲属),按核心协作集的平均亲缘度标注;
      "足够近亲"无硬阈值、是梯度带。

  allocation_norm_type:
    definition: |
      【被预测量】群体在分配可竞争资源时,成员接受/援引的【主导公平标准】:
      - 平等型(equality):每人分一样,差别不被接受;
      - 需要型(need):按需求急迫程度分,最缺的先给;
      - 贡献型(contribution/equity):按投入(劳动/技能/风险)比例分,多劳多得。
      可混合,按主导标准标注。与 kinship_degree【分轴独立测】。
    measurement: |
      三源合一:(a)实际分配行为的统计模式;(b)成员对分配决定的正当化理由;
      (c)成员对违反该标准者的反应(制裁/谴责/退出——诉诸了什么标准)。
      与亲缘度的测量轴正交——不由"他们是不是亲属"推断"他们肯定按平等分"。
    limitations: |
      混合态常见,按主导用法标注;公平标准可随资源类型分化(食物分平等、
      工具分贡献),须标定资源类型范围。

  temporal_threshold:
    definition: |
      【空格的时程操作化】"长期"不设绝对自然年阈值,改用两档联合判据:
      (a) 代际周转:群体核心成员至少完成一整代自然退出+新成员补充的完整周转
          (即创始代核心≥半数已被非创始代替代,平均任期~20-30年,视群体类型调整);
      (b) 分配周期累积:经至少N个完整分配周期(N≥群体规模,保证每个成员至少
          经历一次"我可搭便车也可被搭便车"的完整博弈回合)后,自由骑乘的累积
          可测效应(高贡献者退出率/减投率)应可检测。
      两档任一满足即可判为"长期"前件达成——判据实质不是"多少年",而是"搭便车
      压力是否已完成至少一轮完整的成员暴露与博弈学习"。此操作化后,Twin Oaks
      (~60年平等存续中,创始代已基本退出→满足代际周转)即可明确判定:空格前件
      "长期"成立→若仍未塌缩则构成反例(而非悬置于"还不够久")。
    measurement: |
      代际周转由成员名册的入社/退出年份独立测(非由分配行为反推);分配周期由
      群体资源分配节律(收获季/月薪/项目周期)独立测。
    limitations: |
      代际周转~20-30年为经验锚定、非精确开关阈值;小型群体代际周转可能<20年,
      大型制度化群体可能>30年。判据的实质是"搭便车压力是否已完成至少一轮完整
      的成员暴露与博弈学习"——代际周转和分配周期是此实质的两个可操作代理。

# === 推导链 ===

derivation:
  from_l1:
    axioms: [AXIOM-001]
    theorems: [THEOREM-cooperation-precondition]
  from_l2:
    bridging: [BR-L2-002, BR-L2-013, BR-L2-017]

  steps: |
    1. "亲缘利他消解贡献追踪必要性 (BR-L2-002)"
       亲缘利他使个体愿为血亲付出、对"谁干多干少"计较减少——高亲缘群体中,
       按平等/需要分不需要精确追踪个体贡献,因为利他缓冲了搭便车带来的伤害。
       这不是"亲属道德觉悟高",是 Hamilton 的 rB>C 给了不计较的演化理由。

    2. "分配标准随关系类型切换 (BR-L2-017)"
       同一群人在不同关系语境下自动切换分配标准:亲缘/共居情境→平等/需要
       (communal sharing);交易/生产情境→按贡献(market pricing)。这给出了
       亲缘度与分配标准之间的经验映射——但止于关系类型→标准类型的认知分类
       (扎根 Fiske/Deutsch/Sahlins),未追问"为什么这个映射存在"。

    3. "非亲缘平等不可持续——期望违背与搭便车塌缩 (BR-L2-017+BR-L2-013)"
       非亲缘群体中若按平等分而不按贡献分:高贡献者感知投入/回报比例不对等
       ("我出力多,凭啥一样?")→代价退出/惩罚→合作分崩。注意此不满的触发点
       不是结果分配不均(结果恰恰均等),而是投入/产出比例不对等——属 equity
       theory(Adams 1963)的范畴,非 BR-L2-013 的 outcome inequity aversion
       ("凭什么你拿得比我多")。机制链为:BR-L2-017 给定非亲缘/生产情境下成员
       期望贡献标准→平等分配违背该期望→期望违背触发负反应(此负反应的底层
       心理机制由 BR-L2-013 的不公厌恶支撑,但触发条件不同:是违背贡献期望而非
       结果不均)→AXIOM-001 给方向性压力(贡献可区分→贡献高者会争)。这是
       本条对 BR-L2-017 的核心推进——不是"亲缘情境恰好归类为 communal sharing",
       而是"非亲缘情境下平等分配面临搭便车致命伤、结构上不可持续"。

    4. "合成:亲缘度 moderates 分配标准"
      高亲缘→利他缓冲搭便车→追踪贡献不必要→平等/需要可行且默认;
      低亲缘→无利他缓冲→不追踪贡献则搭便车塌缩→贡献标准必然。
      亲缘梯度→分配标准权重连续位移,非二分。归因在激励结构,非文化分类。

    5. "非平凡性(逐格判空)与 brick=conclusion 诚实评估"
      三块砖各自的边际贡献:
      - BR-L2-002 单独:给"血亲愿吃亏"(为空格供天花板侧的利他缓冲),不说分配标准;
      - BR-L2-017 单独:给"亲缘/共居→平等/需要"的认知分类映射,不说为什么、
        不说空格——其归因是 Fiske 的关系模型(认知/文化分类),不是激励结构;
      - BR-L2-013 单独:给"不公厌恶"(为空格供塌缩机制),不说亲缘度前件。
      三块砖【都不】给出"非亲缘+平等+无强制→不可能持续"这一空格——它需要
      亲缘利他(为什么亲属间可平等)+不公厌恶(为什么非亲属平等会塌)+语境切换
      (为什么分配标准随亲缘度变)三者合成。空格是真经验主张,非被任一砖平凡强制。
      逐格判空(自变量档=亲缘度高/低;被预测量档=主导分配标准):
        (高亲缘 + 平等) → 非空:家庭/宗族内的日常分享,普遍。
        (高亲缘 + 需要) → 非空:对病弱亲属的倾斜照顾,普遍。
        (高亲缘 + 贡献) → 非空:亲兄弟明算账,亲缘高但特定资源(遗产/合伙利润)
          仍按贡献分——本条不预测高亲缘排斥贡献,只预测平等/需要权重更高。
        (低亲缘 + 贡献) → 非空:市场/生产组织按劳分配,普遍。
        (低亲缘 + 需要) → 非空:制度化福利(国家/慈善),有外部强制/制度维持,
          不在空格射程——空格限"无外部强制"。
        (低亲缘 + 平等 + 无外部强制 + 长期 + 成员贡献可区分且不等) → 【空格】
      该空格的核心张力:无利他缓冲→搭便车诱惑;无贡献追踪→高贡献者无理由留;
      不公厌恶→代价退出/惩罚。三项叠加→平等在非亲缘群体中系统不可持续。
      空格可被"非亲缘自发平等长存社群"这一现实反例填上→非空可满足,非同义反复。

# === 可证伪性 ===

falsifiability: |
  本推论可被以下发现证伪:
  (a) 找到一个经【独立谱牒测】确认为低亲缘(平均 r→0、无拟制亲缘在场)的群体,
      其成员贡献可区分且不等,维持平等分配标准达"长期"(≥代际周转或≥N个完整
      分配周期,见 operationalization.temporal_threshold)、无外部强制(国家/宗教
      权威/法律制裁)执行该平等、且群体未塌缩。⇒ 证伪空格预测 (iii)。
  (b) 主导分配标准与亲缘度【无】系统关联:在独立测得的同等亲缘度下,各群体的
      主导分配标准随机分布(平等/需要/贡献无差异)。⇒ 证伪 moderation 效应。
  (c) 同一群体从高亲缘情境切换到低亲缘情境(如从家族内部协作切换到与陌生人
      协作),分配标准【不】从平等/需要向贡献位移——即使资源性质和任务不变。
      ⇒ 证伪情境切换方向 (ii)。

  注:空格测试窗口窄。五项前件(非亲缘+平等+无外部强制+长期+贡献可区分且不等)
  同时满足的现实案例极少;排除钩子#1(外部强制在场的覆盖面极广且定义弹性大)可
  合法消化大部分靠近的候选。空格在逻辑上可证伪,但实战中几乎只能靠(b)统计关联
  与(c)情境切换两条检验。此非逻辑缺陷,但应诚实标注以免高估空格的实战检验力。

falsification_trace:
  primary_suspect: |
    替代解释:"小群体"而非"亲缘"是真正驱动量。亲缘群体通常也小(Dunbar 数内),
    小群体本身就可通过重复互动/声誉/互惠(而非亲缘利他)维持平等——AXIOM-003+
    BR-L2-005 足够。共线性:亲缘度与群体规模在小规模社会中正相关。若此替代成立,
    则亲缘度→平等/需要这个方向的归因虚假——真正引擎是群体规模而非亲缘利他。
    扛法:预测 (ii) 控制群体规模——同一群人只改亲缘/非亲缘情境,预测标准位移。
    若位移只在群体规模变化时发生、不在亲缘情境切换时发生,则 primary_suspect 成立。
    最先受检。注:此防御当前仅为逻辑设计,尚未有受控经验检验——无任何已完成的同一
    群体控制规模只变亲缘情境的受控比较数据。不排除群体规模与亲缘度存在未被拆分的
    共变。
  secondary_suspect: |
    亲缘度的【测量独立性(anti-talisman)】——若被揭示亲缘度实际由分配标准反推
    ("用平等分的就是高亲缘、用贡献分的就是低亲缘"),则本条沦为不可证伪循环。
    与 DED-004/007 同一病根,致死率不低于 primary。
  unlikely_suspect: |
    BR-L2-013(不公平厌恶)——跨物种/跨文化复现极为稳健,极少是被证伪的根源。
  note: |
    若 non-kin 平等社群(如某些宗教公社/基布兹)被提出,须先按判据结构查:该平等
    是否有外部强制维持(教规/社会驱逐威胁)?成员贡献是否真可区分且不等?若外部强制
    在场→出空格射程(空格限"无外部强制")。若成员贡献不可区分(所有人产出相同)→
    贡献不可分则搭便车问题不成立,空格前件不满足,不构成反例。空格是"无利他缓冲+
    有搭便车诱惑+无外部强制+贡献可区分"的特定交叉格,非"所有非亲缘群体都不能平等"。

# === 排除的结果 ===

excluded_outcomes:
  - outcome: "制度化福利/国家再分配(高亲缘度为零但按平等/需要分)"
    description: |
      外部强制(法律/税收/国家暴力)在场→不在空格射程。本条只预测【无外部强制】
      条件下非亲缘平等不可持续,不预测"有强制时平等也不能维持"(后者是不同推论
      射程)。判定按"平等分配是否靠独立于分配本身的外部强制维持"事前划渠道。
  - outcome: "成员贡献不可区分的非亲缘群体(全员做相同简单劳动、产出无差异)"
    description: |
      若贡献不可区分(无人能说"我多干了"),则搭便车不易识别、不公厌恶无材料触发→
      空格前件不成立。本条只预测"贡献可区分且不等"时的塌缩压力。贡献可区分性
      由任务/产出结构独立测,不由"他们用了什么分配标准"反推。
  - outcome: "纯交换/贸易场景的等价交换规范"
    description: |
      市场/陌生人交换中的等价交换不属于"群体内部分配公平标准"范畴——交换规范
      属 DED-005/006/007 射程,本条的分配标准限于群体内部分配可竞争资源的公平规范。

anti_talisman_clause: |
  判定"亲缘度"时,必须由谱牒重建(r)和拟制亲缘制度签名的独立在场坐实,【绝不】
  由"该群体用了什么分配标准"反推——不能因为"他们按平等分"就判为高亲缘,也不能
  因为"他们按贡献分"就判为低亲缘(否则自变量与因变量同轴互推,DED-004/007 病根)。
  同样,判定"主导分配标准"时,必须由实际分配行为+自陈理由+违规反应独立测,【绝不】
  因"他们是亲属"就判为"肯定按平等分"。
  尤其【不得】遇到"独立测得低亲缘却维持平等"的反例,就事后上调测算出的亲缘度
  ("其实他们没有看起来那么不亲")来消化——亲缘度须由事前结构事实坐实。
  【至少一个锚须兑现】:现实中真的用谱牒/血缘重建独立测出亲缘梯度,并非嘴上说
  独立实际上靠民族志叙述推断。

nontriviality_test: |
  逐格判空(自变量档=亲缘度高/低;被预测量档=主导分配标准):
    (高亲缘 + 平等) → 非空:家庭/宗族日常分享,普遍。
    (高亲缘 + 需要) → 非空:对老幼病弱亲属的倾斜照顾,普遍。
    (高亲缘 + 贡献) → 非空:亲兄弟明算账——特定资源/情境下即使高亲缘仍按贡献,
      本条不排斥,只预测平等/需要相对权重更高。
    (低亲缘 + 贡献) → 非空:市场/生产组织,普遍。
    (低亲缘 + 需要) → 非空:制度化福利(有外部强制在场),不在空格射程。
    (低亲缘 + 平等 + 无外部强制 + 长期 + 贡献可区分且不等) → 【空格】
  空格是真经验主张,非被任一砖平凡强制:
  - BR-L2-002 单独:只说"血亲愿吃亏",推导不出"非亲缘平等不可持续";
  - BR-L2-017 单独:只说"亲缘/共居→平等"(认知分类),不说该格必空;
  - BR-L2-013 单独:只说"不公厌恶",不涉及亲缘度前件。
  空格可被"自发平等非亲缘长存社群"的反例填上→非空可满足、非同义反复。
  防平凡化:非平凡不在"亲缘群体用平等、交易群体用贡献"的表层映射(近 BR-L2-017),
  而在将归因从认知分类(Fiske)推进到激励结构(搭便车→空格)的机制层,以及空格
  本身的独立可证伪经验风险。

real_world_anchors:
  supporting:
    - anchor: "狩猎采集社会的亲缘分享梯度"
      evidence: |
        狩猎采集群体(如 !Kung San / Hadza / Ache)的食物分享呈现亲缘梯度:
        肉食(大猎获)优先分给猎人直系亲属(父母/配偶/子女),再扩至近亲→远亲→
        非亲属——分享的平等程度随亲缘距离递减。非亲属成员获得分享的份额和
        频率系统性低于亲属,且非亲属间的食物转移更多呈现"这次我给你、下次你
        还我"的互惠(贡献追踪),而非亲属间的无条件平等分享。亲缘梯度→分享标准
        位移在民族志中被反复记录。
      independent_kinship_evidence: |
        谱系重建(genealogical reconstruction)独立测成员间 r,分享行为由觅食
        回报的观察独立记录→亲缘度与分配标准可分离测。
      confidence: "moderate(方向匹配;觅食民族志数据丰富但非量化连续变量)"

    - anchor: "家族企业→职业经理人转型中的薪酬标准位移"
      evidence: |
        家族企业在亲属雇员阶段,薪酬常按平等(兄弟同酬)或需要(谁家负担重多发)
        分配,绩效差异被容忍;引入非亲属职业经理人后,薪酬标准必位移到按绩效
        (KPI/股权激励)——即使同一岗位、同一资源性质(货币薪酬)。非亲属经理
        对"同工同酬、不同工不同酬"的敏感度远高于亲属——不是"非亲属更计较",
        而是"无利他缓冲→必须追踪贡献否则留不住人"。
      independent_kinship_evidence: |
        亲属/非亲属身份由雇佣记录+谱系独立判定,薪酬标准由薪酬结构(固定vs浮动
        占比)独立测,二者不互推。
      confidence: "moderate(方向清晰、机制可观测;单锚偏现代市场情境,需跨文化复现)"

  counterexamples:
    - candidate: "宗教公社的长期平等(Hutterites / Amish / 早期基督教公社)"
      analysis: |
        部分宗教公社以非亲缘成员维持数百年平等分配。须逐项检:
        (1) 拟制亲缘:"主内弟兄姐妹"的拟血缘称谓与仪式在场→可能将非亲关系
            转化为拟制亲缘(DED-009 species A),亲缘度实非低,空格前件不成立;
        (2) 外部强制:强宗教教规+社会驱逐威胁→外部强制在场→出空格射程;
        (3) 贡献可区分性:公社内部分工若高度同质(全员务农/劳动不可分),搭便车
            不易识别→空格前件不成立。
        若某公社经独立测:r→0+无拟制亲缘+无外部强制+贡献可区分且不等+长期平等
        +未塌缩→则空格被反例填上,本条证伪。预判:多数长寿宗教公社至少满足
        (1)或(2)之一,Hutterites 兼有(1)和(2)。
      status: "pre-registered counterexample hunt;待按四项判据逐项独立验证"

  boundary_cases:
    - case: "传统村落/邻里的非亲属互助(换工/红白喜事分摊)"
      analysis: |
        传统村落中非亲属邻里间的互助常呈现"你帮我、我帮你"的平等/需要模式,
        表面像低亲缘平等反例。但这不是"分配可竞争资源"——这是 BR-L2-005 的
        互惠利他(长期重复交互→互相欠人情→等价回报期待),不是在分配一笔需要
        分的共同资源。互助的"平等"实为互惠账本的均衡期待,非本条定义的平等型
        分配标准。且村落邻里关系为长期重复交互(非匿名一次性的非亲缘),互惠机制
        (AXIOM-003)在场——与本条射程内"非亲缘群体的可竞争资源分配"不同。
        判据:看当事人对不平等的反应——若邻居帮了你三次你只回了一次,他会少帮
        而非退出村子。这是互惠纠偏,非分配公平。
      status: boundary_case

    - case: "以色列基布兹的非亲缘平等存续与转型(1910s-2000s)"
      analysis: |
        基布兹以非亲缘成员(r→0)维持严格平等分配(同酬/同餐/同宿)70-90年
        (约3-4代成员更替,远超代际周转阈值~20-30年),至1980s-2000s系统性
        转向差异化薪酬。此案例对空格预测构成双向张力:
        正方(方向支持空格):最终转向差异化薪酬→与"非亲缘平等不可持续"一致;
        反方(挑战空格):70-90年的平等存续→至少同等支持"非亲缘平等可长期维持"。
        致命混淆:转型恰与以色列宏观经济市场化(1985经济稳定计划)、基布兹债务
        危机、代际意识形态弱化等外生震荡同步→自由骑乘内生压力与外部冲击的
        因果贡献无法分离。无法判定转型主因是内生塌缩还是外生震荡。
        判据:基布兹不单独支持也不单独证伪理论——其边界状态取决于时程操作化
        (见 temporal_threshold)。若将70-90年视为"长期"成立,则基布兹对空格构成
        反例(空格预测不可持续,它持续了);若认为外生震荡是主因,则内生塌缩命题
        未被检验。归为 boundary_case 待独立因果拆解。
      status: boundary_case

  empirical_limitations: |
    诚实标注:推论声称的核心特徵之一"亲缘梯度上分配标准权重连续位移,非二分"
    ——当前三锚(狩猎采集+家族企业)全是定性方向性证据(高亲缘→多平等;低亲缘→
    多贡献),无一提供 r 与分配标准权重的定量协变数据。"连续 moderation"目前纯为
    理论推导(Hamilton's rule 的连续 r→连续利他 buffer→连续分配权重位移),经验
    base 为零。当前锚仅支持方向性(正负号),不支持连续函数形式。此缺口不推翻理论
    (理论可先于数据),但应在表述中诚实区分"已观测到的方向性效应"与"理论上推导的
    连续函数形式"。

discriminant_validity: |
  【与 DED-009 判别】同在亲缘域(共享 BR-L2-002),但被预测量不同:DED-009 管
  "组织规模天花板"(协作集超血缘可及→需拟制亲缘或制度才能维系,驱动量=血缘
  可及溢出),被预测量=组织能维系多大规模;DED-018 管"资源分配标准"(亲缘度→
  平等/需要权重 vs 贡献权重,驱动量=亲缘度),被预测量=分东西按什么规矩。同亲缘
  自变量、不同被预测量与机制——DED-009 不预测分配标准,DED-018 不预测组织规模。

  【与 DED-013 判别】两条共享 BR-L2-017 和 BR-L2-013,但驱动量正交:DED-013
  驱动量=稀缺度(人均资源/生存线);DED-018 驱动量=亲缘度(r×拟制强度)。两条
  可交叉预测:稀缺度×亲缘度形成 2×2 格:
    高稀缺+高亲缘→按需要优先(自家人先救最缺的);
    高稀缺+低亲缘→按贡献优先(外人堆里得靠本事吃饭,或塌缩);
    低稀缺+高亲缘→平等盛行(家里东西够→不用分彼此);
    低稀缺+低亲缘→按贡献(市场常态,多劳多得)。
  这是正交轴上的独立预测,双方不重叠、不循环。

  【与 BR-L2-017 的生死判】这是最危险的 brick=conclusion 重叠区。BR-L2-017 已给出
  "亲缘/共居情境→平等/需要"的关系→标准映射,扎根 Fiske 的关系模型理论(认知/
  文化分类)。本条的新增量三点:(1)归因层推进——从"关系类型被认知为 communal sharing"
  推进到"搭便车在亲缘情境被利他缓冲→平等可行;在非亲缘情境搭便车致命→贡献必然",
  即从认知分类机制推进到激励结构机制;(2)连续 moderation——从二分映射(亲缘=平等/
  交易=贡献)精化为亲缘梯度上的权重连续位移;(3)空格——"非亲缘+平等+无强制+长期"
  预测为空,BR-L2-017 不给出这一经验风险。若审查者指出(1)无法在经验上与 BR-L2-017
  的认知解释区分(等价于"同一个映射两种说法"),则本条 novelty 收窄为(2)+(3)。(2)
  是精化辅助、(3)空格是唯一可独立检验的增量经验风险——因为它断言了一个 BR-L2-017
  不排除的格不可存在。

  【防平凡化守卫】非平凡不在"亲属用平等、外人用贡献"的表层直觉(常识),而在:
  ①将归因从文化分类(Fiske/Deutsch)沉到激励结构(搭便车/利他缓冲)→解释了为
  什么——而非只是描述了是什么;②空格的可证伪经验风险——找到一个"非亲缘自发
  平等长存社群"就能推翻,且这种反例不是被砖预先排除的同义反复。

review_summary: |
  1) r1 needs_revision → r2 verified → 定论 verified
  2) 核心载重新意=归因从认知分类(Fiske)推进到激励结构(搭便车/利他缓冲)并给出可证伪空格(低亲缘+平等+无强制+长期+贡献可区分→不可持续);反例猎捕无活反例(宗教公社有外部强制/拟制亲缘,基布兹归boundary_case外生震荡混淆)
  3) 全档见 ADV-REVIEW-023。

