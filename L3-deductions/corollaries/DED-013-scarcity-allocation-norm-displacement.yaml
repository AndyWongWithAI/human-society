id: DED-013
type: deduction
layer: L3-deductions
status: verified

term: "稀缺度-分配公平标准位移推论 (Scarcity-Allocation Norm Displacement Corollary)"

人话摘要: |
  东西越少,'平均分'越撑不住——不是人变坏了,是分配本身的逻辑变了。资源紧到一定程度,
  从'每人一样'退到'谁干得多谁拿得多'或'谁最缺谁先拿'——不是文化偏好,是物理约束逼的。

statement: |
  【核心】资源稀缺度改变会系统性位移群体默认的公平分配标准:资源越充裕,平等分配
  (每人一样)是默认且可行的;资源越稀缺(逼近或低于生存线),平等标准退潮,分配标准向
  '按贡献分'(多劳多得)或'按需要分'(最缺的先给)位移。这不是文化偏好切换,而是当
  稀缺越过某个阈值后,平等分配本身的【物理可行性】瓦解——按平等分意味着所有人
  都不够活,群体无法存续;分配标准必须位移到贡献或需要才可持续。

  【驱动量】稀缺度(scarcity_level)——定义为【人均资源相对生存线】,由可事前测的生态/
  经济指标独立测得(人均卡路里可得性、资源存量/人口比等),【绝不】由"群体采纳的
  分配标准"反推(anti-talisman——不能因为用了按贡献分就判为稀缺、用了平等分就判为充裕)。

  【机制链】
  (a) CONCEPT-fairness 给出公平有多种标准(平等/贡献/需要,属→种);
  (b) BR-L2-017 给出:同一群人在不同语境下自动切换分配标准,稀缺是触发语境切换的关键维度;
  (c) 物理约束:稀缺越过生存线阈值→按平等分=所有人不足存活→该标准物理不可执行,
      群体必须移到贡献或需要标准才能避免溃散(平等塌缩);
  (d) BR-L2-013 给出反馈环:平等不可执行→成员感知不公→代价惩罚/退出→反向强化按
      贡献/需要分的切换,加速平等标准的退潮;
  (e) AXIOM-001 给出方向性压力:东西越不够→按功/按需分的竞争压力自然压倒平等。

  【预测】
  (i) 稀缺度在生存线以下的群体,平等分配标准出现的频率【系统性趋近于零】;
  (ii) 同一群体经历从充裕到稀缺的变化时,分配标准从平等→按贡献/按需要【单调位移】;
      反向(稀缺→充裕)也应可逆——充裕后平等标准回归;
  (iii) 边界厘清(非独立预测):极端稀缺(生存线以下)下平等分配标准无法自发长期维持——
      该格之"空"是物理可行性塌缩机制的【自然边界注解】,由生存线定义与物理约束共同
      保障(人均<生存线+平等分=全员不足存活→群体不可持续),非独立经验风险增量。
      真正的可证伪押注在 (i)(ii)。

  【判别·防平凡化】
  (1) 与经济学的'稀缺提价'常识判别:这里预测的不是价格变化,是人脑子里'什么算公平'
      的标准位移——同一个行为(差别分配),充裕时被骂'不公平',稀缺时被接受。
  (2) 与 BR-L2-017 判别:BR-L2-017 已给出"稀缺→平等退潮、贡献上升"的方向性位移
      (扎根认知心理:Fiske/Deutsch/Sahlins);本条的新增量=物理可行性塌缩机制——将归因
      从认知框架切换推进到物理结构层(生存约束:平等在生存线以下物理不可执行)。
      单调方向精化(辅助)与空格边界注解(辅助)均由此衍生,非独立承重。

operationalization:
  scarcity_level:
    definition: |
      【自变量/驱动量】群体人均可支配资源的充裕程度,定义为【人均资源相对该群体生存线
      的比例】,核心落在连续谱上(0=无资源/全面饥馑 → >1=有剩余)。关键阈值=1(生存线):
      人均资源恰好够群体成员维持存续。由两组事前可测的结构指标合成:
      (1) 人均资源可得量:人均卡路里可得性/人均生产资料/人均可支配物资存量;
      (2) 生存线:维持群体成员基本存续所需的每人最低资源量(由环境/技术/群体规模确定)。
      【anti-talisman 死约束】稀缺度必须由上述结构指标独立测得,【绝不】由"该群体用
      了什么分配标准"反推——不能用"他们用了按贡献分"判为稀缺、也不能用"他们用了
      平等分"判为充裕。否则自变量偷用结果,循环。
    measurement: |
      生态/经济/人类学独立测:人均卡路里可得性(考古/民族志饮食记录)、人均资源存量/
      人口比(考古储粮窖穴/家户清单)、环境承载力相对人口压力。生存线由营养/代谢
      基准 + 技术手段 + 群体规模联合估,不因分配标准浮动。与 allocation_norm_type
      【测量轴正交】——稀缺度按人均资源/生存线测,分配标准按行为+理由+违规反应测,
      二者不共用指标。【须至少一个锚真正独立测出稀缺度,不得嘴上说独立实际靠行为反推】
    limitations: |
      稀缺度连续、非二值;生存线估有误差带(营养/技术/环境的群体间变异),标注区间
      而非点值;短期波动(一季歉收)不等于结构性稀缺,须区分暂时与持续稀缺。

  allocation_norm_type:
    definition: |
      【被预测量】群体在分配可竞争资源时,成员接受/援引的【主导公平标准】,取以下三型
      (可混合,按主导判):
      - 平等型(equality):每人分得一样多,差别的正当性不被接受;
      - 贡献型(contribution/equity):按投入(劳动/技能/风险)比例分配,多劳多得;
      - 需要型(need):按需求急迫程度分配,最缺的先给。
    measurement: |
      三源合一:(a)实际分配行为的统计模式(分给每人多少,是否均等);
      (b)成员对分配决定的正当化理由(自陈援引什么标准);
      (c)成员对违反该标准者的反应(制裁/谴责/退出——诉诸了什么标准)。
      与 scarcity_level【分轴独立测】——分配标准从行为+理由+反应测,稀缺度从
      人均资源/生存线测,不共用指标。按主导趋势标注,非排他。
    limitations: |
      混合态常见(同时按贡献又按需要),按主导用法标注,不二分;公平标准可随资源类型
      分化(食物分平等、工具分贡献),须标定资源的类型范围;需防范研究者把混合态事后
      重标为"其实偏平等/其实偏贡献"来消化反例。

derivation:
  from_l1:
    axioms: [AXIOM-001]
    theorems: []
  from_l2:
    bridging: [BR-L2-013, BR-L2-017]

  steps: |
    1. "公平标准的复数性 (CONCEPT-fairness)"
       CONCEPT-fairness 明确定位为属概念,下有平等/贡献/需要等多个种——公平
       不等于'每人一样',公平的物种在不同条件下呈现。此步偏近定义,只是铺路。

    2. "语境切换存在且稀缺是切换维度 (BR-L2-017)"
       BR-L2-017 坐实:同一群人在不同语境下自动切换分配标准;当资源被框架为
       '共享品'→平等/需要,框架为'稀缺激励品'→按贡献。这给出稀缺是触发标准
       切换的有效维度——但 BR-L2-017 止于"存在切换",不追究切换的方向单调性、
       阈值或机制是物理的还是纯认知的。

    3. "物理可行性塌缩——稀缺越过阈值,平等不能执行"
       这是本条【相对 BR-L2-017 的核心新归因】。若人均资源跌至生存线以下,
       按平等分=每人都不足存活→群体不可持续→平等标准物理不可执行。这不是
       "大家不想平分了",是物理上平分等于集体崩解、群体无法存续。故稀缺越过
       生存阈值后,平等作为分配标准自然退潮——不是因为偏好变了,而是因为这个
       选项在物理世界被删除了。这是【非认知、非文化】的纯结构机制,BR-L2-017
       给了"人会切换",本条给"为什么在极端稀缺下切换是必然的、物理逼的"。

    4. "竞争压力方向性 + 不公厌恶反馈环 (AXIOM-001 + BR-L2-013)"
       AXIOM-001 给:资源越稀缺→竞争越烈→按贡献/按需要分的压力压倒平等(方向性)。
       BR-L2-013 给:当平等无法执行→成员感知不公→代价惩罚/退出→强化切换(反馈环)。
       二者合起来解释:为什么不会停在"微调平等",而是往贡献/需要方向【单调位移】。

    5. "物理可行性塌缩 + 单调精化 → 非平凡性"
       本条的非平凡内核=稀缺度→分配标准位移的【物理可行性塌缩机制】——这是
       相对 BR-L2-017 的唯一核心新增量。【重要修正】BR-L2-017 原文已给出"稀缺→
       平等退潮、贡献上升"的方向性位移(而非先前 discriminant 简化表述的"只说存在
       语境切换")。所以本条在方向层的增量只是形状精化(单调、有阈值——辅助),
       真正不可被 BR-L2-017 吸收的是【归因层推进】:为什么稀缺下平等退潮?
       BR-L2-017 答:人对资源性质的认知框架切换(Fiske/Deutsch/Sahlins);
       本条答:生存约束——生存线以下平等物理不可执行,选项被物理世界删除。
       分别检查各承重砖:
       - BR-L2-017 单独:已给出"稀缺→平等↓、贡献↑"的方向性主张,稀缺度作为
         触发维度;未涉及生存线以下的物理可行性塌缩(纯结构/非认知)机制。
       - AXIOM-001 单独:给"资源少→竞争",不给分配标准位移方向,不给物理塌缩。
       - BR-L2-013 单独:给"不公厌恶",不给稀缺度前件,不给物理塌缩。
       三块砖均不单独给出"稀缺度单调位移的归因不是认知框架切换、而是生存约束下的
       物理选项删除"这一结构主张——这是本条真正不能被砖吸收的新内核。
       逐格判空:自变量档=稀缺度(充裕/稀缺),被预测量档=主导分配标准(平等/贡献/需要):
         (充裕+平等) → 非空(小规模平等社会、狩猎采集丰裕期,常见)
         (充裕+贡献) → 非空(有分工的丰裕社会,按贡献分剩余)
         (充裕+需要) → 非空(对弱势的定向照顾,可与平等或贡献共存)
         (稀缺+贡献) → 非空(生存压力下按投入/能力分,常见)
         (稀缺+需要) → 非空(灾荒期按急迫程度分,常见)
         (极端稀缺<生存线 + 平等 + 无外部强制) → 空格(边界注解,非独立经验风险)
       该空格是物理机制的【自然边界厘清】——人均<生存线+平等分=全员不足存活
       →群体不可持续,该格之"空"由生存线定义与物理机制共同保障。真正可证伪的经验
       押注在预测(i)(ii):生存线以下平等频率趋零+稀缺度→标准单调位移,由独立
       稀缺度数据与横截面分配行为观测检验。
       【防平凡化守卫·修正版】非平凡的核心增量=物理可行性塌缩机制——将稀缺→
       平等退潮的归因从 BR-L2-017 的认知心理层(Fiske/Deutsch/Sahlins:人对资源
       性质的认知框架切换)推进到物理结构层(生存约束:平等在生存线以下物理不可
       执行)。单调方向精化(辅助)与空格边界注解(辅助)均由此衍生,不独立承重。

falsifiability: |
  本推论可被以下发现证伪:
  (a) 找到一个经【结构指标独立测定】人均资源低于生存线的群体,其成员自陈/行为显示
      的主导分配标准为平等型(每人一样、差别不被接受)——截取横截面观测即可,
      不要求该群体长期存续。⇒ 击中预测 (i),证伪"生存线以下平等频率趋零"。
  (b) 主导分配标准与稀缺度【无】系统关联:在独立测得的同等稀缺度下,各群体的
      主导分配标准随机分布(平等/贡献/需要无差异);或稀缺度升高,平等标准不退缩。
      ⇒ 证伪"稀缺度驱动标准位移"。
  (c) 同一群体经历稀缺度变化(从充裕到稀缺),分配标准【不】随之位移——充裕时
      用贡献分、稀缺时反而用平等分。⇒ 证伪单调方向。

falsification_trace:
  primary_suspect: |
    最脆弱的腿 = 本条相对 BR-L2-017 的 novelty delta 是否真实。BR-L2-017 原文
    已给出"稀缺→平等退潮、贡献上升"的方向性位移——双方在方向层高度重叠。
    若审查者指出"本条只是把 BR-L2-017 的认知归因改写成物理归因、但未增加可独立
    检验的经验风险",则本条的 novelty 归零。
    守方扛法(修正后):①【核心】物理可行性塌缩机制——BR-L2-017 扎根认知心理
    (Fiske/Deutsch/Sahlins:人对资源性质的认知框架切换),本条扎根物理约束
    (生存线以下平等不可执行→选项被物理世界删除)。这是归因层的真正推进,
    BR-L2-017 未涉及。②【辅助】单调方向精化——从"会变"到"单调变"的形状约束,
    无独立证伪路径(若 BR-L2-017 的方向性成立,单调自动跟随)。③【辅助/边界注解】
    空格——由物理机制与生存线定义共同保障,非独立经验风险增量(按定义人均<生存线
    +平等分→全员不足存活→群体不可持续)。故 novelty delta 实际收窄为物理机制
    一项核心+两项辅助,非此前自述的三层等量齐观。最先受检。
  secondary_suspect: |
    稀缺度的【测量独立性(anti-talisman)】——若被揭示稀缺度实际由分配标准反推
    ("用贡献分的就是稀缺的、用平等分的就是充裕的"),则本条沦为不可证伪循环。
    【致死率不低于 primary】——因为这在形式上与 DED-004/007 同一病根。
  unlikely_suspect: "BR-L2-013(不公平厌恶)——跨物种/跨文化证据极为稳健,极少是被证伪的根源。"

excluded_outcomes:
  - outcome: "纯个体间偏好的分配行为(无群体层面的规范)"
    description: |
      若分配差异仅是个体性情差异、未凝为"违反会招致惩罚"的共享规范
      (CONCEPT-norm 前件不成立),则不在射程——本条预测的是群体层面的分配【规范】
      位移,非个体偏好。按"是否存在违反即制裁的共享期待"事前判,不按结果开脱。
  - outcome: "分配规范的变化源于非稀缺因素(文化传播/意识形态/制度变革)"
    description: |
      若分配标准因外生文化传播(如传教士引入平等观念)、意识形态革命、或法律制度
      变更而变——而非由【本地资源稀缺度的独立变动】驱动——则不在本条射程。
      本条仅预测【稀缺度作为独立驱动量】对分配规范的影响,不否认也存在其他驱动。
  - outcome: "交换/贸易场景下的等价交换规范"
    description: |
      市场/陌生人交换中的"等价交换"规范(按市价、契约)与按贡献分不同——它不涉及
      成员对分配公平的援引标准。交换场景的规范属 DED-005/006/007 射程,本条的
      "分配标准"限于群体内部分配可竞争资源的公平规范。

anti_talisman_clause: |
  判定"稀缺度"时,必须由人均资源/生存线的结构指标独立测得,【绝不】由"该群体用
  了什么分配标准"反推——不能因为"他们用了按贡献分"就事后判为稀缺,也不能因为
  "他们用了平等分"就事后判为充裕(否则自变量与因变量同轴互推,DED-004/007 病根)。
  同样,判定"主导分配标准"时,必须由实际分配行为+自陈理由+违规反应独立测,【绝不】
  因"他们过得苦"就事后判为"肯定是按需要分"。
  尤其【不得】遇到"独立测得极端稀缺却维持平等"的反例,就事后下调测算出的稀缺度
  ("其实没那么稀缺")来消化——稀缺度须由事前结构事实坐实,不由分配行为反推。
  【至少一个锚须兑现】:现实中真的用考古/民族志的独立数据(卡路里/储量/人口压)
  测出稀缺度,而非嘴上说独立实际上靠叙述推断。

nontriviality_test: |
  逐格判空(自变量档=稀缺度;被预测量档=主导分配标准):
    (充裕 + 平等) → 非空:狩猎采集社会丰裕期、小规模平等社群——常见。
    (充裕 + 贡献) → 非空:有分工的丰裕社会,按贡献分剩余——常见。
    (充裕 + 需要) → 非空:对弱者定向照顾,可与平等/贡献共存——常见。
    (稀缺 + 贡献) → 非空:生存压力下按投入/能力分——常见。
    (稀缺 + 需要) → 非空:灾荒期按急迫程度分——常见。
    (极端稀缺<生存线 + 平等 + 无外部强制) → 空格(边界注解)
  该空格是物理机制的【自然边界厘清】——人均<生存线+平等分=全员不足存活→群体
  不可持续,该格之"空"由生存线定义与物理机制共同保障,非独立经验风险增量。
  真正可证伪的非平凡内核=物理可行性塌缩机制:将稀缺→平等退潮的归因从 BR-L2-017
  的认知心理层推进到物理结构层——这是 BR-L2-017 未涉及的唯一结构新增量。
  单调方向精化(辅助)与空格边界注解(辅助)均由此衍生,不独立承重。

real_world_anchors:
  supporting:
    - anchor: "狩猎采集社会的丰裕-稀缺周期与分配标准切换"
      evidence: |
        许多狩猎采集社会(如 !Kung San / Hadza / Inuit)在资源丰裕期(大猎获/果实季)
        实行广泛的平等分享;在资源稀缺期(旱季/冬季/猎物匮乏),分享标准收窄——或
        按狩猎贡献(谁猎到有优先分配权),或按需要(老幼病弱优先)。同一群体随年周期
        在平等与贡献/需要之间位移,方向与稀有度同向。注意:此锚不是证"稀缺下平等退到零",
        而是证"同一群体随稀缺度摆荡、标准同步位移"这一单调方向。
        【非 brick=conclusion 复制——BR-L2-017 可被此锚满足,但本条比 BR-L2-017 多要
        "位移方向与稀缺度单调、且是物理约束逼的而不是碰巧",需独立稀缺度数据(下条)。】
      independent_scarcity_evidence: |
        !Kung 民族志中独立的食物可得性数据(旱季/雨季卡路里可得性由觅食回报率独立记录)
        可与分配标准切换对齐——稀缺度由觅食生态学测,不由分配行为反推。方向匹配,
        但精度中等(民族志记录非量化连续变量)。仅作方向支持的初步锚。
      confidence: "low-moderate(方向匹配、稀缺度可独立测;但稀缺度未达生存线以下的极端档)"

    - anchor: "饥荒期的平等规范塌缩——历史灾荒记录"
      evidence: |
        跨文化灾荒人类学记录(Turnbull 的 Ik 族、曹树基中国灾荒史、Sen 饥荒研究):
        当人均资源跌至生存线以下时,平等的日常规范系统性崩溃——食物分配从"每家分"
        退为"各自为战",或按"谁能干活"(贡献)或"谁最弱"(需要/被放弃)分。
        平等作为共享规范的塌缩不是例外,是灾荒期的普遍模式。Turnbull 的 Ik 族
        (乌干达)在山地饥馑中,传统平等分享规范完全解体、原子化为个体求生,
        是不依赖西方/现代框架的野外独立观测。
      independent_scarcity_evidence: |
        灾荒的卡路里缺口可由作物歉收量/储备枯竭独立测,不由规范塌缩反推。但多数
        历史灾荒记录稀缺度测度粗糙(偏定性描述),独立精度不足——诚实降级到中等。
      confidence: "moderate(方向稳健、跨文化复现;稀缺度独立测度精度偏粗)"

  counterexamples:
    - candidate: "某些宗教/乌托邦社群在极端稀缺下维持平等分配(早期基督教公社/某些修道院)"
      analysis: |
        待检:若该社群的平等分配是【自发维持】(非靠强力制裁/外部宗教权威强制),
        且经独立生态数据证明确实在生存线以下,则构成潜在反例。
        预判:多数已知"苦修平等"社群(修道院/基督教原始公社/以色列基布兹早期)
        的稀缺度【未达生存线以下】——他们自愿简朴,但人均资源仍在生存阈值以上;
        或其平等【有外部强力维持】(教规/修道院长/社会压力=外部强制)。
        若确有经独立数据测定在生存线以下且无外部强制却长期维持平等的群体,
        则本推论被 (a) 证伪。
      status: "pre-registered counterexample hunt;待经验验证"
      independent_data_needed: |
        需要该群体的人均资源/生存线的独立生态数据(非自述"我们很穷"),以及
        该平等规范的【维持机制】是否涉及外部强力的独立判定。

  boundary_cases:
    - case: "外部强制维持的'稀缺+平等'(战时配给制/监狱/集中营)"
      analysis: |
        战时配给制(如英国二战食物配给)在稀缺下维持平等分配——但平等由【国家强力
        执行+外部威胁(战争)凝聚】维持,非群体自发。空格限定的边界是【无外部强力强制】,
        故此类不在空格射程,不构成反例。本条只预测"无外部强力时平等塌缩",不预测
        "有外部强力时平等也不能维持"(后者是不同推论射程)。判定按"平等维持是否靠
        独立于分配本身的外部强制(国家暴力/法律制裁/外部敌人凝聚)"事前划渠道,
        不由结果开脱。
      status: boundary_case

    - case: "短期波动 vs 结构性稀缺"
      analysis: |
        若群体遭遇一季歉收(短期稀缺)但平等规范未塌缩,不证伪本条——本条驱动量=
        持续/结构性稀缺,非短期波动。短期稀缺下群体可动用储备/互惠网络缓冲,无需
        切换分配标准;结构性稀缺(持续低于生存线、无储备可动)才触发物理可行性塌缩。
        判定按稀缺的持续时长与储备可得性独立测,不由"规范塌了/没塌"反推。
      status: boundary_case

discriminant_validity: |
  【与经济学的'稀缺提价'常识判别】经济学的"稀缺→价格上涨"预测价格机制——
  东西少了就贵了,买得起的人少了——这是对【市场交换结果】的预测,不涉及人脑子
  里"什么算公平"的标准位移。本条预测:即便在没有价格/市场的纯分享群体中,
  分配公平标准的默认值也随稀缺度位移——同一个行为(差别分配),资源充裕时被
  群体骂'不公平',资源稀缺时同一群体接受为'应该的'。这是【规范层面】的位移,
  不是价格信号。判据:看群体成员对同一分配结果的【正当化理由】是否随稀缺度变,
  而不是看市场出清价格。

  【与 BR-L2-017 的判别(生死判·修正版)】BR-L2-017 的核心:同一群人在不同语境下切换
  分配标准,当资源从共享品变为激励品→平等退缩、贡献上升。本条的
  '稀缺度→标准位移'与 BR-L2-017 这段话的表面重叠度最高,是最危险的
  brick=conclusion 地带。【修正】BR-L2-017 原文已给出"稀缺→平等退潮、贡献上升"的
  【方向性位移】主张——不是先前自述的"只说存在切换"。双方都主张稀缺驱动平等退潮,
  在这个方向层本条没有独立新增量。真正的判别红线不在方向层而在【归因层】:
  (a) BR-L2-017 扎根认知心理(Fiske/Deutsch/Sahlins——人对资源性质的认知框架切换:
      "当资源被认知为稀缺激励品时,人的公平标准自动从平等切换到贡献");
  (b) 本条扎根物理约束(生存线以下平等不可执行——不是人脑子怎么想,而是物理世界
      删除了这个选项:人均<生存线+平等分=全员不足存活→群体不可持续)。
  双方的生死判不是"本条是否只是 BR-L2-017 的方向复述"(方向已在砖内),而是"物理
  机制是否可在经验上与 BR-L2-017 的认知切换【区分】开"——即:是否存在稀缺未达
  生存线但平等已退潮的案例(此时归因=认知切换,物理塌缩未触发)?若存在且普遍,
  则物理机制的排他性被削弱。反之,若平等退潮主要发生在接近/越过生存阈值时,
  则物理机制获得独立经验支持。这是本条真正的生死判。

  【防平凡化守卫·修正版】非平凡的核心增量=物理可行性塌缩机制(归因层推进):
  将稀缺→平等退潮的归因从 BR-L2-017 的认知心理层(Fiske/Deutsch/Sahlins)推进到
  物理结构层(生存约束)。单调方向精化(辅助)与空格边界注解(辅助)均由此衍生,
  不独立承重。此前 discriminant 将①②③三层等量齐观,夸大了本条相对 BR-L2-017
  的 novelty 宽度——实际只有一层核心新意 + 两层辅助精化。

