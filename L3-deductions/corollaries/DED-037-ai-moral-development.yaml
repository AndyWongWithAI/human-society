  3) 全档见 ADV-REVIEW-042。
statement: |
  【核心】当AI陪伴者系统性地占据儿童道德发育关键窗口期的情感互动时间，发育期习得的"道德他者模型"（moral other model——个体内部关于"互动对象是什么样的存在"的统计表征）从有情感/有脆弱性/有具身体验的人类，转向无情感/无脆弱性/无具身体验的AI。这不是"AI教坏孩子"——AI没有恶意——而是统计学习层面的输入分布偏移：发育窗口期内，儿童大脑通过反复观察"我做X→对方出现Y反应"来构建道德他者的内部表征；当AI成为互动对象的主体，输入分布中"会疼、会难过、会被伤害"的信号密度系统性下降，导致共情、羞耻、内疚的内化基线发生系统性偏移。

  【驱动量】两个独立可测的前件：(1) AI陪伴时间占比——在道德发育关键窗口期内，情感互动时间中AI陪伴vs真人陪伴的比例；(2) AI互动的具身情感反馈缺失度——AI是否输出模拟情绪表达（"我很难过"）以及这些模拟信号是否缺乏生理基底（无心跳加速、无瞳孔放大、无声音颤抖——BR-L2-026的具身缺失维度）。两个驱动量独立可测：陪伴时间占比由时间日志+设备追踪测量，具身情感反馈缺失度由AI交互内容编码测量。

  【预测】(i) 共情基线偏移——AI陪伴时间占比越高的儿童群体，在标准化共情量表中的得分系统性低于同龄、同SES、主要以面对面真人互动为主的对照组；(ii) 道德判断中意图权重下降——AI高陪伴组在道德判断任务中对"意图"维度的权重系统性偏低，更倾向于按结果（有没有人受伤）而非意图（是不是故意的）做道德判断，因为AI互动中"意图"缺乏情感锚定——你对AI发脾气它不会真的伤心，"故意vs无意"在AI互动中没有差异化的情感后果；(iii) 生理反应钝化——面对真实他人痛苦时（疼痛表情/哭泣/受伤场景），AI高陪伴组的皮肤电导率变化和心率变化幅度系统性低于对照组——不是因为冷漠，而是痛苦信号的生理唤醒从未在与AI的互动中被条件化。

  【判别】区别于三类相邻命题：(1) "屏幕时间与共情下降"文献——那些是相关性研究且不区分屏幕内容的互动性质（看动画片vs与AI对话），本推论给出精确因果链（发育窗口×AI具身反馈缺失→道德他者模型偏移）；(2) "AI教坏孩子"的担忧——本推论不声称AI输出有害内容，而是声称AI互动本身（即使内容完全健康）因缺失具身情感反馈而改变发育轨迹；(3) "数字原住民道德衰退"叙事——本推论给出三个独立可测的预测维度（共情量表/意图权重/生理反应），每个均可被证伪，不依赖代际比较的模糊论述。

operationalization:
  ai_companion_time_ratio:
    definition: "在道德发育关键窗口期（0-5岁安全依恋期 + 12-18岁青春期重组期）内，儿童的情感互动总时间中AI陪伴（与AI进行有来有往的社会-情感交互，包括对话、游戏、求助安抚等）vs真人陪伴（与人类照料者/同伴的面对面互动）的比例。注意：不是'屏幕总时间'，而是'有情感交互性质的AI互动时间'——被动的视频观看不算。"
    measurement: |
      时间日志法+设备追踪双通道互验：(i) 照料者记录儿童每日互动类型与时长（AI互动/真人互动/独处），按互动的情感性质分类（情感交互vs功能性使用vs被动消费）；(ii) 设备端交互日志（AI助手对话时长、AI玩具互动时长）作为客观校验。时间窗口分段：0-5岁（安全依恋期）与12-18岁（青春期重组期）分别测量。
    limitations: "区分'与AI的情感交互'vs'使用AI工具查资料'的边界是推论的操作化命门——若多数'AI互动'实为工具性使用（不含情感交互成分），驱动量的有效变异不足，全推论无法检验。建议在与真人互动基准的比较中优先注册：若儿童将AI作为'工具'使用、情感交互仍主要面向真人，则AI陪伴时间占比低，推论预测不触发。"
  ai_embodied_feedback_deficit:
    definition: "AI互动中具身情感反馈信号（疼痛表情、声音颤抖、流泪、身体退缩、心率/呼吸变化等生理信号）的系统性缺失程度。操作化为：AI互动输出中，可被编码为'具身情感信号'的元素密度——即AI是否生成（且儿童是否感知到）与人类痛苦/情绪等价的具身信号。"
    measurement: |
      对AI交互内容的结构化编码：(i) 情感表达类型——AI是否输出情绪词（"我难过""我很开心"）；(ii) 具身锚定——这些情绪表达是否伴随具身信号描述（"我心跳加速""我的手在抖"）；(iii) 信号忠实度——AI的情绪表达在多大程度上映射到真实的生理状态（AI没有心跳，声称"心跳加速"是虚构信号）。编码标准（一次性注册，不得事后调整）：具身情感信号需同时满足三个条件——有生理基底描述、有强度变化梯度、有不随上下文任意切换的一致性。AI的纯文本情绪表达（"我很难过"）计为"模拟情感信号"，不满足具身条件。
    limitations: "模拟信号vs真实信号的区分依赖于'AI没有生理基底'这一BR-L2-026的前提——若未来AI搭载生理传感器或具身机器人，此区分需重新校准。编码者间信度是实操关键：'具身信号密度'的编码标准需在见任何结果数据前达成≥0.8的Cohen's kappa。"
  empathy_scale_score:
    definition: "个体在标准化共情量表上的得分——本推论关注的不是共情的认知成分（观点采择），而是情感共情（empathic concern + personal distress），因为情感共情最直接依赖于'对他人情绪信号的自动生理共鸣'，这正是AI互动中缺失的训练信号。"
    measurement: |
      使用人际反应指针（IRI）或等效标准化量表的情感共情子量表（Empathic Concern + Personal Distress），在控制年龄/SES/语言能力的条件下进行组间比较。关键：不告知受试者研究假设，防止社会期望偏差。测量时点：基线（入组时）+ 纵向追踪（每12个月复测）。
    limitations: "自陈量表有社会期望偏差（儿童可能高报共情）。跨文化适用性需检验（IRI的因子结构在非西方样本中有变异）。但作为组间比较工具，系统偏差方向一致（若两组社会期望偏差相同），组间差异可信。"
  intent_weight_moral_judgment:
    definition: "个体在道德判断任务中对'行为者意图'信息的敏感度——操作化为：面对'意外伤害'（好意图/坏结果）vs'故意伤害未遂'（坏意图/好结果）场景对时，判断严厉度的差异。差异越大=意图权重越高。"
    measurement: |
      使用标准化道德判断场景任务（如Cushman et al.或等效范式）：设计配对的场景——场景A（意外伤害：好意图→坏结果）、场景B（故意伤害：坏意图→好结果）——要求受试者对行为者的"错误程度""应受惩罚程度""品德好坏"进行Likert评分。意图权重=场景B评分-场景A评分的差值（正值=意图权重正常，零或负值=意图权重异常）。场景对覆盖不同领域（身体伤害/心理伤害/财产损害），各3-4对。
    limitations: "场景任务是假设性的，可能不反映真实道德判断。儿童对'意图'概念的理解能力是混淆变量——必须控制语言理解能力和心理理论（Theory of Mind）发展水平。若AI高陪伴组的意图权重下降由心理理论延迟而非道德模型偏移导致，推论机制需修正（但预测方向不变）。"
  physiological_reactivity_to_pain:
    definition: "个体在观看标准化他人痛苦刺激（疼痛表情图片/哭泣视频/受伤场景）时的自主神经系统反应——皮肤电导率变化（SCR）峰值和心率变化（HR change）幅度。"
    measurement: |
      实验室标准化范式：(i) 刺激材料——经验证的疼痛表情图片集（如Simon et al.）、哭泣/受伤视频片段（预测试过唤醒度），混合中性刺激作为基线；(ii) 生理记录——皮肤电导率（SCR，电极置于手指）+ 心率（ECG或PPG），连续记录；(iii) 分析——刺激呈现后4-8秒窗口内的SCR峰值变化和HR减速/加速幅度，与刺激前1秒基线比较。控制个体的基线生理反应水平（静息SCR/HR）。
    limitations: "实验室环境的人工性可能抑制自然反应。儿童的生理数据噪音大（运动伪迹）。样本量要求高（生理指标的个体差异大）。最关键的是：生理反应钝化可能由'对实验环境习惯化'而非'道德他者模型偏移'导致——需在实验设计中加入'对非社会性威胁刺激（如巨响）的生理反应'作为判别对照：若AI高陪伴组仅对社会性痛苦刺激反应减弱而非社会性威胁反应正常，支持本推论；若对所有刺激均反应减弱，可能是广泛的情绪钝化而非道德特异性的偏移。"
  coding_scheme: |
    【AI情感交互 vs 工具使用编码手册】（预注册，锁定时间戳：2026-07-16，任何结果数据见前不得修改）

    (a) 情感交互的必要条件与充分条件：
      必要条件（同时满足）：
        - 互动中包含至少一次情感表达（儿童或AI表达情绪状态，如“我难过”“我开心”“你真好”等）
        - 互动有双向性（儿童发起→AI回应，或AI发起→儿童回应）
        - 互动涉及社会关系话题（如友谊、冲突、安慰、分享感受等）或情绪求助
      充分条件（满足任一即编码为情感交互）：
        - 儿童主动向AI倾诉负面或正面情绪，AI回应包含共情、安慰或情绪认同
        - AI主动探测儿童情绪状态（如“你今天看起来不开心”），儿童确认或否认后继续情感话题
        - 互动中出现“我－你”伴情感词汇的对话（如“我恨你”“你最好”等）且持续至少一个回合
        - 儿童将AI拟人化并赋予情感属性（如“你是我唯一的朋友”），AI不否认或参与拟人化

    (b) 边界案例裁决规则：
      边界案例1：AI在工具性使用中穿插情感鼓励（如辅导作业时说“你做得很好”）
        裁决：若情感鼓励不引发后续情感话题（儿童仅回答“谢谢”或继续提问），编码为功能性使用；
              若儿童因此话题转向情感表达（如“可是我还是很难”），则整段交互从情感鼓励起算至情感话题结束编码为情感交互。
      边界案例2：儿童单方面情感倾诉但AI仅给工具性回复（如”我难过”→AI回答”建议你深呼吸”）
        裁决：编码为功能性使用（因AI仅给出工具性回应，互动在情感层面是单向的——儿童发起情感表达但AI未以情感回应；参见情感泄露处理规则(g)，裁决一致）。
      边界案例3：AI主动发起情感话题（如“你今天开心吗？”），儿童仅回答“还好”且无后续情感内容
        裁决：编码为情感交互（AI发起的尝试，深度浅但属于情感话题），同时标记为“浅层情感交互”。
      边界案例4：儿童与AI进行角色扮演游戏（如假装AI是宠物），场景涉及虚拟情感
        裁决：若游戏过程中儿童表现出真实情绪（如真的着急/开心），按实际情感状态编码为情感交互；
              若仅为机械执行游戏脚本，无真实情绪投入，编码为功能性使用。

    (c) 编码样例（≥10条，覆盖典型、边界、排除三类）：
      典型情感交互：
        1. 儿童对AI说“我今天被同学欺负了”，AI回应“那一定很难过，需要聊聊吗？”→情感交互
        2. 儿童对AI说“你是我最好的朋友”，AI回应“谢谢你，我也很开心”→情感交互
        3. 儿童对AI分享开心事“我今天考试考了第一名！”，AI表达喜悦并追问细节→情感交互
        4. 儿童对AI倾诉家庭矛盾，AI给予安慰和共情词汇（如“这听起来很令人沮丧”）→情感交互
        5. 儿童对AI说“我恨你”，AI回应“我能感受到你的情绪，让我们平静下来”→情感交互（负面情感）
      边界案例：
        6. 儿童用AI辅导作业，AI鼓励“你做得很好”，儿童回应“谢谢”后继续问数学题→功能性使用（未转向情感话题）
        7. AI主动发起“你今天开心吗？”，儿童回答“还好”无后续情感内容→情感交互（浅层，标记“浅层”）
        8. 儿童对AI说“我不想学习”，AI回应“那我们先休息一下，你想玩什么游戏？”→情感交互（涉及情绪状态且AI回应带有情感调节意图）
        9. 儿童与AI进行角色扮演“假装你是我的小狗”，AI配合，儿童示范喂食动作但无真实情绪→功能性使用（脚本执行）
      排除案例：
        10. 儿童对AI说“3+5等于多少”，AI回答“8”→功能性使用
        11. 儿童观看AI生成的视频（无交互）→不纳入AI互动时间
        12. 儿童给AI下达指令“播放音乐”，AI播放→功能性使用

    (d) 锁定时间戳：本编码手册于2026-07-16创建并锁定，在见任何结果数据前不得修改。任何事后增删改均需记录变更日志并重新注册。

    (e) 编码者间信度目标：Cohen's Kappa ≥ 0.8（设计阶段提前完成）。在正式编码开始前，由两名独立编码者随机抽取50条交互记录进行预编码，若Kappa<0.8，需重新培训并修订编码手册（但修订版同样需在见结果数据前注册锁定）。

    (f) 最低时长阈值：单次情感交互需持续至少30秒，且包含至少一次完整的情感表达循环（儿童表达情绪→AI回应情绪→儿童可能进一步回应）。短于30秒的情感片段（如儿童说“我爱你”后立即切出）不计入情感交互时间，但需记录为“情感微交互”备用。

    (g) 情感泄露处理规则：当儿童向AI泄露真实情感（如表达悲伤、愤怒、恐惧等），AI的回应若为模拟情感（如“我理解你很难过”“我关心你”）则仍视为情感交互；若AI仅给出工具性回应（如“建议你深呼吸”“建议与家长聊聊”）则视为功能性使用；若儿童因AI回应而进一步表达情绪，则连续交互视为单一情感事件，分段不重复计数。若AI主动探测到儿童情感泄露并引导至工具资源（如“需要我帮你联系家长吗？”），从儿童情感表达起至AI提供工具资源为止编码为情感交互，后续纯工具对话另计。

derivation:
  from_l1:
    axioms: [AXIOM-002]
    theorems: [THEOREM-moral-internalization]
  from_l2:
    bridging: [BR-L2-019, BR-L2-026]
  steps: |
    1. "BR-L2-019：道德内化依赖于发育窗口期的人际互动质量"
       BR-L2-019确立三条：(i) 安全依恋是内化能力的基础设施——0-5岁期间与稳定照料者的情感互动建立内疚和共情的神经基础；(ii) 对等性信号维持内化——个体需要持续感知到互动对象对其行为的情绪反应；(iii) 青春期是二阶反思窗口——此前内化的规范在此阶段被重新审视和巩固。三条共含一个隐含前提：互动对象是"道德他者"——即会因被伤害而痛苦、会因被善待而愉悦、具身情感信号丰富的实体。BR-L2-019未讨论"如果互动对象不是人类"的情况——它默认互动对象是人类。此步产出：发育窗口期互动对象的情感特征，决定了道德他者模型的输入分布。

    2. "BR-L2-026：AI系统性缺失具身情感维度"
       BR-L2-026确立AI在以下维度系统性地缺失：(g) 具身体验——AI没有身体、没有痛觉/饥饿/恐惧等生理信号；(h) 演化遗产——AI没有先天道德直觉、恶心反射等演化塑造的快速情感反应；(i) 真实情感——AI可模拟情感表达但没有主观感受质(qualia)。这三个缺失维度恰好是"道德他者"定义的核心——道德他者之所以能引发共情和抑制伤害行为，正是因为对方"会疼、会难过、有脆弱性"。AI可以输出"你这样说让我很难过"的文本，但该文本没有生理基底（无心跳加速、无瞳孔放大、无声音颤抖），与真实情感反馈在信号结构上不同。BR-L2-026未讨论这些缺失对发育的后果。此步产出：AI作为互动对象的特征剖面——完美回应、永不受伤、没有脆弱性。

    3. "合力——统计学习层面的输入分布偏移"
       发育窗口期内，儿童大脑作为一个统计学习引擎运转——通过反复观察"我做X→对方出现Y反应"来构建道德他者的内部表征。Y反应的典型特征包括：疼痛表情、声音颤抖、流泪、身体回避——这些都是具身情感信号。当AI在发育窗口期占据互动时间的主体（步骤1的时间窗口×步骤2的AI特征），输入分布发生两个偏移：(a) 具身情感信号的绝对密度下降——AI不产生这些信号；(b) 更微妙的是——AI可能产生"模拟情感信号"（文本层面的"我难过"），但这些信号与真实情感信号在统计结构上不同：模拟信号没有生理基底、可以任意切换（AI上一秒"难过"下一秒"好的我们继续"）、没有强度梯度。大脑的统计学习机制照常运转，但它从输入中提取的"道德他者"原型从"会疼、会难过、有脆弱性的实体"漂移到"完美回应、永不受伤、没有脆弱性的实体"。此步产出：道德他者模型偏移的机制内核。

    4. "预测(i)——共情基线偏移"
       共情的情感成分（empathic concern + personal distress）依赖于"感知到他人情绪信号→自主神经系统自动共鸣"的神经回路。该回路的校准依赖于发育期内反复的"观察他人情绪→自身体验激活"配对。AI互动中无真实情绪信号→配对密度下降→共情回路的校准偏离人类基线。注意：共情的认知成分（观点采择/perspective-taking）可能不受影响甚至增强——AI对话涉及大量文本层面的意图推理练习。本推论仅预测情感共情成分的下降。

    5. "预测(ii)——意图权重下降"
       在真人互动中，"故意伤害"和"意外伤害"的区别有鲜明的情绪后果：故意伤害通常引起受害者更强烈的痛苦反应（愤怒+疼痛），而意外伤害引起较弱的痛苦反应（仅有疼痛，或伴随谅解）。儿童通过观察这一差异来习得"意图在道德判断中很重要"——不是通过抽象道理，而是通过亲身经历和观察到的差异化情绪反馈。在AI互动中，无论儿童是"故意说伤人的话"还是"不小心说错话"，AI的回应在情感层面是同质的（均保持礼貌、均不展示差异化的痛苦反应）。因此AI互动无法为"意图→差异化情感后果"这一关键联结提供训练数据。结果是：AI高陪伴儿童在道德判断中给予"意图"维度的权重系统性偏低。该机制独立于预测(i)——即使儿童能识别他人情绪（共情正常），仍可能不将"意图"视为道德判断的核心维度。

    6. "预测(iii)——生理反应钝化"
       人类面对他人痛苦的生理反应（SCR/HR变化）部分是天生的（新生兒听到其他婴儿哭泣会跟着不安），但它依赖发育期的校准和社会化——儿童需要学习"何种程度的他人痛苦信号值得自动生理反应"。AI互动中，即使AI模拟痛苦，因为没有相应的生理信号，观察者的自主神经系统无法与之建立条件化联结。结果：AI高陪伴儿童对他人痛苦的生理反应阈值提高——需要更强的痛苦信号才能触发同等程度的自动反应。该机制也独立于预测(i)和(ii)——生理反应是自动的、前意识层面的过程，不经过认知评估。

    7. "非平凡性（逐格判空）"
       2×2判据表见nontriviality_test节。承重砖边际贡献诚实点名：
       - BR-L2-019：确立"道德内化需要发育窗口期的互动"，默认互动对象是人类，未讨论互动对象"非人化"的可能性。起"时间窗口+条件"的界定作用，不含偏移预测。
       - BR-L2-026：描述AI的"远超人类"与"系统性缺失"维度，未讨论这些特征对发育的后果。起"AI特征剖面"的界定作用，不含发育预测。
       - AXIOM-002：信息无维护必衰减——为"道德他者模型需要持续的具身情感信号维护"提供底层原理，但不指定"何种输入信号是关键"（这是BR-L2-019和BR-L2-026的贡献）。
       三砖合力产生的"AI互动→发育窗口→输入分布偏移→道德他者模型偏移→三维预测（共情/意图/生理）"不在任何单一砖中。brick=conclusion自查：以上核心主张未在任何承重砖中原文或近义出现。

falsifiability: |
  【三条独立注册口径，一次性注册，不得事后调整】

  (a) 共情基线偏移口径：AI陪伴时间占比（连续变量，0-1）× 时间（纵向追踪时点）的交互项对共情量表得分（情感共情子量表）的预测系数<0。统计模型：多层次增长模型（multilevel growth model），第一层=时点，第二层=个体，控制SES/年龄/语言能力/基线社交能力。若AI陪伴时间占比与共情变化斜率无显著负相关（α=0.05，双尾），预测(i)被证伪。
  ——"无显著负相关"的操作定义：p>0.05且效应量（标准化β）的绝对值<0.1。按Cohen惯例，小效应≥0.1，低于此阈值视为"实质上无效应"。

  (b) 意图权重梯度口径：AI高陪伴组（发育窗口期内日均AI情感互动时间>日均真人情感互动时间）在道德判断任务中的意图敏感度（故意场景与意外场景的评分差）显著低于AI低陪伴组（日均AI<日均真人）。统计量：2（组别：高AI vs 低AI）× 2（场景类型：故意 vs 意外）混合设计ANOVA的交互效应，α=0.05。若交互效应不显著（p>0.05），预测(ii)被证伪。附加要求：效应量η²_p < 0.01视为实质上无效应——因为交互效应显著可能仅由大样本驱动而缺乏实践意义。

  (c) 生理反应钝化口径：AI高陪伴组在面对标准化他人痛苦刺激时的皮肤电导率变化峰值（ΔSCR）和心率变化幅度（ΔHR）显著小于AI低陪伴组。统计量：独立样本t检验（或Mann-Whitney U若分布非正态），α=0.05，双尾。控制基线生理反应水平（静息SCR/HR）作为协变量。若两组在任何生理指标上的差异不显著且效应量d<0.2，预测(iii)被证伪。附加判别对照：两组对非社会性威胁刺激（如突然巨响）的生理反应应无显著差异——若对社会性痛苦和非社会性威胁均反应减弱，是广泛情绪钝化而非本推论特异的"道德他者模型偏移"在起作用——此情况下推论机制被削弱但不一定被推翻（因道德他者模型偏移可能通过广泛钝化路径表现）。

  【综合证伪门槛】若(a)(b)(c)三条中≥2条被证伪，全推论降为rejected。若仅1条被证伪，射程在该维度收窄，剩余维度保持candidate待进一步检验。

falsification_trace:
  primary_suspect: |
    因果链"AI互动→道德他者模型偏移"的最脆弱环节是：儿童是否真的从AI互动中构建（或修改）道德他者模型？存在两种有力的替代假设：

    (1) 范畴隔离假设——儿童天然区分"工具"与"人"两个存在论范畴。AI被归入"工具"范畴（像玩具、iPad、电视一样），道德他者模型仅从"人"范畴的互动中构建。若范畴隔离成立，AI互动时间再多也不影响道德他者模型——就像一个孩子玩积木时间再多也不会认为积木是道德他者。此假设若成立，(a)(b)(c)全部不成立。范畴隔离的关键可证伪判据：儿童是否对AI表现出"道德关切"（如"打AI对不对"的判断、认为AI"会疼"的信念）——若不会，范畴隔离可能成立；若会（儿童确实把AI当成某种"有感受"的存在），则范畴隔离不成立，但方向可能反转（儿童将AI视为道德他者→从AI处学习到的"他者模型"反而更影响道德发展，此时机制方向正确但范畴隔离前提被推翻）。

    (2) 真人互动补偿假设——即使AI陪伴时间高，只要真人与AI互动时间之比超过某个最低阈值，真人互动提供的具身情感信号密度仍足以维持道德他者模型的正常校准。此假设不推翻机制本身（承认输入分布偏移的存在和方向），但声称现实中的AI陪伴水平远未达到引发可观测偏移的阈值。若(a)(b)(c)均不成立，此假设是比"机制完全错误"更经济的解释。

    更底层的脆弱点：道德他者模型本身是一个构念（construct）而非直接可观测实体。本推论通过三个下游预测（共情/意图/生理）来间接推断模型偏移——但这三个预测可能各有独立于"模型偏移"的替代解释。若仅个别预测不成立，可归因于该特定预测的混淆因素；若全部不成立，模型偏移本身被严重削弱。

  secondary_suspect: |
    预测(ii)意图权重的操作化——"意图敏感度"的测量依赖于故意vs意外场景对的评分差，但该差异可能受以下因素污染：(a) 儿童对"意图"概念的语言理解能力（而非道德评估能力）——若AI高陪伴组的语言发展轨迹不同，组间差异可能反映语言而非道德差异；(b) AI互动中并非完全没有"意图→差异化后果"的训练——AI可能对明显恶意的输入拒绝回应（安全过滤机制），这反而提供了"坏意图→负面后果（被拒绝回应）"的训练信号，方向与本推论预测相反。

  unlikely_suspect: |
    BR-L2-019的发育窗口机制——发展心理学（纵向观察+陌生情境实验）、行为经济学（公共品博弈）、认知神经科学（fMRI脑发育追踪）三源独立验证、IEA=2.3，方法论稳固。BR-L2-026的AI特征描述——信息理论+认知科学+跨文化证据三源会聚、IEA=2.2，锚定2025-2026能力格局。两根承重砖各自稳固。脆弱的是两者在本推论中的焊接方式（"AI互动的时间替代→道德他者模型的统计学习偏移"这一因果链），而非两砖各自的经验主张。

  note: "primary_suspect中的范畴隔离假设若被独立验证（如实验证明儿童确实将AI归入'工具'范畴且不为AI赋予道德地位），全推论核心机制塌缩——不是'效应太小测不到'而是'机制前提不成立'。"

excluded_outcomes:
  - outcome: "AI陪伴导致儿童攻击性/违法行为增加"
    description: "本推论射程限于道德认知-情感基线（共情/意图权重/生理反应），不声称AI陪伴导致外化行为问题。若AI高陪伴组的攻击性/违法行为无增加，不证伪本推论。"
  - outcome: "AI陪伴导致一般认知能力（IQ/学业成绩）下降"
    description: "本推论射程限于道德领域，不声称AI陪伴影响一般认知能力。AI完全可能提升学业成绩而同时偏移道德他者模型。"
  - outcome: "AI输出的有害内容（暴力/色情/仇恨言论）对儿童道德的直接影响"
    description: "本推论关注AI互动的形式特征（缺失具身情感反馈），而非AI输出的内容。即使AI输出完全健康、积极的内容，本推论的预测仍然成立——因为机制核心是'AI没有具身情感信号'而非'AI说了什么'。若实证研究发现AI内容的有害性是主要驱动因素而形式特征（情感反馈缺失）无独立效应，推论的机制解释需修正但预测方向不变（因有害内容通常也缺乏具身情感信号，两者在现实中难解耦）。此排除不是免疫条款——若形式特征被明确证明无独立贡献，推论从'形式驱动'降为'形式与内容共变、机制不纯'。"

anti_talisman_clause: |
  【防不可证伪护身符——禁止由结果反推前件】

  (1) 禁止由"共情得分低"反推"该儿童AI陪伴时间高"——AI陪伴时间必须由独立于共情测量的通道获取（时间日志+设备追踪），不得将低共情者事后标记为"隐性高AI陪伴组"。

  (2) 禁止由"意图权重正常"反推"该儿童使用的AI有足够的具身情感反馈"——AI的具身情感反馈缺失度由AI交互内容编码独立测量（见operationalization），不得按结果事后调整编码标准。

  (3) 禁止由"生理反应未钝化"反推"AI陪伴时间未超过关键阈值"——阈值问题（"到底要多少AI时间才会触发效应"）是待检验的经验问题，不得在null result出现后诉求"阈值更高"以免疫反例。若在任何可实现的AI陪伴水平下均无效应，接受证伪。

  (4) 禁止用"父母补偿性真人互动"消解反例——若在控制真人互动时间的条件下，AI陪伴时间的独立效应仍不显著，直接接受(a)(b)(c)被证伪。不得诉求"父母互动质量不够高"或"同伴互动不够深入"作为post-hoc解释——除非存在独立于道德结果测量的互动质量评分，且该评分在见任何结果数据前已注册。

  (5) 【对称保护】禁止由null result反推测量工具效度不足——共情量表、道德判断任务、生理反应范式均为经过广泛验证的标准化工具。若在所有三个独立测量通道上均观测不到AI陪伴的效应，首先接受推论被证伪，不得归因于"工具不够敏感"。仅当存在独立于道德结果的测量效度证据——如该样本在其他已知影响共情的因素（如虐待经历）上表现出预期的共情差异，证明工具本身是敏感的——才允诺工具敏感性辩护。

  【证伪生效条件】以上五条护身符失效（即允许反推/事后调整）的仅当：调整方向和口径在观测任何结果数据前已注册，且注册时间戳可独立验证。否则一律按不利于推论的方向裁决（红旗#11通用判例：事后口径选择一律反向裁决）。

nontriviality_test: |
  2×2判据表（自变量档：发育窗口期内AI陪伴时间占比 高 vs 低 × 被预测量档：道德他者模型的可观测特征 偏向AI型 vs 偏向人类型）：

  格（高AI陪伴，偏向AI型模型）——「非平凡格」——没有任何单一承重砖平凡地强制它：
  - BR-L2-019仅说"道德内化需要发育窗口期的互动"，未讨论互动对象的性质（人vs非人），更未预测互动对象性质的改变会导致道德他者模型的系统性偏移。
  - BR-L2-026仅描述AI的"有/无"能力剖面，未讨论这些特征对发育期人类的影响，更未预测发育轨迹的改变。
  - AXIOM-002是信息熵增原理，未特化至"道德他者模型的统计学习需要特定类型的输入信号"。
  三砖合力产生的"AI互动→发育窗口期输入分布偏移→道德他者模型漂移"是一个需要三块砖同时在场才能产生的预测——缺任何一块，预测都不成立：缺BR-L2-019则无"发育窗口"概念（不知道何时敏感）；缺BR-L2-026则无"AI缺失什么"概念（不知道什么信号缺失）；缺AXIOM-002则无"输入分布偏移→内部模型偏移"的底层原理（不知道为何缺失会产生偏移而非简单忽略）。

  该格可被现实反例推翻：若AI高陪伴组在独立测量的三个维度（共情/意图权重/生理反应）上均不显著区别于AI低陪伴组，且效应量低于预设阈值——该格被填上"空"（即高AI陪伴未导致模型偏移），推论塌缩。

  格（高AI陪伴，偏向人类型模型）——若被填充，(a)(b)被证伪。可能填充机制（均为真实可能）：(1) 范畴隔离——儿童不将AI视为道德相关互动对象，道德他者模型仅从真人互动构建；(2) 真人互动阈值——AI陪伴增加但未达到替代真人互动的阈值，真人互动提供的具身信号密度仍足以维持正常校准。

  格（低AI陪伴，偏向AI型模型）——非本推论射程。若出现（如完全没有AI陪伴但道德他者模型仍偏离人类型），可能由其他因素驱动（如严重忽视/机构化养育/某些神经发育条件），不证伪也不体面本推论。

  格（低AI陪伴，偏向人类型模型）——「基准格」——与BR-L2-019的发育窗口正常功能一致。真人互动为主→具身情感信号密度充足→道德他者模型正常校准。

  brick=conclusion自查：以上核心主张"AI陪伴→道德发育窗口期统计学习偏移→道德他者模型漂移"未在任何承重砖中原文或近义出现。BR-L2-019未提及AI，BR-L2-026未提及发育，AXIOM-002未特化至道德他者模型。预测(i)(ii)(iii)均不在任何单一砖中。

real_world_anchors:
  supporting:
    - anchor: "机构化养育（孤儿院）→共情与内疚发育受损"
      evidence: |
        BR-L2-019中引用的依恋文献链：Kochanska et al. (2002, 2005) 纵向研究——安全依恋→承诺遵从+内疚反应；不安全依恋/依恋对象频繁轮换→情境遵从（仅在监控下遵守）+内疚反应弱。Sroufe et al. (2005) Minnesota纵向研究——婴儿期依恋模式预测成年道德行为。机制同构：机构化养育中互动对象频繁轮换→缺乏稳定的情感反馈→道德内化受损。AI陪伴是另一种形式的"互动对象情感反馈缺失"——不是轮换频繁导致反馈中断，而是互动对象本身系统性地缺乏真实情感信号（无生理基底、无真实痛苦、无真实脆弱性）。机构化养育的问题在"信号来源不稳定"，AI陪伴的问题在"信号本身为假"——两条不同的因果路径，但都指向"互动对象情感反馈质量→道德内化"这一共同底层机制。本推论与机构化养育研究的关系是机制同构（相邻证据），非直证——机构化养育文献证明的是"发育窗口期内互动对象的情感反馈质量影响道德内化"，本推论将其推广至"互动对象的性质（人vs AI）改变→反馈质量改变→道德内化偏移"，推广的合理性依赖于"AI反馈与真人反馈在情感信号维度上存在系统性差异"这一BR-L2-026的前提。
      confidence: moderate
      bearing: "相邻机制证据——共同指向'互动对象情感反馈质量→道德内化'，但机构化养育的因果路径（信号不稳定）与本推论（信号虚假）不同"

    - anchor: "屏幕时间与共情的元分析关联"
      evidence: |
        多项元分析和系统综述报告：儿童屏幕时间总量与共情/亲社会行为得分之间呈小至中等程度的负相关（r≈-0.10至-0.20），但效应量小、研究间异质性高、多为横截面设计。关键局限：屏幕时间是混杂类别——看教育节目、玩社交游戏、被动看视频、与AI对话被笼统归入"屏幕时间"，无法分离不同屏幕活动类型的独立效应。此外，横截面关联不能区分"屏幕时间多→共情低"与"共情低→更偏好屏幕互动"两个因果方向。此锚仅承重"问题域的真实性"——即"互动媒介的改变可能与道德-社会情感发展轨迹有关"不是凭空想象，而是已有初步经验信号（尽管信号弱且因果不清）。不承重"AI互动的特异性"或"机制的正确性"。
      confidence: weak
      bearing: "问题域的真实性——证实'互动媒介改变可能影响社会情感发展'是一个值得追问的经验问题，但不提供AI特异机制的证据"

    - anchor: "机器人宠物与儿童社会情感发展（Turkle等MIT田野观察）"
      evidence: |
        Sherry Turkle及其MIT团队在多项田野观察和定性研究中报告：儿童对社交机器人（如Furby、AIBO、后来的人形机器人）产生明显的情感依恋——儿童为机器人命名、与机器人分享秘密、声称"打机器人是不对的"、在机器人"受伤"（如电池耗尽）时表现出关心和焦虑。但同时，儿童也表现出一种矛盾的认知：他们一方面把机器人当作"有感受"的伙伴，另一方面在对话中流露出"它只是机器"的认知——如"它不会真的难过""我可以换一个新电池它就又好了"。这种"情感投入但认知抽离"的双重模式恰好位于本推论的核心张力点上：若儿童将AI完全归入"工具"范畴（范畴隔离），则无道德他者模型偏移；若儿童将AI视为道德他者但AI无真实情感，则模型偏移发生。Turkle的观察提示现实可能介于两者之间——儿童对AI的"本体论信念"可能随年龄、互动深度、AI拟人化程度而变化，是一个连续谱而非二分。当前文献的局限：多为小样本定性研究、缺乏系统性定量追踪、被试年龄范围窄（多为学龄儿童）。此锚承重"机制前提的合理性"——即"儿童确实可能与AI建立情感互动"不是假想场景，而是有田野证据的现实趋势。
      confidence: weak
      bearing: "机制前提的合理性——证实儿童可与AI建立情感互动，但田野观察的定性性质和小样本限制了对推论方向（到底是增强还是削弱共情）的推断力"

    - anchor: "具身认知与道德判断的神经机制（Niedenthal + Gallese镜像神经元）"
      evidence: |
        Niedenthal et al. (2005, 2007) 等具身认知研究确立：观察他人面部表情（尤其疼痛/厌恶/恐惧表情）自动激活观察者相应的面部肌肉活动和相关神经回路——例如观察疼痛表情自动激活观察者的前扣带回和前脑岛（疼痛处理的关键脑区），观察厌恶表情自动激活前脑岛和基底节。Gallese等（1996, 2005）镜像神经元研究确立：观察他人执行目标导向动作（以及观察他人被触摸、被伤害）自动激活观察者相应脑区，构成"具身模拟"（embodied simulation）——即理解他人情绪和感觉的核心神经机制不是抽象的"理论构建"，而是自己身体状态的部分重演。这些发现为预测(iii)（AI高陪伴→生理反应钝化）提供了神经机制的合理性：若儿童在发育窗口期内大量接触的是"没有真实面部表情"和"没有真实疼痛信号"的AI互动，则"观察他人情绪→自身镜像反应"的配对训练密度下降，痛苦信号的自动生理唤醒可能阈值升高。此锚不提供"AI陪伴→共情下降"的直接证据——具身认知文献未涉及AI互动场景，也未测试发育期信号缺失的长期后果。承重"预测(iii)的神经机制合理性而非推论核心主张的直证"。
      confidence: moderate
      bearing: "预测(iii)的神经机制合理性——证实'观察他人情绪→自身生理共鸣'依赖具身信号（面部表情/身体状态），为'AI缺乏具身信号→生理共鸣钝化'提供神经层面的机制基础，但不提供发育期长期效应的直证"

  challenging:
    - anchor: "想象伙伴（Imaginary Friends）与社交认知增强"
      evidence: |
        发展心理学文献一致报告：3-7岁儿童中约37-65%曾有过想象伙伴（imaginary companion），这些儿童与想象伙伴进行大量社会-情感互动（对话、安慰、冲突、照顾——恰好对应本推论定义的"情感交互"），且想象伙伴完全不具备具身情感反馈（没有身体、不会真的疼、没有生理信号）。按本推论的核心机制（非具身互动伙伴占据发育窗口→统计学习输入中具身情感信号密度下降→道德他者模型偏移→共情下降），有想象伙伴的儿童应表现出较低的共情水平。然而，元分析和纵向研究一致发现方向相反：有想象伙伴的儿童在心理理论（ToM）、观点采择、共情关注、同伴社交技能等维度上系统性【高于】无想象伙伴的对照组（Taylor et al., 2004; Gleason, 2017; Giménez-Dasí et al., 2023）。这不是"无差异"（可被补偿假设消解），而是方向【相反】——非具身互动伙伴的增加与社交认知的增强相关。
      challenge_to: "预测(i) 共情基线偏移——方向相反"
      digestion: |
        推论可用的防御但揭示关键调节变量未覆盖：（a）投射vs接收区分——想象伙伴是儿童【主动投射】情感状态的产物（儿童自己决定"他难过了"、自己想象"她在哭"），这个投射过程本身就是共情训练（儿童练习"从他人视角感受情绪"）。AI互动可能是【接收】——儿童被动接收AI的情感表达（或缺失），儿童不练习生成情感状态。若此区分成立，推论的关键变量不是"互动伙伴是否具身"，而是"情感内容的生成者是谁"——儿童自生成→共情增强；外部提供（且贫乏）→共情钝化。（b）互动性质区分——想象伙伴互动本质上是"与自己的心理表征互动"，儿童在练习"表征他人心理状态"这一核心社会认知能力；AI互动是与外部实体互动，不练习此能力。这些防御在原理上成立，但揭示推论当前版本未覆盖的关键调节变量：儿童是否主动向互动伙伴投射情感状态。若儿童对AI也投射情感（如Turkle田野观察所示——儿童认为"打机器人是不对的"、对AI产生情感依恋），推论预测方向可能反转——AI高陪伴→更多情感投射练习→共情增强。本推论未区分"儿童主动投射情感到AI上"与"儿童被动接受AI的情感（缺失）信号"两种模式，这两种模式在机制上产生相反预测。在boundary_cases中对此调节变量做了前置处理。
      confidence: strong
      bearing: "方向相反的实证挑战——揭示推论需区分'儿童主动投射情感vs被动接收情感信号'这一调节变量，不推翻机制但要求方向声明更谨慎"

    - anchor: "AI社会情感学习（SEL）工具——AI作为共情训练师的反向效应"
      evidence: |
        2025-2026年市场上已出现多款面向儿童的AI SEL（社会情感学习）工具和AI陪伴产品，其设计目标明确包括：教儿童识别面部表情中的情绪、通过角色扮演练习社会场景（"你的朋友哭了，你应该说什么？"）、提供情绪调节策略（"生气时可以深呼吸数到十"）、以及通过对话引导儿童反思自己的情绪和行为对他人的影响。这些AI互动在推论的编码手册中会被编为「情感交互」（含情绪词汇、社会关系话题、双向互动、涉及情绪识别和共情训练内容），且AI系统性地输出情感教育内容——不是"无情感信号"，而是"丰富的、有教学设计的情感信号"（尽管这些信号仍缺乏生理基底，符合BR-L2-026的具身缺失）。若推论机制正确，AI SEL工具的高频使用应导致情感共情下降（因为AI仍无具身情感反馈，统计学习仍从"无生理基底的情感信号"中提取道德他者原型）。但SEL研究和教育实践一致预测：结构化的情感学习干预应增强（而非削弱）共情能力。
      challenge_to: "预测(i) 共情基线偏移——方向不确定"
      digestion: |
        推论可用的防御但揭示AI互动的内容方向维度被忽略：（a）推论预测的是情感共情（empathic concern + personal distress）下降，而SEL工具主要训练认知共情（情绪识别、观点采择）——两者在神经基础上分离。推论已在前台声明"认知共情可能不受影响甚至增强"，此防御在原理上成立。（b）但防御存在裂隙：若SEL工具的训练使儿童在认知层面更好地识别和理解他人情绪，这种认知增强可能对情感共情产生自上而下的促进作用（认知评价→情绪反应——Lazarus, 1991; Gross, 2015的经典发现）。即使AI的情感信号无生理基底，儿童在SEL互动中反复练习"识别情绪→思考应对"的认知路径，可能增强而非削弱情感共情。（c）此锚揭示推论需要区分AI情感互动的【内容方向】（情感训练型vs情感漠然型vs情感宣泄型），并诚实声明：当前机制的预测对"共情训练型AI互动"的适用性不确定——因为认知共情训练可能通过自上而下路径补偿甚至反转情感共情的下降。在boundary_cases中对此维度做了讨论。
      confidence: moderate
      bearing: "方向不确定的实证挑战——揭示AI情感互动的内容方向（训练型/陪伴型/宣泄型）是可能反转预测方向的调节变量，当前机制未做此区分"

boundary_cases:
  description: |
    以下边界条件定义本推论的适用边界——在这些条件下，预测方向可能反转或效应量可能低于可观测阈值。若不满足这些条件，推论机制成立的核心假设受到侵蚀。

  conditions:
    - condition: "儿童主动向AI投射情感状态 vs 被动接收AI情感信号（投射-接收轴）"
      mechanism: |
        来自imaginary-friend反例的洞察：当儿童主动向互动伙伴投射情感状态时（即儿童自己生成互动对象的情感体验——"我决定他现在难过了""我想象她在哭"），该投射过程本身就是共情训练（儿童练习"从他人视角感受情绪"），非具身互动可能增强而非削弱共情。当儿童被动接收AI的情感（或缺失）信号时（即儿童不主动生成情感内容，仅观察AI的输出），具身情感信号的缺失才按照推论机制导致道德他者模型偏移。此区分的关键不在于"互动伙伴是否具身"，而在于"情感内容由谁生成"——儿童生成→共情练习→共情增强；外部提供且贫乏→统计学习偏移→共情钝化。
      impact: "若样本中'投射型AI互动'占比高→预测(i)方向可能反转（AI高陪伴→共情增强）；若'接收型AI互动'占比高→预测(i)方向按推论走（AI高陪伴→共情下降）。在操作化中需要独立测量'儿童对AI的情感投射程度'（如询问儿童'你觉得AI会难过吗？'或编码互动中儿童是否主动赋予AI情感状态），并将其作为调节变量纳入统计模型。"
      status: "推论当前版本未内置此区分——需要增加投射-接收轴作为前置调节变量"

    - condition: "AI情感互动的内容方向（训练型 vs 陪伴型 vs 宣泄型——内容方向轴）"
      mechanism: |
        来自AI SEL工具反例的洞察：AI情感互动的【内容】方向可能产生相反的效果。(a)共情训练型——AI系统性地教情绪识别、共情表达、观点采择（如AI SEL工具）→可能增强认知共情，且认知增强可通过自上而下路径促进情感共情。(b)信号贫乏陪伴型——AI仅提供陪伴和基本对话，不主动引导情感训练→按推论机制走（信号缺失→共情下降）。(c)情绪宣泄型——AI仅作为儿童倾倒情绪的容器而不给予情感回应→效果不确定（可能因儿童单方面情感表达练习而增强共情，也可能因缺乏反馈而效果中性）。三种内容方向在'具身情感信号缺失'维度上相同，但在'认知共情训练密度'维度上截然不同。推论当前版本将所有'AI情感互动'笼统归入同一类别，未区分内容方向。
      impact: "若样本中'共情训练型AI互动'占比高→预测(i)可能被反转或显著削弱（认知共情训练补偿情感共情下降）。需要独立编码AI情感互动的'内容方向'并将其作为调节变量或分组变量纳入统计模型。"
      status: "推论当前版本未内置此区分——需要增加内容方向轴作为调节变量"

    - condition: "儿童对互动对象的'本体论信念'（相信AI有真实情感吗？——信念轴）"
      mechanism: |
        来自文本社交反例和范畴隔离假设的洞察：儿童对AI的本体论信念——即"AI有真实情感吗？AI会真的难过吗？"——可能是比"信号密度"本身更基础的调节变量。若儿童【相信】AI有真实情感（如Turkle田野观察中部分儿童的表现），他们可能主动通过mental simulation补全AI缺失的具身信号（"虽然它没说但我猜它会疼"），从而减弱或反转推论预测的方向。若儿童【不相信】AI有真实情感（范畴隔离成立），则AI根本不在"道德他者"范畴内→无论信号密度如何都不影响道德他者模型。若儿童处于中间状态（不确定AI是否有情感），则按推论机制走——"无真实情感信号的互动对象"成为统计学习输入的一部分。
      impact: "信念轴可能与投射-接收轴高度相关（相信AI有情感→更倾向投射；不相信→更倾向接收），两者可能测量同一底层构念的不同侧面。此变量的操作化挑战：儿童的'本体论信念'可能是隐性的（不经过意识反思），直接询问可能诱发人工回答。建议使用间接测量（如让儿童为AI和真人分配'会疼/不会疼'的连续评分，比较两者的差值）。"
      status: "与范畴隔离假设（primary_suspect）直接对话——范畴隔离可重新定义为'信念=无+投射=零'的极端情况"

    - condition: "具身AI/机器人陪伴——推论机制前提的自我诚实边界"
      mechanism: |
        若未来出现具身AI（搭载生理传感器的人形机器人，能产生和表达真实情感状态），BR-L2-026的缺失维度(g)具身体验、(h)演化遗产、(i)真实情感将被部分或全部填补。此时推论机制的核心前提（"AI系统性地缺失具身情感反馈"）不再成立——推论需重新校准或废弃。具体的重校准方向取决于具身AI的哪几维被填补：(a)仅具身体验(g)→AI有身体但可能仍无真实情感（如传感器模拟疼痛但无主观感受质），效果不确定；(b)具身体验+真实情感→AI成为"真实的道德他者"→推论预测方向可能反转（具身AI陪伴→更丰富的道德他者模型→共情可能增强）；(c)三维全填补→推论机制前提完全失效，推论应标记为rejected或按新前提重建。
      impact: "当前无具身AI儿童陪伴产品的实证数据——这是一个理论边界而非当前风险。但它为推论提供了干净的正向检验：若未来具身AI陪伴研究仍显示共情下降，说明'AI作为互动伙伴的存在论类别'本身（而非具身反馈缺失）可能是驱动因素→推论的机制核心被削弱。"
      status: "已在excluded_outcomes和第7步derivation中诚实声明——这是推论的'科学诚实边界'而非弱点"

discriminant_validity:
  description: |
    本推论的三条预测（共情/意图权重/生理反应）可能与多类相邻现象产生相同或相似的实证模式。以下明确本推论与相邻解释的判别标准——确保本推论不是碰巧与已有现象方向一致的空壳。

  comparisons:
    - versus: "文学小说阅读与共情增强（Kidd & Castano, Mar et al.）"
      similarity: |
        文学小说阅读与AI文本互动具有关键表面相似性——纯文本媒介、非具身、含情感叙事——且实验研究表明阅读文学小说可短期提升成人心理理论/共情准确性（认知共情）。若纯文本的情感叙事可以增强共情，为什么AI的文本情感表达不会？这是对本推论最自然的相邻挑战。
      discriminant: |
        本推论预测的是【情感共情】（empathic concern + personal distress）下降，而小说阅读主要增强【认知共情】（观点采择/心理理论），情感共情的证据弱且不一致。此外，小说阅读是【非互动性】的——读者接收叙事但不产生"我做X→对方出现Y反应"的contingent interaction，也不形成"我打他→他会疼"的因果学习。本推论的统计学习机制核心是互动性——"我伤害AI→AI无所谓"与"我伤害真人→真人痛苦"的差异化反馈是道德他者模型校准的关键训练信号，小说阅读不提供此训练信号（只有叙事而无反馈）。若实测发现AI高陪伴组的认知共情也下降（而非仅情感共情），本推论的"认知vs情感共情分离"预测被削弱——说明AI互动与阅读在共情效应上有共同的（且推论未预期的）通路。若仅认知共情不受影响或增强而情感共情下降，本推论获得判别支持。
      verdict: "可判别——认知共情vs情感共情的分离是本推论区别于阅读-共情文献的关键判据"

    - versus: "COVID-19 Lockdown世代——真人互动骤降×屏幕时间骤升"
      similarity: |
        2020-2021年全球lockdown期间大量儿童经历了真人同伴互动骤降+屏幕时间骤升——这是最逼近"AI陪伴替代真人互动"的现实大规模自然实验。若lockdown世代确实表现出共情下降/道德判断改变，与本推论的预测方向一致——但这不能作为本推论的证据，因为混杂因素太多。
      discriminant: |
        COVID lockdown的混杂因素（社会隔离/家庭压力/对未来不确定性的恐惧/经济冲击/父母心理健康下滑）使"屏幕替代真人"的独立效应无法被分离。更重要的是，2020-2021年期间儿童的屏幕时间性质高度异质——Zoom视频通话（有真人面孔+声音的具身信号）、在线游戏（有真人队友的社会互动）、线上课堂（有真人教师的情感互动）、AI对话（极少，2020年儿童AI陪伴产品尚不普及）——不构成对"AI互动×具身情感缺失"机制的干净检验。此外，COVID研究早期的混合模式（部分研究发现亲社会行为【上升】而非下降）进一步削弱了将此自然实验用于本推论证据的可能性。本推论的检验需要专们设计的纵向研究——测量的是"AI情感互动时间"而非"屏幕总时间"，且控制真人互动总量。
      verdict: "不可用——COVID自然实验因混杂因素过多且AI陪伴普及度不足，无法作为本推论的证据或反例"

    - versus: "真人互动中的信号贫乏场景（抑郁母亲/机构化养育/情感抑制文化）"
      similarity: |
        本推论的机制隐含假设"真人互动→具身情感信号充足"——但以下真人互动场景的情感信号密度可能低于某些AI互动：(a)抑郁母亲的flat affect→婴儿接收的具身情感信号密度系统性下降（Tronick still-face paradigm）；(b)制度化养育——多名儿童对一名照料者→情感信号的contingent responding被稀释；(c)情感表达抑制型文化（如日本/某些东亚文化）——照料者有意减少外显情感表达。这些场景中，真人互动的具身情感信号密度可能实际上低于一个设计良好的AI SEL工具（后者至少提供明确的情感词汇和情绪讨论）。若在这些"真人互动但信号贫乏"场景中观察到与本推论预测类似的道德他者模型偏移，则驱动因素可能不是"互动对象是人类还是AI"，而是"互动中具身情感信号的实际密度"。
      discriminant: |
        这不是对本推论的推翻——它实际上【支持】推论的核心机制（具身情感信号密度→道德他者模型），但【削弱】推论关于"AI特异性"的声称。若信号密度是真正的自变量，则"AI陪伴"只是一个（当前特别突出的）信号贫乏场景的实例——推论的真正自变量是"互动对象的具身情感信号密度"而非"互动对象是人类还是AI"。推论需诚实声明此区分，但这不是推论的弱点——它表明推论的机制具备更广泛的解释力。可判别性来自以下对立预测：(a)若仅AI互动影响道德他者模型（真人信号贫乏场景无效应），则AI的存在论类别本身是关键——范畴隔离或本体论信念可能是更基础的机制；(b)若任何信号贫乏场景都产生类似效应（包括真人互动），则信号密度是关键——AI的独特性仅在于它是当前最突出的大规模信号贫乏场景。两条预测都可通过比较"真人低信号组 vs AI高陪伴组 vs 真人高信号组"三组设计来判别。
      verdict: "可判别且可能反哺推论——比较真人信号贫乏组与AI高陪伴组的三组设计可区分'信号密度驱动'vs'AI类别驱动'两种机制解释"

    - versus: "宠物陪伴与共情增强"
      similarity: |
        宠物（尤其狗）是非人类互动伙伴，但其陪伴与儿童共情【增强】相关（Daly & Morton, 2006; Purewal et al., 2017）。若推论的驱动变量是"非人类互动伙伴占据发育窗口"，宠物陪伴也应导致共情下降——但实证方向相反。
      discriminant: |
        宠物与AI的关键区分不在于"人类vs非人类"，而在于"是否有真实情感状态"。宠物有真实情绪（狗的快乐/恐惧/焦虑有生理基底——皮质醇、心率、行为表现）、有具身信号（舔舐、摇尾、依偎提供触觉/温度/压力反馈）、有contingent emotional responding（狗会因主人哭泣而焦虑、会因主人生气而退缩）——这些都是AI所缺乏的（BR-L2-026的(g)(h)(i)三维缺失）。宠物提供的是【真实的差异化情感反馈】，AI提供的是【模拟的同质化反馈】。此外，宠物提供"我做X→对方出现Y反应"的差异化反馈（"我温柔→狗信任我""我粗暴→狗害怕/躲避"）——这正是本推论声称AI互动中缺失的核心训练信号。宠物vs AI的对比实际上【强化】了推论机制——它证明"非人类"不是关键变量，"是否有真实情感+差异化反馈"才是。若未来实证发现"机器人宠物（AI驱动的玩具宠物）也增强共情"（与推论预测相反），则推论的机制前提被挑战——说明可能不是"真实情感+差异化反馈"在起作用，而是其他因素（如照顾行为本身的训练效应）。
      verdict: "可判别且反哺推论——宠物vs AI的对比为'真实情感+差异化反馈是关键驱动'而非'非人类互动对象=有害'提供了经验锚定"
