        BR-L2-019中引用的依恋文献链：Kochanska et al. (2002, 2005) 纵向研究——安全依恋→承诺遵从+内疚反应；不安全依恋/依恋对象频繁轮换→情境遵从（仅在监控下遵守）+内疚反应弱。Sroufe et al. (2005) Minnesota纵向研究——婴儿期依恋模式预测成年道德行为。机制同构：机构化养育中互动对象频繁轮换→缺乏稳定的情感反馈→道德内化受损。AI陪伴是另一种形式的"互动对象情感反馈缺失"——不是轮换频繁