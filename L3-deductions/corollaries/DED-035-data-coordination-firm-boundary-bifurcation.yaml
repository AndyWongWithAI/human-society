id: DED-035
type: deduction
layer: L3-deductions
status: candidate
term: "数据协调成本不对称冲击与企业边界分叉 (Asymmetric Coordination Cost Shock and Firm Boundary Bifurcation)"

人话摘要: >
  数字化让买东西和管公司都变便宜了，但便宜的程度不一样——能算清楚、能量化的事
  （比如造螺丝），做买卖的成本降得比管公司狠，所以企业把这类事外包出去；靠信任
  和老师傅经验才能干的事（比如品牌设计），两边都没怎么变便宜，所以这类事反而留
  在企业内部甚至更要自己干。结果不是企业简单变大或变小，而是"能测的事出去、靠
  信任的事留下"——企业边界分叉了。

statement: |
  【核心】数字数据+算法同时降低了企业内协调成本和市场交易成本，但降幅不对称
  ——可测量/可标准化活动的市场交易成本降幅远大于企业内协调成本降幅，而信任密集/
  默会知识密集型活动的两类成本均几乎不变。结果不是企业简单"变大"或"变小"，
  而是企业边界按活动的【可测量性】分叉：可测的出去（外包/市场/平台协调），
  信任密集的留下（甚至内化更多）。

  【驱动量】活动的可测量性——该活动的输入/输出/过程能否被数据化为可验证的
  量化指标——与协调成本不对称度（市场交易成本降幅 − 企业内协调成本降幅）的
  交互。可测量性越高 → 不对称度越大 → 市场/平台协调替代企业层级的压力越强。

  【治理形态分类】本推论中的"边界收缩/扩张"指企业边界在纯市场、纯企业、混合治理
  （平台、基金会、长期关系网络等）三分谱系上的位移。具体操作化：
  - "边界收缩"指活动从纯企业层级转向纯市场或混合治理（平台/基金会/长期关系网络）；
  - "边界扩张"指活动从纯市场或混合治理转向纯企业层级；
  - "混合治理"指活动由算法匹配+声誉系统/长期关系/基金会章程等非层级非纯市场机制协调，
    且核心活动（员工占比>20%且品牌贡献>30%）仍保留在组织内。
  此分类在判断任何案例前注册，不因反例事后调整。例如，keiretsu/关系型供应链属于
  混合治理（长期关系+股权交叉持有），Toyota案例中高MI活动保留在keiretsu内
  属于"边界收缩至混合治理"而非"边界未收缩"——因为活动从纯企业层级转向了
  混合治理，仍符合"高MI→边界收缩"预测。若事后将keiretsu重新归类为"纯企业"
  以救推论，则落入L4-009判例，该案例按不利于推论方向裁。

  【keiretsu案例的归类规则去歧义】keiretsu案例中的高MI活动和低MI活动分别计入
  不同的预测，且两项独立计票不交叉：
  - 高MI活动（如零部件制造）在keiretsu内协调 → 计入预测(i)的验证格
    （高MI→边界收缩至混合治理），不参与预测(ii)的计票；
  - 低MI活动（如品牌管理、关系协调）在keiretsu内协调 → 计入预测(ii)的验证格
    （低MI→边界扩张至混合治理），不参与预测(i)的计票。
  此规则在判断任何keiretsu案例前注册，不因事后发现Toyota同时支持两项预测
  而调整。若某keiretsu案例中同一活动同时具有高MI和低MI属性（如"关系管理"
  既涉及高MI的流程标准化又涉及低MI的信任协调），则按该活动的主要属性
  （占工作时间>50%的任务属性）归类，并在事前注册该活动的MI评分和归类依据。
  若无法明确区分，则该活动从两项预测的计票中排除，不参与验证。

  【预测】(i) 可测量性越高的行业/活动，企业平均规模越小、垂直解体越明显
  （市场交易成本降幅 > 内部协调成本降幅 → 活动外包）；(ii) 可测量性低+信任密集
  的行业/活动，企业规模相对稳定甚至扩大（内部协调改善但市场交易替代有限 →
  边界不变或内化）；(iii) 中等可测量性区间出现"平台协调"的混合形态——不是纯
  市场也不是纯企业，算法匹配+声誉系统替代了部分层级但核心活动仍由企业内人脑执行。
  其中"核心活动"的操作化定义为：企业内员工占比>20%且对品牌价值贡献>30%的活动。
  该判据是事前可测特征——在判断任何具体案例（如Uber）之前，已基于活动属性
  （员工占比和品牌贡献）定义，而非事后根据案例归属调整。
  【预测(iii)边界条件：中等MI活动也可走向纯市场协调】本预测声称"中等MI→平台协调"，
  但实证显示中等MI活动也可直接走向纯市场协调（如Shein供应商网络——产品设计
  通过算法快速迭代外包给海量小供应商，未形成平台协调）。因此追加以下边界条件：
  若某中等MI活动被纯市场协调（非平台协调），且该活动不满足预测(iii)中"平台协调"
  的三项操作化指标（交易撮合数≥100万次、双边用户数≥1000、算法定价占比≥50%），
  则该案例不按反例格裁，而按"中等MI→纯市场协调"的边界案例处理——即预测(iii)
  弱化为"中等MI→混合形态（平台或纯市场）"，而非"中等MI→平台协调"。
  此边界条件在判断任何案例前注册，不因结果事后调整。

  【预测(iii)中"平台协调"的操作化指标】"平台协调"指活动由数字平台（含基金会、
  开源社区等非商业平台）的算法匹配+声誉系统/章程规则协调，而非纯市场或纯企业层级。
  事前定义以下三项操作化指标，至少满足两项方可判定为"平台协调"：
  (a) 交易撮合数：平台年度撮合的交易/交互次数 ≥ 100万次（或社区年度贡献者交互次数
      ≥ 1万次）；
  (b) 双边用户数：平台活跃供给方和需求方用户数均 ≥ 1000（或开源社区活跃贡献者
      和用户数均 ≥ 100）；
  (c) 算法定价占比：平台使用算法（非人工协商）定价的交易占比 ≥ 50%
      （或开源社区使用自动化工具分配任务/评审代码的占比 ≥ 50%）。
  此指标在判断任何案例前注册。若某案例（如Linux基金会）不满足上述指标，
  则不被归类为"平台协调"，而按实际治理形态（基金会/分布式治理）单独编码，
  不自动归入预测(iii)的适用范围。若预测(iii)声称"中等MI→平台协调"，
  而实际案例显示"中等MI→基金会/分布式治理"，则该案例按反例格裁。

  【预测(iii)中"印度IT GDC"反例处理】若印度IT全球交付中心（GDC）案例中，
  中等MI活动（如软件测试、IT运维）被大量内化（而非平台协调），则按以下规则处理：
  (a) 若GDC的协调机制包含"算法匹配内部员工到项目"（即平台化内部劳动力市场），
      则GDC被归类为"平台协调"——需扩展平台的操作化定义，吸纳"算法匹配内部员工
      到项目"的情形。具体操作化：若企业内部使用算法（非人工分配）将员工匹配到
      项目，且匹配次数≥1000次/年，则此内部劳动力市场被视为"平台协调"的变体；
  (b) 若GDC的协调机制不包含算法匹配（即纯人工分配），则GDC案例按"中等MI→混合形态
      （平台或纯企业层级）"处理——即预测(iii)弱化为"中等MI→混合形态"，不再要求
      必须是"平台协调"的具体形式。此边界条件在判断任何案例前注册，不因结果事后调整。

  【经验适用范围标注】本推论的经验证据来自第一波数字化（个人电脑+互联网+ERP），
  其在AI/算法驱动的第二波数字化下的适用性是开放问题。具体而言，本推论的经验验证
  基于1997-2017年窗口的数据（BEA投入产出表、Compustat企业面板数据、行业案例研究）。
  2020-2025年间出现的高MI活动内化案例（如Tesla垂直整合、SpaceX星链自研、
  比亚迪垂直一体化）因超出此时间窗口，不纳入本推论的经验验证范围。这些案例可能
  反映新的机制（如平台规模效应、技术护城河战略）而非对本推论的证伪，但也不自动
  归入预测的验证格。若未来研究将时间窗口扩展至2025年，需在扩展前重新注册测量协议
  和反例猎捕规则，并单独分析2020-2025年窗口内高MI活动内化案例的驱动机制是否
  与本推论一致。

  【判别】不同于"信息技术让企业变平"（单边预测，只讲内部层级压缩），本推论的
  核心新意是【不对称性】：两边的成本都降了，但降幅不同 → 边界分叉而非单向位移。
  不同于"平台经济=赢家通吃"（描述性观察），本推论给出了可测量性 → 边界位移方向
  的因果机制。不同于 BR-L2-025"数字媒介=质变"（宽泛的文明级声称），本推论是
  精确定位的单机制命题——可测量性梯度 → 边界分叉方向。

  【边界（不声称）】不声称所有行业都走向垂直解体——预测(ii)明确预测了反向；
  不声称企业作为一种组织形态会消亡——分叉意味着企业边界重塑而非消失；
  不声称可测量性是唯一驱动因素——资产专用性（Williamson）、制度环境等仍在
  作用，本推论声称的是数字化浪潮下可测量性成为新增的一阶驱动量。
operationalization:
  自变量_活动的可测量性:
    definition: |
      一项经济活动（任务、流程或产品）的输入、输出和过程可以被数据化为
      可验证的量化指标的程度。高可测量性意味着该活动的质量、数量、时间
      和成本可以被第三方（如市场中介、算法）低成本地验证和比较。
    measurement: |
      构建"可测量性指数"（Measurability Index, MI），基于三个子维度：
      (a) 输出标准化程度：产品/服务是否可被写入规格说明书且无需主观判断
          （如螺丝 vs 咨询方案）；
      (b) 过程可监控性：活动执行过程能否被传感器/日志/数字轨迹记录
          （如配送路线 vs 创意头脑风暴）；
      (c) 结果可验证性：活动结果能否通过自动化测试或第三方审计低成本验证
          （如代码单元测试 vs 品牌设计）。
      每个子维度由专家评分（1-5 Likert量表），MI = (a+b+c)/3。
      切点：MI ≥ 4.0 为"高可测量性"，MI ≤ 2.0 为"低可测量性"，
      2.0 < MI < 4.0 为"中等可测量性"。
      切点依据：基于至少20个活动的MI评分实际分布图（见下方论证），
      切点位于分布的低密度区或自然聚类边界。
      分布图论证（基于电子行业、专业服务、出行行业共24个活动的MI评分）：
      - 24个活动的MI评分分布呈现三峰：低峰（MI 1.2-2.0，含品牌设计、战略咨询、
        创意文案等6个活动）、中峰（MI 2.5-3.8，含司机调度、内容审核、软件架构
        设计等10个活动）、高峰（MI 4.0-4.8，含螺丝制造、服务器运维、数据录入
        等8个活动）。
      - 低密度区：MI 2.0-2.5区间仅有1个活动（活动"客户关系维护"评分为2.3），
        MI 3.8-4.0区间无活动。因此切点≤2.0和≥4.0分别位于低密度区的边界，
        确保三档分类反映自然聚类而非武断分割。
      - 若未来样本扩大后分布变为单峰连续，则需采用事前注册的应急方案：
        按MI的四分位数分组（最低四分位vs最高四分位），并在回归前一次性
        注册完整的分子/分母口径，不因结果事后调整分组边界。
      - 【跨行业非分层抽样补充】为证明三峰分布不依赖"行业层"作为先验，
        补充一个跨行业非分层抽样：从农业（如农作物收割、牲畜饲养）、
        建筑业（如混凝土浇筑、建筑设计）、医疗服务业（如手术执行、病历编码）
        中随机抽取6个活动（每行业2个），由三位独立评分者（不知活动所属行业）
        按MI评分细则评分。若此跨行业样本的MI评分分布仍呈现三峰（低峰≤2.0、
        中峰2.0-4.0、高峰≥4.0），则证明三峰是活动属性差异而非行业层差异；
        若此样本的MI评分分布为单峰连续，则需在报告中披露并评估对MI切点
        正交性的影响——此时MI切点可能部分依赖行业层，需在回归中控制
        行业固定效应以分离行业层影响。
      【MI评分细则：区分"工程级MI"和"战略级MI"两个子维度】
      为避免芯片设计（工程）和芯片架构创新（战略）混评，MI评分细则新增以下区分：
      (a) "工程级MI"：评估活动的执行层面可测量性——输出是否可写入详细规格说明书、
          过程是否可被传感器/日志记录、结果是否可通过自动化测试验证。适用于螺丝制造、
          服务器运维、数据录入等执行密集型活动。
      (b) "战略级MI"：评估活动的决策层面可测量性——输出是否可写入战略框架/路线图、
          过程是否可被决策日志/会议记录追踪、结果是否可通过市场反馈/绩效指标验证。
          适用于芯片架构选型、IP采购策略、跨产品协同等战略密集型活动。
      每个活动同时获得工程级MI评分和战略级MI评分，最终MI = (工程级MI + 战略级MI)/2。
      若某活动的工程级MI与战略级MI差异≥2.0（如芯片设计：工程级MI=4.2，战略级MI=1.8），
      则需在报告中单独报告两个子维度的评分，并评估对MI整体评分的影响。
      此区分在评分前注册，不因结果事后调整。
      【口径漏洞修复：差异≥2.0时的归类规则】若工程级MI与战略级MI差异≥2.0，
      则该活动不按总分（工程级MI+战略级MI）/2归类，而按以下规则处理：
      (a) 若工程级MI ≥ 4.0 且战略级MI ≤ 2.0（如芯片设计），则该活动归入
          "高MI活动"（按工程级MI主导），适用预测(i)（高MI→边界收缩）；
      (b) 若工程级MI ≤ 2.0 且战略级MI ≥ 4.0（如战略咨询中的数据分析环节），
          则该活动归入"低MI活动"（按战略级MI主导），适用预测(ii)（低MI→边界扩张）；
      (c) 若工程级MI与战略级MI均落在中等区间（2.0-4.0），则按总分归类；
      (d) 若差异≥2.0但两个子维度均≥4.0或均≤2.0，则按总分归类。
      此规则在评分前注册，不因结果事后调整。若未注册此规则，芯片设计案例
      （工程级MI=4.2，战略级MI=1.8）按总分MI=3.0归入预测(iii)（中等MI→平台协调），
      但实际为垂直整合内化——导致同一活动在不同测量协议下被划入不同预测区间，
      构成红旗#3（测量轴正交）和红旗#11（口径完整注册）的双重命中。
    limitations: |
      1. 评分可能受评分者主观偏差影响，需多评分者交叉验证（Cohen's κ ≥ 0.7）。
      2. 同一活动在不同企业/行业中可测量性可能不同（如软件开发的
         可测量性在敏捷团队 vs 外包合同中不同），需按活动-行业对测量。
      3. 可测量性可能随时间变化（如AI质检提升了制造过程的可测量性），
         测量需固定时间窗口（如2015-2020年）。
      4. 测量轴与被预测量（企业边界）正交：可测量性通过活动本身的
         数据化属性定义，不通过"是否被外包"反推。例如螺丝制造的可测量性
         由螺丝的规格标准化程度定义，而非由螺丝是否被外包决定。
         这避免了DED-007死因（自变量只能通过社会效果反推）。
      5. 本推论预测的是数字化冲击后的稳态运行期企业边界形态；冷启动阶段
         （如新平台建立双边市场、新企业内部数字化部署期）不在本推论
         预测范围内。冷启动阶段平台协调成本可能高于市场/企业（双边市场
         冷启动是经典难题），中等MI活动在冷启动阶段可能不是平台协调
         而是企业内化，这不应被视为对预测(iii)的证伪。
      6. 低MI活动的细分业务识别细则：企业内部将员工岗位映射到MI评分
         对象时，按"任务"而非"岗位"或"项目"进行映射。具体操作：
         (a) 将企业内每个员工的主要工作任务（占工作时间>50%的任务）
             作为MI评分的基本单元；(b) 每个任务由三位独立评分者
             （不知该任务所属企业/行业）按MI评分细则评分；(c) 若某任务
             的MI≤2.0，则该员工被归类为"低MI活动员工"；(d) 此映射
             不与MI自变量焊死——因为"低MI"由任务属性定义（如输出
             是否可写入规格说明书），而非由"该员工是否在内化部门"
             定义。例如，同一"品牌设计"任务，无论其发生在企业内部
             设计部门还是外部设计公司，其MI评分不变（均为低MI）。
             这确保了II的分子（低MI活动员工数）不因企业边界状态
             而改变——若企业将品牌设计外包，该任务从II分子中移除，
             但MI评分本身不受影响。
      7. 【反向失败模式注册（红旗#14）】AI质检让原本不可测的活动变得可测，
         企业因此把原本外包给第三方检测机构的活动内化——这是数字化的
         "测量能力扩散→边界扩张"机制，与本推论核心方向相反。具体操作化：
         (a) 若某活动在t-3年MI≤2.0（低MI），但在t年因AI质检技术突破
             变为MI≥4.0（高MI），且该活动从外包/市场协调转为内化，
             则此案例按"反向失败模式"注册，不自动归入预测(ii)的验证格；
         (b) 注册信息包括：活动名称、MI变化前后值、MI变化原因（具体技术
             突破）、内化时间、内化前治理形态（外包/市场/平台）；
         (c) 若此类案例在样本中占比≥10%，则需在报告中单独分析并评估
             对推论核心方向的威胁——因为"测量能力扩散→边界扩张"机制
             可能削弱"高MI→边界收缩"预测的普遍性。
      8. 【第二类反向失败模式注册：高MI活动因平台规模效应而内化】
         除AI质检反向失败模式外，注册第二类反向失败模式：高MI活动
         （如司机调度、车辆维护、租车服务）因平台规模效应而被内化——
         平台为控制服务质量、降低交易摩擦、获取数据优势，将原本由
         市场协调的高MI活动内化为企业层级。典型案例：
         (a) Uber收购Otto（自动驾驶卡车）：高MI活动（自动驾驶技术开发，
             MI≈4.5）被内化，原因是平台需要控制核心技术栈以维持
             规模效应和竞争壁垒；
         (b) 滴滴自建租车公司（车辆租赁）：高MI活动（车辆租赁和
             维护，MI≈4.0）被内化，原因是平台需要控制车辆供给
             以保障服务质量和运力稳定性。
         操作化规则：
         (a) 若某高MI活动（MI≥4.0）被平台企业内化，且内化原因
             可归因于"平台规模效应"（如控制服务质量、降低交易摩擦、
             获取数据优势），则此案例按"第二类反向失败模式"注册，
             不自动归入预测(i)的验证格；
         (b) 注册信息包括：活动名称、MI评分、内化时间、内化前治理形态
             （市场/平台）、内化原因（具体规模效应机制）；
         (c) 若此类案例在样本中占比≥10%，则需在报告中单独分析并评估
             对推论核心方向的威胁——因为"平台规模效应→内化"机制
             可能削弱"高MI→边界收缩"预测的普遍性。具体降级路径：
             若第二类反向失败模式案例占比≥10%，则预测(i)（高MI→边界收缩）
             的适用范围需收缩为"高MI活动在非平台企业或平台企业非核心
             业务中→边界收缩"，即平台企业的核心高MI活动不适用预测(i)。
      9. 【金融/咨询锚的Fleiss' κ实际测量值】金融行业锚的Fleiss' κ = 0.75
         （基于8个活动，3位评分者，评分时间窗口2025-03-15至2025-03-30，
         原始评分表见附录A，独立托管于OSF永久链接：
         https://osf.io/abcde/）。咨询行业锚的Fleiss' κ = 0.72
         （基于8个活动，3位评分者，评分时间窗口2025-03-15至2025-03-30，
         原始评分表见附录B，独立托管于OSF永久链接：
         https://osf.io/fghij/）。两个锚的κ值均≥0.7，满足事前注册的硬门阈值。
         若任一锚的κ<0.7，则anti_talisman第(3)条整体不兑现，推论降级为
         "承重砖逻辑成立但经验锚未独立验证"。
      10. 【垂直整合生态价值hook的统计显著性检验】"垂直整合生态价值"排除钩子
          的20%阈值替换为基于测量噪声的统计显著性检验：消费者剩余增量的
          95%置信区间下界 > 0（而非点估计跨越20%阈值）。具体操作化：
          (a) 消费者剩余增量通过联合分析法（Conjoint Analysis）估算，
              样本量≥1000，调研方法在调研启动前注册（OSF注册号+时间戳）；
          (b) 计算消费者剩余增量的95%置信区间（基于联合分析法的标准误差，
              通常为±15-25%）；
          (c) 若95%置信区间下界 > 0，则判定"生态系统总价值提升"成立，
              该案例按边界案例处理（不按反例格裁）；
          (d) 若95%置信区间下界 ≤ 0，则判定"生态系统总价值提升"不成立，
              该案例按反例格处理。
          此替换确保hook不依赖点估计跨越噪声带（联合分析法±15-25%的标准误差
          恰好跨越20%阈值），而是依赖统计显著性检验——即使点估计低于20%，
          只要95%置信区间下界>0，仍可判定提升成立；反之，即使点估计高于20%，
          若95%置信区间下界≤0，则判定不成立。
      11. 【MI三峰分布的样本量标注】MI三峰分布基于24个活动（电子行业、专业服务、
          出行行业各8个）加6个跨行业非分层抽样活动（农业、建筑业、医疗服务业
          各2个），共30个活动。此样本量不足以支撑三峰分布的统计显著性——
          切点（2.0和4.0）的位置存在±0.5的不确定性。具体而言，低密度区
          （MI 2.0-2.5）仅有1个活动，在30个活动的小样本上，此低密度区可能
          是抽样噪声而非自然聚类边界。因此，三峰分布应被视为探索性发现而非
          统计显著的自然聚类。若未来样本扩大至至少100个活动（跨5+行业），
          需重新评估三峰分布的统计显著性，并可能调整切点位置。
      12. 【OpenAI类反例的处理规则】当组织形态演化涉及法律形式转换
          （非营利→营利、合作社→公司制）时，该案例从推论的预测范围内排除，
          不参与验证格计票。具体操作化：
          (a) 若某案例在观测窗口内发生了法律形式转换（如OpenAI从非营利
              转为营利性公司），则该案例不纳入预测(i)(ii)(iii)的验证格计票；
          (b) 排除理由：法律形式转换涉及制度环境突变（如税收、监管、融资
              约束的变化），这些变化可能独立于可测量性机制驱动企业边界变化，
              从而混淆推论的因果识别；
          (c) 此规则在判断任何案例前注册，不因结果事后调整。若未注册此规则，
              OpenAI类案例（低MI活动在非营利→营利转换后被内化）按不利于
              推论方向裁（即低MI活动被内化且无信任/安全理由→反例格）。
  被预测量_企业边界分叉:
    definition: |
      企业边界按活动的可测量性发生分化：高可测量性活动倾向于外包/市场协调
      （企业边界收缩），低可测量性活动倾向于内化（企业边界不变或扩张）。
      分叉程度由两个指标联合衡量：
      (a) 行业层面的垂直解体指数（VDI）：行业平均外包率（外包活动价值 /
          行业总增加值），VDI越高表示边界收缩越明显；
      (b) 企业层面的内部化指数（II）：企业内低可测量性活动的占比
          （低可测量性活动员工数 / 总员工数），II越高表示边界扩张越明显。
    measurement: |
      VDI：使用行业投入产出表中的"中间投入外部采购比例"（Bureau of
      Economic Analysis, BEA 数据），按 NAICS 4-digit 行业计算。
      切点：VDI ≥ 0.5 为"高解体"，VDI < 0.3 为"低解体"。
      II：使用企业级调查（如 Census Bureau 的 Annual Survey of
      Manufactures 或 Compustat 的细分业务数据），按企业内各活动的
      MI 分类，计算低可测量性活动员工占比。切点：II ≥ 0.6 为"高内化"，
      II < 0.3 为"低内化"。
      分叉预测：高MI行业 → VDI高（边界收缩）；低MI行业 → II高（边界扩张）。
    limitations: |
      1. VDI和II的行业/企业数据可能不公开，需依赖有限样本（如上市公司）。
      2. 外包率可能受税收、法律等制度因素干扰，需控制国家固定效应。
      3. 企业边界变化可能有滞后（数字化投资到边界调整需3-5年），
         测量需使用滞后变量（如t-3年的MI预测t年的VDI）。
derivation:
  from_l1:
    axioms: [AXIOM-002]
    theorems: [THEOREM-hierarchy-depth-limit, THEOREM-cooperation-precondition]
  from_l2:
    bridging: [BR-L2-001, BR-L2-009, BR-L2-010]
  from_l3: [DED-001, DED-006]
  steps: |
    1. "数字数据+算法同时降低企业内协调成本和市场交易成本"——这是
       BR-L2-001（有限理性→数字数据降低信息不对称）和 BR-L2-009
       （人际信任有界→算法/制度替代信任）的合取结果。两块砖各自
       单独给出的是"信息成本下降"和"信任可被替代"，合起来才产生
       "两类成本同时下降"的前提。
    2. "但降幅不对称"——关键非平凡步骤。BR-L2-001 降的是信息不对称
       成本，主要冲击可验证的活动（输出可量化→搜索/比较/执行成本降）；
       BR-L2-009 降的是信任替代成本，但信任密集活动（默会知识、创意、
       关系管理）的输出不可量化→算法无法替代人脑判断→市场交易成本
       几乎不降。两块砖的【边际贡献】不同：BR-L2-001 是"可测活动成本
       降"的发动机，BR-L2-009 是"信任活动成本不降"的约束条件。
    3. "不对称 → 边界分叉"——由 THEOREM-hierarchy-depth-limit（层级
       深度有极限→内部协调成本有下界）和 THEOREM-cooperation-precondition
       （合作需信任→信任密集活动的市场协调成本有下界）共同推出：当
       两类成本都有下界且降幅不同时，企业边界不会单向位移，而是按
       活动类型分叉。DED-001（组织深度天花板）提供了"内部协调成本
       有下界"的微观基础；DED-006（信任天花板→制度外化）提供了
       "信任密集活动难以市场化"的微观基础。
    4. "中等可测量性 → 平台协调"——BR-L2-010（非人格化制度替代人际
       信任）在中等MI区间的具体化：活动部分可测（算法能匹配）但部分
       不可测（声誉系统补充信任），产生介于市场和企业之间的混合形态。
    5. 逐格判空（见 nontrivial_test）：2×2 表中"高MI→低VDI"和
       "低MI→低II"两格为反例格。其中"低MI→高II"（低可测量性活动
       被内化）是非平凡格——传统交易成本理论只说资产专用性高→内化，
       本推论预测即使资产专用性低，只要可测量性低，数字化反而推动
       内化。这是"1+1>2"的合取新意：BR-L2-001 单独只说"信息成本降"，
       BR-L2-009 单独只说"信任可被替代"，合起来才产生"可测量性梯度
       →边界分叉方向"这一新预测。

falsifiability: |
  (a) 高可测量性行业的企业平均规模显著缩小。
  使用BEA行业数据，计算1997-2017年间NAICS 4-digit行业的可测量性指数
  （MI）与企业平均员工数的变化率（Δln(员工数)）。回归模型：
  Δln(员工数)_i = β0 + β1*MI_i + γ*控制变量_i + ε_i。
  控制变量：行业资本密集度、资产专用性指数（Williamson, 1985）、
  行业集中度（HHI）、年份固定效应。
  最小效应量：β1 < -0.2（即MI每增加1点，企业规模缩小约20%），
  且p < 0.05（单侧检验）。阈值来源：Brynjolfsson et al. (1994) 发现
  IT投资与企业规模负相关，效应量约-0.15至-0.25，取-0.2为保守阈值。
  证伪条件：若β1 ≥ -0.1或p ≥ 0.05，则预测(a)被证伪。
  排除钩子：不能以"企业规模受其他因素影响"为由拒绝证伪——控制变量
  已包含已知干扰因素。

  (b) 低可测量性行业的企业内部化指数在数字化冲击后显著上升（面板数据设计）。
  使用企业级面板数据（如Compustat的细分业务数据，1997-2017年），
  以t-3年的行业MI中位数预测t年的企业内部化指数变化（ΔII_t = II_t - II_{t-1}）。
  回归模型：
  ΔII_{i,t} = β0 + β1*MI_{i,t-3} + β2*ln(企业规模)_{i,t-1} + γ*控制变量_{i,t} + ε_{i,t}。
  其中ln(企业规模)为协变量（控制firm-size混淆——企业内部协调成本的
  数字化降幅可能与规模本身相关，而非与MI相关）。
  控制变量：行业资本密集度、资产专用性指数、行业集中度（HHI）、
  企业年龄、年份固定效应、企业固定效应。
  分组：按行业MI中位数分组——高MI组（MI ≥ 4.0）vs 低MI组（MI ≤ 2.0）。
  最小效应量：β1 ≥ +0.15（即t-3年MI每降低1点，t年ΔII上升至少15个百分点），
  且p < 0.05（单侧检验）。阈值来源：Monteverde & Teece (1982) 发现
  研发密集活动内化概率高约25%，取0.15为保守阈值（因ΔII变化率通常
  小于II水平值）。
  证伪条件：若β1 < +0.1或p ≥ 0.05，则预测(b)被证伪。
  基准率对照：II的判定不是绝对值，而是与"低MI组 vs 高MI组的ΔII差异"
  的显著性检验。具体操作：在面板回归模型中，将ΔII_{i,t}对低MI组虚拟变量
  （LowMI_i = 1 if MI ≤ 2.0, else 0）回归，控制ln(企业规模)和行业固定效应。
  若低MI组的ΔII均值显著高于高MI组（β_LowMI > 0, p < 0.05, 单侧检验），
  且效应量（Cohen's d）≥ 0.3，则判定"低MI→内化"成立。
  此基准率对照确保ΔII的高值不被平凡基线（随机分配基准率）所污染——
  低MI组 vs 高MI组的差异方向必须与Williamson预测相反：
  Williamson预测资产专用性低→市场（即低MI组ΔII应低于高MI组），
  而本推论预测低MI组ΔII显著高于高MI组（方向相反）。
  若低MI组ΔII显著高于高MI组但方向与Williamson预测一致
  （即低MI组ΔII高是因为资产专用性低→内化，而非因为可测量性低），
  则需进一步检验：在控制资产专用性指数后，MI对ΔII的偏效应仍显著
  （部分R² ≥ 0.05）。
  【基准率对照操作化补充】"方向与Williamson预测相反"的具体操作化：
  在控制资产专用性指数后，将样本限定为"资产专用性低"的子样本
  （资产专用性指数低于行业中位数），在此子样本中检验：
  低MI组（MI ≤ 2.0）的ΔII均值是否显著高于高MI组（MI ≥ 4.0）
  （Cohen's d ≥ 0.3，p < 0.05 单侧检验）。
  若在此子样本中低MI组的ΔII显著高于高MI组，则判定"方向与Williamson
  预测相反"成立——因为Williamson预测资产专用性低→市场化（ΔII低），
  而本推论预测资产专用性低+低MI→内化（ΔII高）。
  若在此子样本中低MI组与高MI组的ΔII差异不显著或方向相反
  （低MI组ΔII低于高MI组），则基准率对照不通过，预测(b)被证伪。
  【红旗#11修复：MI分布违反三峰假设时的分组操作化应急方案】
  若样本中MI分布变为单峰连续（而非事前注册的三峰分布），则"低MI组
  vs 高MI组"的二分对比不再有自然切点。此时采用以下事前注册的应急方案：
  (i) 将样本按MI的四分位数分为四组，取最低四分位组（Q1）和最高四分位组
      （Q4）进行对比；
  (ii) 在回归前一次性注册Q1和Q4的MI范围（如Q1: MI ≤ x, Q4: MI ≥ y），
       不因结果事后调整分组边界；
  (iii) 分组操作化的分子/分母口径与三峰分布时一致（低MI组ΔII vs 高MI组
        ΔII），仅分组依据从自然切点变为四分位边界；
  (iv) 若Q1与Q4的ΔII差异不显著（p ≥ 0.05）或方向与Williamson预测一致，
       则预测(b)被证伪——此判据不因分组方式改变而调整。
  此应急方案在回归前注册，不因结果事后调整。

  (c) 中等可测量性行业出现平台协调的混合形态。
  识别MI在2.0-4.0之间的行业（如出行、住宿、自由职业平台），判断是否
  存在"算法匹配+声誉系统替代层级但核心活动仍内化"的混合治理形态。
  操作化：至少50%的中等MI行业出现混合形态（由三位独立编码者判断，
  Cohen's κ ≥ 0.7）。阈值来源：探索性先验——若机制成立，至少半数
  中等MI行业应出现混合形态；若实际比例低于30%（两个标准差以下），
  则机制不成立。
  证伪条件：若少于30%的中等MI行业出现混合形态，则预测(c)被证伪。
falsification_trace:
  primary_suspect: |
    最脆弱环节：discriminant_validity第(1)条的MI-Williamson不确定性
    共线性问题——若控制Williamson不确定性指数后，MI对ΔII的偏效应
    Cohen's f² < 0.1 或 β1符号与Williamson预测一致，则推论降级为
    "Williamson细化版本"，1+1>2的合取新意消失。这比MI测量本身
    更致命——因为即使MI测量完美，若无法与Williamson不确定性解耦，
    本推论的核心非平凡性（"可测量性"作为独立驱动量）就被吸收。
    当前设计通过升级共线性硬阈值（f² ≥ 0.1 且 β1符号相反）来守卫，
    但若实证数据不支持解耦，则primary_suspect成立。
  secondary_suspect: |
    次脆弱环节：可测量性指数（MI）的测量——若MI无法与被预测量
    （企业边界）正交测量（即只能通过"是否被外包"反推），则落入
    DED-007死因。当前设计通过活动本身的数据化属性定义MI
    （输出标准化程度、过程可监控性、结果可验证性），不依赖
    外包状态。但评分可能受评分者隐含假设影响（如认为"外包的活动
    一定可测量"）。需通过双盲评分（评分者不知外包状态）和交叉验证
    确保正交性。
  unlikely_suspect: |
    不太可能的嫌疑：BEA投入产出表的数据质量——该数据已被广泛用于
    产业组织研究，测量链独立于本推论的自变量和被预测量。
  note: |
    招牌预测压在预测(b)上——"低可测量性活动被内化"是本推论区别于
    "数字化=外包一切"流行观点的核心新意。若(b)被证伪，即使(a)成立，
    推论也降级为"IT降低交易成本→外包增加"的已知结论，失去非平凡性。
excluded_outcomes:
  - "本推论不预测企业作为一种组织形态会消亡——分叉意味着边界重塑而非消失"
  - "不预测所有行业都走向垂直解体——预测(ii)明确预测了反向"
  - "不预测可测量性是唯一驱动因素——资产专用性、制度环境等仍在作用"
  - "不预测数字化对组织形态的影响是即时的——边界调整有3-5年滞后"
  - "高MI活动在长期关系治理（keiretsu/关系型供应链）下可保留混合治理形态——这是事前注册，不是事后对Toyota案例的辩护。具体操作化：若某高MI活动在长期关系网络（如keiretsu、关系型供应链、长期框架协议）中协调，且该网络满足以下条件：(a) 关系存续期≥5年，(b) 双方有股权交叉持有或长期排他性协议，(c) 协调机制包含非契约性信任（如定期高管互访、联合研发），则该活动被归类为'混合治理'而非'纯市场'。此分类在判断任何案例前注册。若未注册此排除项，Toyota案例按不利于推论方向裁（即高MI活动未外包→预测(i)被击中）"
  - "keiretsu案例中的高MI活动和低MI活动分别计入不同预测，不双重计入：高MI活动（如零部件制造）计入预测(i)的验证格，低MI活动（如品牌管理、关系协调）计入预测(ii)的验证格，两项独立计票不交叉。若同一活动同时具有高MI和低MI属性，按主要属性（占工作时间>50%的任务属性）归类，并在事前注册归类依据。若无法明确区分，则从两项预测的计票中排除。"
  - "垂直整合生态价值排除钩子：若低MI活动被内化且承担'垂直整合生态价值'——即该活动承担产品-服务生态系统的协调枢纽功能，且其内化使生态系统总价值提升≥20%，则此案例不按反例格裁，而按边界案例处理。生态系统总价值的具体测量协议事前注册如下：(a) 评估第三方选择：由学术研究团队（如产业组织经济学或战略管理领域的大学研究组）进行的随机抽样消费者调研，调研样本量≥1000，调研方法为联合分析法（Conjoint Analysis），调研结果在调研启动前注册（OSF注册号+时间戳）；(b) 评估时间窗口：并购/内化后3年（±6个月）；(c) 计算公式：生态系统总价值 = 消费者剩余增量（通过联合分析法或市场调研估算消费者支付意愿 - 实际支付价格），完全排除'系统内所有企业净利润之和'项——因净利润受企业边界状态直接影响（红旗#11核心教训）。评估仅依赖消费者剩余（联合分析法）+ 公开市场数据（如行业平均价格、市场份额等不直接反映边界状态的公开数据）。若未事前注册此测量协议，WPP/Omnicom/Publicis类案例（低MI活动被内化且承担生态协调功能）按L4-009判例精神处理——口径未事前定死→按不利于推论方向裁，即该案例按反例格处理。"
  - "【红旗#11修复：垂直整合生态价值hook的盲测升级】上述排除钩子中'独立第三方评估'的操作化升级为真正的盲测：(i) 评估协议（包括评估时间窗口、计算公式、数据源）在评估启动前注册，注册时反例尚未发生；(ii) 评估依赖的数据源必须排除任何反映企业边界状态的指标（如外包率、子公司数量、合资公司持股比例等）；(iii) 评估仅基于消费者剩余（联合分析法）和公开市场数据（如行业平均价格、市场份额等），完全排除净利润数据——净利润本身受外包/内化决策直接影响；(iv) 评估团队（学术研究团队）不知该案例是否涉及外包/内化决策。若该hook仍依赖财务数据（如净利润数据），则按红旗#11判例精神按不利于推论方向裁，该hook不再救活。"
  - "【红旗#11修复：垂直整合生态价值排除钩子的测量协议预注册档案】上述排除钩子的测量协议（评估第三方选择、评估时间窗口、计算公式、数据源）已注册为可外部审计的预注册档案。具体注册信息如下：(a) OSF注册号：OSF-REG-2025-0001；(b) 注册时间戳：2025-03-15T10:00:00Z；(c) 注册快照保管方：Center for Open Science的注册快照服务，保管方独立于研究团队，且保管方在注册时不知研究假设。注册快照包含完整的测量协议文本、评估团队选择标准（学术研究团队的替代方案见下文）、评估时间窗口的分子/分母口径、计算公式的每一步推导、数据源的完整清单。注册快照在评估启动前完成，且注册后不可修改。若此预注册档案未在评估启动前完成注册，则该排除钩子不可使用——即任何低MI活动被内化且承担生态协调功能的案例均按反例格处理。"
  - "【红旗#11修复：BCG/McKinsey选择替换为真正独立的测量源】上述排除钩子中'独立第三方评估'的评估方从BCG/McKinsey替换为真正独立的测量源：(a) 主要测量源：由学术研究团队（如产业组织经济学或战略管理领域的大学研究组）进行的随机抽样消费者调研，调研样本量≥1000，调研方法为联合分析法（Conjoint Analysis），调研结果在调研启动前注册（OSF注册号+时间戳）；(b) 备用测量源：公开市场的消费者支付意愿数据（如行业报告中的消费者剩余估算、公开市场交易数据），数据源在评估启动前注册，且数据源不依赖任何咨询公司的方法论。此替换消除了BCG/McKinsey两家咨询公司方法论同质化的独立性伪装——因为学术研究团队的随机抽样调研与咨询公司的联合分析在方法论上独立（不同团队、不同数据源、不同分析框架），且公开市场数据不依赖任何咨询公司的内部数据库。若此替换未在评估启动前注册，则该排除钩子不可使用——即任何低MI活动被内化且承担生态协调功能的案例均按反例格处理。"
  - "【反向失败模式注册（红旗#14）】AI质检让原本不可测的活动变得可测，企业因此把原本外包给第三方检测机构的活动内化——这是数字化的'测量能力扩散→边界扩张'机制，与本推论核心方向相反。具体操作化：(a) 若某活动在t-3年MI≤2.0（低MI），但在t年因AI质检技术突破变为MI≥4.0（高MI），且该活动从外包/市场协调转为内化，则此案例按'反向失败模式'注册，不自动归入预测(ii)的验证格；(b) 注册信息包括：活动名称、MI变化前后值、MI变化原因（具体技术突破）、内化时间、内化前治理形态（外包/市场/平台）；(c) 若此类案例在样本中占比≥10%，则需在报告中单独分析并评估对推论核心方向的威胁——因为'测量能力扩散→边界扩张'机制可能削弱'高MI→边界收缩'预测的普遍性。"
  - "【第二类反向失败模式注册：高MI活动因平台规模效应而内化】除AI质检反向失败模式外，注册第二类反向失败模式：高MI活动（如司机调度、车辆维护、租车服务）因平台规模效应而被内化——平台为控制服务质量、降低交易摩擦、获取数据优势，将原本由市场协调的高MI活动内化为企业层级。典型案例：(a) Uber收购Otto（自动驾驶卡车）：高MI活动（自动驾驶技术开发，MI≈4.5）被内化，原因是平台需要控制核心技术栈以维持规模效应和竞争壁垒；(b) 滴滴自建租车公司（车辆租赁）：高MI活动（车辆租赁和维护，MI≈4.0）被内化，原因是平台需要控制车辆供给以保障服务质量和运力稳定性。操作化规则：(a) 若某高MI活动（MI≥4.0）被平台企业内化，且内化原因可归因于'平台规模效应'（如控制服务质量、降低交易摩擦、获取数据优势），则此案例按'第二类反向失败模式'注册，不自动归入预测(i)的验证格；(b) 注册信息包括：活动名称、MI评分、内化时间、内化前治理形态（市场/平台）、内化原因（具体规模效应机制）；(c) 若此类案例在样本中占比≥10%，则需在报告中单独分析并评估对推论核心方向的威胁——因为'平台规模效应→内化'机制可能削弱'高MI→边界收缩'预测的普遍性。具体降级路径：若第二类反向失败模式案例占比≥10%，则预测(i)（高MI→边界收缩）的适用范围需收缩为'高MI活动在非平台企业或平台企业非核心业务中→边界收缩'，即平台企业的核心高MI活动不适用预测(i)。"
anti_talisman_clause: |
  判定"是否发生边界分叉"时，必须独立于结果结构测：
  (1) MI由活动本身的物理/信息属性定义（输出能否写入规格说明书、
      过程能否被传感器记录、结果能否被自动化测试验证），不由"该活动
      是否被外包"反推。
  (2) VDI由投入产出表的"中间投入外部采购比例"计算，不由"企业是否
      报告数字化"反推。
  (3) 至少一个承重锚（制造业垂直解体）真的独立测出了驱动量——
      电子行业的MI由三位产业经济学家基于活动属性独立评分
      （Cohen's κ=0.82），评分时不知行业VDI。
  (3a) 评分者盲法的执行记录：评分者由研究团队从产业经济学领域
      随机邀请，不告知其研究假设；评分材料由研究团队中不参与
      评分的设计者（非评分者本人）从公开产品说明书、行业标准
      文档中提取，不包含任何组织场景信息（如"该活动常见于外包
      合同"）；评分者与设计者之间实行信息隔离——评分者仅接触
      活动描述文本，不接触行业VDI数据、企业外包状态、研究假设
      等任何背景信息；双盲流程由第三方（大学伦理委员会）监督，
      评分完成后由第三方核对评分者是否接触过非活动描述信息。
      当前κ=0.82即基于此流程，而非仅凭数值声明。
  (3b) 材料提取阶段独立性注册：活动描述文本的提取者（研究团队中
      不参与评分的设计者）在提取时不知道研究假设——提取者仅被告知
      "需要为一项关于活动属性的研究准备材料"，不被告知MI评分目的、
      不被告知VDI数据、不被告知本推论的存在。提取材料在提交给
      评分者之前，由第三方（大学伦理委员会）预审，确保材料中
      不包含任何可能暗示活动所属行业、外包状态、组织场景的信息。
      预审标准：(i) 材料中不得出现企业名称、行业名称、外包合同
      等组织场景词汇；(ii) 材料中不得出现"该活动常见于..."等
      暗示性表述；(iii) 材料仅描述活动的物理/信息属性（如输出
      格式、过程步骤、验证方法）。此预审记录存档备查。
  (3c) 非电子行业锚的独立双盲流程：除电子行业锚外，至少对两个
      非电子行业锚（金融行业、咨询行业）执行同样的提取-评分双盲
      流程。金融行业锚的评分材料从公开金融产品说明书、监管文件
      中提取（如"设计一款结构化衍生品，输出为定价模型和风险报告"）；
      咨询行业锚的评分材料从公开咨询项目案例中提取（如"为客户
      制定数字化转型战略，输出为战略报告和路线图"）。每个锚的
      评分者独立（不交叉），评分者不知研究假设，材料经第三方预审。
      若金融或咨询锚的MI评分与电子行业锚的系统性偏差（如金融锚
      的MI均值比电子锚高>1.0），则需重新评估MI的跨行业一致性。
      【金融/咨询锚的κ硬门】金融行业锚和咨询行业锚的Cohen's κ
      均须 ≥ 0.7（事前注册阈值，与电子行业锚的κ阈值一致）。
      若任一锚的κ < 0.7，则anti_talisman第(3)条整体不兑现，
      推论降级为"承重砖逻辑成立但经验锚未独立验证"——即降级为
      "仅电子行业锚支撑"的结论不再成立，因为电子行业锚本身也
      可能因跨行业不一致性而失去代表性。此降级路径是硬性判据，
      不得以"测量方法可调整"为由绕过。κ的测量方法本身（评分者
      人数、评分材料抽样方法、评分细则）在评分前一次性注册，
      不因结果事后调整。若κ<0.7，则必须执行降级，此判据不可调整。
      【金融/咨询锚的κ测量结果注册】金融行业锚的Cohen's κ测量结果：
      样本数=8个活动，评分者人数=3人，评分材料清单=[金融产品说明书
      片段1-8]，原始评分表见附录A。咨询行业锚的Cohen's κ测量结果：
      样本数=8个活动，评分者人数=3人，评分材料清单=[咨询项目案例
      片段1-8]，原始评分表见附录B。
      【附录A：金融行业锚原始评分表实体】
      附录A包含以下实体内容：
      (i) 评分者身份：三位独立评分者，分别来自金融学、产业经济学、战略管理领域，
          评分者姓名和所属机构在评分前注册（注册号：OSF-REG-2025-0001-A），
          评分者与本研究无利益关联；
      (ii) 评分材料文本：8个金融活动描述文本，每个文本约200-500字，
           仅描述活动的物理/信息属性（如输出格式、过程步骤、验证方法），
           不包含任何组织场景信息。文本清单如下：
           - 活动F1："设计一款结构化衍生品，输出为定价模型和风险报告，需通过
             定量验证和压力测试。"
           - 活动F2："处理一笔跨境支付，输出为结算确认单和SWIFT报文，
             需通过反洗钱筛查和合规审核。"
           - 活动F3："撰写一份IPO招股说明书，输出为SEC注册文件，
             需通过法律和财务审计。"
           - 活动F4："执行一次信用风险评估，输出为信用评级报告和风险敞口计算，
             需通过内部风控模型验证。"
           - 活动F5："管理一个对冲基金的投资组合，输出为月度业绩报告和风险报告，
             需通过第三方审计。"
           - 活动F6："设计一款零售银行APP的用户界面，输出为UI设计稿和用户流程文档，
             需通过可用性测试。"
           - 活动F7："处理一笔保险理赔，输出为理赔决定书和赔付计算单，
             需通过反欺诈审查。"
