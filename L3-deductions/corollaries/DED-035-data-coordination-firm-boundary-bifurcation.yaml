id: DED-035
type: deduction
layer: L3-deductions
status: candidate
candidate_note: |
  【主动停留candidate——2026-07-16架构决策】三轮对抗审查(14条should修复)后
  核心机制稳固但操作化挑战内生于领域:企业边界是多因现象,单机制推论的行业层面
  可证伪性受"活动拆分弹性+多力量对冲+时滞"三重弹性约束。保留核心洞察供L4复合
  推论使用,不追求形式上凑够verified。详见review_summary与ADV-REVIEW-040。
term: "数据协调成本不对称冲击与企业边界分叉 (Data Coordination Cost Asymmetry and Firm Boundary Bifurcation)"

人话摘要: "数字数据+算法让做买卖和管公司都变便宜了,但便宜的程度不一样——能标准化、能量化的事,做买卖的成本降得比管公司更狠,所以企业把这类事外包出去;但靠信任和老师傅经验才能干的事,两边都几乎没变便宜,所以这类事反而留在企业内部甚至更要自己干。结果不是企业简单变大或变小,而是'能测的事出去、靠信任的事留下'——企业边界分叉了。"

statement: |
  【核心】数字数据+算法同时降低了企业内协调成本和市场交易成本,但降幅不对称
  ——可测量/可标准化活动的市场交易成本降幅远大于企业内协调成本降幅,而信任密集/
  默会知识密集型活动的两类成本均几乎不变。结果不是企业简单"变大"或"变小",
  而是企业边界按活动的【可测量性】分叉:可测的出去(外包/市场/平台协调),
  信任密集的留下(甚至内化更多)。

  【驱动量】活动的可测量性——该活动的输入/输出/过程能否被数据化为可验证的
  量化指标——与协调成本不对称度(市场交易成本降幅 − 企业内协调成本降幅)的
  交互。可测量性越高 → 不对称度越大 → 市场/平台协调替代企业层级的压力越强。

  【预测】(i) 可测量性越高的行业/活动,企业平均规模越小、垂直解体越明显
  (市场交易成本降幅 > 内部协调成本降幅 → 活动外包);(ii) 可测量性低+信任密集
  的行业/活动,企业规模相对稳定甚至扩大(内部协调改善但市场交易替代有限 →
  边界不变或内化);(iii) 中等可测量性区间出现"平台协调"的混合形态——不是纯
  市场也不是纯企业,算法匹配+声誉系统替代了部分层级但核心活动仍由企业内人脑执行。

  【判别】不同于"信息技术让企业变平"(单边预测,只讲内部层级压缩),本推论的
  核心新意是【不对称性】:两边的成本都降了,但降幅不同 → 边界分叉而非单向位移。
  不同于"平台经济=赢家通吃"(描述性观察),本推论给出了可测量性 → 边界位移方向
  的因果机制。不同于 BR-L2-025"数字媒介=质变"(宽泛的文明级声称),本推论是
  精确定位的单机制命题——可测量性梯度 → 边界分叉方向。

  【边界(不声称)】不声称所有行业都走向垂直解体——预测(ii)明确预测了反向;
  不声称企业作为一种组织形态会消亡——分叉意味着企业边界重塑而非消失;
  不声称可测量性是唯一驱动因素——资产专用性(Williamson)、制度环境等仍在
  作用,本推论声称的是数字化浪潮下可测量性成为新增的一阶驱动量。

operationalization:
  activity_measurability:
    definition: "一项经济活动的输入/输出/过程能否被数据化为可独立验证的量化指标的程度。"
    measurement: |
      三维度编码(在看任何行业边界数据前锁定):
      (a) 输出可测性:产出能否被量化为客观指标(如代码行数/测试覆盖率/交付件数量/
      销售额/产量/缺陷率——事前按行业标准编码);
      (b) 输入可测性:投入能否被量化(工时/原材料消耗/算力消耗——与输出同口径);
      (c) 过程可测性:生产过程中间步骤能否被传感器/日志/API追踪(如代码commit记录/
      机器传感器数据/GPS轨迹——独立于人工上报)。
      综合分 = 三维等权平均,档位:高(≥0.7)/中(0.3-0.7)/低(<0.3)。
      编码依据为行业技术特征与数据基础设施,不得由该行业的实际边界位置反推。
    limitations: |
      不同行业的三维权重可能不等(如咨询业的输出可测性天然低但输入可测性略高);
      跨行业排序的整体稳健性优先于单行业精确值。

      【权重与阈值的锚定状态(诚实标注)】等权平均(各1/3)与档位阈值(高≥0.7/
      中0.3-0.7/低<0.3)当前为零经验锚定的初始假设——不由任何行业校准数据驱动,
      纯粹是将连续测度离散化为三档的方便操作。阈值移动(如高≥0.8或中0.4-0.6)
      会将边界行业重分类,进而改变预测(i)-(iii)的验证结果。在获得行业层面的
      测量校准前,此为暂定操作值。正式验证前需承诺:(i)在见任何边界数据前完成
      编码;(ii)注册敏感性分析计划——两维度同时变动:(a)阈值敏感度:高/中/低档位
      阈值在±0.1范围内变动时,预测方向是否稳定;(b)权重敏感度:等权(各1/3)方案
      与行业特定权重方案(如咨询业输出0.2+输入0.5+过程0.3,反映咨询业输入可测性
      远高于输出的事实)的编码差异是否将边界行业重分类——若权重方案变更导致>20%
      行业换档,等权假设被拒绝,需采用行业特定权重或放弃跨行业统一编码;
      (iii)若敏感性分析显示阈值或权重选择显著影响分叉结论,等权与阈值方案被拒绝。

  coordination_cost_asymmetry:
    definition: "数字数据+算法对市场交易成本的降幅减去对企业内协调成本的降幅。正值=市场变得更划算,负值=内部协调变得更划算。"
    measurement: |
      不对称度无法直接测量(需要反事实),通过其可观测后果间接检验:
      看同一行业内,数字技术渗透前后,企业边界的实际位移方向(外包率变化/平均企业规模变化/
      垂直一体化指数变化)——由不对称度的符号与幅度预测边界方向。
      此为推论的中介变量,其存在性由预测(i)-(iii)联合检验,不由直接测量。
    limitations: |
      【结构性弱点——非普通limitation】不对称度本身不可直接观测(需要反事实:
      无数字技术时的市场交易成本与企业内协调成本),这是本推论的认识论地位降级:
      即使预测(i)-(iii)全部被数据确认,不对称度假说仍只是"与数据一致的候选
      解释之一",而非被直接验证的因果机制。均匀提升+行业时滞差异假说、管制
      差异假说均可能产生相同的观测模式。推论通过预测(ii)的"低可测性行业边界
      不动"来与均匀提升假说竞争(若仅是时滞,低可测性行业也应最终同向位移),
      但这一竞争性检验对数据的时间跨度与粒度要求远高于直接机制检验。推论存活
      依赖于竞争假说被独立拒绝——这是一种比直接证伪更弱的认识论地位,应诚实
      标注而非藏在limitation里。

  firm_boundary_position:
    definition: "一项活动在企业边界内(层级协调)还是边界外(市场/平台协调)的程度。"
    measurement: |
      三指标三角互证(口径一次性注册):
      (a) 垂直一体化指数:该行业增加值/总产出(从投入产出表获取,值高=内部化程度高);
      (b) 平均企业规模:该行业企业平均雇员数或营收(控制行业总规模);
      (c) 外包/平台渗透率:该行业内通过外部供应商或平台完成的活动占比
      (按交易额统计)。数据源已锁定(一次性注册,不得按结果选源):
      首选=投入产出表(BEA行业投入产出账户/中国国家统计局投入产出表)的
      中间投入/总产出比——该指标直接反映行业从外部购买中间品的比例,
      定义稳定、跨行业可比、不受行业报告方法论差异影响。
      后备=IBISWorld行业外包率报告(仅当投入产出表粒度不足或行业边界
      与NAICS不匹配时启用,不得因首选源结果不显著而切换)。
      三个指标独立测量,按预测方向应同向变动(高可测性→垂直一体化↓+规模↓+外包率↑)。
    limitations: "企业规模受并购/反垄断/资本市场周期等非协调成本因素影响;
    投入产出表的行业分类粒度可能掩盖亚行业分叉;三指标三角互证降低单指标噪声。"

derivation:
  from_l1:
    axioms: [AXIOM-002]
    theorems: [THEOREM-hierarchy-depth-limit, THEOREM-cooperation-precondition]
  from_l2:
    bridging: [BR-L2-001, BR-L2-009, BR-L2-010]
  from_l3:
    deductions: [DED-001, DED-006]
  steps: |
    1. "Coase 基线:企业边界由市场交易成本与企业内协调成本的相对高低决定"
       Coase(1937) 确立了分析的基准框架——一项活动是在企业内做还是通过市场做,
       取决于两种协调方式的相对成本。数字数据+算法改变了这个方程的两边。

    2. "左边(企业内协调成本):DED-001——数字通信抬高了层级天花板但未消除层级逻辑"
       DED-001 确立:纯口头组织 ~5-7 级天花板,形式化信息系统(文字/印刷/数字)
       可提升信息保真率 r 或减少层级数 n,从而移动天花板。数字通信(DED-001 的
       "形式化信息系统"在数字时代的版本——即时通讯/协作文档/ERP)使信息逐层
       失真率大幅下降,企业理论上可以更大、层级可以更深。此步给出:数字技术
       降低了企业内协调成本——但降低的是"信息传递失真"这一项,不是所有协调成本。

    3. "右边(市场交易成本):BR-L2-010——算法成为新型制度基础设施"
       BR-L2-010 确立:非人格化制度能替代人际信任支撑陌生人交换。算法将这一逻辑
       加速并自动化——搜索成本崩塌(搜索引擎/推荐算法替代人工搜寻交易对手),
       匹配成本崩塌(平台算法实时撮合替代谈判),监控成本崩塌(声誉数据化替代
       重复博弈积累信任),执行成本崩塌(智能合约/平台裁决替代法院执行)。
       此步给出:数字技术降低了市场交易成本——且降幅可能远超企业内协调成本,
       因为市场交易成本的原始基数中"信息摩擦"占比更高。

    4. "不对称性来源一:BR-L2-009——人际信任有界且随社会距离衰减,算法不能替代信任建立"
       BR-L2-009 确立:信任随社会距离(血亲→熟人→同乡→匿名陌生人)陡降,
       且信任建立需要重复交互与共享经验——这不是信息问题,是关系问题。
       算法能替代搜索/匹配/监控(这些都是信息问题),但不能替代"交情"
       (THEOREM-cooperation-precondition:没交情的陌生人合作脆弱)。
       当活动涉及信任密集型交易(如战略咨询/法律服务/风险投资——交易标的大、
       信息不对称严重、需要长期关系背书),市场交易成本降幅远小于可标准化活动。
       此步给出不对称性的第一个来源:信任不可算法化 → 信任密集型活动的
       市场交易成本降幅受限。

    5. "不对称性来源二:BR-L2-001——有限理性与默会知识的不可编码性"
       BR-L2-001 确立:人脑算不过来,只能"够用就行"。当活动涉及不可编码的
       默会知识(Polanyi:"我们知道的比我们能说出来的多")——如手艺人的手感、
       医生的临床直觉、管理者的判断力——时,算法无法将其数据化,人脑仍是必选
       中介。不可编码 → 不可测量 → 市场交易成本中的信息不对称无法被算法消解。
       此步给出不对称性的第二个来源:默会知识不可编码 → 低可测量性活动的
       市场交易成本降幅受 BR-L2-001 的认知天花板约束。

    6. "合成:可测量性梯度 → 协调成本不对称度 → 企业边界分叉"
       步骤2(企业内成本降)+步骤3(市场成本降)+步骤4-5(不对称性来源)→
       完整机制:对于高可测量性活动(软件外包/制造代工/物流配送),
       市场交易成本中的搜索/匹配/监控项塌缩,而企业内协调成本中的
       "信息传递失真"项的改善幅度有限(层级逻辑仍在,只是失真率降低)→
       不对称度为正 → 活动被拉出企业边界。
       对于低可测量性活动(战略咨询/法律服务/研发/管理决策),
       市场交易成本中的信息不对称无法被算法消解(默会知识+信任壁垒)→
       不对称度趋近于零 → 活动留在企业内,甚至因企业内协调有所改善而扩大边界。
       中等可测量性区间 → 出现"平台协调"混合形态:算法替代了搜索/匹配/监控
       但核心判断仍由企业内人脑执行(如 Uber 调度算法+司机独立承包,
       但定价/安全/合规等核心决策仍在平台企业中)。

    7. "非平凡性(逐格判空)"
       2×2 判据表见 nontriviality_test。承重砖各自的边际贡献诚实点名:
       DED-001 给出左边(企业内协调成本降)——但它只预测"企业可以更大",
       不预测"某些活动会出去";
       BR-L2-010 给出右边(市场交易成本降)——但它只预测"更多交易走市场",
       不预测"留在企业内的活动边界稳定甚至扩大";
       BR-L2-009 提供不对称性的信任侧上限——它说的是"信任不能无限扩展",
       不等于"企业边界分叉";
       BR-L2-001 提供不对称性的认知侧上限——它说的是"人脑算不过来",
       不等于"可测量性梯度驱动边界方向";
       DED-006 提供信任外化的框架——它说的是"信任可以从人际外化到制度",
       不预测"外化程度随可测量性梯度变化"。
       没有任何一块砖写有"数字化使企业边界按可测量性分叉"这一结论——
       分叉需要不对称性+梯度两个增量,均来自砖的焊接而非任何单砖。

falsifiability: |
  本推论可被以下发现证伪:
  (a) 可测量性梯度无预测力:跨行业统计(控制资本密集度/管制/资产专用性)
  下,高可测量性行业的企业边界(垂直一体化指数/平均规模/外包率)与低可测量性
  行业【无显著差异】,或差异方向与本推论预测相反 → 核心机制被推翻。
  (b) 低可测量性行业也大规模外包:若信任密集/默会知识密集型行业(管理咨询/
  法律服务/战略研发)出现系统性的垂直解体与外包(且不是IT/后勤等辅助职能,
  而是核心业务活动),则不对称性上限(BR-L2-009+BR-L2-001)被推翻 → 降格为
  "数字化使所有活动都更市场化"的平凡命题,分叉主张失效。
  (c) 高可测量性行业企业规模反而扩大:若软件/制造代工/物流等可测性高的行业
  出现显著的企业集中度上升(控制并购与反垄断因素),则 DED-001 侧的内部协调
  改善压过了 BR-L2-010 侧的市场交易成本下降 → 不对称度符号反转,推论的核心
  方向预测被推翻。
  适用区间:覆盖可测量性可编码的行业;完全非正式经济(无企业形态)不在射程内。

falsification_trace:
  primary_suspect: |
    不对称度假说本身——市场交易成本降幅 > 企业内协调成本降幅(对高可测量性
    活动)。这一归因面临两重替代解释:(1) 均匀提升假说:数字技术均匀降低了
    所有协调成本,观察到的分叉只是不同行业对同一技术浪潮的时滞差异(有些行业
    外包先行,有些滞后但最终会同向位移),不是结构性不对称;(2) 制度/管制假说:
    观察到的边界位移由行业管制松紧差异驱动(可测性高的行业恰好管制更松),
    可测量性是伴随变量而非原因。推论通过预测(ii)来锚定不对称性:若纯时滞,
    低可测性行业应最终同向位移,不会"边界稳定甚至扩大";若纯管制,控制管制
    后分叉应消失。

    【认识论地位诚实标注】不对称度假说本身不可直接证伪(中介变量不可观测,
    见 operationalization.coordination_cost_asymmetry.limitations 的结构性
    弱点声明)。推论存活依赖于竞争假说被独立拒绝——这是一种比直接证伪更弱
    的认识论地位。若上述替代解释成立,不对称度假说被 Occam 剃刀削掉。
  secondary_suspect: |
    可测量性编码的可靠性——将"管理咨询"编码为低可测性、"软件"编码为高可测性
    的直觉可能经不起细看(咨询的某些产出可量化——如项目交付文档数;软件的某些
    核心难以量化——如架构设计的质量)。若可测量性编码的跨编码者信度低,或
    编码方向与边界位移的对齐对编码细粒度敏感,则驱动量操作化失败。
  unlikely_suspect: |
    Coase 基线(企业边界由相对协调成本决定)与 THEOREM-hierarchy-depth-limit
    (信息逐层衰减)在理论与经验上均稳固,极少被推翻。AXIOM-002(信息熵增)是
    L0/L1 根基,不受本条命运影响。
  note: "primary 若被坐实(均匀提升而非不对称),推论降格为'数字化促进分工深化'
  这一弱得多的命题;但预测(iii)的平台混合形态仍可作为独立现象存留。"

excluded_outcomes:
  - outcome: "企业作为一种组织形态消亡"
    description: "本推论预测分叉(有些活动出去、有些留下甚至扩大),不预测企业消亡。"
  - outcome: "完全非正式经济中的生产活动(无企业形态可谈)"
    description: "射程限于有'企业边界'可言的经济体;非正式经济/自给自足的边界位移不在射程内。"
  - outcome: "企业内部管理实践的具体变化(如是否采用OKR/KPI)"
    description: "本推论射程限于'活动在企业边界内还是外',不射程内管理工具的选择。"
  - outcome: "平台企业的自身边界(平台公司本身的规模与边界)"
    description: "平台企业的边界本身受同一机制约束但平台作为'协调基础设施'的双重身份使分析复杂化——这是 L4 复合推论的射程(见 L4-014),本 L3 单机制推论不覆盖。"

anti_talisman_clause: |
  【防不可证伪护身符——禁止由结果反推前件】
  (1) 禁止由"该行业外包率上升了"反推"该行业可测量性必然高"——可测量性编码
  必须独立于边界位移结果,按行业技术特征与数据基础设施在见数据前锁定。

  【执行层面诚实标注】可测量性独立编码的"独立性"在实践中是程度问题而非二元
  状态:高可测性行业(软件/制造代工/物流)正是因其高度碎片化和外包化,才产生
  了大量公开可追踪的量化痕迹(GitHub/API日志/MES传感器/物流追踪)。编码者
  即使"不看边界数据",也无法免疫"该行业以碎片化/外包化著称"这一常识知识——
  此为知识污染,无法通过措辞完全消除。缓解措施:注册事后检验——若编码者间
  信度(inter-coder reliability)低于0.7,编码方案需重新校准;且至少一位编码者
  应来自不熟悉该行业边界现状的领域(降低常识污染)。
  (2) 禁止由"该行业没外包"反推"该行业信任密集/默会知识密集"——低外包率可能
  由管制壁垒/资产专用性/路径依赖驱动,不得自动归因为可测量性低。
  (3) 禁止用"该活动其实有隐性信任维度"消解高可测性行业未外包的反例——除非
  该信任维度有独立于边界位置的测量(如独立编码的信任密集度评级/交易标的大小的
  客观度量/行业调查中的信任依赖度自报)。
  (4) 不对称度本身不可直接测量(需要反事实),推论的核心存活依赖于预测(ii)的
  "低可测性行业边界不动"来与"均匀提升假说"竞争——若低可测性行业边界也同向
  位移(只是时滞),(a)被削弱的信号明显。

  (5) 【活动拆分弹性防逃逸】推论预测单元为"行业/活动",但任何行业均可将活动
  拆分为子活动(核心vs辅助、可测子活动vs信任密集子活动)——r1/r2反例猎捕中
  "活动拆分"反复出现(会计审计的核心判断vs合规文书、医疗的远程诊疗vs医院
  并购、EDA的核心算法vs技术支持),构成贯通模式。若事后拆分使任何行业的边界
  位移都可与预测一致(可测子活动出去+信任密集子活动留下=行业层面"分叉"),
  推论在行业层面不可证伪。防止措施:在见任何边界数据前注册各行业的【不可再拆
  的活动单元】列表(NAICS 4-digit或同等粒度),含判定"行业层面边界分叉"的
  操作标准——外包率变化的效应量阈值+垂直一体化指数变化方向+至少2/3指标同向。
  若事后需更细粒度分析,须作为独立的新检验注册而非对原检验的事后解释。

nontriviality_test: |
  2×2 判据表(自变量档:活动可测量性 高 vs 低 × 被预测量档:
  企业边界位移方向 向外(外包/市场/平台) vs 向内/不动(内化/维持/扩大)):

  格(高可测量性, 边界向外)——「非平凡格」——没有任何承重砖平凡地强制它:
  DED-001 单独看预测"企业可以更大"(内部协调改善→内化更多),与此格方向相反;
  BR-L2-010 单独看预测"更多交易走市场",但不指定哪些交易、哪个方向;
  BR-L2-009 + BR-L2-001 设定了不对称性的上限但自身不产生"分叉"预测。
  只有当 DED-001(左边成本降) + BR-L2-010(右边成本降更多) + BR-L2-009+BR-L2-001
  (不对称性的信任与认知上限)四砖焊接时,才产生"可测性高的活动 → 不对称度为正 →
  边界向外"这一方向性预测。该格可被现实反例填充——若存在可测性高但企业规模
  持续扩大/垂直一体化加深的行业(控制管制与资产专用性),此格被填上、推论被削弱。

  格(低可测量性, 边界向内/不动)——「另一非平凡格」——同样是四砖合力的产物。
  单看 DED-001:低可测性行业内部协调改善也应带来"企业可以更大"——方向与此格
  自洽,但 DED-001 没有"因为可测量性低所以内部协调改善相对更显著(相比市场交易
  成本改善)"的比较级含义。单看 BR-L2-010:没有预测"某些行业市场交易成本降幅
  有限"。此格的独特性来自不对称性——正是因为信任密集型+默会知识密集型活动的
  市场侧降幅被 BR-L2-009+BR-L2-001 封顶,而企业内侧仍有 DED-001 的改善,
  才产生"留在内部甚至更内化"的净效果。

  格(高可测量性, 边界向内)——【如果被大量填充,证伪本推论】——此格的填充意味着
  不对称度符号反转(DED-001 内部改善压过 BR-L2-010 市场改善),需要解释为什么
  企业内协调成本降幅大于市场交易成本降幅。

  格(低可测量性, 边界向外)——【如果被大量填充,证伪不对称性上限】——此格意味着
  BR-L2-009+BR-L2-001 的上限被突破,算法找到了替代信任与默会知识的方法。

  brick=conclusion 自查:"数字数据使企业边界按活动可测量性分叉"这一结论未在
  任何承重砖中原文或近义出现。DED-001 不预测边界分叉;DED-006 不预测分叉;
  BR-L2-010 不预测分叉方向;BR-L2-009 不预测组织后果;BR-L2-001 不预测边界位移。
  无为本推论窄化的专用砖。

real_world_anchors:
  supporting:
    - anchor: "软件/IT行业:API经济与开源生态下的极端垂直解体(高可测性,预测 i)"
      evidence: |
        软件开发是数字化时代可测量性最高的经济活动之一——输入(code commit次数/
        行数/PR数)/过程(Git日志/CI流水线/代码审查记录)/输出(测试覆盖率/构建
        产物/API调用次数)全部可被机器追踪与量化。
        行业表现:从1990年代的垂直一体化软件巨头(IBM/Microsoft自研全栈)到
        2010年代的API经济+开源+云服务——企业边界极度收缩。单个开发者或小团队
        通过组合外部API(GitHub Copilot/AWS Lambda/Stripe/OpenAI API)即可
        交付完整产品,"公司"作为协调中介的必要性在可测性最高的环节(代码生产/
        测试/部署)显著下降。npm/PyPI 包的模块粒度(平均 <500 行)与跨组织依赖
        (单个应用依赖数百个外部包)是垂直解体的结构性证据。
        诚实标注:软件行业同时受网络效应与标准化(API 接口的技术标准化降低了
        资产专用性)驱动,不全是可测量性在起作用——可测量性贡献与标准化贡献
        需要跨行业比较来分离。
      confidence: moderate
    - anchor: "电子制造代工:富士康/台积电模式——可测性中高区间,垂直解体明显(预测 i)"
      evidence: |
        电子产品制造的可测量性较高——良率/产能/缺陷率/交付准时率等指标可被
        MES(制造执行系统)实时追踪与跨组织共享。结果:从垂直一体化的"设计+制造"
        (IBM/AT&T贝尔实验室模式)解体为"无晶圆设计(Fabless)+代工(Foundry)"
        两层——台积电/富士康等代工厂的存在本身就是企业边界分叉的产物。
        驱动量的独立测量:纯晶圆代工模式(foundry model)的里程碑早于MES/ERP
        普及——TSMC 成立于1987年(全球首家纯代工厂),Fabless先驱Xilinx(1984)/
        Qualcomm(1985)/NVIDIA(1993)均在MES/ERP普及(1990s-2000s)前已出现。
        垂直解体的主要驱动力是资本成本(建晶圆厂越来越贵,~$10B/座)和专业化
        收益,可测量性(良率/产能传感器化)是使能条件(enabler)而非触发条件
        (trigger):它使已发生的垂直解体可管理、可扩展,而非首先触发了这一解体。
        因果方向更可能是"资本成本+专业化→垂直解体,可测量性使这种解体在
        更大规模上可运作"——而非文件此前暗示的"可测量性提高→垂直解体"。
      confidence: moderate
    - anchor: "法律服务:信任密集+默会知识→大型律所边界稳定甚至扩大(低可测性,预测 ii)"
      evidence: |
        法律服务的可测量性整体偏低——核心活动(法律策略/庭审辩护/并购谈判)
        涉及大量默会知识与客户信任,无法被标准化为量化指标。该行业在数字化
        浪潮中未出现类似软件业的外包/垂直解体:AmLaw 100 律所的平均律师数
        与收入集中度在过去20年中稳中有升(尽管文档审查/电子取证等辅助环节
        已部分外包/自动化,但核心判断仍在企业边界内)。与软件业的对比构成
        同一数字浪潮下不同行业的自然实验。
        诚实标注:法律服务受执业许可/地域管辖等管制壁垒保护,部分抵制了
        市场化的压力——管制效应与可测量性效应混杂。需以"管制松但可测性低"
        的行业(如管理咨询)作为补充对照。
      confidence: low
    - anchor: "管理咨询:默会知识密集→大型咨询公司边界稳(低可测性+低管制,预测 ii)"
      evidence: |
        管理咨询的管制壁垒低(无需执业许可),但核心活动(战略诊断/组织设计/
        变革管理)的可测量性极低——产出难以量化为独立可验证的指标,高度依赖
        合伙人的人际信任与声誉。在低管制+低可测性的双重条件下,行业未出现
        垂直解体:MBB(McKinsey/Bain/BCG)等大型咨询公司持续主导,独立咨询师
        虽存在但集中于执行层(落地实施)而非战略层。这构成预测(ii)的较干净
        对照——管制低但可测性低 → 边界不动,机制指向可测量性而非管制。
      confidence: low
  counterexamples: []
  boundary_cases:
    - case: "金融科技(Fintech):高管制+中高可测性,银行的部分活动外包但核心留在内部"
      analysis: |
        银行的部分活动(支付处理/信贷评估/客服)可测性高,已大量外包/平台化
        (Stripe/支付宝/智能客服)——与预测(i)一致。但核心活动(资产负债管理/
        风险建模/监管合规判断)涉及信任与默会知识,仍留在银行内部——与预测(ii)
        一致。同一企业内不同活动的分叉正是本推论的预测:Fintech 产业不是
        "银行解体了",而是"银行的活动按可测性分叉了"。
      status: boundary_case

discriminant_validity: |
  【独有可证伪预测】相对相邻理论逐一判别——
  (1) vs "信息技术让企业变平/去层级化"(DED-001 的朴素延伸):此说预测所有企业
  单向扁平化——内部层级减少、但边界不变或扩大(因为内部协调更好了)。本推论
  预测的不是"变平"而是"分叉"——有些活动连边界都出去了,不是层级少了。
  可判别:若高可测性行业的企业规模在缩小(垂直解体)而低可测性行业的企业规模
  在稳定或扩大,支持分叉反对均平(均平意味着所有行业企业均变平但边界不变)。

  (2) vs "平台经济=赢家通吃"(描述性观察):此说描述平台的网络效应与集中度,
  不给"什么样的活动会被平台化"的因果判据。本推论给出可测量性 → 边界方向
  的机制,可事前预测哪些行业更可能被平台协调替代。

  (3) vs BR-L2-025"数字媒介使信息变为活物"(宽泛文明级声称):BR-L2-025 声称
  数字可处理性是质变,但不做"这条质变不同行业的组织后果不同"的比较静态。
  本推论在此基础上做了比较静态:质变的效果随可测量性梯度而变。

  (4) vs Williamson 交易成本经济学:Williamson 给出资产专用性/不确定性/交易
  频率三维度解释企业边界——这是前数字时代的基准。本推论不否认这些维度,
  而是增加了一个数字时代新凸显的维度(可测量性),并给出了它与不对称性的
  交互机制——数字化同时改变了方程两边,净效果取决于可测量性。

  【防平凡化守卫】非平凡内核精确定位:(a) 不对称性——市场交易成本降幅 > 企业内
  协调成本降幅(对可测性高的活动),而不是"两边都降了一些";(b) 分叉——可测性
  高的出去、信任密集的留下(甚至扩大),而不是单向的"市场扩大"或"企业变大";
  (c) 可测量性作为新增一阶驱动量的因果梯度——三个可独立检验的比较静态预测。
  不与"数字化降低交易成本"这一常识性声称混淆。

review_summary: |
  【三轮审查后主动停留 candidate——2026-07-16 架构决策】
  r1→5 should→r2→3 should→r3→6 should。三轮共修14条should级缺陷,
  核心机制(brick=conclusion/非平凡性/测量正交性)从未被攻破,反例猎捕
  无净杀。但操作化层面呈现"打地鼠"模式:每次修复露出新口子(NAICS
  异质性逃逸/构念效度偏差/零锚参数增生)。根因:企业边界是多因现象
  (资产专用性+管制+网络效应+资本市场周期+可测量性),单机制推论的
  行业层面可证伪性因"活动拆分弹性+多力量对冲+时滞"三重弹性而低于
  文件声称水平——这不是逻辑缺陷(DED-004未复发),是领域内生的测量
  挑战。决定:主动停留candidate,诚实标注操作化挑战,不追求形式上凑够
  verified。核心洞察(可测量性梯度→不对称度→分叉方向)保留供后续
  L4复合推论使用——在L4层面,多机制合力可以消化单机制无法消化的
  行业层面弹性。全档见ADV-REVIEW-040(三轮完整记录)。

