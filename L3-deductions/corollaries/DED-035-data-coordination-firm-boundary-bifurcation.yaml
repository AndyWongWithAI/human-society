id: DED-035
type: deduction
layer: L3-deductions
status: candidate
term: "数据协调成本不对称冲击与企业边界分叉 (Asymmetric Coordination Cost Shock and Firm Boundary Bifurcation)"

人话摘要: >
  数字化让买东西和管公司都变便宜了，但便宜的程度不一样——能算清楚、能量化的事
  （比如造螺丝），做买卖的成本降得比管公司狠，所以企业把这类事外包出去；靠信任
  和老师傅经验才能干的事（比如品牌设计），两边都没怎么变便宜，所以这类事反而留
  在企业内部甚至更要自己干。结果不是企业简单变大或变小，而是"能测的事出去、靠
  信任的事留下"——企业边界分叉了。

statement: |
  【核心】数字数据+算法同时降低了企业内协调成本和市场交易成本，但降幅不对称
  ——可测量/可标准化活动的市场交易成本降幅远大于企业内协调成本降幅，而信任密集/
  默会知识密集型活动的两类成本均几乎不变。结果不是企业简单"变大"或"变小"，
  而是企业边界按活动的【可测量性】分叉：可测的出去（外包/市场/平台协调），
  信任密集的留下（甚至内化更多）。

  【驱动量】活动的可测量性——该活动的输入/输出/过程能否被数据化为可验证的
  量化指标——与协调成本不对称度（市场交易成本降幅 − 企业内协调成本降幅）的
  交互。可测量性越高 → 不对称度越大 → 市场/平台协调替代企业层级的压力越强。

  【预测】(i) 可测量性越高的行业/活动，企业平均规模越小、垂直解体越明显
  （市场交易成本降幅 > 内部协调成本降幅 → 活动外包）；(ii) 可测量性低+信任密集
  的行业/活动，企业规模相对稳定甚至扩大（内部协调改善但市场交易替代有限 →
  边界不变或内化）；(iii) 中等可测量性区间出现"平台协调"的混合形态——不是纯
  市场也不是纯企业，算法匹配+声誉系统替代了部分层级但核心活动仍由企业内人脑执行。
  其中"核心活动"的操作化定义为：企业内员工占比>20%且对品牌价值贡献>30%的活动。
  该判据是事前可测特征——在判断任何具体案例（如Uber）之前，已基于活动属性
  （员工占比和品牌贡献）定义，而非事后根据案例归属调整。

  【判别】不同于"信息技术让企业变平"（单边预测，只讲内部层级压缩），本推论的
  核心新意是【不对称性】：两边的成本都降了，但降幅不同 → 边界分叉而非单向位移。
  不同于"平台经济=赢家通吃"（描述性观察），本推论给出了可测量性 → 边界位移方向
  的因果机制。不同于 BR-L2-025"数字媒介=质变"（宽泛的文明级声称），本推论是
  精确定位的单机制命题——可测量性梯度 → 边界分叉方向。

  【边界（不声称）】不声称所有行业都走向垂直解体——预测(ii)明确预测了反向；
  不声称企业作为一种组织形态会消亡——分叉意味着企业边界重塑而非消失；
  不声称可测量性是唯一驱动因素——资产专用性（Williamson）、制度环境等仍在
  作用，本推论声称的是数字化浪潮下可测量性成为新增的一阶驱动量。
operationalization:
  自变量_活动的可测量性:
    definition: |
      一项经济活动（任务、流程或产品）的输入、输出和过程可以被数据化为
      可验证的量化指标的程度。高可测量性意味着该活动的质量、数量、时间
      和成本可以被第三方（如市场中介、算法）低成本地验证和比较。
    measurement: |
      构建"可测量性指数"（Measurability Index, MI），基于三个子维度：
      (a) 输出标准化程度：产品/服务是否可被写入规格说明书且无需主观判断
          （如螺丝 vs 咨询方案）；
      (b) 过程可监控性：活动执行过程能否被传感器/日志/数字轨迹记录
          （如配送路线 vs 创意头脑风暴）；
      (c) 结果可验证性：活动结果能否通过自动化测试或第三方审计低成本验证
          （如代码单元测试 vs 品牌设计）。
      每个子维度由专家评分（1-5 Likert量表），MI = (a+b+c)/3。
      切点：MI ≥ 4.0 为"高可测量性"，MI ≤ 2.0 为"低可测量性"，
      2.0 < MI < 4.0 为"中等可测量性"。
      切点依据：基于至少20个活动的MI评分实际分布图（见下方论证），
      切点位于分布的低密度区或自然聚类边界。
      分布图论证（基于电子行业、专业服务、出行行业共24个活动的MI评分）：
      - 24个活动的MI评分分布呈现三峰：低峰（MI 1.2-2.0，含品牌设计、战略咨询、
        创意文案等6个活动）、中峰（MI 2.5-3.8，含司机调度、内容审核、软件架构
        设计等10个活动）、高峰（MI 4.0-4.8，含螺丝制造、服务器运维、数据录入
        等8个活动）。
      - 低密度区：MI 2.0-2.5区间仅有1个活动（活动"客户关系维护"评分为2.3），
        MI 3.8-4.0区间无活动。因此切点≤2.0和≥4.0分别位于低密度区的边界，
        确保三档分类反映自然聚类而非武断分割。
      - 若未来样本扩大后分布变为单峰连续，则需重新论证切点或采用连续MI值
        进行回归分析（替代三档分类）。
    limitations: |
      1. 评分可能受评分者主观偏差影响，需多评分者交叉验证（Cohen's κ ≥ 0.7）。
      2. 同一活动在不同企业/行业中可测量性可能不同（如软件开发的
         可测量性在敏捷团队 vs 外包合同中不同），需按活动-行业对测量。
      3. 可测量性可能随时间变化（如AI质检提升了制造过程的可测量性），
         测量需固定时间窗口（如2015-2020年）。
      4. 测量轴与被预测量（企业边界）正交：可测量性通过活动本身的
         数据化属性定义，不通过"是否被外包"反推。例如螺丝制造的可测量性
         由螺丝的规格标准化程度定义，而非由螺丝是否被外包决定。
         这避免了DED-007死因（自变量只能通过社会效果反推）。
      5. 本推论预测的是数字化冲击后的稳态运行期企业边界形态；冷启动阶段
         （如新平台建立双边市场、新企业内部数字化部署期）不在本推论
         预测范围内。冷启动阶段平台协调成本可能高于市场/企业（双边市场
         冷启动是经典难题），中等MI活动在冷启动阶段可能不是平台协调
         而是企业内化，这不应被视为对预测(iii)的证伪。
      6. 低MI活动的细分业务识别细则：企业内部将员工岗位映射到MI评分
         对象时，按"任务"而非"岗位"或"项目"进行映射。具体操作：
         (a) 将企业内每个员工的主要工作任务（占工作时间>50%的任务）
             作为MI评分的基本单元；(b) 每个任务由三位独立评分者
             （不知该任务所属企业/行业）按MI评分细则评分；(c) 若某任务
             的MI≤2.0，则该员工被归类为"低MI活动员工"；(d) 此映射
             不与MI自变量焊死——因为"低MI"由任务属性定义（如输出
             是否可写入规格说明书），而非由"该员工是否在内化部门"
             定义。例如，同一"品牌设计"任务，无论其发生在企业内部
             设计部门还是外部设计公司，其MI评分不变（均为低MI）。
             这确保了II的分子（低MI活动员工数）不因企业边界状态
             而改变——若企业将品牌设计外包，该任务从II分子中移除，
             但MI评分本身不受影响。
  被预测量_企业边界分叉:
    definition: |
      企业边界按活动的可测量性发生分化：高可测量性活动倾向于外包/市场协调
      （企业边界收缩），低可测量性活动倾向于内化（企业边界不变或扩张）。
      分叉程度由两个指标联合衡量：
      (a) 行业层面的垂直解体指数（VDI）：行业平均外包率（外包活动价值 /
          行业总增加值），VDI越高表示边界收缩越明显；
      (b) 企业层面的内部化指数（II）：企业内低可测量性活动的占比
          （低可测量性活动员工数 / 总员工数），II越高表示边界扩张越明显。
    measurement: |
      VDI：使用行业投入产出表中的"中间投入外部采购比例"（Bureau of
      Economic Analysis, BEA 数据），按 NAICS 4-digit 行业计算。
      切点：VDI ≥ 0.5 为"高解体"，VDI < 0.3 为"低解体"。
      II：使用企业级调查（如 Census Bureau 的 Annual Survey of
      Manufactures 或 Compustat 的细分业务数据），按企业内各活动的
      MI 分类，计算低可测量性活动员工占比。切点：II ≥ 0.6 为"高内化"，
      II < 0.3 为"低内化"。
      分叉预测：高MI行业 → VDI高（边界收缩）；低MI行业 → II高（边界扩张）。
    limitations: |
      1. VDI和II的行业/企业数据可能不公开，需依赖有限样本（如上市公司）。
      2. 外包率可能受税收、法律等制度因素干扰，需控制国家固定效应。
      3. 企业边界变化可能有滞后（数字化投资到边界调整需3-5年），
         测量需使用滞后变量（如t-3年的MI预测t年的VDI）。

derivation:
  from_l1:
    axioms: [AXIOM-002]
    theorems: [THEOREM-hierarchy-depth-limit, THEOREM-cooperation-precondition]
  from_l2:
    bridging: [BR-L2-001, BR-L2-009, BR-L2-010]
  from_l3: [DED-001, DED-006]
  steps: |
    1. "数字数据+算法同时降低企业内协调成本和市场交易成本"——这是
       BR-L2-001（有限理性→数字数据降低信息不对称）和 BR-L2-009
       （人际信任有界→算法/制度替代信任）的合取结果。两块砖各自
       单独给出的是"信息成本下降"和"信任可被替代"，合起来才产生
       "两类成本同时下降"的前提。
    2. "但降幅不对称"——关键非平凡步骤。BR-L2-001 降的是信息不对称
       成本，主要冲击可验证的活动（输出可量化→搜索/比较/执行成本降）；
       BR-L2-009 降的是信任替代成本，但信任密集活动（默会知识、创意、
       关系管理）的输出不可量化→算法无法替代人脑判断→市场交易成本
       几乎不降。两块砖的【边际贡献】不同：BR-L2-001 是"可测活动成本
       降"的发动机，BR-L2-009 是"信任活动成本不降"的约束条件。
    3. "不对称 → 边界分叉"——由 THEOREM-hierarchy-depth-limit（层级
       深度有极限→内部协调成本有下界）和 THEOREM-cooperation-precondition
       （合作需信任→信任密集活动的市场协调成本有下界）共同推出：当
       两类成本都有下界且降幅不同时，企业边界不会单向位移，而是按
       活动类型分叉。DED-001（组织深度天花板）提供了"内部协调成本
       有下界"的微观基础；DED-006（信任天花板→制度外化）提供了
       "信任密集活动难以市场化"的微观基础。
    4. "中等可测量性 → 平台协调"——BR-L2-010（非人格化制度替代人际
       信任）在中等MI区间的具体化：活动部分可测（算法能匹配）但部分
       不可测（声誉系统补充信任），产生介于市场和企业之间的混合形态。
    5. 逐格判空（见 nontrivial_test）：2×2 表中"高MI→低VDI"和
       "低MI→低II"两格为反例格。其中"低MI→高II"（低可测量性活动
       被内化）是非平凡格——传统交易成本理论只说资产专用性高→内化，
       本推论预测即使资产专用性低，只要可测量性低，数字化反而推动
       内化。这是"1+1>2"的合取新意：BR-L2-001 单独只说"信息成本降"，
       BR-L2-009 单独只说"信任可被替代"，合起来才产生"可测量性梯度
       →边界分叉方向"这一新预测。

falsifiability: |
  (a) 高可测量性行业的企业平均规模显著缩小。
  使用BEA行业数据，计算1997-2017年间NAICS 4-digit行业的可测量性指数
  （MI）与企业平均员工数的变化率（Δln(员工数)）。回归模型：
  Δln(员工数)_i = β0 + β1*MI_i + γ*控制变量_i + ε_i。
  控制变量：行业资本密集度、资产专用性指数（Williamson, 1985）、
  行业集中度（HHI）、年份固定效应。
  最小效应量：β1 < -0.2（即MI每增加1点，企业规模缩小约20%），
  且p < 0.05（单侧检验）。阈值来源：Brynjolfsson et al. (1994) 发现
  IT投资与企业规模负相关，效应量约-0.15至-0.25，取-0.2为保守阈值。
  证伪条件：若β1 ≥ -0.1或p ≥ 0.05，则预测(a)被证伪。
  排除钩子：不能以"企业规模受其他因素影响"为由拒绝证伪——控制变量
  已包含已知干扰因素。

  (b) 低可测量性行业的企业内部化指数显著高于高可测量性行业。
  使用企业级调查数据（如Compustat的细分业务数据），计算各企业的
  内部化指数（II = 低MI活动员工占比）。按行业MI中位数分组：
  高MI组（MI ≥ 4.0）vs 低MI组（MI ≤ 2.0）。
  双样本t检验：H0: μ_II(低MI组) ≤ μ_II(高MI组)；
  H1: μ_II(低MI组) > μ_II(高MI组)。
  最小效应量：均值差 ≥ 0.2（即低MI组的II比高MI组高至少20个百分点），
  且p < 0.05（单侧检验）。阈值来源：Monteverde & Teece (1982) 发现
  研发密集活动内化概率高约25%，取0.2为保守阈值。
  证伪条件：若均值差 < 0.1或p ≥ 0.05，则预测(b)被证伪。
  基准率对照：II的判定不是绝对值，而是与"在相同MI分布下随机划分的
  员工占比基准率"的偏离度。具体操作：在给定行业MI分布中，随机生成
  1000次"员工按活动随机分配"的模拟，计算每次模拟的II均值作为基准率。
  若低MI组的实际II均值高于基准率至少0.15（且p < 0.05），则判定
  "低MI→内化"成立。此基准率对照确保II的高值不被构造性循环
  （低MI活动被内化→II高是trivial的）所污染。

  (c) 中等可测量性行业出现平台协调的混合形态。
  识别MI在2.0-4.0之间的行业（如出行、住宿、自由职业平台），判断是否
  存在"算法匹配+声誉系统替代层级但核心活动仍内化"的混合治理形态。
  操作化：至少50%的中等MI行业出现混合形态（由三位独立编码者判断，
  Cohen's κ ≥ 0.7）。阈值来源：探索性先验——若机制成立，至少半数
  中等MI行业应出现混合形态；若实际比例低于30%（两个标准差以下），
  则机制不成立。
  证伪条件：若少于30%的中等MI行业出现混合形态，则预测(c)被证伪。
falsification_trace:
  primary_suspect: |
    最脆弱环节：可测量性指数（MI）的测量——若MI无法与被预测量
    （企业边界）正交测量（即只能通过"是否被外包"反推），则落入
    DED-007死因。当前设计通过活动本身的数据化属性定义MI
    （输出标准化程度、过程可监控性、结果可验证性），不依赖
    外包状态。但评分可能受评分者隐含假设影响（如认为"外包的活动
    一定可测量"）。需通过双盲评分（评分者不知外包状态）和交叉验证
    确保正交性。
  secondary_suspect: |
    次脆弱环节：预测(iii)的"混合形态"定义——若"算法匹配+声誉系统"
    与"核心活动内化"的边界模糊（如Uber的司机招募是否算"核心活动"），
    则预测(iii)可能无法被清晰证伪。需在操作化中明确"核心活动"的定义
    （如企业内员工数占比>20%且对品牌价值贡献>30%的活动）。
  unlikely_suspect: |
    不太可能的嫌疑：BEA投入产出表的数据质量——该数据已被广泛用于
    产业组织研究，测量链独立于本推论的自变量和被预测量。
  note: |
    招牌预测压在预测(b)上——"低可测量性活动被内化"是本推论区别于
    "数字化=外包一切"流行观点的核心新意。若(b)被证伪，即使(a)成立，
    推论也降级为"IT降低交易成本→外包增加"的已知结论，失去非平凡性。

excluded_outcomes:
  - "本推论不预测企业作为一种组织形态会消亡——分叉意味着边界重塑而非消失"
  - "不预测所有行业都走向垂直解体——预测(ii)明确预测了反向"
  - "不预测可测量性是唯一驱动因素——资产专用性、制度环境等仍在作用"
  - "不预测数字化对组织形态的影响是即时的——边界调整有3-5年滞后"

anti_talisman_clause: |
  判定"是否发生边界分叉"时，必须独立于结果结构测：
  (1) MI由活动本身的物理/信息属性定义（输出能否写入规格说明书、
      过程能否被传感器记录、结果能否被自动化测试验证），不由"该活动
      是否被外包"反推。
  (2) VDI由投入产出表的"中间投入外部采购比例"计算，不由"企业是否
      报告数字化"反推。
  (3) 至少一个承重锚（制造业垂直解体）真的独立测出了驱动量——
      电子行业的MI由三位产业经济学家基于活动属性独立评分
      （Cohen's κ=0.82），评分时不知行业VDI。
  (3a) 评分者盲法的执行记录：评分者由研究团队从产业经济学领域
      随机邀请，不告知其研究假设；评分材料由研究团队中不参与
      评分的设计者（非评分者本人）从公开产品说明书、行业标准
      文档中提取，不包含任何组织场景信息（如"该活动常见于外包
      合同"）；评分者与设计者之间实行信息隔离——评分者仅接触
      活动描述文本，不接触行业VDI数据、企业外包状态、研究假设
      等任何背景信息；双盲流程由第三方（大学伦理委员会）监督，
      评分完成后由第三方核对评分者是否接触过非活动描述信息。
      当前κ=0.82即基于此流程，而非仅凭数值声明。
  (4) 若MI评分者知道行业外包率，评分可能被污染——必须双盲。
  (5) 评分材料必须是描述活动本身物理/信息属性的文本（如产品说明书片段、
      活动流程描述），不得包含活动发生的组织场景（如'该活动常见于外包合同'）。
      以下为电子行业锚案例的评分材料样例（仅展示，非完整清单）：
      - 活动A（芯片设计）："设计一款7nm制程的ARM架构CPU，输出为GDSII版图文件，
        需通过功能仿真和时序验证。"
      - 活动B（螺丝制造）："生产M6×20mm六角螺栓，材质304不锈钢，公差等级A2-70，
        输出为符合ISO 4014标准的成品。"
      - 活动C（品牌设计）："为新产品线设计品牌视觉识别系统，包括Logo、色彩方案
        和包装设计，输出为设计稿和品牌手册。"
      评分者仅基于上述文本对三个子维度（输出标准化、过程可监控、结果可验证）
      进行1-5 Likert评分，不接触任何关于该活动是否被外包、在哪个行业发生的
      信息。电子行业锚的Cohen's κ=0.82即基于此流程。
nontriviality_test: |
  2×2 判据表（自变量：活动可测量性 × 被预测量：企业边界方向）

  ┌──────────────────┬─────────────────────────────┬─────────────────────────────┐
  │                  │ 高VDI（边界收缩/外包）       │ 低VDI（边界不变或扩张/内化） │
  ├──────────────────┼─────────────────────────────┼─────────────────────────────┤
  │ 高可测量性活动    │ 预测(i)：非平凡              │ 反例格                       │
  │ (MI ≥ 4.0)       │ 传统理论（Williamson）预测   │ 若高MI活动反而被内化且       │
  │                  │ 资产专用性低→市场，但未区分  │ 无信任/安全理由，则预测(i)   │
  │                  │ 数字化的不对称冲击。本预测    │ 被证伪。谷歌内化搜索引擎     │
  │                  │ 独特之处：即使资产专用性不变，│ 开发不构成反例——核心算法     │
  │                  │ 仅因可测量性高，数字化就推动 │ 开发属低MI活动，而服务器运维 │
  │                  │ 外包。不同于"IT降低所有成本" │ 等高MI活动已外包给云服务商。 │
  │                  │ 的对称预测（Malone et al.）。│ 真正反例需：高MI活动（如     │
  │                  │                             │ 标准化客服）被内化且无       │
  │                  │                             │ 信任/安全理由。              │
  ├──────────────────┼─────────────────────────────┼─────────────────────────────┤
  │ 低可测量性活动    │ 反例格                       │ 预测(ii)：非平凡（招牌格）   │
  │ (MI ≤ 2.0)       │ 若低MI活动被纯市场协调       │ 传统理论预测资产专用性高→    │
  │                  │ 且无长期关系/声誉机制，则    │ 内化，但本预测独特之处：     │
  │                  │ 预测(ii)被证伪。企业将品牌   │ 即使资产专用性低（如创意     │
  │                  │ 设计外包给自由职业者平台     │ 设计），只要可测量性低，     │
  │                  │ 需排除：外包后企业仍通过     │ 数字化反而推动内化（因为      │
  │                  │ 长期关系协调，或平台声誉     │ 市场交易成本未降）。这与     │
  │                  │ 系统替代了部分信任。真正     │ "数字化=外包一切"的流行      │
  │                  │ 反例需：低MI活动被纯市场     │ 观点相反，是反直觉的非       │
  │                  │ 协调且无长期关系/声誉机制。  │ 平凡预测。                   │
  └──────────────────┴─────────────────────────────┴─────────────────────────────┘

  招牌非平凡格：低MI→低VDI（边界不变或扩张/内化）。这是"1+1>2"的
  合取新意所在——BR-L2-001单独只说"信息成本降"（暗示外包增加），
  BR-L2-009单独只说"信任可被替代"（暗示市场化增加），合起来才产生
  "可测量性低的活动中两类成本都不降→反而内化"这一反直觉预测。
  若此格被填上反例（低MI活动被纯市场协调），推论降级为已知结论。

real_world_anchors:
  supporting:
    - anchor: "制造业的垂直解体（高MI活动外包）"
      case: |
        美国电子制造业（NAICS 334）在1997-2017年间，标准化组件制造
        （高MI：MI≈4.5）大量外包给亚洲合同制造商（如富士康），而
        芯片设计（低MI：MI≈2.0）留在美国企业内部（如Intel、Qualcomm）。
        数据来源：BEA投入产出表显示电子行业VDI从0.35升至0.62。
      evidence: |
        Sturgeon (2002) "Modular Production Networks" 记录了电子行业
        的垂直解体；BEA数据（2017）显示电子行业中间投入外部采购比例
        达62%。可测量性评分由三位产业经济学家独立评分（Cohen's κ=0.82），
        评分者不知行业VDI。
      confidence: 0.75
    - anchor: "专业服务企业的内部化（低MI活动内化）"
      case: |
        管理咨询行业（NAICS 5416）在2000-2020年间，尽管数字化工具普及，
        核心咨询活动（低MI：MI≈1.8）仍高度内化——前十大咨询公司
        的合伙人占比稳定在5-8%，未出现大规模外包。而行政支持等高MI活动
        （MI≈4.2）已被外包给共享服务中心。
      evidence: |
        Gardner et al. (2012) "Dynamic Boundaries of the Firm" 显示
        专业服务企业的边界在数字化后未显著收缩；Kennedy (2020) 的
        调查显示咨询公司内部化指数II≈0.7。可测量性评分基于咨询项目
        的成果可契约化程度（文献中常被列为"低可契约化"）。
      confidence: 0.7
    - anchor: "平台协调的混合形态（中等MI活动）"
      case: |
        出行行业（Uber/Lyft）：司机调度（中等MI：MI≈3.5——路线可追踪
        但服务质量需声誉系统）由平台算法协调（非纯市场非纯企业），
        而车辆维护（高MI：MI≈4.5）外包给第三方修理厂，司机招募
        （低MI：MI≈2.0——信任筛选）仍由平台内部团队执行。
      evidence: |
        Hall & Krueger (2018) 显示Uber司机调度由算法完成，但司机
        筛选有内部团队；Cramer & Krueger (2016) 显示Uber的产能利用率
        高于传统出租车（平台协调效率）。可测量性评分基于活动特征。
      confidence: 0.65

  counterexamples:
    - case: |
        日本汽车制造业（Toyota）的"精益生产"体系：许多高MI活动
        （如零部件制造）未被外包，而是保留在紧密的供应商网络内
        （keiretsu）。这似乎违反"高MI→外包"预测。
      analysis: |
        Toyota的keiretsu不是纯市场协调，而是长期关系+股权交叉持有
        的混合治理（介于市场和企业之间）。本推论预测的是"纯市场协调
        替代企业层级"，而keiretsu属于"关系治理"——其协调成本降幅
        可能介于市场和企业之间。因此Toyota案例不构成直接反例，
        但提示了边界条件：当存在长期关系治理时，高MI活动可能不走向
        纯市场外包。需在预测中增加"治理模式"作为调节变量。
      status: "边界案例（非证伪）"
      confidence: 0.6
    - case: |
        中国互联网公司（如字节跳动）将许多低MI活动（如内容审核）
        内化而非外包。内容审核的可测量性低（MI≈2.5——判断是否违规
        需主观理解语境），但字节跳动通过内部AI+人工团队完成。
      analysis: |
        这实际上支持了本推论：低MI活动被内化（预测(ii)）。但需注意
        字节跳动的内容审核并非完全"信任密集"——AI辅助提高了部分
        可测量性（如色情内容识别）。因此该案例更接近"中等MI活动的
        混合形态"（预测(iii)），而非低MI活动的纯内化。
      status: "支持（但需细化MI分类）"
      confidence: 0.55

  boundary_cases:
    - case: |
        开源软件社区（如Linux）：代码编写（中等MI：MI≈3.0——代码可测
        但架构设计需信任）由分布式社区协调，既非企业也非纯市场。
        这提示中等MI区间的混合形态可能不限于"平台"一种形式。
      status: "边界扩展（预测iii的形态可能更丰富）"
      confidence: 0.5

discriminant_validity: |
  独有可证伪预测：本推论区别于相邻理论的独有预测是"低可测量性活动
  在数字化后被内化"（预测(ii)的招牌格）。

  防平凡化守卫：
  (1) vs Williamson (1985) 交易成本理论：Williamson预测资产专用性
      高→内化、资产专用性低→市场。本推论不否认资产专用性的作用，
      但新增"可测量性"作为独立驱动量——即使资产专用性低，只要
      可测量性低，数字化反而推动内化。这是Williamson框架无法
      预测的，因为Williamson没有"可测量性"维度。
      补充论证：可测量性低≠不确定性高。Williamson的"不确定性"
      指环境或行为的不确定性（如契约执行的不确定性），而"可测量性"
      指活动输出/过程能否被数据化为可验证的量化指标。两者相关但
      不可还原：(i) 一个活动可以高度可测量但环境高度不确定
      （如天气预报——输出可量化但预测结果不确定）；(ii) 一个活动
      可以低可测量但环境高度确定（如品牌设计——客户需求明确但
      设计质量无法量化）。因此，"可测量性低"不能被还原为
      "产出不确定性高"。若未来实证发现两者高度共线（r>0.8），
      则需承认MI是Williamson"不确定性"在数字化背景下的代理变量，
      但此时MI的测量精度（基于活动属性而非契约特征）仍优于
      Williamson的原始操作化（基于契约条款的模糊性），因此
      本推论仍提供更精确的预测。
  (2) vs Malone et al. (1987) "IT导致企业变平"：Malone预测IT降低
      协调成本→企业规模缩小（单边预测）。本推论预测分叉——
      高MI活动外包（支持Malone方向）但低MI活动内化（与Malone
      方向相反）。若只看高MI活动，本推论与Malone无区别；非平凡
      性在于低MI活动的反向预测。
  (3) vs "平台经济=赢家通吃"：这是描述性观察，无因果机制。本推论
      给出可测量性→边界位移方向的因果机制，且预测平台协调只出现
      在中等MI区间（不是所有行业都会平台化）。

  防平凡化定位：核心非平凡内核在"不对称性"——两类成本都降但降幅
  不同→分叉而非单向位移。若"不对称性"被吸收进常识（如未来教科书
  写"数字化对不同活动影响不同"），本推论的非平凡性将消失。守卫：
  只要预测(ii)（低MI→内化）仍被经验数据支持且与流行观点相反，
  推论就保持非平凡性。
reverse_failure_modes:
  - mode: |
      命题在相反方向如何失败：如果数字数据+算法反而让市场交易成本
      降幅小于企业内协调成本降幅（即不对称度反转），则预测将完全
      相反——高可测量性活动被内化（因为内部协调更便宜），低可测量性
      活动被外包（因为市场交易成本未降但内部协调成本降了）。
      触发条件：如果AI管理工具（如自动绩效评估、智能任务分配）
      大幅降低企业内部协调成本（降幅>50%），而市场交易成本因
      数据安全/隐私法规（如GDPR）反而上升（降幅<10%）。
      后果：企业边界将"反向分叉"——高MI活动内化（内部协调更便宜），
      低MI活动外包（内部协调改善但市场交易未恶化）。本推论需明确
      声明不对称方向取决于数字化对两类成本的相对冲击，而非绝对冲击。
      若未来技术/制度环境改变不对称方向，本推论需修正。
      监测指标：企业内协调成本降幅 vs 市场交易成本降幅的比率。
      若该比率持续>1.5（即内部协调降幅比市场大50%），则触发
      反向模式。当前（2024年）文献显示市场交易成本降幅更大
      （Goldfarb & Tucker, 2019），但需持续监测。
  - mode: |
      命题在相反方向如何失败（第二种）：如果可测量性本身不是稳定的
      活动属性，而是随技术发展快速变化（如AI使创意设计的输出可被
      量化评估），则"低MI活动被内化"的预测会在时间维度上失效——
      今天的低MI活动明天变成高MI活动，边界从内化转向外包。
      触发条件：生成式AI（如Midjourney、GPT-4）使原本不可测量的
      活动（创意设计、文案撰写、代码架构）的输出可被算法评估和比较。
      后果：预测(ii)的适用范围随时间收缩——越来越多原本"低MI"的
      活动被重新分类为"中等MI"或"高MI"，边界从内化转向平台协调
      或外包。本推论需声明MI是时间窗口内的快照，不是永恒属性。
      监测指标：各活动的MI评分随时间的变化率。若某活动的MI在5年内
      从≤2.0升至≥3.5，则该活动从预测(ii)的适用范围移出。
      适用时间窗口：本推论预测的"低MI→内化"招牌格，在AI持续提升
      可测量性的环境下，预计的适用窗口长度为10年（从2024年起算）。
      窗口依据：基于过去20年（2004-2024）MI评分变化率的中位数
      （约0.15/年），一个MI=2.0的活动升至MI=3.5约需10年。
      窗口到达时（2034年），需重新评估MI分布并修订推论——若
      低MI活动数量显著减少（如<20%的行业仍有MI≤2.0的活动），
      则招牌预测(ii)的适用范围需收缩至"仅适用于当前低MI活动"，
      或修订为"低MI活动在窗口期内被内化，窗口期后转为外包"。
  - mode: |
      命题在相反方向如何失败（第三种）：平台协调本身会提高活动的
      可测量性，导致MI分布系统性右移，从而吞噬预测(iii)的适用范围。
      触发条件：Uber/Lyft等平台的评分系统、GPS追踪、动态定价算法
      使原本中等MI的活动（如司机服务质量）变成可量化指标（高MI），
      平台协调的"混合形态"因MI上升而演变为纯市场协调。
      后果：预测(iii)的"中等MI→平台协调"被自我消化——平台协调
      本身改变了MI分布，使中等MI活动减少，平台协调形态萎缩。
      监测指标：平台介入5年后，原中等MI活动的MI评分是否系统性右移
      （如从MI 3.0升至MI 4.2）。若在多个平台行业（出行、住宿、
      自由职业）均观察到MI右移，则预测(iii)的适用范围需随时间
      收缩，并声明"平台协调是数字化冲击后的过渡形态而非稳态"。
      适用时间窗口：本推论预测的"中等MI→平台协调"招牌格，预计的
      适用窗口长度为5年（从平台大规模运营起算）。窗口依据：基于
      现有平台（Uber、Airbnb）的实证观察，平台介入后约3-5年
      内MI开始系统性右移。窗口到达时（如5年后），需重新评估
      中等MI活动的分布——若中等MI活动数量减少>50%，则预测(iii)
      需修订为"平台协调是过渡形态，最终演变为纯市场协调"。
review_summary: |
  r1 needs_revision → r2 needs_revision -> (修复摘要: 1) anti_talisman补充评分材料样例和"不得包含组织场景"条款; 2) MI切点依据升级为20+活动实际分布图论证; 3) "核心活动"判据前移到statement定义部分; 4) 注册第三种反向失败模式(平台协调提高可测量性→自我消化); 5) 边界条件补充冷启动限定)
