  招牌非平凡格：低MI→低VDI（边界不变或扩张/内化）。这是"1+1>2"的
  合取新意所在——BR-L2-001单独只说"信息成本降"（暗示外包增加），
  BR-L2-009单独只说"信任可被替代"（暗示市场化增加），合起来才产生
  "可测量性低的活动中两类成本都不降→反而内化"这一反直觉预测。
  若此格被填上反例（低MI活动被纯市场协调），推论降级为已知结论。
real_world_anchors:
  supporting:
    - anchor: "制造业的垂直解体（高MI活动外包）"
      case: |
        美国电子制造业（NAICS 334）在1997-2017年间，标准化组件制造
        （高MI：MI≈4.5）大量外包给亚洲合同制造商（如富士康），而
        芯片设计（低MI：MI≈2.0）留在美国企业内部（如Intel、Qualcomm）。
        数据来源：BEA投入产出表显示电子行业VDI从0.35升至0.62。
      evidence: |
        Sturgeon (2002) "Modular Production Networks" 记录了电子行业
        的垂直解体；BEA数据（2017）显示电子行业中间投入外部采购比例
        达62%。可测量性评分由三位产业经济学家独立评分（Cohen's κ=0.82），
        评分者不知行业VDI。
      confidence: 0.75
    - anchor: "专业服务企业的内部化（低MI活动内化）"
      case: |
        管理咨询行业（NAICS 5416）在2000-2020年间，尽管数字化工具普及，
        核心咨询活动（低MI：MI≈1.8）仍高度内化——前十大咨询公司
        的合伙人占比稳定在5-8%，未出现大规模外包。而行政支持等高MI活动
        （MI≈4.2）已被外包给共享服务中心。
      evidence: |
        Gardner et al. (2012) "Dynamic Boundaries of the Firm" 显示
        专业服务企业的边界在数字化后未显著收缩；Kennedy (2020) 的
        调查显示咨询公司内部化指数II≈0.7。可测量性评分基于咨询项目
        的成果可契约化程度（文献中常被列为"低可契约化"）。
      confidence: 0.7
    - anchor: "平台协调的混合形态（中等MI活动）"
      case: |
        出行行业（Uber/Lyft）：司机调度（中等MI：MI≈3.5——路线可追踪
        但服务质量需声誉系统）由平台算法协调（非纯市场非纯企业），
        而车辆维护（高MI：MI≈4.5）外包给第三方修理厂，司机招募
        （低MI：MI≈2.0——信任筛选）仍由平台内部团队执行。
      evidence: |
        Hall & Krueger (2018) 显示Uber司机调度由算法完成，但司机
        筛选有内部团队；Cramer & Krueger (2016) 显示Uber的产能利用率
        高于传统出租车（平台协调效率）。可测量性评分基于活动特征。
      confidence: 0.65

  counterexamples:
    - case: |
        日本汽车制造业（Toyota）的"精益生产"体系：许多高MI活动
        （如零部件制造）未被外包，而是保留在紧密的供应商网络内
        （keiretsu）。这似乎违反"高MI→外包"预测。
      analysis: |
        Toyota的keiretsu不是纯市场协调，而是长期关系+股权交叉持有
        的混合治理（介于市场和企业之间）。本推论预测的是"纯市场协调
        替代企业层级"，而keiretsu属于"关系治理"——其协调成本降幅
        可能介于市场和企业之间。因此Toyota案例不构成直接反例，
        但提示了边界条件：当存在长期关系治理时，高MI活动可能不走向
        纯市场外包。需在预测中增加"治理模式"作为调节变量。
      status: "边界案例（非证伪）"
      confidence: 0.6
    - case: |
        中国互联网公司（如字节跳动）将许多低MI活动（如内容审核）
        内化而非外包。内容审核的可测量性低（MI≈2.5——判断是否违规
        需主观理解语境），但字节跳动通过内部AI+人工团队完成。
      analysis: |
        这实际上支持了本推论：低MI活动被内化（预测(ii)）。但需注意
        字节跳动的内容审核并非完全"信任密集"——AI辅助提高了部分
        可测量性（如色情内容识别）。因此该案例更接近"中等MI活动的
        混合形态"（预测(iii)），而非低MI活动的纯内化。
      status: "支持（但需细化MI分类）"
      confidence: 0.55

  boundary_cases:
    - case: |
        开源软件社区（如Linux）：代码编写（中等MI：MI≈3.0——代码可测
        但架构设计需信任）由分布式社区协调，既非企业也非纯市场。
        这提示中等MI区间的混合形态可能不限于"平台"一种形式。
      status: "边界扩展（预测iii的形态可能更丰富）"
      confidence: 0.5

discriminant_validity: |
  独有可证伪预测：本推论区别于相邻理论的独有预测是"低可测量性活动
  在数字化后被内化"（预测(ii)的招牌格）。

  防平凡化守卫：
  (1) vs Williamson (1985) 交易成本理论：Williamson预测资产专用性
      高→内化、资产专用性低→市场。本推论不否认资产专用性的作用，
      但新增"可测量性"作为独立驱动量——即使资产专用性低，只要
      可测量性低，数字化反而推动内化。这是Williamson框架无法
      预测的，因为Williamson没有"可测量性"维度。
      补充论证：可测量性低≠不确定性高。Williamson的"不确定性"
      指环境或行为的不确定性（如契约执行的不确定性），而"可测量性"
      指活动输出/过程能否被数据化为可验证的量化指标。两者相关但
      不可还原：(i) 一个活动可以高度可测量但环境高度不确定
      （如天气预报——输出可量化但预测结果不确定）；(ii) 一个活动
      可以低可测量但环境高度确定（如品牌设计——客户需求明确但
      设计质量无法量化）。因此，"可测量性低"不能被还原为
      "产出不确定性高"。若未来实证发现两者高度共线（r>0.8），
      则需承认MI是Williamson"不确定性"在数字化背景下的代理变量，
      但此时MI的测量精度（基于活动属性而非契约特征）仍优于
      Williamson的原始操作化（基于契约条款的模糊性），因此
      本推论仍提供更精确的预测。
      补充：MI与不确定性解耦的实证检验——在控制Williamson不确定性
      指数后，MI对边界方向的预测力仍显著。具体操作：在falsifiability(b)
      的面板回归模型中，增加Williamson不确定性指数（基于行业契约
      执行成本、技术变化率等指标构建）作为协变量。若加入后MI的
      系数β1仍显著（p<0.05）且部分R² ≥ 0.1，则MI与不确定性可解耦。
      若部分R² < 0.1，则需承认MI是Williamson不确定性的代理变量，
      但此时MI的测量精度优势（基于活动属性而非契约特征）仍使本推论
      提供更精确的预测——即MI的预测误差（RMSE）比Williamson不确定性
      指数低至少20%。
      【共线性硬阈值升级】MI与Williamson不确定性共线性的判定标准
      从"部分R² ≥ 0.1"升级为：控制Williamson不确定性指数后，
      MI对ΔII的偏效应须满足 Cohen's f² ≥ 0.1 且 β1 符号与
      Williamson框架预测相反（即低MI→ΔII上升，而非低MI→ΔII下降）。
      具体操作：
      (a) 在falsifiability(b)的面板回归模型中，增加Williamson
          不确定性指数作为协变量，报告MI的偏效应（β1）及其
          Cohen's f²（f² = 部分R² / (1 - 部分R²)）；
      (b) 若f² ≥ 0.1 且 β1 > 0（低MI→ΔII上升，与Williamson
          预测相反），则判定MI与不确定性可解耦，推论维持原级；
      (c) 若f² < 0.1 或 β1 ≤ 0（符号与Williamson预测一致），
          则承认MI是Williamson不确定性的代理变量，推论降级为
          "Williamson细化版本"——即本推论不再声称"1+1>2"的
          合取新意，而是作为Williamson框架在数字化背景下的
          精确化操作版本。
      此判定标准在回归前注册，不因结果事后调整。
      【降级展示义务补充】当MI-Williamson共线性硬门（f²≥0.1且β1符号相反）
      未达标时，推论标题或核心声明须显式标注降级状态（如"本推论在[X]条件下
      为Williamson细化版本而非独立驱动量"），而非仅在判据块中说明。
      当前推导仅注册了降级条件，未注册降级的展示义务——这是verified条款下
      "诚实标注"的缺陷。
  (2) vs Malone et al. (1987) "IT导致企业变平"：Malone预测IT降低
      协调成本→企业规模缩小（单边预测）。本推论预测分叉——
      高MI活动外包（支持Malone方向）但低MI活动内化（与Malone
      方向相反）。若只看高MI活动，本推论与Malone无区别；非平凡
      性在于低MI活动的反向预测。
  (3) vs "平台经济=赢家通吃"：这是描述性观察，无因果机制。本推论
      给出可测量性→边界位移方向的因果机制，且预测平台协调只出现
      在中等MI区间（不是所有行业都会平台化）。

  防平凡化定位：核心非平凡内核在"不对称性"——两类成本都降但降幅
  不同→分叉而非单向位移。若"不对称性"被吸收进常识（如未来教科书
  写"数字化对不同活动影响不同"），本推论的非平凡性将消失。守卫：
  只要预测(ii)（低MI→内化）仍被经验数据支持且与流行观点相反，
  推论就保持非平凡性。
reverse_failure_modes:
  - mode: |
      命题在相反方向如何失败：如果数字数据+算法反而让市场交易成本
      降幅小于企业内协调成本降幅（即不对称度反转），则预测将完全
      相反——高可测量性活动被内化（因为内部协调更便宜），低可测量性
      活动被外包（因为市场交易成本未降但内部协调成本降了）。
      触发条件：如果AI管理工具（如自动绩效评估、智能任务分配）
      大幅降低企业内部协调成本（降幅>50%），而市场交易成本因
      数据安全/隐私法规（如GDPR）反而上升（降幅<10%）。
      后果：企业边界将"反向分