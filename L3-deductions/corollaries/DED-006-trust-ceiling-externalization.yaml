      - "C2(判别锚过度推销):'小人口商帮'只 de-confound 人头数(弱版规模),未 de-confound 市场范围/产出(商帮运营大市场)。判别真正承重在 Cell B(半径内高产出不外化),非商帮。"
      - "C3(护身符方向对但自律未兑现,非 DED-004 死病):anti_talisman 写得对,但无一承重锚像 DED-005 卡拉哈里那样兑现'独立于制度测匿名度突破';匿名度受 down-the-line + 幸存者偏差之困。"
      - "反例猎捕未得干净击杀,但揭出真隐忧:'外化'类别弹性过大(声誉/社区责任/商帮全算外化)⇒ falsifiability(a)近乎因定义不可满足。"
    non_recurrence_of_ded004: "确认非 DED-004 死病——结构已规避条件双重身份,护身符未生效为死循环;卡在 DED-005 r1/r2 的'只装门未上栓'位置。"
