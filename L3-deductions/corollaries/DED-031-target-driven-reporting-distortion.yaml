id: DED-031
type: deduction
layer: L3-deductions
status: verified
term: "指标治理下的策略性上报失真 (Strategic Reporting Distortion under Metric Governance)"

人话摘要: "上级用数字考核下级、数字又是下级自己报的、上级还查不过来——这三件事凑齐，报上来的数字就会朝着'对下级有利'的方向系统性走样。这不是哪个人品行差，是激励加信息不对称的结构性产物。查得越难走样越大；一旦独立核查变便宜（卫星遥感、垂直采集），走样就缩回去。"

statement: |
  【核心】科层组织中，当三个前件同时满足——(1) 上级以可量化指标考核下级绩效且考核结果
  影响下级职业前途/资源分配，(2) 下级参与或控制该指标的数据生产/上报环节，(3) 上级独立
  核查成本高昂——上报数据将系统性偏离真值，且偏离方向可【事前】从考核奖惩结构导出
  （使被考核者在考核中受益的方向，不必然是"报高"——争取扶贫/救济资源时是报低）。
  这是结构性产物，不是个别道德失败：指标一经公布并挂钩利益，它就从"测量工具"变成
  "博弈对象"（Goodhart 定律的组织学微观基础）。

  【驱动量】三个前件均为制度事实，可独立于数据结果测量——考核挂钩强度（考核文件中的
  权重/一票否决/晋升关联）、数据生产控制权归属（谁采集谁录入，制度文本可查）、
  独立核查成本（有无第三方直采/遥感/垂直管理，技术与制度可查）。

  【预测】(i) 同一统计对象被纳入考核后，其上报值与独立第三方测量值的差距应显著扩大
  （考核状态切换的前后对比，口径可比条件下）；(ii) 失真度随数据经过且有利益关联的
  科层层级数递增——每一层既是信息衰减点也是再加工点，累积失真更大（区域加总应系统
  偏离独立核算的全域值；层级计数口径【一次性注册】：仅当该层级自身被同一或派生指标
  考核挂钩——按该层考核文本事前判——才计入"利益关联层级数"，机械转发层不计）；
  (iii) 独立核查成本显著下降（遥感/大数据交叉验证/采集权垂直上收/自动化直采）后，
  失真度应收缩——这是干预方向的可检验预测。注意：核查升级的引入时点可文档化但常
  内生于历史失真曝光（改革尾随丑闻，均值回归可冒充收缩），故(iii)须与(i)同等识别
  纪律——分批推开的差分设计（地区/站点改造时点错开）+未改革对照，单纯前后对比不算数。

  【判别】与 Goodhart/Campbell 定律的区别——它们是"指标会被博弈"的格言，无比较静态；
  本推论给出三条可测的比较静态（考核切换前后差、层级深度梯度、核查成本弹性）与
  事前方向预测。与标准委托-代理理论的区别——委托-代理预测"存在道德风险"，
  本推论额外锁定失真的【方向可从考核文本事前导出】+【层级累积】+【核查成本可逆】
  三条独有内容。跨体制（计划经济/福利国家/联邦制民主）普遍出现是结构机制的判据，
  排除"特定制度缺陷"解释。

  【边界（不声称）】不声称所有统计都失真——无考核挂钩的统计（前件1不满足）失真应
  显著更低，这本身是推论的对照预测；不声称失真不可治理——预测(iii)正是治理通道；
  不声称指标治理本身是错的——指标同时真实地改变实际行为，真实响应与策略失真并存，
  本推论只声称失真分量系统性存在、方向事前可预测、幅度随核查成本与层级单调。

operationalization:
  assessment_pressure:
    definition: "指标与被考核者职业前途/资源分配的挂钩强度。"
    measurement: |
      从考核制度文本独立编码——指标在绩效考核中的权重、是否一票否决、是否与晋升/
      拨款/评优直接关联、排名是否公开。按制度文本分档（无挂钩/软挂钩/硬挂钩），
      不使用任何数据结果信息。
    limitations: "纸面制度与实际执行可能有落差；需辅以'考核结果实际影响晋升'的追踪证据（如指标排名与晋升率的关联）。"
  data_production_control:
    definition: "被考核方对指标数据的采集、录入、汇总环节的控制程度。"
    measurement: |
      按制度事实分档——完全自报（被考核方采集+上报）/ 半控制（被考核方采集、
      上级抽查）/ 不控制（第三方直采或垂直管理机构采集）。以采集权归属的
      制度文件与实际操作流程为准。
    limitations: "名义垂直管理下可能存在事实上的属地干预（如地方向监测站施压），需以干预案例证据修正档位。"
  verification_cost:
    definition: "上级或第三方获得同一统计对象独立测量值的边际成本。"
    measurement: |
      按可用核查技术与制度分档——是否存在遥感/传感器直采/多源交叉数据（用电量、
      货运量、税务发票）/独立抽样调查制度。核查技术引入时点可文档化，但常内生于
      历史失真曝光（核查升级多为对已暴露失真的响应）——用作事件研究时不得当外生
      冲击，须以分批推开（地区/站点时点错开）+未改革对照识别。
    limitations: "核查技术的存在不等于被使用；应以'核查实际执行频率与覆盖率'为准，纸面技术不算。"
  reporting_distortion:
    definition: "上报值与独立第三方测量值之差，按'使被考核者受益的方向'取符号。"
    measurement: |
      失真度 = 上报值 − 独立基准值（卫星遥感反演、垂直采集、独立学术调查、
      多源物理量交叉推算如克强指数、擦除分析/分布断点检测）。受益方向由考核
      文本事前导出（增长/产出类正向指标报高；负向/削减类指标的【水平】考核——
      污染/犯罪/事故/死亡率/等待时间等，考核奖励其水平下降——报低；降幅/基数类
      考核基期反转为报高；资格/配额类随资格判据符号走；完整分支、基数符号推广与
      冲突裁决规则见 benefit_direction）。
    limitations: |
      独立基准自身有测量误差与口径差异（卫星AOD不等于地面PM、夜间灯光不等于GDP）——
      故检验设计须用差分（考核切换前后、有考核区与无考核区对照），令基准的
      系统偏差在差分中相消，不依赖基准的绝对准确性。
  benefit_direction:
    definition: "失真的受益方向——使被考核者【个人】在考核中净受益的上报方向，看数据前从考核文本导出。"
    measurement: |
      【一次性注册的导出决策程序，禁止见数后新增分支】按被考核者所处考核结构逐条判：
      (0) 负向/削减类指标的【水平/存量】考核（污染浓度/犯罪数/事故数/死亡率/
      等待时间/贫困存量等，考核奖励其水平【下降】）→ 报低；
      【基数符号推广（r3 预注册）】凡考核量为降幅/改善量（delta 型，按考核文本
      事前判——"能耗降X%/减排X%/犯罪率降X%"类），或资源/配额分配随上报基数
      【正向】变动（EU ETS 式按自报历史基线分配配额）→ 基期/基数期的受益方向
      反转为报高（抬高基期，降幅/配额自动变好）；
      (1) 增长/产出类正向指标 → 报高；(2) 资格/配额类指标——方向随资格判据的
      符号走：低值触发资格（救济/扶贫/补贴）→ 报低；配额/拨款随上报量正向变动
      （按基线分配配额/按病例数拨款）→ 报高；
      (3) 达标线/阈值类考核 → 分布在阈值处堆积（bunching）；(4) 目标随基数棘轮上调
      （下期目标以本期实绩为基数，考核文件可查）→ 跨期平滑/丰年压报藏产能；
      (5) 换届+增长基数考核并存（换届时点可查）→ 新任报低基数。
      (4)(5) 的基数逻辑符号随指标类型反转——正向指标压低基数受益（藏产能/
      新官报低），负向指标抬高基数受益（与基数符号推广对称）。
      【多通道冲突裁决】同一上报量进入多个考核、受益方向相反时（如产量报高利于当期
      考核、却抬高征购基数/未来棘轮目标），以被考核者【个人】的考核净受益为准，
      按挂钩强度档位裁：硬挂钩/一票否决 > 软挂钩；落在个人考核上的奖惩 > 不落在
      个人考核上的辖区损失。
    limitations: |
      分支清单为当前注册版本（形态包括但不限于上述六支及基数符号推广条款——
      机制上可再导出的新形态，须在看新数据【前】注册并留痕）；任何靠事后选分支
      或事后新增分支得救的案例，一律反向裁（L4-009 判例）。
      【留痕】分支(0)注册于 round-2 整改，时点晚于空气质量/NHS/犯罪统计锚见数。
      豁免反向裁的理由：statement 注册的总原则（"使被考核者在考核中受益的方向，
      从考核文本导出"）对负向【水平】指标输出无歧义——不存在方向分叉可供事后
      挑选，不构成 L4-009 式"事后选择方向恰好救推论"；降幅/基数类考核的基期
      报高属另一考核类型（由考核文本事前可判），其符号由基数符号推广另行注册；
      此为工具枚举补全，非方向自由度（见 ADV-REVIEW-036 round_2）。
      该豁免结论对既有锚（均为水平/阈值型考核）不变。
      【留痕】基数符号推广与分支(2)符号显式化、(4)(5)符号反转声明注册于
      round-3 整改，先于任何 delta 型/配额型案例入锚，属预注册而非事后救援
      （见 ADV-REVIEW-036 round_3）。

derivation:
  from_l1:
    axioms: [AXIOM-001, AXIOM-002]
    theorems: [THEOREM-hierarchy-depth-limit]
  from_l2:
    bridging: [BR-L2-001, BR-L2-010]
  from_l3:
    deductions: [DED-001]
  steps: |
    1. "AXIOM-001 给动机——晋升位置与资源是稀缺的"
       多个下级竞争有限的晋升位置与拨款，考核指标是竞争的计分板；指标达成度
       直接改变竞争结果 → 下级有结构性动机让计分板显示对自己有利的数值。
       这一步只给动机，不给能力。

    2. "THEOREM-hierarchy-depth-limit + DED-001 给通道——层级越深，独立验证越贵"
       信息每上传一层就衰减/再加工一次；上级掌握的基层实况本来就靠上报维持。
       层级越多，上级绕过上报链独立测量真值的成本越高 → 失真被发现的概率随
       层级深度下降。这一步给能力（失真空间），且给出预测(ii)的层级梯度。

    3. "BR-L2-001 给上级侧约束——核查带宽有限"
       上级有限理性，无法穷尽核查所有数据点，只能抽查或依赖上报的表面一致性。
       动机(步骤1) × 失真空间(步骤2) × 核查带宽约束(步骤3) 合成核心命题——
       上报值向受益方向系统性漂移，漂移幅度受期望惩罚（发现概率×处罚）约束。

    4. "方向的事前可导出性"
       受益方向不是事后看数据定的——它写在考核文本里（奖惩随指标的符号方向）。
       增长考核 → 报高；负向/削减类【水平】考核 → 报低（降幅/基数类考核基期
       反转为报高）；资格/配额类 → 随资格判据符号走；达标线考核 → bunching；
       棘轮 → 跨期平滑；换届+基数 → 新官报低。同一机制统一解释多种表观不同的失真
       形态——分支清单（当前注册版本，包括但不限于）、基数符号推广、事前触发
       条件、多通道冲突裁决规则与"禁止见数后新增分支"承诺，
       一次性注册于 operationalization.benefit_direction。

    5. "BR-L2-010 给干预方向——非人格化核查制度替代对上报链的依赖"
       正如非人格化制度能替代人际信任支撑陌生人交换，非人格化核查（遥感、
       传感器直采、垂直采集、多源交叉验证）能替代对下级上报的依赖——核查成本
       下降 → 发现概率上升 → 期望惩罚上升 → 失真收缩。此为预测(iii)；识别纪律
       见 statement（核查升级时点常内生于失真曝光，须分批推开+未改革对照）。

    6. "合成与非平凡性（逐格判空）"
       2×2 判据表见 nontriviality_test。承重砖各自的边际贡献诚实点名——
       AXIOM-001 是动机发动机；THEOREM-hierarchy-depth-limit/DED-001 是通道
       发动机（但它们只讲'无意的信息衰减'，不讲'有方向的策略失真'——方向性
       是本推论的增量）；BR-L2-001 偏约束性（界定上级核查能力上限，近定义砖）；
       BR-L2-010 是预测(iii)的发动机。没有任何一块砖写有'考核挂钩的上报数据
       会向受益方向系统性失真'这一结论。

falsifiability: |
  本推论可被以下发现证伪：
  (a) 跨多案例统计下，同一统计对象纳入硬挂钩考核后（口径可比、有对照），上报值
  与独立基准的差距【不扩大】——核心机制被推翻。
  (b) 失真度与数据经过的利益关联科层层级数【无正相关】（层级按注册口径计数，见
  statement 预测(ii)；跨地区/跨国比较，控制核查成本）——层级通道被推翻。此仅伤
  预测(ii)，核心命题(a)(c)可独立存活，
  届时推论须降格为'单环节失真'版本并标注。
  (c) 独立核查成本显著下降后（识别须用分批推开+未改革对照——技术引入时点可文档化
  但常内生于失真曝光，单纯前后对比不算数），失真度【不收缩甚至扩大】
  ——干预预测被推翻。
  (d) 失真方向与事前从考核文本导出的受益方向【系统性不符】（如增长考核下系统性
  报低且无基数效应等可事前识别的动机反转）——方向可预测性被推翻。
  适用区间：仅覆盖前件(1)(2)(3)同时满足的场景；核查成本极低的领域（如税收实缴
  入库、财务经严格外部审计）失真应被压缩，属推论内的调节预测而非反例。

falsification_trace:
  primary_suspect: |
    预测(i)的归因——上报值与独立基准的差可能由口径/方法差异贡献，且考核的引入
    常与统计口径改革同期发生（考核方案与统计方案往往一起改），使"考核切换"与
    "口径切换"混杂。招牌预测压在"考核状态切换是差距变化的原因"这条腿上——
    须用双重差分（有考核区 vs 无考核区、切换前 vs 后）解耦；单纯前后对比不算数。
    若多数案例的差距扩大能被同期口径变化完全解释，核心被证伪。
    同族风险：预测(iii)的干预时点内生——核查升级常在失真曝光峰值处引入，
    均值回归+同期专项整肃可冒充'失真收缩'，解法同为分批推开DiD+未改革对照。
  secondary_suspect: |
    预测(ii)的层级累积——失真可能集中发生在数据生产的单一环节（基层填报者），
    上层只是机械转发不再加工；若此，层级深度与失真度无关，THEOREM-hierarchy-
    depth-limit 通道被用错了地方（它讲无意衰减，被本推论借用为'每层皆有再加工
    动机'，此借用是可疑的额外假设——上层是否有独立加工动机取决于上层是否也被
    同一指标考核，即'层层加码'需要考核压力逐层传导这一附加条件）。
  unlikely_suspect: "AXIOM-001 动机前提——晋升稀缺、考核系于前途，是科层组织的制度事实，稳固。"
  note: "primary 与 secondary 均不动摇方向可预测性(d)——(d)是本推论最抗打的独有内容。"

excluded_outcomes:
  - outcome: "无考核挂钩的统计（纯科研调查、匿名普查、不排名不奖惩的监测）"
    description: "前件(1)不满足，射程外——且构成对照组：其失真应显著更低，可事前按考核文本认出。"
  - outcome: "下级不掌握数据生产环节（第三方直采、传感器自动上传、垂直管理机构采集）"
    description: "前件(2)不满足，射程外——按采集权制度归属事前认出。"
  - outcome: "非策略性测量误差（仪器误差、抽样误差、能力不足导致的错报）"
    description: "无方向性或方向与受益梯度无关，与本推论的方向性失真可用符号检验区分。"
  - outcome: "指标引发的真实行为改变（真实响应）"
    description: "考核确实促使下级真做事（真提产量/真缩等待时间），本推论不预测真实响应的大小，只声称失真分量另行存在；两者靠独立基准解耦——真实响应会同时反映在上报值与独立基准中，失真只反映在两者之差中。"

anti_talisman_clause: |
  【防不可证伪护身符】三个前件的判定必须独立于失真结果：考核压力以考核制度文本
  编码（权重/一票否决/晋升关联），不得由"数据水分大"反推"考核压力必然大"；
  数据生产控制权以采集制度归属判定，不得由失真反推"下级一定动了手脚"；
  核查成本以核查技术与制度的存在及实际执行覆盖率判定，不得由"失真没被发现"
  反推"核查成本高"。同样，不利证据不得用"该案例其实有隐性考核压力"这类
  事后追加的前件来消解——除非该隐性压力有独立于数据的文件或访谈证据。
  失真的受益方向必须在看数据前从考核文本导出并注册，不得看到差的符号后再解释方向——
  导出决策程序（分支清单【当前注册版本，包括但不限于】+事前触发条件+多通道冲突
  裁决规则）一次性注册于
  operationalization.benefit_direction，禁止见数后新增分支。

nontriviality_test: |
  2×2 判据表（自变量档:三前件齐备 vs 任一不满足 × 被预测量档:上报-独立基准差
  系统性偏向受益方向 vs 无系统性方向）：
  格(前件不满足, 无系统方向)——对照格，接近常识但仍可检验（无考核统计更可信）。
  格(前件齐备, 系统性方向失真且幅度随核查成本与层级单调)——「非平凡格」——
  没有任何承重砖平凡地强制它：AXIOM-001 只给竞争动机不给失真结论；
  THEOREM-hierarchy-depth-limit/DED-001 只讲无意的信息衰减（衰减无方向，
  策略失真有方向——方向性是本推论增量）；BR-L2-001 只讲算不过来；
  BR-L2-010 只讲制度可替信任。该格是真经验主张，可被现实反例填空——
  若存在多个'硬挂钩考核+自报数据+核查昂贵'而上报与独立基准长期无系统偏差的
  政体/组织（且非幸存者审计偏差），该格即被填上、推论被证伪。
  格(前件齐备, 无系统方向)——「如果被大量填充则证伪本推论」。
  brick=conclusion 自查：结论'考核使上报数据向受益方向系统失真'未在任何砖中
  原文或近义出现；无为本推论窄化的专用砖。

real_world_anchors:
  supporting:
    - anchor: "中国省级GDP加总长期超全国核算（预测 i）"
      evidence: |
        约2004–2018年，各省GDP加总持续高于全国核算值（峰值年份差距达数万亿元级），
        GDP增速是地方官员晋升考核的核心指标且数据由地方统计系统生产——三前件齐备。
        辽宁(2017)、内蒙古(2018)先后自曝'挤水分'（财政收入/工业增加值虚增），
        证实存在策略性分量（不排除口径差另有贡献）。2019年起地区生产总值统一核算
        改革（核算权上收）后差距基本消失——但此收敛不为预测(iii)作证：改革时机
        内生于挤水分曝光，且统一核算后省级数与全国数不再独立生产，收敛部分按构造
        成立（失真渠道被拆除，而非'发现概率上升→失真收缩'的威慑机制链）。
        (iii)的证据由空气质量锚承担，或改用改革前后仍独立的第三方基准
        （夜间灯光/用电量/铁路货运）另行检验。
        独立驱动量证据：考核挂钩强度与核算权归属变化是可查的制度文件事实，
        不由失真结果反推。
      confidence: strong
    - anchor: "GDP增速国际发布口径三源一致（预测 iii 的纯数据侧锚）"
      evidence: |
        2026-07-16 CNBS 工具实证：CNBS 搜索获取的中国 GDP 增速
        （2025 年 5.0%）与 World Bank（NY.GDP.MKTP.KD.ZG，
        2025 年 4.96%）和 IMF（NGDP_RPCH，2025 年 5.0%）高度一致，
        三源最大差异仅 0.04 个百分点（2015-2025 年全序列）。
        
        锚点逻辑：GDP 增速是全国汇总后经国家统计局、World Bank、
        IMF 等多层审核才向国际发布的数据——核查成本极低
        （多机构盯住、口径透明、方法论公开）。按照 DED-031 预测(iii)，
        核查成本低 → 失真被压缩。三源高度一致证实了这一点。
        与空气质量锚（物理测量侧——卫星反演 vs 地面上报）互补：
        空气质量锚证明"核查成本下降后失真收缩"，此锚证明
        "核查成本始终低的环节失真始终被压缩"。
        
        诚实标注（双轨）：
        (i) 数据源同根——WB 和 IMF 的中国 GDP 增速底层输入来自
        中国国家账户（见 independence-model.yaml
        data_source_origin 节，2026-07-16 注册），三源一致是
        "同源多次发布"的一致性，不是"三源独立验证"的一致性。
        此锚仅用于预测(iii)（核查成本弹性），不作为预测(i)
        （独立基准对比）的证据——(i) 需要真正独立的基准
        （卫星灯光/用电量/货运量）。
        (ii) 此锚不能替代也不削弱空气质量锚——空气质量锚的
        驱动量（采集权剥离时点）是真外生的（站点级改造时点
        不等于失真曝光时点），此锚的"核查成本低"是稳态特征
        而非事件，识别强度弱于空气质量锚。
      confidence: moderate
    - anchor: "中国空气质量监测自动化/垂直管理（预测 iii，独立测出驱动量的干净锚）"
      evidence: |
        地方环保数据曾在考核压力下失真（西安2016年空气采样器堵棉纱案获刑，为
        策略性而非误差的直接证据）。国控监测站自动化直采与垂直管理改革后，
        学术研究（以卫星气溶胶数据为独立基准、以自动化改造时点为事件）发现
        上报污染浓度在改造时点出现向上跳变——即此前的系统性低报被挤出。
        驱动量（数据生产控制权剥离时点）独立于结果测得，基准（卫星）独立于上报链。
      confidence: strong
    - anchor: "英国NHS指标治理（预测 i + d 方向/bunching，准实验对照）"
      evidence: |
        2000年代英格兰对等待时间实施'targets and terror'式硬挂钩考核（管理者
        可因不达标去职），威尔士/苏格兰无同等挂钩——考核压力档位由制度文本可判。
        Bevan & Hood (2006) 记录英格兰上报等待数据的博弈与操纵证据；救护车
        响应时间上报分布在8分钟考核阈值处异常堆积（bunching）——失真形态
        精确命中'达标线考核→阈值堆积'的事前方向预测。
      confidence: moderate
    - anchor: "苏联产量虚报 (pripiski) 与乌兹别克棉花案（跨体制普遍性）"
      evidence: |
        Berliner (1957) 系统记录苏联企业在产量计划考核下的虚报（pripiski）为
        普遍管理实践；1970s–80s乌兹别克棉花案系统性虚报棉花产量（骗取巨额收购款，
        后经航拍等独立核查揭穿并大规模问责）。计划经济体制下同一机制出现，
        支持'结构机制而非特定制度缺陷'。
      confidence: moderate
    - anchor: "大跃进粮产虚报的双通道方向裁决（预测 d，多通道冲突规则实证）"
      evidence: |
        1958–59年同一上报量（粮食产量）进入两个受益方向相反的通道——征购通道
        （报高→按产定购→辖区被过度征购，损失落在农民不落在官员个人考核）与
        政治考核通道（报低→被打成右倾，一票否决级、直接系于官员个人政治生命）。
        按 benefit_direction 已注册的多通道冲突裁决规则事前导出：个人考核净受益
        为准，硬挂钩/一票否决 > 软挂钩，落个人的奖惩 > 不落个人考核的辖区损失
        → 报高——与史实方向一致。跨通道冲突下方向仍可从考核结构事前导出，
        为(d)的强形式支持。收编于冲突规则注册并经 round-2 审查复核确认之后
        （见 ADV-REVIEW-036 round_2 猎四）。
      confidence: moderate
    - anchor: "希腊财政赤字低报与 Eurostat 核查权改革（预测 i + d，超国家科层）"
      evidence: |
        赤字为负向水平指标，与欧盟《稳定与增长公约》超额赤字程序硬挂钩
        （制裁+欧元区资格），数据由成员国政府自报，2010年前 Eurostat 无实地
        审计权——三前件齐备，按注册分支(0)事前导出报低。2004 与 2009–10 年
        两次曝光希腊系统性低报赤字，方向命中。2011年起 Eurostat 获实地核查权
        后失真收缩——但该改革时机直接尾随危机曝光，按已注册识别纪律不计入
        (iii)证据，仅计(i)(d)。把跨体制判据扩展到超国家科层。收编于 round-3
        审查猎捕提示之后（见 ADV-REVIEW-036 round_3 猎一），所套分支(0)注册
        在先。
      confidence: moderate
    - anchor: "美国高利害考试问责后的舞弊模式（预测 i + 独立核查技术）"
      evidence: |
        Jacob & Levitt (2003) 用答案串异常模式（独立于上报分数的统计核查）估计
        芝加哥公立学校教师舞弊发生率，并发现其随高利害问责引入而上升；
        亚特兰大2009年舞弊案由擦除分析（独立核查技术）揭穿并起诉。
        考核压力档位与核查技术时点均可独立编码。
      confidence: moderate
  counterexamples: []
  boundary_cases:
    - case: "税收实缴、经严格外部审计的上市公司财报等'自带核查'的指标"
      analysis: |
        考核压力高、数据名义上由被考核方生产，但核查成本极低（钱要真实入库/
        审计师有独立取证权与连带责任）→ 失真被压缩。这是前件(3)的调节预测
        而非反例——若此类领域失真反而更大，才构成反例。注意财务舞弊仍偶发
        （如安然），但其发生率与审计强度负相关这一点与推论方向一致。
      status: boundary_case
    - case: "'挤水分'自曝——下级主动揭露失真，表观上违反受益方向"
      analysis: |
        辽宁/内蒙古新任领导主动核销虚增。用受益方向的事前导出可消化——对
        【新任】官员，前任虚报抬高了基数使自己任内增长指标更难达成，报低基数
        才受益；失真方向仍随现任者的受益梯度走，属确认案例而非反例。
        为防事后开脱：'新官挤水分'的预测须限定在换届+增长基数考核并存的场景，
        且可事前从换届时点导出。
      status: boundary_case
    - case: "考核同时提升真实绩效的案例（NHS等待时间真实缩短的部分）"
      analysis: |
        独立审计确认英格兰等待时间有真实改善分量，同时有操纵分量——真实响应
        与策略失真并存，与本推论的边界声明一致。检验时须用独立基准解耦，
        不得把'指标改善'整体计为失真、也不得整体计为真实。
      status: boundary_case

discriminant_validity: |
  【独有可证伪预测】相对相邻理论逐一判别——
  (1) vs Goodhart/Campbell 定律：它们是无比较静态的格言；本推论独有三条可测
  比较静态——考核切换前后差(i)、层级深度梯度(ii)、核查成本弹性(iii)。
  (2) vs 委托-代理理论：委托-代理预测'存在道德风险与信息租金'，不给失真的
  事前方向导出规则、不给层级累积预测、通常将监督强度内生化而不做核查技术冲击
  下失真收缩的可逆干预预测。本推论的(d)方向符号检验与(iii)干预预测是其不覆盖的。
  (3) vs '官僚文化/体制特殊论'：跨体制（列宁式计划/福利国家/联邦民主）出现
  同构失真形态是本推论的判据性预测，特殊论无此预测。
  【防平凡化守卫】非平凡内核精确定位在三处，不压在会被常识吸收的卖点上——
  '指标会被博弈'是常识（Goodhart 已讲），不是本推论卖点；卖点是
  (a) 失真方向可从考核文本【事前】导出（含报低与阈值堆积两种非报高形态），
  (b) 层级深度作为失真放大器的梯度预测（附加条件：考核压力逐层传导；层级计数
  口径已注册——仅自身被同一/派生指标考核挂钩的层级计入），
  (c) 核查成本作为可逆干预杠杆——引入时点可文档化但常内生于失真曝光，
  失真收缩是方向明确的预测，识别须与(i)同纪律（分批推开+未改革对照）。

