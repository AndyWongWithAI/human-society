id: DED-038
type: deduction
layer: L3-deductions
status: candidate
term: "制度信任崩解×法币功能解耦：恶性通胀的双重时间不对称 (Institutional Trust Collapse × Fiat Function Decoupling: Double Time Asymmetry of Hyperinflation)"

人话摘要: "制度信任崩了之后，钱的两样功能各跑各的——'存钱'功能因为信任掉得快先跑（大家赶紧把钱换成金条、外币），但'标价'功能因为记忆惯性还留在原地（工资合同、商品标价还是用老货币）。这一快一慢之间，大家都想卖、没人想买，单向抛售压着货币继续贬，贬值又进一步砸信任——自己追着自己跑的恶性循环。"

statement: |
  【核心】制度信任崩解时，货币的价值储藏(SOV)与记账单位(UOA)两大功能产生结构性解耦——
  SOV因信任急坠而快速逃逸（快变量，受BR-L2-031"制度信任跌快涨慢"驱动），
  UOA因记忆滞后而残存（慢变量，受BR-L2-024"通胀记忆比实际消退慢"锁定）。
  两种速度差创造了一段"人人都想卖、没人愿意买"的单向卖出压力窗口，
  货币进一步贬值→信任进一步崩解（BR-L2-031反馈），形成自我强化的贬值螺旋。

  【驱动量】(i)制度信任崩解速度——由BR-L2-031的损失厌恶+信息不对称机制决定，
  负面事件（违约/管制/银行崩溃）冲击远大于正面积累速度；
  (ii)记忆滞后强度——由BR-L2-024确立，通胀预期的锚定对象是历史经验而非当前政策，
  工资合同/商品标价的调整受此惯性约束；
  (iii)UOA切换的制度摩擦——契约刚性（长期工资合同）、价格菜单成本、
  税收法定货币条款共同构成UOA残存的制度底座。

  【预测】(i)时序结构性——在制度信任驱动的恶性通胀中，
  SOV功能转移时点（黄金/外币购买量飙升）系统性早于UOA功能转移时点
  （工资/价格开始用外币标价），UOA不会先于或同步于SOV转移。
  (ii)缺口-峰值正相关——SOV-UOA转移时间差与最终通胀峰值正相关：
  时间差越大，累积的单向卖出压力越多，贬值螺旋跑得越远。
  (iii)UOA转移的临界触发——UOA切换不是平滑发生的，而是在"SOV已完全逃逸+
  日常交易中法币拒收率达到临界值"时才集中触发——
  工资谈判率先破防（劳动者拒绝以法币计价劳动）、
  随后商品标价跟随（商家为避险改用外币标价）。

  【判别】与DED-028（SOV-MOE解耦）的核心差异——
  DED-028覆盖SOV逃逸vs交易媒介(MOE)瓦解，本推论覆盖SOV逃逸vs记账单位(UOA)残存。
  两者涉及不同的功能对、不同的粘性机制（MOE粘性靠法律强制，
  UOA粘性靠记忆滞后+契约刚性），产生不同的招牌预测
  （DED-028招牌是delta随信用下滑速度非线性变化，
  本推论招牌是SOV-UOA缺口与通胀峰值的正相关）。
  与BR-L2-031/024单砖的核心差异——
  两砖各自确立了"信任不对称"和"记忆滞后"的经验规律，
  但均未讨论两者在恶性通胀中的交互效应——
  信任崩解速度×记忆滞后强度共同决定贬值螺旋的烈度，
  且产生"SOV-UOA缺口越大→峰值通胀越高"这一
  两条砖各自无法独立推出的预测。

operationalization:
  制度信任崩解速度:
    definition: "制度信任沿BR-L2-031下降曲线下滑的速率——由可辨识的负面制度事件触发，损失厌恶使下降陡峭、信息不对称使负面信号传播加速"
    measurement: "可用以下代理变量的变化率测量：(a)主权CDS利差的周度展宽幅度；(b)制度信任调查（Edelman/Gallup）的季度降幅；(c)本币存款/外币存款比的月度变化率。至少一个可行路径即可"
    limitations: "代理变量各有侧重——CDS适合极端低信用段、调查适合中段、存款比适合中低段。快速崩解事件中各代理方向应一致但幅度可能不同"
  SOV转移时点:
    definition: "储蓄从法币计价资产向非法币储藏工具（金、外币、实物资产）大规模转移的可观测起始时间点"
    measurement: "黄金/外币购买量的月度时间序列——以购买量突破历史均值+2σ且后续≥3个月持续高于均值的首月为T_SOV。也可辅以家庭金融资产调查中非法币工具占比的同比变化"
    limitations: "购买量数据可能受供应约束（金条缺货/资本管制）影响——需辅以黑市溢价数据区分'想买买不到'和'不想买'"
  UOA转移时点:
    definition: "工资合同/商品标价/服务收费从以本币计价转向以外币（或实物锚）计价的系统性转换起始时间点"
    measurement: "可分别测三个子指标取最早触发者：(a)工资UOA——正式部门集体工资协议中首次出现外币计价条款的季度；(b)价格UOA——主要消费品（食品/房租）标价中外币标价占比首次突破20%的月份；(c)大额交易UOA——房地产/汽车广告中外币标价占比首次突破50%的月份。T_UOA=三者最早触发时间"
    limitations: "非正式经济中的UOA切换可能早于正式部门——调查数据（商户访谈/广告内容分析）可补充但覆盖不完整。阈值(20%/50%)为预注册值，事后不调整"
  SOV-UOA时间差:
    definition: "T_UOA − T_SOV，以月为单位"
    measurement: "直接用上述T_UOA和T_SOV的操作化定义计算差值"
    limitations: "时间差的测量精度受制于T_SOV和T_UOA各自的测量误差——两者叠加后置信区间变宽。仅适用于中等以上制度信任崩解事件（通胀率峰值>100%年率），轻微通胀中SOV迁移可能不显著"
  通胀峰值:
    definition: "该次恶性通胀事件中月度同比通胀率的最大值"
    measurement: "官方CPI月度同比数据的峰值——若官方数据被质疑（如价格管制导致低估），辅以独立估算（如Steve Hanke的隐性通胀测算、黑市汇率贬值率）"
    limitations: "官方CPI在恶性通胀期间常被政治干预——交叉验证独立测算可部分缓解但无法完全消除测量误差"

derivation:
  from_l1:
    axioms: [AXIOM-002]
    theorems: [THEOREM-value-attribution, THEOREM-relation-information-asset]
  from_l2:
    bridging: [BR-L2-031, BR-L2-024]
  steps: |
    1. 承重砖已确立：货币的SOV与MOE是独立的功能维度（BR-L2-022），
    但BR-L2-022未覆盖SOV与UOA的可分离性。本推论提出'SOV与UOA可独立解耦'作为核心假说，
    其依据来自：UOA的切换受社会协调惯性（纳什均衡）、契约刚性（长期合同）和记忆滞后
    （BR-L2-024）三重锁定，而非来自BR-L2-022的直接支撑。
    经济学文献中，UOA惯性在恶性通胀案例（如魏玛德国、津巴布韦）中有广泛经验证据
    （参见 Fischer, 1982; Bernholz, 2003; Hanke & Krus, 2012），
    表明UOA的切换滞后于SOV，且切换成本（协调成本、菜单成本）显著高于SOV。
    因此，SOV-UOA独立性作为假说而非公理，在本推论中由机制和文献共同支撑。

    2. 承重砖已确立：制度信任的衰减是"跌快涨慢"的不对称过程（BR-L2-031）——
    损失厌恶使失信被编码为从参照点的损失、触发快速大幅的信任下调，
    信息不对称（负面事件高显著性vs正面事件低显著性）进一步放大衰减速度。
    一次可辨识的制度失信（主权违约/银行崩溃/资本管制）可在数周至数月内
    将信任从高位打到谷底。

    3. 承重砖已确立：法币信用的记忆滞后效应（BR-L2-024）——
    经历过信用崩塌的群体在个体生命周期内持续保留对非法币资产的配置偏好，
    通胀预期的锚定对象是历史经验而非当前政策，记忆比实际通胀消退慢。

    4. 从(1)(2)(3)推导SOV-UOA解耦的时序结构性：
    SOV是纯信心驱动——当制度信任沿BR-L2-031曲线快速下滑时，
    SOV作为"对未来购买力稳定性的预期"首当其冲，持有者迅速将储蓄
    转换为金/外币/实物（信任急坠→储藏急逃）。
    UOA则不同——它由社会协调惯性（"大家都用这个标价"的纳什均衡）、
    契约刚性（长期工资合同/房租合同以法币计价）、
    和BR-L2-024的记忆滞后（"这钱虽然贬了但我习惯用它想价格"）
    三重锁定——即使货币在贬值，人们仍惯性用法币标价和记账。
    SOV逃逸是快变量（信任驱动的急速反应），
    UOA残存是慢变量（惯性+契约+记忆三重锁定），
    时序结构性由此产生——SOV必然先于UOA转移。

    5. 推导单向卖出压力窗口与贬值螺旋：
    SOV已逃逸意味着储蓄者不再愿意持有法币（买家退场），
    UOA仍残存意味着工资/商品仍以法币标价（卖家仍在用法币报价）。
    此时市场上出现结构性不对称——拿到法币的人想尽快脱手（卖），
    但没有对应规模的买家接盘（因为储蓄需求已转向非法币资产）。
    单向卖出压力→法币加速贬值→贬值本身成为新的负面制度事件→
    进一步触发BR-L2-031的信任下调→SOV逃逸加速→卖出压力更大。
    这是BR-L2-031（信任崩解）与BR-L2-024（记忆滞后）
    在恶性通胀中的交互正反馈——两砖各自独立时不产生螺旋，
    但合在一起时：信任崩解触发SOV逃逸（BR-L2-031），
    记忆滞后锁住UOA残存（BR-L2-024），
    两者之间的速度差创造并维持单向卖出压力窗口。

    6. 推导SOV-UOA缺口与通胀峰值的正相关：
    SOV-UOA时间差越长→累积的单向卖出压力越大→
    贬值幅度越大→峰值通胀越高。
    反之，若UOA切换来得很快（如劳动合同、商品标价迅速改用外币），
    UOA切换本身切断了"用法币标价→用法币收款→被迫持有法币→
    急于脱手"的链条，卖出压力被释放，贬值螺旋被截断，
    峰值通胀反而更低。这不是"通胀高导致UOA切换慢"的反向因果——
    是"SOV-UOA缺口作为贬值压力的累积窗口长度，
    决定了螺旋能跑多远"的因果方向。

    7. 非平凡性（逐格判空）——2×3判据表
    （制度信任崩解速度[慢/快] × 被预测项[SOV转移时序/UOA转移时序/SOV-UOA缺口与通胀峰值关系]）：

    慢速崩解：SOV缓慢迁移（BR-L2-024中段已覆盖）、
    UOA可能永不完全转移（社会适应双重标价）、
    SOV-UOA缺口不显著且与通胀峰值无统计相关
    ——本推论在此区间不做强预测。

    快速崩解★：SOV急速逃逸、UOA滞后残存、
    SOV-UOA缺口与通胀峰值正相关——
    这是本推论的招牌预测区间。

    brick=conclusion审计——以下内容已在砖中，本推论不重复主张：
    "制度信任跌快涨慢"（BR-L2-031 statement(a)-(b)）
    "法币信用是连续谱且记忆滞后"（BR-L2-024 statement(a)-(c)）
    "SOV与UOA是独立功能维度"（BR-L2-022 statement(b)）
    "SOV先于MOE崩塌"（DED-028——覆盖不同的功能对）

falsifiability: |
  (a) 若在制度信任驱动的恶性通胀事件（通胀峰值>100%年率，
  且存在可辨识的制度失信触发事件）中，观察到UOA功能转移时点
  早于或同步于SOV功能转移时点——即工资/价格开始用外币标价
  在黄金/外币购买量飙升之前或同时——
  则本推论的核心时序预测被证伪。

  (b) 若在至少5个独立恶性通胀事件样本中，
  SOV-UOA时间差与通胀峰值的Spearman秩相关系数不显著（p>0.05）
  或为负——则本推论的"缺口-峰值正相关"招牌预测被证伪。

  (c) 若UOA转移的触发模式是平滑渐进（与通胀率线性共变）
  而非SOV完全逃逸后的集中触发——
  则本推论的"UOA临界触发"预测被证伪。

  适用区间：适用于法币体系下由制度信任崩解（主权违约/银行系统崩溃/
  资本管制/恶性通胀）驱动的货币功能解耦，不适用于行政命令式货币替换
  （如德国1948货币改革）、不适用于主权突变式货币区分裂
  （如苏联1991卢布区解体）、不适用于温和通胀（峰值<100%年率）。
  例外：在极端恶性通胀（月通胀率>10^10%/月）中，UOA残存机制被极端速度削弱，
  缺口-峰值正相关预测的适用性需单独评估（参见Hungary 1945-1946反例）。

falsification_trace:
  primary_suspect: BR-L2-031
  secondary_suspect: BR-L2-024
  unlikely_suspect: BR-L2-022
  note: "招牌预测（SOV-UOA缺口与通胀峰值正相关）压在BR-L2-031的信任崩解速度上——若制度信任崩解在实际恶性通胀事件中无法被独立、可靠地测量（BR-L2-031本身为weakly_verified，制度信任直证仅0.6-1.0），则整个'SOV逃逸速度→缺口长度→峰值通胀'因果链的发动机无法被独立检验，推论退化为'通胀高→UOA切换慢'的平凡相关性陈述。BR-L2-024的记忆滞后是辅助锁定机制（解释UOA为何残存）但非瓶颈——即使记忆滞后被弱化，UOA仍有契约刚性+社会协调惯性作为替代锁定机制。BR-L2-022的功能独立性是概念基础，已被多源验证，是最安全的一环。"

excluded_outcomes:
  - "交易媒介(MOE)的解耦动力学——由DED-028覆盖，本推论限于SOV-UOA功能对"
  - "行政命令式货币替换（货币改革/主权突变）下的功能转移——本推论限于内生制度信任崩解驱动的恶性通胀"
  - "信用恢复期的反向时间不对称（信任重建时SOV回流是否滞后于UOA回流）——独立推论主题"
  - "温和通胀（峰值<100%年率）下的SOV-UOA关系——本推论仅在恶性通胀区间做强预测"
  - "代际传递的记忆对UOA残存的影响——BR-L2-024(c)明确不为代际永恒背书，本推论同"

anti_talisman_clause: |
  判定"制度信任崩解速度"必须独立于"SOV-UOA缺口大小"和"通胀峰值"测量——
  不得用"缺口大"或"通胀峰值高"反推"信任崩解速度快"。
  制度信任崩解速度必须通过预注册的代理变量（主权CDS展宽/制度信任调查降幅/
  本外币存款比变化率）在事前可测的方式锁定，
  不得在看到通胀结果后挑选"最能解释峰值"的代理。
  判定"UOA转移时点"必须独立于"SOV转移时点"和"通胀峰值"——
  UOA转移的判据（工资/价格/大额交易中外币标价占比）需在事前锁定阈值，
  不得以"最大化时间差"或"最大化与通胀峰值的相关性"为目标事后调整阈值。
  至少一个承重锚（如津巴布韦2000s的SOV逃逸→UOA转移时间序列）
  需独立测出制度信任崩解速度（按预注册的CDS展宽或调查降幅），
  不依赖"事后通胀峰值很高"来判定"事前信任崩解很快"。

nontriviality_test: |
  逐格判空（2×3判据表：制度信任崩解速度×被预测项）。

  速度\预测  | SOV转移时序    | UOA转移时序    | SOV-UOA缺口与通胀峰值关系
  慢速崩解   | 缓迁(砖已覆盖) | 可能永不完全转移 | 缺口不显著/无统计相关
  快速崩解★  | 急速逃逸       | 滞后残存       | 缺口与峰值正相关★

  标★的格为本推论的非平凡主张。

  "快速崩解下SOV-UOA缺口与通胀峰值正相关"：
  BR-L2-031单独确立了"信任跌快涨慢"，但未讨论信任崩解速度如何通过货币功能解耦
  传导至通胀峰值。BR-L2-024单独确立了"记忆滞后"，但未讨论记忆滞后如何与
  信任崩解速度交互产生可测量的宏观变量相关性。BR-L2-022确立了功能可分离，
  但未讨论功能解耦的时间差本身是否影响通胀结果。
  三块砖各自提供了必要条件（信任会快速崩解/记忆会滞后/功能可分离），
  但没有一块砖能独立推出"缺口越大→峰值越高"这一预测——
  它需要将BR-L2-031的速度维度、BR-L2-024的惯性维度、
  和BR-L2-022的功能独立性三者放入同一个时序框架中交互。
  这是本推论的核心非平凡增量。

  "快速崩解下SOV必然先于UOA转移"：
  BR-L2-031说明信任急坠，BR-L2-022说明SOV是信心驱动，
  两者合力可推出"SOV随信任崩解而逃逸"——但这近乎平凡。
  非平凡部分在于：UOA转移的滞后不是偶然的，而是由
  BR-L2-024记忆滞后+契约刚性+社会协调惯性三重锁定的结构性滞后——
  且这一滞后在快速崩解下反而创造了单向卖出压力窗口和贬值螺旋。
  将"滞后"从消极描述（UOA只是反应慢）升级为积极机制
  （滞后本身是螺旋放大器）——这是本推论对砖的理论增量。

real_world_anchors:
  supporting:
    - "津巴布韦2000s：SOV早在2000年代初已开始向USD/南非兰特转移（地产和外汇存款替代本币储蓄），但工资合同和商品标价迟至2007-2008年才系统性改用外币计价——SOV-UOA时间差约5-7年。2008年通胀峰值达每月79.6十亿%（Hanke测算），是全球有记录以来最高的恶性通胀之一——长缺口+极端峰值，符合缺口-峰值正相关预测"
    - "委内瑞拉2010s：玻利瓦尔SOV功能在2013-2015年间逐步流失（储蓄转USD/房地产/黄金），但工资和价格迟至2018-2019年才广泛改用USD标价——SOV-UOA时间差约3-5年。期间年通胀率峰值约1,700,000%（2018，IMF估算），与较长缺口一致"
    - "魏玛德国1923：在恶性通胀的最后阶段（1923年秋），SOV早已完全消失（储蓄全转为实物/外币），但马克作为UOA残存至最后——工资按日支付并按生活指数调整但【仍以马克标价】，商店按小时更新价格但【仍以马克标价】。UOA的最终放弃（改用金马克/外币标价）在时间上晚于SOV的完全逃逸"
    - "阿根廷多次循环：比索SOV功能在每次危机中率先逃逸（美元化储蓄），但工资合同和价格标签仍以比索计价——'存美元、花比索'是阿根廷中产阶级的长期生存策略，SOV-UOA分离持续数十年而非数月"
  counterexamples:
    - "须猎：是否存在制度信任崩解时UOA先于SOV转移的案例？候选——1948年德国货币改革：帝国马克一夜换德国马克，SOV和UOA同时切换。但此为行政命令式货币替换而非内生信任崩解，属于射程外（见excluded_outcomes）而非反例"
    - "须猎：1990s南斯拉夫恶性通胀（1993-1994）：第纳尔在1993年经历每月313百万%的通胀峰值后，1994年1月以'新第纳尔'1:10亿替换。SOV逃逸（德国马克化）与UOA保留的时序是否符合本推论预测？需核实该案例中工资/价格改用马克标价的具体时间线——若工资在SOV大规模逃逸前已改用马克标价，则构成本推论的反例"
    - "须猎：是否存在'SOV-UOA缺口长但通胀峰值低'或'SOV-UOA缺口短但通胀峰值高'的案例？前者需核实：若某国在SOV逃逸后迅速完成UOA切换（如合同指数化、价格双标快速普及），按本推论预测通胀峰值应较低——厄瓜多尔2000年正式美元化前的非官方美元化阶段可能提供检验"
    - "Hungary 1945-1946：pengő恶性通胀（月峰值4.19×10^16%），整段历时约12个月，价格每15小时翻倍。SOV-UOA缺口被极端速度压缩至数周，产生短缺口+极端高峰值，与招牌预测方向相反。处理方式：限制招牌预测在极端恶性通胀（月通胀率>10^10%/月）的适用性，因为在此区间UOA残存机制被极端速度削弱，缺口-峰值正相关可能不成立。"
  boundary_cases:
    - "工资/价格指数化的中间地带：巴西1990s的'货币纠正'(correção monetária)——合同和价格按通胀指数自动调整但仍以本币（克鲁塞罗/雷亚尔）标价。这算UOA转移吗？严格按本推论操作化：不算——UOA转移的定义标尺是'计价货币变为外币'而非'本币计价但锚定指数'。但指数化大幅削弱了UOA残存的破坏力（切断了单向卖出压力→贬值的反馈链），可能解释巴西在长期高通胀下未出现津巴布韦级峰值"
    - "多货币并行标价（如柬埔寨的美元/瑞尔双币体系）——按本推论操作化：公众日常使用外币标价而非仅用于大额交易时，UOA已部分转移。但柬埔寨的瑞尔仍广泛用于小额零售和工资计价——这是'边界案例'而非反例，因为它恰好展示了UOA转移的渐进性：大额→工资→零售的递进模式与本推论预测的'UOA残存由日常交易记忆锁定'一致"

