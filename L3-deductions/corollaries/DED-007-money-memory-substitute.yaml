      - "独立反例(中世纪汇票/集市清算/马格里布):D3高+D2声誉在场⇒纯信用轧差、不生流通货币,击穿 D3 单独充分。真正决定货币vs信用的是 D2 不是 D3。"
    full_record: "见 ADV-REVIEW-012.round_2_confirmation"
