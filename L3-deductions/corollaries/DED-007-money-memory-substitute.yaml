id: DED-007
type: deduction
layer: L3-deductions
status: rejected

term: "通货三驱动解离推论 (Three-Driver Dissociation of Money Emergence)"

人话摘要: "钱(通用交换媒介)从哪来?教科书给单一原因:门格尔说'为解决物物交换不便(你要的我没有)';另一派说'为替代记忆(陌生人之间没法赊账)'。本推论说:逼出货币的原因【至少有三个,而且能各自拆开、每个单独都够】——(D1)东西难换(门格尔);(D2)认不出人、记不住谁欠谁(陌生人);(D3)一大群人多边欠来欠去、记账本身太麻烦。关键证据是能把它们【拆开】:战俘营里配给包齐整(D1 不成立)、战俘长期关一起还算认得(D2 也弱),可人多、多边(D3 高),照样冒出香烟当钱——这一个案例同时把门格尔和'纯记忆论'都反驳了,单单剩下 D3 在起作用。反过来,村里两户长期往来(三个原因都弱),再大额也挂账不掏现。所以货币是'多因、可拆、每因单独就够',不是任何单一理论说的那一个原因。"

statement: |
  货币/通用交换媒介的涌现,由【至少三个可各自解离、且各自单独充分】的驱动逼出;三者对应
  三块承重砖各自坐实的【机制】,但"可解离 + 各自单独充分 + 由此反驳单因理论"是本推论的
  【合成命题】,不在任何单块砖里:
    D1 匹配困难(门格尔/Jevons,标准账):物物交换双重需求巧合稀缺 ⇒ 通用媒介降匹配成本。
    D2 记忆失效(BR-L2-011):对手匿名/不可追踪 ⇒ 赊账无法执行 ⇒ 媒介替代缺失的记忆。
    D3 多边结算成本(BR-L2-012):多边债务网记账/清算有成本(≈O(N²)) ⇒ 通用媒介当场结清、
       省去维护债务网。

  【核心(合成命题,砖单独给不出)】
    (1) 三驱动【可解离】:能找到"只有其中一个高、另两个低"的真实交换场景(见 dissociation
        锚表)。三者不是同一件事的三种说法。
    (2) 每驱动【单独充分】:某一驱动高、另两个低时,通用媒介仍被逼出。
    (3) 由 (1)(2) ⇒ 【单因理论各被一个隔离案例反驳】:门格尔(只 D1)被"匹配易却生币"的
        案例反驳;朴素"货币即记忆"(只 D2)被"记忆在场却生币"的案例反驳。货币是【多因、
        可拆、每因单独即足】。

  【招牌预测(解离表)】固定另两维,只抬升一维,通用媒介应随该维单独出现:
    - D3 隔离(D1 低 + D2 低/中 + D3 高):战俘营香烟货币——配给包同质(匹配易)、战俘长期
      关押相对可追踪(记忆偏在场),仍生通用媒介 ⇒ 隔离出 D3,同时反驳门格尔与纯记忆论。
    - 三维皆低:紧密双边重复(村庄两户长期往来)⇒ 走信用/挂账,不必通货。
    - D2 隔离(D2 高 + D1 中 + D3 低):匿名一次性双边(单次沉默贸易)⇒ 当场易货/简单商品
      媒介即可,不需复杂记账货币。
    - 三维皆高:匿名多边大市场 ⇒ 强通货。

  【与单因理论的判别】门格尔预测"凡物物不便处即生货币"(只认 D1);"货币即记忆"预测"凡
    匿名处才生货币"(只认 D2)。本推论预测二者都【不完备】,各被自己那一维为低的隔离案例
    反驳,而 D3 是被两派共同忽略、却可单独隔离的第三驱动。

# === 规则 A：操作化定义 ===

operationalization:
  d1_matching_difficulty:
    definition: "物物交换匹配困难度——双重需求巧合的稀缺(商品异质性、双向需求重合概率低)。"
    measurement: "商品种类异质性、双向需求重合概率。可独立于 D2/D3 测(如战俘营:配给包同质 ⇒ D1 低,可观测)。"
    limitations: "连续量;是门格尔标准账对应的维。"
  d2_memory_availability:
    definition: "交易对手身份是否可追踪/有共享记忆(重复出现、跨次可追溯、有'下次')。"
    measurement: "网络结构:对手重复率、身份跨次可追溯性、关系存续期。独立于'是否出现通货'测(沿用 BR-L2-009 trust_radius 手法)。"
    limitations: "软约束、连续量;与多边度(D3)相关但不同——单边匿名 ≠ 多边可追踪。"
  d3_multilaterality:
    definition: "交换网络的多边度——不同对手数、对子复现率之低。高多边 = 众多对手、少复现。"
    measurement: "不同对手数 / 对子复现率;可独立于 D1/D2 测(战俘营:人多、对子少复现 ⇒ D3 高,而 D2 偏在场、D1 低)。"
    limitations: "多边度与匿名度需分测——正是 round-1 审查揭出的焊死点,本版拆开。"
  outcome_medium_vs_credit:
    definition: "该交换领域的结算主要靠【流通通用媒介】还是【信用/记账/声誉】,取一段时期。"
    measurement: "考古/档案:通货/商品货币的流通证据 vs 债务记账、赊欠、声誉执行的证据。取主导模式。"
    dissociation_note: |
      【本推论的判别命脉】三驱动的"可解离 + 各自单独充分"须由【一维高、另两维低】的真实
      隔离案例检验,每维至少一个;不得因"出现了媒介"就倒推"必是某驱动"。尤须锁定另两维
      被独立观测为低的案例(战俘营:D1 低由配给包同质可观测、D2 偏在场由长期关押可观测),
      否则三驱动会被偷偷混同、沦为不可证伪(ADV-REVIEW-012 教训)。受 anti_talisman_clause 约束。

# === 推导链 ===

derivation:
  from_l1:
    axioms: [AXIOM-003]
    theorems: [THEOREM-relation-information-asset, THEOREM-cooperation-precondition, THEOREM-exchange-competition-alternative]
  from_l2:
    bridging: [BR-L2-005, BR-L2-009, BR-L2-011, BR-L2-012]

  steps:
    1. "三块砖各坐实一个机制"
       D1:物物匹配困难 ⇒ 通用媒介降匹配成本(门格尔/Jevons 标准账,THEOREM-exchange-
       competition-alternative 的交换动机)。D2:BR-L2-011,匿名/不可追踪 ⇒ 媒介替代记忆。
       D3:BR-L2-012,多边 ⇒ 媒介降结算成本。三砖各自只说"该机制存在"。
    2. "记忆在场则信用是媒介的替代(BR-L2-005)"
       重复/可追踪时信用/互惠可延时对付——故通用媒介【非必然】。是否用媒介取决于三驱动是否
       把信用/易货压到不可行。
    3. "合成命题①:三机制可解离(砖的合取给不出)"
       三块砖各说"机制存在",但"能否找到只抬升一维的真实场景"是【经验结构命题】,非三砖合取
       的逻辑后承。本推论主张可解离,并以 dissociation 锚表(每维一个隔离案例)承担证伪。
    4. "合成命题②:每机制单独充分(砖的合取给不出)"
       "某维高、另两维低时媒介仍被逼出"是比"机制存在"更强的经验主张。战俘营(D3 隔离)是其
       最直接检验:D1 低、D2 偏在场,媒介仍生。
    5. "由①②得判别(合成命题③)"
       三驱动可解离且各自单独充分 ⇒ 任何【单因】理论(门格尔=只 D1、货币即记忆=只 D2)都被
       其驱动为低的隔离案例反驳。这是本推论的非平凡内核——它【不是】三砖的合取(合取只给
       "三机制都存在"),而是关于驱动空间【可分离性 + 各自充分性 + 单因不完备】的结构命题。
    6. "诚实边界"
       本推论不主张"恰好三个、再无其他驱动"(可能有更多),只主张"这三个各自可解离且单独充分,
       故单因论不完备"。完备性是弱主张,可解离+单独充分是强主张,后者承重。

# === 可证伪性 ===

falsifiability: |
  本推论可被以下发现证伪：
  (a) 【解离失败】三驱动【无法】被真实案例分离——D1/D2/D3 在所有已知案例里总是同起同落,
      找不到"一维高、另两维低"的隔离点。则"三驱动"是同一件事的三种说法,合成命题坍塌。
  (b) 【单独充分证伪】某驱动被隔离为高(另两维经独立测为低)时,通用媒介【不】涌现、纯靠
      信用/易货支撑。则该驱动"单独充分"被证伪(尤以 D3:战俘营式场景若普遍走信用而非媒介)。
  (c) 【单因反超】某个单因理论(只 D1 或只 D2)被证明能【完整】解释所有隔离案例(包括战俘营),
      无需第三驱动。则多驱动主张被证伪。

falsification_trace:
  primary_suspect: "合成命题②(每驱动单独充分),尤其 D3 的单独充分——压在战俘营等隔离锚上。最先受检:战俘营的 D1 低、D2 偏在场是否真被【独立测量】固定(而非从'出现香烟'倒推)。"
  secondary_suspect: "合成命题①(可解离)——D2(匿名)与 D3(多边)在真实历史中是否总共变、能否真找到'可追踪却多边'的隔离点。"
  unlikely_suspect: "三机制各自存在(D1 门格尔、D2 BR-L2-011、D3 BR-L2-012 均有据)——极少是问题根源;问题在'可解离/单独充分',非'机制是否存在'。"
  note: "本推论刻意规避 round-1 的 brick=conclusion:承认三机制各在砖里,把非平凡重量压在【可解离 + 各自单独充分 + 单因不完备】这一砖的合取【给不出】的结构命题上;并把 D3 从 BR-L2-011 拆出为 BR-L2-012,使 D2/D3 可各自独立证伪。"

# === 排除的结果 ===

excluded_outcomes:
  - outcome: "三驱动无法被任何真实案例解离(总是同起同落)"
    description: "找不到'一维高、另两维低'的隔离点。若如此,三驱动是同一件事的三种说法,推论坍塌。"
  - outcome: "某隔离驱动为高、另两维独立测为低,却不生媒介、纯走信用/易货"
    description: "如战俘营式(D3 高、D1 低、D2 偏在场)场景普遍走信用而非通用媒介。则'单独充分'被证伪。"
  - outcome: "单因理论完整解释所有隔离案例"
    description: "只 D1 或只 D2 即可解释含战俘营在内的全部案例、无需第三驱动。则多驱动主张被证伪。"

anti_talisman_clause: |
  【防不可证伪护身符 — 诚实硬约束】判定某案例"隔离了哪个驱动",必须对【另两维独立测量为低】,
  由可观测量(D1:商品同质性;D2:对手重复率/可追踪性;D3:对手数/对子复现率)证明,【不得】
  因"出现了通用媒介"就倒推"必是某驱动高"。尤须警惕把 D2(匿名)与 D3(多边)混同——round-1
  正是死在这个焊死上;本版拆为两砖两维后,任一隔离主张都须给出另一维被独立压低的证据
  (如战俘营:D2 偏在场须由长期关押/高重复独立佐证,不能既说它 D2 低又说它 D2 是隔离维)。
  否则本推论沦为不可证伪的循环(DED-004 病根)。

# === 现实锚点 ===

real_world_anchors:
  supporting:
    - anchor: "战俘营香烟货币 (Radford 1945) —— D3 隔离锚(核心)"
      evidence: |
        红十字配给包【同质】⇒ D1(匹配困难)【低】,可观测;战俘长期关押、高重复互动 ⇒
        D2(匿名/记忆)【偏在场】,可观测;但战俘众多、对子少复现 ⇒ D3(多边)【高】。结果
        香烟作为通用媒介涌现。D1 低 + D2 偏在场却生币 ⇒ 隔离出 D3 单独充分,同时反驳门格尔
        (只 D1)与朴素记忆论(只 D2)。
      confidence: "strong(判别性:另两维被独立观测为低/在场,媒介仍生)"
      honest_note: |
        诚实边界:战俘营 D2 非零(有一定可追踪),取其"D2 偏在场却仍生币"的对照力——这【正是】
        隔离 D3 所需(若 D2 也高,则无法排除记忆论)。不夸大为"纯多边"。
    - anchor: "紧密双边重复(村庄两户长期往来、店铺熟客挂账)—— 三维皆低锚"
      evidence: "对手固定、可追踪、双边(D1/D2/D3 皆低)⇒ 走信用/挂账,不必通货。支持'三维皆低⇒信用'。"
      confidence: moderate
    - anchor: "匿名一次性双边(单次沉默贸易)—— D2 隔离锚"
      evidence: "对手匿名、不再见(D2 高),但双边、非多边(D3 低)⇒ 当场易货或简单商品媒介即可,不需复杂记账货币。支持 D2 可单独隔离。"
      confidence: "moderate(诚实:沉默贸易证据零散,作方向性支持)"
    - anchor: "匿名多边大市场 / 集市口岸 —— 三维皆高锚"
      evidence: "陌生人云集、对手众多不复现、商品异质(D1/D2/D3 皆高)⇒ 强通货/铸币。三维叠加的常见情形。"
      confidence: moderate

  reversibility_or_boundary:
    - anchor: "货币'去实体化'回账本(信用卡/移动支付)"
      evidence: |
        技术让身份重新可追踪、多边债务可被账本自动轧差(D2 与 D3 的成本都被技术压低)⇒
        流通实物通货回退为记账/信用。方向性支持三驱动可被技术调低则媒介需求回退。
      honest_note: "诚实标注:现代支付多因(制度/技术/金融化),且'账本轧差'本质是把 D3 成本外包给第三方系统(近 DED-006 外化),非人际记忆归来;仅作弱-中支持,不作强锚。"
      confidence: weak-moderate

  counterexamples: []

  boundary_cases:
    - case: "记账单位 vs 流通媒介 (美索不达米亚以银计价、以大麦/信用支付)"
      analysis: |
        银作【记账单位】、大麦/信用作【支付媒介】——通货'记账单位'功能与'流通媒介'功能可分离。
        本推论只管【流通媒介】的三驱动,记账单位另计,故此案不构成反例,反支持功能分离。
      status: boundary_case
    - case: "D2 与 D3 在多数历史大市场中共变(难解离)"
      analysis: |
        真实大市场往往同时匿名(D2)且多边(D3),两维共变,难分离——这是 falsifiability(a) 的
        高危区。处理:正因如此,战俘营这类【D2 偏在场却 D3 高】的'反常'小案例才是承重的解离
        证据;若最终【找不到任何】D2/D3 分离的案例,则合成命题①坍塌,应诚实降级为"D2、D3 或
        为一体"。当前以战俘营/监狱经济作为分离存在的证据,但诚实标注其解离力待更多独立案例加强。
      status: boundary_case

# === 判别效度 ===

discriminant_validity: |
  与门格尔/斯密(物物交换→货币,只 D1)、与信用货币论/Kocherlakota"货币即记忆"(只 D2)的关系:
  本推论【与两者都 consilience】(D1、D2 各被采纳为一个驱动),但比任一【单因】理论多出
  【三驱动可解离 + 各自单独充分 + 由此断言单因不完备 + 提出被两派共同忽略的 D3】。判别性
  预测:门格尔被"匹配易却生币"(战俘营)反驳、纯记忆论被"记忆偏在场却生币"(战俘营)反驳,
  而 D3 可被独立隔离。诚实:新意在【解离结构 + D3 的隔离 + 单因不完备的判别】,不在"D1/D2
  各是一个驱动"本身(那是门格尔/Kocherlakota 已有)。按 critique_failure_modes,"撞车门格尔/
  信用货币论 ⇒ 平凡"是概念偷换,不成立——本推论恰恰断言二者【各自不完备】,是判别而非附和。

# === 体系内呼应 (consilience,非承重依赖) ===

consilience:
  note: |
    仅 consilience,不作承重 depends_on(以免继承其未决 caveat):
    - 与 DED-006(信任天花板→制度外化):通货是 DED-006'非人格化制度'之一;DED-007 指认其所填
      的具体缺口有三(匹配/记忆/多边结算),细化 DED-006 的'信息/承诺缺口'分支。
    - 与 DED-005(贸易-劫掠):DED-005 的 R2(互惠)即'记忆在场走信用'(本推论三维皆低格)的同源机制。
    三者共用 BR-L2-009(信任/记忆半径)地基。

# === 对抗式审查 (Rule B) ===

adversarial_review:
  round_1:
    reviewer: "独立子 Agent (general-purpose, 全新独立上下文)"
    verdict: needs_revision
    verdict_note: "强修订、逼近 rejected。原稿(通货=记忆替代)的招牌'解离翻转'被逐字证在 BR-L2-011 (a)(b) 里(brick=conclusion);战俘营锚事实搞反且暴露'多边≠记忆'焊死;记忆维护身符未兑现。"
    key_findings:
