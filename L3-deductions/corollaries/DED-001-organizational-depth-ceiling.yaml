id: DED-001
type: deduction
layer: L3-deductions
status: verified

term: "组织深度天花板推论 (Organizational Depth Ceiling Corollary)"

statement: |
  依赖人脑作为信息传递节点的层级组织，其有效管理层级数受信息保真率
  逐级衰减的约束，存在一个热力学上必然的天花板。

  对于纯粹依赖口头和人际信息传递的层级链（无形式化信息系统的辅助），
  有效层级深度不超过约 5-7 级。超过此深度后，顶层接收的信息保真率
  下降到不足以支持准确决策的水平。

  超过天花板后组织必须出现至少一种适应性变化——但不是任意的，
  哪种适应出现取决于组织的信息特性（环境变化速度、任务复杂度、
  信息标准化程度）。推论排除“10+ 级纯口头层级链有效运作”。
人话摘要: "光靠人嘴对嘴传话的组织，管理层级最多也就5到7层——再深，最高层掌握的情况就和基层实际严重脱节了；想再大，只能把信息写下来（官僚化）或把权力下放（联邦化），否则组织会瘦身或散掉。"

# === 规则 A：操作化定义 ===

operationalization:
  information_fidelity_r:
    definition: |
      单级信息传递保真率 r = 经过一级传递后，接收者能准确复现的
      发送者原始信息中"决策相关项目"的比例。
      r ∈ (0, 1)，r=1 表示完全无损传递（热力学上不可能），
      r→0 表示信息完全失真。
    measurement: |
      可通过"序列传递实验"（serial transmission experiment）测量：
      - 被试 1 阅读/观看一段包含 N 个可核验事实的信息
      - 被试 1 凭记忆口头转述给被试 2
      - 重复至第 k 级
      - 统计第 k 级保留的原始事实数 N_k
      - r = (N_k / N)^(1/k)（各级平均保真率）
    empirical_anchor: |
      经典实验中：
      - Bartlett (1932) "Remembering": 序列再现实验中，经过 6-8 次传递，
        民间故事的内容约保留 30-40% 的核心要素，细节大量丢失
      - Allport & Postman (1947) "Psychology of Rumor": 经过 5-6 次
        口头传递，原始信息中的细节保留率约 30-50%，
        出现显著的平化（leveling）和锐化（sharpening）
      - Mesoudi & Whiten (2008) 综述：在多种信息类型的传递链实验中，
        单次传递的保真率通常无法超过 0.9，在口头条件下更接近 0.7-0.85
    limitations: |
      r 值取决于信息类型（故事 vs 数字 vs 指令）、传递者的动机和
      训练、环境噪声等因素。0.7-0.8 是口头传递条件下未经特殊训练的
      数量级估计——提供推论的数量级预测而非精确临界值。
      具体组织的 r 值可在现场研究中通过信息跟踪法测量。

  effective_hierarchy_level:
    definition: |
      一个层级中，上级 N 做出的决策对下属 N-1 的决策空间构成
      实质性约束（不是建议、不是咨询）时，N 和 N-1 之间存在
      一个有效层级。
    measurement: |
      通过组织架构图确认形式层级数。通过决策追溯（decision tracing）
      确认每级是否实际行使决策约束：选取一个底层操作决策，
      追溯哪些层级的哪些人对其施加了实质性修改。
    limitations: |
      矩阵组织、项目制组织等非树状结构中，层级计数需要约定。
      同层级但不同职能的决策约束强度不同。

  formal_information_system:
    definition: |
      外在于人脑的、用于存储/传输/处理组织状态信息的系统。
    measurement: |
      包含（至少其一）：书面文档、标准化表格、统计汇总报告、
      数据库、实时仪表盘、KPI 体系。
      不包含：纯口头汇报、非正式交谈、个人记忆。
    limitations: |
      边界案例（如 PPT 演示——半口头半书面）需要具体判定。
      关键区分标准：信息是否独立于特定人的记忆而存在。

# === 推导链 ===

derivation: |
  from_l1:
    axioms: [AXIOM-002]
    theorems: [THEOREM-hierarchy-depth-limit]
  from_l2:
    bridging: [BR-L2-001, BR-L2-004]

  steps:
    1. "层级必然出现——且由人类认知约束定义其阈值"
      BR-L2-004: 人类群体超过 ~150 人时必然出现层级。
      BR-L2-001: 人类认知是有限的——注意力、工作记忆、信息处理能力
      都受生物约束。
      这两个经验命题共同给出：层级是人类社会的结构必然，
      但层级中的每个节点（人）的处理能力是受限的。

    2. "层级深度受信息衰减约束 (THEOREM-hierarchy-depth-limit)"
      层级制造信息梯度——信息上行汇总、下行分解每次经历编码/解码。
      设每级保真率 r < 1（AXIOM-002 保证 r 不可能 = 1）。
      n 级层级中，上下行往返保真度 ≈ r^(2n)。
      当 r^(2n) 降到临界值以下，顶层信息与底层现实脱耦。

    3. "r 的经验锚定——为什么不是任意值"
      r 不是任意参数。口头信息传递的实验证据给出了数量级约束：
      - Bartlett (1932) 的序列再现：6-8 次传递后保留 30-40% → r ≈ 0.75-0.85
      - Allport & Postman (1947) 的谣言传递：5-6 次传递保留 30-50% → r ≈ 0.7-0.85
      - Mesoudi & Whiten (2008) 综述：口头序列传递中 r 通常 < 0.9
      综合估计：在无形式化系统辅助的口头传递中，r ≈ 0.7-0.85。

      这个范围不是精确测量——它是多个独立实验的数量级收敛。
      如果 r < 0.9（实验一致支持），则深度天花板必然在有限层级内出现。

    4. "估算深度天花板（数量级预测）"
      - r = 0.75（保守估计）: r^(2×5) = 0.75^10 ≈ 5.6%，r^(2×6) = 0.75^12 ≈ 3.2%
      - r = 0.85（乐观估计）: r^(2×6) = 0.85^12 ≈ 14.2%，r^(2×7) = 0.85^14 ≈ 10.3%
      - r = 0.85, n=8: r^(2×8) = 0.85^16 ≈ 7.4%

      取 r = 0.75-0.85 区间，往返保真度在 n=5-7 时降到 5-15%。
      这是数量级预测——不是精确数字。预测是：深度天花板在单一位数，
      不是 3 级（太保守）也不是 15 级（不可能）。

    5. "适应性响应——不是什么都算适应"
      组织触及天花板后有几种可能，但并非所有都算"适应"：

      (a) 联邦化：形式层级保持，但超出天花板的层级不再行使实质性决策约束——
          实质决策权下放给子单元。可检验标志：组织架构图中存在层级 X，
          但对 X 以下的事务，X 的平均决策否决率 < 10%。
          排除项：如果层级 X 仍然频繁行使否决权（> 30%），不算联邦化——
          推论的联邦化预测在该案例不成立。

      (b) 官僚化：引入形式化信息系统补偿人脑传递极限。
          可检验标志：组织运作依赖于书面记录或数字系统——
          如果移除这些系统，组织将在 < 1 个月内出现显著协调失灵。
          排除项：仅有书面记录但从不用于决策（"装订好放柜子里"）不算官僚化适应。

      (c) 解体：组织无法适应，收缩或分裂。
          可检验标志：组织的形式层级数在触及天花板后 10 年内减少。

      (d) 被排除的结果——如果存在则推论被证伪：
          一个 ≥ 8 级层级链的组织，无形式化信息系统的辅助，
          顶层对底层事务的决策在 > 50% 案例中准确反映底层现实。
          操作化：对 20 个随机选取的底层事务，独立评估者判断
          顶层决策是否与底层实际情况一致。

# === 可证伪性 ===

falsifiability: |
  本推论可被以下发现证伪：

  (a) 发现层级 ≥ 8 级、无形式化信息系统辅助、顶层决策准确率 > 50%
      的组织。操作化定义见 excluded_outcomes (d)。

  (b) 发现在口头信息传递条件下的序列传递实验中，
      单级保真率 r 的系统性测量值 > 0.95。
      这会使深度天花板移至 > 15 级，推论的"5-7 级"数量级预测失效。

  (c) 发现一个组织其层级 ≥ 10 级，即使在使用形式化信息系统时，
      顶层决策准确率 < 30%——但该组织持续稳定运作 > 30 年
      而没有经历联邦化或解体。这将证伪"适应性响应"的预测。

falsification_trace:
  primary_suspect: "r 的经验估计值——如果口头传递的保真率显著高于现有实验文献的测量值（r > 0.95），数值预测需要从 ~5-7 级上修。但存在天花板这一核心逻辑（THEOREM-hierarchy-depth-limit）不受影响。"
  secondary_suspect: "形式化信息系统补偿假设——如果存在其他机制（如强文化同质性、极端精英选拔）可以在无书面记录的情况下维持高效率信息传递，则'官僚化是必要的适应路径'需要修正。"
  unlikely_suspect: "层级必然出现的前提（BR-L2-004）——如果群体 > 150 人不必然出现层级，推论的前提之一不成立。BR-L2-004 的 IEA=1.9。"

# === 排除的结果 ===

excluded_outcomes:
  - outcome: "10+ 级纯口头层级链有效运作"
    description: |
      一个组织拥有 ≥ 10 级决策层级，各级之间的信息传递仅依赖
      口头/人际方式（无文档、无数据库、无标准化报告），
      且顶层做出的关于底层事务的决策与底层实际情况的一致性 > 50%。
    testability: |
      如果能找到一个满足所有条件的组织，推论直接被证伪。
      检验负担：需要在一级一级追溯信息传递链，在每级测量信息保真率。
      实际上，如果这样的组织广泛存在，它们不会隐藏——
      任何超过 10 级的军队/政府/企业都是潜在的检验案例。

  - outcome: "形式化信息系统完全无效"
    description: |
      引入形式化信息系统（书面记录、标准化报告、数据库）后，
      保真率 r 没有任何可测量的提升。
    testability: |
      对比同一组织在引入形式化系统前后的信息保真率。
      如果 Δr ≈ 0，推论关于"官僚化提高有效 r"的主张被削弱。

# === 现实锚点 ===

real_world_anchors:
  supporting:
    - anchor: "军事指挥链的深度稳定在 5-7 级"
      evidence: |
        现代军队的作战指挥层级：班→排→连→营→团/旅→师→军 = 7 级。
        从军到战区/方面军/最高统帅部会超过 7 级——但这些额外层级
        依赖高度形式化的参谋系统（G1-G5 参谋制、标准化作战命令格式）。
        在没有现代参谋制度的历史案例中——如拿破仑入侵俄国（1812）——
        超过 7 级的指挥链反复出现信息失灵（命令延迟、情报失真、
        部队实际位置与统帅部认知严重脱节）。
      confidence: strong

    - anchor: "企业扁平化浪潮的深度证据"
      evidence: |
        1990 年代之前，大型企业（如 GM、IBM）通常有 8-12 个管理层级。
        1990-2010 年的扁平化浪潮将典型层级压缩到 5-7 级。
        仍然超过 7 级的大型组织（如某些政府机构）可以通过两种方式解释：
        (1) 形式层级存在但实质权力已下放（联邦化）——
            中层单位获得预算权和人事权，顶层只做战略方向
        (2) 引入了高度发达的信息系统（ERP、BI 仪表盘、KPI 体系）
        验证：如果一个组织声称有 8+ 级但保持了有效的中央协调，
        预测其必然大量依赖 (1) 或 (2) 或两者。
      confidence: moderate

    - anchor: "罗马帝国行省制度——联邦化适应"
      evidence: |
        罗马在巅峰期将领土组织为行省，总督拥有实质性的军事和财政
        自主权。从罗马元老院到行省基层的有效决策链远超 7 级，
        但中央不试图对行省基层做精细决策——总督实质上是半自治的。
        这就是联邦化适应：形式层级维持（总督向元老院/皇帝汇报），
        但实质决策约束在天花板以下断开。
      confidence: moderate

    - anchor: "天主教会——官僚化适应的原型"
      evidence: |
        天主教会维持了超过 7 级的层级链（信徒→神父→主教→大主教→
        枢机→教宗+中间层），持续 ~2000 年。其关键适应：
        - 教会法（书面法律体系）标准化了决策
        - Ad limina 述职制度强制定期信息上报
        - 教义问答标准化（catechism）降低了信息传递歧义
        这些是形式化信息系统的原型——验证而非证伪本推论。
      confidence: strong

  counterexamples:
    - case: "明清中国官僚体系的九品官制"
      analysis: |
        明清的九品官制 + 吏员 + 六部→省→府→州县，看似超过 7 级。
        但这不是反例：
        (1) 体系高度依赖形式化信息系统——题本/奏本制度、六部文档、
            赋税黄册。这是官僚化适应的典型案例。
        (2) 中央对县级事务不做精细决策——朝廷维持税收/治安/科举
            的宏观框架，县官在框架内拥有实质性自主权。
            这是联邦化+官僚化的混合适应。
        (3) 晚期（如清朝中后期）信息传递效率显著下降——
            地方实情与中央认知的脱节是常见主题。
        结论：验证推论。"看起来层级深但实质上权力已下放"正好是
        推论预测的联邦化模式。
      status: not_a_counterexample

    - case: "沃尔玛等现代跨国零售企业"
      analysis: |
        沃尔玛的门店→区域→国家→全球的链条可达 8-10 级。
        但沃尔玛依赖 Retail Link 实时销售数据系统——
        信息传递不依赖人脑逐级汇报，而是直接从 POS 终端
        进入全球数据库。这是形式化信息处理的现代形态。
        结论：不是反例——是官僚化适应的高级版本。
      status: not_a_counterexample

  boundary_cases:
    - case: "苏联计划经济体系"
      analysis: |
        苏联的 Gosplan 体系在形式上拥有极深的层级——从联盟计委
        到各共和国→州→市→企业。理论上远超 7 级。
        但其运作中，计划指标在传递中的失真（企业虚报产能、
        计委使用上一年的数字乘以系数）是众所周知的系统性失灵。
        这个案例既不完全支持也不完全证伪推论：
        - 支持：信息失真确实随层级深度增加而加剧
        - 挑战：尽管存在失真，体系仍运作了 ~70 年
        解释：苏联体系通过"宽松计划"（soft planning）在事实上
        接受了信息失真——顶层不期望计划完全准确，而是将其
        作为谈判起点。这可以理解为一种隐性的联邦化适应。
      status: boundary_case

# === 对抗式审查摘要 ===

adversarial_review:
  reviewer: "独立审查者"
  date: 2026-07-13
  verdict: needs_revision
  revision_summary: |
    第一次审查（ADV-REVIEW-001）提出四条挑战：
    C1 (critical): r 值缺乏经验测量 → 已修正：引用了 Bartlett, Allport & Postman,
      Mesoudi & Whiten 的实验证据
    C2 (high): 三种适应覆盖全部可能 → 已修正：增加了排除项 (d) 和每种适应
      的独立可检验条件
    C3 (medium): r 不是常数 → 已修正：限定了 r 的适用条件（非例行综合信息）
    C4 (medium): 锚点确认偏差 → 已修正：补充了反例分析和边界案例讨论
  post_revision_verdict: |
    第二轮审查 (ADV-REVIEW-004, 2026-07-13): verified。
    四条挑战全部处理。新发现的三条局限（证伪条件实践可达性、
    实验室-组织迁移差距、r 不对称性）已标注。三条新挑战不构成
    推翻威胁。悬挂标记：证伪条件的实践可达性有待历史/考古学检验。

# === 区分效度 (criterion 4 了结, META-REVIEW-001, 2026-07-13) ===

discriminant_validity:
  status: discharged
  人话摘要: "老实说:这条推论的'5-7 层'和教科书早就知道的一样,没预测出新东西。但它的贡献不是'发现新事',而是'用更基本的原理(信息传一层丢一点)把这条老规律重新解释清楚了'——就像用牛顿引力解释行星运动,没发现新行星,但把零散规律归并到了更深的原因。这在科学里算数,只是不能吹成'新发现'。"
  question: "本推论的预测是否区别于已有标准理论？(L3 质量标准第 4 条:区分效度)"
  honest_answer: >
    数字层面【不区别】:5-7 级天花板与 Graicunas 控制幅度、Miller 7±2、韦伯官僚制的
    经验结论一致。DED-001 未做出任何标准组织理论没做过的【新预测】。
  contribution_type: explanatory_unification
  what_it_actually_does: >
    贡献是【解释性统一(consilience)】、不是新发现:把"5-7 级"这一 Graicunas/Miller
    只【描述】、不从第一性原理【导出】的经验规律，约化到信息保真衰减 r^(2n)
    (AXIOM-002/PHY-001)。这与"从统计力学导出理想气体定律""从牛顿引力导出开普勒定律"
    同型——没预测新东西，却把散落经验规律约化到更基本原理，是科学中最受推崇的一类
    非平凡演绎。
  nontriviality_verdict: >
    以"结论是否平凡地内含于前提(L0×L1)"为准，DED-001 非平凡(结论不显然内含);
    以"是否区别于其他理论"为准，DED-001 不区别，但【这不是缺陷】——统一型项目的正确
    产出就是复现已知结果，那是效度检验、不是新颖性缺失。故成功标准第 3 条(非平凡推论)
    【算兑现】，但定位须诚实钉为"解释性统一，非新经验预测"。
  caveat: "本条不得在任何地方暗示发现式新颖。real_world_anchors 是 confirming anchors，非首创声明。"

# === 经验检验与交叉验证 ===

empirical_verification:
  empirical_test: EMP-TEST-001
  cross_verification: ICV-001
  status_history: "verified (Rule B 两轮) → EMP-TEST-001 无反例 → ICV-001 发现疑似反例(降 verified*) → 布干达深查裁定 6 级(疑似反例不成立) → 回 verified"
  verified_star_reason: |
    降 verified* 的触发源是 ICV-001（独立多模型交叉验证）。
    布干达王国是 DED-001 的承重检验案例（纯口头社会，无形式化信息系统）。
    作者在 EMP-TEST-001 中将其有效层级编码为 7（把 Bataka 氏族链算平行
    系统排除），恰在 5-7 天花板内，判为边界案例。但 ICV-001 中两个与
    主循环【不同血统】的独立模型（商汤、智谱）拿到同一角色表，都独立
    编码为 8——落入证伪区（≥8 级纯口头），使布干达成为【疑似反例】。
    依 Rule C「发现疑似反例」，DED-001 一度降 verified*，启动深度调查。
  resolution: |
    布干达行政史深度调查（Reid 2002、Southwold 1961、Twaddle 1969、
    Low & Pratt 1960 等一手史学）裁定：前殖民布干达有效层级 = 6
    （区间 5-7，置信度：对"≤7、非8"为高）。8 级不成立，原因：
    (1) bataka 氏族链与 bakungu/batongole 领土链是【平行两套】，真正治理
        走领土链、王权靠取代氏族权扩张——两模型编 8 几乎肯定是把平行氏族链
        叠加到领土链（违反平行不叠加规则）；
    (2) 整齐嵌套的 gombolola/miruka 两层主要是【1900 年协定标准化的产物】，
        前殖民县以下只有 1（至多2）层——两模型编 8 的另一来源是把殖民结构
        倒投影回前殖民（时间错置）。
    结论：疑似反例【不成立】，布干达 6（或至多7）级仍在 5-7 天花板内。
    推论存活——且这是证据本身（殖民才层级化 + 氏族链平行 + batongole 辐射式
    压平）自然得出，不是为保护推论而压低层数。
    附带修正：作者原编码 7 略偏高，中心估计应为 6（EMP-TEST-001 已回写）。
  meta_lesson: |
    关键反转：真相(6) < 作者(7) < 两模型(8)。作者反而比两个"独立"模型
    更接近真相。这否证了 ICV-001 当时的解读(b)"作者是偏低的异类"，转而
    支持解读(a)"两模型彼此相关、共享系统性上偏"（被'非洲王国=六层金字塔'
    的教科书图式带偏）。教训：ICV 的信号只能举旗触发调查，不能自行裁决；
    "和作者不一样" ≠ "更正确"；一组相关的更笨模型可以一起自信地错。
  residual_uncertainty: |
    布干达裁决依赖单次（同血统）研究通道，部分县以下细节引自二手综述。
    6 vs 7 之间仍有摆动（取决于 Katikkiro 是否算独立一级、县以下 1 层还是
    2 层），但两者都在天花板内，不影响推论。真正的 8 无诚实支撑。

