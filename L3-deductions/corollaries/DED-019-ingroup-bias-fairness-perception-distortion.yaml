id: DED-019
type: deduction
layer: L3-deductions
status: verified
term: "内群体扭曲公平感知推论 (Ingroup Bias — Fairness Perception Distortion)"

人话摘要: "同一个规矩,判给'自己人'就觉得公道,判给'外人'就觉得不公——不是装傻,是人真心觉得自己没偏。公平感不是对规矩本身的客观判断,是谁受益、规矩就长什么样。"

statement: |
  【核心】同一个分配程序/规则的公平性判断,系统性被受益者的群体身份扭曲——程序判给"自己人"=公平,判给"外人"=不公平,即使程序结构一模一样。公平知觉不是对"程序本身"的判断,是对"{程序+谁受益}"的判断——在低透明/无问责压力的默认条件下,程序公平判断与群体偏私在认知层面高度缠结(不可分离);结构因素(特定类型透明/问责)可能在部分条件下缓解此缠结。若预测(ii)被证伪(透明系统性缩小公平评分差距),则"不可分离"从认知铁律降级为默认强倾向——换言之,程序正义文献假设的"程序公平可独立于结果受益方被感知"在默认条件下被本推论挑战,但在高透明/问责条件下可能部分恢复。

  【驱动量】裁决受益方的群体身份(可事前测:受益方是裁决者的内群体还是外群体,独立于公平评分测量)。驱动的是{谁受益}对{程序是否公平}的认知污染——不是裁决者故意偏私,而是其公平感知本身已被群体身份着色,真诚地认为偏私行为是公平的。

  【预测】
  (i) 保持程序结构不变,仅改变受益方群体身份(自己人/外人),公平评分系统性偏移——同一程序被同一人评为"不公平"当受益人是外群体、且被同一人评为"公平"当受益人是自己人。
  (ii) 程序透明度的提高不缩小内群体-外群体的公平评分差距——无交互效应或交互效应为正(透明反扩大差距,因"程序透明"被用作"我很公平"的自我说服,偏私从程序操作层转移到"谁定义的规则对谁有利"的元层)。
  (iii) 逐格判空:"有内群体偏好 + 程序客观上完全中立 + 裁决者对内外群体的公平评分无差异"这一格预测为空。即只要内群体偏好激活且程序结构客观中立,公平评分必随受益方群体身份而偏移——不存在"偏好自己人但真诚承认程序对内外一样公平"这一心理状态。

  【判别·防平凡化】
  与BR-L2-006(内群体偏好存在)判别:BR-L2-006说"人偏袒自己人"(行为层+认知层"多给是应该的"),本条说"偏袒后,人真诚地认为偏袒行为是公平的"(认知层——预测的是"自我公平错觉"而不仅是"分东西多给")。前者被预测量=分配行为的偏差,后者被预测量=对程序公平性的真诚判断。两个不同的被预测量。
  与DED-008(裙带-监督者独立)判别:DED-008讲监督者的结构性利益冲突(裁判与受益方共享亲缘收益),本条讲认知性公平知觉扭曲(裁判真诚以为自己公平)——前者是"制度设计上没拦住偏私",后者是"拦住后人的脑子仍会自我欺骗"。不同层:结构性 vs 认知性。
  primary_suspect:预测(ii)"透明不缩小差距"可能过强——已有研究发现问责/透明有时减少内群体偏私(虽然未必消除),需仔细校准射程:什么类型的透明(程序操作透明 vs 元规则透明)、对谁的透明(对裁决者 vs 对外部观察者)。若实证显示程序操作透明(或问责)系统性缩小了公平评分差距,则(ii)被证伪——此时核心声称"不可分离"从认知铁律降级为低透明默认态,影响半径超出(ii)本身:(i)作为基本效应在低透明条件下仍成立;(iii)在低透明条件下仍被预测为空格;但在高透明/问责条件下,(iii)可能被填满——即"有偏好+程序中立+高透明/问责→评分无差异"成为可能态。之前的免责("不伤(i)(iii)")过于扫荡:此处诚实承认(ii)被证伪会改变(iii)的射程边界(从全谱无条件→限低透明条件),保护(i)不受伤是诚实的(基本效应不依赖透明度),但保护(iii)不受伤需加"在低透明条件下"限定。

operationalization:
  受益方群体身份:
    definition: "裁决者是否将程序受益方视为'自己人'(内群体)——基于可事前编码的群体标识(最小群体标签/血缘/族群/组织归属),而非基于裁决内容或评分结果。"
    measurement: "通过最小群体范式(Tajfel)随机分配群体标签,或使用现实群体身份(党派/国籍/部门)的事前问卷测量。关键是群体身份须在公平评分之前、由独立指标确定,不得由'评分高低'反推'必是内群体'。"
    limitations: "现实群体身份含多重交叉(一个人同时属于多个群体),需明确哪一层群体身份在裁决情境中被激活。最小群体范式干净但生态效度有限。"
    disentangle_self_interest: |
      【剥离个人利害与群体身份】在现实锚(如政治选举)中,胜败同时改变"群体身份"(我群vs他群)和"个人利害"(我赢vs我输)——二者天然混杂。若公平评分偏移完全由"结果对自己是否有利"解释、群体身份无独立贡献,则驱动量归因被证伪(per falsifiability(c))。剥离二者的实验设计方案:
      (a)最小群体范式纯身份条件——随机分配群体标签但不附加个人利害差异,测量纯群体身份效应;
      (b)第三方观察者条件——被试作为不直接受益/受损的群体成员评价程序("我所属的群体赢了但与我的个人利益无关"vs"我所属的群体赢且我个人受益"),比较两个条件下的公平评分偏移量,将"群体身份效应"与"个人利害效应"分离估计;
      (c)在选举锚的二手数据分析中,可控制"个人从选举结果中的预期收益/损失"(如政策偏好、税收影响)后检验群体身份(政党认同)的残差效应——若控制个人利害后群体身份效应消失,则驱动量归因被削弱。

  程序公平评分:
    definition: "裁决者对同一套分配程序(规则/步骤/透明度)的公平性主观判断——'这套规矩公道吗?'——以独立于分配结果的方式测量。"
    measurement: "Likert量表/公平知觉问卷,在呈现程序描述(不含分配结果)后测量;或呈现完整程序+结果后要求被试分别评价程序公平度和结果公平度。关键:评分对象是【程序】,不是【结果】也不是【裁决者人品】。"
    limitations: "程序公平评分和结果公平评分在实际测量中可能不完全解耦(被试可能从结果反推程序);需以'先呈现程序→评分→再呈现结果'的顺序缓解,或使用'程序评价先于结果知晓'的组间设计。"

  程序透明度:
    definition: "程序规则/决策依据/操作步骤对外部观察者或参与者的公开可察程度——可事前操纵或测量。"
    measurement: "操纵:高透明=全部规则和决策理由公开,低透明=规则不完全公开或决策理由不披露。测量:用透明度感知量表作为操纵检验。须独立于公平评分和群体身份测量。"
    limitations: "'透明度'是多维的(规则透明/过程透明/理由透明),不同维度对自我说服的支撑力不同;本推论主要关注'规则透明'(被用作'我很公平'的自我说服材料)。"

derivation:
  from_l1:
    axioms: [AXIOM-001]
    theorems: []
  from_l2:
    bridging: [BR-L2-006, BR-L2-013, BR-L2-015]
  steps: |
    1. "BR-L2-006给'自己人'在任何分配中获系统性优待——不仅是行为上的(多给),也是认知上的('多给是应该的')"
       BR-L2-006的核心:内群体偏好同时包含行为成分(分配偏斜)和认知成分(内群体成员"值得"更多)。
       但BR-L2-006不区分"觉得他值得更多"(结果层认知)vs"觉得让他多得的那个规矩是公道的"(程序层认知)。
       本条的非平凡第一步:把BR-L2-006的认知成分从结果层推到程序层——不仅"自己人该多得",而且"让自己人多得的那个程序是公平的"。

    2. "BR-L2-013给:人对不公敏感——但当受益者是内群体时,同样的分配差距被编码为'合理差异'而非'不公'"
       BR-L2-013本身给出的是"不平等→不公感知"的自动反应。但关键调节变量是受益者的群体身份:
       同一套分配差距(如甲得70乙得30),当甲是"自己人"→编码为"甲贡献大/甲更需要/程序合理"因而"差距合理";
       当甲是"外人"→编码为"凭什么甲多拿"因而"不公"。
       BR-L2-013本身不内置这个调节——其标准范式(最后通牒/独裁者)中受益方身份通常不是变量。
       【诚实】此步中BR-L2-013偏"近定义":它定义了"不公感知"是什么——真正的非平凡推力来自BR-L2-006对这个感知的【群体着色】。

    3. "CONCEPT-fairness(b)比较性给:公平判断是比较性的——但参考群体(跟谁比)本身受内群体边界影响"
       CONCEPT-fairness(b):公平总是关于"这个Agent相对于那个Agent如何被对待"。
       但"那个Agent"(参考群体)的选择不是中立的——当受益人是自己人时,参考群体选"外人"(自己人比外人多=合理);
       当受益人是外人时,参考群体选"自己人"(外人比自己人多=不公)或选"另一个被亏待的外人"(同为外人则差距不触发不公)。
       参考群体的内生选择使BR-L2-013的不公感知在群体边界两侧不对称触发。
       同一种分配差距,只要切换参考群体就切换了"公/不公"的判断——而参考群体恰由BR-L2-006的内群体边界决定。
       【诚实】CONCEPT-fairness(b)在此偏近定义——"公平是比较性的"是概念界定,不是经验推力。

    4. "BR-L2-015给:程序公平可缓冲结果不公——但'程序是否公平'的感知本身已被群体身份污染,故程序公平的缓冲效应在跨群体争议中有天花板"
       BR-L2-015的核心:人觉得程序公平时更能接受不利结果。
       但本条的翻转:当受益方是外人时,【同一个程序】被感知为"程序本身不公平"——程序公平的缓冲效应在起效之前已被短路:
       因为人【不觉得】程序是公平的(尽管程序结构客观上与外群体受益时的程序一模一样)。
       故BR-L2-015的"程序公平→结果接受"这一因果链,在跨群体场景中被"群体身份→程序公平感知"这一上游污染截断。
       【非平凡性】BR-L2-015本身不讨论"程序公平感知本身被群体身份扭曲"——这是本条独有贡献。

    5. "合成:公平感知={程序结构+受益方群体身份},二者不可分离;透明度反而加深自我欺骗"
       前四步建立:(a)内群体偏好把"自己人多得"编码为"应该"(BR-L2-006认知成分);
       (b)不公感知的触发受参考群体选择调节,而参考群体由内群体边界内生决定(BR-L2-013 + CONCEPT-fairness(b));
       (c)程序公平感知本身被群体身份污染→程序公平的缓冲效应在跨群体争议中短路(BR-L2-015翻转)。
       三者合成:公平知觉不是对"程序本身"的判断,是对"{程序+谁受益}"的判断。
       透明度上升(BR-L2-015的"程序透明→感知公平"链路)在此被反向利用:
       "程序是透明的"被用作认知失调的缓解——"我看了规矩,规矩是透明的,所以我判给他们的结果是公平的"——从而偏私从程序操作层退到元层("谁定义的规则对谁有利")。
       【非平凡性(逐格判空)】核心空格="有内群体偏好+程序客观上完全中立+裁决者对内外群体的公平评分无差异"。
       BR-L2-006单独只给"偏袒自己人"(行为层),不给"对程序的公平评分必随受益方身份偏移"(认知程序层);
       BR-L2-013单独只给"不平等→不公"(不给参考群体的内生选择);
       BR-L2-015单独只给"程序公平缓冲结果不公"(不给"程序公平感知本身被污染"的翻转);
       CONCEPT-fairness(b)偏近定义。四者【都不】给出该空格。唯合成给出。

falsifiability: |
  本推论可被以下发现证伪:
  (a) 找到一个群体:内群体偏好经独立测量确认存在(如Tajfel范式中的分配偏斜),面对一套经独立编码确认为客观中立的分配程序,且受益方群体身份被随机分配(内/外),但裁决者对程序的公平评分在内外群体间无统计显著差异。⇒ 证伪核心——命中空格(iii)。
  (b) 程序透明度提高后,内群体-外群体的公平评分差距【显著缩小】(负交互——透明度越高、差距越小)。⇒ 证伪预测(ii)的强形式(透明不缩小或扩大差距)。注意:透明度缩小差距但不消除,只是部分削弱,诚实记录为部分伤。
  (c) 发现"程序公平感知"与"受益方群体身份"的相关可完全被"裁决者对受益方的个人好感度"解释,且控制好感度后群体身份效应消失。⇒ 证伪驱动量归因——若偏见纯粹是人际好感而非群体身份,则"内群体"这一结构概念多余,可被更简的心理变量(好感)吸收。

falsification_trace:
  primary_suspect: |
    预测(ii)"透明度不缩小(甚至扩大)公平评分差距"是最弱的腿。已有文献发现问责/透明在某些条件下确实减少了内群体偏私行为——虽然这些研究通常测的是行为(分多少)而非程序公平感,但方向性压力在。若透明度的缩小效应在公平感知上也成立,则(ii)被部分证伪——但不伤(i)和(iii),因(i)测试的是"程序不变仅换受益方→公平评分偏移"的基本效应,(iii)测试的是"偏好+中立程序+评分无差异"这一格的空性——二者都不依赖透明度调节。
  secondary_suspect: |
    "自我公平错觉"的机制——即裁决者是否【真诚地】认为偏私行为是公平的,而非仅仅是【对外宣称】公平以维护自我形象。区分"真实信念"和"印象管理"在测量上困难(自陈量表可能混入社会期望偏差)。若实证发现公平评分偏移完全被印象管理动机解释(如匿名评分下偏移消失),则"真诚错觉"机制被削弱——变为"伪善"而非"自我欺骗",认知深度降级。
  unlikely_suspect: |
    BR-L2-006(内群体偏好)和BR-L2-013(不公厌恶)本身——二者均为跨文化跨物种稳健复现的发现,极少是根源。CONCEPT-fairness(b)是概念界定而非经验命题,不在此列。
  empty_cell_testing_subtlety: |
    【空格(iii)实战测试的实操subtlety:偏好激活衰减→false positive填空格】空格(iii)的证伪测试需要三个独立测量——内群体偏好(行为层,Tajfel分配)/程序中立性(独立编码)/程序公平评分(自陈量表)——在同一被试群体中同时满足。实操中的关键陷阱:内群体偏好的行为测量(如Tajfel分配任务)与程序公平评分的测量之间存在时间间隔和任务切换,偏好的激活态可能在公平评分时已衰减。若偏好"存在但未激活",则可能在公平评分时测得内外群体无差异——此为false positive填空格,非真证伪。缓解措施:(a)偏好测量与公平评分应在同一实验session内、相近时间点完成,最小化任务切换导致的激活衰减;(b)在公平评分任务前嵌入群体身份凸显操纵(group identity salience check/prime),确保偏好处于激活态;(c)操纵检验:在公平评分后追加群体认同度测量,验证内外群体区分在评分时仍显著——若操纵检验失败(群体认同已消退),则"评分无差异"不能作为空格被填满的证据。

excluded_outcomes:
  - outcome: "程序结构【客观上】对内外群体不同(如明文规定不同规则)"
    description: "若程序本身在规则层面就区分内外群体,则公平评分的差异可直接由程序差异解释,不提供对本推论的检验。本推论只适用于程序结构客观上相同、仅受益方身份不同的情况。程序是否结构相同须由独立编码判定,不得由公平评分反推。"
  - outcome: "裁决者【明知且承认】自己偏私,不声称程序公平"
    description: "本推论预测的是'真诚的自我公平错觉',不是'明知故犯地偏私并公开承认'。若裁决者公开承认偏私且不声称公平,则在预测之外——这不提供对本推论的检验(既不支持也不证伪)。"

anti_talisman_clause: |
  【防不可证伪护身符】判定"程序结构是否客观上相同"时,须由独立于公平评分的结构编码(规则文本/操作步骤/随机化设计)完成,不得因"评分有差异"就反推"程序必有隐藏差异"。判定"受益方是否为内群体"时,须由独立于公平评分的群体身份测量(Tajfel标签/事前问卷/成员名册)完成,不得因"评分高"就反推"受益方必为内群体"。尤其不得遇到空格(iii)的反例(偏好+中立程序+评分无差异)时,就事后硬塞一个"其实程序不中立"或"其实没有内群体偏好"来消化——偏好存在和程序中立须由独立指标坐实后才纳入检验。

nontriviality_test: |
  逐格判空(自变量=受益人群体身份[内/外] × 程序透明度[高/低];被预测量=程序公平评分[高/低]):
    - 内群体受益人 + 低透明度 → 公平评分高 ⇒ 非空(BR-L2-006可独立预测此格,偏平凡——这不是本条独特贡献)。
    - 外群体受益人 + 低透明度 → 公平评分低 ⇒ 非空(多现实案例:同一选举程序,自己人赢=fair,外人赢=rigged)。
    - 内群体受益人 + 高透明度 → 公平评分高 ⇒ 非空(透明度被用作自我说服材料)。
    - 外群体受益人 + 高透明度 → 公平评分低 ⇒ 非空(透明不缩小差距——若此格评分接近内群体+高透明,则预测(ii)被证伪)。
    核心空格不在上述四格中——而在:"内群体偏好经独立测确认存在 + 程序经独立编码确认为客观中立 + 裁决者对内外群体的【程序公平评分无差异】"这一格。
    该空格是真经验主张:BR-L2-006只给"人偏袒自己人"(行为层,被预测量=分配量的偏斜),不给"对程序的公平评分必随受益方身份偏移"(认知程序层,被预测量=对程序公道与否的判断)。BR-L2-013只给"不平等→不公"(不给参考群体内生选择)。BR-L2-015只给"程序公平缓冲结果不公"(不给"程序公平感知本身被污染"的翻转)。CONCEPT-fairness(b)偏近定义。四者【都不】给出该空格。空格可被现实反例填上 → 非空可满足、非同义反复。

real_world_anchors:
  supporting:
    - anchor: "最小群体范式中的程序公平评分(Tajfel范式延伸)"
      evidence: |
        标准Tajfel范式中,被试按随机颜色标签分为两组后对内外群体成员分配点数——已知出现分配偏斜(BR-L2-006锚定)。若在分配前先让被试评价一套"分配规则"的公平性——当被试被告知自己的组将受益时评分高、被告知对方组将受益时评分低,即使规则文本完全一致——则直接支持预测(i)。
      independent_test: |
        群体身份由随机标签独立分配;程序文本由实验者独立编写并保持恒定;公平评分为独立量表。三个量不同源。
      confidence: "moderate(该精确范式需专门实验设计,现有Tajfel文献通常测分配行为不测程序公平评分;但范式延伸直接、低风险)"

    - anchor: "政治选举中'败者同意'的非对称性"
      evidence: |
        同一套选举程序,胜选一方认为"选举公正"的比例系统性高于败选一方——被"败者同意"文献广泛记录(Anderson et al. 2005)。若将政党/候选人支持者视为准群体:当"自己人"赢时程序被感知为更公正,当"外人"赢时同一程序被感知为更不公——方向与本推论一致。
      independent_test: |
        选举程序(规则/投票/计票)为制度常量;胜败由选票独立决定;公平感知由独立问卷测。
      honest_note: "胜败=结果有利度,不只群体身份——但政党认同内群体化后的模式与预测(i)方向一致。此为方向性中等支持,非严格检验。"
      confidence: "moderate"

    - anchor: "组织内部资源分配的'程序公平幻觉'"
      evidence: |
        同一套绩效评估/晋升程序,当晋升受益人是评估者的"自己人"(同部门/同派系/同导师)时,评估者真诚认为程序公正;当受益人是"外人"时,同一评估者更可能质疑程序漏洞。组织行为学文献中有间接证据——程序公平评分与关系质量正相关,但因果关系方向常被混淆。
      independent_test: |
        程序为组织成文规则(常量);关系(自己人/外人)由独立于晋升结果的社交网络分析事前测;公平感知由独立问卷测。
      honest_note: "组织场景中多因交织,因果关系难剥离;只作方向性支持。"
      confidence: "weak-moderate"

  empirical_basis_honest_note: |
    【实证基础诚实标注】上述三个supporting anchor均非对核心预测——尤其是逐格判空(iii)——的直接检验:
    - Anchor 1(Tajfel范式延伸测程序公平评分)是假想实验延伸:标准Tajfel文献测分配行为(BR-L2-006锚定),不测程序公平评分。该精确范式需专门实验设计,尚未被实施。
    - Anchor 2(选举"败者同意"非对称性)混淆结果有利度与群体身份:胜败同时改变"我群vs他群"和"我赢vs我输",非对群体身份效应的干净检验。
    - Anchor 3(组织程序公平幻觉)自标confidence=weak-moderate,因果关系方向常被混淆,多因交织。
    累积实证对核心空格(iii)的直接支持近乎为零。推论在当前阶段实质是"从bridging砖演绎出的预注册假设(pre-registered hypothesis)"而非"经验锚定的已验证命题"。这不等于推论不成立——从砖逻辑推导是合法的知识生产方式——但读者应知悉:三个anchor提供的是plausibility(合理性质疑通过)而非confirmation(经验确证)。核心空格(iii)的实证状态:待检验。

  counterexamples:
    - case: "问责/透明研究显示减少内群体偏私行为"
      analysis: |
        部分实验发现:当裁决者知道分配决定将被公开审查(透明/问责),内群体偏私【行为】减少。这是对预测(ii)的最直接压力。但须区分:(a)这些研究通常测【分配行为(分多少)】非【程序公平感知】;(b)"减少"不一定是"消除"——透明可能减少行为偏斜但不消除公平感知偏斜;(c)透明类型需细分——对内部人的"程序操作透明"可能反被利用为自我说服材料,对外部人的"结果透明"可能起问责作用。
        若实证确认:程序操作透明【同时】减少分配行为偏斜【且】缩小程序公平评分差距 → 则预测(ii)的强形式被证伪。但预测(i)和(iii)不受此伤。
      status: "partial_pressure(对(ii)有压力,但对整体推论非净杀)"

  boundary_cases:
    - case: "极强外群体敌意(战争/种族灭绝场景)"
      analysis: |
        当外群体被彻底去人性化时,裁决者可能【不声称】程序公平——"对他们不需要公平"——此时公平评分偏移可能存在但裁决者不关心公平问题本身。本推论的前提是裁决者【在意公平】(由BR-L2-013不公厌恶+BR-L2-015程序公平关切约束),极强外群体敌意可能使该前提失效。属射程边界。
      status: "boundary_case"

discriminant_validity: |
  【与BR-L2-006(内群体偏好)的判别】
  BR-L2-006的被预测量=资源分配的【行为偏斜】(多给/多信任/多护着),包含认知成分("多给是应该的")——但BR-L2-006的认知成分是对【分配结果】的认知("他值得更多"),本推论的认知成分是对【程序公平性】的认知("让他多得的那个规矩是公道的")。前者是"这个人该多拿"(对受益人的评价),后者是"这个规矩公道"(对程序的评价)——不同被预测量。若实证发现内群体偏好只体现在"他该多拿"而不延伸到"规矩公道",则本推论的核心(程序公平感知被群体身份扭曲)被削弱。

  【与DED-008(裙带-监督者独立)的判别】
  DED-008的核心:裁量者嵌入亲缘网→偏私是理性的→需独立监督者(不分享偏私收益)守住一视同仁。这是【结构-制度】层的分析——被预测量=制度是否滑向裙带(客观配置是否按亲缘偏斜)。本推论的核心:裁量者的【公平感知本身】被群体身份着色,真诚认为偏私行为是公平的。这是【认知-心理】层的分析——被预测量=裁决者真心认为程序是否公道。二者可同时为真且相互加强:结构性独立监督(A/B/C)拦住了制度层面的裙带(DED-008),但裁决者仍可在心理层面将"拦不住的那些偏私"自我合理化为"程序公平"(DED-019)。不同层,不竞争。

  【与认知失调(Festinger 1957)和动机推理(Kunda 1990)的判别】
  DED-019的核心机制——"裁决者偏袒内群体后真诚认为程序是公平的"——实质是认知失调(Festinger 1957)在程序公平域的应用实例:"我偏袒了自己人"+"我是公平的人"两个认知元素冲突→认知失调→通过调整对程序公平性的判断来消解失调("程序本身是公道的")。同时也是动机推理(Kunda 1990)的典型场景:人从期望结论("我的群体理应受益")出发,逆向检索/构建支持该结论的公平判断。二者的交叉预测:人通过调整程序公平态度来消解"偏私行为"与"公平自我形象"之间的失调,且此调整是真诚的(非纯印象管理)。

  真正属于本体系/DED-019独有的delta收缩为两项:
  ①空格预测——"有内群体偏好+程序中立+公平评分无差异"这一心理状态被预测为空。认知失调理论本身不排除此二解耦的可能态:一个人完全可以承认"我偏袒了自己人,但这个规矩本身对双方是公道的"(行为-认知解耦——失调可通过其他途径缓解,如"偶尔偏一次不算不公平"或"他确实更急需"等补偿性认知,无需修改对程序本身的判断)。DED-019强制将这些解耦通道关闭——空格(iii)预测行为层偏好与认知层程序评价不可解耦,这是对认知失调理论的窄化/强化,非其默认预测。
  ②透明度的反直觉方向——透明度提高不缩小(甚至扩大)公平评分差距。认知失调理论对透明度的调节方向无强先验预测:透明既可能通过"信息增量"削弱失调的基础("我了解了规则,发现确实偏了"→调整行为),也可能如DED-019预测的被用作失调缓解材料("规则是透明的=我是公平的"→加固错觉)。DED-019给出了一个确定的方向预测且与直觉相反,这是delta。

  诚实注:除去①②两项delta后,DED-019的剩余机制——"偏好行为→认知失调→对程序公平态度的合理化调整"——是成熟社会心理学理论在群体间公平判断场景中的直接应用,并非本体系独有发现。推论的非平凡性完全依赖①②两个特殊预测的成立。

  【防平凡化守卫】
  非平凡【不在】"人偏袒自己人"(BR-L2-006已给),也不在"人觉得程序公平时更能接受结果"(BR-L2-015已给)。非平凡在:①程序公平感知的【对象】本身被群体身份扭曲——不是程序不公平人就不接受,而是谁受益就决定了人是否觉得程序公平(因果方向反转:群体身份→程序公平感知,而非程序公平→结果接受);②空格预测"有偏好+中立程序+公平评分无差异为空"(行为偏斜与认知评价的强制耦合);③透明度反被用作自我说服材料(与BR-L2-015的"透明→感知公平"方向一致但机制翻转——透明被用作认知失调缓解而非信息增量)。

