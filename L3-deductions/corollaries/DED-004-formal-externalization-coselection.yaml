id: DED-004
type: deduction
layer: L3-deductions
status: rejected

# ============================================================================
# 【终局：REJECTED（2026-07-13）】
# 本推论经四道互不相关机制被逐层剥至零，无存活的非平凡可证伪内容。
#   1. ADV-REVIEW-008 逐格判空：P2 平凡合取、三难继承父推论 → 仅剩对称 P1
#   2. EMP-TEST-004 经验检验：证伪对称 P1，捞出不对称 B⇒A
#   3. ADV-REVIEW-009 round-3：B⇒A 亦死——大规模形式=DED-001(平凡)、小规模形式
#      =假(小规模成文法无官僚是一整类:德雷罗斯/戈尔廷/Brehon/Æthelberht)、
#      "大规模"scope 是 DED-001 造成的不可证伪护身符、89% 是规模伪相关
#   4. 作者盲点：给对称 P1 控了规模、却忘给同数据长出的幸存者 B⇒A 控规模
# 以下全文保留为"一条推论如何诚实归零"的档案。终局裁决见 ADV-REVIEW-009。
# ============================================================================

deduction_form: composite  # 交互型：结论来自 DED-001 × DED-002；经 ADV-REVIEW-008 缩水 + EMP-TEST-004 修订
term: "信息外化不对称蕴含推论 (Formal-Externalization Asymmetric-Implication Corollary)"

statement: |
  DED-001（组织深度天花板）与 DED-002（规范成文化阈值）各自的天花板
  【共享同一块地基石】——AXIOM-002（信息保真逐级衰减）：两者都因"人脑作为
  信息介质"而受限。但它们【不是同一堵墙】：DED-001 另调串行传递保真 r^(2n)，
  DED-002 另调记忆容量 + 多人一致协调成本。是【共享地基、各有另约束的两堵墙】。

  本推论的非平凡主张 P1，经 EMP-TEST-004 检验后【从对称形式修订为不对称形式】：

  【对称 P1（已被 EMP-TEST-004 证伪，不再主张）】
  "两项外化共选择、控制规模后正相关"——EMP-TEST-004（20 个前现代政体）证伪：
  控制规模后 partial-φ 趋零（大帝国档 A 恒为 1、B 却在变），且行政外化常常
  不带规范外化（印加/阿兹特克/玛雅/达荷美/阿散蒂 = A1B0）。

  【不对称 P1（修订后，EMP-TEST-004 支持）】方向蕴含：
    B ⇒ A（规范外化 ⇒ 行政外化）：把抽象规范外化到持久介质，需要能编码
    抽象命题的【全套文字】；而拥有此种文字的社会必然也用它做行政。故规范
    外化的社会几乎必然也外化行政——EMP-TEST-004：9 个 B=1 中 8 个 A=1 = 89%，
    唯一例外是袖珍冰岛（S=2）。
    A ⇏ B（行政外化 ⇏ 规范外化）：行政外化常常【不】带来规范外化——尤其
    靠非表音记录系统（结绳/图画/结算符）的社会，能记数字贡赋却编不了抽象
    法条——EMP-TEST-004：13 个 A=1 中 5 个 B=0。

  机制：编码抽象规范（B）所需的表征能力，是记录数量/实体（A）所需能力的
  【超集】。故 B 的介质能兼做 A，A 的介质（记数）升不到 B——单向蕴含由此而来。

  == 诚实声明 ==
  (1) 对称共选择已死；存活的是单向 B⇒A。这是 EMP-TEST-004 数据【自己长出来】
      的命题（如 DED-002 经 EMP-TEST-002 长出"分裂裂变"），尚待【独立数据】
      确认——故本推论为 verified*，非 verified。
  (2) 官僚化与成文化【不是同一个动作】（冰岛成文不官僚、印加官僚不成文）。
  (3) 标度三难主要继承自父推论、"规避耦合"是平凡合取——均不计入独有证伪力
      （见 ADV-REVIEW-008）。

# === 规则 A：操作化定义 ===

operationalization:
  formal_externalization_B:
    definition: |
      【全局统一的 B 定义】规范内容是否被外化到人脑之外的持久符号介质
      （石碑/泥板/纸张/律典）——【无论是否民主可达、是否需专家读取】。
      关键区分（消除"专家中介"歧义）：内容在【介质里】——需专家【读取】
      仍算 B（如书吏念汉谟拉比石碑）；vs 内容在【专家记忆里】、介质仅助记
      不自解——不算 B（如结绳 quipu）。
      "民主可达"是 DED-002 的另一维，本推论【不】并入 B。
    consequences: |
      - 汉谟拉比石碑 = 有 B（虽对文盲经书吏中介）。
      - 雅典刻石法 = 有 B。
      - 冰岛 1117 年 Grágás = 有 B（且 A=0——B⇒A 的唯一已知例外）。
      - 印加 quipu 承载行政(A)，但承载可检索规范内容(B) 至今未被破译证实，
        且 quipucamayoc 依 quipu 诵法属【专家记忆中介】→ 印加 B=0（EMP-TEST-004）。

  administrative_externalization_A:
    definition: "行政协调信息是否被外化到持久介质并用于跨层级决策——沿用 DED-001 的 formal_information_system + 决策追溯法。"
    measurement: "移除该介质后组织在 < 1 个月内出现显著协调失灵（DED-001 判据）。"

  asymmetric_implication_test:
    definition: |
      不对称 P1 的可操作检验（取代已被证伪的对称 partial-φ 检验）：
      (i) B⇒A 方向：在 B=1（规范外化）的政体中，A=1（行政外化）的比例。
          预测【接近 1】；大规模持久的 B=1,A=0 反例即证伪。
      (ii) A⇏B 允许性：在 A=1 的政体中，允许 B=0 常见（尤其非表音记录社会）。
          这是【非对称的观测面】，不是可证伪主张——可证伪的是 (i)。
    measurement: |
      - 沿用 EMP-TEST-004 的 A/B/规模编码（前置声明样本、独立编码、报信度）。
      - 算 P(A=1 | B=1) 与 P(B=1 | A=1)，看两者是否显著不等（不对称）。
      - B⇒A 的反例搜索：大型、持久(>100年)、统一、B=1 而 A=0 的政体。
    limitations: |
      - EMP-TEST-004 是【生成】此不对称命题的数据；同一数据不能同时确认它。
        需独立样本或 ICV 多模型盲编码才算经验确认——当前仅"生成数据支持"。
      - 非表音记录(结绳/图画)是否算 A 而非 B，是编码命门（印加 75-80%）。

# === 推导链 ===

derivation: |
  from_l1:
    axioms: [AXIOM-002]          # 两堵墙共享的地基石（不是同一堵墙）
  from_l2:
    bridging: [BR-L2-001]        # 有限理性——共享的另一块地基
  from_l3:                        # Rule D：本推论从两条已验证推论推出
    deductions: [DED-001, DED-002]

  steps:
    1. "两堵墙共享地基石——但不是同一堵墙（依 ADV-REVIEW-008 C7 降温）"
      DED-001（verified）：纵向。命令链往返保真度 ≈ r^(2n)，n 超 5-7 脱耦。
      DED-002（verified）：横向。统一规范共同体复杂度受记忆容量 + 传承衰减 +
      多人一致协调成本约束。
      两者【都上溯 AXIOM-002】——共享地基；但各自另调不同子约束——是两堵墙。

    2. "两项适应共享使能基底——但不是同一个动作（依 C2 降调）"
      官僚化（A 的外化）与成文化（B 的外化）都需要外部持久符号介质，
      但是【可分离的两项投资】——冰岛成文不官僚、印加官僚不成文，双向证明可分离。

    3. "对称共选择被证伪——修订为不对称蕴含（依 EMP-TEST-004）"
      初稿由"共享使能基底"推出对称正相关。EMP-TEST-004 证伪之：控制规模后
      partial-φ 趋零，行政外化常不带规范外化（5 个 A1B0）。
      数据长出的、存活的命题是【不对称】：
      B⇒A（规范外化的介质需全套文字，全套文字必兼做行政）89%；
      A⇏B（记数介质如结绳/图画升不到抽象法条）——13 个 A=1 中 5 个 B=0。

    4. "不对称的机制根：表征能力的超集关系"
      编码抽象行为规范（'情境 S 中应做 A'——含条件、否定、例外）所需的
      符号表征能力，【严格超集于】记录数量/实体/名目（贡赋 3 单位、张三欠李四）。
      故：任何能外化 B 的介质，其能力足以（并事实上被用于）外化 A → B⇒A；
      而只够记数的介质（结绳、结算符、图画名录）达不到 B → A 可无 B。
      这一步把 EMP-TEST-004 的经验不对称接到一个信息表征论的机制上。

    5. "被排除的结果——仅 B⇒A 承担独有证伪力（防平凡合取）"
      DED-004 的独有可证伪内容【只有】不对称蕴含 B⇒A：
      (证伪) 一个大型、持久、统一的政体，B=1（规范外化）却 A=0（行政纯口头）。
      B⇒A 是横跨两父变量的联合命题（DED-002 只谈 B、DED-001 只谈 A，
      任一都不预言"B 的社会也有 A"）——非平凡。
      不计入独有证伪力的仍有：标度三难（继承父推论）、规避耦合（平凡合取）。

    6. "因果与 scope 诚实声明"
      B⇒A 是【大规模】蕴含：袖珍冰岛（S=2）是已知的 B1A0 小例外，说明蕴含
      在小规模会破。scope 限定为"大型、持久、统一政体"不是护身符——它有明确
      的证伪面（一个【大型】B1A0 案例即可证伪），冰岛的小规模是诚实标注的边界。

# === 可证伪性 ===

falsifiability: |
  本推论的非平凡可证伪内容是【不对称蕴含 B⇒A】：

  (a) 发现一个【大型、持久(>100年)、统一】的政体，其规范被外化到持久介质
      (B=1) 却【不】外化行政(A=0)——"规范外化而行政纯口头"的稳健大规模案例。
      这将证伪 B⇒A。（袖珍冰岛 S=2 A0B1 是已知的小规模例外，不足以证伪
      大规模蕴含；须一个大型持久案例。）

  (b) 发现某社会用纯记数系统（结绳/结算符/图画名录）承载了【可从介质读取的
      抽象法律条文】——证伪"表征能力超集"机制。印加叙事 quipu 若被证实编码
      可读法律即属此类（当前 B=0，置信 75-80%）。

  已被 EMP-TEST-004 证伪、不再主张的：对称 P1（共选择、控制规模后正相关）。

  反平凡合取声明（承 ADV-REVIEW-008）：B⇒A 是横跨两父变量的联合命题——
  DED-002 只谈 B、DED-001 只谈 A，任一都不预言 B⇒A。三难与规避耦合仍不计入
  独有证伪力。若 (a)(b) 也不可证伪，则本推论退化为平凡合取，应予撤稿。

falsification_trace:
  primary_suspect: "不对称蕴含 B⇒A——若发现大型持久统一政体 B=1 而 A=0（规范外化却行政纯口头），则 B⇒A 被证伪。这是最可能被经验推翻的环节，且当前仅由生成数据(EMP-TEST-004)支持、未经独立确认。"
  secondary_suspect: "弱义 B 的操作化 + 非表音记录判定——若结绳/图画到底算不算承载抽象规范内容在具体案例(印加叙事 quipu、玛雅图记)上不可靠判定，则 B⇒A 的经验支持随之不稳。"
  unlikely_suspect: "表征能力超集机制——若存在纯记数介质被证实能承载可读抽象法条，则 B⇒A 的机制根被削弱，但方向不对称的经验规律仍可独立成立。"

# === 排除的结果 ===

excluded_outcomes:
  - outcome: "大规模规范外化而行政纯口头（证伪 B⇒A）"
    description: "一个大型、持久(>100年)、统一政体，B=1(规范外化)但 A=0(行政纯口头)。"
    testability: "历时编码；冰岛(S=2)是已知小规模例外，需大型持久案例才证伪。"
  - outcome: "纯记数系统承载可读抽象法条（证伪机制）"
    description: "某社会用结绳/结算符等纯记数介质承载可从介质读取的抽象法律。"
    testability: "如印加叙事 quipu 被破译出可读法律(当前未证实, B=0)。"

# === 现实锚点（含 EMP-TEST-004 的 20 政体证据）===

real_world_anchors:
  supporting:
    - anchor: "B⇒A：规范外化的社会几乎必然也外化行政（EMP-TEST-004, 89%）"
      evidence: |
        9 个 B=1 政体（古巴比伦/埃及/汉/罗马/奥斯曼/蒙古/早期伊斯兰/雅典/冰岛）
        中 8 个 A=1——唯一例外是袖珍冰岛(S=2)。规范外化几乎不单独出现。
        机制：能编码抽象法条的全套文字，必然也被用于行政。
      confidence: moderate

    - anchor: "A⇏B：行政外化常不带规范外化，集中于非表音记录社会（EMP-TEST-004）"
      evidence: |
        13 个 A=1 政体中 5 个 B=0：印加(quipu 记数)、阿兹特克(图画贡赋册)、
        玛雅(语标文字)、达荷美(贝币结算普查)、阿散蒂(金衡国库账)。全部用
        非表音/记数介质——能记数字贡赋，编不了抽象法条。达荷美~290 年、
        阿散蒂~200 年持续如此。这批案例【证伪了对称 P1、支持了不对称 A⇏B】。
      confidence: strong

    - anchor: "美索不达米亚：同一楔形文字家族承载 A + B（B⇒A 的机制范例）"
      evidence: |
        楔形文字既承载账册(A)又承载《汉谟拉比法典》(B)——能写抽象法条的
        全套文字同时服务行政，正是 B⇒A 机制"全套文字兼做行政"的直接实例。
      confidence: moderate

  counterexamples: []   # B⇒A 的大规模反例：EMP-TEST-004 未找到(冰岛是小规模例外)；后续独立样本继续搜

  boundary_cases:
    - case: "冰岛自由邦——B⇒A 的唯一已知例外（小规模）"
      analysis: |
        B=1(1117 成文 Grágás)、A=0(无行政官僚)、S=2(3-6 万人)。这是 B1A0，
        字面是 B⇒A 的反例——但规模小、且行政本可靠口头维持(未触深度天花板)。
        故 B⇒A 被限定为【大规模】蕴含，冰岛作为小规模边界诚实标注：它说明
        蕴含在小规模会破，大规模才成立。
      status: boundary_case

    - case: "印加 quipu——A⇏B 的最强案例，也是机制的命门"
      analysis: |
        A=1(数值 quipu 已破解、自解，承载普查/贡赋)、B=0(叙事/法律 quipu 迄今
        无可读语义，法律在 quipucamayoc 记忆里)。EMP-TEST-004 深查①置信 75-80%。
        若未来叙事 quipu 被证实编码可读法律，B 翻 1 → 证伪 B⇒A 的超集机制。
      status: boundary_case

    - case: "早期伊斯兰法——非持续解耦（承 ADV-REVIEW-008 + EMP-TEST-004 深查②）"
      analysis: |
        A=1、B=1。古兰经~650 即成文(规范核心外化)，hadith 口传约 150 年内成文。
        属短期时滞，非"行政已外化、规范永远口头"。不构成 B⇒A 或 A⇏B 的威胁。
      status: boundary_case

# === 经验检验与状态历史 ===

empirical_verification:
  empirical_test: EMP-TEST-004
  cross_verification: "未做——建议后续 ICV 多模型盲编码夯实印加/蒙古/玛雅争议格"
  status_history: |
    verified (ADV-REVIEW-008 两轮) → EMP-TEST-004(20 政体)证伪【对称 P1】、
    捞出【不对称 B⇒A】→ 降 verified* + Rule B 重审(round_3) →
    ADV-REVIEW-009 证明 B⇒A 亦死(规模混淆同病+剪刀差) → 【rejected】。
  finding: |
    raw φ=0.45 但控制规模后 partial-φ 趋零(规模伪相关)；大型子样本离对角 33-38%；
    A1B0(行政有规范无)是主导离对角型，集中于非表音记录社会；达荷美~290/
    阿散蒂~200 年持续行政向单向解耦。→ 对称 P1 证伪。
    但 B⇒A 成立 89%(唯一例外袖珍冰岛)、A⇏B——不对称幸存。
  status_rationale: |
    降 verified*（疑似反例偏强，非直接 contested）：因单编码者、印加 75-80%、
    个别格(蒙古 B、玛雅 A)有争议。不对称 B⇒A 由【生成数据】支持、尚未独立确认，
    故 verified* 而非 verified——诚实标记"支持来自生成数据本身"。回 verified 需
    独立样本或 ICV 盲编码确认，且过 round_3 Rule B。

# === 规则 D 合规声明 ===

rule_d_compliance:
  form: composite
  parents: [DED-001, DED-002]
  provenance: |
    基础前提(L1×L2)：AXIOM-002, BR-L2-001；派生前提(L3)：DED-001, DED-002。
    本推论是 derived deduction，大部分承重压在两条父推论上。
  confidence_floor: |
    两个父前提当前均为 verified，故 DED-004 的状态天花板 = verified。
    本推论现为 verified*（经 EMP-TEST-004 降级），低于天花板，合规。
    一旦 DED-001 或 DED-002 未来降级，本推论自动打旗、强制重审
    （由 validate.py 的 confidence_floor 校验守住）。
  independent_anchor: |
    满足纪律③：不对称 B⇒A 的经验证据（EMP-TEST-004 的 20 政体编码）是 DED-004
    【自带】的独立经验内容，非重复引用父推论各自的锚点。父推论万一被证伪，
    DED-004 的 B⇒A 经验规律仍可独立成立。
