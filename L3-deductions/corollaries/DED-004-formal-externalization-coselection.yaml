id: DED-004
type: deduction
layer: L3-deductions
status: verified

deduction_form: composite  # 交互型：结论来自 DED-001 × DED-002；经 ADV-REVIEW-008 缩水
term: "信息外化共选择推论 (Formal-Externalization Co-selection Corollary)"

statement: |
  DED-001（组织深度天花板）与 DED-002（规范成文化阈值）各自的天花板
  【共享同一块地基石】——AXIOM-002（信息保真逐级衰减）：两者都因"人脑作为
  信息介质"而受限。但它们【不是同一堵墙】：DED-001 另调串行传递保真 r^(2n)，
  DED-002 另调记忆容量 + 多人一致协调成本。是【共享地基、各有另约束的两堵墙】。

  本推论的【唯一非平凡主张】是 P1（共选择）：
  解开这两堵墙各自的适应——DED-001 的"官僚化"与 DED-002 的"成文化"——
  【共享同一块使能基底】：把信息外化到人脑之外的持久符号介质。一旦社会
  为其一投资了这种介质，另一项也随之变便宜。因此两项外化【倾向使用同一
  介质家族，并在控制规模后仍正相关】。这是任一父推论单独都不预言的相关
  结构（DED-001 只谈命令链、DED-002 只谈规范，都不预言两者会相关）。

  == 诚实降级声明（本推论强度远低于初稿宣称，依 ADV-REVIEW-008）==

  (1) 官僚化与成文化【不是同一个动作】，而是共享使能基底的【两项可分离
      适应】。反例双向存在：冰岛自由邦 1117 年写下 Grágás 法典却零行政官僚
      （成文而不官僚）；印加以 quipu 承载普查/贡赋却无可检索成文法
      （官僚而不成文）。故 P1 是"相关"，不是"同源/一把钥匙"。

  (2) 紧凑形式"标度三难"{深、规范统一、大、纯口头 至多取三}【主要继承自
      两条父推论】——每条天花板各自排除自己那一维的纯口头违例。DED-004
      仅添加"两维可由同一次外化投资一并解开"这一点。三难不计入本推论的
      独有可证伪力。

  (3) "规避耦合"（联邦化与分裂裂变共现）【降级为解释性统一】：逐格分析
      证明它是平凡合取——大型口头社会 2×2 表的每个禁格都由【单一】父推论
      判空（"碎片""扁平"是闲置合取项）。它好看，但不是独立可证伪的新预测，
      不计入本推论的非平凡内容（见 ADV-REVIEW-008 C1）。

# === 规则 A：操作化定义 ===

operationalization:
  formal_externalization_B:
    definition: |
      【全局统一的 B 定义】规范内容是否被外化到人脑之外的持久符号介质
      （石碑/泥板/纸张/律典）——【无论是否民主可达、是否需专家读取】。
      关键区分（消除"专家中介"歧义）：内容在【介质里】——需专家【读取】
      仍算 B（如书吏念汉谟拉比石碑）；vs 内容在【专家记忆里】、介质仅助记
      不自解——不算 B（如结绳 quipu）。
      "民主可达"是 DED-002 的另一维，本推论【不】并入 B。
    consequences: |
      - 汉谟拉比石碑 = 有 B（虽对文盲经书吏中介）。
      - 雅典刻石法 = 有 B（故雅典非纯口头，不落"纯口头"禁格）。
      - 冰岛 1117 年 Grágás = 有 B。
      - 印加 quipu 承载行政(A)，但承载可检索规范内容(B) 至今未被破译证实，
        且 quipucamayoc 依 quipu 诵法属【专家记忆中介】→ 印加 B 存疑。
    limitations: "弱义 B 不区分'成文但需专家'与'成文且民主可达'——后者交由 DED-002 处理，此处不混用。"

  administrative_externalization_A:
    definition: "行政协调信息是否被外化到持久介质并用于跨层级决策——沿用 DED-001 的 formal_information_system + 决策追溯法。"
    measurement: "移除该介质后组织在 < 1 个月内出现显著协调失灵（DED-001 判据）。"

  joint_medium_family:
    definition: |
      "共享介质家族" = 同一介质或制度/技术上同源的介质家族【同时】承载
      A（行政外化）与 B（规范外化）。判据是"制度/技术上的同源"，非"物理上
      同一份文件"。
    clean_anchor: "美索不达米亚：同一楔形文字家族承载账册(A) + 《汉谟拉比法典》(B)。"

  co_selection_test_P1:
    definition: |
      P1 的可操作检验【不是】原始 φ(A,B)（会被'规模'这一共同因混淆），而是：
      (i) 历时：持久存续的大型深层统一政体是否【最终】A、B 都具备且用同一
          介质家族（"曾经-A ∧ 曾经-B ∧ 同家族"编码）；
      (ii) 共时：在【匹配规模/复杂度】后，A 与 B 是否仍正相关（对规模做偏相关
          partial-φ）。
      承重说明（依 ADV-REVIEW-008 round-2）：历时臂(i)近乎真理套话——长寿识字
      帝国迟早两者都写下，独立证伪力≈0；本推论的证伪承重【钉死在共时臂(ii)
      partial-φ】上（见 falsification_trace.primary_suspect）。(i) 只作背景，不承重。
    measurement: |
      - 样本纳入/排除标准 + 规模下限 + 存续年限，检验前写定。
      - 独立编码 A、B 及各自介质家族，报 intercoder reliability。
      - 共时臂算 partial-φ（控制规模）；历时臂算"最终共现 + 同家族"比例。
      - 两臂【分别报告】，不混用。
    falsify: |
      - 控制规模后 A、B 独立（partial-φ ≈ 0），或 A、B 系统性使用互不相关的
        分立介质家族 → "共享使能基底"证伪，P1 死。
      - 存在持久存续的大型深层统一政体，长期只外化其一、另一【永久】纯口头
        → P1 死。（短期时滞如美索不达米亚 ~1000 年不算永久，见 step 6。）
    limitations: "考古存留偏差：易腐介质的规范更易在记录中'消失'，方向须诚实声明。"

# === 推导链 ===

derivation: |
  from_l1:
    axioms: [AXIOM-002]          # 两堵墙共享的地基石（不是同一堵墙）
  from_l2:
    bridging: [BR-L2-001]        # 有限理性——共享的另一块地基
  from_l3:                        # Rule D：本推论从两条已验证推论推出
    deductions: [DED-001, DED-002]

  steps:
    1. "两堵墙共享地基石——但不是同一堵墙（依 ADV-REVIEW-008 C7 降温）"
      DED-001（verified）：纵向。命令链往返保真度 ≈ r^(2n)，n 超 5-7 脱耦。
      DED-002（verified）：横向。统一规范共同体复杂度受记忆容量 + 传承衰减 +
      多人一致协调成本约束。
      两者【都上溯 AXIOM-002】（人脑作为信息介质的保真极限）——共享地基；
      但各自另调不同子约束——是两堵墙，不是一堵墙的两投影。

    2. "两项适应共享使能基底——但不是同一个动作（依 C2 降调）"
      DED-001 适应(b)官僚化 与 DED-002 适应(a)成文化，都需要同一类前提资源：
      外部持久符号介质。一旦这种介质在社会中确立，两项适应都变便宜。
      但它们是【可分离的两项投资】，不是同一动作——
      冰岛成文而不官僚、印加官僚而不成文，双向证明可分离。

    3. "由共享使能基底推出 P1（唯一非平凡预测）"
      既然两项外化共享同一使能基底，则它们【倾向使用同一介质家族、且控制
      规模后仍正相关】。DED-001 只谈命令链、从不预言规范会不会外化；
      DED-002 只谈规范、从不预言行政会不会外化。"两者相关"是组合才产生的
      新命题——这是 DED-004 的全部非平凡内容所在。

    4. "标度三难——组织性框架，主要继承自父推论"
      {深, 规范统一, 大, 纯口头} 至多取三。这个"四取三"的排除力【主要来自
      两条父推论各自】（每条排除自己那一维的纯口头违例）。DED-004 在此仅
      添加一点：解开"深"与"规范统一"两维的，是【同一次】外化投资，而非
      两次独立的幸运——故大型深层统一政体收敛到"有外部介质"而非罕见。
      此框架不计入独有可证伪力。

    5. "被排除的结果——仅 P1 承担独有证伪力（防平凡合取）"
      DED-004 的独有证伪【不是】"深且口头"或"规范统一且口头"（那分别是
      DED-001、DED-002 的证伪条件），也【不是】"规避耦合"（逐格分析证明
      每个禁格由单一父推论判空，是平凡合取）。
      DED-004 的独有可证伪内容【只有】P1：
      (证伪) 控制规模后 A、B 独立(partial-φ≈0)，或系统性使用互不相关的
      分立介质家族，或大型持久统一政体永久只外化其一。

    6. "因果诚实声明"
      共选择是选择压力而非逻辑必然，允许偶然的短期解耦：
      美索不达米亚楔形文字先用于会计，约千年后才用于法律（汉谟拉比）。
      DED-004 的弱式主张——持久存续的大型深层统一政体【最终】两项外化都
      具备且共享介质家族——允许这种时滞；被证伪的是【永久】单向解耦，
      不是短期时滞。强式（"同源/同一动作"）已被 step 2 的双向反例放弃。

# === 可证伪性 ===

falsifiability: |
  本推论（仅 P1 承担独有证伪力）可被以下发现证伪：

  (a) 在前置声明的跨文化样本中，控制规模后行政外化(A)与规范外化(B)统计
      独立（partial-φ ≈ 0），或 A、B 系统性使用互不相关的分立介质家族——
      "共享使能基底"不成立，两项外化是可自由拆分的独立选择。

  (b) 发现一个持久存续（>100 年）的大型深层统一政体，长期只外化其一、
      另一维【永久】保持纯口头——而非短期时滞。

  反平凡合取声明（修订版，依 ADV-REVIEW-008）：
  DED-004 的【独有】可证伪力【仅】在 (a)(b)——它们是 P1 关于"两项外化共享
  使能基底"的命题，任一父推论都不蕴含。
  【不计入】独有证伪力的有二，须诚实标注：
  - 标度三难的"四取三"主要继承自父推论（每维的纯口头违例由对应父推论排除）；
  - "规避耦合"是平凡合取（每个禁格由单一父推论判空），已降为解释性统一。
  若 (a)(b) 也不可证伪，则本推论退化为平凡合取，应予撤稿。

falsification_trace:
  primary_suspect: "P1 的'共享使能基底'主张——若控制规模后 A、B 独立(partial-φ≈0)，或两者系统性使用互不相关的分立介质，则 DED-004 的唯一非平凡内容失效，而两条父推论各自仍存活。这是最可能被经验推翻的环节。"
  secondary_suspect: "弱义 B 的操作化——若'外化到持久介质'与'专家记忆中介'的边界在具体案例(如 quipu、口传但有书面辅助的 hadith)上不可靠判定，则 A/B 编码不稳，partial-φ 的估计随之不稳。"
  unlikely_suspect: "共享地基石主张——若 DED-001 与 DED-002 的天花板其实源于相互独立的原因(而非同由 AXIOM-002 派生)，则'共享使能基底'的机制叙事减弱，但 P1 的经验相关预测仍可独立成立。"

# === 排除的结果 ===

excluded_outcomes:
  - outcome: "两项外化在控制规模后相互独立（证伪 P1）"
    description: |
      前置声明样本中，控制规模/复杂度后 A=行政外化 与 B=规范外化 的 partial-φ
      不显著异于 0，或两者系统性使用互不相关的分立介质家族——表明不存在
      "共享使能基底"，两项外化是可自由拆分的独立选择。
    testability: "跨文化 2×2 + 规模协变量，独立编码 + intercoder reliability，算 partial-φ。"

  - outcome: "大型持久统一政体永久单向外化"
    description: "一个 >100 年的大型深层统一政体，长期只外化 A 或只外化 B，另一维永久纯口头（非短期时滞）。"
    testability: "历时编码'曾经-A ∧ 曾经-B'；若存在稳健的永久单向案例，P1 被证伪。"

# === 现实锚点（DED-004 自带的独立经验锚——满足 Rule D 纪律③） ===

real_world_anchors:
  supporting:
    - anchor: "美索不达米亚：同一楔形文字家族承载行政与规范（P1 的干净锚点）"
      evidence: |
        楔形文字这一持久介质家族既承载行政（粮食/牲畜账册、税收记录 = A），
        又承载规范（《汉谟拉比法典》282 条 = B）。同一介质家族两项功能都占
        ——正是 P1"共享介质家族"的直接实例。
        诚实张力：会计用途早于法律用途约千年（derivation step 6）——支持
        弱式"最终共现 + 同家族"，不支持强式"同年出现/同一动作"。
      confidence: moderate

    - anchor: "冰岛(成文不官僚) + 印加(官僚不成文)：两项外化的可分离性"
      evidence: |
        这【不是】P1 的支持锚点，而是本推论【诚实降级】的证据基础：
        冰岛自由邦 1117 写下 Grágás 却零行政官僚（B 而非 A）；印加 quipu
        重行政外化却无可检索成文法（A 而非 B，且 quipucamayoc 是专家中介）。
        两向反例证明官僚化与成文化【可分离】，故 P1 只能是"相关/共享基底"，
        绝不能是"同源/同一动作"。列于此以对读者透明本推论的边界。
      confidence: strong

  counterexamples: []   # round-1 独立审查未找到能清杀弱式 P1 的反例；round-2 应继续搜

  boundary_cases:
    - case: "古典雅典——为什么'纯口头'限定不可省（支撑三难框架而非 P1）"
      analysis: |
        雅典字面占据"大 + 扁平 + 统一 + 民主可达"，仅靠【文书外化】逃逸。
        它证明：三难里若省掉"纯口头"限定，禁格会被文书社会占据——即
        外化(否定'纯口头')正是逃出三难的那把杠杆。雅典因此【支持三难框架】，
        但三难框架主要继承自父推论，不计入 P1 的独有证伪力。
      status: boundary_case

    - case: "早期伊斯兰法——P1 最该被拷问的解耦候选（独立审查裁为非系统性）"
      analysis: |
        倭马亚/阿拔斯是文书行政国家(A)，早期法律规范(hadith)长期靠口头/isnad
        链传承。潜在 P1 解耦。独立审查(ADV-REVIEW-008)裁断：非系统性解耦——
        古兰经~650 即成文(B 已外化)、hadith 口传处于识字环境+私人书面辅助、
        isnad = DED-002 的专业化适应。属 step 6 允许的短期时滞，不证伪弱式 P1。
      status: boundary_case

    - case: "美索不达米亚千年时滞——强式被证伪、弱式勉强存活"
      analysis: |
        会计(~3200BCE)早于法律(~1754BCE)约千年 = 整个文明尺度的 A-without-B。
        独立审查裁断：这证伪 P1 的【强式】（共选择/同源），但弱式（最终共现 +
        同介质家族）勉强存活。是本推论把 P1 限定为弱式的直接原因。
      status: boundary_case

# === 规则 D 合规声明 ===

rule_d_compliance:
  form: composite
  parents: [DED-001, DED-002]
  provenance: |
    基础前提(L1×L2)：AXIOM-002, BR-L2-001；派生前提(L3)：DED-001, DED-002。
    本推论是 derived deduction，大部分承重压在两条父推论上。
  confidence_floor: |
    两个父前提当前均为 verified，故 DED-004 的状态天花板 = verified。
    本文件为 candidate；须经 round-2 对抗审查确认缩水彻底后方可升 verified。
    一旦 DED-001 或 DED-002 未来降级，本推论自动打旗、强制重审
    （由 validate.py 的 confidence_floor 校验守住）。
  independent_anchor: |
    满足纪律③：P1 的干净锚点（美索不达米亚同介质家族承载 A+B）是 DED-004
    【自带】的独立经验内容——是关于"两项外化相关结构"的命题，非重复引用
    父推论各自的锚点。故父推论万一被证伪，DED-004 的 P1 仍有独立经验承重。
  honest_scope: |
    经 ADV-REVIEW-008，本推论自称的三重非平凡（P1 + P2 + 三难）中，
    P2(规避耦合)被证明是平凡合取、已降为解释性统一；三难主要继承自父推论。
    仅 P1(共享使能基底 → 控制规模后相关) 是真非平凡内容，且尚未经 Rule C
    经验确认。本推论实际强度远低于初稿宣称——此降级本身是体系诚实性的产出。

# === 对抗式审查摘要 ===

