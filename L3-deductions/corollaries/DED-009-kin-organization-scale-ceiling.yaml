id: DED-009
type: deduction
layer: L3-deductions
status: verified

term: "亲缘组织的规模天花板推论 (Kin-Organization Scale Ceiling Corollary)"

人话摘要: |
  纯靠血缘维系的合作组织有规模上限。血亲越远,愿为其吃亏的意愿越弱(亲缘利他随
  亲缘系数衰减),超出"足够相关的亲属"可及范围后,单靠亲情已绑不住协作。要在这个
  上限之上继续做大,系统性地二选一——要么把外人"亲属化":伪造血缘线索(结拜、义亲、
  收养、联宗、教父母、黑帮'家族'、'兄弟民族'的想象共同体),把亲缘利他这台演化机器
  '骗'到非亲身上(拟制亲缘=hack 亲缘机器);要么制度外化:把维系基质从亲情换成
  互惠/规范/第三方制度。不存在"纯真血缘+无拟制+无制度"的大规模协作组织。而且可逆:
  组织缩回血缘可及内,拟制亲缘/制度脚手架就冗余而退化;溢出血缘可及的比重越大,越
  依赖拟制亲缘或制度(单调)。逼出脚手架的是"协作集是否超出足够相关亲属可及"这件事
  本身(成员亲缘系数×网络),【不是】单纯的人头数。

statement: |
  亲缘利他使"为血亲付出"随亲缘系数上升(BR-L2-002),且群体认同随社会距离衰减
  (THEOREM-group-identity-decay);二者给"纯靠血缘维系的协作组织"设了一道
  【血缘可及】天花板——可被亲缘利他绑定的成员数有界。人类另有【逃逸】:大规模非亲缘
  合作(BR-L2-003)与非人格化制度(BR-L2-010)能在血缘之外维系协作。据此:

  【核心】当一个以亲缘利他为协作基质的组织,其【协作集】(被期望主动协作/为组织吃亏
    的成员)超出"足够相关亲属"可及范围时,纯亲缘利他梯度太弱、不足以单独维系协作;
    若要在该范围之上继续维系大规模协作,系统性地补上亲缘利他不再提供的绑定力,补法
    【二选一】——(A) 拟制亲缘:伪造亲缘线索,使亲缘利他近端反应对非亲触发;(B) 替代
    基质(catch-all):改由【一切不借道亲缘利他近端反应通路】的基质供绑定力(互惠/规范/
    想象秩序/第三方制度,乃至胁迫/卡里斯玛的制度化态;"制度外化 BR-L2-003/010"为其主要
    实例);否则该组织的超范围协作退化、缩回血缘可及规模。

  【伞级判据(使二选一穷尽)】超血缘可及仍维系协作,须补上亲缘利他不再供给的绑定力;
    补法按【绑定力是否仍借道"亲缘利他近端反应"这条通路】二值穷尽——
    (A) 【仍借道该通路】,但靠伪造亲缘线索(共居/共名/仪式/共祖神话)使其对非亲触发
        =拟制亲缘,hack 亲缘机器;
    (B) 【不借道该通路】,改由【任何其它基质】另供绑定力=替代基质(catch-all):互惠/
        规范/想象秩序/第三方制度,乃至胁迫/卡里斯玛的制度化态;"制度外化"为主要实例。
    "是否借道亲缘利他反应"是可结构测的二值判据,故 A/B 对"超范围维系手段"穷尽;A/B
    只是达成"补上绑定力"的两条着法。这是被预测量的驱动。

  【驱动量】触发脚手架(拟制亲缘/制度)涌现的,是【协作集超出足够相关亲属可及范围】
    这一事件本身(≈ 成员亲缘系数 × 网络可达性),【不是】单纯人头数、【也不是】产出总量。
    故预测:人头不多但亲缘已耗尽的组织(离散小团伙)也需脚手架;人头很多但仍在稠密
    血缘网内周转的组织(大宗族仍在可追溯血缘网内)未必需要。

  【预测】
    (i)   跨过血缘可及上限仍维系协作的组织,系统性地【要么拟制亲缘(A)、要么制度外化
          (B)】——不存在"纯真亲缘 + 无拟制 + 无制度"的大规模协作组织(逐格判空的空格);
          其脚手架形态由所缺绑定力选择。
    (ii)  可逆:组织缩回血缘可及范围【以内】,拟制亲缘/制度脚手架冗余而退化,退回纯
          亲缘利他维系。
    (iii) 单调(招牌预测):协作集落在血缘可及【之外】的比重越大,越依赖拟制亲缘或
          制度;溢出比重越小,脚手架越薄。与 BR-L2-002 的连续亲缘梯度对齐,非二分。

  【与现有理论的判别】本推论不等同于"组织大了要制度"(常识 / North)或 BR-L2-003
    "人类能大规模非亲缘合作"的复述。其【独有可证伪内容】:①逃逸不止"制度"一条——
    还有【拟制亲缘】这条 BR-L2-003/010 不含的 species(hack 同一台造出天花板的亲缘机器);
    ②可逆 + 单调的定量方向;③驱动量 = 血缘可及溢出(亲缘系数 × 网络),非人头/产出。

# === 规则 A：操作化定义 ===

operationalization:
  kin_reach_overshoot:
    definition: |
      【自变量/驱动量】协作集(被期望主动协作/为组织吃亏的成员)超出"足够相关亲属"
      可及范围的程度——落在【结构门限 θ* 之外】的协作成员(或协作二元组)比重。
      θ* 是【事前、独立于绑定成败】的固定 cutoff:按真血缘 r × 网络可达性钉一条谱牒
      距离/血缘网络密度线(例:共祖在 g 代以内【且】经稠密可追溯血缘链可达,即
      r×网络可达性 ≥ θ*)。θ* 由谱牒/协作网【结构】事前测定,【不随】"亲缘利他有没有
      绑住"浮动——【绝不】用"绑得住/绑不住"来反定义 θ*。落在 θ* 之外者计入溢出。
      是【比重】,不是人头数。
    measurement: |
      谱牒学/亲缘重建 + 协作名册:按【可追溯的真实血缘】(世系/婚姻可达链)复原谁与谁
      相关及其 r,统计协作集中落在"足够相关"血缘网【之外】者的占比。血缘可达要计【网络】
      ——远亲经稠密血缘链仍可绑定,故按"亲缘系数 × 网络可达性"而非两两 r 单点。
      【anti-talisman 硬约束】驱动量须由【真实/可追溯血缘】独立测,【不得】用"他们是否
      互称兄弟 / 是否办了结拜 / 是否联宗"(那是【被预测的拟制亲缘结果】)来测——否则
      自变量偷用结果,循环(DED-004 死病)。
    limitations: |
      r 连续、随距离衰减(继承 BR-L2-002),"足够相关"是软带非硬阈值;拟制/收养/义亲
      纽带【不计入】驱动量,归被预测量(scaffolding_substrate 的 species A)。

  scaffolding_substrate:
    definition: |
      【被预测量】协作集超出纯亲缘利他可绑定处、维系协作所补的绑定力来自哪种基质:
      (none) 纯真亲缘利他(无拟制、无制度)——预测在"超范围"档【为空】;
      (A) 拟制亲缘——伪造亲缘线索触发亲缘利他近端反应(结拜/义亲/收养/联宗/教父母/
          黑帮'家族'/'兄弟民族'想象共同体);
      (B) 替代基质(catch-all)——【一切不借道亲缘利他近端反应通路】的绑定力来源:互惠/
          规范/想象秩序/第三方执行/声誉/契约(BR-L2-003/010 那套),乃至胁迫/卡里斯玛的
          制度化(routinized)态;"制度外化"为其主要实例。基质【非】亲缘利他反应;
      (dispersed) 既无 A 也无 B ⇒ 超范围协作退化、缩回血缘可及规模。
    measurement: |
      结构测各基质的制度签名,独立于"组织是否存活"。
      A:对非亲施加【亲缘话术制度】的在场——结拜/歃血仪式、收养/过继/联宗文书、教父母
        /义亲关系、共祖神话与拟血缘称谓。
      B:第三方执行/成文规则/声誉登记/契约/货币(BR-L2-010 工具箱)、或军纪/胁迫机器/
        卡里斯玛的科层化(routinized)建制的在场与使用强度——凡【不借道亲缘话术】者归此。
      【A vs B 的判据(独立于结果)】绑定力是否借道亲缘利他近端反应(伪造线索→A)、还是
      另起基质(互惠/规范/执行→B)——按【基质】定义 species,不按"看着像不像一家人"。
    limitations: |
      混合态常见(一个宗族既联宗[A]又设义庄[B]),按主导成分或【两者并存】标注,不二分;
      A/B 皆为程度(可薄可厚),对齐 (iii) 单调。

# === 推导链 ===

derivation:
  from_l1:
    axioms: [AXIOM-003]
    theorems: [THEOREM-group-identity-decay, THEOREM-cooperation-precondition]
  from_l2:
    bridging: [BR-L2-002, BR-L2-003, BR-L2-010]

  steps: |
    1. "天花板存在(BR-L2-002 + THEOREM-group-identity-decay)"
       亲缘利他随 r 衰减 + 认同随社会距离衰减 ⇒ 纯靠血缘能绑定的协作成员有界:超出
       足够相关亲属可及范围,亲缘利他梯度太弱,单独不足以维系协作。此即血缘可及天花板。

    2. "超限则纯亲缘协作缺绑定力(THEOREM-cooperation-precondition)"
       协作集超出血缘可及 ⇒ 非亲成员间缺亲缘利他绑定、又无现成互惠积累 ⇒ 协作脆弱、
       趋于退化,除非补入替代绑定力(该定理:陌生人合作需替代机制)。

    3. "逃逸可得且分两支(BR-L2-002 被 hack / BR-L2-003+010 换基质)"
       补绑定力二选一:(A) 仍借道亲缘利他反应,但伪造亲缘线索使其对非亲触发(拟制亲缘)
       ——hack BR-L2-002 那台造出天花板的机器;(B) 不借道该反应,改由【任何其它基质】
       (互惠/规范/第三方制度/胁迫/卡里斯玛制度化态,制度外化为主要实例,BR-L2-003/010)
       另供绑定力=替代基质。二者由"是否借道亲缘利他反应"二值穷尽。

    4. "选择压力 + 合成"
       若超范围协作有净收益:补上脚手架(A 或 B)者能维系并做大、不补者被压回血缘可及
       规模。故超血缘可及仍维系大规模协作 ⟺ 在场 A 或 B;脚手架形态由所缺绑定力选择。

    5. "可逆 + 单调 + 驱动量归因"
       组织缩回血缘可及内 ⇒ 脚手架冗余退化(可逆);溢出血缘可及比重越大越依赖脚手架
       (单调)。驱动量 = 血缘可及溢出(亲缘系数 × 网络),非人头/产出。
       【非平凡性(逐格判空)】BR-L2-002 单独只给"人偏私血亲、亲缘利他衰减"(给天花板、
       不给逃逸);BR-L2-003 单独只给"人类能大规模非亲缘合作"(给制度逃逸、不提拟制亲缘、
       也不给天花板阈值);BR-L2-010 单独只给"制度能替信任"。三者【都不】给出
       "超血缘可及 ⟺ (拟制亲缘 or 制度)"这一联合结构,更【都不】把【拟制亲缘=hack 亲缘
       机器】识别为与制度并列、却作用于同一台 BR-L2-002 机器的独立逃逸。"超范围 × 维系
       协作 × 纯真亲缘(无 A 无 B)"这一格被预测【为空】、且可被现实反例填上(非同义反复)。
       唯合成给出。故非平凡、非砖内结论。

# === 可证伪性 ===

falsifiability: |
  本推论可被以下发现证伪:
  (a) 一个协作集经【可追溯血缘独立测定】确【超出】足够相关亲属可及范围者(——"超范围"
      由 kin_reach_overshoot 的【结构 cutoff θ*(谱牒距离/血缘网络密度线)】事前判定,
      【不因】"亲缘利他绑没绑住"浮动——)的组织,长期维系大规模主动协作,却【既无拟制
      亲缘(A)、也无制度外化(B)】——纯靠真血缘亲缘利他撑住。⇒ 证伪核心(命中"超范围
      却纯真亲缘"的空格;因 θ* 是结构量,该空格是真经验主张、非按构造恒空)。
      注:拟制亲缘(A,联宗/结拜/收养)或制度(B,义庄/契约/执行)在场解释了维系,【正是】
      本推论所预测,不算 (a);(a) 要求 A、B 【俱无】仍维系。
  (b) 脚手架(拟制亲缘/制度)的涌现与"血缘可及溢出"【无】系统关联,只随人头数或产出
      总量走(血缘可及内的大组织普遍上脚手架、溢出血缘可及的小组织普遍不上)。⇒ 证伪
      "驱动量 = 血缘可及溢出而非人头/产出"。
  (c) 维系超范围协作的持久手段被发现【系统性地不】走拟制亲缘或制度,而有第三条纯亲缘
      路径撑住血缘可及之外的大规模协作。⇒ 证伪 (i) 与伞级判据的二值穷尽。

falsification_trace:
  primary_suspect: |
    最弱腿:亲缘利他是否真是天花板处的【绑定约束】。会不会组织在天花板【以下】就早已
    不靠纯亲缘利他(而靠互惠/规范,AXIOM-003)维系,使"纯亲缘规模天花板"从不作为纯现象
    出现——即前件"以纯亲缘利他为基质维系至某上限"近乎空集,(i)/(a) 难有干净实例。诚实
    退守:即便"纯亲缘"从不纯,(iii) 单调预测(溢出比重↑ ⇒ 脚手架依赖↑)仍可独立检验。
    最先受检。
  secondary_suspect: |
    kin_reach_overshoot 须由【真实/可追溯血缘】测,不得用"是否用了拟制亲缘"反推(否则
    循环);A vs B 的 species 判据须按【基质是否借道亲缘利他反应】结构测,不由结果反塞。
  unlikely_suspect: "BR-L2-002(亲缘利他随 r 上升)本身——演化最坚实结论之一,极少是根源。"
  note: |
    刻意规避 DED-004 死病:kin_reach_overshoot 是【结构可测的事前量】,scaffolding_substrate
    是被预测量,二者不互为定义;A/B 由独立的制度签名坐实,不由"协作是否退化"反推
    (见 anti_talisman_clause)。

# === 排除的结果 ===

excluded_outcomes:
  - outcome: "一开始就非亲缘基质的协作(陌生人市场 / 招募陌生人的公司)"
    description: |
      若组织【从不】以亲缘利他为协作基质(创立即靠互惠/契约/雇佣),前件不成立,【不在
      射程】,既不支持也不证伪。判定按【可事前测的渠道】:核心/创立期的协作基质是否为
      亲缘利他,不按事后结果开脱。
  - outcome: "明面按非亲缘原则组织的机构'被认定纯亲缘上限失效'"
    description: "现代科层企业/国家明面以规则/雇佣组织,基质非亲缘利他 ⇒ 出射程,归 (b)/(iii) 的制度端支持,非 (a) 反例。"

anti_talisman_clause: |
  【防不可证伪护身符 — 诚实硬约束】判定"是否超出血缘可及范围"时,必须由
  kin_reach_overshoot 的【真实/可追溯血缘】独立测得,【不得】因"他们用了拟制亲缘
  (联宗/结拜/义亲)"就倒推"必已超血缘可及",也不得因"没上任何脚手架"就倒推"必在血缘
  可及内"。判定 A/B 在场,须由拟制亲缘的【制度签名】(结拜/收养/联宗文书、共祖神话)
  或制度的【结构事实】(第三方执行/契约/声誉登记)独立坐实,不由"协作有没有维系住"
  反推。尤其【不得】遇到"A、B 皆无却维系大规模协作"的反例,就事后硬塞一个非正式"拟制
  亲缘"来消化——A 的在场须由独立的亲缘话术制度事实坐实。否则本推论沦为不可证伪循环。

# === 非平凡性 ===

nontriviality_test: |
  逐格判空(自变量档 = 血缘可及内/外;被预测量档 = 纯真亲缘 / 拟制亲缘 A / 制度 B / 退化):
    - 血缘可及【内】 × 纯真亲缘 ⇒ 非空(小家族/游群靠真血缘维系,常见)。
    - 血缘可及【内】 × 拟制亲缘/制度 ⇒ 脚手架冗余,预测稀少且退化(即 (ii) 可逆)。
    - 血缘可及【外】 × 维系协作 × 拟制亲缘(A)⇒ 非空(结拜/联宗/segmentary 谱系虚构)。
    - 血缘可及【外】 × 维系协作 × 制度(B)⇒ 非空(义庄/科层/契约)。
    - 血缘可及【外】 × 维系大规模协作 × 纯真亲缘(无 A 无 B)⇒ 【预测为空】(核心)。
  该空格是真经验主张,非被砖平凡强制:BR-L2-002 只给天花板不给逃逸;BR-L2-003/010 只给
  【制度】逃逸、不含【拟制亲缘=hack 亲缘机器】这条 species、也不给"超范围 ⟺ (A or B)"的
  联合结构与阈值。空格可被"超范围纯真血缘大组织"这一现实反例填上 ⇒ 非空可满足、非同义
  反复。防平凡化:非平凡【不在】核心 (i)"组织大了要非亲缘绑定"(常识/North/BR-L2-003 已有、
  (i) 本身近砖、非卖点),而在①拟制亲缘作为 hack 亲缘机器的独立逃逸 species、②可逆单调、
  ③驱动量 = 血缘可及溢出(非人头,BR-L2-003 只给 N>1000 人头阈值)。

# === 现实锚点 ===

real_world_anchors:
  supporting:
    - anchor: "中国宗族:联宗(拟制亲缘 A)+ 义庄/祠堂/族谱(制度 B)"
      evidence: |
        宗族一旦超出可追溯近亲,靠【联宗】(以虚构共祖把异支/异姓嫁接为'同宗')把亲缘
        利他反应扩到非近亲(A);并以【义庄】(范仲淹式共有田产、成文族规、第三方管理)、
        祠堂、族谱把维系外化为制度(B)。两支脚手架随规模溢出血缘可及而同现。
      independent_kin_evidence: |
        族谱本身可复原【真实可追溯血缘】,并留下联宗/嫁接异姓的文书痕迹 ⇒ 可【独立于
        '是否维系住'】测出"协作集已超真血缘可及"、并把 A(拟制)与真血缘分离。
      confidence: "moderate-strong(谱牒使'超真血缘可及'与'拟制嫁接'可独立测)"

    - anchor: "结拜/歃血/义亲/教父母(compadrazgo)/黑帮'家族'—— species A(拟制亲缘)"
      evidence: "在需协作却已无真血缘可依时,以拟血缘仪式/称谓把亲缘利他反应'骗'到非亲身上(结拜兄弟、义父子、教父母、黑手党 comparatico)。"
      confidence: "moderate"

    - anchor: "节段世系社会(努尔人 / 贝都因)—— species A(谱系虚构)"
      evidence: "远支群体经【虚构共祖的节段谱系】被算作亲属而联合协作;【谱系 telescoping/操纵现象】人类学证据扎实、广受认可(注:经典 segmentary lineage 模型本身有 Kuper 等批评争议,故只承 telescoping 那部分,不援引整套节段模型)。"
      independent_kin_evidence: "谱系的伸缩/操纵可由人类学记录独立识别为【虚构】,与真血缘分离,坐实'超真血缘可及仍以拟制亲缘维系'。"
      confidence: "moderate"

    - anchor: "民族主义/想象共同体(Anderson)——'兄弟民族'/'祖国母亲'/'国父' species A 巨型化"
      evidence: "在远超任何真血缘的规模上,以拟血缘话术(手足/母国/父辈)动员协作。与 BR-L2-003'想象秩序'重叠,但本推论把它归为【亲缘话术】那一支逃逸。"
      confidence: "moderate"

    - anchor: "现代科层企业/国家/常备军 —— species B(制度外化)"
      evidence: "基质从亲缘利他换为成文规则/第三方执行/雇佣与声誉(BR-L2-010),在远超血缘可及的规模上维系协作。前件须核:创立即非亲缘者出射程(见 excluded #1),由家族企业做大者在射程内。"
      confidence: "moderate"

  reversibility_anchor:
    - anchor: "宗族/离散网络缩回近亲后脚手架退化"
      evidence: "宗族衰落或侨商网络收缩回真近亲圈 ⇒ 联宗(A)与义庄(B)冗余而废弛,退回纯亲缘维系。作 (ii) 可逆锚。"
      honest_note: "缩回常与人口/战乱/经济多因交织,只作可逆方向中等-弱支持。"
      confidence: "weak-moderate"

  counterexamples: []

  boundary_cases:
    - case: "大型宗族/王朝看似'纯血缘巨型组织'"
      analysis: |
        表面像 (a) 反例。按判据:先【独立测】其协作集是否真超血缘可及——万人宗族可能仍在
        稠密可追溯血缘网【内】(亲缘系数 × 网络),则未真超范围、属'血缘可及内'档、非反例;
        若确超范围,则几乎总见联宗(A)与义庄/族规(B)脚手架 ⇒ 消化为 species,非反例。
        判定回到 anti_talisman:超范围与拟制在场须各自独立测,不由"用了联宗"反推超范围。
      status: boundary_case

    - case: "王朝/皇室以真血缘继承但靠官僚制统治"
      analysis: "继承核心是真血缘(血缘可及内),但统治的大规模协作靠科层制(B)——分层看:血缘核心归'可及内',超范围治理归 species B 支持,非纯血缘反例。"
      status: boundary_case

# === 判别效度 ===

discriminant_validity: |
  【与 DED-008 的判别】同在亲缘域(共享 BR-L2-002),但被预测量不同:DED-008 管
  【分配公不公(裙带)】——给定一个非人格化制度,嵌入亲缘网的裁量者是否偏私,驱动量是
  裁量者亲缘嵌入 × 监督者独立性;DED-009 管【组织多大会散(规模)】——协作集超血缘可及后
  靠什么维系或退化,驱动量是协作集的血缘可及溢出。同亲缘域、不同被预测量与杠杆。

  【与 DED-006 的判别】共享"可及上限 → 逃逸"母题,但砖/被预测量不同:DED-006 是
  【交换突破信任半径 → 外化制度】(BR-L2-009/010,被预测量 = 交换外化程度,逃逸只有制度
  一条);DED-009 是【协作组织突破亲缘利他可及 → 拟制亲缘 or 外化】(BR-L2-002/003/010,
  被预测量 = 组织维系基质),且 DED-009 多出【拟制亲缘】这条 DED-006 没有的 species——
  hack 同一台造出天花板的亲缘机器。共享母题是体系【复现结构】,非循环复述。

  【防平凡化守卫】非平凡【不在】"组织大了要制度"(那在常识/North/BR-L2-003 射程内),而在
  委托-代理/制度经济学【不含】的三点:①【拟制亲缘 = hack 演化亲缘机器】这条特定机制(伪造
  线索使 BR-L2-002 对非亲触发),它预测一整类被"制度化"叙事漏掉/误分的做大方式(结拜/联宗/
  拟血缘民族);②可逆 + 单调的定量方向;③驱动量 = 血缘可及溢出(亲缘系数 × 网络)而非人头/
  产出。【诚实前置——(i) 近砖非卖点】核心 (i)"超亲缘 ⇒ 需非亲缘绑定"与 BR-L2-003 高度重叠:
  其"想象秩序"按 Anderson 本含"想象的血缘共同体(民族 = 大家庭)",故 (i) 本身近砖、【不是
  卖点】;载重可证伪新意全在①②③——尤其 (iii)/驱动量,在 BR-L2-003 只给 N>1000【人头】阈值
  之外另立【连续溢出】度量。新意在①②③,不在"需要额外机制"或 (i) 本身。

