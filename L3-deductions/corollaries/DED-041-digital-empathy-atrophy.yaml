id: DED-041
type: deduction
layer: L3-deductions
status: verified
term: "数字可处理性×道德内化：具身共情的系统性削弱 (Digital Processability × Moral Internalization: Systematic Atrophy of Embodied Empathy)"

人话摘要: "屏幕上的伤害没有血肉、没有颤抖的声音、没有真实的眼神接触——你知道对方受伤了，但你感受不到。发育期大脑因此在'认知共情'(我知道你痛)和'情感共情'(我感受到你的痛)之间产生了系统性的裂缝。这不是数字媒介的副作用，而是BR-L2-025所揭示的可处理性的直接后果:机器可读的信息恰恰是那些被剥离了具身维度的符号。"

statement: |
  【核心】数字交互将人际互动转化为可搜索、可合成的符号流，系统性地剥离了具身情感反馈信号(面部微表情/声音颤抖/身体语言/眼神接触)——发育期大脑因此无法建立完整的"行为→他人痛苦→情感共鸣→自我抑制"神经回路，共情内化从深度具身(deep embodied)变为表层认知(surface cognitive)。

  【驱动量】两个独立可测的前件:(1)社交交互的数字化率——个体发育窗口期内通过数字媒介(屏幕)进行的社交交互占全部社交交互的时间比例;(2)发育窗口期所处的年龄段——不同发育阶段(儿童期/青春期/成年期)大脑对具身情感信号的依赖程度不同(BR-L2-019 P1+P3的发育窗口预测)。

  【预测】(i)以数字交互为主(>日均4小时屏幕社交)的青少年在疼痛共情fMRI中前脑岛(anterior insula, AI)和前扣带回(anterior cingulate cortex, ACC)的激活强度显著低于面对面交互为主的对照组——这是"情感共情"的神经签名；(ii)两组在共情认知问卷(IRI perspective-taking / empathic concern子量表)得分上无显著差异——这是"认知共情"的行为签名；(iii)AI/ACC的激活强度与屏幕社交时长呈剂量-反应负相关，且该相关在与身体接触/面对面互动共变控制后仍显著；(iv)认知-情感共情解耦的效应量在青春期(12-18岁,BR-L2-019 P3的二阶反思窗口)大于儿童期(5-11岁)和成年期(19-25岁)——因为青春期是共情神经回路的修剪和重组关键期，缺失具身输入的损失在此窗口被放大；(v)对面视频通话(保留部分具身信号:面部表情+声音)比纯文本/图片社交的解耦效应量显著更小，但即使视频通话组的AI/ACC激活仍低于纯面对面组——数字媒介即使最大化具身保真度也无法完全复现物理共在的身体信号。

  【判别】不同于"屏幕时间有害"的模糊流行概念——本推论给出精确机制(BR-L2-025的可处理性→具身信号剥离→BR-L2-019的发育窗口内化受阻→AI/ACC回路发育不足)和可证伪梯度预测。不同于"数字时代道德滑坡"的规范性判断——本推论是机制性事实命题，不判好坏。不同于一般的"共情下降"声称——本推论的核心增量在"认知-情感共情解耦"这一特定签名:认知共情(通过语义渠道获知他人痛苦)完整甚至增强，情感共情(通过具身渠道感受他人痛苦)系统性削弱。这不同于全面的共情缺陷——是共情内部结构的失衡。

operationalization:
  screen_social_hours_per_day:
    definition: "个体在给定发育阶段(儿童期5-11岁/青春期12-18岁/成年期19-25岁)通过数字屏幕媒介进行的社交交互日均时长——包括社交媒体、即时通讯、在线游戏社交、视频通话，不包括被动内容消费(看视频/刷信息流不产生双向交互)。"
    measurement: |
      自报时间日志+设备级屏幕时间追踪双通道互验:(i)结构化时间日志——被试记录每日各时段社交交互的媒介(面对面/视频通话/语音通话/文字/图片)和时长;(ii)设备屏幕时间API——iOS Screen Time / Android Digital Wellbeing的数据，按app类别(social networking/communication/gaming)聚合。关键区分:设备数据给出"某app前台时长"，自报日志给出"该时段内实际社交交互的占比"——两通道交叉验证。
    limitations: "自报有回忆偏差(尤其儿童被试);设备API无法区分app内的主动社交vs被动浏览(如刷Instagram feed但不互动);'屏幕社交'的定义边界(多人同屏玩游戏算面对面还是数字?)需一次性注册——本推论将'同物理空间内的屏幕共用'归类为面对面(具身信号在场)，'远程屏幕交互'归类为数字。"
  affective_empathy_neural:
    definition: "前脑岛(AI)和前扣带回(ACC)在疼痛共情范式中的BOLD信号激活强度——这是情感共情的神经签名，反映'感受他人痛苦'的具身模拟过程，与认知共情(心理化网络:内侧前额叶/颞顶联合区)在神经解剖上可分离。"
    measurement: |
      标准fMRI疼痛共情范式:(i)视觉疼痛线索——呈现他人身体部位受疼痛刺激(如手被门夹)vs中性刺激(如手在门旁)的图片或短视频;(ii)听觉疼痛线索——呈现他人疼痛发声(如惨叫)vs中性发声;(iii)提示共情指令——"想象这个人的感受"vs"注意这个人的外表"(控制注意力)。AI/ACC的ROI分析:按标准解剖mask(anterior insula: MNI ±36,18,6,半径8mm; ACC: MNI 0,18,30,半径10mm,参考Lamm et al. 2011 meta-analysis)提取pain>no-pain contrast的beta值。
    limitations: "fMRI测量的是BOLD信号(神经活动的间接代理)而非神经元放电本身;AI激活对疼痛共情有敏感性但非完全特异性(也参与突显性检测/内感受意识);需控制一般情绪反应性(如对非疼痛负面图片的AI反应)作为基线以分离共情特异性衰减vs一般情感钝化;(v)视频通话的具身保真度假说——对面视频通话即使显示面部+传送声音,仍缺失物理共在的触觉/嗅觉/身体热辐射/同步呼吸节奏等亚模态——fMRI的AI/ACC是否能敏感地检测到这些亚模态缺失是一个开放问题,本预测基于'视频<面对面'但'视频>纯文本'的序数排位,不依赖于fMRI能分辨所有亚模态缺失的假设。"
  cognitive_empathy_questionnaire:
    definition: "人际反应指针(Interpersonal Reactivity Index, IRI)的perspective-taking(观点采择)和empathic concern(共情关怀)子量表得分——这是认知共情的行为签名，测量'我知道/理解他人的感受'而非'我感受到他人的感受'。"
    measurement: |
      Davis(1980)IRI标准28题版本,perspective-taking(PT,7题)和empathic concern(EC,7题)两个子量表,5点Likert评分。PT样本题:"在做决定前，我试着考虑每个人的不同观点";EC样本题:"我经常被自己看到的事情感动"。另加EQ(empatizing quotient, Baron-Cohen 2004)作为交叉验证。关键:IRI测量的是自报倾向/能力，fMRI测量的是实际神经反应——两条通道彼此独立。
    limitations: "自报有社会期望偏差(可能高报共情);IRI的EC子量表部分条目可能捕捉了情感共情而非纯认知共情——需以fMRI为gold standard检验EC得分与AI/ACC激活的相关性:若EC与AI/ACC正相关但本推论预测的'认知共情不降'成立→则EC可能被具身衰减拖累→需拆分子量表中具有身/认知成分的条目。一次性注册:若EC得分随屏幕时长下降而PT得分不降,优先以fMRI裁决(EC的部分条目确实捕捉情感共情),推论的核心签名为'AI/ACC降+PT不降',EC为辅助测量。"
  adult_group:
    definition: "成年期19-25岁，大脑PFC髓鞘化基本完成后的发育阶段，用于预测(iv)中作为效应量比较的基线条件（青春期效应量需显著大于儿童期和成年期）。"
    measurement: |
      与儿童期、青春期相同的操作化定义与测量通道。注意成年期被试的招募需确保无神经发育异常史、无精神科用药史，且总社交时长与儿童/青春期组在统计上匹配（控制总社交时长变量）。
    limitations: "成年期被试的屏幕社交模式可能系统不同于青少年（更多工作相关社交），需在协变量中控制社交内容类型（工作/娱乐/亲密关系）。"

derivation:
  from_l1:
    axioms: [AXIOM-002]
    theorems: [THEOREM-moral-internalization]
  from_l2:
    bridging: [BR-L2-025, BR-L2-019]
  steps: |
    1. "BR-L2-019:道德内化依赖具身人际反馈——行为→他人痛苦→情感共鸣→自我抑制"
       BR-L2-019确立道德内化的三个条件:(i)安全依恋→内化能力基础设施;(ii)对等性信号→内化维持条件;
       (iii)青春期二阶反思窗口→内化重组关键期。三个条件的共同前提是:个体必须实际接收到他人的
       情感反馈信号——他人的痛苦、内疚、羞耻、愤怒通过这些信号被感知、被共鸣、被内化。安全依恋
       (P1)正是通过照护者对婴儿的具身回应(抚触/声调/面部表情/同步节奏)来建立的。对等性信号
       (P2)同样依赖个体观察到他人违规后受害者的真实痛苦反应。这两条通道的输入端都是具身情感信号
       ——而非关于这些信号的语义描述。

    2a. "BR-L2-025:数字媒介的通用机器可处理性"
        BR-L2-025确立数字编码的信息具有机器可处理性——信息不仅可被存储和传输,还可被机器读取、
        搜索、变换和重组。该砖论及“质变而非量变”和“媒介属性→社会结构”的因果方向，但未涉及
        “具身信号”概念，也未论证机器可处理性必然以具身保真度为代价——这是DED-041独立理论贡献的起点。

    2b. "DED-041论证:机器可处理性产生对可编码信号的选择效应——具身情感信号被系统性地降维和剥离"
        本推论在此步骤将BR-L2-025的通用机器可处理性扩展为具身信号的选择效应。关键论证逻辑:
        机器可读的信号是那些可以量化、编码、传输和合成的信号;具身信号(毫秒级微表情/声音频谱细节/
        3D身体语言/瞳孔同步)是模拟的、连续的、全带宽的,数字编码将它们采样、压缩、降维为离散
        符号流。机器可处理性的获得以具身保真度为代价——这不是BR-L2-025的"确立",而是DED-041
        从BR-L2-025出发的创造性扩展,其认识论地位取决于整个推导链的合取能否产出可检验的预测。

    3. "AXIOM-002+THEOREM-内化:具身信号一旦剥离就无法从语义渠道补偿"
       AXIOM-002说信息无维护必衰减。这里的衰减不在"信息丢失"(语义内容可通过数字复制完美保存),
       而在"信息未被录入"——具身信号从未进入数字交互的信息流。THEOREM-内化的P1+P2依赖于
       具身信号的反复配对:行为→他人痛苦(具身感知)→情感共鸣(神经回路被反复激活并强化)。
       如果发育窗口期内输入的信号流中缺失了具身部分,AXIOM-002不是让已有的具身信号衰减——
       它是让从未被建立的神经回路永远无法建立。语义渠道(文字/图片描述他人痛苦)可以建立
       "我知道你受伤了"的认知表征,但无法替代"我感受到你的痛苦"的具身模拟——因为后者依靠的
       是镜像神经元系统和情绪传染,它们的输入端是具身信号而非语义命题。

    4. "合力:数字交互×发育窗口→认知-情感共情解耦"
       步骤1-3首尾相接:BR-L2-019说发育期大脑需要具身情感信号来建立完整的共情内化回路;
       BR-L2-025说数字媒介系统地剥离了这些信号;AXIOM-002+THEOREM-内化说剥离的信号无法从语义
       渠道修复。合成预测:以数字交互为主的发育期个体,其情感共情神经回路(AI/ACC)因具身输入
       不足而发育不全,但其认知共情回路(通过语义渠道学习'他人痛苦是什么')保持完整甚至
       因数字信息丰富而增强——由此产生"认知-情感共情解耦"的独特签名。
       预测(iv)(青春期效应量放大):青春期是共情回路的突触修剪和髓鞘化关键期(BR-L2-019 P3),
       此窗口内具身输入缺失的损失被神经系统重组所放大——青春期前已建立的回路基础在此窗口
       被修剪和重选,若此时缺乏具身输入作为保留信号,共情回路被修剪掉的概率更高。
       预测(v)(具身保真度梯度):不同数字媒介的具身保真度不同——视频通话(面部+声音+准同步)
       保留的具身信号多于语音通话(仅声音)多于文字/图片(零具身信号)——AI/ACC激活应在
       此梯度上排列:面对面>视频通话>语音>文字——但任何数字媒介的AI/ACC激活均应
       <面对面基线(因为数字编码的采样/压缩即使最大化保真度也无法复现物理共在的全带宽
       具身信号,BR-L2-025的通用可处理性保证所有数字信息都必须先编码为机器可读格式)。

    5. "非平凡性(逐格判空)"
       2×2判据表见nontriviality_test。核心非平凡增量是'认知-情感共情解耦'这一签名——
       不是"数字让人共情下降"(单轴),而是"情感共情降+认知共情不降"的交互格局。
       此格局不在任何一块承重砖中:BR-L2-019只讲内化需要具身反馈但未涉及数字媒介;
       BR-L2-025只讲数字剥离具身信号但未涉及共情回路的发育后果;
       THEOREM-内化只有内化的一般机制但未涉及媒介特异性。

falsifiability: |
  【五条注册口径，一次性注册，不得事后调整】

  (a) AI/ACC组间差异口径:以数字交互为主的青少年组(>日均4小时屏幕社交)在疼痛共情fMRI的AI/ACC激活(pain>no-pain contrast)显著低于面对面交互为主的对照组(<日均2小时屏幕社交)。统计量:独立样本t检验或ANCOVA(控制年龄/性别/总社交时长/一般情绪反应性),效应量Cohen's d。若两组AI/ACC激活无显著差异(d<0.3且p>0.05),核心主张被证伪。
  【阈值选择的事前辩护】4h/2h的切分基于:Twenge(2019)报告的美国青少年日均屏幕社交时长中位数约3h;常用屏幕时间研究中高使用组通常定义为>4h(如Przybylski & Weinstein 2017)。此为暂定操作值,承诺在见任何fMRI数据前完成阈值敏感性分析的注册——包括在不同阈值(如3h/1.5h, 5h/2.5h)下重复主分析,并报告阈值变化对结论的影响。若主要结果在极小阈值偏移下翻转(如3h切分显著但4h不显著),则推论的稳健性降级为弱。
  【决策优先级注册】若(a)组间比较不显著但(c)剂量-反应显著(即连续相关成立但切分阈值未捕捉到效应),优先以(c)为裁决依据——因为组间比较的切分阈值是人为的,连续剂量-反应更直接检验机制因果链。但若(a)和(c)均不显著,则核心主张被证伪。

  (b) 认知共情不降口径:两组在IRI perspective-taking(PT)子量表的得分无显著差异(d<0.3且p>0.05)。若数字化组PT得分显著低于对照组——即认知共情也下降了——则'解耦'签名被证伪:观察到的不是共情内部结构的失衡,而是全面的共情缺陷。若此情况发生,推论机制需从'具身剥离→情感共情特异性萎缩'修正为'数字交互→一般性共情缺陷',后者是与现有'屏幕时间有害'文献一致的更弱主张。
  【特别警示】现有代际数据显示IRI PT子量表也存在下降趋势(Twenge 2018; Konrath 2011),这意味着(b)可能被坐实。此张力在falsification_trace中已作为结构性风险单独列出——若(b)被坐实,解耦签名塌缩,推论退化为简化的'全面共情下降'。

  (c) 剂量-反应口径:AI/ACC激活强度与屏幕社交时长的偏相关系数(r_partial,控制面对面社交时长)显著负(r<-0.3, p<0.05)。若相关不显著,具身剥离机制的关键因果链(更具身→更多数字→更少具身输入→更弱AI/ACC)断裂。

  (d) 发育窗口效应量口径:青春期组(12-18岁)的AI/ACC组间差异效应量(Cohen's d_adol)显著大于儿童组(5-11岁,d_child)和成年组(19-25岁,d_adult)。统计量:d_adol - max(d_child, d_adult)的bootstrap置信区间(95% CI)不包含零。若青春期效应量不显著大于儿童/成年组,BR-L2-019 P3(青春期是关键重组窗口)在本推论中的作用被削弱——发育窗口的时机特异性不成立。

  (e) 具身保真度梯度口径:不同数字媒介方式的AI/ACC激活按具身保真度严格排列:面对面>视频通话>纯语音>文字/图片(序数排名,Friedman检验或线性对比)。若出现违反此序数排名的反转(如纯文字组AI/ACC激活≥视频通话组),BR-L2-025的'信号剥离随编码抽象程度递增'机制被削弱。

  【(iv)(v)为(i)(ii)在发育窗口和媒介类型维度的延伸——若(i)(ii)不成立,(iv)(v)的独立检验无意义。(i)(ii)为推论核心命门,(iii)(iv)(v)为外围诊断。】

falsification_trace:
  primary_suspect: |
    BR-L2-025的"可处理性→具身信号剥离"是推论最关键的单点脆弱环节——若此链接断裂,整条因果链塌缩。
    三个子风险:
    (1)程度问题:数字媒介的具身信号剥离程度是否足够大到大尺度上可观测的AI/ACC组间差异?
    视频通话保留面部表情+声音,文字附有emoji/GIF/sticker作为情感代理——这些'数字具身代理'
    是否足以维持情感共情回路的基本激活?若答案是对,核心预测(a)不成立。
    (2)补偿机制:发育中的大脑是否具有可塑性,能从稀疏的具身信号中提取足够的统计规律来建立
    情感共情回路?若具身信号只需'最低有效剂量'(如每天30分钟面对面)即可满足发育需求,则
    >日均4小时的阈值设置失当——绝大多数数字交互主导的青少年仍能达标。
    (3)替代路径:语义渠道(文字/叙事/故事)中的情感内容——通过前额叶-杏仁核的认知重评通路——
    是否可以绕过AI/ACC而通过替代神经回路实现情感共情的功能等效?若可,则AI/ACC激活下降
    不代表"情感共情萎缩",只代表"神经实现路径切换"——此时预测(a)虽成立但核心主张
    (共情内化从具身变为认知)的结构已不同:AI/ACC是情感共情的proxy而非定义。
    【终极自反】本primary_suspect本身暴露了推论潜在的免疫力:若AI/ACC下降但被试行为层面
    的情感共情(如助人行为/情绪传染)不降,可声称"神经路径替代"——此为anti_talisman_clause
    需严防的逃逸路线。
  secondary_suspect: |
    BR-L2-019的发育窗口P1+P3的具体窗口期边界——若道德内化的关键发育窗口不在青春期(5-18岁)
    而在更早(0-3岁,前语言期)或更晚(成年早期),则本推论的"青春期数字交互→共情回路萎缩"
    时序链不成立:成年后的数字交互不会影响已建立的共情回路,而儿童早期的数字交互(0-5岁)
    的屏幕社交时长可能极低(幼儿不使用社交媒体),推论的实际射程收窄至零。
  structural_risk_from_existing_data: |
    【结构性风险】现有代际数据(Twenge 2018; Konrath 2011)显示IRI的perspective-taking(PT)
    子量表得分在2000-2015年间也呈下降趋势——这与本推论预测(b)"认知共情不降"直接冲突。
    虽然这些数据为横截面积代际趋势而非个体因果,且可能反映教育/文化等混杂因素,但该张力
    足够严重,应作为结构性风险而非弱置信度锚点处理。若未来的纵向追踪或横断面研究确认
    PT子量表与屏幕社交时长的负相关(即使效应量较小),则(b)被坐实,解耦签名失效,推论
    退化为'全面共情下降'。此风险已在real_world_anchors中标注为weak confidence,但
    此处升级为结构性风险——它直接威胁整个推论的核心签名而非仅仅操作化细节。
  unlikely_suspect: |
    "AI和ACC是疼痛共情的神经签名"这一神经科学基础——Lamm et al.(2011)的meta-analysis
    涵盖>200个fMRI研究,AI/ACC在疼痛共情中的激活是fMRI领域最稳健的发现之一。
    即使AI/ACC的具体功能解释有争议(突显性检测vs共情特异性),其作为疼痛共情的神经标记
    的地位不太可能被推翻。
  note: "primary若被坐实(具身信号剥离程度不足或可被补偿),(a)(c)(e)同时塌缩——推论从'解耦签名'退化为'数字使用与共情的模糊相关'。secondary若被坐实(发育窗口时机错误),推论的发育特异性预测(iv)被推翻,但跨年龄的普遍预测(a)-(b)可能存活(若具身信号对成年人的共情维持也是必需的——即BR-L2-019 P2的对等性信号在成年期仍要求具身输入)。structural_risk若被坐实(PT下降成立),则(b)被证伪,解耦签名塌缩——这是推论最直接的威胁路径。"

excluded_outcomes:
  - outcome: "数字交互导致全面共情下降(认知+情感均降)"
    description: "本推论的核心签名是'解耦'(情感降+认知不降),射程限于共情的内部结构失衡。若观测到全面共情下降→机制不同,本推论被(b)证伪,但不说明数字对共情无影响。"
  - outcome: "AI/ACC激活下降但被试在行为助人任务中表现同等"
    description: |
      本推论依赖AI/ACC作为情感共情的神经标记,但不声称AI/ACC下降必然导致行为层面助人减少——因为助人行为可由认知共情(语义理解+规范推理)独立驱动。若AI/ACC下降+助人行为不降,不证伪推论:'认知共情补偿行为层面的助人'恰与本推论的解耦签名自洽。
      【预警:此为anti_talisman的危险地带——见anti_talisman_clause(4)】。
  - outcome: "成年后改用数字社交导致共情下降"
    description: "BR-L2-019的P1+P3将发育窗口置于儿童期-青春期。成年后(>25岁,PFC髓鞘化完成)开始数字社交对已建立的共情回路的影响机制不同(可能走BR-L2-019 P2的对等性信号瓦解路径而非发育路径)——不在本推论射程内。成年后数字社交的共情影响属于DED-024(道德内化瓦解动力学)的射程延伸。"

anti_talisman_clause: |
  【防不可证伪护身符——禁止由结果反推前件】

  (1)禁止由"AI/ACC激活低"反推"该组具身信号输入不足"——屏幕社交时长必须由独立于fMRI的通道(自报日志+设备API)测量,不得将AI/ACC低者事后标记为"隐性高数字组"。

  (2)禁止由"认知共情问卷得分与对照组无差异"反推"问卷测量不敏感"——IRI PT/EC为领域标准工具,已在(a)(b)注册前选定。若PT无差异而推论欲声称"实际上认知共情也受损"→自毁核心签名(b)。

  (3)禁止由"AI/ACC差异不显著"反推"fMRI任务未能有效唤起共情"——疼痛共情范式(肢体受痛图片)是领域最稳健的激活范式(Lamm et al. 2011 meta-analysis)。若激活失败,首先接受(a)被证伪。

  (4)【禁止神经路径替代逃逸】这是本推论最危险的免疫策略——若AI/ACC下降但行为层面情感共情(助人/情绪传染/面部模仿)不降,禁止声称"情感共情未萎缩,只是换了神经实现路径"。AI/ACC是本推论注册的情感共情神经标记——若AI/ACC下降的神经层面被坐实但行为层面完好,推论的'情感共情萎缩'核心主张被削弱(功能等效性不依赖于特定神经回路),不得诉求替代路径来救活。此条为一次性注册,后续任何'神经可塑性补偿'解释一律视为事后免疫。

  (5)【对称保护】禁止由"AI/ACC激活正常"反推"该组的屏幕社交测量高估了真数字交互比例"——屏幕社交的测量操作已在(a)(b)注册前定义。若观测到高屏幕社交+正常AI/ACC,首先接受(a)被证伪的可能性,不得将null result归因于测量误差。

  【削弱条件】若(a)不成立但(b)不成立(认知共情也降)→推论退化为'数字交互与共情全面负相关'的弱主张;若(a)成立但(b)不成立→解耦签名失效,推论需修正。若(a)(b)均成立但(c)不成立(无剂量-反应)→机制解释降级。若(d)不成立→发育窗口主张退场,推论变为跨年龄通用。

nontriviality_test: |
  2×2判据表(自变量档:社交交互的数字化率 高 vs 低 × 被预测量档:共情维度 情感共情(AI/ACC) vs 认知共情(IRI PT)):

  格(高数字化,情感共情低)——【非平凡格】——没有任何承重砖平凡地强制它:
  BR-L2-019确立内化需要具身反馈,但未涉及"数字媒介特别地剥夺具身反馈";
  BR-L2-025确立数字媒介剥离具身信号,但未预测这一剥离的"共情回路发育后果";
  THEOREM-内化只有内化一般机制,未区分具身vs认知共情的媒介特异性。
  此格成立的充分条件是三个砖的合取:具身信号对内化必须(BR-L2-019)
  +数字媒介特别地选择保留语义而剥离具身(BR-L2-025)
  +具身信号的缺失在神经发育层面不可由语义渠道补偿(本推论的步骤3合成)。
  若高数字化组的AI/ACC无显著下降,该格被现实填上→推论塌缩。

  格(高数字化,认知共情正常)——【解耦签名的另一半】——此格同样非平凡:
  BR-L2-025不预测"语义渠道完好"(它只说机器可处理,未说对人的认知学习是否足够);
  BR-L2-019不预测"数字交互不影响认知共情"(它不区分共情维度)。
  此格若被推翻(高数字化组认知共情也降)→解耦签名失效,(b)被证伪。

  格(低数字化,情感共情正常)——【基准格】——面对面交互为主的个体保持完整的
  具身情感信号输入,AI/ACC激活维持在正常发育水平。

  格(低数字化,认知共情低)——非本推论射程(可能由认知能力/教育等独立因素驱动),
  不证伪也不体面本推论。

  brick=conclusion自查:'数字交互通过具身信号剥离导致认知-情感共情解耦'
  未在任何承重砖中原文或近义出现。BR-L2-025不含"共情"/"内化"/"发育";
  BR-L2-019不含"数字"/"媒介"/"屏幕";THEOREM-内化不含"媒介特异性"。
  三砖合取产生的"解耦签名"是组合增量——不在任何单一砖中。

real_world_anchors:
  supporting:
    - anchor: "疼痛共情fMRI的AI/ACC稳健性"
      evidence: |
        Lamm et al.(2011)的meta-analysis(NeuroImage,涵盖>200个fMRI研究)确证前脑岛(AI)
        和前扣带回(ACC)是疼痛共情最稳健的神经签名——无论以图片/视频/声音呈现他人疼痛,
        AI/ACC在pain>no-pain contrast中一致激活。AI/ACC的激活强度与自报共情关怀(empathic
        concern)正相关。此锚不直接证明"数字→AI/ACC下降",而是建立AI/ACC作为情感共情
        的valid proxy——这是本推论整个操作化的基础。
      confidence: strong
    - anchor: "GPS导航与空间记忆退化(机制同构锚)"
      evidence: |
        同DED-034 real_world_anchors:长期依赖GPS导航者海马体灰质密度降低,无GPS时的导航
        准确率下降(Bohbot et al. 2007; Dahmani & Bohbot 2020)。此锚的机制同构性:外部工具
        替代某类认知输入(GPS替代空间导航的具身探索,数字媒介替代面对面互动的具身信号)→
        对应的神经回路因输入缺失而萎缩。不直接证明共情回路的类似退化,但确立"输入剥离→
        回路萎缩"的一般机制在神经可塑性层面的真实性。
      confidence: moderate
    - anchor: "数字媒介与青少年共情的横截面研究"
      evidence: |
        Twenge et al.(2018, Emotion)的大样本横截面数据显示美国大学生自报共情(IRI empathic
        concern+perspective-taking)在2000-2015年间显著下降,与智能手机普及率上升的时间
        趋势一致。Konrath et al.(2011)的meta-analysis也报告类似代际趋势。诚实标注:这些是
        横截面/代际趋势数据,不提供个体层面的因果证据;且它们报告的是IRI总分下降(即认知
        共情也降),与本推论的'解耦'预测并不完全一致——若认知共情的代际下降被坐实,(b)在
        代际尺度被削弱。目前数据还不足以区分"代际整体下降"vs"代际内部解耦",需纵向追踪。
      confidence: weak
      note: "此锚已在falsification_trace.structural_risk_from_existing_data中提升为结构性风险——认知共情下降的现有证据直接威胁预测(b)。"
  counterexamples:
    - case: "数字原住民的高共情——全球互联时代的'共情扩张'"
      analysis: |
        可能的反例:数字媒介让个体能接触到全球范围的人类苦难(战争/灾害/不公),通过视频和叙事
        产生'远程共情'——这似乎证明数字媒介增强了共情而非削弱。消化此反例的关键在于"认知vs
        情感共情"的区分:接触远方苦难的新闻和视频无疑增强了认知共情('我知道那里的人在受苦'),
        这恰好与本推论预测的"认知共情通过语义渠道保持完整/增强"自洽;但它是否真正激活了
        与面对面目睹他人痛苦同等强度的AI/ACC反应?这是本推论的实证赌注——远程共情的神经
        签名应与面对面共情有质的差异。若未来的fMRI研究发现远程数字共情(如观看战争视频)的
        AI/ACC激活与面对面目睹他人痛苦无差异→推论的'具身信号剥离'机制被严重削弱。
      status: counterexample_candidate
  boundary_cases: []
