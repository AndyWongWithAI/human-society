id: L3-METHODOLOGY
type: methodology
layer: L3-deductions
status: canonical
date: 2026-07-13

purpose: |
  L3 是整个体系的"价值证明"——展示 L0+L1+L2 的架构能否产出
  关于人类社会的非显而易见的、可检验的洞察。

quality_criteria:
  - "逻辑有效性 — 推导链是否真的从前提推出结论"
  - "非平凡性 — 结论是否在前提之外增加了新知识"
  - "可操作化 — 关键概念能否被测量或识别（硬门槛）"
  - "区分效度 — 推论的预测是否区别于已有的标准理论"

# === 规则 A：操作化（硬门槛） ===

rule_a_operationalization:
  title: "每条推论必须为所有关键概念提供操作化定义"
  scope: "关键概念 = 推论中承担因果功能的非定义性概念"

  requirements:
    - "该概念对应哪个可观测指标"
    - "该指标的测量/计数方法"
    - "测量方法的局限性（诚实声明）"

  fallback_a:
    condition: "关键概念在现有技术下无法操作化"
    action: "提供代理指标（proxy），并论证代理指标与概念的关系"

  fallback_b:
    condition: "代理指标也不可用"
    action: "将推论标记为'定性框架'，声明当前不可直接检验"

  physics_language_rule: |
    不接受使用物理学术语（能量、熵）描述社会现象而不提供
    社会层面的操作化定义。如果借用 L0 物理概念，必须在推论中
    明确"维护投入 ≠ 热力学能量"并给出社会层面的可操作化方案。

# === 规则 B：审查分离 ===

rule_b_review_separation:
  title: "每条推论必须经历对抗式审查才能从 candidate 升为 verified"

  process:
    - step: 1
      actor: author
      action: "完成推论（包括推导链、操作化定义、支持锚点）"

    - step: 2
      actor: reviewer
      action: "执行对抗式审查"
      tasks:
        - "挑战推导链的逻辑跳跃"
        - "独立寻找反例（不限于作者提供的案例）"
        - "检验操作化定义的可操作性"
        - "检验证伪条件在实践上是否可达"

    - step: 3
      actor: author
      action: "对每条挑战做出回应（接受/反驳/限定）"

    - step: 4
      actor: reviewer
      action: "做出裁决：verified / needs_revision / rejected"

    - step: 5
      condition: "如需修订"
      action: "作者修订后重新提交审查"

  audit_trail: "审查报告和推论文件一起保存，形成审计链"

  key_principle: |
    审查者必须独立寻找反例。作者负责支持证据，
    审查者负责反例。两者同时呈现在推论文件中。

# === 规则 C：经验检验（对抗式审查通过后的可选第三步） ===

rule_c_empirical_test:
  title: "verified 推论应尽可能经历经验检验"

  position: |
    对抗式审查（Rule B）检验推论的内在逻辑——推导链是否成立、
    操作化是否可执行、证伪路径是否明确。
    经验检验（Rule C）检验推论的外在对应——真实世界的数据
    是否与推论的预测一致。
    两者互补：逻辑上无懈可击的推论可能在经验上被反例推翻。

  trigger_condition: |
    满足以下全部条件时建议启动经验检验：
    (a) 推论状态为 verified 或 verified*
    (b) 推论的至少一个证伪条件在实践上可达——
        存在可获取的历史/考古/人类学/组织学数据
    (c) 检验的边际信息增益 > 0——
        即检验有可能改变我们对推论置信度的判断
    不满足条件时不应强行检验——"无法检验"比"质量低劣的检验"更诚实。

  test_design_standards:
    sample_selection:
      rule: "样本选择必须在检验开始前声明，禁止在结果出来后调整样本"
      requirements:
        - "明确总体（population）和样本（sample）的关系"
        - "声明纳入/排除标准，包括边界案例的处理规则"
        - "如果样本非随机（如便利抽样），诚实声明并讨论偏差方向"
        - "样本量 N 的记录不能被事后修改"

    coding_scheme:
      rule: "所有分类判定（层级计数、系统类型等）必须有预先声明的编码方案"
      requirements:
        - "每个变量的编码规则必须在检验开始前写定"
        - "边界案例必须单独标记，不得强行归类"
        - "灰色地带（如'半形式化信息系统'）必须诚实报告，不得二值化掩盖"
        - "如果可行，使用双编码者 + intercoder reliability 报告"

    boundary_case_handling:
      rule: "边界案例是对推论最有信息价值的检验对象，必须重点分析而非回避"
      requirements:
        - "边界案例必须在结果汇总表中突出标记"
        - "必须分析：边界案例在哪种编码方案下会成为反例"
        - "如果编码方案的微小变动会改变检验结论，必须诚实声明"

    excluded_outcome:
      rule: "检验也必须声明自己的'排除结果'——什么情况下检验本身被视为失败"
      requirements:
        - "明确：发现什么会使检验结论翻转"
        - "不应事后修改排除标准以适应数据"

  result_to_status:
    rule: "经验检验结果影响推论的置信度，但不自动改变 verified 状态"

    outcomes:
      - outcome: "无反例存活"
        description: "检验样本中未发现证伪推论的结果"
        effect: "verified 维持。推论的经验置信度上升。可以记录为 verified 的支撑证据。"

      - outcome: "发现疑似反例"
        description: "至少一个案例在特定编码方案下构成反例"
        effect: |
          推论添加 verified* 标记（如尚未有）。
          启动深度调查：反例的编码是否可靠？是否有遗漏的控制变量？
          调查结果写入检验报告的 follow_up 字段。

      - outcome: "发现确凿反例"
        description: "经深度调查确认反例成立——满足推论的排除结果条件"
        effect: |
          推论 status 从 verified 降为 contested。
          触发 Rule B 重新审查——作者必须修订推论以容纳反例，
          或限制推论的适用范围，或承认推论被证伪。
          修订后的推论重新走 Rule A → Rule B 流程。

      - outcome: "检验本身质量不足"
        description: "样本量过小、编码不可靠、数据不足以支撑结论"
        effect: "推论状态不变。检验报告标记为 inconclusive。不产生虚假的信心。"

  file_structure:
    location: "L3-deductions/empirical-tests/EMP-TEST-XXX-<deduction-id>.yaml"
    required_fields:
      - id: "EMP-TEST-XXX"
      - target: "被检验的推论 ID"
      - date: "检验日期"
      - type: empirical_test
      - status: "conducted | inconclusive"
      - test_design: "样本选择理由 + 编码方案 + 排除结果"
      - results: "案例数据 + 汇总 + 核心发现"
      - limitations: "样本局限 + 编码歧义 + 定义灰色地带"
      - conclusion: "对推论置信度的影响 + 下一步"
      - created: "日期"

  relationship_to_rule_b:
    conceptual: "审查对抗逻辑，检验对抗经验——两者是同一种对抗式哲学在不同层面的应用"
    practical: |
      经验检验的"反例发现"角色 = Rule B 中审查者"独立寻找反例"的经验版本。
      审查者找的是逻辑反例（推导跳跃、概念混淆、伪完备分类）；
      检验者找的是经验反例（不符合预测的真实案例）。
    sequencing: "Rule B 必须在 Rule C 之前——逻辑上未通过的推论不值得浪费经验数据去检验"

# === 规则 D：推论链的置信度传播 ===

rule_d_deduction_chaining:
  title: "推论可以从其他推论推出——但置信度沿依赖链单调传播，且链必须无环"
  status: canonical
  established: 2026-07-13

  position: |
    Rule A/B/C 处理【单条推论】与其前提(L1×L2)、逻辑、经验的关系。
    Rule D 处理【推论与推论之间】的关系——一条推论把另一条推论当作前提使用。
    这是本体系从"平铺的观察清单"升级为"可垒塔的演绎系统"的机制，
    也是欧几里得式公理系统的核心生成力：定理 5 可以用定理 3，垒成塔。
    但塔越高，根越承重。因此 Rule D 的全部内容就是为"不确定性的继承"
    立三条硬纪律，防止塔变成"根一晃全晃"的纸牌屋。

  two_forms:
    - form: chaining
      name: "串联"
      description: "新推论 DED-B 把 DED-A 当作前提之一使用。"
      example: "DED-001(深度天花板) → 疆域扩张必然触发某种行政分层适应。"
    - form: composite
      name: "交互"
      description: "新推论描述两条(或多条)推论【相遇时】才出现的结果——单看任一条都推不出。"
      example: "DED-001 的深度天花板 × DED-002 的规范成文化门槛 → 挤出哪种适应。"
      note: "交互型是 Rule D 最有价值的产出：新知识来自组合本身，而非任一前提。"

  layering_reconciliation: |
    DED→DED 不违背分层原则。宪法禁止的是【循环依赖】与【下层依赖上层】，
    不是【层内的有向无环推导秩序】。L1 层内部早已如此——
    THEOREM-hierarchy-depth-limit 依赖 AXIOM-002，两者同为 L1。
    L3 层内部同样允许一个"推论→推论"的有向无环子图(DAG)。
    合法：一条永不回头的箭头链。违规：任何环，或箭头指回 L2/L1 之下。

  disciplines:
    - id: acyclic
      rule: "推论依赖必须无环。DED-A 依赖 DED-B 时，DED-B 不得直接或间接依赖 DED-A。"
      why: "环意味着循环论证——A 靠 B 成立、B 又靠 A 成立，整条链没有独立地基。"
      enforcement: "depends_on 增加 deductions 键；validate.py 的环检测必须覆盖 deduction→deduction 边(现仅覆盖 THEOREM-)。"

    - id: confidence_floor
      rule: "一条推论的状态不得高于它【最弱的推论前提】。取下限，不取上限。"
      table:
        - "父全部 verified → 子最高可 verified"
        - "父含 verified* → 子最高 verified*"
        - "父含 contested/rejected → 子退回 candidate，不得 verified"
      propagation: |
        父状态降级时，其所有(直接与间接)后代自动打旗、强制重审——
        不因'曾经 verified'而豁免。这正是 DED-001 布干达险情的教训：
        若当时已有推论挂在 DED-001 下，那面假警报会连累整条链跟着降级。
      why: "结论不可能比它最弱的前提更可信。这是演绎的基本约束，不是保守。"

    - id: independent_anchor
      rule: "派生推论仍须尽量提供【自己的】real_world_anchors / 经验检验，不得【只】靠父推论撑重。"
      why: |
        这是控制脆弱性的命根子。若子推论有独立经验锚，父推论万一被证伪，
        子推论未必跟着倒——它自己还承一部分重。让每层塔砖自己也承重，
        塔才不是纸牌屋。无独立锚的派生推论【必须诚实标记】"置信度完全继承
        自父"，使其脆弱性对读者可见。

  provenance_rule:
    rule: "depends_on 必须区分【基础前提】(axioms/theorems/bridging = L1×L2)与【派生前提】(deductions = L3)。"
    why: "让'这条推论有多少重量压在其他推论上'一眼可见——纯 L1×L2 锚定的推论最稳，依赖越多 L3 前提越脆。"

  status_semantics:
    foundational_deduction: "只依赖 L1×L2、无 deductions 前提的推论(现有 DED-001/002/003)。地基最稳。"
    derived_deduction: "有 ≥1 个 deductions 前提的推论。其 status 受 confidence_floor 约束。"

  file_structure_delta:
    depends_on_add: "deductions: [DED-XXX, ...]  # 派生前提；空或缺省 = foundational"
    validator_enforcement:
      status: "已落地 2026-07-13 (scripts/validate.py)。Rule D 三条纪律现由 validator 强制，派生推论门已开。"
      enforced:
        - "check_refs: depends_on 的 ref 检查已覆盖 deductions 与 bridging(此前遗漏)。"
        - "check_circular_deps: 已从'仅 THEOREM- 建图'扩展到覆盖 deduction→deduction 边。"
        - "check_status: 已新增 confidence_floor——子推论 status 不得高于任一父前提允许的上限(rejected 父 → 子上限 candidate)。"
      test: "9 项合成违规样本对抗测试全过(正例捕获 + 反例无误报)。"

  relationship_to_other_rules: |
    Rule D 不是第四个"验证步骤"，而是一条"组合规则"：它规定推论如何合法地
    互相引用。一条 derived deduction 仍要各自走完 Rule A(操作化) → Rule B(审查)
    → Rule C(经验检验)，ICV 仍可横切施加。Rule D 额外叠加的唯一约束是
    confidence_floor 与 acyclic——即它的状态天花板被父推论钳住。

  nontriviality_test:
    title: "交互型(composite)推论的非平凡性检验——逐格判空归属"
    rule: |
      一条交互型推论若声称"两条父推论合起来排除某状态"，必须逐一检验：
      该状态(禁格)的判空是否【需要两条父推论合力】？
      若任一禁格由【单一】父推论即可判空，则该格里另一父推论对应的合取项
      是"闲置白砖"，该格不构成交互型的非平凡内容——是平凡合取。
    enforcement: "交互型推论的 Rule B 审查【必须】派独立审查者做逐格判空归属分析。作者自证不可信(离得太近看不见闲置合取项)。"
    established_by: "ADV-REVIEW-008 (DED-004 的 P2 规避耦合被此检验判定为平凡合取)"

  lesson_from_ded_004:
    case: "DED-004 → P2 规避耦合"
    what_happened: |
      本体系第一条交互型推论 DED-004 自称三重非平凡(P1 共选择 + P2 规避耦合
      + 标度三难)。作者(主循环模型)离得太近，没看出 P2 的两个禁格里"碎片"
      "扁平"是闲置合取项、每格由单一父推论判空。独立子 Agent 在不同上下文做
      逐格分析一眼看穿，P2 被判平凡合取、降为解释性统一。
    lesson: |
      1. Rule D 的反平凡合取护栏【不是摆设】——它拦下了一条作者自我高估
         三分之二的推论。第一条交互型就有 2/3 是伪装的平凡合取。
      2. 印证 ICV 核心诊断：作者自审是"相关错误"，看不见自己盲区；独立源
         (哪怕只是不同上下文的同类模型)能抓到自审抓不到的结构性错误。
      3. 交互型的真伪判据已固化为 nontriviality_test(逐格判空归属)——交互型
         推论尤其必须派独立审查者，作者自证不可信。

# === 独立多模型交叉验证协议 (ICV) — 横切机制，服务 Rule B 与 Rule C ===

independent_cross_verification:
  title: "用不同血统的模型充当部分独立的对抗源"
  status: canonical
  established: 2026-07-13
  established_by: ICV-001

  problem_it_solves: |
    本体系的承重墙是"对抗式验证"（Rule B 的独立寻找反例、Rule C 的
    intercoder reliability）。但在单研究者+单模型执行时，所谓"独立
    审查"退化为自审：审查者与作者共享同一套权重、先验、训练数据——
    错误高度相关，盲区完全重叠。相关的错误无法互相抵消，自审因此
    是"假的承重墙"。ICV 是把假墙变成"部分的、被测量的墙"的机制。

  core_principle: |
    要的是【不相关】，不是【更聪明】。
    一个更笨但血统不同的模型，会漏掉聪明审查者能抓的东西，但它的
    错误与主循环模型【不相关】——而不相关的错误正是集成/投票提升
    可靠性的唯一原理。因此 ICV 只利用外部模型那条主循环没有的性质：
    不同盲区、不同记忆、不知道作者想要什么答案。

  lineage_rule:
    rule: "优先选与主循环模型【不同血统】的模型；同血统模型仅作相关性对照。"
    rationale: |
      同血统模型（如主循环是 deepseek-v4-pro 时的 deepseek-v4-flash）
      与作者错误相关，独立价值低——但可作【对照】：若同血统模型同意
      作者、而异血统模型不同意，则证明分歧来自血统特有的先验。
    example: "ICV-001: 主循环=deepseek-v4-pro；独立源=glm-5.2(智谱)+sensenova-6.7-flash-lite(商汤)；对照=deepseek-v4-flash(同血统)。"

  four_disciplines:
    - id: blind
      rule: "蒙住外部模型：只给操作化定义 + 原始数据，绝不给作者的判定/结论/期望答案。"
      why: "一旦泄露作者的答案，外部模型输出就与作者重新相关，独立性瞬间归零。"
    - id: signal_not_verdict
      rule: "外部模型的输出是【信号】不是【裁决】：它挑战→触发作者去查；它同意→什么都不确认。最终裁决仍归作者。"
      why: "笨模型的裁决是噪声。独立性只保在'举旗'一步，不在'收旗'一步——这个边界必须诚实承认。"
    - id: panel
      rule: "尽量用多个不同血统的模型组成小组，看多方分歧，而非信任单一外部模型。"
      why: "若两个'独立'模型彼此高度一致（见 interpretation），它们可能共享偏见，实际只算一个独立声音。"
    - id: measure_independence
      rule: "必须测量独立性本身：记录外部模型多久捞出一个作者没想到的东西/与作者不一致。"
      why: "让协议自身可证伪。若外部模型几乎从不与作者分歧→它与作者相关、无用，须如实声明；若时常分歧→拿到可量化的独立价值。"

  plugs_into:
    rule_b: "独立挑战源——外部模型盲测'结论是否从前提推出''有没有 X 性质的反例案例'，补充作者自审抓不到的逻辑反例。"
    rule_c: "盲编码第二/第三编码者——外部模型独立编码同一批案例，产出真实的 intercoder reliability (Cohen's κ)，直接攻击'单编码者无信度'这条悬挂标记。"

  interpretation:
    kappa_bands: "Landis-Koch: <0 差, 0-0.20 轻微, 0.21-0.40 尚可, 0.41-0.60 中等, 0.61-0.80 显著, 0.81-1 几近完美。本体系沿用 κ≥0.7 作为'编码协议可操作'的门槛。"
    level_agreement: "序数量（如层级数）用'落入作者区间''±1 内''平均绝对偏差'三项，而非仅精确匹配。"
    externals_agree_more_than_author: |
      关键诊断信号：若多个独立外部模型【彼此】的一致度显著高于它们
      与【作者】的一致度，有两种解读，必须同时摆出、不可只取其一：
      (a) 这些外部模型彼此相关（共享语料/对齐惯例）→ 高度一致是共同
          偏见而非确证，实际只是"一个独立声音"；
      (b) 作者才是异类 → 作者编码带有外部模型都不共享的、作者特有的
          系统性偏差（可能是确认偏误）。
      解读 (b) 是 ICV 最有价值的产出——它是自审绝对产生不了的信号。
    directional_bias: "若外部模型与作者不一致时【方向系统性一致】（如总是编得更高），这是系统性偏差而非随机噪声，须定位到具体案例并追查。但注意：方向偏差既可能是作者的偏差，也可能是外部模型组【共享】的偏差——方向本身不指示谁对，只有证据能裁决（见 lesson_from_icv_001）。"

  lesson_from_icv_001:
    case: "ICV-001 → 布干达"
    what_happened: |
      ICV-001 中两个独立模型都把布干达编为 8（作者编 7），且方向系统性偏高，
      当时倾向解读为"作者有偏低的确认偏误"。但顺着这个旗做一手史学深查后，
      裁定布干达真值 = 6（8 不成立：两模型叠加了平行氏族链或倒投影了殖民
      结构）。真相(6) < 作者(7) < 两模型(8)——作者反而比"独立"模型更接近真相。
    lesson: |
      1. "和作者不一样" ≠ "更正确"。一组相关的更笨模型能一起自信地错。
      2. 外部模型的高度互相一致(κ=0.892)可能是【共享偏见】而非独立确证——
         本例证实了 interpretation 解读(a)、否证了解读(b)。
      3. ICV 的旗可能是假警报，只能【触发调查】、绝不能自行裁决。这正面
         印证 signal_not_verdict 与 measure_independence 两条纪律的必要性。
      4. ICV 的净价值仍成立：它逼我们查了本会被舒服地留作"边界案例"的承重
         案例——但要对它的独立性打更深的折扣（两源可共享同向偏差）。

  honest_ceiling: |
    ICV 不能把承重墙变'真'。真正独立的专家仍是另一回事。ICV 做的是：
    把'0 个独立来源'升级成'N 个部分独立、错误可测量不相关的来源'。
    墙从【假的】变成【部分的、被测量的】——不是变【结实】。
    且裁决仍是作者，独立性只保在'举旗'一步。这个边界写死在协议里。

  tool:
    script: "scripts/blind_coder.py"
    description: "可复用工具：从 ~/.claude/secrets.json 读密钥(不入库)，ping 存活→盲编码→算 κ/一致率/偏差→存原始编码。血统与独立性在 MODELS 表中标注。"
    reusability: "换一批案例/定义即可复用于任何 Rule C 编码任务或 Rule B 盲测。"

  record_structure:
    location: "L3-deductions/cross-verification/ICV-XXX-<target>.yaml"
    required_fields:
      - id: "ICV-XXX"
      - target: "被交叉验证的推论/检验 ID"
      - date
      - type: cross_verification
      - status: "conducted | inconclusive"
      - models_used: "血统 + 独立/对照标注"
      - reliability_results: "κ + 层级一致 + 独立模型互检"
      - material_findings: "外部模型抓到的、指向数据/推论的具体信号"
      - interpretation: "两种解读并陈 + 方向性偏差定位"
      - created

# === 推论文件结构 ===

file_structure:
  required_fields:
    - id: "DED-XXX"
    - type: deduction
    - layer: L3-deductions
    - status: "candidate | verified | verified* | rejected"
    - term: "..."
    - statement: "..."
    - operationalization: "规则 A：关键概念的操作化定义"
    - derivation: "from_l1 + from_l2 + steps"
    - falsifiability: "..."
    - excluded_outcomes: "推论明确排除的结果"
    - real_world_anchors: "supporting + counterexamples + boundary_cases"
    - adversarial_review: "规则 B：审查报告"
    - depends_on: "基础前提(axioms/theorems/bridging=L1×L2) + 派生前提(deductions=L3, Rule D)"
    - domain: "[...]"

# === 与 L1/L2 的关系 ===

layer_comparison:
  L1_axioms: "提出 → negation_test → passes/fails"
  L2_bridging: "提出 → 三来源 IEA 投票 → verified/contested"
  L3_deductions: "提出 → Rule A 操作化(硬门槛) → Rule B 对抗式审查 → candidate/verified/rejected → Rule C 经验检验(可选,verified后) → 置信度上升/contested。推论间可 Rule D 链式推导(置信度取下限、依赖无环)。"

verification_full_chain:
  step_1: "Rule A: 操作化定义 — 硬门槛，不过则无法进入审查"
  step_2: "Rule B: 对抗式审查 — 审查者挑战逻辑+反例，作者回应，裁决 verified/needs_revision/rejected"
  step_3: "Rule C: 经验检验 — verified 后的可选步骤，历史/考古/人类学数据检验真实世界的反例"
  cross_cutting: "ICV 独立多模型交叉验证 — 横切 Rule B/C 的独立源机制，用不同血统模型把'自审(相关错误)'升级为'部分独立(不相关错误)'。不是第 4 步，是承重墙的加固件。"
  composition: "Rule D 推论链 — 不是验证步骤而是组合规则：推论可从推论推出(串联/交互)，但依赖必须无环、状态取父前提下限、派生推论仍尽量自带独立经验锚。"
  philosophy: "Rule B 审查逻辑的内在一致性 → Rule C 检验经验的外在对应。逻辑上无懈可击 ≠ 经验上成立。两者互补构成完整的验证闭环。ICV 则攻击闭环的元问题：验证者自身是否独立。"
