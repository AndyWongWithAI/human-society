  red_flag_findings:
    brick_conclusion: |
      【未命中，与 r1 一致】经 round_1 修复后重验：非平凡内核——TP×INT 正交轴的论证、
      四象限分类、(-TP,+INT) 格的非平凡空格预言、顺时针慢于逆时针的迁移不对称——
      均不在一砖之内：
      - BR-L2-014 确立 TP 跨文化存在（F&F 2004），不说 INT、不说正交、不说四象限、不说迁移。
      - BR-L2-018 确立 TP 随利益占比变化，不说 INT、不说交叉、不说 (-TP,+INT) 格。
      - BR-L2-019 确立 INT 发育窗口+对等性信号断裂→瓦解（P2），不说 TP、不说四象限路径图。
      三砖贡献独立可测驱动量，推论将其组装为 2×2 框架+迁移路径图——合成不在单砖内。
      round_1 的 should⑤（归属精切）已修：derivation.step4 首增【归属声明】，
      明确标注机制来自 BR-L2-019，增量在将其装入 TP×INT 象限迁移路径图。
      归属诚实度与 nontriviality_test 对齐。不判 required。

    nontriviality_cell_check: |
      【通过，与 r1 一致】2×2 TP±×INT± 逐格：
      - (+TP,+INT) —— BR-L2-014 + BR-L2-019 联合预测，平凡。✓自认。
      - (+TP,-INT) —— BR-L2-014 单独预测（TP 不必然伴随 INT），平凡。✓自认。
      - (-TP,-INT) —— 两轴皆无基线，平凡。✓自认。
      - (-TP,+INT) —— 【非平凡】无砖单独预测"无 TP 但 INT 仍存"。
      推论预测此格非空但暂态（向 -TP/-INT 漂移）。可证伪：田野发现该格稳存>1代际→推翻；
      该格始终为空→"存在性"推翻但分类框架可存活（此时非平凡性靠迁移不对称承载）。
      非同义反复。不判 required。
      round_1 修复后定位从"静态分类"转为"迁移动力学"，非平凡性进一步加固——
      稳态中四象限退两象限，真正的增量（迁移不对称）不受此影响。

    measurement_orthogonality: |
      【未重蹈 DED-007，与 r1 一致】两轴测量完全异源：
      - TP：行为经济学博弈实际惩罚金额（Fehr & Fischbacher 2004——真金白银罚陌生人）、
      田野制裁计数、vignette 惩罚意愿评分。测"愿付多少代价罚别人"。
      - INT：匿名/私密合规率（确信无监控+无未来交互）、违规后内疚/羞耻心理生理指标
      （皮电/面肌电）、Kochanska et al. (2002) 承诺遵从行为编码。测"无监控时自己守不守+
      违规后自己难不难受"。
      两轴不共用指标、不从同一数据源反推。无"自变量偷用结果测"的焊死模式。
      primary_suspect 自认的正交性风险（稳态高共现）是实证相关问题非焊死——
      相关性高不等于轴焊死（轴可独立测、仅取值常共变）。不判 required。

    scope_hook_independent_of_result: |
      【不命中，与 r1 一致】excluded_outcomes 三项均由事前可测渠道划界：
      (1) 个体层面道德判断差异——群体 vs 个体 scope 限定，事前可判。
      (2) 规范内容起源——不解释为何特定内容被道德化，合法事前 scope。
      (3) 正式法律系统——基于测量可行性（制度化代理人有职业激励非自发代价，
      混淆 TP 测量），不由"发现反例"后追加。
      排除 (3) 将大量现代规范移出射程——r1 已记 should 级关注，但这不构成 DED-005
      式钩子（钩子不依赖结果开脱）。不判 required。

    criterion_tier_match: |
      【should 级，非 required——轻微命中，与 r1 一致】TP 和 INT 在 operationalization
      中被定义为连续量（TP=惩罚概率/强度，INT=内化程度），但分类判据二分为 TP±×INT±。
      ± 的切割点仍未操作化——TP 多大算 +？INT 多大算 +？
      严重程度远轻于 DED-006：核心预测（迁移不对称、(-TP,+INT) 暂态）不依赖精确切割点——
      只要 TP 和 INT 各自存在高低两区，预测即成立。行为签名段给出的连续量可替代硬二分。
      建议在 operationalization.limitations 中标注切割点的操作化策略（中位数 split /
      latent profile analysis + 敏感性分析）。不判 required。

    anti_talisman_cashed: |
      【兑现，优于 r1 后更完整】三承重锚独立测出驱动量：
      - BR-L2-014 的 Fehr & Fischbacher (2004)：被试付真金白银罚陌生人，与被试如何定义
      "道德"无关。✓ 独立测出 TP。
      - BR-L2-019 的 Kochanska et al. (2002)：编码者仅看儿童在被监控/不被监控时是否遵守
      规则，不参考"该规则在当地是道德还是习俗"的外部标签。✓ 独立测出 INT。
      - anti_talisman_clause 明文：(i) TP 按博弈金额+制裁计数测，不需道德/习俗标签；
      (ii) INT 按匿名合规+心理生理指标测，不依赖 Turiel 判据；(iii) 禁由"已被归为道德"
      反推"必有 TP+INT"。
      round_1 should④ 补全后防线更完整——不仅测量时不看标签，抽样时也不看标签
      （内容领域分层盲抽+预注册）。全链路 anti-talisman 在位。不判 required。

    anchor_fact_check: |
      【无致命事实错，与 r1 一致】逐锚重验：
      - Fehr & Gächter (2002)：公共品博弈有惩罚→合作率高，惩罚移除→合作率迅速下降。
      文献真实、多实验室复现。实验室→真实社群的生态效度 gap ——r1 记了 minor should，
      本论同意：映射方向正确（(+TP,-INT) 格的微观基础），但 gap 应诚实标注。
      - 饮食禁忌跨文化分化：round_1 should② 已将 conf 从 moderate 降为 anecdotal，
      标注 "仅 illustrative，不承 evidence burden"。犹太/伊斯兰=(+TP,+INT)，
      印度教个人素食=(-TP,+INT) 的印象式举证大致属实，但无系统 TP/INT 编码支撑。
      r1 建议增补其他候选领域锚——作者拒绝（理由合理：堆逸事不加固证据）。
      本论裁决：拒绝成立，不构成新缺陷。
      - 礼貌规范候选反例：推论将其归为 (-TP,-INT) 基线格、不构成挑战。但此归类
      值得商榷——在许多文化中，违反礼貌确实触发第三方反应（侧目/闲话/社交疏远=
      TP 的轻度形式）且违规者感到尴尬/丢脸（INT 的轻度形式）。推论一概归入 (-TP,-INT)
      过于草率。不构成事实错（可视作轻度 TP/INT 未跨越分类阈值），但分类边界
      的武断性再次指向切割点操作化的必要性。非致命。
      无致命事实错 ⇒ 不判 required。

    definition_vs_prediction: |
      【已修复，不命中】round_1 should③ 识别了定义-预测滑移——statement 首段的
      "规范是道德还是习俗取决于 TP 和 INT" 可被读作定义式（道德 ≡ 有 TP+INT）
      或预测式（独立判定的道德规范实测有高 TP+INT）。
      作者选了读法 B（经验竞争立场），在 statement 首段明确声明："以 Turiel 社会领域
      理论的伤害/权利/正义判据作为道德的独立辨认标准——即'一个规范是否为道德规范'
      由 Turiel 判据独立判定，不依赖 TP/INT 的测量值；推论预测：被 Turiel 判据判定
      为道德领域的规范，在结构测量中平均具有更高的 TP 和 INT——而非以 TP/INT 定义道德。"
      此修改使核心陈述从"可能是同义反复"升级为"可被数据反驳的经验主张"。
      证伪路径明确：若 Turiel-道德规范的 TP/INT 与 Turiel-习俗规范无显著差异→预测推翻。
      滑移已消除 ⇒ 不判 required。

    enumeration_and_species: |
      【不命中——非枚举型，2×2 结构性交叉穷举】TP±×INT± 四格由判据本身定义，
      非"相关但不等价的表征"。与 DED-008 的枚举穷举漏洞性质不同。
      按 DED-008 精神主动猎"第 N+1 象限"：
      (a) TP 和 INT 若各需三档（高/中/低/零）→ 3×3=9 格可能性。
      但关键预测不依赖 ± 的精确边界，扩档不推翻核心逻辑。
      (b) 是否漏了第三个正交维度？候选：规范的"神圣性/世俗性"维度（Shweder 三伦理）。
      但神圣性通常与高 TP+高 INT 共现，非独立第三轴。若未来实证发现高神圣性但
      低 TP 低 INT 的规范（私人宗教禁忌），可能是第三轴——但这在当前框架内是
      合法的未来扩展，非当前缺陷。
      本论额外探一种可能的第三轴："规范的普遍性 scope"——有些规范仅在群内适用
      （对内 (+TP,+INT)，对外 (-TP,-INT)），这种"scope 依赖"可能构成第三维度。
      但 scope 不是规范本身的结构属性，而是规范适用范围的情境参数——TP/INT
      的测量本身已可按情境分层（群内 vs 群外），故不构成漏掉的独立轴。
      不判 required。

    primary_suspect_aim: |
      【指对了，round_1 隐腿已补但存一条残尾——should 级】
      文件自认三 suspect 排序诚实、方向正确：
      - primary：TP 与 INT 的正交性（r>.90→骨架坍塌）。这是推论最脆弱的腿。
      - secondary：迁移路径不对称（INT 建/溃速度无差异→预测推翻，但分类框架存活）。
      - tertiary（r1 新增）：定位偏差的平凡化风险——稳态退两象限后用户可能误用
      推论为静态分类工具并得出"就跟常识一样"。
      三 suspect 排序诚实 ⇒ 不判 required。

      本论增识一条 round_1 未覆盖的弱腿（非 required，should 级观察）：
      【因果独立 vs 因果差异的表述张弛】当前文本声称 TP 和 INT"由不同的因果机制驱动，
      不存在锁定关系"——这正确且由 BR-L2-018 和 BR-L2-019 支撑。但迁移路径预测
      暗含一个更强的假定：INT 瓦解是【因为 TP 消退导致对等性信号断裂】
      （BR-L2-019 P2 的机制），而非【INT 与 TP 因共享远端触发因子（如社群崩解）
      同时衰减】。若是后者——社群崩解同时触发 TP 消退和 INT 瓦解——则观察到的
      迁移序列不是 TP→INT 的因果链，而是共享第三因子的并发效应。此时顺时针慢于
      逆时针的预测需要重新标定（"慢"可能来自 INT 的多步瓦解过程本身，而非
      TP 先退→INT 后退的因果序列）。当前文本未讨论此替代解释及其检验方法。
      这是可修补的——在 falsifiability(c) 或 limitations 中增一段讨论"
      TP-INT 共享远端触发因子的替代解释及如何通过时序测量区分（先测 TP 消退启动
      时间 vs INT 瓦解启动时间——若二者同时启动，则支持共享触发因子；若 TP 先退、
      INT 后瓦解，则支持因果链）"。不阻断 verified——这不改变核心预测（不对称速度），
      只影响预测的因果解释。记 should。

  counterexample_hunt: |
    主动构造 falsifiability(a)(b)(c) 的靶子，刻意攻核心预测的三重难：

    【击一：攻 (-TP,+INT) 暂态预测——找跨世纪稳定的 (-TP,+INT) 规范】
    候选：大乘佛教素食主义的个人道德坚守。某些汉传佛教在家信徒严格素食，
    内心坚信杀生食肉是道德错误（INT——私密情境下仍遵守，食肉后自发内疚），
    但明确不强制他人素食、不惩罚食肉者（TP≈0——"个人修行，不干涉他人"）。
    此模式在汉传佛教传统中已稳定存续超过一千年，远逾"暂态"的任一台理时间尺度。
    若被独立编码为 (-TP,+INT) 且稳定跨数十代际→推翻"暂态"预测。

    推论可消化路径：(a) 佛教素食并非真正无 TP——寺院戒律对僧人有明确制裁
    （逐出僧团），在家信徒虽不受此制裁但对僧团有尊崇和模仿（间接 TP——
    僧团的规范执行维持了规范的可见性）；(b) 佛教素食的内化可能不是独立于 TP
    而存在的——历史上的僧团制裁（TP）持续为规范的代际传递提供了"对等性信号"，
    在家信徒虽不直接受制裁，但通过观察僧团执法间接接收了信号；
    (c) INT 的概念边界——佛教素食的"内疚"是对杀生本身的共情（对动物的慈悲），
    此情感可能不完全等同于推论定义的"违规后自发内疚"（后者通常指向违反社群共享规范）。
    三条消化路径均合法——但每条都在收窄理论的有效射程（(a) 重新定义了 TP 的
    形态——间接/观察到的 TP 也算 TP；(b) 将 TP 的载体从"直接旁观者"扩展为
    "规范执行的社会可见性"；(c) 引入了 INT 的内容类型区分）。

    此击未净杀——推论的消化机制有效——但暴露：(i) TP 的操作化需要区分
    "直接 TP"和"观察到的 TP"（通过观察他人被制裁而维持的规范知觉）；
    (ii) (-TP,+INT) 稳态存续案例的存在暗示：INT 可能有独立于持续 TP 的代际
    传递机制（如父母→子女的价值传递、文本/教义的规范保存），推论当前的
    "TP 消退→INT 瓦解"机制未能覆盖这种垂直传递渠道。

    【击二：攻内容独立性——找内容领域锁定结构类型的系统证据】
    候选：杀戮/致命暴力规范。跨文化普查显示，在所有已知人类社会中，社群内部
    无故杀人的规范均为 (+TP,+INT)——既强烈内化（绝大多数成员不会无故杀人且
    想象杀人会自发感到恐惧/内疚），又强烈第三方执行（杀人者面临社群最严厉的
    制裁，包括放逐和死刑）。不存在任何一个已知社会将社群内部无故杀人仅视为
    习俗（(-TP,-INT)）或个人选择领域。如果内容（行为导致的伤害严重程度）确实
    系统性地限制了规范可落入的象限——伤害越严重，规范越不可能落入低 TP 或
    低 INT 格——则"内容独立性"的主张需要收窄为"内容不完全锁定结构类型",
    而非"不由内容锁定"。

    推论可消化路径：(a) 理论不声称所有内容领域在所有象限均匀分布——只声称
    同一内容领域在不同文化/时期可落入不同象限（即内容不【唯一决定】结构类型，
    而非内容【完全无关】结构类型）。杀戮规范在所有社会中的 (+TP,+INT) 一致
    性反映的是内容对结构类型的【概率约束】而非【决定性锁定】——约束越强，
    分布的方差越小，但只要存在跨文化变异（如某些社会对杀外邦人的规范落入
    不同象限），内容独立性就成立。(b) 推论的 discriminant_validity 已明示此意：
    "同一行为领域（如伤害）可以同时存在高 TP 低 INT 和高 TP 高 INT 的规范"——
    是在同一领域【内】找分化，而非声称所有象限在所有领域均匀分布。

    此击未净杀——推论的消化合法——但暴露"内容独立性"的措辞（"不由内容锁定"）
    强于推论实际需要的逻辑（"内容不唯一决定结构类型"）。建议在 discriminant_
    validity 段将"不由内容锁定"收窄为"不由内容唯一决定"，更精确反映理论逻辑。

    【击三：攻顺时针多步迁移——环境道德化跳过 (+TP,-INT) 中间态】
    2015-2025 年环境规范的快速道德化（塑料/碳足迹）：大量城市中产从
    "(-TP,-INT)——不关心塑料袋"直接跳至"(+TP,+INT)——既内疚用塑料袋又
    评判他人用塑料袋"。十年以内的时间跨度似跳过了 (+TP,-INT) 中间态——
    TP 和 INT 几乎同时上升。顺时针路径预测：习俗→外部执行→完全道德，
    后一步（外部执行→完全道德）需要发育窗口因而慢——但实测仅十年。

    推论可消化路径：(a) INT 的发育窗口条件（BR-L2-019）适用于儿童期的
    首次内化，但成人期也可通过"文化学习+社会压力"形成较弱但可测的 INT——
    推论需区分"发育窗口 INT"（强且稳定）和"成人期习得 INT"（弱且可逆）。
    环境道德化的 INT 可能属于后者——若属实，则理论需补充"成人期 INT 的
    形成速度和稳定性参数"。(b) 环境规范的 INT 可能已在社会中潜伏数十年
    （1970s 环境教育+生态焦虑的累积），近年的快速变迁是 TP 终于追上已有 INT，
    即实际迁移路径是 (-TP,+INT)→(+TP,+INT)，属于逆时针方向（快），非顺时针。
    此消化将举证负担移向"需要独立测 2015 年前的环境规范 INT 基线"——
    若基线 INT 确实高，则理论预测成立；若基线 INT 也低，则快速道德化确实
    挑战顺时针多步模型。

    此击未净杀——消化路径均合法——但暴露：(i) 理论需要区分"发育窗口 INT"
    和"成人期习得 INT"，两者的形成速度和瓦解速度可能不同；(ii) 用迁移路径
    解释历史案例时，"当前观察到的迁移方向"高度依赖基线的 TP/INT 测量——
    若基线测量有误，路径归因全盘皆错。

    【猎捕结论：三击均未净杀。推论的防护体系完整——消化机制（概念精化/scope
    限缩/区分测量）均合法但不免费：每次消化都在增加操作化复杂度或收窄射程。
    推论的可证伪核心（r>.90→单轴；(−TP,+INT) 稳存>1 代际→暂态推翻；
    迁移速度无方向差异→不对称推翻）保持完整且可独立测试。无 scope 内活反例漏网。】

  non_recurrence_of_ded004_007: |
    DED-004（不可证伪循环）：【未复发，比 r1 更坚固】
    falsifiability 三条条件自 r1 以来未变：
    (a) 跨文化独立测 TP 和 INT→r>.90 (p<.01)→两轴退化为单轴→骨架坍塌。
    (b) (-TP,+INT) 规范在无 TP 维护下稳定存续>1 代际→暂态推翻。
    (c) 迁移速度在任何方向均无系统性差异 (p>.05)→路径不对称推翻。
    三条均可由独立于结果的测量检验、非同义反复。anti-talisman_clause 禁反推，
    全链路（抽样→测量→判定）不依赖道德/习俗预标签。
    round_1 的"事后开脱活门"排查复验：
    - (-TP,+INT) 格的双逃生口（空→框架存活，稳定→靠迁移不对称）在 r1 已被确认
    为"多腿支撑"而非免疫条款——因为单条证伪路径（迁移不对称被推翻）仍能杀死框架。
    - excluded_outcomes(3) 基于测量可行性，不由反例追加。无新增活门。
    DED-004 式"所有可证伪点都被事后解释消化"的错误模式未出现 ⇒ 未复发。

    DED-007（焊死测量轴）：【未复发，与 r1 一致】
    TP 与 INT 测量完全异源（行为经济学博弈+田野制裁计数 vs 发展心理学纵向观察+
    心理生理指标）。两轴不共用指标、不自同一数据源反推。anti-talisman_clause
    双向禁由结果反推动量。无"分母用实际获授者"或"自变量偷用结果测"的焊死模式。
    primary_suspect 自认的正交性风险是实证相关非焊死 ⇒ 未复发。

