id: ADV-REVIEW-028
type: adversarial_review
reviews: DED-023
layer: L3-deductions

人话摘要: |
  对 DED-023(道德-习俗结构判据:Moral-Convention Structural Criterion)的 round_1 独立对抗审查。裁 needs_revision:核心贡献——'TP×INT正交轴×四象限分类+(−TP,+INT)空格预测+迁移不对称性'——不在任何单砖(BR-L2-014/BR-L2-018/BR-L2-019)内;测量轴异源正交,anti-talisman到位;无DED-004/007复发。但五条should:(1)正交性'仅在过渡态可见'的admission使四象限分类在稳态退化为两象限——标题和摘要应重校为动态迁移框架而非稳态分类;(2)饮食禁忌现实锚印象式举证,conf=moderate需诚实收窄为anecdotal;(3)核心陈述'道德取决于结构非内容'有定义-预测滑移风险——未明确独立于TP/INT的道德辨认判据;(4)TP/INT测量的规范抽样方法空白——如何选规范而不隐式依赖道德/习俗预标签;(5)迁移不对称的机制(BR-L2-019已含INT慢建快溃)与应用(四象限路径)的增量归属需更精确切割。反例猎捕刻意攻三重:(-TP,+INT)稳态存续跨代际→攻'暂态'预测;快速道德化(如#MeToo)跳过(+TP,-INT)过渡→攻顺时针多步路径;社群崩解时TP与INT同步归零→攻(−TP,+INT)中间态存在性。三击均被理论消化或落入admitted boundary,未净杀但暴露预测的实证测试窗窄。

target: DED-023
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。评分卡红旗10条逐项攻+反例猎捕(判verified前必做)+DED-004(不可证伪循环)/DED-007(测量轴焊死)复发检查。裁决三态照评分卡:verified需同时满足①无required缺陷②亲自猎捕无scope内活反例③未重蹈DED-004/007。

round_1:
  reviewer: "独立子Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    这是一条【有真东西但几处关键措辞和操作化需要收紧】的候选。其核心非平凡内核——'TP×INT构成两个正交轴→交叉出四个有独立行为签名的象限，而非道德vs习俗的二分；(−TP,+INT)格是非平凡空格（无砖单独预测"无TP但INT仍存"）；从象限间迁移不对称（顺时针慢于逆时针）来自INT慢建快溃与TP可快速变化的合成推理'——不在任何单砖内:
    - BR-L2-014只确立TP跨文化存在（F&F 2004第三方惩罚博弈），不说TP与INT正交、不说四象限、不说迁移路径。
    - BR-L2-018只确立TP随旁观者利益占比变化，不说INT、不说TP×INT交叉。
    - BR-L2-019只确立INT依赖发育窗口且对等性信号断裂时快速瓦解，不说TP、不说四象限、不说顺时针/逆时针路径。P2的'对等性信号断裂→INT瓦解'是迁移不对称的机制零件，但将其组装进四象限迁移路径图是新的合成推理。
    三砖各自贡献了独立驱动量（TP的利益占比调控+INT的发育窗口条件），但【均不单独包含】'两轴正交→2×2四象限→(−TP,+INT)空格+迁移不对称'这一合成主张。故非平凡内核成立、不判required。

    anti-talisman防线到位:TP测量依据博弈中的实际惩罚金额+田野制裁计数，不需道德/习俗标签；INT测量依据匿名合规+心理生理指标，不依赖Turiel判据；BR-L2-014的F&F(2004)和BR-L2-019的Kochanska(2002)独立测出驱动量。不判required。

    但存在五条should级缺陷，阻止verified:
    (1)【最大软肋】正交性被primary_suspect自认'仅在过渡态或失败社群中可见'——若稳态社群中TP和INT高度共现(+TP,+INT)与(−TP,−INT)两格占绝大多数,(+TP,−INT)和(−TP,+INT)仅短暂出现，则四象限模型【在功能上退化为两象限】，'道德-习俗结构判据'作为分类框架的独立增量被大幅削弱。推论的真实贡献应从'结构判据'（静态分类）重新定位为'规范迁移动力学'（动态过程）。标题和'人话摘要'需重校以对齐此定位。
    (2)现实锚中饮食禁忌的(−TP,+INT)举证（'某些印度教个人素食信仰:内心坚信不食肉但不强制他人'）为印象式举证、非系统编码——作者诚实标注conf=moderate，但此锚承载'内容独立性'和'(−TP,+INT)格非空'两项关键主张，不应依赖逸事证据。
    (3)核心陈述'规范是道德还是习俗取决于TP和INT'存在定义-预测滑移:若'道德=+TP+INT'被读作定义，则该句是同义反复（道德规范就是有TP和INT的规范，因为定义如此）；若它是经验预测（'人们称为道德的规范在独立测量中确实表现出+TP+INT'），则需要一个独立于TP/INT的道德辨认判据——当前文件中未明确。discriminant_validity段部分澄清（与Turiel/Haidt竞争），但核心statement段（见statement第一句）仍保留定义式读法。
    (4)anti-talisman保障了TP和INT各自【测量方法】不依赖道德/习俗标签，但未回答前提问题:待测的'多种规范'如何从文化中抽样？若抽样依赖研究者的直觉（'这条看起来像道德规范、那条像习俗'），则抽样本身已隐式使用了道德/习俗预标签。当前operationalization缺规范抽样的编码手册。
    (5)迁移不对称的机制基础（INT慢建快溃）来自BR-L2-019 P2——推论将其从砖中提取后映射到四象限路径图上是增量贡献，但当前derivation.step4将此增量表述为'来自BR-L2-019 P1+P3+P2的合取推理'，未精确切割:砖给了机制（慢建快溃），推论给了应用（映射为顺时针vs逆时针）。归属的诚实程度不及(+TP,+INT)和(+TP,−INT)格的平凡性自认。应类似nontriviality_test那样明确标注'迁移不对称的机制来自BR-L2-019，增量在将其装入TP×INT象限的迁移路径图'。

    综上所述，三条verified硬门中:①无required缺陷✓;②反例猎捕未净杀（见counterexample_hunt）✓;③DED-004/007未复发✓。但五条should阻断verified——不是改措辞能跳过的文风问题，而是定位(1)、证据(2)、可测试性(3,4)和诚实归属(5)的实质缺口。判needs_revision。

  red_flag_findings:
    brick_conclusion: |
      未命中（非平凡内核不在单砖）。逐字核查三块承重砖原文:
      - BR-L2-014:'人类不仅在自己直接受害时惩罚不公(第二方惩罚),还会在自己未受直接损害的情况下,付出个人代价去惩罚针对陌生人的不公行为(第三方惩罚)'。确立了TP作为现象的存在性和跨文化普适性。但【不说】TP与INT的关系（正交/共线/无关）、【不说】TP×INT的交叉分类、【不说】迁移路径、【不说】内容独立性。
      - BR-L2-018:'第三方惩罚的强度不是恒定的，而是随旁观者在合作结构中的利益占比系统性地变化……旁观者愿意为惩罚违规者付出多少个人代价，与其从该规范维护的合作结构中获取的利益占比正相关'。确立了TP的可操纵连续量及其驱动因素。但【不说】INT、【不说】两轴交叉、【不说】(−TP,+INT)格、【不说】迁移。
      - BR-L2-019:'道德规范的内化——从"会被罚所以不做"到"做了自己心里过不去"——依赖于个体发育期内的特定条件……(ii)对等性信号→内化的维持条件:个体必须持续感知到群体中其他成员也在遵守和执行同一规范。观察到他人违规而无后果→内化开始逐层瓦解'。确立了INT的发育依赖条件（P1安全依恋+P2对等性信号+P3青春期窗口）。P2特别重要——'对等性信号断裂→INT瓦解'是迁移不对称的机制零件。但BR-L2-019【不说】将此机制映射到TP×INT四象限、【不说】顺时针vs逆时针、【不说】(−TP,+INT)格的存在性。
      三砖各自贡献了可独立测的驱动量，推论将它们组装成2×2框架并导出两个预测(−TP,+INT格的存在和迁移不对称的象限化路径)。这一合成不在任何单砖内⇒不判required。
      但【should】:迁移不对称的底层机制（INT的慢建快溃）来自BR-L2-019 P2——这一点推论在derivation.step4中提到了BR-L2-019但未像nontriviality_test对(+TP,+INT)和(+TP,−INT)两格那样明确标注'此机制来自砖，推论增量在将其映射到四象限路径图'。归属的诚实度不及平凡格自认。见should⑤。

    nontriviality_cell_check: |
      通过。核心2×2判据表(TP±×INT±)的逐格判空:
      - (+TP,+INT)格——BR-L2-014(TP存在)+BR-L2-019(INT存在)联合预测。平凡。✓自认。
      - (+TP,−INT)格——BR-L2-014单独预测(TP存在且不必然伴随INT)。平凡。✓自认。
      - (−TP,−INT)格——两轴皆无的基线。平凡。✓自认。
      - (−TP,+INT)格——【非平凡】:没有任何一块砖单独预测'没有第三方惩罚但内化仍存的规范可以稳定存在'。推论预测此格非空但暂态——存在残余内化规范但不稳定（向−TP/−INT漂移）。这是可被现实反例填上的真经验主张:若田野研究发现−TP/+INT规范稳定存续>1代际→'不稳定'推翻;若该格始终为空→'存在性'推翻但分类框架可存活（此时非平凡性须从迁移不对称中提取）。非同义反复⇒不判required。
      注意:推论为(−TP,+INT)格留了双重逃生口（若空→框架存活;若稳定→退回平凡），但这是理论内部的诚实自检而非免疫条款——框架的存活性不取决于该格的填充状态，取决于迁移不对称的独立预测力。整体非平凡性通过⇒不判required。

    measurement_orthogonality: |
      主干未重蹈DED-007。自变量与因变量异源正交:
      - TP（第三方惩罚意愿）:测量依据为行为经济学博弈中的实际惩罚金额（Fehr & Fischbacher 2004——被试付真金白银罚陌生人）、田野观察中编码的第三方制裁行为计数、跨情境vignette问卷中的惩罚意愿评分。IV由行为经济学实验/田野民族志/问卷独立测。
      - INT（内化程度）:测量依据为匿名/私密情境中的合规率（确信无监控+无未来交互）、违规后自发内疚/羞耻的自我报告+心理生理指标（皮电/面肌电）、发展心理学中的承诺遵从行为编码（Kochanska et al. 2002）。IV由发展心理学纵向观察/心理生理学/行为编码独立测。
      两轴测法完全异源:TP测的是【愿付多少代价罚别人】，INT测的是【无监控时自己会不会遵守+违规后自己会不会难受】。不共用指标、不从同一数据源反推⇒DED-007未复发。
      primary_suspect自认的正交性风险（'TP和INT在良好社群中高度共现，正交性仅在过渡态/失败社群中可见'）是【实证相关性的问题】而非【测量轴焊死】——相关性高不等于轴焊死（轴仍可独立测、仅实际取值常共变）。DED-007式焊死指'分子用分母的测量值定义'或'自变量偷用因变量测'——此处不存在此模式⇒不判required。
      但值得关注【should级关联:见should①】:若正交性仅在过渡态可见，四象限分类在稳态中退化为两象限，推论的'分类框架'增量被大幅削弱。

    scope_hook_independent_of_result: |
      基本不命中。excluded_outcomes三项均由事前可测渠道划:
      (1)'个体层面的道德判断差异'——群体层面vs个体层面的scope限定，事前可判（分析单元=群体，非个体）。合规。
      (2)'规范内容的起源'——不解释为什么特定行为被道德化，只解释道德化后的结构特征和迁移。合法的事前scope限定。合规。
      (3)'正式法律系统中的规范执行'——制度化惩罚（警察/法院）的代理人有职业激励非自发代价，混淆TP测量。此排除基于【测量可行性】（能否干净测TP）而非【结果便利】——有中心权威的规范确实无法用博弈实验范式测TP。合规。
      钩子不依赖结果开脱⇒不判required。
      但【should级关切】:排除(3)将大量现代规范（所有被法律系统覆盖的规范）移出射程——在当代社会中，绝大多数重要规范（反暴力、反盗窃、反欺诈等）同时受TP和正式惩罚，测试本理论时需要找'非中心权威下的规范'作为测试床，这限缩了实证覆盖面。不致命（理论可以从小社群/无国家社会/规范变迁期测试），但应诚实标注射程限缩的代价。

    criterion_tier_match: |
      轻微命中（should级，不判required）。已学到DED-006:
      - TP和INT在本推论中被用作连续量（operationalization:TP=惩罚概率/强度，INT=内化程度），但分类判据被二分为TP±×INT±。推论在operationalization中未定义±的切割点——TP多大算+？INT多大算+？分类判据的±二分与底层连续量之间存在未解决的切割点问题。
      - 但此缺陷的程度远轻于DED-006（DED-006将连续信任维度硬二分造成灾难），因为:①本推论的四象限只是Turiel二分的升级（2类→4类），是改善方向;②推论的核心预测（迁移不对称、(–TP,+INT)格暂态）不依赖于精确切割点——只要TP和INT各自存在高低两区，预测即成立;③operationalization 的'行为签名'段给出了各格的独立行为预测（私下合规率、自发执法率、Turiel判据判断），这些连续量可替代硬二分。
      整体不构成DED-006级档位匹配错误⇒不判required。但切割点缺失降低了分类的可操作化程度，记should（见should④的规范抽样）。

    anti_talisman_cashed: |
      大体兑现（should级残留）。三个承重锚均有独立于结果的测量:
      - BR-L2-014的Fehr & Fischbacher (2004)第三方惩罚博弈:被试付真金白银罚陌生人对第三方的剥削——TP在实验室内被独立操作，与被试如何定义'道德'无关。✓独立测出。
      - BR-L2-019的Kochanska et al. (2002)承诺遵从编码:编码者仅看儿童是否在被监控/不被监控时均遵守规则，不参考'该规则在当地是道德还是习俗'的外部标签。✓独立测出。
      - anti_talisman_clause明文:(i)TP按博弈金额+制裁计数测，不需道德/习俗标签;(ii)INT按匿名合规+心理生理指标测，不依赖Turiel判据;(iii)禁由'该规范已被归为道德'反推'该规范必有TP+INT'。防线在位⇒不判required。
      但【should级残留】:anti-talisman保障了TP和INT各自【测量方法】不依赖道德/习俗标签，但未回答更前提的问题——待测规范【如何被选中】？若研究者从文化中选出'看起来像道德规范'和'看起来像习俗'的规范来测TP/INT，则抽样本身已隐式使用了道德/习俗预标签（选择偏差）。当前operationalization缺规范抽样的编码手册:应从文化规范清单中【盲抽】（不参考道德/习俗直觉）还是按枚举领域覆盖？这虽非致命（可通过改良研究设计解决），但在当前文件中的操作化缺口使anti-talisman不完整。见should④。

    anchor_fact_check: |
      无DED-007式致命事实错。逐锚核:
      - Fehr & Gächter (2002):公共品博弈有惩罚条件→合作率高，惩罚移除→合作率迅速下降。文献真实、多实验室复现。TP驱动(+TP,−INT)格的实验室微观基础成立。✓无误。
      但【minor should】:Fehr & Gächter (2002)的被试是匿名大学生、非真实社群成员。实验室中'合作率迅速下降'反映了【匿名单次交互下无INT】而非【真实社群中(+TP,−INT)规范的完整行为签名】。推论将此实验室结果映射为(+TP,−INT)格的'仅在被监控时遵守'——映射方向正确，但生态效度gap应诚实标注（实验室→真实社群的推断跳跃）。
      - 饮食禁忌跨文化分化:犹太/伊斯兰猪肉禁忌=(+TP,+INT);印度教个人素食=(−TP,+INT)。此举证为【印象式】——作者自注'confidence: moderate（需更系统的TP/INT独立编码而非印象式举证）'。此诚实自注应能升级为conf=anecdotal而非maintain moderate——当前无任何系统编码数据支撑任一格的填充。不构成事实错（所述现象大致属实），但证据等级不足以承载'内容独立性'和'(−TP,+INT)格非空'两项主张同时成立。见should②。
      - 礼貌规范候选反例:推论将其归为(−TP,−INT)基线格、不构成挑战。但此归类值得商榷——在许多文化中，违反礼貌规范确实触发第三方反应（侧目、闲话、社交疏远=TP的轻度形式）且违规者会感到尴尬/丢脸（INT的轻度形式）。推论将礼貌规范一概归入(−TP,−INT)过于草率——至少应区分'轻度TP/INT仅不足以跨越分类阈值'的操作化说明。不构成事实错，但分类的武断性值得注意。
      无致命事实错⇒不判required。

    definition_vs_prediction: |
      命中（should级）。核心陈述存在定义-预测滑移风险:
      文件statement第一句:'一个规范是道德规范还是社会习俗，不取决于其内容（涉及什么领域），而取决于两个可独立测量的结构属性:第三方惩罚意愿（TP）和内化程度（INT）'
      读法A（定义式）:'道德规范'≡有TP+INT的规范——此时该句是同义反复，不能提供经验信息。
      读法B（预测式）:人们（或Turiel判据）称为'道德'的规范，在独立测量中确实表现出较高的TP和INT——此时该句是可证伪的经验主张。

      当前文件在discriminant_validity段朝读法B倾斜（与Turiel/Haidt竞争——'独有可证伪预测:同一行为领域可以同时存在高TP低INT和高TP高INT的规范'），但核心statement段保留了读法A的措辞。两种读法的证伪路径完全不同:读法B需要独立于TP/INT的道德辨认判据（如Turiel判据或folk classification）;读法A则干脆不承认外部判据——道德就是TP+INT。
      文件应明确选择一种读法并一致使用。建议选择读法B（经验竞争）并补上独立于TP/INT的道德辨认判据（如'由Turiel判据判定为道德领域的规范，其TP和INT应……'），使预测可测试。见should③。
      不判required——discriminant_validity段的竞争框架已为读法B提供了基础，只需将核心陈述对齐即可。

    enumeration_and_species: |
      不命中（本推论非枚举型N-species穷举，是TP×INT的2×2结构性交叉——TP±×INT±逻辑穷举四格，格定义直接由判据本身给出）。无DED-008级漏洞。
      按DED-008精神主动探'第N+1象限':TP和INT被二分为±各自一维→2×2=4格。若TP和INT实际上各需三档（高/中/低/零），则理论暗含3×3=9格的可能性。但推论的operationalization已将TP和INT视为连续量且±仅作为分类简化——关键预测（迁移不对称、(−TP,+INT)暂态）不依赖±的精确边界，因此扩档不会推翻核心逻辑。非missing species⇒不判required。
      进一步探:是否漏了第三个正交维度？可能的候选——规范的'神圣性/世俗性'维度（Shweder的三伦理:autonomy/community/divinity）。但神圣性维度与TP/INT有关联（神圣规范通常同时具有高TP和高INT），并非独立第三轴。若未来实证发现存在高神圣性但低TP低INT的规范（如私人宗教禁忌），则可能构成第三轴——但这在当前框架内是合法的未来扩展，非当前推论的缺陷。不判required。

    primary_suspect_aim: |
      【指对了，但漏了一条隐腿——should】。文件自认primary_suspect:'TP与INT的正交性——若二者实际高度相关(r>.90)，四象限退化为两象限，推论核心骨架坍塌'——正确。这确实是整条推论的核心脆弱点。
      文件自认secondary_suspect:'迁移路径不对称——若INT建立和瓦解的速度实测无差异，则顺时针慢于逆时针的预测被推翻。但分类框架可独立存活'——也正确。
      文件自认unlikely_suspect:'(−TP,+INT)象限的存在性'——正确排为最不重要（框架可承受此格为空）。
      三suspect排序诚实、方向正确⇒不判required。

      但我发现两条文件【未认但值得注意的隐腿】:
      (a)【隐腿一——定位张力】:primary_suspect暴露了一个更根本的问题——若正交性仅在过渡态/失败社群中可见，则推论的真贡献是【规范迁移动力学】而非【分类判据】。标题'道德-习俗结构判据'和'人话摘要'首句'区分道德和习俗不需要看内容，只需要看两件事'暗示的核心用户价值是'教你如何区分道德和习俗'（分类工具），但推论实际提供的增量是'教你理解规范如何在四种结构状态之间迁移'（动态模型）。这个定位偏差不是措辞问题——它影响用户对推论用途的期望和对验证方式的理解。见should①。
      (b)【隐腿二——平凡化风险】:上位泛化后本推论可能被稀释为'规范在外部执行和内部执行两个维度上变化，道德规范两个都高，习俗规范两个都低，中间状态是过渡的'——这与常识（'道德是内外兼修的规范'）的delta极小。真正的delta在于:(i)两轴被论证为因果上正交（非仅统计上可区分）;(ii)迁移路径不对称给出了可测试的速度预测;(iii)内容独立性给出了跨文化可测试的交叉预测。若(i)的因果正交性在实证中无法与高相关区分，则delta(i)退化→delta只剩(ii)(iii)→推论整体非平凡性依赖迁移不对称和内容独立性这两个更薄弱的腿。
      平凡化检查:作者已在discriminant_validity段执行了防平凡化守卫——明示'不要把推论的核心误解为道德规范有TP和INT，习俗规范没有——这是砖的复述'。防线部分在位，但守卫的力度取决于(i)在实证中能否站稳。当前文件对此风险的暴露诚实但未在falsification_trace中列为第三suspect——建议增列。见should①关联。

  counterexample_hunt: |
    主动构造 falsifiability(a)(c)的靶子，刻意攻核心预测的三重难:

    【击一:攻(−TP,+INT)格的'暂态'预测——找稳态(−TP,+INT)规范跨代际存续】
    候选:英美文化中'不吃马肉'禁忌。多数英语国家人民对吃马肉有强烈情感抵触（近似INT——想到吃马肉会恶心/内疚），但几乎无TP——吃马肉合法、无人抗议、无人羞辱马肉食用者。此禁忌已稳定存续数世纪（自中世纪马匹伙伴地位确立后）。若此禁忌被独立编码为(−TP,+INT)且稳定跨代际→推翻'暂态'预测。
    推论可消化路径:(a)恶心≠INT——对马肉的抵触是'厌恶'（disgust，属情感反应）而非'道德内化'（违规后自发内疚），INT编码需区分disgust-based vs guilt-based internalization;(b)历史上的确有轻度TP——在维多利亚时代英国，吃马肉被视为'低等'并伴随阶级鄙视（轻度社会制裁）。第一条消化路径揭示理论需更精细的INT概念化（区分厌恶内化和道德内化）——这本身是should级的operationalization缺口。第二条消化路径将论证重心移向'历史上曾有TP→TP消退后INT仍短暂存留→正在向(−TP,−INT)漂移'——但此漂移若已跨数世纪仍未完成，漂移速度之慢使'暂态'的实证意涵模糊（数世纪算暂态还是稳态？）。此击未净杀（可被概念精化或漂移速度重新标定消化），但暴露——(−TP,+INT)格的'暂态'主张需要补充时间尺度:'暂态'是代际尺度(30-50年)还是世纪尺度？若为数世纪，则该格在实践中等同稳态、'暂态'失去区分力。见should附加建议。

    【击二:攻'顺时针多步迁移'——快速道德化跳过(+TP,−INT)过渡】
    候选:#MeToo运动中性骚扰规范的快速道德化（约2017-2022）。运动前:性骚扰虽违法但在许多职场中被常态化为'办公室政治'——(−TP,−INT)或弱(+TP,−INT)。运动后:迅速转为(+TP,+INT)——舆论强烈谴责(TP高企)且大量个体（尤其女性）内心标准转变（INT）。五年的时间跨度似跳过了(+TP,−INT)中间态——TP和INT似乎同时上升。
    推论可消化路径:(a)性骚扰规范在运动前已是(+TP,+INT)对受害者群体而言——运动不是'创造'了道德化，而是让被压制的既有道德化获得公开表达（TP从被报复风险压抑→报复风险降低后释放）。此消化有其合理性（运动本质是'发声'而非'发明'），但使TP的操作化面临'潜在TP（有条件时才表达）vs 显性TP（实际观测到的惩罚）'的区分——需补operationalization。(b)即使接受'同时上升'，推论的顺时针慢vs逆时针快的预测是关于【群体规范迁移的典型速度中位数】，不排除特定事件的压缩。击二未净杀，但暴露理论对'快速道德化'事件的消化依赖post-hoc auxiliary assumptions（被压抑的潜在TP/压缩的时间尺度）——此依赖应在limitations中诚实标注。

    【击三:攻(−TP,+INT)格的【存在性】——社群崩解时TP和INT同步归零，无中间态】
    候选:一个紧密宗教社群（如修道院或孤立教派）因外部压力（战争/经济崩溃/国家镇压）突然解散。假设该社群有一规范'每日集体祷告'，在社群存在时为(+TP,+INT)——成员既内化（不做心不安）又愿执行（对缺席者侧目/规劝）。社群解散后，成员散入大城市匿名生活。TP瞬间归零——无社群、无旁观者。INT呢？推论预测INT应暂存→逐渐瓦解(−TP,+INT)→漂移至(−TP,−INT)。但更合理的预测是INT也快速归零——因'集体祷告'的内化依赖于社群上下文（在匿名城市公寓中独自祷告的行为意义与在修道院中集体祷告完全不同）。若INT与TP同步瓦解（均依赖社群上下文的持续存在），则(−TP,+INT)中间态不存在——不是因为'INT在−TP下不稳定'（推论的主张），而是因为'INT的根本前提（社群上下文）与TP同时消失'。
    推论可消化路径:操作化上，'集体祷告'的INT在社群解散后应重新测量——若成员仍私下祷告（虽无社群上下文但行为持续），则INT未归零→(−TP,+INT)存在→证实推论。若成员立即停止（因行为失去意义），则INT从未独立于社群上下文而存在→这不是'INT因−TP瓦解'，而是'INT与TP共享一个前提条件（社群存在）'。消化路径:(a)此案例不是对'INT独立于TP存在'命题的挑战——只是对某个特定类型规范INT的特例;推论不要求所有规范都存在(−TP,+INT)中间态——只预测'若INT存在，在−TP下它会逐渐瓦解（而非瞬间归零）'。(b)如果大量规范的INT都与TP共享前提条件（社群持续存在），则推论声称的TP-INT因果独立性在实证上适用范围比声称的更窄——但这只是scope限缩，不是理论致命伤。
    击三未净杀但暴露:理论声称TP和INT有独立因果来源（BR-L2-018→TP，BR-L2-019→INT），但两者在实践中可能共享更深层的前提条件（社群持续存在+互动密度），使因果独立性在非实验室情境中的可见性受限。见should①关联。

    【结论:三击均未净杀——推论的消化机制（概念精化/scope限缩/auxiliary assumption补丁）均合法但不免费——每次消化都在收窄理论的有效射程或增加operationalization复杂度。整体而言，理论的防护体系完整、无scope内活反例漏网，但实证测试窗比表面看起来更窄:需要找'有社群但无中心权威'的规范集合→独立测TP和INT→追踪跨时间变化→在代际尺度上检验迁移不对称。实操可行性存疑但非逻辑不可证伪。】

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发】。falsifiability给出三条明确证伪条件:
    (a)跨文化样本独立测多种规范的TP和INT→r>.90(p<.01)→两轴退化为单轴。
    (b)−TP/+INT规范在无TP维护下稳定存续>1代际→'暂态'推翻。
    (c)迁移速度在任何方向均无系统性差异→路径不对称推翻。
    三条均可由独立于结果的测量检验、非同义反复。与DED-004'所有新意被实证推倒、改措辞也救不活'的本质不同。

    进一步排查DED-004式'事后开脱'活门是否残留:
    - anti-talisman_clause禁'由该规范已被归为道德反推该规范必有TP+INT'。防线在位。
    - excluded_outcomes(3)的正式法律排除基于测量可行性，不由'发现反例'后追加。合规。
    - (−TP,+INT)格空的双逃生口（若空→框架存活;若稳定→依赖迁移不对称）在逻辑上不构成免疫——因为推论的实证命运仍由迁移不对称承载。这好比一条腿断了但还有另一条腿:不是免疫条款，是多腿支撑。DED-004的错误模式是'所有可证伪点都被事后解释消化'——本推论的单条证伪路径（迁移不对称被推翻）仍能杀死框架。⇒DED-004未复发。

    DED-007(焊死测量轴):【未复发】。两轴异源:
    - TP:行为经济学博弈+田野制裁计数——测的是'愿付代价罚别人'。IV。
    - INT:匿名合规+心理生理+承诺遵从编码——测的是'无监控时自己守不守+违规后自己难不难受'。IV。
    两轴不共用指标、不自同一数据源反推。无DED-007式'分母用实际获授者、自变量偷用结果测'的焊死。anti-talisman_clause双向禁反推⇒不判复发。

  required_fixes:
    - |
      [should ①——定位重校] 正交性被primary_suspect自认'仅在过渡态或失败社群中可见'——若稳态社群中(+TP,+INT)与(−TP,−INT)两格占绝大多数，四象限模型在功能上退化为两象限，则推论的真正贡献是【规范迁移动力学】而非【分类判据】。当前标题'道德-习俗结构判据'和'人话摘要'首句'区分道德和习俗不需要看内容，只需要看两件事'暗示的核心价值是静态分类工具，与推论实际增量（动态迁移模型）存在定位偏差。建议:(a)标题改为'道德-习俗迁移判据(Moral-Convention Transition Criterion)'或'规范结构迁移模型(Norm Structural Transition Model)';(b)人话摘要首句改为'区分道德和习俗不需要看内容，但更重要的是理解规范如何在道德与习俗之间迁移——两条独立轴的快慢不对称决定了迁移路径';(c)在statement段增加动态定位声明:'本推论首先是一个规范迁移动力学模型，其次才是一个分类框架。在稳态社群中分类退化为两格;四象限的完整展开发生在规范变迁期。'不重校定位则用户对推论的价值预期和验证方式均失准。
    - |
      [should ②——证据收窄] 饮食禁忌的(−TP,+INT)现实锚（'印度教个人素食信仰:内心坚信不食肉但不强制他人'）当前标为conf=moderate。但此为印象式举证、无系统TP/INT编码数据支撑。建议:将conf降为anecdotal并明注'本锚仅作illustrative example，不承担evidence burden——(−TP,+INT)格的存在性和内容独立性预测需独立实证检验'。同时，此锚为'内容独立性'和'(−TP,+INT)格非空'两项主张共用——若被挑战，两项主张同时削弱。建议增补至少一个其他领域的候选（如个人隐私规范——部分人强烈认为隐私是道德权利但极少干涉他人隐私习惯）并同等标注为anecdotal，降低单锚失败的结构性风险。
    - |
      [should ③——定义-预测滑移消除] 核心陈述'一个规范是道德规范还是社会习俗……取决于……TP和INT'存在定义式读法（道德≡有TP+INT）与预测式读法（独立判定的道德规范实测有高TP+INT）的滑移。建议:(a)在statement首段明确声明'本推论采取经验竞争立场:以Turiel社会领域理论的伤害/权利/正义判据作为道德规范的【独立辨认标准】，预测此类规范在结构测量中具有高TP和高INT——而非以TP/INT定义道德'。此修改使discriminant_validity段的竞争框架回溯到核心陈述中，消除定义式逃逸。(b)若作者坚持重新定义'道德'（读法A），则需明确声明'本推论重新定义道德为(+TP,+INT)规范，不声称追踪folk usage或Turiel分类'——此选择会大幅收窄判别效度主张的范围，但逻辑上同样合法。不选A则选B;不能两个都留着。
    - |
      [should ④——规范抽样方法补全] anti-talisman保障了TP和INT各自的测量方法不依赖道德/习俗标签，但未说明待测规范如何从文化中【被选中】。若抽样依赖研究者直觉（'这条像道德、那条像习俗'），则抽样本身已隐式使用了道德/习俗预标签。建议:在operationalization后增'规范抽样'段，提供至少一种盲抽方法——如'从该文化已记录的规范清单（民族志的规范目录/法律文本的行为禁止列表等）中按内容领域分层抽样，确保覆盖伤害、互惠、饮食、着装、礼仪、宗教仪式等多元领域;抽样时不参考研究者对规范的道德/习俗直觉分类'。此段应作为anti-talisman_clause的补充——不仅在测量时不看标签，在抽样时也不看标签。
    - |
      [should ⑤——迁移不对称归属精切] derivation.step4将迁移不对称表述为来自BR-L2-019 P1+P3+P2的合取推理，但未像nontriviality_test对(+TP,+INT)和(+TP,−INT)格那样明确标注'机制来自砖，推论增量在将其映射到TP×INT象限的迁移路径图'。建议:在derivation.step4末尾增加一句:'BR-L2-019 P2确立了INT慢建快溃的机制——这是迁移不对称的底层引擎、来自L2桥接砖而非本推论独创。本推论的增量在于:(a)将INT慢建快溃与TP可快速变化（BR-L2-018，改变利益占比→TP可较快调整）合成，导出顺时针（需经慢建INT）慢于逆时针（仅需快溃INT+TP消退）;(b)将此不对称映射为四象限间的路径图。'此标注使归属诚实度与nontriviality_test对齐。
    - |
      [minor] falsification_trace增列tertiary_suspect:'定位偏差——若稳态社群中以(+TP,+INT)和(−TP,−INT)两格为主，四象限退化为两象限，则推论作为"分类框架"的增量坍缩为"规范有道德化程度一个连续维度的两端"的常识。推论的真实价值从分类转向迁移动力学——此定位偏差可能使推论在传播中被误用为静态分类工具。与primary_suspect(正交性)为同一现象的两面，但后果不同:primary_suspect关乎理论真假，本suspect关乎理论定位准确性和防平凡化。'

  author_response_round_1: |
    对审查者五条should+minor定向Edit，逐一回应：

    should①(定位重校):已修。标题从"结构判据"→"迁移判据"，人话摘要从"区分"→"迁移"取向，statement首增【定位】段声明"本推论首先是一个规范迁移动力学模型，其次才是分类框架"，承认稳态退两象限、四象限完整展开在变迁期。接受审查者判断——在TP/INT稳态高共现的世界中，分类静态价值有限，动态迁移才是真正增量的锚点。

    should②(证据收窄):已修。饮食禁忌锚conf从moderate→anecdotal，增注"仅illustrative，不承evidence burden"。对审查者"增补其他候选领域锚"的建议——暂不增补，因当前文件已明示该锚不承证据负担，增补更多同等级anecdotal锚不会实质加固且增加维护成本；若后续独立实证产出，再替换为coded evidence。作者记录此建议待r2审查者裁决是否仍需增补。

    should③(定义-预测滑移):已修。statement首段选读法B(经验竞争立场)——以Turiel判据作为道德的独立辨认标准，预测此类规范在结构测量中具有更高TP和INT。明确声明"不以TP/INT定义道德"。此选择使discriminant_validity段的竞争框架回溯到核心陈述中。

    should④(规范抽样):已修。在operationalization末增"规范抽样"段，规定按内容领域分层盲抽（从民族志规范目录/法律禁止列表等独立来源），抽样时不参考研究者对规范的道德/习俗直觉分类，抽样框架须在测量前公开注册。

    should⑤(归属精切):已修。derivation.step4首增【归属声明】，仿nontriviality_test格式明确标出"BR-L2-019确立了INT慢建快溃的机制——这是迁移不对称的底层引擎、来自L2桥接砖而非本推论独创。本推论的增量在于：(a)将INT慢建快溃与TP可快速变化合成，(b)将此不对称映射为四象限间的路径图。"

    minor(tertiary_suspect):已修。falsification_trace增tertiary_suspect，明确定位偏差导致的平凡化风险——与primary_suspect同根（TP/INT稳态高共现）但后果不同（理论真假vs定位准度）。标注防平凡化守卫已在discriminant_validity部分在位但此风险此前未列入suspect清单。

