      以至于 E_network 正反馈可压倒之"的前提。标准网络经济学指出 winner-take-all
      需高 multi-homing 成本。建议补一句:在商品货币场景下,多媒介并存带来额外验证/
      库存/兑换成本→E_network 正反馈有足够摩擦力驱动收敛。或诚实标注此前提假设。
      无此补充不影响 verified（历史上大多数自发网络确实收敛到主导媒介→此为间接验证）,
