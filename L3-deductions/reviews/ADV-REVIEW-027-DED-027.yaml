id: ADV-REVIEW-027-DED-027
type: adversarial_review
reviews: DED-027
layer: L3-deductions

人话摘要: |
  DED-027（一般等价物的物理筛选机制）对抗审查全过程的单一存档，含 round_1 与 round_2 两轮。

  round_1（独立对抗审查）裁 needs_revision——三个非平凡增量（E_network 收敛发动机/
  赢家通吃动力学/技术冲击换主）是真实的跨砖合成贡献，不在任何单块承重砖中，但三处
  required（BR-L2-021 的 E_network 内容被不精确否定、权重推导的函数形式缺失致
  DED-007-adjacent 焊死风险、赢家通吃的 functional differentiation 逃逸门未操作化）
  + 两处 should 挡在 verified 门前。反例猎捕（印度洋贸易网 800-1500 CE）未获净杀
  但暴露了预测(ii)的多重消化路径。未重蹈 DED-004/007 致命循环。

  round_2（全新独立对抗审查）裁 verified——round_1 三条 required 修复全部落地
  （discriminant_validity 修正承认 BR-L2-021 的 E_network 内容、weight_protocol
  rank-based pre-registration 协议 + 诚实标注、anti_talisman_clause 第(5)条 TDO+MS
  操作化堵 functional differentiation 逃逸门）。round_2 新增四路反例猎捕（多宿主
  成本论/中国铜钱跨域/战俘营媒介持久多样化/西非多种商品货币并存）均未获净杀。
  未重蹈 DED-004/007。两条新 should 发现：(1)赢家通吃的多宿主（multi-homing）成本论
  缺口——推论未论证为何低成本多宿主不能维持双媒介均衡；(2)weight_protocol rank 标定
  中"其余维度秩位由考古学独立标定"仍留灵活空间。

target: DED-027
protocol: |
  Rule B 独立对抗审查（作者≠审查者,全新独立上下文,与作者及前几轮审查者无关）。评分卡红旗 10 条
  逐项攻 + 反例猎捕（判 verified 前必做）+ DED-004（不可证伪循环）/DED-007（测量轴焊死）复发检查。
  裁决三态照评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活反例③不重蹈
  DED-004/007。

round_1:
  reviewer: "独立子 Agent（round 1, 全新独立上下文, 与作者及前几轮审查者无关）"
  verdict: needs_revision
  verdict_note: |
    这是一条【骨架部分在承重砖中、但三个非平凡增量（E_network 收敛发动机/赢家通吃动力学/
    技术冲击换主）是真实的跨砖合成】的候选推论。推论的独有可证伪联合预测——"高多边度+多候选
    得分接近→仍收敛到单一媒介主导，胜出者由路径依赖决定"——不在 BR-L2-021、BR-L2-007、
    BR-L2-011、BR-L2-012 任何单砖中，也不在四砖的简单并集中。真正的非平凡内核是正反馈锁死
    +赢家通吃+胜出偶然这一动力学三角。

    然而三个结构性缺陷挡在 verified 门前:

    （1）【BR-L2-021 的 E_network 内容被不精确否定——discriminant_validity 声称与砖事实
    不符（required）】
    discriminant_validity 声称"BR-L2-021 本身不包含此正反馈动态——它只做排序筛选"。
    但 BR-L2-021 原文的 便携性 段明确讨论 E_network 反馈:"金因物理密度高而被选中→
    E_network 上升→金的单位重量价值上升→便携性进一步上升。但这个反馈不会逆转因果方向：
    物理密度(19.3)是外生给定的，它是筛选的第一推动力；价值密度是筛选的放大器而非起点。"
    BR-L2-021 确实讨论了 E_network 反馈——但限缩在 便携性 的价值密度子维度内，未将其
    推广为整个媒介选择过程的"收敛发动机"。DED-027 的真实增量是将此反馈从 便携性 的局部
    放大器推广到全维度的一般性收敛发动机。当前 discriminant_validity 的措辞（"不包含"）
    与砖事实不符——需修正为诚实表述:"BR-L2-021 在 便携性的价值密度子维度中提及 E_network
    反馈，但未将其推广为'收敛必然'的一般性发动机——本推论将此反馈从局部放大器升级为
    全维度的收敛动力学，并在此基础上给出赢家通吃+胜出偶然的均衡选择预测。"→ required

    （2）【权重推导的函数形式缺失→实操中反推风险不可忽略——DED-007-adjacent（required）】
    anti_talisman_clause (1) 要求权重"从交换网络特征独立推导"，DED-027 给出了方向性关系
    （交易规模↑→可分性权重↑；运输距离↑→便携性+耐久性权重↑；验证技术↓→可识别性权重↑；
    冶金技术↓→可分性+同质性权重↑）。方向性预测本身是可独立检验的（如找高运输距离但胜出
    媒介便携性差的案例）。但方向性关系仅约束了权重的 sign，不约束 magnitude 和相对大小——
    在实操中，当三个文明"(旧大陆金/美索不达米亚银/殷商贝币)各自是局域最优解"被用作 supporting
    anchor 时，权重的事后标定空间过大：只要方向"对"，任何胜出者都可被 rationalize 为"加权
    得分最高"。DED-007 被 rejected 的核心病因是"测量轴焊死——自变量偷用结果测"；本案未到
    此程度（物理维度得分是独立于结果的理化测量），但权重推导的函数形式缺失使 anti-talisman
    约束 (1) 在实操中高度依赖研究者自律——这不是逻辑焊死，是操作化欠充分。需至少：
    (a) 在 operationalization 中给出权重标定的 pre-registration 协议（在不知道胜出者的情况下
    如何从局域网络特征映射到权重）；或 (b) 诚实标注当前权重仅被方向性约束、精细标定依赖
    未来实证校准。→ required

    （3）【预测(ii)赢家通吃的 functional differentiation 逃逸门未操作化（required）】
    预测(ii)声称"两个E值接近的竞争媒介不可能长期稳定共存"。但当面对历史上金银长期共存的
    案例时，理论可通过"functional differentiation"（金管大额/跨国清算、银管小额/日常交易）
    消化——这不被视为"竞争"而是"生态位分化"。"竞争媒介"与"生态位分化媒介"的区分判据
    是什么？若此判据依赖"是否观察到 E 值收敛"本身（即：最终收敛了=它们在竞争；没收敛=
    它们在生态位分化），则判据是循环的——预测(ii)变得无法证伪。当前 anti_talisman_clause (4)
    仅处理金银复本位（法定比价）的护身符锁，未处理 functional differentiation 这一更通用
    的逃逸门。需给出独立于 E 值收敛结果的操作化判据：区分"两个媒介在同一交易域竞争同一
    功能"与"两个媒介在不同交易域承担不同功能"——此判据应在知道结果前可施用。→ required

    综合:非 rejected（核心增量属实、反例猎捕未净杀、无 DED-004/007 致命循环）。三条 required
    修复（BR-L2-021 的 E_network 承认链修正 + 权重 pre-registration 协议或诚实标注 +
    functional differentiation 逃逸门操作化）可定向修订救活 → needs_revision。

  red_flag_findings:
    brick_conclusion: |
      【部分命中——BR-L2-021 的 E_network 内容被不精确否定，但核心增量仍不在任何单砖中】。

      按任务指定的四块承重砖逐字核:

      BR-L2-021（一般等价物的物理筛选）:
      原文含:六维静态筛选框架、局域权重概念、"六维得分低的商品持有者面临更高的交易摩擦，
      在竞争中被淘汰"的收敛逻辑、E_network 在 便携性价值密度子维度的反馈（"金因物理密度高
      而被选中→E_network 上升→金的单位重量价值上升→便携性进一步上升"）、铝因电解法供给
      稳定性崩塌的案例。
      原文不含:(a) E_network 作为一般性"收敛发动机"推广到全维度；(b) 得分接近候选的
      winner-take-all+路径依赖均衡选择；(c) 技术冲击→媒介换主的因果预测（铝案例在 BR-L2-021
      中是供给稳定性维度的例示，非"媒介可因此换主"的预测）；(d) 收敛必然+胜出偶然的联合预测。
      → 砖含增量(a)的局部种子（便携性价值密度反馈）但不含其一般化形式，增量(b)(c)完全不在砖中。

      BR-L2-007（禀赋互补驱动贸易）:
      原文含:禀赋互补→贸易网络形成的经验基础。
      原文不含:任何关于媒介选择/收敛/E_network/winner-take-all/技术冲击换主的内容。
      → 不构成 brick=conclusion。

      BR-L2-011（通货替代匿名交换中缺失的记忆）:
      原文含:匿名/不可追踪(D2)缺口下通货的记忆替代功能。
      原文不含:任何关于媒介选择/收敛/winner-take-all/技术冲击换主的内容。
      → 不构成 brick=conclusion。

      BR-L2-012（多边结算成本催生通用媒介）:
      原文含:多边度(D3)越高→通用媒介净收益越大的机制面。
      原文不含:任何关于媒介选择/收敛/winner-take-all/技术冲击换主的内容。
      → 不构成 brick=conclusion。

      四砖合起来:BR-L2-021 给了物理筛选的静态框架（+E_network 在便携性的局部提及），
      BR-L2-007/011/012 给了交换网络形成+媒介需求的三个驱动。四砖中无一砖给出:
      (a) E_network 作为一般性收敛发动机；(b) 得分接近时的 winner-take-all+路径依赖
      均衡选择（收敛必然+胜出偶然的联合预测）；(c) 技术冲击→媒介换主的历史动力学。
      → brick=conclusion 在四砖层面不命中——核心增量是跨砖合成。

      但 discriminant_validity 的措辞需要修正。当前声称"BR-L2-021 本身不包含此正反馈动态
      ——它只做排序筛选"与 BR-L2-021 原文不符（原文确实在便携性段讨论了 E_network 反馈）。
      诚实的表述应为:"BR-L2-021 在便携性的价值密度子维度中提及 E_network 反馈，但将其
      限缩为'筛选的放大器而非起点'——本推论将此反馈从局部放大器升级为全维度的一般性
      收敛发动机，并在此基础上给出赢家通吃+胜出偶然的均衡选择预测。"→ required:修正此措辞。

    nontriviality_cell_check: |
      【通过——空格预测是真实的经验主张，不被任何单砖平凡强制】。

      2×2 判据表（交换网络多边度[低/高] × 存在六维加权明显优势候选[无/有]）:
      - 低+无→多媒介并存/以物易物:平凡——小网络无统一媒介压力。
      - 低+有→媒介可选但不必然主导:平凡——网络效应弱。
      - 高+有→该优势候选近乎必然主导:较平凡——与 BR-L2-021 预测方向一致。
      - 高+无(多候选得分接近)→仍收敛到单一媒介主导，但胜出者由路径依赖决定:非平凡。

      核心空格="高多边度+多候选得分接近+E值长期接近的稳定并存"预测为空——winner-take-all
      禁止此格。逐个检查四砖是否强制此空格预测:

      BR-L2-021:做静态排序（"高分者胜出"），当得分接近时无话可说——不强制"必定收敛"或
      "必不收敛"。其 falsifiability 仅要求"找到六维劣却胜出的反例"，不涉及得分接近场景。
      → 不强制空格为空。

      BR-L2-007:讲贸易网络形成条件，不讲媒介收敛动态。→ 不强制。

      BR-L2-011:讲匿名缺口下的记忆替代，不讲媒介竞争。→ 不强制。

      BR-L2-012:讲多边结算成本→通用媒介净收益，给出单调关系（多边度↑→净收益↑），
      但不断言"单媒介主导是唯一均衡"——它只主张"通用媒介降低结算成本"，不排除"两个
      通用媒介各降各的成本"。→ 不强制空格为空。

      此空格为空是四砖均不给出的合成预测——只有 DED-027 的 E_network 正反馈+winner-take-all
      动力学给出"正反馈锁死→赢家通吃→禁止双E接近的稳定均衡"。空格可被现实反例（自发、
      连通、长时段双媒介稳定并行）填上→非空可满足、非同义反复。→ 逐格判空通过。

    measurement_orthogonality: |
      【主干正交——物理维度得分独立于交换结果，但权重推导的函数形式缺失导致实操中的
      DED-007-adjacent 风险】。

      IV（自变量）:
      - 六维物理得分:每维由独立于交换结果的物理/化学测量给出（金密度 19.3 g/cm³ 不依赖
        于"金是不是钱"）。这是真正的独立测量。
      - 局域权重:方向性关系给定（交易规模↑→可分性权重↑等），这些网络特征可独立于
        "谁是最终媒介"观测（贸易路线交叉点数、集市辐射半径、冶金遗址考古等）。
      - E_network 正反馈:接受度时间序列可独立追踪（墓藏中该金属作为货币出现的比例单调上升）。
      - 交换网络多边度:贸易路线交叉点数、不同产地商品共存度、集市数量与辐射半径。

      DV（被预测量）:
      - 单一媒介主导程度:某商品在交换行为中充当媒介的比例超过阈值（>80%），考古代理=墓藏/
        窖藏中货币金属种类集中度。

      IV 和 DV 的测量源在概念层不同→主干正交，未重蹈 DED-007 级硬焊死。

      但存在一个 DED-007-adjacent 弱点:权重推导的函数形式缺失。方向性关系（交易规模↑→
      可分性权重↑）给出了权重的 sign 约束，但不约束 magnitude 和相对大小。在实操中，
      当三个文明（旧大陆金/美索不达米亚银/殷商贝币）被用作 supporting anchor 时，权重
      的事后标定空间过大——只要方向"对"，任何胜出者都可被 rationalize 为"加权得分最高"。
      这不是 DED-007 式"分母用实际获授者"的概念焊死——物理得分本身是独立测量的——
      但权重推导的函数形式缺失使 anti-talisman 约束 (1) 在实操中高度依赖研究者自律。
      → required:在 operationalization 中给出权重标定的 pre-registration 协议，或诚实
      标注当前权重仅被方向性约束、精细标定依赖未来实证校准。

    scope_hook_independent_of_result: |
      【合规——两条 excluded_outcomes 均基于可事前独立识别的制度/地理特征】。

      (1) "有法定货币/固定兑换率制度干预的多媒介并行":法定货币法/固定兑换率是独立的
      制度特征（立法/铸币厂公告），可事前识别，不依赖于"是否观察到多媒介并行"的结果。
      → 合规。

      (2) "交换网络不连通的分区并行":网络连通性用贸易路线/商品流通数据独立测量，
      不依赖于"是否使用相同媒介"。→ 合规。

      两条排除均基于可事前独立测量的渠道特征，非事后按结果开脱。→ 射程/排除钩子合规。

    criterion_tier_match: |
      【不命中——连续量做方向/比较静态预测，无 DED-006 式分档失配】。

      被预测量（单一媒介主导程度=某商品充当媒介的比例）是连续量。预测均为方向性或比较静态:
      (i) 收敛必然——高多边度→单一媒介主导（方向）；(ii) 赢家通吃——得分接近仍收敛
      （方向，空格预测）；(iii) 技术冲击可换主——权重重标→媒介切换（方向）。自变量的
      二分（多边度高/低、优势候选有/无）是为 2×2 判据表的理论简化，operationalization
      已承认多边度是连续量且阈值需标定。→ 无 DED-006 式连续量用二元分档的失配。

    anti_talisman_cashed: |
      【纸上在位——四条硬约束概念层干净，但实操中两条面临反推风险】。

      四条硬约束逐条压力测试:

      (1) 六维得分独立测量 + 权重独立推导:
      物理维度得分（密度/化学惰性等）是元素周期表事实→真正独立于结果。局域权重的方向性
      关系（交易规模↑→可分性权重↑）可独立检验。但如前所述（measurement_orthogonality），
      函数形式缺失→实操中权重标定空间大。当前 real_world_anchors 的三个 supporting case
      的权重论证是 post-hoc illustration（在已知胜出者后解释"为什么金在旧大陆得分最高"），
      非 pre-registered test。→ required:补权重 pre-registration 协议或诚实标注局限。

      (2) E_network 正反馈独立测量:
      要求"接受度时间序列是否随时间自我强化"——这在考古学中可通过墓藏中货币金属出现比例
      的纵向变化代理。此约束可操作。→ 合规。

      (3) 技术冲击独立验证:
      要求独立验证(a)技术冲击改变了某物理维度参数（电解法+铝产量/价格数据——可独立验证），
      (b)原媒介加权得分确实低于新候选。约束 (b) 依赖权重标定——回到 (1) 的问题。→ 部分合规，
      依赖 (1) 的完善。

      (4) 金银复本位护身符锁:
      要求证明无制度干预+无功能分化+无收敛趋势，三条均给出了独立判据。→ 合规。
      但此锁仅针对金银复本位这一特定历史案例，未覆盖 functional differentiation 作为
      一般性逃逸门（见 red_flag:primary_suspect_aim）。→ required:补 functional differentiation
      的一般性操作化判据。

      综合:四条约束在书面概念层强，实操层的薄弱点集中在权重标定的 pre-registration
      和 functional differentiation 判据的缺失。

    anchor_fact_check: |
      【无致命事实错——三个 anchor 方向正确，但一个的"独立收敛"声称过强，一个仅为机制演示】。

      (1) "旧大陆金、美索不达米亚银、殷商贝币——不同网络独立收敛到不同媒介":
      方向正确——三个文明确实使用了不同的主导媒介。但"独立收敛"的声称需要审慎:
      旧大陆（地中海-欧洲-中东）和美索不达米亚（两河流域）并非完全独立的网络——
      两者通过新月沃地-安纳托利亚的贸易路线长期连通，金银的媒介角色可能存在跨区域
      扩散/借鉴。殷商中国相对于西方旧大陆是独立案例。建议将"三个文明在没有互相借鉴
      的时空下"改为更精确的表述——殷商相对于西方是独立的，但旧大陆与美索不达米亚的
      独立性是"弱独立"（部分网络重叠但有各自的主导媒介偏好）。→ should:修正独立性声称
      的措辞。

      (2) "铝的价格崩塌(1854-1890)——技术冲击改变物理维度参数":
      事实无误——Hall-Héroult 电解法(1886)确实使铝价从极高（>$17/lb）崩塌至贱金属水平。
      文件已诚实标注铝未曾充当任何网络的一般等价物→此为机制演示而非完整链演示。
      → 合规。

      (3) "金银复本位制的反复崩溃——自发收敛力量冲破制度干预":
      历史事实方向正确——19 世纪法国和美国复本位制反复面临市场比价偏离法定比价的困境。
      但将复本位崩溃完全归因于"E_network 自发收敛力量"可能 overclaim:格雷欣法则
      （劣币驱逐良币——在法定比价下）是此现象的标准经济学解释，不需要 E_network 正反馈
      也可解释复本位的崩溃。DED-027 的增量在于强调这是"自发收敛力量"的证据，但同样的
      现象被格雷欣法则（一个 DED-027 自认不同于己的理论）用不同机制解释。→ should:
      在 discriminant_validity 中增列与格雷欣法则在解释复本位崩溃上的机制区分——
      当前 discriminant_validity 仅做了概念区分（"不同机制、不同射程"），未解释为何
      同一历史现象（复本位崩溃）被两个不同机制同时声称"支持"。
      → 此不构成事实错——复本位崩溃的历史记录无误——但锚的理论归属（E_network vs 格雷欣）
      存在竞争性解释未处理。

      三个 anchor 均无致命事实错误。→ 总体合规，两处 should 标注建议。

    definition_vs_prediction: |
      【通过——核心预测均为可证伪的经验主张，非定义性同义反复】。

      三个 falsifiability 条件逐条复核:

      (a) "找到一个连通度高、长时段稳定存在两种以上E值接近的竞争媒介并行充当一般等价物
      的交换网络，二者均无收敛趋势":此条件给出了独立于理论术语的操作化判据——连通度
      （贸易路线数据）、长时段（代际尺度）、E值接近（被接受度测量）、无收敛趋势（时间
      序列无单调变化）。→ 可证伪的经验预测。

      (b) "找到一个文明，其最终稳定的唯一一般等价物在局域加权六维得分上系统性低于同期
      可获取的另一种商品":此条件的证伪力依赖于权重的 pre-registration（见 anti_talisman）。
      若权重可事后调整，此条件在实践中可被消化（"因为我们标错了那个网络的权重"）。
      → 逻辑上可证伪，实操证伪力取决于权重标定是否 pre-registered。

      (c) "交换网络多边度与存在单一主导媒介之间无统计正相关":此条件不依赖于任何理论
      内部的参数标定——多边度与媒介集中度均可独立测量。→ 可证伪且实操证伪力强。

      三个条件在逻辑上均可被独立反例推翻。条件 (b) 的实操证伪力受权重标定约束——
      但这是操作化问题而非逻辑免疫问题。→ 定义/预测区分通过。

    enumeration_and_species: |
      【不命中——推论不声称穷举任何类别/物种】。

      DED-027 的核心主张是动力学预测（收敛/赢家通吃/换主），不声称穷举"N 类可枚举"
      的某种类型学。2×2 判据表是理论结构的分析工具，非"所有可能情况已穷举"的声称。
      → 此红旗不适用。但应主动猎第 5 格（中等多边度——既不高也不低），见 counterexample_hunt。

    primary_suspect_aim: |
      【指对了——自认最弱腿（预测 ii 赢家通吃）准确；但漏了一条隐腿（functional differentiation
      逃逸门未操作化）+ 一条与格雷欣法则的竞争解释未处理】。

      文件自认:
      - primary_suspect:预测(ii)的 winner-take-all——两个E接近的竞争媒介不能稳定共存。
      - secondary_suspect:预测(iii)的技术冲击换主——因果链最长，铝未当过媒介→完整链空缺。
      - unlikely_suspect:BR-L2-021 六维框架(IEA=2.4)——物理事实确定性高。

      三条 self-identification 方向准确:
      - Winner-take-all 确实是整条推论中最脆弱的预测——历史上金银长期并行是最直观的
        反例来源，理论的消化依赖"法定比价"和"功能分化"两道防线。
      - 技术冲击换主的因果链完整性问题被诚实标注。
      - BR-L2-021 的物理基础确实是相对稳健的。

      但文件漏认两条隐腿:

      (a) 【functional differentiation 逃逸门未操作化——预测(ii)可能被免疫化（required）】
      当面对"金银长期共同充当货币"的直观挑战时，理论可通过 functional differentiation
      （"金管大额/银管小额——不是竞争是分工"）消化。但"竞争"与"分化"的区分判据未操作化。
      若此判据依赖于"是否观察到收敛"本身（收敛了=它们在竞争；没收敛=它们在分化），
      则判据是循环的——预测(ii)无法被证伪。当前 anti_talisman_clause (4) 仅处理金银复本位
      （法定比价）的特定护身符，未覆盖 functional differentiation 这一更通用的逃逸门。
      → required:给出独立于 E 值收敛结果的操作化判据。

      (b) 【格雷欣法则对复本位崩溃锚的竞争解释——same evidence, different mechanism（should）】
      real_world_anchors.supporting 案例 3（金银复本位反复崩溃）被用作"E_network 自发收敛
      力量"的证据。但格雷欣法则——一个 DED-027 在 discriminant_validity 中声称"不同机制、
      不同射程"的理论——用"法定比价下的套利"解释同一现象。同一个历史事实（复本位崩溃）
      同时被两个声称"不同"的理论视为支持证据→读者无法判断哪个机制是真正的 driver。
      → should:在 discriminant_validity 中增列与格雷欣法则在复本位崩溃案例上的机制区分——
      给出可操作判据区分"套利驱动的挤出"（格雷欣）和"正反馈驱动的挤出"（E_network）。

      平凡化检查:抽掉 DED-027 的三个非平凡增量（E_network 收敛发动机/赢家通吃+路径依赖/
      技术冲击换主）后，推论坍缩为"六维得分高的商品当钱，且局域权重不同→不同文明有不同
      媒介"——这正是 BR-L2-021 的内容。推论的非平凡性完全依赖于这三个增量→自认的 suspect
      准确覆盖了脆弱链。平凡化检查通过。

  counterexample_hunt: |
    主动构造四路猎杀，分别攻击 falsifiability 的三个条件 + 一个额外的构念免疫攻击:

    === 猎路 1:攻击 falsifiability (a) —— 寻找 "自发、连通、长时段双媒介稳定并行" 的干净案例 ===

    【靶心案例:印度洋贸易网（约 800-1500 CE）】
    印度洋贸易网络连接东非（金、象牙）、阿拉伯（银 dirham、金 dinar）、印度（银、金）、
    东南亚（锡、金）、中国（铜钱、银）。网络特征:
    - 连通性:定期季风航行连接所有主要港口——从东非的 Kilwa 到中国的广州，多边度极高。
    - 长时段:约 700 年的持续贸易活动（阿拔斯王朝至葡萄牙人抵达前）。
    - 多媒介并存:金 dinar（阿拉伯-印度-东南亚高价值贸易）、银 dirham（波斯湾-印度）、
      中国铜钱（东亚-东南亚）、马尔代夫 cowrie shells（孟加拉湾-西非低价值交易）、
      甚至纺织品（东南亚部分地区）。多种媒介在同一个连通网络中并行数世纪。
    - 无统一制度强制:不存在"印度洋中央银行"设定金-银-铜-贝壳的法币比价——
      商人基于市场行情自由选择媒介。

    消化分析:该案可被 DED-027 从以下四个方向消化:
    (a) 功能性分化:金用于高价值长途贸易（dinars 是印度洋的"批发货币"），银用于中等价值，
      铜钱和 cowries 用于本地/低价值交易——不同媒介占据不同交易域（交易规模×距离矩阵的
      不同象限），不是"竞争同一功能"而是"生态位分化"。
    (b) 网络不完全连通:尽管有跨洋航线，但实际交换网络由多个部分重叠的子网络构成——
      中国铜钱主要在东亚流通，cowries 主要在孟加拉湾-岛屿东南亚，金银主要在阿拉伯-印度
      轴——子网络之间有桥接但不完全融合。
    (c) 前现代运输的成本约束:季风航行每年仅 1-2 次往返，信息传播速度和交换频率远低于
      "高多边度"的理论假设——实际收敛速度极慢，可能在 700 年内仍处于"收敛中"的过渡态
      而非"已达均衡的稳定并存"。
    (d) 部分媒介有制度影子:中国铜钱的流通范围与中国朝贡体系的制度影响范围高度重叠——
      铜钱不是纯粹"自发涌现"的媒介，有帝国制度的背书。

    消化力评估:
    四条消化路径各自独立成立，但合起来揭示了一个结构性弱点:预测(ii)（赢家通吃）在面对
    历史上任何"多媒介长期共存"的案例时，几乎总有至少一条消化路径可用——functional
    differentiation、子网络分割、过渡态、制度影子——四道防线使预测(ii)在实操中极难被
    证伪。这与 DED-004 的逻辑免疫不同（逻辑上空格可被填），但接近"实践中总可消化"的
    构念免疫。关键缺口在 functional differentiation——若此判据被操作化（required fix #3），
    印度洋案例的消化路径 (a) 将被约束。

    结论:未净杀——印度洋案例可被四条路径消化。但暴露了 functional differentiation
    逃逸门未操作化的严重性——若此门不锁，预测(ii)在历史尺度的证伪几乎不可能。
    → required:操作化 functional differentiation vs competition 的判据。

    === 猎路 2:攻击 falsifiability (b) —— 寻找 "六维得分劣却胜出" 的案例 ===

    【靶心案例:盐作为一般等价物（西非 Sahel、埃塞俄比亚）】
    盐在多个文明中被用作货币——西非 Sahel 地区（盐块作为货币）、埃塞俄比亚（盐棒 amole）。
    盐的六维得分:
    - 可分性:中等（可切割，但容易碎裂不均匀）
    - 耐久性:差（遇水溶解、受潮变质——热带 Sahel 的雨季是严峻考验）
    - 便携性:差（密度低 2.16 g/cm³，价值密度低——运盐块的体积极大）
    - 可识别性:中等（品质差异大——不同产地的盐纯度不同）
    - 同质性:差（天然盐块品质不均匀）
    - 供给稳定性:差（不同盐矿产量波动大）

    在这些地区，盐可能同时有金/银/铜/贝壳可用（通过跨撒哈拉贸易），但盐仍是主导媒介。
    若存在一种比盐在六维上全面更优的可获取替代品而盐仍胜出→BR-L2-021 被击中。

    消化分析:盐在 Sahel 的胜出并非因为它在"绝对六维得分"上高于金——在 Sahel 的交易
    规模/运输条件等局域网络特征下，盐的局域加权得分可能高于金。关键在于:
    - 交易规模:Sahel 内部贸易以日常生活品为主（谷物、牲畜、布匹），交易规模小→
      可分性极高的媒介（金可分割到极小单位）在此网络中不是加分项（反而不方便日常使用）。
    - 运输距离:长途跨撒哈拉贸易中，金是主要出口品（运往北非/地中海），而非 Sahel 内部
      的流通媒介。Sahel 内部运输距离短→便携性权重低。
    - 关键局域特征:盐在 Sahel 是生存必需品（热带高温下人体需补盐）→盐有独立于媒介角色
      的非货币需求（使用价值）→这使盐有一个其他媒介没有的"接受度 floor"——即使盐的
      物理属性不够好，人们也愿意接受它因为"接受最坏情况也可以自己吃或用"。这与
      BR-L2-023（金的非货币需求基底）逻辑同构但不完全相同——金的需求基底是非必需的
      （装饰），盐的需求基底是生存必需的（生理）。
    → 这不是六维得分劣却胜出的反例——盐在局域加权下的得分可以合理化。

    结论:未净杀——盐案例可被局域权重消化。但它揭示了六维框架可能遗漏的一个第七维度:
    "独立于媒介角色的使用价值"——一种商品即使物理属性较弱，如果它有强的、独立于"当钱用"
    的使用需求（如盐作为生存品），它可以凭借这个"接受度 floor"胜出。BR-L2-023 已讨论
    金的非货币需求（装饰），但未推广到"生存必需品的非货币需求=更强的接受度 floor"。
    → should:考虑在 discriminant_validity 中讨论"非货币使用价值作为潜在的第七筛选维度"。

    === 猎路 3:攻击 falsifiability (c) —— 检验 "多边度↑不伴随媒介集中度↑" ===

    【靶心案例:现代全球经济的多法币体系（1971-今）】
    全球贸易网络的多边度在 1971 年后急剧上升（集装箱化+金融全球化+互联网）。
    按预测(i)，多边度上升应伴随媒介集中度上升——但实际趋势是美元霸权在 2000 年代
    达到峰值后出现去中心化（人民币国际化、欧元挑战、加密货币兴起、金砖国家去美元化）。

    消化分析:此案明确在射程外（excluded_outcomes #1:法定货币体系）。且法币的价值基础
    是信用(BR-L2-024)而非物理属性→六维物理筛选不适用。→ out_of_scope。

    结论:未净杀（射程外）。但现代法币体系的多边度-媒介集中度反例暗示:当媒介从商品货币
    升级为法币时，多边度与媒介集中度的关系可能反转——网络效应可能不再推动单媒介收敛
    （因为法币的信用边界与主权领土边界重合→多边度上升反而增加接触更多法币的机会）。
    → should:在射程声明中标注"商品货币→法币"的相变边界——在此边界以上的预测方向
    可能逆转。

    === 猎路 4:攻击 "收敛必然" 的逃逸门 —— "多边度不够高" 作为万能消化 ===

    【概念攻击——不构造具体历史案例】
    falsifiability (a) 的证伪条件要求"连通度高"的交换网络。但如果面对任何多媒介并存的
    案例，理论都可 argue "那个网络的多边度还不够高——换一个多边度更高的网络就会发现
    收敛"。"足够高"的阈值未指定→"多边度不够高"可消化几乎所有多媒介并存案例。

    消化分析:此攻击不等同于 DED-004 式的逻辑不可证伪——因为如果"所有已知的高多边度
    历史案例都未显示收敛"（强证据），逻辑上可以拒绝推论。但实操中:(a)"高多边度"的
    阈值未指定→定义权在理论持有者；(b)已知的高多边度历史案例（印度洋、地中海、
    丝绸之路）都是前现代的不完美案例（运输慢/信息滞后）→总可 argue"现代全球化的
    多边度才是真正的高"；(c)现代全球化案例在射程外（法币体系）→无法检验。
    三者合起来制造了一个实操中的"永不完全成熟"窗口——理论总可声称"真正的检验需要
    一个比所有已知案例都更高多边度的、商品货币时代的交换网络"。→ 这不是逻辑免疫，
    是实操中很难找到满足"足够高"阈值又同时清洁（无制度干预）的历史案例。
    → should:在 falsifiability 段诚实标注"阈值未标定对证伪窗口的历史可得性的限制"。

    综合:四路猎杀均未获 scope 内净杀反例。印度洋案例（猎路 1）是目前发现的最强挑战——
    它可被消化但不 trivial，消化依赖 functional differentiation 的判据（当前未操作化）。
    猎路 2（盐）和 猎路 4（永不完全成熟窗口）揭示了构念边界的弱点。核心骨架（E_network
    发动机+赢家通吃+胜出偶然的动力学三角）未被任何一击动摇。

  non_recurrence_of_ded004_007: |
    DED-004（不可证伪循环）:【未复发——逻辑层有三个可证伪条件，但实操中存在两个
    "缓发证伪窗口"的免疫模式】。

    逻辑层:falsifiability (a)(b)(c) 给出了明确的证伪条件:
    - (a) 双媒介稳定并行→赢家通吃推翻。
    - (b) 六维劣却胜出→物理筛选推翻。
    - (c) 多边度-媒介集中度无正相关→E_network 发动机推翻。
    三个条件在逻辑上均可被独立反例推翻，空格不被任何单砖平凡强制→非 DED-004 式逻辑不可证伪。

    实操层两个"缓发证伪窗口"的免疫模式:
    (i) "多边度阈值未标定":任何多媒介并存案例可被 argue 为"多边度还不够高"——
    且最高多边度的现代案例（全球化）在射程外（法币）。这在实操中延迟了证伪窗口，
    但非逻辑免疫——如果所有可观测的高多边度商品货币案例均不收敛，证据累积最终会
    压倒理论。→ should awareness，不到 DED-004 级。
    (ii) "functional differentiation 逃逸门":任何双媒介并存可被 argue 为"它们在
    不同交易域、不是竞争关系"。这在实操中将消化范围扩得极宽——但若此判据被操作化
    （required fix #3），免疫风险大幅降低。→ required:操作化此判据。

    两模式均不等同 DED-004 的逻辑不可证伪循环→未复发。

    DED-007（焊死测量轴）:【未复发——主干正交，但权重推导的函数形式缺失带来实操焊死风险】。

    主干（IV = 六维物理得分+局域权重 × E_network 多边度 vs DV = 单一媒介主导程度）:
    - 六维物理得分:独立于交换结果的物理化学测量→真正正交。
    - E_network:接受度时间序列独立于最终"谁胜出"→可独立测量。
    - 局域网络特征:贸易路线/运输距离/冶金水平→可独立于"谁是媒介"观测。

    与 DED-007（分母用"实际获授者"→IV 概念定义依赖于 DV）性质根本不同。本案的 IV
    在概念层和测量层均可与 DV 分离。

    但权重推导的函数形式缺失是一个 DED-007-adjacent 弱点:当权重仅被方向性约束时，
    实操中可从"胜出者"反推"该网络在此维度上的权重必然较高"→然后 argue"因为这符合
    方向性约束（如运输距离长所以便携性权重高）"。这不是概念焊死（物理得分独立的），
    但可导致"权重的事后标定总是使胜出者得分最高"的免疫模式。→ required:补 pre-registration
    协议或诚实标注。

    综合:主干测量轴正交，未重蹈 DED-007。权重推导的函数形式缺失是操作化不充分所致，
    非概念性焊死。

  required_fixes:
    - |
      [required] 修正 discriminant_validity 中关于 BR-L2-021 的 E_network 声称。
      当前措辞:"BR-L2-021 本身不包含此正反馈动态——它只做排序筛选"。但 BR-L2-021
      原文在 便携性 段明确讨论:"金因物理密度高而被选中→E_network 上升→金的单位重量
      价值上升→便携性进一步上升。但这个反馈不会逆转因果方向：物理密度(19.3)是外生
      给定的，它是筛选的第一推动力；价值密度是筛选的放大器而非起点。"BR-L2-021 确实
      讨论了 E_network 反馈，但将其限缩在便携性价值密度子维度内——未推广为全维度
      的一般性收敛发动机。建议改为:"BR-L2-021 在便携性的价值密度子维度中提及 E_network
      反馈（作为'筛选的放大器而非起点'）——本推论将此反馈从局部放大器升级为全维度的
      一般性收敛发动机，并在此基础上给出赢家通吃+胜出偶然的均衡选择预测——这些不在
      BR-L2-021 的射程内。"此修正不改变推论的非平凡性（增量仍在），但使 attribution 诚实。
    - |
      [required] 在 operationalization 的"六维加权得分"段补充权重标定的 pre-registration
      协议或诚实标注。当前给出了方向性关系（交易规模↑→可分性权重↑），但未约束 magnitude
      和相对大小。实操中，当三个文明（旧大陆金/美索不达米亚银/殷商贝币）被用作 supporting
      anchor 时，权重可被事后标定使每个胜出者"恰好"得分最高。需至少:(a)给出权重标定的
      前置协议——在不知道胜出者的情况下，如何从局域网络特征映射到权重向量（如 rank 而非
      exact value、或 pairwise comparison protocol）；或 (b)诚实标注当前权重仅被方向性
      约束，精细标定依赖未来实证校准——当前的 supporting anchor 在此意义上应标注为
      "directionally consistent illustrations, not pre-registered tests of the weight model"。
    - |
      [required] 操作化"竞争媒介"与"生态位分化媒介"的区分判据——堵 functional differentiation
      逃逸门。预测(ii)声称两个 E 值接近的竞争媒介不能稳定共存。但当面对金银长期并行等案例时，
      理论可通过"它们在功能上分化（金管大额/银管小额），不是竞争"来消化。若此判据依赖于
      "是否观察到收敛"本身，则判据是循环的。需给出独立于 E 值收敛结果的操作化判据，至少涵盖:
      (a) 交易域重叠度——两个媒介在同一交易规模区间/同一地理市场/同一商品类别中被同时接受的
      频率（高重叠度→竞争；低重叠度→分化）；(b) 媒介可替代性——持有人是否可在不损失显著
      交易便利性的情况下用一个媒介替代另一个（高替代性→竞争；低替代性→分化）。此判据应可
      在不知道结果前施用。建议在 anti_talisman_clause 中新增第(5)条或扩展现有第(4)条。
    - |
      [should] 修正 real_world_anchors 中"旧大陆金/美索不达米亚银/殷商贝币"的独立性声称。
      旧大陆（地中海-欧洲-中东）和美索不达米亚（两河流域）通过新月沃地-安纳托利亚的贸易
      路线长期连通，金银的媒介角色可能存在跨区域扩散/借鉴，严格意义上的"互相借鉴的独立
      收敛"只在中国殷商相对于西方旧大陆时成立。建议将"三个文明在没有互相借鉴的时空下"
      改为更精确的表述——区分"强独立"（殷商 vs 西方）和"弱独立"（旧大陆 vs 美索不达米亚，
      部分网络重叠但各自发展出不同主导媒介）。
    - |
      [should] 在 discriminant_validity 中增列与格雷欣法则在复本位崩溃案例上的机制区分。
      当前 discriminant_validity 对格雷欣法则的区分只做了一般性概念区分（"不同机制、不同射程"），
      但 real_world_anchors 的案例 3（金银复本位反复崩溃）同时被 E_network 自发收敛和格雷欣
      法则（法定比价下的套利）解释。需给出可操作判据区分:在复本位崩溃的具体历史案例中，
      什么观测可以区分"套利驱动的挤出"（格雷欣——被低估金属流出/窖藏，被高估金属流入/
      主导流通）和"正反馈驱动的挤出"（E_network——被更广泛接受的媒介自我强化，独立于
      法定比价的方向）？若两者在复本位场景下给出相同的经验预测→该锚对 DED-027 的增量
      支持力减弱——因为一个更简化的既有理论（格雷欣）已给出相同预测。

author_response_round_1: |
  【对三条required修复的回应——2026-07-15】

  全部三条required已在DED-027原档中定向修复，逐个确认如下：

  (1) BR-L2-021的E_network声称修正——已修复。
  修改位置：derivation step 4 + discriminant_validity的BR-L2-021判别段。
  改动内容：derivation step 4的"注意BR-L2-021本身不包含此正反馈动态——它只做排序筛选"
  改为承认链——"BR-L2-021在便携性的价值密度子维度中已提及E_network反馈...但将其限缩在
  便携性维度内——未推广为跨越全部六个维度的一般性收敛发动机"。discriminant_validity新增
  独立承认段（"承认链"）明确BR-L2-021的E_network内容及本推论的升级性质。增量性质不变：
  BR-L2-021的E_network是便携性维度的局部放大器，本推论升级为全维度收敛发动机→导出
  赢家通吃+胜出偶然——后者仍在BR-L2-021射程外。

  (2) 权重标定pre-registration协议——已修复。
  修改位置：operationalization六维加权得分段。
  改动内容：新增weight_protocol子字段，定义两步pre-registration协议——Step A方向约束
  （当前已满足）+ Step B rank-based pairwise comparison协议（秩位由独立于胜出者的局域
  网络特征规则决定，允许同秩，delta阈值逐级比较）。limitations段新增诚实标注：
  "当前方向性关系约束权重的sign但不约束magnitude——supporting anchor应标注为
  directionally consistent illustrations, not pre-registered tests"。rank协议提供了
  最低限度的pre-registration框架——在不知道胜出者的情况下，秩位由可独立观测的
  局域特征（交易规模分位/运输距离/冶金温度/检验制度）决定。

  (3) 功能分化vs竞争媒介的操作化判据——已修复。
  修改位置：anti_talisman_clause新增第(5)条。
  改动内容：定义两个独立于E值收敛结果的判据——(a)交易域重叠度TDO（交易规模区间+
  地理市场+商品类别的co-acceptance矩阵）；(b)媒介可替代性MS（交易完成时间/被拒率差异）。
  高TDO+高MS→竞争关系→受预测(ii)约束；低TDO或低MS→功能分化→不在预测(ii)射程内。
  两判据均可在单时间点截面上独立测量，不依赖E值时间序列→非循环判据。已在印度洋
  贸易网案例上进行判据施用演示（金dinar高价值跨洋vs银/铜/贝壳中低价值本地→TDO低
  →功能分化成立→不构成预测(ii)反例）。

  对两处should的态度：
  - 旧大陆/美索不达米亚独立性声称修正（should）：接受方向，将在后续修订中区分"强独立"
    （殷商vs西方）与"弱独立"（旧大陆vs美索不达米亚，部分网络重叠但不同主导媒介）。
    此修订不影响推论的逻辑结构，排入下一优先级。
  - 格雷欣法则竞争解释（should）：接受方向，将在discriminant_validity的格雷欣段中
    增补操作化区分判据（套利挤出vs正反馈挤出的不同经验指纹）。此修订同样不影响
    逻辑结构，排入下一优先级。

  本轮三条required全部定向修复，推论核心骨架（E_network全维度收敛发动机+赢家通吃+
  胜出偶然动力学三角）不变，操作化缺口已补。

round_2:
  reviewer: "独立对抗审查者 (round 2, 全新独立上下文, 与作者及 round_1 审查者无关)"
  verdict: verified
  verdict_note: |
    这是一条【骨架在承重砖中但三个非平凡增量是跨砖合成】的推论。round_1 提出的三条
    required 缺陷已全部定向修复落地,逐一核验如下:

    (1) discriminant_validity 的 BR-L2-021 E_network 声称已修正。原"BR-L2-021 本身
    不包含此正反馈动态"改为承认链——明确 BR-L2-021 在便携性价值密度子维度的 E_network
    讨论（"筛选的放大器而非起点"），本推论的增量在于将此反馈从便携性局部放大器升级为
    全维度一般性收敛发动机并导出赢家通吃+胜出偶然。增量性质不变:BR-L2-021 的 E_network
    是便携性维度内的局部放大器，升级到全维度+均衡选择预测仍在 BR-L2-021 射程外。

    (2) operationalization 的六维加权得分段新增 weight_protocol（rank-based pairwise
    comparison pre-registration 协议:Step A 方向约束 + Step B rank 协议，秩位由独立于
    胜出者的局域网络特征规则决定，允许同秩，delta 阈值逐级比较）+ limitations 诚实标注
    （"当前方向性关系约束权重的 sign 但不约束 magnitude——supporting anchor 应标注为
    directionally consistent illustrations, not pre-registered tests"）。

    (3) anti_talisman_clause 新增第(5)条——操作化竞争 vs 生态位分化的独立判据:交易域
    重叠度 TDO（交易规模区间×地理市场×商品类别的 co-acceptance 矩阵）+ 媒介可替代性
    MS（交易完成时间/被拒率差异）。高 TDO+高 MS→竞争关系→受预测(ii)约束;低 TDO 或
    低 MS→功能分化→不在射程内。TDO 和 MS 均可在单时间点截面上独立测量,不依赖 E 值
    时间序列→非循环判据。已在印度洋贸易网案例上进行判据施用演示。

    三条修复均定向到位,推论核心骨架（E_network 全维度收敛发动机+赢家通吃+胜出偶然
    动力学三角）不变。round_2 新增四路反例猎捕（见 counterexample_hunt）均未获 scope
    内净杀。未重蹈 DED-004（不可证伪循环）或 DED-007（测量轴焊死）。

    仍有两处 should 级别改进空间（不挡 verified 门）:
    (a) 赢家通吃预测未论证多宿主（multi-homing）成本——若接受两种媒介的成本很低,
    则两媒介可稳定共存而不触发收敛。推论暗含"持有多媒介有摩擦"但未显式论证。
    (b) weight_protocol rank 标定中"其余维度秩位由考古学独立标定"仍留灵活空间,
    但方向约束+rank≤2 规则已大幅压缩自由度,物理得分本身独立→不到 required。

  red_flag_findings:
    brick_conclusion: |
      【round_2 复核:未命中——核心增量仍在四砖外,round_1 的 attribution 修正已落地】

      round_2 重新逐字核对四块承重砖与 DED-027 修订版的三处非平凡增量:

      BR-L2-021（一般等价物的物理筛选）:
      修订版 discriminant_validity 已诚实承认:BR-L2-021 在便携性价值密度子维度中讨论
      E_network 反馈（"筛选的放大器而非起点"），但限缩在便携性维度内——未推广为全维度
      一般性收敛发动机。BR-L2-021 的 falsifiability 只要求"找六维劣却胜出者"（静态排序），
      不要求解释收敛动力学、不处理"得分接近时谁胜出"、不预测"媒介可因技术冲击换主"。
      → 三处增量均不在 BR-L2-021 中。attribution 诚实,承认链完整。

      BR-L2-007（禀赋互补驱动贸易）:
      含禀赋互补→贸易网络形成的基础,不含任何媒介选择/收敛/E_network/winner-take-all
      /技术冲击换主内容。→ 不构成 brick=conclusion。

      BR-L2-011（通货替代匿名交换中缺失的记忆）:
      含匿名/不可追踪(D2)缺口下通货的记忆替代功能,不含媒介选择/收敛/winner-take-all/
      技术冲击换主内容。→ 不构成 brick=conclusion。

      BR-L2-012（多边结算成本催生通用媒介）:
      含多边度(D3)越高→通用媒介净收益越大的单调关系,但不断言"单媒介主导是唯一均衡"——
      它只主张"通用媒介降低结算成本",不排除"两个通用媒介各降各的成本"。→ 不强制收敛
      必然、不强制赢家通吃、不强制技术冲击换主。→ 不构成 brick=conclusion。

      四砖合取:BR-L2-021 给了物理筛选框架（+E_network 便携性局部反馈），
      BR-L2-007/011/012 给了交换网络形成+媒介需求驱动。无一砖给出:
      (a) E_network 作为全维度一般性收敛发动机；
      (b) 得分接近时的 winner-take-all+路径依赖均衡选择（收敛必然+胜出偶然的联合预测）；
      (c) 技术冲击→媒介换主的历史动力学。
      → brick=conclusion 在四砖层面不命中。round_1 修正后的 discriminant_validity
      诚实承认了 BR-L2-021 的 E_network 内容→不构成过度伸张。核查通过。

    nontriviality_cell_check: |
      【round_2 复核:通过——空格预测是真实的经验主张,不被任何单砖平凡强制】

      round_2 对四砖各做一次"若此砖为真,是否强制空格为空?"的 counterfactual:

      - 若仅 BR-L2-021 为真:静态排序框架说"高分者胜出"→得分接近时无话可说→
        不强制"必收敛"也不强制"必不收敛"。空格悬置。→ 不强制。

      - 若仅 BR-L2-012 为真:多边度↑→通用媒介净收益↑→不排除两个通用媒介各降各的成本→
        不强制收敛到单一媒介。→ 不强制。

      - 若仅 BR-L2-011 为真:匿名缺口→记忆替代→不涉及"几个媒介"的问题。→ 不强制。

      - 若仅 BR-L2-007 为真:禀赋互补→贸易→不涉及媒介收敛。→ 不强制。

      唯 DED-027 的 E_network 正反馈+winner-take-all 合成给出"正反馈锁死→禁止双 E
      接近的稳定均衡"。空格可被现实反例（自发、连通、长时段双媒介稳定并行）填上→
      非空可满足、非同义反复。逐格判空通过。

    measurement_orthogonality: |
      【round_2 复核:主干正交——IV 与 DV 测量源概念层分离,weight_protocol 大幅压缩
      实操反推空间,未重蹈 DED-007 级焊死】

      round_2 对修订版 weight_protocol 的测量正交性重新检验:

      IV（自变量）各成分的测量独立性:
      - 六维物理得分:每维由物理/化学独立测定（金密度 19.3 g/cm³ 是元素周期表事实,
        不依赖于"金是不是钱"）。→ 真正独立,无可争议。
      - 局域权重——方向约束（Step A）:交易规模↑→可分性权重↑;运输距离↑→便携性+
        耐久性权重↑;验证技术↓→可识别性权重↑;冶金技术↓→可分性+同质性权重↑。
        这些方向性关系本身可被独立检验——如找"高运输距离但胜出媒介便携性差"的案例
        可推翻方向约束。→ 可独立证伪。
      - 局域权重——rank 协议（Step B）:秩位由独立于胜出者的局域网络特征规则决定——
        交易规模位于上三分位→可分性 rank≤2;运输距离>一日陆路→便携性 rank≤2;
        冶金温度<800°C→可分性 rank≤2 且同质性 rank≤2;无标准化检验制度→可识别性
        rank≤2。秩位 ≤2 的规则约束了最重要的维度必须在排序前列→压缩了事后标定空间。
        → rank 协议使权重标定从"完全事后"变为"部分事前"。

      round_2 发现的剩余灵活空间:
      (a) "其余维度秩位由考古学独立标定"——"考古学独立标定"在实操中可能仍涉及
      判断空间（不同考古学者对同一遗址的"交易规模"可能有不同估计→秩位可浮动）。
      (b) 允许同秩（两个维度同等重要）→在高同秩率下,rank 协议对"谁是最重要维度"的
      约束力下降。
      → 此灵活空间使 anti-talisman 约束未到"滴水不漏",但已从 round_1 的"完全无约束"
      大幅改善。rank≤2 规则至少确保最重要的维度不得被排到第 3 位及以后→事后
       rationalize 的空间被显著压缩。且物理得分本身独立于结果→这不是 DED-007 级焊死。

      DV（被预测量）:单一媒介主导程度——某商品在交换行为中充当媒介的比例超过阈值,
      考古代理=墓藏/窖藏中货币金属种类集中度→测量独立于 IV。

      → 主干正交,未重蹈 DED-007。剩余灵活空间属 should 级（rank 标定的考古代理精度
      有限），不构成 required 缺陷。

    scope_hook_independent_of_result: |
      【round_2 复核:合规——两条 excluded_outcomes 均基于可事前独立识别的制度/地理特征】

      (1) "有法定货币/固定兑换率制度干预的多媒介并行":法定货币法/固定兑换率是独立
      的制度特征（立法/铸币厂公告），可事前识别。→ 合规。
      (2) "交换网络不连通的分区并行":网络连通性用贸易路线/商品流通数据独立测量。→ 合规。

      round_2 追加检验:排除钩子是否可能被事后扩大以消化不利案例?
      - "制度干预"的门槛清晰（法定货币法或固定兑换率的存在/缺失是二元可判定的制度事实）→
        不会被事后"发现"某个以前认为是自发的网络其实有制度干预。
      - "网络连通性"用独立于媒介使用的贸易路线/商品流通数据测量→不会被事后重标。
      → 排除钩子稳健,无事后扩大风险。

    criterion_tier_match: |
      【round_2 复核:不命中——连续量做方向/比较静态预测】

      被预测量（单一媒介主导程度）是连续量。预测均为方向性:(i) 收敛必然（高多边度→
      单一媒介主导，方向）;(ii) 赢家通吃（得分接近仍收敛，方向，空格预测）;
      (iii) 技术冲击可换主（权重重标→媒介切换，方向）。2×2 表是理论分析工具,
      operationalization 明认多边度是连续量且阈值需标定。→ 无 DED-006 失配。

    anti_talisman_cashed: |
      【round_2 复核:五条硬约束在位——三条概念层安全,两条实操层有控制但仍留灵活空间】

      逐条 round_2 压力测试:

      (1) 六维得分独立测量 + 权重独立推导:物理得分=周期表事实→真正独立。rank 协议
      提供了最低限度 pre-registration 框架。limitations 诚实地将 supporting anchor
      标注为 "directionally consistent illustrations, not pre-registered tests"——
      此为重要的诚实标注,降低了读者对权重标定精度的过度信任。→ 在位,剩余灵活空间
      属 should 级（见 measurement_orthogonality）。

      (2) E_network 正反馈独立测量:要求"接受度时间序列是否随时间自我强化"——
      考古代理（墓藏中货币金属出现比例的纵向变化）可操作。→ 在位。

      (3) 技术冲击独立验证:要求独立验证(a)技术冲击改变了某物理维度参数（电解法+铝产量
      /价格数据——可独立验证）;(b)原媒介加权得分确实低于新候选。(b) 依赖权重标定精度
      → 实操证伪力部分受限于(1)。文件已诚实标注铝案例为"机制演示而非完整链演示"。→ 在位。

      (4) 金银复本位护身符锁:三条独立判据（无制度干预+无功能分化+无收敛趋势）可操作。
      → 在位。与格雷欣法则的竞争解释已由 round_1 标注为 should→未在本轮升级。

      (5) 功能分化 vs 竞争独立判据（TDO+MS）:round_2 仔细审查了 TDO 和 MS 的操作化
      可行性——TDO 来自交换行为的横截面编码（交易规模区间×地理市场×商品类别）,MS
      来自交易完成时间/被拒率差异。两判据均可单时间点截面测量,不依赖 E 值时间序列→
      非循环判据。印度洋案例的判据施用演示（金 dinar 高价值跨洋 vs 银/铜/贝壳中低价值
      本地→TDO 低→功能分化成立）逻辑自洽。→ 在位,此为 round_1 最关键修复之一,
      round_2 确认其操作化方向正确（阈值仍需标定,但判据方向明确）。

      综合:五条约束在位。round_1 两个实操弱点（权重函数形式缺失、功能分化逃逸门）
      已通过 weight_protocol + TDO/MS 判据得到实质性修补。剩余灵活空间属 should 级。

    anchor_fact_check: |
      【round_2 复核:无致命事实错——三个 anchor 方向正确,两处 round_1 should 建议
      尚未在本轮文件修订中落地】

      (1) "旧大陆金、美索不达米亚银、殷商贝币——不同网络独立收敛到不同媒介":
      round_2 确认:文件第 189 行仍写"三个文明在没有互相借鉴的时空下"——
      旧大陆（地中海-欧洲-中东）与美索不达米亚（两河流域）通过新月沃地-安纳托利亚
      的贸易路线长期连通,严格意义上的"无互相借鉴"只在殷商 vs 西方旧大陆时成立。
      round_1 已将此标注为 should→作者在 author_response_round_1 中接受方向
      （"将在后续修订中区分'强独立'与'弱独立'"）但尚未在本文件修订。→ 未修,
      但不构成 required（不影响推论逻辑结构,三个文明确实使用了不同主导媒介这一核心
      事实无误）。

      (2) "铝的价格崩塌(1854-1890)——技术冲击改变物理维度参数":
      round_2 独立核查:Hall-Héroult 电解法(1886)使铝价从 >$17/lb 崩塌至 ~$0.30/lb
      是历史事实。文件已诚实标注铝未当过一般等价物→机制演示。→ 合规,事实无误。

      (3) "金银复本位制的反复崩溃——自发收敛力量冲破制度干预":
      历史事实方向正确——19 世纪法美复本位制反复面临市场比价偏离法定比价的困境。
      round_1 指出格雷欣法则用不同机制解释同一现象→标注为 should competition explanation。
      作者在 author_response_round_1 中接受方向但尚未在文件修订。→ 未修,不构成
      required（复本位崩溃的历史记录无误,锚的理论归属竞争不影响推论核心骨架）。

      → 无致命事实错。两处 round_1 should 未落地属优先级管理,不挡 verified 门。

    definition_vs_prediction: |
      【round_2 复核:通过——核心预测均为可证伪的经验主张,非定义性同义反复】

      三条件逻辑可证伪性 round_2 复核:
      (a) "找到连通度高、长时段双E接近媒介稳定并行":给出了独立于理论术语的操作化判据——
      连通度（贸易路线数据）、长时段（代际尺度）、E 值接近（被接受度测量）、无收敛趋势
      （时间序列无单调变化）。→ 可证伪的经验预测。round_2 追加检验:若面对双媒介并行案例,
      理论是否可通过"它们在功能分化"来消化? anti_talisman 第(5)条 TDO+MS 判据给出了
      独立于 E 值收敛结果的消化边界→消化路径被约束→条件(a)的证伪力得以保持。
      (b) "文明媒介在加权六维得分上系统性低于同期可获取替代品":逻辑上可证伪,实操证伪力
      受权重标定精度约束——但 weight_protocol 已大幅改善此问题（见 measurement_orthogonality）。
      (c) "多边度与媒介集中度无统计正相关":不依赖任何理论内部参数标定→证伪力最强。
      → 三个条件逻辑层均可被独立反例推翻,操作化程度不一但不构成定义性免役。通过。

    enumeration_and_species: |
      【round_2 复核:不命中——推论不声称穷举任何类别/物种】

      DED-027 的核心主张是动力学预测（收敛/赢家通吃/换主），非"N 类可枚举"的类型学。
      2×2 表是理论结构分析工具,非穷举声称。→ 此红旗不适用。但 round_2 仍主动猎
      "中等多边度"（既不高也不低）的中间地带案例,见 counterexample_hunt。

    primary_suspect_aim: |
      【round_2 复核:指对了——自认最弱腿（预测 ii 赢家通吃）准确;round_1 的两条隐腿
      已通过 #3（TDO+MS）和 should（格雷欣）处理;round_2 新发现一条轻微隐腿】

      文件自认:
      - primary_suspect:预测(ii)的 winner-take-all——最脆弱的预测,历史上金银长期并行
        是最直观的反例来源。
      - secondary_suspect:预测(iii)的技术冲击换主——因果链最长,铝未当过媒介。
      - unlikely_suspect:BR-L2-021 六维框架——物理事实确定性高。

      三条自我识别方向准确。

      round_1 发现的两条隐腿:
      (a) functional differentiation 逃逸门——已通过 anti_talisman 第(5)条 TDO+MS 修复。
      (b) 格雷欣法则竞争解释——已标注为 should,作者接受但尚未修订。

      round_2 新发现一条隐腿（should 级）:
      (c) 多宿主（multi-homing）成本未论证——赢家通吃预测依赖 E_network 正反馈驱动
      收敛到单一媒介。但标准网络经济学中,winner-take-all 是否发生还取决于 multi-homing
      成本:若同时接受两种媒介的成本很低（如一个商人可同时收金和银,不需要额外设备或
      知识）,则两媒介可稳定共存而不触发收敛。推论暗含"持有多媒介有交易摩擦"（需分别
      验证真伪/管理库存/计算兑换率），但未显式论证 multi-homing 成本为何在商品货币
      场景下足够高以致必然触发 winner-take-all。→ 此不构成反例（见 counterexample_hunt
      中对此的消化），但理论机制的完整性可通过补充 multi-homing 成本论证增强。
      → 建议在 derivation step 5 或 anti_talisman_clause 中增补一句:在商品货币情景下,
      多媒介并存带来额外验证/库存/兑换成本→E_network 正反馈有足够摩擦力压倒
      multi-homing 便利性→驱动收敛。或诚实标注此前提假设。

      平凡化检查 round_2 复核:抽掉三个非平凡增量→坍缩为"六维得分高的商品当钱,且局域
      权重不同→不同文明有不同媒介"（=BR-L2-021）→非平凡性完全依赖三增量。通过。

  counterexample_hunt: |
    【round_2 独立猎捕——四路新猎,均未获 scope 内净杀;其中一路发现 multi-homing
    成本论的理论间隙（should）】

    Round_1 已猎四路（印度洋贸易网/盐币/现代法币/多边度阈值）,均消化。Round_2 猎四路全新方向:

    === 猎路 1:多宿主（multi-homing）成本论——攻击 winner-take-all 的机制前提 ===

    【靶心:标准网络经济学中,winner-take-all 的充分条件包含高 multi-homing 成本】
    在平台经济学中（Katz & Shapiro 1985, Farrell & Klemperer 2007），即便存在强
    网络效应，如果用户可以低成本同时使用多个平台（multi-homing），则多平台可稳定
    共存。将此逻辑迁移至商品货币:

    假设一个交换网络中同时流通金和银,且两者的 E 值（被接受度）都较高。一个理性
    商人可以:同时接受金和银——这只需要他能鉴别金银真伪（可识别性维度的技能）、
    能储存两者、能在心里或账本上维护金银兑换率。multi-homing 成本=额外鉴别技能+
    额外储存空间+兑换率跟踪。若这些成本低于"只接受一种媒介时失去另一媒介持有者
    客户的损失",则同时接受两者是理性最优→双媒介均衡可持续→winner-take-all 不必然。

    消化分析:在商品货币的历史情境下,multi-homing 成本可能比表面看起来高得多:
    (a) 鉴别多种媒介真伪需要不同的技能/设备（金的试金石 vs 银的硝酸测试 vs 贝壳
    的品相鉴定→三种不同知识体系）;(b) 多媒介库存管理增加被盗/损耗风险;(c) 在无
    标准化兑换率的市场中,维护金银比价的知识成本不可忽略（需跟踪两地/两国市场行情）。
    这些额外摩擦力可能足以使 E_network 正反馈压倒 multi-homing 便利性,驱动收敛。

    关键:此消化是合理的——历史上大多数自发交换网络确实收敛到了主导媒介（而非稳定
    的多媒介均衡），这本身就是 multi-homing 成本足够高的间接证据。但推论未在文中
    显式论证此前提→理论机制的推导链缺一环。

    结论:未净杀——multi-homing 成本论可被商品货币场景的额外摩擦消化。但它揭示了
    推导中暗含但未声明的假设→ should:在 derivation step 5 或 anti_talisman_clause
    中增补多宿主成本论证。

    === 猎路 2:中国铜钱的跨域持久性（约 1000 BCE - 1900 CE）——攻击 "技术冲击可换主" ===

    【靶心:铜钱在中国及其影响范围内充当媒介超过两千年,期间经历多次重大技术冲击
    但媒介角色未换主】
    中国历史上至少有四次可能触发"技术冲击换主"的事件:
    (a) 铁器普及（战国-汉）:冶铁技术大幅进步→铁器变贱→但铜钱仍是主导媒介,铁钱
    仅在局部/战时出现（如南朝梁的铁钱、宋代四川铁钱区）。
    (b) 纸币发明（宋元）:交子/会子/宝钞的出现是"技术冲击"（纸比铜轻、可分性极高）→
    但纸币的信用崩溃（元末/明初宝钞贬值）后,铜钱复归主导→媒介换了又换回来了。
    (c) 白银涌入（明中叶约 1550-1650）:美洲白银经马尼拉大帆船大量流入中国→银的
    供给稳定性发生根本变化（供应暴增）。结果是银逐渐替代铜钱成为大宗交易的主导媒介——
    这恰是技术冲击（跨太平洋航运+美洲银矿开采技术）改变供给稳定性参数→媒介切换的案例!
    (d) 机制铜元（清末约 1890-1911）:机器铸造的铜元替代手工铸造的铜钱→这是生产
    技术冲击但媒介物质（铜）未变→不构成换主。

    消化分析:事件(c)（白银涌入→银替代铜钱成为大宗交易主导）实际上支持而非推翻
    预测(iii)——这是技术冲击通过权重重标（供给稳定性维度）引发媒介切换的历史案例。
    事件(a)和(b)若更仔细审视:(a)铁钱从未成为主导媒介,只在特定区域/时期作为补充→
    铁在六维得分上全面劣于铜（耐久性差——锈蚀;便携性差——价值密度低;同质性差——
    不同炉次品质差异大;可识别性差——易与其他铁器混淆）→铁不具备替代铜的物理基础。
    (b)纸作为媒介的物理耐久性极差（一撕就坏、遇水即毁）→在无中央银行的条件下,
    纸币的六维得分在耐久性维度上致命低→无法在自发网络中成为稳定媒介。

    结论:未净杀——事件(c)（白银替代铜钱大宗地位）正支持预测(iii)。事件(a)(b)的
    "未换主"均可被物理筛选框架消化（替代品的六维得分不够高）。

    === 猎路 3:战俘营/监狱经济中媒介的持久多样化——攻击 "赢家通吃" ===

    【靶心:Radford(1945)战俘营经典案例中,香烟是主导媒介,但其他媒介（巧克力、
    果酱、剃须膏片）在特定子市场中长期并存,未完全被挤出】
    Radford 的原报告指出,香烟虽是通用媒介（"currency of the camp"）,但特定商品
    （如巧克力、糖、剃须膏片）在特定圈子和时期也充当交易媒介。这不是全营单媒介
    的纯净画面,而是"一个主导媒介+若干次要媒介"的层次结构。

    消化分析:
    (a) 战俘营的人口规模（~2000-50000 人）远低于文明级交换网络→多边度有限→
    按推论自身逻辑,收敛压力可能不够强（对于预测(i)是正常的）。
    (b) 次要媒介的使用范围高度局限（巧克力作为"奢侈品圈子"的媒介,与日用品的香烟
    媒介形成功能分化→低 TDO）。
    (c) 战俘营的存续时间是 4-5 年（二战）→可能只是"未及收敛完成"的过渡态,而非
    "已达均衡的稳定并存"。
    (d) 最关键:香烟的主导地位随着时间增强而非减弱（Radford 明确记载香烟作为媒介
    的使用越来越普遍）→这正是收敛中的证据,非收敛失败的证据。

    结论:未净杀——战俘营案例实际展示的是"收敛中"（香烟的主导地位随时间增强）+
    功能分化（特定商品在特定子市场充当媒介）,不构成双E接近稳定并存的净反例。

    === 猎路 4:西非多种商品货币的长期并存（约 1400-1900 CE）——攻击 "自发单媒介收敛" ===

    【靶心:西非多个贸易网络中长期同时使用金砂/金块、盐块、cowrie shells、铜棒
    （manillas）、铁条、纺织品作为货币,部分媒介的交易域高度重叠】
    以尼日尔河流域-豪萨兰-约鲁巴兰为中心的贸易网络:
    - 金砂:高价值贸易（跨撒哈拉）、某些本地大额交易
    - Cowrie shells:中低价值日常交易——但也在中程贸易中使用
    - 铜 manillas:特定区域（尼日尔三角洲-贝宁）的中等价值交易
    - 盐块:Sahel 地区的日常必需品交易
    - 铁条:某些区域的聘礼/罚金/仪式支付但也用于日常交换

    这些媒介的交易域有重叠:盐块和 cowries 在 Sahel 的日常交易中可能被同一批商人
    在同一市场上同时接受。

    消化分析:
    (a) 金砂/cowries/盐块之间的 TDO 可能是中等而非高——金砂主要用于跨撒哈拉高端
    贸易,cowries 用于本地日常交易,盐块用于 Sahel 必需品交易。但 cowries 与盐块的
    TDO 可能较高（两者均用于 Sahel 日常交易）→若高 TDO+高 MS 且长期共存→可对
    预测(ii)构成挑战。
    (b) Cowries 的供给被欧洲人控制（16 世纪后欧洲商人大量输入印度洋 cowries→
    供给稳定性恶化）→实际上 cowries 在 19 世纪末经历了剧烈通胀和贬值→这符合
    预测(iii)（供给稳定性冲击→媒介角色瓦解）而非推翻它。
    (c) 此网络的多边度可能不够高:前殖民西非的运输条件（无轮车、无驮畜,靠头顶
    运输）使实际交换密度受限→可能未达到"高多边度"阈值。
    (d) 不同媒介有不同的供给来源和输入路径（金来自南部金矿、盐来自撒哈拉盐矿、
    cowries 来自印度洋经欧洲商人）→供给地理割据可能制造了部分子网络不连通。

    结论:未净杀——消化路径多样（功能分化+供给地理割据+运输受限降低多边度）。
    但此案例是已知的边界上最接近挑战预测(ii)的案例之一——若未来有更精细的
    历史数据（特别是 cowries/盐块的 TDO 测量）,可重新评估。

    综合:四路猎杀均未获 scope 内净杀反例。猎路 1（multi-homing 成本论）揭示了
    一个推导中暗含但未论证的前提→should。猎路 2 中的中国白银涌入案例实际支持
    预测(iii)。猎路 3（战俘营）实际展示收敛中。猎路 4（西非多媒介）是强候选但
    可被多条路径消化。核心骨架（E_network 发动机+赢家通吃+胜出偶然动力学三角）
    未被任何一击动摇。

  non_recurrence_of_ded004_007: |
    【round_2 复核:未复发——逻辑层三个可证伪条件健在,实操证伪窗口经 round_1 修复后
    显著改善;主干测量轴正交】

    DED-004（不可证伪循环）:
    Round_2 确认三条件在逻辑层均可被独立反例推翻:
    (a) 双媒介稳定并行→赢家通吃推翻。
    (b) 六维劣却胜出→物理筛选推翻。
    (c) 多边度-媒介集中度无正相关→E_network 发动机推翻。

    Round_1 发现的两个实操免疫模式:
    (i) "多边度阈值未标定":仍存在——任何多媒介并存案例可被 argue 为"多边度还不够
    高"。但此模式非逻辑免疫:若所有可观测的高多边度商品货币案例均不收敛,证据累积
    最终压倒理论。→ should awareness 而非 required。
    (ii) "functional differentiation 逃逸门":已通过 TDO+MS 操作化大幅封闭——
    现在判定"是否为功能分化"需满足低 TDO 或低 MS 的独立判据,不能随便 argue。
    → 实操证伪窗口显著改善。

    Round_2 追加检查:weight_protocol 的 rank 协议是否制造了新的免疫模式?
    测试:若找到一个文明媒介在六维物理得分上全面劣于替代品,理论的消化路径是
    "那个网络的权重不同→劣者在局域加权下得分更高"。rank 协议约束了权重可标定
    的范围（最重要的维度必须 rank≤2）,使这种消化不如 round_1 时那么自由——
    若劣者在被 rank≤2 维度约束的"最重要维度"上都劣→则消化不可用→证伪成功。
    → rank 协议为条件(b)提供了可操作的证伪触发条件→反 immune。

    → 未复发 DED-004。

    DED-007（焊死测量轴）:
    Round_2 确认:
    - 六维物理得分:独立于交换结果的物理化学测量→真正正交。
    - E_network:接受度时间序列独立于最终"谁胜出"→可独立测量。
    - 局域网络特征:贸易路线/运输距离/冶金水平→可独立于"谁是媒介"观测。
    - 权重 rank 协议:秩位由独立于胜出者的规则决定→方向约束确保 sign 独立于结果。
    → 主干测量轴正交。剩余权重灵活空间不影响概念正交性。
    → 未复发 DED-007。

