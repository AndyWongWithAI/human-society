id: ADV-REVIEW-046
type: adversarial_review
reviews: DED-041
layer: L3-deductions

人话摘要: |
  对 DED-041(数字可处理性×道德内化:具身共情的系统性削弱)的 round_1 独立对抗审查。
  裁 needs_revision:核心机制(BR-L2-025可处理性→具身信号剥离→BR-L2-019发育窗口内化受阻
  →认知-情感共情解耦)产生了真正的非平凡增量——"情感共情降+认知共情不降"的解耦签名
  不在任何承重砖中。未重蹈 DED-004/DED-007。反例猎捕无净杀(远程共情/在线情感支持/
  数字原住民高共情均被消化)。四条 should 级缺陷挡住 verified:(1)derivation step 2
  将"可处理性→具身信号剥离"归因于 BR-L2-025,但 BR-L2-025 仅确立机器可处理性,
  未探讨具身信号剥离——此链接是 DED-041 自己的扩展,非砖直接支持;(2)屏幕社交时长的
  分组阈值(>4h/<2h)零经验锚定——缺少校准依据或敏感性分析计划;(3)real_world_anchors
  自认现有 IRI 代际下降数据(含认知共情成分)与预测(b)的"认知共情不降"存在张力——
  应从前台的 weak confidence 标注提升至 falsification_trace 的结构性风险;(4)操作化
  仅定义儿童(5-11)+青春期(12-18),但预测(d)需对比成年组(19-25)——成年组的操作化缺失。
  零 required 级缺陷,核心未塌。

target: DED-041
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。
  评分卡红旗 13 条逐项攻+反例猎捕(必做)+DED-004(不可证伪循环)/DED-007(测量轴焊死)
  复发检查。裁决三态照评分卡:verified 需同时满足(1)无 required 缺陷(2)亲自猎捕无 scope 内
  活反例(3)未重蹈 DED-004/007。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新上下文, 与作者无关)"
  verdict: needs_revision
  verdict_note: |
    本推论的核心机制——BR-L2-025 的可处理性通过选择性编码将具身情感信号系统性地排除在
    数字信息流之外,使发育期大脑(BR-L2-019 的 P1+P3 窗口)缺少了建立完整情感共情回路的
    必要输入,从而产生"认知共情(语义渠道)保持完好、情感共情(具身渠道)系统性萎缩"的
    解耦签名——逻辑骨架完整且优美。三块承重砖的合取产生了单一砖不包含的非平凡增量:
    BR-L2-019 只讲内化需要具身反馈但未涉及数字媒介;BR-L2-025 只讲数字信息的机器可处理性
    但未探讨具身信号的命运及共情回路后果;THEOREM-内化只有内化一般机制而未区分具身vs
    认知共情维度。认知-情感共情解耦这一签名是真正的焊接增量——"屏幕时间有害"的流行叙事
    预测全面下降,"社会位移假说"预测同比例受损,均不产生解耦格局。

    DED-004(不可证伪循环)与 DED-007(测量轴焊死)均未复发。屏幕社交时长的测量(自报日志+
    设备API)与 AI/ACC 激活(fMRI BOLD 信号)是完全异源的测量通道——不存在"自变量由因变量
    算出"的数学恒等式焊死。anti-talisman 五禁令封死了最常见的逆向推断逃逸路径——尤其是
    禁令(4)"禁止神经路径替代逃逸"直接钉住了本推论最危险的免疫策略,写得诚实且有力度。
    falsifiability 五条注册口径(a)-(e)覆盖了核心赌注、解耦签名、剂量-反应、发育窗口、
    媒介保真度梯度——攻击面完整且分层。五个 falsifiability 条件的前件均可独立于结果测量,
    未发现"事后由结果反推前件"的循环。

    反例猎捕无净杀。三条主要反例路线:(1)"远程共情"——数字媒介让个体接触全球苦难
    可能增强而非削弱共情;被消化为认知vs情感共情的区分:远程共情激活认知理解(自洽于
    预测(b)的"认知共情不降"),但 AI/ACC 层面的情感共情是否同等激活是推论的实证赌注。
    (2)"在线情感支持社区"——每天数小时在 Discord/危机热线通过文字提供情感支持的
    青少年可能反而强化了情感共情回路;被消化为推论预测的是具身情感信号的缺失对发育期
    大脑的平均效应——主动情感支持实践可能构成对冲因子(类似于"有些人在健身房练肌肉
    可以抵消久坐的负面效应"),但群体平均水平仍可能显著低于面对面对照组。此路线在个例
    层面不构成净杀,但在群体层面是一个可检验的竞争假说(情感支持动机是否调节了具身
    剥离的效应?)。(3)VR 社交平台(VRChat 等)的全身体追踪+空间音频可能保留了足够的
    具身信号;被作者 scope 声明消化(射程限于 2020s 主流媒介)。

    四条 should 级缺陷挡住 verified(零 required):

    ①【should — 推导链 attribution】derivation step 2 的标题"BR-L2-025:数字媒介的
    可处理性=具身信号的系统性剥离"将 BR-L2-025 未确立的主张归因于该砖。BR-L2-025
    确立的是:数字编码信息具有通用机器可处理性——可被机器读取/搜索/变换/重组,且
    边际复制成本趋零。全文讨论了"质变而非量变",讨论了"媒介属性→社会结构"的因果
    方向,但从未涉及"具身信号"这一概念,更未论证机器可处理性必然以具身保真度为代价。
    DED-041 step 2 的核心论证——"机器可读的信号是那些可以量化、编码、传输和合成的信号;
    具身信号(毫秒级微表情/声音频谱细节/3D身体语言/瞳孔同步)是模拟的、连续的、全带宽的,
    数字编码将它们采样、压缩、降维为离散符号流"——是一个新颖且有理的理论主张,但它
    不是 BR-L2-025 的"确立",而是 DED-041 从 BR-L2-025 出发的创造性扩展。当前表述
    模糊了"砖说了什么"与"我在此基础上推断出什么"之间的界线,读者可能误以为"具身信号
    剥离"有 BR-L2-025 的 IEA=1.3/weakly_verified 作为独立支撑。
    建议修复:将 step 2 拆分为两步——(2a)BR-L2-025 确立数字信息的通用机器可处理性;
    (2b)本推论论证:机器可处理性产生了对可编码信号的选择效应,具身情感信号因其模拟/
    连续/全带宽特性而在此选择中被系统性降维和剥离——这一论证是 DED-041 的理论贡献,
    不由 BR-L2-025 独立支撑,其认识论地位取决于整个推导链的合取能否产出可检验的预测。

    ②【should — 分组阈值零锚定】falsifiability(a)将数字交互组定义为">日均4小时屏幕
    社交",对照组为"<日均2小时屏幕社交"。这两个阈值(4h/2h)在文件中无任何经验校准
    依据——为什么是 4h 而非 3h 或 5h?为什么是 2h 而非 1h 或 3h?此外,2-4h 区间
    的个体被排除在组间比较之外(虽然剂量-反应(c)覆盖了连续测量,但(a)(b)的组间设计
    仍依赖阈值切分)。阈值移动会将边界个体重新分类,进而改变统计检验的结果。此缺陷与
    DED-035 ADV-REVIEW-040 的 should-1(可测量性三维等权平均+阈值零锚定)同构。
    建议修复:提供阈值选择的事前辩护(如基于现有屏幕时间研究的常用切分点/日均使用
    中位数),或诚实标注为"暂定操作值,承诺在见任何 fMRI 数据前完成阈值敏感性分析
    的注册(如 ROC 分析确定最优切分点/在不同阈值下重复主分析)",并在 limitations 中
    注册"若主要结果对阈值选择敏感(如 3h 组显著但 4h 组不显著),推论的稳健性降级"。

    ③【should — IRI 代际趋势与预测(b)的张力足够严重,应从前台'weak confidence'提升至
    falsification_trace 或 primary_suspect 层】real_world_anchors 的第三条锚(Twenge
    2018/Konrath 2011)诚实标注了现有代际数据的两个不利事实:(i)数据为横截面/代际趋势,
    非个体因果;(ii)报告的 IRI 下降含 cognitive empathy 成分(PT 子量表)——与本推论
    预测的"认知共情不降"不一致。作者将此锚标为 confidence:weak,并在 falsifiability(b)
    中注册了"若认知共情也降→解耦签名被证伪"的裁决。这在大体上诚实——但"已有数据的
    方向恰与核心预测之一相反"这件事的严重程度,不应只停留在 real_world_anchors 的一条
    weak anchor 中。它应该出现在 falsification_trace 中作为本推论的一个结构性风险:
    预测(b)是"解耦"签名的一半——若(b)在见任何新的 fMRI+IRI 个体层面数据前就已经
    被代际层面的生态学数据所质疑,则推论起步就带着实证逆风。当前处理将逆风隔离在
    "weak confidence anchor"的角落,未充分传导到推论整体的风险评估中。
    建议修复:在 falsification_trace 中增加一条 risk:"已有代际 IRI 数据的方向不利于
    预测(b)——若未来的个体层面 fMRI+IRI 研究也发现 PT 子量表在数字交互组显著下降,
    解耦签名将在此轮即被证伪。本推论区分生态学关联(代际趋势)与个体机制(fMRI+IRI)
    是方法论上正确的,但不应低估信号方向一致的预警价值。"或诚实保留现有结构但将
    weak anchor 中的这个张力在 review_summary 中简要概括(以便未来审查者一眼看到)。

    ④【should — 成年组(19-25岁)的操作化缺失】operationalization 节仅定义了儿童期
    (5-11岁)和青春期(12-18岁)的 screen_social_hours_per_day 测量。但预测(d)明确
    要求对比青春期组(12-18)与儿童组(5-11)和成年组(19-25)的效应量——成年组同样需要
    屏幕社交时长的回顾性测量(回顾其青春期的数字交互)或当前测量(若成年组的数字交互
    模式持续至 19-25 岁)。当前 operationalization 未覆盖这组被试的测量方案。这不是
    致命问题——成年组的屏幕社交时长可以用相同的双通道方法(自报+设备 API)测量其当前
    或近期(19-25)的数字交互——但应明确注册:成年组的测量是"回顾性报告其青春期的
    屏幕社交时长"(回忆偏差更大)还是"测量其当前(19-25)的屏幕社交时长"(若推论假设
    成年后数字交互不影响已建立的共情回路,则当前测量与发育窗口测量是不同构念)。
    建议修复:在 operationalization 中增加成年组的测量方案注册,并明确成年组测量的
    构念是"成年后数字交互"(用于排除成年后影响的混淆)还是"回顾性发育窗口数字交互"
    (用于直接检验发育假说)。

    综合:推论逻辑可证伪、无 brick=conclusion、反例猎捕无净杀、DED-004/007 未复发。
    四条 should 均为操作化/注册/归因层面的可修补问题,不使核心逻辑塌陷。修复后可达
    verified。

  red_flag_findings:
    brick_conclusion: |
      未命中(攻不穿)。逐砖核查:

      BR-L2-025(数字媒介可处理性,weakly_verified):核心主张为数字编码信息具有通用机器
      可处理性——可被机器读取/搜索/变换/重组,边际复制成本趋零,这是 Innis 时间/空间
      偏向之外的第三维("可处理性偏向")。全文讨论的是信息在社会系统中运作方式的质变,
      不含"具身信号""共情""内化""发育窗口""认知-情感解耦"等任何 DED-041 特有概念。
      尤其不含"可处理性以具身保真度为代价"这一 DED-041 核心主张。

      BR-L2-019(道德内化发育窗口,verified):核心主张为道德内化依赖三个条件——安全依恋
      (P1,内化能力基础设施)、对等性信号(P2,内化维持条件)、青春期二阶反思窗口(P3,内化
      重组关键期)。全文讨论的是"良心如何长出来"的一般发育条件,不含"数字媒介""屏幕
      社交""认知vs情感共情""AI/ACC"等概念。BR-L2-019 的具身反馈概念(照护者的抚触/
      声调/面部表情)在其语境中是内化的一般前提,不是针对数字媒介的诊断。

      THEOREM-moral-internalization(道德内化定理):内化的一般机制(P1-P3),不含媒介
      特异性,不含共情维度区分。

      AXIOM-002(信息熵增公理):信息无维护必衰减。不含共情或数字媒介相关论述。

      "数字交互通过具身信号剥离→发育窗口内化受阻→认知-情感共情解耦"这一完整结论未在
      任何承重砖中原文或近义出现。三砖合取产生的增量包括:(i)具身vs认知共情的维度区分
      (不在任何单砖中);(ii)数字媒介导致的情感共情特异性萎缩(不在任何单砖中);(iii)认知
      共情不降甚至增强的交互格局(不在任何单砖中);(iv)媒介保真度梯度(面对面>视频>语音>
      文字)作为可检验排序(不在任何单砖中)。BR-L2-025 不预测共情后果,BR-L2-019 不涉及
      数字媒介,THEOREM-内化不区分共情维度。无为本推论窄化的专用砖。
      ⇒ 不判。

    nontriviality_cell_check: |
      未命中但附条件(攻不穿但 derivation step 2 的跨度值得标注)。2×2 判表逐格:

      格(高数字化,情感共情低)——【非平凡格】:BR-L2-019 单独看预测"内化需要具身反馈"
      (一般性),不含"数字媒介特别地剥夺具身反馈"。BR-L2-025 单独看预测"数字信息可被
      机器处理",不含"这种处理以具身信号为代价"也不含"共情回路的发育后果"。THEOREM-
      内化只有内化一般机制。将此格填充为"成立"所需的充分条件是三砖合取+(DED-041 自行
      论证的:可处理性→具身信号被选择性排除)。非平凡增量的可信度系于这个自论证环节——
      它不是砖本身携带的,而是 DED-041 的理论贡献。若此自论证被削弱(如实证发现数字媒介
      的具身信号剥离程度远小于推论假设),则非平凡格退化为"推断过强的合取"。

      格(高数字化,认知共情正常)——【解耦签名的另一半,非平凡】:BR-L2-025 不预测"语义
      渠道完好"(它只说机器可处理,没说这对人的认知学习是否足够);BR-L2-019 不预测"数字
      交互不影响认知共情"(它不区分共情维度)。此格若被推翻(高数字化组认知共情也降)→
      解耦签名失效。

      格(低数字化,情感共情正常)——【基准格】:面对面交互保持完整具身输入,AI/ACC 正常
      发育。此格是 2×2 的自然基准面。

      格(低数字化,认知共情低)——非本推论射程,不证伪也不体面本推论。

      边缘性警告:推导链中关键一步(可处理性→具身信号剥离)不由任何砖独立支撑,而是
      DED-041 自己的论证。此跨度的认识论地位低于"由多块 verified 砖直接导出的经验预测"。
      这不影响非平凡格的【形式】成立——单砖推不出、焊接有增量、格子可被反例填充。
      但增量认识论地位因 step 2 的自论证性质而略低于理想情况。与此问题共享同一根源的
      是 should-1。
      ⇒ 不判 required。边缘性诚实标注如上,记 should-1。

    measurement_orthogonality: |
      未重蹈 DED-007(攻不穿)。自变量(屏幕社交时长:自报时间日志+设备屏幕时间 API——
      iOS Screen Time / Android Digital Wellbeing)与被预测量(AI/ACC 的 BOLD 信号激活:
      fMRI 疼痛共情范式;IRI 问卷得分)在概念和测量上完全异源:

      (a)屏幕社交时长来自行为追踪(设备前台时长+自报日志),不涉及任何神经测量或共情
      构念。设备 API 独立于被试的主观报告和被试的脑活动——它记录的是操作系统级别的
      应用使用统计,不可能被"被试的 AI/ACC 激活水平"所反向决定。

      (b)AI/ACC 的 BOLD 信号来自血氧水平依赖的 fMRI 测量——是神经活动的间接代理,
      由实验刺激(pain>no-pain contrast)驱动。BOLD 信号不由屏幕时间 API 算出的任何
      函数决定,屏幕时间也不由 BOLD 信号算出的任何函数决定。

      (c)IRI 问卷得分来自自报 Likert 量表——独立的心理测量通道,与 fMRI 和屏幕时间
      API 均正交。

      不存在 DED-007 式的数学恒等式焊死。也不存在 DED-035 见过的"高可测性行业的量化
      痕迹公开存在部分因为行业碎片化"那种反馈环——屏幕时间 API 记录的是设备使用事实,
      不依赖于被试的共情水平,不存在"高共情者被设备 API 报告为低屏幕时间"的逆向因果。

      但有一条预防性标注:若高数字交互组的被试在 fMRI 扫描中对疼痛图片产生习惯化效应
      (因为日常在屏幕上看过大量类似内容→脱敏),则 AI/ACC 差异可能反映的是视觉刺激
      习惯化而非情感共情的特异性萎缩。DED-041 在 limitations 中已注册"需控制一般情绪
      反应性(如对非疼痛负面图片的 AI 反应)作为基线以分离共情特异性衰减 vs 一般情感
      钝化"——此控制方案若被严格实施,可排除此混淆。
      ⇒ 不判。

    scope_hook_independent_of_result: |
      未命中(攻不穿)。三项 excluded_outcomes:

      (1)"数字交互导致全面共情下降(认知+情感均降)"——按推论核心签名(解耦而非全面下降)
      的逻辑独立性事前排除。干净。此排除还附带了诚实的证伪路径:若全面下降被观测到,
      (b)被证伪,但"不说明数字对共情无影响"——推论的存活不依赖于此排除成为免疫条款。

      (2)"AI/ACC 激活下降但被试在行为助人任务中表现同等"——按"认知共情可独立驱动
      助人行为"的机制逻辑事前排除。此排除被 anti-talisman(4)独立钳制——虽然行为不降
      不直接证伪推论,但也"不得诉求替代路径来救活"。排除与 anti-talisman 形成了对称
      约束:(2)允许此结果不证伪推论,anti-talisman(4)禁止将此结果解释为"情感共情其实
      没萎缩"。此双闸设计精巧,两侧同时锁死防止免疫膨胀。干净。

      (3)"成年后改用数字社交导致共情下降"——按推论射程边界(发育窗口限于儿童-青春期)
      的机制逻辑事前排除。此排除合理——成年后的机制走 BR-L2-019 P2(对等性信号瓦解)
      而非 P1+P3(发育窗口),属于不同因果路径。作者的诚实指引(DED-024 延伸)到位。
      干净。
      ⇒ 不判。三项排除均事先定义为逻辑/机制边界,非按结果事后开脱。

    criterion_tier_match: |
      未命中(攻不穿但附 should,对应 verdict_note should-②)。推论使用连续量(屏幕社交
      时长/AI-ACC 激活/IRI 得分)配合分组阈值(>4h vs <2h)进行组间检验,并以剂量-反应
      相关(c)作为连续维度的补充检验。2×2 判表使用二档(高vs低数字化 × 情感vs认知共情),
      匹配 4 格的交叉预测格局。未将连续量硬切为不适配的二分类。

      但分组阈值(>4h/<2h)为零经验锚定的纯断言——为什么是 4h 而非 3h/5h?为什么是 2h
      而非 1h/3h?阈值移动将导致边界个体重分类,直接影响预测(a)(b)的统计结论。此缺陷
      需要至少提供阈值选择的事前辩护,或诚实标注为暂定值并注册敏感性分析计划(在见任何
      fMRI 数据前,测试不同阈值下的主效应稳健性)。
      ⇒ 不判 required。记 should-2。

    anti_talisman_cashed: |
      大体兑现,无 required 缺陷。五条禁令:

      【已兑现】(1)禁止由"AI/ACC 激活低"反推"该组具身信号输入不足"——屏幕社交时长
      必须由独立于 fMRI 的通道(自报日志+设备 API)测量。此禁令正确封堵了最常见的
      "看结果重新分组"的逃逸。

      (2)禁止由"认知共情问卷得分与对照组无差异"反推"问卷测量不敏感"——IRI PT/EC
      已在(a)(b)注册前选定。此禁令锁定了测量工具,防止用"工具有问题"来解释 null result。

      (3)禁止由"AI/ACC 差异不显著"反推"fMRI 任务未能有效唤起共情"——疼痛共情范式
      是领域最稳健的激活范式。此禁令锁定了实验范式,防止用"范式不灵敏"来解释 null result。

      (4)【禁止神经路径替代逃逸】若 AI/ACC 下降但行为层面情感共情(助人/情绪传染/
      面部模仿)不降,禁止声称"情感共情未萎缩,只是换了神经实现路径"。AI/ACC 是注册的
      情感共情神经标记——若神经层面坐实但行为层面完好,推论被削弱而非被佐证。此禁令
      是五条中最关键的一条:它钉住了本推论最危险的免疫策略(声称"共情还在,只是换了
      脑区"),且与 excluded_outcome(2)形成对称约束。写得诚实有力。

      (5)【对称保护】禁止由"AI/ACC 激活正常"反推"屏幕社交测量高估了真数字交互比例"——
      null result 应首先接受(a)被证伪的可能性,而非归因于测量误差。

      【张力标注】禁令(4)与 excluded_outcome(2)之间的互动存在一个微妙但良性的张力:
      excluded_outcome(2)说"AI/ACC 下降+行为不降→不证伪推论"(因为认知共情可补偿
      行为),而禁令(4)说"AI/ACC 下降+行为不降→禁止声称情感共情未萎缩"。这两个声明
      的方向实际上一致——都承认 AI/ACC 下降意味着情感共情萎缩,分歧仅在于"行为不降"
      是否削弱"情感共情萎缩"的实践意义。excluded_outcome(2)说"不证伪"(因认知共情
      补偿是推论自洽的),禁令(4)说"不救活"(因功能等效性不依赖特定回路时推论被削弱)。
      这是一个"推论的预测未被推翻但推论的实践重要性被降级"的中间地带——两个声明合力
      阻止了此地带向任何一端的免疫膨胀。此张力是设计精巧而非逻辑矛盾。不判。

      【实践可兑现性】与 DED-035 的 should-4(可测量性编码的"知识污染")不同,DED-041
      的 anti-talisman 面临的实践可兑现性挑战较轻:屏幕社交时长的双通道测量(自报日志+
      设备 API)均为客观/半客观指标,不要求编码者做"该被试的社交交互算不算屏幕社交"
      的主观判断——设备 API 给出 app 前台时长(客观),自报日志给出该时段内实际社交
      交互的占比(半客观但可交叉验证)。编码者不需要知道被试的 AI/ACC 激活水平来做测量。
      相比 DED-035 的"可测量性编码需要在知道行业边界数据前锁定"的困难,此处的独立
      测量在实践中可行得多。
      ⇒ 不判 required。五禁令框架完整,张力为良性,实践可兑现性良好。

    anchor_fact_check: |
      无致命事实错。逐锚:

      锚1(AI/ACC 作为疼痛共情的稳健神经签名,Lamm et al. 2011 meta-analysis):
      Lamm et al.(2011, NeuroImage)涵盖>200 个 fMRI 研究,确证前脑岛(AI)和前扣带回
      (ACC)在疼痛共情中一致激活——这是 fMRI 领域最稳健的发现之一。AI/ACC 激活与自报
      共情关怀正相关。作者标注 confidence:strong——合理。此锚不直接证明"数字→AI/ACC
      下降",而是建立 AI/ACC 作为情感共情的 valid proxy——这是操作化的基础,非经验主张。
      ⇒ 不判。

      锚2(GPS 导航与空间记忆退化,Bohbot et al. 2007; Dahmani & Bohbot 2020):
      长期依赖 GPS 导航者海马体灰质密度降低,无 GPS 时导航准确率下降——这是认知神经
      科学中比较稳健的发现(虽然不是无争议——后续研究对效应量和因果关系方向有讨论)。
      作者将此锚定位为"机制同构锚"(外部工具替代某类认知输入→对应神经回路萎缩),标注
      confidence:moderate——合理。机制同构性成立(GPS:空间导航的海马回路 :: 数字社交:
      情感共情的 AI/ACC 回路),但不是直接证据。诚实标注了"不直接证明共情回路的类似退化"。
      ⇒ 不判。

      锚3(数字媒介与青少年共情的横截面研究,Twenge 2018/Konrath 2011):
      Twenge et al.(2018, Emotion)报告美国大学生自报共情(IRI)在 2000-2015 年间显著
      下降,与智能手机普及时间趋势一致。Konrath et al.(2011)的 meta-analysis 报告类似
      代际趋势。作者诚实标注:(i)横截面/代际趋势,非个体因果证据;(ii)报告的 IRI 下降
      含 cognitive empathy 成分——与本推论的"解耦"预测不完全一致;confidence:weak。
      【此诚实标注的正确性值得肯定——但张力的严重程度被低估,见 should-3】。
      ⇒ 不判 required。记 should-3。

      反例(数字原住民的高共情——"远程共情"):
      分析识别了本推论面临的核心反例路线:数字媒介让个体接触全球人类苦难(战争/灾害/
      不公),通过视频和叙事产生"远程共情"。消化策略(认知vs情感共情的区分)是自洽的——
      远程共情激活认知共情(知道远方有人在受苦),但 AI/ACC 层面的情感共情激活是否与
      面对面同等强度是推论的实证赌注。标注 status:counterexample_candidate——诚实。
      ⇒ 不判。反例消化策略自洽,AI/ACC 层面是否成立需 fMRI 数据裁决,属推论的核心实证赌注。

      边界案例(视频通话的具身保真度上限):
      分析讨论了全息投影/VR/触觉反馈等未来技术是否可消弭"数字-面对面"的具身信号缺口。
      作者的 scope 声明("射程限于当前主流数字媒介(2020s),不声称技术天花板已永久触顶")
      是诚实的边界注册——推论不假装预测未来所有技术形态。此边界不影响核心主张。
      ⇒ 不判。

    definition_vs_prediction: |
      未命中(攻不穿)。因果链的多个环节均可被独立观测否决:

      (a)组间 AI/ACC 差异不显著(d<0.3, p>0.05)→核心主张被证伪。独立攻击面:组间
      fMRI contrast 不依赖推论本身的任何假设即可测量。

      (b)数字化组 IRI PT 得分显著低于对照组→解耦签名被证伪。独立攻击面:IRI PT 的
      组间差异可由标准心理测量独立检测。

      (c)AI/ACC 与屏幕社交时长的偏相关(r_partial)不显著→因果链中的具身剥离机制断裂。
      独立攻击面:偏相关系数可由标准回归模型独立估计。

      (d)青春期效应量不显著大于儿童/成年组→发育窗口时机特异性不成立。独立攻击面:
      多组 Cohen's d 的 bootstrap 比较独立于推论机制。

      (e)媒介保真度梯度排序被违反→信号剥离随编码抽象程度递增的机制被削弱。独立攻击面:
      Friedman 检验/线性对比独立于推论机制。

      五个攻击面均可被观测数据独立否决——不是"必然为真"的定义。"数字交互""屏幕社交
      时长""AI/ACC 激活""IRI PT 得分""年龄组"均有独立于"推论核心主张"的操作化定义。
      即使最依赖理论解释的环节(如"AI/ACC 下降是否特异性地反映情感共情萎缩"),也有
      anti-talisman(4)的前向封堵——不得在结果不利时将 AI/ACC 重新解释为"其他神经信号"。
      ⇒ 不判。

    enumeration_exhaustive: |
      未命中(不适用)。DED-041 不声称对某现象做穷举分类。2×2 判表是交叉分类框架
      (数字化率×共情维度),用于定位非平凡预测格,非"共情下降共有 N 种类型"的分类学
      声称。discriminant_validity 枚举四种相邻理论(屏幕时间有害/社会位移/回音室/
      DED-034)是判别效度验证,非穷举分类——作者未声称"只有这四种替代解释"。
      ⇒ 不判。红旗条件不满足,不适用。

    primary_suspect_accurate: |
      未命中 required(攻不穿但附 should-1 的关联标注)。

      primary_suspect 指向"BR-L2-025 的可处理性→具身信号剥离"这一链接——此自诊断
      准确。三个子风险(程度/补偿/替代路径)覆盖了该链接的主要脆弱面:
      (1)程度——具身信号剥离的量级是否大到可观测?
      (2)补偿——大脑能否从稀疏信号中提取足够统计规律?
      (3)替代路径——语义渠道能否实现情感共情的功能等效?

      secondary_suspect 指向"BR-L2-019 的发育窗口期边界"——此自诊断同样准确。若发育
      窗口不在青春期而在更早(0-3岁)或更晚(成年早期),推论的发育特异性预测(iv)被推翻,
      虽跨年龄的普遍预测(a)-(b)可能存活。

      终极自反("本 primary_suspect 本身暴露了推论潜在的免疫力:若 AI/ACC 下降但行为
      层面完好,可声称神经路径替代")与 anti-talisman(4)形成呼应——作者意识到了推论
      最危险的免疫策略并预先在前门(anti-talisman)封堵,诚实。

      【关联 should-1】primary_suspect 指向的"可处理性→具身信号剥离"链接恰好是
      derivation step 2 中 attribution 过度的地方——BR-L2-025 本身不支撑"具身信号剥离"
      这一中间主张。primary_suspect 正确地识别了推论的最弱环节,但这一环节之所以弱,
      不仅因为经验上可被程度/补偿/替代路径挑战,还因为它在推导链中的承重依赖(对
      BR-L2-025 的 attribution)本身需要澄清。
      ⇒ 不判 required。记 should-1 关联。

    caliber_complete_registration: |
      大体兑现,附 should(对应 verdict_note should-②)。

      【已注册的口径】
      (a)组间差异口径:>4h vs <2h,独立样本 t/ANCOVA(控制年龄/性别/总社交时长/一般
      情绪反应性),Cohen's d,显著性阈值 p>0.05 且 d<0.3 为"无显著差异"。
      (b)认知共情不降口径:IRI PT 子量表,d<0.3,p>0.05。
      (c)剂量-反应口径:r_partial<-0.3,p<0.05,控制面对面社交时长。
      (d)发育窗口效应量口径:d_adol - max(d_child, d_adult) 的 bootstrap 95% CI 不包含零。
      (e)具身保真度梯度口径:序数排名(面对面>视频>语音>文字),Friedman 检验或线性对比。

      屏幕社交时长的定义包含了关键边界裁决:"同物理空间内的屏幕共用归类为面对面(具身
      信号在场),远程屏幕交互归类为数字(具身信号剥离)"——此裁决在见数据前锁定,边界
      案例(多人同屏玩游戏)有明确的归类规则。IRI 测量也包含了事先裁决:"若 EC 得分随
      屏幕时长下降而 PT 得分不降,优先以 fMRI 裁决(EC 的部分条目确实捕捉情感共情),
      推论的核心签名为 AI/ACC 降+PT 不降,EC 为辅助测量"——预先声明了测量工具的优先级,
      防止事后选择性使用子量表。

      【未注册的——should-2】
      分组阈值(4h/2h)缺乏事前锚定逻辑。阈值的选择(4h vs 3h vs 5h)会直接影响预测(a)(b)
      的组间比较结果。不同于 DED-035 的"可测量性阈值 0.7/0.3"(那里至少部分可辩护于
      三分位数的直觉),此处的"4h"是更具体的日时长阈值——而青少年的日均屏幕时间在不同
      国家/年份/社会经济阶层差异巨大。若某研究中的中位数为 3.5h,则 4h 切分将把大多数
      被试归入"低数字交互"组,降低了统计效力;若中位数为 6h,则 4h 切分将使两组的样本量
      极度失衡。

      此外,2-4h 区间的中间组在预测(a)(b)的组间比较设计中被排除——此决定本身也是一种
      "口径选择"(极端组设计 vs 全样本连续回归)。虽然剂量-反应(c)覆盖了全样本连续分析,
      但(a)(b)作为"核心命门"的组间比较依赖于排除中间组的口径。若全样本连续回归(c)显著
      但极端组比较(a)不显著,哪个裁决优先?当前 falsifiability 节未规定(c)vs(a)不一致
      时的裁决优先级。
      ⇒ 不判 required(口径本身已注册,仅阈值锚定和中间组处理需补)。记 should-2。

    data_source_common_root: |
      未命中(不适用)。DED-041 的锚点证据来自不同的实证领域(神经科学 fMRI meta-analysis/
      认知心理学 GPS 研究/社会心理学问卷调查),这些领域的底层数据完全独立——fMRI 的
      BOLD 信号与 GPS 导航行为数据与 IRI 自报问卷不共享任何数据采集源头。不存在"WB 用
      CNBS 底层数据"式的同根问题。
      ⇒ 不判。红旗条件不满足,不适用。

    api_accessibility_masquerade: |
      未命中(不适用)。DED-041 不依赖 API 查询或 MCP 工具作为证据来源。所有锚点证据
      来自已发表的科学文献(Lamm et al. 2011/Bohbot et al. 2007/Twenge et al. 2018 等),
      不是"通过 API 查到"的多源数据。本红旗在此推论中不触发。
      ⇒ 不判。红旗条件不满足,不适用。

  counterexample_hunt:
    strategy: |
      按评分卡要求,主动构造可证伪核心主张的干净案例。核心主张:以数字交互为主的发育期
      个体,情感共情(AI/ACC)显著低于面对面交互对照组,但认知共情(IRI PT)无显著差异——
      即"认知-情感共情解耦"签名。反例猎捕目标:找到满足数字交互条件但解耦签名不成立
      的干净案例,或在 scope 内存在解耦签名反向成立(情感共情完好)的系统性类别。

    case_1_remote_empathy:
      description: |
        "远程共情"——数字媒介让个体接触全球范围内的人类苦难(战争/灾害/不公),通过视频
        和叙事引发强烈的情感反应。如果数字暴露于远程苦难能产生与面对面目睹他人痛苦同等
        强度的 AI/ACC 激活,则"具身信号剥离→情感共情萎缩"的机制被挑战。
      verdict: counterexample_candidate
      digestion: |
        核心消化策略在于"认知vs情感共情"的区分——远程共情确实增强了对远方苦难的认知
        共情("我知道那里的人在受苦"),这与本推论预测的"认知共情通过语义渠道保持完整/
        增强"自洽。但远程共情是否真正激活了与面对面目睹他人痛苦同等强度的 AI/ACC 反应,
        是本推论的实证赌注——在没有 fMRI 证据的情况下,此案例处于"可能支持也可能削弱"
        的悬置状态。若未来的 fMRI 研究发现在观看战争/灾害视频时的 AI/ACC 激活与面对面
        目睹他人痛苦无显著差异→推论的"具身信号剥离"机制被严重削弱。当前状态:此反例的
        裁决依赖于尚未收集的 fMRI 数据——推论的 empirial bet 在此。不构成当前可确认的
        净杀。
      status: counterexample_candidate

    case_2_online_emotional_support:
      description: |
        "在线情感支持社区"——青少年在 Discord 心理健康服务器/危机短信热线等平台上,
        每天数小时通过文字和语音为同龄人提供情感支持和危机干预。这些个体:
        (i)数字社交时长极高(>4h/天);
        (ii)但日常活动恰是情感共情的密集练习——识别他人的情感痛苦、表达共情关怀、
        提供情感安慰;
        (iii)如果这种"数字情感劳动"能够维持甚至增强情感共情回路,则推论的"具身信号
        缺失→情感共情萎缩"在主动情感实践者群体中可能不成立。
      verdict: digested
      digestion: |
        消化:(1)推论预测的是数字媒介在群体平均水平上的效应——主动情感支持实践可能构成
        对冲因子,但群体平均水平仍可能显著低于面对面对照组(类似于"健身房练肌肉可以抵消
        久坐的负面效应,但久坐人群的平均肌肉量仍低于活跃人群")。(2)推论的核心赌注是具身
        情感信号(面部微表情/声音颤抖/身体语言)的缺失——即使个体在文字/语音中频繁练习
        情感共情,他们接收到的仍是已被数字编码压缩的衰减信号,而非全带宽的具身信号。
        (3)此案例揭示了一个可检验的调节变量:情感支持动机是否调节了具身剥离的效应?
        若高情感支持动机组的 AI/ACC 激活与面对面对照组无差异→推论的"具身信号是情感
        共情回路的必要输入"被弱化为"具身信号是有利但非必要的输入"。
        当前状态:不构成 net kill——个例层面的对冲不推翻群体趋势预测。但提示了一个
        推论的 refinement 方向:具身剥离效应是否被"主动情感实践动机"调节。
      status: digested

    case_3_gen_z_activism:
      description: |
        "Z 世代数字原住民高共情活动家"——大量 Z 世代社会活动家通过数字平台(Twitter/
        Instagram/TikTok)组织和参与社会正义运动(#MeToo/#BlackLivesMatter/#ClimateStrike)。
        这些个体的道德愤怒和行动动力恰恰来自对他人苦难的强烈共情——而这种共情主要通过
        数字媒介中的视频/叙事/证词被激活。如果数字原住民活动家表现出高于平均的共情水平
        (包括情感共情),则数字媒介非但没有萎缩共情,反而可能通过扩大"道德圈"而增强了
        共情的总产出。
      verdict: digested
      digestion: |
        消化策略与该推论自己的 counterexample 分析一致:此案例的实质是"认知共情增强"+
        "道德愤怒(由认知共情+规范推理驱动)"→行动,不证明情感共情(AI/ACC 水平)完好。
        活动家的道德愤怒可能是认知共情(通过语义渠道理解了系统性不公)+规范推理(公平
        规范被侵犯)的产物,而非具身情感共情(AI/ACC 被他人痛苦直接激活)的产物。关键
        区分:通过阅读证词"知道"某群体在受苦→认知共情→道德愤怒→行动;与面对面目睹
        该群体的痛苦表情和声音→AI/ACC 激活→情感共情→助人冲动——这是两条不同的因果
        通路,在神经层面可分离。推论的赌注是第一条通路(通过数字媒介的语义渠道)可维持
        认知共情+道德行动,而第二条通路(依赖具身信号的 AI/ACC 回路)因输入缺失而萎缩。
        当前状态:不构成净杀——活动家的高道德行动可由认知共情+规范推理解释,与推论的
        解耦格局自洽。
      status: digested

    case_4_existing_iri_cohort_data:
      description: |
        "现有 IRI 代际下降数据与预测(b)的张力"——Twenge et al.(2018)和 Konrath et al.
        (2011)报告的 IRI 总分代际下降包含 cognitive empathy 成分(PT 子量表)。如果代际
        层面的认知共情确实在下降,则推论预测的"认知共情不降"(b)在生态学层面已被挑战。
        这虽然不是个体层面的因果证据,但构成了严重的预警信号——推论的"解耦"签名的一半
        在尚未采集 fMRI 数据前就已经面临逆风。
      verdict: warning_signal
      digestion: |
        诚实消化:这不是 clean kill(生态学关联不等于个体机制),但 signal 的方向性值得
        高度重视。推论的自我保护可通过"代际趋势≠个体机制"的区分(方法论上正确),以及
        "需要 fMRI+IRI 个体层面数据来检验解耦"的要求(合理的下一步)来维持——但此区分
        不能无限期推迟面对逆风。若未来的个体层面 fMRI+IRI 研究也未能找到"PT 不降"的
        证据,(b)将被证伪,推论的核心签名塌陷一半。
        当前状态:不构成 clean kill(生态学关联→个体因果的 gap 仍是有效的防区)。但此张力
        应从前台的 weak confidence 标注提升至 falsification_trace 的结构性风险(见 should-3)。
      status: warning_signal

    hunt_conclusion: |
      四条反例路线无一构成 scope 内的净杀。远程共情和数字原住民活动家路线被"认知vs情感
      共情"的区分消化(消化策略自洽,裁决依赖未来 fMRI 数据);在线情感支持路线被"群体平均
      vs 个体对冲"的区分消化(提示了可检验的调节变量,不推翻群体趋势预测);IRI 代际数据
      路线是重要的预警信号但非干净反例(生态学关联→个体机制的 gap 提供了有效防区)。
      反例猎捕未发现 scope 内活反例——但猎捕过程揭示:推论的多个预测依赖尚未收集的
      fMRI 数据,当前处于"设计的可证伪性高但实证的可证伪机会尚未到来"的预注册阶段。
      此状态在方法论上是健康的(先注册预测再收集数据),但意味着当前对 verified 的判定
      因缺乏实际经验裁决而高度依赖逻辑自洽性——逻辑自洽性已被本审查确认,但"无活反例"
      的一部分原因是"还没人做过能杀死推论的 fMRI 研究"。

  non_recurrence:
    ded_004: |
      未复发。DED-004 的死因是"道德-非道德区分的操作化不完整"→用结果循环定义前件。
      DED-041 的前件(屏幕社交时长)由独立通道测量(自报+设备 API),不由 AI/ACC 激活
      或 IRI 得分反推。anti-talisman 五禁令中,禁令(1)(2)(3)(5)分别从"禁止由 fMRI
      反推具身输入""禁止由问卷 null 反推工具不敏感""禁止由 fMRI null 反推范式不灵敏"
      "禁止由 null 反推测量高估"四个方向封堵了 DED-004 式的循环。禁令(4)额外封堵了
      "神经路径替代"的免疫策略。falsifiability 五条均要求事前注册的口径——若 null
      结果出现,首先接受证伪而非寻找借口。未发现 DED-004 式的不可证伪循环。
    ded_007: |
      未复发。DED-007 的死因是"测量轴焊死"——自变量和被预测量由同一底层数据生成,
      形成数学恒等式。DED-041 的屏幕社交时长(设备 API+自报日志)与 AI/ACC 激活(fMRI
      BOLD 信号)是完全异源的测量通道:前者来自操作系统级行为追踪+主观时间日志,后者
      来自血氧水平依赖的神经成像——两者在物理测量原理上无共享组件,不存在"自变量是
      因变量的函数"或"因变量是自变量的函数"的数学恒等式焊死。IRI 问卷得分是第三条
      独立测量通道。三个测量轴(行为/神经/心理)彼此正交,未发现 DED-007 式焊点。

  required_fixes:
    - |
      【should-1】derivation step 2 的 attribution:将"BR-L2-025:数字媒介的可处理性=具身
      信号的系统性剥离"修正为两步——(2a)BR-L2-025 确立数字信息的通用机器可处理性;
      (2b)本推论论证:机器可处理性产生了对可编码信号的选择效应,具身情感信号因模拟/
      连续/全带宽特性在此选择中被系统性降维——此为 DED-041 的理论贡献,不由 BR-L2-025
      独立支撑。
    - |
      【should-2】分组阈值(>4h/<2h)提供事前锚定依据(引用现有屏幕时间研究的常用切分点,
      或诚实标注为暂定值+注册敏感性分析计划),并注册(c)vs(a)不一致时的裁决优先级。
    - |
      【should-3】将 IRI 代际下降趋势与预测(b)的张力从 real_world_anchors 的 weak
      confidence 角落提升至 falsification_trace 的结构性风险条目——"预测(b)的'认知
      共情不降'已在代际数据的生态学层面面临方向性逆风,虽生态学关联不等于个体机制,
      但此预警信号不应被低估"。
    - |
      【should-4】在 operationalization 中补注册成年组(19-25 岁)的屏幕社交时长测量方案,
      并明确其构念是"成年后当前数字交互"还是"回顾性发育窗口数字交互"。

round_2:
  reviewer: "独立对抗审查者 (round 2, 全新上下文, 与作者及 round_1 审查者无关)"
  verdict: verified
  verdict_note: |
    独立裁定 round_1 的四条 should 级 required_fixes 已被充分消解。逐条核查:

    should-1(derivation step 2 attribution):derivation step 2 已拆分为 2a(BR-L2-025 确立
    通用机器可处理性,不含具身信号论述)与 2b(DED-041 独立论证机器可处理性→具身信号被选择性地
    降维剥离——明确标为 DED-041 的理论贡献,不由 BR-L2-025 独立支撑)。本轮复核 BR-L2-025 全文:
    零"具身""embodied""共情""empathy""屏幕""screen"提及——拆分后的 attribution 精确且诚实。消解。

    should-2(分组阈值零锚定):falsifiability(a)已追加"阈值选择的事前辩护"(引用 Twenge 2019 中位数
    ~3h + Przybylski & Weinstein 2017 常用 >4h 高使用组定义)+"敏感性分析注册"(承诺在见 fMRI 数据前
    测试 3h/1.5h,5h/2.5h 等替代阈值)+"(c)vs(a)不一致时的裁决优先级"(优先以连续剂量-反应(c)为准,
    因切分阈值为人为、连续相关更直接)。阈值锚定有了经验参照+敏感性计划+冲突裁决规则——虽锚定
    力度中等(Twenge 中位数仅为单一国家/年份点估计),但已诚实标注"暂定操作值",不构成 required。消解。

    should-3(IRI 代际张力→结构性风险):falsification_trace 已新增 structural_risk_from_existing_data
    节,将 Twenge 2018/Konrath 2011 的 IRI 认知共情下降趋势明确升级为"直接威胁整个推论的核心签名"的
    结构性风险,并在 real_world_anchors 第三条锚末尾追加指针("此锚已在 falsification_trace...
    提升为结构性风险")。张力从前台 weak confidence 角落被正式传导至推论的风险骨架。消解。

    should-4(成年组操作化缺失):operationalization 已新增 adult_group 节——定义(19-25 岁/PFC 髓鞘化
    基本完成后)、测量(与儿童/青春期组同通道,控制总社交时长)、limitations(成年组屏幕社交模式可能
    系统不同于青少年——更多工作相关,需控制社交内容类型)。但构念二义性(当前数字交互 vs 回顾性
    发育窗口数字交互)在 limitations 中仅以"模式不同"暗示而未正面裁决——见本轮 should-8。总体消解,
    残留小缝。

    本轮独立按 13 条红旗逐条攻+亲自猎捕反例。核心判断:(1)无 required 级缺陷——三块承重砖合取产生
    的解耦签名("情感共情降+认知共情不降")不在任何单砖中,round_1 的 should 级缺陷已修,本轮新发现的
    8 条 concerns 全为 should 级(操作化精化/披露/边界收紧,不使核心塌陷);(2)反例猎捕未净到 scope 内
    活反例——四条路线(在线情感支持/远程共情/Z世代活动家/ASMR情感亲密)均被消化,推论的实证赌注
    (fMRI 个体层面 AI/ACC 与屏幕社交时长的剂量-反应)尚未被任何现有研究坐实或证伪——当前处于
    预注册阶段,设计的可证伪性高但实证裁决尚未到来;(3)未重蹈 DED-004(不可证伪循环)/DED-007(测量
    轴焊死)——三轴(屏幕社交时长/AI-ACC/IRI)异源正交,anti-talisman 五禁令健全。

    判 verified:三门硬条件(无 required/亲自猎捕无净杀/未重蹈 DED-004-007)均客观通过。残留 8 条
    should 为可选精化,不修推论仍可证伪且逻辑自洽——但修后更稳(尤其 should-5 跨年龄测量等价性
    与 should-6 预测(d)的构念对齐是推论的薄弱环节,未来实证检验中可能暴露)。

  red_flag_findings:
    brick_conclusion: |
      未命中(攻不穿,round_1 结论维持)。逐砖复核:
      - BR-L2-025(weakly_verified):全文零"具身""共情""empathy""embodied""屏幕""发育"。
        确立数字信息通用机器可处理性,不含具身信号剥离/共情回路后果/DED-041 特有概念。
      - BR-L2-019(verified):确立道德内化需安全依恋(P1)+对等性信号(P2)+青春期二阶反思
        窗口(P3),含"具身反馈"(照护者抚触/声调/面部表情)作为内化的一般前提,但不含
        "数字媒介""屏幕社交""认知vs情感共情解耦""AI/ACC"。
      - THEOREM-moral-internalization:内化一般机制(P1-P3),无媒介特异性,无共情维度区分。
      - AXIOM-002:信息无维护必衰减,不含共情或数字媒介。
      "数字交互→具身信号剥离→发育窗口内化受阻→认知-情感共情解耦"的完整联合主张不在
      任何单砖中——四砖合取产生的解耦签名(情感降+认知不降的交互格局)是真正的组合增量。
      此结论在 round_1 已确立,本轮复核未发现推翻它的新证据或遗漏的承重砖。
      ⇒ 不判。

    nontriviality_cell_check: |
      未命中(攻不穿,round_1 结论维持)。2×2 判表四格复查:
      - 格(高数字化,情感共情低)【非平凡】:充分条件=BR-L2-019(具身反馈对内化必须)×
        BR-L2-025(数字编码具选择效应)×DED-041 自行论证(语义渠道不可补偿具身缺失)。
        三砖单独推不出此格——BR-L2-019 无数字媒介维度,BR-L2-025 无共情后果维度,
        THEOREM-内化无媒介特异性维度。此格若被现实填上(高数字化组 AI/ACC 无显著下降)
        →推论塌缩→非平凡格真实承受证伪风险。
      - 格(高数字化,认知共情正常)【解耦签名另一半,非平凡】:不在一砖之中。
      - 格(低数字化,情感共情正常)【基准格】。
      - 格(低数字化,认知共情低)【非射程,不证伪也不体面】。
      round_1 已记录的"边缘性警告"(step 2 自论证的认识论地位低于由多块 verified 砖直接导出
      的经验预测)本轮维持——此跨度的存在不使非平凡格的形式成立失效,仅使增量的认识论
      地位与"砖直接导出"的推论有别。should-1 已修(attribution 诚实化),此警告降级为标注。
      ⇒ 不判 required。

    measurement_orthogonality: |
      未重蹈 DED-007(攻不穿,round_1 结论维持)。三轴正交:
      - 屏幕社交时长:设备 API(iOS Screen Time/Android Digital Wellbeing,OS 级行为追踪)+
        自报时间日志。不由 AI/ACC 或 IRI 算出的任何函数决定。
      - AI/ACC BOLD 信号:fMRI 血氧水平依赖信号,pain>no-pain contrast 驱动。不由屏幕
        时间 API 算出的任何函数决定。
      - IRI PT/EC 得分:自报 Likert 量表,独立心理测量通道。
      不存在 DED-007 式的数学恒等式焊死。anti-talisman 五禁令从五个方向封堵逆向推断。
      round_1 的"预防性标注"(fMRI 视觉刺激习惯化混淆)已被 limitations 中的"控制一般情绪
      反应性基线"所覆盖。
      ⇒ 不判。

    scope_hook_independent_of_result: |
      未命中(攻不穿,round_1 结论维持)。三项 excluded_outcomes 复查:
      (1)"全面共情下降"→按解耦签名的逻辑独立性事前排除,附诚实证伪路径(b)。
      (2)"AI/ACC 降+行为不降"→按认知共情可独立驱动行为排除,被 anti-talisman(4)对称
        钳制——双闸设计精巧,两侧同时锁死。
      (3)"成年后改用数字社交"→按发育窗口射程边界排除,诚实指引 DED-024 延伸。
      三项排除均事先定义为逻辑/机制边界,非按结果事后开脱。本轮未发现新的排除钩子漏洞。
      ⇒ 不判。

    criterion_tier_match: |
      未命中(攻不穿,should-2 已修)。推论使用连续量(屏幕社交时长/AI-ACC/IRI)配合分组
      阈值(>4h vs <2h)进行组间检验,同时以剂量-反应(c)作为连续维度的补充检验。2×2 判表
      使用二档匹配 4 格交叉预测格局,未将连续量硬切为不适配的二分类。round_1 的 should-2
      (阈值零锚定)已修——现有事前辩护(Twenge 2019 中位数+Przybylski & Weinstein 2017
      切分惯例)+敏感性分析注册+裁决优先级规则。阈值锚定的经验力度中等(单一国家/时间点),
      但诚实标注"暂定操作值"且(c)提供了免于阈值选择的连续检验路径。
      ⇒ 不判。

    anti_talisman_cashed: |
      大体兑现,无 required 缺陷(round_1 结论维持)。五禁令复查:
      (1)禁由 AI/ACC 低反推隐性高数字组——屏幕社交时长独立双通道测量,合规。
      (2)禁由 IRI null 反推工具不敏感——IRI 已在注册前选定,合规。
      (3)禁由 fMRI null 反推范式不灵敏——疼痛共情范式为领域最稳健范式,合规。
      (4)禁神经路径替代逃逸——若 AI/ACC 降+行为不降,禁声称"换了神经路径"。本轮追加
        审查此禁令与 excluded_outcome(2)的互动:二者合力形成"推论的预测未被推翻但推论
        的实践重要性被降级"的中间地带——此为设计精巧而非逻辑矛盾(与 round_1 一致)。
      (5)对称保护——禁由 AI/ACC 正常反推测量高估,null result 应首先接受证伪,合规。
      【可兑现性】屏幕社交时长双通道(设备 API+自报日志)均为客观/半客观指标,不要求编码者
      做"该交互算不算屏幕社交"的主观裁决——设备 API 给出 app 前台时长(客观),自报日志
      给出实际社交占比(半客观可互验)。实践可兑现性优于 DED-035 的知识污染场景。
      ⇒ 不判 required。

    anchor_fact_check: |
      无致命事实错(round_1 结论维持,附新标注)。逐锚复查:
      - 锚1(AI/ACC 疼痛共情稳健性,Lamm et al. 2011 meta-analysis,>200 fMRI 研究):
        fMRI 领域最稳健发现之一,confidence:strong 合理。建立 AI/ACC 作为 valid proxy,
        不直接证明"数字→AI/ACC 降"。
      - 锚2(GPS 导航与空间记忆退化,Bohbot et al. 2007;Dahmani & Bohbot 2020):
        机制同构锚——外部工具替代认知输入→对应神经回路萎缩。此锚的类比有效但跳跃
        较大(GPS→海马 :: 数字社交→AI/ACC 的跨域类比需要额外的"共情回路同样服从
        用进废退的可塑性原则"的假设,而海马的空间导航可塑性与 AI/ACC 的情感共情可塑性
        可能不同)。此跳跃在作者 confidence:moderate 标注下可接受,但类推强度不应被高估。
      - 锚3(IRI 代际下降,Twenge 2018/Konrath 2011):已升级为 falsification_trace 的
        structural_risk(sthould-3 已修)。confidence:weak 与结构性风险的定位一致。
      - 反例(远程共情):消化策略(认知vs情感共情区分)自洽,裁决依赖未来 fMRI 数据。
      ⇒ 不判 required。记锚2的类推强度标注(should-9)。

    definition_vs_prediction: |
      未命中(攻不穿,round_1 结论维持)。五个 falsifiability 条件(a)-(e)均可被独立观测否决:
      (a)组间 AI/ACC 差异→独立 fMRI contrast 可测;(b)IRI PT 组间差异→标准心理测量
      可测;(c)剂量-反应偏相关→标准回归可测;(d)发育窗口效应量差异→多组 bootstrap 可测;
      (e)媒介保真度梯度→Friedman/线性对比可测。五条攻击面均独立于推论核心主张——
      不是"必然为真"的定义。"数字交互""屏幕社交时长""AI/ACC""IRI PT""年龄组"均有
      独立于推论主张的操作化定义。
      ⇒ 不判。

    enumeration_exhaustive: |
      未命中(不适用,round_1 结论维持)。DED-041 不声称对某现象做穷举分类。2×2 判表是
      交叉分类框架(数字化率×共情维度)用于定位非平凡格,非"共情下降有 N 种类型"的分类学
      声称。discriminant_validity 枚举四种相邻理论(屏幕时间有害/社会位移/回音室/DED-034)
      是判别效度验证而非穷举——作者未声称"只有这四种替代解释"。
      ⇒ 不判。红旗条件不满足,不适用。

    primary_suspect_accurate: |
      未命中 required(攻不穿,round_1 结论维持)。primary_suspect 指向"BR-L2-025 的可处理性
      →具身信号剥离"——此自诊断准确。三个子风险(程度/补偿/替代路径)覆盖该链接的主要
      脆弱面,终极自反("本 primary_suspect 本身暴露了推论潜在的免疫力")与 anti-talisman(4)
      形成呼应。secondary_suspect 指向"发育窗口期边界"——同样准确。structural_risk 已新增
      IRI 代际张力(sthould-3 已修)。
      【本轮补充】primary_suspect 的子风险(2)"补偿机制——最低有效剂量"事实上是整个推论
      最深刻的认识论挑战:如果每天 30 分钟面对面就足以维持情感共情回路,则 >4h 屏幕社交
      的阈值设置失当,且"数字交互主导"与"具身信号不足"之间的概念联系被经验上切断——
      此时推论退化为"极端数字交互(几乎零面对面)才损共情",射程大幅收窄。此风险已在
      primary_suspect 中承认,但严重性值得在 verdict_note 层面标注:它是推论从"广泛社会
      诊断"收窄为"极端案例假说"的关键压力点。
      ⇒ 不判 required。记 should-10。

    caliber_complete_registration: |
      大体兑现(round_1 的 should-2 已修,本轮新发现 should-5/6/7 记边际缝)。
      【已注册】五条 falsifiability 口径(a)-(e)+裁决优先级规则+阈值敏感性分析计划+
      屏幕社交时长的分子/分母/边界裁决(同物理空间屏幕共用→面对面;远程→数字)+
      IRI 测量优先级(EC 降+PT 不降时优先 fMRI 裁决)+anti-talisman 五禁令。
      【本轮新发现的注册缝隙】
      should-5(跨年龄测量等价性):儿童(5-11)的设备 API 可及性(iOS/Android 是否有
      儿童设备?家庭共享设备如何处理?)+自报日志的可靠性(5 岁儿童能否做结构化时间日志?
      需家长代理报告吗?)均未注册。当前 operationalization 假定儿童/青春期/成年三组
      使用相同的双通道测量,但 5-11 岁组的测量可行性需单独论证和注册。
      should-6(预测(d)的构念对齐):预测(d)声称测试"发育窗口假说"(青春期是共情回路
      修剪重组关键期→缺失具身输入损失被放大),但操作化为横截面的"当前数字交互→当前
      AI/ACC"的年龄组间效应量比较——这是"年龄依赖性并发敏感性"而非"发育窗口的持久效应"。
      成人组(19-25)的当前屏幕社交时长不等于其青春期(12-18)的屏幕社交时长——若推论
      主张青春期数字交互造成永久 AI/ACC 损伤,则成人组的测量应回顾其青春期暴露,而非
      测当前暴露。横截面替代纵向的 gap 应诚实标注。
      should-7(媒介类型在 screen_social_hours 内的混同):screen_social_hours 定义涵盖
      视频通话+即时通讯+社交媒体+在线游戏社交——这些媒介的具身保真度差异极大(预测(e)
      自身也区分它们)。将视频通话(较高具身保真度)和纯文字(零具身保真度)均计为"屏幕社交
      小时"可能系统性地稀释组间差异——尤其当不同年龄组/不同个体的媒介类型组合不同时
      (如 5 岁儿童以视频通话为主,15 岁青少年以文字社交为主)。预测(e)测试了保真度梯度,
      但预测(a)(b)(c)的组间/剂量-反应分析未按媒介类型分层。
      ⇒ 不判 required(口径主体已注册)。记 should-5/6/7。

    data_source_common_root: |
      未命中(不适用,round_1 结论维持)。锚点证据来自独立实证领域:fMRI 神经科学 meta-analysis
      (Lamm 2011)/认知心理学 GPS 研究(Bohbot 2007/Dahmani 2020)/社会心理学问卷调查
      (Twenge 2018/Konrath 2011)。三个领域的底层数据采集完全独立——fMRI BOLD 信号与
      GPS 导航行为与 IRI 自报问卷不共享数据采集源头。不存在"WB 用 CNBS 底层数据"式同根。
      ⇒ 不判。

    api_accessibility_masquerade: |
      未命中(不适用,round_1 结论维持)。DED-041 不依赖 API/MCP 查询作为证据来源。
      所有锚点来自已发表科学文献,不是"多路 API 查同一底层数据"的场景。本红旗不触发。
      ⇒ 不判。

  counterexample_hunt:
    strategy: |
      按评分卡要求,独立构造可证伪核心主张的干净案例。核心主张:"以数字交互为主的发育期
      个体情感共情(AI/ACC)显著低于面对面对照组,但认知共情(IRI PT)无显著差异——即
      '认知-情感共情解耦'签名。"猎捕目标:在 scope 内(2020s 主流数字媒介×发育期5-25岁)
      找到满足数字交互条件但解耦签名不成立(或反向成立)的干净案例。

    case_1_online_emotional_support:
      description: |
        round_1 已猎但本轮加深:在线情感支持社区(Discord 心理健康服务器/危机短信热线)
        的青少年——每天数小时通过文字/语音为同龄人提供情感支持。这些个体的特殊之处:
        (i)数字社交时长极高(>4h/天);(ii)日常活动恰是情感共情的密集练习——识别他人
        情感痛苦、表达共情关怀、提供情感安慰;(iii)如果这种"数字情感劳动"能维持甚至
        增强情感共情回路,则推论的"具身信号缺失→情感共情萎缩"在主动情感实践者中不成立。
      verdict: digested
      digestion: |
        消化:(1)推论预测的是群体平均水平上的效应——主动情感支持实践可构成对冲因子
        (类似"健身房练肌肉可抵消久坐负面效应"),不推翻群体趋势预测。(2)核心赌注是
        具身情感信号的缺失——即使个体在文字/语音中频繁练习情感共情,他们接收到的仍是
        已被数字编码压缩的衰减信号,而非全带宽具身信号。(3)此案例实际揭示了一个可检验
        的调节变量:情感支持动机是否调节了具身剥离效应?若高情感支持组的 AI/ACC 与面对面
        对照组无差异→推论的"具身信号是情感共情回路的必要输入"被弱化为"有利但非必要"。
        当前:不构成净杀——个体对冲不推翻群体趋势,且裁决依赖尚未收集的分层 fMRI 数据。
      status: digested

    case_2_asmr_digital_emotional_intimacy:
      description: |
        ASMR(Autonomous Sensory Meridian Response)内容——YouTube/TikTok 创作者通过
        耳语、轻柔声响、模拟个人关注(模拟眼神接触/近距离对话)引发数百万观众的生理
        放松和情感连接。这些体验:(i)完全通过数字媒介传递;(ii)产生真实生理反应(酥麻感/
        放松/情感温暖);(iii)依赖声音+面部表情+模拟眼神接触——保留了相当高保真度的
        具身信号(在数字带宽内最大化具身信息)。若 ASMR 能触发与面对面互动相当的具身
        情感反应,则数字编码未必系统性剥离具身信号——它可以在数字带宽内被有效传递。
      verdict: digested
      digestion: |
        消化:(1)ASMR 是单向消费(接收但不需要做出具身回应),而推论的核心赌注是双向
        社交交互中的具身信号缺失——接收+发送的闭环中,数字编码对发送端具身信号的剥离
        更严重。(2)预测(v)已注册了具身保真度梯度:视频通话(面部+声音)>纯语音>文字,
        ASMR 落在"高保真度视频"端——推论预测此端的 AI/ACC 低于面对面但高于纯文本,
        而非预测视频端的 AI/ACC 为零。ASMR 产生情感反应与推论梯度预测自洽。(3)ASMR
        消费不能替代发育期大脑所需的"行为→他人痛苦→情感共鸣→自我抑制"这一闭环——
        ASMR 不涉及道德情境中的共情反应。当前:不构成净杀——ASMR 现象与预测(e)的
        梯度预测自洽,且不在推论的发育机制射程内(消费≠闭环互动)。
      status: digested

    case_3_cognitive_empathy_selective_decline:
      description: |
        尝试构造"反向解耦"案例:数字交互导致认知共情(IRI PT)下降但情感共情(AI/ACC)完好。
        机制:数字通讯的短形式(推文/TikTok/短消息)减少了深度换位思考的练习机会,但数字
        媒介中的情感线索(表情包/GIF/语音消息/视频)足以维持情感共情回路。若此格局成立,
        则 DED-041 的"情感降+认知不降"解耦签名被反向证伪——观察到的将是"认知降+情感不降"。
      verdict: counterexample_candidate
      digestion: |
        此路线在理论和经验上均有一定支持:(i)短形式数字通讯确实减少了需要深度换位思考的
        场景(推特级论证无法替代面对面长对话中的 nuanced perspective-taking);(ii)数字
        媒介中的情感表达(emoji/GIF/sticker/语音消息)已形成丰富的副语言系统,可能提供了
        足够的"数字具身代理"来维持情感共鸣;(iii)现有 IRI 代际数据(Twenge 2018/Konrath
        2011)恰恰显示认知共情(PT)也在下降——而非仅情感共情下降。但当前这些是生态学/
        代际关联,非个体层面 fMRI+IRI 联合证据。此路线的裁决同样依赖尚未收集的 fMRI 数据。
        若未来研究发现"PT 降+AI/ACC 不降"的格局→推论的解耦签名被反向证伪(b 被推翻且
        a 不成立)——此时 DED-041 退化为全面共情下降的弱主张,且方向(wrong sign)与推论
        预测相反。当前:不构成干净反例(缺乏个体层面 fMRI 裁决),但方向性预警值得标注——
        与 structural_risk_from_existing_data 呼应,提示解耦签名的两极(情感降+认知不降)
        均面临来自不同方向的逆风。
      status: counterexample_candidate

    case_4_pre_digital_empathy_deficits:
      description: |
        前数字时代(1990 年前)的共情缺陷群体:罗马角斗士观众/公开处刑围观者/奴隶制社会的
        奴隶主阶层——这些群体在零数字交互的环境中长大,拥有完全的面对面具身信号输入,却
        表现出对他人的严重共情缺陷(享受他人痛苦/系统性地无视奴隶的痛苦)。如果具身信号
        的完好输入不能保证情感共情的正常发育,则推论的核心前提"具身信号是情感共情发育的
        必要条件"被经验上削弱——具身信号可能只是众多影响因素之一,缺失它未必导致萎缩,
        拥有它未必保证发育。
      verdict: digested
      digestion: |
        消化:(1)推论不声称具身信号是情感共情发育的【充分条件】——它只声称具身信号的
        【缺失】(因数字媒介)导致情感共情【萎缩】。文化/意识形态/制度因素(如罗马将奴隶
        去人化/纳粹将犹太人非人化)可以【覆盖】具身信号的正常输入——这属于 BR-L2-019
        的 P1+P2 中的"安全依恋中断"和"对等性信号瓦解"的另一种路径(文化暴力而非数字
        剥离),不在 DED-041 射程内。(2)前数字时代的共情缺陷反而支持推论的一个元主张:
        具身信号的缺失【不是】共情缺陷的唯一原因——但数字媒介提供了一种【新颖的、系统性
        的】具身信号剥夺路径,其新颖性在于它不影响语义内容(你仍知道对方受伤)但系统性地
        剥离了具身维度(你感受不到)——这正是"解耦"签名的独特之处。前数字时代的共情缺陷
        通常是"认知+情感"双轨受损(奴隶被去人化后,奴隶主既不认知其痛苦也不感受其痛苦),
        而非解耦。当前:不构成净杀——反成对"解耦"签名独特性的间接支持(数字时代以前的
        共情缺陷机制不同)。
      status: digested (反成间接支持)

    hunt_conclusion: |
      四条路线无一构成 scope 内净杀。在线情感支持/ASMR 被消化(与推论梯度预测自洽或
      不在发育机制射程内);认知共情选择性下降为 counterexample_candidate(个体层面 fMRI
      裁决未到,与 structural_risk 呼应);前数字时代共情缺陷反成间接支持(凸显数字时代
      解耦签名的独特性——以前是双轨受损,数字时代可能是单轨受损)。

      猎捕过程确认了 round_1 的判断:推论的多个核心预测依赖尚未收集的个体层面 fMRI+IRI
      联合数据,当前处于"设计的可证伪性高但实证裁决尚未到来"的预注册阶段。此状态在
      方法论上健康——推论不因"还没人做过能杀死它的研究"而免疫(预注册的 falsifiability
      条件已锁死,一旦数据出现,裁决自动触发)。但"无活反例"的一部分原因是"关键实证检验
      尚未发生"——此透明度标注在本轮维持。

      真正值得关注的风险不是我方猎到的反例,而是 primary_suspect 子风险(2)"最低有效剂量"
      与 structural_risk"IRI 认知共情已降"的合力:若发育中的大脑只需极少具身输入(如每天
      30 分钟面对面)即可维持 AI/ACC 正常发育,且现有代际数据已显示认知共情也在下降——
      则推论的"解耦"签名在两个方向同时受压:情感共情可能未萎缩(因最低剂量已达标),认知
      共情可能也在萎缩(与预测(b)相反)。此场景下的推论将被压缩为"数字交互与共情的弱相关"
      ——虽仍可证伪,但射程和理论增量大幅缩水。此风险已在 primary_suspect 和 structural_risk
      中注册,本轮仅标注其合力严重性,不升级为 required。

  non_recurrence_of_ded004_007:
    ded_004: |
      未复发(round_1 结论维持,本轮独立复核通过)。DED-004 死因:"道德-非道德区分的操作化
      不完整"→用结果循环定义前件。DED-041 的前件(屏幕社交时长)由独立双通道(设备 API+
      自报日志)测量,不由 AI/ACC 激活或 IRI 得分反推。anti-talisman 五禁令中:(1)封堵
      "由 AI/ACC 反推隐性高数字组",(2)封堵"由问卷 null 反推工具不敏感",(3)封堵"由 fMRI
      null 反推范式不灵敏",(4)封堵"神经路径替代逃逸",(5)封堵"由 AI/ACC 正常反推测量
      高估"。五条禁令从五个方向锁死了 DED-004 式的循环路径。falsifiability 五条均要求
      事前注册口径——若 null 结果出现,首先接受证伪而非寻找借口。本轮未发现任何新的
      循环活门(round_1 的 should-2 阈值锚定已修,阈值的敏感性分析+裁决优先级规则封堵了
      "事后调整阈值救推论"的路径)。
    ded_007: |
      未复发(round_1 结论维持,本轮独立复核通过)。DED-007 死因:"自变量和被预测量由
      同一底层数据生成,形成数学恒等式焊死"。DED-041 的三轴:
      - 屏幕社交时长:OS 级设备 API(iOS Screen Time/Android Digital Wellbeing)——行为追踪
      - AI/ACC BOLD 信号:fMRI 血氧水平依赖神经成像——神经测量
      - IRI PT/EC 得分:自报 Likert 量表——心理测量
      三者在物理测量原理上无共享组件——不存在"自变量是因变量的函数"或"因变量是自变量
      的函数"的数学恒等式。无 DED-007 式焊点。anti-talisman 五禁令进一步防止了任何
      "解释性焊死"(如事后将 AI/ACC 低者解释为"隐性高数字组")。

  required_fixes:
    - |
      [should-5 — 跨年龄测量等价性]儿童组(5-11岁)的设备 API 可及性(iOS/Android 是否有
      儿童独立设备?家庭共享设备如何处理?)和自报时间日志的可靠性(5 岁儿童能否完成结构化
      时间日志?需家长代理报告吗?)均未在 operationalization 中注册。当前假定三年龄组使用
      相同双通道测量,但 5-11 岁组的测量可行性需单独论证。建议:注册家长代理报告方案
      (parental proxy report)+设备级数据(若儿童有独立设备)或家长设备的儿童使用统计;
      诚实标注儿童组测量误差大于青少年/成人组,并在统计分析中做年龄组测量不变性
      (measurement invariance)检验。
    - |
      [should-6 — 预测(d)的构念对齐]预测(d)声称测试发育窗口假说("青春期是共情回路修剪
      重组关键期→缺失具身输入损失被放大"),但操作化为横截面的"当前数字交互→当前 AI/ACC"
      的年龄组间效应量比较——这是"年龄依赖性并发敏感性",不是"发育窗口的持久效应"。成人组
      (19-25岁)的当前屏幕社交时长不等于其青春期(12-18岁)的屏幕社交时长。若成人组在青春期
      经历了高数字交互但在 19-25 岁时转为低数字交互(或反过来),当前测量的构念与机制构念
      不对齐。建议:在 limitations 中诚实标注"横截面年龄比较是发育窗口假说的代理检验而非
      直接检验——直接的发育窗口检验需要纵向追踪(青春期屏幕社交时长→成年后 AI/ACC),
      成本极高",或注册成人组"回顾性青春期屏幕社交时长"作为补充测量。
    - |
      [should-7 — 媒介类型在 screen_social_hours 内的混同]screen_social_hours 定义涵盖
      视频通话+即时通讯+社交媒体+在线游戏社交——这些媒介的具身保真度差异极大(预测(e)
      自身也承认并测试此梯度)。将视频通话(较高保真度)和纯文字(零保真度)均计为"屏幕社交
      小时"可能系统性稀释组间差异——尤其当年龄组间的媒介类型组合不同时(5 岁儿童可能以
      视频通话为主而 15 岁青少年以文字社交为主)。建议:在剂量-反应分析(c)中注册按媒介类型
      分层的补充分析(如分别计算视频社交时长/文字社交时长与 AI/ACC 的偏相关),或注册屏幕
      社交时长的"具身保真度加权"版本作为敏感性分析。
    - |
      [should-8 — 成人组构念二义性正面裁决]round_1 的 should-4 要求补注册成人组测量方案——
      已补,但构念二义性在 limitations 中仅以"模式可能不同"暗示而未正面裁决。成人组的
      screen_social_hours 测量的究竟是:(A)其当前(19-25岁)的数字交互水平——用于排除
      成年后数字交互的混淆效应,还是(B)其回顾性青春期(12-18岁)的数字交互水平——用于直接
      检验"青春期暴露→成年后 AI/ACC"的发育假说?此二义性影响预测(d)的解释。建议正面裁决:
      明确成人组测量以(A)为主(当前数字交互作为"发育窗口已关闭后的暴露"的基线条件),
      同时诚实标注"成人组当前暴露≠其青春期暴露"的局限性。
    - |
      [should-9 — 锚2(GPS-海马)的类推强度降级]GPS 导航→海马萎缩的机制同构性是推论
      最关键的间接支持锚之一,但跨域类推(GPS:空间导航回路 :: 数字社交:情感共情回路)的
      跳跃需要额外假设"AI/ACC 的情感共情回路与海马的空间导航回路服从同等程度的用进废退
      可塑性原则"。海马的空间导航可塑性有大量动物模型证据(环境丰富化→海马神经发生↑),
      而 AI/ACC 的"社交输入依赖可塑性"的动物/人类证据等级不同。建议:在锚2的 confidence
      标注中增加"跨域类推的额外假设"的诚实披露,或降级 confidence:moderate→moderate-weak
      并注明原因。
    - |
      [should-10 — primary_suspect 子风险(2)"最低有效剂量"的严重性上调]此风险(每天
      30 分钟面对面是否就足够维持 AI/ACC 正常发育)事实上是整个推论从"广泛社会诊断"收窄
      为"极端案例假说"的关键压力点。若最低有效剂量极低→绝大多数数字交互主导的青少年仍
      有足够的具身输入→预测(a)不成立→推论塌缩。此风险目前在 primary_suspect 的三个并列
      子风险中未获得与其严重性匹配的权重。建议:将子风险(2)单列为与子风险(1)(程度)同等
      或更高权重的独立风险条目,并在 falsifiability 中注册"最低有效剂量"的实证检验方案
      (如通过测量面对面社交时长的保护性阈值来间接检验)。
