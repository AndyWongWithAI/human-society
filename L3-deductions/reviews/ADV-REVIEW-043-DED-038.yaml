    - "【should-4】在 discriminant_validity 中增加'共同原因假说'的竞争检验方案:若缺口长度与通胀峰值的相关是外生冲击烈度(财政赤字/GDP/外部融资枯竭)的被动产物,则在控制冲击烈度后相关应收窄或消失——提供可操作的判别预测。"
    - "【should-5】在 operationalization 的 UOA 转移时点 limitations 中诚实标注聚合测量悖论:三个子指标各自可能有临界触发特征,但'取最早触发者'的聚合规则可能掩盖微观临界性/产生宏观平滑假象——需分别报告三指标各自的触发模式,或标注聚合风险。"

round_2:
  reviewer: "独立对抗审查者 (round 2, 全新上下文, 与前轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    本轮重点审查两件事：(1) round 1 的两条 required fixes 是否充分消解；
    (2) 独立红旗逐条攻 + 反例猎捕。

    【第一条 required-1 验证——BR-L2-022 引用失实】
    Round 1 指出 derivation 步骤 1 错误声称 BR-L2-022 已确立 SOV-UOA 独立性。
    当前 derivation 步骤 1 已修正为："BR-L2-022未覆盖SOV与UOA的可分离性。
