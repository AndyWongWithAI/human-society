  required_fixes:
    - "【required-1】更正 derivation 步骤 1 中 BR-L2-022 的引用失实:BR-L2-022 仅覆盖 SOV-MOE 解耦,明确排除 UOA 独立性。需(a)诚实标注 SOV-UOA 独立解耦是本推论自带假说而非承重砖已有结论,(b)为 UOA 独立解耦补充独立论据(经济学文献中 UOA 惯性的经验证据,非仅依靠 BR-L2-024),(c)或在 depends_on 中削减对 BR-L2-022 关于 UOA 的依赖。(验证方法:重读 BR-L2-022 statement,确认其明确声明'记账单位的独立机制不在本砖射程内'——当前 derivation 步骤 1 的引用与原文矛盾。)"

    - "【required-2】前台处理 Hungary 1945-1946 半杀反例:在 real_world_anchors.counterexamples 中新增 Hungary 条目,并任选以下修复路径之一——(a)证明 Hungary 的 SOV-UOA 缺口实际上更长(需引用史料证据),(b)将 Hungary 排除并据此收紧射程条件(如增加'通胀月率<X%'的速度上限——当 UOA 在物理上不可用时不适用记忆滞后机制),(c)承认缺口-峰值正相关在极端恶性通胀区间不成立并限制招牌预测的适用范围。(验证方法:Hungary 1946 月通胀峰值 4.19×10^16%,整段历时约 12 个月——若 SOV-UOA 缺口在数周量级,则短缺口+极端峰值与预测矛盾。)"

  should_fixes:
    - "【should-1】在 anti-talisman 条款中追加诚实声明:'信任崩解速度'与'SOV 逃逸速度'在概念上可区分(广义制度信心 vs 货币功能行为),但在代理变量层面存在不可避免的重叠(存款比变化率≈SOV 逃逸度量,CDS 与通胀同步飙升)——此重叠使因果方向在时序数据中难以独立验证,推论的认识论地位低于多源独立测量能提供的置信度。"
    - "【should-2】增加按通胀速度分层的 UOA 残存机制讨论——区分中等恶性通胀(peak 100%-1000%年率,契约+惯性+记忆三重锁定均有效)与极端恶性通胀(peak>X%月率,契约刚性瓦解/社会协调惯性崩溃/仅记忆滞后残存),并讨论两种区间中 SOV-UOA 缺口与通胀峰值关系的差异。"
