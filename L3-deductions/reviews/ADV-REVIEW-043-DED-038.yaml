      note: "未声称 N 类可枚举。"
    primary_suspect指对:
      verdict: "方向指对，漏了一条"
      note: |
        自认 primary=BR-L2-031(weakly_verified),secondary=BR-L2-024,
        unlikely=BR-L2-022。分析合理。
        遗漏：推论自带的假说——"UOA 被契约刚性+社会协调惯性+记忆滞后
        三重锁定"——此假说本身未经独立验证。BR-L2-024 提供了记忆滞后
        的证据，但契约刚性和社会协调惯性的锁定强度在恶性通胀中缺乏
