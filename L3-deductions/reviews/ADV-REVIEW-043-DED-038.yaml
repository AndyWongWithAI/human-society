      note: |
        "SOV 是信心驱动"=定义(BR-L2-022)。"UOA 被三重锁定"=混合
        (记忆滞后来自 BR-L2-024 经验规律+契约刚性/协调惯性为机制假设)。
        预测(i)-(iii)均为可证伪经验命题。合格。
    枚举穷尽species:
