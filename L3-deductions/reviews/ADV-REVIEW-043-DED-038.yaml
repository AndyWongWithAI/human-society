    【本轮独立反例猎捕】
    主动寻找 round 1 未覆盖的能证伪核心预测的案例：

    (a) 猎"SOV-UOA 缺口长 + 通胀峰值低"：
    - 俄罗斯 2014-2015：卢布贬值~50%,SOV 部分逃逸（资本外流/美元化储蓄）,
    UOA 残存卢布,通胀峰值~17%。此案例在射程边界（<100% 年率），方向与
    预测一致（中等缺口+低峰值）而非反例。
    - 阿根廷 2001-2002 后：比索贬值+SOV 逃逸,通胀峰值~40%（远低于
    恶性通胀阈值）,UOA 残存。非反例——峰值未达门槛。
    猎捕结果：未找到射程内的"长缺口+低峰值"干净反例。

    (b) 猎"SOV-UOA 缺口短 + 通胀峰值高"（Hungary 型）：
    - 希腊 1944（二战占领期恶性通胀,月峰值~8.5×10^9%）：SOV-UOA 动态
    受占领行政干扰,不完全符合"内生信任崩解"射程,且史料中 UOA 转移时序
    的精细记录不足。
    - 南斯拉夫 1993-1994（已在 round 1 猎过,被消化为主权突变排除）。
    猎捕结果：除 Hungary 外未找到新的射程内干净案例。Hungary 已被诚实处理。

    (c) 猎"UOA 先于/同步于 SOV 转移"：
    - 黎巴嫩 2019-2023：银行危机+资本管制,SOV 逃逸被行政阻断（储户无法
    提取美元存款）,而美元标价（UOA 转移）快速普及。但此为资本管制制造
    的 UOA-先于-SOV 假象——SOV 未能逃逸不是因信任残存而是因行政禁止。
    不符推论适用的"无行政干预的正常市场"条件。非干净反例。

    总猎捕结论：未猎到射程内的新净杀反例。Hungary 仍是唯一显著反例，
    且已被诚实处理（限制适用范围）。

    【DED-004/DED-007 复发检查】
    DED-004（不可证伪循环）：未复发。anti_talisman 禁令方向正确,
    预测(i)-(iii)独立于前件操作化。
    DED-007（测量轴焊死）：未复发。自变量（信任崩解速度→SOV 逃逸）
    与被预测项（UOA 转移时点/通胀峰值）不共享测量分母。但信任崩解与
    SOV 逃逸的操作化近同义反复风险持续存在（should-1 未处理）。

    【综合裁决】
    两条 round 1 required fixes 均已完成核心修复（BR-L2-022 引用诚实化、
    Hungary 前台限制处理）。本轮未发现新的逻辑/事实/不可证伪性级缺陷。
    驳回 verified 的唯一原因：YAML 截断（文件不 parse）+ review_summary 缺失——
    均为技术格式级缺陷，非推论内容缺陷。修复后可达 verified。

  flags:
