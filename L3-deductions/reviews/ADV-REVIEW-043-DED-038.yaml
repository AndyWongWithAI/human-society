      note: |
        津巴布韦/委内瑞拉/魏玛三个支撑锚的时间线大体准确，方向一致。
        Hungary 已在前台处理。阿根廷"存美元花比索"为补充证据。
        未发现事实错或过度解读。
    条件定义vs预测:
