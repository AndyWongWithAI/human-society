        推导步骤 1 已修正 BR-L2-022 引用。但 brick=conclusion 审计段的
        "'SOV与UOA是独立功能维度'（BR-L2-022 statement(b)）"一行仍将
        UOA 独立性归因于 BR-L2-022,与修正后的推导矛盾——砖审计段需同步修正。
        此残留不影响非平凡性判断（SOV-UOA 独立性在推导中已正确标示为推论假说）。
    逐格判空:
      verdict: "攻不穿"
      note: |
        2×3 判据表完整。核心非平凡格"快速崩解→缺口与峰值正相关"成立——
        需要 BR-L2-031(速度)+BR-L2-024(惯性)+功能解耦时序框架三者交互。
        慢速格诚实标注"不做强预测"。合格。但"快速崩解"的二分阈值未注册——
        见 flag-5 分类判据档位匹配。
    测量轴正交:
      verdict: "部分命中——should 级（与 round 1 相同）"
      note: |
        自变量（信任崩解速度）与被预测项（UOA 转移/通胀峰值）测量上异源。
        但"本外币存款比变化率"作为信任崩解代理即 SOV 逃逸度量——
        自变量与中间变量操作化重叠。anti_talisman 要求至少一个锚走
        CDS/调查路径可部分缓解但未消除此问题。见 round 1 should-1（未处理）。
        非 DED-007 级焊死（不共享分母），但有测量独立性折扣。
    射程排除钩子独立:
      verdict: "攻不穿（有一条后见排除需说明）"
      note: |
        四条 exclude 均按事前可判标准划定。Hungary 处理引入的
        "月通胀率>10^10%/月"限制是后见排除（在见到 Hungary 反例后添加），
        但方向是退让（承认推论在此区间可能不成立）而非救援——
        按评分卡红旗 11 的精神，后见排除若限制推论（非扩张推论）不触发
        不对称惩罚。但应在文件中诚实标注此为"在 Hungary 反例驱动下增加
        的速度上限"而非假装原始预注册。
    分类判据档位匹配:
      verdict: "轻微命中——should 级"
      note: |
        SOV-UOA 时间差与通胀峰值均为连续量，Spearman ρ 匹配连续量。合格。
        但 2×3 矩阵的"慢/快"二分缺乏操作化阈值——
        CDS 展宽多少 bp/周算"快"？调查降幅多少百分点/季算"快"？
        存款比变化率多少 pp/月算"快"？阈值未注册使得"快速崩解★"预测区间
        的归属在边界案例上依赖事后判断——这削弱了逐格判空的预注册价值。
        不过核心预测是对连续量（缺口-峰值相关）而非对二分归属，故降为 should。
    anti_talisman兑现:
      verdict: "方向正确，可兑现性存疑（同 round 1 should-1）"
      note: |
        六条禁令的方向全部正确且完整。实际兑现的瓶颈在 should-1（信任崩解与
        SOV 逃逸操作化重叠）——"至少一个承重锚独立测出崩解速度"承诺了独立
        测量，但未给出具体是哪个案例的哪个代理指标做到了时序上的真正先行。
        此项在 empirical 验证前不致命（是承诺而非当前的违约），但在推论达到
        verified 时应至少有伪代码级的验证方案。
    现实锚事实核查:
