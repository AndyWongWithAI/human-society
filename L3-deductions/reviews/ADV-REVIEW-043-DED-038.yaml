  counterexample_hunt:
    strategy: |
      本轮独立反例猎捕（与 round 1 无关上下文），重点：
      (a) 猎 round 1 未覆盖的"SOV-UOA 缺口长+峰值低"案例
      (b) 猎 round 1 未覆盖的"UOA 先于 SOV"案例
      (c) 猎 Hungary 型"短缺口+极端峰值"的第二个案例
      同时检查 round 1 猎过的案例是否有新的解读角度。
    cases_hunted:
      - case: "俄罗斯 2014-2015 卢布危机"
        prediction_target: "(b) 缺口-峰值正相关 / 中缺口是否带中低峰值"
        finding: |
          卢布因油价崩+制裁在 2014H2-2015 贬值约 50%。资本外流加速
          （SOV 部分逃逸至美元/欧元/实物资产）。但卢布始终为正式 UOA——
          工资、价格、合同全以卢布计价。年通胀峰值约 17%（2015 年 3 月）。
          低于 100% 年率射程下限。
        digestion: |
          射程外——不构成对推论预测的检验。但揭示阈值连续性问题：
          俄罗斯 SOV 部分逃逸+UOA 完整残存的模式与推论描述的定性机制
          一致，只是幅度未达恶性通胀门槛。若阈值从 100% 降至 50%，
          此案例即支持推论（中缺口+低峰值,方向一致）。阈值敏感性
          已在 round 1 Ecuador 案例中讨论。
      - case: "黎巴嫩 2019-2023 银行危机+货币崩溃"
        prediction_target: "(a) UOA 是否先于 SOV 转移"
        finding: |
          黎巴嫩镑在 2019 年后贬值超 90%。银行系统事实破产,储户的美元
          存款被冻结（资本管制）。SOV 逃逸在物理上被阻断——人们无法将
          银行中的本币/外币储蓄转出。但 UOA 转移（美元标价）快速普及
          于房地产/耐用品/服务业。形式上出现"UOA 转移早于/同步于 SOV
          逃逸"——因为 SOV 逃逸被行政阻断而 UOA 在市场端自发美元化。
        digestion: |
          不构成干净反例。推论的操作化已预留"资本管制"作为 SOV 测量限制
          （"购买量数据可能受供应约束——需辅以黑市溢价数据区分'想买买不到'
          和'不想买'"）。黎巴嫩正是"想逃逃不掉"——SOV 逃逸意愿（信任
          崩解后的行为驱动）极高但被行政阻断,不是信任残存导致 SOV 未逃逸。
          推论机制在此案例中未被检验（因为 SOV 逃逸被阻断,螺旋的 SOV 侧
          被外生压制）。
          此案例揭示推论的一个隐含假设：SOV 逃逸通道是开放的（无资本管制/
          无金条缺货）。建议在 excluded_outcomes 或适用条件中明确列出此项。
      - case: "希腊 1944 恶性通胀（轴心国占领期）"
        prediction_target: "(b) 短缺口是否带极端峰值"
        finding: |
          1944 年 10-11 月希腊恶性通胀峰值月率约 8.5×10^9%。
          通胀驱动因素包括占领当局的货币掠夺（强迫央行信贷）+
          战时物资短缺+黑市泛滥。占领行政严重干扰了正常货币
          功能。史料中 UOA 转移的精细时序记录不足。
        digestion: |
          不构成干净检验。占领期通胀的驱动机制混合了行政掠夺+
          信任崩解,且占领当局对货币系统的直接操控使"内生制度信任
          崩解"的射程边界模糊。此外 UOA 转移时序的数据不足。
      - case: "南斯拉夫 1993-1994（round 1 已猎,本轮重新审视）"
        prediction_target: "(a) + (b)"
        finding: |
          Round 1 将其消化为"主权突变"排除。重新审视：
          南斯拉夫于 1991-1992 解体,但塞尔维亚/黑山组成的
          南联盟保留第纳尔央行连续性。DM 在 1992 年前已同时
          充当 SOV 和 UOA。1993 年恶性通胀（峰值月率 3.13×10^8%）
          爆发时 DM 已是事实双功能货币——SOV 和 UOA 几乎同步转移。
        digestion: |
          维持 round 1 的消化判断。但补充：此案例 UOA 转移与 SOV
          逃逸近乎同步（甚至 UOA 可能更早,因为 DM 标价在解体前已
          广泛用于耐用品/房地产）——若将解体前的 DM 标价计为 UOA
          转移,则 UOA 转移可能早于全面的 SOV 逃逸（本币储蓄→DM 资产
          的大规模转移在解体/制裁后才加速）。但分解体/制裁/战争
          多重外生冲击使得"纯内生信任崩解"射程不成立。维持排除。
    verdict: "无净杀,未发现射程内新活反例"
    note: |
      本轮猎捕未找到射程内的干净反例。Hungary 1946 仍是唯一显著
      反例且已被诚实处理（限制极端区间适用性）。黎巴嫩案例揭示了
      一个隐含假设（SOV 逃逸通道开放），建议明确列出。

      一个持续的关注：几乎所有恶性通胀案例在事后都能被推论的框架
      "解释"——要么支持、要么被射程排除、要么归因于测量限制。
      这不是推论独有的问题（历史案例研究天然受限于此），但意味着
      falsifiability(b)（跨案例统计检验）的可执行性远低于
      falsifiability(a)（个案时序证伪）。falsifiability(a) 是
      推论的真正证伪路径。

