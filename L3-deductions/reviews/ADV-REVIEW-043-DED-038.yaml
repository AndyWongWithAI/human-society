id: ADV-REVIEW-043
type: adversarial_review
reviews: DED-038
layer: L3-deductions

人话摘要: |
  对 DED-038(制度信任崩解×法币功能解耦:恶性通胀的双重时间不对称)的 round_1 独立对抗审查。
  裁 needs_revision: 核心机制(SOV快逃逸×UOA慢残存→单向卖出压力窗口→贬值螺旋放大)在逻辑
  上焊接了三块承重砖的增量,非平凡性逐格判空通过,未重蹈 DED-004/DED-007。一条 required 级缺陷
  (BR-L2-022 引用失实——该砖明确排除 UOA 独立性)、一条反例半杀(Hungary 1946 短缺口×极端峰值)
  挡住 verified。

target: DED-038
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者无关)。
  评分卡红旗 13 条逐项攻+反例猎捕(必做)+DED-004(不可证伪循环)/DED-007(测量轴焊死)复发检查。
  裁决三态照评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活反例③未重蹈 DED-004/007。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新上下文, 与作者无关)"
  verdict: needs_revision
  verdict_note: |
    本推论的核心机制——制度信任崩解时 SOV 因信心驱动而快速逃逸(BR-L2-031 信任不对称+BR-L2-022
    SOV 纯信心驱动),UOA 因记忆滞后+契约刚性+社会协调惯性而残存(BR-L2-024 记忆滞后),两者速度差
    创造单向卖出压力窗口,进而自我强化为贬值螺旋——逻辑骨架焊接了三块承重砖,产出了真正的非平凡
    增量。非平凡性逐格判空通过:没有任何单砖独立预测"SOV-UOA 缺口与通胀峰值正相关"这一可证伪的
    经验命题,也没有任何单砖讨论信任崩解速度与记忆滞后强度的交互效应如何决定贬值螺旋烈度。
    DED-004(不可证伪循环)与 DED-007(测量轴焊死)均未复发——anti-talisman 禁令方向正确
    (信任崩解速度不得从 SOV-UOA 缺口/通胀峰值反推,UOA 转移阈值需事前锁定)。

    一条 required 级缺陷 + 反例猎捕发现 Hungary 1946 半杀挡住 verified:

    【required-1】BR-L2-022 引用失实——推导步骤 1 声称"承重砖已确立:货币的 SOV 与 UOA 是独立的
    功能维度(BR-L2-022)",但 BR-L2-022 的 statement 明确声明:"本砖仅覆盖交易媒介与价值储藏的解耦;
    记账单位的独立机制(它与交易媒介和价值储藏的关系、是否可独立解耦)不在本砖射程内,留待后续研究。"
    BR-L2-022 建立了 SOV-MOE 可分离性,但【从未】建立 SOV-UOA 可分离性。DED-038 将 UOA 独立性
    当作已由承重砖确立的前提来使用,而实际上这恰恰是本推论自身需要论证的增量主张。这不是措辞小修——
    若 BR-L2-022 未覆盖 UOA 独立性,则推导中"UOA 由社会协调惯性和契约网络支撑"这一机制锚定失去了
    桥接层支撑,推导步骤 4 中"UOA 残存是慢变量(惯性+契约+记忆三重锁定)"的第三条腿(社会协调惯性)
    依赖的是推论自身的声称而非承重砖。修复方向:(a)更正 derivation 步骤 1 为诚实表述——BR-L2-022
    仅建立 SOV-MOE 可分离性、SOV-UOA 的独立解耦是【本推论提出的假说】而非承重砖已有结论;
    (b)为 UOA 独立解耦假说补充独立论据(经济学文献中 UOA 惯性的经验证据),不能仅靠 BR-L2-024
    的记忆滞后(那是信用恢复侧的惯性,不等于 UOA 切换侧的惯性);(c)或在 depends_on 中削减对
    BR-L2-022 关于 UOA 的依赖,诚实标注 UOA 独立性是推论自带的经验假说、置信度低于 SOV-MOE 解耦。

    【反例半杀——Hungary 1945-1946 短缺口×极端峰值】匈牙利 pengő 恶性通胀(1945 年 7 月–1946 年
    7 月)是有记录以来最极端的恶性通胀(月通胀峰值 4.19×10^16%),但整段历时仅约 12 个月。在价格
    每 15 小时翻倍的极端速度下,pengő 作为 UOA 在物理上已不可用——人们迅速转用"adópengő"(税 pengő,
    通胀指数化单位)标价和记账。SOV 逃逸(储蓄转实物/外币)与 UOA 转移(标价改用 adópengő/外币)
    的时间差被极端速度压缩至数周而非数月/年。结果:极短的 SOV-UOA 缺口 + 历史最高的通胀峰值——
    与推论预测"缺口越大→峰值越高"的方向正相反。不是净杀:推论可争辩 Hungary 的 SOV-UOA 缺口
    仍存在(只是被压缩),或 adópengő 不算"UOA 转移"(它是指数化本币计价而非改用外币)。但半杀的地位
    是坚实的——在推论声称适用区间(峰值>100%年率,制度信任驱动的恶性通胀,非行政命令替换)内,Hungary
    满足所有射程条件(SOV 逃逸发生在先、通胀属于内生信任崩解驱动而非行政改革),却产生了方向与预测
    相反的结果。推论需在前台处理此案例,不能仅靠事后重新解释 UOA 转移的操作化来消解。

    以下为五条 should 级补充缺陷:

    【should-1】SOV 逃逸与制度信任崩解的近同义反复风险。推论将"制度信任崩解"设为驱动变量、
    "SOV 逃逸"设为被驱动结果,但两者在货币域的操作化实质上测量同一个底层现象——对法币未来
    购买力的信心丧失。推论的操作化方案中,"制度信任崩解速度"的代理变量包括"本外币存款比的月度
    变化率"——这正是 SOV 逃逸本身的度量(储蓄从本币转向外币)。CDS 利差在恶性通胀中也与通胀/
    贬值同步飙升而非先行。即使 anti-talisman 禁令方向正确,代理变量的实际时间序列中,信任崩解
    与 SOV 逃逸的时序差异可能小于测量误差,使"独立驱动"的声称难以兑现。建议:在 anti-talisman
    条款中追加一项诚实声明——"信任崩解速度"与"SOV 逃逸速度"在概念上可区分(前者是制度层面
    的广义信心、后者是货币功能层面的具体行为),但在操作层面存在不可避免的重叠,此重叠使信任
    崩解→SOV 逃逸的因果方向虽在机制上合理但在时序数据中难以独立证伪。

    【should-2】UOA 残存的三重锁定机制在极端恶性通胀中的强度存疑。推论声称 UOA 被"记忆滞后+
    契约刚性+社会协调惯性"三重锁定,但在价格每 15 小时翻倍的极端恶性通胀中:(a)长期工资合同
    不再存在——工资按日甚至按小时支付并实时指数化;(b)社会协调惯性在旧 UOA 物理上不可用后
    迅速瓦解——当价格标签需要每小时重写时,"大家都用法币标价"的纳什均衡在数天内崩溃;
    (c)记忆滞后(BR-L2-024)操作在个体生命周期尺度上,不阻碍人们在旧 UOA 崩坏后的数周内
    切换 UOA。三重锁定在"中等恶性通胀"(peak 100%-1000% 年率)中可能有效,但在推论自身锚定的
    极端案例(津巴布韦 79.6B%/月、委内瑞拉 1.7M%/年)中每一条的强度都被通胀速度本身削弱。
    推论未区分"中等恶性通胀"与"极端恶性通胀"中 UOA 残存机制的不同动力学。建议:增加按通胀
    速度分层的 UOA 残存机制讨论,或收窄招牌预测的适用范围至"通胀峰值<X%月率"的区间
    (X 为契约刚性/社会协调惯性仍能有效运作的上限)。

    【should-3】小型样本问题未诚实标注。排除行政命令替换(德国 1948 货币改革/厄瓜多尔 2000
    正式美元化)、主权突变(苏联 1991 卢布区解体/南斯拉夫解体)、温和通胀(<100%年率)后,
    20-21 世纪"纯"制度信任驱动的恶性通胀案例可能不足 10 个(津巴布韦、委内瑞拉、魏玛德国、
    匈牙利 1946、希腊 1944、波兰 1989-90、巴西 1990s、阿根廷多次循环——其中多个可能因
    边界条件被排除)。falsifiability(b)要求"≥5 个独立样本中 Spearman ρ 显著(p<0.05)"——
    在 N=5-8 的范围内,p<0.05 要求 ρ≈1.0(完美单调),这在实际数据中几乎不可能满足,
    即使推论的方向性预测正确。这不是推论"错",而是证伪门槛被小样本问题架空——推论
    "不可能被证伪"不是因为不可证伪循环,而是因为样本量不足使任何统计检验都缺乏效力。
    建议:诚实标注 N 的上限估计,并明确说明在此 N 下"p>0.05"不能干净地证伪推论、
    "p<0.05"几乎是不可达到的证实标准——实际的证伪只能靠 falsifiability(a)的个案
    时序反例,而非(b)的跨案例统计检验。

    【should-4】SOV-UOA 缺口作为"放大器"vs"被动表征"的因果方向未充分守卫。推论将 SOV-UOA
    缺口定位为贬值螺旋的【放大器】——缺口越大→累积卖出压力越多→贬值越深。但竞争假说
    同样可解释相关性:外生冲击(财政崩溃/供给冲击/制裁)同时驱动通胀烈度与 SOV 逃逸速度,
    UOA 切换慢只是因为契约刚性(独立于信任崩解速度)——缺口长度与通胀峰值的相关是共同原因
    (外生冲击烈度)的产物,而非缺口"放大"了通胀。推论在 derivation 步骤 6 中否定了反向因果
    ("通胀高→UOA 切换慢"),但未处理共同原因假说。建议:增加一个可操作的竞争假说检验——
    若缺口是外生冲击烈度的被动表征,则控制外生冲击烈度(如财政赤字/GDP、外部融资枯竭程度)
    后缺口-峰值相关应收窄或消失。此为推论与共同原因假说的判别预测。

    【should-5】"UOA 临界触发"预测与操作化之间存在张力。推论预测 UOA 切换是临界触发而非平滑——
    但在操作化中 T_UOA 取三个子指标(工资 UOA/价格 UOA/大额交易 UOA)的【最早触发者】。
    若工资 UOA 在 t+2 年触发(临界)、价格 UOA 在 t+4 年触发(临界)、大额交易 UOA 在 t+5 年
    触发(临界),三者各自的临界触发在聚合后呈现为跨越 3 年的"平滑"序列——单个指标的临界性
    在聚合测量中被抹平。这是聚合层面的辛普森悖论:微观临界+宏观平滑在测量上无法区分于
    微观平滑+宏观平滑。建议:将"临界触发"预测的操作化从"T_UOA=最早触发者"改为"分别报告
    三个子指标的触发模式(各自是否呈临界特征)",或在 limitations 中诚实标注聚合测量可能
    掩盖微观临界性。

  flags:
    brick_is_conclusion:
      verdict: "攻不穿"
      note: |
        BR-L2-031 的 statement(a)-(b)仅确立"信任跌快涨慢"的时间不对称,未讨论此不对称
        如何通过货币功能解耦传导至通胀峰值。BR-L2-024 的 statement(a)-(c)仅确立"法币信用
        连续谱+记忆滞后",未讨论记忆滞后与信任崩解速度的交互效应。BR-L2-022 的 statement(b)
        仅确立"SOV 由信心驱动且不可法律强制",未确立 UOA 的独立机制(该砖明确排除 UOA)。
        三砖各自提供了必要条件,但没有一块砖能独立推出"SOV-UOA 缺口与通胀峰值正相关"。
        非平凡增量成立。但见 flag-3(BR-L2-022 引用失实)对 derivation 步骤 1 的纠正。
    逐格判空:
      verdict: "攻不穿"
      note: |
        2×3 判据表已构建。核心非平凡格:"快速崩解下 SOV-UOA 缺口与通胀峰值正相关"——需要
        BR-L2-031(信任崩解速度)+BR-L2-024(记忆滞后强度)+BR-L2-022(SOV 信心驱动)三者放入
        同一时序框架交互,任何单砖独立无法推出。"慢速崩解下本推论不做强预测"诚实标注了
        无预测区间。合格。
    测量轴正交:
      verdict: "部分命中——should 级"
      note: |
        Anti-talisman 禁令方向正确:不得从 SOV-UOA 缺口/通胀峰值反推信任崩解速度,不得事后
        调整 UOA 转移阈值。但操作化存在近同义反复风险——"本外币存款比的月度变化率"作为
        信任崩解速度的代理变量,实质上测量的是 SOV 逃逸本身(储蓄从本币转向外币)。CDS 利差
        在恶性通胀中与通胀/贬值同步飙升而非先行。信任崩解与 SOV 逃逸在概念上可区分(广义
        制度信心 vs 货币功能行为),但在代理变量的时间序列中,时序差异可能小于测量误差。
        这不是 DED-007 级的测量轴焊死(自变量确实没有偷用结果测),但自变量与中间变量的
        操作化距离过近,见 should-1。
    射程排除钩子独立:
      verdict: "攻不穿"
      note: |
        Excluded outcomes 按事前可判的标准划定:行政命令式货币替换(货币改革/主权突变——
        可事前识别)、温和通胀(<100%年率——可事前测量)、MOE 解耦(由 DED-028 覆盖)。
        排除钩子未依赖"事后看结果不符合"来开脱。100% 年率阈值虽有一定任意性但属预注册值,
        未在见反例后调整。
    分类判据档位匹配:
      verdict: "攻不穿"
      note: |
        SOV-UOA 时间差(连续月数)与通胀峰值(连续百分比)均以 Spearman 秩相关检验——匹配
        连续量。2×3 矩阵用"慢/快"二分档虽粗,但仅用于划定预测区间(非用于统计检验),且
        "快速崩解"的操作化(CDS 展宽/调查降幅/存款比变化率)提供了连续底层的测量。合格。
    anti_talisman兑现:
      verdict: "方向正确但可兑现性存疑"
      note: |
        Anti-talisman 六条禁令写得清楚:(i)信任崩解速度独立于 SOV-UOA 缺口和通胀峰值测量;
        (ii)不得以缺口大/峰值高反推崩解快;(iii)崩解速度走预注册代理变量;(iv)UOA 转移时点
        独立于 SOV 转移时点;(v)UOA 阈值事前锁定;(vi)至少一个承重锚独立测出崩解速度。
        方向全部正确。可兑现性存疑之处在 should-1(信任崩解与 SOV 逃逸的操作化重叠)和
        should-5(聚合测量掩盖临界性)。但未达到 required 级——禁令的【方向】正确,问题在
        实践的测量精度,属于可操作的改进而非结构性缺陷。
    现实锚事实核查:
      verdict: "三个支撑锚核实通过,但 Hungary 半杀未前台处理"
      note: |
        津巴布韦 2000s: SOV 逃逸(USD/ZAR 储蓄替代)始于 2000 年代初,系统性外币标价工资/商品
        迟至 2007-2008——SOV-UOA 缺口约 5-7 年,与 Hanke 测算的 79.6B%/月峰值一致。时间线
        大体准确,方向与预测一致。委内瑞拉 2010s: SOV 流失(储蓄转 USD/房产/黄金)2013-2015,
        广泛 USD 标价 2018-2019——缺口约 3-5 年,与 IMF 估算的 ~1.7M%/年峰值方向一致。
        魏玛德国 1923: SOV 早已完全逃逸,Mark 作为 UOA 残存至最后——工资按日支付并按指数
        调整但仍以 Mark 标价,商店按时更新价格但仍以 Mark 标价。此锚的解读有一处需要更细致
        处理:Mark 作为 UOA 在形式层面残留(价格标签用 Mark),但实际经济计算已按金马克/外币
        进行——形式 UOA 与实际 UOA 的分离在高频指数化环境中是显著的。不过这不伤推论方向
        (形式 UOA 残存本身即支持"UOA 滞后于 SOV")。匈牙利 1946 半杀——见 counterexample_hunt。
    条件定义vs预测:
      verdict: "攻不穿"
      note: |
        "SOV 是信心驱动且不可法律强制"(来自 BR-L2-022)——这是已有砖的定义性陈述,非本推论
        的新定义。"UOA 由社会协调惯性+契约刚性+记忆滞后锁定"——这混合了定义(UOA 作为
        社会协调工具的性质)和预测(UOA 切换晚于 SOV 切换)。prediction (i)-(iii)均为可证伪的
        经验命题,非循环定义。合格。
    枚举穷尽species:
      verdict: "不适用"
      note: |
        本推论未声称"N 类可枚举"的分类体系。不适用此红旗。
    primary_suspect指对:
      verdict: "指对但漏了一条更致命的"
      note: |
        文件自认 primary_suspect 为 BR-L2-031(weakly_verified,制度信任直证仅 0.6-1.0),
        自评准确——若信任崩解速度无法被独立可靠测量,则"SOV 逃逸速度→缺口长度→峰值通胀"
        因果链的发动机无法被独立检验。secondary_suspect 为 BR-L2-024,自评"辅助锁定机制
        但非瓶颈——即使记忆滞后被弱化 UOA 仍有契约刚性+社会协调惯性替代",分析合理。
        但文件遗漏了一条【更致命的软肋】:BR-L2-022 在 UOA 独立性上的空洞——见 flag-1(required)。
        BR-L2-031 的 weakly_verified 是已知风险、已在文中诚实处理;但 BR-L2-022 根本不
        覆盖 UOA 独立性,这是推导前提的事实错误,比 weakly_verified 父砖的置信度折扣更致命。
    口径完整注册:
      verdict: "大部分通过,一条保留"
      note: |
        T_SOV 操作化:购买量突破历史均值+2σ 且≥3 个月持续→分子(购买量)、分母(历史均值/
        标准差)、窗口(≥3 个月)均已注册。T_UOA 操作化:工资 UOA(首次外币计价条款)、
        价格 UOA(外币标价占比>20%)、大额交易 UOA(外币标价>50%),取最早触发者。阈值
        (20%/50%)为预注册值。通胀峰值的测量已注明"若官方数据被质疑辅以 Hanke 等独立估算"。
        一条保留:UOA 子指标的"取最早触发者"聚合规则导致 T_UOA 系统性偏早→SOV-UOA 缺口
        系统性偏短。这是对推论【不利】的偏误(短缺口→推论预测更低峰值,更难验证正相关),
        因此不是"救推论的事后选择"。但"取最早"这一聚合规则本身是在哪个阶段锁定的,
        文件未明确声明是预注册——见 should-5 及其对"临界触发"操作化的影响。
    数据源同根:
      verdict: "不适用"
      note: |
        本推论不声称"多源验证"的经济/统计锚点。各案例(津巴布韦/委内瑞拉/魏玛)来自
        不同的历史档案和经济测算来源(Hanke/IMF/历史记录),虽未做 independence-model
        的正式独立性核算,但也不存在"同根冒充多源独立"的结构性问题。
    API可及性冒充:
      verdict: "不适用"
      note: |
        本推论不依赖 API/MCP 查询的数据源,也未将工具可及性当作认识论独立性证据。

  counterexample_hunt:
    strategy: |
      按评分卡要求主动构造能证伪核心预测的干净案例。三条 falsifiability 路线各猎一条:
      (a) 猎 UOA 早于/同步于 SOV 转移;(b) 猎缺口-峰值正相关不成立;(c) 猎 UOA 平滑转移。
      重点猎(b)——因为(b)是推论的招牌预测,且(b)被推翻的后果比(a)(c)更严重
      ((a)只推翻时序必然性、(c)只推翻临界性,(b)推翻核心因果主张)。
    cases_hunted:
      - case: "Yugoslavia/Serbia 1993-1994"
        prediction_target: "(b) 缺口-峰值正相关 + (a) SOV必然先于UOA"
        finding: |
          德意志马克在 1992 年前已成为事实上的 SOV(储蓄 DM 化)和 UOA(耐用品/
          房地产以 DM 标价)。1993 年恶性通胀(峰值月率 313M%,1994 年 1 月)爆发时,
          DM 已同时承担 SOV 和 UOA 功能,工资在 1993 年中已部分以 DM 支付或指数化。
          SOV-UOA 缺口极短(甚至 UOA 转移可能早于 SOV 完全逃逸——DM 标价在储蓄
          完全 DM 化之前已广泛普及)。产生"短缺口+极端峰值"的模式,与推论预测相反。
        digestion: |
          被消化——但消化方式揭示射程边界模糊。推论可将南斯拉夫归入 excluded_outcomes
          中的"主权突变式货币区分裂"(Yugoslavia 解体、新国家诞生),且 UN 制裁导致的
          外生供给冲击是通胀的主要驱动力而非纯内生信任崩解。消化成立但揭示了一个问题:
          排除钩子"主权突变"的边界在实践中模糊——Serbia/Montenegro 在 1993 年仍以
          "南斯拉夫联盟共和国"名义存在,法币第纳尔的发行机构(央行)延续,是否算"主权
          突变"取决于判据细度。推论未为"主权突变"提供操作化判据。
      - case: "Hungary 1945-1946 (pengő hyperinflation)"
        prediction_target: "(b) 缺口-峰值正相关——最强的招牌预测"
        finding: |
          匈牙利 pengő 恶性通胀(1945 年中–1946 年 7 月)是有完整记录以来通胀峰值
          最高的事件:月通胀率峰值 4.19×10^16%(1946 年 7 月),价格每 15 小时翻倍。
          整段恶性通胀历时约 12 个月。在价格每 15 小时翻倍的速度下:
          - pengő 作为 UOA 在物理上不可用(价格标签的有效期以小时计);
          - 人们在数周内转用"adópengő"(税 pengő,按通胀指数每日调整的计价单位)
            作为实际 UOA;
          - SOV 逃逸(储蓄转实物/外币/黄金)发生在 1945 年末至 1946 年初,
            被通胀加速压缩;
          - SOV-UOA 缺口被极端速度压缩至数周~2-3 个月。
          结果:极短的 SOV-UOA 缺口 + 历史最高的通胀峰值——
          与"缺口越大→峰值越高"的方向正相反。
        digestion: |
          半杀,不能完全消化。推论的防御路线:(i) pengő 在形式上始终是法定 UOA
          (工资、价格、税收全以 pengő 标价直至 1946 年 8 月 1 日富林特替换),
          adópengő 只是辅助计价工具而非正式 UOA 转移——因此 SOV-UOA 缺口可能长达
          数月(1945 年末 SOV 逃逸→1946 年 8 月 UOA 正式替换);(ii) Hungary 1946
          的恶性通胀有特殊的外生驱动(战争赔款+苏联占领下的财政榨取),不完全符合
          "纯内生制度信任崩解"的射程条件。但这两条防御都有问题:(i) 将 UOA 定义为
          "法定 UOA 而非实际经济中使用的 UOA"会使操作化退化为法律形式主义——
          按此逻辑任何恶性通胀中 UOA 都不会"转移"直至官方货币改革;这削弱了
          T_UOA 操作化的经验意义;(ii) 战争赔款和占领是外生冲击,但通胀机制本身
          是内生的(财政赤字货币化→通胀→信任崩解→更快的货币流通速度→更高的
          通胀)——这与推论的核心机制描述高度一致。半杀的定位:推论未能在前台处理
          Hungary,这是一个在射程内的案例(法币体系、信任崩解驱动、峰值>100%年率、
          非行政命令替换),产生了与预测方向相反的模式。推论需要要么(a)证明 Hungary
          的 SOV-UOA 缺口实际上更长,要么(b)将 Hungary 诚实排除并收紧射程条件,
          要么(c)承认缺口-峰值正相关在极端恶性通胀(月率>X%)区间不成立——
          通胀速度压过了一切粘性机制。
      - case: "Ecuador 1999-2000 (非官方美元化→正式美元化)"
        prediction_target: "(b) 长缺口是否与低峰值并存"
        finding: |
          厄瓜多尔在 2000 年 1 月正式美元化之前,苏克雷的非官方美元化(SOV 逃逸)已
          进行了多年——储蓄和大型交易广泛使用 USD。但年通胀峰值仅为约 96%(2000 年)
          和 60%(1999 年),低于推论设定的 100% 年率射程下限。
        digestion: |
          被消化——96% 年率恰好在 100% 阈值以下,严格来说不在射程内。但此案例揭示
          了阈值的连续性困境:96% 与 101% 在经验上无本质差异,却决定了整个案例的
          射程归属。长缺口+近阈值低峰值→若阈值稍有松动即成为反例。推论未讨论阈值
          附近的敏感性。
      - case: "Poland 1989-1990 (转型期恶性通胀)"
        prediction_target: "(b) 中等缺口+中等峰值是否符合"
        finding: |
          波兰兹罗提在 1989 年经历约 640% 年通胀(峰值),部分储蓄已美元化(SOV 逃逸)。
          但 Balcerowicz 计划在 1990 年 1 月快速稳定了货币——UOA 从未转移(始终以
          兹罗提标价)。SOV 部分逃逸但 UOA 完整保留→长缺口+低峰值(640% 在恶性通胀
          中属低端)。640% > 100%,在射程内。方向与预测一致(长缺口+较低峰值),但
          不是对(b)的强检验——因为波兰的"SOV 逃逸"只是"部分"而非推论所述的
          "完全逃逸"。
        digestion: |
          非反例,方向与预测一致。但揭示操作化问题:推论在快速崩解区间预测"SOV 急速
          逃逸",但"SOV 逃逸"本身是连续的——波兰的"部分 SOV 逃逸"(储蓄分散到 USD
          但没有完全放弃兹罗提储蓄)是否算"快速崩解"下的"SOV 急速逃逸"?若是→支持
          推论(长缺口+低峰值);若否→波兰不在快速崩解区间,无预测。区间归属依赖
          于崩解速度的二分,而崩解速度本身是连续量。
    verdict: "无净杀,一条半杀挡 verified"
    note: |
      Hungary 1946 是本次猎捕中最强的反例——在推论的声称适用区间内,产生了方向与
      核心预测相反的"短缺口+极端峰值"模式。推论的可用防御(形式 UOA 未转移/外生
      冲击不属于纯内生信任崩解)均有弱点,不能完全消化。半杀意味着 verified 的第二条
      门(亲自猎捕无 scope 内活反例)未通过。这不是 rejected——因为 Hungary 仍有被
      消化的空间(通过收紧射程或细化 UOA 操作化),但当前版本未做此处理,需要整改。

