    [BR-L2-031, BR-L2-024],BR-L2-022 不在正式依赖中。结论：required-1 的
    核心修复已完成。

    但发现一处残留不一致——brick=conclusion 审计段（第 144 行）仍写：
    "'SOV与UOA是独立功能维度'（BR-L2-022 statement(b)）"——
    声称此内容"已在砖中"。BR-L2-022 statement(b) 实为 SOV-MOE 独立性，
    该砖明确排除 UOA。此残留与修正后的 derivation 步骤 1 矛盾。
    属 should 级——不影响核心逻辑（derivation 已纠正）但造成文档内不一致。

    【第二条 required-2 验证——Hungary 1946 半杀前台处理】
    Hungary 1945-1946 已出现在 real_world_anchors.counterexamples 中，
    处理方式为："限制招牌预测在极端恶性通胀（月通胀率>10^10%/月）的适用性，
    因为在此区间UOA残存机制被极端速度削弱，缺口-峰值正相关可能不成立。"
    同时 falsifiability 适用区间声明中已同步标注此例外。
    结论：required-2 已完成。处理路径选的是 round 1 建议的路径(c)
    ——承认缺口-峰值正相关在极端区间不成立并限制适用范围。此为诚实退让
    而非事后救援（退让方向对推论不利），符合评分卡精神。

    【本轮发现的新 required 级缺陷】

    required-3: YAML 文件截断，validate.py 报错。
    文件第 237 行（boundary_cases 节最后一条）在中文字符串中间截断：
