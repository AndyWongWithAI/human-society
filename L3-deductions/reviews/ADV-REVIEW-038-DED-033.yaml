id: ADV-REVIEW-038
type: adversarial_review
reviews: DED-033
layer: L3-deductions

人话摘要: |
  对 DED-033(社保-消费释放的信任约束)的 round_1 独立对抗审查。裁 needs_revision:核心机制
  (社保扩张→消费释放受信任存量正向调节,三砖合力产生非平凡交互命题)逻辑通畅、测量轴
  正交干净、anti-talisman 四禁令到位、反例猎捕未净杀(战后日本/瑞典 NDC 均被消化)。
  五条 should 级缺陷挡住 verified:(1)通道A/B收敛检验未覆盖"双通道均通过但IV第一阶段弱"
  的伪收敛场景——此时(a)(b)的吻合可能是不同机制分别驱动的巧合而非信任证据的收敛;
  (2)实证锚全景缺失——三锚无一按注册口径完整测量(信任存量+社保扩张+消费释放)三量,
  推论在操作上是 hypothesis 而非 confirmed;(3)平凡化防线将个体层近分析性命题与群体层
  经验命题混同——"不信则不打折"在个体层近乎定义,真实赌注在群体梯度可事前预测,
  当前守卫未做层间切割;(4)时间衰减检验(c)的≥10年稳定期要求使其在多数场景中长期
  不可测,而(c)恰是推论区别于信息不对称/习惯形成的最独判别项——最独特的预测最难测,
  应诚实标注此结构不对称;(5)BR-L2-024跨域迁移的第三重disanalogy(法币贬值是连续市场信号
  vs社保承诺落空是离散政治信号)未被 secondary_suspect 捕获,连续vs离散的信号属性差异
  意味着024的记忆粘性在社保域可能系统性弱于法币域——直接冲击推论对"粘性"的置信度。
  零 required 级缺陷(核心未塌、无净杀反例、不重蹈 DED-004/007、测量轴正交焊不死)。

target: DED-033
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。
  评分卡红旗 11 条逐项攻+反例猎捕(必做)+DED-004(不可证伪循环)/DED-007(测量轴焊死)
  复发检查。裁决三态照评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内
  活反例③未重蹈 DED-004/007。

round_1:
  reviewer: "独立子Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    这是一条【机制骨架稳固、操作化设计干净、但实证锚与部分逻辑细节尚未跟上雄心】
    的候选推论。

    核心论证的逐砖核查:
    - BR-L2-028(预防性储蓄,n L2-bridging/verified/):给出"社保扩张→预防性储蓄下降→
    消费释放"的普适方向(所有受益群体同向),对传导效率的群体异质性完全沉默。
    - BR-L2-031(制度信任不对称衰减,n L2-bridging/weakly_verified/):给出"制度信任摧毁快、
    建立慢"的时间不对称动力学,但从未连接至消费/储蓄行为域,也从未被用作因果箭头
    的"传导效率调制器"。
    - BR-L2-024(法币信用记忆滞后,n L2-bridging/verified/):给出"负面经历→长期行为偏移"
    (通胀记忆→替代资产偏好),但原域是法币/资产配置,从未扩展至社会保障/消费储蓄。

    三方合力产出"信任存量正向调节社保→消费的传导效率"这一交互命题——028给方向
    箭头,031给摩擦来源,024给摩擦粘性。任缺一块推不出此交互命题。nontriviality_test
    的2×2判表中(低信任×社保扩张,消费释放弱)格确系三砖合力的真增量,非任一单砖
    的平凡复述。

    测量轴正交性干净:信任存量两条通道(事件暴露registry+调查代理)均使用社保扩张
    事件【前】的数据源;消费释放幅度使用社保扩张事件【后】的家庭消费调查DiD估计;
    两套数据异源、异时点、异测量工具。anti_talisman四禁令(禁由消费反推信任/禁由
    消费反推事件分类/禁事后调时间起算点/禁无独立证据声称信任修复)封死DED-007式
    焊死路径。falsifiability三条件各有操作化判据,(a)(b)已注册最小效应量(1pp储蓄率/
    τ≤0.1), 标注provisional——比初版">0"已大幅改善。

    discriminant_validity与四个相邻理论(028无摩擦基准/信息不对称/流动性约束/习惯形成)
    的切割诚实且判别力充分:长期跟踪区分信息延迟vs信任衰减、控制收入后组间差仍存
    区分流动性约束、组间差本身区分习惯形成。

    然而,我在逐条攻中猎到五条 should 级缺陷,无一升格为 required:

    ①【should】通道A/B收敛检验未覆盖"双通道均通过但IV第一阶段弱"的伪收敛场景。
    当前falsifiability的削弱条件已处理两个非对称场景:(a)不成立(b)成立+第一阶段不显著
    →降格弱版本;(a)成立(b)不成立→第一阶段需显式通过。但未处理第三种场景:
    (a)成立且(b)成立,但通道A的第一阶段(事件暴露→调查信任差异)不显著。
    在此场景中,(a)的成功(暴露组消费释放更弱)可能由非信任机制驱动(收入/财富/
    金融可及性的残留混杂),(b)的成功(调查信任与消费释放正相关)可能捕获了真实
    信任效应——两通道表面收敛、实则走了不同的因果路径。因(a)成功+第一阶段弱=
    (a)的归因路径未经验证,此时推论不能以"双通道均支持"自居。宜在削弱条件中增加:
    当(a)(b)同时成立时,通道A的第一阶段(经历对调查信任的解释力)需显式通过显著性
    检验,否则(a)的成功不能归因于信任、仅(b)独立承重信任调节——这将推论的证据
    等级从"双通道收敛"降格为"单通道(b)支撑+单通道(a)未归因"。

    ②【should】实证锚全景缺失——推论在操作上仍是 hypothesis 而非 confirmed。
    三个 real_world_anchors 无一按本推论注册的两条通道完整测量了(信任存量+
    社保扩张幅度+消费释放)三量的干净实例。NCMS锚仅承重BR-L2-028基准方向
    (非本推论独有),信任存量是事后推断而非独立编码;东德锚测了风险态度/储蓄率
    差异但未与社保扩张事件挂钩,且"政权崩溃"≠ broken_promise_event_registry
    意义上的"保障承诺落空事件";智利锚仅承重子机制(承诺落空→信任低),因果链
    太长不接消费端。作者在各锚中诚实标注了weak/moderate confidence,但这些标注
    散落各处,缺少一处【整合性的诚实声明】:当前无任何锚按注册口径对核心交互命题
    ("信任存量调节社保→消费传导效率")做了三量全景式验证——推论在实证上处于
    "逻辑可证伪、实践未验证"的灰色地带。这不是推论的错(需要三量同框的数据极其
    稀缺),但此缺口应从分散的锚级标注提升为一项显式的、整合性的confidence caveat,
    让读者一眼看到推论的经验验证状态全貌。另注:此缺口使anti_talisman的四禁令
    在位但从未被实地演练——推论的测量纪律在纸面上严格,但未经实际数据压力测试。

    ③【should】平凡化防线层间混同——"不信任→承诺打折扣"在个体层面近乎分析性
    真理(若不信承诺会兑现,主观价值自然低,这是"不信任"的行为含义本身),但在
    群体层面——"按事前注册的独立通道测出的群体间信任差异,能预测群体间消费
    释放的梯度,且该梯度在控制收入/金融/人口后仍存"——是货真价实的经验赌注。
    当前discriminant_validity的"防平凡化守卫"段将两个层面的防线编在一起,未做
    层间切割。挑战者若以"不信则不打折近乎同义反复"攻击,守方最硬的回击不在个体层
    (那里确实近乎定义),而在群体层:(i)赌的是折扣幅度的事前可测【梯度】而非
    "是否打折",(ii)该梯度的方向与节律(衰减)均可被经验数据推翻,(iii)若不同群体
    的信任存量因经历不同而不同(可事前测),则梯度除非零不能是均匀的——三砖合力
    给了结构理由。宜将防平凡化守卫按"个体层防线"(承认分析性成分,但不影响群体层
    可证伪性)与"群体层防线"(真正的经验赌注)两层重新组织,使攻击面精确落在
    可证伪处。

    ④【should】时间衰减检验(c)的"最难测即最独判"不对称。falsifiability(c)要求
    ≥10年政策稳定期,作者诚实标注"当前为预注册,待数据积累后裁决"。但(c)在经济
    含义上是推论区别于相邻理论的最独判别项:信息不对称解释预测长期趋同(延迟而非
    衰减),习惯形成预测普遍粘性(无组间差),流动性约束预测收入控制后消失——
    只有(c)预测"随时间与制度稳定性积累,组间差收窄"。最独特的预测恰好是
    最难测的预测——这不是数据的偶然缺失,而是推论结构的特征(信任修复以十年计)。
    宜在falsifiability(c)的诚实标注中增加一句:在(c)可测之前,推论与信息不对称
    解释的判别力依赖(a)的"终值不同"预测(需≥5年跟踪),而非(c)的"收窄速率"
    预测——即在(c)的实证窗口内,推论的独有判别力打了折扣,应诚实标注此局限。

    ⑤【should】BR-L2-024跨域迁移的第三重disanalogy被遗漏。secondary_suspect
    已诚实标注了两重disanalogy:(i)法币贬值是连续可感的日常经历vs社保承诺落空
    是离散政策事件(感知显著性差异),(ii)法币贬值→主动配置替代资产vs社保落空→
    维持现状行为(主动vs被动差异)。但遗漏了第三重且可能更根本的disanalogy:
    (iii)法币贬值是【连续市场信号】——每次购物都在提醒"钱不值钱了",提供
    持久负面强化;社保承诺落空是【离散政治信号】——以政策文件发布为感知时点,
    在两次政策事件之间信号消退。连续信号→记忆被反复刷新→粘性更强;
    离散信号→记忆随时间自然衰减→粘性更弱。这意味着BR-L2-024的记忆滞后效应
    在社保域可能系统性弱于在法币域——或者说,社保域的"行为遗产"需要更强的
    初始冲击(或更频繁的重复冲击)才能达到同等的粘性。此disanalogy的方向是
    【不利于推论】的:推论声称"信任约束是粘性的(因BR-L2-024)",但若024的
    粘性在社保域打折扣,则推论的"约束不会快速消解"这一子预测也随之打折扣。
    宜在secondary_suspect中补入此disanalogy,并诚实标注其对推论置信度的方向性影响。

    综合:五条 should 均不达到 required——无一使核心逻辑塌陷、无一为事实错、无一
    使推论不可证伪、测量轴独立且干净。推论骨架须修后复验,不应当前判 verified。
    另注:BR-L2-031的weakly_verified状态已由作者在confidence_floor_note中诚实标注
    为推论置信度天花板——此系Rule D结构约束而非推论自身缺陷,不在本审查裁决范围内。

  red_flag_findings:
    brick_conclusion: |
      未命中(攻不穿)。逐砖核查,原文/近义未见:

      BR-L2-028(预防性储蓄,verified):核心主张为"保障扩张→预防性储蓄下降→消费释放"
      的普适比较静态方向,对所有受益群体方向一致。statement中明言"(b)比较静态——保障
      扩张(外生的)应伴随储蓄率下降/消费率上升,保障收缩应伴随反向移动。"全文未出现
      "信任""调节""异质性""梯度"等概念,更未讨论"传导效率因人而异"。falsifiability
      围绕替代关系(保障vs私人缓冲)的总体平均效应设计,不涉及群体异质性检验。

      BR-L2-031(制度信任不对称衰减,weakly_verified):核心主张为"制度信任的衰减-建立
      呈系统性的时间不对称——摧毁快、建立慢"。domain为信任本身的动力学(衰减-建立
      的节奏),core_mechanism聚焦损失厌恶+信息不对称两条因果链。全文未连接至消费/
      储蓄行为域,未讨论"信任如何调节其他因果箭头的传导效率"这一交互命题。031的
      "关系"字段仅连接至BR-L2-010(制度替代人际信任)和DED-006(信任天花板),
      均非消费行为推论。

      BR-L2-024(法币信用连续可逆性与记忆滞后,verified):核心主张为"法币信用不是二元
      状态而是连续谱,信用恢复是部分的——经历过信用崩塌的群体在个体生命周期内持续保留
      对非法币资产的配置(记忆滞后效应)"。全文domain为法币/资产配置(金/房产/外汇),
      statement的(c)段聚焦通胀记忆→股票参与率/替代资产偏好。全文未出现"社会保障"
      "养老金""医保""消费""预防性储蓄"等词。024的机制(负面经历→行为偏移)被
      DED-033跨域迁移至社保域——此迁移本身是一个新的经验假设(见secondary_suspect),
      而非024原文已有或近义的内容。

      "信任存量正向调节社保扩张→消费释放的传导效率"这一交互命题——其中"正向调节"
      (moderation/modulation)是关键增量——不见于任一块承重砖。作者在nontriviality_test
      中的brick=conclusion自查("三砖合力:028给方向箭头,031给信任摩擦,024给摩擦的
      粘性——任缺一块都推不出'信任调节消费释放'")诚实且准确。

      ⇒ 不判 required,不判 should。

    nontriviality_cell_check: |
      未命中(攻不穿)。2×2判表逐格审查:

      格(高信任×社保扩张,消费释放充分)=BR-L2-028的验证实例。028的"保障扩张→
      消费释放"预测此格——对无信任摩擦的群体,028的普适方向应成立。

      格(低信任×社保扩张,消费释放弱)=非平凡格——本推论的新增预测。028只说所有人
      同向反应,未预测梯度;031未连接消费行为;024在法币域不在社保域。三砖中无一
      预测"低信任群体会释放得更少"——此预测来自三砖的组合:028给出箭头的存在,
      031+024给出箭头传导效率的调制器(信任存量低→保障主观价值打折→箭头传导受阻)。

      格的填空可被经验证伪:若多个社保扩张案例中,按事前通道测得的信任差异不产生
      消费释放梯度((a)(b)同时失效),该格被填上→推论塌缩为028的平凡复述。填充手段
      (pre-registered measurement channels)已在falsifiability(a)(b)中锁定,不可事后规避。

      格(高信任×社保扩张,消费释放弱)——若被填充,挑战的是BR-L2-028本身(高信任+
      保障扩张→消费仍不释放→替代关系被反例),非本推论独有风险。

      格(低信任×社保扩张,消费释放充分)——若被填充((a)的核心预测被反证),推论塌。
      此格是本推论最脆弱的格,也是falsifiability(a)直接瞄准的靶。

      ⇒ 2×2判表干净,非平凡格确为三砖合力的真增量。不判 required,不判 should。

    measurement_orthogonality: |
      未重蹈DED-007(攻不穿)。驱动量(信任存量)与被预测量(消费释放幅度)的测量源
      完全正交:

      信任存量·通道A(经历档案法):数据源=broken_promise_event_registry(事前锁定的
      政策历史事件清单)+个体人口学信息(年龄/居住地,按事前注册暴露判定规则编码)。
      此数据源独立于任何消费/储蓄调查——它是政策史+人口学,不含消费信息。

      信任存量·通道B(调查代理法):数据源=CGSS/CFPS/WVS等调查中"社保可靠性"信任题项,
      限定在社保扩张事件【前】采集的调查轮次。时间上先于消费结果,内容上不含消费行为。

      消费释放幅度:数据源=社保扩张事件【后】的家庭消费调查(消费支出/可支配收入),
      DiD估计。时间上后于信任测量,内容上不含信任/态度题项。

      两套数据的交集只有个体/地区标识符(用于匹配),没有内容/测量工具/采集时点的重叠。
      这不同于DED-007的致命设计——DED-007用"货币量"同时充当通货需求的自变量和
      因变量的分母,形成数学恒等式级焊死。本推论的信任(政策史/调查态度)与消费
      (家庭支出调查)在概念、数据源、采集时点、测量工具四个维度上均正交。

      anti_talisman四禁令(禁由消费反推信任/禁由消费反推事件分类/禁事后调时间起算点/
      禁无独立证据声称信任修复)进一步封死了任何"事后用结果测原因"的路径。四禁令
      每一条都对应一个具体的反推漏洞,且操作化程度足够(给出了"什么是违规"的明确判据)。

      ⇒ 测量轴正交性干净,不重蹈DED-007。不判 required,不判 should。

    scope_hook_independent_of_result: |
      未命中(攻不穿)。三项excluded_outcomes均按事前结构特征划分,不由消费结果决定:

      (1)"社保类型差异导致的信任弹性不同"——按养老金/医保/失业保险的政策分类事前
      编码。分类依据是保障类型的制度特征(承诺期限/收益即时性),不由消费反应大小
      或方向决定。"若养老金有显著信任调节而医保没有(或反之),不证伪核心主张——只将
      推论边界收窄为'特定社保类型'"——此排除逻辑是"分类框架已事前给定,具体类型的
      弹性差异是经验参数而非命题内容",不构成事后开脱。

      (2)"社保扩张伴随大规模转移支付/收入效应"——按政策文本中"现金转移/实物/仅保障
      承诺"的分类事前编码。排除依据是保障扩张的【性质】(cash vs in-kind vs promise-only),
      不由消费反应强度决定。这对应BR-L2-028的净化口径精神(净掉机械收入效应后看
      预防通道的独立贡献)——是本推论对父砖方法论的继承,非新开排除口。

      (3)"非缴费型社会救助(低保/五保/社会津贴)"——按"社会救助 vs 社会保险"的制度
      分类事前判别。排除依据是项目的制度类型(缴费型保险 vs 非缴费型救助),不由消费
      反应决定。社会救助走收入效应/流动性约束通道(BR-L2-029的MPC梯度),不走
      预防-信任通道——这是领域分工,非规避反例。

      三项排除口的共同特征:分类判据均可事前应用(见政策文本/制度类型/保障性质,
      不需见消费数据),且分类规则一次性注册、对所有社保事件一致适用。

      ⇒ 学到DED-005精神,排除钩子独立于结果。不判 required,不判 should。

    criterion_tier_match: |
      未命中(攻不穿)。信任存量是连续变量(由连续的事件暴露计数/连续的调查信任分值
      代理),核心预测使用连续实证工具:
      - falsifiability(a):DiD估计的连续组间差
      - falsifiability(b):Spearman/Kendall连续相关
      - falsifiability(c):时间×信任的连续交互项

      2×2判表仅用于nontriviality_test的概念展示,明确标注为"自变量档:高信任存量vs
      低信任存量 × 被预测量档:消费释放充分vs弱"。实证检验设计保持了信任存量的
      连续性(连续DiD处理强度、连续代理变量相关、连续交互项),未将连续量硬切为二
      分用于假设检验。

      这与DED-006的教训不同——DED-006将连续量(交易规模)硬切二分(小规模vs大
      规模信任半径),导致分类判据与连续现象档位失配。DED-033避开了此陷阱。

      ⇒ 不判 required,不判 should。

    anti_talisman_cashed: |
      大体兑现,三条 should 级残留(对应verdict_note中的should-①/②/⑤)。

      【正面清单——已兑现的防身成分】
      anti_talisman_clause四条禁令具体且操作化:(1)禁由消费释放弱反推信任存量低——
      信任只认两条事前通道,若两通道均测不出低信任→案例按"未解释"处理,不得诉诸
      "隐性不信任";(2)禁由消费结果反推事件为承诺落空——registry是事前锁定封闭清单,
      不得见消费弱就事后追认;(3)禁事后调"承诺持续兑现时间"起算点——起算时点按
      registry中事件日期计算;(4)禁无独立证据声称信任修复——必须有调查信任题项回升
      或新生代际相对信任改善,不得仅凭"时间久"推断。四条禁令每一条都给出了"违规操作"
      的具体形态——这是 anti-talisman 条款写得最好的部分之一。

      削弱条件诚实:若(a)(b)同时失效→核心断裂;若仅(b)不成立→测量削弱但逻辑存活;
      若仅(a)不成立而(b)成立且第一阶段不显著→降格弱版本。削弱路径的触发条件和
      后果均事前注册,无事后灵活性。

      【should级残留一:双通道伪收敛未设防】
      当前削弱条件覆盖了(a)(b)不对称失效的两种场景,但未覆盖(a)(b)同时成立而通道A
      第一阶段(事件暴露→调查信任差异)不显著的场景。此时两通道的表面收敛可能是
      不同机制分别驱动的巧合——(a)走非信任混杂(收入/财富/金融可及性),(b)走真信任
      效应——推论的"双通道均支持信任调节"的叙事不成立,但当前条款未要求在此场景下
      验证第一阶段。详见verdict_note should-①。

      【should级残留二:无三量全景验证锚】
      三锚均未按注册口径完整测量(信任存量+社保扩张+消费释放)三量。anti_talisman
      的四禁令在位但从未经实际数据压力测试——禁令是对"如果违规怎么办"的事前规定,
      但推论的测量纪律是否在实践中可执行,从未被验证。详见verdict_note should-②。

      【should级残留三:024跨域粘性折扣未被anti_talisman捕获】
      anti_talisman第四条禁"无独立证据声称信任修复",但其预设是"信任确实可修复且
      修复按031的节律进行"。若024的跨域粘性在社保域系统性弱于法币域(见verdict_note
      should-⑤),则信任修复可能比031预测的更快——此时反例(如"承诺落空5年后消费
      释放已追平")可能被第四条轻易消化("信任已被独立证据修复"),但"修复"的实质是
      粘性本就低于模型假设。当前anti_talisman未设:若声称"信任修复"消解反例,修复的
      证据标准需与024的粘性折扣联立——即修复证据需证明信任恢复【超出了024跨域
      折扣后的预期速率】,而非仅证明"时间过去够久+信任有回升"。

      ⇒ 整体不判 required(四条禁令框架完整、操作化程度高、已覆盖最直白的反推路径),
      记三条 should。

    anchor_fact_check: |
      无DED-007式致命事实错。逐锚核查:

      【NCMS锚(confidence:weak)——事实正确,过度解读风险可控】
      - NCMS 2003年起以县为单位分批次推开、中央定框架各县自主决定参合费率→史实正确。
      - 农村合作医疗1950s兴起→1980s随人民公社解体而大面积瓦解→1990s二次尝试→
        2003 NCMS重建→此周期叙事总体正确,方向与主流文献(如Wagstaff et al. 2009,
        JHE; Yip & Hsiao 2008, Lancet关于中国农村医疗融资的历史回顾)一致。
      - "东部沿海省份消费释放效应普遍强于中西部"——此为方向性观察,被收入/金融发展
        严重混淆,作者已诚实标注。
      - "东部沿海因集体经济底子厚,部分地区合作医疗在1980-90s期间未完全中断"——
        此主张需要更谨慎。标准历史叙述是合作医疗随1980s初农业去集体化而近乎全面崩溃,
        仅极少数富裕村集体(华西村、大邱庄、南街村等村级集体经济保留地)维持了村办
        医疗福利,远非"部分地区"可概括的范围。此处的区域对比夸大了"中断vs连续"的
        变异性。但作者诚实标注了confidence:weak和"地区间差异被收入/金融发展严重混淆",
        mitigates过度解读。建议:将"部分地区"收窄为"极少数集体经济未解体的富裕村庄"。
      - 承重标注:"承重'社保扩张→消费释放方向'(BR-L2-028基准,非本推论独有);
        不独立承重'信任调节'的交互命题"——诚实。
      ⇒ 不判 required(整体方向正确,弱标注 mitigates)。记 should(区域对比措辞过度)。

      【东德锚(confidence:moderate)——史实正确,范畴拉伸需警惕】
      - 两德统一1990年、西德社保制度覆盖东德→史实正确。
      - Fuchs-Schündeln & Schündeln (2005, AER)研究东德人国家干预偏好→引注属实。
        该文主要发现是东德背景的人更偏好政府提供社会保障(态度层面),而非本推论
        声称的"东德家庭储蓄率更高"(行为层面)。作者标注"判断是风险态度差异而非本推论
        注册的'信任存量调节社保-消费传导'"——诚实。但文件在anchor.evidence中写的是
        "东德家庭在统一后长期维持更高的储蓄率",这与Fuchs-Schündeln(2005)的主要发现
        (态度差异,非储蓄率差异)不完全对应。储蓄率差异在德国文献中是争议命题
        (部分研究如Börsch-Supan确实发现储蓄率差异,但归因于收入/就业/人口结构,非
        信任或风险态度)。建议:区分"储蓄率差异"(行为,归因有争议)与"国家干预偏好"
        (态度,Fuchs-Schündeln直证),锚的证据描述应将二者拆开陈述。
      - "Stasi体制下对'国家会照顾你'的全面保障承诺随政权崩溃而落空"——此处的范畴
        拉伸值得警惕:政权崩溃是unique historical rupture, broken_promise_event_registry
        定义的是特定社保政策的失信事件。将政权更替归入"保障承诺落空",若普遍化,则
        任何重大政治变革都可用同一逻辑涵盖→框架过度伸张。当前锚仅作为相邻证据
        (作者诚实标注),此风险可控,但框架边界需警觉。
      ⇒ 不判 required。记 should(储蓄率vs态度的证据描述不精确+范畴拉伸风险)。

      【智利锚(confidence:weak)——史实正确,承重功能标注诚实但需更精确】
      - 1981年皮诺切特以个人账户(AFP)替代现收现付养老金→史实正确。
      - 2008年Bachelet改革引入团结支柱→史实正确。
      - 作者自认"因果链太长(养老金改革影响退休消费而非即期消费)"和"该锚仅承重
        '社保承诺落空经历→信任存量低'的机制真实性,不承重消费释放的因果检验"
        →诚实。但当前锚列在supporting下,承重标注在evidence末尾,结构上不易被
        快速解读。建议:明确标注"此锚仅承重 derivation step 2(承诺落空→信任低),
        不承重 step 4(核心交互命题)"——使锚的功能范围一目了然。
      ⇒ 不判 required。记 should(锚功能标注升格为结构化标签)。

      【边界案例:战后日本1961全民健保——事实正确,消化逻辑自洽】
      - 1961年日本实现全民健康保险(国民皆保険)→史实正确。
      - 消化逻辑(clean-slate:无前序承诺落空史+高增长稀释预防动机+政府可信度上行
        通道→信任约束趋近上限→推论退化为028基准)与推论预测自洽。此消化非事后
        开脱——推论的核心主张是"当信任存量有差异时产生梯度",不声称"永远有梯度"。
        在信任存量趋近上限的场景中,预测本身收窄为零梯度,非矛盾于核心主张。
      ⇒ 不判 required,不判 should。

      【整体诚实度评价】三个锚均无致命事实错,诚实标注到位(confidence level+承重
      范围+混杂因素均标注)。但三锚的共同特征——无一按注册口径完整测量(信任存量+
      社保扩张+消费释放)三量——是实证层面的系统缺口,已在verdict_note should-②
      中单列处理。

    definition_vs_prediction: |
      未命中(攻不穿)。关键条件"保障承诺落空经历→信任存量低→消费释放弱"中的
      每一环均有独立于被预测量(消费)的攻击面:

      (i)经历≠信任:通道A的IV第一阶段可能为零——经历承诺落空的人不一定不信任,
      未经历的人不一定信任。此攻击面对应falsifiability的削弱条件:若(a)不成立(b)成立
      且第一阶段不显著→推论降格。攻击面有对应的、操作化的证伪后果。

      (ii)信任低≠消费释放弱:即使经历差异产生了信任差异,信任差异可能不转化为消费
      行为差异(其他因素——收入/流动性/社会网络——主导消费决策,信任的独立贡献
      在统计上不显著)。此攻击面对应falsifiability(a)(b)的核心测试和primary_suspect
      的归因挑战。

      (iii)消费释放的组间差异可能全由非信任因素解释:控制收入/金融可及性/人口结构后
      组间差消失。此攻击面对应primary_suspect中"控制后组间差仍显著"这一最小条件——
      若此条件不成立,(a)被证伪。

      三个攻击面均不在"定义中"——每个面都是可证伪的经验赌注。条件不因反复叠加
      而加厚到免疫证伪(three-link chain = three points of attack, not three layers of armor)。

      ⇒ 不判 required,不判 should。

    enumeration_and_species: |
      未命中(适用性有限)。本推论的核心驱动量(信任存量)是连续变量,由连续的事件
      暴露计数/连续的调查信任分值代理。核心预测使用连续工具:连续DiD组间差、连续
      相关系数、连续交互项。不声称"N类可枚举"的分类体系——此与DED-008式
      "角色/情境/物种"物种化分类不同。

      nontriviality_test的2×2表使用高/低信任二分组,但明确标注为概念展示(用于证明
      非平凡格的存在),非实证检验设计。实证使用连续变量,不依赖二分组的分类质量。

      DED-008的猎取第N+1类在此不适用——没有可猎的"未被归类的物种"。

      ⇒ 不判 required,不判 should。

    primary_suspect_aim: |
      指对且大体诚实,一条 should 级漏认(对应verdict_note should-⑤)。

      【已认账的脆弱点——准确】
      primary_suspect="(a)腿的归因——组间差异可能全由收入/金融/人口结构解释"→指对。
      (a)是本推论的招牌预测,压在"控制后组间差仍显著"这条腿上——这恰恰是数据要求
      最高、混杂最难清干净的腿。作者在此处的诚实度值得肯定:不仅认了三条竞争解释
      (收入/金融/人口),还给出了塌缩条件("若多数可用证据中,控制这些变量后组间差
      不再显著→推论塌缩为'社保效应受社会经济地位调节'的平凡社会学陈述")。

      secondary_suspect="BR-L2-024机制迁移的跨域有效性"→指对。两重disanalogy(感知
      显著性差异:连续通胀vs离散政策事件;行为形态差异:主动配置vs维持现状)诚实且准确。

      unlikely_suspect="BR-L2-028的无摩擦基准"→指对。028有跨制度准实验复现
      (美国UI/Medicaid、中国NCMS、台湾健保),稳固。标注为unlikely是合理的。

      note="primary若被坐实,024的跨域迁移也随之失去行为锚点"→诚实串联两条suspect,
      逻辑自洽。

      【漏认的脆弱点——should】
      未认:BR-L2-024跨域迁移的第三重disanalogy——连续市场信号(法币贬值,每次购物
      都在提醒)vs离散政治信号(社保承诺落空,政策文件发布后信号消退)。此disanalogy
      的方向是【不利于推论的】:离散信号的记忆粘性应弱于连续信号→024的记忆滞后
      效应在社保域可能打折扣→推论的"信任约束是粘性的"这一子预测随之打折扣。
      此disanalogy不同于已认的两重(它不关乎感知显著性也不同于行为形态,而关乎
      【信号的重复暴露频率】——连续信号的hysteresis靠反复刷新维持,离散信号的
      hysteresis靠初始冲击+有限刷新维持),应独立列为第三重disanalogy。
      详见verdict_note should-⑤。

      ⇒ 不判 required。记 should(漏认第三重disanalogy)。

    threshold_denominator_registration: |
      未命中 required 级(口径方向与主体已注册,无L4-009式事后选择),一条 should
      级残留(对应verdict_note should-①)。

      【已注册的口径——完整度良好】
      (i)社保扩张幅度:从政策文本事前编码(覆盖率变化/报销比例/准入资格放宽的生效
      时点与幅度),禁以参保率充当。分子=政策参数变化幅度,分母=基准水平。口径明确。

      (ii)消费释放幅度:分子=实际家庭消费支出(家庭调查口径),分母=家庭可支配收入
      (同一调查口径),效应=DiD估计。口径明确,同源贯穿前后期消掉水平差。

      (iii)通道A暴露判定规则:暴露=个体在事件发生时≥18岁且居住于受影响辖区;
      代际暴露=父母满足前述条件。判定规则一次性注册,在见任何消费数据前锁定。
      口径明确。

      (iv)证伪阈值(a)(b):已注册最小效应量——组间DiD差≤1pp(储蓄率)即判证伪;
      Spearman/Kendall τ≤0.1即判证伪。标注provisional(待经验标定),参照BR-L2-028的
      1pp先例。分子=组间DiD差或相关系数,单位=储蓄率百分点或τ值。口径可操作。

      (v)broken_promise_event_registry判据(v)"重大":已注册provisional操作化——
      政策参数变动≥10%或覆盖人口≥500万。虽标注provisional,但已给出可操作的
      分子(参数变动幅度/覆盖人口变动)和阈值。

      【未完整注册——should】
      时间衰减检验(c)的口径:要求"≥10年政策稳定期"的样本量门槛,但未注册——
      若10年稳定期不可得(多数社保改革的实证窗口<10年),该检验的"暂未达标"(可
      延期等待)vs"被证伪"(现有数据不支持)的界线在哪?当前仅在falsifiability(c)中
      标注"当前为预注册,待数据积累后裁决"——这是诚实标注,但等同于赋予(c)
      一个弹性延期条款:只要样本不足,推论就不会因(c)被证伪。这不是L4-009式
      事后口径选择(方向已定、未救推论),但在效果上使(c)在可见未来免于裁决。
      宜为(c)注册一个"最小可用样本量"门槛(如≥3个国家/地区各≥10年面板),
      未达标时(c)的状态为"暂不可测"而非"预注册",达标后(c)的裁决不可再延期。

      ⇒ 不判 required(核心口径——三量的分子/分母/方向/测量工具——均已注册,
      与L4-009的选择性注册性质不同)。记 should(c的延期弹性)。

  counterexample_hunt: |
    【猎捕策略】三条独立攻击路径,每条瞄准一个falsifiability条件:
    路径α:(a)的反例——找到经历过保障承诺落空事件的群体,在社保外生扩张后消费释放
    与未经历群体无差异(组间DiD差≤0)的干净案例。
    路径β:(b)的反例——找到跨地区/队列中调查信任代理变量与社保扩张后消费释放
    幅度零相关或负相关的案例。
    路径γ:(c)的反例——找到承诺持续兑现时间越长而(a)(b)效应反而越强的案例
    (交互项>0,与预测相反)。
    另猎:方向反向的反例——承诺落空经历→更强的消费释放(经历让人更信任?)。

    【猎获与消化】

    - 【战后日本 1961 全民健保→消费快速增长,被消化为 clean-slate】
    日本1961年建立国民皆保険后消费快速增长,未见"信任存量低→消费释放弱"。
    消化三要素:(i)clean slate——战前社会保险覆盖极窄(健康保险仅覆盖部分产业工人),
    无 prior 社保承诺落空史可供broken_promise_event_registry编码(暴露=0);
    (ii)经济增长极快(国民收入倍增计划1960-1970),收入效应本身稀释预防动机;
    (iii)1961年全民健保是战后国家重建叙事的一部分,政府整体可信度上行通道。
    此消化与推论预测自洽:当信任存量无差异(所有群体暴露=0)且信任水位上行时,
    推论退化为BR-L2-028无摩擦基准——推论不声称"永远有梯度",只声称"当信任存量
    有差异时产生梯度"。clean-slate场景不产生梯度在推论预测范围内。
    ⇒ 被消化,未净杀。

    - 【瑞典 1990s NDC养老金改革,被消化为软过渡而非承诺落空】
    瑞典1990s从DB转NDC(名义缴费确定型)养老金。对参保者而言未来待遇不再确定,
    但改革特征使其未必构成broken_promise_event_registry意义上的"承诺落空":
    (i)改革经全民讨论、政治共识(社民党与中间党派协商),(ii)新旧制度并行约20年
    (长过渡期,非突然削减),(iii)配套自动平衡机制(brake,增加可信度——承诺"养老金
    会自我调节"而非"我们保证某个数字")。按registry判据(i)(ii)(iii),此改革是否构成
    "承诺落空"本身有争议——改革是公开透明的制度调整(规则事先已知),而非
    "承诺被违背"(事后不兑现)。且1990s瑞典同期经历金融危机(房地产崩盘+银行
    救助),宏观环境使消费路径无法归因于单一社保改革。
    ⇒ 被消化(事件分类模糊+宏观混杂),未净杀。

    - 【东欧后社会主义国家(波兰/匈牙利/捷克)1990s-2000s社保转型,被消化为
    系统性混杂不可分离】
    东欧从国家社会主义(全面保障承诺)转入市场经济的过程中,经历了大规模社保
    收缩→再调整。若按registry判据(i)(养老金替代率大幅下调),多数东欧国家在
    1990s满足条件。但此处有致命混杂:整个经济制度同时转型(GDP大幅波动/失业从
    零飙升/价格自由化/大规模私有化),无法分离社保改革对消费的独立效应。且跨国
    比较(如vs奥地利/西德等未转型邻国)不是干净对照(起始制度/经济结构完全不同)。
    此案例的致命之处不在于"不支持推论",而在于"永远不能用于证伪或证实推论"——
    混杂大到任何消费差异都可以(也都不可以)归因于信任。这是此领域的结构性困难
    (最极端的承诺落空样本天然混杂),不是推论的错。
    ⇒ 被消化(混杂致命),暴露可测性忧虑而非逻辑缺陷。

    - 【智利 2019-2022年COVID期间提前提取养老金——接近消费端的自然实验,
    但被 excluded_outcomes 排除】
    智利在COVID期间三次允许参保人从AFP个人账户中提前提取养老金(每次最多10%)。
    总计提取约500亿美元(GDP的约18%)。此举等价于一次"从个人账户中释放资金"的
    外生消费机会——提供了"养老金账户→当期消费释放"这一因果链上距消费端最近的
    自然实验。但从本推论视角:(i)此政策为临时性(COVID紧急措施,非常规社保扩张),
    按excluded_outcomes("社保扩张伴随大规模转移支付")的边缘;(ii)提取的是个人账户
    (自有资金,非国家保障承诺),不同于本推论的"保障水平提升→预防动机下降"
    机制——本质是"释放流动性约束"而非"降低预防动机"。故不构成反例或锚。
    ⇒ 在射程边缘但被合理排除。

    - 【猎取"信任调节方向反向"的反例——经历了承诺落空反而消费释放更强?】
    逻辑上可能:经历过承诺落空的人,面对新一轮保障扩张时产生"终于有保障了"
    的对比效应→释放的被压抑需求甚至强于从未经历者→∂消费释放/∂信任存量<0。
    候选:中国2010s期间,此前长期被排除在城市社保之外的农民工群体,逐步纳入城市
    职工医保/养老保险后,消费释放反应可能强于从未被排除的城市居民(因"对比效应":
    从零到有 > 从有到更多)。但这反过来【支持】推论的正调节方向:农民工的"排除"
    是不被覆盖(no coverage),并非"保障承诺落空"(prior broken promise)——不被覆盖≠
    被承诺后又被违背,按registry不属于暴露组。无broken promise历史→信任存量
    不低→消费释放充分——这与推论预测的方向一致(正调节)。真正的方向反向需要:
    经历了registry注册的承诺落空事件→信任存量理应更低→但消费释放反而更强。
    未猎到此类净杀案例。
    ⇒ 方向反向的净杀反例不存在(候选的"农民工"实为支持推论的非暴露组高释放)。

    - 【最危险的潜在反例:中国 NRPS 跨县比较——养老金域的信任跨类型迁移问题】
    新型农村养老保险(NRPS)2009年起以县为单位交错推开,类似NCMS的rollout设计。
    与NCMS不同,农村地区在NRPS之前几乎无普遍养老金制度→合作医疗的"办停反复"
    史对养老金域是跨类型的——医疗承诺落空经历是否会降低对养老金新承诺的信任?
    这是推论未处理的开放问题。若发现:NCMS历史上"办停反复"多的县(高暴露县)
    在NRPS推开后消费释放与低暴露县无差异→按falsifiability(a)在同领域的扩展测试中
    被证伪。但也可被消化为"不同社保类型的信任弹性不同"(推论已自认此边界)→
    消化后推论的射程被窄化至"同类型社保内部"。此案例尚无已发表数据,但若未来
    出现→对推论的压力取决于消化的代价(射程收窄越狠,推论的跨域普遍性越弱)。
    ⇒ 潜在压力,暂无数据,未构成净杀。记为此领域的可测性路线图方向。

    - 【额外猎取:中国城镇职工医保个人账户改革(2021-2023)——最近的准实验】
    2021年起中国推行职工医保个人账户改革(单位缴费不再划入个人账户→全部进入
    统筹基金)。对参保者而言,个人账户资金减少(可感知的"损失"),统筹报销比例
    提升(较不显著的"增益")。部分参保者将此感知为"承诺落空"(个人账户的钱
    '被拿走了'),爆发了2023年初的舆论反弹。从本推论视角:经历此次改革的群体
    (感知"承诺落空")对后续医保新承诺(如门诊共济扩展)的信任应偏低→消费释放
    应弱于未经历者。但此改革太新(2023年),消费端的DiD数据尚不可得。且改革的
    "承诺落空"属性有争议(统筹比例提升的增益是否补偿了个人账户削减的损失)。
    ⇒ 太新无数据,但提供了中国语境下最近的准实验窗口——未来3-5年数据积累后
    可构成最干净的单一制度内信任-消费检验。

    【结论:无净杀反例存在。】
    猎到的最接近反例(瑞典NDC、东欧后社会主义)均被合理消化(事件分类模糊/
    混杂致命/clean-slate逻辑自洽)。推论核心主张经猎捕未被杀伤。但注意到一个模式:
    推论在理论上可证伪,在实践上"不容易被意外证伪"——因为需要(信任存量+社保
    扩张+消费释放)三量同框的数据极其稀缺,而三量同框的数据恰是推论的证伪条件。
    这不构成 DED-004式逻辑循环(推论本身的设计没有刻意制造数据稀缺以逃避证伪),
    但构成实证灰色地带——理论承担的经验风险低于其逻辑结构暗示的水平。
    此观察记入should-②(实证锚全景缺失)的补充说明。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发】。推论整体可证伪:三个falsifiability条件
    指定了可观测的、事前可判定的反例形态——(a)经历-反应口径的组间DiD差≤1pp
    (储蓄率)或≤0(组间差非正),(b)信任代理-消费释放相关的τ≤0.1,(c)时间×信任
    交互项方向与预测相反(>0而非<0)。anti_talisman四禁令封死最直白的循环路径:
    禁由消费反推信任、禁由消费反推事件分类、禁事后调时间起算点、禁无证据声称修复。
    三个falsifiability条件的每一条都给出了"什么观测值会杀死推论"的操作化判据,
    且分子/分母/测量口径已事前注册(除(c)的最小样本量门槛尚缺,见should_fixes)。

    与DED-004的差异:DED-004的核心问题是"用结论定义前提→永远为真",而DED-033
    的核心主张("信任差异→消费反应差异")是可被观测推翻的——若在控制混淆后测不到
    差异,推论塌。推论的风险不是"逻辑上不可能错",而是"实证上不容易被测到错"——
    因为三量同框的数据稀缺。这不是不可证伪,是可测性低——不同于DED-004的逻辑循环。

    ⇒ DED-004未复发。

    DED-007(测量轴焊死):【未复发】。自变量(信任存量)与被预测量(消费释放)的
    测量源完全正交:(i)信任来自政策历史事件编码(通道A)或社保扩张前调查态度题项
    (通道B)——不含消费信息;(ii)消费来自社保扩张后家庭支出调查——不含信任题项;
    (iii)两套数据仅在个体/地区标识符上匹配,无内容/测量工具/采集时点的重叠。
    anti_talisman四禁令进一步封死反向推断。这根本不同于DED-007的致命设计——DED-007
    的"通货需求"用"货币量"测量,而"货币量"同时出现在自变量和因变量的分母中,
    形成数学恒等式级焊死。DED-033的信任与消费在概念、数据源、时点、工具四个
    维度上均正交——轴的独立性是真实且干净的。

    ⇒ DED-007未复发。

  required_fixes: []

  should_fixes:
    - |
      [should-1] 补充"双通道伪收敛"的削弱条件(对应 verdict_note should-①):
      当前falsifiability削弱条件已覆盖(a)不成立(b)成立和(a)成立(b)不成立的
      非对称场景,但未覆盖(a)(b)同时成立而通道A第一阶段(事件暴露→调查信任差异)
      不显著的场景。此时两通道的表面收敛可能是非信任混杂+真实信任效应分别驱动的
      巧合,应要求第一阶段显式验证。
      修订方案:在falsifiability削弱条件段中增加一条:"若(a)成立且(b)成立,但通道A
      的第一阶段(暴露于承诺落空事件→调查信任差异)不显著——即暴露差异不能显著
      预测调查信任差异——则(a)的成功不能归因于信任调节(可能由收入/财富/金融
      可及性等非信任机制驱动),推论仅以(b)独立承重信任调节,证据等级从'双通道
      收敛'降格为'单通道(b)独立支撑'。"修订位置:falsifiability末尾的削弱条件段。
    - |
      [should-2] 增加"实证锚全景缺失"的整合性诚实声明(对应 verdict_note should-②):
      三个 real_world_anchors 分散标注了各自的 weak/moderate confidence和承重范围,
      但缺少一处整合性的声明:当前无任何锚按注册口径完整测量(信任存量+社保扩张幅度+
      消费释放)三量,推论在实证上处于"逻辑可证伪、实践未验证"状态。
      修订方案:在 real_world_anchors 末尾(现有整体诚实标注处)增加一段整合声明:
      "三锚全景验证状态:当前三个锚均非按本推论注册的三量(信任存量+社保扩张幅度+
      消费释放)完整测量的干净实例——NCMS锚缺信任存量的独立编码(事后推断),
      东德锚缺社保扩张事件的挂钩,智利锚缺消费释放的因果检验(链太长)。三锚各自
      承重推论的不同片段,无一独立验证核心交互命题'信任存量调节社保→消费传导
      效率'。推论在实证上仍是 hypothesis 而非 confirmed——此状态与推论的结构质量
      (逻辑/测量/证伪设计)形成落差,诚实标注以待未来数据填补。"修订位置:
      real_world_anchors 末尾。
    - |
      [should-3] 重构防平凡化守卫:个体层与群体层分离(对应 verdict_note should-③):
      当前discriminant_validity的"防平凡化守卫"段将个体层近分析性命题("不信则
      不打折")与群体层经验命题("群体间信任差异可事前预测消费释放梯度")编在一起。
      宜将守卫按两层重新组织:(i)【个体层防线】本推论不否认"不信则折扣"在个体层
      近乎分析性——信任的定义本身包含"据此行动的倾向",不信的东西自然不值原价。
      但这不影响群体层的可证伪性,因为——(ii)【群体层防线】推论真正的经验赌注
      是:按事前注册的独立通道测出的群体间信任差异,能预测群体间消费释放的梯度,
      且梯度方向、幅度、衰减节律均可被经验数据推翻。若测不到梯度(组间差≤1pp
      储蓄率)、或梯度方向反向(经历组释放更多)、或衰减节律与031预测不符(修复
      比摧毁还快),推论在群体层被证伪——即使个体层的"不信则折扣"逻辑仍为真。
      此两层切割将平凡化攻击的焦点从"你只是在说信任重要"(vacuous)转移到"你的
      梯度预测可能测不到或测出来是反向的"(falsifiable)。修订位置:discriminant_
      validity "防平凡化守卫"段。
    - |
      [should-4] 诚实标注时间衰减检验(c)的"最难测即最独判"不对称(对应 verdict_note
      should-④):falsifiability(c)要求≥10年政策稳定期,而(c)恰是推论区别于信息不对称/
      习惯形成的最独判别项。最独特的预测最难测——此不对称应在(c)的诚实标注中
      显式声明。同时宜为(c)注册一个"最小可用样本量"门槛(如≥3个国家/地区各
      ≥10年面板数据),未达标时(c)的状态为"暂不可测"(not yet testable)而非"预注册
      待裁决"(pre-registered pending adjudication)——后者暗示推论在(c)上承担风险,
      但若窗口不满足,实质上(c)免于裁决。修订方案:在falsifiability(c)末尾增加:
      "(c)的裁决需≥3个独立社保扩张案例各≥10年面板数据;数据积累不足时,(c)的
