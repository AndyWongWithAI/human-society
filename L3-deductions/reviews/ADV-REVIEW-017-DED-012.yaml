id: ADV-REVIEW-017
type: adversarial_review
reviews: DED-012
layer: L3-deductions

人话摘要: |
  对 DED-012(掠夺-保护同源 + 坐寇化:领地固定性↑ ⇒ 抽税-供秩序↑、掠夺烈度↓,单调+可逆,
  招牌是"高固定性 × 长期控制 × 纯榨尽零秩序"这一格预测为空)的独立对抗审查记录。
  round-1 裁 needs_revision:核心两条腿(暴力两用同源=近定义诚实降级 + 坐地暴力垄断者抽税-供
  秩序=Olson/Tilly 射程)都活,测量轴主干正交、anti-talisman 大体兑现、连续量没被硬二分、
  海盗/军阀/黑手党/维京锚无致命事实错。但反例猎捕【净到一族活反例】:加勒比委托监护制
  (encomienda)与刚果自由邦/普图马约橡胶恐怖——都是【结构独立测的高领地固定性】(据点化、
  走不掉、无有效争夺、长期控制)却【持续榨尽税基、零真实秩序供给】,恰好填满招牌空格 (iii)、
  证伪无条件单调 (i)。根因:推论的贴现机制默认税基是【可再生的流量】(农业人口年年产出),
  当税基是【可枯竭的存量/可替换的劳力】(冲积金矿 + 进口奴隶、暴涨型野生橡胶)时,即便固定
  性拉满,最优仍是榨尽——固定性不再单调决定抽取模式。这不是 Olson 复述那条软腿(作者自认的
  primary_suspect),而是作者漏认的【税基可再生性混杂变量】。抓到【一条 required】:把 (i)/(iii)/(a)
  的无条件断言【收窄到可再生流量税基】,或把"税基可再生性/可替换性"作为显式共驱动量写进机制+
  排除结果+boundary,否则招牌预测被固定的攫取型殖民/奴役政权直接证伪。另 3 条 should/minor。
  核心未塌(可再生农业税基上的坐寇化+可逆稳健、锚扎实),外科式收窄即救活 ⇒ needs_revision 非 rejected。

target: DED-012
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮无关)。评分卡红旗 10 条逐项攻 +
  反例猎捕(判 verified 前必做)+ DED-004(不可证伪循环)/DED-007(测量轴焊死)复发检查。裁决三态照
  评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活反例③不重蹈 DED-004/007。

round_1:
  reviewer: "独立子 Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    这是一条【核心稳、招牌过度伸张】的候选。作者显式吸收了前几轮死因:①"暴力两用/掠夺-保护
    同源"诚实降级为【近定义的结构观察、非发动机】(不冒充非平凡内核,学到 DED-008/009 的诚实定位);
    ②extraction_mode 明列【连续谱】、混合态按主导成分标注、不硬二分(学到 DED-006);③测量轴主干
    正交——固定性按结构(工事/流动性/退出成本)测、抽取模式按征取规则化+秩序供给测(学到 DED-007);
    ④anti_talisman_clause 双向禁反推、明文禁止"遇高固定性却纯掠夺就事后重标为其实是流寇"来消化
    (学到 DED-004)。core 的两条腿都活:近定义的同源 + Olson/Tilly 射程内的坐寇化,作者不以后者为
    卖点、把载重押在"领地固定性作为事前独立于建国结果的驱动量 + 单调 + 可逆"。
    但反例猎捕【净到一族 scope 内活反例】,恰落在作者【漏认】的软腿上:税基【可再生性】混杂变量。
    加勒比委托监护制(西属伊斯帕尼奥拉/古巴的 encomienda)与刚果自由邦/普图马约(Casa Arana)橡胶
    恐怖——三者均由【独立结构指标】测得【高领地固定性】(据点化的定居者/公司-国家、走不掉、核心
    区无有效军事争夺、长期控制),却【持续破坏性榨尽自身税基(原住民人口崩溃/灭绝)、几乎零真实
    秩序供给(治安/裁决是为攫取服务而非保全被治者)】。这【正是】招牌空格 (iii)"高固定性 × 长期控制 ×
    纯榨尽零秩序"被填上,且直接证伪无条件单调 (i)。根因诊断:derivation 步 2 的贴现机制"horizon 拉长 ⇒
    内部化未来税基 ⇒ 保全"【默认税基是可再生流量】(农业人口逐年产出);当所控价值是【可枯竭存量】
    (冲积金矿)或【可替换劳力】(进口奴隶)或【暴涨型一次性商品】(野生橡胶,采割即毁藤蔓)时,没有
    "未来流量"可内部化,即便固定性拉满、horizon 很长,最优仍是榨尽存量/耗竭劳力再换一批。固定性不再
    单调决定抽取模式——摆动变量是税基可再生性,不是固定性。
    关键:此反例【不可】被作者现有两个逃逸口合法消化——(a) 排除结果(2)"帝国派驻短任期轮调代理"
    不适用:加勒比 encomendero 是【定居谋永业】的坐寇原型(封赠常达两三"世"、主动求永久),不是轮调
    短任期代理;(b) boundary case 2"短命割据→重测固定性→若被争夺则算低固定性"不适用:加勒比原住民
    被迅速征服、几乎无能力持续军事争夺,固定性按争夺判据【不低】。两个逃逸口都关不住它。且加勒比 vs
    墨西哥中部的【同制度对照】(同为 encomienda、同为territorially fixed 封赠者,墨西哥稠密可再生农业
    人口 ⇒ 演化为稳定贡赋+corregidor 秩序;加勒比金矿存量+可换岛民 ⇒ 灭绝式榨尽)近乎一个自然实验:
    固定性大体不变、可再生性变、抽取模式反转——干净地把摆动变量隔离到【可再生性】而非固定性。
    据此判 needs_revision:核心未塌(可再生农业税基上的坐寇化 + 可逆单调稳健、锚扎实),但招牌 (i)/(iii)/(a)
    的【无条件】断言被证伪,须【收窄到可再生流量税基】或【把税基可再生性/可替换性作为显式共驱动量】。
    这是外科式收窄、非推倒重来 ⇒ needs_revision,不是 rejected。较 DED-009 r1(needs_revision 的唯一驱动
    是循环阈值、无活反例):本轮有【真活反例】直接证伪无条件招牌,needs_revision 的地基更硬,非放水非过杀。
  red_flag_findings:
    brick_conclusion: |
      部分命中(should,作者已显式认领,不判 required)。核心命题"坐地暴力垄断者会抽税-供秩序、
      演化为国家"与 Olson 'stationary bandit'、Tilly 'war-making = state-making' 高度重合,作者自认
      (statement/discriminant 多处)、且【不以此为卖点】。承重砖侧:BR-L2-008 只给"掠夺真实且随净收益
      上升"(不分流寇/坐寇、不给固定性驱动)、BR-L2-010 只给"非人格化制度能替代人际信任"(capability,
      不给驱动量),两砖原文皆【不含】"领地固定性(事前结构)⟺ 抽税-供秩序比例"这一联合带向主张。故
      brick=conclusion 在【系统承重砖】层不成立(内核不在 BR-L2-008/010 原文)。真正的重叠对象是
      Olson/Tilly 这一【体系外文献常识】,作者诚实前置"载重新意在①事前独立归因②单调③可逆、核心命题
      本身近砖非卖点"。⇒ 非平凡内核不在单砖 ⇒ 不判 required;宜再把"①事前归因是唯一抗证伪卖点"钉得
      更死(见 primary_suspect)。
    nontriviality_cell_check: |
      【攻穿——本轮 required 所在】。招牌空格"高领地固定性 × 长期控制 × 纯掠夺/榨尽税基/零秩序"被断言
      为空(iii),并作为 falsifiability(a) 的证伪靶。作者论证其非同义反复:四砖都不单独给"固定性⟺抽取
      模式"。这一步【逻辑上对】——空格确非被砖平凡强制。但"预测为空"是一条【经验普遍断言】,而经验上
      它【非空】:固定的攫取型殖民/奴役政权填得进去。根因是机制默认税基可再生(见 verdict_note)。故空格
      的"空"不是同义反复(那样是 DED-004),而是【无条件伸张过头的错误经验预测】——反例猎捕已填之(下)。
      修法:把空格断言的射程收窄到【可再生流量税基】,或把可再生性作共驱动量,则空格在其射程内可复为真
      经验主张。⇒ required。
    measurement_orthogonality: |
      主干不重蹈 DED-007。承重对:territorial_fixity(据点化/流动性/退出成本 by 军事地理/考古结构事实,
      measurement 明文禁用"是否抽税/是否建国"回填)vs extraction_mode(征取规则化+秩序供给 by 税册/法令/
      工事驻军)——异源正交,anti_talisman_clause 双向禁反推在位。残留【中度软点,should】:自变量第 (4)
      分量"排他控制的预期 horizon"是 derivation 步 2 贴现机制的【中介理论量】,与被预测量在机制上耦合;
      作者要求它由 (1)(2)(3)+竞争者密度【结构事前】估、不由抽取行为回填——只要严格执行则不算焊死,但它
      是 boundary case 2"短命割据→重测 horizon"这个逃逸口的载体,给了"事后调 horizon 消化反例"的中度
      余地。宜把 (4) 明文钉死为 (1)(2)(3)+竞争者密度的确定函数、禁止独立浮动(与 DED-009 的 θ* 同构处理)。
      记 should,非焊死主轴。
    scope_hook_independent_of_result: |
      基本不命中,但【排除结果(2)是最软的一环、且不覆盖真反例】。excluded_outcomes:(1) 非暴力集团
      供秩序 → 按"秩序供给者是否为施暴的排他控制者"这一【事前渠道】划,做对(学到 DED-005);(3) 换 vs 抢
      → 归 DED-005 射程,做对。但 (2)"外生强加固定性/短任期轮调代理"按"实际征取代理的个人有效 horizon"
      划——这是结果邻近的口子:测"个人 horizon"若滑向"他榨尽⇒必短 horizon"就成 talisman。作者声称按
      轮调/任期【政策结构事前】测,可辩护。真正的问题是:该排除口【压根不覆盖】本轮活反例——加勒比
      encomendero 不是轮调短任期代理而是定居谋永业者,却仍榨尽。故 scope 钩子对已知类型划得干净,但漏了
      "固定却面对不可再生/可替换税基"这一整类,须补(与 required 同源)。
    criterion_tier_match: |
      不命中(学到 DED-006)。驱动量(固定性)连续、被预测量(抽取模式)明列【纯掠夺↔抽税-供秩序连续谱】、
      混合态按主导成分/分布标注不二分、(iii) 明列单调。流寇/坐寇不是被硬切二分的档,而是连续谱两端命名。
      合规。
    anti_talisman_cashed: |
      大体兑现(should 级残留)。承重锚里【至少一个真独立测出驱动量】:据点化军阀/封建领主的筑城/坞堡/
      驻军属军事地理-考古结构事实,可独立于"是否被承认为政权/是否征税"测出高固定性;黑手党家族的地盘
      绑定可由地域结构独立测。anti_talisman_clause 明文禁双向反推(不因抽税倒推固定、不因纯掠夺倒推未固定、
      尤禁遇反例事后重标为流寇)。防线在位。残留:驱动量对被预测量(抽取比例)的【定量驱动】是断言多于
      展示(无实际数据集逐案编码抽取率×固定性),confidence 已诚实降级(moderate/moderate-strong)。不判
      required,但注意本轮反例正是"独立测得高固定性、抽取模式却反向"的实例——anti-talisman 不能靠重标
      固定性来消化它(作者自己的 clause 也禁),只能靠收窄射程(required)。
    anchor_fact_check: |
      无 DED-007 式致命事实错。核对:据点化军阀/欧洲封建领主由劫掠转田赋/地租+领地秩序 ✓(标准史);
      海盗/游牧突袭/流寇=流寇端 ✓(大体);Gambetta《The Sicilian Mafia: The Business of Private Protection》
      黑手党=私力保护的坐寇 ✓(经典);维京突袭→Danelaw/诺曼底定居领主的可逆锚 ✓。【should】(ii)"海盗/
      游牧突袭=维持纯掠夺"措辞过头:多个【有固定基地】的海上武装发展出制度化抽税-供秩序——巴巴里海盗
      国(阿尔及尔/突尼斯/的黎波里:海上机动劫掠,但以固定都城为基,建立常设财政/法庭/制度化赎金体系)、
      郑芝龙-郑成功海上集团(以厦门/台湾为固定基地,对过往船只征收制度化"令旗"通行费)。这些【反而支持】
      推论——把固定性定位到【实际控制结构的基地】,基地固定→生出秩序、机动劫掠臂→纯掠夺,与维京同构;
      但 (ii) 的笼统"海盗=纯掠夺"应改为"【无固定基地】的纯机动海上集团"并承认有基地者会坐寇化,否则像
      被巴巴里/郑氏证伪。记 should(其实是把支持锚讲全)。
    definition_vs_prediction: |
      部分命中(should)。"暴力两用/同源"作者诚实标为【近定义结构观察、非发动机】——处理得当,不冒充
      预测。真正的预测臂是 (i) 单调 + (ii) 流寇端 + (iii) 空格 + 可逆,均为可证伪经验主张(前提:固定性
      结构测)。但要警惕【renewability 反例被事后定义化消化】的 DED-004 风险:若作者辩称"榨尽一个不可
      再生存量【也是】坐寇最优、故非反例",则推论滑向"凡实际抽取皆为给定条件下最优"=不可证伪的合理化。
      堵法:把可再生性【事前】写进射程/机制,别让它成为事后开脱的活门(与 required 同源)。
    enumeration_and_species: |
      不命中(本推论非 N-species 枚举结构)。抽取模式是连续谱、非声称穷尽的物种划分,故 DED-008 式
      "第 N+1 类"不是主结构。我仍主动探第三种模式:"供秩序但不系统抽税"(重声誉的劫掠者)/"抽税但零秩序"
      (纯包税)——均落在连续谱的混合区,非正交第三轴。攻不穿。
    primary_suspect_aim: |
      【半对——漏认更致命软腿,should→触及 required】。文件自认最弱腿="是否只是 Olson 复述",并把存活
      全押在"领地固定性能否事前独立于建国结果测得并独立预测抽取比例"。这条【是】一条真软腿,且作者的
      防守(事前结构测 + anti-talisman)大体成立。但它【不是最致命的那条】:更致命的是【税基可再生性
      混杂变量】——它不攻"固定性能否独立测",而攻"固定性【是否单调足以】决定抽取模式"。作者的
      boundary_cases 只备了"短命割据(低有效固定性)"与"轮调代理(低个人 horizon)"两种消化机制,【都在
      固定性一侧做文章】,完全没有预备"固定却因税基不可再生/可替换而榨尽"这一类。primary_suspect 指对
      了一条腿、漏了更能证伪招牌的另一条腿 ⇒ 记为 required 的动机来源。
  counterexample_hunt: |
    主动构造能填招牌空格"高领地固定性(结构独立测)× 长期控制 × 纯掠夺/榨尽税基/零真实秩序"的干净案例,
    认真找历史/跨文化实例,刻意攻【固定性拉满却仍榨尽】:
    - 加勒比委托监护制(encomienda,伊斯帕尼奥拉/古巴,约 1493-1540)【净杀候选,活】:encomendero 是
      定居谋永业者,受封固定辖地+原住民劳力,筑城建镇、走不掉、封赠常达两三"世"(高据点化/低流动/高退出
      成本);核心区原住民迅速被征服、几无持续军事争夺(按争夺判据固定性【不低】)。却在数十年内把泰诺人
      榨尽至人口崩溃/灭绝、几乎零真实秩序供给(治安/裁决只服务攫取)。落纯掠夺端。作者两个逃逸口都关不住:
      非轮调短任期代理(排除结果 2 不适用)、非被争夺的短命割据(boundary 2 不适用)。根因:冲积金矿=可
      枯竭【存量】+ 岛民可用进口奴隶【替换】⇒ 无"未来流量"可内部化,固定却最优榨尽。⇒【填满空格 (iii)、
      证伪无条件单调 (i)】。
    - 加勒比 vs 墨西哥中部 encomienda【同制度对照,近自然实验】:同为 territorially fixed 的封赠者,墨西哥
      稠密【可再生】农业人口 ⇒ 演化为稳定贡赋+corregidor 秩序(坐寇);加勒比存量金矿+可换劳力 ⇒ 灭绝式
      榨尽(流寇端)。固定性大体不变、可再生性变、抽取模式反转 ⇒ 干净隔离出【摆动变量=税基可再生性,非
      固定性】。这是本轮最强一击。
    - 刚果自由邦(利奥波德二世,1885-1908)【活,但可部分消化】:固定的公司-国家机器、约 23 年控制、核心
      区无有效争夺,却以橡胶恐怖榨尽(数百万人口崩溃)、零真实秩序。部分可被作者 boundary 1(计件短任期
      特许代理、个人 horizon 短)消化;但暴涨型野生橡胶=采割即毁的【一次性商品】,即便完全固定的经营者也
      理性榨尽 ⇒ 仍反哺 renewability 论点。半活。
    - 普图马约/Casa Arana 橡胶(秘鲁亚马逊,约 1900-1912)【活,同上族】:固定站点的公司控制原住民劳力,
      灭绝式榨取。同为不可再生/暴涨商品导致固定却榨尽。反哺 renewability。
    - 巴巴里海盗国 / 郑芝龙-郑成功海上集团【被消化为支持,揭 (ii) 过头】:海上机动却有固定都城/基地 ⇒
      基地结构生出制度化财政/法庭/通行费(坐寇),机动臂纯劫掠 ⇒ 与维京同构,支持"固定性定位到基地"。
      非空格反例,但证明 (ii)"海盗=纯掠夺"措辞过头。
    - 蒙古早期(花剌子模屠灭)vs 元(坐地抽税-供秩序)【被消化为支持/可逆锚】:机动→榨尽,坐地→坐寇。支持。
    结论:【净杀=否(核心未塌),但揭出招牌处过度伸张、且猎到一族活反例填满空格 (iii)】。加勒比 encomienda
    (+刚果/普图马约)是【结构独立测的高固定性却持续榨尽零秩序】的真实例,直接命中 falsifiability(a) 的
    空格、证伪无条件单调 (i)。作者两个消化机制(短命割据/轮调代理)均在固定性一侧、关不住它。根因是贴现
    机制默认税基可再生。⇒ 定位到具体预测 (i)/(iii)/(a),列 required(收窄射程/补共驱动量)。核心(可再生
    农业税基上的坐寇化+可逆)未被净杀 ⇒ needs_revision 而非 rejected。verified 硬门第 2 条【未过】(猎到
    scope 内活反例),故本轮无论如何不能判 verified。
  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【无全面复发,但有一处必须堵的活门】。anti_talisman_clause 与 measurement
    方向对、双向禁反推、明禁"遇高固定性却纯掠夺就事后重标为流寇"——这一条恰好【预先禁止】了消化本轮
    反例的最脏手法,值得肯定。残留活门:①boundary case 2 用"重测 horizon(有无争夺)"消化"坐地却榨尽",
    只要 horizon 严格由结构争夺事实事前测则不循环,但它是活门载体,须钉死(should);②更实质的循环风险
    在【renewability 若被事后定义化】(辩称"榨尽存量也是坐寇最优"),那会把 (iii)/(a) 变成按条件恒可开脱=
    不可证伪——必须把可再生性【事前】写进射程,否则招牌预测可被无条件合理化(这条是 required 的另一面)。
    DED-007(焊死测量轴):主干未复发,三轴异源正交、锚无事实反转、连续单调对齐。残留仅自变量第 (4) 分量
    "预期 horizon"与贴现机制耦合的中度软点(should:钉为 (1)(2)(3)+竞争者密度的确定函数、禁独立浮动)。
  required_fixes:
    - |
      [required] 收窄/补驱动量以救活招牌预测:derivation 步 2 的贴现逻辑("horizon 拉长 ⇒ 内部化未来
      税基 ⇒ 保全")【默认税基是可再生流量】(逐年产出的农业人口),但对【可枯竭存量(冲积金矿)/可
      替换劳力(进口奴隶)/暴涨型一次性商品(野生橡胶)】不成立——此时固定性拉满仍最优榨尽。加勒比
      encomienda、刚果自由邦、普图马约橡胶是【结构独立测的高固定性却持续榨尽税基、零真实秩序】的真实
      例,填满招牌空格 (iii)、证伪无条件单调 (i)、命中 falsifiability(a),且不可被现有"短命割据/轮调代理"
      两个逃逸口消化(加勒比封赠者是定居谋永业的坐寇原型、核心区无有效争夺)。二选一修法:(A) 把 (i)/(iii)/(a)
      的射程【显式收窄到"税基为可再生流量(可自我再生产的人口+可复现的产出)"】,并把"存量/可替换/一次性
      商品税基"列入 excluded_outcomes 或新 boundary_case;或 (B) 把【税基可再生性/可替换性】作为与领地固定
      性并列的【显式共驱动量】写进机制,单调断言改为"给定可再生流量税基,固定性↑⇒抽税-供序↑"。否则招牌
      预测被固定的攫取型殖民/奴役政权直接证伪。以加勒比 vs 墨西哥中部同制度对照(固定性近似、可再生性变、
      抽取模式反转)作为该修订的锚,并入 real_world_anchors 或 boundary_cases。
    - |
      [should] 钉死自变量第 (4) 分量"排他控制的预期 horizon":明文规定它是 (1)据点化 (2)物理流动性
      (3)退出成本 + 竞争者密度/地形封闭性【这些结构事前量的确定函数】,禁止独立浮动、尤禁由"是否争夺
      得逞/是否榨尽"回填(与 DED-009 的 θ* 同构处理)。这关死 boundary case 2"短命割据→事后重测 horizon"
      的活门,使 DED-004 循环读法无处附着。
    - |
      [should] 修正预测 (ii) 的过头措辞:把"海盗/游牧突袭队=维持纯掠夺"改为"【无固定基地】的纯机动
      集团维持纯掠夺",并显式承认【有固定基地的海上/机动武装】(巴巴里海盗国、郑氏海商集团)会在基地
      结构上坐寇化(制度化财政/法庭/通行费),机动臂纯劫掠——把固定性定位到【实际控制结构的基地】,
      这些是支持锚而非反例,现措辞会被它们表面证伪。
    - |
      [minor] primary_suspect 补认第二条更致命软腿:文件把存活全押在"是否只是 Olson 复述/固定性能否
      事前独立测",漏认【税基可再生性混杂变量】这条能直接证伪无条件招牌的软腿。宜在 falsification_trace
      增列 secondary/tertiary suspect:"固定性是否【单调足以】决定抽取模式,抑或被税基可再生性混杂",
      与 required 修订呼应,别让读者以为唯一风险是 Olson 复述。

