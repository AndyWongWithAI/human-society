    ②旗舰锚(加勒比 vs 墨西哥)未真正固定住固定性——存量枯竭会【内生降低】固定性(矿竭后 encomendero 弃岛
    奔大陆),depletability↔mobility 相关,"固定性近似不变"是过强隔离主张;③混合税基"按主导价值来源标注"的
