      可再生流量↔存量/可替换连续),混合态按主导成分标注,(i) 明列单调、非二档。学到 DED-006。合规。
    anti_talisman_cashed: |
      大体兑现(should 级残留)。至少一锚【真独立测出驱动量】:据点化军阀/封建领主的筑城/坞堡/驻军(军事地理-
      考古)、黑手党地盘绑定(地域结构),均可独立于"是否被承认政权/是否征税"测出高固定性;加勒比 vs 墨西哥的
      encomendero 据点化/定居永业属结构事实、税基类型属资源/人口结构,双侧独立于抽取结果。三量 anti-talisman
      双向禁反推明文在位。残留:驱动量对抽取比例的【定量】驱动仍是断言多于逐案编码数据(confidence 已诚实降
      moderate/moderate-strong);且混合税基"主导来源"判据的事前性须再钉(同 orthogonality 的 should)。不判 required。
    anchor_fact_check: |
      无致命事实错(一处过强隔离主张记 should)。核对:据点化军阀/欧洲封建领主由劫掠转田赋地租+领地秩序 ✓;
      无固定基地机动集团=流寇端、有固定基地海上武装(巴巴里以阿尔及尔/突尼斯/的黎波里为基建常设财政法庭赎金;
      郑芝龙-郑成功以厦门/台湾为基征制度化令旗通行费)在基地坐寇化 ✓(round_1 已把 (ii) 收正);Gambetta 黑手党
      私力保护坐寇 ✓;维京→Danelaw/诺曼底定居可逆锚 ✓;加勒比(泰诺崩溃+存量金矿+进口奴隶替换)vs 墨西哥中部
      (稠密再生农业→贡赋+corregidor)对照 ✓(标准史,呼应 Engerman-Sokoloff)。【should】旗舰锚的"固定性近似
      不变、只变可再生性"是【过强隔离】:存量枯竭会【内生降低】固定性——矿竭+泰诺崩溃后 encomendero famously
      弃岛奔大陆(墨西哥/秘鲁),depletability↔mobility 正相关,故加勒比一侧固定性并非外生恒定。此不杀共驱动量
      (机制自身逻辑+刚果/普图马约旁证仍立),但须诚实降"干净自然实验"为"近自然实验、固定性受内生汇合污染"。
    definition_vs_prediction: |
      部分命中(should,已比 round_1 收紧)。"暴力两用/同源"仍诚实标为【近定义结构观察、非发动机】,不冒充预测。
      预测臂 (i)单调/(ii)流寇端/(iii)空格/可逆/(d)共驱动量证伪均为可证伪经验主张。round_1 警示的"共驱动量被事后
      定义化"风险已被 anti_talisman_clause 扩条 + falsifiability(d) + 事前结构测三重堵住。残留 should:混合税基的
      "主导价值来源"若在事后判定,仍是把可再生性【局部定义化】的窄缝(同 ③),须钉事前份额。
    enumeration_and_species: |
      不命中(非 N-species 枚举结构)。抽取模式是连续谱、非声称穷尽的物种划分。我仍主动探正交第 N+1 模式:
      "供秩序但不保全税基"——波托西即此:精密行政/司法秩序【在场】,却对再生劳力(安第斯米塔人口)毁灭式榨取、
      对存量白银榨尽。它【不】证伪推论(白银=存量→共驱动量预测榨尽;安第斯劳力被当作为存量服务的可耗投入),但
      揭出坐寇端把"供秩序"与"保全税基"【捆绑】而二者可解耦 ⇒ should(点明载重签名是保全税基而非行政秩序在场)。
    primary_suspect_aim: |
      指对(round_1 补认已到位)。文件 primary_suspect 现【并列】两条软腿:①Olson 复述/固定性能否事前独立测;
      ②税基可再生性混杂(攻固定性是否单调足以决定抽取模式)。②正是 round_1 的 required 来源,已被显式收进共驱动量。
      我另指一条【第三软腿,should】:共驱动量④本身与资源诅咒/要素禀赋文献重叠,故推论真实 delta 比自述("载重全在
      ①②③④")更窄——最弱环其实是"扣掉 Olson(核心)+资源诅咒(④)后,①②③的联合事前框架是否够 non-trivial"。
      这不塌核心(联合框架+事前结构测仍是可证伪的真主张),但作者宜把 novelty 诚实收窄(见 required_should ①)。
  counterexample_hunt: |
    判 verified 前亲自猎捕,专攻收窄后招牌:构造"结构独立测的高固定性 ∧ 结构独立测的可再生流量税基 ∧ 长期
    纯榨尽/零秩序/系统毁基"的干净 Type-A(能同时躲开【固定性一侧】与【共驱动量】两条逃逸口者才算净杀):
    - 孟加拉·东印度公司早期(1765 Diwani-1793 永久settlement,含 1770 大饥荒)【最强一击,被消化】:
      固定性高(威廉堡/常驻军/据点化、Buxar 后核心区无强争夺);税基【无争议可再生】(孟加拉农业人口/年度田赋)
      ——干净躲开共驱动量(非存量/非可替换劳力)。却在 1769-70 维持/加征田赋、约 1/3 人口死亡、毁灭性榨尽再生
      基。表面命中 (a)。但两口消化合法关住它:(1)【实际征取者】是年/五年短约的包税人(zamindar/amil)——个人
      horizon 短,归 boundary 1(短任期代理),且包税契约期是【事前结构事实】、非事后回填;(2)公司【非零秩序】(设
      法庭/行政)、且轨迹【朝坐寇端移动】(1793 永久 settlement=规则化田赋+产权秩序)——反成【可逆/轨迹】支持。
      净:被消化,反哺"测行使者 horizon"逻辑;但暴露 boundary 1(代理 horizon)承重极重,是收窄招牌真正的承压腿。
    - 苏联乌克兰大饥荒(Holodomor,1932-33)【次强,被消化】:固定性拉满(既成国家、无争夺、长 horizon)、税基
      可再生(产粮农民)、却毁灭性征粮致数百万死、毁再生基。表面像 Type-A。消化口:(1)苏联【别处供秩序】——整体
      是供秩序的坐寇式国家,按 falsifiability 注1"在场供秩序即本推论所预测",非(a)的"零秩序";(2)动机是政治/
      意识形态(碾碎集体化抵抗/惩罚民族主义),落在 extraction_mode 的【资源榨取优化】射程之外。净:被消化,但暴露
      "主导形态"计量单位与"政治性毁基"射程未界定(should ④),否则局部区域-年会被读作 (a) 命中。
    - 波托西·米塔(Potosí mita)【被消化,揭捆绑解耦】:固定殖民国家、精密行政秩序在场,却对存量白银榨尽 +
      对再生的安第斯劳力毁灭式征用。白银=存量→共驱动量预测榨尽;非 (a)。但"有秩序却不保全再生基"揭出坐寇端
      "供秩序≠保全税基"可解耦(should ⑤)。
    - 美南奴隶制(1808 禁进口后靠自然繁殖)【反成支持】:进口断绝后被奴役人口成【自我再生流量】,种植园主转向
      保全/"繁殖"式对待——可再生性↑⇒保全式↑,与加勒比高死亡率+进口替换(榨尽)构成又一同族自然对照,支持共驱动量。
    - 亚述迁民安置抽税、华伦斯坦"以战养战"驻扎即规则化【反成支持】:安置再生人口后抽税=坐寇;驻扎生规则化征取。
    结论:【无干净 Type-A 净杀存在】。最强两击(孟加拉/Holodomor)均被 boundary 1 / 供秩序-射程机制【合法】消化,
    且这些消化口的判据(包税契约期、轮调政策、供秩序在场)均事前结构可测、非事后回填 ⇒ 消化合法、非 anti-talisman
    偷生。其余反成支持/可逆锚。收窄后核心与招牌经猎捕未被净杀 ⇒ verified 硬门第 2 条【通过】。附带揭出的
    boundary-1 承重过重 / 单位-射程未界定 / 供秩序-保全解耦均为 should,不构成 scope 内活反例。
  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发,活门已堵】。round_1 点名的两活门均被整改关死:①boundary 2"短命割据→
    事后重估 horizon"——现 (4)预期 horizon 明文=(1)(2)(3)+竞争者密度/地形的【确定函数】、无独立自由度、禁独立
    浮动、禁由"是否争夺得逞/是否榨尽/是否建国"回填,循环读法无处附着;②共驱动量"事后定义化"(辩称榨尽存量也是
    坐寇最优)——被 anti_talisman_clause 扩条(税基可再生性须由再生结构独立测、禁遇榨尽即事后判不可再生)+
    falsifiability(d)(共驱动量自身可独立证伪)双堵。我复验:推论此刻仍禁止一个【真实可发生】的配置(高固定∧可再生
    却毁基零秩序),故未坍缩为恒可开脱。残留唯一窄缝=混合税基"主导来源"事后判定风险(should ③),不足以复活循环。
    DED-007(焊死测量轴):【未复发】。三轴(固定性/抽取模式/可再生性)异源正交、各由独立结构指标测、三量 anti-
    talisman 双向禁反推;锚无事实反转;连续单调对齐。唯一 should 级软点是混合税基定档的事前性须再钉,非焊死主轴。
  should_improvements:
    - |
      [should] 披露共驱动量④(税基可再生性)与既有政治经济学文献的高度重叠——资源诅咒/可掠夺 vs 弥散资源/
      Engerman-Sokoloff 要素禀赋/Acemoglu-Robinson 攫取型制度。当前 discriminant_validity/nontriviality 把④与
      ①②③并列为"载重新意"却未披露其非原创。宜比照已对 Olson/Tilly 的诚实前置,注明④是既有论题,把推论真实
      delta 诚实收窄到"①事前结构测固定性 + ②单调 + ③可逆"的联合框架(核心与④均非卖点)。
    - |
      [should] 旗舰锚(加勒比 vs 墨西哥中部 encomienda)诚实降级为"近自然实验、固定性受内生污染":存量枯竭会
      【内生降低】固定性(矿竭+泰诺崩溃后 encomendero 弃岛奔大陆,depletability↔mobility 正相关),故加勒比一侧
      固定性并非外生恒定。"固定性近似不变、只变可再生性"是过强隔离主张,须加此 caveat(机制不塌,靠刚果/普图马约/
      美南同族旁证仍立)。
    - |
      [should] 钉死混合税基"按主导价值来源标注"的定档判据:主导价值来源须由【事前价值/要素份额(结构)】判定,
      明文禁由"哪种要素最终被毁/被榨尽"回填(否则共驱动量在混合案——农业+矿脉,如安第斯/波托西——漏出与
      anti_talisman_clause 同型的事后开脱缝)。与 (4)horizon 的"确定函数"同构处理。
    - |
      [should] 界定 extraction_mode 的【射程与计量单位】:显式声明本推论只管【资源榨取优化】下的抽取形态;由
      政治/意识形态动机(非资源优化)对可再生基的毁灭性榨取(大饥荒/大跃进类)或【出射程】或仅由"供秩序在场"
      条款处理;并讲清"取一段时期主导形态"的时空计量单位,免局部区域-年被误读为 (iii)/(a) 命中、或被读作静默回避。
