id: ADV-REVIEW-057
type: adversarial_review
target: DED-052
layer: L3-deductions
date: 2026-07-16

人话摘要: |
  对 DED-052(MPC收入梯度作为财富Gini的消费掩码器)的 round_1 独立对抗审查。
  裁 needs_revision:核心焊接(BR-L2-013不公平厌恶由可观察不平等触发×BR-L2-029 MPC收入梯度)
  产生了真实的非平凡增量——"MPC梯度将财富Gini压缩映射为更平滑的消费Gini,系统性降低触发
  不公平感知的可见信号密度"这个归因不在任何承重砖中,且与Veblen炫耀性消费(主动发信号)
  和标准不平等文献(直接用财富Gini回归幸福感)有清晰的判别边界。未重蹈 DED-004/DED-007。
  反例猎捕无净杀(南非/印度被空间隔离消化,政治话语通道被部分消化但揭出excluded_outcomes
  范畴过度伸张)。无 required 级致命缺陷,但 6 条 should 级操作化缺口挡住 verified:
  (1)不公平感知度量'均值或占比'的OR未预注册决胜规则;(2)消费可见度三档在nontriviality_test
  缩为两档未说明;(3)预测(a)-(d)的统计决策规则未注册;(4)政治话语通道未正确纳入
  excluded_outcomes;(5)primary_suspect的证伪路径与(b)检验的映射不精确;(6)MPC梯度跨国
  估计可行性未给出最低可接受样本量。

target: DED-052
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。
  评分卡红旗 13 条逐项攻+反例猎捕(必做)+DED-004(不可证伪循环)/DED-007(测量轴焊死)
  复发检查。裁决三态照评分卡:verified 需同时满足(1)无 required 缺陷(2)亲自猎捕无 scope 内
  活反例(3)未重蹈 DED-004/007。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新上下文, 与作者无关)"
  verdict: needs_revision
  verdict_note: |
    本推论的核心焊接——BR-L2-013(不公平厌恶由可观察的不平等触发,灵长类/儿童发展/
    最后通牒博弈三类范式支撑,IEA=1.9,verified)与 BR-L2-029(MPC随收入/流动性递减,
    weakly_verified)的合取——产出了任一块砖单独不包含的非平凡增量:"MPC梯度的陡度
    是财富不平等可见性的结构性调节器,压缩消费Gini→降低不公平感知触发信号密度"。
    BR-L2-013只确立"可观察不平等触发不公平感"这一通道,完全不涉及MPC梯度或财富-
    消费Gini楔子;BR-L2-029只确立"穷人MPC高于富人"这一行为规律,完全不涉及公平感知
    或社会判断的任何维度。两砖首尾相接后产出的"MPC梯度→财富不平等可见性压缩→
    不公平感知降低"这个因果链是真正的组合增量,不是对父砖的重述或窄化。

    discriminant_validity 对三个相邻理论的区分是精准的:(1)vs标准不平等-幸福感文献
    (Alesina/Di Tella)——标准文献不区分财富Gini与消费Gini、不纳入MPC梯度作为楔子
    调节器,本推论的独有预测"两个财富Gini相同的国家,MPC梯度更陡的不公平感知更低"
    是财富Gini本身给不出的微分预测;(2)vs Veblen炫耀性消费——Veblen讲富人主动炫富
    (信号发送端),本推论讲富人被动少消费使差距不可见(信号接收端),两理论预测方向
    相反,可联合检验;(3)vs虚假意识/意识形态霸权——本推论不需"民众被洗脑"的强假设,
    掩码是结构性的(信号客观上弱),不是认知性的(人算不准)。

    DED-004(不可证伪循环)与 DED-007(测量轴焊死)均未复发。anti-talisman四条禁令覆盖了
    最常见的逆向推断逃逸路径——禁令(1)'禁止由不公平感知低反推MPC梯度陡'直接封堵了
    DED-004式循环,禁令(2)-(4)分别保护了信贷外生性/可见度编码/消解路径的事前锁定。
    MPC梯度(家庭收支调查准实验)、财富/消费Gini(独立调查)、不公平感知(跨国态度调查)
    三者是完全异源的测量通道,不存在自变量偷用因变量测量的问题。

    反例猎捕无净杀。四条路线:(1)南非/印度——高财富Gini×高可见度(种族/种姓空间隔离)
    ×高不公平感知,被'极端不平等下剩余差距仍超触发阈值'的事前消化路径覆盖,但此消化
    路径的'超阈值'阈值未定义(见should-5);(2)政治话语作为替代感知通道——法国/拉美的
    阶级政治动员使财富不平等通过媒体而非消费观察进入公众感知,被作者归入excluded_outcomes
    的'财富信息高度透明'边界,但政治话语≠制度透明,此范畴伸张需要修正(见should-4);
    (3)2008年美国次贷前信贷扩张期的公平感知时序——预测(d)的可检验窗口,目前缺乏
    精确时序匹配的公开研究,方向一致但尚未构成净杀;(4)中国P2P爆雷后信贷收缩期的
    公平感知反弹——同理,是预测(d)的检验窗口而非反例。

    虽有上述猎捕路线,无一条构成scope内的净杀反例——每条路线均被事前注册的消化机制
    或已标注的边界条件覆盖,或属于'尚未检验'而非'已证伪'。

    然而,以下 should 级操作化缺口挡住 verified——它们不使推论不可证伪或成立,但使推论
    在经验检验中留有可被事后填补的模糊空间,不符合'battle-ready'的 verified 标准:

  red_flags:
    - id: RF-1
      name: "brick=conclusion"
      result: "未命中"
      detail: |
        DED-052 的核心断言"MPC收入梯度是财富不平等可见性的结构性掩码器"未在
        BR-L2-013或BR-L2-029中出现原文或近义。BR-L2-013讨论公平感知的触发条件
        (可观察不平等),不涉及MPC梯度或财富-消费Gini楔子。BR-L2-029讨论MPC的
        收入梯度,不涉及公平感知的任何维度。两父砖均为通用行为命题(BR-L2-013来自
        灵长类实验+儿童发展实验+最后通牒博弈,BR-L2-029来自消费函数估计),非为
        本推论窄化的专用砖。非平凡内核定位在两砖的接口处——'MPC梯度决定财富→消费
        的压缩比,BR-L2-013决定消费→公平感知的信号通道'——是组合增量,非单砖重述。
        推论文件内的brick=conclusion自查诚实,无粉饰。
    - id: RF-2
      name: "逐格判空"
      result: "未命中"
      detail: |
        2×2判据表(MPC梯度陡峭度×消费信号可见度)的四个格子均为真经验主张而非同义反复:
        格(陡,高可见)——预测不公平感知对财富Gini弹性最小,掩码效应最强。若实际数据中
        此格的不公平感知仍紧密跟踪财富Gini,该格即被填上、掩码机制被证伪——这是可被
        现实反例填空的真预测,非定义性为真。
        格(陡,低可见)/格(平,高可见)/格(平,低可见)各自有方向性预测,且预测梯度
        (陡高<陡低<平高<平低)可被序数检验。无一格是'MPC梯度存在→消费Gini低于财富Gini'
        这样的会计恒等式——会计恒等式说'富人储蓄多所以消费差距比财富差距小'(由MPC定义
        平凡给出),但推论进一步声称'这个恒等式通过公平感知的信号通道影响社会主观体验'——
        后者不在MPC定义中,也不在BR-L2-013中,是真实的经验跳跃。
    - id: RF-3
      name: "测量轴正交 (DED-007 死因)"
      result: "未命中"
      detail: |
        自变量与被预测量来自完全异源的测量通道:
        - MPC梯度:家庭收支调查的准实验变异(外生收入冲击→消费反应,按收入分位分组)
        - 财富Gini/消费Gini楔子:资产负债表调查(财富)+家庭消费支出调查(消费),
          两套Gini从各自独立调查计算,推论文件明确要求不得从同一调查同时取两套Gini
        - 消费可见度:按Heffetz 2011/Charles et al. 2009文献排名事前编码
        - 不公平感知(被预测量):ISSP/WVS/ESS跨国态度调查,与上述任何经济统计调查
          在测量工具/样本框/调查机构上均独立
        不存在自变量偷用因变量测量的焊点。推论文件在operationalization中诚实披露了
        财富Gini各数据源(WID/OECD/CS)之间的部分输入共享(独立系数≤0.3),以及财富-
        消费数据源之间的测量链分叉点(独立系数约0.6-0.8)——这一诚实标注符合红旗12/13
        的精神。
    - id: RF-4
      name: "射程/排除钩子独立于结果 (DED-005)"
      result: "未命中"
      detail: |
        四项 excluded_outcomes 的判别标准均为事前可测的客观指标:
        (1)财富信息高度透明:个人税务记录/资产登记是否法律上公开可查(de jure透明度,
        非de facto感知)——可事前编码;
        (2)极端通货膨胀:年通胀率>100%或货币改革——客观宏观经济指标;
        (3)战争/革命/政权更迭:UCDP/PRIO武装冲突数据库的事前编码——标准政治暴力分类;
        (4)非货币化社会:货币交易占GDP比——可量化的经济结构指标。
        无一排除标准依赖事后公平感知数据。四项标准在见任何一国的公平感知数据前均可锁死。
        注意:第(1)项'财富信息高度透明'在法国counterexample的消化中被作者伸张至包含
        '政治话语/阶级框架'——此范畴伸张在RF-10中单独处理。
    - id: RF-5
      name: "分类判据档位匹配 (DED-006)"
      result: "未命中"
      detail: |
        nontriviality_test使用2×2(MPC梯度陡/平 × 消费可见度高/低),而operationalization
        中将消费可见度定义为三档(高/中/低)并将MPC梯度定义为连续量(顶层20%MPC与底层20%
        MPC之差)。2×2是nontriviality_test的概念简化,不是operationalization的正式编码方案。
        连续量被二分(陡/平)在实证中需要注册分割点,但推论的核心预测(b)本就是连续形式
        ('楔子越大→弹性越小'),不依赖二分——nontriviality_test的2×2仅用于论证非平凡性,
        而非用于经验检验。消费可见度从三档缩为两档时'中可见'品类的归属未说明——这是
        文档不一致(见should-6),但不构成分类档位与被救对象的结构性错配。
    - id: RF-6
      name: "anti-talisman 真兑现"
      result: "未命中"
      detail: |
        anti-talisman_clause四条禁令均为可操作的、事前锁定的约束:
        (1)MPC梯度只从家庭收支调查的准实验变异估计,不得从事后公平感知数据回头校准;
        (2)信贷扩张的外生性只认监管/政策文本的事前编码,不得因事后公平感知数据不符合
        预期而追加排除;
        (3)消费可见度排名按事前锁死的分类编码(Heffetz/Charles文献),不得因各国结果方向
        不一致而调整;
        (4)不利证据不得用'该国民众通过其他渠道感知到了财富不平等'来消解——需写入
        射程限制而非事后自保。
        四条禁令各自独立可验证,且对应了最常见的四种逆向推断逃逸路径。削弱条件
        (weakening conditions)明确列出,使'部分证伪'和'完全证伪'之间的灰色地带有了
        事前编码的裁判规则——尽管削弱后的推论状态(退化为弱相关性还是直接rejected)
        未明确定义,这是一个次要的清晰度问题。
        驱动量的独立测量:MPC梯度(准实验收入冲击消费反应)和消费可见度(事前文献编码)
        均独立于公平感知结果,非'嘴上说独立实则由结果反推'。
    - id: RF-7
      name: "现实锚事实核查 (DED-007 死因)"
      result: "未命中"
      detail: |
        逐一核查三个支持锚的事实准确性:
        锚1(美国):财富Gini~0.85(Saez-Zucman/WID估计区间内),消费Gini~0.35-0.40
        (CEX/PSID估计区间内),前者确实显著高于后者。MPC梯度的美国证据——退税/
        刺激支票的消费反应按收入分组——在Johnson-Parker-Souleles(2006)和Parker et al.
        (2013)中有干净识别。ISSP/GSS的公平感知趋势未等比例攀升的声称属方向性判断,
        作者诚实标注了党派认同/媒体框架的强力混淆。该锚承重方向一致性而非单因归因,
        confidence=moderate,诚实。
        锚2(中国):财富Gini~0.7+(Piketty-Yang-China估计/WID),消费Gini上升幅度较小
        (CHFS/国家统计局),数字消费信贷2014-2020爆发(花呗/白条/微粒贷)——以上均为
        可查证的宏观经济事实。CGSS公平感知在信贷扩张期未随财富Gini同步恶化的声称
        属方向性判断,作者诚实标注confidence=weak且缺乏精确时序匹配公开研究。无事实错。
        锚3(灵长类实验):Brosnan & de Waal 2003的卷尾猴实验描述(黄瓜vs葡萄,拒绝交换,
        控制条件消失)准确。该实验在BR-L2-013中已被三重独立验证(IEA=1.9),稳固。
        反例(法国/拉美)和边界案例(北欧/日本)的讨论诚实,消化路径均为事前注册的可测
        条件,非事后开脱。无发现事实错误或系统性证据扭曲。
    - id: RF-8
      name: "条件是下定义还是做预测"
      result: "未命中"
      detail: |
        核心断言'MPC梯度压缩消费Gini→降低不公平感知触发信号密度'是因果主张而非定义。
        四个可证伪预测(a)-(d)各自独立可毙:
        (a)若控制消费Gini后财富Gini仍有独立显著效应且效应量不衰减→掩码机制必要条件
        被削弱——这是可检验的经验主张,不是'不公平感知由消费驱动'的同义反复;
        (b)若楔子大小不调节不公平感知对财富Gini的弹性→掩码机制核心被证伪——这是
        交互效应预测,不是定义;
        (c)若高可见与低可见品类的消费不平等→不公平感知弹性无差异→可见性通道被证伪——
        这是差异化预测,不是'消费品有不同可见度'的分类重述;
        (d)若信贷扩张前后不公平感知无变化,或收缩期无超调反弹→信贷掩码动态被证伪——
        这是时序预测,不是'信贷让穷人消费更多'的会计陈述。
        每个预测均有明确的证伪条件(方向相反或无差异),不存在'无论发生什么都算验证'的
        恒真结构。
    - id: RF-9
      name: "枚举穷尽 + species 按判据定义 (DED-008)"
      result: "未命中(不适用)"
      detail: |
        DED-052未声称可枚举的分类体系。推论的consumption_visibility虽有三档(高/中/低),
        但这是连续可见度谱系的实用分档,非声称'消费品类只有且仅有这三类'的穷举分类学。
        三档按Heffetz/Charles文献的可见度排名定义,大致符合'按伞级判据(社会互动中的
        可观察程度)定义'的要求。不存在'声称N类可枚举但未穷举'的DED-008模式缺陷。
        主动猎第4类(如'社交媒体中介的可见度'——消费在朋友圈/Instagram展示但不在
        物理空间可见)的结果:此类可被三档体系吸收(社交媒体可见的品类合并入'高可见'
        或'中可见'取决于品类本体),不构成独立的第4类。故无DED-008漏洞。
    - id: RF-10
      name: "primary_suspect 指对 + 平凡化检查"
      result: "轻微命中(should)"
      detail: |
        primary_suspect指向'民众的不公平感知主要来自媒体/政治话语/公开统计数据的二阶信息,
        而非日常消费观察'——这确是本推论最致命的竞争解释。若此竞争解释为真,消费Gini与
        财富Gini之间的楔子就与公平感知无关,掩码机制核心被证伪。
        但primary_suspect的证伪路径存在不精确映射:作者称'检验路径:若(b)被证伪(楔子大小
        不调节不公平感知弹性),(a)仍可存活但掩码机制退化为弱相关性声明'。然而(b)被证伪
        并不等价于'媒体/政治话语是主驱动'——(b)被证伪可能仅因MPC梯度跨国测不准
        (secondary_suspect自己承认的风险),而非因媒体替代了消费观察。primary_suspect声称
        的竞争解释(媒体驱动)与提供的检验((b)调节效应)之间存在逻辑缝隙——需要一个更直接
        的检验(如:媒体中财富不平等报道频率×不公平感知的相关性 vs 消费Gini×不公平感知
        的相关性),或至少承认(b)的失败有多重解读。
        平凡化检查:推论的非平凡内核('MPC梯度是可观察不平等的结构性调节器')在上位泛化后
        不会退化为'信息不对称影响感知'这类相邻理论常识。'富人储蓄多所以消费差距比财富
        差距小'是会计恒等式(平凡),但'这个会计恒等式通过公平感知的信号通道系统性影响
        社会主观体验'不平凡——后者是因果归因,需要数据,可以被证伪。primary_suspect自己
        给出的塌缩路径('若(b)被证伪→退化为弱相关性声明')也确认了非平凡性——平凡命题
        是不会塌缩的。
        该条命中为should:primary_suspect与其证伪检验之间的映射需要更精确,或补充对'媒体/
        政治话语'竞争解释的直接检验设计。
    - id: RF-11
      name: "口径完整注册 + 歧义反向裁决 (L4-009 判例)"
      result: "命中(should)"
      detail: |
        以下口径缺口不使推论不可证伪,但留有事后填补的模糊空间,需在verified前收紧:
        (a)不公平感知的度量注册为'国家均值或认为不公平的人群占比'——这个OR未配备
        决胜规则。若均值显示预测效应而占比不显示(或反之),哪个算验证?L4-009判例要求
        预注册口径在见数据前锁死——此处'或'应替换为单一主度量+备用量做稳健性检查,
        且主度量在见任何国别公平感知数据前选定。
        (b)消费可见度三档的边界判据未完全操作化。operationalization列举了每档的示例品类
        (高可见:住房/汽车/服装/珠宝/餐饮外食;中可见:电子设备/家具/旅游;低可见:保险/
        养老金/金融服务/水电公用/食品杂货在家消费),但判据是'在社会互动中被他人观察到
        的程度'——这是一个连续谱,分档切割点的精确定义缺失。例如'家具'被归入中可见,
        但高端家具(如客厅的真皮沙发)与廉价家具(如卧室里不示人的简易床架)的可见度
        差异可能大于家具与服装的品类间差异。Heffetz/Charles文献提供的是品类级平均排名,
        不解决品类内变异。此缺口为should:不影响方向性预测(品类间平均可见度差异真实存在),
        但使品类Gini的计算口径不够锋利。
        (c)预测(a)-(d)的统计决策规则未注册。预测(a)称'消费Gini应是不公平感知的更显著
        预测变量'——'更显著'的裁決规则是什么?回归系数更大?t值更高?增量R²更大?
        若消费Gini系数更大但标准误也更大(不显著),算验证还是证伪?预测(d)称不公平感知
        '应反弹且超过扩张前基线'——超出多少算'超过'(任何正超调?统计显著?若干标准差?)。
        这些未注册的决策规则在边界案例中会成为事后争辩的战场。但同时,方向性预测本身
        (若方向反了就直接证伪)提供了基本可证伪性,故口径缺口为should而非required。
        (d)信贷扩张的事前编码标准:'监管政策文本'的选取范围(哪些监管机构?中央/地方?
        正式法律还是指导意见?)、'外生'的操作化标准(供给侧vs需求侧如何区分?)未明确。
        作者规定'禁止以信贷余额增长率充当扩张度量(内生于需求)'是正确的方向,但正面的
        编码协议(政策文本→扩张事件的映射规则)需要更具体的操作手册。
        (e)MPC梯度的跨国估计可行性:推论的核心检验(b)依赖MPC梯度的跨国可比估计,
        但MPC梯度需要干净的准实验收入冲击——这在多数国家不存在。secondary_suspect诚实
        承认此风险。若可用的MPC梯度估计国家数<15,跨国回归的统计效力不足,(b)在实践上
        可能不可检验——这不影响推论在逻辑上的可证伪性,但影响其在可预见的未来的实际
        可检验性。应注册最低可接受样本量(如N≥20国)和MPC估计的最低质量门槛。
        以上五条均为should:不修不使推论不可证伪或逻辑上不成立,但修后大幅提升经验检验
        的锋利度和防事后口径选择能力。
    - id: RF-12
      name: "数据源同根冒充多源独立"
      result: "未命中"
      detail: |
        推论在operationalization的wealth_consumption_gini_wedge节中诚实标注了数据源
        独立性问题:'WID.world(基于税收记录+国民账户)、OECD Wealth Distribution Database
        (基于各国统计局上报)、Credit Suisse Global Wealth Report(基于资产负债表外推)。
        三者底层测量链共享部分税收/国民账户输入,独立系数≤0.3'。同时标注了财富-消费
        Gini之间的测量链分叉点(独立系数约0.6-0.8)。文件明确警告'不要将WID+OECD+CS
        三源一致当作三重独立验证'。这是红旗12的教科书式合规——诚实标注了同根数据源的
        折扣系数。未发现将同根数据源包装为独立多源验证的违规。
    - id: RF-13
      name: "API 可及性冒充认识论独立性"
      result: "未命中(不适用)"
      detail: |
        推论不涉及通过API/MCP查询数据源来建立多源验证的声称。operationalization中的
        数据源讨论(WID/OECD/CS/HIES/HBS)聚焦于测量链的实质独立性(税收记录vs资产负债表
        vs家庭调查),而非API可及性。不涉及'能查到=独立'的API认识论混淆。此条不适用。

  counterexample_hunt:
    summary: |
      主动构造四条反例路线,逐一猎捕:
    routes:
      - id: CE-1
        description: |
          南非/印度——高财富Gini×高可见度(种族隔离的空间可见性/种姓的日常可见标记)
          ×高不公平感知。MPC梯度在这些国家应为陡峭(贫富分化严重),按推论预测消费Gini
          应被压缩、不公平感知应被部分掩码。但实际不公平感知极高(南非的种族不平等感知、
          印度种姓不平等感知均为全球最高水平)。
        result: "被消化——非净杀"
        digestion: |
          推论的消化路径(在拉美counterexample中已注册):'极端不平等下,即使消费Gini
          被压缩,剩余差距仍远超触发阈值'。南非和印度均属极端不平等(南非财富Gini全球
          最高之一,印度种姓+阶级双重分层),MPC梯度压缩不足以将消费Gini压至触发阈值以下。
          更重要的是,这两个社会的可见不平等不仅来自消费——种族/种姓本身即是高可见度的
          社会标记,独立于消费水平。肤色或姓氏在社交互动中即时可见,属于推论未建模的
          额外可见度来源。消化路径成立,但暴露了推论的一个隐含假设:消费是可见不平等的主导
          载体——在种族/种姓分层社会中,此假设被削弱。
      - id: CE-2
        description: |
          政治话语作为替代感知通道——一国若有强大的左翼政党/工会/社会运动持续将财富
          不平等统计数字推入公共话语(如'1% vs 99%'框架),民众即使不通过消费观察也能
          感知财富不平等。法国(ISSP/WVS中不公平感知远高于财富Gini预测)和拉美(阶级
          政治动员传统)是候选案例。
        result: "被部分消化——揭出 excluded_outcomes 范畴伸张"
        digestion: |
          作者将法国归入excluded_outcomes的'财富信息高度透明'边界:'高税率+公共辩论传统+
          工会/左翼政党的阶级话语框架,使财富不平等即使不通过消费信号也能进入公众感知'。
          但'政治话语/阶级框架'≠'财富信息制度透明'(个人税务记录公开可查)。前者是
          政治传播现象,后者是制度设计。将此二类合并为同一排除标准是范畴伸张——政治话语
          能使任何社会中的财富不平等在感知上'透明',与税务记录是否公开无关。若接受此伸张,
          任何高不公平感知的国家都可被事后归因为'政治话语使财富信息透明',排除标准失去
          事前可编码性。见should-4:应拆分'制度透明'和'政治话语通道'为两个独立排除标准,
          各自配备事前编码判据。
      - id: CE-3
        description: |
          2008年美国次贷危机前信贷扩张期的公平感知趋势——预测(d)声称信贷扩张期间
          不公平感知应下降。2001-2006年美国经历大规模次贷/信用卡/HELOC扩张,低收入
          家庭获得前所未有的消费信贷可及性。按推论,此期间不公平感知应被进一步掩码、
          处于低位。
        result: "未构成净杀——缺乏精确时序匹配数据"
        digestion: |
          该时期美国ISSP/GSS的不公平感知数据确实未显示与财富Gini同步攀升,方向与推论
          一致。但2001-2006年也经历了9/11后的爱国团结期、伊拉克战争的政治极化——
          多因子混杂使此期间无法作为预测(d)的干净检验窗口。2008年危机后Occupy Wall
          Street(2011)的爆发与预测(d)的'延迟+加倍'方向一致,但同样受多因子混杂
          (危机本身的冲击、失业、救市争议)。这是一个尚未被干净检验的预测,不构成
          已证伪的反例。
      - id: CE-4
        description: |
          中国P2P爆雷(2018)后的信贷收缩期——预测(d)声称信贷收缩/债务危机期间
          不公平感知应反弹且超过扩张前基线。P2P爆雷+后续金融严监管构成了中国近年
          最大规模的消费信贷可得性外生收缩。
        result: "未构成净杀——窗口太短+被COVID混杂"
        digestion: |
          P2P爆雷(2018)→信贷收缩→2019年可能有公平感知数据窗口,但2020年初COVID-19
          爆发引入的扰动(清零政策、经济冲击、社会心态剧变)远超信贷收缩的独立效应,
          使2019-2022年的公平感知时序无法归因于单一信贷事件。这是数据窗口被外生冲击
          污染的问题,不是推论的逻辑缺陷。作者已诚实标注此锚confidence=weak且缺乏
          精确时序匹配公开研究。
    conclusion: |
      四条路线无一构成scope内的净杀反例。每条路线均被事前注册的消化机制或已标注的
      边界条件覆盖,或属于'尚未干净检验'而非'已证伪'。但CE-2(政治话语通道)暴露了
      excluded_outcomes的范畴伸张问题——'政治话语使不平等感知透明'不等于'税务记录
      公开的财富信息透明',此伸张若不加修正将侵蚀排除标准的事前可编码性。

  non_recurrence:
    ded_004:
      result: "未复发"
      detail: |
        DED-004的死因:用被预测量定义前件,形成'无论观测到什么都不会被证伪'的循环。
        DED-052的anti-talisman四条禁令直接封堵了此模式:禁令(1)MPC梯度只从准实验
        收入冲击估计,不从公平感知数据反推;禁令(2)信贷扩张外生性只认政策文本事前编码;
        禁令(3)消费可见度按文献事前锁死;禁令(4)不利证据不得用'其他渠道感知'消解。
        所有前件均独立于公平感知结果可测,不存在DED-004式的'结果是啥前件就是啥'的循环。
        此外,falsifiability的四条预测各自有明确的反向证伪条件——若数据反向(财富Gini在
        控制消费Gini后仍有独立效应、楔子不调节弹性、品类无差异、信贷时序无效应),
        推论在对应维度被直接证伪,不是'总能自我调整以消化任何数据'。
    ded_007:
      result: "未复发"
      detail: |
        DED-007的死因:自变量与被预测量共享同一测量轴(自变量分母用'实际获授者'偷用
        了结果信息)。DED-052的测量结构:自变量(MPC梯度/财富-消费Gini楔子/消费可见度/
        信贷扩张)全部来自经济统计调查或事前文献编码;被预测量(不公平感知)来自跨国
        态度调查。两套测量在数据收集机构、样本框、测量工具上均独立。MPC梯度依赖的
        家庭收支调查与不公平感知依赖的ISSP/WVS/ESS无共享底层数据源。消费可见度按
        文献排名编码,不涉及任何一国的公平感知数据。无DED-007式的测量轴焊死。

  required_fixes: []

  should_fixes:
    - id: SHOULD-1
      priority: high
      action: |
        不公平感知的度量决胜规则预注册。当前'国家均值或认为不公平的人群占比'的OR
        需替换为单一主度量+备用度量稳健性检查。建议:主度量选ISSP Social Inequality
        模块'income differences are too large'的国别均值(Likert 1-5),备用量=同题项的
        '同意/强同意'占比(≥4的受访者比例)。主度量在见任何国别数据前锁定。若跨国
        比较中某国仅有WVS/ESS数据,使用最对口的等价题项并做跨调查锚点校准(anchoring
        vignettes),不得在不同国家间混用不同度量口径。
    - id: SHOULD-2
      priority: high
      action: |
        消费可见度三档的边界判据操作化。当前以示例品类替代判据——注册每档的可见度
        得分区间(如Heffetz可见度排名0-33百分位=低,34-66=中,67-100=高),使品类归属
        由连续排名的分位决定而非举例。品类内变异问题(高端家具vs简易家具)通过'品类
        平均可见度'的诚实标注缓解——承认品类内变异是未建模噪声源,在稳健性检查中
        使用品类×价格交互项做补充。三档编码协议在见任何国别公平感知数据前锁死。
    - id: SHOULD-3
      priority: high
      action: |
        预测(a)-(d)的统计决策规则注册。至少注册:(a)'更显著预测变量'的操作化——
        建议主检验为消费Gini与财富Gini的回归系数之差的正负号+Delta-R²比较,方向
        预测为消费Gini系数>财富Gini系数且消费Gini的增量R²>财富Gini的增量R²;
        (b)'弹性应越小'的操作化——财富Gini×楔子交互项的系数符号为负;
        (d)'超过扩张前基线'的操作化——点估计超调+单侧95%CI下界>0。方向错误=
        直接证伪;方向正确但未达统计显著=推论未被支持但亦未被推翻(弱证据而非反证据)。
    - id: SHOULD-4
      priority: high
      action: |
        拆分 excluded_outcomes 第(1)项。'财富信息制度透明'(税务记录/资产登记法律上
        公开可查)与'政治话语通道'(阶级政治动员/工会/社会运动使财富不平等进入公共
        话语)属不同机制,不应混为同一排除标准。建议拆为:
        (1a)财富信息制度透明——税务记录/资产登记公开可查,按法律条文事前编码;
        (1b)高强度财富不平等政治动员——媒体中财富不平等议题的报道频率/社交媒体
        讨论量超过阈值,按媒体内容分析事前编码(阈值在见公平感知数据前锁死)。
        法国应从(1a)移至(1b)或同时标(1a)(1b)的真实状态——法国税务记录非公开,
        被归入(1a)属误分类。
    - id: SHOULD-5
      priority: medium
      action: |
        primary_suspect的证伪路径精确化。当前从'媒体/政治话语驱动感知'到'(b)被证伪'
        的映射跳了一步。建议补充:若数据允许,增加直接检验——媒体中财富不平等报道的
        频率/强度是否调节(削弱)消费Gini→不公平感知的关系?若媒体高覆盖国家中消费Gini
        的预测力系统性弱于媒体低覆盖国家,则直接支持primary_suspect的竞争解释;若调节
        不显著,则primary_suspect被削弱。同时,在primary_suspect中诚实承认:(b)的失败
        可源于MPC梯度测不准(secondary_suspect)而非媒体驱动——两竞争解释的鉴别需要
        额外数据。
    - id: SHOULD-6
      priority: medium
      action: |
        统一 consumption_visibility 在 operationalization(三档:高/中/低)与 nontriviality_test
        (两档:高/低)中的档数,或说明为何在nontriviality_test中合并中可见与低可见
        (或与高可见)。建议nontriviality_test保留三档或扩展为3×2六格,使分类体系在
        全文件中一致。若为简洁保留2×2,需明确声明'中可见'品类的归属规则(建议归入
        低可见以取保守——若中可见品类也显示掩码效应,那是推论赚到的而非借口径便宜
        得到的)。
    - id: SHOULD-7
      priority: low
      action: |
        MPC梯度跨国估计的最低可接受标准注册。包括:最低国家数(建议N≥20)、MPC估计的
        最低质量门槛(必须是利用外生收入冲击的准实验估计,不得用OLS的APC代替)、
        估计窗口的一致性(统一使用暂时性意外冲击口径)。若可用的干净MPC估计国家数
        不足,在推论中诚实标注'预测(b)在当前数据条件下不可检验,需等待更多国家的
        MPC准实验估计积累'。
    - id: SHOULD-8
      priority: low
      action: |
        anti-talisman中'削弱条件'被触发后的推论状态路由。当前只说了'必要条件被削弱'
        '核心被削弱',未说削弱后推论的整体status如何变更(退化为弱相关性声明?降级为
        candidate?直接rejected?)。建议注册路由规则:单一削弱条件触发→status降为
        verified*(带悬案);两个及以上削弱条件触发→rejected;全部三个削弱条件触发+
        方向相反→rejected且记录为'已证伪'。这使灰色地带的裁决也有了事前规则。

  review_date: 2026-07-16

round_2:
  reviewer: "独立对抗审查者 (round 2, 全新上下文, 与作者及前轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    本轮独立审查确认 round_1 的核心判断正确:DED-052 的核心焊接(BR-L2-013×BR-L2-029)
    产生了真实的非平凡增量——"MPC梯度将财富Gini压缩映射为更平滑的消费Gini,系统性降低
    触发不公平感知的可见信号密度"。两父砖各自沉默于此归因,判别效度对三个相邻理论
    (标准不平等文献/Veblen炫耀消费/虚假意识)的区分精准。DED-004/DED-007 未复发。

    与 round_1 的关键差异:
    (1) 将 round_1 的 SHOULD-4(排除标准范畴混同)升级为 required——"政治话语通道"≠"制度透明",
    若允许政治话语事后排除任何高不公平感知的反例,推论失去可证伪性。
    (2) 新增发现:BR-L2-013 只证明了"可见不平等能触发不公平感"(猴子实验),未证明
    "可见消费是现代社会感知财富不平等的主导通道"。DED 将此作为隐含前提,虽 testable 但
    需诚实标注为推论自身的经验赌注而非父砖的直接担保。
    (3) 新增发现:信贷掩码机制默认信贷扩张优先惠及穷人消费、压缩消费Gini——但富人也可
    通过资产抵押借贷用于可见消费(portfolio loan买游艇),此时信贷扩张可能放大而非压缩
    可见消费不平等。DED 未建模此不对称。
    (4) round_1 的 8 条 should fixes 均未消解(DED 文件 review_summary 仍只记录 r0),
    其中 SHOULD-1(度量OR未预注册)和 SHOULD-3(统计决策规则)在 L4-009 判例光下逼近
    required——但不升级,因方向性预测提供基本可证伪性。

    综上:推论有真实学术贡献,但操作化缺口挡住 verified。本轮新增 1 条 required + 重申
    round_1 的 should fixes。

  red_flags:
    - id: RF-1
      name: "brick=conclusion"
      result: "未命中"
      detail: |
        独立确认 round_1 的判断。核心断言"MPC收入梯度是财富不平等可见性的结构性掩码器"
        在 BR-L2-013(不公平厌恶,灵长类/儿童/最后通牒)和 BR-L2-029(MPC收入梯度)中
        均不出现原文或近义。两砖为通用行为命题,非为本推论窄化。非平凡增量定位于两砖接口:
        MPC梯度决定财富→消费压缩比,BR-L2-013决定消费→公平感知信号通道,首尾相接产出
        "MPC梯度是可观察不平等的结构性调节器"——不在任何单砖里。自查诚实。
        附加审查:BR-L2-013 的 statement 为"人类对不公平的结果分配持续表现出负面反应",
        未特化到"可见消费"通道。DED 从猴子实验的可见奖励推断到现代社会的消费可见度,
        这是推论自身的经验赌注(且 testable),不是对父砖的重述。此推断的强度需在推论中
        诚实标注(见本轮 RF-10 补充),但不构成 brick=conclusion。
    - id: RF-2
      name: "逐格判空"
      result: "未命中"
      detail: |
        独立确认 round_1 的判断。2×2 四格均为可被现实反例填空的真经验主张:
        格(陡,高可见)→预测不公平感知弹性最小。若实际数据中此格仍紧密跟踪财富Gini,
        该格即被填上——这是可证伪的预测,不是"MPC存在→消费Gini低"的会计恒等式。
        格(平,高可见)→预测弹性较大。格(陡,低可见)→预测中间态。格(平,低可见)→对照格。
        四个格子的序数预测(陡高<陡低<平高<平低)可被序数检验,非定义性为真。
        "富人储蓄多→消费差距<财富差距"是MPC定义的会计恒等式(平凡);"此压缩通过公平
        感知信号通道影响社会主观体验"不平凡——后者是因果归因,可被证伪。
    - id: RF-3
      name: "测量轴正交 (DED-007 死因)"
      result: "未命中"
      detail: |
        独立确认 round_1 的判断。自变量与被预测量来自异源测量通道:
        MPC梯度→家庭收支调查准实验(外生收入冲击×消费反应);财富/消费Gini楔子→资产负债
        表调查+消费支出调查(两套独立调查,文件明确禁止同调查取两套Gini);消费可见度→
        Heffetz/Charles文献事前编码;不公平感知→ISSP/WVS/ESS跨国态度调查。四者在测量
        工具/样本框/调查机构上均独立。无自变量偷用因变量测量的焊点。
        附加审查:MPC梯度的"陡峭度"操作化(顶层20%MPC-底层20%MPC)不依赖任何一国的
        公平感知数据;财富-消费Gini楔子的计算也不依赖公平感知数据。测量轴独立性稳固。
    - id: RF-4
      name: "射程/排除钩子独立于结果 (DED-005)"
      result: "轻度命中(should→required,见本轮 REQ-1)"
      detail: |
        四项排除标准的判别指标均为事前可测的客观指标:
        (1)制度透明:税务记录/资产登记法律上公开可查(de jure);
        (2)极端通胀:年通胀率>100%或货币改革;
        (3)战争/革命:UCDP/PRIO武装冲突数据库;
        (4)非货币化:货币交易占GDP比。
        以上四项在见任何一国公平感知数据前均可锁死。

        但是:第(1)项"财富信息高度透明"在实际使用中被作者伸张至包含"政治话语通道"——
        法国counterexample的消化称"高税率+公共辩论传统+工会/左翼政党的阶级话语框架,
        使财富不平等即使不通过消费信号也能进入公众感知",并将其归入"财富信息高度透明"边界。
        "政治话语/阶级框架"≠"税务记录公开可查"。前者是政治传播现象(可在任何有言论自由
        的社会存在),后者是制度设计。将此二类合并使排除标准失去事前可编码性——任何高不公平
        感知的国家均可被事后归因为"政治话语使财富信息透明"。这是 genuine 的 falsifiability
        威胁(见本轮 REQ-1,从 round_1 SHOULD-4 升级为 required)。
    - id: RF-5
      name: "分类判据档位匹配 (DED-006)"
      result: "未命中(与round_1一致,附加说明)"
      detail: |
        独立确认 round_1 的判断。nontriviality_test 使用 2×2(陡/平×高/低),而
        operationalization 定义消费可见度为三档(高/中/低)且 MPC 梯度为连续量。此差异
        的解释(2×2为概念简化,核心预测(b)为连续形式不依赖二分)可接受,但三档缩两档时
        "中可见"品类的归属规则缺失——round_1 SHOULD-6 仍有效。
        附加说明:MPC梯度二分(陡/平)的分割点未在任何处注册。若核心预测(b)的连续形式
        (交互项)是主检验,二分仅用于 nontriviality_test 的概念论证,则问题不大;但若未来
        用二分做实际检验,分割点需在见数据前锁死(见本轮 SHOULD-3 扩展)。
    - id: RF-6
      name: "anti-talisman 真兑现"
      result: "未命中"
      detail: |
        独立确认 round_1 的判断。四条禁令各自独立可验证:
        (1)MPC梯度只从准实验收入冲击估计,禁反推;(2)信贷外生性只认政策文本事前编码;
        (3)可见度排名按文献事前锁死;(4)不利证据不得用"其他渠道感知"消解。
        每条禁令对应一种常见的逆向推断逃逸路径,且每条均有可操作的验证标准。
        削弱条件明确列出——触发后推论如何退化虽未路由(round_1 SHOULD-8),但不影响
        anti-talisman 本身的有效性。驱动量的独立测量(MPC梯度准实验+消费可见度文献编码)
        均独立于公平感知结果,非嘴上说独立实则由结果反推。
    - id: RF-7
      name: "现实锚事实核查 (DED-007 死因)"
      result: "未命中"
      detail: |
        独立重新核查三个支持锚+反例+边界案例,与 round_1 结论一致:

        锚1(美国):财富Gini~0.85(Saez-Zucman/WID区间),消费Gini~0.35-0.40(CEX/PSID),
        前者显著高于后者。MPC梯度的美国证据(退税/刺激支票×收入分组)在 JPS 2006/Parker
        2013 中有干净识别。ISSP/GSS公平感知未等比例攀升属方向性判断,作者诚实标注党派/
        媒体框架混淆。confidence=moderate,承重方向一致性,诚实。

        锚2(中国):财富Gini~0.7+(Piketty-Yang/WID),消费Gini上升幅度较小(CHFS/统计局),
        数字消费信贷2014-2020爆发(花呗/白条/微粒贷)。CGSS公平感知方向性声称经诚实
        标注 confidence=weak+缺精确时序匹配。新增审查关注点:中国住房同时充当首要财富形式
        和高可见消费信号——财富-消费的区分在此锚中可能坍塌(住房增值=财富↑且房价本身
        即为最可见的消费/投资信号),此点推论未建模。不构成事实错,但削弱此锚对掩码机制的
        支撑力(见本轮 counterexample_hunt CE-5)。

        锚3(灵长类实验):Brosnan & de Waal 2003 卷尾猴实验描述(黄瓜vs葡萄,拒绝交换)准确。
        BR-L2-013 已三重独立验证(IEA=1.9,verified)。但需诚实标注:DED 声称的控制条件
        "看不见同伴待遇→拒绝反应消失"在 BR-L2-013 原文中未见明确记载(在 DED-052
        derivation 步骤1中声称)——若此控制条件实际不成立,不影响主机制(可见奖励触发反应
        本身已确立),但 DED 不应将此控制条件当作已证事实引用(见本轮 SHOULD-9)。

        反例(法国/拉美)和边界(北欧/日本)讨论诚实,消化路径为事前注册的可测条件。
        无发现事实错误或系统性证据扭曲。
    - id: RF-8
      name: "条件是下定义还是做预测"
      result: "未命中"
      detail: |
        独立确认 round_1 的判断。核心断言是因果主张而非定义。四条预测(a)-(d)各自有
        明确证伪条件:
        (a)控制消费Gini后财富Gini仍有独立显著效应且不衰减→掩码必要条件削弱;
        (b)楔子不调节弹性→掩码核心证伪;
        (c)高/低可见品类→不公平感知弹性无差异→可见性通道证伪;
        (d)信贷扩张/收缩时序无效应或无超调反弹→信贷掩码动态证伪。
        每个预测的方向相反或无差异即为证伪,不存在"无论发生什么都算验证"的恒真结构。
        附加验证:预测(a)的适用区间声明("仅覆盖财富不平等主要通过消费信号被感知的社会")
        是 honest 的 scope 限制——若在税务记录公开社会(a)不成立,不是推论失败而是边界确认。
    - id: RF-9
      name: "枚举穷尽 + species 按判据定义 (DED-008)"
      result: "未命中(不适用)"
      detail: |
        独立确认 round_1 的判断。DED-052 未声称可枚举的分类体系。consumption_visibility
        三档(高/中/低)是连续可见度谱的实用分档,非声称"消费品类只有且仅有这三类"。
        三档按 Heffetz/Charles 文献的可见度排名定义,大致符合伞级判据(社会互动中的可观察
        程度)。主动猎第4类(社交媒体中介可见度——Instagram/朋友圈展示但不物理可见):
        此类可被三档体系吸收(取决于品类本体而非展示平台),不构成独立第4类。无 DED-008 漏洞。
    - id: RF-10
      name: "primary_suspect 指对 + 平凡化检查"
      result: "命中(should,在round_1基础上追加BR-L2-013 scope gap)"
      detail: |
        round_1 已指出 primary_suspect(媒体/政治话语驱动感知)与检验(b)楔子调节效应之间
        的映射不精确——(b)失败可因MPC测不准而非媒体替代。round_1 SHOULD-5 要求补充直接
        检验(媒体报道频率调节消费Gini→不公平感知的关系)。此判断维持。

        本轮新增:BR-L2-013 scope gap。BR-L2-013 的 statement 为"人类对不公平的结果分配
        持续表现出负面反应",其实验证据来自三类范式:(a)灵长类实验(可见奖励——葡萄vs黄瓜);
        (b)儿童发展实验(可见实物分配);(c)最后通牒博弈(抽象金钱数额)。其中(a)(b)涉及
        可见刺激,但(c)显示人类也可对抽象/数值化的不平等做出反应(不需要"看见"对方的消费)。
        DED 在 derivation 步骤1中写道"灵长类实验的核心发现:猴子只对'看得见的'不平等产生
        拒绝反应"——"只对"是强声称,BR-L2-013 原文未使用此限定词。

        这意味:DED 将 BR-L2-013 的"可观察不平等触发不公平感"(可见奖励场景的发现)推广到
        "可见消费是现代社会感知财富不平等的主导通道",中间有一个未在父砖中担保的跳跃——
        父砖只证明了可见性【能】触发,未证明可见性是现代社会的【主导】通道。DED 将此跳跃
        作为自身的经验赌注(通过预测(a)(c)可检验),这是合法的推论构造,但需诚实标注:
        此跳跃是推论对父砖的【伸展应用】而非父砖的直接逻辑担保。建议在 derivation 步骤1
        中诚实标注此伸展(见本轮 SHOULD-10)。

        平凡化检查:推论的非平凡内核在上位泛化后不退化为"信息不对称影响感知"等相邻常识。
        primary_suspect 自认的塌缩路径("(b)被证伪→退化为弱相关性声明")确认非平凡性。
    - id: RF-11
      name: "口径完整注册 + 歧义反向裁决 (L4-009 判例)"
      result: "命中(should,逼近required但暂不升级)"
      detail: |
        独立确认 round_1 的五项口径缺口均仍存在(DED 文件未修订):

        (a)不公平感知度量"国家均值或认为不公平的人群占比"的OR未配备决胜规则——若均值
        显示预测效应而占比不显示(或反之),哪个算验证?L4-009判例要求预注册口径。round_1
        SHOULD-1 要求锁定单一主度量+备用稳健性检查。此缺口在L4-009光下逼近required——
        因为事后口径选择的方向性可被作者利用(选那个"对的"口径救推论)。但不升级的理由:
        方向性预测(falsifiability的(a)-(d)各自方向相反即证伪)为两个度量提供了共同的方向
        约束——若效应方向在任一度量上反了,推论即被证伪,不存在"选口径救方向"的空间。
        "均值vs占比"的口径选择只影响效应大小/显著性,不影响方向。故保持should。

        (b)消费可见度三档的边界判据——以示例品类替代连续判据,round_1 SHOULD-2 要求
        注册可见度得分区间。维持should。

        (c)预测(a)-(d)的统计决策规则——"更显著""弹性应越小""应反弹且超过基线"的
        操作化缺失。round_1 SHOULD-3 要求注册系数比较/交互项符号/超调CI下界。维持should。
        新增:MPC梯度二分(陡/平)的分割点如需用于实际检验也需预注册(见RF-5附加说明)。

        (d)信贷扩张事前编码——"监管政策文本"的选取范围和"外生"的操作化标准缺失。
        维持 round_1 SHOULD-3 的覆盖。

        (e)MPC梯度跨国估计可行性——round_1 SHOULD-7 要求注册最低N≥20+质量门槛。
        维持should。

        底线:五条口径缺口均不使推论不可证伪(方向预测仍可毙推论),但为battle-ready的
        verified标准所不容。
    - id: RF-12
      name: "数据源同根冒充多源独立"
      result: "未命中"
      detail: |
        独立确认 round_1 的判断。DED 在 operationalization 中诚实标注了 WID/OECD/CS 三源
        的底层测量链共享(独立系数≤0.3)+财富-消费Gini测量链分叉(独立系数约0.6-0.8),
        明确警告"不要将WID+OECD+CS三源一致当作三重独立验证"。教科书式合规。未发现将
        同根数据源包装为独立多源验证的违规。
    - id: RF-13
      name: "API 可及性冒充认识论独立性"
      result: "未命中(不适用)"
      detail: |
        独立确认 round_1 的判断。推论不涉及通过API/MCP查询建立多源验证的声称。
        数据源讨论聚焦测量链实质独立性,非API可及性。此条不适用。

  counterexample_hunt:
    summary: |
      本轮独立执行五条反例猎捕路线(其中 CE-1~CE-4 与 round_1 重叠但独立重新评估,
      CE-5 为新增)。无净杀,但 CE-5 揭出中国住房锚的财富-消费区分坍塌问题。
    routes:
      - id: CE-1
        description: |
          南非/印度——高财富Gini×种族/种姓高可见社会标记×高不公平感知。MPC梯度应为
          陡峭(贫富分化严重),按推论消费Gini应被压缩→不公平感知应被部分掩码。但实际
          不公平感知极高。
        result: "被消化——非净杀(独立确认round_1判断)"
        digestion: |
          推论的消化路径(已在拉美counterexample中注册):"极端不平等下,即使消费Gini被
          压缩,剩余差距仍远超触发阈值"。南非/印度的种族/种姓社会标记独立于消费水平
          (肤色/姓氏在社交互动中即时可见),构成推论未建模的额外可见度来源。消化成立。
          但需注意:此消化依赖于"触发阈值"概念——该阈值未被定义(round_1 SHOULD-5提及),
          若阈值可在见反例后设定(设得足够低以使消化成立),则消化本身变成 talisman。
          见本轮 SHOULD-11:需预注册不公平感知触发阈值的操作化(或诚实承认此消化路径
          暂无阈值定义、标记为待定)。
      - id: CE-2
        description: |
          政治话语作为替代感知通道——法国(ISSP/WVS不公平感知远高于财富Gini预测)和
          拉美(阶级政治动员传统)的不公平感知由媒体/政治话语驱动而非消费观察。
        result: "被部分消化——揭出excluded_outcomes范畴伸张→本轮升级为required(REQ-1)"
        digestion: |
          独立确认 round_1 CE-2 的判断。"政治话语/阶级框架"≠"税务记录公开可查"。
          前者是政治传播现象,后者是制度设计。当前合并使任何有活跃左翼政治的社会均可
          被事后排除,排除标准失去事前可编码性。本轮将此升级为 required fix。
          附加:即使修复了范畴伸张,法国/拉美的政治话语通道本身也是一个 legitimate 的
          竞争解释——不是排除标准,而是与推论并列的替代假设。推论应将其注册为
          discriminant_validity 的第四对手(见本轮 SHOULD-12)。
      - id: CE-3
        description: |
          美国2001-2006次贷扩张期——预测(d)声称信贷扩张期间不公平感知应下降。此期间
          次贷/信用卡/HELOC大规模扩张,低收入家庭消费信贷可及性骤增。
        result: "未构成净杀——多因子混杂(独立确认round_1判断)"
        digestion: |
          该时期受9/11后爱国团结/伊拉克战争政治极化/布什减税争议等多因子强力混杂,
          无法作为预测(d)的干净检验窗口。2008后Occupy Wall Street(2011)方向与预测(d)
          的"延迟+加倍"一致,但同样多因子混杂。这是一个尚未被干净检验的预测,非已证伪
          的反例。但需注意:若2001-2006的ISSP/GSS数据实际显示不公平感知【上升】而非
          下降,即使不可干净归因,方向相反也将构成对(d)的压力。当前缺乏精确时序匹配数据,
          无法裁决。见本轮 SHOULD-7(MPC跨国估计可行性)的同类逻辑:不可检验≠已证伪,
          但不可检验确实限制推论的 empirical bite。
      - id: CE-4
        description: |
          中国P2P爆雷(2018)后信贷收缩期+COVID冲击——预测(d)声称信贷收缩/债务危机期间
          不公平感知应反弹且超过扩张前基线。
        result: "未构成净杀——窗口被COVID污染(独立确认round_1判断)"
        digestion: |
          P2P爆雷(2018)→信贷收缩→2019年可能有短暂数据窗口,但2020年初COVID-19引入的
          扰动(清零/经济冲击/社会心态剧变)远超信贷收缩的独立效应。非推论的逻辑缺陷,
          是数据窗口被外生冲击污染。作者已诚实标注 confidence=weak。
      - id: CE-5
        description: |
          【本轮新增】中国住房作为财富-消费区分坍塌案例。中国家庭财富高度集中于住房
          (估计>70%),而住房同时是:
          (a)首要财富形式——房价上涨直接推高财富Gini(一线vs三四线);
          (b)高可见消费/投资信号——住什么地段/什么小区/多大面积在日常社交中即时可见;
          (c)信贷抵押品——房贷/抵押消费贷使住房同时充当财富存储和消费杠杆。
          在此条件下,推论依赖的"财富(不可见)≠消费(可见)"区分坍塌——住房不平等既
          是财富不平等也是可见消费不平等,MPC梯度对住房财富→住房消费的压缩效应远弱于
          对金融资产的压缩效应(因为住房本身即是消费载体)。
        result: "被部分消化——揭出中国锚的结构性弱点"
        digestion: |
          推论可将此消化为边界条件:在住房占家庭财富主导地位+住房高度可见的社会,
          掩码机制的效力被结构性削弱(因为首要财富形式即是高可见品类)。这与中国锚的
          方向一致性声称不矛盾(方向仍对),但削弱了中国锚对完整掩码机制的支撑力——中国
          消费Gini的温和可能更多源于住房消费的特殊性(自有住房的推算租金/居住成本口径)
          而非MPC梯度的压缩效应。建议:在中国锚中诚实标注住房财富-消费区分坍塌的
          混淆(见本轮 SHOULD-13),并注册"住房财富占比"作为掩码机制的调节变量——
          住房财富占比越高的国家,掩码效应应越弱(因为更多财富以可见形式持有)。
          此条不构成净杀(不影响方向预测),但揭出推论的一个隐含假设:财富的主要持有形式
          是低可见度金融资产而非高可见度实物资产。
    conclusion: |
      五条路线无一构成scope内的净杀反例。CE-2(政治话语)触发 excluded_outcomes 范畴
      修正(required)。CE-5(中国住房)揭出"财富以低可见金融资产为主"的隐含假设,
      需诚实标注+注册为调节变量(should)。其余路线均被事前消化机制或边界条件覆盖,
      或属"尚未干净检验"而非"已证伪"。

  non_recurrence:
    ded_004:
      result: "未复发"
      detail: |
        独立确认 round_1 判断。DED-004 死因:用被预测量定义前件。DED-052 的 anti-talisman
        四条禁令直接封堵此模式。所有前件独立于公平感知结果可测。四条预测各有明确反向
        证伪条件。无 DED-004 式循环。
    ded_007:
      result: "未复发"
      detail: |
        独立确认 round_1 判断。DED-007 死因:自变量与被预测量共享测量轴。DED-052 的
        自变量(MPC梯度/财富-消费Gini楔子/消费可见度/信贷扩张)全部来自经济统计调查或
        事前文献编码,被预测量(不公平感知)来自跨国态度调查。两套测量在机构/样本框/工具上
        均独立。无测量轴焊死。

  required_fixes:
    - id: REQ-1
      priority: required
      source: "本轮从 round_1 SHOULD-4 升级"
      action: |
        拆分 excluded_outcomes 第(1)项,禁止将"政治话语/阶级框架使财富不平等进入公众
        感知"混入"财富信息制度透明(税务记录公开可查)"边界。原因:政治话语是政治传播
        现象,可在任何有言论自由的社会存在,将其作为排除标准会使排除范围失去事前可编码性
        (任何高不公平感知的国家均可被事后归因为"那里的人经常谈论不平等")。
        修正方案:
        (1a)财富信息制度透明——税务记录/资产登记法律上公开可查,按法律条文事前编码
        (de jure 标准,不含 de facto 媒体报道频率);
        (1b)高强度财富不平等政治动员——媒体中财富不平等议题的报道频率/社交媒体讨论量
        超过阈值,按媒体内容分析事前编码(阈值在见任何国别公平感知数据前锁死)。
        法国(税务记录非公开)应从(1a)移至(1b)或同时标两类的真实状态。若(1b)的阈值
        难以事前操作化,诚实标注"政治话语通道的排除标准暂不可操作化"并将法国/拉美等
        案例标记为"竞争解释待检验"而非"已排除"。不可用模糊排除标准消化反例。

  should_fixes:
    - id: SHOULD-1
      priority: high
      source: "继承 round_1 SHOULD-1,本轮未消解"
      action: |
        不公平感知度量决胜规则预注册。"国家均值或认为不公平的人群占比"的OR替换为
        单一主度量+备用度量稳健性检查。建议主度量=ISSP Social Inequality模块
        "income differences are too large"国别均值(Likert 1-5),备用=同题项"同意/强同意"
        占比。主度量在见任何国别数据前锁定。跨国比较中若某国仅有WVS/ESS数据,使用
        最对口等价题项+跨调查锚点校准,不得混用不同度量口径。
      note: "L4-009 判例光下此条逼近 required——但方向预测提供基本可证伪性,保持 should。"

    - id: SHOULD-2
      priority: high
      source: "继承 round_1 SHOULD-2,本轮未消解"
      action: |
        消费可见度三档边界判据操作化。以 Heffetz 可见度排名的百分位区间替代示例品类:
        0-33百分位=低可见,34-66=中可见,67-100=高可见。品类内变异(高端vs廉价家具)
        通过"品类平均可见度"诚实标注缓解,稳健性检查使用品类×价格交互项。编码协议在
        见任何国别公平感知数据前锁死。

    - id: SHOULD-3
      priority: high
      source: "继承 round_1 SHOULD-3,本轮扩展"
      action: |
        预测(a)-(d)的统计决策规则注册:
        (a)"更显著预测变量"→消费Gini与财富Gini的回归系数之差正负号+增量R²比较,
        消费Gini系数>财富Gini系数且消费Gini增量R²>财富Gini增量R²;
        (b)"弹性应越小"→财富Gini×楔子交互项系数为负;
        (c)品类梯度→高可见品类消费Gini的回归系数>低可见品类,且差异统计显著;
        (d)"反弹且超过扩张前基线"→点估计超调+单侧95%CI下界>0。
        方向错误=直接证伪;方向正确但未达统计显著=推论未被支持但亦未被推翻。
        【本轮扩展】MPC梯度二分(陡/平)的分割点如需用于实际检验(非仅nontriviality_test
        概念论证),需预注册——建议中位数分割或基于MPC估计不确定性的稳健分割。

    - id: SHOULD-4
      priority: high
      source: "继承 round_1 SHOULD-5"
      action: |
        primary_suspect 证伪路径精确化。当前从"媒体/政治话语驱动感知"到"(b)被证伪"的
        映射跳了一步——(b)失败可因MPC测不准(secondary_suspect)而非媒体替代。补充:
        若数据允许,增加直接检验——媒体中财富不平等报道频率/强度是否调节(削弱)消费
        Gini→不公平感知的关系?同时诚实承认:(b)的失败有多重解读(MPC测不准 vs 媒体驱动),
        两竞争解释的鉴别需要额外数据。

    - id: SHOULD-5
      priority: medium
      source: "继承 round_1 SHOULD-6"
      action: |
        统一 consumption_visibility 在 operationalization(三档)与 nontriviality_test(两档)
        中的档数。建议 nontriviality_test 保留三档(3×2六格)或扩展,使分类体系全文件
        一致。若保留2×2,明确声明"中可见"品类的归属规则——建议归入低可见以取保守
        (若中可见品类也显示掩码效应,是推论赚到的而非借口径便宜)。

    - id: SHOULD-6
      priority: medium
      source: "继承 round_1 SHOULD-7"
      action: |
        MPC梯度跨国估计最低可接受标准注册:最低国家数N≥20、MPC估计必须利用外生收入
        冲击的准实验估计(不得用OLS的APC代替)、估计窗口统一使用暂时性意外冲击口径。
        若可用干净MPC估计国家数不足,诚实标注"预测(b)在当前数据条件下不可检验"。

    - id: SHOULD-7
      priority: low
      source: "继承 round_1 SHOULD-8"
      action: |
        anti-talisman 削弱条件触发后的推论状态路由。注册路由规则:单一削弱条件触发→
        status降为 verified*(带悬案);两个及以上削弱条件触发→rejected;全部三个削弱
        条件触发+方向相反→rejected 且记录为"已证伪"。

    - id: SHOULD-8
      priority: medium
      source: "本轮新增,源自RF-7对锚3的核查"
      action: |
        derivation 步骤1声称的"看不见同伴待遇→拒绝反应消失"控制条件——请核实此条件
        是否确实在 Brosnan & de Waal (2003)中报告。若存在,引用具体页码/条件描述;
        若不存在或仅存在于后续复制研究(如 van Wolkenten et al. 2007 或 Range et al.
        2009),更正引用来源并诚实标注"此控制条件来自后续研究而非原始报告"。
        不影响主机制(可见奖励触发反应本身已确立),但应确保引用准确。

    - id: SHOULD-9
      priority: medium
      source: "本轮新增,源自RF-10的BR-L2-013 scope gap"
      action: |
        在 derivation 步骤1中诚实标注"伸展应用":BR-L2-013 证明"可见不平等能触发不公平
        厌恶"(猴子实验+儿童实验),但未证明"可见消费是现代社会感知财富不平等的主导通道"。
        后者是 DED-052 自身的经验赌注(通过预测(a)(c)可检验),非父砖的直接逻辑担保。
        建议措辞:"BR-L2-013确立可见性是不公平感知的【充分触发条件之一】,本推论进一步
        假设在现代匿名社会中消费可见度是【主导触发通道】——此假设本身即预测(c)的检验
        对象,若(c)被证伪则此伸展被拒绝。"

    - id: SHOULD-10
      priority: medium
      source: "本轮新增,源自CE-1中'触发阈值'未定义"
      action: |
        南非/印度 counterexample 的消化路径依赖"剩余差距仍远超触发阈值"——此"触发阈值"
        从未被定义。若不定义,消化可被事后调整(设得足够低以使任何反例被消化)。建议:
        注册不公平感知的"触发阈值"操作化——例如不公平感知的国家均值是否超过ISSP跨国
        中位数+1SD——并在见任何一国的公平感知数据前锁死。或诚实承认"触发阈值暂未
        操作化,此消化路径标记为待定"。

    - id: SHOULD-11
      priority: medium
      source: "本轮新增,源自CE-2的竞争解释"
      action: |
        将"政治话语作为替代感知通道"注册为 discriminant_validity 的第四对手(与现有
        三个判别——标准不平等文献/Veblen/虚假意识——并列)。当前 DED 将其混入
        excluded_outcomes(通过"制度透明"的范畴伸张)是一种逃避:政治话语通道是与推论
        并列的竞争假设,不是排除标准。推论应预测:在政治话语高密度国家(媒体不平等报道
        频率高),消费Gini→不公平感知的弹性应弱于政治话语低密度国家——此预测可与(b)(c)
        联合检验,使"政治话语"从逃逸通道变为可检验的调节变量。

    - id: SHOULD-12
      priority: low
      source: "本轮新增,源自CE-5的中国住房财富-消费坍塌"
      action: |
        在中国锚(real_world_anchors.supporting[1])中诚实标注住房作为财富-消费区分坍塌
        的混淆——中国家庭财富>70%集中于住房,且住房同时是高可见消费信号。标注"住房
        财富占比"作为掩码机制的潜在调节变量:住房财富占比越高的国家,预测掩码效应越弱
        (因为更多财富以可见形式持有)。这使混淆从"未建模噪声"升级为"可检验的调节假设"。

    - id: SHOULD-13
      priority: low
      source: "本轮新增,源自verdict_note的信贷不对称"
      action: |
        信贷掩码机制(derivation步骤4)应诚实标注不对称假设:当前逻辑默认信贷扩张优先
        惠及穷人消费(压缩消费Gini),但富人也可通过资产抵押借贷用于可见消费(portfolio
        loan买游艇/豪宅抵押消费贷)。若富人信贷驱动型可见消费的增长速度≥穷人信贷驱动型
        消费的增长速度,信贷扩张可能放大而非压缩可见消费不平等。建议:将"穷人vs富人的
        消费信贷弹性比"注册为信贷掩码效应的调节变量——只有当穷人消费信贷弹性显著高于
        富人可见消费信贷弹性时,信贷扩张才产生掩码效应。

  review_date: 2026-07-16
