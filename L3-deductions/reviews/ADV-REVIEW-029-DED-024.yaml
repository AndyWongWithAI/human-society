      [should] timescale 声称(预测(iv))诚实标注来源。当前预测(iv)的"1→2月级→2→3周级→3→4天级"
      和"4→3年级→3→2代际级→2→1年级"是无锚定量声称。建议在预测(iv)后补一句:"注意:上述数量级
      为理论预期的典型值,来源于 THEOREM Corollary 1 整体性比较(月/年级 vs 天/周级)的阶段间插值,
      尚未经纵向数据校准。对阶段间速率差异的方向(加速瓦解、减速重建)有理论支撑,但具体数量级属
      theory-driven quantification,待纵向专门检验。" 使读者不被具体数字的精确感误导。
    - |
      [should] 在 primary_suspect 和 operationalization 中诚实标注 ceiling 声称的实操检验困境。
      阶段3不可逆的天花板(<初始深度80%)需 T0 基线,而 operationalization 已诚实标注"IAT/生理指标
      只能测当期状态,无法直接测初始基线"。建议:(a)在 primary_suspect 中承认"天花板声称的证伪在
      缺乏 T0 基线的现实场景中近乎不可行——当前为理论推导,待专门纵向实验(需在瓦解前建立基线)检验";
      (b)在 operationalization 中补一条"代理基线方案":使用同年龄段/同文化/同规范域的未瓦解群体的
      内化深度分布作为估计基线,或使用 retrospective 自报的'瓦解前内疚强度'回忆数据(承认其可靠性
      限制)。两条均不完美,但至少给出了"怎么测"的路径,而非仅说"测不了"。
    - |
      [minor] boundary_cases 增列两个场景:(a)创伤性加速瓦解(背叛创伤/战斗道德伤害)——单一高冲击
      事件导致的阶段加速是否在四阶段框架内还是需要独立建模;(b)compartmentalized internalization
      (分域内化)——阶段模型是 per-norm 还是 per-person,若为前者需在预测中限定规范域,否则一个人
      在领域A处阶段4但领域B处阶段1时,"阶段3不可逆"的声称在领域间不一致。

