  counterexample_hunt: |
    【r2 独立五路猎捕，未获 scope 内净杀反例；确认 r1 三条猎路的消化仍然成立；
    猎路 C 暴露"维度解耦"概念需更精确表述→已消化为 should】

    === 猎路 A：前比特币时代的"设计范式"虚拟货币（攻击因果必要性）===

    靶心案例：E-gold(1996)/WebMoney(1998)/Liberty Reserve(2006)/Linden Dollars(2003)/
    WoW Gold(2004)。共同特征：参数空间被锚定物（黄金/法币）或封闭平台限定，无一个案例
    探索了"物理世界不可能同时满足的极端参数组合"。关键区分——DED-036 的"设计范式"
    不是"用数字技术实现货币功能"（这在 Bitcoin 前就存在），而是"在参数空间中自由组合
    六维特征而不受物理/制度锁定约束"。前 Bitcoin 虚拟货币未实现维度解耦——E-gold 供给
    受黄金地质约束，Linden Dollars 供给受企业决策约束（制度锁定而非算法固定）。→未净杀。
    这些案例展示了"数字技术使货币设计更便利"（BR-L2-032 平凡应用），未展示"候选池本体论
    从自然枚举变为参数扫描"（DED-036 非平凡增量）。

    === 猎路 B：前现代"设计"货币——Electrum/计数棒/交子（攻击二元对立清晰性）===

    Electrum 合金币（人工配比→参数仍在自然元素凸包内）、计数棒（债务工具非通用媒介）、
    交子（纸货币→极低耐久+极高便携但供给失控→恰证明了物理世界无法同时满足所有极端
    参数组合）。→未净杀。r1 猎路 1 的消化在此得到独立确认。

    === 猎路 C：前现代非金属货币的维度独立性（攻击"维度解耦是算法独有现象"）===

    贝壳（高便携≠低供给可控）、石币（极低便携≠高耐久）、盐块（低耐久≠中等可分）的
    维度确实不全部锁定在一起。但关键洞见——这些货币在某些维度上表现好恰是以另一些维度
    的牺牲为代价的（贝壳高便携但供给失控→通胀毁灭）。算法范式的真正增量不是"维度变得
    独立"本身，而是"可以同时优化所有维度而不被物理锁定惩罚"。维度解耦预测（相关矩阵
    更稀疏但非零）仍可检验且不因此被推翻。→未净杀。

    === 猎路 D：当代加密货币的"模板复制"现象（攻击"候选池真正拓展"）===

    Bitcoin 族（固定供给/PoW）在供给维度聚类；Ethereum/Dogecoin 等偏离。实证问题，
    不能仅凭方向性观察裁决。falsifiability (b) 已将此列为可证伪条件→推论自身诚实。
    →未净杀。确认此为最可能的实证推翻路径。

    === 猎路 E：SWIFT/电子法币——"算法前的高效数字设计货币"（攻击分期）===

    电子法币在"法币制度锁定"框架内实现数字优化（供给=央行政策不可独立编程），维度间
    通过制度而非物理锁定。关键区分——不是"数字=设计"，而是"维度可独立编程=设计"。
    电子法币的数字性是包装，参数空间被制度锁定。→未净杀。

    综合：r2 五路猎捕无 scope 内净杀。猎路 C 暴露的"维度解耦"概念需更精确表述→
    已消化为 should_findings 中的 discriminant_validity 改进建议。

  non_recurrence_of_ded004_007: |
    【r2 独立复核——未复发 DED-004 和 DED-007】

    DED-004（不可证伪循环）：三条 falsifiability 条件均在逻辑上可被独立反例推翻。
    coding_protocol 已注册使条件 (a)(c) 可实操检验。与 DED-004（"空格永远在未来某个
    条件下才被填充"→逻辑上永不成熟）性质根本不同。→未复发。

    DED-007（测量轴焊死）：IV（评估成本）与 DV（特征分布+维度解耦）测量通道概念层
    分离。IV 代理不引用 DV，DV 编码不依赖 IV。与 DED-007（"IV 概念定义依赖 DV"→
    焊死）性质根本不同。→未复发。

  required_fixes: []

  should_findings:
    - |
      [should] coding_protocol 中 Gold portability=0.3 的评分场景假设未显式注册。
      当前规则"金属高价值运输需安保→黄金0.3（$50K≈1kg可放入口袋但易成为目标）"
      隐含场景为"正常法治社会中的安全运输"。在资本管制/战乱/银行系统失效的替代
      场景中，黄金的高价值密度恰是便携性优势（小额体积=大额价值，可随身携带跨境
      而无需基础设施）。建议在 portability 规则中明确场景假设（如"日常合法合规交易
      场景，假设银行+互联网基础设施可用"），或拆为两个子维度（"物理便携性"与
      "基础设施独立性"）以消除歧义。当前不影响方向性（Bitcoin 在大多数日常场景下
      更便携），但影响跨场景可比性。
    - |
      [should] 统计显著性阈值未预注册。falsifiability (a) 的"显著更分散"与 (c) 的
      "无显著差异"均未指定 α 水平（0.05/0.01）和效应量预期。方向性预测的证伪不依赖
      精确阈值（方向相反则任何 α 都救不了），但预注册显著性阈值是好的方法论实践。
      建议在 falsifiability 节中注册：单尾 α=0.05，效应量预期 Cohen's d≥0.5，并说明
      "若 p∈[0.05,0.10] 方向正确→报告为边际支持，需更大样本验证"。
    - |
      [should] "任意参数组合"措辞过度伸张。derivation step 4 称候选池爆炸为"六维参数
      空间中任意可编程点的连续统"。实际约束包括：共识机制可行性（PoW/PoS 等有限
      选项）、智能合约平台表达能力、市场接受度、监管合规。建议改为"参数空间中远超
      物理世界可达范围的广阔区域"。此措辞不影响核心预测（~10个自然材料→数万个参数
      组合已足够支撑"更分散"）。
    - |
      [should] 在 discriminant_validity 中更彻底地讨论前现代非金属货币的维度独立性
      边界。猎路 C 发现贝壳/石币/盐块的维度并非全锁定——虽然这不推翻核心主张（前现代
      货币的维度独立以牺牲其他维度为代价），但"物理世界维度锁定"的表述可能被误读为
      "所有物理货币的所有维度都高度相关"。建议在 derivation step 1 或 discriminant_
      validity 中区分两种锁定：(i) 金属内部的原子级锁定（金密度→便携性+同质性捆绑）
      ——BR-L2-021 的核心机制；(ii) 前现代非金属货币的"无法同时达到所有极端值"约束
      ——物理世界的更广义限制。此区分可预防"贝壳的便携性与供给可控性不相关→维度
      解耦不是新现象"的误读。
