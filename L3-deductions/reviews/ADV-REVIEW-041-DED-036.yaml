id: ADV-REVIEW-041-DED-036
type: adversarial_review
reviews: DED-036
layer: L3-deductions

人话摘要: |
  DED-036（算法成本断崖×货币物理筛选：从发现到设计）round_1 独立对抗审查——
  needs_revision。核心洞察（算法成本坍缩使货币候选池从自然有限枚举拓展到参数空间扫描）
  方向性成立且不在任何单块承重砖中，但四条 required 缺陷挡在 verified 门前：(1) 六维
  编码口径未注册——defers to BR-L2-021 operationalization 但 BR-L2-021 无此物
  (Red Flag 11)；(2) anti-talisman 闭合条件循环化——"排除模仿自然者"的判据若用特征
  向量邻近度则测试本身被预过滤(Red Flag 6)；(3) 事实锚过度伸张——Bitcoin portability
  =1.0 忽略基础设施依赖，gold portability=0.3 可争议(Red Flag 7)；(4) 2×2 高成本+
  分散格"物理不可能"声称被前现代多元货币形态挑战——人类不用算法也能选出远离金属簇的
  货币(Red Flag 2 逐格判空)。一条 should: BR-L2-032 weakly_verified(IEA=1.6)的置信度
  未传播到 deduction 的推导措辞。反例猎捕三路均未获 scope 内净杀但暴露了边界模糊处。
  未重蹈 DED-004/007 致命模式。

target: DED-036
protocol: |
  Rule B 独立对抗审查（作者≠审查者，全新独立上下文，与作者及前几轮审查者无关）。
  评分卡通用红旗 13 条逐项攻 + 反例猎捕（判 verified 前必做）+ DED-004（不可证伪循环）
  /DED-007（测量轴焊死）复发检查。裁决三态照评分卡：verified 需同时满足 (1) 无 required
  缺陷 (2) 亲自猎捕无 scope 内活反例 (3) 不重蹈 DED-004/007。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新独立上下文, 与作者无关)"
  verdict: needs_revision
  verdict_note: |
    这是一条【有真实非平凡增量的候选推论】。核心主张——"算法成本断崖使货币候选池的
    生成方式从自然有限枚举（发现范式）质变为参数空间扫描（设计范式）"——不在 BR-L2-021
    （静态六维筛选框架，含便携性价值密度子维度的局部 E_network 反馈但未讨论候选池生成
    范式）或 BR-L2-032（三维度跨域成本断崖，不特定于货币领域）任何单砖中，也不在二砖
    的简单并集中。两砖焊接后涌现的"候选池本体论变化"是一个真实的跨砖合成增量——
    BR-L2-021 没有"候选池从哪来"这一变量，BR-L2-032 没有"货币领域会发生什么"这一射程。

    但四条 required 缺陷挡在 verified 门前：

    (1) 【六维编码口径未注册——核心预测的测量基础悬空（Red Flag 11, required）】
    DED-036 的 operationalization 将六维编码标准 defer 到 "BR-L2-021的operationalization"，
    但 BR-L2-021 没有 operationalization 节、没有 [0,1] 编码协议、没有任何评分 rubric。
    real_world_anchors 中给出的具体分数（Bitcoin: divisibility=1.0/portability=1.0;
    gold: portability=0.3/supply_controllability=0.5）是断言式的，没有分子/分母/
    编码规则。不同编码者对这些分数会有实质分歧——而核心预测（分布分散化）的方向和
    显著性完全依赖于编码结果。Red Flag 11 判例明确："只有数字没有口径→直接标记 required"。
    → required: 提供六维→[0,1]的编码协议（每维的分子/分母/标定锚点/编码规则），
    或诚实地将当前编码标注为"illustrative only, not independently reproducible"。

    (2) 【anti-talisman 闭合条件隐含循环（Red Flag 6, required）】
    anti_talisman clause (3) 说"排除所有'主动选择模仿自然参数'的代币后，剩余原生算法代币
    的特征分布仍需显著比传统金属池分散"。但"主动选择模仿自然参数"的识别判据未操作化——
    若判据是"特征向量落在自然材料凸包内"，则排除步骤与测试步骤共享同一判据→循环：
    你先把"靠近自然的"拿掉，再检验"剩下的"是否远离自然——后者必然成立因为前者已被拿掉。
    PAXG 的例子（明确锚定黄金→可独立识别为"模仿"）是清晰的，但边界代币（如 Litecoin
    模仿 Bitcoin 而 Bitcoin 部分模仿黄金的稀缺性→模仿链上的第 N 层算不算"模仿自然"？）
    的归类缺乏独立判据。→ required: 给出独立于特征向量邻近度的"主动选择模仿"识别判据
    （如白皮书/设计文档中的显式声明、代币命名中的锚定信号），或重写闭合条件避免循环。

    (3) 【事实锚过度伸张——三个 anchor 的编码存在系统性偏向（Red Flag 7, required）】
    逐项复核：
    (a) Bitcoin "portability=1.0" 忽略基础设施依赖：比特币转账需要互联网接入+节点软件+
    私钥保管——在离线/无电网/无互联网的环境中，Bitcoin 的便携性是 0。黄金的便携性
    （密度 19.3 g/cm³，$50K 的金条约重 1 kg 可放入口袋）被评为 0.3——这个分数可能低
    估了黄金在高价值转移场景下的实际便携性。两者分数的差距（1.0 vs 0.3）可能被夸大。
    (b) Bitcoin "durability=1.0" 混淆了账本持久性与物理耐久性：比特币网络的持久性依赖
    于矿工持续运行——如果所有矿工停止，账本仍然存在但失去实用货币功能。这与黄金的
    化学惰性（不依赖任何外部系统即可保持物理完整）是不同类别的"耐久性"。
    (c) Gold "supply_controllability=0.5" 未解释评分逻辑：黄金年供应增量 1.5-2% 是所有
    商品中最稳定的——如果供给稳定性是这个维度的核心（按 BR-L2-021 原文："年新增供应/
    既有存量之比足够低且稳定"），黄金的得分可能应该更高。当前评分（0.5=中 vs Bitcoin
    1.0=完美）似乎是为了最大化两者对比而校准的，而非从预注册的 rubric 导出。
    → required: 在编码协议（见 required fix #1）的基础上重新校准三个 anchor 的分数，
    或至少诚实标注当前编码中的主观判断成分和可能的偏向方向。

    (4) 【2×2 判据表中"高成本+分散"格声称"物理不可能"过度伸张（Red Flag 2, required）】
    文件声称该格为"物理不可能"——"没有算法时你无法生成'供应量严格固定+无限可分+
    零物理重量'的参数组合"。但前现代社会使用了多种特征向量远离金/银/铜簇的货币形态：
    贝壳（高便携+高可分+极低供给可控）、雅浦岛石币（极低便携+极低可分+高耐久）、
    盐块（低耐久+低便携+中度同质）、布匹（低耐久+中度便携+低同质）——这些多元货币
    形态的特征向量远非"聚类在自然金属附近"，且无需算法即可产生。该格未被填充不意味
    着"物理不可能"——它意味着"在物理世界中生成任意参数组合的能力受限"，而不等价于
    "特征分布必然聚类于金属簇"。把"能力受限"升级为"物理不可能"是过度伸张，削弱了
    逐格判空的可信度。→ required: 修正该格的声称，从"物理不可能"降级为"候选池规模
    和多样性受物理定律显著约束"——这仍保留了核心的非平凡性（格子不被平凡强制为
    空或满），但不做过度声称。

    综合：四条 required 修复均可定向完成，核心骨架（成本坍缩→候选池本体论变化→分布
    分散化+维度解耦+创新速率跃升）不变。非 rejected，needs_revision。

  red_flag_findings:
    brick_conclusion: |
      【未命中——核心增量不在任何单块承重砖中，attribution 诚实】

      逐字核对两块承重砖：

      BR-L2-021（一般等价物的物理筛选）含：
      - 六维静态筛选框架（可分性/耐久性/便携性/可识别性/同质性/供给稳定性）
      - 局域权重概念（不同交换网络特征→不同维度权重→不同文明不同媒介）
      - E_network 反馈在便携性价值密度子维度的局部讨论（"筛选的放大器而非起点"）
      - falsifiability：找到六维全面劣却胜出的商品→框架被推翻
      不含：
      - 候选池的生成范式（"候选品从哪来"）
      - 算法成本断崖对货币筛选的影响
      - 发现→设计的范式转变
      - 分布分散化/维度解耦/参数创新速率等预测
      → 砖含的是筛选框架本身，不含候选池的本体论讨论。

      BR-L2-032（算法驱动的搜索/匹配/监控成本断崖）含：
      - 三维度成本断崖（搜索 4-5 数量级/匹配 1.4x 经济+10000x 规模/监控 10x）
      - 跨域证据（电商搜索/平台匹配/声誉系统）
      - falsifiability：找前数字安排在可比规模上实现相近效率的反例
      不含：
      - 货币筛选领域的任何特定讨论
      - 候选池生成范式的概念
      - 发现→设计的范式转变
      → 砖含的是成本断崖的跨域经验命题，不特定于货币领域。

      两砖合取：BR-L2-021 告诉你"货币如何被筛选"（六维得分高者胜出），BR-L2-032 告诉你
      "算法使搜索/评估成本崩塌了"。两砖各自不含"当把 BR-L2-032 的成本断崖应用到
      BR-L2-021 的货币筛选时，候选池的本体论会从发现变为设计"——这是真正的跨砖合成增量。

      DED-036 在 discriminant_validity 中正确识别了与 BR-L2-021/DED-027/L4-013 的差异：
      - vs BR-L2-021：增量在候选池生成方式而非筛选终点
      - vs DED-027：增量在候选池初始分布而非收敛动力学
      - vs L4-013：增量在候选品从哪来的本体论而非权重变化

      brick=conclusion 自查段中的声称（"未在任何承重砖中原文或近义出现"）经独立核对成立。
      → 此红旗未命中。

    nontriviality_cell_check: |
      【部分命中——三个格子定位正确，但"高成本+分散"格的"物理不可能"声称过度伸张
      (→required fix #4)】

      2×2 判据表（评估成本[高/低] × 特征分布[聚类/分散]）：

      格（高成本，聚类）——「平凡·历史基线」:定位正确。物理约束+高搜索成本→候选池
      受限→BR-L2-021 和常识均预测此格。此格被历史充分填充（金/银/铜的聚类）。

      格（低成本，分散）——「非平凡格·核心预测」:定位正确。算法成本断崖使候选池爆炸
      →特征分布应系统性更分散。BR-L2-021 不预测此格（它只说"高分者胜出"，不说候选池
      分布），BR-L2-032 不预测此格（它只说"成本降了"，不说到货币领域会怎样）。此格是
      二砖交互的独有预测→非平凡性成立。

      格（低成本，聚类）——「若被大量填充，削弱推论」:定位正确。若即使有算法，有效
      候选品仍聚类在黄金参数附近→"质变"声称坍缩为量变。此格的可填充性使推论可证伪——
      不是所有低成本场景都自动产生分散分布。

      格（高成本，分散）——「声称物理不可能·过度伸张（required）」:文件声称此格被
      "物理定律的约束"强制为空——"没有算法时你无法生成'供应量严格固定+无限可分+
      零物理重量'的参数组合"。此声称有两个问题：

      (a) "分散"不等于"包含算法时代才可能的极端参数组合"。前现代社会使用了多种特征
      向量远离金/银/铜簇的货币形态：贝壳（cowrie shells——高便携+高可分+极低供给可控，
      在非洲/亚洲/太平洋广泛使用）、雅浦岛石币（rai stones——极低便携+极低可分+
      高耐久，特征向量在便携性维度上远离一切金属）、盐块（低耐久+低便携，在 Sahel
      流通）、布匹/纺织品（低耐久+中度便携+低同质，在多个文明中充当货币）。这些
      货币的特征分布并非"聚类在自然金属附近"——它们是分散的，只是分散的边界受物理
      定律约束（你无法达到供应量严格固定+无限可分+零重量的组合），但不等于"必然聚类"。

      (b) "分散"是相对概念——相对于"只有金属"的基线，前现代多元货币已经是分散的。
      真正独特的是算法范式下的"极端参数组合"（如供应量严格固定+无限可分+零重量），
      而非"分散"本身。把"不能达到极端参数组合"等同于"必然聚类"是范畴错误。

      修正不影响核心非平凡性：即使把"物理不可能"降级为"候选池规模和多样性受物理定律
      显著约束（但并非必然聚类于金属簇）"，低成本+分散格的非平凡性仍然成立（二砖
      各自不预测"更分散"）→核心空格仍是非平凡的。→ required: 修正该格的声称措辞。

    measurement_orthogonality: |
      【主干正交——IV（评估成本）与 DV（特征分布）测量通道概念层分离，未到 DED-007
      级焊死，但 IV 的代理变量存在测量混杂】

      IV（自变量——算法评估成本）的测量：
      - 代理 (a): "候选品从提出到被市场广泛评估的时间间隔"——金用了上千年，比特币
        用了约 5 年。此代理混杂了多个非评估成本因素：网络效应扩散速度、通信/运输
        技术进步、全球金融基础设施的成熟度、人口规模和识字率。把整个时间差归因于
        "评估成本下降"是过度归因——金在公元前后的世界里从发现到广泛接受所需的时间，
        部分是因为那个世界的通信速度慢、人口少、贸易网络稀疏、没有全球金融市场。
      - 代理 (b): "新增候选品的边际评估成本"——传统范式下需"数代人的实际使用试错"，
        算法范式下需"一次智能合约审计+数周价格发现"。这个对比混淆了两件事：传统
        范式下的"数代人试错"既是评估成本，也是网络效应的扩散时间。算法范式下的
        "数周价格发现"只覆盖了评估部分——网络扩散到全球接受可能仍需要数年。

      DV（被预测量——特征分布分散度）的测量：
      - 六维向量编码+成对欧氏距离或总方差。测量源是货币候选品的物理/算法属性→
        独立于评估成本的测量通道。概念层正交。

      综合：IV 和 DV 使用不同的测量通道（时间间隔/经济成本 vs 特征向量编码）→主干
      正交，未重蹈 DED-007 级概念焊死。但 IV 代理的混杂（时间间隔≠纯评估成本）是
      操作化不精的问题——成本下降的方向性（算法确实大幅降低了评估成本）是稳健的，
      但精确量级（4-5 个数量级在货币领域）可能被混杂因素夸大。→ 此为 should 级
      精度问题，达不到 required。已在 primary_suspect 中自认为 secondary suspect。

    scope_hook_independent_of_result: |
      【合规——三条 excluded_outcomes 均基于可事前独立识别的特征】

      (1) "算法代币完全取代传统金属货币成为全球主导货币"——排除基于"本推论预测范式转变
      而非范式胜负"的射程边界。范式转变与范式胜负是两个独立变量→可事前识别。

      (2) "具体哪个算法代币会成为主导媒介"——排除基于"这是 DED-027+市场条件的复合问题"。
      → 射程边界合理。

      (3) "法定数字货币（CBDC）的六维特征"——排除基于"CBDC 受制度约束而非市场自发筛选"。
      制度约束（中央银行设计 vs 市场自发筛选）是可事前识别的独立特征→合规。

      追加检验：排除钩子是否可能被事后扩大以消化不利案例？
      - (1) "范式胜负"的门槛清晰——只要不声称"设计范式一定赢"，此排除稳健。
      - (3) "制度约束"的边界在边缘处可能模糊：某些算法稳定币（如 USDC/USDT）的
        供给由中心化实体控制→它们算是"制度约束"还是"市场自发筛选"？文件在
        real_world_anchors 中将 USDC/USDT 列为 supporting（"设计范式下的主动选择
        模仿物理"）而非 excluded，暗示它们被视为在市场自发筛选中→边界一致。
      → 排除钩子稳健，无事后扩大风险。合规。

    criterion_tier_match: |
      【不命中——连续量做方向/比较静态预测，无 DED-006 式分档失配】

      被预测量（特征分布分散度=成对欧氏距离均值/总方差）是连续量。预测均为方向性或
      比较静态：(i) 分布更分散（单尾检验）；(ii) 相关矩阵更稀疏（维度解耦）；
      (iii) 生成速率跃升（~百年/个→~天/个）。2×2 判据表的二分（高/低成本、聚类/
      分散）是为理论结构的分析工具，operationalization 承认评估成本是连续量且将聚类/
      分散操作化为连续度量（成对距离均值）。→ 无 DED-006 式连续量用二元分档的失配。

    anti_talisman_cashed: |
      【纸上在位——三条硬约束概念层干净，但 closure condition (3) 存在循环风险
      (→required fix #2)】

      三条硬约束逐条压力测试：

      (1) 判定"设计范式"时按特征向量是否落在自然材料凸包外:
      → 概念层干净——自然材料凸包由元素周期表事实独立定义（金的密度/化学惰性等
      不依赖于"金是不是钱"）。"落在凸包外=真正设计"的判据可独立施用。合规。

      (2) 判定"维度解耦"时用独立编码:
      → 物理锁定关系由材料科学独立给定，数字耦合由代码审计独立验证。不依赖代币成功
      与否。合规。

      (3) 反例消化门——排除"主动选择模仿自然"的代币后检验分散度:
      → 存在循环风险（见上 verdict_note 中的 required fix #2）。"主动选择模仿自然"
      的判据未独立操作化。如果 PAXG 可通过其白皮书/名称（"PAX Gold"）独立识别为
      "模仿黄金"，那么边界案例（如 Litecoin→模仿 Bitcoin→Bitcoin 模仿黄金稀缺性→
      这是第几层模仿？）的归类缺乏独立判据。→ required: 操作化"模仿"判据使之独立于
      特征向量邻近度。

      综合：三条约束在位，(1)(2) 干净，(3) 的闭合条件需要去循环化。

    anchor_fact_check: |
      【三个 anchor 方向正确，但编码分数存在系统性偏向（→required fix #3）；无致命
      事实错但有两处过度伸张】

      (1) "比特币的参数组合在物理世界无对应物":
      方向正确——Bitcoin 同时具备"极高分性+极高便携性+算法固定供应"的组合在物理
      世界确实不可能。但编码分数存在偏向：
      - Bitcoin portability=1.0 忽略基础设施依赖（需互联网/电力/节点软件）
      - Bitcoin durability=1.0 混淆账本持久与物理持久
      - 物理世界对比（黄金六维）的分数也存在可争议处（见下）
      → 核心主张方向正确，分数精度有偏。→ required 校准。

      (2) "以太坊的供应计划灵活性":
      事实无误——以太坊确实经历了 PoW→PoS 切换和 EIP-1559 的供应规则变更，这些
      是链上公开数据可独立验证的。参数创新速率（10 年 3 次重大变更 vs 黄金千年不变）
      的方向性正确。→ 合规。

      (3) "稳定币（USDC/USDT）——设计范式下的主动选择模仿":
      方向正确——稳定币的参数是刻意设计来模仿法币美元的（锚定 1:1），这在自然筛选
      范式下不存在。"设计者可以选择模仿"本身就是设计范式的证据。→ 合规。

      综合：无致命事实错。三个 anchor 的核心叙事（比特币探索了新参数区域、以太坊展示
      了可编程供应、稳定币展示了设计式模仿）方向正确。编码分数精度问题是操作化缺陷
      而非事实错误。

    definition_vs_prediction: |
      【通过——核心预测均为可证伪的经验主张，非定义性同义反复】

      三个 falsifiability 条件逐条复核：

      (a) 算法筛选品与传统金属品的六维分布无显著差异→推翻"设计范式带来新参数区域":
      此条件在逻辑上可证伪——若加密货币的特征分布与传统金属无显著差异（统计检验），
      核心预测被推翻。操作化依赖编码协议（→见 required fix #1）。→ 逻辑可证伪。

      (b) 成功代币（市值前 20）特征向量高度聚类在黄金参数附近→推翻"设计开辟新有效区域":
      此条件在逻辑上可证伪——它不依赖"是否设计"，只依赖"成功者的特征分布"。若成功者
      聚类在传统参数区，说明设计的探索是噪声→市场仍在奖励物理最优解。→ 逻辑可证伪
      且操作化较干净（不依赖"设计范式"的判定）。

      (c) 维度解耦预测被推翻——加密六维相关矩阵与金属无显著差异:
      此条件在逻辑上可证伪——相关矩阵可独立计算，不依赖任何理论内部参数。→ 证伪力
      最强的条件。

      三个条件在逻辑上均可被独立反例推翻。条件 (a) 的实操证伪力受编码协议约束
      （→required fix #1 修复后恢复），条件 (b) 和 (c) 的证伪力较强。→ 定义/预测区分通过。

    enumeration_and_species: |
      【不命中——推论不声称穷举任何类别/物种】

      DED-036 的核心主张是范式转变（发现→设计）及其经验后果（分布分散化/维度解耦/
      创新速率跃升），不声称穷举"N 类可枚举"的货币类型学。2×2 判据表是理论分析工具
      而非穷举声称。→ 此红旗不适用。

    primary_suspect_aim: |
      【指对了方向——自认两条 suspect 均准确；但漏认了两条隐腿】

      文件自认：
      - primary_suspect: 设计者认知锚定使"设计"事实上只是"加速的模仿"→有效候选池
        未实际扩大→质变声称坍缩为量变。
      - secondary_suspect: BR-L2-032 成本下降量级的精确性（weakly_verified, IEA=1.6）。
      - unlikely_suspect: BR-L2-021 六维框架 + AXIOM-001（物理事实+逻辑基石确定性高）。

      三条自我识别方向准确：
      - cognitive anchoring 确实是整个推论最脆弱的腿——如果设计师只是"用代码重写
        黄金的剧本"（Bitcoin 2100 万=数字版稀缺性，PoW=数字版挖掘），那么"设计"
        只是"加速的模仿"。
      - BR-L2-032 的 weakly_verified 状态确实是结构的薄弱处。

      但文件漏认两条隐腿：

      (a) 【编码口径缺失使核心预测不可检验（required, 见 fix #1）】
      primary_suspect 讨论的是"如果检验了会怎样"，但没有意识到当前的编码基础使
      检验本身不可操作。这是比 cognitive anchoring 更前置的缺陷——如果没人能独立
      复现六维编码，预测 (a)(c) 的证伪都无法进行。→ 加到 required。

      (b) 【BR-L2-032 weakly_verified 的置信度传播不充分（should）】
      secondary_suspect 承认了 BR-L2-032 的 weakly_verified 状态，但 deduction 全文
      的推导措辞仍将"成本下降≥10,000 倍"当作已确立的事实使用（"算法将搜索和评估
      成本压低了上万倍""成本断崖(BR-L2-032)使……"）。而 BR-L2-032 自身标注 IEA=1.6
      （<1.8 verified 线），且三项成本度量中仅搜寻维达到了 10,000x（匹配维经济降幅
      仅 1.4x，监控维仅 10x）。货币评估成本具体属于哪个维度？如果是"匹配+监控"的
      混合（评估候选品=匹配属性到需求+监控其表现），则 10,000x 的量级可能不适用。
      BR-L2-032 原文诚实地区分了三维度的不同降幅——DED-036 应同样诚实地标注。
      → should: 在 derivation step 3 或 limitations 中标注"货币评估成本的具体降幅
      量级未独立测量，当前 10,000x 引用的是 BR-L2-032 搜寻维的量级，其在货币评估
      场景的适用性需进一步标定"。

      平凡化检查：抽掉 DED-036 的非平凡增量（候选池本体论变化+分布分散化+维度解耦+
      创新速率跃升）后，推论坍缩为"算法让货币评估变快了"——这正是 BR-L2-032 在
      货币领域的平凡应用。推论的非平凡性完全依赖于"候选池从自然枚举变为参数扫描"
      的质变声称→自认 suspect 覆盖了核心脆弱链。平凡化检查通过。

    caliber_registration: |
      【命中——六维编码口径未注册，核心预测的测量基础悬空（Red Flag 11, required）】

      逐项检查分子/分母/口径注册情况：

      (1) 六维编码标准：operationalization 说"六维编码标准见BR-L2-021的operationalization"。
      但 BR-L2-021 没有 operationalization 节（grep 确认：文件中无 'operationalization'
      字段，无 'encoding' 字段，无 '[0,1]' 或 'score' 或 '标准化' 等编码相关内容）。
      BR-L2-021 给出的六个维度是定性描述（"可分性——能被分割为不同量级而不损失价值"），
      不含如何将定性描述映射到 [0,1] 数字的协议。

      (2) 具体分数的生成规则未注册：Bitcoin divisibility=1.0（"1亿聪，纯数字精度，无限可分"），
      gold divisibility=0.7（"物理切割有下限"）。这两个分数是从什么规则导出的？
      - "无限可分"→1.0，"有下限"→0.7 —— 为什么不是 0.5 或 0.8？
      - gold portability=0.3（"密度高/重量大/大额运输需武装"）—— gold 密度 19.3 g/cm³
        意味着高价值密度（小体积=大价值），这应该增加便携性得分而非降低。当前评分似乎
        与"物理便携性"（体积/重量）和"价值便携性"（单位重量的价值）的关系不一致。

      (3) 分布分散度的测量口径：operationalization 说用"成对欧氏距离均值或总方差"——
      这是可操作的统计量。但分子（欧氏距离）的分母归一化未指定——如果编码本身偏向
      某一方向（如算法代币系统性得分更高因为编码规则奖励数字属性），则分散度的差异
      是编码 artifact 而非实质差异。

      Red Flag 11 判例（L4-009/利比亚）："阈值/判据是否连同分子、分母、测量口径
      【一次性注册】？发现'只有数字没有口径'→ 直接标记 required。"
      本案正是"只有数字（divisibility=1.0/0.7 etc.）没有口径（如何从属性映射到分数）"。

      → required: 提供六维→[0,1]的完整编码协议，至少包括：每维的编码锚点（什么算 0、
      什么算 1）、编码规则（定性属性如何映射到连续分数）、独立编码者间信度检验方案。
      如果 BR-L2-021 或另一个文件中确实有该协议，则需在本文件中引用精确的文件路径和
      节名；如果不存在，则需在本文件中原创或诚实标注"编码协议待开发，当前分数仅供
      方向性示意"。

    data_source_independence: |
      【不命中——本推论的锚点不依赖多机构统计数据的独立性问题】

      本推论的 empirical anchors（比特币/以太坊/稳定币的链上参数）是公开可验证的
      协议层数据，不涉及 CNBS/WB/IMF 等同根数据源问题。三个 anchor 分别是独立项目的
      独立协议设计→不存在"同一底层数据被多家机构重复发布"的独立性虚高问题。
      → 此红旗不适用。

    api_independence_masquerade: |
      【不命中——本推论的证据不依赖 API 通道】

      本推论的 real_world_anchors 依赖的是链上协议参数和公开历史事实，不是通过特定
      API/MCP 工具查询获得的数据。→ 此红旗不适用。

  counterexample_hunt: |
    【三路独立猎捕，均未获 scope 内净杀反例；暴露两处边界模糊 + 一处 empirical
    question 可检验】

    === 猎路 1：法币——"设计范式"在算法前已存在（攻击因果必要性）===

    【靶心案例：北宋交子（约 1024 CE）——纸货币的设计】
    北宋益州（今四川）的交子是世界上最早的官方纸币。其货币特征向量：
    - 可分性：高（不同面额）
    - 耐久性：极低（纸张易损、遇水即毁、需定期以旧换新）
    - 便携性：极高（纸张极轻，大额交易极为便利）
    - 可识别性：中等（雕版印刷防伪，但伪造技术也在进步）
    - 同质性：高（标准化印刷，同一面额完全等价）
    - 供给可控性：极低（政府超发→贬值→最终废弃，交子仅存续约 80 年）

    此特征向量明显落在金/银/铜的自然材料凸包之外（耐久性极低、便携性极高、供给
    可控性极低的组合在自然金属中不存在）。且这是"设计"出来的——北宋官员和商人
    主动创造了这一货币形式以解决铁钱笨重的问题——不是"大自然给的菜单"。

    消化分析：
    (a) 法币（交子及后世所有纸币/法币）在 BR-L2-021 的射程外——BR-L2-021 处理的是
    自发市场筛选（"在无中心协调者的多商品交换网络中"），而法币是由主权权力强制或
    半强制推行的。交子虽有民间起源（私交子阶段），但其作为广泛接受的媒介的过程高度
    依赖政府背书和法定接受。
    (b) DED-036 也在 discriminant_validity 中排除了 CBDC（制度约束而非市场自发筛选）——
    历史法币同理。
    (c) 纸本身仍受物理定律约束（耐久性差→交子的短寿部分正是此维度的失败）→"没有
    算法时你无法生成'高耐久+极轻+无限可分+供给算法固定'的组合"——交子在某些维度
    上成功（便携性），但在耐久性和供给可控性上严重失败。这正是"物理世界无法同时
    满足全部极端参数组合"的证据。
    (d) 但交子确实证明：即使在"高评估成本"的古代，人类也能主动设计出特征向量远离
    自然金属簇的货币形式。这不推翻"算法使设计更自由"的方向性主张，但挑战了
    "候选池从自然枚举变为参数扫描"是二元质变的声称——更精确的说法是"候选池的
    可设计程度从受限（物理世界仍有设计空间但各维度互相锁定）提升到近乎无限
    （数字世界维度解耦+任意参数组合可达）"。

    结论：未净杀——交子可被"法币在 BR-L2-021 射程外"消化。但暴露了 deduction 未
    显式处理"前算法时代的 design-like 货币形式"的边界问题。→ should: 在
    discriminant_validity 或 real_world_anchors 中增列历史法币/代表性货币（如交子、
     tally sticks、烟草券等"设计出来的非金属货币"），说明它们与算法时代设计的
    本质差异（物理约束仍将各维度锁定→无法同时达到极端组合）。

    === 猎路 2：前现代多元货币——攻击"高成本+分散"格的"物理不可能"声称 ===

    【靶心案例集：贝壳（cowrie shells）/ 雅浦岛石币（rai stones）/ 盐块——多元
    货币形态在前现代的真正存在】

    - Cowrie shells (非洲/亚洲/太平洋, ~1300-1900 CE):
      可分性=高（单个 shell 是最小单位），耐久性=中（不易降解但可被压碎），
      便携性=高（轻小），可识别性=中（种类可辨但产地/品相差异），同质性=中高
      （同类 shell 基本等价），供给可控性=极低（任何人都可去海边采集；16 世纪后
      欧洲人大量从印度洋输入→毁灭性通胀）。特征向量在供给可控性维度上大幅偏离金属簇。

    - Rai stones (雅浦岛, 密克罗尼西亚, 持续至 20 世纪):
      可分性=极低（无法物理分割，所有权转移通过口头记录），耐久性=高（石灰岩不降解），
      便携性=极低（最大的石币直径 4 米、重数吨），可识别性=高（每块石币有独特历史和
      所有者链），同质性=低（每块石币价值不同），供给可控性=中（石材需从帕劳岛远洋
      运输→天然供给受限）。特征向量几乎在所有维度上都远离金属簇——这是"人类设计"
      （选择石币的形式+远洋获取石材的制度）但无算法辅助。

    - 盐块 (Sahel 西非, 长期):
      耐久性=低（遇水溶解），便携性=低（密度低+价值密度低→大体积运输），
      供给可控性=低（不同盐矿产量波动大）。在耐久性和便携性上严重偏离金属簇。

    消化分析：
    (a) 贝壳和盐块是"自然物品被人类选中"，在 DED-036 的框架中属于"发现"范式
    （尽管人类主动运输、分配、赋予货币功能，但物品本身是自然物）。
    (b) 雅浦岛石币是边界案例——石币的形式和获取制度是人类主动设计的（指定某类石材、
    指定从哪个岛获取、建立所有权的口头记录系统），但它仍是物理物品且受物理定律严格
    约束（搬运需要全村的劳动力）。
    (c) 这些案例的共同点：每个案例中，货币形式在某些维度上偏离了金属簇，但在另一些
    维度上付出了代价（贝壳→供给不可控，石币→极低便携性，盐块→低耐久性）——
    这正是 BR-L2-021 的核心逻辑（六维必须同时达标，失一维则失败），也是算法设计
    范式的真正优势（可以同时优化多个维度而不受物理锁定约束）。

    结论：未净杀——这些案例展示了"高成本下特征分布确实可以在某些维度上偏离金属簇"
    （"物理不可能"声称被削弱），但每个案例都是以其他维度的牺牲为代价的（"物理锁定"
    机制反而被验证）。核心洞察（算法使多维度同时优化成为可能→真正的全向量分散）仍然
    成立。→ required fix #4（降级"物理不可能"声称）包含了此猎捕的发现。

    === 猎路 3：当代 crypto 市场的"模板复制"现象——攻击"设计探索新参数区域" ===

    【靶心：Top-100 加密货币的同质化趋势】
    如果检查 CoinMarketCap/CoinGecko 的前 100 代币：
    - 绝大多数采用固定供应上限或可预测的发行曲线（模仿 Bitcoin 的稀缺性设计）
    - 绝大多数具有高可分性（18 位小数几乎成为行业标准——模仿 Bitcoin 的聪模型）
    - PoW 和 PoS 是两种主导的共识机制（创新空间实际有限）
    - 大量代币是 ERC-20/BEP-20 等标准协议的实例（技术参数由协议标准限定）
    - "新代币"更多是复制已有模板+品牌/社区/用例的差异化，而非探索全新的参数空间

    这个模式如果成立→"低成本+聚类"格被大量填充→推论被削弱（质变坍缩为量变）。

    消化分析：
    (a) falsifiability (b) 已经列出了这个场景作为可证伪条件——"成功代币的特征向量
    聚类在黄金参数附近→设计开辟新有效区域的预测被推翻"。这说明推论自身是诚实的，
    承认了这种可能性。
    (b) 但我们没有实际的六维编码数据来确认 Top-100 是否真的"聚类"——这是实证问题，
    不是逻辑问题。
    (c) 即使 Top-100 在"供应模型"维度上聚类于固定上限或可预测曲线，它们在"供应
    可控性的实现机制"上差异显著（PoW 的实物能源锚定 vs PoS 的金融质押锚定 vs
    算法稳定币的 oracle 锚定 vs 治理代币的投票锚定）——这些机制差异在当前的六维
    框架中可能未被捕获（它们不只是"供应可控性"的差异，而涉及供应可控性的"社会
    组织方式"）。

    结论：未净杀（无实际编码数据），但猎路确认 falsifiability (b) 是推论最可能被
    未来实证挑战的路径。这个猎路也暗示了一个更深的问题：六维框架可能系统性遗漏了
    "社会/制度维度"（如：供应可控性的实现是否需要信任特定人类机构？共识机制是否
    依赖能源消耗？去中心化程度如何？）——这些在数字货币中至关重要的维度在物理
    筛选框架中没有对应物（物理世界不需要"共识机制"因为自然定律是共识）。

    综合：三路猎杀均未获 scope 内净杀反例。猎路 1（法币）和猎路 2（前现代多元货币）
    暴露了 deduction 边界处的过度伸张（"物理不可能"声称、未讨论前算法时代的设计
    类似物），已转化为 required/should 修复建议。猎路 3 是实证悬而未决的问题，当前
    不构成净杀。

  non_recurrence_of_ded004_007: |
    DED-004（不可证伪循环）:【未复发——逻辑层三个可证伪条件健在，实操证伪窗口
    受编码协议缺失的限制但非逻辑免疫】

    逻辑层:
    (a) 算法品与传统品六维分布无显著差异→"新参数区域"预测推翻。
    (b) 成功代币聚类在黄金参数附近→"设计开辟新有效区域"预测推翻。
    (c) 维度解耦失败——相关矩阵无差异→"参数独立编程"机制推翻。

    三个条件在逻辑上均可被独立反例推翻。与 DED-004（"空格永远在未来的某个条件下
    才会被填充"→逻辑上永不成熟）性质根本不同——只要完成编码（→required fix #1），
    条件 (a)(c) 在逻辑上今天就可以被检验（拿 Top-100 代币和传统金属的编码向量跑统计）。

    实操层:编码协议缺失使条件 (a)(c) 的检验暂时不可操作（→required fix #1）。但这
    是操作化不充分，不是逻辑免疫——编码协议一旦注册，检验即可进行。不等同 DED-004。

    → 未复发 DED-004。

    DED-007（焊死测量轴）:【未复发——主干正交，但 IV 代理有测量混杂】

    主干（IV=评估成本 vs DV=特征分布）:
    - IV 的代理（时间间隔、边际成本）与 DV（六维向量编码）使用完全不同的测量通道。
    - 评估成本的测量不引用被预测量（特征分布）的任何信息。
    - 特征分布的测量（六维编码）不依赖于评估成本的高低。
    → 概念层正交，测量通道分离。

    残余问题（should 级）:
    IV 代理的时间间隔混杂了多个非评估成本因素（通信速度、市场规模、金融基础设施、
    人口规模）。"金用了上千年→评估成本高"与"比特币用了 5 年→评估成本低"的对比
    将整个时间差归因于评估成本——归因过强。但方向性（评估成本确实大幅下降了）是
    稳健的，问题仅在量级精度。→ 不到 DED-007 级焊死（DED-007 是"IV 的概念定义
    依赖于 DV"→本案 IV 的概念定义不依赖于 DV）。

    → 未复发 DED-007。

  required_fixes:
    - |
      [required] 注册六维→[0,1]编码协议（Red Flag 11）。当前 operationalization 将编码标准
      defer 到 "BR-L2-021的operationalization"，但 BR-L2-021 没有 operationalization 节、
      没有编码协议、没有任何评分 rubric。必须提供：
      (a) 每维的编码锚点——什么属性得 0.0、什么属性得 1.0（如便携性：0.0=无法移动的物体
      如石币/土地，1.0=纯信息传输如银行转账；锚定至少两个中间点如 0.5）。
      (b) 每维的编码规则——如何从可观测属性映射到 [0,1] 连续分数（如供给可控性：年供给
      增量的可预测性和稳定性→稳定于 <2% 年增幅且不可人为操纵的得高分；可被人为无限
      增发的得低分）。
      (c) 独立编码者间信度检验方案（两人独立编码同样 N 个候选品→计算 Cohen's kappa 或 ICC）。
      (d) 如果该协议确实存在于另一文件中，则在本文件中引用精确文件路径和节名；如果不存在，
      则在本文件中原创或以 limitations 诚实标注"编码协议待开发，当前分数仅供方向性示意"。
      在编码协议注册前，real_world_anchors 中的所有具体分数（0.3/0.7/1.0 等）应标注为
      "illustrative"。
    - |
      [required] 去循环化 anti_talisman clause (3) 的闭合条件（Red Flag 6）。当前："排除所有
      '主动选择模仿自然参数'的代币后，剩余原生算法代币的特征分布仍需显著比传统金属池分散"。
      但"主动选择模仿自然参数"的识别判据未操作化——如果"特征向量落在自然材料凸包内"就是
      判据，则排除步骤和检验步骤共享同一判据（循环）。修复：给出独立于特征向量邻近度的
      "模仿"判据，至少包含：(a) 白皮书/设计文档中是否显式声明锚定某种物理货币的属性
      （如 PAXG 的 "each token = 1 troy ounce of gold"）；(b) 代币命名/品牌是否直接引用
      物理货币（如 "Bitcoin Gold"/"GoldCoin" 等）；(c) 代币的核心参数是否在推出时就被
      设计者明确描述为"模仿X的自然属性"。对于不满足上述任一判据但特征向量落在自然凸包内
      的代币→不排除它们→它们在"分散度"检验中充当不利证据（使分布更聚类→削弱推论），
      这正是推论应承担的 risk。或等价地：完全删除"排除模仿者"的预处理步骤，直接用全样本
      （含 PAXG 等桥接型代币）检验分散度→若推论在全样本下仍成立（分散度仍显著高于传统
      金属），则推论更强；若全样本下不成立但排除后成立→诚实报告此局限，推论置信度降级。
    - |
      [required] 重新校准 real_world_anchors 中的六维编码分数，至少修正以下三处过度伸张
      （Red Flag 7）：
      (a) Bitcoin portability：当前 1.0 忽略基础设施依赖。建议 (i) 明确此分数假设"互联网+
      电力+节点软件可用"的前提条件，或 (ii) 将 portability 拆为"物理便携性"（纯信息传输
      =1.0）和"基础设施依赖度"（需基础设施=折扣因子如 0.8→综合 0.8），或 (iii) 至少诚实
      标注"1.0=在有互联网接入的理想条件下，离线条件下降至 0"。
      (b) Bitcoin durability：当前 1.0 混淆账本持久与物理持久。建议将 durability 在数字
      语境下重定义为"价值存储的持久性"（含网络存续概率），或拆为"物理耐久性"（账本
      数据的不可销毁性=1.0）和"网络存续依赖性"（依赖矿工/节点持续运行的折扣）并诚实
      标注二者的区别。Gold 的 durability=1.0（化学惰性，不依赖任何外部系统）与 Bitcoin
      的 durability 不是同一构念。
      (c) Gold supply_controllability：当前 0.5 需解释评分逻辑。BR-L2-021 原文定义供给
      稳定性为"年新增供应/既有存量之比足够低且稳定"——按此定义，黄金（年增量 1.5-2%，
      极稳定，已存量巨大）应得分较高（≥0.7）。当前 0.5 的评分似乎是在与 Bitcoin 的 1.0
      （算法绝对固定）做对比时被拉低——若 rubric 是"是否绝对固定"则两者都应有折扣（Bitcoin
      在 2140 年后停止发行但在此之前供给仍在增长）。建议在编码协议中明确定义供给可控性
      的评分维度（是"供给的可预测性"还是"供给的绝对固定性"还是"供给不受任何人类机构
      操纵的程度"），然后统一应用。
      以上三处修正不影响 anchor 的方向性支持（比特币的向量仍落在金凸包外的方向），但
      影响"分散度"的定量程度→应在编码协议（fix #1）的框架下统一重标。
    - |
      [required] 修正 2×2 判据表中"高成本+分散"格的声称（Red Flag 2, 逐格判空）。当前声称
      此格被"物理定律的约束"强制为空——"不可能"的措辞过强。前现代多元货币（贝壳/石币/
      盐块/布匹/交子）的特征向量在部分维度上明显偏离金属簇→该格并非"完全不可能被填充"，
      而是"填充程度受物理定律显著约束"（各维度互相锁定→无法同时达到极端组合）。建议将
      "物理不可能"改为："物理约束使候选品无法同时满足多个极端参数组合（如同时具备黄金的
      耐久性+比特币的可分性+零物理重量）→候选池的多样性和分散度受物理定律显著约束→
      系统性低于算法范式下的分散度"。此修正保留了核心空格（低成本+分散）的非平凡性。
  should_findings:
    - |
      [should] BR-L2-032 weakly_verified (IEA=1.6) 的置信度传播不充分。DED-036 全文将
      "成本下降≥10,000 倍"当作已确立事实使用，但 BR-L2-032 自身 IEA=1.6（低于 verified
      线 1.8），且三维度降幅各不相同（搜索 10,000x、匹配经济降幅仅 1.4x、监控仅 10x）。
      货币评估成本在 BR-L2-032 的三维度中无直接对应——"评估候选品"不是单纯的搜索（它是
      搜索+匹配属性+监控表现的综合）→引用的 10,000x 量级在货币评估场景的适用性需标定。
      建议在 derivation step 3 或 limitations 中标注："货币评估成本的具体降幅量级未独立
      测量——当前引用的 10,000x 是 BR-L2-032 搜寻维的量级（跨域类比）；货币评估场景可能
      同时涉及搜索和匹配和监控成本→综合降幅可能小于 10,000x。方向性（大幅下降）稳健，
      精确量级待标定。"
    - |
      [should] 在 discriminant_validity 中讨论"前算法时代的设计类似物"——历史法币（如
      北宋交子）、代表性货币（如 tally sticks/烟草券）、及"制度设计的货币形式"与算法
      时代设计的本质差异。当前文件只讨论了 CBDC（排除）和传统金属（发现），未覆盖中间
      地带——人类在算法之前确实"设计"过货币形式（纸、符号、信用工具），但这些设计
      仍受物理/制度锁定约束（维度不可解耦）。讨论此边界可强化推论的 discriminant validity：
      说明"不是设计本身是新的——是在物理世界不可解耦的维度在数字世界中变得可解耦"。
round_2:
  reviewer: "独立对抗审查者 (round 2, 全新独立上下文, 与前轮审查者无关)"
  verdict: verified
  verdict_note: |
    本轮独立审查确认：r1 五条 required 修复已【全部充分消解】。逐条核验如下——

    (1) 编码协议已注册（coding_protocol 节）：六维各有锚点+编码规则+置信度，
    标注"illustrative, 非正式注册"，诚实承认未经过独立编码者检验。real_world_anchors
    中的分数已依据 coding_protocol 重新校准——Bitcoin portability 从 1.0 降为 0.8
    （承认基础设施依赖），durability 从 1.0 降为 0.9（承认网络存续依赖），gold
    supply_controllability 从 0.5 升为 0.7。Red Flag 11 从 required→消解。

    (2) anti-talisman clause (3) 已去循环化：新增[主动选择模仿的识别判据（独立于特征向量
    邻近度）]——判据为白皮书/设计文档中的显式声明+命名锚定信号+市场公认分类，
    明确"若无法基于文档/命名确定，则将该代币保留在全样本中，不做排除处理"→判定
    方向保守（不利于推论）。Red Flag 6 从 required→消解。

    (3) real_world_anchors 已重校：三个 anchor 的分数按 coding_protocol 调整，主观性
    已注释（"当前编码为illustrative，非独立可复现，分数可能存在主观偏差"）。Red Flag 7
    从 required→消解。

    (4) 2×2 判据表（高成本, 分散）格的声称已从"物理不可能"降级为"填充度受物理锁定约束"，
    并承认"并非绝对空：前现代社会已使用贝壳、石币、盐块等多元货币"→同时保留了核心
    空格（低成本+分散）的非平凡性。Red Flag 2 从 required→消解。

    (5) derivation step 3 已标注 BR-L2-032 状态为 weakly_verified，并诚实声明"货币领域
    具体成本降幅尚未独立测量"。should 级置信度传播缺陷已修复。

    本轮独立红旗扫描（13 条逐项）未发现新的 required 级缺陷：
    - RF1 brick=conclusion: 未命中。核心结论不在任何单砖中，attribution 诚实。
    - RF2 逐格判空: 四个格子定位正确。（高成本, 分散）格的降级修复充分——"填充度受
      物理锁定约束"比"物理不可能"诚实，且保留了核心非平凡性。
    - RF3 测量轴正交: 主干正交。IV（评估成本的时间/经济代理）与 DV（六维向量编码）
      使用不同测量通道，未到 DED-007 级焊死。
    - RF4 射程/排除钩子: 合规。三条 excluded_outcomes 均基于可事前识别的射程边界。
    - RF5 分类判据档位匹配: 合规。预测为方向性/比较静态，2×2 为分析工具。
    - RF6 anti-talisman 真兑现: 合规。三条硬约束在位，(3) 的独立判据保守（不明确者
      保留在全样本中→不利于推论）。隐性功能趋同者留在样本中削弱分散度→推论应承担的
      risk，不构成循环。
    - RF7 现实锚事实核查: 合规。三个 anchor 方向正确，分数已按协议校准。Gold
      portability=0.3 存在争议空间→见 should_findings。
    - RF8 定义vs预测: 通过。三个 falsifiability 条件均为可被独立反例推翻的经验预测。
    - RF9 枚举穷尽: 不适用。DED 不声称穷举任何类别。
    - RF10 primary_suspect: 指对了方向。cognitive anchoring（primary）+BR-L2-032
      weakly_verified（secondary）均准确。r1 揭露的两条隐腿已修复。
    - RF11 口径完整注册: r1 required 修复后合规。coding_protocol 提供了每维锚点+规则。
      残余：统计显著性阈值未预注册（α 水平）→should 级，不构成 L4-009 式风险。
    - RF12 数据源同根: 不适用。
    - RF13 API 可及性冒充: 不适用。

    反例猎捕（r2 独立五路）未获 scope 内净杀：
    - 猎路 A（前比特币虚拟货币：E-gold/WebMoney/Linden Dollars/WoW Gold）：均为
      制度锚定型设计，未探索六维参数空间新区域。不构成"设计范式在算法成本坍缩前已
      充分运作"的证据。
    - 猎路 B（Electrum 合金币/计数棒 tally sticks）：人工设计但仍在物理凸包内（合金）
      或作为债务工具非通用交换媒介（计数棒）。不构成净杀。
    - 猎路 C（前现代非金属货币的维度独立性：贝壳/石币/盐块的维度部分不锁定）：
      这些货币的部分维度确实不锁定在一起，但它们无法同时达到所有维度的极端值——
      恰验证了 DED 的核心机制：物理世界的维度锁定使"牺牲某些维度换取另一些维度优化"
      不可避免，而算法范式使"同时优化所有维度"成为可能。未净杀。
    - 猎路 D（Top-20 加密货币是否聚类在黄金参数附近）：实证问题。falsifiability (b)
      已将此时为可证伪条件。此猎路确认此为最可能的实证推翻路径→推论自认，不构成新缺陷。
    - 猎路 E（SWIFT/电子法币——"算法前的高效数字设计货币"）：电子法币的维度优化
      在"法币制度锁定"框架内实现，维度间通过制度而非物理锁定——不在 DED 的"市场
      自发参数扫描"射程内。未净杀。

    未重蹈 DED-004（三个 falsifiability 条件逻辑可证伪+实操可测）或 DED-007（IV/DV
    测量轴概念层正交）。

    综合：r1 五条 required 修复充分消解，r2 独立扫描无新 required 缺陷，五路反例猎捕
    无 scope 内净杀。推论的三个 verified 条件全部满足→verified。

  red_flag_findings:
    brick_conclusion: |
      【r2 独立复核——未命中。r1 的逐砖核对结论成立】

      独立重读 BR-L2-021 摘要（INDEX.md）与 BR-L2-032 摘要。两者均不含"候选池生成范式
      从发现变为设计"或"六维维度解耦"或"参数创新速率跃升"这一合成结论。

      DED-036 的非平凡性依赖于"候选池本体论变化"这一跨砖合成增量——BR-L2-021 没有
      "候选池从哪来"变量，BR-L2-032 没有"货币领域会发生什么"射程。两砖焊接的涌现
      产物（候选池爆炸+维度解耦+分布分散化）不在任何单砖中。

      附加压力测试：若平凡化为"算法让货币评估变快了"→则它只是 BR-L2-032 在货币领域
      的平凡应用。但 DED-036 的非平凡增量在于 (i) 分布分散化的方向性预测（"更快的搜索
      引擎"应加速收敛到同一最优解而非产生系统性分布偏移）和 (ii) 维度解耦的结构性预测
      （物理锁定→独立编程）→两者均不是"变快"的逻辑蕴含。→此红旗未命中。

    nontriviality_cell_check: |
      【r2 独立复核——r1 修复充分，四格均正确定位】

      格（高成本，聚类）——「平凡·历史基线」:正确。
      格（低成本，分散）——「非平凡格·核心预测」:正确。二砖交互独有预测。
      格（低成本，聚类）——「若被大量填充，削弱推论」:正确。保证可证伪性。
      格（高成本，分散）——「填充度受物理锁定约束（r1 修复后）」:降级后诚实。"非空但
      稀疏"比"物理不可能"准确，且保留了核心非平凡性——该格的部分可填充性使（低成本,
      分散）格的"更分散"有了对比基线。→此红旗在 r1 修复后未命中。

    measurement_orthogonality: |
      【r2 独立复核——主干正交，未复发 DED-007】

      IV（评估成本的时间/经济代理）与 DV（六维向量编码+成对欧氏距离+Spearman ρ）
      使用完全不同的测量通道。IV 代理不引用 DV，DV 编码不依赖 IV。概念层正交。

      r1 已指出 IV 代理存在测量混杂（时间间隔≠纯评估成本）→should 级精度问题，
      不到 DED-007 级焊死（DED-007 是"IV 概念定义依赖 DV"）。

      追加检查——coding_protocol 的编码污染：部分规则将"数字/物理"作为编码输入
      （如 divisibility"数字代币：1.0；物理商品：按实用最小切割单位"）→存在轻微的
      "知道答案再打分"风险。但 (i) 规则可被独立审查修正，(ii) DED 在 limitations 中
      诚实标注。→should 级编码独立性改进点，不到 required。

    scope_hook_independent_of_result: |
      【r2 独立复核——合规。三条排除钩子均基于可事前识别的射程边界】

      (1) 范式转变≠范式胜负——两个独立变量。(2) 具体代币胜出=DED-027+市场条件——
      射程外。(3) CBDC=制度约束而非市场自发筛选——射程外。
      边界一致性：USDC/USDT 列为 supporting 而非 excluded→说明"制度约束"边界基于
      "谁在做筛选"（市场自发 vs 法定强制）而非"谁在做发行"。边界一致。→合规。

    criterion_tier_match: |
      【r2 独立复核——不命中。预测均为方向性/比较静态，DV 用连续度量】
      三个预测：(i) 分布更分散（单尾），(ii) 相关矩阵更稀疏，(iii) 创新速率跃升。
      DV 用连续度量。2×2 表是分析工具，非分类判据本身。→无 DED-006 式失配。

    anti_talisman_cashed: |
      【r2 独立复核——合规。三条硬约束在位，(3) 已去循环化且判定方向保守】

      (1) 设计范式判定：自然材料凸包由元素周期表独立定义。合规。
      (2) 维度解耦判定：物理锁定由材料科学独立给定，数字耦合由代码审计验证。合规。
      (3) 反例消化门（r1 修复后）：独立判据=白皮书显式声明+命名锚定信号+市场公认，
      不明确者保留在全样本中→保守方向。

      追加压力测试——「隐性功能趋同」：若代币未声明模仿黄金但其参数恰好相似→保留
      在样本中→分散度下降→推论被削弱。这正是推论应承担的 risk。→合规。
      追加压力测试——「模仿链第 N 层（r1 提出）」：Litecoin 自称"silver to Bitcoin's
      gold"→命名含"silver"→按独立判据应排除。Bitcoin 白皮书未自称"digital gold"
      （后人叙事）→不满足判据→保留。判据可操作且保守。→合规。

    anchor_fact_check: |
      【r2 独立复核——三个 anchor 方向正确，r1 修复后分数更可辩护；一处残余争议（should）】

      (1) Bitcoin vs gold 六维向量（coding_protocol 校准后）：Bitcoin 在可分性(1.0 vs 0.7)、
      便携性(0.8 vs 0.3)、可识别性(0.95 vs 0.85)、同质性(1.0 vs 0.95)、供给可控性(1.0
      vs 0.7)五个维度得分更高，仅在耐久性(0.9 vs 1.0)得分更低。方向正确。
      (2) 以太坊供应灵活性：The Merge+EIP-1559→链上公开数据可验证。方向正确。
      (3) 稳定币边界验证：设计选择模仿法币→证明设计范式存在。方向正确。

      残余争议（should）：Gold portability=0.3。隐含场景假设为"正常法治社会中的安全运输"，
      但在资本管制/战乱/银行失效场景中黄金的高价值密度是便携性优势。建议在 coding_
      protocol 的 portability 规则中明确场景假设。→不构成 required（方向性稳健）。

    definition_vs_prediction: |
      【r2 独立复核——通过。三个 falsifiability 条件均为可证伪的经验主张】
      (a) 分布无显著差异→推翻。(b) 成功者聚类于黄金参数→推翻。(c) 相关矩阵无差异→推翻。
      三个条件均可被独立反例推翻，非定义性同义反复。→通过。

    enumeration_and_species: |
      【r2 独立复核——不适用。DED 不声称穷举货币候选品的类型学分类】

    primary_suspect_aim: |
      【r2 独立复核——自认两条 suspect 方向准确；r1 揭露的两条隐腿已修复；r2 追加一条新隐腿（should）】

      文件自认：primary=cognitive anchoring（准确），secondary=BR-L2-032 weakly_verified
      (IEA=1.6)（准确），unlikely=BR-L2-021+AXIOM-001（准确）。
      r1 隐腿已修复：(a) 编码协议→coding_protocol。(b) 置信度传播→derivation step 3 标注。

      r2 新隐腿（should）：「发现/设计二元对立被前现代设计类货币模糊化」。北宋交子、
      Electrum 合金币、计数棒等展示了前算法时代的"设计"元素。若将"维度锁定"同时用作
      "发现范式"的归类判据和"设计范式"要解释的 dependent variable，存在归类循环风险。
      然而 falsifiability (c)（直接测量维度相关矩阵并比较，无需先归类）化解了此循环——
      只要相关矩阵确实不同，因果叙事就获得独立于归类判据的证据支持。→降为 should。

      平凡化检查：抽掉所有非平凡增量→坍缩为"算法让货币评估变快了"→BR-L2-032 的平凡
      应用。推论的非平凡性依赖于跨砖合成增量→通过。

    caliber_registration: |
      【r2 独立复核——r1 required fix #1 后合规。残余 imprecision 为 should 级】

      当前状态：六维编码协议已注册（每维锚点+规则+置信度），标注 illustrative，分数已
      按协议校准。Red Flag 11 核心问题（"只有数字没有口径"）已解决。

      残余 imprecision（should）：(a) 统计显著性阈值未预注册（α 水平），不构成 L4-009
      式风险——方向性预测的证伪不依赖精确阈值。(b) 独立编码者间信度仅提及未设计方案。
      (c) 部分编码规则将"数字/物理"作为编码输入→轻微"知道答案再打分"风险。
      →综合：coding_protocol 使核心预测从不可检验变为可检验→r1 required 充分消解。

