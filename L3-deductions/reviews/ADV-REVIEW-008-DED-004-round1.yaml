id: ADV-REVIEW-008
target: DED-004
date: 2026-07-13
type: adversarial_review
layer: L3-deductions
round: 1
人话摘要: "这是对推论 DED-004（本体系第一条'两条规律合起来才成立'的推论）的对抗式审查：特意派独立 AI 拼命找茬，发现作者自称的三块新意有三分之二其实是凑数（单独一条老推论就能得出、不需要两条合力），作者全盘接受、把推论缩水重写；砍到只剩真有新意的部分后，再换一个全新独立 AI 复核，判为'已通过审查'。这次也印证了'作者审自己看不见盲区、必须请独立的人来看'。"

# === 审查触发源 ===

trigger:
  source: DED-004 首次提交
  reason: |
    DED-004 是本体系第一条【交互型(composite)】推论——依 Rule D 从
    DED-001 × DED-002 推出。作者自称非平凡内容在 P1(共选择) + P2(规避耦合)
    + 标度三难。按 Rule B 派【独立子 Agent】(general-purpose，独立上下文=
    部分独立)做对抗式审查，明令"尽力击杀、默认怀疑、只有存活才通过"，
    并特别拷问 Rule D 最担心的风险：交互型是否退化为平凡合取。

# === 挑战者（独立子 Agent）===

challenger:
  identity: "独立对抗式审查者（子 Agent, general-purpose, 独立上下文）"
  date: 2026-07-13
  verdict_given: needs_revision
  one_line: |
    标度三难与 P1(弱式)有真非平凡内容而幸存；但 P2 的两个禁格在纯口头
    限定下各由【单一父推论】平凡蕴含(反证保护声明自我矛盾)，放宽到文书
    社会又被雅典/大英帝国占据；step 2"官僚化=成文化=同一动作"被冰岛与
    印加双向证伪。未达 reject 仅因 P1/(a) 仍非平凡。

  challenges:

    - id: C1
      title: "P2 禁格是平凡合取，反证保护声明自我矛盾"
      severity: critical
      detail: |
        逐格分析大型口头社会的 2×2 表(深度 × 规范统一)：
        - 禁格A(深>7 ∧ 碎片 ∧ 口头) 是"口头 ∧ 深>7"整行的子集，
          整行由 DED-001 单独判空——"碎片"是闲置合取项(白砖)。
        - 禁格B(大 ∧ 统一 ∧ 扁平 ∧ 口头) 是"口头 ∧ 大 ∧ 统一民主可达"
          整列的子集，整列由 DED-002 单独判空——"扁平"是闲置合取项。
        没有任何一格的判空需要两条父推论合力。作者"(b)(c)任一父推论都不
        蕴含"的辩护与逐格分析矛盾：他把"整个 2×2 图式用到两父"误当成
        "每条预测都需两父"。P2 是被三格排除后的逻辑余项，无独立证伪力。
      author_must: "承认 (b)(c) 在口头限定下由单一父推论蕴含；把非平凡性仅压在 P1/(a)；P2 降为解释性统一。"

    - id: C2
      title: "step 2「同一个动作」被双向机制反例证伪"
      severity: critical
      detail: |
        step 2 自称核心非平凡内容，断言官僚化=成文化=同一动作。双向反例：
        - 成文而不官僚：冰岛自由邦 1117 写下 Grágás 法典却零行政官僚
          (无执行机构、无国家)；早期罗马十二表法、日耳曼 Lex Salica 同类。
        - 官僚而不成文：印加以 quipu 承载普查/贡赋(重行政外化)却无可检索
          成文法；蒙古以 census/yam/paiza/畏兀儿文书重外化行政、Yassa 却薄。
        两项外化是【可分离的制度投资】，共用同一类通用外部媒介技术，
        但不是同一动作。
      author_must: "把 step 2 从'同一动作/一把钥匙'降为'共享同一使能基底→正相关'，承认 P1 是'相关'而非'同源'。"

    - id: C3
      title: "禁格B 证伪条件(c)漏写「纯口头」→被雅典字面证伪"
      severity: high
      detail: |
        条件(c)未含"纯口头/无形式化信息系统"这一项。古典雅典字面满足全部
        明列项：公民体数万(大)、直接民主/无深层官僚(扁平)、单一 nomos(统一)、
        法律刻石公示 + 6000 人陪审法庭由普通公民直接适用(民主可达)、持续~180年
        ——仅靠"文书外化"逃逸，而条件没写这一项。故按字面 P2 被雅典证伪。
      author_must: "给(c)补'纯口头'限定；但补后禁格B 坍缩为 DED-002 排除项子集(接 C1)，须一并处理。"

    - id: C4
      title: "印加「联合信息系统」锚点 B-limb 不成立 + B 定义全局不一致"
      severity: high
      detail: |
        joint 判据要求同一介质同时承载 A(行政)与 B(规范可从介质检索而非仅存
        记忆)。quipu 稳健承载 A(普查/贡赋/仓储)；但 B(叙事型 quipu 承载可检索
        规范)至今未被破译证实，且"quipucamayoc 依 quipu 诵法"是【专家记忆中介】
        (结绳是助记符不自解)——fail 掉 B 判据，属 DED-002 的专业化而非成文化。
        此外文件两处用不一致的 B：joint 判据用弱义 B(存到外部介质)，反雅典/反
        冰岛论证却用强义 B(无专家、民主可达)——连汉谟拉比石碑对文盲也是书吏中介。
      author_must: "印加降为'非纯口头'锚点；joint 主张改靠美索不达米亚(同一楔形文字承载账册+汉谟拉比)；全局统一 B 定义。"

    - id: C5
      title: "P1 的 φ 检验欠识别 + 与作者自设证伪条件(a)内在冲突"
      severity: high
      detail: |
        co_selection_phi 只测原始 φ(A,B)，无法区分"共享介质(真共选择)"与
        "规模作为共同因(大复杂社会在深度与规范数上都高)"。更致命：作者承认
        行政先行、规范晚到千年(美索不达米亚~1000年)；若"A-而-未-B"过渡期常见，
        截面样本塞满 A=1,B=0 → 把 φ 拉低 → 逼近作者自设证伪条件(a)(φ≈0 即证伪)。
        改用全生命史编码则几乎所有耐久文书文明 A=1,B=1 → φ 高但空洞。
      author_must: "主检验改为'同一介质家族承载两者'+对规模做偏相关；明确共时/历时编码，解决千年时滞两难。"

    - id: C6
      title: "禁格A 的「分节社会」scoping 使其近乎分析命题"
      severity: medium
      detail: |
        分节裂变社会按 Fortes & Evans-Pritchard 类型学即无头/扁平(有效指挥深度
        ~1-2)，故"深层级分节社会"近乎术语矛盾，禁格A 空是【定义性】而非经验发现。
        若把"碎片"放宽为"法律多元"，则大英帝国/哈布斯堡/奥斯曼 millet 是
        深+文书+法律多元的稳健占据者。
      author_must: "明确 scoping：窄义承认低新颖性(复述无头社会类型学)，或宽义承认被文书法律多元帝国证伪，二择一诚实声明。"

    - id: C7
      title: "「同一堵墙」过度统一化"
      severity: medium
      detail: |
        DED-001 与 DED-002 虽都上溯 AXIOM-002，但各调不同子约束(DED-001:
        串行传递保真 r^2n；DED-002: 记忆容量 + 多人一致协调成本 + AXIOM-003 +
        BR-L2-005)。是【共享一块地基石、各有另约束的两堵墙】，非"同一堵墙的两投影"。
      author_must: "把'同一堵墙'软化为'两堵墙共享 AXIOM-002 地基石，但各有另约束'。"

# === 独立反例搜索结果 ===

forbidden_cell_search:
  cell_A_deep_fragmented: |
    未找到稳健的"深层级分节社会"。分节裂变型(Nuer/Somali/Igbo/Tiv/Pashtun)
    按类型学即扁平(深度~1-2)，窄义禁格A 近乎定义性为空(非经验发现)。放宽
    "碎片"为"法律多元"后，大英帝国/哈布斯堡/奥斯曼 millet 是深+文书+法律多元
    的稳健占据者——但已外化(非纯口头)，不落原意禁格。两种读法都伤非平凡性。
  cell_B_large_flat_unified: |
    找到稳健字面占据者 = 古典雅典(见 C3)。冰岛自由邦(大+扁平+统一+纯口头
    ~187年)靠"法律宣讲人专家中介、非民主可达"逃逸，不算占据，但暴露这一列
    全靠 DED-002 的"民主可达"限定撑着(→ C1 平凡性)。
  P1_decoupling: |
    - 早期伊斯兰法：非系统性解耦，作者辩护成立(古兰经~650 即成文=B 已外化；
      hadith 口传处于识字环境+私人书面辅助；isnad=专业化)。不证伪 P1。
    - 美索不达米亚千年时滞：作者称"短期时滞"过牵强(~1000年=整个文明尺度的
      A-without-B)，强式(共选择/同源)在此被证伪，弱式(最终共现)勉强存活。
    - 早期罗马十二表法/日耳曼 Lex Salica：反向解耦(先成文后官僚)，证明外化
      顺序可逆、A/B 可分离 → 支持 C2。
    - 蒙古 Yassa：行政重外化、帝国规范薄、靠法律多元借用地方法典 → 支持 C4。
    综合：无单一"永久系统性解耦"清杀 P1，P1 在弱式下幸存；但集合证据把 P1
    逼进弱式并证伪 step 2 强式。

non_triviality_verdict: |
  P1(共选择) 非平凡但被弱化：φ>0 不被任一单独父推论蕴含(每父只谈 A 或 B
  之一)，故是真交互型命题——这一条把 DED-004 从"应予撤稿"救回。但 P1 的
  非平凡内容其实在"共享介质"而非"φ 相关"，co_selection_phi 只测后者(被规模
  混淆)，操作化没瞄准非平凡核心。
  P2(规避耦合) 非平凡性【不成立】：两禁格各由单一父推论判空(闲置合取项)，
  是解释性统一而非独立可证伪的新预测。
  结论：DED-004 因 P1 与标度三难保有非平凡内容、未达 reject；但明文非平凡性
  载体三分之二(P2 的 b、c)失效，剩下三分之一(P1/a)又被规模混淆与千年时滞
  削弱——实际强度远低于自我宣称，必须修订后方可升 verified。

# === 作者响应 ===

author:
  identity: "推论作者"
  date: 2026-07-13
  response: "全部接受。DED-004 按最小修订清单缩水重写。"
  revisions_made:
    - "[C1/C3/C6] P2 降级为'解释性统一'，明文声明不计入独有可证伪力；非平凡性仅压在 P1/(a)/(b)。禁格 A/B 及其平凡性在 statement 与 rule_d_compliance 中诚实承认。"
    - "[C2] step 2 与 statement 从'官僚化=成文化=同一动作/一把钥匙'降为'共享同一使能基底→控制规模后仍正相关'；写入冰岛/印加双向可分离反例。"
    - "[C4] 印加锚点从'联合系统'降为'非纯口头/可分离性'证据；joint 干净锚点改为美索不达米亚；全局统一 B 为弱义(存于外部持久介质，无论是否民主可达)。"
    - "[C5] P1 主检验改为'同一介质家族承载 A+B'+控制规模的偏相关；共时(偏相关)与历时(曾经-A ∧ 曾经-B)编码分别报告；千年时滞归为弱式允许、强式被证伪。"
    - "[C7] '同一堵墙'改为'两堵墙共享 AXIOM-002 地基石但各有另约束'。"

# === 裁决 ===

verdict: needs_revision
verdict_rationale: |
  round-1 裁决 needs_revision。DED-004 未达 reject——P1(弱式共享介质相关) +
  标度三难保有真非平凡内容(P1 的 φ>0 不被任一单独父推论蕴含)。但其自称的
  非平凡性有三分之二(P2 规避耦合的两个禁格)经逐格分析被证明是平凡合取，
  且 step 2 的"同一动作"强主张被冰岛/印加双向证伪。作者已全部接受并按最小
  修订清单缩水重写。修订版为 candidate，须经 round-2 确认后方可升 verified。

caveats:
  - "P1 的 partial-φ / 同介质家族检验尚未在真实跨文化样本上运行(Rule C 未做)——修订版 P1 是逻辑幸存者，未获经验确认。"
  - "quipu 是否承载可检索规范内容(B) 是印加案例的命门，若要落到 Rule C 需以 Urton/Salomon 一手 khipu 研究深查。"
  - "修订为纯缩水(移除/弱化过度主张)，未新增主张；round-2 复审应确认'缩水是否彻底、有无残留的平凡合取'。"

# === round-2 确认审查（全新独立子 Agent，2026-07-13） ===

round_2_confirmation:
  challenger: "全新独立对抗式审查者（子 Agent, general-purpose, 完全独立上下文）"
  date: 2026-07-13
  verdict: verified
  one_line: |
    缩水彻底落实 C1-C7；独立重跑逐格判空确认 P1 的两个证伪态(A⊥B 独立、
    永久单向外化)是【联合分布命题】、任一单独父推论都判不了空——非平凡、
    无残留平凡合取；弱式 P1 的共时臂(partial-φ)仍是可推翻的经验命题，
    未弱到撤稿。仅存措辞可调隐患，非阻断。
  independent_cell_recheck: |
    审查者不信作者自证，自己按 nontriviality_test 重做：DED-001 只谈 A 维、
    对 B 沉默；DED-002 只谈 B 维、对 A 沉默。P1 的禁格(a)"控规模后 A、B 独立"
    定义在 A、B 联合分布上——DED-001 单独判不了(对 B 无话)、DED-002 单独也
    判不了(对 A 无话)，【判空必须两父合力】→ 非平凡。与 P2 禁格是单父排除项
    子集(闲置白砖)形成清晰对照。残留平凡合取排查：三难那句"只添加一点"是
    指向 P1 的交叉引用、非第二份独立主张，无双重计数。结论：无残留平凡合取。
  weak_P1_falsifiability: |
    历时臂(i)近乎真理套话、独立证伪力≈0(作者自承弱式勉强存活)；共时臂(ii)
    partial-φ 是真可证伪命题——离对角案例(印加写行政不写规范、冰岛写规范不
    建官僚)若系统性存在会把 partial-φ 拉向 0 → P1 死。承重钉在共时臂，
    primary_suspect 亦指向 partial-φ。不触发撤稿标准，不判 rejected。
  non_blocking_improvements_applied:
    - "B 措辞：区分'专家【读取】中介(仍算 B)'与'专家【记忆】中介(不算 B)'，消除与'无论是否需专家中介'的字面张力。已在 DED-004 应用。"
    - "co_selection_test_P1 显式标注历时臂(i)为'近乎真理套话、不承重'，承重钉死共时臂 partial-φ。已在 DED-004 应用。"
  deferred_to_rule_c:
    - "counterexamples 仍为空——Rule C 落地时对印加(quipu 是否承载可检索规范, 需 Urton/Salomon 一手研究)与早期伊斯兰法两个准解耦案例做承重深查，别把'逻辑幸存'当'经验确认'。"
  effect: "DED-004 从 candidate 升 verified。状态天花板由 DED-001/DED-002(均 verified)钳定；任一父降级则依 confidence_floor 自动打旗重审。"

# === 元教训（本审查最有价值的产出，写回 METHODOLOGY rule_d） ===

meta_lesson:
  headline: "第一条交互型推论有三分之二是伪装的平凡合取，被 Rule D 反平凡合取声明 + 独立对抗审查精准抓住。"
  what_happened: |
    作者(主循环模型)自建 DED-004，自称 P1+P2+三难三重非平凡。作者离得太近，
    没看出 P2 的两个禁格里"碎片""扁平"是闲置合取项、每格由单一父推论判空。
    独立子 Agent 在不同上下文里做逐格分析，一眼看穿——这正是 Rule D
    file_structure 里"防平凡合取"当初存在的唯一理由。
  why_it_matters: |
    1. Rule D 的反平凡合取护栏【不是摆设】——它拦下了一条作者自我高估的推论。
    2. 印证 ICV 的核心诊断：作者自审是"相关错误"，看不见自己的盲区；独立源
       (哪怕只是不同上下文的同类模型)能抓到自审抓不到的结构性错误。
    3. 交互型推论(composite)的真伪判据被这次锤炼出来：
       【一个禁格的判空是否需要两条父推论合力？若任一格由单一父推论即可判空，
        该格不构成交互型的非平凡内容，是平凡合取。】此判据应固化进 Rule D。
  lesson_for_rule_d: |
    交互型推论的非平凡性检验(逐格判空归属)应成为 Rule B 审查交互型推论的
    强制项。作者自证不可信——交互型尤其要派独立审查者做逐格分析。

