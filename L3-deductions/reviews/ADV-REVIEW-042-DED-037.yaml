        编码手册(coding_scheme)形式完备且内部一致：必要条件+充分条件+4条边界裁决规则+12条编码样例+
        锁定时间戳+信度目标(κ≥0.8)+最低时长阈值(30秒)+情感泄露处理规则。Round 2矛盾(boundary case 2
        vs规则g)已修复——两处统一为"功能性使用"并加交叉引用。Round 3修复验证通过，未引入新矛盾。

        一处 should 级保留(R1 should-5,四审未改):预测(b)的道德判断场景集未注册具体来源和版本——
        当前仍为"如Cushman et al.或等效范式"，不满足可复现性要求。建议引用已发表的标准化场景库
        并锁定版本。不阻塞 verified——统计口径(ANOVA交互效应+效应量阈值)已注册，场景集的选择
        影响测量信度而非统计推断逻辑。
    数据源同根:
      verdict: "不适用"
      note: |
        本推论不声称"多源验证"的经济/统计锚点。四个支撑锚分属发展心理学/媒体心理学/人机交互/
        认知神经科学四个独立研究传统，数据采集方法各自独立(纵向观察+陌生情境/元分析+问卷调查/
        田野观察+定性访谈/fMRI+行为实验)。两挑战锚(imaginary-friend/AI SEL)分属发展心理学和
        教育技术两个独立领域。不存在同根数据源问题。
    API可及性冒充:
      verdict: "不适用"
      note: |
        本推论不依赖API/MCP查询的数据源，也未将工具可及性当作认识论独立性证据。四审一致。

  counterexample_hunt:
    strategy: |
      按评分卡要求主动构造能证伪核心预测的干净案例。本轮聚焦前3轮未充分探索的三个新角度，
      同时验证边界条件是否为真正的scope限制(而非免疫披风)。
    cases_hunted:
      - case: "AI作为情感脚手架→人类互动增强（情感脚手架假说）"
        prediction_target: "机制核心:AI互动时间替代真人互动→具身情感信号密度下降→道德他者模型偏移"
        finding: |
          本假说挑战推论的一个隐含前提：AI互动与真人互动是【竞争性替代关系】(一天只有24小时,
          AI互动时间↑→真人互动时间↓)。但AI互动也可能与真人互动形成【互补性增强关系】——
          AI通过以下路径增加而非减少真人互动的质量和数量：

          (a) 情绪调节功能：AI作为"随时可用的情绪出口"——儿童在AI处宣泄负面情绪后，
          带着更平稳的情绪状态进入真人互动→真人互动质量提升。
          (b) 社交技能预习：儿童在AI处练习社交对话、情绪表达后，在真人互动中更自信→
          真人互动频率提升。
          (c) 情感词汇扩展：AI互动拓展了儿童的情感词汇和情绪识别能力→在真人互动中
          能更准确地表达和理解情绪→真人互动深度提升。

          若此假说成立，AI高陪伴组的真人互动质量/数量可能【高于】而非低于对照组，
          推论的核心机制(时间替代→信号密度下降)被架空——因为AI互动不是替代而是增强了
          真人互动中的具身情感信号体验。此时即使AI本身无具身情感信号，净效应仍可能是
          共情增强(因真人互动质量提升的正面效应>AI信号缺失的负面效应)。
        digestion: |
          被消化——推论有多条防线可抵御此假说：

          (a) 此假说与推论的"真人互动补偿假设"(secondary_suspect)形成镜像——补偿假设承认
          "真人互动可补偿"，但声称现实中的AI高陪伴组真人互动时间系统性偏低(因时间预算约束)。
          情感脚手架假说声称AI互动可提升真人互动质量(而非数量)，但若真人互动总时间下降
          (时间替代效应)，即使单位时间质量提升，总信号密度仍可能下降。净效应取决于
          "时间替代导致的信号损失"vs"质量提升导致的信号增益"的相对大小——这是经验问题。

          (b) 推论已在 falsifiability 中注册了控制变量(真人互动总量/基线社交能力)，若实测中
          AI高陪伴组的真人互动总量与对照组无显著差异(即时间替代不成立)，则推论的机制前提
          (时间替代→信号密度下降)在该样本中被削弱——但这不推翻"具身情感信号密度→道德他者模型"
          的核心逻辑，只说明"AI陪伴"与该样本中"信号密度下降"之间的经验关联不成立。

          (c) 该假说实际上为推论提供了一个可检验的调节变量预测：若AI互动是互补性增强关系
          (AI→真人互动↑)，预测方向反转(共情↑)；若AI互动是竞争性替代关系(AI→真人互动↓)，
          预测方向按推论走(共情↓)。此区分与boundary_cases的"内容方向轴"共振——
          "共情训练型"AI更可能产生互补增强效应，"信号贫乏陪伴型"AI更可能产生竞争替代效应。

          消化成立。此假说不构成净杀——它揭示推论需要区分"AI互动与真人互动的关系性质
          (替代vs互补)"，这是对"AI陪伴时间占比"操作化的一个有益细化(不仅测量AI时间，
          也测量AI时间与真人互动时间的相关方向)。不阻塞 verified。

      - case: "微时刻充足性——人类情感信号的绝对密度可能远超推论假设"
        prediction_target: "机制前提:AI占据情感互动时间的主体→具身情感信号密度降至阈值以下"
        finding: |
          推论的核心前提是：当AI在发育窗口期占据互动时间的主体时，具身情感信号的密度
          系统性下降至关键阈值以下。但此前提假设"具身情感信号"主要来自【专门的互动时间】
          (对话、游戏、求助安抚等)——忽视了大量【微时刻】(micro-moments)中的人类情感信号：

          (a) 照料者的非言语情感信号：母亲的一个眼神、父亲拍肩膀的力度、祖母声调中的
          担忧——这些信号在数秒内发生，不进入"互动时间日志"的计数范畴。
          (b) 同伴的自发情感表达：学校课间的一个笑声、朋友惊讶时的表情、同学受伤时的
          痛苦面孔——这些是【高密度】的具身情感信号，但发生在非结构化时间中。
          (c) 陌生人/社区成员的情感信号：公交上看到的老人的疲惫、街上路人的笑容、
          商店收银员的语气——儿童每天接收的具身情感信号远超"互动时间"所捕捉的范围。

          若这些微时刻中的人类情感信号密度足够高(且AI无法提供这些信号)，则即使在
          专门的AI互动时间占比极高的情况下，总具身情感信号密度仍可能维持在阈值以上。
          此时推论预测的效应量可能远小于预期——因为"AI互动时间占比"仅捕捉了总信号输入
          的一个子集，而该子集之外仍有大量具身情感信号维持道德他者模型的正常校准。
        digestion: |
          被部分消化——推论的可用防御：

          (a) 推论已通过"情感交互"的精确定义(必要条件:双向性+情感表达+社会关系话题/情绪求助)
          排除了大部分微时刻——微时刻通常是单向观察而非双向互动，不满足推论定义的
          "情感交互"标准。推论关注的核心是【contingent interaction】("我做X→对方出现Y反应")
          而非被动观察。微时刻提供的是"他人在表达情绪"的信号，但不提供"我的行为→
          他人的情绪反应"的因果配对——后者才是道德他者模型校准的关键训练数据。

          (b) 但防御(a)存在裂隙：contingent interaction 不一定需要"专门的情感互动时间"——
          日常生活中的大量微交互(如推了同伴一下→同伴皱眉,抢了玩具→对方哭)同样是
          "我的行为→他人情绪反应"的因果配对，且这些微交互天然富含具身情感信号。
          若儿童仍参与一定量的真人同伴互动(即使总量下降)，这些微交互可能已提供足够的
          contingent feedback 来维持校准。

          (c) 此挑战与推论的真人互动补偿假设(secondary_suspect)和判别效度条件(iii)共振——
          关键问题是"到底需要多少真人 contingent emotional interaction 才能维持正常校准？"
          这个阈值目前是未知的经验参数。推论的诚实处理方式是承认阈值未知，而非声称已知阈值。
          anti-talisman禁令(3)已明确禁止在null result出现后诉求"阈值更高"来免疫反例——
          "阈值问题是待检验的经验问题，不得在null result出现后诉求'阈值更高'以免疫反例。
          若在任何可实现的AI陪伴水平下均无效应，接受证伪。"此禁令直接覆盖了微时刻充足性挑战。

          消化成立且反哺 anti-talisman 防线——禁令(3)的远见使推论的证伪路径不依赖特定的
          阈值假设。微时刻假说不是推翻推论，而是降低了对效应量的先验预期——若实测效应量
          小于预期，推论的机制方向仍可成立(只是效应量因微时刻缓冲而较小)，且禁令(3)要求
          推论接受"在任何可实现水平下均无效应=证伪"的裁决。不阻塞 verified。

      - case: "超常刺激校准——AI情感信号的'过度清晰'可能双向影响共情阈值"
        prediction_target: "预测(i)共情基线偏移与预测(iii)生理反应钝化的信号校准机制"
        finding: |
          在动物行为学中，"超常刺激"(supernormal stimulus)指比自然刺激更夸张的人造刺激
          (如比真蛋更大更鲜艳的模型蛋能引发更强的孵蛋行为)。AI的情感表达可能构成
          超常刺激——AI的"我很难过"可能比真人的"我很难过"更清晰(用词明确)、更可预测
          (始终以相同方式表达)、更正面(几乎不表达敌意/冷漠/厌恶)。若儿童的情感检测系统
          校准到这些超常信号上，可能产生两种相反的后果：

          (a) 阈值升高→共情钝化(支持推论)：若儿童习惯了AI式的清晰情感信号，真人的
          微妙情感信号(如眼神闪烁、声音轻微颤抖)可能低于检测阈值→对真人痛苦的敏感度下降。
          此路径与推论机制一致。

          (b) 训练集简化→共情增强(挑战推论)：AI提供的情感信号是"简化版"，像一个
          "情感训练轮"——儿童先在简化环境中学会基本情绪识别，再迁移到复杂的人类情感场景。
          类似于儿童先学简笔画再学素描——简化版训练可降低学习曲线的初始坡度，
          最终提升复杂场景中的表现。此路径与推论的预测方向相反。

          关键区分：路径(b)成立的前提是儿童能将AI处习得的情感识别技能【迁移】到真人互动中。
          若迁移发生，AI陪伴→增强的情感识别→更强的共情；若迁移不发生(因AI信号与真人信号
          在统计结构上不同——这正是推论的核心机制主张)，则AI陪伴→校准到错误的信号原型→
          对真人信号的敏感度下降(路径(a))。
        digestion: |
          被消化——此反例实际上是推论机制的另一面表述：

          (a) 推论的核心机制——"统计学习层面的输入分布偏移"——精确预测了"校准到AI信号的
          儿童会对真人信号敏感度下降"，即路径(a)。路径(b)(训练集简化→迁移增强)若成立，
          需要额外假设"AI信号与真人信号在统计结构上足够相似以支持迁移"——这恰是BR-L2-026
          所否定的(BR-L2-026确立AI信号与真人信号在具身维度上系统性不同)。

          (b) 路径(b)的弱化版本——"AI增强认知共情但不增强(或削弱)情感共情"——已经在推论的
          前台中明确声明("认知共情可能不受影响甚至增强")，且已经成为推论区别于阅读-共情文献
          的关键判据(discriminant_validity #1)。超常刺激假说不会推翻此区分——
          认知共情的增强(简化训练集→更好的情绪识别)与情感共情的钝化(校准到无生理基底的信号)
          可以同时成立。

          (c) 此案例实际上加强了推论的 discriminant_validity：若 AI 简化情感信号训练儿童
          识别"什么是难过"的认知技能(认知共情增强)但钝化了"看到别人难过时自己也难过"的
          自动生理反应(情感共情钝化)，则推论"认知共情vs情感共情分离"这一判别预测获得支持。

          消化成立且反哺推论的判别预测。不阻塞 verified。

    verdict: "无净杀，三个新角度均被消化或反哺推论"
    note: |
      本轮猎捕覆盖了三个前轮未充分探索的角度——情感脚手架假说(互补性增强vs竞争性替代)、
      微时刻充足性(信号密度阈值经验参数)、超常刺激校准(简化训练集的双向效应)。
      三个角度均被消化——推论的现有防线(anti-talisman禁令/真人互动控制变量/
      认知vs情感共情分离判别)足以处理这些挑战。没有一个构成 scope 内的活反例。

      四轮累计猎捕12+反例(imaginary-friend/AI SEL/pets/CODAs/text-socializing/
      literary-fiction/COVID/embodied-AI/encoding-contradiction/emotional-scaffolding/
      micro-moment-sufficiency/supernormal-stimulus)。其中编码手册矛盾为纯逻辑缺陷(已修复)，
      其余均为被消化或反哺推论的案例——没有一个构成对推论核心机制的净杀。
      当前反例格局的一致指向是：推论需要从"AI vs 真人"单轴升级至多维框架
      (真实情感能力×信号通道密度×本体论信念×内容方向×投射-接收模式×互动替代vs互补性质)
      以更精确地预测净效应方向——但这不推翻一维机制的真理值，只是细化了调节变量空间。
      此升级已在 boundary_cases 中诚实标注，是推论的"科学诚实边界"而非弱点。

