  counterexample_hunt:
    strategy: |
      按评分卡要求主动构造能证伪核心预测的干净案例。本轮重点猎取 round 1 未覆盖的反例空间：
      (1) AI互动内容的正向训练效应（AI作为共情教练而非共情黑洞）；
      (2) 真人互动中的"信号贫乏"场景（削弱"真人=具身信号充足"的默认假设）；
      (3) 编码手册矛盾在实际编码中的表现——若一名编码者按 boundary case 2 编码、
      另一名按情感泄露规则(g)编码，同一段交互记录的编码分歧率。
    cases_hunted:
      - case: "AI Social-Emotional Learning (SEL) 工具——AI作为共情训练师的反向效应"
        prediction_target: "(i) 共情基线偏移——核心预测：AI情感互动→情感共情下降"
        finding: |
          2025-2026年市场上已出现多款面向儿童的AI SEL（社会情感学习）工具和AI陪伴产品，
          其设计目标明确包括：教儿童识别面部表情中的情绪、通过角色扮演练习社会场景
          （"你的朋友哭了，你应该说什么？"）、提供情绪调节策略（"生气时可以深呼吸数到十"）、
          以及通过对话引导儿童反思自己的情绪和行为对他人的影响。

          这些AI互动具有以下特征：
          - 在编码手册中会被编码为「情感交互」（含情绪词汇、社会关系话题、双向互动、
          涉及情绪识别和共情训练内容）
          - AI系统性地输出情感教育内容——不是"无情感信号"，而是"丰富的、有教学设计的
          情感信号"（尽管这些信号仍然缺乏生理基底——符合BR-L2-026的具身缺失）
          - 互动模式与推论假设的"被动接收AI的无/贫乏情感信号"截然不同——
          AI主动引导儿童关注和练习情感识别与共情表达

          若推论机制正确，则AI SEL工具的高频使用应导致情感共情下降（因为AI仍无具身情感反馈，
          统计学习仍从"无生理基底的情感信号"中提取道德他者原型）。但SEL研究和教育实践
          一致预测：结构化的情感学习干预应增强（而非削弱）共情能力。

          此案例揭示了推论的一个结构盲区：推论将"AI情感互动"视为单一同质类别，
          但AI情感互动的【内容方向】（训练共情 vs 仅提供陪伴 vs 被动接收情绪宣泄）
          可能产生方向相反的效果。当前机制（统计学习从输入分布提取道德他者原型）无法区分
          "AI教你共情"与"AI漠不关心"——因为两者在"具身情感反馈缺失"维度上相同，
          但在"认知共情训练密度"维度上截然不同。
        digestion: |
          半杀——不能完全消化，揭示推论需要一条新的调节变量或边界条件。

          推论的可用防御：
          (a) 推论预测的是情感共情（empathic concern + personal distress）下降，
          而SEL工具主要训练认知共情（情绪识别、观点采择）——两者在神经基础上分离。
          推论已在前台声明"认知共情可能不受影响甚至增强"。若SEL工具仅增强认知共情
          而情感共情确如预测下降，则推论机制成立且SEL工具不构成反例。

          (b) SEL工具的情感教学内容仍是"模拟信号"——AI说"朋友哭了应该安慰他"
          时自身并无真实的悲伤体验（无生理基底）。按推论机制，儿童从这些互动中
          习得的仍是"情感表达可以没有生理基底"的统计规律。

          防御(b)存在裂隙：若SEL工具的训练使儿童在认知层面更好地识别和理解他人情绪，
          这种认知增强可能对情感共情产生自上而下的促进作用（认知评价→情绪反应）。
          即使AI的情感信号无生理基底，儿童在SEL互动中反复练习"识别情绪→思考应对"
          的认知路径，可能增强而非削弱情感共情——这是认知-情感交互的经典发现
          (Lazarus, 1991; Gross, 2015)。

          消化结论：此反例不是净杀——推论有可用防御且防御在原理上成立。但它是坚实的半杀——
          它揭示推论需要区分AI情感互动的【内容方向】（情感训练型 vs 情感漠然型 vs 情感宣泄型），
          并诚实声明：当前机制的预测对"情感训练型AI互动"的适用性不确定，因为认知共情训练
          可能通过自上而下路径补偿甚至反转情感共情的下降。此发现与 round 1 的 should-3
          （投射vs接收区分）共振但不同——should-3 关注儿童的 stance，此反例关注 AI 的 content。
          两者共同指向推论需要一个二维分类框架（儿童stance × AI content）来细化预测方向。

      - case: "编码手册矛盾实证——同一交互的双重编码测试"
        prediction_target: "编码手册的预注册可靠性——非针对推论预测本身，而是其可检验性前提"
        finding: |
          构造一条交互记录："儿童：我今天在学校很难过。AI：建议你深呼吸，试着放松一下。"

          按 boundary case 2（line 62-63）：儿童单方面情感倾诉+"我难过"+AI"建议你深呼吸"
          → 编码为「情感交互」

          按情感泄露规则(g)（line 93）：儿童泄露真实情感+AI仅给出工具性回应("建议你深呼吸")
          → 编码为「功能性使用」

          两条规则均直接适用此场景，但裁决方向相反。

          若将此交互记录交给两名独立编码者（不告知研究假设），编码者A引用boundary case 2
          编为情感交互，编码者B引用规则(g)编为功能性使用——Cohen's κ 在此条上为 -1.0
          （完全分歧）。即使整体 κ 因其他条目的非矛盾编码而 >0.8，此矛盾条目仍构成
          系统性测量误差——它意味着存在一类"合法争议"的交互，其编码取决于规则选择而非
          交互本身的性质。
        digestion: |
          净杀——对编码手册的可靠性而言。这不是推论理论的净杀（机制可能仍然正确），
          而是推论【可检验性】的净杀——若主自变量的测量工具内部矛盾，
          则 falsifiability(a)(b)(c) 三条路线的统计检验均建立在不可靠的分类基础上。

          防御空间：不存在防御——编码手册的内部矛盾是纯逻辑问题，
          只能通过修改编码手册（统一两处规则）来修复。修复后此反例自动消解。

      - case: "真人互动中的信号贫乏——'真人=具身信号充足'假设的边界测试"
        prediction_target: "机制前提：真人互动天然提供充足的具身情感信号"
        finding: |
          推论的机制隐含假设：真人互动→具身情感信号密度充足→道德他者模型正常校准。
          但以下真人互动场景的情感信号密度可能低于某些AI互动：

          (a) 抑郁母亲与婴儿的互动——母亲的 flat affect（情感扁平化）、减少的眼神接触、
          降低的声音韵律变化，导致婴儿接收到的具身情感信号密度系统性下降。
          发展心理学文献（Tronick still-face paradigm; Field et al.）已证实此效应。

          (b) 制度化养育（孤儿院）中多名儿童对一名照料者的场景——照料者因资源限制
          无法对每个儿童提供contingent emotional responding，情感信号密度被稀释。

          (c) 某些文化中的情感表达抑制——在强调情绪克制（如日本/某些东亚文化）的
          养育实践中，照料者有意减少外显的情感表达，具身情感信号密度低于
          情感表达鼓励型文化。

          这些场景中，真人互动的具身情感信号密度可能实际上低于一个设计良好的
          AI SEL工具（后者至少提供明确的情感词汇、表情识别训练和情绪讨论）。

          若在"真人互动但信号贫乏"场景中观察到道德他者模型偏移（与推论预测的
          AI高陪伴组类似），则驱动因素可能不是"互动对象是人类还是AI"，
          而是"互动中具身情感信号的实际密度"——这将削弱推论关于AI特殊性的声称，
          但同时验证推论的核心机制（信号密度→模型偏移）。
        digestion: |
          被消化——此案例实际上【支持】推论的机制核心（具身情感信号密度是关键驱动因素），
          但【削弱】推论对AI-vs-真人的二分框架。若信号密度是真正的自变量，
          则"AI陪伴"只是一个（当前特别突出的）信号贫乏场景的实例，
          而非一个存在论上独特的类别。推论需诚实声明：
          其预测可能适用于任何"具身情感信号贫乏的互动对象"（包括某些真人互动场景），
          而非AI所独有。这不是推论的弱点——它表明推论的机制具备更广泛的解释力——
          但需要调整 framing：从"AI的特殊性"转向"互动对象信号剖面的效应"。

          消化成立——此反例反哺推论的机制深度而非削弱之。

    verdict: "无净杀推论理论本身，但一条净杀编码手册可靠性，两条半杀揭示调节变量盲区"
    note: |
      编码手册矛盾(boundary case 2 vs 情感泄露规则)是纯逻辑缺陷，不涉及经验判断——
      同一场景两条规则给相反裁决，编码手册的预注册功能被架空。此缺陷直接阻挡 verified：
      主自变量的测量工具不可靠→三条 falsifiability 路线的统计检验基础动摇。

      AI SEL 工具反例是新的半杀，揭示推论需区分AI情感互动的【内容方向】
      （训练型 vs 陪伴型 vs 宣泄型），当前单一机制无法处理此维度。
      此发现与 round 1 的 should-3（投射vs接收）共振，共同指向推论需要一个
      二维分类框架而非当前的一维机制。

      真人互动信号贫乏案例被消化且反哺机制——它表明推论的核心洞见
      （具身情感信号密度→道德他者模型）可能比AI特异性更广泛，这是推论的潜力而非弱点。

