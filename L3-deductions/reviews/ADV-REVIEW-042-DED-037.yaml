    推论接受审查——审查的是残缺版本，通过的推论也是残缺的。修复：补齐全部截断内容，确保文件语义完整。

    此外，自 round 1 以来累计 11 条 should 修复（R1×6 + R2×5）均未实施。虽按审查纪律不重复扣分，
    但累积存在削弱了对推论的坚固性信心。其中 R1 should-3（投射vs接收调节变量）与 R2 should-1
    （AI内容方向维度）共振最强——两者共同指向推论需要一个二维分类框架而当前仍为一维机制。
    R2 should-3/4（补全 real_world_anchors + 修复截断）与本次 required-1 直接重叠——
    若文件补齐，这两条 should 自动消解。

