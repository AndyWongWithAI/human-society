  counterexample_hunt:
    strategy: |
      按评分卡要求主动构造能证伪核心预测的干净案例。本轮聚焦 round 1/2 未充分覆盖的反例空间，
      重点检验：(1)非人类但具真实情感的互动伙伴（宠物的中间信号密度→净效应方向？）；
      (2)特定信号通道缺失但其他通道正常的场景（CODAs→渠道独立充足性？）；
      (3)低信号密度但已知对方为真人的场景（青少年texting→信念vs信号密度的相对权重？）。
    cases_hunted:
      - case: "宠物陪伴与共情增强——非人类但具真实情感的互动伙伴"
        prediction_target: "(i) 共情基线偏移——核心预测：非人类互动伙伴占据情感互动时间→共情下降？"
        finding: |
          多项元分析和纵向研究报告：养宠儿童（尤其与狗建立亲密关系的儿童）在共情、观点采择、
          亲社会行为等维度上系统性地【高于】无宠对照组（Daly & Morton, 2006; Purewal et al., 2017;
          Hawkins & Williams, 2017）。宠物提供的情感信号密度介于AI与人类之间：
          有真实情绪（狗的快乐/恐惧/焦虑有生理基底——皮质醇、心率、行为表现）、
          有具身信号（舔舐、摇尾、依偎提供触觉/温度/压力反馈）、
          有 contingent emotional responding（狗会因主人哭泣而焦虑、会因主人生气而退缩）——
          但缺乏人类级别的情感粒度（狗无法做道德判断、无法表达"内疚"的认知层面、
          无法进行意图推理）。

          按推论机制：若道德他者模型由信号密度驱动，宠物陪伴（中等信号密度）应产生中等效应
          （共情下降但幅度小于AI陪伴）。但实证方向相反——宠物陪伴与共情【增强】相关。
        digestion: |
          被部分消化——推论的可用防御：
          (a) 关键变量不是"人类vs非人类"而是"是否有真实情感状态"。
          宠物有真实情感状态（可被生理测量证实），AI没有（BR-L2-026的(i)真实情感缺失）。
          推论的机制核心——具身情感信号密度——应该指定"真实情感"的信号密度。
          宠物虽有不同表达形式但信号是【真实】的；AI的信号是模拟的。
          (b) 宠物的contingent responding是双向的——儿童学会"我温柔→狗信任我"、
          "我粗暴→狗害怕/躲避"——这恰是推论声称AI互动中缺失的"我做X→对方出现Y反应"
          的差异化反馈。宠物提供的是【真实的差异化情感反馈】，AI提供的是【模拟的同质化反馈】。

          消化成立但揭示了推论 framing 的一个松动处：推论当前在多个位置使用"AI vs 真人"的
          二分框架，但机制的真正驱动变量可能是"互动对象是否具备真实情感状态 + 反馈的差异化程度"。
          宠物案例显示：非人类但具真实情感→共情增强（方向反转）。
          这与 imaginary-friend 案例（非真实但儿童投射情感→共情增强）共享一个深层洞见：
          推论需要从"AI/非AI"二分转向"互动对象的情感真实性剖面"多维框架。
          这不是对推论的净杀——它验证了"情感反馈的真实性"是关键变量的方向正确性——
          但揭示推论当前对"AI"的单一归类过于粗糙。

          半杀——揭示机制需从"AI vs 真人"细化至"真实情感vs模拟情感×信号密度×差异化反馈"的多维空间。

      - case: "聋人父母的听人子女(CODAs)——特定信号通道缺失但其他通道正常"
        prediction_target: "机制前提：多通道具身情感信号的缺失会导致道德他者模型校准偏差"
        finding: |
          CODAs（Children of Deaf Adults）在发育窗口期接收到的听觉情感信号（声音语调、哭声、
          叹气声）密度系统性低于听人父母子女。但视觉-触觉情感信号（面部表情、身体姿态、
          拥抱、抚摸）密度正常或增高（CODAs 常报告父母使用更夸张的面部表情和身体接触补偿
          听觉通道的缺失）。发展心理学研究一致报告 CODAs 在共情、心理理论、道德判断等
          维度上与听人家庭子女无显著差异（Singleton & Tittle, 2000; Preston, 1995;
          Singleton & Morgan, 2006）。

          若任何单一通道的缺失就足以造成道德他者模型偏移，CODAs 应在听觉情感信号维度上
          表现出偏移——但他们没有。这说明多通道中的单个/部分通道缺失【不足够】触发效应。
        digestion: |
          被消化——此案例实际上【支持】推论的阈值逻辑。推论声称的是：当具身情感信号的
          【总密度】系统性下降至关键阈值以下时，道德他者模型才发生可观测偏移。
          CODAs 的听觉信号缺失但视觉-触觉信号充足→总信号密度仍在阈值以上→无偏移。
          这是推论的【正向预测】：只有当多通道信号同时系统缺失（如AI——无真实面部表情、
          无真实声音情感韵律、无触觉、无生理信号），密度才降至阈值以下。

          消化成立且反哺推论——CODAs 案例为推论提供了一个"剂量-反应"的锚定：
          缺失1-2个通道（听觉）=无效应；缺失全部通道（AI）=预测有效应。
          这使推论的阈值概念获得可检验的梯度——可在未来研究中显式测量"互动对象的
          具身情感信号通道数"并检验剂量-反应关系。

          一条建议（should 级）：在 real_world_anchors 中新增此案例为 supporting 锚——
          它不是推论直证，但为"信号通道密度→道德他者模型偏移"的剂量-反应逻辑
          提供了一个跨通道缺失的对照点。

      - case: "青少年纯文本社交——低信号密度但已知对方为真人"
        prediction_target: "机制核心：信号密度（而非互动对象本体论信念）是驱动因素"
        finding: |
          当代青少年的同伴关系中，文本消息（SMS/微信/Discord）占情感互动时间的比例持续攀升。
          文本互动缺失了语音韵律、面部表情、身体语言、触觉等几乎所有具身情感信号通道——
          仅保留语义内容和少量副语言标记（emoji、标点、大小写）。按推论机制，
          若信号密度是关键驱动因素，以文本为主的青少年情感互动应导致道德他者模型偏移。

          然而，现有发展心理学文献不支持"texting-native一代共情系统性下降"的结论。
          相反，多项研究表明：文本互动（尤其与已知同伴）可支持情感亲密感的建立和维持
          （Valkenburg & Peter, 2009; Lenhart et al., 2015），青少年常【偏好】文本
          进行情绪披露（因去除了面对面交流的某些社会压力）。

          关键区分：文本互动同伴是【真实的、已知的】人——儿童/青少年知道对方有真实情感。
          他们可能通过 mental simulation 在阅读文本时"补全"缺失的情感信号
          （与阅读小说的 cognitive empathy 机制相似——这正是推论前台已承认的
          "认知共情可能不受影响甚至增强"）。
        digestion: |
          被部分消化——推论的可用防御：
          (a) 文本互动通常是【补充性】而非【替代性】的——texting-native青少年仍有大量
          面对面互动（学校、家庭、课外活动），总信号密度仍在阈值以上。AI陪伴场景的关键
          不同在于AI可能是【替代性】的——AI保姆/AI教师在儿童醒着的大部分时间里
          替代了真人互动。
          (b) 文本互动同伴是真实人类→儿童可以用自身的"人类情感模型"补全缺失信号。
          AI互动对象没有真实情感→无模型可补全——认知层面的"我知道ta不会真的难过"
          可能阻止了 mental simulation 的启动。

          消化成立但揭示推论的【关键调节变量候选】：儿童对互动对象的"本体论信念"
          （我相信ta有真实情感吗？）可能比"信号密度"本身更基础——若儿童相信AI有情感
          （如Turkle田野观察中儿童对机器人产生情感依恋），他们可能主动补全缺失信号；
          若儿童不相信AI有情感（范畴隔离成立），信号密度无论高低都不影响道德他者模型
          （因AI根本不在"道德他者"范畴内）。此调节变量与 round 1 primary_suspect
          的范畴隔离假设高度共振。

