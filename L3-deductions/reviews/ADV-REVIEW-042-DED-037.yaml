  should_fixes:
    - "【should-1（四审累积）】预测(b)道德判断场景集注册具体来源和版本。当前仍为'如Cushman et al.或等效范式'——四轮审查持续标记，不满足可复现性要求。建议引用已发表的标准化场景库(如Cushman et al., 2006; Young et al., 2007; Barrett et al., 2016)并锁定版本，或提供本推论专用场景文本(附录形式)。"
    - "【should-2（四审累积）】在 operationalization 的 limitations 中诚实标注选择效应威胁：高AI家庭在父母共情水平/养育风格/家庭情感氛围/父母屏幕时间等维度上与低AI家庭可能系统性不同。横截面设计中的统计控制(SES/年龄/语言)不足以消除选择效应，需要纵向设计+家庭固定效应或工具变量。"
    - "【should-3（四审累积）】在 primary_suspect 中追加方向歧义的交叉引用。AI'永远正面/永不伤害/无限耐心'的特征可能将道德他者模型朝更积极方向偏移——当前仅通过 boundary_cases 条件1-3间接覆盖。建议在 primary_suspect 末追加一行：'关于预测方向在特定条件下(投射型互动/共情训练型内容/高信念)可能反转的讨论，见 boundary_cases 条件1-3。'"
    - "【should-4（四审累积）】boundary_cases 条件1(投射-接收轴)与条件2(内容方向轴)的状态标记为'推论当前版本未内置此区分'——这是诚实的自我批评，但若未来版本将此两轴内置为前置调节变量，推论的预测精度将显著提升。建议在下一版本中将此两轴从'边界条件'升级为'调节变量'并纳入统计模型(如AI陪伴时间比×投射程度×内容方向的交互项)。"
    - "【should-5（新增）】在 operationalization 的 limitations 或 anti-talisman 旁注中诚实标注'保守编码→IV变异压缩'风险。编码手册选择了保守方向(边界案例→功能性使用)，这可能导致AI情感互动时间系统性低估→IV变异不足→效应更难检测→null result可能被误读为推论被证伪而非IV测量过保守。此为所有内容编码研究的共享挑战，但坦诚标注增强推论的自我诚实度。"
    - "【should-6（新增）】考虑纳入 CODAs 案例作为 supplementary 锚点。CODAs(特定信号通道缺失但其他通道正常→无道德模型偏移)为推论的'剂量-反应'阈值逻辑提供了通道级对照点——缺失部分通道(听觉)≠缺失全部通道(AI)，前者在阈值以上、后者在阈值以下。这是对推论可检验性的增强(显式预测'信号通道数与效应的剂量-反应关系')。"

