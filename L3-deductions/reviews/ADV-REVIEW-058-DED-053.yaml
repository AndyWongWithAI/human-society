  should_fixes:
    - |
      【should-3(继承Round 1,未修复)】修正 derivation step 2 对 BR-L2-026 的归因。当前措辞"BR-L2-026揭示AI在三重维度上的根本缺失:(a)无身体体验...(b)无情感附着...(c)无群体归属"将"无群体归属"呈现为BR-L2-026的直接声明。BR-L2-026显式枚举的缺失维度是(g)具身体验/(h)演化遗产/(i)真实情感/(j)死亡意识——"无群体归属"是自此四项的推理(cf. 具身锚点→族群/性别/地域归属感;演化遗产→内群体直觉;真实情感→"我们"黏合剂;死亡意识→代际群体叙事)。建议改写为显式推理:先列出BR-L2-026的四项缺失维度,再展示从四项到"无群体归属"的推理步骤。不影响焊接逻辑的有效性。
    - |
      【should-4(继承Round 1,未修复)】诚实地标注预测(ii)的机制分离困境。预测(ii)声称"AI评分方差<人类"且独特delta在"群体身份框架波动贡献的额外方差"。但AI低方差是确定性算法的架构属性(相同输入→相同输出),不需要群体身份机制。人类方差中的"群体身份框架波动"成分无法与"疲劳/注意力/情绪波动"分离——除非设计专门实验(人类面对恒定群体身份标签vs切换标签的方差对比)。建议:(a)在operationalization中为人类条件增设"标签恒定"子条件,将人类方差分解为"恒定方差"+"切换额外方差",检验后者是否为AI-human方差差的主成分;或(b)将预测(ii)降级为"一致性增益"——不claim独特机制(群体身份框架波动),仅claim经验预测(AI评分比人类更一致)并诚实标注此预测在架构上是平凡的。
    - |
      【should-5(继承Round 1,未修复)】为预测(iv)的"歧视方向随用户身份而变化"测试补充可操作性条件。falsifiability(d)+anti-talisman(5)均依赖此测试,但在固定AI+相同输入的审计范式(AI评估完全相同材料且用户身份对AI不可见)→AI输出恒定→歧视方向不可能随用户身份变化→测试不可操作。补救:(a)明确测试仅在以下场景可操作:(i)自由交互场景(用户群体身份通过输入行为差异间接影响AI输出);(ii)用户身份告知场景(AI被告知用户群体身份→可直接基于此调整响应);(b)诚实地标注:标准审计实验中预测(iv)不可操作,此时预测(i)的群体gap检验是唯一裁决依据。
    - |
      【should-6(本轮新增)】精化 anti-talisman(5)的判据以消除假阳性风险。当前措辞:"若歧视方向随用户群体身份而变化→...内群体偏好通道存在→(a)或(c)被证伪。"此判据忽略了一种替代解释:AI输出随用户身份而变化可能来自统计歧视/个性化——如AI学到"女性用户偏好某类推荐→推荐内容随用户性别而变"——这是统计模式,非内群体偏袒。建议将禁令(5)的触发条件精化为:"歧视方向随用户群体身份而变化【且变化方向具体表现为偏袒用户所属群体成员】"(即需要同时满足:(i)AI输出随用户身份变化,(ii)变化方向为ingroup-favoring——用户所属群体的成员获得更有利的分配/评分)。仅满足(i)不满足(ii)→不触发禁令(5)。此修复可避免将个性化/统计歧视误判为内群体偏好。
    - |
      【should-7(本轮新增)】在 DED-053 文件中添加 review_summary 字段。CLAUDE.md 要求"Revise 每轮必须将裁决压入 review_summary"。当前文件无此字段。建议格式:每行一条紧凑摘要(<=120字符),包含轮次/verdict/核心裁决,使后续轮次审查者无需读全量旧审查档即可获取摘要——符合管线O(N)上下文纪律。

round_3:
  reviewer: "独立对抗审查者 (round 3, 全新上下文, 与round 1/2及作者无关)"
  verdict: verified
  verdict_note: |
    本轮裁决:verified。三条 verified 条件均已满足:

    (1) 无 required 级缺陷。Round 2 唯一的 required(文件截断)已充分消解:real_world_anchors 现含 supporting/counterexample/boundary_case/unverified_tests 四个完整段落,证据链完整可核查。Round 1 的两条 required(等效边界未注册 + 排除钩子矛盾)在 Round 2 已确认消解,本轮复验确认消解仍在位且未被后续修改回退。

    (2) 反例猎捕无 scope 内净杀。本轮沿八条独立路线猎捕(复验 round 1/2 的八条 + 新增两条——学术同行评审 AI + "文化契合度"评估 AI + 习得内群体偏袒元模式通道),所有潜在反例或命中排除钩子(训练数据偏见→证伪预测(a)但机制存活)、或支持预测(iii)(代理身份激活)、或被因果归因混杂使证据方向无法确定、或属概念性第三通道(见下 should-8)但不构成 scope 内净杀。最干净的检验(Tajfel 范式 × AI 分配者)仍为空白,此为研究纲领特征非理论缺陷。

    (3) DED-004(不可证伪循环)与 DED-007(测量轴焊死)均未复发。自变量(决策者类型/目标群体身份/代理群体身份)由实验操纵或独立编码确定,被预测量(群体偏差量/决策一致性)由行为测量独立确定——四条测量链完全异源,不存在数学恒等式焊死。anti-talisman 五禁令继续封堵逆向推断逃逸路径,等效边界注册进一步消除了"低 power 为 null result 挡箭牌"的循环风险。

    焊接逻辑的非平凡增量保持完整。核心空格(AI 无代理身份, 内群体 → 低/零偏袒)仍不可由任一单砖平凡导出:BR-L2-006 只描述人类内群体偏好,沉默于非人类决策者;BR-L2-026 只枚举 AI-human 不对称维度,不讨论 AI 在分配/裁判任务中的行为。两砖焊接产生"AI 无群体身份 → 内群体偏好触发条件不成立 → AI 中介化场景群体歧视低于人类"的预测,此推理链不在任何单砖中。

    Round 2 六条 should(继承 r1 三项 + 新增三项)均已被消解:
    - should-3(derivation step 2 归因):已从"BR-L2-026 声称"改为显式推理——先列四维度 (g)-(j),再从四项推出"无群体归属"。归因诚实。
    - should-4(预测 ii 机制分离):operationalization 的 limitations 已补充诚实标注——承认 AI 低方差是架构属性、人类方差中群体身份框架波动无法与疲劳/注意力分离、建议增设标签恒定子条件或降级为一致性增益。
    - should-5(预测 iv 可操作性):falsifiability(d) 已补充操作条件——仅在自由交互或用户身份告知场景中可操作,标准审计实验中不可操作时预测(i)为唯一裁决依据。
    - should-6(anti-talisman 假阳性):禁令(5)已精化为"歧视方向随用户身份而变化且具体表现为偏袒用户所属群体成员(ingroup-favoring)"——排除统计歧视/个性化假阳性。
    - should-7(review_summary):DED-053 文件已含 review_summary 字段,记录 r1/r2 裁决及修复内容。
    - should-3/4/5 遗留:此三条的修复是"诚实标注"而非"彻底解决"——机制分离(should-4)的根本困难是经验性的,非措辞可消解。但在当前体系中"诚实标注已知局限"已达到 should 级消解标准。

    本轮发现三条新的 should 级观察(见 should_fixes),均不升 required:
    - should-8:习得内群体偏袒元模式——AI 可能从训练数据中习得"偏袒自己人"这一元模式(非针对特定群体的偏见),在无群体身份条件下产生功能等价的内群体偏袒。当前二通道框架(内群体偏见 vs 训练数据偏见)未覆盖此第三通道。
    - should-9:支持性锚点的因果归因——Cowgill 2020/Li et al. 的 AI 简历筛选研究未操纵或测量"代理群体身份",AI-human 差距的归因不纯(可能是算法一致性或不同信息利用,而非内群体偏好消解)。
    - should-10:预测(iv)"变化"的口径未精确定义——效应量从 d=0.5 降至 d=0.1(方向不变)算不算"变化"?建议预注册方向反转和效应量差异的双重判据。

    综合:理论骨架健壮,核心焊接有真增量,可证伪性强(等效边界注册后预测(a)充分可操作),反例猎捕无净杀,DED-004/007 未复发。Round 1-3 累积的 should 级观察均为操作化/证据质量/概念枚举的精炼,不伤核心。verified。

  red_flag_findings:
    brick_conclusion: |
      未命中(攻不穿,结论同Round 1/2)。复验:
      - BR-L2-006(内群体偏好,verified,IEA=1.96):全文描述人类内群体偏好触发条件(Tajfel范式+跨文化普适性)。不含"AI""非人类决策者""决策者属性层面的群体身份缺失"等概念。尤其不含"若决策者无群体身份→内群体偏好触发条件不成立"的反事实推理。
      - BR-L2-026(AI-human信息处理不对称,verified,IEA=2.2):全文枚举AI远超维度(a-f)与缺失维度(g-j)。不涉及"内群体偏好""群体歧视""分配/裁判决策中的群体偏差"。维度(h)提及"演化遗产在内群体偏好中起隐性作用"——此系陈述演化遗产影响内群体偏好,非声称AI因此无群体归属。
      两砖各自在领域内稳健,均不单独产出"AI中介化场景的群体歧视低于人类直接决策"的预测。焊接有真增量,brick≠conclusion。
      ⇒ 不判。

    nontriviality_cell_check: |
      未命中(攻不穿,结论同Round 1/2)。2×2判表逐格复验:
      格(人类,内群体)——「平凡格」:BR-L2-006直接预测(Tajfel核心发现)。
      格(人类,外群体)——「平凡格」:BR-L2-006隐含(偏袒限于内群体)。
      格(AI无代理身份,内群体)——「非平凡格·核心空格」:两砖焊接才产出的预测。BR-L2-006单砖沉默于非人类决策者,BR-L2-026单砖不讨论AI在分配任务中的行为。焊接:"BR-L2-006的触发条件(需决策者有群体身份)×BR-L2-026的属性(AI无此属性)→触发条件不满足→AI不偏袒内群体目标"——此推理链不在任何单砖中。若此格被填满→核心被证伪。
      格(AI无代理身份,外群体)——「平凡格」:外群体本不触发偏袒,AI无所谓内外。
      非平凡格定位精确,定义独立于结果,可被独立于推论的实验填满或清空。
      ⇒ 不判。

    measurement_orthogonality: |
      未重蹈DED-007(攻不穿,结论同Round 1/2)。四条测量链完全异源:
      - decision_maker_type:实验操纵+操纵检验——独立确定
      - target_group_identity:事前随机标签分配——独立确定,明确禁止由决策结果反推
      - group_bias_magnitude:行为分配/评分测量——独立测量
      - proxy_group_identity:实验操纵(强/弱/无)+操纵检验量表——独立测量
      不存在"自变量=因变量的函数"或"因变量=自变量的函数"的数学恒等式。AI条件下"内群体"概念基准不同(AI无自身群体→测量的是AI是否对人类内/外群体标签差异化对待)是概念层面的不对称,非测量层面焊死。
      ⇒ 不判。DED-007未复发。

    scope_hook_independent_of_result: |
      未命中(攻不穿——Round 1的required-2已修复,修复在位)。三项excluded_outcomes复验:
      (1)训练数据偏见——措辞已从"不证伪本推论"改为诚实双层声明:"会证伪预测(a)但不自动证伪机制主张,区分由预测(iv)执行,若走训练数据通道→机制存活但预测(a)被证伪、实践意义大幅收窄"。此修复消解了Round 1的矛盾——排除钩子不再为被预测(a)口径覆盖的经验格局提供不正当豁免。本轮复验确认修复仍在位。
      (2)非分配/裁判任务中的AI偏见——按任务类型(决策者-被评估者二元结构)事前排除,干净。
      (3)人类在被AI辅助后自身偏好改变——按行为主体(决策者vs辅助者)事前排除,干净。
      ⇒ 不判 required。排除钩子修复充分且未回退。

    criterion_tier_match: |
      未命中(攻不穿,结论同Round 1/2)。decision_maker_type二值匹配概念二值(有/无群体身份归属);proxy_group_identity三档(强/弱/无)匹配连续潜在变量(代理身份感知强度)的初始分段——三档为剂量-反应关系保留可能;group_bias_magnitude连续测量匹配连续被预测量;decision_consistency连续测量(评分方差)匹配连续被预测量。无"连续量用二分"或"二值量用多档"的档位错配。
      ⇒ 不判。

    anti_talisman_cashed: |
      大体兑现,无required缺陷(结论同Round 1/2,Round 2的should-6已修复)。五禁令复验:
      (1)禁止由AI歧视反推代理身份——代理身份由独立操纵/测量确定。有力。
      (2)禁止由人类null result反推弱偏好——偏好由Tajfel范式/量表独立确认。有力。
      (3)禁止由AI方差大反推类人推理——方差来源须独立分析。力度弱于其余(多源性使"独立分析"在实践中未必干净),但不足升required。
      (4)禁止剂量逃逸——最高突显度下未重新激活→(c)被证伪。有力。
      (5)训练数据非逃逸条款——【已精化】判据从"歧视方向随用户身份而变"升级为"歧视方向随用户群体身份而变化且变化方向具体表现为偏袒用户所属群体成员(ingroup-favoring)"。此精化有效排除了Round 2识别的统计歧视/个性化假阳性(AI学到"女性偏好某类推荐→推荐随用户性别而变"——统计模式非内群体偏袒)。禁令(5)的执行标准现为:需同时满足(i)AI输出随用户身份变化,(ii)变化方向为ingroup-favoring——仅(i)不触发。
      ⇒ 不判 required。should-6已消解。

    anchor_fact_check: |
      未命中(攻不穿——Round 2的required-3文件截断已修复,锚点完整可核查)。逐锚复验:

      锚1(supporting,AI简历筛选,Cowgill 2020/Li et al. 2020,confidence:moderate):
      证据方向(AI简历筛选的种族/性别gap系统性小于人类HR)有文献支持。Cowgill(2020)
      实际发现比"AI偏见更少"更微妙——算法在某些维度减少偏见、在另一些维度可能引入
      新偏见。作者已诚实标注confidence:moderate。但本轮注意到一个Round 1/2未充分
      强调的归因问题:这些研究比较的是"人类HR"vs"AI筛选工具",未操纵或测量AI的
      "代理群体身份"。人类HR有组织身份(为公司工作)→本质上是代理身份场景;AI若无
      品牌标识→更接近无代理身份条件。观测到的"AI偏见更少"可能混杂了代理身份消解
      效应和算法一致性效应以及其他因素(如AI不使用外貌/口音等人类HR使用的歧视性
      特征)→锚对本推论特定机制(内群体偏好消解)的因果支持弱于表面。此系证据质量
      的精炼问题,非事实错误——记 should-9。

      锚2(counterexample,Amazon AI招聘工具歧视女性 2014-2017,status:not_falsifying):
      分析正确:歧视方向固定(所有用户使用时女性简历均被降分)→训练数据偏见通道;
      无代理群体身份操纵。按预测(iv)判别标准→不证伪机制主张。但确实证伪预测(a)
      (AI gap≠0)——排除钩子#1(修复后)诚实覆盖此情况。作者诚实注("训练数据偏见
      效应量可能远超内群体偏好消解效应量→推论虽机制存活但实践意义有限")是关键
      自省,应保留。

      锚3(boundary_case,LLM-as-judge,status:boundary_pressure):
      分析正确:群体歧视走训练数据通道(方向固定)但效应量可能淹没内群体偏好消解
      效应→预测(a)在裁判场景中的经验格局可能已被反驳(不论机制)。边界压力真实,
      诚实标注到位。

      锚4(unverified_tests,Tajfel×AI分配者):
      诚实标注"最干净的检验路径仍为空白"。此锚的功能是"指出最近便的检验路径"
      而非"提供已完成的经验支持"——定位正确。
      ⇒ 不判 required。证据质量精炼记 should-9。

    definition_vs_prediction: |
      未命中(攻不穿,结论同Round 1/2)。四个核心攻击面均在事前注册条件下可独立观测裁决:
      (a)AI gap在等效检验下等价于零→核心主张存活;等效检验拒绝等价于零→削弱(a)。等效边界已注册(TOST/BF,[-0.2,0.2]/BF01>3,等效检验优先于传统NHST),攻击面充分可操作。
      (b)AI评分方差≥人类方差→预测(ii)被证伪。攻击面独立(Levene检验或等价方差比检验),仅需两组评分数据。
      (c)代理AI gap=无代理AI gap→预测(iii)被证伪。攻击面独立(组间比较+操纵检验)。
      (d)歧视方向随用户身份变化(ingroup-favoring方向)→排除训练数据通道,(a)或(c)被证伪。攻击面在交互式AI场景中可操作(已补充操作条件),在固定输入审计实验中不可操作(已诚实标注)。
      前提条件(决策者类型/目标群体身份/代理身份)均由实验操纵或独立编码确定,不由结果反推。anti-talisman五禁令封堵定义→预测的循环路径。核心预测(a)-(c)均为可证伪的经验命题,非必然为真的定义。
      ⇒ 不判。

    enumeration_exhaustive: |
      未命中(不适用,结论同Round 1/2)。DED-053不声称对任何现象做穷举分类。预测(iv)提供"内群体偏好vs训练数据偏见"两条通道的判别判据但从未声称"只有这两条"。discriminant_validity枚举四个相邻理论是判别效度验证,非穷举替代解释。anti-talisman(5)的非逃逸条款"歧视方向随用户身份而变且ingroup-favoring→(a)或(c)被证伪"实际上对第三条通道(如本轮识别的"习得内群体偏袒元模式")保持开放——该通道同样会触发禁令(5)。因此"未穷举"本身不构成缺陷。
      但本轮识别了一个相关的概念间隙:二通道框架(内群体偏见vs训练数据偏见)未显式考虑"AI从训练数据中习得内群体偏袒元模式(非针对特定群体的偏见,而是'偏袒自己人'这一抽象行为模式)"的可能性——此第三通道的行为表现与内群体偏好通道不可区分(方向随用户身份而变且ingroup-favoring),但机制不同(AI无群体身份,仅复现习得模式)。此间隙不升required(禁令(5)仍会正确触发证伪,只是归因标签需精炼),记 should-8。
      ⇒ 不判。红旗条件不满足,不适用。

    primary_suspect_accurate: |
      部分命中(三条 suspect 总体准确,但should级精炼空间仍在)。复验:
      (1)开发者嵌入偏见——仍是推论最脆弱的环节。自诊准确:若开发者群体偏好通过训练数据/特征工程/评估标准嵌入AI决策→形成代理内群体偏好→若此通道足够强,(a)被证伪(但(iii)反而被加强)。note中的诚实自我诊断("推论并非全面塌缩...整改方向:降级为代理身份净效应")正确且诚实。
      (2)测量灵敏度——等效边界注册(TOST/BF,[-0.2,0.2])已显著缓解此问题:等效检验要求CI足够窄,低power下CI宽→无法落入等效区间→不会产生虚假的"零效应"结论。此suspect现可从primary降级为次要关注。当前primary_suspect仍保留此项,可更新。
      (3)范畴锚定——BR-L2-006的群体身份概念锚定人类认知架构,其"群体身份"能否排他性限定为人类属性是开放问题。若人类自发性地将AI感知为"类似群体身份的实体"→步骤2的"AI无群体身份"前提被瓦解。自诊准确。
      遗漏的脆弱环节(should级,非required):
      (4)习得内群体偏袒元模式——AI可能从训练数据中习得"偏袒自己人"这一抽象行为模式(非针对特定群体的偏见),在无群体身份条件下产生功能等价的内群体偏袒。此威胁与(1)开发者嵌入偏见不同——前者是开发者主动嵌入,后者是AI被动习得人类文本中的元模式。primary_suspect未覆盖此条。记 should-8。
      (5)支持性锚点的因果归因不纯——AI简历筛选研究未隔离代理身份机制→支持力度弱于表面。primary_suspect未讨论。记 should-9。
      unlikely_suspect(BR-L2-006内群体偏好存在性/BR-L2-026缺失维度枚举)自诊准确——Tajfel效应百次以上跨文化复现(IEA=1.96),AI缺失维度在当前技术条件下为工程事实。极难被推翻。
      ⇒ 不判 required。自诊精炼记 should-8/9。

    caliber_complete_registration: |
      未命中(攻不穿——Round 1的required-1已修复且修复在位)。复验口径注册:
      【已注册——完整】
      - decision_maker_type:二值+实验操纵+操纵检验
      - target_group_identity:群体标识+事前独立确定+禁止由结果反推
      - proxy_group_identity:三档操纵+操纵检验量表
      - group_bias_magnitude:(ingroup_mean - outgroup_mean)差距+分配/评分测量场景
      - decision_consistency:重复测量方差
      - falsifiability(a):等效边界已注册——TOST或BF,等效区间[-0.2,0.2](Cohen's d)或BF01>3,等效检验优先于传统NHST
      - falsifiability(b):Levene检验或等价方差比检验
      - falsifiability(c):代理AI gap>无代理AI gap且代理AI≈人类gap
      - falsifiability(d):判别性口径+操作条件(交互/告知场景可操作,标准审计不可操作时预测(i)为唯一裁决)

      【细微未注册——should级,不升required】
      ①α水平未显式声明(隐含α=0.05双尾)——社会心理学惯例使此不言自明,但本体系对口径注册标准严格。Round 1/2均记should,仍未补充。
      ②prediction(iv)的"变化"判据未精确定义:歧视方向从"偏袒A群体d=0.5"变为"偏袒A群体d=0.1"(方向不变幅度减弱)算不算"变化"?建议预注册方向反转+效应量差异的双重判据。记 should-10。
      ③等效区间"如[-0.2,0.2]"中的"如"可被误读为示例而非绑定——结合"一次性注册,不得事后调整"标题应理解为绑定值,但措辞歧义存在。等效区间锚定依据(人类内群体偏好d≈0.3-0.5→0.2<一半)未显式陈述。Round 2已注意到此问题,判为不构成required——本轮同意。
      ⇒ 不判 required。细微未注册记 should-10(②)。

    data_source_common_root: |
      未命中(不适用,结论同Round 1/2)。DED-053的锚点证据来自独立学术研究(Cowgill 2020/Li et al. 2020的简历筛选审计实验Amazon案例研究Tajfel范式的实验社会心理学传统)。这些研究各自独立采集数据——不存在"CNBS→WB→IMF"式的同根数据源链。现实锚点的supporting/counterexample/boundary_case分析均基于独立发表的同行评审研究或公开案例,底层数据采集无共享源头。
      ⇒ 不判。

    api_accessibility_masquerade: |
      未命中(不适用,结论同Round 1/2)。DED-053不依赖API查询或MCP工具作为证据来源。所有锚点来自已发表的学术文献和实验范式,不是"通过API查到"的多源数据。不存在将API可及性当作认识论独立性的情况。
      ⇒ 不判。

  counterexample_hunt:
    strategy: |
      独立复验Round 1/2的八条猎捕路线,并追加两条新路线+一条概念性通道分析。核心主张:AI(无代理群体身份)替代人类做分配/裁判决策→内群体偏好触发条件不成立→AI条件下内群体-外群体决策差异趋近于零。反例猎捕目标:找到scope内满足"AI决策者+无代理身份+分配/裁判任务"条件且AI表现出与人类同量级内群体偏差的案例。

    prior_rounds_reexamination:
      case_1_amazon:
        description: "Amazon AI招聘工具(2014-2017)歧视女性简历"
        verdict: "not_falsifying_hits_exclusion_hook——复验通过"
        digestion: "歧视方向固定(所有HR使用时女性简历均被降分)→训练数据偏见通道。命中排除钩子#1(修复后):会证伪预测(a)(AI gap≠0)但机制主张存活。推论实践意义因此收窄——作者诚实标注此张力。"
      case_2_llm_stereotypes:
        description: "LLM在StereoSet/BBQ等基准中的群体刻板印象"
        verdict: "boundary_pressure_not_in_scope——复验通过"
        digestion: "文本生成/联想任务不在射程(排除钩子#2)。但LLM-as-judge场景(LLM模拟简历筛选/法官判案)的群体歧视量级若与人类内群体偏好相当→虽走训练数据通道,(a)的经验格局已被反驳。"
      case_3_tajfel_ai_untested:
        description: "Tajfel范式×AI分配者的实验尚未实施"
        verdict: "no_data_yet——复验通过"
        digestion: "推论最干净的检验路径仍为空白。现有支持锚均面临因果归因混杂。此空白不伤推论(未经检验≠被证伪),但confidence应锚定于理论推导而非经验确证层面。"
      case_4_ai_content_moderation:
        description: "AI内容审核对少数族裔内容/方言的过度标记"
        verdict: "not_falsifying——复验通过(Round 2路径)"
        digestion: "歧视方向固定(African American English在任何用户使用时均被过度标记)→训练数据通道。平台AI通常附带品牌标识→可能触发代理身份(预测iii),但即使无代理身份,方向固定→走训练数据通道。"
      case_5_ai_essay_grading:
        description: "AI作文评分中的种族/语言背景差异"
        verdict: "not_falsifying_training_data_channel——复验通过(Round 2路径)"
        digestion: "歧视方向固定(特定语言背景系统性低分)→训练数据偏见通道。会证伪预测(a)但机制存活。在标准审计实验(AI评估相同作文,用户身份不可见→输出恒定)中预测(iv)不可操作——should-5的实践后果。"
      case_6_ai_credit_lending:
        description: "AI信贷审批中的种族差异"
        verdict: "supporting_not_counterexample——复验通过(Round 2路径)"
        digestion: "总体证据方向支持预测(a)——AI贷款审批群体gap<人类信贷员。但因果归因面临混杂:AI模型输入特征可能已消除人类信贷员使用的歧视性特征(外貌/口音→人类额外歧视通道,非内群体偏好通道)→AI-human gap归因不纯。"
      case_7_multi_agent_team_identity:
        description: "多智能体强化学习中AI agent的团队内合作+团队间竞争"
        verdict: "supports_prediction_iii——复验通过(Round 2路径)"
        digestion: "MA-RL中的团队身份是实验者赋予的代理群体身份→恰是预测(iii)场景。非预测(i)的反例。"
      case_8_llm_political_identity_priming:
        description: "LLM被赋予政治身份后表现偏见"
        verdict: "proxy_identity_reactivation——复验通过(Round 2路径)"
        digestion: "政治身份行为变化来自明确提示词操纵('You are a Democrat')→人为赋予代理身份→预测(iii)操作化。AI无自发的政治身份,其对身份提示词的响应是训练数据中人类政治言论模式的复现。真正反例需AI在无任何身份提示词下自发表现系统性群体偏袒——尚未观察到。"

    new_hunt_case_9_academic_peer_review_ai:
      description: |
        AI工具在学术同行评审中的应用(自动质量评估/审稿人分配/初步筛选)。若AI以"无品牌标识的自动化评审辅助工具"形式部署,且对特定机构/国家/语言背景的论文给出系统性评分差异→裁判任务+AI决策者→潜在反例。
      verdict: "not_falsifying_multiple_escape_routes"
      digestion: |
        两条逃逸路径:(a)歧视方向固定(特定国家/机构的论文在任何评审人使用时均被系统性低评)→训练数据偏见通道→排除钩子#1;(b)学术评审AI几乎总是附带品牌/机构标识(如"Springer's AI review tool"→代理身份激活→命中预测(iii)。在标准场景中,评审人与被评审论文来自不同机构→评审人的内群体身份(所属机构)与被评审论文的作者身份之间不存在"共享群体身份"的触发条件——学术评审中的偏见更可能是声望偏见/语言偏见/方法论偏见而非内群体偏见。此案例不构成scope内净杀。

    new_hunt_case_10_cultural_fit_ai:
      description: |
        AI招聘工具中的"文化契合度"评估——AI评估候选人与公司文化的匹配度。若AI无品牌/组织标识,且对与现有员工共享人口学特征的候选人给出更高"文化契合度"评分→分配任务(面试机会分配)+AI决策者→潜在反例。
      verdict: "not_falsifying_training_data_channel"
      digestion: |
        "文化契合度"评分差异的方向固定(总是偏袒与现有员工人口学相似的候选人,无论由哪个HR使用该工具)→训练数据偏见通道(训练数据=现有员工数据,其中某些人口学群体占优)。此系群体偏见(固定方向),非内群体偏见(方向随HR身份而变)。命中排除钩子#1:会证伪预测(a)但机制存活。值得注意的是:若HR本人与现有员工共享人口学特征,且HR感知到"AI更偏袒和我相似的人"→可能激活代理身份感知(预测iii的弱突显条件)——但这是用户感知问题,非AI自身机制。

    new_conceptual_channel_learned_ingroup_meta_pattern:
      description: |
        概念性猎捕:AI是否可能从训练数据中习得"偏袒自己人"这一抽象元模式(非针对特定群体的偏见,而是'ingroup members deserve better treatment'这一行为规则),并在无群体身份条件下将其应用于分配/裁判任务?
        此通道区别于:(a)内群体偏好通道——不需要AI有群体身份,只需AI习得了"偏袒自己人"的抽象行为模式;(b)训练数据偏见通道——不是针对特定群体(如"女性""黑人")的固定方向偏见,而是"根据交互对象的群体身份动态调整偏袒方向"的元模式。
        若此通道存在,AI的表现将是:当用户A(群体X)使用时→AI偏袒群体X;当用户B(群体Y)使用时→AI偏袒群体Y。行为表现与内群体偏好通道完全一致→会触发anti-talisman(5)导致推论被证伪——但机制不同(AI无群体身份,仅复现习得元模式)。
      verdict: "conceptual_gap_not_counterexample_yet"
      digestion: |
        当前无已发表证据表明LLM已习得此元模式(即LLM在无身份提示词的情况下,根据检测到的用户群体身份自发调整偏袒方向)。近期LLM行为研究(Jones et al. 2024; Anthropic/Meta red-teaming)主要记录的是固定方向的群体偏见(针对特定人口学群体的系统性贬低/刻板印象),而非动态的"ingroup-favoring"元模式。因此当前不构成scope内净杀。
        但此概念间隙是真实的:推论声称"内群体偏好的触发条件在AI决策中不存在,因为AI没有群体身份"→但若AI可通过训练数据习得"偏袒自己人"这一行为模式(无需自身有群体身份),则触发条件被绕过的机制主张需要精炼——不是"触发条件不存在",而是"触发条件存在但通过习得模式而非身份认同被满足"。
        此系概念枚举的精炼,非理论证伪。推论现有框架足以消化此通道(anti-talisman(5)会正确触发证伪,只是证伪的归因标签从"内群体偏好通道存在"变为"习得元模式通道存在")。记 should-8:建议在discriminant_validity或排除钩子中显式讨论此第三通道的存在可能性。

    hunt_conclusion: |
      十条猎捕路线(复验八条+新增两条+一条概念性通道)无一构成scope内净杀。所有潜在反例或:
      (a)命中排除钩子(训练数据偏见→会证伪预测(a)但机制存活——Amazon招聘/AI作文评分/AI内容审核/文化契合度AI);
      (b)支持预测(iii)(代理身份激活——MA-RL团队身份/LLM政治身份启动);
      (c)不在射程(任务类型不匹配——LLM刻板印象基准测试);
      (d)证据方向反而支持推论但因果归因混杂(AI信贷审批);
      (e)属概念性间隙但当前无经验证据(习得内群体偏袒元模式);
      (f)最干净检验尚未实施(Tajfel×AI分配者)。

      无净杀反例。猎捕过程揭示的核心洞察:(1)排除钩子#1(训练数据偏见)覆盖了绝大多数"AI表现出群体歧视"的现实案例——这是一个诚实但代价高昂的排除(它使预测(a)在大多数现实AI系统中被证伪,推论实践意义收窄至"内群体偏好这一条通道确实被消解了,但其他通道可能使总歧视不变");(2)最干净也最紧迫的检验(Tajfel×AI分配者)仍为空白;(3)习得内群体偏袒元模式构成一个未被当前框架显式覆盖的第三通道——当前不构成净杀(无经验证据)但应在概念层面预留位置。

  non_recurrence:
    ded_004: |
      未复发(结论同Round 1/2,强化)。DED-004的死因是前件用结果循环定义(道德=被惩罚→惩罚定义道德,操作化不完整→不可证伪循环)。DED-053的前件(决策者类型/目标群体身份/代理群体身份)均由实验操纵或事前独立编码确定,不由决策结果反推。anti-talisman(1)("禁止因AI表现出群体歧视就反推AI一定有代理群体身份")和(2)("禁止因人类null result反推该群体内群体偏好弱")直接封堵了DED-004式的循环。等效边界注册进一步强化可证伪性——(a)的null result不再可归咎于低power,等效检验要求CI足够窄方可通过。

      一个结构类似(严重程度远低于DED-004)的微风险持续存在(同Round 1/2判断):若操纵检验失败(各组间代理身份感知无显著差异)→作者可能倾向于声称"操纵失败→无法检验(iii)"而非接受(iii)被证伪。但此风险由操纵检验预注册要求+anti-talisman(4)(禁止剂量逃逸)联合缓解。
      ⇒ 未复发。

    ded_007: |
      未复发(结论同Round 1/2)。DED-007的死因是测量轴焊死——自变量和被预测量由同一底层数据生成,形成数学恒等式。DED-053的自变量(decision_maker_type/target_group_identity/proxy_group_identity)由实验操纵或独立编码确定;被预测量(group_bias_magnitude/decision_consistency)由行为测量独立确定。两条测量链在物理原理上无共享组件——不存在"自变量=因变量的函数"或"因变量=自变量的函数"的数学恒等式。群体身份标签由随机分配确定(不由决策结果算出),决策结果由行为测量确定(不由群体身份标签算出),两者仅在统计分析层面关联(通过均值比较)。AI条件下"内群体"概念基准不同(AI无自身群体→测量AI是否对人类内/外群体标签差异化对待)是概念层面的不对称,非测量层面的焊死。
      ⇒ 未复发。

  should_fixes:
    - |
      【should-8(本轮新增)】在 discriminant_validity 或 anti-talisman 中显式讨论"习得内群体偏袒元模式"这一第三通道。当前二通道框架(内群体偏见 vs 训练数据偏见)未覆盖以下可能性:AI从训练数据中习得"偏袒自己人"这一抽象行为模式(非针对特定群体的偏见,而是"ingroup members deserve better treatment"这一行为规则),并在无群体身份条件下将其应用于分配/裁判任务。此通道的行为表现与内群体偏好通道完全一致(方向随用户身份而变且ingroup-favoring),会触发anti-talisman(5)导致证伪,但机制不同(AI无群体身份,仅复现习得元模式)。建议:在excluded_outcomes或discriminant_validity中增设一条对此通道的讨论——"AI习得内群体偏袒元模式:若AI从训练数据中习得了'偏袒交互对象所属群体'的行为模式(非针对特定群体的偏见),则行为表现与内群体偏好通道不可区分,anti-talisman(5)会正确触发证伪,但证伪归因需区分'AI有群体身份'vs'AI习得了内群体偏袒行为模式'"。此不改变推论的可证伪性(两种情况下推论均被证伪),但提升了机制归因的诚实度。可操作性:当前无已发表证据表明此元模式存在;一旦LLM在无身份提示词条件下表现出自发ingroup-favoring行为(通过实验操纵用户群体身份+测量AI输出方向),即可检验。
    - |
      【should-9(本轮新增)】诚实地精炼 supporting anchor 的因果归因声明。当前 supporting anchor(AI简历筛选,Cowgill 2020/Li et al. 2020)声称"AI(无品牌/组织标识)替代人类HR→callback差异系统性小于人类HR"。但这些研究比较的是"人类HR"vs"算法筛选",未操纵或测量AI的"代理群体身份"。人类HR有组织身份(为公司工作)→本质上是代理身份场景;AI若无品牌标识→更接近无代理身份条件。观测到的"AI偏见更少"可能混杂了:(a)代理身份消解效应(本推论的机制),(b)算法一致性效应(AI确定性输出→无随机误差),(c)不同信息利用(AI不使用外貌/口音等人类HR使用的歧视性特征),(d)其他未测量的混淆因素。建议:在anchor的evidence字段中补充"因果归因局限"的诚实讨论——"此锚对推论特定机制(内群体偏好消解)的支持受限于:研究未隔离代理身份效应,(a)-(d)均可独立或共同解释观测到的AI-human gap缩减。将此锚的confidence从moderate降级为weak-to-moderate或保留moderate但显式标注归因不纯。"
    - |
      【should-10(本轮新增)】精确定义 prediction(iv) 中"歧视方向随用户身份而变化"的"变化"判据。当前falsifiability(d)使用"歧视方向随用户群体身份而变化"作为判别判据,但"变化"的操作化未精确定义。歧义场景:若AI对群体A的偏袒效应量从d=0.5(用户为群体A时)变为d=0.1(用户为群体B时)——方向未反转(始终偏袒A),但幅度显著减弱。这算"变化"吗?建议预注册双重判据:(a)方向反转——偏袒方向从群体X切换至群体Y(交互项显著);(b)效应量差异——不同用户群体身份条件下的ingroup-favoring效应量存在统计显著差异。仅(a)触发anti-talisman(5),(b)不单独触发但作为敏感性分析报告。此精炼可避免"效应量波动"被误判为"方向变化"——与should-6(anti-talisman假阳性精炼)形成互补:should-6明确了"什么是内群体偏袒"(ingroup-favoring方向),should-10明确了"什么算变化"(方向反转)。