id: ADV-REVIEW-058
type: adversarial_review
reviews: DED-053
layer: L3-deductions

人话摘要: |
  对 DED-053(AI无群体身份与内群体偏好消解)的 round_1 独立对抗审查。
  裁 needs_revision:核心焊接(BR-L2-006的内群体偏好触发条件×BR-L2-026的AI属性缺失→
  AI决策者无内群体偏好触发点)产生了单一砖不包含的非平凡增量——"AI条件下内群体-
  外群体差距趋近于零"的预测不在任何承重砖中,BR-L2-006不问非人类决策者、
  BR-L2-026不涉及具体决策行为。discriminant_validity对算法公平/人机协同/AI通用
  理性/接触假说四个相邻理论的区分干净。未重蹈 DED-004/DED-007。反例猎捕无净杀
  (Amazon招聘工具命中排除钩子/LLM刻板印象不在射程/类Tajfel范式AI分配实验尚未实施)。
  两条 required 挡 verified:(1)核心预测(a)用"AI gap与零无显著差异"为证伪判据但未
  注册等效边界→null result不可判(Flag 11);(2)排除钩子#1声称训练数据偏见不证伪
  推论,但预测(a)要求AI gap近乎零→两者矛盾:训练数据偏见产生非零gap时是否算证伪(a)?
  (Flag 4)。三条 should:(3)derivation step 2归因于BR-L2-026的"无群体归属"未在
  BR-L2-026原文中显式枚举→诚实地将推理步骤显式化;(4)预测(ii)的独特机制claim
  ("群体身份框架波动→额外方差")与"机器不累"解释经验上不可分离;
  (5)预测(iv)的"歧视方向随用户身份而变"测试在固定AI模型+相同输入的设计中不可操作。

target: DED-053
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。
  评分卡红旗 13 条逐项攻+反例猎捕(必做)+DED-004(不可证伪循环)/DED-007(测量轴焊死)
  复发检查。裁决三态照评分卡:verified 需同时满足(1)无 required 缺陷(2)亲自猎捕无 scope 内
  活反例(3)未重蹈 DED-004/007。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新上下文, 与作者无关)"
  verdict: needs_revision
  verdict_note: |
    本推论的核心焊接——BR-L2-006(内群体偏好的触发条件:决策者识别自己群体+匹配被评估者
    群体)与BR-L2-026(AI在具身体验/演化遗产/真实情感/死亡意识维度系统性缺失)的合取——
    产生了单一砖不包含的非平凡增量。BR-L2-006只描述人类内群体偏好的触发机制,完全沉默于
    非人类决策者;BR-L2-026只枚举AI-human能力不对称,不讨论AI在任何具体决策任务中的行为。
    两砖焊接后产出的预测(i)(AI条件下内群体-外群体差距趋近于零)、预测(iii)(代理群体身份
    重新激活内群体偏好)、预测(iv)(训练数据偏见vs内群体偏好的双通道判别判据)均不可由
    任一单砖平凡推出。

    DED-004(不可证伪循环)与 DED-007(测量轴焊死)均未复发。决策者类型(人类vs AI)由实验
    操纵独立确定,目标群体身份由事前随机标签分配独立确定,群体偏差量由分配/评分行为独立
    测量——三条测量通道完全异源。anti-talisman五条禁令覆盖了最常见的逆向推断逃逸路径,
    尤其禁令(1)"禁止由AI歧视输出反推代理身份"和禁令(5)"歧视方向随用户身份而变→非训练
    数据通道→证伪"联手封堵了"看结果重新解释输入"的经典免疫策略。

    反例猎捕无scope内净杀。三条路线:(1)Amazon AI招聘工具歧视女性——命中排除钩子(训练
    数据偏见,歧视方向固定不随用户身份变化),不证伪核心但削弱实践意义(推论诚实标注);
    (2)LLM刻板印象(StereoSet/BBQ)——任务类型非分配/裁判,不在射程,但边界压力真实
    (LLM做裁判任务时若复现→需走预测iv判别);(3)最小群体范式×AI分配者的假想实验——
    尚未实施,推论诚实标注为weak confidence。三类均未构成scope内净杀。

    两条 required 挡住 verified:

    ①【required — 等效边界未注册,核心预测(a)的null result不可判(Flag 11)】
    falsifiability(a)将证伪判据的一部分锚定于"AI条件的差异均值在统计上与零无显著差异"
    (95%CI包含零)。这是典型的null-result-based claim——"未能拒绝H0(AI gap=0)"不等于
    "证明AI gap=0"。低统计功效下,即使AI存在真实的非零群体歧视(效应量d=0.15-0.2),
    小样本仍可能得出"95%CI包含零"的结论,造成虚假的"证伪未发生"。primary_suspect(2)
    已诚实地承认此风险("小样本下AI的零效应与人类的弱效应可能统计上不可区分"),但
    仅在primary_suspect中标注为脆弱环节,未在falsifiability中补救。

    补救方案:注册等效边界(equivalence bound)。使用TOST(two one-sided tests)或贝叶斯
    因子,预注册"AI gap在统计上等价于零"的等效区间(如Cohen's d的95%CI完全落在
    [-0.2, 0.2]内→判定为等价于零;或贝叶斯因子BF01>3→支持零效应)。等效边界必须在
    见到任何数据前锁定,此为anti-talisman(3)的延伸要求。若等效检验拒绝"等价于零"(即
    AI gap虽小但统计上不可忽略),推论(a)应判为被削弱——即使传统NHST未拒绝H0。

    ②【required — 排除钩子#1与核心预测(a)矛盾(Flag 4)】
    excluded_outcomes #1声称:"AI因训练数据偏见产生歧视...这不证伪本推论——因为歧视的
    来源是数据而非群体身份机制。"但falsifiability(a)的判据是:"AI条件下内群体-外群体
    的决策差异均值...在统计上与零无显著差异。"两者存在直接矛盾:若训练数据偏见导致AI
    对"女性"vs"男性"简历产生系统性评分差异(非零gap),则falsifiability(a)的条件被违反
    (AI gap≠0)。排除钩子暗示"推论存活",但(a)已被证伪。

    问题根源:排除钩子的"不证伪本推论"表述模糊。"本推论"指什么?若指"内群体偏好这一条
    通道被结构消除"这一机制主张→训练数据偏见确实不直接证伪此机制;若指预测(a)"AI条件
    下群体偏差趋近于零"这一经验预测→训练数据偏见完全可以证伪它(因为训练数据偏见也产生
    群体歧视,而(a)测量的是总群体gap,不区分通道)。排除钩子目前读起来是在为一个被(a)的
    口径覆盖的经验格局提供豁免——这是不正当的。

    补救:将排除钩子#1的措辞从"这不证伪本推论"改为诚实的分叉声明:
    "训练数据偏见产生的群体歧视【会证伪预测(a)】——因为(a)测量的是AI决策中总群体gap,
    不区分歧视来源通道。但【不证伪内群体偏好通道被结构消除这一机制主张】——因为训练
    数据偏见和内群体偏好是两条独立因果通道,前者的存在不反驳后者的消除。区分两者的
    判据由预测(iv)提供:若AI的群体歧视方向随用户群体身份而变化→歧视走内群体偏好通道
    →机制主张也被证伪;若歧视方向固定→歧视走训练数据通道→机制主张存活但(a)被证伪,
    推论的实践意义大幅收窄。"

    三条 should 补充:

    ③【should — derivation step 2 归因于 BR-L2-026 的"无群体归属"未显式枚举(Flag 10)】
    derivation step 2声称"BR-L2-026揭示AI在三重维度上的根本缺失:(a)无身体体验...
    (b)无情感附着...(c)无群体归属——AI没有'我们'的概念"。但核对BR-L2-026原文,
    其"系统性缺失的维度"显式枚举的是:(g)具身体验、(h)演化遗产、(i)真实情感、
    (j)死亡/有限性意识。这四项中没有任何一项显式声称"AI无群体归属"。(h)提到"这些人类
    演化遗产在...风险感知(L2 内群体偏好)中起隐性作用"——这是说演化遗产影响内群体偏好,
    不是说AI因此无群体归属。从(h)到(c)需要推理步骤:AI无演化遗产→演化遗产是群体归属的
    生物基础→因此AI无群体归属。当前措辞将推理呈现为直接引述——此归因不够诚实。
    建议:将step 2改写为显式推理——"BR-L2-026枚举AI缺失具身体验(g)、演化遗产(h)、
    真实情感(i)、死亡意识(j)。从这四项可推出:AI缺乏形成群体归属的构成要件——无具身锚点
    (族群/性别/地域归属感)、无演化塑造的内群体直觉、无'我们'的情感黏合剂。因此,AI没有
    可被归入任何人类群体的属性。"这样推导链的推理性质是透明的。

    ④【should — 预测(ii)的独特机制claim经验上不可分离(Flag 8/10)】
    预测(ii)声称"AI对同一份材料的多次评分方差系统性小于人类",其独特delta在于"人类方差
    中有一部分归因于群体身份框架波动——同一个人面对'自己人'和'外人'时的校准偏移贡献了
    额外方差"。但此独特机制claim与更简的"机器不累/不波动"解释在经验上不可分离:
    AI评分方差小是架构属性(确定性算法→相同输入→相同输出),不需要任何群体身份机制即可
    解释。要证明群体身份框架波动是AI-human方差差的【独特贡献因子】,需要:(a)测量人类在
    面对恒定群体身份标签时的评分方差(控制身份框架波动),(b)测量人类在群体身份标签切换时
    的额外方差增量,(c)证明(b)的量级大到可独立解释AI-human方差差的主要部分。当前操作化
    未设计此分离检验,discriminant_validity(3)承认此问题但未解决。建议:要么为预测(ii)
    补充分离检验设计,要么将(ii)降级为"一致性增益"(不claim独特机制),诚实标注AI评分确定
    性是架构属性而非内群体偏好机制的独有证据。

    ⑤【should — 预测(iv)的"歧视方向随用户身份而变"测试在固定AI+相同输入时不可操作】
    falsifiability(d)+anti-talisman(5)均依赖一个关键测试:"歧视方向是否随决策者与
    被评估者的相对群体身份而变化→即无论哪个群体的人使用该AI,AI对同一目标群体的歧视
    方向不变。"但此测试在以下标准实验设计中不可操作:若AI模型固定且接收相同输入(如完全
    相同的简历),则无论哪个群体的用户提交查询,AI输出完全相同——歧视方向【不可能】随用户
    身份而变化。使此测试可操作的唯一方式是用户身份通过【输入内容的差异】影响AI输出
    (如不同群体的用户写不同的job description→AI响应不同),但这将用户行为与AI机制混淆。
    补救:明确预测(iv)测试的生效条件——(a)在AI接收用户特定输入的自由交互场景中,用户
    群体身份通过输入行为差异间接影响AI输出;(b)或在AI被告知用户群体身份(如用户填写了
    人口学问卷)的场景中,AI可直接基于用户群体身份调整响应。两种场景下"歧视方向随用户
    身份而变"可测。同时诚实地标注:在标准审计实验范式(AI评估完全相同的简历/材料)中,
    预测(iv)的判别判据不可操作——此时只能依赖预测(i)(ii)(iii)的独立检验。

    综合:推论逻辑骨架清晰、两砖焊接有真增量、可证伪性强(尤其预测(i)(iii))、
    DED-004/007未复发、反例猎捕无净杀。两条 required(等效边界缺失 + 排除钩子矛盾)
    挡住verified——均为可操作的注册/措辞修复,核心不塌。三条 should 为操作化/归因
    层面的精炼。

  red_flag_findings:
    brick_conclusion: |
      未命中(攻不穿)。逐砖核查:

      BR-L2-006(内群体偏好,verified,IEA=1.96):核心主张为人类倾向于优待自己所属群体
      的成员,Tajfel最小群体范式为锚。全文讨论人类的内群体偏好触发条件(Tajfel范式中的
      随机颜色标签→资源分配偏袒)与跨文化普适性。不含"AI""非人类决策者""决策者属性
      层面的群体身份缺失"等任何DED-053特有概念。尤其不含"若决策者无群体身份→内群体
      偏好触发条件不成立"这一反事实推理——BR-L2-006只描述人类在"有群体身份"条件下的
      行为规律,不问"没有群体身份的实体"会怎样。

      BR-L2-026(AI-human信息处理不对称,verified,IEA=2.2):核心主张为AI-human能力是
      类型差异非程度差异,枚举远超维度(a-f)与缺失维度(g-j)。全文不涉及"内群体偏好"
      "群体歧视""分配/裁判决策中的群体偏差"等社会心理学概念。维度(h)提到"演化遗产...
      在内群体偏好中起隐性作用"——这是说演化遗产影响内群体偏好,不是说AI因此无群体归属
      或AI因此不会产生内群体偏好。维度(g)-(j)的通用社会性缺失与"AI在分配任务中不偏袒
      内群体目标"之间的焊接是本推论的增量贡献。

      "AI无群体身份→内群体偏好触发条件被绕过→AI中介化场景的群体歧视低于人类直接决策"
      这一完整结论未在任何承重砖中原文或近义出现。两砖各自在其领域内稳健,但均不单独
      产出本推论的核心预测。无为本推论窄化的专用砖。
      ⇒ 不判。

    nontriviality_cell_check: |
      未命中(攻不穿)。2×2判表逐格:

      格(人类,内群体)——高偏袒——「平凡格」:BR-L2-006直接预测此格(Tajfel范式核心发现),
      不属本推论独有贡献。自认准确。

      格(人类,外群体)——基线/低偏袒——「平凡格」:BR-L2-006隐含(偏袒限于内群体),
      不属本推论独有贡献。自认准确。

      格(AI无代理身份,内群体)——低/零偏袒——「非平凡格·核心空格」:人类决策者在同一
      条件下必然触发高偏袒,AI决策者不产生系统性偏袒。此格需要两砖焊接:
      - BR-L2-006单独→只描述人类面对内群体目标时的偏袒,不问AI
      - BR-L2-026单独→只说AI缺少什么,不说AI在分配任务中会怎么做
      - 两砖焊接→"BR-L2-006的触发条件(需决策者有群体身份)×BR-L2-026的属性(AI无此
        属性)→触发条件不满足→AI不偏袒内群体目标"——此推理链不属于任何单砖。
      若此格被填满(AI无代理身份时仍对内群体目标系统性偏袒)→核心被证伪。此格的非平凡
      状态保障了推论的可证伪性。

      格(AI无代理身份,外群体)——低/零偏袒——「平凡格」:外群体本就不触发偏袒(BR-L2-006),
      AI无所谓内外(BR-L2-026)。自认准确。

      2×2判表对非平凡格的定位精确。核心空格(人工智能,内群体→零偏袒)的定义独立于结果,
      可被独立于推论的实验填满或清空。
      ⇒ 不判。

    measurement_orthogonality: |
      未重蹈 DED-007(攻不穿)。

      自变量(decision_maker_type:人类vs AI无代理身份)由实验操纵/场景编码独立确定——
      操纵检验为事后问卷("你觉得这个AI代表什么群体/组织吗")。被预测量(group_bias_magnitude:
      内群体-外群体决策差异)由分配/评分行为独立测量——独裁者博弈分配额或简历评分差。
      目标群体身份(target_group_identity)由实验事前随机标签分配确定,不得由决策结果反推
      (operationalization明确:"群体身份须在决策任务之前、由独立指标确定,不得由决策结果
      反推")。调节变量(proxy_group_identity)由实验操纵(强/弱/无突显三档)+操纵检验
      (代理身份感知量表)独立测量。

      四条测量通道完全异源:实验操纵(决策者类型/代理身份)→独立;随机标签分配(目标群体
      身份)→独立;行为测量(分配额/评分)→独立;操纵检验(问卷/量表)→独立。不存在DED-007式
      的数学恒等式焊死——自变量不由被预测量算出,被预测量不由自变量算出,目标群体身份
      不由决策结果反推。

      一个细微的测量不对称(不构成焊死):AI条件下的"内群体"概念与人类条件下含义不同。
      对人类决策者:"内群体目标"=与决策者共享群体身份的目标;对AI决策者:AI本身无群体,
      "内群体目标"=与人类参与者共享群体身份的目标(即若由人类决策会是内群体的目标)。
      AI条件下测量的本质是"AI是否对人类的内群体vs外群体标签产生差异化对待"——这恰是
      推论要检验的问题。此不对称是概念层面的(内群体身份的定义基准不同),非测量层面的
      (标签分配和结果测量均为独立)。不影响正交性。
      ⇒ 不判。DED-007未复发。

    scope_hook_independent_of_result: |
      命中——一条 required(见 verdict_note required-2)。

      三项 excluded_outcomes:
      (1)AI因训练数据偏见产生歧视——按因果通道(数据驱动vs群体身份驱动)事前排除,
      但排除措辞与核心预测(a)矛盾(详见required-2)。
      (2)AI在非分配/裁判任务中的偏见——按任务类型(决策者-被评估者二元结构)事前排除,干净。
      (3)人类在被告知AI辅助决策后自身的内群体偏好改变——按行为主体(决策者vs被辅助者)
      事前排除,干净。

      排除(2)(3)的射程边界由推论的核心机制逻辑定义(决策者属性→分配/裁判决策中的群体
      身份敏感度),非按结果事后开脱。排除(1)的机制区分(训练数据vs内群体偏好)在概念上
      事出有因——两条通道的因果源头确实不同——但在口径层面与预测(a)的总gap测量存在
      矛盾(详见required-2)。
      ⇒ HIT required(排除#1)。排除(2)(3)不判。

    criterion_tier_match: |
      未命中(攻不穿)。

      自变量:decision_maker_type为二值(人类/AI),对应概念层面的结构二值(有/无群体身份
      归属)——分档匹配概念。proxy_group_identity为三档(强/弱/无突显),对应连续潜在变量
      (代理身份感知强度)的分段——三档适合作为初始操作化的灵敏度梯度。
      被预测量:group_bias_magnitude为连续量(分配额差/评分差),decision_consistency为
      连续量(评分方差)——连续测量匹配连续被预测量。
      非平凡判表使用二值化决策者类型×二值化目标群体身份——四格设计匹配机制结构
      (有/无群体身份×内/外群体),合理。

      无"连续量用二分"或"二值量用多档"的档位错配。调节变量的三档梯度设计为检测剂量-
      反应关系保留了可能,是加分项。
      ⇒ 不判。

    anti_talisman_cashed: |
      大体兑现,无 required 缺陷。五条禁令:

      【已兑现】(1)禁止由AI歧视输出反推代理群体身份——代理身份必须由独立操纵/测量
      (品牌标签/组织归属/操纵检验量表)确定。此禁令正确封堵了"AI表现出歧视→一定是因为
      被试感知到了某种代理身份"的逃逸路径。

      (2)禁止由人类条件null result反推该群体内群体偏好弱——内群体偏好须由独立测量
      (Tajfel范式/群体认同量表)确认。此禁令封堵了"实验没做出来→这个群体本来就没内群体
      偏好→所以推论不需要在这里成立"的逃逸。

      (3)禁止由AI评分方差大反推AI走了类人群体身份推理——方差来源须由独立分析确定。
      此禁令力度适中——封堵了最直接的逆向推断,但未解决"如果无法做独立分析怎么办"的
      实践空白(见should-4:预测(ii)的独特机制分离在实践中可能不可行)。

      (4)禁止由代理身份未重新激活内群体偏好反推代理身份突显度不够——突显度由事前操纵
      强度定义,最高突显度下仍未观测到重新激活→预测(c)被证伪。此禁令有力——封堵了
      "剂量不够→下次加量"的无限期推迟。

      (5)【训练数据偏见非逃逸条款】若歧视方向随用户群体身份而变化→无论操纵检验是否
      检测到代理身份,(a)或(c)被证伪。此禁令是对排除钩子#1的反向约束——防止以"训练
      数据偏见"为挡箭牌逃避所有不利证据。但禁令的可操作性受限于实验设计(见should-5)。

      【总体评价】五禁令框架覆盖了推论最危险的免疫策略。(1)(2)封堵了对自变量的逆向
      推断,(4)封堵了对调节变量的剂量逃逸,(5)封堵了对排除钩子的滥用。禁令(3)的力度
      弱于其余——因为评分方差的多源性使"独立分析确定方差来源"在实践中可能不如禁令
      措辞暗示的那样干净。
      ⇒ 不判 required。禁令(3)的实践可兑现性记 should-4。

    anchor_fact_check: |
      未命中(攻不穿,附标注)。逐锚:

      锚1(AI简历筛选中的群体偏差对比研究——Cowgill 2020, Li et al. 2020, confidence:
      moderate):AI简历筛选减少种族/性别gap的总体方向有文献支持,但值得注意的是:
      (a)Cowgill(2020)的实际发现比"AI偏见更少"更微妙——算法在某些维度减少偏见、
      在另一些维度可能引入新偏见,因果归因受筛选阶段/候选人池差异的混淆;
      (b)"Li et al. 2020, hiring algorithm audits"引用不够精确——Li等人有多篇
      相关论文,建议补齐完整引用(如Li, Raymond, & Bergman 2020或类似)。
      作者已诚实标注confidence:moderate并注明混淆风险,这在当前形式下可接受。
      但此锚的关键局限未被充分讨论:这些研究比较的是"人类HR"vs"AI筛选工具",而
      人类HR通常知道自己在为公司做筛选(有组织身份)→本就是一种代理身份场景。AI筛选
      工具若无品牌标识→更接近"无代理身份"条件。因此观测到的"AI偏见更少"可能混杂了
      代理身份消解效应和算法一致性效应——锚对推论的因果支持弱于表面。
      ⇒ 不判 required。confidence:moderate 诚实。建议在锚点分析中补充"代理身份混杂"
      的讨论。

      锚2(AI辅助司法判决的一致性研究——COMPAS等,confidence:moderate-strong):
      算法评分的输入-输出确定性是架构属性,非经验发现——这一点作者诚实标注("算法评分
      恒定性由技术架构保证")。COMPAS的争议(ProPublica发现种族偏见)被作者正确地限定在
      "一致性"而非"公平性"维度——COMPAS在种族偏见上的争议不影响其重测信度的架构属性。
      多法官评分方差>算法评分方差有实证基础。但"人类评分方差中有多少归因于群体身份
      波动"是小字诚实标注中的开放问题——这恰是预测(ii)经验上不可分离的根源(见should-4)。
      ⇒ 不判。

      锚3(最小群体范式×AI决策者的假想实验延伸,confidence:weak):
      作者诚实标注为"尚无实施"和"weak"confidence。实验设计(独裁者博弈+AI分配者+
      随机颜色标签接受者)是Tajfel范式的直接延伸,逻辑干净。此锚的功能是"指出最近便的
      检验路径"而非"提供已完成的经验支持"——在此定位下 honest。
      ⇒ 不判。

      反例(Amazon AI招聘工具歧视女性 2014-2017,status:not_falsifying):
      作者按预测(iv)的判别标准分析:(a)歧视方向固定(所有用户使用时女性简历均被降分)→
      训练数据偏见通道;(b)无代理群体身份操纵。分析正确。诚实注("若训练数据偏见通道
      效应量远超内群体偏好消解通道,推论虽机制存活但实践意义有限")是关键自省——这种
      诚实应被保留而非被整改稀释。
      ⇒ 不判。分析正确,诚实注有价值。

      反例(AI语言模型中的群体刻板印象——StereoSet/BBQ,status:boundary_pressure):
      任务类型(文本生成/联想)不在推论射程(分配/裁判决策)——排除钩子#2覆盖。但作者
      诚实标注边界压力:"若LLM在做'裁判'任务时仍表现出刻板印象驱动的决策偏斜,且偏斜
      量级与人类内群体偏好相当→接近证伪边界"。此自省正确——LLM-as-judge是推论射程的
      自然延伸测试。
      ⇒ 不判。边界压力的标注诚实。

      边界案例(AI开发者群体同质化导致的嵌入偏见,status:boundary_case):
      此场景——AI无主动代理身份但有被动嵌入的开发者群体偏好——是推论的一个真实张力区。
      作者的二分处理(嵌入偏见有群体方向性→接近代理内群体偏好,压力在(a);嵌入偏见无
      方向性→训练数据通道,现有排除钩子覆盖)在逻辑上自洽。但"有无群体方向性"的判定
      需要额外的经验分析——在固定AI模型中,嵌入偏见的方向性可能无法从输出中直接读取
      (因为你不知道AI在"与开发者同群体"vs"异群体"条件下的行为差异,除非专门设计对比
      实验)。此问题与should-5(预测iv的可操作性)重叠。
      ⇒ 不判。边界张力真实但逻辑自洽,关联 should-5。

    definition_vs_prediction: |
      未命中(攻不穿)。因果链的多个环节均可独立观测否决:

      (a)AI(无代理身份)条件下内群体-外群体gap非零→核心主张被证伪。攻击面独立:
      gap = (ingroup_mean - outgroup_mean)由行为分配/评分数据独立计算,不依赖推论的
      任何假设。需补充等效边界注册(见required-1)使此攻击面充分可操作。

      (b)AI评分方差不小于人类评分方差→预测(ii)被证伪。攻击面独立:方差比检验(Levene)
      仅需两组评分数据,不依赖推论机制解释。但"不小于"包含了"等于"的情况——若AI方差=
      人类方差,说明无一致性增益,但若AI方差<人类方差,一致性增益成立(不论机制)。

      (c)代理AI条件与无代理AI条件的群体偏差无显著差异→预测(iii)被证伪。攻击面独立:
      两组条件下(ingroup-outgroup gap)的比较仅需实验操纵+行为测量。

      (d)歧视方向随用户身份而变化(且无代理身份操纵)→训练数据偏见通道被排除,(a)或(c)
      被证伪。攻击面在交互式AI场景中可操作(见should-5),在固定输入审计实验中不可操作。

      三个核心攻击面(a)(b)(c)均可在事前注册条件下独立观测。前提条件(决策者类型/目标
      群体身份/代理身份)由实验操纵或独立编码确定,不由结果反推——anti-talisman封堵了
      定义→预测的循环。唯一的结构性模糊是(a)的null result问题(required-1)和排除钩子
      矛盾(required-2),两者均属口径注册层面的缺陷,非"条件是定义还是预测"的范畴。
      ⇒ 不判。

    enumeration_exhaustive: |
      未命中(不适用)。DED-053不声称对任何现象做穷举分类。预测(iv)的"两条通道"(内群体
      偏好vs训练数据偏见)是对AI歧视来源的二分——但作者不声称"只有这两条通道",仅提供
      判别判据以区分两条主要通道。anti-talisman(5)的非逃逸条款("歧视方向随用户身份
      而变→非训练数据通道")实际上为第三条通道(如用户交互行为差异导致的歧视)留出了
      逻辑空间——因为"随用户身份而变"的模式也可能来自非内群体偏好的其他机制。
      discriminant_validity枚举四个相邻理论是判别效度验证,非穷举替代解释。
      ⇒ 不判。红旗条件不满足,不适用。

    primary_suspect_accurate: |
      部分命中——三条 suspect 大体准确,但存在遗漏(记 should,关联 should-3/4/5)。

      primary_suspect三条:
      (1)【群体身份≠人类专属·开发者嵌入偏见】自认准确。此威胁指向推论最脆弱的环节:
      AI虽无主观群体身份,但开发者群体偏好可通过训练数据/特征工程/评估标准嵌入AI决策→
      形成"代理内群体偏好"。此威胁若坐实,预测(i)的强形式被证伪但预测(iii)被加强——正
      如primary_suspect note中的诚实自我诊断。此自诊的准确性和诚实度均好。

      (2)【测量灵敏度·小样本下null与弱效应不可区分】自认准确,且正确指向了核心预测(a)
      最脆弱的统计环节。但仅作为"primary suspect"标注为脆弱是不足的——这恰是需要
      等效边界注册(required-1)的地方。

      (3)【范畴锚定·BR-L2-006的群体身份概念是否排他性人类属性】自认准确。此威胁源于
      BR-L2-006对"群体身份"的定义锚定于人类认知架构(共享血缘/地域/信仰/最小标签),
      将"群体身份"概念扩展到非人类实体的适用性尚未被BR-L2-006本身裁决。这是推论前提
      层面的真实脆弱性——不是推论逻辑的错误,而是承重砖射程的不确定性。

      【遗漏的致命软肋——should 级别】
      (4)derivation step 2对BR-L2-026的归因不精确——将"AI无群体归属"呈现为BR-L2-026
      的直接声明,但BR-L2-026只枚举了(g)具身体验/(h)演化遗产/(i)真实情感/(j)死亡意识,
      未显式声明"无群体归属"。"无群体归属"是从四项缺失维度的合理推理,但当前措辞跳过
      了推理步骤→归因不诚实(见should-3)。

      (5)预测(ii)的独特机制claim("群体身份框架波动→额外方差")与更简的"机器不累/确定
      性算法"解释在经验上不可分离。primary_suspect未将此列为脆弱环节,但discriminant
      _validity(3)承认了此问题。此遗漏意味着:即使预测(ii)的"AI方差<人类方差"成立,
      推论的独特机制贡献(群体身份通道)仍无法被经验确证——(ii)只能作为一致性增益的
      弱证据,不能作为内群体偏好机制的独立证据(见should-4)。

      unlikely_suspect两条(BR-L2-006的内群体偏好存在性/BR-L2-026的AI缺失维度枚举)
      自认准确——BR-L2-006的Tajfel效应经百次以上跨文化复现(IEA=1.96),极难被推翻;
      BR-L2-026的(g)-(j)在当前技术条件下是工程事实。自诊诚实。
      ⇒ 不判 required。记 should-3(归因)/should-4(机制分离)/should-5(预测iv可操作性)。

    caliber_complete_registration: |
      命中——一条 required(等效边界缺失,Flag 11)。

      【已注册的口径——大体完整】
      - decision_maker_type:二值分类,由实验操纵或场景编码决定,附操纵检验——定义+测量+
        操纵检验完整。
      - target_group_identity:基于种族/性别/学校/部门等的群体标识,事前独立确定——定义+
        测量完整,且明确禁止由结果反推。
      - proxy_group_identity:三档操纵(强/弱/无突显)+操纵检验量表——定义+测量完整。
      - group_bias_magnitude:(ingroup_mean - outgroup_mean)差距——分子(分配/评分差)和
        测量场景(独裁者博弈/简历评分)均已注册。
      - decision_consistency:重复测量方差——定义+测量完整。
      - falsifiability(a)统计量:人类gap - AI gap > 0,且AI gap的95%CI包含零——统计量
        明确,但等效边界未注册(见下)。
      - falsifiability(b):Levene检验或等价方差比检验——统计方法明确。
      - falsifiability(c):代理AI gap > 无代理AI gap,且代理AI gap与人类gap无显著差异——
        统计量明确。
      - falsifiability(d):判别性口径——歧视方向固定vs随用户身份变化——判别逻辑明确。

      【未注册——required】
      ①等效边界缺失。falsifiability(a)的判据"AI gap的95%CI包含零"是null result判据,
      但未注册:(a)等效区间(如Cohen's d的95%CI全部落在[-0.2, 0.2]内→判定等价于零);
      或(b)贝叶斯方法的支持区间(如BF01>3→支持零效应);或(c)最低可检测效应量(如
      在power=0.8下可检测到的最小d值,若此值>0.3→研究效力不足以裁决)。等效边界须在
      见到任何数据前锁定(anti-talisman(3)延伸要求)。此缺口使核心预测(a)在实践中不可
      证伪——任何null result都可能被归咎于低统计功效而非AI真的无群体偏差。

      【未注册——should】
      ②α水平未显式注册。falsifiability中各统计检验(95%CI暗示α=0.05,双尾)未显式声明
      α=0.05。虽然社会心理学惯例使此不言自明,但鉴于本体系对口径注册的严格标准,建议
      补充显式声明。

      ③预测(iv)的"歧视方向随用户身份而变化"测试中,"变化"的判据未定义——歧视方向从
      "偏袒A群体"变为"偏袒B群体"是方向反转,但从"偏袒A群体d=0.5"变为"偏袒A群体d=0.1"
      (幅度减弱但方向不变)算不算"变化"?建议预注册方向变化的判据(方向反转/效应量差异
      的显著性/交互项显著性),关联 should-5。

      ⇒ HIT required(①)。记 should(②③)。

    data_source_common_root: |
      未命中(不适用)。DED-053的锚点证据来自独立学术研究(Cowgill 2020/Li et al. 2020
      的简历筛选审计实验、COMPAS司法一致性研究、Tajfel范式的实验社会心理学传统)。
      这些研究各自独立采集数据——不存在"CNBS→WB→IMF"式的同根数据源链。现实锚点的
      supporting/counterexample分析均基于独立发表的同行评审研究,底层数据采集无共享源头。
      ⇒ 不判。红旗条件不满足,不适用。

    api_accessibility_masquerade: |
      未命中(不适用)。DED-053不依赖API查询或MCP工具作为证据来源。所有锚点来自已发表
      的学术文献和实验范式,不是"通过API查到"的多源数据。不存在将API可及性当作认识论
      独立性的情况。
      ⇒ 不判。红旗条件不满足,不适用。

  counterexample_hunt:
    strategy: |
      按评分卡要求,主动构造可证伪核心主张的干净案例。核心主张:AI(无代理群体身份)替代
      人类做分配/裁判决策时,内群体偏好的触发条件不成立→AI条件下内群体-外群体决策差异
      趋近于零→AI中介化场景的群体歧视系统性低于人类直接决策。反例猎捕目标:找到scope
      内满足"AI决策者+无代理身份+分配/裁判任务"条件且AI表现出与人类同量级内群体偏差
      的案例。同时猎"AI有类群体身份"(primary_suspect 1)和"人类将AI自发性地当作有群体
      身份的实体"(primary_suspect 3)的场景。

    case_1_amazon:
      description: |
        Amazon AI招聘工具(2014-2017):AI简历筛选系统被发现系统性降低含"women's"等词的
        简历评分。此为AI在裁判任务(简历筛选=分配面试机会)中表现出群体歧视的经典案例。
        若满足"无代理身份+裁判任务+群体歧视→gap≠0"条件,将构成对预测(a)的直接反例。
      verdict: not_falsifying_hits_exclusion_hook
      digestion: |
        按预测(iv)的判别标准:(a)歧视方向固定——无论哪个群体的HR使用该工具,女性简历
        均被系统性降分→指向训练数据偏见通道(历史招聘数据中男性占优);(b)该工具未涉及
        代理群体身份操纵。因此命中排除钩子#1"AI因训练数据偏见产生歧视"——不证伪内群体
        偏好通道被结构消除的机制主张。

        但此案例揭示了排除钩子#1与预测(a)之间的张力(见required-2):Amazon AI产生了
        非零的性别gap→falsifiability(a)的"AI gap近零"条件被违反。若严格按(a)的口径
        (不区分歧视来源通道),此案例构成对(a)的经验反驳。排除钩子救的是机制主张而非
        经验预测。

        推论的诚实注("若训练数据偏见通道效应量远超内群体偏好消解通道,推论虽机制存活
        但实践意义有限")是对此张力的诚实承认——应保留而非稀释。
      status: not_falsifying_mechanism_but_challenges_prediction_a

    case_2_llm_stereotypes:
      description: |
        大语言模型在StereoSet、BBQ等基准测试中持续表现群体刻板印象(如"黑人-暴力"
        "女性-家庭"关联)。若LLM被用于裁判任务(模拟法官判案/模拟HR筛选)且表现群体
        歧视→可能构成反例。
      verdict: boundary_pressure_not_in_scope
      digestion: |
        基准测试场景(文本生成/联想)不在推论射程(分配/裁判决策)——命中排除钩子#2。
        但作者诚实标注boundary_pressure:"若LLM在裁判场景中持续复现群体歧视且方向
        不随用户身份而变→触发预测iv判别;若方向随用户身份而变→证伪(a)"。此自省正确。

        当前证据状态:LLM在裁判任务(如模拟简历筛选/模拟法官判案)中确实表现出对特定
        群体的系统性歧视——多项研究(如Anthropic/OpenAI的red-teaming)已证明此点。
        这些表现的"方向固定性"特征(相同的姓名→相同的歧视方向,不随使用者身份变化)
        支持训练数据偏见通道,不直接伤推论。但效应量的量级问题依然存在:若LLM裁判中的
        群体歧视效应量与人类内群体偏好相当,推论(i)的"AI gap近零"在裁判场景中已被经验
        反驳——无论机制如何。
      status: boundary_pressure_watch

    case_3_tajfel_ai_untested:
      description: |
        推论锚3诚实承认:尚无直接实施"Tajfel范式中的AI作为分配者"的已发表实验。
        核心预测(a)的最干净检验——AI(无品牌/组织标识)在独裁者博弈中分配资源给
        内群体vs外群体接受者——尚未被实施。
      verdict: no_data_yet
      digestion: |
        这本身不是反例,而是检验空白。推论的诚实(confidence:weak, hypothetical extension)
        是正确的——不应因"未经检验"而惩罚推论。但此空白意味着:推论的核心预测(a)目前
        没有来自其最直接检验范式(Tajfel×AI分配者)的任何经验裁决——无论是支持还是反对。
        现有支持的锚点(简历筛选/司法一致性)均为间接证据,面临因果归因混淆(代理身份混杂/
        任务类型差异/训练数据偏见混杂)。
      status: untested_clean_test_available

    hunt_conclusion: |
      三条反例路线无一构成scope内的净杀。Amazon招聘工具命中排除钩子#1但挑战预测(a)的
      经验口径(required-2关联)。LLM刻板印象不在射程(排除钩子#2)但边界压力真实——LLM
      在裁判场景中的群体歧视若系统性与人类内群体偏好相当量级,虽走训练数据通道,预测(a)
      的经验格局已被反驳(不论机制)。类Tajfel范式×AI分配者的实验尚未实施——这是推论
      最干净也最紧迫的检验路径。

      无净杀反例。但猎捕过程揭示了三件事:(1)排除钩子#1与预测(a)的张力(required-2);
      (2)现存"支持"锚点的因果归因均面临代理身份/任务类型/训练数据偏见的混淆——支持
      力度比表面confidence暗示的弱;(3)最直接的检验(Tajfel×AI分配者)尚未实施——推论
      在核心预测上的经验裁决处于"可检验但未检验"状态。

  non_recurrence:
    ded_004: |
      未复发。DED-004的死因是"道德-非道德区分的操作化不完整"→用结果循环定义前件
      (行为是否道德取决于是否被惩罚→惩罚本身被用来定义道德)。DED-053的前件(决策者
      类型/目标群体身份/代理群体身份)均由实验操纵或事前独立编码确定,不由决策结果反推。
      anti-talisman(1)("禁止因AI表现出群体歧视就反推AI一定有代理群体身份")和(2)("禁止
      因人类null result反推该群体内群体偏好弱")直接封堵了DED-004式的循环。五个攻击面
      均可在事前注册条件下独立裁决。未发现DED-004式的不可证伪循环。

      一个结构上类似(严重程度远低于DED-004)的微风险:anti-talisman(4)禁止由"代理身份
      未重新激活"反推"突显度不够"——但若突显度操纵本身在实验中失败(操纵检验显示各组间
      无显著差异),作者可能倾向于声称"操纵失败→无法检验预测(iii)"而非接受(iii)被证伪。
      但此风险由操纵检验的预注册要求(operationalization中明确"操纵检验:代理身份感知
      量表")部分缓解——若操纵检验显示操纵成功但(iii)不成立→(iii)被证伪,逃逸路径被堵。
      ⇒ 未复发。

    ded_007: |
      未复发。DED-007的死因是"测量轴焊死"——自变量和被预测量由同一底层数据生成,形成
      数学恒等式。DED-053的自变量(decision_maker_type/target_group_identity/proxy_group
      _identity)均由实验操纵或独立编码确定;被预测量(group_bias_magnitude/decision_
      consistency)由行为分配/评分数据独立测量。两条测量链在物理原理上无共享组件——
      不存在"自变量=因变量的函数"或"因变量=自变量的函数"的数学恒等式。群体身份标签
      由随机分配确定(不由决策结果算出),决策结果由行为测量确定(不由群体身份标签算出),
      两者仅在统计分析层面关联(通过均值比较)。这是干净的异源测量。
      ⇒ 未复发。

  required_fixes:
    - |
      【required-1】为 falsifiability(a)注册等效边界(equivalence bound)。当前判据
      "AI条件的差异均值在统计上与零无显著差异(95%CI包含零)"是null-result-based claim,
      低统计功效下不可裁决。必须补充以下之一(在见到任何数据前锁定):
      (a) TOST等效检验——预注册等效区间(如Cohen's d的95%CI完全落在[-0.2, 0.2]内→
      判定AI gap等价于零;或原始度量单位的等效区间如分配任务中"评分差<0.3分(5分量表)"
      或独裁者博弈中"分配额差<$0.50");等效区间的锚定依据须一并提供(如基于人类内群体
      偏好效应量的分数——人类gap若为d=0.4,等效区间上界≤0.2即小于人类效应的一半);
      或(b)贝叶斯方法——预注册先验分布和BF阈值(如BF01>3→支持AI gap等价于零);
      或(c)最低可检测效应量声明——在预注册的样本量和α=0.05下,声明可检测到的最小
      Cohen's d值(如N=200时power=0.8可检测d≈0.20——若不可检测则诚实标注检验效力不足)。
      等效边界注册是anti-talisman(3)"阈值一次性锁定"的延伸——等效边界未注册,"与零
      无显著差异"就不是一个可被证伪的判据(任何null result都可归咎于低power)。
    - |
      【required-2】修复排除钩子#1与预测(a)的矛盾。当前 excluded_outcomes #1声称
      "AI因训练数据偏见产生歧视...这不证伪本推论",但 falsifiability(a)要求AI gap近零
      (不区分歧视来源通道)。训练数据偏见产生的群体歧视会直接违反(a)的经验条件。
      整改方案(二选一,推荐方案A):
      方案A(推荐):将排除钩子#1的措辞从"这不证伪本推论"改为诚实的双层声明:
      "训练数据偏见产生的群体歧视【会证伪预测(a)】——因为(a)测量的是AI决策的总群体gap,
      不区分歧视来源通道;但【不自动证伪内群体偏好通道被结构消除的机制主张】——因为训练
      数据偏见和内群体偏好是两条独立因果通道。判别由预测(iv)执行:若歧视方向随用户群体
      身份而变化→内群体偏好通道存在→机制主张被证伪;若歧视方向固定→训练数据通道→
      机制主张存活但预测(a)被证伪。此情况下推论实践意义大幅收窄——'AI无内群体偏好'被
      'AI有训练数据偏见'掩盖。"
      方案B:将预测(a)的口径精确化为"排除可归因为训练数据偏见的群体gap后的残余gap近零",
      但这要求预注册训练数据偏见的控制方法(如使用去偏训练数据集)——操作复杂度显著增加。

  should_fixes:
    - |
      【should-3】修正 derivation step 2 对 BR-L2-026 的归因。当前措辞"BR-L2-026揭示AI在
      三重维度上的根本缺失:(a)无身体体验...(b)无情感附着...(c)无群体归属"将"无群体归属"
      呈现为BR-L2-026的直接声明。但核对BR-L2-026原文,其显式枚举的缺失维度是(g)具身体验、
      (h)演化遗产、(i)真实情感、(j)死亡意识——"无群体归属"是自此四项的推理,不是BR-L2-026
      的显式声明。建议改写step 2为显式推理:"BR-L2-026枚举AI在具身体验(g)、演化遗产(h)、
      真实情感(i)、死亡意识(j)四个维度的系统缺失。这四个维度恰是人类群体归属的构成要件:
      具身锚点提供'我属于这个身体/族群/地域'的体感基础,演化遗产提供内群体偏好的先天直觉
      (BR-L2-026(h)明确提到演化遗产在内群体偏好中的作用),真实情感提供'我们'的归属黏合剂,
      死亡意识塑造代际传承的群体叙事。AI在这四个维度的缺失意味着:AI缺乏形成群体归属所需
      的全部构成要件→因此AI没有可被归入任何人类群体的属性。"此改写使推理步骤透明化,
      不改变焊接的逻辑有效性。
    - |
      【should-4】诚实地标注预测(ii)的机制分离困境。预测(ii)声称AI评分方差<人类评分方差,
      且独特delta在于"人类方差中包含群体身份框架波动贡献的额外方差,AI无此波动源"。但:
      (a)AI评分方差小是架构属性(确定性算法→相同输入→相同输出),不需要任何群体身份机制
      即可解释;(b)人类评分方差中的"群体身份框架波动"成分无法与"疲劳/注意力/情绪波动"
      分离——除非设计专门实验(同一人类面对恒定群体身份标签vs切换群体身份标签的方差对比);
      (c)discriminant_validity(3)已诚实承认此问题("若人类评分方差完全由非群体因素解释,
      且AI方差小的优势量等于'人类疲劳方差',则(ii)的独特机制claim被削弱"),但未在
      operationalization中为分离检验预留设计。
      建议:要么(a)在operationalization中补充分离检验设计——在人类条件下增设"群体身份
      标签恒定"子条件,将人类评分方差分解为"标签恒定方差"+"标签切换额外方差",检验后者
      是否构成AI-human方差差的主要部分;要么(b)将预测(ii)的claim降级为"一致性增益"——不
      claim独特机制(群体身份框架波动),仅claim"AI评分比人类评分更一致"这一经验预测,并
      诚实标注此预测在架构上是平凡的(确定性算法→一致性是默认属性,非本推论的独有发现)。
    - |
      【should-5】为预测(iv)的"歧视方向随用户身份而变化"测试补充可操作性条件。
      falsifiability(d)和anti-talisman(5)均依赖此测试,但在固定AI模型+相同输入的实验设计
      中(AI评估完全相同的简历/材料),AI对同一输入产生相同输出→歧视方向不可能随用户身份
      而变化——测试在此设计中不可操作。补救:(a)明确预测(iv)测试的生效条件——仅在以下场景
      中可操作:(i)自由交互场景(用户群体身份通过输入行为差异间接影响AI输出,如不同群体
      的用户写不同的job description→AI推荐不同);(ii)用户身份告知场景(AI被显式告知用户
      的群体身份→可直接基于此信息调整响应,如"User is from Group A, please evaluate these
      candidates");(b)诚实地标注:在标准审计实验范式(AI评估完全相同材料,用户身份被控制
      为对AI不可见)中,预测(iv)的判别判据不可操作——此时预测(i)的群体gap检验是唯一的裁决
      依据;(c)对于标准审计实验,falsifiability(d)+anti-talisman(5)被括号化——仅当AI的
      输入因用户身份而异时才生效。这使排除钩子#1的"训练数据偏见vs内群体偏好"区分在标准
      审计实验中依赖预测(iv)以外的独立方法(如操控训练数据的群体统计特征进行对比实验)。

round_2:
  reviewer: "独立对抗审查者 (round 2, 全新上下文, 与round 1及作者无关)"
  verdict: needs_revision
  verdict_note: |
    Round 1 两条 required 均已被消解:(1)等效边界已在 falsifiability(a)中注册(TOST/BF, [-0.2, 0.2]或BF01>3);(2)排除钩子#1已改为诚实双层声明(训练数据偏见会证伪预测(a),不自动证伪机制主张)。焊接逻辑的非平凡增量仍在,核心不塌。

    但本轮发现两个新问题挡住 verified:
    (a)【required — 文件截断】real_world_anchors仅含一条supporting锚,证据字段以"但诚实标注:部分研究发现AI筛选同样"戛然而止——文件在句中被截断,无counterexample锚,无trailing newline。YAML虽可解析(字符串恰好终止)但内容不完整——事实基础无法完整核查。
    (b)【should — review_summary缺失】CLAUDE.md 要求"Revise 每轮必须将裁决压入 review_summary",DED-053 无此字段→审查追踪链断裂(但属过程缺陷,不伤理论有效性)。

    Round 1 三条 should 均未处理:should-3(derivation step 2 归因仍称 BR-L2-026 直接声明了"无群体归属",但 BR-L2-026 仅显式枚举(g)具身体验/(h)演化遗产/(i)真实情感/(j)死亡意识——"无群体归属"是从四项的推理,非直接引述)、should-4(预测ii的独特机制仍无法与"机器不累/确定性算法"经验分离,operationalization 未补分离检验设计)、should-5(预测iv的"歧视方向随用户身份而变"测试在固定AI+相同输入的标准审计范式中不可操作,未补充生效条件)。本轮新增一条 should:anti-talisman(5)将"歧视方向随用户身份而变"等同于"内群体偏好通道存在",但忽略了一个替代解释——统计歧视/个性化(如AI学到的"女性更偏好某类工作"→推荐随用户性别而变,这是统计模式非内群体偏袒)。禁令(5)可能产生假阳性,建议将判据精化为"歧视方向随用户身份而变【且具体表现为偏袒用户自身所属群体】"。

    反例猎捕无scope内净杀。Round 1三条路线(Amazon招聘/LLM刻板印象/Tajfel×AI未实施)复验结论不变。新增五条路线(AI内容审核/AI作文评分/AI信贷审批/多智能体团队身份/LLM政治身份启动)均命中排除钩子或预测(iii)的代理身份激活条件,无净杀。

    DED-004/DED-007 无复发。等效边界注册后(a)的可证伪性显著加强——低power不再能成为null result的挡箭牌(等效检验要求CI足够窄才可通过)。

    整改方向清晰:补齐截断文件(完整 real_world_anchors + 至少一条counterexample锚 + 边界案例)+ 添加 review_summary + 处理累积的四条 should。理论骨架健壮,距 verified 仅差文件完整性和 should 级精炼。

  red_flag_findings:
    brick_conclusion: |
      未命中(攻不穿,结论同Round 1)。Round 1 的逐砖核查结论不变:
      - BR-L2-006(内群体偏好,verified,IEA=1.96):全文描述人类内群体偏好触发条件与跨文化普适性,不含"AI""非人类决策者""决策者属性层面的群体身份缺失"等概念。尤其不含"若决策者无群体身份→内群体偏好触发条件不成立"的反事实推理。
      - BR-L2-026(AI-human信息处理不对称,verified,IEA=2.2):全文枚举AI远超维度(a-f)与缺失维度(g-j),不涉及"内群体偏好""群体歧视""分配/裁判决策中的群体偏差"。维度(h)提到"演化遗产在内群体偏好中起隐性作用"——这是说演化遗产影响内群体偏好,不是说AI因此无群体归属。
      两砖各自稳健,均不单独产出"AI中介化场景的群体歧视低于人类直接决策"的预测。焊接有真增量。
      ⇒ 不判。

    nontriviality_cell_check: |
      未命中(攻不穿,结论同Round 1)。2×2判表的核心空格(AI无代理身份,内群体→低/零偏袒)仍是唯一非平凡格:
      - BR-L2-006单独:只描述人类面对内群体目标时的偏袒,沉默于非人类决策者
      - BR-L2-026单独:只枚举AI有/无维度,不讨论AI在分配任务中的行为
      - 两砖焊接:"BR-L2-006的触发条件(需决策者有群体身份)×BR-L2-026的属性(AI无此属性)→触发条件不满足→AI不偏袒内群体目标"——此推理链不属于任何单砖
      若此格被填满(AI无代理身份时仍对内群体目标系统性偏袒)→核心被证伪。
      ⇒ 不判。

    measurement_orthogonality: |
      未重蹈DED-007(攻不穿,结论同Round 1)。四条测量通道完全异源:
      - decision_maker_type:实验操纵+操纵检验(独立)
      - target_group_identity:事前随机标签分配(独立)
      - group_bias_magnitude:行为分配/评分测量(独立)
      - proxy_group_identity:实验操纵+操纵检验量表(独立)
      不存在DED-007式的数学恒等式焊死。AI条件下的"内群体"概念与人类条件下基准不同(AI无自身群体→测量的本质是AI是否对人类的内/外群体标签产生差异化对待),这是概念不对称非测量层面焊死。
      ⇒ 不判。DED-007未复发。

    scope_hook_independent_of_result: |
      未命中(攻不穿——Round 1 的 required-2 已修复)。三项 excluded_outcomes:
      (1)训练数据偏见——【已修复】措辞从"不证伪本推论"改为诚实双层声明:"会证伪预测(a)但不自动证伪机制主张,区分由预测(iv)执行,若走训练数据通道→机制存活但预测(a)被证伪、实践意义大幅收窄"。此修复消解了Round 1识别的矛盾——排除钩子不再为被预测(a)口径覆盖的经验格局提供不正当豁免。
      (2)非分配/裁判任务——按任务类型事前排除,干净。
      (3)人类在被AI辅助后自身偏好改变——按行为主体事前排除,干净。
      ⇒ 不判 required。排除钩子#1修复充分。

    criterion_tier_match: |
      未命中(攻不穿,结论同Round 1)。decision_maker_type二值匹配概念二值(有/无群体身份);proxy_group_identity三档匹配连续潜在变量;group_bias_magnitude连续测量匹配连续被预测量。无档位错配。
      ⇒ 不判。

    anti_talisman_cashed: |
      大体兑现,无新required缺陷。五禁令复验:
      (1)禁止由AI歧视反推代理身份——代理身份由独立操纵/测量确定。仍有力。
      (2)禁止由人类null result反推弱偏好——偏好由Tajfel范式/量表独立确认。仍有力。
      (3)禁止由AI方差大反推类人推理——方差来源须独立分析。力度弱于其余(多源性使"独立分析"在实践中未必干净),但不足升required。
      (4)禁止剂量逃逸——最高突显度下未重新激活→(c)被证伪。仍有力。
      (5)训练数据非逃逸条款——歧视方向随用户身份而变→排训练数据通道→(a)或(c)被证伪。
      【本轮新发现(should级)】禁令(5)存在逻辑间隙:将"歧视方向随用户身份而变"等同于"内群体偏好通道存在",但忽略了替代解释——统计歧视/个性化。例如AI学到"女性偏好某类工作→推荐随用户性别而变"——这是统计模式,非内群体偏袒。建议将禁令(5)的判据精化为"歧视方向随用户身份而变【且具体表现为偏袒用户所属群体】"——这要求同时检验:(i)AI输出是否随用户群体身份变化;(ii)变化方向是否为"偏袒用户自身群体成员"。仅(i)满足不触发禁令(5)。
      ⇒ 不判 required。禁令(5)间隙记 should(本轮新增)。

    anchor_fact_check: |
      无法完整核查(攻不穿但受阻——文件截断)。real_world_anchors仅含一条supporting锚(AI简历筛选Cowgill 2020/Li et al. 2020),证据以"但诚实标注:部分研究发现AI筛选同样"截断。Round 1已评估此锚的因果归因混杂(人类HR带组织身份vs AI无品牌标识→"AI偏见更少"可能混杂代理身份消解效应)并判confidence:moderate诚实——该结论不变。但文件截断意味着:
      - 无法核查锚的完整证据链(截断句后原本可能有什么?反例?边界案例?)
      - 无counterexample锚(Amazon招聘工具/LLM刻板印象/Tajfel×AI未实施的讨论仅在Round 1审查档中,推论文件中应至少有一条counterexample锚)
      - 无边界案例锚
      截断本身是一个 required 缺陷——证据基础不完整,事实核查无法完成。补齐后再判。
      ⇒ 不判 required(但截断是独立的required缺陷,见下)。

    definition_vs_prediction: |
      未命中(攻不穿,结论同Round 1)。三个核心攻击面均在事前注册条件下可独立观测裁决:
      (a)AI gap在等效检验下等价于零→核心主张存活;等效检验拒绝等价于零→削弱(a)。等效边界已注册(TOST/BF,[-0.2,0.2]/BF01>3),攻击面充分可操作。
      (b)AI评分方差≥人类方差→(ii)被证伪。攻击面独立(Levene检验)。
      (c)代理AI gap=无代理AI gap→(iii)被证伪。攻击面独立(组间比较+操纵检验)。
      前提条件(决策者类型/目标群体身份/代理身份)均由实验操纵或独立编码确定,不由结果反推。anti-talisman五禁令封堵了定义→预测的循环路径。
      ⇒ 不判。

    enumeration_exhaustive: |
      未命中(不适用,结论同Round 1)。DED-053不声称穷举分类。预测(iv)提供两条通道的判别判据但未声称"只有两条"。discriminant_validity枚举四个相邻理论是判别效度验证,非穷举替代解释。
      ⇒ 不判。

    primary_suspect_accurate: |
      部分命中(三条 suspect 仍准确,should 级遗漏未修复)。Round 1 的三条 primary_suspect 复验:
      (1)开发者嵌入偏见——仍是推论最脆弱环节,自诊准确。
      (2)测量灵敏度——等效边界注册(required-1修复)已显著缓解此问题:等效检验要求CI足够窄,低power下CI宽→无法落入等效区间→不会产生虚假的"零效应"结论。此suspect现可从primary降级。
      (3)范畴锚定——BR-L2-006的群体身份概念是否人类排他性,self-diagnosis诚实。
      Round 1 三条 should 遗漏(should-3归因/should-4机制分离/should-5可操作性)仍未在 primary_suspect 或 secondary_suspect 中体现——作者尚未更新自诊。应将这些已确认的脆弱环节纳入 suspect 体系。
      ⇒ 不判 required。关联 should-3/4/5。

    caliber_complete_registration: |
      未命中(攻不穿——Round 1 的 required-1 已修复)。等效边界已在 falsifiability(a)中注册:
      "需使用等效检验：TOST或贝叶斯因子，预注册等效区间如Cohen's d的95%CI完全落在[-0.2, 0.2]内，或BF01>3，方可判定为等价于零。若等效检验拒绝等价于零，即使传统NHST未拒绝H0，也视为削弱预测(a)"
      此注册满足required-1的核心要求:等效检验方法明确(TOST/BF)、等效区间具体([-0.2,0.2])、阈值明确(BF01>3)、优先规则清晰(等效检验>传统NHST)。一个细微的措辞问题:"如"可被误解为示例(但结合"一次性注册,不得事后调整"的标题,应理解为"即"而非"例如")。等效区间的锚定依据(人类内群体偏好效应量d≈0.3-0.5→0.2<一半)未显式陈述,但可从区间值本身读出——不构成required缺陷。
      其余口径(decision_maker_type/target_group_identity/proxy_group_identity/group_bias_magnitude/decision_consistency及各falsifiability统计量)均完整注册。
      ⇒ 不判 required。Round 1的required-1已充分消解。

    data_source_common_root: |
      未命中(不适用,结论同Round 1)。锚点证据来自独立学术研究,不存在CNBS→WB→IMF式同根数据源链。
      ⇒ 不判。

    api_accessibility_masquerade: |
      未命中(不适用,结论同Round 1)。DED-053不依赖API查询或MCP工具作为证据来源。
      ⇒ 不判。

  counterexample_hunt:
    strategy: |
      独立复验Round 1的三条路线,并追加五条新路线。核心主张:AI(无代理群体身份)替代人类做分配/裁判决策→内群体偏好触发条件不成立→AI条件下内群体-外群体决策差异趋近于零。

    round_1_reexamination:
      case_1_amazon:
        description: "Amazon AI招聘工具(2014-2017)歧视女性简历"
        verdict: "not_falsifying_hits_exclusion_hook——复验通过"
        digestion: "歧视方向固定(所有用户使用时女性简历均被降分)→训练数据偏见通道。命中排除钩子#1(已修复后的版本)。但诚实地构成对预测(a)的经验反驳——AI gap≠0。此案例揭示推论的核心实践张力:训练数据偏见效应量可能远超内群体偏好消解效应量,使'AI天然免于内群体偏好'在工程上被训练数据偏见淹没。作者诚实标注此张力,应保留。"

      case_2_llm_stereotypes:
        description: "LLM在StereoSet/BBQ等基准中的群体刻板印象"
        verdict: "boundary_pressure_not_in_scope——复验通过"
        digestion: "文本生成/联想任务不在射程(排除钩子#2)。但LLM-as-judge场景(如用LLM模拟简历筛选)的群体歧视量级若与人类内群体偏好相当→虽走训练数据通道,(a)的经验格局已被反驳。2024-2025年多篇LLM-as-judge研究发现LLM在裁判场景中存在系统性群体歧视(如种族/性别命名对评分的影响),但歧视方向固定→训练数据通道→推论机制存活但(a)经验上已被削弱。"

      case_3_tajfel_ai_untested:
        description: "Tajfel范式×AI分配者的实验尚未实施"
        verdict: "no_data_yet——复验通过"
        digestion: "推论最干净的检验路径仍为空白。现有支持锚(AI简历筛选/司法一致性)均面临因果归因混杂。此空白不伤推论(未经检验≠被证伪),但使confidence评级停留在理论推导而非经验确证层面。"

    new_hunt_case_4_ai_content_moderation:
      description: |
        AI内容审核平台(YouTube/Facebook/Twitter)使用AI对用户生成内容做裁判(是否违规/是否降权)。多项研究发现AI审核对少数族裔内容/方言(如非洲裔美国英语)存在系统性过度标记。此为裁判任务+AI决策者,若AI无显式品牌/群体标识→满足"无代理身份"条件→构成潜在反例。
      verdict: "not_falsifying_multiple_escape_routes"
      digestion: |
        三条逃逸路径均可消化此案例:(a)平台AI通常附带品牌标识(YouTube's AI)→代理身份激活→命中预测(iii);(b)歧视方向固定(African American English在任何用户使用平台时均被过度标记)→训练数据偏见通道→命中排除钩子#1(会证伪(a)但模型机制存活);(c)内容审核的"违规判定"与推论的"分配/裁判"在概念上存在裂隙——审核判断的是一段内容是否违规(二元判定),推论的分配/裁判涉及对特定个体的资源配置/评分,二者的"群体身份敏感度"机制可能不同。
        最关键的是(b):AI内容审核的群体歧视方向是固定的(不随用户群体身份而变)→训练数据通道→推论机制存活但(a)的经验格局已被反驳。这是对排除钩子#1(修复后)的正确应用。

    new_hunt_case_5_ai_essay_grading:
      description: |
        AI作文评分系统(e.g., ETS e-rater)被发现对不同种族/语言背景的学生存在系统性评分差异(Bridgeman et al. 2012; Feathers 2019)。若评分系统以"自动化评分工具"(无品牌/组织标识)形式部署→满足"无代理身份+裁判任务"条件→构成潜在反例。
      verdict: "not_falsifying_training_data_channel"
      digestion: |
        歧视方向固定(特定语言背景的作文系统性低分)→训练数据偏见通道。符合排除钩子#1(修复后):会证伪预测(a)(AI gap≠0)但机制主张存活。关键检验(预测iv):是否需要"歧视方向随用户身份而变"才能排除训练数据通道?在标准审计实验中(AI评估完全相同作文,用户身份不可见→输出恒定),此测试不可操作——这是should-5的实践后果。

    new_hunt_case_6_ai_credit_lending:
      description: |
        AI信贷审批中的种族/族裔差异。Fuster et al.(2022)发现算法贷款的民族差异小于人类信贷员;Bartlett et al.(2019)发现金融科技贷款仍存在种族gap但小于传统面审。此为分配任务+AI决策者。
      verdict: "supporting_not_counterexample"
      digestion: |
        总体证据方向支持预测(a)——AI贷款审批的群体gap小于人类信贷员。但因果归因同样面临混杂:AI模型的输入特征可能已消除了一些人类信贷员使用但AI不用的歧视性特征(如外貌/口音→此为人类决策者的额外歧视通道,非内群体偏好通道),导致AI-人类gap的归因不纯。这实际是证据的弱点(支持力度被混杂稀释),非反例。

    new_hunt_case_7_multi_agent_team_identity:
      description: |
        多智能体强化学习(MA-RL)中,AI agent被分配至不同"团队"后发展出团队内合作+团队间竞争的模式——功能上等价于"内群体偏袒"。若将此类AI用于分配/裁判任务,且其"团队身份"被感知为代理群体身份→可能构成对推论边界的有趣测试。
      verdict: "supports_prediction_iii_not_counterexample"
      digestion: |
        MA-RL中的团队身份本质上是实验者赋予的"代理群体身份"——agent被编程为优化团队奖励,非自发形成群体归属。这恰是预测(iii)的场景:AI被赋予代理身份→"内群体偏好"被重新激活。不是对预测(i)的反例。

    new_hunt_case_8_llm_political_identity_priming:
      description: |
        近期研究发现:LLM被赋予政治身份("You are a Democrat/Republican")后,在政策判断/资源分配任务中表现出与该身份一致的偏袒。若将此视为"无代理身份"(AI自主意识到的身份)而非"代理身份"(实验者赋予的标签)→可能挑战核心前提("AI无群体身份")。
      verdict: "proxy_identity_reactivation_not_spontaneous_identity"
      digestion: |
        LLM的政治身份行为变化来自明确的提示词操纵("You are a Democrat")——这是人为赋予的代理身份,恰是预测(iii)的操作化。AI没有"自发的"政治身份,其对政治身份提示词的响应是训练数据中人类政治言论模式的复现——训练数据偏见通道。两个通道均可消化此案例。真正的反例需要:AI在【无任何身份提示词】的情况下自发表现出对某一政治群体的系统性偏袒——尚未观察到此类现象。

    hunt_conclusion: |
      八条路线(复验3+新增5)无一构成scope内净杀。所有潜在反例或命中排除钩子(训练数据偏见→会证伪(a)但机制存活)、或支持预测(iii)(代理身份激活)、或面临因果归因混杂使证据方向无法确定。Amazon招聘工具和AI作文评分的群体歧视是排除钩子#1(修复后)的诚实应用场景——它们确实证伪了预测(a)的经验格局(AI gap≠0),推论的实践意义因此大幅收窄,但"内群体偏好通道被结构消除"的机制主张未被反驳。
      最干净的检验(Tajfel范式×AI分配者)仍为空白。推论的当前经验状态:理论骨架健壮+可证伪性强+直接证据缺失。这不是理论的缺陷——而是研究纲领的特征。但应将confidence评级诚实锚定于"理论推导强于经验确证"。

  non_recurrence:
    ded_004: |
      未复发(结论同Round 1,强化)。DED-004的死因是前件用结果循环定义(道德=被惩罚→惩罚定义道德)。DED-053的前件(决策者类型/目标群体身份/代理群体身份)均由实验操纵或事前独立编码确定。anti-talisman(1)(2)封堵了逆向推断路径。等效边界注册(required-1修复)进一步强化了可证伪性——(a)的null result不再可归咎于低power,等效检验要求CI足够窄方可通过。
      一个结构类似但严重程度远低于DED-004的微风险仍然存在(同Round 1判断):若操纵检验失败(各组间代理身份感知无显著差异),作者可能倾向于声称"操纵失败→无法检验(iii)"而非接受(iii)被证伪。但此风险由操纵检验预注册要求缓解。
      ⇒ 未复发。

    ded_007: |
