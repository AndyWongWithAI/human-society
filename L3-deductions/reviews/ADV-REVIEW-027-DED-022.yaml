id: ADV-REVIEW-027
type: adversarial_review
reviews: DED-022
layer: L3-deductions

人话摘要: |
  对 DED-022(大规模社会多层公平冲突推论)的 round_1 独立对抗审查。裁 verified:核心——'多层同时嵌入 + 不可通约公平标准 → 结构性层间冲突 + 个体选择偏关系更紧层'——不在任何单砖(BR-L2-004/BR-L2-006/BR-L2-017)内,合成非平凡;测量轴异源正交,anti-talisman 双向禁反推到位;无 DED-004/007 复发。反例猎捕刻意攻空格——构造六击均被已有排除钩子或 boundary 机制合法消化,未净到 scope 内活反例。3 条 should:①commensurability 二分的边界判据缺失——'同种不同权重'与'跨种'的编码手册空白;②反例猎捕暴露理论依赖'冲突几乎必然存在'这一极低测试门槛——难与非平凡贡献兼容;③判别效度未对表法律多元主义(legal pluralism)文献(Merry/Griffiths/Berman)——核心洞见'多规范秩序并存冲突'与半世纪法律人类学高度重叠,真实 delta 比声明的更窄。

target: DED-022
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。评分卡红旗 10 条逐项攻 + 反例猎捕(判 verified 前必做)+ DED-004(不可证伪循环)/DED-007(测量轴焊死)复发检查。裁决三态照评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活反例③未重蹈 DED-004/007。

round_1:
  reviewer: "独立子 Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: verified
  verdict_note: |
    这是一条【干净、无 required 缺陷、无 scope 内活反例】的候选。核心贡献——'大规模社会中多层公平标准同时嵌入 + 标准不可通约 → 冲突是结构特征非道德缺陷 + f(关系紧密度×利益)决定选择方向 + 空格:不可通约多层长期零冲突为空'——不在任何单砖内:BR-L2-004 只说 >150→层级(不说多层公平标准);BR-L2-006 只说偏袒自己人(不说多个嵌套内群体的规范冲突排序);BR-L2-017 只说语境切换(一次一个语境,不说多层同时召唤导致'一次一个语境'前提破碎)。三砖合起来【均不】给出'多层同时嵌入 × 不可通约 → 冲突不可协商化解 → 空格'这一合成效应。故核心通过了逐格判空:空格可被'≥3层+至少一对不可通约+长时段零冲突+非霸权压制'的现实反例填上、非同义反复(DED-004 未复发)。

    anti-talisman 防线到位:层数由独立制度归属记录计数、不由冲突频率反推;可通约性由独立编码员映射至 CONCEPT-fairness(e) 种、不由冲突记录反推;关系紧密度由 BR-L2-009 社会距离量表独立测、不由选择结果反推。anti-talisman_clause 明文双向禁反推:遇反例不得事后硬塞隐性霸权/隐性不可通约/隐性紧密度来消化——霸权须由独立政体指标(Polity/自由之家/镇压记录)坐实。测量轴主干正交:层数(制度归属计数)vs 冲突频率(日记法/法律多元主义双重裁决记录数)vs 选择倾向(vignette实验)——三轴异源、不共用指标(DED-007 未复发)。连续量未被硬二分(层数为计数变量、冲突频率为连续测量)、commensurability 二分的边界判据缺失记 should(见 should ①),但不构成 DED-006 级档位匹配错误。

    反例猎捕刻意攻空格——'≥3层 + 至少一对不可通约 + >20年零制度层冲突 + 无独立证据的霸权压制'。构造了六击:日本工作-生活冲突(冲突在场→支持)、北欧社民(冲突制度化渠道管理→支持而非反例)、Amish/Wisconsin v. Yoder(冲突在场→支持)、迪拜 DIFC 管辖权冲突(冲突在场→支持)、新加坡'亚洲价值'vs普通法(冲突在场→支持)、萨米/毛利/美洲原住民(条约/土地权冲突在场→支持)。六击均【未能构造出'多层+不可通约+长期零冲突+非霸权压制'的干净反例】——所有候选案例在 >20 年尺度上均有可观测的制度层冲突记录,反而支持而非证伪空格预测。但此'无可杀反例'的背面揭示了一个 should 级 discomfort:空格测试门槛过低(见 should ②)。

    综上所述,三条 verified 硬门均过:①无 required 缺陷;②反例猎捕未净到 scope 内活反例;③DED-004/007 未复发。判 verified。3 条 should 级改进不阻断 verified,完整清单见 required_fixes。

  red_flag_findings:
    brick_conclusion: |
      未命中(非平凡内核不在单砖)。逐字核查三块承重砖原文:
      - BR-L2-004:'人群超过~150人→必然出现层级结构,将决策权归并到少数人手中以降低全对等协调成本'。给了'多层何以存在'的结构前提(Dunbar→层级→多层社会),但【不说】各层的公平标准是否可通约、【不说】层间冲突的结构必然性、【不说】个体如何在多层间选择、【不说】空格。
      - BR-L2-006:'人倾向对自己所属群体成员给予优待——资源分配多给、合作中更信任、冲突中偏袒,即使群体划分基于任意标准'。给了'偏袒自己人'的引擎,但只说【单内群体 vs 外群体】、【不说】当一个人同时属于多个嵌套内群体且其规范互相打架时选哪边、【不说】内群体偏好的嵌套排序。
      - BR-L2-017:'同一群人在不同情境中切换公平分配标准(共享→平均,交易→按贡献),这是语境敏感性非文化差异'。给了'语境切换'的观测规律,但明确说【一次只在一个语境】——分晚饭与分遗产是不同时刻发生的。本条的非平凡延伸恰恰在于论证'大规模社会中一次在一个语境的前提破碎——同一时刻你既是家人又是职员,两套标准同时召唤你'——这一延伸【不在 BR-L2-017 原文内】,BR-L2-017 不讨论多层同时嵌入导致的冲突,更不讨论不可通约性。
      三砖各自贡献了发动机零件(BR-L2-004=结构前提/BR-L2-006=选择引擎/BR-L2-017=切换机制的放大基础),但【均不单独包含】'多层同时嵌入 × 不可通约标准 → 结构性冲突 + 空格'这一合成主张。故非平凡内核成立、不判 required。

    nontriviality_cell_check: |
      通过。核心空格'≥3层 + 至少一对不可通约 + 长时段(>20年) + 制度层冲突记录为零 + 无独立证据的霸权持续压制 → 预测为空'不被任何单砖平凡强制:
      - BR-L2-004 单独:>150→层级。可预测'社会分化出多层',但【不】预测'层间公平标准必然冲突'。
      - BR-L2-006 单独:偏袒自己人。可预测'内群体冲突时有偏袒',但【不】预测'多个嵌套内群体规范冲突时选择排序为 f(紧密度×利益)',更不预测'长期不可通约多层零冲突不可能'。
      - BR-L2-017 单独:语境切换。可预测'人会在不同场合用不同分配标准',但【不】预测'同一时刻多层同时召唤→冲突不可避免+长期必显化'。
      - DED-016 单独:>150→碎片化/制度化。可预测'公平模式分叉',但停在分叉点——【不】预测分叉后的稳态冲突动力学、不可通约性、空格。
      - CONCEPT-fairness(c)单独:公平有规范性。近定义砖、不给因果引擎。
      - THEOREM-position 单独:有目标+牵涉利益→有立场。近定义砖、不给因果引擎。
      六者合成才得出:'多层嵌入+不可通约+各有规范性拥护+各有立场→冲突不可协商化解→长期必然冒出来→空格'。空格属真经验主张——可被'格4条件全满足且长时段零冲突且非霸权压制'的现实反例填上,非逻辑必然、非被砖平凡强制 ⇒ 不判 required。但实操测试性低(见 should ②)。

    measurement_orthogonality: |
      主干未重蹈 DED-007。自变量与因变量异源正交:
      - number_of_embedded_layers:由个体自报或档案记录的独立制度归属计数。各层公平标准由成文规则/民族志独立编码,不由冲突频率反推。'嵌套层共享标准则不分别计数'——以独立证据确证差异为前提。IV 测法独立于 DV(冲突频率)。
      - commensurability:由两名独立编码员将各层标准映射至 CONCEPT-fairness(e) 种——同种→可通约,不同种→不可通约。编码独立于冲突频率,明文禁'因这两层经常打架就推断必为不同种'。IV 测法独立于 DV。
      - choice_tilt:关系紧密度由 BR-L2-009 社会距离量表独立测,不由选择结果反推(不得因'选了家庭'就推断'家庭必然关系更紧')。IV 测法独立于 DV(选择结果)。
      三轴异源、各自独立测、anti-talisman_clause 双向禁反推 ⇒ 不判 required。

      残留【中型软点,should】:commensurability 的判别(同种 vs 不同种)在当前 operationalization 中缺乏明确编码手册。关键边界:'家族中的按贡献(贡献于家族福祉)'与'公司中的按贡献(贡献于利润)'——两者均属 CONCEPT-fairness(e) 的'按贡献'种,理论上属可通约(同种)、但实践中贡献判据的维度不同。若编码员对此判为同种→可通约→冲突可协商——这只在'贡献'一词的语义层面成立,在制度的实际运行中两套'贡献'标准并非同一度量衡。此边界在当前 operationalization 中未给出编码决策树。不焊死测量轴(各自仍可独立测),但 commensurability 二分的可靠性是 primary_suspect 所承认的核心薄弱环节——应补编码手册(见 should ①)。

    scope_hook_independent_of_result: |
      基本不命中。excluded_outcomes 三项均由事前可测渠道划:
      (1)'单一层霸权暴力压制(极权国家),冲突未公开显现'——霸权的在场由独立政体指标(Polity/自由之家/镇压记录)测,不得因'无公开冲突'反推'必被压制'。霸权撤除/松动后仍无冲突才命中空格。钩子按事前渠道划、不按结果开脱 ⇒ 合规。
      (2)'个体消化、未升级为制度层冲突'——本条预测冲突【存在】(个体感知到困境),不预测每次升级。零冲突定义为'个体从未感知到困境 + 制度层从未产生矛盾裁决'。这是合法的 scope 限定,非事后开脱。
      (3)'仅两层嵌入且冲突可被明确法律层级解决'——两层+可通约不在核心射程内。合法的 scope 限定,事前可判。

      残留【small 软点,should ②关联】:排除钩子(1)'单一层霸权压制'覆盖面在实操中极广。Polity/自由之家此类指标测量的是【政体层面的民主/专制程度】,但'霸权压制'可以更subtle——文化霸权(Gramscian)、结构性权力(不通过公开镇压而通过塑造'可想的范围'消除冲突表达)——这些是否被 Polity 指标捕获?若不能,则在实操中'长期零冲突'可能被解释为'隐性文化霸权压制'从而合法消化,non-hegemonic 的证伪窗口变得更窄。这不是逻辑上不可证伪(DED-004 未复发),但应该诚实标注此限制(见 should ②)。不判 required。

    criterion_tier_match: |
      不命中(学到 DED-006)。各变量未硬二分:
      - number_of_embedded_layers:计数变量(整数),核心变异在 4-7 层。预测(i)使用非线性拐点(3-5层)而非二分,是连续-连续预测的形状主张。
      - commensurability:二分为同种/不同种——这是离散分类,边界案例已诚实标注('按贡献与按需在实践中可部分重叠')。若此二分的预测力不高于'连续差异度量',则推论自认退化(primary_suspect)——这是honest demarcation而非隐藏缺陷。记 should ① 补编码手册,但不判 DED-006 级档位匹配错误。
      - conflict_frequency / choice_tilt:连续测量。合规。

    anti_talisman_cashed: |
      大体兑现(should 级残留)。三个承重锚至少一个真正独立测出驱动量:
      - 举报人锚:职业守则(会计师/医生行会)和公司规章【均可在举报事件发生前独立编码】——职业守则→普遍化公平(种=程序公正/平等),公司规章→内群体公平(种=按归属/按关系)。独立编码、不由举报人最终选择反推。confidence=moderate(诚实)。
      - 孝vs法锚:儒家伦理('亲亲相隐')和国家律令【均可独立于具体案件编码】——儒家规范→按血缘(种=按归属),国家法→法律面前平等(种=平等)。容隐条款的存在由法典文本判定、不由'发生了冲突案件'反推。confidence=moderate-strong。
      - 神法vs世俗法锚:宗教饮食律(清真/洁食)和世俗反歧视法【均可在争端发生前独立编码】——宗教规范→按归属/按神圣秩序(种=按归属),世俗法→按平等(种=平等)。confidence=moderate。
      anti_talisman_clause 明文三量双向禁反推、尤禁遇反例硬塞隐性霸权——防线在位。不判 required。

      残留:驱动量对被预测量的定量驱动(vignette实验/日记法/法律多元主义双重裁决计数)在当前文件中为操作化声明多、逐案编码数据少(三锚 confidence 均为 moderate/moderate-strong,无 strong)。这是 candidate 态推论的自然状态,非缺陷。不判 required。

    anchor_fact_check: |
      无 DED-007 式致命事实错。逐锚核:
      - 举报人锚:职业伦理 vs 公司忠诚为不可通约公平标准——这是一个有效的理论映射,非事实主张。whistleblower dilemmas 真实存在且广泛记录。✓ 无事实错。
      - 孝vs法锚:儒家'亲亲相隐'与法家'大义灭亲'的张力确实是中国法律思想史的核心主题。汉律'亲亲得相首匿'、唐律'同居相隐不为罪'是真实历史事实。✓ 无误。
        但【small should】:容隐条款的存在被解释为'制度层面承认此冲突无法消除'——这是一种【解读】,非唯一可能解读。另一解读:容隐是国家对宗族权力的务实妥协(治理策略),而非哲学上承认标准不可通约。不构成事实错,但 interpretive overreach 值得注意。
      - 神法vs世俗法锚:清真/洁食法律与世俗反歧视法的冲突真实存在(欧洲的宗教屠宰案、法国头巾法等)。宗教规范以'神圣/亵渎'为轴、世俗法以'权利平等'为轴——不同判断维度属实。✓ 无误。
      三锚无致命事实错 ⇒ 不判 required。

    definition_vs_prediction: |
      通过。关键条件均有独立于结果的可操作化定义:
      - '多层嵌入':由制度归属记录计数,不由冲突频率反推。
      - '不可通约':由独立编码员对标准->CONCEPT-fairness(e)种的映射判定,不由冲突记录反推。
      - '关系紧密度':由 BR-L2-009 社会距离量表测,不由选择结果反推。
      三条核心预测均是可证伪的经验主张:
      - (i)'层数↑→冲突频率↑,3-5层出现拐点':可被无显著正相关推翻。
      - (ii)'冲突时选择偏关系更紧层':可被关系紧密度效应不显著推翻。
      - (iii)空格'多层+不可通约+长期零冲突+非霸权压制→为空':可被现实反例填上推翻。
      合规,不判 required。

    enumeration_and_species: |
      不命中(本推论非 N-species 穷举枚举结构,是一个机制理论 + 空格预测)。
      但按 DED-008 精神,主动探'第 N+1 层类型':作者枚举的层为家族/社区/公司/行业/国家/宗教,覆盖了主要制度归属。可能遗漏:(a)市场本身作为一层——市场有自身的公平标准(自愿交易=公平、供需定价=公平),不同于'行业/职业共同体'的标准;但'市场'不是个体可'归属'的制度实体(个体不'属于'市场),故按 operationalization 的'按制度/组织归属识别'判据,不构成严格意义上的层。此不构成 missing species。
      另探'不可通约'判据是否漏类:当前只按 CONCEPT-fairness(e) 的种(平等/按贡献/按需/按资历/程序)来区分。但两标准即使属同一种(如同为按贡献)、若贡献的度量衡不可比较(家族贡献=生育/情感/照顾老人 vs 公司贡献=产出/利润/加班),实质上也可能是不可通约的。当前 operationalization 将此类归为'同种不同权重→可通约',但实际操作中此判定的编码员间信度可能极低。这在 primary_suspect 中已被作者诚实标注为最弱腿,不构成隐藏的第 N+1 个漏洞。

    primary_suspect_aim: |
      【指对,但漏了更棘手的隐腿——should】。文件自认最弱腿(primary_suspect):'不可通约性操作化为两标准属不同种,若实证显示不同种与同种权重差异在预测冲突上无区分力→推论退化为不同群体有不同规范所以偶尔摩擦的平凡复述'。——正确!这正是整条推论坍塌的关键落点。

      文件自认 secondary_suspect:'f(紧密度×利益)权重函数——紧密度和利益是否可独立测'。——也正确。

      但我发现一条文件【未认但同样棘手的隐腿】:commensurability 二分的【编码手册缺失】。当前 operationalization 说:两名编码员将各层标准映射至 CONCEPT-fairness(e)的种→同种=可通约、异种=不可通约。但'家族中的按贡献'与'公司中的按贡献'——同属 equity 种,判为可通约——然而两套'贡献'的实际度量衡(家族=情感/照顾/生育,公司=产出/利润/KPI)完全不可比较。若编码员将此类判为同种→可通约,则 theory 会系统性低估不可通约性——因为多数现代制度层的公平标准在抽象层面都声称基于某种'贡献'或某种'平等',跨种的'结构断崖'实际上被语义共性掩盖。这使 primary_suspect 的'不同种 vs 同种权重差异'检验在实操中偏向虚无假设(无区分力)→推论坍缩——不是因为理论错,而是因为编码手册模糊导致 misclassification。此风险比 primary_suspect 承认的更致命——primary_suspect 假设'不同种'可被可靠识别,但如果不先解决编码手册,则实证永远无法公平测试理论。故应在 falsification_trace 增设 tertiary_suspect 或至少将编码手册缺失列入 measurement limitations(见 should ①)。

      上位泛化检查:抽掉'不可通约'机制和'空格'预测后,本推论退化为'大社会中人的多重角色产生规范冲突、人倾向选亲近群体'≈ 角色冲突(role conflict, Merton 1957)+ 内群体偏好(BR-L2-006)的平凡组合。但作者【已诚实执行此平凡化检查】(discriminant_validity 段对表 Merton;nontriviality_test 段检查平凡退化路径)并展示退化的确切条件(不可通约无额外预测力→坍为常识)。防线在位。
  counterexample_hunt: |
    主动构造 falsifiability(a) 核心靶——'成员嵌入≥3层社会层(家族+职场+国家,各自独立可证) + 至少一对层的公平标准经独立编码为不同种(不可通约) + 长时段(>20年)制度层面的公平冲突记录为零 + 无法归因于单一层霸权压制(霸权的在场须由独立政体指标坐实)'——的干净案例,刻意攻空格。

    构造了六击,按由强到弱:

    ①当代日本的工作-生活平衡冲突【被消化,反成支持】:日本工薪族嵌入家族(kinship fairness/按需)、公司(ingroup fairness/年功序列=按资历)、国家(equality/procedural fairness)三层——家族与公司的公平标准不可通约(按需 vs 按资历,不同种)。制度层冲突【在场且显著】:过労死(karoshi)诉讼(家族公平 vs 公司公平的制度冲突)、育児介護休業法立法(国家干预缓解层间冲突)、'ワーカホリック'社会讨论。>20年尺度上制度冲突持续、不可消化为空格反例。⇒ 支持理论(冲突在场→空格维持为空)。

    ②北欧社会民主国家(瑞典/挪威,约1970s至今)【被消化,反成支持】:强福利国家(egalitarian fairness/按需)、强职业规范(merit/contribution fairness/按贡献)、强家族规范(kindhip/按需)。至少一对不可通约(国家平等 vs 职业贡献,不同种)。制度层冲突【在场但被渠道管理】:育児休暇政策辩论(家庭时间 vs 职业连续性的公平)、移民融合辩论(文化公平 vs 公民平等的不可通约)、労働市場規制(集体谈判 vs 个体契约自由)。冲突以制度化形式持续存在(议会辩论/勞工法院/ombudsman)——【非零冲突】,支持而非证伪空格。此案例也展示 theory 的微妙处:冲突可能以低烈度、高制度化的形式持续,而非'爆发或为零'的二分——这是 should ② 的关切。

    ③Amish/再洗礼派在美国(约1900s至今)【被消化,反成支持】:Amish 嵌入家族/教会(religious fairness/按神圣秩序)、美国国家(secular equality/procedural fairness)——不可通约。且由联邦制+宗教自由宪法保障→非单一层霸权压制(美国政体为民主制,Polity 高分)。制度层冲突【在场且显著】:Wisconsin v. Yoder(1972,强制教育→宗教自由 vs 国家教育标准的公平)、社会保障免除(Social Security exemptions,1965 Medicare/Medicaid 立法中的 Amish 例外)、军事服役免除——每一次豁免立法/判决=制度层冲突的正式表达。>20年尺度多次制度冲突,空格维持为空。⇒ 支持理论。

    ④迪拜/阿联酋的多重法律体系(DIFC courts vs Dubai courts vs Sharia courts,约2004至今)【被消化,反成支持】:个体嵌入家族(Sharia-based fairness/按神圣秩序)、职场(DIFC common-law fairness/按程序)、国家(Emirati vs expatriate 不同法律身份=按归属)。不可通约在制度层以【平行法院体系】的形式被正式承认。制度层冲突【在场】:DIFC vs Dubai courts 管辖权争议(如 DIFC-LCIA 仲裁案的执行管辖)、Sharia 继承法 vs DIFC 遗嘱注册的冲突——这些都是同一案件/案由的双重裁决张力。冲突以制度化形式存在、非零。⇒ 支持理论。

    ⑤新加坡'亚洲价值'治理(约1990s至今)【被消化,反成支持】:嵌入家族(Confucian filial piety=kinship fairness/按归属)、职场(meritocracy=contribution fairness/按贡献)、国家(common law equality/procedural fairness)。不可通约对:家族(kinship)vs 国家(equality)。制度层冲突【在场】:Maintenance of Parents Act(1995,立法强制子女赡养——家族公平绑架国家法);Section 377A 辩论(2007-2022,宗教公平 vs 世俗平等的长期制度冲突);GRC(集选区,ethnic representation vs individual equality 的持续张力)。>20年持续制度冲突、非零。⇒ 支持理论。

    ⑥萨米/毛利/美洲原住民的传统治理 vs 现代国家法【被消化,多例均反成支持】:萨米(Sami)在挪威/瑞典/芬兰嵌入传统 siida 体系(customary fairness/按归属+按需)、Nordic welfare state(egalitarian fairness/按平等)、market/professional norms。不可通约明确(传统 customary law vs 国家法,不同公平判据维度)。制度层冲突【在场且制度化】:Sami 土地权诉讼(如 Taxed Mountain Case,1981,瑞典)、Finnmark Act(2005,挪威)、ILO 169 公约履行争议。>20年尺度,冲突持续、制度表达丰富。同样:毛利 Waitangi Tribunal、美国原住民 tribal sovereignty 判例(如 McGirt v. Oklahoma,2020)——均为制度层冲突的持续在场。⇒ 支持而非证伪空格。

    【结论:未净到 scope 内活反例】。六击的所有候选案例在 >20 年尺度上均【有可观测的制度层冲突记录】——空格维持为空是 empirical observation,非 unfalsifiable 的 tautology。这一结果支持理论核心的稳健性。

    但此结果也揭出一个 should 级 discomfort:空格测试的【门槛极低】——'>20年制度层冲突记录为零'在当代复杂社会中近乎不可能,因为任何多制度社会在 >20 年尺度上必然产生某种制度层面的规范张力记录(一次诉讼、一次立法辩论、一次行政复议即满足'非零')。若'非零冲突'的操作化门槛如此之低(一个案例即破零),则空格预测近乎 vacuously true——不是因为理论深刻,而是因为'零冲突'在复杂社会中根本就不存在(无论理论对不对)。此与 falsifiability(a) 作为'最强证伪形式'的地位存在紧张——the theory 的 true test 不是'空格是否为空'(它几乎必然是空的),而是'冲突烈度/频率是否如 theory 预测的那样随层数和不可通约性递增'。这是一个 should 级 humility note,不杀核心(见 should ②)。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发】。falsifiability(a) 给出明确证伪条件——找到'≥3层 + 至少一对经独立编码为不同种的不可通约标准 + >20年制度层零冲突 + 霸权不在场(由独立政体指标测)'的现实案例。这一格在逻辑上可被填上、非同义反复——与 DED-004 的'所有新意被实证推倒、改措辞也救不活'的本质不同。

    进一步排查是否残留 DED-004 式'事后开脱'活门:
    - anti_talisman_clause 明文禁'遇反例硬塞隐性霸权/隐性不可通约/隐性紧密度来消化'——防线在位。
    - excluded_outcomes(1)的霸权在场由独立政体指标测,不由'无冲突'反推——循环读法被堵。
    - '不可通约'由独立编码员映射判定,不由冲突记录反推——循环读法被堵(与 DED-004 的错误模式有本质区别,那里是将定义与结果绑定)。
    - 空格测试窗口实操窄(should ②),但那是测试窗口窄的问题,非逻辑上不可证伪 ⇒ DED-004 未复发。

    DED-007(焊死测量轴):【未复发】。三轴异源:
    - number_of_embedded_layers:制度归属记录计数(IV),不由冲突频率(DV)反推。
    - commensurability:独立编码员映射(IV),不由冲突记录(DV)反推,不由'选哪边'(DV)反推。
    - relationship closeness:BR-L2-009 社会距离量表(IV),不由 choice_tilt(DV)反推。
    三轴均各有独立测量源,无 DED-007 式'分母用实际获授者、自变量偷用结果测'的焊死。anti-talisman_clause 双向禁反推,封堵了'因冲突高所以层数多/因选家庭所以家庭近'的焊死路径。

    残留:commensurability 的'不同种'判定与层数计数的关系中,存在一个 subtle 耦合——'每层须有独立可查的公平标准'是计数前提,而这个前提判定依赖与 commensurability 共享的'各层公平标准编码'环节。这不等于焊死(顺序上先计数层、再两两比可通约性,而非反过来),但两环节共用同一编码数据源。这是正常的数据依赖,非 DED-007 型焊死 ⇒ 不判复发。

  required_fixes:
    - |
      [should] 补全 commensurability 编码手册,含边界案例的判定决策树。当前 operationalization 只说'两名独立编码员将标准映射至 CONCEPT-fairness(e)种→同种=可通约、异种=不可通约',但未提供关键的边界判定规则:'家族中的按贡献(贡献于家族福祉)'与'公司中的按贡献(贡献于利润)'——同属 equity 种,但贡献的度量衡完全不同(情感/照顾/生育 vs 产出/KPI)。若编码员按'表面同种'判为可通约,则 theory 系统性地低估了不可通约性——因为现代制度的公平标准在抽象层面大多声称基于某种'贡献'或某种'平等'。这直接威胁 primary_suspect 的实证检验力。建议:(a)提供判定决策树区分'同种同度量衡''同种不同度量衡''跨种',(b)明确定义'度量衡'的事前可编码标准(如贡献的计量单位/评价主体/时间跨度),(c)增加编码员间信度(IRR)的要求(如 Cohen's κ≥0.7 作为编码合格门槛)。不补则 commensurability 的测量可靠性无法评估、推论的关键预测无法被公平测试。
    - |
      [should] 诚实标注空格测试的低门槛与 theory 非平凡性的紧张关系。反例猎捕揭示:在当代复杂社会中,'>20年制度层零冲突'近乎不可能——任何多制度社会在>20年尺度上必然产生至少一次诉讼/立法辩论/行政复议(即'非零')。这意味着空格的'空'在很大程度上是【社会复杂性本身的 artifact】而非 theory 独立预测力的证据。若'零冲突'的操作化门槛低至'任何制度层冲突记录即破零',则空格预测的 falsifiability(a) 作为'最强证伪形式'的实质检验力极弱——不能区分'理论对'与'社会必然复杂到有冲突'。建议:(a)在空格论证段诚实标注此限制——空格维持为空是 observed fact 但证伪门槛过低,不能独立承载理论非平凡性;(b)明确 theory 的 true test 是预测(i)(ii)的量化主张(层数-冲突非线性拐点、紧密度效应),而非空格的定性存在;(c)考虑提升空格的操作化阈值(如'烈度>X的制度层冲突记录为零'而非'任何记录为零'),使空格从 vacuous truth 变为 risqué test。
    - |
      [should] 补 discriminant_validity 对法律多元主义(legal pluralism)文献。当前 discriminant_validity 只对表了角色冲突(role conflict, Merton 1957)和 DED-016。但法律多元主义(legal pluralism)——从 Griffiths(1986)'What is Legal Pluralism?'、Merry(1988)'Legal Pluralism'、到 Berman(2012)'Global Legal Pluralism'——的核心洞见恰是'多个规范秩序在同一社会空间共存、交互、冲突',且已发展半世纪。DED-022 宣称的'多层公平标准并存且不可通约'与此高度重叠。theory 的真正 delta——相对法律多元主义文献——不是'多个规范秩序存在',而是(i)将冲突锚定到 CONCEPT-fairness(e)的种结构(非仅描述多元性),(ii)给出可证伪的结构预测(层数-冲突非线性+空格),(iii)f(紧密度×利益)的选择函数。建议比照对 Merton 的处置,新增对 Griffiths/Merry/Berman 的判别段,诚实收窄 delta 到上述三条并注记:法律多元主义已为'多规范共存冲突'提供丰富案例和框架,DED-022 的增量是将其形式化为可证伪的结构预测体系。
    - |
      [minor] falsification_trace 增列 tertiary_suspect:commensurability 编码手册缺失 → 实证检验力稀释。primary_suspect 正确指出'不同种 vs 同种权重差异若无区分力→推论坍缩'。但此检验的前提——'不同种'能被可靠识别——因编码手册缺失而未满足。若'家族 equity'与'公司 equity'被系统性地误判为同种(因表面共享 equity 标签),则实证将偏向'无区分力'(因为实际不可通约的层对被分到了可通约格,污染了对比)→推论坍缩——不是因为理论错,而是因为测量噪声淹没了信号。这比 primary_suspect 假设的更致命:primary_suspect 假设测试是公平的,但编码手册缺失使测试注定偏向虚无。建议在 falsification_trace 增设:'tertiary_suspect:commensurability 编码手册缺失 → 关键变量 misclassification → 实证测试的公平性未保障。修正路径:先完成 should ① 的编码手册+IRR 达标,再评估 primary_suspect。'

