round_3:
  reviewer: "独立子 Agent (round 3, 全新独立上下文, 与 round_1/round_2 审查者无关)"
  verdict: needs_revision
  verdict_note: |
    本审查者独立核对了 BR-L2-009/BR-L2-011/DED-051 三份文件,独立执行了 13 条红旗逐条攻 +
    反例猎捕 + DED-004/007 复发检查。

    【总体判断】round_2 的 needs_revision 裁决成立。DED-051 自 r1 以来【从未修订】——r1 的
    8 条 should、r2 的 11 条 should(含新增 3 条)至今无一落地。review_summary 如实记录了
    "r1的8条should未修订"和"r2的11条should未修订",但实体正文保持原状。三轮审查面对的是
    同一份文本。核心机制骨架——BR-L2-009(信任有界+衰减)× BR-L2-011(通货=记忆替代)→ 社会
    距离谱上的三通货生态区间——仍然是 genuine 的非平凡推理,★格(中距离→社区货币最优)不在
    任一块单砖中。但三轮未修订的累积效应正在改变审查的实质:当操作化/实证锚/口径注册层面的
    已知缺口(共 11+ 条)历经两轮审查明确指认后仍未修补,这些缺口的性质正从"待改进"滑向
    "作者事实放弃修补"——虽未改变 verdict(仍可修),但加重了每一轮审查的重复成本。

    【本轮独立新增 3 条 should,未发现新的 required 级缺陷】

    (A)【should,本轮新增】"弱关系→同乡/同业/同好"的映射是构念替代(construct substitution)
    而非仅标签偏移:BR-L2-009 formal statement 的"弱关系"(weak ties, Granovetter 传统,指互动
    频率/强度/亲密度)与 DED-051 的"同乡/同业/同好"(共享群体身份,指范畴性归属)测量的是
    不同构念——前者是关系属性(relational property),后者是范畴属性(categorical property)。
    举例:同属一个行业协会但只见过一次面的两人=共享身份+弱关系;童年好友但不同乡=强关系+
    无共享地域身份。DED-051 的区间 II 捕获的是"共享身份"而非"弱关系"——这两个集合有交集
    但不重合。r1 称"映射偏移"、r2 称"标签不一致",均低估了问题的深度:这不是换个标签就能
    解决,而是推论的区间划分轴(X 轴)所使用的构念与承重砖 BR-L2-009 的构念分属不同类型。
    诚实做法:(a)在 derivation 中承认本推论的"社会距离"操作化采用共享群体身份维度(不同于
    BR-L2-009 的关系强度维度),(b)论证为什么共享身份是"信任不完全但记忆开始不可行"这一
    中间地带的合理代理(共享身份→弱关系概率高,但非必然)。此条不升格为 required 因为:共享
    身份与弱关系高度相关,且三区间的逻辑推演不依赖二者严格等同——只需存在一个信任与记忆
    均不完全的中间地带,无论它由共享身份还是弱关系定义。

    (B)【should,本轮新增】"不由技术设计决定"在 statement 中的措辞歧义:当前 statement 写
    "社区货币的规模上限(成员数、交易量、存续时长)不由技术设计决定,而由该社区的信任衰减
    梯度(BR-L2-009)决定"。粗读产生歧义——"不由技术设计决定"似在说技术设计对规模【完全】
    没有影响,但 excluded_outcomes 澄清"技术设计是'区间内爬多高'的变量,信任衰减梯度是
    '区间天花板在哪'的变量"。两个陈述合起来才是完整主张(天花板=纯梯度,实际规模=天花板∩
    设计效率),但 statement 的孤立措辞可能被误读为"规模纯由梯度决定"。宜在 statement 中
    将"规模上限"与"实际规模"的区分说清楚,或将 excluded_outcomes(1)的关键澄清合并入
    statement 正文,防止读者截取半句形成错误印象。

    (C)【should,本轮新增】天花板的不对称可观测性问题:推论的核心主张是梯度决定规模【上限】
    (ceiling),但 operationization 测量的是实际规模(存续时长、交易量、成员数)。在经验上,
    我们只能观测实际规模 ≤ 天花板。若实际规模 < 天花板(因技术设计未优化/外部冲击/发起人
    退出等原因),我们无法判断天花板本身在哪里——天花板在此情况下是不可观测的理论构念。
    唯一能接触天花板的观测是 falsifiability(c):找到一个实际规模【突破】了推论预测的天花板
    的社区货币——即 ceiling 被 upward violation 证伪。这意味着推论的经验内容是不对称的:
    "梯度越陡→天花板越低"这个正项主张只有否定例(counterexample)才能检验,正项证据
    (锚的"区间 II 稳态存在")只展示一致性(consistency)而非因果验证。这不影响可证伪性——
    Popper 意义上的证伪只需要否定例的存在可能性——但需在 limitations 中诚实标注:正项证据
    的类型是 consistency evidence(与预测方向一致)而非 causal evidence(独立测梯度+排除竞争
    解释后验证梯度→规模的因果链)。此标注与 r1/r2 的"三锚梯度为事后归因"的 should(1)互补:
    (1)说的是锚的测量质量问题,本条说的是正项证据类型的结构性限制。

    【r1/r2 的 should fixes 现状】r1 的 8 条+r2 新增 3 条=11 条 should,至今零修补。按紧急度
    排:(i)梯度连续化/阈值动机(r1-5+r2强化)——修复后直接影响预测(b)的可操作性;(ii)Bristol
    Pound L4-009 反向裁决+挂钩 continuum 预注册(r1-4+r2强化)——关切口径注册的规范性;
    (iii)"同乡"档收窄/构念替代标注(r1-3+r2-10+r3-A)——关推导透明度和区间 II 覆盖范围;
    (iv)日本锚方向性张力(r2-9)——关预测(b)的单调解读;(v)三锚诚实标注(r1-1);(vi)WIR 降
    级+拆分(r1-2);(vii)软约束→硬天花板标注(r1-6);(viii)falsifiability(a)操作化(r1-7);
    (ix)区间 II species 讨论(r1-8);(x)falsifiability(c)10年阈值动机(r2-11);(xi)"不由技术
    设计决定"措辞(r3-B);(xii)天花板不对称可观测性(r3-C)。总计 12 条 should。建议修订时
    优先处理(i)-(iv),它们对推论的经验可检验性影响最大;其余可随后处理。

    【能否判 verified?】不能。虽然 0 条 required、无净杀反例、DED-004/007 未结构性复发,但
    (a)12 条 should 的累积操作层缺口使推论的经验形态远未闭合——在现状下判 verified 等于
    给一份操作化未完成/锚点未诚实标注/口径存在 L4-009 模式风险的文本盖 verified 章;
    (b)三轮未修订本身不改变 verdict(不因此降格为 rejected——核心机制没有塌),但需明确:
    这些 should 不是装饰性建议——其中梯度阈值/事后口径/构念替代三条触及推论的可操作性
    和推导透明度,继续置之不理将有损体系的方法论信用。

  red_flag_findings:
    brick_conclusion: |
      独立重验(第三轮),攻不穿。逐词重核 BR-L2-009 与 BR-L2-011 全文:
      - BR-L2-009(verified, IEA=2.0):全文不含"通货""货币""社区货币""LETS""生态位"
        "区间""天花板""梯度决定规模"。该砖是纯信任命题,仅主张"有界+随社会距离衰减"。
      - BR-L2-011(verified, IEA=1.9):全文不含"社会距离""信任梯度""生态位""社区货币"
        "三区间""同乡""天花板"。该砖是纯功能命题,仅主张"匿名/不可追踪→需当场两清媒介
        替代缺失的记忆"(D2 单一功能)。
      DED-051 的非平凡内核——"社会距离谱上的三通货生态区间,区间 II=社区货币的专属生态位,
      天花板由信任衰减梯度决定"——确为两砖合力的真组合增量。两砖均有独立于 DED-051 的
      存在理由(演化生物学+博弈论+文化普适 vs Kocherlakota 定理+经济人类学)。r1/r2 在此
      红旗上的判断我全盘确认。
      唯一边缘注意:BR-L2-011 statement(a)"有共享记忆/身份可追踪的圈子内...不必然需要流通
      通货"与"区间 I=通货冗余"近义;statement(b)"匿名/不可追踪...需当场两清媒介"与"区间
      III=通货必需"近义。但这两格不是 DED-051 的非平凡核心(标★格是中距离→社区货币),
      author 在 nontriviality_test 中也诚实标注了。未构成 brick=conclusion。
      ⇒ 不判 required,不判 should。

    nontriviality_cell_check: |
      独立重验(第三轮),攻不穿。2×3 逐格判空表:
      - 格(低距离, 无通货):BR-L2-011 已暗示"记忆可行则通货冗余",非平凡性低。author 诚实标注。
      - 格(中距离, 社区货币)★:核心非平凡格。BR-L2-009 不讲通货形态,BR-L2-011 不讲社会
        距离分层。两块砖各自独立时无法推出"中等社会距离区间内社区货币是最优通货形态"。
        该格可被"所有中等距离交换均由纯互惠或法币充分覆盖,社区货币从未独立存活≥5年"
        的经验发现证伪。genuine 经验赌注。
      - 格(高距离, 法币):BR-L2-011 已覆盖"匿名交换需要通货",但对"为什么必须是法币而非
        社区货币"沉默。DED-051 的制度基础设施论证(法律强制/央行最后贷款人/存款保险)为
        该格增加了独立理论内容。
      - 格(高距离, 社区货币不可行)★:第二标星格,需要两砖合力+制度基础设施额外论证。
      ⇒ 不判 required,不判 should。

    measurement_orthogonality: |
      独立重验(第三轮),未重蹈 DED-007,攻不穿。
      自变量:(i)社会距离——亲缘系数/交互频率/共享群体身份(事前行为指标,非通货数据);
      (ii)信任衰减梯度——信任博弈实验(委托人转交金额占比,行为测量)。因变量:社区货币
      存续时长+交易规模——公开记录/年报/案例研究(档案数据,独立于行为实验)。自变量与
      因变量使用不同构念、不同测量工具、不同数据生成过程,构念层面异源正交。与 DED-007
      的"通货需求用货币量测"的焊死有本质区别。
      实操担忧(与 r1/r2 一致):信任博弈实验在已有社区货币的社区中可能受内生影响——参与者
      的信任行为被其社区货币经验污染。但这是测量执行的 confounding,非构念焊死,可通过
      纳入非货币社区作为对照缓解。
      ⇒ 不判 required,不判 should。

    scope_hook_independent_of_result: |
      独立重验(第三轮),攻不穿。四项 excluded_outcomes 按事前结构特征划定:
      (1)技术设计=效率变量(区间内)vs 梯度=天花板变量(跨区间)——按理论内部角色划分,
      不由社区货币成败回填。
      (2)法币在区间 I 的使用→因惯性/便利性/外部连通性,预注册不证伪。核心主张明确限定
      为区间 II 的存在性,不依赖"区间 I 禁止法币"。
      (3)加密货币/区块链→按信任机制类别(社会信任 vs 密码学信任)的事前结构特征排除。
      边缘注意:digital community currency(Sardex 电子账本)与 blockchain-based community
      token 的实操界线未注册——两者都数字化但信任基础不同,宜补一个 operational discriminant。
      (4)法币崩溃时的临时替代→按"稳态 vs 临时真空期"结构判据,且给出可检验辅助预测
      (法币恢复后回缩至区间 II)。
      ⇒ 不判 required,不判 should。

    criterion_tier_match: |
      独立重验(第三轮),仍为 should。社会距离四档→三通货区间的 4→3 映射概念合理
      (血亲+熟人合并为区间 I)。信任衰减梯度三分(陡峭/中等/平缓)的 15/30pp 阈值无理论
      或经验锚定——r1/r2 均已指出,强烈推荐改为连续方案(单调负相关)。本轮额外指出:
      若保留三档,15/30pp 不仅无理论动机,还恰好踩在 BR-L2-009 honest_note 的红线
      ("不可依赖某个具体阈值")上——连续方案是双赢:绕过阈值问题+尊重砖的 guardrail+
      更干净的可检验预测。
      ⇒ 不判 required,记 should(继承 r1-5+r2 强化+r3 重申推荐连续方案)。

    anti_talisman_cashed: |
      独立重验(第三轮),概念层在位但锚上执行缺位(should,与 r1/r2 一致)。四条禁令
      (禁由成败反推梯度/禁由失败反推梯度陡峭/禁以"成员少"代理"梯度陡峭"/禁见通货
      数据后重编码社会距离)在概念层有效且完整。至少一个承重锚真独立测出驱动量:
      trust game 在方法论层面可独立测梯度,但三个 supporting anchor 无一展示了实际独立
      梯度测量——WIR 的梯度归因是事后推理,Trueque 的梯度归因是叙事重构,日本案例的
      "梯度平缓"是 folk theory。anti_talisman_clause(4)要求的"至少有一个锚点真正做到
      在同一社区内用信任博弈实验测出相邻社会距离档的信任落差"至今未兑现。
      本轮额外注意:若信任博弈实验因成本/伦理/可及性在大多数社区货币所在社区中无法
      执行(这是现实可能——社区货币多发于边缘社区/危机环境,实验经济学家不易到达),
      则 anti-talisman 的"梯度独立测量"要求在实践层面可能空洞——推论需要一个实际可行
      的梯度测量方案作为 fallback(如 WVS 分项调查+行为博弈的替代 protocol)。
      ⇒ 不判 required,记 should(继承 r1-1)。

    anchor_fact_check: |
      独立重验(第三轮),无 DED-007 式致命事实错,三锚各有过度解读(与 r1/r2 一致)。

      逐项独立核查:
      (1)瑞士 WIR(1934 至今):~5 万家 SMEs/~90 年存续/WIR 法郎与 CHF 关联但二级市场
      有~2-5%折扣→部分独立于 CHF。事实正确。"从未扩展到非瑞士/非 SME"作为梯度天花板
      证据时,author 诚实标注了章程自限——"给鸟笼加锁后声称鸟没飞走证明飞不高"(r1 比喻),
      章程限制与梯度天花板的贡献比例未剥离。90 年存续本身支持区间 II 稳态存在性(即使有
      人为边界,系统在边界内长期稳态运作是事实),但规模上限的归因不可靠。
      (2)阿根廷 Trueque(2001-2003):~6000 俱乐部/~250 万人/2002-2003 崩溃。事实正确。
      "初始区间 II→规模膨胀进入区间 III→匿名涌入→欺诈→崩溃"的叙事方向与推论一致。
      但 2001 年阿根廷经历了货币局崩溃+银行冻结+主权违约三重极端冲击——在如此极端的
      条件下,trueque 的崩溃多少归因于梯度天花板 vs 归因于"任何非主权通货在那种极端
      条件下都会面临的信任危机"不可知。因果归因过强,confidence 宜降为 weak。
      (3)日本社区货币(Peanut/府中市等):数十年存续/数百至数千人。事实正确。但"日本梯度
      平缓"是 folk theory,未引用独立梯度测量。且"梯度平缓→存续长久"与"梯度平缓→替代
      竞争加剧→规模受限"之间的方向性张力未解决(见 r2 新增 B 及本轮 counterexample_hunt
      的独立验证)。
      Bristol Pound/Sardex/贸易信贷/ROSCA 见 counterexample_hunt。
      ⇒ 无致命事实错。记 should(继承 r1-1/r1-2/r2-9)。

    definition_vs_prediction: |
      独立重验(第三轮),攻不穿。社会距离(行为指标编码——亲缘系数/交互频率/共享群体
      身份)和信任衰减梯度(信任博弈实验测量)是可操作化的构念定义,不构成会导致同义反复
      的加厚定义。三个 falsifiability 条件各有明确 observable condition,不是"预测成立则
      条件满足、不成立则条件不满足"的定义循环。anti_talisman_clause(4)在概念层防止了
      社会距离编码被通货数据事后滑移。
      边缘风险(与 r2 一致):若 trust game 实验参数(初始 endowment/匿名性/单次 vs 重复)
      未预注册,不同实验设计可能给出不同的梯度读数→条件可通过实验设计选择被间接操控。
      但这是测量标准化问题,非定义-预测混淆。
      ⇒ 不判 required,不判 should。

    enumeration_and_species: |
      独立重验(第三轮),仍为 should。三区间(I/II/III)按 umbrella criterion——社会距离谱
      位置与互惠记忆可行性——定义,符合 DED-008 要求(species 按伞级判据本身定义,非替代
      表征)。区间 0(核心家庭共享而非交换)可视为区间 I 的子类,minor concern。

      独立主动猎第 N+1 类,本轮新增两个未覆盖的区间 II 机制:
      (a)双边互惠伙伴关系(bilateral reciprocity partnerships,如东非畜牧民的 stock
      friendship/Kenya 的 osotua/蒙古的 anda):非血亲、非同乡,而是通过仪式/盟约建立的
      一对一纽带——社会距离在熟人之下但非血亲,不发行通货但承担风险分担+跨期交换功能。
      这类关系恰落在区间 I-II 的模糊边界:信任高于同乡但交换范围限于一对一。
      (b)数字平台的声誉通货(reputation currencies,如 eBay 卖家评级/Uber 司机评分):
      完全匿名的区间 III 环境中,声誉分数充当了准通货功能(高评分=更易获得交易机会,
      实际上是声誉→经济价值的兑换)。虽非法定通货也非社区货币,但作为"匿名环境中的
      信任替代"在功能上与社区货币存在范畴竞争——社区货币通过"群体身份+互惠清算"替代
      信任,声誉系统通过"个体历史+平台强制"替代信任。两者是否属于同一个更高层级的
      "信任替代机制" genus,还是互斥的 species,值得在 boundary_cases 中讨论。

      r1/r2 猎的贸易信贷/ROSCA/Sardex 我独立确认存在且相关。
      ⇒ 不判 required,记 should(继承 r1-8+本轮补充)。

    primary_suspect_aim: |
      独立重验(第三轮),primary_suspect=BR-L2-009 的可测量性与跨社区差异性——指得准:
      若梯度无法可靠测量或跨社区无显著差异,预测(b)不可执行。

      r1 的 4 个漏认弱点 + r2 的 2 个新增弱点 + 本轮独立确认的 1 个额外弱点,合计 7 项:
      (a)"软约束→硬天花板"升级未在 primary_suspect 中承认(继承 r1-6);
      (b)"同乡"=弱关系的构念替代未在 primary_suspect 中承认(继承 r1-3+r2-10+本轮强化);
      (c)falsifiability(a)可操作性低(继承 r1-7);
      (d)三锚未展示独立梯度测量(继承 r1-1);
      (e)BR-L2-009 内部标签不一致,推论跟了非正式标签(继承 r2-10);
      (f)日本锚方向性张力(继承 r2-9);
      (g)【本轮新增】梯度测量的低成本替代方案缺位:若 trust game 在目标社区不可执行
      (最常见情况),推论需要一个实际可行的梯度估计方案——如利用 WVS 的"大多数人可信吗"
      分城乡/分职业交叉表作为代理,或利用实验经济学中跨文化 trust game 的 meta-analysis
      结果(如 Johnson & Mislin 2011 的 162 个实验的汇总)建立预期梯度范围。目前
      operationization 只给了 gold-standard 方法(trust game),未给现实可行的 fallback,
      使 primary_suspect 的实际可检验性打了折扣。
      ⇒ 不判 required,记 should(继承前述各项+本轮新增 g)。

    caliber_registration_ambiguity: |
      独立重验(第三轮),仍为 should(与 r1/r2 一致)。社会距离四档有具体编码规则,梯度有
      三档阈值,存续时长有 t_end 判定(连续 12 月无记录),交易规模有 12 月窗口——基础口径
      已注册,比许多推论做得好。

      独立发现三处歧义(确认 r1/r2 的判断):
      (a)Bristol Pound 的"1:1 挂钩=非独立通货"排除判据属事后口径选择,触 L4-009 判例
      模式。按评分卡第 11 条,事后口径选择一律反向裁决——布里斯托尔镑应计为对 prediction
      (c)的边界压力,不得以事后口径消化。且该排除若严格执行会波及 WIR(WIR 法郎与 CHF
      有折价但参照 CHF)和多数 LETS(以法币参照定价)。宜预注册"挂钩程度 continuum"
      (完全挂钩/半挂钩/完全独立)并说明 continuum 上各点的理论含义。
      (b)"共享群体身份"档内方差未注册:同镇(高相互识别)vs 同城(低相互识别)/同宗教
      集会(高情感亲密)vs 同兴趣社群(低情感亲密),信任属性质异但归入同一档。
      (c)信任博弈实验参数(初始 endowment/匿名性条件/单次 vs 重复/参与者是否是社区货币
      成员)未注册——不同参数给不同梯度读数。
      (d)【本轮补充】≥10 年门槛未注册理论动机(与 r2-11 联动):为什么存续≥10 年才算
      "稳态"而非 5 年或 15 年?若此阈值无动机,布里斯托尔镑的 5-6 年活跃期与 10 年门槛
      之间的 4-5 年差距就是 author 的口径选择自由度——调低到 5 年→净杀,保留 10 年→消化。
      ⇒ 不判 required(核心构念已注册基础口径,非"只有数字没有口径"),记 should
      (继承 r1-4+r2-11+本轮补充 d)。

    data_source_common_root: |
      独立重验(第三轮),N/A。本推论不涉及多数据源验证——梯度来自 trust game/WVS,
      货币数据来自公开记录/年报/案例研究,是不同的数据生成过程,不存在"多源共享同根"问题。
      ⇒ 不判 required,不判 should。

    api_access_vs_epistemic_independence: |
      独立重验(第三轮),N/A。本推论不涉及 API/MCP 查询声称多源独立。
      ⇒ 不判 required,不判 should。

  counterexample_hunt: |
    独立执行第三轮反例猎捕。三条攻击路径(与 r1/r2 一致):
    (a)区间 II 空集——所有中等距离交换由纯互惠或法币覆盖;
    (b)梯度不决定天花板——陡峭梯度+大规模社区货币;
    (c)匿名规模社区货币——成员互不认识+存活≥10 年+交易增长。

    【r1/r2 已猎案例,我独立验证后确认:】

    - Sardex(意大利撒丁岛,2010 至今):~1 万企业/~160 万人口/16 年/交易增长。编码关键:
    同岛企业主=同乡(区间 II)→支持推论;分散在 160 万人口区域互不认识=匿名(区间 III)→
    挑战 prediction(c)。这不是 Sardex 的问题,是"同乡"档过宽的问题。不构成净杀,但暴露
    operationalization 粒度不足。【继承 should】

    - 贸易信贷/供应商信贷(B2B net-30/60/90):全球 B2B 主流,以法币计价,万亿$规模。
    完美填补区间 II 功能缺口但不算"社区货币"——范畴消化有效但削弱推论的现实意义:
    若区间 II 的"最优"通货形态全球占比趋近于零而替代机制(贸易信贷)占比趋近万亿$,
    "最优"一词在经验层面难以辩护。【继承 should,建议"最优→生态位适配"措辞弱化】

    - Bristol Pound(2012-2020):~46 万人城市/1:1 英镑挂钩/活跃 5-6 年。L4-009 事后口径
    模式:消化判据"1:1 挂钩=非独立通货"在见反例后才提出。按反向裁决→构成对 prediction
    (c)的边界压力(虽 5-6 年未达≥10 年门槛,但在城市匿名规模下已非平凡)。【继承 should】

    - 标会/合会/ROSCA(全球普适):5-50 人,基于群体身份,不发行流通通货但承担跨期消费
    平滑功能。比社区货币更普遍/更古老/更稳健,进一步质疑"最"字。【minor should】

    - Ithaca HOURS(美国,1991 至今):~35 年,数百至低数千活跃用户,同镇社会距离→区间 II。
    存续极长但规模小,与日本案例同向。不构成反例。

    - 中世纪 lex mercatoria(11-15 世纪欧洲):跨国商人网络,制度创新(私人仲裁+集体抵制)
    桥接信任缺口,但不发行独立通货。提示:制度设计可能部分补偿梯度——梯度与制度的替代
    弹性可能比推论假设的更高。【minor should,建议 limitations 讨论】

    - 中国钱庄私票(清至民国):县域至跨县流通,数十年至百年以上。同乡/同业社会距离→区间 II。
    私票流通依赖商号间的重复交易网络(钱庄同业拆借),非纯匿名。不构成反例。

    - 德国 Regiogeld(2000s~):~50+ 种区域货币,多数小/短命。Chiemgauer 最大(~600 企业
    +~3000 用户)。同乡社会距离→区间 II。方向性支持推论但未经独立梯度测量。

    【本轮新增猎捕:】

    - 巴西 Banco Palmas(1998 至今,Fortaleza):社区发展银行+本地货币(Palma),服务~30,000
    居民的 Conjunto Palmeiras 社区。社会距离:同乡(同 neighborhood),区间 II。运行~27 年,
    发行本地货币(Palma 与 BRL 1:1 挂钩)。存续极长→支持区间 II 稳态存在;与 BRL 挂钩→
    触发与 Bristol Pound 同样的"挂钩 continuum"问题——若 Bristol Pound 因 1:1 挂钩被事后
    排除,Palma 同理。消化:不构成反例(区间 II),但进一步说明"挂钩程度 continuum"预注册
    的必要性——不能每遇到一个挂钩案例就发明一次排除。

    - 肯尼亚 M-Pesa(2007 至今):移动货币,~3000 万用户,以 KES 计价。纯匿名交易但基于
    法币+电信基础设施的信任替代。排除在外(非法币替代也非社区货币,是法币的移动代理)。
    但 M-Pesa 证明:在匿名社会中,制度-技术基础设施可以大幅扩展通货的覆盖范围——这正好
    是推论主张社区货币【不能】做到的事情。M-Pesa 的成功≠推论被证伪(它用法币),但它是
    推论"为什么必须是法币"论证的一个活案例:法币的制度基础设施(央行/银行/电信监管)使
    M-Pesa 成为可能,而社区货币没有这套基础设施。

    - 东非 osotua/蒙古 anda(双边仪式化伙伴关系):通过仪式/盟约建立的一对一纽带,非血亲/
    非同乡,承担风险分担+跨期交换功能。社会距离介于熟人与同乡之间。不发行通货,属于区间
    I-II 边界上的非通货交换机制。不构成反例,但丰富了对区间 I-II 分界的理解。

    - eBay 声誉系统(1995 至今):完全匿名的区间 III 环境中,买卖双方互不认识,依赖平台评级
    系统建立信任。交易以法币结算(非社区货币),不构成对推论的反例。但声誉系统作为"匿名
    环境中的信任替代"在功能上与社区货币存在范畴竞争——两者都是解决"互不认识的人如何
    交易"的方案,只是路径不同(群体身份+互惠清算 vs 个体历史+平台强制)。建议在 boundary_
    cases 中讨论声誉系统与社区货币的范畴关系。

    猎捕结论:【第三轮独立猎捕,仍未发现净杀反例】。核心主张——三通货生态区间的存在性+
    梯度决定社区货币天花板——经三轮猎捕未被杀伤。Sardex 被编码模糊性消化,Bristol Pound
    被事后口径消化(但该消化违规,按 L4-009 反向裁决应计为边界压力),贸易信贷被范畴划分
    消化,Banco Palmas 支持区间 II 稳态(但加重挂钩 continuum 预注册的必要性)。猎捕中暴露
    的操作化缺口(编码粒度/事后口径/挂钩 continuum/区间 II species 多样性)均为可修复的
    should 级问题,不构成 required 级致命伤。

  non_recurrence_of_ded004_007: |
    独立重验(第三轮),DED-004(不可证伪循环)与 DED-007(测量轴焊死)均未在结构性层面复发。

    DED-004(不可证伪循环):【未结构性复发,但窄缝数量已累积至临界量】
    四条已识别的 DED-004 式窄缝:
    (a)梯度阈值 15/30pp 的事后调参风险:若反例梯度=32pp(>30pp,预测陡峭→CC应小)但
    CC 很大→author 可辩称阈值应为 35pp。此缝在两轮中反复被指出,连续方案可根治。
    (b)"同乡"档过宽的事后重编码风险:同城 50 万人→初始编码"匿名",但若 CC 存活 15 年→
    可辩称"成员形成共享身份→重编码为同乡"。anti_talisman_clause(4)概念层禁止了但
    "共享常住地"的操作化宽到可容纳此滑移。
    (c)"梯度平缓→竞争加剧"的多自由度消化风险(r2 新增):平缓+大 CC→归因"区间 II 宽";
    平缓+小 CC→归因"竞争加剧";陡峭+小 CC→归因"天花板低"。三态中两态可被理论内部
    消化,仅留"陡峭+大 CC"作为硬反例——自由度偏高。
    (d)【本轮新增】falsifiability(c)的 10 年门槛与 Bristol Pound 的 5-6 年之间的 4-5 年差
    距是口径选择自由度:若设门槛=5 年→Bristol Pound 净杀;设门槛=10 年→仅边界压力。
    且 Banco Palmas(Palma 与 BRL 1:1 挂钩,27 年存续,同乡区间 II)和 Bristol Pound
    (GBP 1:1 挂钩,5-6 年,城市匿名)的对比进一步说明"挂钩=排除"这一判据的问题:
    两者都挂钩法币,但一个在区间 II(被接受为 supporting)、一个在区间 III 边界(被事后排除)。
    这说明"挂钩程度"和"社会距离编码"的交互作用创造了一个二维的口径选择空间——author
    有两个维度可以调节来消化反例。这不是一个全面的 DED-004 循环(因为仍有"完全独立+
    纯匿名+>10 年+交易增长"这一明确的反例形态),但窄缝的累积已使推论的经验钳制力
    有所削弱。每条缝单独看是 should,四条缝的叠加效应意味着:要干净地证伪推论,需要一个
    同时满足四个条件(陡峭梯度+大规模+纯匿名+不挂钩法币+>10 年)的案例——这不是
    不可证伪,但比第一眼看去的"三条 falsifiability 条件"更难在现实中命中。

    DED-007(焊死测量轴):【未复发】信任行为(trust game/WVS 测)与社区货币存续(公开记录/
    年报测)使用不同构念、不同测量工具、不同数据源。anti-talisman 四位一体禁令保证方向
    分离。实操中的 confounding(trust game 参与者被其货币经验内生影响)属测量执行问题,
    非构念焊死。
    ⇒ 不判 required。窄缝已在 should 中记录。

  required_fixes: []

  should_fixes:
    - |
      [should, 继承 r1-1 + r2 强化 + r3 强调] 三锚诚实标注梯度为事后归因而非独立测量:
      在 real_world_anchors 的三个 supporting anchor 的 evidence 中,分别加注"梯度归因未经
      独立测量:本锚以社区货币的存续/规模模式反推其所在社区的信任衰减梯度特征,违反了
      anti_talisman_clause(1)(2)的精神。本锚仅作为'推论预测方向与案例叙事方向一致'的
      illustrative evidence,不作为 confirmatory evidence。"本轮补充:加注后 confidence 应降级
      (WIR moderate→weak,Trueque moderate→weak,日本 weak→weak*)。三锚未经梯度独立
      测量的状态历经三轮审查未修正,继续以当前 confidence 呈现会误导读者对推论经验支撑
      强度的判断。
    - |
      [should, 继承 r1-2] WIR 锚降级并拆分证据链:将 WIR confidence 从 moderate 降为 weak,
      拆分为(a)90 年存续→支持区间 II 生态位存在性(即使有人为边界,系统在边界内长期稳态
      运作仍是事实);(b)规模限于瑞士 SME→章程自限与梯度天花板贡献未剥离,不可归因于梯度。
    - |
      [should, 继承 r1-3 + r2-10 + r3 强化-A] 标注构念替代(非仅标签偏移)+收窄同乡档:
      在 derivation step 1 中诚实标注:"BR-L2-009 formal statement 的社会距离轴使用'弱关系'
      (weak ties,关系强度维度),本推论沿用其人话摘要的'同乡'标签并将其操作化为'同乡/同业/
      同好'(共享群体身份,范畴归属维度)。关系强度与共享身份是两个相关但不相同的构念——
      共享身份的个体之间关系强度可强可弱,弱关系个体之间可共享也可不共享身份。本推论的
      区间 II 实际捕获的是'共享群体身份'维度上的中等距离,比 BR-L2-009 的'弱关系'范围更窄
      (非共享身份的弱连接被排除)。这一构念替代是本推论承担的经验风险——若非共享身份的
      弱连接在经验上恰好处在'互惠不够用、法币过重'的中间地带,则区间 II 的边界需要扩展。"
      同时收窄同乡档:将同城(>5 万人)与同镇(<5000 人)分档,或在 limitations 中诚实标注
      档内方差并建议按人口规模做稳健性检验。
    - |
      [should, 继承 r1-4 + r2 强化 + r3 重申] Bristol Pound 适用 L4-009 反向裁决 + 预注册
      挂钩程度 continuum:按评分卡第 11 条,事后口径选择一律反向裁决——布里斯托尔镑应计为
      对 prediction(c)的边界压力(城市匿名规模~46 万人,活跃 5-6 年),不得以"1:1 挂钩=非独立
      通货"的事后口径消化。同时预注册"法币挂钩程度"为 continuum(完全挂钩[1:1+100%储备]/
      半挂钩[浮动汇率或部分储备]/完全独立[无法币参照]),说明 continuum 上各点的理论含义,
      并诚实标注:此 continuum 将波及 WIR(WIR 法郎与 CHF 折价~2-5%=半挂钩)、多数 LETS
      (法币参照定价)和 Banco Palmas(Palma 与 BRL 1:1 挂钩)。完成 continuum 注册后,Bristol
      Pound 和 Banco Palmas 归入 continuum 相应位置,不再需要 case-by-case 排除。
