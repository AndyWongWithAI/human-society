id: ADV-REVIEW-056
type: adversarial_review
reviews: DED-051
layer: L3-deductions

人话摘要: |
  对 DED-051(人际信任衰减梯度×通货必要性：社区货币的生态位边界)的第一轮独立对抗审查。
  round_1 裁 needs_revision:核心机制骨架成立——BR-L2-009(信任有界且随社会距离衰减)与 BR-L2-011(通货替代匿名交换中缺失的记忆)
  的合力确实产生了一个非平凡的三区间通货生态学模型,其中"中等社会距离→社区货币最优"的格(★)既不在任一块单砖中、也不是同义反复。
  测量轴正交(信任博弈 vs 通货存续数据)、anti-talisman 在位且双向禁反推、射程/排除钩子按事前结构特征划、无 DED-004/007 复发。
  但我猎到 8 条 should 级缺陷:(1)三锚均未展示独立梯度测量,anti-talisman 在锚上只说不做;(2)WIR 锚过度归因梯度天花板而自认章程
  限制未剥离;(3)"同乡"档过宽(同镇≈500 人 vs 同城≈500 万人信任属性质异)且 BR-L2-009 原文是"弱关系"非"同乡"——映射是
  再解释;(4)Bristol Pound 排除判据(1:1 挂钩法币=非独立通货)属事后口径选择,触 L4-009 判例;(5)梯度阈值 15/30pp 无理论动机;
  (6)BR-L2-009 是"软约束"但本推论将其当结构性硬天花板用;(7)falsifiability(a)要求证"不存在区间 II"的近乎全称否定,可操作性低;
  (8)区间 II 的通货形态不止社区货币(贸易信贷/Sardex 类 B2B 互惠清算等),species 枚举未穷尽。均为 should 级,无一升格为 required
  (核心机制逻辑未塌、无净杀反例、无 DED-004/007 复发),但累积量已使推论在操作层面偏薄 ⇒ needs_revision,外科修补后可复 verified。

target: DED-051
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。评分卡红旗 13 条逐项攻 +
  反例猎捕(判 verified 前必做)+ DED-004(不可证伪循环)/DED-007(测量轴焊死)复发检查。裁决三态照评分卡:
  verified 需同时满足(1)无 required 缺陷(2)亲自猎捕无 scope 内活反例(3)不重蹈 DED-004/007。

round_1:
  reviewer: "独立子 Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    这是一条【逻辑骨架扎实、但操作化与实证锚远未跟上雄心】的候选。核心论证——BR-L2-009(信任有界且随社会距离衰减)与
    BR-L2-011(通货=匿名交换中缺失的记忆替代)合力在社会距离谱上定义了三个通货生态区间,其中区间 II(中等社会距离)是
    社区货币的专属生态位、区间边界由信任衰减梯度刚性定义——是 genuine 的非平凡推理。BR-L2-009 不含"通货""货币"
    "社区货币"(我逐词核对过),BR-L2-011 不含"社会距离""信任梯度""生态位"(同样核对过)。两砖焊在一起产生的三区间
    生态学模型,确非任一块单砖的复述或近义。

    作者在 brick=conclusion 自查、nontriviality_test(2×3 逐格判空,标星格判别清晰)、discriminant_validity(对比搜寻模型/
    实践文献/社会资本文献,均给出可判别预测)、anti_talisman_clause(四条禁令覆盖面全、双向禁反推)上下了扎实功夫。
    falsification_trace 的 primary_suspect 指得准(BR-L2-009 的可测量性与跨社区差异性),secondary_suspect 也诚实
    (BR-L2-011 功能排他性)。

    但我在逐条攻中猎到 8 条 should 级缺陷,虽无一升格为 required,但累积量已使推论在操作层偏薄:

    (1)【should】三锚均未展示独立梯度测量,anti-talisman 在锚上只说不做:WIR/Trueque/日本社区货币三个 supporting
    anchor 均将信任衰减梯度作为解释变量使用,但没有一个锚展示了"在同一社区内用信任博弈实验独立测出相邻社会距离档
    的信任落差"这一 anti-talisman_clause(4)要求的操作。WIR 称"规模天花板恰好落在同乡/同业边界"但未测梯度,
    Trueque 称"梯度天花板效应"但未测梯度,日本案例称"梯度相对平缓"引的是对日本社会的一般印象而非独立测量。
    anti-talisman_clause 写得漂亮但在锚上的执行是 assumed 而非 demonstrated。这不是 required(推论逻辑不依赖
    这些锚——锚是 illustrative 而非 deductive),但诚实标注"锚的梯度均为事后归因而非独立测量"是必要的。

    (2)【should】WIR 锚过度归因梯度天花板而自认章程限制未剥离:author 诚实标注了"WIR 的成员规模也受其章程
    (限瑞士境内企业)的人为限制——梯度天花板与制度自限的贡献比例未剥离",但标注后仍将 WIR 列为 supporting
    anchor 用其"从未扩展到非瑞士/非 SME 群体"作为梯度天花板的证据。若章程本身就禁止扩展,那"未扩展"不能作为
    梯度限制的证据——这就像给鸟笼加锁后声称"鸟没飞走证明它飞不高"。宜将 WIR 降级为 weak 或拆分为两条独立
    证据链:一条关于其存续时长(90 年,支持区间 II 稳态),一条关于其规模(受章程限制,不可归因于梯度)。

    (3)【should】"同乡"档过宽且与 BR-L2-009 原文存在映射偏移:operationalization 中"同乡"档的编码标准是
    "同属一个常住地(同镇/同街区)/同行业协会/同宗教集会/同兴趣社群"——同镇(~500-5000 人,高相互识别)与同城
    (~50 万-500 万人,大多数互不认识)的信任属性是质异的,但均被归入同一档。此外,BR-L2-009 原文的社会距离谱是
    "血亲 → 熟人 → 弱关系 → 匿名陌生人",第三档是"弱关系"(weak ties)而非"同乡"(shared locality)。本推论将
    "弱关系"重新解释为"同乡/同业/同好",这一映射引入了 BR-L2-009 原文没有的"共享身份"维度——弱关系可以是
    共享身份(同乡)也可以是非共享身份的(偶然相识、一次性交易对手)。这一再解释不是不合法,但需诚实在 derivation
    中标注"本推论将 BR-L2-009 的弱关系档操作化为共享群体身份,较原文收窄了弱关系的范围"。

    (4)【should】Bristol Pound 排除判据(1:1 挂钩法币=非独立通货)属事后口径选择,触 L4-009 判例模式:author 在
    counterexamples 中将布里斯托尔镑(覆盖~46 万人城市,活跃期~5-6 年)消化为"1:1 挂钩英镑=本质是定向消费券
    而非独立通货体系",并诚实标注"此排除判据需在审查中辩论"。这正是评分卡第 11 条(L4-009 判例)警告的模式:
    排除口径在见到反例后才提出(布里斯托尔镑→提出"1:1 挂钩不算独立通货"),且该口径若严格应用会排除大量
    现存社区货币(大多数 LETS 和本地货币都有法币参照值)。按"事后口径选择一律反向裁决"原则,布里斯托尔镑应
    按"不利于推论"方向裁——即该案例构成对 prediction(c)的边界压力,不得以事后口径消化。宜:(a)将"1:1 挂钩"
    作为 continuum 处理(完全挂钩→半挂钩→完全独立)而非二分,注册挂钩程度的判据;(b)诚实标注布里斯托尔镑为
    boundary_case 而非 digested counterexample。

    (5)【should】梯度阈值 15/30pp 无理论动机:信任衰减梯度的三档(陡峭>30pp / 中等 15-30pp / 平缓<15pp)的
    阈值选择没有任何理论或经验动机——为什么是 15 和 30 而不是 10 和 25 或 20 和 40?author 在 limitations 中
    坦诚"梯度可能非线性",但未解释阈值 anchor。这本身不是 DED-006 式"连续量硬二分"的 required 缺陷(梯度确
    实需要离散化才能做 categorical prediction),但缺失阈值动机使核心预测(b)"梯度越陡→社区货币越小"在边界区
    (15pp 附近和 30pp 附近)的判定悬浮。宜:(a)给 provisional 阈值附理论动机(如参照 Dunbar 层级的信任落差
    经验文献),或 (b)将梯度作为连续变量处理,预测改为"梯度与社区货币规模存在单调负相关"而非三档 categorical,
    后者反而更干净且不需要任意阈值。

    (6)【should】BR-L2-009 是"软约束"但本推论将其当结构性硬天花板用:BR-L2-009 的 honest_note 明确声明
    "'有界'是【软约束】(容量上限 + 随距离连续衰减),非精确人数的硬悬崖。把它当硬悬崖用是过度解读——下游推论
    只可依赖'有界 + 衰减',不可依赖某个具体阈值。"但 DED-051 的 statement 宣称"社区货币的规模上限不由技术
    设计决定,而由该社区的信任衰减梯度决定"——这将软约束升级为硬天花板。gradient 决定 ceiling 是推论自己的
    主张(这没有问题——推论可以比砖走得更远),但应诚实在 derivation 中标注:本推论从 BR-L2-009 的"有界+衰减"
    软约束出发,额外主张了"此软约束对社区货币构成刚性规模天花板"这一更强命题,并承认这一升级本身是推论承担
    的经验风险(若被证伪,锅在推论不在砖)。

    (7)【should】falsifiability(a)的可操作性低: falsifiability(a)要求"系统性地经验调查未发现任何社会距离区间,
    其中社区货币是优势通货形态而纯互惠不够用、法币又过重"——这是一个近乎全称否定的证伪条件(要证"不存在
    区间 II"需要穷尽所有可能的社会距离区间)。按 Popper 标准,可证伪性要求存在一个【可能观察到的】事实与理论
    冲突。但"不存在区间 II"的全面经验调查的执行成本极高(需要跨文化/跨历史/跨社会距离的系统性比较),实际上
    几乎不可能完成——这意味着该条件在实践中很难用来证伪推论,削弱了推论的可证伪性。宜将(a)重构为更可操作的
    形式,如"在 M 个跨文化、跨社会距离的系统性案例研究中,未发现任何一个案例中社区货币是主导通货形态(
    交易量占比>50%)且纯互惠和法币合计占比<50%",或"社区货币在全球所有已知社会中的总交易量占比<0.1%"。

    (8)【should】区间 II 的通货/交换形态不止社区货币,species 枚举未穷尽:推论将区间 II 的通货形态等同于
    "社区货币/LETS",但区间 II 存在多种非社区货币的交换机制:(a)贸易信贷/供应商信贷(supplier credit,B2B 中
    的 net-30/60/90 账期)——基于重复交易关系和信用报告(制度化的记忆),非社区货币但广泛存在于中等社会距离
    的商业交换中;(b)ROSCA/合会/标会——基于群体身份的轮流储蓄与信贷,不发行流通通货但承担了通货的部分功能;
    (c)Sardex(意大利撒丁岛,2010 至今)——B2B 互惠信用清算,~1 万企业成员,覆盖全岛 160 万人口区域,成员间
    社会距离跨度大(同岛企业主→近乎匿名的远距交易),运行 16 年且交易量增长,对 Zone II/III 边界构成压力。
    推论目前的 species 枚举以"社区货币/LETS"覆盖区间 II,未处理上述机制是否属于同一 species 还是应作为独立
    species。宜:(a)在 boundary_cases 或 discriminant_validity 中讨论贸易信贷/Sardex/ROSCA 等区间 II 交换机制
    与本推论的关系(是本推论的同一 species 的不同表现,还是独立的相邻理论需要更细的分类);(b)若这些也算"区间 II
    通货形态",则本推论的术语"社区货币"应扩展为"社区通货/互惠信用机制"以准确反映射程。

    综上:8 条全为 should,无一 required(核心机制逻辑未塌、无净杀反例、砖的事实引用无误、无 DED-004/007 复发、
    非平凡性立得住)。但 should 条目数量偏多且集中在操作化与实证锚层面,判 needs_revision——给作者外科式修补,
    预期一轮修订后可复 verified。

  red_flag_findings:
    brick_conclusion: |
      未命中(攻不穿)。我逐词核对了 BR-L2-009 和 BR-L2-011 的全文。
      BR-L2-009 全文不含"通货""货币""社区货币""LETS""生态位""区间""天花板"——它只讲信任有界且随社会距离衰减,
      是纯信任命题。BR-L2-011 全文不含"社会距离""信任梯度""生态位""社区货币""三区间""同乡"——它只讲通货在
      匿名/不可追踪条件下替代记忆,且明确将其范围窄化为 D2(记忆缺口)单一功能。
      DED-051 的非平凡内核——"社会距离谱上存在三个通货生态区间,区间 II 是社区货币的专属生态位,天花板由信任
      衰减梯度决定"——不在任一块砖的原文或近义中。这不是"BR-L2-011 已经说了熟人不用钱、陌生人要用钱,你只不过
      加了个中间档"——BR-L2-011 确实说了 trackable→通货冗余和 anonymous→通货必需,但它没有:(i)在社会距离谱上
      定位这些条件,(ii)预测中间存在社区货币的独立生态位,(iii)断言梯度决定规模天花板。这三件事是两块砖合力产生
      的新命题,不是任一块的复述。
      承重砖也非为推论窄化——BR-L2-009 的跨学科支撑(演化生物学+博弈论+文化普适,IEA=2.0)和 BR-L2-011 的
      形式化支撑(Kocherlakota 定理+经济人类学,IEA=1.9)均有独立于 DED-051 的存在理由。
      ⇒ 不判 required,不判 should。

    nontriviality_cell_check: |
      未命中(攻不穿)。2×3 逐格判空表的核心非平凡格是两个标星格:
      ★"中距离→社区货币最优":BR-L2-009 不讲通货形态,BR-L2-011 不讲社会距离分层——任一块单砖都无法推出
      "存在一个中等社会距离区间,其中社区货币是最优通货形态"。author 正确指出此格可被经验反例填充(所有中等距离
      交换均由纯互惠或法币充分覆盖,社区货币从未独立存活)。这是一个 genuine 的经验赌注,非同义反复。
      ★"高距离→社区货币不可行":BR-L2-011 说匿名交换需要通货,但未论证为什么必须是法币而非社区货币。DED-051
      补充的制度基础设施论证(法律强制/央行最后贷款人/存款保险)为这一格提供了独立的理论内容。同样可被经验反例
      填充(匿名规模社区货币存活≥10 年)。
      非标星格的"低距离→无通货"(BR-L2-011 已暗示)和高距离→法币(BR-L2-011 已基本覆盖)确实有部分被砖平凡
      覆盖,但 author 在 nontriviality_test 中诚实标注了这一点,未声称全表非平凡。核心格(中距离)的非平凡性立得住。
      ⇒ 不判 required,不判 should。

    measurement_orthogonality: |
      未重蹈 DED-007(攻不穿)。自变量对:(i)社会距离——由亲缘系数/交互频率/共享群体身份等事前行为指标编码,
      (ii)信任衰减梯度——由信任博弈实验中委托人愿意转交的金额占比测量。因变量:社区货币的存续时长和交易规模——
      从公开记录/年报/学术案例中提取。自变量和因变量使用不同的数据源和测量工具(行为实验/档案记录 vs 经济交易
      数据),构念上异源正交。anti_talisman_clause 的四条禁令在【概念层】有效防止了双向反推:(1)禁由货币成败反推
      梯度,(2)禁由货币失败反推梯度陡峭,(3)禁以"成员少"当"梯度陡峭"的替代测量,(4)禁见通货数据后重编码社会距离。
      这与 DED-007 的"通货需求用货币量测"的焊死有本质区别——这里的自变量(信任行为)和因变量(通货存续)使用
      不同种类的测量。
      实操层面的担忧(见 should 条目 1):信任博弈实验在已存在社区货币的社区中执行时,参与者的信任行为可能受其
      社区货币经验的内生影响——但这属于测量执行的 confounding 问题,不是构念焊死。主轴正交性本身是干净的。
      ⇒ 不判 required。测量执行的 confounding 已纳入 should(1)。

    scope_hook_independent_of_result: |
      未命中(攻不穿)。四项 excluded_outcomes 均按事前结构特征划,不由结果回填:
      (1)"技术设计对运营效率的影响"——按"技术设计是区间内变量还是跨区间变量"这一结构判据划,不由社区货币成败
      回填。技术设计=效率变量,梯度=天花板变量,这是理论内部的角色划分,不是为消化反例而设的口袋。
      (2)"法币在低社会距离交换中的使用"——author 预注册"法币可能因惯性/便利性在区间 I 出现,不证伪推论",并将
      核心主张明确限定为"区间 II 的独立生态位存在性"而非"区间 I 禁止法币"。这个排除口是从推论的理论结构(核心
      预测是区间 II 的存在,不是区间 I 的排他性)推导出来的,不是见到法币在家庭内使用后补的口袋。但有一个 should
      级窄缝:若法币在所有社会距离上都是绝对主导(区间 I/II/III 均以法币为主),那么"区间 II 是社区货币的生态位"
      的主张虽然逻辑上仍可成立(生态位存在≠生态位被占据),但经验上会退化为一个无法检验的 counterfactual。不过
      这不是射程/排除钩子的问题,而是 falsifiability 操作化的问题(见 should 7)。
      (3)"加密货币/区块链社区货币"——按信任机制类别(社会信任 vs 密码学信任)这一事前结构特征划,不由结果判。
      边界清晰但有一处模糊:数字化的社区货币(如 Sardex 的电子账本)与社会信任基础的加密货币(如某些"社区币"
      代币)之间的界线在实践中可能模糊。宜在 excluded_outcomes 中加一句操作性判别标准(如"是否依赖工作量证明/
      权益证明等密码学共识机制——若是,排除;若仅用数字账本记录社会信任网络中的债权债务,不排除")。
      (4)"国家法币崩溃时社区货币的临时替代功能"——按"稳态 vs 临时真空期"这一结构判据划,且给出了可检验的
      辅助预测(法币恢复后社区货币回缩至区间 II),不是纯事后口袋。
      ⇒ 不判 required,不判 should。第(2)条的窄缝已纳入 should(7),第(3)条的模糊性视情况可作为 minor should 但
      不单独列。

    criterion_tier_match: |
      部分命中(should)。社会距离四档(血亲/熟人/同乡/匿名)被映射为三个通货区间(I=血亲+熟人,II=同乡,III=匿名),
      这种四变三的映射在概念上是合理的——血亲和熟人在通货需求上确实更接近(都有可行互惠记忆)。信任衰减梯度
      从连续量(信任落差%)被三分为陡峭/中等/平缓,阈值 15pp 和 30pp。这不是 DED-006 式"连续量硬切二分"的
      required 缺陷——三档划分有理论意义(分别对应三种质性不同的梯度制度),且连续量离散化是标准科学实践。
      但【should】15/30pp 的阈值选择没有任何理论或经验动机——为什么是 15 和 30 而不是 10 和 25?这不仅使核心
      预测(b)在阈值附近的判定悬浮,也为事后调参消化边界反例留了窄缝(DED-004 风险)。宜给阈值附 provisional
      理论动机,或将预测改为连续形式(单调负相关)以绕过阈值问题。
      ⇒ 不判 required,记 should(5,已合并入 verdict_note)。

    anti_talisman_cashed: |
      大体兑现但锚上执行缺位(should)。anti_talisman_clause 的四条禁令在位且覆盖了最危险的四个反推方向:(1)禁由
      成功反推梯度平缓,(2)禁由失败反推梯度陡峭,(3)禁以"成员少"代理"梯度陡峭",(4)禁见通货数据后重编码社会距离。
      这些禁令在概念层面清晰且完整。至少一个承重锚真独立测出驱动量的要求:author 声称信任博弈实验可独立测出
      梯度,在方法论层面成立(trust game 的行为测量独立于社区货币的存续数据)。
      但【should】三个 supporting anchor 没有一个展示了独立梯度测量的实际执行——WIR 的"梯度天花板"是事后归因,
      Trueque 的"梯度天花板效应"是事后归因,日本案例的"梯度相对平缓"是社会印象而非独立测量。anti-talisman_clause(4)
      要求"至少有一个锚点真正做到——在同一社区内用信任博弈实验测出相邻社会距离档的信任落差,不看该社区是否有
      社区货币、社区货币多大"——这三个锚均未做到。这不是 required(锚是 illustrative 而非 deductive,推论逻辑不依赖
      锚的测量质量),但诚实标注是必要的。
      ⇒ 不判 required,记 should(1,已合并入 verdict_note)。

    anchor_fact_check: |
      无 DED-007 式致命事实错,但三锚各有过度解读(should)。逐项核查:
      (1)瑞士 WIR(1934 至今):~5 万家中小企业、~90 年存续——事实正确(Swiss National Bank 和学术文献有记载)。
      但 author 用"从未扩展到非瑞士/非 SME 群体"作为梯度天花板证据,同时又诚实标注"WIR 的成员规模也受其章程
      (限瑞士境内企业)的人为限制——梯度天花板与制度自限的贡献比例未剥离"。这个冲突是实质性的:若章程就禁止
      扩展,那"未扩展"不携带关于梯度天花板的任何信息。宜将 WIR 降级为 weak confidence 并拆分为两条独立证据链。
      【should】见 should(2)。
      (2)阿根廷 Trueque(2001-2003):~6000 俱乐部、~250 万参与者、2002-2003 崩溃——事实正确(Gomez 2009 等
      学术文献有详细记载)。author 分析"初始区间 II→规模膨胀进入区间 III→匿名涌入→互惠识别失效→欺诈→崩溃"
      在叙事层面合理,但承认"法币恢复与内部欺诈压力同时作用,未剥离各自贡献"。此外,2001 年阿根廷危机是极端的
      宏观经济冲击(违约+银行冻结+货币局崩溃),在如此极端的条件下,trueque 的崩溃有多少归因于梯度天花板 vs
      归因于"任何非国家通货在那种极端条件下都会面临的信任危机"是不清楚的。这不是事实错,而是因果归因过强。
      【should】诚实标注 trueque 是"多因并发案例,梯度天花板的独立贡献未量化,confidence 宜降为 weak"。
      (3)日本社区货币(Peanut/府中市等):数十年存续、数百至数千人规模——事实正确(日本社区货币文献丰富,
      如 Lietaer 和 Kennedy 的记载)。author 声称"日本社会的信任衰减梯度相对平缓"→"存续时间异常长",但未引用
      任何日本信任梯度的独立测量——"日本梯度平缓"是 folk theory,不是测量结果。author 自己也诚实标注"仍是
      相关性观察而非因果识别"。此外,"平缓的梯度也将竞争门槛降低了"这一补充机制与主推论存在潜在张力——如果
      平缓梯度使社区货币面临更多替代竞争,那"平缓梯度→更大规模"的预测可能被竞争效应抵消甚至反转。
      【should】将 confidence 保持为 weak,并承认"梯度平缓→存续长久"与"梯度平缓→竞争加剧"之间的方向性张力
      尚未解决。

      Bristol Pound 反例候选(2012-2020):分析见 counterexample_hunt 和 should(4)。
      ⇒ 锚无致命事实错,记 should(1)(2)及本条的额外标注。

    definition_vs_prediction: |
      未命中(攻不穿)。关键条件——社会距离(行为指标编码)、信任衰减梯度(信任博弈实验测量)——是可操作化的
      构念定义,不是会导致同义反复的加厚定义。核心预测——(i)三个通货生态区间的存在性,(ii)梯度与社区货币规模
      的负相关,(iii)技术设计不能突破梯度天花板——都是可证伪的经验命题。falsifiability 三项各有明确的 observable
      condition,不是"如果预测成立则条件满足、如果不成立则条件不满足"的定义循环。
      有一处边缘风险:如果"社会距离"的编码本身受交换行为影响(经常交易的人可能被重新编码为"熟人"而非"同乡"),
      则条件可能被事后滑移。anti_talisman_clause(4)明确禁止了这一点(不得因通货数据而重编码),防线在位。
      ⇒ 不判 required,不判 should。

    enumeration_and_species: |
      部分命中(should)。三区间(I/II/III)按 umbrella criterion——社会距离谱上的位置(低/中/高)与对应的互惠记忆
      可行性(可行/部分可行/不可行)——定义,符合 DED-008 要求(species 由伞级判据本身定义,非替代表征)。
      主动猎第 4 区间:
      (a)区间 0——超低社会距离(核心家庭内):血亲内部(尤其是父母-子女、配偶之间)的交换在许多文化中根本不被
      概念化为"交换"而是"共享"(sharing)。这不是通货冗余的问题,而是交换范畴本身不适用。将核心家庭归入区间 I
      在操作上说得通(均无通货需求),但模糊了"共享"与"互惠"的质异。【minor should】宜在 boundary_cases 中注明。
      (b)区间 II 的子 species 未穷尽:推论将区间 II 的通货形态等同于"社区货币/LETS",但区间 II 存在多种非社区货币
      的交换/通货机制:贸易信贷(供应商信贷,net-30/60/90)、ROSCA/合会、Sardex 类 B2B 互惠清算系统。这些机制
      在功能上填补了区间 II 的"互惠不够用、法币过重"缺口,但它们不一定是"社区货币"(Sardex 更像商业互惠网络,
      ROSCA 更像轮流储蓄与信贷,贸易信贷以法币计价)。【should】需在 discriminant_validity 或 boundary_cases 中
      讨论这些机制与本推论的关系:它们是同一 species 的不同表现(则"社区货币"术语应收宽),还是需要更细的分类
      (则区间 II 内存在子生态位)。若后者,当前三区间模型可能不够细。
      (c)区间 II/III 的渐变过渡带:推论将"同乡"→"匿名"作为区间边界,但现实中有大量渐变过渡——同一城市的不同
      街区、同一行业的不同细分领域——这些过渡带的通货形态可能是混合的(法币为主+社区货币为辅),不完全落在
      三个离散区间中的任一个。宜在 limitations 中承认连续谱上的离散区间是理想型,过渡带存在混合形态。
      综上:未猎到与三区间正交的独立第 4 区间,但猎到区间 II 内未穷尽的子 species 和区间间的渐变过渡带。
      ⇒ 不判 required,记 should(8,已合并入 verdict_note)和本条的 minor concerns。

    primary_suspect_aim: |
      指对(但漏了四件事,should)。文件自认 primary_suspect="BR-L2-009——信任随社会距离衰减的存在性、可测量性
      和跨社区差异性。"这一条指得准——全推论的区间划分和梯度-天花板链接都压在这条腿上。次级怀疑
      (BR-L2-011 功能排他性)和不太可能的怀疑(三区间逻辑本身)的排位也合理。
      但 author 漏认以下弱点:
      (a)【should】BR-L2-009 是"软约束"但本推论当硬天花板用:BR-L2-009 的 honest_note 明确声明"不可依赖某个
      具体阈值",而本推论的核心主张恰恰是梯度定义了社区货币的刚性规模上限。这不是推论错了,而是推论比砖走得更远,
      应诚实在 derivation 中标注这一升级并承认额外风险。(见 should 6)
      (b)【should】"同乡"不是 BR-L2-009 原文的档位:BR-L2-009 的社会距离谱是"血亲→熟人→弱关系→匿名陌生人",
      第三档是"弱关系"而非"同乡"。将弱关系操作化为共享群体身份是本推论的贡献(也是风险),应在 derivation 中
      诚实标注这一映射偏移。(见 should 3)
      (c)【should】falsifiability(a)的操作性:要求"系统性地经验调查未发现区间 II"是一个近乎无法执行的证伪条件,
      应在 primary_suspect 中承认这一操作化挑战。(见 should 7)
      (d)【should】锚的独立测量缺位:三锚均未展示独立梯度测量,而梯度独立性正是 primary_suspect 的核心关切——
      如果梯度在实际研究中难以独立测量,则 primary_suspect 的脆弱性比 author 承认的更严重。(见 should 1)
      ⇒ 不判 required,记四个 should(已分别纳入 verdict_note)。

    caliber_registration_ambiguity: |
      部分命中(should)。口径注册总体诚实——社会距离四档有具体编码规则(亲缘系数>0.03125/交互频率≥6 次+认识
      ≥3 年/共享群体身份/均不满则匿名),梯度有三档阈值(>30pp/15-30pp/<15pp),社区货币存续时长有 t_end 判定
      (连续 12 月无记录),交易规模有 12 月窗口定义。这些比许多推论已经做得好。
      但有三处未注册或事后选择的歧义:
      (a)【should】Bristol Pound 排除判据(1:1 挂钩法币=非独立通货)属事后口径选择:author 在见到布里斯托尔镑
      这一反例候选后提出"1:1 挂钩不算独立通货"的排除标准,且诚实标注"此排除判据需在审查中辩论"。这恰好是
      评分卡第 11 条(L4-009 判例)描述的模式——口径在反例出现后才定死,且定死方向恰好救推论。按"事后口径选择
      一律反向裁决"原则,布里斯托尔镑应按不利于推论方向裁。此外,若严格执行"1:1 挂钩=非独立通货"标准,许多
      存量社区货币也会被排除(WIR 以瑞士法郎计价?LETS 系统的定价参照法币?),排除口径的适用范围未被预注册。
      宜将挂钩程度作为 continuum 预注册(完全挂钩/半挂钩/完全独立),而非见到反例后发明二分排除。(见 should 4)
      (b)【should】"共享群体身份"作为同乡档判据的 heterogenous 覆盖:"同属一个常住地(同镇/同街区)/同行业协会/
      同宗教集会/同兴趣社群"——同镇(相互识别度高)和同城(相互识别度低)的信任属性质异,同宗教集会(高情感
      亲密)和同兴趣社群(低情感亲密)也不同。这些异构群体被归入同一档,未注册档内方差。
      (c)【minor should】信任博弈实验的参数未注册:委托人初始 endowment、匿名性条件、单次 vs 重复博弈、实验
      参与者是否是社区货币成员——这些参数会系统性影响 trust game 的测量结果,但未被注册。不同的实验设计可能
      给出不同的梯度读数。
      ⇒ 不判 required(核心构念已注册口径,不是"只有数字没有口径"的情况),记 should(4)。

    data_source_common_root: |
      未命中(N/A)。本推论不涉及多数据源验证——信任衰减梯度的测量来源是信任博弈实验或 WVS 调查,
      社区货币存续数据来自公开记录/年报/案例研究。这些是不同的数据生成过程,不存在"多源共享同根"问题。
      本红旗旨在防止"引 WB/IMF/CNBS 三源但同根"的模式,不适用于本推论的数据结构。
      ⇒ 不判 required,不判 should。

    api_access_vs_epistemic_independence: |
      未命中(N/A)。本推论不涉及通过 API/MCP 查询数据源并声称"多源独立"的问题。
      ⇒ 不判 required,不判 should。

  counterexample_hunt: |
    主动构造能证伪核心主张的干净案例,认真查历史/跨文化/民族志实例。

    【猎捕策略】核心主张有三条独立攻击路径:
    (a)区间 II 空集——所有中等社会距离交换由纯互惠或法币充分覆盖,社区货币从未独立存活;
    (b)梯度不决定天花板——社区货币在梯度陡峭的社区中大规模/长期存活;
    (c)匿名规模社区货币——社区货币在成员互不认识的条件下存活≥10 年且交易规模增长。

    - Sardex(意大利撒丁岛,2010 至今)【边界压力,被部分消化】:
      B2B 互惠信用清算系统,~1 万企业成员,覆盖撒丁岛全岛(~160 万人口),运营 16 年,交易量持续增长。
      成员企业间的社会距离跨度大——同一行业/同一省份的企业有一定识别,但岛上不同城市的企业主可能
      从未有过任何直接或间接交互。编码挑战:撒丁岛企业作为"同岛+同意大利+同 SME 身份"的共享群体,
      按 operationalization 可归入"同乡/同业"档→区间 II;但 1 万企业分散在 160 万人口区域中,许多成员
      之间的实际社会距离接近"匿名陌生人"。如果编码为区间 III,则 Sardex 构成对 prediction(c)的挑战
      (成员间社会距离持续处于匿名陌生人档、存活≥10 年且交易规模增长)。如果编码为区间 II,则 Sardex
      支持推论。这一编码的模糊性不是 Sardex 的问题,而是 operationalization 中"同乡"档过宽的问题——
      同岛 160 万人 vs 同镇 500 人的信任属性完全不同但被归入同一档。消化:不构成净杀(编码取决于
      如何操作化"同乡"档),但暴露了社会距离编码的粒度不足。【should,关联 should(3)】

    - 贸易信贷/供应商信贷(B2B net-30/60/90)【边界压力,被消化】:
      企业间贸易信贷是全球 B2B 交易的主流支付方式——供应商向买方提供 30-90 天账期,基于重复交易
      关系和信用报告(如 Dun & Bradstreet)。社会距离:企业间的关系从长期战略合作伙伴(近乎熟人)到
      首次交易的匿名买方,跨度覆盖区间 II 的大部分。贸易信贷以法币计价、不发行独立通货——它不算
      "社区货币"。但它完美填补了推论声称的区间 II 通货缺口:互惠记忆不够用(成千上万的供应商-客户对),
      通用法币的"制度成本过高"不适用(贸易信贷恰恰是法币体系内的低成本工具)。如果贸易信贷在区间 II
      比社区货币更高效、更普遍(事实如此——贸易信贷的全球规模以万亿美元计,社区货币以百万美元计),
      则"社区货币是区间 II 的最优通货形态"的"最优"主张面临实质挑战——最优不应是几乎不存在的选项。
      消化:推论是关于通货形态的(社区货币作为独立通货),贸易信贷是法币计价的信用工具而非独立通货。
      推论不否认区间 II 可以存在法币计价的信用工具,只主张社区货币是此区间的"通货生态位"。但这一
      消化的代价是:如果区间 II 的所有交换都可以用"法币计价的信用工具"(贸易信贷、信用卡、供应链
      金融等)高效服务,那么社区货币的生态位就只是一个理论上存在但实践上几乎空置的位置——这不会
      证伪推论(生态位存在≠生态位被占据),但使推论的现实意义大打折扣。
      【should,关联 should(8)关于区间 II 子 species 的讨论】

    - 布里斯托尔镑(Bristol Pound,2012-2020)【已消化为边界案例,但排除判据有 L4-009 模式风险】:
      ~46 万人城市规模的本地货币,与英镑 1:1 挂钩,活跃期约 5-6 年。若将成员编码为"同城=同乡",
      则属于区间 II(支持推论);若将成员编码为"匿名陌生人"(同城 46 万人互不认识),则活跃期 5-6 年
      构成对 prediction(c)的弱挑战(未达≥10 年门槛)。author 将其消化为"本质是法币包装而非独立通货",
      排除在射程外。但此排除判据(1:1 挂钩=非独立)是在见反例后提出的,符合 L4-009 事后口径选择模式。
      按反向裁决原则:布里斯托尔镑应计为对 prediction(c)的边界压力,而非被事后口径消化。
      【should,关联 should(4)】

    - 阿根廷 Trueque(2001-2003)【被消化为支持,但因果归因过强】:
      见 anchor_fact_check 分析。trueque 的兴衰叙事与推论预测方向一致,但宏观经济冲击的混杂效应
      使梯度天花板的独立贡献不可量化。消化为支持时 confidence 宜降为 weak,并诚实标注混杂。
      【should,关联 anchor 分析】

    - 日本社区货币(长期存续但小规模)【被消化为支持,但因果箭头未检验】:
      见 anchor_fact_check 分析。"梯度平缓→存续长久"是相关性观察,不是因果检验。且"梯度平缓→
      存续长久"与"梯度平缓→替代竞争加剧→规模受限"之间存在方向性张力,author 未处理这一矛盾。
      消化为支持时宜保持 weak confidence。

    - 标会/合会/ROSCA(全球普适)【未在当前射程内,但指示区间 II 机制多样性】:
      轮流储蓄与信贷协会(ROSCA)在全球几乎所有文化中都有存在,规模从 5-50 人不等,社会距离覆盖
      熟人到同乡/同业。ROSCA 不发行流通通货,但执行了通货的时间维度功能(跨期消费平滑)。如果将
      ROSCA 视为区间 II 的一种交换/金融机制,它比社区货币更普遍、更古老、更稳健——这不会证伪
      推论(推论只讲通货形态),但进一步质疑"社区货币是区间 II 的最优通货形态"的"最"字。
      建议在 boundary_cases 中增加 ROSCA 的讨论。

    结论:【无净杀反例存在】。猎到的最近反例——Sardex(约 16 年匿名/B2B 互惠清算)——被社会距离
    编码的模糊性消化(可合理编码为区间 II);布里斯托尔镑(城市规模社区货币~5-6 年)被 author 的事后
    排除判据消化(但该判据有问题);贸易信贷的普遍性被"非通货"的范畴划分消化(但削弱现实意义)。
    推论的核心主张经猎捕未被杀伤 ⇒ verified 硬门第 2 条(无 scope 内活反例)可通过。但猎捕过程中
    暴露的操作化缺口(社会距离编码粒度、排除判据的预注册、区间 II 机制多样性)均记录为 should。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发,但有两条 should 级窄缝】。推论整体结构可证伪——三个
    falsifiability 条件指定了可观测的、事前可判定的反例形态;anti_talisman_clause 四条禁令防了最
    直白的循环(禁由成败反推梯度、禁由"成员少"代理"梯度陡峭"、禁事后重编码社会距离)。
    但有两条窄缝:
    (a)梯度阈值 15/30pp 的事后调参风险:若一个反例的梯度测量值为 32pp(>30pp,预测为陡峭→
    社区货币应小)但该社区货币却很大,author 可声称阈值应调为 35pp,将该案例从反例区移出。
    这与 DED-004 的"调参消化反例"模式同构。【should】宜预注册 provisional 阈值并标注为待标定
    参数,使当前预测可判定。已在 should(5)中记录。
    (b)"同乡"档过宽导致的事后重编码风险:若一个社区货币的成员被初始编码为"匿名陌生人"
    (同城 50 万人互不认识),但该货币存活 15 年→形成对 prediction(c)的反例,author 可辩称"成员
    因频繁交易已形成共享身份,应重编码为同乡"。anti_talisman_clause(4)在概念层禁止了这一点,
    但 operationalization 中"共享群体身份"的定义宽到可以容纳这种事后重编码(同城居民=共享常住地
    →同乡)。【should】已在 should(3)中记录。
    两条缝窄(≤should),不构成 DED-004 式全面循环。

    DED-007(焊死测量轴):【未复发】。自变量(信任行为,由 trust game/WVS 测)与因变量(社区货币
    存续/规模,由公开记录/年报测)使用完全不同的构念、测量工具和数据源。不存在"自变量用被预测
    量的同一种货币测"的焊死。anti-talisman_clause 四位一体的禁令在概念层保证了测量方向的分离。
    实操中信任博弈实验在已有社区货币的社区中可能受内生影响(参与者信任行为被其货币经验污染),
    但这属于 confounding 而非构念焊死——通过适当的实验设计(如纳入非货币社区作为对照)可以缓解。
    ⇒ 不判 required,不判 should。

  required_fixes: []

  should_fixes:
    - |
      [should] 三锚诚实标注梯度为事后归因而非独立测量:在 real_world_anchors 的三个 supporting anchor
      的 evidence 中,分别加注"梯度归因未经独立测量:本锚以社区货币的存续/规模模式【反推】其所在社区的
      信任衰减梯度特征,违反了 anti_talisman_clause(1)(2)的精神。本锚仅作为'推论预测方向与案例叙事方向
      一致'的 illustrative evidence,不作为'梯度独立测量+因果检验'的 confirmatory evidence。"
      修订位置:real_world_anchors.supporting[0][1][2].evidence 或 confidence 字段。
    - |
      [should] WIR 锚降级并拆分证据链:将 WIR 的 confidence 从 moderate 降为 weak(因章程限制与梯度天花板
      贡献未剥离),并拆分为两条独立证据:(a)90 年存续——支持区间 II 生态位的存在性(有章程限制不削弱此点,
      因为即使有人为边界,系统在其边界内长期稳态运作仍是事实);(b)规模限于瑞士 SME——章程自限与梯度
      天花板贡献未剥离,不可归因于梯度,需诚实标注。修订位置:real_world_anchors.supporting[0]。
    - |
      [should] 收窄"同乡"档或注册档内方差 + 标注与 BR-L2-009 的映射偏移:(a)在 operationalization.社会距离
      的 limitations 中,诚实标注"同乡档内方差大:同镇(高相互识别)与同城(低相互识别)的信任属性质异但当前
      归入同一档;稳健性检验建议将'同城'单独拆分或按人口规模分档";(b)在 derivation step 1 或 limitations 中,
      诚实标注"BR-L2-009 原文第三档为'弱关系'(weak ties),本推论将其操作化为'同乡/同业/同好'(共享群体身份),
      这一映射收窄了弱关系的范围——弱关系可包含非共享身份的弱连接(如一次性交易对手),这些不在本推论的
      区间 II 覆盖内。"修订位置:operationalization.社会距离.limitations + derivation.steps 或 limitations 新增段。
    - |
      [should] Bristol Pound 适用 L4-009 反向裁决 + 预注册挂钩程度判据:按评分卡第 11 条(L4-009 判例)——
      事后口径选择一律反向裁决——布里斯托尔镑应计为对 prediction(c)的边界压力而非被事后口径消化。
      同时,将"法币挂钩程度"预注册为 continuum(如完全挂钩[1:1 固定汇率+100%法币储备]、半挂钩[浮动汇率
      或部分储备]、完全独立[无法币参照]),而非在见反例后发明"1:1 挂钩=非独立通货"的二分排除。
      修订位置:counterexamples[0].analysis(将 status 从 needs_digestion 改为 boundary_case 或 acknowledged_pressure)
      + excluded_outcomes 或 operationalization 新增"挂钩程度"的连续判据。
    - |
      [should] 梯度阈值附 provisional 理论动机或改连续预测:(a)方案一(推荐):将梯度从三档离散改为连续变量,
      核心预测(b)改为"信任衰减梯度与社区货币规模(成员数/交易量/存续时长)存在单调负相关"——这既绕过
      了任意阈值问题,又使预测更干净、更易检验(一个相关系数+显著性检验即可);(b)方案二:保留三档但给
      15/30pp 附 provisional 理论动机(如参照 Yamagishi 的"信任-解放"理论中日本 vs 美国的信任落差经验值区间),
      标注为"待经验标定参数"。推荐方案一。修订位置:operationalization.信任衰减梯度.measurement + statement 的
      预测(ii)部分。
    - |
      [should] 标注 BR-L2-009"软约束→硬天花板"的推论升级及额外风险:在 derivation step 4 或 limitations 中,
      增加一段:"BR-L2-009 的 honest_note 声明其'有界 + 衰减'为软约束(非精确硬悬崖),本推论额外主张
      ——此软约束对社区货币构成刚性规模天花板。这一升级是本推论承担的经验风险:若社区货币的规模上限
      被经验证明由技术设计/制度环境/网络效应等非梯度因素主导(而非梯度),则本推论的这一强主张被证伪,
      但 BR-L2-009 的软约束不受损——锅在推论不在砖。"修订位置:derivation.steps 第 4 步末尾或 limitations 新增。
    - |
      [should] 重构 falsifiability(a)为可操作形式:将当前的近乎全称否定("系统性地经验调查未发现任何社会距离
      区间,其中社区货币是优势通货形态...")改为可操作的、可被单个/少量研究发现证伪的形式。示例:"在跨
      ≥10 个独立社区/文化的比较研究中,中等社会距离(同乡/同业/同好)的交换≥90%由纯互惠或法币覆盖,
      社区货币类机制的交易量占比<5%且无一案例存活≥5 年"——这个证伪门槛 achievable(如果一个充分发展的
      研究文献都无法找到反例,推论被坐实),且指定了具体的分子/分母/阈值。修订位置:falsifiability(a)。
    - |
      [should] 在 boundary_cases 中讨论区间 II 的非社区货币机制(贸易信贷/ROSCA/Sardex):增加至少一段讨论
      以下区间 II 交换/金融机制与本推论的关系:(a)贸易信贷/供应商信贷——法币计价、基于重复交易+信用报告,
      是否算区间 II 通货形态的竞争/替代?(b)ROSCA/合会——基于群体身份轮流储蓄与信贷,不发行流通通货
      但承担部分通货功能,属于本推论 species 的何种关系?(c)Sardex/B2B 互惠清算——成员社会距离跨度大,
      对区间 II/III 边界构成压力。诚实标注:若这些机制被视为不同于社区货币的独立 species,则区间 II 内的通货
      生态位需要更细的子分类(当前三区间模型可能不够)。修订位置:boundary_cases 新增条目。

