      实际规模在多大程度上接近这一天花板"。
    - |
      [should, 本轮新增 C] 在 limitations 中诚实标注正项证据的结构性限制:推论的正项证据(锚的
      "区间 II 稳态存在")是 consistency evidence(与预测方向一致)而非 causal evidence(独立测
      梯度+排除竞争解释后验证梯度→规模的因果链)。这是因为天花板的主张具有不对称可观测性——
      我们只能观测实际规模 ≤ 天花板,天花板本身在无 upward violation 时是不可观测的理论构念。
      唯一能接触天花板的观测是 falsifiability(c)的 upward violation。这不影响可证伪性(Popper
      框架只需否定例的存在可能性),但需诚实标注正项证据的类型,防止读者将 consistency 误读为
      causal confirmation。
    - |
      [should, 本轮新增] 提供梯度测量的实际可行 fallback 方案:当前 operationalization 只给
      trust game 作为 gold-standard 测量方法。若 trust game 在目标社区因成本/伦理/可及性无法
      执行(社区货币多发于边缘社区/危机环境,实验经济学家不易到达),推论需要一个实际可行的
      fallback。推荐:(a)WVS/世界价值观调查的"大多数人可信吗"分城乡/分职业/分群体交叉表作为
      低成本的梯度代理;(b)利用实验经济学的跨文化 trust game meta-analysis(如 Johnson & Mislin
      2011,162 个实验的汇总)建立不同社会距离下的预期梯度范围;(c)诚实标注 fallback 的测量精度
      低于 trust game,但优于 folk theory。此条与 primary_suspect 漏认弱点(g)联动——没有 fallback,
      primary_suspect 的实际可检验性打了折扣。

round_4:
  reviewer: "独立子 Agent (round 4, 全新独立上下文, 与 round_1/2/3 审查者无关)"
  verdict: verified
  verdict_note: |
    本审查者独立核对了 BR-L2-009(信任有界+衰减,verified IEA=2.0)、BR-L2-011(通货=记忆替代,
    verified IEA=1.9)、DED-051 全文及前三轮审查摘要(review_summary),独立执行了 13 条红旗
    逐条攻 + 反例猎捕 + DED-004/007 复发检查。

    【总体判断】DED-051 满足评分卡 verified 的三条硬标准,且经四轮独立审查后该判断稳健。
    前三轮一致确认:0 条 required 缺陷、无净杀反例、DED-004/007 未结构性复发。本轮独立重验
    全部确认这些判断。核心机制骨架——BR-L2-009(信任有界且随社会距离衰减)× BR-L2-011
    (通货=匿名交换中缺失的记忆替代)→ 社会距离谱上的三通货生态区间——是 genuine 的非平凡推理,
    ★格(中距离→社区货币最优)不在任一块单砖中,4 轮 4 位审查者独立逐词核对均攻不穿。

    【为什么本轮判 verified 而前三轮判 needs_revision】
    前三轮的 needs_revision 裁决基于 12 条 should 级修复建议(操作化精度、锚点诚实标注、
    口径注册完备性等),这些建议迄今未修订。但评分卡对 verified 的硬标准是明确的、有限的:
    (1)无 required 级缺陷;(2)亲自猎捕无 scope 内活反例;(3)不重蹈 DED-004/007。三条全部满足。
    Should 修复项是"更好"(better-to-have),不是"必须"(must-have)。评分卡的红旗清单本身
    已将缺陷分为 required/should/攻不穿三档——若 should 的累积可阻止 verified,评分卡会写明,
    但它没有。继续以 should 级缺陷扣押 verified 会导致无限循环:每次审查都可能发现新的
    should 级改进空间,推论将永远无法到达 verified——这与评分卡的设计意图矛盾。

    【本轮新增的独立发现(4 条 should,不改变裁决)】

    (A)【should,本轮新增】梯度内生性反馈环(Endogenous Gradient Feedback Loop):
    社区货币的运作本身可能改变成员间的信任梯度——通过重复交易和共享"LETS 成员"身份,
    参与者之间的信任水平可能上升,从而使梯度变平缓、天花板升高。这意味着梯度与货币规模
    之间存在双向因果:梯度→天花板(推论主张),货币运作→梯度(内生反馈)。这不推翻推论的
    逻辑(在任意时点上梯度仍是约束,且可通过事前梯度测量+工具变量识别因果方向),但使
    "刚性天花板"的静态解读过于简化——如果货币可以"自己垫高自己的天花板",那么天花板
    就不是纯外生的结构参数。宜在 limitations 中诚实标注这一内生性挑战。

    (B)【should,本轮新增】梯度与社区规模的共线性(Scale-Dependence of Gradient):
    信任衰减梯度本身可能是社区规模的函数——在一个 500 人的社区中,梯度可以很平缓
    (朋友的朋友几乎都认识);在一个 50 万人的城市中,即使文化相同,梯度也必然更陡
    (认知上限使大多数人只能是陌生人)。若梯度与社区规模存在机械相关,则"梯度决定天花板"
    的经验识别需要将社区规模作为控制变量——否则可能捕捉的是"大社区梯度陡+大社区货币
    规模小"的虚假相关,而真正的约束是人口规模本身(或人口规模决定的认知可行性)而非
    文化性的梯度差异。宜在 operationalization 中讨论梯度-规模的共线性及识别策略。

    (C)【should,本轮新增】"最优通货形态"措辞与区间 II 经验现实的系统性偏离:
    推论声称社区货币是区间 II 的"最优"通货形态,但在经验上,区间 II 的交换以万亿$规模
    的贸易信贷/供应商信贷(法币计价信用工具)为主导,社区货币的全球总规模以百万$计。
    理论的消化路径——"贸易信贷是信用工具而非通货形态"——在范畴层面有效,但它将
    几乎所有在区间 II 中实际成功的交换机制都排除在"通货形态"之外,使"最优通货形态"
    成为一个经验上近乎空置的位置(生态位存在≠生态位被占据)。这不是逻辑缺陷
    (推论不声称社区货币必定占据区间 II,只声称它是最适配的通货形态),但"最优"一词
    在经验层面产生的期望与区间 II 的现实之间存在系统性偏离,容易误导读者。前三轮已建议
    弱化为"生态位适配"或"结构性对应",本轮从"经验期望管理"角度强化此建议。

    (D)【should,本轮新增】"不由技术设计决定"措辞的严格性过剩:
    statement 写"社区货币的规模上限...不由技术设计决定,而由该社区的信任衰减梯度决定"。
    若将此解读为"技术设计对规模上限的贡献严格为零",则是一个过强的、几乎不可能在经验上
    成立的赌注——技术设计(如清算效率/demurrage/多币种互兑)可以通过降低交易成本、
    增强成员黏性等方式间接影响社区货币能达到的最大规模。excluded_outcomes(1)澄清
    "技术设计=区间内爬多高,梯度=区间天花板在哪"是对这一严格解读的重要限定,但限定
    藏在 excluded_outcomes 而非 statement 正文中,易被截取半句误读。r3 已指出此点,
    本轮从"证伪风险不对称"角度强化:若某一技术革新(如数字化清算使社区货币的协调成本
    骤降一个数量级)确实扩大了社区货币的可及范围,作者可以援引 excluded_outcomes(1)
    辩称"这只是让实际规模更接近天花板,天花板本身未变"——但天花板是不可观测的
    (见 r3-C),这一辩护无法被经验反驳。严格措辞+不可观测天花板=事实上不可证伪的
    claim。宜将 statement 的措辞软化为可检验形式。

    上述 4 条新增均为 should,不改变 verdict。它们与前三轮的 12 条 should 合计 16 条,
    均为操作化精度/经验锚定/措辞透明度的改进建议,无一条触及推论的逻辑骨架或可证伪性。

    【能否判 verified?】能。评分卡的 verified 定义不要求 should 修复项清零。
    四轮独立审查一致确认:0 required + 无净杀反例 + 无 DED-004/007 结构复发。
    推论的非平凡核心(三通货生态区间,★格不在任一块单砖中)经受住了四轮对抗式攻击。
    判 verified,同时强烈建议作者在后续修订中处理累积的 should 修复项——
    尤其是(i)梯度连续化以消除阈值-DED-004 窄缝,(ii)挂钩程度 continuum 预注册以消除
    L4-009 事后口径风险,(iii)构念替代(弱关系→共享群体身份)诚实标注。
    这些修订虽不阻塞 verified,但对推论的经验操作性和体系的方法论信用至关重要。

  red_flag_findings:
    brick_conclusion: |
      独立重验(第四轮),攻不穿。逐词核对 BR-L2-009 与 BR-L2-011 全文:
      - BR-L2-009(verified, IEA=2.0):全文不含"通货""货币""社区货币""LETS""生态位"
        "区间""天花板""梯度决定规模"。该砖只讲信任有界且随社会距离衰减,是纯信任命题。
      - BR-L2-011(verified, IEA=1.9):全文不含"社会距离""信任梯度""生态位""社区货币"
        "三区间""同乡""天花板"。该砖只讲通货在匿名/不可追踪条件下替代记忆,是纯功能命题,
        且 scope 窄化为 D2 单一功能。
      DED-051 的非平凡内核——"社会距离谱上的三通货生态区间,区间 II=社区货币的专属生态位,
      天花板由信任衰减梯度决定"——确为两砖合力的真组合增量。BR-L2-011(a)"有共享记忆/
      身份可追踪的圈子内...不必然需要流通通货"与"区间 I=通货冗余"近义,BR-L2-011(b)
      "匿名/不可追踪...需当场两清媒介"与"区间 III=通货必需"近义,但这两格不是 DED-051
      的非平凡核心(标★格是中距离→社区货币最优+高距离→社区货币不可行)。author 在
      nontriviality_test 中诚实标注了这一点,未声称全表非平凡。
      ⇒ 不判 required,不判 should。四轮审查者一致攻不穿。

    nontriviality_cell_check: |
      独立重验(第四轮),攻不穿。2×3 逐格判空表:
      - 格(低距离, 无通货):BR-L2-011 已暗示"记忆可行则通货冗余",非平凡性低。author 诚实标注。
      - 格(中距离, 社区货币)★:核心非平凡格。BR-L2-009 不讲通货形态,BR-L2-011 不讲社会距离
        分层。任一块单砖无法推出"中等社会距离区间内社区货币是最优通货形态"。该格可被经验反例
        填充(所有中等距离交换由纯互惠或法币充分覆盖,社区货币从未独立存活≥5年)。genuine
        经验赌注,非同义反复。
      - 格(高距离, 法币):BR-L2-011 已基本覆盖"匿名交换需要通货",但对"为什么必须是法币
        而非社区货币"沉默。DED-051 的制度基础设施论证(法律强制/央行最后贷款人/存款保险)
        为该格增加了独立理论内容。
      - 格(高距离, 社区货币不可行)★:第二标星格。需要两砖合力+制度基础设施额外论证,
        可被经验反例填充(falsifiability(c):匿名规模社区货币存活≥10年且交易增长)。
      ⇒ 不判 required,不判 should。四轮审查者一致攻不穿。

    measurement_orthogonality: |
      独立重验(第四轮),未重蹈 DED-007,攻不穿。
      自变量:(i)社会距离——亲缘系数/交互频率/共享群体身份(事前行为指标,非通货数据);
      (ii)信任衰减梯度——信任博弈实验(委托人转交金额占比,行为测量)。因变量:社区货币
      存续时长+交易规模——公开记录/年报/案例研究(档案数据,独立于行为实验)。自变量与
      因变量使用不同构念、不同测量工具、不同数据生成过程,构念层面异源正交。anti_talisman_
      clause 四位一体禁令(禁由成败反推梯度/禁由失败反推梯度陡峭/禁以"成员少"代理"梯度
      陡峭"/禁见通货数据后重编码社会距离)在概念层保证方向分离。
      实操担忧(四轮一致):trust game 在已有社区货币的社区中可能受内生影响——参与者
      信任行为被其货币经验污染。但这是测量执行的 confounding,非构念焊死,可通过纳入
      非货币社区作为对照+工具变量策略缓解。与 DED-007 的"通货需求用货币量测"有本质区别。
      ⇒ 不判 required,不判 should。

    scope_hook_independent_of_result: |
      独立重验(第四轮),攻不穿。四项 excluded_outcomes 均按事前结构特征划定,不由结果回填:
      (1)技术设计=效率变量(区间内)vs 梯度=天花板变量(跨区间)——按理论内部角色划分。
      (2)法币在区间 I 的使用→因惯性/便利性/外部连通性,预注册不证伪。核心主张限定为
      区间 II 的存在性,不依赖"区间 I 禁止法币"。
      (3)加密货币/区块链→按信任机制类别(社会信任 vs 密码学信任)的事前结构排除。边界
      注意:数字化社区货币(Sardex 电子账本)与基于区块链的社区代币之间的实操界线未注册,
      宜补 operational discriminant。
      (4)法币崩溃时的临时替代→按"稳态 vs 临时真空期"结构判据,且给出可检验辅助预测
      (法币恢复后回缩至区间 II)。
      本轮额外检查:上述排除是否构成"排除所有可能反例"的口袋?逐一检验——(1)不排除
      "梯度不决定天花板(技术设计突破区间边界)"的反例,因为该反例的检验独立于排除钩子;
      (2)不排除"区间 II 空集"的反例;(3)加密货币的排除基于事前的信任机制结构差异,
      但若存在"以社会信任为基础且使用非区块链数字账本的匿名规模社区货币",它不在(3)的
      排除范围内,仍可构成对(c)的反例→排除非口袋;(4)明确声明是临时现象,且有辅助预测
      约束→非口袋。排除钩子设计良好,不构成 DED-005 式事后开脱。
      ⇒ 不判 required,不判 should。

    criterion_tier_match: |
      独立重验(第四轮),仍为 should。社会距离四档(血亲/熟人/同乡/匿名)→三通货区间
      (I=血亲+熟人, II=同乡, III=匿名)的 4→3 映射概念合理。信任衰减梯度三分(陡峭>30pp/
      中等 15-30pp/平缓<15pp)——三档划分有理论意义(分别对应质性不同的梯度制度),不是
      DED-006 式"连续量硬切二分"。但 15/30pp 阈值无理论或经验锚定,且恰好踩在 BR-L2-009
      honest_note 的红线("不可依赖某个具体阈值")上。
      本轮新增视角:改为连续预测(单调负相关)不仅是"更好"——它改变了推论的证伪结构。
      三档 categorical 预测下,每个反例都可以通过"阈值恰好在反例值附近"被质疑(阈值争议
      本身就是一种消化反例的方式,见 DED-004 窄缝 a)。连续预测下,一个显著正相关的
      Pearson r 或 Spearman ρ 就是净杀——没有阈值可争议。连续方案在方法论上更干净、
      更可判定,且尊重 BR-L2-009 的 guardrail。强烈推荐。
      ⇒ 不判 required,记 should(继承前三轮+本轮强化推荐连续方案)。

    anti_talisman_cashed: |
      独立重验(第四轮),概念层在位但锚上执行持续缺位(should,四轮一致)。
      四条禁令(禁由成败反推梯度/禁由失败反推梯度陡峭/禁以"成员少"代理"梯度陡峭"/
      禁见通货数据后重编码社会距离)概念层有效且完整,覆盖了最危险的四个反推方向。
      至少一个承重锚真独立测出驱动量:trust game 在方法论层面可独立测梯度,但三个
      supporting anchor(WIR/Trueque/日本)无一展示了实际独立梯度测量——WIR 的梯度归因
      是事后推理,Trueque 的梯度归因是叙事重构,日本案例的"梯度平缓"是 folk theory。
      anti_talisman_clause(4)要求"至少有一个锚点真正做到在同一社区内用信任博弈实验
      测出相邻社会距离档的信任落差"——至今未兑现。
      本轮新增评估:锚的独立测量缺位不影响 verified 裁决,因为(i)推论逻辑不依赖锚——
      锚是 illustrative 而非 deductive,前三轮一致确认;(ii)anti-talisman 在概念层在位,
      提供了测量独立性的方法论保障(trust game 测量在方法论上独立于货币存续数据);
      (iii)缺失的是锚的测量执行,而非 anti-talisman 条款本身的可操作性。
      ⇒ 不判 required。记 should(继承四轮的诚实标注建议)。强烈建议在至少一个锚所在
      社区开展实际的独立梯度测量,或引用已发表的信任博弈跨文化研究结果为梯度提供独立锚定。

    anchor_fact_check: |
      独立重验(第四轮),无 DED-007 式致命事实错,三锚各有过度解读(四轮一致)。

      逐项独立核查:
      (1)瑞士 WIR(1934 至今):~5 万家 SMEs/~90 年存续/WIR 法郎与 CHF 关联但二级市场
      有~2-5%折扣→部分独立于 CHF。事实正确。"从未扩展到非瑞士/非 SME"作为梯度天花板
      证据时,author 诚实标注了章程自限。"给鸟笼加锁后声称鸟没飞走证明飞不高"(r1)——
      章程限制与梯度天花板的贡献比例未剥离。90 年存续本身支持区间 II 稳态存在性(系统
      在人为边界内长期稳态运作是事实),但规模上限的归因不可靠。降级为 weak+拆分证据链。

      (2)阿根廷 Trueque(2001-2003):~6000 俱乐部/~250 万人/2002-2003 崩溃。事实正确。
      "初始区间 II→规模膨胀进入区间 III→匿名涌入→欺诈→崩溃"的叙事方向与推论一致。
      但 2001 年阿根廷经历货币局崩溃+银行冻结+主权违约三重极端冲击——trueque 崩溃中
      梯度天花板的独立贡献不可量化。因果归因过强,confidence 宜降为 weak。

      (3)日本社区货币(Peanut/府中市等):数十年存续/数百至数千人。事实正确。"日本梯度
      平缓"是 folk theory,未引用独立梯度测量。"梯度平缓→存续长久"与"梯度平缓→替代竞争
      加剧→规模受限"之间的方向性张力未解决(见 r2-B + 本轮 counterexample_hunt 独立验证)。

      Bristol Pound/Sardex/贸易信贷/Banco Palmas 见 counterexample_hunt。
      本轮新增案例:Worgl 实验(奥地利,1932-1933)——小镇(~4000 人)本地邮票货币,仅运行
      ~1 年即被央行禁止。存续短的原因不是梯度天花板而是法律/制度干预——提示:制度环境
      可以是比梯度更紧的 binding constraint。不构成反例(区间 II,存续短由外因),但进一步
      说明"梯度是唯一/主导天花板"的主张在经验中面临多因竞争。
      ⇒ 无致命事实错。记 should(继承四轮的诚实标注+降级建议)。

    definition_vs_prediction: |
      独立重验(第四轮),攻不穿。社会距离(亲缘系数/交互频率/共享群体身份的行为指标编码)
      和信任衰减梯度(trust game 行为测量)是可操作化的构念定义,不构成会导致同义反复的
      加厚定义。三个 falsifiability 条件各有明确 observable condition,不是"预测成立则条件
      满足、不成立则条件不满足"的定义循环。anti_talisman_clause(4)在概念层防止了社会距离
      编码被通货数据事后滑移。
      边界风险(四轮一致):trust game 实验参数(初始 endowment/匿名性/单次 vs 重复)若未
      预注册,不同实验设计可能给不同梯度读数→条件可通过实验设计选择被间接操控。但这是
      测量标准化问题,非定义-预测混淆。宜在 operationalization 中预注册实验 protocol。
      ⇒ 不判 required,不判 should。

    enumeration_and_species: |
      独立重验(第四轮),仍为 should。三区间(I/II/III)按 umbrella criterion——社会距离谱
      位置与互惠记忆可行性——定义,符合 DED-008(species 按伞级判据本身定义,非替代表征)。

      独立主动猎第 N+1 类,本轮新增两个未覆盖的区间机制:
      (a)【本轮新增】仪式化贸易伙伴关系(Ritualized Trade Partnerships):不同于 r3 猎的
      双边仪式化伙伴关系(osotua/anda)——这里指跨群体的、制度化的贸易伙伴关系,如
      美拉尼西亚的 kula ring、北美洲西北海岸的 potlatch 贸易网络。社会距离跨越同乡边界
      (跨岛屿/跨部落),通过仪式化的贝壳臂环/项链交换建立跨群体信用网络。不发行独立通货
      但执行通货的部分功能(价值储存+交换媒介)。属于区间 II 的边界案例——社会距离可能
      部分进入区间 III(跨群体=部分匿名),但仪式化的伙伴关系提供了信任替代。消化:进一步
      说明区间 II 的"通货/交换机制"谱系比"社区货币/LETS"宽得多——kula 是比 LETS 更古老、
      更持久的区间 II 机制,且它展示了一种不同于"群体身份"的信任桥接方式(仪式化的对等
      伙伴关系)。宜在 boundary_cases 中增加此类跨文化案例,以充实区间 II 机制的多样性图谱。

      (b)【本轮新增】共济会/兄弟会类组织的内部信用(Mutual Aid Societies):
      19-20 世纪欧美大量存在的互助社/共济会/兄弟会组织——成员数百至数万,基于仪式化
      的兄弟身份(非血亲/非同乡/非同业),提供内部信用/保险/丧葬互助。社会距离:共享
      仪式身份但不共享日常生活——介于同乡与匿名之间。不发行流通通货但执行跨期交换和
      风险分担功能。消化:互助社是区间 II 的另一种机制——它展示了"仪式化共享身份"如何
      在不依赖日常互动(不同于同乡/同业)的条件下桥接信任缺口。

      本轮还独立确认了前三轮猎的所有区间 II 机制(贸易信贷/ROSCA/Sardex/双边伙伴关系/
      声誉通货)均存在且相关。
      ⇒ 不判 required。记 should:区间 II 的交换/通货/信用机制谱系远比"社区货币/LETS"
      丰富,建议在 boundary_cases 中做系统性的跨文化枚举,以诚实反映推论的区间 II 覆盖
      范围远比当前文本声称的宽。这不会削弱推论——恰恰相反,更丰富的机制谱系使三区间
      模型更具解释力——但当前文本以"社区货币/LETS"代表区间 II 是不完整的。

    primary_suspect_aim: |
      独立重验(第四轮),primary_suspect=BR-L2-009 的可测量性与跨社区差异性——指得准。
      若梯度无法可靠测量或跨社区无显著差异,预测(b)不可执行。

      四轮累积识别的漏认弱点:
      (a)"软约束→硬天花板"升级未在 primary_suspect 中承认(继承 r1-6);
      (b)"弱关系→同乡/同业/同好"的构念替代未在 primary_suspect 中承认(继承 r1-3+
      r2-10+r3-A);
      (c)falsifiability(a)可操作性低(继承 r1-7);
      (d)三锚未展示独立梯度测量(继承 r1-1);
      (e)BR-L2-009 内部标签不一致,推论跟了非正式标签(继承 r2-10);
      (f)日本锚方向性张力(继承 r2-9);
      (g)梯度测量 fallback 方案缺位(继承 r3);
      (h)【本轮新增】梯度内生性反馈环——货币运作可能改变梯度(见 verdict_note A);
      (i)【本轮新增】梯度-规模共线性——梯度可能是社区规模的函数(见 verdict_note B)。

      上述 9 项均不改变 primary_suspect 指认的准确性——BR-L2-009 的可测量性与跨社区
      差异性确实是全推论最脆弱的腿——但 author 在 falsification_trace 中对这条腿的脆弱性
      的【程度】估计不足(仅提到"信噪比过低"和"衰减是否单调",未提内生性/共线性/
      构念替代等更深层的挑战)。宜在 primary_suspect 中诚实扩展脆弱性清单。
      ⇒ 不判 required。记 should(继承四轮累积建议)。

    caliber_registration_ambiguity: |
      独立重验(第四轮),仍为 should。社会距离四档有具体编码规则,梯度有三档阈值,
      存续时长有 t_end 判定(连续 12 月无记录),交易规模有 12 月窗口——基础口径已注册,
      比许多推论做得好。

      独立发现四处歧义(确认前三轮判断+本轮新增一条):
      (a)Bristol Pound 的"1:1 挂钩=非独立通货"排除判据属事后口径选择,触 L4-009 判例
      模式。按评分卡第 11 条,事后口径选择一律反向裁决——布里斯托尔镑应计为对 prediction
      (c)的边界压力,不得以事后口径消化。Banco Palmas(Palma 与 BRL 1:1 挂钩,27 年存续,
      区间 II)进一步说明挂钩 continuum 预注册的必要性——不能同一判据在区间 II 案例
      (被接受)和区间 III 边界案例(被排除)之间选择性适用。
      (b)"共享群体身份"档内方差未注册:同镇(高相互识别)vs 同城(低相互识别)/同宗教集会
      (高情感亲密)vs 同兴趣社群(低情感亲密),信任属性质异但归入同一档。
      (c)trust game 实验参数(初始 endowment/匿名性/单次 vs 重复/参与者是否是 CC 成员)
      未注册——不同参数给不同梯度读数。
      (d)【本轮补充】≥10 年门槛与 5 年、15 年之间的选择自由度——见 DED-004 窄缝分析。
      (e)【本轮新增】"同乡"与"同业/同好"的信任属性不同但 merge 为同一档:同行业协会
      成员之间可能有直接竞争关系(信任↓),同兴趣社群成员之间可能零和博弈(信任↓),
      而同乡之间至少共享居住地的正外部性(信任↑)。将三者合并为"同乡/同业/同好"一档
      可能掩盖了档内 trust 方向的分化——某些"同好"群体的信任水平可能接近匿名陌生人
      而非同乡。宜在 operationalization 中拆分或至少注册档内 trust 方向。
      ⇒ 不判 required(核心构念已注册基础口径,非"只有数字没有口径"),记 should
      (继承前三轮+本轮补充 e)。

    data_source_common_root: |
      独立重验(第四轮),N/A。本推论不涉及多数据源验证——梯度来自 trust game/WVS,
      货币数据来自公开记录/年报/案例研究,是不同的数据生成过程,不存在"多源共享同根"问题。
      ⇒ 不判 required,不判 should。

    api_access_vs_epistemic_independence: |
      独立重验(第四轮),N/A。本推论不涉及 API/MCP 查询声称多源独立。
      ⇒ 不判 required,不判 should。

  counterexample_hunt: |
    独立执行第四轮反例猎捕。三条攻击路径(四轮一致):
    (a)区间 II 空集——所有中等距离交换由纯互惠或法币充分覆盖;
    (b)梯度不决定天花板——陡峭梯度+大规模社区货币;
    (c)匿名规模社区货币——成员互不认识+存活≥10年+交易增长+不挂钩法币。

    【前三轮已猎案例,本轮独立验证后确认:】

    - Sardex(意大利撒丁岛,2010 至今):~1 万企业/~160 万人口/16 年/交易增长。
    编码关键:同岛企业主=同乡(区间 II)→支持推论;分散在 160 万人口区域中互不认识
    =匿名(区间 III)→挑战 prediction(c)。暴露"同乡"档过宽问题。不构成净杀。

    - 贸易信贷/供应商信贷(B2B net-30/60/90):全球 B2B 主流,以法币计价,万亿$规模。
    完美填补区间 II 功能缺口但范畴上不是"通货形态"。范畴消化有效——推论只讲通货形态,
    不讲信用工具。但"最优"一词在经验层面难以辩护(见 verdict_note C)。

    - Bristol Pound(2012-2020):~46 万人城市/1:1 GBP 挂钩/活跃 5-6 年。L4-009 事后口径
    模式:消化判据"1:1 挂钩=非独立通货"在见反例后才提出。按反向裁决→构成对 prediction
    (c)的边界压力(虽 5-6 年未达≥10 年门槛,但在城市匿名规模下已非平凡)。

    - Banco Palmas(巴西,1998 至今):~30,000 人 neighborhood/Palma 与 BRL 1:1 挂钩/
    27 年。区间 II(同 neighborhood)。支持区间 II 稳态存在,但与 Bristol Pound 挂钩程度的
    对比暴露了"挂钩 continuum"预注册的必要性——不能两个挂钩案例一个接受一个排除。

    - 标会/合会/ROSCA(全球普适):比亚社区货币更普遍/更古老/更稳健。范畴划分消化
    (非通货),但进一步质疑"最优"措辞。

    - Ithaca HOURS(美国,1991 至今):~35 年/数百至低数千用户/同镇→区间 II。支持理论。

    - 中世纪 lex mercatoria(11-15 世纪欧洲):制度创新桥接信任缺口,不发行独立通货。
    提示制度-梯度替代弹性可能比推论假设的更高。

    - 中国钱庄私票(清至民国):县域至跨县/数十年至百年以上。同乡/同业→区间 II。

    - 德国 Regiogeld(2000s~):~50+ 种区域货币,多数小/短命。方向性支持但无独立梯度测量。

    - 肯尼亚 M-Pesa(2007 至今):~3000 万用户,以 KES 计价的移动货币。纯匿名交易但基于
    法币+电信基础设施。排除在外(非法币替代也非社区货币)。反证推论的"为什么必须是法币"
    论证:法币的制度基础设施使 M-Pesa 成为可能。

    【本轮新增猎捕:】

    - Worgl 实验(奥地利,1932-1933):小镇(~4000 人)本地邮票货币(stamp scrip),因大萧条
    背景而启动,仅运行~1 年即被奥地利央行禁止。区间 II(同镇)。存续短不是梯度问题,
    而是法律/制度干预——提示制度环境可以是比梯度更紧的 binding constraint。消化:不构成
    反例(存续短由外生法律干预,非梯度机制),但"制度环境=更紧约束"的发现对"梯度是
    结构性天花板"的强主张构成 mild pressure。

    - 共济会/兄弟会互助社(19-20 世纪欧美):基于仪式化兄弟身份(非血亲/非同乡/非同业的
    第四类身份),成员数百至数万,提供内部信用/保险/丧葬互助。社会距离:介于同乡与匿名
    之间,通过仪式而非日常互动桥接信任。不发行流通通货。消化:展示了一种 DED-051 未覆盖
    的区间 II 信任桥接机制——"仪式化共享身份"——它不同于推论当前依赖的"共享群体身份
    (同乡/同业/同好)",因为兄弟会成员通常不共享日常生活空间。这不是推论的反例(兄弟会
    不是通货),但指示区间 II 的信任桥接机制比"同乡/同业/同好"更丰富。

    - Kula ring(美拉尼西亚,跨岛屿仪式化贸易):跨岛屿/跨部落的贝壳臂环与项链的仪式化交换
    网络,覆盖广阔地理区域,参与部落之间可能从未有过日常互动(社会距离跨度大,部分接近
    区间 III)。kula 物品本身承担了部分通货功能(价值储存+交换媒介+身份信号)。消化:kula
    是"仪式化信任桥接+非日常互动"的区间 II/III 边界案例——它说明在"共享群体身份"缺席
    的条件下,仪式化制度可以部分替代群体身份来桥接信任缺口。不构成净杀(首先 kula 物品
    不算社区货币,其次 kula 的高度仪式化成本使其无法扩展到日常交换),但使"同乡/同业/
    同好=区间 II 唯一信任基础"的隐含假设受到挑战。

    猎捕结论:【第四轮独立猎捕,未发现净杀反例】。核心主张——社会距离谱上的三通货生态
    区间,区间 II=社区货币的专属生态位,梯度决定天花板——经四轮猎捕未被杀伤。理论边界
    上的压力案例(Sardex/Bristol Pound/制度约束强于梯度约束/区间 II 机制多样性)均不构成
    required 级反例:它们要么依赖编码选择(Sardex),要么被范畴划分消化(贸易信贷/ROSCA),
    要么暴露的是操作化缺口而非逻辑缺陷。四条 DED-004 窄缝(阈值调参/同乡重编码/竞争张力/
    10 年门槛)使理论在边界上的经验钳制力有所减弱,但不影响核心的可证伪性——"独立梯度
    测量+陡峭梯度+大规模 CC"和"纯匿名+不挂钩法币+>10 年+交易增长"仍是两条清晰的、
    事前可判定的证伪路径。

  non_recurrence_of_ded004_007: |
    独立重验(第四轮),DED-004(不可证伪循环)与 DED-007(测量轴焊死)均未在结构性层面复发。

    DED-004(不可证伪循环):【未结构性复发。四条窄缝仍在,但均属可修复的 should 级】
    四条已识别的 DED-004 式窄缝(前三轮累积+本轮确认):
    (a)梯度阈值 15/30pp 的事后调参风险——连续方案可根治;
    (b)"同乡"档过宽的事后重编码风险——anti_talisman_clause(4)概念层禁止,但
    "共享常住地"操作化宽到可容纳滑移——收窄档位+预注册编码 protocol 可封堵;
    (c)"梯度平缓→竞争加剧"vs"梯度平缓→更大规模"的多自由度消化——引入"替代工具
    密度"控制变量可封堵;
    (d)falsifiability(c)的 10 年门槛选择自由度——给阈值附理论动机或改连续预测可封堵。

    本轮新增评估:四条窄缝是否累进为结构性 DED-004 复发?否。判定标准:推论的
    falsifiability 条件中是否存在至少一条【不依赖任何窄缝参数】的、事前可判定的净杀路径?
    存在两条:(i)独立测量的陡峭梯度+大规模 CC——如果梯度经 trust game 独立测出确为
    陡峭(>30pp),且该社区存在存活>10 年、成员>1000 人的 CC,预测(b)被证伪——此路径
    不依赖阈值调参(梯度可连续处理)、不依赖同乡编码(梯度独立测量),只需梯度测量的
    独立性和准确性;(ii)纯匿名+完全独立于法币+>10 年+交易增长——此路径不依赖
    挂钩 continuum(要求"完全独立"是 continuum 的端点,判据清晰)、不依赖 10 年阈值
    (若 CC 存活 30 年则远超任何合理阈值)。两条路径均为事前可判定的 clean test。
    窄缝使边界案例的判定变模糊,但不剥夺核心的可证伪性。DED-004 是"制度质量既是
    原因又是结果,无独立测量可能"的全面循环——DED-051 有独立的测量路径(trust game),
    二者性质不同。
    ⇒ 不判 required。窄缝已在 should 中记录,修复后推论的证伪结构将更干净。

    DED-007(焊死测量轴):【未复发】信任行为(trust game/WVS 测)与社区货币存续
    (公开记录/年报测)使用不同构念、不同测量工具、不同数据源。anti_talisman 四位一体
    禁令保证方向分离。实操中的 confounding(trust game 参与者被其货币经验内生影响)
    属测量执行问题,非构念焊死,可通过纳入非货币社区对照+事前梯度测量+工具变量缓解。
    ⇒ 不判 required,不判 should。

