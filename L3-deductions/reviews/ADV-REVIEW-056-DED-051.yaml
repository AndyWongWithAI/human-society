round_2:
  reviewer: "独立子 Agent (round 2, 全新独立上下文, 与 round_1 审查者无关)"
  verdict: needs_revision
  verdict_note: |
    本审查者独立核对了三份关键文件(BR-L2-009/BR-L2-011/DED-051),并独立执行了 13 条红旗逐条攻 +
    反例猎捕 + DED-004/007 复发检查。

    【总体判断】round_1 的 needs_revision 裁决成立且理由基本准确。DED-051 未经修订(r1 的 8 条 should
    fixes 均在原始文件中未被处理,review_summary 仍写"r1 未发生"),故本轮审查面对的是与 r1 相同的
    原始文本。核心机制骨架——BR-L2-009(信任有界+衰减)× BR-L2-011(通货=记忆替代)→ 社会距离谱上的
    三通货生态区间——是 genuine 的非平凡推理,★格(中距离→社区货币最优)不在任一块单砖中。

    本轮新发现三条 r1 未充分覆盖的问题:

    (A)【should,新增】BR-L2-009 内部"同乡"vs"弱关系"不一致,DED-051 跟了非正式标签:
    BR-L2-009 的人话摘要写"血亲→熟人→同乡→匿名陌生人",但 formal statement 写"血亲→熟人→弱关系
    →匿名陌生人"。DED-051 全文未出现"弱关系"三字,完全沿用了摘要的非正式标签"同乡",并将其操作化
    为"同乡/同业/同好"(共享群体身份)。这一操作化比 BR-L2-009 的"弱关系"(涵盖非共享身份的偶然相识、
    friend-of-friend、一次性交易对手等)窄得多。映射链:BR-L2-009 formal"弱关系"(宽)→ BR-L2-009
    summary"同乡"(窄,作为示例)→ DED-051 operationalization"同乡/同业/同好"(更窄,仅共享身份)。
    r1 的 should(3)已指出映射偏移但未追溯到 BR-L2-009 自身的内部不一致——这笔技术债在砖不在推论,
    但推论应诚实标注自己跟了 summary 而非 formal statement,并承认由此收窄了区间 II 的覆盖范围。

    (B)【should,新增】"梯度平缓→竞争加剧"与"梯度平缓→更大规模"的方向性张力未被 r1 充分压强:
    DED-051 的日本锚同时声称(a)梯度平缓→存续长久(支持主预测),(b)梯度平缓→竞争门槛降低→
    替代压力增大(削弱社区货币规模)。这两个机制的方向相反——若两者同时作用,平缓梯度对社区货币规模
    的净效应可为正/零/负,理论无法做方向性预测。更严重的是:若社区货币在平缓梯度区【小】→归因"竞争
    加剧";若【大】→归因"区间 II 宽"。三态中两态可被理论内部消化,只留"陡峭梯度+大规模"作为唯一
    明确反例——这是 DED-004 式多自由度消化反例的窄缝,虽未形成全面循环,但使预测(b)的可证伪性
    打了折扣。宜在 limitations 中诚实标注这一张力并明确:哪个机制在何种条件下主导。

    (C)【should,新增】BR-L2-009 的 honest_note 写"下游推论只可依赖'有界+衰减',不可依赖某个具体阈值",
    而 DED-051 不仅依赖了"有界+衰减",更进一步主张梯度构成刚性规模天花板,且设了 15/30pp 的具体
    梯度阈值。r1 的 should(6)已指出"软约束→硬天花板"升级,但未强调 15/30pp 这一具体数值阈值恰好
    踩在 BR-L2-009 明确画出的红线("不可依赖某个具体阈值")上。这不是说推论不能设自己的阈值——推论
    当然可以比砖走得更远——而是说推论应诚实承认自己在这一点上越过了砖的 guardrail,并承担由此带来
    的全部经验风险(若 15/30pp 阈值被数据拒绝,锅全在推论)。

    其余红旗判断:我独立重验了 brick=conclusion(两块砖全文逐词核对,确无"通货/社区货币/生态位/区间/
    天花板"——攻不穿)、测量轴正交(trust game vs 公共记录——不同构念不同工具不同数据源,攻不穿)、
    anti-talisman(四条禁令在位且双向禁反推,但锚上执行缺位——与 r1 一致)、DED-004/007 未复发
    (整体结构可证伪,轴独立),与 r1 结论一致。

    综上:0 条 required(核心逻辑未塌/无净杀反例/DED-004/007 未复发),r1 的 8 条 should +
    本轮新增 3 条 should = 11 条 should,集中在操作化与实证锚层面。判 needs_revision——
    外科修补后(尤其连续化梯度预测+诚实标注映射偏移+解决竞争张力)可复 verified。

  red_flag_findings:
    brick_conclusion: |
      独立重验,攻不穿。我逐词核对了 BR-L2-009 和 BR-L2-011 的全文:
      - BR-L2-009 全文不含"通货""货币""社区货币""LETS""生态位""区间""天花板""梯度决定"——
        它只讲信任有界且随社会距离衰减,是纯信任命题(verified, IEA=2.0)。
      - BR-L2-011 全文不含"社会距离""信任梯度""生态位""社区货币""三区间""同乡""天花板"——
        它只讲通货在匿名/不可追踪条件下替代记忆(D2 单一功能,verified, IEA=1.9)。
      DED-051 的非平凡内核——"社会距离谱上存在三个通货生态区间,区间 II 是社区货币的专属生态位,
      天花板由信任衰减梯度决定"——不在任一块砖的原文或近义中。两砖合力产生的三区间生态学模型
      是真组合增量。两块砖均有独立于 DED-051 的存在理由(演化生物学/博弈论/文化普适 vs
      Kocherlakota 定理/经济人类学)。
      唯一需要注意的:BR-L2-011 statement(a)"有共享记忆/身份可追踪的圈子内...不必然需要流通通货"
      与"区间 I=通货冗余"近义;statement(b)"匿名/不可追踪...需当场两清媒介"与"区间 III=通货必需"
      近义。但这两个格不是 DED-051 的非平凡核心(★格是中距离→社区货币),author 在
      nontriviality_test 中也诚实标注了这一点。非平凡主张未受砖平凡化威胁。
      ⇒ 不判 required,不判 should。

    nontriviality_cell_check: |
      独立重验,攻不穿。2×3 逐格判空:
      - 格(低距离, 无通货):BR-L2-011 已暗示,非平凡性低。✓ author 诚实标注。
      - 格(中距离, 社区货币)★:核心非平凡格。BR-L2-009 不讲通货形态,BR-L2-011 不讲社会距离
        分层——"中等社会距离→社区货币最优"需要两块砖合力,任一块单砖推不出。此格可被经验反例
        填充(所有中等距离交换由纯互惠或法币充分覆盖)。genuine 经验赌注。
      - 格(高距离, 法币):BR-L2-011 已基本覆盖"匿名交换需要通货",但对"为什么必须是法币而非
        社区货币"沉默。DED-051 补充的制度基础设施论证增加了独立理论内容。
      - 格(高距离, 社区货币不可行)★:第二标星格,同样需要两砖合力+额外论证。
      ⇒ 不判 required,不判 should。

    measurement_orthogonality: |
      独立重验,未重蹈 DED-007,攻不穿。
      自变量:(i)社会距离——亲缘系数/交互频率/共享群体身份(事前行为指标);(ii)信任衰减梯度——
      信任博弈实验中委托人转交金额占比(行为实验测量)。因变量:社区货币存续时长和交易规模——
      公开记录/年报/学术案例(档案数据)。自变量与因变量使用不同的构念、测量工具、数据生成过程,
      构念上异源正交。anti_talisman_clause 四条禁令在概念层有效防止双向反推。
      实操担忧:信任博弈实验若在已有社区货币的社区中执行,参与者的信任行为可能受其社区货币经验
      内生影响——但这是测量执行的 confounding,不是构念焊死。与 DED-007 的"通货需求用货币量测"
      有本质区别。
      ⇒ 不判 required,不判 should。

    scope_hook_independent_of_result: |
      独立重验,攻不穿。四项 excluded_outcomes 均按事前结构特征划:
      (1)技术设计→效率(区间内)vs 梯度→天花板(跨区间),按理论内部角色划分,非结果回填。
      (2)法币在区间 I 的使用→因惯性/便利性,预注册不证伪。核心主张明确限定为区间 II 的存在性。
      (3)加密货币→按信任机制类别(社会信任 vs 密码学信任)的事前结构排除,非事后口袋。
      (4)法币崩溃时的临时替代→按"稳态 vs 临时真空期"的结构判据,且给出可检验辅助预测
      (法币恢复后回缩)。
      与 r1 一致。边缘注意:excluded_outcome(3)中"数字账本 vs 密码学共识"的实操界线未注册——
      既是数字社区货币(Sardex 电子账本)又是区块链代币的混合形态如何归类?minor concern,不单独列。
      ⇒ 不判 required,不判 should。

    criterion_tier_match: |
      独立重验,部分命中(should)。社会距离四档(血亲/熟人/同乡/匿名)→三通货区间(I=1+2,II=3,III=4)
      的 4→3 映射概念合理。信任衰减梯度从连续量三分为陡峭/中等/平缓,阈值 15/30pp——
      这不是 DED-006 式"连续量硬切二分"(三档有理论意义),但 15/30pp 无理论或经验锚定。
      r1 的 should(5)建议改为连续预测(单调负相关),我独立判断:这是更好的方案,既绕过阈值问题
      又使预测更干净。若保留三档,至少需附 provisional 理论动机并标注"待经验标定"。
      ⇒ 不判 required,记 should(与 r1 should(5)合并,推荐连续方案)。

    anti_talisman_cashed: |
      独立重验,概念层在位但锚上执行缺位(should)。四条禁令覆盖反推四方向,概念层有效。
      至少一个承重锚真独立测出驱动量:信任博弈实验在方法论层面可独立测梯度,但三个 supporting
      anchor(WIR/Trueque/日本)无一展示了实际独立梯度测量——均为事后归因或 folk theory。
      anti-talisman_clause(4)要求"至少有一个锚点真正做到...在同一社区内用信任博弈实验测出相邻
      社会距离档的信任落差,不看该社区是否有社区货币、社区货币多大"——三个锚均未做到。
      r1 的 should(1)准确。额外注意:若信任博弈实验因成本/伦理/可行性原因在大多数社区货币所在
      社区中无法执行,则 anti-talisman 的"梯度独立测量"要求在实践层面可能空洞——推论需要一个
      实际可行的梯度测量方案(如 WVS 分项调查+行为博弈的替代方案)。
      ⇒ 不判 required,记 should(与 r1 should(1)合并)。

    anchor_fact_check: |
      独立重验,无 DED-007 式致命事实错,三锚各有过度解读(与 r1 一致)。

      逐项独立核查:
      (1)瑞士 WIR(1934 至今):~5 万家中小企业/~90 年/WIR 法郎与 CHF 挂钩但二级市场有~2-5%
      折扣→部分独立于 CHF。事实正确。但"从未扩展到非瑞士/非 SME"作为梯度天花板证据时,
      author 同时诚实标注了章程自限——章程限制与梯度天花板的贡献比例未剥离。"给鸟笼加锁后
      声称鸟没飞走证明飞不高"(r1 的比喻精准)。此外 WIR 法郎与 CHF 的 partial peg(有折扣)
      说明挂钩程度是 continuum,二分"挂钩=非独立"不适用。
      (2)阿根廷 Trueque(2001-2003):~6000 俱乐部/~250 万人/2002-2003 崩溃——事实正确。
      "初始区间 II→规模膨胀→匿名涌入→欺诈→崩溃"的叙事方向与推论一致,但 2001 年阿根廷
      经历了货币局崩溃+银行冻结+主权违约的三重极端冲击——在如此极端的条件下,trueque 的
      崩溃有多大比例归因于梯度天花板 vs 归因于"任何非主权通货在那种极端条件下都会面临的
      信任危机"不可知。因果归因过强。
      (3)日本社区货币(Peanut/府中市等):数十年存续/数百至数千人——事实正确。但"日本梯度
      平缓"是 folk theory,未引用任何信任梯度的独立测量。且"梯度平缓→存续长久"与"梯度平缓
      →替代竞争加剧→规模受限"之间存在方向性张力(见 verdict_note 新增 B),author 未处理。

      Bristol Pound 反例候选和 Sardex/贸易信贷/ROSCA 边界压力见 counterexample_hunt。
      ⇒ 锚无致命事实错。记 should(与 r1 should(1)(2)合并,新增竞争张力为独立 should)。

    definition_vs_prediction: |
      独立重验,攻不穿。社会距离(行为指标编码)和信任衰减梯度(信任博弈测量)是可操作化的构念
      定义,不构成会导致同义反复的加厚定义。三个 falsifiability 条件各有明确 observable condition,
      不是"预测成立则条件满足、不成立则条件不满足"的定义循环。anti_talisman_clause(4)防了
      社会距离编码被通货数据事后滑移。边缘风险:若信任博弈实验的参数(初始 endowment/匿名性/
      单次 vs 重复)未预注册,不同实验设计可能给不同梯度读数→条件可被实验设计选择间接操控。
      但这是测量标准化问题,非定义-预测混淆。
      ⇒ 不判 required,不判 should。

    enumeration_and_species: |
      独立重验,部分命中(should)。三区间(I/II/III)按 umbrella criterion——社会距离谱位置与互惠
      记忆可行性——定义,符合 DED-008(species 按伞级判据定义,非替代表征)。

      独立主动猎第 N+1 类:
      (a)区间 0(核心家庭内共享而非交换):r1 已指出。minor concern——血亲与核心家庭在通货需求
      上均无,归入区间 I 操作上可行但模糊了"共享"与"互惠"的质异。
      (b)区间 II 子 species 未穷尽:r1 列举贸易信贷/ROSCA/Sardex 三种非社区货币的区间 II 机制,
      我独立验证后同意。额外注意:贸易信贷(以法币计价的 B2B 信用工具)的全球规模以万亿美元计,
      社区货币以百万美元计——若贸易信贷在区间 II 比社区货币更高效/更普遍,则"社区货币是区间 II
      的【最优】通货形态"的"最优"一词面临实质挑战。"生态位存在"与"生态位被占据且最优"是
      两个不同的主张。宜将"最优"弱化为"生态位适配"或"结构性对应"。
      (c)区间 II/III 渐变过渡带:同城不同街区/同行业不同细分——过渡带的通货形态可能是混合的,
      三个离散区间是理想型。宜在 limitations 中承认。

      猎第 4 区间:未猎到与 I/II/III 正交的独立第 4 区间。区间 0(家庭共享)可视为 I 的子类。
      ⇒ 不判 required,记 should(与 r1 should(8)合并,新增"最优→生态位适配"措辞建议)。

    primary_suspect_aim: |
      独立重验,指对但漏认若干弱点(should)。primary_suspect=BR-L2-009 可测量性与跨社区差异性——
      指得准:若梯度无法可靠测量或跨社区无显著差异,预测(b)不可执行。

      r1 指出 4 个漏认弱点,我独立验证后同意其中 3 个。本轮额外发现:

      (a)【should,新增】BR-L2-009 内部标签不一致,推论跟了非正式标签:BR-L2-009 statement 写
      "弱关系"但人话摘要写"同乡",DED-051 完全采用后者并将"同乡"进一步窄化为"同乡/同业/同好"
      (共享群体身份)。这构成了一条静默的语义漂移链:弱关系(宽,含非共享身份的偶然相识等)→
      同乡(窄,仅共享地域)→同乡/同业/同好(更窄,仅共享身份群体)。若 BR-L2-009 的"弱关系"
      包含的那些非共享身份弱连接也落在区间 II 的社会距离上(它们确实在"熟人"和"匿名"之间),
      则它们被 DED-051 的操作化排除了——推论实际覆盖的区间 II 比它声称的要窄。这是一个 derivation
      透明度问题——文件声称"从 BR-L2-009 出发"但并未使用 BR-L2-009 的 formal 分类。
      (b)【should,新增】"梯度平缓→竞争加剧"的张力:若平缓梯度既扩大区间 II(有利于社区货币)
      又降低竞争门槛(不利于社区货币),则预测(b)的单调性假设可能被竞争效应抵消甚至反转。
      该张力未在 primary_suspect 或 secondary_suspect 中承认。
      (c)【should,与 r1 should(6)合并】"软约束→硬天花板"越过 BR-L2-009 guardrail:BR-L2-009
      honest_note 写"下游推论只可依赖'有界+衰减',不可依赖某个具体阈值"。DED-051 不仅主张
      梯度=天花板(比"有界+衰减"更强的命题),还设了 15/30pp 的具体阈值——恰好踩在砖的
      guardrail 红线上。推论有权比砖走得更远,但必须在 derivation 中诚实标注这一越界并承担全部
      经验风险。
      ⇒ 不判 required。r1 的 4 个 should + 本轮新增 2 个 should = 6 个 should 关联 primary_suspect。

    caliber_registration_ambiguity: |
      独立重验,部分命中(should,与 r1 一致)。社会距离四档有具体编码规则,梯度有三档阈值,
      存续时长有 t_end 判定(连续 12 月无记录),交易规模有 12 月窗口——比许多推论做得好。

      独立发现三处歧义:
      (a)Bristol Pound 排除判据(1:1 挂钩=非独立通货)属事后口径选择,触 L4-009 判例模式:
      author 在 counterexamples 中见到布里斯托尔镑(城市规模~46 万人,活跃 5-6 年)后,
      提出"1:1 挂钩法币不算独立通货"的排除标准,并诚实标注"此排除判据需在审查中辩论"。
      这正是评分卡第 11 条描述的模式——口径在反例出现后才定死,方向恰好救推论。按"事后口径
      选择一律反向裁决":布里斯托尔镑应计为对 prediction(c)的边界压力,不得以事后口径消化。
      此外,若严格执行"1:1 挂钩=排除",WIR(WIR 法郎与 CHF 参照但二级市场折价~2-5%)和
      许多 LETS 系统(以法币参照定价)也将被波及——排除口径的适用范围未被预注册。
      (b)"共享群体身份"档内方差:同镇(高相互识别)与同城(低相互识别)/同宗教集会(高情感亲密)
      与同兴趣社群(低情感亲密)被归入同一档,信任属性质异却未注册档内方差。
      (c)信任博弈实验参数未注册:初始 endowment/匿名性条件/单次 vs 重复/参与者是否是社区货币
      成员——这些参数系统性影响梯度测量结果,未被注册。
      ⇒ 不判 required(核心构念已注册口径,非"只有数字没有口径"),记 should(与 r1 should(4)合并,
      新增(b)(c)为 minor concerns)。

    data_source_common_root: |
      独立重验,未命中(N/A)。本推论不涉及多数据源验证——梯度来自 trust game/WVS,
      货币数据来自公开记录/年报,是不同的数据生成过程,无多源同根问题。
      ⇒ 不判 required,不判 should。

    api_access_vs_epistemic_independence: |
      独立重验,未命中(N/A)。本推论不涉及 API/MCP 查询声称多源独立。
      ⇒ 不判 required,不判 should。

  counterexample_hunt: |
    独立执行反例猎捕,三条攻击路径(与 r1 相同):
    (a)区间 II 空集——所有中等距离交换由纯互惠或法币覆盖;
    (b)梯度不决定天花板——陡峭梯度+大规模社区货币;
    (c)匿名规模社区货币——成员互不认识+存活≥10 年+交易增长。

    【r1 已猎的案例,我独立验证后确认:】

    - Sardex(意大利撒丁岛,2010 至今):~1 万企业/~160 万人口区域/16 年/交易增长。
      独立判断:编码取决于社会距离分类——若"同岛企业主"=同乡(区间 II),支持推论;
      若"分散在 160 万人口区域中互不认识"=匿名(区间 III),挑战 prediction(c)。
      这是"同乡"档过宽的直接后果。消化:不构成净杀,但暴露编码粒度问题。
      【should,关联 should(3)】

    - 贸易信贷/供应商信贷(B2B net-30/60/90):全球 B2B 主流,以法币计价,万亿$规模。
      完美填补区间 II 的功能缺口但不算"社区货币"。若贸易信贷在区间 II 比社区货币更高效
      且更普遍,"社区货币是区间 II 最优通货形态"的"最优"主张悬浮。消化:推论是关于通货形态,
      贸易信贷是信用工具——消化有效但削弱推论的现实意义。
      【should,关联 species 枚举+措辞建议】

    - Bristol Pound(2012-2020):~46 万人城市/1:1 英镑挂钩/活跃 5-6 年。
      独立判断:触 L4-009 事后口径选择模式。按反向裁决:构成对 prediction(c)的边界压力
      (虽未达≥10 年门槛,但 5-6 年在城市规模+匿名条件下已非平凡)。不得以事后口径消化。
      【should,关联口径注册+反向裁决】

    - 标会/合会/ROSCA(全球普适):5-50 人,基于群体身份的轮流储蓄与信贷。不发行流通通货
      但承担部分通货功能。比社区货币更普遍、更古老、更稳健——进一步质疑"最"字。
      【minor should,建议 boundary_cases 增加讨论】

    【本轮新增猎捕:】

    - Ithaca HOURS(美国纽约州 Ithaca,1991 至今):最老且最成功的美国社区货币之一,
      运营~35 年。Ithaca 人口~3 万,活跃用户估计数百至低数千。成员间社会距离:同镇/同街区
      →区间 II。存续时长极长+规模小→与日本案例同向,支持"区间 II 稳态存在但规模受限"。
      不构成反例。但注意:35 年存续在一个梯度可能较平缓(美国小镇高社会资本)的社区中,与
      预测(b)方向一致——但梯度同样未经独立测量。

    - 中世纪 lex mercatoria(商人习惯法,11-15 世纪欧洲):跨国商人网络发展出私人法律与仲裁
      体系,使信用能在互不认识的商人之间跨长距离延伸。社会距离:同行业(跨国商人)但多数互不
      认识→区间 II/III 边界。不发行独立通货(用法币/金银),但通过制度创新(私人仲裁+集体抵制
      威胁)桥接了社会距离的信任缺口。消化:lex mercatoria 说明制度创新(非仅是信任梯度)可以
      扩展区间 II 的边界——梯度可能是约束之一,但制度设计可以部分补偿梯度。这与推论的核心
      主张(梯度是结构性天花板,技术/制度设计不能突破)存在张力。不构成净杀(lex mercatoria
      不涉及独立通货发行),但提示制度-梯度之间的替代弹性可能比推论假设的更高。
      【minor should,建议在 limitations 中讨论制度创新是否可部分补偿梯度】

    - 中国钱庄/银号私票(清至民国):地方钱庄发行私票(钱票/银票)在县域或跨县流通,
      部分体系覆盖数十万人口,持续数十年至百年以上。社会距离:同乡(同县/同府)为主,
      但大钱庄的私票流通范围可覆盖多县→社会距离跨度大。消化:私票流通仍以商号间的
      重复交易网络为信任基础(钱庄之间有同业拆借和清算关系),并非纯匿名流通。区间 II。

    - 德国 Regiogeld(区域货币运动,2000s~):~50+ 种区域货币(Chiemgauer 最大,~600 企业
      +~3000 用户)。社会距离:同乡(同区域)→区间 II。大多数规模小/寿命短→与"梯度决定
      天花板"方向一致但同样未经梯度独立测量。

    猎捕结论:【无净杀反例】。Sardex 被编码模糊性消化,Bristol Pound 被事后口径消化(但该消化
    违规),贸易信贷被范畴划分消化。推论的核心主张经猎捕未被杀伤。但猎捕中暴露的"同乡档过宽
    +事后口径+L4-009 模式"三个操作性缺口使推论在现状下不宜判 verified——这些缺口不致命
    (均可修复),但累积量使操作层面的可信度不足。

  non_recurrence_of_ded004_007: |
    独立重验,DED-004(不可证伪循环)与 DED-007(测量轴焊死)均未在结构性层面复发。

    DED-004(不可证伪循环):【未复发,但有两条 should 级窄缝,加上本轮新发现一条】
    (a)梯度阈值 15/30pp 的事后调参风险:若反例梯度值 32pp(>30pp)但社区货币大,
    author 可辩称阈值应为 35pp→消化反例。这是 DED-004 的经典模式。
    r1 should(5)推荐改为连续预测以根治此缝——我独立判断强烈同意。
    (b)"同乡"档过宽的事后重编码风险:同城 50 万人→初始编码"匿名",但若该城市社区货币存活
    15 年→author 可辩称"成员因长期同城已形成共享身份→重编码为同乡"。anti_talisman_clause(4)
    概念上禁止了这一点,但"共享常住地"的操作化宽到可以容纳此事后滑移。
    (c)【本轮新增】"梯度平缓→竞争加剧"的多自由度消化风险:若平缓梯度+大社区货币→
    归因"区间 II 宽";若平缓梯度+小社区货币→归因"竞争加剧";若陡峭梯度+小社区货币→
    归因"天花板低"。三态中两态可内部消化,只留"陡峭+大"作为唯一硬反例——自由度偏高。
    这虽未形成 DED-004 式全面循环(因为仍有"陡峭+大"这一明确反例形态),但使预测(b)的
    可证伪性打了折扣。宜通过明确"哪个机制在何种条件下主导"来封堵。

    DED-007(焊死测量轴):【未复发】。信任行为(trust game/WVS 测)与社区货币存续(公开记录/
    年报测)使用不同构念、不同测量工具、不同数据源。anti-talisman 四位一体禁令保证方向分离。
    实操中的 confounding(trust game 参与者被其货币经验内生影响)属于测量执行问题,非构念焊死。
    ⇒ 不判 required,不判 should。窄缝已在 should 中记录。

  required_fixes: []

  should_fixes:
    - |
      [should, 继承 r1] 三锚诚实标注梯度为事后归因而非独立测量:在 real_world_anchors 的三个
      supporting anchor 的 evidence 中,分别加注"梯度归因未经独立测量:本锚以社区货币的存续/规模
      模式反推其所在社区的信任衰减梯度特征,违反了 anti_talisman_clause(1)(2)的精神。本锚仅作为
      '推论预测方向与案例叙事方向一致'的 illustrative evidence,不作为 confirmatory evidence。"
    - |
      [should, 继承 r1] WIR 锚降级并拆分证据链:将 WIR confidence 从 moderate 降为 weak(章程限制
      与梯度天花板贡献未剥离),拆分为(a)90 年存续→支持区间 II 生态位存在性(即使有人为边界,系统
      在其边界内长期稳态运作仍是事实);(b)规模限于瑞士 SME→章程自限与梯度天花板贡献未剥离,
      不可归因于梯度。
    - |
      [should, 继承 r1 + 本轮强化] 收窄"同乡"档或注册档内方差 + 标注与 BR-L2-009 的映射偏移。
      本轮强化:BR-L2-009 内部存在标签不一致——formal statement 写"弱关系",人话摘要写"同乡",
      DED-051 完全沿用了摘要的非正式标签,并将其进一步窄化为"同乡/同业/同好"(共享群体身份)。
      映射链:弱关系(宽)→同乡(窄,摘要)→同乡/同业/同好(更窄,推论操作化)。需在 derivation
      中诚实标注:(a)本推论跟了 BR-L2-009 摘要的"同乡"标签而非 formal statement 的"弱关系";
      (b)将"同乡"操作化为"共享群体身份"收窄了 BR-L2-009 原始"弱关系"的范围——非共享身份的
      弱连接(偶然相识/friend-of-friend/一次性交易对手)被排除在区间 II 外;(c)同乡档内方差大
      (同镇 vs 同城信任属性质异),稳健性检验建议按人口规模分档。
    - |
      [should, 继承 r1 + 本轮强化] Bristol Pound 适用 L4-009 反向裁决 + 预注册挂钩程度判据。
      本轮强化:Bristol Pound 的"1:1 挂钩英镑=非独立通货"排除判据在见到反例后才提出,
      严格触 L4-009 判例模式。按评分卡第 11 条,事后口径选择一律反向裁决——布里斯托尔镑
      应计为对 prediction(c)的边界压力(城市规模~46 万人、活跃 5-6 年,虽未达≥10 年门槛但
      在城市匿名条件下已非平凡),不得以事后口径消化。同时预注册"法币挂钩程度"为 continuum
      (完全挂钩/半挂钩/完全独立),而非见到反例后发明二分排除。诚实验证:此 continuum 会波及
      WIR(WIR 法郎与 CHF 参照但二级市场~2-5%折价——算半挂钩)和其他以法币参照定价的 LETS。
    - |
      [should, 继承 r1 + 本轮强化] 梯度阈值附 provisional 理论动机或改连续预测。
      本轮强化:15/30pp 不仅是无理论动机的问题——BR-L2-009 的 honest_note 明确写"下游推论
      只可依赖'有界+衰减',不可依赖某个具体阈值"。设 15/30pp 的具体阈值恰好踩在这条红线
      上。强烈推荐改为连续方案:核心预测(b)改为"信任衰减梯度与社区货币规模(成员数/交易量/
      存续时长)存在单调负相关"——一个相关系数+显著性检验即可,绕过所有阈值问题,也更干净。
      若保留三档,必须:(a)给 15/30pp 附 provisional 理论动机,(b)诚实标注"本推论的阈值设定
      越过了 BR-L2-009 的 guardrail——若阈值被数据拒绝,锅全在推论",(c)标注为"待经验标定参数"。
    - |
      [should, 继承 r1] 标注 BR-L2-009"软约束→硬天花板"的推论升级及额外风险:在 derivation
      step 4 或 limitations 中,增加诚实标注——BR-L2-009 的 honest_note 声明'有界+衰减'为软约束,
      本推论额外主张此软约束对社区货币构成刚性规模天花板。这一升级是本推论承担的经验风险:
      若社区货币的规模上限被经验证明由技术设计/制度环境/网络效应等非梯度因素主导,
      锅在推论不在砖。
    - |
      [should, 继承 r1] 重构 falsifiability(a)为可操作形式:将当前近乎全称否定改为可被具体研究
      发现证伪的形式,指定分子/分母/阈值。示例:"在跨≥10 个独立社区/文化的比较研究中,
      中等社会距离(同乡/同业/同好)的交换≥90%由纯互惠或法币覆盖,社区货币类机制的
      交易量占比<5%且无一案例存活≥5 年"。
    - |
      [should, 继承 r1 + 本轮强化] 在 boundary_cases 中讨论区间 II 的非社区货币机制。
      本轮强化:除 r1 列举的贸易信贷/ROSCA/Sardex 外,需额外讨论:(a)中世纪 lex mercatoria
      (制度创新桥接信任缺口的边界案例——制度是否可部分补偿梯度?);(b)将"社区货币是区间 II
      的【最优】通货形态"的措辞弱化为"生态位适配"或"结构性对应"——贸易信贷的万亿$规模
      与社区货币的百万$规模的对比使"最优"一词难以在经验层面辩护。保留"最优"的理论主张
      (在"不依赖法币制度基础设施"这一维度上的最优)但诚实标注其在经验层面的张力。
    - |
      [should, 本轮新增] 解决"梯度平缓→竞争加剧"与"梯度平缓→更大规模"的方向性张力:
      日本锚同时声称(a)平缓梯度→存续长久(区间 II 宽),(b)平缓梯度→替代竞争加剧(积分卡/
      商店街券等半正式工具)。两机制方向相反——若同时作用,平缓梯度对社区货币规模的净效应
      可为正/零/负,预测(b)的单调性不可靠。宜:(a)在 limitations 中诚实标注这一张力;
      (b)明确声明哪个机制在何种条件下主导(如"在替代工具密度低的社区中,平缓梯度的区间扩宽
      效应主导;在替代工具密度高的社区中,竞争效应可能抵消区间扩宽效应");(c)或引入"替代工具
      密度"作为控制变量,使预测(b)的条件形式为"控制替代工具密度后,梯度与社区货币规模负相关"。
      此条与 DED-004 窄缝(c)联动——不封堵此张力,理论可内部消化三态中两态。
    - |
      [should, 本轮新增] 标注 BR-L2-009 内部标签不一致及推论的标签选择:
      BR-L2-009 的 formal statement 使用"弱关系"作为第三档,人话摘要使用"同乡"作为示例——
      两处不一致(砖的内部问题,非推论过错)。DED-051 全文使用"同乡/同业/同好"且未出现
      "弱关系"一词。需在 derivation step 1 中诚实标注:"BR-L2-009 的 formal statement 将第三档
      定义为'弱关系'(weak ties),本推论沿用其人话摘要的'同乡'标签并将其操作化为'共享群体
      身份'(同乡/同业/同好)。这一操作化比 BR-L2-009 formal statement 的'弱关系'更窄——
      非共享身份的弱连接不在本推论的区间 II 覆盖内。若这些被排除的弱连接在经验上也处于
      '互惠不够用、法币过重'的中间地带,则本推论的区间 II 边界需要相应扩展。"
    - |
      [should, 本轮新增] 推荐将 falsifiability(c)的≥10 年门槛与 Bristol Pound 的 5-6 年活跃期
      之间的差距纳入考量:当前(c)要求"维持活跃运营≥10 年",布里斯托尔镑~5-6 年未达门槛,
      但若将门槛设为 5 年(一个同样 defensible 的阈值),布里斯托尔镑将构成净杀反例。
      10 年阈值本身应附理论动机(为什么是 10 年而非 5 年/15 年?),否则面临与梯度阈值同样的
      "事后调参"风险。宜:(a)给 10 年阈值附 provisional 动机(如参照经济周期/社区货币代际),
      或(b)将存续时长作为连续变量处理,预测改为"社区货币在区间 III(匿名社会距离)的存续时长
      显著低于区间 II"。
