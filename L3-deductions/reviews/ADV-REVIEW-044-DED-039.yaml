        "【崩解非对称性风险——代码型协调的双刃剑】代码型协调降低合作启动成本(启动
        更快、规模更大),但同样降低退出/崩解成本(崩解更快、更彻底)。叙事型协调中,共享
        信念为退出制造心理摩擦(成员因'相信这个事业'而在困难时留持);代码型协调中,算法
        触发清算/自动平仓无摩擦——崩解是瞬时的、全量的。
        操作化检验:比较代码型协调体与叙事型协调体在外部冲击(市场崩盘/监管打击/安全
        事件)后的生存概率。若代码型协调体的 hazard ratio > 2(控制规模、年龄、资源后),
        则推论需附加韧性折扣——'代码可替代叙事维持日常协调,但可能无法替代叙事提供
