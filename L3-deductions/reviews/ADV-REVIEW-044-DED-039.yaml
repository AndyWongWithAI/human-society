  counterexample_hunt: |
    【猎捕策略】五条独立攻击路径:
    α:薄叙事+大规模合作+无AI代码协调——若存在,AI特异性因果归因被削弱;
    β:厚叙事+AI代码协调+合作失败——若存在,代码无法在叙事已就位时增量贡献;
    γ:危机时刻代码型协调的系统性叙事依赖——若异常时刻占比高,降级需限定稳态;
    δ:AI代码协调体中"验证型信任"占比极低——若<10%,当前"代码型协调"在认识论上
      主要是新形态的想象秩序;
    ε:跨文化/跨时期搜索——前现代的非AI代码型协调(如古代官僚系统的文书规则/印
      章制度/账本)是否曾实现薄叙事+大规模合作?

    【猎获】

    1. Wikipedia(薄叙事+大规模合作+无AI代码协调,置信度:高):
    Wikipedia拥有~100K月活跃编辑者,协调机制(wiki版本控制+社群规范+讨论页+仲裁
    委员会)不依赖AI代码。任何人均可编辑,无需共享意识形态——只需遵循编辑规范
    (NPOV/可验证性/非原创研究等政策,这些是"协议规则"而非"想象秩序")。
    消化:Wikipedia的协调机制本身是代码型协调的一种形式——wiki版本控制记录所有
    编辑历史(不可篡改记录),编辑规范和仲裁机制是"算法规则"的人工执行版本。但
    它不使用BR-L2-026意义上的AI能力(无LLM级无限记忆/无自动关系追踪/无24/7自动
    执行——人类编辑者仍是信息处理的基本单元)。此案例表明:"薄叙事+大规模合作"
    可在【非AI】代码型协调下实现。消化的充分性存疑:若wiki技术(1970年代原型,
    1990年代Web普及)即可实现薄叙事+大规模合作,AI的增量贡献何在?预测(b)应能
    分离这一贡献——若代码型协调体中AI渗透率(非wiki式的版本控制)的边际贡献不
    显著,AI特异性因果归因被削弱。
    ⇒ 消化(非净杀)。暴露AI特异性因果归因的结构性问题(见should-1)。

    2. OpenStreetMap(薄叙事+大规模合作+无AI代码协调,置信度:高):
    类似于Wikipedia——数百万贡献者,薄叙事(无需意识形态认同),协调通过版本控制
    (OSM的数据模型+changeset历史)和社群规范。进一步强化了"薄叙事+大规模合作
    可在非AI代码协调下实现"的模式。
    ⇒ 消化(非净杀)。与Wikipedia属同一模式。

    3. Stack Overflow / Stack Exchange(薄叙事+大规模合作+非AI算法协调,置信度:中):
    数百万用户,薄叙事(无需意识形态认同),协调通过声望系统+社区审核+关闭/重开
    投票机制。声望系统是算法(确定性规则,非AI),但实现了自动执行(声望门槛→权限)
    和不可篡改记录(所有编辑和投票可追溯)。此案例支持"代码型协调可替代叙事"的
    核心主张,但代码是确定性规则系统而非AI系统——再次表明因果权重不一定需要AI。
    ⇒ 消化(非净杀)。强化AI特异性问题。

    4. 国际科学合作(CERN LHC/人类基因组计划/ITERT,置信度:中):
    薄叙事(科学规范=可验证性/同行评议,非意识形态),大规模合作(数千科学家跨
    数十国家),协调通过实验协议+数据标准+发表规则。这些协议是"代码型协调"的
    非数字版本——确定性规则+透明记录+独立验证。推论的"代码型协调"概念若扩展到
    包含"人类执行的协议规则",则薄叙事+大规模合作的实例远早于AI出现(科学革命
    以来的学术共同体即如此)。这使推论面临的挑战从"AI是否使此格可能"变为"此格
    是否一直是可能的(只是未被BR-L2-003正确预测)"。
    ⇒ 消化(非净杀)。暴露"代码型协调"概念边界的模糊性。

    5. The DAO危机与后续DAO叙事依赖(已在文件反例锚中,置信度:moderate):
    文件自身已将The DAO(2016)列为反例。额外猎取:检查2016年以来所有重大DAO治理
    危机(如MakerDAO Black Thursday 2020, Solana wormhole hack recovery, Nomad
    bridge hack recovery)——在所有这些案例中,当代码无法预编码的异常情况出现时,
    社区都诉诸了叙事型协调(论坛讨论/治理投票/社区共识构建)来做出"打破或重写
    规则"的决策。文件将此消化为"异常时刻叙事回归,推论的降级需限定为稳态条件"。
    消化的充分性取决于异常时刻的频率和重要性。若异常时刻占比>10%且异常决策对
    合作存续有决定性影响,"必要条件降级"的实践意义大幅收窄——叙事在最重要的
    时刻仍是必要的。
    ⇒ 消化(非净杀)。揭示"稳态限定"的实践重要性(见should相邻讨论)。

    6. 额外猎取ε:前现代官僚系统的"代码型协调"(中国古代官僚文书制度/罗马帝国
    的法律与行政记录/伊斯兰瓦克夫 endowment的书面规则,置信度:低-中):
    前现代官僚系统使用文书规则(standardized forms/procedures)、印章制度(不可篡改
    的记录——伪造印章有重罚)、账本(透明记录)实现了某种程度上的大规模陌生人
    合作(如帝国的税收/征兵/邮政)。这些都是"代码型协调"的非数字原型——确定性
    规则+可验证记录+自动执行(规则触发后果不依赖执行者的个人判断)。如果前现代
    官僚系统已在某种程度上实现了"薄叙事+大规模合作"(纳税人不需信仰皇帝的神性,
    只需服从规则+知道不服从有后果),则推论的历史新颖性被削弱。此猎获的置信度较低
    (前现代官僚的叙事成分——如"君权神授""天命"——往往同时很强),但值得标注为
    需进一步检验的历史边界案例。
    ⇒ 消化(非净杀但存疑)。置信度低,需进一步历史检验。

    【贯通模式】
    猎获1-4共享同一模式:薄叙事+大规模合作可在多种非AI协调机制下实现(Wiki版本
    控制/确定声望算法/科学协议规则)。猎获5确认文件已承认的危机时刻叙事依赖。
    猎获6提示"代码型协调"的非数字历史先例。

    综合评估:没有反例净杀推论核心。即使薄叙事+大规模合作可在非AI条件下实现,
    这弱化了AI特异性(推论需要将核心主张从"AI代码使此格可能"修正为"AI代码
    是填充此格的充分条件之一"),但不推翻"代码型协调可替代叙事"这一更广义的
    核心主张。DAOs的危机时刻叙事依赖已被文件限定为"稳态条件"——此限定是诚实且
    必要的,但限定的实践意义需进一步操作化(异常时刻频率阈值注册)。

    警告:反例猎捕揭示了推论在实践中比文件falsifiability段措辞更难被证伪——因为
    "代码型协调"的概念边界(Wiki是否算代码型?科学的协议规则是否算代码型?前现代
    官僚文书是否算代码型?)足够灵活,可以在事后将潜在反例重归类为支持案例。这
    不是DED-004式的逻辑循环(分类判据有独立标准——是否有确定性规则/不可篡改记录/
    自动执行),但"分类判据的实践弹性"使推论的实证风险低于文件声称水平。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发】。

    推论的falsifiability(a)(b)(c)三个条件均有操作化的检验路径:
    (a)叙事-规模相关性分叉——跨合作体统计检验,可被观测数据独立拒绝。
    (b)AI渗透率-叙事边际贡献——面板固定效应模型,可被观测数据独立拒绝。
    (c)规模-叙事解耦——历史案例配对t检验,可被观测数据独立拒绝。

    汇总裁决明确:若仅(a)成立而(b)(c)不成立→降级为选择效应;若三个均不成立→
    全面证伪。失败条件清晰且不可逆转(不得诉求"未来会成立")。

    anti-talisman五禁令封死了最常见的反向推断逃逸路径:(1)禁合作规模大→反推
    叙事厚;(2)禁规模不够大→反推AI不成熟;(3)禁形成叙事→反推是叙事型协调;
    (4)禁"代码是新叙事"消解;(5)双向锁定禁时间维度的推迟证伪/证实。

    与DED-004的根本差异:DED-004的核心问题是"用结论定义前提→永远为真"的逻辑
    循环。DED-039的前提(叙事厚度/协调媒介类型)有独立于结论(合作规模)的测量
    标准,结论不构成前提的定义成分。逻辑结构可证伪。

    相邻风险(非DED-004级):"代码型协调"概念边界的实践弹性(见counterexample_hunt
    贯通模式)使事后分类有一定灵活性,但分类判据(确定性规则/不可篡改记录/自动执行)
    可事前应用且独立于合作规模——这不是逻辑循环而是边界模糊性。
    ⇒ DED-004 未复发。

    DED-007(测量轴焊死):【未复发】。

    自变量集{coordination_medium_type, narrative_thickness}的测量方案与被预测量
    {cooperation_scale}的测量方案在概念上异源:
    - coordination_medium_type:内容分析编码(通信样本中叙事型论证vs代码型论证的占比)
    - narrative_thickness:三项指标合成(准入门槛/叙事密度/争议叙事诉求)
    - cooperation_scale:月活跃贡献者数或参与率

    不存在DED-007式数学恒等式焊死——叙事厚度综合分不是由合作规模计算得出的函数,
    合作规模也不是由叙事厚度计算得出的函数。两者回答不同领域的问题(协调方式vs
    参与人数),使用不同的数据源(通信内容vs活动记录)。

    唯一的软接触面:两个自变量之间共享指标(ii)的测量通道(见red_flag measurement_
    orthogonality和should-②)。这是自变量间的软焊点,不是自变量与被预测量间的焊点——
    它不构成DED-007的复发(DED-007的核心问题是"自变量由被预测量数学计算得出")。

    另一个需标注的软接触面:高合作规模本身可能催生叙事(成功的社区自然产生文化认同),
    使叙事厚度与合作规模在时序上产生反馈关系。但这是真实的因果反馈,不是测量伪影——
    且anti-talisman(1)和excluded_outcome(3)的时间顺序判据已对此做了防护。
    ⇒ DED-007 未复发。

