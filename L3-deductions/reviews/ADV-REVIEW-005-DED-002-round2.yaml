type: adversarial_review
layer: L3-deductions
round: 2
人话摘要: "这是对推论 DED-002 修订版的第二轮审查：上一轮五个毛病（冰岛反例、'一条规矩怎么数'等）都补好了，新提的三个只是改进建议，最终从'候选'升为'已通过审查'。"

# === 挑战者（第二轮）===

challenger:
  identity: "独立审查者——第二轮审查修订版"
  date: 2026-07-13

  prior_challenges_status:
    C1_iceland:
      original: "冰岛自由邦是强有力的潜在反例 (critical)"
      revised: |
        已修正。重新分类为专业化验证：法律宣讲人制度正是
        "专门角色记忆和解释规范"的实例。普通冰岛人不能随时
        独立查询法律——规范的民主可达性低。同时暴露了专业化
        的稳定性条件问题（需要可靠的传承机制+高社会地位激励），
        这在修订版中已补充讨论。
      status: resolved

    C2_hammurabi_delay:
      original: "汉谟拉比 1000 年延迟削弱'结构性前提'主张 (high)"
      revised: |
        已修正。提供了文字从会计工具→法律应用的演化路径：
        文字技术是必要条件但不是充分条件——还需要文字进化到
        完全语言表达、社会复杂度触及临界点、政治条件允许。
        三者共同触发法典化。1000 年延迟被重新解释为必要条件
        的逐渐成熟，而非削弱推论。
      status: resolved

    C3_norm_definition:
      original: "根本性概念模糊——什么算一条规范？(critical)"
      revised: |
        已修正。提供了完整的操作化方案：
        - 四条定义标准（可陈述性+规范结构+社会回应+跨情境适用）
        - 明确的计数规则（一般原则/细则/例外/重复）
        - 双编码者协议（Cohen's κ + 第三裁决者）
        - 诚实声明了局限性（显式/隐式的连续谱、民族志完整性差异）
      status: resolved

    C4_three_paths:
      original: "三种演化路径再次覆盖全部可能空间 (high)"
      revised: |
        已修正。增加了：
        - 每种路径的独立可检验标志
          （成文化: 物理文本+可查阅；分层化: >30%规范不重叠；
           专业化: 首选咨询角色+>30%排他性解释权）
        - 明确排除的结果：>5000人口头的民主可达性
      status: resolved

    C5_causal_direction:
      original: "因果方向不清晰——鸡生蛋还是蛋生鸡 (medium)"
      revised: |
        已修正。替换为双向因果说明：文字发明↔社会复杂化↔规范增长。
        核心主张聚焦于"口头规范存在复杂度上限"——
        不对因果方向做强主张。
      status: resolved

  new_challenges:

    - id: N1
      title: "300 条规范的阈值同样缺乏经验锚定引用"
      severity: medium
      detail: |
        证伪条件 (a) 使用的"300 条显式规范"阈值缺乏具体文献引用。
        修订版在 falsification_trace 中说"基于工作记忆和长期记忆
        研究的数量级推测"但没有像 DED-001 那样提供具体的实验引用。

        300 比 DED-001 的 r 值更脆弱——因为 r 值有经典实验的
        量化结果，而"人能记住多少条规范"几乎没有直接实验。
        记忆研究给出的是 chunks 或 items 的数量（如 7±2 工作记忆、
        长期记忆的编码-检索特性），但这些不能直接翻译为
        "规范条数"——因为规范的"颗粒度"是可变的。

        需要补充：认知心理学中关于"可回忆的独立命题数量"
        的研究——如果存在的话。如果不存在，应诚实标注
        "300 是数量级估计，未经直接实验验证"。
      status: acknowledged

    - id: N2
      title: "编码协议的跨文化可靠性未经检验"
      severity: medium
      detail: |
        规范计数的双编码者协议在理论上是完善的，但从未被实际应用。
        协议中一些区分（如"'不可偷窃'是一条 vs '偷羊赔两只'是细则"）
        在不同文化中可能有不同的自然分类——某种文化可能将
        "偷羊赔两只"视为一条独立规范而非"不可偷窃"的细则。

        这是一个"emic vs etic"问题：编码者（外来研究者）的分类
        可能与文化内部成员的分类不一致。而推论的核心概念
        （"成员能清晰陈述的规范"）恰恰依赖于成员的分类方式。

        协议需要在民族志现场检验——至少用一个已知案例
        （如冰岛自由邦的法律条文）进行编码试运行——
        才能证明其跨文化可靠性。
      status: acknowledged

    - id: N3
      title: "反例分析中缺少任何实际反例——可能反映真实的经验支持，也可能是搜索不足"
      severity: low
      detail: |
        修订版的反例部分包含两个案例（冰岛、凯尔特德鲁伊），
        两者都被判定为验证推论（专业化模式）。
        这是诚实的分析——但值得自问：
        是否存在被遗漏的、真正构成反例的口头社会？

        值得搜索的候选者：
        - 波利尼西亚的 kapu 体系（有专业化祭司但规范是否民主可达？）
        - 非洲口头王国的习惯法体系（如阿散蒂、祖鲁——判例法传统）
        - 澳洲原住民的习惯法（梦境叙事编码的规范体系）

        如果这些在深入分析后也都被判定为验证推论——
        那推论的置信度应提高。但当前版本尚未进行此搜索。
      status: suggested_followup

# === 作者反驳 ===

author:
  identity: "推论作者"
  date: 2026-07-13

  rebuttals:

    - target: N1
      response: "接受——300 条阈值需要经验引用或降级为数量级估计"
      detail: |
        挑战者的批评成立。与 DED-001 的 r 值不同，
        "人类能独立记住多少条显式规范"缺乏直接的实验研究。

        可用的间接证据：
        - 工作记忆：7±2 chunks (Miller 1956)，但这是短期/工作记忆
        - 长期记忆：容量极大但检索依赖线索和复习
        - 专业知识研究：象棋大师能记住约 50,000-100,000 个棋局模式
          (Chase & Simon 1973)——但这依赖于模式的 chunking

        问题在于"显式行为规范"与棋局模式或单词列表的结构不同——
        规范是命题性知识（"在情境 S 中应做 A"），其记忆特性
        与其他知识类型的可类比性不明确。

        接受修正：将 300 条从"基于认知科学的估计"改为
        "数量级估计——缺乏直接实验验证。
        核心主张（存在天花板）不依赖具体的 300 这个数字，
        而是天花板在两位数（口头）和四位数（文字）之间的
        数量级差异。"

    - target: N2
      response: "接受——需要试运行编码协议"
      detail: |
        emic/etic 问题是文化研究中经典且棘手的难题。
        接受需要在至少一个已知案例（冰岛自由邦或
        另一个有充分民族志记录的口头法律体系）上试运行
        编码协议，并报告 intercoder reliability。

        如果 κ < 0.6（中等一致性），则需要改进编码方案
        或承认规范计数的跨文化比较不确定度太大。
        如果 κ ≥ 0.7，协议可以被判定为"可操作的"。

    - target: N3
      response: "接受——额外搜索应作为后续工作"
      detail: |
        波利尼西亚 kapu、非洲口头王国、澳洲原住民习惯法
        都是合理的候选项。应在后续迭代中分析。
        当前版本至少包含两个边界案例（冰岛和德鲁伊），
        比第一轮（零反例讨论）有进步。
        接受 N3 作为应标注的"搜索不足"声明。

# === 裁决 ===

verdict: verified
verdict_rationale: |
  第一轮审查的五条挑战全部得到实质性处理：
  - C1 (critical): 冰岛重新分析为专业化验证——规范民主可达性的低
    恰好验证了天花板的核心主张
  - C2 (high): 汉谟拉比 1000 年延迟重新解释为必要条件的逐渐成熟
  - C3 (critical): 规范的操作化定义从零到完整方案——本轮审查中
    修订最彻底的部分
  - C4 (high): 三种适应现在有独立可检验标志 + 明确排除项
  - C5 (medium): 因果方向改为双向——更诚实的表述

  推论的核心洞察——口头规范存在认知天花板，天花板约束的是
  规范的民主可达性——是稳固且非显而易见的。

  新发现的三条挑战是改进建议而非推翻威胁：
  - N1 (medium): 300 条阈值需要经验引用或降级。接受为数量级估计。
  - N2 (medium): 编码协议需要在至少一个已知案例上试运行。
  - N3 (low): 额外反例搜索应作为后续。

  裁决：从 candidate 升级为 verified。

caveats:
  - "300 条规范阈值是数量级估计，缺乏直接实验验证。在获得跨文化规范计数的量化数据前，推论的数值预测应视为暂定的。"
  - "规范编码协议尚未在民族志材料上试运行。在报告 intercoder reliability ≥ 0.7 之前，协议的操作性应视为未经检验。"
  - "口头社会的反例搜索尚未穷尽。当前两个案例均被判定为验证——这不排除存在未被发现的反例。"

