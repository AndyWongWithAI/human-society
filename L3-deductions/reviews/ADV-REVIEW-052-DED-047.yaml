    此项已由 R1 识别,经过一整轮仍未处理,使三档分类在指标(iii)维度上持续不可操作;
    (2)新 required-①:Terra 锚点的叙事编码与 anti-talisman(1)存在紧张——Terra 按
    DED 自有标准可能为中/厚叙事,若属实则核心预测格缺少干净的薄叙事支撑案例,这是
    实证基础层面的结构性问题;(3)新 required-②:"三要素必要性"主张缺乏独立论证,
    三要素似从加密社区语境归纳但被推广为 SOV 信心的通用必要条件——此推广未经支撑。

