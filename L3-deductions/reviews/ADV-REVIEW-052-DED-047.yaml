    反例格(薄叙事,高SOV稳定)保持开放——这是可证伪性保障。不判。
    - 红旗3(测量轴正交): 未命中 required。自变量(文本内容分析)与被预测量(市场价格+
    链上数据)异源。指标(iii)的 temporal overlap 为 should 级(见 should-A),非恒等式焊死。不判 required。
    - 红旗4(射程排除钩子): 未命中。四项排除均以机制/时态边界事前定义,不依赖结果。不判。
    - 红旗5(分类档位): 未命中。三档(厚/中/薄)匹配门槛预测。极端组比较(falsifiability(b))
    与全样本偏相关(falsifiability(a))的裁决优先级已注册。不判。
    - 红旗6(anti-talisman 真兑现): 未命中 required。五禁令+对称禁令框架完整,且通过
    Terra 诚实重编码案例证明了禁令的实际可兑现性(推论宁可自我削弱也不护身符化)。不判。
