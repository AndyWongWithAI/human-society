  counterexample_hunt:
    strategy: |
      本轮猎捕在前两轮已覆盖 6 条路线(R1:USDT/比特币早期叙事/FRAX+LUSD;
      R2:Iron Finance+Titano/RAI Reflexer/Meme coins)的基础上,追加以下未探索方向。
      重点:USDT 在当前操作化下的反例地位(因制度信任厚度未预注册)、以及跨领域
      类比案例。

    route_1_usdt_pending_preregistration:
      description: |
        USDT(薄社群叙事+多次压力下SOV稳定)在前两轮已被识别。当前状态—
        制度信任厚度尚未正式预注册→USDT 在现有操作化(仅社群叙事厚度)下编码为
        "薄叙事+高SOV稳定"→按红旗11反向裁决规则暂视为未消化反例。
        这不是新猎捕——USDT 自 R1 就在案——但每轮状态变化:
        R1: consumed_via_refinement(事后口径调整)
        R2→R3: needs_preregistration(诚实承认但未完成预注册)
        关键判断:一旦制度信任厚度完整预注册,USDT 几乎肯定会被重新分类为
        "有制度信任→不在纯算法射程内"。真正的风险不是 USDT 推翻推论,
        而是预注册的持续延迟使推论的操作化处于 incomplete 状态→按评分卡
        规则,verified 的三个条件之一("无 required 级缺陷")不满足。
      verdict: unresolved_pending_preregistration
      note: "此状态自 R1 延续至 R3。修复路径明确且可操作——预注册制度信任厚度
      的完整测量协议。不是逻辑上不可救的塌方。"

    route_2_ethena_usde_synthetic_dollar:
      description: |
        Ethena(USDe)是2024年兴起的新型"合成美元"——通过现货+期货 delta-neutral
        对冲维持锚定,不完全依赖超额抵押也不完全依赖算法套利。USDe 自启动以来
        经历了2024-2025年多轮市场波动,维持了锚定和增长。
        按 DED-047 指标:
        - 指标(i):Ethena 有社区治理,但以技术讨论为主→可能不满足叙事基础设施
        - 指标(ii):社区讨论以 delta-neutral 机制/资金费率套利为主→叙事密度低
        - 指标(iii):尚无首次重大压力事件基线
        但 USDe 的 delta-neutral 机制提供了超越纯算法的"机制层信任"——持有者信任
        的不是社群叙事而是对冲机制的数学保证。这使 USDe 更接近"有机制信任"类别
        而非"纯算法+零信任基础设施"。
      verdict: not_a_clean_counterexample
      digestion: |
        USDe 和类似的合成美元协议展示了一个重要模式:新一代"算法"货币系统通过
        混合机制(超额抵押+对冲+保险基金)达成了超越纯算法的信任层次。
        这些系统不再满足 DED-047 定义的"纯算法系统"(社群叙事薄+制度信任薄两者
        均满足),因为它们具有机制层的信任替代——尽管不是社群叙事。这支持了推论
        的一个隐含命题:纯算法系统(真正两者均薄)在实践中的样本量可能非常小——
        因为市场在选择"有某种信任基础设施"的系统。这使 falsifiability 的实证
        测试窗口更窄,但不构成反例。

    route_3_cbdc_algorithmic_fiat:
      description: |
        央行数字货币(CBDC)是一个有趣的极限案例:法币的 SOV 由 BR-L2-010 的制度
        信任(央行/政府/法治)充分支撑,AI/算法在 CBDC 中纯粹是技术执行层——
        智能合约执行支付条件、动态利率调整、反洗钱筛查等。CBDC 中 AI 的角色
        精确对应本推论的"优化器"定位:算法优化支付效率和合规执行,但对 SOV 共识
        的贡献为零——SOV 完全来自国家和央行的事前制度信任。
        这本身支持推论——CBDC 是"优化器而非奠基者"在法币语境下的体现。
      verdict: supports_deduction
      digestion: |
        CBDC 验证了"优化器≠奠基者"这一二分在法币语境下同样成立——制度信任
        (BR-L2-010)而非算法提供了 SOV 的地基。但 CBDC 案例也提示:推论当前的
        "社群叙事厚度"操作化不足以覆盖所有 SOV 信任基础设施类型——制度信任
        (法币)、文化惯习(黄金)、社群叙事(比特币)是三条不同的路径,当前仅完整
        操作化了社群叙事一条。这是 should-4(制度信任厚度预注册)重要性的跨领域佐证。

    hunt_conclusion_r3: |
      综合 R1(3路线)+R2(3路线)+R3(3路线,含 USDT 状态更新)=共 9 条猎捕路线。
      无 scope 内的干净净杀反例被猎获。USDT 是最接近反例格的案例,但其反例地位
      依赖于操作化不完整(制度信任厚度未预注册),而非推论的机制主张被事实推翻。
      预注册完成后,USDT 几乎肯定被重新分类为"有制度信任→不在纯算法射程内"。

      三轮猎捕反复揭示同一深层模式:推论的实证测试窗口天然狭窄——需要找到同时满足
      "纯算法(社群叙事薄+制度信任薄)+有真实SOV功能(非纯投机)+经历重大压力事件"
      的系统。这类系统要么在获得SOV功能前就死了,要么在生死之间积累了某种信任
      基础设施(叙事或制度),要么根本不曾获得真正的SOV功能(只是投机工具)。
      这不是推论的缺陷——这是"纯算法SOV天花板"这一命题的固有特征:命题本身就预测
      此类系统很难存活到可被测试的状态。窗口狭窄正是预测的一部分,不是操作化的失败。

  non_recurrence:
    ded_004: |
      独立验证:未复发。前件(叙事厚度)由压力事件前基线独立测量——指标(i)(ii)
      在压力事件前60日采集,指标(iii)虽在压力期间测量但测量对象(通信内容类型)
      与被预测量(SOV稳定性:市场价格+链上数据)异源。anti-talisman(1)的双向禁令
      (禁止由SOV结果反推叙事厚度,无论方向)直接封堵了 DED-004 式的循环。
      Terra 诚实重编码——按自有指标独立编码后移出 supporting anchor,宁自我削弱
      也不护身符化——是本推论 anti-talisman 兑现的最强实证。
      未复发。

    ded_007: |
      独立验证:未复发。自变量(文本内容分析:社区通信编码)与被预测量(市场数据:
      价格/链上地址)使用完全不同的测量通道和原始数据源。不存在数学恒等式焊死。
      指标(iii)的 temporal overlap(见 should-A)在严重程度上远低于 DED-007——
      后者是同一数据源从不同角度测量(分母用"实际获授者"即结果本身),前者是
      不同数据源在时间上重叠。两者是"测量精度"vs"测量独立性"的层次差异。
      未复发。

  required_fixes:
    - |
      【required-1】完成制度信任厚度的正式预注册(红旗11,跨越R1→R2→R3)。
      按 BR-L2-010 框架(非人格化制度信任:储备金审计/法律实体/监管框架/法律追索权)
      编写完整测量协议,至少包括:
      (a) 3-4项独立测量指标——建议:是否存在注册法律实体(是/否)、是否有≥1家独立
      审计公司的公开储备证明且距今<12个月(是/否)、是否处于至少一个主要司法辖区的
      监管框架内(是/否,以持牌/注册/合规声明为准)、是否有正式的赎回/兑付保障机制
      (是/否,如 FDIC 保险/储备金赎回/法律追索权);
      (b) 每项指标的满足阈值——二分(是/否)指标自然带阈值,若有连续量指标需注册
      具体数值;
      (c) 三档分类规则:厚=≥3项满足,薄=≤1项满足,中=2项满足(或其他合理阈值,
      但需一次性注册);
      (d) 与社群叙事厚度的联合分类规则:明确"纯算法系统"的操作化判定流程——
      社群叙事薄(三项均不满足)AND 制度信任薄(≤1项满足)。
      (e) 预注册后,按完整双维度框架重新分类 USDT 及所有现有锚点/边界案例,
      诚实报告重新分类结果——无论支持或削弱推论。
      此项必须完成——推论已经过三轮审查,预注册缺口不应再延续至 R4。
    - |
      【should-A】在 operationalization 的社群叙事厚度 limitations 中补充标注:
      指标(iii)"叙事-退出联动"在首次危机系统(无前次危机基线)上存在 temporal
      overlap 风险——72h 测量窗口与 SOV 观测窗口在时间上重叠,此时指标(iii)的
      独立判别力低于指标(i)(ii)两个纯事前指标。建议在首次危机系统中对指标(iii)
      降权处理(如由等权降为半权),或标注为"exploratory"。
    - |
      【should-B】在 operationalization 的指标(iii) measurement 中补充标注:
      72h 窗口假设"瞬时冲击"型压力事件(市场闪崩/监管突袭/安全事件);对渐进式
      压力事件(如分阶段收紧的监管政策),注册替代测量协议——以"政策首次明确信号日"
      为 T0,窗口延长至"政策落地后7日"或"事件定性完成日"(取更早者),测量结果标注
