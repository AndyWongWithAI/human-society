        (a) 若 SOV 已剧烈崩溃→社区通信量骤降→某些平台<30条被排除→指标(iii)在
        极端薄叙事系统的部分平台上无法测量,可能拉高三档分类的不确定性;
        (b) 在首次危机系统(无前次基线)中,指标(iii)是唯一的"压力期间"叙事指标,
        此时 temporal overlap 无法通过基线测量缓解——indicator(i)和(ii)提供
        压力前基线,但首次危机系统只有(i)(ii)两个纯事前指标可用,(iii)的测量
        独立性在此场景下最弱。
        这不是 DED-007 级恒等式焊死(通信内容≠市场数据,测量原理不同),但属于
        同一家族的测量精度关切。当前 limitations("叙事作为事后归因陷阱")的自知
