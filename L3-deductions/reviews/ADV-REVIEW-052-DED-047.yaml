  counterexample_hunt:
    strategy: |
      本审查者独立猎捕三条新路线,补充 R1 未探索的方向。R1 猎了 USDT/比特币早期叙事
      积累/FRAX+LUSD——三条均未构成净杀。本轮在 R1 基础上追加以下猎捕。

    case_4_iron_finance_titano:
      description: |
        Iron Finance(部分抵押算法稳定币)和 Titano(算法 rebase 代币)是比 Terra 更边缘的
        算法货币实验。Iron Finance 在 2021 年 6 月经历了经典的"银行挤兑"式死亡螺旋——
        IRON 稳定币从~1 USD 归零,TITAN 代币从~60 USD 跌至~$0.0000001。Titano 的
        rebase 机制在 2022 年市场下跌中暴露了其庞氏本质,APY 从 ~100,000% 蒸发。

        按 DED-047 指标编码:
        - Iron Finance:社群叙事几乎为零——无意识形态宣言(白皮书专注于技术机制)、
        无定期社区仪式、无"Ironer"身份认同。社区讨论以 APY/ROI 计算为主,纯技术型。
        叙事厚度→薄。经历压力(2021年加密市场回调+Mark Cuban 的关联→恐慌)→SOV 归零。
        这是比 Terra 更干净的(薄叙事,低SOV稳定)案例。
        - Titano:同样无社群叙事,纯 rebase 数学机制。压力下 APY 机制崩坏→SOV 归零。
      verdict: supports_core_prediction
      digestion: |
        Iron Finance 和 Titano 提供了比 Terra 更干净的薄叙事+低SOV稳定案例——它们的
        社群叙事确实比 Terra 更薄(Terra 至少有 Do Kwon 个人崇拜和 LUNAtics 身份认同,
        Iron Finance 几乎没有任何社群叙事层)。但它们的"薄"也意味着它们更不像真正的
        "货币系统"——Iron Finance 存续不到6个月,Titano 存续约1年。它们更像是算法
        金融实验而非货币系统。DED-047 的射程是"货币系统",不是所有算法金融产品。
        因此这些案例对推论的支撑力度受限于:它们的 SOV 失败可能是因为它们根本不曾
        真正获得 SOV 功能(持有者从未视其为价值储藏,只视其为短期投机工具),而非因为
        它们有 SOV 但叙事太薄导致 SOV 在压力下崩溃。

        结论:这些案例为推论提供方向性支撑,但不能替代 Terra 成为核心预测格的主要锚点
        ——因为它们的"曾有SOV功能"这一前提本身存疑。Terra 的优势在于它确实在崩溃前
        被广泛视为 SOV 工具(UST 被用作储蓄/支付手段)——但 Terra 的叙事厚度编码问题
        (新 required-①)削弱了这一优势。

    case_5_rai_reflexer:
      description: |
        RAI(Reflexer)是纯算法稳定币(非抵押型,由 PID 控制器调节赎回率)。RAI 的设计
        哲学刻意避免"锚定 1 USD"——它不锚定任何法币,而是通过算法调节自身汇率。
        RAI 自 2021 年 2 月启动以来经历了多次市场压力(Terra 崩溃/FTX 崩溃/SVB 危机)
        且维持了相对稳定——其市场价格在压力期间有波动但从未归零或经历死亡螺旋。

        按 DED-047 指标:
        - 指标(i):Reflexer 有治理社区,但规模很小,无定期大会/meetup→可能不满足
        - 指标(ii):社区讨论以技术/机制为主(如何调节 PID 参数),叙事型通信比例低
        - 指标(iii):无前次危机基线
        叙事厚度→薄(至少非厚)。

        但 RAI 有独特的"非锚定"设计——它不声称自己是"稳定币"(不承诺锚定任何资产),
        所以"脱锚"概念对 RAI 不适用。这使 RAI 是否算"SOV 功能稳定"难以按 DED-047
        的 SOV 稳定性指标测量(指标以"对计价单位的偏离"定义)。
      verdict: boundary_case_not_testable
      digestion: |
        RAI 的案例揭示了 DED-047 操作化中一个更深的边界问题:推论的 SOV 稳定性测量
        假定了"锚定某个外部计价单位"的货币模型(脱锚深度/恢复至冲击前80%)。对于不锚定
        任何资产的浮动算法货币,如何判断其 SOV 稳定性? 若以"对 USD/BTC 的购买力波动"
        衡量,RAI 在压力下可能有显著波动——但这不代表 SOV 功能丧失(RAI 的持有者可能
        视其为长期价值储藏,接受短期波动)。RAI 提出了一个更难的问题:无锚定目标的货币
        系统,其 SOV 稳定性的操作化定义是什么? DED-047 当前的操作化对此类系统不适用。

        结论:RAI 不是反例(不对推论构成净杀),但揭示了 SOV 稳定性操作化在非锚定型
        货币上的盲区。此盲区限制了 falsifiability 条件的可测试范围——推论的可证伪性
        在逻辑上高但在特定货币系统类型上不可操作。

    case_6_meme_coins:
      description: |
        Dogecoin(DOGE)和 Shiba Inu(SHIB)等 meme 币构成了一个有趣的张力案例:
        - 社群叙事厚度极高:有强大的社区身份认同("Shib Army"/"Doge Army")、
        定期社区活动、共享 meme 叙事、意识形态("人民的加密货币""to the moon")
        - 但技术设计质量极低或无(SHIB 无原创技术,DOGE 是 Litecoin 的 fork)
        - SOV 稳定性? 经历了多次 80%+回撤但未归零,社群叙事在每次暴跌中表现活跃
        ("diamond hands""buy the dip"叙事)。DOGE 自 2013 年存续至今,经历多次
        90%+回撤后恢复。

        按 DED-047 预测:厚叙事→应在压力下 SOV 稳定。DOGE 确实多次在 80-90%回撤后
        恢复(未归零),社群叙事在每次下跌中活跃("meme 驱动持有")。这似乎是支持推论的
        案例。

        但 meme 币的"SOV"有一个特殊性质:持有者持有 DOGE/SHIB 不是因为相信它们是
        "稳定的价值储藏",而是因为相信"别人会在未来以更高价格购买"——这是投机信念而
        非 SOV 信心。BR-L2-022 区分了 SOV 信心(对长期购买力稳定性的预期)与投机信念
        (对短期价格波动的预期)。meme 币的叙事驱动的是投机信念而非 SOV 信心。
      verdict: supports_rhetoric_but_not_SOV_specificity
      digestion: |
        Meme 币展示了"叙事→持有行为→价格恢复"的机制——社群叙事确实能在压力下兜底
        持有行为,延缓或防止归零。但这支持的是更宽泛的"叙事→资产价格韧性"命题,而非
        本推论特异的"SOV 信心需要社群叙事"命题。DED-047 在 discriminant_validity(4)
        中与投机泡沫理论做了区分("SOV 稳定性不是价格稳定性"),但 meme 币的经验揭示了
        这个区分的实际操作难度:在何种波动程度上,持有行为反映的是 SOV 信心 vs 投机信念?
        DED-047 的操作化将"SOV 稳定性"定义为"脱锚的深度-速度-恢复时间三维合成"——
        按此定义,DOGE 从 90%回撤恢复可被视为"高 SOV 稳定性",但这可能混淆了 SOV 信心
        (我相信 DOGE 在未来保持购买力)与投机信念(我相信别人会以更高价买 DOGE)。

        结论:meme 币不是反例,但揭示了 SOV 稳定性操作化在区分"SOV 信心驱动的持有"与
        "投机信念驱动的持有"上的模糊性。此模糊性可能使推论的支持案例(比特币)和反例
        (可能的薄叙事+高投机信念系统)难以干净区分。

    hunt_conclusion_r2: |
      本轮追加猎捕三条路线:
      (1) Iron Finance/Titano:比 Terra 更干净的薄叙事+低SOV案例,但它们的"SOV 功能
      曾存在"的前提存疑(可能只是投机工具而非货币系统)。
      (2) RAI(Reflexer):薄叙事的纯算法系统,在多次压力下未崩溃。但 RAI 的非锚定设计
      使 DED-047 的 SOV 稳定性操作化不适用——无法测试。
      (3) Meme 币(DOGE/SHIB):厚叙事→压力下 SOV 恢复,表面支持推论,但驱动持有的是
      投机信念而非 SOV 信心→揭示了 SOV 稳定性操作化在区分这两种持有动机上的模糊性。

      综合 R1+R2 猎捕:无 scope 内的干净净杀反例。但猎捕过程反复揭示同一个深层问题:
      推论的实证测试窗口非常狭窄——需要找到同时满足"纯算法+薄叙事+无制度信任+
      有真实的SOV功能(非纯投机)+经历重大压力事件"的系统。这类系统要么已死(无法判断
      若存活会不会积累叙事),要么在生死之间积累了叙事(无法判断若无叙事是否依然会死),
      要么根本不曾获得真正的 SOV 功能(只是投机工具)。推论的可证伪性在逻辑上高,
      但可证伪机会在实践上稀缺——这是"尾部事件"命题的固有困难,非本推论独有。

