id: ADV-REVIEW-016
type: adversarial_review
reviews: DED-011
layer: L3-deductions

人话摘要: |
  对 DED-011(派系必然性 → 轮替/退出/申诉抑制固化-撕裂)的独立对抗审查记录。
  round-1 裁 needs_revision:核心活、显式吸收了 DED-004(不可证伪循环)/006(连续量别二分)/
  007(测量轴焊死)/008(species 按伞级判据穷尽)/009(阈值别用结果反定义)的死因;anti-talisman
  条款、正交测量轴、连续单调、诚实 primary_suspect 都在位。反例猎捕(威尼斯/佛罗伦萨/PRI/
  苏联政治局/教廷conclave/大人物政治/市场/UNSC-P5/协和式民主)未净到 scope 内活反例——统统
  落进轮替/退出/申诉/权力分享或出射程。但揭出【两条 required】:①turnaround_credibility 的
  measurement 把"是否发生过和平交权/成功退出/翻案先例"列为可信度指标——这是用【结果邻近侧】
  的量测自变量,与本档自己的 anti_talisman_clause 直接冲突,是 DED-007 焊点/DED-004 循环的
  活回声;②翻盘机制被写成【封闭三元】"轮替/退出/申诉之一",但反例猎捕净出【权力分享/保底否决
  (协和式民主/否决制)】这一给输家'不掀桌也有未来'却既非轮替也非退出也非申诉的第 4 类结构机制
  ——"唯一...之一"是 DED-008 式枚举不穷尽的过度伸张。另 3 条 should(②利益线需钉死材料口径、
  锚过读、①载重前置)。核心可靠定向修订救活 ⇒ needs_revision 而非 rejected。

target: DED-011
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文)。评分卡红旗 10 条逐项攻 + 反例猎捕(判
  verified 前必做,认真找历史/跨文化实例)+ DED-004(不可证伪循环)/DED-007(测量轴焊死)复发
  检查。verified 三条门(无 required / 亲自猎捕无活反例 / 未重蹈 004-007)与裁决三态照评分卡。

round_1:
  reviewer: "独立子 Agent (round 1, 全新独立上下文, 与作者及前几轮无关)"
  verdict: needs_revision
  verdict_note: |
    这是一条构造精良、明显站在 DED-004/006/007/008/009 五具尸体肩上的候选:它带了 anti-talisman
    硬约束、声称三轴异源正交、连续量不二分、单调可逆、诚实点名 primary_suspect(聚合是否只是
    BR-L2-006 复述)并把载重退守到①轮替→流动性的可逆单调 + ②派系断层沿利益线可事前测,还专门
    与麦迪逊《联邦党人第10》和 DED-003 做了判别。核心【活着】:①②确在 BR-L2-005/006 原文之外,
    非砖复述。我亲自做的反例猎捕(下)【净杀=无】——所有流动案例都挂着某个机制(轮替/退出/申诉
    /权力分享),所有无机制案例都退化成僵局/清洗/分裂(=支持),或出射程。
    但有【两条 required 硬伤】,恰不完全落在文件自认的 primary_suspect 上、它没关死:
    (R1) turnaround_credibility.measurement(line 79)把"是否发生过【和平交权/成功退出/翻案先例】"
      列作可信度指标。"和平交权"与被预测量"输家不掀桌/不清洗"几乎同轴——这是用【结果邻近侧】
      的量测自变量,和本档自己 anti_talisman_clause(line 183-190,明文禁"无清洗→有翻盘")【自相
      矛盾】。这是 DED-007 焊点 + DED-004 循环的活回声,必须把可信度测量收回【纯事前结构事实 +
      非结果侧的程序事实】。
    (R2) 翻盘机制写成【封闭三元】(statement line 27"轮替/退出/申诉之一";operationalization
      line 71-75"三条实现,满足其一即在场")。但我的反例猎捕净出第 4 类:【权力分享/保底否决】
      (协和式民主 grand coalition + mutual veto + 分权自治;UNSC-P5 否决制)——它给输家"不掀桌
      也有未来(不会被抹掉)"却既非轮替(无换届)也非退出(不离场)也非申诉(无上级翻案)。伞级
      catch-all"给输家一条不掀桌也有未来的路"本可容纳它,但封闭"之一/三条"措辞使其成为 DED-008
      式枚举不穷尽的过度伸张,必须把三者改成【非穷尽的着法实例】并显式补入权力分享。
    两条都是可靠定向修订(收窄测量口径 + 重标枚举为开放 catch-all),非推倒重来;核心结构与
    载重①②不塌 ⇒ needs_revision 而非 rejected。较 DED-009 r1(无活反例、唯一驱动是循环阈值
    required)标准一致:本轮亦无活反例,驱动是上述两条 required + 反例猎捕揭出的过度伸张,非放水
    也非过杀。
  red_flag_findings:
    brick_conclusion: |
      部分命中(should,非致命)。"派系必然/不可消除"这一层是麦迪逊/BR-L2-006 已有的常识,文件
      自认非卖点(line 208/285)。真正砖外载重=①轮替→流动性可逆单调 + ②断层 track 利益线可事前
      测,BR-L2-006 只给"偏袒自己人(任意标签亦然)"、BR-L2-005 只给团内互惠,二砖【都不】给这两条
      ⇒ 非平凡内核不在单砖原文,不判 required。但①的实质新意较宣称薄:"输家预期能翻盘就'等下轮'
      不掀桌"≈政治学 Przeworski"民主=制度化的不确定性/输家同意(loser's consent)",宜在 discriminant
      承认与既有政治理论(非仅麦迪逊)的重叠(记 should)。砖是否为本推论窄化:BR-L2-006/005 是通用
      承重砖,非为 DED-011 定制,过关。
    nontriviality_cell_check: |
      攻不穿【但系于 R1】。核心空格"稀缺封闭分配 × 沿利益线对立 × 无翻盘 × 长期不固化(边界始终
      流动消融)"预测为空。是否同义反复?——只要"翻盘机制在场"由【结构事实】测(非用结局反推),
      空格就是真经验主张:可被"三条翻盘路俱无却长期流动"填上。故非同义反复、可满足。但通过性
      【依赖 R1 修好】:若可信度靠"和平交权/无清洗"测(R1 的漏),则"无翻盘×流动"按构造近乎自排,
      空格退化为不可证伪(DED-004 病)。另:被预测的坏结局是【三选一 disjunction(僵局/清洗/分裂)】,
      靶面很宽、唯一证伪态(永久流动且三条机制俱无)窄且难观测,有轻度非对称"正面难错";
      anti-talisman + 结构测使其原则上仍可错,记 should(把 sharp 载重明确压在①单调,而非宽 disjunction)。
    measurement_orthogonality: |
      主干正交,但【中度焊点=R1】。三轴设计异源:A 稀缺(预算/席位/供需比<1,资源结构测)、
      B 翻盘可信度(成文换届/退出条款/申诉机构)、被预测 faction_dynamics(投票/结盟聚类/跨时段
      追踪/史料结局)。若 B 严格限于成文规则,则与被预测量正交。但 measurement line 79 把 B 的
      "可信度"用"【是否发生过和平交权/成功退出/翻案先例】"测——"和平交权"与被预测量"输家不掀桌
      /不清洗"几乎同轴,这是自变量偷用结果邻近侧量测(类比 DED-008 r1"分母偷用实际获授者"、
      DED-009 r1"阈值偷用绑定成败")。且它与本档 anti_talisman_clause 明文冲突。⇒ R1 required:
      可信度收回纯事前结构 + 非结果侧程序事实(如"换届规则在【常规、非危机】继任中被援引执行过"
      这一程序事实,与"组织是否避免了清洗/分裂"这一结局侧明确切开)。
    scope_hook_independent_of_result: |
      基本不命中,但【有一处半开脱风险】。excluded_outcomes 三条按事前渠道划:非稀缺分配之争
      (按'是否牵涉持久稀缺资源分配'事前测)、一次性组织(按'是否持久分配'事前测)、明面派系机构
      (按'明示原则'事前测)——都非按结果开脱,学到 DED-005 教训。风险:排除项①"纯观念/审美/技术
      路线之争"与载重②"断层 track 利益线"叠加,可能给"派系沿意识形态/身份而非材料利益聚合"的
      反例一条双向逃逸(要么开脱为'纯观念出射程'、要么把意识形态收编进'利益线')。需一条干净事前
      判据把"利益线"钉在材料诉求、与"纯观念"排除项互斥(记 should,与②同源)。
    criterion_tier_match: |
      不命中(学到 DED-006 教训)。稀缺(供需比)、翻盘可信度、固化/流动均声明为连续量;(iii) 明列
      单调("固化-撕裂随稀缺封闭度÷翻盘可信度单调上升");混合态按合力强度计、不二分。结局"僵局
      /清洗/分裂"是三值离散但那是【结局类型】非把连续量硬切档,合法。档位匹配过关。
    anti_talisman_cashed: |
      部分兑现,但被 R1 拖累。②的兑现【真】:利益归属(选区/持股/产业/部门)可在观察结盟【之前】
      独立编码,再验断层是否与之共线——这是一个真的独立驱动量量测(优于'嘴上说')。①的兑现【被
      R1 污染】:承重独立测本应是"成文换届/退出/申诉规则"(事前结构),但 measurement 与 supporting
      锚(line 218/219"定期选举、和平交权先例")都把"和平交权先例"当独立测——这恰是结果邻近侧。
      anti_talisman_clause 文本写得对(双向禁反推),但 measurement/锚的操作与之打架 ⇒ 需按 R1 统一
      到纯结构 + 非结局程序事实。
    anchor_fact_check: |
      无 DED-007 式致命事实错,但【一处过读=should】。竞争性选举→派系流动、封闭精英集团→清洗、
      合伙退出权→抑制僵局:方向性史实无误,confidence 已诚实降级(moderate / weak-moderate)。
      过读在②锚(line 238-243):"立法/董事表决...派系边界与利益线【高度重合】"——政治学对唱名
      投票的经典发现(Poole-Rosenthal 低维/党派-意识形态主导)显示投票很大程度沿一条不能【干净
      还原为选区材料利益】的党派/意识形态维,"高度重合"偏乐观。宜降 confidence 并注明"利益线与
      意识形态/党派维的分离本身是争议、需控制混淆"(记 should)。reversibility_anchor(引入/取消
      轮替→流动反转)honest_note 已承认多因交织,诚实。
    definition_vs_prediction: |
      部分命中(与 nontriviality 同源)。推链步 1(必有立场)、步 2(立场对立)文件【自认近定义/
      近公理】(line 110/114),诚实。核心"固化-撕裂 ⟺ 封闭稀缺 × 翻盘缺失"有【近解析臂】(缺此→
      败方无未来→只剩掀桌/卡死/被先下手,近乎从'理性输家'演绎)+【经验臂】(①单调可逆、②断层
      track 利益线)。经验臂是真预测,故非纯定义。宜把 sharp 可证伪内容显式钉在经验臂①②,别让
      近解析臂被读作主证伪内容(作者 line 287 已把载重压在①,基本到位,记 should 强化)。
    enumeration_and_species: |
      【命中=R2 required】。翻盘机制声称可枚举为三:轮替/退出/申诉,伞级判据="给输家一条不掀桌
      也有未来的路"。按 DED-008 标准审:三者是否按【伞级判据本身】穷尽?——【否】。我主动猎第 4 类:
      【权力分享/保底否决(consociational power-sharing / mutual veto / grand coalition / 分权自治)】。
      协和式民主(Lijphart:荷兰柱化、比利时、瑞士魔法公式、黎巴嫩、战后奥地利)与 UNSC-P5 否决制,
      靠"大联合共治 + 相互否决 + 比例分配 + 板块自治"让输家【不会被抹掉、恒有一份/一票】——这给了
      "不掀桌也有未来",却:非轮替(共时分权、无换届),非退出(不离场),非申诉(无上级翻案渠道)。
      它是独立第 4 类结构机制。伞级 catch-all 本可容纳,但 statement line 27"轮替/退出/申诉【之一】"
      与 line 71"三条实现"是【封闭枚举】,构成 DED-008 式不穷尽的过度伸张。⇒ R2:把三者重标为
      伞级 catch-all 下【非穷尽的着法实例】,显式补入"保底/权力分享(mutual veto / 比例共治 / 板块
      自治)",并注意其常导致【僵局】(=已列坏结局之一,黎巴嫩/冷战 UNSC 瘫痪),即它抑制清洗/分裂
      却可能付出僵局代价——这反而是对'翻盘机制维度'的丰富,不是净反例。
    primary_suspect_aim: |
      指对但欠关死。文件自认最弱腿=聚合(②)是否只是 BR-L2-006 复述,并诚实退守到①独立可检——
      方向对(①确独立于聚合机制)。但它【没认到】两条我判为 required 的更致命软肋:(R1)可信度
      测量的结果侧焊点、(R2)三元枚举不穷尽。secondary_suspect(可信度须结构测、沿利益线须独立
      聚类)方向对,却同样漏了 line 79"和平交权先例"这一自我拆台的操作。故 primary_suspect 准、
      但存在它没认的更致命软肋 ⇒ 正是 needs_revision 形态而非 verified。
  counterexample_hunt: |
    我亲自猎捕,目标填最强空格:成员经【结构】确证在持久稀缺封闭分配下沿利益线对立、【轮替/退出
    /申诉俱无】,却长期【既不固化也不僵局/清洗/分裂,边界始终流动消融】。认真找历史/跨文化实例:
    - 威尼斯共和国(Serrata 后封闭贵族,官职稀缺,生而为贵族无退出):却有极密的【抽签+短任期
      +官职轮值】=轮替在场 ⇒ 数百年异常稳定,强支持轮替→流动,非反例。
    - 文艺复兴佛罗伦萨(Guelph/Ghibelline、黑白党):无制度化轮替/安全退出/独立申诉 ⇒ 系统性
      放逐/清洗/分裂,正是"无翻盘→坏结局",消化为支持。
    - 墨西哥 PRI(1929-2000,71 年一党独大、官职稀缺):表面'无轮替'反例,但内建【六年任期
      +不得连任 sexenio + 派阀轮流坐庄】=党内轮替在场 ⇒ 派阀流动、少清洗、长期稳定。boundary_cases
      已预判此类,消化为支持(轮替在场)。
    - 苏联政治局(封闭权力核心,无轮替[终身/至死]、无安全退出[离场=清洗/古拉格]、无申诉):
      派系→大清洗/贝利亚被处决/赫鲁晓夫被废黜,系统性清洗,强支持"无翻盘→清洗"。
    - 天主教教廷/枢机 conclave:教皇终身(在世无轮替),但每次教皇身故触发新选举=【经继承周期的
      轮替】,一届输家可赢下届 ⇒ 枢机派系不互相肉体清洗;而宗教改革=输家(路德)无翻盘无申诉被
      绝罚→【分裂】(新教)。两头都支持:周期轮替维系 + 无翻盘者出走=分裂。消化为支持。
    - 新几内亚高地"大人物"政治 / 军阀均势 / 市场中的企业联盟:联盟不断重组看似'无机制却流动',
      但其流动靠【退出】(追随者可改投他人/企业可离场自立)=退出在场 ⇒ 消化为支持(退出→流动)。
    - UNSC-P5(常任席无轮替、无退出、无上级申诉,全球影响力/否决稀缺):议题联盟确在 P5 间流动
      重组(看似'无机制却流动')——但真正抑制'相互抹掉'的是【否决权=保底不被强压】,且冷战 UNSC
      长期【瘫痪=僵局】(已列坏结局)。⇒ 不是净反例,而是揭出第 4 类机制(R2)且付僵局代价。
    - 协和式民主(黎巴嫩/比利时/战后奥地利/瑞士):靠【权力分享/相互否决/板块自治】抑制分裂——
      同样落 R2 第 4 类;黎巴嫩长期【僵局/周期性内爆】、瑞士另有魔法公式轮值(轮替)。⇒ 揭出第 4 类
      + 部分支持,非净反例。
    结论:【净杀=无】。所有干净候选或落轮替(威尼斯/PRI/教廷)、或落退出(大人物/市场/军阀)、
    或落申诉、或落【权力分享/保底否决】(UNSC/协和式)、或退化为清洗/分裂/僵局(佛罗伦萨/苏联/
    黎巴嫩)=支持,或出射程。falsifiability(a) 核心未被净证伪。但反例猎捕【揭出过度伸张】(评分卡
    第三种结果):权力分享/保底否决是独立于轮替/退出/申诉的第 4 类结构机制 ⇒ 定位到 statement/
    operationalization 的封闭三元枚举,列为 R2。verified 硬门第 2 条(亲自猎捕、无 scope 内活反例)
    本身通过——needs_revision 的驱动是 R1(可证伪性焊点)+ R2(枚举过度伸张),不是猎到了活反例。
  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【有活回声=R1】。anti_talisman_clause 文本方向对(双向禁用结局反推
    翻盘机制),但 measurement line 79 与 supporting 锚 line 218/219 把"和平交权/成功退出/翻案
    先例"当可信度独立测——与被预测量同轴的结果侧代理,给核心空格留了"按构造近乎自排=不可证伪"
    的读法。不是全面复发(②的独立事前聚类、经验臂①单调仍独立可错),但必须关死的一丝循环。
    DED-007(焊死测量轴):主干未复发。三轴设计异源正交、锚无致命事实反转、连续单调对齐、②断层
    由事前利益编码独立测。残留【中度焊点】=R1 的可信度结果侧代理(轻于 DED-007 全面焊死,收窄
    测量口径即除),与 DED-008 r1 的分母焊点、DED-009 r1 的阈值焊点同级。
  verified_gate:
    no_required_defect: "未过。R1(可信度结果侧焊点/自我拆台)+ R2(三元枚举不穷尽,漏权力分享/保底否决)两条 required。"
    personal_counterexample_hunt_no_live: "过。全新候选池亲自猎捕,净杀=无;数条退化为支持,两条(UNSC/协和式)揭出 R2 第 4 类机制。"
    no_ded004_007_recurrence: "未过(部分)。DED-004 有活回声(R1);DED-007 主干未复发但残留 R1 中度焊点。"
  required_fixes:
    - |
      [required R1] 去结果侧焊点:turnaround_credibility.measurement(line 79)与 supporting 锚
      (line 218/219)删去/重构"是否发生过【和平交权/成功退出/翻案先例】"作为可信度指标——它与
      被预测量"输家不掀桌/不清洗"同轴,是自变量偷用结果侧代理,且与本档 anti_talisman_clause
      自相矛盾。可信度改由【纯事前结构事实 + 非结局侧程序事实】测(如"换届/轮值规则在【常规、
      非危机】继任中被援引执行过"这一程序事实,与"组织是否避免了清洗/分裂"这一结局侧明确切开)。
      使核心空格是真经验主张、falsifiability(a) 无"按构造自排"的不可证伪读法。
    - |
      [required R2] 去枚举过度伸张:statement(line 27"轮替/退出/申诉【之一】")与 operationalization
      turnaround_credibility(line 71-75"三条实现,满足其一即在场")把翻盘机制写成【封闭三元】,
      但反例猎捕净出第 4 类【权力分享/保底否决(mutual veto / grand coalition / 比例共治 / 板块
      自治;协和式民主、UNSC 否决制)】——给输家'不掀桌也有未来'却非轮替/退出/申诉。把三者重标为
      伞级 catch-all"给输家一条不掀桌也有未来的路"下的【非穷尽着法实例】,显式补入权力分享/保底,
      并注明其常以【僵局】(已列坏结局之一)为代价抑制清洗/分裂,故是对翻盘维度的丰富、非净反例。
    - |
      [should] 钉死②"利益线"口径:把"沿共同利益线聚合"的利益线明确限于【可事前独立编码的材料
      诉求(选区/持股/产业/部门)】,与排除项①"纯观念/审美"互斥、且与身份/意识形态/纯人格恩怨
      分开。否则②双向失守:被'派系沿身份/意识形态聚合'的实例证伪,或把意识形态收编进'利益线'
      稀释成 BR-L2-006(任意标签)的复述、丧失非平凡性。给一条把 identity/ideology 与 material
      interest 分离的事前判据(并承认二者共线时需注明混淆)。
    - |
      [should] 收紧②锚过读:立法/董事表决"派系边界与利益线【高度重合】"(line 238-243)偏乐观——
      Poole-Rosenthal 等显示唱名投票低维、党派/意识形态主导,一条不能干净还原为选区材料利益的
      维承载大量方差。降 confidence,注明"利益线 vs 意识形态/党派维的分离本身争议、需控制混淆"。
    - |
      [should] 前置载重 + 补判别:把 sharp 可证伪内容显式钉在经验臂①(轮替→流动性单调可逆)、
      ②(断层沿利益线事前可测),别让近解析臂"缺翻盘→掀桌/僵局/清洗"被读作主证伪内容;并在
      discriminant 承认①与既有政治理论(Przeworski"制度化的不确定性/输家同意")重叠,判别新意
      主要在'连续单调 + 可逆'的定量形态与②的事前可测,而非'输家等下轮'这一定性直觉本身。

