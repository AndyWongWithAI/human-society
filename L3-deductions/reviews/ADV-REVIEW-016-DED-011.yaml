    anchor_fact_check: |
      无 DED-007 式致命事实错(承 round-1/2)。五锚方向性史实无误:竞争性选举→流动(置信 moderate-
      strong)、封闭精英→清洗(置信 moderate,注多因交织)、合伙退出→抑僵局(置信 moderate)、权力
      分享/否决→抑清洗分裂付僵局(置信 moderate,注非单调权衡)、利益线立法投票→部分重合(置信
      weak-moderate,Poole-Rosenthal 意识形态主导维已诚实注明)。reversibility_anchor 注多因交织
      (置信 weak-moderate)。无锚过度伸张为'高度重合'——②锚已降为'部分重合'。权力分享锚 honest_
      note 现已与全文限定一致(不再自相矛盾)。通过。
    definition_vs_prediction: |
      部分命中(非致命,承 round-1/2)。推链步1(必有立场)/步2(立场对立)自认近定义/近公理,诚实。
      核心有近解析臂(缺翻盘→败方无未来→掀桌/卡死/被先下手,近乎从理性输家演绎)+经验臂(①轮替
      /退出→流动性定量单调-可逆、②断层 track 材料利益线可事前测)。sharp 可证伪内容已显式钉在
      经验臂①②(按 round-1 should 收),discriminant 承认近解析臂不作主证伪内容。经验臂是真预测,
      故非纯定义。通过。
    enumeration_and_species: |
      R2 封闭三元已改伞级 catch-all(非穷尽),过关。我主动猎第 N+1 类(避开 round-2 已猎的 side-
      payment):【非正式轮流坐庄/隐性轮替(informal rotation norms)】——如某些传统社会中的年龄组
      (age-set)轮流掌权(东非 Maasai/Oromo 的 Gadaa 系统:每 8 年一换,制度化轮替在场→流动);
      又【共识决/全体一致规则(consensus rule)】——如 Iroquois 大和平法则(Great Law of Peace)
      要求重大决策须六族一致,任何一族可阻却→类权力分享否决,产僵局风险但防清洗。两类均被伞级
      catch-all 消化(Gadaa=轮替子类、一致决=权力分享子类),非净反例。伞级判据本身按'给输家不
      掀桌也有未来'定义,所列着法是按此判据归类的实例——不是按关联但不全等的表征归类。通过。
    primary_suspect_aim: |
      指对且当前状态已关死。primary_suspect 已按 round-2 should 前移至'跨着法标量聚合是否成立/
      ①单调是否仅限轮替-退出类'(R6 靶心),次弱腿为'聚合是否只是 BR-L2-006 复述'。当前修订后,
      primary_suspect 所指的 R6 已在 statement/核心/prediction(iii)/驱动量/derivation 多层面
      拆解消解——单调限定于轮替/退出类、驱动力分层、权力分享/保底/补偿类贡献防清洗分裂但产固化
      僵局不产流动。无更致命软肋被遗漏。平凡化检查:非平凡内容已显式钉在①②的经验臂,而非'派系
      难免'或'输家等下轮'等已被吸收的常识/既有理论。通过。
  counterexample_hunt: |
    我亲自猎捕,全新候选池(避开 round-1 已覆盖的威尼斯/佛罗伦萨/PRI/苏联政治局/教廷conclave/
    大人物政治/UNSC-P5/协和式民主,以及 round-2 已覆盖的波黑/黎巴嫩/德川幕府/学院派系/北朝鲜/
    后邓中国/中世纪冰岛)。双目标攻击:(甲)填核心空格(a)=持久稀缺封闭 × 沿材料利益线对立 × 伞级
    判据下所有翻盘路俱无 × 长期既不固化也不僵局/清洗/分裂;(乙)攻 prediction(c)=派系边界系统性
    不沿材料利益线聚合、与利益结构无事前关联(且组织有持久稀缺分配)。

    新选案例:
    - 拜占庭宫廷派系(Blues/Greens 战车党→宫廷文官/军人/宦官/教会派系):稀缺权力+头衔+俸禄。
      无制度化轮替(皇帝终身)、无安全退出(失势=剃度/失明/处决)、无独立申诉、无保底否决。派系沿
      宫廷资源线(官职/税收包收权/皇帝恩宠)聚合→系统性清洗/失明/流放。Comneni 朝尝试用联姻
      (外戚)建权力分享→产固化板块但相对减少清洗。⇒ 支持:'无机制→清洗'+'权力分享→固化但少清洗'。
    - 迦太基元老院/Barca 家族:稀缺商业-军事权力分配。Suffetes(双行政官)一年一任=轮替在场;
      元老院派系沿商业利益(农业地主 vs 海外贸易商)聚合且边界流动。当 Barca 家族在西班牙建独立
      权力基地后=退出/分立在场→派系进一步分化但仍未全面内战(直至罗马介入)。⇒ 支持:轮替+退出→流动。
    - 波兰-立陶宛联邦 liberum veto(单一否决权):极端权力分享(任何一议员可否决整个议会)→常年
      僵局(议会瘫痪)、派系沿大地主( magnate)利益线固化。最终被瓜分=分裂。⇒ 支持:权力分享→
      固化+僵局→分裂(机制在场但仍走向坏结局,因 veto 过度=僵局先致命)。
    - 萨法维波斯 Qizilbash 部落联盟→ghulam(奴隶军)转型:早期部落分权(权力分享/板块自治)→
      派系固化沿部落线;阿拔斯一世引入 ghulam 军队(抽掉部落保底)→清洗 Qizilbash、权力集中。
      两阶段:先权力分享→固化,后抽掉→清洗。⇒ 支持可逆方向。
    - 中世纪汉萨同盟:稀缺贸易特权分配。成员城市间有退出权(离盟)+定期 Hansetag 议事(某种
      轮替/共识)。城市派系沿贸易路线利益重组,不锁死。⇒ 支持:轮替/退出→流动。
    - 明治维新前的幕藩体制(补充德川):谱代/外样板块固化(权力分享/保底自治),最终外样(萨长土肥)
      因无翻盘路径(幕府不给轮替/参政)而掀桌=倒幕。⇒ 支持:保底型固化+输家最终掀桌。
    - 美国国会两党极化(1990s→今):稀缺立法控制权+拨款。轮替(中期选举/换届)在场→政党控制权
      可翻盘;但初选制度+意识形态媒体生态使跨党重组趋近零(边界在美国选民中仍有流动,但国会精英
      层固化上升)。此案的'固化'不完全来自轮替缺位——轮替在场却固化上升,对 (iii) 单调构成温和
      挑战。但:(a)美国国会非'封闭分配'——外部利益集团资金持续注入,非严格零和封闭;(b)固化上升
      可用初选制度堵死党内挑战者(=党内轮替缺位)、媒体意识形态生态(=BR-L2-006 任意标签效应放大)
      解释,不是纯'有轮替→不固化'的反例。⇏ 净反例,但揭示了'轮替在场却固化上升'需额外变量
      (党内轮替的次级缺位、媒体加速的任意标签偏袒),记作学术讨论、非 required。
    - 缅甸军方(1962→今):稀缺权力+经济利益(军方企业)。无轮替(自我延续)、无安全退出(异议=
      监禁)、无申诉。→系统性清洗(1988/2021)、僵局(军方 vs 民选政府拉锯)、可能走向分裂(民族
      武装割据)。⇒ 支持'无机制→清洗/僵局/分裂'。
    - 南非 ANC 党内派系(后种族隔离时期):稀缺党内职位+政府任命。ANC 有五年党主席选举=轮替
      在场。派系沿利益线(矿业/金融/政府合同)聚合,但核心边界随领导选举周期流动(祖马→拉马福萨
      轮替,败方未清洗)。⇒ 支持:轮替在场→避免清洗、派系可重组。

    结论:核心空格(a)【净杀=无】——所有干净候选或落某种翻盘机制在场(迦太基/汉萨/ANC→支持
    机制在场侧),或退化为清洗/僵局/分裂(拜占庭/波兰-立陶宛/缅甸→支持机制缺失侧),或出射程。
    prediction(c) 亦无净杀——美国国会案揭示'轮替在场却固化上升'需额外变量(frame 为学术讨论,
    非净反例,因其分配非严格封闭、且可用党内轮替次级缺位解释)。falsifiability(a)/(c) 均未被净
    证伪。verified 硬门第 2 条(亲自猎捕、无 scope 内活反例)通过。
  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发】。R1 修后可信度完全不依赖结局邻近侧代理('和平交权'等),
    核心空格可由独立结构事实(无成文换届/退出/申诉/保底条款)判定'turnaround 俱无',不需观察
    结局。anti-talisman 明文四向禁反推(有清洗≠无翻盘、无清洗≠有翻盘、不因结果塞隐性翻盘、
    不因结果反推派系固化)。经验臂①②独立可错。全文无不可证伪循环读法。
    DED-007(焊死测量轴):【未复发,主干干净】。三轴异源正交(资源结构→稀缺、制度结构+程序事实
    →翻盘可信度、投票聚类+跨时追踪+史料→派系动态)。R1 中度焊点已除;R6 聚合谬误已拆为分轴
    分层;第 4 类专属隐焊(否决被援引≈僵局)已补防隐焊段、给出分轴测法。残余仅为 academic
    measurement challenge(分轴测需更细的史料/程序记录),非 DED-007 式全面焊死。通过。
