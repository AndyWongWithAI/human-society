    counterexample_hunt: |
      【四路猎杀，均未获scope内净杀反例；两路揭示推论的适用区间边界条件（should级）】

      === 猎路1：俄罗斯2022年加息周期——封闭生态+高数字渗透+激进紧缩 ===

      【靶心】俄乌战争后CBR于2022年2月将关键利率从9.5%紧急升至20%，通胀从Q1
      约9%升至Q2峰值约17%后回落。信息生态在2022年急剧封闭（独立媒体大量关闭、
      Meta旗下平台被定性为"极端组织"被封）。表面逻辑：封闭生态+数字渗透极高+
      激进紧缩→通胀回落——似乎挑战"封闭生态中数字放大滞后"的预测。

      【消化】致命混淆：(i)资本管制+强制结汇80%+跨境资本流动限制→预期形成机制
      被金融压抑而非信息生态主导；(ii)利率20%远超正常货币政策范围，信号强度可能
      压倒任何信息生态调节效应；(iii)战争经济+制裁驱动的经济收缩独立压低通胀。
      此案落在适用区间边界上——极端政策工具使信息生态调节机制难以被单独识别。
      → 未净杀。暴露了"正常货币政策周期"的边界模糊性（多高算"正常"？）。

      === 猎路2：伊朗2018-2024——封闭生态+高数字+持续贬值的"预期即行动"模式 ===

      【靶心】伊朗信息生态封闭（国家控制媒体+互联网严格审查），但VPN使用普遍，
      Telegram/Instagram活跃。公众通胀预期与平行市场汇率高度同步实时调整——预期
      没有以"滞后"形式存在，而是以"实时追踪黑市汇率→立即兑换美元/黄金"的形式。
      这似乎与"封闭生态中数字放大滞后/预期调整慢"相反——调整极快而非极慢。

      【消化】(i)伊朗无独立货币政策框架→适用区间外；(ii)"调整极快"是以"放弃
      本币"的形式——这正是BR-L2-024记忆滞后的极端表现（对法币的系统性不信任
      而非预期锚定回归）；(iii)推论的"调整速度"概念以回归通胀目标为基准，在
      无通胀目标/法币被系统性抛弃的场景中概念失效。
      → 未净杀。暴露了"调整速度"概念和"记忆滞后"概念在极端场景中的语义漂移。

      === 猎路3：越南2011年紧缩周期——混合/偏封闭生态+低数字渗透率 ===

      【靶心】越南信息生态≈2-3，2011年数字渗透率仅30-35%（快速上升期）。通胀峰值
      ~23%，SBV年内多次加息（9%→15%）+信贷限额。通胀于2012年中降至约5%。

      【消化】(i)越南2011年数字渗透率仍低（30-35%）→负向渠道C/D（恐慌检索/
      算法推送/信息茧房）的受众基数不足以产生可观测的系统效应；(ii)SBV使用信贷
      限额等数量型工具（非纯价格信号），混淆了信息渠道与信贷渠道；(iii)全球大宗
      商品价格（粮食/能源）2011-2012年回落独立压低通胀。综合：数字渗透率远低于
      推论机制运行所需的阈值+混淆因素多。
      → 未净杀。暴露了数字渗透率的阈值效应未被操作化捕捉——推论未定义"多高的
      数字渗透率才足以激活负向渠道"。

      === 猎路4：中国2007-2008/2010-2011加息周期——封闭/混合生态+数字渗透上升期 ===

      【靶心】中国2007年CPI峰值~8%，央行6次加息+10次提准。2010-2011年CPI峰值~6%，
      5次加息+12次提准。通胀在紧缩后均回落。

      【消化】(i)中国无正式通胀目标制→适用区间外；(ii)通胀峰值~6-8%是否足以
      形成"高通胀记忆"存疑——推论讨论的记忆滞后以两位数甚至更高通胀为典型场景
      （魏玛1923/津巴布韦2008/土耳其60%+）；(iii)2007-2011年社交媒体算法推荐
      生态远未成熟（微信2011年才推出，今日头条2012年上线）→负向渠道D（算法
      选择性推送恐慌叙事）的前提不充分。综合：不满足适用区间的多项条件。
      → 未净杀。暴露了"数字渗透率"的内部异质性——同是高互联网普及率，2011年
      和2024年的算法推送和信息茧房生态有质的差异。当前操作化用互联网普及率×
      社交媒体活跃度几何平均，可能无法区分"有网但无算法推送"vs"有网且有成熟的
      算法推送+信息茧房"两种状态。

      === 综合评估 ===

      四路猎杀均未产生scope内净杀。最强劲的系统性压力仍然来自两个方面（均已由
      falsifiability条件覆盖）：(a)地下开放绿洲效应——数字技术本身就是绕过封闭
      生态的非正式通道（falsifiability(f)预注册）；(b)极端场景中超常规的预期调整
      不受信息生态调节——已通过适用区间的"正常货币政策周期"排除出scope。

      本轮猎捕暴露了三个should级边界问题：(i)数字渗透率阈值效应未定义——多高
      的渗透率才够激活负向渠道？(ii)数字渗透率内部异质性——互联网普及率≠算法
      推送生态成熟度；(iii)"正常货币政策周期"的边界模糊性——极端加息（20%）算
      不算正常？

    non_recurrence_of_ded004_007: |
      DED-004（不可证伪循环）：【未复发——逻辑层有清晰可证伪条件，实操层缺口已由
      r1修复补上】

      逻辑层：四条falsifiability条件（a/b/c/d）均有明确统计判定标准和效应方向
      预测。空格填满的塌缩后果已诚实声明。地下绿洲已预注册为结构性威胁。

