id: ADV-REVIEW-007
target: DED-002
date: 2026-07-13
type: adversarial_review
layer: L3-deductions
round: 3

# === 审查触发源 ===

trigger:
  source: EMP-TEST-002
  reason: |
    DED-002 的经验检验（14 个前现代/无文字社会）发现推论遗漏的
    第四种适应——分裂裂变（fission/segmentation）。索马里 Xeer 与
    前殖民伊博是数百万人口的纯口头社会，靠分裂为低于口头上限的
    自治小单元消化人口增长，而非改造规范体系。检验报告建议依
    宪法反馈原则走 Rule B 修订。作者据此完成第三轮修订，本审查
    对修订版进行对抗式审查。

# === 挑战者（第三轮）===

challenger:
  identity: "独立审查者——第三轮，针对分裂裂变修订"
  date: 2026-07-13

  challenges:

    - id: C1
      title: "加入第四种适应是否使分类完备、从而不可证伪？"
      severity: critical
      detail: |
        这是最致命的挑战，且它正是第一轮审查（ADV-REVIEW-002 的 C4）
        抓到的"伪完备分类"陷阱的复发风险。

        原推论有三种适应 (a)(b)(c)。第一轮审查已警告："三种演化路径
        再次覆盖全部可能空间"——当时通过增加"排除项 + 每种适应的独立
        检验标志"来化解。现在加入第四种 (d) 裂变，直接的质疑是：

        四分类是否穷尽了所有可能？如果任何大规模口头社会必然落入
        {成文化, 分层化, 专业化, 裂变} 之一，那么推论就变成了一个
        无法被任何观察证伪的重言式——因为"没有第五种情况"意味着
        推论永远为真。

        更尖锐地：裂变几乎是"什么都没做"的代名词——如果一个社会
        既没成文、没分层、没专业化，你总可以说"它一定是裂变了"。
        这让 (d) 成为一个吸收一切残余的垃圾桶范畴。
      author_must_answer: "证明加入裂变后，仍存在明确的、可观测的、推论声称不会发生的状态。"

    - id: C2
      title: "裂变与'规范体系根本没有触及天花板'如何区分？"
      severity: high
      detail: |
        伊博村落规模数百至数千人。如果一个规范承载单元只有几百人，
        它可能**根本没到口头天花板**——那么"裂变"就不是对天花板的
        适应，而只是"这个社会的单元本来就小，压根没触发天花板"。

        换句话说：把小单元社会叫做"裂变适应"可能是倒果为因。
        达荷美、祖鲁是大政体（触及天花板→专业化）；伊博是小单元集合
        （未触及天花板→无需适应）。后者根本不构成对推论的检验，
        更不该被算作"验证"。你不能既说"伊博验证了推论"（因为它裂变），
        又说"伊博单元太小不构成反例"（因为它没到阈值）——这是双重标准。
      author_must_answer: "澄清裂变是'对天花板压力的主动响应'还是'碰巧单元就小'，并给出区分两者的可观测判据。"

    - id: C3
      title: "裂变的操作化——如何测量'社会选择了裂变而非其他'？"
      severity: medium
      detail: |
        (a)(b)(c) 都有清晰的可检验标志（物理文本 / >30% 规范不重叠 /
        排他性解释角色）。裂变的检验标志是什么？
        "社会人口远超上限但不存在统一规范共同体"——如何操作化
        "统一规范共同体"？一个氏族联盟（如易洛魁）算统一还是分立？
        松散的文化共同体（都说伊博语、共享 omenala 一般原则）和
        分立的规范单元之间的界线在哪里？
      author_must_answer: "为'统一规范共同体 vs 分裂裂变'提供可操作的判定标准。"

# === 作者反驳 ===

author:
  identity: "推论作者"
  date: 2026-07-13

  rebuttals:

    - target: C1
      response: "驳回——裂变确认天花板而非填补证伪空间，证伪条件依然明确"
      detail: |
        这是必须严肃对待的挑战，但修订版已内置防线。关键论点：

        (1) 裂变不是"突破天花板"的第四种方式——它是"规避天花板"。
            前三种适应在统一政体内改造规范体系，让规范体系承载超限
            复杂度。裂变不改造规范体系，而是**拒绝让单元超限**。
            这不是同一类事物的第四个成员，而是一个范畴上不同的响应。

        (2) 因此推论的证伪条件**没有**被裂变填补。证伪条件始终是：
            "一个 > 5000 人的**统一规范共同体**，纯口头，> 80% 成员
            独立掌握 > 300 条规范。" 裂变社会不满足此条件——因为它
            没有 > 5000 人的统一规范共同体。裂变是**回避**这个状态的
            方式，不是**达成**这个状态的方式。

        (3) 推论声称不会发生、且可观测的状态依然明确存在：
            一个统一的、大规模的、纯口头的、规范民主可达的社会。
            这个状态没有被四分类的任何一支"吸收"——它是被排除的。
            如果明天发现这样一个社会，推论立刻被证伪。

        (4) 针对"垃圾桶范畴"的指控：修订版给裂变加了**独立证伪条件
            (d)**——如果一个裂变社会的自治单元本身 > 5000 人、规范
            民主可达 > 300 条且无专业化，则证伪推论。这使裂变不是
            "吸收一切"的空范畴，而是有自己的可证伪边界。

    - target: C2
      response: "接受部分——补充区分'响应性裂变'与'原生小单元'的判据"
      detail: |
        挑战有力，双重标准的风险真实存在。澄清如下：

        推论的核心主张是关于**统一规范共同体的规模上限**，
        不是关于"每个社会都必须触及天花板"。对不同社会：

        - 若一个社会**从未尝试**建立大规模统一规范共同体，
          它的小单元结构不构成对推论的检验——既不验证也不证伪。
          它只是"不在检验范围内"（类比 DED-001 中层级 < 8 的案例）。

        - 若一个社会**有过统一压力**（如伊博面对跨村纠纷、外部威胁、
          贸易协调的需求）却仍然通过裂变而非集权来应对——
          这才是"响应性裂变"，是对天花板的主动规避。

        可观测判据：是否存在**跨单元协调需求的证据**（贸易网络、
        跨村纠纷解决机制如神谕、共同防御）却**没有**发展出统一的
        规范权威。伊博的 Arochukwu 神谕正是这种证据——存在跨村仲裁
        需求，但解决方式是求助于一个"外部"神谕权威，而非建立统一
        成文/分层规范体系。

        修正：EMP-TEST-002 对伊博的判定应从笼统的"验证"精确为
        "响应性裂变——存在跨单元协调需求但以裂变+外部神谕规避统一"。
        承认挑战者的核心点：不能把任何小单元社会都算作验证。
        但伊博、索马里有跨单元协调证据，属于响应性裂变。

    - target: C3
      response: "接受——提供'统一规范共同体'的操作化判定"
      detail: |
        "统一规范共同体"的可操作判定标准（三条同时满足）：
        (i) 存在被该人群普遍承认的**单一最高规范权威**
            （某个人、议事会、文本、或角色），其裁决对全人群有约束力；
        (ii) 规范的执行在跨越子群体时**不需要**重新协商——
            同一条规范在共同体任何角落有相同效力；
        (iii) 成员将自己识别为**同一规范共同体**的成员，
            而非"我的氏族规范"vs"他的氏族规范"。

        按此判定：
        - 易洛魁联盟：有《大和平法》作为联盟层级的统一规范权威
          → 偏向统一共同体（且它走的是专业化+助记外化，非裂变）。
        - 索马里/伊博：每个氏族/村群有自己的 xeer/omenala 变体，
          无跨氏族的统一规范权威，纠纷跨氏族时需重新协商或求助神谕
          → 分裂裂变。
        这个三条标准写入推论的 operationalization（后续迭代补充）。

# === 裁决 ===

verdict: verified
verdict_rationale: |
  第三轮修订（加入分裂裂变作为第四种规避型适应）经受住了对抗式审查。

  C1 (critical) 是决定性挑战——"四分类是否导致不可证伪"。作者的反驳
  成立：裂变是"规避"而非"突破"天花板，它不填补证伪空间。推论声称
  不会发生的可观测状态（统一的、大规模的、纯口头的、规范民主可达的
  社会）依然明确存在且未被任何分类支吸收。修订版还为裂变加了独立
  证伪条件 (d)，使其不是吸收一切的空范畴。C1 被实质性化解。

  C2 (high) 暴露了真实的双重标准风险，作者接受并补充了"响应性裂变
  vs 原生小单元"的区分判据（跨单元协调需求的证据）。这是本轮最有
  价值的改进——它防止把任何小单元社会都算作验证。

  C3 (medium) 促成了"统一规范共同体"的三条操作化判定标准。

  裁决：修订版维持 verified。核心洞察（口头规范存在民主可达性天花板）
  未被动摇，且经验检验（无反例）+ 第四种适应的发现使推论的解释力
  更完整。

caveats:
  - "继承 ADV-REVIEW-005 的三条悬挂标记（300 条阈值经验引用、编码协议试运行、反例搜索）——第三轮修订未解除这些标记。"
  - "'响应性裂变 vs 原生小单元'的区分依赖'跨单元协调需求证据'——此判据本身需要更严格的操作化，当前为定性判断。"
  - "'统一规范共同体'的三条判定标准尚未在多个案例上系统应用——易洛魁的归类（统一 vs 分立）存在编码张力。"

review_date: 2026-07-13
