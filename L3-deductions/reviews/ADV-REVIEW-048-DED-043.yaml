  counterexample_hunt: |
    【猎捕过程——必做,判 verified 前必须留下】

    猎捕1:电报/电话历史平行线(19-20世纪通信成本崩塌)
    - 主张:电报和电话使信息传递从数天/数周降至数分钟/数秒,通信成本崩塌量级远超AI协调。
      按"信息成本降→层级压缩"的逻辑,19世纪末-20世纪初应出现大规模组织扁平化。
    - 史实:恰恰相反——电报/电话催生了史上最深层的层级组织(铁路公司、标准石油、美国钢铁、
      通用汽车),Alfred Chandler(1977)"看得见的手"记录了管理革命:通信提速使HQ能对远距离
      分支机构施以更密集的控制→层级不是压缩了而是加深了(foreman→supervisor→dept head→
      plant manager→regional VP→division president→CEO)。
    - 裁决:【被消化,不杀推论】。关键区分:电报/电话是通信【通道】(channel)——信息流得更快,
      但处理信息的仍是人脑。更快的通信让HQ能更密集地向下施控,因此加深了层级。AI协调是信息
      【处理器】(processor)——不只是信息传得更快,而是信息汇总/任务分配/冲突仲裁这些处理
      行为本身由AI执行,替代了人脑的协调功能。通道vs处理器的类型差异使历史平行线不直接推翻
      推论,但推论应讨论此区分以增强discriminant validity(should)。
    - 推论的防御(O(n²)→O(n))成立:电报降低通信延迟(系数变小),不改变O(n²)的人-人协调结构;
      AI改变的是协调结构本身(人-AI-人替代人-人)。

    猎捕2:Holacracy/Zappos——无AI协调的激进扁平化
    - 主张:Zappos 2013-2015推行Holacracy(自管理/无正式经理),在AI协调工具普及前就实现了
      接近零层级。若无AI也能极度扁平,AI作为层级压缩驱动量的独特解释力被削弱。
    - 裁决:【被消化,不杀推论】。落入2×2判据表的"低AI渗透率,层级显著少于传统预测"格——
      作者已声明此格"不证伪也不体面本推论",意味着"层级压缩有其他驱动量(Holacracy/自组织
      理念)"不否定"AI协调也是驱动量之一"。且Holacracy实践中仍有circle/lead link等结构
      (约1-2层),符合推论"层级收敛于1-2层、不压缩至零"的上限预测。Zappos的Holacracy实验
      也已部分回退(2016后部分恢复传统管理)。不升级为required。

    猎捕3:中国AI大厂层级深(阿里/腾讯)——高AI使用+深层级
    - 主张:阿里巴巴/腾讯大量使用AI(推荐/风控/物流/客服),但维持"专员→经理→总监→VP→
      高级VP→事业群总裁→CEO"的5-7级层级。若此类组织AI渗透率高但层级不压缩,直接填上
      2×2的"高AI渗透率×层级无显著差异"格→证伪推论。
    - 裁决:【被消化,不杀推论(但暴露测量挑战的尖锐性)】。关键在此类组织的AI使用是否符合
      本推论的"AI协调渗透率"定义——AI承担信息汇总/任务分配/冲突仲裁的"替代"而非"辅助"。
      阿里/腾讯的AI更多用于业务推荐和风控(客户侧),内部管理的任务分配/冲突仲裁仍主要由
      人类管理者执行——按本推论的严格操作化,AI协调渗透率可能实为低至中。这是primary_suspect
      "增强vs替代"区分在现实中的映射——不推翻推论,但暴露了操作化难度:区分"组织的AI使用率"
      和"AI协调渗透率"需要深入内部管理流程审计,外部观察者难以获取。此案例强化了"增强vs替代"
      作为推论最大风险的判断,但不构成净杀。

    猎捕4:GitLab——全员远程+高度工具化但仍有层级
    - 主张:GitLab是全球最大全员远程公司(~2000人),重度依赖工具化协调(GitLab本身+Slack+
      CI/CD+自动化),理论上接近"AI/工具承担中层信息处理"的条件。但其组织仍有"团队成员→
      经理→总监→VP→CxO→CEO"的4-5级层级。
    - 裁决:【被消化,不杀推论】。GitLab的工具化协调以异步通信+文档化为主(Slack/GitLab issues/
      handbook),但信息汇总/任务分配/冲突仲裁的决策仍由人类管理者执行——工具辅助沟通但不
      替代决策。属"增强vs替代"中的增强侧。且GitLab的层级(4-5级)在同规模(2000人)传统组织
      (通常5-7级)中已偏低,可能部分体现了工具化协调的压缩效应——但因无受控对照,无法归因。

    === 猎捕结论 ===
    未猎到 scope 内的活反例。最接近杀招的电报/电话平行线被通道vs处理器类型差异消化;
    Holacracy落入2×2低AI格(不证伪);中国AI大厂/GitLab落入"增强vs替代"测量挑战
    (primary_suspect已识别)。推论存活——但存活并不证明为真,只是本轮攻击未打穿。

  non_recurrence:
    ded_004_cycle: |
      未重蹈DED-004不可证伪循环。2×2核心空格(高AI渗透率,层级无显著差异)是真实的
      经验赌注——若被大量实例填充,推论塌缩。此格不由任何砖平凡强制为空。anti-talisman
      双向禁反推,前件(AI渗透率)必须从技术架构独立测量,不得从层级结果反推。
    ded_007_welded_axis: |
      未重蹈DED-007测量轴焊死。AI渗透率(三维编码/技术架构审计)与管理层级数(组织
      结构图/汇报链)异源正交。无"DED-007式分母偷用实际获授者"类焊点。

  required_fixes:
    - id: RF1
      severity: required
      action: |
        修正 derivation step 1 中对 BR-L2-004 的事实错归因。"单人的直接管理幅度仅约
        7-15人"并非 BR-L2-004 的内容——BR-L2-004 只确立 Dunbar ~150(社会关系认知上限)
        和 O(n²)全对等协调成本,不涉及管理幅度概念。7-15 来自经典管理理论(Urwick 1956
        / Graicunas 1933),是独立于公理体系的外部经验基线。
      fix: |
        将 derivation step 1 中"且单人的直接管理幅度仅约7-15人"改为"且经典管理理论
        (Urwick/Graicunas)确立了单人直接管理幅度仅约7-15人的经验基线(此基线独立于
        BR-L2-004,但与之相容——Dunbar ~150是社会关系上限,管理幅度~7-15是任务协调
        上限,两者共同构成'人类作为唯一协调中介'时的层级生成机制)"。
        同步修正 statement 和 人话摘要 中任何将7-15归因于 BR-L2-004 的表述。

    - id: SF1
      severity: should
      action: |
        为管理幅度 50-200 的定量估计提供数量级推理或诚实标注其推测性质。
      fix: |
        在 derivation step 3 或 operationalization 中补充:50-200 不是精确测量值,
        而是基于"监督AI输出的认知负载≈监督2-3个直接下属(结构化的、可查询的)×AI可
        同时协调的人数上限极高(当前技术下数万)"的数量级推理(50 ≈ 2×25, 200 ≈ 3×67)。
        明确标为"方向性估计",诚实承认精确上限需经验检验。

    - id: SF2
      severity: should
      action: |
        诚实标注三个承重锚的测量局限——当前均为方向性示意,非严格操作化测量。
      fix: |
        在 real_world_anchors 顶部或 supporting 列表前加注:"以下锚点为方向性示意
        (illustrative),未按 operationalization 的三维编码做严格独立测量。AI渗透率的
        判定基于公开信息的定性判断,有待正式经验检验中的操作化测量验证。"

    - id: SF3
      severity: should
      action: |
        限定 derivation step 3 中"AI输出是不隐瞒的"这一声称。
      fix: |
        将"AI输出是结构化的、可查询的、不隐瞒的(与人不同)"改为"AI输出是结构化的、
        可查询的,且AI无策略性隐瞒意图(与人不同——人类可能因政治/职业安全动机隐瞒信息,
        AI不具此类动机)。但AI输出可能因幻觉/偏差/模型缺陷而不准确,此不可靠性在效果上
        部分抵消'不隐瞒'优势,应在经验检验中纳入考量。"

    - id: SF4
      severity: should
      action: |
        讨论电报/电话历史平行线以增强 discriminant validity。
      fix: |
        在 discriminant_validity 或 real_world_anchors 中新增一段,讨论19-20世纪
        电报/电话使通信成本崩塌但层级反而加深的历史模式(Chandler 1977"看得见的手"),
        并区分:电报/电话是通信【通道】(加速信息流动,不改变人脑作为唯一处理器的结构),
        AI协调是信息【处理器】(替代人脑执行信息汇总/分配/仲裁)。此区分是本推论与
        "信息技术→扁平化"朴素直觉的关键判别点。

