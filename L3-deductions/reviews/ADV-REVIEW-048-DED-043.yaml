  counterexample_hunt: |
    【本轮猎捕——必做,判 verified 前留下过程】

    猎捕 1: Buurtzorg(荷兰居家护理)——大规模+极扁平+非 AI 协调
    - 主张: Buurtzorg 约 15,000 名护士,以自管理团队(10-12 人/队)运作,中央仅约 50 名
      后勤人员。管理层级仅 2 层(护士+区域教练),远低于同规模传统护理组织(通常 4-5 层)。
      其技术栈(BuurtzorgWeb)是自建平台,用于排班/文档/沟通,非 AI 驱动。若 15,000 人
      可通过简单工具+自组织理念实现极度扁平,则 AI 作为层级压缩驱动量的独特解释力受挑战。
    - 裁决:【被消化,不杀推论】。落入 2×2"低 AI 渗透率,层级显著少于传统预测"格——作者
      已声明此格不证伪推论(其他驱动量可以压缩层级)。但大量此类案例(如 Valve ~360 人、
      Morning Star ~400-2,300 人、Buurtzorg ~15,000 人)的存在暗示:"层级压缩"可能有
      比 AI 协调更强/更普遍的其他驱动量(自组织理念/信任文化/简单工具),削弱 AI 协调
      作为驱动量的增量解释力。此为 should 级关切的累积效应,非单例杀招。

    猎捕 2: 中国网约车平台(滴滴)雇员侧 vs 司机侧的层级不对称
    - 主张: 滴滴在司机侧实现了算法协调的极薄管理(同 Uber 锚),但滴滴雇员侧(工程师/
      运营/市场等数万人)仍维持传统互联网公司的 5-7 级层级。若同一组织内 AI 协调在
      一部分有效(司机侧)、另一部分无效(雇员侧),则推论需解释此不对称——是雇员工作的
      不可测量性(DED-035)导致 AI 渗透率低,还是层级服务于非协调功能?
    - 裁决:【被消化,不杀推论】。作者在 Uber 锚中已诚实标注"雇员侧仍有传统管理层级"
      且此混杂未解。滴滴/Uber 的雇员侧不可压缩性更可能是 DED-035 的可测量性约束
      (战略/创新/文化建设等默会活动难以 AI 化)和非协调功能(职业晋升阶梯)的合力——
      这正是推论射程边界(BR-L2-026 g-j 缺失维度+非协调功能排除)的实例化,非反例。

    猎捕 3: 历史上的"信息处理者替代"先例——打字员池/计算室消失
    - 主张: 20 世纪初,大型组织设有"打字员池"(typing pool)和"计算室"(calculating room)
      ——数十至数百名职员专职处理信息(打字/誊写/计算/制表)。打字员池→组长→部门主管
      本身就构成 2-3 级信息处理层级。打字机/复印机/电子计算器→PC/Excel 替代了这些
      信息处理者后,打字员池和计算室消失,与之相关的 1-2 个管理层级随之消失。若历史上
      "信息处理者被机器替代→层级压缩"的模式已发生过,AI 协调就不是全新的机制类型。
    - 裁决:【被消化,且【反哺】推论】。打字员池/计算室→PC/Excel 的替代恰是"信息处理者
      替代→层级压缩"的历史先例,与本推论的机制同构(O(n)信息处理者被机器替代→相关层级
      消失)。差异在替代的范围:打字员/计算员仅替代了非常窄的信息处理子集(文字誊写/算术),
      AI 替代的是中层管理者的全谱信息处理(信息汇总/任务分配/冲突仲裁)——范围更广,
      但机制类型一致。此历史平行线【支持而非推翻】推论,可被视作"受限域(miniature)的
      历史验证"——当信息处理者被机器替代时层级确实压缩,区别仅在替代的宽度和深度。
      建议将此历史先例纳入 supporting anchors(作为低 confidence 的类比证据)。

    猎捕 4: 印度 IT 外包——"人类替代中层协调"的大规模实验
    - 主张: 印度 IT 外包(Infosys/TCS/Wipro)管理数十万工程师的全球交付,依赖大量的
      "中层协调者"(项目经理/交付经理/客户经理)进行跨时区/跨文化的任务分配与冲突仲裁,
      而非 AI 协调。这些组织在 10 万+人规模下维持 5-7 级层级——说明在没有 AI 协调时,
      层级确实随规模递增(BR-L2-004 基线),支持推论的"AI 是打破此基线的候选机制"这一
      前提。不是反例,是基线对照。
    - 裁决:【被消化,支持推论的前提】。

    === 猎捕结论 ===
    未猎到 scope 内净杀反例。最接近的 Buurtzorg/Valve/Morning Star 等自组织扁平化
    案例落入低 AI 格(不直接证伪),但它们的累积存在削弱 AI 协调作为层级压缩驱动量的
    增量解释力。打字员池→PC 的历史平行线反而【反哺】推论——"信息处理者替代→层级压缩"
    在受限域已被历史验证。核心风险仍是"增强 vs 替代"的操作化难题:推论在原则上可证伪,
    但在实践中可能因测量困难而长期悬置(介于 DED-004 边缘但未落入)。

    判定:无净杀,推论存活进入下一轮。

  non_recurrence:
    ded_004_cycle: |
      【本轮复查:未重蹈。但有一条边界悬置。】
      falsifiability 三条注册口径覆盖核心赌注。2×2 空格"高 AI 渗透率×层级无显著差异"
      是可被填上的真经验赌注。anti-talisman 五禁令双向封堵逆向推断。

      【DED-004 边界悬置】推论的实证可错性在原则上成立,但在实践中可能长期悬置——
      "替代 vs 辅助"的区分需要深入组织内部做技术架构审计+管理者时间日志分析,外部
      研究者极难获取。若实证界 5-10 年内无法产生按三维编码独立测量的 AI 渗透率数据,
      推论将处于'可证伪但不可检验'的尴尬状态。但这不同于 DED-004 的"不可证伪循环"——
      前者是测量可行性问题,后者是逻辑结构问题。DED-004 的问题在于"任何观察结果都能被
      理论消化",本推论在逻辑上有不可消化的观察(高 AI 渗透率+层级不压缩)。当前判定:
      未重蹈,但有悬置风险——若 5 年后仍无操作化测量数据,此风险升级。

    ded_007_welded_axis: |
      【本轮复查:未重蹈。无硬焊点。】
      AI 渗透率(三维编码/技术架构审计)与管理层级数(组织架构图/汇报链)异源正交。
      无"分母偷用实际获授者"类焊点。

      【温和焊点(非 required)】"橡皮图章式确认 vs 独立判断"的编码区分在实际操作中
      可能受编码者对目标组织扁平度的隐式认知影响——知道某组织扁平→倾向于将管理者的
      确认编码为"橡皮图章"。此为编码者偏差(可通过盲法缓解),非 DED-007 式数学恒等焊点。
      维持无硬焊点判定。

