      【新发现软肋(should 级)】
      (a) 推导隐含外部依赖:7-15 管理幅度来自 Urwick/Graicunas(外部经典管理理论),
          不在公理体系任何砖中。虽然 RF1 修正了错归因,但 7-15 作为关键定量基线(用于
          推导 50-200)的外部性未在 derivation.from_l2 中诚实注册。不影响方向性预测
          的有效性,但定量赌注(50-200)的地基有一半在体系外。
      (b) 50-200 的数量级推理仍缺失:SF1 的修正仅加"推测性质"标注,未提供 r1 所要求的
