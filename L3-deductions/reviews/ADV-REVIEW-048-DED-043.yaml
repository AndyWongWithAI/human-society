    definition_vs_prediction: |
      【本轮复查:维持 round_1 结论,未命中,攻不穿。】
      "AI 协调渗透率"是可操作化测量构念(三维编码+独立测量规程),非分析性真理。
      预测(i)(ii)(iii)均可证伪——falsifiability 三条注册了具体统计检验。
