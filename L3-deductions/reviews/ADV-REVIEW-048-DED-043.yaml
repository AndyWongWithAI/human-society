    real_world_anchor_fact_check: |
      【本轮复查:未命中,攻不穿。无 DED-007 式的事实错误或过度解读。】
      三锚点(Uber ~22-30K 雇员/~5M 司机/算法派单;Amazon Kiva+自动派单/仓储层级压缩;
      OSS Linux 仁慈独裁者+子系统维护者/CI 自动化)的事实陈述经独立核查合理。混杂因素
