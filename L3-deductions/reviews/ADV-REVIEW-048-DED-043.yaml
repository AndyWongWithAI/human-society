          可支持 30-300 或 100-500 等不同范围。推论应至少展示数量级推理链。
      (c) 平凡化风险:若推论在实证中被简化为"AI 用得多→组织扁"(与"信息技术→扁平化"
          的朴素直觉难以区分),则 discriminant_validity 的防线依赖"替代 vs 辅助"的
          可操作化区分——而此区分恰是推论的最大软肋。这构成一个风险集中点:推论与
          朴素直觉的判别倚赖于测量上最困难的那个区分。

