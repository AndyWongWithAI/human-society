      至少被 AI 分配 ≥1 次任务')并做敏感性分析"——阈值的具体数值处于'需注册但尚未注册'
      的悬置状态。红旗 11(L4-009 判例)要求"阈值连同分子、分母、测量口径一次性注册"。
      当前阈值是建议性的("如")而非锁定性的。→ should:在经验检验前锁定阈值数值,
      或明确声明'此阈值在正式检验前由独立编码者锁定,当前文件仅给出建议方向'。

      追加确认:无 L4-009 式事后口径选择的历史——anti-talisman 第五条对称保护明确禁止
      "层级压缩后反推 AI 渗透率测低了"。悬置阈值的风险受 anti-talisman 结构保护,
      但预注册的纪律仍要求阈值在实际检验前锁死。

