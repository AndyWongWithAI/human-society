    - |
      [should-3] anti-talisman 锚端兑现:当前两个锚的 independent_scarcity_evidence 段
      均自陈精度不足(!Kung"精度中等、非量化连续变量",饥荒"独立精度不足、偏粗"),
      未做到作者自设的"至少一个锚真正独立测出稀缺度"。修法:要么补入一个真正有定量
      生态/考古独立稀缺度数据对照分配标准观测的锚,要么在 anti_talisman_clause 段诚实
      标注"锚的独立定量兑现待补充(currently directional but not yet quantitative)"。
    - |
      [should-4] 排除口 (2) 的事前判据:excluded_outcome (2)"分配规范因非稀缺因素变化"
      的排除判据(非由本地稀缺度的独立变动驱动)在实践上可能与结果混淆——遇"稀缺上升
      但平等不退"的反例时,可被归为"规范由意识形态固化、非由稀缺驱动"而消解。修法:
