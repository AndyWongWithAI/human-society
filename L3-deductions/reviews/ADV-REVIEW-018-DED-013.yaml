    - |
      [should-2] Ik 锚披露 Turnbull 争议,并厘清 Sen entitlement 框架与本条物理驱动
      机制的张力。Turnbull 的《The Mountain People》在人类学内部受 Bernd Heine 等学者
      严重质疑(方法论缺陷、选择性报告、伦理争议)。将 Ik 描述为"野外独立观测"而未标注
      争议,使锚的可信度打折扣。修法:诚实标注 Turnbull/Ik 的学术争议,援引更稳健的
      灾荒人类学跨文化综合(Dirks、Shipton);并厘清 Sen 的 entitlement 框架(分配制度→
      饥荒)与本条(稀缺→分配制度位移)的因果箭头方向相反——二者均被作者援引为支持
