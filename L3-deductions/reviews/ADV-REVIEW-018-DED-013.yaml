  red_flag_findings:
    brick_conclusion: |
      【攻不穿——round_1 修后防线合规】。BR-L2-017 原文确含"资源从共享品→稀缺激励品
      →平等退缩、贡献上升"的方向性位移主张。DED-013 经 round_1 修正后已诚实承认此重叠,
      将 novelty delta 收窄为"物理可行性塌缩机制(归因层推进)+辅助精化(单调/空格)"。
      物理机制将归因从 BR-L2-017 的认知心理层(Fiske/Deutsch/Sahlins)推进到物理结构层
      (生存约束:平等在生存线以下物理不可执行)——此归因层推进在 BR-L2-017 中确无覆盖,
      是真实增量。砖(BR-L2-013, BR-L2-017)不专为窄化本条而调整——BR-L2-013 和 BR-L2-017
      原文在 DED-013 创建前已稳定为 verified。防线合规,无新命中。

    nontriviality_cell_check: |
      【攻不穿——round_1 降级到位】。空格 (iii) 已降级为"边界厘清(非独立预测)/自然
      边界注解",不再作为独立经验风险增量来卖。剩余格 (充裕/稀缺)×(平等/贡献/需要) 的
      五格均标注为"非空·常见",且逐格判空表承认这些格均可被观察到——非平凡性不依赖
      空格证成。真正可证伪的经验押注在预测 (i)(ii):(i)生存线以下平等频率趋零(可被横截面
      观测证伪),(ii)稀缺度→标准单调位移(可被纵向数据证伪)。两预测均非定义性/同义反复。
      无新命中。

    measurement_orthogonality: |
      【攻不穿——DED-007 未复发】。scarcity_level(人均资源/生存线,由卡路里可得性/资源
      存量-人口比/环境承载力等生态指标测)与 allocation_norm_type(实际分配行为+自陈理由+
      违规反应)来源异质、不共用指标、anti-talisman 双向禁反推。round_1 指出的两条 should
      级残留仍存在但未升级:(a)极端稀缺下行为组件的物理可行性污染——但自陈理由+违规反应
      两通道可解耦;(b)锚端定量兑现不足——但防线设计已在位。主轴不焊死。

      补一刀:本轮审查者额外检验了"行为组件在极端稀缺格是否可能系统性污染主导判定"——
      设想场景:极端稀缺(资源量小于 N 乘生存量)下按平等分物理不可行→观察到非均等分配→
      行为组件判为"非平等"→主导被标为"贡献或需要"。若此时成员仍自陈平等信念(嘴上说
      "我们应该平分"但实际分不了),则行为组件的信号可能是物理约束的噪声而非规范切换的
      信号。DED-013 的 measurement 段写明三源合一按主导判,存在行为权重压倒自陈的风险。
      但:(a)limitations 已标注"需防范研究者把混合态事后重标来消化反例";
      (b)目前无锚落在该极端格,故此风险在当前证据基础上是假设性而非实际性的。
      记 should,与 round_1 should-3(锚端兑现)联动——未来若锚落在极端稀缺格出现时,
      须显式降行为组件权重、抬自陈理由(b)和违规反应(c)权重。

    scope_hook_independent_of_result: |
      【攻不穿——should 残留未升级】。排除口 (2) 的事前判据模糊问题(round_1 should-4)
      仍存在:遇"稀缺上升但平等不退"的反例,可被归入"规范由意识形态/宗教固化→排除"
      而消化。但三条证伪路径 (a)(c) 完全不依赖该排除口:(a)只问生存线以下平等是否存在
      (与意识形态解释无关),(c)只问同一群体稀缺度变化时分配规范是否同向位移(纵向自
      对照,排除了跨群体的意识形态差异混淆)。排除口的活门风险被 (a)(c) 的独立性有效对冲。
      排除口 (1)(3) 干净。不升级。

    criterion_tier_match: |
      【攻不穿——should 残留未升级】。连续驱动量(scarcity)→3型分类结果(allocation_norm)
      的单调性检验存在粒度不匹配(round_1 should-1),作者未修。但:
      (a)预测 (i)"平等频率趋零"是单类频率假设,可直接用分类变量检验;
      (b)预测 (ii)"稀缺度上升→平等减少+贡献和需要增加"是方向性关联,可用序数关联检验
      (如 Kendall tau-b / Spearman,将 3 型视为序数:平等→贡献/需要);
      (c)"单调位移"在分类框架下应理解为"directional trend"而非严格数学单调,
      措辞偏强但不推翻可检验性。
      不升级。建议将"单调位移"措辞在预测 (ii) 处降为"方向性位移"或加注"在主导分类
      框架下为方向性趋势,非严格单调函数"。

    anti_talisman_cashed: |
      【攻不穿——should 残留,未达 required 边界】。anti-talisman_clause 防线设计完整:
      双向禁反推、明文禁遇反例事后下调稀缺度、要求至少一个锚独立测出驱动量。
      但两个锚的 independent_scarcity_evidence 段均自陈精度不足(round_1 should-3),
      未做到定量独立对照。

      本轮审查者追加一道压力测试:假设有人用"同一群人的分配行为数据"回推稀缺度
      (这是 DED-004/007 的经典病根)——DED-013 能否挡住?答案:能。因为 measurement 段
      明确稀缺度由生态/考古指标(卡路里、储量、人口压)测,与分配行为分轴;且
      anti_talisman_clause 明文禁止"因用了贡献分就判为稀缺"。防线设计能挡住方向性循环。

      但防线设计在纸面不等于锚端有驻兵。当前锚端偏向定性叙事而非定量对照。这是推论
      成熟度问题(处于 candidate 阶段),不是防线瑕疵。建议下一轮优先加固锚端定量兑现,
      或诚实标注"锚端独立定量待补充"。

      对 verified 判定:锚端定量不足影响推论的经验置信度,但不影响推论的可证伪性——
      三条证伪路径均技术可检,不依赖锚的精度。不升级为 required。

    anchor_fact_check: |
      【攻不穿——should 残留未升级】。Ik/Turnbull 争议与 Sen entitlement 张力
      (round_1 should-2)作者未修。Turnbull 的《The Mountain People》在人类学内部
      受 Heine(1985)、Laughlin 等质疑(方法论缺陷:短期田野+语言障碍+选择性报告;
      政策偏见:建议强制解散 Ik 社会)。这削弱 Ik 作为"野外独立观测"锚的可信度,
      但饥荒→规范塌缩的跨文化模式有更稳健证据链(曹树基中国灾荒史、Dirks/Shipton
      饥荒人类学综合),且第二个锚明确标注 confidence=moderate(非宣称强证据)。

      Sen entitlement 与本条物理驱动的因果箭头张力:Sen 论证饥荒常源于 entitlement
      failure(分配制度失败)而非绝对食物短缺——分配制度是饥荒的【原因】;本条的
      displacement 说稀缺→分配制度位移——分配制度是稀缺的【后果】。二者方向相逆
      但时间尺度不同:entitlement 分析的是"为什么这次饥荒发生了"(静态归因),
      displacement 分析的是"持续稀缺压力下分配制度如何演变"(动态过程)。不矛盾,
      但作者应厘清此差异以免引证混淆。

      不升级为 required——Ik 是双锚之一非唯一锚,且 confidence 诚实标注为 moderate;
      Sen 张力可通过措辞厘清解决。

    definition_vs_prediction: |
      【攻不穿——round_1 已修】。空格 (iii) 已明确定位为"边界厘清/自然边界注解、非独立
      经验风险增量"——其定义性成分不再被隐藏。预测 (i)(ii) 是真正可证伪的经验主张:
      (i)可被横截面生存线以下平等观测证伪;(ii)可被纵向稀缺度-分配标准关联检验证伪。
      falsifiability(a)(b)(c)三条路径均可检。推论从"伪 triple-risk"变为诚实的
      "double-risk+definitional-note"。无新命中。

    enumeration_and_species: |
      【攻不穿——should 残留未升级】。程序公平(procedural fairness/lottery/rotation)
      作为第四类分配标准(round_1 should-5)仍未在枚举中被承认。本轮审查者在反例猎捕中
      再次触达此缺口:Essex 海难最终用 lot 决定谁被杀供食——不是贡献也不是需要,是抽签;
      海上救生惯例(救生艇有限补给按抽签/轮换);军事征兵 lottery。

      程序公平在逻辑上不同于平等/贡献/需要三元组:平等问"每人拿多少"(结果公平),
      程序公平问"决定谁拿多少的过程是否公正"(过程公平)。当平等在物理上不可行且贡献/需要
      争议太大时,lottery 作为"谁都别吵"的逃生口被启用——它实质上是把结果交给无偏随机
      过程,从而切断任何人对结果的抱怨权。

      这不攻方向——程序公平仍是平等退潮后的去向,符合位移方向。但它扩了位移目的地的
      枚举,且对机制链有修正意义:物理上平等不可执行后,群体不必选贡献或需要——也可以
      选"抽签"(此时公平的种从"结果平等"切换为"机会平等")。

      不升级为 required。枚举类型从 3 扩到 4 不推翻核心预测(平等退潮),且 DED-013 的
      allocation_norm_type 段已写"可混合,按主导判",这在技术上可以容纳程序公平
      (如"抽签+按需"混合)。但诚实做法是显式承认第四类,尤其在机制链中把"贡献或需要"
      改为"贡献/需要/程序公平等非平等标准"。

    primary_suspect_aim: |
      【攻不穿——round_1 已修,但有一新软腿未被认领】。
      primary_suspect="BR-L2-017 的 novelty delta 是否真实"——已修(收窄 novelty 宣称)。
      secondary_suspect="稀缺度测量独立性(anti-talisman)"——防线设计正确。

      本轮审查者发现一条新的软腿:【物理机制的独立可检验性】——DED-013 经收窄后核心
      novelty=物理可行性塌缩机制,但其三条证伪路径 (a)(b)(c) 测试的是方向性预测
      (稀缺度→分配标准位移),而非物理机制与认知机制的【区分】。方向性预测与 BR-L2-017
      共享——若方向性预测被证伪,BR-L2-017 和 DED-013 一起塌;若方向性预测被证实,
      两条推论共享功劳——无法区分归因是物理的还是认知的(Fiske/Deutsch/Sahlins)。

      判别段已识别正确问题("物理机制是否可在经验上与认知切换区分开"),但未将区分
      操作化为正式预测。真正的区分预测应是:"平等退潮的起点/加速度是否集中于生存线
      阈值附近(支持物理机制)vs 分散在整个稀缺度连续谱上(支持认知机制)"——这需要
      稀缺度连续谱上的 displacement 起点数据,比当前锚精度高一个量级。

      此新软腿不升级为 required——方向性预测本身已有理论价值;物理机制提供了因果
      解释深度(why 而非 just what),即使暂未独立检,也是理论推进;且生死判已诚实
      标注区分任务,未声称已完成。但应在 falsification_trace 中增列为 tertiary suspect
      或注明"物理机制的独立检验路径待后续操作化"。

  counterexample_hunt: |
    【本轮独立反例猎捕——专攻 falsifiability (a)(b)(c)】

    【攻 (a):找生存线以下+平等主导+无外部强制的群体(横截面即可)】

    候选1:日本 3.11 震后避难所(2011)。初期物资极度匮乏,多份报告描述灾民自发维持
    平等分配——排队领物资、均分食物。裁决:不净。(a)稀缺为暂时性(数天至数周),
    非结构性稀缺,属 boundary case"短期波动";(b)外部援助陆续到达;(c)日本社会规范
    构成强社会压力(软性外部强制);(d)稀缺度未达生存线以下(无人饿死)。

    候选2:列宁格勒围城知识分子群体(1941-1944)。部分知识分子圈子在极端饥馑中坚持
    分享最后食物、维持平等伦理。裁决:不净。(a)国家配给制存在(外部强制);(b)战争
    情境的外部敌人增强内部凝聚力;(c)这些圈子的"平等分享"是特例而非群体层面的
    主导规范——绝大多数市民陷入各自求生。

    候选3:喜马拉雅高山佛教僧团。极高海拔、资源极度匮乏的隐修处,僧侣维持财产公有+
    平等分配。裁决:不净。(a)僧侣自愿选择简朴——按代谢适应基准,人均资源可能不低于
    生存线(他们存活了);(b)戒律/宗教信仰=外部强制(虽非国家暴力,但是制度化强制);
    (c)僧团规模极小(数人至数十人),可比于家庭而非"群体规范"。

    候选4:澳大利亚原住民旱灾期的 "demand sharing" 规范。极端干旱下,某些原住民群体
    仍维持"任何人可要求分享"的规范。裁决:不净。(a)稀缺度是否达生存线以下可争议
    (原住民有深层生态知识获取隐藏资源);(b)"demand sharing" 实质不等于平等——它允许
    有需求者主动索取,结果分配不必然均等,更接近按需模型。

    候选5:纳粹集中营囚犯内部互助(如 Bettelheim 记录的"营内共产主义")。极端稀缺下
    部分囚犯自发组织均等分享。裁决:不净。(a)外部暴力情境(Nazi 管控)构成压倒性外部
    强制;(b)稀缺的成因非生态/经济而是人为剥夺,因果链被外在暴力淹没;(c)此类互助
    圈子是特例而非囚犯群体层面的主导规范。

    【攻 (b):找稀缺度上升但平等不退甚至加强的案例(需是结构性/持续性稀缺)】

    候选6:古巴"特殊时期"(1990-1999,苏联援助断流后极端短缺)。人均卡路里从约2900
    降至约1800大卡/日,持续近十年。此期间国家维持配给制平等分配(粮本/配给证),
    社会层面平等意识形态【加强】(革命话语:"共度难关")。裁决:不净。(a)外部强制
    存在(国家配给+警察制裁);(b)稀缺度未达生存线以下(1800大卡大于生存线,无人饿死);
    (c)外部威胁(美国禁运)增强了内部凝聚力——属于 boundary case"有外部凝聚因素"。

    候选7:也门内战饥荒(2016-至今)。极端粮食短缺,部分社区仍维持部落共享规范(takamul
    /伊斯兰天课 zakat)。裁决:不净。(a)外部暴力情境(战争=压倒性外部强制);(b)宗教
    规范有外部强制性质(zakat 是教法义务,非自发);(c)稀缺是人为(封锁/轰炸),非纯生态驱动。

    【攻 (c):找稀缺度变化后分配标准反向位移(稀缺时反而启用平等)的同一群体纵向案例】

    候选8:二战英国"战时平等"效应。战前(1930s)英国阶级不平等显著;战时(1939-45)物资
    配给制强制平等+社会团结增强——方向是稀缺增加→平等增加(与本条预测反向)。裁决:
    不净。(a)国家强制配给=外部强制(平等非自发);(b)外部敌人(纳粹)增强内部凝聚力;
    (c)稀缺度未达生存线以下;(d)配给制是战时措施,稀缺结束后即废止——非持续性规范位移。

    候选9:某些millenarian宗教运动在灾荒期强化平等教义。如太平天国(1850s)、义和团
    (1900)的部分平等主张在灾荒期更活跃。裁决:不净。(a)宗教/意识形态驱动非稀缺生态
    驱动(属于 excluded outcome(2));(b)平等是教义而非自发涌现的群体规范。

    【猎捕结论】未净到 scope 内活反例。所有候选均被边界条件(外部强制/暂态/非结构性
    稀缺/人为灾难/意识形态驱动)拦截。核心方向(稀缺→平等退潮)未被找到干净反例。

    但猎捕过程再次触达两件事:
    (1)程序公平(lottery)在极端稀缺下反复作为平等退潮后的去向出现(Essex 海难/救生艇
       惯例/征兵抽签),强化 round_1 should-5;
    (2)外部强制+外部威胁在极端稀缺下确实能【逆转】平等退潮方向(战时配给/灾后互助),
       说明本条"无外部强制"边界条件是关键限定——若此边界被模糊化,推论的可证伪性会
       被稀释。当前 boundary_case 已诚实标注此限定,防线在位。

    在现存概念空间(survival threshold 乘 equality 乘 no external enforcement)内,
    空格之"空"有结构原因(物理不等于认知)——这不是推论"特别强",而是物理约束使该格
    在现实中极难被填。反例猎捕不能因"猎不到而推论对"就被认为敷衍——本轮的猎捕过程
    覆盖了跨文化+跨历史+跨灾难类型的多个候选,均给出了具体的拦截至因。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发】。经 round_1 修复后:
    - anti-talisman 双向禁反推在位,稀缺度与分配标准分轴独立测
    - 空格 (iii) 不再伪装独立经验风险
    - 三条证伪路径 (a)(b)(c) 技术可检,各有独立于排除口的检验逻辑
    - 唯一残留活门=排除口 (2) 的事前判据(round_1 should-4),但 (a)(c) 不依赖该口

    DED-007(测量轴焊死):【未复发】。scarcity_level(生态/考古指标)与 allocation_norm_type
    (行为+理由+反应)异源正交,不共享指标。本轮额外检查了"行为组件在极端稀缺下的
    物理噪声风险"(见 measurement_orthogonality),确认不焊死主轴。

    【新增 DED-004/007 复发风险检查——物理机制 vs 认知机制的判别循环】
    设想以下循环:若遇"稀缺未达生存线但平等已退潮"→归因于认知切换(BR-L2-017);
    若遇"稀缺超过生存线后平等退潮"→归因于物理塌缩(DED-013)。这意味着"物理塌缩
    是否触发"的判断标准就是"平等是否退潮+稀缺是否过线"——机制归因由结果反推。
    但 DED-013 并未做此归因跳转——它仅主张"物理塌缩是稀缺→平等退潮的机制之一",
    与认知机制共存而非排他。判别段已诚实标注区分任务,未声称已解决。故不构成循环。

  required_fixes: []

  should_fixes:
    - |
      [new-should] 物理机制的独立检验路径操作化。经 round_1 收窄后核心 novelty=
      物理可行性塌缩机制,但当前三条证伪路径 (a)(b)(c) 均测试方向性预测(与 BR-L2-017
      共享),无法独立检验物理机制与认知机制的区分。判别段已识别了区分问题("平等退潮
      主要发生在接近/越过生存阈值时→物理机制获支持;在远离生存阈值的稀缺度下已退潮
      →认知机制获支持"),但未将此操作化为正式预测。修法:在 falsifiability 段增列
      预测 (d):"若平等分配标准的退潮【起点】在稀缺度远离生存阈值的区间即已系统性
      出现(且不可归因于外部强制/意识形态等非稀缺因素),则物理可行性塌缩机制作为
      排他性归因被削弱——此时 BR-L2-017 的认知框架切换足以解释位移;若退潮集中于
      接近/越过生存阈值区间,则物理机制获得相对认知机制的独立增量支持。"或者诚实
      在 falsification_trace 中标注"物理机制的独立检验路径待后续操作化(需稀缺度
      连续谱上的 displacement 起点数据,精度高于当前锚)"。

