      后,群体也可以选 lottery=把结果交给无偏随机过程)。修法:在 allocation_norm_type
      枚举中增设程序公平(procedural)作为第四类或显式 boundary,并在机制链中标注此去向。

author_response_round_1: |
  两个 required 已执行定向 Edit(非整份重写)。

  [required-1] 空格 (iii) 去定义性/诚实降级——选 (A):
