id: ADV-REVIEW-018
type: adversarial_review
reviews: DED-013
layer: L3-deductions

人话摘要: |
  对 DED-013(稀缺度-分配公平标准位移:资源越少,分配逻辑从平等到贡献/需要单调位移,
  物理可行性塌缩机制+空格预测)的独立对抗审查记录。round-1 裁 needs_revision:核心两穴——
  ①招牌空格"(极端稀缺<生存线+平等+无外部强制)=空"含强定义/算术成分(人均资源<生存线
  +平等分=全员不足存活→群体灭绝→无持续规范可谈),实证风险比自述低;②BR-L2-017 原文
  "资源从共享品变为稀缺激励品→平等退缩、绩效权重上升"已是稀缺驱动方向性位移主张——
  本条追加的单调性+物理机制+空格里,空格被①削弱,物理机制(生存线塌缩)是真正新增量但
  在本条只是定性断言未坐实。故非平凡内核的实际 delta 比 discriminant/nontriviality 自述窄。
  另 5 条 should:3型分类粒度配不上"单调位移"预测、Ik锚基于Turnbull受争议民族志、
  anti-talisman 锚端缺具体数据兑现、排除口(2)"非稀缺驱动"可事后开脱、遗漏程序公平
  (lottery/轮换)作为第四类去向。未净到 scope 内活反例(生存线以下+平等自发维持的群体
  因定义性约束极难存在),最危一击(程序公平作为缺失去向)攻的是位移目的地不全而非核心方向。
  核心并未塌(物理可行性塌缩机制方向对+稀缺度→平等退潮方向稳健),两 required 均为外科式
  收窄/诚实化 ⇒ needs_revision 非 rejected。

target: DED-013
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。评分卡红旗
  10 条逐项攻 + 反例猎捕(判 verified 前必做)+ DED-004(不可证伪循环)/DED-007(测量轴焊死)
  复发检查。裁决三态照评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活
  反例③不重蹈 DED-004/007。

round_1:
  reviewer: "独立子 Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    这是一条【方向对、招牌过强】的候选。作者显式吸收了前几轮死因:(a)稀缺度=连续变量、
    非二值,anti-talisman 禁由分配标准反推——学到 DED-004/006;(b)分配标准三型混合态
    按主导标注、不硬二分——学到 DED-006;(c)测量轴声称正交——稀缺度按人均资源/生存线
    结构测、分配标准按行为+理由+反应测,不共用指标——学到 DED-007;(d)discriminant_validity
    显式列出与 BR-L2-017 的判别红线并自认为"生死判"——诚实前置风险。

    经逐砖核验,攻穿两穴:

    【穴一:空格 (iii) 含强定义/算术成分——实证风险被高估】
    DED-013 的非平凡内核支撑之一=空格"(极端稀缺<生存线+平等+无外部强制)=空"。但
    "生存线"定义为"维持群体成员基本存续所需的每人最低资源量"。若人均资源<生存线且实施
    平等分配,每人所得均<生存最低量→全员不足存活→群体灭绝→长期无群体、无规范可延续。
    这一格之"空"至少部分由生存线的【定义】本身保障——不是靠经验证据在说话,而是靠算术。
    真正有实证风险的问题是:规范是否在群体灭绝【之前】就已位移(预测 i/ii)——而非该格
    是否为空。把(iii)作为"额外经验风险增量"的支柱,夸大了推论的实际押注。

    【穴二:BR-L2-017 原文已含稀缺驱动方向性位移——本条 delta 比自述窄】
    BR-L2-017 原文 statement:"当资源性质从'共享品'变为'稀缺激励品'时,分配标准随之
    位移——平等退缩、绩效权重上升"。这【已经是】稀缺度驱动分配标准方向性位移的主张——
    不是作者描述的"只说了存在语境切换、没说方向"。BR-L2-017 明确给出了方向:稀缺→
    平等退缩、贡献上升。本条追加的三层(单调性+物理机制+空格)中:空格被穴一削弱;物理
    可行性塌缩机制(生存线以下平等不可执行)是真正的结构新增量——BR-L2-017 扎根认知
    心理(Fiske/Deutsch/Sahlins),本条扎根物理约束——但本条目前只做了定性断言,未将
    物理机制操作化为可独立检验的环节(如:"物理塌缩"与"认知切换"在什么观测上可区分?
    是否存在稀缺未达生存线但平等已退潮的案例?若存在,是否削弱"物理机制"的排他性?)。
    单调性本身是形状精化(从"会变"到"单调变"),无独立证伪路径——若 BR-L2-017 的
    "稀缺→平等退、贡献上"本身被证伪,单调性自动跟着塌;若 BR-L2-017 的方向性成立,
    单调性只加了"不会回摆"的形状约束。

    故本条的实际 novel delta = 物理可行性塌缩机制,缩小到一个机制的定性断言。discriminant
    把载重平分给①②③(单调+物理+空格),但三者的实证分量严重不均。

    两穴合击:本条核心方向(稀缺→平等退潮)【方向正确且在 BR-L2-017 已立】;物理机制
    【方向也对但未坐实为可检操作】;空格【部分定义性、实证风头不足】。这【不】等于推论
    作废——物理可行性塌缩机制是 BR-L2-017 真正未覆盖的结构归因,值得保留和强化。但招牌
    需要从"三层新意"诚实收窄为"一层核心新意(物理机制)+两层辅助精化",且空格必须去
    定义性。

    对比已知死因:DED-004 是砖内已燃尽无余量(被判 rejected——经验检验推翻了唯一非平凡
    内核);DED-007 是测量轴焊死(不可证伪循环)。本条【不同于】二者:物理机制层是真实
    新增、非砖内燃尽;测量轴设计方向正交(稀缺按人均资源/生存线 vs 分配标准按行为+理由+
    反应,不共享指标);三条证伪路径(a)(b)(c)均各自可测。故判 needs_revision,非 rejected。

  red_flag_findings:
    brick_conclusion: |
      【命中——required 来源之一】。BR-L2-017 statement 原文:"当资源性质从'共享品'变为
      '稀缺激励品'时,分配标准随之位移——平等退缩、绩效权重上升。"这明确给出了"稀缺度变化
      →分配标准方向性位移(平等↓,贡献↑)"的主张——不是作者 discriminant 里简化表述的"只说
      存在语境切换"。

      逐字对照:
      - BR-L2-017: "资源从共享品→稀缺激励品" = 稀缺度变化
      - BR-L2-017: "分配标准随之位移——平等退缩、绩效权重上升" = 方向性位移(平等↓,贡献↑)
      - DED-013: "稀缺度→分配标准从平等到贡献/需要位移" = 同一方向和前件

      两者核心方向性主张【高度重叠】。BR-L2-017 的 falsifiability(b) 甚至是"资源性质改变
      (共享品→激励品)零影响成员自陈的公平分配偏好"——即BR-L2-017 自身已把"稀缺改变是否
      驱动分配标准改变"作为可证伪的经验主张。本条不能声称"BR-L2-017 只给了存在性、没给方向"。

      本条真正的新增量只有物理可行性塌缩机制(BR-L2-017 扎根认知心理、本条扎根物理约束)。
      空格 (iii) 被我方判为部分定义性(见 nontriviality_cell_check),不能单独扛非平凡。
      单调性是对 BR-L2-017 已有方向的形状精化,无独立证伪路径。

      据此判 required——非 rejected(物理机制确实是新增结构归因、BR-L2-017 未覆盖),但
      本条必须诚实收窄 novelty 宣称:从"载重全在①②③"改为"物理可行性塌缩机制是唯一
      核心新增量,单调性与空格是辅助精化/边界厘清"。当前 discriminant 将三个载重等量
      齐观的写法会误导读者以为本条 triple-novel,实际只有 single-novel。

      【防误判】对比 DED-004(底层砖=信任-信息外化、反例打穿后只剩空壳→rejected):
      本条物理机制是不可能被 BR-L2-017 吸收的真增量,即使收窄 novelty 宣称也不会变空壳
      → needs_revision,非 rejected。

    nontriviality_cell_check: |
      【命中——required 来源之二】。空格"(极端稀缺<生存线+平等+无外部强制)=空"的核心
      论证是"物理可行性塌缩:人均资源<生存线→平等分=全员不足存活→群体不可持续→平等标准
      物理不可执行"。但这串推理有一个定义性环节:

      "生存线"被定义为"维持群体成员基本存续所需的每人最低资源量"。如果人均资源<生存线,
      且实施平等分配,则每人分得的量 = 人均资源 < 生存线。这意味着【所有人都不够存活】。
      群体按定义走向灭绝→"长期维持平等分配标准"在逻辑上不可能(群体已不存在)→空格之
      "空"至少部分由生存线的定义本身保障,而非完全由经验发现填充。

      这不是说空格推导错了——恰恰相反,它是因定义而【太对了】。问题是:把一道定义性/算术
      必然性包装成一项"冒险的经验预测",会夸大推论的实际可证伪性。真正的经验风险在预测(i)
      和(ii)——规范是否在到达生存线【之前】就已经系统地偏离平等;而非存活线以下的那格
      是否为空(那格几乎按构造为空)。

      验证:将生存线定义改写为更宽松但可操作的定义(如"营养不良阈值"而非"灭绝阈值"),
      空格就可能非空——有些群体在长期营养不良下仍维持平等分配理想(尽管实际分配可能被迫
      不均)。这说明空格的"空"依赖于生存线定义的严格程度,而非纯经验事实。

      修法二选一:(A)将(iii)从"核心非平凡支柱"降级为"机制的自然边界厘清/极端情况的
      定义性注解",不把它当独立经验风险增量来卖;(B)将(iii)重述为一条真正有牙的预测——
      例如"当人均资源跌至生存线以下时,平等分配规范在群体灭绝【之前】即已退潮(表现为
      自陈公平理由从平等到贡献/需要的转换)",并把证伪条件钉为"找到一个人均资源低于
      生存线但仍以平等为主要自陈公平理由的群体(无需该群体长期存续——只要规范在位时
      的观测即可)"。

      当前自述把(iii)列为与(i)(ii)同级的独立预测并作为非平凡支撑,但(iii)的实证风头
      不足 ⇒ required。

    measurement_orthogonality: |
      【基本不重蹈 DED-007(should 残留)】。承重对:scarcity_level(人均资源/生存线,
      由人均卡路里可得性/资源存量-人口比/环境承载力等生态指标测)vs allocation_norm_type
      (实际分配行为+自陈理由+违规反应)。两轴来源异质(生态/考古 vs 行为/语言)、不共用
      指标、anti-talisman_clause 双向禁反推——整体方向对。

      残留 should 级软点:(1)allocation_norm_type 测量组件(a)"实际分配行为的统计模式"
      ——在极端稀缺下,观察到非均等分配行为,可能因为【物理上无法均分】(量不够每人一份)
      而非规范已切换。行为数据在此格自带物理可行性信号,与被预测的"规范"有渠道耦合。
      组件的(b)自陈理由+(c)违规反应能部分解耦,但若三源合一按主导判,行为权重可能污染
      主导判定。宜在极端稀缺格显式降行为组件权重、抬(b)(c)权重——或用(b)(c)做主导、
      (a)做辅助校验。

      (2)"稀缺度须由结构指标独立测得"在 measurement 段写得正确,但 real_world_anchors
      两个锚的 independent_scarcity_evidence 段均自陈精度不足(!Kung"精度中等,民族志
      记录非量化连续变量";饥荒"稀缺度测度粗糙偏定性描述,独立精度不足")。故目前无任何
      锚【真正做到】作者宣称的"至少一个锚真正独立测出稀缺度(不得嘴上说独立实际靠行为反推)"。
      这落在 anti_talisman_cashed 判,但若定量兑现做不到,测量正交的实操防线就软了一档。

      以上均为 should,主轴不焊死(DED-007 未复发)。

    scope_hook_independent_of_result: |
      【部分命中(should)】。excluded_outcomes:(1)纯个体偏好→按"是否存在违反即制裁的
      共享期待"事前判——方向对,学到 DED-005 的事前渠道划法。(3)交换/贸易场景→归
      DED-005/006/007 射程——干净。

      但 (2)"分配规范变化源于非稀缺因素(文化传播/意识形态/制度变革)"存在中度的
      "事后开脱"风险。声称"按是否由本地资源稀缺度的独立变动驱动"事前判,但实际操作中:
      若遇一个稀缺度上升而平等规范未退潮的群体,作者可主张"该规范的维持是由意识形态/
      宗教外生固化的,并非由本地稀缺度驱动(故排除)"——但"意识形态固化"与"本地稀缺
      驱动"的判定边界在经验上模糊。一个应对稀缺而生的平等规范,久而久之可能内化为
      意识形态——此时它到底是"由稀缺驱动"还是"由意识形态驱动"?若遇反例就归入后者,
      则 (2) 成了活门。

      修法:把 (2) 的排除判据钉得更事前——例如"若群体在稀缺度变化【之前】已存在
      该分配规范且由独立文化史证据(非由分配行为反推)表明该规范源自文化传播/意识形态,
      则排除"。重点是使排除判定独立于"规范在稀缺下是否退潮"这一结果。

      记 should(不判 required——因 (a)(b)(c) 三条证伪路径仍独立可检,排除口活门
      不过度威胁核心可证伪性)。

    criterion_tier_match: |
      【命中(should)】。核心主张是"稀缺度(连续驱动量)→分配标准单调位移",但被预测
      量 allocation_norm_type 是三型(平等/贡献/需要)的【分类变量】。连续驱动量→分类
      结果量的单调性检验存在"粒度不匹配"问题:

      设想一个群体:充裕时 90% 资源平等分配+10% 按贡献;中度稀缺时 55% 平等+45% 贡献
      (主导仍为平等);高度稀缺时 45% 平等+55% 贡献(主导变为贡献)。从"主导平等"到
      "主导贡献"的切换只在一个阈值发生——连续的稀缺度变化在分类器眼里是阶跃而非单调
      渐变。这人为制造了"单调"的外观(一旦跨过主导阈值就等于切换),而真正的连续驱动力
      可能被"主导"分类器的离散化所掩盖。

      修法:要么将 allocation_norm_type 操作化为连续量(如"平等分配占全部可竞争资源
      的比例"或"成员自陈援引平等标准的频次/权重"),使单调性可被连续检验;要么诚实
      降级单调性主张为"在由充裕到稀缺的方向上,平等作为主导标准的概率单调递减"并
      在 limitations 承认分类粒度的局限。

      记 should(不是 required——方向性趋势仍可被有序分类数据支持,但"单调"这个词
      对分类结果变量来说过强)。

    anti_talisman_cashed: |
      【部分兑现(should→近 required 边界)】。anti_talisman_clause 本身写得扎实:
      双向禁反推、明文禁"遇反例就事后下调稀缺度"、要求"至少一个锚真正独立测出驱动量"。
      防线在位。

      但实际兑现情况:real_world_anchors 两个锚的 independent_scarcity_evidence 段
      均【自陈精度不足】——!Kung"精度中等、民族志记录非量化连续变量"、饥荒"独立精度不足、
      诚实降级到中等"。这意味着作者的"至少一个锚真正独立测出"还停留在纸面设计,未有
      任何锚拿出"经考古/生态独立数据定量测得的稀缺度与独立行为数据测得的分配标准作
      对照"的实证演示。

      这本身未必致命——推论在 candidate 阶段允许"机制设计到位、实证锚待加强"。但若
      作者继续把"至少一个锚兑现"写成已满足,实际却未兑现,则 anti-talisman 有"嘴上
      说了但脚没落地"的缝。宜诚实标注"锚的独立定量兑现待补充"而非暗示已完成。

      记 should(若后续 round 仍未兑现→可升 required——因空有 anti-talisman 机制设计
      但锚端不做,等于是架了防线却不驻兵)。

    anchor_fact_check: |
      【命中(should)——Ik 锚基于受争议民族志】。real_world_anchors 第二锚"饥荒期的
      平等规范塌缩"援引 Turnbull 的 Ik 族作为核心证据("Turnbull 的 Ik 族(乌干达)在
      山地饥馑中,传统平等分享规范完全解体、原子化为个体求生")。

      Turnbull 的《The Mountain People》(1972)在人类学内部长期受争议:
      - Bernd Heine (1985,"The Mountain People: Some Notes on the Ik of North-Eastern
        Uganda") 提供反证,认为 Turnbull 夸大了规范崩溃程度,指出了 Turnbull 方法论
        缺陷(短期田野、语言障碍、选择性报告)
      - 后续研究者(如 Laughlin 等)发现 Ik 在 Turnbull 描述时期仍保留了重要的合作
        与共享行为
      - Turnbull 本人的政策建议(强制解散 Ik 社会)饱受伦理批评,部分学者认为其
        描述受此立场驱动

      这【不】等于 Ik 完全没有规范位移——饥荒对规范的冲击方向大致没错。但把 Turnbull
      的 Ik 描述为"野外独立观测"且未披露学界争议,使锚的可靠性打了折扣。饥荒→规范
      塌缩的跨文化模式有其它更稳健的证据(Sen 的 entitlement 框架、曹树基中国灾荒史),
      但 Sen 论证的恰恰是饥荒往往源于 entitlement failure(分配制度问题)而非绝对食物
      短缺——这与 DED-013 的"物理资源稀缺→规范位移"的因果箭头有方向性张力(Sen 的
      框架里分配制度的失败是饥荒的【原因】而非后果)。

      修法:诚实标注 Turnbull/Ik 争议,将锚的重心移至争议较少的灾荒人类学跨文化综合
      (Dirks、Shipton 等的饥荒人类学研究),并且厘清 Sen 的 entitlement 框架与本条
      物理驱动机制的兼容/紧张关系(entitlement failure 指向分配制度→饥荒;本条指向
      稀缺→分配制度位移——二者方向相逆却都被作者援引为支持,需解释)。

      记 should。

    definition_vs_prediction: |
      【部分命中(与 nontriviality_cell_check 同源,不应单独累积为独立 required)】。
      空格 (iii) 的"空"至少部分由"生存线"定义保障(见 nontriviality_cell_check),使
      该格更像是"边界厘清/定义性注解"而非"冒险的经验预测"。但预测 (i) 和 (ii) 是
      真正可证伪的经验主张——(i)可被"生存线以下群体中平等标准频次非趋零"证伪,
      (ii)可被"稀缺度与分配标准间无系统关联或反向关联"证伪。falsifiability(a)(b)(c)
      三条路径技术上均可检。

      核心风险:若将 (iii) 的定义性成分隐藏,推论在表面上显得比实际更"敢于押注";
      读者以为这是 triple-risk,实际是 double-risk+definitional-note。这不使推论不可
      证伪(仍有两条真正的经验押注),但使 novelty 宣称注水。

      修法与 nontriviality_cell_check 同——诚实化 (iii) 的定位。不计为独立 required。

    enumeration_and_species: |
      【命中(should)——遗漏程序公平作为第四类分配标准】。DED-013 将分配公平标准划为
      三型:平等(每人一样)、贡献(多劳多得)、需要(最缺先给),认为稀缺度位移的目的
      地是贡献或需要。

      但存在第四种分配标准——程序公平/随机公平(procedural fairness):"每人【机会】
      一样,由无偏程序(抽签/轮换/排队)决定分配"。这在稀缺资源分配中广泛出现:
      - 军事征兵抽签(越南战争征兵 lottery)——稀缺且危险的名额,不按贡献也不按需要,
        用随机抽签
      - 海上救生惯例——救生艇上有限食物/水按抽签(而非贡献或需要)分配
      - 器官移植排队——混合医学紧迫性(需要)和排队时间(程序/先到先得)
      - 狩猎采集社会的领地轮换——轮换使用而非按需或按功

      程序公平在逻辑上不同于平等/贡献/需要三元组:平等问"每人拿多少一样"(结果),
      程序公平问"决定谁拿多少的过程是否公正"(过程)。当平等在物理上不可行(稀缺到
      无法均分)而贡献/需要又争议太大(凭什么你贡献大/你更需要),程序公平(lottery)
      常作为"谁都别吵"的逃生口被启用。

      此【不】证伪核心主张(程序公平仍是平等退潮后的去向——符合位移方向),但它扩了
      位移目的地的枚举,且揭示:稀缺不一定只往贡献/需要位移,也可以往程序公平位移。
      这对"物理可行性塌缩→贡献或需要"的机制链有修正意义——物理上平等不可执行后,
      群体未必需选贡献或需要,也可以选"抽签"(此时公平的种从"结果平等"变成"机会平等")。

      修法:在 allocation_norm_type 的枚举中至少承认程序公平(procedural fairness/lottery/
      rotation)作为第四种分配标准或边界型;在位移目的地的论述中将"贡献或需要"修正为
      "贡献/需要/程序公平等非平等标准"。

      记 should(不判 required——程序公平可视为贡献/需要之外的第三去向,但核心方向
      [平等退潮]不受影响)。

    primary_suspect_aim: |
      【指对但未指全(should)】。primary_suspect="是否只是 BR-L2-017 的平凡组合
      而非新归因"——这条【确实是】最致命腿,作者识别准确。secondary_suspect=
      "稀缺度测量独立性(anti-talisman)"——也是真软腿,识别准确。

      但有三条【未被认领的软腿】:
      (a) 空格 (iii) 的定义性成分——若审查者指出"这格按定义为空,不是经验冒险",
        则 nontriviality_test 的第三条腿塌了→非平凡内核只剩两条腿(单调+物理机制),
        其中单调又受 criterion_tier_match 的粒度问题牵制。这【不是】作者自认的
        primary suspect(BR-L2-017 复述风险),而是一条独立于 primary 的软腿。
      (b) allocation_norm_type 的分类粒度与"单调位移"主张不匹配(见 criterion_tier_match)
        ——若审查者指出"你拿三分类型去断言连续单调,粒度差了一档",则核心主张(i)的
        操作化根基动摇。这也不在 primary/secondary suspect 中。
      (c) anti-talisman 锚端未兑现(见 anti_talisman_cashed)——secondary suspect
        指出了测量独立性的风险,但未明确指出当前锚都【未真正做到】定量独立测。作者
        以为防线架好了,但实际上锚端空虚。

      修法:falsification_trace 增列以上三条(至少 a 和 b),与已识别的 primary/secondary
      并列,让读者看到完整的风险面。记 should。

  counterexample_hunt: |
    判 verified 前亲自猎捕,专攻 falsifiability(a):找一个经结构指标独立测定人均资源
    长期低于生存线、主导分配标准为平等型、且该平等无外部强力维持的人类群体。

    猎捕过程(按候选→裁决):
    - 早期基督教修道院/沙漠教父(3-4世纪埃及):自愿极端苦修+财产公有平等。裁决:不净。
      人均资源未达生存线以下(苦修者生存了→按定义人均资源≥生存线),且平等受教规/院长
      强力执行(外部强制)。

    - 禅宗/佛教苦行僧团:托钵+平等分配。裁决:不净。人均资源波动但通常不低于生存线
      (存活即证明);且戒律有强制成分。

    - 胡特尔派(Hutterites)灾年:极端平等共享+集体所有。裁决:不净。(a)即使灾年,社区
      人均资源通常不低于生存线(有储备缓冲);(b)社区规范由强烈宗教制裁执行≈外部强制。

    - 因纽特人/Netsilik 极冬饥馑:裁决:不净。Balikci 民族志显示分享规范在极冬受挤压
      但未完全消失,且出现了按年龄/生存力取舍(infanticide/遗弃老人)的非平等行为——
      实际上位移了(支持本推论)。

    - 捕鲸船 Essex 海难(1820):漂海数月+极端稀缺。裁决:不净。初期维持平等 ration,
      后期转向抽签(lottery)决定谁被杀供食——抽签≠平等(是程序公平,且最终杀了人)。

    - 沙克尔顿 Endurance 探险(1914-1916):极地求生+极端稀缺。裁决:不净。(a)平等由
      沙克尔顿领导强力维持≈外部强制;(b)稀缺度是否真的低于生存线可争议(靠狩猎存活了)。

    - 列宁格勒围城(1941-1944):极端饥馑+配给制。裁决:不净。平等配给由国家和军队
      强制实施=外部强制,属已有 boundary case。

    - 华沙隔都(Warsaw Ghetto)社会互助:极端稀缺下犹太社区自发维持互助/平等分享组织。
      裁决:不净。外部强制存在(Nazi占领),且整体情境是杀戮+奴役,稀缺度与规范的因果
      链被外在暴力淹没。

    猎捕结论:【未净到 scope 内活反例】。这不是因为本推论特别强——而是因为"生存线
    以下+平等自发维持"这一格在定义上就极难被填(人均<生存线→按平等分→群体灭绝→
    无持续群体→无持续规范)。这恰恰印证了 nontriviality_cell_check 的判断:空格之"空"
    至少有部分定义性保障,不是纯经验冒险。

    换靶攻击 falsifiability(b):稀缺度与分配标准无系统关联。这是更可操作的证伪靶——
    找稀缺度上升但平等不退甚至加强的一组案例:
    - 二战英国"Blitz Spirit":轰炸期间资源更稀缺但社区互助/平等分享【加强】。裁决:
      不净(a)稀缺度未达生存线以下;(b)外部敌人存在(战争)增强凝聚力=有外部因素混杂;
      (c)暂态非持续性。
    - 某些灾后互助现象(地震/洪水后社区自发平等分享增加):裁决:不净——灾后互助是
      短期应急反应,非long-term结构性稀缺下的规范位移。

    换靶攻击 displacement 方向性:稀缺增加但平等加强而非弱化。猎到的候选均含外部强制/
    外部威胁/暂态混杂,【无干净的反向案例能干净通过 scope 约束和 anti-talisman 关卡】。

    最终裁决:【净杀=否】。核心方向(稀缺→平等退潮)未被找到干净反例。但猎捕过程揭示:
    空格 (iii) 的"空"更多靠定义性而非经验性——这是由 above 定义性分析揭示的弱点,
    而非由猎到的反例填格。另,程序公平(lottery)作为第四类去向的遗漏在猎捕中被触达
    (Essex 海难用了 lot 而非贡献/需要),记 should。

    verified 硬门第 2 条:【未猎到 scope 内活反例】⇒ 形式上通过。但第 1 条(无 required
    缺陷)未通过(空格定义性 + brick=conclusion 方向重叠)→不判 verified。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未全面复发,但一处活门须关】。anti_talisman_clause 方向对、
    双向禁反推在位、明禁"遇反例事后下调稀缺度"——防线设计好。残留活门:excluded_outcome
    (2)"非稀缺驱动(文化传播/意识形态)的规范变化"——若遇"稀缺上升但平等不退"的反例,
    可被归入"规范由意识形态固化、非由稀缺驱动"而排除,且"意识形态驱动 vs 稀缺驱动"的
    判定边界在当前 operationalization 中不够事前。若此口被滥用,则 (b) 类反例可被系统性
    消化,削弱可证伪性。修法与 scope_hook 一致:把排除判据钉为事前可查的结构事实(规范
    的历史来源可独立于"是否被稀缺退潮"而定)。记 should(不判 required——三条证伪路径
    中 (a) 和 (c) 仍独立于该口)。

    DED-007(测量轴焊死):【未复发】。scarcity_level(生态/考古指标)与 allocation_norm_type
    (行为+理由+反应)异源正交,不共用指标;anti_talisman 禁双向反推;连续量未硬二分。
    should 级残留仅 allocation_norm_type 行为组件在极端稀缺格的物理可行性污染(见
    measurement_orthogonality),不焊死主轴。

  required_fixes:
    - |
      [required-1] 空格 (iii) 去定义性/诚实降级。当前招牌空格"(极端稀缺<生存线+平等+
      无外部强制)=空"至少部分由"生存线"的定义保障(人均<生存线+平等分→全员不足存活
      →群体灭绝→无持续规范)——不是纯经验冒险。二选一修法:(A)将 (iii) 从"三大非平凡
      支柱之一"降级为"机制的边界厘清/极端情形的定义性注解",不再作为独立经验风险增量
      来卖,将非平凡载重前移至 (i) 单调位移+物理机制;(B)将 (iii) 重述为一条【真正有牙】
      的预测——例如"当人均资源跌至生存线以下时,群体成员对平等的自陈援引频率与正当化
      力度在群体灭绝【之前】即已系统性塌缩(表现为自陈公平理由从平等→贡献/需要/程序公平
      的概率跃迁)",并将证伪条件钉为"找到一个人均资源低于生存线但平等仍是成员自陈主导
      公平标准的群体(无需群体存续——截取规范在位时的横截面观测即可)"。无论选哪条,
      falsifiability(a)、nontriviality_test (iii)、以及 statement 的【预测】(iii) 须
      同步修正。
    - |
      [required-2] 诚实收窄 novelty 宣称以反映与 BR-L2-017 的真实 delta。BR-L2-017
      原文已给出"稀缺→平等退潮、贡献上升"的方向性主张——本条不能声称"BR-L2-017 只
      说了存在切换、没说方向"。本条真正的新增量=物理可行性塌缩机制(生存线以下平等
      不可执行——纯结构/非认知归因)。单调性是形状精化、空格 (iii) 按 required-1 降级后
      不再是独立载重。必须在 discriminant_validity 与 nontriviality_test(防平凡化守卫段)
      中将 novelty 宣称从"载重新意全在①②③"改为"核心新意=④(物理可行性塌缩机制)
      ——即把稀缺→平等退潮的归因从 BR-L2-017 的认知心理层(Fiske/Deutsch/Sahlins)
      推进到物理结构层(生存约束)。同步:在 discriminant 段把"生死判"的表述从"是否只是
      BR-L2-017 的低风险改述"修正为"物理机制是否可在经验上与 BR-L2-017 的认知切换
      [区分]开"(而不仅是"是否复述")——因为方向已在砖内,真正的生死判是【机制层】的
      增量而非【方向层】的增量。

  should_fixes:
    - |
      [should] 3型分类→连续量以匹配"单调位移"主张。allocation_norm_type 目前是三型
      分类变量(平等/贡献/需要,按主导判),但核心主张(i)是稀缺度连续变化→分配标准
      【单调位移】。连续驱动→分类结果的单调性存在粒度不匹配:连续稀缺度上升可能只在
