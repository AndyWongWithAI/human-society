      消费,但 (b) 的主张是"指标本身显著>0"(行为存在性),不是用指标解释
      消费,平滑/纯不耐心基准下该指标应为零,预测真实。不判。
    scope_hook_independent_of_result: |
      未命中(通过)。excluded_outcomes 四项均事前渠道判定,未变动;cash-out
      显式留在射程内的反向留口仍在。承诺机制编码的破产法豁口已被 round_1
