      消费收缩)异源测得，是全文件最干净的 anti-talisman 兑现。通过。
    anchor_fact_check: |
      本轮独立抽查增量，复核与承袭结论：
      - 韩国 1999–2003：三政策件(废现金预借上限 1999/刷卡税抵扣 1999/
        发票彩票 2000)属实，跨源核对；信用不良峰值~370 万属实(GDP 增速+2.9%
        与私人消费负增并存属实)；卡债危机本身构成金融部门冲击的诚实标注恰当；
        confidence strong 仅就(a)+步骤1 成立——维持。
      - 美国 2002–2012：Mian-Sufi 县级面板属实(高引经典)；个人储蓄率轨迹
        (2005 ~3%→2010–12 ~7–9%，高于繁荣前夜 ~4–5%)与修订 NIPA 一致；
        危机混杂的诚实标注到位；moderate 恰当——维持。
      - 中国 P2P 2014–2018：余额峰值万亿级(2017)、2018 集中爆雷清退、多
        头借贷监管通报——属实；只承重步骤 1 的窄用法合规——维持。
      - 边界案例组：英澳收入挂钩学生贷(税务代扣+门槛自动暂停)属实；美国 1950s
        分期信贷(收入高增+Regulation W 直接管制分期条款)属实；六国小额信贷
        RCT(Banerjee et al. 2015 温和效应)属实——维持。
      本轮额外核查：(一)Africa fintech 数字信贷(M-Shwari 2012 上线于肯尼亚,
      Tala 2014, Branch 2015)——供给侧事件真实，产品设计(即刻到账/无抵押/
      初期零监管)精准命中理论前件；但目前无家庭面板消费路径数据，仅能注册为
      未来检验场，不作锚收编；(二)Korea 2003 后储蓄率长期下行而非反弹——
      round_1 已裁定(b)是组内梯度主张，总量储蓄率受人口结构(老龄化→退休
      负储蓄)机械驱动，与(b)不矛盾，维持。
      无致命事实错。通过。
