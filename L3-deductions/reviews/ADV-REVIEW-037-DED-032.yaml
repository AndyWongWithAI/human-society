    anti_talisman_cashed: |
      兑现。四条反推禁令方向全对且本轮独立压力测试确认是真约束：
      (1) 现时偏好只认事前 β/合同结构——产品类型代理(卡贷/现金预借的"即刻到账"
      合同特征)事前编码，不由借贷量反推；本轮验证：若某市场仅有抵押分期产品、
      合同不含"即刻可得"特征，即使借贷量暴涨也不得追封 β<1，此禁令有牙齿。
      (2) 外生性只认供给侧政策/牌照/技术文本——澳洲 2003–2015 的方向有利案例
      因无清洁政策事件被挡出支持锚，禁令对称执行，是真闸门。
      (3) 过度借贷需事前标志(再融资链/以贷养贷)，不由违约反推——韩国锚多卡互还
