id: ADV-REVIEW-037
type: adversarial_review
reviews: DED-032
layer: L3-deductions

人话摘要: |
  对 DED-032(消费信贷的自噬循环)的 round_1 独立对抗审查。裁 needs_revision:核心机制
  (现时偏好→过度借贷→债务敞口→预防性储蓄反弹)组合真实、两砖首尾相接的增量成立、
  锚事实核查无致命错、反例猎捕未净杀(北欧1980s信贷自由化崩溃反成支持,Marquette 1978
  与美国1950s被事前注册阈值消化)。但三条 required:(1)招牌预测(b)的注册指标只认流动性
  资产积累,漏了"超出合约计划的提前还款"这一同属超机械核算的通道——指标读零可触发
  rejected 自毁条款而核心主张仍真,文字触发条件与注册指标分叉;(2)承诺机制两型枚举不按
  伞级判据("使还款状态依存")定义——破产减免/法定债务重组是猎到的第三类,anti_talisman(4)
  的监管文本豁口使其可被事后当"隐性承诺机制"启用,须现在注册裁决;(3)"累计净效应可为负"
  的旗舰卖点只注册了激活条件,无累计窗口/统计量/证伪条款,且"可为负"与"强预测"模态不一致。

target: DED-032
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。
  评分卡红旗 11 条逐项攻+反例猎捕(必做)+DED-004(不可证伪循环)/DED-007(测量轴焊死)
  复发检查。裁决三态照评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内
  活反例③未重蹈 DED-004/007。

round_1:
  reviewer: "独立子Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    这是一条学案例学得很到位的候选:三驱动量(供给侧政策文本/事前 β 口径/合同-监管
    文本编码的承诺机制)全部独立于消费结果可测;DTI 阈值连分子分母中位数统计量一次性
    注册;anti_talisman 四条反推禁令封住主要护身符路径;作者自猎 1950s 分期信贷反例并
    按事前口径消化且诚实认账"阈值与承诺编码承担大量解释负荷";韩国 1999 锚三量独立
    测得,是干净锚。判别段对消费平滑/Minsky/债务积压的切割真实——(b) 的"一边按期偿债
    一边额外积累流动性资产"正对着家庭金融文献里的 co-holding 之谜(标准 buffer-stock
    模型下持债同时持现金是被支配策略),确属相邻理论给不出的独有内容。反例猎捕四路
    出击均未净杀(见 counterexample_hunt)。

    但三处 required 缺陷挡住 verified:

    【required-1:招牌预测(b)的注册指标与 statement 主张分叉——超额提前还款通道漏注册,
    自毁条款可在核心主张为真时误触发】
    statement 的核心主张是"压缩幅度超出单纯还本付息的机械核算"。超出机械核算的压缩
    有两条通道:(甲)偿债照合约+额外积累流动性资产(co-holding);(乙)超出合约计划的
    加速还本(主动去杠杆——直接削减步骤 2 制造的敞口,同样是预防逻辑,且 BR-L2-028(c)
    的缓冲形态多样性与本文件自己"未用授信额度是缓冲功能等价物"的措辞都支持其功能
    等价地位;美国 2009–2012 家庭去杠杆中主动还本是一阶现象,非假想)。注册指标
    (precautionary_rebound)只测(甲):"还款不计入流动性资产积累"。若某案例的超机械
    压缩全走(乙),指标读 ≈0,falsifiability(b) 的"超额指标≈0→BR-L2-028 腿被证伪→
    按 rejected 处理"即误触发——理论在核心主张为真时自杀。更糟的是文字触发条件与
    指标不一致:条款(b)写"若高 DTI 家庭【只按合约计划还款】、无超额缓冲重建"——
    加速还本的家庭不满足"只按合约还款",但指标仍读零,届时"按指标毙/按文字救"两可,
    正是红旗 11 的事后口径选择结构。修法(最小):注册两层指标——头名指标=超合约
    压缩总量(流动性资产净积累+超出合约摊还计划的还本,合约计划从信贷登记的应还
    schedule 事前取),用于条款(b)的存亡检验;(甲)co-holding 分量保留为区分 buffer-stock
    /纯不耐心的锐利子预测(判别段卖点所系),但其读零只降格判别力、不触发 rejected。
    两层各自的角色现在注册,不得事后互换。
    【required-2:承诺机制枚举不按伞级判据定义——猎到第三类(事后状态依存减免),
    且 anti_talisman(4) 留了监管文本豁口】
    commitment_mechanism 的伞级定义是"事前限制过度借贷或【使还款状态依存】",注册
    两型:发放端 DSR/LTV 上限、收入挂钩自动还款。主动猎第 N+1 类——猎到:破产减免/
    法定债务重组制度(美国 Chapter 7 清算免责、韩国 2003 危机后的个人 workout 与
    2004–05 信用恢复计划)。按伞级判据它就是状态依存(坏状态下还款终止),只是高摩擦、
    非自动;按两型注册它又不算。这不是学理洁癖:(一)机制上它切的正是步骤 2 的损失
    陡坡——减免越慷慨,'违约=灾难'越不成立,预防反弹应越弱,把慷慨减免辖区(如美国)
    编码为'无承诺'会系统性污染 (iii) 的对照组;(二)anti_talisman(4) 规定事后追加
    "隐性承诺机制"须有"合同或监管文本证据"——破产法在几乎所有辖区都是现成监管文本,
    该豁口使未来任何不利案例都可事后掏出破产法自救,L4-009 同族结构。修法(最小):
    现在(先于任何 (iii) 案例裁决)注册第三类的裁决规则——例如"仅低摩擦、自动触发的
    状态依存(税务代扣/门槛自动免还)计入承诺机制;高摩擦减免(须主动申请+信用排斥+
    资产损失,按破产法文本的摩擦要件事前编码)不计,理由:坏状态损失函数仍陡"——
    或反向纳入并给摩擦分档;同时把 anti_talisman(4) 的文本证据豁口收窄为"仅限注册
    类型清单内的文本证据",废掉万能破产法牌。
    【required-3:"累计净效应可为负"的旗舰卖点无注册证伪口径,模态自相矛盾】
    statement 写"累计净消费效应【可】为负"(存在性弱模态,原则上不可证伪——观测到
    一万个正例也杀不死"可"字);falsifiability 却称其为"负净效应的【强预测】"并只注册了
    激活条件(组中位 DTI>1.0+无承诺),没有注册:累计窗口(从 t0 累到 t+几?)、统计量
    (点估计为负?激活案例中位数为负?)、以及不成立时的处置(伤核心还是只削卖点?)。
    人话摘要拿"甚至可能倒赔"当卖点,证伪条款却对它整体沉默——只有数字(DTI>1.0)
    没有结果侧口径,按红旗 11 直接 required。修法(二选一):(A)升格注册——"激活条件
    满足的案例中,自扩张事件起累计至 t+7 年的净消费处理效应,中位数 ≤ 0;若激活案例
    中位数显著 > 0,该强预测被证伪,推论降格为只含 (a)(b)(c) 的衰减-反弹版本";
    (B)降格——statement 与人话摘要改为机制推论的示意性推断,显式标注"不作为注册
    预测",让 (a)(b)(c) 独立承重。任选,但不得停在"可为负+强预测"的骑墙态。

    三条均可定向修订,循环机制主干、(a)(b)(c) 的骨架与锚组均不动摇,故 needs_revision
    而非 rejected。另有四条 should(不挡门):
    (s1) "繁荣见顶"未注册口径——条款(b)的时钟从"见顶"起算五年,但见顶按什么量的峰值
    (组中位 DTI 峰值年?信贷余额峰值?)未定,事后可挑,建议注册为组中位 DTI 峰值年;
    (s2) 承诺机制的执行判据只有提示没有规则——limitations 说"辅以拒贷率/贴着上限的
    堆积",但纸面上限不执行时翻不翻编码、堆积多少算执行,无决策规则,建议注册
    (如"发放分布在上限处的堆积显著或拒贷率数据可查,方计'在位'");
    (s3) (c) 的辨识纪律应加一句——承诺机制多在信贷崩溃后立法(韩国 DTI 规制在 2003
    之后、宏观审慎浪潮在 2008 之后),'有承诺'辖区系统性携带危机记忆(家庭基线谨慎
    偏高),偏向假阳性确认 (iii);DTI 增幅匹配部分消化此虑,建议再注册同国之内
    受上限覆盖 vs 不覆盖产品类的对照设计为首选;
    (s4) 判别段可再锐一格——注册 β 梯度异质性子预测(同一扩张内,事前 β<1 借款人的
    过度借贷与后续反弹大于 β≈1 借款人),把步骤 1 的贡献与'无偏好偏差的单纯不耐心'
    区分开,现有判别只切了确定性等价平滑,未切'不耐心 buffer-stock'。

  red_flag_findings:
    brick_conclusion: |
      未命中。逐字核对两块 L2 承重砖原文:
      BR-L2-030 statement 只讲双曲贴现/偏好反转/即刻激励权重/承诺机制需求——
      对借贷后的消费动态、储蓄行为完全沉默,无"信贷扩张自制刹车"原文或近义。
      BR-L2-028 statement 只讲"不可保险风险→缓冲储备,敞口与外部承接的比较静态"
      ——敞口被当外生给定(其例示全是冲击侧:收入波动/大病概率/长寿),从未主张
      信贷可及性会内生制造敞口。"同一信贷扩张既踩油门又挖刹车"不在任何砖中。
      两砖均为通用行为命题,非为本推论窄化。一处借用债须点名(不判 required,
      derivation 步骤 2 自己也算讲清了):028 的"风险敞口"原文偏冲击概率/波动侧,
      本推论把它延伸到"同等冲击下损失函数变陡"(后果侧)——机制上可辩护
      (负债放大坏状态损失是标准逻辑),但这是推导步的真实延伸而非砖内现货,
      文件在步骤 5 的边际贡献点名中算是覆盖了。不判。
    nontriviality_cell_check: |
      通过。非平凡格(无承诺+越阈值→超额压缩[衰减+超合约缓冲重建])确实无砖平凡
      强制:030 沉默于 t+3 动态,028 不给内生敞口,AXIOM-001 只给预算地板。
      证伪格(无承诺+越阈值→仅平滑衰减)有真实填充可能且文件显式登记——本轮
      猎捕两度尝试填格(Marquette 1978/北欧自由化),未遂(见 counterexample_hunt)。
      注意:该格的可填性依赖 (b) 指标良定义,required-1 修复前"超额指标≈0"
      有假阳性填格风险(把走加速还本通道的真自噬误判成'仅平滑'),两题同源。
    measurement_orthogonality: |
      主干通过。五轴异源:信贷冲击←政策文本;β←实验范式/合同结构;DTI←信贷
      登记/调查存量;消费←家庭调查 DiD;缓冲←流动性资产流量;承诺←法律文本。
      自变量无一用消费结果或借贷结果反推,anti_talisman 封住反推路径。
      两处近亲检查:(一)DTI、消费率、超额缓冲三者共享分母(可支配收入)——
      崩溃期收入下跌会同时机械抬高 DTI 与消费率,方向【不利于】推论(保守),
      非帮理论的焊点,放行;(二)预测(ii)的条件量 DTI 本身是借贷行为的结果
      (内生于机制),但它是分组/调节变量而非自变量,且测量先于被预测的消费-
      储蓄路径、来源异于结果,属机制内中介的合法用法。不判。
    scope_hook_independent_of_result: |
      未命中(通过)。excluded_outcomes 四项均按事前可测渠道划:贷款用途/产品
      分类(生产性信贷)、借贷与冲击的时序先后(应急平滑)、事前 β 与合同结构
      (时间一致人群/纯抵押摊还,且 cash-out 显式留在射程内——这个反向留口
      加分,防了最方便的事后开脱)、宏观事件(恶性通胀/汇率危机)。产品代理
      混入应急借款人的污染在 limitations 诚实注册。唯一残留钩子风险在承诺
      机制编码的破产法豁口——已升 required-2,此处不重复计。
    criterion_tier_match: |
      通过。DTI 连续量配注册阈值(1.0)+速度判据(+20pp/5yr),阈上阈下预测
      分档(反转 vs 仅衰减)——没有硬二分连续量;衰减比 R 连续;承诺机制二分
      但辅以执行数据提示(执行判据缺规则,记 should-s2,不到 DED-006 档位
      错配的量级——调节方向预测用在位/不在位一档起步可辩护)。不判。
    anti_talisman_cashed: |
      基本兑现,一处豁口升 required。四条反推禁令(过度借贷≠现时偏好证据/
      余额增长≠外生性/违约≠过度借贷/不利证据不得事后加前件)方向全对;
      承重锚真兑现——韩国锚三量独立测得:政策文本(1999 废现金预借上限+
      刷卡税抵扣+发票彩票)先于结果、过度借贷标志(多卡互还)独立记录、
      消费收缩独立于前两者,这是全文件最干净的 anti-talisman 现金。
      豁口:第(4)条允许以"合同或监管文本证据"事后启用隐性承诺机制——
      破产法是全辖区现成的监管文本,配合承诺枚举不含减免类(required-2),
      该条从防护网变成万能后门。修法已并入 required-2(文本证据限于注册
      类型清单)。
    anchor_fact_check: |
      逐锚核查,无致命事实错:
      - 韩国 1999–2003:废除现金预借额度上限(1999)、刷卡所得税抵扣(1999)、
        发票彩票(2000)——属实;信用不良者 2003–04 峰值约 370 万(占经济活动
        人口约 15%,"三百多万"表述准确);LG카드 2003 年末流动性危机——属实;
        2003 年私人消费负增长(约 -0.5%~-1%)而 GDP 正增长(约 +2.9%)——属实。
        锚内诚实标注((b) 未分离)恰当。confidence: strong 就 (a)+步骤1 成立。
      - 美国 2002–2007/2008–2012:Mian & Sufi 县级面板(2002–06 杠杆增幅预测
        2007–09 消费降幅)——属实;个人储蓄率 2005 年约 3%、2010–2012 约
        6.5–9%——与修订后 NIPA 一致,"高于繁荣前夜"成立(2000–01 约 4–5%);
        危机混杂的诚实标注到位,moderate 恰当。
      - 中国 P2P:余额峰值约 1.0–1.3 万亿元(2017)、2018 集中爆雷清退、
        多头借贷监管通报——属实;只承重步骤 1 的窄用法合规。
      - 边界案例:英澳收入挂钩学生贷(税务代扣/门槛暂停)属实;美国 1950s
        分期信贷(收入高增+首付/收入审查惯例,且朝鲜战争期 Regulation W 直接
        管制分期条款——比文件说的"弱形式"还硬)属实,消化用的两个条件确系
        事前注册;六国小额信贷 RCT(温和效应)对应 Banerjee et al. 2015,属实。
      一处结果侧的诚实缺口(非事实错):韩国总量家庭储蓄率 2003 后长期下行
      而非反弹——与 (b) 的表面方向相反;因 (b) 是组内梯度主张(高 vs 低 DTI
      家庭面板)且韩国锚已声明不承重 (b),不构成锚内错,但提醒 (b) 的检验
      离开家庭面板寸步难行,primary_suspect 的测量难声明如实。
    definition_vs_prediction: |
      部分命中(required-3 的家)。三前件是可为假的制度/测量事实,(i)(ii)(iii)
      均为带对照设计的可证伪预测——这部分通过。但"累计净效应【可】为负"
      是存在性模态:任何数量的正例都杀不死"可"字,单独看不可证伪;
      falsifiability 又称其"强预测"却不给结果侧口径与证伪条款——同一主张
      在 statement 里穿不可证伪的衣、在卖点里当强预测用,骑墙。升 required-3
      (升格注册或降格为示意推断,二选一)。
    enumeration_and_species: |
      命中(required-2 的家)。文件对承诺机制做了封闭两型注册(借贷约束型/
      状态依存型,"两型任一存在即计"),该枚举是 (iii) 调节变量的编码规则,
      承重。按红旗 9 用伞级判据本身("事前限制过度借贷或使还款状态依存")
      主动猎第 N+1 类——猎到:事后状态依存减免制度(破产免责/法定债务重组/
      韩国 2004–05 信用恢复计划)。它满足伞级判据的"还款状态依存"半边
      (坏状态下债务终止),却不在两型内(非自动、非收入挂钩代扣、高摩擦)。
      机制上它切步骤 2 的损失陡坡,慷慨减免辖区编码为"无承诺"会污染 (iii)
      对照组;程序上 anti_talisman(4) 的监管文本豁口让它可被事后启用。
      详见 verdict_note required-2。
    primary_suspect_aim: |
      指得准,漏了口径层的三处(即三条 required,但那属工具/注册缺陷而非
      机制软肋,不改变 suspect 排序的正确性)。primary((b) 腿的三渠道归因:
      机械摊还/供给收缩/危机混杂,且自认美国锚泡在混杂里)正是最弱腿——
      本审查的独立分析同意:(b) 测量最难、承重最大,"承重心脏"的自我诊断
      诚实。secondary(外生事件稀缺+产品代理污染)恰当。unlikely(030 步骤)
      有父砖 IEA 支撑,可辩护。
      平凡化检查:上位后是否稀释成"借了要还"或"信贷繁荣有代价"的常识?——
      否。防平凡化守卫段已主动把"借了要还"让渡给会计常识,卖点压在
      (a') 事前 β 预测借贷楔子、(b') co-holding 式超合约缓冲重建、(c') 两型
      承诺分别切两个环节——三条在消费平滑/Minsky/债务积压文献里均无
      现成等价物,(b') 对应的 co-holding 之谜在标准模型里至今是异象。通过。
    caliber_registration: |
      命中(required-1/required-3 的家)。注册做得好的部分:DTI 分子分母
      中位数统计量阈值一次到位;R 的分子分母与 DiD 设计一次到位;超额缓冲
      的双基准一次到位——按红旗 11 的标准,这是同批推论里注册纪律较好的。
      三处缺口:(一)条款(b)的存亡触发绑定在单通道指标上,文字条件("只按
      合约还款")与指标(流动性资产)分叉,超合约提前还本通道漏注册——
      required-1;(二)"累计净效应为负"只有激活条件没有结果侧口径(窗口/
      统计量/处置),required-3;(三)"繁荣见顶"无口径(见顶按什么量的峰值),
      条款(b)的五年时钟从它起算,事后可挑——should-s1。另 s2(执行判据
      缺决策规则)同属本条家族。
  counterexample_hunt: |
    四路主动猎捕,目标覆盖核心(a+b)/阈值条款/承诺调节(c)/判据枚举:

    【猎一:填证伪格——找"无承诺+越阈值(或快速繁荣)+外生扩张,事后仅平滑
    衰减、无超额压缩"的案例】
    候选A:美国 Marquette 判决(1978)——利率上限事实废除,教科书级供给侧
    外生事件;此后 25 年卡债扩张伴随消费长繁荣、储蓄率从 10%(1980)单调降至
    3%(2005),四分之一世纪无反弹。表面是活反例。按注册口径核:卡债借款群体
    的组中位 DTI(含全部债务)直到 2000s 初才越 1.0(2000 年约 0.96,2007 年
    约 1.3);且 80–90 年代增长渐进,不满足"五年 +20pp"的快速繁荣判据——
    阈下只预测衰减不预测反转,而衰减与长繁荣不矛盾(每一波扩张的处理效应
    衰减≠总量消费不增长)。被事前注册的阈值消化,非事后开脱(与 1950s 案例
    用的是同一批注册条件,作者当时已自我设禁"不得再造新豁免")。而当 DTI
    终于在 2000s 越阈时——紧随的正是 2008–2012 的压缩与储蓄反弹。
    候选B:北欧 1984–1990(挪威 1984–85 废信贷配额、瑞典 1985 年 11 月革命
    式放开)——干净的供给侧政策事件,家庭储蓄率繁荣期转负(瑞典 1988–89 约
    -5%),1990–93 暴力反弹至 +8–9%,消费深度收缩。不仅没填证伪格,反而是
    (a)+(b) 方向的强支持;但全部泡在银行危机混杂里(primary_suspect 第 3
    渠道),只能当方向性背景不能当 (b) 的干净证据。净效果:格未被填,
    多了两个可收编的背景锚(收编留作者,不挡门)。
    【猎二:攻(b)的指标——构造"真自噬但指标读零"的通道】
    构造:高 DTI 家庭崩溃后不积累现金,而是把每一分超额流量砸向提前还本
    (金融上更理性:还 20% 年息的卡债优于持 0% 现金)。此时超机械压缩为真、
    自噬为真,但注册指标(流动性资产净积累)≈0,条款(b)的 rejected 触发器
    开火——理论被自己的量尺误杀。现实性核查:美国 2009–2012 家庭去杠杆
    中主动还本是一阶分量(非全靠违约核销),该通道不是假想。这不是 scope 内
    净杀(杀的是量尺不是机制),按评分卡属"揭出别处过度伸张"——升
    required-1。同时确认:文件坚持流动性口径有真实理由(co-holding 才是
    区分 buffer-stock 的锐预测),所以修法是两层注册而非换口径。
    【猎三:攻(c)——找"有承诺机制但同等强度自噬"或编码两可的案例】
    候选A:巴西 consignado(工资代扣贷,2004 起)——发放端 30% 收入上限+
    工资自动代扣,按两型注册是"有承诺"双重在位;2005–2013 信贷繁荣后
    2014–16 消费深收缩。表面攻穿 (iii)?核:收缩期与大宗商品崩溃+政治危机+
    深度衰退同期(失业冲击控制条款接得住),且失业即断薪、代扣自动终止,
    敞口结构确实不同——需要可比繁荣配对才能裁,单案例攻不穿。攻不穿但
    留档:consignado 的"代扣随失业自动停"恰好演示状态依存的事实形态,
    支持两型定义的可编码性。
    候选B:编码两可攻击——美国编码"无承诺"(无发放端 DSR 硬上限、无收入
    挂钩还款),但美国同时拥有全球最慷慨的破产免责(Chapter 7,BAPCPA 2005
    才收紧);韩国 2003 后有信用恢复计划。若减免算状态依存,美国锚的
    "无承诺"编码翻盘,(iii) 的对照组液化;若不算,须现在给出摩擦判据,
    否则 anti_talisman(4) 的监管文本豁口留着事后翻牌的门。此路猎到的
    是编码规则的第 N+1 类缺口——升 required-2。
    【猎四:攻负净效应强预测——找激活条件满足且累计净效应为正的案例】
    尝试执行时发现无法开检:累计窗口未注册(累到 t+5 还是 t+10?)、统计量
    未注册(点估计?激活案例中位数?)。一个不可执行的"强预测"不是可证伪
    主张——此路猎到的不是反例而是空注册,升 required-3。附带核:目前锚组
    内激活条件(组中位 DTI>1.0+无承诺+快速繁荣)满足的只有美国 2000s
    (韩国卡债人群 DTI 组中位无干净数据),单案例正负都不构成检验,
    该预测现阶段本来就只能靠注册纪律撑住——所以注册缺口才更致命。

    总结:四路均未净杀。猎一反哺两个背景支持并确认阈值消化的一致性;
    猎二揭出 (b) 量尺的通道缺口(required-1);猎三揭出承诺枚举的第三类
    与 anti-talisman 豁口(required-2);猎四揭出空注册(required-3)。
    scope 内无活反例,但 verified 第一条门(无 required 缺陷)未过。
  non_recurrence: |
    DED-004(不可证伪循环)复发检查——基本通过,一处待修:主体结构无循环
    (β/政策事件/承诺编码均独立于消费结果,反推禁令齐备);唯"累计净效应
    【可】为负"的存在性模态是局部的不可证伪残留(不是循环,是空模态),
    required-3 修复即除。
    DED-007(测量轴焊死)复发检查——通过:五轴异源,无自变量偷用结果测;
    共享分母(可支配收入)的机械联动方向不利于推论,属保守偏差非焊点;
    (b) 指标与机械摊还的正交化(还款记零)设计正确,问题只在通道覆盖不全
    (required-1),不是焊死。第三条门通过;第一条门(无 required)未过
    → needs_revision。
  required_fixes:
    - "R1 两层注册条款(b)指标:头名指标=超合约压缩总量(流动性资产净积累+超出合约摊还计划的还本,合约 schedule 从信贷登记事前取),承担存亡检验(≈0 才触发 rejected);co-holding 分量(现指标)降为判别性子预测(区分 buffer-stock/纯不耐心),读零只降判别力不触发 rejected;两层角色现在注册不得事后互换;falsifiability(b) 文字条件与指标同步。"
    - "R2 注册承诺机制第三类裁决:事后状态依存减免(破产免责/法定债务重组)按伞级判据属状态依存,须现在裁——建议'仅低摩擦自动触发的状态依存计入承诺机制;高摩擦减免(主动申请+信用排斥+资产损失,按破产法文本要件事前编码)不计,理由:坏状态损失函数仍陡',或纳入并分摩擦档;同时收窄 anti_talisman(4) 为'事后启用隐性承诺机制的文本证据仅限注册类型清单内',废掉万能破产法牌;美国锚的'无承诺'编码按新规则复核留痕。"
    - "R3 负净效应预测二选一:(A)升格注册——累计窗口(如 t0 至 t+7)+统计量(激活案例中位累计净效应≤0)+不成立时的处置(降格为衰减-反弹版本);(B)降格——statement 与人话摘要的'可为负/倒赔'改标'机制示意性推断,非注册预测'。不得保持'可为负(不可证伪)+强预测(无口径)'的骑墙态。"
    - "R4(轻,随手)注册'繁荣见顶'口径(建议=组中位 DTI 峰值年,条款(b)五年时钟从它起算),消除事后挑峰(s1 升格并入,因它直接决定(b)检验窗口)。"
round_2:
  reviewer: "独立子Agent (round 2, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    round_1 的四条 required 修复全部核实到位且质量高——两层注册(头名指标承担存亡
    检验/co-holding 分量降为判别子预测,角色不得互换)、第三类高摩擦减免的事前裁决
    +anti_talisman(4) 收窄至注册类型清单+美国锚复核留痕、(d) 升格注册(t0→t+7 累计
    窗口/激活案例中位数≤0/不成立降格条款)、繁荣见顶=组中位 DTI 峰值年。承重砖
    原文逐字复核(BR-L2-028/030 statement):028 只给"不可保险风险→缓冲储备"的
    比较静态,敞口当外生给定;030 只给双曲贴现/偏好反转/即刻激励权重;"信贷扩张
    自制刹车"的循环闭合不在任何砖中,组合增量真实。本轮反例猎捕四路出击均未净杀,
    且澳大利亚 2003–2015 一路反向猎出全文件最干净的 (b) 支持案例(见
    counterexample_hunt,建议收编)。

    但一处 required 挡住 verified,恰好长在 round_1 修复件自身上:

    【required-1(本轮新洞):头名指标的群体统计量与"负值不计入"的截断层级未注册,
    存亡检验的开火判据存在事后可挑的分叉——L4-009 同族结构】
    precautionary_rebound 注册了头名指标的分子/分母/双基准,但没注册:(一)群体
    统计量——借贷家庭组的【均值还是中位数】?文件里"群体统计量=中位数"只写在
    debt_to_income 块内,不能默认外溢;(二)"超出部分=实际还本-合约计划还本
    (负值不计入)"的截断在哪一层执行——【逐户逐期截断后再聚合】还是【组层面
    净额后截断】?这两处分叉不是学理洁癖,它们直接决定 rejected 触发器能否开火:
    若逐户截断+组均值,则在"纯噪声、无任何预防超调"的零假设下,还本分量的
    期望严格 > 0(E[max(0,噪声)]>0),且高 DTI 组债务存量大、噪声方差大,
    正偏比低 DTI 对照组更大,双基准差分消不干净——头名指标几乎永远读正,
    "≈0 → rejected"的自毁条款近乎死条款,falsifiability(b) 名存实亡;
    若组层面净额截断+中位数,违约(还款<计划)与提前还本互相抵消,触发器
    可正常开火。同一注册文本两种读法,一种救理论一种能杀理论——按红旗 11
    与 L4-009 判例,裁决时刻的口径选择必须现在锁死,否则该闸门不得计为守住。
    附带一并锁:触发条款"头名指标 ≈ 0"未覆盖显著 < 0(家庭净耗竭缓冲)——
    机制上 < 0 比 =0 更打脸,应并入触发。修法一行可达(见 required_fixes),
    机制主干/锚组/四口径骨架全部不动。

    另三条 should(不挡门):
    (s1) 承诺机制枚举建议显式补一条已猎物种的裁决:还款保护保险(PPI/信用
    保险,英国 2000s 与消费贷大规模捆绑销售)——合同文本上使还款状态依存,
    但须主动理赔+拒赔率极高(英国竞争委员会时期数据理赔率约 15%,远低于
    一般保险),按已注册摩擦要件应裁"不计入";现在写死,因为英国 2000s 很可能
    是 (d) 的下一个激活案例,别把这张牌留到裁决日。类型(2) 的"低摩擦、自动
    触发"定义现文本大概率能挡住,但 L4-009 的教训就是"大概率能挡住"要换成
    "已经挡死"。
    (s2·承袭 round_1 未修) 承诺机制执行判据仍只有提示无决策规则(纸面上限
    不执行时翻不翻编码),建议注册"发放分布在上限处堆积显著或拒贷率数据可查,
    方计在位"。
    (s3) falsifiability(d) 的"激活案例稀缺(仅美国 2000s 近似满足)"低估了
    检验基数——英国 2000s(组 DTI 峰值约 1.5–1.6、无发放端 DSR/LTV 上限、
    快速繁荣判据大概率满足)、荷兰(峰值约 2.5+,LTV 上限 2013 年后才引入)、
    丹麦/爱尔兰同族,均 plausibly 激活;这是对理论【有利】的事实修正
    (可检验性比自报的强),同时逼着 s1 的 PPI 裁决先落袋。
    (s4) statement 预测(ii) 的括注仍偏 co-holding 意象("一边按期偿债一边
    额外积累流动性资产"),与两层注册的头名指标(含加速还本通道)有措辞
    残差;falsifiability(b) 已同步,故仅美观问题,建议顺手把(ii) 括注改为
    "额外积累流动性资产或超合约加速还本"。
  red_flag_findings:
    brick_conclusion: |
      未命中。本轮独立复核两块砖 statement 原文(非转述):BR-L2-028 的例示
      清一色冲击侧(收入中断/大病/失能/长寿),敞口外生给定,无一字涉及信贷
