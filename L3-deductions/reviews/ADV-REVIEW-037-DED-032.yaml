    measurement_orthogonality: |
      通过。五轴异源，本轮复核完整：
      - 信贷冲击←供给侧政策/牌照/技术事件文本(独立于消费/借贷结果)
      - β 暴露←跨期选择实验范式/合同结构事前编码(独立于本次借贷量)
      - DTI←信贷登记或家庭调查存量(与消费调查异源)
      - 消费处理效应←家庭调查 DiD(与政策文本异源)
      - 头名指标←信贷登记 schedule vs 实际还本(异源于消费调查)+流动性资产流量
      - 承诺机制←合同/监管文本事前编码(独立于消费/借贷结果)
      共享分母(可支配收入)的机械联动复核：崩溃期收入下跌→分母缩→DTI 机械升+
      消费率机械升→方向【不利于】推论(保守)，非帮理论的焊点。头名指标的分母
