  counterexample_hunt: |
    四路主动猎捕,与 round_1 的四路(Marquette/北欧/巴西 consignado/破产法
    编码攻击)不重叠:

    【猎一:日本后泡沫(1990s–2000s)——找"高负债崩溃后无预防反弹"填证伪格】
    表面弹药:日本家庭储蓄率 1990 年代起单调下行(约 15%→2000s 的 5% 以下),
    泡沫崩溃后二十年【没有】总量储蓄反弹——若成立即填(无承诺+高DTI→仅
    平滑衰减)格。按注册口径核:(一)外生性闸门先挡——1980s 日本家庭信贷
    扩张(住宅金融+消费者金融)无可文档化的消费信贷供给侧政策事件(利率
    自由化主打存款与企业端),anti_talisman(2) 对称适用:不能当支持锚,
    也进不了 (b) 的检验基(处理定义不满足);(二)即便放进来,总量储蓄率
    下行由人口老龄化(退休人口负储蓄占比上升)机械驱动,(b) 是家庭面板的
    组内梯度主张(高 vs 低 DTI 家庭),总量轴对不上——与 round_1 对韩国
    总量储蓄率的裁定同构;(三)通缩使实际债务负担不减反增,方向上更该
    出压缩,而 1990s 日本家庭消费确实长期疲弱。结论:攻不进 scope,
    未净杀;顺带确认 anti_talisman(2) 的对称执行是真闸门。
    【猎二(反向猎出强支持):澳大利亚 2003–2015——想找"激活条件近似满足
    +无崩溃"的活反例,结果猎出 (b) 的最干净案例】
    弹药设想:澳家庭 DTI 全球最高档(2015 约 190%),2008 后无衰退、无银行
    危机、无失业冲击(峰值约 5.9%)、银行未收贷——若高 DTI 家庭消费照旧、
    无缓冲重建,则 (b) 在无混杂环境下读零,净杀。实况反转:家庭储蓄率从
    2003–07 的约 0–2% 跳升至 2009–12 的约 10% 并高位持续;RBA 金融稳定
    报告反复记录 offset/redraw 账户中的超额还款缓冲累积——按当期利率折算
    相当于约 2.5 年计划还款额(2015 前后),这【正是】头名指标(超出合约
    schedule 的还本+流动性等价缓冲)的现成总量测量,且发生在
    primary_suspect 三渠道(机械摊还外的加速还本/无供给收缩/无危机失业)
    全部缺席的环境——比美国锚干净一个量级。为何只算"被消化/反成支持"
    而非直接收编:扩张段外生性弱(2000s 澳繁荣无干净供给侧政策文本,
    禁令(2) 挡住其作为处理案例),只能承重 (b) 的行为存在性(高负债家庭
    确实在无危机时超合约重建缓冲)而非完整因果链。建议作者以"承重 (b)
    行为分量、不承重 (a) 处理效应"的窄用法收编,与中国 P2P 锚的窄用法
    对称。
    【猎三:攻 (c)+(d) 的编码——英国 2000s 的 PPI 牌】
    英国 2000s 是 (d) 的潜在第二激活案例(组 DTI 大概率越 1.0+无发放端
    上限+快速繁荣)。构造攻击:裁决日若累计净效应读正,作者方可掏出
    "PPI 大规模捆绑=合同文本上的状态依存还款=隐性承诺机制→案例不激活"
    自救——检验 anti_talisman(4) 收窄后这张牌还打不打得出。核:类型(2)
    定义含"低摩擦、自动触发"要件,PPI 须主动理赔且实际拒赔率极高
    (理赔率约 15%,后成系统性误售丑闻),按摩擦要件应裁不计入;且 PPI
    不在三型清单的例示中,收窄后的(4) 要求文本证据限于注册类型清单——
    大概率打不出。但"大概率"三个字就是 L4-009 教训本身,记 s1 要求
    写死。此路未猎到活反例,猎到一张该提前作废的牌。
    【猎四:攻头名指标的量尺——构造"假自噬杀不掉"的读法(round_1 猎二的
    对偶)】
    round_1 猎二构造了"真自噬被误杀"(全走加速还本、原指标读零);本轮
    构造对偶:零假设世界里(家庭只按合约还款+还款执行噪声),逐户逐期
    截断("负值不计入")后取组均值,E[max(0,噪声)]>0 使头名指标机械读正,
    高 DTI 组噪声方差更大、正偏更大,双基准差分消不净——证伪格永远
    填不上,存亡检验形同虚设。而组层面净额+中位数的读法下触发器正常。
    两种读法均与现注册文本相容——此路猎到的不是反例而是量尺的第二处
    通道缺口,升 required-1。
    总结:四路均未净杀。猎一被 anti_talisman(2) 对称挡出 scope;猎二反向
    猎出 (b) 的最强现实支持(建议窄用法收编);猎三猎到一张应提前作废的
    编码牌(s1);猎四揭出存亡检验的统计量/截断层级分叉(required-1)。
    scope 内无活反例,但 verified 第一条门(无 required 缺陷)未过。
  non_recurrence: |
    DED-004(不可证伪循环)复发检查——主体通过:三驱动量独立于消费结果,
