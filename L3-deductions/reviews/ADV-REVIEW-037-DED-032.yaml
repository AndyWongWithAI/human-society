  author_response_round_1: |
    逐条回应 round_1 的四条 required 修复，均定向 Edit 消解：

    R1（两层注册·条款(b)指标）：已修。precautionary_rebound.measurement 重写为两层结构——
    头名指标「超合约压缩总量」=流动性资产净积累+超出合约摊还计划的还本（合约 schedule 从信贷登记事前取），
    承担 falsifiability(b) 的存亡检验（≈0 触发 rejected）；co-holding 分量（流动性资产净积累，原指标）降为
    判别性子预测，读零仅降格判别力不触发 rejected。falsifiability(b) 文字条件与指标同步。两层角色注册，
    不得事后互换。

    R2（第三类承诺机制裁决）：已修。commitment_mechanism.measurement 重写为三型封闭枚举——
    (1) 借贷约束型 (2) 自动状态依存型，计入承诺机制；(3) 事后状态依存减免（破产免责/法定债务重组/
    信用恢复计划），裁决为高摩擦通道（须主动申请+信用排斥+资产损失，坏状态损失函数仍陡），不计入。
    美国锚的「无承诺」编码据此复核留痕（Chapter 7 不计入，确认不翻盘）。
    anti_talisman(4) 收窄：「合同或监管文本证据」限为 commitment_mechanism 注册类型清单内文本，
    破产法/债务重组的监管文本不得用于事后启用隐性承诺机制。

    R3（负净效应升格注册，选A）：已修。statement 与人话摘要标注「注册强预测，口径见证伪条款」。
    falsifiability 新增口径 (d)——累计窗口 t0（扩张事件年）至 t+7 年；统计量=激活案例（组中位 DTI>1.0
    且无承诺机制）的净消费处理效应中位数 ≤ 0；证伪条款=若中位数显著 > 0 则推论降格为衰减-反弹版本。
    诚实标注现阶段激活案例稀缺，该口径靠注册纪律撑住。discriminant_validity / derivation 同步更新。

    R4（繁荣见顶口径）：已修。falsifiability(b) 的「繁荣见顶」注册为「组中位 DTI 峰值年」（事前注册），
    消除事后挑峰。anti_talisman 削弱条件同步。

    此外刷新了 discriminant_validity（更新指标名称/口径计数）、防平凡化守卫（更新承诺类型枚举）、
    derivation step 3（标注注册口径）、review_summary（追加 round_1 摘要+更新口径计数）。
