      复核留痕——全注册。
      (d)负净效应口径(升格)：累计窗口(t0→t+7)、统计量(激活案例中位累计
      净消费效应≤0)、证伪条款(显著>0→降格为衰减-反弹版本)——全注册。
      DTI 口径：分子(全部债务存量)/分母(年可支配收入)/群体统计量(中位数)
      ——全注册；阈值(1.0)+速度判据(+20pp/5yr)+"繁荣见顶"(组中位 DTI
      峰值年)——全注册。
      注册纪律在本批候选推论中属上乘——L4-009 判例的核心教训(口径必须在
      反例出现前预注册、禁止裁决日再挑)已落实。通过。
  counterexample_hunt: |
    四路主动猎捕，与 round_1(四路:Marquette/北欧/Brazil consignado/破产法
    编码)和 round_2(四路:日本/澳大利亚/英国 PPI/统计量分叉)不重叠：

    【猎一:攻激活条件的空集——找"无承诺+高 DTI+外生快速繁荣+无危机混杂+
    无自噬"的干净案例】
    弹药逻辑:若存在一个满足全部激活条件且无危机混杂的案例,高 DTI 家庭消费
    照旧、无超额压缩、无储蓄反弹,则(b)被干净地填证伪格。
    候选A:Africa fintech 数字消费信贷(肯尼亚 M-Shwari 2012–, Tala 2014–,
    Branch 2015–, 东非/南亚扩散)。供给侧事件清洁(移动支付基建→数字信贷
    从无到有,非需求拉动),产品设计精准命中"即刻可得"(手机端即时审批/秒到
    账,M-Pesa 生态内即刻可用),初期零监管(无 DSR/LTV 上限、无强制偿付评估),
    多平台借贷(以贷养贷的数字等价物)被 CGAP/FSD 研究报告广泛记录。
    按注册口径核:满足供给事件(清洁)、产品类型代理(即刻可得,β<1 暴露成立)、
    无承诺机制(至少繁荣初期)、快速繁荣(从零到数百万借款人数年)。
    致命缺口——无家庭面板消费-债务-储蓄数据,无法计算头名指标;DTI 组中位
    在非正规收入人群中根本不可测。理论的所有证伪闸门都需要家庭面板,非洲
    fintech 市场目前只有平台管理数据(借贷行为)而缺消费与储蓄路径。结论:不是
    反例,是理论上最干净的 forward-testing 场——若未来有家庭面板,优先检验。
    候选B:Sweden 2017 后(强制摊还要求 amorteringskrav 2016–2017 引入,
    仅限高 LTV 新贷,存量无影响;DTI 高位但无快速攀升——+20pp/5yr 大概率
    不满足;且摊还要求本身就是类型(1)弱形式→承诺在位。消化:速度判据挡+承
    诺在位,scope 外。候选C:Netherlands 2014 后(消费温和复苏,LTV 上限
    2013 引入→承诺在位;DTI 高位但属结构性(数十年积累),不满足快速繁荣判据,
    且 2013 后 LTV 逐年收紧。消化:速度判据挡+承诺在位。候选D:Canada 2018–
    (B-20 guideline 2018 生效,OSFI 强制压力测试→承诺在位;DTI 高位但上升
    平缓。消化:承诺在位)。候选E:Thailand 2010s(家庭债务/GDP 从~55%(2010)
    升至~80%(2015),速度可能不满足+20pp 在 DTI 空间——但债务结构偏抵押+
    生产性,消费用途信贷占比不清;且 2010s 无清洁供给事件,多为需求端低利率
    驱动。消化:外生性闸门挡+用途边界挡)。
    五选全空——两个被事前注册条件挡在 scope 外,一个缺数据,两个承诺在位。
    未猎到净杀。顺带确认:外生性闸门(禁令2)在此路猎捕中对称执行——非洲
    fintech 的干净供给事件让它进门,Sweden/Canada 的监管事件(本身就是承诺
    机制引入而非信贷扩张事件)被挡,禁令逻辑一致。

    【猎二:攻 (c) 编码——构造"有承诺机制但同等强度自噬"的案例(承诺调节
    被伪证)】
    候选A:韩国 2005 后(2005–2006 引入 DTI 规制—类型(1)承诺在位;但
    2005–2008 家庭储蓄率不升反降,卡债危机后消费未现强力反弹)。构造"有承
    诺→循环未减→(c) 被伪证"。核:DTI 规制引入时点恰在危机 recovery 期,
    (c)的检验设计要求"繁荣规模可比(DTI 增幅匹配)的扩张对"——韩国 1999–
    2003(无承诺)与 2005–2008(有承诺)的繁荣规模不可比(后者是危机后的
    recovery,非信贷繁荣),不满足配对条件;且总量储蓄率受人口结构混淆
    (round_1 已裁定)。不构成干净反例。候选B:寻找"双轨制"辖区——同一国家
    内,部分产品受上限管制、部分不受。若不受管制产品的借款人消费路径与受
    管制者无异,则承诺调节被削弱。已知部分辖区有碎片化监管(美国发薪日贷
    州级差异、中国现金贷 2017 前平台差异),但碎片化监管的识别需要借款
    人-产品-辖区的精细匹配面板,现无公开可用数据集。存为检验方向备忘,
    当前无法执行。
    结论:未猎到 (c) 的净杀。韩国 2005 后受制于不可比配对,双轨制辖区缺数据。

    【猎三:攻承诺机制枚举的 N+1 物种——找"被伞级判据覆盖但被封闭清单漏掉
    且不能被现有摩擦要件挡死"的新物种】
    猎到三只新候选:
    (一)家族担保/共同签署(co-signing/guarantor)——在东亚(中国/韩国)、
    南亚(印度)、中东(伊斯兰金融 murabaha 的担保结构)广泛存在,功能上通过
    扩大偿付能力评估池来约束发放,满足伞级判据"事前限制过度借贷"。按注册
    规则核:非 DSR/LTV 公式化硬上限,属非标约束(编码依赖每个合同的担保人
    质量),无法系统编码;且机制更像是将部分信用风险转移给家族网络(保险功能
    而非约束功能)——与类型(1)的"一刀切上限"不等价。现有摩擦要件(非标准
    化、不可公式编码)虽未针对此物种显式注册,但"封闭枚举+非在清单=不计入"
    的设计本身已将其排除——anti_talisman(4) 收窄后无法被事后启用。消化:
    不算承诺,不翻盘任何编码。
    (二)法定冷静期/强制等待期(cooling-off)——UK 2014 FCA 规则(14 天
    撤回权)、EU 消费者信贷指令(2010/48/EU 的撤回权条款)、澳大利亚 NCCP
    的负责任贷款评估中的等待期要求。满足伞级判据?核心机制是削弱"即刻可得"
    的现时偏好激活(BR-L2-030(b)),而非"限制过度借贷"或"使还款状态依存"——
    不覆盖伞级判据的任一支。不构成 N+1。消化:scope 外。
    (三)非追索权抵押法(round_2 已猎,本轮重新独立核)——
    满足"使还款状态依存"(违约后债务消灭即状态依存),无需主动申请(自动)。
    按注册摩擦要件:含信用排斥(foreclosure 毁信用)+资产损失(失去房子),
    坏状态损失函数仍陡;且已裁类型(3)是按摩擦要件定义而非按是否申请/是否
    自动——非追索权虽不满足"须主动申请"这一条,但满足"信用排斥+资产损失"
    两条,综合损失函数陡度不亚于 recourse 州(失去房子在任何法系都是灾难)。
    不翻盘。Mian-Sufi 锚稳健性确认:最大泡沫州(CA/AZ/NV)为非追索权州,
    若非追索权算承诺,美国编码从"无承诺"翻为"有承诺"→(a)(b)的对照组液化。
    现规则守住。(值得注意:这恰好证明了编码规则有实际咬合——不是所有州都
    非追索权,编码差异对应的是法律差异,而非事后挑的叙事)。
    三只新猎均被已注册规则消化,无新 required 洞。

    【猎四:攻 (d) 的统计量与案例选择——若激活案例存在且净效应为正】
    尝试执行:激活条件=组中位 DTI>1.0+无承诺+快速繁荣。
    已知候选:美国 2000s(组中位 DTI 从~0.96→~1.3,+34pp/7yr,无承诺)。
    问题:(d) 要求累计净消费效应(t0→t+7)的中位数≤0。
    t0 取扩张事件年:2002(现金预借/次贷扩张加速)?2004(HELOC 爆发)?
    若 t0=2002,t+7=2009(危机谷底),2009 的消费 DiD 大概率深度负→累计中位
    数容易≤0。但若 t0=2004,t+7=2011(开始 recovery),累计可能更接近零或
    轻微正。t0 的选择按"外生信贷扩张事件年"——美国 2002–2007 繁荣缺乏
    单一清洁事件,更像渐进过程。按操作化:"以政策文件生效时点为事件时点"——
    美国这段繁荣中,最接近"政策事件"的是:1978 Marquette(利率上限事实废除,
    但距繁荣 20+年);1999 GLB Act(金融混业,对消费信贷间接);2005 BAPCPA
    (收紧破产,反而削弱安全网、可能加剧而非缓解自噬)。都难当干净的 t0。
    所以美国锚的 t0 本身有模糊性——这是 secondary_suspect 点名的问题
    (外生性弱),此路猎到的是注册口径在实际案例中的执行模糊性:文件不能
    同时对同一繁荣事后选最有利于(d)的 t0。
    裁决:这不是净杀反例——是操作化的边界模糊,且文件已诚实标注(d)的激活
    案例稀缺+单案例不构成检验。该模糊不影响理论逻辑,只影响经验执行;
    未来的前向检验中,若供给事件清洁(如某国废除 DSR 上限),t0 自然由
    政策生效日锁定。此路未猎到 (d) 的净杀。

    总结:四路均未净杀。猎一发现 Africa fintech 是理想的 forward-testing 场
    但缺数据;猎二因配对不可比/数据不足无法执行;猎三的三只新物种被现有规则
    消化;猎四揭出美国锚 t0 模糊但属已知的 secondary 弱点,不构成反例。
    scope 内无活反例。verified 门二(亲自猎捕无 scope 内活反例)通过。
  non_recurrence: |
    DED-004(不可证伪循环)复发检查——通过。三驱动量(政策文本/β 实验与合同
    结构/法律文本)全部独立于消费结果可测;四条反推禁令+收窄后的(4)封住事后
    追封路径;round_1 的"可为负"空模态已由 (d) 升格消解;round_2 的存亡检验
    分叉(逐户 vs 组层面截断)已锁死为组层面净额后截断+中位数→自毁条款可
    正常开火。本轮额外检查:DTI 的中介变量角色(内生但测量先于结果、来源异于
    结果,属合法机制中介用法)不构成循环。通过。

    DED-007(测量轴焊死)复发检查——通过。五轴异源完整:政策文本/实验 β+
    合同结构/信贷登记+家庭调查/家庭调查 DiD/法律文本。头名指标的双分量
    (还本差额取自信贷登记 schedule vs 实际,流动性资产取自调查)与消费调查
    异源。共享分母(可支配收入)的机械联动方向不利于推论(收入跌→DTI 升+
    消费率升,保守);头名指标分母同理(保守)。无自变量偷用被预测量测。
    通过。

    第三条门(未重蹈 DED-004/007)通过。三条门全过 → verified。
