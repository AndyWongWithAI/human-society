id: ADV-REVIEW-020
type: adversarial_review
reviews: DED-015
layer: L3-deductions

人话摘要: |
  对 DED-015(对等报复演化稳态:在无中心权威+重复交互下,'以眼还眼'不是法律发明而是唯一演化稳定惩罚规范,
  因过度被冲突成本淘汰、不足被剥削+第三方惩罚淘汰,比例性是两条独立机制的【交集】)的第一轮独立对抗审查。
  round_1 裁 needs_revision:核心两条腿(过度被THEOREM-conflict-cost淘汰 + 不足被BR-L2-014第三方惩罚淘汰,
  交集才产出比例性)机制逻辑成立、非单砖复述;测量轴主干正交(punishment_deviation_ratio vs steady_state_outcome
  异源)、anti-talisman 大体兑现、射程/排除钩子按事前结构划、连续量未硬二分、锚无致命事实错、无 DED-004/007
  复发。但我猎到 5 条 should:①"≈1"容差带待标定使核心预测在边界模糊;②现实锚(Nuer/PNG)未展示独立测量,
  承重锚的驱动量实测证据薄(尤不足惩罚淘汰腿——BR-L2-014 从实验室推广到田野的桥接未落地,作者自认 primary_suspect
  但具体锚未补);③lex talionis"互不相关独立涌现"在旧大陆文明间过度伸张(文化传播通道存在);④"零惩罚"(ratio→0)
  与"不足惩罚"(0<ratio<1)可能质异,且混合策略(部分伤害比例惩罚/部分零惩罚)未处理;⑤"黄金中道"平凡化风险未在
  discriminant_validity 中设防。无 required 级缺陷(核心未塌、无净杀反例、不重蹈 DED-004/007),但 should 条目偏多
  ⇒ needs_revision 给作者外科式修补,修完可复为 verified。

target: DED-015
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。评分卡红旗 10 条逐项攻 +
  反例猎捕(判 verified 前必做)+ DED-004(不可证伪循环)/DED-007(测量轴焊死)复发检查。裁决三态照评分卡:
  verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活反例③不重蹈 DED-004/007。

round_1:
  reviewer: "独立子 Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    这是一条【机制逻辑成立、但实证锚与操作化未跟上雄心】的候选。核心论证——比例性是两条独立淘汰机制的交集
    (过度被双边冲突成本淘汰、不足被剥削+第三方惩罚淘汰、任一单砖都给不出"比例是唯一解")——是 genuine 非平凡
    推理,确非 BR-L2-016(报应比例性存在)或 THEOREM-conflict-cost 的复述。author 在 discriminant_validity 与
    nontriviality_test 中的防平凡化守卫(冲突成本只能排除过度不能排除不足;若有人称"一次打服"可稳态,不杀伤
    THEOREM-conflict-cost 但杀伤本推论)是 honest 的暴露面设计,值得肯定。

    但 I 在逐条攻中猎到 5 条 should 级缺陷,虽无一升格为 required,但累积下来已让推论在操作层偏薄:

    ①【should】"≈1"容差带未标定:驱动量 punishment_deviation_ratio 是连续量,核心预测"ratio≈1 者长期收益优"
    依赖"≈1"的操作化定义。author 坦诚"范围本身待经验标定"(limitations),但此不标定使 falsifiability(a)(c)的
    边界判定悬空——若容差带为 ±0.3,则 ratio=1.25 算"比例"还是"过度"?不同容差带会系统性改变哪些案例被归入
    证伪区。这不是 required(推论仍可证伪——找到一个 clearly 过度却跨代稳定的社会即可,不需要精确容差带),
    但使得推论在经验检验中易滑向"事后调容差带消化反例"的 DED-004 式活门。宜暂定一个 provisional 容差带
    (如 ±0.3 或 ±0.5,带上理论动机)并标注为待标定参数,使当前主张明确可测。

    ②【should】现实锚未展示独立测量,承重锚驱动量实测证据薄:real_world_anchors 的 Nuer 血仇赔偿分级 与
    PNG 高地赔偿制度虽合理但未展示 punishment_deviation_ratio 的独立编码(谁评定了"杀人赔X头牛"的伤害严重度
    与惩罚严重度?是否独立于"该社会稳态"的观测?)anti_talisman_clause 在位但其执行在这些锚上是 assumed 而非
    demonstrated。此外 author 自认 primary_suspect 在"不足惩罚淘汰通道"(BR-L2-014 从实验室推广到田野的桥接
    未落地),但在 real_world_anchors 中完全没有锚去支撑"第三方惩罚不足惩罚者"在无国家小规模社会中的跨代淘汰
    力——这是一个实质性空缺:两条腿中这条腿的理论论证最弱、实证证据最薄,却无独立锚撑它。宜补至少一个田野锚
    (如 Boehm 1999 反向支配层级的羞辱/放逐如何淘汰长期容忍违规的个体/群体),或诚实标注此腿"经验证据以实验
    为主、田野证据间接、待田野检验"。

    ③【should】lex talionis"互不相关独立涌现"在旧大陆过度伸张:支撑锚(1)声称美索不达米亚/希伯来/罗马/伊斯兰/
    中国"互不相关的法律传统"独立出现。但希伯来出埃及记(约前 13-12 世纪)晚于汉谟拉比法典(约前 1754 年),学术
    界对巴比伦影响有持续争论;罗马十二铜表法可能受希腊法影响;伊斯兰 qisas 显式继承犹太-基督教传统。这些在旧
    大陆文明圈内存在真实的文化传播通道,称"互不相关"过头。中国"杀人者死伤人者刑"传统相对独立于近东集群,可作
    更干净的独立涌现锚。宜将措辞收窄为"在旧大陆不同文明中(近东/地中海集群 + 东亚集群)分别涌现,虽有近东内部
    传播但中国侧相对独立,整体强烈指示跨文化复现而非单一文化发明"。

    ④【should】"零惩罚"(ratio→0)与"不足惩罚"(0<ratio<1)可能质异,混合策略未处理:derivation step 3 承认
    THEOREM-conflict-cost 不能排除 ratio→0,并将 ratio→0 归入不足惩罚。但"零惩罚"(对某类伤害完全无惩罚反应)
    与"不足惩罚"(有惩罚但不够)在博弈动力学上可能质异:零惩罚是"该伤害不触发惩罚机制",不足惩罚是"触发但力度
    不够"。许多小规模平等社会对特定伤害(如轻微偷窃)采用 gossip/ridicule/avoidance 而非直接惩罚——这类"零
    直接惩罚"在某些文化中跨代稳定。author 可辩称 shame/avoidance 本身就是一种惩罚(社会成本),从而 ratio>0,
    但此时测量框架须明确"惩罚"的操作化边界——是否计入非直接的社会制裁?若不明确,零惩罚/不足惩罚的边界也模糊。
    另:混合策略——某社会对杀人采取比例血仇、对偷窃零惩罚——不在三格中的任一格纯态,应至少在 boundary_cases
    中注明混合策略的处理方式(按伤害类型分别评估比例偏差)。

    ⑤【should】"黄金中道"平凡化风险未设防:discriminant_validity 已针对 THEOREM-conflict-cost 做了防平凡化守卫
    (冲突成本只能排除过度不能排除不足),扎实。但推论的结构——"过度不利、不足不利、适度最优"——与亚里士多德
    的"中道"(golden mean)哲学在结构上高度相似。author 未在 discriminant_validity 中处理这一平凡化挑战:有人
    可辩称 DED-015 只是"凡事适度"在惩罚域的特例,两条淘汰机制不过是给"适度最优"这个古老直觉套上博弈论术语。
    我自身认为这一异议不杀推论——"中道"是 vague heuristic (不指定机制、不给可证伪预测),"两条独立淘汰机制
    交集"是 specific mechanism (可独立攻击每条腿)——但 author 宜在 discriminant_validity 中主动设防,阐明
    specific mechanism 与 vague heuristic 的差别,进一步固推论存在的理由。

    综上:5 条全为 should,无一 required(核心机制逻辑不受损、无事实错致命、无净杀反例、无 DED-004/007 复发)。
    判 needs_revision 非 rejected——推论 bonestructure 扎实,外科式修补即可升级 verified。

  red_flag_findings:
    brick_conclusion: |
      未命中(攻不穿)。BR-L2-016(报应比例性)的核心主张是"人类对'惩罚应与罪行成比例'的期望跨文化普适"——
      记录【比例直觉的存在】,是一个描述性桥接(what:人这么觉得)。DED-015 的核心主张是"比例惩罚是唯一演化
      稳定策略,因两条独立淘汰机制(冲突成本+第三方惩罚)的交集只留下比例性"——解释【为何比例直觉被选中而非
      别的】,是解释性推论(why:博弈逼的)。这不是"原文/近义"关系:桥接记录现象,推论提供机制解释。author 在
      statement 中显式标注与 BR-L2-016 的判别(BR-L2-016 叙述"人这样做",本条解释"为什么选中这个"),判别清晰。
      BR-L2-014(代价第三方惩罚)记录"第三方惩罚存在",不涉及"比例性是唯一解"这一联合主张。BR-L2-005(互惠利他)
      更远——提供负向互惠("以怨报怨"与"以德报德"同构)的桥接,也不含比例唯一性。三块承重砖分别提供了:比例直觉
      的现象(BR-L2-016)、第三方惩罚的机制(BR-L2-014)、负向互惠的同构性(BR-L2-005)——但没有一块单独给出
      "比例性是唯一演化稳定惩罚规范"的联合主张。推论的非平凡内核(两条独立淘汰机制的交集)不在任一块单砖中。
      承重砖非为推论窄化——BR-L2-016 自身跨文化/发展心理学/行为经济三层独立支撑,IEA=1.9,其存在独立于
      DED-015 是否成立。⇒ 不判 required,不判 should。

    nontriviality_cell_check: |
      未命中(攻不穿)。核心的 2×3 逐格判空表(惩罚比例偏差{过度,不足,比例} × 稳态可维持性{可,不可})做出三个
      空格预测:过度→不可维持、不足→不可维持、比例→不可维持(空),唯一非空格=比例→可维持。author 论证此非
      同义反复:(a)空格①②可被现实反例填上(若找到小规模社会长期以过度/不足惩罚为跨代规范且不瓦解,则推论证伪),
      (b)anti-talisman_clause 禁由结果反推前件——不得因"结果升级"就反推"惩罚必过度",也不得因"结果收敛"就反推
      "惩罚必比例"。两条防线均成立。逐格判空的非平凡性在于:THEOREM-conflict-cost 单独只能排除过度(冲突成本大),
      不能排除不足;BR-L2-014 单独只能排除不足(第三方惩罚),不能排除过度——任一块单砖都给不出三个空格,只有
      交集才产出。这是 genuine 的非同义反复结构,不是被砖平凡强制。⇒ 不判 required,不判 should。

    measurement_orthogonality: |
      未重蹈 DED-007(攻不穿,但有 should 级操作化残留)。承重对:punishment_deviation_ratio(惩罚大小/伤害大小,
      由独立编码者评定量表计算比值)vs steady_state_outcome(长期净收益排名+规范稳定性,测量独立于惩罚比例偏差)
      ——概念上异源正交。anti_talisman_clause 明文要求"判定先于且独立于结果",禁止双向反推。这在实验室博弈中
      可严格执行(罚金/剥削金额比值 vs 跨轮累积收益),但在田野锚(Nuer/PNG)中执行困难——"伤害严重度"与"惩罚
      严重度"的编码若依赖文化内知情者判断,而知情者判断本身受比例直觉(BR-L2-016)污染,则测量有内生风险。
      author 在 limitations 中坦诚"'严重度'量化有文化间差异...须用文化内基准校准",诚实但不解决操作化难题。
      【should】宜在 operationalization 中给一个具体的独立编码 protocol example(如:伤害严重度=物理指标组合
      [致死/永久伤残/暂时伤残/无物理伤害] × 资源损失;惩罚严重度=施加成本[死亡/放逐/罚物/公开羞辱/无反应],
      两套量表不共享条目),以示范独立测量如何落地。但这不是焊死——construct 异源、测量方向分离,不同于
      DED-007 的"自变量用被预测量的同一种货币测"。⇒ 不判 required,记 should。

    scope_hook_independent_of_result: |
      未命中(攻不穿)。excluded_outcomes 三项均按【事前结构特征】划,不由结果回填:
      (1)有中心惩罚权威的国家法律体系→按"是否有专门化惩罚执行机构"这一结构特征判,不由惩罚结果判;
      (2)一次性交互(无重复)→按"交互是否重复"结构特征判,不由惩罚效果判;
      (3)力量极端不对称→按"武力比(可忽略报复成本)"结构特征判,不由"过度惩罚是否导致升级"判。
      三项排除口的判别均独立于被预测量(稳态/非稳态),学到 DED-005(射程按事前渠道划)。⇒ 不判 required,不判 should。

    criterion_tier_match: |
      部分命中(should)。驱动量 punishment_deviation_ratio 是连续量,被预测量长期净收益也是连续量(三组跨轮累积
      收益排名),author 将连续驱动量离散为三档(过度/不足/比例),三档由 ratio>1/<1/≈1 划分。这不是 DED-006
      式的"把连续量硬切二分",而是把连续谱标注为三个有理论意义的区段(qualitatively different strategy regions)。
      但"≈1"的容差带未标定(limitations 自述"范围本身待经验标定"),使核心预测在过渡区(ratio 接近 1 但非恰好 1)
      的判决模糊——若容差带为 ±0.3,则 ratio=1.25 的群体预测为"过度→自毁",若容差带为 ±0.5,则该群体预测为
      "比例→稳态"。这不是档位数问题(三档够用),而是【档间边界的操作化缺失】使 falsifiability 在边界区悬浮。
      【should】宜暂定 provisional 容差带(如 ±0.3,附理论动机:人类公平感知的 Weber-Fechner 类阈值),标注为
      "待经验标定参数",使当前核心预测在操作层面可判定。⇒ 不判 required(推论整体可证伪——极端值 clearly 过度的
      案例不需要精确容差带也可判定),记 should。

    anti_talisman_cashed: |
      大体兑现(should 级残留)。anti_talisman_clause 双向禁反推在位:不得因"结果升级"倒推"惩罚必过度",不得因
      "结果收敛"倒推"惩罚必比例";"判定第三方惩罚不足惩罚者是否发生,须独立于'群体是否瓦解'观测"——防线清楚。
      至少一个承重锚真独立测出驱动量:实验室博弈中罚金/剥削金额的比值由博弈规则直接给出(罚金金额、剥削金额均为
      实验设计中的 observable),独立于跨轮收益排名;THEOREM-conflict-cost 的冲突成本由资源消耗量独立测。
      【should】但承重锚的实测证据在核心主张的两条腿上不对称:过度惩罚淘汰腿(THEOREM-conflict-cost)在田野和历史
      中有丰富间接证据(血仇消耗、军备竞赛拖垮),不足惩罚淘汰腿(BR-L2-014)的证据主要是实验室一次性博弈,其在
      真实小规模社会中能否稳定地、跨代地淘汰不足惩罚规范的直接田野证据较薄(author 在 primary_suspect 中自认)。
      两条腿一粗一细,而推论把载重平均分给两条腿(交集论证要求两条腿都立得住),这个不对称宜在 real_world_anchors
      中诚实暴露——补至少一个田野锚支撑不足惩罚淘汰通道,或显式标注此腿"经验证据以实验为主、田野间接"。⇒ 不判
      required(两条腿逻辑上都成立、实验室证据不缺),记 should。

    anchor_fact_check: |
      无 DED-007 式致命事实错(should 级过度伸张)。逐项核对:
      (1) lex talionis 独立涌现:美索不达米亚(汉谟拉比法典✓)、希伯来(出埃及记✓)、罗马(十二铜表法✓)、伊斯兰
      教法(qisas✓)、中国传统(杀人者死伤人者刑✓)——五个传统均确实存在"以眼还眼"原则,无事实错。但"互不相关"
      的独立性宣言过头:希伯来法晚于汉谟拉比、罗马可能受希腊影响、伊斯兰继承犹太-基督教传统,旧大陆文明圈内
      存在真实的文化传播通道。【should】应将措辞收窄——承认近东/地中海集群内可能有传播,但强调(a)中国侧相对
      独立于近东,(b)即使有传播,不同文明选择保留这一原则(而非淘汰它)本身就指示其博弈吸引力,整个模式仍是
      "强跨文化复现"而非"随机文化发明"。
      (2) Nuer 血仇赔偿+PNG 高地赔偿:基本事实正确(Nuer 血仇赔偿分级、PNG 赔偿制度均民族志标准记载)。"无中心
      惩罚权威"的前件适用性:以 Nuer 的"豹皮酋长"(leopard-skin chief)为例——他有调解权威但无强制执行权,属于
      "无中心惩罚权威"的合理例。但【should】宜注明其 mediator 角色的模糊性:豹皮酋长的调解虽无强制力但承载
      规范性权威,界于"零权威"与"弱权威"之间,不影响核心论证但应诚实暴露。
      (3) 荣誉文化反例候选(analysis):author 分析荣誉文化"常在有国家法律的背景下存在"+"荣誉暴力代价极高"+
      "在国家法律渗透后衰退"——分析大体合理,但"跨代稳定存疑"的断言需更谨慎:阿尔巴尼亚卡努(Kanun)在奥斯曼
      统治下(有国家法律存在但渗透弱)持续数世纪,部分地区的血仇传统至 20 世纪末仍活跃——这是一个边界 Case
      而非被干净排除。⇒ anchor 无致命错,记两条 should(独立性过度宣言+荣誉文化分析深度)。

    definition_vs_prediction: |
      未命中(攻不穿)。关键条件:(a)"无中心惩罚权威"=结构定义(是否有专门化惩罚执行机构),(b)"重复交互"=结构
      定义(AXIOM-003 条件)。核心主张"过度/不足惩罚→不可维持、比例惩罚→可维持"=可证伪经验预测(有明确的
      falsifiability 三路径,每个都指定了可观测条件)。条件不加厚到使预测免疫证伪:如果一个无国家社会长期以
      死刑惩罚轻微冒犯且社会不瓦解,则 falsifiability(a)直接命中——条件不能消化它(除非事后声称"死刑对轻微冒犯
      在文化内是比例的",但那是偷换测量而非偷换条件)。author 对"无中心惩罚权威"的判别足够结构-事前化(看是否
      有专门化执行机构),不易被事后滑移。⇒ 不判 required,不判 should。

    enumeration_and_species: |
      部分命中(should)。三策略(过度/不足/比例)按 umbrella criterion(ratio >1 / <1 / ≈1)定义,符合 DED-008
      要求——species 由伞级判据本身定义而非替代表征。猎第 4 类:
      (a) "零惩罚"(ratio=0):author 在 derivation step 3 中提及"THEOREM-conflict-cost...不能排除'永远不惩罚'
      (ratio→0)",将 ratio→0 归入不足惩罚。但零惩罚与不足惩罚(0<ratio<1)可能有质异博弈动力——零惩罚=该伤害
      不触发任何惩罚反应,不足惩罚=触发但力度不够。若零惩罚针对某些伤害类为跨代稳定规范(许多小规模社会对
      特定违规只用 gossip/avoidance 而非直接惩罚),则它是"不足惩罚的不可维持"预测的反例,还是另一个需要
      单独处理的 species?author 可辩称 gossip/avoidance 本身就是社会惩罚(ratio>0),但此时'惩罚'的操作化边界须
      明确。【should】宜在 operationalization 中界定"惩罚"的操作化范围(是否计入非直接社会制裁),并注明 ratio=0
      与 0<ratio<1 是否在推导上有质异需要单独一格。
      (b) 混合策略:群体对杀人比例惩罚、对偷窃零惩罚——同时跨三格。此非第 4 类 orthogonal strategy,而是复合
      策略,可按伤害类型分别评估。宜在 boundary_cases 或 operationalization 中注明混合策略的处理方式。
      综上:未猎到第 4 类 orthogonal strategy(DED-008 式 gap),但 ratio=0 的边缘位置与混合策略的处理是 should
      级操作化缺口。⇒ 不判 required,记 should。

    primary_suspect_aim: |
      指对(但漏了一条弱腿和一条平凡化风险,should)。文件自认 primary_suspect="不足惩罚淘汰通道——BR-L2-014
      的实验证据主要来自一次性实验室博弈,其在真实小规模社会中能否稳定跨代淘汰不足惩罚规范,直接证据较薄。"
      这条指得准:不足惩罚淘汰腿是两条腿中【实证上更弱的】,且是核心"交集论证"的关键一腿——若这腿立不住,
      则"比例是唯一解"降格为"过度不可行,不足和比例均可"(即 THEOREM-conflict-cost 单独给出的弱结论)。
      secondary_suspect="一次打服→过度惩罚可能不耗死"也指对——力量不对称是承压边界。unlikely_suspect=
      "BR-L2-016(报应比例性存在)极少是问题根源"也诚实。
      但 author 漏认:
      (a)【should】"黄金中道"平凡化风险:推论"过度→坏、不足→坏、适度→好"的结构与亚里士多德中道哲学在
      形态上高度相似。虽两条独立淘汰机制的交集比 vague"凡事适度"具体得多,但 discriminant_validity 未设防此
      平凡化读法。宜在 discriminant_validity 主动阐明:中道是 heuristic(不说 mechanism,不给可证伪预测,不解释
      为何"比例"而非"任意区间"是适度),本推论是 specific mechanism(指定两条独立通道、每条可独立攻击、给出
      可证伪预测与边界条件),二者不在一层。
      (b)【should】"伤害严重度"的文化建构风险:punishment_deviation_ratio 的分子(惩罚大小)和分母(伤害大小)的
      严重度评定需文化内基准校准,但若文化内的伤害严重度认知本身受惩罚规范内生影响(一个长期比例惩罚的社会,
      其成员可能系统性将更重的惩罚 percieve 为"对应的伤害其实更重"),则比例性变成了一个协调均衡(shared
      perception)而非独立可测的物理事实。这一风险不杀推论(它不妨碍"比例协调均衡比非比例协调均衡更稳定"的
      主张),但会削弱"比例性是独立于文化认知的博弈吸引子"这一强主张。author 宜在 limitations 或 primary_suspect
      中注明这一内生性风险,与"文化内基准校准"难题衔接。⇒ 不判 required,记两条 should。

  counterexample_hunt: |
    主动构造能证伪核心主张的干净案例,认真查历史/跨文化/民族志实例:

    【猎捕策略】核心主张有三条可独立攻击的证伪路径:(a)找到无国家社会以过度惩罚(ratio 显著>1)为跨代稳定规范;
    (b)找到无国家社会以不足惩罚(ratio 显著<1)为跨代稳定规范;(c)找到无国家社会中成比例惩罚者无长期收益优势。

    - 冰岛自由邦(930-1262)【被消化为支持】:无行政执行权、重复交互、比例赔偿(wergild)为核心的法律体系持续
      约 330 年。比例赔偿分级(杀人/伤人/侮辱各有定价)由仲裁庭(lögrétta)宣判、由原告自行执行——完美满足
      "无中心惩罚权威+比例惩罚+稳态"。支持推论。

    - 索马里习惯法(Xeer)【被消化为支持】:无国家权威、按伤害类型分级赔偿(diya/mag)、跨代稳定(至今数世纪)。
      血仇可用赔偿了结,赔偿金额与伤害成比例。支持推论。

    - 阿尔巴尼亚卡努(Kanun)血仇【最强候选,被部分消化】:卡努规定血仇为"血债血偿"(比例性),但实践中血仇
      常升级为多人死亡、远超比例——作者将其列为 counterexample_candidate 且分析合理(有国家法律背景/代价高/
      在国家渗透后衰退)。但其在奥斯曼统治下(国家法律渗透弱)持续数世纪的事实,对"过度必自毁"形成边界压力。
      author 的消化口集中在(a)非无国家(但有国家但弱)和(b)非跨代稳定(但持续很久)——这两个口 partially 合法,
      但边界摩擦真实。判定:未被净杀(卡努 norm 本身是比例式的,过度是 deviation from norm),但"有弱国家却
      有过度实践跨代存续"应更诚实写入 boundary_cases(非仅荣誉文化 generalization)。

    - 努尔人血仇(Nuer)【被消化为支持】:豹皮酋长调解、比例赔偿分级、无专门执行权威、世代维持。支持推论。

    - 巴布亚新几内亚高地【被消化为支持】:赔偿制度比例性分级、无国家权威。支持推论。

    - 亚诺玛米人(Yanomami)血仇【边界压力但未净杀】:一命还一命的比例复仇常升级为更大规模突袭。但 norm 仍是
      比例的,升级是实践偏差;且群体间反复突袭的高死亡率对群体生存确有消耗(Chagnon 记录),暗示过度惩罚的
      人口代价真实。部分支持。

    - 平等主义狩猎采集社会(昆桑人/姆布蒂人等)【潜在活反例,被测量模糊性消化】:许多平等社会对特定违规
      (如轻微偷窃、傲慢)采用 gossip/ridicule/ostracism 而非直接惩罚,表面 ratio≈0(零惩罚)。但这些社会跨代
      稳定存在数万年——若 ratio≈0 归入"不足惩罚",则 falsifiability(b)被命中。消化口:gossip/ridicule/ostracism
      在紧密小群体中是非常真实的惩罚(声誉毁坏→合作机会丧失→生存风险),其严重度量化为 ratio 可能并不低。
      但此消化口高度依赖"惩罚"的操作化定义——若作者把"社会性惩罚(非直接)"纳入,则"不足惩罚不可维持"的
      主张因测量弹性过大而 risk 空转;若 exclusion,则昆桑人等成了 falsifiability(b)的活反例。【should】
      这恰是 Red Flag 9/operationalization 中"处罚边界"问题的经验表现——不构成净杀(可被合理消化),但暴露
      操作性模糊的代价。

    - 蒙古草原早期部落【边界支持】:部落间血仇可升级至灭族(过度自毁),成吉思汗崛起以超部落权威统一后才
      抑制血仇——支持"无中心权威下过度自毁+有中心权威后稳定"的对比。

    结论:【无净杀反例存在】。猎到的最近反例(阿尔巴尼亚卡努在弱国家下的跨代过度实践、平等狩猎采集社会的
    "零惩罚")均被现有机制或测量模糊性合理消化,不构成 falsifiability(a)(b)(c)的干净命中。推论的核心主张经
    猎捕未被杀伤 ⇒ verified 硬门第 2 条可通过(前提是 should 项修补后,测量边界收紧)。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发,但有一处 should 级窄缝】。推论整体结构可证伪——三个 falsifiability
    条件指定了可观测的、事前可判定的反例形态;anti_talisman_clause 双向禁反推、禁"因升级反推过度"和"因
    收敛反推比例",防了最直白的循环。但有两条窄缝:(a)""≈1"容差带待标定"给了事后调参消化边界反例的余地
    (若反例 ratio=1.3 且稳态,author 可声称容差带 ±0.4 故仍算"比例");(b)"文化内基准校准"未指定 protocol,
    若伤害严重度与惩罚严重度的校准本身受该文化的惩罚规范内生影响,则 ratio 测量可能半循环——一个长期比例
    惩罚的社会,其成员可能将"应该受到的程度"当作"实际严重的程度",使 ratio 自动趋于 1。【should】堵法:
    (a)定 provisional 容差带+预注册;(b)operationalization 加一个独立编码 protocol example 示范如何用物理/
    资源指标(非知情者判断)独立评伤害和惩罚严重度。两条缝窄(≤should),不构成 DED-004 式全面循环。
    DED-007(焊死测量轴):【未复发】。自变量(punishment_deviation_ratio:由伤害与惩罚的严重度比值测)与
    被预测量(steady_state_outcome:长期净收益+规范稳定性,由跨轮收益排名和规范代际传承测)异源正交——
    不共用度量单位、不由同一数据源派生、anti-talisman_clause 禁双向反推。不同于 DED-007 的"通货需求
    用货币量测"的焊死。构念上的分离是真实且干净的。测量执行的田野困难(should 级)不影响主轴正交性。

  required_fixes: []

  should_fixes:
    - |
      [should] 暂定 provisional"≈1"容差带并预注册:为 punishment_deviation_ratio 的"比例"区间指定一个临时
      容差带(如 ±0.3,附理论动机:跨文化公平感知实验中人们容忍约 ±30% 的不公平而不触发惩罚反应,可作为
      operational 起点),标注为"待经验标定参数"。此举:①使当前核心预测在操作层面可判定;②防止事后调参消化
      边界反例(DED-004 窄缝);③与 DED-009 的 θ* 阈值预注册实践对齐。修订位置:operationalization.limitations。
    - |
      [should] 补田野锚撑不足惩罚淘汰通道:real_world_anchors 的两条 supporting 锚均支撑比例性存在(Nuer/PNG
      + lex talionis),未直接支撑"不足惩罚被第三方惩罚+剥削淘汰"的机制腿。宜补至少一个民族志锚:(a)反向支配
      层级(reverse dominance hierarchy,Boehm 1999)中群体成员集体羞辱/放逐/处决"容忍违规"(即不罚/罚不足)
      的个体,以示不足惩罚的淘汰压力在无国家社会中有民族志基础;或 (b)昆桑人(Wiessner 2005)的羞辱仪式如何
      targeting"老被欺负却不吭声"的个体(不足惩罚的受害者也受罚)。若补不到,至少诚实标注此腿"经验证据以实验
      为主、田野间接,待田野检验"。修订位置:real_world_anchors 或 falsification_trace.primary_suspect。
    - |
      [should] 收窄 lex talionis"互不相关独立涌现"的过头措辞:将 real_world_anchors.supporting[0] 中的"互不相关
      的法律传统中独立出现。这不是文化传播"改为"在不同文明的法律传统中分别出现(近东/地中海集群内可能有传播,
      但中国侧相对独立,且即使有传播,多文明共同保留这一原则本身就指示其博弈吸引力而非随机文化发明)"。
      修订位置:real_world_anchors.supporting[0].evidence。
    - |
      [should] 界定"惩罚"的操作化边界并处理 ratio→0 与混合策略:(a)在 operationalization.punishment_deviation_ratio
      的 measurement 中明确定义"惩罚"的操作化范围——是否计入 gossip/ridicule/ostracism/avoidance 等非直接
      社会制裁;(b)在 derivation 或 boundary_cases 中简注 ratio→0(零惩罚)与 0<ratio<1(不足惩罚)的博弈动力
      差异及本推论的处理方式;(c)注明混合策略(对不同伤害类型采用不同惩罚比例)按伤害类型分别评估比例偏差。
    - |
      [should] 在 discriminant_validity 中设防"黄金中道"平凡化:增加一段阐明"过度→坏、不足→坏、适度→好"的
      结构与亚里士多德中道哲学相似,但两种说法不在同一层:中道是 vague heuristic(不给机制、不给可证伪预测、
      不解释为何比例而非任意中间区间),本推论是 specific mechanism(指定两条独立淘汰通道、每条可独立攻击、
      给出可证伪预测与边界条件)——specific mechanism 是一个严格的、暴露面大的命题,heuristic 是永远正确的
      模糊说法。DED-015 的可证伪性正来自其 specificity,而非来自"凡事适度"。

