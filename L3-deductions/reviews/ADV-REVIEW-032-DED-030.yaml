id: ADV-REVIEW-032
type: adversarial_review
reviews: DED-030
layer: L3-deductions

人话摘要: |
  对 DED-030(金的存量-流量不对称与价格弹性)的 round-1 独立对抗审查。裁 needs_revision——
  核心逻辑(S/F极高→供给无弹性→定价权从生产者移向持有者→价格底由持有者保留价格分布尾端决定)
  有 genuine 非平凡理论增量,无 required 级缺陷,反例猎捕未获 scope 内净杀。但六条 should 须在
  修订中处理:(1)预测(ii)"新矿供给冲击被存量缓冲"与 BR-L2-021(f)"任何单一矿脉的发现都不会显著
  改变S"近同义——推论应诚实标注哪些预测是砖已有内容、仅在组合中被引用,而非列入新增独立预测;
  (2)anchor #2(供给侧vs需求侧弹性对比)的 decade 级证据严重 confounded——"产量与价格无单调关系"
  在无 counterfactual 条件下不支持因果推论,应降置信度或重构;(3)最 distinctive 的 discriminant
  预测(金价< AISC 持续 5+年不反弹)自 1971 年以来从未被观测——推论的核心经验主张处于
  untested 状态,应在 statement 显著位置诚实声明;(4)持有者四分类漏覆盖金条/金币持有者(
  ~25-30%年需求),其弹性介于首饰与 ETF 之间——虽不颠覆核心机制但不穷尽;
  (5)S/F 比值 10-30 的过渡区未给预测——2×2 表的两个 bin 之间有 gap,应讨论中间地带的相变行为;
  (6)paper gold/金融化对实物 S/F 约束的结构性 bypass——当前 anti-talisman 仅覆盖异常期(±2σ),
  但金融化在正常期的 bypass 可能更根本性地削弱 S/F 机制的可分离性,应在 primary_suspect 中强化标注。

target: DED-030
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。评分卡红旗 10 条
  逐项攻 + 反例猎捕(判 verified 前必做)+ DED-004(不可证伪循环)/DED-007(测量轴焊死)复发检查。
  裁决三态照评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活反例③不重蹈
  DED-004/007。

round_1:
  reviewer: "独立子 Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    本条有 genuine 理论增量——"S/F极端不对称→定价权从生产者移向持有者→标准边际成本定价在
    金市中失效"的核心逻辑链是 BR-L2-021(THEOREM-value-attribution 的稀缺乘数 S)、
    BR-L2-022(价值储藏独立维度)、BR-L2-023(非货币需求基底)三块砖均不单独给出的合取产物。
    2×2判据表(高S/F×持有者定价)的非平凡格有可证伪经验内容:金价可在 AISC 以下长期运行而
    不必然反弹——标准边际成本定价模型不可给出此预测。

    needs_revision 而非 verified 的原因:六条 should 合并构成足够的'差一口气'——尤其是
    (a)最 distinctive 的 discriminant 预测自 1971 年以来零经验检验——推论的核心经验主张处于
    untested 状态而非 empirically supported proposition;
    (b)预测(ii)与 BR-L2-021(f)近同义,推论对'哪些是砖已有、哪些是合取新出'的边界标注不够诚实;
    (c)paper gold 金融化 bypass 物理 S/F 约束的问题比当前 anti-talisman 的异常检测框架更深——
    若金融化在【正常期】即系统性 bypass 实物约束,则 S/F 机制的可分离性被削弱。

    六条 should 均可通过针对性修订解决——不改核心逻辑、不涉及测量轴焊死、不推翻非平凡核。
    修订后应可升 verified。

    verified 三条门检查:
    ①无 required 级缺陷:10 条红旗逐条攻,均未命中 required(详见 red_flag_findings)。核心逻辑链
      可证伪、测量轴正交、anti-talisman 框架到位。
    ②反例猎捕完成:银价/铂价/Bitcoin S/F 三案例均不构成净杀;银和 Bitcoin 的结果方向与理论一致,
      铂是 boundary case(供给收缩与持有者底混同——落入 excluded_outcome #2 结构)。无 scope 内
      干净必杀反例。
    ③未重蹈 DED-004/007:证伪条件(a)(b)(c)明确可被现实数据攻击;S/F 比与定价 regime 的测量轴保持
      异源正交(WGC+GFMS/USGS vs 价格弹性事件研究);anti-talisman 禁止由价格结果反推持有者行为;
      无 DED-004 式不可证伪循环、无 DED-007 式分母偷用被预测量。

  red_flag_findings:
    brick_conclusion: |
      【未命中——非平凡内核不在任何单块承重砖内,但预测(ii)与 BR-L2-021(f)近同义需诚实标注】

      BR-L2-021(f)供给稳定性维度:
      - 核心陈述:"年新增供应/既有存量之比足够低且稳定,使持有者不会因供给突然泛滥而遭受贬值。
        金的年产量/存量比稳定在 1-2%,且已有存量巨大(约 20 万吨地上黄金)→任何单一矿脉的
        发现都不会显著改变 S。"
      - 此砖已经覆盖:DED-030 预测(ii)"新矿供给冲击被存量缓冲——发现大金矿只影响 1-2%的年流量,
        对总存量微不足道"——与 BR-L2-021(f)"任何单一矿脉的发现都不会显著改变 S"是近同义陈述。
        预测(ii)不是 DED-030 的独立增量——它是 DED-030 引用的一块承重砖本身已确立的事实。

      判别:预测(ii)与 BR-L2-021(f)的重叠关系应诚实标注:
      - BR-L2-021(f)说"大矿不改变 S"(纯事实陈述——S/F 比是物理筛选的第六维)
      - DED-030 预测(ii)说"新矿供给冲击被存量缓冲"(将此事实封装入"定价机制"框架)
      - 实质增量差异:BR-L2-021(f)只说不改变 S,DED-030 预测(ii)将此引申为"供给冲击不影响价格"。
        后者确实给了更强断言(S 不变≠价格不变,因为其他供需因素也变),但 DED-030 的陈述("只影响
        1-2%的年流量,对总存量微不足道")仍停留在"S不变"层面而非"价格不变"层面。

      非平凡内核不在 BR-L2-021:
      - 预测(i)"金价长期底由存量持有者保留价格分布尾端决定——金价可在 AISC 以下长期运行而不必然反弹"
        →完全不在 BR-L2-021 内。BR-L2-021 不讨论定价机制,不讨论 AISC 与价格的关系。
      - 预测(iii)"需求冲击直接推升金价"的物理不可响应性机理→不在 BR-L2-021 内。
      - 持有者异质性分层(首饰/央行/ETF/矿商)及价格支撑分层→不在 BR-L2-021 内。
      - 核心驱动量"S/F 比作为定价机制转换的开关"→BR-L2-021 给了 S/F 比的数据但未将其定义
        为"定价机制转换开关"。

      综合:不判 required——非平凡增量(持有者定价权转移)不在承重砖内。但预测(ii)的增量定位应
      诚实降级:标注此预测为"从 BR-L2-021(f)直接继承并在定价框架中重新定位",而非"推论独立
      新增的预测"(should)。

    nontriviality_cell_check: |
      【通过——非平凡格有可证伪经验内容,非定义循环】

      2×2判据表(S/F比:高>30 vs 低<10 × 定价主导:持有者保留价格 vs 生产者边际成本):
      - 格(低S/F,生产者定价):「平凡格」——谷物(S/F~20-25%)、原油(~3-4%)→边际成本定价,
        标准经济学已完全覆盖。file 如实标注。
      - 格(高S/F,存量持有者定价):「非平凡格」——本推论独有经验主张。此格的关键预测:
        "金价可在 AISC 以下长期运行而不必然反弹"——若是定义性真理,则"AISC 以下"应该与
        "持有者底"同义反复;但前者是矿业成本核算(WGC AISC 方法论独立测量)、后者是持有者
        保留价格分布(不同源测量),两者可分离→非定义循环。
      - 格(高S/F,生产者定价):「如果填充则证伪本推论」——file 诚实标注了证伪方向。

      空格判空细节:
      (a) 空格"金价< AISC + 长期不反弹"可被现实反例攻击:若金价在 AISC 以下且 5+年不反弹,
        需进一步判独立于价格观测持有者抛售行为。此空格的非空性可被经验数据检验。✔
      (b) 无单块砖给出此格预测——BR-L2-021 给 S/F 事实但不讲定价归属;
        THEOREM-value-attribution 给 V=(U+E)×S 但不区分 S/F 极端值的机制分化。
        唯合取二者+持有者分层方填充该格。✔
      (c) BR-L2-021(f)已讲"S/F 极高→供给无弹性"(供给稳定性维度),但供给无弹性≠
        定价权在持有者——前者是物理事实,后者是定价机制主张,中间有推导 gap。
        此 gap 由 DED-030 步骤 3→4 填充。✔

      非平凡性确认通过。不判 required。

      微小注意:S/F 比值 10-30 的中间地带未给预测。file 的 2×2 表用了两个 bin(高>30 vs
      低<10),中间有 gap。当 S/F 在 10-30 的范围(如某些工业金属的 scrap/primary 比可能落在此区间),
      定价机制是持有者主导还是生产者主导?是否存在相变临界点?file 未讨论。建议在
      operationalization 或 limitations 中讨论 S/F 中间地带的预期行为(should)。

    measurement_orthogonality: |
      【通过——测量轴保持异源正交,未重蹈 DED-007】

      自变量 S/F 比:
      - 存量(stock):WGC+GFMS 估算(首饰金、金条金币、央行储备、ETF 持仓)→行业+地质学方法
      - 流量(flow):USGS 矿产年鉴→地质调查方法
      - 两个来源独立:USGS 是政府地质机构,WGC 是行业协会——机构独立。但注意:存量估算常由
        历史累计产量减去 estimated losses 得出,故存量数据间接受历史流量数据约束——非完全独立
        但属同一物理量的不同聚合层次,不影响数量级(50-70 倍)的判定。

      被预测量(定价 regime):
      - 供给侧弹性:取矿难、大矿投产等独立可识别的供给侧事件,测金价响应
      - 需求侧弹性:取央行购金公告、ETF 剧变等独立可识别的需求侧事件,测金价响应
      - 事件识别独立于价格数据:矿难由矿山运营报告判定,央行购金由官方公告判定,ETF 仓位由
        公开日持仓数据判定——均不由金价走势反推。

      隐藏焊点检查:
      - 分母"实际获授者"(DED-007 死因):不适用——本推论无此分母结构
      - 供给侧事件是否由价格走势回溯选出?operationalization 写"取多个独立供给侧事件(矿难、
        大矿投产)"——事件按物理/运营事实识别,非按价格影响筛选。但 file 的 anchor #2 证据
        ("产量+40%期间金价既涨又跌")用 decade 级时间序列而非事件研究——这是证据方法学问题
        非测量轴定义焊死。
      - 定价 regime 测量写"跨多个独立事件的统计比较"——方法论框架正确,但尚未执行(无事件研究
        结果呈现在 file 中)。

      判断:测量轴在概念层面保持异源正交。S/F 比源与价格弹性源来自不同机构/方法。不判 required。
      未重蹈 DED-007。但证据的实际执行(multiple independent event studies)尚未完成,当前锚
      证据只是方向性示意(见 anchor_fact_check)。

    scope_hook_independent_of_result: |
      【通过——两个排除钩子均基于事前可测的结构渠道】

      (1) "金价始终高于 AISC"(标准理论和本理论预言同向——无法区分):此钩子按金价与 AISC 的
      关系结构事前划定——金价>AISC 是一个可直接观测的财务事实,不由推论的成败决定。独立。✔

      (2) "金价低于 AISC 且供给显著收缩(全行业减产>30%)后回升"(归因混同:回升来自供给收缩
      还是持有者不卖?):此钩子按供给收缩幅度事前划定——全行业减产>30%是可独立观测的结构指标
      (矿山运营报告),不由"推论是否成立"决定。但 30%的阈值来源未给出理由——为何是 30%
      而非 20%或 40%?建议注明阈值选取的依据(如"全行业减产 30%对应年产量减少~1000 吨——
      此量级在标准模型中足以解释价格回升")(should)。独立。✔

      两个钩子均按结构渠道立桩、不作事后开脱。不判 required。

    criterion_tier_match: |
      【未命中——档位匹配基本合理,但连续量 S/F 的二分有信息丢失】

      核心自变量 S/F 比是连续量(1→70+),DED-026(——DED-030)用了两个 bin:
      高(>30)和低(<10)。此分档存在两个问题:

      (a) 两个 bin 之间有 gap(10-30):银的 S/F 比约 60-70(在高档),铂的 S/F 比可能落在
      10-20 区间(在 gap 中或近低档边界)。当某商品落在此 gap,本推论的适用性是模糊的——
      没有预测它应该表现为"持有者定价"还是"生产者定价"。此 gap 在 2×2 表的结构上有意义
      (显式标注了低<10 和高>30 是两个状态),但未讨论过渡区的相变行为。

      (b) 被预测量"定价主导机制"本身是连续性的:市场定价从不是 100%由生产者边际成本或 100%
      由持有者保留价格决定——两者是 continuum。不同商品的定价在 continuum 上的位置取决于
      S/F 比及其他因素。DED-030 的二分框架(持有者定价 vs 生产者定价)是将 continuum 压缩为
      二分——作为 first-order approximation 可接受,但应在 limitations 中标注此简化
      (should:讨论 S/F 中间地带的混合定价行为和 continuum 性质)。

      金本身的 S/F~50-70 稳固在高档,所以核心预测不受此影响。不判 required。

    anti_talisman_cashed: |
      【通过——防线文字设计认真,承重锚至少一个真独立测量,但 paper gold bypass 的防绕深度不足】

      anti-talisman_clause 三条防线:
      (a) "判定'持有者未抛售'必须独立于价格结果——使用 WGC 季度回收金统计、央行储备公告、
          ETF 逐日持仓量等独立于价格的观测源"——✔测量源具名,真独立(WGC 回收金统计是物理量,
          非价格衍生量)
      (b) "不得因'价格没崩'倒推'持有者没卖'"——✔明令禁止最关键的循环
      (c) "不得用'金融化/纸黄金干扰了实物市场'消解不利证据——除非独立证明该时期纸黄金交易量
          异常(相对历史均值±2σ)"——✔给出了量化门槛

      承重锚至少一个真独立测量驱动量:
      - anchor #1(1971年后金价与 AISC 持续偏离):金价($/oz)由市场交易独立观测,AISC 由 WGC
        成本方法论独立计算→真独立。✔
      - anchor #3(首饰金低价格弹性):WGC 需求吨位(物理量)独立于价格,2013 年价格-28%且需求
        +23%→观察上反向关联,排除了"因价格涨所以需求涨"的循环。✔

      anti-talisman 文字设计是认真的。不判 required。

      但 paper gold 防绕的深度需强化(primary_suspect 相关问题):
      当前 anti-talisman(c)的"纸黄金"防线仅覆盖"异常期"(±2σ)——即只在 paper gold
      交易量偏离历史均值时允许作为消解理由,正常期内不许用。但问题恰在:若金融化在【正常期】
      就已经系统性地 bypass 了实物 S/F 约束(例如 COMEX 期货未平仓合约常规性地远超可交割
      实物金条),则"正常期"的定价本身就可能已脱离实物 S/F 逻辑——此时不准用"纸黄金干扰"
      作为消解理由,反而保护了一个可能被系统性削弱的核心机制。建议在 primary_suspect 的
      讨论中强化此点:金融化 bypass 可能不是 anomaly 而是 structural feature,anti-talisman
      的±2σ 框架只能防御"拿异常开脱"但无法防御"正常期即系统弱化"这一更深层的挑战(should)。

    anchor_fact_check: |
      【无致命事实错——但 anchor #2 严重 confounded,anchor #1 的 2015 年例证有过度解读风险】

      逐锚核:

      (1) 1971年后金价与 AISC 持续偏离:
      - 陈述:金价从 35$/oz 涨至 2000+$/oz,AISC 在 1200-1400$/oz,金价远高于 AISC→
        边际定价者不是成本敏感的生产者。2015 年金价~1100$/oz(接近 AISC 底部)并未崩盘→
        与"成本是底"不一致。
      - 事实检查:1971 年后金价远高于 AISC 是准确事实。但"金价远高于 AISC→边际定价者
        不是生产者"的推论需要 caution:垄断/寡头定价也可使价格持续高于边际成本,而金矿行业
        非垄断。此推论在竞争性市场假设下 valid,但需显式标注假设(应假设金市为竞争性市场)。
      - 2015 年例证问题:2015年全球金矿加权平均 AISC 约 900-1100$/oz(各来源有差异),金价
        在 2015 年 12 月触及~1050$/oz 的低点后于 2016 年上半年反弹至~1350$/oz。此反弹可被
        诠释为"触及 AISC 底部后的成本支撑"(支持标准理论),也可被诠释为"ETF 需求回升+
        避险情绪"(与本推论一致)。file 将"并未崩盘"作为支持本推论的证据,但反弹本身是
        confounded——标准理论也预测触及成本底后反弹。此例证更适合作 boundary_case 而非
        supporting anchor。
      - 无事实错,但诠释有 selectiveness。建议重标此例为 boundary_case 或在 supporting 中
        显式标注其 confounded 属性(should)。
      - Confidence: strong→建议降为 moderate(2015 例诠释有争议)。

      (2) 供给侧冲击的弱价格弹性 vs 需求侧冲击的高弹性:
      - 陈述:"2010 年代金矿产量从~2500 增至~3500 吨(+40%)期间,金价既从 1100 涨至 1800
        又从 1800 跌回 1100——产量与价格无单调关系。"
      - 事实检查:此证据有三个严重问题:
        (a) 无 counterfactual:十年间实际利率、美元指数、地缘风险、ETF 持仓、央行购金政策
           均同时变化。产量增加+价格波动≠"供给不影响价格"——可能供给增加压低了价格但被
           同期需求冲击推高,净效果为零。简单的"看去无单调关系"无法做因果推论。
        (b) 统计 underpowered:一个时间序列上的"无单调关系"观察(n=1 的 decade 级样本)不构成
           "供给侧弹性低"的证据——需要跨多个独立供给侧事件的统计分析(event study methodology)。
        (c) ETF 冲击对比(2020 ETF+40%→金价+60%;2013 ETF-30%→金价-30%)虽也是简单相关,
           但至少提供了两个独立事件的方向一致的弹性对比。然而 ETF 持仓变化本身就内生
           于金价(ETF 流入既推动金价也被金价吸引)——此相关性在因果上双向。
      - 此 anchor 的当前证据形式无法提供因果弹性估计。它至多是"与理论不矛盾的示意性观察"而非
        "supporting evidence"。建议:要么降格此锚为 illustrative_observation 并置信度降为
        weak,要么替换为真正的 event study 结果(若已存在跨事件统计分析)(should)。
      - 无事实错(数据本身正确),但因果诠释严重 overclaimed。Confidence: moderate→建议降为 weak。

      (3) 首饰金的低价格弹性——跌价时净买而非净卖:
      - 陈述:2013 年金价-28%,全球首饰金需求反从~2200 吨增至~2700 吨(+23%,WGC);回收金仅从
        ~1300 增至~1400 吨,弹性极低。
      - 事实检查:2013年金价暴跌后中国和印度首饰需求确实激增(“抢金潮”),WGC 数据支持方向。
        具体数字:2012 年全球首饰金需求约 1900t,2013 年约 2200t(+15-16%,非+23%),file 的
        "~2200吨增至~2700吨"数字可能不准(WGC Gold Demand Trends 2013 Full Year 报告需核)。
        但方向正确(counter-cyclical buying)。回收金从~1300t 增至~1400t 方向也正确(弹性极低)。
      - 无致命事实错(方向正确,具体数字待核)。但需注意:2013 年中国和印度的"抢金潮"是特定
        文化情境下的现象(中国中秋+国庆黄金周促销、印度婚礼季+卢比贬值后金价以卢比计价并未
        同等下跌),不一定概括全体首饰持有者。建议标注文化情境特异性(should)。
      - Confidence: strong→建议降为 moderate(数字需核,文化特异性未标)。

      综合:三个 anchor 均无致命事实错,但 anchor #2 的因果诠释 overclaimed,anchor #1 的 2015
      例 confounded,anchor #3 的数字准确度待核。推论当前实证基础——核心预测未经验证,支撑锚
      均为方向性示意+confounded 观察——应诚实在 statement 段首显式声明 epistemic status:
      "well-formed, falsifiable hypothesis; distinctive prediction (i) untested; supporting
      anchors are directional/illustrative observations awaiting event-study confirmation."
      不判 required(数据方向正确、非编造),但证据质量整体 weak-to-moderate(should)。

    definition_vs_prediction: |
      【通过——关键条件均为可证伪预测,非定义性真理】

      三预测逐一检查:

      预测(i)"金价长期底由存量持有者保留价格分布尾端决定":此为预测而非定义——标准边际成本
      定价模型预测价格底=生产者的边际成本,而本推论预测价格底=持有者的保留价格尾端。两种
      预测在“AISC 以下是否可长期运行”上有不同可观测结果→可证伪。

      预测(ii)"新矿供给冲击被存量缓冲":此预测的增量主张是“供给冲击不影响金价”而非仅
      “不影响存量”。但 file 的陈述停留在“对总存量微不足道”层面——这是 BR-L2-021(f)已讲
      的内容。要使此预测有独立的可证伪经验内容,应明确:“供给侧事件(新矿投产/矿难)的金价
      弹性在统计上显著低于需求侧事件”→可被事件研究的组间弹性对比检验。当前陈述需强化以
      达可证伪标准(should)。

      预测(iii)"需求冲击直接推升金价——新产量不能快速响应":此为预测——标准模型预测
      供给会响应价格信号而增加(虽然金矿有 lag),但本推论预测因 S/F 极高,供给响应在可预见的
      时间尺度上不可逆→需求冲击的价格效应完全不被供给响应 dampen。此可被 event study 检验:
      比较金与其他商品(铜/原油)在可比需求冲击下的价格响应幅度——若金的响应幅度系统性更大
      (因缺乏供给响应 dampen),支持本推论。

      关键范围条件均可事前判定:
      - "地上可交易黄金总存量"→由 WGC+GFMS 事前估算,不由金价走势反推
      - "年矿产金增量"→由 USGS 矿产年鉴事前统计
      - "AISC"→由 WGC 成本报告独立计算

      不存在 DED-004 式“定义吸收所有反例”的循环。不判 required。

    enumeration_and_species: |
      【未命中 required,但持有者四分类漏覆盖金条/金币持有者】

      DED-030 的持有者异质性分析给出四类:
      (a) 首饰持有者(低弹性,情感/文化黏性)
      (b) 央行(极低弹性,战略储备)
      (c) ETF/投机者(中高弹性,逐利驱动)
      (d) 金矿商(对冲套保,负反馈但占比小)

      主动猎“第 5 类”:

      (e) 金条/金币持有者(retail investment bars & coins):
      - 规模:约占年需求的 25-30%(WGC 数据),存量显著——此为不可忽略的类别
      - 弹性:介于首饰(b)与 ETF(c)之间。物理持有,交易成本高于 ETF 但低于首饰(首饰有
        情感/文化黏性,金条纯投资属性)。在跌价时,金条持有者可能“抄底买入”(类似首饰的
        counter-cyclical 行为,但动机不同:投资驱动而非消费/文化驱动)
      - 此类别不颠覆核心机制——其弹性在首饰与 ETF 之间,插入后弹性排序变为
        a(央行)≈b(首饰)<e(金条/金币)<c(ETF/投机者)≈d(矿商套保)——分层结构仍成立,
        只是多了一层
      - 但此遗漏说明持有者分类未穷尽。建议:将四分类扩展为五分类,或将金条/金币持有者明确
        归入某一类并给理由(如归入“投机者”但因交易成本更高弹性低于 ETF)(should)

      (f) 工业用金持有者(电子/牙科):
      - 规模:~7-8%年需求,存量占比极小
      - 弹性:受工业生产周期驱动而非金价驱动,可忽略或归入“其他”

      未猎到不可消化的第 N+1 类。不判 required。

    primary_suspect_aim: |
      【方向指对但深度不够——paper gold 金融化的 bypass 深度被低估】

      file 自认 primary_suspect:“步骤 3→4:'供给无弹性→定价权转移'。即使 S/F 高,若金融化
      (纸黄金、期货、租赁)使'有效供给'远超实物年产量,定价权未必在实物持有者。”

      此自评方向正确——paper gold 金融化是对 S/F 机制最根本的挑战。但 file 对此挑战的分析
      深度不足:

      (a) 当前 anti-talisman(c)的±2σ 框架仅覆盖“异常期”——即 paper gold 交易量偏离
      历史均值时才可作为消解理由。但真正的问题是:COMEX 期货未平仓合约常规性地(不是异常地)
      远超可交割实物金条(伦敦金库+COMEX 金库总量)。LBMA 日均清算量~$30-50B,对应年化
      ~$10T 的名义交易量,远超年实物产量(~$200B)。此非“异常”而是“结构性特征”。
      若期货市场正常期即创造远超实物存量的 synthetic exposure,则实物 S/F 的定价约束力
      在正常期就被系统性削弱——±2σ 框架帮不上忙(正常期内不准用纸黄金消解)。

      (b) 期货-现货 arbitrage 是制约:理论上,若期货价格偏离现货,arbitrageur 会买卖实物
      金条进行套利→将期货拉回现货。但此 arbitrage 的成本和规模受制于实物金的可得性——
      这里 S/F 机制重新入场。所以 paper gold 并非完全 bypass 实物约束,而是将约束从
      “1-2%年流量”放松至“可借出的实物存量”。但可借出的实物存量(金库中的金条+ETF持有+
      央行可出借储备)仍远大于年产量——所以即使经过 paper gold 放大,定价权仍在存量持有者
      (决定是否出借实物金条的人),不在生产者。这是一个“paper gold 挑战经受住后反而强化推论”
      的路径——file 应走完此论证再判断 primary_suspect 的实际威胁程度。

      (c) 黄金租赁市场:央行将黄金出借给 bullion banks,banks 再在市场上卖出或用于套利→
      这增加了“有效流通供给”。但央行借出黄金不等于卖出——借出者有 recall 权,且收取
      租赁费。这是持有者“出租”而非“出售”——本质上仍是持有者行为,与推论的持有者定价
      框架兼容而非矛盾。

      secondary_suspect 的方向正确(持有者弹性排序可能因金融化或文化变迁逆转),但建议补充:
      加密货币(如 Bitcoin)作为“数字黄金”叙事可能改变新一代持有者的弹性行为——当 Bitcoin
      被定位为“更好的黄金”时,年轻投资者可能将黄金视为“old tech”并降低其 portfolio 中
      黄金的 inelasticity。此尚未发生但应予 watch。

      综合:primary_suspect 方向正确,paper gold 挑战是真实且最深层的威胁。但 file 当前对此
      挑战的分析停留在表面——(a)正常期的结构性 bypass 未被±2σ 框架覆盖;(b)arbitrage
      机制可能将挑战反转为支持但此论证未走完;(c)黄金租赁市场本质仍是持有者行为。建议在
      primary_suspect 段或 derivation 步骤 3 的讨论中,走完 paper gold→arbitrage→实物约束
      重新入场的完整论证,然后诚实评估此挑战在多大程度上削弱核心机制(should)。

  counterexample_hunt: |
    主动构造能证伪核心的最强 falsifiability(a)/(b)/(c)案例,认真搜历史/跨金融资产实例:

    ========== 攻击 1:银(Silver)的 S/F 比与价格行为——非净杀,方向与理论一致 ==========

    目标:falsifiability(a)“金是 S/F 极高→持有者定价”的 uniqueness claim
    案例:银的 S/F 比与金类似——地上银存量估计~1.5-1.7M 吨,年矿产银~25,000 吨,
    S/F~60-70(与金相近)。若 DED-030 的核心机制正确,银也应表现出“持有者定价”特征:
    价可在 AISC 以下运行而不必然反弹。事实:2015-2019 年间银价在$14-17/oz 徘徊,而
    原生银矿 AISC 约$14-16/oz——大量银矿在此期间的 margin 为微利或亏损。银价在
    AISC 附近长期运行但未崩盘。2020 年银价升至$25-30/oz,但驱动因素是 COVID 刺激+
    工业需求复苏+ETF 流入,非供给收缩(产量仅小幅下降)。
    分析:银的表现与 DED-030 预测(i)一致——价格底似乎不由 AISC 物理决定,且持续低于
    AISC 的生产者未通过停产拉动价格回升。银在 AISC 附近运行多年但未“崩盘”也非因“
    成本是底”——若成本是底,价格应紧贴 AISC 而非可长期低于它。但银的案例中存在
    confound:银有大量工业需求(~50%),其定价受工业周期驱动,不完全由投资/持有者逻辑
    主导。且银的 by-product 生产(~30%的银产量来自铜/铅/锌矿的副产品)使供给弹性更加
    复杂——主产品(铜/铅/锌)的价格而非银价决定 by-product 银的供给。
    结论:【非净杀,方向性支持但 confounded】。若未来更干净的 S/F 跨资产分析确认
    S/F 比与“定价脱离 AISC 的程度”正相关,将是强支持。当前单案例(金+银)为 2/2 支持。

    ========== 攻击 2:铂(Platinum)的 S/F 比与供给收缩——boundary case ==========

    目标:falsifiability(a)和(b)的组合——S/F 中等偏低的金属是否也表现出持有者定价?
    案例:铂的年矿产~180t,地上存量~??? (数据稀缺,S/F 估计在 10-20 范围,落在 DED-030
    的 gap 区间)。2015 年铂价跌破 AISC(南非矿工 AISC~$900-1000/oz vs 铂价~$900),
    南非矿企确实减产约 15-20%(Anglo American Platinum 和 Impala Platinum 均宣布减产)。
    铂价随后从 2016 年的~$900 反弹至~$1100。但 2018-2019 再次跌至~$800(再次低于 AISC),
    更多矿山关闭或减产。2020 年后受氢能 economy 预期+供给约束推至~$1200。
    分析:铂的 S/F 比(估 10-20)落入“过渡区”,其行为表现出混合特征:供给收缩确实发生
    (标准理论的响应),但收缩后价格并非立即回升(与本推论一致——供给收缩的 1-2 年 lag
    不足以快速拉升价格,因为存量持有者的行为仍是 dominant)。铂的 case 更似“供给收缩
    与持有者底共同作用”——归因混同,落入 excluded_outcome #2 的结构("全行业减产>30%
    后回升"类似场景)。铂的减产未达 30%(~15-20%),暂且不算严格落入 excluded_outcome,
    但仍是 boundary——若后续铂的 S/F 比数据确认<30,而铂价仍频繁在 AISC 以下运行且
    反弹不完全由供给收缩解释,则 DED-030 的适用范围可从“S/F>30”向下扩展到“S/F>15”。
    结论:【boundary case,非净杀】。S/F 在 gap 区间(10-30)的行为需更多跨资产对比研究。

    ========== 攻击 3:Bitcoin 的 S/F 比与矿工成本底——非净杀,方向性支持 ==========

    目标:falsifiability(a)“非金资产中 S/F 机制是否成立?”——跨资产 generalization 检验
    案例:Bitcoin 存量~19.5M BTC,年发行量~164k BTC(2024 halving 后),S/F~120——
    比金更高。Bitcoin 矿工的 marginal cost 构成“生产成本”(电费+矿机折旧)。实证上,
    Bitcoin 在 bear market 中经常在矿工 marginal cost 附近甚至以下交易(如 2022 年
    BTC~$15-20k,而部分矿工的 breakeven 在$20-25k)。但:(a)矿工并不会全部停产——
    效率高的矿工继续,“供给收缩”表现为全网算力下降而非产量骤停(难度调整机制);
    (b)存量持有者(long-term holders, LTHs)的行为决定底部——Glassnode 数据表明
    bear market 底部常伴随 LTH 持仓集中度上升(经验丰富者“抄底”),与 DED-030 预测(i)
    的“持有者保留价格分布尾端”机制一致;(c)Bitcoin 的“矿工成本底”和“持有者底”均
    存在但持有者 behavior 似乎是更 consistent 的底部 indicator。
    分析:Bitcoin 的 S/F 比~120(高于金),但价格仍与矿工成本有经验关联——此非推翻
    DED-030,因为 DED-030 的预测(i)不是“成本完全无关”而是“持有者底而非成本底是
    长期主导”。Bitcoin 在 bear market 中跌破矿工成本后仍不反弹(直至新需求出现)的 pattern
    与预测(i)一致。但 Bitcoin 与金的关键差异:金的存量持有者有数千年文化惯性(首饰/央行),
    Bitcoin 的持有者基础年轻且 behavior pattern 尚未稳定——所以 Bitcoin 的证据
    是 suggestive 而非 confirmatory。
    结论:【非净杀,方向性支持但资产特异性需 caution】。

    ========== 攻击 4:稀土(Rare Earth Elements)的 S/F 比与定价——不适用,scope 外 ==========

    目标:找 S/F 极高但定价完全由生产者边际成本决定的干净反例
    案例:某些中重稀土(如镝、铽)的地上存量(在磁材等终端产品中)相对于年产量可能极高,
    但稀土定价高度集中于中国(>60%矿产+>90%加工),市场深度浅、价格不透明,非竞争性
    市场→不符合 DED-030 暗含的竞争性市场前提。
    结论:【不适用,market structure 不满足理论 scope】。

    ========== 猎捕结论 ==========

    未猎到 scope 内干净必杀反例:
    - 攻击1(银):方向与理论一致(价格可在 AISC 附近长期运行且反弹不由供给收缩驱动),
      但工业需求 confound 限制了 probative value——非净杀
    - 攻击2(铂):boundary case——S/F 落在 gap 区间,价格行为混合,非净杀
    - 攻击3(Bitcoin):方向与理论一致(高 S/F→持有者行为主导底部),但资产特异性和
      持有者基础差异限制跨资产推论强度——非净杀
    - 攻击4(稀土):理论 scope 不适用,不构成反例

    最强挑战其实是“无证据”而非“有反例”:核心 discriminant 预测(金< AISC 5+年不反弹)
    自 1971 年以来未被观测——不是反例,而是 untested。若未来金价跌破 AISC(如$1200)
    且反弹迅速(1-2 年内),可能构成压力(但需排除 excluded_outcome #2 的 confound)。
    当前最可操作的检验是 falsifiability(b):取多个独立供给侧和需求侧事件做跨事件弹性
    对比——此检验可在现有数据上执行,无需等待金< AISC 的极端 scenario。

    反例猎捕完成。无 scope 内净杀。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发】

    DED-004 的死因:唯一新意被实证推倒→改措辞用同一批数据捞“打折版”→事后开脱活门未堵。
    DED-030 与 DED-004 的关键差异:
    - DED-030 有三条可独立攻击的预测(i)(ii)(iii),每条有独立的证伪条件——
      DED-004 只有一个经验主张被围剿。
    - falsifiability(a)(b)(c)给出明确的可操作证伪测试:(a)金< AISC 5+年不反弹+
      持有者抛售、(b)供给侧弹性≥需求侧弹性、(c)持有者弹性排序错误。
    - anti-talisman clause 启动:禁止由价格结果反推持有者行为,禁止用纸黄金消解不利证据。
    - excluded_outcomes 均基于事前可测结构指标(金价 vs AISC、全行业减产幅度>30%)。

    DED-004 式“事后开脱活门”检查:
    - excluded_outcome #1“金价始终高于 AISC”:此钩子基于 AISC 与金价的关系——AISC
      是独立于推论的事前成本核算指标,不由推论成败决定→事前判据,非事后活门。
    - excluded_outcome #2“金< AISC + 减产>30%后回升”:减产>30%由矿山运营数据独立
      判定→事前判据。30%的阈值选择需额外 justification 以防事后调参,但阈值本身是事前
      立桩的→非灵活活门。
    - anti-talisman(c)“纸黄金±2σ”:±2σ 是事前量化门槛,非“遇反例→说纸黄金干扰”
      的弹性条款→有效的门。

    未发现 DED-004 式不可证伪循环。通过。

    DED-007(测量轴焊死):【未复发】

    DED-007 的死因:自变量分母“实际获授者”偷用被预测量(货币形式)→轴定义含被预测量,
    结构性焊死无法拆。
    DED-030 现状:
    - 自变量 S/F 比:stock=WGC+GFMS(行业+地质估算),flow=USGS(地质调查)→两源独立
    - 被预测量(定价 regime):供给侧 vs 需求侧事件的价格弹性→事件识别(矿难/央行公告/
      ETF 持仓)独立于价格弹性测量
    - 持有者弹性排序:WGC 需求分类(首饰/投资/央行)独立于金价→yes
    - AISC:WGC 矿业成本核算独立于金价→yes

    四个轴在概念和操作层面均异源。无 DED-007 式“分母偷用被预测量”的结构性焊死。
    anti-talisman clause 进一步加固:明令禁止由“价格没崩”倒推“持有者没卖”。
    未复发。

