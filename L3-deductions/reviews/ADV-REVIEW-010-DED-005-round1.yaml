id: ADV-REVIEW-010
target: DED-005
date: 2026-07-14
type: adversarial_review
layer: L3-deductions
round: 1

人话摘要: "这是对新推论 DED-005(贸易vs劫掠)的第一轮挑刺。独立 AI 判'需修改':好消息是它没犯 DED-004 那种'怎么都推不翻'的病(真能被证伪);但它把'禀赋互补'当成交换的必须前提是错的——同质的两拨人靠互惠(如昆人几十年的礼物交换)照样稳定地换,当场推翻了这个'必须'。招牌预测(同一对群体随条件在贸易↔劫掠翻转)没塌,所以是修不是废。作者全盘接受,已按清单改。"

# === 触发源 ===

trigger:
  source: DED-005 首次提交(candidate)
  reason: |
    DED-005 是交换/经济领域的第一条推论(路 B:先补 L2 砖 BR-L2-007/008,
    再推)。按 Rule B 派独立子 Agent 对抗式审查,明令尽力击杀、默认怀疑,
    并特别拷问两点:非平凡性(三条件是否有闲置)、不可证伪护身符(是否重蹈
    DED-004 覆辙)。

# === 挑战者 ===

challenger:
  identity: "独立对抗式审查者(子 Agent, general-purpose, 全新独立上下文)"
  date: 2026-07-14
  verdict_given: needs_revision
  one_line: |
    DED-005 没有 DED-004 的不可证伪病(护身符条款是真进步)——它反而【足够
    可证伪,以致条件①的'必要闸门'当场被同质群体的稳定互惠交换证伪】;砍掉①的
    过强必要性、修好③的误编码,其"贸易↔劫掠翻转"的非平凡内核依然站得住。

# === 逐条件是否闲置 ===

idle_condition_check: |
  三个条件【无一是纯闲置白砖】:①②③ 各自都能在真实案例里成为绑定约束。
  故 DED-005 躲过了 nontriviality_test 最致命形态(DED-004 式的单父判空+搭便车)。
  不以"平凡合取"击杀。但它没死在闲置,死在别处(①的双重身份)。

# === 挑战 ===

challenges:
  - id: C1
    title: "①的'必要闸门'是推导越界"
    severity: high
    detail: |
      Step 2 称"无互补⇒换根本不开"(必要性),但引用的砖 BR-L2-007 只支持
      单调关系——原文是"同质⇒贸易【微弱】、【更多】靠竞争或掠夺"。"微弱"≠零,
      "更多"≠全部。把单调递减拔高为"必要闸门"是逻辑跳跃。

  - id: C2
    title: "①的双重身份死结(决定性)"
    severity: critical
    detail: |
      ①同时被当两种不相容的东西用:(a)可证伪经验命题(falsifiability(b):"同质却
      贸易⇒证伪");(b)定义闸门(outcome 把贸易极定义为"自愿互惠")。而"自愿互惠"
      恰恰不需要互补——BR-L2-005(本推论自己的前提砖)明示重复互动⇒时间错开的
      互惠,与互补无关。故①不能既是可证伪预测又是定义闸门:若是经验命题则被反例
      证伪,若是定义则沦为同义反复且须把一大类真实交换开除出"贸易籍"。

  - id: C3
    title: "不可证伪护身符——查得如何(护身符没生效,反暴露真伤)"
    severity: info
    detail: |
      结论出乎意料:DED-005【不是】被护身符保护得刀枪不入,恰相反,它可证伪、
      且①一条腿已被证伪。②轴(殖民"武力骤降")上 anti_talisman_clause 真起作用:
      武力不对称是征服前可独立观测的(工事/兵力/地形),且欧洲人征服前确在贸易,
      转向征服与军力突变同期——"②失效"部分独立于结果成立。故 DED-004 式的
      不可证伪病在此【不是主要问题】。

  - id: C4
    title: "独立反例命中 falsifiability(b)(硬)"
    severity: critical
    detail: |
      (a)轴"高互补+反复接触+高掠夺成本却掠夺主导"未找到——反成加分(证伪条件
      可达却未被满足)。(b)轴"禀赋同质却稳定贸易主导"【找到硬反例】:
      昆人 hxaro(跨 band 数十年延时互惠,珠换珠,驱动=风险分摊非互补,生态同质);
      东非牧民牛只结义(同质牧民互借牛分散畜疫旱灾);农业道义经济谷物互借。
      按模型自己的 outcome 定义(自愿互惠=贸易),它们就在贸易极,③高②高唯①低,
      模型却预测"不开换、倒向掠夺"。模型唯一逃法(重归类为互惠、不算贸易)被它
      自己的 outcome 定义堵死。命中 falsifiability(b)。

  - id: C5
    title: "③必要性过强 + 无声贸易自锚点误编码"
    severity: medium
    detail: |
      模型把无声贸易列为③(重复接触)的支持锚,但无声贸易的招牌机制恰是【不依赖】
      信任/重复博弈——靠同时性、互不先交自我执行,正因此能在语言不通、身份匿名
      (人际③很低)的陌生人间成立。模型把"③低仍贸易"误编码成"③高"支持。说明③可被
      自执行交换结构替代,"任一不足⇒倒向掠夺"里③的必要性被夸大。

  - id: C6
    title: "②的比值门槛不可独立测(部分成功,但属已披露)"
    severity: low
    detail: |
      ②是比值(掠夺成本÷交换代价),代理指标只测分子(绝对成本),测不到门槛。
      "发生掠夺⇒必是掠夺更便宜"在门槛层仍有循环。但模型 limitations 已诚实披露,
      按 critique_failure_modes 不得把已披露灰区硬说成隐藏漏洞(梯度塌缩)。
      记为已披露操作化弱点,计入 needs_revision,不作击杀。

rejected_cheap_shot: |
  审查者【主动放弃】"这不过是理性选择同义反复"这一击:按 critique_failure_modes,
  "撞车已知理论⇒平凡"是概念偷换(新预测↔非平凡)。DED-005 做出具体结构预测
  (贸易扎堆生态互补边界×反复接触×威慑;同一对群体纯靠结构条件变化翻转),是
  consilience 型统一,非平凡。不制造假问题。

flagship_survives: |
  "同一对群体随边市开闭/丰歉在贸易↔劫掠翻转"由②③驱动、①大致恒定——压在健康的腿上,
  ①被砍不倒。这是判 needs_revision 而非 rejected 的决定性理由。

# === 最小修订清单 ===

minimal_revision_list:
  - "①选一条道:降为'强单调影响'(与 BR-L2-007 对齐),承认同质群体经风险共担/互惠稳定交换,改写 falsifiability(b);或保留为定义闸门但显式声明'贸易'特指互补性交换、把互惠/风险共担交换划出适用范围、撤下已被现实满足的伪证伪条件。两条不可兼得。"
  - "③:'任一不足⇒倒向掠夺'中③从'严格必要'改'影响执行力',承认自执行交换结构可替代未来之影;无声贸易从③支持锚移走或重编码。"
  - "②:操作化显式区分可观测分子(武力/工事/地形)与不可观测门槛,声明证伪只落分子层,门槛归因受 anti_talisman_clause 约束。"
  - "falsification_trace:真实最弱环是①-必要性的双重身份,应与③对调优先级。"

# === 作者响应 ===

author:
  identity: "推论作者"
  date: 2026-07-14
  response: "全部接受。取修订选项(降①为强影响+拆两条路),按最小清单重写。"
  reasoning: |
    审查逻辑无懈可击,尤其 C2/C4:作者自己用 BR-L2-005 当前提,却没看出"自愿互惠"
    型交换不需互补——同质群体的 hxaro 就在自己给贸易下的定义之内,当场证伪①的必要性。
    修订选择拆出 R1(互补型)/R2(互惠风险共担型)两条路,①降为 R1 强度驱动——这比原稿
    更丰富、更正确,且招牌翻转预测(压②③)完好。C5 无声贸易重编码为"自执行结构替代③"。
    C6 门槛诚实声明提升到正文。C3 确认 DED-004 病未复发。
  revisions_made: "见 DED-005 的 adversarial_review.author_response.revisions_made 与 revision_note。"

# === 裁决 ===

verdict: needs_revision
verdict_rationale: |
  与 DED-004(归零)不同,DED-005 的非平凡内核(②③调节下的贸易↔劫掠翻转 + 生态边界
  扎堆)未归零,可证伪、未被护身符保护、旗舰预测有硬锚点且(a)轴反例搜索攻不穿。
  但①的"必要闸门"身兼可证伪命题与定义闸门两不相容角色,作为经验命题被同质群体
  稳定互惠交换证伪,且是对 BR-L2-007 的推导越界;③必要性夸大 + 无声贸易误编码。
  故 needs_revision。作者已全部接受并重写。修订版仍 candidate,须 round-2 确认——
  重点复核 R2 的引入是否制造【新的】不可证伪逃逸门(把"得换路径存在"变得过易成立)。

# === round-2 确认审查 ===

round_2_confirmation:
  status: needs_revision
  reviewer: "独立子 Agent (general-purpose, 全新独立上下文, 与 round-1 不同实例)"
  date: 2026-07-14
  人话摘要: "第二轮独立复核。核心结论:round-1 的三处伤真修好了;最担心的'拆成 R1/R2 两条路会不会让推论变得怎么都说得通'——经审查者竭力猛攻,没有,反而更能被证伪(DED-004 那个病没复发);审查者自己去找反例(新几内亚械斗、游牧世仇、亚诺马米袭击)一个干净反例都没找到。但还有两颗螺丝没拧紧:R2'必须独立于交换验证'这条锁只装了门没上栓(只要求、没兑现独立证据);'掠夺'的射程没声明清楚(该只算抢资源,却宽泛算了所有暴力)。外加一处小的:'报复'被两个杠杆重复算了。判'需修改、近乎通过',拧紧即升 verified。作者已按三点全部拧紧,送第三轮轻量确认。"
  key_confirmations:
    - "round-1 三处修订(①降 R1 强度驱动 / ③承认自执行结构替代+无声贸易重编码 / ②门槛诚实声明)均已落实。"
    - "R1/R2 拆分【未】制造新的不可证伪逃逸门:'得换路径存在'是放松的【前件】而非收紧的【后件】,净效果是【更】可证伪;anti_talisman_clause 仍守住后件(不得因'结果是掠夺'倒推'杠杆失效');DED-004 的不可证伪病【未复发】,反而'硬化'——R2 迫使模型对'同质+反复+威慑'群体预测贸易主导,自我暴露更多。"
    - "招牌翻转预测仍非平凡、可证伪;②③ 均为活跃约束,无闲置白砖。"
    - "独立反例猎捕(新几内亚 moka+部落 warfare、节段世系牧民世仇+通婚、亚诺马米袭击+宴飨、科曼奇/维京)【未得干净反例】:皆混合态,大量暴力为非资源型(复仇/荣誉/新娘/领土),资源型夺取强度随生态压力起落,与②预测一致;科曼奇/维京反支持翻转预测。"
  residual_defects:
    - id: R2-lock-unlatched
      severity: required
      title: "R2 独立性'只装门未上栓'"
      detail: |
        文件正文与 anti_talisman_clause 都【要求】R2 的'风险错开'须由气候/物候独立数据支撑,
        但 R2 支持锚(hxaro 等)只【断言】'驱动=风险分摊非互补',未【呈现】那份独立证据。
        于是'同质却交换=R2 支持(非①反例)'成了断言而未坐实——正是文件自己警告的循环从
        没上锁的门溜回来。修法:补独立的去相关冲击证据(如卡拉哈里降雨空间斑驳),或给该锚
        降级标注'R2 独立性待数据'。
    - id: predation-scope-undeclared
      severity: required
      title: "'掠夺'射程未声明"
      detail: |
        R2 既保证同质群体有得换路径,模型就【必须】对'势均力敌+常年械斗'社会(新几内亚、
        节段世系牧民)预测贸易主导——除非②③失效。但 outcome 用'战伤/征服记载'宽泛计入暴力,
        未干净继承 BR-L2-008 的'夺取资源'射程,使这些以复仇/荣誉/领土为主的局地械斗暴露为
        伪反例。修法:显式声明'掠夺'=抢资源型暴力(继承 BR-L2-008),排除非资源型暴力出结果
        计数,或把局地械斗列为显式 boundary_case。
    - id: retaliation-double-count
      severity: minor
      title: "'报复'在②③重复计入"
      detail: |
        ②(掠夺成本)含'报复损失',③(掠夺自毁)含'招报复',故'②③独立可变'不确——二者共用
        报复通道。修法:归给单一杠杆,或显式声明②③共享报复通道、把'独立可变'降为'可被不同
        外因分别推动'。
  non_mandatory_suggestion: "点明(R1∨R2)'得换路径存在'近乎恒真、不区分案例,真正的预测重量全在②③,R1 的实质在单调性——免读者误把'有路径'当判别闸门。"
  verdict: needs_revision
  verdict_rationale: |
    两颗螺丝拧紧即可升 verified:R2 独立性兑现 + 掠夺射程声明(小项:报复归属)。均为精确有界的
    收尾,不动非平凡内核。故 needs_revision(近乎 verified)而非 rejected 或直接 verified。
  author_response:
    verdict: "全部接受,三点全部拧紧,采纳非强制建议。"
    revisions_made: "见 DED-005 的 adversarial_review.author_response_round_2.revisions_made。"
  meta_lesson:
    headline: "'要求'不等于'兑现':作者在文里写下'R2 须独立验证'这条锁,却没真把独立证据摆出来——门装了,栓没上。审查者一句'只装门未上栓'点破。"
    lesson: |
      1. 凡是写进正文的诚实约束(如'须独立于结果观测'),都要在锚点里【当场兑现】证据,
         否则约束只是姿态,循环会从没上栓的门溜回来。这是继 DED-004'逐格判空'、DED-005 round-1
         '每个条件是下定义还是做预测'之后的第三条通用检验:【每一条你写下的自律,兑现了没有?】
      2. 拓宽前件(R1∨R2 让'有得换'更易成立)会【连带】收窄对后件的射程要求——一旦保证人人
         有得换,就必须对'仍在打'的社会给交代,逼出'掠夺=抢资源'的射程声明。放松一处,别处要补锁。
      3. 正面:R2 拆分经猛攻不但没制造逃逸门,反而'硬化'了推论(自我暴露更多)——放松前件 ≠
         放水,只要后件的护栏(anti_talisman)还在。这与直觉相反,值得记下。

round_3_confirmation:
  status: verified
  reviewer: "独立子 Agent (general-purpose, 全新独立上下文, 与 round-1/2 不同实例)"
  date: 2026-07-14
  人话摘要: "第三轮轻量确认。只干两件事:核对 round-2 那三颗螺丝拧没拧紧、有没有拧出新毛病。结论:三处全 landed。最关键的对抗点是——作者声明'掠夺只算抢资源'会不会变成'凡是对我不利的案例都推说不算掠夺'的万能挡箭牌?审查者专门猛攻这点,攻不穿:因为'算不算掠夺'挂在'到底有没有抢到资源'上,这是独立于结论、外人能看的事实,真抢了的反例赖不掉。R2'降雨错开'也确能独立于交换本身测。判 verified,可升级。仅剩一处小瑕疵(锚的置信标签)已当场收尾。"
  three_fixes:
    - {defect: R2-lock-unlatched, verdict: landed, reason: "卡拉哈里降雨空间斑驳独立于'是否发生 hxaro'可测(Wiessner 功能归因);牧民/农业诚实降级'待数据'不夸大。"}
    - {defect: predation-scope-undeclared, verdict: landed, reason: "射程继承 BR-L2-008 属实(核对砖正文);measurement 把'战伤须归因资源夺取'写进操作化,limitations 单列射程外暴力=真排除;boundary_case 处理诚实(承认也在交换、承认混合态、承认只解释资源转移)。"}
    - {defect: retaliation-double-count, verdict: landed, reason: "step 5 明写'②③共用报复通道…不完全正交',把'完全独立可变'降为'可被不同外因分别推动'并给出各自外因;statement 已无'独立可变'残留。"}
  talisman_test:
    is_talisman: false
    reasoning: |
      本轮最关键对抗点。射程排除的钩子挂在'资源是否被夺取'(牲畜/粮食/人口/财货)——
      这是【独立于结果(贸易/劫掠占比)】可观测的特征。故凡【真夺取了资源】的暴力都无法被
      重归类为'非资源'划出射程;护身符要求'任何不利案例都能划出去',而此处只有【确无夺取的
      复仇/荣誉/械斗】才可排除,资源型反例无处可逃。射程由 BR-L2-008 继承(非临时发明),
      ②③本就只调节'抢资源 vs 换资源'。模型仍留活证伪通道:资源型夺取强度须随②(分子层
      独立可观测)起落,否则证伪。诚实让步:射程收窄【略微】降低旗舰预测原始暴露面,买到
      混合动机案例一点解释余地——但这是【已披露、有原则、由独立可观测量兜底】的收窄,未越入护身符。
  r2_circularity_test:
    is_circular: false
    reasoning: "降雨/气候数据独立于'是否发生 hxaro'可测 + Wiessner 功能归因——非拿交换本身当证据。"
  new_defects: "无 required/critical;仅 1 处 minor(R2 锚 confidence 标签覆盖面),作者已当场拆为 昆人 strong / 牧民·农业 moderate。"
  verdict: verified
  verdict_rationale: "三处螺丝拧紧、两个对抗点(射程护身符 / R2 循环)攻不穿、旗舰翻转预测的可证伪性与非平凡性未被削弱。可升 verified。"
  meta_lesson:
    headline: "'划出射程'与'不可证伪护身符'的分水岭 = 排除钩子能否【独立于结果】判定。"
    lesson: |
      钩子挂在'资源是否被夺取'(独立可观测)上就守得住;挂在'结果是否对我有利'上就沦为
      护身符。这是本推论三轮沉淀的第四条通用检验(继 DED-004'逐格判空'、round-1'每个条件
      是下定义还是做预测'、round-2'每条自律兑现了没有'之后):【射程/排除声明必须钉在一个
      独立于结论的可观测特征上,否则就是变相护身符。】

# === 元教训 ===

meta_lesson:
  headline: "作者会把自己的前提砖用反:DED-005 拿 BR-L2-005(互惠)当前提,却没看出互惠交换不需互补,导致①的'必要闸门'与自己的砖矛盾。独立审查一眼看穿。"
  lesson: |
    1. 交换类推论必须先问"通向该结果有几条路"——原稿只看见互补型,漏了互惠/风险
       共担型,把一条路的驱动误当成全体的必要闸门。
    2. "可证伪经验命题"与"定义闸门"不能是同一个条件——一旦一个条件既下定义又做预测,
       它要么同义反复、要么被自己的定义证伪。这是继 DED-004"逐格判空"之后,交互/多条件
       推论的又一条通用检验:【每个条件是下定义,还是做预测?二者不可兼任。】
    3. 正面:anti_talisman_clause(DED-004 教训的产物)在 DED-005 的②轴上真起了作用——
       体系上一次失败沉淀的护栏,这一次拦住了同类风险。护栏在复利。

