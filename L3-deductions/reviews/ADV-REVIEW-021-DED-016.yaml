  red_flag_findings:
    brick_conclusion: |
      未命中(攻不穿)。四砖各供不同贡献且无一单独包含"公平制度在 Dunbar 处结构性转换"的
      结论:BR-L2-004 只说 >150→层级存在(任意组织形式,不说公平制度);BR-L2-009 只说信任
      有界且随社会距离衰减(软约束,不说相变);BR-L2-010 只说制度【能】替代信任(交换域、
      近定义,不说公平域,不说必然);BR-L2-015 只说程序公平可替结果公平(不说规模阈值,不
      说碎片化分支)。作者的 nontriviality_test 诚实拆解了四砖各贡献不同,并正确指出真
      发动机是 BR-L2-004+BR-L2-009+THEOREM-group-identity-decay 三角,BR-L2-010 是
      制度可行性前提(近定义),真非平凡卖点是碎片化档 B(证明制度化非自动)。
      经 round-1 降权后的 BR-L2-010 定位(教科书级,非发动机)诚实准确;核心结论
      ">150→档A维持条件坍塌→B/C二择"不在任何单一砖的原文中→brick=conclusion 未命中。

    nontriviality_cell_check: |
      攻不穿。格4(>150,档A面对面统一公平)为空不是任何单一砖的平凡推论——BR-L2-004 只
      说 >150→层级,不说公平制度;BR-L2-009 只说信任有界,不说公平维护模式;BR-L2-010 只说
      制度可替代信任(交换域),不说公平域;BR-L2-015 只说程序替结果,不说规模阈值。唯有
      四砖合成+CONCEPT-fairness 的共享比较结构,才推出 >150 时档 A 三个维持条件同时显著
      弱化、余下 B/C 两条路径、中间格(A)为空→非平凡、非砖内结论。

      但需诚实标注:档 C 最低制度门槛(常设+跨群管辖+裁决约束)相当包容——口头法+兼任仲裁者
      +年度集会就算 proto-C。此包容性使空格预测在操作层较难被填:几乎任何 >150 且维持跨亚群
      统一公平裁决的社会都会有某种形式的常设议事会/长老团。这不是不可证伪(DED-004 病)—
      —因为判据是统一事前固定的门槛、由独立证据判定(非因 >150 就自动归 C),且"常设性"本
      身就是可独立验证的经验事实(有固定的还是 ad hoc 召集)。若未来发现一个社会具有定期集会
      但不做争端裁决(仅仪式/规范传输),同时跨亚群统一公平靠其他非制度机制维护→仍可入空格。
      故空格是真经验主张,非按构造恒空。通过。

    measurement_orthogonality: |
      未命中(不重蹈 DED-007)。群体规模由人口普查/考古聚落面积×密度独立测得(如乌鲁克面积
      ×密度估人口不依赖法典是否存在)。公平维护模式由民族志/史料中对争端解决机制的具体描述
      独立测得(当事方交涉 vs 亚群差异 vs 制度载体)。两轴异源正交。anti_talisman 条款成文
      有力:禁因">150"推断"必为 B 或 C"、禁因">150 且无制度"推断"已碎片化"。档 B 的判定
      要求独立证据支撑(亚群间公平标准差异的可观测判例/规范陈述)。无隐藏焊点——分母不含
      结果测、自变量不含因变量。DED-007 死因(分母用"实际获授者")完全不适用。

    scope_hook_independent_of_result: |
      未命中。三条排除钩子均按事前可测渠道划:(1)制度俘获→出射程(预测制度出现非质量,
      质量是 DED-008 的射程);(2)<150 时出现制度→不证伪(推论只禁 >150 时空格,不反向
