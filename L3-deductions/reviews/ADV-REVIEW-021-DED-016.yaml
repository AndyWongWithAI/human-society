      - 易洛魁联盟:已从 counterexample 移至 boundary_case,按三要素归 proto-C。Great Law
        (口头+wampum)+Grand Council(50 酋长定期集会)确为跨民族制度化框架。✓ boundary_case。
      - 努尔人:正确分析为规模控制(裂变保持各单元<150)非承受规模→不命中空格。✓ boundary_case。
