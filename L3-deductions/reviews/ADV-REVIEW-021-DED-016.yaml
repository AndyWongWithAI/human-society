id: ADV-REVIEW-021
type: adversarial_review
reviews: DED-016
layer: L3-deductions

人话摘要: "对 DED-016(面对面公平-制度化公平相变推论)的 round-1 独立对抗审查。裁 needs_revision——核心逻辑成立、未重蹈 DED-004/007 致命循环,但三条 required 未决:(1)易洛魁联盟反例标记'待核实'却未解决,若确为档A则填空格;(2)'相变(非渐变)'声称缺乏~100-250 区间非线性经验证据;(3)A/C 分类边界模糊(Iceland/易洛魁均可双读),护住空格免于证伪。反例猎捕揭出澳大利亚原住民 songline 体系为潜在模式 D(仪式性维持),未被 A/B/C 穷尽。"

target: DED-016
protocol: "Rule B 独立对抗审查(作者≠审查者,全新上下文),红旗 10 条逐项攻 + 反例猎捕 + DED-004/007 复发检查。唯一校准来源:review-rubric.md。"

round_1:
  reviewer: "独立子 Agent (general-purpose, 全新独立上下文)"
  verdict: needs_revision
  verdict_note: |
    核心逻辑——规模→层级+信任断裂+身份衰减→档A维持条件坍塌→B/C二择——是成立的合成推理,
    四砖各供不同贡献、无一单独包含'公平制度在Dunbar处相变'的结论。碎片化档B的存在证明了制度化
    非自动,这是本推论最扎实的非平凡卖点。测量轴正交(群体规模 vs 公平维护模式)干净、anti-talisman
    条款成文有力、排除钩子按事前渠道划而非事后开脱——这些基本功做对了,未重蹈 DED-004/007 的
    致命循环。

    但三条 required 未决:
    (1) 易洛魁联盟(~20,000人、无文字、无职业法官、口头大法+酋长议事会)被诚实标注为'待核实',
    但未被解决。若 Great Law/Grand Council 不构成'非人格化公平制度'(规则口头、酋长非司法专职),
    则此为档A在>150时的活反例,命中 falsifiability(a) 净填空格。推论的 candidate→verified
    推进不能带着一个未解决的潜在净杀反例上路。
    (2) '相变(非渐变)'声称的三个现实锚只证明 A 在小尺度(~30 狩猎采集)和 C 在大尺度(数千城邦)
    都存在,中间隔着数量级空白,未提供~100-250 区间非线性跃升的任何经验证据。这与 BR-L2-009
    的连续衰减软约束存在措辞张力——BR-L2-009 明说'不是某个精确人数的硬悬崖',而本推论称'相变
    非渐变'。逻辑上连续驱动量可产生不连续相变(如水在0°C结冰),但这是经验主张,需要证据而非类比。
    (3) A/C 分类边界模糊,制造了轻度 DED-004 回声。冰岛共同体(40,000-70,000人,口头法、私人执行、
    无职业法官)被归为'过渡态 A→C',易洛魁借同样模糊性待核实——同一套判据('口头规则+非专职仲裁者
    =A 还是 C?')在不同案例给出不同归类,保护空格免于被填。需收紧 operationalization 中 C 的
    最低制度门槛:口头法+非专职仲裁者+定期集会是否算 C?

    综上:非 rejected(核心未塌,可靠定向修订救活),但三条 required 挡在 verified 门前 ⇒ needs_revision。

  red_flag_findings:
    brick_conclusion: |
      未命中(攻不穿)。四砖各供不同贡献:BR-L2-004 供层级必然性(>150→层级,不说公平制度),
      BR-L2-009 供信任有界(连续衰减,不说相变),BR-L2-010 供制度可替代(能力非必然),
      BR-L2-015 供程序替结果(不说规模阈值)。无一单独包含'公平制度在Dunbar处相变'的结论。
      nontriviality_test 中'档B的存在证明制度化非自动'是正确的防平凡化论证。但诚实地说,
      BR-L2-010 贡献近定义(制度能替信任是教科书级),发动机实为 BR-L2-004+BR-L2-009
      +THEOREM-group-identity-decay 三者的联合,应诚实点明。
    nontriviality_cell_check: |
      部分命中(concerning)。格4(>150,档A)为空不是任何单一砖的平凡推论,确有合成新意。
      但档A的'三个维持条件'(全群信任覆盖+重复交互+共享身份)与档A的操作化定义
      ('当事方直接交涉+熟人调解+跨亚群统一')高度重叠——若'熟人调解覆盖全群'是档A的内在
      要求,而>150时'熟人'不可能覆盖全群(BR-L2-009),则格4为空近乎定义性而非经验性。
      作者在 primary_suspect 中自认'周期性全体集会/仪式/跨亚群交换婚'可能成为替代维持机制,
      这承认了空格是真经验主张(可被这些机制填),挽救了非平凡性。但自认本身也说明空格依赖
      于'三个维持条件是排他的必要条件'这一未独立验证的前提。
    measurement_orthogonality: |
      未命中(不重蹈 DED-007)。群体规模由人口普查/考古聚落面积×密度独立测得,公平维护模式
      由民族志/史料中对争端解决机制的具体描述独立测得,两轴异源正交。anti_talisman 条款
      成文有力:禁因'>150'推断'必为B或C',禁因'>150且无制度'推断'已碎片化',与 DED-008 r3
      的结构测要求同级。无隐藏焊点。
    scope_hook_independent_of_result: |
      未命中。三条排除钩子均按事前可测渠道划:(1)制度俘获→出射程(预测制度出现非质量),
      (2)<150时出现制度→不证伪(只禁>150时空格,不反方向),(3)非规模触发→不证伪
      (主张驱动量非唯一原因)。排除钩子不依赖结果事后开脱,做对了。
    criterion_tier_match: |
      未命中。A/B/C 三档谱系非二分,operationalization 诚实标注'混合态按主导模式标注',
      limitations 承认'统一是程度'。与 BR-L2-009 的连续衰减软约束匹配。学到 DED-006 教训。
      但 prediction(i) 的'出现概率'隐含二值化 C—若 C 是谱系,则'出现'阈值在哪未定义,
      留 minor 模糊。
    anti_talisman_cashed: |
      部分命中(concerning)。条款文字是真兑现——禁结果反推、禁规模推模式、要求独立证据测
      B(亚群间公平标准差异)。但实际操作层:冰岛被归'过渡态 A→C'而非 A,易洛魁被搁置'待核实'
      ——同一套模糊判据(口头规则+非专职仲裁者)在两个案例产生不同归类动作。条款写了门,
      但判据不够锋利以致门框有弹性:A/C 边界处可把潜在反例推出空格(归过渡态/归C)。
      比 DED-006 r1 的'只装门未上栓'好,但未达到 DED-008 r3 的结构测锋利度。
    anchor_fact_check: |
      命中(concerning,部分 required)。
      - !Kung/Hadza/Ache 档A:准确,民族志广泛记载。strong。
      - 两河流域城邦档C:准确,乌尔纳姆法典~前2100BCE、神庙法庭。moderate-strong。
      - 冰岛共同体:人口~40,000-70,000、~40酋长区、年度 Althing+法律宣述人(logsogumadr)、
        执行靠私人仇杀/仲裁。作者归'过渡态 A→C'。但严格按档C判据('成文规则/专职法官/法院'):
        冰岛法最初口头(logsogumadr 背诵)、无职业法官(酋长兼政治/司法)、无执行机构(私人执行)。
        若口头法+非专职仲裁者≠档C,冰岛在>150时维持档A 达数世纪→填空格。作者归'过渡态'是
        合理但非唯一的解读——此分类弹性恰是问题。
      - 易洛魁联盟:标记'待核实',未解决。~20,000人、口头大法+酋长议事会、无职业法官。
        若 Great Law 不算'成文规则'(口头+wampum)、酋长不算'专职法官',此为档A在>150成立。
        未解决的潜在净杀反例挡在 verified 门前 ⇒ required。
      - 努尔人:边界案例,分析正确——规模控制(裂变保持各单元<150)非承受规模,不命中空格。
    definition_vs_prediction: |
      未命中。档A的'三个维持条件'(信任覆盖+重复交互+共享身份)是作者对档A机制的【经验分析】,
      非档A定义的一部分。档A的定义是'当事方直接交涉+熟人调解+无制度载体+跨亚群统一'——
      这些可独立观测,不蕴含'>150时不可能'。故空格预测是实质经验主张,非同义反复。
    enumeration_exhaustiveness: |
      命中(concerning,潜在模式D)。A/B/C 三分类声称穷尽:档A维持条件坍塌后'余下两条可行路径'
      =B(碎片化)或 C(制度化)。但存在潜在的第四模式 D——仪式性/周期性维持:
      跨亚群统一的公平标准通过共享仪式、周期性全体集会、口头传统(非成文规则)维持,
      无专职法官/法院/成文规则(≠C),也非碎片化(≠B),且维持机制非面对面人际互惠+声誉
      (≠A,因规模超熟人圈)。候选实例:澳大利亚原住民 songline 连接的语群(>150人),
      通过周期性 corroboree、 elders' councils、口头习惯法维持跨群规范——
      若 elders 非'专职法官'、口头法非'成文规则',此非 C;若跨群规范统一,此非 B;
      若规模>150 熟人网络不覆盖全群,此非纯 A。此为 scope 内潜在填格候选,虽需民族志
      细节核实(elders' councils 是否构成'第三方裁决机构'是分界),但其存在本身说明
      A/B/C 穷尽性未经压力测试。作者 primary_suspect 自认的'周期性全体集会/仪式'
      本质上就是承认了模式 D 的可能性。
    primary_suspect_aim: |
      指对。primary_suspect('周期性全体集会/仪式/跨亚群交换婚等非制度非碎片化机制')确为最弱腿,
      且正是反例猎捕的攻击面。secondary_suspect(BR-L2-015 在公平域的适用边界 + BR-L2-010
      从交换域推广到公平域的同构有效性)也是合理顾虑。unlikely_suspect(BR-L2-004 层级普适性)
      正确评低。但 primary_suspect 的后果被低估:它不仅威胁空格,还威胁 A/B/C 穷尽性——
      若模式 D 存在,则'档A维持条件坍塌→只剩 B/C'的推导缺少'无 D'的前提。
      平凡化威胁方面:与 DED-002 的判别('规范是否写下来'vs'公平靠什么维护')够干净;
      与 Weber 法律社会学的判别(定量非线性+空格+分支 vs 定性宏大叙事)也成立;
      但核心的防平凡化论述('碎片化档B证明制度化非自动')是扎实的,这是本推论最强的非平凡卖点。

  counterexample_hunt: |
    主动猎捕三个 scope 内候选,测试 falsifiability(a) 最强形式(>200人、>20年、跨亚群统一
    公平规范、无任何非人格化公平制度):

    ★1. 易洛魁联盟(Iroquois Confederacy,~1450-1779):
    ~20,000人跨5-6民族,Great Law of Peace(口头+wampum 记忆)+Grand Council(50酋长)
    维持跨民族和平与规范。无文字、无职业法官、无执行机构。作者标记'待核实'。
    若严格按档C判据(成文规则+专职法官+法院):口头法≠成文规则,酋长≠司法专职(兼政治/
    军事/外交),Grand Council≠法院(兼立法/行政/仪式)→档A在>150成立,直接填空格。
    若宽松读(Great Law 功能等价成文规则,Grand Council 功能等价法院)→档C,支持预测。
    此弹性本身即问题:同一案例可按同一套判据得相反结论 ⇒ 判据需锋利化。
    结论:未被作者解决,挡在 verified 门前 ⇒ required。

    ★2. 澳大利亚原住民 songline 体系:
    语群常>150人,通过 songline(口头传统)+周期性 corroboree(仪式集会)+ elders' councils
    + 亲属系统维持跨群行为规范。无成文规则、无专职法官、无法院。若跨群公平规范统一(非碎片化):
    - 规模>150 → 档A的熟人网络机制(直接互惠+声誉八卦)无法覆盖全群
    - 无制度载体 → 非档C
    - 跨群统一 → 非档B
    此为潜在模式D(仪式性+周期性维持),填入 A/B/C 穷尽性缺口。需民族志细节核实 elders'
    councils 是否构成'第三方裁决者'(若构成→归C,不填格),但候选的存在本身说明穷尽性未经
    压力测试。

    ★3. 冰岛共同体(930-1262):
    40,000-70,000人,口头法(logsogumadr 背诵)+Althing 年度集会+私人执行(仇杀/仲裁),
    无职业法官、无成文法典(至 Grágás 书写化)、无国家执行机构。作者归'过渡态 A→C'。
    但若口头法≠成文规则、非专职仲裁者≠职业法官、私人执行≠法院执行→档A在>150时存续
    数世纪,填空格。作者归'过渡态'是合理但非唯一解读——若判据不锋利,同一案例可双读,
    保护空格。

    结论:falsifiability(a) 空格未被干净证伪(易洛魁/冰岛/澳洲原住民均有可争辩的制度元素),
    但三者共同揭示一个模式——判据在 A/C 边界不够锋利,允许弹性归类保护空格,这是比单个
    净杀反例更系统的问题。在判据锋利化之前,无法可靠判定空格是否为空。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):未重蹈其致命形式(DED-004 的循环是'因有制度故推有需求、因有需求
    故推有制度'——自变量与因变量互相定义)。本推论有独立的群体规模测量和独立的公平维护模式
    测量,anti_talisman 禁结果反推,不构成闭环。但有轻度回声:A/C 分类边界模糊允许弹性归类,
    把潜在反例(易洛魁/冰岛)推出空格→削弱可证伪性。这不是 DED-004 的硬循环,但若不锋利化
    判据,会在操作层制造'空格从未被填因所有候选都被归过渡态/C'的软保护 ⇒ 列为 required 修。

    DED-007(焊死测量轴):未重蹈。群体规模(人口普查/考古)与公平维护模式(民族志/史料中的争端
    解决描述)异源独立测量,无分母偷用结果测、无自变量含因变量。BR-L2-009 明确说'不是某个
    精确人数的硬悬崖'——本推论的'相变(非渐变)'措辞与此有张力但这是措辞问题,非测量轴焊接
    问题。DED-007 的死因(自变量分母用'实际获授者'——结果混入自变量)在此完全不适用。

  required_fixes:
    - "[required] 解决易洛魁联盟反例:要么(a)给出决定性证据将其归入档C——证明 Great Law 构成'成文规则'(或功能等价),Grand Council 构成'第三方裁决者'(或功能等价法院),酋长构成'专职法官'(或功能等价);要么(b)承认其为空格潜在填格案例,将 confidence 降级或缩小 scope 排除 orally-constituted 大型政体。当前'待核实'状态不可接受,candidate→verified 不应带着未解决的潜在净杀反例。"
    - "[required] '相变(非渐变)'声称需要~100-250 区间非线性证据,或降调措辞:当前三个锚(!Kung~30 档A / 两河流域~数千档C / 冰岛~40,000过渡态)只证明小尺度用A、大尺度用C,中间隔着数量级空白,未显示非线性跃升。要么(a)补充~100-250 区间的经验证据(如考古聚落规模与公平制度涌现的统计关联);要么(b)将'相变(非渐变)'降为'在Dunbar区间(~100-250)出现维护模式的结构性转换,当前证据与非线性跃升一致但不能排除渐变'。另需与 BR-L2-009 的'软约束非硬悬崖'措辞对齐——若信任连续衰减,需论证为何公平维护模式不连续跳变。"
    - "[required] 锋利化 A/C 分类边界,消除弹性归类的操作层 DED-004 回声:当前判据下,口头法+非专职仲裁者+私人执行的案例(冰岛/易洛魁/澳洲原住民 elders' councils)可按同一套判据双读为 A 或 C。需在 operationalization 中给出 C 的【最低制度门槛】——至少需要哪些元素(成文/口头?专职/兼任?执行由国家/私人?)才算'非人格化公平制度'。建议:要么(a)严格限定 C='成文规则 AND 专职司法角色 AND 制度化执行',则冰岛/易洛魁均落 A→空格被填;要么(b)宽松定义 C='存在第三方争端解决机制(口头或成文、专职或兼任)且宣称跨亚群统一',则冰岛/易洛魁均落 C→空格仍空但需承认判据已移位。无论选哪条,关键是同一判据统一适用于所有案例,不允许不同案例用不同松严标准。"
    - "[should] 回应模式 D 穷尽性问题:primary_suspect 自认'周期性全体集会/仪式/跨亚群交换婚'可能成为替代机制,这本质上承认了 A/B/C 之外可能存在第四模式。建议显式加模式 D(仪式性/周期性维持)并论证为何其不存在或已被 B/C 吸收;或收紧 derivation step3 的逻辑——当前'只剩B/C两条路径'的推导缺少'无模式D'的前提。"
    - "[should] 降调防平凡化守卫中 BR-L2-010 的权重:derivation 称 BR-L2-010 贡献'制度能落地'的可替代性经验锚,但 BR-L2-010 本身近定义(制度经济学教科书级),发动机实为 BR-L2-004+BR-L2-009+THEOREM-group-identity-decay 的联合。诚实点明 BR-L2-010 是'制度能替代'的必要前提而非发动机,真非平凡在碎片化档B的存在(证明制度化非自动)。"

  author_response_round_1: |
    对审查者五条意见逐一回应(2026-07-14修订):

    [required #1 — 易洛魁联盟] 同意'待核实'不可接受。按锋利化后的档C最低制度门槛
    (三要素:常设裁决体+跨亚群管辖权+裁决约束力)裁定:Grand Council满足全部三要素
    ——定期集会、固定50酋长席位(常设);裁决意图约束所有加盟民族(跨亚群管辖);Great Law
    确立的和平义务与争端解决程序被集体承认(裁决约束力)。口头法与非专职酋长是档C谱系内
    强化度差异(intensification),非门槛差异。故归档C(proto-C),从counterexample移至
    boundary_case。同一门槛下冰岛Althing同归proto-C(年度常设+跨区域管辖+裁决约束),
    澳洲 elders' councils不满足常设性→非C。判据统一,无弹性。易洛魁联盟作为 confederate
    proto-C支持预测(i)而非填空格。

    [required #2 — 相变证据] 承认三个锚中间存在数量级空白。全档软化措辞:
    - statement: '相变非渐变'→'结构性转换,证据与非线性一致但不排渐变',新增注解段
      明确继承BR-L2-009'软约束非硬悬崖'性质,模式转换可在连续驱动量上产生;
    - prediction(i): '拐点'→'集中跃升,证据与阶跃一致但不排渐变',加渐变模型的
      解释负担;
    - derivation step2: '同时坍塌/陡降/失效'→'同时显著弱化/连续衰减/不再可靠维持';
    - derivation step4: '同时失效'→'显著弱化至无法可靠维持',新增'档A逐渐失能而非
      瞬间蒸发'的诚实标注;
    - falsifiability(b): '证伪相变非线性'→'削弱结构性转换独特性,退化为平凡单调关联';
    - 全档'相变非线性'→'结构性转换'。连续驱动量→不连续响应在物理上是可能的
      (连续降温→冰点相变),但经验证据尚不足以在~100-250区间确证此机制;当前措辞
      与BR-L2-009'软约束'无张力——软约束是驱动量侧,结构性转换是响应侧,二者可共存。

    [required #3 — A/C边界锋利化] 采用审查者建议(b)的变体——不以'成文/专职/国家'
    为硬门槛(太严会使命题退化为'文字出现→法院出现'的平凡关联),但加了常设性约束
    以防止弹性归类。档C最低制度门槛=(1)常设第三方裁决机制+(2)跨亚群管辖权宣称+
    (3)裁决集体约束力。成文/专职/国家执行是强化证据(intensification)非门槛。关键:
    同一门槛三要素统一适用于所有案例,冰岛(通过)/易洛魁(通过)/澳洲 elders' councils
    (不通过,因缺常设性)→判据锋利,无双重标准。此门槛的优点:既保留'口头法+兼任仲裁者
    也可构成proto-C'的理论包容性(覆盖前文字制度化),又通过常设性排除 ad hoc 调解
    的弹性归类。falsifiability(a)同步更新,引用最低门槛三要素替代原来的'法院/成文/专职'。

    [should #4 — 模式D穷尽性] 接受审查者指出的缺口。在 derivation step3 显式分析
    模式D(仪式性/周期性维持),论证其不构成独立路径:仪式能传输共享规范(Dreaming→
    什么是公平的共识),不能裁决跨亚群争端(张某vs李某谁占了便宜)。裁决需要要么当事方
    交涉(档A,规模>熟人圈不可靠)、要么第三方裁决(档C最小形式)。若周期性集会中 elders
    组成常设裁决体→proto-C(满足C门槛);若仅传输规范无裁决→功能档B(规范名义共享但
    裁决碎片化)。结论:模式D塌缩为proto-C或档B,不产生独立第三条路径。以澳洲 songline
    为经验注脚:Dreaming 传输规范但争端裁决停于 band 层,支持'规范共享≠裁决统一'区分。

    [should #5 — BR-L2-010权重] 同意审查者判断,诚实降权。nontriviality_test 中
    brick=conclusion段重写:BR-L2-010 明标为'制度经济学教科书级,近定义而非发动机',
    其角色从'可替代性经验锚'降为'确认替代在原则上是可能的制度可行性前提'。真发动机
    归位至 BR-L2-004+BR-L2-009+THEOREM-group-identity-decay 三角,真非平凡卖点
    归位至碎片化档B(证明制度化非自动)。

