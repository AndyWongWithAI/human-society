    definition_vs_prediction: |
      未命中。档A的"三个维持条件"(信任覆盖+重复交互+共享身份)是作者对档A机制的经验分析,
      非档A的操作化定义。档A的操作化定义是"当事方直接交涉+熟人调解+无制度载体+跨亚群统一"
      ——这些可独立观测,不蕴含">150 时不可能"。故空格预测是真经验主张,非同义反复。

      但需诚实标注:档 C 最低制度门槛相当包容(口头法+兼任仲裁者+年度常设集会=proto-C),
      使 falsifiability(a)的空格在操作层较难被填——因为在人类社会中,>150 且维持跨亚群
      统一公平裁决的群体几乎必然会发展出某种常设议事机构(哪怕是最低限度的 elders' council)。
      这使 (i)/(a) 臂有"近解析"倾向,但这不是定义性同义反复——核心主张仍是经验性的:
      如果存在一个 >150、统一公平、无任何常设裁决体的社会,推论被直接证伪。此格之"难填"
      (正因在人类社会中确实很难在没有常设裁决体的情况下维持 >150 的统一公平)恰恰是推论
      的实证力所在。与 nontriviality_cell_check 同源分析,通过。

    enumeration_and_species: |
      未命中(经过 round-1 模式 D 修补后穷尽性稳固)。A/B/C 三分类+derivation step3 模式 D
      分析共同构成穷尽论证:档A(面对面统一)→档B(碎片化)→档C(制度化,从 proto-C 到 full-C)。
      模式 D(仪式性/周期性维持)经分析塌缩为 proto-C(有常设裁决体的周期性集会)或档 B
      (仅规范传输无裁决→功能碎片化),不构成独立第三路径。论证结构:仪式→传输共享规范
      (CONCEPT-fairness(a)(b) 共识)→不替代裁决;裁决需当事方交涉(档A,>150 不可靠)或
      第三方裁决(档 C 最低形式)。区分"规范传输"与"争端裁决"是关键——此区分独立可测
      (民族志中规范陈述 vs 实际判例)。澳洲 songline 经验注脚正面支持此区分。

      【我的主动猎第 N+1 类】(全新候选,不复用 round-1):
      - 古希腊城邦(Doric Crete)的 andreion(男子公餐):固定成员、定期集会、共餐仪式→
        有固定日程=常设,公餐中是政治/司法议事→proto-C。
      - 中世纪冰岛 hreppr(百户区公社):固定成员、年度集会、裁决内部事务→proto-C。
      - 非洲 age-set systems(Maasai/Kikuyu/Nyakyusa):年龄级横切世系,定期集会,裁决跨
        世系争端→proto-C。
      - 美拉尼西亚 big-man 体系:big-man 靠个人声望+再分配维持影响,非常设裁决体,跨氏族
        裁决靠谈判+冲突→档 B(碎片化,各氏族自主)。
      - 南印度 panchayat(五老会):固定或 semi-fixed 成员、按需召集但具有常设身份→此"按需
        召集"落在常设性边界的灰区,但 panchayat 的身份是常设的(slate of eligible elders),
        召集虽 ad hoc 但裁决有跨亚群约束力→我判 proto-C(成员常设性满足门槛),但作者可
        争议。此灰区见 should_notes_nonblocking 第 3 条。
      - 中世纪北欧的 hundari/härad(百户区):年度 thing 集会,裁决跨农场争端→proto-C。
      逐一测:全部落 proto-C、B 或出射程;【未净到活的第四 species】。穷尽性稳健。

    primary_suspect_aim: |
      指对且已够格。文件自认最弱腿(primary_suspect):"空格预测(档A在>150时为空)压在
      '档A三个维持条件在超Dunbar时全部显著弱化至不可靠'这条腿。最脆弱环节:是否存在非制度、
      非碎片化的机制可在>150时维持跨亚群统一公平【裁决】能力。"这确是最脆弱环节,且正是
      derivation step3 模式D分析(规范传输≠争端裁决)所关死的攻击面。secondary_suspect
      (BR-L2-015在公平域的适用边界+BR-L2-010从交换域推广到公平域的同构有效性)也是合理
      顾虑,已在 discriminant_validity 中讨论。unlikely_suspect(BR-L2-004层级普适性)
      正确评低。无更致命的它没认的软肋。

      平凡化威胁方面:与 BR-L2-004(">150→任何层级")的边界——若公平制度只是"任何层级"中
      的碰巧附带项,则推论退化为同义复述。防线的关键是碎片化档B的存在——它证明制度化不是
      自动的(若>150自动出层级且层级自动含公平制度,档B也应为空),公平制度有独立选择压力。
      此防线稳固。与 DED-002("规范是否写下来")的判别——共享规模驱动量但被预测量不同
      (成文 vs 制度化→碎片化分支)。与 Weber/法律社会学——独有内容=空格+结构性转换+分支,
      非"现代化→法理性化"定性叙事。平凡化守卫三线均成立。通过。

  counterexample_hunt: |
    本轮【亲自】猎捕(全新候选池,刻意不复用 round-1 的易洛魁/冰岛/澳洲 songline),
    目标填格4:>200人、>20年、跨亚群统一公平规范、无任何常设第三方裁决机制(按三要素:
    无定期集会裁决体+无跨亚群管辖权+无裁决约束力)。逐一:

    - 古希腊 Doric Crete andreion 体系(~7-3世纪BCE):公餐团体固定成员、定期集会,兼具
      政治/司法议事功能→定期集会+跨家族管辖+裁决约束=proto-C。不填格。

    - 早期以色列支派联盟(士师时期,~1200-1020BCE):各支派自主裁决争端,跨支派争端靠 ad hoc
      军事领袖(士师)协调→非定期常设裁决体。但"各人任意而行"(士师记)——跨支派公平规范
      不统一(支派间常内战,如便雅悯战争)→功能档B(碎片化)。不填格,反哺(iii)碎片化预测。

    - 美拉尼西亚 big-man 社会(Trobriand/新几内亚高地):人口常>200、数世纪延续。big-man
      靠声望+再分配维持影响,非常设裁决体,跨氏族争端靠谈判/互惠/冲突→无跨亚群统一公平
      裁决机制。但考察跨氏族公平标准:big-man 体系下各氏族自决争端、"外人"争端靠谈判或
      冲突解决→无跨氏族统一公平规范→功能档B(碎片化)。不填格,反哺(iii)。

    - 南印度 panchayat 体系(前殖民期):"五老会"成员常设身份(slate),召集按需,裁决跨亚
      种姓/亚氏族争端,裁判被承认有约束力→成员身份常设性满足"常设"门槛,归 proto-C。
      Panchayat 落在"按需召集"的灰区,但其成员名单是常设的(非每次临时指定)、此机制在需
      要时立即可召集→我判满足常设性。即使取作者更严立场(需固定会期),panchayat 频率
      (~季/半年度实践)→仍在 proto-C 门的常设侧。不填格。

    - 西非"无国家社会"Tallensi/Lowilii(殖民前):>200人、世系分支社会。争端在 lineage
      内部由 elders 裁决(定期/常设)、跨 lineage 争端靠世系族长协商(ad hoc 非常设)。
      跨 lineage 无统一的常设裁决体。但考察公平:跨 lineage 争端靠谈判+互惠+有时冲突,无
      跨世系统一公平规范→功能档B(碎片化,各世系自主)。不填格,反哺(iii)。

    - 中世纪冰岛 hreppr(百户区公社,~10-13世纪):~20 户自由农组成,固定成员、年度集会、
      裁决内部事务(济贫/牧场分配/保险)。但每个 hreppr 自身<150→不跨 Dunbar,且 hreppr
      之间争端靠 Althing(档C)。属"可及内",不填格。

    - 中世纪瑞士农村公社(13-15世纪,联邦形成前):各村社<150,跨村社争端靠 Landsgemeinde
      (全州公民年度集会+投票+司法)→年度常设+跨村社管辖+裁决约束=proto-C。不填格。

    - 印加帝国前的安第斯 ayllu 联盟:各 ayllu<150 靠亲缘+互惠,跨 ayllu 联盟(>200)通过
      kuraka(世袭首领)协调。kuraka 裁决跨 ayllu 争端,其位常设+定期集会+跨 ayllu 管辖权+
      裁决约束→proto-C。不填格。

    结论:【净杀=无】。全部候选落 proto-C(有某种常设裁决机制)、档 B(碎片化)、或出射程
    (可及内/<150)。数条(早期以色列支派联盟/美拉尼西亚 big-man/Tallensi)正面反哺预测(iii)——
    规模以上不制度化则碎片化。且本轮猎捕反证了一个稳健模式:>200 且维持跨亚群统一公平的
    社会,无一例外地发展出了某种常设裁决体(哪怕仅年度集会+口头法+兼任仲裁者)。此模式
    本身就是推论的实证支撑。verified 硬门第 2 条(亲自猎捕、无 scope 内活反例)通过。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):未重蹈其致命形式。round-1 识别的轻度回声(A/C 分类边界模糊
    允许弹性归类→潜在反例被推出空格)已通过三要素门槛锋利化关死——同一门槛统一适用所有
    案例,门框无弹性。本轮的灰区测试(panchayat 的"按需召集"落在常设性边界)可争议但不可
    弹性化——无论取常设侧还是 ad hoc 侧,panchayat 的实际频率(~季/半年度)使其稳落常设侧,
    不存在"同一案例可在 A/C 间弹性归类"的病灶。

    此外需诚实标注:falsifiability(a)的空格在操作层较难被填——因为三要素门槛的包容性
    (口头法+兼任仲裁者+年度常设=proto-C)使大多数 >150 且维持统一公平的社会将自动满足
    proto-C。这【不是】DED-004 的循环(并非"因有制度故推有需求→因有需求故推有制度"——
    自变量群体规模与因变量公平维护模式独立可测),而是"机制预测如此之准以致反例难觅"的
    正向特征——只要三要素门槛是事前固定且独立于规模判定(anti-talisman 在位),此特征就是
    推论的实证力而非不可证伪性。门 3 通过。

    DED-007(焊死测量轴):未重蹈。群体规模(人口普查/考古)与公平维护模式(民族志/史料中
    争端解决描述)异源独立测量,无分母偷用结果测、无自变量含因变量。BR-L2-009 明确说
    "不是某个精确人数的硬悬崖"——本推论经 round-1 修订后的"结构性转换"措辞与此无张力
    (软约束是驱动量侧,结构性转换是响应侧)。DED-007 死因完全不适用。门 3 通过。

  verified_gate:
    no_required_defect: "过。round-1 三条 required(易洛魁反例未决/相变缺证据/A-C边界模糊)均已关死;本轮全新审查未生成新 required。残留均 should/minor。"
    personal_counterexample_hunt_no_live: "过。本轮全新8候选亲自猎捕,净杀=无;3条正面反哺预测(iii);猎捕本身反证了'规模以上统一公平必有常设裁决体'的稳健模式。"
    no_ded004_007_recurrence: "过。DED-004循环阈值关死+三要素统一判据无弹性;DED-007测量轴异源正交无焊点。Falsifiability(a)空格难填系推论实证力非不可证伪性。"

  should_notes_nonblocking:
    - |
      [should] prediction(i)的括注"(法院/成文规则/职业法官)"比 operationalization 的档 C
      最低制度门槛(口头法+兼任仲裁者+常设集会=proto-C)更窄,属 round-1 修订未完全同步的
      残留。宜将括注改为"(从 proto-C 常设口头裁决体到完全制度化的法院/成文规则/职业法官)"
      或简化为"(按 operationalization 定义)",使预测措辞与操作化定义一致。
    - |
      [should] prediction(i)中"出现概率"隐含二值化 C(出现 vs 未出现),而 operationalization
      明确定义 A/B/C 为谱系。虽然最低制度门槛三要素提供了可操作化断点,但"谱系"与"概率"
      两套语言之间的概念张力宜在 prediction 段显式标注(如"以最低制度门槛三要素为 C 的
      操作化判断标准,该谱系端点的出现概率与群体规模之间存在...").
    - |
      [minor] "常设"(regularly-convened)的频度标准可进一步指定,防止未来边际案例的分类争议。
      当前实际案例(冰岛年度/易洛魁定期/澳洲 ad hoc)边界清晰无需频度阈值,但 panchayat 类
      "成员常设+按需召集"的灰区可能在未来被挑战。建议给出一个频度锚(如"至少每年一次固定
      会期"或"有制度化召集规则且实际平均≥1次/年"),类比 EMP-TEST-004 的预注册。

