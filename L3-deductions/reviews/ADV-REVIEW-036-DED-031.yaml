    直接尾随危机曝光,按文件已注册的识别纪律不得计入(iii)证据,只计(i)(d)。
    被消化,且把跨体制判据从"计划/福利国家/联邦民主"扩到超国家科层——
    可作(d)支持锚候选(收编留作者)。
    【猎二:攻(iii)——独立核查公开可得但失真不收缩(换族再试)】
    候选:印度官方教育统计 vs ASER 独立调查、美国 UCR 警方记录 vs NCVS
    受害调查——独立基准公开数十年,官方数与之的缺口未系统收敛。核查:两处
    独立基准均未接入被考核者的问责链(不触发处罚),按事前注册的 limitation
    ("核查技术的存在不等于被使用,纸面技术不算")前件(3)未松动,射程外。
    被消化(与 r2 猎二同构、不同案例族)。附注:该 limitation 承重极大,
    守住的条件是"实际执行"永远以制度记录测、不由失真结果反推——现文本
    anti_talisman 已封,但 s2(基线时点)修复会让它更稳。
    【猎三:填非平凡格——三前件齐备+上报长期无系统偏差】
    候选A:越战 body count(军队产出指标硬挂钩+自报+核查昂贵)——史实为
    系统性虚报,是支持不是填格。候选B:日本毎月勤労統計 2019 年抽样违规——
    失真方向与考核受益梯度无关(经费/人力不足的便宜行事,统计机构自身不被
    该指标考核),落 excluded_outcomes(3) 非策略性误差,非填格。候选C:
    2014 后受 Eurostat 强化审计的欧盟成员国财政上报——前件(3)不满足,
    射程外反成对照。格仍未被填。
    【猎四:攻判据本身——负向指标×降幅考核的基期方向(本轮 required 引信)】
    中国十一五节能减排约束性指标(单位GDP能耗降20%/SO2降10%,一票否决级)
    下,文献记录的博弈包括基期能源数据上修与分母(GDP)联动调整;EU ETS
    第一期按自报历史排放基线分配免费配额,基线系统性虚高致超额配置。两例
    受益方向均为【基期报高】——由考核文本(降幅型奖惩函数/配额∝基线)事前
    可导,但现行决策树字面输出"报低"(错号)。非净杀(总原则层面方向仍从
    考核结构事前可导,机制反而再获两例跨体制支持),但揭出注册工具的符号
    缺口与 R4b 豁免措辞过强——升为 required-R5。

    总结:四路均未净杀。猎一/猎三反哺支持与对照;猎二被事前注册 limitation
    消化;猎四揭出别处过度伸张(工具符号约定+豁免措辞),定位为 required-R5。
    scope 内无活反例,但 verified 第一条门(无 required)未过。

