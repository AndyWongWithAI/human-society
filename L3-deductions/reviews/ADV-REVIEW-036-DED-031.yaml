    【猎一:攻(d)——希腊财政赤字统计(超国家科层,新体制类型)】
    赤字=负向指标,与欧盟《稳定与增长公约》超额赤字程序硬挂钩(制裁+入欧元区
    资格),数据由成员国政府自报,2010 年前 Eurostat 无实地审计权(核查昂贵)——
