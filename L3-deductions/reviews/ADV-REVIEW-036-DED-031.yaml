    技术时点测,失真由上报−独立基准测,自变量不从被预测量反推;anti_talisman
    显式封死三条反推路径与"隐性考核压力"事后消解。无循环。
    DED-007(测量轴焊死)复发检查——通过:考核文本(制度档案)、采集制度(制度档案)、
    核查技术(技术/制度事件)、失真度(上报vs卫星/垂直采集/擦除分析)四轴异源,无共享
    分母。唯一近亲问题是核查"实际执行频率"对失真曝光的内生性(should-s2)与干预
    时点内生性(required-1)——这是识别层面的内生性,不是 DED-007 式测量焊死,
    修法明确。第三条门通过,但第一条门(required)未过→needs_revision。

