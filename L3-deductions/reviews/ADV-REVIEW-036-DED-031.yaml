      ①benefit_direction 增注册分支"(0) 负向/削减类指标(污染/犯罪/事故/死亡率/
      等待时间/贫困存量等,考核奖励其下降)→报低";②reporting_distortion.
      measurement 方向例示同步;③文件内显式留痕:该分支注册晚于空气质量/NHS
      数据见数,豁免反向裁的理由是总原则对负向指标输出无歧义、不存在方向分叉
      (L4-009 的伤害条件是"事后选择方向恰好救推论",此处无可选方向);
      ④derivation 步骤4"完整分支清单"措辞与 limitations"包括但不限于"对齐。

  counterexample_hunt: |
    五路主动猎捕(与 r1 四路不重叠,目标覆盖 d/iii/非平凡格/冲突规则/N+1类):

    【猎一:攻(d)——COVID-19 疫情上报的方向检验】
    防控问责体制下(病例数=负向指标,与官员问责硬挂钩),预测报低——武汉初期
    及多地瞒报方向命中;而补贴按病例拨付的通道下(美国医院 Medicare 编码争议)
    出现报高方向争议——方向随各自考核/补贴结构走,跨结构方向翻转恰是(d)的
    强形式支持。被消化;但两例的裁决都需要"负向指标→报低"与"补贴资格→报高"
    的分支——前者未注册(坐实 R4),后者是分支(2)的镜像(资格类考核里"受益方向"
    随资格判据方向走,分支(2)措辞可容纳)。
    【猎二:攻(iii)——核查技术公开可得但失真不收缩】
    夜间灯光/多源物理量数据公开多年,跨国比较中部分政体 GDP 虚报未收缩。
    净杀候选——但文件 verification_cost.limitations 已注册"核查技术的存在
    不等于被使用,以实际执行频率与覆盖率为准,纸面技术不算":灯光数据未进入
    这些政体的问责链,发现概率未变,期望惩罚未变——按注册口径前件(3)未松动,
    落射程外。被消化(该 limitation 是事前注册的,非事后开脱);同时凸显 s2
    (执行频率须取干预前基线)的必要性。
    【猎三:填非平凡格——三前件齐备+上报长期无系统偏差】
    候选A:德国联邦制下州级统计——联邦统计法赋予统计机构专业独立,统计数字
    不挂钩州官员个人考核(前件1不满足),且欧统局交叉核查(前件3不满足),射程外,
    反成对照支持。候选B:瑞士市镇财政上报——直接民主审计+联邦财政均衡的
    第三方核算,前件(3)不满足,射程外。未找到前件齐备而长期无偏差的活反例,
    格未被填。
    【猎四:压力测试已注册的多通道冲突规则——大跃进复核+同档打平构造】
    大跃进双通道按新注册规则裁:政治通道一票否决级落个人 > 征购损失落农民
    →报高,与史实一致,消化干净,r1 留下的收编资格确认成立。继而构造同档
    打平案例:同一上报量进入两个均硬挂钩个人的考核、方向相反(如产量同时是
    当期晋升硬指标与下期棘轮基数硬指标且同权重)——注册规则无输出。未猎到
    干净史例(现实中挂钩强度几乎总有档差),判 should-s5(注册弃权条款)而非
    required。
    【猎五:猎第N+1指标类——犯罪统计降级】
    英国警方记录犯罪数据 2014 年被 UK Statistics Authority 撤销国家统计
    资格,起因即绩效压力下"no-criming"降级记录(报低犯罪数)——负向指标+
    自报+核查昂贵三前件齐备,方向命中"报低"。本应是教科书级支持锚,但注册
    决策树无分支可套——再次坐实 R4:缺口不是构造出来的,是现实大宗类别。

    总结:五路均未净杀。猎一/猎五合力揭出 R4(负向指标分支缺失,required);
    猎二被事前注册的 limitation 消化;猎三反哺两个对照;猎四确认冲突规则可用
    并产出 s5。scope 内无活反例,但 verified 第一条门(无 required)未过。

  non_recurrence: |
    DED-004(不可证伪循环)复发检查——通过:整改未引入任何由结果反推前件的
    路径;benefit_direction 的注册程序连同反向裁承诺反而收紧了循环入口。
    R4 是枚举缺口,不是循环:负向指标的方向由考核文本(奖励下降)事前可导,
    只是工具没写全,不存在"看到报低才说该报低"的结构(总原则输出无歧义)。
    DED-007(测量轴焊死)复发检查——通过:四轴异源未变;层级计数口径(R3a)
    按该层考核文本判,不用失真结果;新注册的方向决策树输入全部来自制度文本。
    第三条门通过;第一条门因 R4 未过 → needs_revision。

  required_fixes:
    - "R4a 在 operationalization.benefit_direction 注册分支(0):负向/削减类指标(污染浓度/犯罪数/事故数/死亡率/等待时间/贫困存量等,考核奖励其【下降】)→报低;reporting_distortion.measurement 的方向例示同步增列。"
    - "R4b 显式留痕:该分支注册晚于空气质量/NHS/犯罪统计数据见数;豁免反向裁的理由(总原则'使被考核者受益方向'对负向指标输出无歧义、无方向分叉,不构成 L4-009 式事后选择)写入 benefit_direction.limitations;derivation 步骤4 '完整分支清单'措辞与'包括但不限于'对齐。"
    - "R4c(顺带,一并做) 大跃进双通道案例按已注册冲突规则收编为 (d) 支持锚;NHS锚标题'预测 i + iv'笔误改为'预测 i + d'(s4,举手之劳,随本轮一并清)。"

round_3:
  reviewer: "独立子Agent (round 3, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    先验收 round_2 的三条 required——全部落地,逐处核对通过:
    【R4a 验收✓】benefit_direction.measurement 决策树分支(0)已注册(负向/削减类
    指标→报低,置于序列之首);reporting_distortion.measurement 方向例示同步增列
    负向类并加指针。空气质量/NHS/犯罪统计类案例现有注册分支可套。
    【R4b 验收✓】limitations 显式留痕(分支(0)注册于 round-2,晚于三锚见数)+
    豁免反向裁理由写入;derivation 步骤4 改"分支清单(当前注册版本,包括但不限于)";
    anti_talisman 同步;"上述六支"计数一致。
    【R4c 验收✓】大跃进双通道锚已收编(预测 d,evidence 按注册冲突规则完整走导出,
    显式注明收编晚于规则注册+r2 复核,confidence: moderate);NHS 锚标题已改
    "预测 i + d"(s4 清账)。

    但本轮独立攻击猎出一条新的 required(红旗11 同族,且正好长在 R4b 豁免理由上):

    【required-R5(本轮新增):分支(0)的符号约定只对"水平/存量考核"成立——
    决策树对"降幅/改善量(delta)类考核"字面输出错误方向,且 R4b 豁免留痕中
    "没有任何读法能导出'污染考核下报高'"是可证伪的过强声称】
    构造+实证检查:当考核文本奖励的不是负向指标的【水平】而是其【降幅】
    (现实大宗——中国十一五单位GDP能耗下降20%/主要污染物减排10%约束性指标、
    各国"犯罪率下降X%"类考核、EU ETS 按历史基线分配免费配额),被考核者的
    受益方向在【基期/基数期】反转为报高:抬高基期能耗/排放/犯罪存量,降幅
    自动变好——十一五期间省级基期能源数据上修与 EU ETS 第一期基线排放虚高
    超额配置均是文献记录的实例。逐分支套现行决策树:分支(0)字面输出"报低"
    (错,基期受益方向是报高);分支(4)(5)的基数逻辑本可覆盖,但其措辞
    ("压报藏产能""新任报低基数")符号约定硬编码为正向指标,对负向指标同样
    字面输出"报低"(错)。即:一个可从考核文本【事前】识别的常见考核类型
    (水平考核 vs 降幅考核,写在考核文件里),注册工具给出系统性错号输出。
    按文件自己的承诺("禁止见数后新增分支,事后选分支一律反向裁"),若未来
    delta 类案例进锚,届时补注册即触发反向裁自伤——现在(先于任何 delta 案例
    入锚)注册是唯一干净路径,故本轮判 required 而非放行。
    连带:R4b 豁免理由的根基措辞过强——"没有任何读法能导出'污染考核下报高'"
    为假(降幅考核下基期报高就是一个合法读法);豁免结论对【既有锚】仍成立
    (空气质量锚是浓度水平/达标考核、NHS 是等待时间水平/阈值考核,考核文本
    属水平型,无分叉),但豁免理由须收窄为"对负向【水平】指标输出无歧义",
    否则留痕文本自身经不起红旗11 检查。
    减刑理由(为何 needs_revision 而非更重):与 r2 的 R4 同构——这是工具的
    符号约定缺口,不是方向自由度;水平型 vs 降幅型由考核文本事前可判,不存在
    "见数后挑方向救推论"的结构;既有六锚全部是水平/阈值型考核,导出与史实
    方向的命中均不受影响,主干无损。

    should 清单(不挡门):承接 s2(核查执行频率取干预/曝光前基线)、s3(监测点
    周边物理博弈增为 boundary_case,射程仅覆盖上报失真)、s5(同档打平弃权条款)、
    s6("派生指标"定义);本轮新增 s7——分支(2)措辞只写"救济/扶贫/补贴资格类
    →报低",对"配额/资源分配随上报量【正向】变动"的镜像(报高,如 ETS 基线
    配额、按病例数拨款)r2 称"措辞可容纳",建议随 R5 一并显式化为"资格/配额类
    方向随资格判据符号走",消除容纳性解释空间。

