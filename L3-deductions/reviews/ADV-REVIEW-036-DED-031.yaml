id: ADV-REVIEW-036
type: adversarial_review
reviews: DED-031
layer: L3-deductions

人话摘要: |
  对 DED-031(指标治理下的策略性上报失真)的 round_1 独立对抗审查。裁 needs_revision:核心机制(动机×失真空间×核查带宽→上报向受益方向系统漂移)结构扎实、方向可事前导出+层级梯度+核查成本弹性三条独有内容确实不被相邻理论覆盖,反例猎捕未净杀(大跃进双通道冲突、监测点周边物理博弈、清代粮价奏报均被消化或落射程外)。但三条 required:(1)预测(iii)的"核查技术引入时点独立于数据结果"是外生性过度声称——旗舰锚(2019统一核算、环保垂直改革)的改革时机恰恰内生于已暴露的失真,均值回归可冒充"失真收缩",(iii)须与(i)同等识别纪律;(2)GDP锚对(iii)的"命中"部分是机械的——统一核算后省级数与全国数不再独立生产,收敛近乎按构造成立;(3)两处判据缺口径注册——预测(ii)"利益关联层级数"如何计数未注册,方向导出规则的多分支(报高/报低/bunching/棘轮/换届)缺一次性注册的决策程序与多通道冲突裁决规则,按 L4-009 判例这是 required。

target: DED-031
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。评分卡红旗 11 条逐项攻+反例猎捕(必做)+DED-004(不可证伪循环)/DED-007(测量轴焊死)复发检查。裁决三态照评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活反例③未重蹈 DED-004/007。

round_1:
  reviewer: "独立子Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    这是一条机制清晰、诚实度高、明显学懂了 DED-004/007 教训的候选:三前件均以制度
    事实(考核文本/采集权归属/核查技术时点)独立编码,失真以"上报−独立基准"差分测量,
    anti-talisman 防线(不得由失真反推前件、不得事后追加隐性考核压力、方向须看数据前
    注册)结构到位;判别段与 Goodhart/委托-代理/体制特殊论逐一切割,三条独有内容
    (方向事前导出/层级梯度/核查成本弹性)确实不是格言级常识。反例猎捕四路出击均未
    净杀(见 counterexample_hunt)。

    但三处 required 缺陷挡住 verified:

    【required-1:预测(iii)的外生性过度声称——文件自己的锚反驳自己的措辞】
    statement 与 discriminant_validity 反复声称"核查技术引入时点是独立于数据结果的
    制度事件"。可查事实是:2019 年地区生产总值统一核算改革,时机上直接尾随辽宁(2017)
    /内蒙古(2018)自曝挤水分;环保监测垂直管理与自动化直采改革,直接尾随西安堵棉纱案
    等失真曝光。即改革【时点可文档化】≠改革【外生】——核查升级恰恰是对已暴露失真的
    响应,在失真峰值处引入干预,其后的"收缩"可由均值回归+同期专项整肃混杂冒充。
    文件对预测(i)自觉要求双重差分("单纯前后对比不算数"),却对预测(iii)只做前后对比
    且贴上外生标签——同一识别纪律双标。此为红旗7(锚过度解读)+识别声称失实,required。
    可修:撤"外生/独立于数据结果"措辞,改为"引入时点可文档化但常内生于历史失真,
    识别须用分批推开(不同地区/站点改造时点错开)+未改革对照"——空气质量锚实际上
    正是这样设计的(以站点自动化改造时点为事件、卫星为独立基准),故(iii)可救。

    【required-2:GDP 锚对(iii)的"命中"部分是机械收敛,非威慑收缩】
    统一核算=核算权上收,改革后省级生产总值由国家统计局统一核算,省级加总与全国值
    不再是两个独立生产的数——"差距基本消失"在相当程度上是按构造成立(渠道被拆除),
    不是"发现概率上升→期望惩罚上升→失真收缩"这条机制链的证据。该锚对预测(i)
    (改革前的持续正差+挤水分自证策略性成分)仍有效,但(iii)的证据资格须移交给
    空气质量锚(改造后上报浓度向上跳变,基准与上报链独立)或改用改革前后仍独立的
    第三方基准(夜间灯光/用电量/铁路货运)重述。附带一处措辞过热:"证实失真为策略性
    而非口径差"——自曝证实存在策略性【分量】,不证明口径差贡献为零(文件自己的
    primary_suspect 正是口径混杂,前后不自洽)。

    【required-3:两处判据只有名字没有口径(L4-009 判例,红旗11)】
    (a) 预测(ii)的自变量"数据经过且有利益关联的科层层级数"——哪一层算"利益关联"?
    机械转发层计不计?文件 secondary_suspect 已自觉到"层层加码需考核压力逐层传导"
    这一附加条件,但没把它变成计数口径。须注册:仅当该层级自身被同一(或派生)指标
    考核挂钩(按该层考核文本事前判)才计入层级数,转发层不计。否则(ii)的检验中层级数
    可事后伸缩,按判例一律反向裁。
    (b) 方向导出规则实际上是一棵多分支决策树(增长→报高;救济→报低;达标线→bunching;
    基数/棘轮条件→反转;换届+基数考核→新官报低),分支散落在 derivation/falsifiability/
    boundary_cases 三处,且缺两条关键规则:①同一上报量进入多个考核、受益方向冲突时
    (如产量报高利于当期计划考核、却抬高征购基数/未来棘轮)的裁决规则——建议注册为
    "以被考核者【个人】的考核净受益为准,冲突时按挂钩强度档位(硬>软)裁";②禁止见数
    后新增分支的显式承诺。方向可导出性是文件自认"最抗打的独有内容"(d),其导出程序
    的口径必须一次性注册,否则聪明作者可事后挑分支救任何符号——这正是 L4-009 死法。

    三条均可定向修订,核心机制与(i)(d)的主干不动摇,故 needs_revision 而非 rejected。
    另有四条 should(不挡门):(s1) 失真形态清单应标注"包括但不限于"——跨期平滑/
    藏产能(棘轮应对)是第四种形态,机制内可导出但未列;(s2) verification_cost 以
    "核查实际执行频率"为准的 limitations 本身有内生性(失真曝光→核查加频),应注明
    执行频率须取干预前基线值;(s3) 空气监测的"监测点周边物理博弈"(监测站附近洒水/
    限行)应增为 boundary_case——博弈从数据通道迁移到测量环境通道,上报失真收缩的
    同时指标代表性失真出现,推论字面存活但须注明射程只覆盖上报失真;(s4) NHS 锚
    引用的"预测 iv"编号笔误(statement 只有 i–iii,方向/bunching 属 (d))。

  red_flag_findings:
    brick_conclusion: |
      未命中。逐字核对两块 L2 承重砖原文:
      BR-L2-001(有限理性)statement 只说"无法穷尽选项/无法精确计算/满意解"——是
      核查带宽约束的零件,不含任何"考核+自报→失真"的结论。
      BR-L2-010(非人格化制度替代)statement 只说"非人格化制度能替代人际信任支撑
      陌生人交换,且不免费"——被本推论借用为预测(iii)的干预方向零件(非人格化核查
      替代对上报链的依赖),属机制类比式引用,砖内无"核查成本下降→失真收缩"原文。
      AXIOM-001(稀缺)只给竞争动机;THEOREM-hierarchy-depth-limit/DED-001 只讲
      无意的信息衰减——衰减无方向,策略失真有方向,方向性确为本推论增量。
      结论"考核挂钩的自报数据向受益方向系统失真"不在任何砖中原文/近义出现,
      也无为本推论窄化的专用砖。不判 required。
      一处诚实点名值得肯定:derivation 步骤6自认 BR-L2-010 的引用是"类比式"的
      发动机而非逐字推导——此借用(信任替代→核查替代)逻辑上成立但属额外假设,
      强度弱于其余砖,文件未隐瞒。

    nontriviality_cell_check: |
      通过,但有一处借用债。2×2 表的非平凡格(前件齐备→系统性方向失真且幅度随核查
      成本与层级单调)是真经验主张:AXIOM-001 只给动机不给失真结论;层级定理只给
      无方向衰减;BR-L2-001 只给算不过来;BR-L2-010 只给制度可替信任——没有砖平凡
      强制该格。证伪格(前件齐备,无系统方向)有真实填充可能(见 counterexample_hunt
      的清代粮价奏报讨论——最终因前件不满足落射程外,但猎捕路径是真实的)。
      借用债:该格中"幅度随层级单调"的部分依赖"每层皆有再加工动机"这一附加假设,
      文件 secondary_suspect 已自认——与 required-3(a) 的层级计数口径合并处理即可。

    measurement_orthogonality: |
      主干通过,一处 should 级内生性。三个驱动量与被预测量异源:
      - 考核挂钩强度←考核制度文本编码(权重/一票否决/晋升关联),不含数据结果信息;
      - 数据生产控制权←采集权制度归属文件;
      - 核查成本←核查技术存在性+制度事件时点;
      - 被预测量←上报值−独立基准值(卫星/垂直采集/擦除分析),差分设计消基准系统偏差。
      无 DED-007 式共享分母/焊点:自变量没有任何一个用"上报数据本身"或"失真结果"
      测量。anti_talisman 三条反推禁令precisely封住了焊死路径。
      【should-s2】verification_cost 的 limitations 要求以"核查实际执行频率与覆盖率"
      为准——执行频率对失真曝光内生(出事→加频核查),若用事后频率给核查成本分档,
      会把"失真严重"错编码为"核查便宜"。修法:执行频率取干预/曝光前的基线值,
      或只用技术+制度存在性(纸面口径)并诚实标注偏保守。此与 required-1 的内生性
      是同一族问题,但此处只伤档位精度不伤识别声称,故 should。

    scope_hook_independent_of_result: |
      未命中(通过)。excluded_outcomes 四项均按事前可测渠道划:
      (1) 无考核挂钩——按考核文本判,且自愿充当对照组(加分:排除项反向变预测);
      (2) 第三方直采/垂直管理——按采集权制度归属判;
      (3) 非策略性测量误差——按方向性与受益梯度的符号检验区分,不是事后开脱口
          (因为"前件齐备+无系统方向"被显式登记为证伪格,不能把反例推给测量误差);
      (4) 真实响应——用"同时反映在上报值与独立基准中"的差分逻辑解耦,渠道事前可辨。
      边界案例"挤水分自曝"的消化(新官报低基数受益)初看像事后开脱,但文件事前限定了
      触发条件(换届+增长基数考核并存,换届时点可查)——合规。唯一残留风险即分支
      事后增生,已并入 required-3(b) 的注册要求。

    criterion_tier_match: |
      未命中(通过)。三个驱动量各用三档(无/软/硬挂钩;完全自报/半控制/不控制;
      核查技术有无+执行覆盖),被预测量是连续差值+符号——三档测单调性预测足够,
      未犯 DED-006 连续量硬二分。若未来做层级梯度检验,层级数是计数变量,与三档
      无冲突。不判。

    anti_talisman_cashed: |
      兑现。至少两个承重锚的驱动量真的独立测出:
      - GDP 锚:考核挂钩(干部考核中 GDP 增速权重,制度文件)、数据生产控制权变化
        (2019 统一核算=核算权上收,制度文件)均独立于失真结果可查;
      - 空气质量锚:数据生产控制权剥离时点(国控站自动化改造/垂直管理改革的站点级
        时间表)独立于上报数据,基准(卫星气溶胶)独立于上报链——这是全文件最干净的锚。
      - NHS 锚:考核压力档位由英格兰 vs 威尔士/苏格兰的制度文本差异事前判。
      反推禁令三条+不利证据不得用无文件证据的"隐性考核压力"消解——防线完整。
      不判 required。注意:anti-talisman 承诺"方向看数据前注册"在原理层到位,
      但注册【程序】的口径缺失是 required-3(b),两者不重复计。

    anchor_fact_check: |
      逐锚核查,无致命事实错,两处过度解读(即 required-1/2 的事实基础):
      - GDP 锚:省级加总 2004–2018 持续高于全国核算、峰值年份数万亿元级——属实
        (2012–2014 年间差距约 5–6 万亿元量级)。辽宁 2017 自曝财政虚增、内蒙古 2018
        自曝工业增加值/财政虚增——属实。2019 年起统一核算改革(实际以 2019 年年度
        数据为首个统一核算期,2020 年初执行)、此后差距基本消失——属实。
        【过度解读1】"为独立于结果的制度事件"——改革时机内生于挤水分曝光,见
        required-1。【过度解读2】差距消失部分按构造成立,见 required-2。
        【措辞过热】"证实失真为策略性而非口径差"应改为"证实存在策略性分量"。
      - 空气质量锚:西安 2016 堵棉纱案获刑——属实(2017 年宣判)。自动化改造时点
        后上报浓度向上跳变、以卫星为基准的学术研究——属实(该文献发现改造后上报
        PM 浓度显著上跳,与此前系统性低报被挤出一致)。此锚干净,confidence: strong
        成立。
      - NHS 锚:2000 年代英格兰 targets and terror、Bevan & Hood (2006) 记录博弈
        与操纵、救护车 8 分钟阈值 bunching——均属实且有文献。威尔士/苏格兰对照
        成立。锚内"预测 i + iv"编号笔误(应为 i + d),见 should-s4。
      - 苏联锚:Berliner (1957) pripiski、乌兹别克棉花案(虚报产量骗收购款、经航拍
        等独立核查揭穿、大规模问责)——均属实。
      - 美国教育锚:Jacob & Levitt (2003) 答案串分析、舞弊随高利害问责上升、
        亚特兰大 2009 擦除分析起诉——均属实。
      锚组合跨计划经济/福利国家/联邦民主三体制,跨体制判据兑现。

    definition_vs_prediction: |
      未命中(通过)。三前件是制度事实判断(可为假:某统计无考核挂钩/第三方直采/
      核查便宜——现实中大量存在,前件非空非全称),核心命题与三条预测是可证伪的
      经验主张(证伪条件 a–d 具体、有对照设计要求)。"指标一经挂钩就变博弈对象"
      一句有格言化倾向,但文件立即用三条比较静态把它兑换成预测,未停留在定义层。
      不判。

    enumeration_and_species: |
      轻微命中(should 级)。文件未声称失真形态穷尽枚举,但 derivation 步骤4给出
      三形态(报高/报低/阈值堆积)且说"同一机制统一解释三种表观不同的失真形态",
      有隐性穷尽口吻。主动猎第 N+1 形态——猎到:
      【第四形态:跨期平滑/藏产能】棘轮效应下,被考核者在丰年压报留余量、歉年释放
      (苏联企业藏产能是 Berliner 同一文献记录的对偶行为;企业盈余管理的"藏饼干罐"
      同构)。这不是水平偏移而是【跨期转移/方差压缩】,受益方向仍可从"目标随基数
      棘轮上调"的考核结构事前导出——机制内可消化,故非 required 新洞,但三形态
      清单须改为"包括但不限于",并把跨期形态显式收编(它同时是 required-3(b) 决策树
      的一个分支)。见 should-s1。

    primary_suspect_aim: |
      指得基本准,但漏了一条更烫的腿。文件自认 primary(预测(i)的口径混杂,须 DiD)
      ——正确,这确实是招牌预测的最大归因风险,且文件给出了对的解法。自认 secondary
      (层级累积的借用债)——正确且诚实。unlikely(AXIOM-001)——正确。
      【漏认】:预测(iii)的干预内生性(改革时机响应失真曝光→均值回归混杂)完全
      未被列为 suspect,反而被"外生下降/独立于数据结果"的措辞掩盖——这是文件
      对(i)有自觉、对(iii)双标的盲区,已升为 required-1。
      平凡化检查:上位后是否稀释成"委托-代理需问责"常识?——否。方向的事前导出
      规则、层级梯度、核查成本可逆三条在标准委托-代理文献中不以可测比较静态形式
      出现,discriminant_validity 的切割成立。"指标会被博弈"的常识部分被文件
      自觉让渡给 Goodhart,卖点未压在常识上。通过。

    caliber_registration: |
      命中(required-3)。两处判据只有名字没有口径:
      (a) 预测(ii)的"利益关联科层层级数"无计数口径——哪层算利益关联、机械转发层
      计不计,未注册。层级数是(ii)的自变量,口径缺失使检验可事后伸缩。
      (b) 方向导出是多分支决策树但无一次性注册的完整程序:分支散落三处、缺多通道
      冲突裁决规则(同一上报量进入受益方向相反的多个考核时以谁为准)、缺"禁止见数
      后新增分支"承诺。按 L4-009 判例,判据歧义+事后可选方向=required;若整改后
      仍出现边界案例靠事后选分支得救,该案例应一律反向裁。
      注:被预测量(失真度=上报−基准,符号按事前注册的受益方向)的口径本身注册
      完整,差分设计消基准偏差的处理合格——问题只在上述两处。

  counterexample_hunt: |
    四路主动猎捕,目标依次为证伪条件(d)方向、(iii)干预、非平凡格填充、(ii)层级:

    【猎一:攻(d)——找"方向与考核文本事前导出系统性不符"的案例】
    候选:大跃进粮食产量虚报(1958–59)。同一上报量(粮产)进入两个通道:征购通道
    (报高→按产定购→辖区被过度征购→饿死人,对辖区是灾难)与政治考核通道(报低→
    被打成右倾,个人政治生命终结)。若受益按"辖区福利"算,报高方向违反导出;若按
    "被考核者个人在考核中的净受益"算(statement 原文正是"使被考核者在考核中受益"),
    政治通道的一票否决级压力压倒征购损失(损失落在农民不落在官员),报高方向命中
    事前导出。结论:被消化——但消化【依赖】"以个人考核净受益为准+挂钩强度裁决
    冲突"这条尚未注册的规则,正好坐实 required-3(b) 必须补注册:规则注册前,该案例
    的裁决属事后口径选择,按红旗11不得计为守住;注册后它是强支持锚(跨通道冲突
    下方向仍可导出)。

    【猎二:攻(iii)——找"核查成本外生下降后失真不收缩"的案例】
    候选A:环保监测自动化后,地方转向监测站周边物理干预(监测点附近洒水车、货车
    绕行限行)——数据通道的上报失真确实收缩(自动化直采后改数难),但博弈迁移到
    测量环境通道,指标的代表性失真出现。字面上(iii)存活(推论只声称【上报失真】
    收缩),未净杀;但暴露射程须诚实标注:核查升级压缩数据造假,不压缩"对着温度计
    吹冷气"。记 should-s3 增为 boundary_case。
    候选B:秸秆焚烧卫星监测后出现避开卫星过境时段焚烧——同构,博弈对象从数据
    变为测量时窗。同上消化。
    此路真正猎到的不是反例而是 required-1 的引信:检索(iii)类案例时发现所有旗舰
    干预(统一核算/垂直管理)的时机都尾随失真曝光——"外生"标签站不住。

    【猎三:填非平凡格——找"三前件齐备+上报长期无系统偏差"的政体/组织】
    候选A:清代粮价奏报体系(长期被经济史学界认为质量较高)。核查:粮价非官员
    考核硬挂钩指标(仓储/钱粮亏空才是),且奏报有多渠道冗余(督抚/织造/税关并行
    奏报=交叉核查便宜)——前件(1)(3)双双不满足,落射程外,反成"前件不满足→失真低"
    的对照支持。
    候选B:北欧市政自报统计(高信任文化+资金挂钩)。核查:北欧登记数据体系使第三方
    核验边际成本极低(个人登记号贯通税务/医疗/教育)——前件(3)不满足,射程外,
    同样落入文件已注册的调节预测(自带核查→失真被压缩)。
    候选C:经严格外审的上市公司财报——文件已自行收编为 boundary_case。
    结论:未找到前件齐备而长期无系统偏差的活反例;两个候选均被前件独立判定
    (制度事实,非事后开脱)拦在射程外,且拦截方式恰好行使了对照预测——格未被填。

    【猎四:攻(ii)——层级梯度的反向案例】
    候选:失真集中于基层填报单点、上层机械转发的体系(如全自动汇总的税务申报链)。
    此类案例中层级数与失真无关——但文件 secondary_suspect 已自认此软肋并在
    falsifiability(b) 预登记降格路径(降为单环节失真版本),(ii)是可截肢的预测,
    不伤核心。猎捕确认降格路径的诚实性,同时确认 required-3(a):没有"利益关联层级"
    计数口径,(ii)的检验本身无法执行——梯度预测目前不可检验,不是被证伪。

    总结:四路均未净杀。猎一坐实 required-3(b)(方向裁决规则须先注册后用);
    猎二坐实 required-1(外生性声称失实)并产出 should-s3;猎三反哺两个对照支持;
    猎四确认(ii)的降格路径诚实但当前不可执行。scope 内无活反例,但 verified
    第一条门(无 required 缺陷)未过。

  non_recurrence: |
