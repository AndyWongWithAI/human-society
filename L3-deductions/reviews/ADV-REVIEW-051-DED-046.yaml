id: ADV-REVIEW-051
type: adversarial_review
reviews: DED-046
layer: L3-deductions

人话摘要: |
  对 DED-046(注意力稀缺xMPC收入梯度:注意力-消费恶性螺旋)的 round_1 独立对抗审查。
  裁 needs_revision:核心机制——BR-L2-027(注意力稀缺)×BR-L2-029(MPC收入梯度)→算法推荐
  作为注意力捕获放大器→注意力-MPC放大螺旋——产生了真正的非平凡增量。"同一收入组内算法
  暴露→MPC分化+低收入组内分化更大+跨期螺旋"不在任何承重砖中,BR-L2-027不做MPC方向预测,
  BR-L2-029不做组内预测,螺旋是二者合力+算法机制的涌现产物。未重蹈DED-004/DED-007。
  四条should挡住verified:(1)MPC测量口径(截面/面板/自然实验)未锁定优先级,不同方法可能给出
  不同MPC估计;(2)Sobel vs bootstrap中介检验方法歧义,未规定不一致时的裁决优先级;(3)中介
  效应"减弱"缺乏量化标准(部分中介还是完全中介?);(4)被调节的中介(moderated mediation)的
  统计检验方法未注册。零required级缺陷,核心未塌。

target: DED-046
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。
  评分卡红旗13条逐项攻+反例猎捕(必做)+DED-004(不可证伪循环)/DED-007(测量轴焊死)
  复发检查。裁决三态照评分卡:verified需同时满足(1)无required缺陷(2)亲自猎捕无scope内
  活反例(3)未重蹈DED-004/007。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新上下文, 与作者无关)"
  verdict: needs_revision
  verdict_note: |
    本推论的核心机制——低收入者的认知资源被生存焦虑消耗(注意力池更浅)→面对算法
    推荐的消费触发时防御力更低→MPC居高不下→储蓄不足→财务焦虑加剧→注意力进一步
    萎缩——是BR-L2-027(注意力稀缺→判断力下降)与BR-L2-029(MPC收入梯度)产生组合
    增量的一个精巧案例。三块砖的简单并列不产生本推论的三个核心赌注:(i)注意力稀缺的
    方向性(导致更多消费而非更谨慎/决策瘫痪);(ii)算法推荐作为放大器产生收入组内
    MPC分化;(iii)交互效应(低收入组内分化更大)+跨期螺旋。这些赌注不在任何单一砖中——
    BR-L2-029不做组内预测,BR-L2-027不做MPC方向预测。brick=conclusion未命中。

    DED-004(不可证伪循环)与DED-007(测量轴焊死)均未复发。三条falsifiability注册口径
    (a)(b)(c)覆盖了组内主效应、交互效应、注意力中介——攻击面分层且完整。anti-talisman
    五条禁令封死了最常见的逆向推断逃逸路径——尤其是禁令(3)禁止将不显著的交互效应
    重新解释为"高收入组也面临注意力稀缺只是形式不同",此条直接钉住了本推论最危险的
    免疫策略。禁令(5)的对称保护(禁止扩大"算法暴露"定义找回效应)与一次性注册的分界线
    (≥30% vs <10%)形成双闸,防止了最常见的口径后门。

    反例猎捕无净杀。两条主要路线:(1)高收入群体的奢侈品算法冲动消费——若高收入组的
    奢侈品算法推荐产生的MPC效应与低收入组的日常消费算法推荐效应相当或更大,则预测(b)
    的交互效应(低收入组更大)被挑战;(2)节俭型移民群体——注意力稀缺(生存压力+文化适应
    负荷)但高储蓄率低MPC,挑战方向性赌注。两条均不构成clean kill——(1)需经验数据裁决
    且奢侈品消费占总消费比例小可能压低MPC效应,(2)移民的高储蓄可由汇款义务/文化规范
    等传统渠道解释,不必然否定注意力-MPC通道的存在。

    四条should挡住verified(零required):

    ①【should — MPC测量口径未锁定优先级】operationalization列出了三种MPC估计方法
    (截面回归/面板回归/自然实验),但未规定哪种是主分析方法、不一致时裁决优先级如何。
    BR-L2-029的review_summary中明确标注了"MPC时间窗口与'消费'操作口径(是否含还债)
    未注册,L2容忍;跨进L3时必须升required"——DED-046作为L3推论,MPC口径至少应锁定
    "消费"的操作定义(总消费/非耐用品消费/是否含还债)和估计方法优先级。不同MPC定义
    可能给出不同的组内算法暴露效应估计,留下事后选择空间。当前anti-talisman封堵了
    算法暴露阈值和注意力测量的后门,但MPC测量本身的后门(选最有利的MPC定义)尚未封堵。

    ②【should — Sobel vs bootstrap中介检验歧义】falsifiability(c)同时列出Sobel检验
    和bootstrap间接效应作为中介检验方法。Sobel检验已知存在低power和正态性假设问题;
    bootstrap置信区间(Preacher & Hayes 2004)是现代中介分析的标准方法。两者在边界
    案例中可能给出不同结论(Sobel不显著但bootstrap显著,或反之)。当前未规定两种方法
    不一致时的裁决优先级。建议锁定bootstrap为主要方法(报告95% percentile CI,
    不包含零即显著),Sobel最多作为敏感性分析。

    ③【should — 中介效应"减弱"缺乏量化标准】falsifiability(c)要求"纳入注意力池深度
    作为中介变量后,算法暴露的直接效应减弱"——"减弱"未量化。是完全中介(直接效应不再
    显著)还是部分中介(直接效应下降X%)?若直接效应从β=0.15降至β=0.14(下降7%),算
    "减弱"吗?缺乏量化标准使(c)的可证伪性打了折扣。建议注册:间接效应(bootstrap
    95% CI不包含零)证明中介存在即可,不要求完全中介——但间接效应占总效应的比例
    (PM = ab/c)应事先设定下界(如PM>0.2,即至少20%的总效应通过注意力渠道传导),
    低于下界则(c)被削弱(机制通道存在但非主通道)。

    ④【should — 被调节的中介统计检验未注册】预测(c)声称"中介效应规模在低收入组中
    更大(被调节的中介, moderated mediation)"——这是对moderated mediation的断言,
    但未注册其统计检验方法。Hayes(2015)的index of moderated mediation是此场景的
    标准方法(bootstrap CI for the index,不包含零即调节中介显著)。当前只说了
    "sobel检验或bootstrap间接效应p<0.05"——这对应简单中介,不检验"中介效应是否
    随收入组变化"。需补注册moderated mediation的检验方法。

    综合:推论逻辑可证伪、brick=conclusion未命中、反例猎捕无净杀、DED-004/DED-007
    未复发。四条should均为操作化/注册层面的可修补问题——MPC口径锁定+中介检验方法
    锁定+效应量化标准+moderated mediation注册。修复后可达verified。

  red_flag_findings:
    brick_conclusion: |
      未命中(攻不穿)。逐砖核查:

      BR-L2-027(注意力稀缺与信息过载,verified):核心主张为注意力是稀缺资源,信息过载
      降低判断质量。全文涉及"算法推荐"仅一处——作为注意力竞争产物的举例(广告/标题党/
      算法推荐/信息茧房)。"消费"出现两次——均在behavioral_economics的行为证据语境中
      (信息过载在市场/消费决策中的影响,Iyengar & Lepper jam study),并非关于MPC或
      注意力-消费因果方向。全文不含"MPC""收入梯度""组内变差""螺旋""直播电商"等
      DED-046特有概念。尤其不含"注意力稀缺→消费增加(方向性赌注)"——BR-L2-027明确
      只说判断力下降,不指定方向(可能冲动消费/决策瘫痪/随机选择)。

      BR-L2-029(边际消费倾向的收入梯度,weakly_verified):核心主张为流动性受限者MPC
      高于流动性充裕者。全文讨论的是收入/财富/流动性→MPC的传统渠道,射程限于"未预期
      一次性/暂时性收入变化"。全文不含"注意力""算法推荐""组内变差""螺旋""直播电商"
      "认知带宽"等DED-046特有概念——grep确认零命中。BR-L2-029明确将"绝对水平偏高"
      的残差划给BR-L2-001(有限理性),不涉及注意力机制。尤其不含"同一收入组内算法暴露
      →MPC分化"——BR-L2-029只做组间(低流动性vs高流动性)的MPC梯度预测。

      AXIOM-001(竞争稀缺资源)+AXIOM-002(信息熵增):不直接包含MPC/消费/算法/螺旋等
      任何DED-046特有概念。

      结论:"注意力稀缺×MPC收入梯度→同一收入组内算法暴露→MPC分化+低收入组内分化
      更大+跨期螺旋"未在任何承重砖中原文或近义出现。两砖的简单并列不产生螺旋——螺旋
      需要额外的"注意力→消费→财务紧张→注意力"焊接(derivation step 4),此焊接不在
      任何单砖中。无为本推论窄化的专用砖。
      ⇒ 不判。

    nontriviality_cell_check: |
      未命中(攻不穿)。2×2判表逐格:

      格(高暴露,MPC高于同收入组预测)——【非平凡格】:BR-L2-029只预测收入间MPC差异
      (穷人>富人),不做组内预测——BR-L2-029不蕴涵"高算法暴露组的MPC系统性高于同收入
      低暴露组"。BR-L2-027只预测注意力稀缺→判断力下降,但不指定方向——"判断力下降=
      消费增加"不是BR-L2-027的逻辑蕴涵。该格可被现实反例推翻——若高算法暴露组的MPC
      并不系统性高于同收入低暴露组,推论塌缩。非平凡性成立。

      格(高暴露,MPC不高于同收入组预测)——若被填充,(a)被证伪。可能的填充方式与
      primary_suspect(1)-(2)对应:方向性反转(注意力稀缺→更谨慎)、算法双刃性(省钱
      推送抵消消费推送)。此格是推论的实证赌注格。

      格(低暴露,MPC高于同收入组预测)——传统收入/流动性约束渠道可覆盖此格。BR-L2-029
      的传统渠道(补窟窿/被压抑需求/流动性约束)独立运作于算法暴露之外。此格被填充意味
      "注意力-MPC通道不是唯一的组内差异来源"——与推论自洽(推论追加第三条通道,不声称
      它是唯一通道)。不构成证伪。

      格(低暴露,MPC不高于同收入组预测)——基准格:无算法放大+传统渠道的MPC效应被
      控制在收入组均值附近。与两砖逻辑底线一致。

      结论:非平凡格的形式成立——单砖推不出、焊接有增量、格子可被反例填充。四个格的
      证伪/消化/基准逻辑清晰。
      ⇒ 不判。

    measurement_orthogonality: |
      未重蹈DED-007(攻不穿)。逐轴检查:

      (a) 注意力池深度——测量通道:IFDFW财务焦虑量表(自报Likert)+认知带宽行为任务
      (Raven's矩阵在财务压力启动前后的正确率差)+决策疲劳代理变量(日消费决策数×
      决策复杂度)。这三个通道均不涉及MPC的测量——Raven's矩阵表现不由消费支出决定,
      决策疲劳代理变量测量的是决策模式(高频小额vs低频大额)而非消费金额。

      (b) 算法消费暴露度——测量通道:算法推荐渠道消费频次(自报)+算法渠道消费金额占比
      (自报或银行/支付平台交易分类)。此通道存在一个需标注的温和依赖:消费金额占比的分母
      是总消费支出,而MPC的分子也是消费支出(ΔC)。但MPC是边际概念(ΔC/ΔY),算法暴露
      占比是截面水平概念(C_algo/C_total)——两者测量不同构念,不构成数学恒等式焊死。
      此温和依赖应在limitations中诚实标注(高总消费可能同时拉高算法暴露占比的分子和
      MPC的分子),但不影响测量轴的独立性判断。

      (c) MPC——测量通道:消费对收入的回归系数(截面/面板/自然实验),完全不涉及注意力
      或算法暴露的测量。

      不存在DED-007式的"自变量由因变量算出"的数学恒等式焊死。anti-talisman禁令(1)
      已封堵"由高MPC反推注意力池浅"的逆向推断。但有一处预防性标注:IFDFW财务焦虑量表
      的某些条目(如"我难以支付账单")可能与高消费支出相关(花得多→财务紧张),形成测量
      层面的温和反馈。此风险被三指标聚合+等权锁定部分缓解——认知任务和决策疲劳代理
      变量不受此反馈影响。若未来发现IFDFW与MPC的经验相关性过高(r>0.5),应降权或替换
      IFDFW为纯认知测量(如Stroop任务/Go/No-Go任务中的抑制控制指标)。
      ⇒ 不判。

    scope_hook_independent_of_result: |
      未命中(攻不穿)。四项excluded_outcomes逐一检查:

      (1)"低收入者的总消费金额高于高收入者"——按MPC是边际概念(增量比例)非平均消费
      水平的逻辑独立性事前排除。干净。不依赖结果方向。

      (2)"金融教育/理财干预降低了低收入者的MPC(但未改变算法暴露)"——按"干预改变了
      注意力→决策的转化效率"的机制逻辑事前排除。合理:金融教育的"先存后花"规则属于
      注意力分配策略的改变,非注意力-MPC通道本身的证伪。

      (3)"在无算法推荐环境中(如离线实体店),低收入者MPC仍高于同收入高收入者"——按
      "算法是放大器非唯一发动机"的机制逻辑事前排除。合理:实体店的物理注意力捕获
      (收银台糖果/限时折扣)是同构机制,规模更小但方向相同。此排除还附带了预测:无算法
      时组内MPC差缩小但未消失——这本身是可检验的次生赌注。

      (4)"算法推荐同时推送消费触发和储蓄工具,净效应模糊"——此排除附带了累积豁免上限
      (≥50%的Top 10主流算法消费平台不偏向消费端→射程收窄)。上限是事前注册的可操作
      标准(平台推荐流中消费触发vs储蓄/省钱触发的比例,与控制组随机feed比较),不依赖
      于本推论的验证结果。豁免机制是"射程收窄"而非"全局免疫"——与评分卡的"排除钩子
      独立于结果"要求一致。

      四项排除均定义为机制/逻辑边界,非按结果事后开脱。豁免上限为事前可操作标准。
      ⇒ 不判。

    criterion_tier_match: |
      未命中(攻不穿)。2×2判表使用二档(高/低算法暴露 × 高于/不高于MPC预测),匹配
      4格交叉预测格局。operationalization注册了高暴露(≥30%)和低暴露(<10%)的分界线,
      中间20-30%为灰色带(主分析排除或敏感性分析)——此三分类操作化与2×2判表的二分类
      是兼容的(主分析仅用高/低两组,排除中间组)。剂量-反应作为连续维度的补充检验
      (falsifiability的"连续变量×收入分位"交互项),不依赖分组切分。未将连续量硬切为
      不适配的二分类。
      ⇒ 不判。

    anti_talisman_cashed: |
      大体兑现,无required缺陷。五条禁令逐一:

      【已兑现】(1)禁止由"MPC高"反推"注意力池浅"——注意力池深度必须由独立于MPC的
      测量通道(财务焦虑量表+认知任务+决策疲劳代理)测定。此禁令正确封堵了将高MPC者
      事后标记为"隐性高注意力稀缺组"的逃逸。认知任务(Raven's矩阵)作为客观行为测量,
      是此禁令可兑现性的关键锚——即使研究者在统计上想"找回"效应,也无法操纵被试的
      Raven's正确率。

      (2)禁止由"组内算法暴露-MPC效应不显著"反推"算法暴露测量低估了真暴露量"——
      分界线(≥30% vs <10%)已在见数据前一次性注册,不得事后调整阈值。此禁令+一次性
      注册形成双闸,锁死了最常见的口径后门。

      (3)禁止由"交互效应不显著"反推"高收入组也面临注意力稀缺只是形式不同"——交互
      效应是注意力-MPC螺旋的核心赌注。若交互不显著,首先接受(b)被证伪的可能性。此禁令
      直接钉住了本推论最危险的免疫策略——将null result重新解释为"机制其实存在,只是
      形式不同"。写得诚实有力。

      (4)禁止用"该组的消费是理性必需品补充"消解高MPC组的高算法暴露-MPC——必需品vs
      奢侈品的分类必须事前按国家统计局的消费分类标准锁定。此禁令封堵了"高MPC=必需品
      消费(体面推论),低MPC=理性储蓄(也体面推论)"的双向免疫。必需品分类的事前锁定标准
      (国家统计局分类)是外部锚定的可操作判据。

      (5)【对称保护】禁止由"低收入组去算法化后MPC未下降"反推"该组使用的现金/借记卡
      也被算法间接影响了"——低暴露组定义已锁定(<10%),null result应首先接受(a)被证伪
      的可能性。此禁令是对禁令(2)的对称补充——(2)保护高暴露组的口径不被扩大,(5)保护
      低暴露组的口径不被扩大。两侧同时锁死。

      【实践可兑现性】注意力池深度的三指标测量中,认知任务(Raven's矩阵)是客观行为
      测量,完全不依赖研究者对被试MPC的了解——实验员只需按标准流程施测,无需做任何
      涉及MPC的主观编码。IFDFW是自报量表,同样不需编码者判断。算法暴露占比的自报或
      交易分类也是标准化操作。实践可兑现性良好。
      ⇒ 不判required。五禁令框架完整,实践可兑现性良好。

    anchor_fact_check: |
      无致命事实错。逐锚:

      锚1(稀缺心态:贫困消耗认知带宽,Mullainathan & Shafir 2013, Science):
      印度甘蔗农收获前vs收获后的Raven's矩阵表现差约1个标准差(≈IQ下降13分)——这是
      该研究的核心发现,准确引用。实验排除营养/工作强度/焦虑情绪等替代解释——与该研究
      的方法论一致(收获前后同一农民的被试内设计排除了个体差异)。作者诚实标注了此锚的
      承重边界:承重"低收入→注意力池消耗"的机制真实性,不承重消费决策的具体方向(花更多
      还是花更少?),也不涉及算法推荐。confidence:strong——合理,这是Science级别的高引
      经典。标注的边界(方向未定)是诚实且关键的——此锚支持注意力池随贫困变浅,但不支持
      "变浅后一定多花"的方向性赌注。
      ⇒ 不判。

      锚2(直播电商冲动消费的人口分布,CNNIC+平台年报):
      三四线城市直播购物频次高于一二线(QuestMobile 2023/2024)、快手电商低线复购率
      更高、拼多多GMV增速农村>城市——这些方向性声明与公开可得的行业报告一致。作者
      诚实标注:(i)观察性分布,非因果证据;(ii)低收入群体可能因"更低的替代娱乐"而更多
      刷直播,不必然是注意力稀缺驱动。confidence:moderate——合理,行业数据的方向性可信
      但因果链不可直接归因。
      ⇒ 不判。

      锚3(收银台糖果效应——物理世界的注意力捕获):
      Iyengar & Lepper 2000、Inman et al. 2009——收银台冲动购买和端架展示效应是消费
      心理学中多重复现的发现,引用准确。"数字算法将物理机制7×24化+个性化"的类比是
      推论自己的理论建构,非已有文献的直接发现——但类比本身是清晰的机制同构论证。
      confidence:moderate——合理。作者诚实标注:不涉及MPC收入梯度,承重的是方向性赌注
      (注意力薄弱→更多消费)。
      ⇒ 不判。

      反例锚(价格敏感性vs冲动消费:低收入者可能更谨慎):
      引用Nelson 1970、Attanasio et al. 2008——低收入消费者在食品/日用品上的价格搜索
      行为更高。诚实标注了方向性反例的性质和局限性("省钱搜索"可能产生虚假省钱感→反而
      增加总消费)。confidence:weak——合理,此为方向性挑战但非净杀。此锚的诚实自反加分。
      ⇒ 不判。

      边界案例(强制性储蓄制度):住房公积金/CPF的分析是合理的机制推演——强制储蓄从收入端
      打断螺旋,不证伪注意力-MPC机制本身。边界逻辑自洽。
      ⇒ 不判。

    definition_vs_prediction: |
      未命中(攻不穿)。因果链的多个环节均可被独立观测否决:

      (a)组内算法暴露-MPC主效应:若≥3/5个收入分位组内,高暴露组的MPC不显著高于低暴露
      组(p>0.05)→(a)被证伪。独立攻击面:收入分组(外部标准)+算法暴露占比(自报/交易
      分类)+MPC估计(回归系数)——三个测量均独立于"推论主张(a)为真"的假设。

      (b)交互效应:若算法暴露×收入分位的交互项系数不显著(p>0.05)→(b)被证伪,注意力-
      MPC螺旋的核心焊接断裂。独立攻击面:交互项系数由标准回归模型估计,不依赖推论机制。

      (c)注意力中介:若纳入注意力池深度后,算法暴露的直接效应不减弱(sobel/bootstrap
      p>0.05)→(c)的机制通道不被支持。独立攻击面:中介分析由标准结构方程/回归框架执行,
      不依赖推论机制。

      所有三个falsifiability条件的前件(收入分组/算法暴露/注意力池深度)均可独立于
      "推论为真"的假设进行测量。最脆弱环节(注意力→消费决策方向)已诚实列为primary_
      suspect,且有anti-talisman封堵事后解释。
      ⇒ 不判。

    enumeration_exhaustive: |
      未命中(不适用)。DED-046不声称对某现象做穷举分类。2×2判表是交叉分类框架
      (算法暴露×MPC方向),用于定位非平凡预测格,非"MPC的决定因素共有N种类型"的分类学
      声称。discriminant_validity枚举四种相邻理论(BR-L2-029传统MPC/稀缺心态/冲动消费
      心理学/数字鸿沟)是判别效度验证,非穷举分类——作者未声称"只有这四种替代解释"。
      ⇒ 不判。红旗条件不满足,不适用。

    primary_suspect_accurate: |
      未命中required(攻不穿)。自诊断准确:

      primary_suspect的四个子风险覆盖了注意力→消费方向赌注的最脆弱面:
      (1)方向性——注意力稀缺→更多消费vs更谨慎?此自诊断准确且致命:若方向性反转,
      推论核心塌缩。BR-L2-027确实不指定"判断力下降"的方向,本推论的方向性赌注是
      理论建构中最脆弱的一步。(2)算法推荐双刃性——省钱推送vs消费推送?此自诊断同样
      准确,且推论的有限射程声明(消费导向型平台)是诚实的边界注册。(3)选择效应——
      低暴露组可能系统性不同于高暴露组?此自诊断覆盖了观察性研究设计的主要威胁。
      (4)反向因果——注意力→MPC的因果方向?此自诊断触及了本推论与传统渠道的关键
      区分(注意力是否独立预测MPC增量)。

      secondary_suspect指向注意力中介的测量精度与概念区分——自诊断准确。注意力池深度
      与认知带宽的概念区分是推论的命名锚点,若经验上不可区分,术语需降级但核心机制
      (剩余认知资源→消费决策质量→MPC)不受影响——此退路已在limitations中诚实注册。

      unlikely_suspect指向两砖本身不太可能被推翻,脆弱的是焊接方式——此元认知准确。

      【平凡化检查】"穷人在直播上花钱多是因为穷"的常识化风险已被"防平凡化守卫"四条
      防线覆盖:(i)分离注意力池深度为独立于收入水平的第二通道;(ii)赌了方向(穷可以导致
      更节俭或更冲动);(iii)交互效应是带计量口径的精确赌注;(iv)螺旋是动态赌注非静态
      快照。discriminant_validity与稀缺心态/冲动消费心理学的区分为相邻理论平凡化提供了
      清晰裁断线。
      ⇒ 不判required。自诊断诚实且准确。

    caliber_complete_registration: |
      部分兑现,附should(对应verdict_note should-①~④)。

      【已注册的口径】
      (a)算法暴露分组口径:≥30% vs <10%,中间灰色带排除或敏感性分析。分界线在见数据前
      锁定,不得事后调整。干净。
      (b)注意力池深度聚合口径:三指标标准化后等权聚合,"不得在见数据后调整权重"。权重
      事前锁定。干净。
      (c)falsifiability(a):控制年龄/教育/家庭规模/地区固定效应后,算法暴露回归系数
      >0且p<0.05,≥3/5组显著。统计阈值注册完整。
      (d)falsifiability(b):算法暴露(连续)×收入分位(序数1-5)交互项系数<0且p<0.05。
      交互效应方向和阈值注册完整。
      (e)MPC定义:ΔC/ΔY。基本概念注册。
      (f)anti-talisman禁令(2)(4)(5)的边界裁决规则(必需品分类按国家统计局标准事前
      锁定)注册。

      【未注册/模糊的——should级】

      ①【should — MPC测量口径未锁定优先级】operationalization列出三种MPC估计方法
      (截面回归/面板回归/自然实验),但未规定主分析方法或不一致时的裁决优先级。BR-L2-029
      的review_summary明确标注"MPC时间窗口与'消费'操作口径(是否含还债)未注册,L2容忍;
      跨进L3时必须升required"——DED-046作为L3推论继承了此债。三种方法的MPC估计可能
      系统性不同(面板MPC通常低于截面MPC,自然实验MPC取决于冲击类型)。若截面MPC显示
      算法暴露效应显著而面板MPC不显著,哪个为准?此外,"消费支出"是否含还债/耐用品/住房
      未注册——这些口径选择足以改变MPC的水平和排序。此缺口与DED-035 ADV-REVIEW-040
      的should-1(可测量性阈值零锚定)和L4-009的判例(口径未预注册→反向裁决)同构:当
      多个测量选项存在时,未锁定优先级=留下了事后选最有利选项的空间——即使anti-talisman
      说了"不得事后调整",但"选择哪个MPC定义"的模糊性本身就是一个后门。

      ②【should — Sobel vs bootstrap中介检验歧义】falsifiability(c)列出"Sobel检验
      或bootstrap间接效应p<0.05"作为中介检验标准。Sobel检验已知存在低power(需大样本
      和正态性假设),bootstrap(Preacher & Hayes 2004,2008)是现代中介分析的标准方法。
      两者在边界案例中可能给出不同结论(Sobel p=0.06,bootstrap 95% CI=[0.001,0.05])。
      当前未规定两者不一致时的裁决优先级。建议锁定bootstrap percentile CI为主要方法
      (95% CI不包含零即显著),Sobel仅作为敏感性分析/稳健性检验。

      ③【should — 中介效应"减弱"缺乏量化标准】falsifiability(c)要求"算法暴露的直接
      效应减弱"——"减弱"未量化。是完全中介(直接效应不再显著)还是部分中介(直接效应下降
      X%)?若直接效应从β=0.15降至β=0.14(下降6.7%),sobel p=0.04,算"减弱"吗?缺乏
      量化标准使(c)的可证伪性打了折扣:一个统计上显著但实质上微小的中介效应可以满足
      "减弱+sobel p<0.05"的条件,但推论的核心声称(注意力是算法→MPC的主要通道)并未
      被这样的微小中介所支撑。建议注册:间接效应占总效应的比例(PM=ab/c)的事前下界
      (如PM≥0.2,至少20%通过注意力渠道),低于下界则(c)被削弱。

      ④【should — 被调节的中介(moderated mediation)统计检验未注册】预测(c)声称
      "中介效应规模在低收入组中更大(被调节的中介,moderated mediation)"——这是对
      moderated mediation的断言,需要moderated mediation的统计检验(Hayes 2015的
      index of moderated mediation:用bootstrap估计"间接效应如何随调节变量变化"的
      指数,其95% CI不包含零即调节中介显著)。当前falsifiability(c)只注册了简单中介
      的检验方法(sobel/bootstrap p<0.05)——此方法检验的是"平均中介效应是否非零",
      而非"中介效应是否随收入组变化"。需补注册moderated mediation的检验方法。

      ⇒ 不判required(核心口径已注册,缺口在操作化细节)。记should-①~④。

    data_source_common_root: |
      未命中(不适用)。DED-046的锚点证据来自不同学科领域:认知科学(Mullainathan &
      Shafir的甘蔗农实验——行为实验数据)、消费心理学(Iyengar & Lepper的jam study/
      Inman的端架展示——消费者行为实验)、行业报告(CNNIC/QuestMobile——独立调查
      机构的非学术数据)。这些领域的底层数据完全不共享采集源头——甘蔗农实验的Raven's
      得分与CNNIC的直播电商用户画像不来自同一数据仓库。不存在"WB用CNBS底层数据"式
      的同根问题。
      ⇒ 不判。红旗条件不满足,不适用。

    api_accessibility_masquerade: |
      未命中(不适用)。DED-046不依赖API查询或MCP工具作为证据来源。所有锚点证据来自
      已发表的科学文献和行业报告,不是"通过API查到的多源数据"。本红旗在此推论中不触发。
      ⇒ 不判。红旗条件不满足,不适用。

  counterexample_hunt:
    strategy: |
      按评分卡要求,主动构造可证伪核心主张的干净案例。核心主张:(i)同一收入组内,高算法
      暴露组MPC显著高于低暴露组;(ii)该效应在低收入组更大(交互效应);(iii)注意力池深度
      中介算法暴露→MPC的效应。反例猎捕目标:找到scope内满足前件(低收入+高算法暴露+
      注意力稀缺)但MPC不高/交互效应不成立/注意力不中介的干净案例,或在scope内存在与
      预测方向系统性相反的类别。

    case_1_luxury_algorithm_mpc:
      description: |
        "高收入群体的奢侈品算法冲动消费挑战预测(b)"——奢侈品电商生态系统(Farfetch/
        Net-a-Porter/StockX/得物)使用高度个性化的算法推荐(私人洽购/限时独家/AI策展
        合集/稀缺性推送"仅剩1件"+"12人已加购")。高收入个体暴露于这些平台:
        (i)收入高(最高五分位),注意力池深度按推论应较深(无生存决策税);
        (ii)算法暴露强度高——每日收到个性化推荐、限量发售通知、VIP专属折扣;
        (iii)奢侈品单价极高,一次算法触发的冲动购买即可产生可观的MPC效应——同样一笔
        $5000意外收入,被算法精准推送了一块限量手表→MPC可能高达0.8-1.0;
        (iv)奢侈品营销本身就利用了"稀缺性""排他性""紧迫感"等心理杠杆——这些杠杆与
        推论描述的"注意力薄弱→被精准触发捕获"机制在功能上等价,但运作在注意力池
        较深的高收入群体中。
        如果高收入组内,奢侈品算法暴露→MPC的效应量与低收入组内日常消费算法暴露→MPC
        的效应量相当甚至更大,则预测(b)的交互效应(低收入组效应更大)不成立——算法暴露
        的MPC放大效应可能就是"算法推荐对所有人的消费都有放大作用",而非特定于"注意力
        稀缺群体的防御力降低"。
      verdict: counterexample_candidate
      digestion: |
        消化:此反例的裁决依赖两个尚未测量的经验参数:(a)高收入组内算法暴露-MPC效应
        的绝对大小——奢侈品单价高但消费频次低,一次$5000的手表购买对应年消费$100K的
        高收入者,即便花费全部$5000意外收入,年MPC效应也可能被大量非算法消费稀释;
        (b)"注意力池深度×算法暴露"的交互是否确实产生了超越"算法暴露主效应"的增量——
        本推论的赌注不是"算法暴露不影响高收入者",而是"影响在低收入者中更大"。若未来
        实证发现高收入组的算法暴露-MPC效应不亚于低收入组,预测(b)被证伪——推论退化为
        "算法推荐影响所有人的MPC",注意力-MPC螺旋的核心焊接断裂。此反例是预测(b)最
        干净的实证风险。
        当前状态:不构成clean kill,需经验数据裁决。高收入奢侈品类与低收入日常消费类
        的MPC测量口径差异(奢侈品占总消费比例小→MPC效应可能被分母稀释)降低了此反例
        直接杀伤的力度,但挑战了交互效应的逻辑——推论需论证"生存决策税"造成的注意力
        梯度确实大于"奢侈品营销杠杆"造成的消费冲动梯度。
      status: counterexample_candidate

    case_2_frugal_immigrant:
      description: |
        "节俭型移民群体的高储蓄低MPC挑战方向性赌注"——第一代低收入移民(如在美国的
        墨西哥/中美洲移民,在中东的南亚劳工):
        (i)收入低,面临极高的认知负荷——语言障碍、制度导航(签证/医疗/子女教育)、
        歧视/边缘化压力、与家乡亲属的持续协调——按推论,注意力池应极度浅;
        (ii)使用算法驱动平台(WhatsApp/WeChat的群组商务、Facebook Marketplace、
        汇款比价App)——但主要用途是跨境汇款、比价找最便宜的日用品、信息共享(哪家
        超市打折),而非冲动消费;
        (iii)储蓄率极高——大量收入汇回家乡(remittance),日常消费极度压缩;
        (iv)MPC可能极低——额外$100到手,第一时间换成比索/卢比汇走,不进入当期消费。
        此案例的挑战:注意力稀缺(生存+适应双重负荷)并未导致高MPC——方向性赌注
        (注意力稀缺→更多消费)在此群体中可能反转(注意力稀缺→更精打细算→更多储蓄/
        汇款)。移民的"目标结构"(赚钱寄回家)压倒了推论预测的"注意力薄弱→直觉式消费"。
      verdict: digested
      digestion: |
        消化:(1)推论的方向性赌注是"ceteris paribus"(其他条件相同下,注意力稀缺增加
        冲动消费的概率)——移民群体的目标结构(汇款义务)是一个推论未建模但可以合理
        引入的调节变量。推论的射程并未声明"注意力稀缺在所有目标结构下都导致更多
        消费",而是在给定消费机会(算法推送)下的倾向性主张。(2)移民群体中,注意力稀缺
        可能确实增加了"每笔消费决策的质量下降"——只是"质量下降"的方向被强目标结构
        (省钱汇回家)扭转了:注意力稀缺→更容易被"省钱""特价""团购"推送所引导→花同样的
        钱买更多东西→消费者的真实消费量未变但支出被压缩——这是注意力稀缺的真实效应,
        只是方向由目标结构决定。(3)此案例揭示了推论的一个边界条件:方向性赌注的成立
        可能需要"无强烈反方向目标结构"的辅助假设。建议在limitations或scope中注册:
        "推论预测的方向性(注意力稀缺→消费增加)假设消费者无强烈的超常储蓄目标(如移民
        汇款义务/债务清偿紧急计划/重大未来支出预期);在有此类超常目标时,注意力稀缺
        可能加速目标导向行为(储蓄/还债)而非增加消费。"
        当前状态:不构成clean kill——目标结构可建模为调节变量,不推翻注意力-MPC通道的
        存在性。但揭示了方向性赌注的一个边界条件,应注册。
      status: digested

    case_3_compulsory_savings_displacement:
      description: |
        "强制性储蓄下的MPC位移而非消灭"——考察中国的住房公积金制度:
        (i)低收入职工工资的5-12%被强制划入公积金账户(不可自由支配);
        (ii)这些职工同时暴露于高强度的算法消费推荐(拼多多/抖音电商);
        (iii)推论预测:剩余可支配收入的MPC在注意力稀缺者中更高。
        挑战:若强制储蓄后,低收入职工将剩余可支配收入的MPC推至接近1.0(花光所有
        可花的钱),且算法暴露确实解释了剩余收入MPC的组内差异,此结果——表面看
        "支持"推论——实际上揭示了一个困境:注意力-MPC螺旋的"螺旋"(储蓄减少→
        焦虑增加→注意力减少)被强制储蓄从外部打断,推论的动态赌注(跨期恶化)在
        强制储蓄环境下无法检验。推论可能成为"在没有制度干预时成立,在有制度干预
        时不适用"的边界理论——这本身不是证伪,但限制了推论的实践射程。
      verdict: boundary_illumination
      digestion: |
        此案例已在boundary_cases中由作者分析——分析自洽(强制储蓄从收入端打断螺旋,
        注意力-MPC机制在剩余收入上继续运作)。但作者的结论(不证伪)过于自满:若强制
        储蓄广泛存在(中国数亿职工/新加坡全体公民),"注意力-MPC螺旋"的跨期动态部分
        在这些人群中被制度从外部钳制——推论的完整版本(预测(i)+(ii)+(iii)全成立)仅
        在无强制储蓄环境下可检验。这不构成证伪,但建议在real_world_anchors中标注:
        "推论预测(iii)的跨期螺旋在强制储蓄制度(住房公积金/CPF/自动401(k)默认缴费)
        覆盖的人群中被外部打断;动态赌注的可检验范围限于制度未覆盖人群"。
      status: boundary_illumination

    hunt_conclusion: |
      三条反例路线无净杀。奢侈品算法MPC(case_1)是预测(b)的最干净实证风险,需经验数据
      裁决;节俭型移民(case_2)揭示了方向性赌注的边界条件(强目标结构可扭转方向),建议
      注册为scope边界;强制储蓄(case_3)限制了螺旋动态赌注的可检验范围,建议诚实标注。
      反例猎捕未发现scope内活反例——但猎捕过程揭示了推论的三个边界条件(奢侈品营销
      杠杆vs生存决策税、目标结构调节、制度干预打断螺旋),这些边界应在推论中注册以
      增强precision而非降低falsifiability。

  non_recurrence:
    ded_004: |
      未复发。DED-004的死因是"道德-非道德区分的操作化不完整"→用结果循环定义前件。
      DED-046的前件(注意力池深度+算法消费暴露)均由独立于MPC的测量通道测定,不由
      MPC高低反推。anti-talisman五禁令中,禁令(1)封堵"由MPC高反推注意力池浅",禁令
      (2)封堵"由null result反推测量低估",禁令(3)封堵"由交互不显著反推高收入组也有
      注意力稀缺",禁令(5)封堵"由null result反推低暴露定义太宽"——四个方向锁死了
      DED-004式的"结果→前件"循环。falsifiability的三个注册口径均规定了明确的证伪
      条件——若null结果出现,推论被证伪而非免疫。未发现DED-004式的不可证伪循环。

      但有一条预防性标注:预测(iii)(跨期螺旋)被标注为"(i)+(ii)的逻辑合成,非独立注册"
      ——即若(i)(ii)不成立,跨期螺旋不触发。此退路的诚实注册避免了用(iii)独立救活
      (i)(ii)的免疫策略,但(iii)的证伪独立性因此受损:你永远无法单独证伪(iii),因为
      (iii)被证伪的前提((i)(ii)成立但(iii)不成立)是逻辑可能的,但当前设计未为之注册
      独立的falsifiability条件。建议:若(i)(ii)成立,注册(iii)的独立证伪条件——在面板
      中Granger因果检验"滞后注意力→当期MPC"(控制当期注意力+滞后MPC)和"滞后MPC→
      当期注意力"(控制当期MPC+滞后注意力)——若两个交叉滞后方向均不显著或仅反向成立,
      (iii)被单独证伪而(i)(ii)存活。
      ⇒ 未复发DED-004。附预防性标注(关于(iii)的证伪独立性)。

    ded_007: |
      未复发。DED-007的死因是"测量轴焊死"——自变量和被预测量由同一底层数据生成,
      形成数学恒等式。DED-046的三个测量轴:
      (a)注意力池深度:IFDFW量表+Raven's认知任务+决策疲劳代理
      (b)算法消费暴露:算法渠道消费频次+金额占比
      (c)MPC:消费回归系数(ΔC/ΔY)
      三轴在物理测量原理上无共享组件——Raven's正确率不由消费数据算出,算法渠道消费
      占比不由MPC回归系数算出。不存在DED-007式的"自变量是因变量的函数"的数学恒等式。
      唯一需标注的温和依赖:算法消费暴露的分母(总消费)与MPC的分子(ΔC)共享"消费"构念
      ——但前者是截面水平,后者是边际变化,非同一统计量,不构成数学恒等式焊死。
      ⇒ 未复发DED-007。

  required_fixes:
    - |
      【should-①】MPC测量口径锁定:在operationalization的mpc.measurement中指定主分析
      方法(建议面板回归,因其能区分永久vs暂时收入冲击)、"消费支出"的操作定义(非耐用品
      消费/总消费/是否含还债)、以及多种MPC估计不一致时的裁决优先级。此项继承自
      BR-L2-029 review_summary中"跨进L3时必须升required"的标注。
    - |
      【should-②】中介检验方法锁定:将falsifiability(c)的"Sobel检验或bootstrap"改为
      以bootstrap percentile CI为主要方法(95% CI不包含零即显著),Sobel降级为敏感性
      分析。两者不一致时以bootstrap为准。
    - |
      【should-③】中介效应量化标准注册:在falsifiability(c)中增加"间接效应占总效应
      比例(PM=ab/c)的事前下界(建议PM≥0.2)",低于下界则注意力通道存在但非主通道,
      (c)被削弱(非证伪)。
    - |
      【should-④】被调节的中介检验方法注册:在falsifiability(c)中增补moderated
      mediation的统计检验方法——Hayes(2015)的index of moderated mediation,
      bootstrap 95% CI不包含零即调节中介显著。明确此检验与简单中介检验的关系
      (先检验moderated mediation,若显著再按收入组报告条件间接效应)。

round_2:
  reviewer: "独立对抗审查者 (round 2, 全新上下文, 与前轮审查者无关)"
  verdict: verified
  verdict_note: |
    本轮核实 r1 四条 should 级修复全部到位:(1)MPC 主分析方法锁定为面板回归(家庭固定效应),
    消费操作定义为非耐用品(不含还债),不一致时以面板为准——已在 operationalization.mpc.
    measurement 中明确注册;(2)中介检验主方法锁定为 bootstrap percentile CI(Preacher &
    Hayes 2004),Sobel 降为敏感性分析,不一致以 bootstrap 为准——已在 falsifiability(c)
    中明确注册;(3)中介效应量化标准 PM=ab/c≥0.2 作为事前下界,低于此则通道存在但非主通道
    ——已在 falsifiability(c)中明确注册;(4)被调节的中介检验方法锁定为 Hayes(2015)index
    of moderated mediation,bootstrap 95% CI——已在 falsifiability(c)中明确注册。四条
    should 均已消解,推论从 needs_revision 进入 verified 就绪状态。

    独立核查 r1 的十三红旗结论:红旗 1(brick=conclusion)仍攻不穿——"注意力稀缺×MPC 收入
    梯度→同一收入组内算法暴露→MPC 分化+低收入组分化更大+跨期螺旋"在 BR-L2-027(不做
    MPC 方向预测)和 BR-L2-029(不做组内预测)中均不出现,组合增量真实。红旗 2(逐格判空)
    非平凡格仍成立——单砖推不出、焊接有增量、格子可被反例填充。红旗 3(测量轴正交)三轴
    (注意力池深度/算法暴露/MPC)在物理测量原理上无共享组件,DED-007 未复发。红旗 4-10
    与 r1 结论一致,未发现新的 required 级缺陷。红旗 11(口径注册)经 r1 修复后已完整——
    MPC 定义/中介检验/效应量化/被调节中介检验四项口径均一次性注册,阈值和优先级明确。
    红旗 12-13(数据源同根/API 冒充独立)不适用——DED-046 的证据来自不同学科领域(认知科学/
    消费心理学/行业报告),底层数据不共享采集源头,不依赖 API 查询。

    本轮独立反例猎捕追加四条新路线,均无净杀:(A)BNPL/信用消费扭曲——算法驱动消费可能走
    信用渠道(花呗/Afterpay),MPC(测收入冲击→消费)可能漏捕信用前置的算法消费,形成系统性
    假阴性;但 anti-talisman(5)已预承诺 null result 即接受证伪,不给事后逃逸;(B)身份/地位
    消费混淆——低收入者的算法暴露→高 MPC 可能由地位竞争(非注意力稀缺)驱动;若控制地位焦虑
    后注意力中介效应消失,推论机制降级,但 DED-046 不声称排他性(自称第三条通道),此风险为
    经验裁决而非逻辑杀;(C)算法素养的非线性——极低数字素养者根本不用算法平台(低暴露低
    MPC),中等素养者用但缺防御力(高暴露高 MPC),产生倒 U 形而非单调主效应;但 DED-046 的
    线性回归检验可捕捉主效应方向,非单调是统计 power 问题非逻辑缺陷;(D)现金经济中算法暴露
    天然低——该生态中推论预测(i)因样本不足难以检验,但 excluded_outcome(3)已注册"算法是
    放大器非唯一发动机",实体店的物理注意力捕获为同构机制,不构成证伪。

    三条 verified 条件均满足:(1)零 required 级缺陷——十三红旗均未命中 required,且 r1 的
    四条 should 已修复;(2)反例猎捕执行完毕(本轮追加四条新路线+继承 r1 三条),scope 内
    无净杀活反例;(3)DED-004(不可证伪循环)未复发——前件由独立于 MPC 的测量通道测定,
    anti-talisman 五禁令封死逆向推断逃逸;DED-007(测量轴焊死)未复发——三轴无共享组件,
    不存在自变量由因变量算出的数学恒等式。

    额外标注两条 should 级建议(不挡 verified):
    (a)BNPL/信用消费对 MPC 测量的稀释效应——当算法驱动消费大量走信用渠道时,以收入冲击
    估计的 MPC 可能系统性低估算法消费效应。建议在 limitations 中标注此风险,并推荐面板
    数据拉长窗口或补充总支出(含信用消费)作为敏感性分析。
    (b)螺旋放大系数的收敛性——推论未区分收敛螺旋(放大系数<1,趋于均衡)与发散螺旋
    (放大系数>1,累积恶化)。建议在预测(iii)中标注:螺旋的存在性(正反馈方向)是推论核心
    赌注,螺旋的发散性(是否爆炸)是次级经验问题,不构成证伪条件。

  red_flag_findings:
    brick_conclusion: |
      与 r1 结论一致,仍攻不穿。逐砖重验:

      BR-L2-027(注意力稀缺,verified):全文不含"MPC""收入梯度""组内变差""螺旋""直播电商"等
      DED-046 特有概念。"判断力下降"不指定方向——可能是冲动消费、决策瘫痪或随机选择。
      "注意力稀缺→消费增加"的方向性赌注不在 BR-L2-027 中。

      BR-L2-029(MPC 收入梯度,weakly_verified):全文只做组间(低流动性 vs 高流动性)的 MPC
      梯度预测,不做同一收入组内的算法暴露→MPC 分化预测。全文不含"注意力""算法推荐"
      "组内变差""螺旋"等 DED-046 特有概念。

      AXIOM-001(竞争稀缺资源)+AXIOM-002(信息熵增):不含 MPC/消费/算法/螺旋任何特有概念。

      结论:"注意力稀缺×MPC 收入梯度→算法暴露的 MPC 效应在低收入组中更大→注意力-MPC
      放大螺旋"未在任何承重砖中原文或近义出现。两砖的简单并列不产生螺旋——螺旋需要额外
      的"注意力→消费→财务紧张→注意力"焊接(derivation step 4),此焊接不存在于任何单砖中。
      无为本推论窄化的专用砖。
      ⇒ 不判。

    nontriviality_cell_check: |
      与 r1 结论一致,仍攻不穿。2×2 判表逐格重验:

      格(高暴露,MPC 高于同收入组预测)——【非平凡格】:BR-L2-029 只预测收入间 MPC 差异
      (穷人>富人),不做组内预测——组内算法暴露效应不是 BR-L2-029 的逻辑蕴涵。BR-L2-027
      只预测注意力稀缺→判断力下降,不指定方向——"判断力下降=消费增加"不是 BR-L2-027
      的逻辑蕴涵。该格可被现实反例推翻——若高算法暴露组的 MPC 并不系统性高于同收入低
      暴露组,推论塌缩。

      格(高暴露,MPC 不高于同收入组预测)——若被填充,(a)被证伪。填充方式:方向性反转
      (注意力稀缺→更谨慎)、算法双刃性(省钱推送抵消消费推送)。

      格(低暴露,MPC 高于同收入组预测)——传统收入/流动性约束渠道可覆盖。BR-L2-029 的
      传统渠道独立运作于算法暴露之外。此格被填充意味"注意力-MPC 通道不是唯一的组内差异
      来源"——与推论自洽(推论追加第三条通道,不声称它是唯一通道)。

      格(低暴露,MPC 不高于同收入组预测)——基准格:无算法放大+传统渠道的 MPC 效应被
      控制在收入组均值附近。

      结论:非平凡格的形式成立。单砖推不出、焊接有增量、格子可被反例填充。
      ⇒ 不判。

    measurement_orthogonality: |
      与 r1 结论一致,未重蹈 DED-007。三轴独立重验:

      (a)注意力池深度:IFDFW 量表+Raven's 认知任务+决策疲劳代理——三个通道均不涉及 MPC
      测量。Raven's 正确率不由消费支出算出,认知任务是客观行为测量,实验员按标准流程施测
      不需了解被试 MPC。注意 IFDFW 量表的部分条目(如"我难以支付账单")可能与消费行为
      相关——此温和依赖已被三指标聚合+等权锁定缓解,认知任务和决策疲劳代理不受此反馈影响。

      (b)算法消费暴露:算法渠道消费频次+金额占比——金额占比的分母(总消费)与 MPC 的分子
      (ΔC)共享"消费"构念,但前者是截面水平量,后者是边际变化量,非同一统计量,不构成数学
      恒等式焊死。

      (c)MPC:消费对收入的回归系数(ΔC/ΔY)——完全不涉及注意力或算法暴露的测量。

      不存在 DED-007 式的"自变量由因变量算出"的数学恒等式。anti-talisman(1)已封堵
      "由高 MPC 反推注意力池浅"的逆向推断。
      ⇒ 不判。

    scope_hook_independent_of_result: |
      与 r1 结论一致,仍攻不穿。四项 excluded_outcomes 逐一重验:

      (1)低收入总消费金额高于高收入者——按 MPC 是边际概念(非平均消费水平)的逻辑独立性
      事前排除,不依赖结果方向。干净。
      (2)金融教育降低 MPC 但未改算法暴露——按"干预改变注意力→决策转化效率"的机制逻辑
      事前排除。合理:金融教育改变分配策略,非通道证伪。
      (3)离线实体店中低收入 MPC 仍高——按"算法是放大器非唯一发动机"的机制逻辑事前排除。
      附带可检验的次生赌注(无算法时组内差缩小但未消失)。
      (4)算法双刃推送(消费+储蓄)——豁免上限(≥50%的 Top 10 平台不偏消费端→射程收窄)是
      事前可操作标准(平台推荐流消费触发 vs 储蓄/省钱触发比例,与控制组随机 feed 比较),
      不依赖推论验证结果。豁免机制是"射程收窄"非"全局免疫"。

      四项排除均定义为机制/逻辑边界,非按结果事后开脱。
      ⇒ 不判。

    criterion_tier_match: |
      与 r1 结论一致。2×2 判表使用二档(高/低算法暴露 × 高于/不高于 MPC 预测),匹配
      4 格交叉预测格局。operationalization 注册了三分类(≥30%高暴露/<10%低暴露/20-30%
      灰色带),主分析仅用高/低两组,排除中间组——与判表二分类兼容。falsifiability(b)使用
      连续变量×收入分位交互项作为剂量-反应补充检验,不依赖分组切分。未将连续量硬切为
      不适配的二分类。
      ⇒ 不判。

    anti_talisman_cashed: |
      与 r1 结论一致,五禁令兑现完整,无 required 缺陷。重验:

      【已兑现】(1)禁止由 MPC 高反推注意力池浅——注意力池深度由独立测量通道(IFDFW+
      Raven's+决策疲劳代理)测定,认知任务(Raven's)提供客观行为锚,即使研究者想"找回"
      效应也无法操纵被试的 Raven's 正确率。
      (2)禁止由 null result 反推算法暴露测量低估——分界线(≥30% vs <10%)已在见数据前
      一次性注册,不得事后调整。
      (3)禁止由交互不显著反推"高收入组也面临注意力稀缺只是形式不同"——交互效应是核心
      赌注,null result 应首先接受(b)被证伪。直接钉住最危险的免疫策略。
      (4)禁止用"该组的消费是理性必需品补充"消解高 MPC——必需品 vs 奢侈品分类事前按国家
      统计局标准锁定。封堵"高 MPC=必需品(体面推论),低 MPC=理性储蓄(也体面推论)"的双向
      免疫。
      (5)【对称保护】禁止由去算法化后 MPC 未下降反推"低暴露定义太宽"——低暴露组定义
      已锁定(<10%),null result 应首先接受(a)被证伪。两侧同时锁死。

      实践可兑现性良好:Raven's 是标准化客观测量,算法暴露占比是自报/交易分类标准化操作,
      MPC 是标准回归系数。无需要研究员主观编码的模糊环节。
      ⇒ 不判 required。五禁令框架完整,实践可兑现性好。

    anchor_fact_check: |
      与 r1 结论一致,无致命事实错。逐锚重验:

      锚1(贫困消耗认知带宽,Mullainathan & Shafir 2013,Science):甘蔗农收获前 vs 收获后
      Raven's 矩阵表现差约 1 个标准差(≈IQ 下降 13 分)——核心发现准确引用。实验排除营养/
      工作强度/焦虑情绪等替代解释——与被试内设计的优势一致。作者诚实标注此锚承重
      "低收入→注意力池消耗"的机制真实性,不承重消费决策方向。confidence:strong 合理。
      ⇒ 不判。

      锚2(直播电商人口分布,CNNIC+平台年报):三四线城市直播购物频次高于一二线(QuestMobile
      2023/2024),快手低线复购率更高,拼多多 GMV 增速农村>城市——方向性声明与公开行业
      报告一致。作者诚实标注观察性分布非因果证据,低收入者可能因替代娱乐少而多刷直播。
      confidence:moderate 合理。
      ⇒ 不判。

      锚3(收银台糖果效应,Iyengar & Lepper 2000/Inman et al. 2009):收银台冲动购买和端架
      展示效应是消费心理学多重复现发现,引用准确。"数字算法将物理机制 7×24 化+个性化"
      的类比是推论自己的理论建构,非已有文献直接发现——但类比本身是清晰的机制同构论证。
      作者诚实标注不涉及 MPC 收入梯度。confidence:moderate 合理。
      ⇒ 不判。

      反例锚(价格敏感性,Nelson 1970/Attanasio et al. 2008):低收入消费者价格搜索行为更高。
      诚实标注方向性反例的性质和局限性("省钱搜索"可能产生虚假省钱感→反而增加总消费)。
      confidence:weak 合理。
      ⇒ 不判。

      边界案例(强制储蓄制度):住房公积金/CPF 分析自洽——强制储蓄从收入端打断螺旋,
      注意力-MPC 机制在剩余收入上继续运作。边界逻辑自洽。
      ⇒ 不判。

    definition_vs_prediction: |
      与 r1 结论一致,仍攻不穿。三个 falsifiability 条件的前件均可独立于"推论为真"的假设
      进行测量:

      (a)组内算法暴露-MPC 主效应:收入分组(外部标准)+算法暴露占比(自报/交易分类)+MPC
      估计(回归系数)——三个测量均独立于"推论主张(a)为真"的假设。
      (b)交互效应:算法暴露×收入分位交互项系数由标准回归模型估计,不依赖推论机制。
      (c)注意力中介:bootstrap 间接效应 CI 由标准结构方程/回归框架执行,不依赖推论机制。

      最脆弱环节(注意力→消费决策方向)已诚实列为 primary_suspect(1),且有 anti-talisman
      封堵事后解释。注意:经 r1 修复,(b)(c)的检验方法和阈值均已一次性注册,进一步降低了
      "事后选择分析方法"的风险。
      ⇒ 不判。

    enumeration_exhaustive: |
      与 r1 结论一致,不适用。DED-046 不声称对某现象做穷举分类。2×2 判表是交叉分类框架
      (算法暴露×MPC 方向),用于定位非平凡预测格,非"MPC 的决定因素共有 N 种类型"的分类学
      声称。discriminant_validity 枚举四种相邻理论是判别效度验证,作者未声称"只有这四种
      替代解释"。
      ⇒ 不判。红旗条件不满足,不适用。

    primary_suspect_accurate: |
      与 r1 结论一致,自诊断准确,无 required 缺陷。重验:

      primary 四子风险覆盖最脆弱面:(1)方向性——注意力稀缺→更多消费 vs 更谨慎?此自诊断
      准确且致命:若方向性反转,推论核心塌缩。BR-L2-027 确实不指定方向。(2)算法双刃性——
      省钱推送 vs 消费推送?准确,且有限射程声明(消费导向型平台)是诚实的边界注册。
      (3)选择效应——低暴露组可能系统性不同于高暴露组?覆盖观察性研究设计的主要威胁。
      (4)反向因果——注意力→MPC 的因果方向?触及推论与传统渠道的关键区分。

      secondary 指向注意力中介的测量精度与概念区分——自诊断准确。

      unlikely 指向两砖本身不太可能被推翻,脆弱的是焊接方式——元认知准确。

      【平凡化检查】防平凡化守卫四条防线仍成立:(i)分离注意力池深度为独立于收入水平的
      第二通道;(ii)赌了方向;(iii)交互效应是带计量口径的精确赌注;(iv)螺旋是动态赌注。
      discriminant_validity 与稀缺心态/冲动消费心理学的区分为相邻理论平凡化提供清晰裁断线。
      ⇒ 不判 required。

    caliber_complete_registration: |
      本轮确认 r1 的四条 should 均已消解,口径注册现已完整:

      【已注册——经 r1 修复后完整】
      (a)算法暴露分组口径:≥30% vs <10%,中间灰色带排除或敏感性分析。分界线在见数据前
      锁定。干净。
      (b)注意力池深度聚合口径:三指标标准化后等权聚合,"不得在见数据后调整权重"。权重
      事前锁定。干净。
      (c)falsifiability(a):控制年龄/教育/家庭规模/地区固定效应后,算法暴露回归系数>0
      且 p<0.05,≥3/5 组显著。统计阈值注册完整。
      (d)falsifiability(b):算法暴露(连续)×收入分位(序数 1-5)交互项系数<0 且 p<0.05。
      交互效应方向和阈值注册完整。
      (e)MPC 定义+测量口径:ΔC/ΔY,面板回归为 main,消费=非耐用品不含还债,不一致时面板
      为准。【r1 should-① 已修复】
      (f)falsifiability(c)中介检验:主方法=bootstrap percentile CI(Preacher & Hayes 2004),
      敏感性=Sobel,不一致以 bootstrap 为准。【r1 should-② 已修复】
      (g)falsifiability(c)中介效应量化:PM=ab/c≥0.2 事前下界,<0.2 则通道存在但非主通道。
      【r1 should-③ 已修复】
      (h)falsifiability(c)被调节的中介:Hayes(2015)index of moderated mediation,
      bootstrap 95% CI。【r1 should-④ 已修复】
      (i)anti-talisman 禁令(2)(4)(5)的边界裁决规则(必需品分类按国家统计局标准事前
      锁定)注册。

      新增标注——本轮观察到两条 should 级建议(不挡 verified):
      (A)BNPL/信用消费对 MPC 测量的稀释:当算法消费大量走信用渠道(花呗/Afterpay/Klarna),
      MPC(ΔC/ΔY,不含还债)可能漏捕已发生的算法驱动消费。建议在 limitations 中标注此风险,
      推荐面板数据拉长窗口或补充含信用消费的总支出作为敏感性分析。
      (B)螺旋放大系数的收敛性:推论未区分收敛螺旋(放大系数<1,趋于均衡)与发散螺旋(放大
      系数>1,累积恶化)。建议在预测(iii)中标注:螺旋的存在性(正反馈方向)是核心赌注,螺旋
      的发散性是次级经验问题。

      ⇒ 不判 required。r1 的 should-①~④ 已修复,口径注册完整。

    data_source_common_root: |
      与 r1 结论一致,不适用。DED-046 的锚点证据来自不同学科领域:认知科学(Mullainathan &
      Shafir 的甘蔗农实验——行为实验数据)、消费心理学(Iyengar & Lepper jam study/Inman
      端架展示——消费者行为实验)、行业报告(CNNIC/QuestMobile——独立调查机构数据)。这些
      领域的底层数据完全不共享采集源头——甘蔗农实验的 Raven's 得分与 CNNIC 的直播电商
      用户画像不来自同一数据仓库。不存在"WB 用 CNBS 底层数据"式的同根问题。
      ⇒ 不判。红旗条件不满足,不适用。

    api_accessibility_masquerade: |
      与 r1 结论一致,不适用。DED-046 不依赖 API 查询或 MCP 工具作为证据来源。所有锚点
      证据来自已发表的科学文献和行业报告,不是"通过 API 查到的多源数据"。
      ⇒ 不判。红旗条件不满足,不适用。

  counterexample_hunt:
    strategy: |
      本轮在 r1 三条路线之外追加四条全新反例猎捕路线,目标仍是找到 scope 内满足前件
      (低收入+高算法暴露+注意力稀缺)但 MPC 不高/交互效应不成立/注意力不中介的干净案例。

    case_a_bnpl_credit_distortion:
      description: |
        "BNPL/信用消费对 MPC 测量的系统性稀释"——低收入用户高频使用算法驱动消费平台
        (拼多多/抖音电商),但大部分消费通过花呗/白条/Afterpay 等信用工具完成。当获得
        $100 收入冲击时,优先用于偿还信用账单而非新增消费。MPC(ΔC/ΔY,按 DED-046 定义
        的"非耐用品消费不含还债")≈0——因为还债被排除。但实际上该用户的总算法驱动消费
        (含信用消费)很高,只是消费时间点领先于收入冲击。MPC 测量捕捉不到信用前置的算法
        消费效应,产生系统性假阴性——高算法暴露组反而可能显示低 MPC(因为收入用于还债)。
      verdict: digested
      digestion: |
        此案例不构成 clean kill,原因:(1)面板数据拉长观测窗口可捕获完整信用周期(借钱→
        消费→还钱→再借钱),在足够长的面板中 MPC 的估计不会系统性偏向零;(2)自然实验设计
        (如一次性 stimulus check)若测量总支出(含信用账户变动)而非仅当期消费,可绕过信用
        前置问题;(3)最关键的是 anti-talisman(5)已预承诺——若低暴露组 MPC 未被压低,首先
        接受(a)被证伪。推论不给自己留下"是 BNPL 干扰了测量"的逃逸路线。BM PL 是测量
        精度的 should 级关注(建议在 limitations 中标注),非逻辑杀。
      status: digested

    case_b_identity_consumption_confound:
      description: |
        "身份/地位消费作为注意力中介的混淆变量"——低收入城市青年的算法暴露→高 MPC 可能
        由社会地位竞争驱动(通过算法发现并购买可见的地位商品:品牌服饰/最新手机/潮鞋),
        而非注意力稀缺。低收入+高地位焦虑→更积极使用算法寻找性价比高的地位信号商品→
        MPC 升高。注意力和地位焦虑均与贫困相关,两者可能高度共线。若控制地位焦虑/社会
        比较倾向后注意力中介效应消失,推论机制(注意力→消费)被降级为地位竞争的代理变量。
      verdict: digested
      digestion: |
        不构成 clean kill:(1)DED-046 的 discriminant_validity 中已声明推论自称"第三条通道",
        不声称排他性——其他通道(如地位竞争)同时运作不影响注意力通道的存在性;(2)中介分析
        (c)若控制地位焦虑后 ab 仍显著(PM≥0.2),则注意力具有独立于地位竞争的增量解释力——
        这是可检验的经验问题;(3)若控制地位焦虑后 ab 不显著,推论的"注意力"标签失去经验支撑
        (即 secondary_suspect 所预警的情况),但 DED-046 已预注册此风险。机制竞争(注意力 vs
        地位 vs 社交从众)是推论生命周期的正常经验裁决,非逻辑缺陷。
      status: digested

    case_c_algorithmic_literacy_nonlinearity:
      description: |
        "算法素养的非线性——倒 U 形关系挑战单调主效应假设"——极低数字素养者(如高龄
        农村居民)根本不用算法平台→算法暴露≈0→MPC 不受算法影响。中等素养者(会刷抖音/
        拼多多但缺乏批判意识)→高暴露+高易感性→高 MPC。高素养者(了解算法机制/主动管理
        推荐)→高暴露但低易感性→MPC 不受算法影响。此倒 U 形意味着 DED-046 预测(i)的
        线性主效应(高暴露组 MPC>低暴露组)可能低估高素养子群的反向效应,导致整体效应
        不显著或效应量被稀释。
      verdict: digested
      digestion: |
        不构成 clean kill:(1)DED-046 的预测(i)是方向性主效应赌注——只要平均上高暴露组
        MPC 显著高于低暴露组,(a)即成立。倒 U 形内部的异质性不影响主效应方向;(2)算法素养
        可建模为调节变量——DED-046 的 discriminant_validity 中已与"数字鸿沟/数字素养"
        理论做了清晰对抗(推论赌注意力方向占主导)。若数字素养方向占主导(低收入→少用算法→
        MPC 更低),(a)被削弱——但这是经验裁决,非逻辑杀;(3)交互效应(b)赌"算法暴露效应在
        低收入组更大"——高素养子群的存在不影响此预测,因为高素养者在低收入组中占比低,
        对组均值的影响有限。此反例揭示的是统计 power 的边界(效应量被稀释),非机制错误。
      status: digested

    case_d_cash_economy_null_environment:
      description: |
        "现金经济中算法暴露天然低——推论(预测 i)因样本不足而不可检验"——在现金主导
        经济体(如印度农村/撒哈拉以南非洲部分区域),智能手机渗透率和电商渗透率均低,
        算法消费暴露在几乎所有收入组中均<10%。此环境中既无高暴露组也无低暴露组之差可测,
        预测(i)的 falsifiability 条件(a)因缺乏变差而无法操作化——不是被证伪,而是无法
        检验。若此环境中 MPC 收入梯度(BR-L2-029 的预测)仍成立,说明注意力-MPC 螺旋机制
        不是 MPC 梯度的必要条件,削弱推论声称的"第三条通道"的重要性。
      verdict: boundary_illumination
      digestion: |
        不构成 clean kill,但揭示推论的可检验范围边界:(1)DED-046 的 excluded_outcome(3)
        已注册"算法是放大器非唯一发动机",离线实体店的物理注意力捕获(收银台糖果/限时折扣/
        推销员)是同构机制——推论射程不要求算法必须存在;(2)推论的可检验范围限于算法消费
        生态足够发达的经济体(中国/东南亚/欧美),在现金经济中推论的附加价值(超越 BR-L2-029
        的组内预测)无法检验——这不证伪推论,但限制其经验射程;(3)建议在 real_world_anchors
        或 limitations 中注册:"推论的可检验范围限于算法消费生态(直播电商/个性化推荐/精准
        优惠券)渗透率达到临界质量的经济体;在现金主导经济体中,物理注意力捕获机制(收银台
        效应/推销员/电视购物)是同构但规模较小的替代放大器。"
      status: boundary_illumination

    hunt_conclusion: |
      本轮追加四条反例路线,与 r1 三条合并共七条,均无净杀:
      - r1 case_1(奢侈品算法 MPC):预测(b)的最干净实证风险,需经验数据裁决
      - r1 case_2(节俭型移民):揭示方向性赌注的边界条件(目标结构调节)
      - r1 case_3(强制储蓄):限制螺旋动态赌注的可检验范围
      - r2 case_A(BNPL 信用扭曲):MPC 测量的 should 级精度关注
      - r2 case_B(身份消费混淆):机制竞争的 should 级关注
      - r2 case_C(算法素养非线性):统计 power 的边界关注
      - r2 case_D(现金经济 null 环境):可检验范围的边界关注

      反例猎捕未发现 scope 内净杀活反例。猎捕过程揭示了推论的多个边界条件和测量精度
      关注点,这些已在 verdict_note 中记录为 should 级建议,不构成 required 缺陷。

  non_recurrence:
    ded_004: |
      未复发。DED-004 的死因是"用结果循环定义前件"。DED-046 的前件(注意力池深度+
      算法消费暴露)均由独立于 MPC 的测量通道测定,不由 MPC 高低反推。anti-talisman
      五禁令中:(1)封堵"由 MPC 高反推注意力池浅",(2)封堵"由 null result 反推测量低估",
      (3)封堵"由交互不显著反推高收入组也有注意力稀缺",(5)封堵"由 null result 反推低
      暴露定义太宽"——四个方向锁死 DED-004 式的"结果→前件"循环。falsifiability 的三个
      注册口径均规定了明确的证伪条件——若 null 结果出现,推论被证伪而非免疫。

      关于预测(iii)的证伪独立性:r1 已指出(iii)被标注为"(i)+(ii)的逻辑合成,非独立注册"
      ——若(i)(ii)不成立,(iii)不触发。但若(i)(ii)成立而(iii)不成立(逻辑可能),推论未注册
      (iii)的独立证伪条件。此为已知 r1 观察,非本轮新发现。鉴于(i)(ii)承载了推论的主要
      证伪负担,(iii)的非独立注册不构成 required 级缺陷。
      ⇒ 未复发 DED-004。

    ded_007: |
      未复发。DED-007 的死因是"测量轴焊死"——自变量和被预测量由同一底层数据生成,
      形成数学恒等式。DED-046 的三轴:
      (a)注意力池深度:IFDFW 量表+Raven's 认知任务+决策疲劳代理
      (b)算法消费暴露:算法渠道消费频次+金额占比
      (c)MPC:消费回归系数(ΔC/ΔY)
      三轴在物理测量原理上无共享组件——Raven's 正确率不由消费数据算出,算法渠道消费
      占比不由 MPC 回归系数算出。不存在 DED-007 式的"自变量是因变量的函数"的数学恒等式。
      唯一标注的温和依赖:算法消费暴露的分母(总消费)与 MPC 的分子(ΔC)共享"消费"构念——
      但前者是截面水平,后者是边际变化,非同一统计量,不构成数学恒等式焊死。
      ⇒ 未复发 DED-007。

