id: ADV-REVIEW-023
type: adversarial_review
reviews: DED-018
layer: L3-deductions

人话摘要: |
  对 DED-018(亲缘-绩效分配切换推论:亲缘度 moderates 分配标准——血缘越近平等/
  需要权重越高、血缘越远绩效权重越高;非亲缘+平等+无强制+贡献可区分=空格)的独立
  对抗审查记录。round-1 裁 needs_revision: 1 条 required(时程未操作化→空格预测
  接近 DED-004 式不可证伪风险),5 条 should(机制链 BR-L2-013 错配/基布兹锚解释过当/
  经验底薄/连续 moderation 无定量数据/primary suspect 防御经验空转)。

target: DED-018
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。
  评分卡红旗 10 条逐项攻 + 反例猎捕(判 verified 前必做)+ DED-004(不可证伪循环)
  / DED-007(测量轴焊死)复发检查。裁决三态照评分卡:verified 需同时满足①无 required
  缺陷②亲自猎捕无 scope 内活反例③不重蹈 DED-004/007。

round_1:
  reviewer: "独立子 Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    本条有一个【干净的、可独立检验的增量经验风险】——空格"非亲缘+平等+无外部强制+
    长期+贡献可区分且不等→不可持续"是三块承重砖各自都无法给出的合成预测。BR-L2-002
    只说血亲愿吃亏(给天花板侧利他缓冲,不说分配标准、不说非亲缘侧会塌);BR-L2-017
    说"亲缘/共居情境→平等/需要"的认知分类映射(不给"为什么"、不说空格);BR-L2-013
    说人类对不公平有负反应(给塌缩的心理基础,但不说亲缘度前件、不单独预测空格)。三者
    合成后才出空格预测——这不是对 BR-L2-017 的同义改写,因为 BR-L2-017 是一张认知
    分类表(什么情境用什么标准),不包含"非亲缘平等若无外部强制则结构上不可存续"这一
    存在性断言。故非平凡内核通过了 brick=conclusion 检查。

    理论上,这个空格可以承载一条干净的 verified 推论——但本轮有三个病灶把裁决拉到了
    needs_revision:

    ①【required】"长期/不可持续"无操作化时程。空格预测要求"长期维持平等...且群体
    未塌缩"构成反例;但"长期"是多长?若把基布兹 70-90 年的非亲缘平等算作"还不够长,
    最终还是塌了=支持理论",那就是 DED-004 式的事后万能消化——任何时长都可以被"还没
    到塌的时候"或"你看,塌了吧"双向收编。必须给一个可操作时程(如"跨越至少一整代成员
    更替"或"N 个分配周期后自由骑乘应有累积可测效应"),否则空格预测不是真经验风险。

    ②【should】BR-L2-013 机制错配。BR-L2-013 是不公平厌恶——人对【结果分配不均】
    的负反应(最后通牒博弈中回应者排斥自己拿太少)。但在平等分配标准下,结果恰恰是
    均等的。高贡献者不满的触发点不是"结果不均"(因为结果均等),而是"投入/产出比例
    不对等"(我多干了但拿一样)——这是 equity theory(Adams 1963)的范畴,不是 BR-L2-013
    的 outcome inequity aversion。BR-L2-013 给的是"凭什么你拿得比我多"的反应,不是
    "凭什么我干得多却拿得跟你一样"。推导链步骤 3 将此归因于 BR-L2-013 是不精确的;
    真正的机制更接近 BR-L2-017 的期望违背(在生产/交易语境下,人们期望 equity norm,
    平等分配违背了这一期望)→引发负反应。这不推翻整个机制链(高贡献者仍然不满,塌缩
    压力仍在),但需要修正机制归属。

    ③【should】基布兹锚解释过当。70-90 年(约 3-4 代人)的非亲缘平等存续,至少同等
    程度地支持"非亲缘平等可长期维持"——它恰恰在空格预测声称"不可持续"的格上存活了
    近一个世纪。作者将"最终在 1980s-2000s 转向差异化薪酬"解读为"方向支持空格",但这
    忽略了两个致命混淆:(a)转型恰与以色列宏观经济市场化(1985 经济稳定计划)、基布兹
    债务危机、代际意识形态弱化等外源性震荡同步——自由骑乘内生压力与外部冲击的作用
    无法分离;(b)把"坚持了 70-90 年后最终改变"当"不可持续"的证据,本质上是一种"无论
    塌不塌都能收纳"的解释——塌了=证明不可持续,没塌=还不够久。除非给出时程边界(见
    required ①),此锚的方向是中性甚至反向的,不宜列为"supporting"。

    ④【should】经验底薄。三轮锚全部 confidence=moderate 或 moderate-strong,无一
    是定量连续证据:狩猎采集梯度是"方向匹配、非量化连续变量"、家族企业锚是"单锚偏
    现代市场"、基布兹锚有上述 overclaim。声称的"亲缘梯度上分配标准权重连续位移"
    需要的是 r 与 allocation_norm 的定量协变曲线,目前证据全是定性方向性描述。这本身
    不致命(理论可先于数据),但应诚实标注"连续 moderation 是理论推导、经验验证待补",
    而非将方向性锚当连续梯度证据呈现。

    ⑤【should】primary suspect 防御经验空转。文件正确识别了"群体规模而非亲缘度"
    是最危险的替代解释。扛法是预测(ii)——控制群体规模、只改亲缘/非亲缘情境、预测
    分配标准位移。这个防御在逻辑上成立,但在经验上完全未兑现:没有给出任何已完成的
    受控比较(如同一群人、同等规模、不同亲缘情境下分配标准实测)。primary_suspect
    段宜标注"此防御尚未有受控经验检验,当前仅为逻辑设计"。

    ⑥【minor】测试窗口窄。与 ADV-REVIEW-022 对 DED-017 的诊断相同:falsifiability(a)
    空格的实战测试窗口极窄——"非亲缘+平等+无外部强制+长期+贡献可区分且不等"这串
    条件同时满足的现实案例极少,且排除钩子("外部强制在场"覆盖面广)可合法消化大部分
    靠近的候选。这不等于逻辑不可证伪,但意味着空格在实战中几乎只能靠(b)(c)两条来检验。
    宜诚实注记。

    综合:核心合成(空格)在逻辑上成立且非平凡,但时程未定义使核心经验风险软化,
    BR-L2-013 机制归属需修正,经验锚需诚实降级。1 条 required + 5 条 should。
    required 修掉后,在 verified 射程内。
  red_flag_findings:
    brick_conclusion: |
      未命中(非平凡内核不在单砖)。逐字核三砖原文:

      - BR-L2-002:只给"共享基因比例越高→触发利他行为阈值越低"(Hamilton's rule)。
      说的是【亲属间个体愿意付出多少代价帮对方】,不涉及群体层面的分配公平标准
      (平等/需要/贡献),不预测非亲缘群体用平等会不会塌,也不单独给空格。原文不含
      "allocation norm"或"公平分配标准"字样。

      - BR-L2-017:给"亲缘/共居情境→平等/需要;交易/生产情境→按贡献"的认知分类映射
      (扎根 Fiske 关系模型+Deutsch 分配正义+Sahlins 互惠谱系)。这是一张【描述性映射表】
      ——什么语境下人们倾向于用什么公平标准,不是断言"非亲缘平等不可能持续"。BR-L2-017
      是"is"陈述(人在 X 情境用 Y 标准),DED-018 的空格是"cannot be"陈述(非亲缘平等
      不可持续)。is 推不出 cannot be——这是 Hume's guillotine 的实例,恰是 DED-018
      的增量所在。

      - BR-L2-013:只给"人类对分配结果不公平有自动负反应"(最后通牒/独裁者博弈)。说的
      是【个体级 emotional reaction to unequal outcomes】,不含亲缘度前件,不单独预测
      "非亲缘群体中平等分配会因高贡献者不满而塌缩"——因为这个塌缩链需要①非亲缘情境下
      人期望贡献标准(BR-L2-017)②该期望被违背时产生负反应(BR-L2-013)③无利他缓冲使该
      负反应无法被吸收(BR-L2-002)。任一砖单独都到不了空格。

      三砖合成后的空格可被"非亲缘自发平等长存社群"的现实反例填上→非空可满足、非同义
      反复。brick=conclusion 不命中→不判 required。

      但需承认一个显著接近区:除去空格和连续梯度精化后,DED-018 的核心映射(亲缘→平等/
      非亲缘→贡献)与 BR-L2-017 的映射高度重叠。作者在 discriminant_validity 的
      "与 BR-L2-017 的生死判"段诚实承认了这一点——若(1)归因层推进无法在经验上与
      BR-L2-017 区分,则 novelty 收窄为(2)连续精化+(3)空格。这诚实,不构成 required,
      但提示推论的真实增量比 statement 开篇的宏大叙述更窄。
    nontriviality_cell_check: |
      核心空格通过逐格判空检验——非被任一砖平凡强制:

      - 自变量档=亲缘度(高/低,连续谱),被预测量档=主导分配标准(平等/需要/贡献)。
      - (高亲缘+平等)→非空:家庭日常分享,普遍。
      - (高亲缘+需要)→非空:对病弱亲属的倾斜照顾,普遍。
      - (高亲缘+贡献)→非空:"亲兄弟明算账",特定资源情境下贡献标准在场,本条不排斥。
      - (低亲缘+贡献)→非空:市场/生产组织,普遍。
      - (低亲缘+需要)→非空:制度化福利(有外部强制)→不在空格射程(排除钩子#1)。
      - (低亲缘+平等+无外部强制+长期+贡献可区分且不等)→【空格】

      空格逻辑结构:
      - 无利他缓冲(BR-L2-002缺失)→搭便车诱惑不被亲属宽容吸收;
      - 贡献可区分且不等→搭便车可被识别、高贡献者知道自己"亏了";
      - BR-L2-017→非亲缘/生产情境下成员期望按贡献分配→平等违背了这一期望;
      - BR-L2-013→期望被违背触发负反应→高贡献者退出/惩罚;
      - 无外部强制→无替代机制维持平等→塌缩不可避免。

      每条链路由独立砖供给、最终格由三者合成→非平凡强制。空格可被反例填上→同义反复
      不成立。

      【但】空格的真经验风险被"长期"一词的未定义性削弱——见 verdict_note ①。空格在
      结构上是真经验主张,在操作上是半可测的(时程缺)。这不取消空格的非平凡性,但降低了
      它作为 falsifiability 承载口的实战可操作性。
    measurement_orthogonality: |
      主干未重蹈 DED-007。自变量与被预测量两轴异源:

      - kinship_degree:谱牒重建(r)+拟制亲缘制度签名(结拜/收养文书/拟血缘称谓/共祖仪式
        的独立在场编码)。不涉及分配行为或公平标准→不由被预测量污染。
      - allocation_norm_type:实际分配行为统计+成员正当化理由+违规反应(制裁/谴责/退出)。
        不由"他们是不是亲属"推断→不由自变量污染。

      anti-talisman_clause 双向到位:(①)不得因"用平等分"判高亲缘、因"用贡献分"判低
      亲缘;(②)不得因"是亲属"判"肯定按平等分";(③)遇反例不得事后上调亲缘度来消化;
      (④)至少一个锚须真独立测出亲缘梯度(非嘴上说)。防线在位、DED-007 未复发。

      【should级残留】操作化中"拟制亲缘强度"的测量与"分配标准"的测量在实际田野中的
      边界可能不如纸上清晰。拟制亲缘的制度签名(拟血缘称谓、共祖仪式)与群体内部的互助
      规范常共生——"叫兄弟"同时是称谓制度也是互助期望。编码者可能受"他们互助密切"的
      直觉污染去上调拟制亲缘强度评分,即使有 anti-talisman 约束。这是田野操作挑战,
      非轴焊死→不判 required,但宜在 measurement 段注记此操作性内生风险。
    scope_hook_independent_of_result: |
      基本合规,但有一条需要在 required 修后重新审视。

      excluded_outcomes 三条均按事前渠道划:
      (a)制度化福利(外部强制在场):法律/税收/国家暴力的在场由独立制度事实判→不由
         "该群体是否按平等分"事后开脱。合规。
      (b)贡献不可区分:任务/产出结构的同质性由独立劳动分工分析判→合规。
      (c)纯交换/贸易:属不同射程→合规。

      但【排除钩子(a)的"外部强制"在实践中覆盖面极广且定义模糊】。"外部强制"的范围从
      明确的国家暴力延伸到社会压力、意识形态凝聚力、宗教教规——后三者在场与否的判定
      是连续的。基布兹的"强意识形态凝聚力"被作者自述为"可视为弱外部强制"——但判定的
      任意性大。一个敌意审查者可以据此把几乎任何成功维持平等的群体都归类为"有外部强制
      (哪怕只是社会压力)",从而让空格测试窗口缩到近乎为零。这不等于钩子按结果划(仍是
      事前判),但实操上的弹性值得标注。记 should 不记 required。
    criterion_tier_match: |
      不命中(学到 DED-006)。kinship_degree 明列连续谱(r=0→0.5+,拟制亲缘强度连续);
      allocation_norm_type 三类可混合,按主导标注;预测用比较语言("权重越高""频率
      越高")非硬二分;空格前件包含多档位格而非简单二值。档位与被预测量匹配→合规。
    anti_talisman_cashed: |
      合格(required 不穿透,should 有缺口)。

      承重锚中各至少一条独立测出驱动量:
      - 狩猎采集锚:谱系重建(独立测 r)+觅食回报观察(独立测分享行为)→亲缘度与分配
        标准分离测。confidence moderate(非量化连续),但独立性成立。
      - 家族企业锚:雇佣记录+谱系独立判亲属/非亲属,薪酬结构(固定vs浮动占比)独立测
        公平标准→分离测。confidence moderate(单情境)。
      - 基布兹锚:成员档案独立测血缘关系(r→0),章程/工资改革记录独立测分配标准→分离测。
        confidence moderate-strong(近自然实验),但解释有 overclaim(见 verdict_note ③)。

      anti-talisman_clause 四级防火墙在文件里就位:禁反推亲缘度、禁反推断标准、禁遇反例
      事后调分、至少一锚真兑现独立测。防线书面在位。不是纸上谈兵——三锚均给出了具体的
      独立数据源名而非笼统声称。

      【缺口】"至少一个承重锚真的独立测出驱动量"——三锚的独立性在纸上成立,但:狩猎
      采集的证据是"方向匹配、非量化连续"(尚未做 r 与分享份额的定量回归);家族企业锚
      来自单一现代社会情境、跨文化复现零;基布兹锚的解释方向存在争议(见 verdict_note ③)。
      没有一条锚拿出了"r 从 0→0.5 对应分配标准权重从全部贡献→全部平等的连续曲线"。
      要求这个不现实(这种数据不存在),但宜承认:anti-talisman 在测量设计层面兑现了,
      在经验兑现层面还是初级(方向对、定量缺)。记 should,不判 required。
    anchor_fact_check: |
      无 DED-007 式致命事实错,但有一条锚的解释方向值得质疑:

      - 狩猎采集锚(!Kung/Hadza/Ache):肉食分享随亲缘距离递减→在民族志中被反复记录
        (Wiessner 1982, Kaplan & Hill 1985 等),标准人类学共识。无事实错。confidence
        自标 moderate 诚实——方向匹配但非量化连续变量。

      - 家族企业→职业经理人锚:亲属薪酬偏平等/需要→引入非亲属经理→薪酬结构必位移
        到绩效,方向清晰、机制可观测。作为 stylized fact 成立,但跨文化复现为零、单锚
        偏现代市场情境。confidence moderate 诚实。

      - 基布兹锚:历史事实准确——基布兹运动 1910 年代起源,平等分配,1980s-2000s 系统
        转向差异化薪酬。但【解释方向有 overclaim】:①70-90 年的非亲缘平等存续(约 3-4
        代成员更替)至少同等支持"非亲缘平等可长期维持",列为"方向支持空格"是选择性地
        只看结局不看存续期;②转型与以色列宏观经济市场化(1985 经济稳定计划)、基布兹
        债务危机、代际意识形态弱化等外生冲击同步,自由骑乘内生压力的独立因果贡献无法
        分离;③把"坚持了 70-90 年最终改变"当"不可持续"的证据,若无明确时程边界则构成
        "无论塌不塌都支持"的封闭解释。此锚宜降级或重分类为 boundary_case,不宜以当前
        措辞列为 supporting anchor。记 should,不记 required 事实错。

      综合:无致命事实错,基布兹锚存在解释方向问题。不影响理论硬核(空格的结构逻辑不依
      赖基布兹锚),但影响经验 credibility 的诚实呈现。
    definition_vs_prediction: |
      通过。关键条件均有可独立操作化的定义:

      - kinship_degree:由谱牒重建(r)和拟制亲缘制度签名独立测,不由分配行为定义。
      - allocation_norm_type:由实际分配+正当化理由+违规反应独立测,不由亲缘度定义。
      - 外部强制:由独立制度事实(法律/税收/军警/教规)判,不由"该群体是否用平等分"反推。
      - 贡献可区分性:由任务/产出结构独立测。

      三条预测均为可证伪经验主张(非定义性真理):
      (i)"亲缘度越高的群体,平等/需要分配标准出现的频率越高"→可被统计推翻。
      (ii)"同一群人从亲缘情境切换到非亲缘情境时,分配标准位移"→可被受控比较推翻。
      (iii)空格→可被反例推翻(边界依赖时程操作化,见 required ①)。

      不判 required。但预测(ii)的实战可测性值得标注:需要同一群人、同等群体规模、不同
      亲缘情境、同等资源性质——这种自然实验在现实中极难找到,更可能依赖实验室构造。
      宜在 falsifiability 段标注预测(ii)的经验获取难度,但不改变其逻辑可证伪性。
    enumeration_and_species: |
      不命中(本推论非 N-species 穷举枚举结构)。分配标准(平等/需要/贡献)三分类为分析
      框架而非声称穷举所有可能标准。我仍按 DED-008 精神主动猎遗漏分类与第 N+1 格:

      【遗漏的分配标准可能】
      - 权威/等级分配(按地位高低分配):在某些非亲缘组织中(军队、科层制),"按等级"而非
        "按贡献"是主导分配标准(军饷按军衔,不论个人绩效)。这不完全等价于贡献型(军衔
        不等于当期贡献),也不等价于平等/需要。当前三分类未预留此格。但:权威分配通常
        由外部强制(组织纪律)维持→在空格射程外(有外部强制)→不构成空格的额外格。在
        理论扩展时可增列,非 required 漏洞。

      【第 4 条件的猎捕——是否三条件还不够】
      - 触发事件(导火索):部分集体行动理论认为,即使结构性条件(无利他+有搭便车诱惑+
        贡献可区分)到位,仍需要一个具体事件引发 cascade。在空格情境中,可能"所有条件
        满足,但恰好无人率先发难(协调失败)"→平等意外存活。但:cascade 触发在搭便车
        情境中是内生统计事件——高贡献者的不满积累本身会不断产生"导火索"候选。协调
        失败理论上可能延迟塌缩,但作为对"结构不可持续"的否定则不足——延迟≠不塌。
        不判 required。

      - 领导/企业家:平等非亲缘群体的长期存续可能依赖某个卡理斯玛式领导持续压制分配
        争议。若领导在位则群体存续、领导离去则塌缩→则驱动量不是亲缘度而是"是否存在
        持续压制冲突的领导",且这一变量与亲缘度正交(亲属群体和无亲属群体都可能或不可能
        有这种领导)。这是一个值得标注的替代解释,但尚不足推翻核心(领导本身可能内生于
        群体动力)。记 boundary note,不判 required。
    primary_suspect_aim: |
      【指对,但漏了更致命的隐腿——should】

      primary_suspect 正确:"小群体"而非"亲缘"是真正驱动量——亲缘群体通常小(Dunbar 数内),
      小群体本身可通过声誉/互惠/重复互动维持平等(AXIOM-003+BR-L2-005 足够),亲缘度与
      群体规模在小规模社会中正相关。扛法(预测 ii 控制群体规模)逻辑上成立。这是正确的
      self-critical identification。

      但文件漏认两条更棘手的隐腿:

      (1)【时程未定义→falsifiability 软化——可能比 primary_suspect 更致命】。primary
      suspect 的"小群体替代解释"可用预测(ii)检验(逻辑上有救)。时程未定义没有类似的
      扛法——它是预测本身的内部不完整。若"不可持续"的时程不被操作化,空格预测的逻辑
      可证伪性就沦为 paper-falsifiability:纸面上"找到即推翻",实操上"还没塌=不够久"。
      这是 DED-004 病的变种——不是循环定义,而是预测的时间窗口不封闭。记 required。

      (2)【连续 moderation 的经验 zero-base】。文件 claim 的核心特徵之一是"亲缘梯度
      上分配标准权重连续位移,非二分"——作为对 BR-L2-017 二分映射的精化。但三锚全是
      方向性证据(高亲缘→更多平等;低亲缘→更多贡献),没有任何一条锚展示了 r=0→0.5
      的连续曲线上分配标准权重的协变。连续位移 claim 的经验 base 为零——它是从理论
      机制(Hamilton's rule 的连续 r 递减→利他 buffer 连续递减→分配标准权重连续位移)
      推导出来的,而非从数据中观测到的。这本身不致命(理论推导先于数据是正常的),但应在
      statement 或 evidence 段诚实标注"连续 moderation 是机制推导,定量经验验证为空"。

      【平凡化检查(上位泛化)】抽掉亲缘度 moderator,上位泛化后:"利他缓冲搭便车→平等
      可行;无利他缓冲→须追踪贡献否则塌缩"≈委托-代理/激励相容 101。真正防止这条推论
      被稀释成常识的,正是它把"利他缓冲"的强度与 kinship degree 绑定的 specificity——
      不是"有些群体更利他",而是"利他缓冲强度随 r 单调递减"这一可定量检验的具体主张。
      primary_suspect 段可在此处加一句防平凡化守卫:若 r 梯度的 specificity 被否定
      (发现利他缓冲与 r 无关),则本条退化为 generic 激励相容命题→non-novel。
  counterexample_hunt: |
    主动构造 falsifiability(a) 核心靶——"非亲缘(谱牒独立测 r→0、无拟制亲缘在场)+
    主导平等分配标准(独立测)+ 无外部强制(国家/宗教/法律制裁均不在场)+ 长期维持+
    成员贡献可区分且不等(独立测)+ 群体未塌缩"——的干净案例,攻空格:

    - 基布兹(1910s-1980s 平等期)【最接近空格反例,未被现有机制干净消化】:
      非亲缘(成员档案独立测,r→0) ✓;平等分配(同酬/同餐/同宿) ✓;自愿公社(无国家
      强制) ✓;存续 70-90 年 ✓;成员贡献可区分(农民vs教师vs管理者,产出不同) ✓。
      空格前件五个条件全部满足至少 70 年。作者将此列为"supporting anchor",理由是
      "最终在 1980s-2000s 转向差异化薪酬=方向支持空格"。

      消化评价:【未干净消化】——消化逻辑"70-90 年最终塌了=支持理论"等价于"没塌=还不
      够久,塌了=证明不可持续",构成 closed explanatory loop。且转型恰与外生宏观经济
      震荡同步,自由骑乘内生压力的独立因果贡献不可分离。如果空格预测"非亲缘平等不可
      持续"要被基布兹 70-90 年的存续所"支持"而非"证伪",那么需要回答:到底多少年算
      "长期"?若 70-90 年不构成反例,那么 200 年? 500 年?

      这不是净杀(基布兹确实最终转向了差异化薪酬,方向与预测一致),但暴露了理论在时程
      维度的空白——没有时程边界,空格就不是一个边界清晰的预测。记 required(需操作化时程)。

    - Twin Oaks(美国弗吉尼亚,1967-至今,~60 年)【近空格,被部分消化】:
      非亲缘成员(r→0) ✓;收入共享/平等分配 ✓;无外部国家强制 ✓;存续~60 年 ✓;成员
      贡献可区分(劳动分工,有人做会计有人种菜) ✓。
      消化口:①劳动信用系统(labor credit)——所有劳动时间等价计价(1 小时烹饪=1 小时
      会计),这构成了贡献追踪机制,只是所有劳动被等价估值→贡献被追踪但被等同计价,
      有争议是否"按贡献分"还是"按平等分";②群体小(≤100 人)→primary suspect 的"小群体
      可凭声誉/互惠维持平等"解释可能适用;③成员意识形态自选→低 inequity aversion 人群
      聚集,可能不满足 BR-L2-013 的普遍心理假设。未净杀但进一步凸显:小规模非亲缘平等
      群体可凭声誉+互惠+内部治理存续数十年,而这不依赖亲缘利他。若 primary suspect
      (小群体替代解释)为真,则本推论的归因(kinship→平等可行)是虚假的——真正的 driver
      是 group size,kinship 只是一个 proxy。

    - East Wind(密苏里,1974-至今,~50 年)【同类,Twin Oaks 姐妹社区,消化口相同】。

    - 佛教僧团(Sangha,~2500 年)【被消化】:
      非亲缘成员 ✓;平等分配(托钵乞食均分、僧舍同住) ✓;存续极长 ✓;贡献可区分
      (有学者僧/劳动僧/禅修僧) ✓。消化口:①Vinaya 戒律提供强内部治理→可视为
      "外部强制"在场(戒律对个体的约束力类似法律);②"法兄弟/师兄"等拟血缘称谓→
      拟制亲缘在场(DED-009 species A)→亲缘度可能非低。被两条合法消化。

    - Hutterites 公社【被作者 pre-registered 为候选反例,预判为拟制亲缘+外部强制
      在场→消化。预判合理,不构成净杀】。

    - 西班牙无政府主义集体(1936-1939)【被消化】:
      非亲缘 ✓;平等分配 ✓;无外部强制 ✓;贡献可区分 ✓。但存续仅~3 年→不满足"长期"
      条件;且被外部武力摧毁(Franco 胜利)而非内部塌缩→因果方向不符。被消化。

    - 海盗船民主(17-18 世纪)【被部分消化】:
      非亲缘 ✓;战利品平等分配(有书面章程) ✓;存续年-十年级 ✓;贡献可区分 ✓。
      消化口:①船长/军需官获额外份额→非严格平等、有贡献成分;②海盗章程具有强约束力
      (违反者 marooning)→可视为外部强制在场;③存续时长有限(船只生命周期)→"长期"
      存疑。被消化。

    猎捕结论:【无 Type-A 干净净杀】——最接近的基布兹(70-90 年平等期)因最终转向而
    方向与预测一致,但"时程未定义→closed loop 消化"的逻辑漏洞被暴露。Twin Oaks/
    East Wind(~50-60 年仍在平等存续中)悬置——若"长期"被操作化为例如>30 年,则它们
    构成活跃反例(还未塌);若"长期"未定义,则它们可被"还不够久"挡掉。此悬置恰恰证明
    required ①(时程操作化)的必要:当前状态下,空格预测的内容边界不闭合,审查者无法
    判定 Twin Oaks 是净杀还是非反例。
  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发,但时程未定义带来复发风险】。falsifiability(a)
    给出了明确的证伪条件——找到满足五项前件的群体且"长期维持...未塌缩"。这与 DED-004
    的"行政记录与法律成文绑在一起出现"的被发现为假的 claim 不同——DED-004 是 claim
    本身被经验推翻了。DED-018 的空格在逻辑上是可被反例推翻的——只要找到一个满足五项
    前件的反例。

    但"长期"未定义带来 DED-004 式循环的变体风险:若审查者提交 Twin Oaks(~60 年平等
    存续中)作为反例,作者回应"60 年不够长期"——这就是把 falsifiability 窗口推到了
    永远到不了的未来。当前 DED-004 的前门防线(砖不同、非循环定义)在位,但后门未关
    (时程无边界→反例可被无限 defer)。这不是 full DED-004(没有循环定义),但 functional
    equivalent:预测在当前无时程定义时无法实战证伪。记 required(修掉后此风险解除)。

    anti-talisman_clause 的四级防火墙进一步防 DED-004 式的事后开脱:不得遇反例上调
    亲缘度、不得遇反例塞入外部强制、不得遇反例补认拟制亲缘——"及时程操作化+这些防线
    全部在位"后,空格具备真正的(而非纸面上的)可证伪性。以此为标准,当前状态为"逻辑
    可证伪、实战差时程边界"。

    DED-007(焊死测量轴):【未复发】。kinship_degree 与 allocation_norm_type 分轴
    独立测,谱牒/制度签名 vs 分配行为/理由/违规反应,异源、不共用指标。anti-talisman
    双向禁反推在位。无 DED-007 式分母用结果量之焊死。see red_flag_findings 第 3 条。
  required_fixes:
    - |
      [required] 操作化"长期/不可持续"的时程边界。当前空格预测要求"长期维持平等...
      且群体未塌缩"构成反例,但"长期"无定义→任何时长都可被"还不够久"或"你看,塌了吧"
      双向收编(DED-004 式封闭解释循环风险)。修法二选一:(a)给定操作化时程——例如
      "跨越至少一整代成员更替(核心成员自然退出+新成员加入→平均任期周转一轮),约 20-30 年;
      或累计至少 N 个完整分配周期后自由骑乘应有累积可测效应";(b)或放弃绝对时程、改用
      比较语言——"非亲缘平等的存续时长期望值系统性短于亲缘平等,且塌缩概率随存续时间
      单调上升(可由 survival analysis 检验)"。无论选哪种,必须让空格预测的真经验风险
      在时程维度上闭合——即事前可判断一个观察是否落入空格。修完后,Twin Oaks(~60 年
      仍在平等存续中)这类案例就可以被明确判定为反例或非反例,而非悬置。
    - |
      [should] 修正 BR-L2-013 的机制归属。BR-L2-013 是不公平厌恶——人对结果分配
      不均的负反应(最后通牒博弈:"凭什么你拿的比我多")。但在平等分配标准下,高贡献者
      与低贡献者结果均等——触发的不满不是"结果不均",而是"投入/产出比例不对等"
      ("凭什么我多干却跟你拿一样")。后者是 equity theory(Adams 1963)的范畴,非
      BR-L2-013 的 outcome inequity aversion。修法:推导链步骤 3 中,将"BR-L2-013"
      改为"BR-L2-017(非亲缘/生产情境成员期望贡献标准)+ 期望违背触发负反应(此负反应
      由 BR-L2-013 的不公厌恶机制支撑,但触发条件不同:违背贡献期望而非结果不均)",或
      新增一个简短说明区分"结果不公厌恶"与"投入/回报比例不公"。这不破坏机制链(高贡献
      者依然不满),但修正了跨砖引用的精确性。
    - |
      [should] 降级基布兹锚或重分类。基布兹 70-90 年非亲缘平等存续+与外生经济震荡
      同步的最终转型,不宜列为 supporting anchor(当前"方向支持空格"的解读是选择性的)。
      建议:要么重分类为 boundary_case("非亲缘平等可长期存续(70-90 年)但最终转向→
      不单独支持也不单独证伪理论,其边界状态取决于时程操作化(见 required ①)"),要么
      大幅降 confidence 至 weak 并标注"外生冲击与内生塌缩无法分离"。同时补入反向注记:
      "若将 70-90 年视为'长期',则基布兹支持'非亲缘平等可长期维持'的证据不弱于支持
      '非亲缘平等不可持续'的证据"。
    - |
      [should] 标注"连续 moderation"的经验空基。文件声称"亲缘梯度上分配标准权重
      连续位移,非二分"——这是对 BR-L2-017 二分映射的精化,也是推论的核心特徵之一。
      但当前三锚全是定性方向性证据(高亲缘→多平等;低亲缘→多贡献),没有一条锚提供
      r 与分配标准权重的定量协变数据。"连续 moderation"目前纯粹是理论推导(Hamilton's
      rule 的连续 r→连续利他 buffer→连续分配权重位移),经验 base 为零。修法:在
      real_world_anchors 段或 limitations 段增一句诚实标注——"连续 moderation 是
      理论推导,全定量经验验证待补;当前锚仅支持方向性(正负号)非函数形式"——而不改变
      理论声称。
    - |
      [should] primary_suspect 标注经验空转。正确识别了 primary suspect(群体规模替代),
      扛法是预测(ii)(同一群人控制规模只改亲缘情境)。此防御在逻辑上成立,但经验上完全
      未兑现——无任何已完成/引用的受控比较数据。修法:在 primary_suspect 段末尾加一句
      "注:此防御当前仅为逻辑设计,尚未有受控经验检验",使读者不被"有扛法"的表述误导为
      "已扛住"。另可增列 secondary suspect(见 verdict_note ②④):连续 moderation
      的经验空基作为辅助 suspect,因若方向性本身不稳健(仅 moderate 锚),连续函数形式
      更无基础。
    - |
      [minor] 诚实标注空格测试窗口窄。与 ADV-REVIEW-022 对 DED-017 的同类诊断:五项前件
      (非亲缘+平等+无外部强制+长期+贡献可区分且不等)同时满足的现实案例极少,排除钩子
      #1(外部强制在场的覆盖面极广且定义弹性大)可合法消化大部分靠近的候选。空格在逻辑上
      可证伪,但在实战中几乎只能靠(b)(c)两条检验。宜在 falsifiability 段增一句诚实
      标注。

author_response_round_1: |
  作者回应 round-1 六项整改,逐一消解:

  ①【required:时程操作化】已新增 operationalization.temporal_threshold,采用两档联合
  判据:(a)代际周转(创始代核心≥半数被非创始代替代,平均任期~20-30年);(b)≥N个完整
  分配周期(N≥群体规模)。两档任一满足即判"长期"成立。判据实质是"搭便车压力是否已完成
  至少一轮完整的成员暴露与博弈学习",代际周转与分配周期是此实质的可操作代理。falsifiability(a)
  已显式引用 temporal_threshold。Twin Oaks(~60年,创始代已基本退出→满足代际周转)可明确
  判定为反例候选——若仍未塌缩则空格被填。封闭解释循环风险解除。

  ②【should:BR-L2-013机制归属】已修正推导链步骤3。区分 outcome inequity aversion
  ("凭什么你拿得比我多")与 equity theory("凭什么我多干却跟你拿一样"),明确高贡献者不满
  的触发点是投入/产出比例不对等。机制链重述为:BR-L2-017(非亲缘情境期望贡献标准)→平等
  分配违背期望→期望违背触发负反应(底层心理机制由 BR-L2-013 的不公厌恶支撑,但触发条件
  不同:违背贡献期望而非结果不均)→AXIOM-001 给方向性压力。步骤标题改为"期望违背与搭便车
  塌缩(BR-L2-017+BR-L2-013)",机制归属精确化。

  ③【should:基布兹锚降级】已将基布兹从 supporting anchors 移除,重分类为 boundary_case。
  新 boundary_case 分析双向呈现:正方(方向支持空格,最终转向差异化薪酬)与反方(挑战空格,
  70-90年远超代际周转阈值的平等存续),并标注外生震荡与内生压力的因果不可分离。判据:不单独
  支持也不单独证伪理论,待独立因果拆解。

  ④【should:连续moderation经验空基】已在 real_world_anchors 末新增 empirical_limitations
  段,诚实标注"连续 moderation 纯为理论推导、经验 base 为零;当前锚仅支持方向性(正负号),
  不支持连续函数形式"。不改变理论声称,但区分已观测的方向性效应与理论推导的函数形式。

  ⑤【should:primary_suspect防御经验空转】已在 primary_suspect 段末尾加注"此防御当前仅为
  逻辑设计,尚未有受控经验检验——无任何已完成的同一群体控制规模只变亲缘情境的受控比较数据。
  不排除群体规模与亲缘度存在未被拆分的共变。"

  ⑥【minor:测试窗口窄】已在 falsifiability 段(c)条件后加注,诚实标注五项前件同时满足的
  现实案例极少,空格实战中几乎只能靠(b)统计关联与(c)情境切换两条检验。非逻辑缺陷,但防止
  高估空格的实战检验力。

  全部 1 required + 5 should 已修,等待 round-2 审查。

domain: [分配正义, 亲属制度, 组织理论, 行为经济学]
created: 2026-07-14

round_2:
  reviewer: "独立子Agent (round 2, 全新独立上下文, 与作者及 round-1 审查者无关)"
  verdict: verified
  verdict_note: |
    核心空格通过了 round-1 required 修后的再检验。时程操作化(temporal_threshold)为
    实质性修复——"代际周转~20-30年"与"N个完整分配周期"两档联合判据使空格预测的
    时程维度闭合:Twin Oaks(~60年,创始代已退出)可明确判定为反例候选,封闭解释循环
    (DED-004)风险解除。

    三项 verified 闸门的逐条裁决:
    (1) 无 required 级缺陷。round-1 的 1 required + 5 should 已全部修到位:
    时程已操作化、BR-L2-013 机制归属已修正(equity theory 区分已到位)、基布兹锚
    已降级为 boundary_case(双向呈现+外生震荡标注)、连续 moderation 经验空基已在
    empirical_limitations 段诚实标注、primary_suspect 防御经验空转已标注、
    测试窗口窄已注记。
    (2) 反例猎捕:以 operationalized 时程重新猎空格反例——Twin Oaks(~60年,满足
    代际周转)为最接近候选,但其 labor credit 系统(所有劳动按小时等值计价)构成
    贡献追踪机制→非纯粹"平等型"分配(零贡献者不得分享,贡献被追踪只是被等值)。
    East Wind/Acorn 同理。纯平等(无任何贡献追踪+无外部强制+长期+贡献可区分)的
    非亲缘群体未猎得。Type-A 净杀不存在。
    (3) DED-004/007 未复发。测量轴正交(谱牒重建 vs 分配行为/理由/违规),
    anti-talisman 四级防火墙在位,时程操作化关闭了"还不够久"后门。

    推论的实质增量诚实收敛为:归因层推进(认知分类→激励结构)与 BR-L2-017 的经验
    可区分性有限;连续 moderation 经验 base 仍为零;空格是真增量——断言了 BR-L2-017
    不排除的格不可存在。此收敛不致命(空格仍是独立可证伪经验风险),但 statement
    开篇的宏大叙述与实际增量间存在落差——宜在显著位置标注"推论的核心可独立检验
    增量为空格预测;归因推进与连续精化当前为辅证、经验验证待补"。

    总评:经 round-1 六项修复,本条已具备 verified 资格——空格是可证伪的真经验风险、
    时程有边界、测量轴正交、反例猎捕无净杀。剩余四点 should 属诚实呈现层面的打磨,
    非结构缺陷。

  red_flag_findings:
    brick_conclusion: |
      未命中(再次确认)。三块砖逐字复查 round-2:

      BR-L2-002(亲缘利他):"共享基因比例越高→触发利他行为阈值越低"。个体层面
      的利他意愿(Hamilton's rule),不涉及群体分配公平标准(平等/需要/贡献),不预测
      "非亲缘平等不可持续"。原文不含 allocation norm 或 fairness standard 字样。

      BR-L2-017(分配规范随语境切换):"共享/共居情境→平等/需要;交易/生产情境→
      按贡献"。描述性认知分类映射(Fiske/Deutsch/Sahlins)——"is"陈述(人在 X 情境
      倾向于用 Y 标准),非"cannot be"陈述(非亲缘平等不可持续)。BR-L2-017 不给出
      空格预测——"倾向于按贡献分"≠"若按平等分且无外部强制则必然塌缩"。Hume's
      guillotine:is 推不出 cannot be。另:BR-L2-017 的"当资源性质从共享品变为稀缺
      激励品时分配标准位移"已有稀缺度→分配标准方向,但稀缺度 moderation 与亲缘度
      moderation 是正交轴(见 DED-018 与 DED-013 的 discriminant_validity)→不重叠。

      BR-L2-013(不公平厌恶):"人对不公平的结果分配持续表现出负面反应"。proximal
      cause 是结果不均(outcome inequity)。DED-018 机制链中触发塌缩的 proximal cause
      是投入/产出比例不对等(equity theory)→触发条件不同。BR-L2-013 提供底层心理
      机制(不公厌恶),但单独不预测"非亲缘群体中平等分配会因高贡献者不满而塌缩"
      ——这个塌缩链需 BR-L2-017(期望贡献标准)+BR-L2-013(负反应)+BR-L2-002 缺失
      (无利他缓冲)三者合成。

      三砖合成后的空格可被"非亲缘自发平等长存社群"填上→同义反复不成立。
      需诚实地承认接近区:BR-L2-017 的"亲缘/共居→平等"映射与 DED-018 核心方向
      高度重叠。DED-018 在 discriminant_validity 的"生死判"段诚实承认:若归因推进
      (认知分类→激励结构)无法在经验上与 BR-L2-017 区分,novelty 收窄为连续精化+
      空格。空格是真增量→brick=conclusion 不命中。

    nontriviality_cell_check: |
      空格经时程操作化后通过逐格判空再检验:

      自变量档=亲缘度(高/低,连续谱),被预测量档=主导分配标准(平等/需要/贡献)。
      (高亲缘+平等)→非空:家庭日常分享;
      (高亲缘+需要)→非空:对病弱亲属的倾斜照顾;
      (高亲缘+贡献)→非空:亲兄弟明算账(本条不排斥);
      (低亲缘+贡献)→非空:市场/生产组织;
      (低亲缘+需要)→非空:制度化福利(外部强制在场→出空格射程);
      (低亲缘+平等+无外部强制+长期(≥代际周转或≥N个分配周期)+贡献可区分且不等)
        →【空格】

      空格逻辑链经时程闭合后的张力:无利他缓冲→搭便车诱惑不被吸收;贡献可区分→
      高贡献者可识别被"占便宜";BR-L2-017→非亲缘情境下成员期望贡献标准→平等违背
      期望;期望违背触发负反应(BR-L2-013 支撑底层心理,触发条件为投入/产出比例
      不对等);无外部强制→无替代机制;经≥一代成员更替→搭便车压力完成至少一轮
      完整暴露与博弈学习→塌缩。

      空格是真经验主张:五项前件均由独立指标判定(亲缘度由谱牒、平等由分配行为+
      理由+反应、外部强制由制度事实、长期由代际周转+分配周期、贡献可区分性由任务
      结构),非由"群体是否塌缩"反推。可被反例填上→非同义反复。

      时程操作化是关键升级——round-1 时"长期"未定义使空格在实战中不可测;现在 Twin
      Oaks 等案例可被明确判定(满足代际周转→若未塌缩则构成反例)。空格风险从
      paper-falsifiability 升级为 genuine empirical risk。

    measurement_orthogonality: |
      DED-007 未复发(再次确认)。自变量(kinship_degree)与被预测量(allocation_norm_type)
      分轴独立测:亲缘度由谱牒重建(r)+拟制亲缘制度签名(结拜/收养文书/拟血缘称谓/
      共祖仪式的独立在场编码)→不由分配行为测;分配标准由实际分配行为统计+成员
      正当化理由+违规反应(制裁/谴责/退出)→不由亲缘度推断。

      anti-talisman 四级防火墙在位:①禁反推亲缘度;②禁反推断标准;③遇反例不得事后
      上调亲缘度消化;④至少一锚须真独立测出亲缘梯度。防线在位、DED-007 未复发。

      round_1 标注的"拟制亲缘制度签名与互助规范在田野中共生"的操作性内生风险
      仍存在,但不构成轴焊死——那是田野操作挑战,非概念混淆。不判 required。

      round_2 新增警惕:self-selection 隐腿(见 primary_suspect_aim)创造了隐蔽的
      测量轴软焊点——若研究者因"该群体维持了平等"而推断"该群体成员一定有低
      inequity aversion",则 inequity aversion 的测量被结果(平等存续)污染。此风险
      在文件当前未讨论,但可通过将 inequity aversion 视为 BR-L2-013 的组间均值属性
      (非由分配结果反推)来防。记 boundary note,不判 required。

    scope_hook_independent_of_result: |
      合规(再次确认)。三条排除钩子均按事前渠道划:
      (a)制度化福利——法律/税收/国家暴力的在场由独立制度事实判;
      (b)贡献不可区分——任务/产出结构同质性由独立劳动分工分析判;
      (c)纯交换/贸易——属不同射程(DED-005/006/007 域)。

      round_1 标注的"外部强制覆盖面广且定义弹性大"的操作挑战仍存在(从明确国家
      暴力到意识形态凝聚力→判定连续),但不改变钩子的事前结构性——判定标准是制度
      事实的在场,非"该群体是否按平等分"。

      round_2 新增关注:经 temporal_threshold 操作化后,若一个非亲缘平等群体被判定
      为"长期"成立→应优先查其是否满足排除钩子(a)或(b),而非首先怀疑时程判定。
      此顺序约束尚未显式写为流程规则。另,"退出成本/地理强制"(高贡献者因地理隔离/
      无替代群体而无法退出→群体因"被困住"而非"可持续"存续)在当前排除钩子中未
      被显式覆盖——可被 subsumed 在"外部强制"(地理强制→弱外部强制)下但未声明。
      记 should(见 should_fixes),不判 required。

    criterion_tier_match: |
      不命中(再次确认,DED-006 教训已学到)。kinship_degree 为连续谱(r=0→0.5+,
      拟制亲缘强度连续);allocation_norm_type 三类型可混合、按主导标注;预测用比较
      语言("权重越高""频率越高")非硬二分;空格前件含多档位格。档位与被预测量匹配。

    anti_talisman_cashed: |
      合格(required 不穿透)。承重锚各至少一条独立测出驱动量:
      - 狩猎采集锚:谱系重建(独立测 r)+觅食回报观察(独立测分享)→分离测。
        confidence moderate(方向匹配,非量化连续)。
      - 家族企业锚:雇佣记录+谱系独立判定亲属/非亲属,薪酬结构(固定vs浮动占比)
        独立测公平标准→分离测。confidence moderate(单情境)。

      anti-talisman 在测量设计层面兑现。经验兑现仍为方向性→定量连续验证为零。
      round_2 新增关注(should):Twin Oaks 型案例若被提出为反例,其 labor credit
      系统对分配标准分类(平等 vs 贡献)的模糊性不应被用于事后开脱——即不能遇到
      Twin Oaks 说"它有贡献追踪所以不是平等型",遇到纯平等无追踪的又说"它还没到
      长期所以不构成反例"。anti-talisman 精神要求对分类判据的事前一致性:要么 labor
      credit 型一律算贡献型(有追踪→前件不满足),要么一律不算——不能按"是否构成
      反例"事后选判据。当前操作化未对此边界做显式裁决。记 should(见 should_fixes)。

    anchor_fact_check: |
      经 round_1 修后无事实错:

      - 狩猎采集锚(!Kung/Hadza/Ache):肉食分享随亲缘距离递减→民族志反复记录
        (Wiessner 1982, Kaplan & Hill 1985 等),标准人类学共识。无事实错。
        confidence moderate 诚实(方向匹配但非量化连续)。

      - 家族企业→职业经理人锚:亲属薪酬偏平等/需要→非亲属经理引入后薪酬结构
        位移到绩效。作为 stylized fact 成立,方向清晰,单情境偏现代市场。
        confidence moderate 诚实。

      - 基布兹锚:已从 supporting 移除,重分类为 boundary_case。双向呈现(正方=
        最终转向差异化薪酬;反方=70-90年远超代际周转阈值的平等存续),标注外生
        震荡与内生压力因果不可分离。处理正确,无 overclaim。

      综合:无致命事实错。三锚方向正确、confidence 诚实。连续 moderation 经验零基
      已在 empirical_limitations 段诚实标注→不构成事实歪曲。round_2 无新事实发现。

    definition_vs_prediction: |
      通过(再次确认)。所有关键条件均可独立操作化:kinship_degree 由谱牒+制度签名
      独立测;allocation_norm_type 由分配行为+理由+违规反应独立测;外部强制由制度
      事实独立判;贡献可区分性由任务/产出结构独立测;长期由代际周转+分配周期独立测。
      三者预测均为可证伪经验主张(非定义性真理):(i)统计关联可被数据推翻;(ii)情境
      切换可被受控比较推翻;(iii)空格可被反例推翻(时程边界已闭合)。

      经 temporal_threshold 操作化后,(iii)的真经验风险实质化:找到一个满足五项
      前件(含长期)的非亲缘平等未塌群体→证伪。非 definitional truth。

      预测(ii)的实战可测性仍低(需同一群人、同等规模、不同亲缘情境的自然实验),
      但逻辑可证伪性不受影响。不判 required。

    enumeration_and_species: |
      不命中(本推论非 N-species 穷举结构)。分配标准三分类(平等/需要/贡献)为
      分析框架非声称穷举所有可能标准。

      按 DED-008 精神本轮新增猎捕:

      【遗漏分配标准:按资历(seniority)】在某些非亲缘组织中(学术 tenure/工会/
      日本年功序列),分配按资历而非当期贡献。资历≠贡献(过去贡献≠当前贡献),也非
      平等/需要。但:资历分配通常由制度强制(合同/工会协议)维持→在空格射程外
      (有外部强制)。若存在自发/无制度强制的资历型分配且长期存续→需扩容分类。
      当前不判 required。

      【遗漏空格前件:退出成本/地理强制】若高贡献者因地理隔离/无替代群体/技能
      不可迁移而【无法退出】,则即使不满群体也可能被"困住"而意外存续。此时塌缩
      机制被退出障碍阻断→空格可能被非塌缩方式填充(不满但被迫留)。操作化中未列
      "退出成本"为独立前件→潜在的第 N+1 条件。但退出成本可被 subsumed 在"外部
      强制"(地理强制/经济强制→弱外部强制)下→前件不成立。此 subsumption 需在
      排除钩子中显式声明。记 should(见 should_fixes)。

      【混血案例:Twin Oaks 的 labor credit 系统】劳动时间等值计价:贡献被追踪
      (零工作→零分享),但所有劳动被等同估值(非多劳多得)。介于平等型与贡献型
      之间的混合态。当前操作化未对"贡献被追踪但被等同估值"型系统做分类裁决。
      此模糊带在反例猎捕中关键:Twin Oaks 若被归为平等型→活反例;若被归为贡献型
      (因为有追踪)→非反例。宜在 allocation_norm_type 的 measurement 段明确裁决。
      记 should(见 should_fixes)。

    primary_suspect_aim: |
      指对,但 round_2 暴露新隐腿。

      primary_suspect("小群体而非亲缘"是真正驱动量)识别准确;扛法(预测 ii 控制
      规模只改亲缘情境)逻辑成立;经验空转已标注(round_1 should ⑤)。合格。

      新增隐腿:【self-selection 对 BR-L2-013 普适性的消解】。空格预测 presupposes
      成员具有"正常"的不公平厌恶(BR-L2-013)。但现实中成功维持非亲缘平等的群体
      (Twin Oaks/East Wind/基布兹)几乎全都是意识形态 self-selected——加入者需经
      面试/试用期,筛选出对平等有强意识形态承诺、低 inequity aversion 的个体。
      若此 self-selection 可将群体的平均 inequity aversion 压到 BR-L2-013 不再
      生效的水平,则空格 prediction 的 scope 被隐性收窄为"非 self-selected 人群"
      ——而现实中几乎不存在此类群体(无意识形态的非亲缘平等群体从一开始就不会
      形成)。这不构成 DED-004 循环(前件仍可独立判),但意味着空格的实战
      falsifiability 比纸面更窄:唯一可能填格的候选(Twin Oaks 型)因 self-selection
      而使 BR-L2-013 前件(普遍 inequity aversion)可能不成立。此隐腿比
      primary_suspect 更阴险——不是"驱动量错了",而是"机制的一个关键前提在唯一的
      测试人群中系统性不成立"。建议处置:在 falsifiability 段或 unlikely_suspect
      段标注此稀释效应。记 should(见 should_fixes)。

      平凡化检查(上位泛化):抽掉 r-梯度 specificity 后→"有利他缓冲则平等可行,
      无则需追踪贡献"≈激励相容/委托-代理 101。防平凡化的锚正是 r 与利他 buffer
      的单调绑定。但 r-梯度的经验 base 为零(empirical_limitations 已诚实标注)→
      防平凡化锚本身尚未被经验坐实。不推翻理论(理论可先于数据),但提示推论在
      经验层面的 non-triviality 仍为 promissory note。记 should。

  counterexample_hunt: |
    以 operationalized 时程边界(代际周转~20-30年)重新猎空格。猎捕靶:
    "非亲缘(r→0,谱牒独立测+无拟制亲缘在场) + 平等型主导分配标准(独立测) +
    无外部强制(国家/宗教/法律制裁不在场) + 长期(≥代际周转或≥N个分配周期) +
    成员贡献可区分且不等(独立测) + 群体未塌缩"

    【Twin Oaks(弗吉尼亚,1967-至今,~60年)】——最接近空格反例:
    非亲缘(r→0) ✓; 收入共享/平等 ✓; 无国家强制 ✓; 代际周转达成(创始代已基本
    退出,~60年>>20-30年阈值) ✓; 贡献可区分(不同工种) ✓; 未塌缩 ✓。
    消化点:labor credit 系统——所有劳动按小时等值计价,零贡献者不得分享。
    这构成"贡献追踪机制"(contribution IS tracked),争议在于"贡献被追踪但被
    等同估值"归类为平等型还是贡献型。若按"有追踪→贡献型"分类→空格前件不满足
    (非纯粹平等);若按"等值→平等型"分类→Twin Oaks 是活反例。当前操作化对此
    无显式裁决→Twin Oaks 悬置于"被消化/净杀"之间。

    【East Wind(密苏里,1974-至今,~50年)】——Twin Oaks 姐妹社区,同 labor credit
    系统,同消化口/同悬置。

    【Acorn Community(弗吉尼亚,1993-至今,~33年)】——同 FEC 成员,收入共享,
    labor credit 系统,存续~33年(刚过代际周转阈值)。同悬置。

    【以色列基布兹(Samar 等少数仍维持完全平等的)】——非亲缘 ✓; 平等 ✓;
    无国家强制 ✓; 代际周转远超 ✓(100+年); 贡献可区分 ✓; 未塌缩 ✓。
    消化口:强意识形态(社会主义锡安主义)→可视为"弱外部强制"在场→出空格射程。
    但此消化依赖于"意识形态凝聚力=外部强制"的弹性解释。

    【其他排除/消化案例】
    - Hutterites/Bruderhof/Amish:宗教强制在场→排除钩子#1 消化。
    - 佛教僧团(Sangha):Vinaya 戒律→外部强制+拟制亲缘在场→双消化。
    - 海盗船民主(17-18世纪):存续时长不足(年-十年)+海盗章程强约束力→不满足
      长期+外部强制在场。被消化。
    - 西班牙无政府主义集体(1936-1939):存续~3年+外部武力摧毁→不满足长期且
      因果不符。被消化。
    - 传统村落邻里互助:属 BR-L2-005 互惠利他域,非"分配可竞争资源"。被消化。

    猎捕结论:【无 Type-A 净杀——但发现一个关键的分类模糊带】。Twin Oaks/
    East Wind/Acorn 的 labor credit 系统造成分配标准分类歧义——"贡献被追踪但
    被等同估值"介于平等型与贡献型之间,当前操作化未做裁决。此模糊带不构成净杀
    (labor credit 可被合理归类为贡献型变体→出空格),但暴露了 allocation_norm_type
    操作化在面对混合系统时的分类分辨率不足。若 future 审查者提交一个无任何贡献
    追踪的纯平等非亲缘长期群体(而非 labor credit 型)作为反例,则该反例可能无
    现存消化口→届时需 rejecting the theory。当前未猎得此类群体。

    此外,self-selection 效应(见 primary_suspect_aim 新增隐腿)使现存非亲缘平等
    群体的成员可能系统性偏离 BR-L2-013 的"普遍 inequity aversion"假设——若该假设
    在这些群体中不成立,则空格在唯一可观测的人群中原则上不可测。这不等于理论假
    (可在非 self-selected 人群中预测塌缩),但削弱了空格的实战检验力。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发——temporal_threshold 修复到位】。round_1
    诊断的"时程未定义→封闭解释循环(DED-004 变体)"风险经两档联合判据(代际周转
    ~20-30年 + N个分配周期累积)修复后解除。Twin Oaks(~60年)明确满足代际周转→
    构成反例候选而非悬置。审查者可事前判定一案例是否满足"长期"→falsifiability
    窗口闭合。

    残留的 DED-004 风险转移到了 allocation_norm_type 的分类模糊带(labor credit
    型混合系统→见 counterexample_hunt)。若此分类模糊带被用于事后开脱("这个案例
    虽然有追踪但是等值的所以算平等型→反例;那个案例虽然有追踪但是等值的所以算
    贡献型→消化"),则构成新的闭口解释循环。此风险由 anti-talisman 精神约束
    (分类标准的事前一致性)可防,但需在操作化中显式裁决 labor credit 型系统的归类。
    当前为隐性风险,不判 required(因为尚未发现不可裁决的净杀反例),但应在
    allocation_norm_type.measurement 段补裁决。记 should。

    DED-007(焊死测量轴):【未复发】。kinship_degree(谱牒重建+制度签名)与
    allocation_norm_type(分配行为+理由+违规反应)异源独立测。anti-talisman 四级
    防火墙在位(禁反推亲缘度、禁反推断标准、禁事后调分、至少一锚真独立测)。
    无 DED-007 式分母用结果量之焊死。

  required_fixes: []

  should_fixes:
    - |
      [should] 裁决 labor credit 型混合系统的分配标准归类。Twin Oaks/East Wind
      等 labor credit 系统(贡献被追踪但被等同估值)在"平等型"与"贡献型"之间造成
      分类歧义,而此歧义恰好落在空格反例猎捕的关键路径上。建议在 allocation_norm_type
      的 measurement 段补一条裁决规则:贡献追踪的有/无是否优先于估值差异化?
      若"有追踪→不论估值是否差异化,一律归贡献型",则 labor credit 系统出空格射程
      (前件不满足);若"等值→平等型",则 Twin Oaks 构成活反例,需 honest 面对。
      裁决本身不如裁决的一致性重要——关键是定了就不能按"是否构成反例"事后换。
    - |
      [should] 标注 self-selection 对 BR-L2-013 前件的稀释效应。空格预测预设成员
      具有 BR-L2-013 的普遍 inequity aversion,但现实中最可能填格的候选群体
      (Twin Oaks/基布兹等)均经意识形态 self-selection→成员可能系统性处于
      inequity aversion 分布的低尾。若 self-selection 可使该前件失效,空格在唯一
      可观测人群中原则上不可测。建议在 falsifiability 段或 unlikely_suspect 段
      标注:"若 self-selected 群体中 inequity aversion 系统性低于一般人群→空格在
      唯一候选人群中不可测,但不改变非 self-selected 人群中的方向性预测"。同时标注
      此推论的实战检验更依赖预测(b)统计关联与(c)情境切换,而非空格(iii)单独。
    - |
      [should] statement 诚实标注增量收敛。经 discriminant_validity 的诚实自评和
      round_1/2 审查,推论的实际增量结构为:归因层推进(认知分类→激励结构)与
      BR-L2-017 的经验可区分性有限;连续 moderation 当前纯为理论推导、经验 base
      为零;空格是唯一可独立检验的增量经验风险。建议在 statement 末段或显著位置加
      一句诚实注记:"推论的核心可独立检验增量为空格预测(预测iii);归因层推进与连续
      精化当前为辅证角色、完整经验验证待补"——使读者不被开篇宏大叙述误导为三者
      均有同等经验支撑。
    - |
      [should] 增列"退出成本/地理强制"为排除钩子的显式子款。当高贡献者因地理隔离/
      无替代群体而无法退出时,群体可能因"被困住"而意外平等存续(不满但被迫留)。
      当前"外部强制"排除钩子默认指向制度性强制(法律/税收/教规),未覆盖纯结构性
      退出障碍(地理/经济)。建议在 excluded_outcomes 中增一条或扩展钩子(a):
      "地理/经济退出障碍(孤岛/唯一生存资源依附)视为弱外部强制→空格射程外"。
      同时在反例审查流程中明确:遇疑似反例应先查退出成本,防止将"困住所以没塌"
      误判为"平等可持续"。

  advisory:
    - |
      [advisory] 反例审查流程建议。在 falsifiability 段末尾可增一个检查顺序:
      "遇疑似空格反例时的审查顺序:(1)查外部强制(制度+地理/经济退出障碍);
      (2)查贡献可区分性;(3)查时程(代际周转/分配周期累积);(4)查亲缘度(含拟制
      亲缘在场);(5)查分配标准分类(labor credit 型等混合态的归类裁决)。按序检查,
      不跳步。"此流程化可进一步防 DED-004 式事后开脱——确保每个候选反例都经同一套
      判据,而非按"是否构成反例"选判据。
    - |
      [advisory] 连续 moderation 可考虑降级为"方向性 moderation"直到定量数据出现。
      当前 evidence 只支持"高亲缘→平等/需要权重更高;低亲缘→贡献权重更高"的方向性,
      不支持"r 与分配标准权重连续协变"的函数形式。将 claim 从"连续位移"调整为
      "单调方向性位移"会降低声称精度但提升诚实度——且不改变任何一条预测或空格。
      此调整可选非必须;若保留"连续"声称,则 empirical_limitations 的诚实标注应保留。
