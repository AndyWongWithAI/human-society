      2×3 表外。本轮 counterexample_hunt 提供了此 gap 的实证证据:YouTube 2017 广告主
      抵制中,"算法目标函数改革"(从纯 watch time 到 watch time+安全)作为第三条修复路径
      不在 engagement-vs-verifiability 二分中。修复选项(二选一):(A)将 2×3 表扩展为
      2×4 或更完整的分类框架,增加"算法+目标改革"或"算法+其他治理设计"列;(B)在
      discriminant_validity 中论证"算法目标改革"可被化约为engagement-vs-verifiability
