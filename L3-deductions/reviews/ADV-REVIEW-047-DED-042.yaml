      门槛但分析仍对机制有启示"。
    - |
      【should — P2P 透明度编码需第三方验证】在 operationalization 的 limitations 中
      追加:"透明度指数的编码不得仅依赖平台公开声明。对于声称有银行存管的平台,需确认
      存管是否在监管机构备案;对于声称经独立审计的平台,需确认审计报告是否公开可查
