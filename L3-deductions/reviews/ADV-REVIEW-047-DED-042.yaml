      论证。这些内容在 statement 中有明确申明,round_1 审查档中有引用,应存在于原完整
      文件中。
      (b)添加 review_summary 字段:将 round_1+round_2 的紧凑摘要(每轮 1-2 行)写入
      review_summary,遵循 CLAUDE.md 的"推论文件里只留 review_summary 3 行+指针"约定。
      (c)补全 meta/created/updated 等簿记字段(若原文件有此体例)。
      文件不完整→任何实质性终裁无法进行→必须修复后方可达 verified。
    - |
