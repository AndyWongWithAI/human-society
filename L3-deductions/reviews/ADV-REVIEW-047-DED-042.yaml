      中注册此化约的检验方法。选项(B)更经济且不改变推论核心框架,推荐。
    - |
      【should — 入选门槛的垄断平台排除效应+Facebook-CA 案例的状态矛盾】当前文件的
      supporting_counterexample(Facebook-CA)可能不满足推论自己的入选门槛(DAU 未跌
      ≥15%)。修复:要么为垄断/高锁定平台注册替代信任指标(如独立调查信任指数 Pew/
