    falsifiability 的三条证伪条件 (a)(b)(c) 均给出可操作的判定标准——满足
    四条件的危机+金价底部≤基线（按注册阈值 ≤1.05）+金 vs CHF/JPY 无系统性
    分叉+WGC 非货币持有无净累积。anti-talisman (1) 制度性禁止由金价反推危机
    存在，(2) 制度性禁止由价格阶梯反推非货币锁定。r3 的阈值注册使证伪条件
