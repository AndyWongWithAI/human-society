  counterexample_hunt: |
    【四路新猎 + 旧猎验证，均未获 scope 内净杀反例；一路揭出规则自我矛盾；
    falsifiability 通道畅通】

    === 猎路 1：2008 JPY 锚点的阈值自我矛盾——攻击"分叉"声称的实证基础 ===

    【靶心】按推论 r3 注册的规则——CHF/JPY 均值回归上限 ≤1.05，边界不可判
    [1.03, 1.07]——2008 锚点中 JPY bottom/baseline = 125/118 = 1.0593。
    此值不满足 ≤1.05 判据且落在 [1.03, 1.07] 边界区内→按注册规则应标记为
    "边界不可判"。但推论文件标记为"均值回归成立"。

    若严格按自注册规则归类：
    - 2008：金 1.51（干净阶梯）vs JPY 1.06（边界不可判）
    - 2020：金 1.17（阶梯）vs CHF 1.02（干净均值回归）
    → 金 vs 非金避险资产的"分叉"在 2008 锚点中不如文件宣称的那样黑白分明——
    金侧干净但 JPY 侧模糊。prediction (ii) 的经验支持从"两个锚点均清楚分叉"
    降级为"2020 锚点清楚分叉 + 2008 锚点金侧清楚但 JPY 侧边界模糊"。

    【判定】这不是 scope 内净杀反例——金 1.51 > 1.05 仍然是阶梯，JPY 1.06
    边界不可判不等于金和 JPY 无分叉（方向没错，只是 JPY 侧不够干净）。
    但这是规则自我矛盾——作者注册了一套规则，却在应用时违反了自己的规则。
    → 不是反例净杀，是规则遵循问题（本轮 required）。

    【消化】此矛盾暴露了 r3 阈值注册修复的不完整——注册了规则但没有逐锚重检
    证据归类是否符合新规则。修复建议：逐锚重检所有 bottom/baseline 比的计算
    和归类，确保与注册规则一致。→ 见本轮 required。

    === 猎路 2：1971 Bretton Woods 与现代判据的双重标准——攻击证据标准的对称性 ===

    【靶心】1971 锚点被推论纳为"最极端的阶梯案例"（8.11×底部抬高），但不满足
    推论自注册的四项危机判据中的任何一项：(a) 无 CDS 市场、(b) VIX 不存在、
    (c) 政策响应方向与注册规则相反（单边脱钩非多央行协同降息/QE）、(d) 无现代
    意义上的系统重要性金融机构倒闭。基线 $35 是人为官价（非市场价），峰值
    ~$850 距危机事件~101 月（远超 36 月注册归因窗口）。

    同时，可能不利于推论的现代边界案例面临严格四条件门槛：
    - 2013 Taper Tantrum：金价暴跌 -19.7%，因 CDS 未飙升+VIX 仅 ~20 被排除。
    - 2010-2012 欧债危机：金价从 $1225 跌至 $1050（底部<基线），因美国 CDS
      未飙升被排除。
    - 2023 银行业危机：金价底部仅高于基线 0.6%，因 VIX~30 未达 35-40 被排除。

    不对称：最有利于推论的锚点（8.11×）使用最宽松的"历史定性"判据，可能不利于
    推论的边界案例使用最严格的"四条件量化"门槛。

    【判定】不是净杀反例——不对称源于数据可得性的时间约束（CDS/VIX 在 1971 年
    不存在）而非设计性选择偏差。1971 案例中金价确实从未回到 $35（即使用其他
    判据也无法否认），方向是对的。但证据标准的双重性（历史定性 vs 现代量化）
    应收窄 confidence 声明——"最强锚点"在方法论纯度上恰恰是最弱的。

    【结论：未净杀。暴露了证据标准的历史不对称（本轮 should）。】

    === 猎路 3：六参数交互下的峰值选择敏感性——攻击分析可复现性 ===

    【靶心】r3 修复引入了六项交互操作化参数。在 2008 案例中测试峰值选择敏感性：
    - 情景 A（取最早合格峰值）：2009-12 金价月均 ~$1150（距危机事件 15 月）。
      底部搜索窗口：2009-12 至 2014-12。此期间内金价最低月均约在 2013 年中
      （缩减恐慌后~$1180-1200）或 2014 年底 ~$1150-1200。底部/基线 ≈ 1180/695
      = 1.70 → 阶梯成立。
    - 情景 B（取最晚合格峰值）：2011-09 金价月均 ~$1770（距危机事件 36 月）。
      底部搜索窗口：2011-09 至 2016-09。最低月均 $1049（2015-12）。底部/基线
      = 1.51 → 阶梯成立。
    → 核心预测（底部>基线）对峰值选择稳健——两种情景均为干净阶梯（均远超
    1.10 严格阈值）。但底部值不同（~$1180 vs $1049）→比率不同（1.70 vs 1.51）
    → "阶梯幅度"的量化声称对峰值选择敏感。

    【判定】不是反例——两种情景均支持阶梯预测。但峰值选择的敏感性分析应作为
    稳健性检验纳入推论文件（本轮 should）。

    === 猎路 4：构造理想反例——falsifiability 通道压力测试 ===

    与前三轮猎路一致：构造满足四条件（美国 CDS ≥3σ / VIX >40 / 多央行协同
    响应 / G-SIB 濒临倒闭）的未来危机，其中金价从基线急涨至峰值后，在 60 月
    窗口内跌破基线（bottom/baseline < 1.0 或按新规则 ≤1.05）→推论被净证伪。
    r3 注册的阈值和窗口使此反例的操作化识别更精确（不需争辩 1.005 vs 1.50
    是否均为"阶梯"——注册规则已给出明确切割线）。

    【结论：falsifiability 通道畅通。r3 的阈值注册实际上强化了反例的可识别性——
    注册了 1.05 切割线后，0.98 和 1.50 的判定不再模糊。】

    === 综合猎捕结论 ===

    四路猎杀均未获 scope 内净杀反例：
    - 猎路 1（JPY 阈值矛盾）：非反例，是规则遵循缺陷→本轮 required。
    - 猎路 2（1971 双重标准）：非反例，是证据标准的历史不对称→本轮 should。
    - 猎路 3（峰值敏感性）：非反例，两种情景均支持预测→稳健性检验建议（should）。
    - 猎路 4（理想反例）：falsifiability 通道畅通。

    推论的逻辑证伪结构仍然健全——没有发现"无论发生什么都可解释为支持推论"的
    免疫机制。r3 的修复使证伪条件更锐利（从 >1.0 升级为 ≥1.05 的注册阈值），
    实际上提升了推论的可证伪性。

  non_recurrence_of_ded004_007: |
