    DED-007（测量轴焊死）：【未复发】
    IV 测量链（CDS/VIX/政策/机构倒闭）与 DV 测量链（LBMA 金价）在概念层和
    操作层均分离。r3 注册的 36 月峰值归因窗口按日历时间定义（非由金价走势
    定义），"无可用峰值"规则明确区分"预测不适用"（窗口内无显著金价上涨）
    与"预测被证伪"（窗口内有金价上涨但底部≤基线）。注册的"≤36 月"选择
    在 2008 案例边界上具有恰好权重，但这是参数选择问题而非焊死——不同于
    DED-007 的致命结构（分母用"实际获授者"→IV 定义依赖 DV）。
    JPY 1.06 的分类矛盾是规则应用错误而非测量轴焊死。→ 未复发。

