round_4:
  reviewer: "独立对抗审查者 (round 4, 全新独立上下文, 与前三轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    本轮核心发现：round_3 的修复（阈值注册+危机窗口+CDS口径+文件恢复）方向正确、
    消除了前三轮的 4 条 required 缺陷。但阈值注册引入了一个可精确指认的自我矛盾——
    2008 锚点中 JPY 的 bottom/baseline=1.06 落在自注册的边界不可判区间 [1.03, 1.07]
    内，推论文件却将其标记为"均值回归成立"——这违反了推论自己定下的分类规则。
    该矛盾不是措辞疏忽——它直接削弱了金 vs JPY"分叉"声称在 2008 锚点中的证据力
    （金 1.51 是干净阶梯、JPY 1.06 是边界不可判→分叉不如推论文件宣称的那样干净）。
    此外，1971 锚点的危机判据与现代判据采用双重标准（现代案例须 CDS/VIX/政策/机构
    四条件，1971 锚全不满足却被纳为最强支撑证据），构成证据标准的不对称。
    六项操作化参数的交互（36月窗口/60月底部/6月排除/无峰值标记/联合事件/边界区间）
    使分析流程复杂度上升，但核心预测（危机后底部>危机前水平）对参数选择稳健。
    反例猎捕未获 scope 内净杀——推论的逻辑证伪通道仍然畅通。4 条 should 仍未消解。

    === round_3 的 required fixes 消解状态 ===

    逐条对照（基于 review_summary 中 r3 摘要 + 当前推论文件全文）：

    (1) 文件恢复（r2 required #1）：已消解。2020 COVID 锚点证据/独立结构证据/
        置信度完整、1971 Bretton Woods 锚点恢复（含诚实局限性标注）、三条
        counterexamples（Taper Tantrum/欧债危机/2023 银行业危机）已补全。
        review_summary 字段已补齐 r1-r3 摘要。→ ✓

    (2) 最小效应量阈值（r1 required #1）：已消解。金价"阶梯"阈值 ≥1.05 注册，
        配合敏感性检验 1.03/1.10；CHF/JPY"均值回归"上限 ≤1.05 注册；边界不可判
        区间 [1.03, 1.07] 注册；声明"一次性注册定死，反例出现后不得调整"。
        → 口径层面 ✓，但应用层面发现新矛盾（见下 required #1）。

    (3) 危机期间窗口（r1 required #2）：已消解。峰值归因窗口 ≤36 个月注册；
        "无可用峰值"标记规则注册；联合事件检验规则注册；6 个月排除区间已澄清
        以"危机事件日起算"。→ ✓

    (4) CDS 主权参考范围（r2 required #4）：已消解。主判据=美国 5 年期 CDS +
        非美 G7 辅助标记 + 36 个月基线窗口。→ ✓

    综合：4 条 required 在口径注册层面全部消解。推论的操作化从"过软/欠定"升级为
    "可复现"。方向正确。

    === 本轮新发现的 required 缺陷 ===

    [required] 阈值自我矛盾——JPY 2008 锚点的 bottom/baseline 被错误分类。
    推论 在 operationalization 中注册了 CHF/JPY"均值回归"上限 ≤1.05 和边界不可判
    区间 [1.03, 1.07]——两规则联合意味着：任何 CHF/JPY 的 bottom/baseline 落在
    (1.05, 1.07] → 不满足均值回归判据（>1.05）且落在边界区内 → 应标记为
    "边界不可判"。

    2008 锚点中 JPY/USD 的数据：危机前基线 ~118（2007 全年均价），危机后底部 ~125
    （2015-06）。底部/基线 = 125/118 = 1.0593 ≈ 1.06。此值：
    - 不满足 ≤1.05 的均值回归判据（1.06 > 1.05）
    - 落在 [1.03, 1.07] 边界不可判区间内
    → 按推论自注册规则，应标记为"边界不可判"。

    但推论文件在当前版本中将此案例标记为"均值回归成立"（并附描述"日元几乎完全
    回到危机前水平，贬值 6% 在汇率正常波动范围内"）。"贬值 6% 在正常波动范围"是
    一个实质辩护——但它恰好是注册规则试图排除的判断方式（用"正常波动范围"替代
    预注册阈值）。若 6% 可算"正常波动"，为何阈值不直接设 1.06？为何边界区间设在
    [1.03, 1.07] 而非 [1.03, 1.05]？规则的选择与证据的归类必须一致——否则规则
    形同虚设。

    后果：
    (a) 2008 锚点的金 vs JPY"分叉"声称被削弱——金 1.51 是干净阶梯（远超 1.10
        严格阈值），但 JPY 1.06 是边界不可判（不是干净的均值回归）。分叉仍然存在
        （金≠JPY 的方向没错），但不如推论文件宣称的那样黑白分明。
    (b) 这使 prediction (ii)（"CHF/JPY 在同类危机后呈均值回归形态"）的证据基础
        从"JPY 和 CHF 均明确均值回归"降级为"2020 CHF 明确均值回归（1.02），
        2008 JPY 边界不可判（1.06）"——经验支持有所弱化。

    修复方向：将 2008 锚点中 JPY 的归类从"均值回归成立"改为"边界不可判"，
    并相应调整"金 vs JPY 分叉"的文字描述（从"分叉明确"改为承认 JPY 侧存在边界
    模糊但金侧干净）；或——若作者坚持 1.06 应归类为均值回归——将均值回归上限
    阈值从 ≤1.05 上调至 ≤1.07（使规则与判断一致，而非规则一套判断另一套）。
    按 L4-009 反向裁决精神：阈值在见数据前已注册为 1.05→应遵守注册规则→JPY
    须标记为边界不可判。

    === 本轮新发现的 should 级问题 ===

    [should] 1971 Bretton Woods 锚点与现代危机判据的双重标准。
    推论文件对现代危机的纳入/排除使用预注册四条件（CDS ≥3σ / VIX >35-40 /
    全球政策响应 / 金融机构倒闭），但 1971 Bretton Woods 案例四项均不满足
    （CDS 市场不存在、VIX 不存在、政策响应方向与注册形式不同=美元与黄金脱钩
    是单边行动非多央行协同、无现代意义上的系统重要性金融机构倒闭），却被纳为
    三个支撑锚点之一（且是底部抬高倍数最大的锚点——8.11×）。

    作者诚实标注了局限性（confidence: moderate、无 CDS 数据、基线被人为压制、
    CHF/JPY 对照不干净），但未标注更深层的结构不对称：最有利于推论的证据享受
    宽松的历史定性判据，而可能不利于推论的边界案例（2013 Taper Tantrum、
    2010-2012 欧债危机、2023 银行业危机）面临严格的四条件量化门槛。
    这使支持证据池天然大于反证机会池——不是设计使然（推论的 anti-talisman 框架
    是诚实的），而是现代金融工具的时间覆盖不对称（CDS/VIX 仅覆盖 1990 年代至今）
    造成的结构性问题。建议在 limitations 中诚实标注此不对称，并将其对推论经验
    基础的净影响（支持池被历史案例扩充、但扩充标准不同）透明化。

    [should] 六项操作化参数的交互复杂度。
    round_3 修复引入了多项操作化参数：36 月峰值归因窗口、60 月底部搜索窗口、
    6 月波动低点排除、无可用峰值标记规则、间隔<36 月联合事件规则、[1.03,1.07]
    边界不可判区间。这些参数各自合理，但联合应用时的交互效应未做敏感性分析。
    例如：2008 锚点中，若峰值取较早时点（如 2009-12 ~$1150 而非 2011-09 ~$1770），
    底部搜索窗口会前移（2009-12 + 60 月 = 2014-12），得到的底部值可能不同。
    虽然核心预测（底部>基线）在 2008 案例中对峰值选择稳健（$1049/$695=1.51 无论
    用哪个峰值搜索底部），但 2020 案例的 60 月窗口尚未关闭→峰值选择对最终底部
    的影响尚未可知。建议对 2008 锚点做峰值选择的敏感性分析（报告最早合格峰值
    和最晚合格峰值两种情景下的底部/基线比），作为参数交互稳健性的验证。

