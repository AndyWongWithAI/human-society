  should_findings:
    - |
      [should, 本轮新发现] 在 limitations 中诚实标注 1971 Bretton Woods 锚点
      与现代危机判据框架的根本不兼容。1971 锚不满足推论自注册的四项危机判据中
      的任何一项（无 CDS/VIX 市场、政策响应方向与注册规则相反、基线为人为主导
      官价、峰值距危机事件 ~101 月远超 36 月归因窗口），却被纳为三个支撑锚点中
      底部抬高幅度最大的案例（8.11×）。这不使 1971 的证据价值归零——金确实从未
      回到 $35——但应标注：(a) 该锚采用了与现代案例不同的危机定义和测量方法；
      (b) 其证据权重应为三个锚点中最低（已在 confidence: moderate 中部分体现）；
      (c) 证据标准的历史不对称（现代案例面临严格量化门槛，历史案例使用定性判断）
      使支持证据池天然大于反证机会池——这是数据可得性的约束，非设计偏差，
      但对推论的净证伪风险有不对称影响（边界反例更可能被现代量化门槛排除，
      而支持案例可借历史定性判据扩充）。

