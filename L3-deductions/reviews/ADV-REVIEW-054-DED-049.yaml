  counterexample_hunt: |
    【三路新猎，均未获 scope 内净杀反例；两路暴露结构性问题；falsifiability
    通道畅通】

    === 猎路 A：1979-1980 年通胀/地缘危机（round_1 未覆盖的角度）===

    【靶心】1979 年金价基线 ~$306/oz（LBMA 年均）。1979-1980 年序列冲击：
    伊朗革命（1979-01）→石油危机 II→苏联入侵阿富汗（1979-12）→美国 CPI
    达 13.3%（1979）→Volcker 于 1979-10 宣布货币政策操作程序改革。
    1980 年 1 月 21 日金价日内峰值 $850/oz（LBMA PM Fix 月均 ~$675）。
    随后 Volcker 加息至联邦基金利率 ~20%（1980-04）→金价暴跌。
    危机后底部：1985 年 2 月月均 ~$284/oz。
    底部/基线 = 284/306 = 0.928 < 1.0 → 金价【跌破】危机前基线！

    【判定】按预注册四条件：(a) 无 CDS 市场（CDS 在 1980 年代后期才问世）→
    不满足。(b) VIX 不存在（1993 年推出）→不满足。(c) 全球政策响应——
    仅有美联储单边激进加息，方向与作者的"全球协同降息/注资/QE"正相反→
    不满足。(d) 无主要金融机构倒闭→不满足。
    → 未通过预注册检录门。不构成检验事件。

    【消化】此案例暴露了危机判据的时间不对称——针对 2008/2020 型"宽松响应"
    校准的四条件系统性排除了"紧缩响应型"危机（1980 Volcker 加息重建央行
    可信度、1997 亚洲金融危机 IMF 紧缩条件等）。这不使推论不可证伪（未来
    仍可出现满足四条件的宽松响应型危机且金价均值回归），但使推论的经验
    射程比其表面声称的"制度信任危机"更窄→实际射程 ="宽松响应型制度信任
    危机"。宽松流动性环境本身对金价有独立推升效应→可能混淆非货币锁定机制
    的信号。
    → should：标注此结构性偏向。

    【结论：未净杀。暴露了危机判据的"宽松响应型"偏向（should）。】

    === 猎路 B：2010-2012 欧债危机——攻击 CDS 口径歧义（新角度）===

    【靶心】欧债危机中希腊 CDS 利差从 ~50bp 飙升至 >5000bp（远超 3σ）。
    VIX 在 2011 年 8-10 月间峰值 ~48（>35-40）。ECB LTRO+OMT+IMF+EU
    三方协作。若判定为合格危机：金价 2010 基线 ~$1225/oz → 2015-12 底部
    ~$1050/oz。底部/基线 = 0.857 < 1.0 → 净杀反例。

    【判定】CDS 口径歧义是关键——操作化写"主权 CDS 利差飙升"但未指定参考
    主权。不同解读导致不同结论：
    - 取"任何主要主权 CDS"：希腊 CDS 满足，欧债危机可能入池→遇反例。
    - 取"美国 CDS"：美国 CDS 利差温和扩张但反映的是传染而非偿付危机，
      判定为不满足→欧债危机被排除。
    → 此歧义在反例出现后才定死为有利于推论的解读（取"美国 CDS"以排除
    欧债危机），将触发 L4-009 判例的反向裁决规则。

    【结论：未净杀——当前判据下欧债危机为边界案例。但 CDS 主权范围的未注册
    歧义构成一条新的 required 口径注册缺陷。】

    === 猎路 C：falsifiability 通道测试 ===
    与 round_1 猎路 4 一致——构造满足四条件的理想反例，确认当前预注册
    口径足以支持反例的明确识别。文件截断不影响此测试（falsifiability 段
    完整）。

    【结论：falsifiability 通道畅通——推论在逻辑上可被干净反例证伪。】

    === 综合猎捕结论 ===
    三条猎路均未获 scope 内净杀反例（在文件截断约束下）。但：
    - 猎路 A → CDS/VIX 的现代金融工具依赖导致 1980 年前危机全被排除、
      "紧缩响应型"危机被结构性排除（should）。
    - 猎路 B → CDS 主权范围的未注册歧义（required：新发现的口径注册缺陷）。
    - 缺失的 counterexamples 段使"作者自列的反例是否充分"无法核验。

