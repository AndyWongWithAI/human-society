    === round_1 required fixes 的消解状态 ===
    两条均【未消解】——当前截断文件中的 operationalization 节与 round_1 审查时
    完全相同：
    (1) 最小效应量阈值：仍未注册。bottom/baseline > 1.0 即为"阶梯"的判据
        无变化——1.005 和 1.50 在认识论上仍被同等对待。
    (2) 危机期间窗口定义：仍未注册。2008-09（危机事件）到 2011-09（金价峰值）
        的 3 年间隔的归因问题仍未解决。

    此外，round_1 的 5 条 should_findings 也无一在文件中体现。

    === 独立反例猎捕（在文件截断约束下尽可能执行）===

    猎路 A：1979-1980 年通胀/地缘危机——攻击"阶梯单调性"预测
    【靶心】1979 年基线金价 ~$306/oz（LBMA 年均）。1979-1980 年间：伊朗革命+
    石油危机+苏联入侵阿富汗+美国双位数通胀+Volcker 上任初期政策方向不明。
    1980 年 1 月金价峰值 ~$850/oz（日内 ~$850，月均 ~$675）。
    危机后底部：1985 年 2 月 ~$284/oz（月均）。
    底部/基线 = 284/306 = 0.928 < 1.0 —— 金价【跌破】危机前基线。
    【判定】若 1979-1980 被标记为"制度信任危机"，这是净杀反例——金价不仅
    未形成阶梯，反而跌破危机前水平。但按预注册四条件核查：(a) 无 CDS 市场
    （CDS 1980 年代后才出现）；(b) VIX 不存在（1993 年才推出）；(c) 全球
    政策响应——仅美联储单边加息（Volcker），非"多央行协同降息/注资/QE"
    （方向相反，是紧缩而非宽松）；(d) 无主要金融机构倒闭。
    → 四条件中仅 (c) 在方向上有争议（美联储激进加息本身是对通胀/制度可信度
    危机的回应，但操作上不属于作者定义的"全球性降息/注资/QE"），远不满足
    门槛。不构成检验事件。
    【消化分析】此案例暴露了危机判据的时间不对称——针对"宽松响应型危机"
    （2008、2020）校准的判据无法捕获"紧缩响应型危机"（1980 Volcker、
    1997 亚洲金融危机时期的 IMF 紧缩条件）。作者的操作化定义（(c) 须为
    "多央行协同降息/注资/QE"）隐含地将危机空间限定为"政策宽松响应型"——
    紧缩响应型制度的信任危机（央行通过加息重建可信度）被结构性排除。
    这不使推论不可证伪（未来仍可能出现满足四条件的宽松响应型危机且金价
    均值回归），但使推论的经验射程比其表面声称的"制度信任危机"更窄——
    实际射程 ="宽松响应型制度信任危机"。
    → should：在 limitations 中诚实标注危机判据对"宽松响应型"危机的结构性
    偏向，并讨论该偏向是否系统性地有利于阶梯预测（宽松→流动性泛滥→多类
    资产同涨，金的阶梯可能部分归因于流动性效应而非非货币锁定）。
    【结论：未净杀——不满足预注册判据。但暴露了危机判据的"宽松响应型"偏向。】

    猎路 B：2010-2012 欧债危机——攻击危机判据的 CDS 口径歧义
    【靶心】欧债危机期间希腊 CDS 利差从 ~50bp（2008 前）飙升至 >5000bp
    （2012 年希腊 PSI 前夕），远超 3σ。VIX 在 2011 年 8-10 月间峰值 ~48
    （>35-40）。ECB 的 LTRO+OMT 可争议地构成"全球性政策响应"（虽以欧洲
    为中心，但涉及 IMF+EU+ECB 三方协作）。若将欧债危机判定为合格危机：
    金价 2010 年基线 ~$1225/oz，2011 年峰值 ~$1770-1900，2015 年 12 月底部
    ~$1050/oz。底部/基线 = 1050/1225 = 0.857 < 1.0 —— 净杀反例。
    【判定】按预注册判据：(a) CDS 飙升——谁的 CDS？操作化未指定主权范围。
    若取希腊/意大利/西班牙 CDS→满足；若取美国 CDS→不满足。(b) VIX>35-40
    → 2011 年 8-10 月满足。(c) 全球政策响应→ECB+IMF+EU 三方协作，
    但 Fed/BOJ/PBOC 未参与→"全球性"存疑。(d) 金融机构濒临倒闭→Dexia
    （2011 年 10 月被救助），但规模不及雷曼级。
    → 边界案例。CDS 主权范围的未注册歧义使此危机的归类在出现反例后可按
    不同解读得出不同结论——若取"美国 CDS"→排除欧债危机（推论安全）；
    若取"任何主权 CDS"→纳入欧债危机且遇反例。按 L4-009 判例，凡在反例
    出现后才定死的口径解释、且定死方向恰好救推论→一律按不利于推论方向裁。
    【结论：未净杀——按当前判据为边界案例。但 CDS 主权范围的未注册歧义
    构成一条新的 required 口径注册缺陷。】

    猎路 C：构造反例——"黄金均值回归"场景的可操作性
    与 round_1 猎路 4 相同的 falsifiability 通道测试，确认推论在逻辑上可被
    证伪。此测试不受文件截断影响（falsifiability 段在截断前完整）。
    【结论：falsifiability 通道畅通。】

