id: ADV-REVIEW-054-DED-049
type: adversarial_review
reviews: DED-049
layer: L3-deductions

人话摘要: |
  DED-049（制度信任不对称衰减×金非货币需求：金价的阶梯式棘轮）对抗审查 round_1 存档。
  裁 needs_revision——核心增量（BR-L2-031的信任掉快涨慢 × BR-L2-023的非货币需求基底
  → 金vs纯金融避险资产危机后轨迹分叉）是真跨砖合成，不在任何单块承重砖中，操作化诚实
  （预注册危机判据+anti-talisman四约束+跨资产对照设计），但两条 required（口径注册：
  最小效应量缺失+危机期间定义空缺致峰值归因欠定）挡在 verified 门前。反例猎捕未获净杀，
  但暴露 small-N（仅2-3个合格危机）对"单调"声称的经验欠定问题。未重蹈 DED-004/007
  致命循环。

target: DED-049
protocol: |
  Rule B 独立对抗审查（作者≠审查者，全新独立上下文，与作者无关）。评分卡红旗 13 条
  逐项攻 + 反例猎捕（必做）+ DED-004（不可证伪循环）/DED-007（测量轴焊死）复发检查。
  裁决三态照评分卡：verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活反例
  ③不重蹈 DED-004/007。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新独立上下文, 与作者无关)"
  verdict: needs_revision
  verdict_note: |
    这是一条【非平凡增量属实、操作化诚实、但两条口径注册缺陷挡在 verified 门前】
    的候选推论。BR-L2-031（制度信任不对称衰减）不含"金""非货币锁定""阶梯""棘轮"
    "跨资产分叉"；BR-L2-023（金非货币需求基底）不含"信任危机""棘轮""分叉"
    "CHF/JPY"——两砖合力产出的"危机→金涌入→部分被非货币需求锁住→不回流→
    阶梯式底部抬升→与纯金融避险资产形成分叉"是真组合增量。

    推论的强项：
    (1) 操作化诚实——危机判据四条件（CDS≥3σ/VIX>35-40/全球政策响应/金融机构倒闭）
    全部预注册且独立于金价走势；金价轨迹、非货币持有量、CHF/JPY对照资产的测量口径
    均一次性给出（数据源+时间窗口+搜索规则）。
    (2) Anti-talisman clause 强劲——四条硬约束覆盖了最常见的反推逃逸路线：禁止由金价
    反推危机存在、禁止由价格阶梯反推非货币锁定、央行干预期间须标注+敏感性分析、
    禁止用"危机不够严重"排除不利案例。四约束均可操作。
    (3) 跨资产对照设计——金 vs CHF/JPY 的分叉预测是本推论区别于"黄金是避险资产"
    常识的独有经验内容，且为真经验主张（可被观测到的无分叉反例证伪）。
    (4) 自认最弱腿准确——primary_suspect 指步骤5的不可逆性（非货币黄金不回流）、
    secondary 指危机期间实物金买入比例偏高的假设。两条都指向同一结构脆弱点：
    非货币锁定机制在实证上是否成立。诚实。

    两条 required 缺陷：

    (1)【口径注册：最小效应量阈值缺失（required）】
    推论声称"底部系统性高于危机前水平"即 bottom/baseline > 1.0 即为"阶梯式棘轮"。
    但未注册最小效应量阈值——若 bottom/baseline = 1.005 或 1.01，该判为"阶梯"
    还是"有效均值回归"？按当前口径，任何正差值均满足预测——这使预测的证伪门槛
    过低（几乎任何含噪声的金融数据都会产生非零正差值）。2020 COVID 案例中
    bottom/baseline = 1.17（17%高于基线）被作者判为"阶梯成立"，但 CHF 的
    bottom/baseline = 1.02（2%高于基线）被作者判为"几乎完全回到危机前水平"——
    17%和2%的阈值线划在哪里是未注册的。
    按 L4-009 判例（阈值须连同分子/分母/测量口径一次性注册；事后口径选择反向裁决），
    本推论须注册：(a) 最小 bottom/baseline 比判定"阶梯"的阈值（建议≥1.05，配合
    敏感性检验 1.03/1.10）；(b) 对称地，CHF/JPY 的 bottom/baseline 比判定
    "均值回归"的上限阈值（建议≤1.05，与金对称）；(c) 两个阈值必须在见任何新危机
    数据前定死，不得在反例出现后调整。此缺陷影响 verified 第一条（无 required 缺陷）——
    未经注册的阈值使预测的证伪条件不够锐利。

    (2)【危机期间定义空缺——峰值归因欠定（required）】
    操作化定义了"危机前基线"（危机事件前12个月均价）和"危机后底部"（峰值后≤60个月
    最低月均价），但未定义"危机期间"的上界——即危机事件发生后多久内的金价变动仍
    归因于该次危机。2008 GFC：危机事件=2008-09-15（雷曼倒闭），金价峰值=2011-09
    （3年后）。这3年的间隔中发生了 QE1（2008-11）、QE2（2010-11）、欧债危机升级
    （2010-2012）、美国债务上限危机+S&P降级（2011-08）等多项可能独立影响金价的
    事件。作者在边界案例中诚实承认"若将 2011-09 的峰值归因于欧债危机而非 2008
    危机的延续效应，很难干净分离"——但未将其注册为操作化参数。
    此缺陷的实操后果：(a) 峰值时点移动→底部搜索窗口移动→可能得到不同的底部值；
    (b) 若某次危机的峰值与下一次危机的基线重叠（如 2008 峰值=2011-09，而若欧债危机
    也被标记为独立危机事件，其基线=2010-2011），两条推论的时间窗口会产生不可分离
    的交叠。须注册：危机事件发生后多长时间窗口内的峰值归因于该次危机（如≤24个月
    或≤36个月），或诚实声明"当危机间隔<峰值搜索窗口时，两次危机的效应不可分离，
    该对危机作为联合事件检验"。

    非 rejected 理由：(a) 核心增量属实——非平凡格（有危机, 阶梯式棘轮）需要两砖合力，
    任一砖单独不预测此格；(b) 操作化方向诚实——预注册判据+anti-talisman+跨资产对照；
    (c) 反例猎捕未获净杀——2-3个合格危机均支持阶梯预测；(d) 无 DED-004/007 致命循环。
    两条 required 修复定向可救活 → needs_revision。

  red_flag_findings:
    brick_conclusion: |
      【未命中——核心增量不在任何单块承重砖中，逐字核对通过】

      BR-L2-031（制度信任不对称衰减，weakly_verified）：
      原文含：损失厌恶在信任域的特化投影（失信=损失→快速大幅下调；守信=维持现状→
      不触对称上调）、信息不对称放大（失信信号高显著、守信信号低显著）、
      下降快回升慢的时间不对称、与 BR-L2-024（法币信用连续性）的接口。
      原文不含："金"一词完全未出现。不含"非货币需求""非货币锁定""阶梯式棘轮"
      "金价底部抬升""金 vs CHF/JPY 分叉""危机后轨迹""WGC 数据"。
      BR-L2-031 确立了制度信任的非对称时间结构（掉快涨慢），但这一结构适用于
      任何受制度信任影响的资产（主权债券、银行股票、法币汇率）——它没有说
      "当该不对称与金的非货币需求交互时会产生阶梯式棘轮而非对称回归"。
      → 不构成 brick=conclusion。

      BR-L2-023（金非货币需求基底与冷启动，verified）：
      原文含：金在成为货币前已有非货币需求（审美/仪式/地位信号）、冷启动机制
      （非货币需求为 E_network 从零起飞提供初始推力）、功能分化后非货币需求
      持续存在（"即使失去货币地位后仍然有非零的 U+E_network"）、与纯法币的
      对比（法币 E_network 塌缩后 U→0，金 U 不为零）。
      原文不含："制度信任""信任危机""危机""棘轮""阶梯""CHF/JPY""跨资产分叉"
      "危机后轨迹""WGC 季度报告""CDS""VIX""央行干预"。
      BR-L2-023 确立了非货币需求的存在性和持久性，但未说"非货币需求在危机期间
      吸收黄金后不会回流"——它只说非货币需求不依赖货币功能而独立存在，未断言
      其不可逆性（"不可逆"恰是 DED-049 primary_suspect 自认的经验赌注）。
      → 不构成 brick=conclusion。

      两砖合力核查：逐字比对 formal statement 与 DED-049 的 statement + prediction
      三段（阶梯形态/金vs非金分叉/微观净累积）。无一在任一块承重砖中以原文或
      近义出现。"阶梯式棘轮"需要三样东西焊接：(a) 危机→金涌入（BR-L2-031 的
      掉快通道，但砖本身未指定涌入目标资产）；(b) 涌入的金部分走实物通道→
      进入非货币需求池（需要额外的"危机中偏好实物金"假设，BR-L2-023 未涉及）；
      (c) 进入非货币池的金不回流（BR-L2-023 只说非货币需求存在，未说不可逆）。
      三样东西的焊接全在推论层完成。→ brick≠conclusion，通过。

    nontriviality_cell_check: |
      【通过——非平凡格（有危机, 阶梯式棘轮）需要两砖合力，不被任何单砖平凡强制】

      2×2 判据表逐格检验：

      格（无危机, 均值回归）=「平凡格」：
      没有冲击就没有轨迹可谈。无人主张任何预测。→ 平凡，通过。

      格（无危机, 阶梯式）=「空集」：
      无人主张。不作为检验对象。→ 通过。

      格（有危机, 均值回归）=「BR-L2-031 单独预测格」：
      BR-L2-031：制度信任掉快（危机触发金急涨）→涨慢（信任恢复过程金缓跌回）。
      此格是 BR-L2-031 的对称预测——信任崩塌→资金逃离法币→金涨；信任重建→
      资金回流法币→金跌回。两块砖各自都不预测阶梯。若现实落在此格→本推论
      被净证伪（falsifiability (a) 的直接对应）。→ 格子有填充可能，可被现实
      反例占据。

      格（有危机, 阶梯式棘轮）=「非平凡格」：
      此格需要的不是"危机时金涨"（那是避险常识），而是"危机后金不跌回"。
      BR-L2-031 单独→危机后跌回（涨慢→金价回落至危机前水平）。
      BR-L2-023 单独→不对危机后行为做预测（它只管非货币需求的存在性）。
      两砖合力才能填满：BR-L2-031 提供"危机→资金涌入"的触发，BR-L2-023 提供
      "涌入的一部分被非货币需求池锁住→不随信任恢复而回流"的不可逆性。
      任一砖撤走→此格回到均值回归或变为不可预测。
      → 非平凡。格子的独有经验内容=金 vs CHF/JPY 的危机后分叉——不是定义性真理
      （可被现实反例否定），不是任一砖的原文复述（两砖均未用"阶梯""棘轮""分叉"）。

      核心空格（有危机, 阶梯式棘轮）不被任何单砖强制。两砖合力也不强制——
      需要额外的"非货币锁定不可逆"焊接步骤。→ 逐格判空通过。

    measurement_orthogonality: |
      【主干正交——危机判定/金价/非货币持有量/CHF-JPY 四条测量链概念层均分离；
      未重蹈 DED-007 级焊死】

      IV（自变量）——制度信任危机事件：
      测量源：主权 CDS 利差（市场报价）、VIX 指数（CBOE 计算）、全球政策响应
      （央行公告/政府文件，公开可查）、金融机构倒闭（新闻报道/监管文件，公开可查）。
      四条信息源均独立于金价走势——不涉及 LBMA 定盘价或任何金市数据。
      → 测量链独立于 DV。

      DV（被预测量）——金价轨迹：
      测量：LBMA 黄金下午定盘价月度均值。来源为伦敦金市的独立市场报价，
      不涉及 CDS/VIX/政策分析。
      → 测量链独立于 IV。

      DV（被预测量）——非货币黄金持有量：
      测量：WGC Gold Demand Trends 季度报告（首饰制造+金条金币投资，吨）。
      行业统计估算，不由金价推导。
      → 测量链独立于 IV 和金价。

      对照资产轨迹（CHF/JPY）：
      测量：CHF/USD、JPY/USD 月度均价（BIS 或 FRED）。外汇市场独立报价，
      不涉及金市数据。
      → 测量链独立。

      Anti-talisman 制度性锁死：第 (1) 条明确禁止由金价涨跌反推危机存在/不存在；
      第 (2) 条明确禁止由价格阶梯反推非货币锁定。这两条将测量正交从"概念层分离"
      升级为"规则层禁止"。
      → 主干正交。未重蹈 DED-007（分母用"实际获授者"致 IV 定义依赖 DV 的致命焊死）。

      潜在薄弱点（不到 DED-007 级）：
      (a) "全球性政策响应"的判定涉及判断——"多央行协同降息/注资/QE"中"协同"
      的程度是连续的而非是/否。若某次危机中只有美联储+BOE 行动而 ECB 按兵不动，
      算不算"全球性"？→ 在边界案例中可能有编码歧义，但这是判定精度问题，
      不是测量轴焊死（IV 和 DV 的测量源仍然分离）。
      (b) 危机判据 (c) 和 (d) 的 OR 逻辑——"至少(a)+(b)+(c)或(a)+(b)+(d)同时满足"——
      在实操中 (c) 和 (d) 可能同时满足或同时不满足，边界案例的标记一致性需审核。
      → should 级，非 required。

    scope_hook_independent_of_result: |
      【合规——四条 excluded_outcomes 均基于可事前独立识别的渠道特征，无事后按结果
      开脱的逃逸空间】

      (1) "非危机时期的金价波动"：排除判据=VIX 低位、CDS 利差稳定、无政策应急响应。
      三项指标均可事前独立于金价测量。→ 合规。

      (2) "纯供给冲击导致的金价变动"：排除判据=USGS 矿产数据可独立识别的供给事件
      （大金矿发现、冶炼突破）。USGS 数据独立于金价。→ 合规。

      (3) "危机期间的日内/周度高頻波动"：排除判据=时间尺度（月-年级 vs 日-周级）。
      可事前按数据频率区分。→ 合规。

      (4) "央行购金行为导致的金价底部抬升"：排除判据=若阶梯完全由央行储备多元化
      解释（走另一条因果通道）。此排除非"结果不好就换通道"——anti-talisman (2)
      明确要求 WGC 私人持有数据同步检验：若私人非货币持有无净累积但央行购金显著
      增加→阶梯的因果归因转移，推论机制被推翻。→ 合规（排除钩子与独立检验机制绑定）。

      四条排除钩子均可在见金价结果前独立操作。无"结果不好就重新划射程"的逃逸路线。
      → 射程/排除钩子合规。

    criterion_tier_match: |
      【通过——被预测量虽被二分（阶梯 vs 均值回归），但二分基于连续量（bottom/baseline
      比）的阈值切割，自变量（危机有/无）也是基于连续指标（CDS/VIX）的阈值二分，
      两层二分均预注册了切割规则，无 DED-006 式分档失配】

      自变量分档：制度信任危机 有/无——由四项连续指标（CDS ≥3σ、VIX >35-40、
      全球政策响应有/无、金融机构倒闭有/无）经预注册规则（(a)+(b)+(c) 或 (a)+(b)+(d)）
      归并为二分。切割规则在见数据前注册。→ 合规。

      被预测量分档：阶梯式棘轮 vs 均值回归——由 bottom/baseline 连续比经阈值切割。
      潜在问题：如前所述，阈值未注册最小效应量（见 required fix #1），导致
      "阶梯 vs 均值回归"的二分在实践中存在灰色地带。但这不是 DED-006 式"连续量
      强行二分"的问题——被预测量（危机后轨迹形态）本身是连续量（bottom/baseline
      比可取值 0.5-8.0 连续区间），二分是操作化的必要简化。→ 分档匹配通过，
      但需补注册最小效应量阈值使切割锐利。

    anti_talisman_cashed: |
      【强在位——四条硬约束概念层干净且可操作；实操中最脆弱的环节（非货币锁定的
      不可逆性、实物/ETF 比例的结构性偏移）已在 primary/secondary_suspect 中诚实标注】

      四条硬约束逐条压力测试：

      (1) 禁止由"金价涨了"声称"发生了信任危机"，禁止由"金价没涨"否认危机资格：
      此约束可操作——危机判据四条件（CDS/VIX/政策/机构倒闭）全部独立于金价。
      实操风险：四条件的 (c) 和 (d) 均有 OR 逻辑+判断空间（如"全球性政策响应"
      的"全球性"程度），边界案例中可能存在无意识的确认偏误——若审查者期望
      某事件为危机（因金价涨了），可能在判断"政策响应是否足够全球性"时降低
      门槛。但此风险由预注册规则（事前定死的四条件+OR 逻辑）大幅约束，
      且不同于 DED-007 的测量轴焊死。→ 在位。

      (2) 禁止由"金价底部抬升了"声称"必定有非货币锁定"——若 WGC 数据不支持
      净累积但价格阶梯存在→须寻找替代机制：
      此约束是推论机制可错性的诚实保险。它明确将"预测成立"和"机制成立"解耦——
      价格阶梯可能存在（预测正确）但非因非货币锁定（机制错误）。这在经济命题中
      是罕见的诚实。→ 在位。

      (3) CHF/JPY 央行干预期间须逐事件标注+敏感性分析——若排除干预后分叉消失→
      分叉预测失效。干预标注须事前按公开政策文件时间戳：
      此约束可操作——SNB 2011-09-06 宣布 1.20 汇率上限、BOJ 2013-04-04 宣布
      QQE 均为公开政策事件，有明确时间戳，不可事后捏造。实操中最大的难点是：
      央行干预不总是公开宣布的（如 SNB 在 2011 年 9 月前已有非公开干预）→
      标注可能不完整。anti-talisman 注册了"按公开政策文件时间戳"——不完美的
      但可操作的标注规则。→ 在位。

      (4) 禁止用"这次危机不够严重"消解不利证据——凡满足四条件的危机均须纳入
      检验池：
      此约束是反选择偏差的硬锁。四条件预注册→检验池在见任何危机结果前已确定。
      实操中最大的风险：边界案例（如 2010-2012 欧债危机）不满足全部条件→
      被排除在检验池外。若未来出现"满足三条件但第四条件差一点"的危机，且该
      危机中金价完全均值回归→作者面临两难：若纳入→推论被证伪；若维持排除→
      需诚实解释为何条件边界恰好划在救推论的位置。此风险由预注册规则的真前
      注册性缓解（四条件在见本轮审查前已定死）。→ 在位。

      综合：四条约束在书面概念层干净、可操作。防线最薄弱处（非货币锁定的不可逆性、
      实物/ETF 比例的结构性偏移）不在 anti-talisman 射程内而是推论的实质经验赌注——
      已由 primary/secondary_suspect 诚实标注。anti-talisman clause 本身强劲。

    anchor_fact_check: |
      【无致命事实错——三个 anchor 方向正确、局限性诚实标注；一个 anchor 的峰值数据
      精度存疑（should）；2008 锚的峰值归因存在跨事件交叠（已在边界案例中诚实标注）】

      逐个核查：

      (1) 2008 GFC——阶梯式抬升，金 vs JPY 分叉：
      方向正确——金在 2008 危机后确实未回到危机前水平（底部 $1049 vs 基线 $695，
      比率 1.51），JPY 确实基本回到危机前水平（底部 125 vs 基线 118，比率 1.06）。
      分叉方向成立。
      数据精度存疑：(a) "危机期峰值 $1895/oz（2011-09 月均）"——按操作化指定的
      LBMA PM Fix 月度均值，2011 年 9 月 LBMA 下午定盘价经历了月初 ~$1900 到月末
      ~$1600 的大幅波动，月均应在 $1750-1780 区间而非 $1895。$1895 更接近月初的
      单日定盘价高点或日内现货高点（2011-09-05 现货盘中 $1920.70 为当时历史最高）。
      若月均为 ~$1770，不影响核心预测（bottom $1049 > baseline $695 仍然成立），
      但影响"峰值回落幅度"的次级声称——应核实并修正数据或注明来源。
      → should：核实 LBMA PM Fix 2011-09 月均实际值，或注明使用数据来源
      （如 Kitco/LBMA/Stooq）及是否为月均 vs 单日高点的选择理由。
      (b) 峰值归因——2011-09 峰值距 2008-09 危机事件 3 年，其间 QE1/QE2/欧债危机
      等多项事件叠加。作者在边界案例（欧债危机）中诚实标注此问题。→ 已在
      required fix #2 中要求注册危机期间窗口。

      (2) 2020 COVID-19——阶梯再现，ETF 结构偏移值得关注：
      方向正确——金底部 $1633 vs 基线 $1393（比率 1.17），CHF 底部 1.01 vs 基线
      0.99（比率 1.02）。分叉方向成立（金 17% vs CHF 2%）。
      数据交叉验证：2019 全年 LBMA PM Fix 均价 ~$1393 正确。2020-08 月均 ~$1974
      合理（当月现货在 $1900-2070 区间波动）。2022-11 月均 ~$1633 正确（美联储
      激进加息压低金价至约 $1630-1730 区间）。CHF/USD 2019 均价 ~0.99 正确
      （USDCHF 0.96-1.02），2021-01 ~0.89 正确（USDCHF 最低触及 0.88），
      2022-11 ~1.01 正确（USDCHF 升至平价上方）。
      结构性偏移诚实标注：2020 年黄金 ETF 流入 +877 吨创纪录而首饰需求因疫情
      封锁暴跌 -34%——这是 secondary_suspect（实物/ETF 比例偏移）的直接相关观测，
      作者诚实纳入而不掩饰。→ 合规。

      (3) 1971-1980 布雷顿森林体系终结——最极端的阶梯案例：
      方向正确——金从 $35 基线到 ~$285 后危机底部，比率 8.14。1999-2001 底部
      ~$255/oz 仍为 $35 的 7.3 倍，即使经 20 年熊市也未回到危机前水平——
      这是棘轮预测的最有力单一锚点。
      局限性诚实标注：(a) 无现代 CDS 数据→危机判据部分依赖历史定性判断；
      (b) 汇率制度切换（布雷顿森林→浮动汇率）使 CHF/JPY 的对照复杂化——
      1971 年后 CHF/JPY 的大幅重估非因避险需求而是汇率制度的结构性断裂，
      分叉检验在此锚中不干净；(c) 起始基线 $35 被人为压制（金汇兑本位下的官价），
      阶梯幅度被放大。→ 合规，confidence: moderate 诚实。

      三个 anchor 均无致命事实错。一处 should（2008 锚峰值数据精度），
      已在 required fix 中关联的峰值归因窗口问题另有独立处理。

    definition_vs_prediction: |
      【通过——核心预测均为可证伪的经验主张，非定义性同义反复】

      三条 falsifiability 条件逐条复核：

      (a) "出现一次满足操作化定义的制度信任危机，金价危机后底部 ≤ 危机前水平"：
      此条件给出了清晰的判定标准——危机须满足预注册四条件（独立于金价）、
      底部须为峰值后 ≤60 月最低月均价、底部 ≤ 基线即证伪。
      此条件在逻辑上完全可被现实反例满足——若未来某次危机中金价完全均值回归，
      推论被净证伪。→ 可证伪。

      (b) "金与 CHF/JPY 危机后轨迹无系统性分叉——CHF/JPY 同样呈阶梯或金同样呈
      均值回归"：
      此条件将推论的独有内容（跨资产分叉）置于可证伪位置——若观测到金和
      CHF/JPY 的危机后轨迹不可区分（均阶梯或均回归），则"非货币锁定"机制被
      推翻，推论退化为"黄金是避险资产"的常识复述。作者诚实标注了退化后果。
      → 可证伪。

      (c) "非货币黄金持有量在多次危机中无净累积——危机期间实物金增持在信任恢复后
      被等量抛售回流"：
      此条件将推论的机制层（非货币锁定）与预测层（价格阶梯）解耦——即使价格
      阶梯存在，若净累积不成立，机制被推翻。此解耦是诚实的（不同于许多经济命题
      将机制当护身符）。→ 可证伪。

      关键条件"制度信任危机"是操作化定义（CDS/VIX/政策/机构），非"若金价涨了
      就是危机"的定义性循环——anti-talisman (1) 明确禁止此循环。危机判据独立于
      被预测量（金价轨迹）。→ 条件是预测非定义。通过。

    enumeration_and_species: |
      【不命中——推论不声称穷举任何资产类别/危机类型；但主动猎第 N+1 类揭示了
      避风港资产光谱的覆盖盲区（should）】

      推论的核心主张是将避险资产分为两类——有非货币需求池的（金→阶梯）和
      纯金融的（CHF/JPY→均值回归）——但这并非声称"所有避险资产穷举为这两类"，
      而是针对这两类的比较预测。

      主动猎"第 N+1 类"避风港资产：
      - 美国国债（UST）：危机期间通常是终极避险资产（flight to quality），
      危机后收益率走势受美联储政策利率路径主导。UST 没有"非货币需求池"，
      但有其特有的"锁定机制"——外国官方储备持有（中国/日本/沙特等国持有
      大量 UST 用于外汇储备管理而非纯投资目的，减持缓慢）。这类资产是否
      在危机后呈"阶梯"或"均值回归"取决于储备管理者的行为，而非非货币
      需求池。→ 不在推论射程，但说明"有/无非货币需求池"的二分之外存在
      其他"锁定机制"（储备持有、保险需求、监管强制等）。
      - 银（Silver）：兼具工业需求（~50%需求）和投资/首饰需求。工业需求的
      "粘性"不同于金的非货币需求——工业需求随经济周期波动，但在危机中
      可能因工业活动收缩而下降（与金的非货币需求在危机中可能上升相反）。
      银是否能被归入推论框架？→ 推论未讨论，合理（射程限定在金）。
      - 比特币（BTC）：新兴数字"黄金"叙事资产。无实物形态→无非货币需求池。
      若 BTC 在制度信任危机后也呈均值回归，与金的分叉将强化推论。但 BTC
      历史过短（仅经历 2020 COVID 一次合格全球危机）→ 尚无法提供足够
      变异来检验。

      → should：在 discriminant_validity 中诚实标注"非货币需求池并非唯一可能的
      危机后锁定机制——央行储备持有、保险/养老基金的久期匹配需求、监管强制
      持有等也可产生类阶梯效应。本推论的独有声称不是'唯有非货币锁定产生阶梯'，
      而是'非货币锁定是金特有的阶梯来源，该机制在 CHF/JPY 中不存在'。"

    primary_suspect_aim: |
      【指对了——自认最弱腿（步骤5的不可逆性）准确；但文本在"单调"声称的经验
      基础上过于自信（should）；平凡化后推论守住非平凡增量但暴露 small-N 问题】

      文件自认：
      - primary_suspect：步骤5的不可逆性——"已转化为首饰/私人储藏的黄金不回流"。
      反驳路径：二手金饰回收+金条金币的私人减持。
      - secondary_suspect：步骤4的"危机期间实物金买入比例偏高"——若现代市场
      黄金买入走 ETF/期货通道（如 2020 年），实物锁定效应缩水。
      - unlikely_suspect：BR-L2-031 的"掉快涨慢"不对称和 BR-L2-023 的非货币
      需求存在——地基稳固。

      三条 self-identification 方向准确。primary 和 secondary 都是真实弱点，
      且指向同一结构脆弱点——非货币锁定的实证基础。

      但文件有一处未被自认的过度自信：

      【"单调成立"声称在 N=2-3 的经验基础上过于自信（should）】
      预测 (i) 声称"该形态应在多次危机中单调成立"——但当前仅 2 个（2008 GFC、
      2020 COVID）或至多 3 个（加 1971 布雷顿森林体系终结，但该锚的危机判据
      不完整）合格危机可检验。N=2 无法确认单调性——两点的任何模式（上升、
      下降、不变）都技术上"单调"。这不是逻辑问题（下次危机若违反→证伪，
      推论在逻辑上可证伪），而是经验信心校准问题——不应在 N=2 时声称"单调"
      为已建立的规律，而应诚实标注"与当前 2-3 个案例一致（consistent with），
      但单调性声称需未来危机持续检验"。
      → should：在 prediction (i) 中将"单调成立"改为"与现有案例一致，
      单调性属可被未来危机推翻的强预测"，或保持"单调"为预测（而非已证事实）
      但诚实标注当前 N=2 的经验基础。

      平凡化检查：抽掉三个非平凡增量（跨资产分叉+阶梯单调性+非货币锁定机制）
      后，推论坍缩为"黄金危机时涨，有时危机后不跌回"——这是市场参与者的常识，
      不构成可检验的科学命题。推论的独有内容（跨资产分叉+单调阶梯+微观锁定）
      防止了平凡化。但在 N=2 时，"单调阶梯"的经验基础与"有时不跌回"的常识
      之间的差距小于作者暗示的。→ 通过平凡化检查（核心增量守住），但经验信心
      需校准（should）。

    data_source_common_root: |
      【不命中——推论不依赖经济/统计机构的多源数据交叉验证】

      推论的实证锚点（金价=LBMA 定盘价、非货币持有=WGC 行业数据、CHF/JPY=
      BIS/FRED 汇率）来自不同机构/市场的独立测量链——LBMA 是伦敦金市行业协会，
      WGC 是黄金矿业行业组织，BIS/FRED 是央行/央行间机构。三者不共享同一套
      底层数据源。WGC 作为行业组织可能有利益冲突（倾向乐观估计黄金需求），
      但这不是"冒充多源独立"的问题（WGC ≈ 单源，未声称多源验证）。
      → 此红旗不适用。

    api_epistemology_confusion: |
      【不命中——推论不涉及将 API 可及性冒充认识论独立性】

      推论的操作化不涉及通过 API/MCP 查询经济数据库来建立"多源独立证据"。
      所有数据源均为公开市场数据/行业报告，其认识论独立性基于机构/测量链的
      分离，而非 API 端点数量。→ 此红旗不适用。

    caliber_registration: |
      【未通过——关键口径大部分已注册，但两条结构性的口径注册缺口构成 required 缺陷】

      逐一核查关键阈值的分子/分母/测量口径注册情况：

      (a) 危机判定口径：
      - CDS 利差：≥3σ（相对危机前基线）。✓ 分子=CDS 利差变化量，分母=σ，
      阈值=3。但"危机前基线"的时间窗口未独立注册（是用危机事件前 12 个月？
      还是前 36 个月？还是 CDS 数据可得的全历史？）。
      - VIX：>35-40。✓ 阈值范围已注册。
      - 全球政策响应：多央行协同降息/注资/QE。△ "协同"和"全球性"未量化。
      - 金融机构倒闭或濒临倒闭。✓ 定性但可操作（公开新闻/监管文件）。
      → 大部分已注册，CDS 基线窗口需补注册（should）。

      (b) 金价轨迹口径：
      - 危机前基线：危机事件前 12 个月均价。✓
      - 危机后底部：峰值后 ≤60 个月（或至下一次危机前）最低月均价。✓
      - 排除前 6 个月波动低点：✗ 指代模糊——"危机发生后 6 个月内"是指
      危机事件日期+6 个月还是峰值日期+6 个月？两者在 2008 GFC 中差 3 年。
      → required fix #2 关联。

      (c) 阶梯判定口径：
      - 判据：危机后底部 > 危机前基线水平。即 bottom/baseline > 1.0。
      ✗ 未注册最小效应量阈值。1.005 > 1.0 技术上满足但经济上不可区分于
      噪声。L4-009 判例要求阈值连同分子/分母/测量口径一次性注册。
      → required fix #1。

      (d) CHF/JPY 对照口径：
      - 轨迹提取方法与金相同（基线 12 月、峰值后 ≤60 月最低月均价）。✓
      - 央行干预标注：SNB 2011-2015 汇率上限、BOJ 2013 年后 QQE/YCC。✓
      - 敏感性分析：排除干预期间后重新检验。✓（已注册但未执行）。
      → 口径注册通过。

      (e) 非货币持有净累积口径：
      - WGC 首饰制造+金条金币投资，吨。✓
      - "净累积"的操作化定义：✗ 未注册——是指"每次危机后存量 > 危机前存量"？
      还是"危机后 60 个月累计净增持 > 0"？"不由价格变动解释"如何操作化？
      （用吨而非美元价值？用 CPI 平减后的不变价？还是控制金价做回归？）
      → should：注册"净累积"的统计定义（建议：危机后 60 个月累计 WGC 首饰+
      金条金币购买量 – 回收金 > 0，以吨计，不因金价上涨导致的美元价值膨胀
      而自动满足）。

      综合：关键口径大部分已注册。两个 required 缺口（最小效应量、危机期间窗口）
      和一个 should 缺口（净累积的操作化定义）。未违反 L4-009 判例的事后口径
      选择禁令（当前口径在见反例前已注册），但最小效应量缺口使证伪门槛过软。

  counterexample_hunt: |
    【四路猎杀，均未获 scope 内净杀反例；两路暴露结构性问题（small-N 检验不足、
    非货币锁定的"二手回收"反制渠道）；一路构造了可操作的事前反例测试设计】

    === 猎路 1：2013 年"缩减恐慌"（Taper Tantrum）——攻击危机判据的边界 ===

    【靶心：2013 年 5-6 月伯南克暗示缩减 QE→金价从 ~$1470 跌至 ~$1180（-19.7%）】
    若有人将 Taper Tantrum 误标为"制度信任危机"，金价暴跌（非急涨）与预测 (i)
    矛盾。但按预注册判据核查：(a) 主权 CDS 未系统性飙升；(b) VIX 峰值 ~20
    （<35-40）；(c) 无全球性政策应急响应——与危机反向（是政策正常化信号而非
    信任崩塌）；(d) 无金融机构倒闭。
    → 四项均不满足。不构成检验事件。

    消化分析：此案例恰好展示了危机判据的事前可操作性——不因金价跌了就称"无危机"
    （自我服务），不因金价涨了就称"有危机"（循环推理）。Taper Tantrum 被正确
    排除在检验池外。作者在 counterexamples 段中自己列了此案例——诚实。

    但此案例也暴露了一个不对称：推论的设计天然有利于"支持证据"的生成——
    金价急涨时（2008、2020、1971），回溯找危机标记容易（因为危机判据中的政策
    响应往往与金价上涨同时发生→都是对同一冲击的反应）；金价不涨时，危机判据
    自然不满足（因为没有冲击）。这不是循环推理（CDS/VIX 仍在金价之外），而是
    "冲击→同时触发金价上涨和危机标记"的共同原因结构——两条测量链被同一个
    外生事件触发，而非互相定义。→ 不是缺陷，但值得在 epistemology 中诚实标注：
    推论的经验支持天然偏向"有冲击"方向——在"无冲击"时期无法积累反证。

    【结论：未净杀。Taper Tantrum 不构成检验事件。此案例反证了危机判据的事前
    可操作性。】

    === 猎路 2：2013 年金价暴跌中的实物金抛售——攻击非货币锁定的不可逆性 ===

    【靶心：2013 年 4 月金价两日暴跌 ~$200（-13%），全年跌 28%。WGC 报告 2013 年
    黄金回收（recycling）同比激增——印度、东南亚、中东家庭在高价/经济压力下
    大量卖出祖传金饰和压箱底金条。若此抛售量抵消了 2008-2012 年的净累积，
    则"非货币锁定不可逆"被推翻。】

    核查：WGC 数据——2013 年全球黄金回收约 1,371 吨（vs 2012 年 ~1,600 吨？
    实际上 2012 回收约 1,590 吨，2013 年回收降至 ~1,280 吨左右）。等等，
    我需要确认方向——大金价暴跌时回收应该增加还是减少？

    实际机制：金价从 ~$1670 跌至 ~$1180 期间，部分持有者恐慌性抛售（止损），
    部分持有者在金价尚高时获利了结。WGC 2013 年全年回收约 1,280 吨，
    2012 年约 1,590 吨——回收实际上同比下降了。但这与直觉矛盾——
    价格暴跌通常触发更多卖盘。

    更仔细看：2013 年 Q2（金价暴跌最剧烈的季度），回收确实激增——印度和
    中东的回收量环比大幅上升。但全年回收量受下半年金价企稳影响而回落。
    关键问题是：2013 年的回收+首饰制造+金条金币购买的"净"变化如何？
    若净累积在 2013 年转负（减持 > 增持），则 2008-2012 的累积被部分或
    全部擦除。

    消化分析：即使 2013 年净累积转负，也不一定构成推论的反例——2013 年不是
    制度信任危机（已在猎路 1 验证），推论只预测"危机期间买入的非货币黄金在
    信任恢复后不回流"。2013 年的抛售可能来自更早（危机前）累积的黄金存量，
    而非 2008-2012 危机期间的增量。要干净分离这两个存量需要粒度远高于 WGC
    季度报告的微观数据（家庭调查、金饰回收的来源年代鉴定等）——目前不存在。
    → 此反例在当前数据条件下无法干净验证，暴露了"非货币锁定不可逆"机制的
    实证可及性问题（与 BR-L2-031 的人际→制度信任推广链面临类似的证据跨界
    困境）。

    【结论：未净杀——2013 年抛售无法被干净归因（是危机期间增量回流还是
    存量获利了结，当前数据无法区分）。但暴露了非货币锁定机制在实证层的
    粒度不足问题——推论在概念层可被证伪（falsifiability (c)），但在当前
    数据条件下，净累积的操作化测量面临信号/噪声比挑战（should）。】

    === 猎路 3：2023 年 3 月美欧银行业危机——攻击"小危机"的阶梯预测 ===

    【靶心：2023 年 3 月 SVB/Signature/First Republic 倒闭+瑞信被 UBS 收购。
    按预注册判据：(a) 银行 CDS 飙升但主权 CDS 未系统性 ≥3σ 飙升；
    (b) VIX 峰值 ~30（<35-40）；(c) 政策响应有限（Fed BTFP 为美国单边、
    SNB 提供流动性给 UBS 为瑞士单边，非"全球协同"）；(d) 有金融机构倒闭。
    → 满足 (d) 但 (a)+(b) 不足→不满足 (a)+(b)+(d) 门槛。不构成检验事件。】

    若放宽判据纳入此事件：金价危机前基线（2022 全年均价）~$1800。
    危机期峰值 2023-04 ~$2000-2050。危机后底部——危机仅过去 3 年，
    尚未满 60 个月搜索窗口。当前可观测低点 ~$1810（2023-10 美联储持续
    加息+实际利率上升期间）——已接近危机前基线 $1800。若未来数月金价
    跌破 $1800（受美联储降息周期推迟/美元走强影响），则即使放宽危机判据，
    阶梯也可能不成立。

    消化分析：此案例目前是"进行中"的检验——60 个月底部搜索窗口远未关闭。
    当前数据点（$1810/oz 低点，仅 0.6% 高于 $1800 基线）已贴近边界。
    若最终底部 ≤ 基线，推论被证伪（若同时放宽判据将 2023 年 3 月事件标记
    为合格危机）。但按当前预注册判据→不构成检验事件←推论的防线在法律上
    守住（按预注册的严格判据，2023 年 3 月不够格）。

    风险提示：此案例暴露了预注册判据的"double-edged sword"特性——严格判据
    保护推论不被边界反例证伪（高特异性），但也将检验池缩小到仅 2-3 个事件
    （低灵敏度），使推论的"单调"声称在经验上欠定。这是一个认识论上的诚实
    选择（我宁可要少而干净的检验，不要多而脏的检验），但代价是检验力的丧失。
    → 此结构性 trade-off 应在 limitations 中诚实标注。

    【结论：未净杀——2023 年 3 月不满足预注册危机判据（VIX<35，主权 CDS
    未达 ≥3σ）。但当前数据点（底部仅 0.6% 高于基线，60 个月窗口未关闭）
    构成"进行中的近距压力测试"。暴露了严格判据→小检验池→低统计检验力的
    结构性 trade-off（should）。】

    === 猎路 4：构造未来的干净反例——证伪条件的事前操作性测试 ===

    【靶心：构造一个满足所有预注册条件的"理想反例"来验证 falsifiability (a)
    的可操作性】

    设想：未来发生一次满足四条件——(a) 美国主权 CDS 利差飙升 ≥3σ（如因
    国会拒绝提高债务上限导致技术性违约恐慌）、(b) VIX 突破 40、(c) 美联储
    +ECB+BOJ+PBOC 协同紧急降息+流动性注入、(d) 某家 G-SIB 濒临倒闭——
    的制度信任危机。金价从危机前基线 $2500 急涨至峰值 $3200（+28%），
    随后 60 个月内回落至 $2400（底部/基线=0.96）。→ 预测 (i) 被净证伪。
    推论的核心棘轮机制被推翻。

    若同时：(e) CHF/JPY 在此次危机中同样呈阶梯形态（底部 > 基线），或
    (f) WGC 数据显示非货币黄金净累积为负（大量回收+减持）→ 预测 (ii)
    和 (iii) 分别被推翻。

    操作化自检：此理想反例的所有判定均可按当前预注册口径执行——
    危机判据四条件独立于金价→满足；金价底部为峰值后 ≤60 月最低月均价→
    $2400 明确可识别（非边界模糊值）；金 vs CHF/JPY 的分叉→从轨迹数据
    可明确判定；WGC 净累积→从吨数可明确计算。→ 推论在逻辑上可被干净
    反例证伪，预注册口径足以支持反例的明确识别。

    【结论：falsifiability 通道畅通——推论的证伪条件在逻辑层和操作层均可
    被满足，不存在"无论发生什么都可被解释为支持推论"的免疫结构。但
    当前的 pre-registered 判据的严格性意味着：可能需要在未来数十年中经历
    多次危机才能积累足够的检验力——这不是推论的设计缺陷，而是研究对象
    （全球性制度信任危机）的稀有性决定的。诚实标注此时间尺度约束即可。】

    === 综合猎捕结论 ===

    四路猎杀均未获 scope 内净杀反例：
    - 猎路 1（Taper Tantrum）：非危机——不构成检验。
    - 猎路 2（2013 金价暴跌实物抛售）：无法干净归因（存量 vs 增量不可分）。
    - 猎路 3（2023 银行业危机）：不满足预注册判据——不构成检验；当前数据
      点处于"近距压力测试"状态但窗口未关闭。
    - 猎路 4（构造理想反例）：推论在逻辑上可被干净证伪——falsifiability
      通道畅通。

    猎捕过程中暴露的三个结构性问题（small-N 检验力不足、非货币锁定的实证粒度
    不够、严格判据↔检验力的 trade-off）均属 should 级——它们不使推论不可证伪，
    但影响经验信心和检验的实操可行性。

  non_recurrence_of_ded004_007: |
    DED-004（不可证伪循环）：【未复发——逻辑层有三条可独立检验的证伪条件，
    无概念循环】

    逻辑层：falsifiability (a)(b)(c) 给出了明确的证伪条件——
    (a) 干净危机后金价底部 ≤ 基线←具象反例，可操作；
    (b) 金与 CHF/JPY 无系统性分叉←跨资产比较，可操作；
    (c) 非货币黄金无净累积←WGC 数据独立于金价，可操作。
    三条条件均可被现实反例满足——推论没有"无论发生什么都可解释为支持"的免疫结构。

    概念循环检查：危机判定四条件（CDS/VIX/政策/机构倒闭）均独立于金价，
    anti-talisman (1)(2) 明确禁止由结果反推→无 DED-004 式"定义即结论"循环。
    非货币锁定的判定由 WGC 独立数据→不由价格阶梯反推。

    实操层两个"缓发证伪窗口"（与 DED-045 审查中的识别类似）：
    (i) 严格判据→小检验池→需数十年积累足够检验力——但这不是逻辑免疫
    （下一次满足判据的危机即可提供决定性检验），而是时间尺度约束。
    (ii) 非货币净累积的粒度不足——WGC 季度数据无法区分"危机期间买入的金"
    和"早年累积的金"在后续抛售中的比例→推论在概念层可证伪但在当前数据
    条件下实操证伪力受限。→ 这是测量精度问题不是逻辑循环，已标注为 should。
    → 未复发 DED-004。

    DED-007（焊死测量轴）：【未复发——四条测量链概念层均分离，有制度性保障】

    主干：IV=制度信任危机（CDS/VIX/政策/机构倒闭），DV=金价轨迹（LBMA 定盘价）。
    两条测量链在概念层和操作层均分离——危机判定不涉及金市数据，金价测量不涉及
    CDS/VIX 计算。

    辅助测量链：非货币持有量（WGC 行业数据）独立于金价（不由价格推导，由行业
    统计估算）。CHF/JPY 汇率（BIS/FRED）独立于金价（外汇市场）。

    与 DED-007（分母用"实际获授者"→IV 概念定义依赖于 DV 的致命焊死）性质根本
    不同。本案的 IV（制度信任危机）在概念定义和测量层均可与 DV（金价）分离。
    Anti-talisman (1)(2) 进一步锁死"由结果反推原因"的逃逸路线。
    → 未复发 DED-007。

  required_fixes:
    - |
      [required] 注册"阶梯式棘轮"的最小效应量阈值。当前 bottom/baseline > 1.0
      即为"阶梯"判定——但 1.005 和 1.50 在认识论上完全不同。按 L4-009 判例，
      阈值须连同分子/分母/测量口径一次性注册。须补充：
      (a) 金价"阶梯"的最小 bottom/baseline 比阈值（建议 ≥1.05，即底部高出基线
      至少 5%——此阈值排除汇率波动级噪声的同时保留 2008 GFC 1.51 和 2020 COVID
      1.17 两个支持案例；配合敏感性检验 1.03/1.10）。
      (b) 对称地，CHF/JPY"均值回归"的上限 bottom/baseline 比阈值（建议 ≤1.05，
      与金对称，使"分叉"的定义一致——金 >1.05 且 CHF/JPY ≤1.05 方为分叉成立）。
      (c) 声明：两个阈值在见任何新危机数据前定死，反例出现后不得调整以救推论。
      (d) 若某次危机的 bottom/baseline 比落在 [1.03, 1.07] 区间（金和 CHF/JPY
      均接近阈值），诚实标注为"边界不可判"而非强行归类。
      此修复不改变推论方向，仅将证伪条件从过软（任何正差皆可通过）校准到可操作锐度。

    - |
      [required] 注册危机期间窗口定义——即危机事件发生后多长时间内的金价峰值归因于
      该次危机。当前操作化定义了"危机前基线"和"危机后底部"但不定义"危机期间"的上界。
      2008 GFC 案例中危机事件（2008-09）至金价峰值（2011-09）间隔 3 年，其间多项
      独立事件（QE2/欧债危机/美国债务上限危机）叠加。须补充：
      (a) 注册危机期间上界：建议危机事件发生后 ≤36 个月内（或 ≤24 个月，视金价周期
      特征而定）。此窗口为"该次危机的直接效应期"——窗口内的金价变动归因于该危机，
      窗口后若仍有新峰值→视为独立事件或联合效应。
      (b) 若某次危机在注册窗口内无明确峰值（金价未显著高于基线）→该危机不产生
      可检验的轨迹，标记为"无可用峰值"而非"阶梯不存在"（诚实区分"预测不适用"
      和"预测被证伪"）。
      (c) 当两次合格危机的间隔小于注册窗口长度时（如 2008 GFC 和若将 2010-2012
      欧债危机也标记为合格危机），诚实声明两次危机的效应不可分离→作为联合事件
      检验，或排除第二次危机。
      (d) 同步澄清"排除危机发生后 6 个月内的波动低点"中的"危机发生后"是指危机
      事件日期还是峰值日期（当前指代模糊，在 2008 GFC 中两者差 3 年）。
      (e) 若选择不设固定窗口而改为"诚实声明每次危机的峰值归因基于作者判断且
      需列出所有可能混淆的同期事件"，须在 anti-talisman 中追加对应的禁止规则。
      此修复不改变推论的核心预测（底部>基线），仅使峰值归因和底部搜索窗口的
      操作化可复现。

  should_findings:
    - |
      [should] 在 prediction (i) 中校准"单调成立"声称的经验信心。当前 N=2（或至多 3）
      个合格危机→两点之间任何模式都技术上"单调"。建议改为"与当前 2-3 个合格危机
      案例一致（consistent with），单调性属可被未来危机推翻的强预测"——保持"单调"
      为预测方向（非已证事实）但诚实标注当前 N=2 的经验基础。此修复不削弱推论的
      理论锐度——"单调"作为强预测仍成立（下次危机可推翻），只是在当前证据状态下
      更诚实地呈现经验不确定性。
    - |
      [should] 核实并修正 2008 GFC 锚点中的金价峰值数据。当前"$1895/oz（2011-09 月均）"
      与 LBMA PM Fix 2011 年 9 月月均的典型引用值（~$1750-1780）存在可感知的差距。
      若 $1895 是单日定盘价高点或日内现货高点而非月均，应与操作化定义（LBMA PM Fix
      月度均值）保持一致——使用实际月均值或注明偏离理由。此修正不改变核心预测
      （底部 $1049 > 基线 $695 无论峰值是 $1770 还是 $1895 均成立），但影响数据可信度。
    - |
      [should] 注册"非货币黄金净累积"的操作化定义。当前 WGC 数据使用首饰制造+金条
      金币投资（吨），但"净累积"的统计定义未注册：是指"危机后 60 个月累计购买量
      – 回收量 > 0"？是否需要价格平减（因金价上涨导致的美元价值膨胀不应自动满足
      '净累积'的吨数要求）？建议：(a) 净累积 = Σ(危机事件后 t=1..60 的季度
      首饰制造+金条金币购买 – 回收金)，以吨计；(b) 同时报告不变价（CPI 平减）
      作为稳健性检查；(c) 若累计净额 > 0 但幅度小于危机前 5 年均年交易量的
      一个标准差→标记为"净累积不显著"。
    - |
      [should] 在 discriminant_validity 或 limitations 中诚实标注"非货币需求池并非
      唯一可能的危机后锁定机制"。央行储备持有、保险/养老基金的久期匹配需求、
      监管强制持有等也可产生类阶梯效应——本推论的独有声称不是"唯有非货币锁定
      产生阶梯"，而是"非货币锁定是金特有的阶梯来源，该机制在 CHF/JPY 中不存在"。
      此框定防止推论在面临替代机制证据时被过度解读（"既然央行购金也能解释阶梯，
      推论就是错的"→不对，推论只声称非货币锁定是金特有的机制，不声称它是唯一的）。
    - |
      [should] 在 limitations 中诚实标注严格判据→小检验池（N=2-3）→低统计检验力
      的结构性 trade-off。预注册的四条件判据提供了高特异性（防止误标记非危机事件），
      但代价是低灵敏度（排除了 2010-2012 欧债危机等渐变式信任侵蚀）和极小的检验池。
      这是方法论上的诚实选择（宁可要少而干净的检验），但读者应被告知：推论的
      经验基础比典型的 L3 推论更依赖未来危机的持续检验。此标注不构成 required——
      稀有事件领域（古生物学的大灭绝、天文物理的超新星、金融史的全球性危机）
      的推论天然面临此约束，诚实标注即可。

