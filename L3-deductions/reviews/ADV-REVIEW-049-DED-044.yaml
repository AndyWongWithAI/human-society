  required_fixes:
    - |
      【required·红旗11】为预测(ii)的"不减弱"注册事前量化阈值。
      方案:直接路径在加入中介变量后,系数下降≥25%且 Sobel test 或 Bootstrap 中介
      检验 p<0.05→"减弱"(支持中介效应);系数下降<10%或中介检验 p>0.10→"不减弱"
      (证伪中介效应);10%-25%区间→不确定(诚实标注证据不足以裁决)。三级方案避免二分
      阈值的人为刚性,同时杜绝事后口径选择。此阈值在实证检验前依据统计功效分析校准
      后锁死。
    - |
      【required·红旗11】为预测(iii)的"内部交换需求足以独立支撑"注册事前阈值。
      方案:以低威胁政体中制度复杂度最高的 N%政体的交换需求水平(贸易/GDP+城市化率+
      货币化三项标准化均值)作为"独立支撑线"——低于此线的政体在威胁撤除后应预期制度
      退化,高于此线的政体制度不退化不构成对(iii)的证伪。需预先指定 N 值和样本池(全
      球/同区域/同时代)并锁死。此阈值的功能是:使预测(iii)的证伪条件("威胁撤除+交换
      需求低于支撑线+制度在一个世纪内不退化")的操作化可以独立于每个案例的事后口径
      校准——这正是 L4-009 判例的核心教训。
    - |
      【required·红旗11】为预测(iii)的"制度退化"注册量级阈值。
      方案:制度复杂度(三维度标准化均值)在一个世纪内下降≥M%为"退化"(支持预测iii),
      下降<M%为"未退化"(证伪预测iii)。M 需考虑前现代制度复杂度测量的信噪比——建议
      M≥15%(远高于前现代GDP估算的±10%典型误差带),以区分"真退化"与"测量噪声"。
      时间窗口"一个世纪"的计时起点定义为威胁撤除标志(战争频次归零/地理隔绝完成/邻国
      全灭)中最晚一个事件发生的年份+10年(给予制度惯性的冷却期)。

