      古代与现代是否需要不同标准?(d)货币化程度的前现代代理指标方案;(e)三项标准化
      方法——z-score或min-max?标准化样本池定义(全局/同区域/同时代)?(f)法律条文数的
      跨法律传统折算方案(判例法vs成文法的"独立规范性命题数"如何折算?);(g)官僚层级
      的"正式层级"定义——名义官职表层级还是实际指挥链层级?(h)"一个世纪"的计时起点
