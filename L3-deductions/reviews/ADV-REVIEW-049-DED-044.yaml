id: ADV-REVIEW-049
type: adversarial_review
reviews: DED-044
layer: L3-deductions

人话摘要: |
  对 DED-044(掠夺策略×制度信任替代:共生性双向塑造)的 round_1 独立对抗审查。
  裁 needs_revision:核心机制(外部掠夺威胁→集体行动→让渡自由→制度投资→内部掠夺
  抑制→反馈循环)是 BR-L2-008×BR-L2-010 的真正的非平凡合取,无 brick=conclusion,
  未重蹈 DED-004/DED-007。无 required 级缺陷,但 4 条 should 级缺陷(红旗11口径注册
  不完整为主)挡住 verified。反例猎捕未猎到 scope 内净杀反例,但发现若干边界案例
  (波兰-立陶宛/加洛林碎片化/秦-汉连续性)暴露了射程条件未明确定义的问题。

target: DED-044
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者无关)。评分卡红旗 13 条
  逐项攻+反例猎捕(必做)+DED-004(不可证伪循环)/DED-007(测量轴焊死)复发检查。
  裁决三态照评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活反例
  ③未重蹈 DED-004/007。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新上下文, 与作者无关)"
  verdict: needs_revision
  verdict_note: |
    本推论的核心机制——外部掠夺威胁通过集体行动逻辑驱动制度复杂度上升,与内部
    交换需求形成双向共生反馈环——是 BR-L2-008(掠夺是真实策略)与 BR-L2-010(制度
    替代人际信任支撑陌生人交换)的真正非平凡合取。逐砖核实:BR-L2-008 全文不含
    "制度""集体行动""让渡自由"——它只确立掠夺的成本-收益计算,未涉及被掠夺方
    如何组织集体防御,更未涉及防御组织如何制度化为国家。BR-L2-010 全文不含"掠夺
    威胁""战争""外部安全"——它只确立制度可替代人际信任支撑交换(capability主张),
    未涉及制度的另一个独立起源("怕被抢"而非"想做买卖")。合取的核心增量——方向二
    (外部威胁→集体行动→让渡自由→制度投资)作为制度起源的第二条独立因果通道+
    双向反馈环+四项可证伪预测(威胁独立效应/制度中介/威胁撤除退化/双驱动量交互)
    ——任一块砖单独都产不出。

    DED-004(不可证伪循环)与 DED-007(测量轴焊死)均未复发:anti-talisman 三条禁令
    锁死了反向推断(不得从制度复杂度反推威胁强度、不得从制度不退化反推威胁未消失、
    不得在工具变量与OLS冲突时选择性报告),外部威胁的测量锚(战争记录/地理位置/考古
    防御工事)逻辑上异源于被预测量(法律条文数/官僚层级/税收占GDP比)。地理暴露作为
    工具变量提供了外生变异来源——地理位置先于制度复杂度,不可由制度反向决定。

    反例猎捕遍历了多个历史案例(波兰-立陶宛联邦/加洛林帝国碎片化/后罗马不列颠/
    蒙古帝国/秦-汉连续性/易洛魁联盟/荷兰共和国),未猎到 scope 内净杀反例。猎到的
    边界案例均被现有理论框架消化或限定:波兰-立陶宛暴露了"威胁→克服集体行动"这一
    子机制的反向可能(集体行动也可用于抵制制度集中化);加洛林/后罗马不列颠暴露了
    "高威胁+弱既有制度→制度崩溃而非建设"的射程条件缺口。这些不构成净杀但揭示了
    理论需要更明确的射程条件声明。

    无 required 级缺陷。
    四条 should 级缺陷挡住 verified:

    ①【should·红旗11】预测(iii)的"内部交换需求不足以独立支撑"缺乏事前阈值——
    使"威胁撤除后制度不退化"的证伪力被部分架空。当前逻辑:若威胁撤除+制度退化→
    理论成立;若威胁撤除+制度不退化→可归因于"交换需求足够高"。需要预先注册:内部
    交换需求(贸易/GDP+城市化率+货币化程度三项标准化均值)达到什么水平算"足以独立
    支撑"既有制度复杂度。建议:以低威胁-高制度政体的交换需求水平分布的下四分位数
    作为"独立支撑线"——低于此线而制度不退化,则(iii)被证伪。

    ②【should·红旗11】证伪条件(b)的"不减弱"缺乏量化阈值。直接路径系数从β=0.40
    降至β=0.35算"减弱"还是"不减弱"?建议注册:直接路径在加入中介变量后,系数下降
    ≥25%且Sobel test p<0.05 为"减弱"(支持中介效应);系数下降<10%或Sobel test
    p>0.10 为"不减弱"(证伪中介效应);10%-25%区间为不确定。

    ③【should·红旗11】多项测量口径未完成注册。战争频次阈值(COW标准1000战死/年
    是否采纳?边境冲突如何计数?)、城市化阈值(何人口规模/密度算"城市"?古代vs现代
    是否使用不同标准?)、货币化程度的前现代测量方案(无国民经济核算时如何估算?)、
    三项标准化方法(z-score或min-max?标准化样本池是全体已知政体还是同时代同区域
    政体?)。这些缺口目前不影响核心机制的可理解性,但在实证检验中将制造操作化歧义,
    应在 empirical 检验前锁死。

    ④【should·红旗10/射程条件】方向二的核心集体行动机制存在未明确定义的射程条件:
    理论假设外部威胁→克服集体行动问题→建立强制度,但历史中存在相反方向——外部
    威胁→集体行动失败→制度碎片化(加洛林帝国面对维京/马扎尔/萨拉森袭击后封建化;
    后罗马不列颠面对盎格鲁-撒克逊入侵后制度崩溃)。也存在集体行动成功但方向相反的
    情况——波兰-立陶宛贵族集体行动成功抵制了王权集中化。理论需要在 primary_suspect
    中补充射程条件:方向二仅在"既有制度基础达到某最低阈值"(不至于一推就碎)且
    "内部精英缺乏协调能力以集体抵制集中化"的条件下成立。当前 primary_suspect 的
    子风险(1)仅提到非制度防御替代路径,未涵盖"制度崩解"的可能性。

  red_flag_findings:
    brick_conclusion: |
      未命中。逐砖核验:
      BR-L2-008(掠夺是真实策略,IEA=2.0)全文不含"制度""集体行动""让渡自由""制度
      复杂度"——它只确立掠夺的成本-收益计算(抢的净收益>0→掠夺是理性选项),被掠夺方
      如何组织防御、防御组织如何制度化为国家完全不在其射程内。
      BR-L2-010(制度替代人际信任,IEA=1.9)全文不含"掠夺威胁""战争""外部安全""集体
      防御"——它只确立制度可以(capability)替代人际信任支撑陌生人交换,制度的另一个
      独立起源("怕被抢"催生制度)完全不在其射程内。
      两块承重砖的合取产生了一个全新的因果通道:外部掠夺威胁→集体行动激励→个体
      让渡自由接受强制度→制度复杂度上升→反馈抑制内部掠夺。这不是"制度→少抢"的
      单向平凡延伸——那是DED-006/DED-012的射程。核心增量在方向二,且方向二是真正的
      多层合取产物:需要BR-L2-008定义威胁的本质(真实资源夺取,非抽象风险)+BR-L2-010
      定义制度的功能(第三方执法/集体强制力)+AXIOM-001(稀缺→竞争)+THEOREM-conflict-cost
      (冲突消耗资源)合力推导"不合作(被抢光)的成本>合作(交税/服兵役)的成本→制度
      作为集体防御副产品被建立"。任一块砖单独都不涉及此推理链。文件brick=conclusion
      自查准确。

    cell_emptiness: |
      未命中。2×2判据表(外部威胁高/低×制度复杂度高/低)在nontriviality_test中诚实展开:
      - (高威胁,高制度)→核心非平凡格:BR-L2-008不论制度,BR-L2-010不论威胁,两砖合力
        才产生此格的充分条件(三个要素合取)。若此格在控制交换需求后不成立,方向二塌缩。
        这是真正的经验主张,非定义性真理。
      - (高威胁,低制度)→备择路径格:推论不声称制度是唯一路径,瑞士/日耳曼部落/草原
        游牧的实例在此格——方向二从"通用因果"降为"一条可能路径"。诚实。
      - (低威胁,高制度)→内部驱动格:由交换需求/阶级冲突/灌溉协调独立驱动,推论不否认
        此格存在,此格的存在不证伪推论。合理。
      - (低威胁,低制度)→基准格:两砖的平凡预测,无增量。诚实。
      四格分析无同义反复。核心非平凡格(高威胁,高制度)的判空是真经验主张——有没有
      政体面临高外部威胁但制度复杂度不高(控制了交换需求后)?这是一个可被现实填上的
      空格。若大量实例落入此格,方向二不成立。

    measurement_orthogonality: |
      未命中但有注意事项。自变量(外部掠夺威胁)的三项测量:战争频次(COW数据集/历史
      记录)、入侵暴露(地理信息/GIS)、邻国掠夺倾向(BR-L2-008型策略盛行度)。被预测
      量(制度复杂度)的三项测量:法律条文数(独立规范性命题数)、官僚机构层级深度、
      中央税收占GDP比例。两者在概念和数据源上异源:
      - 战争频次来自军事史/冲突研究数据库,与法律制度/官僚/税收统计属不同数据收集体系。
      - 地理暴露是纯空间变量,逻辑上先于任何制度特征,不可被制度复杂度反向决定。
      - 邻国掠夺倾向来自对其他政体的独立编码,不依赖本政体的制度特征。
      注意事项:战争记录的完整性可能受制度复杂度影响——文字社会比前文字社会留下更
      完整的战争记录。文件在limitations中诚实标注了"战争记录存在史料偏差(文字社会
      记录更完整)",且地理暴露作为工具变量可部分缓解此内生性。此偏差不构成DED-007
      级焊点(测量轴不共享),但需在实证设计中通过工具变量/考古证据交叉验证来缓解。
      另一个注意事项:税收占GDP比例作为制度复杂度的测量维度,与方向二的因果机制
      (威胁→防御需求→征税→制度提取能力)存在测量通道与因果通道的重叠——税收增长
      同时是因果机制的一部分(威胁→征税)和DV的测量指标(征税能力→制度复杂度)。这
      不是测量轴焊死(IV与DV仍异源),但在解释实证结果时需区分"税收作为因果中介"与
      "税收作为制度复杂度指标"两个角色。

    scope_exclusion_independence: |
      未命中但有关切(转should④)。三项排除结果:
      (1)"制度复杂度仅由内部交换需求单独驱动"——与预测(a)直接对应,事前标准清晰。
      (2)"威胁→制度的因果方向完全反向"——工具变量vs OLS的事前方法学框架界定。
      (3)"非制度路径的集体防御在历史上是主流"——此项存在界定模糊。"主流"的阈值
      未注册:是>50%的政体数,还是>50%的人口加权?是全部历史时期,还是限定某些时段?
      此外,此项的描述字段为空(只有outcome名称,无description),不如前两项完整。
      然而,排除结果在理论上不致命——即使非制度路径在历史上是主流,方向二仍可作为
      "一条可能路径"存活(推论不声称制度是唯一路径,见nontriviality_test备择路径格)。
      关切点转should④:方向二所需的射程条件(既有制度最低基础+精英协调能力)未在
      excluded_outcomes或primary_suspect中系统定义。

    classification_granularity: |
      未命中。2×2判据表是概念工具,实际预测(i)-(iv)使用连续测量(偏相关系数/中介
      分析/交互项回归)。两个自变量的操作化均为三维复合指标标准化取均值——档位划分
      (高vs低)仅用于nontriviality_test的概念澄清,不用于正式假设检验。连续→二分的
      简化不会扭曲检验逻辑,因为正式预测均以连续形式表述。

    anti_talisman_enforcement: |
      未命中。anti-talisman_clause三条禁令写得严密且诚恳:
      (a)禁止由制度复杂度反推威胁强度——外部威胁必须由独立通道测量(战争记录/地理
      位置/考古防御工事),不得由制度复杂度本身推断。✓
      (b)禁止由制度不退化反推"威胁其实没消失"——威胁撤除以战争频次归零/地理隔绝
      完成/邻国全灭为可观测标志,若满足所有撤除标志而制度不退化,首先接受(iii)被证伪。✓
      (c)禁止反向因果逃逸——若工具变量(地理暴露)支持方向二但OLS不支持,禁止以
      "工具变量效力不足"为由拒绝OLS结果,需诚实标注效应量可能被高估。✓
      三条禁令均具可操作性,非空洞宣言。禁令(b)尤其关键——它封死了预测(iii)最常见
      的护盘路径("威胁其实没完全消失"),使(iii)保持可证伪性。禁令(c)防止选择性报告,
      要求两套方法的结果冲突时诚实标注不确定性。
      独立测量锚均指定:战争记录(COW/历史)、地理位置(GIS/入侵走廊)、考古防御工事
      (物理遗迹)。这些锚均可由独立研究者核验,不依赖推论本身的编码。anti-talisman
      真兑现,未发现不可证伪护身符。

    real_world_anchor_fact_check: |
      未命中。三个支持锚点逐一核验:
      (1) Tilly"战争缔造国家":Charles Tilly(1990) "Coercion, Capital, and European
      States"确实论证了欧洲近代国家的制度复杂度(常备军/税收官僚/法律体系)是军事竞争
      驱动而非经济效率驱动。这是政治社会学/历史社会学的经典论证,事实准确。文件诚实
      标注了Tilly未区分"内部交换需求"vs"外部威胁"的独立贡献,以及未预测威胁撤除后的
      退化——这两项正是本推论的增量。confidence:strong 合理。
      (2) Carthage vs Rome:迦太基作为海上贸易帝国(商法/海事法/契约执行优先)vs罗马
      作为陆上军事帝国(军事征召/税收/行省治理/公法优先)的制度形态差异与驱动量差异
      一致。这是经济史中的标准对比,事实准确。confidence:moderate 合理——两案例的
      制度差异方向与理论预测一致,但双案例不足以建立统计规律。
      (3) 瑞士联邦:从中世纪到近代面临真实外部威胁(哈布斯堡/勃艮第),但走民兵联盟/
      分散防御/直接民主路径,制度复杂度远低于同期法国/普鲁士。这是方向二的重要限定
      条件——威胁存在但走非制度路径。文件诚实标注了此锚"同时支持与限定"推论,并将
      其定位于格(高威胁,低制度复杂度)。事实准确。confidence:moderate 合理。
      边界案例蒙古帝国:分析细致且诚实——区分了"作为威胁输出方"(制度简单)与"作为
      被威胁方/元朝"(制度迅速复杂化),时间序列方向二反被支持。历史事实准确。
      三个锚点均来自可独立验证的历史学/政治社会学文献,无事实错误或过度解读。

    condition_definition_vs_prediction: |
      未命中。核心条件均为可证伪的预测而非必然为真的定义:
      - "外部掠夺威胁→集体行动→让渡自由→制度投资"——可被"高威胁+低制度"格的大量
        实例证伪,也可被机制替代(非制度防御为主流)削弱。
      - 预测(i):外部威胁-制度偏相关系数不显著(|r_partial|<0.15, p>0.05)——干净可证伪。
      - 预测(ii):威胁→内部掠夺抑制不由制度中介——可被Sobel test/Bootstrap中介检验
        证伪。
      - 预测(iii):威胁撤除后制度在一个世纪内不退化——有可观测撤除标志和时间窗口,
        可证伪(虽需补阈值,见should①)。
      - 预测(iv):交互项(威胁×交换)回归系数不显著——标准调节效应检验,干净可证伪。
      discriminant_validity节给出了与Tilly/DED-012/DED-006的独有预测和判别条件——
      若Tilly的通用叙事成立(威胁效应不依赖交换需求)、若DED-012的坐寇单方面建设覆盖
      所有案例(不存在自下而上的制度需求)、则本推论增量归零。这些判别条件使推论可被
      相邻理论"挤出"。不存在"由定义保证为真"的护身符条件。

    enumeration_exhaustiveness: |
      未命中。DED-044不做枚举声称——它不声称"制度有N种起源"或"掠夺-制度关系有N种
      形态"并穷举。2×2判据表是4个逻辑格而非4个species——格是变量交叉的分类学框架,
      不是对现实类型的穷举声称。推论预测的是连续效应(偏相关/中介/交互),不声称
      "所有政体必落入某格且仅落入某格"。主动猎第N+1类:猎了方向二的替代机制(非制度
      集体防御)、方向二的逆向因果(制度→战争)、威胁→制度崩溃(替代威胁→制度建设)
      三种潜在附加类型——均已在primary_suspect或边界案例中覆盖或可归入现有框架。
      未猎到推论声称射程内且无法归入现有判据的活species。此红旗不触发。

    primary_suspect_accuracy: |
      未命中但有补充(见should④)。primary_suspect指向方向二的因果链——"外部掠夺威胁
      →集体行动激励→让渡自由接受强制度",三个子风险识别准确:
      (1)非制度防御路径(日耳曼部落/苏格兰氏族)——瑞士锚即为实例,被现有框架消化为
      交互效应(低交换→威胁走非制度路径)。指得对。
      (2)内部因素独立驱动制度——不证伪方向二只压缩其边际贡献,已在预测(i)中处理。
      指得对。
      (3)反向因果(制度→战争)——被工具变量(地理暴露)部分缓解但无法完全消除。文件
      诚实标注"工具变量效力不足"的可能性,且在anti-talisman(c)中预先注册了冲突处理
      规则。指得对。
      secondary_suspect指向预测(iii)的制度退化被既得利益集团抵抗——准确。这是方向二
      逻辑的自然后果(制度一旦建立→官僚/军官阶层→抵制缩编),即使威胁撤除。文件承认
      退化速度/幅度可能因制度惯性而不显著,但不否定方向二的原始因果链。
      平凡化风险:"有敌人→要军队→要收税→制度自然出现"是可能的压缩。文件在
      discriminant_validity防平凡化守卫中给出了三个非平凡增量:(i)威胁撤除后制度退化
      (常识不会预测"回缩");(ii)双驱动量交互≠加性(常识不会区分交互vs加性);(iii)制度
      形态由驱动量组合决定(不只看"多不多",还看"长什么样")。三项增量均有测量口径支撑,
      非模糊常识。平凡化风险存在但不致命——压缩版丢失了交互效应和退化预测这两个主要
      增量。建议补充射程条件(见should④),其余可接受。

    caliber_registration: |
      【命中·should级】核心变量的定义和测量方向在operationalization中已注册,但多项
      关键口径和阈值未锁死:

      (a)外部掠夺威胁:
      - 战争频次:未指定"战争"的操作化定义(COW标准的≥1000战死/年是否采纳?边境冲突/
        劫掠是否计为战争?内战是否计入"外部战争"?)
      - 入侵暴露:未指定"入侵通道"的操作化定义(如何从GIS判定?参考哪些历史地理学文献
        的标准?)
      - 邻国掠夺倾向:"盛行程度"的量化方案未定(邻国中BR-L2-008型政体的比例?还是
        邻国掠夺行为的频率计数?)
      - 三项标准化的方法未定(z-score还是min-max?标准化样本池是全局政体还是同时代
        同区域政体?)

      (b)内部交换需求:
      - 贸易/GDP:古代经济中"长途贸易"vs"本地贸易"的区分标准?
      - 城市化率:"城市"的人口/密度阈值?前现代与现代是否用不同标准?
      - 货币化程度:前现代无国民经济核算体系时如何测量?
      - 三项标准化的方法同上未定。

      (c)制度复杂度:
      - 法律条文数:"独立规范性命题数"的折算方法未给出操作化方案(不同法律传统如何
        折算成可比单位?)
      - 官僚机构层级:"正式层级"的定义(官职表上的名义层级还是实际指挥链的层级?)
      - 中央税收/GDP:古代GDP估算的误差极大,税收占"估算GDP"的比值可能噪声淹没信号。

      (d)证伪条件的阈值:
      - 预测(a):偏相关系数|r|<0.15, p>0.05——已注册。✓
      - 预测(b):"不减弱"无量化阈值(见should②)。
      - 预测(c):"一个世纪内""保持不变"无量化阈值。"保持不变"是±5%还是±10%?"一个
        世纪"的起点如何定义(威胁撤除的精确日期在许多历史案例中存在争议)?
      - 预测(d):交互项p>0.05——已注册。✓

      这些缺口目前不影响推论核心机制的可理解性——方向二和创新预测在概念层面是清晰的。
      但按评分卡第11条纪律("发现'只有数字没有口径'→直接标记required"),上述缺口
      构成口径注册不完整。考量到推论处于candidate阶段且核心证伪路径(i)/(iv)已注册
      阈值,判定为should而非required——在进入empirical检验前必须补齐所有口径,否则
      实际操作中将无法区分"方向二不成立"vs"测量口径不一致"。

    data_source_same_root: |
      未命中。DED-044不涉及"多源验证"声称。支持的三个锚点(Tilly历史社会学/Carthage
      vs Rome历史比较/瑞士联邦历史)来自不同的史学研究传统(政治社会学/古代经济史/
      欧洲制度史),不共享同一底层数据集。COW战争数据集与GDP估算/Maddison历史统计与
      法律史文献属不同数据收集体系。不存在CNBS/WB/IMF式的"多个机构共享同一套国家
      账户底层数据"问题。此红旗在DED-044层面不触发。

    api_independence_fallacy: |
      未命中。DED-044不涉及通过API/MCP查询经济数据源并声称多源独立验证。经验锚点
      来自历史学/政治社会学/考古学文献,不依赖API聚合的统计数据。

  counterexample_hunt:
    method: |
      按评分卡要求主动构造能证伪核心主张的干净案例。搜索策略围绕四个最脆弱的关节:
      (a)方向二核心机制——找"高外部威胁+控制了交换需求→低制度复杂度"的清晰历史实例。
      (b)预测(iii)——找"威胁骤然消失+交换需求不高→制度在一个世纪内不退化"的实例。
      (c)反向因果——找制度先于威胁建立(制度→军事成功→威胁降低,而非威胁→制度)的实例。
      (d)集体行动失败——找"高威胁但集体行动未克服搭便车→制度未建立"的实例。
      扫描范围:欧亚大陆前现代政体(罗马/中国/伊斯兰/欧洲封建/草原帝国/东南亚/非洲
      大湖地区/前哥伦布美洲),覆盖不同威胁水平×交换水平的组合。

    findings:
      killed: []
      absorbed:
        - candidate: "波兰-立陶宛联邦(16-18世纪)——高威胁+强集体行动但抵制制度集中化"
          analysis: |
            波兰-立陶宛面临极高外部威胁(瑞典/俄罗斯/奥斯曼/克里米亚鞑靼),内部交换
            需求中等(格但斯克谷物贸易),但贵族通过"自由否决权"(liberum veto)成功抵制
            了王权集中化和常备军建设——制度复杂度低(弱君主/无中央官僚/无有效税收)。
            这是方向二的反面:集体行动成功了,但方向是"抵制制度集中化"而非"让渡自由
            建强制度"。贵族的集体行动逻辑是:让渡自由给国王→国王可能成为内部掠夺者
            (DED-012坐寇化风险)比外部威胁更可怕→宁愿维持弱中央。
            文件未提及此案例。不构成净杀——可归入格(高威胁,低制度复杂度),已在
            nontriviality_test中留有位置。但暴露了方向二的一个隐含假设:外部威胁的
            集体行动方向总是"朝向中央权威集中"——波兰-立陶宛显示集体行动也可以朝向
            "抵制中央权威集中"。
          status: absorbed_by_alternative_path_cell
          implication: |
            方向二的"让渡自由→接受强制度"并非外部威胁下集体行动的唯一可能产物。
            当精英协调成本低+对内部掠夺的恐惧>对外部掠夺的恐惧时,集体行动可能用于
            抵制而非建设强制度。这是primary_suspect子风险(1)未涵盖的维度——子风险(1)
            只提了非制度防御(民兵/雇佣兵),未提"集体抵制集中化"。

        - candidate: "加洛林帝国/后罗马不列颠——高威胁+弱制度基础→制度崩溃而非建设"
          analysis: |
            加洛林帝国(9-10世纪):面对维京/马扎尔/萨拉森三方袭击→中央权威崩溃→
            封建化(去集中化)。后罗马不列颠(5-6世纪):盎格鲁-撒克逊入侵→罗马制度
            全盘崩溃→部落化/地方军阀化。两个案例的共同模式:高外部威胁+既有制度基础
            不足以应对→制度不是被"催生"而是被"摧毁"。
            文件未提及此类案例。不构成净杀——可辩称方向二假设既有制度基础存在某最低
            阈值(推论隐含地将"制度复杂度"的被预测对象限定为"已存在政体的制度",
            而非"从无制度到有制度")。但这揭示了一个未明确定义的射程条件:方向二的
            "威胁→催生制度"机制仅在既有制度基础超过某临界值时才激活;低于该临界值,
            威胁反而触发制度碎片化。
          status: absorbed_with_scope_boundary_concern
          implication: |
            这是should④的核心依据——方向二需要补充射程条件:"既有制度基础最低阈值"
            以上的政体,外部威胁→制度建设;以下的政体,外部威胁→制度崩溃。

        - candidate: "秦-汉连续性(前221-前121)——威胁撤除后一个世纪内制度未退化,反而扩张"
          analysis: |
            秦统一六国(前221)后外部威胁骤然下降(所有对手被征服,仅余北方匈奴)。
            此后一个世纪内(前221-前121,覆盖秦+西汉前期),制度复杂度未退化:秦的
            郡县制/标准化/法家官僚被汉继承,汉武帝时期(前121前后)制度进一步扩张
            (盐铁官营/均输平准/察举制)。内部交换需求在秦汉之际确实波动(秦末战乱
            破坏经济,汉初恢复),但制度复杂度整体上升趋势未中断。
            文件未直接讨论此案例(仅通过蒙古/元朝的时间序列间接涉及)。不构成净杀:
            可辩称(i)匈奴威胁持续存在→外部威胁未"骤然消失";(ii)内部交换需求在
            文景之治后恢复→预测(iii)的"交换需求不足以独立支撑"条件未满足。但这两个
            辩护之间存在张力:若匈奴威胁算"未消失",那几乎找不到"威胁真正消失"的
            历史案例——因为大国总会有边境威胁。这凸显了should①的必要性:需要事前
            定义"威胁撤除"的严格标准,否则(iii)的"威胁撤除"条件变成主观判断。
          status: absorbed_with_measurement_concern
          implication: |
            强化should①——预测(iii)的可证伪性依赖于"威胁撤除"和"交换需求不足以
            支撑"两个门槛的事前注册。若"威胁撤除"在实践中几乎不可达(大国总有边境
            威胁),则(iii)不构成真正的经验风险。

        - candidate: "蒙古帝国/草原帝国——威胁输出方自身制度简单"
          analysis: |
            已在文件real_world_anchors.boundary_cases中分析。蒙古作为威胁输出方,
            其成功依赖BR-L2-008(掠夺占优)+极低掠夺成本——这正是方向二的镜像:威胁方
            不需要强制度。转换为被威胁方(元朝)后制度复杂度迅速上升——方向二在时间
            序列上被支持。边界案例,非反例。
          status: absorbed_by_boundary_case_analysis

        - candidate: "易洛魁联盟(前殖民时期)——高威胁→制度创新但不走集中化路径"
          analysis: |
            易洛魁联盟面对高外部威胁(周边敌对部落,哀悼战争循环),通过Great Law of
            Peace建立了联盟制度——但制度形态是联邦/共识型的(部落理事会、无中央行政、
            无税收、无常备军),而非欧亚式的集权国家。这是"威胁→制度"的实例,但制度
            形态与DED-044测量的"法律条文/官僚层级/税收"三维度错位——按DED-044的
            操作化,易洛魁联盟的"制度复杂度"得分会很低(无成文法条文/无官僚层级/无
            税收),但它的制度在功能上确实解决了集体行动问题(内部和平+外部集体防御)。
            这不构成净杀——DED-044不声称制度复杂度是制度的唯一有意义维度,且在
            discriminant_validity中讨论了"制度形态由驱动量组合决定"。但暴露了测量
            偏差:三维度(法律/官僚/税收)偏向欧亚大陆国家形态,可能系统性低估非欧亚
            制度安排。
          status: measurement_concern_not_counterexample
          implication: |
            不是反例——易洛魁的制度属于格(高威胁,高制度功能-低制度复杂度测量),
            但DED-044的测量框架可能将其编码为(高威胁,低制度复杂度),从而产生
            测量有效性损失。

        - candidate: "荷兰共和国(1581-1795)——极高威胁+高交换→制度创新但政治去集中化"
          analysis: |
            面临极高外部威胁(八十年战争与西班牙,后续与法/英战争),内部交换需求极高
            (全球贸易帝国)。制度创新集中在商业/金融领域(阿姆斯特丹交易所/银行/国债),
            政治制度却是去集中化的(联省共和/无君主/省自治)。商业制度的复杂度极高,
            政治制度的"中央集权度"低。按DED-044的三维度测量(法律条文/官僚层级/税收),
            荷兰的商业法律条文极多、税收(GDP占比)高、但官僚层级浅——取决于三维度权重,
            可能得高分(若法律和税收权重高)或中等分(若官僚层级权重高)。这不构成反例,
            但同样暴露了"官僚层级深度"作为制度复杂度维度的中央集权偏向。
          status: absorbed_by_prediction_iv
          implication: |
            荷兰是预测(iv)(双驱动量交互)的有力支持案例——高威胁×高交换→独特的
            制度形态(商业-金融制度优先,军事-行政制度选配)。但测量框架的中央集权偏向
            使其可能被低估。

    hunt_verdict: |
      未猎到scope内净杀反例。猎到的六个候选案例均被现有理论框架消化或暴露测量/
      射程边界的非致命问题:
      - 波兰-立陶宛→被消化为"备择路径格"+暴露集体行动方向的双向性
      - 加洛林/后罗马不列颠→暴露射程条件缺口(最低制度基础阈值)
      - 秦-汉连续性→暴露预测(iii)的"威胁撤除"标准模糊
      - 蒙古→已被文件分析为边界案例
      - 易洛魁/荷兰→暴露测量框架的欧亚中央集权偏向(非反例,但影响测量有效性)

      这些发现不构成对方向二核心因果链的致命打击,但共同指向一个需要精确化的维度:
      方向二的"威胁→强中央制度"的机制并非普遍适用——它的成立依赖于(1)既有制度
      基础超过崩解临界值,(2)精英协调能力不足以集体抵制集中化,(3)交换需求水平作为
      催化/替代条件。这些是射程条件,不是反例。

  non_recurrence:
    DED_004_circularity: |
      未复发。DED-004的死因是interaction-type推论中P2禁格被证明为平凡合取(任一禁格
      均由单一父推论判空,不需要两父合力→"联合分布"实为单维投影)。DED-044不存在此问题:
      BR-L2-008单独完全不论制度/集体行动——它无法单独判空(高威胁,高制度)格或任何
      其他格。BR-L2-010单独完全不论外部威胁——它无法单独判空任何涉及威胁的格。核心
      非平凡格(高威胁,高制度)的判空需要两块砖+AXIOM-001+THEOREM-conflict-cost合力:
      BR-L2-008定义威胁的本质,BR-L2-010定义制度功能,公理/定理推导"不合作的成本>合作的
      成本→制度作为集体防御副产品"。任一砖缺失,此推理链断裂。这是真正的联合分布命题。
      anti-talisman三条禁令进一步封死了循环推理的路径——不得从制度复杂度反推威胁强度、
      不得从制度不退化反推威胁未消失。不可证伪循环未复发。

    DED_007_welded_measurement: |
      未复发。DED-007的死因是测量轴焊死——自变量(制度替代人际信任的"效果")与被预测
      量(交换规模)共享同一测量链(制度存在→交换便利→交换规模大,然后说"交换规模大
      证明制度效果好")。DED-044不存在此问题:自变量(外部掠夺威胁)的测量(战争记录/
      地理位置/考古工事)与被预测量(制度复杂度=法律条文/官僚层级/税收占比)在概念和
      数据源上均异源。地理暴露工具变量是先于制度的外生变量——地理位置不由制度复杂度
      反向决定。战争记录虽可能有史料偏差(文字社会记录更完整,被文件limitations诚实
      标注),但此偏差的方向与威胁→制度的预测方向相反(制度越复杂→战争记录越完整→
      人为拉高制度复杂度政体的"威胁水平"→如果存在偏差,它会人为强化制度→战争的
      反向因果假象,而非强化威胁→制度的正向假象)。因此残余的测量偏差更可能是让方向二
      的检验更保守而非更宽松——这是有利于严谨性的偏差方向。DED-007型焊死未复发。

  required_fixes: []

  should_fixes:
    - |
      【红旗11·预测(iii)交换需求"独立支撑"阈值】为"内部交换需求足以独立支撑既有
      制度复杂度"注册事前阈值。建议方案:以低威胁-高制度复杂度的历史政体样本的交换
      需求水平(贸易/GDP+城市化率+货币化三项标准化均值)的下四分位数作为"独立支撑线"。
      低于此线的政体若在威胁撤除后一个世纪内制度复杂度不降(降幅<5%),则预测(iii)
      被证伪。高于此线的政体,制度不退化不构成对(iii)的证伪——退化预期仅适用于交换
      需求不足的政体。此阈值在实证检验前可依据历史数据校准后锁死。
    - |
      【红旗11·预测(b)"不减弱"量化阈值】为中介效应的"减弱vs不减弱"注册量化标准。
      建议:(a)直接路径在加入中介变量后系数下降≥25%且Sobel test或Bootstrap中介
      检验p<0.05→"减弱"(支持中介效应,推论成立);(b)系数下降<10%或中介检验p>0.10→
      "不减弱"(证伪中介效应);(c)10%-25%区间→"不确定"(诚实标注证据不足以裁决)。
      此三级方案避免了二分阈值的人为刚性,同时防止了事后口径选择。
    - |
      【红旗11·测量口径完整注册】补齐以下未锁死的操作化定义:(a)战争的操作化定义——
      采纳COW的≥1000战死/年标准还是其他?边境冲突/劫掠/内战如何处理?(b)"入侵通道"
      的地理判定标准——参考哪些历史地理学文献?(c)城市化阈值——古代/前现代的人口
      或密度标准?(d)货币化程度的前现代测量方案——无国民经济核算时采用什么代理指标?
      (e)三项标准化方法——z-score还是min-max?标准化样本池定义?(f)"法律条文数"的
      折算方案——不同法律传统的可比单位操作化?(g)官僚层级的"正式层级"定义——名义
      层级还是实际指挥链?(h)"一个世纪"的起点定义——威胁撤除的哪个事件/日期作为
      计时起点?这些都是操作性细节,不影响candidate阶段的核心机制评审,但在进入实证
      检验前必须锁死以区分"方向二不成立"vs"测量方案不一致"。
    - |
      【红旗10/射程条件·方向二的适用范围】在primary_suspect或新增scope_conditions
      字段中系统定义方向二的射程条件。基于反例猎捕发现,至少需覆盖以下三种限定:
      (a)既有制度基础阈值——方向二的"威胁→催生制度"仅适用于既有制度基础超过某
      最低水平的政体;低于该阈值,高威胁可能触发制度崩溃/碎片化而非强化(加洛林/
      后罗马不列颠为实例)。(b)精英协调方向——外部威胁引发的集体行动不必然朝向
      "让渡自由给中央权威";当精英协调成本低且对内部掠夺的恐惧大于对外部掠夺的
      恐惧时,集体行动可能朝向"抵制中央权威集中"(波兰-立陶宛为实例)。(c)威胁的
      制度路径vs非制度路径的门控条件——当前文本已通过交互效应(高交换→制度路径)
      部分处理,但建议更显式地将"交换需求水平"注册为门控变量:当内部交换需求低于
      某阈值时,即使威胁极高,制度路径也不激活(瑞士为实例)。这三个射程条件不削弱
      方向二的核心逻辑,但将其从"通用因果"精确化为"条件因果"——与nontriviality_test
      中格(高威胁,低制度)的分析一致。

round_2:
  reviewer: "独立对抗审查者 (round 2, 全新上下文, 与round_1审查者无关)"
  verdict: needs_revision
  verdict_note: |
    本轮为 round 2 独立对抗审查。DED-044 文件自 round 1 后未被修订(review_summary
    仍写"审查轮数 0",status 仍为 candidate),round 1 的四条 should 级缺陷无一被消解。

    独立复核 round 1 全部 13 条红旗后,本审查者同意 round 1 的核心判断:方向二(外部
    掠夺威胁→集体行动→让渡自由→制度投资)作为制度的第二条独立因果通道,是 BR-L2-008
    与 BR-L2-010 的真正非平凡合取。brick=conclusion 未命中、DED-004/DED-007 未复发、
    测量轴正交、anti-talisman 三条锁可靠——这些判断维持不变。

    但 round 1 的 should①和 should②在红旗 11 的严格标准下应升级为 required:
    红旗 11 规定"发现'只有数字没有口径'→直接标记 required"。预测(ii)的"不减弱"
    仅有概念描述无量化阈值,预测(iii)的"交换需求不足以独立支撑"和"制度退化"均只有
    概念描述无量化阈值——这三处均属"只有概念没有口径"。round 1 以"candidate 阶段+
    核心证伪路径(i)(iv)已注册"为由降级为 should,但红旗 11 未授予此种自由裁量权。
    此外,本审查者对预测(iii)的 first-order 效力提出了比 round 1 更严厉的质疑:即使
    补齐阈值,预测(iii)在 anti-talisman 禁令(b)下的经验风险可能为零(详见红旗 11 分析)。
    但这不改变 verdict——推论的核心因果链(方向二)仍可经由预测(i)和(iv)独立检验,
    故为 needs_revision 而非 rejected。

    本轮反例猎捕新增三个候选案例(汉萨同盟/马拉塔联盟/神罗后威斯特伐利亚),
    均未猎到 scope 内净杀反例,但汉萨同盟对预测(iv)的"双驱动量正向交互"构成了
    最接近净杀的挑战(高威胁×极高交换→低制度集中化),暴露了制度复杂度测量框架
    的"中央集权偏向"是一个系统性测量有效性问题而非孤立噪声。

    round 1 的 required_fixes 为空。本轮升级 3 条为 required(均属红旗 11 口径注册),
    round 1 的 should③和 should④维持。

  red_flag_findings:
    brick_conclusion: |
      未命中。独立复核确认:BR-L2-008(掠夺是真实策略,IEA=2.0)不含"制度""集体行动"
      "让渡自由"——仅确立掠夺的成本-收益计算。BR-L2-010(制度替代人际信任,IEA=1.9)
      不含"掠夺威胁""战争""外部安全"——仅确立制度替代人际信任支撑交换的 capability
      主张。grep -c 验证:BR-L2-008 正文中"制度"/"集体行动"/"让渡自由"出现次数为 0;
      BR-L2-010 正文中"掠夺"/"威胁"/"战争"/"抢"出现次数为 0。方向二(外部威胁→制度)
      作为制度起源的第二条独立因果通道+双向反馈环+四条可证伪预测是两块砖的合取增量,
      任一块砖单独均不涉及。round 1 的 brick≠conclusion 结论维持。

    cell_emptiness: |
      未命中。独立复核 2×2 判据表:
      - (高威胁,高制度)→核心非平凡格:需要 BR-L2-008(威胁本质)+BR-L2-010(制度功能)
        +AXIOM-001+THEOREM-conflict-cost 合力推导,任何单砖不能判空此格。真经验主张。
      - (高威胁,低制度)→备择路径格:推论不声称制度是唯一路径,诚实。
      - (低威胁,高制度)→内部驱动格:推论不否认,反而依赖其存在(预测iv需要双驱动量并存)。
      - (低威胁,低制度)→基准格:两砖平凡预测,诚实标注无增量。
      四格分析无同义反复。round 1 结论维持。

    measurement_orthogonality: |
      未命中。自变量(外部掠夺威胁:战争频次/入侵暴露/邻国掠夺倾向)与被预测量(制度
      复杂度:法律条文数/官僚层级/税收占比)在概念层级和数据源上异源。地理暴露工具变量
      逻辑上先于任何制度特征。税收占GDP比例的双重角色(因果中介+测量指标)注意事项在
      round 1 中已充分讨论,此偏差不构成 DED-007 级焊死(IV与DV仍异源,偏差方向使检验
      更保守)。round 1 结论维持。

    scope_exclusion_independence: |
      未命中但关切维持。三项 excluded_outcomes 均映射到可事前判定的渠道:
      (1)对应预测(i)的零效应;(2)对应工具变量vs OLS 的方法学框架;(3)对应非制度防御
      的主流性——但其"主流"阈值未注册(>50%政体数?人口加权?)。round 1 将此关切转
      should④,本审查者同意,但补充:excluded_outcome(3)本身不需要阈值——它是排除结果
      而非证伪条件,即使非制度防御是主流,方向二仍可作为"一条可能路径"存活。射程条件
      问题(should④)与 excluded_outcome 的界定是不同层面的问题。

    classification_granularity: |
      未命中。2×2 档位仅用于 nontriviality_test 的概念澄清,正式预测(i)-(iv)均以连续
      量表述(偏相关系数/中介分析/交互项回归)。不存在将连续量粗暴二分化导致信息损失的
      问题。round 1 结论维持。

    anti_talisman_enforcement: |
      未命中但有一条补充关切。三条禁令写得严密:
      (a)禁止由制度复杂度反推威胁强度——外部威胁须独立测量(战争记录/地理位置/考古
        防御工事)。具可操作性。
      (b)禁止由制度不退化反推"威胁其实没消失"——威胁撤除以战争频次归零/地理隔绝完成/
        邻国全灭为可观测标志,满足所有标志而制度不退化则接受(iii)被证伪。逻辑严密。
      (c)禁止反向因果逃逸——工具变量与OLS冲突时诚实标注,不得选择性报告。具可操作性。
      三条禁令均可在经验研究中由独立研究者验证,非空洞宣言。round 1 结论维持。

      补充关切(非新红旗,属现有红旗 11 的深化):禁令(b)要求"战争频次归零/地理隔绝完成/
      邻国全灭"作为威胁撤除的可观测标志。这意味着满足禁令(b)的经验案例将极其稀少——
      大国几乎总处于某种外部威胁之下(边境民族/海盗/邻国竞争),严格满足三者归零的历史
      案例可能接近于零。这意味着预测(iii)虽然在形式上是可证伪的(禁令(b)定义了证伪
      条件),但在实践中可能缺乏可观测的经验风险——当一个预测要求的前提条件几乎永远
      不出现时,该预测对理论的 corroboration 增量趋近于零。这不是证伪问题(推论不因此
      为假),而是"预测(iii)作为独立经验风险是否负担得起"的问题——这更多影响推论的整体
      信息量而非正确性,故维持为关切而非独立红旗。

    real_world_anchor_fact_check: |
      未命中。独立复核三个支持锚点:
      (1) Tilly"战争缔造国家":Charles Tilly (1990) 的经典论证——欧洲近代国家的制度
        复杂度是军事竞争驱动而非经济效率驱动。事实准确。文件诚实标注了 Tilly 未区分
        交换需求 vs 威胁的独立贡献,也未预测威胁撤除后退化——这两项是本推论增量。
      (2) Carthage vs Rome 制度形态差异:海上贸易帝国(商法/海事法)vs 陆上军事帝国
        (军事征召/税收/公法)的制度差异方向与驱动量差异一致。经济史标准对比,事实准确。
      (3) 瑞士联邦低制度化集体防御:面临真实外部威胁但走民兵联盟/直接民主路径,制度
        复杂度远低于同期法国/普鲁士。事实准确。文件诚实标注此锚"同时支持与限定"推论。
      边界案例蒙古帝国的分析细致诚实——区分威胁输出方(制度简单)与威胁承受方/元朝
      (制度迅速复杂化)。round 1 结论维持。

    condition_definition_vs_prediction: |
      未命中。逐一核验:
      - 预测(i):外部威胁-制度偏相关不显著(|r_partial|<0.15,p>0.05)——可证伪。✓
      - 预测(ii):威胁→内部掠夺抑制不由制度中介——可被 Sobel/Bootstrap 检验,可证伪,
        但"不减弱"缺量化阈值(见红旗11的升级分析)。机制可证伪,阈值待注册。
      - 预测(iii):威胁撤除后制度在一个世纪内不退化——有可观测撤除标志和时间窗口,
        可证伪,但"退化"幅度阈值+"交换需求独立支撑"阈值均未注册(见红旗11升级分析)。
        机制可证伪,阈值待注册。
      - 预测(iv):交互项(威胁×交换)回归系数不显著(p>0.05)——标准调节效应检验,已注册。✓
      discriminant_validity 给出与 Tilly/DED-012/DED-006 的判别条件——若 Tilly 通用
      叙事成立(威胁效应不依赖交换需求)或 DED-012 坐寇单方面建设全覆盖→推论增量归零。
      无"由定义保证为真"的护身符条件。round 1 结论维持。

    enumeration_exhaustiveness: |
      未命中。DED-044 不做枚举声称——不声称"制度有 N 种起源"并穷举。2×2 判据表是变量
      交叉的分类学框架而非 species 穷举。主动猎替代机制:非制度集体防御、反向因果(制度
      →战争)、威胁→制度崩溃三种——均在 primary_suspect 或边界案例中覆盖。未猎到推论
      声称射程内且无法归入现有判据框架的活 species。round 1 结论维持。

    primary_suspect_accuracy: |
      未命中但有补充。primary_suspect 指向方向二因果链的三个子风险:
      (1)非制度防御替代路径——瑞士锚即为实例,被现有框架消化为交互效应(低交换→威胁
        走非制度路径)。指得对。
      (2)内部因素独立驱动制度——不证伪方向二只压缩边际贡献。指得对。
      (3)反向因果——工具变量(地理暴露)部分缓解。指得对。
      secondary_suspect(预测iii的制度惯性抵抗)准确。round 1 结论维持。

      补充(非新风险,属红旗 10 的"平凡化检查"深化):防平凡化守卫的三个非平凡增量
      (i)威胁撤除后退化、(ii)双驱动量交互≠加性、(iii)制度形态由驱动量组合决定——
      前两项是本推论的独有预测,第三项是 discriminant_validity 的延伸。但需要注意:
      若"常识"版本是"有敌人→要军队→要收税→制度自然出现",那么(iii)制度形态差异
      (外部威胁→公法/军事/税收制度优先,内部交换→商法/契约/产权制度优先)也是常识
      版本的自然推论——打仗自然催生军事/税收制度,做买卖自然催生商业/契约制度。
      这不削弱推论(因为常识版本不会预测交互≠加性或威胁撤除后退化),但需注意(iii)
      不是与常识的强判别点。真正的强判别点是(i)和(iv)。

    caliber_registration: |
      【命中·升级为 required】独立复核 round 1 的口径注册分析后,本审查者认为红旗 11
      在以下三项上的违反达到了 required 级别(round 1 将其降为 should①和 should②):

      (A)【required·红旗11】预测(ii)"不减弱"缺乏量化阈值。当前文本:"加入制度复杂度
      作为中介变量后,威胁→内部掠夺抑制的直接路径仍显著且不减弱"。无任何量化标准界定
      何为"减弱"、何为"不减弱"。在实证操作中,直接路径系数从 β=0.40 降至 β=0.35 算
      "减弱"还是"不减弱"?无事先注册的阈值,任何结果都可被事后解释为支持推论——这正
      是红旗 11 要杜绝的情形。红旗 11 明确规定"发现'只有数字没有口径'→直接标记
      required"——"不减弱"是更严重的情况:它连数字都没有,只有概念描述。必须事前注册:
      系数下降≥X%且 Sobel/Bootstrap p<Y 为"减弱"(支持中介),系数下降<Z%或 p>W 为
      "不减弱"(证伪中介),中间区间为不确定。round 1 的 should② 升级为 required。

      (B)【required·红旗11】预测(iii)"内部交换需求不足以独立支撑"缺乏事前阈值。
      当前文本:"若内部交换需求不足以独立支撑既有制度复杂度,制度将出现熵增式退化"。
      没有任何标准界定何种交换需求水平算"足以独立支撑"。在实证操作中,任何威胁撤除后
      制度不退化的案例,均可被事后声称"其交换需求足够高"而豁免——这正是红旗 11+
      L4-009 判例要禁绝的事后口径选择。anti-talisman 禁令(b)仅锁死了"威胁撤除"一侧
      的可观测标志,但"交换需求足以独立支撑"这一侧的阈值完全开放——这等于给预测(iii)
      留了一扇未上锁的后门。红旗 11 判例 L4-009 的核心教训正是:若某边界案例的裁决
      依赖事后口径选择,该案例一律按不利于推论方向裁。预测(iii)的当前设计使"交换需求
      足以独立支撑"的口径可在每个案例出现后才被"校准"——聪明的研究者总能找出体面理由
      解释为何某案例的交换需求"其实够高了"。round 1 的 should① 升级为 required。

      (C)【required·红旗11】预测(iii)"制度将出现熵增式退化"中的"退化"缺乏量级阈值。
      制度复杂度下降 1%算退化?5%?10%?在一个世纪的时间窗口内,测量噪声(如前现代制度
      复杂度估算误差)可能淹没小幅退化。若无事前量级阈值,任何"制度未退化"的发现都可
      被归因于"测量噪声掩盖了真实退化"或"退化的时间窗口还没到"。必须注册:制度复杂度
      下降≥M%为"退化"(支持预测iii),下降<M%为"未退化"(证伪预测iii),M 需考虑测量
      误差后设定。此缺口 round 1 未独立标记(其 should①混合了交换需求阈值和退化阈值),
      本轮独立列出。

      以下口径缺口维持 should 级(不升级,与 round 1 的 should③一致):
      (D)【should·红旗11】operationalization 中各变量的操作化细节未锁死:战争的操作化
      定义(COW 标准是否采纳?边境冲突/劫掠/内战如何处理?)、入侵通道的地理判定标准、
      城市化的人口/密度阈值(古代vs现代)、货币化程度的前现代测量方案、三项标准化的
      方法(z-score或min-max?样本池定义?)、法律条文数的跨法律传统折算方案、官僚层级
      的"正式层级"定义、"一个世纪"的计时起点定义。这些在 candidate 阶段不影响核心
      机制的可理解性,且预测(i)(iv)已有注册阈值使推论在原则上可证伪。但在进入实证
      检验前必须锁死——否则无法区分"方向二不成立"与"测量方案不一致"。

