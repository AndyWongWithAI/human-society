  counterexample_hunt:
    method: |
      本轮独立猎捕,不与 round 1 的策略和案例重复。搜索策略围绕四个维度:
      (a)高威胁×高交换→低制度集中化——找预测(iv)的反面:双驱动量并存但制度复杂度
        不高(或制度形态高度去集中化)的清晰案例。
      (b)高威胁×低交换→制度集中化(非制度路径的替代)——找方向二的备择路径案例,
        验证集体行动是否不必然走"让渡自由给中央权威"。
      (c)威胁撤除→制度不退化(且交换需求确定不高)——找预测(iii)的反面,但鉴于
        预测(iii)的阈值未注册,此维度猎捕的证据力受限。
      (d)制度先于威胁→威胁被制度压制(方向二的逆向因果)——找制度建立降低了外部威胁
        而非威胁催生了制度的案例。
      扫描范围:补充 round 1 未覆盖的南亚/东南亚/非洲/前哥伦布美洲/中世纪欧洲商业
      联盟案例。

    findings:
      killed: []
      absorbed:
        - candidate: "汉萨同盟(Hanseatic League, 12-17世纪)——高威胁×极高交换→低制度集中化"
          analysis: |
            汉萨同盟是北欧/波罗的海地区约70-170个商业城市的联盟,存续约500年。
            威胁水平:极高——波罗的海海盗、丹麦/瑞典/挪威/英国/佛兰德斯等王国对贸易
              路线的军事威胁和特许权争夺持续数百年。
            交换需求:极高——整个同盟的存在目的就是跨区域长途贸易,陌生人交换密度
              可能超过同期任何欧洲政体(跨语言/跨法域/跨政治边界)。
            制度复杂度(按DED-044三维度):(i)法律条文——同盟以吕贝克法为基础,但这是
              城市级法律而非同盟级成文法典,同盟裁决(汉萨议会/Hansetag)非法定约束力;
              (ii)官僚层级——无,汉萨议会是定期商人集会,无常设行政机构、无同盟级征税
              官、无同盟级军队指挥链;(iii)税收——无同盟级税收,防御费用由各成员城市
              自愿分摊。按DED-044的操作化,汉萨同盟在三维度上得分均极低。

            但汉萨同盟成功地在极高威胁×极高交换的环境中存活了500年——它解决集体行动
            的方式是:(1)经济胁迫(联合抵制/禁运)替代军事对抗,(2)分散化的城市自治替代
            中央集权,(3)退出权威胁(城市可退出同盟)替代强制征税。

            这是预测(iv)的最强力潜在反例:高威胁×高交换并未产生"超加性制度复杂度"——
            制度创新密集(商法/海上保险/会计/外交代表),但制度集中化极低。若不构成净杀,
            是因为:(a)DED-044测量的是制度"复杂度"(密度/层级)而非制度"功能性"——汉萨
            的商法创新可能在"法律条文数"维度得分不低(若将各城市商法判例汇总计算);
            (b)同盟成员城市各自是独立政体,若分析单元是"吕贝克"而非"汉萨同盟",则每个
            城市面临的威胁和交换需求需重新标度;(c)同盟最终在17世纪被领土国家(瑞典/
            丹麦/勃兰登堡)的军事-财政制度碾压——这可能反而支持方向二(领土国家的制度
            复杂度最终胜出)。
          status: absorbed_with_measurement_validity_concern
          implication: |
            汉萨同盟暴露的问题比 round 1 的易洛魁/荷兰更尖锐:易洛魁是"高威胁+低交换",
            荷兰是"高威胁+高交换+制度去集中化但商业制度复杂"——均可在现有框架内消化。
            汉萨同盟是"高威胁+极高交换+长存续期+制度集中化极低"——这直接命中预测(iv)
            的核心赌注:"双驱动量(高威胁+高交换)并存的政体,其制度复杂度高于仅由单一
            驱动量推动的政体,且差异大于各自独立效应的线性加和"。

            汉萨同盟的制度复杂度在三维度上远低于同期单一驱动量推动的政体(如仅高威胁
            的法国/普鲁士,仅高交换的意大利城邦国家),这与预测(iv)的方向相反。

            不构成净杀的理由:(1)分析单元歧义——"汉萨同盟"是否是DED-044意义上的"政体"?
            它不是一个领土国家,而是一个商业城市网络。若分析单元下移到成员城市,每个城市
            单独面临的外部威胁远低于同盟整体。这触及了 DED-044 未明确定义的"政体"边界
            问题。(2)制度替代形式——汉萨用"退出权+经济胁迫+声誉机制"替代了"官僚层级+
            中央税收+常备军",这些替代形式的制度在 DED-044 测量框架中被系统性低估。
            这个案例将 round 1 已识别的"测量框架中央集权偏向"从噪声升级为系统性关切。

        - candidate: "马拉塔联盟(Maratha Confederacy, 18世纪印度)——高威胁×中交换→制度分散化"
          analysis: |
            马拉塔联盟在18世纪面对极高外部威胁(莫卧儿帝国/阿富汗杜兰尼/英国东印度公司),
            内部交换需求中等(德干高原的贸易路线),但制度形态是去中央化的——Peshwa(首相)
            的中央权威弱,各 Sardar(酋长/将领)高度自治,税收由各地自行征收、无统一财政
            体系、无中央常备军(军队由各 Sardar 私人供养)。

            这是格(高威胁,低制度集中化)的又一个实例,说明方向二的"威胁→中央权威集中"
            并非唯一路径。与瑞士/波兰-立陶宛类似,威胁存在但集体行动走分散路径。

            不构成净杀——可归入 nontriviality_test 的备择路径格。但进一步填充了该格的
            实例密度,强化了 round 1 should④ 关于射程条件的必要性:方向二仅在特定条件下
            (既有制度基础+精英无协调抵制能力+交换需求催化)才走中央权威集中路径。
          status: absorbed_by_alternative_path_cell

        - candidate: "神罗后威斯特伐利亚(1648-1806)——高威胁+高交换→极低帝国级制度集中化"
          analysis: |
            神圣罗马帝国在三十年战争后(1648)面临持续外部威胁(法国路易十四的扩张战争/
            奥斯曼帝国),内部交换需求高(莱茵/多瑙河贸易走廊),但帝国级制度集中化持续
            走低——帝国议会(Reichstag)沦为常设大使会议,帝国法院(Reichskammergericht)
            效力衰减,无帝国级常备军(帝国战争需各邦国同意出兵),无帝国级税收。制度发展
            全部发生在邦国层面(普鲁士/奥地利/巴伐利亚各自建立军事-财政国家)。

            若分析单元为"神圣罗马帝国"→预测(iv)被公然违反(双驱动量并存→制度集中化
            极低)。若分析单元为各邦国→普鲁士等邦国的制度复杂度上升反而支持方向二。
            分析单元的选择在此案例中对结论有决定性影响——这正是"政体边界"的未定义问题。

            不构成净杀——与汉萨同盟共享分析单元歧义。但两个案例(汉萨+神罗)共同指向
            一个模式:当政治权威以网络/层级嵌套形式分布时(而非单一中央权威),DED-044
            的"政体"边界和"制度复杂度"测量在面对多层次治理体系时产生系统性模糊。
          status: absorbed_with_unit_of_analysis_concern
          implication: |
            与汉萨同盟的分析单元歧义形成呼应。建议在 DED-044 的 operationalization 中
            增加"分析单元边界"的判定标准:什么是"一个政体"?若分析单元应选择"有效行使
            税收/征兵/执法的最高层级",则汉萨同盟/神罗的分析单元应下移到成员城市/邦国
            ——此时预测(iv)可能反而被两个案例支持(各单元单独面对的威胁更局部化)。

    hunt_verdict: |
      本轮独立猎捕新增三个候选案例,均未猎到 scope 内净杀反例。所有候选案例均可被
      现有框架消化或暴露测量/分析单元歧义:

      - 汉萨同盟→最接近净杀的挑战(高威胁×极高交换→低制度集中化),但分析单元歧义
        ("汉萨同盟"是否是 DED-044 意义上的"政体"?)阻止了净杀裁决。暴露了"制度复杂度"
        测量框架的系统性中央集权偏向——这不是孤立噪声,而是在多层次治理体系中反复出现
        的测量有效性问题。
      - 马拉塔联盟→填充备择路径格,强化 should④ 射程条件的必要性。
      - 神罗后威斯特伐利亚→分析单元歧义的另一实例。"帝国级"vs"邦国级"的制度复杂度
        截然相反,分析单元的选择决定了案例是支持还是违反预测(iv)。

      与 round 1 发现合并看,总共 9 个候选案例,0 个净杀,被消化/边界/测量关切共同指向
      的不是方向二因果链本身的虚假,而是:(1)制度复杂度的测量框架存在中央集权偏向,
      在多层次治理体系中产生系统性低估;(2)方向二的适用范围需要显式射程条件(既有制度
      基础+精英协调方向+交换需求门控);(3)预测(iii)的经验风险因"威胁撤除"条件过于
      严苛(anti-talisman禁令b)而趋近于零——这在认识论上不致命但削弱了预测(iii)作为
      独立经验 corroboration 的信息量。

