    - |
      【should·红旗10·射程条件】在 primary_suspect 中补充方向二的射程条件,将推论从
      "通用因果"精确化为"条件因果"。基于 round 1+round 2 合计 9 个候选案例的发现,
      至少需覆盖:(a)既有制度基础阈值——方向二的"威胁→催生制度"在既有制度基础超过某
      最低水平时激活,低于该阈值时高威胁可能触发制度崩溃/碎片化(加洛林/后罗马不列颠);
      (b)精英协调方向——外部威胁引发的集体行动不必然朝向"让渡自由给中央权威",当精英
      协调成本低且对内部掠夺(DED-012坐寇化风险)的恐惧大于对外部掠夺的恐惧时,集体行动
      可能朝向"抵制中央权威集中"(波兰-立陶宛/马拉塔联盟);(c)交换需求作为门控变量——
      当内部交换需求低于某阈值时,即使威胁极高,制度路径也可能不被激活(瑞士/日耳曼部落/
      草原游牧)。这三个射程条件将使 direction 二的适用范围从"普遍适用"变为"在满足条件
      ABC 的政体中适用",提升理论的精确性和可证伪性。同 round 1 should④。

