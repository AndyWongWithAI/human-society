    (5) real_world_anchors 已加诚实标注（L191-196），说明充分条件路径局限+苏联 anchor 混杂。
    修复均为实质内容增量而非敷衍措辞调整——round_1 的三条 required 已完全消解。

    本轮逐条红旗重攻 + 独立反例猎捕后,核心结论:推论的非平凡增量真实且可证伪,承重砖和 THEOREM
    均不含 M1（受害叙事）、M2（道德创业者）、M1+M2 合取必要性、社会层方向不对称——
    增量收窄后仍足够支撑一条 L3 推论。反例猎捕四路均未获净杀。未重蹈 DED-004/007。

    然而本轮发现了三个 round_1 未充分暴露的问题,均属 should 级（不影响 verified 但挡在"强 verified"
    门前——不影响推论成立,但影响推论在实战中的证伪韧性和跨理论区分度）:

    (a) M1 构念边界过于宽松→可被 retroactively 识别于几乎所有成功道德变迁中,削弱 discriminant
    validity。判断标准:"受害叙事"与"利益集团倡导"之间的边界在操作化中仅依赖"是否被广泛认可为
    '受害'"——但这本身是道德标准通胀的结果而非独立前因。举例:禁烟运动中的"二手烟受害者"——此叙事
    出现前,人们不认为"旁边有人吸烟"构成道德伤害;叙事出现后,它才被识别为受害。M1 在此不是独立
    驱动量,而是道德标准变化本身的概念重构。→ should:在 operationalization 中区分"事前客观伤害
    可独立确证"与"事后叙事重构为伤害"两类 M1,仅前者满足 anti-talisman 的独立测量要求。

    (b) PHY-001 从物理熵增到社会道德系统的跃迁缺少 bridge。推论将热力学第二定律直接应用于"道德
    结构的熵增方向",但社会系统不是孤立热力学系统:社会规范有记忆（文本、制度、仪式）可长期
    对抗衰减;有专门化维护机构（宗教权威、法律系统）持续注入维护能量——这些机制的"维护能量"与
    PHY-001 的物理熵增在概念上不是同一量纲。THEOREM-moral-internalization Corollary 1 给的
    个体层"建立慢/瓦解快"是更可靠的微观基础;PHY-001 在此是启发式类比而非科学推导。→ should:
    在 derivation step 3 中标注"PHY-001 提供方向性概念框架;可操作的实证不对称锚定于 THEOREM
    的微观不对称+ M3/M4 独立测量,不依赖于热力学隐喻的精确成立"。

    (c) excluded_outcome #3 的操作化判据（已补）在实践中可能两面刃:许多重大道德变迁同时具有
    法律推力和道德推力（如民权运动有社会运动+立法双重渠道）。当法律与社会运动同时在场,按判据应
    判为"法律驱动"还是"道德驱动"? 若按"变化前后非法律社会惩罚频率是否独立变化"判——民权运动中
    社会惩罚（排斥种族主义者）在立法前后均有独立变化→应判为道德驱动,正确。但若将此判据严格
    应用于模糊案例（如反吸烟立法——法律惩罚与社会惩罚几乎同步上升）,区分将依赖判断者的理论
    忠诚度。→ should:在 excluded_outcomes #3 中增列一个"混合驱动"处理规则（判为道德驱动的充分
    条件是 social sanction change 独立于 legal sanction change,非必须 legal sanction 缺席）。

    三条 should 均不伤及推论的可证伪骨架——falsifiability (a)(b)(c) 依然在逻辑上可被独立反例推翻,
    anti-talisman 防线在位,M3/M4 结构锚提供了独立于 DV 的测量基础。推论的核心贡献（四个机制
    整合为统一方向动力学 + 通胀需要推力而紧缩不需要的不对称）是真经验增量,不在任何已有实体中。
    → verified。

  red_flag_findings:
    brick_conclusion: |
      【未命中——round_1 修复后砖层+THEOREM 层全覆盖比对,核心增量仍在】。

      复查三块承重砖原文:
      - BR-L2-014（代价第三方惩罚）:证实 TP 跨文化存在且需付出代价。不含 M1/M2/合取/不对称。
      - BR-L2-018（旁观者利益关联）:TP 强度随利益占比单调变化。不含 M1/M2/M4/合取/阈值/不对称。
      - BR-L2-019（道德内化发育窗口）:P2+P3 给出内化维持条件+青春期窗口。不含 M1/M2/M3/合取/不对称。

      复查两个 THEOREM（round_1 的核心发现——nontriviality_test 此前漏检）:
      - THEOREM-moral-third-party-enforcement Corollary 2:已给个体层阈值（"个体收益<个体成本→
        TP 不可持续"）。DED-025 增量=推至社会层 M3 通道。此增量已在 round_1 修复后显式标注。
      - THEOREM-moral-internalization Corollary 1:已给个体层能量不对称（建立慢/瓦解快）。
        DED-025 增量=将微观不对称推至社会层方向论断。已在 THEOREM 差额表中标注。
      - THEOREM-moral-internalization Corollary 2:已给代际道德变迁框架。
        DED-025 增量=将代际变迁定位为"熵增默认"正式通道(M4)+与 M1-M3 整合。

      THEOREM 先占物收窄后,DED-025 独家增量五条:
      (a) M1（受害叙事涌现）——全新,不在任何 L1/L2 实体。
      (b) M2（道德创业者）——全新,不在任何 L1/L2 实体。
      (c) M1+M2 合取必要性（缺一堵死）——全新。
      (d) 社会层方向不对称（通胀需要集中能量/紧缩是熵增默认）——部分新（THEOREM 有个体层微观
          但无社会层宏观主张,PHY-001 在此应用是 DED-025 独家）。
      (e) M1-M4 四机制统一方向动力学框架——整合本身是新的。

      五条中 (a)(b)(c) 是全新的经验主张,(d) 是微观→宏观的非平凡推广,(e) 是整合贡献。
      → brick=conclusion 在完整 depends_on 链层面不命中。核心增量足以支撑一条 L3 推论。

    nontriviality_cell_check: |
      【通过——空格预测非平凡,且不被砖/THEOREM 强制】。

      2×2 判据表在 round_1 修复后已包含完整 THEOREM 先占声明,空格逻辑复核:
      - 通胀×无推力→预测标准不变（空）。三块砖均不禁止标准自发收紧（BR-L2-018 只说 TP 随利益
        占比单调,不设"无 M1+M2 时标准必不变"的禁令;BR-L2-019 只说内化依赖对等性信号+窗口,
        不禁止无 M1+M2 条件下的标准上调）。两个 THEOREM 同样不禁止——Corollary 2 只定义 TP
        不可持续的个体条件,不涉及社会层标准在没有叙事/创业时是否可变。→ 空格可被反例填充,非空
        可满足,非平凡。
      - 紧缩×无推力→预测标准仍松绑（非空）。此格预测"紧缩不需要推力"——是三块砖+两个 THEOREM
        均不做的方向性主张。THEOREM Corollary 1 的"建立慢/瓦解快"是个体层能量方向,不能直接翻译
        为"社会层面紧缩不需要任何推力"（社会层可能存在聚合维护机制如制度/仪式/文本传承抵消个体层
        衰减）。→ 空格非平凡。

      本轮额外检查:空格①（通胀×无推力=空）的实践证伪窗口。虽已在 round_1 中讨论"自然证伪机会
      稀缺",但经本轮仔细构造后认为:该空格在人类学尺度并非不可检验——小规模社会（Dunbar 数以下）
      中的道德标准变化可提供更干净的检验场（无大众媒体/无专业倡导者职业的 setting）。推论适用
      区间注明"群体规模≥3 且存在稳定规范",不排除此类小规模社会。→ 空格证伪在概念层成立,在
      操作层可通过跨文化比较（尤其是对小规模社会的人种志研究）实现。

    measurement_orthogonality: |
      【主干正交——IV 的结构锚提供独立测量基础,行为测量层重叠是因果链中间环节非概念焊死】。

      本轮复核 round_1 已标注的 M3/M4 行为测量与 DV 的通道重叠:
      - M3 测量(b) "TP 行为频率纵向下降" vs DV 测量(c) "惩罚严重度纵向追踪"——共享"可观测
        惩罚行为"通道。
      - M4 测量 "内化深度下降（IAT/GSR）" vs DV 测量(b) "公众道德谴责广度评分"——内化深度
        下降可导致谴责广度下降,属因果链而非测量混同。

      关键防线:M3 的结构锚（利益占比稀释倍数计算）和 M4 的结构锚（发育窗口期对等性信号测量）
      提供独立于 DV 的 IV 测量基础。只要这两个结构锚在位,即使行为测量通道有重叠,IV 的测量
      轴也不与 DV 焊死——这是 DED-007 与本案的本质区别:DED-007 的分母用"实际获授者"使 IV
      定义本身依赖 DV;DED-025 的结构锚在概念上先于且独立于 DV。→ 未命中 DED-007 级硬焊死。

      round_1 的 should awareness（在 operationalization 中标注通道重叠）未被纳入 author response
      修复清单——作者仅修了 required_fixes 列表中的五条。此遗漏不升级为 required:重叠在因果链
      中间环节层面而非构念定义层面,结构锚已提供独立测量防线。→ 维持 should awareness,不影响 verified。

    scope_hook_independent_of_result: |
      【合规——round_1 修复后 excluded_outcome #3 已有操作化判据,但混合驱动边界欠清晰】。

      excluded_outcomes 三条逐条复查:
      (1) 排除绝对速度预测——事前结构限定,非事后免疫。→ 合规。
      (2) 排除领域选择预测——诚实标注域外因子。→ 合规。
      (3) 排除法律驱动的标准变化——round_1 修复后已补操作化区分判据:"法律驱动=标准收紧的主要
      执行渠道为制度化法律制裁...判断依据:变化前后,该行为的非法律社会惩罚频率是否发生了独立于
      法律惩罚频率的变化。"此判据可事前判断（不依赖于 M1/M2 是否在场）。→ 合规（修复到位）。

      本轮发现的遗留问题:判据在混合驱动场景（法律+社会运动同时推动标准变化）中的分类规则未定义。
      民权运动案例:社会惩罚频率在立法前后均有独立变化→按判据应判为道德驱动（正确）。但若出现
      更模糊的案例（如反吸烟:社会惩罚在立法后上升,且无法区分是法律信号带动还是社会自发）,
      判据的实操刚性不足。→ should:在 excluded_outcomes 中增补"混合驱动"处置规则（见 verdict_note
      的 (c) 条）,不升级为 required——判据骨架已在位,只需补边缘规则。

    criterion_tier_match: |
      【未命中——连续量做方向预测,无 DED-006 式分档失配】。

      DV（道德标准严格度=行为类别数×惩罚强度）为连续谱。预测均为方向性（sign）或比较静态:
      (i) M1 或 M2 缺失→通胀被堵（离散堵/不堵）;(ii) M3 或 M4 激活→标准松绑（方向）;
      (iii) M3+M4 同时→加速（比较静态）;(iv) 启动成本不对称（比较静态）。
      IV（M1-M4）均为连续指标。连续 IV → 方向/离散预测——无 DED-006 式连续量二分失配。→ 合规。

    anti_talisman_cashed: |
      【纸上在位——结构锚概念层干净,田野可得性仍是实操瓶颈但不伤及原则】。

      本轮独立的 anti-talisman 压力测试:

      (a) M3 结构锚（利益占比稀释计算）——概念层干净（群体规模扩张前后的个体利益占比可独立计算,
      不依赖"标准是否已松"的结果）。实操层:历史案例的利益占比精确定量几乎不可行,但跨文化比较
      中可用"群体规模"作为利益占比的粗略代理（Danbar 数以下→利益占比高→M3 未激活;大规模社会→
      利益占比低→M3 潜在激活）。→ 代理有效性有限但 non-zero——不构成 anti-talisman 违约。

      (b) M4 结构锚（发育窗口期对等性信号测量）——概念层干净（需纵向数据,不依赖成年后行为）。
      实操层:历史数据的纵向队列比较需要 creative 代理（移民回忆/同期队列对比/叛逃者叙述）。
      → 同 M3——代理在概念上独立于结果但精确度受限。

      (c) M1 独立测量锚——本轮重点关注。M1 操作化说"媒体框架分析+公众舆论调查。独立于结果:
      不因标准确实变严了反推叙事必定成功"。但"受害叙事"的出现与"道德标准变化"在时间上的先后
      关系在实践中难以厘清:媒体提高受害标签使用率本身可能正是道德标准已在松动的早期信号,而非
      独立前兆。这不是 anti-talisman 书面违约（文件已禁反推）,而是测量层的构念有效性问题——
      M1 的"受害叙事涌现"是否能与"道德标准开始变化"在测量上分离? → 这打开了一个 should 级关切
      （见 verdict_note (a)）,但不到 required——因为用事前确定的媒体档案编码规则+盲法评分,
      可以部分缓解时间先后混淆。

      综合:两条结构锚（M3 利益稀释/ M4 发育窗口对等性信号）在概念层提供了真正的独立测量;
      M1 的独立测量在概念层要求了但在实操层有反向因果风险。anti-talisman 书面成文有力,
      实操纪律依赖研究者自律+预注册→不低于 L3 推论的一般标准。→ 合规。

    anchor_fact_check: |
      【无致命事实错——三个 anchor 方向正确,诚实标注已加,但均为 post-hoc illustration 非
      pre-registered test】。

      本轮独立事实核查:
      (1) 美国民权运动:M1（种族隔离伤害叙事 via Brown v. Board + Emmett Till + Birmingham+
      Selma 媒体图像）事实无误。M2（MLK+SNCC 超额投入——被捕/受伤/被杀远超个人利益）事实无误。
      通胀签名（隔离合法→隔离不道德,约 14 年集中投入）方向正确。→ 支撑强。

      (2) 苏联解体后俄罗斯:M3（国家 TP 瓦解→不再惩罚腐败/日常违规）方向正确。M4（1990 年代
      青春期窗口+对等性信号断裂→腐败规范松动）方向正确。round_1 修复后已诚实标注混杂因素
      （经济休克疗法 1992+西方文化涌入+制度真空）→ 因果归因不再过度声称。→ 方向性支撑,多因
      混杂已标注。

      (3) 动物权利运动:M1（Singer 1975+动物受苦叙事）事实无误。M2（PETA 等超额投入）方向
      正确。→ 支撑强。

      三个 anchor 共同特征:均展示"M1+M2 在场+通胀发生"（充分条件路径）,不直接检验"M1+M2
      缺席→通胀被堵"（必要条件路径）。round_1 修复后已在 supporting 段末尾诚实标注此局限。
      → 合规（"找不到反例"是必要条件检验的弱形式——在"任一重大道德变迁都可被 arguable 追溯到
      某种叙事和倡导者"的领域,not finding counterexamples IS evidence, just weak evidence）。

    definition_vs_prediction: |
      【通过——关键条件均有独立于结果的操作化定义】。

      本轮逐变量复核:
      - M1:通过媒体框架分析（叙事前后受害标签率变化）+ 舆论调查。不由"标准变严"反推。
      - M2:通过核算倡导者成本/时间 vs 个人预期收益上限。不由"通胀成功"反推。
      - M3:通过利益占比稀释计算（结构锚）+ TP 行为频率下降（行为锚）。不由"标准松了"反推。
      - M4:纵向队列内化深度比较 + 发育窗口期对等性信号测量。不由"新一代更松"反推。
      - DV:法律/习俗编码+公众舆论+惩罚追踪。不由 M1-M4 反推。

      可证伪条件复核:
      (a) 无 M1+无 M2 条件下显著通胀→M1+M2 合取被推翻。逻辑上可被独立反例推翻。
      (b) 无 M3 激活+无 M4 激活条件下显著紧缩→"紧缩不需要推力"被推翻。逻辑上可被推翻。
      (c) 紧缩启动成本与通胀无统计差异→核心不对称被推翻。逻辑上可被推翻。
      三个条件均给出独立于理论术语的操作化判断标准。→ 合规。

      M1 的构念边界关切（见 verdict_note (a)）属于 discriminant validity 精细度问题,不改变
      "M1 在定义上独立于结果"这一判断——M1 的测量工具（媒体框架+舆论）在原则上可独立于结果施用,
      实操的时序混淆可通过研究设计（pre-registered coding scheme, blind rating）缓解。→ 不升级。

    enumeration_and_species: |
      【通过——M3+M4 不声称穷举紧缩通道,两路猎击可被现有框架消化】。

      推论声明紧缩通过 M3（TP 瓦解）或 M4（代际内化断裂）发生,析取关系（任一激活→紧缩）。
      此声明是机制描述——"M3 和 M4 是紧缩的通道"——而非穷举声称"只有 M3 和 M4 能导致紧缩"。
      文件措辞:"紧缩方向（变松）:M3...M4..."——未写"仅由"或"穷举为"。

      round_1 猎击的两路（经济激励替代、认知框架替换）均可被消化:
      - 经济激励替代:可被 M3 的宽解释（"合作结构中利益占比变化"——不限定稀释方向,替换也是变化
        的一种）消化。
      - 认知框架替换:落入 discriminant_validity 中已标注的"规范替换 vs 规范紧缩"边界——新规范
        挤走旧规范属于 M1+M2-like 的积极过程,非 M3+M4 的熵增通道。

      不构成 DED-008 式穷举破口（无 unsuspected 第 N+1 类净杀）。→ 合规。

    primary_suspect_aim: |
      【指对了——自认最弱腿（不对称+合取必要性）准确;本轮增识两条隐腿但均不致命】。

      文件自认三条 suspect 经本轮独立复核:
      - primary_suspect "不对称——紧缩不需要推力":正确。若紧缩系统性地需要 M1+M2 对称的推力,
        推论退化为"道德会变松也会变严"的常识。禁酒令废除的消化逻辑（弹回vs自发紧缩）在本轮
        独立审查中成立——强制通胀的撤销速率（13年）远快于通胀建立（~80年）→方向符合不对称预测。
      - secondary_suspect "M1+M2 合取必要性":正确。若退为析取→通胀条件过于宽松→理论预测力
        大幅缩水。本轮反例猎捕未找到 scope 内净杀反例。
      - unlikely_suspect "M3+M4 各自独立贡献":正确——结构冗余为推论提供韧性。

      本轮新识别的两条隐腿（均不达 required）:
      (a) M1 构念边界宽松——"受害叙事"可被 retroactively 识别使 M1+M2 合取在实践中近乎
      "总是成立"→削弱 discriminant validity。→ should（见 verdict_note (a)）。
      (b) PHY-001 从物理到社会的跃迁缺乏 bridge——热力学隐喻可能在跨学科审稿中受攻击。
      → should（见 verdict_note (b)）。

      平凡化检查:抽掉 (a) M1 (b) M2 (c) M1+M2 合取 (d) 社会层不对称后,DED-025 退化为
      "道德会因 TP 消退和代际内化断裂而松动"——已在 THEOREM 层覆盖,非平凡。推论的非平凡性
      完全依赖于上述四条增量→自认的 suspect 准确覆盖了最脆弱链条。

  counterexample_hunt: |
    本轮独立构造四路猎杀,每路针对一个核心主张,与 round_1 猎路不重复:

    === 猎路 1:攻击 M1+M2 合取必要性——寻找 "无显著 M1 + 无显著 M2 却有通胀" 的干净案例 ===

    【靶心 1:学术抄袭规范的收紧（1980s-2020s）】
    1980 年代前,学术抄袭多 informal 处理;2020 年代已成 career-ending 的道德红线。通胀幅度显著。
    M1（受害叙事）:被抄袭的学者作为"受害者"——但此叙事从未成为公共道德议题的焦点,学者个体
    投诉分散、无组织化的受害叙事运动。M2（道德创业者）:大学行政人员建立 honor code + 审查
    机制——但他们是在履行 institutional role,投入是否>个人收益? 行政人员的声誉收益（"我的
    大学学术诚信好"）可能是其职业激励的一部分——成本未必>个人收益。
    消化口:M1 可被 arguer 为"学术界整体的诚信声誉受到了剽窃者的伤害"——"学术界"作为受害者;
    M2 可被 arguer 为某个早期推动正式学术诚信政策的教务长是道德创业者。本案的模糊性恰揭示了
    M1/M2 构念边界宽松的问题——retroactive identification 几乎总是可能的。
    结论:未净杀（可被消化）,但暴露了 M1 构念的 discriminant validity 弱点。

    【靶心 2:职业安全规范的道德化（1970s-2000s）】
    工作场所安全从"劳资合同问题"变为"雇主道德义务"。通胀显著。
    M1（受害叙事）:因工致死/致残的工人——有受害叙事（工会推动+调查报道），M1 在场。
    M2（道德创业者）:工会领袖+劳工权益律师+某些政治家。但工会的"超额投入"是否>个人收益?
    工会领袖的职位和声望来自于为会员争取利益——这是 their job。若将其定性为 M2,则几乎所有
    trade association advocacy 都可算 M2——构念将失去 discriminant power。
    消化口:M2 定义要求"成本>个体收益",工会领袖的个人收益（薪资+声望）可能低于其投入（长期
    抗争/法律风险）,尤其早期在 hostile political environment 中推动劳工权益——可 count 为 M2。
    结论:未净杀。但本案展示了"M2 边界判定"对理论免疫情景的敏感性——调整"个人收益估算"
    的 generousness 可改变一个案例是否被计为 M2。

    === 猎路 2:攻击 "紧缩不需要推力" —— 寻找需要显著推力的紧缩案例 ===

    【靶心 3:决斗规范的消亡（19 世纪欧美）】
    决斗在 1800 年代初期广泛被接受（尤其在美国南方和欧洲贵族中）,到 1900 年基本消亡。
    这是显著紧缩（old standard relaxed→dueling no longer mandatory for honor）。
    M3（TP 瓦解）:旁观者是否停止惩罚"拒绝决斗的人"? 实际上,反决斗运动（anti-dueling
    societies+教会谴责+法律禁止）主动推动了对"拒绝决斗者"的去污名化——这不是 TP 被动瓦解,
    而是积极的反叙事（"拒绝决斗是文明的,不是懦弱的"）替代了旧规范。M4（代际遗忘）:新一代
    未内化决斗规范——但这是因为 anti-dueling 的积极教育+法律威慑,而非"对等性信号自然断裂"。
    此案紧缩方向有显著推力（anti-dueling societies+立法运动+教会）——但这些推力更像是"拆除
    旧标准的积极工程"而非"通胀方向的新标准建设"。推论可在 2×2 表中消化为"紧缩×有推力"格
    （加速但不改变不对称方向）。
    消化口:"紧缩×有推力"格允许推力加速紧缩,不推翻"无推力时紧缩也能发生"的核心不对称。
    真正的挑战是:能否找到"纯无推力紧缩"的正面证据? 如果大多数紧缩案例都伴随着某种形式的
    推力（如反决斗运动）,则"紧缩是默认状态"的声称缺少正例——它只能靠"没有反例"来间接支持。
    结论:未净杀——落入"紧缩×有推力"格。但揭示了推论的经验基础不对称:通胀方向有充分的
    "M1+M2 在场"正例,紧缩方向缺少"纯 M3+M4 驱动、无任何推力"的干净正例。→ should awareness。

    【靶心 4:裹脚习俗在中国消亡（1880s-1940s）】
    裹脚从"道德义务"变为"落后陋习",紧缩显著。
    此案有显著推力:反裹脚运动（传教士+改革知识分子+政府禁令）——又是"紧缩×有推力"格。
    但值得追问:如果没有反裹脚运动,裹脚会自然消亡吗? 工业化使女性需要 unbound feet 进入
    工厂——经济必要性可能独立驱动紧缩。但这是经济渠道（非 M3 非 M4）,与 round_1 猎击的
    "经济激励替代"同构。
    结论:未净杀。经济结构变迁作为道德变化的独立驱动量,不在 DED-025 的 M1-M4 框架内——
    这不是理论错误,而是理论射程边界（DED-025 只覆盖社会机制驱动的方向变化,不覆盖经济/
    技术驱动的结构变化）。→ 边界标注问题,不构成反例。

    === 猎路 3:攻击 M1 测量独立性 —— 检验 "受害叙事涌现" 能否与 "道德标准开始变化" 在时间上分离 ===

    【靶心 5:#MeToo 运动（2017-）】
    性骚扰/性侵的道德标准在 #MeToo 后显著收紧。M1 的"受害叙事涌现"在何时发生?
    - 若答"2017 年 Weinstein 案曝光后"→M1 与道德标准变化几乎同时发生（w/in months）,
      M1 不是独立前兆而是标准变化的同步现象。
    - 若答"更早的 feminist consciousness-raising（1970s-）"→M1 在数十年间慢慢积累,
      但为何通胀在 2017 年而非 1987 年发生? M1 单独无法解释 timing——需要 auxiliary
      hypothesis（如社交媒体降低了 coordination cost）。
    这不对 M1 构成反例,但暴露 M1 作为"驱动量"的粒度问题:如果将 M1 定义为 long-term
    cultural shift（数十年跨度的叙事积累）,M1 的"激活"时刻无法精确标定→对"何时通胀发生"
    的预测力减弱。如果将 M1 定义为 acute event（如 Weinstein 曝光）,M1 与结果的时间
    间隔过短→无法排除"M1 是结果的早期信号而非独立原因"的替代解释。
    结论:未净杀——M1 阈值粒度是操作化而非逻辑问题。→ should awareness（与 verdict_note
    的 (a) 条对齐）。

    === 猎路 4:攻击 PHY-001 应用到社会道德系统的合法性 ===

    不构造具体历史案例,而是一次概念攻击:热力学第二定律适用于封闭物理系统;社会道德系统不是
    封闭的（持续有外部信息/能量输入）、不是物理的（熵无法用 joules 量度）、不是平衡态系统
    （远非热力学平衡）。将 PHY-001 用于社会系统的"结构退化需要能量对抗"是隐喻,非科学推导。

    但这不等于论断错误——隐喻的真值不取决于物理精确性,而取决于其预测对社会现象的拟合度。
    且 THEOREM-moral-internalization Corollary 1 已给出方向相同的微观机制（"内化建立慢/
    瓦解快"——月/年 vs 天/周）——此为 DED-025 不对称提供了不依赖热力学隐喻的实证锚点。
    结论:PHY-001 不会导致推论被物理学家 reject——其功能是概念框架,后果由 THEOREM 层
    微观锚点兜底。→ should:标注 PHY-001 在此的"启发式"定位（见 verdict_note (b)）。

    综合:四路猎杀（分别攻击合取必要性/紧缩不需推力/M1 测量独立性/PHY-001 隐喻合法性）
    均未获 scope 内净杀反例。核心结构（M1+M2 合取+社会层方向不对称）未被任何一击动摇。
    三条 should 关切来自猎路暴露的 boundary/operationalization 弱点,非来自净杀反例。

  non_recurrence_of_ded004_007: |
    DED-004（不可证伪循环）:【未复发,但有一 DED-004-adjacent 关切——should awareness】。

    逻辑层:falsifiability (a)(b)(c) 给出三个可被独立反例推翻的条件,空格不被砖/THEOREM 平凡
    强制,四个机制均可独立于结果测量（至少概念层）。→ 非 DED-004 式逻辑不可证伪。

    实操层两个免疫模式（继承自 round_1 分析+本轮加剧）:
    (i) "法律驱动消化":任何看似无 M1+M2 的通胀可被 excluded_outcome #3 消化（"那是法律驱动"）。
    round_1 修复后已补操作化区分判据,消化不再是无门槛的——需要独立证明 legal sanction change
    主导。→ 防线加固,不构成 DED-004 循环。
    (ii) "M1+M2 总是可被 retroactively 识别":本轮猎路 1 的 2 个靶心（学术抄袭+职业安全）均显示
    M1+M2 可被 arguer 在几乎所有成功道德变迁中识别——这意味着 falsifiability (a)（无 M1+无 M2
    条件下的通胀）的条件在实践层面极难满足,不是因为条件本身不可满足,而是因为 M1/M2 的构念边界
    宽松使得任何案例都能被 argue 为"有某种形式的 M1 和 M2"。→ 这是 DED-004-adjacent——
    不是逻辑不可证伪,而是构念宽度导致的实践免疫。处理:升级为 should（见 verdict_note (a)）,
    要求区分"事前客观可确证的受害叙事"与"事后叙事重构的受害叙事",收紧 M1 的 discriminant
    validity。不升级为 required——因为用 stricter 构念操作性+预注册编码规则,可以恢复证伪能力。

    DED-007（焊死测量轴）:【未复发】。

    结构锚（M3 利益占比稀释/ M4 发育窗口对等性信号）在概念上先于且独立于 DV。IV 的测量轴
    不与 DV 焊死——与 DED-007（分母用"实际获授者"→IV 定义依赖于 DV）性质根本不同。
    anti-talisman_clause 双向禁反推在位。M3/M4 行为测量层重叠是因果链中间环节,非构念定义
    的焊死。→ DED-007 未复发。

