id: ADV-REVIEW-031
type: adversarial_review
reviews: DED-025
layer: L3-deductions

人话摘要: |
  对 DED-025（道德标准通胀-紧缩：通胀靠叙事+创业者推，紧缩靠放手——旁观者不管+新一代不内化，
  紧缩是默认状态）的 round-1 独立对抗审查。裁 needs_revision——核心不对称（通胀需要推力/紧缩不需
  要）是真实的非平凡增量,不在任何 L1/L2 实体中,但 nontriviality_test 漏检了 depends_on 链中的
  THEOREM 先占（M3 阈值+能量不对称已在 THEOREM Corollary 中）,导致增量被高估+ attribution 有误。
  三条 required（2 条 attribution 修正 + 1 条边界操作化）+ 两条 should 挡在 verified 门前。
  反例猎捕未获净杀。未重蹈 DED-004/007。

target: DED-025
protocol: |
  Rule B 独立对抗审查（作者≠审查者,全新独立上下文,与作者及前几轮审查者无关）。评分卡红旗 10 条
  逐项攻 + 反例猎捕（判 verified 前必做）+ DED-004（不可证伪循环）/DED-007（测量轴焊死）复发检查。
  裁决三态照评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活反例③不重蹈
  DED-004/007。

round_1:
  reviewer: "独立子 Agent（round 1, 全新独立上下文, 与作者及前几轮审查者无关）"
  verdict: needs_revision
  verdict_note: |
    这是一条【骨架部分来自 THEOREM、但核心增量（M1+M2 合取必要性 + 社会层面的方向不对称）是真经验
    主张、nontriviality_test 不完整 + attribution 有误】的候选。推论的核心贡献——道德标准通胀需要
    两种特定主动推力（受害叙事 + 道德创业者,合取）,而紧缩是熵增默认状态（M3旁观者执行消退 + M4代际
    内化断裂,析取）——不在任何一块承重砖中,也不在 THEOREM 的命题层（THEOREM 只描述个体层机制条件,
    不做"社会层面标准变化的方向不对称"论断）。

    然而三个结构性缺陷挡在 verified 门前:

    （1）【nontriviality_test 漏检 THEOREM——claimed delta 被高估 + attribution 有误（required）】
    文件 nontriviality_test 只比对 BR-L2-014/018/019,声称二维判据表空格（通胀×无推力=空;紧缩×
    无推力=非空）和不对称（通胀需要推力而紧缩不需要）"不在三块承重砖任何一处"。但当我把 depends_on
    链中的 THEOREM-moral-third-party-enforcement 和 THEOREM-moral-internalization 纳入比对时:
    - THEOREM-moral-third-party-enforcement Corollary 2（推论2）:"当个体收益低于个体成本时,
      第三方惩罚不再是个体层面的可持续策略"——这恰好是 DED-025 derivation step 1 声称"本推论补充
      当利益占比越过个体成本阈值时,TP 瓦解至非系统性水平"的阈值主张。BR-L2-018 给了单调关系,
      但阈值不是 DED-025 首创——THEOREM Corollary 2 已给出。
    - THEOREM-moral-internalization Corollary 1（推论1）:"内化的建立速率远慢于瓦解速率。
      建立需要反复的稳定暴露（月/年级）,瓦解可以在数次观察到对等性断裂后触发（天/周级）"——
      这恰好是 DED-024 审查中已讨论的能量不对称,DED-025 同样引用此方向性但将其作为不对称论证
      的一部分。THEOREM 已给出个体层能量不对称,DED-025 的增量是将此不对称从个体层推到社会层。
    - THEOREM-moral-internalization Corollary 2（推论2）:"代际道德变迁——不同对等性信号→
      不同的内化内容"——这给出了 M4 的整体框架,DED-025 的增量是将其作为"熵增默认"的正式通道
      并与其他机制整合。

    DED-025 的真实独家增量收窄为:
    （a）M1（受害叙事涌现）——不在任何 L1/L2 实体中,全新。
    （b）M2（道德创业者）——不在任何 L1/L2 实体中,全新。
    （c）M1+M2 合取必要性（缺一堵死）——全新,不在任何实体。
    （d）社会层面的方向不对称（通胀=对抗熵增需能量,紧缩=熵增默认不需推力）——部分新。
        THEOREM 有微观不对称（建立慢/瓦解快）,但没有"社会层面标准方向必须由推力/熵增驱动"
        的宏观主张。PHY-001 在此的应用是 DED-025 的独家贡献。
    （e）四条机制整合为一个统一的方向动力学框架——整合本身是新的,不在任何单一实体。

    这五条增量分量足够支撑推论的非平凡性——M1+M2 合取+社会层不对称是真贡献。但 derivation step 1
    声称 M3 阈值是"本推论补充"在事实层面有误（THEOREM Corollary 2 已给出）,需修正 attribution。
    derivation step 3 声称"不对称不在 BR-L2-014/018/019 任何一处"为真但仅比对 bricks——
    应在 nontriviality_test 中补一段 THEOREM 先占声明,诚实收窄真实 delta。→ required

    （2）【M3 阈值 attribution 有误——衍生自 THEOREM 非 DED-025 独创（required）】
    Derivation step 1:"BR-L2-018 本身不声称'TP 会瓦解到零',它只给出单调关系——本推论补充
    '当利益占比越过个体成本阈值时,TP 瓦解至非系统性水平'。"但 THEOREM-moral-third-party-enforcement
    Corollary 2 原文:"当个体收益低于个体成本时,第三方惩罚不再是个体层面的可持续策略"——
    这不仅是"不再可持续",而且在推论 2 的上下文中明确指代规模增长导致 TP 需要专门化执行机构接管
    的结构性转变。DED-025 的"瓦解至非系统性水平"与 THEOREM 的"不再是个体层面的可持续策略"共享
    同一个核心理念（越过成本阈值→TP 瓦解）,方向一致。DED-025 的真正增量仅是将此个体层命题推及
    "社会层面——M3 作为紧缩的系统性通道",而非发明阈值本身。宜修正 derivation step 1 的措辞:
    改为"THEOREM-moral-third-party-enforcement Corollary 2 已给出个体层阈值——本推论将其推至
    群体层,论证当社会规模持续增长使该阈值被系统性越过时,TP 瓦解从个体现象升级为社会层面的紧缩通道"。
    → required

    （3）【PHY-001 应用从物理到社会的跃迁——衍生 gap 未标注（should）】
    Derivation step 3 用 PHY-001（热力学第二定律——不维护→结构退化）直接类比社会道德系统:"通胀=
    结构构建（新规范的建立和扩散=从低秩序到高秩序=对抗熵增）→需要能量输入。紧缩=结构退化（规范
    维护停止→向着更高熵状态回落=熵增）→不需要专门输入能量。"但 PHY-001 本意是物理系统的熵增;
    社会系统是否严格服从同一形式的热力学约束,不是 trivial 的——需要论证"道德结构"在什么意义上是
    一个"低熵状态"、其"熵增"边界条件是什么。THEOREM-moral-internalization Corollary 1 已给出
    个体层能量不对称（建立慢/瓦解快）作为更可靠的微观基础;PHY-001 在此是宏观层面的隐喻性延伸。
    推论的文件诚实度宜标注:PHY-001 提供的是概念框架（"熵增方向"的类比）,实证层面的可操作不对称
    锚定于 THEOREM 的微观不对称+ M3/M4 的独立测量而非 PHY-001 本身。→ should

    综合:非 rejected（核心增量属实、反例猎捕未净杀、无 DED-004/007 致命循环）。三条 required
    修复（THEOREM 先占声明 + M3 阈值 attribution 修正）可定向修订救活 → needs_revision。

  red_flag_findings:
    brick_conclusion: |
      【部分命中——攻得穿一部分但不至推翻】。按任务指定的承重砖(BR-L2-014, BR-L2-018, BR-L2-019)
      逐字核:

      BR-L2-014（代价第三方惩罚）:证实 TP 是跨文化存在的规范执行机制——这是 M3 的执行基础
      （TP 存在→才有"TP 瓦解"可谈）。原文不含:M1 受害叙事、M2 道德创业、M1+M2 合取必要性、
      方向不对称、PHY-001 熵增论证。→ 不构成 brick=conclusion。

      BR-L2-018（旁观者利益关联）:TP 强度随旁观者在合作结构中的利益占比单调变化。原文不含:
      任何阈值主张（只说"单调关系",不设临界点）、M1/M2/M4、方向不对称。→ 不构成 brick=conclusion。

      BR-L2-019（道德内化发育窗口）:P2（对等性信号→内化维持条件）+ P3（青春期关键重组窗口）
      →M4 的发动机。原文不含:M1/M2、社会层面方向不对称、PHY-001 熵增论证。→ 不构成 brick=conclusion。

      三砖合起来:只提供 M3 的单调关系（无阈值）+ M4 的微观条件（P2+P3）。三砖中无一砖声称:
      （a）道德标准通胀需要叙事+创业者;（b）M1+M2 是合取而非析取;（c）紧缩方向不需要推力;
      （d）通胀/紧缩之间存在启动成本不对称。→ brick=conclusion 在三砖层面不命中。

      然而,当我扩展到完整依赖链（depends_on.theorems）时:
      - THEOREM-moral-third-party-enforcement Corollary 2:已给出 TP 阈值（"个体收益<个体成本
        →不再可持续"）——DED-025 derivation step 1 声称"本推论补充"的阈值已在 THEOREM 中。
      - THEOREM-moral-internalization Corollary 1:已给出能量不对称（"建立速率远慢于瓦解速率,
        月/年级 vs 天/周级"）——DED-025 derivation step 3 的不对称的微观基础。
      - THEOREM-moral-internalization Corollary 2:已给出代际道德变迁框架——M4 的 THEOREM 层
        先占。

      THEOREM 的先占物:DED-025 增量中,(a)M3 阈值（个体层）(b)能量不对称方向（个体层）
      (c)代际变迁框架——均已在 THEOREM Corollary 中。DED-025 的真正独家贡献收窄为:
      （a'）M1（受害叙事）——全新 （b'）M2（道德创业者）——全新
      （c'）M1+M2 合取必要性——全新
      （d'）社会层面的方向不对称（PHY-001 应用于道德系统→通胀需要集中能量输入/紧缩是熵增默认）——
      部分新,THEOREM 有个体层微观对应但无社会层宏观主张
      （e'）将 M1-M4 整合为统一的方向动力学框架——整合是新的。

      这五条不在 THEOREM/BR-L2-014/018/019 任何一处 → brick=conclusion 在收窄后不命中
      （核心增量仍在）。但文件目前的 nontriviality_test 只比对了三块砖,未比对两个 THEOREM,
      使增量被高估+ attribution 有误。→ required:补 THEOREM 先占声明,修正 M3 阈值 attribution。

    nontriviality_cell_check: |
      【通过——空格的预测并非同义反复,也不被砖平凡强制】。
      2×2 判据表:方向{通胀,紧缩} × 主动推力{有,无}

      空格①:通胀×无推力→预测标准不变（空）。若观察到无叙事+无创业者而标准自发收紧→推翻。
      此格为空是砖不强制的主张——BR-L2-018 只说 TP 随利益占比单调变化,不禁止"标准可自发收紧"
      的情境（如技术变迁使某行为的后果更可见→舆论自然收紧,无需 M1+M2）。BR-L2-019 只说内化
      依赖安全依恋+对等性信号+青春期窗口,不禁止"无 M1+M2 的条件下的标准机构性上调"（如专业
      协会自行提高伦理标准）。→ 空格可被现实反例填满,非空可满足、非同义反复。

      空格②:紧缩×无推力→预测标准仍松绑（非空）。若观察到 M3+M4 均在独立测量中未激活而标准
      长期不松绑→推翻或需补充维持机制。此格预测非空也是砖不强制的主张——BR-L2-018/019 只描述
      微观机制的条件,不做"社会层面 M3/M4 未激活时标准是否仍松绑"的断言。此外,THEOREM-moral-
      internalization Corollary 1 的"建立远慢于瓦解"是个体层方向,不直接翻译为社会层"紧缩
      不要推力"——个体层能量不对称不能平凡地推出社会层不需要推力（社会层可能有聚合效应/conservation
      机制）。→ 空格非平凡。

      核心非平凡内核:通胀需要推力而紧缩不需要——不在三块承重砖也不在两个 THEOREM 任何一处
      （THEOREM 只描述个体层机制条件,不做"社会层面标准变化的方向不对称"论断）。→ 逐格判空通过。

      一个细微关切（should-level）:空格①的实操证伪窗口。在现实生活中,几乎任何显著的社会道德变化
      都涉及某种形式的叙事和倡导者——要找到一个"无叙事+无创业者而标准自发收紧"的干净案例本身
      就极难。这不代表空格①是免疫的——逻辑上它可被证伪——但"自然的证伪机会"稀缺。作者在
      real_world_anchors 中提供的三个案例均为"M1+M2 在场+通胀发生"——这展示了充分条件路径,
      但未测试必要条件（空格①需要 M1+M2 缺席）。→ should:在 falsifiability 段诚实标注
      "空格①的证伪场景在自然历史中可能不常见——大多数显著道德变化涉及某种形式的倡导,但逻辑上的
      证伪条件仍然成立"。

    measurement_orthogonality: |
      【主干正交,但 M3 行为测量与 DV 共享惩罚强度的观测通道——should awareness】。

      IV（自变量）:
      - M1:媒体框架分析+公众舆论调查（独立于"标准是否已变紧"的反推）
      - M2:倡导者成本-收益核算（独立于标准变化结果）
      - M3 结构锚:BR-L2-018 利益占比稀释倍数——群体规模扩张前后的个体利益占比变化可独立量度
        （不依赖于是否观察到标准已经松了）
      - M4 结构锚:发育窗口期内对等性信号的独立测量（Kochanska 承诺遵从范式+BR-L2-019 P2）
      - PHY-001（方向不对称框架）:热力学第二定律,独立于任何道德标准测量

      DV（被预测量）:
      - 道德标准严格度:（a）法律/宗教/习俗编码中"道德违规"行为类别数的纵向变化;
        （b）调查中公众道德谴责广度评分;（c）同一违规行为的惩罚严重度纵向追踪。

      IV 和 DV 的测量源在概念层面不同→主干正交,未重蹈 DED-007。

      但存在一个测量层重叠:
      - M3 的行为测量（operationalization.M3_third_party_enforcement_collapse.measurement.b）:
        "田野/实验中观察到的第三方惩罚行为频率纵向下降"
      - DV 的 measurement.c:"同一违规行为的惩罚严重度纵向追踪"
      两者共享"可观测惩罚行为"这一测量通道——TP 行为频率下降（M3 激活的效应）同时构成 DV（惩罚
      严重度下降）的子分量。这不是 DED-007 式"分母用实际获授者"的概念焊死——M3 另有结构锚
      （利益占比稀释倍数计算）独立于结果;且 DV 是范围×强度的聚合指标,TP 行为频率只是其中
      一个子分量（范围=多少行为被视为违规;强度=惩罚严厉程度;TP 频率是"有多少人在惩罚"的另一维度）。

      类似地,M4 的行为测量（纵向队列内化深度,IAT/GSR/情绪 Stroop）与 DV 有构念上的边界:
      内化深度下降（M4 激活的效应）可能导致"公众道德谴责广度评分下降"（DV 的 measurement.b）
      或"惩罚严重度下降"（DV 的 measurement.c）——但这是因果链而非测量混同（M4→DV,不是 M4=DV）。

      综上:结构锚（M3 的利益稀释计算,M4 的发育窗口期对等性信号测量）提供了 IV 的独立于 DV 的
      测量基础;行为测量层的重叠是因果链的中间环节,非同一构念的重测。→ 未命中 DED-007 级硬焊死。
      → should awareness:在 operationalization 中标注 M3/M4 行为测量与 DV 的通道重叠。

    scope_hook_independent_of_result: |
      【half-hit——excluded_outcome #3（法律驱动）的边界判断缺乏独立于理论自身的操作化标准】。

      excluded_outcomes 三条:
      （1）"通胀/紧缩的绝对速度预测"——这是射程限定（只做方向+不对称,不做速率定量）,属事前结构
      限定,非事后退路。→ 合规。
      （2）"具体哪个道德领域先通胀/先紧缩"——这是领域选择的外部性,属诚实标注域外因子。→ 合规。
      （3）"法律强制推动的道德标准变化——属 L4-006 的'法律替代道德'路径"——这一排除的边界判断
      需要操作化标准:如何事前区分"法律驱动的通胀"和"道德驱动的通胀"?

      具体而言:falsifiability（a）预测 M1+M2 缺席→通胀被堵。若我们找到一个标准收紧的案例且无
      明显 M1 或 M2,理论可用（3）消化:"那是法律驱动的,不在射程内"。但法律驱动 vs 道德驱动的
      区分标准是什么?如果区分标准本身依赖于 M1/M2 的存在（法律驱动=无 M1+M2 的标准收紧;
      道德驱动=有 M1+M2 的标准收紧）,则消化是循环的——"没有 M1+M2 的通胀不算,因为它们是法律
      驱动的"→理论免疫于证伪。

      real_world_anchors.counterexamples 中的禁酒令处理例证了这一模式:"禁酒令是法律驱动的通胀
      （L4-006 的'法律替代道德'路径）→不在本推论射程"。禁酒令是 constitutional amendment +
      联邦执法——确实是法律驱动的。但判断标准是什么?如果"法律驱动=由国家机器强制推行的标准变化,
      不依赖社会层面的自发道德共识转变",这本身是一个可独立判断的判据（看变化的主要执行渠道是法律
      制裁还是社会惩罚）。这个判据在 L4-006 中应已定义——当前 DED-025 引用 L4-006 作为区分锚,
      但未在此文件中复述区分标准。

      → should:在 excluded_outcomes 中显式给出"法律驱动 vs 道德驱动"的操作化区分判据
      （或至少引用 L4-006 的具体判据编号）,确保此排除事前可判断而非事后消化工具。

      另外两条 excluded_outcomes 是诚实的事前射程限定,不构成 immunization。→ 总体合规,
      但 #3 的边界操作化不完整。

    criterion_tier_match: |
      【不命中】。被预测量（moral_standard_strictness）是连续谱（行为类别数×惩罚强度）,但推论
      的核心预测是方向性而非档位:（i）M1 或 M2 缺失→通胀被堵（离散预测,堵/不堵）;
      （ii）M3 或 M4 激活→标准自动松绑（方向预测）;（iii）M3+M4 同时激活→紧缩加速
      （比较静态）;（iv）通胀启动成本>紧缩成本（比较静态）。方向预测对应被预测量的 sign（正/负）,
      不对应分段分类→无 DED-006 式"连续量用二元分档"的失配。

      M1-M4 的操作化均为连续指标（叙事认同率变化幅度、成本-收益比、利益稀释倍数、内化深度变化
      幅度）→自变量连续、因变量连续、预测方向性→匹配合理。

    anti_talisman_cashed: |
      【纸上到位,实证锚在概念层闭环但田野实操极难——should awareness】。

      anti_talisman_clause 成文有力:明文禁"因标准松了就反推 M3/M4 一定激活",为 M3 和 M4 分别
      提供了独立测量锚:
      - M3 结构锚:BR-L2-018 的利益占比计算——群体规模扩张前后的个体利益占比变化可独立量度
        （不依赖于是否观察到标准已经松了）。这是一个干净的结构性独立测量锚。
      - M4 结构锚:发育窗口期内对等性信号的独立测量——需纵向数据（Kochanska 承诺遵从范式+
        BR-L2-019 P2）,不依赖成年后标准是否已松。
      禁止"大家都不在乎了"解释紧缩（同义反复）+ 禁止"M1 叙事不够好"事后开脱。

      两条结构锚在概念层是干净的——它们测的是"条件是否满足"而非"结果是否发生"。但实操关切:
      - M3 结构锚（利益占比计算）对于历史案例:群体规模增长前后的利益占比需要定量核算,这在
        历史数据中几乎不可行——我们通常只知道"社会变大了",但不知道每个个体的利益占比稀释了
        多少。→ 在实践层面,研究者大概率退化到用"TP 行为频率下降"作为 M3 的代理测量,而这不是
        独立于结果的。
      - M4 结构锚（发育窗口期对等性信号测量）同样:需要 15-20 年纵向数据,历史场景几乎不可得。
      → 这两个锚在"纸上"干净,但在"田野"中几乎用不了——这意味着理论在日常应用层面高度依赖
      anti-talisman 纪律（研究者自律不反推）,而非依赖结构性的"独立测量天然防住了反推"。
      → should awareness:在 operationalization 中诚实标注结构锚的田野可得性限制。

    anchor_fact_check: |
      【无致命事实错,但三类锚证据力不均——两个强、一个多因混淆】。

      （1）美国民权运动（1954-1968）:
      M1→种族隔离的系统性伤害叙事成功建立（Brown v. Board 1954 的社会科学证据+ Emmett Till
      1955+ Birmingham 1963+ Selma 1965 的媒体图像）。事实无误。
      M2→MLK+SNCC 等道德创业者超额投入（被捕/受伤/被杀远超个人利益）。成本>预期收益属实——
      民权领袖面临的人身风险远高于任何合理的个人收益预期。
      "标准从'隔离合法'转为'隔离不道德'"→方向正确,约 14 年集中投入期。事实支撑强。

      （2）苏联解体后俄罗斯（1991-2005）:
      M3→国家作为第三方执行者瓦解（不再惩罚腐败+日常违规）——事实方向正确,苏联时期的道德执行
      确实依赖国家机器的广泛渗透,1991 年后显著瓦解。
      但过因单一:M3 归因可能过度——俄罗斯的道德标准松动不仅来自"TP 瓦解",还来自经济休克疗法
      （1992）造成的生存竞争激化、西方文化涌入、制度真空等混杂因素。将整个紧缩归因于 M3+M4
      可能高估了这两个渠道的解释力。
      M4→1990 年代青春期一代在对等性信号断裂窗口内长大→腐败/逃税等规范松动。方向正确,但面临
      同样混杂:1990 年代青少年面对的不只是"对等性信号断裂"（看到别人违规无后果）,还有积极的
      "新规范信号"（财富至上、生存优先等替代价值观的传播）——这不只是旧规范的瓦解,也是新规范
      的建立。→ 方向性支撑,但因果归因过于纯粹。

      （3）动物权利运动（1975-）:
      M1→Singer《动物解放》（1975）建立动物受苦的可共情叙事。事实无误。
      M2→PETA 等组织超额投入→道德圈扩展。事实方向正确。
      方向性支撑强。

      三个 anchor 均无误事实,但需要注意的是:它们展示的是"M1+M2 在场+通胀发生"（充分条件路径）,
      而非"M1+M2 缺席+通胀不发生"（必要条件路径）。要在实证上支持"合取必要性",需要的是后一
      类证据（或至少找不到反例）——这一点三个 anchor 只是间接地、通过"找不到反例"的方式模糊
      支持。→ should:在 real_world_anchors 中诚实标注"当前 anchor 均为充分条件路径展示,
      必要条件路径（M1+M2 缺席→通胀被堵）尚无直接经验检验案例"。

    definition_vs_prediction: |
      【通过】。关键条件均有独立于结果的操作化定义:
      - M1（受害叙事涌现）:媒体框架分析（叙事出现前/后的受害标签使用率）+ 公众舆论调查
        （该群体"是否遭受不公"的认同率变化）。不由"标准确实变紧了"反推。
      - M2（道德创业者）:识别倡导者并核算投入成本/时间 vs 个人预期收益上限。成本>收益上限
        →确认为道德创业。不由"通胀成功了"反推。
      - M3（TP 瓦解）:利益占比稀释倍数计算（结构锚）+ TP 行为频率纵向下降（行为锚）。
        不由"标准松了"反推。
      - M4（内化跟随瓦解）:纵向队列内化深度比较 + 发育窗口期对等性信号独立测量。
        不由"新一代确实更松"反推。
      - DV（道德标准严格度）:法律/习俗编码+公众舆论+惩罚追踪。不由 M1-M4 反推。

      四个 falsifiability 条件均可被实证推翻:
      （a）发现无 M1+无 M2 条件下标准显著收紧→M1+M2 合取必要性被推翻。
      （b）发现 M3 未激活+M4 未激活条件下标准显著紧缩→"紧缩不需要推力"被推翻。
      （c）发现紧缩方向启动成本与通胀方向无统计差异→核心不对称被推翻。
      → 均为可证伪的经验预测,非定义性同义反复。→ 合规。

      一个细微关切:M1 的"成功"阈值无自然切割点（operationalization 已自认:"认同率变化幅度的
      显著标准需预设"）。若"叙事成功"的阈值在实证中被设得足够高→任何通胀失败都可被归因于
      "M1 不够成功"而非"M1+M2 合取逻辑有误"。anti-talisman_clause 禁了"M1 叙事不够好"的事后
      开脱（要求 M1 成功需操作化为可测的公众认同率变化,不得事后定性）,但如果"显著标准"本身是
      事后调的（结果不好的案例→调整"显著"的 cutoff）,防线有漏洞。→ should awareness:
      M1 的"成功"阈值宜在实证研究前预注册。

    enumeration_and_species: |
      【half-hit——M3+M4 析取是否穷举紧缩通道存疑,第 3 个紧缩通道 plausible】。

      推论声称紧缩方向由 M3（TP 瓦解）或 M4（代际内化断裂）驱动,二者析取（任一激活→紧缩）。
      按 DED-008 精神主动猎第 3 个紧缩通道/隐藏类别:

      【猎击 1:经济激励替代道德执行（economic incentive displacement）】
      规范维护不仅靠 TP+内化,还靠"遵守规范在经济上划算"。当经济结构变化使遵守某规范变得
      个体层面不划算（即使社会层面仍需要该规范）,人们可能放弃遵守→标准在行为层松绑,但
      TP 和内化均未系统性瓦解。

      具体案例:农村社区的互助规范（农忙时互相帮工）在劳动力市场化后解体——不是因为 TP 瓦解
      （人们不再惩罚不帮忙的人）或 M4 内化失败（新一代不再认为帮工是应做的）,而是因为"帮工"
      的机会成本变高了（去城里打工一天赚 200,帮工一天赚 0）→个体层面不划算→行为消退。
      其时间进程可以快于 M3（利益占比稀释要等群体规模增长）和 M4（要等一代人发育窗口期）。

      消化口:M3 机制可以部分覆盖——"合作结构中的利益占比"在劳动力市场化后发生了结构性变化
      （互助合作不再是主要合作结构→利益占比下降→TP 下降）。但此变化不是因为"利益被稀释"（分母
      变大而分子不变）而是因为"合作结构本身被替换了"（个体进入了不同的合作结构）。这与 BR-L2-018
      的"利益占比稀释"机制不同——是结构替换而非稀释。→ 若严格区分"稀释"与"替换",此属于新通道。

      消化结论:可被 M3 的宽泛解释消化——将"利益占比变化"扩展为"合作结构中的利益占比在任何
      方向上变化",不限定稀释路径。但若作者坚持 M3=稀释（群体规模↑→利益↓）,则此击是一个独立通道。

      【猎击 2:认知框架替换驱动的紧缩（cognitive reframing without M3/M4）】
      规范在无 M3（TP 强度未降）+ 无 M4（新一代内化深度未降）条件下发生紧缩,仅因为社会
      整体的认知框架变了——例如"荣誉杀人"规范的消退不是因为 TP 瓦解或内化失败,而是因为
      人道主义认知框架的扩散使人们不再将"荣誉"视为可接受的理由→即使 TP 机制完好（社区仍会
      惩罚不守荣誉规范的人）且内化完好（老一代仍深信不疑）,新一代在接触替代框架后自发拒绝旧规范。

      消化口:这落入 M4（新一代内化不同内容）——但 M4 的机制是对等性信号断裂→不内化,不是
      "接触替代认知框架→主动拒绝旧规范"。前者是缺失信号（passive）,后者是接触新信号（active）。
      若作者严格区分 M4（消极不内化）与"积极接受替代规范"（可视为通胀方向的 M1+M2-like 反过程
      ——即"规范替换"而非"规范紧缩"）,则此击是一个独立通道。

      消化结论:落入"规范替换 vs 规范紧缩"的边界问题（本已标注在 discriminant_validity 中:
      "与 DED-024（个体层面内化瓦解四阶段）不同"）。当前 M3+M4 覆盖的是"旧规范如何不维持",
      未覆盖"新规范如何挤走旧规范"——后者可能属于 M1+M2 的变体（只是换了道德内容）。→
      这是边界标注问题,非穷举破口。但两个猎击都指向同一结构弱点:M3+M4 描述的是"放弃旧规范"
      的机制,而"替代旧规范"可能是一个不同的（积极的而非熵增的）社会动力学。

      不构成 DED-008 式穷举破口（两击均可消化为边界条件或 M3 的宽解释）。→ half-hit 已消化,
      但应在 boundary_cases 或 discriminant_validity 中增列"规范替换 vs 规范紧缩的边界"讨论。

    primary_suspect_aim: |
      【指对了——不对称是最弱腿,但漏了两条隐腿】。

      文件自认:
      - primary_suspect:"不对称——紧缩不需要推力。最危险反例:美国禁酒令废除（1933）"。
      - secondary_suspect:"M1+M2 合取必要性。若发现无叙事有创业者仍成功推动标准收紧→合取
        逻辑需退为析取"。
      - unlikely_suspect:"M3 与 M4 各自独立贡献——即使 TP 从不瓦解,M4 仍可独立驱动紧缩
        →推论核心（紧缩是默认状态）仍成立"。

      三条 self-identification 准确:
      - 不对称是整条推论的承重墙——若紧缩同样需要推力,推论退化为"道德会变严也会变松"的常识。
      - M1+M2 合取必要性是第二承重墙——若退为析取,推论的预测力大幅缩减（M1 或 M2 任一即够
        →通胀条件过于宽松→难以证伪）。
      - M3+M4 独立贡献事关结构冗余度——即使 M3 总被混淆,还有 M4 兜底。

      但文件漏认两条隐腿:

      （a）【THEOREM 先占→claimed delta 被高估+ attribution 有误】（已在 red_flag 1 详述）
      文件 nontriviality_test 只比对了三块 bricks,未比对两个 THEOREM。THEOREM-moral-third-party-
      enforcement Corollary 2 已给出 M3 阈值（"个体收益<个体成本→不可持续"）,THEOREM-moral-
      internalization Corollary 1 已给出能量不对称方向。DED-025 derivation step 1 声称 M3 阈值
      是"本推论补充"与事实不符。→ required:修正 attribution,补 THEOREM 先占声明。

      （b）【excluded_outcome #3（法律驱动边界）的操作化缺失——实践 immunization 风险】
      （已在 scope_hook 详述）"法律驱动的标准变化不在射程内"这一排除,若缺乏独立于 M1+M2 的
      事前区分判据,可能将证伪案例（无 M1+M2 的通胀）消化为"那是法律驱动的"。禁酒令是合法案例
      （确实有宪法修正案+联邦执法）,但若出现一个模糊案例（法律和社会运动同时推动）,区分将依赖
      理论自身而非独立判据。→ should:操作化法律驱动 vs 道德驱动的区分标准。

      （c）【M1 的"叙事成功"阈值无自然切割点——实操中的证伪弹性】
      （已在 definition_vs_prediction 详述）anti-talisman 禁了"M1 叙事不够好"的事后开脱,
      但未强制"成功"显著标准的预注册。若阈值为事后设定→任何通胀失败都可被消化为 M1 未达标。
      → should:建议在 operationalization 中要求预注册显著标准。

      平凡化检查（true）:抽掉（a）M1 （b）M2 （c）M1+M2 合取（d）社会层不对称后,DED-025
      的核心="道德标准会因第三方惩罚消退和代际内化断裂而松动"——这句话已在 THEOREM-moral-
      third-party-enforcement Corollary 2 + THEOREM-moral-internalization Corollary 2 的框架
      内。DED-025 的非平凡性完全依赖于 M1+M2 合取+社会层不对称。discriminant_validity 段
      的防平凡化守卫（"不要将推论简化为'道德会变松也会变严'的常识"）在位且有效——只要读者
      注意到"通胀需要两种特定推力且缺一不可"就未被平凡化。但当前守卫未涵盖 THEOREM 先占的
      更精细威胁（"道德会因 TP 消退而松动"已在 THEOREM 中）。→ required:在 discriminant_validity
      中补一段"THEOREM 已给出什么/本推论新增什么"的差额表。

  counterexample_hunt: |
    主动构造四路猎杀,分别攻击 falsifiability 的四个条件:

    === 猎路 1:攻击 falsifiability（a）——M1+M2 缺席下的通胀 ===

    【靶心案例:新加坡的道德运动（1960s-1980s）】
    Lee Kuan Yew 政府通过国家机器推行的道德标准收紧（Keep Singapore Clean、礼貌运动、
    反吐痰/反乱扔垃圾等）。有 M1（受害叙事）吗? 运动的核心叙事是"国家生存与现代化"——新加坡
    作为一个脆弱小国必须保持秩序和效率。这能否算"受害叙事"? 如果算（"脆弱的国民是国际竞争
    的受害者"）,则 M1 在场但 thin——它不是传统意义上的"某群体遭受不公"而是"全体国民面临
    生存威胁"。有 M2（道德创业者）吗? Lee Kuan Yew 及其政府——但他们的"投入"是作为政府
    职能（治理）,成本是否>个人收益? 难以界定——集权领袖的"个人收益"与"国家利益"高度融合。

    消化口:
    （a）此案可归类为 excluded_outcome #3（法律驱动+国家机器执行）。新加坡的运动有强法律
    执行成分（罚款+执法）——若判为法律驱动,则不在射程内。
    （b）即使判为道德驱动,可以 argue M1 在场（"国家脆弱性"=受害叙事）且 M2 在场
    （Lee Kuan Yew 作为道德创业者——他的投入超过了任何理性的个人利益计算,因为他将个人声誉
    完全绑定在国家成功上）。

    结论:未净杀——在法律驱动/道德驱动的边界上,依分类不同结局不同。若判为法律驱动→在排除区;
    若判为道德驱动→M1+M2 均可被识别（虽 thin）。此击揭示了 excluded_outcome #3 的边界
    分类对理论存亡的关键影响。

    【靶心案例:欧洲中世纪的"上帝的和平"运动（Peace of God, 10-11 世纪）】
    教会推动的限制私战（限制骑士在特定日期/地点使用暴力）的道德标准收紧。M1? 受害叙事:
    "农民和教士是无辜的受害者,骑士的私战使他们受苦"。M2? 教会作为道德创业者——主教和修道
    院长投入大量资源（绝罚威胁+组织和平集会）,成本远超其个人收益。→ 此案支持而非推翻推论
    （M1+M2 在场→通胀发生）。但在"受害群体"的界定上——农民和教士在封建结构中是底层但
    遍布全欧洲——"可共情性"是事后建立还是事先存在的? 若"受害群体"的识别在通胀成功后
    总是"显而易见"的,则 M1 的反推风险上升。

    结论:两击均未净杀。新加坡案落入排除边界,上帝的和平案支持推论。M1+M2 合取必要性的直接
    证伪需要一个不可被法律驱动/规范替换消化的干净案例——这在现代社会几乎不存在因为重大道德
    变化几乎总涉及某种叙事和倡导。这不证明推论是免疫的,但"自然的证伪机会"罕见。
    → should awareness。

    === 猎路 2:攻击 falsifiability（b）——M3+M4 均未激活下的紧缩 ===

    【靶心案例:性革命（1960s-1970s 西方）】
    性规范经历了显著紧缩（婚前性行为、同性恋、非婚同居的去道德化）。M3 激活了吗? 对性规范的
    第三方惩罚是否因群体规模增长→利益稀释而下降? 道德共同体的规模并未显著增长——性规范执行
    的衰减更像是主动倡导（女权主义+性解放运动）而非被动稀释。M4 激活了吗? 新一代成长在怎样的
    对等性信号环境中? 1960s-70s 的青春期一代确实接收到了与前代不同的信号——但这是因为对等性
    信号"断裂"了（旧规范不再被执行）还是因为"新信号"被主动传播了（"性自由是好的"的积极叙事）?

    关键区分:若性革命是 M1+M2-like 的反向过程（有受害叙事——"性压抑的受害者";有道德创业者——
    Kinsey/Hefner/ feminist writers],则是"规范替换"（新道德系统挤走旧道德系统）,而非 M3+M4
    驱动的"被动紧缩"。若性革命同时涉及规范替换和被动紧缩（旧规范因无人维护而松动+新规范因
    有人推动而建立）,则 M3+M4 和 M1+M2-reverse 并存→无法干净检验 falsifiability（b）。

    消化口:推论可 argue 性革命属于"紧缩×有推力"格（第 2×2 表）——紧缩被反道德创业加速,
    但不改变不对称方向。紧缩的"默认性"（不需要推力也能发生）的检验需找"纯 M3+M4 驱动"的案
    例,而此案因同时有推力而无法用于检验。

    结论:未净杀。但揭出一个关键区分——推论的核心声称（"紧缩是默认状态"）需要一个"无推力紧缩"
    的正面证据,而非"有推力的紧缩案例无法用于反证"的负面对称。当前 real_world_anchors 的主体
    （苏联）声称展示了无推力紧缩,但如前所述 Soviet 案的因果归因有混杂。→ should:补充"无推力
    紧缩"正面证据,或诚实标注当前实证基础的方向性而非确定性。

    === 猎路 3:攻击 falsifiability（c）——紧缩方向启动成本与通胀方向无差异 ===

    【靶心案例:烟草行业的"反道德化"（1950s-1990s）】
    烟草行业面对"吸烟不道德"的通胀压力,组织了一场大规模的反击——游说、伪科学、公共关系运动。
    这看起来像是"道德的道德创业"——有组织、有投入、成本>个体公司收益（对整个行业而言）。
    如果紧缩方向的维持/抵抗成本与通胀方向的推动成本相当→不对称被挑战。

    消化口:这是"抵抗通胀"而非"推动紧缩"——烟草行业在防御,不是在主动拉低标准。推论的不对称
    声称是关于"标准从稳态 A→稳态 B（更松）"的过程,而非"抵抗正在进行的通胀"的过程。
    防御和进攻的能量需求不同——防御（维持现状）在热力学上成本低于进攻（改变现状）→这与
    PHY-001 不对称方向一致。

    结论:未净杀——防御≠紧缩,推论的不对称指向的是方向性变化而非维持性抵抗。但烟草 case 提醒:
    在社会现实中,"纯紧缩"（无推力）和"有推力的反道德创业"之间的边界在实践中比理论中模糊。
    → should awareness。

    === 猎路 4:攻击 M3 阈值——利益稀释不导致 TP 瓦解的案例 ===

    【靶心案例:犹太 diaspora 社区的规范维护（公元 70 年-1948 年）】
    犹太社区在分散全球、无领土、无中心化执法机构的情况下,维持了高度稳定的道德规范体系（kashrut
    饮食法、Shabbat 安息日、家庭纯洁法）近两千年。群体规模被地理分散稀释到极低局部密度——
    按 M3 逻辑,TP 应因利益占比极低而瓦解。但规范维护通过拉比权威+社区排斥+文本传承+家庭教育
    四重机制保持了高度稳定——这不像是"TP 瓦解"的 M3 预测。

    消化口:
    （a）M3 讲的是分散化 TP（任意社区成员自发的第三方惩罚）,不是专门化执行（拉比权威+社区
    制度化排斥）。犹太 diaspora 的规范执行高度依赖专门化执行者（拉比+社区委员会）——这与
    THEOREM-moral-third-party-enforcement Corollary 2 的预测一致:当规模稀释个体 TP 时,执行
    转由专门化机构接管。→ M3 未激活（因为 TP 未被稀释——执行机制切换了）。
    （b）但这揭示了一个"漏掉的通道":专门化执行机构（宗教权威+社区组织）可以替代分散化 TP,
    维持规范系统——即使 M3（分散化 TP 瓦解）和 M4（对等性信号断裂）均在理论上预测紧缩,专门化
    执行可以人为维持对等性信号。→ 推论需要纳入"制度化执行替代分散化 TP"作为紧缩的缓冲器,
    而非仅依赖 M3+M4。

    消化结论:不构成 clean 反例——专门化执行替代是 THEOREM 已预测的（Corollary 2:"需要专门化
    执行机构接管"）。但它指向推论的一个结构性 gap:推论讲"紧缩的默认性"时未考虑专门化执行机构
    对熵增的对抗——一个有强制度维护的规范系统（如宗教法律体系）可能长期抵御 M3+M4 的熵增压力。
    → should:在 boundary_cases 中增列"制度化执行对抗熵增——当分散化 TP 已被专门化机构替代时,
    紧缩的默认性是否仍成立? 专门化机构的维护是否计数为'推力'?"

    综合:四路猎杀均未获净到 scope 内活反例。两路落入边界分类（新加坡→法律 vs 道德;性革命→
    规范替换 vs 紧缩）,一路落入防御 vs 紧缩的概念区分（烟草）,一路落入制度化执行的 gap（犹太
    diaspora）。核心结构（M1+M2 合取+方向不对称）未被任何一击动摇。但猎路揭示了推论当前阶段的
    实证特征:概念框架强、干净检验案例稀缺——不是理论有错,而是理论在"自然的证伪机会"极少的
    领域运行。

  non_recurrence_of_ded004_007: |
    DED-004（不可证伪循环）:【未复发,但有两个实操免疫模式——should awareness】。

    逻辑层:falsifiability（a）（b）（c）给出了明确的证伪条件:
    - （a）无 M1+M2 条件下的显著通胀→合取必要性推翻。
    - （b）无 M3+M4 条件下的显著紧缩→"紧缩不需推力"推翻。
    - （c）紧缩启动成本=通胀启动成本→核心不对称推翻。
    三个条件在逻辑上均可被现实反例推翻,空格不被砖/THEOREM 平凡强制→非 DED-004 式逻辑不可证伪。

    实操层两个免疫模式:
    （i）"法律驱动/规范替换消化":任何看似无 M1+M2 的通胀可被 argue 为法律驱动（excluded #3）
    或规范替换（另一套 M1+M2-like 机制在运行）→消化而非证伪。这不是逻辑免疫——如果 L4-006
    的判据足够刚性,法律驱动 vs 道德驱动的区分可以在事前成立——但当前 DED-025 文件未复述该判据,
    读者无法判断消化是否为免疫。→ should:补操作化区分标准。
    （ii）"M3+M4 在 modernity 中的普遍共现":群体规模增长（M3 前提）+ 代际信号变化（M4 前提）
    是现代社会的结构性特征→M3+M4 几乎总在"激活"状态→falsifiability（b）的条件（M3+M4
    均未激活）在当代社会极难满足→紧缩案例几乎总伴随 M3+M4 的某种"激活"。这不意味着理论是
    免疫的——跨文化和历史比较可以提供 M3+M4 变化程度不同的案例——但"在当代找反例"几乎不可能。
    → should:在 falsifiability 段标注此时代限定。

    两模式均不等同 DED-004 的逻辑不可证伪循环→未复发。

    DED-007（焊死测量轴）:【未复发】。

    主干（IV = M1-M4 vs DV = 道德标准严格度变化）来自不同的独立测量源:
    - M1:媒体框架分析+舆论调查
    - M2:成本-收益核算
    - M3 结构锚:利益占比稀释倍数（独立于惩罚行为观察）
    - M4 结构锚:发育窗口期对等性信号测量（独立于成年道德行为）
    - DV:法律/习俗编码+公众舆论+惩罚追踪

    结构锚（M3 利益稀释/ M4 发育窗口期对等性信号）提供了独立于 DV 的 IV 测量基础→测量轴
    概念层未焊死,与 DED-007（分母用实际获授者）性质不同。

    anti-talisman_clause 双向禁反推:不得从标准松了反推 M3/M4,也不得从 M3/M4 行为测量直接
    等于标准松了。防线在位。

    唯一关切（已在 measurement_orthogonality 详述）:M3 行为测量（TP 行为频率纵向下降）和 DV
    的 measurement.c（惩罚严重度纵向追踪）共享同一观测通道。这是测量层面的部分重叠,非概念层焊死,
    不应判为 DED-007 复发。→ should awareness 但不到 required。

  required_fixes:
    - |
      [required] 在 nontriviality_test 中补 THEOREM-moral-third-party-enforcement 和
      THEOREM-moral-internalization 的先占声明。当前 nontriviality_test 仅比对 BR-L2-014/018/019,
      声称二维空格和不对称"不在三块承重砖任何一处"——这在砖层正确但在完整依赖链层不完整。
      需新增一段"THEOREM 先占"对比,诚实列出:
      - THEOREM-moral-third-party-enforcement Corollary 2 已给出的:M3 个体层阈值（"个体收益<
        个体成本→TP 不再是个体层面的可持续策略"）。
      - THEOREM-moral-internalization Corollary 1 已给出的:个体层能量不对称（"建立远慢于瓦解,
        月/年级 vs 天/周级"）。
      - THEOREM-moral-internalization Corollary 2 已给出的:代际道德变迁框架。
      DED-025 的独家增量收窄后为:M1（受害叙事）+ M2（道德创业者）+ M1+M2 合取必要性+社会层
      方向不对称（PHY-001 应用于道德系统）+ 四机制统一框架。此差额表是推论的非平凡性基础,
      不补则 discriminant_validity 声称被高估。
    - |
      [required] 修正 derivation step 1 中 M3 阈值的 attribution。当前措辞:"BR-L2-018 本身
      不声称'TP 会瓦解到零',它只给出单调关系——本推论补充'当利益占比越过个体成本阈值时,TP 瓦解
      至非系统性水平'。"但 THEOREM-moral-third-party-enforcement Corollary 2 原文已给出此阈值
      （"当个体收益低于个体成本时,第三方惩罚不再是个体层面的可持续策略"）。DED-025 的真正增量
      是将此个体层阈值推至群体层:论证当社会规模持续增长使该阈值系统性越过时,TP 瓦解从个体现象
      升级为"社会层面的紧缩通道"（M3）。建议改为:"BR-L2-018 给出单调关系,THEOREM-moral-third-
      party-enforcement Corollary 2 给出个体层阈值——本推论将此推至社会层:当群体规模的系统性增长
      使大多数个体的利益占比越过个体成本阈值时,分散化 TP 在社会层面瓦解,构成 M3 紧缩通道。"
    - |
      [required] 在 discriminant_validity 中补一段 THEOREM 先占差额表,与 required_fix #1 的
      nontriviality_test 补充对齐。防平凡化守卫当前仅防御"道德会变松也会变严"的日常简化,但未防御
      "THEOREM 已讲过了"的更精细威胁——读者若已知 THEOREM Corollary 的阈值+不对称+代际变迁,
      可能误以为 DED-025 是 THEOREM 的社会层重述。需显式标明 DED-025 相对 THEOREM 的增量,
      与"相对三块砖的增量"区分清楚。
    - |
      [should] 在 excluded_outcomes #3（法律驱动的标准变化）旁补一条操作化区分判据,或显式引用
      L4-006 的具体判据编号。当前仅说"属 L4-006 的'法律替代道德'路径,不在 DED-025 射程内"——
      读者无法据此判断一个模糊案例（法律和社会运动同时推动的标准变化）是否在射程内。建议给出
      前瞻性判据,如:"法律驱动=标准收紧的主要执行渠道为制度化法律制裁（罚款/监禁/行政处分）而非
      自发的社会惩罚（排斥/羞辱/声誉贬损）;道德驱动反之。判断依据:变化前后,该行为的非法律社会
      惩罚频率是否发生了独立于法律惩罚频率的变化。"
    - |
      [should] 在 real_world_anchors 中诚实标注当前实证基础:三个 supporting anchor 均为
      "M1+M2 在场+通胀发生"的充分条件路径展示,不直接检验"合取必要性"（M1+M2 缺席→通胀被堵）。
      另,苏联 anchor 的因果归因可能过度——将经济休克+制度真空+文化涌入的复合效应归因于单一的
      M3+M4 通道。建议在 supporting 案例中补一句:"注意:当前案例展示的是机制在场的 directionally
      consistent 证据,非 mechanisms 的排他性因果检验。"同时在 counterexamples 段考虑增列
      "新加坡道德运动"作为法律驱动 vs 道德驱动的边界测试案例。

author_response_round_1: |
  已逐项消解 round-1 五条 required/should：

  (1) [required] nontriviality_test 补 THEOREM 先占声明：在原有 2×2 判据表与"非平凡内核"之间新增"THEOREM 先占声明"段，诚实列出三个 THEOREM Corollary 已给内容（M3 个体层阈值、个体层能量不对称、代际变迁框架），明确 DED-025 独家增量收窄为五条（M1、M2、M1+M2 合取、社会层不对称、四机制统一框架）。非平凡内核表述更新为"不在三块承重砖任何一处，也不在两个 THEOREM 的命题层"。

  (2) [required] derivation step 1 M3 阈值 attribution 修正：原"本推论补充'当利益占比越过个体成本阈值时，TP 瓦解至非系统性水平'"改为承认链——"BR-L2-018 给出单调关系；THEOREM-moral-third-party-enforcement Corollary 2 给出个体层阈值。本推论将此推至社会层：当群体规模的系统性增长使大多数个体的利益占比越过个体成本阈值时，分散化 TP 在社会层面瓦解，构成 M3 紧缩通道。"

  (3) [required] discriminant_validity 补 THEOREM 差额表：在原有"防平凡化守卫"段前新增"THEOREM 差额表"段，逐条列出三个 THEOREM Corollary 的已讲内容 vs DED-025 增量。防平凡化守卫更新为三层防御——防"常识"简化+防"BR-L2-014 已讲"简化+防"THEOREM 已讲"简化。

  (4) [should] excluded_outcomes #3 补操作化区分判据：在原文末追加"操作化区分判据：法律驱动=标准收紧的主要执行渠道为制度化法律制裁（罚款/监禁/行政处分）而非自发的社会惩罚（排斥/羞辱/声誉贬损）；道德驱动反之。判断依据：变化前后，该行为的非法律社会惩罚频率是否发生了独立于法律惩罚频率的变化。此判据锚定于 L4-006 的'法律替代道德'路径定义——参见该 L4 命题的操作化区分标准。"

  (5) [should] real_world_anchors 诚实标注：在三个 supporting anchor 后新增第四条标注，说明前三条均为充分条件路径展示、不直接检验合取必要性，且苏联 anchor 因果归因可能过度（混杂经济休克+文化涌入+制度真空）。

  所有改动均采用瘦身 Edit（最小改动、保留格式），每条改动直接消解对应 required/should 的实质内容，非敷衍加句。

