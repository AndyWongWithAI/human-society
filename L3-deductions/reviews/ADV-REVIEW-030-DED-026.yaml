id: ADV-REVIEW-030
type: adversarial_review
reviews: DED-026
layer: L3-deductions

人话摘要: |
  对 DED-026(道德群体边界推论:TP强度在群体边界处结构性陡降+边界可移动+旁观者效应结构重解释+
  道德帝国主义)的 round-1 独立对抗审查。裁 verified——核心贡献(在 BR-L2-018 的连续梯度上
  叠了群体边界处的结构性阶跃+群体身份线索调节旁观者稀释效应+边界外推两条具体渠道)有真实增量,
  无 required 级缺陷。但五条 should 须注意:(1)预测(iii)的交互效应锚完全是预注册假设——"需专门
  实验设计,尚未被实施"——核心差异化预测零经验支持,file 未在显著位置诚实标注此事实;(2)derivation
  步骤3对 BR-L2-006 的解读过度——"合作结构主要在群体内部共享"是 BR-L2-006 行为能力偏斜的推论
  而非直接陈述,应诚实标注为 inference;(3)预测(iv)道德帝国主义是概念重述(边界扩展+权力不对称)
  而非独立经验预测,derivation 步骤7的增量主张过强;(4)理论不对称——仅考虑受害者群体身份,未触及
  违规者群体身份(黑羊效应区),且未讨论边界收缩(对称于扩展);(5)历史锚均 confounded 且已诚实
  标注 moderate confidence,但三个锚都非控制实验,累积实证方向性支持而非确认。反例猎捕:社交媒体
  同情疲劳对预测(ii)构成真压力(file 已标 partial_pressure),普世主义意识形态作为第三边界扩展
  渠道可被消化但暴露两渠道模型不完备。DED-004/007 未复发——测量轴正交、证伪条件明确。

target: DED-026
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。评分卡红旗 10 条
  逐项攻 + 反例猎捕(判 verified 前必做)+ DED-004(不可证伪循环)/DED-007(测量轴焊死)复发检查。
  裁决三态照评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活反例③不重蹈
  DED-004/007。

round_1:
  reviewer: "独立子 Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: verified
  verdict_note: |
    本条有 genuine 理论增量——"在 BR-L2-018 连续梯度上叠群体边界结构性阶跃"的断言是任何单块
    承重砖都不给出的新预测;将经典旁观者效应从"责任扩散"重解释为"利益占比感知结构性稀释+群体身份
    线索调节"的交互预测有真实的非平凡性;两条边界外推渠道(通信技术+共享灾难)将边界从静态属性
    升级为可移动变量。

    verified 三条门全部通过:
    ①无 required 级缺陷——10 条红旗逐条攻,均未命中 required(详见 red_flag_findings)。
    ②反例猎捕完成——社交媒体同情疲劳(file 已标 partial_pressure)对预测(ii)构成真压力但非净杀;
      普世主义意识形态作为第三边界扩展渠道可被消化;黑羊效应/交叉身份/边界收缩不对称等均不构成
      scope 内干净反例。
    ③未重蹈 DED-004/007——测量轴保持异源正交(群体边界·TP强度·旁观者人数·边界外推渠道均独立
      测量),anti-talisman clause 到位;证伪条件(a)(b)(c)明确且可被现实数据攻击;无 DED-004 式
      不可证伪循环。

    五条 should 级观察不阻断 verified,但强烈建议在修订中处理:
    (1)预测(iii)交互效应锚零经验支持——file 应在 statement 或 real_world_anchors 显著位置诚实
       标注"核心差异化预测(iii)尚未经受实验检验,当前所有锚均为方向性/历史案例级支持"。
    (2)derivation 步骤3的 BR-L2-006 解读过度——BR-L2-006 确立的是内群体行为偏斜(分配/信任/
       冲突中的偏袒),而非"合作结构主要在群体内部共享"这一结构性陈述;后者是前者 plausible 但
       非 forced 的推论,应诚实标注为 inference 并讨论若跨群体合作结构实质性存在时阶梯效应的
       衰减可能。
    (3)预测(iv)道德帝国主义的 derivation 薄弱——"道德圈扩展+权力不对称=道德帝国主义"是概念
       合成而非经验预测;其非平凡性主张("同一结构机制的两种权力配置")是 conceptual insight
       而非新 empirical prediction,应降格为 discussion/remark 而非列入核心预测清单。
    (4)理论不对称性——当前仅考虑受害者群体身份,未触及违规者群体身份(黑羊效应:内群体违规者被
       判更重);亦未讨论边界收缩(共享灾难→扩展的对称面:缺乏共享经验/分裂性叙事→边界收缩)。
       建议在 limitations 中标注此类对称性缺口。
    (5)实证锚全部未经控制实验验证——三个 supporting anchor 均为 moderate confidence+
       confounded 历史案例+预注册假设;推论当前是 well-formed hypothesis 而非 empirically
       confirmed proposition,宜在显著位置诚实声明。

  red_flag_findings:
    brick_conclusion: |
      【未命中——逐字核三块承重砖原文后确认非平凡内核不在任何单砖内】

      BR-L2-014(代价第三方惩罚):
      - 核心陈述:"人类…在自己未受直接损害的情况下,付出个人代价去惩罚针对陌生人的不公行为"
      - 建立的是 TP 的【存在性】,不讲强度分布、不讲群体边界效应、不讲边界移动。DED-026 的
        所有四个预测均不在此砖内。

      BR-L2-018(旁观者利益关联):
      - 核心陈述:"第三方惩罚的强度随旁观者在合作结构中的利益占比系统性地变化"
      - 用"社会距离"描述连续梯度——社会距离越近→利益占比越高→TP越强。BR-L2-018 的
        behavioral_economics source 写:"TP强度随利益占比变化",social_psychology source 写:
        "对内群体成员的违规更愤怒、更愿惩罚——因为内群体规范直接维护了群体身份的价值"。
      - 关键检查:BR-L2-018 的 social_psychology source 是否已含"群体边界"?该 source 引用
        Lieberman & Linke (2007):"被试对同一违规行为,如果受害者与自己共享群体身份,惩罚意愿
        显著更高。"并在 note 中解释:"这不是'偏心'——在结构上,内群体规范直接维护着惩罚者
        自身的合作利益。"——这表面看似乎已覆盖 DED-026 预测(i)的"群外受害者触发更弱TP"。
      - 判别:BR-L2-018 的这条例证是在"社会距离"框架下引用的——它把"共享群体身份"作为社会
        距离近的一个指标。BR-L2-018 的本体论是连续梯度——社会距离越近→TP越强。DED-026 的
        增量在断言:群体边界处存在【超越社会距离连续衰减的结构性断点】——不是"群体身份=社会
        距离近所以 TP 强"(BR-L2-018 可以解释),而是"在社会距离量表得分相同的两个对象中,
        群体身份标记本身制造额外的 TP 差异"(BR-L2-018 无法解释)。DED-026 的 discriminant_
        validity 已给出此关键测试:固定社会距离,仅操纵群体身份标记→TP应有显著差异。若此
        操纵下TP无差异,则 DED-026 坍缩为 BR-L2-018 的复述。
      - 结论:BR-L2-018 已覆盖"群体身份→TP差异"的方向性关联(作为社会距离的一个维度),但
        DED-026 的非平凡增量——"阶跃而非渐变"的结构性断言+群体身份独立于社会距离的额外
        效应——不在 BR-L2-018 内。预测(i)的整体方向(内群体→强 TP)与 BR-L2-018 的方向
        一致,但这是结构性重叠(同向关联)而非经验内容冗余——因为 DED-026 做出了更强的断言
        (结构性断点),其证伪门槛也更高(需证明无阶跃、仅渐变)。不判 required,但应在
        statement 中诚实标注预测(i)的方向与 BR-L2-018 的 social_psychology source 同向,
        本条的增量在"阶跃"的结构性断言和 discriminant 测试设计。

      BR-L2-006(内群体偏好):
      - 核心陈述:"人类倾向于对自己所属群体的成员给予优待——在资源分配中多给、在合作中更信任、
        在冲突中偏袒"
      - 讲的是行为偏斜(分配/信任/冲突),不讲 TP 强度。BR-L2-006 甚至不提"第三方惩罚"。
      - DED-026 的 derivation 步骤3从 BR-L2-006 推论"合作结构主要在群体内部共享"——这是
        合理推论但非 BR-L2-006 的直接陈述(见 nontriviality_cell_check)。此推论桥接了 BR-L2-006
        的行为偏斜到 BR-L2-018 的利益占比,合成后才给出"TP在群体边界处阶跃"的预测——合成逻辑
        成立,不被任何单砖覆盖。

      综合:三块砖均不单独覆盖 DED-026 的非平凡内核——"群体边界处 TP 的结构性阶跃"+
      "边界可移动的两条具体渠道"+"群体身份线索调节旁观者稀释效应"。BR-L2-018 覆盖了预测(i)
      的方向性关联(作为社会距离的一个案例),但"阶跃"的结构性断言是 genuine delta。不判 required。

    nontriviality_cell_check: |
      【通过——核心空格非平凡,但 derivation 步骤3的推论精度需注意】

      2×2判据表(受害者群体身份:内/外 × 旁观者人数:少/多),被预测量=TP强度:
      - 内+少→TP高:平凡(BR-L2-018 高利益占比→高TP)
      - 外+少→TP中低:较平凡(BR-L2-018 低利益占比→低TP + BR-L2-006 对外利益关联弱)
      - 外+多→TP低:较平凡(利益占比本已低+结构稀释叠加)
      - 内+多→TP仍相对高:【非平凡】——群体身份线索抵御稀释效应
      - 核心空格="内群体受害者+众多旁观者+TP强度降至外群体水平"预测为空

      空格分析:
      (a) 空格可被现实反例填上——若发现内群体受害者+众多旁观者条件下 TP 也降至外群体水平,
      则空格被填、预测(iii)的核心调节被证伪。非空可满足、非同义反复。
      (b) 无单块砖给出此交互预测——BR-L2-018 给稀释主效应但不给群体身份的调节;BR-L2-006
      给内群体偏好但不给旁观者数量维度的预测。唯合成给出"内群体线索×旁观者数量的交互效应"。
      (c) BR-L2-018 的 social_psychology source 写了"对内群体成员的违规更愤怒、更愿惩罚"——
      但这未涉及旁观者数量的调节。交互效应不在 BR-L2-018 内。

      非平凡性确认通过。不判 required。

      但 derivation 步骤3存在一处推论精度缺口:
      BR-L2-006 陈述:"人类倾向于对自己所属群体的成员给予优待——在资源分配中多给、在合作中
      更信任、在冲突中偏袒。"这是关于【行为偏斜】的陈述(倾向性),而非关于【合作结构分布】的
      陈述(结构性)。DED-026 步骤3将其解读为"合作结构(及其维护的规范)主要在群体内部共享,
      跨群体共享的合作结构系统性更弱"——这是一个【结构性推论】而非 BR-L2-006 的直接陈述。
      此推论 plausible(行为偏斜→合作密度差异→结构差异),但非 forced——若跨群体合作虽
      少于群内但仍 substantial,则结构断裂的锐度打折。建议在 derivation 步骤3诚实标注此为
      "从 BR-L2-006 行为偏斜到结构性断裂的推论"而非 BR-L2-006 的直接确立。不判 required
      (因推论本身 testable——discriminant validity 测试直接检验阶跃存在与否,不论其 from
      BR-L2-006 的推导强度),但标注精度应提升(should)。

    measurement_orthogonality: |
      【通过——测量轴异源正交,anti-talisman 设计到位】

      四测量轴均独立:
      - 群体边界:事前身份问卷/随机标签分配/成员名册——独立于 TP 强度。operationalization
        明确:"边界的测量须独立于TP强度,不得因'TP有差异'反推'此处必有群体边界'。"
      - TP强度:第三方惩罚博弈金额/vignette Likert评分/田野制裁计数——独立于群体边界。
        测量 limitations 诚实标注实验室/田野各自的 confound 风险。
      - 旁观者人数:客观计数的物理在场者数量——独立于 TP 和群体边界。
      - 边界外推渠道:通信覆盖率(报纸发行量/电视普及率)和共享灾难影响范围(历史事件独立编码)
        ——独立于 TP 变化。

      anti-talisman_clause 三条防线明确:
      (a) 群体边界判定不得因"TP有差异"反推
      (b) 边界外推判定不得因"TP上升"反推
      (c) 旁观者人数不得因"TP低"反推

      承重锚里至少一个真独立测量驱动量:
      - 最小群体范式锚:群体身份=随机标签(实验者外生操纵,完全独立于 TP),旁观者人数=实验操纵,
        TP=博弈金额。此锚设计干净,但标注为"需专门实验设计,尚未被实施——此为预注册假设"。
        测量架构独立但数据不存在。
      - 通信技术锚:通信覆盖率(基础设施指标)独立于 TP(请愿/捐款/施压)。虽 confounded
        (历史案例),测量轴在概念上独立。
      - 共享灾难锚:历史事件独立编码+欧盟身份认同问卷独立于 TP(跨国资源转移)。虽 confounded,
        测量轴概念独立。

      判断:测量轴在概念和操作层面均保持异源正交。anti-talisman 防线的文字表达是认真的。
      不判 required。未重蹈 DED-007 式"分母偷用结果"的焊死。

      残留注意:三个 supporting anchor 中只有第一个(最小群体范式)是真正控制实验设计,且该设计
      尚未实施。历史锚的"独立测量"在概念层面成立,但在实际操作中(历史学者同时编码通信覆盖率
      和 TP)存在共同方法方差风险——编码者对历史叙事的整体理解可能同时影响两个变量的评分。
      此非测量轴定义上的焊死(DED-007),而是田野/历史数据中常见的操作层面 confound。
      file 已通过 honest_note 部分承认此限("因果关系需审慎归因"),建议在 operationalization
      的 limitations 中更系统地标注历史锚的共同方法方差风险(should)。

    scope_hook_independent_of_result: |
      【通过——三个排除钩子均基于事前可测的结构渠道】

      (1) 第二方惩罚(直接受害方/亲缘/互惠关系):按惩罚者与受害者的关系结构事前划定。
          排除理由:非第三方惩罚,不提供对本推论的检验。不由"是否观测到边界效应"决定。独立。
      (2) 制度化惩罚(法院/警察):按专门执法机构的存在与否事前划定。
          排除理由:代理人受职业激励而非利益占比驱动,混淆 TP 测量。不由结果决定。独立。
      (3) 群体边界本身不存在(完全无差异的同质人群):按事前身份问卷/成员名册判定是否存在
          可辨识的群体边界。排除理由:无群体边界则"阶跃"预测无适用对象。不由"未观测到阶跃"
          反推"边界不存在"。独立。

      三个钩子均按结构渠道立桩、不作事后开脱。不判 required。

      微小注意:钩子(3)在操作上存在边界模糊风险——当群体边界存在但"弱"(如两个群体的认同
      分数差异仅 marginal significant),是否算"群体边界存在"?当前 operationalization 用
      "事前群体认同问卷"和"随机标签分配"——前者是连续量(认同强度),后者是离散量(有/无标签)。
      连续量的 cutoff(多强的认同算"边界存在"?)未指定。建议在 operationalization 中补充
      群体边界存在的最低判据(如认同评分差异的效应量阈值),防止"遇弱边界→辩称边界不存在→
      排除反例"的事后消化(should)。

    criterion_tier_match: |
      【未命中——档位匹配合理】

      核心自变量"群体边界"为二分(内/外)——匹配"结构性断点"的本体论(阶跃是二分的)。
      被预测量 TP 强度为连续量,不被二分压缩——因为核心测试是内 vs 外的组间差异,连续因变量
      保留了全部信息。
      旁观者人数在 2×2 表中被粗分为少/多,但 operationalization 明确为"客观计数的物理在场者
      数量"(连续),最终分析用连续变量或 ANOVA 均可——不会因档位过粗吞噬变异。
      不判 required。

      微小注意:预测(ii)的"边界外推"在理论中是渐进的(通信覆盖率↑→边界逐步外推→TP逐步上升),
      但当前 operationalization 未给出边界位置的连续测量工具——仅依赖"群体认同问卷"提供连续
      认同分数。若此分数可追踪 time series 变化,则可操作化"边界移动量";若仅做 pre-post 比较,
      则失去追踪渐变的能力。建议在 operationalization 中讨论边界位置的连续测量方案(should)。

    anti_talisman_cashed: |
      【通过——防线文字到位,承重锚至少一个真独立测量】

      anti-talisman_clause 三条防线:
      (a) 群体边界由独立于 TP 的指标判定——问卷/随机标签/名册。在实验锚(最小群体范式)中
          群体身份由实验者随机分配,完全外生——真独立测量。
      (b) 边界外推由独立于 TP 变化的渠道测量判定——通信覆盖率/灾难影响范围。概念上独立,
          操作上共享方法方差(历史学者同时编码两端),但非结构性焊死。
      (c) 旁观者人数由客观物理计数判定——真独立。

      承重锚中至少一个真独立测量驱动量:
      - 最小群体范式锚:群体身份=随机分配(实验者操纵,完全独立)→YES。但标注"尚未被实施"。
      - 通信技术锚:通信覆盖率=基础设施指标,独立于 TP(请愿/捐款)→概念上 YES,操作上有
        共同方法方差风险。confidence=moderate,标注诚实。
      - 共享灾难锚:历史事件独立编码+欧盟身份认同问卷独立于 TP→概念上 YES,操作上 shared
        method variance risk。confidence=moderate,标注诚实。

      至少一个承重锚(最小群体范式,若实施)满足"真独立测量驱动量"。anti-talisman 防线
      的文字设计是认真的——不是在嘴上说"要独立测量",而是在 operationalization 中为每个
      变量给出了独立测量方案和 limitations 自评。不判 required。

    anchor_fact_check: |
      【无致命事实错——但三个锚均非控制实验,累积实证支持薄弱】

      逐锚核:

      (1) 最小群体范式 TP×旁观者数量交互:
      - 陈述:随机分配群体标签后,在"独自一人"或"多人同时在场"条件下作为第三方旁观者的惩罚决策,
        预测内群体受害者条件下稀释效应显著更弱。
      - 事实检查:文件诚实标注"需专门实验设计,尚未被实施——此为预注册假设",confidence=
        moderate。无事实错。但此"锚"实质是预测而非证据——不应置于 supporting 锚中(或应
        显著标注为"预注册假设,待验证")。此为诚实但 misleading 的呈现——读者扫过 supporting
        anchors 时可能误以为存在实验支持。建议将此锚从 supporting 移至单独段落并显式标注
        "预注册假设"(should)。
      - Confidence: moderate 合理(预注册假设通常 confidence 为 low 或 weak,但实验设计的
        内部效度高故 moderate 可接受)。

      (2) 通信技术与道德圈扩展:
      - 陈述:19世纪报纸/摄影→刚果自由邦暴行可见→公众 TP(请愿/捐款)上升;20世纪电视/越战
        同理。
      - 事实检查:刚果自由邦改革运动(Congo Reform Association, E.D. Morel 1904)确以照片和
        报刊报道为核心动员工具,公众请愿/施压对比利时政府构成真实压力。越战电视报道("客厅里
        的战争")与国内反战运动的因果关系是历史学长期辩论的 topic——有文献支持(Mandelbaum
        1982, Hallin 1986 "The Uncensored War"),也有文献质疑电视只是放大器而非原因(既有的
        反战情绪被电视放大而非电视创造反战情绪)。file 的 honest_note 已标注"因果关系需审慎
        归因"——充分。
      - 无事实错。Confidence: moderate 合理。

      (3) 共享灾难创造新"我们"——二战后欧洲认同:
      - 陈述:二战前法德世仇→战后共享重建叙事+马歇尔计划→"欧洲人"新身份→欧盟结构基金作为
        跨国 TP。
      - 事实检查:此历史叙事是欧洲一体化研究的主流解释之一,但非唯一解释——现实主义解释
        (美国霸权推动、苏联威胁)和制度主义解释(功能 spillover)与"共享灾难→新认同"的解释
        并肩存在。欧盟结构基金的分配确有"我们欧洲人"的叙事框架,但也受国家利益 bargaining
        驱动(净出资国 vs 净受益国的博弈)。file 未声称这是唯一解释,仅作为方向性支持案例——
        可接受。
      - 无事实错。Confidence: moderate 合理。

      自我报告的反例(社交媒体同情疲劳)分析诚实——"通信技术可能只是增加了'信息量'而非
      '利益关联感',过载反致麻木。"状态标 partial_pressure 合理——对预测(ii)的渠道特异性
      有压力但不推翻核心(边界可被移动)。

      综合:三个 supporting 锚无事实错,但三锚均非控制实验——历史锚 confounded,实验锚
      尚未实施。推论当前的实证基础是"方向性历史案例+预注册假设",而非复现的实验发现。
      此非事实错,但是推论整体 epistemic status 的重要上下文——建议在显著位置(如在
      statement 或 real_world_anchors 开头的显式声明)诚实标注(should)。

    definition_vs_prediction: |
      【通过——关键条件均为可证伪预测,非定义性真理】

      四预测逐一检查:

      预测(i)"群外受害者触发更弱TP":可被"内/外受害者TP无差异"证伪——条件是保持违规类型
      和严重度不变,仅换受害者身份。此条件由实验者外生操纵,不由结果反推。可证伪。

      预测(ii)"边界可被人为外推":可被"通信技术/共享灾难引入后对原外群体TP无显著上升"
      证伪。渠道测量独立于 TP(见 measurement_orthogonality)。可证伪。

      预测(iii)"群体身份线索调节旁观者稀释效应":可被"内/外群体条件下稀释效应无差异"
      证伪。交互效应的统计检验是标准的可证伪预测结构。可证伪。

      预测(iv)"道德帝国主义=边界扩展+权力不对称":此为概念合成而非独立经验预测——
      derivation 步骤7称"非平凡在于断言'道德圈扩展'和'道德帝国主义'是同一结构机制的
      两种权力配置"——这是 conceptual insight,非新的 empirical prediction。预测(iv)
      的可证伪内容实质已包含在预测(ii)中(边界可移动)——(iv)只是给(ii)的某个子场景
      加了一个名字(帝国主义)。建议:要么将(iv)降格为 prediction remark/discussion 而非
      并列核心预测,要么给出(iv)超越(ii)的独立可证伪经验内容(如"权力不对称条件下边界
      外推的方向不对称——A的规范强加于B而非双向融合")(should)。

      关键范围条件均可事前判定:
      - 群体规模≥3且存在可辨识群体边界→由客观计数+身份问卷事前判定
      - 纯匿名单次交互中群体身份线索可能不足→由交互结构事前判定(不满足则不适用)

      不存在 DED-004 式"定义吸收所有反例"的循环。不判 required。预测(iv)的实证野心
      超出了其经验内容(should)。

    enumeration_and_species: |
      【不直接命中——本推论非 N-species 穷举枚举结构,但存在对称性缺口】

      DED-026 给出四条预测(i-iv),非"将某现象分为 N 类穷举"的结构。四条预测是同一机制
      (群体边界调节 TP)的不同表现面,非 claims of exhaustive typology。按 DED-008 精神
      主动猎"不在四预测内的推论应覆盖的现象":

      (a) 边界收缩(Boundary Contraction):预测(ii)断言通信技术和共享灾难将边界外推。
      对称面——分裂性叙事/ propaganda/隔离政策是否将边界内推(收缩)?若边界可被人为外推,
      逻辑上也可被人为内推。当前 theory 未给出边界收缩的预测。这不是"第 N+1 类"(收缩
      是扩展的对称面,非独立 species),但是一个系统性预测缺口——若 theory 声称边界可移动,
      应覆盖移动的两个方向而非仅扩展。建议在预测(ii)或 limitations 中讨论此对称性(should)。

      (b) 违规者群体身份(Violator Group Identity):当前 2×2 表和四个预测均只操纵受害者
      群体身份,未触及违规者群体身份。社会心理学文献中的"黑羊效应"(Marques et al.)显示:
      内群体违规者遭【更严厉】惩罚(比外群体违规者)——似是预测(i)的反向。但 DED-026 可
      合法辩称:黑羊效应涉及违规者身份、本推论聚焦受害者身份——不同机制。此非逻辑矛盾,
      但"受害者身份"和"违规者身份"同时在场时(如内群体违规者伤害外群体受害者)的 TP 预测
      未被覆盖。建议在 limitations 中讨论"受害者身份 vs 违规者身份"的对称性问题(should)。

      (c) 交叉身份(Cross-cutting Identities):operationalization 的 limitations 已标注
      "个体同时属于多个群体(交叉身份)",但四预测均假设单一 salient 群体身份。当受害者和
      旁观者共享群体 A 但分属群体 B(或旁观者同时认同两个冲突的群体身份)时,预测方向模糊。
      此非外部 species,是理论内部的条件边界——已在 limitations 中承认,但未给出预测优先级
      规则(哪一个身份 dominate?)。建议讨论(should)。

      未猎到不可消化的第 N+1 类。不判 required。

    primary_suspect_aim: |
      【方向指对——但漏认一条更根本的软肋】

      文件自认 primary_suspect:"预测(ii)的'通信技术→边界外推→TP上升'因果链——通信技术
      可能增加'远方的可见性'但不一定改变感知的利益占比(看得见≠觉得跟自己有关)。"

      此自评正确——预测(ii)的"通信技术"渠道确实是最弱的腿:
      - 社交媒体同情疲劳反例(file 已标 partial_pressure)直接压力此渠道
      - 通信技术可能改变信息量而非利益关联感
      - 文件已诚实标注此弱腿并给出若被削弱后预测(i)(iii)仍可独立存活的逃生路线

      但文件漏认一条更根本的软肋:

      【预测(iii)的交互效应锚零经验支持——应列入 primary_suspect 或至少在 falsification_
      trace 中独立标注】。预测(iii)的"群体身份线索×旁观者数量的交互效应"是本推论区分于
      BR-L2-018 和经典旁观者效应的最 distinctive 预测。此预测的 supporting anchor 明确写:
      "需专门实验设计,尚未被实施——此为预注册假设"。换言之,整条推论中最能证明其独立存在
      价值的经验主张,当前处于零证据状态。这不是"证据弱"(像预测(ii)的历史锚有 confounded
      方向性支持),而是"证据不存在"。此风险比自认的 primary_suspect(预测 ii 的通信技术渠道)
      更致命——后者至少还有方向性历史案例,前者连一个数据点都没有。建议将预测(iii)的零证据
      状态列入 primary_suspect 的补充说明,或至少在 falsification_trace 中独立一段标注。

      secondary_suspect 的方向正确——若预测(iii)的调节效应不成立,预测(i)的阶梯效应仍可
      独立存活。此逃生路线合理。

      平凡化检查:discriminant_validity 的"防平凡化守卫"到位——明确列出三条非平凡增量
      (阶跃/边界移动/旁观者效应重解释)并给出与 BR-L2-018、BR-L2-006、经典旁观者效应的
      判别测试。但"道德帝国主义"段(防平凡化守卫第三条)的对手是 "Singer 道德圈扩展论"——
      DED-026 断言 Singer"未给出扩展的结构机制",本推论给出"通信技术+共享灾难"两条渠道。
      此判别成立——Singer 的确描述了道德圈扩展现象但未给出渠道机制的因果链。然而 DED-026
      自己的渠道证据也仅止于方向性历史案例,与 Singer 的证据层级类似。故此判别的 probative
      value 有限——不是逻辑错误,是 evidential symmetry。不判 required,宜在 discriminant_
      validity 中诚实标注(should)。

  counterexample_hunt: |
    主动构造能证伪核心的最强 falsifiability(a)/(b)/(c) 案例,认真搜历史/跨文化实例:

    ========== 攻击 1:社交媒体同情疲劳(Social Media Compassion Fatigue) — 已知,真压力 ==========

    目标:falsifiability(b)"通信技术→边界外推→TP上升"
    案例:2010年代至今,社交媒体使远方苦难"极其可见"(叙利亚战争/加沙/罗兴亚难民实时影像),
    但公众 TP(捐款/GDP 占比、长期关注的留存率)并未同比例上升——甚至下降。"冰桶挑战"
    →"Kony 2012"→"叙利亚"的注意力周期越来越短,同情疲劳(slacktivism/clicktivism)作为
    稳定现象被多篇实证文献记录。
    分析:此案例直接压力预测(ii)的"通信技术→TP上升"因果链。通信覆盖率上升但 TP 未跟随。
    file 已将此案例列为 counterexamples 并标 partial_pressure,分析为"可能需更严格的条件
    (不只是'可见',还需'可互动'或'真实的互依'才能移动边界)"。此消化路径合理——预测(ii)
    的通信技术渠道被削弱但不推翻"边界可被人为移动"的核心(共享灾难渠道仍独立成立)。
    结论:【真压力但非净杀——file 已承认并部分消化】。若未来 meta-analysis 确认通信
    覆盖率的增加与 TP 系统性的零或负相关,预测(ii)的通信渠道被证伪,但预测(ii)的共享灾难
    渠道和预测(i)(iii)(iv)仍可独立存活。

    ========== 攻击 2:普世主义意识形态(Universalism as Third Channel) — 被消化,揭出渠道不完备 ==========

    目标:falsifiability(b)的"两条渠道"完备性
    案例:启蒙运动的普世人权理念并非通过通信技术(使远方苦难可见)或共享灾难(everyone
    suffered together)驱动——它是哲学/意识形态建构。"人人生而平等"的 normative commitment
    早于摄影术和越战电视报道。二战后《世界人权宣言》(1948)虽以二战共享灾难为背景,但
    其 intellectual lineage 可追溯至启蒙自然权利传统——不是"我们一起扛过"的叙事,而是
    "所有人都有固有尊严"的先验规范承诺。
    分析:此案例未推翻预测(ii)的两条渠道(它们仍然是边界扩展的真实渠道),但暴露两条渠道
    的不完备——存在第三条渠道:意识形态/规范性论证驱动的边界消解。"普世主义意识形态"
    不同于"通信技术"(前者改变规范信念、后者改变信息可得性)也不同于"共享灾难"(前者是
    top-down 理念传播、后者是 bottom-up 经验共享)。
    消化路径:DED-026 可将"普世主义意识形态"吸收为"共享叙事"的一个子类——启蒙思想家讲述
    了一个"全人类共属一个道德共同体"的故事,这与"我们一起扛过二战"的结构类似(均为叙事
    驱动的边界重定义)。此消化在逻辑上成立(两条渠道之一"共享灾难/共同敌人"的核心机理是
    "创造新的'我们'"——意识形态也能创造新的"我们")。但消化后"两条渠道"的排他性减弱——
    "共享灾难/共同敌人"和"意识形态建构"虽可归入同一机制(叙事→边界移动),但触发条件
    差异大(灾难是偶然事件、意识形态是 intentional 建构)。建议在 derivation 步骤5中诚实
    标注:通信技术和共享灾难/共同敌人是【两种显著且可操作的渠道】而非【仅有的两种渠道】,
    其他渠道(如意识形态建构、经济利益绑定)可能也移动边界但不在本推论现阶段聚焦范围内。
    结论:【被消化,揭出渠道分类的不完备——非净杀,但"两条渠道"的表述应从 exhaustive
    (仅有两条)收缩为 exemplary (至少两条典型渠道)】(should)。

    ========== 攻击 3:荣誉文化中的跨群体报复(Honor Culture Cross-Group Retaliation) — 被 scope 消化 ==========

    目标:falsifiability(a)"群外受害者触发更弱TP"
    案例:传统荣誉文化(阿尔巴尼亚 Kanun/科西嘉 vendetta/黑山 krvna osveta)中,外群体成员
    对本群体成员的微小冒犯(一句侮辱→客观 harm≈0)可触发整个氏族对冒犯者氏族的致命报复。
    此处的"惩罚"是氏族群体对"外群体违规者"的集体 TP——而且其强度是极端的(谋杀),远超
    对"内群体违规者"在同等冒犯下的惩罚(内群体成员冒犯本族人通常通过调解/补偿解决,非
    致命报复)。这似与预测(i)"群外受害者→更弱 TP"方向相反——外群体受害者(冒犯者所属
    氏族中被报复的个体)触发的 TP 反而是极端的。
    消化路径:DED-026 的射程聚焦受害者群体身份——预测(i)说的是"受害者是外群体时 TP 更弱",
    而荣誉文化案例中,初始受害者是本群体成员(后被外群体冒犯),执行 TP 的是受害者氏族成员——
    严格来说是第二方惩罚(氏族成员与受害者共享群体身份→利益关联强)。DED-026 的 excluded_
    outcomes(1)明确排除"与受害方有亲缘/互惠关系的个体"——氏族复仇落在此排除内。
    结论:【落入 excluded_outcomes(1),非净杀】。但此案例揭示一个边界模糊区:在紧密氏族
    社会中,"第三方"与"第二方"的边界本身模糊——氏族成员可能既是"共享群体身份的第三方"
    又是"通过亲缘与受害者间接关联的第二方"。DED-026 的"第三方"概念以现代个体主义社会的
    "陌生人旁观者"为默认模型,在 kinship-based 社会中的操作化存在边界模糊。建议在
    operationalization 的 limitations 中讨论此模糊(should)。

    ========== 攻击 4:去人性化宣传导致的边界收缩(Dynamic Boundary Contraction) — 揭出对称性缺口 ==========

    目标:预测(ii)的对称面——边界收缩
    案例:卢旺达种族灭绝前,胡图族极端媒体(RTLM)通过"蟑螂"(inyenzi)话术系统性地将图西族
    从"邻居/同学/同事"重新定义为"必须被清除的害虫"。此过程是边界收缩(甚至边界消除——
    外群体被移除出"人类"范畴)而非边界扩展。1990-1994年间,胡图族和图西族共享的地理空间/
    经济互依/通婚关系(高利益占比+低社会距离)被 propaganda 在短短几年内瓦解——群体边界
    不仅收缩且变为 exterminatory。
    分析:预测(ii)仅讨论边界【外推】(expansion),未讨论边界【内推/收缩】(contraction)。但
    同一机制(叙事/通信渠道)显然可双向运作——用以扩展边界的渠道(通信技术/共享叙事)也可
    用以收缩边界(propaganda/分裂性叙事)。卢旺达案例中 propaganda 的"通信技术"维度
    (广播电台 RTLM)和"叙事"维度(inyenzi dehumanization trope)恰是 DED-026 两条渠道的
    暗面应用。此案例未与理论的任何正面预测矛盾(理论未声称边界不可收缩),但暴露了一个
    系统性预测缺口——若"通信技术/叙事"可双向移动边界,理论应给出边界移动方向的调节条件。
    结论:【非反例(不矛盾),揭出对称性预测缺口】。建议在预测(ii)中加入边界移动的双向性
    声明并给出方向调节条件的初步假设(should)。

    ========== 猎捕结论 ==========

    未猎到 scope 内干净必杀反例:
    - 攻击1(社交媒体同情疲劳):真压力但非净杀,file 已标 partial_pressure
    - 攻击2(普世主义意识形态):可被消化为"共享叙事"子类,暴露渠道分类不完备
    - 攻击3(荣誉文化跨群体报复):落入 excluded_outcomes(1)第二方惩罚排除
    - 攻击4(去人性化边界收缩):非反例,揭出对称性预测缺口

    最强挑战是攻击1(社交媒体同情疲劳)——若未来数据确认"通信覆盖率↑ + TP↓"为系统性
    规律,预测(ii)的通信技术渠道被证伪。但即使此渠道塌了,共享灾难渠道+预测(i)(iii)
    仍可独立存活——推论有多条独立经验腿,单腿塌不塌核。

    反例猎捕完成。无 scope 内净杀。verified 条件②满足。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发】

    DED-004 的死因:唯一新意被实证推倒→改措辞用同一批数据捞"打折版"→事后开脱活门未堵。
    DED-026 与 DED-004 的关键差异:
    - DED-026 有四条可独立攻击的预测(i)(ii)(iii)(iv),四条腿各自有独立的证伪条件——
      DED-004 只有一个经验主张被围剿。
    - falsifiability(a)(b)(c)给出明确的证伪测试(操纵受害者身份→TP差异/引入渠道→TP变化/
      交互效应检验)——不是"找到某种解释即可消化"的模糊空间。
    - anti-talisman clause 要求所有关键变量独立测量——群体边界不由 TP 反推、边界外推
      不由 TP 变化反推、旁观者人数不由 TP 反推。
    - excluded_outcomes 均基于事前结构判据(惩罚者关系类型/制度化权威存在与否/群体边界
      存在与否),无"遇反例→回缩定义"的活门。

    DED-004 式"事后开脱活门"检查:逐一检验 excluded_outcomes 和 falsifiability 是否
    存在可被事后用来消化反例的弹性条款:
    - excluded_outcomes(3)"群体边界本身不存在":由事前身份问卷/成员名册判定,不由"是否
      观测到阶跃"决定——事前判据。
    - falsifiability 适用区间"纯匿名单次交互中群体身份线索可能不足以激活利益占比的结构
      感知":这是事前范围限定(由交互结构判定),非事后开脱——若某实验出现内+多→TP低的结果
      但该实验非"纯匿名单次交互",则此限定不可用于排除该反例(因为限定是事前条件,不满足则
      理论不适用→不构成反例而非"反例被消化")。

    未发现 DED-004 式不可证伪循环。通过。

    DED-007(测量轴焊死):【未复发】

    DED-007 的死因:自变量分母"实际获授者"偷用被预测量(货币形式)——轴定义本身含被预测量,
    结构性焊死无法拆。DED-026 现状:
    - 群体边界:事前身份问卷/随机标签分配——独立于 TP 强度
    - TP强度:博弈金额/vignette评分/田野计数——独立于群体边界
    - 旁观者人数:客观物理计数——独立于 TP 和群体边界
    - 边界外推渠道:通信覆盖率/灾难影响范围——独立于 TP 变化

    四个轴在概念和操作上均异源,无 DED-007 式"分母偷用结果"的结构性焊死。anti-talisman
    clause 进一步加固:明确禁止因 TP 差异反推群体边界、因 TP 上升反推边界外推、因 TP
    低反推旁观者多。未复发。

