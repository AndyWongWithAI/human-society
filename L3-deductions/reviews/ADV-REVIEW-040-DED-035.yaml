id: ADV-REVIEW-040
type: adversarial_review
reviews: DED-035
layer: L3-deductions

人话摘要: |
  对 DED-035(数据协调成本不对称冲击与企业边界分叉)的 round_1 独立对抗审查。
  裁 needs_revision:核心逻辑骨架(可测量性梯度→不对称度→边界分叉)焊接了四块
  承重砖的增量,非平凡性成立,无 brick=conclusion,未重蹈 DED-004/DED-007。
  反例猎捕未净杀(会计/审计被消化为 trust+regulation 对冲、农业被消化为生产
  规模经济主导、软件被消化为平台网络效应混杂)。五条 should 级缺陷挡住 verified:
  (1)可测量性三维等权平均+阈值(0.7/0.3)零经验锚定——权重方案与阈值纯断言、
  无校准依据;(2)不对称度假说中介变量不可直接观测——核心因果机制无法直接验证,
  靠竞争假说检验间接支撑;(3)外包渗透率测量口径过于模糊——"来源=行业报告/学术调查"
  未锁定具体数据源、预留事后选择空间;(4)anti-talisman 虽四禁写得对但可测量性
  独立编码的实践可兑现性存疑——高可测性行业往往因更碎片化而有更多公开量化痕迹,
  编码者难以完全免疫行业边界知识污染;(5)电子制造锚的时序主张可商榷——
  TSMC(1987)与 fabless 模式的兴起早于 MES/ERP 普及(1990s-2000s),因果方向
  不如文件所述清晰。零 required 级缺陷,核心未塌。

target: DED-035
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。
  评分卡红旗 13 条逐项攻+反例猎捕(必做)+DED-004(不可证伪循环)/DED-007(测量轴焊死)
  复发检查。裁决三态照评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内
  活反例③未重蹈 DED-004/007。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    本推论的核心机制——数字数据+算法对市场交易成本与企业内协调成本的降幅不对称,
    按活动可测量性梯度驱动企业边界分叉——逻辑骨架完整。四块承重砖(DED-001/
    BR-L2-010/BR-L2-009/BR-L2-001)的焊接产出了真正的非平凡增量:没有任何单一
    砖预测"可测量性高的活动外包、信任密集的活动留在内部甚至更内化"这一分叉模式。
    DED-001 仅预测企业可以更大(内部协调改善),BR-L2-010 仅预测更多交易可走市场
    (但不指定哪些),BR-L2-009+BR-L2-001 仅设定不对称性的信任与认知上限。分叉
    需要不对称性+可测量性梯度两个增量,均来自四砖焊接而非任何单砖。DED-004
    (不可证伪循环)与 DED-007(测量轴焊死)均未复发——可测量性编码与被预测的
    边界位置在概念上异源,anti-talisman 四禁令封死了反向推断路径。

    反例猎捕无净杀。会计/审计(Big Four)高可测性但高度集中——被消化为 trust+
    regulation 对冲(审计的信任密集属性 + SOX/PCAOB 监管壁垒压过了可测量性驱动的
    碎片化压力),揭示了一个结构性问题:当可测量性与信任强度指向相反方向时,
    推论未提供哪一力量占优的事前判据。农业(精准农业高可测性但农场大规模合并)
    被消化为生产规模经济(大型机械/议价能力)主导。软件(Big Tech 高可测性但巨头
    扩张)被消化为平台网络效应混杂。无一构成干净击杀,但猎捕揭示了推论在实践中的
    低可测性——每个潜在反例都可援引推论自身承认的"其他因素仍在作用"来吸收。

    五条 should 级缺陷挡住 verified:

    ①【should】可测量性操作化的权重与阈值零经验锚定。三维度(输出/输入/过程)
    等权平均是纯断言——不同行业的维度权重天然不同(作者在 limitations 中自认),
    但未提供任何校准依据。档位阈值(高≥0.7/中 0.3-0.7/低<0.3)同样是纯断言——
    为什么是 0.7 和 0.3 而非 0.8 和 0.4?阈值移动会将边界行业重分类,进而改变预测
    (i)-(iii)的验证结果。需补充:等权方案的事前辩护(或诚实降级为"初始假设,待
    行业数据校准");阈值的事前锚定逻辑(或诚实标注为"暂定操作值、敏感性分析计划")。

    ②【should】不对称度中介变量的不可直接观测性应从前台 limitation 升级为结构性
    弱点声明。当前"不对称度本身不可直接观测"仅写在 limitations 中,语调是"这是
    一个需要注意的点"。但它实际上决定了:即使预测(i)-(iii)全部被数据确认,不对称
    度假说仍只是"与数据一致的候选解释之一"而非被验证的因果机制——均匀提升+行业
    时滞差异假说、管制差异假说均可能产生相同的观测模式。推论通过预测(ii)"低可
    测性行业边界不动"来与均匀提升假说竞争,但这一竞争性检验对数据质量和时间跨度
    的要求远高于直接机制检验。应在 falsification_trace.primary_suspect 中明确标注:
    不对称度假说本身不可直接证伪,推论存活依赖于竞争假说被独立拒绝——这是一种
    比直接证伪更弱的认识论地位。

    ③【should】外包/平台渗透率的测量口径过于模糊。"按交易额统计,来源=行业报告/
    学术调查"——"行业报告"和"学术调查"是类别描述而非具体数据源。不同行业报告
    (如 IBISWorld vs. Statista vs. 行业协会自报)对同一行业的外包率估计可以相差
    数倍。这为事后口径选择预留了空间——若初始数据源不显著,可换用另一"行业报告/
    学术调查"直到找到支持预测的数据。应与边界位置的另两个指标(垂直一体化指数=
    投入产出表、平均企业规模=统计年鉴)对标,为外包率锁定具体数据源(按行业),或
    诚实标注"待数据源锁定"并承诺在见任何边界数据前完成注册(不晚于下一轮审查)。

    ④【should】anti-talisman 的可实践性存疑。可测量性编码要求"在见边界数据前锁定,
    按行业技术特征与数据基础设施编码"——这一要求在逻辑上正确,但在实践中几乎
    不可能严格兑现。原因:高可测性行业(软件/制造代工/物流)正是因为其高度碎片化
    和外包化,才产生了大量公开可追踪的量化痕迹(GitHub commit 记录/API 调用日志/
    MES 传感器数据/物流追踪系统)。编码者即使"不看边界数据",也无法免疫"该行业
    以碎片化/外包化著称"这一常识知识。这不是 anti-talisman 写得不好——四禁令
    本身严密。问题是执行层面的"知识污染"无法通过措辞消除。建议诚实标注:可测量
    性独立编码的"独立性"在实践中是程度问题而非二元状态,并注册事后检验——若编码
    者间信度(inter-coder reliability)低于 0.7,编码方案需重新校准。

    ⑤【should】电子制造代工锚的时序主张需订正。原文称"良率/产能等指标的传感器化
    与数据化时点(1990s-2000s MES+ERP 普及)先于垂直解体加速期,方向与推论一致"。
    但纯晶圆代工模式(foundry model)的里程碑早于此:TSMC 成立于 1987 年,是世界上
    第一家纯晶圆代工厂;Fabless 模式先驱 Xilinx(1984)/Qualcomm(1985)/NVIDIA(1993)
    均在 MES/ERP 普及前就已出现。垂直解体的主要驱动力是资本成本(建晶圆厂越来越贵,
    ~$10B/座)和专业化收益,可测量性是使能条件(enabler)而非触发条件(trigger)。
    当前表述暗示"可测量性提高→垂直解体",但历史时序更支持"资本成本+专业化→垂直
    解体,可测量性使这种解体可管理"。应订正时序主张或诚实降级因果关系方向。

    综合:推论逻辑可证伪、无 brick=conclusion、反例猎捕无净杀、DED-004/007 未复发。
    五条 should 均为操作化/测量/锚点层面的可修补问题,不使核心塌陷。

  red_flag_findings:
    brick_conclusion: |
      未命中(攻不穿)。逐砖原文核查:

      DED-001(组织深度天花板,verified):核心主张为纯口头层级组织有效深度 5-7 级,
      形式化信息系统可补偿信息衰减。全文预测"企业可以更大"(内部协调改善)、"层级
      可以更深",不含任何"某些活动会移出企业边界"的方向性预测,更不含"可测量性
      梯度→分叉"。discriminant_validity 段诚实标注"贡献是解释性统一、非新经验预测"。

      BR-L2-010(非人格化制度替代人际信任,verified):核心主张为非人格化制度【能】
      替代人际信任支撑陌生人交换。全文为 capability 命题——制度【能】使能陌生人交易,
      不预测"哪些交易会走市场、哪些留在企业内",不含"可测量性"概念,不含"企业边界"
      讨论。honest_note 明写"命题只声称可替代,不声称必被采用"。

      BR-L2-009(人际信任有界衰减,verified):核心主张为信任有界+随社会距离衰减。
      全文不含任何组织后果预测,不含"企业边界""垂直解体""外包"等概念。honest_note
      明写"下游推论只可依赖有界+衰减,不可依赖某个具体阈值"。

      DED-006(信任天花板-制度外化,verified):核心主张为交换网络突破信任半径时,
      信任被外化到非人格化制度;驱动量是半径突破(匿名×广度)而非人口规模。全文的
      "外化"指制度涌现(第三方执行/声誉登记/契约/货币),不是企业边界位移。不含
      "企业边界分叉""可测量性梯度""不对称降幅"等 DED-035 特有概念。DED-006 的
      预测域是"制度是否出现",DED-035 的预测域是"企业边界位移方向"——两个不同
      的被预测量。

      BR-L2-001(有限理性,verified):核心主张为人脑算不过来、satisficing。全文不含
      组织后果预测,不含"可测量性""企业边界"讨论。

      "数字数据使企业边界按活动可测量性分叉"这一结论未在任何承重砖中原文或近义出现。
      分叉需要不对称性+可测量性梯度两个增量,均来自四砖焊接而非任何单砖。DED-001
      不预测分叉;BR-L2-010 不预测分叉方向;BR-L2-009 不预测组织后果;DED-006 的
      预测域(制度涌现)与本推论(边界位移)不同;BR-L2-001 不预测边界位移。无为本
      推论窄化的专用砖。
      ⇒ 不判。

    nontriviality_cell_check: |
      未命中但边缘(攻不穿但接近常识)。2×2 判表逐格:

      格(高可测量性,边界向外)——非平凡格:DED-001 单独看预测"企业可以更大"
      (内部协调改善→内化更多),与此格方向相反;BR-L2-010 单独看预测"更多交易走
      市场"但不指定哪些;BR-L2-009+BR-L2-001 设定了不对称性上限但不产生分叉预测。
      四砖焊接才产出"可测性高的活动→不对称度为正→边界向外"的方向性预测。此格
      可被现实反例填充(见 counterexample_hunt 的会计/审计候选)。

      格(低可测量性,边界向内/不动)——另一非平凡格:单看 DED-001,低可测性行业
      内部协调改善也应带来"企业可以更大"——方向自洽但缺少比较级含义(相比市场
      交易成本改善更显著)。此格来自不对称性——信任密集型+默会知识密集型活动的
      市场侧降幅被 BR-L2-009+BR-L2-001 封顶,企业内侧仍有 DED-001 改善,净效果是
      "留在内部甚至更内化"。

      边缘性警告:高可测性格的核心主张("数字化让可标准化的活动更容易外包")与
      日常商业直觉("IT 使外包更可行")高度共振。推论的真正非平凡增量不是"可测的
      能外包",而是①不对称性(市场侧降幅>企业内侧降幅,而非均匀降)、②分叉(低可
      测性活动反而更内化,而非所有活动同向位移)、③可测量性作为新增一阶驱动量的
      因果梯度。这三个增量的可信度全部系于不对称度假说——而不对称度不可直接观测
      (见 red_flag 8 与 should-2)。若不对称度假说被 Occam 剃刀削掉(均匀提升更简约),
      推论降格为"数字化使外包更容易"的常识命题。当前非平凡格【形式上成立】——
      单砖推不出、焊接有增量、格子可被反例填充;但增量本身的认识论地位因不可观测
      中介而被削弱。不判 required,记入 should-2。
      ⇒ 不判。边缘性诚实标注如上。

    measurement_orthogonality: |
      未重蹈 DED-007(攻不穿但附条件)。自变量(活动可测量性:三维度编码,按行业技术
      特征与数据基础设施)与被预测量(企业边界位置:垂直一体化指数/平均企业规模/
      外包渗透率)在概念上异源:可测量性回答"该活动的输入/输出/过程能否被量化",
      边界位置回答"该活动在企业内还是企业外"。不存在 DED-007 式数学恒等式焊死——
      可测量性综合分不是由边界指标算出的函数,边界指标也不是由可测量性算出的函数。

      但有一个隐藏焊点(非 DED-007 级但值得标注):高可测量性行业的量化痕迹(代码
      commit/Git 日志/API 调用/MES 传感器)之所以大量【公开存在】,部分正是因为
      这些行业更碎片化——碎片化产生更多跨组织接口,跨组织接口需要可验证的量化指标
      来协调。也就是说,可测量性的【可观测性】(不等于可测量性本身)可能与边界位置
      有反馈关系。这不构成 DED-007 式的定义焊死——可测量性是"能否被量化"的技术
      属性,不是"当前有多少量化痕迹"——但编码者在实践中依赖"该行业有哪些公开量化
      痕迹"来判断可测量性时,此反馈环可能引入污染。记入 should-4(anti-talisman
      实践可兑现性)。
      ⇒ 不判 required。附条件如上。

    scope_hook_independent_of_result: |
      未命中(攻不穿)。四项 excluded_outcomes:

      (1)"企业作为一种组织形态消亡"——按推论核心主张(分叉而非消亡)事前排除。干净。

      (2)"完全非正式经济中的生产活动(无企业形态可谈)"——按推论射程边界(需有
      '企业边界'可言)事前排除。干净。

      (3)"企业内部管理实践的具体变化(如 OKR/KPI)"——按不同被预测量(边界位置≠
      管理工具选择)的逻辑独立性排除。干净。此条同时也防了一种逃逸:不能用"该企业
      虽未外包但内部管理变得更数据化了"来声称推论预测被满足。

      (4)"平台企业的自身边界(平台公司本身的规模与边界)"——按射程边界(L4 复合
      推论覆盖)事前排除。诚实标注"平台作为协调基础设施的双重身份使分析复杂化"。
      此排除合理——平台既是"市场协调基础设施"(预测 iii 的平台混合形态)又是
      "企业"(自身边界受同一机制约束),将后者留给 L4 是合理的范围管理。但有一个
      次级张力:若平台企业(如 Amazon/Uber/美团)的自身边界变化被用作支持预测(i)
      或(iii)的锚点证据,则排除#4 与锚点使用之间存在潜在循环——平台是"市场协调
      基础设施"还是"企业",取决于你在论证哪一步。当前未发现文件有此循环,记为此处
      的预防性标注。
      ⇒ 不判。四项排除均事前合理。

    criterion_tier_match: |
      未命中(攻不穿但附 should)。可测量性使用三档(高≥0.7/中 0.3-0.7/低<0.3),
      匹配三个预测模式(边界向外/平台混合/向内或不动)。档位数与预测数对齐,未将
      连续量硬切二分。

      但三档阈值(0.7/0.3)为零经验锚定的纯断言——为什么是 0.7 而非 0.8?0.3 而非
      0.4?阈值移动会将边界行业重分类。例如:一个综合分为 0.68 的行业在现行阈值下
      归入"中档"(预测 iii=平台混合),若阈值下调至 0.65 则归入"高档"(预测 i=向外)。
      阈值的选择直接影响验证结果。此缺陷与"等权平均零依据"共享同一根源,记入
      should-1。
      ⇒ 不判 required。记 should-1(阈值+权重零锚定)。

    anti_talisman_cashed: |
      大体兑现,一条 should 级实践可兑现性缺口(对应 verdict_note should-④)。

      【已兑现】四条禁令具体且操作化:(1)禁止由外包率上升反推可测量性必然高——
      可测量性编码必须按行业技术特征在见数据前锁定;(2)禁止由"没外包"反推"信任
      密集"——低外包率可能由管制/资产专用性/路径依赖驱动;(3)禁止用"其实有隐性
      信任维度"消解高可测性未外包的反例——除非该信任维度有独立于边界位置的测量;
      (4)不对称度不可直接测量,推论存活依赖预测(ii)与均匀提升假说竞争。四禁令封死
      了最常见的反向推断逃逸路径。

      【缺口:实践可兑现性】禁令在逻辑上严密,但执行面临"知识污染"问题。可测量性
      编码要求编码者"在看任何行业边界数据前锁定,按行业技术特征与数据基础设施"——
      但编码者(无论是人类专家还是 LLM)都不可避免地拥有"软件行业高度碎片化/API
      经济""法律行业由大型律所主导""制造业有富士康式代工"等常识知识。高可测性
      行业之所以有丰富的公开量化痕迹(GitHub/CI 日志/传感器数据),部分正是因为它们
      更碎片化——碎片化→跨组织接口→对可验证量化指标的需求→更多公开量化痕迹→
      更容易被编码为"高可测性"。这不是 anti-talisman 写得不好——四禁令本身严密。
      问题是执行层面的"知识污染"无法通过措辞消除。这不是 DED-004 式的逻辑循环
      (用结论定义前提),而是相邻的"编码者无法真正盲法"的实践限制——它使可测量性
      编码的独立性在实践中是程度问题而非二元状态。

      建议:诚实标注这一限制,并注册事后检验——若编码者间信度(inter-coder
      reliability,多个独立编码者对同一行业的三维评分)低于 0.7,编码方案需重新校准;
      若信度≥0.7 但编码结果与行业边界常识高度对齐(如所有公认碎片化行业都在高档),
      则不能排除知识污染,推论的经验证据降级为"弱于盲法理想"。
      ⇒ 判 should。不判 required(四禁令框架完整,正向封堵到位)。

    anchor_fact_check: |
      无致命事实错。逐锚:

      锚1(软件/IT:API 经济与开源生态下的垂直解体):大方向正确。npm/PyPI 包的模块
      粒度与跨组织依赖是垂直解体的结构性证据。诚实标注"软件行业同时受网络效应与
      标准化(API 接口的技术标准化降低了资产专用性)驱动,不全是可测量性在起作用"——
      到位。confidence:moderate 合理。
      ⇒ 不判。

      锚2(电子制造代工:富士康/台积电模式):大方向正确——fabless+foundry 模式确实
      是垂直解体的典型案例。但时序主张需订正(对应 should-5):文件称"良率/产能等
      指标的传感器化与数据化时点(1990s-2000s MES+ERP 普及)先于垂直解体加速期"。
      实际上:(a)TSMC 成立于 1987 年,作为全球首家纯晶圆代工厂,其成立本身就是垂直
      解体的事件而非结果;(b)Fabless 先驱 Xilinx(1984)/Qualcomm(1985)/NVIDIA(1993)
      在 MES/ERP 普及前就已存在;(c)垂直解体的主要驱动力是资本成本(现代晶圆厂~$10B/
      座,单一设计公司无力自建)和专业化收益(代工厂的产能利用率远高于垂直整合厂的
      内部产能),可测量性是使能条件(让外包可管理)而非触发条件(导致外包)。当前表述
      暗示的因果方向"可测量性提高→垂直解体"过于线性,更准确的关系是"资本成本+
      专业化→垂直解体;可测量性使这种解体可操作且可管理"。
      ⇒ 判 should(时序订正)。

      锚3(法律服务:AmLaw 100 律所边界稳定):大方向可成立——AmLaw 100 集中度过去
      20 年稳中有升。诚实标注"法律服务受执业许可/地域管辖等管制壁垒保护,部分抵制
      了市场化压力"——到位。confidence:low 合理。但有一个遗漏:ALSP(Alternative
      Legal Service Providers)市场 2023 年已达~$20B、年增 15%+,表明法律服务的
      某些功能(电子取证/文档审查/合同管理)正在被外包/平台化。这与作者"辅助环节
      已部分外包/自动化,但核心判断仍在企业边界内"的论述一致——但 ALSP 正在向上游
      渗透(如 Axiom 提供临时律师派驻、Elevate 提供 managed legal services),边界
      在移动。当前锚将此移动仅标注为"辅助环节",可能低估了外包化速率。不判 required
      (方向自洽,速率争议属程度问题),记录为弱锚的诚实降级已在 confidence:low 中体现。
      ⇒ 不判。

      锚4(管理咨询:MBB 边界稳):大方向可成立——MBB 持续主导战略咨询。低管制+低
      可测性的对照设计合理。但有两个遗漏:(a)专家网络(GLG/AlphaSights/Third Bridge)
      过去十年爆炸式增长,将"知识提供"功能从咨询公司中剥离——客户直接向专家付费
      获取知识,绕过咨询公司。虽然不是战略咨询的全部,但是价值链的部分垂直解体;
      (b)独立咨询平台(Toptal/Catalant/Business Talent Group)为独立咨询师提供匹配
      和声誉基础设施,构成预测(iii)的"平台协调"混合形态。这些趋势若持续,未来可能
      反转此锚的支持方向。当前 confidence:low 已反映不确定性,不判 required。
      ⇒ 不判。

    definition_vs_prediction: |
      未命中核心但附 should(对应 verdict_note should-②)。

      因果链的每一环均设计了攻击面:
      (a)可测量性梯度→不对称度:若高可测性行业的边界位移与低可测性行业无显著差异
      (falsifiability a),此环断裂。独立攻击面存在。
      (b)不对称度→边界分叉方向:若低可测性行业也大规模外包核心业务(falsifiability b),
      不对称性上限被突破。独立攻击面存在。
      (c)不对称度符号:若高可测性行业企业规模反而扩大(falsifiability c),不对称度符号
      反转。独立攻击面存在。

      三个攻击面均可被观测数据独立否决,不是必然为真的定义。条件链中的"可测量性"
      "信任密集度""默会知识密集度"均有独立于"边界位置"的概念定义(虽然实践测量
      有挑战,见 should-4)。

      但【不对称度假说本身不可直接观测】这一事实,使因果链的中间环节(可测量性高→
      市场交易成本降幅>企业内协调成本降幅→活动被拉出企业边界)成为一个"黑箱"——
      只能通过输入(可测量性)和输出(边界位置)的关联来推断黑箱内部的机制,无法直接
      打开验证。这与标准经济学中的"交易成本不可直接测量"问题同源:我们观察企业边界,
      然后推断交易成本差异导致了边界位置,但交易成本差异本身很少被直接测量。
      DED-035 的创新在于将"交易成本差异"替换为"可测量性驱动的协调成本不对称度",
      但不对称度依旧不可直接观测。这使推论的因果主张停留在"与数据一致的解释"层面,
      而非"被直接验证的机制"层面(除非竞争假说被独立拒绝)。记入 should-2。
      ⇒ 不判 required。记 should-2(不对称度不可直接观测的结构性弱点)。

    enumeration_and_species: |
      未命中(攻不穿)。核心驱动量(活动可测量性)是连续梯度,三档仅用于操作化便利。
      预测的三个模式(边界向外/向内/平台混合)按可测量性梯度连续变化,不是离散物种
      分类。不涉及 DED-008 式"声称 N 类可枚举"的问题。

      猎第 4 类:考虑"可测量性高+信任密集+默会知识密集"的活动类型——如审计(高可
      测性+高度信任依赖)。推论在此的预测方向不明确:可测量性高→推向市场,信任密集
      →拉回企业。作者通过 boundary_cases 的 fintech 条目暗示"同一企业内不同活动
      分叉",但此解释对"该活动整体边界移动方向"避而不答——是将活动拆分为子活动
      (核心判断留在内部/可标准化子任务外包),而非给出该活动的净方向预测。这不是
      "新 species 猎到"——推论不声称穷举分类——而是"多力量对冲时推论无净方向预测"
      的结构性特征。在操作化层面,当一个行业同时具备高可测性和高信任密集度时,
      推论(不像 Williamson 的资产专用性那样给出明确方向)实际上不产出可检验的净
      方向预测——这削弱了推论作为"一阶驱动量"的实用性。记入 should-2 的相邻讨论。
      ⇒ 不判。附注如上。

    primary_suspect_aim: |
      指对准确但漏认一条(对应 verdict_note should-② 的相邻讨论)。

      已认账:
      - 不对称度假说本身 vs. 均匀提升假说(primary)——准确。这是最直接的竞争假说。
      - 可测量性编码的可靠性(secondary)——准确。编码者间信度与编码-边界对齐敏感
        度是操作化成败的关键。
      - Coase 基线/THEOREM-hierarchy-depth-limit/AXIOM-002(unlikely)——合理。

      漏认:可测量性编码的可靠性实际上应提升为 co-primary 或至少 elevated secondary。
      理由:如果可测量性编码不可靠(信度低/对阈值敏感/受知识污染),则预测(i)-(iii)
      的经验检验在操作化层面就失败了——不是因为理论错,而是因为"高可测性行业"
      这个自变量无法被可靠识别。当前将其列为 secondary_suspect 低估了它的杀伤力:
      secondary 暗示"如果此环断裂,推论部分修正",但事实上如果可测量性编码不可靠,
      整个推论在操作层面不可检验——这比 asymmetry 假说被 Occam 剃刀削掉更根本,
      因为 asymmetry 至少还能通过竞争假说检验。

      另:作者未列出"多力量对冲时推论无净方向预测"作为 suspect。当可测量性与信任/
      管制/资产专用性指向相反方向时(如审计=高可测性+高信任、制药=高可测性+高管制),
      推论实际上不产出可检验的净方向预测——作者通过拆分活动(核心留在内/辅助外包)
      来消化这些案例,但此消化策略使推论的预测在行业层面不可证伪(任何行业都可以
      通过活动拆分来拟合任何观测模式)。当前反例猎捕未抓到活反例(见 counterexample_
      hunt),部分原因是活动拆分的弹性过大。这不是 DED-004 式循环(拆分本身不依赖
      边界数据),而是"预测单元(活动)的粒度可调→理论的拟合弹性过大→实证风险过低"
      的相邻问题。应至少标注为 known limitation。
      ⇒ 判 should(可测量性编码应提升为 co-primary 或 elevated secondary;
        多力量对冲无净预测标注为 known limitation)。

    caliber_complete_registration: |
      命中两条 should(对应 verdict_note should-① 和 should-③)。

      【已注册】
      - 可测量性:三维度(输出/输入/过程),等权平均,三档(≥0.7/0.3-0.7/<0.3)。
        阈值和档位已注册。
      - 企业边界:三指标(垂直一体化指数=增加值/总产出;平均企业规模=雇员数或营收;
        外包/平台渗透率=外部供应商交易额占比)。三个分子/分母口径已注册。
      - anti-talisman 禁止事后口径选择(第 11 条判例 L4-009)。

      【缺口一:权重与阈值零锚定(should-①)】"三维等权平均"是纯断言——不同行业
      的三维权重天然不同(作者自认 limitations),但未提供等权的任何辩护(如"在缺乏
      行业特定权重证据时,等权是无信息先验"或"三维的方差-协方差结构支持等权作为
      稳健起点")。档位阈值(0.7/0.3)同样是纯断言——无校准依据、无敏感性分析计划。
      阈值移动会将边界行业重分类并改变预测验证结果。这些参数可以暂定为初始工作值,
      但需要:事前辩护(为什么选这些值而非其他)、或诚实降级为"初始假设待行业数据
      校准"、或预注册敏感性分析(检验结果对 0.6-0.8/0.2-0.4 范围内的阈值变化是否
      稳健)。

      【缺口二:外包渗透率数据源模糊(should-③)】"按交易额统计,来源=行业报告/学术
      调查"——这是类别描述而非数据源注册。不同报告对同一行业的外包率估计可以相差
      数倍(例如:IBISWorld vs. Statista vs. 行业协会自报 vs. 学术调查)。当前注册
      状态允许在见数据后从多个可能的"行业报告/学术调查"中选择最支持预测的那个,
      这正是第 11 条判例(L4-009)试图阻止的事后口径选择。应与另两个指标对标:垂直
      一体化指数的数据源明确(投入产出表——通常是国家统计局编制的供给使用表),
      平均企业规模的数据源也相对明确(统计年鉴/经济普查)。外包率应锁定至少一个
      具体数据源(按行业),或诚实标注"待数据源锁定,在见任何边界数据前完成注册"。

      【缺口三(边缘)】"平均企业规模"的"控制行业总规模"缺少操作性细节——是回归
      残差(企业平均雇员数~行业总雇员数的 log-log 回归取残差)?还是比值(企业平均
      雇员数/行业总雇员数)?还是分位数匹配?不同方法产生不同结果。建议注册具体方法。

      ⇒ 判 should(权重+阈值零锚定;外包率数据源模糊)。不判 required(阈值和权重
        属于可校准参数,外包率数据源可补充锁定,均不使推论不可证伪)。

    data_source_independence: |
      未命中(攻不穿)。三个边界指标的数据来源:
      - 垂直一体化指数:投入产出表(国家统计局/统计机构编制)
      - 平均企业规模:经济普查/统计年鉴/商业登记数据
      - 外包/平台渗透率:行业报告/学术调查

      三者的底层数据来源不同(投入产出表来自企业调查+行政记录;企业规模来自商业
      登记或普查;外包率来自行业专项调查)。不存在 CNBS/WB/IMF 式的"不同机构共享
      同一底层数据"的同根问题。
      ⇒ 不判。

    api_as_epistemic_independence: |
      未命中。DED-035 不涉及 API/MCP 工具可达性被用作独立性论据。evidence 段
      未出现"可通过 XX API 查询"作为多源验证主张。
      ⇒ 不判。

  counterexample_hunt: |
    【猎捕策略】四条独立攻击路径:
    α:高可测性行业企业规模未缩小/垂直一体化未下降(falsifiability a/c 的反例);
    β:低可测性+信任密集型行业出现系统性核心业务外包(falsifiability b 的反例);
    γ:可测性相似但管制/资产专用性不同的两个行业,边界位移方向相反→可测量性
      非一阶驱动量;
    δ:活动拆分弹性过大→任何行业观测均可通过调整活动粒度来拟合推论。

    【猎获】

    会计/审计(Big Four:高可测性+高信任+高管制→极端集中,非碎片化):
    审计/会计是可能可测量性最高的专业服务(GAAP/IFRS 标准化、审计程序规范化、
    工作底稿可追踪、产出=审计意见/财报→量化)。若预测(i)成立(高可测性→碎片化),
    应观察到审计行业垂直解体、小事务所占比上升。现实:Big Four(Deloitte/PwC/EY/
    KPMG)审计~99% S&P 500 公司,行业从 Big Eight 合并至 Big Four,集中度持续上升。
    消化:审计同时是高度信任密集型(投资者依赖审计意见)且受严格监管(SOX/PCAOB/
    执业许可)。推论通过"信任+管制压过可测量性"来消化此案例——与 fintech 边界
    案例逻辑一致(同一企业内活动分叉:审计的数据分析/确认函处理→可外包或自动化;
    审计的职业判断/风险评级→留在内部)。此消化自洽,但揭示一个问题:当可测量性
    与信任/管制指向相反方向时,推论不产出该活动整体边界方向的净预测——而是诉诸
    "活动拆分"。这使推论的行业层面可证伪性降低:任何行业的观测都可通过活动拆分
    来拟合(外包了的部分=可测的子活动,留在内部的部分=信任密集的子活动),而无需
    事前指定哪些子活动属于哪类。
    ⇒ 消化(非净杀)。暴露"活动拆分弹性"的结构性问题。

    农业(精准农业→高可测性+农场剧烈合并,非碎片化):
    过去 30 年,农业的可测量性因精准农业技术(卫星影像/土壤传感器/GPS 导航/产量
    制图/可变速率施肥)而大幅提高。同时期农场规模在美国/巴西/欧洲均大幅增长
    (美国平均农场面积从~400 英亩增至~450 英亩,大型农场(>2000 英亩)占比翻倍),
    垂直一体化加深(种子→种植→贸易→加工→零售,Bayer-Monsanto/Cargill/ADM)。
    消化:农业合并由生产规模经济(大型机械效率/议价能力/作物保险逻辑)和资本市场
    (农田金融化)驱动,不属于推论射程内的"协调成本"机制。此消化诚实(推论自认
    不否认 Williamson 维度),但也诚实暴露:在不同行业中,生产规模经济/资本密集度
    /管制等"其他因素"的效应量级可能远大于可测量性驱动的协调成本不对称,使推论
    在行业比较中的独立解释力有限——需要用残差方法(先控制其他因素,再看可测量性
    的边际效应)来检验,而非裸比较。
    ⇒ 消化(非净杀)。暴露"其他因素量级可能>>>可测量性效应"。

    软件/Big Tech(高可测性+巨头同时扩张):
    软件是可测量性最高的行业之一,推论预测碎片化。但同时 Google/Meta/Microsoft/
    Amazon/Apple 在过去 20 年大规模扩张(员工数/营收/业务线),且垂直整合加深
    (Amazon:零售→物流→云计算→娱乐;Google:搜索→硬件→云计算→AI;Apple:
    设计→零售→芯片→服务)。消化:(a)Big Tech 的扩张主要集中在平台型业务——网络
    效应驱动集中,与推论预测(iii)"平台协调"而非预测(i)重叠;(b)Big Tech 同时
    也在大量外包(Apple 的制造→富士康,Amazon 的配送→第三方物流,Google 的内容
    审核→外包团队),所以同一企业内存在分叉。消化自洽但再次使用"活动拆分"策略。
    ⇒ 消化(非净杀)。"活动拆分"再次被使用——此为贯通三个候选反例的模式。

    管理咨询 ALSP/专家网络/独立平台(低可测性→新兴碎片化趋势):
    作者以 MBB 持续主导作为预测(ii)的锚。但过去 10-15 年出现了显著的反向趋势:
    (a)专家网络(GLG 2023 年收入~$700M,AlphaSights/Third Bridge 快速增长)——将
    "行业知识提供"功能从传统咨询公司中剥离,客户直接向专家付费;(b)独立咨询平台
    (Catalant/Toptal/Business Talent Group)——为独立咨询师提供匹配和声誉基础设施:
    这正是预测(iii)"平台协调"的形态;(c)AI 分析工具(LLM 驱动的市场分析/竞争情报/
    战略模拟)正在侵入战略咨询的某些分析环节。若这些趋势持续且扩大至战略咨询的
    核心(而不仅是辅助/执行层),预测(ii)将被削弱。当前规模尚不足以推翻(ii)——MBB
    收入仍在增长且主导战略层——但方向值得标注。此候选未净杀但提示:低可测性行业
    的边界并非"不动",而是"移动得更慢";"不动"vs"移动慢"的区分在有限时间窗内
    极难做——20 年的行业数据可能不够区分"真正的结构稳定"与"慢速外包"。这是
    falsifiability(b)的低可测性问题(需要极长面板数据才能可靠区分)。
    ⇒ 消化(非净杀)。暴露预测(ii)检验对时间窗长度的敏感性。

    【额外猎取:活动拆分弹性——贯通模式】
    所有四个候选反例的消化策略共享一个模式:将行业拆分为"核心活动"(留在内部=
    信任/默会密集)和"辅助活动"(外包=可测),然后声称推论预测了这种拆分。此策略
    在逻辑上自洽——推论确实预测了同一企业内不同活动的分叉。但问题是:拆分的事后
    灵活性使推论在行业层面的可证伪性显著低于文件声称的水平。因为任何一个行业X,
    无论其整体边界是向外(碎片化)还是向内(集中),都可以通过"X 的外包部分是可测
    子活动,X 的内部部分是信任/默会子活动"来解释——无需事前指定哪些子活动属于
    哪类。这不是 DED-004 式的逻辑循环(拆分的判据=可测量性,而可测量性需独立编码),
    但它是相邻的"预测粒度可调→拟合弹性大→实证风险低"问题。建议:为至少一个行
    业事前(在看该行业边界数据前)注册完整的子活动拆分表,指定哪些子活动属于"预测
    应外包"、哪些属于"预测应留内部",然后用该行业数据检验——而不是在看见行业
    数据后再决定如何拆分。

    【结论】无净杀。四个候选反例均被消化(会计→trust+regulation 对冲;农业→生产
    规模经济主导;软件→平台网络效应+活动拆分;咨询→趋势未达阈值+活动拆分)。
    但猎捕揭示了一个贯通模式——"活动拆分弹性"使推论在实践中比文件声称的更难被
    行业层面的证据意外证伪。这不是逻辑缺陷(推论在逻辑上可证伪,见 falsifiability
    a/b/c),而是"预测单元粒度灵活→拟合弹性大"的实践问题。记入 should 的相邻讨论。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发】。

    推论的 falsifiability(a)(b)(c)均有操作化的检验条件:
    (a)可测量性梯度无预测力——跨行业统计检验,可观测数据可推翻。
    (b)低可测性行业也大规模外包核心业务——可观测数据可推翻。
    (c)高可测性行业企业规模反而扩大——可观测数据可推翻。

    anti-talisman 四禁令封死了正向推断路径:
    (1)禁外包率高→反推可测量性高。(2)禁没外包→反推信任密集。
    (3)禁用"隐性信任维度"消解反例。(4)禁对不对称度做反事实推断。

    与 DED-004 的根本差异:DED-004 的核心问题是逻辑上不可证伪(用结论定义前提→
    永远为真)。DED-035 的逻辑结构可证伪——falsifiability(a)(b)(c)是可由观测数据
    拒绝的真条件。anti-talisman 四禁令阻止了最常见的反向推断逃逸路径。

    相邻风险(非 DED-004 级,但值得标注):
    (i)"活动拆分弹性"(见 counterexample_hunt 贯通模式):预测单元(活动)的粒度可调,
    使行业层面的证伪比文件声称的更困难——任何行业观测都可以通过拆分活动来拟合。
    这不是逻辑循环(拆分的判据=可测量性,需独立编码),但它是相邻的"拟合弹性大→
    实证风险低"问题。
    (ii)anti-talisman 第(3)条的反向缺口:禁了"用信任维度消解高可测性行业未外包
    的反例"(正向),但未对称禁止"用可测量性消解低可测性行业已外包的反例"——即
    若低可测性行业出现了某些外包,不可以说"哦那说明外包的那部分其实可测性挺高的"。
    当前第(2)条部分覆盖了此点(禁止由没外包反推信任密集),但未覆盖"出现了外包
    就把它重编码为可测性子活动"的对称方向。

    ⇒ DED-004 未复发。相邻风险如上,记入 should 讨论。

    DED-007(测量轴焊死):【未复发】。

    自变量(可测量性:三维度编码,按行业技术特征)与被预测量(边界位置:垂直一体化
    指数/平均企业规模/外包渗透率)在概念上异源。不存在 DED-007 式数学恒等式——
    可测量性综合分不是由边界指标计算的函数,边界指标也不是由可测量性计算的函数。
    可测量性回答"该活动能否被量化",边界位置回答"该活动在哪里做"——二者是不同
    概念域的变量。

    唯一的软接触面:高可测性行业的量化痕迹之所以公开存在,部分是因为碎片化(碎片化
    →跨组织接口→需要可验证指标)。但这不等于 DED-007 的测量轴焊死——可测量性是
    技术可能性(能否量化),不是当前的量化痕迹存量(有多少公开量化数据)。编码者若
    严格按"技术可能性"而非"当前公开痕迹的丰富度"编码,此软接触不构成焊死。

    ⇒ DED-007 未复发。

  required_fixes: []

  should_fixes:
    - |
      [should-1] 可测量性三维等权平均+阈值(0.7/0.3)补充事前辩护或诚实降级(对应
      verdict_note should-①)。
      修订位置:operationalization → activity_measurability → measurement 段末尾。
      修订方案(三选一或组合):
      (a)补充等权的事前辩护:"在缺乏行业特定维度权重证据时,等权是无信息先验
      (principle of indifference);若后续行业研究提供维度权重估计(如咨询业的输出
      权重<输入权重),权重方案可按新证据更新,更新前需预注册。"
      (b)补充阈值的事前锚定:"0.7/0.3 对应三档的等宽划分(1.0/3≈0.33),取整后为
      0.3 和 0.7。若使用等宽逻辑,阈值的选择依据是'无先验理由偏斜划分'。"
      (c)诚实降级为暂定值+预注册敏感性分析:"上述权重和阈值为初始操作化假设,
      待行业编码数据积累后校准。验证时预注册敏感性分析:检验预测(i)-(iii)对阈值
      在 [0.6,0.8] 和 [0.2,0.4] 范围内的变化是否稳健;若结果对阈值选择敏感,推论
      的置信度需降级。"
    - |
      [should-2] 不对称度不可直接观测——从前台 limitation 升级为结构性弱点声明,
      并标注"预测单元粒度可调"的相邻风险(对应 verdict_note should-② + counterexample_
      hunt 贯通模式)。
      修订位置(两处):
      (a)falsification_trace.primary_suspect 末尾增加独立条目:"(3)不对称度假说本身
      不可直接观测——推论存活依赖于竞争假说(均匀提升/管制驱动)被独立拒绝。这是
      一种比直接机制检验更弱的认识论地位:即使预测(i)-(iii)被数据确认,不对称度
      仍只是'与数据一致的候选解释之一'而非被验证的因果机制。推论的实证分量应
      如实标注为'moderate'(竞争假说检验)而非'strong'(直接机制验证)。"
      (b)falsifiability 段末尾增加 limitation 声明:"【预测单元粒度的诚实标注】
      推论预测活动层面的分叉(同一企业内可测子活动外包、信任密集子活动留在内部)。
      此预测在逻辑上可检验,但在实践中,若不在看行业数据前事前注册完整的子活动拆分
      表(指定哪些子活动应外包、哪些应留内部),则事后活动拆分存在弹性——任何行业
      观测都可通过调整拆分来拟合推论,降低推论的实证风险。建议:为至少一个行业注册
      事前子活动拆分表作为示范,并注册该行业的外包/内化验证结果。"
    - |
      [should-3] 外包/平台渗透率锁定具体数据源(对应 verdict_note should-③)。
      修订位置:operationalization → firm_boundary_position → measurement 段,
      指标(c)"外包/平台渗透率"。
      修订方案(二选一):
      (a)锁定具体数据源:"按交易额统计。优先数据源:(i)对于美国行业,使用 IBISWorld
      的 Outsourcing & Procurement 报告或 Statista 的 BPO/outsourcing 分类数据;
      (ii)对于中国行业,使用国家统计局的投入产出表(中间投入中外包的占比)或
      中国物流与采购联合会的供应链外包报告;(iii)对于欧洲行业,使用 Eurostat 的
      business services 分类。以上数据源的选取在看任何边界数据前锁定。"
      (b)诚实标注:"外包/平台渗透率的具体数据源尚未锁定——当前仅注册测量口径
      (按交易额统计)和来源类别(行业报告/学术调查)。数据源的最终锁定不晚于下一轮
      审查(r2),且在看任何行业的边界位移数据前完成。"
      另建议:修正"平均企业规模"的"控制行业总规模"的模糊性——注册具体方法(如
      "企业平均雇员数/行业总雇员数"作为规模标准化比值,或"log(企业平均雇员数)~
      log(行业总雇员数)回归取残差")。
    - |
      [should-4] anti-talisman 实践可兑现性——标注"知识污染"限制并注册事后检验
      (对应 verdict_note should-④)。
      修订位置:anti_talisman_clause 末尾,新增一条坦诚声明。
      修订方案:"【实践可兑现性诚实标注】上述禁令在逻辑上严密,但可测量性独立编码
      面临'知识污染'的实践限制:编码者(无论人类或 LLM)不可避免地拥有行业边界常识
      (如'软件=碎片化''法律=大律所主导'),高可测性行业的公开量化痕迹的丰富度本身
      部分由其碎片化程度决定。因此可测量性独立编码的'独立性'在实践中是程度问题
      而非二元状态。事后检验:(a)若采用多编码者独立编码,编码者间信度(inter-coder
      reliability,ICC 或 Krippendorff's alpha)<0.7,则编码方案需重新校准;
      (b)若信度达标但编码结果与行业边界常识高度对齐(如所有公认碎片化行业均落在
      高档),则不能排除知识污染,推论的经验证据诚实标注为'弱于盲法理想'。"
    - |
      [should-5] 电子制造代工锚的时序主张订正(对应 verdict_note should-⑤)。
      修订位置:real_world_anchors → supporting → 锚2(电子制造代工) → evidence 段。
      修订方案:将"良率/产能等指标的传感器化与数据化时点(1990s-2000s MES+ERP 普及)
      先于垂直解体加速期,方向与推论一致"订正为:"Fabless-Foundry 模式的垂直解体
      始于 1980 年代中后期(TSMC 1987 年成立为首家纯代工厂;Xilinx 1984/Qualcomm
      1985/NVIDIA 1993 为 Fabless 先驱),早于 MES/ERP 的广泛普及(1990s-2000s)。
      垂直解体的主要驱动力是资本成本(晶圆厂~$10B/座)和专业化收益,可测量性的
      贡献更可能是【使能条件】(让代工模式在操作上可管理:良率/产能/交付可追溯)
      而非【触发条件】(导致垂直解体)。推论与该锚的关系修正为:可测量性高的行业
      特征使垂直解体【可操作且可规模化】,但解体本身由资本成本+专业化触发——
      这与推论的'可测量性是一阶驱动量之一(非唯一)'的主张一致,但因果方向不如
      原文暗示的直接。"

round_2:
  reviewer: "独立对抗审查者 (round 2, 全新上下文, 与作者及 r1 审查者无关)"
  verdict: needs_revision
  verdict_note: |
    本轮核心任务是评估 r1 五条 should 级缺陷的修复是否到位、以及修复本身是否引入新
    缺陷。总体判断:五条修复方向正确,其中三条(①权重/阈值诚实标注+敏感性分析承诺、
    ④anti-talisman 知识污染诚实标注+信度检验、⑤电子制造锚因果方向订正)到位;
    两条修复不完整——②不对称度升级为结构性弱点的修复漏掉了 r1 明确要求的"预测单元
    粒度可调→事前注册子活动拆分表"承诺;③外包率数据源从"行业报告/学术调查"进步到
    "候选锁定源(BEA/BLS/IBISWorld/Statista 等)",但仍未锁定,属"承诺锁定"而非
    "已锁定"——与评分开第 11 条"一次性注册"的精神有落差。

    此外,本轮独立红旗审查发现一条新 should 级缺陷:可测量性三维等权平均在 fix ①的
    敏感性分析中只覆盖了阈值移动(±0.1),未覆盖权重方案变动(如咨询业的输出权重 0.2
    +输入 0.5+过程 0.3 vs.等权 0.33/0.33/0.33)——权重变动同样会将边界行业重分类。
    敏感性分析计划应同时覆盖权重与阈值两个维度。

    反例猎捕无净杀。EDA 行业(Synopsys/Cadence 寡头,极高可测性却高度集中)被消化
    为网络效应+沉没成本主导,但消化策略延续了 r1 揭示的"活动拆分弹性"模式。云计算
    (IaaS 三巨头寡头)被 excluded_outcomes#4(平台企业自身边界)豁免。医疗(美国医院
    大规模垂直整合,同时存在远程医疗碎片化)再次展示活动拆分的双向消化能力。贯通模式
    确认:推论在行业层面的可证伪性因"活动拆分+其他因素+时滞"三重弹性而显著低于文件
    声称水平——这不是逻辑缺陷(DED-004 未复发),是实践检验的实证风险低。

    综合:核心机制未塌、无 brick=conclusion、反例无净杀、DED-004/007 未复发。
    两条 r1 修复不完整+一条新 should 挡住 verified。三条均为 should 级,可靠定向修订
    救活。

  red_flag_findings:
    brick_conclusion: |
      【r2 复核】重新逐砖原文核查,确认 r1 结论维持:无任何承重砖(DED-001/BR-L2-010/
      BR-L2-009/BR-L2-001/DED-006)含有"企业边界按可测量性分叉"或近义表述。DED-001
      只讲层级天花板;BR-L2-010 是 capability 命题(制度能替代信任);BR-L2-009 是
      "信任有界衰减"的组织中性命题;BR-L2-001 是认知约束命题;DED-006 的预测域是制度
