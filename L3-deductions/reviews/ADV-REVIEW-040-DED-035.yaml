      进一步加固了正交性——通过"至少一位编码者来自不熟悉该行业边界现状的领域"降低了
      编码侧的隐性焊点风险。r1 指出的"可测量性的可观测性与边界位置有反馈关系"软接触
      面因 fix ④的部分缓解。
      ⇒ 未命中(攻不穿)。无 DED-007 复发。

    scope_hook_independent_of_result: |
      【r2 复核】四项 excluded_outcomes 均未被任何 fix 修改,维持 r1 的"干净"判定。
