      ⇒ 未命中(攻不穿)。

    criterion_tier_match: |
      【r2 复核】三档(高≥0.7/中 0.3-0.7/低<0.3)匹配三个预测方向,未将连续量硬切二分。
      fix ①将阈值从纯断言降级为"暂定操作值+敏感性分析承诺+若阈值敏感则推论被拒绝"——
      这是从"未注册"到"诚实注册为暂定"的实质性进步。但敏感性分析计划仅覆盖阈值
