      格(低可测量性, 边界向内/不动)——非平凡格维持。格的不对称来源(BR-L2-009+
      BR-L2-001 封顶市场侧降幅)未受任何 fix 影响。
      r1 的边缘性警告(非平凡增量系于不可观测的不对称度假说)因 fix ②的结构性弱点
      诚实标注而更透明,但格的非平凡性【在形式上】仍然成立——焊接有增量、单砖推不出。
      ⇒ 未命中(攻不穿)。边缘性警告因 fix②诚实标注而缓解但未消除。

    measurement_orthogonality: |
      【r2 复核】自变量(可测量性三维度编码)与被预测量(边界位置三指标)在概念上异源,
