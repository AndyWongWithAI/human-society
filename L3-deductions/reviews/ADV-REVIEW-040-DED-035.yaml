      registration。
      ⇒ 未命中 required。记新 should(敏感性分析需覆盖权重维度)。

    anti_talisman_cashed: |
      【r2 复核——核心关注 flag,因为 fix ④针对性修复了 r1 的 should-4】

      r1 判:四条禁令逻辑严密,但执行层面存在"知识污染"——编码者无法真正盲法,高可测
      性行业的公开量化痕迹丰富度部分来源于其碎片化程度→可测量性独立编码的"独立性"
      是程度问题而非二元状态。

      fix ④内容:(a)诚实标注了知识污染——"编码者即使'不看边界数据',也无法免疫'该行业
      以碎片化/外包化著称'这一常识知识——此为知识污染,无法通过措辞完全消除";
      (b)注册了事后检验——"若编码者间信度(inter-coder reliability)低于0.7,编码方案
      需重新校准";
      (c)要求至少一位编码者来自不熟悉该行业边界现状的领域。

      评估:方向正确且诚实。三条措施在逻辑上构成对知识污染问题的实质性缓解——
      (a)承认不可消除=诚实;(b)信度门槛 0.7=有客观失败标准;(c)不熟悉领域的编码者=
      降低常识污染。但有三点剩余担忧:

      其一,信度≥0.7 且所有公认碎片化行业都在高档时,fix ④未包含 r1 建议的"推论的经验
      证据降级为'弱于盲法理想'"的后备声明——当前措辞只处理了"信度<0.7→重新校准"的
      情况,未处理"信度达标但污染仍在"的情况。这是遗漏,但属 should 级(不使推论不可检验)。

      其二,inter-coder reliability 0.7 阈值本身是另一个零经验锚定——为什么是 0.7
      而非 0.8?虽然 0.7 是社会科学常规阈值(有学科惯例支撑,与前处的纯断言有本质区别),
      但 fix ①中对可测量性阈值零锚定的诚实精神应对称应用于此:标注 0.7 是"学科惯例
      阈值,非本推论特定校准"。此为微小遗漏,不单独记 should。

      其三,fix ④与 fix ①(fix ①的敏感性分析承诺只提阈值不提权重)的交互:若权重方案
      变动,同一行业的三维综合分会变→档位归属会变→可测量性编码的"可靠性"不仅取决于
      编码者信度,还取决于权重方案的选择。当前 fix ③未考虑此交互。记入新 should-②。

      综合:fix ④针对 r1 should-4 的修复到位(诚实+M→可操作检验),剩余担忧为 should
      级小修小补,不构成 required。r1 的 should-4 可视为已关闭。
      ⇒ 判 should 已修复,附带两条微小剩余标注(不单独记 should)。

    anchor_fact_check: |
      【r2 复核——逐锚核查,重点关注 fix ⑤(电子制造锚)是否引入新事实错】

      锚1(软件/IT:API 经济下的垂直解体):未被修改,维持 r1 的 moderate confidence。
      未发现新事实错。
      ⇒ 不判。

      锚2(电子制造代工:fix ⑤修复):原始表述的时序错误已被修正。当前表述:
      (a)TSMC 1987 成立,为首家纯代工厂——事实正确;
      (b)Fabless 先驱 Xilinx 1984/Qualcomm 1985/NVIDIA 1993 早于 MES/ERP 普及
      (1990s-2000s)——事实正确;
      (c)资本成本(~$10B/座)+专业化是主要驱动力——大致正确(现代先进制程晶圆厂
      ~$10-20B,1987 年 TSMC 首厂~$200M,量级跨越极大但方向正确);
      (d)"可测量性=使能条件(enabler)非触发条件(trigger)"——因果方向现诚实,
      与推论的"可测量性是一阶驱动量之一(非唯一)"立场自洽。
      修复到位。未引入新事实错。confidence:moderate 维持合理。
      ⇒ 不判。

      锚3(法律服务:AmLaw 100 边界稳定):未被修改。r1 标注的 ALSP 市场增长(~$20B,
      年增 15%+)持续有效,但 anchor 已通过 confidence:low 部分反映。未发现新事实错。
      需注意:2024-2026 AI 法律工具(如 Harvey AI, CoCounsel)的爆发式增长可能加速
      法律服务外包化,但此为新近趋势尚未形成系统性证据,不构成当前的事实错。
      ⇒ 不判。

      锚4(管理咨询:MBB 边界稳):未被修改。r1 标注的专家网络(GLG ~$700M)和独立咨询
      平台(Catalant/Toptal)趋势持续。confidence:low 合理。未发现新事实错。
      ⇒ 不判。

      综合:fix ⑤修复到位,四锚均无事实错。r1 的 should-5 可视为已关闭。

    definition_vs_prediction: |
      【r2 复核】因果链三个攻击面(falsifiability a/b/c)维持可被观测数据独立否决,
      未因任何 fix 变为必然为真的定义。fix ②的结构性弱点声明——不对称度假说本身
      不可直接观测,推论存活依赖竞争假说被独立拒绝——是认识论地位的诚实降级,而非将
      预测变为定义。相反,诚实承认"即使预测(i)-(iii)全部被数据确认,不对称度假说仍
      只是候选解释之一"使推论比此前(隐含声称"这是因果机制")更诚实、更可检验——因为
      它明确指出了验证因果机制所需的额外步骤(独立拒绝竞争假说)。
      ⇒ 未命中(攻不穿)。fix ②的诚实标注使此 flag 的评估比 r1 更有利。

    enumeration_and_species: |
      【r2 复核】驱动量(可测量性)是连续梯度,三档仅用于操作化便利。三预测模式沿梯度
      连续变化,非离散物种分类。不涉及 DED-008 式"声称 N 类可枚举"。

      猎第 4 类(r1 已猎的"高可测性+高信任"混合型):依然存在。fix ②和 fix ④均未
      解决 r1 提出的"多力量对冲时推论无净方向预测"问题——当可测量性与信任/管制/
      资产专用性指向相反方向时,推论诉诸活动拆分(核心留内+辅助外包)来消化,但不产出
      该活动整体的净方向预测。这不是第 N+1 类未被枚举(推论不声称穷举),而是"预测
      单元的粒度灵活→行业层面证伪困难"的相邻问题,记入 counterexample_hunt 贯通模式。
      ⇒ 未命中(攻不穿)。相邻问题见 counterexample_hunt。

    primary_suspect_aim: |
      【r2 复核】文件自认的最弱腿(falsification_trace):
      primary_suspect:不对称度假说 vs.均匀提升假说——准确,fix ②进一步诚实标注了
        认识论地位。
      secondary_suspect:可测量性编码可靠性——在当前文件状态下(经 fix ①+fix ④修复),
        定位为 secondary 已大致合理。fix ① 的敏感性分析承诺和 fix ④ 的信度检验
        共同降低了编码可靠性的威胁等级。但 r1 指出的"多力量对冲时推论无净方向预测"
        作为 known limitation 应列入 suspect 清单,当前未列入——见 should-1(续)。

      平凡化检查:推论的非平凡内核(不对称性+分叉+可测量性梯度)经上位/泛化后是否
      被稀释为常识?不对称性≠"数字化降低交易成本"(常识)——后者不预测分叉方向;
      分叉≠"有些行业外包多"(常识)——后者不给出可测量性作为判据;可测量性梯度≠
      "能标准化的就能外包"(常识)——后者不预测不对称降幅、不预测低可测性行业边界
      稳定甚至扩大。三个增量在上位泛化后各自与相邻常识有共振但不被其平凡覆盖。
      ⇒ 未命中(攻不穿)。记一条新 should:"多力量对冲无净方向预测"应列入 known
        limitation(见 should-1)。

    caliber_complete_registration: |
      【r2 复核——重点关注 flag,涉及 fix ①和 fix ③】

      已注册(自 r1 后无变化):可测量性三维度+三档、企业边界三指标(垂直一体化指数
      /平均企业规模/外包渗透率)、anti-talisman 禁止事后口径选择。

      fix ① 修复评估:权重与阈值的诚实标注+敏感性分析承诺是实质性进步。从"纯断言"
      升级为"暂定操作值,承诺事前编码+敏感性分析+若阈值敏感则推论被拒绝"——这满足
      了红旗第 11 条的精神(参数被注册、不确定性被标注、失败条件被预定义)。敏感性
      分析计划覆盖了阈值变动(±0.1),但未覆盖权重方案变动。

      【新 should-②】敏感性分析须同时覆盖权重维度。等权(1/3 each)是暂定假设,
      行业特定权重(如咨询业输出可测性天然低→输出权重应下修)可能产生不同的综合分
      与档位归属。当前敏感性分析承诺仅提及"阈值在±0.1范围内变动时,预测方向是否
      稳定",未提"权重方案从等权变为行业特定加权时,档位归属与预测方向是否稳定"。
      这与 fix ①本身的诚实精神不一致——既然承认"不同行业的三维权重可能不等",
      就应对权重方案做同样的敏感性分析。修订:在 limitations 的敏感性分析承诺中增加
      权重维度,如"权重方案从等权变为行业特定加权(输入/输出/过程各±0.15)时,档位
      归属与预测方向是否稳定;若权重变动导致>30%行业重分类,权重方案需事前注册行业
      特定权重而非等权。"

      fix ③ 修复评估:从"来源=行业报告/学术调查"升级到"候选锁定源:投入产出表
      (BEA/BLS/国家统计局)的中间投入/总产出比、IBISWorld/Statista 行业外包率报告、
      行业协会年报中的外包支出项"——这是实质性进步,从类别描述进到具名数据源。
      但当前状态是"候选锁定源"+"锁定方案须在下一轮审查前注册"——这是承诺锁定而
      非已锁定。红旗第 11 条的判例(L4-009)精神是"事前一次性注册,事后不可按结果
      选择口径"——"下一轮审查前注册"仍然为 r2→r3 之间的事后选择留了一道缝:若
      作者在 r2 裁决后、r3 审查前看到了某些行业边界数据,仍可在"注册"时选择对该
      数据最有利的数据源。这不是说作者会这么做,而是说"承诺锁定"在结构上没有
      "已锁定"的防事后选择效力。

      【should-1(续 r1 should-3)】外包/平台渗透率的数据源应在本轮(而非"下一轮
      审查前")锁定。当前候选列表(BEA/BLS/IBISWorld/Statista/行业协会年报)足够具体,
      可从中选定首选源+后备源。锁定动作本身不依赖任何待获取数据——它是选数据源,
      不是收集数据。若因不确定数据可用性而犹豫,策略可以是:先锁定首选源+后备源+
      后备后备源三级,而非推迟锁定决策。

      r1 的边缘缺口(三):"平均企业规模"的"控制行业总规模"缺乏操作性细节——未被
      修复。当前仍为"控制行业总规模"六字,未指定方法(比值?回归残差?分位数匹配?)。
      此缺口在 r1 被标为"边缘",不单独记 should,但应在本轮一并修复。
      ⇒ 判两条 should:新 should-②(权重敏感性分析) + should-1(外包率数据源锁定+
        企业规模控制方法注册)。不判 required(均可通过参数注册修复)。

    data_source_independence: |
      【r2 复核】三边界指标的数据底层来源不同(投入产出表←企业调查+行政记录;
      企业规模←商业登记/普查;外包率←行业专项调查)。不存在 CNBS/WB/IMF 式"不同
      机构共享同一底层数据"的同根问题。fix ③的候选数据源(BEA/BLS/IBISWorld/
      Statista)各自独立采集,不共享原始数据收集管道。
      ⇒ 未命中(攻不穿)。

    api_as_epistemic_independence: |
      【r2 复核】DED-035 全文无"可通过 XX API 查询"作为多源验证主张。fix 均未引入
      API 可达性论据。
      ⇒ 未命中(攻不穿)。

  counterexample_hunt: |
    【猎捕策略——r2 独立猎捕,四个新攻击路径】
    α:高可测性+集中度上升的行业(r1 已猎软件/农业/会计,r2 猎新目标避免重复);
    β:低可测性+出现系统性碎片化的行业(r1 已猎咨询 ALSP,r2 猎新目标);
    γ:同一行业可测性提高但边界反向移动(时间序列反例);
    δ:活动拆分弹性——贯通 r1+r2 所有消化案例的模式确认。

    【猎获】

    EDA/电子设计自动化(Synopsys/Cadence/Siemens EDA——极高可测性+寡头集中):
    EDA 是芯片设计软件,其"活动可测量性"可能是所有行业中最高之一:输入(工程师
    工时/license 使用量)/过程(Git 版本控制/仿真日志/CI 流水线)/输出(设计文件/
    验证报告)全部数字化、可追踪、可量化。推论预测(i):高可测性→垂直解体、企业
    平均规模缩小。现实:EDA 行业由三家寡头垄断(Synopsys~35%/Cadence~30%/Siemens
    EDA~15%),Synopsys 2024 年以~$35B 收购 Ansys——大规模垂直整合而非解体。
    消化尝试:(a)EDA 的网络效应极强(工具链锁定→高切换成本,与推论预测(iii)"平台
    协调"有重叠);(b)EDA 的"可测量性"虽然是技术上的高,但"资产专用性"极高
    (工程师的 tool-specific 人力资本→Williamson 维度主导);(c)EDA 是"平台型
    产品"——工具链本身就是协调设计+制造的平台基础设施,相当于是"协调基础设施"
    而非"被协调的活动"。
    消化成立但不干净:(c)的"平台基础设施"逻辑与 excluded_outcomes#4(平台企业
    自身边界)形成豁免共振——几乎所有高固定成本+高可测性的数字产品都可以被论证为
    "平台/基础设施"从而被豁免。这使 excluded_outcomes#4 的防御半径比文件表面
    看起来更大。
    ⇒ 消化(非净杀)。暴露 excluded_outcomes#4 的防御半径问题。

    云计算 IaaS(AWS/Azure/GCP——极高可测性+三巨头寡头,非碎片化):
    IaaS 的可测量性完美:CPU 秒/存储 GB/网络 GB/API 调用次数——所有维度都可被
    精确计量且按用量计费。推论预测(i):高可测性→碎片化。现实:AWS~31%+Azure~24%
    +GCP~11%=~66%市场集中,且三家均在垂直整合(AWS 自研 Graviton 芯片/Trainium
    AI 芯片/Nitro 硬件/AWS Ground Station 卫星地面站;Azure 自研 Cobalt 芯片;
    GCP 自研 TPU)。消化:excluded_outcomes#4 豁免——"平台企业的自身边界...不在
    本 L3 单机制推论射程内"。消化在规则上成立,但再次表明 exclude#4 的豁免范围
    覆盖了大量高可测性数字产业的集中化案例。
    ⇒ 消化(非净杀)。exclude#4 豁免半径再次被拉伸。

    美国医疗/医院系统(中高可测性+剧烈垂直整合→方向与预测相反):
    美国医疗的可测量性在过去 20 年因 EHR/电子健康记录(Meaningful Use 法案 2009+
    HITECH Act)、质量指标公开报告(Hospital Compare/Leapfrog)、价值医疗(value-based
    care)的推行而大幅提高。推论预测:可测性提高→垂直解体或至少碎片化。现实:美国
    医院系统在过去 20 年经历了大规模合并浪潮——独立医院被医院系统收购、医院系统
    收购医生诊所(physician practice acquisition)、垂直整合保险+医疗+药房
    (UnitedHealth/Optum 模式)。同时,远程医疗(Teladoc/Amwell)的碎片化力量也在作用。
    消化:使用"活动拆分"——医院管理的可标准化部分(计费/排班/影像判读)外包或自动化,
    核心临床判断(诊断/手术/治疗方案)留在医院内。此消化在逻辑上自洽,但 r2 再次
    确认 r1 的贯通模式:活动拆分弹性使任何行业观测都能被双向消化。
    ⇒ 消化(非净杀)。第三次确认活动拆分弹性。

    在线教育/EdTech(Coursera/Udemy/YouTube 教育——中高可测性+碎片化,方向支持
    但"平台"身份使归因复杂):
    在线教育的可测量性高(完课率/测验分数/学习时长/点击流)。推论预测:高可测性→
    碎片化/平台化。现实:确实碎片化——任何个人都可创建课程,平台(Coursera/Udemy/
    YouTube)作为协调基础设施。这支持预测(i)和(iii)。但同时,传统大学(Harvard/MIT
    通过 edX、Stanford 通过 Coursera)也在平台上占主导地位——"碎片化"与"现有
    层级机构主导"并存。此案例支持推论但暴露:平台本身可能被既有的大机构俘获,
    平台协调≠去中心化——与推论的"企业边界缩小"预测张力不大但值得标注。
    ⇒ 支持案例(非反例)。附带平台俘获标注。

    【贯通模式确认:活动拆分弹性+多力量对冲=行业层面低可证伪性】
    r1 猎了 4 个候选反例(会计/农业/软件/咨询),全部通过"活动拆分+其他因素"
    消化。r2 猎了 3 个新候选反例(EDA/云计算/医疗)+1 个支持案例(在线教育)。
    新猎的 3 个候选反例再次全部通过活动拆分+排除钩子豁免(exclude#4)+其他因素
    对冲的组合拳被消化。贯通模式确认:推论在行业层面的可证伪性因三重弹性——
    (a)活动拆分弹性(任何行业都可拆分为"可测=外包"与"信任/默会=留内"双层)、
    (b)其他因素对冲(Williamson/管制/网络效应/资本成本——任何反例都可被至少一个
    其他因素消化)、(c)时间弹性("不动"vs"移动慢"在有限时间窗内难区分)——而显著
    低于文件 falsifiability 段声称的"可被观测数据证伪"的实践水平。

    这不是逻辑上的不可证伪(DED-004 级):falsifiability(a)(b)(c)都有操作化条件,
    可被足够干净的数据推翻。但在实践中,"足够干净的数据"(要求控制所有混淆因素、
    事前注册完整的活动拆分表、足够长的时间面板以区分时滞与结构稳定)的获取成本
    极高——使推论的实证风险远低于文件措辞暗示的水平。fix ② 的部分诚实标注(结构
    性弱点声明)已缓解此问题,但 fix ② 漏掉了 r1 should-2 明确要求的"预测单元
    粒度可调→事前注册子活动拆分表"承诺——当前 falsifiability 段未包含任何事前
    活动拆分注册要求。

    【结论】无净杀。四个新猎获均被消化(EDA/云计算→exclude#4+其他因素;医疗→
    活动拆分;在线教育→支持)。贯通模式再次确认——推论在行业层面的实践可证伪性
    低于文件声称水平。见 should-1。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【r2 复核:未复发】。
    falsifiability(a)(b)(c)三个条件均有操作化检验路径,可被观测数据独立否决。
    anti-talisman 四禁令+fix ④的信度检验进一步封死了反向推断。
    "活动拆分弹性+多力量对冲"使推论在实践上难以被证伪,但这不是 DED-004 的逻辑
    循环——推论在逻辑上可证伪,实践中需要足够干净的数据(高成本但不不可能)。
    区分"实践中难以检验"(成本/数据问题)与"逻辑上不可检验"(定义问题)是关键——
    DED-035 属于前者而非后者。此区分在 fix ②的结构性弱点声明中虽未直接论述,
    但诚实标注了认识论地位降级,方向正确。
    ⇒ DED-004 未复发。

    DED-007(测量轴焊死):【r2 复核:未复发】。
    自变量(可测量性=能否被量化)与被预测量(边界位置=活动在哪里做)仍在概念上异源。
    fix ①+fix ④降低了编码侧的隐性焊点风险(敏感性分析+信度检验+盲法编码者)。
    无新增焊点——fix ⑤ 的因果方向订正不改变自变量/因变量的测量独立性。
    ⇒ DED-007 未复发。

  required_fixes: []

  should_fixes:
    - |
      [should-1 续 r1 should-2(b)+should-3] 两条 r1 修复不完整的补丁:
      (a)【活动拆分事前注册承诺】在 falsifiability 段末尾(或新立一个独立的
      pre_registration 节)增加: "【预测单元粒度的事前注册承诺】推论预测的是活动
      层面的分叉(同一企业内可测子活动外包、信任密集子活动留内)。为避免事后活动
      拆分弹性削弱推论的实证风险,承诺:(i)为至少一个行业事前注册完整的子活动拆分
      表——在看该行业边界数据前,列出哪些子活动按可测量性编码应归入'预测外包'
      哪些应归入'预测留内';(ii)用该行业的事后边界数据检验拆分表的预测命中率;
      (iii)若事前拆分的命中率不优于随机猜测,推论在该行业的预测力被拒绝。"
      修订位置:falsifiability 段末尾。
      (b)【外包率数据源本轮回合锁定】将 operationalization.firm_boundary_position.
      measurement 中的"锁定方案须在下一轮审查前注册"改为"已锁定方案",从候选列表
      (BEA/BLS/IBISWorld/Statista/行业协会年报)中选定首选源+第一后备源+第二后备源
      三级,并注册"首选源缺失→使用第一后备源→仍缺失使用第二后备源"的自动降级规则,
      不得在各级后备源间按结果选择。同时修复 r1 边缘缺口(三):"平均企业规模"的
      "控制行业总规模"注册具体方法——建议"log(企业平均雇员数)~log(行业总雇员数)
      回归取残差"或"企业平均雇员数/行业总雇员数比值",二选一并注册。
      修订位置:operationalization → firm_boundary_position → measurement 段。
    - |
      [should-2 新] 可测量性敏感性分析须覆盖权重维度:
      当前 fix ① 的敏感性分析承诺仅覆盖阈值(±0.1)未覆盖权重方案。在 operationalization.
      activity_measurability.limitations 的"权重与阈值的锚定状态"段末,将现有
      敏感性分析承诺从句扩展为:
      "注册敏感性分析计划:
      (i)阈值在±0.1范围内变动时,预测方向是否稳定;
      (ii)权重方案从等权(各1/3)变为行业锚定加权(如咨询业输出0.2+输入0.5+过程0.3,
      制造业输出0.4+输入0.3+过程0.3,各维度±0.15变动)时,>30%行业是否重分类;
      (iii)若(i)或(ii)显示结果显著敏感,等权+等阈值方案被拒绝,需在见数据前注册
      行业特定权重+阈值。"
      修订位置:operationalization → activity_measurability → limitations 段。
    - |
      [should-3 新] "多力量对冲时无净方向预测"列入 known limitation:
      在 falsification_trace 中增加一条(可置于 secondary_suspect 与 unlikely_suspect
      之间): "known_limitation: 当可测量性与信任密集度/管制/资产专用性指向相反方向时
      (如审计=高可测性+高信任、制药=高可测性+高管制),推论不产出该活动整体的净方向
      预测,而是诉诸'活动拆分'(核心判断留内/可标准化子任务外包)。此活动拆分的弹性
      在实践中降低推论的行业层面可证伪性——任何行业观测都可通过调整拆分粒度来拟合。
      这不是逻辑循环(拆分判据=可测量性,需独立编码),但应在实证检验中通过事前注册
      子活动拆分表来控制(见 should-1)。"
      修订位置:falsification_trace,在 secondary_suspect 与 unlikely_suspect 之间。

