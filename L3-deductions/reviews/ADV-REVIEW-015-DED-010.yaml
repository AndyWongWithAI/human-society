      真正最弱腿是【①成本-规模超线性发散最欠经验实锚】,文件已在 load_bearing_gap 显式认领
      ("载重却最欠经验支撑的一腿"),并给 within_personalist_test_design——即文件在 falsification_
      trace.primary_suspect(近砖那条)之外,另在 load_bearing_gap 认领了这条经验最弱腿。两条弱腿
      均已被文件某处诚实认领,我未再猎到"更致命且文件全未认"的隐藏软肋。通过。
  counterexample_hunt: |
    本轮【亲自】另猎(不复用 round-1 清单),目标填 falsifiability(a) 最强形式:经【结构量独立测定
    (命令链人头×层深)】确大、经结构签名确【纯人格化】(无成文继承规则/无官僚职位制/权威附着于
    个人)、却【长期维系且展示占比不随规模上升·始终低】的支配单位。
    - 魅力型教派/新宗教运动(约瑟夫·斯密早期摩门/Rajneesh/大型个人崇拜教团):①【高展示】
      (布道/礼拜/公开虔敬/宣传)非低;②创教者死则【分裂/继承危机】,除非制度化(摩门靠先知职位/
      定额团制度化继承=B;天主教=B)⇒ 被消化,反支持(ii)。
    - 黑手党/有组织犯罪家族(西西里/山口组):按命令链人头×层深属中小规模(单个家族数百至数千),
      "整体 Cosa Nostra"是联邦非单一支配单位;且【用暴力示众/荣誉仪式/公开惩戒违规=展示】,继承
      常暴力(继承危机)⇒ 规模不达+高展示+死则乱,不成清净反例。
    - 军阀/大人政治(控制大疆域的 strongman):结构纯人格化,但恶名昭著地不稳,大人一死即裂
      (反支持 ii),靠掠夺分配+暴力展示(A)⇒ 被消化。
    - 长寿个人独裁(Franco≈36y/Salazar≈36y/Mobutu≈32y):Franco 建 Movimiento 党-国机器+把继承
      制度化给君主(→胡安·卡洛斯)=B;Salazar 有 PIDE 秘密警察(镇压)+法团职位制,经制度结构
      传位 Caetano=B;Mobutu 纯人格化+庇护+镇压,最终垮台 ⇒ 或制度化(B)或高镇压或崩溃,均非
      低展示纯人格化长存。
    - 食利/水利君主国(海湾君主国):世袭君主制(成文/家族会议继承规则=制度化 B)、非纯人格化;
      若设想无继承规则的纯个人食利者,则死即继承危机(反支持 ii)⇒ 被消化。
    - 【最强候选】金氏朝鲜作为"人格化却挺过继承"的反(ii)候选:朝鲜金日成→金正日→金正恩三代
      平移。按判据:世袭王朝原则=【成文/惯例继承规则=制度化(B)】+党机器+主体思想(近非人格
      锚)+【高展示(崇拜宣传/阅兵/清洗)】⇒ 是"个人崇拜+世袭职位制"混合态,恰【支持】(ii)(靠
      制度化继承挺过死亡),非纯人格化低展示反例。
    结论:【净杀=无】。全部候选或高展示(非低)/或死即分裂(反支持 ii)/或靠位子·世袭规则达大规模
      (B)/或规模不达/或出射程。数条(摩门·海湾·朝鲜)反哺(ii)/(B)。verified 硬门第 2 条通过。
      与 round-1 不同:本轮的净杀=无【已是干净结论】(规模钉成结构量后,候选的"规模"不可再事后
      调口径,反例测试现可干净跑),不再是 round-1 那种 provisional-on-fixing-scale。
  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【不复发】。round-1 抓到的平行循环(自变量规模="对存续为必要人数",
    存续偷进自变量口径)已修:规模改命令链人头×层深的 org 结构事前量、离存续;anti_talisman_clause
    增段明禁"因低展示却长存就倒推规模其实不大"。三条事后救活逃逸口(缩规模/塞非正式制度化/辩隐性
    展示)均被双向对称条款堵死。关键:定义【不】先验排除反例——找到一个大命令链·无继承规则·无官僚·
    权威附着于一人·跨两代仍低展示的政体即证伪,只是经验上不存在(≠不可证伪)。
    DED-007(焊死测量轴):【不复发】。规模焊点拆除后,驱动量(衰减率结构代理×规模结构量)与
    被预测量(展示占比/制度化结构签名)异源正交、三向禁由存续/崩溃反推。仅存展示成本编码对(ii)
    的轻度 regime-type 载荷(should,已有抗继承独立腿兜底),远轻于 DED-007 式全面焊死。
  residual_observations: |
    非阻断(不影响 verified 裁决,列为 standing-recommendation / 可选 should):
    - [standing-rec] 载重卖点①(展示成本随规模【超线性】发散+天花板)当前仅有 within_personalist_
      test_design、无实锚(现有个人独裁锚皆"大规模+高展示"单点、缺规模变异对照)。文件已诚实标
      load-bearing-but-under-anchored——属"待 EMP 证/证伪"的正常候选态,非缺陷。建议把该预注册
      测设排进 EMP 队列;在测出前,勿把①当既成事实引用,可证伪性靠 falsifiability(b)+测设保持。
    - [should·minor] 展示成本编码宜补一条【不预设 regime-type 的 act-frequency 编码规则】(如按
      "清洗/处决的规模·频次·是否针对政治忠诚"结构量编码,而非按已判定的政体类型),使(ii)的
      人格化 vs 制度化对照臂也免于轻度循环。(ii)另有抗继承独立腿,不修亦不塌,故 minor。
    - [观察] derivation 步2 的超线性机制依赖"层级中介逐层失真(THEOREM-hierarchy-depth-limit)+
      单一支配者刷新带宽有限(PHY-002)";而展示常是一对多广播(一次阅兵/公审刷新多人),广播性
      对"超线性"有削弱张力。文件的超线性靠【中介层须各自独立刷新+失真复利】撑住,机制自洽但正是
      ①最需 EMP 兜底处——与上 standing-rec 同源,已被 load_bearing_gap 覆盖。

