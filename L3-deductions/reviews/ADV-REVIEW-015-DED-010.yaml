id: ADV-REVIEW-015
type: adversarial_review
reviews: DED-010
layer: L3-deductions

人话摘要: |
  对 DED-010(权力维持成本与制度化:纯人格化支配随规模上升须付递增展示成本、撞天花板 ⇒
  二选一 递增展示 or 制度化)的独立对抗审查。round-1 裁 needs_revision:核心活、显式吸收了
  DED-004/005/006/007/008 多条死因(测量轴主干正交、锚无事实反转、(A)/(B) 按伞级判据本身
  二值定义、排除钩子按创立期渠道划、连续量不二分、anti-talisman 对"垮/没垮→反推成本"双向
  设防)。我做了全新反例猎捕(草原帝国/匈奴/封建制/教廷/神王/游牧联盟/食利君主),【无 scope
  内活反例】——统统落"高展示(非低)"、"死即分裂(反支持 ii)"、"靠位子/规则达大规模(B)"或
  "退化为小型个人域被制度粘合"。但抓到【一条 required】:被支配【规模】(自变量的一半)在
  operationalization/measurement/limitations 三处都被定义为"其服从对支配结构【存续】为必要的
  人数"——把【结果(存续)】偷塞进【自变量】,正是红旗3点名的"自变量偷用结果测"死法,也给
  falsifiability(a)"规模经独立测定确大"留了事后缩小口径救活推论的漏(低展示却长存者可辩'必要
  持有者其实很少')。文件 anti-talisman 只挡了"垮/没垮→反推成本/衰减",没挡"存续→定义规模"。
  修法外科式、有 DED-009 r1→r2 判例:把"规模/必要持有者"钉成结构、离结果的事前量(命令链
  人头×层深,按组织结构编码)。另 4 条 should(天花板超线性机制欠明、载重新意①缺随规模变化的
  锚、衰减率工具与排除钩子的软性护身符残留、"不可逆"与自家 reversibility_anchor 打架)。

target: DED-010
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文)。评分卡 10 条红旗逐项攻 + 反例猎捕
  (判 verified 前必做)+ DED-004(不可证伪循环)/DED-007(测量轴焊死)复发检查。裁决三态、
  verified 三条门全照 review-rubric.md。

round_1:
  reviewer: "独立子 Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    核心活、方向可信,且明显系统性吸收了此前诸推论的死因(测量轴主干异源正交、五锚无
    DED-007 式事实反转、(A)/(B) 按伞级判据本身二值、排除钩子按创立期渠道划、连续量按程度
    量不二分、anti-talisman 对"政权垮/没垮 → 反推成本/衰减"双向明文设防)。我做了【全新】
    反例猎捕(见 counterexample_hunt),【无 scope 内活净反例】——verified 硬门第 2 条本身
    通过。
    但有【一条 required 未决硬伤】,恰落在文件 primary_suspect 【没认】的地方:自变量
    "被支配规模"在 operationalization.definition、measurement、limitations 三处均定义为
    "其服从对支配结构【存续】为必要的人数 / 按对存续的必要性划"——把被预测的【结果(存续)】
    偷塞进【自变量(规模)】的口径,正是红旗3明文点名的"自变量偷用结果测"(DED-007 家族),
    并给招牌预测 (i) 与 falsifiability(a)("被支配规模经【独立测定】确大"…长期低展示却维系
    ⇒ 证伪)留了一条事后救活的漏:遇到"大规模×纯人格化×低展示却长存"的反例,可辩"其实
    真正'必要持有者'很少、规模其实不大"从而缩小口径把反例开脱掉——这正是 anti_talisman_clause
    自己想堵却没堵严的方向(它只堵了"存续→反推成本必低/必已制度化",没堵"存续→定义规模")。
    这一条不修,(i)/(a) 的"大规模"这半个自变量悬空、可证伪性打折。
    可靠定向修订救活(把"规模/必要持有者"钉成【结构、离结果】的事前量:命令/支配链人头×层深,
    按组织结构编码、独立于是否存续),非推倒重来 ⇒ needs_revision 而非 rejected。判据一致性:
    与 DED-009 round-1 完全同型——那轮也是"自变量阈值被结果侧反定义、与自家结构 measurement
    自相矛盾"判 needs_revision,r2 钉成结构量后转 verified。本轮无活反例、唯一 required 驱动
    即此循环,标准一致,非放水亦非过杀。
  red_flag_findings:
    brick_conclusion: |
      部分命中(should,文件已自认,不判 required)。(B)"制度化降本/非人格替个人"与承重砖
      BR-L2-010("非人格化制度可替人际信任")高度重叠——但 BR-L2-010 明限【交换域】、只声称
      "可替代"不声称"必被采用"、不含【维持成本随规模发散】【不可逆/滞后】。文件 primary_suspect
      与 discriminant 已诚实前置"(B) 近砖非卖点、载重压在①成本-规模发散②不可逆③驱动量事前
      独立测量"。真正砖外的非平凡内核(把支配维持按"权威附着于人 vs 位子"劈成 (A)/(B) 并断言
      成本随规模发散)不在单砖原文 ⇒ 不判 required。
      【但另有一层砖=近共识需补认】:预测 (ii)"制度化抗继承、更持久;人格化更依赖镇压/展示、
      更短命"几乎【逐字】是 Geddes-Wright-Frantz personalist vs single-party 的经验发现,亦是
      韦伯 routinization。文件 discriminant 已承认"制度化更稳会被常识吸收"、把重心移到①③。故
      (ii) 近共识、非卖点这点【基本到位】,但宜更醒目(见 required_fixes should-3)。
    nontriviality_cell_check: |
      攻不穿【但系于 required 修好】。核心空格"大规模 × 纯人格化 × 不制度化 × 长期低展示"预测
      为空。是否被 THEOREM-power-signal-decay 平凡强制?关键在【规模依赖】:定理是 dyad 级、
      规模盲("不展示则衰减"),只强制"低展示→衰减",【不】强制"低展示在【大】规模才致命、在
      小规模可持续"。文件 nontriviality_test 正确列"小规模×纯人格化×低展示 ⇒ 非空(小团伙常见)",
      故空格的经验内容 = "同样低展示,规模一大就撑不住"——这是砖外的真经验主张(其机制=单一
      支配者刷新带宽有限 vs 触点随规模增多,见下 should)。非同义反复、可被"大规模纯人格化低展示
      却长存"的现实反例填上(我猎了,没填上)。通过——但"大规模"须由结构量测方成立,系于 required。
    measurement_orthogonality: |
      主干不重蹈 DED-007,但【命中一处焊点=本轮 required】。承重对本应异源正交:驱动量
      =衰减率(自然实验:停展示后抗命出现的时间常数 / 信道密度 / 代际记忆更替)× 规模;被预测量
      =展示成本占比(处决/清洗/阅兵/崇拜预算占比)& 制度化程度(成文继承/职位制/权威平移)——
      源不同、方向可分。anti_talisman_clause 对"垮/没垮→反推成本/衰减"双向禁反推,做对。
      【焊点】规模这半个自变量被定义为"对【存续】为必要的人数"(definition/measurement/limitations
      三处)——把结果(存续)偷进自变量口径,即红旗3点名的"自变量偷用结果测"(类比 DED-008 r1
      "分母偷用实际获授者"、DED-009 r1"阈值偷用绑定成败")。改结构 cutoff(命令/支配链人头×层深、
      按组织结构事前编码、离存续)即除 ⇒ required。
      【另一软性残留(should)】衰减率的自然实验工具"停展示后抗命出现"里的"抗命(抗命/逃避/
      阳奉阴违)"是支配失效的【微观结果】,与被预测的存续/成本不同轴、但同族;宜优先用纯结构
      代理(信道密度/记忆更替)并注明该自然实验须在与被预测维持结果不同的时标/层级上取,以免
      滑向"用小结果测衰减、再预测大结果"。
    scope_hook_independent_of_result: |
      不命中(学到 DED-005 教训)。excluded_outcome #1"创立即非人格化(立国即成文法/官僚制)"
      按【创立期权威附着对象】这一可事前测的渠道划、归 (ii)/制度端支持,不按结果开脱——做对。
      【但 excluded_outcome #2(should)】"展示投入服务于对外威慑/合法性而非刷新内部权力信息 ⇒
      须扣除"是把关键测量量(展示成本)按【用途】切,而用途事后可辩(把高展示辩成'对外'、把
      低内部展示辩成'其实有隐性内部展示'),存在双向开脱风险。虽名义对称(对外展示也不计入
      支持),仍需一条【事前编码规则】(如按展示的受众指向/场合类型预先归类)方能免于事后调用。
    criterion_tier_match: |
      不命中(学到 DED-006 教训)。衰减率连续、展示成本"占比为程度量"、institutionalization_degree
      "混合态按主导成分或并存标注、不二分、为程度量"——连续量不硬切档。(A)/(B) 的二值是【真结构
      二值】(权威附着于个人 yes/no ⇒ 附着于位子/规则),by-construction 穷尽,非把连续量切档。
    anti_talisman_cashed: |
      基本兑现(优于纯嘴上)。至少一承重锚【独立测出】驱动量侧或被预测量:Geddes-Wright-Frantz
      锚——政体类型(制度化程度)由【结构签名(党机器/成文继承规则的在场)】事前编码,与存续
      时长【分开】测,是真独立数据集实践;斯大林/毛/朝鲜锚——清洗频次规模、崇拜宣传投入可离
      "政权是否垮"结构计。anti_talisman_clause 明文禁"遇大规模×纯人格化×低展示却长存就事后硬塞
      非正式制度化消化"——护身符防线在位、方向对。
      【对抗】其兑现被 measurement 那半个自变量(规模=存续必要人数)拖累:驱动量=衰减率×【规模】,
      而规模口径含结果 ⇒ 驱动量的"事前独立"这一②号卖点部分落空,须随 required 修复才真兑现。
      故记"基本兑现、系于 required",非"未兑现"。
    anchor_fact_check: |
      不命中,无 DED-007 式致命事实错。核对:斯大林/毛/朝鲜=高展示纯人格化(清洗/公审/阅兵/
      个人崇拜)✓;Geddes-Wright-Frantz Autocratic Regimes 类型学(personalist 更依赖镇压、
      继承更致命、平均更短命;single-party 抗继承更持久)✓ 表述准确;秦汉郡县官僚制 / 罗马
      元首制→更科层化的帝国 ✓(简化但非错);"国王已死,国王万岁"=权威随王冠/位子平移
      (Kantorowicz 王之二体)✓;草原帝国(成吉思/阿提拉/帖木儿)【死即分裂+高展示】✓(蒙古死后
      裂为诸汗国、匈奴 Nedao 之战后崩、帖木儿帝国分裂),故属 boundary、反支持 (i)/(ii),不是
      低展示长存反例——处理正确。
    definition_vs_prediction: |
      部分命中(should,与 nontriviality 同源)。"超天花板欲持久 ⟺ (A) 递增展示 or (B) 制度化"
      有【解析臂】((A)/(B) 按"权威是否附着于该个人"by-construction 穷尽,近乎定义)+【经验臂】
      ((i) 展示占比随衰减率×规模递增、存在天花板;(ii) 制度化降本+抗继承——可测、可两向出结果)。
      经验臂是真预测,故非纯定义。但须把"招牌可证伪内容=经验臂 (i)/(ii)"钉死,别让 (A)/(B) 的
      解析臂被误读为主可证伪内容(mirrors DED-009 r2 的 (i)-臂近解析处置)。
    enumeration_and_species: |
      不命中(主干稳)。(A)/(B) 按【伞级判据本身】("权威附着于个人 vs 附着于位子/规则")二值、
      by-construction 穷尽。我【主动猎第 N+1 类】——一个既非"递增个人展示"又非"位子/规则制度化"的
      第三维持模式:
      - 物质/食利依赖(subjects 靠支配者控制的资源活命):仍要 B 持有"A 控制资源"之信息(可衰减)、
        且资源控制要么附着于个人(世袭家产制=A)要么附着于国家/规则(=B)⇒ 落回二值。
      - 卡里斯玛/意识形态信仰:信念亦是须刷新的信息(THEOREM-group-identity-decay),靠宣传=展示(A)
        或例行化=制度(B)⇒ 韦伯已吸收、落回二值。
      - 群体间相互监视/原子化恐怖:是制度化的监视系统(B)或清洗展示机器(A)的一部分 ⇒ 落回。
      逐一测,【未净到活的第三 species】。穷尽由"(B)=一切【不附着于该特定个人】的锚定"这个
      catch-all 保证——这也正是其软肋(近解析,见 definition_vs_prediction),但作为"枚举穷尽"
      红旗攻不穿。宜像 DED-009 r2 那样显式把 (B) 标为该 catch-all("非人格制度"是主要实例)。
    primary_suspect_aim: |
      【指错方向/欠关死 ⇒ 本轮 required 的来源】。文件自认最弱腿="制度化降本是否被 BR-L2-010
      平凡强制"——这确是【一条】真软肋,且已被 discriminant 诚实退守化解(载重移到①②③)。但它
      【不是最致命的那条】:更致命的是自变量"规模"用"对存续为必要"反定义(见 measurement_
      orthogonality),这条直接咬住招牌预测 (i)/(a) 的可证伪性,文件 primary/secondary_suspect
      均【未认】(secondary 只提"制度化须结构签名测、展示须扣对外",漏了规模口径这一环)。
      ⇒ 红旗10命中:文件自认的最弱腿准但非最致命,存在一条更致命的它没认的软肋。这正是
      needs_revision 的形态(诚实退守救了 (B)/近砖那条,没救 (i)/(a) 的规模口径)。
  counterexample_hunt: |
    本轮【亲自】猎捕,目标填最强空格(falsifiability(a) 最强形式):一个经【独立测定】确属大规模、
    经结构签名确【纯人格化】(无成文继承/无官僚职位制/权威附着于个人)、却【长期维系且展示投入
    占比不随规模上升、始终低】的支配单位。认真找历史/跨文化实例:
    - 草原帝国(成吉思汗/阿提拉/帖木儿):看似大规模纯人格化长存。按判据:①【高展示】(征服/
      掠夺分配/kurultai 与恐怖屠城作展示)非低;②死【即分裂】(蒙古裂为诸汗国、匈奴 Nedao 后崩、
      帖木儿帝国裂);③成吉思本人还部分制度化(yassa 法典/十进军制/择贤任命=部分 B)。⇒ 反支持
      (i)/(ii),非低展示长存反例。被消化。
    - 封建制 / 周代封建(大疆域):看似大规模低中央展示长存。分层看:国王对全域的支配名义/弱,
      真实支配是【局部小规模个人关系(领主对附庸/农奴)】=落"小规模×人格化×低展示可持续"格;
      而把这些小域粘成大realm 的,是【可继承的采邑/封土 + 成文/习惯的继承法 + 册封/效忠仪式(=展示)】
      =制度化(B)。恰【支持】"个人支配不可扩、大规模靠位子/规则粘合"。被消化、反哺 (B)。
    - 天主教会/教廷(跨两千年、极大规模、低强制展示):最大化【制度化】(教会法、教宗【职位】、
      "职位永续、教宗会死"=终极抗继承 B)。强支持 (ii)。非反例。
    - 神王(埃及法老/印加):权威附着于【神圣职位/位格】(法老作为制度/神位,非仅肉身个人)+
      【高展示】(纪念碑/仪式)。混合、偏 B-位子 + 高展示。支持,非低展示反例。
    - 游牧/部落联盟(贝都因/塞segmentary):要么根本不维持【大规模统一支配】(无头/易裂),要么
      属亲缘 segmentary(DED-009 射程)。无"持存的大规模支配单位"可填格。出射程/不成反例。
    - 食利/水利式君主(以资源分配换服从、表面低镇压):多为【现代、立国即带官僚(职位制)】=出
      射程/(B);且"必要持有者"少、非大规模。被消化。
    结论:【净杀=无】。全部候选或高展示(非低)、或死即分裂(反支持 ii)、或靠位子/规则达大规模(B)、
    或退化为小型个人域被制度粘合、或出射程。数条(封建/神王/教廷)反哺 (ii)/(B)。verified 硬门
    第 2 条(亲自猎捕、无 scope 内活反例)通过。
    【但重要限定】此"净杀=无"是【provisional-on-fixing-scale-definition】:因"大规模"当前由
    "对存续为必要的人数"测,任一候选的"规模"都可被事后调口径,反例测试尚不能【干净】跑——这
    恰反证 required 必须先修:规模钉成结构量后,本猎捕结论才落定。
  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【有活回声=本轮 required】。anti_talisman_clause 挡住了"垮/没垮 →
    反推成本必低/必已制度化"这条主循环(做得好),但漏了一条平行循环:自变量"规模"= "对【存续】
    为必要的人数",存续(结果)进了自变量口径 ⇒ 遇低展示却长存的大规模反例,可事后缩"必要持有者"
