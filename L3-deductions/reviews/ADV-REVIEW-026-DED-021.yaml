id: ADV-REVIEW-026
type: adversarial_review
reviews: DED-021
layer: L3-deductions

人话摘要: |
  对 DED-021(第三方惩罚严重度校准:惩罚力度跟踪违规严重度+失配惩罚触发反惩罚+自校准闭合循环)
  的 round-1 独立对抗审查。裁 needs_revision:两条 required 缺陷——①brick=conclusion:预测(i)
  "第三方惩罚力度与违规严重度正相关"已近义出现在 BR-L2-016 的原文/证伪条件中,作者的
  discriminant_validity 辩护("BR-L2-016 不指定谁在执行比例跟踪")与 BR-L2-016 自身文本矛盾;
  ②operationalization 的"文化内基准校准"与"三维独立客观编码"之间存在未闭合的张力——当客观轴
  (物理伤害/资源损失/权利侵犯)与文化严重度分歧时(荣誉文化、替罪羊、私刑正义),文化校准可吸收
  几乎所有表面反例,伤及 anti-talisman 有效性和 falsifiability。反例猎捕:血仇/世仇系统(阿尔巴
  尼亚 Kanun/科西嘉 vendetta/黑山 krvna osveta)构成强边界挑战——第三方惩罚力度不跟踪客观
  严重度、过度惩罚不引反惩罚、跨代稳定。DED-004/007 未完全复发,但文化校准后门若未堵上,
  有滑向 DED-004 式不可证伪的风险。

target: DED-021
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。评分卡红旗 10 条
  逐项攻 + 反例猎捕(判 verified 前必做)+ DED-004(不可证伪循环)/DED-007(测量轴焊死)复发检查。
  裁决三态照评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活反例③不重蹈
  DED-004/007。

round_1:
  reviewer: "独立子 Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    本条有 genuine 理论贡献——"第三方惩罚是比例跟踪的主力执行者+失配惩罚→反惩罚→闭合校准循环"
    的闭环机制,以及将 DED-015 的"结果稳态"和 BR-L2-014 的"惩罚存在"桥接为"过程校准",是有
    分析增量的。但上架前须修两条 required 缺陷:

    【Required ①】brick=conclusion 重叠于 BR-L2-016。DED-021 的预测(i)"第三方惩罚的力度与
    违规严重度正相关"已在 BR-L2-016 中被原文/近义陈述——BR-L2-016 的 behavioral_economics
    source 明确写"旁观者施加的惩罚金额与违规严重度正相关",其 falsifiability 写"惩罚力度与违规
    严重度之间无正相关"。作者在 discriminant_validity 中辩称"BR-L2-016 不指定谁在执行比例跟踪",
    但此辩护被 BR-L2-016 自己的文本推翻——BR-L2-016 引用的恰是第三方惩罚实验(Fehr &
    Fischbacher 2004)。预测(i)作为本条的三个核心预测之一,其经验内容不独立于承重砖。这不是
    说整条推论塌了——预测(ii)(反惩罚循环)和预测(iii)(空格判空)及"主力执行者"定位仍有增量——
    但预测(i)须要么删降为上下文,要么在 statement 中显式标注"此预测由 BR-L2-016 建立,本条
    的增量是将执行者锁定为第三方并以 ratio 操作化"——并且诚实调整 discriminant_validity,
    承认 BR-L2-016 已覆盖此经验主张。

    【Required ②】operationalization 的文化校准后门。当前测量架构存在双轨张力:轨 1 用三维独立
    客观轴(物理伤害/资源损失/权利侵犯)编码违规严重度,轨 2 用"文化内基准校准"处理跨文化差异。
    当两轨分歧时(如荣誉文化中一句侮辱在客观轴上伤害=0,但在文化内被感知为极严重),轨 2 会覆盖
    轨 1 的评分。这制造了一个吸收任何表面反例的活门:只要出现 ratio>>1.3 却无反惩罚的案例
    (如私刑正义、替罪羊处决),即可辩称"在该文化内违规被感知为严重→ratio 实际≈1"。此活门必须
    堵上——要么(a)明确轨 1 的客观轴在分歧时优先(且承担由此产生的假阳性),要么(b)在 cultural
    baseline 外新增一个独立的"文化严重度认知"测量轴(不与惩罚行为共享数据源),且两轴的分歧本身
    被编码为方法论限制而非被静默消化。否则 anti-talisman 防线名存实亡、falsifiability 实战窗口
    被文化校准封闭——有滑向 DED-004 式不可证伪的风险。

    反例猎捕未净到干净 Scope 内必杀反例(血仇系统落在 boundary/文化校准争议区,见下),但猎出了
    文化校准后门这一测量架构级缺陷——它本身就是 required。

    若两条 required 修到位,本条可上 verified。当前不满足 verified 三条门的第①条(存在 required
    缺陷)。DED-004/007 未完全复发但文化校准后门与 DED-004 的"事后开脱"风险同族,需在修订中
    堵死。4 条 should 级改进见 required_fixes,不阻断 verified 但强烈建议修。
  red_flag_findings:
    brick_conclusion: |
      【命中——required】。逐字核三块承重砖原文:

      BR-L2-014(代价第三方惩罚):
      - 核心陈述:"人类…在自己未受直接损害的情况下,付出个人代价去惩罚针对陌生人的不公行为"
      - 建立的是第三方惩罚的【存在性】,不讲严重度校准。预测(i)不在此砖内。

      BR-L2-016(报应比例性):
      - 核心陈述:"人类对'惩罚应该跟罪行成比例'的期望跨文化普适"
      - 这是关于【比例直觉】的陈述,表面上似乎不指定"谁"执行。
      - 但其 behavioral_economics source 明确写:"第三方惩罚实验中,旁观者施加的惩罚金额与
        违规严重度正相关(Fehr & Fischbacher 2004):剥削 50%比剥削 10%招来更重的第三方惩罚。"
        这已经将"比例跟踪"的执行者锁定为第三方,且给出了经验证据。
      - 其 falsifiability 写:"惩罚力度与违规严重度之间无正相关"——这正是 DED-021 预测(i)
        的近义改写(只是加上了"无中心权威的群体中"这一 scope 前缀)。
      - 该砖的 behavioral_economics note 还写:"惩罚不配(过度或不足)本身引发第二轮不满——
        '罚太重'被观测为新的不公(Fehr & Gächter 2002 的反惩罚现象)。"这也是 DED-021
        预测(ii)的近义先占。

      BR-L2-013(不公平厌恶):
      - 核心陈述:"对不公平的结果分配持续表现出负面反应"
      - 讲的是资源分配中的不公平,非"惩罚失配作为不公平事件"。此砖不直接覆盖 DED-021。

      结论:BR-L2-016 已覆盖 DED-021 预测(i)的经验内容,且明确将执行者指向第三方。作者在
      discriminant_validity 中声称"BR-L2-016 单独不指定'谁在执行比例跟踪'"与原砖文本矛盾——
      BR-L2-016 引用的实验证据明确是第三方惩罚实验,其证伪条件不区分"谁"在跟踪比例(任何人的
      惩罚力度与严重度零相关均证伪该砖)。

      DED-021 的真正增量不在预测(i),而在:(a)将比例跟踪的"主力执行者"从一般命题提升为关于
      第三方特殊地位的比较性主张;(b)闭合校准循环——"失配惩罚→不公厌恶→反惩罚→有个人利益
      动机去校准"的机制链路;(c)ratio 操作化和空格预测结构;(d)预测(ii)的"不足惩罚→纵容帮凶
      声誉惩罚"方向(BR-L2-016 只提过度惩罚引反惩罚,不足惩罚→声誉惩罚的对称预测更新)。这些
      增量是真实的,但预测(i)应诚实标注为"由 BR-L2-016 建立,本条将其操作化并锁定执行者为
      第三方"——而非作为本条独立的经验贡献呈现。

      判 required:作者须(a)在 statement 中显式标注预测(i)的经验来源并收缩本条对该预测的
      所有权主张,(b)修正 discriminant_validity 中"BR-L2-016 不指定谁在跟踪"的事实性错误
      陈述。这不是塌核——预测(ii)(iii)和"主力执行者"定位仍有独立可攻击面——但此砖重叠必须
      诚实处理。

    nontriviality_cell_check: |
      【通过,但需注意依赖链】。核心空格:

      表A(惩罚偏差×群体反应):
      - 空格A1'过度→接受(无反惩罚)':预测为空。依赖 BR-L2-013(不公厌恶)推广到"惩罚失配
        作为不公平"——这个推广本身是 BR-L2-016 已做的(BR-L2-016 写"惩罚不配…引发第二轮
        不满"),非本条原创。但本条将其做成可独立攻击的预测(找到过度惩罚不引反惩罚的群体→
        证伪),这是有效的操作化。
      - 空格A2'匹配→反惩罚':预测为空。合理,匹配不应触发不公厌恶。

      表B(惩罚-违规相关×群体稳定性):
      - 空格B'零或负相关→跨代稳定':预测为空。此格【不在任何单砖内】——BR-L2-014 不讲稳定
        性,BR-L2-016 不讲群体跨代稳定条件。本条将此做成空格预测有真正的非平凡性。

      空格均可被现实反例填上、非同义反复。不判 required。但需注意:表A的空格A1 的非平凡性
      因 BR-L2-016 的先占而打了折扣——BR-L2-016 已陈述"惩罚不配引发第二轮不满"。A1 空格的
      真正增量是将此一般断言变成带 ratio 阈值的可操作化预测。

    measurement_orthogonality: |
      【部分正交,存在文化校准后门——required 级隐患】。

      理论设计上四轴异源:
      - violation_severity:三维独立编码(物理/资源/权利),不参考惩罚
      - punishment_severity:三维独立编码(暴力/经济/社会),不参考违规严重度
      - ratio:两独立轴的比值计算
      - counter_punishment:独立观测,不由 ratio 反推

      理论设计干净,但 operationalization 中存在一条关键裂缝:

      violation_severity 的 measurement 段写:"跨文化校准时用文化内基准(同一文化内'杀人'比
      '偷鸡'严重,而非跨文化绝对量)。"limitations 再写:"严重度评定的文化敏感度——同一行为在
      不同文化中被感知的严重度不同(如通奸在荣誉文化中评更高)。"

      这条"文化内基准校准"与"三维独立客观轴"之间存在未解决的张力。三维轴(物理伤害/资源损失/
      权利侵犯)是客观指标——无论什么文化,断一条腿的物理伤害是相同的。文化内基准则在说"通奸
      在荣誉文化中比在世俗文化中严重"。通奸在客观物理轴上伤害=0,在资源轴上损失可变,在权利轴
      上可能涉及。如果文化的严重度感知与客观轴评分分歧,operationalization 没有明确指出以哪
      个为准。当前文本暗示文化校准可以覆盖客观轴评分——这就打开了吸收反例的活门(见下
      counterexample_hunt 的详析)。这不是 DED-007 式蓄意焊死(作者明显在努力做正交设计),
      但客观轴与文化校准的优先级不清,使测量轴在实际操作中可能非正交。

      判 required:须明确(a)三维客观轴与文化内严重度感知分歧时的裁决规则——客观轴优先且
      分歧本身被编码为方法论限制/边界案例,还是(b)新增独立于惩罚行为的"文化严重度认知"测量轴
      使全部四轴可独立编码。不修则 anti-talisman 防线被文化校准活门架空。

      未重蹈 DED-007 全貌——作者的测量架构意图是正交的、多数轴也确实是异源的。问题出在
      operationalization 的一条补充条款("文化内基准")与主干设计("三维客观轴")之间未仲裁的
      张力上——可修,非结构性焊死。

    scope_hook_independent_of_result: |
      【基本通过】。excluded_outcomes:
      (1)有中心惩罚权威的制度化司法系统——按结构特征(是否有专门执法机构/法院/成文刑法)事前
         划定。被排除的理由是校准机制不同(制度 vs 分散),不由"是否观察到校准"决定。独立。
      (2)一次性交互无重复观测——按交互结构(是否有 AXIOM-003 的重复交互条件)事前划定。被排除
         的理由是反惩罚循环需要未来之影,不由结果决定。独立。
      (3)违规行为无严重度共识的领域——按"群体内是否存在严重度分级共享判断"事前划定。此排除
         钩子在逻辑上独立于结果,但在操作上有风险:若某群体对某类违规"无共识",可能是因为群体
         成员对严重度意见分裂,也可能是因为外部观察者未能识别共识。需防"遇反例辩称无共识→排除"
         的事后开脱。目前 limitations 对此有警觉,应在 operationalization 中补充"无共识"的
         判定标准(如问卷调查、民族志访谈一致性阈值),使其可事前裁定而非事后回填。

      三个排除钩子均按事前结构渠道划定、不按结果开脱。不判 required。但钩子(3)的操作化
      需补充事前判据(should)。

    criterion_tier_match: |
      【通过,DED-006 学到】。ratio 是连续量(punishment_severity/violation_severity),分三档:
      过度(>1.3)/匹配[0.7,1.3]/不足(<0.7)。三档匹配三个被预测量(过度→反惩罚、匹配→接受、
      不足→声誉惩罚),容差带 provisional ±30% 引用 Henrich et al. 2005 且声明预注册后不得调参。
      违规严重度和惩罚严重度的底层编码均为 0-4 五级序数,等权合成后再比值——级数足够区分
      "未发生/轻微/中等/严重/极端",不会因档位过粗而吞噬变异。合规,不判 required。

      残留注意:ratio 的阈值取自分配公平实验中的容忍带,推广到惩罚校准场景需要独立验证——
      惩罚失配的容忍带可能与资源分配不公平的容忍带不同。此是应标注的假设(should),非致命。

    anti_talisman_cashed: |
      【部分兑现——受文化校准后门减损】。

      anti_talisman_clause 明确写了四条防线:
      - (a)违规严重度和惩罚严重度必须在独立轴上评定,不共享条目
      - (b)不得因'惩罚重'反推'违规必重'(循环论证)
      - (c)不得因'群体稳定'反推'惩罚必是匹配的'(结果倒推前件)
      - (d)判定反惩罚时须独立于 ratio——先观测反惩罚,再检验其与 ratio 的关系,排除派系性驱动

      防线(a)和(b)在理论设计上到位,但在 operationalization 层面,当"文化内基准"与三维客观轴
      分歧时,(a)的独立性被削弱——编码者可能因知道文化内惩罚常态而调整严重度评分(一个文化
      中通奸被石刑处死→编码者给通奸评高严重度→ratio 仍≈1)。这是循环论证的温和形式:不是
      明文因惩罚而反推严重度,而是评分者受文化背景知识(该背景知识本身包含惩罚信息)污染。

      防线(c)到位。
      防线(d)到位——有明确的"须排除派系性/个人恩怨驱动的负面行为"指引。

      承重锚里是否至少一个真正独立测出驱动量?
      - Fehr & Fischbacher (2004):违规严重度(剥削比例)由实验者外生操纵——YES,此为真独立
        测量。confidence=strong,标记正确。
      - Boehm (1999):定性记录分级制裁——严重度由民族志学者描述定性判定,惩罚也由同一学者
        记录,存在共同方法方差风险。作者诚实降 confidence=moderate,并标注"更多支持渐进升级
        而非横截面对应"。标记正确,无需升级。
      - Barclay/Nelissen:声誉回报方向证据较强,反惩罚方向证据"较薄"并诚实标注。confidence=
        weak,标记正确。

      判断:anti-talisman 意图书写是认真的、四条防线是到位的——但 operationalization 中
      文化校准与客观轴的张力让防线(a)在实际编码中可能被软突破。不判单独的 required(文化
      校准问题已在 measurement_orthogonality 中判 required),但需知会此关联。

    anchor_fact_check: |
      【无致命事实错】。逐锚核:

      - Fehr & Fischbacher (2004):TPP 罚金与剥削比例正相关。这是行为经济学的标准引用,结论
        准确。方法学标注"一次性博弈无重复交互"正确。无事实错。confidence=strong 合理。

      - Boehm (1999)分级制裁:作者诚实标注"分级到底是'对同一违规类型的重复升级'还是'对不同
        严重度违规的分级'需要逐案区分——目前民族志数据更多支持前者而非干净的后者"。这份诚实
        自评值得肯定,且将 confidence 降为 moderate 是恰当的。与 BR-L2-014 引用同一源但焦点
        不同(BR-L2-014 引用 Boehm 支持"存在第三方惩罚",本条引用 Boehm 支持"惩罚分级")。
        后者的证据更薄——同一个民族志源对"存在性"的支持强于对"分级性"的支持,本条的 assessment
        准确。无事实错。

      - Barclay (2006)/Nelissen (2008)/Cinyabuguma et al. (2006):反惩罚方向的证据标注为
        "较薄"和"偏方向性而非充分复现"。诚实。confidence=weak 合理。

      三锚无事实错。counterexample_candidate(荣誉文化)的分析也基本合理——荣誉文化的确落在
      边界(有 weak state + 内部感知的严重度不同)。但此 candidate 的"状态弱国家"排除不够强:
      许多荣誉文化社会(如历史上阿尔巴尼亚北部山区、黑山、科西嘉)长期有效不存在中央执法——
      它们不是"弱国家"而是"无国家"。此边界需要更精确的划线(见 counterexample_hunt)。

    definition_vs_prediction: |
      【通过】。关键条件:
      - "无中心权威":可由独立结构事实判定(是否存在专门执法机构/法院/成文刑法/暴力垄断),
        不由"是否观测到校准"反向定义。
      - "违规严重度共识存在":已列入 excluded_outcomes(3),作为适用前提而非预测内容。需注意
        此条件若不加事前判据,可能事后被用于消化反例(should,已在 scope_hook 中提及)。
      - "重复交互":由 AXIOM-003 结构条件独立判定。

      三个预测(i)(ii)(iii)均有可被独立验证的经验内容,非定义性真理。合规,不判 required。

      但有一个微妙的定义性风险:预测(ii)说"过度惩罚→反惩罚"。如果将"过度"操作化为"ratio>1.3",
      且 ratio 由独立的违规严重度与惩罚严重度测量得出,则这是经验预测。但如果 cultural
      calibration 使得 ratio 总是≈1(因为违规严重度被调整至与惩罚匹配),则预测(ii)的测试窗口
      被关闭——不是因为预测是定义性的,而是因为 operationalization 杀死了 variance。这是
      measurement 问题(已在 measurement_orthogonality 判 required)而非定义问题本身。

    enumeration_and_species: |
      【不命中——本推论非 N-species 穷举枚举结构】。2×3 表A 和 2×2 表B 是对各自维度的
      穷举交叉(给定两个维度后格是穷尽的),但这不是声称"第三方惩罚的 N 类形态可穷举"——而是
      对给定判据维度的逐格预测。按 DED-008 精神,我主动探"是否有不在表内的第三类反应":

      - 探"忽略/无视":表A 只设了{接受,反惩罚}作为群体反应,但如果旁观者对失配惩罚的反应是
        "无视(既不接受也不反惩罚、只是降低对惩罚者的合作意愿但不公开表达)",这个反应在表A中
        没有专属格。"无视"既非接受(接受=正面/中性)也非反惩罚(反惩罚=主动负面行为),是一个
        中间态。若"无视"是失配惩罚的主要真实反应,则表A 的二分(接受 vs 反惩罚)太粗——不过
        "降低合作意愿"本身可被编码为 mild 社会制裁(落在 punishment_severity 的社会轴低端),
        故可在现有框架内操作化。此不是第N+1类的净杀,是分类边界模糊。

      - 探"事前规避":第三方可能因预判失配惩罚会招来反惩罚而选择"不出手惩罚"——这不是表A的
        反应,而是对惩罚行为的抑制。这落在理论预测内(自校准机制恰是此抑制的来源),而非外部
        物种。

      未猎到不在判据框架内的第 N+1 类。不判 required。

    primary_suspect_aim: |
      【指对,但漏了两条更致命的软肋】。

      文件自认 primary_suspect:"第三方惩罚的严重度校准本身——即预测(i):在真实群体中第三方
      惩罚力度是否真的跟踪违规严重度。"这是正确的自评——实验室证据扎实、田野证据薄。作者
      进一步在 note 中坦诚:"DED-021 将此缺口独立命题化、给出其专属的可证伪条件,正是为了把
      这个信息缺口切成可攻击的单元。"此态度值得肯定。

      但文件漏认两条更致命的软肋:

      (a)【brick=conclusion 重叠——应列为 primary 而非置之不提】。预测(i)的田野证据薄,
      但实验室证据已被 BR-L2-016 吸收。这意味着本条最大的经验风险不是"田野证据薄"(那只是
      外部效度问题),而是"本条对预测(i)的经验所有权本来就弱——实验室证据是 BR-L2-016 的,
      本条只有增量操作化和田野验证企图的优先主张权"。文件未将 brick 重叠认作风险,这是
      primary_suspect 的重大遗漏。

      (b)【文化校准后门使 falsifiability(a)(b)(c)的实战窗口进一步收窄】。文件在 secondary_
      suspect 提到了"不公厌恶推广到惩罚场景"的理论风险,但未指出 operationalization 层面的
      风险:文化校准使客观轴与感知严重度的分歧被静默消化、ratio 的 variance 被人为压缩、
      falsifiability(a)(b)(c)中"找到 ratio>>1.3 且无反惩罚的群体"的测试窗口被文化校准活门
      提前关闭。这是比 secondary_suspect 更根本的问题——它不只削弱一条 prediction,而是系统
      性地压缩了整个 falsifiability 空间。

      平凡化检查:文件 discriminant_validity 做了两项防平凡化守卫——①"非 DED-015+BR-L2-014
      的平凡组合"(因为 DED-015 不指定谁跟踪比例、BR-L2-014 不讲校准)②"非黄金中道平凡化"
      (因为指定了具体机制且可独立攻击)。守卫①前提有误——真正与之重叠的砖是 BR-L2-016 而非
      BR-L2-014。若把守卫①的对手从 BR-L2-014 换成 BR-L2-016,则判别效度显著缩水。但本条
      的"主力执行者"定位和"闭合校准循环"仍是 genuine delta。故:有被平凡化的风险但核心增量
      未归零。required:修正 discriminant_validity 中的对手认定。

      判:primary_suspect 方向对但对手漏认+文化校准风险未列入,需在修订中增补。不判独立的
      required(已分别由 brick_conclusion 和 measurement_orthogonality 覆盖)。

  counterexample_hunt: |
    主动构造能证伪核心的最强 falsifiability(a)/(b)/(c) 案例,认真搜历史/跨文化实例,三种结果
    逐一记录:

    ========== 攻击 1:血仇/世仇系统 (Blood Feud / Vendetta) — 最强挑战 ==========

    目标:falsifiability(a)"第三方惩罚力度与违规严重度零相关或负相关+群体跨代稳定"
    候选案例:
    - 阿尔巴尼亚 Kanun(Lekë Dukagjini 法典,约 15-20 世纪):氏族间血仇,一句侮辱(客观
      物理伤害=0、资源损失=0)可触发对对方氏族成员的谋杀(惩罚=致死,severity=4),ratio=∞。
      执行谋杀的是被侮辱者的氏族成员(第三方——他们不是被侮辱者本人)。氏族内部不反惩罚
      执行者——执行血仇是义务,受氏族尊重。血仇系统跨代稳定(至少 5 个世纪),且长期无有效
      中央权威介入内部纠纷(奥斯曼统治在北部山区薄弱至不存在)。
    - 科西嘉 vendetta(约 16-19 世纪):类似机制,微小冒犯→灭门式报复,执行者不受本社群反制。
    - 黑山 krvna osveta(约 17-19 世纪):同样。

    分析:
    (a) scope 判断——这些社会是否"无中心权威"?山区氏族社会长期缺乏有效中央暴力垄断——是。
    (b) 重复交互在场?氏族内部每日面对面,跨氏族虽不每日碰面但有长期交互框架——是。
    (c) 违规严重度(客观):侮辱→物理伤害=0,资源损失=0,权利侵犯(名誉)≤1 → 合成<1。
        Punishment=谋杀→暴力=4,合计 severe → ratio>>1.3(过度)。
    (d) 预测(ii)断言过度惩罚触发反惩罚——但在此系统中,氏族对执行血仇者不施加反惩罚,反而
        视其为荣誉履行。其他氏族可能反击(新血仇),但那是跨氏族报复循环,非"因惩罚过度而对
        惩罚者的反惩罚"——这是派系冲突而非校准性反惩罚。
    (e) 预测(iii)断言"零或负相关+跨代稳定=空格"——血仇系统展示:惩罚力度不跟踪客观违规
        严重度(一句侮辱可=谋杀),且系统跨代稳定(数世纪)。

    消化检查:文化校准活门能否合法消化此案例?
    - 在 Kanun 文化内,"侮辱"被感知为极严重违规(荣誉=生命等价)。按文化内基准,ratio 在
      感知层面≈1。
    - 但这恰暴露了 operationalization 的双轨张力:客观轴(物理/资源/权利评分)给出 ratio>>1,
      文化校准给出 ratio≈1。以哪个为准?若以文化校准为准→此案例被吸收→但 falsifiability(a)
      的测试窗口就被文化校准活门封闭了——任何表面 ratio 失配都可以被"文化内感知不同"
      吸收。
    - 若以客观轴为准→此案例是净杀反例→DED-021 预测(i)(ii)(iii)全部受损。
    - 当前的 operationalization 没有给出裁决规则,故此案例卡在"净杀 vs 被消化"之间——取
      决于修订后的测量规则。

    结论:【揭出 cultural calibration 后门的实操后果——不裁决此门的优先级,则无法裁定此案例
    是否杀推论】。此非反例本身杀推论,而是反例猎捕揭出了 operationalization 的架构级缺陷。
    此缺陷已在 measurement_orthogonality 判 required。

    ========== 攻击 2:私刑正义 (Vigilante Lynching) — 被部分消化,揭出同源后门 ==========

    目标:falsifiability(b)"过度惩罚不引发反惩罚"
    候选案例:19 世纪末-20 世纪初美国南部/西部的私刑处决、当代弱治理区域的 mob justice。
    一个被指控偷马/偷牛的小偷(客观:物理伤害=0,资源损失轻-中)→被暴民私刑处死(暴力=4)。
    ratio>>1.3。暴民参与者在本社群内不被反惩罚——常被视为"维护秩序的英雄"。
    消化口:此类社会处于"有 weak state but not zero state"的中间带——有法律但执法不力,
    落在 excluded_outcomes(1)边界。且 mob 成员本身可能就是受害者(第二方)而非纯第三方。
    但 stripped-down 版本(纯粹旁观者参与私刑)仍在射程内。社区对私刑者的正面声誉回报
    与预测(ii)"过度惩罚→声誉惩罚"直接矛盾。
    结论:被 scope 边界部分消化(weak state),但核心矛盾仍在——文化校准可吸收(社区认为
    私刑"匹配"),暴露同源后门。非 clean kill,但与攻击1 联立强化 measurement 问题。

    ========== 攻击 3:替罪羊/巫术指控 (Scapegoating/Witchcraft) — 被消化,反哺 boundary ==========

    目标:falsifiability(b)
    候选案例:传统社会中的巫术指控——被控者的"违规"(施行巫术)客观上不存在(severity 无
    法在三维客观轴评分——无物理伤害、无资源损失、无权利侵犯)。惩罚=死亡/放逐(severity=
    extreme)。ratio 无法计算(分母无定义→或 ratio=∞)。指控者/执行者不被社群反惩罚——
    巫术指控机制跨文化、跨代稳定。
    消化口:落入 excluded_outcomes(3)——"违规行为无严重度共识的领域"。在巫术信仰文化内,
    巫术被共识性地认为是最严重的违规之一(威胁全群体生存)。"共识存在"使巫术指控落在射程
    内,"severity 不可操作化"(因客观轴评 0)又使其落在排除钩子(3)——这是一条灰色地带:
    共识存在=射程内,但客观 harm=0=排除?两钩矛盾暴露了排除钩子(3)缺乏事前操作化判据的
    问题(已在 scope_hook 做 should)。
    结论:被 existing boundary mechanism 消化(落在排除钩子(3)与射程的灰色区),非净杀。
    但反哺了 should:排除钩子(3)须补事前判据否则在巫术类案例中产生模糊。

    ========== 攻击 4:仪式性过度惩罚 (Ritual Over-Punishment) — 被消化 ==========

    目标:falsifiability(b)
    候选案例:某些传统社会中的"零容忍"规范——如对乱伦/禁忌违反施加极刑(死亡/放逐)即使
    未造成任何实际伤害(双方自愿的禁忌关系)。客观 harm=0,punishment=致死,ratio>>1.3。
    执行者(长老/群体)不受反惩罚。系统跨代稳定。
    消化:与攻击1 同源——文化内对此类违规的感知严重度为极端(威胁宇宙秩序/群体存续),客观
    轴评分不反映文化严重度。同源问题,非独立新击。

    ========== 猎捕结论 ==========

    未净到 scope 内干净必杀反例(血仇/世仇系统是最强攻击,但其裁决取决于 operationalization
    中文化校准与客观轴的优先级——而此优先级恰是本轮审查发现的 required 缺陷)。私刑正义/
    替罪羊/仪式性过度惩罚均被已有机制合法消化或落在灰色边界。

    但反例猎捕【成功揭出 operationalization 架构级缺陷】:文化校准活门在血仇/世仇类案例中
    制造了"净杀 vs 被消化"的两可裁决——当前 operationalization 没有给出当客观轴与文化感知
    分歧时的优先规则。这不是某个案例杀了推论,而是测量架构的不完备使得核心反例的裁决被悬置——
    这是比净杀反例更根本的发现,因为它揭示推论在测量层面尚未达到可被干净攻击的状态。
    此缺陷已在 measurement_orthogonality 判 required。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未完全复发,但文化校准后门与 DED-004 的病理同族】。

    DED-004 的死因是:唯一新意被实证推倒、改措辞后试图用同一批数据捞"打折版"命题、事后
    开脱活门未堵。DED-021 不同:
    - 本条有多个独立的可证伪预测((i)(ii)(iii)),且有 independent measurement 设计——
      不同于 DED-004 只有一个经验主张被围剿。
    - 本条的空格预测结构使其证伪条件明确——不同于 DED-004 的模糊可证伪性。
    - anti-talisman 和 falsifiability 段的防循环意识是显式的。

    但 cultural calibration 后门若未堵上,会产生与 DED-004 同质的病理:
    - DED-004 的"事后开脱"= 遇反例辩称"不算真正的 X"(定义回缩)。DED-021 的"文化校准
      吸收" = 遇 ratio>>1.3 无反惩罚的案例辩称"在该文化内违规被感知为严重→ratio≈1"。
      两种活门的结构相同:都是用一个事后可调的参数(文化严重度感知/定义 X 的范围)来消化
      表面反例。
    - 区别在于:DED-021 的活门出现在 operationalization 层而非理论陈述层,且作者在理论
      层做了防循环设计——所以可以通过修 operationalization 来堵,而非塌核。

    判断:DED-004 未复发(本条的结构防循环意识远强于 DED-004,有多条独立证伪轴)。但
    cultural calibration 后门必须在 required 修订中堵死,否则在操作层面实际等效于 DED-004
    的不可证伪——理论说可证伪、操作上任何反例都被覆盖。

    DED-007(焊死测量轴):【未复发——轴的意图是正交的】。

    DED-007 的死因是自变量分母"实际获授者"偷用了被预测量(货币形式)——焊死在测量定义里。
    DED-021 不同:
    - violation_severity 不从 punishment_severity 计算、不由 ratio 反推
    - punishment_severity 不从 violation_severity 计算、不由 ratio 反推
    - counter_punishment 不由 ratio 反推
    - ratio 由两独立轴计算

    作者明确知道 DED-007 的教训并做了 explicit 防护(anti-talisman 四防线、operationalization
    多处强调独立编码)。测量轴在概念和操作上都是异源的——没有 DED-007 式"分母偷用结果"的
    结构性焊死。

    Cultural calibration 引入的不是 DED-007 式"焊死"(同源测量),而是另一种病理:"静默
    吸收"(通过模糊优先级让一个轴覆盖另一个轴)。两者不同:焊死是无法拆的(轴定义本身含被
    预测量),吸收是可拆的(通过明确优先级规则)。故 DED-007 未复发,但 cultural calibration
    问题需独立修(已在 measurement_orthogonality 判 required)。

  required_fixes:
    - |
      [required] brick=conclusion 重叠诚实化。DED-021 预测(i)"第三方惩罚的力度与违规严重度
      正相关"与 BR-L2-016 的经验内容高度重叠。修订方案三选一:(a)将预测(i)从核心预测降级为
      由 BR-L2-016 建立的上下文,本条的独立经验预测只保留(ii)和(iii);(b)保留预测(i)但显式
      标注"此预测的经验基础由 BR-L2-016 建立(Fehr & Fischbacher 2004),本条将其操作化为 ratio
      测量框架并将执行者锁定为第三方,其独立增量在于田野验证+ratio定量化而非实验室存在性";
      (c)将预测(i)改写为比较性主张(如"第三方惩罚的严重度跟踪精度不低于第二方惩罚"或"在没有
      第三方惩罚的群体中,比例跟踪由其他机制维持且精度低于有第三方惩罚的群体")以建立真正的
      经验独立性。同时修正 discriminant_validity 中"BR-L2-016 单独不指定谁在执行比例跟踪"
      的事实性错误陈述——BR-L2-016 的 behavioral_economics source 已明确指定第三方为执行者。
    - |
      [required] 文化校准后门裁决规则。operationalization 须明确:当三维客观轴(物理伤害/
      资源损失/权利侵犯)的综合评分与文化内感知严重度分歧时,以哪个为准?建议方案二选一:
      (a)客观轴优先——violation_severity 的评定以三维客观评分为主,文化内感知作为辅助
      校验;当二者显著分歧时,该案例标注为"跨文化测量分歧",不用于支持或反对理论,且分歧案例
      的比例必须报告(作为测量信度的透明指标);(b)双轴平行——新增独立于惩罚行为的"文化严重度
      认知"测量轴(通过民族志访谈/问卷独立收集,不与惩罚行为共享数据源),两轴各自计算 ratio,
      只在两轴一致时声称预测成立,分歧时标注为"测量不确定"。无论选哪条,均须堵死"因表面 ratio
      失配而事后援引文化校准来消化"的活门——文化校准的触发必须基于事前收集的独立严重度认知
      数据,而非事后由 ratio 值本身推导。
    - |
      [should] 排除钩子(3)"违规行为无严重度共识"补事前判据。"无共识"的判定不能仅由研究者
      判断,须给出可操作标准:如民族志访谈中严重度评分的一致性阈值(ICC<0.6 或 Fleiss' κ<0.4
      视为无共识)或多源报告的严重度排序分歧度。防止"遇反例→事后辩称无共识→排除"的消化链。
      当前 operationalization 的 limitations 有"须先确认共识存在"的意识,但缺具体判定程序。
    - |
      [should] ratio 容差带阈值独立验证的诚实标注。当前 ±30% 容差带([0.7,1.3])来自资源分配
      公平实验(Henrich et al. 2005 的分配博弈容忍带),推广到"惩罚失配容忍带"是未经验证的假设。
      分配不公的容忍带与惩罚不配的容忍带可能不同(人们对"罚错"比"分错"更敏感或更不敏感均可能)。
      宜在 limitations 中显式标注此推广假设,并注记惩罚场景的容差带待独立实验标定。
    - |
      [should] discriminant_validity 对手认定修正。当前 discriminant_validity 将本条的"平凡
      组合"风险指向 DED-015+BR-L2-014,但真正共享经验内容的是 BR-L2-016。应重写守卫①段:
      将对手从 BR-L2-014 修正为 BR-L2-016,诚实列出 BR-L2-016 已覆盖的内容(TPP severity 跟踪
      severity + 失配引反惩罚的现象级描述),再论证本条真正增量(ratio 操作化 + 闭合校准机制 +
      主力执行者定位 + 空格预测 + 田野验证企图的系统化)。做对了判效更强(读者知道你在跟正确的
      对手比),做错了判效虚假(读者发现你避开了真正重叠的砖去比一个不重叠的)。
    - |
      [should] 血仇/世仇系统边界案例增录。即使 cultural calibration 后门修好,血仇/世仇系统
      (阿尔巴尼亚 Kanun、科西嘉 vendetta、黑山 krvna osveta)仍值得作为 boundary_case 录入
      ——它们是"无中心权威+重复交互+第三方惩罚存在"的最干净天然实验之一,且其惩罚动态(侮辱→
      谋杀)与 DED-021 预测的"比例跟踪"存在方向性张力。无论修订后文化校准规则如何裁,此案例
      都应被理论正视而非回避。可参照 DED-021 已有 boundary_cases 中的荣誉文化 candidate
      (当前分析认为处于射程边界——但"弱国家"的划线对山区氏族社会不够精确),做更精细的分析。

author_response_round_1: |
  针对 ADV-REVIEW-026 round-1 的 2 required + 4 should,逐条回应如下:

  [required ① — brick=conclusion 重叠] 接受。预测(i)已显式标注"[经验来源:BR-L2-016]",收缩所有权主张为"ratio 操作化+主力执行者定位+田野验证"。同步修正了三处 BR-L2-016 相关的事实性错误:(a)derivation 步骤2——"BR-L2-016 单独不指定谁在执行比例跟踪"改为"BR-L2-016 已覆盖此关联,本步增量是 ratio 操作化和主力执行者定位";(b)falsification_trace note——"压在对 BR-L2-014 的延伸上"改为"压在对 BR-L2-016 的延伸上",三层递进(BR-L2-014→BR-L2-016→DED-021);(c)discriminant_validity——BR-L2-016 的描述从"不讲比例跟踪由哪一方执行"改为诚实承认其 behavioral_economics source 已指定第三方,增量列于 ratio 操作化/闭合校准/主力定位。

  [required ② — 文化校准后门] 接受,选方案(a)客观轴优先。operationalization.violation_severity.measurement 新增"分歧裁决规则":当三维客观轴与文化内感知严重度实质性分歧时,以客观轴评分为主——ratio 按客观轴计算,案例标注为"跨文化测量分歧"、不单独用于支持或反对理论、分歧比例透明报告。同时堵死活门:文化内感知严重度数据须从事前独立来源收集,不得因表面 ratio 失配事后援引文化校准消化反例。选(a)而非(b)的理由:双轴平行方案虽更保险但新增测量轴的负担过重、且两轴一致时声称预测成立的逻辑(逻辑与)会因一个轴的不可靠而拖累另一个轴——不如单轴优先+分歧透明报告干净。

  [should ③ — 排除钩子(3)无共识判据] 接受。excluded_outcomes(3)新增事前判据:ICC<0.6 或 Fleiss' κ<0.4 视为无共识,多源报告方向不一致≥40%亦视为无共识。判据须在观测惩罚前裁定,不得事后回填。

  [should ④ — ratio 容差带推广假设] 接受。punishment_violation_ratio.measurement 新增诚实标注:Henrich et al. 2005 ±30%来自分配公平实验,推广至惩罚失配容忍带是未经验证的跨领域迁移假设,待独立实验标定。

  [should ⑤ — discriminant_validity 对手修正] 接受。防平凡化守卫标题从"DED-015+BR-L2-014"改为"BR-L2-016",正文从与 BR-L2-014 的假想敌对比改为与 BR-L2-016 的诚实对比——先列出 BR-L2-016 已覆盖内容(TPP severity 追踪+falsifiability 近义),再列本条四重增量(ratio 操作化/闭合校准/主力定位/空格预测),防平凡化结论基于正确的对手得出。同时第一段"独有可证伪预测"中 BR-L2-016 的描述从"不讲比例跟踪由哪一方执行"修正为实事求是。

  [should ⑥ — 血仇/世仇 boundary_case] 接受。新增 boundary_case"血仇/世仇系统中的第三方惩罚——阿尔巴尼亚 Kanun/科西嘉 vendetta/黑山 krvna osveta",标注为跨文化测量分歧案例,分析其与 DED-021 的方向性张力及适用边界。

