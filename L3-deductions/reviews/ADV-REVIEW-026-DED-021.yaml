    verified 三条门全部通过:①无 required 级缺陷(round-1 两条均已修复,本轮未发现新的 required);
    ②反例猎捕完成(round-1 四路+本轮五路,无 scope 内净杀);③未重蹈 DED-004/007(文化校准活门
    已堵、测量轴保持异源正交)。

    以下 should 级观察不阻断 verified,但建议在后续迭代中考虑:
    (1)"主力执行者"比较性主张证据薄——声称第三方是比例跟踪的"主力"执行者,但未提供第三方与
       第二方在严重度跟踪精度上的比较证据。若第二方惩罚同样(或更精确地)跟踪严重度,则"主力"
       定位缺乏经验支撑。建议降格为"第三方也是比例跟踪的重要执行者"或补充比较性证据。
    (2)最大增量与最弱证据重合的结构性张力——本条最 genuinely novel 的部分是预测(ii)的闭合
       校准循环(失配→不公厌恶→反惩罚→个人利益动机校准),但支持此预测的经验锚(Barclay/
       Nelissen/Cinyabuguma)被诚实标注为 confidence=weak。理论的最强增量骑在最弱的经验
       腿上,这一结构性张力未被 falsification_trace 认作风险。BR-L2-016 的 behavioral_
       economics note 已述"惩罚不配引发第二轮不满"的现象,本条将此现象升级为机制——升级的
       经验基础尚薄。
    (3)范围限制+测量分歧规则的联合效应收窄证伪窗口——排除钩子(有中心权威/一次性交互/无严重
       度共识)+客观轴优先裁决规则+测量分歧标注(不用于支持或反对)的联合效应是:理论的实战
       证伪窗口限于"无国家+重复交互+严重度共识存在+客观轴与文化感知一致"的传统小规模社会。
       这不是循环论证(所有限制均有事前结构判据),但使理论的经验野心收敛于相对窄的适用域。
       当前作者对此诚实透明,不构成缺陷,但应知会。
    (4)预测(iii)中"跨代稳定"的精确操作化——当前以"跨代维持共享规范"定义,但未给出可操作的
       判定标准(规范连续性的测量指标/代际数量阈值/外部冲击控制)。若不做操作化,空格B"零或
       负相关→跨代稳定"的证伪测试可能因"稳定"标准模糊而产生裁量争议。建议参照 DED-003 的
       "群体凝聚力"操作化先例补具体判据。
    (5)校准性反惩罚与派系性反惩罚的田野区分——anti-talisman 要求排除派系性/个人恩怨驱动的
       反惩罚,但在紧密小群体中几乎所有负面行为都有派系元素。严格排除后,可观测的"纯粹校准性
       反惩罚"可能极少,使预测(ii)在田野中的测试窗口进一步收窄。建议在 limitations 中诚实地
       标注此操作化挑战。

  red_flag_findings:
    brick_conclusion: |
      【Round-1 已修复,本轮确认通过】。预测(i)现已显式标注"[经验来源:BR-L2-016]",所有权
      收缩为 ratio 操作化+主力执行者定位+田野验证。derivation 步骤2 诚实承认"BR-L2-016 已
      覆盖此关联,本步增量是 ratio 操作化和主力执行者定位"。discriminant_validity 的防平凡化
      守卫已从与 BR-L2-014 的假想敌对比改为与 BR-L2-016 的诚实对比。预测(i)的经验基础归属
      BR-L2-016 是结构性事实(无法改变也不需要改变),关键在于本条不以此冒充独立经验发现。
      当前文本对此诚实透明。

      残留注意:预测(i)仍作为三条核心预测之一出现在 statement 中,虽然标注了经验来源,但读者
      可能误以为它是 DED-021 的独立贡献。建议在 statement 中将预测(i)的措辞从"在无中心权威
      的群体中,第三方惩罚的力度与违规严重度正相关"改为"如 BR-L2-016 已建立的,第三方惩罚力度
      与违规严重度正相关——本条将此关联操作化为 ratio 框架并推向田野验证",使经验从属关系在
      首次阅读时即清晰。此为措辞建议(should),非 required。

    nontriviality_cell_check: |
      【通过,但"跨代稳定"需更精确操作化】。表A 空格(过度→接受/匹配→反惩罚)和表B 空格
      (零或负相关→跨代稳定)均为可被现实反例填上的经验预测,非同义反复。

      表B 空格的逻辑链是:第三方惩罚不跟踪严重度→规范的分级结构无法通过惩罚传递→群体不能
      跨代维持共享规范。此链含一个隐含假设:第三方惩罚校准是传递规范分级结构的必要渠道。
      若存在替代渠道(如通过 explicit teaching/ritual/storytelling 传递"杀人>偷窃"的严重度
      分级,而不依赖惩罚校准),则表B 空格可被填上而理论不塌——因为理论的预测(i)只说第三方惩罚
      跟踪严重度,不声称它是唯一渠道。当前 derivation 未讨论替代渠道的可能性,建议在
      nontriviality_test 中补一句:若发现某社会通过非惩罚渠道(如仪式/口头传统)传递规范分级
      且第三方惩罚不跟踪严重度但群体仍跨代稳定,则此反例仅杀伤预测(i)和空格B 而不杀伤预测
      (ii)(iii)——因为反惩罚校准循环可独立于预测(i)运行。此澄清增强而非削弱理论的非平凡性
      (暴露更多独立可攻击面)。Should 级建议。

      表A 空格A1(过度→接受):依赖 BR-L2-013 不公厌恶推广至"惩罚失配作为不公平事件"。此
      推广在 BR-L2-016 中已有现象级先占("惩罚不配引发第二轮不满"),但本条将其做成 ratio 阈值
      化的可操作预测([0.7,1.3]匹配带→不触发;>1.3 过度→触发)。操作化增量真实,空格非定义性。
      通过。

    measurement_orthogonality: |
      【Round-1 已修复,本轮确认通过——但分歧规则造成不对称证伪窗口】。

      Round-1 的文化校准后门已通过"客观轴优先+分歧案例标注+事前独立数据收集"三件套堵死。
      violation_severity(物理/资源/权利三维独立编码)与 punishment_severity(暴力/经济/社会
      三维独立编码)保持异源,ratio 由两独立轴计算,counter_punishment 不由 ratio 反推。
      测量架构现在是干净的。

      残留注意——"分歧裁决规则"的不对称效应:当客观轴与文化感知一致时(多数"常规"违规:
      杀人/伤人/偷窃等),案例进入证伪测试窗口。当二者分歧时(荣誉文化中的侮辱/神圣价值违规),
      案例被标注为"跨文化测量分歧"、不单独用于支持或反对理论。这制造了一个不对称的证伪窗口:
      理论在"容易通过"的案例中被测试,在"可能失败"的案例中被排除。这不是 DED-007 式焊死
      (轴仍是独立测量的),也不是 DED-004 式循环(分歧由事前客观标准裁定、不由结果反推),
      而是一种"选择性测试"效应——理论的实战证伪机会集中在客观轴与文化感知一致的社会/违规
      类型中,而此类案例恰好最可能支持理论。作者对此诚实透明,分歧案例必须报告,故不构成
      required 缺陷。但应知会:理论的 empirical ambition 受此规则约束而收窄。Should 级观察。

      未重蹈 DED-007:测量轴在概念与操作上均保持异源,无 DED-007 式"分母偷用结果"的结构性焊死。
      Round-1 修复后的客观轴优先规则进一步加固了测量独立性。

    scope_hook_independent_of_result: |
      【通过】。三个排除钩子均按事前结构渠道划定:

      (1)有中心惩罚权威→由独立的制度特征(专门执法机构/法院/成文刑法/暴力垄断)判定,不由
         是否观测到校准决定。
      (2)一次性交互→由 AXIOM-003 的结构条件(是否有重复交互)判定。
      (3)违规行为无严重度共识→round-1 修订后已有事前判据:ICC<0.6 或 Fleiss' κ<0.4 或
         多源报告方向不一致≥40%。判据须在观测惩罚前裁定、不得事后回填。

      三个钩子均独立于结果,不判 required。

      微小注意:钩子(3)与测量分歧规则之间存在交互——某类违规可能既满足"有严重度共识"
      (因文化内一致认为极严重)又触发"客观轴与文化感知分歧"(因客观 harm≈0)。此情况下,
      测量分歧规则优先(案例被标注为分歧、不用于支持或反对),而非被排除钩子(3)整体排除。
      两条规则各自独立运作、不矛盾,但联合效应是进一步收窄证伪窗口(见 measurement_
      orthogonality 的 should 观察)。

    criterion_tier_match: |
      【通过】。ratio 连续量分三档(过度>1.3/匹配[0.7,1.3]/不足<0.7),底层编码均为 0-4
      五级序数,等权合成后比值。三档匹配三个被预测量:
      - 过度→反惩罚或声誉惩罚(来自 BR-L2-013 不公厌恶)
      - 匹配→接受(不触发不公厌恶)
      - 不足→声誉惩罚(纵容帮凶)

      档位足够区分"未发生/轻微/中等/严重/极端",不会因档位过粗吞噬变异。容差带 ±30% 来自
      Henrich et al. 2005 分配公平实验,已诚实标注为跨领域推广假设待独立验证。合规,不判 required。

      残留注意:过度与不足的"反应类型区分"在实际操作中可能模糊。预测(ii)表述为:
      过度→"反惩罚或声誉惩罚"(两者均可),不足→"声誉惩罚"(仅此)。即过度可触发两种反应中的
      任一种,不足仅触发声誉惩罚。这种不对称预测的实操区分依赖于"反惩罚"(主动制裁)与"声誉惩罚"
      (标签/ gossip/排斥)的编码边界——在紧密小群体中,gossip 本身就是一种有力的反惩罚,二者
      的边界在实践中可能模糊。建议在 operationalization.counter_punishment_to_punisher 中
      明确"反惩罚"与"声誉惩罚"的编码区分标准。Should 级。

    anti_talisman_cashed: |
      【Round-1 修复后防线坚实,通过】。

      anti_talisman_clause 四条防线经 round-1 文化校准修复后全部有效:
      (a)违规严重度与惩罚严重度在独立轴上评定,不共享条目——客观轴优先规则确保违规严重度
         不被文化背景知识(含惩罚信息)污染。
      (b)不得因"惩罚重"反推"违规必重"——循环论证被客观轴独立编码堵死。
      (c)不得因"群体稳定"反推"惩罚必是匹配的"——结果倒推前件规则到位。
      (d)反惩罚判定独立于 ratio——须先观测反惩罚行为,再检验其与 ratio 的关系;排除派系性/
         个人恩怨驱动的负面行为。

      承重锚检查(至少一个真独立测量驱动量):
      - Fehr & Fischbacher (2004):违规严重度(剥削比例)由实验者外生操纵,惩罚力度独立测量→
        YES,真独立。confidence=strong,标记正确。
      - Boehm (1999):定性民族志记录,存在共同方法方差风险→作者诚实降 confidence=moderate,
        并标注"更多支持渐进升级而非横截面对应"。正确。
      - Barclay/Nelissen:反惩罚方向证据"较薄",confidence=weak→诚实标注。正确。

      至少一个承重锚真独立测出驱动量,满足 anti-talisman 要求。通过。

    anchor_fact_check: |
      【无事实错,但 Boehm 锚对"横截面严重度分级"的支持弱于对"重复违规升级"的支持】。

      三锚逐核:
      - Fehr & Fischbacher (2004):TPP 罚金与剥削比例正相关。结论准确,方法学标注正确。
        无事实错。
      - Boehm (1999):作者诚实标注"分级到底是'对同一违规类型的重复升级'还是'对不同严重度
        违规的分级'需要逐案区分——目前民族志数据更多支持前者而非干净的后者"。此标注准确且
        重要——Boehm 数据对 DED-021 核心主张(不同严重度违规→不同力度惩罚的横截面对应)的
        支持弱于对"重复违规→渐进升级"的支持。作者将 confidence 降为 moderate 是恰当的。
        无事实错,但读者应注意此锚对"横截面严重度分级"的 probative value 有限。
      - Barclay/Nelissen/Cinyabuguma:反惩罚方向证据标注为"较薄"和"偏方向性而非充分复现",
        confidence=weak→诚实。Cinyabuguma et al. (2006)发现过度惩罚者在后续轮次中遭报复,
        但跨实验复现不如"惩罚带来声誉收益"稳健——此评估准确。

      Kanun/vendetta/krvna osveta boundary_case(round-1 新增)的分析精细且诚实,正确地
      标注为跨文化测量分歧案例,分析其与 DED-021 的方向性张力及适用边界。无事实错。

      通过。

    definition_vs_prediction: |
      【通过】。三个预测(i)(ii)(iii)均有可被独立验证的经验内容,非定义性真理:

      - 预测(i):"第三方惩罚力度与违规严重度正相关"——可被"零或负相关+跨代稳定"的社会证伪。
        关联由独立测量的双轴计算,不由"稳定"结果反推。
      - 预测(ii):"过度惩罚→反惩罚/声誉惩罚;不足惩罚→声誉惩罚"——可被"过度/不足但不触发
        相应反应"的群体证伪。ratio 由独立编码裁定,不由"是否发生反惩罚"反推。
      - 预测(iii):空格预测,可被填上反例证伪。

      关键范围条件均可由独立结构特征判定:
      - "无中心权威":专门的执法机构/法院/成文刑法/暴力垄断之存在与否→独立结构判据
      - "重复交互":AXIOM-003 的结构条件→独立于惩罚观测
      - "违规严重度共识存在":ICC<0.6/Fleiss' κ<0.4→事前可裁定

      不存在 DED-004 式"由被预测量反推前件"的定义性循环。通过。

    enumeration_and_species: |
      【未猎到干净的第 N+1 类,通过】。本推论非 N-species 穷举枚举结构——表A(2×3)和表B(2×2)
      是对给定判据维度的逐格预测,非声称"第三方惩罚的 N 类形态可穷举"。

      Round-1 已探两类潜在 N+1("无视/忽略"→可在现有框架内操作化;"事前规避"→落在理论预测内)。
      本轮追加两路探索:

      (a)"炫耀性/美德信号惩罚"(conspicuous punishment):第三方惩罚的动机不是校准违规严重度
      而是向观众发出"我是好人/我是强者"的信号。此动机下惩罚力度追踪的是观众效应(audience
      effects)而非违规严重度——可能产生 ratio 失配。但理论的 anti-talisman 机制已要求排除
      非校准驱动的惩罚行为(如派系性/个人恩怨),炫耀性惩罚是否落入此排除取决于其操作化。当前
      框架未明确此类动机的处理,但未构成不可消化的外部物种——可在 counter_punishment 的
      limitations 中加注"非校准动机的惩罚行为不在预测(ii)的射程内"。Should 级建议。

      (b)"制度化第三方惩罚"(institutionalized third-party):长老会/宗教法庭/部落议事会等
      制度化但非国家的第三方惩罚——处于"无中心权威"(无国家)与"专门化裁决者"(有 institution)
      的灰色带。制度化第三方的校准机制可能与分散个人的校准机制不同(如长老受 precedents 约束
      而非个人 inequity aversion 驱动)。DED-021 的"第三方"概念似乎以分散个体为默认模型,
      对制度化第三方的适用性未明确。此非独立 species(仍是第三方惩罚的子类),但 scope 边界
      值得在 excluded_outcomes 或 limitations 中澄清。Should 级建议。

      未猎到不可消化的第 N+1 类。通过。

    primary_suspect_aim: |
      【方向对,但漏认两条结构性软肋——should 级】。

      文件自认 primary_suspect:"第三方惩罚的严重度校准本身——即预测(i):在真实群体中第三方
      惩罚力度是否真的跟踪违规严重度。"note 中的三层递进(BR-L2-014→BR-L2-016→DED-021)
      诚实标注了依赖链。方向正确。

      但以下两条结构性软肋未被认作风险:

      (a)【"主力执行者"比较性主张证据薄——应列入 secondary_suspect】。本条声称"第三方是比例
      跟踪的主力执行者",但未提供第三方与第二方在严重度跟踪精度上的比较证据。若第二方惩罚同样
      (或更精确地)跟踪严重度(受害者对更严重的伤害实施更强的报复——这几乎肯定是事实),则"主力"
      定位缺乏经验支撑。此主张的溃败场景(第二条所述:"若发现比例跟踪可由第二方惩罚单独维持且
      第三方从不介入→DED-021 损伤但 BR-L2-016 存活")虽提供了独立可攻击面,但"主力"一词暗示
      第三方在比例跟踪中的贡献超过第二方——这是定量比较性主张,需要定量比较性证据。目前文件的
      锚均只展示第三方做了比例跟踪,未展示第三方比第二方做得更多/更准。建议:要么降格措辞("重要
      执行者"替"主力执行者"),要么在 falsification_trace 中承认此比较性主张的经验基础薄并将
      其列入 secondary_suspect。

      (b)【最大增量与最弱证据重合——结构性张力应认作风险】。本条最 genuinely novel 的部分是
      预测(ii)的闭合校准循环(失配→BR-L2-013 不公厌恶→反惩罚→惩罚者有个人利益动机校准)。
      但支持此预测的经验锚(Barclay/Nelissen/Cinyabuguma)被诚实标注为 confidence=weak
      ("反惩罚方向的证据较薄""偏方向性而非充分复现")。BR-L2-016 的 behavioral_economics
      note 已现象级描述"惩罚不配引发第二轮不满",本条将其升级为带机制的闭合循环——升级的
      经验基础恰是最弱的一环。此张力应被 falsification_trace 认作风险(列入 secondary_suspect
      或 primary_suspect 的补充说明),而非仅置于 real_world_anchors 的 confidence=weak
      标注中。

      平凡化检查:discriminant_validity 的防平凡化守卫经 round-1 修正后诚实——正确面对
      BR-L2-016(而非 BR-L2-014)为真正对手,列出四重增量。其中 ratio 操作化+闭合校准机制+
      空格预测是 genuine delta,"主力执行者"定位如(a)所述证据薄但逻辑上仍是独立主张。
      整体未坍缩为 BR-L2-016 的平凡重述。通过。

  counterexample_hunt: |
    Round-1 已猎四路(血仇/私刑/替罪羊/仪式性过度惩罚),揭出文化校准后门这一架构级缺陷
    (已在 round-1 修复)。本轮追加五路独立猎捕,不与 round-1 重复:

    ========== 新攻击 1:因纽特式修复正义 (Inuit Restorative Justice) ==========

    目标:falsifiability(a)"第三方惩罚力度与违规严重度正相关"
    候选案例:传统因纽特社会中,冲突通过"歌斗"(song duel)、公开羞辱、社区讨论解决。第三方
    (社区成员)介入的重点是修复关系而非按比例惩罚——惩罚的"剂量"不一定跟踪违规的客观严重度。
    但更严重的违规(如重复杀人)确实触发更严厉的回应(放逐/处决)→严重度跟踪仍然存在,只是
    表达形式(修复 vs 惩罚)不同。修复性干预可被编码在 punishment_severity 的社会轴上。
    结论:【被消化】——修复正义并不消除严重度跟踪,只是改变了其表达形式。DED-021 的惩罚
    操作化已含社会制裁(gossip/排斥),修复性干预落入此范围。

    ========== 新攻击 2:神圣价值违规 (Sacred Value Violations) ==========

    目标:falsifiability(b)"过度惩罚不引发反惩罚"
    候选案例:宗教禁忌违反(亵渎/渎神)、乱伦禁忌违反——客观 harm=0(物理伤害/资源损失/
    权利侵犯均为零或极低),但惩罚=死刑/放逐(ratio>>1.3)。执行惩罚的第三方(宗教权威/
    社区长老/群体成员)通常不受反惩罚——被视为执行神圣意志/维护宇宙秩序。
    消化口:客观轴评分为 0 或极低,但文化内感知严重度为极端→触发测量分歧规则→案例被标注
    为"跨文化测量分歧"、不单独用于支持或反对理论。且此类违规的"严重度共识"极强(有时是
    整个文化最严重的违规)→排除钩子(3)不适用(共识存在),但测量分歧规则适用。
    结论:【被消化,但暴露适用域收窄问题】。神圣价值违规在传统社会中极为常见(几乎每个社会
    都有其神圣禁忌),若全部落入测量分歧排除区,理论的实战证伪窗口被显著压缩——能测试理论
    的只剩下"常规"违规(杀人/伤/偷),而这些正是理论最可能通过的案例。此非净杀反例,而是
    测量架构选择(a)的附带后果。已在 measurement_orthogonality 的 should 观察中记录。

    ========== 新攻击 3:道德失语 (Moral Dumbfounding) ==========

    目标:falsifiability(b)
    候选案例:Haidt 的道德失语实验——被试 condemnation 无害禁忌行为(如清洁后食用经消毒的
    蟑螂、自愿使用避孕措施的同胞性行为)为"道德错误",但无法给出 harm-based 理由。若第三方
    惩罚此类行为,客观 harm=0 但惩罚>0→ratio 发散。
    消化口:与攻击2 同源——客观轴低/文化感知高→测量分歧。且此类案例在自然群体中的普遍性
    存疑(实验室构造 vs 真实社会规范)。结论:【被消化,同测量分歧区】。

    ========== 新攻击 4:现代企业举报人 (Corporate Whistleblowing) ==========

    目标:falsifiability(b)"过度惩罚→反惩罚"
    候选案例:企业举报人(第三方)揭露公司违规,无论其"惩罚"(揭露)与违规的 ratio 如何,举报人
    经常遭受不成比例的反惩罚(解雇/行业黑名单/诉讼 harass)——反惩罚似乎不由"举报是否比例"
    驱动,而由"举报行为本身"驱动。
    消化口:scope 外——现代企业环境"有中心权威"(法律系统/HR 部门/法院)。且举报人面对的反
    惩罚是企业/既得利益者的报复,非分散第三方的校准性反惩罚。结论:【scope 外,非净杀】。

    ========== 新攻击 5:在线匿名举报/取消文化 (Online Shaming / Cancel Culture) ==========

    目标:falsifiability(a)和(b)
    候选案例:社交媒体环境中,第三方(网民)对违规(不当言论/offensive tweet)的惩罚(公开羞辱/
    doxxing/雇主投诉)经常远超比例(一句不当言论→职业生涯毁灭,ratio>>1.3)。反惩罚("mob
    turns on accuser""backlash to the backlash")存在但高度不一致。惩罚力度更多由 virality/
    群体情绪驱动而非违规客观严重度。
    消化口:多重 scope 问题——(a)多数在线交互是一次性或准一次性的(不满足重复交互条件)→
    excluded_outcomes(2);(b)"严重度共识"在高度 polarized 的在线环境中常不成立(一半人认为
    严重、一半人认为不严重)→可能落入 excluded_outcomes(3);(c)对公众人物的长期声誉效应
    可能满足重复交互,但此类案例中的"惩罚"很难按三维轴编码(在线羞辱的资源损失如何量化?)
    →操作性挑战而非 scope 外。结论:【多路 scope 边界消化,非干净必杀】。

    ========== 猎捕结论 ==========

    本轮五路新增攻击均未猎到 scope 内干净必杀反例。Round-1 的 Kanun/vendetta 仍是最强挑战,
    现已妥善标注为 boundary_case。神圣价值违规(攻击2)揭示了理论适用域收窄的系统效应——
    非个别反例,而是一整类常见违规因测量分歧规则被排除在证伪测试之外。此已在 measurement_
    orthogonality 的 should 观察中记录,不构成 required 缺陷(因排除理由透明且基于事前规则)。

    反例猎捕完成。无 scope 内净杀。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发。Round-1 修复后的客观轴优先规则封堵了文化校准活门】。

    Round-1 判决:"文化校准后门与 DED-004 的病理同族——两者都是用事后可调参数(文化严重度
    感知/定义 X 的范围)消化表面反例。"Round-1 修复的核心动作是建立客观轴优先+分歧案例标注+
    事前独立数据收集规则——这使得"消化反例"的参数不再是事后可调的(客观轴评分是事前固定的,
    分歧判定标准是事前裁定的,文化感知数据须从事前独立来源收集)。

    当前状态下,DED-021 与 DED-004 的关键差异:
    - DED-021 有三条独立可证伪预测(i)(ii)(iii),DED-004 只有一个经验主张被围剿。
    - DED-021 的空格预测结构使其证伪条件明确(找到填上空格的社会→证伪),DED-004 的证伪条件
      模糊。
    - DED-021 的 anti-talisman 和测量协议有显式防循环设计,DED-004 没有。
    - DED-021 的范围限制和测量分歧规则均基于事前结构判据,DED-004 的事后开脱没有事前判据。

    DED-004 的结构性病理(唯一新意被实证推倒→改措辞用同一批数据捞打折版→事后开脱活门未堵)
    在 DED-021 中不存在。本条有多条独立经验腿,即使一条腿(如预测(i)的田野证据)被削弱,其它
    腿(预测(ii)(iii))仍可独立站立。

    残留注意:范围限制+测量分歧规则的联合效应使理论的实战证伪窗口收窄——这不是 DED-004 式
    循环(因所有排除均有事前结构判据),但确使理论更难被"意外"证伪。DED-021 比 DED-004 健康
    得多,但应知会此效应。已在 measurement_orthogonality 的 should 观察中记录。

    DED-007(测量轴焊死):【未复发】。

    DED-007 的死因是自变量分母"实际获授者"偷用被预测量(货币形式)——轴定义本身含被预测量,
    结构性焊死无法拆。DED-021 现状:
    - violation_severity:三维客观编码(物理/资源/权利),不参考惩罚
    - punishment_severity:三维独立编码(暴力/经济/社会),不参考违规严重度
    - ratio:由以上两独立轴计算
    - counter_punishment:独立观测,不由 ratio 反推
    - 客观轴优先规则确保文化感知不污染违规严重度编码

    四个测量轴在概念和操作上均异源,无 DED-007 式结构性焊死。Round-1 修复加固了独立性。
    未复发。

