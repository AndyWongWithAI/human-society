  should_observations:
    - |
      [should] 测量时序中的一致性需求 artifact:empty_cell_testing_subtlety 覆盖了偏好激活衰减
      (false positive 填空格),但未覆盖反向 artifact——先测 Tajfel 分配(被试刚多分给内群体)
      再测公平评分,可能因认知失调产生一致性压力("我刚偏袒了自己人→我必须认为程序是公平的"),
      人为放大评分差距(false positive 空格的强化)。建议在 empty_cell_testing_subtlety 中
      补一句:counterbalance 测量顺序或使用组间设计(一组先测分配、一组先测公平评分),
      以区隔激活衰减与一致性需求两种 artifact 的方向。
    - |
      [should] "程序公平规范内化为身份"的边界条件:当裁决者的身份本身包含"我公正不论谁受益"
      这一规范承诺时(如职业法官的专业身份、专业仲裁员的角色要求),该身份可能与群体身份竞争
      裁决情境中的激活优先级。若公平规范身份压倒群体身份,公平评分偏移可能被抑制——
      此时空格(iii)的"内群体偏好激活"前提未满足(偏好存在但被规范压制),非真填空格。
      当前 operationalization 中"需明确哪一层群体身份在裁决情境中被激活"已部分覆盖此关切,
      但未专门讨论"程序公平规范本身构成身份内容"这一特例——它与"多元交叉身份"不完全等同,
      因该身份直接与预测方向对立。建议在 boundary_cases 中增列此场景。
    - |
      [should] "未测过"vs"测过且幸存"的区分:empirical_basis_honest_note 已诚实标注三个 anchor
      均非核心空格(iii)直接检验。但单个 anchor 的 confidence 标签("moderate")可能使粗读读者
      误判为"中等实证支持"——实际上 Anchor 1 是假设性延伸(零实证)、Anchor 2 是方向性相关
      (混淆结果有利度)、Anchor 3 自标 weak-moderate。建议将三个 anchor 的 confidence 降级标注
      为"hypothetical"(Anchor 1)/"directional-only"(Anchor 2)/"weak"(Anchor 3),
      或在 empirical_basis_honest_note 中显式写一句"本推论当前整体 confidence:theoretical
      (逻辑推导自 verified 砖,核心空格待专门实验检验)",使读者不被单个 moderate 标签误导。

