id: ADV-REVIEW-024
type: adversarial_review
reviews: DED-019
layer: L3-deductions

人话摘要: |
  对 DED-019(内群体扭曲公平感知推论:同一个规矩判给自己人=公道、判给外人=不公,且人真心
  觉得自己没偏)的 round-1 独立对抗审查。裁 needs_revision——核心逻辑(群体身份着色程序公平
  感知)成立、未重蹈 DED-004/007,但四条 should 未决:(1)discriminant_validity 未对表认知失调/
  动机推理文献——"人真心认为自己没偏"实质是认知失调的群体场景实例化,非本体系独有;(2)三个
  现实锚全是方向性/弱/假设性的,累积实证支持近乎零——理论实质是预注册假设而非已验证命题,
  与'来自砖的演绎'体面不符;(3)预测(ii)'透明不缩小差距'与问责文献的方向性压力未充分消化——
  primary_suspect 的免责声明("不伤(i)/(iii)")过于扫荡:若透明系统性缩小差距,则核心声称
  "程序公平与群体偏私在认知层不可分离"被削弱;(4)预测(i)的选举锚本质是"胜者觉得选举公正、
  败者觉得不公"——此是结果有利度效应,与"群体身份"的因果关系含混。反例猎捕未净到 scope 内
  活反例(最强三击均已落入排除钩子/射程边界)。

target: DED-019
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。评分卡红旗 10 条
  逐项攻 + 反例猎捕(判 verified 前必做)+ DED-004(不可证伪循环)/DED-007(测量轴焊死)复发检查。
  裁决三态照评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活反例③不重蹈
  DED-004/007。

round_1:
  reviewer: "独立子 Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    这是一条【逻辑成立但实证基础薄弱、判别效度收窄不足】的候选。核心贡献——"程序公平感知的对
    象本身被群体身份扭曲;空格预测'有内群体偏好+程序中立+公平评分无差异为空';透明度反被用作
    自我说服材料"——不在任何单砖内:BR-L2-006 只给行为层+结果层认知("多给是应该的"),不给程
    序层认知("让多拿的规矩是公道的");BR-L2-013 只给"不平等→不公"的自动反应,不给参考群体
    内生选择;BR-L2-015 只给"程序公平→接受结果",不给"程序公平感知本身被群体身份污染而短路"
    的翻转。四砖合成给出空格,逐格判空通过。anti-talisman 双向禁反推到位(群体身份由独立标签/
    问卷测、程序中立由独立编码判、不得遇反例事后塞"其实不中立"或"其实无偏好")。测量轴主干正
    交(自变量=群体身份[Tajfel标签/事前问卷],被预测量=程序公平评分[Likert量表],异源)。未重蹈
    DED-004(不可证伪循环——空格可被干净实验填上)和 DED-007(测量轴焊死——三轴独立测)。

    但四条 should 挡在 verified 门前:

    (1)【判别效度缺口:认知失调/动机推理文献】discriminant_validity 只对表了 BR-L2-006 和
    DED-008,未对表社会心理学中更直接的相邻理论——认知失调(Festinger 1957:"我偏袒了内群体"
    +"我是公平的人"→失调→"程序是公平的")和动机推理(Kunda 1990:人从期望结论出发逆向构建
    公平判断)。DED-019 的"人真心认为自己没偏"实质是认知失调在程序公平域的应用实例,并非本
    体系独有的非平凡洞察。真正新增的是①空格预测的强制耦合(行为偏斜与认知评价不可解耦)和②
    透明度的反直觉方向(不是缓解而是加深)。这两个 delta 比文件目前声称的'非平凡'更窄,宜在
    discriminant_validity 增列对认知失调/动机推理的判别段,诚实收窄真实 delta 到①②两项。

    (2)【实证锚薄弱:理论实质是预注册假设】三个 supporting 现实锚全是弱支撑:Anchor 1(Tajfel
    范式延伸测程序公平评分)是假设性延伸——标准 Tajfel 文献测分配行为,不测程序公平评分;Anchor 2
    (选举"败者同意"非对称性)诚实标注为"胜败=结果有利度,不只群体身份"——此为结果有利度效应与
    群体身份的因果纠缠,非干净检验;Anchor 3(组织程序公平幻觉)自标 confidence=weak-moderate
    且"因果关系难剥离"。累积起来,对核心预测——尤其是逐格判空(iii)——的直接实证支持近乎为零。
    推论实质是 pre-registered hypothesis 而非 empirically anchored deduction。这不等于推论
    不成立(逻辑推导自砖是合法的),但应在 falsification_trace 或 review_summary 中诚实标注
    "当前为逻辑推演,核心空格尚未经专门实验检验",使读者不被三个弱锚的"moderate"标签误导。

    (3)【预测(ii)透明度不缩小差距:primary_suspect 的免责声明过于扫荡】文件自认(ii)是最弱腿
    并声称即使(ii)被证伪"不伤(i)和(iii)"。但此免责过于宽大:若透明度系统性缩小公平评分差距
    (问责研究的方向性压力正在于此),则表明结构因素(透明)可部分解耦"程序公平感知"与"群体身份"
    ——核心声称"程序公平和群体偏私在认知层面不可分离"的强度被削弱。不可分离性从"认知铁律"降级
    为"低透明条件下的默认态"。宜在 primary_suspect 或 statement 中缩小此声称的射程:不可分离性
    的强度可能随透明类型(程序操作透明 vs 结果透明 vs 元规则透明)和透明对象(对裁决者 vs 对外部
    观察者)而变化,非全谱一致——这正是文件 operationalization 中"透明度多维"诚实注的应有之义,
    但 statement 核心声称未对此做相应限定。

    (4)【预测(i)的选举锚:群体身份≠结果有利度】预测(i)说"仅改变受益方群体身份(自己人/外人),
    公平评分系统性偏移"。但选举锚的操作化是:胜选方(自己人赢)=觉得选举公正,败选方(外人赢)=
    觉得选举不公。胜败首先是结果有利度(self-interest),其次才是群体身份。被试可能纯粹因为"我
    赢了所以程序公正"而非"我的群体赢了所以程序公正"——前者是利己主义,后者是群体身份效应,二者
    在选举场景中天然混杂。当前 discriminant_validity 未区分"个人利益驱动"和"群体身份驱动"。
    若实证发现公平评分偏移完全由"结果对自己是否有利"解释、群体身份无独立贡献,则驱动量归因被
    证伪(falsifiability(c))。宜在 operationalization 或 discriminant_validity 中补一句:如何
    在测量上剥离个人利害与群体身份(如:让被试作为不直接受益的第三方群体成员评价程序——"我所属
    的群体赢了但与我个人利益无关")。

    综上:非 rejected(核心逻辑成立、无非平凡归零、无 DED-004/007 致命循环、无净杀反例),四条
    should 可靠定向修订救活 ⇒ needs_revision。

  red_flag_findings:
    brick_conclusion: |
      未命中(攻不穿)。逐字核三砖原文:
      - BR-L2-006:只给"人在资源分配中偏袒自己人——多给、更信任、冲突中护着,即使群体划分基于任意
        标签"。被预测量=分配行为的偏斜(含认知成分"多给是应该的"——但这是对【分配结果/受益人】的
        认知,不是对【程序】的认知)。BR-L2-006 原文不含"程序公平评分随受益方群体身份偏移"这一主张。
      - BR-L2-013:只给"人对不公平分配有自动负面情绪反应——不仅讨厌自己吃亏,有时也讨厌自己占便宜"。
        被预测量=对不平等结果的情绪/行为反应。原文不含"参考群体的内生选择使不公感知在群体边界两侧
        不对称触发"这一机制。
      - BR-L2-015:只给"程序公平时人对不利结果接受度上升——程序公平可部分替代结果公平"。被预测量=
        对不利结果的接受度。原文不含"程序公平感知本身被群体身份污染→BR-L2-015链路在上游被短路"
        这一翻转。
      三砖原文均【不含】DED-019 的核心合成:程序公平感知={程序结构+谁受益},二者不可分离;空格预测
      "有偏好+程序中立+公平评分无差异为空"。故非平凡内核不在单砖 ⇒ brick=conclusion 不命中。

      诚实注:derivation 步 3 的 CONCEPT-fairness(b)("公平是比较性的")和 derivation 步 2 中
      BR-L2-013 的部分使用("不公感知")偏近定义——这不是经验推力而是概念框架。真正的发动机是
      BR-L2-006 的群体身份(BR-L2-013 的不公感知由此被着色)+BR-L2-015 的翻转。作者已在各步标注
      "【诚实】",做法正确。
    nontriviality_cell_check: |
      通过。核心空格="内群体偏好经独立测确认存在 + 程序经独立编码确认为客观中立 + 裁决者对内外群体
      的程序公平评分无统计显著差异"被预测为空。不被任何单一砖平凡强制:
      - BR-L2-006 单独:给"人偏袒自己人(行为层)",被预测量=分配量的偏斜,不给"对程序的公平评分必随
        受益方身份偏移(认知程序层)"。可能态:某人多给自己人但同时承认'这规矩对双方一样公道'(填充空格)。
        BR-L2-006 不排除此态 ⇒ 空格不被 BR-L2-006 平凡强制为空。
      - BR-L2-013 单独:给"不平等→不公"的自动反应,不给"参考群体内生选择使同一差距在不同群体边界两
        侧被编码为'合理差异'或'不公'"。不给"公平评分必随受益方身份偏移"。
      - BR-L2-015 单独:给"程序公平→接受结果",不给"程序公平感知本身被群体身份污染→因果链上游被短路"。
      - CONCEPT-fairness(b)偏近定义,不产生经验空格。
      空格可被现实反例填上 → 非空可满足、非同义反复(DED-004 未复发)。

      但有一个细微关切(非 required):空格的实战测试需要三个独立测量(行为层内群体偏好/程序中立性/
      程序公平评分)在同一被试群体中同时满足——这在单次实验中可设计,但实验中"内群体偏好存在"的
      确认(如 Tajfel 分配偏斜)和"程序公平评分"的测量之间有时间间隔,需确保内群体偏好在公平评分
      时仍处于激活态。非逻辑致命,但实操中有 subtlety。记 should-level awareness,不判 required。
    measurement_orthogonality: |
      主干未重蹈 DED-007。三轴异源:
      - 受益方群体身份(IV):由随机分配的最小群体标签(Tajfel)或事前问卷(政党/部门归属)独立测,不由
        公平评分高低反推。
      - 程序公平评分(DV):由 Likert 量表/公平知觉问卷独立测,评分对象=程序而非结果或裁决者人品。
      - 程序透明度(Moderator):由实验操纵(规则全部公开 vs 不完全公开)或透明度感知量表独立测。
      三轴异源、各自独立测、anti-talisman_clause 双向禁反推("不得因评分有差异反推程序必有隐藏差异、
      不得因评分高反推受益方必为内群体、不得遇反例事后塞'其实不中立'/'其实无偏好'") ⇒ 不判 required。

      一个细微关切(非 DED-007 级):在现实锚(选举)中,"内群体身份"的测量(政党认同)与"公平评分"
      可能共享方法变异——均来自同一问卷/面访、同一时间点、同一情绪语境。这不等于焊死测量轴(操作
      化仍可设计为独立量表),但在现有选举文献的二手数据中,二者可能共享未被建模的混杂源(如政治信任
      人格特质同时驱动政党选择和对选举公平的判断)。记 should-level awareness,已在 required_fixes
      第 4 条中对"群体身份 vs 个人利害"做了更根本的质疑。

      另:逐格判空试验中,内群体偏好的行为测量(Tajfel 分配)和程序公平评分是不同模态(行为 vs 自陈),
      源自不同任务——异源性比纯问卷设计更强。好。
    scope_hook_independent_of_result: |
      不命中。excluded_outcomes 两条均按事前渠道划:
      (1)"程序结构客观上对内外群体不同"——由独立编码(规则文本/操作步骤/随机化设计)判定,不由公平
        评分反推。做对。
      (2)"裁决者明知且承认自己偏私,不声称程序公平"——由裁决者自陈(是否声称程序公平)判定,不由
        评分结果反推。做对。
      两条钩子均不由被预测量事后开脱 ⇒ 合规。
    criterion_tier_match: |
      不命中(学到 DED-006)。核心自变量"受益方群体身份"是二分类别变量(内/外),这是构念本身的性质
      (群体边界天然是类别),非人为硬二分。被预测量"程序公平评分"是连续量表(Likert),预测使用连续
      差异语言("系统性偏移""评分高/低")。透明度为操纵或连续感知量表。无"被救对象连续却硬二分"的
      DED-006 式档位失配。
    anti_talisman_cashed: |
      大体兑现(should 级残留)。承重锚里至少一个真独立测出驱动量:
      - Anchor 1(Tajfel 范式延伸):群体身份由随机颜色标签独立分配;程序文本由实验者独立编写并保持
        恒定;公平评分为独立量表。三量不同源——此为最干净的 anti-talisman 兑现。但此锚是假设性延伸,
        非既有实证——anti-talisman 的设计是到位的,只是尚未在数据中兑现。
      - Anchor 2(选举):程序为制度常量(独立于评分);胜败由选票独立决定;公平感知由独立问卷测。
        但"内群体身份"在选举场景中无法由随机分配确定(政党认同是被试已有特征),且与结果有利度混杂
        (见 required_fixes 第 4 条)。
      - Anchor 3(组织):程序为成文规则;关系(自己人/外人)由独立社交网络分析测;公平感知由独立
        问卷测。但自标 confidence=weak-moderate,多因交织。

      anti-talisman_clause 成文有力:明文禁"评分有差异→反推程序必有隐藏差异"、"评分高→反推受益方
      必为内群体"、"遇反例事后塞'其实不中立'或'其实无偏好'来消化"。防线在位。

      残留:anti-talisman 条款在纸上完备,但最干净的兑现锚(Anchor 1)是假设性的——在现有数据中,驱动量
      从未被以 anti-talisman 要求的方式真正独立测出并展示与被预测量的关系。这是实证薄弱的另一面
      (见 required_fixes 第 2 条)。不判 required(逻辑设计正确,只是数据未跟上),但判 verified 的
      评审者应明确此 gap。
    anchor_fact_check: |
      无 DED-007 式致命事实错。逐锚核:
      - Anchor 1(Tajfel):Tajfel 最小群体范式确实仅通过随机颜色标签即可引发分配偏斜——此为社会心理
        学教材级稳健发现,无数十国的复现支持。事实正确。但"若在分配前先让被试评价一套分配规则的公平
        性——当被告知自己组受益时评分高、对方组受益时评分低——则直接支持预测(i)"这一段是假设性推演,
        非对既有实证的陈述。作者末句"该精确范式需专门实验设计,现有 Tajfel 文献通常测分配行为不测
        程序公平评分"诚实标注。无事实错。
      - Anchor 2(选举):"同一套选举程序,胜选一方认为选举公正的比例系统性高于败选一方"——被"败者同意"
        文献广泛记录(Anderson et al. 2005),方向正确。诚实注"胜败=结果有利度,不只群体身份"正确。
        无事实错,但因果归因含混(见 required_fixes 第 4 条)。
      - Anchor 3(组织):"程序公平评分与关系质量正相关"——组织行为学文献中确有间接证据,方向正确。
        诚实注"多因交织,因果关系难剥离;只作方向性支持"正确。无事实错。

      三个 anchor 均无事实错。但累积实证力极弱:两个是方向性/弱支撑,一个是假设性延伸。这不构成
      事实错(作者诚实标注了 confidence),但构成 should 级关切(见 required_fixes 第 2 条)。
    definition_vs_prediction: |
      通过。关键条件均有独立于结果的可操作化定义:
      - "受益方群体身份":由事前群体标签/问卷测,不由公平评分反推。
      - "程序公平评分":由 Likert 量表测,评分对象=程序而非结果/人品。
      - "程序透明度":由实验操纵或感知量表测,独立于公平评分和群体身份。
      三条预测均可被实证推翻:
      - (i)"仅改变受益方身份→公平评分偏移":可被 Tajfel+程序公平评分的实验推翻。
      - (ii)"透明不缩小差距":可被透明操纵×群体身份的交互实验推翻。
      - (iii)空格"有偏好+程序中立+评分无差异为空":可被此格被填满推翻(falsifiability(a))。
      均为可证伪的经验预测,非必然为真的定义 ⇒ 合规。
    enumeration_and_species: |
      不命中(本推论非 N-species 穷举枚举结构)。推论是机制型(群体身份→公平感知污染→透明度反被用作
      自我说服),非物种分类型。自变量(受益方群体身份/透明度)为构念维度,非声称穷尽的类别体系。
      仍按 DED-008 精神主动探"第 N+1 类/隐藏调节变量":
      - 公平规范的显式激活(explicit fairness norm activation):在强公平规范激活场景(如法庭陪审团
        收到法官的公正指示),程序公平评分偏移是否被抑制或消除?若公平规范激活使空格被填满(有偏好+
        程序中立+公平规范激活+评分无差异),则表明"群体身份对公平感知的污染"受上位规范调节,非铁律。
        此为潜在边界条件而非第 N+1 物种。当前理论未讨论此调节,记 should-level awareness。
      - 群体身份的多元交叉(cross-cutting identities):裁决者同时持有多个群体身份(如:同部门但不同
        族裔 vs 受益方),哪一层身份在裁决情境中激活决定公平评分偏移的方向。operationalization 已
        在 limitations 中提及"需明确哪一层群体身份在裁决情境中被激活",但未讨论交叉压力(自己人-外
        人同时在场的矛盾态)对公平评分的预测——此时评分可能居中而非系统性偏移。此为 boundary_case
        而非 N+1 物种。
      二者均不构成 DED-008 式穷举破口。
    primary_suspect_aim: |
      【指对了一条,但漏了更致命的隐腿——should】。文件自认最弱腿:预测(ii)"透明不缩小差距"过强,已有
      问责/透明文献的方向性压力。这是正确指认——透明度对行为层偏私的削弱已有实证记录,对公平感知层
      的效果是不确定域。

      但文件漏认三条更棘手的隐腿:
      (a)【判别效度缺口:认知失调/动机推理】"人真心认为自己没偏"这一核心机制,实质是认知失调
      (Festinger 1957)在程序公平域的应用实例:偏私行为→"我是公平的人"→失调→"程序是公平的"的态度
      改变。DED-019 的独特贡献(空格预测+透明度反直觉方向)比文件声称的"非平凡"更窄。若将此推论
      表述为"认知失调在群体间程序公平判断中的表现",其增量贡献一目了然——当前 discriminant_validity
      只对表了体系内部实体(BR-L2-006, DED-008),未对表体系外的最直接相邻理论。这是判别效度的结构性
      缺口(见 required_fixes 第 1 条)。

      (b)【实证基础极薄:三个锚均为弱/假设性支撑】Anchor 1 是假设性实验延伸(现有 Tajfel 文献不测
      程序公平评分)、Anchor 2 混淆结果有利度与群体身份、Anchor 3 自标 weak-moderate。累积实证对
      核心空格的支持近乎为零——推论实质是 pre-registered hypothesis 而非 empirically anchored
      deduction。当前以"moderate"标签呈现三个 anchor 使读者容易误判实证基础,宜诚实标注(见
      required_fixes 第 2 条)。

      (c)【"不可分离"声称过强,未经透明调节检验】核心 statement 称"程序公平和群体偏私在认知层面
      不可分离"。但若透明(或其他结构因素)可以缩小公平评分差距,表明可分离性至少部分存在——不可分离
      性从"认知铁律"退为"默认条件下的强倾向"。statement 中"不可分离"的措辞强度与 primary_suspect
      中"若透明缩小差距则(ii)被削弱但不伤(i)(iii)"的宽容存在张力——(i)测的是基本效应存在,(ii)测
      的是不可分离性能否被结构因素缓解。若(ii)被证伪,不可分离性被削弱,核心 statement 应相应收窄
      射程(见 required_fixes 第 3 条)。

      另:true 平凡化检查(上位泛化后是否被稀释成相邻常识):抽掉空格预测和透明度的反直觉方向后,
      DED-019 的核心≈"人觉得让自己人受益的规矩更公道"——这在日常直觉层面近乎常识("屁股决定脑袋"
      的公平版)。DED-019 的真正 delta 完全依赖①②两项特殊卖点(空格强制耦合+透明反被用作自我说服)。
      这本身不是缺陷——许多优秀推论的非平凡性只在一两个关键预测上——但 primary_suspect 和
      discriminant_validity 应更诚实地把 delta 收窄到这两点,而非给人"整个'群体身份→程序公平感知'
      的因果链都是本体系独有洞察"的印象。

  counterexample_hunt: |
    主动构造 falsifiability(a) 的核心靶——"内群体偏好经独立测确认存在 + 程序经独立编码确认为客观
    中立 + 受益方群体身份随机分配(内/外) + 裁决者对程序的公平评分在内外群体间无统计显著差异"——
    的干净案例,刻意攻空格(iii),认真搜历史/跨文化/实验案例:

    - 【最强一击:职业法官的"自我纠偏"】职业法官经长期训练以分离个人偏好与法律判断。若研究发现:
      法官在 Tajfel 式分配任务中显示内群体偏好(行为层),且在真实/模拟案件的程序公平评分中,对同族
      裔被告 vs 异族裔被告的审判程序评分无显著差异——则填空格(iii)。消化口:(a)"程序是否客观中立"
      需独立编码——法官可能对同族裔被告下意识适用更宽松的证据标准,此时程序已非"客观上相同",不符
      空格条件;(b)法官的职业身份可能是裁决情境中的首要激活身份,族裔身份在法庭语境中未被激活——若
      内群体偏好在 Tajfel 任务(身份激活)中存在但在法庭场景(身份未激活)中不影响公平评分,则空格未被
      真测试,因"内群体偏好激活"条件未在公平评分时满足。此击被消化为 boundary_case(多元身份中哪一
      层激活决定效应方向)——非净杀,但揭出理论需更精确指定"哪一层群体身份在裁决情境中被激活"这一
      前提条件的操作化标准。

    - 【次强一击:体育裁判的"公正表演"】部分体育迷在赛后承认"裁判那个判罚虽然对我队不利,但按规则
      是对的"。若同一批球迷在赛前 Tajfel 式任务中显示内群体偏好(对己队球迷多分配),但在赛后对裁判
      程序的公平评分中,无论判罚对自己队有利还是不利,均给出相近评分——则填空格。消化口:排除钩子#2
      ——"裁决者明知且承认自己偏私,不声称程序公平"。若球迷承认"裁判是对的"即属于"承认偏私",落在
      排除钩子内。但若球迷不承认偏私、只是评分无差异,则此击更干净。目前无此精确设计的研究——
      标准体育公正感知文献通常发现强内群体偏(己队球迷认为不利判罚更不公),方向支持 DED-019。

    - 【第三击:跨国公司的程序标准化】跨国公司推行全球统一的绩效评估程序(同一套规则/步骤/打分标准
      全球适用)。若某国分公司经理在 Tajfel 式任务中显示内群体偏好(多分配给同国籍同事),但对这套
      全球统一评估程序的公平评分,在评估同国籍 vs 异国籍下属时无显著差异——则填空格。消化口:程序
      的"客观中立性"在全球统一文本层面成立,但在执行层面(经理如何解读/应用标准)可能已随受益方身份
      而变——此为"程序客观相同"的操作化难题:纸面相同 ≠ 实际执行相同。anti-talisman 条款要求
      "程序是否结构相同须由独立编码判定",纸面文本编码为"相同"即应接受。若此标准被严格适用,此击
      的实证力取决于能否独立验证执行层面未系统偏斜——这在实际田野研究中极难。

    - 【第四击:实验室研究的"anonymous vs public"调节】设计实验:2(受益方:内群体/外群体) ×
      2(评分公开性:匿名/公开)的被试间设计。若在匿名评分条件下,内群体-外群体的公平评分差距消失或
      显著缩小(交互效应),则表明公平评分偏移主要由印象管理驱动,而非"真诚的自我公平错觉"。此击不杀
      核心(空格(iii)不依赖真诚性——印象管理下的评分偏移仍是评定差异),但削弱"人真心觉得自己没偏"
      这一认知深度声称。此为 secondary_suspect 路径,文件已自认。记 should-level awareness。

    - 【跨文化猎捕:WEIRD vs 非 WEIRD 社会】在更集体主义的文化中,内群体-外群体边界更刚性,预测(i)
      的公平评分偏移应更强——此为方向性支持。若在极个人主义文化中偏移消失,则群体身份效应被文化调节。
      此为 boundary_case(射程边界),非净杀。尚无直接跨文化程序公平评分×群体身份的 clean 实验。

    未净到 scope 内活反例。最强三击(法官自我纠偏/体育公正表演/跨国公司标准化)均被合理消化:法官击
    落入"身份激活"的边界条件(哪一身份在裁决情境中 salient),体育击落入排除钩子#2 的边界(承认偏私),
    跨国公司击落入"程序客观相同"的操作化难题(纸面同≠执行同)。三者均未提供 falsifiability(a) 要求
    的全套独立测量(独立测的内群体偏好+独立编码的程序中立+随机的受益方身份+无差异的公平评分)。

    但此猎捕过程揭出一个模式:空格的实战测试窗口极窄。要同时满足"内群体偏好独立确认存在"+"程序独立
    编码为中立"+"受益方随机分配"+"公平评分无差异"四个条件,几乎只能在专门设计的实验室实验中实现——
    而此类实验尚未被实施(Anchor 1 仍是假设)。推论在田野/历史数据中近乎免疫于证伪,并非因为逻辑循环,
    而是因为四个独立测量的同时满足在自然观察数据中极其罕见。记 should-level awareness(与
    required_fixes 第 2 条联动)。

    结论:【未净到 scope 内活反例】。verified 硬门第 2 条形式上通过,但提醒:空格未在田野/历史中被
    真正测试过,干净反例的缺席反映的是"没测过"而非"测了没找到"。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发】。falsifiability(a) 给出了明确的证伪条件——找到"内群体偏好
    (独立测) + 程序中立(独立编码) + 受益方随机分配 + 公平评分无差异"。这一格在逻辑上可被干净实验
    填满、非同义反复(不被砖平凡强制):BR-L2-006/013/015 均不排除"偏好+中立+评分无差异"的可能态。
    与 DED-004 的"唯一新意被实证推倒、改措辞也救不活"完全不同。

    进一步检查是否残留 DED-004 式"事后开脱"活门:
    - anti_talisman_clause 明文禁"遇反例硬塞'其实程序不中立'/'其实没有内群体偏好'来消化"——防线在位。
    - excluded_outcomes(1)的程序结构差异由独立编码判定、不由公平评分反推——循环读法被堵。
    - excluded_outcomes(2)的"承认偏私"由裁决者自陈判定、不由评分结果反推——循环读法被堵。
    三个活门均被堵 ⇒ DED-004 未复发。

    但一个 residual concern(非 DED-004 级):空格在实操中只能在实验室被测试,在田野/历史中几乎免疫
    于证伪。这不是逻辑不可证伪(DED-004 死因)——逻辑上空格是可测的。但若体系只接受实验室证据作为
    falsification 依据而豁免田野证据,则在实操中形成"实验室悖论":推论声称适用于人类社会,但其核心
    证伪窗口只存在于人工实验环境。这与 DED-004 不同(DED-004 是逻辑上不可证伪),但方向上有类似回声。
    当前的 anti-talisman 和 falsifiability 设计在纸上过关,但实操中空格极难被田野数据挑战——这是
    theory 设计的内在特征,非 bug,但需诚实标注。

    DED-007(焊死测量轴):【未复发】。三轴(受益方群体身份/程序公平评分/程序透明度)异源、各自独立测、
    连续谱对齐、anti-talisman 双向禁反推。群体身份不由公平评分反推、公平评分不由群体身份反推、
    透明度不由公平评分反推 ⇒ 无 DED-007 式自变量偷用被预测量之焊死。

    一个细微关切(非 DED-007 级):在选举锚中,政党认同(群体身份)和对选举公平的判断可能在现有二手数据
    中共享未建模的混杂源(如政治信任人格特质)。这不是测量轴焊死(操作化仍可设计为独立量表),是共享
    第三变量的内生性问题,与 DED-007 的"分母用实际获授者"式焊死不同类。不复发 DED-007。

  required_fixes:
    - |
      [should] 补 discriminant_validity 对认知失调(Festinger 1957)和动机推理(Kunda 1990)的判别段。
      DED-019 的核心机制——"人偏袒内群体后真诚地认为程序是公平的"——实质是认知失调在程序公平域的
      应用实例。当前 discriminant_validity 只对表了体系内部实体(BR-L2-006, DED-008),未对表体系
      外最直接的相邻理论。真正属于本体系独有的 delta 被压缩到两项:①空格预测"行为层偏好+认知层
      程序评分强制耦合"(认知失调理论本身不排除此二解耦的可能态——人可以'我知道我偏了但规矩本身是
      公道的');②透明度的反直觉方向"透明不缩小差距甚至扩大"(认知失调没有对此方向的强先验预测)。
      宜在 discriminant_validity 段新增一段,诚实把真实 delta 收窄并显式注记"剩余机制(偏好→失调
      →程序态度合理化)是成熟理论的场景应用,非本体系独有"。
    - |
      [should] 诚实标注实证基础:三个 supporting anchor 均非对核心预测(尤其是空格(iii))的直接检验。
      Anchor 1 是假设性实验延伸(现有 Tajfel 文献通常测分配行为不测程序公平评分),Anchor 2 混淆
      结果有利度与群体身份,Anchor 3 自标 confidence=weak-moderate 且因果关系难剥离。累积起来,
      对核心空格的直接实证支持近乎为零——推论在当前阶段实质是"从砖演绎出的预注册假设"而非"经验锚
      定的已验证命题"。这不等于推论不成立(逻辑推导是合法的知识生产方式),但宜在 review_summary
      或 falsifiability 段增一句诚实注:"核心空格(iii)尚未经专门实验检验,当前状态:逻辑推演,
      待实证。三个方向性 anchor 提供 plausibility 而非 confirmation。"使读者不被"moderate"标签
      误导。
    - |
      [should] 收窄核心 statement 中"不可分离"声称的射程。当前 statement 称"程序公平和群体偏私在
      认知层面不可分离"。但若预测(ii)被证伪(透明系统性缩小公平评分差距),不可分离性从"认知铁律"降
      级为"低透明条件下的默认态"。文件在 primary_suspect 中对此做出免责("不伤(i)和(iii)"),但此
      免责过度宽大——它保护了理论免于被(ii)的实证反例伤及核心,却同时使核心声称的强度与其可证伪性
      错配。宜在 statement 中将"不可分离"加限定:"在低透明/无问责压力的默认条件下,程序公平判断与
      群体偏私在认知层面高度缠结(不可分离);结构因素(特定类型透明/问责)可能在部分条件下缓解此缠结。"
      或在 primary_suspect 中诚实标注:"若透明缩小差距的效应在全谱透明类型中稳健,则'不可分离'降
      级为'默认强倾向'而非'认知铁律'——此为本推论实质上的最弱承重墙,当前 protection('不伤(i)(iii)')
      在语义上可信但在实质上低估了(ii)被证伪的波及半径。"
    - |
      [should] 区分"群体身份效应"与"个人利益效应"在预测(i)的选举锚中的混杂。预测(i)的操作化是
      "仅改变受益方群体身份→公平评分偏移"。但选举锚(Anderson et al. 2005)中,胜选="自己人赢且
      自己受益",败选="外人赢且自己吃亏"。胜败同时改变"群体身份"(我群 vs 他群)和"个人利害"(我赢
      vs 我输)。若公平评分偏移完全由"结果对自己是否有利"解释,群体身份无独立贡献,则驱动量归因被
      证伪(per falsifiability(c))。宜在 operationalization 或 discriminant_validity 中补设计方案
      以剥离二者:例如让被试作为不直接受益的第三方群体成员评价程序("我所属的群体赢了但与我的个人
      利益无关"的条件 vs "我所属的群体赢且我个人受益"的条件),或使用 minimal group paradigm 的
      纯身份条件(群体标签分配后不给个人利害差异)。
    - |
      [minor] falsification_trace 增列更全面的隐腿清单。当前 primary_suspect 只指"透明不缩小差距
      可能过强",secondary_suspect 指"真诚 vs 印象管理难区分"。但除上述四条 should 对应的隐腿外,
      还有一个 subtle 但实际的关切:空格(iii)的实战测试需要"内群体偏好激活态"在公平评分任务时仍持
      续——若偏好测量(Tajfel 分配)与公平评分之间有延迟/任务切换,偏好的激活可能衰减,导致在偏好
      "存在但未激活"的情况下测得评分无差异——此为 false positive 填空格,非真证伪。宜在
      operationalization 或 measurement 段中补一句"内群体偏好测量与公平评分测量应在同一实验
      session 内、相近时间点完成,并包含操纵检验(group identity salience check)以确保偏好处于
      激活态"。

author_response_round_1: |
  五条 required 均接受,逐条定向修订 DED-019 原文如下:

  (1) discriminant_validity 补认知失调/动机推理判别段:在【与DED-008判别】和【防平凡化守卫】之间新增【与认知失调(Festinger 1957)和动机推理(Kunda 1990)的判别】段。诚实承认核心机制是认知失调在程序公平域的应用实例,真正delta收缩为空格预测(行为-认知强制耦合,认知失调理论不排除解耦可能态)+透明度反直觉方向(认知失调无强先验预测)。诚实注:除去此两项delta,剩余机制是成熟理论的应用,非本体系独有。

  (2) 实证基础诚实标注:在 real_world_anchors.supporting 末尾与 counterexamples 之间新增 empirical_basis_honest_note。诚实标注三个 anchor 均非核心空格(iii)直接检验,累积实证近乎零,推论实质是预注册假设。三个anchor提供plausibility非confirmation。

  (3) 收窄"不可分离"射程:statement核心句加"在低透明/无问责压力的默认条件下"限定,补"若预测(ii)被证伪则不可分离从认知铁律降级为默认强倾向"。primary_suspect 诚实承认(ii)证伪会改变(iii)的射程边界(从全谱→限低透明条件),不再声称"不伤(iii)"。

  (4) 剥离个人利害与群体身份:在受益方群体身份的 operationalization 中补 disentangle_self_interest 段,给出三种剥离方案——(a)最小群体范式纯身份条件/(b)第三方观察者条件/(c)选举二手数据控制个人利害后检验残差。

  (5) 空格测试实操subtlety:在 falsification_trace 中补 empty_cell_testing_subtlety 段,标注偏好激活衰减→false positive填空格的风险,给出三种缓解措施(相近时间点/身份凸显操纵/操纵检验)。

  修订原则:只Edit受影响段落,保持瘦身格式;每处改动实质消解对应required,非敷衍加话。

round_2:
  reviewer: "独立子 Agent (round 2, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: verified
  verdict_note: |
    本轮核实 round_1 五条 required(4 should + 1 minor)均已在 DED-019 原文中定向消解:
    (1) discriminant_validity 已补认知失调(Festinger 1957)/动机推理(Kunda 1990)判别段,
    诚实收窄真实 delta 至空格预测+透明度反直觉方向两项;
    (2) real_world_anchors 已补 empirical_basis_honest_note,
    诚实标注三个 anchor 均非核心空格(iii)直接检验、推论实质为预注册假设;
    (3) statement 核心"不可分离"已加"低透明/无问责默认条件"限定,
    primary_suspect 诚实承认(ii)证伪会改变(iii)射程边界;
    (4) operationalization 已补 disentangle_self_interest(三种剥离方案);
    (5) falsification_trace 已补 empty_cell_testing_subtlety(偏好激活衰减+三种缓解措施)。

    对修订后的 DED-019 逐红旗重审,无 new required 级缺陷。核心非平凡性成立:
    - 空格(iii)"有偏好+程序中立+评分无差异为空"不被任何单砖平凡强制。
    BR-L2-006 只给行为层偏斜+结果层认知("多给是应该的"),不给程序层认知("让多拿的规矩是公道的");
    BR-L2-013 只给"不平等→不公"自动反应,不给参考群体内生选择;
    BR-L2-015 只给"程序公平→接受结果",不给"程序公平感知本身被群体身份污染而短路"的翻转。
    四砖合成给出空格。逐格判空通过。
    - 测量轴主干正交:受益方群体身份(IV)由随机标签/事前问卷独立测,
    程序公平评分(DV)由 Likert 量表独立测,透明度(Moderator)由操纵/感知量表独立测。三轴异源。
    anti-talisman_clause 双向禁反推到位。
    - 未重蹈 DED-004(不可证伪循环——空格可被干净实验填满)
    和 DED-007(测量轴焊死——三轴独立测)。
    - 反例猎捕未获 scope 内活反例(详见 counterexample_hunt)。

    存在三条 should-level 残余观察(不挡 verified):
    (a) 测量时序中的一致性需求:先测 Tajfel 分配行为再测公平评分,
    可能因认知失调产生一致性压力而人为放大评分差距——当前 empty_cell_testing_subtlety
    只覆盖激活衰减,未覆盖一致性需求这一反向 artifact;
    (b) "原则性党派"边界:当程序公平规范内化为裁决者身份的一部分时
    (如法官的"我公正不论谁受益"),该身份可能与群体身份竞争激活——当前多元身份讨论
    未专门覆盖"程序公平规范本身构成身份"这一特例;
    (c) "未测过"vs"测过且幸存":三个 anchor 对核心空格的直接检验近乎为零,
    干净反例的缺席反映的是"没测过"而非"测了没找到"——empirical_basis_honest_note
    已诚实标注此点,但读者仍可能被单个 anchor 的"moderate"标签误导。

    虽有上述 should 级观察,三条 verified 硬门均已满足 ⇒ verified。

  red_flag_findings:
    brick_conclusion: |
      未命中(攻不穿)。逐字核三砖原文后确认:
      - BR-L2-006:"人类倾向于对自己所属群体的成员给予优待——在资源分配中多给、在合作中更信任、
        在冲突中偏袒"——被预测量=分配行为的偏斜(含结果层认知"多给是应该的")。原文不含
        "程序公平评分随受益方群体身份偏移"这一主张。
      - BR-L2-013:"人类对不公平的结果分配持续表现出负面反应"——被预测量=对不平等结果的情绪/
        行为反应。原文不含"参考群体的内生选择使不公感知在群体边界两侧不对称触发"。
      - BR-L2-015:"当人们判断一个决策过程在程序上是公平的...他们对不利结果的接受度显著上升"——
        被预测量=对不利结果的接受度。原文不含"程序公平感知本身被群体身份污染→因果链上游被短路"。
      三砖原文均不含 DED-019 的核心合成(程序公平感知={程序+谁受益};空格预测)。
      非平凡内核不在单砖 ⇒ brick=conclusion 不命中。

      诚实注:derivation 步 2 中 BR-L2-013 的使用偏近定义("不公感知"的概念界定),
      步 3 中 CONCEPT-fairness(b)偏近定义("公平是比较性的")。
      真正发动机是 BR-L2-006 的群体身份+BR-L2-015 的翻转。作者在各步标注"【诚实】",做法正确。
    nontriviality_cell_check: |
      通过。核心空格="内群体偏好经独立测确认存在 + 程序经独立编码确认为客观中立 +
      裁决者对内外群体的程序公平评分无统计显著差异"被预测为空。不被任何单砖平凡强制:
      - BR-L2-006 单独:只给行为偏斜,不给程序公平评分必随受益方身份偏移。
        可能态"多给自己人但承认规矩对双方一样公道"不被 BR-L2-006 排除 ⇒ 空格不被平凡强制为空。
      - BR-L2-013 单独:只给不平等→不公,不给参考群体内生选择。
        可能态"不平等存在但参考群体切换后差距被编码为合理"不被 BR-L2-013 排除。
      - BR-L2-015 单独:只给程序公平→接受结果,不给公平感知被污染。
        可能态"程序公平时接受不利结果,但程序公平感知本身不受群体身份影响"不被 BR-L2-015 排除。
      - CONCEPT-fairness(b)偏近定义,不产生经验空格。
      空格可被现实反例填上 → 非空可满足、非同义反复(DED-004 未复发)。

      一个细微关切(should):空格的实战测试需三个独立测量(行为层偏好/程序中立/公平评分)
      在同一被试群体中同时满足。先测 Tajfel 分配行为再测公平评分可能产生一致性需求
      (被试刚多分给内群体→认知失调→合理化"程序是公平的"),人为放大评分差距。
      这与 empty_cell_testing_subtlety 覆盖的激活衰减是反向 artifact。
      缓解:counterbalance 测量顺序,或使用组间设计(一组先测分配、一组先测公平评分)。
      不判 required(属测量设计优化,不威胁逻辑结构)。
    measurement_orthogonality: |
      主干未重蹈 DED-007。三轴异源:
      - 受益方群体身份(IV):随机最小群体标签(Tajfel)或事前问卷(政党/部门归属)独立测,
        不由公平评分反推。
      - 程序公平评分(DV):Likert 量表/公平知觉问卷独立测,评分对象=程序非结果。
      - 程序透明度(Moderator):实验操纵或感知量表独立测。
      anti-talisman_clause 双向禁反推("不得因评分有差异反推程序必有隐藏差异、
      不得因评分高反推受益方必为内群体、不得遇反例事后塞'其实不中立'/'其实无偏好'")。
      逐格判空试验中,内群体偏好的行为测量(Tajfel 分配)和程序公平评分是不同模态
      (行为 vs 自陈),异源性比纯问卷设计更强。⇒ 不判 required。

      选举锚中政党认同与公平评分可能共享方法变异(同一问卷/面访/情绪语境)——
      这不等于 DED-007 式焊死(操作化仍可设计为独立量表),是共享第三变量的内生性问题。
      disentangle_self_interest 段已提供剥离方案。记 should-level awareness,不判 required。
    scope_hook_independent_of_result: |
      不命中。excluded_outcomes 两条均按事前渠道划:
      (1)"程序结构客观上对内外群体不同"——由独立编码(规则文本/操作步骤/随机化设计)判定,
        不由公平评分反推。
      (2)"裁决者明知且承认自己偏私"——由裁决者自陈(是否声称程序公平)判定,不由评分结果反推。
      两条钩子均不由被预测量事后开脱 ⇒ 合规。
    criterion_tier_match: |
      不命中(学到 DED-006)。IV"受益方群体身份"是二分类别变量(内/外),这是构念本身性质
      (群体边界天然是类别),非人为硬二分。DV"程序公平评分"是连续量表(Likert),
      预测使用连续差异语言("系统性偏移""评分高/低")。透明度为操纵或连续感知量表。
      无"被救对象连续却硬二分"的 DED-006 式档位失配。
    anti_talisman_cashed: |
      大体兑现(should 级残留)。anti-talisman_clause 成文有力:明文禁"评分有差异→反推程序
      必有隐藏差异""评分高→反推受益方必为内群体""遇反例事后塞'其实不中立'或'其实无偏好'来消化"。
      防线在位。

      承重锚中最干净的 anti-talisman 兑现是 Anchor 1(Tajfel 范式延伸):群体身份由随机颜色标签
      独立分配、程序文本由实验者独立编写并保持恒定、公平评分为独立量表——三量不同源。
      但此锚是假设性实验延伸(标准 Tajfel 文献测分配行为不测程序公平评分),尚未在数据中兑现。
      Anchor 2(选举)混淆结果有利度与群体身份。Anchor 3(组织)自标 weak-moderate。

      anti-talisman 的设计到位,只是实证数据未跟上。empirical_basis_honest_note 已诚实标注
      此 gap。不判 required(逻辑设计正确,数据未跟上属实证阶段问题),
      但读者应知悉:驱动量从未在现有数据中以 anti-talisman 要求的方式被独立测出
      并展示与被预测量的关系。
    anchor_fact_check: |
      无 DED-007 式致命事实错。逐锚核:
      - Anchor 1(Tajfel):Tajfel 最小群体范式确实仅通过随机颜色标签即可引发分配偏斜——
        社会心理学教材级稳健发现,数十国复现支持。事实正确。延伸部分(测程序公平评分)
        作者诚实标注为假设性推演。
      - Anchor 2(选举):"胜选一方认为选举公正的比例系统性高于败选一方"——
        被"败者同意"文献广泛记录(Anderson et al. 2005),方向正确。诚实注"胜败=结果有利度,
        不只群体身份"正确。
      - Anchor 3(组织):"程序公平评分与关系质量正相关"——组织行为学文献中确有间接证据,
        方向正确。诚实注"多因交织,因果关系难剥离"正确。
      三个 anchor 均无事实错。累积实证力极弱(两个方向性/弱支撑,一个假设性延伸),
      但 empirical_basis_honest_note 已诚实标注此点,不构成事实错。
    definition_vs_prediction: |
      通过。关键条件均有独立于结果的可操作化定义:
      - "受益方群体身份":事前群体标签/问卷测,不由公平评分反推。
      - "程序公平评分":Likert 量表测,评分对象=程序。
      - "程序透明度":实验操纵或感知量表测。
      三条预测均可被实证推翻:(i)可被 Tajfel+程序公平评分实验推翻;
      (ii)可被透明度×群体身份交互实验推翻;
      (iii)可被空格被填满推翻(falsifiability(a))。
      均为可证伪的经验预测 ⇒ 合规。
    enumeration_and_species: |
      不命中(本推论非 N-species 穷举枚举结构)。推论是机制型(群体身份→公平感知污染→
      透明度反被用作自我说服),非物种分类型。IV(受益方群体身份/透明度)为构念维度,
      非声称穷尽的类别体系。

      仍按 DED-008 精神主动探"第 N+1 类/隐藏调节变量":
      - 程序公平规范内化为身份:当裁决者的身份本身包含"我公正不论谁受益"这一规范承诺时
        (如职业法官、专业仲裁员),该身份可能与群体身份竞争裁决情境中的激活优先级。
        若公平规范身份压倒群体身份,公平评分偏移可能被抑制——此时空格(iii)的"内群体偏好激活"
        前提未满足(偏好存在但被规范抑制),非真填空格。此与 round_1 已讨论的多元身份交叉相关
        但不完全等同:这里的关键是"程序公平规范本身构成身份内容",而非"同时属于多个群体"。
        记 should-level boundary condition awareness,不判 required。
      - 权力不对称:当裁决者对受益方有制度性权力(如经理对下属)vs 平等关系(如同事之间)时,
        公平评分偏移的方向或强度是否变化?当前理论未讨论此调节。记 should-level awareness。
    primary_suspect_aim: |
      【指对了,且 round_1 揭露的三条隐腿均被定向修补】。
      文件自认最弱腿:预测(ii)"透明不缩小差距"。这是正确指认——问责/透明文献对行为层偏私
      有削弱记录,对公平感知层的效果是不确定域。

      round_1 揭露的三条隐腿状态:
      (a)【判别效度缺口:认知失调/动机推理】——已补 discriminant_validity 段,诚实收窄 delta
        至空格预测+透明度反直觉方向。修复到位。
      (b)【实证基础极薄】——已补 empirical_basis_honest_note,诚实标注推论为预注册假设。
        修复到位。
      (c)【"不可分离"声称过强】——statement 已加"低透明/无问责默认条件"限定,primary_suspect
        已承认(ii)证伪会改变(iii)射程边界。修复到位。

      平凡化检查(上位泛化后是否被稀释成常识):抽掉空格预测和透明度的反直觉方向后,
      DED-019 的核心≈"人觉得让自己人受益的规矩更公道"——这在日常直觉层面近乎常识
      ("屁股决定脑袋"的公平版)。DED-019 的真正 delta 完全依赖①②两项特殊卖点
      (空格强制耦合+透明反被用作自我说服)。discriminant_validity 段已诚实收窄至此,
      primary_suspect 段的诚实度已与 delta 的实际窄度匹配。修复到位。

      本轮未发现 round_1 遗漏的新致命隐腿。primary_suspect 指认准确,修补完备。

  counterexample_hunt: |
    主动构造 falsifiability(a) 的核心靶——"内群体偏好经独立测确认存在 + 程序经独立编码
    确认为客观中立 + 受益方群体身份随机分配(内/外) + 裁决者对程序的公平评分在内外群体间
    无统计显著差异"——的干净案例,刻意攻空格(iii),覆盖前轮未猎方向:

    - 【新击一:"原则性败选者"——接受败选但保留内群体偏好】
      部分选民在选举后明确表示"我支持败选一方,但选举程序本身是公正的"。
      若对这批选民同时测量:(a)Tajfel 式分配任务中显示对己党支持者的内群体偏好(行为层);
      (b)对选举程序的公平评分在"己党赢"与"己党输"两种假设情景间无显著差异——
      则填空格(iii)。
      消化:此击需区分"真心认为程序公平"与"对制度合法性的抽象认同"——
      后者可能只是对民主制度的笼统支持,而非对"同一套程序+不同受益方"的具体公平判断。
      排除钩子#2("承认偏私")不适用——被试明确声称程序公平。但需验证:
      内群体偏好在公平评分时是否仍处于激活态(身份凸显操纵检验)。
      当前"败者同意"文献(Anderson et al. 2005)的方向性证据是:败选者系统性认为选举
      更不公——即内群体-外群体公平评分差距稳健存在,支持而非证伪 DED-019。
      此击为假设性边界,非净杀。

    - 【新击二:"抑郁实在论"——低自我提升动机者】
      抑郁个体在自我评价中表现出较少的积极错觉("depressive realism",Alloy & Abramson 1979)。
      若抑郁被试在 Tajfel 式任务中显示内群体偏好(抑郁不消除内群体偏),但在程序公平评分中,
      无论受益方是内群体还是外群体,均给出相近评分——则填空格(iii)。
      消化:抑郁实在论是认知风格差异而非群体身份效应——若效应消失,
      则表明"自我公平错觉"依赖自我提升动机,这支持而非推翻 DED-019 的机制
      (自我欺骗),但意味着效应存在个体差异调节。此击将 DED-019 的射程从"人类普适"
      收窄为"正常自我提升动机下的默认态"——属 boundary_case 而非净杀。

    - 【新击三:跨文化猎捕——"面子文化"vs"罪感文化"】
      在强"面子"文化(如东亚)中,公开承认偏私的代价更高→印象管理动机更强→
      公平评分偏移在公开条件下应更大。在"罪感"文化(如北欧新教)中,
      内在道德一致性更受重视→真诚自我说服动机更强→公平评分偏移在匿名条件下也应存在。
      若在罪感文化中匿名评分下偏移消失,则削弱"真诚自我错觉"机制。
      消化:此为 secondary_suspect 路径(印象管理 vs 真诚错觉),文件已自认。
      即使"真诚"机制被削弱,空格(iii)不依赖真诚性——印象管理下的评分偏移仍是空格预测的实例。
      此击不杀核心,只调节机制解释。

    - 【新击四:测量时序 artifact——先测公平评分再测分配行为】
      若实验设计为先测程序公平评分(此时内群体偏好尚未被 Tajfel 分配任务激活→偏好存在但
      未凸显),再测分配行为——此时公平评分在内外群体间无差异,Tajfel 分配却显示偏好。
      此非真填空格:内群体偏好在公平评分时未被激活(偏好"存在但休眠")。
      消化:此为 empty_cell_testing_subtlety 已覆盖的激活衰减问题的逆序版。
      反过来说明:要真填空格,必须在偏好激活态下测公平评分,否则是 false positive。
      此击强化了 empty_cell_testing_subtlety 的必要性,但本身不提供净杀——
      它揭示的是测量设计陷阱,非理论缺陷。

    - 【前轮四击复检】
      round_1 的四击(职业法官自我纠偏/体育公正表演/跨国公司标准化/匿名vs公开调节)
      消化均仍成立:法官击落入身份激活边界,体育击落入排除钩子#2 边界,
      跨国公司击落入程序客观相同操作化难题,匿名调节击为 secondary_suspect 路径。
      本轮无新信息改变此四击的消化结论。

    结论:【未净到 scope 内活反例】。六击(本轮四新+前轮四复检)均落入边界条件/
    排除钩子/测量设计陷阱/已自认的 secondary_suspect 路径。
    干净反例的缺席反映双重原因:(a)核心空格预测在逻辑上从砖坚固推导,
    现实反例确实稀少;(b)空格的实战测试窗口极窄——需四个独立测量同时满足,
    在田野/历史数据中几乎不可行,而在实验室中也尚未被实施(Anchor 1 仍是假设)。
    此"未测过"属性已由 empirical_basis_honest_note 诚实标注。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发】。falsifiability(a) 给出了明确的证伪条件——
    找到"内群体偏好(独立测) + 程序中立(独立编码) + 受益方随机分配 + 公平评分无差异"。
    该格在逻辑上可被干净实验填满、非同义反复。三砖均不排除此可能态。
    anti_talisman_clause 明文堵死三条事后开脱活门(程序不中立/无偏好/承认偏私)。
    excluded_outcomes 均由事前独立指标判定。

    实操层面的关切(非 DED-004 级):空格只能在实验室被测试,在田野/历史中几乎免疫于证伪——
    这不是逻辑不可证伪(DED-004 死因),而是四个独立测量的同时满足在自然观察数据中极其罕见。
    此属理论设计的内在特征(theory 对测量条件要求高),非 bug。empirical_basis_honest_note
    已诚实标注推论为预注册假设。

    DED-007(焊死测量轴):【未复发】。三轴(受益方群体身份/程序公平评分/程序透明度)
    异源、各自独立测、连续谱对齐、anti-talisman 双向禁反推。
    受益方群体身份不由公平评分反推、公平评分不由群体身份反推、
    透明度不由公平评分反推。无 DED-007 式"分母用实际获授者"焊死。

    选举锚中政党认同与公平评分在二手数据中可能共享未建模混杂源(如政治信任人格特质)——
    非测量轴焊死(DED-007 死因),是共享第三变量的内生性问题。
    disentangle_self_interest 段已提供剥离方案。不复发 DED-007。

