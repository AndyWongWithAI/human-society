    - |
      [should-6] 为预测(iv)正反馈循环澄清实证地位:
      当前falsifiability段仅注册(a)(b)(c)对应预测(i)(ii)(iii),预测(iv)"外包→退化→
      更依赖外包"的正反馈循环未独立注册证伪条件。需澄清:(iv)是(i)+BR-L2-027的
      逻辑合成(无需独立检验),还是需独立注册的实证预测(如Granger因果检验:
      滞后判断准确率→当期外包率,控制滞后外包率)。若为后者,需在falsifiability
