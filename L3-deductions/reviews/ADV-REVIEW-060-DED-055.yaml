id: ADV-REVIEW-060
type: adversarial_review
reviews: DED-055
layer: L3-deductions

人话摘要: |
  对 DED-055(现时偏向×法币记忆滞后：前瞻指引效力的双重折扣)的第一轮独立对抗审查。
  round_1 裁 needs_revision:核心机制——BR-L2-030(现时偏向/双曲贴现)与 BR-L2-024(记忆滞后)
  合力产生"体验vs宣布的竞争性检验"——是一个 genuine 的非平凡推理,两砖单打均不能产出
  "宣布年数在控制体验年数后无独立贡献"这一可证伪赌注。brick=conclusion 攻不穿、
  测量轴正交(CPI数据 vs 调查预期)、anti-talisman 四条禁令双向在位、无 DED-004/007 复发。
  但我猎到 1 条 required 缺陷 + 5 条 should 缺陷:
  【required】"低通胀体验年"操作化用单边阈值(CPI ≤ target+0.5pp,仅有上界无下界),
  将"通胀远低于目标"(如日本 0% vs 2%目标)与"通胀接近目标"(如 1.8% vs 2%目标)
  混为一谈——但 BR-L2-024 记忆滞后预测预期锚定于实际体验到的通胀水平,0%通胀的体验
  锚定预期于 0%而非将其拉向 2%。预测(i)的"体验越久→预期越接近目标"在远低于目标时
  机械性地不成立。需将操作化修正为双边阈值(|CPI - target| ≤ 0.5pp)。
  5 条 should:(1)日本锚点使用未注册的"CPI ≥ 2%"判据与已注册操作化矛盾;
  (2)"前瞻指引"与"非常规货币政策宣示"的排除边界在 BOJ 2013 案例中模糊;
  (3)瑞典消化里"其他改革也做了"的事后归因触 L4-009 模式;
  (4)体验年数与宣布年数在实践中高度共线的挑战比作者承认的更严重;
  (5)falsifiability(b)以"不显著"为证伪条件(p>0.10),等于要求证 null,统计功效问题未讨论。

target: DED-055
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。评分卡红旗 13 条逐项攻 +
  反例猎捕(判 verified 前必做)+ DED-004(不可证伪循环)/DED-007(测量轴焊死)复发检查。裁决三态照评分卡:
  verified 需同时满足(1)无 required 缺陷(2)亲自猎捕无 scope 内活反例(3)不重蹈 DED-004/007。

round_1:
  reviewer: "独立子 Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: needs_revision
  verdict_note: |
    这是一条【机制骨架坚实、但操作化有一处结构性裂缝 + 多处实证锚薄】的候选。核心论证——
    BR-L2-030(现时偏向/双曲贴现)与 BR-L2-024(记忆滞后)合力对前瞻指引(forward guidance)
    构造出"体验vs宣布"的竞争性统计检验——是 genuine 的非平凡推理。我逐词核对了 BR-L2-024
    和 BR-L2-030 的全文:前者不含"前瞻指引""央行沟通""通胀预期""宣布年数",
    后者不含"货币政策""通胀目标制""体验vs宣布"。两砖焊在一起产出的
    "宣布年数在控制体验年数后无独立贡献"的可证伪赌注,确非任一块单砖的复述或近义。

    推导链条(现时偏向压低远期信息的决策权重 + 记忆滞后使预期锚定于历史体验 → 前瞻指引
    面临双重折扣 → 体验驱动预期、宣布无效 → 体验年数 vs 宣布年数的竞争性回归)逻辑干净,
    三步走(现时偏向→远期信息低现值,记忆滞后→体验锚定预期,合力→双重折扣+时间壁垒)
    各自可独立检验,也各有 falsifiability 注册。

    但我在逐条攻中发现 1 条 required 缺陷,集中在一个看似细小但结构上致命的操作化裂缝:
    "低通胀体验年"的操作化用单边阈值(CPI ≤ target+0.5pp,仅有上界、没有下界)。
    这意味着通胀远低于目标(如日本 1998-2012 年的 0% vs 2%目标)与通胀接近目标
    (如 CPI=2.1% vs 目标 2%)都被归入"低通胀体验年"——但 BR-L2-024 记忆滞后预测
    预期锚定于实际体验到的通胀水平,而非锚定于"低于目标"这一事实。若公众体验的是 0% 通胀,
    预期被锚定在 0%——这不会拉向 2% 目标,反而越体验越远。预测(i)的"体验越久→预期
    越接近目标"当体验到的通胀远低于目标时机械性地不成立。这不是措辞问题——这是操作化
    没有匹配机制。修复是外科式的:将单边 ≤ target+0.5pp 改为双边 |CPI − target| ≤ 0.5pp
    (或 target−0.5pp ≤ CPI ≤ target+0.5pp),使"低通胀体验"等价于"接近目标的通胀体验"。

    另有 5 条 should 缺陷:(1)日本锚点的分析使用了未注册的"CPI ≥ 2%"判据(与已注册的
    "≤ target+0.5pp"矛盾——若按已注册操作化,日本应有 ~10 年体验而非 0 年);
    (2)"前瞻指引"与"非常规货币政策宣示"的排除边界在 BOJ 2013 案例(QQE+2%目标
    同时宣布)中模糊,需要操作性判别标准;(3)瑞典 1993-95 反例消化中"其他改革也做了"
    的事后归因模式触 L4-009 判例精神——若所有快速收敛案例都可通过"该国还做了其他改革"
    消化,则预测(i)失去被证伪的机会;(4)体验年数与宣布年数在实践中高度共线——多数
    宣布通胀目标制的国家同时经历了通胀下降——作者承认此挑战但低估了严重性:干净的
    "宣布长+体验短"格在现实中罕见,使 2×2 表的非平凡格(宣布长+体验短→收敛慢)难以
    被干净检验;(5)falsifiability(b)用"不显著(p>0.10)"作为证伪条件——这是要求证 null,
    存在统计功效问题:若样本量不足或测量噪声大,不显著可能只是 power 不够而非机制成立。

    反例猎捕未发现净杀。猎到的最强候选——日本在"宣布长+体验短→预期不收敛"上是
    一致性案例(支持推论),但与操作化的矛盾暴露了上述 required 缺陷。欧元区国家
    (意大利/西班牙 1999 后)的快速收敛可由"新货币制度=不是纯言辞"消化。巴西
    Plano Real(1994)的快速去通胀预期是"新货币+制度套餐"而非纯宣布,落在射程外。

    综上:1 条 required + 5 条 should → needs_revision。required 修复是外科式的
    (改单边阈值为双边),不伤机制骨架。预期一轮修订后可复 verified。

  red_flag_findings:
    brick_conclusion: |
      未命中(攻不穿)。我逐词核对了 BR-L2-024 和 BR-L2-030 的全文。
      BR-L2-024 全文不含"前瞻指引""央行沟通""通胀预期""宣布年数""言辞通道"——
      它只讲法币信用的连续可逆性与记忆滞后,是纯信用更新机制命题。
      BR-L2-030 全文不含"货币政策""通胀目标制""体验vs宣布""央行""前瞻指引"——
      它只讲双曲贴现(现时偏向),是纯跨期偏好结构命题。
      DED-055 的非平凡内核——"体验年数 vs 宣布年数的竞争性回归,预测宣布年数
      在控制体验年数后无独立贡献,且前瞻指引面临现时偏向(双曲贴现)+记忆滞后的
      双重折扣"——不在任一块砖的原文或近义中。这不是"BR-L2-024 已经说了预期更新慢,
      你只不过加了个'宣布无效'"——BR-L2-024 只说预期随体验更新,并未说宣布这条路径
      为何不加速更新(宣布可能通过信号效应→央行做事→体验改变,间接加速)。
      BR-L2-024 对这条间接通道是沉默的。DED-055 的赌博——"宣布无独立贡献"——
      是超越 BR-L2-024 的增量主张。
      承重砖也非为推论窄化——BR-L2-024(IEA≥1.2)和 BR-L2-030(IEA≥1.2)均有
      独立于 DED-055 的存在理由。
      ⇒ 不判 required,不判 should。

    nontriviality_cell_check: |
      未命中(攻不穿)。2×2 判据表的核心非平凡格是两个标星格:
      ★"体验长+宣布长→收敛快":BR-L2-024 只说预期随体验更新,不说宣布有没有增量;
      BR-L2-030 完全不涉及预期收敛。任一块单砖无法推出"无论宣布长短,只要体验长就收敛快"。
      ★"体验长+宣布短→收敛快":同上。此格是推论的最强赌博——宣布短但体验长,
      预期仍收敛——若此格被经验填为慢收敛,(i)被证伪。
      "体验短+宣布长→收敛慢":此格是非平凡格——理性预期理论(Woodford/Eggertsson)
      预测宣布应使预期收敛,本推论预测宣布无效→不应收敛。这是本推论与理性预期理论的
      直接对撞点,可被经验填充(若此格的样本国预期收敛快,则理性预期胜出)。
      非标星格的"体验短+宣布短→收敛最慢"有部分被平凡覆盖(体验和宣布都没,
      预期当然不收敛),但 author 在 nontriviality_test 中诚实标注了这一点,未声称全表非平凡。
      ⇒ 不判 required,不判 should。

    measurement_orthogonality: |
      未重蹈 DED-007(攻不穿)。自变量对:(i)低通胀体验年数——由 CPI 同比数据
      (IMF IFS/各国统计局,独立于央行新闻稿)与目标值比较编码;(ii)宣布年数——
      由央行官方声明/法律文件日期纯计数编码。因变量:通胀预期收敛速度——
      由专业预测者调查(ECB SPF/US SPF/Consensus Economics)或市场隐含通胀
      (通胀互换/盈亏平衡通胀率)测量。
      自变量和因变量使用不同的机构、不同的数据生成过程、不同的测量工具——
      CPI 来自统计机构的价格采集,预期来自调查问卷或金融市场价格。构念上异源正交。
      anti_talisman_clause 的四条禁令在概念层有效防止了双向反推:
      (1)禁由预期未收敛反推体验不够→体验由 CPI 独立编码;
      (2)禁由宣布贡献显著反推宣布质量好→宣布年数是纯计数;
      (3)禁由远期预测差反推预测本身不靠谱→理性噪声已作为零假设;
      (4)对称保护→禁选择性使用"宣布年份早"的证据方向。
      这与 DED-007 的"通货需求用货币量测"焊死有本质区别。
      ⇒ 不判 required,不判 should。

    scope_hook_independent_of_result: |
      部分命中(should)。四项 excluded_outcomes 均按事前结构特征划,不由结果回填:
      (1)极端危机(通胀>50%/年等)——按宏观经济状态的量化阈值,事前可判定;
      (2)非常规货币政策(QE/YCC/负利率)——按"言辞通道 vs 行动通道"的理论分类;
      (3)未宣布通胀目标制的国家——按"无宣布年数变量→不可检验(b)",属操作必要性;
      (4)时间不一致问题——按"独立并行机制"的理论区分。
      均为结构性的、非事后救场的排除。
      但【should】排除(2)的边界在 BOJ 2013 案例中模糊:日本央行于 2013 年 1 月
      同时宣布 2% 通胀目标 AND QQE(非常规货币政策)。"宣布 2% 目标"照理属于
      "前瞻指引"(在射程内),但"宣布 QQE"照理属于"非常规货币政策"(被排除)。
      当两者在同一份声明中同时发布时,若通胀预期有任何变动,应归因于哪个通道?
      author 在用日本作为 supporting anchor 时将其归入射程内(分析了"宣布目标后
      预期未收敛"),但未讨论 QQE 这条"行动通道"是否本应按排除(2)排除。
      宜在 boundary_cases 中增加 BOJ 2013 的讨论,并给出操作性判别标准:
      当言辞通道与行动通道同时运作时,如何判定哪个在驱动预期变动。
      ⇒ 不判 required,记 should。

    criterion_tier_match: |
      未命中(攻不穿)。核心变量均为连续量(体验年数、宣布年数、收敛速度 β),
      使用回归分析(偏相关系数+显著性检验),没有将连续量硬切为二分的 DED-006 式缺陷。
      时间距离的三档划分(≤1年/1-2年/>2年)是操作化便利而非判据核心——
      关键预测(c)的"衰减超过年数比倒数"是连续比率检验,不依赖三档划分。
      唯一有轻微不适配的是"低通胀体验年"的操作化将"通胀是否接近目标"这一
      本质上的连续量(通胀与目标的偏差距离)二分化为"是/否体验年"——
      但这是面板回归中处理时间序列的标准做法(累计计数变量),非本推论独有的缺陷。
      且二分阈值的问题已在 required_fixes 中通过引入双边阈值解决。
      ⇒ 不判 required,不判 should。

    anti_talisman_cashed: |
      大体兑现,但锚上执行与操作化有一处结构性裂缝(required)加一处执行缺口(should)。
      anti_talisman_clause 的四条禁令在位且覆盖了最危险的四个反推方向:
      (1)禁由预期未收敛反推体验不够——体验以 CPI vs 目标独立编码;
      (2)禁由宣布贡献显著反推宣布质量好——宣布年数是纯计数;
      (3)禁由远期预测差反推预测本身不靠谱——理性噪声已作为零假设;
      (4)对称保护——禁选择性解释"宣布早"的证据方向。
      四条禁令在概念层清晰且完整。

      但【required】anti_talisman_clause(1)的核心——"低通胀体验年数以实际 CPI 同比
      与目标值的比较独立编码"——在执行上存在结构性裂缝:当前操作化只设了上界
      (CPI ≤ target+0.5pp),没有下界。这意味着 CPI 远低于目标(如日本 0% vs 2%)
      也被编码为"低通胀体验年"。但 anti_talisman 的精神是"驱动量必须独立于结果
      且准确测量其所声称的构念"——"接近目标的低通胀体验"和"远低于目标的通胀体验"
      在 BR-L2-024 机制下对预期的拉动方向相反(前者拉向目标、后者锚定于低水平),
      将它们混为一谈等于操作化没有测到它声称要测的构念。
      详见 required_fixes。

      此外【should】日本锚点在实际分析中悄然使用了另一套未注册的判据
      ("CPI ≥ 2%"→体验年数≈0),与已注册操作化矛盾——若严格按已注册操作化,
      日本 2013-2024 年间几乎每年 CPI ≤ 2.5%,应有 ~10 体验年而非 0 年。
      这不是 anti_talisman 条文层面的问题(条文已经很好了),而是执行层面的问题——
      锚的分析没有 follow 自己注册的测量口径。
      ⇒ required 缺陷见上;should 见下。

    anchor_fact_check: |
      命中(1 条 required 源于操作化矛盾,3 条 should 源于过度归因)。
      逐项核查:

      (1)日本(BOJ 2013 至今)【required 矛盾 + should】:
      BOJ 于 2013 年 1 月与政府联合声明宣布 2% 通胀目标,此前有 ~15 年通缩/低通胀
      (1998-2012),2014 年消费税上调后 CPI 短暂触及 2% 后回落,此后多年在 0-1% 徘徊——
      这些事实陈述正确(SWIFT/IMF IFS/日本统计局数据可查证)。专业预测者与市场隐含
      BEI 远低于 2%——事实正确。
      但锚的分析称"体验年数≈0(宣布目标后几乎无年满足'实际通胀≥2%')"——
      这一判据("CPI ≥ 2%")不是已注册的操作化。已注册的操作化是"CPI ≤ target+0.5pp"
      (=≤2.5%),按此标准日本 2013-2024 年间几乎所有年份都满足,应有 ~10 体验年,
      而非 0 年。锚的分析使用了一套不同的(未经注册的)测量口径——违反了评分卡第 11 条
      (口径必须一次性注册)和 anti_talisman_clause(1)的精神。
      若严格按已注册操作化,日本应被编码为"宣布年数长(~12)+体验年数长(~10)",
      但预期未收敛至 2%——这将构成对预测(i)的反例(体验长但预期不收敛)。
      这不是日本案例本身的问题——这是操作化设计的问题:单边阈值把"通胀远低于目标"
      错误编码为"低通胀体验"。详见 required_fixes。
      【should】锚还称"体验年数≈0"时引用了 BOJ 2014 年消费税上调后 CPI 短暂触及 2%
      作为"几乎无年满足"的证据——但+0.5pp 阈值本就是为了容纳 2.1-2.5% 这类
      "接近但略高"的情况而设的。锚的分析与操作化的精神(将"接近目标"视为体验)
      存在双重矛盾。修订建议:在日本锚后诚实标注"按已注册操作化,日本体验年数≈10,
      该编码暴露了操作化的单边阈值缺陷——通胀远低于目标被混同为接近目标,详见审查
      required_fixes。"

      (2)新西兰 RBNZ【should——过度归因】:
      RBNZ 于 1990 年率先采用通胀目标制(0-2%),在 1990s 将 CPI 从 1980s 两位数
      持续压至目标区间——事实正确。通胀预期在 2000s 稳定锚定于 2%——方向正确。
      但锚称"若宣布年数是驱动量,预期应在 1990 年宣布时跳变;实际上预期是随体验
      逐步收敛的(1990-2000 年渐进式下降)"——这一"宣布 vs 体验"的对比是推论内部的
      因果叙事,不是独立证据。新西兰 1990 年代的制度质量(CBI 独立性立法 1989 年,
      财政责任法 1994 年)和全球经济环境(大宗商品价格/国际通胀下行)等混杂因素
      未与体验年数分离。锚的 confidence 宜保持 moderate,但诚实标注"体验 vs 宣布
      的因果区分来自推论逻辑而非新西兰案例的独立识别策略"。

      (3)新兴市场通胀目标制【should——过度归因】:
      多国(巴西/智利/南非/墨西哥/印尼等)在 2000 年前后宣布通胀目标制,
      宣布后预期未立即跳变而是随实际通胀下降逐步收敛——大方向符合本推论预测。
      作者引用 Hammond 2012 和 Brito & Bystedt 2010——文献存在、引用可信。
      但【should】诚实标注"这些国家在宣布目标制的同时也进行了实质性货币政策改革
      (央行独立/财政纪律)——体验年数的效应与制度改革的效应未完全分离"已经到位,
      但应进一步承认:若制度改革是预期收敛的主要驱动力,而体验年数仅是制度改革的
      伴随现象(好制度→好政策→低通胀→长体验),则体验年数与收敛的相关性是
      confounded 而非 causal。IV 策略(如利用外生供给冲击区分体验 vs 宣布)是
      author 在 primary_suspect 中提到的防御,但未在锚中实施。

      ⇒ required 缺陷见上。三条 should 均为过度归因/混杂问题,不构成事实错。

    definition_vs_prediction: |
      未命中(攻不穿)。关键条件——低通胀体验年数(CPI vs 目标比较,事前编码)、
      宣布年数(纯计数)、前瞻指引时间距离(声明日期→目标日期,事前编码)——均
      为独立于结果的、可事前操作化的构念测量,不是会导致同义反复的加厚定义。
      核心预测——(i)体验年数与收敛速度正相关,(ii)宣布年数在控制体验后不显著,
      (iii)远期锚定效果衰减超过年数比倒数——都是可证伪的经验命题,各有指定的
      observable condition 和证伪阈值。
      anti_talisman_clause 的四条禁令在概念层防止了"预测不成立就改定义"的循环。
      唯一的风险——若"低通胀体验"被事后重新定义为"接近目标的体验"(区别于
      "低于目标的体验")以消化反例——但此风险已在 required_fixes 中通过预注册
      双边阈值解决,属于"预注册后冻结"而非"定义vs预测"问题。
      ⇒ 不判 required,不判 should。

    enumeration_and_species: |
      未命中(N/A)。DED-055 不声称枚举 N 类穷尽的 species,2×2 表是逻辑空间
      的完全划分(体验长短 × 宣布长短 = 4 格),四格按 umbrella criterion
      (体验年数和宣布年数,各自按注册操作化独立测量)定义,符合 DED-008 精神。
      主动猎第 5 格(超出 2×2 逻辑空间):未猎到——体验和宣布各自只有"长/短"
      两个逻辑值,2×2 穷尽所有组合。二分 cut-point 的任意性(几算"长"?)是
      连续量离散化的固有问题,已在 required_fixes 中通过改进操作化缓解。
      ⇒ 不判 required,不判 should。

    primary_suspect_aim: |
      部分命中(should)。文件自认 primary_suspect="BR-L2-024 腿——记忆滞后作为
      预期锚定的核心机制。全推论最重的预测(b)'宣布年数在控制体验后不显著'
      完全压在这条腿上。"这一条指得准确——预测(b)确实是推论最独特的增量主张,
      且确确实全压在 BR-L2-024 上(若记忆可被宣布迅速覆盖,(b)塌缩)。

      但 author 漏认以下弱点:
      (a)【should,关联 required】操作化的单边阈值缺陷使 primary_suspect 的
      暴露面比 author 意识到的更大:不仅存在"记忆可被宣布覆盖"的致命场景,
      还存在"操作化无法区分近目标体验与远目标体验→预测(i)在最需检验的格中
      (通胀远低于目标→体验长但预期不向目标收敛)机械性失败"的场景。
      (b)【should】"体验年数与宣布年数高度共线"的次致命场景比 author 估计的更严重:
      不仅"多数宣布通胀目标制的国家同时经历了低通胀",而且在现有样本中,
      真正干净地分离两者的案例极少——"宣布了目标但通胀就是不达标的央行"
      (author 建议作为防御)本身就是一个选择偏差样本(这些央行可能系统性不同
      于达标央行,在不可观测维度上)。IV 策略(外生供给冲击)理论上可行但
      实际执行中强工具变量难寻(供给冲击影响通胀也影响预期,可能违反排他性)。
      这不是说推论错了——而是说推论在现有数据下比 author 声称的更难检验。
      (c)【should】falsifiability(b)以"不显著(p>0.10)"为证伪条件——这是要求证 null,
      存在统计功效问题:若样本量不足或测量噪声大,不显著可能仅反映 power 不够
      而非机制成立。author 应预注册最小可检测效应量(MDE)并诚实标注:
      若 MDE 大于经济学上认为有意义的宣布效应量,则(b)即使在机制不成立时
      也难以被证伪。

      secondary_suspect 和 unlikely_suspect 的排位合理——(c)腿的双曲贴现签名
      确实更脆弱(理性噪声假说的弹性更大),两砖本身确已 verified(IEA≥1.2)。
      ⇒ 不判 required,记三条 should。

    caliber_registration_ambiguity: |
      命中(1 条 required + 2 条 should)。
      口径注册总体诚意足——体验年数有分子/分母/阈值一次性注册声明、
      宣布年数有起算日期规则(正式宣布日/t0 不重置)、收敛速度 β 有回归方程、
      前瞻指引时间距离有定量编码规则(短距≤1年/中距1-2年/远距>2年)。
      比许多推论的口径注册已经扎实得多。

      但【required】"低通胀体验年"的阈值注册存在结构性缺陷:当前注册为
      "CPI ≤ target+0.5pp",仅有上界没有下界。这意味着"CPI 远低于目标(如 0%)"
      与"CPI 接近目标(如 1.8%)"在操作化中不可区分——但它们在 BR-L2-024
      机制下对预期的拉动方向相反。操作化测到的不是"接近目标的体验"而是
      "不高于目标的体验"——这是两个不同的构念,前者匹配机制,后者不匹配。
      操作化必须在注册时就区分这两者。修复:将阈值注册改为双边
      "|CPI − target| ≤ 0.5pp"(或等价的 target−0.5pp ≤ CPI ≤ target+0.5pp),
      一次性注册后冻结。详见 required_fixes。

      【should-1】"+0.5pp"阈值本身缺乏理论或经验锚定——为什么是 0.5pp 而不是
      0.3pp 或 1.0pp?author 诚实声明"阈值一次性注册——若事后发现+0.3pp 产生
      更强的相关性,仅可报告为稳健性检验,主口径不变"——这符合预注册精神,
      但没有解释 0.5pp 的来源(如参照通胀目标制的典型容忍区间±1pp 的半宽,
      或参照 CPI 测量的典型误差范围)。宜给 0.5pp 附 provisional 理由,
      并预注册[0.25, 0.75]为稳健性检验区间。

      【should-2】宣布年数的编码规则"正式宣布日起算,目标值调整不重置"——
      方向正确,但未注册"非量化目标→量化目标转换"的处理规则。如 ECB 1999 年
      宣布"below but close to 2%"(非量化)→2003 年澄清"低于但接近 2%"
      (仍非量化)→2021 年改为对称 2%(量化),宣布年数从哪年起算?
      author 在 boundary_cases 中讨论了 ECB,但未在操作化中注册此类案例的
      编码规则。宜注册:宣布年数从最早公开发布量化或非量化通胀目标的日期起算;
      若目标格式重大变更(如非量化→量化),以原日期为准(不变更 t0),
      但将格式变更作为稳健性检验的控制变量。

      ⇒ required 缺陷见上;两条 should 为注册完整性建议。

    data_source_common_root: |
      未命中(N/A)。本推论的测量不涉及多数据源间的独立性判断——CPI 数据来自
      IMF IFS/各国统计局,预期数据来自调查(SPF/Consensus Economics)或金融市场
      (通胀互换/BEI),这些是不同的数据生成过程,不存在"多源同根"问题。
      ⇒ 不判 required,不判 should。

    api_access_vs_epistemic_independence: |
      未命中(N/A)。本推论不涉及通过 API/MCP 查询数据源并声称"多源独立"。
      ⇒ 不判 required,不判 should。

  counterexample_hunt: |
    主动构造能证伪核心主张的干净案例,认真查历史/跨文化/跨国别实例。

    【猎捕策略】核心主张有三条独立攻击路径:
    - 攻击预测(i):找一个"体验年数长但预期不向目标收敛"的国家
    - 攻击预测(ii):找一个"宣布年数比体验年数更能解释预期收敛"的国家
    - 攻击预测(iii):找一个"远期预测锚定效果与近期预测按年数比正比衰减"的央行

    【猎捕结果】

    (A) 日本——被消化为"揭露操作化缺陷,非净杀机制":
    按已注册操作化("CPI ≤ target+0.5pp"),日本 2013-2024 年间 CPI 常年 0-1%,
    均 ≤ 2.5%(目标 2%+0.5pp),体验年数≈10。但通胀预期(专业预测者 BEI~1.0-1.5%,
    家庭调查更低)始终远低于 2%,未向目标收敛。这构成对预测(i)的 prima facie 反例
    (体验长→预期不收敛)。
    消化:这不是记忆滞后机制的失败——BR-L2-024 恰恰预测预期锚定于实际体验到的
    通胀水平(日本 ~0%)。问题出在操作化:单边阈值将"远低于目标的通胀体验"
    错误编码为"接近目标的低通胀体验"。修复操作化(双边阈值)后,日本的"接近目标
    的体验年数"≈0(CPI 从未接近 2%±0.5pp),与锚的分析一致,预测(i)不再被反例化。
    结论:日本暴露了操作化缺陷(recorded as required),但未净杀推论机制。

    (B) 瑞典 1993-1995——被消化但消化手法有 L4-009 模式风险:
    author 已将瑞典列为 counterexample candidate(needs_digestion),诚实标注。
    瑞典 1993 年 1 月宣布 2% 目标时刚经历 1990-91 年金融危机(CPI 达 8-10%),
    但通胀预期在 3-4 年内显著下降至接近 2%。若编码为"体验短+宣布短→预期收敛快",
    对预测(i)构成压力。
    author 的消化三条:(1)瑞典还做了财政紧缩/养老金改革/浮动汇率/CBI 独立立法——
    这些改革可能通过信号渠道直接拉低预期;(2)克朗脱离 ERM 后走强提供了汇率锚;
    (3)预期降至 2-3%区间但未精确锚定在 2%。
    消化(1)的模式是"快速收敛=其他改革做的,不是宣布做的"——这与 L4-009 判例中
    "事后口径选择救推论"的模式结构同构。若所有快速收敛案例都可以通过"该国还做了
    其他改革"消化,则预测(i)失去了被快速收敛案例证伪的机会。
    【should】宜预注册:哪些"伴随改革"可接受为消化理由、哪些不可接受。
    如"CBI 独立立法与通胀目标宣布同时发生→不可用于消化(两者属于同一制度套餐)",
    而"完全外生的财政冲击→可作为消化理由"。当前消化手法太过灵活。
    结论:未被净杀,但消化机制需预注册约束。

    (C) 欧元区国家 1999 后(意大利/西班牙/葡萄牙/希腊)——被消化,但揭示"纯言辞"的稀有性:
    这些国家在 1990s 有高通胀历史(意大利 1980s 达两位数,希腊 1980s-90s 达 15-20%),
    但在加入欧元区(1999)后通胀预期迅速收敛至 ~2%。体验年数短(Maastricht 趋同标准
    仅 3-5 年),但预期收敛快。
    消化:欧元是货币制度变更(新央行+新货币+新货币政策框架),远不止"前瞻指引"或
    "通胀目标宣布"——属于 regime change,不是纯言辞。author 可合理排除(落在
    excluded_outcomes 的"行动通道"或"固定汇率名义锚"范围)。
    但消化揭示了一个结构性问题:在现实世界中,能干净分离"纯言辞"与"制度行动"
    的案例极少——欧元区、巴西 Plano Real(1994)、秘鲁 Fujimori 稳定化(1990)、
    以色列 1985 稳定化——所有通胀预期的快速收敛案例都涉及某种制度/货币改革,
    几乎没有"纯宣布→预期收敛"的案例。这意味着预测(ii)的干净检验极度依赖
    已宣布目标制的国家的面板回归——但在面板中体验和宣布高度共线。
    【should】已在 primary_suspect_aim 中记录(共线性问题)。

    (D) 巴西 Plano Real(1994)——被消化但指向同样的问题:
    1993 年通胀 ~2,500%,Plano Real(新货币+稳定化计划)后,1995 年通胀 ~10%,
    1997 年 ~5%。通胀预期随着新货币的稳定而快速下降——但 Plano Real 是货币改革
    (新货币 URV→BRL),不是通胀目标宣布(巴西 1999 年才正式采用通胀目标制)。
    落在 excluded_outcomes 中(非通胀目标制国家)。但再次说明"制度行动→快速预期收敛"
    是普遍现象,"纯言辞→预期收敛"的案例稀缺。

    (E) 前瞻指引时间距离的干净检验——猎捕结论:几乎不可能在现有数据中干净执行:
    预测(c)要求同一央行同一时点的 1 年期和 3 年期通胀预测,并对两者的公众锚定效果
    做配对检验。实操障碍:(i)多数央行不发布精确的点预测(尤其 3 年期),而是扇形图/
    区间/条件预测;(ii)"公众对预测的锚定效果"本身难以测量——需要识别公众预期在
    央行预测发布前后的变动,并归因于央行预测——这在 3 年期窗口尤其困难
    (3 年前发布的预测与 3 年后实际通胀之间发生了太多其他事件);(iii)央行预测本身
    就是内生变量——央行会调整预测以影响预期,预测内容不是外生的。
    这不是机制的问题(双曲贴现的衰减签名在理论上可检验),而是数据可用性的问题。
    author 已将(c)诚实列为 secondary_suspect,此猎捕结论不改变其排位。

    【猎捕总评】无净杀反例。推论的核心机制(记忆滞后+现时偏向→双重折扣→体验驱动预期)
    在方向上正确——通胀预期确实更多地跟随实际通胀而非央行宣布,这是跨国面板文献的
    稳健发现。最接近反例的日本反而暴露了操作化缺陷而非机制缺陷。
    但猎捕暴露了两个结构性弱点:(1)干净检验"宣布无效"所需的"纯言辞"场景在现实中
    极度稀缺——几乎所有案例都混杂制度行动,(2)操作化的单边阈值使推论在最需要被
    检验的格(通胀远低于目标的国家)中无法产生正确预测。
    ⇒ 硬门第 2 条(无 scope 内活反例)可通过——猎到的候选均被消化或暴露操作化问题
    而非机制问题。但操作化问题本身构成 required 缺陷,使推论当前不可判 verified。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发,但有 should 级窄缝】。推论整体结构可证伪——
    三个 falsifiability 条件指定了可观测的、事前可判定的反例形态;anti_talisman_clause
    四条禁令防了最直白的循环。但有两条窄缝:
    (a)操作化的单边阈值(required 缺陷,见上)若不被修复,将制造一个软循环:
    通胀远低于目标的国家(如日本)→体验年数被编码为"长"→预测预期应收敛→实际
    不收敛→author 可能辩称"体验的不是低通胀而是通缩"→事后重新定义"体验"的含义。
    这个循环在修复操作化(双边阈值)后被关闭——因为远低于目标的通胀不再被编码为
    "低通胀体验"。
    (b)+0.5pp 阈值的事后调参风险:若双边阈值修复后,某个反例出现在边界
    (如 CPI=目标+0.6pp,超出阈值,但预期仍收敛→对(i)构成反例),author 可能主张
    阈值应调宽至 ±0.6pp。author 已预注册"阈值一次性注册不得事后调整",防线在位。
    但 0.5pp 缺乏理论动机(见 should),使其在实际操作中更容易被事后质疑。
    ⇒ 不判 required,不判 should。窄缝(b)在 should_fixes 中覆盖(0.5pp 需附理论动机)。

    DED-007(焊死测量轴):【未复发】。自变量(CPI 通胀 vs 目标→体验年数,宣布日期
    →宣布年数)与因变量(调查预期/市场隐含预期→收敛速度)使用完全不同的数据源、
    测量工具和数据生成过程。CPI 来自统计机构的价格采集,预期来自调查问卷或金融
    市场定价——构念上异源正交。不存在 DED-007 式"用同一种货币量测自变量和因变量"
    的焊死。
    anti_talisman_clause 的四条禁令在概念层保证了测量方向的分离。
    ⇒ 不判 required,不判 should。

  required_fixes:
    - |
      【required】将"低通胀体验年"的操作化从单边阈值改为双边阈值。
      当前: "若该年实际CPI通胀率(年末同比)≤ 央行目标值+0.5个百分点,则该年计为'低通胀体验年'"
      修改为: "若该年实际CPI通胀率满足 |CPI − 目标值| ≤ 0.5个百分点,则该年计为'低通胀体验年'"
      (或等价的: target − 0.5pp ≤ CPI ≤ target + 0.5pp)。
      理由: BR-L2-024 记忆滞后预测预期锚定于实际体验到的通胀水平。若公众体验的是
      远低于目标的通胀(如日本 ~0% vs 目标 2%),预期被锚定在 ~0%,不会向目标收敛。
      预测(i)的"体验越久→预期越接近目标"只在体验到的通胀接近目标时成立。
      单边阈值将"远低于目标"与"接近目标"混为一谈,操作化测到的不是机制所需的构念。
      双边阈值一次性注册后冻结。修改后"低通胀体验年"等价于"接近目标的低通胀体验年",
      与预测(i)的机制逻辑一致,且日本案例将正确编码为体验年数≈0(CPI 从未进入 2%±0.5pp
      区间),与锚的分析一致。
      修改位置: operationalization.低通胀体验年数.measurement 第 2 段。

  should_fixes:
    - |
      [should] 日本锚点与操作化对账:在 real_world_anchors.supporting[0](日本).evidence 中,
      诚实标注:(a)当前分析的"体验年数≈0(CPI≥2%判据)"使用了未经注册的测量口径,
      与已注册操作化("CPI ≤ target+0.5pp")矛盾;(b)严格按已注册单边阈值操作化,
      日本 2013-2024 年间 CPI 常年 0-1% ≤ 2.5%,体验年数≈10,构成对预测(i)的
      prima facie 反例;(c)该反例暴露了单边阈值的缺陷而非机制缺陷——按修正后的双边阈值,
      日本体验年数正确归零;(d)在操作化修正完成前,日本锚的分析与操作化之间的矛盾
      需诚实标注,且锚的 direction 从"supporting"调整为"支持方向+暴露操作化缺陷"。
      修订位置: real_world_anchors.supporting[0](日本).evidence 末尾 + confidence 字段。

    - |
      [should] BOJ 2013 的前瞻指引 vs 非常规货币政策边界:在 boundary_cases 中新增一条,
      讨论日本央行 2013 年 1 月同时宣布 2% 通胀目标(前瞻指引/言辞通道)与 QQE
      (非常规货币政策/行动通道)的案例——当言辞与行动同时宣布时,预期变动的归因
      成为问题。给出操作性判别标准:若前瞻指引内容与非常规政策工具在【同一份声明中
      同时首次宣布】,该案例在检验预测(b)时仅可作为 boundary_case——
      因为无法将"宣布目标→预期变动"的效应与"宣布 QQE→预期变动"的效应分离。
      修订位置: boundary_cases 新增条目。

    - |
      [should] 瑞典消化预注册约束:在 counterexamples[0](瑞典).analysis 中,增加
      预注册约束:"本推论预注册——在消化快速收敛案例时,'该国同期进行了 CBI 独立性
      立法/财政改革/汇率制度改革'不可接受为独立消化理由(这些与通胀目标宣布属于
      同一制度套餐,其预期效应无法与宣布效应分离);可接受的消化理由仅限于:
      (a)预期数据质量不足以判定是否精确收敛至目标值(如仅降至 2-3% 区间而非 2%),
      (b)存在独立于通胀目标宣布的、外生的名义锚变更(如加入固定汇率机制)。
      此约束旨在防止 L4-009 模式的事后口径选择——若所有快速收敛案例均可通过
      '该国还做了其他改革'消化,预测(i)将失去被证伪的机会。"
      修订位置: counterexamples[0].analysis + falsification_trace 或 discriminant_validity。

    - |
      [should] 诚实标注共线性的严重程度 + 预注册 MDE:在 falsification_trace.primary_suspect
      的"次致命场景"段中,增加以下内容:
      (a)进一步承认:在现有 ≤30 国通胀目标制样本中(1990-2024),真正干净的
      "宣布长+体验短"案例(宣布了目标但通胀持续不达标)极少——日本是最接近的案例,
      但其特殊性(长期通缩+人口下降+零利率下限)使它在"体验vs宣布"中不是一个
      干净的控制组。多数宣布目标制的国家同时经历了通胀下降(好央行既宣布又做事),
      体验年数和宣布年数的相关系数可能高达 0.7-0.8(待实际计算),远超"可容忍共线"
      的经验阈值(VIF>5)。
      (b)预注册最小可检测效应量(MDE):给定预期样本量 N≈20-30 国×15-30 年面板,
      预注册在 α=0.05,power=0.80 的条件下,宣布年数在控制体验年数后的偏回归系数
      的最小可检测标准化效应量为 f²=X。若 X > 经济学上认为有意义的宣布效应阈值
      (如宣布 10 年应使预期向目标多收敛 0.5pp/年),则 falsifiability(b)在当前数据下
      统计上不可检验——即使机制不成立,不显著也可能只是 power 不够。
      修订位置: falsification_trace.primary_suspect 末尾或 limitations 新增段。

    - |
      [should] +0.5pp 阈值附 provisional 理论动机:在 operationalization.低通胀体验年数.
      measurement 中,在"阈值(+0.5pp)一次性注册"后增加:"阈值选择依据:(i)通胀目标制
      央行的典型容忍区间为 ±1pp(如 ECB 的'below but close to 2%'隐含上界~2.5%,
      多数 IT 央行的目标区间半宽 1pp);(ii)CPI 年度测量的典型误差范围约 0.2-0.5pp
      (因篮子更新滞后/质量调整等);(iii)±0.5pp 取容忍区间的半宽,兼顾'接近目标'
      的实质意义与统计可区分性。稳健性检验区间预注册为[0.25, 0.75]pp,主口径不变。"
      修订位置: operationalization.低通胀体验年数.measurement 第 3 段。

round_2:
  reviewer: "独立子 Agent (round 2, 全新独立上下文, 与 round 1 审查者及作者无关)"
  verdict: needs_revision
  verdict_note: |
    round_1 的 required 修复(单边阈值→双边阈值 |CPI−target|≤0.5pp)已执行到位。
    操作化现在正确地区分了"接近目标的体验"与"远低于目标的体验"——
    日本案例(CPI ~0-1% vs 目标 2%)在新口径下体验年数≈0,与锚的分析一致,
    预测(i)的机制逻辑不再被操作化矛盾所伤。这是本轮审查最重要的正向发现。

    但 round_1 的 5 条 should 修复**无一执行**,且其中 2 条(S3/S4)的持续存在
    已从"锦上添花"级别的建议上升为"影响推论可检验性"的实质性缺口:

    【S4-共线性+MDE——最接近 required 的 should】预测(b)"宣布年数在控制体验年数后
    不显著"是整个推论最独特的可证伪赌注。但在现有 ≤30 国通胀目标制样本中,
    体验年数与宣布年数高度正相关(好央行既宣布又做事),两者的相关系数可能高达
    0.7-0.8。在此共线性下,回归系数标准误膨胀,不显著可能反映 power 不足而非
    机制成立。author 未预注册 MDE(最小可检测效应量),也未诚实标注在此共线性下
    (b)的统计检验力——这使(b)面临"不显著=机制成立"与"不显著=power 不够"
    两种解读的歧义,恰好是 DED-004 式不可证伪循环的入口:若结果不显著→援引机制;
    若结果显著→援引共线性→仍不推翻机制。虽不致死(IV 策略和大样本可解),
    但当前形态下(b)的可证伪性已被削弱。

    【S3-瑞典消化预注册——窄但真实的 DED-004 风险】瑞典 1993-95 案例中,
    author 用"瑞典同期做了财政紧缩/养老金改革/CBI 独立立法/浮动汇率"来消化
    快速收敛。这个消化手法的问题是:几乎所有成功将通胀降至目标的央行,
    都同时实施了配套制度改革——若所有快速收敛案例均可被"还做了其他改革"消化,
    则预测(i)对"快速收敛案例"这类潜在反例失去了被证伪的机会。
    当前消化逻辑没有预注册门槛(哪些"伴随改革"可接受为消化理由、哪些不可),
    构成一个虽窄但真实的 DED-004 式软循环。需预注册约束。

    【其余 3 条 should——品控欠账】S1(日本锚口径语言对齐)、S2(BOJ 2013 言辞vs行动
    边界案例)、S5(±0.5pp 阈值理论动机)均未执行。此外,本审查发现一条
    新 should:低通胀体验年数的 definition 字段仍写"通胀持续低于(或等于)央行目标"——
    这与已修正的双边阈值测量(|CPI−target|≤0.5pp,含目标上方)不一致。
    definition 描述的是旧单边阈值的构念,measurement 测的是新双边阈值的构念。
    应将 definition 更新为"公众实际经历的、接近央行目标的通胀(即通胀与目标值之差
    的绝对值不超过 0.5pp)的累计年数",使构念与操作化一致;同时建议将术语
    "低通胀体验年数"改为"近目标通胀体验年数"——当目标=2%且 CPI=2.4%时,
    这是通胀高于目标而非"低"通胀,但按双边阈值确实属于"接近目标的体验"。

    综上:required 修复到位→推论骨架已正;但 5 条 should 欠账 + 1 条新 should,
    其中 S3(瑞典 DED-004 风险)和 S4(共线性 testability)已从"nice-to-have"
    升级为"影响推论可否被干净检验"的实质性遗留问题。
    预期本轮修订(重点:预注册 MDE + 瑞典消化约束 + definition 对齐)后可复 verified。

  red_flag_findings:
    brick_conclusion: |
      未命中(攻不穿,维持 round_1 结论)。我独立核对了 BR-L2-024 与 BR-L2-030 全文。
      BR-L2-024 全文不含"前瞻指引""央行沟通""通胀预期""宣布年数""言辞通道"——
      只讲法币信用的连续可逆性与记忆滞后,是纯信用更新机制命题。
      BR-L2-030 全文不含"货币政策""通胀目标制""体验vs宣布""央行""前瞻指引"——
      只讲双曲贴现/现时偏向,是纯跨期偏好结构命题。
      DED-055 的非平凡内核——"体验年数 vs 宣布年数的竞争性回归,预测宣布年数
      在控制体验年数后无独立贡献,且前瞻指引面临现时偏向+记忆滞后的双重折扣"——
      不在任一块砖的原文或近义中。两砖合力的核心增量是真组合,非复述。
      不判 required,不判 should。

    nontriviality_cell_check: |
      未命中(攻不穿,维持 round_1 结论)。2×2 表的标星格"体验长→收敛快,无论宣布长短"
      是推论的非平凡核心——任一块单砖无法独立推出此格。BR-L2-024 只说预期随体验更新,
      不说宣布有没有增量;BR-L2-030 完全不涉及预期收敛。两砖合力产出的
      "体验vs宣布竞争性检验"是真增量。
      "体验短+宣布长→收敛慢"是本推论与理性预期理论(Woodford/Eggertsson)的直接对撞点——
      此格若被经验填为"收敛快",理性预期胜出。可被独立检验。
      不判 required,不判 should。

    measurement_orthogonality: |
      未重蹈 DED-007(攻不穿,维持 round_1 结论)。自变量(CPI vs 目标→体验年数,
      宣布日期→宣布年数)与因变量(调查预期/市场隐含预期→收敛速度)使用完全不同的
      数据源和测量工具——CPI 来自统计机构价格采集,预期来自调查问卷或金融市场价格。
      构念上异源正交,无 DED-007 式焊死。
      不判 required,不判 should。

    scope_hook_independent_of_result: |
      部分命中(should,维持 round_1 结论)。四项 excluded_outcomes 均按事前结构特征划,
      不由结果回填。但排除(2)"非常规货币政策"的边界在 BOJ 2013 案例中仍然模糊——
      BOJ 同时宣布 2% 目标(射程内)与 QQE(被排除),author 在用日本为 supporting anchor
      时将其归入射程内分析"宣布目标后预期未收敛",但未讨论 QQE 行动通道的混杂效应。
      round_1 should fix S2 要求新增 BOJ boundary case 条目,未执行。
      不判 required,仍记 should(同 round_1 S2)。

    criterion_tier_match: |
      未命中(攻不穿)。核心变量均为连续量,使用回归分析。时间距离三档划分是操作化便利,
      关键预测(c)使用连续比率检验。二分化的"体验年"是面板回归中累计计数变量的标准做法。
      不判 required,不判 should。

    anti_talisman_cashed: |
      大体兑现(required 裂缝已修复,should 缺口仍存)。anti_talisman_clause 四条禁令
      在位且完整。round_1 的核心 required 缺陷——"低通胀体验年"单边阈值使操作化
      测不到机制所需的构念——已通过双边阈值修复。当前四条禁令均可被实际操作执行:
      (1)体验由 CPI vs 目标独立编码,禁反推;(2)宣布年数是纯计数,禁反推质量;
      (3)远期预测差→理性噪声为零假设,禁反推;(4)对称保护禁止选择性解释。
      但【should】两条执行层面缺口:
      (a)日本锚的分析仍使用旧口径语言("CPI≥2%"),虽结论(体验≈0)在新口径下正确,
      但分析与已注册操作化之间的措辞不一致需诚实标注(同 round_1 S1,未执行)。
      (b)瑞典消化缺少预注册约束→anti_talisman 精神未延伸至反例消化环节
      (同 round_1 S3,未执行——且本轮已升级为接近 required 的 should)。
      不判 required,记两条 should。

    anchor_fact_check: |
      未命中(无事实错,维持 round_1 结论)。三个 supporting anchor 的核心事实陈述
      均可查证:日本 BOJ 2013 宣布 2% 目标及后续通缩/低通胀、新西兰 RBNZ 1990
      率先 IT 及渐进收敛、新兴市场多国 IT 后预期随实际通胀逐步收敛。
      日本锚的分析——在旧单边阈值下存在操作化矛盾(见 round_1 required),
      在新双边阈值下结论(体验年数≈0)与操作化一致,事实层面无误。
      新西兰锚的"宣布 vs 体验"因果归因仍混杂制度质量和全球经济环境(已诚实标注)。
      新兴市场锚的体验年数效应与制度改革效应未完全分离(已诚实标注)。
      但【should】日本锚的语言仍使用旧口径("CPI≥2%"),与已注册操作化措辞不一致
      (同 round_1 S1,未执行)。新西兰锚的"若宣布是驱动量则预期应跳变"是推论内部
      的因果叙事,非独立证据(同 round_1 已标注)。
      不判 required,记 should。

    definition_vs_prediction: |
      未命中(攻不穿,维持 round_1 结论)。关键条件(体验年数/宣布年数/时间距离)
      均为独立于结果的、可事前操作化的构念测量。核心预测(i)(ii)(iii)均为可证伪的
      经验命题,各有指定的 observable condition 和证伪阈值。
      anti_talisman_clause 在概念层防止了"预测不成立就改定义"的循环。
      不判 required,不判 should。

    enumeration_and_species: |
      未命中(N/A)。不声称枚举 N 类穷尽的 species。2×2 表穷尽逻辑空间,
      四格按 umbrella criterion(体验年数和宣布年数按注册操作化独立测量)定义。
      不判 required,不判 should。

    primary_suspect_aim: |
      部分命中(2 条 should——升级版)。primary_suspect 自认"BR-L2-024 腿"准确——
      预测(b)确是全推论最独特的增量主张,确完全压在记忆滞后上。
      secondary_suspect(双曲贴现签名)和 unlikely_suspect(两砖本身)排位合理。

      但以下弱点未被充分消化:
      【should-1,几乎 required】体验年数与宣布年数高度共线的"次致命场景"
      比 author 估计的更严重:在现有 ≤30 国 IT 样本中,真正干净的"宣布长+体验短"
      案例极少——日本是最接近的但有其特殊性(零利率下限/人口下降/长期通缩),
      其他案例(如土耳其 2006+、加纳 2007+)的样本期短或数据质量差。
      author 建议的 IV 策略(外生供给冲击)理论上可行但排他性难以验证
      (供给冲击影响通胀也影响预期)。更重要的是:author 未预注册 MDE——
      若样本量和共线性导致宣布年数的最小可检测效应量大于经济学上
      有意义的宣布效应阈值,则(b)在现有数据下统计上不可检验。
      这不是说推论错了——而是说推论的核心赌注在当前数据条件下无法被干净裁决。
      (同 round_1 S4,未执行,本轮升级为最接近 required 的 should。)

      【should-2】author 未承认:若体验年数和宣布年数高度共线(r>0.7),
      则 falsifiability(b)的"要求不显著"从方法论角度是对自己有利的不对称赌注——
      高共线天然使单个系数趋向不显著(标准误大),推论被动受益于数据结构的噪声。
      这不是恶意的——author 已诚实将共线列为次致命场景——但未充分讨论
      这个结构不对称对推论可证伪性的影响。
      不判 required,记两条 should(第一条几乎 required)。

    caliber_registration_ambiguity: |
      部分命中(1 条新 should,2 条旧 should 未执行)。口径注册整体扎实——
      体验年数有分子/分母/阈值一次性注册声明,宣布年数有起算日期规则,
      收敛速度 β 有回归方程,前瞻指引时间距离有定量编码规则。

      round_1 的 required(单边→双边阈值)已修复。+0.5pp 阈值已预注册冻结。

      但【新 should】"低通胀体验年数"的 definition 字段仍写"通胀持续低于(或等于)
      央行目标"——描述了旧单边阈值的构念,与已修正的 measurement(|CPI−target|≤0.5pp,
      含目标上方)不一致。definition 应更新为匹配双边阈值的构念:"公众实际经历的、
      接近央行目标的通胀(通胀与目标值之差的绝对值不超过 0.5pp)的累计年数"。

      【旧 should-1,未执行】+0.5pp 阈值仍无理论动机(同 round_1 S5)。
      【旧 should-2,未执行】非量化目标→量化目标转换的编码规则未注册(ECB 类型)
      (同 round_1 的相关条目)。
      不判 required,记三条 should。

    data_source_common_root: |
      未命中(N/A)。CPI 来自 IMF IFS/各国统计局,预期来自调查(SPF/Consensus Economics)
      或金融市场(通胀互换/BEI)——不同的数据生成过程,无"多源同根"问题。
      不判 required,不判 should。

    api_access_vs_epistemic_independence: |
      未命中(N/A)。不涉及通过 API/MCP 查询多个数据源并声称"多源独立"。
      不判 required,不判 should。

  counterexample_hunt: |
    【猎捕策略】三条独立攻击路径:(A)攻(i)——找"体验年数长但预期不向目标收敛";
    (B)攻(ii)——找"宣布年数比体验年数更能解释预期收敛";
    (C)攻(iii)——找"远期预测锚定效果按年数比线性衰减(非双曲)"。

    【猎捕过程】

    (A) 攻击预测(i)——体验长→预期应收敛:
    在双边阈值下,"体验年数长"等价于"该国 CPI 长期处于目标±0.5pp 区间内"。
    候选反例搜索:
    - 瑞士(SNB):1999 年定义物价稳定(CPI<2%),CPI 常年 0-1%,极少进入
      [1.5%,2.5%]区间→体验年数短,非反例。
    - 日本:CPI 常年 0-1%,不在[1.5%,2.5%]→体验年数≈0,非反例。
    - 加拿大(1991+):CPI 从~5%降至~2%,1993年后长期处于[1.5%,2.5%]→体验年数长,
      预期在 1990s 中后期锚定于 2%→收敛。符合预测,非反例。
    - 英国(1992+):CPI 长期接近 2.5%(后 2%)目标,预期锚定→符合预测,非反例。
    - 欧元区核心(德国/法国/荷兰):长期低通胀+ECB 目标→预期稳定→符合预测,非反例。
    未猎到"体验长+预期不收敛"的干净反例。最接近的是日本,但日本在新口径下
    体验年数≈0,不再构成反例。

    (B) 攻击预测(ii)——宣布独立有效:
    核心赌注:在控制体验年数后,宣布年数对预期收敛无独立贡献。
    候选反例搜索——找一个"宣布了目标但体验不足,预期仍收敛"的国家:
    - 瑞典 1993-95:最接近的候选,已被 author 列为 counterexample candidate。
      瑞典 1993 年 1 月宣布 2% 目标时刚经历 1990-91 年金融危机(CPI 8-10%),
      但通胀预期在 3-4 年内显著下降。若编码为"体验短+宣布短→预期快速收敛",
      对(i)构成压力。author 的消化:(a)配套制度改革(财政紧缩/CBI 独立/浮动汇率)→
      通过信号渠道拉低预期;(b)汇率稳定提供额外名义锚;(c)预期降至 2-3% 区间
      但未精确锚定在 2%。
      此消化的结构与 round_1 S3/L4-009 判例精神冲突:无预注册约束下,
      "该国同期做了其他改革"可消化任何快速收敛案例。本轮维持 round_1 判断:
      未被净杀,但消化机制需预注册约束方可接受为有效消化。
    - 加拿大 1991-1995:收敛相对快(~4 年),但这是实际通胀降了→体验年数
      随之积累→符合"体验驱动"预测,非"宣布独立有效"反例。
    - 智利 1991+:通胀从 20%+降至 3%,收敛过程 5-8 年→体验积累驱动,
      非宣布独立有效。
    未猎到"宣布独立有效(控制体验后仍显著)"的干净反例。但此结论不能过度解读:
    在现有样本中,几乎所有 IT 国家的宣布与体验高度共线,
    "宣布独立有效"的反例在统计上难以被检测——这与 S4(共线性)问题一致。

    (C) 攻击预测(iii)——双曲贴现签名:
    要求获取同一央行同一时点的 1 年期和 3 年期通胀预测的公众锚定效果配对数据。
    不依赖现有数据库——猎捕只能基于文献和已发布的央行预测评估数据。
    实操障碍(同 round_1 已讨论):(i)多数央行不发布精确点预测,而是扇形图/
    区间/条件预测——定量编码误差大;(ii)3 年期公众锚定效果难以识别
    (3 年前预测与 3 年后结果之间发生太多其他事件);(iii)央行预测内生。
    无法在 desk research 中干净执行此检验。这本身不是机制缺陷(双曲贴现
    衰减签名在理论上可检验),但数据可用性使(c)在当前条件下的独立检验力
    远低于(a)(b)。author 已将(c)列为 secondary_suspect,此猎捕结论不改变其排位,
    但强化了"secondary_suspect 排位合理"的信心。

    【猎捕总评】无净杀反例。推论的方向性主张——通胀预期更多跟随实际通胀
    而非央行宣布——是跨国面板文献的稳健发现,方向上正确。但猎捕揭示:
    (1)干净检验(b)所需的"宣布与体验不共线"场景在现实中极度稀缺——
    这在方法论上限制了推论的裁决力(无法干净地证伪,也无法干净地证实);
    (2)这是实证约束(现有 IT 国家的历史数据结构),非逻辑缺陷,
    可通过更长的历史样本(等某些 IT 国家出现"宣布了但长期不达标"的案例)
    或更好的识别策略(IV)来缓解。硬门第 2 条(无 scope 内活反例)可通过。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【should 级窄缝未闭合】。推论整体结构可证伪——
    三个 falsifiability 条件指定了可观测的、事前可判定的反例形态;
    anti_talisman_clause 四条禁令防了最直白的循环;双边阈值修复关闭了
    round_1 发现的 DED-004 式 main crack(通胀远低于目标→体验年数被错编→
    可事后重新定义"体验")。

    但仍有两条窄缝,均为 should 级:
    (a)瑞典消化无预注册约束(round_1 S3,未执行):若所有快速收敛案例均可通过
    "该国还做了其他改革"消化,则预测(i)对快速收敛案例这类潜在反例
    失去被证伪的机会。"其他改革"是一个可以无限弹性扩展的消化池——
    财政改革/货币改革/汇率改革/制度独立性/全球通胀环境/大宗商品价格/
    技术冲击——总能找到某个"其他因素"来解释任何不符合预测的案例。
    这个窄缝是 DED-004 的微缩版:预测在遇到不利证据时,
    可以通过事后扩大消化理由的集合来保护自己。fix 已在 round_1 S3 中给出:
    预注册可接受/不可接受的消化理由类别。未执行,窄缝仍开。
    (b)共线性+无 MDE(round_1 S4,未执行):若宣布年数在回归中不显著,
    author 援引机制成立;若宣布年数显著,author 可援引共线性(说这不是真正的
    独立贡献而是与体验共线)。虽然 author 已在 falsification_trace 中诚实标注
    共线性为次致命场景(方向是"可能无法检验"而非"可以事后救"),但未预注册 MDE
    使"不显著"的解读方向无法被事前锁定。这也是一条窄 DED-004 式不对称:
    结果的两种可能方向(t-stat > 2 vs t-stat < 1)中,只有对推论有利的方向
    被明确解释,不利方向的解释存在弹性。fix:预注册 MDE 并声明——若
    宣布年数的可检测效应量在 MDE 以下,则(b)在当前数据中【不可检验】而非
    【被证实】;若宣布年数效应量超过 MDE 且显著,则(b)被证伪。
    不判 required,记两条 should。

    DED-007(焊死测量轴):【未复发】。自变量与因变量使用完全不同的测量工具
    和数据生成过程。anti_talisman_clause 四条禁令保证了测量方向的分离。
    不判 required,不判 should。

