    anti_talisman_enforcement: |
      未命中(维持 round 1/2 结论,round 1/2 should 已处理)。anti-talisman_clause 四条
      禁令持续严密且具体:(a)检测成本→技术部署时间线,不依赖行为变化;(b)信号价值→
