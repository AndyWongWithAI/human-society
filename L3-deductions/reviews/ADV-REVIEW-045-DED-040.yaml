      (a)选择一:认定混合型为过渡态而非稳定均衡→从punishment_regime的类型列表中移除
      混合型(或降级为"过渡模式"并独立标注),保留derivation的"三种(且只有三种)自洽路径"
      声称。此时需在operationalization中补充:为何混合型不是稳定均衡(什么机制最终推动
      系统走向通胀/疲劳/专业化)?
      (b)选择二:认定混合型为第四种稳定均衡→在derivation step 3中补入混合型,将声称
      修正为"四种(且只有四种)",并补充混合型的稳定化机制(何种力量阻止整体均值最终下降?
      新高质量惩罚者的持续进入来源是什么?混合型与通胀型/专业化型的边界在何处?)。同时
      更新nontriviality_test的判据表,为混合型分配独立格位。
      无论选择哪种,全文件(statement/derivation/operationalization/nontriviality_test)
      的类型数必须一致。
    - |
      【红旗9辅助·预测(iii)可证伪性边界】在excluded_outcomes或prediction(iii)的
      操作化中明确"制度性信号维持"的操作化边界:
      (a)定义:什么是"制度性信号维持"?至少区分三个层次——(i)正式制度(声誉分数公式/
      采纳率公开展示/角色分层如版主任命);(ii)半正式制度(社群显式约定如"@某人来裁决");
      (iii)非正式自然认知(重复互动中涌现的个人判断力口碑,无公式无任命)。
      (b)明确预测(iii)"无制度性信号维持→默认通胀"中的"制度性"涵盖(i)+(ii)还是仅(i)。
      (c)若仅(i):加入社群规模射程条件(如N≥1000活跃用户,自然认知无法有效运作),或
      承认小规模社群可通过自然认知(III)维持信号价值,构成对预测(iii)的限定。
      (d)若涵盖(i)+(ii):说明"半正式"的判据——"@某人来裁决"的惯例何时从非正式认知
      升格为半正式制度。

  should_fixes:
    - |
