    classification_granularity: |
      未命中(维持 round 1/2 结论)。三稳定类型(通胀/疲劳/专业化)+过渡态(混合型)的档位
      划分合理。operationalization 提供了每型的独立操作化判据:通胀型=Gini↑+高频采纳率↓;
      疲劳型=人均举报量↓+采纳率↑或稳;专业化型=Gini↑+高频采纳率不降或↑。过渡态的识别
      判据(Gini↑+高频采纳率↓+整体均值短期不变,需≥8季度确认极化)清晰且可操作。
