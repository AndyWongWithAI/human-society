    counterexample_hunt: |
      【Round 2 五路猎杀(四路复用 round 1+一路全新),均未获 scope 内净杀;一路
      (WETH hub)悬置 pending_measurement;一路(CLS+EBS 组合)强化了 round 1 猎路 1
      的"机制需收窄至无许可池创建"结论】

      === 猎路 2.1:WETH 在以太坊 DeFi 的枢纽地位——攻击预测(i)(ii),scope 内 ===

      【靶心:尽管 AMM 聚合器全面可用,WETH 仍是 Ethereum DeFi 的事实通用中介】
      以太坊 DeFi 生态具备 DED-048 的所有 scope 条件:(a)AMM 聚合器(1inch/Matcha
      /Paraswap)已运行 >=3 年,(b)无许可池创建(任何人可在 Uniswap V2/V3 创建任意
      代币对池),(c)多跳路由(聚合器自动在图 G(N,E)中找最优路径)。然而 WETH 仍
      是流动性深度最高的资产——多数代币对的最优路由经过 WETH 池(因为 WETH 池的
      流动性深度使滑点最低)。若测量 WETH 作为中介出现在非 ETH 代币对兑换路径中的
      比例 H_weth(1),可能 >0.7(即大多数路径仍经过 WETH 枢纽),且此比例在过去 3 年
      未显著下降。

      若是:直接挑战预测(i)(H_crypto 低)和(ii)(下降趋势)。

      消化分析:WETH 的高枢纽地位可能反映的是"流动性网络效应"而非"结算成本约束"——
      聚合器的路由算法选择经过 WETH 不是因为其他路径不存在,而是因为 WETH 池的
      流动性最深→滑点最低→最优路径。这与 DED-048 的"制度选择"叙事兼容(WETH
      作为枢纽是参与者'选择'的结果——他们选择在 WETH 池中提供流动性→WETH 成为
      最优路由枢纽),但挑战了"低结算成本自然导致低集中度"的预测——流动性网络
      效应在低结算成本下仍能维持甚至强化高集中度,这与 primary_suspect(网络效应
      压倒结算成本效应)的场景一致。

      判断:此案例的杀伤力取决于 WETH 的 H_weth(1)实测值。若 H_weth(1)>0.7 且
      无下降趋势→预测(i)(ii)被严重削弱,推论的核心贡献坍缩为 primary_suspect 已
      预见的"驱动力重新标记"场景。若 H_weth(1)<0.6 且有下降趋势→支持推论。
      → pending_measurement(与 Bitcoin 反例同质,但以太坊 DeFi 更贴合 scope)。

      === 猎路 2.2:CLS Bank+EBS/Reuters 组合——攻击"算法是结算成本降低的充要条件" ===

      【靶心:传统金融已通过 CLS(多币种同时结算)+EBS/Reuters(算法撮合)实现了显著
      的结算成本降低,但 USD 路径集中度未降】
      CLS Bank(2002 年上线)使 18 种货币可同时结算,消除了 Herstatt 风险(时区差导致
      的结算风险),大幅降低了多币种结算的时间成本和风险成本。结合 EBS/Reuters 的
      算法撮合(1990s 上线),传统外汇市场已具备"算法化+多币种结算基础设施"。但
      USD 参与一方的交易占比(BIS 数据)在 CLS 上线前后无明显变化(~88%)。

      消化:CLS+EBS 组合降低了结算成本,但缺乏两个关键要素:
      (a) 无许可池创建——货币对仍受限于做市商报价,普通参与者不能创建新的直接
      货币对流动性池;
      (b) 跨货币对多跳路由——EBS 优化的是单一货币对内的最优价格,而非跨货币对的
      全图路由(如 SEK→BRL 的最优路径是否应经过 USD 或 EUR 或直接)。

      结论:未净杀——CLS+EBS 进一步强化了 round 1 猎路 1 的发现:"算法"概念过于
      宽泛。真正使 DED-048 机制生效的不是笼统的"算法化",而是特定的"无许可池
      创建+多跳路由"组合。此发现支持将 scope 收窄显式化(should)。

      === 猎路 2.3(复用 round 1 猎路 1):外汇电子化交易 30 年未降 USD 集中度 ===

      Round 2 独立验证:round 1 的分析成立——EBS/Reuters 的算法撮合在预定义货币
      对集合内运行,不具备无许可池创建+多跳路由,DED-048 的 scope 应显式收窄。
      → 复用 round 1 结论:未净杀,但暴露 scope 收窄必要性。

      === 猎路 2.4(复用 round 1 猎路 2):稳定币三巨头共享同一记账单位 ===

      Round 2 独立验证:round 1 的分析成立——锚 2 应为 required fix #1。
      → 复用 round 1 结论:未净杀推论本身,但锚 2 的支持效力被严重削弱。

      === 猎路 2.5(复用 round 1 猎路 3+4):黄金+汉萨同盟 ===

      Round 2 独立验证:两项分析成立——黄金在不同功能域(价值储藏≠交换媒介),
      汉萨的结算成本确实高(定期清算≠低成本)。
      → 复用 round 1 结论:未净杀。

      综合:五路猎杀均未获 scope 内净杀反例。猎路 2.1(WETH)悬置 pending_measurement,
      猎路 2.2(CLS+EBS)进一步强化 scope 收窄的必要性。

    non_recurrence_of_ded004_007: |
      【Round 2 复核:DED-004(不可证伪循环)和 DED-007(测量轴焊死)均未复发;
      DED-008 不适用】

      DED-004:round 2 独立挤压三条 falsifiability 条件——(a)(b)有明确的统计
      判据+预注册口径+独立对照组,(c)有历史检验入口。证伪不依赖推论自身概念
      框架的重新解释。最强压力测试:若实测 H_crypto(1)≈H_forex(1)≈0.88,作者
      是否可以主张"这只是第一代 AMM,真正的算法路由还在路上"→此逃逸被
      anti_talisman(2)的 2 年窗口+趋势方向预锁定封堵。→ 未复发。

      DED-007:round 2 独立重新检查 IV-DV 测量链——IV(API 响应时间+计算复杂度)
      与 DV(链上交易笔数统计)在概念/操作/数据源三层均分离。最危险电位焊点:
      聚合器返回路径多样性是否受集中度反向影响——round 2 在 measurement_
      orthogonality 段分析了此问题,结论是存在形式多样性冒充实质多样性的风险
      (should,不到 DED-007 级焊死)。→ 未复发。

      DED-008:推论不涉分类穷举,红旗不适用。→ 不适用。

    required_fixes:
      - |
        [required - 转述 round 1 fix #1,未消解] 修正或移除 real_world_anchors
        第 2 条(稳定币 USDT/USDC/DAI 共存)的 interpretative 声称。当前文本将
        三者共存作为"多媒介并行的技术可行性"的支持证据——但三者均以 USD 为锚,
        共享同一记账单位,在货币层是同一媒介的三种技术实现。修复路径(二选一):
        (A)移除,(B)重新定性为"同一货币标准下多提供商可竞争性共存"(实现层而非
        货币层的多媒介并行),并诚实标注"此发现对货币层多媒介并行的证据价值需
        独立检验"。同时将 operationalization.limitations 中的"可能充当准通用媒介"
        改为确定的"三者共享同一记账单位(USD),不直接构成货币层多媒介并行证据"。
      - |
        [required - 转述 round 1 fix #2,未消解] 在 derivation 步骤 2 中显式区分
        寻径成本(path-finding cost)和执行成本(path-execution cost),并修正"结算
        成本坍缩至趋零"的声称。BR-L2-032 的搜索成本断崖直接覆盖的仅是寻径成本
        (在图 G(N,E)中找 A→B 最优路径的计算成本,毫秒级 Dijkstra/Bellman-Ford);
        执行成本(gas 费/滑点/MEV/跨链桥费)不因寻径速度而消失,由链上资源竞争+
        流动性深度+共识安全决定,BR-L2-032 未覆盖此成本类型。修正后诚实表述为:
        "BR-L2-032 将寻径成本压至趋零;执行成本是否也被压至足够低是一个独立
        经验问题,由 operationalization 的 cost ratio ≤2x 判据检验"。

    should_findings:
      - |
        [should - round 2 新增] 在 derivation 或 operationalization 中显式注册
        "无许可池创建+多跳路由"是机制生效的 scope 条件。Round 1 反例猎捕(外汇
        电子化交易 30 年)和 round 2 猎路 2.2(CLS+EBS 组合)共同揭示:仅"算法化"
        不足——需要"任何参与者可无许可地创建任意资产对的直接流动性池+算法可在
        全图中自动多跳路由"的组合。若无此收窄,外汇市场 30 年的算法撮合历史
        (EBS/Reuters 自 1990s)构成对"算法降低结算成本→集中度下降"的合法挑战。
        收窄后外汇市场不在 scope 内(无无许可池创建),挑战被消化。此收窄不改变
        推论的逻辑结构——AMM 聚合器网络(推论的实际 target 域)天然满足此条件。
      - |
        [should - round 2 新增] 在 derivation 步骤 2 的 intro 句中标注 BR-L2-032
        的置信度状态(weakly_verified,IEA=1.6),将当前行文"BR-L2-032 确立:算法
        将搜索/匹配/路径计算成本压低..."改为"BR-L2-032(weakly_verified,IEA=1.6)
        提供的证据表明:算法将搜索/匹配/路径计算成本压低..."。此修改使 derivation
        的修辞强度与依赖的置信度匹配,且不削弱推导的逻辑有效性(成本断崖的定性
        主张在 IEA=1.6 下已有合理支持,只是定量声称的精度受限)。
      - |
        [should - round 2 新增] 在 independent_cost_evidence 中增加补充判据:除
        "聚合器返回≥3 条不同路径"外,增加"且路径经过的不同枢纽资产数≥2",
        防止形式多样性(不同池子但同一枢纽资产)冒充实质多样性(不同枢纽资产)。
        此判据与 IV-DV 正交性无关,纯粹提高测量效度。
      - |
        [should - round 2 新增] 在 anti_talisman (3)的消化条件(b)中增加最小经济
        规模门槛:该低集中度网络的 TVL 或交易量需≥该生态总体的 5%,防止边缘
        网络冒充多币并行的经济可行性证据。此门槛与 anti_talisman (3)的逻辑结构
        兼容,仅提升统计推断的 rigor。
      - |
        [should - round 2 新增] 注册 cost ratio ≤2x 阈值的来源(事前经济推理 or
        惯例 or 任意但预注册+事后不得调整),以遵守 L4-009 判例的口径预注册要求。
        当前文件仅给出阈值的值(≤2x)和分子/分母(价差+手续费+滑点),未给出选择
        2x 而非 1.5x/3x 的理由。
      - |
        [should - round 2 新增] 在 anti_talisman (2)中明确——时间趋势检验
        (p<0.05)是优先于绝对值阈值(>0.7/<0.5)的判定准则;若趋势显著上升,不论
        绝对值是否跨过 0.7,"集中度分化"预测均被削弱。以此堵住趋势方向 vs
        绝对值阈值之间的裁决套利空间。
      - |
        [should - round 2 新增] 在 excluded_outcomes 第(3)条("没有算法时是否也
        存在过多币并行")中标注此排除可被 falsifiability(c)击穿,以防排除钩子
        与证伪条件之间可能的"剪刀门"——同一案例(前数字低成本低集中度网络)
        同时触发"排除"(此为不同机制)和"证伪"(归因被削弱),裁决方向冲突。
      - |
        [should - 转述 round 1 should #2,未修补] 在 2x2 判据表的(高成本,低集中)
        格中标注历史例外(如汉萨同盟的定期集中清算机制),并说明此例外依赖额外的
