id: ADV-REVIEW-053
type: adversarial_review
reviews: DED-048
layer: L3-deductions

人话摘要: |
  对 DED-048(算法结算成本×通用媒介收敛:从技术必然到制度选择)的 round_1 独立对抗审查。
  裁 needs_revision:核心交互增量("结算成本坍缩→收敛从技术必然退化为制度选择")是
  BR-L2-012×BR-L2-032 的真跨砖合成,不在任何单块承重砖中,操作化诚实(三条可检验预测+
  强 anti-talisman clause+多口径预注册),但 2 条 required 缺陷(稳定币锚将实现层多样误作
  货币层多样/推导映射将寻径成本等同于结算总成本而未区分执行成本) + 2 条 should 挡在
  verified 门前。反例猎捕(外汇电子化交易 30 年未降 USD 集中度)未获净杀但暴露了机制从
  "算法路由"收窄至"无许可池创建"的必要性。未重蹈 DED-004/007 致命循环。

target: DED-048
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者无关)。评分卡红旗 13 条
  逐项攻+反例猎捕(必做)+DED-004(不可证伪循环)/DED-007(测量轴焊死)复发检查。
  裁决三态照评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活反例
  ③未重蹈 DED-004/007。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新独立上下文, 与作者无关)"
  verdict: needs_revision
  verdict_note: |
    这是一条【核心交互增量属真跨砖合成、操作化诚实、但两条结构性缺陷挡在 verified 门前】
    的候选推论。BR-L2-012(多边结算成本→通用媒介)不含"成本坍缩后收敛是否逆转";
    BR-L2-032(算法成本断崖)不含"货币收敛动力学"。两砖合力产出的"当结算成本坍缩时,
    收敛从技术必然变为制度选择"是真组合增量——不在一砖中,甚至不在两砖的平凡并置中
    (两砖并置只给出"算法降低了某些成本",不给出"这恰好削弱了通用媒介的结算成本优势")。

    推论的强项:
    (1) 非平凡性论证清晰——2×2 判据表的(低成本,低集中)格是核心非平凡格,既不被
    BR-L2-012 强制(它只讨论高成本→高集中),也不被 BR-L2-032 强制(它不涉货币集中度)。
    (2) 操作化诚实——三条预测(i)(ii)(iii)的证伪条件(a)(b)(c)给出具体统计判据、
    预注册时间窗口、对照组设定。falsifiability 的(c)甚至主动设了一个可从历史侧击穿
    推论的入口(前数字低结算成本低集中度网络)。
    (3) Anti-talisman clause 强劲——三条硬约束覆盖了"用结果反推编码""事后调整时间窗口"
    "消化条件对称保护"三类逃逸路线,且消化门(anti-talisman 3)设有硬止损:若所有低结算
    成本网络均高集中度→消化失效。
    (4) 自认最弱腿准确——primary_suspect(网络效应压倒结算成本效应)和 secondary_suspect
    (BR-L2-032 IEA=1.6 + AMM 路由引入新成本)是真实弱点,覆盖到位。
    (5) 口径预注册完整——H(k)的分母(总兑换笔数非金额)、枢纽排序(按中介频次非预设)、
    成本比阈值(≤2x)均已一次性注册,未违反 L4-009 判例的事后口径选择禁令。

    两条 required 缺陷:

    (1)【稳定币锚(USDT/USDC/DAI)将实现层多样误作货币层多样(required)】
    文件将 USDT/USDC/DAI 的竞争性共存作为支持"多媒介并行"的现实锚(re al_world_anchors
    第 2 条)。但三者均为美元挂钩稳定币——它们共享同一记账单位(USD),差异仅在实现层
    (发行人/抵押机制/监管状态),不在货币层(价值尺度/交换媒介)。这三种稳定币的共存
    证明的是"同一货币标准下的多提供商竞争",而不是"多种货币媒介的并行流通"——
    前者是支付基础设施层的现象,后者才是本推论的核心主张(多币并行而非收敛到单一
    媒介)。若此锚未修正,读者可能被误导以为存在"多种独立货币共存"的经验证据,
    而实际上 USD 作为记账单位已经完成了收敛——稳定币只是 USD 的不同技术包装。
    作者在 limitations 中已触及此问题("稳定币作为事实上的计价单位可能充当'准通用
    媒介'"),但该警示出现在 operationalization 的 trading_path_concentration.limitations
    中(距离 real_world_anchors 的 supporting 条目约 100 行),且措辞为"可能充当"
    (保留不确定性)而非诚实确认"三者共享同一记账单位,不构成独立货币的多媒介并行"。
    → 此为事实层错误:将同一记账单位的三种实现误标为三种独立货币媒介的并行证据。
    不修则推论的实证支持被系统性地高估(稳定币是推论的唯二 supporting anchor)。

    (2)【推导将寻径成本等同于结算总成本,未区分路径计算与路径执行(required)】
    推导步骤 2 的核心推理:"算法时代通过图算法+AMM 流动性池在毫秒级完成全图路由→
    任意资产对之间的兑换从'需要通用媒介做中介'变为'算法自动找最优路径'"。此映射
    将 BR-L2-032 的搜索成本断崖(信息检索:小时→亚秒,4-5 数量级)直接等同于多边
    结算成本断崖,但多边结算包含两个性质不同的成本组分:
    (a) 寻径成本(path-finding):在图 G(N,E)中找到 A→B 的最优兑换路径——这确实是
    图算法(Dijkstra/Bellman-Ford 变体)可在毫秒级完成的计算,对应 BR-L2-032 的搜索
    成本断崖。
    (b) 执行成本(path-execution):实际沿路径执行多跳兑换所涉及的费用——包括各跳
    的 gas 费(以太坊 L1 单笔 swap ~$5-50)、滑点(流动性浅的池子滑点可>1%)、
    MEV(三明治攻击等矿工可提取价值)、跨链桥费用(若路径跨 L2/侧链)。这些成本
    不因寻径算法的速度而消失——它们由链上资源竞争(区块空间)+流动性深度+共识
    安全模型决定,与"图算法毫秒级"无关。
    后果:推导声称"结算成本坍缩至趋零"——但真正趋零的只是组分(a)寻径成本,
    组分(b)执行成本在 2026 年的以太坊生态中远非趋零(多跳路由的累计 gas+滑点
    可轻易超过单跳通过枢纽资产的成本)。当且仅当执行成本也足够低(使多跳路径的
    总成本与单跳枢纽路径之比≤2x)时,推导的核心主张("通用媒介的结算成本优势被
    消解")才成立。secondary_suspect 已诚实标注了此问题("AMM 路由本身引入新成本
    (滑点/gas 费/MEV)"),但这一诚实标注未反向传播至推导步骤 2——步骤 2 的行文
    仍将"毫秒级路由"等同于"结算成本消失"。
    → 此缺陷不使推论 rejected(operationalization 中 cost ratio≤2x 判据提供了经验
    闸门,可在实证层过滤掉执行成本过高的网络),但推导的理论层声称(结算成本断崖=
    BR-L2-032 的直接映射)需要修正——推导应显式区分寻径成本和执行成本,并明确:
    BR-L2-032 直接覆盖的仅是寻径成本,执行成本是否也被压至足够低是一个独立的
    经验问题(由此前的 cost ratio≤2x 判据检验)。

    综合:非 rejected(核心增量属实、操作化诚实、anti-talisman 强劲、反例猎捕未获
    净杀、无 DED-004/007 致命循环)。两条 required 修复定向可救活 → needs_revision。

  red_flag_findings:
    brick_conclusion: |
      【未命中——核心增量不在任何单块承重砖中,属真跨砖合成】

      按任务指定的两块承重砖逐字核:

      BR-L2-012(多边结算成本催生通用媒介,verified,IEA=1.9):
      原文含:多边结算的记账/清算成本 O(N²)→通用媒介压缩为 O(N);机制独立于
      D1(物物匹配)和 D2(匿名);战俘营实证(匹配易+记忆在场但多边→仍生通用媒介)。
      原文不含:"成本坍缩""逆过程""制度选择""网络效应在低结算成本下的表现"
      "算法""AMM 聚合器""路径集中度"。BR-L2-012 的机制是单向的(成本高→媒介),
      不回答成本降低后媒介是否退化——其 falsifiability 也仅测试"是否总有媒介涌现"
      和"涌现是否与多边度相关",不测试"低结算成本下多媒介是否并行"。
      → 不构成 brick=conclusion。

      BR-L2-032(算法交易成本断崖,weakly_verified,IEA=1.6):
      原文含:搜索成本 4-5 数量级下降(信息检索)、匹配成本 ~1.4x 经济改善+10000x
      规模跨度(平台调度)、监控成本 ~10x 下降(声誉系统);三维度降幅因度量口径而异
      不共享统一数量级;成本断崖使原本不可行的交易变得可行;不声称"质变"(那是
      BR-L2-025 的射程)。
      原文不含:"货币""结算""通用媒介""AMM""兑换路径""路由""收敛""集中度"
      "网络效应""制度惯性"。BR-L2-032 覆盖的是信息检索/平台匹配/声誉监控三类
      交易成本,不特定于货币兑换——它没有讨论"如果搜索成本断崖应用于货币兑换
      路由会怎样",更未涉及"这会削弱通用媒介的结算成本优势"。
      → 不构成 brick=conclusion。

      两砖合力检查:BR-L2-012 给出"为什么高成本迫使收敛"(单向),BR-L2-032 给出
      "算法把某些成本压低了"(跨域事实)。两砖中无一砖给出"(a)成本断崖恰好作用于
      多边结算这一特定成本类型,(b)该作用的幅度足以消解通用媒介的结算成本优势,
      (c)消解后的收敛动力学由网络效应/制度惯性接管"。这三个焊接步骤构成 DED-048
      的非平凡内核,不在任何单块承重砖中。

      窄化检查:未发现为 DED-048 专属窄化的"定制砖"。两承重砖均服务于更广的
      推论网络(BR-L2-012 被 DED-007/DED-027 等引用,BR-L2-032 被 DED-035/DED-036
      等引用)。

      → 红旗未命中。brick≠conclusion,通过。

    nontriviality_cell_check: |
      【通过——核心非平凡格(低成本,低集中)是真交互预测,不被任何单砖平凡强制】

      2×2 判据表(自变量档:多边结算成本[高/前算法 vs 低/算法时代] × 被预测量档:
      交易路径集中度[高/H(1)>0.7 vs 低/H(1)<0.5]):

      逐个空格检验:

      格(高成本,高集中)——「平凡」:
      BR-L2-012 直接预测:多边结算成本高→参与者被迫使用通用媒介→交易路径必然集中。
      外汇市场 USD 中介占比 ~88% 是此格的直接实例。任何包含 BR-L2-012 的推理都
      预测此格。→ 平凡(被 BR-L2-012 单独强制)。

      格(高成本,低集中)——「物理不可能·预测为空」:
      作者声称此格为空——人脑/人工记账无法在 O(N²) 复杂度的结算网中维持低路径
      集中度。此格的"空"本身是 BR-L2-012 的经验基础(正因为此格为空,通用媒介才
      必然涌现)。此格不被 DED-048 独立预测——它是 BR-L2-012 的逻辑推论。
      → 平凡(被 BR-L2-012 单独强制为空)。

      格(低成本,高集中)——「可能·削弱推论但不推翻」:
      BR-L2-012 不预测此格(它不讨论"低成本时集中度如何")。BR-L2-032 不预测此格
      (它不讨论货币集中度)。此格可能被填充(网络效应+制度惯性在低结算成本下仍
      驱动高集中度)→若被大量填充,推论的定量预测(集中度下降)被掏空,但定性主张
      ("是选择不是必然")仍成立。→ 非平凡(需要两砖合力才能判断此格是否非空)。

      格(低成本,低集中)——「非平凡格·核心预测」:
      这是 DED-048 的独有预测——两砖合力给出:BR-L2-032 的结算成本断崖消解了
      BR-L2-012 的结算成本驱动→低结算成本下,网络效应不足以维持单极集中(因为
      切换成本低)→路径集中度下降。此格不被任何单砖强制:BR-L2-012 不讨论"低成本
      时集中度如何",BR-L2-032 不讨论"成本断崖对货币集中度的影响"。
      → 非平凡(需要两砖合力,是核心增量)。

      平凡化抽检:抽掉"成本坍缩消解通用媒介的结算成本优势"这一焊接步骤后,
      推论坍缩为"算法让多币兑换更方便"——正是 BR-L2-032 在货币领域的平凡应用。
      推论的 non-triviality 完全依赖焊接步骤的存在。作者在 discriminant_validity
      的"防平凡化守卫"段对此有清醒认识→通过。

      综合:核心非平凡格(低成本,低集中)是真交互预测。空格不被强制填充。
      → 红旗通过。

    measurement_orthogonality: |
      【主干正交——IV(结算成本)与 DV(路径集中度)测量链概念层与操作层均分离;
      未重蹈 DED-007 级焊死】

      IV(自变量)——多边结算成本:
      测量操作化:两个代理指标——(a)时间成本:端到端兑换耗时(聚合器 API 响应时间
      <500ms);(b)复杂度成本:最优兑换路径的计算复杂度 O(N²),算法可在毫秒级穷举
      全图。两条指标均独立于集中度测量:API 响应时间测量不涉及 hub 资产识别,
      计算复杂度分析不涉及交易量分布。
      → 测量源独立于 DV。

      DV(被预测量)——交易路径集中度:
      测量操作化:H(k)=通过前 k 个枢纽资产的交易笔数/该网络总兑换笔数。分子
      (通过枢纽的交易笔数)和分母(总兑换笔数)均来自同一数据源(链上数据或 BIS 调查),
      但枢纽资产的识别规则(按中介频次排序)和 H(k)的分子/分母计算不涉及结算成本
      的测量(API 响应时间/计算复杂度分析)。
      → 测量源独立于 IV。

      与 DED-007 对比:DED-007 的致命焊点是"分母用实际获授者"——IV 的概念定义
      (谁应获授)在测量层依赖于 DV(谁实际获授了),导致测量轴焊死。本案的 IV
      (结算成本)在概念定义(计算复杂度+端到端时间)和测量层(API 响应+复杂度分析)
      均可与 DV(集中度=枢纽笔数/总笔数)完全分离。两条测量链在概念层、操作层、
      数据源层均分叉。

      潜在薄弱点(不到 DED-007 级):
      (a) 时间成本受物理延迟(区块链出块时间 ~12s/SWIFT 报文时间)污染→代理指标的
      信度有限,但此污染方向与 IV 的定义正交(不会造成"集中度低→测出结算成本低"
      的循环)。
      (b) 聚合器"返回≥3条不同路径"作为"结算成本低"的判据——若聚合器算法倾向于
      返回多样化路径(即返回路径多样性是产品特性而非结算成本低的自然结果),则此
      判据可能高估了路径多样性的经济意义。→ should 级,非 required 级。

      → 主干正交。未重蹈 DED-007。

    scope_hook_independent_of_result: |
      【合规——三条 excluded_outcomes 均基于可事前独立识别的渠道/边界特征】

      逐一核查:

      (1) "加密货币完全取代法币成为全球主导货币":
      排除理由:本推论预测多币并行在技术上可行,不预测任何特定货币胜出。排除
      基于 scope 区分(收敛模式 vs 具体胜出者)——可事前识别,非按结果开脱。
      → 合规。

      (2) "具体哪几种货币会共存":
      排除理由:本推论的射程是收敛模式(必然 vs 选择),不是共存货币的具体构成——
      后者取决于监管/地缘/技术等多重因素。排除基于构念边界(模式 vs 构成),
      可事前识别。→ 合规。

      (3) "没有算法时是否也存在过多币并行":
      排除理由:前现代多币并行(如金银复本位)受限于物理结算成本(需实际运送金属),
      与算法驱动的低结算成本多币并行在机制上不同。排除基于机制差异——可事前
      识别(物理结算 vs 算法路由)。→ 合规。

      三条排除钩子均不依赖"结果不利于推论时才启用"的事后逻辑→射程/排除钩子合规。

    criterion_tier_match: |
      【should——H(1)阈值存在 0.5-0.7 的灰色地带,该地带内推论既不被确认也不被
      证伪,构成无意的保护缓冲区】

      2×2 的集中度分档:H(1)>0.7=高集中,H(1)<0.5=低集中。0.5-0.7 的区间落在
      两档之间——在此区间内,预测(i)的检验判定不明确:集中度"不显著低于"传统
      外汇市场的 0.88(若 H_crypto 在 0.6-0.7),但也不满足"高集中"(>0.7)的定义。

      此灰色地带对推论有利:若实测 H_crypto(1)落在 0.5-0.7 之间,作者可主张
      "虽未达低集中度阈值但趋势方向正确"或"需要更长时间窗口"——而这恰是
      anti-talisman (2)试图禁止的"事后调整时间窗口"的变体。文件未注册 0.5-0.7
      区间的裁决规则。

      被预测量是连续量(H(k)是连续比例),预测(i)是比较静态(H_crypto < H_forex),
      但非平凡性检验(nontriviality_test)使用二分档(>0.7 vs <0.5)。二分档服务于
      判空表的可视化清晰性,不应绑架实证检验的判定标准。→ should:注册 0.5-0.7
      灰色地带的裁决规则——例如"若 H_crypto(1)∈[0.5,0.7]且 H_crypto(1)与
      H_forex(1)=0.88 的差异在 bootstrap CI 下显著→仍算支持(i);若差异不显著→
      (i)未被坐实,但不单独证伪推论(需联合(b)的趋势检验判定)"。

    anti_talisman_cashed: |
      【在位但存在结构性不对称——存在性是低门槛(一个网络即可),使高集中度网络
      总能以"制度约束"消化;此不对称已被 anti-talisman(3)的硬止损部分约束】

      三条硬约束逐条压力测试:

      (1) "判定'收敛是制度选择而非技术必然'时:必须独立于结果测量":
      作者给出两个独立锚:AR-1(API响应<500ms+路径数≥3→结算成本低)和 AR-2
      (时间趋势检验→集中度是否下降)。两个锚均独立于"集中度是否下降了"来测出
      "结算成本是否低了"。此约束在位且可操作。→ 在位。

      (2) "判定'多币并行是可持续生态'时:必须预设时间窗口(≥2年)":
      一次性注册,明确禁止在集中度上升时说"还在收敛中"、在集中度下降时说"已进入
      选择模式"。时间方向的事前锁定阻止了最常见的反推逃逸。→ 在位。

      (3) "反例消化门":
      消化条件分两层:(a)需证明高集中度网络存在制度约束压制了低集中度的技术
      可能;(b)消化仅当存在至少另一个制度约束较弱的网络呈现低集中度时成立;
      (c)若所有低结算成本网络均呈现高集中度→消化失效。
      此约束的硬止损((c))是真实保护。但存在性要求(只需一个低集中度网络即可
      激活消化)在实操中门槛较低——在数千个加密网络中几乎总能找到至少一个符合
      条件的。这不是逻辑缺陷(存在性主张天然门槛低),但需注意:若唯一低集中度
      网络是微小/边缘生态(如某条 TVL<$10M 的链),其证据权重可能不足以支撑
      "多币并行在技术上可行"的经济意义(技术上可行≠经济上可行——一个大学生
      的课后项目也可证明"技术可行",但不证明该模式可在有经济意义的规模上运行)。
      → 在位(硬止损有效),但 should 标注上述证据权重问题。

    anchor_fact_check: |
      【无致命事实错,但稳定币锚(anchor 2)存在事实层误标——将同一记账单位的
      三种实现误作三种独立货币媒介的并行证据(required)。AMM 路由锚(anchor 1)
      的"初步证据"诚实标注,外汇市场的 BIS 数据事实正确】

      逐个核查:

      (1) AMM 聚合器路径集中度 vs 外汇市场 USD 中介占比:
      - BIS 2022:USD ~88% 参与一方所有外汇交易→H(1)≈0.88——事实正确,来源可靠。
      - 过去 20 年稳定在 85-90%——事实正确。
      - Crypto AMM 聚合器路由多样性:作者标注"初步证据"(preliminary evidence)
      且 confidence=moderate——诚实。但具体声称"非 ETH/USDC 枢纽的路径占比显著"
      和"路径选择随时间增加"缺乏定量引用(未给出具体 H(k)数字或趋势检验结果)。
      → 方向性声称无事实错,但 quantitative 内容不足以支撑 confidence=moderate
      向 moderate-high 的上行(作者给的 moderate 是合理上限)。→ should:若后续
      轮次可补充具体数字(哪怕是一个快照的 H(1)/H(3)估算),confidence 可从
      moderate 调至 moderate-high。

      (2) 稳定币 USDT/USDC/DAI 的竞争性共存:
      - USDT 和 USDC 双头垄断稳定币市场——事实正确。
      - DAI(去中心化超额抵押)与 USDC/USDT 共存——事实正确。
      - 三者切换成本极低(AMM 中一键兑换)——事实正确。

      但核心 interpretative 声称——"进一步证明了多媒介并行的技术可行性"——存在
      事实层误标。USDT、USDC、DAI 三者均以 USD 为锚定目标(1:1 挂钩美元),共享
      同一记账单位。它们在货币层是同一媒介(美元)的三种技术实现(不同的发行人/
      抵押机制/监管状态),而非三种独立的货币媒介。将它们作为"多媒介并行"的证据,
      等价于将"同一家银行提供三种不同类型的 USD 账户(活期/储蓄/定期)"作为
      "多货币并行"的证据——混淆了实现层多样性(支付基础设施)和货币层多样性
      (记账单位/价值尺度)。

      三者的共存证明的是:在单一记账单位(USD)下,多个技术提供商可以竞争性共存
      而不必然一家吃掉另一家。这是一个有意义的经验发现,但它支持的是"支付基础
      设施层的多提供商竞争"而非"货币层的多媒介并行"——后者才是本推论的核心
      主张(不同记账单位/独立货币的并行流通)。

      作者在 operationalization.trading_path_concentration.limitations 中触及了
      此问题:"稳定币(USDC/USDT)作为事实上的计价单位可能充当'准通用媒介'"——
      但此警示(a)使用了保留不确定性的措辞"可能",(b)距离 real_world_anchors 的
      supporting 条目约 100 行,读者不易关联,(c)未撤回 supporting anchor 中
      "多媒介并行的技术可行性"的解释性声称。

      → 此为事实层错误:将同一记账单位的三种实现误标为三种独立货币媒介的并行
      证据。不修则推论的实证支持被系统性地高估(此锚是唯二 supporting anchor 之一)。
      → required。

      (3) boundary_cases:CBDC 互操作性(mBridge):
      此案例为边界/前瞻案例,非 supporting anchor。分析框架诚实——明确了两种可能
      结果及其对推论的涵义。无事实错。
      → 合规。

      (4) counterexamples:Bitcoin 枢纽地位:
      自报反例分析诚实——区分了 BTC 作为"储备资产/计价单位"(网络效应→选择叙事
      可消化)和 BTC 作为"结算中介"(出现在路由路径中→构成反例)。status 诚实标为
      pending_measurement。无事实错。
      → 合规。

    definition_vs_prediction: |
      【通过——核心预测(i)(ii)(iii)均为可证伪的经验主张,关键条件为可事前测量的
      操作化判据,非定义性同义反复】

      三条 falsifiability 条件逐条复核:

      (a) 若 H_crypto(1)与 H_forex(1)无统计显著差异(均>0.8)→预测(i)被推翻。
      此条件给出了清晰的统计判定标准(显著差异检验)、具体的测量口径(H(1)的
      分子/分母已预注册)、和独立的对照组(传统外汇市场 BIS 数据)。证伪条件不依赖
      于"低集中度"的循环定义——H(1)是交易路径的统计特征,独立于"为何路径如此"
      的理论解释。→ 可证伪。

      (b) 若算法交易网络的路径集中度随时间显著上升(running 趋势检验 p<0.05,
      窗口≥2年),向传统外汇市场的集中度水平收敛→预测(ii)(趋势分化)被推翻。
      此条件给出了统计量(趋势检验 p<0.05)、时间窗口(≥2年)、和收敛方向
      (向外汇集中度水平收敛)。证伪条件不依赖理论预设——即使作者主张"这是过渡态",
      anti-talisman(2)已锁定 2 年窗口,趋势方向的事后重新解释被禁止。→ 可证伪。

      (c) 若找到一个前数字时代的、多边度高但结算成本低的多资产交换网络,其路径
      集中度仍很低→归因(算法成本断崖是使能条件)被削弱。此条件给出了历史检验
      入口——若有历史学家发现某贸易体系(如中世纪汉萨同盟的多币清算网络)在无
      算法辅助下维持了低路径集中度→推论的归因被挑战。条件给出了清晰的逻辑结构
      (前数字+低结算成本+低集中度→削弱归因)。→ 可证伪。

      关键条件检查:"结算成本低到多币并行在技术上可行"被操作化为 cost ratio≤2x
      (多跳路径成本/单枢纽路径成本)——此条件可事前独立于集中度测量(cost ratio
      只涉及兑换成本,不涉及枢纽频次统计),非"若集中度低则结算成本必低"的循环。
      Anti-talisman(1)进一步锁死此方向:判定结算成本低的两个锚(API 响应时间/路径
      数量)独立于集中度。

      → 条件是可证伪的预测,非定义。通过。

    enumeration_and_species: |
      【不命中——推论不声称穷举任何类别/物种。】

      DED-048 的核心主张是连续变量间的比较静态(结算成本变化→集中度变化),非
      "N 类某种现象可穷举"的类型学言说。红旗 9(DED-008 死因)不适用。

      无需主动猎第 N+1 类——推论不涉及分类穷举。

      → 红旗不适用。

    primary_suspect_aim: |
      【指对了——自认最弱腿(网络效应压倒结算成本效应)准确覆盖了推论的 Achilles
      heel;平凡化检查通过;有一条隐腿(灰色地带的裁决真空)未被认领(should)】

      文件自认:
      - primary_suspect:网络效应压倒结算成本效应的可能性——若网络效应使低结算
      成本下集中度仍>0.7,推论降格为"驱动力的重新标记"→准确。
      - secondary_suspect:BR-L2-032 的 cost cliff 量级(IEA=1.6)+AMM 路由引入
      新成本(滑点/gas/MEV)→准确。
      - unlikely_suspect:BR-L2-012 核心机制(verified,IEA=1.9)→合理。

      三条 self-identification 方向准确。primary 和 secondary 都是真实弱点。

      隐腿检查(文件未认领但可能更致命):
      (a) 灰色地带的裁决真空(见 criterion_tier_match):若 H_crypto(1)落在 0.5-0.7
      之间,推论的预测(i)无法被干净判定——这是一个结构性保护缓冲区,文件未注册
      此区间的裁决规则。→ should 认领。

      (b) BR-L2-032 到结算路由的映射跨度:BR-L2-032 的搜索成本断崖(信息检索)
      到"AMM 路由寻径"的映射是否需要独立的经验桥接?文件在 secondary_suspect
      中部分触及(成本降幅可能仅为 100-1000 倍而非 10000+倍),但未将这标识为一个
      独立的承重步骤(需要"BR-L2-032 的搜索成本断崖适用于货币兑换路由这一特定
      计算问题"这一中间命题)。→ 此问题已在 required fix #2 中覆盖。

      平凡化检查:
      抽掉三个非平凡增量((a)结算成本坍缩消解通用媒介的优势,(b)收敛从必然退化
      为选择,(c)预测集中度差异+趋势分化)后,推论坍缩为"算法让多币兑换更方便"——
      这是 BR-L2-032 在货币领域的平凡应用。推论的 non-triviality 完全依赖三步焊接。
      自认的 primary_suspect 准确 cover 了最可能使推论坍缩为平凡的路径(网络效应
      使集中度仍高→非平凡核被掏空)。

      → primary_suspect 指对,有隐腿(should)。平凡化检查通过。

    data_source_common_root: |
      【不命中——推论的实证锚不依赖经济统计数据的多源交叉验证】

      本推论的主要数据源:BIS 三年期外汇调查(独立于任何国家统计机构)、链上公开
      交易数据(无需经过 CNBS/WB/IMF)、聚合器路由日志(独立数据通道)。这些数据源
      的采集方法和机构各自独立,不存在 CNBS 工具实证中发现的"WB/IMF 以 CNBS 国家
      账户为底层输入"的同根问题。

      → 红旗不适用。

    api_epistemology_confusion: |
      【不命中——推论不涉及将 API 可及性冒充认识论独立性】

      本推论的操作化不涉及通过多路 API 查询同一底层数据源来构建虚假的"多源验证"。
      independent_test 段明确注册了两条独立测量链(API 响应时间+链上数据),不依赖
      同一数据的多 API 包装。

      → 红旗不适用。

    caliber_registration: |
      【通过——关键阈值和测量口径已一次性注册,未违反 L4-009 判例的事后口径选择
      禁令;但 H(1)的灰色地带(0.5-0.7)裁决规则未注册(should)】

      逐一核查:

      (1) H(k)的口径注册:
      - 分子:通过前 k 个枢纽资产的交易笔数。
      - 分母:该网络中的总兑换笔数(非金额,避免巨鲸扭曲)。
      - 枢纽排序:按该时间窗口内的中介频次排序,不预设哪几个是枢纽。
      → 分子/分母/排序规则一次性注册,明确排除"按金额加权"的替代口径→合规。

      (2) 成本比阈值的口径注册:
      - 多跳路径成本/单枢纽路径成本之比≤2x。
      - 成本定义:价差+手续费+滑点(已在 operationalization 中注册)。
      → 阈值(2x)和分子/分母(成本组分)均已注册→合规。

      (3) 时间窗口的注册:
      - 收敛_regime 判据(iii):持续运行≥1年。
      - 趋势检验窗口:≥2 年连续数据。
      - 作者诚实标注 1 年窗口的任意性(limitations)→合规但不完美。

      (4) 灰色地带(0.5-0.7)的裁决规则:未注册。
      当前 nontriviality_test 的二分档(>0.7 高,<0.5 低)与预测(i)的比较静态
      (H_crypto < H_forex)之间存在张力——若实测 H_crypto(1)=0.6-0.7,它不满足
      "高集中"(作者定义的 >0.7)也不满足"低集中"(作者定义的 <0.5),但可能
      与 H_forex(1)=0.88 存在统计显著差异。此灰色地带内的裁决规则未注册——
      作者未说明:在此区间内,预测(i)是"被支持"(若与 0.88 显著不同)还是
      "未被坐实"(若未跨过 0.5 的"低集中"阈值)?
      → should:注册 0.5-0.7 区间的裁决规则。

      综合:关键口径已注册,未违反 L4-009 判例。should 标灰色地带裁决规则缺失。

  counterexample_hunt: |
    【四路猎杀,均未获 scope 内净杀反例;一路(外汇电子化交易 30 年)暴露了机制需
    从"算法路由"收窄至"无许可池创建"的必要性(required 关联);一路(稳定币锚)
    已转为 required fix #1】

    === 猎路 1:外汇电子化交易 30 年未降 USD 集中度——攻击预测(i)的归因 ===

    【靶心:EBS/Reuters Matching 引入算法撮合后,USD 中介占比仍 ~88%】
    外汇市场自 1990s(EBS 于 1993 年上线,Reuters Matching 于 1992 年)已引入电子化
    算法撮合:订单自动匹配、最优价格发现、多银行报价聚合——这些系统在功能上
    是"算法的"(自动撮合/最优路径/实时计算交叉汇率)。BIS 三年期数据覆盖了从
    电子化早期(1990s)至今(2022)的完整窗口:USD 参与一方的交易占比稳定在
    85-90% 区间,无显著下降趋势。

    表面杀伤逻辑:若"算法降低结算成本→路径集中度下降"的机制是普适的,外汇
    市场在引入算法撮合后应观测到集中度的下降趋势——但 30 年数据未显示此趋势。
    这表明:算法撮合+传统市场结构(受监管的货币对/做市商制度)不足以产生路径
    分散化——机制的关键可能不在"算法路由"本身,而在"无许可池创建"(任何人
    可在 AMM 中创建任意代币对的流动性池)。

    消化分析:此案例不构成 scope 内净杀,因为:
    (i) 外汇市场的算法撮合在预定义的货币对集合内运行(主要由做市商报价的
    数十个主要货币对),交易者不能像在 AMM 中那样无许可地创建新的直接交易对。
    (ii) 电子经纪系统(EBS/Reuters)优化的是"给定货币对内的最优价格",而非
    "跨货币对的最优路由"——前者聚焦于单一货币对的流动性聚合,后者是 DED-048
    机制的核心(通过多跳路径绕过枢纽)。
    (iii) 外汇市场的做市商制度和资本管制构成了额外的制度约束,与 anti-talisman(3)
    的消化条件(a)一致——高集中度可能反映制度约束而非技术约束。

    关键启示:此案例表明 DED-048 的核心机制应更精确地表述为"无许可池创建+
    算法多跳路由"而非笼统的"算法路由"。若仅说"算法降低了结算成本",外汇
    电子化交易构成有力挑战(它证明'某种'算法化并未降低集中度)。若精确表述为:
    "当任何参与者可以无许可地创建任意资产对的直接流动性池,且算法可在全图中
    自动路由时,收敛从技术必然变为制度选择"——则外汇市场不在 scope 内(不存在
    无许可池创建),不构成反例。

    → required 关联:derivation 步骤 2 的措辞"算法时代通过图算法+AMM 流动性池
    在毫秒级完成全图路由"已隐含了 AMM=无许可池创建,但未将此外显为机制的必要
    条件。建议在 derivation 或 operationalization 中显式注册"无许可池创建"是
    机制生效的 scope 条件——否则"算法"一词过于宽泛(覆盖了 EBS/Reuters 等
    未降低集中度的算法系统)。

    【结论:未净杀——消化成立(外汇市场缺乏无许可池创建,不满足 scope 条件)。
    但暴露了"算法路由"概念过于宽泛→需收窄为"无许可池创建+算法多跳路由"。】

    === 猎路 2:稳定币三巨头共享同一记账单位——攻击 anchor 2 的有效性 ===

    【靶心:USDT/USDC/DAI 均以 USD 为锚,三者的"共存"不证明多货币并行】
    详见 anchor_fact_check (2)的分析。三者在货币层是同一媒介(美元)的三种技术
    实现,非三种独立货币媒介。它们的共存证明的是"同一货币标准下多提供商可
    竞争性共存"——这是支付基础设施层的现象,非货币层的多媒介并行。

    【结论:未净杀推论本身,但 anchor 2 的支持效力被严重削弱——已转为 required
    fix #1。】

    === 猎路 3:黄金在低技术时代的持久通用媒介地位——攻击"算法是收敛→选择的前提" ===

    【靶心:黄金作为通用媒介持续数千年,其地位在算法出现前后均未被动摇】
    黄金在 19 世纪(国际金本位)、布雷顿森林体系(1944-1971)、以及当代(央行
    黄金储备)持续充当通用媒介/价值储藏。黄金的通用媒介地位在"无算法"时代
    建立(金本位),在"算法时代"延续(至今仍是央行储备资产、ETF 交易活跃)。
    若"算法使多媒介并行技术可行→收敛退化为选择",黄金应是最可能被"算法
    多媒介并行"淘汰的通用媒介(它物理笨重、储存成本高、不适合算法路由),
    但黄金的地位并未显著下降。

    消化分析:黄金不在 scope 内——DED-048 的机制适用于存在 AMM/DEX 聚合器的
    链上多资产交易网络,黄金是物理资产,不在此网络中交易(黄金 ETF 在传统
    交易所交易,非链上 AMM)。此外,黄金的通用媒介地位主要体现为价值储藏
    (store of value)而非交换媒介(medium of exchange)——当代经济中几乎无人
    用实物黄金进行日常交易,后者才是 DED-048 的结算/路由机制的适用场景。

    【结论:未净杀——黄金现象与 DED-048 处于不同功能域(价值储藏 vs 交换媒介)
    和不同技术域(物理资产 vs 链上资产)。但提醒:若推论的 scope 仅限于"链上
    AMM 网络",其对更广义的"货币收敛动力学"的贡献需更谦虚地表述。】

    === 猎路 4:前数字高多边低结算成本网络——攻击 falsifiability (c) ===

    【靶心:汉萨同盟的中世纪多币清算网络】
    汉萨同盟(12-17 世纪)连接了从伦敦到诺夫哥罗德的数十个贸易城市,使用多种
    本地货币(吕贝克马克/普鲁士先令/英格兰便士等)。同盟建立了定期清算集市
    (如吕贝克、但泽),商人在集市上轧差多边债权债务——多边度很高。此系统
    维持了数百年,期间无单一货币吞噬其他货币(虽然吕贝克马克有枢纽地位但未
    消除其他本地货币的流通)。这构成了一个"前数字、多边度高、多币并行"的
    历史案例。

    消化分析:汉萨同盟的结算成本并不低——定期清算集市需要商人亲自出席或派遣
    代理人进行面对面轧差(高时间成本+高旅行成本),清算频率受限(每年若干次),
    且不是所有交易都能在集市上轧差(非集市期间仍需维护双边信用关系)。这与
    DED-048 的"毫秒级算法路由"在成本量级上有质的差距(后者是 BR-L2-032 的
    4-5 数量级断崖,前者是每年若干次人工轧差)。汉萨的多币并行正是在"结算
    成本高"的条件下实现的——这与 DED-048 的(高成本,低集中)格"物理不可能"
    形成张力:汉萨表明高成本条件下多币并行是可以维系的(通过定期的集中清算
    机制),只是成本确实高。

    进一步消化:汉萨的多币并行依赖"定期集中清算"这一制度安排,而非通用媒介
    或算法路由——这是一种"第三类解决":通过时间聚集(把所有双边债务推迟到
    清算日一次性轧差)来降低结算频率,而非通过媒介(当场两清)或算法(实时路由)
    来降低每次结算的成本。汉萨案例揭示了一个 DED-048 的 2×2 表中未考虑的策略
    维度:除了"使用通用媒介"和"使用算法路由",还存在"降低结算频率"这一
    第三路径。

    → 此案例不构成 falsifiability(c)的净杀,因为汉萨的结算成本确实高(符合
    "高成本"格),多币并行是在高成本下通过制度安排(定期清算)维系的——但
    它挑战了(高成本,低集中)格"物理不可能"的绝对性。不过此挑战不致命:汉萨
    的定期清算机制本身就是一种成本——商人需旅行、等待清算日、承担信用风险
    ——正因为这些成本,大多数经济体中此模式不可持续,通用媒介仍是主流。
    → should:在 2×2 的(高成本,低集中)格中标注"存在历史例外(如汉萨同盟的
    定期集中清算),但此模式依赖额外的制度条件(定期集市+商人网络的高信任),
    不改变'此格在多边随机交换中一般不可行'的统计规律"。

    【结论:未净杀——汉萨的结算成本确实高(定期清算≠低成本),不满足
    falsifiability(c)的"结算成本低"条件。】

    综合:四路猎杀均未获 scope 内净杀反例。猎路 1(外汇电子化交易)暴露了机制
    收窄的 necessity(required 关联)。猎路 2(稳定币锚)已转为 required fix #1。
    猎路 4(汉萨)暴露了 2×2 表的一个未考虑的第三策略维度(should)。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发——逻辑层有三个可证伪条件,无概念循环】

    逻辑层:falsifiability(a)(b)(c)给出了明确的证伪条件,三条均可被经验反例
    独立击穿——(a)被"集中度无显著差异"击穿,(b)被"集中度上升趋同外汇"
    击穿,(c)被"前数字低成本低集中度网络"击穿。证伪条件不依赖推论自身的
    概念框架来解释反例——每个条件的证伪逻辑是"测量值不满足预注册的统计/
    历史判据",而非"测量值可以被重新解释以匹配理论"。

    概念循环检查:
    - "判定结算成本低"的标准(AR-1:API 响应<500ms+路径数≥3)独立于集中度
      测量(链上交易笔数统计)。
    - "判定集中度低"的标准(H(1)<0.5 或与外汇市场显著差异)独立于结算成本
      测量(API 响应时间)。
    - Anti-talisman(1)明确禁止由"集中度下降"反推"结算成本低"→两条测量
      链之间的循环被制度性锁死。

    实操层的潜在缓发证伪窗口:
    (i) 若所有加密网络均显示高集中度(>0.7),anti-talisman(3)规定消化失效→
    推论被证伪。这是硬止损,非缓发窗口。
    (ii) 灰色地带(0.5-0.7)的裁决真空(见 criterion_tier_match)→若实测值落在
    此区间,推论可"既不确认也不证伪"地长期悬置——但这不构成 DED-004 式的
    逻辑不可证伪循环(悬置≠免疫),只是裁决效率问题。
    (iii) 1 年时间窗口的任意性(见 limitations)→若多币并行在 1.5 年时崩溃,
    作者可能主张"窗口设短了"——但 anti-talisman(2)已锁定≥2 年趋势检验窗口,
    此逃逸路线被堵。

    → 未复发 DED-004。

    DED-007(焊死测量轴):【未复发——主干正交,IV 和 DV 测量链概念层与操作层
    均分离;anti-talisman(1)提供制度性加固】

    主干:IV=多边结算成本(测量:API 响应时间+计算复杂度分析),DV=交易路径
    集中度(测量:链上交易笔数/总笔数统计)。两条测量链在概念层(IV 是计算
    效率/时间成本,DV 是交易量分布),操作层(IV 用 API 基准测试+复杂度分析,
    DV 用链上数据统计),和数据源层(IV 可来自聚合器 API 基准测试,DV 来自
    公开链上数据)均分离。

    与 DED-007 的根本差异:DED-007 的 IV 概念定义("应获授者")在测量层被迫
    使用 DV("实际获授者")作为分母→测量轴焊死。本案的 IV("结算成本")
    在概念定义和测量层都可与 DV("集中度")完全分离——结算成本的测量不需要
    知道集中度是多少,集中度的测量不需要知道结算成本是多少。

    更严格的检查:independent_cost_evidence(聚合器 API 响应时间+返回路径数量)
    是否可能被"集中度"污染?聚合器(如 1inch)的路径多样性是其算法的特性,
    不是聚合器观测集中度后的自适应行为——聚合器返回多条路径是其产品功能
    设计,独立于该网络的总体集中度水平。但若聚合器的路径多样性算法在集中度
    高的网络中倾向于返回更多样化的路径(以让用户看到"有选择"),则 IV 测量
    可能与 DV 有弱的统计关联——但这是测量噪声(IV 测量的 bias 方向与 DV 有关),
    不是概念焊死(IV 的定义依赖于 DV)。→ should 标注此可能性,非 required。

    → 未复发 DED-007。

  required_fixes:
    - |
      [required] 修正或移除 real_world_anchors 第 2 条(稳定币 USDT/USDC/DAI 共存)
