      definition_vs_prediction: |
        【Round 2 复核:通过——三条预测仍为可证伪的经验主张,无定义性循环】

        Round 2 新增压力测试:将 cost ratio ≤ 2x 判据与集中度 H(k)之间是否存在
        定义性循环(低成本定义为"≤2x 单枢纽成本",低集中度定义为"H<0.5"——
        两条定义在概念上独立,但若所有"≤2x 成本"的网络同时满足"H<0.5",两个
        判据可能在经验上完全共变→这本身不是循环(因为判据独立定义),但会削弱
        推论的增量信息:它等价于说"在 AMM 聚合器网络中,成本比和集中度负相关"——
        这可能是聚合器路由算法的直接后果(聚合器在成本比≤2x 时自动分散路由),
        而非"收敛从技术必然变为制度选择"的深层机制。

        但这不是定义性循环——cost ratio 判据测量的是兑换成本,集中度测量的是
        交易路径分布。二者概念上独立。它们的经验共变若存在,反而可能是推论预测
        正确的证据(低结算成本→路径分散)。→ 通过。

        Falsifiability (a)(b)(c) 的条件仍给出清晰的统计/历史判据,可独立于
        推论的理论框架被检验。→ 通过。

