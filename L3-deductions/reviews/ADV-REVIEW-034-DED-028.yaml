id: ADV-REVIEW-034
type: adversarial_review
reviews: DED-028
layer: L3-deductions

人话摘要: |
  对 DED-028(价值储藏-交易媒介的功能解耦动力学:法币信用下滑时 SOV 先逃逸、
  MOE 后崩塌,中间的时间差随信用下滑速度非线性变化)的 round-1 独立对抗审查。
  裁 verified——核心贡献(分化幅度与信用下滑速度的非线性关系+MOE 崩塌的网络效应
  逆转相变机制)有真实增量,无 required 级缺陷。但五条 should 须注意:(1)理论隐含
  SOV 无摩擦假设——资本管制/养老金锁定/定期存款等 SOV 结构性缓冲可压缩甚至反转
  SOV→MOE 时序,当前未系统讨论;(2)"慢速→delta 非零"格在 slow-enough 下滑时
  可能低于测量阈值,属 practically unfalsifiable——需声明最低可测速度条件;
  (3)anti-talisman clause 承诺的津巴布韦独立速度测量未在 anchor 段兑现——锚仅
  描述了 SOV 逃逸→MOE 崩塌的时间差,未给出独立于 delta 的速度代理指标读数;
  (4)derivation 步骤4将信用下滑速度→信念更新速度→资产配置调整速度的链路视为
  单调,但行为经济学确认信念更新速度有独立的调节变量(anchoring/denial/
  overreaction),速度→delta 关系可能被信念更新动力学稀释——需将此中间变量诚实
  标注;(5)MOE 网络逆转的临界点触发条件模糊——当前仅说"极端低端"触发,未给出
  可事前判定的临界指标(如商户接受率跌破 X%或货币流速超过 Y),检验依赖事后
  自相关模式匹配。反例猎捕:未猎到 scope 内干净必杀反例——苏联卢布区解体/资本
  管制压缩 SOV/支付技术替代 MOE 均被 scope 边界消化或承认为应讨论的摩擦。
  DED-004/007 未复发——测量轴异源正交、证伪条件明确、excluded_outcomes 均
  事前结构判据。

target: DED-028
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。
  评分卡红旗 10 条逐项攻 + 反例猎捕(判 verified 前必做)+ DED-004(不可证伪循环)/
  DED-007(测量轴焊死)复发检查。裁决三态照评分卡:verified 需同时满足①无 required
  缺陷②亲自猎捕无 scope 内活反例③不重蹈 DED-004/007。

round_1:
  reviewer: "独立子 Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: verified
  verdict_note: |
    本条有 genuine 理论增量——"分化幅度与信用下滑速度非线性相关"+"MOE 崩塌由网络效应
    正反馈逆转驱动的相变"是任何单块承重砖都不给出的新预测。BR-L2-022 确立功能可分离,
    BR-L2-024 确立信用连续谱和中间区域"SOV 已迁移而 MOE 仍在"的存在事实——但二者均
    不讨论分化幅度与速度的动态关系,也不讨论 MOE 崩塌的临界动力学机制。DED-028 将
    BR-L2-024 的静态连续谱推向动态——"在谱上移动的速度如何影响解耦程度"是真实的新问题。

    verified 三条门全部通过:
    ①无 required 级缺陷——10 条红旗逐条攻,均未命中 required(详见 red_flag_findings)。
    ②反例猎捕完成——苏联卢布区解体/资本管制压缩 SOV/支付技术替代 MOE/行政货币改革
      均在 scope 边界外或被消化为 SOV 摩擦;无 scope 内(法币体系内生信用下滑)干净反例。
    ③未重蹈 DED-004/007——测量轴保持异源正交(通胀预期/CDS/存款比各自独立于 delta),
      anti-talisman clause 到位;证伪条件(a)(b)(c)明确且可被经验数据攻击;excluded_
      outcomes 均基于事前结构判据(体系类型/信用变化方向/代际传递),无 DED-004 式
      "遇反例→回缩定义"的循环。

    五条 should 级观察不阻断 verified,但强烈建议在修订中处理:
    (1)理论隐含 SOV 无摩擦假设——SOV"不可被法律强制"不等于"无任何结构性缓冲"。现实中
       资本管制(禁止资金出境)、养老金强制锁定(法定退休前不可提取)、固定期限存款(提前
       支取罚息)均可系统性延缓 SOV 迁移速度。若 SOV 缓冲厚度接近或超过 MOE 法律缓冲,
       则"SOV 必然先于 MOE"的结构性主张从"机制保证"退化为"通常情况下"。建议在
       statement 或 limitations 中显式声明 SOV 摩擦的存在及对时序预测的威胁方向:
       强 SOV 摩擦→delta 压缩(极端时 SOV 与 MOE 近乎同时崩塌)→预测(i)的"结构性"
       断言需加"在 SOV 可自由迁移的条件下"的限定。
    (2)"慢速→delta 非零"的 practically unfalsifiable 风险。当信用下滑速度趋近于零
       (如年通胀率从 2%→2.5%历时数年),SOV 迁移可能落在家庭资产配置的正常噪声范围内,
       delta 在统计上 indistinguishable from zero。此时若观测到 delta≈0,无法区分
       "delta 真为零(理论被证伪)"与"delta 存在但低于测量精度(理论成立但不可测)"。
       建议在 nontriviality_test 或 operationalization 中声明:本推论的 delta>0 预测
       仅在信用下滑速度超过某最低可测阈值(如存款比季度变化>1σ)时期望可被经验检验;
       低于此阈值的"慢速"区域,delta 非零是理论外推而非可检验预测,应诚实标注。
    (3)anti-talisman clause 的津巴布韦锚独立测量未兑现。anti-talisman_clause 明确要求
       "至少一个承重锚(如津巴布韦 2008)需独立测出信用下滑速度(按预注册的存款比变化率),
       不依赖'delta 事后很大'来判定'下滑速度很快'"。但 real_world_anchors 的津巴布韦
       条目仅描述了 SOV 迁移的时间线(2000s 初→2008 年 MOE 崩塌,时间窗 5-7 年)和定性
       判断("符合'慢→中速下滑、delta 显著'的预测"),未给出独立的存款比变化率/CDS 展宽/
       通胀预期变化率读数。锚的 supporting 功能(方向性案例)不受影响,但 anti-talisman
       要求是额外的——需至少一个锚真正演示"不看 delta,只看速度代理,能否独立判定下滑
       速度"。建议:要么为津巴布韦锚补上独立速度代理数据(即使近似值),要么在 anti-talisman
       clause 中诚实标注"独立速度测量尚未在锚段展示,当前为预注册承诺,待后续经验检验
       阶段执行"。
    (4)derivation 步骤4的信念更新链路欠诚实。步骤4的论证:"缓慢下滑时,AXIOM-002(信息
       不自动消失)以渐进方式运作(Agent 有足够时间逐步更新信念,渐进调整资产配置),
       delta 小;急剧下滑时,恐慌机制介入...SOV 迁移加速"。此论证在"信用下滑速度"和
       "信念更新速度"之间插入了一个隐含的单调映射——假设 Agent 的信念更新速度与信用
       下滑速度成正比。但行为经济学确认信念更新有独立调节变量:anchoring(慢速下滑中
       Agent 可能长期低估趋势,延迟反应→压缩 delta)、overreaction(快速下滑中 Agent
       可能恐慌过度→放大 delta,此部分已覆盖)、denial(快速下滑中 Agent 可能拒绝相信→
       延缓 SOV 迁移→压缩 delta,方向与预测相反)。当前 derivation 仅覆盖了 overreaction
       方向,未讨论 anchoring/denial 的抵消效应。建议在 derivation 步骤4中诚实标注:
       "信用下滑速度→信念更新速度→资产配置调整"是一个两级链路,信念更新速度有独立的
       行为调节变量(anchoring/overreaction/denial)可放大或抵消信用下滑速度的效应;
       本推论的"速度↑→delta↑"预测假设 overreaction 效应主导(快速下滑时)且 anchoring
       不压倒速度效应(慢速下滑时)——这是合理但非 inevitable 的假设,若未来行为实验
       发现 anchoring/denial 系统性地压平速度-delta 关系,本推论的非线性预测被削弱。
    (5)MOE 网络逆转临界点的触发条件模糊。当前仅说"当信用滑至连续谱的极端低端...
       商户开始拒绝接受法币→法律强制在实际交易层面失效→网络效应正反馈逆转"——
       但"极端低端"的具体操作化付之阙如。anti-talisman clause 给出了事后检验
       (自相关结构:加速下降 vs 线性衰减),但未给出可事前判定"临界点已逼近"的指标。
       若只能事后看时间序列是否加速才能确认"这是网络逆转",则预测(c)的实用证伪力打折——
       任何 MOE 崩塌都可被事后解释为"这就是网络逆转"或"这还不是网络逆转(只是线性衰减)"。
       建议在 operationalization 中补充至少一个可事前观测的临界逼近指标候选
       (如商户接受率跌破 50% 的前一季度内货币流通速度的周环比是否已连续加速),
       使预测(c)不仅可事后检验也可事前预测临界时机。

  red_flag_findings:
    brick_conclusion: |
      【未命中——逐字核对四块承重砖原文后确认非平凡内核不在任何单砖内】

      BR-L2-022(价值储藏作为货币的独立功能维度):
      - 核心陈述:"交易媒介和价值储藏的驱动机制不同,可以在同一资产上共存也可以
        在不同资产上解耦。"(a)MOE 由网络效应+法律强制驱动;(b)SOV 由信心驱动且
        不可法律强制;(d)功能解耦可逆但不完整。
      - DED-028 的核心增量不在"功能可解耦"(这是 BR-L2-022 的内容),而在解耦的
        动态学:解耦程度如何随信用下滑速度变化、MOE 崩塌的临界机制是什么。
      - BR-L2-022 未讨论下滑速度与 delta 的关系,未讨论 MOE 的网络效应如何
        在极端条件下反转。DED-028 的增量真实。

      BR-L2-024(法币信用连续可逆性与记忆滞后):
      - 核心陈述:(a)法币信用是连续谱——"中间:部分信心——持有者以法币进行日常
        交易(交易媒介功能仍在),但将长期储蓄分散到非法币资产(价值储藏功能部分或
        全部转移)。"
      - 这是 DED-028 声称的最接近前身——BR-L2-024 明确描述了"SOV 已迁移而 MOE
        仍在"的中间状态。但 BR-L2-024 的陈述是静态结构描述(连续谱上的一个区域),
        不包含动态主张(区域之间的过渡速度如何影响功能分化程度)。
      - 判别:DED-028 的"时序结构性"(SOV 先于 MOE)的方向与 BR-L2-024 的中间区域
        描述同向——从连续谱的高端向低端移动时,必然先经过"中间区域"(SOV 迁移而 MOE
        仍在)。在此意义上,"SOV 先逃逸"是 BR-L2-024 连续谱拓扑的直接推论——只要信用
        从高端向低端移动,它就必然路过"SOV 已走而 MOE 未崩"的区域。但(1)BR-L2-024
        未将此称为"预测"或"结构必然性"——它只是描述了连续谱的结构;(2)BR-L2-024
        未讨论移动速度是否影响区域之间的过渡时间;(3)BR-L2-024 未讨论极端低端的
        MOE 崩塌机制。DED-028 真正的增量不在"SOV 先于 MOE"这一方向性陈述,而在:
        (a)delta 是速度的函数且非线性;(b)MOE 崩塌是网络逆转相变。
      - 结论:预测(i)的"方向性"(SOV 先逃逸)与 BR-L2-024 的结构描述同向,但增量
        在"时序是结构性的且 delta 是速度的函数"——方向同向不等于内容冗余,因为
        DED-028 做出了更 specific 的动态预测(速度→delta 非线性)。不判 required,
        但建议在 statement 或 discriminant_validity 中诚实标注预测(i)的方向与
        BR-L2-024 中间区域的静态描述同向,本条的核心增量在动态(delta=f(speed))
        和临界机制(网络逆转)而非方向本身。

      BR-L2-011(通货替代匿名交换中缺失的记忆/可追踪性):
      - 核心陈述:通货在匿名/不可追踪时充当记忆替代。与 DED-028 的关联仅在 MOE
        崩塌的临界动力学——MOE 崩塌涉及 E_network 正反馈逆转,而 E_network 概念
        源于 BR-L2-011/012 的通货网络效应理论。
      - BR-L2-011 不讲 MOE 崩塌、不讲网络效应逆转。增量真实。

      BR-L2-012(多边结算成本催生通用媒介):
      - 核心陈述:多边结算成本随对手数近似平方增长,通用媒介压缩为单边持有。
        同样仅与 MOE 的网络效应概念相关,不讲崩塌动力学。

      综合:四块砖均不单独覆盖 DED-028 的非平凡内核——"分化幅度与信用下滑速度
      非线性相关"+"MOE 崩塌由网络效应正反馈逆转驱动的相变"。BR-L2-024 的中间区域
      描述与预测(i)的方向同向,但动态增量是真实的。不判 required。

    nontriviality_cell_check: |
      【大部分通过——核心空格非平凡,但"慢速→delta 非零"格的增量可疑】

      2×4 判据表(信用下滑速度×被预测项):
      - 慢速·SOV 缓迁:砖已覆盖(BR-L2-024 连续谱的中间区域)
      - 慢速·MOE 稳定:砖已覆盖(BR-L2-022 法律强制维持 MOE)
      - 慢速·delta 小但非零★:标★但增量可疑。若 SOV 缓迁(砖覆盖)≠0 且 MOE
        稳定(砖覆盖)≈不崩,则 delta=SOV 迁移−MOE 崩塌≈SOV 迁移>0。此格是非平凡
        主张还是砖的 conjunction?论点:"BR-L2-022/024 未讨论分化幅度与速度的关系,
        只确认了'中间区域 MOE 在而 SOV 已迁移'这一存在事实"——此辩护成立但弱:
        "慢速下 delta 非零"不需要额外的速度理论——只要慢速下滑产生了任何 SOV 迁移
        (砖已确认可能),delta 就自动非零。速度变量在此格中的增量负载极低。
        → 建议:将"慢速→delta 非零"从标★主张降格为"砖 conjunction 的校验格"
        (即不主张此格为推论独有增量,而承认它是砖的自然外推)。不判 required
        (因中/快/极端格的增量扎实),但诚实度应提升(should)。

      - 中速·delta 中等★:非平凡。砖确立了"SOV 已迁移而 MOE 仍在"这一中间区域
        的存在,但未量化 delta 与速度的关系。本推论主张 delta 可被测量且与速度共变
        ——这是新的经验预测。
      - 快速·delta 大★:非平凡——招牌预测。恐慌性 SOV 逃逸与 MOE 法律缓冲之间的
        "撕裂"在快速下滑时最显著——砖未给出此预测。
      - 极端·MOE 网络逆转崩塌★:非平凡。砖未讨论 MOE 崩塌的临界动力学。

      逐格判空结论:中/快/极端三个★格的非平凡性确认通过。"慢速→delta 非零"格的
      增量负载弱,近乎砖 conjunction。核心空格(快速·delta 大)可被经验攻击——
      若快速下滑中 SOV 与 MOE 近乎同时崩塌(delta≈0),则招牌预测被证伪。非空可满足。
      不判 required。

      derivation 逐格判空的整体诚实度可接受但步骤4的信念更新链路需诚实标注
      (见 verdict_note 的 should(4))。

    measurement_orthogonality: |
      【通过——测量轴异源正交,anti-talisman 设计到位】

      四测量轴:
      - 信用下滑速度:通胀预期变化率(调查数据,独立于资产配置)/CDS 利差展宽
        (市场定价,独立于家庭储蓄行为)/本币存款比变化率(与 SOV 迁移有重叠——
        已在 operationalization 中诚实标注;"至少一个可行路径即可"标准下,
        通胀预期和 CDS 两条路径独立可测)
      - SOV 迁移幅度:家庭金融资产中非法币工具占比(央行资金流量表/家庭资产调查,
        独立于通胀预期和 CDS)
      - MOE 留存度:商户法币接受率调查/POS 电子支付数据(独立于 SOV 迁移和通胀预期)
      - SOV-MOE 分化 delta:时间差 T_MOE_collapse − T_SOV_escape(两指标独立测,
        时间差由其各自阈值触发时刻计算)

      独立性检查:
      - 通胀预期→SOV 迁移:概念独立。通胀预期是前瞻性调查,不依赖已发生的 SOV 迁移。
      - CDS→SOV 迁移:概念独立。CDS 反映主权违约风险的市场定价,不依赖家庭资产配置。
      - 存款比→SOV 迁移:有重叠——存款比变化本身可反映 SOV 迁移。operationalization
        已诚实标注此限("不同代理捕捉谱的不同段"),anti-talisman clause 禁止 post-hoc
        挑选代理人。若研究者预注册使用存款比,则 speed 与 delta 共享部分数据源——
        此时它们独立于 delta 的时间差测量(存款比变化率 vs. 非法币占比超过阈值的
        时间),但共源方差存在。不构成结构性焊死(因可以选择不重叠的代理),但若
        存款比被选为唯一代理,则测量独立性打折。建议在 operationalization 中推荐
        默认使用通胀预期+CDS 双代理,将存款比作为辅助验证而非主测量(should)。

      anti-talisman clause 三条防线明确:
      (a) 信用下滑速度不得因 delta 大而反推速度快——需预注册代理变量
      (b) MOE 崩塌是否网络逆转不得因"MOE 崩塌了"反推——需事前自相关结构预测
      (c) 至少一个承重锚(津巴布韦 2008)需独立测出信用下滑速度

      防线(a)(b)的文字设计是认真的。防线(c)的津巴布韦锚尚未兑现独立速度测量
      (见 verdict_note 的 should(3))——但防线的文字承诺本身到位。不判 required。

      未重蹈 DED-007 式"分母偷用结果"的结构性焊死。DED-007 的死因是自变量
      定义本身含被预测量(分母用"实际获授者")——DED-028 不存在此级别的结构性焊死。

    scope_hook_independent_of_result: |
      【通过——四个排除钩子均基于事前可测的结构渠道】

      (1) 记账单位(UoA)的解耦动力学:BR-L2-022 已声明 UoA 不在其射程内,
          本推论同样不覆盖。排除理由:独立于 MOE/SOV 的功能维度,非本推论主题。
          不由是否观测到 UoA 相关现象决定。
      (2) 商品货币/金本位体系:排除理由:体系类型可事前判定(是否有法定货币+
          强制纳税的法币体系)。不由结果决定。
      (3) 信用恢复期反向 delta:排除理由:信用恢复涉及记忆滞后(BR-L2-024c),
          是独立机制。变化方向(下滑 vs.恢复)可事前判定。不由结果决定。
      (4) 代际传递的记忆:排除理由:BR-L2-024(c)明确不为代际永恒背书,
          本推论同。不由结果决定。

      边界案例同样事前判定:
      - 行政命令式货币替换(如 1948 年德国货币改革):信用变化方式(行政命令 vs.
        内生下滑)可事前判定。排除合理。
      - 小型开放经济完全美元化:体系特征(是否有独立法币+法律强制)可事前判定。
        适用但需调整——诚实。

      四个钩子+两个边界案例均按结构渠道立桩,不作事后开脱。不判 required。

    criterion_tier_match: |
      【未命中——档位匹配合理】

      核心自变量"信用下滑速度"本为连续量,在 2×4 判据表中被粗分为四档
      (慢/中/快/极端)。此分档为概念展示,非正式检验设计——operationalization
      给出连续测量方案(通胀预期变化率/CDS 展宽速率/存款比变化率均为连续量),
      实际检验可用连续回归而无需依赖四分档。

      四档的定性预测合理分化:
      - 慢→中→快:delta 单调增大(连续量→连续量,无档位错配)
      - 极端:delta 先扩后缩+MOE 相变(定性不同于前三档——"网络逆转"是机制切换
        非量变,对应被预测量从"delta"变为"崩塌模式",档位->被预测量匹配合理)

      关键:operationalization 给出的连续测量方案确保检验不依赖粗分档。不判 required。

    anti_talisman_cashed: |
      【通过——防线文字到位,承重锚至少应有一个真独立测量(但津巴布韦锚尚未兑现)】

      anti_talisman_clause 三条防线:
      (a) 信用下滑速度由预注册代理变量独立测量——通胀预期/CDS/存款比。通胀预期
          和 CDS 在概念上完全独立于 delta。文字到位。
      (b) MOE 崩塌模式由事前自相关结构预测(加速下降→网络逆转)判定,不得因
          "MOE 崩塌了"而反推——此防线给出可操作的检验方案。文字到位。
      (c) 至少一个承重锚需真独立测出速度——津巴布韦 2008 被点名。文字到位但
          锚段未兑现(见 should(3))。

      整体:防线的文字设计是认真的,不是嘴上说"要独立测量"。津巴布韦锚的独立
      速度测量缺口是执行层面而非设计层面。不判 required。

    anchor_fact_check: |
      【无致命事实错——四个 supporting 锚方向正确但粗粒度,无独立速度定量】

      逐锚核:

      (1) 津巴布韦 2008:
      - 陈述:SOV 早在 2000s 初已开始向 USD/南非兰特转移,MOE(津元)因法律强制
        和政府支付维持到 2008 年中才完全崩塌,时间窗约 5-7 年。
      - 事实检查:津巴布韦经济危机→恶性通胀的时间线大致准确。土地改革(2000)→
        经济制裁+农业崩溃→通胀加速(2002-2006 年通胀率从 100%→1000%+)→
        恶性通胀峰值(2008 年 11 月月通胀率估计 79.6 billion %)。2009 年政府
        正式放弃津元,允许多币制。SOV 转移(USD/南非兰特化)早在 2000s 初已有
        报告,符合描述。
      - 问题:锚的定性判断("慢→中速下滑、delta 显著")未给出独立速度代理的
        定量读数。5-7 年时间窗本身由 SOV 逃逸与 MOE 崩塌的各自时间点推算——
        两个时间点都来自 delta 的组分,这不是独立速度测量。若仅从时间跨度推断
        "中速下滑",则陷入了"delta 大→速度快"的循环。
      - 无事实错。Confidence:moderate 合理。Anti-talisman 承诺的独立速度测量
        未兑现,见 should(3)。

      (2) 委内瑞拉 2010s:
      - 陈述:SOV 功能在 2013-2015 年间逐步流失,MOE 功能维持到 2017-2018 年
        才显著退化,时间窗约 3-5 年。
      - 事实检查:委内瑞拉经济危机的时间线大致准确。油价暴跌(2014)→经济崩溃+
        通胀飙升。2015-2016 年通胀率从三位数进入四位数。2017-2018 年玻利瓦尔
        广泛拒收,美元化加速。IMF 估计 2018 年通胀率约 1,370,000%。
      - 无事实错。Confidence:moderate 合理。

      (3) 阿根廷多次循环:
      - 陈述:比索 SOV 功能在每次危机中率先逃逸,MOE 因纳税义务和工资支付惯性暂留。
      - 事实检查:阿根廷的"美元化储蓄+比索交易"模式有充分文献支持(如 2001-2002
        年危机、2018-2019 年危机、2020 年债务重组后的持续比索贬值)。每次危机中,
        储蓄美元化(safe deposit boxes/境外账户/非正式美元持有)先于日常交易美元化。
      - 无事实错。Confidence:moderate 合理。

      (4) 魏玛德国 1923:
      - 陈述:SOV 早已完全消失,MOE 先由紧急货币(Notgeld)部分替代,最终商户完全
        拒收帝国马克,MOE 崩塌表现出明显的加速特征。
      - 事实检查:魏玛恶性通胀的标准叙述准确。1923 年秋价格按小时翻倍,实物交换
        和 Notgeld(市政/公司发行的紧急货币)广泛替代帝国马克。帝国马克最终被
        租金马克(Rentenmark,1923 年 11 月)替代。MOE 崩塌是否确为"加速特征"
        (网络逆转)→此陈述是推论的解释性框架,非事实陈述本身。作为事实锚:
        SOV 已消失+MOE 崩塌→准确。作为"加速特征"的锚→系理论解读,非独立事实。
      - 无事实错。Confidence:moderate 合理。

      综合:四个 supporting 锚方向正确、时间线基本准确,但均缺乏独立的速度代理
      定量测量——所有锚都以"时间差存在"作为方向性支持,未展示"不看 delta,只看
      速度代理,能否独立判定速度"。建议在 real_world_anchors 段首加总注诚实标注
      此限(should)。

    definition_vs_prediction: |
      【通过——关键条件均为可证伪预测,非定义性真理】

      三组预测逐一检查:

      预测(i) "SOV 迁移始终领先于 MOE 崩塌——无论信用下滑速度如何,SOV 总是在
      MOE 之前开始逃逸":可被"观测到 MOE 先于或同步于 SOV 崩塌"证伪。falsifiability
      (a)的证伪条件:"若在任何信用下滑事件中观察到 MOE 崩塌先于或同步于 SOV 迁移"。
      方向条件可操作化(T_MOE_collapse ≤ T_SOV_escape→证伪)。适用范围已声明:法币
      体系内生信用下滑。可证伪。

      预测(ii) "分化幅度与信用下滑速度非线性相关":可被"多速度事件中 delta 与速度
      无统计相关"证伪。falsifiability(b)的证伪条件明确。速度由独立代理测,delta
      由时间差测,两者独立→可证伪。

      预测(iii) "MOE 崩塌存在由网络效应正反馈逆转驱动的临界点":可被"极端案例中
      MOE 消失方式与 SOV 无本质差异(均为线性衰减)"证伪。falsifiability(c)的
      证伪条件给出操作化:自相关结构比较(加速下降 vs.线性衰减)。但此检验依赖
      事后时间序列分析——若未被预注册的临界阈值增强,辨识力打折。见 should(5)。

      关键条件:
      - "MOE 由网络效应驱动+法律强制":来自 BR-L2-022(已 verified 的经验陈述)
      - "SOV 由信心驱动+不可法律强制":来自 BR-L2-022(已 verified)
      - "法币信用是连续谱":来自 BR-L2-024(已 verified)

      以上条件均为可独立证伪的经验陈述(非定义)。DED-028 将它们组合后推导出
      新的可证伪预测——标准 deductive-nomological 结构。不存在"定义保证预测
      必然为真"的循环。

      关键范围条件(法币体系/内生信用下滑/非行政货币替换)均可事前判定——
      不由"是否观测到预测成立"反推。不判 required。

    enumeration_and_species: |
      【不直接命中——本推论非 N-species 穷举枚举结构,不存在漏分类风险】

      DED-028 不声称"将信用下滑分为 N 类"或"SOV-MOE 解耦有 N 种路径"。
      2×4 判据表是概念展示工具,非穷举 typology。四个速度档位是对连续变量的
      粗分,用于展示预测的定性变化——不声称"只有这四档"或"每档的过渡有本质
      不同"。实际检验依赖连续测量。

      按 DED-008 精神主动猎"不在预测覆盖内的新 species":
      无适用对象——本推论不声称穷举分类。不判 required。

    primary_suspect_aim: |
      【方向基本指对——BR-L2-024 确实是核心依赖,但漏认两条次致命软肋】

      文件自认 primary_suspect:BR-L2-024(信用连续谱操作化)
      自评分析:"招牌预测(分化幅度的非线性)压在 BR-L2-024 的信用连续谱操作化上——
      若信用连续谱无法有效测量或信用下滑速度本身与 delta 无关,则核心预测摇摇欲坠。"

      此自评方向正确——若信用无法作为连续量有效测量(BR-L2-024 的核心主张),
      则"速度→delta 非线性"失去自变量。BR-L2-024 的 IEA=1.9(verified),基础
      较稳固,但 BR-L2-024 本身的测量锚点(通胀预期/CDS/货币流速/存款比)与
      DED-028 的速度测量共享同一组代理——若这些代理在实践中被证明无法区分
      信用谱的不同段,则两条推论同时受损。

      但文件漏认两条次致命软肋:

      【应该列入 primary_suspect 补充(1):SOV 无摩擦假设——比 BR-L2-024 操作化
      更根本的脆弱点】。若资本管制/养老金锁定/定存罚息等 SOV 摩擦在实践中
      widespread 且 effect size 与 MOE 法律缓冲可比,则"时序结构性"的核心主张
      从"机制保证"退化为"ceteris paribus 倾向"。这与 BR-L2-024 的操作化无关——
      即使信用连续谱完美可测,SOV 摩擦仍可压平甚至反转时序。当前文件未将 SOV 摩擦
      列入 falsification_trace(只在 anti-talisman clause 中间接触及)。建议在
      falsification_trace 中新增一条:SOV 摩擦的 effect size 是否系统性低于 MOE
      法律缓冲——若否,预测(i)的结构性断言打折。

      【应该列入 primary_suspect 补充(2):derivation 步骤4的信念更新单调假设——
      速度→delta 关系的关键中间变量未被独立建模】。若行为经济学的 anchoring/
      denial 效应在慢速下滑中系统性压平 SOV 迁移(Agent 低估趋势→延迟反应→
      实际 delta 接近零而非"小但非零"),则"慢速→delta 非零"和"速度→delta 单调"
      两个预测同时受压力。此压力在内部(逻辑链路中)而非外部(测量工具中)——
      falsification_trace 当前聚焦外部依赖(砖的测量),未审视内部推导假设。

      unlikely_suspect(BR-L2-011/012)的部分自评("E_network 正反馈机制仅在
      MOE 崩溃的临界动力学中起关键作用,是招牌预测中较安全的一环")可能过于乐观。
      E_network 的正反馈逆转是一个理论延伸:BR-L2-011/012 讨论的是货币如何
      从无到有(emergence),DED-028 讨论的是货币如何从有到无(collapse)。虽然
      正反馈的数学结构对称(接受度↑→网络价值↑→更多人接受 vs. 接受度↓→网络
      价值↓→更多人拒收),但 emergence 和 collapse 的 empirical dynamics
      可能不对称——building trust takes time, destroying trust can happen
      overnight。若崩塌的实际机制是"恐慌传染"(behavioral cascade)而非"网络
      效应理性计算",则 E_network 逆转模型给出的时间序列预测(gradual acceleration)
      与数据不符。建议将 unlikely_suspect 下调为"中度依赖"并标注此不对称性风险。

      平凡化检查:discriminant_validity 的"防平凡化守卫"到位——明确列出三条
      非平凡增量((a)时序结构性,(b)非线性 delta-speed,(c)网络逆转相变)并给出
      与"教科书立场"(MOE/SOV 可分离)、"数量论"(不区分 MOE/SOV 需求时程)、
      "搜寻模型"(不解释法币信用下滑分化)的判别测试。但"防平凡化守卫"中(a)的
      判别——"时序是结构性的(由两种功能的机制差异保证而非取决于具体历史环境)"——
      若 SOV 摩擦普遍存在(见上文),则"结构性"断言的强度需打折。当前 discriminant_
      validity 未讨论 SOV 摩擦对"结构性"主张的威胁。建议补充(should)。

  counterexample_hunt: |
    主动构造能证伪核心的最强 falsifiability(a)/(b)/(c) 案例,认真搜历史/跨文化实例:

    ========== 攻击 1:苏联 1991 年卢布区解体 — 文件已标候选,经 scope 分析后消化 ==========

    目标:falsifiability(a)"SOV 始终先于 MOE 逃逸"
    案例:1991 年苏联解体→卢布区突然分裂。新独立国家(乌克兰/波罗的海国家等)
    迅速发行本国货币作为法定支付手段→卢布在这些国家的 MOE 功能被行政命令
    一夜移除。而卢布 SOV(储蓄)因居民仍持有卢布存款惯性可能延续——形成"MOE
    先于 SOV 崩塌"的候选反例。
    分析:文件已在 counterexamples 中诚实提出此候选,并给出消化路径——"若此类案例
    存在且时序与本推论相反,则诚实认伤并限定适用条件('仅适用于货币主权连续而非
    主权突变场景')"。此消化路径合理:主权突变→MOE 的法律强制基础本身被替换→
    这不是"法币信用内生下滑→MOE 逐步崩塌"的机制范围。DED-028 的 falsifiability
    适用范围已声明为"法币体系(国家发行的法定货币)",隐含前提是货币主权连续。
    结论:【被 scope 边界消化——主权突变非内生信用下滑,是 theory-external shock】。
    文件应显式在 excluded_outcomes 或 boundary_cases 中加入"主权突变(货币区
    解体/国家分裂/政权更迭导致的法律强制基础突然变更)"作为明确排除。

    ========== 攻击 2:资本管制+养老金锁定的 SOV 摩擦 — 非反例,揭出 SOV 无摩擦假设 ==========

    目标:falsifiability(a)的"结构性时序"
    案例集合:
    (a) 中国资本管制:居民储蓄以人民币计价资产为主(SOV 在境内),并非因为对
        人民币信心极高,而是资本管制+每年 5 万美元换汇限额阻止 SOV 大规模迁移。
        RMB 理财/存款/房产构成居民财富主体(SOV 被困),而微信支付/支付宝使
        RMB 的 MOE 功能极强。若人民币信用下滑(如持续贬值预期+通胀上升),
        SOV 迁移受资本管制压制→delta 被压缩,SOV 逃逸的领先幅度可能远小于
        无管制情景。极端时可能出现"MOE 因支付技术锁定而稳固+SOV 因管制而
        被锁→两者接近同步而非 SOV 先逃逸"。
    (b) 日本公共养老金(GPIF)以日元计价资产为主:养老金是居民 SOV 的重要组成部分,
        其资产配置受政府投资政策约束,不能自由迁移至外币资产。日元信用即使下滑,
        养老金 SOV 迁移速度被行政锁定。
    (c) 印度 2016 年废钞:MOE 被行政命令突然扰乱(86% 流通纸币失效),而 SOV
        (银行存款/房产/黄金)未同步受损。形成"MOE 崩塌先于 SOV"的行政驱动案例——
        但此为行政命令而非内生信用下滑→落入边界案例(类比 1948 年德国货币改革)。

    分析:(a)(b)是 SOV 摩擦而非反例——当 SOV 摩擦存在时,时序预测的 delta 被压缩,
    但方向不变(SOV 仍先于 MOE,只是领先幅度小)。然而,若 SOV 摩擦极强(资本管制
    近乎 watertight),SOV 迁移可能接近零甚至为负(管制使储蓄无法出境)→此时
    "delta≈0"在实证上 indistinguishable from"SOV 与 MOE 同步"→预测(i)虽未被
    逻辑证伪,但在实践中失去辨识力。
    结论:【揭出 SOV 无摩擦假设——资本管制/养老金锁定/定存罚息等 SOV 摩擦
    不是反例(方向不变),但压缩 delta 至 practically untestable 的程度时威胁
    理论的有用性】。建议在 statement 或 limitations 中诚实讨论 SOV 摩擦的条件
    限定:本推论的"结构性时序+非线性 delta"预测在 SOV 可自由迁移的条件下成立;
    在强 SOV 摩擦体系中,delta 被压缩,时序预测仍成立但可能低于测量阈值。

    ========== 攻击 3:支付技术替代 MOE 导致"MOE 先崩" — 被 scope 边界消化 ==========

    目标:falsifiability(a)
    案例:瑞典/中国等移动支付高度普及的经济体中,现金(法币的物理形式)的 MOE 功能
    正在快速衰退——不是因法币信用下滑,而是因支付技术替代(微信支付/Swish 替代
    现金)。在此过程中,法币计价的 MOE(银行存款通过电子支付)仍在运行,但现金-MOE
    的衰退先于任何 SOV 迁移。这不是信用驱动的解耦,但若混淆"支付技术替代"与
    "信用下滑驱动",可能被误判为反例。
    分析:支付技术替代≠法币信用下滑。DED-028 的驱动量是"法币信用下滑速度",
    不涉及支付技术变迁。此案例不构成反例,但暴露 a measurement confound——
    在 MOE 留存度的 operationalization 中,"POS/电子支付数据中法币交易占比"
    受支付技术普及的影响(电子支付普及→现金交易占比下降,即使法币信用未变)。
    operationalization 的 limitations 已诚实标注此限:"电子支付的普及使法币
    交易占比可能受支付技术而非货币信心影响;需控制支付基础设施变量"。足够。
    结论:【非反例——落入 measurement confound 而非核心预测的证伪。limitations
    已标,不增加 should】。

    ========== 攻击 4:非常缓慢信用侵蚀下的"delta=0" — 威胁"慢速·delta 非零"格 ==========

    目标:nontriviality_test 的"慢速·delta 非零★"
    案例:日本 1990s-2010s"失去的三十年"——通缩而非通胀,但日元信用在连续谱上
    的长期位置偏低(低利率/高债务/GDP 增长停滞)。日本家庭金融资产中日元计价占比
    长期>50%(现金+存款),非法币工具占比变化极为缓慢。此情景中,日元的 MOE 功能
    无任何实质性衰退,而 SOV 迁移(外币资产/黄金)非常有限——delta 在数十年尺度上
    ≈0。
    分析:DED-028 的驱动量是"信用下滑速度"——若信用下滑速度接近零(日本长期通缩中
    日元信用虽低但稳定),速度≈0→理论预期 delta 小但非零。观测到 delta≈0 是否
    构成证伪?两个可能辩护:(a)日本的信用不在"下滑"而在"低位稳定"——速度≈0 而非
    小→理论对速度=0 无预测;(b)"慢速→delta 小但非零"在速度→0 的极限下 delta→0,
    观测到 delta≈0 与理论一致。
    问题:若速度为 0 时 delta 也预期为 0,而速度为 ε(微小正值)时 delta 预期为
    "非零"(即使极小),则理论和观测之间有一个连续性缺口——在任何有限样本中,
    速度 ε 和速度 0 在统计上 indistinguishable,"delta 非零"的预测落在不可检验
    的间隙中。
    结论:【非净杀反例,揭出"慢速·delta 非零"格的 practically unfalsifiable 风险】。
    见 should(2)。

    ========== 猎捕结论 ==========

    未猎到 scope 内(法币体系内生信用下滑)干净必杀反例:
    - 攻击1(卢布区解体):主权突变,落在 scope 边界外。应显式列入排除。
    - 攻击2(资本管制/养老金 SOV 摩擦):非反例(方向不变),揭出 SOV 无摩擦假设。
    - 攻击3(支付技术替代):measurement confound,非核心预测反例。limitations 已标。
    - 攻击4(日本长期低信用稳定):阈下速度→practically unfalsifiable,非逻辑证伪。

    反例猎捕完成。无 scope 内净杀。verified 条件②满足。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发】

    DED-004 的死因:唯一新意被实证推倒→改措辞用同一批数据捞"打折版"→事后开脱
    活门未堵。DED-028 与 DED-004 的关键差异:
    - DED-028 有三条可独立攻击的预测(i)(ii)(iii),三条腿各自有独立的证伪条件——
      DED-004 只有一个经验主张被围剿。
    - falsifiability(a)(b)(c)给出明确的证伪测试(时间差方向/速度-delta 统计相关/
      自相关结构差异)——不是"找到某种解释即可消化"的模糊空间。
    - anti-talisman clause 要求所有关键变量独立测量——速度不由 delta 反推、
      MOE 崩塌模式不由"MOE 崩塌了"反推。
    - excluded_outcomes 均基于事前结构判据(体系类型/信用变化方向/代际传递),
      无"遇反例→回缩定义"的活门。

    DED-004 式"事后开脱活门"检查:逐一检验 excluded_outcomes 和 falsifiability
    适用区间是否存在可被事后用来消化反例的弹性条款:
    - excluded_outcomes 中"不适用于无法律强制支撑的私人货币或商品货币体系":
      体系类型可事前判定("是否有法定货币+强制纳税的法币体系"),非事后开脱。
    - falsifiability(c)适用区间"仅在信用滑至连续谱极端低端时适用":极端低端
      的操作化(如年通胀率>1000%持续数月)给出了可事前判定的阈值——不是"等看到
      结果再定义什么算极端"。
    - boundary_cases 中"行政命令式货币替换→预期 delta 趋近于零":此边界条件
      给出明确的事前判定标准(信用变化方式:行政命令 vs.内生下滑)+可检验的预期
      (delta≈0)。若观测到行政替换中 delta 大(≠0),则边界条件的预期被违反——非活门。

    未发现 DED-004 式不可证伪循环。通过。

    DED-007(测量轴焊死):【未复发】

    DED-007 的死因:自变量分母"实际获授者"偷用被预测量(货币形式)——轴定义本身
    含被预测量,结构性焊死无法拆。DED-028 现状:
    - 信用下滑速度:通胀预期变化率/CDS 展宽/存款比变化率——前两个独立于 delta,
      第三个有重叠但非唯一代理(可选择不重叠的代理)
    - SOV 迁移幅度:家庭非法币资产占比——独立于通胀预期和 CDS
    - MOE 留存度:商户接受率/POS 数据——独立于 SOV 迁移和通胀预期
    - Delta:时间差(T_MOE_collapse − T_SOV_escape)——由两个独立测量的时间点
      计算,不反馈到速度测量

    四轴在概念和操作上均异源,无 DED-007 式"分母偷用结果"的结构性焊死。
    anti-talisman clause 进一步加固:明确禁止因 delta 大反推速度快、
    因 MOE 崩塌反推网络逆转、post-hoc 挑选代理。

    残余注意:存款比作为速度代理时与 SOV 迁移有数据源重叠——但这不是测量轴定义的
    结构性焊死(因通胀预期和 CDS 提供独立替代),而是多代理方案中单一代理的 confound
    风险。已在 operationalization 的 limitations 中诚实标注。不判 required。

    未复发。

  required_fixes: []

  should_fixes:
    - |
      [should] SOV 无摩擦假设的诚实标注。当前理论从"SOV 不可被法律强制"直接跳到
      "SOV 对信用下滑反应更快",中间跳过了"SOV 是否有其他结构性缓冲(非法律的)"。
      资本管制/养老金锁定/定存罚息等均可系统性延缓 SOV 迁移。建议在 statement
      或新增的 limitations 段显式声明:"本推论假设 SOV 可自由迁移(无资本管制/
      无强制锁定/无显著交易摩擦)。当 SOV 摩擦与 MOE 法律缓冲可比时,预测(i)的
      时序领先幅度被压缩,极端时 delta 可能降至不可测。预测(i)的'结构性'断言
      应在'SOV 可自由迁移'的限定下理解。"
    - |
      [should] "慢速→delta 非零"格的诚实度提升。当前将此格标为★(非平凡主张),
      但若慢速·SOV 缓迁和慢速·MOE 稳定均为砖覆盖,则 delta 非零是 conjunction
      而非新经验预测。建议将此格从标★主张降格为"conjunction 校验格"——不主张
      此格为推论独有增量,而承认它是 BR-L2-022+BR-L2-024 在慢速条件下的自然外推。
      同时,在 operationalization 中声明:当信用下滑速度低于最低可测阈值(如存款比
      季度变化<1σ)时,delta 非零是理论外推而非可检验预测。
    - |
      [should] 津巴布韦锚的独立速度测量兑现或诚实标注缺口。anti-talisman clause
      点名津巴布韦 2008 作为承重锚,要求独立测出信用下滑速度。但 real_world_anchors
      的津巴布韦条目未给出通胀预期/CDS/存款比的独立读数——仅描述了 SOV 逃逸与 MOE
      崩塌的时间差(本身就是 delta)。建议二选一:(a)补上津巴布韦 2000s 的存款比
      变化率/CDS 数据(即使近似值),使其成为真正的 anti-talisman 示范锚;(b)在
      anti-talisman clause 中诚实标注"独立速度测量尚未在锚段执行,当前为预注册
      承诺,待后续经验检验阶段补充"。
    - |
      [should] derivation 步骤4的信念更新链路诚实化。当前步骤4将"信用下滑速度→
      delta"视为直接映射(慢→渐进调整 delta 小;快→恐慌 delta 大)。但此链路中
      的中间变量——Agent 信念更新速度——有独立行为调节变量:anchoring(慢速中低估
      趋势→延迟反应→压缩 delta)、denial(快速中拒绝相信→延缓 SOV→压缩 delta,
      方向与 overreaction 相反)。当前 derivation 仅覆盖了 overreaction 方向。
      建议在步骤4中诚实标注:"本推导假设 Agent 信念更新速度与信用下滑速度正相关,
      且 overreaction 效应(快速下滑)和 gradual adjustment 效应(慢速下滑)主导
      各自区段。若 anchoring/denial 系统性地压平速度-delta 关系——即 Agent 在
      慢速下延迟反应(delta 低于预期)、或快速下否认现实(delta 低于预期)——则
      本推论的单调非线性关系被削弱。此假设的可检验性:独立测量信念更新速度
      (如通胀预期调查中对近期 CPI 数据的响应弹性)并检验其对 delta 的调节效应。"
    - |
      [should] MOE 网络逆转临界点的可事前判定化。当前预测(c)的证伪依赖事后
      自相关分析(加速下降 vs.线性衰减)。若只能事后判定,任何 MOE 崩塌都可能被
      解释为"网络逆转"(若看到加速)或"尚未到达临界点"(若看到线性衰减)。建议在
      operationalization 或 falsifiability(c)中补充至少一个可事前观测的临界
      逼近指标候选:如"当商户法币接受率连续两个季度下降且下降速度本身在加速
      (acceptance rate 的一阶导的绝对值在增大)时,预测未来两个季度内将出现
      二阶加速(自相关结构从 mean-reverting 转为 trending)"。此类预注册判据
      使预测(c)不仅可事后检验,也可事前预测——显著提升证伪力。

