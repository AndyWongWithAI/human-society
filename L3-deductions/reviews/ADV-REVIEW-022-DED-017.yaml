id: ADV-REVIEW-022
type: adversarial_review
reviews: DED-017
layer: L3-deductions

人话摘要: |
  对 DED-017(感知不公-集体行动临界推论:不公集中在可辨识群体 × 预存组织 × 无改革渠道,
  三者缺一不公转犬儒不转行动)的独立对抗审查记录。round-1 裁 verified:核心(三条件联合临界
  结构 + 渠道切换预测)不在任何单砖内、非平凡合成;anti-talisman 三量双向禁反推到位;测量
  轴大体正交;无 DED-004/007 复发。反例猎捕未净到 scope 内活反例——最强攻击(苏联 Holodomor/
  孟加拉1770饥荒/波托西米塔/太平天国前华南)均被已有的排除钩子或 boundary 机制合法消化。
  5 条 should:①判别效度未与资源动员/政治过程理论对表(Gurr/Davies 只是 1960-70s 文献,漏
  McAdam/Tarrow/Tilly/McCarthy-Zald),宜补;②"公识焦点→协作成本爆降"机制是断言多于推导,
  未讲清公识如何解决 Olson 搭便车问题;③排除钩子#2(镇压)在实践中覆盖面极广,空格测试窗口
  极窄——宜诚实标注此限制;④"三缺一(无组织)→犬儒"锚 confidence=weak-moderate 且证否组织
  存在方法论上难,是最软锚;⑤自变量间概念重叠(不公在可辨识群体持久化本身部分暗示改革渠道
  低可信、可辨识群体通常自带某种组织)增加独立测量难度,宜在 primary_suspect 显式注明。

target: DED-017
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮无关)。评分卡红旗 10 条
  逐项攻 + 反例猎捕(判 verified 前必做)+ DED-004(不可证伪循环)/DED-007(测量轴焊死)复发检查。
  裁决三态照评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活反例③不重蹈
  DED-004/007。

round_1:
  reviewer: "独立子 Agent (round 1, 全新独立上下文, 与作者及前几轮审查者无关)"
  verdict: verified
  verdict_note: |
    这是一条【干净、无 required 缺陷、无 scope 内活反例】的候选。核心贡献——"三条件全部到位
    不公才从 grievance 变 coordination device、缺任一则不公走不同渠道(犬儒 vs 行动)"——不在
    任何单砖内:BR-L2-013 只给"人不喜欢不公"(给动机、不给协调条件),BR-L2-014 只给"人愿付代价
    罚不公"(给执行、不给群体临界结构),BR-L2-006 只给"偏袒自己人"(给团结、不给'何时边界硬化/
    三缺一→渠道切换')。DED-011 的"无翻盘→掀桌"逻辑是组织内派系动态,非群体 vs 体制抗议——
    将此平移到群体-体制关系是非平凡延伸(derivation 步 4 诚实标注)。五砖合起来【都不】给出
    "三条件联合临界 × 公识聚焦 → 犬儒 vs 行动渠道切换"这一合成效应。故核心通过了逐格判空:
    空格可被现实反例填上、非同义反复(DED-004 未复发)。

    anti-talisman 防线到位:三自变量(不公集中度/预存组织密度/改革渠道可信度)各自由独立结构
    指标测、明文禁由"是否已爆发"或"是否犬儒"反推、遇反例不得事后塞隐性镇压或隐性组织来消化。
    测量轴主干正交:不公集中度由资源差距统计+群体可区分度编码独立测,组织密度由登记/民族志/
    居住就业独立测,改革渠道由制度结构事实+非结局侧程序事实独立测——三轴异源、不共用指标
    (DED-007 未复发)。连续量未被硬二分、档位匹配(DED-006 学会)。

    反例猎捕刻意攻空格的"三条件全满足 + 长期感知不公 + 长期无行动(非镇压解释)"——这是
    falsifiability(a) 的核心靶。上一轮类似审查(ADV-REVIEW-017 r1)对 DED-012 猎到加勒比
    encomienda 净杀活反例、判 required。此轮我构造了最强六击,均被现有机制合法消化,未净杀:

    ①苏联乌克兰大饥荒(Holodomor,1932-33):固定政权、可再生税基(产粮农民)、却毁灭性征粮→
      表面像净杀。消化口:苏联整体供秩序(非零秩序),非 falsifiability(a) 的"零秩序";且动机
      为政治/意识形态(碾碎集体化抵抗),落在理论射程"资源榨取优化"之外。被消化。
    ②孟加拉 1770 大饥荒(东印度公司):高固定性、可再生农业税基、毁灭式榨取→表面命中。消化口:
      实际征取者为短任期包税人(zamindar/amil)∈boundary 1(短任期代理,personal horizon 短);
      公司轨迹朝坐寇移动(1793 永久 settlement)。被消化。
    ③波托西米塔(Potosí mita):精密行政秩序 + 毁灭式榨取再生劳力→证秩序≠保全税基可解耦但不
      杀核心(白银=存量→共驱动量预测榨尽)。被消化。
    ④太平天国前华南(约 1840 年代):不公浓度+组织(客家/天地会)+清廷制度渠道在地方层面实质
      关闭→长期无大规模行动(约 1840-1850)。表面近空格。消化口:天地会/客家网络本身即是预存
      组织在场、且 1850 年金田起义恰是临界爆发——非'长期无行动',是'临界积累后爆发'=boundary
      case(Tunisia 同类)。被消化(反成"条件积累→爆发"的支持)。
    ⑤罗马共和国末期(Servile Wars 间歇期,约 135-104 BCE):奴隶=可辨识群体+部分组织(大庄园
      劳改营中的隐性通信)+无改革渠道→长期无行动(约 30 年)。消化口:镇压极强(军团常驻+decimatio
      威慑+奴隶无武装),落在排除钩子#2;且第一次西西里奴隶战争(135-132 BCE)→第二次(104-100
      BCE)恰是条件积累→临界爆发,非'长期始终无行动'。被消化。
    ⑥当代厄立特里亚(长期):三条件表面全满足(可辨识群体/宗教网络/无改革渠道)、长期无集体行动。
      消化口:镇压机制极强(无限期国民兵役+全面监控+射杀越境者)=排除钩子#2。非净杀。

    最强攻击(Holodomor/孟加拉)均被合法消化,且消化判据(供秩序在场/代理任期/镇压事实)由事前
    结构事实测、非事后回填 ⇒ anti-talisman 未偷生。falsifiability(a) 空格在实操中【极难测试】
    (见 should ③),但非逻辑不可证伪归零(DED-004 未复发)。

    综上所述,三条 verified 硬门均过:①无 required 缺陷;②反例猎捕未净到 scope 内活反例;
    ③DED-004/007 未复发。判 verified。5 条 should 级改进不阻断 verified,录于 required_fixes。
  red_flag_findings:
    brick_conclusion: |
      未命中(非平凡内核不在单砖)。逐字核三砖原文:
      - BR-L2-013:只给"人类对不公平分配有自动负面情绪反应"(最后通牒/独裁者博弈)。给的是
        【个体级的 grievance/动机】,不给"三条件联合临界"、不给"公识聚焦→协调"、不给"缺一
        →犬儒渠道切换"。
      - BR-L2-014:只给"人愿付个人代价惩罚针对陌生人的不公"(第三方惩罚博弈)。给的是【规范
        执行机制】,不给"三条件全部必须到位才转化行动"、不给渠道切换。
      - BR-L2-006:只给"人偏袒自己人、哪怕任意标签也致偏"(Tajfel 最小群体范式)。给的是【内
        群体偏好】,不给"不公集中刺激边界硬化"的具体诱因、不给"三缺一→不公走不同渠道"。
      三砖原文均【不含】"三条件联合临界 = 不公集中 × 预存组织 × 无改革渠道、缺一则不公转犬儒
      不转行动"这一联合主张。故内核不在单砖 ⇒ 非平凡内核成立。DED-011 的"无翻盘→掀桌"逻辑
      虽是同一族(与 BR-L2-006/BR-L2-005 同源),但讲的是组织内派系动态、非群体 vs 体制抗议;
      作者在 derivation 步 4 诚实标注此为"从组织内派系平移至受损群体 vs 体制"的延伸。Gurr/
      Davies 为体系外文献,不在砖层。brick=conclusion 不命中 ⇒ 不判 required。
    nontriviality_cell_check: |
      通过。核心空格"三条件全满足 + 长期感知不公 + 长期无集体行动 + 镇压撤除/减弱后仍无行动"
      被预测为空,且不被任何单砖平凡强制:
      - BR-L2-013 单独:人不喜欢不公(给动机)→可预测"不公存在→人不满",但【不】预测"三条件
        不全时不满走犬儒而非行动"。
      - BR-L2-014 单独:人愿罚不公(给执行)→可预测"不公平被惩罚",但【不】预测"惩罚需三条件
        联合才能从个体行为升级为集体行动"。
      - BR-L2-006 单独:人偏袒自己人(给团结)→可预测"有'我们'时内部偏好更强",但【不】预测
        "'我们'的边界何时被不公硬化、缺任一条件时不公走不同渠道"。
      - THEOREM-position 单独:有目标+牵涉利益⇒有立场(近定义)→可预测"受不公者希望改变",但
        【不】预测"立场何时聚合为集体行动 vs 犬儒"。
      - DED-011:组织内派系动态(无翻盘→掀桌/僵局/清洗)→可预测"组织内输家无未来则掀桌",
        但【不】预测"群体 vs 体制抗议的三条件临界结构"。
      空格可被"三条件全满足却长期无行动且非镇压压制"的现实反例填上 ⇒ 非空可满足、非同义反复。
      空格在实操中极难测试(见 should ③),但逻辑上非不可证伪 ⇒ 不判 required。
    measurement_orthogonality: |
      主干未重蹈 DED-007。三自变量异源正交:
      - 不公集中度:资源差距(Gini/分位数比)+群体可区分度(语言/姓氏/居住隔离度/行业归属的
        事前编码),不由"是否已爆发"回填。
      - 预存组织密度:协会/工会/宗亲会/教会/同乡会登记数+民族志记录+居住/就业/宗教参与数据,
        不由"是否爆发"事后补认。
      - 改革渠道可信度:制度结构事实(成文选代/申诉/司法救济/迁移条款)+非结局侧程序事实(在
        常规非危机运作中是否被例行援引执行),不由"是否已爆发"反推、不由"长期无行动"反推"
        必有渠道"。
      三轴异源、各自独立测、anti-talisman_clause 双向禁反推 ⇒ 不判 required。

      残留【中型软点,should】:自变量间存在概念重叠——(1)"不公集中在可辨识群体且持久化"本身
      【部分暗示】(3)"改革渠道可信度低"(若改革渠道真可信,系统性不公不会在组织化的可辨识群体
      上长期维持);且(1)"可辨识群体"通常已自带某种(2)"组织/网络"(可辨识本身就是由共享身份/
      空间/制度维持的)。这不焊死测量轴(各自表面指标仍可独立编码),但增加了实证中三条件独立
      编码的难度:编码者可能受"不公持久→渠道必低可信"的直觉污染,即使有 anti-talisman 约束。
      宜在 primary_suspect 或 measurement 段显式注记此内生性风险(见 should ⑤)。
    scope_hook_independent_of_result: |
      基本不命中。excluded_outcomes:
      (1)"偶发/孤立不公事件(非系统性)"——按不公是否持续/跨个体/有模式判定,事前划,做对。
      (2)"短期被外部镇压压制而暂无行动"——镇压的在场由独立证据(军警部署/戒严/镇压记录)测,
      不由"无行动"反推"必被镇压"。这是主要的 falsifiability 承载口:镇压撤除/减弱后若仍无
      行动,才命中空格。钩子按事前渠道划、不按结果开脱 ⇒ 合规。

      残留【中型软点,should】:排除钩子(2)在实践中覆盖面极广。几乎所有"三条件全满足却无行动"
      的案例都可被此钩合法消化——因为条件(3)"无改革渠道"本身就是非民主政体的结构特征,而非
      民主政体几乎必然配备某种镇压能力。空间的实战测试窗口——"镇压已撤除/减弱、三条件仍在、
      仍无行动"——极端罕见。这不等于理论不可证伪(逻辑上仍可证伪),但意味着 falsifiability(a)
      的实战可测性极低。宜诚实标注此实操限制(见 should ③),但不判 required。
    criterion_tier_match: |
      不命中(学到 DED-006)。三自变量均明列连续谱:不公集中度连续(资源差距量+可区分度非二分)、
      预存组织密度按"有/无/不明"三级实用归类但底层连续、改革渠道可信度连续(纸面有从未兑现=
      低可信)。被预测量"集体行动爆发"包含规模谱(≥小规模地方事件,阈值 N 设定影响灵敏度但
      非硬二分)。预测使用比较语言("概率显著高于")而非刚性二分。合规。
    anti_talisman_cashed: |
      大体兑现(should 级残留)。承重锚里至少一个真独立测出驱动量:
      - 法国大革命锚:等级制度(成文法)独立确定第三等级 vs 特权等级群体可区分度;三级会议召集
        记录+俱乐部登记独立确定预存组织;显贵会议失败/高等法院被压制记录独立确定改革渠道关闭。
        均不由"1789 爆发了"反推。
      - 1989 东欧锚:精英-大众差距由经济统计独立测;教会/工会由登记/民族志独立测;一党制宪法
        规定独立测改革渠道关闭。
      - 罗斯福新政前美国工人阶级锚:工会(预存组织)+投票权(改革渠道)→走选举+罢工谈判而非
        暴力革命,双侧均独立测。
      anti_talisman_clause 明文三量双向禁反推:"不得因爆发了就事后认定必然集中/不得事后补认
      隐性网络/不得因爆发就反推必无渠道,尤不得遇反例硬塞隐性镇压/隐性渠道来消化"——防线在位。
      残留:驱动量对被预测量的定量驱动是断言多、逐案编码数据少(confidence 已诚实降 moderate/
      weak-moderate)。不判 required。
    anchor_fact_check: |
      无 DED-007 式致命事实错。逐锚核:
      - 法国大革命前第三等级(三条件全满足→爆发):等级制(成文法确定群体边界)✓;三级会议
        +俱乐部网络(预存组织)✓;1787-88 显贵会议失败+高等法院压制(改革渠道关闭)✓。标准史,
        无事实错。唯"改革渠道关闭"是多因交织(路易十六实际召开了三级会议,本身可视为改革尝试),
        作方向性支持诚实降 moderate,非事实错。
      - 1989 东欧(三条件全满足→爆发):经济停滞+政治压制集中在'公民 vs 党国精英'的群体
        可区分度 ✓;教会/工会/知识分子网络存在 ✓;一党制无轮替+无独立司法 ✓。标准史。
      - "三缺一(无预存组织)→犬儒非行动"(原子化社会):声称某些社会不满广泛但原子化无组织
        →长期犬儒。此锚是理论最弱 empirical leg——证否组织存在方法论上极难(见 should ④),
        作者自标 confidence=weak-moderate,诚实。记 should,非 required 事实错。
      - "三缺一(有改革渠道)→制度化表达非革命"(罗斯福新政前美国):工会+投票权→走选举+
        罢工谈判 ✓。标准史。
      四锚无致命事实错 ⇒ 不判 required。

      【should】"原子化社会→犬儒"锚是 theory 最软实证腿:证明"无任何预存组织/网络(正式或
      非正式)"在史料中几乎不可能——组织存在的 positive evidence 易找,但证明其 absent 需要
      全面调查所有可能网络形式(同村/同厂/同堂会/同教会/邻里⋯),在实际研究中极少能做到。
      宜将此锚 confidence 再降一级至 weak 或改列为 boundary_case(见 should ④)。
    definition_vs_prediction: |
      通过。关键条件均有独立于结果的可操作化定义:
      - "不公集中在可辨识群体":不是"因为爆发了所以认定集中",而是由资源差距统计+群体可区分度
        事前编码测。
      - "预存组织":不由"爆发了→必然有隐性网络"反推,由登记/民族志/居住就业独立测。
      - "改革渠道可信度":不由"爆发了→必无渠道"反推,由制度结构+非结局程序事实测。
      三条均为可证伪的经验预测(非必然为真的定义):
      - (i)"满足三条件→爆发概率显著高于仅二或一":可被实证推翻。
      - (ii)"三缺一→不公转犬儒不转行动":可被实证推翻(见 falsifiability(c))。
      - (iii)空格的"三条件全满足 + 长期无行动(非镇压)":可被实证推翻(falsifiability(a))。
      合规,不判 required。
    enumeration_and_species: |
      不命中(本推论非 N-species 穷举枚举结构)。三条件不是声称穷尽的"物种"划分,而是联合必要
      条件,自变量均为连续谱。我仍按 DED-008 精神主动探"第 4 条件":
      - 触发事件(precipitating incident/trigger):许多社会运动理论强调即使条件具备,仍需一个
        具体事件(警察暴行/物价暴涨/特定政策)作为导火索。三条件可能只创造'革命潜势',触发事件
        是额外的必要成分。若触发事件是独立必要条件,则"三条件全满足却无行动"的案例可能仅因
        "无触发事件"而被空格预测为"不可能"——非真空格。
      - 反辩:在"系统性不公 + 集中群体 + 组织 + 无改革渠道"的条件下,触发事件近乎内生生成
        (压迫本身持续产出触发事件)。若此辩护成立,则三条件已足以预测行动,触发事件是机制内
        环节而非独立第 4 条件。
      - 判断:此是理论边界而非净杀。若未来实证显示"三条件全满足 + 独立证明确实无触发事件 +
        长期无行动(非镇压)",则标志触发事件是独立必要件、须补入。当前无此实证 → 不判 required。
      另探"第 4 条件备选——领导/企业家":集体行动常由特定领导者/运动企业家发起。但 leadership
      本身可从预存组织中涌现(工会领袖/宗教长老/社区头人)、近内生,非独立第 4 条件。攻不穿。
    primary_suspect_aim: |
      【指对,但漏了更棘手的隐腿——should】。文件自认最弱腿:"三条件是否比双条件(不公集中+
      预存组织)真正增加预测精度——即'无改革渠道'是否独立贡献"。这是正确指认——条件(3)的
      独立增量贡献是整个理论最易受攻击的腿。作者诚实将此列为 primary_suspect,并纳入
      falsifiability(b)"双条件预测精度与三条件无异→证伪联合效应"——做法正确。

      但文件漏认另一条可能更棘手的隐腿:【三个自变量之间的概念内生性】。"不公集中在可辨识群体
      且持久化"本身就(1)部分暗示"改革渠道不可信"(否则不公会通过渠道被消解),(2)通常意味着
      群体已自带某种组织/网络(可辨识群体之所以'可辨识'恰因共享身份/空间/制度)。这使三条件
      的独立性在实证编码中可能低于理论声称——与 primary_suspect 所指的"双条件 vs 三条件预测
      精度"是不同的攻角(一个攻条件间内生重叠、一个攻增量预测力)。宜在 falsification_trace
      增列 secondary/tertiary suspect 或至少在 measurement 段显式注记此内生性(见 should ⑤)。

      另:true 平凡化检查(上位泛化后是否被稀释成相邻常识):抽掉"公识焦点机制"后,"你需要
       grievance + organization + no-alternative-channel 才能有 collective action"≈社会运动
       101 —— 与 McAdam/Tarrow/Tilly 的政治过程模型、McCarthy-Zald 的资源动员理论的实质
       重叠度高于 discriminant_validity 目前披露的(只对表了 Gurr 1962/1970)。这本身不塌核
       心(see should ①),但加总后真实 delta 比文件自述的更窄,primary_suspect 宜点明。
  counterexample_hunt: |
    主动构造 falsifiability(a) 的核心靶——"不公集中在可辨识群体(独立测)+ 预存组织/网络
    (独立测)+ 无任何可信改革渠道(独立测)+ 长期持续感知不公 + 长期无集体抗议/革命 + 非镇压
    压制可解释"——的干净案例,刻意攻空格,认真搜历史/跨文化实例:

    - 苏联乌克兰大饥荒(Holodomor,1932-33)【最强一击,被消化】:不公高度集中(乌克兰农民=
      可辨识群体,语言/地域/职业边界清晰);预存组织在场(村社/教会/集体化前合作社残留);改革
      渠道实质性关闭(一党制/无独立司法/无退出)。却发生毁灭式征粮(~数百万死)而非抗争。表面
      近空格。消化口:(a)苏联【别处供秩序】——整体是供秩序的坐寇式国家,按排除钩子非(a)的
      "零秩序";(b)动机为政治/意识形态(碾碎集体化抵抗+惩罚民族主义),落在理论"资源榨取优化"
      射程外;(c)镇压在场(OGPU/NKVD+军警部署)=排除钩子#2 适用。被三个合法消化口关住。

    - 孟加拉 1770 大饥荒(东印度公司)【次强,被消化】:不公集中在孟加拉农民(可辨识地域群体);
      预存组织在场(zamindar 网络/村社);改革渠道在莫卧儿衰落后关闭;却在公司治下发生毁灭式
      征取致~1/3 人口死亡、未见大规模集体抗议。消化口:(a)实际征取者为年/五年短约包税人
      (zamindar/amil)——个人 horizon 短=boundary 1(短任期代理),且包税契约期是事前结构事实、
      非事后回填;(b)公司轨迹朝坐寇移动(1793 永久 settlement→规则化田赋+产权秩序)=可逆支持;
      (c)镇压在场(公司军警)。被消化。反哺"测行使者 horizon"逻辑。

    - 波托西米塔(Potosí mita,约 1545-1825)【被消化,揭出次级洞察】:精密殖民行政/司法秩序
      在场;却以 mita 强制劳役制度毁灭式榨取安第斯再生劳力(社区人口崩溃)。【不】证伪核心:
      白银=存量税基→榨尽是预测所期;安第斯劳力在此被当作服务于存量榨取的'可替换投入'。但
      揭出坐寇端"供秩序"与"保全税基"【可解耦】——有秩序≠保全再生基——为 should 级边界
      洞察,不杀核心。

    - 太平天国前华南(约 1840-1850,鸦片战争后十年)【被消化,反成支持】:不公集中在华南农民+
      客家群体(可辨识,族群/地域边界清晰);预存组织在场(天地会/客家宗族/村社网络);清廷改革
      渠道在华南地方层面因腐败/效率实质关闭(Great Divergence 文献争,但按 theory 自身判据:
      纸面申诉机制在华南常规运作中未对普通务农者/客民有效兑现→低可信)。约十年间(1840-约1850)
      表面无大规模集体行动。消化口:(a)此十年恰是条件积累期——1850 年金田起义=临界爆发,正是
      预测所期,非'长期始终无行动';(b)天地会网络本身在场=预存组织,其从隐性→公开动员=组织
      被激化的过程。被消化为"条件积累→临界爆发"的支持锚(Tunisia 同型 boundary case)。非净杀。

    - 罗马共和国末期(Servile Wars 间歇期,约 135-104 BCE)【被消化】:奴隶=可辨识群体(法律
      身份边界清晰);部分隐性组织(大庄园 ergastula 中的共同居住+隐性通信网络);无任何改革
      渠道(奴隶法律上非人、无申诉/退出/代议)。约 30 年间(135→104)表面无大规模集体行动。
      消化口:(a)镇压极强——军团常驻西西里+decimatio 威慑+奴隶系统解除武装=排除钩子#2;
      (b)135-132 BCE 第一次西西里奴隶战争→104-100 BCE 第二次=恰是"条件积累→临界爆发",
      非'长期始终无行动'。被消化。

    - 当代厄立特里亚(独立后,1993-至今)【被消化】:不公集中在可辨识群体(逃避兵役者/宗教少数
      派/反对派);预存组织(宗教网络/氏族结构/侨民网络);无改革渠道(宪法从未实施/无选举/无
      独立司法/无自由媒体)。约 30 年无大规模集体行动。消化口:镇压极强(无限期国民兵役=全国
      劳改营化+全面监控+射杀越境者+侨民家属连坐)=排除钩子#2。镇压由独立事实(UN 人权报告/
      Amnesty International/HRW 记录)测,不由"无行动"反推 ⇒ 消化合法。非净杀。

    最强两击(Holodomor/孟加拉)均被现有机制合法消化、消化判据均可由事前结构事实测 ⇒ 无干净
    Type-A 净杀存在。空格在【实操中极端难测】(排除钩子#2 覆盖面极广),"镇压已撤除/减弱 + 三条件
    仍全满足 + 仍无行动"这一测试窗口极窄——这是 should ③ 的核心关切,但非逻辑上不可证伪。

    结论:【未净到 scope 内活反例】。verified 硬门第 2 条【通过】。
  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发】。falsifiability(a) 给出了明确的证伪条件——找到"三条件
    全满足(各自独立结构测) + 长期不公 + 镇压撤除/减弱后仍无行动"。这一格在逻辑上可被反例
    填满、非同义反复(不被砖平凡强制)——与 DED-004 的"唯一新意被实证推倒、改措辞也救不活"
    完全不同。实操上空格极难测试(见 should ③),但那是测试窗口窄的问题,非循环不可证伪。

    进一步检查是否残留 DED-004 式"事后开脱"活门:
    - anti_talisman_clause 明文禁"遇反例硬塞隐性镇压/隐性渠道来消化"——防线在位。
    - excluded_outcomes(2)的镇压在场由独立证据(军警部署/戒严/镇压记录)测、不由"无行动"反推
      ——循环读法被堵。
    - "三缺一→犬儒"预测的防循环:若遇"三条件全满足却犬儒化(非行动)",不可辩称"其实组织不够
      密/渠道其实有"——因为条件须由事前指标独立测、遇反例须承认空格被填。防线在位。

    DED-007(焊死测量轴):【未复发】。三轴(不公集中度/预存组织密度/改革渠道可信度)异源、各自
    独立测、连续谱对齐、anti-talisman 双向禁反推。不公集中度不由"是否爆发"回填、组织不由"是否
    爆发"补认、改革渠道不由"是否爆发/是否犬儒"反推 ⇒ 无 DED-007 式自变量偷用被预测量之焊死。
    残留:自变量间概念重叠(见 should ⑤)是相关/内生性问题,非刻意焊死 ⇒ 不复发 DED-007。
  required_fixes:
    - |
      [should] 判别效度补表资源动员理论/政治过程理论。当前 discriminant_validity 只对表了
      Gurr(1970)和 Davies(1962)——这是 grievance→revolt 范式的早期代表,但集体行动/社会运动
      研究自 1970s 已发展出资源动员理论(McCarthy & Zald 1977)、政治过程模型(McAdam 1982;
      Tarrow 1994)和综合框架(McAdam, Tarrow & Tilly 2001,"Dynamics of Contention")。这些
      框架明确将"组织资源/动员结构"和"政治机会/渠道关闭"作为集体行动的关键条件——与 DED-017
      的条件(2)(3)高度重叠。DED-017 的真实 delta——相对于已经在文献中独立建立的因素——比目前
      声明的更窄:真正新增的是①"三条件的联合必要性(crisp all-or-nothing)"而非分别促进的全谱,
      ②"缺一→犬儒"的渠道切换预测,③"不公作为公识焦点"的协调机制定位。建议比照对 Gurr/Davies
      的处置,新增对 McAdam/Tarrow/Tilly/McCarthy-Zald 的判别段,诚实把真实 delta 收窄到①②③
      并注记条件(2)(3)本身在文献中已有广泛覆盖。
    - |
      [should] 补实"公识焦点→协作成本爆降"机制。当前 statement 断言"不公公共知识化→协作成本
      爆降→集体行动从非理性变成个人理性"但未讲清公识如何解决 Olson 的搭便车问题。公识(the
      "everyone knows everyone knows" regress)在理论上可支撑 assurance game 型协调(我参与
      if 预期足够多人参与),但搭便车问题不仅靠 assurance 解决——还需解答第一行动者的风险由谁
      承担。BR-L2-014(第三方惩罚→有人出头则同群分担成本)给了部分回答但未闭合"第一行动者"
      问题。宜在 derivation 步 6 或新增"mechanism"段补一句:公识降低的是【协调不确定性】(不
      确定别人会不会动),第一行动者风险由 BR-L2-014 成本分担 + BR-L2-006 内群体尊重(抢先出头
      获得群体内地位/声誉收益)联合承担——或给出更诚实的"此机制链路仍为 coarse-grained,精确
      微观基础待后续推导"admission。不补则 mechanism 是断言多推导少。
    - |
      [should] 诚实标注排除钩子(2)"镇压"覆盖面及空格实战测试窗口。排除钩子#2("短期被外部镇压
      压制而暂无行动")覆盖面极广——几乎所有"三条件全满足却无行动"的观察案例都可被此钩合法
      消化(因条件(3)无改革渠道≈非民主政体,而非民主政体几乎必然配备镇压)。falsifiability(a)
      空格的实战测试窗口——"镇压已撤除/减弱、三条件仍在、却仍无行动"——在现实数据中极端罕见。
      这【不等於】理论不可证伪(逻辑上仍可证伪、窗口仍存在),但实操上讲,通过此窗口检验核心命题
      的机会近乎为零。宜在 excluded_outcomes(2) 或 falsifiability 段增一句"注:此条件导致
      falsifiability(a)空格的实战测试窗口极窄,本推论的证伪主要依赖(b)(c)两条而非(a)"——
      诚实标注但不改变逻辑结构。
    - |
      [should] 降级"原子化社会→犬儒"锚的 confidence 或改列 boundary_case。"三缺一(无预存
      组织)→犬儒非行动"锚被标 confidence=weak-moderate,作者已诚实。但证明"无任何预存组织/
      网络的缺席"方法论上近乎不可能——组织在场有 positive evidence 易找,其 absent 需全面
      排除一切可能网络形式(同村/同厂/同堂会/同教会/邻里/共同仪式⋯),在各历史/人类学研究中
      极少满足。当前 weak-moderate 仍偏乐观。建议:要么降 confidence 至 weak 并在 limitations
      注明"负证据难题"(proving the negative of no organization),要么将此锚改列为 boundary_case
      (待更严民族志验证)。此是理论最软锚,诚实降级保护整体 credibility。
    - |
      [minor] primary_suspect/falsification_trace 增列自变量间内生性风险。当前 primary_suspect
      只指"三条件 vs 双条件预测精度",漏了另一棘手的隐腿:三自变量间存在概念内生性——"不公集中
      在可辨识群体且持久化"本身就(部分暗示)改革渠道低可信(否则不公应被渠道消解)、(通常意味)
      群体已自带某种网络(可辨识性本身由共享身份/空间/制度维持)。这不焊死测量轴(各自表面指标
      可独立编码),但增加了实证编码独立性挑战——编码者的"不公持久→渠道必低可信"直觉即使在
      anti-talisman 约束下也可能污染判定。宜在 falsification_trace 增列"secondary/tertiary
      suspect:自变量间概念重叠 → 独立编码挑战 → 三条件联合必要性的实证检验力被稀释",使读者
      不被"三条件在 operationalization 中独立测"的表面印象误导。

