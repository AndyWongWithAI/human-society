id: ADV-REVIEW-050-DED-045
type: adversarial_review
reviews: DED-045
layer: L3-deductions

人话摘要: |
  DED-045（AI承诺装置×现时偏向：财务命运的分叉放大器）对抗审查 round_1 存档。
  裁 needs_revision——核心增量（BR-L2-026的AI能力×BR-L2-030的现时偏向→对称预测+
  分叉效应）是真跨砖合成，不在任何单块承重砖中，操作化诚实（多条预注册口径+强
  anti-talisman clause），但两条 required（"同一技术栈"对称声称缺乏实证支撑、
  因果识别问题严重性被低估致实操证伪力存疑）挡在 verified 门前。反例猎捕
  （robo-advisor 储蓄率中性效应）未获净杀但暴露"AI金融工具≠AI承诺装置"的构念
  间隙。未重蹈 DED-004/007 致命循环。

target: DED-045
protocol: |
  Rule B 独立对抗审查（作者≠审查者，全新独立上下文，与作者无关）。评分卡红旗 13 条
  逐项攻 + 反例猎捕（必做）+ DED-004（不可证伪循环）/DED-007（测量轴焊死）复发检查。
  裁决三态照评分卡：verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活反例
  ③不重蹈 DED-004/007。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新独立上下文, 与作者无关)"
  verdict: needs_revision
  verdict_note: |
    这是一条【核心增量属真跨砖合成、操作化诚实但两条结构性缺陷挡在 verified 门前】
    的候选推论。BR-L2-030（现时偏向）不含"AI"，BR-L2-026（AI-human信息不对称）
    不含"目标函数分歧"或"现时偏向对称放大"——两砖合力产出的"同一技术栈×不同目标
    函数→相反方向的财务行为效果"是真组合增量。

    推论的强项：
    (1) 操作化诚实——三条预测(a)(b)(c)的证伪条件均一次性注册了统计量、时间窗口、
    对照组设计，明确"不得事后调整"。
    (2) Anti-talisman clause 强劲——五条硬约束覆盖了最常见的反推逃逸路线（事后
    追封目标函数、诉求更长时间窗口、用幸福感替代储蓄率消解、商业模式转向后反推
    原始编码错误），对称保护到位。
    (3) 自认最弱腿准确——primary_suspect 指目标函数编码客观性，secondary 指(b)的
    超额分量跨平台识别困难，两条都是真实弱点。
    (4) 现实锚诚实标注——三个 anchor 均标注了 confidence level 和局限性（平台自报、
    选择效应未剥离、非独立学术验证），不做过度声称。

    两条 required 缺陷：

    (1)【"同一技术栈"对称声称缺乏实证支撑（required）】
    推论声称"同一技术栈(推荐引擎/行为追踪/实时个性化)接入不同目标函数产生相反方向
    的财务行为效果"。但实际案例不支持此声称：用户资产型AI（Acorns的round-up规则、
    预算app的分类算法）使用的是相对简单的规则自动化，平台营收型AI（Amazon推荐引擎、
    抖音兴趣电商）使用的是复杂ML推荐系统——两侧的技术实现差异巨大。在BR-L2-026的
    抽象层面（无限记忆/不疲劳/并行处理），"同一技术栈"可勉强成立（都是软件系统），
    但在这个抽象程度上，"同一技术栈"已退化到"都使用了计算机"的平凡层次——失去
    了 discriminant_validity 中对抗"科技中性论"所需的锐度。更诚实的位置是：
    承认两侧使用了不同的AI技术实现，但共享BR-L2-026的信息处理不对称作为共同基底——
    对称性不在于"同一套代码"，而在于"同一套能力剖面被接入相反目标函数"。
    → 此缺陷影响 discriminant_validity 中 vs "科技中性论"的判别力，但不影响三条
    核心预测(a)(b)(c)的可检验性——预测不依赖"同一技术栈"声称。

    (2)【因果识别问题严重性被低估——实操证伪力存疑（required）】
    文件将自选择（selection effect）列为 secondary_suspect 的"次致命场景"，但此问题
    的严重性可能被低估。用户选择AI产品不是随机的：本来就爱存钱的人选择用户资产型AI，
    本来就爱花钱的人暴露于平台营收型AI。DiD + 倾向得分匹配只能部分消化此问题——
    可观测变量（收入/教育/年龄）可匹配，不可观测变量（时间偏好/自控力/财务焦虑）
    无法匹配。而不可观测变量恰是BR-L2-030（现时偏向）的核心——现时偏向本身就是
    不可观测的个体差异！这意味着：选择效应与处理效应共享同一个构念根源（个体的
    现时偏向程度）→即使最精细的匹配也无法干净分离。
    后果：若所有用户资产型AI用户的储蓄率提升均可被"他们本来就更能存钱"解释，
    预测(a)在实操中无法被干净证伪——不是因为逻辑循环，而是因为真实世界不提供
    所需的准实验变异。此缺陷不使推论 rejected（许多经济命题面临同样困境，逻辑上
    仍可证伪），但作者应诚实标注：干净识别所需的"目标函数的外生变异源"是什么？
    是否存在？若不存在，（a)(b)(c)的实证检验本质上停留在"一致性证据"
    （consistent evidence）而非"因果证据"（causal evidence）层面。
    → 此缺陷影响 verified 所需的第一条（无 required 缺陷）——因果识别的结构性问题
    是推论的 Achilles heel，不可仅以"DiD+PSM可部分消化"带过。

    综合：非 rejected（核心增量属实、操作化诚实、anti-talisman强劲、反例猎捕未获
    净杀、无DED-004/007致命循环）。两条 required 修复定向可救活 → needs_revision。

  red_flag_findings:
    brick_conclusion: |
      【未命中——核心增量不在任何单块承重砖中，attribution诚实】

      按任务指定的两块承重砖逐字核：

      BR-L2-030（现时偏向/双曲贴现）：
      原文含：双曲贴现的形式特征（a）、即刻可得激励的行为权重畸高（b）、
      对承诺机制的需求（c）、演化适应逻辑、跨文化普适性。
      原文不含："AI"一词完全未出现。不含"AI承诺装置""AI冲动放大器"
      "目标函数分歧""对称预测""分叉效应"。BR-L2-030确立了人类需要承诺
      装置的原因（现时偏向→自我控制失败→需要外部绑定），但未讨论AI是否/
      如何能充当承诺装置，更未讨论AI同时可充当冲动放大器。
      → 不构成 brick=conclusion。

      BR-L2-026（AI-Human信息处理不对称）：
      原文含：AI远超人类的六个维度（工作记忆/推理成本/关系追踪/运作连续性/
      信息摄入速率/多模态并行）、AI系统性缺失的四个维度（具身体验/演化遗产/
      真实情感/死亡意识）、类型差异主张。
      原文不含："承诺装置""冲动放大器""目标函数分歧""现时偏向""储蓄率"
      "对称预测""分叉效应"。BR-L2-026刻画了AI能做什么（无限记忆/不疲劳/
      并行处理），但未说这些能力接入不同目标函数后会产生相反方向的财务行为
      效果——它只说"AI是新型行动者"，没说"AI的财务行为效应方向由目标函数锁定"。
      → 不构成 brick=conclusion。

      两砖合力：BR-L2-030给出"为什么人需要承诺装置"（现时偏向），BR-L2-026
      给出"AI有能力当什么"（信息处理不对称）。两砖中无一砖给出："AI同时是
      最强承诺装置和最危险冲动放大器"这一双面体命题，更未给出"目标函数事前
      编码→财务命运分叉"的对称预测。brick≠conclusion，通过。

      nontriviality_test 中的自查准确——"BR-L2-030不含'AI'，BR-L2-026不含
      '目标函数分歧'或'现时偏向对称放大'"。通过。

    nontriviality_cell_check: |
      【通过——空格预测是真经验主张，不被任何单砖平凡强制】

      2×3 判据表（AI目标函数档：用户资产型/平台营收型/无AI × 储蓄率变化方向：
      上升/不变/下降）：

      逐个空格检验是否被承重砖平凡强制：

      格（用户资产型AI，储蓄率上升）=「非平凡格」：
      BR-L2-030说人需要承诺装置——但传统承诺装置（自动储蓄/SMarT）已经存在，
      AI只是替代品还是增量？BR-L2-026说AI有超人类能力——但能力≠用户会采纳≠
      用户会改变行为。AI能监控预算≠人会服从AI的监控。此格可被现实填为"空"：
      若用户资产型AI产品均无显著储蓄率处理效应→(a)被证伪。→ 非同义反复。

      格（平台营收型AI，储蓄率下降）=「非平凡格」：
      BR-L2-030说人天然偏好现在——但没说AI会把此偏好放大到超过原有水平。
      BR-L2-026说AI处理信息更快——但没说更快的信息处理必然导致更多冲动消费。
      此格可被现实填为"空"：若平台AI用户储蓄率降幅不大于传统电商→(b)超额
      分量被证伪。→ 非同义反复。

      格（用户资产型AI，储蓄率不变）与格（平台营收型AI，储蓄率不变）：
      若被大量填充→分别证伪(a)和(b)。可能填充方式：选择效应完全主导。
      → 空格可被填。

      格（无AI，储蓄率稳定）=「基准格」——与推论预测一致，平凡。

      核心空格（用户资产型AI→升、平台营收型AI→降）均不被BR-L2-030或
      BR-L2-026任何一砖强制。两砖合力也不强制——因为需要额外的"目标函数
      决定AI行为方向"焊接步骤。通过。

    measurement_orthogonality: |
      【主干正交——目标函数从事前产品文本编码，储蓄率从银行账户数据测量，
      两条测量链概念层分离；未重蹈 DED-007 级焊死】

      IV（自变量）——AI目标函数：
      三条信息源均在见任何用户财务数据前编码：
      (1) 产品价值主张——从官网/应用商店描述编码，不依赖用户财务结果。
      (2) 收入模型——从公开财报/定价页编码（订阅费 vs 商家佣金），独立于用户行为。
      (3) 默认设置方向——从产品出厂设置编码，独立于用户行为。
      裁决规则：收入模型优先，三源不一致→混合型（排除）。
      → 测量源独立于DV。

      DV（被预测量）——储蓄率变化：
      银行账户级数据（知情同意）：月度自动转入储蓄/投资账户金额/可支配收入。
      DiD估计量，面板固定效应。
      → 测量源（银行账户流水）独立于IV（产品文档分析）。

      IV和DV的测量链在概念层和操作层均分离——目标函数编码不涉及用户财务数据，
      储蓄率计算不涉及产品文档分析。→ 主干正交。

      潜在薄弱点（不到 DED-007 级）：
      (a) "产品价值主张"的编码涉及判断（"以...为主诉求"），不同编码者可能
      有分歧→但这不是测量轴焊死（IV偷用DV），而是编码信度问题。
      (b) 收入模型优先裁决规则——在实践中有模糊地带（如免费增值模式的app——
      基础功能免费、高级功能订阅、同时赚取推荐费→混合型标记可能过多）。
      → should 级而非 required 级。

      综合：主干正交。未重蹈 DED-007。

    scope_hook_independent_of_result: |
      【合规——三条 excluded_outcomes 均基于可事前独立识别的渠道特征】

      (1) "AI导致一般性财务素养下降"：排除理由为DED-034已独立覆盖，射程限于
      储蓄率与冲动消费指数——此排除基于构念边界（不同被预测量），非事后按结果开脱。
      → 合规。

      (2) "AI同时提供储蓄建议和消费推荐的混合产品场景"：排除基于产品特征的
      事前可编码属性（目标函数编码三源不一致→混合型）——该编码在见用户财务
      数据前完成。→ 合规。

      (3) "非AI驱动的传统金融工具的承诺效应"：排除基于技术类别（AI vs 非AI），
      可事前识别。→ 合规。

      三条排除钩子均基于可事前独立识别的渠道/边界特征，不存在"结果不好就重新
      划射程"的逃逸空间。→ 射程/排除钩子合规。

    criterion_tier_match: |
      【不命中——被预测量为连续量，预测为方向性/比较静态，无 DED-006 式分档失配】

      被预测量（储蓄率变化、冲动消费指数）均为连续量。预测均为方向性：
      (a) 处理效应>0；(b) 平台AI组>无AI组且>传统电商组；(c) 组间储蓄率差
      随时间拉大。自变量分档（用户资产型/平台营收型/混合型）并非将被预测量
      强行二分——而是目标函数这一离散构念的自然分类。混合型排除+仅高频vs非高频
      比较进入主体检验，是对分类粒度的审慎控制。→ 无 DED-006 失配。

      usage_intensity 的分档（高频≥3次/日、中频1-2次/日、低频<1次/日）将
      连续量（使用频次）离散化——这是操作必要性（需要定义"充分暴露于AI"的
      阈值），且仅高频vs非高频比较（将三档归并为二档做假设检验）与预测方向
      匹配。文件已注册"若后续发现日均1次即现饱和效应，需降阈值但不更改推论
      方向"——这是诚实的预注册。→ 通过。

    anti_talisman_cashed: |
      【强在位——五条硬约束概念层干净，覆盖了最常见的反推逃逸路线；
      实操中最脆弱的环节（编码信度/选择效应）不在约束范围内但已诚实标注】

      五条硬约束逐条压力测试：

      (1) 禁止由"储蓄率上升"反推"目标函数=用户资产型"：
      此约束可操作——目标函数编码有独立于财务结果的三条信息源+优先裁决规则。
      实操风险：产品价值主张的编码涉及主观判断，编码者可能（无意中）将"含有
      任何储蓄功能的产品"编码为用户资产型→扩大(a)的支持证据池。但这是编码
      信度问题（需要评分者间信度检验），而非"用DV反推IV"的逻辑循环。
      → 在位。

      (2) 对称保护（禁止由"储蓄率下降"反推"目标函数=平台营收型"）：
      同上对称——在位。

      (3) 禁止诉求"需要更长时间窗口"消解(c)的null result：
      t+12个月一次性注册——若此窗口未观测到分叉效应→(c)被证伪。此约束强硬
      且可操作——事后诉求"需要更长窗口"被明确禁止。→ 在位。

      (4) 禁止用"体验性消费提升幸福感"消解(b)：
      此约束明确区分了被预测量（储蓄率）和替代度量（主观幸福感）——推论可以
      "储蓄率下降+幸福感上升"为真，此时(b)仍被坐实但政策含义窄化。→ 在位。

      (5) 对称保护——禁止用"商业模式转向后"反推原始编码错误：
      t0编码→转向后t1新编码，两段分别检验——不得以t1编码抹掉t0的null检验。
      → 在位。

      综合：五条约束在书面概念层干净、可操作。实操中最脆弱的两环（产品编码
      的评分者间信度、选择效应导致的因果识别困难）不在 anti-talisman 射程内——
      前者属编码 protocol 的精度问题（should），后者属研究设计的结构性问题
      （required，见 primary_suspect_aim）。anti-talisman clause 本身强劲。

    anchor_fact_check: |
      【无致命事实错——三个 anchor 方向正确、局限性诚实标注；两个 anchor 的
      证据强度弱于作者 confidence 评级所暗示的】

      逐个核查：

      (1) Acorns/微众银行——用户资产型AI的承诺效应：
      方向正确——Acorns round-up确实创造了自动储蓄机制，微众银行智能存款
      功能方向一致。作者诚实标注：(a)平台自报数据非独立学术验证；(b)选择效应
      未剥离；(c)AI增量vs传统自动储蓄未被A/B测试分离。confidence: moderate
      是合理的（上限 moderate——未坐实(a)）。
      → 合规，方向正确。

      (2) 电商AI推荐引擎——平台营收型AI的冲动放大效应：
      方向正确——Amazon/淘宝/抖音的推荐引擎确实以GMV/转化为优化目标。行业估计
      （McKinsey: 推荐贡献Amazon约35%销售额）方向一致。作者诚实标注了选择效应
      和缺少储蓄率对比数据。confidence: moderate 是合理的上限。
      → 合规，方向正确。

      (3) "一键下单"vs"购物车冷静期"——对称实例：
      此为定性类比而非定量证据，作者 honest 标注为 weak confidence——恰当。
      但此 anchor 有一个隐藏的过度声称："同一技术栈(支付信息存储+自动化执行)，
      摩擦方向相反——对称性本身是本推论的核心证据形态"。仔细审视：存储支付信息+
      自动化执行是所有电商的基础设施，不特属于AI。Amazon 1-Click（1999年专利）
      并不依赖现代ML推荐引擎——它只是存储+自动化规则，与BR-L2-026的"无限记忆/
      并行处理/毫秒级A/B测试"有概念距离。→ should: 区分"数字化自动执行"
      和"AI驱动的信息处理不对称"——前者是非AI数字技术也可做到的。
      → 此锚不构成事实错，但"同一技术栈"的声称在此例中被过度拉伸。

      三个 anchor 均无事实错。综合合规。一处 should 标注（anchor 3 的
      "同一技术栈"声称过强）。

    definition_vs_prediction: |
      【通过——核心预测均为可证伪的经验主张，非定义性同义反复】

      三条 falsifiability 条件逐条复核：

      (a) 承诺效应口径：若不存在任何编码=用户资产型的AI产品中处理效应显著>0
      的干净证据→(a)被证伪。此条件给出了清晰的统计判定标准（处理效应>0, p<0.05,
      DiD估计量, t+12个月窗口, 倾向得分匹配对照组）→可证伪。

      (b) 冲动放大效应口径：若平台AI组与无AI组的冲动消费指数无显著差异→(b)被证伪。
      若平台AI组储蓄率压低幅度不大于传统电商组→(b)超额分量被证伪。两重证伪条件
      独立且可分别检验→可证伪。

      (c) 分叉效应口径：若两组储蓄率差未随时间拉大（或缩小）→(c)被证伪。
      "退化为'AI有好有坏但无对称放大'的常识，推论降格"——此退路被诚实标注。
      → 可证伪。

      三个条件在逻辑层均可被独立反例推翻。关键条件（目标函数="用户资产型"vs
      "平台营收型"）是操作化定义（从事前产品文本编码），非"若用户多存钱则该
      AI必为用户资产型"的定义性同义反复——anti-talisman (1)(2)明确禁止此循环。
      → 条件是可证伪的预测，非定义。通过。

    enumeration_and_species: |
      【不命中——推论不声称穷举任何类别/物种，但主动猎第N+1类揭示了二分法的
      覆盖盲区（should）】

      DED-045 的核心主张是"目标函数决定AI对现时偏向的放大方向"的对称预测，
      非"N类AI产品可穷举"的类型学。用户资产型/平台营收型/混合型的三分是
      操作化需要（编码裁决），非穷举声称。

      但主动猎"第N+1类"揭示了二分法（用户资产 vs 平台营收）之外的潜在类别：
      - "用户福祉最大化型AI"：优化用户综合幸福感（非仅财务），可能推荐
      健身/教育/心理健康类消费——此类消费减少储蓄但不服务平台GMV。
      - "用户便利最大化型AI"：优化时间节省，推荐外卖/打车/家政——
      同样减少储蓄但非平台营收最大化。
      - "用户参与度最大化型AI"：优化DAU/使用时长（如TikTok的推荐算法），
      间接通过广告→平台营收，但直接目标函数不是GMV。

      按当前编码规则（收入模型优先），这些产品的收入来源各异（订阅/广告/免费+
      增值），大部分会被标记为"混合型"并排除——这本身不是问题（排除=诚实），
      但若"混合型"产品在市场中占主导（如支付宝/微信支付），推论的实证范围
      被大幅压缩。→ should：在 limitations 中诚实标注"纯净目标函数产品的
      市场稀缺性对实证检验样本量的限制"，作者在 boundary_cases 中已部分触及
      此问题（支付宝/微信支付案例），可进一步显化。
      → 红旗未命中，但主动猎捕有产出（should）。

    primary_suspect_aim: |
      【指对了——自认最弱腿（目标函数编码客观性）准确；但有一条更致命的隐腿
      （因果识别的结构性问题）未被充分承认】

      文件自认：
      - primary_suspect：目标函数编码的客观性——若编码不可靠，(a)(b)(c)全部塌缩。
      - secondary_suspect：(b)的"超额"分量——跨平台比较的不可比性。
      - unlikely_suspect：BR-L2-030和BR-L2-026本身——经验基础稳固。

      三条 self-identification 方向准确。primary 和 secondary 都是真实弱点。

      但文件漏认了一条更致命的隐腿：

      【因果识别的结构性问题——选择效应与处理效应共享同一个构念根源（required）】
      用户选择AI产品的行为本身就是其现时偏向（BR-L2-030的核心构念）的表现——
      现时偏向低的人（更能延迟满足）选择用户资产型AI，现时偏向高的人更容易
      被平台营收型AI吸引/捕获。这意味着：选择变量（谁选哪类AI）和被预测变量
      （储蓄率变化）共享同一个深层构念（个体的时间偏好/自控力）作为共同原因。

      此问题的严重性远超典型的"遗漏变量偏误"——不是"我们忘了控制某个变量"，
      而是"需要控制的变量本身就是理论的核心构念，且不可直接观测"。DiD可以
      消除不随时间变化的个体异质性（如基线储蓄倾向），但无法消除"选择AI产品
      这一行为所揭示的时间偏好信息"——因为选择AI的行为发生在baseline和
      follow-up之间，恰是DiD试图识别处理效应的窗口。

      这不是逻辑不可证伪（可以设想理想实验：随机分配用户到用户资产型AI vs
      平台营收型AI），而是实操不可证伪（该实验在真实世界中不可行——不能强迫
      用户使用不符合其偏好的AI产品，即使技术上可行也面临伦理障碍）。

      文件将选择效应列为 secondary_suspect 中的"次致命场景"，但此问题的严重性
      可能超过 primary_suspect——因为即使目标函数编码完美可靠，因果识别仍然
      可能失败。→ required：作者应诚实标注此问题的结构性质（不仅是"需更精细
      的匹配"），并讨论是否存在可操作的外生变异源（如：产品因监管/市场原因
      被迫改变目标函数→自然实验？平台A/B测试中随机分配推荐算法强度？）。

      平凡化检查：抽掉三个非平凡增量（对称预测+分叉效应+目标函数事前编码）
      后，推论坍缩为"AI可帮人存钱也可让人花钱"——正是"科技中性论"的常识。
      推论的非平凡性完全依赖于目标函数编码的对称预测→自认的 primary 准确
      覆盖了脆弱链。但平凡化后暴露了更根本的问题：如果对称预测因因果识别
      困难而无法实证检验，推论退化为不可检验的"AI双面体"叙事。→ 通过平凡化
      检查（作者自认正确），但实操证伪力存疑（见 required fix #2）。

    data_source_common_root: |
      【不命中——推论不依赖经济/统计数据源的多源验证】

      本推论的实证锚点（Acorns/Amazon等）不涉及经济统计机构（CNBS/WB/IMF）
      的多源数据交叉验证。此红旗不适用。

    api_epistemology_confusion: |
      【不命中——推论不涉及将API可及性冒充认识论独立性】

      本推论的操作化不涉及通过API/MCP查询经济数据库来建立"多源独立证据"。
      此红旗不适用。

    caliber_registration: |
      【通过——关键阈值的分子/分母/测量口径已一次性注册；但"产品价值主张"的
      编码口径存在评分者间信度的未解决问题（should）】

      三条预测的统计口径逐一核查：

      (a) 承诺效应口径：
      - 分子：AI助手启用后t+12个月的储蓄率DiD处理效应。
      - 分母：可支配收入。
      - 对照组设计：倾向得分匹配（同收入分位/同年龄/同教育/同基线储蓄率）。
      - 统计阈值：处理效应>0, p<0.05。
      → 口径完整注册。

      (b) 冲动放大效应口径：
      - 双重比较：(b1)平台AI高频用户 vs 同平台无AI用户；(b2)平台AI高频用户
      vs 传统电商匹配用户。
      - 冲动消费指数分子：同时满足≥2/3指标（未计划购买<5min+推荐触发<3min+
      预算外溢出）的消费金额。
      - 分母：月度总消费支出。
      - 5分钟/3分钟阈值一次性注册，明确"不得事后调整"。
      → 口径完整注册。

      (c) 分叉效应口径：
      - 用户资产型AI组 vs 平台营收型AI组的储蓄率差（t+12个月DiD）。
      - 比较基准：两组基线储蓄率差。
      - 判定：AI组间差 > 基线组间差 → 分叉成立。
      → 口径完整注册。

      目标函数编码的注册：
      - 三源编码协议已注册（产品价值主张/收入模型/默认设置方向）。
      - 裁决规则：收入模型优先，三源不一致→混合型（排除）。
      - limitations 已标注"产品可能说一套做一套"。

      未注册项（should）：
      - "产品价值主张"的编码缺乏评分者间信度（inter-coder reliability）协议——
      "以...为主诉求"的判断在边界案例中可能产生编码分歧。建议至少注册双盲
      编码+Cohen's κ≥0.7 的最低信度要求，或提供编码示例锚定判断标准。
      → 此缺口不违反"一次性注册"规则（三项信息源+裁决规则已注册），但实操
      编码一致性未保障。→ should。

      综合：关键口径已注册，未违反 L4-009 判例的事后口径选择禁令。should 标注
      编码信度缺口。

  counterexample_hunt: |
    【四路猎杀，均未获 scope 内净杀反例；一路暴露"AI金融工具≠AI承诺装置"的
    构念间隙（should）】

    === 猎路 1：Robo-advisor 储蓄率中性效应——攻击预测 (a) ===

    【靶心：Betterment/Wealthfront 等 robo-advisor 用户未显示储蓄率上升】
    Robo-advisor 是编码上干净的用户资产型AI：收入=AUM管理费（用户付费），
    价值主张="帮你更聪明地投资/增长财富"，默认设置导向投资组合配置。
    它们使用AI进行投资组合优化——符合BR-L2-026的无限记忆（全市场数据）、
    不疲劳（自动再平衡）、并行处理（多资产同时优化）。
    现有证据（如Fisch et al. 2020对robo-advisor采纳者的分析）表明：
    robo-advisor用户的主要行为变化是资产配置迁移（从现金/自助交易转向
    自动化管理组合），而非总储蓄率上升——用户将已有储蓄从银行账户转入
    robo-advisor，但储蓄/收入比未显著变化。

    消化分析：此案例不构成(a)的净杀，因为：
    (i) Robo-advisor 不实现"承诺装置"的核心功能——它们没有自动递增储蓄
    （不像SMarT每年涨薪时自动提高储蓄率）、没有条件消费锁定（消费超阈值
    时延迟执行）、没有预算监控。它们做的是"已有储蓄的最优配置"而非"创造
    新储蓄"。推论的核心机制是"AI作为承诺装置绑定未来自己的手"——robo-advisor
    不解这个功能。
    (ii) 推论的操作化明确要求AI理财助手提供"自动递增储蓄/条件消费锁定/
    预算监控"功能——robo-advisor通常不满足此功能清单。

    关键启示：此案例暴露了"AI金融工具"和"AI承诺装置"的构念区分——
    推论预测的不是"任何AI金融产品都能提升储蓄率"，而是"实现了承诺装置
    功能（自动递增+条件锁定+预算监控）的AI产品才能提升储蓄率"。当前
    real_world_anchors 中 Acorns 更接近此功能清单（round-up自动储蓄），
    Betterment/Wealthfront 则不够格。→ should：在 operationalization 的
    ai_objective_function 中显式区分"AI承诺装置功能清单"和"一般AI金融服务"——
    确保实证检验不被"AI金融产品"的宽泛定义稀释。

    【结论：未净杀——robo-advisor 的零效应可被"未实现承诺装置功能"消化。
    但暴露了"AI金融工具≠AI承诺装置"的构念间隙。】

    === 猎路 2：TikTok/Douyin 兴趣电商的"参与度最大化"目标函数——攻击编码二分法 ===

    【靶心：TikTok的推荐算法优化"用户使用时长"（参与度），非直接优化GMV】
    TikTok/Douyin的核心推荐目标函数是最大化用户参与度（观看时长、互动率），
    GMV是间接KPI（通过广告和兴趣电商变现）。按编码规则：
    - 产品价值主张："记录美好生活"/"发现有趣内容"——非"猜你喜欢"的购物导向。
    - 收入模型：广告费+电商佣金→平台营收型。
    - 默认设置方向：内容消费（非消费推荐）。
    裁决：收入模型优先→平台营收型。但此编码掩盖了一个微妙差异：TikTok的
    直接目标函数（参与度）可能通过"时间替代效应"（刷视频代替工作/学习→
    收入下降→储蓄下降）而非"冲动消费"渠道影响储蓄率——不同于Amazon/
    淘宝的"推荐→点击→购买"的直接消费驱动。

    消化分析：按收入模型编码为平台营收型→纳入(b)的检验。若TikTok用户的
    储蓄率下降但冲动消费指数（按(b)的三重指标）不上升→(b)可能因"平台AI
    用户储蓄率下降但非通过冲动消费渠道"被部分证伪——推论需澄清(b)的渠道
    特异性：是"通过冲动消费渠道"还是"任何渠道"的储蓄率下降？当前操作化
    中(b)的两个比较（vs无AI + vs传统电商）均聚焦冲动消费指数，暗示渠道
    特异性——但 falsifiability (b) 写的是"储蓄率显著低于对照组"（未限定
    渠道）。→ should：澄清(b)的被预测变量是"冲动消费指数"还是"储蓄率"——
    两者在 falsifiability 和 operationalization 中不完全对齐。
    （深入核查发现：falsifiability (b) 明确写"其冲动消费指数...显著高于"→
    被预测变量是冲动消费指数，储蓄率下降是从冲动消费上升推导的二级预测。
    此对齐问题不大——但可进一步澄清储蓄率下降与冲动消费上升之间的经验
    关联强度是否被预设为1。）

    【结论：未净杀——TikTok案例可被编码规则消化（归入平台营收型）。但暴露
    了(b)中冲动消费指数与储蓄率下降之间的预设关联需要更诚实标注。】

    === 猎路 3：中国传统"会"（ROSCA/合会）——非AI承诺装置的强储蓄效应 ===

    【靶心：传统合会（标会/轮会）在无AI的情况下产生显著的储蓄纪律效应】
    合会成员定期缴纳固定金额，轮流获得全体缴款——这是一个强承诺装置：
    社会压力+结构化规则绑定了成员的储蓄行为。大量实证文献（如Besley et al.
    1993, Gugerty 2007）证明合会显著提高了低收入群体的储蓄率——无任何AI参与。

    此案例不构成(a)的反例——因为合会不是AI产品，(a)的预测是比较"AI承诺
    装置 vs 无AI对照组"，合会属于"有无AI"这一自变量的"无AI"端（参照组
    内部的子类），不影响"AI承诺装置有增量效应"的检验。

    但此案例挑战了推论的 discriminant_validity (2) 中"AI承诺装置比传统承诺
    装置（SMarT）更强"的声称。合会的储蓄纪律效应在某些实证研究中与SMarT
    相当甚至更强（依赖社会资本密集度）→若合会效应≥AI承诺装置效应，则
    "AI是更强的承诺装置"的声称需要收窄（"AI比传统自动化承诺装置更强"而非
    "AI比所有非AI承诺装置都强"）。

    【结论：未净杀——合会在"无AI"参照组内，不直接证伪(a)。但 discriminant
    validity 中"AI更强"的声称过于宽泛→ should：限定比较对象为"传统自动化
    承诺装置"（如SMarT/401(k) auto-enrollment），而非所有非AI承诺装置。】

    === 猎路 4：日本"家計簿"（手写记账）文化——低技术承诺装置的广泛有效性 ===

    【靶心：日本家庭主妇长期使用手写家計簿（家庭账本）作为预算监控工具，
    效果显著且无需AI】
    日本的家計簿文化表明：简单的预算追踪（纸笔）已能产生显著的消费约束
    效应——AI的"永不疲劳监控"在此场景下是过度工程（over-engineered），
    边际增益可能很小。

    此案例不构成反例——同猎路3，属于"无AI"参照组。但它强化了一个模式：
    "是否有AI"可能不是储蓄行为的主要 driver——承诺装置的社会嵌入性
    （合会的社会压力、家計簿的文化规范）可能比AI的技术能力更重要。推论的
    核心预测可以成立（AI组储蓄率>无AI组），但效应量的归因（是AI的能力
    还是AI产品附带的用户动机/社会嵌入？）可能不正确。

    【结论：未净杀。但多个低技术承诺装置的高有效性暗示——AI的增量效应
    可能小于推论暗示的幅度。此不改变方向预测但影响政策含义的强度。】

    综合：四路猎杀均未获 scope 内净杀反例。猎路1（robo-advisor）暴露了最重
    要的构念间隙——"AI金融工具≠AI承诺装置"——此区分应在 operationalization
    中显化。猎路2-4提供了边界/强度的 should 级发现。核心预测（a)(b)(c)
    的方向性主张未被任何反例击穿。

  non_recurrence_of_ded004_007: |
    DED-004（不可证伪循环）：【未复发——逻辑层有三个可证伪条件，无概念循环】

    逻辑层：falsifiability (a)(b)(c) 给出了明确的证伪条件，均包含具体的统计
    判定标准（处理效应>0 p<0.05、储蓄率差>0、组间差随时间拉大）。空格可被
    现实反例填充（如：所有用户资产型AI产品的DiD处理效应均不显著>0）。

    概念循环检查：目标函数编码独立于财务结果（从事前产品文档编码），
    anti-talisman (1)(2) 明确禁止由结果反推目标函数→无 DED-004 式"定义即结论"循环。

    实操层两个"缓发证伪窗口"：
    (i) 因果识别困难→"处理效应归零后无法区分'AI真的无效'和'选择效应完全主导'"——
    这不是逻辑免疫（两种可能性均可被进一步证据区分：若有外生变异源→可分离两者；
    若无外生变异源→推论停留在"一致性证据"层面），而是实操证伪力受限。
    → 此问题在 primary_suspect_aim 中已识别为 required fix #2。
    (ii) 目标函数编码模糊→"编码=用户资产型的产品总可被质疑'其实不够纯粹'"——
    此问题通过三源编码+优先裁决规则被大幅约束（不是"作者说了算"），但编码
    信度缺口（should）仍留有一定灵活性。

    两模式均不等同 DED-004 的逻辑不可证伪循环→未复发。

    DED-007（焊死测量轴）：【未复发——主干正交，IV和DV测量链概念层分离】

    主干：IV=目标函数（从产品文档/收入模型/默认设置编码），DV=储蓄率/冲动消费
    指数（从银行账户数据/行为足迹测量）。两条测量链在概念层和操作层均分离——
    目标函数编码不接触用户财务数据，储蓄率计算不涉及产品文档分析。

    与 DED-007（分母用"实际获授者"→IV概念定义依赖于DV）性质根本不同。本案
    的 IV（目标函数）在概念定义和测量层均可与 DV（储蓄率）分离。

    Anti-talisman (1)(2) 进一步锁死"由结果反推编码"的逃逸路线→测量轴的正交性
    有制度性保障（不仅是概念层分离，还有明确的禁止规则）。

    → 未复发 DED-007。

  required_fixes:
    - |
      [required] 修正或诚实限定"同一技术栈"对称声称。当前 discriminant_validity
      中声称"同一技术栈(推荐引擎/行为追踪/实时个性化)接入不同目标函数产生相反方向
      的财务行为效果"——但用户资产型AI（Acorns round-up规则/预算分类算法）和平台
      营收型AI（Amazon推荐引擎/抖音兴趣电商）使用的技术实现差异巨大，在算法层面
      不共享"同一技术栈"。建议两种修正路径（二选一）：
      (A) 将声称收窄至BR-L2-026的抽象层面："共享BR-L2-026的信息处理不对称作为
      共同能力基底——无限记忆/不疲劳/并行处理进入不同目标函数后产生相反效果。
      对称性不在于同一套代码，而在于同一套能力剖面被接入相反优化方向。"
      (B) 放弃"同一技术栈"措辞，改为诚实表述："AI技术的能力剖面（BR-L2-026）可被
      同时用于约束和放大BR-L2-030的现时偏向——两侧使用的具体技术实现不同（储蓄侧
      偏规则自动化，消费侧偏ML推荐），但均依赖AI的信息处理不对称作为能力基底。"
      此修复不改变三条核心预测的可检验性（预测不依赖"同一技术栈"声称），但使
      discriminant_validity 中对"科技中性论"的判别更诚实——若两侧技术差异大，则
      "科技中性论"的"工具取决于人怎么用"与本案的"目标函数决定方向"之间的判别空间
      收窄（因为人确实为不同目的选择了不同的技术实现）。
    - |
      [required] 在 falsification_trace 或 operationalization 中诚实标注因果识别的
      结构性问题及其对实操证伪力的限制。当前文件将选择效应列为 secondary_suspect
      中"次致命场景"，但此问题的严重性被低估——选择AI产品的行为本身就是用户现时偏向
      （BR-L2-030的核心构念）的表现，选择变量和被预测变量共享同一个深层构念作为
      共同原因。DiD可消除不随时间变化的个体异质性，但无法消除"选择AI产品这一行为
      所揭示的时间偏好信息"。需补充：
      (a) 诚实声明：在无外生变异源（如监管强制产品改变商业模式、平台A/B测试随机
      分配推荐强度、自然实验）的情况下，(a)(b)(c)的实证检验本质上停留在"一致性
      证据"（consistent evidence）层面而非"因果证据"（causal evidence）层面。
      (b) 讨论可能的外生变异源是否存在、是否可获取——若不存在，诚实标注"当前
      可获取的证据最多提供方向性一致支持，无法干净分离选择效应与处理效应"。
      (c) 将 primary_suspect 的措辞从"编码客观性"扩展到"编码客观性+因果识别的
      结构性问题"——两条腿同等致命，任一条塌缩均导致全推论退化为不可检验的叙事。
      此修复不要求解决因果识别问题（那是实证研究的事），只要求诚实标注问题的
      结构性质和严重程度。

  should_findings:
    - |
      [should] 在 operationalization 的 ai_objective_function 段显式区分"AI承诺装置
      功能清单"和"一般AI金融服务"。推论预测的不是"任何AI金融产品都能提升储蓄率"，
      而是"实现了承诺装置功能（自动递增储蓄+条件消费锁定+预算监控）的AI产品才能
      提升储蓄率"。当前 real_world_anchors 中的 Acorns（round-up自动储蓄）接近此
      功能清单，但 Betterment/Wealthfront（投资组合优化）则不够格。若实证检验使用
      "所有AI理财app"作为处理组，信号将被不具备承诺装置功能的产品稀释→可能产生
      虚假的null result。建议在 operationalization 中新增"AI承诺装置最低功能清单"
      作为纳入标准。
    - |
      [should] 为目标函数编码的"产品价值主张"维度注册评分者间信度要求。当前三源编码
      协议中，"产品官网/应用商店描述中的核心功能声明——以'帮你存更多'为主诉求=用户
      资产型"依赖编码者对"为主诉求"的判断。建议：(a)提供≥3个编码示例锚定判断标准；
      (b)注册双盲编码+Cohen's κ≥0.7的最低信度要求；(c)或提供更机械化的编码规则
      （如关键词计数：产品描述中出现"储蓄/存钱/理财/预算"类关键词≥N个→用户资产型）。
    - |
      [should] 在 discriminant_validity (2) vs SMarT 段中限定"AI更强"的比较对象。
      当前声称"AI承诺装置比SMarT更强"，但合会（ROSCA）等社会嵌入型承诺装置在某些
      实证中储蓄纪律效应与SMarT相当甚至更强→"AI比所有非AI承诺装置都强"可能 overclaim。
      建议限定为"AI承诺装置比传统自动化承诺装置（如SMarT/401(k) auto-enrollment/
      固定规则自动储蓄）更强"——即比较对象限于同样"自动化但非AI"的承诺装置，而非
      所有非AI承诺装置。
    - |
      [should] 在 real_world_anchors 第3条（一键下单 vs 购物车冷静期）中区分"数字化
      自动执行"和"AI驱动的信息处理不对称"。Amazon 1-Click（1999年专利）是存储+
      自动化规则，不依赖现代ML推荐引擎——将其归入"AI"的BR-L2-026能力（无限记忆/
      并行处理/毫秒级A/B测试）存在概念拉伸。建议诚实标注：此案例展示的是"数字技术
      减少/增加交易摩擦"的对称性，与AI特有关系较弱——AI的增量在于个性化触发的精度
      和规模，而非摩擦本身的存在。

round_2:
  reviewer: "独立对抗审查者 (round 2, 全新上下文, 与前轮审查者无关)"
  verdict: verified
  verdict_note: |
    本轮审查的焦点是：round_1 的两条 required fixes 是否已被充分消解。结论：均已消解。

    【Fix 1 消解情况："同一技术栈"→"同类AI能力基底"】
    DED-045 当前文本已将"同一技术栈"替换为"同类AI能力基底（BR-L2-026的信息处理
    不对称：无限记忆/不疲劳/并行处理）"。statement 和 derivation step 2 均诚实承认
    两侧技术实现的巨大差异（"用户资产型AI多基于规则自动化，平台营收型AI基于复杂
    机器学习推荐系统"），并明确定位对称性在 BR-L2-026 的抽象层面而非代码层面。
    discriminant_validity 中 vs"科技中性论"的判别仍然成立——科技中性论声称"工具
    取决于人怎么用"（对称性在人的选择），本推论声称"目标函数决定方向"（对称性在
    事前设计选择）——两者的判别空间虽因技术差异的诚实承认而收窄，但仍清晰可判。
    → Fix 1 已消解。

    【Fix 2 消解情况：因果识别结构性问题的诚实标注】
    falsification_trace.primary_suspect 已大幅扩展，新增：
    (a) "致命场景"的第二段——因果识别的结构性问题（选择效应与处理效应共享同一构念
    根源——个体的现时偏向程度），明确说明 DiD+PSM 只能部分消化、不可观测变量恰是
    BR-L2-030 的核心。
    (b) "诚实的实证地位"专段——声明在无外生变异源时，实证检验停留在"一致性证据"
    层面而非"因果证据"层面；讨论了三种可能的外生变异源（新产品突然上线/商业模式
    转型导致的断点回归/技术升级导致的外生策略变化）；诚实标注"干净因果识别极其
    困难，本推论在可预见的未来大概率停留于一致性证据水平"。
    (c) 明确说明此局限不影响逻辑可证伪性但影响"verified所需的实证强度"。
    → Fix 2 已消解。作者不仅诚实标注了问题的严重性，还在 primary_suspect 中将
    编码客观性和因果识别并列为两条致命腿。

    【R1 的 should findings 回顾】
    四条 should 在本次修订中未显式处理（AI承诺装置功能清单、评分者间信度、vs SMarT
    比较对象限定、anchor 3 数字化vs AI区分）。它们仍成立但不构成 verified 的障碍——
    should 级缺陷不影响三条 verified 判定标准。

    【本轮新发现：两条 should 级观察】

    (1) [should] "同类AI能力基底"声称在储蓄侧可能过度拉伸。Acorns 的 round-up 是
    确定性算术规则，不涉及并行处理或毫秒级A/B测试——它主要使用 BR-L2-026 中的
    "不疲劳"维度（24/7执行），而非"无限记忆"或"并行处理"。相比之下，Amazon推荐
    引擎同时使用全部三维度。这意味着"同类能力基底"的对称性在两个方向上不对称——
    储蓄侧只使用了能力基底的一个子集，消费侧使用了全集。这不推翻对称预测（机制仍
    可成立——不同子集接入不同目标函数产生相反效果），但建议诚实标注两侧所需能力
    维度的非对称性：储蓄侧只需不疲劳+无限记忆（执行承诺规则），消费侧需要全部三
    维度（发现+触发+执行冲动消费）。

    (2) [should] 逐格判空中（用户资产型AI，储蓄率上升）的非平凡性部分依赖于
    BR-L2-026 作为特定机制。但存在一个更平凡的解释路径："技术降低交易摩擦→更多
    该活动"是通用经济学原理——AI自动化降低储蓄摩擦→储蓄增加，不需要 BR-L2-026
    的任何特殊能力。此替代解释使该格的非平凡程度低于文件声称的水平。推论的整体
    非平凡性仍由对称预测+分叉效应+事前编码三条增量共同支撑——单格的局部平凡化
    不影响整体。建议在 nontriviality_test 中诚实标注此替代路径。

    【综合裁 verified】
    两条 required fixes 已消解。13 条红旗无 required 命中。四路新反例猎捕均被消化
    （无净杀）。无 DED-004/007 级复发。四条承自 R1 的 should + 两条本轮新 should
    不构成 verified 障碍。→ verified。

  red_flag_findings:
    brick_conclusion: |
      【R2 复核：仍通过——修订未引入 brick=conclusion 问题】

      经修订的 statement 核心是"同一类AI能力基底（BR-L2-026）,接入不同的目标函数,
      把BR-L2-030的现时偏向分别推向约束和放大的相反方向"。此命题仍不在任何单块
      承重砖中：BR-L2-030 不含"AI"或"目标函数分歧"，BR-L2-026 不含"现时偏向对称
      放大"或"目标函数为谁优化"。两砖合力的对称预测是真组合增量。

      需额外确认：修订中用"同类AI能力基底"替代"同一技术栈"后，是否增大了
      brick=conclusion 风险？否——因为"AI能力基底"这一概念本身是 BR-L2-026 的
      概括（无限记忆/不疲劳/并行处理），但 BR-L2-026 未焊接这些能力到"现时偏向
      的对称放大"——它只是列举了能力维度。焊接步骤（能力×目标函数→相反财务效果）
      是本推论的原创贡献。→ 通过。

    nontriviality_cell_check: |
      【R2 复核：仍通过——但本轮发现一条 should 级替代解释路径】

      R1 的 2×3 判据表分析经修订后仍有效——空格预测均不被任何单砖平凡强制。

      本轮新观察：格（用户资产型AI，储蓄率上升）存在一个比 BR-L2-026 更平凡的
      替代解释路径——"技术降低交易摩擦→更多该活动"是通用经济学原理。若将此格
      的非平凡性完全归因于"BR-L2-026 能力使AI成为理想承诺装置"，则忽视了"任何
      降低储蓄摩擦的技术（非AI的自动转账/直接入薪储蓄）都可能产生类似效果"这一
      可能。换句话说，该格的"AI特异性"弱于文件暗示的——非AI自动化也可能填充它。

      但这不影响 verified 判定：(i) 推论的非平凡增量分布在三条预测的整体结构中
      （对称性+分叉+事前编码），而非依赖于单格的非平凡性；(ii) 文件在
      discriminant_validity (1) 中已注册了"若传统承诺装置与AI承诺装置效应无差异
      →AI不是更强放大器"的判别条件——即承认了替代机制的可能性。
      → should：在 nontriviality_test 中诚实标注"技术降低摩擦"替代路径，并说明
      推论的增量不在于单格方向预测，而在于对称+分叉+目标函数锁定三者的联合。

      其他各格 R1 分析仍有效。→ 红旗不命中。

    measurement_orthogonality: |
      【R2 复核：仍通过——主干正交未变，修订未引入新的焊点】

      IV（目标函数编码）与 DV（储蓄率变化）的测量链在概念层和操作层仍分离。
      修订中 expanded primary_suspect 讨论了选择效应与处理效应共享构念根源
      （个体的现时偏向），但这是因果识别/内生性问题，不等同于测量轴焊死——
      测量轴焊死是"IV的测量操作偷用了DV的信息"，而此处的内生性是"IV的赋值
      （用户选择哪种AI）与DV的未观测决定因素（个体时间偏好）相关"。两问题性质
      不同：前者使推论不可证伪（逻辑死循环），后者使推论难以干净检验（实证挑战）。

      Anti-talisman (1)(2) 的对称保护仍锁定"不得由结果反推目标函数编码"的
      逃逸路线。→ 通过。未重蹈 DED-007。

    scope_hook_independent_of_result: |
      【R2 复核：仍通过——三条 excluded_outcomes 均基于可事前独立识别的特征。
      修订未增删 excluded_outcomes，R1 分析仍有效。】→ 通过。

    criterion_tier_match: |
      【R2 复核：仍通过——被预测量为连续量，预测为方向性/比较静态。修订未改变
      分类判据结构。R1 分析仍有效。】→ 通过。

    anti_talisman_cashed: |
      【R2 复核：仍强在位——五条硬约束未变。修订后新增的"诚实的实证地位"段
      可能引发一个微妙的反向风险——见下分析。】

      正面：五条 anti-talisman 约束（禁止由储蓄率反推目标函数/禁止诉求更长窗口/
      禁止用幸福感替代/禁止商业模式转向后反推原始编码/对称保护事前编码优先）
      在修订后完整保留。实操中仍可操作。

      潜在微妙风险：修订后 primary_suspect 中新增的"诚实标注实证层次（一致性证据
      而非因果证据）"可能产生一种新型的软逃逸路线——"任何 null result 都可被
      '这只是因为缺乏外生变异源，不是理论错了'消解"。注意：anti-talisman 约束
      防止的是事后调整编码/阈值/窗口，但没有防止"事后降低证据标准"。当前文件
      的诚实标注是恰如其分的（预先声明限制，而非在反例出现后才诉求限制），
      因此不构成 talisman。但如果未来实证检验出现 null result 时，作者以"我们
      早就说过只能到一致性证据"为由拒绝接受证伪——那将构成新的 talisman。
      → 当前不命中。但建议在 anti-talisman 中新增第(6)条预先防御："禁止以
      '我们只声称一致性证据'为由拒绝接受方向性 null result——若所有可获取的
      一致性证据均指向 null，推论仍应视为被实质性削弱。"

      综合：anti-talisman 强劲在位，新增一条预防性 should。

