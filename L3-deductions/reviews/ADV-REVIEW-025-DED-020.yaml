id: ADV-REVIEW-025
type: adversarial_review
reviews: DED-020
layer: L3-deductions

人话摘要: |
  对 DED-020(程序透明x裁决独立交互推论:透明不是万灵药是放大器——裁判独立时透明让公道更亮,
  裁判不独立时透明反成羞辱放大器)的独立对抗审查记录。round-1 裁 verified:核心(交互方向反转
  ——裁决者不独立时透明度效应为负而非正,高透明比低透明更差)不在任何单砖内;BR-L2-015 只给
  "透明→接受"连续正函数、未给交互或负效应方向;BR-L2-006 只给内群体偏袒、未给透明度x偏袒
  交互;BR-L2-002 只给亲缘利他、同样未给交互。三个量测量轴正交、anti-talisman 双向禁反推到位。
  无 DED-004/007 复发。反例猎捕刻意攻空格"不独立+高透明+长期高合法性",未猎到 scope 内净杀活
  反例——最强候选均被已有 boundary/exclusion 机制合法消化或落在 behavior-vs-attitude 测量模糊
  区(非净杀)。3 条 should:①行为接受度测量在高退出成本场景下可能混同胁迫顺从与真合法性接受,
  削弱预测(ii)的可测性;②核心主张(反常方向 ii)的实证锚均为 weak-moderate,最强锚只支持标准
  BR-L2-015 效应而非新交互反转;③"透明度是放大器"机制是断言多推导少——未充分解释为何透明度
  放大依附而非触发改革压力致裁决者替换。

target: DED-020
protocol: |
  Rule B 独立对抗审查(作者≠审查者,全新独立上下文,与作者及前几轮审查者无关)。评分卡红旗 10 条
  逐项攻 + 反例猎捕(判 verified 前必做)+ DED-004(不可证伪循环)/DED-007(测量轴焊死)复发检查。
  裁决三态照评分卡:verified 需同时满足①无 required 缺陷②亲自猎捕无 scope 内活反例③不重蹈
  DED-004/007。

round_1:
  reviewer: "独立对抗审查者 (round 1, 全新上下文, 与作者及前几轮审查者无关)"
  verdict: verified
  verdict_note: |
    这是本体系第一条将"透明度x制度前件→合法性"的交互结构(DED-014 首创:透明x轮替)迁移到
    新前件(裁决独立度)的推论,且给出了 DED-014 未给的新预测——交互方向在裁决者不独立时反
    转(从正→负),"高透明比低透明更差"(羞辱放大器,预测 ii)。这一非平凡内核不在任何单砖内:

    BR-L2-015(程序公平→接受,IEA=1.9)只给透明→接受的连续正函数,在标准陈述中假定了"裁决者
    中立"这一隐性前件,未检验"中立性缺失时函数方向是否翻转"——而本条正是追问这个边界条件。
    BR-L2-006(内群体偏好,IEA=1.5)只给"人偏袒自己人"的稳定倾向,完全不给透明度x偏袒的交互
    效应、更不给"透明度放大羞辱"的方向反转。
    BR-L2-002(亲缘利他,IEA=1.6)只给亲缘→偏帮,同样不给交互、不给方向翻转、不给空格预测。

    三砖各自给出本推论的【部分零件】(偏私动机/程序效应/内群体偏袒),但【均不】合成"交互方向
    在裁决者不独立时为负"这一联合主张。DED-008 给"独立监督缺席→裙带侵蚀"的定性方向,但不给
    "透明度在依附条件下是坏的"这一定量交互预测。DED-014 给"透明x轮替"——同构逻辑但不同驱动
    变量(轮替≠裁决独立),两个变量可独立变异。故核心(ii)+(iii)是真非平凡合成 → 逐格判空通过:
    空格"不独立+高透明+长期高合法性"可被现实反例真填上、非同义反复。

    anti-talisman 防线严密:三量(裁决独立度/程序透明度/合法性接受度)各自由独立的结构/制度/行为
    指标测、明文禁止由结果反推前件(DED-004 病根)、遇反例不得事后调低/调高估值来消化(DED-007
    焊死)。裁决独立度由经济/亲缘/政治三维结构事实独立测,透明度由成文规则/遴选/发言/一贯性四维
    制度事实独立测,合法性由行为接受(不掀桌不退出不暴力)独立测——三轴异源、不共用指标。

    测量轴大体正交但有三处 should 级摩擦:(1)政治隶属维度的"隐蔽依附"(表面无关系私下有交易)
    观测难度高,文件诚实列为 primary_suspect;(2)透明度"一贯性"维度需多案例比对、观测成本高,
    文件诚实标注;(3)行为接受度在高退出成本场景下可能混同胁迫顺从与真合法性接受(见 should ①)。

    反例猎捕刻意攻 falsifiability(a) 的核心靶——"不独立+高透明+长期高合法性"空格——是我本轮
    最重兵力的攻角。构造了五路攻击,均被已有机制合法消化或落在测量模糊区,未净杀:

    ①宗族长老调解(传统华南/闽南宗族):宗族长老=同一宗族成员(对族内弱势房支存在亲缘不对称
    →非独立);调解过程高度透明(祠堂公开议事+族规成文+各方发言)。弱势房支在不利裁决后行为上
    继续参与宗族活动。消化口:长老虽属宗族但与各房支均有对等亲缘=对称依附(boundary_case);
    且弱势方"接受"可能源自无替代渠道(退出=失去宗族保护)而非真合法性接受→落在 should ①的
    测量模糊区。非净杀。

    ②专业自律裁决(医师/律师公会纪律委员会):裁决者=同业(共享职业利益,对被裁同业具内群体偏袒);
    程序高度透明(成文纪律守则+公开听证+上诉渠道);被制裁者通常继续执业(行为接受)。消化口:
    纪律委员会裁决者有维护行业声誉的抵消性激励→不一定纯偏袒;且"继续执业"可能是唯一可行选择
    (退出=失去执照)→行为接受≠真合法性。非净杀。

    ③国际体育仲裁(CAS):仲裁员池中部分来自与争议方同国/同体育联合会(可能有网络依附);听证
    程序高度透明(成文规则+公开裁决书+媒体覆盖);败方运动员/协会通常接受裁决继续参赛。消化口:
    CAS 仲裁员选拔机制(双方各选+共同选首席)设计为结构性平衡→整体独立度接近对称;败方接受
    可能更多出于"不服从则被禁赛"的强制性而非合法性→测量模糊区。非净杀。

    ④企业内部晋升争议裁决(HR/高管主持):裁决者与胜方(晋升者)有汇报关系/导师纽带(非独立);
    流程可高度透明(公开评估矩阵+360度反馈+书面结论);败方通常继续工作(行为接受)。消化口:
    继续工作≠接受裁决合法性——可能仅因劳动市场摩擦力/无替代工作而留任(excluded_outcome:
    单次裁决场景 out,但持续雇佣≠重复裁决接受)。且组织锚在 DED-020 已是 supporting anchor 3
    (weak-moderate,方向性支持),非反例。

    ⑤WTO 争端解决(早期 GATT 时期,约 1947-1995 前):专家组成员由争议方任命(各方各选→表面上
    含非独立成员);裁决过程透明(成文规则+公开裁决报告)。败诉方通常履行裁决。消化口:panel
    composition 经双方同意(各方所选成员被预期独立于任命国履行 adjudicative 职能而非 advocacy
    职能)——若真有明显利益共享关系,另一方会在遴选阶段 challenge。且 WTO compliance 有政治
    经济多重动因(声誉/报复威胁/体系利益),非单纯程序合法性接受。非净杀。

    最强三击(宗族调解/自律裁决/CAS)均被合法消化,消化判据(对称依附/抵消激励/结构平衡/强制退出
    成本)均由事前结构事实测、非事后回填 ⇒ anti-talisman 未偷生。

    三条 verified 硬门均过:①无 required 缺陷;②反例猎捕未猎到 scope 内净杀活反例;③DED-004/
    DED-007 未复发。3 条 should 级改进不阻断 verified,录于 required_fixes。

  red_flag_findings:
    brick_conclusion: |
      未命中(非平凡内核不在单砖)。逐字核对三块承重砖原文:

      - BR-L2-015(程序公平可替结果公平):statement 给出"当程序公平——透明/不偏袒/发言机会/
        一贯执行→不利结果接受度显著上升"——一条【连续正函数】。其四要素中虽含"不偏袒"(隐含
        裁决中立),但【未】检验当裁决者不独立时函数方向是否翻转。DED-020 追问的恰是这个边界
        条件。BR-L2-015 的三域交叉验证(法院/选举/博弈)覆盖的是裁决独立在场时的正效应,对
        "裁决者不独立+高透明"这一格不做分区预测。

      - BR-L2-006(内群体偏好):statement 只给"人偏袒自己人,任意标签即可触发"(Tajfel minimal
        group paradigm)。给的是【偏私动机】,不给"透明度x偏袒的交互效应"、不给"当偏私被透明
        公开展示时效果反转"、不给空格预测。IEA=1.5,演化/实验/跨文化三轮印证均关于偏袒现象
        本身,不涉交互。

      - BR-L2-002(亲缘利他):statement 只给"血缘越近越愿帮,共享基因越多利他阈值越低"
        (Hamilton's rule rB>C)。给的是【亲缘偏帮的演化基础】,不给透明度x亲缘依附的交互、
        不给"亲缘依附+透明=羞辱放大器"。

      三砖合起来给出:裁决者不独立时会有偏私(BR-L2-006+BR-L2-002)→接受度会低(BR-L2-015
      的正函数反方向)。但【谁都没给】"不独立+透明度=比不透明更差(反转)"这一尖锐预测(ii)。
      预测(ii)不是"不独立→不接受"的常识复读,而是"同一不独立条件下,高透明比低透明更差"——
      这是交互方向的反转,不在任何单砖射程内。brick=conclusion 不命中 → 不判 required。

    nontriviality_cell_check: |
      通过。核心空格"裁决者不独立 + 高透明度 + 败方长期行为高接受且态度认可公正"被预测为空,
      且不被任何单砖平凡强制:

      - BR-L2-015 单独:透明→接受的正函数(f'(透明度)>0 对所有裁决者条件)。它对"不独立"列
        的预测与"独立"列同方向——透明度高更好——不分区预测。
      - BR-L2-006 单独:不独立→偏私,但"偏私被公开透明地展示"vs"偏私被模糊掩盖"哪个更差?
        砖不回答。且砖的非平凡内核是偏袒的普适性,不是展示方式的效应。
      - BR-L2-002 单独:亲缘→偏帮,同样不给"公开透明展示偏帮"vs"私下偏帮"的比较预测。
      - DED-008 单独:独立监督缺席→裙带侵蚀(配置层公正维持 vs 侵蚀,定性方向)。不给"透明度
        在依附条件下负效应"这一定量交互预测。DED-008 的主题是"有没有独立监督",不是"透明度
        在依附条件下是坏的"。
      - DED-014 单独:透明x轮替的交互——不同前件(轮替≠裁决独立)。轮替指权力交替的事前独立
        概率(制度层),裁决独立指具体裁决者与争议双方的利益共享关系(人际层)。两个变量可独立
        变异(有轮替但具体法官可能依附,无轮替但专业仲裁员可能独立)。

      空格可被"不独立裁决者(经济/亲缘/政治三维均独立测有不独立)+高透明度(四维制度事实均独立
      测高)+败方长期和平接受(行为接受+态度认可均独立测高)"的现实案例填满 ⇒ 非空可满足、非
      同义反复(DED-004 未复发)。非平凡性不在"不独立→不接受"(常识),而在"不独立+透明=比不
      透明更差"(反转 ii),任何现有砖/推论不给。

    measurement_orthogonality: |
      主干未重蹈 DED-007。三量异源正交:

      - 裁决者独立度:经济维度(共享产权/雇佣/投资/债务,由财产/工商/合同登记测);亲缘维度
        (血亲/姻亲 r≥0.125 二等亲以内,由家谱/户籍/亲属声明测);政治维度(上下级/同派系/庇护
        链,由正式组织图+非正式网络民族志测)。三子维各自不由"裁决结果是否偏袒"或"败方是否
        接受"反推。

      - 程序透明度:规则成文可查(制度事实);裁决者遴选公开(程序事实);发言机会(实际被给予,
        由庭审/听证记录测);一贯性(类似案件类似处理,由多案例比对测)。不由"结果被接受"倒推
        "程序必透明"。

      - 合法性接受度:行为维度(继续在规则框架内行动,不掀桌/不退出/不诉诸暴力,由后续行为记录
        测);态度维度(主观公正评价,由调查/访谈测,如有)。不由"裁决者独立"默认接受度高。

      三轴异源、各自独立测、anti_talisman_clause 明文双向禁反推 → DED-007 焊死未复发。
      不判 required。

      残留【中型软点,should】:
      (a)政治隶属维度的"庇护链"在实践中可能难以纯事前观测——隐蔽依附(表面无关系私下有交易)
      需深度民族志/举报/事后暴露才能确认。文件诚实将此列为 primary_suspect:"隐蔽依附难以
      事前测——此为本条 primary_suspect 之根。"方向正确且诚实标注 → 不判 required。

      (b)行为接受度在高退出成本场景下可能混同胁迫顺从与真合法性接受。例如宗族/村落/孤立
      社区中被偏私裁决后继续参与框架——可能是"不接受也得接受"(无替代渠道)而非"认可程序
      合法"。文件已在 operationalization 中诚实标注"行为接受需长时段观测",但长时段不解决
      根本问题(长期胁迫顺从≠长期合法性)。此是 falsifiability 的实操障碍,不是逻辑焊死(见
      should ①)。

    scope_hook_independent_of_result: |
      不命中。三条 excluded_outcomes 均由事前可测的结构渠道划界:

      (1)"裁决者独立场景下的合法性变异"——按裁决者与争议双方的经济/亲缘/政治结构关系
      独立测:若无任何可溯利益共享→出射程。这是事前结构判据,不由结果开脱。

      (2)"胜方对程序的认可"——按"裁决结果对谁有利"事前判定(谁获得更多资源/权利/地位)。
      胜方不需要"裁决中立"的认知保险,"裁判跟我一伙"对胜方是正面信号,不检验本推论的
      核心预测(败方对不独立+透明的反应)。钩子按结果方向划界、独立于被预测量。

      (3)"单次裁决(非重复互动)场景"——按博弈结构(单次 vs 重复)事前测。若裁决是一
      次性、无后续互动,则合法性接受"概念的操作空间受限。事前可判定。

      三条均非"遇到反例就事后开脱"的活门 → 合规。不判 required。

    criterion_tier_match: |
      不命中(学到 DED-006)。三个核心量均明列为【连续量】:裁决独立度从"完全独立"到"完全依附"
      的连续谱(三维合成);透明度四维连续合成(规则清晰度/遴选公开度/发言充分度/一贯性);合法性
      接受度两维连续(行为接受/态度接受)。文件中的 2×2 格(独立/不独立 × 透明高/低)是启发式
      示意而非测量方案——operationalization 段明确写道"连续量,非二分"。被预测量使用比较语言
      ("低于/高于/交互为负")而非硬二分。反方向预测(ii)是"不独立+高透明 < 不独立+低透明"的
      比较,非格内硬"是/否"。合规 → 不判 required。

    anti_talisman_cashed: |
      大体兑现(should 级残留)。anti_talisman_clause 条款到位:
      - "判定裁决者独立度时,必须由经济/亲缘/政治结构事实独立测,【不得】用裁决结果是否偏袒
        或败方是否接受反推独立与否"
      - "判定程序透明度时,不得因结果被接受就倒推程序必透明"
      - "判定合法性接受度时,不得因裁决者独立就默认接受度高"
      - "尤其不得遇到不独立+高透明+高合法性的看似反例时,事后调低透明度估值或默认裁决者其实
        独立来消化"

      承重锚里至少一个真独立测出驱动量:
      - anchor 1(独立司法+高透明→败诉接受):法官独立由制度结构事实(任免程序/薪酬保障/回避
        规则)独立测,不由判决结果反推。
      - anchor 2(裙带法官+公开庭审→透明反成羞辱):裁决者独立度=政治隶属/亲缘关系由事前
        结构事实测,不由裁决结果反推。
      - anchor 4(科举回避/德夫希尔梅):回避/糊名是成文制度事实,独立度与透明度可分别测。

      残留【中型软点,should】:anchor 2 和 anchor 3(裙带法官/HR裁决)是唯一直接支持核心主张
      (ii)的锚,但 confidence 均为 weak-moderate(个案方向性支持,缺系统跨域检验)。anchor 1
      和 anchor 4 只支持标准 BR-L2-015/DED-008 效应(独立+透明→接受),不检验"不独立+透明
      =更差"这一反转。这意味本推论最尖锐的非平凡内核(预测 ii)在经验锚上偏薄——文件已诚实
      标注 confidence,但整条推论的经验底座比独立+透明侧弱一个量级(见 should ②)。不判 required。

    anchor_fact_check: |
      无 DED-007 式致命事实错。逐锚核:

      - anchor 1(独立司法+高透明→败诉接受,法治成熟政体):法官独立(终身制/独立薪酬/无利害
        冲突)+高程序透明(公开庭审/成文判决理由/上诉渠道)→败诉方行为接受(继续使用法院而非
        私力救济)。这是 BR-L2-015 的 loser's consent 标准效应。无事实错。

      - anchor 2(裙带法官+公开庭审→透明反成羞辱):裁决者与执政方有明显政治隶属或亲缘共享、
        但程序形式齐备(公开庭审/成文法条/律师辩论)→败诉方系统性地视公开庭审为"走过场",
        合法性低于私下调解。honest_note 承认"个案间多因交织,单案归因需谨慎"——这是对证据
        强度的诚实降级,非事实错。方向性合理,无事实错。

      - anchor 3(组织内部 HR/主管裁决+透明流程→认知羞辱>认知公平):裁决者与争议一方有直接
        汇报关系或长期共事纽带(不独立),但流程高度透明(公开评估指标/标准化面谈/成文结论)→
        被裁方态度比模糊私下处理更负面。honest_note 承认"缺系统跨组织检验,属原创方向,诚实
        降级"——方向性合理,无事实错。confidence=weak-moderate,但这是证据强度标签,非事实错。

      - anchor 4(科举回避/德夫希尔梅——独立+透明→公正):DED-008 的共锚。回避/糊名是成文
        制度事实,独立度与透明度可分别测。标准史,无事实错。

      四锚无致命事实错 → 不判 required。唯 anchor 2 和 3 作为唯一直接支持核心(ii)的锚,
      证据厚度偏薄,已记 should ②。

    definition_vs_prediction: |
      通过。三条关键主张均为可证伪的经验预测,非必然为真的定义:

      - 预测(i)"交互项为负:独立度与透明度对合法性的效应方向相反":可由统计检验推翻(交互项
        不显著或为正)。
      - 预测(ii)"反常方向:不独立+高透明的合法性<不独立+低透明":可被实证推翻(若前者≥后者,
        则预测(ii)不成立,推论降级为弱版本)。
      - 预测(iii)"空格:不独立+高透明+长期高合法性为空":可被一个干净反例推翻(falsifiability
        (a)的核心)。

      三个量的操作化定义均有独立于结果的测量方案。关键条件(裁决不独立/程序透明)不是"因为
      接受度低才认定不独立/透明"的循环定义,而是由独立结构/制度事实测。合规 → 不判 required。

    enumeration_and_species: |
      不命中(本推论非 N-species 穷举枚举结构)。不声称"N 类可枚举"。裁决独立度和程序透明度
      均为连续量,预测使用比较/交互语言而非硬分类。我仍按 DED-008 精神主动探"第 4 维度":

      - "裁决者声誉/历史记录":裁决者过往是否一贯公正或偏私——这是独立于当前裁决独立度的
        附加信息。如果败方知道"这个裁决者虽然跟我们不是一伙,但历来公正"(声誉在场),透明度
        的效应可能比裁决者独立度单独预测的更强/更稳。这不构成独立第 4 维度——声誉可从"一贯
        性"(透明度维度 d)和独立度的跨时稳定性中部分捕获,非完全外在的新前件。攻不穿。

      - "争议标的大小/利害攸关度":利害极高的争议中,败方对任何程序缺陷的敏感度可能放大(或
        相反——在极高利害下人们更接受'不论过程如何结果都是命')。这是可能的调节变量,但不构成
        推翻交互结构的独立必要条件。记 boundary note,不判 required。

    primary_suspect_aim: |
      【指对,但有两处可更精确——should】。文件自认最弱腿:"交互效应的方向——裁决者不独立时
      透明度的效应是否真为负(羞辱放大器)而非为零或正但减小。"这准确地指向了承载预测(ii)全部
      非平凡重量和预测(iii)大部分重量的腿。作者诚实:若此腿被证伪(交互不为负),推论实质归零。
      两个难点(隐蔽依附测量噪声/极限格天然稀少)也诚实列出。

      核查文件是否漏认更致命的软肋:
      (a)"透明度是放大器"的因果机制本身是断言多推导少。为什么透明度放大依附性而非触发"曝光
      →改革压力→裁决者替换→独立度上升"?文件用 CONCEPT-fairness(a)共享性断裂做机制(裁决者
      不独立时公平标准不被共享→透明只把偏私曝光),但未处理"曝光→改革"这条替代路径。边界条件
      "败方有替代裁决渠道"部分回应,但不同于"曝光导致体制内改革(更换裁决者)"。这是机制链路
      的 incomplete 而非逻辑缺陷——因为在当前裁决者仍不独立的稳态下,透明按理论应收紧羞辱,
      改革后 case 移到独立象限。作者宜在 derivation 步 4 加一句"注:此分析假设裁决者独立度
      固定(不因透明度而内生改变);若透明度导致裁决者被替换(独立度上升),则 case 移出本条射程"。
      (见 should ③)

      (b)行为接受度测量在高退出成本场景下可能混同胁迫顺从与真合法性接受,而预测(ii)的实证
      检验高度依赖行为接受度的准确测量。文件承认"行为接受需长时段观测"但没有充分讨论当退出
      成本极高时(如宗族/村落/孤立社区/封闭体制),"不掀桌不退出"是合法性接受还是无替代的囚徒
      困境。这使空格预测(iii)的测试条件比表面更苛刻——不仅需要"不独立+高透明",还需要"败方
      有可信退出选项而未用"才能区分胁迫顺从与真接受。宜在 measurement 段或 falsifiability
      段诚实注记。(见 should ①)

      另:平凡化检查(上位泛化后的常识稀释)。抽掉"交互方向反转(透明变有害)"后,剩下的"不独立
      →不公平→不接受"确实接近常识——这正是作者在 discriminant_validity 中主动划清的:"本推论
      的非平凡内核不在'不独立→不接受',而在'不独立时透明不是有用但不够而是有害'。"作者已将
      此平凡化路径主动堵死并诚实标注 primary_suspect 恰是这条防线。做法正确。判别效度对
      DED-014/Tyler/Lind/Rawls 的对表诚实,不需要补新对比面。file 自认的最弱腿(交互方向)
      是准的,而漏认的(iiia)+(iiib)属 should 级精化,不塌核心。

  counterexample_hunt: |
    主动构造 falsifiability(a) 的核心靶——"裁决者不独立(经济/亲缘/政治三维均独立测有不独立)+
    程序透明度高(成文公开+发言充分+一贯执行)+败方长时段行为高接受且态度认可公正"——的干净
    案例,刻意攻空格。认真搜历史/跨文化/制度实例,构造了五路攻击:

    - ①宗族长老调解(传统华南/闽南/徽州宗族)【最贴近但被消化】:宗族长老与族内各房支均有
      亲缘但不对称(主支vs旁支,偏私主支→非独立);调解过程高度透明(祠堂公开议事+族规成文+
      各方陈情);弱势房支败后行为上继续参与宗族活动(祭祖/互助/婚丧)。表面近空格。消化口:
      (a)长老与各房支均有对等亲缘,偏私方向不单一→属 boundary_case"对称依附",非核心射程
      (核心射程=裁决者与一方有不对称利益共享);(b)弱势方"接受"可能因无替代渠道(退出宗族=
      失去保护网络、在传统社会近乎不可行)→行为接受在此是胁迫顺从而非真合法性,落在 should ①
      的测量模糊区;(c)若弱势方在态度上不满但行为上服从(态度-行为分离),那空格(iii)未被填满
      (空格要求态度也认可公正)。被消化,非净杀。

    - ②专业自律组织纪律裁决(医师/律师/会计师公会)【次强,被消化】:纪律委员会由同业者组成
      (与被裁者共享职业利益+人际网络→内群体偏袒,但比较对象是被害方/举报方而非同业→对举报方
      非独立);程序高度透明(成文纪律守则+公开/半公开听证+成文裁决+上诉渠道);被制裁者通常继续
      执业(行为上接受)。消化口:(a)纪律委员会有抵消性激励——维护行业声誉/避免外部监管介入→
      不一定纯偏袒同业,裁决者独立度是多向量合成非单纯偏袒;(b)"继续执业"可能是在"失去执照vs
      接受处罚"二元选择下的胁迫顺从,非真合法性接受;(c)制裁通常轻于除名(吊销执照),利害攸关
      度中等→不在核心射程最尖锐区(高利害才有羞辱放大器的心理冲击)。被消化,非净杀。

    - ③国际体育仲裁(Court of Arbitration for Sport, CAS)【被消化】:仲裁员池中部分成员与
      争议方(国家体育协会/运动员)共享国籍/体育联合会关系(网络依附→对特定争议方非独立);
      程序高度透明(成文仲裁规则+公开裁决书+媒体覆盖);败方运动员/协会通常接受裁决并继续
      参赛(行为接受)。消化口:(a)CAS 仲裁庭构成机制(双方各选一名仲裁员+共同选首席)设计为
      结构性平衡→整体独立度接近对称而非不对称依附;(b)败方接受可能主要出于"不服从则被
      体育联合会禁赛"(强制退出成本)而非合法性认知——行为接受≠合法性接受;(c)有实证研究
      显示运动员/CAS 使用者对 CAS 独立性有系统性质疑(如 Pechstein 案上诉至 ECHR 挑战 CAS
      独立性),恰支持"不独立+透明→认知合法性低"而非反例。被消化,反成方向性支持。

    - ④企业内部晋升/绩效争议裁决(HR/管理层主持)【被消化】:裁决者(直线经理/HR)与争议胜方
      (晋升者/高绩效者)有汇报关系/导师纽带/长期共事(非独立);流程可高度透明(公开评估矩阵+
      360度反馈+成文晋升标准+书面面谈结论);败方(未晋升/低绩效者)通常继续留在公司(行为接受)。
      消化口:(a)继续留在公司不等于接受裁决合法性——可能仅因劳动市场摩擦力/搜索成本/合同约束
      而留任,且 excluded_outcome(3)单次裁决场景 out,但长期持续雇佣中的反复不利裁决若仍不过
      离职阈值也不等于"接受"——更接近"忍耐"而非"认可";(b)此 case 在 DED-020 自身 anchor 3
      中已被列为方向性支持(w-m),即文件已预期此类情境的合法性偏低,非反例;(c)离职率/申诉率/
      内部满意度调查可用于独立测行为vs态度接受——但目前缺系统性跨组织检验(文件 honest_note
      已承认)。被消化,非净杀。

    - ⑤WTO 争端解决(早期 GATT 时期+WTO 初期,约 1947-2010)【被消化】:panel 成员由争议方
      任命(各方各选→panel 中可能含与任命国有网络依附的成员→对对方非独立);程序高度透明
      (成文规则+公开 hearing+公开 panel/AB 报告);败诉方绝大多数履行裁决(行为接受)。消化口:
      (a)panel composition 经双方同意机制——若一方选任的 panelist 与任命国有明显利益共享,
      另一方可在遴选阶段 challenge,使最终 panel 的独立度接近对称;(b)WTO compliance 有
      多重动因(声誉成本/报复授权威胁/体系利益/国内政治),单纯程序合法性只是多因之一,不构成
      对交互效应的干净检验;(c)美国近年对 WTO AB 的系统性阻挠(拒绝任命新 AB 成员)可解读为
      当败方不满裁决时的"退出/掀桌"行为——恰在行为上表现为"不接受",与"不独立+透明→高接受"
      反例相反。被消化,非净杀。

    五击均被现有机制(边界条件/测量模糊/多因交织/文件自承锚)合法消化。未找到同时满足"不对称
    非独立+真高透明+败方明确态度认可+可安全退出而未退出"的干净 Type-A 净杀案例。

    结论:【未猎到 scope 内活反例】。verified 硬门第 2 条【通过】。

  non_recurrence_of_ded004_007: |
    DED-004(不可证伪循环):【未复发】。falsifiability 给出三条明确证伪路径:
    (a)找到一个空格案例(不独立+高透明+长期高合法性→推翻空格预测 iii);
    (b)统计交互项不显著、尤其不独立时透明度效应不为负→推翻预测(i)/(ii);
    (c)不独立+高透明的合法性≥不独立+低透明的合法性→推翻反常方向(ii)。

    三条均有明确的操作化判定标准(各自独立测量),空格(iii)在逻辑上可被干净反例填满——
    与 DED-004 的"唯一新意被实证推倒后打折再推倒"完全不同。

    进一步检查是否残留"事后开脱"活门:
    - anti_talisman_clause 明文禁"遇反例事后调低透明度估值或默认裁决者其实独立"→防线在位。
    - excluded_outcomes 三条均按事前结构判据划界,不由结果事后开脱→循环读法被堵。
    - "若无独立测出的隐蔽依附则判独立"规则:文件规定独立度由可事前编码的结构事实测——若
      表面无关系且无独立证据(举报/暴露/深度民族志)证明隐蔽依附,则按"独立"编码。这是计算
      保守(宁可漏判不独立也不虚报依附)而非循环——测量误差方向偏零(稀释效应而非制造假阳性),
      是统计学上保守策略,非循环。
    - falsifiability(a)适用区间注明"高透明制度通常也约束依附→极限格天然案例少"——这是对
      测试窗口宽窄的诚实标注,非循环。"稀少≠不存在"⇒空格仍可被反例填上。

    DED-007(焊死测量轴):【未复发】。三轴异源:
    - 裁决独立度:由经济/亲缘/政治结构事实测(财产登记/家谱/组织图/民族志)
    - 程序透明度:由制度事实测(成文规则/遴选记录/听证记录/多案例比对)
    - 合法性接受度:由行为记录测(后续框架参与/退出/暴力/申诉模式)
    三轴各自独立的资料来源、不互相污染。anti_talisman_clause 双向禁反推:不由结果偏袒反推
    不独立、不由结果接受反推透明、不由裁决者独立默认接受度高。连续量对齐、未硬二分焊死。

    残留:政治隶属"庇护链"的隐蔽依附=观测噪声→交互项被稀释向零(primary_suspect 自我承认)。
    这是测量信度问题(噪声→Type II error风险),非刻意焊死(Type I error→假阳性)。且噪声偏零
    (稀释而非制造伪证),是保守偏误。不判 DED-007 复发。

    结论:DED-004 和 DED-007 均未复发 → verified 硬门第 3 条【通过】。

  required_fixes:
    - |
      [should] 行为接受度测量在高退出成本场景下的混同风险。当前 operationalization 以"继续在
      规则框架内行动、不掀桌不退出不诉诸暴力"为行为接受度的主判据。但在退出成本极高的场景
      (宗族/村落/孤立社区/封闭劳动市场/非民主政体),行为上的"不退出"可能反映的是无替代渠道
      而非合法性接受——长期胁迫顺从与长期合法性接受在行为标志上可能无法区分。文件已诚实标注
      "行为接受需长时段观测",但长时段不解决根本的识别问题。建议:(a)在 limitations 段增一条
      "高退出成本场景下行为接受度作为合法性指标的区分效度有限——若败方无安全/可行的退出选项
      或替代裁决渠道,则行为接受可能仅反映结构约束而非程序合法性";(b)在 falsifiability(a)中
      追加测试条件"且败方存在可信退出/替代裁决选项而未使用",以把胁迫顺从剔除出"真接受"。
      此改动不改变交互逻辑结构,但收窄了可操作性证伪窗口——需诚实标注而不是悄悄放宽。
    - |
      [should] 核心主张(预测 ii 反常方向)的实证锚偏薄。anchor 2(裙带法官+公开庭审→透明反成
      羞辱)和 anchor 3(HR/主管裁决+透明流程→认知羞辱>认知公平)是唯二直接支持预测(ii)的锚,
      但 confidence 均为 weak-moderate,且 honest_note 多处承认"个案归因需谨慎""缺系统跨组织
      检验""属原创方向诚实降级"。最强的两个锚(anchor 1 独立司法+anchor 4 科举回避)只支持标准
      BR-L2-015/DED-008 效应(独立+透明→接受),不检验"不独立+透明=比不透明更差"这一反转。
      建议:(a)在 real_world_anchors 段诚实承认"预测(ii)的经验底座目前弱于预测(i)",可单独
      为预测(ii)列"待检验"(to-be-tested)标记;(b)将 anchor 2/3 的 confidence 加总评估降一级
      至"weak,方向性指针非确证"并明列检验预测(ii)所需的最简可行研究设计(如 vignette experiment:
      2×2 between-subjects,操纵裁决者独立度×透明度,测败方接受度)。这不塌核心(理论可独立于
      当前经验锚),但保护整体 credibility——避免"锚看起来多但尖锐内核锚少"的观感落差。
    - |
      [minor] "透明度是放大器"的因果机制补一句"独立性固定假设"。当前 derivation 步 2-4 给出了
      透明度放大依附→羞辱的机制链路(CONCEPT-fairness(a)共享性断裂→公平标准不被共享→透明把
      偏私从"可能"升格为"公开展示"),但未处理一条平行因果链:透明度曝光偏私→舆论/上级/外部
      压力→裁决者被更换→独立度上升→case 移出本推论"不独立"射程。这不推翻交互逻辑(稳态下
      裁决者仍不独立时预测成立),但若读者沿此路径攻击,当前文本缺一句"假设独立度固定/不因透明
      度内生改变"的显式声明。建议在 derivation 步 4 或 operationalization 段增一句:"注:本分析
      假设裁决者独立度在观测窗口内不因程序透明度而内生改变(如透明度→公众压力→裁决者被替换→
      独立度上升)。若该机制活跃,case 移出'不独立'象限、归入 BR-L2-015 射程——这不构成对本
      推论的反驳,但意味着自然观测数据中'不独立+高透明'的稳态样本可能稀少(selection bias:
      高透明淘汰不独立裁决者)。"此举不改变逻辑结构,但提升了机制的完整性和读者的信任度。

