id: ICV-001
target: DED-001
date: 2026-07-13
type: cross_verification
status: conducted
人话摘要: "请两个'血统不同'的免费 AI 独立盲打分，复核推论 DED-001 经验检验里那 14 个国家的层级数——不图它们更聪明，图它们'错得不一样'好互相纠错。它们一致把布干达算成 8 层、举旗指认这是疑似反例；但一手史料查下来真相是 6 层，反倒是这两个'独立'AI 因共享同一套教科书成见一起错了。教训：独立源只能'举旗触发调查'、不能自己下判决。"

report: |
  # 独立多模型交叉验证 ICV-001：DED-001 层级编码

  ## 目的

  DED-001 的经验检验（EMP-TEST-001）由单一编码者（主循环模型
  deepseek-v4-pro）完成，一直挂着"无 intercoder reliability"的悬挂
  标记。本次交叉验证用与主循环【不同血统】的免费模型做盲编码，
  产出真实的 Cohen's κ，并检验"笨但独立的模型能否充当承重墙的
  独立对抗源"这一 ICV 协议本身是否成立。

  ## 方法（遵守 ICV 四条纪律）

  - 蒙住：只给外部模型操作化定义（有效层级 + 形式化信息系统）+
    14 个案例的角色表 + 信息系统事实描述。删除作者的层级数与判定。
  - 血统分级：
    - 独立源：sensenova-6.7-flash-lite（商汤）、glm-5.2（智谱）
    - 同血统对照：deepseek-v4-flash（与主循环同 DeepSeek 血统）
  - 信号不裁决：外部编码用于算一致性，不改动结论；裁决仍归作者。
  - 测量独立性：见下"独立模型互检"。
  - 工具：scripts/blind_coder.py（可复用）。原始编码：blind-coding-raw.json。

  ## 存活情况

  - sensenova-6.7-flash-lite（商汤，独立）：✅ 0.5s
  - glm-5.2（智谱，独立）：✅ 0.9s
  - deepseek-v4-flash（DeepSeek，同血统对照）：❌ HTTP 429 配额耗尽，
    本次缺席。→ 同血统对照臂未能采集，是本次一个缺口（见局限）。

  ## 信度结果

  | 对照 | 层级落入作者区间 | 层级 ±1 内 | 层级平均绝对偏差 | 信息系统 κ |
  |------|-----------------|-----------|-----------------|-----------|
  | 商汤 lite vs 作者 | 8/14 | 14/14 | 0.61 | 0.576（中等）|
  | 智谱 glm vs 作者 | 7/14 | 13/14 | 0.75 | 0.687（显著下沿）|
  | **两独立模型互检** | 10/14 精确相同 | — | — | **0.892（几近完美）**|

  ## 核心发现

  **1. 信息系统编码协议未过 κ≥0.7 门槛。** 商汤 0.576、智谱 0.687，
  均未达到本体系设定的"编码协议可操作"门槛。歧义集中在"是 vs 部分"
  边界（半成文系统，如加洛林敕令、松海阿拉伯文）。结论：EMP-TEST-001
  与 DED-002 继承的"编码协议未验证"悬挂标记【不能解除】，反被证明
  协议确实偏软。

  **2. 独立模型彼此一致度(κ=0.892)远高于它们与作者的一致度(0.58/0.69)。**
  两种解读并陈（依 ICV interpretation 规则，不可只取其一）：
  (a) 两个外部模型可能彼此相关（共享语料/对齐惯例）→ 高度一致是共同
      偏见，实际只算"一个独立声音"；
  (b) 作者才是异类 → 作者编码带有两个外部模型都不共享的、作者特有的
      系统性偏差。
  无论哪种，这都是自审绝对产生不了的信号——ICV 协议因此【成立】。

  **3. 方向性系统偏差：外部模型只要与作者不一致，几乎全把层级编得更高，
  从不更低。** 这是系统性偏差而非随机噪声。被编高的案例：
  布干达(作者7→双模型8)、印加(6→7/8)、古埃及(5→6)、吴哥(5→6)、
  松海(5→6)。作者的层级编码系统性地偏低约 0.5-1 级。

  ## 指向 DED-001 的实质信号（material finding）

  **布干达是唯一危险的分歧点。** DED-001 的证伪条件是"≥8 级 + 无形式化
  信息系统"。布干达是纯口头社会。作者在 EMP-TEST-001 中将其编码为
  【7 级】（把 Bataka 氏族链算作平行系统），恰好卡在 5-7 天花板之下，
  判为"边界案例"。**两个独立模型拿到同一角色表，都独立编码为【8 级】**
  ——那就落进证伪区，使布干达成为 DED-001 的【疑似反例】。

  其余被编高的案例（印加、古埃及、吴哥、松海）都【有】信息系统，
  编高不构成威胁。唯独布干达纯口头 + 独立编码为 8，直接指向反例。

  不能排除的可能：作者把布干达编成 7，部分因为 7 让 DED-001 安全——
  这正是确认偏误，而它被两个与作者不相关的模型抓到了。这是本次 ICV
  最有价值的产出。

  ## 依 Rule C 的状态影响

  按 Rule C result_to_status，"发现疑似反例"→ 目标推论加 verified*
  标记 + 启动深度调查。因此：
  - DED-001 从 verified 降为 verified*（布干达疑似反例挂起）。
  - 启动布干达行政史深度调查：Bataka 氏族链究竟算不算主治理链的
    一级有效层级？领土链本身到底 7 还是 8？
  - 调查结论回写 EMP-TEST-001 与 DED-001。

  ## 局限性

  1. **同血统对照臂缺席。** deepseek-v4-flash 撞 429 未采集，无法验证
     "同血统模型是否同意作者"这一对照假设。下次应在配额充足时补齐。
  2. **两个独立模型可能彼此相关。** κ=0.892 提示它们或许共享偏见，
     实际独立度可能低于"两个独立声音"。ICV 的独立性是【部分】的。
  3. **角色表由作者构造。** 外部模型编码的是作者整理的角色表，非原始
     史料——作者选择列哪些角色本身已注入判断。真正独立需从原始史料
     起编，但免费模型会幻觉，当前不可行。这限制了本次盲编码的独立深度。
  4. **信息系统描述含"纯口头"等字样，部分泄露。** 但"是否算形式化系统"
     的编码判断仍是真实判断（如 quipu/甲骨文/半成文是否达标）。
  5. **仅 14 案例、2 独立模型。** κ 的估计不确定度大。

  ## 结论

  ICV 协议【成立】：用不同血统的免费模型做盲编码，产出了自审无法
  产出的独立信号——一个指向 DED-001 承重案例（布干达）的系统性偏差。
  代价与边界诚实标定：独立是【部分】的（两模型或彼此相关）、裁决仍
  归作者、编码协议 κ 未过门槛（协议偏软的债未还清）。
  净结果：用一次廉价的多模型盲编码，换来了对承重推论的一个真实、
  可追查的挑战。承重墙从【假】变【部分且被测量】。

  ## 后续（follow_up）

  1. 深查布干达有效层级（7 vs 8）→ 决定 DED-001 是回到 verified 还是
     进一步降为 contested。
  2. 收紧信息系统"是/部分"编码定义，重测 κ 是否过 0.7。
  3. 配额恢复后补采同血统对照臂（deepseek-v4-flash）。
  4. 对 DED-002/DED-003 的经验检验编码同样施加 ICV 盲编码。

# === 后续裁决（布干达深查回写，2026-07-13） ===

resolution:
  date: 2026-07-13
  investigation: "布干达前殖民行政史深度调查（Reid 2002、Southwold 1961、Twaddle 1969、Low & Pratt 1960、Fallers 1964、Roscoe 1911、Kagwa）"
  verdict: "前殖民布干达有效层级 = 6（区间 5-7，对'≤7、非8'置信度高）。8 级不成立。"
  why_8_refuted: |
    两个独立模型编 8，几乎肯定犯了两个错之一：
    (1) 把【平行的】bataka 氏族链叠加到 bakungu/batongole 领土链上——
        违反计数规则（平行不叠加）。真正治理走领土链，王权靠取代氏族权
        扩张，两链仅在顶端交汇于国王一人。
    (2) 把【1900 年协定标准化的】整齐 gombolola/miruka 嵌套层倒投影回
        前殖民——时间错置。前殖民县以下只有 1（至多2）层庇护制次级酋长。
  effect_on_ded001: "疑似反例不成立。DED-001 从 verified* 回 verified。布干达 6（或至多7）级仍在 5-7 天花板内。"

  meta_lesson_for_icv:
    the_reversal: "真相(6) < 作者(7) < 两模型(8)。作者反而比两个'独立'模型更接近真相。"
    which_interpretation: |
      本记录当时并陈两种解读：(a) 两模型彼此相关、共享偏见；
      (b) 作者是带确认偏误的偏低异类。布干达证据【强烈指向 (a)】——
      两模型的高度一致(κ=0.892)不是独立确证，而是【共享的系统性上偏】
      （被'非洲王国=六层金字塔'教科书图式带偏）。解读 (b) 被否证。
    lesson: |
      1. "和作者不一样" ≠ "更正确"。一组相关的更笨模型可以一起自信地错。
      2. ICV 的信号只能【举旗触发调查】，绝不能自行裁决——本例中它的旗
         是假警报，靠一手史证才证伪。这正面印证了协议的 signal_not_verdict
         纪律与 measure_independence 纪律。
      3. "外部模型系统性方向一致地偏离作者"既可能是作者偏差，也可能是
         外部模型组的共享偏差——只有证据能裁决，方向本身不指示谁对。
      4. ICV 的净价值仍成立：它逼我们去查了本会被舒服地留作"边界案例7"
         的承重案例。但它的独立性比初判更弱（两源共享上偏）。

