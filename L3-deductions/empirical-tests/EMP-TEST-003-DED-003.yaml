report: |
  # 经验检验：DED-003 内聚-外竞耦合推论

  ## 检验目标

  DED-003 的核心预测（三条）：

  > 预测 A：当一个政治实体失去其主要外部竞争者，且事后 10 年内
  > 未显著增加至少一种其他维护机制的投入，其内部凝聚力指标将在
  > 10-30 年内出现可测量的下降。
  >
  > 预测 B：失去外部竞争者后凝聚力下降的幅度，与失去前该实体
  > 对外部竞争锚定的依赖程度成正比。
  >
  > 预测 C：如果政治实体在失去外部竞争者的同时显著增加了替代
  > 维护机制的投入（超过前 10 年平均水平的 50%），凝聚力衰减
  > 将被部分或完全抵消。

  证伪条件（推论自陈）：发现 ≥ 3 个独立的大规模政治实体
  （人口 > 100 万），同时满足「失去主要外部竞争者 > 30 年」+
  「替代维护机制投入未增加（< 50% 增长，任意维度）」+
  「内部凝聚力未下降（三个指标均无显著趋势）」。

  ## 与 DED-001 检验的根本区别

  DED-001 的检验是**横截面**的（比较不同组织在同一时点的层级/信息系统）。
  DED-003 的检验是**纵向**的（追踪同一实体在外部竞争减少前后的凝聚力变化）。
  这带来两个特有困难，本检验从头到尾诚实携带：

  1. **归因困难（correlation ≠ causation）**：凝聚力下降的每个案例几乎
     都伴随财政、经济、精英、气候等混淆变量。时间序列上的先后相关
     无法单独证明外部竞争减少是原因。本检验对每个案例单列「混淆变量」，
     并在结论中声明因果归因的强度上限。

  2. **测量的时代错位**：推论的凝聚力操作化（分离主义得票率、
     ISSP 身份调查、志愿率）只对现代案例可用。前现代案例（罗马、
     明朝、日本锁国、希腊城邦）不存在这些数据，只能用定性代理
     （叛乱频率、精英派系化、地方分立），可比性受限。

  ## 检验设计

  ### 总体与样本（在检验前声明，不因结果调整）

  **总体**：历史上经历过「外部竞争压力显著减少」且可获得凝聚力
  变化定性/定量证据的大规模政治实体。

  **样本（N = 12，全部在检验开始前锁定）**：瑞士、日本（锁国期）、
  苏联、欧盟、罗马帝国、明朝、大英帝国、南斯拉夫、加拿大、瑞典、
  哥斯达黎加、古希腊城邦（斯巴达霸权期）。

  **纳入理由**：样本刻意包含四类，以避免只数「崩溃案例」的幸存者偏差——
  - 长期和平但未崩溃（瑞士、瑞典、哥斯达黎加）——**对推论最危险的检验对象**
  - 外部竞争消失后崩溃/分裂（苏联、南斯拉夫、希腊城邦）
  - 外部竞争消失后建立替代机制（日本锁国、罗马、瑞典、哥斯达黎加）
  - 外部竞争仅部分/移动式减少的边界（明朝、大英帝国、欧盟、加拿大）

  **选择偏差声明**：这不是随机样本，是按「已知经历外部竞争变化」
  便利抽样。偏差方向：崩溃案例（苏联/南斯拉夫）在史学中更显著，
  和平未崩溃案例（瑞士/瑞典）信息量更大却更少被讨论——
  本检验刻意提高后者权重，把瑞士列为头号检验对象。

  ### 操作化与编码方案（每个变量在检验前写定）

  **变量 1 — 外部竞争减少（时点与方式）**
  编码取值：完全消失 / 显著减少 / 部分减少（移动式：旧对手消失但
  新对手出现）。判定依据：军事冲突频率、领土争端、被广泛感知的
  竞争/威胁叙事在精英话语中的地位。

  **变量 2 — 凝聚力变化（减少前基线 → 减少后趋势）**
  编码取值：上升 / 维持 / 下降。
  现代案例优先用推论三指标（分离主义得票率、国家身份强度、
  集体行动参与）。前现代案例用定性代理并**明确标注为代理**：
  叛乱/内战频率、精英派系化程度、地方分立倾向。

  **变量 3 — 替代机制（类型 + 是否增加）**
  类型**严格限定**为推论事前枚举的 7 种，**不事后新增**：
  (1) 外部竞争锚定 (2) 民主参与 (3) 共享经济利益 (4) 文化仪式
  (5) 公民教育 (6) 外部使命 (7) 跨群体联盟/联邦制。
  「是否增加」按推论的 50% 阈值判断，但历史数据无法精确量化，
  故降级为**三级判断：是 / 否 / 部分**（是 = 明确新建或大幅扩张；
  部分 = 存在但未明显扩张，或扩张证据薄弱；否 = 无替代机制投入）。

  **变量 4 — 判定**
  - **验证**：(外竞减少 + 无替代 + 凝聚力下降 = 预测 A/B 成立)
    或 (外竞减少 + 替代机制建立 + 凝聚力维持 = 预测 C 成立)
  - **反例**：外竞减少 > 30 年 + 替代机制未增加 + 凝聚力未下降
  - **无结论**：混淆变量主导，或数据不足，或观察窗口 < 30 年
  - **边界**：判定对编码方案的微小变动敏感，或案例在阈值附近

  ### 检验的排除结果（什么情况下检验结论翻转）

  1. 若在样本中发现 ≥ 3 个人口 > 100 万、外竞消失 > 30 年、替代机制
     未增加、凝聚力三指标均无下降的案例——检验判定推论**被证伪**。
  2. 若发现「对外部锚定依赖低的社会反而在失去外竞后下降更大」的
     系统性模式（违反预测 B）——检验判定推论的因果机制需修正。
  3. 若所有下降案例的混淆变量都强到无法分离出外竞减少的独立贡献——
     检验对这些案例判定为 inconclusive，不产生虚假信心。
  **不在结果出来后修改上述标准。**

  ## 案例数据

  ### 案例 1：瑞士 (1848-至今) — 头号检验对象

  **外部竞争减少**：瑞士的外部竞争并非在 1815/1848 一次性消失。
  瑞士在一战（被交战国包围）、二战（被轴心国合围）、冷战
  （精神国防 Geistige Landesverteidigung）期间持续感知外部威胁。
  **真正的「外部竞争者消失」发生在 1991 冷战结束**——距今仅约 35 年。
  编码：显著减少（1991 后），但完全消失时点晚、窗口未满。

  **减少前凝聚力（基线）**：极高且稳定。1847 Sonderbund 内战后无内部
  武装冲突。多语言（德/法/意/罗曼什）联邦长期稳定。

  **减少后凝聚力变化**：**维持（高位）**。分离主义支持极低——
  唯一的区域裂痕（汝拉 Jura 问题）以 1979 年公投新建汝拉州和平解决。
  国家身份稳定。编码：维持。

  **替代机制**：类型 (2) 民主参与——每年 3-4 次全国公投，公民高频
  参与集体决策；类型 (7) 联邦制/跨群体联盟——州权 + 语言自治。
  **是否增加：否/部分（关键诚实点）**。直接民主与联邦制是 1848 宪法
  **既已嵌入**的结构，不是在外竞消失后「新增或扩张 50%」的投入；
  且公投投票率在 20 世纪整体**下降**（从 19 世纪末约 60% 降至 20 世纪末
  约 40-45%）。因此推论 falsifiability 中「公投参与率在和平期显著高于
  战争期」这一假设**在数据上并不成立**。

  **混淆变量**：多语言联邦的稳定还依赖高经济水平、去中心化、
  比例代表制、协商民主（Konkordanz）——难以把凝聚力维持单独归给公投。

  **判定：边界 / 未解决（unresolved）**。诚实结论：瑞士的替代机制
  水平**持续很高**，但它是**既存嵌入而非在外竞消失后被「增加」**，
  且公投参与率不升反降。这对预测 C 的「≥50% 增长」这一具体表述
  构成挑战。但瑞士**不构成清晰反例**，因为：(a) 完全外竞消失（1991）
  距今 < 50 年，20-50 年观察窗口未满；(b) 其持续高位的直接民主/
  联邦制水平本身就与「高替代水平抵消衰减」的更宽泛主张一致。
  **本检验维持推论对瑞士的原始标记：既非验证也非证伪。**
  （不强行解释掉——见结论 follow_up。）

  ---

  ### 案例 2：日本（锁国期 1639-1853）

  **外部竞争减少**：1633-1639 锁国令关闭对外交往，禁止外国来航与
  国人出海。约 215 年间几乎无对外军事竞争与外来威胁感知。
  这是比战后日本**更干净**的案例——一次长达两个多世纪的外竞移除，
  且替代机制的引入时间与外竞移除**不重叠**（区别于战后日本）。
  编码：完全消失（1639）。

  **减少前凝聚力（基线）**：战国统一（关原 1600 / 大坂 1615）后，
  以军事胜利为锚的高凝聚。但「凝聚」的对象主要是藩（domain）
  而非「日本」——国族身份薄弱。

  **减少后凝聚力变化**：整体**维持**（幕藩体制内秩序稳定）至晚期
  **部分下降**——18-19 世纪百姓一揆（农民起义）频率上升、
  武士阶层困顿、财政危机。编码：维持→晚期下降（定性代理：一揆频率）。

  **替代机制**：类型 (5) 公民教育/国家叙事——朱子学正统作为
  意识形态整合；类型 (4) 文化仪式——参勤交代制度（大名定期朝觐）
  作为高频仪式性臣服；类型 (7) 跨群体联盟——幕藩体制的准联邦结构。
  **是否增加：是**（这些机制在锁国期被系统建立/强化）。

  **混淆变量**：晚期凝聚力下降主要由天明/天保大饥荒、货币经济
  冲击武士俸禄、财政崩溃驱动——难以归给外竞移除本身。

  **判定：验证（部分，符合预测 C）/ 非反例**。替代机制明确建立，
  凝聚力在两个多世纪内大体维持，符合预测 C。晚期下降被饥荒/财政
  混淆，不能作为预测 A 的独立证据。与推论原文一致：日本因替代机制
  同时存在而不满足反例条件。

  ---

  ### 案例 3：苏联（1991 解体前后）

  **外部竞争减少**：冷战 = 苏联身份的终极外部锚——反资本主义/
  反帝国主义斗争。1980 年代后期戈尔巴乔夫「新思维」主动降低敌人
  形象，détente 削弱了「西方威胁」叙事在官方话语中的地位。
  编码：显著减少（1987-1991）。**对外部锚定依赖度：极高**
  （整个官方身份以对抗西方阵营定义）。

  **减少前凝聚力（基线）**：官方高凝聚（受压制的民族问题被掩盖）。

  **减少后凝聚力变化**：**急剧下降 → 解体**。1991 年 15 个加盟共和国
  独立。分离主义（波罗的海、高加索、中亚）全面爆发。编码：下降（极端）。

  **替代机制**：**否**。glasnost 不但未建立正面替代，反而拆解了官方
  意识形态（类型 5 的反向）；经济崩溃排除了类型 (3) 共享经济利益。

  **混淆变量（严重）**：经济长期停滞、计划经济失败、民族政策
  （联邦制形式下的民族territoriality）、精英叛离。**反向因果风险**：
  内部衰败可能同时导致了「接受 détente」和「解体」，外竞减少
  未必是独立原因。

  **判定：验证（符合预测 A + B）/ 但强混淆**。高外部锚定依赖 +
  零替代 + 凝聚力崩溃，方向与预测 A/B 高度一致，是依赖度—衰减
  幅度相关（预测 B）的最强定性支持。但混淆变量极强，因果归因上限低——
  「一致」而非「证明」。

  ---

  ### 案例 4：欧盟（二战后一体化，成员国间外部竞争消除）

  **外部竞争减少**：欧洲一体化系统性消除了成员国之间的传统安全
  竞争（法国 vs 德国这一数世纪的外部锚）。编码：显著减少
  （在**民族国家层级**之间），1951 ECSC → 1957 罗马条约 → 1993 EU。

  **减少前凝聚力（基线）**：各民族国家内部高凝聚，部分建立在
  「对抗邻国」的外部锚上（英国之于欧陆、法国之于德国）。

  **减少后凝聚力变化**：**民族国家内部的次国家身份活跃化**——
  苏格兰独立公投（2014）、加泰罗尼亚独立运动（2017）、Brexit（2016，
  部分是英格兰民族主义反弹）。方向与推论一致：法德等外部锚消失后，
  次群体身份空间扩大。编码：（次国家层级）分离主义上升。

  **替代机制**：在**欧盟层级**，欧洲身份是尝试中的替代——
  类型 (3) 共享经济利益（单一市场）、类型 (6) 外部使命（全球规范
  性力量）、类型 (2) 民主参与（欧洲议会，弱）。**是否增加：部分**
  （欧洲身份始终稀薄，未能达到民族国家身份的强度）。

  **混淆变量**：民主化、全球化、福利国家压力、地区经济分化。
  推论解释「为何次群体运动在高外部威胁期系统性较弱」，
  标准解释处理「为何在现在而非 50 年前」——互补而非替代。

  **判定：验证（支持，民族国家层级）/ 中等**。外部锚移除 → 次群体
  身份活化是较**具体、较干净**的信号；欧盟层级替代（欧洲身份）薄弱
  与欧洲凝聚力薄弱一致。

  ---

  ### 案例 5：罗马帝国（Pax Romana, 27 BCE-180 CE）

  **外部竞争减少（两段）**：
  - **共和晚期**：146 BCE 迦太基被毁，主要生存级外敌消失。
  - **元首制**：奥古斯都后核心地中海世界的对等外部竞争大幅减少。
  编码：显著减少（146 BCE 与 27 BCE 两个节点）。

  **减少前凝聚力（基线）**：共和国以对抗迦太基的存亡竞争维持
  高度公民团结。

  **减少后凝聚力变化（关键双向证据）**：
  - **146 BCE 后 → 下降**：迦太基消失后罗马陷入内部派系斗争与内战
    （格拉古兄弟 133 BCE 起 → 苏拉 → 恺撒 → 至 31 BCE 一世纪内战）。
    **古罗马史家撒路斯特（Sallust）的 metus hostilis（畏敌）理论**
    正是这一机制的古代表述：畏惧迦太基（metus Punicus）曾维系罗马
    德性，146 BCE 后德性崩坏、党争四起。这是 DED-003 机制的
    ~2000 年前的独立articulation。
  - **奥古斯都后 → 回升并维持**：帝国用大规模替代机制重建凝聚。
  编码：146 BCE 后下降 → 奥古斯都后维持。

  **替代机制**：类型 (4) 文化仪式——皇帝崇拜（imperial cult）；
  类型 (7) 跨群体联盟/包容——公民权持续扩展，至 212 CE 卡拉卡拉
  《安东尼努斯敕令》授予全帝国自由民公民权；类型 (3)/(4) 再分配 +
  仪式——「面包与马戏」；罗马法与地方自治。**是否增加：是**（元首制下
  系统建立）。

  **混淆变量**：3 世纪危机由军事无政府、瘟疫、通胀、边境压力驱动，
  不能归给外竞。

  **判定：验证（强，双向）**。共和晚期支持预测 A（外敌消失 → 衰减，
  且被古代史家亲身识别为 metus hostilis）；元首制支持预测 C
  （替代机制建立 → 凝聚力重建）。是全样本中机制链最完整的案例。

  ---

  ### 案例 6：明朝（朝贡体系稳定期）

  **外部竞争减少**：**存疑**。明朝北方草原威胁（蒙古）**持续存在**——
  修长城、1449 土木堡之变、后期女真崛起。朝贡体系是**管理式的
  等级关系，不是外部竞争者的缺席**。找不到干净的「外部竞争消失」时点。
  编码：外竞未显著消失（持续威胁）。

  **减少前/后凝聚力**：无清晰的「减少前后」对照可建立。

  **替代机制**：类型 (5) 科举/儒家国家叙事持续存在，但非对外竞
  消失的响应。

  **混淆变量（主导）**：王朝周期的财政崩溃、人口压力、气候
  （明末小冰期）、精英腐败——推论原文已将中国王朝周期列为
  boundary case，混淆变量过多。

  **判定：无结论 / 边界**。明朝不满足「外部竞争显著减少」的前提
  （草原威胁持续），无法作为预测 A 的检验案例。宋朝的定性对照
  （持续外部威胁下维持凝聚）方向上与推论一致，但同样无法排除
  经济/科举/文化等因素。

  ---

  ### 案例 7：大英帝国（二战后去殖民化）

  **外部竞争减少**：**移动式，非消失**。二战后德国这一对手消失，
  但冷战立即提供新外部竞争者（苏联），直至 1991。真正削弱的是
  **帝国这一「外部使命」本身**（1947 印度独立起的去殖民化）+
  1991 冷战结束。编码：部分减少（旧对手替换为新对手，1991 后
  外部使命与外部对手同时弱化）。

  **减少前凝聚力（基线）**：联合王国凝聚力部分建立在帝国的
  外部使命（类型 6）与大国竞争上。

  **减少后凝聚力变化**：苏格兰、威尔士民族主义上升；北爱冲突；
  苏格兰独立公投（2014）；Brexit（2016）。编码：次国家分离主义上升。

  **替代机制**：类型 (7) 权力下放（devolution，1998 苏格兰/威尔士
  议会）——但这更像**管理裂痕**而非重建统一凝聚；无强力替代
  外部使命的正面机制。**是否增加：部分**。

  **混淆变量**：北海石油经济、撒切尔主义的区域分化、欧盟成员身份
  政治、工党/民族党选举动力。

  **判定：验证（部分，中等）**。帝国「外部使命」（类型 6）的丧失 +
  1991 冷战结束 + 无强替代 → 次国家凝聚力弱化，方向一致。
  但外竞是「移动」而非「消失」，且混淆强，归因上限中等。

  ---

  ### 案例 8：南斯拉夫（1980 铁托死后 + 冷战结束）

  **外部竞争减少**：南斯拉夫身份高度依赖「不结盟」——在东西两大
  阵营之间的定位，其身份本身就以两阵营为对照定义（**外部锚定
  依赖极高**）。1980 铁托之死移除内部整合者，1989-91 冷战结束移除
  外部结构性压力。编码：显著减少（1989-1991）。

  **减少前凝聚力（基线）**：「兄弟团结」（bratstvo i jedinstvo）
  官方叙事下的表面高凝聚。

  **减少后凝聚力变化**：**崩溃 → 暴力解体（1991-1992）**，
  多国分裂 + 战争。编码：下降（极端）。

  **替代机制**：**否**。「兄弟团结」是随铁托权威衰减的仪式/意识形态
  （类型 4/5），未被更新或替代；1974 宪法的去中心化反而强化了
  共和国分立；经济危机排除类型 (3)。

  **混淆变量（严重）**：1980 年代恶性通胀与债务危机、1974 宪法结构、
  民族主义精英（米洛舍维奇等）动员。标准解释（铁托之死、经济、
  民族主义）是近因，推论描述深层结构脆弱性——互补。

  **判定：验证（强，符合预测 A + B）/ 强混淆**。极高外部锚定依赖 +
  零替代 + 暴力崩溃，是预测 B（依赖度—衰减幅度）的强定性支持。
  与苏联同属「高依赖 + 无替代 → 崩溃」模式。混淆强，归因上限受限。

  ---

  ### 案例 9：加拿大（1867 邦联后）

  **外部竞争减少**：邦联（1867）的建立动因之一是美国吞并威胁
  （美国内战、芬尼亚袭击）。19 世纪末起（1871 华盛顿条约、
  20 世纪美加同盟）美国威胁持续消退。编码：显著减少（渐进，
  19 世纪末—20 世纪）。

  **减少前凝聚力（基线）**：以对抗美国吞并为部分外部锚的联邦凝聚。

  **减少后凝聚力变化（双向）**：
  - **20 世纪 → 魁北克民族主义上升**：寂静革命（1960s）、FLQ、
    1980 公投（60-40 否）、1995 公投（50.6-49.4 否，极险）。
    方向与推论一致：北美外部威胁低 → 次群体身份活化。
  - **1995 后 → 分离主义下降**：编码：先升后降。

  **替代机制**：类型 (7) 跨群体联盟/联邦制——最高法院分离合法性
  裁决（1998）、《清晰法案》（Clarity Act, 2000）、官方双语与
  多元文化政策、魁北克实质自治。**是否增加：是**（1995 后制度化
  管理裂痕）。

  **混淆变量**：制度设计管理而非消除身份差异；能源/经济、语言政策。

  **判定：混合（mixed）**。1867-1995 魁北克民族主义上升期与低外部
  威胁期重叠 = 支持预测 A；1995 后联邦制替代机制抑制分离 = 符合
  预测 C。但也提示：制度设计可以**管理**内部裂痕而不必消除身份差异，
  这对推论既是支持也是限定（与推论原文的 mixed 判定一致）。

  ---

  ### 案例 10：瑞典（1814 年后的和平期）

  **外部竞争减少**：瑞典最后一战止于 1814（1809 失芬兰于俄国，
  1814 对挪威的短暂战役后进入瑞挪联合）。此后约 210 年和平中立——
  与瑞士并列为**最长的干净和平检验案例之一**。外部威胁（俄国）
  在冷战期仍被感知（1980s 潜艇事件），故非完全消失。
  编码：显著减少（1814 后），非完全消失。

  **减少前凝聚力（基线）**：以大国竞争（对俄/对丹麦）为部分外部锚。

  **减少后凝聚力变化**：
  - **1905 瑞挪联合和平解散**——次群体（挪威）身份活化并分离，
    方向与推论一致（外部锚移除 → 次单元分立）。
  - **瑞典本部 → 高位维持**：1905 后瑞典本部凝聚力高度稳定。
  编码：维持（本部），伴 1905 次单元分离。

  **替代机制**：类型 (3) 共享经济利益——20 世纪建立的
  **folkhem（人民之家）福利国家**（Per Albin Hansson，1928 起）——
  是明确的、大幅新建的替代机制；类型 (2) 民主参与——社会民主制。
  **是否增加：是**（福利国家是 20 世纪真实的大幅新增投入）。

  **混淆变量**：工业化、社会民主党长期执政、路德会国教与公民制度。

  **判定：验证（符合预测 C）**。瑞典用一个高成本正面机制
  （类型 3 福利国家）替代了外部竞争锚，凝聚力维持；1905 挪威分离
  支持「外部锚移除 → 次单元活化」。**关键：瑞典不是干净反例，
  因为它建立了强替代机制**——与瑞士（替代为既存嵌入而非新增）
  形成有信息量的对照。

  ---

  ### 案例 11：哥斯达黎加（1948 废除军队后）

  **外部竞争减少**：**需精确区分**。哥斯达黎加 1948 内战后
  （José Figueres）**废除自己的军队**——这是**自身停止军事竞争**，
  而非**外部竞争者消失**。哥斯达黎加仍处于竞争性区域
  （尼加拉瓜紧张、冷战中美洲）。编码：外竞未消失（自身单方面退出
  军事竞争）。

  **减少前凝聚力（基线）**：内战后重建。

  **减少后凝聚力变化**：国家身份围绕「和平民主的例外」构建并强化，
  凝聚力**上升/高位维持**，稳定民主。编码：上升/维持。

  **替代机制**：类型 (5) 公民教育 + 类型 (3) 共享经济利益——
  军费大幅转投教育与医疗；类型 (2) 民主参与。**是否增加：是**
  （军费转教育是明确的大幅替代投入）。附注诚实点：哥斯达黎加身份
  部分以「我们不是军事化的邻国」的道德对照定义——这仍是
  **类型 (1) 外部竞争锚定的变体**（道德对照而非军事威胁），
  按事前枚举归入类型 1，不新增类型。

  **混淆变量**：咖啡出口经济、相对同质的社会结构、美国区域影响。

  **判定：验证（符合预测 C）/ 非反例**。强替代机制（教育/民主）
  明确建立，凝聚力上升。但前提上它不是「外部竞争者消失」的纯案例
  （是自身退出竞争），且人口 1948 年 < 100 万——**规模在阈值附近**，
  作为大规模主张的检验证据力度有限。

  ---

  ### 案例 12：古希腊城邦（伯罗奔尼撒战争后斯巴达霸权期）

  **外部竞争减少（两段）**：
  - **479 BCE 后**：波斯威胁（共同外敌）消退——提洛同盟
    （478 BCE 建立以对抗波斯）的凝聚随之转化。
  - **404 BCE 后**：斯巴达击败雅典，其最大对等外敌（雅典）消失。
  编码：显著减少（479 BCE 共同外敌；404 BCE 对等外敌）。

  **减少前凝聚力（基线）**：希波战争中的泛希腊团结（against Persia）；
  斯巴达以 agoge/syssitia（类型 4/5）维持的公民平等凝聚。

  **减少后凝聚力变化**：
  - 479 BCE 共同外敌消退后 → 希腊城邦陷入内讧
    （伯罗奔尼撒战争 431-404 BCE）——共同外敌移除 → 碎片化。
  - 404 BCE 后斯巴达霸权期 → **斯巴达内部凝聚力衰退**：
    战利品财富涌入腐蚀平等制，oliganthropia（公民人数从约 8000
    降至 371 BCE Leuctra 时约 1000），阶级分化。霸权仅维持
    404-371 BCE 即败于底比斯。编码：下降。

  **替代机制**：**否/反向**。斯巴达未建立替代机制；其既有机制
  （agoge、公餐制，类型 4/5）反因胜利带来的财富而**侵蚀**——
  财富破坏了凝聚所依赖的平等。

  **混淆变量**：黑劳士（helot）人口结构、地震（464 BCE）、
  斯巴达制度的内在刚性。

  **判定：验证（符合预测 A/B）/ 但规模低于阈值**。共同外敌（波斯）
  移除 → 希腊碎片化；对等外敌（雅典）移除 + 无替代 + 既有机制被
  胜利侵蚀 → 斯巴达衰退，方向与预测 A/B 一致。**但希腊城邦
  人口多 < 10 万，远低于 100 万阈值**——是机制的**说明性证据**
  而非「大规模」主张的正式检验，边界标记于规模。

  ## 检验结果汇总

  | 案例 | 人口>100万 | 外竞减少 | 凝聚力变化 | 替代机制(类型/增加) | 判定 |
  |------|-----------|---------|-----------|-------------------|------|
  | **瑞士** | 是 | 显著(1991)窗口未满 | 维持(高位) | (2)民主+(7)联邦 / **否-部分(既存非新增)** | **边界/未解决** |
  | 日本(锁国) | 是 | 完全(1639) | 维持→晚期降 | (5)(4)(7) / 是 | 验证(C)/非反例 |
  | 苏联 | 是 | 显著(1987-91) | 下降(崩溃) | 无 / 否 | 验证(A/B)/强混淆 |
  | 欧盟 | 是 | 显著(国家间) | 次国家上升 | (3)(6)(2) / 部分 | 验证(支持) |
  | 罗马帝国 | 是 | 显著(146/27BCE) | 降→升维持 | (4)(7)(3) / 是 | 验证(强,双向) |
  | 明朝 | 是 | **未消失(草原持续)** | 无对照 | (5) / 不适用 | 无结论/边界 |
  | 大英帝国 | 是 | 部分(移动式) | 次国家上升 | (7)devolution / 部分 | 验证(部分) |
  | 南斯拉夫 | 是 | 显著(1989-91) | 下降(暴力解体) | 无 / 否 | 验证(A/B)/强混淆 |
  | 加拿大 | 是 | 显著(渐进) | 先升后降 | (7)联邦制 / 是 | 混合 |
  | 瑞典 | 是 | 显著(1814)非全消 | 维持(本部)+1905分离 | (3)福利国家(2) / 是 | 验证(C) |
  | 哥斯达黎加 | **近阈值(1948<100万)** | **自身退出非外敌消失** | 上升/维持 | (5)(3)(2) / 是 | 验证(C)/非纯案例 |
  | 希腊城邦 | **否(<10万)** | 显著(479/404BCE) | 下降 | 无/反向 / 否 | 验证(A/B)/低于规模阈值 |

  ## 核心发现

  **1. 未发现确凿反例。证伪阈值（≥3 个「外竞消失>30年 + 替代未增加 +
  凝聚力未降」的大规模案例）未被满足。** 唯一接近反例的是瑞士，
  且瑞士是「边界/未解决」而非确凿反例。

  **2. 样本清晰分为两个与推论一致的模式：**
  - **无替代 → 下降**：苏联、南斯拉夫、罗马共和晚期、斯巴达霸权期。
    （支持预测 A/B）
  - **建立替代 → 维持/上升**：瑞典（福利国家）、哥斯达黎加（教育/民主）、
    奥古斯都罗马（皇帝崇拜/公民权）、日本锁国（儒学/参勤交代）。
    （支持预测 C）
  这个二分是本检验最强的结构性发现——**它是预测 A 与 C 的联合模式**，
  而非单一方向的相关。

  **3. 预测 B（依赖度—衰减幅度成正比）获得定性支持：** 外部锚定
  依赖**最高**的两个案例（苏联的反帝斗争身份、南斯拉夫的不结盟身份）
  经历了**最剧烈**的下降（暴力解体）。未发现「低依赖社会反而下降更大」
  的反向系统模式。

  **4. 次国家身份活化是比「整体崩溃」更干净、更可测的信号：**
  欧盟（苏格兰/加泰罗尼亚）、加拿大（魁北克）、大英帝国（苏格兰）、
  瑞典（1905 挪威分离）四例，都在民族国家层级外部锚减弱后出现
  次群体身份上升。这一层级的信号混淆变量相对更少。

  **5. 瑞士是唯一真正的开放问题，本检验不将其解释掉：**
  瑞士的替代机制（直接民主/联邦制）**水平持续很高，但是既存嵌入
  而非在外竞消失后被「增加 50%」**，且公投参与率在 20 世纪不升反降。
  这对预测 C 的**「≥50% 增长」这一具体表述**构成真实挑战——
  推论 falsifiability 中「公投参与率和平期显著高于战争期」的假设
  **在数据上不成立**。但瑞士也**不是清晰反例**，因为完全外竞消失
  （1991）距今 < 50 年、窗口未满，且其持续高位的替代水平与
  「高替代抵消衰减」的宽泛主张一致。**诚实裁定：维持推论原始的
  unresolved_requires_data 标记。**

  **6. 机制并非本推论新创——非平凡性的双刃：** 撒路斯特的
  **metus hostilis（畏敌）**理论（迦太基毁灭 146 BCE 后罗马德性崩坏）
  是 DED-003 机制的 ~2000 年前独立表述。这一方面**强化了机制的
  经验可信度**（古人亲身识别），另一方面**削弱了区分效度主张**——
  「外敌维系团结」是一个古老观念，推论的新贡献在于把它形式化为
  可证伪的维护投入预算约束，而非发现现象本身。

  ## 局限性

  1. **归因困难（本检验的头号限制）**：每一个凝聚力下降案例都伴随
     强混淆变量——苏联/南斯拉夫的经济崩溃、罗马 3 世纪的瘟疫与
     军事无政府、斯巴达的黑劳士结构、明朝的气候与财政。时间序列的
     先后相关**无法单独证明**外部竞争减少是原因。存在**反向因果**
     风险（苏联/南斯拉夫的内部衰败可能同时导致「接受缓和」与「解体」）。
     本检验的因果归因上限是**「与推论一致」而非「证明推论」**。

  2. **纵向历史数据的可比性**：推论的凝聚力操作化（分离主义得票率、
     ISSP 身份调查、志愿率）只对现代案例可用。前现代案例（罗马、
     明朝、日本锁国、希腊城邦）只能用定性代理（叛乱频率、精英
     派系化、地方分立），**测量时代错位**，跨案例可比性受限。

  3. **50% 阈值不可精确量化**：历史数据无法测量替代机制投入的
     百分比变化，被迫降级为三级判断（是/否/部分）。这使预测 C 的
     核心量化门槛在历史检验中**软化**，瑞士案例暴露了这一软化的
     代价——「持续高水平」与「增加 50%」是不同的东西，推论未清晰区分。

  4. **「外部竞争消失」很少干净**：多数案例是部分/移动式减少——
     大英帝国的德国对手被苏联替换；瑞士/瑞典对俄威胁在冷战期仍
     被感知；明朝草原威胁持续；哥斯达黎加是自身退出而非外敌消失。
     纯粹的「外部竞争者完全消失」是理想类型，现实是连续谱。

  5. **选择偏差与幸存者偏差**：样本按「已知经历外竞变化」便利抽样。
     崩溃案例（苏联/南斯拉夫）在史学中更显著；和平未崩溃案例
     （瑞士/瑞典）信息量更大却更少被讨论。本检验刻意提高后者权重，
     但仍无法排除：可能存在未被记录的「外竞消失 + 凝聚力稳定」案例
     因不显著而缺席样本。

  6. **规模阈值**：希腊城邦（<10 万）远低于 100 万阈值，1948 年
     哥斯达黎加（<100 万）在阈值附近。这两例是机制的**说明性证据**，
     不构成对「大规模政治实体」主张的正式检验。

  7. **替代机制类型的重叠与主观性**：福利国家兼具类型 (2)(3)、
     皇帝崇拜兼具 (4)、公民权扩展兼具 (7)——类型边界模糊，
     单编码者判定，未做双编码者 intercoder reliability。

  ## 结论

  DED-003 的三条预测在 12 个纵向历史案例的经验检验中**存活但只是软性
  存活**：

  - **证伪阈值未满足**：未发现 ≥3 个「外竞消失 + 替代未增加 +
    凝聚力稳定」的确凿反例。推论不被证伪。
  - **结构性支持**：样本呈现清晰的「无替代→下降 / 有替代→维持」
    二分（预测 A + C 联合模式），预测 B（依赖度—幅度）获定性支持。
  - **但支持是软性的**：所有下降案例都被强混淆变量污染，因果归因
    上限为「一致」而非「证明」；50% 量化门槛在历史数据中被迫软化。
  - **瑞士仍是真正的开放问题**：其替代机制是既存嵌入而非新增，
    公投参与率不升反降，对预测 C 的「≥50% 增长」表述构成真实挑战——
    本检验**不将其解释掉**，维持 unresolved 标记。

  **对推论置信度的影响（依 METHODOLOGY Rule C）：**
  检验前：verified*（对抗式审查通过，瑞士挂起）
  检验后：**verified* 维持**。检验发现**疑似反例（瑞士）但未升级为
  确凿反例**——按 Rule C「发现疑似反例」条目，维持 verified* 标记
  （推论已有此标记），启动 follow_up 深度调查，而非降为 contested。
  经验置信度**小幅上升**（二分模式 + 预测 B 支持），但因归因困难
  与瑞士开放，**不产生强信心**。

  **follow_up（写入检验报告，供后续调查）：**
  1. **瑞士决定性数据**：获取 1815-2025 全国公投**参与率时间序列**
     + 一个瑞士凝聚力时间序列（如分语言区身份调查、汝拉危机前后
     数据）。若数据确认公投参与率在和平期未显著高于战争期——
     推论 falsifiability 中的瑞士假设被证否，verified* 应立即重审，
     并考虑将预测 C 从「≥50% 增长」修订为「持续高替代水平」以
     容纳瑞士（既存嵌入型替代）。
  2. **控制变量分离**：对苏联/南斯拉夫做与经济崩溃、精英叛离的
     偏相关分析，尝试分离外竞减少的独立贡献（缓解归因困难）。
  3. **扩展干净和平案例**：新增新加坡、爱尔兰、奥地利（1955 后）等
     长期和平未崩溃案例，检验「有替代→维持」模式的稳健性，
     对抗幸存者偏差。
  4. **区分效度**：明确 DED-003 相对 metus hostilis 古典观念的
     增量贡献（形式化 + 可证伪的维护投入预算约束），避免把
     「重述古老观念」误计为新发现。

  **检验状态：conducted。** 但因归因困难与瑞士开放，多个个案在
  因果层面为 inconclusive——结论诚实标注为「软性存活」，
  不宣称强经验确证。

