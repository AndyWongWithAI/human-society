id: EMP-TEST-002
target: DED-002
date: 2026-07-13
type: empirical_test
status: conducted

report: |
  # 经验检验：DED-002 规范成文化阈值推论

  ## 检验目标

  DED-002 的核心主张：
  > 完全依赖口头传承的规范体系存在一个"民主可达性天花板"。
  > 当社会复杂度超过口头承载上限时，规范体系必须出现至少一种
  > 结构性适应：(a) 成文化、(b) 分层化、(c) 专业化。
  > 天花板约束的不是"规范能否存在"，而是"每个成年成员能否独立、
  > 完整地获取并正确应用适用于自身的所有规范"。

  本检验针对推论的三条证伪条件（来自 excluded_outcomes / falsifiability）：
  - 证伪 (a)：存在纯口头、> 5000 人社会，其 > 80% 成年成员能独立
    陈述 > 300 条显式规范且日常遵守。
  - 证伪 (b)：存在纯口头社会，> 10000 人、持续 > 100 年，且不存在
    任何形式的专业化或分层化（规范知识分布完全均等）。
  - 证伪 (c)：跨文化量化研究中，纯口头社会显式规范中位数
    ≥ 文字社会中位数。

  检验方法为历史-民族志案例分析：选取 14 个前现代/无文字社会，
  逐个评估人口规模、文字系统状态、规范知识分布模式，判定是否
  构成反例。检验策略明确以"主动寻找反例"为目标，重点放在最可能
  挑战推论的边界案例（冰岛、易洛魁、索马里 Xeer、伊博）。

  ## 检验设计（test_design）

  ### 定义与代理指标（Rule A / Fallback A 声明）

  推论的证伪条件 (a)(b) 涉及两个无法对已消亡或前现代社会直接测量的量：
  "> 80% 成年成员独立陈述 > 300 条规范"和"规范知识分布是否完全均等"。
  对历史社会不可能进行 DED-002 measurement_protocol 所要求的成员知识测试。
  因此本检验采用**代理指标**（proxy），并明示其与原概念的关系：

  - 原概念："普通成年成员能否独立获取并正确应用规范"（民主可达性）。
  - 代理指标：**规范知识的社会分布模式**——是否存在专门的规范记忆者/
    解释者（专业化标志）、不同阶层是否适用差异化规范子集（分层化标志）。
    若存在专业化或分层化的制度性证据，则民主可达性被判为"低"；
    若不存在任何专业化/分层化且成员普遍参与规范制定与执行，则判为"高"。
  - 代理关系论证：DED-002 的三种适应本身就是"民主可达性被突破"的
    可观测标志（见推论 step 5 的独立检验标志）。因此"是否存在适应"
    与"民主可达性高低"在逻辑上同构——检测到适应即等价于检测到
    民主可达性被约束。代理指标的方向性风险：它可能**高估**推论
    （把任何精英角色都算作专业化）。为对冲此风险，本检验对专业化/
    分层化采用推论中的 > 30% 阈值口径（见编码方案），并对边界案例
    做保守判定。

  ### 编码方案（coding_scheme，检验开始前写定）

  变量 1 — 人口规模：给出区间估计 + 估计来源类型（接触期人口普查
    推算 / 考古估算 / 史学共识），承认不确定性。

  变量 2 — 文字系统状态（四分类，互斥）：
    - pure_oral：该社会完全无书写符号体系，规范全部存于人脑。
    - script_exists_oral_law：社会已有文字，但规范/法律未被写下
      （文字用于其他用途）。→ DED-002 明示这类应按"规范是否被写下"
      而非"文字是否存在"判定，故仍计入口头规范体系。
    - mnemonic_externalization：使用助记符号装置（wampum 贝珠带、
      quipu 式结绳、cowrie 结绳计数）辅助记忆，但符号不自解码、
      须经受训者转译。→ 介于口头与成文之间的灰色地带，单独标记。
    - literate_norms：规范已被写入可查阅的物理文本。

  变量 3 — 规范知识分布模式（可多选；判定标准如下）：
    - democratic（民主可达）：多数成年成员能独立陈述并应用适用规范，
      规范制定/执行由全体参与（如全民议事会），无排他性解释角色。
    - specialized（专业化）：存在"成员遇规范问题首选咨询的角色"，
      且该角色对 > 30% 的规范有排他性/主导性解释权
      （lögsögumaður、德鲁伊、oday 长老、dibia、祭司团等）。
    - stratified（分层化）：不同社会阶层（按可观测标准定义）适用的
      规范集合有 > 30% 不重叠（chiefly kapu vs 平民 kapu 等）。
    - segmented_fission（分裂/裂变）——**编码时新增的第四类，见核心发现**：
      人口增长通过分裂为多个自治小单元消化，而非扩张单一规范体系；
      规范承载单元始终维持在口头上限之下。

  变量 4 — 判定：
    - FALSIFY：满足证伪条件 (a) 或 (b)。
    - VALIDATE：呈现 ≥ 1 种适应，与推论预测一致（标注是哪种）。
    - BOUNDARY：编码方案的微小变动可能改变结论，或最接近证伪的案例。
    - IRRELEVANT：人口远低于阈值（不触及天花板）或数据不足以判定。

  ### 编码者与信度（诚实声明）

  本检验由**单一编码者**完成，未做双编码，因而**没有 intercoder
  reliability（Cohen's κ）报告**。这直接对应 DED-002 对抗式审查
  遗留的悬挂标记（"规范编码协议需在已知案例上试运行并报告
  intercoder reliability"）——本检验**未能**消除该标记。参见局限性 §2。

  ### 排除结果（本检验自身的失败判据，检验前声明）

  本检验将在出现以下任一情况时判定为**发现反例**（推论 status 承压）：
  - E1：某案例人口 > 5000、文字状态为 pure_oral（无文字、无助记装置）、
    且有独立民族志证据显示多数成员独立掌握大量（数百条量级）显式规范、
    不依赖任何专门角色 → 满足证伪 (a)。
  - E2：某案例人口 > 10000、持续 > 100 年、文字状态为 pure_oral，
    且**既无专业化亦无分层化亦无分裂裂变**，规范知识分布确系均等
    → 满足证伪 (b)。
  本检验**不覆盖**证伪 (c)：证伪 (c) 需要统一编码方案下的跨文化
  规范"计数"量化研究，案例分析法无法产出可比的规范数量中位数。
  故 (c) 在本检验中标记为"未检验"，而非"通过"。此声明在检验前写定，
  不得事后修改以适配数据。

  ## 案例数据（results）

  ### 案例 1：冰岛自由邦 (930-1262)  ★边界案例

  - 人口：约 30,000-60,000（史学共识区间，部分估计至 ~70,000）。
  - 文字状态：**script_exists_oral_law → pure_oral 口径**。基督教化
    (1000 CE) 引入拉丁字母，但世俗法律直到 1117-1118 年
    （Hafliðaskrá / 后世 Grágás）才首次书面记录；此前全部口头。
    检验期取成文化之前，按口头规范体系计。
  - 规范分布：**specialized（强）**。法律宣讲人（lögsögumaður）
    每年在 Althing 背诵三分之一法律，三年一轮。普通冰岛人不能随时
    独立查询完整法律，依赖每年三次的宣讲会。规范内容复杂
    （财产、侵权、婚姻、继承、杀人赔偿），但集中于专业角色的记忆。
  - 判定：**VALIDATE（专业化）**。这是"复杂口头法体系靠专业化长期
    绕过天花板"的范式，与 DED-002 step 4 完全一致。边界意义：它是
    样本中规模最大、法体系最复杂的纯口头案例，最有资格挑战推论——
    但恰恰验证而非证伪，因为民主可达性低（单点故障式的宣讲人记忆）。

  ---

  ### 案例 2：易洛魁（豪德诺索尼）联盟 (~1450-1777)  ★边界案例

  - 人口：五族联盟约 10,000-20,000（流行病前估计可能更高）。
  - 文字状态：**mnemonic_externalization**。《大和平法》
    （Gayanashagowa）为口头宪法，但编码于 **wampum 贝珠带**——
    助记符号装置，不自解码，须由受训的"记诵者"转译。
  - 规范分布：**specialized + 代表制**。《大和平法》条文繁多
    （传统上分为百余节），其完整背诵需数日，由专门的记诵者/
    信仰守护者（faithkeepers）与 Todadaho 保存；50 个世袭酋长
    (sachem) 头衔构成代表结构；哀悼仪式 (Condolence) 须专门主持。
    普通成员掌握一般原则，但完整程序性规范握于专家。
  - 判定：**BOUNDARY → VALIDATE（专业化 + 助记外化）**。关键编码
    张力：wampum 是否算"成文"？按 DED-002 operationalization，
    "口头规范体系"要求"不存在任何形式的书面或符号记录"——wampum
    是符号记录，故严格说易洛魁**已非纯口头**，而是走向助记外化的
    过渡形态。无论如何编码，它都不构成证伪 (a)/(b)：要么因专业化
    验证推论，要么因符号外化本身就是"绕过口头上限"的证据。

  ---

  ### 案例 3：夏威夷王国（接触前，至 1778/统一 1810）

  - 人口：接触期全群岛约 200,000-400,000（估计区间 200k-800k）。
  - 文字状态：**pure_oral**（传教士 1820 年代才引入书写）。
  - 规范分布：**stratified（强）+ specialized**。Kapu（禁忌）体系
    按等级/性别显著分层：ali'i（酋长）与 maka'āinana（平民）适用
    不同 kapu，'aikapu（男女分食禁忌）按性别区分；违反某些 kapu
    对平民是死罪、对酋长则不然。kahuna（祭司）为 kapu 的专门解释者。
  - 判定：**VALIDATE（分层化 + 专业化）**。大规模纯口头社会以强分层
    维持规范体系——个体只需记忆其等级适用的子集，正是 step 5 (b)。

  ---

  ### 案例 4：凯尔特德鲁伊体系（高卢 / 爱尔兰）

  - 人口：高卢数百万；爱尔兰数十万（分散于部族）。
  - 文字状态：**script_exists_oral_law**。高卢人用希腊字母记账
    （凯撒记载），但德鲁伊禁止将教义/法律写下，法律纯口头传承。
  - 规范分布：**specialized（极端）**。德鲁伊阶层垄断法律与宗教，
    学徒受训长达 20 年（凯撒《高卢战记》）；爱尔兰 filid / brehon
    法官同类。知识深度专业化使口头体系承载大量法律。
  - 判定：**VALIDATE（专业化）**。已在 DED-002 counterexamples 中，
    此处独立复核确认。同时暴露专业化脆弱性：德鲁伊被罗马消灭后
    知识体系整体灭绝——单点故障。

  ---

  ### 案例 5：盎格鲁-撒克逊英格兰（Æthelberht 法典前，~450-600）

  - 人口：各王国数万级。
  - 文字状态：法典前 **pure_oral**（卢恩字母仅用于铭刻，不记法律）。
    Æthelberht 法典（约 602-603）是第一部书面英语法，与奥古斯丁
    传教（597）带来的拉丁读写同步。
  - 规范分布：法典前 **specialized（长老/witan 议事会掌口头习惯法）**。
  - 判定：**VALIDATE（成文化转型）**。这是"专业化口头习惯法 → 成文化"
    的清晰历史转折：王国规模上升 + 读写能力随基督教到来，二者交汇
    触发成文化，与 DED-002 step 6 的"政治-结构双重触发"一致。

  ---

  ### 案例 6：索马里 Xeer 习惯法  ★边界案例（最接近证伪 (b)）

  - 人口：索马里族历史上达数百万；但 Xeer 以**分节裂变**方式运作于
    氏族/次氏族层级，赔命价群（diya-paying group）规模常为数百至数千。
  - 文字状态：**pure_oral**。索马里语至 1972 年才确立通用（拉丁）
    正字法；此前虽有零星阿拉伯文/Wadaad 书写用于宗教，Xeer 本身
    未被书面化。
  - 规范分布：**specialized + segmented_fission**。Xeer 由 oday
    （长老）、xeer begti（习惯法专家）、guurti（长老会）与专门的
    诗人/裁决者主持；一般原则（如赔命价 diya、集体责任）广为人知，
    但具体纠纷裁决须诉诸长老/专家。系统的"大规模"由**分节裂变**
    实现——每个氏族有自己的 xeer 变体，从不维持一套跨百万人的
    统一规范。
  - 判定：**BOUNDARY → VALIDATE（专业化 + 分裂裂变）**。这是本样本中
    最有资格满足证伪 (b) 的案例：大人口、长历时、纯口头。但它**不**
    证伪——因为 (i) 存在专业化（长老/习惯法专家有主导解释权），
    (ii) 规范承载单元靠分裂维持在口头上限之下（并非一套均等分布的
    统一规范）。若强行忽略长老的专门角色，才可能误判为反例；
    但民族志证据（如 I.M. Lewis 等）不支持"分布完全均等"。

  ---

  ### 案例 7：前殖民伊博族（无国家/无首领社会，至 ~1900）  ★边界案例

  - 人口：伊博族数百万；但组织为自治村落/村群，单元规模数百至数千。
  - 文字状态：**pure_oral**（nsibidi 表意符号仅限跨河地区、
    未用于伊博村落法）。
  - 规范分布：**segmented_fission + specialized + 部分 democratic**。
    "Igbo enwe eze"（伊博无王），村落议事会（ama-ala）、年龄组、
    Ozo 头衔社团参与治理，omenala（"土地的习俗"）在单元内相对
    可参与；但存在 dibia（占卜/仪式专家）、长老、以及**神谕**
    （Arochukwu 的 Ibini Ukpabi、Awka 的 Agbala）作为跨村终极仲裁者
    ——真实的专业化。
  - 判定：**BOUNDARY → VALIDATE（分裂裂变 + 专业化）**。以"平等无首领"
    著称，是证伪 (b) 的重要候选。不证伪的原因同索马里：数百万人口靠
    **裂变**为小自治单元消化，统一规范社区始终小于阈值；且神谕/dibia
    构成专门仲裁角色。单元内的相对民主可达恰恰出现在人口小于 5000
    的层级，不满足证伪 (a) 的"> 5000 人 + 300 条独立掌握"。

  ---

  ### 案例 8：切诺基族（口头法律传统，至 1821）

  - 人口：18 世纪约 20,000-30,000（分布于诸城镇）。
  - 文字状态：**pure_oral 直到 1821**——Sequoyah 音节文字（1821）
    发明后，切诺基在数年内迅速**成文化**（1808 首部成文法、
    1827 宪法）。
  - 规范分布：成文化前 **specialized + 氏族分节**。七个母系氏族的
    血亲复仇法、城镇议事会；传统中曾有祭司阶层（Ani-Kutani，
    据传被推翻）。
  - 判定：**VALIDATE（成文化转型，近乎自然实验）**。面对美国扩张
    压力而中央集权化的同时，恰好发明文字并立即成文化——复杂度
    上升与成文化在时间上高度耦合，强力支持 step 6。

  ---

  ### 案例 9：祖鲁王国 (1816-1879)

  - 人口：沙卡治下约 250,000+。
  - 文字状态：**pure_oral**。
  - 规范分布：**specialized + stratified**。izimbongi（赞颂诗人）
    保存王室系谱与法律，izinduna 行政官执行，amabutho 同龄兵团
    为平行结构；王为立法者；王室/平民/兵团适用差异化规范。
  - 判定：**VALIDATE（专业化 + 分层化）**。（DED-001 已分析同一政体。）

  ---

  ### 案例 10：达荷美王国 (c. 1600-1894)

  - 人口：约 200,000+。
  - 文字状态：**pure_oral**（晚期有限阿拉伯文使用）；
    但普查用 **cowrie 结绳计数**（mnemonic_externalization 的痕迹）。
  - 规范分布：**specialized**。年度"习俗"仪式（xwetanu）作为口头
    普查与问责机制，国王在集会接收各地报告；Migan 等专门官员。
  - 判定：**VALIDATE（专业化）**。cowrie 结绳用于人口统计，是助记
    外化的萌芽，与"口头上限催生外化"一致。（DED-001 已分析。）

  ---

  ### 案例 11：蒙古帝国早期（Yassa 法律，1206-~1240）

  - 人口：早期部落联盟 ~百万级，帝国扩张后更大。
  - 文字状态：**mnemonic_externalization → literate（秘密）**。
    据史料 Yassa 以回鹘字母写定并由黄金家族**秘藏**，非公开可查。
    普通蒙古人依口头习惯法（törü / yosun）行事。
  - 规范分布：**stratified（准入分层）+ specialized + 早期成文化**。
    札鲁忽赤（jarghuchi）法官司法；成文的 Yassa 因秘藏而**不具**
    民主可达性。
  - 判定：**VALIDATE**。重要例证：**成文化 ≠ 民主可达**——把规范写下
    但限制查阅，仍是分层化的准入控制。正好印证 DED-002 step 5(a)
    的检验标志要求"成员可通过查阅文本获取规范"，而秘藏 Yassa 不满足。

  ---

  ### 案例 12：古罗马（十二铜表法前，至公元前 451）

  - 人口：早期共和国罗马数万至 ~15 万。
  - 文字状态：**script_exists_oral_law**。拉丁字母早已存在
    （约公元前 7 世纪），但法律**未成文**，由贵族祭司团
    （pontifices）垄断解释。
  - 规范分布：**specialized（祭司垄断）→ 成文化**。十二铜表法
    （前 451-450）是平民迫使贵族将已有法律从少数人记忆解放到
    公共铜表——降低规范获取成本。
  - 判定：**VALIDATE（专业化 → 成文化）**。DED-002 supporting anchor
    的范式案例，独立复核确认。编码提示：**非纯口头**（有文字但
    不写法律），属 script_exists_oral_law 灰区。

  ---

  ### 案例 13：早期以色列（摩西律法前，前 ~1200-1000，文本重构）

  - 人口：部落联盟数万级（估计）。
  - 文字状态：判定困难。"摩西律法前"是**文本-神学建构**，非独立
    可考的历史阶段；西奈成文化叙事本身即一个"成文化转型"母题，
    历史真实性无法独立验证。
  - 规范分布：史学重构下为 **segmented_fission + specialized**
    （分节部落、城门口长老、利未/祭司专门角色）。
  - 判定：**BOUNDARY / 低置信度（近 IRRELEVANT）**。因缺乏独立于
    宗教文本的民族志证据，本案例不足以支撑或反驳推论；诚实标记为
    数据不足。它既不构成反例，也不应被计为有力的验证。保留于样本
    仅为透明记录"我们考察过它并判定证据不足"。

  ---

  ### 案例 14：汤加王国（波利尼西亚，~19 世纪前）

  - 人口：约 10,000-40,000。
  - 文字状态：**pure_oral**（传教士 1820-30 年代引入书写）。
  - 规范分布：**stratified（强）+ specialized**。Tu'i Tonga 神圣
    至尊、hou'eiki 酋长、matāpule（"说话酋长"/司仪专家）、
    tu'a 平民构成严格等级；**matāpule 是礼仪、系谱与规范的专门
    掌管者**；tapu 按等级适用。
  - 判定：**VALIDATE（分层化 + 专业化）**。

  ## 检验结果汇总（汇总表）

  | 案例 | 人口估计 | 文字状态 | 规范分布模式 | 判定 |
  |------|----------|----------|--------------|------|
  | **冰岛自由邦** | 3-6 万 | 口头(成文化前) | 专业化(宣讲人) | **BOUNDARY→VALIDATE** |
  | **易洛魁联盟** | 1-2 万 | 助记外化(wampum) | 专业化+代表制 | **BOUNDARY→VALIDATE** |
  | 夏威夷 | 20-40 万 | 纯口头 | 分层化+专业化 | VALIDATE |
  | 凯尔特德鲁伊 | 高卢数百万 | 有文字但法律口头 | 专业化(极端) | VALIDATE |
  | 盎格鲁-撒克逊(法典前) | 数万 | 纯口头 | 专业化→成文化 | VALIDATE |
  | **索马里 Xeer** | 族群数百万 | 纯口头 | 专业化+分裂裂变 | **BOUNDARY→VALIDATE** |
  | **前殖民伊博** | 族群数百万 | 纯口头 | 分裂裂变+专业化 | **BOUNDARY→VALIDATE** |
  | 切诺基(1821前) | 2-3 万 | 纯口头→成文化 | 专业化→成文化 | VALIDATE |
  | 祖鲁 | 25 万+ | 纯口头 | 专业化+分层化 | VALIDATE |
  | 达荷美 | 20 万+ | 纯口头(cowrie助记) | 专业化 | VALIDATE |
  | 蒙古早期(Yassa) | 百万级 | 助记外化→秘藏成文 | 分层化+专业化 | VALIDATE |
  | 古罗马(铜表法前) | 数万-15万 | 有文字但法律口头 | 专业化→成文化 | VALIDATE |
  | 早期以色列(律法前) | 数万 | 判定困难 | 分节+专业化(重构) | BOUNDARY/数据不足 |
  | 汤加 | 1-4 万 | 纯口头 | 分层化+专业化 | VALIDATE |

  ## 核心发现（核心发现）

  **1. 无反例存活。** 14 个案例中，**没有任何一个满足证伪条件 (a) 或 (b)**。
  所有人口 > 10000 的纯口头（或口头规范）社会，无一例外地呈现至少一种
  DED-002 预测的适应，且多数呈现两种以上（如夏威夷=分层+专业化、
  汤加=分层+专业化、祖鲁=专业化+分层、蒙古=分层+专业化+早期成文化）。

  **2. 观察到人口规模与民主可达性的反向关系（推论的定性确证）。**
  民主可达性最高的场景（伊博村落、索马里次氏族、单个易洛魁城镇）恰好
  出现在**人口小于或接近 5000** 的单元层级，且这些单元的显式规范总量
  不是"数百条独立掌握"的量级；而人口远超 5000 的政体（夏威夷、祖鲁、
  汤加、达荷美）无一例外走向专业化/分层化，民主可达性低。**规模与
  可达性的此消彼长，正是天花板存在的直接经验印记。**

  **3. 发现推论未列出的第四种适应：分裂裂变（segmentation / fission）。**
  最接近证伪 (b) 的两个案例——索马里 Xeer 与前殖民伊博——都不是靠
  一套均等分布的统一口头规范承载数百万人，而是**通过分裂为大量自治
  小单元**，让每个规范承载单元始终维持在口头上限之下。这是对"人口
  增长 → 复杂度超限"压力的第四种回应：**不改造规范体系，而是拒绝
  让被治理单元超过口头容量。** 它与推论完全兼容（推论约束的是"统一
  的民主可达性"），但**推论的适应清单 (a)(b)(c) 应补充第四项**，或至少
  声明分节社会通过 fission "规避"而非"突破"天花板。建议反馈至 DED-002
  走 Rule B 修订（见结论）。

  **4. 助记外化装置构成"口头 vs 成文"的真实灰区。** 易洛魁 wampum、
  达荷美 cowrie 结绳、（及 DED-001 中印加 quipu）表明许多"口头"社会
  在触及上限时会长出**符号助记装置**——这既非纯记忆亦非完整成文，
  而是**外化的萌芽**。这些案例支持而非削弱推论：外化装置的出现本身
  就是口头容量见顶的信号。但它们使"纯口头"的严格判定变得困难，
  是编码方案的主要不确定源。

  **5. 成文化转型与"复杂度上升 + 读写可得"的时间耦合反复出现。**
  盎格鲁-撒克逊（王国扩张 + 基督教读写）、古罗马（平民抗争 + 已有文字）、
  切诺基（集权压力 + Sequoyah 文字）、蒙古（帝国扩张 + 回鹘文字）——
  四个独立文化中，成文化都在社会复杂度上升与书写手段可得的交汇点出现，
  与 DED-002 step 6"政治-结构双重触发"一致。

  ## 局限性（局限性）

  1. **代理指标而非直接测量。** 证伪 (a)(b) 要求测量"> 80% 成员独立
     掌握 > 300 条规范"和"分布是否均等"，对已消亡社会不可能直接测量。
     本检验以"是否存在专业化/分层化的制度证据"作代理。代理方向性风险：
     倾向于**高估**推论（把精英角色宽松地算作专业化）。已用 > 30% 阈值
     口径和对边界案例的保守判定对冲，但无法完全消除。

  2. **单一编码者，无 intercoder reliability。** 未做双编码，无 Cohen's κ。
     文字状态四分类（尤其助记外化 vs 纯口头 vs 有文字但法律口头）与
     规范分布多选判定均由单人裁量。**本检验因此未能解除 DED-002
     对抗式审查遗留的悬挂标记**（编码协议需试运行 + 报告信度）。
     这是本检验最重要的方法论短板。

  3. **未检验证伪条件 (c)。** (c) 需统一编码方案下的跨文化规范"计数"
     量化研究，产出可比的规范数量中位数；案例分析法无法完成。
     故 (c) 保持"未检验"状态，检验结论仅覆盖 (a)(b)。

  4. **人口估计的高度不确定性。** 前现代/接触前人口（夏威夷 200k-800k、
     索马里/伊博"族群数百万"）区间宽，且"族群人口"与"规范承载单元
     人口"不是同一量——分节社会尤甚。表中人口列应视为量级参考。

  5. **选择性与"接触污染"偏差。** 14 例非随机样本，均为有较好民族志/
     史学记录者，而这类记录多产生于欧洲接触时或之后，可能已扭曲"原生"
     口头状态（传教、殖民行政、文字引入的回溯影响）。纯口头社会在
     可考记录中被系统性低估，可能使"更难找到反例"这一结果部分是
     记录偏差的产物，而非纯粹的经验事实。

  6. **早期以色列一例数据不足。** "摩西律法前"缺乏独立于宗教文本的
     证据，已诚实标记为数据不足，不计入有力验证，亦不计入反例。

  7. **"300 条 / 80%"阈值的经验根据仍薄弱。** 与 DED-002 自身悬挂
     标记一致：这些阈值缺乏独立的认知科学/民族志定标，本检验只能
     以"是否存在适应"间接绕过，无法直接确证阈值本身的正确性。

  ## 结论（结论）

  **检验结论：无反例存活（覆盖证伪条件 a、b）。**
  14 个前现代/无文字社会中，未发现任何满足证伪 (a) 或 (b) 的案例。
  四个最有资格挑战推论的边界案例——冰岛、易洛魁、索马里 Xeer、伊博——
  逐一深查后均**验证**而非证伪：冰岛=专业化，易洛魁=专业化+助记外化，
  索马里=专业化+分裂裂变，伊博=分裂裂变+专业化。**找不到反例本身
  是一个有信息量的结果**：它表明在有记录的大规模口头社会中，规范体系
  无一例外地以专业化/分层化/成文化/裂变来应对复杂度——民主可达的
  大规模纯口头规范体系在经验样本中不存在。

  **对推论置信度的影响（依 Rule C result_to_status）：**
  - 结果类型：**"无反例存活"**（针对 a、b）。
  - 效果：**verified 维持**，经验（Bayesian）置信度上升，本检验可作为
    DED-002 的支撑证据登记。
  - 不升 verified\* ：未发现疑似反例。
  - 但 (c) 未检验、单编码者无信度、代理指标偏保守——**置信度上升幅度
    应打折**，不宜宣称推论已获强经验确证。

  **反馈与下一步（feed back to Rule B）：**
  1. **建议 DED-002 走 Rule B 修订**，将"分裂裂变（fission/segmentation）"
     纳入适应清单（作为第四种，或作为"规避天花板"与"突破天花板"的
     区分）。当前 (a)(b)(c) 三分对分节无国家社会（伊博、索马里）覆盖
     不足——它们不改造规范体系，而是不让单元超限。
  2. **执行一次真正的量化编码试运行以攻击证伪 (c)**：选 2-3 个证据充分
     的案例（成文化前后可比者，如冰岛 Grágás 成文本 vs 一个纯口头
     狩猎采集社会 vs 一部早期成文法典），用 DED-002 measurement_protocol
     做**双编码 + 报告 Cohen's κ**，产出规范计数。这将同时（i）解除
     DED-002 遗留的编码协议悬挂标记，（ii）首次直接触碰证伪 (c)。
  3. **收紧"纯口头"的操作化**：明确 wampum/quipu/cowrie 等助记装置的
     归类规则，因为它们是本检验最大的编码歧义来源，也是理论上最有趣的
     "外化萌芽"层。

