id: EMP-TEST-004
target: DED-004
date: 2026-07-13
type: empirical_test
status: pre_registered   # 预注册：样本+编码方案+排除结果已锁定，编码尚未开始
layer: L3-deductions

# === 检验对象（只测 DED-004 的唯一非平凡内容 P1）===

what_is_tested: |
  DED-004 经两轮对抗审查(ADV-REVIEW-008)缩水后，独有可证伪内容【只有 P1】：
  两项信息外化——A(行政外化)与 B(规范外化)——共享同一使能基底(外部持久介质)，
  因此【控制规模后仍正相关】、倾向同介质家族。
  本检验只测 P1；三难与 P2(已降为解释性统一)不在检验范围。

  承重臂 = 共时臂：在【越过至少一堵天花板的大型/复杂政体】子样本内，
  A 与 B 是否仍关联，还是【离对角(A≠B)案例】占主导。
  （历时臂"长寿识字帝国最终两者都写下"近乎真理套话、不承重，不测。）

# === 预注册声明（Rule C 硬约束：结果出来前锁定，禁止事后调整）===

pre_registration:
  locked_date: 2026-07-13
  discipline: |
    以下样本清单、编码方案、排除结果在【任何编码结果产生之前】写定。
    编码者不得增删样本、不得在看到结果后修改编码规则或排除标准。
    本测试【故意】把能让 P1 死掉的离对角案例(冰岛/印加/蒙古/早期伊斯兰)
    放进样本——这是一场可能失败的检验，不是稳赢的检验。

# === 编码方案（预先声明）===

test_design:

  coding_scheme:
    A_administrative_externalization:
      question: "该政体是否把行政/协调信息外化到持久介质、并用于跨层级运作？"
      positive_examples: "普查册、赋税登记、标准化行政报告、账册、印章文书系统"
      rule: "二元 1/0。弱义：只要存在被行政实际使用的持久外部记录即 A=1。纯口头汇报=A=0。"
    B_normative_externalization:
      question: "该政体的规范/法律是否被外化到持久介质（内容在介质里）？"
      rule: |
        二元 1/0，用 DED-004 的【弱义 B】：内容在【介质里】——需专家【读取】
        仍算 B(如书吏念律碑)；内容在【专家记忆里】、介质仅助记不自解——不算 B
        (如结绳 quipu、纯口传法)。成文律典/律碑/书面法律文本=B=1。
    S_scale:
      question: "规模档（用于控制规模的协变量）"
      bands: "1=<1万; 2=1万–10万; 3=10万–100万; 4=>100万（按盛期人口量级）"
    M_medium_family:
      question: "仅当 A=1 且 B=1：A 与 B 是否用同一介质家族？"
      rule: "1=同家族(如同一文字系统); 0=互不相关的分立介质; NA=非 A=1B=1 案例"

  sample_frame:
    inclusion: "大到/复杂到足以逼近至少一堵天花板(盛期人口≳1万 或 有效层级≳5)，且史料足以编 A、B。"
    deliberate_off_diagonal: "样本【必须】含离对角危险案例，使 P1 真有被证伪的机会。"
    locked_sample:   # 20 个，锁定，不得增删
      literate_empires_expect_A1B1:
        - 古巴比伦（汉谟拉比期）
        - 法老埃及（新王国）
        - 汉代中国
        - 罗马帝国
        - 奥斯曼帝国
      off_diagonal_danger_cases:
        - 印加帝国            # A=1? B=? quipu——承重深查①
        - 蒙古帝国            # A=1 census/yam, B=? Yassa 薄
        - 冰岛自由邦          # B=1(1117 Grágás) 而 A=0(无官僚)——成文不官僚
        - 早期伊斯兰哈里发    # A=1 文书行政, B=? Hadith 早期口传——承重深查②
        - 阿兹特克三方联盟    # A=? 图画贡赋册, B=?
      borderline:
        - 古典雅典            # B=1 刻石法, A=?
        - 玛雅古典期城邦
        - 夏威夷统一王国（前接触）
        - 密西西比/卡霍基亚
      large_oral_states:
        - 祖鲁王国（沙卡）
        - 达荷美王国
        - 阿散蒂（Asante）
      segmentary_expect_A0B0:
        - 索马里（Xeer）
        - 前殖民伊博
        - 努尔（Nuer）

  boundary_case_handling: |
    - 边界案例(印加/早期伊斯兰/雅典/阿兹特克)必须在结果表中突出标记。
    - 印加的 A、B 判定对结论最敏感：若 quipu 只承载 A、不承载 B，则印加=离对角，
      直接压向 P1 证伪。必须重点分析，不得为保 P1 而把 quipu 算作 B。
    - 阿兹特克图画文字、雅典行政外化程度都是编码歧义点，须诚实标记。

  excluded_outcome:
    rule: "以下任一结果 → P1 证伪或 inconclusive，不得事后放宽以救 P1。"
    triggers:
      - "在'越过至少一堵天花板'的大型/复杂子样本内，离对角(A≠B)案例占比 > 40%。"
      - "控制规模后 A、B 的 partial-φ 不显著为正（或 ≤0）。"
      - "多数 A=1B=1 案例使用【互不相关的分立介质家族】(M=0 占主导)——'共享基底'机制被削弱。"
      - "存在 ≥1 个持久(>100年)大型深层统一政体【永久】只外化其一(离对角且非短期时滞)。"
    honest_note: |
      原始 φ 几乎必然很高(小口头社会 A0B0 + 大识字帝国 A1B1)，但那是【规模共同因】
      造成的平凡相关，不算 P1 的证据。P1 的真正检验在【大型子样本内的离对角占比】
      与【控制规模的 partial-φ】——这两个才承重。

# === 结果（编码后回填）===

results:
  status: conducted
  coder: "独立子 Agent (general-purpose, 盲编码——未被告知'A、B 相关'是受检假设)"

  coding_table: |
    #  政体            A B S M   离对角
    1  古巴比伦        1 1 4 1   -
    2  法老埃及        1 1 4 1   -
    3  汉代中国        1 1 4 1   -
    4  罗马帝国        1 1 4 1   -
    5  奥斯曼          1 1 4 1   -
    6  印加            1 0 4 NA  ★ A1B0 (quipu 数值可读=A; 法律在记忆里=B0)
    7  蒙古            1 1 4 1   -  (B 争议: 大扎撒是否成文体)
    8  冰岛自由邦      0 1 2 NA  ★ A0B1 (1117 成文 Grágás; 无官僚)
    9  早期伊斯兰      1 1 4 1   -  (古兰经~650 成典)
    10 阿兹特克        1 0 4 NA  ★ A1B0 (图画贡赋册=A; 图文难载抽象法条=B0)
    11 古典雅典        1 1 3 1   -
    12 玛雅古典城邦    1 0 3 NA  ★ A1B0 (文字/政治记录=A; 无成文法=B0)
    13 夏威夷          0 0 3 NA  -
    14 密西西比/卡霍基亚 0 0 2 NA -
    15 祖鲁            0 0 3 NA  -
    16 达荷美          1 0 3 NA  ★ A1B0 (贝币结算普查=A; 王法口传=B0)
    17 阿散蒂          1 0 4 NA  ★ A1B0 (金衡国库账=A; 阿肯习惯法口传=B0)
    18 索马里(Xeer)    0 0 4 NA  -  (分节社会, S 为族群量级非政体)
    19 前殖民伊博      0 0 4 NA  -  (分节社会, 同上)
    20 努尔            0 0 3 NA  -  (分节社会, 同上)

  contingency_2x2: |
    全样本(N=20):    B=1  B=0
              A=1     8    5
              A=0     1    6
    raw_phi ≈ 0.45 (χ²≈4.1, p≈0.04)——但这是【规模共同因】造成的平凡相关，不承重。

  large_tier_off_diagonal_rate: |
    大型统一政体子样本(排除索马里/伊博/努尔三个分节社会——它们是 DED-002 的
    规避型、非统一政体；S≥3 unified，N=15)：离对角 5/15 = 33%；
    只看该子样本内的外化者(A=1 或 B=1，N=13)：离对角 5/13 = 38%。
    ——贴着预注册的 40% 证伪红线。

  partial_phi_controlling_scale: |
    分规模档看：
    - S=4 档(10 个大帝国, 排除分节)：A 【全部=1】(无方差) → 无法提取 A-B 相关；
      而 B 有 7 个 1、3 个 0。即大帝国这档 A 恒真、B 却在变 → 控制规模后
      共时相关基本消失。
    - S=3 档：φ≈+0.41(n 极小，不稳)。
    - S=2 档：φ=0(冰岛 A0B1 + 密西西比 A0B0)。
    结论：raw_phi=0.45 主要是规模伪相关；【控制规模后 partial-φ 趋零/不稳】
    ——正是 ADV-REVIEW-008 C5 预言的规模混淆被坐实。

  deep_dive_inca_quipu: |
    印加 B=0，置信 75-80%(编码者独立裁断)。数值 quipu 已破解、自解(→ A=1)；
    但叙事/法律 quipu 迄今无一被解读出可读语义，学界(Urton 未证实/Salomon
    民族志显示 khipu 主要作结构性助记、依赖本地既有知识)现状指向：法律内容
    在 quipucamayoc 【记忆】里、结绳仅索引 → 按弱义 B(内容须能从介质读取)判 0。
    诚实保留：若未来叙事 quipu 被证实编码可读内容，B 可翻 1。

  deep_dive_early_islamic: |
    早期伊斯兰 B=1，【不构成持续解耦】。古兰经约 650 成典(规范核心文本几乎
    立即外化)；行政 A=1 亦早(diwan ~640s)。口传的是 hadith 教法【细体】、约
    150 年内系统成文(Muwatta ~765)，且始终有成文规范核心在场。属短期时滞，
    非"行政已外化、规范永远口头"。→ 不威胁 P1。

  permanent_one_way_search: |
    【行政向单向解耦(A1B0) 真实且可持续】：达荷美(~290 年)、阿散蒂(~200 年)
    行政数值外化而法律全程口传；印加最典型但仅 <100 年且 quipu 载法与否有争。
    【规范向单向解耦(A0B1) 大规模上无案例】：仅袖珍冰岛(S=2)。
    诚实边界：无一例能坐实"永久"(达荷美/阿散蒂被殖民中断、印加被灭)——
    "永久"不可证；但【方向不对称在大规模、长时段上是清楚的】。

conclusion: |
  == 对 DED-004 的 P1 的影响 ==

  【对称 P1(共选择、控制规模后相关) 没通过检验】：
  - raw φ=0.45 是规模伪相关；控制规模后 partial-φ 趋零/不稳(大帝国档 A 无方差)。
  - 大型子样本离对角占比 33-38%，贴 40% 红线；A1B0(行政有·规范无)是主导离对角
    型，集中在非表音记录社会(结绳/图画/结算符)。
  - 达荷美~290 年、阿散蒂~200 年的持续行政向单向解耦，逼近"永久单向"证伪。
  预注册的证伪触发器【实质性触发】。DED-004 的唯一承重内容(共时 P1)未获经验支持。

  【但捞出一个更硬的不对称幸存者(数据自己长出来的)】：
    B ⇒ A 成立 89%(9 个规范外化社会中 8 个也外化行政，唯一例外冰岛)；
    A ⇒ B 仅 62%(13 个行政外化社会中 5 个不外化规范)。
  即：外化规范几乎必然外化行政(能写抽象法条的全套文字也服务行政)，
  但外化行政常常不外化规范(记数字贡赋的结绳/图画撑不起抽象法条)。
  这是比对称 P1 更强、更可证伪的经验命题。

  == Rule C 裁断 ==
  依 result_to_status：发现【确凿的离对角反例】(印加/阿兹特克/玛雅/达荷美/阿散蒂
  的 A1B0，非编码噪声，深查①确认印加)对【对称 P1】成立；但因单编码者(部分独立、
  个别格有争议、印加 75-80%)，保守定为【疑似反例偏强】。
  建议：DED-004 从 verified 降 verified*，触发 Rule B 重审——把 P1 从对称形式
  修订为【不对称形式(B⇒A 而非 A⇒B)】，或限定适用范围。这与 DED-002 经 EMP-TEST-002
  长出"分裂裂变"是同型的"经验检验反哺推论"。

  == 悬挂标记 ==
  - 单编码者，未做多模型 ICV 盲编码——建议对 A/B 编码施加 ICV(blind_coder.py)
    firm up，尤其印加/蒙古/玛雅三个争议格。
  - "永久单向"不可证(最强案例被殖民中断)——方向不对称清楚，但"永久"是推不出的。

