id: EMP-TEST-001
target: DED-001
date: 2026-07-13
type: empirical_test
status: conducted
人话摘要: "拿 14 个前现代国家/帝国的真实历史去撞推论 DED-001（没有文字等记录系统辅助，组织的有效管理层级深不过 8 层）：数了每个的层级深度和有没有记录系统，没找到反例。后来独立 AI 复核一度把布干达算成 8 层、疑似反例，作者查一手史料确认它实为 6 层，反例不成立，推论仍站得住。"

report: |
  # 经验检验：DED-001 组织深度天花板

  ## 检验目标

  DED-001 的核心预测：
  > 不存在层级 ≥ 8 级、无形式化信息系统辅助、顶层决策准确反映
  > 底层现实的人类组织。

  等价表述：所有层级 ≥ 8 的有效组织必然存在某种形式化信息系统。

  ## 检验设计

  ### 定义

  **有效层级：** 上级对下级的决策空间构成实质性约束（非建议/咨询）。
  在历史案例中，通过是否存在"上级可以否决/修改下级的决策"
  的制度安排来判定。

  **形式化信息系统：** 外在于人脑的、用于存储/传输/处理组织状态信息的系统。
  包括：文字、结绳记事（quipu）、图画文字（pictograms）、
  符号记录系统。不包括：纯口头传承、个人记忆、非正式通信。

  ### 方法

  选取 14 个前现代国家/帝国，对每个统计：
  1. 行政层级深度（从底层操作单元到最高决策者）
  2. 是否存在形式化信息系统
  3. 信息系统的类型和管理范围

  层级统计规则：
  - 只计算构成实质性决策约束的层级（形式层级 = 有效层级）
  - 平行系统（如军事与民政、领土与氏族）各自独立计数
  - 取主要治理链条中最长的一条

  ## 案例数据

  ### 案例 1：印加帝国 (1438-1533)

  | 层级 | 职位 | 职能 |
  |------|------|------|
  | 1 | Sapa Inca（皇帝） | 最高统治者 |
  | 2 | Apu（四地区总督） | 四大 Suyu 的统治者 |
  | 3 | 行省总督 | ~80 个行省的行政长官 |
  | 4 | Okoyrikoq（巡查官） | 皇室血亲，直接向库斯科汇报 |
  | 5 | Kuraka（地方酋长） | Ayllu 共同体首领 |
  | 6 | 十进制单位首领 | 1000/500/100/50/10 户各级首领 |
  | 7 | 家庭/户 | 基本单位 |

  **有效层级数：6**（Sapa Inca → Suyu → Province → Kuraka → Decimal → 户）
  **形式化信息系统：是** — Quipu（结绳记事）。十进制数值编码，多色分类，
  专用记录员（quipucamayoc）附属于各级行政单位。跨地区传递通过
  驿使（chasquis）沿道路系统进行。
  **判定：层级 < 8，不在检验范围内。**

  ---

  ### 案例 2：布干达王国 (14世纪-1894)

  | 层级 | 职位 | 职能 |
  |------|------|------|
  | 1 | Kabaka（国王） | 绝对君主 |
  | 2 | Katikkiro（首相） | 首席行政官、税收、军事动员 |
  | 3 | Omulamuzi/Omuwanika | 首席法官/财政官 |
  | 4 | Abamasaza（郡长） | 10 个郡的行政长官 |
  | 5 | Abagombolola（副郡长） | 郡下分区 |
  | 6 | Abamiluka（教区级酋长） | 教区级行政 |
  | 7 | Abatongole（村长） | 最低领土行政官 |
  | 8 | Bataka（氏族长） | 氏族土地分配、征税 |
  | 9 | 家庭 | 基本社会单位 |

  **有效层级数：7-8**（不含 Bataka 为 7；含 Bataka 为 8。
  注意 Bataka 和领土层级是平行系统——在实际治理中，
  Kabaka 通过领土酋长而非氏族长行使权力。
  领土链条为层级 1→2→4→5→6→7→9 = 7 级。）

  **形式化信息系统：否** — 纯口头社会。行政连续性通过系谱专家、
  口头法律传统、Lukiiko（议事会）辩论来维持。无文字系统。
  19 世纪后期有阿拉伯文字传入但未用于王国行政。

  **判定：边界案例。** 领土行政链为 7 级有效层级，恰好在天花板边缘。
  没有达到 8 级。如果是 7 级——推论预测通过（7 级在 5-7 范围内）。
  如果是 8 级——将是对推论的潜在挑战。
  但需要注意：7 级的"有效"性需要更详细的行政史数据来验证——
  可能国王对村级事务的实际决策约束是薄弱的（暗示有效层级 < 7）。

  ---

  ### 案例 3：阿散蒂王国 (1701-1902)

  | 层级 | 职位 | 职能 |
  |------|------|------|
  | 1 | Asantehene（大王） | 最高统治者，金凳守护者 |
  | 2 | Asantehemaa（太后） | 共同统治者 |
  | 3 | Amanhene（联邦区酋长） | 主要区域的最高酋长 |
  | 4 | Omanhene（邦国酋长） | 邦国级统治者 |
  | 5 | Ohene/Abrempon（镇/区酋长） | 镇级世袭酋长 |
  | 6 | Mpanyimfo（长老议事会） | 血统代表、传统守护者 |
  | 7 | Odikro（村长） | 村级亲属权威 |
  | 8 | Abusua Panyin（血统首领） | 家庭/氏族长老 |

  **有效层级数：6-7**（Asantehene → Amanhene → Omanhene → Ohene →
  Mpanyimfo → Odikro → 家庭 = 7 级。Asantehemaa 是平行权威
  而非上下级约束链中的一环。）

  **形式化信息系统：否** — 纯口头。通过冗长的仪式性宣誓、
  Kotoko 议事会、鼓语历史、口传金凳叙事来维持治理。

  **判定：7 级，在天花板范围内（5-7）。推论预测成立。**

  ---

  ### 案例 4：祖鲁王国 (1816-1879)

  | 层级 | 职位 | 职能 |
  |------|------|------|
  | 1 | Inkosi（国王） | 最高军事和司法权威 |
  | 2 | Indlovukazi（太后） | 共同统治者，独立宫廷 |
  | 3 | Induna（大酋长/将军） | 高级国家官员、区域总督 |
  | 4 | Amakhosi（区域酋长） | 被征服区域的酋长 |
  | 5 | Izinduna（地方头人） | 村级税收、征兵 |
  | 6 | Abanumzane（家户长） | 亲属户级权威 |
  | 7 | Amabutho（同龄兵团） | 平行军事-行政结构 |

  **有效层级数：5-6**（Inkosi → Induna → Amakhosi → Izinduna →
  Abanumzane = 5 级。Indlovukazi 和 Amabutho 是平行系统。
  注意：同龄兵团提供了额外的控制线但不增加层级深度。）

  **形式化信息系统：否** — 纯口头。赞颂诗人（izimbongi）保存王室系谱
  和法律。口头法律传统。

  **判定：5-6 级，远在天花板以下。推论预测 trivial 成立。**

  ---

  ### 案例 5：蒙古帝国（早期，1206-1220 年代）

  | 层级 | 职位 | 职能 |
  |------|------|------|
  | 1 | 大汗（Khaghan） | 最高统治者 |
  | 2 | 万户长（Tümen-ü Noyan） | 万夫长 |
  | 3 | 千户长（Mingghan-u Noyan） | 核心操作单元 |
  | 4 | 百户长（Zuun-u Noyan） | 百夫长 |
  | 5 | 十户长（Arban-u Noyan） | 十夫长 |
  | 6 | 户 | 基本单位 |

  **有效层级数：5**（可汗 → 万户 → 千户 → 百户 → 十户 → 户）

  **形式化信息系统：初始无，后引入。** 早期阶段（1206-1220）：
  法律（Yassa）通过口头传承，命令通过口头传递。
  1220 年代后：采用回鹘文字，引入书记官（bichegchin），
  开始书面行政。但系统的核心（十进制军事链条）
  即使在引入文字后仍主要依赖口头指挥链。

  **判定：5 级，远在天花板以下。早期阶段无形式化系统但在
  天花板限制内运作正常。引入文字发生在帝国扩张期——
  非因触及层级天花板，而是因跨地理和文化跨度需要记录
  （PHY-003 地理距离的约束，非层级深度）。**

  ---

  ### 案例 6：加洛林帝国 (800-843)

  | 层级 | 职位 | 职能 |
  |------|------|------|
  | 1 | 皇帝 | 最高统治者 |
  | 2 | Missi Dominici（巡查使） | 皇室巡查员对（主教+贵族） |
  | 3 | 伯爵（Comites）/主教 | ~250-300 个郡的行政长官 |
  | 4 | 子爵/代理官/百户长 | 郡以下的官员 |
  | 5 | Scabini（陪审员） | 自由民协助法庭 |
  | 6 | 地方社区 | 基本单位 |

  **有效层级数：4-5**（皇帝 → Missi → 伯爵/主教 → 子爵级 → 地方社区）

  **形式化信息系统：是。** 敕令（capitularies）的书面颁布和传达。
  Missi 的书面报告（人口名单、宣誓者名册、案件档案）。
  每名伯爵/主教/修道院长应配公证人（notary）。
  但需注意：书面系统是**半正式的**——中央无档案保存，
  文件由巡查使个人保管。读写能力在伯爵中不普遍。
  命令通常由拉丁文书写但由本地语言口头传达。

  **关键观察：帝国规模极大（西欧大部分）但行政层级仅 4-5 级。
  这和 DED-001 的预测一致：浅层级 + 形式化信息系统 = 有效治理。
  注意：如果加洛林帝国试图用纯口头手段治理同等领土，
  5 级层级可能不够——但推论未对此做出预测。**

  **判定：4-5 级 + 半形式化信息系统。层级浅，不检验天花板。**

  ---

  ### 案例 7：阿兹特克帝国 (1428-1521)

  | 层级 | 职位 | 职能 |
  |------|------|------|
  | 1 | Huey Tlatoani（大帝） | 特诺奇蒂特兰的最高统治者 |
  | 2 | 三方联盟（Tetzcoco, Tacuba） | 联盟伙伴 |
  | 3 | Altepetl（城邦统治者） | 城邦级行政 |
  | 4 | Calpulli 首领 | 土地持有社会单位的首领 |
  | 5 | 家庭 | 基本纳税单位 |

  **有效层级数：4**
  **形式化信息系统：是。** 图画文字贡赋记录（Codex Mendoza、
  Matrícula de Tributos）。20 进制数值系统。贡赋按省份×商品
  逐项记录。这是中美洲唯一的此类系统。

  **判定：4 级，浅层级。推论预测 trivial 成立。**

  ---

  ### 案例 8：古埃及古王国 (c. 2686-2181 BCE)

  | 层级 | 职位 | 职能 |
  |------|------|------|
  | 1 | 法老 | 神王，最高权威 |
  | 2 | 维齐尔（Vizier） | 首席行政官 |
  | 3 | 诺姆长（Nomarchs） | ~42 个诺姆（省）的统治者 |
  | 4 | 地方官员 | 诺姆以下的行政官 |
  | 5 | 村长 | 村级行政 |
  | 6 | 农民/劳动者 | 基本生产单位 |

  **有效层级数：5**（法老 → 维齐尔 → 诺姆长 → 地方官 → 村长 → 农民）

  **形式化信息系统：是。** 圣书体文字（hieroglyphics）+ 僧侣体
  （hieratic，用于行政）。广泛的书记官阶层。税收记录、
  土地登记、劳动力征用（金字塔建设）、粮食库存管理。
  书记官是人数众多的专业官僚阶层。

  **判定：5 级 + 发达的形式化信息系统。层级远在天花板以下。**

  ---

  ### 案例 9：商朝中国 (c. 1600-1046 BCE)

  | 层级 | 职位 | 职能 |
  |------|------|------|
  | 1 | 王 | 最高统治者，大祭司 |
  | 2 | 侯/伯（区域领主） | 区域统治者 |
  | 3 | 田（地方官员） | 地方行政官 |
  | 4 | 邑（聚落首领） | 聚落级组织 |
  | 5 | 众（平民） | 基本生产单位 |

  **有效层级数：4**
  **形式化信息系统：部分。** 甲骨文——用于占卜和记录王的活动。
  但甲骨文的使用范围局限于王室祭祀和占卜，不是全面的行政文书系统。
  青铜铭文出现较晚且用于礼仪。行政在很大程度上依赖口头传达
  和贵族间的个人关系。

  **判定：4 级。纯口头的行政在浅层级下运作正常。文字系统
  （甲骨文）未扩展到行政管理——与推论一致：浅层级不需要。**

  ---

  ### 案例 10：夏威夷王国（接触前，至 1778）

  | 层级 | 职位 | 职能 |
  |------|------|------|
  | 1 | Ali'i Nui（大王） | 岛屿或岛屿群的最高酋长 |
  | 2 | Ali'i（高级酋长） | Moku（大区）统治者 |
  | 3 | Konohiki（土地管理人） | Ahupua'a（流域-社区）的管理者 |
  | 4 | Maka'āinana（平民） | 耕种者、渔民 |

  **有效层级数：3-4**
  **形式化信息系统：否。** 纯口头。系谱吟唱者保存酋长血统。
  Kapu（禁忌）体系通过口头传承。

  **判定：3-4 级，极浅层级。不检验天花板。**

  ---

  ### 案例 11：吴哥/高棉帝国 (802-1431)

  | 层级 | 职位 | 职能 |
  |------|------|------|
  | 1 | 提婆罗阇（神王） | 最高统治者 |
  | 2 | 王室家族/高级祭司 | 核心圈 |
  | 3 | 省级总督 | 行省行政 |
  | 4 | 地方官员 | 区级行政 |
  | 5 | 村长 | 村级 |
  | 6 | 农民 | 基本生产单位 |

  **有效层级数：5**
  **形式化信息系统：是。** 梵文和古高棉文的碑铭（steles）。
  寺庙记录：土地赠与、劳动力义务、税收记录。
  但注意：碑铭主要用于宗教/纪念目的，行政记录的具体使用
  不如埃及广泛。行政机关主要通过口头运作，碑铭补充。

  **判定：5 级 + 半形式化信息系统（碑铭）。**

  ---

  ### 案例 12：达荷美王国 (c. 1600-1894)

  | 层级 | 职位 | 职能 |
  |------|------|------|
  | 1 | 国王 | 最高统治者 |
  | 2 | Migan（首相） | 首席行政官 |
  | 3 | 省级酋长 | 行省统治 |
  | 4 | 村长 | 村级 |
  | 5 | 家户 | 基本单位 |

  **有效层级数：4-5**
  **形式化信息系统：否。** 纯口头。达荷美有年度"习俗"仪式
  （xo/tahunu）作为口头普查和问责机制——国王在集会上接收
  各地报告。后期（19 世纪）有有限的阿拉伯文字使用。
  著名的"亚马逊"女兵不是行政系统。

  **判定：4-5 级，在天花板以下。**

  ---

  ### 案例 13：罗马帝国 (早期元首制, 27 BCE-284 CE)

  | 层级 | 职位 | 职能 |
  |------|------|------|
  | 1 | 皇帝 | 最高权威 |
  | 2 | 元老院行省总督/皇帝行省使节 | 行省统治 |
  | 3 | 财务官（Procurator） | 财政管理 |
  | 4 | 城市元老院（Decurions） | 城市治理 |
  | 5 | Magistri（地方长官） | 乡镇 |
  | 6 | 市民/居民 | 基本单位 |

  **有效层级数：5**（皇帝 → 总督 → 财务官 → 城市元老院 → 地方 → 市民）

  **形式化信息系统：是。** 拉丁文行政文书。行省普查（census）。
  税收记录。军事文书（Vindolanda 木牍）。罗马法书面体系。
  帝国邮政（cursus publicus）。

  **关键观察：罗马帝国是浅层级 + 强形式化信息系统的典型。**
  帝国统治地中海世界但行政层级不深——依靠地方自治
  （城市元老院）和标准化法律/税收体系来治理。
  这与 DED-001 的适应模式 (a) 联邦化完全一致。

  **判定：5 级，"罗马和平"依赖浅层级+书面系统+地方自治。**

  ---

  ### 案例 14：松海帝国 (c. 1464-1591)

  | 层级 | 职位 | 职能 |
  |------|------|------|
  | 1 | Askia（皇帝） | 最高统治者 |
  | 2 | 中央部长（财政/司法/海军等） | 职能部长 |
  | 3 | 行省总督 | 行省治理 |
  | 4 | 地方酋长 | 地方行政 |
  | 5 | 村长 | 村级 |
  | 6 | 家庭 | 基本单位 |

  **有效层级数：5**
  **形式化信息系统：部分。** 使用阿拉伯文字。廷巴克图的伊斯兰学者
  阶层提供行政支持。但系统在日常行政中依赖口头传达——
  文字主要用于外交函件、法律裁决和宗教文书。

  **判定：5 级，在天花板以下。**

  ---

  ## 检验结果汇总

  | 案例 | 层级数 | 形式化信息系统 | 天花板检验 |
  |------|--------|---------------|-----------|
  | 印加 | 6 | 是 (quipu) | < 8，不检验 |
  | **布干达** | **7** | **否** | **边界：7 级，恰好触及天花板上限** |
  | 阿散蒂 | 6-7 | 否 | < 8，在范围内 |
  | 祖鲁 | 5-6 | 否 | < 8，在范围内 |
  | 蒙古(早期) | 5 | 否→是 | < 8，不检验 |
  | 加洛林 | 4-5 | 是 | < 8，不检验 |
  | 阿兹特克 | 4 | 是 | < 8，不检验 |
  | 古埃及 | 5 | 是 | < 8，不检验 |
  | 商朝 | 4 | 部分 | < 8，不检验 |
  | 夏威夷 | 3-4 | 否 | < 8，不检验 |
  | 吴哥 | 5 | 是 | < 8，不检验 |
  | 达荷美 | 4-5 | 否 | < 8，不检验 |
  | 罗马 | 5 | 是 | < 8，不检验 |
  | 松海 | 5 | 部分 | < 8，不检验 |

  ## 核心发现

  **14 个前现代国家中没有发现反例。**

  具体而言：
  - 12 个案例层级 < 8 → 推论不做预测
  - 1 个边界案例（布干达，7 级）→ 恰好在天花板边缘
  - 1 个案例（阿散蒂，6-7 级）→ 在预测范围内
  - **0 个案例同时满足"≥8 级层级"且"无形式化信息系统"**

  所有 ≥ 6 级的案例中：
  - 印加（6 级）→ 有 quipu
  - 布干达（7 级）→ 无文字，边界案例
  - 阿散蒂（6-7 级）→ 无文字，在范围内

  没有案例达到 8 级且无形式化信息系统。

  ## 补充观察：负向检验

  **存在一个没有出现在样本中但同样重要的模式：**
  前现代国家中，没有一个达到了 8 级以上的纯口头行政层级链。
  这不是因为"8 级以上的国家不存在"——现代国家和平时期的行政
  层级经常超过 8 级——而是因为：**在文字系统普及之前，
  社会的组织复杂度不足以产生 8 级以上的有效行政层级。**
  口头社会的组织规模天花板（通常对应 5-7 级层级 + 几万到几十万人口）
  和 DED-001 的层级天花板可能反映的是同一个底层约束——
  人类社会规模本身就是信息传递约束的产物。

  ## 局限性

  1. **层级计数的精确性：** 历史案例的层级计数基于现有文献和
     史学共识，但"有效层级"的判定涉及对历史治理实践的推断。
     特别地，远离中心的层级（村级以下）是否"实质性受上级约束"
     在不同案例中有不同解读。

  2. **边界案例的处理：** 布干达的 7 级（含 Bataka 为 8）和阿散蒂的
     6-7 级（取决于是否含 Asantehemaa）对层级计数方式敏感。
     不同的史学传统可能给出不同的层级计数。

  3. **形式化信息系统的定义：** 几个案例（商朝甲骨文、吴哥碑铭、
     蒙古早期口头+后引入文字）处于形式和口头之间的灰色地带。
     本检验采用了相对宽松的"是否存在"标准——
     只要存在任意外部记录系统就被编码为"是"。

  4. **样本量和选择性：** 14 个案例不是随机样本——它们是有充分史学
     记录的前现代国家。没有文字的口头社会在考古记录中留下了
     更少的行政结构证据，因此口头社会在样本中可能被系统性低估。

  ## 结论

  DED-001 的核心预测在 14 个前现代案例的经验检验中存活。
  未发现反例——即未发现层级 ≥ 8 且无形式化信息系统的组织。
  布干达（7 级）是最近的边界案例，但未突破 8 级天花板。

  **对推论置信度的影响：**
  检验前：verified（对抗式审查通过，但证伪条件实践上难触及）
  检验后：verified（经验检验未发现反例，增加了推论的 Bayesian 置信度）

  **下一步：** 扩展检验到更多边界案例——特别是那些层级深度可能被
  史学低估的口头社会（如北美洲的易洛魁联盟、波利尼西亚的
  汤加王国、西非的约鲁巴城邦体系）。

