version: 1
created: 2026-07-13

source_pairs:
  evo_bio__game_theory:
    independence: 0.4
    overlap_domains:
      - "evolutionary game theory (ESS, replicator dynamics)"
      - "cooperation evolution (kin selection ↔ repeated PD)"
      - "signaling theory"
    note: "核心数学结构共享。在合作/信号主题上几乎是一棵树。"

  evo_bio__cultural_universals:
    independence: 0.6
    overlap_domains:
      - "evolutionary psychology (跨文化验证演化假说)"
      - "human behavioral ecology"
    note: "理论框架 vs 田野数据，方法论路径不同。"

  game_theory__cultural_universals:
    independence: 0.5
    overlap_domains:
      - "跨文化行为实验 (ultimatum game, public goods game)"
    note: "gt 提供范式，cu 提供样本。"

default_independence: 0.6

calibration_note: >
  初始估计值。v1 系数在 ±0.2 范围内有启发性意义，
  不宜过度解读小数差异。随验证经验校准。

# === 仪器级相关性折扣 (META-REVIEW-001, 2026-07-13) ===
# 把 L3 的 ICV 教训向上传播进 L2 的 IEA。此前该动力学只在 L3 被 ICV 抓到，
# L2 的 IEA 数字对它视而不见。
instrument_correlation:
  established: 2026-07-13
  established_by: META-REVIEW-001
  problem: >
    上方 source_pairs 的独立性系数(0.4/0.5/0.6)建模的是【学科之间】的理论重叠。
    但在单研究者+单 LLM 执行时，三个"独立"学科的证据是由【同一个仪器】
    (一个 LLM + 其重叠语料)读取和判定的。这个仪器会把统一的语料先验横加到
    三票上，使【有效】独立性低于表中系数。IEA 因此系统性【高估】真实来源多样性。
  precedent: >
    ICV-001(布干达):两个"独立"模型(商汤+智谱)彼此 κ=0.892 地一致、且方向一致地错
    (共享"非洲王国=六层金字塔"教科书图式)。这证明"多个 LLM 一致"可以是【共享语料
    偏见】而非独立确证——同一动力学也侵蚀 L2 的 IEA，只是 L2 此前未把折扣记进数字。
  discount_rule: >
    当 L2 桥接命题的 cross_verification 投票由单一 LLM 执行(非独立人类专家/独立
    文献通道)时，必须【披露】:报告的 IEA 是"学科独立性"上限，"仪器有效独立性"低于此。
    不强制改数字(会引入伪精度)，但强制披露此折扣。
  mitigation: >
    缓解力有限但真实:多重复现的稳固共识命题(如有限理性 BR-L2-001、亲缘利他 BR-L2-002)
    受真实文献收敛支撑，单仪器忧虑被缓解;新颖/争议命题则应把这条折扣视为承重红旗。
    异血统模型面板(scripts/blind_coder.py)或真实独立文献通道可【部分】恢复独立性——
    但按 ICV honest_ceiling，只是从"假墙"升级为"部分的、被测量的墙"，不是变"真"。
  honest_note: >
    发现者:META-REVIEW-001(第一性原理批判的裂缝 B 唯一存活残余)。批判的强形式
    ("整套对抗是幻觉")被驳倒——体系宪法早已写明自审是假墙;但"仪器折扣未传播进
    IEA 数字"这一残余成立，故在此显式披露。


# === 数据源同根折扣 (CNBS 工具实证, 2026-07-16) ===
# 实证发现:WB 和 IMF 的中国 GDP 数据底层输入来自中国国家账户——
# 三源(CNBS/WB/IMF)高度一致(Δ<0.04pp)是"同源多次发布"而非"多源独立验证"。
# 此折扣修正了对经济指标做 IEA 计算时系统性高估来源独立性的盲区。
data_source_origin:
  established: 2026-07-16
  established_by: "CNBS 工具实证 (iter-002/cnbs-empirical-memo.md)"
  problem: >
    上方 source_pairs 的独立性系数建模的是【学科之间】的理论重叠,
    instrument_correlation 建模的是【单一 LLM 仪器】的语料重叠。
    但第三种重叠未被建模:不同的数据发布机构(WB/IMF/OECD 等国际组织)
    发布的中国宏观经济指标,底层输入往往来自同一套国家统计账户
    (中国国家统计局发布的国家账户数据)。这些机构之间的"独立系数"
    在数据源层面接近零——它们是同一测量的多次发布,而非独立验证。
    不加此折扣,IEA 会把"三个机构说同一件事"误计为"三个独立来源
    确认同一件事",系统性高估经济指标的来源独立性。
  discount_rule: >
    在对任何宏观经济指标进行 IEA 计权时,必须区分两层独立性:
    (1)【学科/方法论独立性】——不同学科用不同方法研究同一问题
    (现有 source_pairs 已覆盖);
    (2)【数据源独立性】——不同机构发布的数据是否来自同一底层测量链。
    若机构 B 和机构 C 的数据均以机构 A 的发布值为底层输入
    (如 WB/IMF 均引用中国国家统计局 GDP),则 B 与 C 之间、
    B 与 A 之间、C 与 A 之间的数据源独立系数 ≤0.1。
    真正独立的验证需要底层测量链分叉——如卫星遥感、物理量指标
    (用电量/货运量)、税务发票等异源数据。
    此折扣不降低已评审通过的 bridge 的 IEA 评分(不回溯翻案),
    但未来新 bridge 和新 cross_verification 必须应用此折扣。
  registered_pairs:
    - pair: [CNBS, World_Bank, IMF]
      shared_root: "中国国家统计局发布的国家账户数据(GDP/增速/产业构成等)"
      data_independence: 0.1
      note: "三源对 GDP 增速的一致性是同源发布的一致性,不是独立验证。增速数据经全国汇总+多层审核后发布——核查成本低、失真被压缩——这本身是 DED-031 预测(iii)的支持证据。"
      domain: [GDP, GDP_GROWTH, GDP_PER_CAPITA, 及其产业/支出法分项]
    - pair: [卫星遥感, CNBS]
      data_independence: 0.8
      note: "物理测量 vs 统计上报,测量链完全分叉。卫星反演的气溶胶/灯光/植被指数不经过任何统计上报环节。"
    - pair: [用电量/货运量, CNBS]
      data_independence: 0.5
      note: "物理量指标但存在工业结构/运输结构导致的口径偏差(如高耗电产业占比变化会改变用电-GDP 弹性),非完美独立但远强于同源机构间。"
  honest_note: >
    数据源同根折扣是 CNBS 工具实证(2026-07-16)的核心教训——
    "多源"不等于"独立"。同一份底层数据被不同机构 repackage 后发布,
    不能算作独立验证。该教训对 L2 IEA 框架的完整性至关重要:
    在此之前,体系只打折学科重叠和单仪器重叠,对一个更基本的重叠——
    数据源重叠——视而不见。
